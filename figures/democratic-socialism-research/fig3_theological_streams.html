<svg viewBox="0 0 700 300" role="img" aria-label="A network-flow diagram showing three independent theological traditions flowing into democratic socialism. From left: the Prophetic tradition (Winstanley, Rauschenbusch, Barber), the Incarnational-Sacramental tradition (Maurice, Temple, Tawney), and the Eschatological tradition (Tillich, Niebuhr, Blumenberg). These converge at a central node and produce three democratic socialist outputs on the right: moral urgency, the welfare state mandate, and institutional realism.">

<text x="88" y="160" text-anchor="middle" font-size="7.5" class="t-muted">F. D. Maurice (1848)</text>
<text x="88" y="171" text-anchor="middle" font-size="7.5" class="t-muted">Temple (1942)</text>
<text x="88" y="182" text-anchor="middle" font-size="7.5" class="t-muted">Tawney (1926)</text>
<rect x="8" y="198" width="160" height="72" rx="2" class="f-t3" opacity="0.12"/>

<text x="546" y="60" text-anchor="middle" font-size="9" font-weight="bold" class="t-t1" style="fill:var(--t1)">Moral Urgency</text>
<text x="546" y="74" text-anchor="middle" font-size="7.5" class="t-muted">The &#8220;unconditional demand&#8221; (Tillich) for justice</text>
<text x="546" y="85" text-anchor="middle" font-size="7.5" class="t-muted">that sustains commitment across defeat</text>
<rect x="400" y="120" width="292" height="60" rx="2" class="f-t2" opacity="0.08"/>
<text x="546" y="138" text-anchor="middle" font-size="9" font-weight="bold" class="t-t2" style="fill:var(--t2)">The Welfare State Mandate</text>
<text x="546" y="152" text-anchor="middle" font-size="7.5" class="t-muted">Temple&#8217;s six social propositions &#8594; Beveridge</text>
<text x="546" y="163" text-anchor="middle" font-size="7.5" class="t-muted">&#8594; Attlee&#8217;s NHS and nationalisations</text>
<rect x="400" y="198" width="292" height="60" rx="2" class="f-t3" opacity="0.10"/>
<text x="546" y="216" text-anchor="middle" font-size="9" font-weight="bold" class="t-t3" style="fill:var(--t3)">Institutional Realism</text>
<text x="546" y="230" text-anchor="middle" font-size="7.5" class="t-muted">Niebuhr&#8217;s original sin as the ground of</text>
<text x="546" y="241" text-anchor="middle" font-size="7.5" class="t-muted">democratic checks on socialist perfectibilism</text>
<text x="350" y="282" text-anchor="middle" font-size="7.5" class="t-muted" font-style="italic">Three traditions arrived independently at overlapping conclusions &#8212; the convergence is not coordination but structural necessity.</text>
</svg>
<figcaption><strong>Fig. 3.</strong> Three independent theological traditions each supply something democratic socialism&#8217;s secular formulations struggle to replace: the prophetic tradition supplies <em>moral urgency</em> that outlasts institutional defeat; the incarnational-sacramental tradition supplies the <em>welfare-state mandate</em> grounded in human dignity; the eschatological tradition supplies the <em>institutional realism</em> (Niebuhr&#8217;s original sin) that prevents perfectibilist overreach.</figcaption>
</figure>
