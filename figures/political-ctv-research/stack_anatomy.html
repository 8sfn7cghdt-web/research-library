<figcaption><strong>Fig. 1.</strong> The stack is real but the precision is oversold: a public voter record passes through a probabilistic match (50–90%) and a modeled audience (~67% party-accurate) before it ever reaches the glass, so what looks like "voter-level" targeting resolves, honestly, to household-level addressability with measurement graded by the firms selling the inventory.</figcaption>
