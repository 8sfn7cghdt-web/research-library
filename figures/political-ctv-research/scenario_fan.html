<svg viewBox="0 0 700 430" role="img" aria-label="Fan-forecast of connected-TV's share of total United States political advertising spend through the 2028 cycle. A single anchor point at 2024 sits at about 21 percent of total cycle spend. Five probability-weighted bands diverge rightward to 2028. The modal On-Curve Continuation band, weighted 34 to 44 percent, is the fattest and climbs to the mid-to-high 20s percent. The Constrained Plateau band, weighted 18 to 26 percent, runs flat in the low-to-mid 20s. The Inventory Unlock or Re-Acceleration band, weighted 13 to 19 percent, rises highest to the low 30s. The Regulatory or Platform Break band, weighted 13 to 19 percent, bends the path. The Effectiveness or Credibility Deflation band, weighted 7 to 12 percent, sags to the low teens. A faint vertical axis runs from about 15 to 35 percent. All five scenarios agree dollars rise and the federal gap stays open; they disagree only on the slope of share.">
