<figcaption><strong>Fig. 2.</strong> The Revolution is a ratchet &#8212; money, the army, the king&#8217;s trust, war, regicide, civil war, then the Great Terror, each step locking in the last &#8212; and Thermidor is the one drop, after which Vend&#233;miaire (1795) installs a regime built to stop it; on a true calendar the steps crowd into the last five years, which is why 109 of Carlyle&#8217;s 159 chapters live there.</figcaption>
