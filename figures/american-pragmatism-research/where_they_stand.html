<text x="510" y="152" text-anchor="middle" font-size="8" class="t-muted" style="font-style:italic">no mirror — where contemporary pragmatism lives</text>

<text x="350" y="477" text-anchor="middle" font-size="8" class="t-muted">The Davidson case is decisive: anti-representationalism does not entail truth-deflationism &#8212; which is why Davidson sides with Peirce against Rorty.</text>

<figcaption><strong>Fig. 3.</strong> Contemporary pragmatism is a debate internal to the anti-representationalist quadrant: all major figures reject the mirror-of-nature picture, but only Rorty dissolves truth into solidarity &#8212; Davidson&#8217;s insistence that truth is primitive and irreducible is the clearest demonstration that anti-representationalism does not require truth-deflationism.</figcaption>
</figure>
