<text x="350" y="298" text-anchor="middle" font-size="8" class="t-muted">The 27-year eclipse (positivism&#8217;s ascendancy) is the tradition&#8217;s only serious existential pause; all three prior revivals began from institutional survival, not reinvention.</text>

<figcaption><strong>Fig. 2.</strong> A 27-year eclipse (1952&#8211;1979) interrupts pragmatism&#8217;s arc but does not end it &#8212; Rorty&#8217;s revival initiates the period the tradition is still in, with the Peircean rehabilitation (Brandom 1994, Misak 2013) now contesting whether Rorty rescued the right philosophy.</figcaption>
