<figcaption><strong>Fig. 1.</strong> Peirce&#8217;s 1878 maxim forked immediately &#8212; Peirce&#8217;s own convergence theory versus James&#8217;s cash-value inflection &#8212; and the split has widened into the defining fault line of contemporary pragmatism between the New Pragmatist rehabilitation and the Rortyan dissolution.</figcaption>
