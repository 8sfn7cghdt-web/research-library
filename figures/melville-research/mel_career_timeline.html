<figcaption><strong>Fig. 2.</strong> The providence argument is not a slow loss of faith but a method, and nearly all of Melville&#8217;s direct testimony falls inside three years. The early books already mock those who speak for Providence; <em>Mardi</em>, <em>Pierre</em> and <em>The Confidence-Man</em> offer a consolation, test an absolute and dissolve the grounds; and after 1866 the question moves into verse, with <em>Clarel</em> (1876) and an unfinished <em>Billy Budd</em> left at his death in 1891. The enlarged panel shows the letters and the essay crowded around <em>Moby-Dick</em>, then silence.</figcaption>
</figure>
