<figcaption><strong>Fig. 4.</strong> The six readings of Melville&#8217;s providence disagree less about what he believed than about which evidence to trust. The ironist and the nihilist stand on the narrator&#8217;s voice, the believer, agnostic and mystic on the career, the quarreling theist on a hidden pattern, and the agnostic alone leans equally on the letters. Because the warrants overlap, an ironist and an agnostic can read the same Hawthorne passage and reach different verdicts.</figcaption>
