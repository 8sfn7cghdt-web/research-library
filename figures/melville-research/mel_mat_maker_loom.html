<figcaption><strong>Fig. 3.</strong> Ishmael&#8217;s weave puts the last word with neither God nor the will but with the unintended: the sword of chance drives home &#8220;the last featuring blow.&#8221; The loom has no operator in chapter 47, an endless circle in &#8220;The Gilder,&#8221; and an indifferent God in &#8220;The Castaway,&#8221; and the Epilogue folds <em>chance</em> and <em>fate</em> into one clause. The book supplies a model of how necessity, will and accident coexist and then withholds the weaver.</figcaption>
</figure>
