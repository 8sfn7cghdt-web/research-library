<figcaption><strong>Fig. 1.</strong> Melville&#8217;s inheritance of providence is a short shelf of documented things and a long wall of parallels. The first tablet holds what he named, bought, attended or wrote; the last holds the great theologians of providence, with no evidence that he read, quoted or owned them. A critic who says a passage &#8220;is&#8221; Calvinist, Leibnizian or Emersonian should be tested against this grade, and only the Calvinist reading sits high on it.</figcaption>
