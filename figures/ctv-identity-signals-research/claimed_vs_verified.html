  <figcaption><strong>Fig. 2.</strong> Read down the cobalt column and the corpus's recurring fracture appears as one shape: IP resolves the right household just 13% of the time and the right email 16%, the iOS ad ID survives ATT in only 14&#8211;25% of cases against its old near-100% ubiquity, and Amazon's 90% authenticated-reach figure carries 0% independent audit &#8212; every headline CTV identity signal claims far more than it can be shown to resolve.</figcaption>
