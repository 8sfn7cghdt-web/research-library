<figcaption><strong>Fig. 5.</strong> The walled gardens hold the best identity — Amazon's self-reported ~90% household reach, the ~80M-household Amazon–Roku tie, an AFAI signal kept off the open market — while the open ecosystem (UID2, RampID, ID5) holds the most inventory, near-universal publisher commitments capped by a FAST authentication ceiling of 125M+ unauthenticated monthly viewers; the tall-narrow versus short-wide geometry shows that through 2029 neither pole can occupy the high-quality, high-reach corner, which is why the stack stays plural (LiveRamp's absorption into Publicis only consolidating one side of it).</figcaption>
