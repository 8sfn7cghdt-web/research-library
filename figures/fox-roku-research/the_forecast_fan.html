<figcaption><strong>Fig. 4.</strong> The modal outcome is not &#8220;blocked&#8221; or &#8220;triumph&#8221; but <em>clears-and-grinds</em> &#8212; the deal closes with behavioural remedies, somewhat late, bottlenecked abroad rather than in Washington. The two tails that matter are regulatory drag (&#126;25%) and a value-destroying break (&#126;8%); a rival topping bid barely registers.</figcaption>
