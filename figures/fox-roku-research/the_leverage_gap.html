<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 360" role="img" aria-label="A horizontal bar chart of Fox's net leverage on a zero-to-four-times axis. Fox today sits at 0.36 times net (1.83 times gross), rated Baa2 by Moody's and BBB stable by S&P. The company's stated pro forma figure is 2.8 times, but that includes a 50 percent synergy credit and forward EBITDA. Reconstructed on trailing EBITDA with full synergies the deal is about 3.3 times, and on trailing EBITDA with no synergy credit about 3.6 times. An amber band marks the gap between the 2.8 times headline and the 3.3-to-3.6 times reality. A note records that Fox's 4.709 percent notes due 2029 trade near par even as the stock fell 15 to 18 percent, and that Moody's said the deal will significantly weaken credit metrics.">
<text x="40" y="28" font-size="15.5" font-weight="bold" style="fill:var(--text)">The leverage gap: a 2.8x headline, a 3.3&#8211;3.6x reality</text>
<text x="40" y="46" font-size="10" class="t-muted">net debt / EBITDA &#183; the gap is the EBITDA denominator (forward + full synergy), not the borrowing</text>
<rect x="476" y="74" width="116" height="192" class="f-t3" opacity=".14"/>
<text x="534" y="86" text-anchor="middle" font-size="8" font-weight="bold" style="fill:var(--t3)">THE GAP</text>
<text x="70" y="104" font-size="9.5" font-weight="bold" style="fill:var(--text)">Fox today</text>
<rect x="70" y="108" width="52" height="26" rx="4" class="f-t4" opacity=".88"/>
<text x="130" y="125" class="t-mono" font-size="11" font-weight="bold" style="fill:var(--t4)">0.36x net</text>

<text x="70" y="152" font-size="9.5" font-weight="bold" style="fill:var(--text)">Pro forma &#8212; company stated</text>

<text x="582" y="269" text-anchor="end" class="t-inv" font-size="12" font-weight="bold">&#126;3.6x</text>

<figcaption><strong>Fig. 3.</strong> Fox&#8217;s headline &#8220;&#126;2.8x&#8221; is a <em>forward</em>, full-synergy, at-close number; rebuild it on trailing EBITDA and the deal lands at &#126;3.3&#8211;3.6x. The numerator (debt) is fixed &#8212; the gap lives entirely in the denominator, which is why Moody&#8217;s called the deal credit-&#8220;weakening&#8221; even as the bonds sat still.</figcaption>
