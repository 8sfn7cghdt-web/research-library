<figcaption><strong>The shares Fox sold to buy Tubi.</strong> In 2020 Fox cashed out its ~6 million Roku shares at $58 to help fund its $440M purchase of Tubi. Six years later it agreed to buy <em>all</em> of Roku at $160 a share — about $22 billion. The stake it sold to place a smaller bet became the prize it came back for.</figcaption>
