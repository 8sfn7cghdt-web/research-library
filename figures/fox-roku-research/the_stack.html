<figcaption><strong>Fig. 1.</strong> The deal is a stack, not a network: Fox buys the four owned layers &#8212; content, the home screen, the identity graph, and the supply/exchange &#8212; that sit under roughly half of US connected-TV viewing. But the layer day-one coverage called an &#8220;owned DSP&#8221; (OneView) is being sunset, and measurement was never Roku&#8217;s to own, so the &#8220;closed loop&#8221; is open at both ends.</figcaption>
