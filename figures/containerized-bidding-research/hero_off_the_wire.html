<svg viewBox="0 0 700 486" role="img" aria-label="A before-and-after anatomy of where the buyer's bidder runs. On the left, the traditional path: the buyer's DSP bidder sits in a remote public cloud, and every bid request round-trips over the public internet to the exchange's auction and back. A hard time budget of 80 to 120 milliseconds is almost entirely consumed by network transit, leaving only about 5 milliseconds for the buyer's model to think; cloud egress is billed at roughly nine cents a gigabyte, and a queries-per-second ceiling forces the DSP to evaluate only 20 to 30 percent of the bidstream and throttle the rest — what Index Exchange's CEO calls the cloud tax. On the right, the containerized path: the buyer ships a sealed OCI container holding its model, which is lifted off the internet and set down on the exchange's own racks, running beside the auction inside the data center. The wire is deleted. A decision returns in under 5 milliseconds, egress on the auction round-trip falls to near zero, the throttle disappears, and the buyer evaluates every single impression.">

<figcaption><strong>Fig. 1.</strong> The whole corpus turns on one move: lifting the buyer&#8217;s sealed bidder off the public internet and setting it down on the exchange&#8217;s own racks. <em>Over the wire, an 80&#8211;120&#8202;ms budget is spent almost entirely on transit &#8212; leaving ~5&#8202;ms to think &#8212; while cloud egress (~$0.09/GB) and a QPS ceiling let the DSP evaluate only 20&#8211;30% of the bidstream, the &#8220;cloud tax.&#8221; Co-located in a sealed OCI container beside the auction, the decision returns in under 5&#8202;ms, egress falls to near zero, and the throttle disappears &#8212; so the buyer sees every impression.</em></figcaption>
