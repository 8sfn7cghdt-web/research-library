<figcaption><strong>Fig. 4.</strong> The tenants who agree to sit inside a seller&#8217;s fabric are independent decisioning and enrichment vendors &#8212; Bedrock, Chalice, Cognitiv, MiQ, Gracenote &#8212; not the incumbent demand-side platforms. <em>The Trade Desk, Yahoo, DV360, and Amazon build agentic capability of their own but pointedly decline to co-locate; Amazon even donated its Dynamic Traffic Engine to the IAB and kept its RTB fabric a managed network rather than an in-exchange tenancy. That refusal by the largest buyers is the single sharpest revealed-preference fact constraining the margin-relocation thesis.</em></figcaption>
