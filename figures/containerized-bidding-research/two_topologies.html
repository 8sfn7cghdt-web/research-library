<svg viewBox="0 0 700 470" role="img" aria-label="A forking network-flow diagram showing two competing ad-tech standards that start from the same point but clear the trade two different ways. On the left a single shared node reads: a buyer wants an impression. The flow forks into two rows. The top row, ARTF, keeps the auction in the middle: the chain runs Advertiser slash IO to a DSP-or-buyer-agent container running inside the exchange, into the impression auction as the clearing point, then to the SSP, then to the publisher. ARTF extends OpenRTB, expressing agentic actions as OpenRTB Patch deltas, so the bidstream and the DSP-to-SSP-to-exchange chain stay central; it is backed by IAB Tech Lab, Index Exchange, Chalice, with The Trade Desk as a contributor. The bottom row, AdCP, routes around the auction: a buyer agent and a seller agent negotiate directly over MCP and A2A, with no auction node between them, and the relocated margin flows toward publishers and orchestrating agents; it is a clean-slate protocol launched October 2025, led by a Scope3 coalition including Optable, PubMatic, Swivel, Triton, and Yahoo, and notably excludes the big demand incumbents The Trade Desk, DV360, and Amazon DSP. The diagram makes plain that the two standards differ not in speed but in topology: a fight over who sits in the middle of the next decade of ad buying.">

<figcaption><strong>Fig. 3.</strong> The two standards share a starting point &#8212; a buyer wants an impression &#8212; and then disagree about where the trade should clear. <em>ARTF (top) keeps the auction and its intermediaries in the middle, extending OpenRTB so the bidstream and the DSP&#8594;SSP&#8594;exchange chain stay central; containerized bidding is a native citizen of this world. AdCP (bottom) is a clean-slate route-around: a buyer agent and a seller agent negotiate directly over MCP/A2A, deleting the impression auction and relocating margin toward publishers &#8212; and its coalition pointedly excludes the big demand incumbents. The fault line is not latency but topology: who sits in the middle of the next decade of ad buying, and whether the auction survives there at all.</em></figcaption>
