<svg viewBox="0 0 700 560" role="img" aria-label="An anatomy of how containerization unbundles the demand-side platform and relocates its margin. On the left, the historical DSP bundle is drawn as three stacked layers in a single sealed case: the bidder — the decisioning model plus the compute that runs it — is the bottom layer and the moat that justified the take-rate; above it sits supply access, the integrations into the exchanges; and on top sits the commercial relationship with agencies and advertisers. A curved arrow lifts the bidder layer out of the bundle as a portable sealed container and sets it down inside the seller's rack. Three consequences follow: supply access migrates to the SSP because the SSP is the supply; the bidder becomes a substitutable container slot; and the commercial relationship is up for grabs. On the right, a before-and-after stacked bar of the advertiser dollar. Before, the publisher receives about forty-seven percent, the DSP take is about sixteen percent, the SSP take is roughly thirteen to twenty percent, and the rest is other intermediary fees. After containerization, the DSP slice shrinks under pressure, a new explicit buy-side-intelligence line appears, and the SSP gains a new compute-hosting line on top of its existing take, while the publisher stays flat to slightly better near forty-seven percent. The margin does not vanish — it relocates. But a closing twist notes that the same deploy-once portability that drives adoption also commoditizes the hosting rent, so the relocated margin is most likely competed toward zero rather than captured into a new seat.">

<figcaption><strong>Fig. 5.</strong> Containerization unbundles the DSP by pulling out its one defensible asset &#8212; the bidder &#8212; and the margin it frees relocates rather than vanishes. <em>Supply access migrates to the SSP (which is the supply), the bidder becomes a substitutable container slot, and the commercial tie is up for grabs; on the dollar, the DSP take (~16%; TTD ~20%) compresses while the SSP adds a compute-hosting line and a new buy-side-intelligence line appears, the publisher (~47%) flat-to-better. But because the container is portable by the same deploy-once mechanism that drives adoption, that relocated rent is more likely competed to zero than captured into a new seat &#8212; the auction moved; the margin map mostly didn&#8217;t.</em></figcaption>
