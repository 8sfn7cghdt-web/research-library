<figcaption><strong>Fig. 2.</strong> Under IAB Tech Lab&#8217;s ARTF v1.0 the buyer&#8217;s bidder is a <em>sandbox, not open compute</em>: a signed OCI image &#8212; model, inference code, bid-shaping rules &#8212; runs on the exchange&#8217;s metal with all ingress and egress blocked except a single gRPC channel, invoked per bid opportunity and returning an OpenRTB-Patch of mutations. <em>It may read host-held signals (site quality, ad ratios, video settings, refresh rate, context) but cannot freely bring in its own first-party / buy-side data &#8212; Aqfer&#8217;s CTO calls the pilots &#8220;Snowpark, not Docker.&#8221; With no hardware TEE in v1.0, host-opacity rests on signing plus the egress lockdown: a policy promise, not a cryptographic guarantee. The same seal that protects both sides also caps the richer-signal promise &#8212; most live deployments are model-only sandboxes.</em></figcaption>
