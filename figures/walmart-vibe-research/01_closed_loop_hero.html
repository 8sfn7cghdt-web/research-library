<text x="350" y="520" text-anchor="middle" class="t-muted" style="font-size:10.5px;font-style:italic">Own the data, the screen, and the front door, and a single retailer runs the whole circuit &#8212; the disintermediation thesis.</text>

<figcaption><strong>Fig. 1.</strong> Walmart did not buy Vibe to enter connected TV &#8212; it had the data and the screen already. It bought the one layer that lets a $50-a-day advertiser <em>in</em>, closing a loop from a streaming-TV impression to a measured store sale that neither retail media nor CTV could close alone.</figcaption>
