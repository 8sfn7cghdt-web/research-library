<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 470" role="img" aria-label="Two stacked horizontal value-chains comparing where a dollar of ad spend goes. In the open programmatic chain, a brand's dollar passes through an agency and DSP, then an SSP or exchange, before reaching the publisher; transaction fees skim about twenty-four percent (shown in red), leaving roughly seventy-six cents for the publisher (shown in green). In Walmart's collapsed chain on VIZIO-owned inventory, the brand's dollar flows through Walmart's combined data, DSP, and Connect Select layer straight to the Walmart-owned VIZIO screen, where Walmart is itself the publisher; the seventy-six cents that would have leaked to a third-party publisher stays in-house, captured in gold and blue. A footnote notes the play only works on the owned slice; elsewhere Walmart remains a toll-paying buyer.">

<figcaption><strong>Fig. 4.</strong> In the open programmatic chain each hop skims its cut, so barely three-quarters of a brand&#8217;s dollar ever reaches the publisher; by owning the OS, the data, and the front door, Walmart collapses the chain and keeps the spread &#8212; but only on its own VIZIO inventory, where it is the publisher. Everywhere else it remains a buyer paying the same tolls.</figcaption>
