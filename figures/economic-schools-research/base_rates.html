<figcaption><strong>Fig. 2.</strong> The forecast's anchors are counts, not intuitions — but the two zeroes do the most work and carry the most risk. No inflation-targeting regime has been abandoned and no reserve-currency issuer has faced a funding crisis since 1945, which is a record of a long peace rather than a law of nature; treating either as impossible is how a forecaster gets surprised.</figcaption>
