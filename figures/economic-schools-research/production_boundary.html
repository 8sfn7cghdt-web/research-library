<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 360" role="img" aria-label="A diagram of the national-accounts production boundary. Inside the boundary: paid work, and an imputed rent for owner-occupied housing that no cash ever changes hands for. Outside: unpaid care and household work, estimated by the International Labour Organization at 16.4 billion hours every day, roughly nine percent of global GDP, and the depletion of natural capital, counted as income rather than as a drawdown.">
<text x="350" y="26" text-anchor="middle" font-size="13" letter-spacing="2.5">THE PRODUCTION BOUNDARY</text>
<text x="350" y="44" text-anchor="middle" font-size="10.5" class="t-muted" font-style="italic">what the accounts count, and what they decide not to</text>
<rect x="40" y="70" width="290" height="220" rx="2" class="f-panel" style="stroke:var(--border)" stroke-width="1.5"/>
<text x="185" y="94" text-anchor="middle" font-size="11" font-weight="bold">INSIDE — counted as output</text>
<rect x="62" y="110" width="246" height="34" rx="2" class="f-t1" opacity=".9"/>
<text x="185" y="132" text-anchor="middle" font-size="11" class="t-inv">All paid work and market output</text>
<rect x="62" y="156" width="246" height="46" rx="2" class="f-t3" opacity=".9"/>
<text x="185" y="175" text-anchor="middle" font-size="10.5" class="t-inv">Imputed rent on owner-occupied</text>
<text x="185" y="190" text-anchor="middle" font-size="10.5" class="t-inv">housing — no cash changes hands</text>
<text x="185" y="228" text-anchor="middle" font-size="9.5" class="t-muted">An imputation the accounts chose</text>
<text x="185" y="242" text-anchor="middle" font-size="9.5" class="t-muted">to make. It could be measured,</text>
<text x="185" y="256" text-anchor="middle" font-size="9.5" class="t-muted">so it was.</text>
<line x1="350" y1="70" x2="350" y2="300" class="s-t2" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="350" y="316" text-anchor="middle" font-size="9.5" class="t-acc" font-weight="bold">the boundary is a rule, not a fact</text>
<rect x="370" y="70" width="290" height="220" rx="2" fill="none" style="stroke:var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="515" y="94" text-anchor="middle" font-size="11" font-weight="bold">OUTSIDE — not counted</text>
<rect x="392" y="110" width="246" height="52" rx="2" fill="none" class="s-t4" stroke-width="2"/>
<text x="515" y="130" text-anchor="middle" font-size="10.5">Unpaid care and household work</text>
<text x="515" y="148" text-anchor="middle" font-size="12" font-weight="bold" class="t-acc">16.4bn hours a day · ~9% of GDP</text>
<rect x="392" y="174" width="246" height="52" rx="2" fill="none" class="s-t5" stroke-width="2"/>
<text x="515" y="194" text-anchor="middle" font-size="10.5">Depletion of natural capital</text>
<text x="515" y="212" text-anchor="middle" font-size="10.5" class="t-acc" font-weight="bold">counted as income, not drawdown</text>
<text x="515" y="242" text-anchor="middle" font-size="9.5" class="t-muted">Equally measurable. Not measured.</text>
<text x="515" y="256" text-anchor="middle" font-size="9.5" class="t-muted">That asymmetry is the argument.</text>
<text x="350" y="344" text-anchor="middle" font-size="10" class="t-muted" font-style="italic">Both traditions attack the same line from opposite sides.</text>
</svg>
<figcaption><strong>Fig. 3.</strong> The standard defence of the production boundary is that unpaid work cannot be measured — but the accounts already impute a rent for owner-occupied housing, where no cash changes hands either. Once one imputation is made and the other refused, the boundary stands revealed as a decision about what is worth counting, which is exactly what the feminist and ecological traditions dispute.</figcaption>
</figure>
