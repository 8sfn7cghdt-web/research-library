<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 330" role="img" aria-label="Public choice theory's diagnostic claims against its prescriptive record. On the diagnosis side: rational ignorance, the collective-action asymmetry, budget-maximizing bureaus, rent-seeking and regulatory capture all held up and entered general use. On the prescription side: Gramm-Rudman-Hollings was amended, partly struck down and abandoned; later statutory sequesters were suspended; and activity migrated to tax expenditures, off-budget vehicles and regulation.">
<text x="350" y="26" text-anchor="middle" font-size="13" letter-spacing="2.5">DIAGNOSIS AND PRESCRIPTION</text>
<text x="350" y="44" text-anchor="middle" font-size="10.5" class="t-muted" font-style="italic">a school whose analysis outperformed its remedy</text>
<rect x="34" y="66" width="300" height="212" rx="2" class="f-panel" style="stroke:var(--border)" stroke-width="1.5"/>
<text x="184" y="90" text-anchor="middle" font-size="11" font-weight="bold" class="t-acc">THE DIAGNOSIS — held</text>
<circle cx="60" cy="114" r="4" class="f-t4"/>
<text x="74" y="118" font-size="10">Rational ignorance of voters</text>
<circle cx="60" cy="142" r="4" class="f-t4"/>
<text x="74" y="146" font-size="10">Small concentrated groups beat</text>
<text x="74" y="159" font-size="10">large diffuse ones</text>
<circle cx="60" cy="184" r="4" class="f-t4"/>
<text x="74" y="188" font-size="10">Budget-maximizing bureaus</text>
<circle cx="60" cy="212" r="4" class="f-t4"/>
<text x="74" y="216" font-size="10">Rent-seeking and capture</text>
<text x="184" y="252" text-anchor="middle" font-size="9.5" class="t-muted" font-style="italic">Now common property across</text>
<text x="184" y="265" text-anchor="middle" font-size="9.5" class="t-muted" font-style="italic">economics, left and right alike.</text>
<rect x="366" y="66" width="300" height="212" rx="2" fill="none" style="stroke:var(--border)" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="516" y="90" text-anchor="middle" font-size="11" font-weight="bold" class="t-acc">THE PRESCRIPTION — did not</text>
<text x="392" y="118" font-size="10">Gramm-Rudman-Hollings</text>
<text x="392" y="131" font-size="9" class="t-muted">amended, partly struck down, abandoned</text>
<line x1="386" y1="112" x2="386" y2="136" class="s-t2" stroke-width="2.5"/>
<text x="392" y="160" font-size="10">Later statutory sequesters</text>
<text x="392" y="173" font-size="9" class="t-muted">suspended when they bound</text>
<line x1="386" y1="154" x2="386" y2="178" class="s-t2" stroke-width="2.5"/>
<text x="392" y="202" font-size="10">Spending itself</text>
<text x="392" y="215" font-size="9" class="t-muted">migrated to tax expenditures,</text>
<text x="392" y="228" font-size="9" class="t-muted">off-budget vehicles, regulation</text>
<line x1="386" y1="196" x2="386" y2="233" class="s-t2" stroke-width="2.5"/>
<text x="516" y="258" text-anchor="middle" font-size="9.5" class="t-muted" font-style="italic">Rules written for self-interested actors</text>
<text x="516" y="271" text-anchor="middle" font-size="9.5" class="t-muted" font-style="italic">were arbitraged by self-interested actors.</text>
<text x="350" y="304" text-anchor="middle" font-size="10" class="t-muted" font-style="italic">The theory's own logic predicts this outcome. It did not exempt the rule-writers.</text>
</svg>
<figcaption><strong>Fig. 5.</strong> Public choice insisted on one behavioural model for markets and government alike, and its diagnostic half was vindicated so thoroughly that its terms are now used by people who reject the school entirely. The prescriptive half failed on its own premises: constitutional rules aimed at self-interested actors were amended, suspended, or routed around by those same actors, because nothing in the theory ever explained why rule-writers would be the exception.</figcaption>
</figure>
