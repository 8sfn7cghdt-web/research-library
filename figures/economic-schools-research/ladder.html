<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 350" role="img" aria-label="List's prescribed developmental sequence against what industrial policy usually does in practice. The prescribed sequence runs protect, build capacity, expose to competition, then withdraw protection. In practice the fourth step is rarely reached: protection acquires a constituency and persists. East Asian cases reached the exit; Latin American import substitution did not.">
<text x="350" y="26" text-anchor="middle" font-size="13" letter-spacing="2.5">THE LADDER, AND THE MISSING RUNG</text>
<text x="350" y="44" text-anchor="middle" font-size="10.5" class="t-muted" font-style="italic">List's sequence depends entirely on a step almost nobody takes</text>
<text x="40" y="82" font-size="10.5" font-weight="bold" class="t-acc">PRESCRIBED</text>
<rect x="40" y="94" width="132" height="52" rx="2" class="f-t4" opacity=".9"/>
<text x="106" y="118" text-anchor="middle" font-size="10.5" class="t-inv" font-weight="bold">1 · Protect</text>
<text x="106" y="134" text-anchor="middle" font-size="9" class="t-inv">tariff the infant industry</text>
<path d="M176,120 L196,120" class="s-t4" stroke-width="2"/>
<polygon points="192,115 204,120 192,125" class="f-t4"/>
<rect x="208" y="94" width="132" height="52" rx="2" class="f-t4" opacity=".9"/>
<text x="274" y="118" text-anchor="middle" font-size="10.5" class="t-inv" font-weight="bold">2 · Build</text>
<text x="274" y="134" text-anchor="middle" font-size="9" class="t-inv">productive powers</text>
<path d="M344,120 L364,120" class="s-t4" stroke-width="2"/>
<polygon points="360,115 372,120 360,125" class="f-t4"/>
<rect x="376" y="94" width="132" height="52" rx="2" class="f-t4" opacity=".9"/>
<text x="442" y="118" text-anchor="middle" font-size="10.5" class="t-inv" font-weight="bold">3 · Expose</text>
<text x="442" y="134" text-anchor="middle" font-size="9" class="t-inv">meet real competition</text>
<path d="M512,120 L532,120" class="s-t2" stroke-width="2" stroke-dasharray="4 3"/>
<polygon points="528,115 540,120 528,125" class="f-t2"/>
<rect x="544" y="94" width="132" height="52" rx="2" fill="none" class="s-t2" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="610" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" class="t-acc">4 · Withdraw</text>
<text x="610" y="134" text-anchor="middle" font-size="9" class="t-acc">let protection lapse</text>
<text x="610" y="164" text-anchor="middle" font-size="9" class="t-muted" font-style="italic">the rung that decides</text>
<text x="610" y="176" text-anchor="middle" font-size="9" class="t-muted" font-style="italic">whether it was a ladder</text>
<line x1="40" y1="200" x2="660" y2="200" class="ln" stroke-width="1"/>
<text x="40" y="228" font-size="10.5" font-weight="bold" class="t-acc">IN PRACTICE</text>
<rect x="40" y="240" width="300" height="46" rx="2" class="f-t4" opacity=".9"/>
<text x="190" y="260" text-anchor="middle" font-size="10.5" class="t-inv" font-weight="bold">Reached the exit</text>
<text x="190" y="276" text-anchor="middle" font-size="9" class="t-inv">Japan, South Korea, Taiwan — protection ended</text>
<rect x="360" y="240" width="300" height="46" rx="2" class="f-t1" opacity=".9"/>
<text x="510" y="260" text-anchor="middle" font-size="10.5" class="t-inv" font-weight="bold">Never reached it</text>
<text x="510" y="276" text-anchor="middle" font-size="9" class="t-inv">Latin American import substitution — protection stayed</text>
<text x="350" y="316" text-anchor="middle" font-size="10" class="t-muted" font-style="italic">The success stories are the cases with an exit. They are also the cases most often counted.</text>
<text x="350" y="334" text-anchor="middle" font-size="9" class="t-muted">Judging the doctrine by them alone is the survivorship problem its critics press hardest.</text>
</svg>
<figcaption><strong>Fig. 4.</strong> List's argument is a sequence, and its whole force rests on a fourth step almost no political system performs: letting protection lapse once it has built a constituency. The East Asian cases usually cited in the doctrine's favour are precisely the ones that reached that rung — which is why counting only them tells you less about industrial policy than it appears to.</figcaption>
</figure>
