<text x="350" y="290" text-anchor="middle" font-size="10" class="t-muted" font-style="italic">The tradition generated both refutations itself, conceded both, and carried on.</text>

<figcaption><strong>Fig. 6.</strong> The mainstream's most damaging results are its own. It proved equilibrium exists, then proved that individual rationality barely constrains it; Samuelson conceded the capital critique outright in 1966. Neither concession altered the representative agent or the aggregate production function, which is the clearest evidence that the tradition's authority is institutional rather than deductive.</figcaption>
