<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 400" role="img" aria-label="A stepped chart tracing which school of economics held the governing institutions across roughly 250 years. Classical laissez-faire runs from 1776 to the Great Depression. Keynesian demand management runs from 1936 to the stagflation of the 1970s. Monetarist and Chicago economics runs from 1979 to the financial crisis of 2008. An eclectic settlement runs from 2008 to the present. Each of the three handovers sits on a catastrophe. The marginal revolution of the 1870s is marked as a theoretical turn that changed the discipline without changing who governed.">
<text x="350" y="26" text-anchor="middle" font-size="13" letter-spacing="2.5">THE ZIGZAG</text>
<text x="350" y="44" text-anchor="middle" font-size="10.5" class="t-muted" font-style="italic">which doctrine holds the institutions, and what dislodges it</text>
<path d="M56,250 L419.7,250 L419.7,140 L526.3,140 L526.3,232 L593.5,232 L593.5,178 L656,178" fill="none" class="s-t1 cv-draw" stroke-width="3" pathLength="1"/>
<text x="238" y="238" text-anchor="middle" font-size="11.5" font-weight="bold">Classical</text>
<text x="238" y="224" text-anchor="middle" font-size="9" class="t-muted">laissez-faire</text>
<text x="473" y="128" text-anchor="middle" font-size="11.5" font-weight="bold">Keynesian</text>
<text x="473" y="114" text-anchor="middle" font-size="9" class="t-muted">demand management</text>
<text x="559" y="252" text-anchor="middle" font-size="11.5" font-weight="bold">Monetarist</text>
<text x="559" y="266" text-anchor="middle" font-size="9" class="t-muted">inflation targeting</text>
<text x="650" y="166" text-anchor="end" font-size="11.5" font-weight="bold">Eclectic</text>
<circle cx="419.7" cy="195" r="7" class="f-t2 cv-fade" style="--d:.55s"/>

<text x="56" y="318" font-size="9.5" class="t-muted">1776</text>
<text x="276.1" y="318" text-anchor="middle" font-size="9.5" class="t-muted">1871</text>
<text x="419.7" y="318" text-anchor="middle" font-size="9.5" class="t-muted">1933</text>
<text x="526.3" y="318" text-anchor="middle" font-size="9.5" class="t-muted">1979</text>
<text x="593.5" y="318" text-anchor="middle" font-size="9.5" class="t-muted">2008</text>
<text x="656" y="318" text-anchor="end" font-size="9.5" class="t-muted">2035</text>
<text x="276.1" y="340" text-anchor="middle" font-size="9" class="t-muted">marginal revolution</text>
<text x="276.1" y="352" text-anchor="middle" font-size="8.5" class="t-muted" font-style="italic">theory turns, power does not</text>
<text x="419.7" y="340" text-anchor="middle" font-size="9" class="t-acc" font-weight="bold">the Depression</text>
<text x="526.3" y="340" text-anchor="middle" font-size="9" class="t-acc" font-weight="bold">stagflation</text>
<text x="593.5" y="340" text-anchor="middle" font-size="9" class="t-acc" font-weight="bold">the crisis</text>
<text x="350" y="376" text-anchor="middle" font-size="10" class="t-muted" font-style="italic">Three handovers in 250 years, each one sitting on a catastrophe. Height distinguishes doctrines; it is not a magnitude.</text>
<text x="350" y="392" text-anchor="middle" font-size="9" class="t-muted">A doctrine is not argued out of power. It is overtaken by an event its own models cannot explain.</text>
</svg>
<figcaption><strong>Fig. 1.</strong> Doctrine does not change hands by persuasion. Each of the three governing handovers counted here sits on a catastrophe the reigning models had failed to anticipate — while the marginal revolution of the 1870s, which rebuilt the discipline's theory of value, changed nobody's policy at all. Winning the argument and taking the institutions are separate events.</figcaption>
</figure>
