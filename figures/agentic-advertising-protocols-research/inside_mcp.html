<figcaption><strong>Fig. 2.</strong> What the substrate actually looks like from inside. <em>A host application holds one client per server, and each client keeps a single dedicated connection &#8212; which is why adding a server is an integration you do once rather than once per pairing. Local servers speak over stdio; remote ones speak Streamable HTTP with OAuth, and that remote case is the one advertising cares about, because a publisher's inventory server is somebody else's machine. The six primitives divide cleanly: three the server offers, three the client offers back. Elicitation is the quiet load-bearing one for this corpus. Advertising's insistence that a human sign off on a large buy is not a policy bolted onto the workflow; it is a protocol primitive, which is what people mean when they say the approval step is architectural rather than procedural.</em></figcaption>
</figure>
