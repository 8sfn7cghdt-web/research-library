<figcaption><strong>Fig. 3.</strong> Why the two camps can both be right. <em>Put the two standards side by side and the apparent rivalry dissolves into a difference of clock speed. AdCP negotiates above the auction on a clock measured in seconds and days, which is the clock premium CTV has always run on: custom packages, guaranteed delivery, a human signing off. ARTF operates inside the auction on a clock measured in milliseconds, where the only question is whether the bid comes back before the impression is gone. The ~100 ms figure on the right belongs to the IAB Tech Lab as a design target; no independent party has benchmarked it, and it is drawn here as a claim rather than a result. Making the auction faster does nothing for inventory that never cleared through an auction &#8212; which is the whole of AdCP's target market, and the reason the fight is about layers, not speed.</em></figcaption>
