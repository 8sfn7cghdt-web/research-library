<figcaption><strong>Fig. 1.</strong> The whole argument of this corpus in one exhibit. <em>Read from the bottom: MCP lets a single agent reach its tools, A2A lets agents reach each other, and both are general-purpose AI plumbing that advertising merely borrows. The ad-specific band above them is the contested one, and it does not hold one standard but two &#8212; separated by a dashed line that is the real subject of the fight. AdCP sits outside the auction and negotiates in the register premium CTV has always traded in: asynchronous, curated, guaranteed, human-approved. ARTF sits inside the auction and makes the impression clear faster. The arrows explain why the two camps talk past each other: AdCP runs on the same AI substrate everyone else is building on, while ARTF extends the decade of OpenRTB plumbing already in the ground. Same era, different foundations.</em></figcaption>
</figure>
