<figcaption><strong>Fig. 4.</strong> One connected-TV buy, traced step by step through the layers. <em>The scenario is ordinary &#8212; an outdoor-apparel brand wants premium sports CTV, males 25 to 45, fifty thousand dollars, with human sign-off above a threshold &#8212; and the lane assignment is the whole finding. Discovery, negotiation, creative, execution, audience activation and measurement all sit in the AdCP lane. Governance straddles the human and the agent, carried by MCP's elicitation primitive, and cannot be skipped. ARTF enters exactly once, on a dashed arrow, and only for whatever slice of the buy ultimately clears through an auction. Payment enters only if the ad is shoppable. This is the clearest place the two ad-layer standards compose rather than compete: AdCP negotiates the deal, and ARTF, where it is used at all, executes the impressions of the biddable remainder.</em></figcaption>
