<figcaption><strong>Fig. 3.</strong> Indian advertising is consolidating into three power blocks — a premium-video seller (JioStar), a performance-demand duopoly (Google, Meta), and a fast-rising commerce-media tier (Amazon, Flipkart, quick commerce) — with one actor, Reliance/Jio, uniquely arcing across all three through telecom, content and commerce. No other media market of India's size has those three layers under a single corporate roof. (JioStar FY26 results; FICCI-EY M&amp;E 2026; TRAI-derived subscriber data.)</figcaption>
