<figcaption><strong>Fig. 4.</strong> YouTube India is best read as three overlapping ad businesses sitting on one ~491-million-user base: a mobile long-form core (55% creator share), a Shorts engine that won the audience TikTok lost but monetizes far weaker (45% share, a fraction of long-form RPM), and the emergent living-room CTV business that is the explicit 2025–2030 land-grab on television budgets. The standing caution: every figure above the audience line is an estimate or a YouTube-supplied claim — Alphabet breaks out no India revenue. (DataReportal; YouTube/Brandcast 2025; YouTube Help monetization policy.)</figcaption>
