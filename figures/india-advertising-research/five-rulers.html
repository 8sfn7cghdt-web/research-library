<figcaption><strong>Fig. 1.</strong> The same 2025 market is ₹1.15 lakh crore or ₹1.84 lakh crore, and digital is 46% or 68%, depending only on which house's ruler you pick — Madison's expanded series adds quick-commerce (₹4,000 cr) and MSME digital (₹35,814 cr) that the legacy series leaves out. The lesson the corpus enforces everywhere: never quote an Indian ad-market number without naming its definition. (PMAR 2026; dentsu-e4m 2026; WPP Media TYNY.)</figcaption>
