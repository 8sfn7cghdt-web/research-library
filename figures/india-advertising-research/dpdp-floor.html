<figcaption><strong>Fig. 5.</strong> India's first operational privacy regime arrives on a ~18-month clock: notified 13 November 2025, consent-manager and enforcement machinery around November 2026, and the real compliance cliff — notice, consent, and the children's-data regime — around 13–14 May 2027. Because the children's provision is read as an absolute bar on behavioural targeting of under-18s, India's young, video-heavy platforms face a binary: reliably wall off minors, or drop behavioural targeting on youth-heavy inventory. (Shardul Amarchand Mangaldas; S.S. Rana &amp; Co.; Bar &amp; Bench; EY India; statute text.)</figcaption>
