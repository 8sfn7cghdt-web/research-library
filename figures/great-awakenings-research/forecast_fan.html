<figcaption><strong>Fig. 5.</strong> The likeliest path is <em>slow decline in which the revivalist form outlasts the mainline</em> &#8212; the dominant flame-vermilion band drifts only to the mid-to-high 50s by 2045 (40&#8211;50% likely, the modal scenario). But whether the post-2019 plateau is a true floor or merely a pause is genuinely unresolved (Claim 3.8): the field-green &#8220;stabilization&#8221; and slate &#8220;accelerated slide&#8221; cases stay live, and the 2028&#8211;2034 youth-cohort surveys are the single signal that will decide between them &#8212; so the figure shows the spread, not a line.</figcaption>
