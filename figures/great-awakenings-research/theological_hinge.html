<figcaption><strong>Fig. 3.</strong> The line from Edwards&#8217;s <em>bound</em> will to Finney&#8217;s <em>engineered</em> revival is a gradient, not a cliff (Claims 2.16, 2.17, 4.17). Read station by station &#8212; Edwards&#8217;s &#8220;moral inability,&#8221; the New Divinity&#8217;s &#8220;natural ability,&#8221; Taylor&#8217;s &#8220;power to the contrary,&#8221; Finney&#8217;s &#8220;constituted means&#8221; &#8212; the sovereignty of God migrates into the agency of man by half-steps, which is why the famous Edwards-versus-Finney &#8220;rupture&#8221; is partly a caricature.</figcaption>
