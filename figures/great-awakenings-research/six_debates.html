<figcaption><strong>Fig. 4.</strong> Across all six historiographical debates the strong claim proves only half-true and the mature verdict is a layered <em>both/and</em> &#8212; revivals were real yet the label was built, democratization mattered yet so did market and institution, race meant liberation <em>and</em> slavery at once. This is the field&#8217;s recurring lesson, the disciplined refusal of the either/or rather than mere fence-sitting (Claim 4.23).</figcaption>
