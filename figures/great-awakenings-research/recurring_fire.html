<figcaption><strong>Fig. 1.</strong> Revival in America is a <em>recurring form</em>, not two isolated events. Historians bracketed two dense clusters of revival as &#8220;the First&#8221; and &#8220;the Second&#8221; Great Awakening &#8212; a naming the strongest scholarship treats as a partial construction (Claim 1.1) &#8212; yet the same fire kept breaking out long after the names stopped, down to the livestreamed Asbury outpouring of 2023 (Claim 3.2).</figcaption>
