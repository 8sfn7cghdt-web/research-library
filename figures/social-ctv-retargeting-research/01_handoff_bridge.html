<figcaption><strong>Fig. 1.</strong> The whole category in one motion: a platform knows an <em>individual</em> on a phone, but a television is a <em>household</em>, so every social-to-CTV buy is a resolution-and-match that leaks at three seams — the individual-to-household roll-up, the ~50% clean-room match, and the click that never comes.</figcaption>
