<figcaption><strong>Fig. 4.</strong> The streamers' own audience businesses can reconstruct all but one of the social platforms' signals — demographic, behavioral, purchase-intent, even verified purchase, which the retailers and TV-OS operators hold <em>better</em> than social — and the sole exception, verified professional identity, is exactly why LinkedIn is the only durable case for social's irreplaceability.</figcaption>
