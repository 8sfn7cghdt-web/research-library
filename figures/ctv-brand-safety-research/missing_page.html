<figure class="corpus-fig" role="group">
<svg viewBox="0 0 700 438" role="img" aria-label="A side by side diagram contrasts web brand safety with connected TV brand safety. On the web side a page URL is visible and feeds page crawl, context classifier, and pre-bid decision. On the CTV side the app bundle is visible but the show title field is blank, leaving the buyer to bid with app-level knowledge rather than program-level knowledge. The conclusion is that the missing page address is the central technical break.">
