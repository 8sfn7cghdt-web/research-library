#pager { max-width: 700px; width: 100%; margin: 0 auto; padding: 1.1rem 2rem 3rem;
  display: flex; align-items: center; justify-content: space-between; font-family: var(--sans);
  border-top: 1px solid var(--border); }

  #main { margin-left: 0; }

/* a deep-linked passage flashes briefly when the reader scrolls to it */
@keyframes passageFlash { 0% { background: var(--mark); } 100% { background: transparent; } }
.passage-flash { animation: passageFlash 2.2s ease; border-radius: 4px; box-decoration-break: clone; }

@media (min-width: 861px) {

<script id="corpus-data" type="application/json">{"slug": "ctv-ssp-research", "title": "The Seller's Agent", "subtitle": "The supply-side platforms that carry programmatic CTV — and their bet on attention, outcomes and AI", "author": "", "generated": "2026-07-25", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces on the CTV Sell Side", "summary": "", "body": "# Six Easy Pieces on the CTV Sell Side\n\n## Bottom Line\n\nWhen you watch an ad on a streaming service, somebody had to sell that slot, and it probably wasn't the streaming service alone. A layer of companies exists to auction those slots on the streamer's behalf, and that layer is currently fighting for its life against the streamers themselves — while simultaneously trying to prove that the ads it sells are actually watched, actually cause sales, and can be traded by software instead of salespeople. These pages explain who those companies are and what the fight is about, assuming you know nothing to start.\n\n---\n\n## One: The one idea\n\nHere is the whole thing in a sentence: **the companies that run the auction for streaming TV ad space are being squeezed by the companies that own the screens.**\n\nThink of a theater with seats to fill. The theater can sell tickets at its own box office, keeping every dollar — or it can hand a block of seats to a ticket agency, which finds buyers the theater couldn't reach and takes a cut for the trouble. Every theater does some of both. The interesting question is always the ratio, and who decides it.\n\nStreaming television works the same way. A service like Netflix or Hulu has commercial breaks to fill. It sells some of them directly, with human salespeople negotiating with big advertisers. The rest it routes through outside companies that auction the slots automatically, in the fraction of a second before the ad plays. Those auction-runners are called **supply-side platforms** — SSPs — and \"supply side\" simply means they work for the seller. The buyer's side has its own mirror-image technology, called a demand-side platform, or DSP.\n\nThe term for all of this is **CTV**, connected TV: television delivered over the internet to a smart TV, a streaming stick, a game console. And **programmatic** just means the buying and selling happens through automated auctions rather than a phone call.\n\nThat's the machinery. Now the fight.\n\n## Two: Why it matters\n\nTwo reasons, one about money and one about power.\n\nThe money: this is where television advertising has gone. US connected-TV advertising is running at roughly $38 billion a year and is forecast to reach about $51 billion by 2029 — the year 2028 being when it is expected to pass traditional broadcast and cable TV for the first time. That is a very large pot, and the auction-runners take a slice of every dollar that passes through them.\n\nThe power: whoever controls how ads are sold also controls what data gets used to target them, what counts as proof the ads worked, and who gets paid what. Return to the theater. If the ticket agency also decides which seats are \"premium,\" writes the report on how full the house was, and sets its own commission without publishing it, the agency has quietly become more powerful than the theater. That is roughly the accusation against this layer of the advertising business — and by the advertising industry's own measurement, only about 47 cents of every programmatic dollar reaches the publisher at all.\n\n## Three: The cast\n\nFour groups, and the difference between them is the most useful thing to hold onto.\n\n**The independent auction-runners.** Companies whose only business is selling other people's ad space. Two of them genuinely matter at scale: **Magnite**, for whom streaming TV now makes up more than half the business, and **PubMatic**. **Nexxen** is a real but smaller and bumpier third. Several others — Index Exchange, Equativ, OpenX, Kargo — are real businesses whose streaming-TV scale honestly cannot be measured, because they don't disclose it. Two names commonly assumed to belong here don't: Yahoo shut its auction business in 2023, and Viant is a buyer-side company.\n\n**The people who own the screen.** Amazon, Roku, Samsung, LG, Vizio — makers of devices and operating systems. They sell ad space on their own home screens and, more valuably, sell data about what you watch. That data comes from **automatic content recognition**, or ACR: software inside most smart TVs that identifies whatever is on screen, no matter which app or box it came from. Your television, in other words, watches you back.\n\n**The people who own the content.** Netflix, Disney, Comcast's NBCUniversal, Fox, Warner Bros. Discovery, Paramount. Several have built their own ad-selling technology rather than renting it — Netflix finished doing exactly that in 2025 — which cuts the independents down to a supplementary role.\n\n**The measurers.** Adelaide, TVision, iSpot, VideoAmp, Nielsen and others, who sell the numbers everyone argues over. They matter more than their size suggests, because in advertising whoever defines the metric shapes the market.\n\nTwo structural facts about 2026 will tell you which way the wind blows: Fox agreed in June to buy Roku for about $22 billion, and Comcast announced it was splitting itself in two. The screens and the content are consolidating. The auction-runners are not.\n\n## Four: How it actually works\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 420\" role=\"img\" aria-label=\"A CTV ad auction drawn as an auction-house ledger. Viewer playback moves to the streaming app, then the publisher ad server, then the supply-side platform, buyer platforms, server-side ad insertion, and finally back to the publisher. A dollar ledger beneath shows that only about 47 cents of a programmatic dollar reaches the publisher while transaction costs and opaque fees occupy the rest.\">\n<text x=\"44\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">LOT 001 &#183; ONE STREAMING AD BREAK<\/text>\n<text x=\"44\" y=\"47\" class=\"t-mono t-muted\" font-size=\"10.5\">from play button to stitched ad &#183; the seller&#8217;s agent runs the room<\/text>\n<line x1=\"44\" y1=\"58\" x2=\"656\" y2=\"58\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<rect x=\"44\" y=\"82\" width=\"612\" height=\"174\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<g class=\"t-mono\" font-size=\"9.5\">\n<rect x=\"64\" y=\"114\" width=\"72\" height=\"54\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"100\" y=\"137\" text-anchor=\"middle\" font-weight=\"bold\">VIEWER<\/text>\n<text x=\"100\" y=\"152\" text-anchor=\"middle\" class=\"t-muted\">presses play<\/text>\n<rect x=\"160\" y=\"105\" width=\"78\" height=\"72\" rx=\"3\" class=\"f-t4\" opacity=\".22\"/>\n<rect x=\"160\" y=\"105\" width=\"78\" height=\"72\" rx=\"3\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--t4)\"/>\n<text x=\"199\" y=\"131\" text-anchor=\"middle\" font-weight=\"bold\">APP<\/text>\n<text x=\"199\" y=\"147\" text-anchor=\"middle\" class=\"t-muted\">asks for ads<\/text>\n<rect x=\"264\" y=\"94\" width=\"86\" height=\"94\" rx=\"3\" class=\"f-t2\" opacity=\".26\"/>\n<rect x=\"264\" y=\"94\" width=\"86\" height=\"94\" rx=\"3\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--t2)\"/>\n<text x=\"307\" y=\"122\" text-anchor=\"middle\" font-weight=\"bold\">AD SERVER<\/text>\n<text x=\"307\" y=\"139\" text-anchor=\"middle\" class=\"t-muted\">direct vs.<\/text>\n<text x=\"307\" y=\"153\" text-anchor=\"middle\" class=\"t-muted\">auction fill<\/text>\n<rect x=\"376\" y=\"82\" width=\"92\" height=\"118\" rx=\"3\" class=\"f-t1\" opacity=\".78\"/>\n<rect x=\"376\" y=\"82\" width=\"92\" height=\"118\" rx=\"3\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--border)\"/>\n<text x=\"422\" y=\"116\" text-anchor=\"middle\" font-weight=\"bold\" class=\"t-inv\">SSP<\/text>\n<text x=\"422\" y=\"134\" text-anchor=\"middle\" class=\"t-inv\">seller&#8217;s<\/text>\n<text x=\"422\" y=\"148\" text-anchor=\"middle\" class=\"t-inv\">agent<\/text>\n<text x=\"422\" y=\"176\" text-anchor=\"middle\" class=\"t-inv\" font-size=\"8\">reserve &#183; lots &#183; cut<\/text>\n<rect x=\"494\" y=\"105\" width=\"78\" height=\"72\" rx=\"3\" class=\"f-t3\" opacity=\".32\"/>\n<rect x=\"494\" y=\"105\" width=\"78\" height=\"72\" rx=\"3\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--t3)\"/>\n<text x=\"533\" y=\"131\" text-anchor=\"middle\" font-weight=\"bold\">DSPs<\/text>\n<text x=\"533\" y=\"147\" text-anchor=\"middle\" class=\"t-muted\">bid in ms<\/text>\n<rect x=\"596\" y=\"114\" width=\"40\" height=\"54\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"616\" y=\"137\" text-anchor=\"middle\" font-weight=\"bold\">SSAI<\/text>\n<text x=\"616\" y=\"152\" text-anchor=\"middle\" class=\"t-muted\">stitch<\/text>\n<\/g>\n<g fill=\"none\" stroke-width=\"2.2\">\n<path d=\"M136,141 C146,141 150,141 160,141\" class=\"s-t4 cv-draw\" pathLength=\"1\"/>\n<path d=\"M238,141 C248,141 254,141 264,141\" class=\"s-t2 cv-draw\" pathLength=\"1\" style=\"--d:.08s\"/>\n<path d=\"M350,141 C360,141 366,141 376,141\" class=\"s-t1 cv-draw\" pathLength=\"1\" style=\"--d:.16s\"/>\n<path d=\"M468,141 C480,141 484,141 494,141\" class=\"s-t3 cv-draw\" pathLength=\"1\" style=\"--d:.24s\"/>\n<path d=\"M572,141 C584,141 588,141 596,141\" class=\"s-t4 cv-draw\" pathLength=\"1\" style=\"--d:.32s\"/>\n<\/g>\n<g class=\"f-t4\">\n<polygon points=\"154,136 164,141 154,146\"/><polygon points=\"258,136 268,141 258,146\"/><polygon points=\"370,136 380,141 370,146\"/><polygon points=\"488,136 498,141 488,146\"/><polygon points=\"590,136 600,141 590,146\"/>\n<\/g>\n<path d=\"M422,200 C418,222 410,234 395,250\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"2.2\" stroke-dasharray=\"4 3\"/>\n<text x=\"382\" y=\"226\" class=\"t-mono\" font-size=\"8.5\" text-anchor=\"end\" style=\"fill:var(--accent)\">fee retained<\/text>\n<text x=\"44\" y=\"288\" class=\"t-mono\" font-size=\"12\" font-weight=\"bold\" style=\"fill:var(--text)\">THE PROGRAMMATIC DOLLAR<\/text>\n<rect x=\"44\" y=\"304\" width=\"612\" height=\"44\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"44\" y=\"304\" width=\"288\" height=\"44\" class=\"f-t1 cv-grow-right\" opacity=\".8\"/>\n<rect x=\"332\" y=\"304\" width=\"177\" height=\"44\" class=\"f-t3 cv-grow-right\" opacity=\".72\" style=\"--d:.12s\"/>\n<rect x=\"509\" y=\"304\" width=\"147\" height=\"44\" class=\"f-t5 cv-grow-right\" opacity=\".42\" style=\"--d:.24s\"/>\n<text x=\"188\" y=\"330\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"12\" font-weight=\"bold\">47.1&#162; publisher<\/text>\n<text x=\"420\" y=\"330\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"12\" font-weight=\"bold\">29&#162; transaction costs<\/text>\n<text x=\"584\" y=\"330\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--text)\">rest: data + unknowns<\/text>\n<text x=\"44\" y=\"374\" class=\"t-mono t-muted\" font-size=\"9.5\">CTV trading is a relationship business wearing an auction&#8217;s clothes: the scarce act is deciding which rooms the SSP gets to enter.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> The SSP&#8217;s job is not merely technical routing: it is the consignment agent that turns one ad break into a lot, calls demand into the room, and keeps a fee from a dollar whose publisher share was benchmarked at about 47.1&#162;.<\/figcaption>\n<\/figure>\n\n\nFollow one ad.\n\nYou press play. Before the show starts, the streaming app tells its **ad server** — the system that decides which specific commercial plays in which slot — that it needs to fill a two-minute break. For slots not already sold directly, the ad server asks one or more supply-side platforms to find buyers.\n\nEach SSP broadcasts a description of the opportunity: roughly what show, roughly what kind of household, what device. Buyers' systems bid, in milliseconds. The highest bid wins, the winning commercial is stitched into the video stream before it reaches you, and money flows back down the chain — with each company in the middle keeping a cut.\n\nTwo features of this make streaming different from advertising on a web page, and both matter later.\n\nFirst, the ad is **unskippable and fills the whole screen**. On the web, advertisers pay for \"viewability\" — a check on whether an ad was technically visible at all. On television that check passes essentially every time, which makes it useless for telling a good slot from a bad one. Hold that thought.\n\nSecond, streaming has almost entirely abandoned the open free-for-all auction. Nearly all connected-TV trading now happens through pre-negotiated private deals. This is a relationship business wearing an auction's clothes.\n\n## Five: The fight\n\nThree arguments are running at once, and each is really the same argument: *what is the auction-runner actually for?*\n\n**Is anyone watching?** Since viewability can't distinguish a good streaming slot from a bad one, a set of companies now sell **attention** measurement — estimates of whether a real person's eyes and mind were actually on the ad. Some use cameras in volunteer households; others build statistical models. Sellers have begun packaging inventory by attention score. The skeptics' case is strong and comes from serious marketing scientists: the vendors measure different things on scales that can't be compared, none has been independently certified for streaming specifically, and the metrics are mostly validated against whether people *remember* an ad rather than whether they *buy*. There is also an awkward wrinkle. Streaming already scores at the top of nearly every attention ranking published — which makes attention a poor tool for telling one streaming slot from another, even if it usefully separates television from a banner ad.\n\n**Did it sell anything?** Advertisers increasingly want television judged like search advertising — on sales, sign-ups, store visits. Sellers have obliged, some going as far as guaranteeing a cost per result. This quietly transforms the seller's business: guarantee an outcome and you have started underwriting risk, absorbing the cost of every ad that fails to convert. Notably, no seller anywhere publishes how often those guarantees miss or what it costs them. And the counter-argument is heavyweight: decades of marketing research holds that television's real value is slow accumulation of brand familiarity, so optimizing for what's measurable this quarter may destroy the thing that made TV worth buying.\n\n**Can software do the negotiating?** In December 2025, an agency briefed a campaign in plain language, and software agents at a supply-side platform interpreted it, planned it, bought it and optimized it, with no human trader and no buyer-side platform involved. This is the frontier everyone is watching, and the fear is obvious: if two pieces of software can negotiate directly, why pay a middleman to run an auction? But look closely at what happened in that campaign. The layer the software cut out was the *buyer's* platform, not the seller's. So far, every visible example points the same way.\n\n## Six: Where it's heading\n\nThe safest prediction is also the most useful, because it's arithmetic rather than opinion: the independent auction-runners will be **bigger in dollars and smaller in importance** by 2029. A pot growing 11% a year lets a company lose share every single year and still report growth every single year.\n\nBeyond that, four futures are live. The most likely, at a little over four in ten, is an unglamorous squeeze: the leaders keep growing, their cut of each dollar thins, a mid-sized rival or two gets bought, and all these new products turn out to have been the price of staying in business rather than a way to make more of it. Less likely but real is absorption — the screen-owners and content-owners take the rest, and the independents end up as plumbing. Less likely again, the climb succeeds and the auction-runner becomes something more valuable than an auction. And at roughly one in six, an outside shock resets everything: a court has been sitting on a ruling that could force Google to sell its ad exchange, the Supreme Court is weighing a 1988 video-privacy law that could make smart-TV viewing data legally toxic, and either would redraw the board.\n\nIf you want a single number to watch, watch a disclosed **take rate** — the percentage of an advertiser's spend the middleman keeps. Almost nobody publishes it. If one of these companies ever discloses one that has gone *up*, the squeeze is over and the climb worked. Until then, assume the squeeze.\n\n---\n\n## Open Questions\n\nA newcomer should know what even the specialists don't. Nobody outside Index Exchange knows what its streaming business is worth. No seller has ever disclosed how often an outcome guarantee fails. And the experiment that would settle the attention argument — comparing attention-priced ads against ordinary ones, same creative, same audience, run by someone with no stake in the result — has not been done.\n\n## Sources\n\nThis primer summarizes the chapters that follow and introduces no evidence of its own; every figure in it is sourced where it is established in those chapters. The load-bearing numbers come from Magnite's and PubMatic's first-quarter 2026 results, the Association of National Advertisers' programmatic transparency benchmarks, Emarketer's connected-TV forecasts through 2029, Fox Corporation's June 2026 agreement to acquire Roku, and the IAB and Media Rating Council's attention measurement guidelines of November 2025."}, {"order": 1, "file": "01_How_The_Sell_Side_Was_Assembled.md", "title": "How the Sell Side Was Assembled", "summary": "", "body": "# How the Sell Side Was Assembled\n\n## Bottom Line\n\nEvery company that matters on the CTV sell side today started life as something else: a video ad server built for pre-roll on desktop, a display exchange retrofitted for video, or a broadcaster's in-house ad-decisioning tool. None of it was purpose-built for streaming television, and that lineage still shapes what these companies can and cannot do. A decade of consolidation — roughly $2.5 billion of disclosed deal value across a dozen transactions between 2013 and 2024 — collapsed a fragmented pre-roll market into a handful of scaled platforms, but it did not resolve the industry's founding tension: whether the entity that decides what ad plays (the ad server) and the entity that auctions the impression (the supply-side platform, or SSP — the technology publishers use to sell their ad space into programmatic auctions) should be the same company. Streaming forced the question. When a service like Netflix or Roku insists on running its own ad server, the outside SSP's job shrinks to plumbing and demand access, and a new layer — curation, where a third party assembles and scores inventory into ready-made deals — has emerged to claim the decisioning value that ad servers used to hold alone. The debates that opened this market in the 2010s — fee transparency, duplicate supply, who should be allowed to make a buying decision — are the same debates still running in 2026, just with more zeros attached.\n\n## Before Programmatic: Set-Top Boxes, Not Streams\n\nThe reason to start here rather than with the video ad server companies: CTV monetization did not begin as a digital, programmatic business at all, and treating the internet-video lineage as the whole story understates how much of today's sell-side thinking — addressability, household-level targeting, the operator as gatekeeper — was inherited from a cable-box technology stack that predates the smart TV by a decade.\n\nThe first serious attempt to sell targeted television advertising at scale ran through the cable set-top box, not a browser or an app. Invidi, founded around 2003, built ad-insertion technology that let satellite and cable operators swap a different commercial into the same programming slot for different households, based on data the operator held about that household — the technical precursor to everything CTV now calls addressability [30]. Canoe Ventures, launched in 2008 and jointly owned by Comcast, Charter, and Cox, extended the same idea across cable's video-on-demand and, later, linear inventory, positioning itself as a shared industry utility for addressable ad insertion across the major operators rather than a single company's proprietary tool [30]. Both companies solved a real problem — cable and satellite operators wanted to sell the same ad slot differently to different households without building separate insertion infrastructure themselves — using data (billing address, set-top box viewing history, sometimes third-party household data) that never touched the open, auction-based marketplace the rest of digital advertising was building in parallel. This is the origin of a pattern that still defines CTV's sell side: targeting and monetization power sitting with whoever controls the point of insertion into the household's device, not with an open exchange sitting above it. Invidi and Canoe were never programmatic in the real-time-bidding sense — deals were negotiated, data-matched, and executed largely outside any auction — but the operator-controlled, insertion-point-centric model they built is the direct conceptual ancestor of SSAI-based CTV monetization, and Invidi in particular has continued working with FreeWheel and other current-era ad servers to bridge satellite and cable addressable inventory into more modern pipes [30]. The honest limit on this account: detailed, source-verifiable financials for either Canoe or Invidi's addressable-TV business are not publicly available in the way SEC-filed deal prices are for the later internet-video acquisitions, so what can be said with confidence is architectural — how the model worked and who it served — rather than how large the addressable-TV business actually was at its peak.\n\nBy the time internet-connected television sets and streaming devices arrived as a meaningful advertising surface in the early-to-mid 2010s, this operator-controlled, insertion-point model was already the default mental frame for how television inventory got sold with any precision. The video ad server companies that came next — FreeWheel, SpotX, Tremor Video — were not inventing addressability from scratch; they were rebuilding a version of it that could run over an IP connection instead of a coaxial cable, serve a streaming app instead of a set-top box firmware layer, and eventually plug into the broader programmatic auction infrastructure the open web had already built for display and pre-roll video. That rebuilding is where the more familiar internet-video lineage picks up.\n\n## The Video Ad Server Era: Selling What You Show\n\nThe starting condition, and the reason for reading it: nearly every structural argument in CTV programmatic today — about who \"owns\" the ad decision, about why direct deals still dominate, about why an ad server acquisition is worth ten times what a pure exchange is worth — traces back to a distinction that got established between 2005 and 2010 and never fully went away: the difference between an ad server and an ad exchange.\n\nAn ad server is the system a publisher uses to decide what to show in an ad slot — which campaign, which creative, in what order, under what frequency cap — independent of whether that decision comes from a direct-sold guarantee or a programmatic auction. An exchange, or SSP, is the layer that lets a publisher offer inventory into an open, automated marketplace of buyers. In display advertising these were separable from the start, because DoubleClick's ad server (later Google's) sat comfortably apart from the exchanges plugging into it. Video never had that luxury, because video ad serving required something display did not: stitching a short ad break into a linear-feeling stream without breaking playback, tracking completion, and handling the specific IAB VAST/VPAID creative formats video demanded. That specialized requirement is why video ad serving became its own product category rather than a feature bolted onto display tools, and why the companies that built it — not the display-exchange incumbents — ended up controlling CTV's plumbing a decade later.\n\nFreeWheel is the clearest case. Founded in 2007 by three former DoubleClick executives — Jon Heller, Doug Knopper, and Diane Yu — FreeWheel built its ad server specifically for premium, professionally produced video: the ESPNs and Foxes and MLB.tvs of the world, publishers who needed frequency capping, pod management, and yield optimization across live and on-demand streams at a scale consumer-video ad networks did not require [1][2]. Comcast bought FreeWheel for roughly $320 million in March 2014 [1] — not to run a media business, but to control the infrastructure that decided what ad played across a swath of the premium video web, a bet that looks prescient given FreeWheel's continuing role as one of the two or three ad servers that matter in CTV over a decade later.\n\nThe rest of the 2013–2014 wave was consolidation by the open web's biggest platforms, each buying a video specialist to plug a gap: AOL bought Adap.tv for $405 million in August 2013 [3]; Yahoo bought BrightRoll, a 2006-founded programmatic video network, for $640 million in a deal that closed in December 2014 [4]; and Facebook bought LiveRail, a video SSP, in mid-2014 [3]. None of these survived as independent brands — AOL and Yahoo were themselves absorbed into Verizon and then sold off, and Facebook folded LiveRail into its own ad stack before eventually shutting it down — which is itself a data point worth weighing against any assumption that scale acquisition guarantees durability. The buyers in this wave were portals and social platforms trying to own video ad demand generally, not CTV specifically; CTV as a category barely existed as a programmatic line item in 2013–2014. The company that was building specifically for what became CTV was Tremor Video, founded in 2005, which spun off its demand-side business in 2017 to rebrand its sell-side platform as Telaria, with an early bet on live programmatic ad insertion for Dish's Sling TV [5]. SpotX, founded in 2007 by Mike Shehan and Steve Swoboda and credited with building one of the first true video ad exchanges, took outside capital from European broadcaster RTL Group starting in 2014 and became RTL's wholly owned subsidiary in 2017 [6] — a broadcaster buying its own supply-side technology, a pattern that would repeat.\n\nThe honest caveat here: most trade coverage of this era, including the sourcing available for this account, comes from deal announcements and specialist press rather than audited financials, so precise revenue and margin figures for these transactions are largely unavailable. What is verifiable is deal price, timing, and strategic rationale as stated by the acquirer — which is evidence of what companies believed video was worth, not proof they were right to believe it.\n\n## The Waterfall, and Why Server-Side Ad Insertion Changed What a Seller Could Sell\n\nThe \"so what\" for a reader deciding where value sits in this stack: server-side ad insertion is arguably the single technology that made programmatic CTV possible at meaningful scale, because it solved a problem the open web never had — video buffering — and in solving it, it handed ad decisioning power to whichever company controlled the server doing the stitching.\n\nBefore real-time bidding matured for video, publishers sold video inventory the way they sold display: through a waterfall, a sequential process that offers each impression to demand sources one at a time, in a priority order set manually by the publisher's ad ops team, until one source accepts the price floor. Waterfalls are not auctions in any meaningful sense — the highest bidder does not necessarily win, the source ranked first wins if it clears the floor, which means publishers routinely left money on the table by under-prioritizing a demand source that would have paid more that particular day. Header bidding, which let publishers run a single simultaneous auction across multiple demand sources at once, emerged around 2014 in display and is credited with lifting publisher revenue 20–30% relative to waterfalls by ensuring the actual highest bid wins [7]. But header bidding as built for display ran client-side, in the viewer's browser, executing JavaScript in the page before it rendered — and video, especially streaming video running on a smart TV operating system or a streaming-stick app rather than inside a browser, does not have a \"header\" to put that code in.\n\nServer-side ad insertion, commonly called SSAI (also referred to as dynamic ad insertion), solved the underlying delivery problem by moving the ad decision off the device entirely: instead of the TV app pausing content playback to separately fetch an ad file — the client-side approach that produces the buffering and black-screen glitches familiar from early smart-TV apps — the streaming server stitches the ad directly into the video manifest before it ever reaches the device, so the viewer experiences one continuous stream [8][9]. This is not a minor technical convenience. It is the reason CTV advertising can look and feel like broadcast television rather than a website with a video player bolted on, and it is why the company operating the SSAI stitching server has an unusually strong claim on the ad decision itself — a claim an outside SSP, sitting downstream of that server, cannot fully contest. Because SSAI concentrates decisioning power at the point of stream assembly, and because building reliable, low-latency stitching infrastructure at scale is a genuinely hard engineering problem, SSAI capability became a strategic asset worth acquiring in its own right — which is exactly what Magnite's SpringServe purchase, discussed below, was for.\n\nVideo did eventually get something like header bidding — Prebid Server, the server-side variant of the open-source Prebid header-bidding project, has become a de facto standard for running simultaneous multi-demand auctions in environments (including CTV) where client-side execution is impossible or too slow [10]. But \"server-side header bidding\" is a meaningfully different, more centralized thing than the client-side version that transformed open-web display: it requires a server operator in the middle, which reintroduces exactly the gatekeeping question SSAI already raises, and it never produced the fully commoditized, publisher-controlled auction dynamic that header bidding delivered on the open web. That gap between the display-web promise and the CTV reality is one of this history's real contingent turns, addressed below.\n\n## The Consolidation Deals That Built the Present Roster\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 470\" role=\"img\" aria-label=\"A consolidation timeline from 2013 through 2026 shows the CTV sell side assembled from acquisitions and stack-building deals: Adap.tv, FreeWheel, BrightRoll, Magnite, SpotX, SpringServe, Publica, Amobee, Equativ Sharethrough, Vizio, TVision, Vibe, and Roku. Deal prices range from tens of millions to twenty-two billion dollars.\">\n<text x=\"44\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">THE LOT BOOK OF CONSOLIDATION<\/text>\n<text x=\"44\" y=\"47\" class=\"t-mono t-muted\" font-size=\"10.5\">the present roster was assembled deal by deal, not designed whole<\/text>\n<line x1=\"44\" y1=\"58\" x2=\"656\" y2=\"58\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<line x1=\"76\" y1=\"110\" x2=\"624\" y2=\"110\" class=\"ln\" stroke-width=\"1.4\"/>\n<g class=\"t-mono t-muted\" font-size=\"9.2\" text-anchor=\"middle\">\n<text x=\"76\" y=\"94\">2013<\/text><text x=\"159\" y=\"94\">2014<\/text><text x=\"326\" y=\"94\">2020<\/text><text x=\"367\" y=\"94\">2021<\/text><text x=\"409\" y=\"94\">2022<\/text><text x=\"451\" y=\"94\">2023<\/text><text x=\"492\" y=\"94\">2024<\/text><text x=\"624\" y=\"94\">2026<\/text>\n<\/g>\n<g class=\"cv-rise\">\n<circle cx=\"76\" cy=\"110\" r=\"6\" class=\"f-t4\"/><line x1=\"76\" y1=\"116\" x2=\"76\" y2=\"176\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"24\" y=\"176\" width=\"104\" height=\"50\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--t4)\"/>\n<text x=\"76\" y=\"196\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10\" font-weight=\"bold\">Adap.tv<\/text>\n<text x=\"76\" y=\"212\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"9.2\" style=\"fill:var(--t4)\">$405M &#183; AOL<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.06s\">\n<circle cx=\"159\" cy=\"110\" r=\"6\" class=\"f-t2\"/><line x1=\"159\" y1=\"116\" x2=\"159\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"107\" y=\"250\" width=\"104\" height=\"67\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--t2)\"/>\n<text x=\"159\" y=\"270\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10\" font-weight=\"bold\">FreeWheel<\/text>\n<text x=\"159\" y=\"286\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"9.2\" style=\"fill:var(--t2)\">~$320M<\/text>\n<text x=\"159\" y=\"302\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"9.2\" style=\"fill:var(--accent)\">Comcast<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.12s\">\n<circle cx=\"326\" cy=\"110\" r=\"6\" class=\"f-t1\"/><line x1=\"326\" y1=\"116\" x2=\"326\" y2=\"176\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"274\" y=\"176\" width=\"104\" height=\"58\" rx=\"3\" class=\"f-t1\" opacity=\".84\"/>\n<text x=\"326\" y=\"198\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"10\" font-weight=\"bold\">Magnite<\/text>\n<text x=\"326\" y=\"214\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"9.2\">Rubicon + Telaria<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.18s\">\n<circle cx=\"367\" cy=\"110\" r=\"6\" class=\"f-t3\"/><line x1=\"367\" y1=\"116\" x2=\"367\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"304\" y=\"250\" width=\"126\" height=\"85\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--t3)\"/>\n<text x=\"367\" y=\"270\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10\" font-weight=\"bold\">2021 stack buy<\/text>\n<text x=\"367\" y=\"286\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"9.2\" style=\"fill:var(--t3)\">SpotX $1.17B<\/text>\n<text x=\"367\" y=\"302\" text-anchor=\"middle\" class=\"t-mono t-muted\" font-size=\"9.2\">SpringServe ~$31M<\/text>\n<text x=\"367\" y=\"318\" text-anchor=\"middle\" class=\"t-mono t-muted\" font-size=\"9.2\">Publica $220M<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.24s\">\n<circle cx=\"409\" cy=\"110\" r=\"6\" class=\"f-t2\"/><line x1=\"409\" y1=\"104\" x2=\"409\" y2=\"58\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"356\" y=\"14\" width=\"106\" height=\"44\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--t2)\"/>\n<text x=\"409\" y=\"33\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10\" font-weight=\"bold\">Amobee<\/text>\n<text x=\"409\" y=\"49\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"9.2\" style=\"fill:var(--t2)\">$239M &#183; Tremor<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.30s\">\n<circle cx=\"492\" cy=\"110\" r=\"6\" style=\"fill:var(--accent)\"/><line x1=\"492\" y1=\"116\" x2=\"492\" y2=\"176\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"440\" y=\"176\" width=\"104\" height=\"67\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--accent)\"/>\n<text x=\"492\" y=\"196\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10\" font-weight=\"bold\" style=\"fill:var(--accent)\">2024<\/text>\n<text x=\"492\" y=\"212\" text-anchor=\"middle\" class=\"t-mono t-muted\" font-size=\"9.2\">Equativ + Sharethrough<\/text>\n<text x=\"492\" y=\"228\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"9.2\" style=\"fill:var(--accent)\">Vizio $2.2B<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.36s\">\n<circle cx=\"624\" cy=\"110\" r=\"7\" class=\"f-t3\"/><line x1=\"624\" y1=\"116\" x2=\"624\" y2=\"270\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"552\" y=\"270\" width=\"144\" height=\"85\" rx=\"3\" class=\"f-t3\" opacity=\".72\"/>\n<rect x=\"552\" y=\"270\" width=\"144\" height=\"85\" rx=\"3\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--t3)\"/>\n<text x=\"624\" y=\"290\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"10\" font-weight=\"bold\">2026 reset<\/text>\n<text x=\"624\" y=\"306\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"9.2\">TVision $40M<\/text>\n<text x=\"624\" y=\"322\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"9.2\">Vibe.co $1.4B<\/text>\n<text x=\"624\" y=\"338\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"9.2\">Roku ~$22B<\/text>\n<\/g>\n<rect x=\"44\" y=\"374\" width=\"612\" height=\"50\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"62\" y=\"396\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">PATTERN<\/text>\n<text x=\"130\" y=\"396\" class=\"t-mono t-muted\" font-size=\"9.5\">scale buys &#8594; ad-server buys &#8594; data/platform buys<\/text>\n<text x=\"62\" y=\"413\" class=\"t-mono t-muted\" font-size=\"9\">CTV sell-side power migrated from pure exchanges toward stacks that own decisioning, identity, or the screen itself.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The roster is contingent history in ledger form: Magnite bought scale and ad serving, IAS bought the insertion point, retailers bought screens, and by 2026 the largest transaction in the sell-side story was no longer an SSP deal at all but Fox&#8217;s pending ~$22B move for Roku.<\/figcaption>\n<\/figure>\n\n\nThe reason to walk through these deals by name rather than treat them as background noise: each one answers a different strategic question, and conflating them — as loose trade narratives about \"adtech consolidation\" often do — obscures what actually happened. Some of these deals bought scale, some bought a missing technical layer, and at least one bought a resurrected competitor for parts.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: a decade of consolidation built today&#x27;s roster — and never stopped<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">2013<\/div><div class=\"tlbody\">AOL acquires Adap.tv ($405M)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">2014<\/div><div class=\"tlbody\">Comcast acquires FreeWheel (~$320M); Yahoo acquires BrightRoll ($640M)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">2020<\/div><div class=\"tlbody\">Rubicon Project and Telaria merge to form Magnite<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">2021<\/div><div class=\"tlbody\">Magnite acquires SpotX ($1.17B) and SpringServe (~$31M); IAS acquires Publica ($220M)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">2022<\/div><div class=\"tlbody\">Tremor International acquires Amobee ($239M)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">2023<\/div><div class=\"tlbody\">Tremor rebrands as Nexxen; Yahoo shuts its own SSP<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">2024<\/div><div class=\"tlbody\">Equativ and Sharethrough merge; Walmart completes Vizio ($2.2B)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">2026<\/div><div class=\"tlbody\">Viant acquires TVision ($40M); Walmart agrees Vibe.co ($1.4B); Fox agrees Roku (~$22B)<\/div><\/div><\/div><figcaption> <span class=\"credit\">Source: Deal prices as disclosed in SEC filings and company announcements; see chapter sources.<\/span><\/figcaption><\/figure>\n\n\n\n**Rubicon Project + Telaria → Magnite (2020).** Rubicon Project, an ad exchange founded in 2007 by Frank Addante and colleagues from the ad network L90, and Telaria, the rebranded sell-side remnant of Tremor Video, announced a stock-for-stock merger on December 19, 2019, which closed April 1, 2020; the combined company took the name Magnite on June 30, 2020 [11]. Telaria shareholders received 1.082 Rubicon shares apiece, leaving Rubicon's own shareholders owning roughly 53% of the combined entity [11] — meaning this was closer to a takeover of Telaria by the larger, longer-established Rubicon than a merger of equals, notwithstanding the industry framing of it as building \"the largest independent sell-side platform.\" The strategic logic was straightforward: Rubicon brought open-web display and exchange scale; Telaria brought CTV-specific product and the Dish/Sling relationship. Neither alone had both.\n\n**Magnite's SpotX acquisition (2021).** Eleven months after becoming Magnite, the company announced on February 5, 2021 that it would buy SpotX from RTL Group for $1.17 billion — $560 million in cash plus roughly 14 million Magnite shares [12]. SpotX brought $116 million in 2020 net revenue, $67 million of it CTV-related [12], plus deep relationships with broadcasters and pay-TV operators that Magnite's own CTV book, built mostly through Telaria, did not yet have. This is the deal that made Magnite the largest independent CTV sell-side platform by inventory breadth — a claim substantiated by the two companies' combined publisher rosters rather than by any single disclosed revenue figure, since Magnite does not break out CTV revenue with SpotX isolated after integration.\n\n**Magnite's SpringServe acquisition (2021).** On July 1, 2021, Magnite announced it would acquire SpringServe, a CTV-specific ad server, for approximately $31 million net of a prior small investment, exercising an option Magnite had negotiated as part of the SpotX deal itself [13]. This is the smallest deal by dollar value in this history and arguably the most structurally important one, because it is the moment an independent SSP bought its way into ad serving rather than simply auctioning inventory that someone else's ad server released to it. SpringServe's listed clients at acquisition — Pluto TV, Sinclair Broadcast Group, Univision, and Vizio — gave Magnite a foothold on the decisioning layer itself, not just the auction beneath it, explicitly framed by Magnite as a way to offer publishers a full, independent alternative to walled-garden ad stacks [13]. In April 2025, Magnite unveiled a \"next generation\" of SpringServe that fully combines the ad server with the Magnite Streaming SSP into one product, with Roku named as an initial client [14] — the clearest available evidence that the ad server/SSP merger argued for here is structural, not incidental, is still actively being built out four years later, not a one-time integration that settled and stopped.\n\n**Comcast's FreeWheel.** Already covered above by date (2014, ~$320 million), FreeWheel is worth returning to for its going-concern status: as of Comcast's June 29, 2026 announcement that it will spin off NBCUniversal and Sky into an independent public company within roughly twelve months, FreeWheel and the newer Universal Ads product are expected to remain with Comcast's connectivity-and-technology business rather than following the media assets out the door [15]. Trade coverage flags real uncertainty about what that means in practice — whether FreeWheel stays commercially tied to NBCUniversal's media business under some continuing agreement, or becomes a more genuinely neutral third-party ad server serving other publishers without an in-house content conflict of interest, is explicitly undisclosed as of this writing [15]. That is a live open question, not a settled fact, and it is worth being direct about the fact that Comcast itself, the one party with the answer, has not said which.\n\n**IAS's acquisition of Publica (2021).** Integral Ad Science, a company built on ad verification and brand safety measurement rather than ad serving, bought Publica — a Palo Alto CTV ad server offering unified auction, pod management, and SSAI tools — for $220 million in cash and stock, announced in August 2021, less than two months after IAS's own June 2021 IPO [16]. The strategic logic here runs opposite to Magnite's: a measurement company buying its way into the decisioning layer, on the bet that owning the point where the ad actually gets inserted gives it a measurement vantage point (and revenue stream) that pure verification never could. This is one of the clearer pieces of evidence that \"ad server\" and \"verification vendor\" were never as separate as their original business models implied — both want to sit at the moment of ad insertion, just for different reasons.\n\n**Nexxen's formation.** This is the most convoluted lineage in the category and worth laying out precisely because the rebranding obscures a real strategic pattern. Taptica International, an Israel-founded mobile ad network, renamed itself Tremor International in 2019 specifically to signal a video-first strategy [17] — note this is the \"Tremor\" of Tremor International, unrelated in ownership terms to the original Tremor Video/Telaria lineage discussed above, a naming collision that confuses a fair amount of trade coverage. Tremor International then assembled a full-stack video and CTV business through a sequence of acquisitions: Unruly, a video ad marketplace News Corp had originally bought for roughly $176 million in 2015, sold on to Tremor International in a January 2020 deal structured mostly as a 6.91%-of-Tremor equity stake to News Corp rather than cash, with a minimum revenue guarantee attached [18]; Spearad, a CTV-specific ad server, for $14.7 million in October 2021 [19]; and Amobee, a demand-side and TV-planning platform, for $239 million in 2022 [17]. In June 2023, Tremor International rebranded its entire portfolio as Nexxen — Amobee and Tremor Video's demand-side technology became Nexxen DSP, Unruly became Nexxen SSP, and Spearad became Nexxen Ad Server — with the parent company's legal name changing to Nexxen International in January 2024 [17]. Read as a whole, Nexxen's history is a demonstration that a company can build \"full-stack\" — DSP, SSP, and ad server under one roof — through opportunistic bolt-on acquisitions over roughly four years, rather than through the kind of single big-bang merger that produced Magnite; whether that slower, cheaper assembly produces a comparably coherent product is a fair question left here for the chapters that assess the current roster.\n\n**Equativ + Sharethrough (2024).** Equativ — itself the 2022 rebrand of Smart Adserver after a private-equity-backed roll-up — announced a merger with Sharethrough on June 12, 2024, with the deal reported to value Sharethrough between $100 million and $125 million [20]. Sharethrough itself was already a product of consolidation, having merged with the exchange District M in 2021 as both smaller players faced pressure from supply-path optimization — buyers concentrating spend through fewer, more trusted supply routes, which squeezes exactly the mid-sized independent exchanges that can least afford to lose volume [20]. The combined Equativ/Sharethrough entity fully unified under the single Equativ brand in June 2025, a year after the initial deal closed [20], illustrating a pattern visible across most of these mergers: the press release announcing the deal and the actual operational integration are typically separated by twelve to eighteen months, and treating the announcement date as the date two platforms became one system overstates how fast this industry actually merges its plumbing.\n\n**2024–2026: the deals that were not mergers.** The most consequential recent shifts in who holds sell-side power did not take the shape of acquisitions at all, which is itself a signal about where this market is heading. Netflix, which had relied on Microsoft's ad server and DSP technology since striking that partnership around its 2022 ad-tier launch, announced it would build its own in-house ad server and began weaning off Microsoft, testing in Canada in 2024 and launching its proprietary Netflix Ads Suite in the United States in April 2025 [21] — Microsoft remains a programmatic supply and demand partner, but no longer the ad-serving backbone. The Trade Desk, Google's Demand & Video 360, Magnite, and (from June 2025) Yahoo DSP became Netflix's new external programmatic partners [21]. Amazon, meanwhile, expanded Amazon Publisher Cloud — a clean-room-based collaboration tool that became generally available to web and streaming-TV publishers in the US and Canada in June 2024 — into an increasingly assertive curation product, adding outcome-based, automatically curated deal packages exclusive to Amazon's own DSP through 2025, and in June 2025 struck an exclusive integration with Roku giving Amazon DSP buyers direct access to an estimated 80 million US CTV households, live from Q4 2025 [22]. Neither of these is a traditional M&A transaction, and both matter more to the current balance of sell-side power than most of the acquisitions above, because both are platform owners building or buying their way around the independent SSP layer rather than through it.\n\n## The Structural Blur: Why an Ad Server Is Not Just an Ad Server Anymore\n\nThe implication for anyone assessing this category: asking \"is Company X an SSP or an ad server\" is now close to a category error, and treating the two as cleanly separable — which most legacy market maps still do — will misprice the strategic position of nearly every company discussed above.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the path one streaming ad travels — and every point that takes a cut<\/div><div class=\"viz-flow\"><span class=\"flowstep cv-fade\" style=\"--d:0.00s\">Viewer presses play<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.08s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.16s\">Streaming app requests ads<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.24s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.32s\">Publisher ad server decides what to fill directly vs auction<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.40s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.48s\">Supply-side platform broadcasts the opportunity<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.56s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.64s\">Buyers&#x27; platforms bid in milliseconds<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.72s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.80s\">Winning ad stitched into the stream server-side<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.88s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.96s\">Ad plays; revenue flows back, minus each intermediary&#x27;s fee<\/span><\/div><figcaption> <span class=\"credit\">Source: Bid path as documented in IAB Tech Lab OpenRTB and MRC SSAI guidance.<\/span><\/figcaption><\/figure>\n\n\n\nThe traditional division of labor was clean enough in 2010: a publisher's ad server decided what to show, and when nothing sold directly, it called out to one or more SSPs to auction the leftover inventory programmatically. The ad server was the decision-maker; the SSP was the salesperson working the remnant. CTV broke that division in two ways simultaneously. First, SSAI concentrated decisioning at the point of stream assembly, as described above, which meant whoever ran the ad server increasingly controlled not just which campaign won but which programmatic paths were even allowed to compete — an ad server can throttle, prioritize, or exclude specific SSPs from ever seeing certain inventory, a form of leverage a pure auction house never had over its suppliers in the open-web era. Second, and more consequentially, the biggest streamers concluded that owning the ad server was strategically non-negotiable and moved to build or fully control their own: Netflix's 2025 in-housing is the clearest recent example, but Roku has run its own ad decisioning stack for years, and Disney, Paramount, and Warner Bros. Discovery all operate some form of proprietary ad-serving layer for their direct-sold and increasingly their programmatic inventory as well.\n\nWhy does a streamer running its own ad server change the outside SSP's job? Because the SSP's traditional value proposition — \"we hold the auction that decides who wins your remnant inventory\" — depends on the publisher genuinely not knowing, in advance, who the highest bidder will be. When the publisher's own ad server increasingly makes that call, using first-party data, direct deal terms, and yield logic the publisher controls end to end, the outside SSP's remaining job shrinks toward two things: bringing incremental demand the publisher's own sales team cannot reach, and providing technical rails — bid adapters, latency-optimized auction infrastructure, fraud and brand-safety plumbing — that the publisher would rather buy than build. Both of those are real, valuable jobs. Neither is the same job the SSP had in 2015, when it was often the primary mechanism by which any programmatic dollar reached the publisher at all.\n\nInto the gap this creates has stepped curation: a third layer, neither publisher-owned ad server nor classic auction-house SSP, in which an intermediary — sometimes an SSP itself, sometimes a standalone data or agency-adjacent player — assembles inventory across multiple publishers and multiple demand sources into a pre-packaged, already-optimized deal, sold under a single deal ID, typically layering in third-party or first-party audience data and increasingly AI-driven quality filtering [23]. AdExchanger's own framing of this shift is unusually blunt for trade coverage: publishers embracing sell-side curation are, in effect, \"wresting demand control from DSPs,\" while SSPs that stick to a pure inventory-access model risk losing relevance [23]. That framing should be read skeptically on one count — it comes substantially from curation vendors and the SSPs building curation products, who have an obvious commercial interest in describing curation as the industry's inevitable next stage rather than as one more fee layer stacked onto an already fee-heavy chain — but the underlying mechanism it describes (an intermediary making buying-adjacent decisions on the sell side, for a price) is verifiably real and growing, not merely a narrative. Whether curation is best understood as SSPs finally earning back the decisioning role SSAI took from them, or as a new toll booth dressed up as a service, is a genuinely contested question left here for the chapters that assess the current roster in detail.\n\n## The Roads Not Taken: Contingent Decisions That Shaped the Field\n\nIt is worth being explicit that little about this structure was inevitable — a market this concentrated, with this few genuinely independent players carrying meaningful volume, invites the assumption that the outcome was somehow determined by the technology. It was not; several genuinely contingent choices pushed the field this way rather than another.\n\nCTV never adopted client-side header bidding at anything like open-web scale, and the reason is mostly a hard technical constraint rather than an industry preference: streaming apps on smart-TV operating systems and connected devices generally do not execute arbitrary JavaScript in a browser-like environment the way a webpage does, so there is no \"header\" in which to run a simultaneous client-side auction [8][10]. Server-side alternatives like Prebid Server exist and are the closest CTV analogue, but running the auction on a server rather than the device reintroduces a central point of control that pure header bidding was specifically designed to remove from the publisher's ad server. Had smart-TV operating systems standardized earlier around a common, JavaScript-capable ad-rendering environment — something several industry proposals have periodically floated and none has achieved at scale — CTV's auction dynamics might look much more like the open web's. They do not, and that single technical fact is a meaningful part of why publisher-side decisioning power concentrated in ad servers rather than diffusing into a commoditized, publisher-agnostic bidding layer.\n\nDirect-sold, guaranteed inventory has also stayed dominant in CTV far longer than it did in open-web display, where programmatic auction volume overtook direct sales years ago. Recent FreeWheel data puts 68% of CTV ad spend in direct insertion orders, with programmatic guaranteed accounting for another 25% and only 7% moving through auction-based open exchange or private marketplace deals [24] — figures worth treating as directional given they come from a single ad server's own inventory mix rather than an independent market census, but broadly consistent with other trade estimates that put total CTV programmatic activity (guaranteed plus auction) in the 85–90% range once programmatic guaranteed is counted alongside true open auction [25]. The plausible explanation is that television advertising's buyer base — brand marketers and their agencies, historically transacting through upfront commitments and guaranteed reach, not real-time auctions — brought that purchasing culture with them into CTV, and premium streamers, protective of both pricing and brand environment, had every commercial incentive to accommodate it rather than push buyers toward an open auction that would compress their yield. This did not have to be the outcome; a streaming market that scaled up primarily through performance-marketing dollars rather than brand-upfront dollars might have tilted toward auction-based buying much faster, the way lower-funnel open-web display did.\n\nFinally, OpenRTB's request/response bidding model — the technical protocol, maintained by the IAB Tech Lab since a video subcommittee including Adap.tv and BrightRoll helped extend it from mobile to video in 2011 [26] — was built around a single-impression, single-response transaction model that assumes each ad slot is auctioned independently and near-instantaneously. That model works well for a single pre-roll slot but strains against CTV's real inventory unit, the pod: a sequence of several consecutive ad slots within one commercial break that ideally should be filled coherently — no direct competitors back to back, sensible category separation, frequency management across the whole pod rather than slot by slot. OpenRTB has been extended repeatedly to handle pod-level bidding, but the protocol's foundational architecture was not designed around the pod as the primary unit, and that mismatch is a real, still-unresolved source of friction in how CTV auctions actually clear — a constraint baked in by a standards decision made years before CTV pods were the volume driver they are today.\n\n## The Debates That Are Still Live\n\nThe specific value of tracing these debates to their origin: nearly every fight playing out in 2026 trade press about CTV's sell side is a rerun of an argument that started in open-web display a decade earlier, which means the earlier debate's resolution — or lack of one — is a reasonable base rate for how the CTV version will go.\n\nTransparency and fee disclosure is the oldest and least resolved of these. The Association of National Advertisers, working with PwC, published its first major programmatic supply-chain transparency study in 2020 (technically an ISBA/PwC study covering UK spend, widely cited alongside the ANA's own parallel US-focused work), finding that only 51% of an advertiser's programmatic spend reached the publisher as working media — the rest absorbed across DSP fees, SSP fees, data costs, and unattributed \"fees unknown\" [27]. A more comprehensive ANA study published in December 2023 found the number had, if anything, worsened: only 36 cents of every dollar entering a DSP reached the consumer, with transaction costs — chiefly DSP and SSP fees — eating 29% of total spend [28]. The trajectory across those three years is itself informative: the industry's own trade body, funded by the advertisers who are the ostensible victims of this opacity, has now measured the problem twice and found it did not improve, which is reasonable grounds for skepticism toward any sell-side platform's claim that curation, agentic trading, or the next technology layer will finally fix transparency rather than adding one more fee-bearing hop to the chain.\n\nDuplicate and reseller supply — the same ad impression being offered for sale through multiple intermediaries simultaneously, forcing buyers to guess which path is the real one — produced the industry's actual technical response: ads.txt (2017) and its app/CTV-specific successor, sellers.json, alongside the OpenRTB SupplyChain object (schain), which lets a bid request carry a verifiable list of every intermediary that touched it on the way from publisher to buyer [29]. These tools genuinely reduce blind duplication and enable a buyer to see the full chain of resellers before deciding whether to transact — but they are disclosure tools, not prevention tools: a buyer can see that an impression is being resold through three intermediaries and choose to buy it anyway, at whatever margin stacking that implies, which is precisely what still happens across large swaths of programmatic CTV supply paths today [29].\n\nFrequency capping across sellers remains structurally unsolved rather than merely under-discussed. Because the same viewer's CTV device can be reached through multiple SSPs simultaneously — one showing up via FreeWheel on one app, another via Magnite on a different app, on the same television, in the same commercial break — no single intermediary has visibility into total ad exposure across a household, and the tools that would fix this (cross-platform frequency management, typically requiring either a shared identity signal or a centralized clean-room arrangement) are only partially built and adopted unevenly, a gap the chapters on identity and measurement pick up in more depth.\n\nAnd the question of whether the sell side should be making buying decisions at all — whether an SSP curating a deal, or an ad server prioritizing one demand path over another, is serving the publisher's yield or quietly substituting its own commercial judgment for the buyer's — is not new to curation. It is the same objection critics raised against waterfall prioritization in the 2010s (publishers and their ad-ops vendors picking winners by rank rather than by price) and against early programmatic guaranteed deals before that. Curation has simply given the argument a 2020s vocabulary.\n\n## Handing Off\n\nWhat this history establishes is the shape of the board, not who is winning on it: a sell side assembled from video ad-server lineages rather than built fresh for streaming; a decade of consolidation that produced today's roster of independent SSPs and platform-owned stacks through roughly a dozen disclosed deals; a structural blur between ad serving, auctioning, and curating that is still actively reshaping company strategy as of the Magnite SpringServe relaunch and the Netflix in-housing move, both within the last eighteen months; and a set of transparency, duplication, and decisioning-authority debates that have never been resolved, only re-litigated with new technology attached. The chapters that follow take up the current roster on its own terms — what each independent SSP and platform-owned sell-side operation actually carries in volume and economics today, and how attention measurement, performance buying, and agentic trading are pulling on the structure described here.\n\n## Open Questions\n\n- What FreeWheel's actual post-spin-off relationship to NBCUniversal will be — commercially tied successor or genuinely neutral third-party ad server — is undisclosed as of this writing and worth revisiting once Comcast's spin-off closes.\n- Whether curation genuinely improves buyer outcomes (via better-targeted, pre-optimized inventory) or is primarily a new fee layer has no independent, non-vendor-funded study available as of this writing.\n- Whether CTV's persistent direct/programmatic-guaranteed skew reflects a durable structural feature of television buying culture or a transitional phase that will compress toward open auction as buyer sophistication grows is genuinely unresolved in the sourcing available.\n- The precise current revenue or margin contribution of any single acquired asset (SpotX within Magnite, Publica within IAS, Spearad within Nexxen) is not separately disclosed post-integration in any source reviewed, which limits how confidently these deals can be scored as successes or failures in dollar terms.\n\n## Sources\n\n1. TechCrunch, \"Comcast Is Acquiring Video Ad Company FreeWheel For $320 Million,\" March 1, 2014, https://techcrunch.com/2014/03/01/comcast-freewheel/ — Tier 4/5; deal price and date for the FreeWheel acquisition.\n2. FreeWheel, \"About Us,\" https://www.freewheel.com/about — Tier 6 (company self-description); founders and founding year, used only as evidence of the company's own account of its origin, corroborated by independent press coverage of the acquisition.\n3. TechCrunch, \"AOL Is Acquiring Video Ad Platform Adap.tv For $405M,\" August 7, 2013, https://techcrunch.com/2013/08/07/aol-is-acquiring-video-ad-platform-adap-tv-for-405m/; MediaPost, coverage of Facebook/LiveRail 2014 acquisition — Tier 4/5; deal prices and dates for Adap.tv and LiveRail.\n4. CNBC, \"Yahoo to acquire video ad firm BrightRoll for $640M,\" November 11, 2014, https://www.cnbc.com/2014/11/11/yahoo-to-acquire-video-ad-firm-brightroll-for-640m.html — Tier 4; deal price, founding year, and closing date for BrightRoll.\n5. MarTech / MarTech Today, \"Telaria launches 'first complete video ad platform' for OTT,\" https://martech.org/telaria-launches-first-complete-video-ad-platform-for-ott/ — Tier 5; Tremor Video-to-Telaria rebrand and Dish/Sling relationship.\n6. GlobeNewswire / H.I.G. Capital, \"SpotX Fully Acquired by RTL Group,\" August 30, 2017, https://www.globenewswire.com/news-release/2017/08/30/1104091/0/en/SpotX-Fully-Acquired-by-RTL-Group.html — Tier 6 (press release, used for dates/facts of the transaction, not evaluative claims); SpotX founding and RTL ownership timeline.\n7. Industry ad-tech explainer coverage on header bidding vs. waterfall mechanics (Setupad, Attekmi, and similar specialist sources), aggregated — Tier 5/6; general mechanics and commonly cited 20–30% revenue-lift figure for header bidding versus waterfall, used descriptively given the figure recurs consistently across independent specialist sources but has no single authoritative citation.\n8. AdExchanger, \"AdExplainer: What Is Server-Side Ad Insertion (SSAI)?,\" https://www.adexchanger.com/adexplainer/adexplainer-what-is-server-side-ad-insertion-ssai/ — Tier 5; SSAI mechanics and its distinction from client-side ad insertion.\n9. Media Rating Council, \"Server-side Ad Insertion and OTT Guidance,\" August 2021, https://mediaratingcouncil.org/sites/default/files/Standards/083021%20SSAI%20and%20OTT%20Guidance%20%20FINAL.pdf — Tier 2 (standards body); authoritative definition and measurement guidance for SSAI.\n10. Industry coverage of Prebid Server as the CTV header-bidding standard (LtvAdx, xapads, and similar specialist blogs), aggregated — Tier 5/6; Prebid Server's role as the server-side header-bidding approach for CTV.\n11. Magnite (Rubicon Project) investor relations, \"Rubicon Project and Telaria Complete Merger Following Stockholder Approvals,\" https://investor.magnite.com/news-releases/news-release-details/rubicon-project-and-telaria-complete-merger-following-1 — Tier 1 (company/investor disclosure); merger terms, exchange ratio, closing date, and Magnite naming date.\n12. Magnite investor relations / SEC 8-K, \"Magnite to Acquire SpotX,\" February 2021, https://www.sec.gov/Archives/edgar/data/1595974/000138713121001803/ex99-1.htm; AdExchanger, \"Magnite Acquires SpotX For An Eye-Watering $1.17 Billion\" — Tier 1/5; SpotX deal price, structure, and SpotX 2020 revenue figures.\n13. Magnite investor relations / SEC 8-K, \"Magnite Acquires SpringServe, A Leader in CTV Ad Serving Technology,\" July 1, 2021, https://www.sec.gov/Archives/edgar/data/1595974/000159597421000042/a991springservepressrelease.htm — Tier 1; SpringServe deal price, structure, and named clients at acquisition.\n14. Magnite, \"Magnite Unveils Next Generation of SpringServe, Combining Its Streaming Ad Server and SSP,\" April 23, 2025, https://www.magnite.com/press/next-generation-of-springserve/ — Tier 6 (company press release, used as evidence of what Magnite states it shipped, corroborated by trade coverage); ad server/SSP product merger and Roku as initial client, going-concern confirmation as of 2025.\n15. ppc.land, \"Comcast breaks up as the traffic model dies and CTV measurement divides,\" and related ppc.land coverage of the June 29, 2026 Comcast spin-off announcement — Tier 5; FreeWheel's expected position within Comcast post-spin-off and the open question of its NBCUniversal relationship.\n16. PR Newswire, \"Integral Ad Science Acquires Connected TV Advertising Leader Publica,\" August 2021, https://www.prnewswire.com/news-releases/integral-ad-science-acquires-connected-tv-advertising-leader-publica-301352019.html; Broadcasting+Cable/Next TV coverage of the $220M price — Tier 5/6; Publica deal price, timing relative to IAS's IPO.\n17. Nexxen (formerly Tremor International), \"Tremor International Group Rebrands as Nexxen,\" June 2023, https://nexxen.com/tremor-international-group-rebrands-as-nexxen/ — Tier 6 (company release, corroborated by VideoWeek and TV Tech trade coverage); full Nexxen rebrand structure, Amobee acquisition price, and parent-company renaming timeline.\n18. TechCrunch, \"News Corp To Buy Unruly For $176M,\" September 16, 2015; Unruly/Tremor International, \"Tremor International Acquires News Corp's Unruly,\" January 2020, https://unruly.co/news/article/2020/01/05/tremor-international-acquires-news-corps-unruly/ — Tier 4/6; Unruly's original News Corp acquisition price and its 2020 resale terms to Tremor International.\n19. Yahoo Finance / Benzinga, \"Tremor Acquires Spearad For $14.7M,\" October 2021 — Tier 5; Spearad deal price and structure.\n20. Equativ, \"Equativ and Sharethrough Merge to Form One of the Largest Global Independent Ad Platforms and Marketplaces,\" June 12, 2024, https://www.equativ.com/press/equativ-and-sharethrough-merge; Equativ, \"Equativ and Sharethrough Will Now Operate Under Equativ Brand,\" June 2025 — Tier 6 (company release); merger date, reported valuation range (via Globe and Mail citation), and full-brand-unification timeline.\n21. Hollywood Reporter, \"Netflix Says Ad Tier Has 40M Users, Plans to Bring Ad Tech In-House in Shift From Microsoft\"; RTB House and streamtvinsider coverage of Netflix's 2024–2025 in-housing rollout and new programmatic partners — Tier 4/5; Netflix ad-server in-housing timeline and resulting DSP/SSP partner roster.\n22. Amazon Publisher Services, \"Amazon Publisher Services Unveils Suite of Innovations at Annual Summit 2025,\" https://aps.amazon.com/aps/resource/amazon-publisher-services-unveils-suite-of-innovations-at-annual-summit/ — Tier 6 (company release); Amazon Publisher Cloud's June 2024 general availability and 2025 curation and Roku-integration expansions, used as evidence of Amazon's own stated roadmap and corroborated by independent trade coverage of the Roku deal.\n23. AdExchanger, \"AdExplainer: The Rise Of Sell-Side Curation,\" https://www.adexchanger.com/adexplainer/adexplainer-the-rise-of-sell-side-curation/ — Tier 5; definition and mechanics of sell-side curation, and the framing (flagged above as vendor-adjacent) that curation is displacing DSP-side decisioning.\n24. FreeWheel-sourced industry data on CTV spend mix by deal type (direct/programmatic guaranteed/open auction), as aggregated in current trade and vendor coverage — Tier 5/6; direct-vs-programmatic CTV spend split, flagged as coming from a single ad server's own book rather than an independent census.\n25. Aggregated trade estimates (digitalapplied.com and similar specialist sources) on total CTV programmatic share including programmatic guaranteed — Tier 6; directional cross-check figure for total programmatic share, used cautiously given the vendor/content-marketing nature of the source.\n26. IAB Tech Lab, \"OpenRTB (Real-Time Bidding),\" https://iabtechlab.com/standards/openrtb/; OpenRTB GitHub repository history — Tier 2 (standards body documentation); OpenRTB's 2010–2011 origin, the video subcommittee's role in extending it to video, and IAB Tech Lab's 2014 formation.\n27. ISBA/PwC, \"Programmatic Supply Chain Transparency Study,\" May 2020, as summarized in ANA/TAG TrustNet coverage, https://www.tagtrust.net/insights/ana-programmatic-media-transparency-study — Tier 2 (industry-body-commissioned independent audit); the 51-cents-of-every-pound working-media finding.\n28. Association of National Advertisers, \"Programmatic Media Supply Chain Transparency Study,\" December 2023, https://www.ana.net/miccontent/show/id/rr-2023-12-ana-programmatic-media-supply-chain-transparency-study — Tier 2; the 36-cents-of-every-dollar finding and 29% transaction-cost figure.\n29. IAB Tech Lab, \"sellers.json Supply Chain Transparency,\" https://iabtechlab.com/sellers-json/; Index Exchange, \"Understanding Supply Chain Transparency: Ads.txt, Sellers.json, and SupplyChain,\" https://www.indexexchange.com/en-gb/index-explains/understanding-supply-chain-transparency/ — Tier 2/6; mechanics of ads.txt, sellers.json, and the OpenRTB SupplyChain (schain) object as disclosure (not prevention) tools against duplicate/reseller supply.\n30. Next TV / Beet.TV coverage of Invidi and Canoe Ventures (\"Invidi's Conexus Connects National Addressable Ads Across Distributors\"; \"INVIDI Ramps Up For CTV & Solving Addressable's Three Frictions\"), and AdExchanger coverage of Canoe/Beachfront programmatic tooling — Tier 5; founding years, ownership structure, and functional role of the pre-programmatic addressable-TV set-top-box infrastructure, flagged as lacking independently audited financials."}, {"order": 2, "file": "02_The_Independent_SSPs.md", "title": "The Independent SSPs — Who Actually Carries CTV Volume", "summary": "", "body": "# The Independent SSPs — Who Actually Carries CTV Volume\n\n## Bottom Line\n\nTwo independent supply-side platforms — a category of company that runs the auction on the publisher's or streamer's behalf and decides which buyers see which impressions — carry real, growing, disclosed CTV (connected TV, meaning ad-supported streaming on a television screen) dollars: Magnite and PubMatic. Everyone else in the independent tier is either much smaller (Nexxen, a distant but genuine third), unmeasurable by design (Index Exchange, which is private and does not break out CTV), or present in CTV mostly as a talking point rather than a balance-sheet line (Equativ, OpenX, Kargo). Yahoo, despite being named alongside these companies in trade coverage, is not a sell-side platform at all anymore — it shut its SSP in 2023 and now buys, not sells. Viant is a demand-side platform whose relevance here is a single asset, TVision, that it bought in May 2026 to sell attention data into other companies' sell-side auctions. The independent SSPs' economics are under genuine pressure: take rates are mostly undisclosed and, where independently estimated, run from the high single digits to the high twenties depending on deal type; buyers are actively narrowing the number of intermediaries they route spend through (supply-path optimization, or SPO); and curation — packaging inventory with data and selling it as a premium, pre-vetted deal — has become a second fee layer stacked on top of the first, provoking a live transparency fight that the companies profiled here are only partially winning.\n\n## The Roster, Sized Honestly\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 520\" role=\"img\" aria-label=\"A ranked ledger of independent CTV sell-side platforms sorted by disclosed evidence. Magnite shows 82.3 million dollars of Q1 2026 CTV contribution ex-TAC, 30 percent growth, and 51 percent of company contribution. PubMatic shows 18 percent CTV growth and 39 percent omnichannel video share. Nexxen shows 29.4 million dollars of Q1 2026 CTV revenue, 12 percent growth, and 36 percent of programmatic revenue. Index, Equativ, OpenX, and Kargo sit in an opaque tier with no disclosed CTV dollars.\">\n<text x=\"44\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">DISCLOSURE LEDGER &#183; INDEPENDENT SSPs<\/text>\n<text x=\"44\" y=\"47\" class=\"t-mono t-muted\" font-size=\"10.5\">ranked by current, CTV-specific evidence rather than press-release volume<\/text>\n<line x1=\"44\" y1=\"58\" x2=\"656\" y2=\"58\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<rect x=\"44\" y=\"82\" width=\"612\" height=\"54\" rx=\"3\" class=\"f-t1\" opacity=\".78\"/>\n<text x=\"66\" y=\"106\" class=\"t-mono t-inv\" font-size=\"13\" font-weight=\"bold\">1 &#183; Magnite<\/text>\n<text x=\"66\" y=\"124\" class=\"t-mono t-inv\" font-size
