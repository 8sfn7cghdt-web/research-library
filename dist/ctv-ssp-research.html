ase/2025/04/24/3067994/0/en/Pixalate-Unveils-Q1-2025-Global-Made-for-Advertising-MFA-Benchmarks-Reports-for-CTV-Mobile-Apps-and-Websites-701M-in-Estimated-Programmatic-Ad-Spend-Funneled-into-MFA-Websites.html — Tier 5/6. Current MFA spend estimate; vendor-produced but methodologically disclosed.\n57. Equativ/TVision attention-lift research, aggregated trade coverage, 2026 — Tier 6. Vendor-commissioned study; treated as a marketing claim, not independently replicated.\n58. Kargo/TVision attention research on Enhanced Branded Canvas, MarTech Cube, September 2025, https://www.martechcube.com/tvision-study-shows-kargos-ctv-creative-delivers-real-performance/ — Tier 6. Vendor-commissioned study; treated as a marketing claim.\n59. Magnite corporate history (Rubicon Project/Telaria merger, SpotX and SpringServe acquisitions), Adweek/VideoWeek/SEC filings aggregated via WebSearch, https://videoweek.com/2021/02/05/spotx-acquisition/ ; https://www.adweek.com/performance-marketing/rubicon-project-telaria-merger-rebrand-magnite/ — Tier 3/5. Confirms merger and acquisition dates and deal value.\n60. PubMatic founding and IPO history, aggregated company-history and IPO coverage, https://www.globenewswire.com/news-release/2020/02/20/1987801/0/en/PubMatic-Releases-OpenWrap-SDK-to-Enhance-Header-Bidding-Options-for-Mobile-Publishers.html — Tier 3/6. Confirms founding year, founders, OpenWrap launch, and December 2020 IPO price/valuation.\n61. Index Exchange founding history (Casale Media origins, 2015 rebrand), AdExchanger/paleoadtech.com oral-history interview with CEO Andrew Casale — Tier 5/6. Confirms company origin as Casale Media and 2015 rebrand under Andrew Casale.\n62. Nexxen corporate lineage (Marimedia/Taptica/Tremor International/Amobee acquisition), Amobee newsroom and Nexxen investor relations, https://www.amobee.com/newsroom/tremor-international-group-rebrands-as-nexxen/ — Tier 1/6. Confirms full acquisition and rebrand chronology from 2007 founding through the January 2024 Nexxen International Ltd. renaming.\n63. Nexxen DSP client case studies (H/L, Rhone, Toyota), Nexxen investor relations press release, February 2026, https://investors.nexxen.com/news-releases/news-release-details/ctv-proliferates-nexxen-and-hl-partner-smarter-data-driven — Tier 1 (for what is claimed). Company-selected case studies, not an audited client roster.\n64. ISBA/PwC Programmatic Supply Chain Transparency Study (first and second editions), ISBA/Marketing Week, 2020 and January 2023, https://www.isba.org.uk/knowledge/second-programmatic-supply-chain-transparency-study ; https://www.marketingweek.com/programmatic-supply-chain-transparency/ — Tier 2/5. Independent PwC-audited UK supply-chain study; no confirmed third edition located covering 2025-2026, noted as a disclosure gap in text."}, {"order": 3, "file": "03_The_Platform_Owned_Sell_Side.md", "title": "Who Owns the Screen Owns the Auction", "summary": "", "body": "# Who Owns the Screen Owns the Auction\n\n## Bottom Line\n\nThe largest and fastest-growing share of connected-TV (CTV — internet-delivered television watched on a set, as opposed to a phone or laptop) inventory in 2026 no longer needs an independent supply-side platform (SSP — the technology that lets a publisher auction its ad slots to many buyers at once) to reach a buyer. Amazon sells its own screen to its own demand-side platform (DSP — the technology an advertiser uses to bid across many publishers) and calls the overlap synergy, not a conflict. Roku, about to become part of Fox Corporation in a deal still awaiting shareholder and regulatory sign-off, built a real third-party marketplace and then handed its most valuable signal — logged-in viewer identity — to Amazon on an exclusive basis. Netflix built its own ad server from scratch rather than lease one, and is only now, grudgingly and partially, letting outside demand in. FreeWheel, the incumbent ad-serving layer for premium video, is a Comcast asset navigating its parent company's own breakup. And the television manufacturers — Samsung, LG, the Walmart-owned Vizio, TCL, Hisense — sell advertising off the home screen and the automatic content recognition (ACR — software embedded in a smart TV that identifies what's on screen regardless of the source, turning a television into a data-collection device) data stream, largely on their own terms. None of this makes the independent SSPs obsolete; it means they increasingly compete for what these platforms choose to release, not for inventory as a whole. That distinction — required, tolerated, or designed out — is the organizing question of what follows.\n\n## The Sell Side Splits in Two\n\nEvery dollar spent on CTV advertising in the United States now moves through one of two structurally different sellers. The first is the classic open ecosystem: a publisher without its own audience of buyers plugs into an SSP, which plugs into a DSP, which plugs into an advertiser's budget, and each layer takes a cut. The second is the closed loop: a company that owns the screen, the stream, or both, builds (or buys) its own ad server, sells directly to its own book of advertisers, and treats outside SSPs as an optional pipe for incremental demand rather than a required one. US CTV ad spend is projected to reach roughly $37.95 billion in 2026, up from about $33.4 billion in 2025, according to eMarketer estimates, and the Interactive Advertising Bureau's own 2026 forecast puts CTV growth at 13.8% year over year, the second-fastest of any channel behind social [1][2][3]. The overwhelming majority of that growth is landing inside platform-owned stacks, not inside the open exchange. Disney, Netflix, Amazon, Roku, and YouTube are the companies eMarketer credits with driving CTV programmatic supply expansion in 2026 — and every one of them is a platform seller with its own ad server, not a publisher renting one [4].\n\nThat matters because the economics of the two models are opposite. A publisher that routes inventory through an independent SSP typically gives up something in the range of 10% to 20% of the media dollar in SSP and exchange fees before the DSP takes its own cut — the exact number is opaque and contested, which is itself part of the story. A publisher that owns its ad server keeps that spread, at the cost of having to build the sales, ad-operations, and yield-management muscle an SSP would otherwise provide. The companies profiled here have concluded, in different ways and to different degrees, that the muscle is worth building. What follows works through each one, then returns to the spread itself: what a platform keeps by not paying an SSP, and the narrower set of reasons it might pay one anyway.\n\n## FreeWheel: The Incumbent Trying to Stay Neutral While Its Parent Splits in Two\n\nFreeWheel is the layer most of the CTV industry still runs through even when it doesn't realize it, and 2026 is the year its own ownership structure got complicated enough to raise real doubts about whose interests it serves.\n\nComcast bought FreeWheel for roughly $320 million in 2014, when it was a mid-sized video ad server serving networks like ESPN, Fox, NBCUniversal, and MLB.tv, and let it operate as a semi-standalone ad-tech unit rather than folding it fully into NBCUniversal [5]. That arm's-length structure was always FreeWheel's pitch to competing networks: buy ad-serving and marketplace technology from a company whose ultimate owner also happens to compete with you for ad dollars, but trust that the technology layer itself is fair. FreeWheel says its ad server sits behind the majority of the standard cable lineup and clients including Fox, NBCUniversal, Sky, and Turner have used it for years [6] — a claim that comes from FreeWheel itself and should be read as evidence of what the company asserts about its own reach, not an independently audited market-share figure.\n\nTwo 2026 developments reshape that story. First, Comcast launched Universal Ads in January 2025, a self-serve buying front door built on top of FreeWheel's plumbing that lets small and mid-sized advertisers buy premium streaming and — as of an April 2026 expansion — Comcast-owned linear inventory through one interface, competing directly against the self-serve simplicity of Meta and Google rather than against other TV sellers [7][8]. Universal Ads is genuinely cross-publisher: NBCUniversal, Paramount, Warner Bros. Discovery, A+E, AMC Networks, and Roku have all made inventory available through it [9]. That is FreeWheel's neutrality claim made concrete — a Comcast-controlled front door that a Comcast rival (Paramount, WBD) is nonetheless willing to sell through, because the alternative is ceding those small-advertiser budgets to Google and Meta entirely. Comcast's own framing is that Universal Ads exists to pull social-media ad dollars into television, not to advantage Comcast content over its rivals' [10] — worth noting as the company's self-interested account of its own motives, even where the product's cross-publisher design lends it some credibility.\n\nSecond, and more consequential: Comcast announced on June 29, 2026 that it will split into two public companies, spinning off NBCUniversal together with Sky into a separately traded entity, with the transaction expected to close roughly a year later, alongside a 12-month cross-holding period between the two companies [11][12]. Comcast keeps its broadband, wireless, and cable business — and it keeps FreeWheel [13]. This inverts FreeWheel's founding conflict rather than resolving it. Previously, the concern was that FreeWheel's biggest content parent, NBCUniversal, might get preferential treatment inside a stack it effectively co-owned. After the split, FreeWheel's investment in the shared ad-serving infrastructure that NBCUniversal, Paramount, and WBD all rely on will be made by a company — the post-split, broadband-and-wireless Comcast — that has no content business at all and therefore no obvious motive to tilt the auction toward any single seller. Whether that changes FreeWheel's competitive footing against Google's ad-serving stack, Magnite, and other premium-video technology is genuinely unresolved: part of FreeWheel's pitch to media companies has rested on the perception that Comcast-adjacency means stable, well-funded infrastructure, and that perception was built when Comcast was also a media giant [14]. A pure infrastructure-and-connectivity parent might invest in FreeWheel differently — for better or worse — than a media conglomerate did. This is a case where the honest answer is that nobody outside the two boardrooms yet knows how the commercial terms between FreeWheel and a departing NBCUniversal will be set, and no dated source as of July 2026 confirms the specifics.\n\nOn the marketplace side, FreeWheel has spent 2025 and 2026 expanding what it calls its Streaming Hub and Publisher Suite, adding partnerships with Fubo, LG Ads, Philo, Plex, TCL Ads, Telly, and Wurl, and signing an exclusive US ad-serving arrangement across Lionsgate's roughly 30 free ad-supported streaming television (FAST — advertising-funded streaming channels that behave like linear TV, requiring no subscription) channels [15][16]. This is FreeWheel functioning as a genuine SSP for companies too small to build their own stack — the category where an independent-style seller is closest to strictly necessary, because Lionsgate, Fubo, and Telly have neither the scale nor the balance sheet to run proprietary ad tech the way Amazon or Netflix can. That is FreeWheel's most defensible neutral-infrastructure role, and it is also the segment of the market an independent SSP could theoretically serve just as well, which is why FreeWheel's pitch increasingly leans on breadth and identity resolution across a fragmented FAST landscape rather than on being uniquely capable.\n\n## Amazon: The Same Company Sits on Both Sides of the Table\n\nAmazon is the starkest version of the buy-side-meets-sell-side problem in CTV, because it is simultaneously the platform most publishers want distribution from and the DSP most advertisers already use for everything else.\n\nOn the supply side, Amazon Publisher Services (APS) offers publishers tools including the Transparent Ad Marketplace and the Unified Ad Marketplace, aimed at helping non-Amazon publishers monetize their own inventory — Tubi, for instance, became the first publisher directly integrated with Amazon DSP through APS's Publisher Cloud, and Magnite struck a deal giving its SpringServe ad-serving customers access to demand running through Fire TV devices in exchange for Amazon getting more access to Magnite's own CTV supply [17][18]. That is Amazon acting, at least in this corner, as connective tissue for other people's inventory rather than only its own — a genuine, if narrow, case of Amazon behaving like a neutral supply-side intermediary.\n\nBut Amazon's own inventory dwarfs what it brokers for others. Prime Video's ad-supported tier, which became the default for subscribers in early 2024 unless they paid an add-on fee, reported reaching 315 million monthly ad-supported viewers globally as of an August 2025 figure Amazon has continued to cite through 2026 — a number the company itself set and that exceeds Netflix's competing 190-to-250 million range over the same period [19][20]. Read that comparison carefully: both figures are platform-reported reach metrics using each company's own definition of a \"viewer,\" not an independently audited currency, and Amazon's methodology (like Netflix's) counts estimated co-viewers within a household against a minute-of-viewing threshold, which inflates the number relative to anything a media-buying desk would treat as a hard household count. Amazon is also raising the price of ad-free viewing again — from $2.99 to $4.99 a month, a 67% increase, under a new \"Prime Video Ultra\" brand — which pushes more of its subscriber base toward the ad tier rather than away from it [21]. Prime Video sells this inventory overwhelmingly through Amazon's own stack: Amazon DSP, Amazon's demand-side buying tool, and increasingly through newer formats like shoppable and interactive ad units layered directly onto Amazon's own ad server [22].\n\nBeyond Prime Video, Amazon's CTV footprint includes Twitch (the live-streaming service, which carries an alternate-feed simulcast of Amazon's marquee live-sports property) and, as of August 2025, the absorption of Freevee — Amazon's former free ad-supported streaming app — directly into Prime Video, ending Freevee as a standalone brand and consolidating its FAST-style inventory under the Prime Video ad stack rather than a separate one [23]. Amazon's live-sports supply is now centered on Thursday Night Football, which the company says delivered a third consecutive year of double-digit viewership growth and reaches, across Thursday Night Football, Twitch, and Fire TV combined, an average monthly audience Amazon puts above 155 million [24][25]. All of it — Prime Video originals, Twitch, Thursday Night Football, the Fire TV home screen — sells predominantly through Amazon's own demand tools, not through a competing DSP buying against an open auction.\n\nThe buy-side scale that makes this a genuine structural tension, rather than a garden-variety walled garden, is that Amazon DSP is not a niche desk: it holds roughly 14% of global DSP spend and was, as of early 2026 industry tracking, the fastest-growing top-five DSP at about 24% year-over-year growth, trailing only Google's DV360 (roughly 32% share) and The Trade Desk (roughly 19%) [26]. Put those two facts together — Amazon owns hundreds of millions of ad-supported streaming viewers and simultaneously operates one of the three or four DSPs advertisers are most likely to already be spending through — and the \"fox guarding the henhouse\" framing that CTV buyers increasingly use about concentrated sell-side power applies to Amazon more directly than to almost any other company in the ecosystem [27]. Amazon's own account of this is that scale and unified measurement serve advertisers by closing the loop between an ad impression and a purchase on Amazon.com; critics inside the buy-side note that a company that is both the largest single retail media data source and a top-tier DSP has limited incentive to make its own inventory harder to win or its own targeting data easier for a rival DSP to replicate.\n\nThe Amazon-Roku data-sharing agreement, discussed below, is Amazon's clearest 2025-2026 move to extend its own DSP's reach into inventory it doesn't own outright — using data rather than acquisition to widen the moat.\n\n## Roku: Built the Marketplace, Then Sold the Keys to Amazon — and May Soon Belong to Fox\n\nRoku is the platform where the \"independent-marketplace-that-isn't-quite-independent\" pattern is clearest, and 2026 added a corporate-control question on top of the commercial one.\n\nRoku's ad business runs on two connected products: Roku Ads Manager, a self-serve tool for direct advertisers with no agency requirement, and OneView, Roku's demand-side platform for programmatic buyers and agencies, which extends beyond Roku's own hardware to reach inventory on Samsung, LG, and Vizio screens as well [28]. That breadth — a DSP built by a device manufacturer that also buys inventory on rival devices — is unusual, and it is the foundation of Roku's claim to be a genuine cross-platform marketplace rather than only a seller of its own screen.\n\nThe event that reshaped Roku's 2025-2026 story, though, was its exclusive data partnership with Amazon, announced in mid-2025 and rolled out to all US Amazon DSP advertisers by the fourth quarter of 2025. The deal gives Amazon's DSP exclusive third-party access to Roku's logged-in viewer identity signal — the first time Roku has shared identity data at the operating-system level with an outside company — letting Amazon DSP buyers target and frequency-cap across a combined pool the companies describe as roughly 80 million US CTV households, about 80% of the addressable market [29][30]. Early results cited by the companies claimed a 40% increase in unique viewers reached and a nearly 30% cut in wasted frequency for advertisers using the combined signal [31]. Those are company-reported pilot numbers, not third-party-audited results, and they should be read as evidence of what Amazon and Roku are telling the market rather than as an independently verified lift. Wall Street treated the deal as a real earnings driver regardless: at least one analyst raised Roku's 2026 revenue and EBITDA estimates roughly 5% and lifted its price target from $80 to $100 on the news [32]. The commercial logic is straightforward and slightly uncomfortable for anyone rooting for an open marketplace: Roku's most valuable asset — proof of who is actually watching, at the household level — is now most useful to advertisers when accessed through Amazon's buying tool specifically, which nudges spend toward Amazon DSP even on inventory that isn't Amazon's.\n\nRoku's own financial disclosures for the first quarter of 2026 show the ad business at real scale on its own terms: the company began breaking out Advertising as its own reporting segment for the first time, posting $613 million in advertising revenue, up 27% year over year, alongside a broader Platform segment (advertising plus subscriptions) of $1.13 billion, up 28% [33][34]. Roku also disclosed that ad spend flowing through third-party DSPs onto its platform jumped roughly 40% in the same quarter [35] — a figure that cuts both ways in the neutrality argument: it shows real, growing third-party demand reaching Roku's inventory, but it also shows how much of Roku's growth is now mediated through DSPs (Amazon prominent among them) rather than direct Roku sales relationships.\n\nThen, on June 15, 2026, Fox Corporation and Roku signed a definitive agreement for Fox to acquire Roku in a cash-and-stock transaction valuing Roku at approximately $22 billion, with Fox paying $96.00 in cash plus 0.9693 shares of Fox Class A stock per Roku share [36][37]. The boards of both companies have approved the deal unanimously, but as of this writing it still requires shareholder votes at both companies and regulatory clearance, and the companies themselves are guiding to a close in the first half of calendar 2027 [38] — meaning that despite extensive 2026 coverage treating the combination as effectively settled, it is, strictly, an announced and board-approved but not yet closed transaction, and any present-tense description of \"Fox-owned Roku\" would be premature. The strategic logic Fox has articulated is combining its sports, news, and entertainment content plus the Tubi streaming service with Roku's device platform, The Roku Channel, first-party data, and direct relationship with more than 100 million global streaming households [39]. If the deal closes as structured, it would fold one of the CTV sell side's largest ostensibly-independent marketplaces into a content company with its own inventory and its own reasons to prioritize it — the same structural conflict FreeWheel has carried for a decade, newly created at Roku. Trade coverage has already framed the acquisition as a move that, combined with Amazon's growing hold on Roku's demand pipe, puts genuine pressure on the independent SSPs that compete for the residual, non-exclusive slice of Roku inventory [40].\n\nRoku also operates a Data Cloud product, positioned to give advertisers, agencies, and platform partners access to Roku's audience intelligence — viewership habits, preferences, and identity signals — for planning, optimization, and measurement, extending the same asset that made the Amazon deal valuable into a broader data-licensing business [41].\n\n## Netflix: Built Its Own Stack, Then Cracked the Door Open\n\nNetflix took the most deliberate route of any major streamer to platform independence: rather than lease ad-serving technology from FreeWheel, Google, or anyone else, it built the Netflix Ads Suite in-house, initially with Microsoft as a technology and sales partner starting in 2022, and completed the transition to a fully in-house, globally operational stack by 2025 [42]. Microsoft has stayed on in a narrower role, but the ad server itself is now Netflix's own — the most extreme version of the \"why pay an SSP\" logic among the major streamers, undertaken by a company with the balance sheet and the engineering headcount to make owning the full stack economically rational in a way most publishers cannot replicate.\n\nHaving built the wall, Netflix has spent 2025 and 2026 deciding how many doors to cut into it. It has opened programmatic buying access to The Trade Desk and Google's Display & Video 360 as demand-side platforms, and to the independent SSP Magnite on the supply side, then added Amazon DSP audience targeting across all ad-supported countries by June 1, 2026, with Yahoo DSP access following in subsequent months [43][44]. That is Netflix choosing to let outside demand compete for its inventory, but on Netflix's terms and through Netflix's own ad server — DSPs bid in, but no outside SSP disintermediates the relationship between Netflix and the advertiser the way an SSP would for a publisher without its own stack.\n\nThe scale of that programmatic opening has grown quickly. Co-chief executive Greg Peters told investors on the April 16, 2026 first-quarter earnings call that programmatic buying was \"on its way to becoming more than 50% of our non-live ads business,\" and Netflix reported that programmatic inventory volume jumped by more than a third heading into the second quarter of 2026 [45] — though note the tense: this is a stated trajectory, not an achieved threshold, it is Netflix's own characterization of its own business rather than an independently audited figure, and \"non-live\" is doing real work in the caveat, since Netflix's highest-profile live events (its NFL Christmas Day games, WWE programming) remain sold in ways the company hasn't fully disclosed as programmatic or direct. Pricing data reported in trade coverage puts programmatic CTV inventory on Netflix in the $20–$30 CPM (cost per thousand impressions) range against $45–$65 for direct insertion orders [46] — a spread that illustrates exactly why Netflix, like every platform in this piece, prefers to sell direct wherever it can and treats programmatic as a release valve for what direct sales can't absorb.\n\nNetflix's ad-tier reach numbers moved fast and are worth treating with real skepticism about methodology consistency: 94 million monthly active viewers in May 2025, 190 million by November 2025, and a claimed 250 million by May 2026 [47] — each figure Netflix's own, using Netflix's own co-viewing-adjusted definition, and each cited without an accompanying explanation of what changed in the underlying math between measurements. Ad revenue is projected to roughly double year over year to about $3 billion in 2026, from roughly $1.5 billion in 2025 [48]. Set against Amazon's 315 million and roughly $68.6 billion in total 2025 advertising revenue across all of Amazon's businesses, Netflix's ad business, while growing fast off a low base, remains a minor fraction of Amazon's — a useful corrective to headlines that treat the two companies as equivalent-scale rivals in CTV advertising specifically [49].\n\n## The TV-Maker Sell Side: Selling the Home Screen and the Data Underneath It\n\nThe OEMs (original equipment manufacturers — the companies that physically build the television) occupy a different structural position from the streamers: they don't just sell ad slots inside content, they sell the screen itself — the home-screen tile grid a viewer sees before choosing anything to watch — plus their own bundle of FAST channels, plus, most valuably, the ACR data stream that tells advertisers what's actually playing on that screen no matter which app or input generated it.\n\nSamsung Ads runs on ACR data drawn from roughly 77 million smart TVs as of early 2026, down from about 88 million in late 2024 — a decline trade press attributes to slower TV replacement cycles and tightening privacy rules rather than to Samsung ceding market share [50]. Industry estimates put Samsung Ads revenue at roughly $700 million to $750 million annually as of early 2026 — an outside estimate, not a Samsung-disclosed figure, since Samsung does not break out advertising revenue separately in its public filings [51]. Samsung TV Plus, its FAST bundle, reported streaming-hours growth of 25% year over year and a 92% retention rate, alongside a new \"Immersive Carousel\" ad format launched across more than 70 million smart TVs in Europe in early 2026 [52]. On the regulatory side, Samsung settled a case with the Texas Attorney General in February 2026 concerning ACR data-collection practices — confirmation, as of this year, that ACR data collection remains a live legal exposure for TV manufacturers, not a settled question from a decade ago [53].\n\nLG Ad Solutions runs proprietary ACR technology across tens of millions of LG smart TVs globally, replacing what had been legacy technology licensed from Samba TV, and pre-installs LG Channels — its FAST service — on every TV running its webOS operating system, giving it guaranteed default distribution no competing FAST app enjoys on LG hardware [54][55]. That default-placement advantage is the OEM sell side's structural edge over any streaming app, including Netflix or Disney+: an OEM controls the home screen a viewer sees first, every time, regardless of what the viewer ultimately watches.\n\nVizio's ownership changed decisively before this year began: Walmart completed its roughly $2.3 billion acquisition of Vizio on December 3, 2024, after the deal underwent a full Federal Trade Commission antitrust review [56]. Through 2026, Walmart has moved to fold Vizio's ad business into Walmart Connect, its retail-media division, most visibly by acquiring the self-serve CTV ad platform Vibe.co for a reported $1.4 billion and integrating it alongside Vizio's smart-TV operating system and ad business, and by rolling out a unified Walmart-account login across new Vizio-OS and Walmart's \"onn\" branded TVs, tying streaming engagement directly to Walmart's retail identity graph [57][58]. Walmart's pitch to advertisers rests on closed-loop attribution — the ability to connect a CTV ad exposure directly to a Walmart purchase — with the company citing internal data claiming a median 44% view rate on Walmart Connect CTV campaigns and, in one case study, 98% incremental household reach beyond linear television for a single brand's campaign [59]. Those are Walmart's own reported results from its own case studies, and independent trade coverage has specifically flagged that Walmart-Vizio's CTV measurement faces what one analysis calls an \"incrementality hurdle\" — meaning outside skepticism exists about how much of that claimed lift would hold up under a neutral measurement standard [60].\n\nTCL and Hisense complicate the \"OEM sell side\" story in an important way: in the US specifically, both companies largely ship hardware running someone else's operating system rather than their own. TCL sells both Roku TV and Google TV models depending on the tier, and Hisense runs Google TV (and, in the US, sometimes Fire TV) across most of its current lineup, while its proprietary VIDAA operating system is used primarily outside North America, in Europe and other international markets [61]. That means TCL and Hisense US ad inventory largely flows through Roku's or Google's ad stacks rather than through a TCL- or Hisense-controlled exchange — the OEM sells the box, but Roku or Google sells the screen. Internationally, VIDAA is a real and growing ad platform in its own right: broadcaster Channel 4 in the UK, for instance, struck a 2026 partnership giving it access to VIDAA's home-screen inventory across Hisense, Toshiba, and Loewe-branded sets [62]. The upshot is that \"the TV-maker sell side\" is really two different businesses wearing similar branding — Samsung and LG genuinely own their stack end to end, while TCL and Hisense's US ad businesses are largely rentals inside Roku's or Google's stacks, with their own proprietary systems doing real, separate work abroad.\n\n## Publica: An Independent-ish Ad Server Living Inside a Measurement Company\n\nPublica occupies an unusual hybrid position that doesn't fit cleanly into either the platform-owned or the fully independent category. It is a CTV-specific ad server — the technology that actually assembles and delivers an ad break inside a stream — that Integral Ad Science (IAS), a publicly traded ad-verification and measurement company, acquired to build out its CTV business. Publica reports serving more than 6 billion ads across CTV every month, with publisher clients including Samsung, MLB, Paramount, Crunchyroll, E.W. Scripps, Fox, IGN, and Philo [63]. That is a self-reported scale figure from Publica itself, useful as evidence of the company's own claimed reach rather than an independently audited number, though the client roster spans enough recognizable, competing publishers to lend it some credibility.\n\nThe hybrid ownership matters for the neutrality question this piece keeps returning to. Publica's product — a unified auction, ad-pod management, server-side ad insertion, and audience management for its publisher clients — is structurally similar to what an independent SSP or ad server would offer, and unlike FreeWheel (owned by a content-adjacent broadband company) or Roku's marketplace (owned by a device maker about to be owned by a content company), Publica's parent, IAS, has no competing content business and no CTV inventory of its own to favor. That makes Publica's ad-serving layer plausibly closer to neutral than FreeWheel's or Roku's. But IAS's core business is measurement and verification — telling advertisers whether an ad actually ran, was viewable, and reached a real person — and owning the ad server that decides which ads run gives IAS visibility and potential influence over the very transactions its measurement arm is supposed to independently verify. In April 2026, IAS launched \"IAS Total TV,\" a suite explicitly built to bring \"linear-like\" transparency — genre, rating, language, show, and program-level data — to CTV buying, drawing aggregated data from Disney, NBCUniversal, Paramount, and Prime Video in addition to Publica's own publishers [64]. That expansion turns Publica-plus-IAS into something closer to a combined ad-serving-and-measurement utility that several of the largest platform sellers are voluntarily feeding data into — a bet by those publishers that a measurement company without content ambitions of its own is a safer place to pool comparative data than a rival streamer's own stack would be.\n\n## The Rest of the Field: Disney, Paramount, Warner Bros. Discovery, Fox/Tubi, and YouTube\n\nDisney built the most aggressively programmatic version of a platform-owned sell side among the traditional media companies. Its Real-Time Ad Exchange (DRAX) was launched with an explicit target — stated as early as 2021 — of moving more than half of Disney's ad revenue to programmatic sale by the end of 2024, and Disney says it is now on pace to exceed that and reach roughly 75% of ad revenue sold programmatically [65]. Rather than routing that programmatic volume exclusively through DRAX itself, Disney built \"DRAX Direct,\" giving Google's DV360 and The Trade Desk direct integration paths into Disney's inventory across Hulu and Disney+, and in 2026 extended DRAX into European markets, unifying roughly 15 EMEA campaigns onto Disney's global ad server and connecting DRAX to more than ten DSPs regionally [66][67]. Disney also struck a 2026 integration between DRAX and Amazon DSP specifically, opening Amazon's buyers into Disney+, ESPN, and Hulu inventory [68]. Notably, Disney has deliberately preserved paths for independent SSPs to keep competing for its inventory alongside DRAX Direct rather than routing everything exclusively through owned technology — trade coverage frames this as Disney managing multiple direct supply paths \"without disintermediating SSPs\" entirely, a more accommodating posture toward the independent sell side than Amazon's or Netflix's [69].\n\nParamount has taken a visibly more cautious position on programmatic CTV than Disney, publicly. In April 2026 the company unveiled \"Conduit,\" which it calls the industry's first global direct-integration layer connecting its ad inventory — spanning the now-merged Paramount+ and Pluto TV ad-tech stacks — to Magnite, Google Ad Manager, and Amazon Publisher Services demand, alongside adding dynamic ad insertion for live sports [70]. But a Paramount streaming advertising executive publicly cautioned that \"not every streaming experience should be bought the same way,\" a direct pushback against treating programmatic as the default for premium live sports and originals [71] — a useful reminder that even as every platform expands programmatic access, several of the biggest sellers are actively managing how much of their best inventory ever reaches an open auction versus staying in negotiated, direct, premium deals.\n\nWarner Bros. Discovery runs its own in-house programmatic-and-direct platform, and in 2026 pushed hardest among the traditional media companies on artificial-intelligence tooling specifically, revamping its ad-tech stack around agentic AI capabilities built with Amazon Web Services and introducing formats like shoppable pause ads and scene-level contextual targeting at its 2026 upfront presentation [72][73]. WBD's own executives were explicit that this was viewed, as of mid-2026 reporting on what may have been the company's last standalone upfront before further corporate restructuring, as accelerating human ad buyers and sellers rather than replacing them [74].\n\nFox's Tubi runs on AdRise, the proprietary ad platform Fox acquired along with Tubi, now positioned as the backbone of a broader \"OneFox\" converged-media effort unifying inventory and audience data across Fox Entertainment, Fox Sports, Fox News Media, and Tubi under one AI-driven planning and activation layer [75]. Tubi's own supply-side technology offers guaranteed and private-marketplace programmatic options with integrated DSP access and genre- and program-level reporting [76]. If the Fox-Roku acquisition closes as structured, AdRise and Roku's marketplace and DSP would sit inside the same parent company — a combination trade press has already flagged as giving Fox a uniquely large, self-contained inventory-plus-device-plus-marketplace stack, one of the strongest arguments yet for why an outside SSP's role in that combined footprint would shrink rather than grow [77].\n\nYouTube is the single largest destination for CTV viewing by a wide margin — Nielsen's Gauge measurement put YouTube's share of US television viewing at roughly 12.7% in the first quarter of 2026, ahead of Netflix and Disney, and eMarketer describes YouTube as offering the single largest pool of CTV ad inventory in the market given its scale and free-to-use model [78][79]. Alphabet disclosed, for the first time, that YouTube generated roughly $60 billion combined across advertising and subscription revenue for full-year 2025, with quarterly YouTube ad revenue alone running $9.88 billion in the first quarter of 2026 (up 10.7% year over year) and $11.06 billion in the second quarter (up 12.6%) [80][81][82]. Despite that scale, YouTube's CTV inventory sells almost entirely through Google's own stack — Google Ad Manager as the ad server, with DV360 and Google's AdX exchange as the primary buying paths — and access to Google's CTV monetization product for outside publishers or resale through independent SSPs has historically been granted to only a limited set of partners, making YouTube, in practice, one of the most closed major sell sides in CTV despite running on broadly \"programmatic\" rails internally [83]. In other words: YouTube proves that scale and programmatic sophistication are entirely compatible with keeping an independent SSP almost completely out of the transaction.\n\n## Attention, Outcomes, and the Agentic Pivot on the Platform Side\n\nThe platform-owned sell side is moving toward attention measurement and outcomes-based buying for a straightforward commercial reason: it lets each platform justify premium CPMs with a story better than \"trust our reach number.\" Amazon and Roku frame their data-sharing partnership explicitly in these terms — authenticated, logged-in identity that lets advertisers measure real reach and frequency rather than estimate it, with the companies' own pilot data claiming meaningfully higher unique-reach and lower wasted-frequency outcomes [84]. Samsung and LG are both building attention-prediction and \"peak moment\" ad-insertion products directly into their ACR-fed ad stacks, aiming to sell not just an impression but a moment the platform's own data suggests a viewer is actually watching closely [85]. Warner Bros. Discovery's shoppable pause ads and scene-level targeting, and Amazon's expanding interactive and shoppable Prime Video formats, are both bets that platform-owned inventory, sold with platform-owned attention and outcome data attached, is worth more than the same impression sold blind through an open exchange [86][87].\n\nAgentic AI — software agents that plan, bid, and optimize media buys with reduced human intervention — moved from pilot to genuinely competitive positioning across the platform sell side during 2026. Google integrated its Gemini model more deeply into Google Marketing Platform to extend agentic buying tools, and DV360's audience segments reportedly reached roughly 96% of ad-supported CTV households by mid-2026 [88]. NBCUniversal ran what it described as the first-ever use of AI agents automating live-sports inventory on linear television, tied to a major brand's Q1 2026 football-playoff investment, and set out plans for open-source buyer and seller agent standards later in the year [89]. Amazon pushed conversational, AI-driven ad formats from pilot into mainstream deployment across its properties in 2026, while extending partnerships that put its DSP and data in front of an increasingly wide set of other platforms' inventory — Netflix, Disney, Roku, Samsung, Spotify, SiriusXM, and LinkedIn among them [90]. One industry executive, DoubleVerify's general manager for CTV, put the shift bluntly: \"None of this existed in 2025... 2026 is the year where it really lights up across the board\" [91] — a claim from a measurement-company executive with a commercial interest in agentic buying being real and significant, worth weighing alongside the fact that independent SSPs including Magnite, PubMatic, and Viant announced their own competing agentic products in the same period, suggesting the platform sell side does not have this shift to itself [92].\n\nThe clear pattern across every platform in this piece is that attention data and agentic tooling are being built to strengthen the case for buying direct from the platform's own stack, not to make it easier for an outside SSP to compete on equal footing. A better attention signal or a smarter buying agent is most valuable to the platform that controls the underlying identity and viewing data, which in every case examined here is the platform itself rather than an intermediary sitting between it and the buyer.\n\n## The Analytical Spine: Required, Tolerated, or Designed Out\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 500\" role=\"img\" aria-label=\"A three-zone sorting diagram labels where independent SSPs are required, tolerated, or designed out. Required includes FAST and mid-sized publishers such as Lionsgate, Fubo, Philo, Telly, Plex, and Publica clients. Tolerated includes Netflix, Disney, Paramount, and similar owned ad servers that open selected demand doors. Designed out includes YouTube, Amazon, and a possible Fox-Roku combination, where the same owner can hold the screen, identity graph, buying tool, or content.\">\n<text x=\"44\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">REQUIRED &#8594; TOLERATED &#8594; DESIGNED OUT<\/text>\n<text x=\"44\" y=\"47\" class=\"t-mono t-muted\" font-size=\"10.5\">the platform-owned sell side sorts SSPs by need, not by sentiment<\/text>\n<line x1=\"44\" y1=\"58\" x2=\"656\" y2=\"58\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<rect x=\"44\" y=\"88\" width=\"176\" height=\"280\" rx=\"3\" class=\"f-t1\" opacity=\".78\"/>\n<rect x=\"262\" y=\"88\" width=\"176\" height=\"280\" rx=\"3\" class=\"f-t2\" opacity=\".28\"/>\n<rect x=\"480\" y=\"88\" width=\"176\" height=\"280\" rx=\"3\" class=\"f-t3\" opacity=\".30\"/>\n<text x=\"132\" y=\"116\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"13\" font-weight=\"bold\">REQUIRED<\/text>\n<text x=\"350\" y=\"116\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--text)\">TOLERATED<\/text>\n<text x=\"568\" y=\"116\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--text)\">DESIGNED OUT<\/text>\n<g class=\"t-mono\" font-size=\"9.5\">\n<text x=\"132\" y=\"148\" text-anchor=\"middle\" class=\"t-inv\">premium inventory,<\/text>\n<text x=\"132\" y=\"164\" text-anchor=\"middle\" class=\"t-inv\">not enough scale to<\/text>\n<text x=\"132\" y=\"180\" text-anchor=\"middle\" class=\"t-inv\">build the full stack<\/text>\n<line x1=\"72\" y1=\"196\" x2=\"192\" y2=\"196\" style=\"stroke:var(--bg)\" stroke-width=\"1\" opacity=\".5\"/>\n<text x=\"132\" y=\"220\" text-anchor=\"middle\" class=\"t-inv\">Lionsgate FAST<\/text>\n<text x=\"132\" y=\"238\" text-anchor=\"middle\" class=\"t-inv\">Fubo &#183; Philo<\/text>\n<text x=\"132\" y=\"256\" text-anchor=\"middle\" class=\"t-inv\">Telly &#183; Plex<\/text>\n<text x=\"132\" y=\"274\" text-anchor=\"middle\" class=\"t-inv\">Publica clients<\/text>\n<text x=\"350\" y=\"148\" text-anchor=\"middle\" class=\"t-muted\">owned ad server,<\/text>\n<text x=\"350\" y=\"164\" text-anchor=\"middle\" class=\"t-muted\">select outside doors<\/text>\n<text x=\"350\" y=\"180\" text-anchor=\"middle\" class=\"t-muted\">for incremental demand<\/text>\n<line x1=\"290\" y1=\"196\" x2=\"410\" y2=\"196\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"220\" text-anchor=\"middle\">Netflix<\/text>\n<text x=\"350\" y=\"238\" text-anchor=\"middle\">Disney DRAX<\/text>\n<text x=\"350\" y=\"256\" text-anchor=\"middle\">Paramount Conduit<\/text>\n<text x=\"350\" y=\"274\" text-anchor=\"middle\">FreeWheel neutral-ish<\/text>\n<text x=\"568\" y=\"148\" text-anchor=\"middle\" class=\"t-muted\">screen + identity +<\/text>\n<text x=\"568\" y=\"164\" text-anchor=\"middle\" class=\"t-muted\">demand path collapse<\/text>\n<text x=\"568\" y=\"180\" text-anchor=\"middle\" class=\"t-muted\">into one owner<\/text>\n<line x1=\"508\" y1=\"196\" x2=\"628\" y2=\"196\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"568\" y=\"220\" text-anchor=\"middle\">YouTube / Google<\/text>\n<text x=\"568\" y=\"238\" text-anchor=\"middle\">Amazon DSP + Prime<\/text>\n<text x=\"568\" y=\"256\" text-anchor=\"middle\">Roku + Amazon signal<\/text>\n<text x=\"568\" y=\"274\" text-anchor=\"middle\">Fox-Roku if closed<\/text>\n<\/g>\n<path d=\"M220,228 C236,228 246,228 262,228\" fill=\"none\" class=\"s-t2 cv-draw\" stroke-width=\"2.2\" pathLength=\"1\"/>\n<path d=\"M438,228 C454,228 464,228 480,228\" fill=\"none\" class=\"s-t3 cv-draw\" stroke-width=\"2.2\" pathLength=\"1\" style=\"--d:.12s\"/>\n<polygon points=\"254,222 266,228 254,234\" class=\"f-t2\"/>\n<polygon points=\"472,222 484,228 472,234\" class=\"f-t3\"/>\n<rect x=\"72\" y=\"310\" width=\"120\" height=\"36\" rx=\"2\" class=\"f-bg\" opacity=\".16\"/>\n<text x=\"132\" y=\"333\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"11\" font-weight=\"bold\">which SSP?<\/text>\n<rect x=\"290\" y=\"310\" width=\"120\" height=\"36\" rx=\"2\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"333\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--accent)\">how much?<\/text>\n<rect x=\"508\" y=\"310\" width=\"120\" height=\"36\" rx=\"2\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"568\" y=\"333\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--t3)\">why pay one?<\/text>\n<rect x=\"44\" y=\"400\" width=\"612\" height=\"52\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"62\" y=\"422\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">PLATFORM ARITHMETIC<\/text>\n<text x=\"216\" y=\"422\" class=\"t-mono t-muted\" font-size=\"9.5\">run your own stack and keep the 10&#8211;20% spread otherwise paid to a third-party seller<\/text>\n<text x=\"62\" y=\"440\" class=\"t-mono t-muted\" font-size=\"9\">The larger the owner of the screen, identity graph, content, and buying tool, the narrower the SSP&#8217;s room to earn its cut.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> The platform squeeze is a sorting problem: independent sellers remain required for publishers that cannot build the stack, tolerated by platforms that still want incremental demand, and designed out where screen, identity, content, and demand collapse into one owner.<\/figcaption>\n<\/figure>\n\n\nSorted honestly, the platform-owned sell side treats independent SSPs in three distinct ways, and the difference tracks almost exactly with each platform's own scale and technical capacity.\n\nAn independent SSP is genuinely required where a publisher has real premium inventory but neither the scale nor the balance sheet to build and maintain its own ad server, sales infrastructure, and yield-management team. FreeWheel's FAST-channel and mid-sized-streamer roster — Lionsgate, Fubo, Philo, Telly, Plex — sits here, and so does the segment of Publica's client base that looks similar. These publishers would lose meaningful revenue and operational capability without a third-party layer, and the competitive question for them is which third-party layer, not whether to use one at all. This is also the segment where the independent SSPs this piece deliberately does not profile — Magnite, PubMatic, Index, Nexxen, Equativ, OpenX, Yahoo, Kargo — compete hardest, because it's the one part of the market genuinely open to them on comparable terms.\n\nAn independent SSP is tolerated as an incremental demand tap where a platform already runs its own ad server and sells the overwhelming majority of its inventory direct, but keeps a narrower door open to outside demand for the remainder — usually the lower-value, harder-to-sell-direct tail of inventory, plus whatever incremental reach a specific DSP relationship can add. Netflix's opening to The Trade Desk, DV360, Magnite, Amazon DSP, and Yahoo DSP fits this pattern precisely: Netflix built the wall first and is choosing, deliberately and slowly, how many doors to add, on pricing terms (that $20–$30 versus $45–$65 CPM gap) explicitly designed to keep the best inventory direct. Disney's DRAX Direct and Paramount's Conduit occupy similar territory — genuine, functioning connections to outside demand, layered onto ad servers the platforms fully own and control, with the platform retaining the ability to decide how much inventory ever reaches that outside demand.\n\nAn independent SSP has been effectively designed out where a platform owns the screen, the identity graph, and — increasingly — a captive DSP relationship all at once, leaving no structural role for a third-party seller to fill. YouTube is the cleanest example: enormous scale, sophisticated internal programmatic infrastructure, and almost no meaningful path for an outside SSP to intermediate a transaction. Amazon is the sharper case, because the same company owns the inventory and the buying tool, which doesn't just exclude an SSP from the transaction — it removes any need for an arm's-length seller at all, since Amazon has limited incentive to make its own auction legible or competitive to an outside intermediary. If Fox completes its acquisition of Roku, that combination would move Roku's marketplace meaningfully toward this category as well, folding a device platform, a content company's inventory, and an ad-serving stack into a single owner with every incentive to keep the resulting margin in-house.\n\nThe economics underneath this sorting are consistent across every platform examined here. Running your own ad-serving and sales stack instead of paying an SSP means keeping the 10%-to-20%-of-media-dollar spread that would otherwise go to a third-party technology layer, plus retaining control over pricing, packaging, and which advertisers get access to premium inventory first. It costs real money and real engineering headcount to build and maintain — which is exactly why Netflix, Amazon, Disney, and the largest OEMs can do it and Lionsgate, Fubo, and Telly cannot. The reasons a platform with the resources to go fully in-house might still choose to route some inventory through an SSP or an outside DSP are narrower than they used to be, but real: incremental reach into a buyer's existing workflow (the reason Netflix opened to Amazon DSP rather than requiring every advertiser to build a bespoke Netflix buying relationship); a data or identity partnership that's worth more than the fee given up (the logic behind Roku's Amazon deal); or, for a company like Disney, a calculated bet that keeping SSPs and DSPs genuinely competitive for its inventory produces better long-run pricing than a fully closed system would, even if it costs some margin in the short run. None of these are charity. Each is a platform calculating that the fee it gives up buys more in incremental demand, data, or competitive pricing pressure than it costs — and that calculation is trending, across nearly every company profiled here, toward keeping more of the stack, and more of the margin, in-house.\n\n## Open Questions\n\n- What commercial terms, if any, will govern FreeWheel's relationship with a separated NBCUniversal once the Comcast spinoff completes, and will that arrangement preserve or undercut FreeWheel's claim to sell NBCUniversal-adjacent inventory on neutral terms?\n- Will the Fox-Roku acquisition close as structured in the first half of 2027, and if it does, will Fox preserve Roku's third-party marketplace and OneView DSP as genuinely open products, or fold them primarily toward Fox's own AdRise and Tubi inventory?\n- Will regulators — in the US or elsewhere — scrutinize Amazon's simultaneous ownership of major CTV supply (Prime Video, Twitch, Thursday Night Football) and a top-tier DSP the way antitrust authorities have scrutinized similar buy-side/sell-side combinations in open-web programmatic advertising?\n- Will Netflix's programmatic share of non-live inventory keep climbing past the \"more than 50%\" figure it has guided to, and will that trend extend to Netflix's live sports and events inventory, which has stayed comparatively opaque?\n- Will ACR-based OEM ad targeting face further state-level privacy enforcement beyond Samsung's February 2026 Texas settlement, and would stricter rules push more OEM ad revenue toward opt-in models that shrink the addressable ACR data pool?\n- Does Publica's dual role — CTV ad server and, through IAS, measurement and verification vendor — create a conflict serious enough to warrant the kind of independent-auditor scrutiny that measurement companies typically apply to platforms other than their own parent?\n- As agentic AI buying tools mature, will they primarily strengthen the platforms that already own identity and attention data, or will open standards (of the kind NBCUniversal has floated) meaningfully rebalance leverage back toward independent intermediaries?\n\n## Sources\n\n1. eMarketer, \"FAQ on CTV advertising: Trends, formats, and platforms to watch in 2026,\" 2026, https://www.emarketer.com/content/faq-on-ctv-advertising--trends--formats--platforms-watch-2026 — Tier 5. US CTV ad spend estimate for 2026 and 2025.\n2. MediaPost, \"IAB 2026 Ad Spend Forecast: CTV +13.8%, Social +14.6%,\" 2026, https://www.mediapost.com/publications/article/412351/iab-2026-ad-spend-forecast-ctv-138-social-14.html — Tier 5. IAB's 2026 CTV growth forecast.\n3. Adwave, \"How big is the CTV advertising market? (Q2 2026),\" 2026, https://adwave.com/resources/ctv-advertising-market-size-q2-2026 — Tier 5. Corroborating CTV market-size figures.\n4. Digital Applied, \"Programmatic Advertising Statistics 2026,\" 2026, https://www.digitalapplied.com/blog/programmatic-advertising-statistics-2026-data-points — Tier 5. Names Disney, Netflix, Amazon, Roku, YouTube as driving 2026 CTV programmatic supply growth.\n5. TechCrunch, \"Comcast Is Acquiring Video Ad Company FreeWheel For $320 Million,\" March 1, 2014, https://techcrunch.com/2014/03/01/comcast-freewheel/ — Tier 4. FreeWheel acquisition price and date.\n6. FreeWheel, \"About Us,\" https://www.freewheel.com/about — Tier 6 (company self-description). FreeWheel's own claim about its client roster and cable-lineup reach; treated as a company assertion, not an audited market-share figure.\n7. VideoWeek, \"Comcast Targets Social Media Advertisers with New Self-Serve Platform 'Universal Ads',\" January 7, 2025, https://videoweek.com/2025/01/07/comcast-targets-social-media-advertisers-with-new-self-serve-platform-universal-ads/ — Tier 5. Universal Ads launch details.\n8. Businesswire, \"Comcast's Universal Ads Makes Linear TV Self-Service, Bringing Incremental TV Reach to Advertisers of Any Size,\" April -across-its-iconic-portfolio-302452841.html — Tier 6 (company press release). OneFox/AdRise platform description.\n76. Fox Advertising, \"Tubi AdTech Solutions,\" https://www.foxadvertising.com/tubi/ad-products/ — Tier 6 (company page). Tubi's programmatic and DSP-integration capabilities.\n77. Digiday, \"Future of TV Briefing: Fox finds its programmatic identify in Roku,\" https://digiday.com/future-of-tv/future-of-tv-briefing-fox-finds-its-programmatic-identify-in-roku/ — Tier 5. Analysis of the combined Fox-Roku-AdRise footprint and implications for independent SSPs.\n78. Adwave, \"What is YouTube's share of TV viewing? (Q1 2026),\" https://adwave.com/resources/youtube-tv-viewing-share-q1-2026 — Tier 5. Nielsen Gauge YouTube share figure (12.7%, Q1 2026).\n79. eMarketer, \"YouTube holds the largest share time spent with TV,\" https://www.emarketer.com/content/youtube-holds-largest-share-time-spent-with-tv — Tier 5. YouTube's inventory-scale characterization.\n80. Tubefilter, \"Alphabet reveals YouTube revenue for first time: The video platform generated $60 billion in 2025,\" https://www.tubefilter.com/2026/02/05/alphabet-q4-2025-youtube-earnings-revenue-60-billion/ — Tier 4/5. First-time disclosure of YouTube's combined 2025 revenue.\n81. Deadline, \"Alphabet Q1 2026 Earnings: YouTube ad revenue,\" https://deadline.com/2026/04/alphabet-q1-2026-earnings-youtube-ad-revenue-subscriptions-1236876191/ — Tier 4. Q1 2026 YouTube ad revenue ($9.88B).\n82. Deadline, \"Alphabet Q2 2026 Earnings: YouTube's 13% Ad Revenue Growth Paces Results,\" https://deadline.com/2026/07/youtube-ad-revenue-rises-q2-2026-alphabet-billion-1237000530/ — Tier 4. Q2 2026 YouTube ad revenue ($11.06B).\n83. Google, \"Filling your CTV ad break with Google Ad Manager,\" https://blog.google/products/admanager/filling-your-ctv-ad-break-with-google-ad-manager/ — Tier 6 (company blog). Google Ad Manager's role as YouTube's CTV monetization backbone and limited third-party access.\n84. AdExchanger and
