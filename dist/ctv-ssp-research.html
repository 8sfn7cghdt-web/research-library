argin cushion is built into the CPO the platform quotes an advertiser.\n\nThat is a real and significant disclosure gap, and this chapter will not paper over it with an estimate. Where a company's public filings and trade coverage are silent on loss rates and hedge structure, the honest statement is that the industry has not shown its work.\n\n### Is the premium bigger than the risk — an open question, not a guess\n\nWhat can be said with more confidence is directional. A platform quoting a cost-per-outcome is, by construction, pricing in a margin above its own modeled expectation of the true cost-per-outcome, in the same way an insurer prices a premium above expected claims.\n\nThe open question — unanswerable from public disclosure at the time of writing — is whether that margin is large enough to cover the platform's true variance, or whether platforms are underpricing outcome risk to win share in a fast-growing, still-immature segment, the way new entrants in any risk-bearing business typically do before a cycle of losses forces a repricing correction. MNTN's own risk-factor language — flagging reliance on continued CTV and performance-marketing growth and macroeconomic pressure on ad spend as threats to its model — is one of the few places a company operating in this space discloses, in a legally binding document, that its business is contingent on a market condition rather than a proven, durable pricing edge [10].\n\nThat is a disclosure about market risk, not underwriting risk specifically, and the gap between the two is exactly where an honest accounting of this frontier's economics currently runs out of public evidence.\n\n## The Strongest Counter-Case\n\nGive this argument its full weight, because it is not a fringe objection — it is the accumulated finding of the most-cited empirical research in marketing science, and it argues directly against the frontier this chapter otherwise documents as a going concern.\n\n### The brand-building evidence\n\nByron Sharp's Ehrenberg-Bass Institute has built a multi-decade evidence base that brands grow primarily by expanding mental availability — how easily a brand comes to mind across as many buying situations as possible — and physical availability — how easy the brand is to find and buy — by reaching light and non-buyers who are not yet in-market, rather than by intensively targeting people who are already about to convert [30].\n\nPerformance marketing, by its own design, does the opposite: it is built to intercept buyers who are already searching, already in a retailer's app, already close to a decision, which means it captures demand rather than creates it [30].\n\nLes Binet and Peter Field's IPA-published research, \"The Long and the Short of It,\" found that campaigns over-weighted toward short-term activation metrics generate a visible short-term sales bump but do not translate into greater long-run profit growth. Their originally proposed 60:40 split between brand-building and short-term activation spend — later refined, in their 2023 follow-up \"Effectiveness in Context,\" into a range that varies by category, brand size and price point — exists specifically as a corrective against the exact reallocation performance-CTV platforms are built to accelerate [31].\n\nApplied directly to this frontier: a sell side that lets advertisers optimize every CTV dollar to last week's CPA is, on this evidence, helping advertisers win the current quarter at the expense of the brand equity that makes next year's customer acquisition cheaper. The sell side has a commercial incentive not to say so, because \"buy more brand, buy less performance\" is not a pitch that grows a performance-CTV platform's revenue.\n\n### The selection-effect critique\n\nThis critique compounds the brand-building objection rather than standing apart from it. Academic literature on TV advertising effectiveness measurement — including National Bureau of Economic Research working-paper research on generalizable TV effects — documents that ad exposure in real-world media buys is rarely random: campaigns are targeted at audiences already more likely to convert, which means a large share of measured \"performance lift\" is arguably relabeled reach rather than a genuine causal effect of the ad itself [32].\n\nA geo-lift or holdout test, done rigorously, controls for this. A raw pre/post comparison of exposed versus unexposed households — which is what a meaningful share of vendor-published \"lift\" case studies actually rely on — does not, and the industry's own MarTech coverage acknowledges that most CTV incrementality tests in practice suffer exactly this kind of contamination [20].\n\nThe specific figures cited earlier in this chapter — tvScientific's 30% better-than-target CPOs, iSpot and Roku's 23-31% lift for SimpliSafe, NBCU's 90% lift for State Farm, Nexxen's partner-cited 14x conversion lift — are each a single advertiser's or vendor's self-reported result, publicized by a party with a direct commercial interest in the answer, and none of them come with a disclosed methodology sufficient to rule out selection bias.\n\nThat does not mean the results are false; it means they are Tier 6 position evidence — proof of what the vendor claims, not independently audited proof that the claim is true — and should be weighted accordingly [1][13][14][16].\n\n### The sell-side-specific version: a fight CTV cannot win on cost\n\nThe sharpest version of the objection for this chapter's purpose is the sell-side-specific one: chasing performance buyers pulls premium CTV inventory into direct price competition with Meta and Google, and CTV cannot win that fight on cost-per-acquisition terms. CTV CPMs typically run $20 to $40, three to ten times Meta's own placements at roughly $6 to $9, and trade commentary is blunt that Google and Meta's AI-optimized, self-contained ecosystems are delivering 18 to 22% more conversions because they treat creative, audience and inventory as one continuously learning system that a fragmented, multi-publisher CTV supply chain structurally cannot replicate [33].\n\nAdvertising Week's framing of this dynamic is worth quoting because it states the sell side's dilemma without softening it: walled gardens \"won not because their placements are superior, but because their performance is\" [33].\n\nIf that is the standard performance CTV is being held to, then premium video inventory — expensive to produce, curated for brand safety, sold through a fragmented multi-party supply chain with real distribution and rights costs baked in — is being asked to compete on a cost basis engineered for a duopoly that owns its own inventory, controls its own auction, and pays no publisher take rate at all.\n\nThe counter to the counter-case is that premium environments still show materially higher completion rates — 95 to 98%, versus attention that visibly degrades in cluttered social feeds — and that the IAB's 2026 buyer-confidence data shows real skepticism about open-exchange inventory quality even among performance buyers, with 67% expressing low confidence in open real-time-bidding inventory versus 43% for direct and self-serve deals [4]. That suggests the market itself has not fully collapsed premium CTV into the same commodity bucket as social. But that confidence gap has not stopped the price competition from intensifying, and there is no evidence in the record collected for this chapter that it will reverse.\n\n## What Feeds This Frontier's Growth or Stall Through 2029\n\nSeveral concrete mechanisms are visibly operating that would push outcome-based buying toward becoming the dominant CTV transaction type by 2029, and several equally concrete forces could stall or reverse that trajectory. None of what follows is speculative narrative; each item is tied to evidence already documented above.\n\n**Toward dominance.** Self-serve infrastructure is now built and scaling, not hypothetical: Roku's $500 floor, Amazon's no-minimum Streaming TV product, and Walmart's incoming Vibe.co integration are live, dated 2025-2026 products, meaning the on-ramp for small and mid-sized performance advertisers now exists at every major seller [5][6][8]. This is the most concrete, hardest-to-reverse driver in this chapter, because it is capital already spent and infrastructure already shipped rather than a stated intention.\n\nRetail data is now structurally inside the sell side, not licensed across a wall after the fact: AMC's open-access expansion and Prime Video signal integration, and Walmart's Vizio-plus-Vibe.co combination, both advanced within the 2025-2026 window and both make outcome measurement a native sell-side capability rather than a bolted-on third-party add-on [8][17]. This driver is getting stronger as more retailers pursue the same integration. Target and Amazon each made competing shoppable-CTV moves within the same two-week window in late June 2026, which suggests the retail-data-onto-CTV pattern is becoming a competitive necessity rather than a differentiator any one retailer can hold exclusively.\n\nPublic-market proof of concept exists: MNTN's profitable, growing, performance-only business model is evidence that capital markets will fund and reward this approach at scale, which will draw more competitive entry from both new specialists and legacy sellers retrofitting similar products. This driver carries a caveat, since MNTN remains a single data point in a still-young public-company cohort for this business model specifically.\n\nSell-side targeting products are shifting from post-campaign reporting to pre-bid selection, which compounds the other two drivers rather than standing apart from them: OpenX and TVision's March 2026 attention-targeting product moves a performance-adjacent signal into the auction itself rather than leaving it as an after-the-fact scorecard, and if that pattern spreads across other attention and outcome vendors, it structurally locks performance criteria into how inventory gets bought rather than merely how it gets reported on [35].\n\n**Toward stall or reversal.** The economics of the guarantee are genuinely unresolved and could correct hard: no seller has disclosed loss rates on outcome guarantees, and if a market downturn or a wave of underperforming guarantees forces platforms to reprice CPOs upward or exit the guarantee business, the segment's growth curve would bend the way underpriced-risk businesses in other industries have bent when a downturn meets a pricing model built during a growth phase. This is a real structural vulnerability rather than an observed failure event in the record reviewed for this chapter, which is exactly what makes it worth flagging now rather than after it happens.\n\nMeasurement methodology has not converged, and buyers know it: the IAB's own 2026 survey shows real, majority-adjacent skepticism about inventory quality even in guaranteed and self-serve channels (43% expressing low confidence), and the currency transition away from Nielsen panel-only ratings is still actively changing metrics as of mid-2026, which keeps the ground buyers are pricing outcomes against unstable [4][29]. This is friction rather than a hard stop, but friction compounds when it is continuous rather than one-time.\n\nThe marketing-science counter-case has institutional weight and a decade-plus track record of being taken seriously by the CMO community: Binet & Field and Ehrenberg-Bass's evidence is not new or untested, and an advertiser base that over-rotates to performance CTV and then sees brand-health metrics erode has an established playbook — the 60:40 rebalancing — to fall back on. This driver operates on a slower cycle than the quarterly pressure pushing CMOs toward performance in the first place, since brand-health erosion typically shows up over multiple years rather than multiple quarters, which is exactly why the short-term incentive tends to win in any given budget cycle even when the long-term evidence argues against it.\n\nCommoditization pressure could push premium sellers to defend brand positioning rather than chase performance parity with Meta and Google — a fight the evidence above suggests CTV cannot win on cost terms. If premium publishers conclude, as Advertising Week's framing implies is already happening industry-wide, that CTV cannot out-optimize a duopoly on cost-per-acquisition, the rational sell-side response is to retreat toward brand-suitability and attention-based differentiation rather than compete head-on.\n\nThat would cap, rather than eliminate, how far performance buying penetrates the premium tier specifically, even as it continues to dominate the lower-tier and open-exchange inventory where the cost comparison to social is unavoidable. This driver is directionally supported by the CPM-gap evidence documented above, but it is not yet visible as an observed strategic retreat in the record collected for this chapter — it remains an inference about where the incentives point, not a documented fact pattern.\n\n### The most likely trajectory this evidence supports\n\nTaken together, this evidence does not point toward a clean resolution in either direction. Outcome-based buying is likely to keep growing in absolute dollars and to keep dominating the self-serve, small-and-mid-sized-business, and open-exchange tiers of CTV, where the infrastructure, the retail-data integration, and the cost pressure from walled gardens all point the same direction.\n\nThe premium, live-sports-and-tentpole tier of inventory is more likely to resist full performance pricing and instead sell a blend of attention credentials and outcome measurement as a package deal, rather than compete purely on cost-per-acquisition against Meta and Google. The sell side this frontier produces by 2029, in other words, is more plausibly a bifurcated one — split by inventory tier — than a uniformly converted one.\n\n## Open Questions\n\n- What percentage of guaranteed-outcome CTV campaigns actually miss their target, and what does the platform absorb when they do? No seller publicly discloses this, and it is the single most important unanswered number in this entire frontier.\n- Do rigorously controlled geo-lift or holdout incrementality results for CTV performance campaigns, aggregated independently of vendor case studies, show materially smaller lifts than the vendor-published figures cited in this chapter? No independent, cross-vendor academic audit of this gap was found in the sources reviewed here.\n- As Nielsen's currency metrics continue to shift through 2026, how much of the reported \"performance\" gains in this chapter reflect a genuine improvement in measurement accuracy versus a redefinition of what is being measured?\n- Will the emerging performance-linked hybrid deal structure — spend commitment with CPM floating against outcome thresholds — become a standardized, disclosed product, or remain an ad hoc negotiated arrangement? And if it standardizes, who sets the terms, buyer or seller?\n- Does the bifurcation this chapter's evidence points toward — premium tier resisting full performance pricing while lower tiers commoditize — actually hold through 2029, or does competitive pressure eventually force even premium sellers into outcome guarantees?\n- Why has MRC accreditation activity concentrated on viewability and auction transparency rather than on the causal-outcome claims behind guaranteed-outcome products specifically — is that a sequencing choice, or a sign the outcome claims are harder to accredit than the industry's marketing implies?\n\n## Sources\n\n1. tvScientific, \"tvScientific Launches Guaranteed Outcomes\" (press release) and \"What is Performance TV? Your Guide to CTV Advertising in 2026,\" tvscientific.com, 2025-2026, https://www.tvscientific.com/press/press-releases/guaranteed-outcomes — Tier 6 (vendor material); used only as evidence of the product's existence, launch date, beta customer list, and the company's own claimed performance figures, not as independent proof those figures are accurate.\n2. GSDSI, \"Identity Graphs 101: MAID, HEM, CTV, Household,\" gsdsi.com, 2026, https://www.gsdsi.com/resources/identity-graphs-101-maid-to-hem-ctv-ids-and-household-resolution — Tier 6 (specialist vendor/industry explainer); used for deterministic vs. probabilistic match-confidence figures and 2026 best-practice framing.\n3. eMarketer, \"The three forces that will shape CTV's 2026 growth\" and related eMarketer CTV spend forecast content, emarketer.com, 2026 — Tier 5 (analytical trade press); used for US CTV spend forecast and programmatic growth figures.\n4. IAB, \"Business Outcomes Are Just the Beginning\" (2026 Digital Video Ad Spend & Strategy Report press release), iab.com, July 14, 2026, https://www.iab.com/news/business-outcomes-are-just-the-beginning/ — Tier 2/3 (industry-association research report based on a fielded Advertiser Perceptions survey of 360 media executives, Feb-Mar 2026); used for buyer-confidence, objective-ranking, and inventory-skepticism figures.\n5. Starti Blog / AdWave, \"Best Self-Serve CTV Advertising Platforms in 2026,\" and AdWave, \"Best Self-Serve CTV Advertising Platforms for Small Business,\" 2025-2026 — Tier 6 (trade/comparison blog); used for Roku Ads Manager's disclosed minimum spend.\n6. MBA Digital Marketing Agency / Media Planning Tool, \"Amazon DSP & Streaming TV Ads Guide (2026)\" and \"Amazon DSP Review 2026,\" 2026 — Tier 6 (agency/vendor explainer); used for Amazon's self-serve Streaming TV minimum-spend policy change as of unBoxed 2025.\n7. Aggregated 2026 small-business CTV adoption trade commentary (Demand Local, AdWave, and related outlets) — Tier 6; used cautiously and flagged in-text as directional, non-audited survey data.\n8. Walmart Corporate Newsroom, \"Walmart to Acquire Vibe.co to Expand Access to Connected TV Advertising,\" corporate.walmart.com, June 23, 2026, https://corporate.walmart.com/news/2026/06/23/walmart-to-acquire-vibe-co-to-expand-access-to-connected-tv-advertising — Tier 1 (company press release, primary source for a corporate transaction); used for deal terms, strategic rationale, and closed-loop attribution description.\n9. Marketing Dive / Retail Dive / AdExchanger coverage of the Walmart-Vibe.co deal, June 2026, https://www.marketingdive.com/news/what-walmarts-vibeco-deal-means-for-ctv-retail-media-convergence/823941/ and https://www.adexchanger.com/tv/walmart-buys-vibe-co-to-woo-smbs-to-streaming/ — Tier 4/5; used for deal price ($1.4B), Vizio acquisition context ($2.2B, Dec 2024), and industry interpretation.\n10. MNTN, Inc., Form 10-K FY2025, SEC EDGAR, filed 2026, https://www.sec.gov/Archives/edgar/data/1891027/000189102726000019/mntn-20251231.htm — Tier 1 (SEC filing); used for revenue, growth rate, operating income, EBITDA margin, seasonality, and risk-factor disclosures.\n11. Sagum / StackAdapt / AI Digital programmatic-deal explainer content on CPA and programmatic guaranteed structures, 2025-2026 — Tier 6; used for the general industry framing of CPA risk transfer to publishers.\n12. idcomms, \"Outcome-Based Pricing vs Value: What CMOs Must Protect,\" idcomms.com, 2025-2026 — Tier 6 (agency-consulting commentary); used for the description of performance-linked hybrid deal structures.\n13. ppc.land / Deadline / iSpot.tv Hub, coverage of the Roku-iSpot \"Outcomes at Scale\" integration, January 6-7, 2026, https://ppc.land/roku-becomes-first-streaming-platform-to-optimize-ads-using-ispot-outcomes/ and https://www.ispot.tv/hub/roku-ads-optimized-for-outcomes-a-new-streaming-standard-powered-by-ispot/ — Tier 5/6 (trade press plus vendor hub content); used for the launch date, mechanism, and the SimpliSafe test-result figures, flagged as vendor-published.\n14. NBCUniversal, \"NBCUniversal Launches First-to-Market Cross-Platform Innovations... Ahead of CES 2026,\" together.nbcuni.com / nbcuniversal.com, January 2026 — Tier 6 (company press release); used for the LIVE Total Impact product and the State Farm lift figure, flagged as a self-reported single-advertiser result.\n15. Magnite, \"Magnite To Unify Curation and Activation Within ClearLine,\" globenewswire.com / investor.magnite.com, October 1, 2025, https://www.globenewswire.com/news-release/2025/10/01/3159421/0/en/Magnite-To-Unify-Curation-and-Activation-Within-ClearLine.html — Tier 1 (company press release via GlobeNewswire); used for the ClearLine product unification date and the 2024 statewide-race incremental-reach case-study figures.\n16. ppc.land, \"Nexxen bets on unified AI optimization to fix CTV's measurement gap,\" and Nexxen International, Q1 2026 and FY2025 investor releases, investors.nexxen.com, 2025-2026 — Tier 5/1; used for the AI performance suite launch date, programmatic and CTV revenue figures, the Yahoo DSP ACR data-licensing deal, and the partner-cited H/L conversion-lift figure, flagged as a case-study number.\n17. Amazon Advertising, \"Amazon Marketing Cloud launches Prime Video insights for enhanced audience understanding,\" advertising.amazon.com, November 2025, and Adweek, \"Any Amazon Seller Buying Sponsored Product Ads on Amazon Can Now Use Amazon's Clean Room,\" adweek.com, 2025 — Tier 1/4; used for AMC's open-access expansion and Prime Video signal rollout dates and geographic sequencing.\n18. PubMatic / BrightLine, \"PubMatic and BrightLine Partner to Turn Interactive CTV into Measurable Performance,\" investors.pubmatic.com / businesswire.com, December 4, 2025, and eMarketer coverage of the deal — Tier 1/5; used for the shoppable-format partnership details, publisher footprint (LG, Samsung, Vizio), commerce integrations (Rippl, Instacart), and the 41%/52% interactive-format adoption figures, flagged as PubMatic-cited survey data.\n19. Marketing Dive, \"LiveRamp boosts data clean room capabilities with Habu acquisition,\" marketingdive.com, 2024, and LiveRamp corporate blog content on Microsoft Advertising integration and clean-room measurement templates, liveramp.com, 2025-2026 — Tier 4/6; used for the Habu acquisition completion date, the independent-clean-room-market consolidation point, and clean-room usage-growth survey figures.\n20. MarTech, \"How to run a CTV incrementality test (and why most fail),\" martech.org, 2025-2026, and Lifesight / Jamloop coverage of geo-based incrementality testing, 2026 — Tier 5; used for incrementality-testing adoption figures and the acknowledged failure modes (contaminated control groups, underpowered samples).\n21. StackAdapt, Measured.com, and related 2025-2026 attribution-methodology commentary on multi-touch and last-touch attribution — Tier 6; used for the structural critique of MTA's cookie-dependent assumptions and the illustrative (vendor-modeled) 38%/63% CTV attribution-window figure, flagged in-text as a single modeled estimate.\n22. AdExchanger, \"What TV Advertisers Need To Know About Outcomes\" (EDO's Kevin Krim interview), adexchanger.com, 2024-2025, https://www.adexchanger.com/measurement/what-tv-advertisers-need-to-know-about-outcomes/ — Tier 5; used for the definition and rationale of intermediate-outcome measurement and the walled-garden sales-data fragmentation point.\n23. Mediaocean / Innovid, \"Mediaocean Completes Acquisition of Innovid\" and \"Mediaocean Unveils Innovid as Unified Brand,\" innovid.com / mediaocean.com, February and March 2025 — Tier 1 (company press releases); used for the merger completion date and rebranding.\n24. Ad Age, \"EDO to link outcomes data with VideoAmp, Kantar and Scibids,\" adage.com, 2025, and BusinessWire, \"EDO and The Trade Desk Bring New CTV Measurement Approach to Programmatic Media Buying,\" June 2025 — Tier 4/1; used for EDO's data-integration partnership expansion.\n25. The Current, \"Blockgraph, VideoAmp partner to tie TV ads to sales data,\" thecurrent.com, 2025-2026 — Tier 5; used for the identity/sales-data integration point.\n26. Comscore / Proximic, \"Comscore 2026 State of Programmatic Report,\" globenewswire.com, January 20, 2026, and StockTitan coverage of the Yahoo DSP and ESPN partnerships, 2026 — Tier 1/5; used for the buyer-survey figures and the political and sports measurement partnership dates.\n27. Media Rating Council, \"MRC Outcomes and Data Quality Standards,\" mediaratingcouncil.org, and TV Tech / BusinessWire coverage of MRC accreditation activity (DoubleVerify CTV viewability, April 2024; IAS Amazon DSP measurement, November 2025; Attention Measurement Guidelines update, November 2025; Auction Transparency Standards, January 2026) — Tier 1/4; used for the standards-and-accreditation history and the observed gap in outcome-specific accreditation.\n28. Ad Pulse / ppc.land, coverage of Nielsen's Panel-Only ratings retirement and the Big Data + Panel currency transition, 2025-2026, https://ppc.land/nielsen-alters-seven-tv-currency-metrics-forcing-buyers-to-re-check-august/ — Tier 5; used for the September 1, 2025 and January 1, 2026 transition dates.\n29. AdExchanger, \"Buyers Are Glad Nielsen Is Moving Away From Panel-Only Ratings\" and \"How Nielsen Is Shifting From Panel- To Person-Based TV Measurement,\" adexchanger.com, 2025-2026 — Tier 5; used for buyer sentiment on the currency transition and the mid-2026 metric-adjustment point.\n30. Ehrenberg-Bass Institute for Marketing Science, institutional research summaries on mental and physical availability, marketingscience.info, and Umbrex framework summaries of the Ehrenberg-Bass model — Tier 2 (peer-reviewed marketing-science institution, summarized via secondary explainer sources); used for the mental/physical availability framework underlying the brand-growth counter-case.\n31. IPA (Institute of Practitioners in Advertising), \"The Long and the Short of It: Balancing Short and Long-Term Marketing Strategies\" (Les Binet and Peter Field), ipa.co.uk, and WARC coverage of Binet's ongoing commentary, 2025 — Tier 2 (peer-reviewed/institutionally published marketing-science research); used for the 60:40 framework and its 2023 refinement in \"Effectiveness in Context.\"\n32. National Bureau of Economic Research, \"Generalizable and Robust TV Advertising Effects,\" NBER Working Paper w27684, nber.org, https://www.nber.org/system/files/working_papers/w27684/w27684.pdf — Tier 2 (peer-reviewed economics working paper); used for the selection-bias critique of real-world TV exposure measurement.\n33. Advertising Week, \"The Next CTV Battleground: Outcomes,\" advertisingweek.com, 2026, https://advertisingweek.com/the-next-ctv-battleground-outcomes/ — Tier 5; used for the CPM-comparison figures (CTV $20-40 vs. Meta $6-9), the 18-22% conversion-advantage claim for Google/Meta AI-optimized systems, and the \"won...because their performance is\" framing of walled-garden competition.\n34. eMarketer, 2026 CTV buyer-priority tracking coverage cited via aggregated 2026 CTV trends reporting (Teads, AI Digital) — Tier 5/6; used for the targeting-as-top-investment-criterion (49%, up 10 points) figure.\n35. ppc.land / OpenX / BusinessWire, \"OpenX and TVision Launch First Supply-Side Attention Targeting Solution for CTV,\" March 2026, https://www.openx.com/press-releases/openx-and-tvision-launch-first-supply-side-attention-targeting-solution-for-ctv-enabling-real-time-activation-on-high-engagement-inventory/, and Equativ, \"Equativ and Titan OS Launch Industry-First Programmatic CTV Home screen Video Ads,\" equativ.com, May 2026 — Tier 1/4; used for the pre-bid attention-targeting product launch, the 231 million-plus reach figure, the Titan OS home-screen format expansion, and the eMarketer 1.94% interactive-engagement figure."}, {"order": 6, "file": "06_AI_And_The_Agentic_Sell_Side.md", "title": "AI and the Agentic Sell Side", "summary": "", "body": "# AI and the Agentic Sell Side\n\n## Bottom Line\n\nThe AI that already earns its keep on the CTV sell side is unglamorous — bid filtering, yield\nprediction, fraud detection, forecasting — and it is saving real infrastructure cost and lifting\nreal yield today, quietly, without a press release. The AI that gets the press releases — LLM-based\ncontextual classification, deep-learning curation, and above all \"agentic\" trading — is mostly still\na claim, dated December 2025 through mid-2026, running at a scale of low thousands of deals against\na base of trillions of auctions. The most consequential fact in this chapter is not a product; it is\na protocol war. Model Context Protocol (MCP), the general-purpose standard for letting an AI model\ncall outside tools, has become the pipe that two rival advertising-specific standards — AdCP, built\nby a supply-side coalition, and the IAB Tech Lab's newly named AAMP — both run through, and\nwhoever's grammar wins decides who sits in the room when a media buy gets negotiated by software\ninstead of people. The disintermediation question this raises is genuine and unresolved: the same\nprotocol that lets a supply-side platform's agent sell inventory more efficiently also lets a\nbuyer's agent talk straight to a publisher's ad server and ask why the supply-side platform's toll\nbooth is still standing there. The evidence in mid-2026 leans toward entrenchment over erasure, but\nonly because the agents still need someone to guarantee delivery, audit the transaction, and hold\nliability when a model picks the wrong inventory — jobs an SSP already does and a stateless agent\ncannot yet do for itself.\n\n## The Unglamorous AI Is Where the Money Actually Is\n\nIf you want to know where artificial intelligence is generating real dollars on the sell side today,\ndo not start with the word \"agentic.\" Start with the plumbing nobody names on an earnings call as an\nAI feature, because it has been running for years and simply keeps getting better: deciding which\nbid requests are even worth sending.\n\nEvery time a household's connected TV app opens, a supply-side platform (SSP — the auction software\na publisher uses to sell its ad inventory to many buyers at once) can, in principle, ask every\ndemand-side platform (DSP — the buyer-facing counterpart that runs an advertiser's bidding) to bid\non it. In practice, doing that for real volume is a physical impossibility. PubMatic's own numbers\nmake the scale concrete: sending 50 billion impressions to 100 connected DSPs without any filtering\nwould generate five trillion potential bid requests — an amount of infrastructure no auction system,\nand no buyer's query-per-second budget, can absorb [1]. So sell-side platforms run machine-learned\nmodels — PubMatic calls its version Smart Throttling — that learn from historical bid activity to\npredict which DSPs are actually likely to bid, and at what price, and suppress the requests to\neveryone else [1][2]. This is the least visible AI on the sell side and the oldest: it is optimizing\ninfrastructure cost and win-rate density, not chasing a headline. Bid shading and floor-price\noptimization sit next to it in the same unglamorous bucket — machine-learned models that set and\ncontinuously adjust price floors and shade bids toward the actual clearing price rather than a\nmanually set number, generating measurable savings; industry estimates put first-price bid-shading\nsavings at roughly 20% of media spend for participating DSP partners, a figure that predates the\ncurrent agentic wave by several years and has nothing to do with it [4].\n\nFraud and invalid-traffic (IVT — non-human or otherwise illegitimate ad requests designed to extract\nad spend) detection is the same story with a sharper edge, because the fraud itself is now\nAI-generated. DoubleVerify reported detecting 140% more CTV fraud schemes in the first quarter of\n2026 than in the first quarter of 2025, identifying more than 50 distinct bot attacks and variants\nacross 2025 [4]. Crucially, the newest and hardest-to-catch vector is agentic AI bot traffic —\nautonomous systems built specifically to mimic human browsing and viewing patterns well enough to\ndefeat traditional pattern-based detection [4]. That is the honest state of AI on the sell side in\none sentence: the same class of technology that promises efficiency gains for a legitimate buyer's\nagent is already being weaponized to impersonate one, and detection vendors are now running\nmachine-learning models against machine-learning-generated fraud, an arms race with no natural\nstopping point. Forecasting — predicting future impression volume and revenue by inventory segment,\nused for everything from guaranteed-deal capacity planning to upfront commitments — rounds out this\ntier; it is the least discussed of the four because it produces no vendor claim worth marketing,\nonly a planning number that either turns out to be right or does not.\n\nThe pattern across all of this: none of it is branded \"AI\" in investor materials with the enthusiasm\nreserved for agentic trading, because none of it needed a large language model to work, and because\nnone of it is new enough to be a story. It is also, on the evidence available, the only tier of AI\non the sell side with disclosed, quantified, multi-year economic impact rather than a scale claim\nfrom a single vendor's internal test. That asymmetry — old AI with real numbers, new AI with\nmarketing numbers — is the frame for everything that follows in this chapter.\n\n## Curation and Contextual Targeting: Real Products, Self-Reported Lift\n\nContextual targeting — inferring what an ad should run against from the content itself, rather than\nfrom who is watching — has become central to CTV precisely because the industry's identifiers\n(household graphs, hashed emails, device IDs) are eroding under privacy law and platform\nrestriction, a dynamic covered at length elsewhere in this analysis. What is new in 2025 and 2026 is\nthat the classification engine doing the inferring is now frequently a large language model rather\nthan a keyword or metadata match.\n\nMagnite's clearest public claim here: an internal test comparing its CTV Contextual Signaling — an\nLLM-based classifier — against traditional genre targeting done by string-matching metadata fields\nshowed a 2 to 9 times increase in usable targeting scale, using one day of U.S. SpringServe\nprogrammatic ad-request data [5]. Two things are worth separating cleanly. First, what the\ntechnology does is plausible and not exotic: an LLM can read a show's title, description, and\navailable metadata and infer a content category or brand-safety-relevant theme that a rigid string\nmatch on inconsistent, publisher-supplied metadata would simply miss, which mechanically produces\nmore matchable inventory. Second, the number is a single internal test, on a single day, disclosed\nby the vendor selling the product, with no independent audit and no multi-week or multi-publisher\nreplication described in the public record. Treat the 2-to-9x figure as Magnite's claim about\nMagnite's product, not as an industry-verified lift.\n\nMagnite has stacked contextual partnerships fast. In June 2025 it integrated Anoki's ContextIQ,\nbecoming, by its own account, the first SSP to adopt that multimodal AI platform for scene-level\ncontextual video intelligence, giving buyers access through Magnite SpringServe to targeting derived\nnot just from metadata but from analysis of the video and audio content itself [6]. By February\n2026, Magnite was framing contextual signals as central — not supplementary — to how CTV inventory\ngets bought and sold in a post-identifier market, a claim consistent with the direction the industry\nhas been moving but still a vendor's framing of its own centrality [5]. Then in January 2026,\nMagnite and Cognitiv announced a real-time deep-learning data integration inside ClearLine,\nMagnite's unified curation and activation product: Cognitiv's neural-network models get embedded\ndirectly into the bidstream, so a buyer's curated deal can optimize toward a specific outcome KPI\nusing deep learning rather than static segment rules [7]. This is curation — the practice of a third\nparty (sometimes the SSP itself, sometimes a specialist data vendor) pre-filtering or scoring\ninventory before it reaches the buyer's algorithm, effectively inserting a paid decisioning layer\nbetween raw supply and the DSP's own bidding logic. It is one of the more commercially significant\nAI moves on the sell side because curation fees are a live and growing revenue line for SSPs, not a\nhypothetical one — though the exact economics of that fee stacking are outside this chapter's scope.\n\nIndex Exchange took a related but structurally different approach: rather than building or licensing\na single contextual AI, it opened a Data Vendor Ecosystem in February 2026 that embeds premium\nthird-party audience and contextual intelligence directly into its sell-side decisioning layer —\nIndex Marketplaces — drawing on partners including Experian, Audigent, Attain, DoubleVerify,\nDstillery, LiveRamp, Peer39, Proximic by Comscore, Samba TV, and The Weather Company [8]. Index's\npitch is platform neutrality: curators choose from an open list of data providers and activate them\nin deal IDs usable across any DSP, and — a genuine point of differentiation worth noting plainly —\nIndex states it does not charge data fees on top, unlike curation models elsewhere in the market\nthat layer a take on top of the underlying data cost [8]. Adelaide, an attention-quality vendor,\njoined Index Marketplaces in January 2026, and Adnami followed in June 2026, both extending\nsell-side curation into attention-adjacent signal [8]. None of these partnerships publish a\ncomparable lift figure to Magnite's; the claim being made is optionality and neutrality rather than\na specific performance number, and that absence of a headline statistic is itself informative about\nwhat each company believes its strongest sales argument to be.\n\nThe honest summary: contextual AI and curation are real, live, and being adopted by publishers and\nbuyers in 2026, which distinguishes them from pure agentic-trading vapor. But every lift number\nattached to them is vendor-disclosed, none has been independently replicated, and — as with\nattention measurement discussed in the adjacent chapter — a sell-side company has every incentive to\npublish the test that flatters its own contextual product and none to publish one that does not.\n\n## The Agentic Layer: The Real Story of 2026, and What \"Agent\" Actually Means\n\nStrip the marketing language and an \"agent\" in this context is a piece of software given a goal\nrather than a fixed set of instructions, which then decides for itself what steps to take to reach\nthat goal — querying data sources, evaluating options, and executing actions — instead of a human\nclicking through a workflow or a script running a hard-coded sequence. Applied to advertising:\ninstead of a media buyer manually building a campaign in a DSP's interface, a buyer describes an\nobjective and a budget in natural language; an AI agent interprets that brief, decides which\ninventory to evaluate, negotiates or accepts terms, and adjusts the campaign as it runs — with a\nhuman reviewing outcomes rather than executing every step.\n\nThat capability only becomes an industry, rather than one company's private tooling, if agents from\ndifferent companies can talk to each other in a shared language. That is what the 2025–2026 protocol\nstack is actually for, and it has three layers worth naming precisely, because the reader will meet\nall three in different vendors' marketing and they are not interchangeable.\n\n**MCP (Model Context Protocol)** is the general-purpose foundation: an open standard, originated by\nAnthropic in November 2024, that defines how an AI model calls external tools and retrieves external\ndata in a structured way — nothing advertising-specific about it at all. Its adoption trajectory\noutside advertising has been fast enough to function as infrastructure: from roughly 2 million\nmonthly SDK downloads at launch, to 22 million after OpenAI adopted it in April 2025, to over 10,000\nactive public MCP servers and 97 million monthly downloads by March 2026, with every major AI lab on\nboard [9]. In December 2025, Anthropic donated governance of MCP to a newly formed,\nLinux-Foundation-hosted Agentic AI Foundation, co-founded with Block and OpenAI and backed by\nGoogle, Microsoft, AWS, and Cloudflare — a deliberate move to make MCP a neutral, multi-vendor\nstandard rather than one company's property [9]. For advertising, MCP's relevance is entirely as\nsubstrate: it is the wire protocol that lets an advertising agent call an advertising tool, but it\nsays nothing about what a media buy, a flight, or a floor price actually mean.\n\n**AdCP (the Advertising Context Protocol)** is the advertising-specific grammar built on top of that\nwire. Launched publicly on October 15, 2025 by an industry coalition — PubMatic, Scope3, Yahoo,\nOptable, Swivel, and Triton Digital as founding members, with the effort led publicly by Scope3 CEO\nBrian O'Kelley — AdCP defines the actual vocabulary of a media transaction conducted by agents: how\nan agent discovers inventory, requests and receives a media plan, builds or requests creative,\nactivates an audience, and reports performance, all using MCP as the underlying transport [10][11].\nThe protocol's own documentation describes it as task-first and semantic — a layer that turns \"I\nwant reach against adults 25-54 who watch sports, $200,000 budget, three weeks\" into a structured,\nmachine-executable negotiation, rather than requiring a human to translate that sentence into DSP\nline items by hand [11]. AdCP's backers are notable for what they are not: this is not an IAB-led,\nbuyer-and-seller-balanced standards effort; it originated from a sell-side-and-adjacent coalition,\nwith PubMatic as the SSP most visibly attached to it and Scope3 — a company whose original business\nwas carbon measurement, now pivoted hard toward agentic infrastructure — as its most vocal champion.\nThat parentage matters for judging whose interests the protocol's design choices serve, and it is\nwhy a rival, more institutionally neutral effort emerged within months.\n\n**AAMP (the IAB Tech Lab's Agentic Advertising Management Protocols)** is that rival — or, in the\nIAB Tech Lab's own framing, complementary — effort. The IAB Tech Lab formally named its umbrella\ninitiative AAMP on February 26, 2026, explicitly citing a need \"to end market confusion\" among the\nproliferating agentic-advertising acronyms, a phrase that is itself a tell about how crowded and\nunsettled this space had already become within four months of AdCP's launch [12]. AAMP's structure\nis three layers stacked on the industry's existing, already-adopted transaction standards — OpenRTB\n(the real-time bidding protocol underlying most programmatic auctions), AdCOM, OpenDirect, VAST (the\nvideo ad-serving standard), and the Deals API — plus impression-measurement standards (OMID, ECAPI)\nand privacy frameworks (GPP, TCF) at the foundation; agentic protocols in the middle; and trust and\ntransparency at the top [12]. For 2026, the IAB Tech Lab's committed deliverables are open-source\nreference implementations of both buyer-agent and seller-agent SDKs, a neutral Model Context\nProtocol reference server, standardized agent profiles, and Protocol Buffers/gRPC mappings of the\nexisting specifications [12]. In March 2026, Kochava announced an open-source AI workspace,\nStationOne, built specifically on the IAB Tech Lab's AAMP buyer-agent SDK — an early, concrete\nsignal that AAMP is attracting independent implementation rather than remaining a framework document\n[12].\n\nWhere things actually stand in mid-2026: AdCP has the earlier launch and the first publicized live\ntransaction (covered below); AAMP has the institutional legitimacy of the IAB Tech Lab, whose\nexisting standards (OpenRTB chief among them) already run essentially the entire programmatic\nmarket, which gives it a plausible path to becoming the default even from a later start. Neither has\nanything resembling universal adoption. Both explicitly build on MCP rather than compete with it,\nwhich means the fight is not over the wire protocol — that argument appears settled in MCP's favor —\nbut over the advertising-specific vocabulary spoken on top of it, and over which institution's\ngovernance buyers and sellers trust to keep updating that vocabulary fairly. A reasonable read of\nthe incentives: AdCP was built fast by parties who wanted to move before a slower, more\nconsensus-driven body could set terms that constrained them; AAMP is the establishment's answer,\narriving once the establishment recognized the fast-mover's protocol was becoming a de facto\nstandard by default. Whether the two converge, whether AAMP absorbs AdCP's early lead, or whether\nthe market ends up running both depending on counterparty, is genuinely unresolved and worth\ntreating as an open question rather than a settled one.\n\n## The Concrete Deployments: What Is Actually Transacting\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 540\" role=\"img\" aria-label=\"A three-column proof ledger compares the three frontier bets of the CTV sell side. Attention has live integrations and TVision's 5000-home panel but no CTV-specific MRC attention accreditation. Outcomes has self-serve floors, Walmart's 3.6 billion dollars of Vizio plus Vibe investments, and MNTN's 290 million dollars of 2025 revenue, but no disclosed guarantee loss rates. Agentic trading has PubMatic's 1000-plus deals and 30 campaigns, but only bundled emerging revenue and no public non-SSP disintermediation example.\">\n<text x=\"44\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">THE THREE FRONTIERS &#183; BURDEN OF PROOF<\/text>\n<text x=\"44\" y=\"47\" class=\"t-mono t-muted\" font-size=\"10.5\">attention, outcomes, and agents are real products; the
