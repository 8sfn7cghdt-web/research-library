=\"9.5\">Q1 2026 CTV contribution ex-TAC<\/text>\n<rect x=\"308\" y=\"96\" width=\"172\" height=\"26\" rx=\"2\" class=\"f-bg\" opacity=\".18\"/>\n<text x=\"394\" y=\"114\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"13\" font-weight=\"bold\">$82.3M<\/text>\n<text x=\"514\" y=\"107\" class=\"t-mono t-inv\" font-size=\"10.5\">+30% YoY<\/text>\n<text x=\"514\" y=\"124\" class=\"t-mono t-inv\" font-size=\"10.5\">51% of company<\/text>\n<rect x=\"44\" y=\"152\" width=\"612\" height=\"54\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<line x1=\"44\" y1=\"152\" x2=\"44\" y2=\"206\" stroke-width=\"4\" style=\"stroke:var(--accent)\"/>\n<text x=\"66\" y=\"176\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\">2 &#183; PubMatic<\/text>\n<text x=\"66\" y=\"194\" class=\"t-mono t-muted\" font-size=\"9.5\">CTV inside looser omnichannel-video bucket<\/text>\n<rect x=\"308\" y=\"166\" width=\"112\" height=\"26\" rx=\"2\" class=\"f-t2\" opacity=\".72\"/>\n<text x=\"364\" y=\"184\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"13\" font-weight=\"bold\">+18%<\/text>\n<text x=\"454\" y=\"177\" class=\"t-mono\" font-size=\"10.5\" style=\"fill:var(--text)\">FY25 video = 39%<\/text>\n<text x=\"454\" y=\"194\" class=\"t-mono t-muted\" font-size=\"9.5\">CTV +50%+ ex-political<\/text>\n<rect x=\"44\" y=\"222\" width=\"612\" height=\"54\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<line x1=\"44\" y1=\"222\" x2=\"44\" y2=\"276\" stroke-width=\"4\" style=\"stroke:var(--t4)\"/>\n<text x=\"66\" y=\"246\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\">3 &#183; Nexxen<\/text>\n<text x=\"66\" y=\"264\" class=\"t-mono t-muted\" font-size=\"9.5\">real third, different full-stack model<\/text>\n<rect x=\"308\" y=\"236\" width=\"142\" height=\"26\" rx=\"2\" class=\"f-t4\" opacity=\".72\"/>\n<text x=\"379\" y=\"254\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"13\" font-weight=\"bold\">$29.4M<\/text>\n<text x=\"482\" y=\"247\" class=\"t-mono\" font-size=\"10.5\" style=\"fill:var(--text)\">+12% YoY<\/text>\n<text x=\"482\" y=\"264\" class=\"t-mono t-muted\" font-size=\"9.5\">36% of programmatic<\/text>\n<rect x=\"44\" y=\"306\" width=\"612\" height=\"98\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"66\" y=\"331\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--text)\">OPAQUE TIER<\/text>\n<text x=\"66\" y=\"349\" class=\"t-mono t-muted\" font-size=\"9.5\">companies may be real; the CTV number is not public enough to rank<\/text>\n<g class=\"t-mono\" font-size=\"10\">\n<rect x=\"66\" y=\"368\" width=\"92\" height=\"22\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/><text x=\"112\" y=\"383\" text-anchor=\"middle\">Index<\/text>\n<rect x=\"170\" y=\"368\" width=\"92\" height=\"22\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/><text x=\"216\" y=\"383\" text-anchor=\"middle\">Equativ<\/text>\n<rect x=\"274\" y=\"368\" width=\"92\" height=\"22\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/><text x=\"320\" y=\"383\" text-anchor=\"middle\">OpenX<\/text>\n<rect x=\"378\" y=\"368\" width=\"92\" height=\"22\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/><text x=\"424\" y=\"383\" text-anchor=\"middle\">Kargo<\/text>\n<text x=\"505\" y=\"382\" class=\"t-muted\">no CTV dollars disclosed<\/text>\n<\/g>\n<text x=\"44\" y=\"442\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--accent)\">WHAT THE SHAPE SAYS<\/text>\n<text x=\"44\" y=\"461\" class=\"t-mono t-muted\" font-size=\"9.5\">The market looks crowded in logos, but thin in auditable CTV evidence: two public leaders, one smaller third, and a long shelf of private opacity.<\/text>\n<text x=\"44\" y=\"480\" class=\"t-mono t-muted\" font-size=\"9.5\">That opacity is not a footnote; it is the finding that makes take-rate and share claims hard to price.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> The independent roster only looks broad until it is sorted by disclosed CTV evidence: Magnite and PubMatic carry the investable facts, Nexxen carries a smaller but visible line, and the rest of the shelf disappears into non-disclosure.<\/figcaption>\n<\/figure>\n\n\nThe single most important fact about this market is how unevenly the disclosed numbers are distributed. Two companies file US-listed SEC reports naming CTV as a distinct revenue line and posting double-digit growth; the rest either don't disclose a CTV number, are foreign private issuers with thinner CTV granularity, or aren't public at all.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: only two independents show strong, disclosed CTV growth — three disclose nothing at all<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">7.5<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">15<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">22.5<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">30<\/text><rect x=\"136.3\" y=\"16.0\" width=\"56.0\" height=\"234.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"164.3\" y=\"10.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">30%<\/text><text x=\"164.3\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 164.3 268.0)\">Magnite<\/text><rect x=\"345.0\" y=\"109.6\" width=\"56.0\" height=\"140.4\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"373.0\" y=\"103.6\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">18%<\/text><text x=\"373.0\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 373.0 268.0)\">PubMatic<\/text><rect x=\"553.7\" y=\"156.4\" width=\"56.0\" height=\"93.6\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"581.7\" y=\"150.4\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">12%<\/text><text x=\"581.7\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 581.7 268.0)\">Nexxen<\/text><\/svg><figcaption> <span class=\"credit\">Source: Company Q1 2026 results (Magnite, PubMatic, Nexxen). Index Exchange, Equativ, OpenX and Kargo disclose no CTV figures and cannot be charted..<\/span><\/figcaption><\/figure>\n\n\n\n| Company | Status | Most recent CTV disclosure | CTV growth | CTV as share of the company |\n|---|---|---|---|---|\n| Magnite | US public (NASDAQ: MGNI) | CTV contribution ex-TAC $82.3M, Q1 2026 [1] | +30% YoY (no political comp) [1] | 51% of total contribution ex-TAC, first time over half [1] |\n| PubMatic | US public (NASDAQ: PUBM) | CTV revenue growth ex-legacy-DSP-buyer, Q1 2026 [4] | +18% YoY [4]; FY2025 CTV +50%+ ex-political [7] | Omnichannel video (CTV's reporting bucket) = 39% of FY2025 revenue [7] |\n| Nexxen | US-listed foreign private issuer (NASDAQ: NEXN) | CTV revenue $29.4M, Q1 2026 [9] | +12% YoY, Q1 2026 [9]; -19% YoY, Q4 2025 [11] | 36% of programmatic revenue, Q1 2026 [9] |\n| Index Exchange | Private | Not disclosed | Not disclosed | Not disclosed |\n| Equativ (incl. Sharethrough) | Private (Bridgepoint-owned) | Not broken out; CTV cited as a growth driver [16] | Not disclosed | Not disclosed |\n| OpenX | Private | Not disclosed | Not disclosed | Not disclosed |\n| Kargo | Private | Self-reported | +96% in 2024, self-reported, no dollar base given [19] | Not disclosed |\n| Yahoo | US public (part of Yahoo Inc.) | N/A — no SSP since 2023 [15] | N/A | N/A |\n| Viant | US public (NASDAQ: DSP) | CTV contribution ex-TAC up \"well over 40%,\" Q1 2026 [22] | Third straight year of >40% Q1 CTV growth [22] | Primarily a DSP; sell-side relevance is via TVision only |\n\nRead that table plainly: if the question is \"which independent SSPs move real, verifiable CTV money,\" the honest answer is Magnite first, PubMatic a clear second, Nexxen a real but much smaller third, and then a wall of companies whose CTV business is either invisible by disclosure choice (Index Exchange, Equativ, OpenX) or overstated relative to what they actually are (Kargo's marketing, Yahoo's continued inclusion in \"SSP\" roundups, Viant being counted as sell-side at all). That is the spine of everything that follows.\n\n## Magnite — the scale leader, and CTV is now the majority of the business\n\n**So what:** Magnite is the only independent SSP where CTV is not just growing but has become more than half the company. For a buyer or a streamer deciding which independent platform to build around, Magnite is the default answer on pure scale — but its own numbers show the growth is increasingly a story about a handful of named enterprise deals, not a broad base, and its take rates (never fully disclosed) are the industry's most-watched black box.\n\nMagnite's current shape is the product of consolidation, not organic build-out, which matters for understanding why its CTV stack looks the way it does. The company traces to Rubicon Project, a display-focused exchange founded in 2007, which merged with Telaria — itself a 2017 rebrand of an offshoot of the early video-ad pioneer Tremor Video, and by then already CTV-focused — in a stock-for-stock deal that closed April 1, 2020 and produced the Magnite name. Thirteen months later, on April 30, 2021, Magnite closed a $1.17 billion acquisition of SpotX, a company credited with building the first video ad exchange and, at the time, one of the two or three largest independent CTV sell-side businesses in its own right; two months after that, on July 1, 2021, it acquired SpringServe, the ad-serving platform that now anchors the unified CTV product [59]. In other words, three formerly separate, venture-backed CTV businesses (Telaria, SpotX, SpringServe) and one display exchange (Rubicon) were consolidated into a single company across roughly fourteen months, and the April 2025 \"unification\" of SpringServe and Magnite Streaming described below is best read as the final step of integrating assets Magnite had owned, but run separately, for four years.\n\nMagnite's first quarter of 2026 was the inflection point the company had been building toward for three years: CTV contribution ex-TAC (contribution ex-TAC is Magnite's core profitability metric — revenue net of the traffic acquisition costs, or TAC, it pays publishers, which is the cleanest available proxy for what the platform actually keeps before operating costs) hit $82.3 million, up 30% year over year, and for the first time crossed half of the company's total contribution ex-TAC at 51%, up from 43% a year earlier [1][2]. That capped a full 2025 in which CTV contribution ex-TAC reached $304.2 million, up 17% for the year (22% stripping out the drag from a heavy 2024 political-advertising comparison), while the fourth quarter alone grew 32% ex-political and CTV's share of quarterly contribution ex-TAC rose to 48% from 43% a year prior [3][5]. Total company contribution ex-TAC for full-year 2025 was roughly $676 million, implied by CTV's 45% share of the annual total [3], with adjusted EBITDA of $232.1 million, up 18% [23].\n\nThe product architecture behind that growth has consolidated hard in the past fifteen months. In April 2025 Magnite merged its two previously separate CTV products — SpringServe, the ad server it acquired that actually schedules and traffics streaming ad breaks, and Magnite Streaming, its programmatic SSP — into a single unified platform, arguing this collapses the operational gap between ad serving and auction decisioning for the same impression [6][20]. Layered on top is ClearLine, which Magnite restructured in October 2025 into a single curation-and-activation layer: buyers and curators can now discover, package, and price deals directly against Magnite's supply, pulling in first- and third-party audience data through a companion layer called Magnite Access [21]. The company's own promotional claim — that the unified platform now reaches 99% of US streaming supply on a dollar-weighted basis — comes from a March 2025 Jounce Media benchmarking report Magnite commissioned and cites; treat it as a vendor-favorable statistic corroborated by an independent research firm's methodology, not as an audited fact, since Jounce's benchmarking work is itself sold commercially to ad-tech clients [20].\n\nOn the partner roster, the going-concern-relevant names as of mid-2026 are Netflix, Disney, Paramount, Roku, LG Ad Solutions, Samsung, and Warner Bros. Discovery, plus NBCUniversal and Hulu in Magnite's own investor materials [1][3][8]. These are not static: Netflix opened its inventory to Magnite (alongside The Trade Desk and Google DV360) in May 2024 as one of Netflix's original three programmatic partners, with Yahoo DSP added as a fourth buying-side partner in June 2025 — Magnite's role is on the sell side of that arrangement, and one analyst report from mid-2024 put Magnite's expected take on Netflix programmatic dollars at roughly 3%, an estimate that has not been updated or confirmed by Magnite since [10][24]. Disney renewed its relationship with Magnite in October 2024 on a two-year term, meaning that deal is due for renewal around October 2026 — worth flagging as a live renewal risk within this forecast's horizon [8]. LG Ad Solutions renewed globally (North America, APAC, EMEA) in December 2024 [8]. The April 2025 SpringServe relaunch listed Disney, LG, Paramount, Roku, Samsung, and Warner Bros. Discovery as initial backers of the unified platform, which is the most recent primary-source confirmation that all six remain active Magnite partners [20].\n\nOn take rates — the percentage of gross ad spend an SSP keeps — Magnite is the most forthcoming of the majors, but even its disclosure is old and partial. On an earnings call, an analyst proposed take-rate estimates of roughly 4%, 8%, and 12% across Magnite's three internal CTV categories (self-serve exchange spend, its proprietary exchange, and fully managed service deals), and Magnite's CFO, while declining to confirm exact figures \"for competitive reasons,\" said the ranges were \"not too far off\" as an average [13]. That exchange is now several years old and Magnite has not repeated the disclosure since; an independent analyst's later reconstruction, using accounts-receivable timing to back into implied gross spend, put Magnite's company-wide blended take rate at roughly 11–12% for fiscal 2022 — broadly consistent with the CFO's informal confirmation, though again dated and not something Magnite has validated [14]. Compare that to The Trade Desk's disclosed demand-side take of roughly 20% of gross spend, and Magnite's blended CTV take looks structurally lower — consistent with a sell-side platform in a buyer-power-constrained market, but also meaning CTV growth at Magnite converts to profit dollars less efficiently than the topline growth rate alone suggests [14].\n\n## PubMatic — the disciplined second, betting hardest on agentic buying\n\n**So what:** PubMatic is real but smaller than Magnite by roughly a third on absolute CTV dollars, and its CTV reporting bucket (\"omnichannel video\") is looser than Magnite's — it is not a pure CTV number. Where PubMatic is genuinely differentiated is speed into production agentic AI buying, which by mid-2026 had moved from pilot to at least one publicly documented live campaign.\n\nPubMatic is structurally different from Magnite and Nexxen in one important respect: it was built as a single company from its 2006 founding in Pune, India (by Rajeev Goel, Amar Goel, and Mukul Kumar) rather than assembled through a string of acquisitions, and it owns and operates its own infrastructure rather than running primarily on public cloud — a long-standing PubMatic differentiator the company has argued gives it a cost advantage at scale, though that claim is PubMatic's own and was not independently benchmarked in this research. PubMatic built OpenWrap, its header-bidding wrapper (header bidding being the technique that lets a publisher run multiple SSPs' auctions simultaneously rather than sequentially, which is the base infrastructure nearly all modern programmatic selling depends on), starting in 2017, and PubMatic went public on NASDAQ in December 2020 at $20 a share, valuing the company at roughly $950 million at the time [60]. That IPO-era valuation is a useful anchor: PubMatic's market capitalization has moved substantially since, in both directions, as the company's growth story shifted from open-exchange display toward CTV and, most recently, agentic buying.\n\nPubMatic's total company revenue was $62.6 million in the first quarter of 2026, with adjusted EBITDA of $2.6 million [4]. Within that, CTV revenue excluding a departed legacy DSP buyer grew 18% year over year, with the Americas — about 80% of PubMatic's total CTV revenue — growing 13% [4]. For full-year 2025, PubMatic's disclosed bucket is \"omnichannel video,\" which bundles CTV with other video formats; that bucket grew 17% year over year excluding political spend and represented 39% of total FY2025 revenue, while the company separately claimed CTV revenue specifically grew more than 50% year over year ex-political [7]. Full-year 2025 total revenue came in at approximately $283 million, roughly flat to slightly down from 2024's $291.3 million on a reported basis — a reminder that PubMatic's total business is not growing the way its CTV line is, and that CTV's rise as a share of the mix is partly a function of decline elsewhere [7][25]. Fourth-quarter 2025 revenue of $80.0 million was itself down from $85.5 million in Q4 2024, though it beat PubMatic's own guidance range of $73–77 million, largely because 2024's fourth quarter carried unusually heavy political-advertising spend that did not repeat [26].\n\nPubMatic's relevant product architecture, as the assignment specifies, breaks into three pieces. OpenWrap is the header-bidding wrapper — the software publishers install to run PubMatic's auction alongside others — and remains the base infrastructure layer. Connect is PubMatic's curation platform, which the company says drives more than 25% higher effective CPMs for publishers using it, though that figure is PubMatic's own claim in a company press release and should be read as evidence of what PubMatic asserts, not as independently audited [17]. Activate is the buyer-facing self-serve layer that sits alongside Connect, giving agencies and brands direct discovery and activation against curated inventory [18]. Convert, launched in April 2025, is PubMatic's newest and most performance-oriented product: a commerce-media layer supporting sponsored product listings and closed-loop, sales-linked reporting across CTV and mobile, aimed squarely at the performance/outcomes-based buying shift the whole sell side is chasing [12]. PubMatic reports these newer lines — AgenticOS, Activate, Commerce Media, and Connect together — as \"emerging revenue,\" which grew more than 80% year over year in Q1 2026 and represented about 14% of total revenue, nearly doubling for a second consecutive year in FY2025 to reach roughly 10% of total revenue [4][7].\n\nOn named CTV publishers, PubMatic's most recent primary-source material cites Paramount, NBCUniversal, Sling, Philo, and LG Channels as direct streaming-publisher relationships, with Samsung TV Plus and Vizio also named as premium CTV partners [7][17]. A June 2026 partnership with Nielsen's Gracenote content-intelligence unit adds curated, content-level (e.g., live-sports) deal packaging to PubMatic's CTV supply, and an October 2025 partnership with MNTN and a Spectrum Reach distribution deal extend PubMatic's reach into performance-marketing demand and cable-operator inventory respectively [17]. As with Magnite, PubMatic has never disclosed a take rate, and there is no recent company statement to update the independent estimate cited above.\n\nWhere PubMatic has genuinely moved faster than its larger rival is agentic buying. PubMatic launched AgenticOS in January 2026, and by that spring had a documented production use case: the agency Butler/Till submitted a natural-language campaign brief through Anthropic's Claude, and PubMatic's agents interpreted the brief, generated a media strategy, initiated campaign setup, and continuously optimized pacing and targeting across PubMatic's supply — a genuinely live, named example rather than a roadmap slide [27]. PubMatic also launched \"Decision Fabric\" on AgenticOS, which gives partner decision-making models (i.e., third-party algorithms) a native environment inside PubMatic's own supply path rather than requiring an external call [17]. Independent trade coverage has explicitly framed this as a strategic divergence: PubMatic is betting its growth story on agentic AI while Magnite, with a much larger CTV base to defend, is growing through scale and partnership renewal rather than a comparable AI-first repositioning [28].\n\n## Index Exchange — genuinely private, and that opacity is itself the finding\n\n**So what:** Index Exchange is one of the programmatic industry's oldest and most respected independent exchanges, and it is simply not possible to state its CTV revenue, growth rate, or CTV share of business with any confidence, because the company discloses none of it. Any number attached to Index Exchange in this space should be read as an estimate, not a fact.\n\nIndex Exchange's history is longer than any other company in this chapter, and it partly explains why it has never needed to court public markets the way Magnite and PubMatic have. The company began in 2001 as Casale Media, a Toronto ad network founded by Joe Casale; his son Andrew Casale, then a teenager, helped build the technology and eventually took over as CEO when the business pivoted to become a pure ad exchange and rebranded as Index Exchange in 2015 [61]. That multi-decade continuity of leadership and ownership is unusual in an industry defined by acquisitions and IPOs, and it is one reason Index Exchange has been able to stay private and stay opaque on financials for as long as it has — there has been no liquidity event forcing disclosure, and no obvious near-term catalyst (an IPO filing, a competing bid) that would change that.\n\nIndex Exchange is privately held, Toronto-headquartered, and reported to have roughly 708 employees as of May 2026 [29]. Third-party revenue estimators put its total (not CTV-specific) annual revenue somewhere between $100 million and $250 million, with one aggregator citing a more precise $127.4 million figure — but these are third-party estimation-tool outputs, not filed or company-confirmed numbers, and should be weighted accordingly; treat the range, not the point estimate, as the useful information [29]. Index Exchange does not break out CTV revenue, CTV growth, or CTV's share of its business in any public materials identified, and no analyst or trade publication located in this research has produced a credible independent CTV-specific estimate either.\n\nWhat can be said with more confidence is about Index Exchange's positioning and product posture, since that is disclosed in its own product communications and corroborated by trade coverage. Index Marketplaces is Index Exchange's curation and what the company calls \"sell-side decisioning\" platform — the pitch being that decisioning (which impressions get offered to which buyers, at what price, with what data attached) should increasingly happen on the publisher's side of the auction rather than purely on the buyer's, which the company and independent trade coverage both frame as one of programmatic's fastest-growing capability areas heading into 2026 [30][31]. In October 2025, Index Exchange launched a \"Data Vendor Ecosystem\" extension of Index Marketplaces, and in February 2026 it added Cocie AI, a CTV-specific contextual-intelligence vendor, as a partner using Index Marketplaces for sell-side decisioning [30]. In the same month, Index Exchange embedded pre-bid attention scoring from xpln.ai directly into its SSP, processing an estimated 20 to 25 exposure signals per impression — share of screen, time in view, contextual clutter, and content alignment — through models calibrated against eye-tracking datasets, so that attention prediction happens before the bid rather than in post-campaign reporting [32]. On the transparency fight specifically, Index Exchange differentiates itself by claiming it does not charge an additional deal-curation fee on top of its standard take — meaning, if accurate, that Index Exchange's economics on curated deals are simpler (fewer stacked fees) than rivals that layer a separate curation charge [33]. That is Index Exchange's own claim about its own pricing practice, not something this research independently verified against a specific deal.\n\nThe one place a semi-independent data source speaks to Index Exchange's actual CTV footprint is Pixalate's Q2 2025 North America SSP market-share rankings, built from a sample of over 500 million CTV impressions across more than 4,600 Roku, Amazon Fire TV, Samsung, and Apple TV apps in June 2025. Index Exchange does not appear among the top three sellers on any of the four CTV platforms measured — Magnite, FreeWheel, PubMatic, Nexxen, TripleLift, and Verve dominate those rankings instead — while Index Exchange does rank first on the open web in the US, at a 19% share [34]. Read plainly, this is the strongest evidence available that Index Exchange's core strength remains display and open web, and that its CTV business, whatever its size, is not yet competitive with Magnite, PubMatic, FreeWheel, or Nexxen on raw impression share, at least on the open-programmatic CTV apps Pixalate measures (Pixalate's methodology does not cover LG TV and is impression-based, not spend-based, so it is directional evidence, not a revenue ranking).\n\n## Nexxen — the real third, running a fundamentally different model\n\n**So what:** Nexxen is not a scale competitor to Magnite or PubMatic, but it is the one independent player that has built something structurally different: a combined DSP, SSP, and proprietary TV data business, anchored in automatic content recognition (ACR) data it partly owns equity in. That gives Nexxen a defensible moat smaller rivals lack — and a growth profile far choppier than its two larger peers.\n\nNexxen posted record Q1 2026 results: programmatic revenue of $81.9 million (up 14% year over year), CTV revenue of $29.4 million (up 12%), and contribution ex-TAC of $84.5 million (up 13%) [9]. But the CTV line's share of Nexxen's programmatic revenue actually slipped slightly, from 37% in Q1 2025 to 36% in Q1 2026, and the quarter's adjusted EBITDA fell 30% year over year to $16.3 million, with Nexxen swinging to a net loss of $5.3 million (IFRS) versus a $1.6 million profit a year earlier [9]. That follows a rough fourth quarter of 2025, in which CTV revenue actually declined 19% year over year (12% ex-political) to $30.1 million [11]. Full-year 2025 total revenue was roughly $359 million, with programmatic representing about 95% of that, and full-year contribution ex-TAC growth of only about 3% at the midpoint (6% ex-political) — an order of magnitude slower than Magnite's [11]. Nexxen twice raised its full-year 2026 guidance ahead of a June 16, 2026 investor day, most recently to a contribution ex-TAC range of $385–400 million (about 11% midpoint growth) and programmatic revenue of $377–391 million (about 13%) [35][36]. The pattern across these numbers — strong Q1, weak Q4, guidance raised twice off a low base — is a company whose growth is real but considerably less smooth than Magnite's, and whose profitability (falling EBITDA margin even as revenue grows) is currently moving the wrong direction.\n\nThe core of Nexxen's strategy, and the reason it is worth treating separately from the rest of the independent field, is ACR — automatic content recognition, meaning software embedded in a smart TV's operating system that fingerprints and identifies whatever is actually playing on screen, which lets an advertiser target based on real viewing behavior rather than inferred demographics. Nexxen doesn't just license ACR data; it has bought equity to lock up exclusivity. In August 2025 Nexxen made an additional $35 million investment in VIDAA (the smart-TV operating system used by Hisense and others, branded \"V\"), securing exclusive global ACR data rights and exclusive North American ad-monetization rights through 2029, with a further $15 million investment planned for the third quarter of 2026 that would bring Nexxen's total VIDAA investment to roughly $60 million for about 6% of VIDAA's shares [9]. That is a materially different structure than any other company in this chapter: Nexxen is not merely a data licensee but a minority equity holder in the OEM (original equipment manufacturer, meaning the company that actually builds the TV set) software layer it depends on. On top of VIDAA, Nexxen's Home Screen advertising product — inventory sold on the smart TV's home screen itself, not inside any streaming app — expanded in 2026 to include TCL's FFALCON operating system and TiVo Ads' native home-screen inventory across North America and the UK [9]. Nexxen also runs ACR as a standalone data business, licensing its exclusive audience segments to competing demand-side platforms: The Trade Desk (from August 2024), Yahoo DSP (from October 2025, covering the US, UK, and Germany), and Adform (from Q1 2026, Germany and the UK, with France expected later in 2026) [9][37]. This dual posture — powering Nexxen's own DSP while simultaneously selling the same data to rival DSPs — is a genuinely distinctive monetization choice among the companies profiled here.\n\nNexxen's DSP side, less examined in trade coverage than its SSP and data businesses but structurally central to the \"combined DSP+SSP+data\" model this assignment asks about, runs on the Amobee platform Nexxen acquired in September 2022 from Singtel, since folded into the unified Nexxen brand adopted in June 2023 (the corporate entity became Nexxen International Ltd. in January 2024) [37][62]. The lineage behind that acquisition is itself a long chain of ad-tech consolidation: the company now called Nexxen began as Marimedia in 2007, became Taptica in 2015, merged with RhythmOne and renamed itself Tremor International in 2019, then acquired Unruly (the SSP core) from News Corp in January 2020 and Spearad (the ad server) in October 2021, before the Amobee deal gave it a DSP to complete the stack [62]. Recent named Amobee/Nexxen DSP client wins give some texture to who actually buys through the platform: a February 2026 partnership with the independent agency H/L cited up to a 14x lift in conversion outcomes for clients using Nexxen's DSP alongside its CTV placements, and the company has separately cited Rhone (a direct-to-consumer apparel brand) achieving lower online-video and CTV effective cost-per-acquisition through the platform, and Toyota using the combined Nexxen DSP, SSP, and Smart Contextual Targeting stack for what the company describes as faster insight delivery and better transparency [63]. These are company-selected case studies, not an audited client roster, and should be read as evidence of real usage rather than a claim about scale.\n\nThat said, an independent measurement source complicates Nexxen's positioning. Pixalate's Q4 2025 CTV Seller Trust Index, which scores SSPs on what share of their measured impressions flow through an authorized-direct publisher path (via the app-ads.txt standard) versus an arbitraged or resold path, found Nexxen at 100% arbitraged inventory across all three CTV platforms it was measured on [38]. That is a stark number, and it deserves a caveat in both directions: Nexxen's flagship product, Home Screen advertising, is inherently not classic in-app publisher inventory in the way app-ads.txt is built to authorize, so some of Pixalate's \"arbitrage\" classification may be a methodology artifact of measuring an OEM-screen product against a standard designed for in-app supply, rather than proof Nexxen is reselling someone else's inventory without authorization. But taken at face value, it is a meaningfully worse score than Magnite, PubMatic, or Google Ad Exchange typically post on the same index, and buyers doing their own supply-path audits — which the SPO section below shows they increasingly are — would reasonably flag it.\n\n## The rest of the field, sized honestly\n\n**So what:** Of the remaining companies named in this space, only Equativ and OpenX have anything resembling an independent open-auction CTV SSP business, and neither discloses numbers that let an outsider size it. Kargo is a premium closed marketplace, not an open SSP. Yahoo has no SSP at all. Viant is a DSP whose only sell-side relevance is a recently acquired measurement asset. No credible new pure-play independent CTV SSP entrant emerged in the 2025–2026 window covered by this research — the new activity at that layer is infrastructure (attention scoring, contextual intelligence, data marketplaces) riding on top of the incumbents, not a new company displacing them.\n\n**Equativ (formerly Equativ plus Sharethrough).** Equativ fully absorbed Sharethrough under a single brand in June 2025, following a 2024 merger the companies said would push combined net recurring revenue above $200 million [16][39]. Equativ is majority-owned by the private equity firm Bridgepoint Group (since February 2023) with Capital Croissance also holding a stake, and as a private company it discloses no CTV-specific revenue, growth rate, or CTV share of business [39]. Equativ's own marketing cites CTV, curation, and \"green media\" as growth drivers, and third-party revenue estimators (which should be read with real skepticism, given they diverge from Equativ's own self-reported figures by a wide margin) put total company revenue anywhere from roughly $74 million to over $200 million depending on the source and year — a spread wide enough that no confident CTV figure can be derived from it [16][40]. Treat Equativ's CTV business as real but genuinely unsized.\n\n**OpenX.** OpenX is private, US-based, reported at roughly 513 employees as of May 2026, and has historically raised $85.1 million in funding — a figure that describes capital raised, not revenue, and should not be confused with the company's size [41]. OpenX does not disclose CTV revenue. Its most visible CTV move is product-level rather than financial: \"TV by OpenX,\" launched in February 2024 to blend linear and programmatic CTV buying, and \"OpenX Attention Targeting,\" launched with TVision in March 2026 as what the companies describe as the first supply-side real-time attention-targeting solution for CTV [42][43]. OpenX does not appear among the top three CTV sellers on any platform in Pixalate's Q2 2025 rankings, suggesting that whatever OpenX's CTV volume is, it is not yet competing at Magnite/PubMatic/Nexxen/FreeWheel/TripleLift scale on the open-programmatic apps Pixalate measures [34].\n\n**Yahoo.** Yahoo is regularly named alongside these companies in trade-press SSP roundups, and the assignment for this chapter listed it accordingly — but that inclusion is out of date. Yahoo shut down its supply-side platform and video exchange in 2023, telling publishers directly that the closure let the company concentrate investment on its demand-side platform instead [15]. Yahoo's current sell-side posture, through a DSP-side initiative called Backstage, is the opposite of running an SSP: it uses its buying platform to go directly to the largest publishers and cut SSPs out of the middle for roughly the top 10% of publisher inventory by scale, which is a form of SPO practiced by a buyer, not a sell-side product [15]. As of mid-2026 there is no primary-source evidence Yahoo has re-entered the SSP business. It should not be counted as part of the independent CTV sell side going forward, and any current roundup that still lists it as an SSP is working from stale information.\n\n**Kargo.** Kargo is best understood as a premium, invitation-only media marketplace and creative-format company rather than an open SSP in the Magnite/PubMatic/Index Exchange sense — it curates a closed set of premium CTV, social, and open-web inventory and sells distinctive, often interactive ad formats against it, rather than running an open real-time auction available to any authorized buyer [44]. Kargo says its CTV business grew 96% in 2024, but that is a self-reported percentage with no disclosed dollar base, and Kargo is private with no independently verifiable revenue figure [19]. Kargo's April 2026 closed beta of \"Project Kera,\" an AI-driven unified buying platform, and its 2026 acquisition of retail-advertising company StitcherAds for $64 million, show the company has real capital and is investing in the same agentic-buying and commerce-media trends as PubMatic and Magnite, but on a scale and business model different enough that it doesn't belong in a direct take-rate or CTV-share comparison with the open SSPs [44][45].\n\n**Viant Technology and TVision.** Viant (NASDAQ: DSP) is a demand-side platform, not a sell-side one, and its Q1 2026 results — $88.5 million in revenue, up 25% year over year, with CTV contribution ex-TAC up \"well over 40%\" for a third consecutive first quarter — describe buy-side, not sell-side, performance [22]. Viant's relevance to this chapter is narrow but real: in May 2026 it closed a $40 million acquisition of TVision Insights (paid $22.5 million cash and $17.5 million in stock), a company that measures attention through in-room presence, co-viewership, and eyes-on-screen detection [46]. TVision's data now feeds Viant's own DSP as an \"attention-adjusted CPM,\" but TVision's technology is also licensed into the sell side directly — it is the measurement partner behind OpenX's March 2026 attention-targeting product, for instance — meaning Viant, via TVision, is a supplier of attention infrastructure to competing sell-side platforms even though Viant itself does not sell inventory [43][46].\n\n**New entrants.** This research did not surface a credible new independent, open, pure-play CTV SSP launched in the 2025–2026 window that has gained enough traction to belong in the roster above. The activity at the edge of this market is instead infrastructure companies — xpln.ai (attention scoring), Cocie AI (CTV contextual intelligence), and data-marketplace integrations — that plug into Index Exchange, OpenX, and other incumbents' existing auctions rather than running their own competing exchange. The honest reading is that the CTV SSP layer, unlike the DSP or curation layers, has not seen meaningful new entry; scale and publisher relationships are, so far, a real moat.\n\n## The international dimension\n\n**So what:** This is not a US-only story, but the disclosure gap is worse outside the US, and the two companies with the clearest international CTV footprint — Magnite and Nexxen — got there through opposite strategies: Magnite through global OEM contract renewals layered on top of its US scale, Nexxen through ACR data-licensing deals that are, market by market, actually ahead of what it has in the US.\n\nMagnite's clearest international evidence is the LG Ad Solutions renewal, which explicitly spans North America, APAC, and EMEA rather than being a US-only deal, and Magnite's own reporting splits revenue into US (75% of Q1 2026 total, growing 5.5%) and international (25%, growing 5.4%) — comparable growth rates on both sides, meaning international is not currently a faster-growing piece of the business, just a smaller and steadier one [1]. Nexxen's international position is arguably stronger and more differentiated: its ACR licensing deals with Adform explicitly cover Germany and the UK first, with France following later in 2026, and the VIDAA/V exclusivity arrangement is global in scope, not US-anchored, reflecting VIDAA's own concentration of smart-TV share outside North America (VIDAA ships primarily on Hisense sets, which have far higher share in Europe, Latin America, and parts of Asia than in the US) [9][37]. That means Nexxen's most defensible competitive advantage — exclusive ACR access — may actually be stronger in some non-US markets than domestically, a nuance easy to miss if this chapter's US-earnings-call-driven numbers are read as the whole picture. None of the companies in the \"rest of the field\" section disclose meaningful international CTV detail at all; Equativ, headquartered and originally built in France (as Smart AdServer before its rebrand), likely has real European CTV volume given that history, but as a private company it does not break out geography any more than it breaks out CTV, so this remains an inference rather than a documented fact.\n\n## The economics: take rates, curation stacking, and SPO\n\n**So what:** The single biggest number in this entire market is not any one company's growth rate — it's that, by the advertising industry's own 2025 benchmarking, only about 47% of programmatic ad spend actually reaches the publisher. More than half is retained across the chain of intermediaries, of which SSPs are one link and, increasingly, curators are a second, stacked link. That gap is what buyers are now organizing their entire supply-path strategy around, and it is squeezing the independent SSPs from both directions: fewer buyers are willing to route spend through them at all, and the ones who do are demanding to see, and negotiate down, the actual cut.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the same CTV impression costs ~39% more through a reseller path<\/div><svg viewBox=\"0 0 700 104\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">5<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">10<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">15<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">20<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">Direct authorized path (me…<\/text><rect x=\"185\" y=\"8\" width=\"311.5\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"504.5\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">14<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">SSP reseller path (median …<\/text><rect x=\"185\" y=\"42\" width=\"433.9\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"626.9\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">19.5<\/text><\/svg><figcaption> <span class=\"credit\">Source: Jounce Media data as reported by AdExchanger.<\/span><\/figcaption><\/figure>\n\n\n\n**Take rates.** No SSP in this chapter fully discloses its take rate (the percentage of an advertiser's gross spend the platform keeps before passing the rest to the publisher) as a clean, audited, ongoing figure. What's available is a mix of dated partial disclosures and independent estimates, and both should be read as directional rather than current. Magnite is the most forthcoming: a since-unrepeated earnings-call exchange put its CTV take rate at roughly 4% for pure ad-spend deals, 8% for its proprietary exchange, and 12% for fully managed-service deals, with Magnite's CFO confirming those ranges were \"not too far off\" as an average [13]. An independent analyst's later reconstruction — built by inferring gross ad spend from accounts-receivable timing against typical DSP payment cycles — put Magnite's blended company-wide take rate at roughly 11–12% for fiscal 2022, and PubMatic's considerably higher, at roughly 18% with a plausible range of 22–30% [14]. PubMatic itself has never disclosed a take rate at all, at any point, which the same independent analysis frames as a deliberate choice: if the real number were low, transparency would cost nothing competitively, so the more plausible reading of persistent non-disclosure is that the number is higher than either publishers or buyers would like to see stated plainly [14]. For comparison, The Trade Desk, a demand-side platform, discloses a take rate of roughly 20% of gross spend, and Criteo's ex-TAC gross margin runs around 40% — useful as bracketing context, not as a like-for-like SSP comparison, since DSP and retargeting economics differ structurally from sell-side auction economics [14].\n\nSet against display, the fragmentary evidence suggests CTV take rates run lower on a per-impression basis than legacy display, partly because CTV inventory is scarcer and more contested and partly because managed-service and PMP (private marketplace, a negotiated deal rather than an open auction) structures — which carry Magnite's highest disclosed rate tier at 12% — are proportionally more common in CTV than in open-exchange display. But because ex-TAC reporting nets out publisher payouts before the take-rate question is even asked, and because none of these companies report gross CTV ad spend alongside net CTV revenue the way Magnite briefly did years ago, this comparison rests on a genuinely thin evidentiary base and should be treated as informed inference, not established fact.\n\n| Company | Disclosed or estimated take rate | Basis | Confidence |\n|---|---|---|---|\n| Magnite | ~4% (self-serve exchange), ~8% (proprietary exchange), ~12% (managed service); ~11–12% blended company-wide | CFO-confirmed analyst estimate (dated) [13]; independent AR-based reconstruction, FY22 [14] | Low-medium — years old, never repeated |\n| PubMatic | Never disclosed; independently estimated ~18%, plausible range 22–30% | Independent AR-based reconstruction, FY22 [14] | Low — single independent estimate, company silent |\n| Nexxen | Not disclosed as a take rate; disclosed only as contribution ex-TAC margin on programmatic revenue | Company financial filings [9][11] | Not comparable — different disclosure convention |\n| Index Exchange | Not disclosed; claims no additional curation-fee stacking | Company's own positioning claim [33] | Very low — unverified self-characterization |\n| The Trade Desk (DSP, comparator) | ~20% of gross spend | Company disclosure | High — for context only, not an SSP |\n| Criteo (comparator) | ~40% ex-TAC gross margin | Company disclosure | High — for context only, different business model |\n\nThe table above is the clearest single illustration of the disclosure gap this whole chapter keeps returning to: a demand-side platform (The Trade Desk) will state its take rate as a matter of routine investor communication, while not one of the sell-side platforms actually profiled here will do the same, even under direct analyst questioning.\n\nThe United Kingdom's advertiser trade body offers a rare glimpse of what full supply-chain disclosure looks like when regulators and buyers force it. The Incorporated Society of British Advertisers (ISBA), working with PwC as an independent auditor, ran the original Programmatic Supply Chain Transparency Study in 2020 and found that a startling 15% of advertiser spend in its sample was simply \"unattributable\" — money that entered the programmatic supply chain and could not be traced to any known cost or fee by the time it either reached a publisher or didn't. A second ISBA/PwC study, published in January 2023, found real improvement: the impression-level match rate (the share of transactions PwC's auditors could actually trace end-to-end) rose from 12% to 58%, unattributable spend fell from 15% to 3%, and the proportion of advertiser spend reaching publishers rose by 8 percentage points [64]. No comparably rigorous third UK study confirming whether that improvement held through 2025–2026 was located in this research, which is itself worth noting: the single most credible transparency audit in the industry's history was a one-off underwritten by an advertiser trade body, not a standing annual practice any SSP — including the ones profiled in this chapter — has committed to funding or submitting to on a recurring basis. The US-based ANA benchmark series cited above is the closest thing to a recurring equivalent, and even it depends on advertiser members voluntarily supplying log-level data rather than SSPs proactively disclosing it.\n\n**Curation fee stacking.** Curation — an SSP or a third-party curator packaging inventory with first- or third-party audience data and selling it as a pre-vetted, premium deal — has become the fastest-growing transaction type in programmatic CTV, and it is also where the transparency problem is worst. The mechanics, as trade sources lay them out: on a curated deal, the demand-side platform typically takes a fee, the curator takes a separate fee, and the SSP then takes its own share of what remains before the rest reaches the publisher — three hands on a deal that used to have, at most, two [47]. One curation-focused executive put a number on the high end: curators charging \"30%+ for repackaging existing SSP inventory\" into exclusive deal lists [48]. The core complaint from buyers, per Digiday's reporting on the sell-side transparency push, is that curator fees in particular are \"layered on top of existing SSP costs, bundled transactions and obscured by non-disclosed revenue sharing agreements\" — a black-box problem distinct from, and additive to, the SSP take-rate opacity described above [48]. Index Exchange's claimed differentiator — not charging an additional deal-curation fee on top of its standard take — is directly responsive to this complaint, though it is Index Exchange's own characterization of its own pricing and was not independently verified against a specific transaction in this research [33].\n\n**Supply-path optimization (SPO).** SPO — the umbrella term for how DSPs, agencies, and advertisers deliberately narrow which intermediaries they route spend through, in order to cut out redundant or low-value hops — is the buy side's structural response to both the take-rate opacity and the curation-stacking problem, and the data shows it is working at scale. The Association of National Advertisers' Q2 2025 Programmatic Transparency Benchmark found the median number of SSPs used per advertiser fell from 19 to 17 in a single quarter, while the number of active domains those advertisers bought against fell from 53,799 to 28,958 — a sharp narrowing of both intermediary count and inventory breadth [49]. The same benchmark series found that the share of ad spend actually reaching the publisher rose to 47.1% by the third quarter of 2025, up 11 points since 2023, with $13.6 billion in \"working media value\" reclaimed in that quarter alone, against a backdrop of $26.8 billion in total spend the ANA characterized as wasted globally earlier in the year [50][51]. By the fourth-quarter 2025 report, private marketplace deals — negotiated, curated transactions rather than open auctions — accounted for more than 92% of median spend across all formats and effectively 100% of CTV transactions specifically, confirming that CTV has moved almost entirely away from the open exchange model this whole transparency fight originally targeted [52]. On the supply side, the number of SSPs a given CTV platform authorizes to sell its inventory has itself been rising even as buyers narrow their own routing — the average CTV platform authorized around 30 SSPs in 2024, more than double the prior year, with Paramount's Pluto TV cited as an extreme case at roughly 67 authorized SSPs, up from just 4 in early 2020 [53]. That combination — more authorized sellers per platform, fewer SSPs actually used per buyer — is exactly the dynamic that produces winners and losers among the independents: the SSPs a platform authorizes but that buyers don't route through earn nothing, no matter how many partnership press releases get issued.\n\nOne concrete cost of the unoptimized status quo, from Jounce Media data cited by AdExchanger: the median CPM (cost per thousand impressions) floor on direct-authorized CTV inventory was $14, versus $19.50 through an SSP reseller path — a 39% average markup for buying the same underlying impression through a longer supply chain [54]. And the transparency fight is not just about fees; it is also about supply quality. A March 2024 forensic investigation by Adalytics found that despite public pledges from Magnite, PubMatic, and Sharethrough (among others) to weed out made-for-advertising (MFA) sites — low-quality content farms engineered purely to harvest programmatic ad spend rather than serve real audiences — all three, along with OpenX, Nexxen, Index Exchange, and TripleLift, were still found serving ads on identified MFA properties; PubMatic specifically was found to have transacted for more than 7,500 brands across the MFA sample analyzed [55]. That report is now more than two years old and none of the companies named has published data refuting or updating it, but a more recent, current data point from Pixalate's Q1 2025 global MFA benchmark estimated $701 million in programmatic ad spend still flowing to MFA websites across CTV, mobile, and web combined — evidence the underlying problem, even if improved, has not been solved [56]. Every claim any SSP makes about its \"clean supply\" or MFA-prevention efforts should be read against that history: it is a marketing claim until an independent, dated re-audit says otherwise.\n\n## The response: attention, performance, and agentic trading\n\n**So what:** All four companies profiled in depth here are converging on the same three responses to buyer pressure — sell attention as a bid-time signal instead of a post-campaign report, sell outcomes instead of impressions, and build AI agents that can execute a campaign from a plain-English brief. None of the independents can prove yet that these moves have measurably changed their economics; what's provable is that the product investment is real and shipping into production, not just roadmap slides.\n\nAttention measurement — quantifying whether a viewer's eyes and engagement were actually on an ad, rather than just confirming the ad technically loaded on screen — has moved from a post-campaign reporting add-on to something several SSPs now embed directly into the pre-bid auction. Index Exchange's February 2026 integration with xpln.ai does exactly this: 20 to 25 exposure signals per impression, modeled against eye-tracking data, scored before the bid is placed rather than analyzed afterward [32]. OpenX's March 2026 partnership with TVision — now a Viant-owned asset — does the same for CTV specifically, branded as the first supply-side real-time attention-targeting product built for connected television [43]. Equativ has published TVision-backed research claiming a 14% attention lift from human-centric creative design, and Kargo has cited TVision data showing its interactive \"Enhanced Branded Canvas\" format delivers 88% longer attention than comparable YouTube inventory — both are vendor-commissioned or vendor-cited studies and should be read as evidence of what each company is marketing, not as independently replicated findings [57][58]. The throughline is that attention measurement is becoming sell-side infrastructure that any SSP can license (mostly from TVision, now consolidated under Viant) rather than a proprietary advantage any single platform owns outright — which means it's likely to become table stakes across the whole roster within the next year or two rather than a durable differentiator for any one company.\n\nPerformance and outcomes-based buying — pricing and optimizing a CTV campaign against a business result (a purchase, an app install, an incremental sales lift) rather than against raw impressions or CPMs — is the second convergent bet. PubMatic's Convert product is the most direct expression of this on the sell side: closed-loop reporting that ties ad exposure to actual purchase data across CTV and mobile [12]. Nexxen's June 2026 investor day emphasized the same shift on its DSP side, and the Gracenote/Nielsen partnership PubMatic announced that same month packages curated, content-level (e.g., live-sports) deals specifically to make premium CTV inventory easier to transact against for buyers chasing measurable outcomes rather than reach alone [17]. This is a genuine repositioning away from CPM-denominated selling, but it is also, for the SSPs, a defensive move: if buyers are going to insist on paying for outcomes, the sell side would rather own the reporting layer that defines what counts as an outcome than cede that definition entirely to the DSP or a third-party measurement vendor.\n\nAgentic AI trading — letting a buyer's or seller's software agent negotiate, execute, and optimize a media buy with limited human intervention, based on a natural-language brief rather than manually configured line items — is the newest and least proven of the three responses, but it is the one with the clearest production evidence as of mid-2026. Magnite deployed a seller agent in December 2025 and expanded a buyer agent in April 2026, with Kepler and MiQ testing against Disney Advertising inventory specifically, alongside SpringServe mediation-layer additions (anomaly detection, demand-path optimization, and dynamic floor pricing) built partly on technology from Magnite's streamr.ai acquisition [27]. PubMatic's AgenticOS, launched January 2026, has the most concrete documented use case in this research: Butler/Till, an ad agency, submitted a campaign brief in natural language through Anthropic's Claude, and PubMatic's agents interpreted it, built a media strategy, initiated setup, and continuously optimized the resulting campaign across PubMatic's supply — a real, named, in-market example rather than a demo [27]. Index Exchange, for its part, is a technical participant in the IAB Tech Lab's open-source seller-agent architecture, an industry standardization effort aimed at letting buyer and seller agents built by different vendors interoperate on shared protocols rather than each SSP building a closed agentic silo [27]. It's worth naming, for context though not for assessment, that the most advanced single example of agent-to-agent trading identified in this research is platform-owned rather than independent: NBCUniversal and FreeWheel completed what they describe as the first AI-agent-led programmatic guaranteed deal spanning both linear and streaming live-sports inventory — a reminder that the independents are not the only, or even necessarily the leading, part of the sell side racing toward this capability.\n\n## Who actually matters — the explicit answer\n\nRanked by the strength and recency of disclosed evidence, not by press-release volume: Magnite matters most, with the largest disclosed CTV dollar figure, the fastest disclosed growth rate among the majors, and the deepest bench of confirmed enterprise streaming partners. PubMatic matters second, smaller in absolute CTV dollars and growing off a flatter total-company base, but moving fastest and most concretely on agentic buying — the one capability every company in this chapter says will matter most over the forecast horizon. Nexxen matters third: genuinely differentiated by its ACR-and-equity strategy and its combined DSP/SSP/data model, but running choppier growth, deteriorating near-term profitability, and a supply-quality score from independent measurement that undercuts its own premium-inventory positioning. Everyone else fails to clear the evidentiary bar for a confident ranking, not necessarily because their CTV business is small, but because none of them — Index Exchange, Equativ, OpenX, Kargo — discloses enough to say so with real confidence either way; that opacity is itself the most defensible finding this chapter can offer about that tier. And two companies belong outside the ranking entirely despite recurring in trade coverage about this space: Yahoo, which sold no CTV inventory in 2026 because it has no SSP, and Viant, a demand-side platform whose only genuine sell-side relevance runs through a single recently acquired measurement asset, TVision.\n\n## Open Questions\n\n- What is Index Exchange's actual CTV revenue and growth rate? No public or credible third-party estimate exists; the company may disclose more if it pursues a future IPO, but there is no current indication it plans to.\n- Will Magnite's Disney renewal, due around October 2026, repeat on similar terms, and will Netflix's programmatic mix (and Magnite's roughly 3% estimated take, itself unconfirmed since 2024) hold as Netflix's ad business scales?\n- Does Nexxen's Q4 2025 CTV revenue decline (-19% YoY) reflect a one-quarter anomaly or the start of a structural slowdown, and does its VIDAA equity bet pay off before the exclusivity term runs to 2029?\n- Will any SSP move from partial, dated take-rate disclosure (Magnite's years-old CFO confirmation) to a standing, audited take-rate reporting practice, and would buyer-side SPO pressure force that even if no company wants to volunteer it?\n- Does Pixalate's 100%-arbitraged finding on Nexxen reflect genuine supply-chain risk or a measurement-methodology mismatch with Nexxen's OEM-screen inventory model — and will Nexxen respond publicly to that finding?\n- Will curation-fee stacking draw the same kind of coordinated buyer pushback (audits, log-level data demands) that drove the ANA's SPO-driven SSP consolidation, and will that in turn consolidate curation spend the way it has already consolidated SSP spend?\n- Is a new pure-play independent CTV SSP entrant plausible at all in this market, or has publisher-relationship scale become a genuine, durable moat that only attention- and curation-infrastructure vendors can work around rather than compete with directly?\n- Will a third ISBA/PwC-style independent, audited supply-chain transparency study ever be run again — in the UK, the US, or elsewhere — and would any of the companies profiled here actually submit full log-level data to it voluntarily, given how much the 2020 and 2023 UK studies moved the needle on disclosed unattributable spend?\n- As attention measurement consolidates around a small number of licensed data providers (chiefly TVision, now Viant-owned), does that become a new chokepoint with its own undisclosed pricing — effectively a second ACR-style proprietary-data moat — rather than the open, comparable standard the industry says it wants?\n- If PubMatic's agentic-buying bet succeeds commercially before Magnite's, does Magnite's scale advantage survive a shift where the deciding factor for buyers becomes agent interoperability and ease of natural-language briefing rather than raw publisher-supply breadth?\n\n## Sources\n\n1. Magnite Q1 2026 earnings coverage, ppc.land, May 2026, https://ppc.land/magnite-q1-2026-ctv-now-over-half-of-revenue-as-streaming-bets-pay-off/ — Tier 5. Detailed breakdown of Q1 2026 CTV contribution ex-TAC, guidance, and named partners.\n2. Magnite Q1 2026 results, StockTitan/8-K coverage, May 2026, https://www.stocktitan.net/news/MGNI/magnite-reports-first-quarter-2026-372ge8xliy7u.html — Tier 3/5. Corroborates Q1 2026 CTV growth and total contribution ex-TAC figures.\n3. Magnite FY2025 and Q4 2025 results coverage, ppc.land / Investing.com, February 2026, https://ppc.land/magnites-ctv-bet-pays-off-32-growth-signals-a-streaming-ad-shift/ ; https://www.investing.com/news/company-news/magnite-q4-2025-slides-ctv-growth-accelerates-to-20-yoy-93CH-4526202 — Tier 5. FY2025 and Q4 2025 CTV contribution ex-TAC figures and growth rates.\n4. PubMatic Q1 2026 financial results, businesswire/PubMatic investor relations, May 2026, https://investors.pubmatic.com/news-releases/news-release-details/pubmatic-announces-first-quarter-2026-financial-results/ — Tier 1. Primary source for Q1 2026 revenue, CTV growth, adjusted EBITDA.\n5. Magnite Q4 2025 earnings call transcript, The Motley Fool, February 2026, https://www.fool.com/earnings/call-transcripts/2026/02/25/magnite-mgni-q4-2025-earnings-call-transcript/ — Tier 1. Primary transcript corroborating Q4/FY2025 CTV figures.\n6. Magnite ClearLine curation and activation unification announcement, GlobeNewswire, October 2025, https://www.globenewswire.com/news-release/2025/10/01/3159421/0/en/Magnite-To-Unify-Curation-and-Activation-Within-ClearLine.html — Tier 1. Primary announcement of ClearLine restructuring and Magnite Access.\n7. PubMatic
