2026/05/07/pubmatic-pubm-q1-2026-earnings-transcript/\n— Tier 1 (earnings call transcript); source for CEO Rajeev Goel's guidance toward second-half-2026\ndouble-digit revenue growth and framing of agentic transaction data compounding.\n17. Magnite, \"Why Magnite Built a Seller Agent — and What It Signals for AdCP,\" and \"Introducing\nMagnite Orchestration: Powering the Future of Agentic Advertising,\" investor and company releases,\nApril-June 2026,\nhttps://www.magnite.com/blog/why-magnite-built-a-seller-agent-and-what-it-signals-for-adcp/ ;\nhttps://investor.magnite.com/news-releases/news-release-details/introducing-magnite-orchestration-powering-future-agentic\n— Tier 1 (investor release) / Tier 6 (company blog); source for the April 27, 2026 Seller Agent\nlaunch, the December 2025 first AdCP buy, the June 11, 2026 Orchestration launch, named pilot\npartners (dentsu, DIRECTV Advertising), and the\nanomaly-detection/demand-path-optimization/dynamic-pricing feature set.\n18. StockTitan, \"Magnite expands AI tools; Kepler, MiQ start tests,\" 2026,\nhttps://www.stocktitan.net/news/MGNI/magnite-unveils-new-ai-powered-intelligent-assistance-and-agentic-8daxtjsjizs5.html\n— Tier 3/5; corroborating detail on Magnite's April 2026 AI capability expansion and named testing\npartners.\n19. AdExchanger, \"Criteo Faces Tough Headwinds Until Agentic AI Ad Revenue Materializes,\" 2026,\nhttps://www.adexchanger.com/marketers/criteo-faces-tough-headwinds-until-agentic-ai-ad-revenue-materializes/\n— Tier 5; source for Criteo's guidance statement that it assumes no material revenue contribution\nfrom agentic AI initiatives, used as an outside sanity check on agentic revenue timelines.\n20. StreamTV Insider / Digiday, \"Marketer interest in CTV, AI persists — so does fragmentation\nchallenge,\" and \"D+ Research: Marketers hesitate to adopt AI for influencer and CTV marketing,\"\n2026,\nhttps://www.streamtvinsider.com/advertising/marketer-interest-ctv-ai-persists-so-does-fragmentation-challenge\n;\nhttps://digiday.com/marketing/d-research-marketers-hesitate-to-adopt-ai-for-influencer-and-ctv-marketing/\n— Tier 5; source for the 82%-not-using-AI-in-streaming figure and the\n60%-plan-to-increase-spend-vs-19%-see-major-transformation gap.\n21. OpenClassActions.com, \"Samsung Smart TV ACR Viewing-Data Privacy Class Action Lawsuit (VPPA),\"\nfiled January 9, 2026; \"Amazon Fire TV Privacy Class Action Lawsuit (2026),\" filed May 6, 2026;\n\"$850K Willow TV VPPA Privacy Class Action Settlement,\" https://openclassactions.com/ — Tier 5\n(legal-tracking/specialist source, not a law firm's own promotional claim); source for the Samsung\nand Amazon ACR-based VPPA suit filing dates and allegations, and the Willow TV settlement terms and\ncovered period.\n22. Ropes & Gray LLP, \"Supreme Court to Consider the Video Privacy Protection Act,\" February 2026,\nhttps://www.ropesgray.com/en/insights/alerts/2026/02/supreme-court-to-consider-the-video-privacy-protection-act\n— Tier 2 (authoritative legal-institutional analysis); source for the Supreme Court's agreement to\nhear a VPPA case in early 2026.\n23. Digiday, \"Google's ad tech antitrust remedy phase explained — and where the Judge might land,\"\nand \"Everything you need to know about the closing stages of Google's ad tech antitrust trial,\" and\n\"Judge questions structural remedies in Google ad tech monopoly case\" (The Current), 2025-2026,\nhttps://digiday.com/marketing/googles-ad-tech-antitrust-remedy-phase-explained-doj-wants-googles-offerings-and-where-the-judge-might-land/\n; https://www.thecurrent.com/data-privacy-judge-structural-remedies-google-ad-tech-monopoly-case —\nTier 5; source for Judge Brinkema's liability ruling (DFP/AdX tying monopolization), the November\n21, 2025 closing arguments, her stated concerns over divestiture timing and the absence of an\nidentified AdX buyer, and Google's own prior two-year separation estimate.\n24. AdExchanger, \"Closing Arguments Are Done In The US v. Google Ad Tech Case,\" and \"The DOJ And\nGoogle Sharpen Their Remedy Proposals As The Two Sides Prepare For Closing Arguments,\" 2025-2026,\nhttps://www.adexchanger.com/antitrust/closing-arguments-are-done-in-the-us-v-google-ad-tech-case/ —\nTier 5; source for the DOJ's and Google's competing remedy proposals and the mid-2026 expected\nruling window cited by trade-press observers.\n25. StreamTV Insider / Marketing Dive, \"Netflix plans in-house ad tech, partners with The Trade\nDesk, Magnite, Google,\" and \"Netflix plans to in-house ad tech, adds measurement partners as ad tier\nsurges,\" 2025-2026,\nhttps://www.streamtvinsider.com/advertising/netflix-plans-house-ad-tech-partners-trade-desk-magnite-google\n; https://www.marketingdive.com/news/netflix-upfront-in-house-ad-tech-measurement-partners/716262/ —\nTier 5; source for the Netflix Ads Suite's November 2024 launch, 2026 as its first full in-house\nyear, the ~$3B 2026 ad revenue target, continued Trade Desk/DV360/Magnite/Amazon DSP/Yahoo DSP\nprogrammatic access, and Disney's DRAX/DV360/Trade Desk integrations.\n26. Digiday, \"Connected TV advertisers gravitate to multi-DSP model as Amazon, Roku push their own\nbidders,\" and Amazon Ads, \"Roku and Amazon Ads announce an exclusive partnership,\" 2026,\nhttps://digiday.com/future-of-tv/connected-tv-advertisers-gravitate-to-multi-dsp-model-as-amazon-roku-push-their-own-bidders/\n; https://advertising.amazon.com/library/news/roku-amazon-ads-partnership — Tier 5 (trade press) /\nTier 1 (company release); source for Amazon's and Roku's owned-DSP strategies, the shared-identifier\npartnership covering an estimated 80M+ U.S. CTV households (80%+ of the base), and continued\nindependent-DSP relevance for cross-platform private marketplace buying.\n27. AdWeek / The Current, \"Measurement Competitors Try to Snatch the Crown, But Nielsen Remains King\nfor Now,\" and \"The messy world of TV currency and how competitors are trying to unseat Nielsen,\" and\neMarketer, \"Ad Measurement Trends H1 2026,\" 2026,\nhttps://www.adweek.com/convergent-tv/measurement-competitors-tv-upfront-nielsen/ ;\nhttps://www.emarketer.com/content/ad-measurement-trends-h1-2026 — Tier 4/5; source for the JIC\ncertification of Comscore, iSpot, and VideoAmp as currencies of record, VideoAmp's ~$3B upfront\nvolume and 880% YoY growth, and the framing of outcome-based measurement overtaking the currency\ndebate in 2026.\n28. TV Tech, \"Half of Marketers Increased CTV Budgets, But Only 33% Fully Trust Performance Claims,\"\n2026,\nhttps://www.tvtechnology.com/insights/analysis/half-of-marketers-increased-ctv-budgets-but-only-33-percent-fully-trust-performance-claims\n— Tier 5; source for continued CTV budget growth alongside persistent buyer skepticism, used as\nevidence against an active macro downturn as of mid-2026."}, {"order": 7, "file": "Future_Trajectory.md", "title": "What the Sell Side Becomes by 2029", "summary": "", "body": "# What the Sell Side Becomes by 2029\n\n## Bottom Line\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 430\" role=\"img\" aria-label=\"A scenario probability ledger for the independent CTV sell side in 2029. Squeezed but Standing ranges from 38 to 46 percent, Absorbed into the Platforms from 18 to 26 percent, Up the Stack from 15 to 23 percent, and Structural Break from 12 to 20 percent. The bottom shows the market growing from about 38 billion dollars in 2026 to about 51 billion in 2029, allowing companies to grow in dollars while shrinking in importance.\">\n<text x=\"44\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">2029 SCENARIO FLOOR<\/text>\n<text x=\"44\" y=\"47\" class=\"t-mono t-muted\" font-size=\"10.5\">independent CTV sell side &#183; probability bands, not point estimates<\/text>\n<line x1=\"44\" y1=\"58\" x2=\"656\" y2=\"58\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<rect x=\"44\" y=\"82\" width=\"612\" height=\"250\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<g class=\"ln-soft\" stroke-width=\".8\">\n<line x1=\"180\" y1=\"108\" x2=\"180\" y2=\"304\"/><line x1=\"300\" y1=\"108\" x2=\"300\" y2=\"304\"/><line x1=\"420\" y1=\"108\" x2=\"420\" y2=\"304\"/><line x1=\"540\" y1=\"108\" x2=\"540\" y2=\"304\"/>\n<\/g>\n<g class=\"t-mono t-muted\" font-size=\"8.5\" text-anchor=\"middle\">\n<text x=\"180\" y=\"102\">10%<\/text><text x=\"300\" y=\"102\">20%<\/text><text x=\"420\" y=\"102\">30%<\/text><text x=\"540\" y=\"102\">40%<\/text>\n<\/g>\n<g class=\"t-mono\" font-size=\"10\">\n<text x=\"68\" y=\"140\" font-weight=\"bold\" style=\"fill:var(--text)\">Squeezed but Standing<\/text>\n<rect x=\"516\" y=\"126\" width=\"96\" height=\"22\" rx=\"2\" class=\"f-t1 cv-grow-right\" opacity=\".8\"/>\n<text x=\"624\" y=\"141\" style=\"fill:var(--accent)\" font-weight=\"bold\">38&#8211;46%<\/text>\n<text x=\"68\" y=\"185\" font-weight=\"bold\" style=\"fill:var(--text)\">Absorbed into Platforms<\/text>\n<rect x=\"276\" y=\"171\" width=\"96\" height=\"22\" rx=\"2\" class=\"f-t3 cv-grow-right\" opacity=\".70\" style=\"--d:.08s\"/>\n<text x=\"384\" y=\"186\" style=\"fill:var(--t3)\" font-weight=\"bold\">18&#8211;26%<\/text>\n<text x=\"68\" y=\"230\" font-weight=\"bold\" style=\"fill:var(--text)\">Up the Stack<\/text>\n<rect x=\"240\" y=\"216\" width=\"96\" height=\"22\" rx=\"2\" class=\"f-t2 cv-grow-right\" opacity=\".72\" style=\"--d:.16s\"/>\n<text x=\"348\" y=\"231\" style=\"fill:var(--t2)\" font-weight=\"bold\">15&#8211;23%<\/text>\n<text x=\"68\" y=\"275\" font-weight=\"bold\" style=\"fill:var(--text)\">Structural Break<\/text>\n<rect x=\"204\" y=\"261\" width=\"96\" height=\"22\" rx=\"2\" class=\"f-t4 cv-grow-right\" opacity=\".72\" style=\"--d:.24s\"/>\n<text x=\"312\" y=\"276\" style=\"fill:var(--t4)\" font-weight=\"bold\">12&#8211;20%<\/text>\n<\/g>\n<line x1=\"60\" y1=\"316\" x2=\"640\" y2=\"316\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"70\" y=\"356\" width=\"204\" height=\"30\" rx=\"2\" class=\"f-t4\" opacity=\".26\"/>\n<rect x=\"70\" y=\"356\" width=\"204\" height=\"30\" rx=\"2\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--t4)\"/>\n<rect x=\"274\" y=\"356\" width=\"70\" height=\"30\" class=\"f-t1\" opacity=\".55\"/>\n<text x=\"172\" y=\"376\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">$37.95B in 2026<\/text>\n<text x=\"309\" y=\"376\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"10.5\" font-weight=\"bold\">+34%<\/text>\n<rect x=\"344\" y=\"356\" width=\"274\" height=\"30\" rx=\"2\" class=\"f-t2\" opacity=\".36\"/>\n<rect x=\"344\" y=\"356\" width=\"274\" height=\"30\" rx=\"2\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--t2)\"/>\n<text x=\"481\" y=\"376\" text-anchor=\"middle\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">~$51B in 2029<\/text>\n<text x=\"44\" y=\"412\" class=\"t-mono t-muted\" font-size=\"9.5\">The modal call is arithmetic: a growing market lets the independents report growth while their strategic share and take rate thin.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 6.<\/strong> The forecast is not bearish on CTV dollars; it is bearish on sell-side leverage: in the modal 38&#8211;46% case, the pot rises from roughly $38B to $51B while the independent seller&#8217;s relative importance keeps shrinking.<\/figcaption>\n<\/figure>\n\n\nThe independent CTV sell side will almost certainly be larger in absolute dollars in 2029 and smaller in relative importance. That is the single most defensible claim available, and it follows from arithmetic rather than opinion: the US connected-TV ad market is forecast to grow from roughly $38 billion in 2026 to about $51 billion in 2029, so a platform can lose share every year and still book growth every year. The modal outcome — call it *Squeezed but Standing*, at 38–46% — is that Magnite and PubMatic keep compounding CTV revenue while their cut of each dollar thins under supply-path pressure, at least one mid-tier independent is absorbed, and the sell side's celebrated new products pay for themselves without ever repricing the category. The two live alternatives cut in opposite directions: absorption into the platform stacks (18–26%), or a genuine move up the value chain in which curation, attention and seller-side agents become a defensible margin line rather than a retention tool (15–23%). A structural break — a Google divestiture that actually lands, a privacy ruling that guts automatic content recognition, or an agent-to-agent layer that truly routes around the auction — sits at 12–20%, and is the scenario most likely to be underpriced by people inside the industry, because each of its component shocks is individually more probable than the scenario it would produce.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The independent CTV sell side in 2029 — scenario probabilities<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Squeezed but Standing<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"371.6\" y=\"8\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"418.9\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">38–46%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Absorbed into the Platforms<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"273.4\" y=\"44\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"320.7\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">18–26%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Up the Stack<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"258.6\" y=\"80\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"305.9\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">15–23%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Structural Break<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"243.9\" y=\"116\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"291.2\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">12–20%<\/text><\/svg><figcaption> <span class=\"credit\">Source: Scenario probabilities, this forecast.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## Method\n\nThree things ground the numbers below, and one thing conspicuously does not.\n\nWhat does not: **there is no prediction market on any of this.** I looked. Neither Kalshi nor Polymarket lists a contract on whether Fox's Roku acquisition closes, on the shape of the Google ad-tech remedy, or on any question about supply-side platform share — and the honest thing is to say so rather than dress a judgment call in borrowed precision. Both venues have spent 2026 preoccupied with sports and regulatory fights of their own. Where a market price would normally anchor the first estimate, this forecast substitutes the closest available priced instruments: sell-side analyst expectations embedded in the two public independents' guidance, and the industry's own forecast curve.\n\nWhat does ground it, first, is **the market's growth path**, which is the least contested input available. Independent forecasters put US CTV ad spend at roughly $37.95 billion in 2026, rising to about $46.89 billion in 2028 — the year CTV is projected to pass traditional television — and approximately $51 billion in 2029, with annual growth cooling from near 14% to closer to 11% across the period. Every scenario below inherits that curve. It is why \"growth\" and \"decline\" are not the axis that matters here: share and take rate are.\n\nSecond, **counted base rates from this market's own consolidation history**. Between 2013 and 2026 the video sell side produced a steady drumbeat of acquisitions — Adap.tv and FreeWheel and LiveRail in 2013–14, Rubicon and Telaria merging in 2020, SpotX and SpringServe and Publica and Spearad in 2021, Amobee in 2022, Sharethrough in 2024, TVision and Vibe.co and the pending Roku deal in 2026. Narrowing to *scaled* sell-side platforms rather than every tuck-in, that is roughly six events across thirteen years against a pool of eight to ten meaningful names at any given moment — an annual hazard of about 5% per company. Applied to the two leaders over the three and a half years to end-2029, that reference class implies roughly a 30% chance at least one is acquired.\n\nThird, **the disclosed economics of the three frontiers**, which are far less flattering than the announcements. Magnite's CTV contribution after traffic-acquisition costs grew 30% year over year in the first quarter of 2026 and crossed 51% of company contribution for the first time; PubMatic's CTV grew 18% against a total revenue base that was flat to declining. PubMatic's entire \"emerging revenue\" bucket — commerce, curation, activation and its agentic products combined, not agentic alone — reached about 14% of a $62.6 million quarter. Criteo, with less to sell, tells investors to assume no material agentic revenue at all. Attention measurement has no MRC-accredited CTV metric. No seller anywhere discloses what happens when an outcome guarantee misses. A forecast that took the press releases at face value would be forecasting a different industry than the one the filings describe.\n\nGenuine disagreement survives all three, and it is preserved below as scenario spread rather than smoothed into a single number. The sharpest unresolved question is whether the agentic turn is a moat or a solvent for the companies building it — and the evidence available in mid-2026 is thin enough, and short-dated enough, that anyone claiming to know is guessing.\n\n---\n\n## Scenario One — Squeezed but Standing\n\n**38–46%. The modal case.**\n\nThe independents end 2029 bigger, thinner, and fewer. Magnite and PubMatic are still independent, still growing CTV revenue at a rate somewhere between the market's 11% and their current twenties-to-thirty, and still losing share of total CTV monetization to stacks owned by the people who own the screen. Take rates compress — not collapse — as buyers keep consolidating supply paths and as curation fees draw the scrutiny that intermediary fees always eventually draw. One or two of Nexxen, Equativ, OpenX, Kargo or Index Exchange is acquired, merged, or quietly stops competing seriously for CTV. The three frontiers all get built, all get marketed hard, and none of them reprices inventory at the category level. The sell side's new products turn out to have been the cost of keeping the business, not a way to grow the margin on it.\n\n*Derivation.* A decomposition, conditional on the market curve holding. Take P(CTV spend keeps growing broadly along the forecast path) at 0.85 — high, because it is the most corroborated input in this entire body of research and would require a macro shock to break. Take P(no structural break lands with real effect before 2029) at 0.84, which is simply one minus the fourth scenario below. Conditional on both, the field splits between this scenario, absorption, and a successful move up the stack in roughly a 50 / 26 / 24 ratio, drawn from the consolidation hazard rate and the frontier-economics evidence described in the method. That gives 0.85 × 0.84 × 0.50 ≈ **0.42**, the midpoint of the band.\n\n*What makes it the modal case* is that it requires nothing to happen. Every other scenario needs an event — a deal, a ruling, a product that works better than its own vendor's revenue disclosure suggests. This one is what you get from the trends already in the filings, extended three and a half years.\n\n*The challenge to it.* The obvious objection is that \"squeezed but standing\" describes a stable equilibrium, and this market has not produced a stable equilibrium in fifteen years. Something in the reference class always moves. That objection is fair, and it is why this scenario tops out in the mid-forties rather than running away with the distribution — but note that the scenario already contains a consolidation event among the mid-tier. It is stable at the top of the field, not throughout it.\n\n---\n\n## Scenario Two — Absorbed into the Platforms\n\n**18–26%.**\n\nThe platform-owned sell side wins decisively. Fox closes its Roku acquisition and manages the marketplace as a content owner rather than a neutral exchange; more streamers follow Netflix and Disney into running their own ad servers, each one removing inventory from the independent field as it goes; Amazon's simultaneous ownership of premium supply and a top-three demand-side platform proves as durable as it looks, and draws no meaningful regulatory response. Somewhere in the window, one of the two leading independents is acquired or takes strategic investment that ends its independence in substance. The surviving independents become plumbing vendors — real businesses, necessary to publishers too small to build their own stack, structurally unable to set terms.\n\n*Derivation.* The counted base rate does most of the work. The reference-class hazard above — about 5% per company-year for a scaled sell-side platform being acquired — implies roughly 1 − 0.95⁷ ≈ 30% that at least one of the two leaders is taken out over seven company-years. But this scenario requires more than a transaction: it requires the independents to be *reduced to plumbing*, which is a conjunction of the deal and the wider in-housing trend continuing. Discounting the 30% by roughly 0.75 for that conjunction yields ≈ **0.22**.\n\n*The strongest evidence for it* is that the largest single CTV destination already works this way. YouTube leads US television viewing at roughly 12.7% of all TV time and sells almost entirely through Google's own stack, with third-party access historically confined to a handful of partners. It is not a forecast that a platform can own the screen, the identity layer and the buying tool at once and dispense with the independent sell side — it is a description of the biggest incumbent.\n\n*The challenge to it.* Disney is the counter-case, and it is a serious one. Having pushed programmatic toward 75% of its ad revenue, it deliberately kept independent supply paths open alongside its own exchange rather than routing everything through owned technology. Platforms that own their stack still need incremental demand, and an SSP is a cheap way to buy it. Absorption requires platforms to conclude they do not need that demand — a conclusion no one except Amazon and Google has actually reached.\n\n---\n\n## Scenario Three — Up the Stack\n\n**15–23%.**\n\nThe frontier bets pay. Curation stops being a fee layer and becomes a product buyers would pay for on the merits; attention measurement clears MRC accreditation for a CTV-specific metric and starts pricing inventory rather than informing plans; outcome-based deals get standardized enough that a seller can underwrite the risk instead of absorbing it blind; and seller-side agents turn out to entrench the platform that owns the inventory relationship rather than exposing it. The supply-side platform stops being an auction and becomes the decisioning layer — and take rates hold or expand, which is the only observable that would actually distinguish this scenario from the modal one.\n\n*Derivation.* A base rate on the underlying business move: ad-tech intermediaries attempting to climb the value stack and hold margin. The reference class is small but real — LiveRamp's pivot into data infrastructure (worked), Rubicon's post-2017 rebuild into Magnite (worked), Criteo's retail-media turn (partial, still contested), The Trade Desk's OpenPath push into direct supply (contested), and a handful of curation plays too young to score. That is roughly two clear successes in six attempts, about 33%. Discounted to ≈ **0.20** for the specific weakness of the current evidence: no accredited CTV attention metric exists, the agentic revenue line is immaterial by every disclosure including its champions', and the one genuinely autonomous campaign on record is a single December 2025 campaign for a canned-cocktail brand.\n\n*The strongest evidence for it* is that the disintermediation everyone fears has so far pointed the other way. Every disclosed agentic deployment — PubMatic's autonomous campaign, Magnite's seller agent — ran through a supply-side platform's own product and cut out the *demand*-side platform. If agents compress a layer out of the chain, the evidence to date says the compressed layer is the DSP.\n\n*The challenge to it.* One campaign and a thousand deals are not a business, and the companies reporting them are the companies that need them to be true. PubMatic bundles its agentic revenue into a four-product bucket precisely specific enough to grow 80% and precisely vague enough to be unfalsifiable. Until a seller discloses agentic revenue in isolation, or a take rate goes *up*, this scenario rests on vendor testimony.\n\n---\n\n## Scenario Four — Structural Break\n\n**12–20%.**\n\nAn exogenous shock resets the board. Judge Brinkema orders AdX divested, the order survives appeal, and the resulting reshuffle of publisher supply paths hands the independent sell side either a windfall or a new and better-capitalized competitor. Or the Supreme Court's pending Video Privacy Protection Act case, running alongside class actions against Samsung and Amazon's Fire TV, lands in a way that makes automatic content recognition data legally radioactive — and the targeting layer under half of CTV's value proposition has to be rebuilt around context. Or a true agent-to-agent transaction layer arrives over AdCP or the IAB Tech Lab's framework and the auction, along with its take rate, becomes the most obviously compressible cost in the chain.\n\n*Derivation.* Decompose the three shocks, treating them as roughly independent, then discount for the difference between a shock occurring and a shock *mattering*. A structural Google remedy ordered and effective before end-2029: about 0.16, built from roughly 0.45 that divestiture is ordered — Brinkema has publicly questioned structural relief on timing grounds — times roughly 0.35 that it survives appeal and is implemented with real effect inside the window, against Google's own two-year separation estimate and with no AdX buyer yet identified. A privacy ruling that materially guts ACR targeting: about 0.15, tempered because the Supreme Court could equally narrow the statute and *reduce* the exposure. A genuine agent-driven disintermediation of the auction: about 0.10, given that no public example exists of a full negotiate-and-transact cycle with no supply-side platform in the chain, and the standards contest between AdCP and AAMP is unresolved. At least one occurring is 1 − (0.84 × 0.85 × 0.90) ≈ 0.36. But a shock absorbed without resetting the competitive order just returns you to the modal case, so multiply by roughly 0.45 for the probability that it dominates the outcome: ≈ **0.16**.\n\n*This is the number most likely to be underpriced,* and the derivation shows why. The individual shocks are considerably more likely than the scenario — better than a one-in-three chance that at least one of them happens. Industry planning tends to treat each as a tail risk in isolation and never sums them.\n\n---\n\n## What Would Change This Call\n\nThe forecast is built to be updated, and a handful of observable events would move real weight between the scenarios. Watch these:\n\n| Signal | What it would tell you | Moves weight toward |\n|---|---|---|\n| Magnite's Disney renewal, due around October 2026 | Whether a marquee streamer still pays for an independent seller at the same terms | Renewal on similar terms → *Squeezed but Standing* or *Up the Stack*; loss or material reset → *Absorbed* |\n| The Brinkema remedies ruling and its appellate path | Whether the biggest supply-path shock in the market actually lands | Structural divestiture upheld → *Structural Break* |\n| Fox–Roku closing conduct (expected H1 2027) | Whether a content owner keeps a third-party marketplace open or closes it | Marketplace narrowed → *Absorbed* |\n| Any seller disclosing agentic revenue in isolation | Whether the agentic line is a business or a bucket | A real, material, separately reported number → *Up the Stack* |\n| A take rate that rises, anywhere, disclosed | The single cleanest signal that the move up the stack is working | Rising disclosed take rate → *Up the Stack* |\n| MRC accreditation of a CTV-specific attention metric | Whether attention can become a traded currency rather than a planning input | Accreditation granted → *Up the Stack* |\n| The Supreme Court's VPPA decision | Whether ACR-derived targeting is legally durable | Broad liability affirmed → *Structural Break*; statute narrowed → *Squeezed but Standing* |\n| The next ANA transparency benchmark | Whether supply-path consolidation is still compressing intermediaries | SSP count per advertiser still falling → *Squeezed but Standing* or *Absorbed* |\n| A second streamer in-housing its ad server | Whether Netflix and Disney were the leading edge or the exception | More in-housing → *Absorbed* |\n\n---\n\n## Open Questions\n\nThe forecast rests on a few things I could not resolve, and they are worth naming rather than burying. Index Exchange's actual CTV revenue is unknown — it discloses nothing, and third-party estimates for its total business span $100 million to $250 million, which is not a range you can build a share model on. No seller anywhere discloses guaranteed-outcome miss rates, so the risk sitting on sell-side balance sheets from outcome deals is genuinely unmeasured, by me and by the market. Whether Nexxen's fourth-quarter 2025 CTV decline was an anomaly or the start of a slide will not be clear for several more quarters, and it matters for how fast the mid-tier consolidates. And nobody has yet run the experiment that would settle the attention argument: a controlled comparison of attention-priced against non-attention-priced CTV deals, holding creative and audience constant, funded by someone with no stake in the answer.\n\n## Sources\n\n1. Emarketer / MediaPost, \"Emarketer CTV Ad Forecast\" and subsequent CTV forecast updates through 2029, https://www.emarketer.com/content/ctv-becomes-tv-s-growth-engine-linear-collapses — Tier 5 (analytical forecaster). The market growth curve every scenario inherits: ~$37.95B (2026) → ~$46.89B (2028) → ~$51B (2029), growth cooling ~14% → ~11%, CTV passing traditional TV in 2028.\n2. Magnite, Inc., First Quarter 2026 Results, https://investor.magnite.com/news-releases/news-release-details/magnite-reports-first-quarter-2026-results — Tier 1 (primary). CTV contribution ex-TAC of $82.3M, +30% YoY, crossing 51% of total contribution.\n3. PubMatic, Inc., First Quarter 2026 Financial Results, https://investors.pubmatic.com/news-releases/news-release-details/pubmatic-announces-first-quarter-2026-financial-results/ — Tier 1 (primary). CTV growth of 18% YoY, total revenue of $62.6M, and the composition of the \"emerging revenue\" bucket.\n4. Association of National Advertisers, Programmatic Transparency Benchmark, Q2–Q4 2025 editions, https://www.ana.net/content/show/id/pr-2026-02-programatic — Tier 2 (industry body). Share of spend reaching publishers (~47.1%), the fall in median SSP count per advertiser from 19 to 17 in a single quarter, and private-marketplace share of CTV transactions.\n5. Digiday, \"Google's ad tech empire faces its moment of truth,\" and AdExchanger remedy-phase coverage, https://digiday.com/media-buying/googles-ad-tech-empire-faces-its-moment-of-truth/ — Tier 5 (specialist trade). Status of the remedies phase as of mid-2026: closing arguments concluded November 2025, no ruling issued, Brinkema's stated skepticism about structural relief on timing grounds.\n6. Fox Corporation, \"Fox Corporation to Acquire Roku, Inc.,\" https://investor.foxcorporation.com/news/corp-press-releases/2026/fox-corporation-to-acquire-roku-inc/ — Tier 1 (primary). The ~$22B definitive agreement of June 15, 2026, pending shareholder and regulatory approval, expected to close in the first half of 2027.\n7. Ropes & Gray, \"Supreme Court to Consider the Video Privacy Protection Act,\" https://www.ropesgray.com/en/insights/alerts/2026/02/supreme-court-to-consider-the-video-privacy-protection-act — Tier 2 (institutional legal analysis). The pending VPPA case and its potential scope.\n8. Netflix, Inc., FQ1 2026 Earnings Call Transcript, April 16, 2026, https://s22.q4cdn.com/959853165/files/doc_financials/2026/q1/Netflix-Inc-_Earnings-Call_2026-04-16T00_00_00_English-1.pdf — Tier 1 (primary). Programmatic \"on its way to becoming more than 50%\" of the non-live ads business — a trajectory, not an achieved threshold.\n9. PubMatic and Butler/Till, AdCP-enabled agentic campaign announcement, December 15, 2025, https://investors.pubmatic.com/news-releases/news-release-details/pubmatic-and-butlertill-launch-adcp-enabled-agentic-ai-campaign — Tier 1 (primary, self-interested). The single documented end-to-end autonomous CTV campaign, which bypassed the demand-side platform rather than the supply-side one.\n10. AdExchanger, \"Criteo Faces Tough Headwinds Until Agentic AI Ad Revenue Materializes,\" https://www.adexchanger.com/marketers/criteo-faces-tough-headwinds-until-agentic-ai-ad-revenue-materializes/ — Tier 5 (specialist trade). An outside, less-invested company's guidance assuming no material agentic revenue — the sanity check on agentic timelines.\n11. IAB and Media Rating Council, Attention Measurement Guidelines Version 1.0, November 2025, https://www.iab.com/wp-content/uploads/2025/11/IAB_MRC_Attention_Measurement_Guidelines_November_2025.pdf — Tier 1 (primary standard). Guidelines as the basis for future accreditation, and attention framed as complementary to rather than a replacement for existing metrics.\n12. Kalshi and Polymarket contract listings, checked July 2026 — Tier 1 (primary, by absence). Neither venue lists a contract on the Fox–Roku close, the Google ad-tech remedy, or supply-side platform share; recorded here because the absence of a market price is itself a methodological fact."}], "glossary": [{"term": "SSP", "aliases": ["supply-side platform"], "def": "The technology publishers use to auction their ad space to programmatic buyers in real time."}, {"term": "SSAI", "aliases": ["server-side ad insertion", "dynamic ad insertion", "DAI"], "def": "A method of stitching ads directly into a video stream on the server before it reaches the viewer's device, avoiding the buffering glitches that come from fetching ads separately on the device itself."}, {"term": "waterfall", "aliases": [], "def": "An older way of selling ad space where a publisher offers each impression to demand sources one at a time in a fixed priority order, so the first source to meet the price floor wins rather than the highest bidder."}, {"term": "header bidding", "aliases": [], "def": "A method of running one simultaneous auction across multiple ad buyers at once, so the actual highest bid wins, instead of offering an impression sequentially down a priority list."}, {"term": "OpenRTB", "aliases": ["real-time bidding protocol"], "def": "The technical rulebook, maintained by the IAB Tech Lab, that lets a publisher's system and a buyer's system understand each other's ad auction bid requests and responses."}, {"term": "schain", "aliases": ["SupplyChain object"], "def": "A piece of data attached to an ad auction request that lists every intermediary company that touched the ad space on its way from the publisher to the buyer, so a buyer can see how many resellers are involved."}, {"term": "sell-side curation", "aliases": ["curation layer"], "def": "A newer service in which a third party assembles and pre-scores a publisher's inventory into a ready-made, already-optimized package for buyers, rather than leaving buyers to sort through raw inventory themselves."}, {"term": "ad pod", "aliases": ["commercial pod"], "def": "A sequence of several consecutive ad slots shown together as one commercial break, which needs to be filled coherently (no repeat advertisers, sensible pacing) rather than slot by slot."}, {"term": "addressable TV", "aliases": [], "def": "Television advertising where different households watching the same program can be shown different commercials, based on data the distributor holds about each household."}, {"term": "ex-TAC", "aliases": ["contribution ex-TAC", "revenue ex-TAC"], "def": "A company's revenue after subtracting the traffic acquisition costs (the payments it owes publishers), used as a cleaner measure of what the platform actually keeps."}, {"term": "take rate", "aliases": [], "def": "The percentage of an advertiser's total spend that an ad-tech platform keeps for itself before the remainder passes down the chain toward the publisher."}, {"term": "supply-path optimization (SPO)", "aliases": ["SPO"], "def": "The practice of deliberately narrowing which intermediaries (SSPs, resellers, curators) a buyer routes ad spend through, in order to cut out low-value or redundant middlemen."}, {"term": "PMP (private marketplace)", "aliases": ["private marketplace deal"], "def": "A negotiated, invitation-only programmatic deal between a specific buyer and seller, as opposed to an open auction any authorized buyer can bid into."}, {"term": "MFA (made-for-advertising)", "aliases": [], "def": "Low-quality websites or apps built purely to harvest programmatic ad dollars rather than to serve a real audience."}, {"term": "arbitrage (in supply chains)", "aliases": ["reseller path"], "def": "Buying inventory from a publisher and reselling it onward at a markup, so the same ad slot reaches the buyer through an extra middleman who takes a cut."}, {"term": "DSP", "aliases": ["demand-side platform"], "def": "The technology an advertiser or agency uses to bid for ad space across many publishers from a single interface."}, {"term": "ad server", "aliases": [], "def": "The system that decides which specific ad and creative actually plays in a given slot, whether that slot was sold directly or through an auction."}, {"term": "ACR", "aliases": ["automatic content recognition"], "def": "Software built into a smart TV that identifies what's on screen regardless of the source (streaming app, cable box, game console), turning the television itself into a data-collection device for advertisers."}, {"term": "FAST", "aliases": ["free ad-supported streaming television"], "def": "Streaming channels that behave like traditional linear TV — a fixed schedule funded by ads — but delivered over the internet and requiring no subscription."}, {"term": "OEM", "aliases": ["original equipment manufacturer"], "def": "The company that physically builds a device, such as a television set, as distinct from the company that operates the software or content running on it."}, {"term": "programmatic guaranteed", "aliases": ["PMP", "private marketplace"], "def": "A way of buying ads where price and volume are negotiated in advance between a specific buyer and seller, but the ad still delivers through automated auction technology rather than manual insertion."}, {"term": "walled garden", "aliases": [], "def": "A platform that keeps its audience data, inventory, and ad-buying tools closed off from outside technology, forcing advertisers to transact entirely on the platform's own terms."}, {"term": "identity graph", "aliases": [], "def": "A company's map connecting a person's various devices, accounts, and viewing behavior into a single recognizable profile, used to target and measure ads consistently across screens."}, {"term": "Attention measurement", "aliases": ["attention metrics", "attention data"], "def": "Any method that tries to estimate whether a real person was actually looking at and mentally engaged with an ad, rather than just having it technically rendered on a screen near them."}, {"term": "Viewability", "aliases": ["viewable impression"], "def": "An industry-standard test of whether enough of an ad's pixels were technically visible on screen for long enough to count as shown, regardless of whether any human actually looked at it."}, {"term": "AU (Attention Unit)", "aliases": ["Adelaide AU"], "def": "Adelaide's 0-to-100 score that predicts, from a statistical model rather than direct observation, how likely a given ad placement is to capture attention and drive a business result."}, {"term": "Pre-bid attention segment", "aliases": ["pre-bid attention targeting"], "def": "A filter applied before an ad auction happens that excludes inventory a model predicts will score below a chosen attention threshold, so low-attention placements never enter the bidding in the first place."}, {"term": "Curated deal / curation", "aliases": ["SSP curation"], "def": "A paid, pre-packaged bundle of ad inventory that a supply-side platform or third party has screened in advance against a buyer's quality criteria, such as attention or brand safety, before it ever reaches the open auction."}, {"term": "MRC accreditation", "aliases": ["Media Rating Council accreditation"], "def": "An independent audit and certification, run by the advertising industry's own measurement watchdog, that verifies a company's metric is being calculated the way it claims to be — the closest thing ad tech has to a trusted seal of approval."}, {"term": "Panel-based measurement", "aliases": ["opt-in panel"], "def": "Data gathered from a relatively small group of people who agreed to be watched or tracked, then mathematically scaled up to represent the much larger general population — accurate for the panel itself, but only an estimate for everyone else."}, {"term": "Co-viewing", "aliases": [], "def": "How many people are actually in the room and watching when a household's TV or streaming device is on, as opposed to counting the household as one viewer regardless of how many people are really paying attention."}, {"term": "Mere-exposure effect", "aliases": [], "def": "A well-established finding in psychology that people tend to develop a preference for things simply because they've been repeatedly exposed to them, even when that exposure was brief or not consciously noticed."}, {"term": "performance CTV", "aliases": ["outcomes-based CTV", "performance TV"], "def": "Buying connected-TV advertising against a measurable business result — a sale, lead, install, or visit — instead of against reach or impressions."}, {"term": "cost-per-outcome (CPO)", "aliases": ["CPA", "cost-per-acquisition"], "def": "A pricing model where the advertiser names the price it will pay per completed result and the seller is paid only when that result happens, shifting the risk of a non-converting ad onto the seller."}, {"term": "incrementality", "aliases": ["incrementality testing"], "def": "A test that proves an ad actually caused an outcome, rather than the customer having done it anyway, usually by comparing an exposed group against a matched group that didn't see the ad."}, {"term": "clean room", "aliases": ["data clean room"], "def": "A secure environment where two companies can jointly analyze their combined data to answer a question without either one ever seeing the other's raw, individual-level records."}, {"term": "identity resolution", "aliases": ["household identity graph"], "def": "The technology that links a person or household seen on one device (like a TV) to the same person or household acting on another device (like a phone), so an ad exposure can be tied to a later action."}, {"term": "last-touch attribution", "aliases": [], "def": "A measurement shortcut that gives 100% of the credit for a sale to whichever single ad or channel was seen right before the purchase, ignoring everything that happened earlier in the customer's journey."}, {"term": "selection bias", "aliases": ["selection effect"], "def": "A measurement error where the people who saw an ad were already more likely to buy anyway, making the ad look more effective than it actually was."}, {"term": "mental availability", "aliases": [], "def": "How easily and in how many different buying situations a brand comes to a shopper's mind — the marketing-science idea that brands grow mainly by building this up, not by chasing people already about to buy."}, {"term": "agent (AI agent)", "aliases": ["agentic AI", "agentic advertising"], "def": "Software given a goal rather than a fixed set of instructions, which then decides for itself what steps to take — querying data, evaluating options, and executing actions — instead of a human or a hard-coded script doing it step by step."}, {"term": "MCP (Model Context Protocol)", "aliases": [], "def": "An open standard, created by Anthropic, that defines how an AI model calls outside tools and retrieves outside data in a structured way — the general-purpose 'wire' that advertising-specific agent protocols are built on top of."}, {"term": "AdCP (Advertising Context Protocol)", "aliases": ["Ad Context Protocol"], "def": "An advertising-specific protocol built on top of MCP that gives buyer and seller AI agents a shared vocabulary for discovering inventory, building media plans, and transacting deals."}, {"term": "AAMP", "aliases": ["Agentic Advertising Management Protocols"], "def": "The IAB Tech Lab's umbrella framework for agentic advertising standards, built on the industry's existing transaction standards, offering buyer- and seller-agent reference implementations as a more institutionally neutral alternative to AdCP."}, {"term": "VPPA (Video Privacy Protection Act)", "aliases": [], "def": "A 1988 U.S. federal law barring video providers from disclosing a person's video-viewing history without consent, now being applied by plaintiffs' lawyers to streaming apps and smart-TV automatic content recognition data."}, {"term": "IVT (invalid traffic)", "aliases": ["ad fraud"], "def": "Non-human or otherwise illegitimate ad requests and impressions generated to fraudulently extract advertiser spend, increasingly generated by AI bots designed to mimic real human viewing behavior."}, {"term": "traffic shaping", "aliases": ["bid throttling"], "def": "An SSP deciding in advance which bid requests are even worth sending to which buyers, so it doesn't pay to process billions of auctions no one was ever going to win."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  var sceneTpl = document.getElementById('reader-scene-template');
  if (sceneTpl && h1 && sceneTpl.content && sceneTpl.content.firstElementChild) {
    well.insertAdjacentElement('afterend', sceneTpl.content.firstElementChild.cloneNode(true));
  }
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
const menuBtn = document.getElementById('menu-btn');
menuBtn.onclick = () => document.body.classList.toggle('menu-open');
function closeMenu() { document.body.classList.remove('menu-open'); }

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}
function chunkText(t) {
  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);
  return out;
}
function pickVoice() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  const name = sel && sel.value;
  const vs = synth.getVoices();
  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';
    tip.textContent = 'Tip: download Enhanced or Premium voices in your OS accessibility settings for much richer audio.';
    document.body.appendChild(tip); setTimeout(() => tip.remove(), 8000);
  }
}
function speakChunk() {
  if (!listening) return;
  if (lidx >= lchunks.length) {
    if (sleepMode === 'chapter') { stopListen(); return; }
    if (listenAuto && listenIdx < docs.length - 1) {
      listenIdx++; autoNext = true; show(listenIdx); autoNext = false;
      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();
    } else stopListen();
    return;
  }
  const u = new SpeechSynthesisUtterance(lchunks[lidx]);
  u.rate = listenRate; const vo = pickVoice(); if (vo) u.voice = vo;
  u.onend = () => { if (listening && !paused) { lidx++; speakChunk(); } };
  u.onerror = () => { if (listening && !paused) { lidx++; speakChunk(); } };
  synth.speak(u);
}
function startListen() {
  if (!synth) return;
  synth.cancel(); listening = true; paused = false; listenIdx = current;
  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.add('on');
  speakChunk();
}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  if (lbar) lbar.classList.remove('show');
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.remove('on');
}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }
function setSleep(sec) {
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  sleepMode = sec === 1 ? 'chapter' : 'none';
  if (sec > 1) sleepTimer = setTimeout(stopListen, sec * 1000);
}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);
  lbar.querySelector('#lb-toggle').onclick = togglePause;
  lbar.querySelector('#lb-stop').onclick = stopListen;
  lbar.querySelector('#lb-rate').onchange = function () { listenRate = +this.value; };
  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };
  populateVoices();
  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });
};
window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command
// palette jumps that land on a chapter of the corpus already open (no reload).
window.addEventListener('hashchange', () => {
  const h = location.hash.match(/^#ch-(\d+)$/);
  if (h && +h[1] !== current) show(+h[1]);
});

// Related reading at the foot of the column — corpus-level, from the inlined
// library manifest's precomputed similarity graph (no fetch). Deferred to
// DOMContentLoaded because the shell (which carries #library-manifest) is
// injected into the page AFTER this script.
function renderRelated() {
  const relEl = document.getElementById('related');
  const mEl = document.getElementById('library-manifest');
  if (!relEl || !mEl) return;
  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }
  const me = LIB.find(x => x.slug === corpus.slug);
  const rel = (me && me.related) || [];
  if (!rel.length) return;
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'
        + '<span class="related-cat">' + esc(r.category || '') + '</span>'
        + '<span class="related-t">' + esc(r.title) + '</span></a>').join('')
    + '</div>';
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {
  var bar = document.getElementById('reader-progress'); if (!bar) return;
  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }
  document.addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '620px', normal: '700px', wide: '820px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {
    contentEl.style.setProperty('--reader-fs', SIZES[fs]);
    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';
    document.body.appendChild(panel);
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var v = b.getAttribute('data-v');
      if (b.parentNode.id === 'tp-size') { fs = v; localStorage.setItem('reader-fs', v); }
      else { meas = v; localStorage.setItem('reader-measure', v); }
      applyType(); mark();
    });
  }
  btn.onclick = function (e) {
    e.stopPropagation();
    if (!panel) build();
    if (panel.classList.toggle('open')) {
      mark();
      var r = btn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      var top = r.top - panel.offsetHeight - 8;
      panel.style.top = (top < 8 ? r.bottom + 8 : top) + 'px';
    }
  };
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
})();

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;
      b.setAttribute('data-term', m.term); b.setAttribute('data-def', m.def);
      b.setAttribute('aria-label', m.term + ': ' + m.def);
      node.parentNode.insertBefore(b, after);
      used[m.term] = 1; break;                                    // one chip per text node
    }
  });
}

(function setupGlossary() {
  if (!GLOSS.length) return;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var pop = document.createElement('div'); pop.id = 'gloss-pop'; pop.setAttribute('role', 'tooltip');
  document.body.appendChild(pop);
  var hoverCap = !(window.matchMedia && window.matchMedia('(hover: none)').matches);
  var openFor = null, cEl = document.getElementById('content');
  function open(btn) {
    pop.innerHTML = '<div class="gp-term"></div><div class="gp-def"></div>';
    pop.querySelector('.gp-term').textContent = btn.getAttribute('data-term');
    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');
    pop.classList.add('open');
    var r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 8));
    var top = r.top - ph - 8; if (top < 8) top = r.bottom + 8;
    pop.style.left = left + 'px'; pop.style.top = top + 'px'; openFor = btn;
  }
  function close() { pop.classList.remove('open'); openFor = null; }
  if (hoverCap) {
    cEl.addEventListener('pointerover', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b) open(b); });
    cEl.addEventListener('pointerout', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b && openFor === b) close(); });
    cEl.addEventListener('focusin', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b) open(b); });
    cEl.addEventListener('focusout', function () { close(); });
  }
  cEl.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.gloss'); if (!b) return;
    e.preventDefault(); if (openFor === b) close(); else open(b);
  });
  document.addEventListener('click', function (e) {
    if (openFor && !(e.target.closest && (e.target.closest('.gloss') || e.target.closest('#gloss-pop')))) close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener('scroll', function () { if (openFor) close(); }, { passive: true });

  var tbtn = document.getElementById('terms-btn'); if (!tbtn) return;
  tbtn.hidden = false; var panel = null;
  tbtn.addEventListener('click', function () {
    if (!panel) {
      panel = document.createElement('div'); panel.id = 'gloss-panel';
      var sorted = GLOSS.slice().sort(function (a, b) { return a.term.localeCompare(b.term); });
      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';
      sorted.forEach(function (e) { h += '<dt>' + esc(e.term) + '</dt><dd>' + esc(e.def) + '</dd>'; });
      panel.innerHTML = h + '</dl>'; document.body.appendChild(panel);
    }
    var opened = panel.classList.toggle('open');
    if (opened) {
      var r = tbtn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();
</script>

      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
