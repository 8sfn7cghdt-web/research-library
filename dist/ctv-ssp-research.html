\"310\" class=\"t-muted\">MRC attention metric<\/text>\n<text x=\"62\" y=\"326\" class=\"t-muted\">no common unit<\/text>\n<text x=\"274\" y=\"154\" font-weight=\"bold\" style=\"fill:var(--text)\">live evidence<\/text>\n<text x=\"274\" y=\"172\" class=\"t-muted\">Roku Ads Manager $500<\/text>\n<text x=\"274\" y=\"188\" class=\"t-muted\">Amazon self-serve no min.<\/text>\n<text x=\"274\" y=\"204\" class=\"t-muted\">Vibe + Vizio + Walmart<\/text>\n<rect x=\"274\" y=\"222\" width=\"136\" height=\"32\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"342\" y=\"242\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--accent)\">$3.6B committed<\/text>\n<text x=\"274\" y=\"276\" font-weight=\"bold\" style=\"fill:var(--text)\">missing proof<\/text>\n<text x=\"274\" y=\"294\" class=\"t-muted\">no public miss rates<\/text>\n<text x=\"274\" y=\"310\" class=\"t-muted\">no guarantee-loss line<\/text>\n<text x=\"274\" y=\"326\" class=\"t-muted\">CPA risk undisclosed<\/text>\n<text x=\"486\" y=\"154\" font-weight=\"bold\" style=\"fill:var(--text)\">live evidence<\/text>\n<text x=\"486\" y=\"172\" class=\"t-muted\">PubMatic AgenticOS<\/text>\n<text x=\"486\" y=\"188\" class=\"t-muted\">Magnite Seller Agent<\/text>\n<text x=\"486\" y=\"204\" class=\"t-muted\">AdCP + AAMP contest<\/text>\n<rect x=\"486\" y=\"222\" width=\"136\" height=\"32\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"554\" y=\"242\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--accent)\">1,000+ deals<\/text>\n<text x=\"486\" y=\"276\" font-weight=\"bold\" style=\"fill:var(--text)\">missing proof<\/text>\n<text x=\"486\" y=\"294\" class=\"t-muted\">agentic rev bundled<\/text>\n<text x=\"486\" y=\"310\" class=\"t-muted\">no raw-publisher bypass<\/text>\n<text x=\"486\" y=\"326\" class=\"t-muted\">audit/liability unsettled<\/text>\n<\/g>\n<g class=\"t-mono\" font-size=\"8.8\">\n<line x1=\"80\" y1=\"360\" x2=\"196\" y2=\"360\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"104\" cy=\"360\" r=\"5\" class=\"f-t4\"/><circle cx=\"146\" cy=\"360\" r=\"5\" class=\"f-t4\" opacity=\".5\"/><circle cx=\"188\" cy=\"360\" r=\"5\" class=\"f-t5\" opacity=\".45\"/>\n<text x=\"138\" y=\"384\" text-anchor=\"middle\" class=\"t-muted\">planning input,<\/text><text x=\"138\" y=\"398\" text-anchor=\"middle\" class=\"t-muted\">not currency<\/text>\n<line x1=\"292\" y1=\"360\" x2=\"408\" y2=\"360\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"316\" cy=\"360\" r=\"5\" class=\"f-t2\"/><circle cx=\"358\" cy=\"360\" r=\"5\" class=\"f-t2\" opacity=\".55\"/><circle cx=\"400\" cy=\"360\" r=\"5\" class=\"f-t5\" opacity=\".45\"/>\n<text x=\"350\" y=\"384\" text-anchor=\"middle\" class=\"t-muted\">growth engine,<\/text><text x=\"350\" y=\"398\" text-anchor=\"middle\" class=\"t-muted\">risk not shown<\/text>\n<line x1=\"504\" y1=\"360\" x2=\"620\" y2=\"360\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"528\" cy=\"360\" r=\"5\" class=\"f-t1\"/><circle cx=\"570\" cy=\"360\" r=\"5\" class=\"f-t1\" opacity=\".55\"/><circle cx=\"612\" cy=\"360\" r=\"5\" class=\"f-t5\" opacity=\".45\"/>\n<text x=\"562\" y=\"384\" text-anchor=\"middle\" class=\"t-muted\">traction,<\/text><text x=\"562\" y=\"398\" text-anchor=\"middle\" class=\"t-muted\">not yet margin<\/text>\n<\/g>\n<rect x=\"44\" y=\"446\" width=\"612\" height=\"50\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"62\" y=\"468\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">THE TEST THAT SETTLES IT<\/text>\n<text x=\"244\" y=\"468\" class=\"t-mono\" font-size=\"9.5\" style=\"fill:var(--accent)\">a disclosed take rate goes up<\/text>\n<text x=\"62\" y=\"486\" class=\"t-mono t-muted\" font-size=\"9\">Until then, the frontier products look like retention tools: real, shipping, useful, and not yet proof that the seller earns a larger cut.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> The three frontiers clear the product-existence test but not the repricing test: attention lacks a CTV currency, outcomes hide guarantee economics, and agentic trading is still reported mostly as bundled traction rather than a separately material revenue line.<\/figcaption>\n<\/figure>\n\n\nSeparating deployed-and-transacting from announced-and-piloted is the single most important\ndiscipline in this chapter, because the marketing volume on \"agentic\" vastly exceeds the transaction\nvolume, and every company quoted below has an obvious incentive to blur that line.\n\nPubMatic has moved fastest and made the loudest, most specific claims, and its claims are also the\nmost granular and checkable, which is itself notable. On December 15, 2025, PubMatic and media\nagency Butler/Till announced what both parties called the first fully autonomous, end-to-end agentic\nadvertising campaign, launched for Clubtails, a flavored-malt-beverage brand from Geloso Beverage\nGroup, running across connected TV [13][14]. The mechanics as disclosed: Butler/Till submitted a\ncampaign brief in natural language through Anthropic's Claude; PubMatic's agentic application —\nrunning on AdCP — interpreted that brief, built the media plan, and initiated campaign setup and\nongoing optimization of pacing, targeting, and performance with, in the companies' words, \"minimal\nhuman intervention\" [13][14]. The campaign ran on PubMatic's Activate platform, which the company\ndescribes as enabling agentic buying specifically against its premium, direct-supply footprint —\nmeaning the inventory pool an agent could actually transact against was PubMatic's own curated\ndirect supply, not the open exchange at large [14]. Notably, this transaction bypassed the\ntraditional demand-side platform entirely: the brief went from agency to Claude to PubMatic's own\nagentic layer, with no DSP interface in the loop — itself a small, concrete data point in the\ndisintermediation argument below, though it disintermediated the DSP, not the SSP.\n\nBy PubMatic's first-quarter 2026 earnings disclosures, the company reported more than 1,000\nAI-powered agentic deals transacted, delivering — its words — \"millions of dollars\" in publisher\nmonetization, and more than 30 fully autonomous, end-to-end campaigns launched globally since the\nAgenticOS platform's January 2026 launch [15]. AgenticOS itself comprises more than 20 AI agents\navailable to buyers and publishers for automating core workflows [15]. On the revenue line,\nPubMatic's \"emerging revenue\" bucket — which bundles AgenticOS, its Activate product, Commerce\nMedia, and Connect together, not agentic revenue in isolation — grew over 80% year over year in the\nfirst quarter of 2026 and reached roughly 14% of total company revenue [15]. CEO Rajeev Goel has\nguided toward a return to double-digit overall revenue growth in the second half of 2026, framing\nagentic transactions as compounding a data advantage with each additional deal [15][16]. Read that\ncarefully: \"millions of dollars\" of publisher monetization across 1,000-plus deals, against a\ncompany with roughly $63 million in a single quarter's total revenue, is a real but still small\nfraction of the business — evidence of genuine traction, not yet evidence of a business model that\nhas arrived.\n\nMagnite's posture is more skeptical and more efficiency-framed, and it is worth reading that\ndifference as strategic rather than merely temperamental — PubMatic is the smaller company with more\nto gain from being first to a growth narrative; Magnite, the larger independent SSP, has more to\nlose from overclaiming a technology still short on hard proof. On April 27, 2026, Magnite announced\nits Seller Agent, through which publishers can build custom inventory and audience packages with\nflexible pricing and targeting and make that inventory discoverable and purchasable directly by\nbuyer agents — explicitly framed as enabling agent-to-agent transactions rather than agent-to-human\n[17]. In December 2025, Magnite said it had set live one of the first AdCP-based buys running\nthrough its Seller Agent [17]. On June 11, 2026, Magnite layered a coordination product on top\ncalled Magnite Orchestration, which lets buyers connect their own buyer agents to Magnite's Seller\nAgent and, in the company's framing, build on \"the industry's largest pool of premium inventory,\nsupply-side intelligence, and automation\" — with named pilot partners including dentsu and DIRECTV\nAdvertising, both explicitly described as testing rather than at scale [17][18]. Magnite's parallel\nAI announcements — anomaly detection for auction-performance shifts, demand-path optimization, and\ndynamic pricing — sit closer to the unglamorous-but-working tier described earlier than to the\nagentic-trading tier, and Magnite's own blog content on the Seller Agent frames it deliberately as\naugmenting human decision-making rather than replacing the DSP relationship, a materially more\nconservative framing than PubMatic's \"minimal human intervention\" language [17].\n\nBeyond the two independents most invested in agentic trading, the record thins fast. Index\nExchange's agentic activity as of mid-2026 is concentrated in its Data Vendor Ecosystem and curation\ntooling rather than any publicized autonomous-transaction claim comparable to PubMatic's or\nMagnite's. Nexxen, FreeWheel, Amazon, and the major streamers have not, in the public record\nsurfaced here, announced a comparable live agentic-transaction deployment as of this writing — which\ndoes not mean nothing is happening internally, but does mean any claim to that effect would\ncurrently rest on inference rather than disclosure, and should be treated that way.\n\nThe gap between the two companies furthest along is instructive on its own: PubMatic disclosed\n1,000-plus deals and named a specific brand, agency, and dollar description (\"millions\"); Magnite\ndisclosed \"one of the first\" AdCP buys and named pilot partners without a comparable transaction\ncount. That asymmetry in specificity is itself a signal about how far each company's agentic claims\nhave moved from pilot toward production — PubMatic's disclosure is precise enough to be falsifiable\nin a way that generic \"we are testing with X\" language is not.\n\n## The Disintermediation Question\n\nThis is the analytical spine of the chapter, and it deserves to be argued at full strength on both\nsides before landing anywhere.\n\n**The case that agents entrench the supply-side platform.** An agent — buyer's or seller's — needs a\ncounterparty that actually holds something: the direct publisher relationship, the ad server that\nhas to physically serve the creative and log the impression, the contextual and identity signal that\nmakes the inventory targetable in the first place, and — this is the load-bearing point — the\ndelivery guarantee that makes a transaction enforceable. When PubMatic's Clubtails campaign ran, the\nagent did not negotiate with \"CTV inventory\" in the abstract; it negotiated against PubMatic's\nspecific, curated pool of premium direct supply, discoverable and purchasable only because PubMatic\nhad already done the unglamorous work of assembling seller relationships, brand-safety controls, and\nage-appropriate audience gating that a model cannot conjure on its own [14]. An agent needs\nsomewhere to point. Every protocol discussed above — AdCP, AAMP — is explicitly a\nbuyer-agent-talks-to-seller-agent framework, which by construction preserves two counterparties\nrather than collapsing them into one. And the deepest structural point: an agent that can negotiate\na deal still cannot serve an ad, verify it rendered, reconcile the bill, or stand behind a make-good\nwhen delivery falls short — all functions currently performed by the SSP's non-agentic\ninfrastructure, none of which the agentic layer replaces even in PubMatic's most aggressive framing.\nOn this reading, agentic trading is a new front door onto the same house; the SSP simply automates\nwho rings the bell.\n\n**The case that agents hollow the supply-side platform out.** The Clubtails campaign is also, on a\nless charitable reading, the first hard evidence for the opposite thesis: it already bypassed a\ndemand-side platform entirely. The brief went agency to Claude to PubMatic's agentic layer with no\nDSP interface anywhere in that chain [13][14]. If a natural-language brief can skip the DSP because\nan agent can do the campaign-building work a DSP's interface used to require, the identical logic\napplies one layer down: if a buyer's agent can query inventory availability, evaluate contextual and\naudience fit, and settle terms directly against a publisher's ad server over a shared protocol, what\ndoes the auction layer in between — the SSP itself — actually contribute that the protocol and the\nad server cannot? An auction's economic function is price discovery under uncertainty and\ninformation asymmetry; a sufficiently capable agent, talking to many sellers' agents simultaneously\nand comparing terms in real time, is itself a form of price discovery, and one that does not need to\npay a take rate to an intermediary auction to perform. The SSP's take rate — the single most\nobviously priced, most easily benchmarked line item in the entire chain — is also the most obviously\ncompressible cost once the transaction becomes a negotiation between two pieces of software rather\nthan a blind real-time auction across dozens of participants. Scope3's central role in building AdCP\nis worth reading in this light: Scope3 is not a supply-side platform and has no auction-take-rate\nrevenue to protect: its interest in agentic protocols is at minimum neutral to, and plausibly\naligned with, a future where fewer intermediaries sit between a brief and inventory.\n\n**Which way the evidence actually leans.** As of mid-2026, entrenchment, not erasure — but on thin\nand self-interested evidence, and for reasons that are more structural than technological. Every\ndisclosed agentic deployment discussed above ran through an SSP's own product, not around it:\nPubMatic's AgenticOS, Magnite's Seller Agent and Orchestration. No independent buyer's agent has\npublicly demonstrated a full negotiate-and-transact cycle against raw publisher inventory with no\nsupply-side platform anywhere in the chain — the DSP got cut out first, not the SSP, which is the\nopposite order the strong disintermediation thesis would predict if auction infrastructure really\nwere the most compressible layer. That ordering is telling: DSPs' core function — translating a\nbuyer's strategy into bids across many exchanges — is exactly the kind of interface-and-workflow\nlayer an agent replaces most naturally, while an SSP's core function — holding the actual seller\nrelationship, the delivery guarantee, and the brand-safety and compliance apparatus a publisher\nrequires before granting access to its inventory — is harder for a model to disintermediate because\nit requires standing, accountability, and a real commercial relationship with the seller, not just\nAPI access. But note who is telling this part of the story: the two loudest voices on entrenchment,\nMagnite and PubMatic, are the two companies whose entire business model depends on the answer coming\nout that way, and the protocols that carry the transactions were substantially built or backed by a\nsell-side coalition (AdCP) or an institution whose existing standards already run the sell side (the\nIAB Tech Lab). No disinterested party has yet made the disintermediation case with comparable\nspecificity and volume of disclosure. The honest position: entrenchment is currently winning on the\nscoreboard, but the scoreboard is being kept by the team that benefits from that score, over a\nsample of roughly eighteen months and a few thousand transactions against a market that runs\ntrillions of auctions a day.\n\n## The Honest Caveats\n\nNone of the numbers in this chapter should be mistaken for a business model that has arrived.\nPubMatic's own framing — \"millions of dollars\" in publisher monetization across 1,000-plus deals —\nis, against a company doing roughly $63 million in a single quarter of total revenue, real but still\nmarginal [15]. Criteo, a comparable ad-tech company operating on the demand side, has told investors\ndirectly that it \"does not assume any material revenue contribution from agentic AI initiatives\" in\nits own guidance — a useful outside check on how seriously a sober management team, not selling the\nagentic story itself, is currently pricing it in [19]. Practitioner sentiment lags the launch\nenthusiasm by a wide margin: one 2026 survey found 82% of respondents not currently using AI for\nmarketing in streaming at all, and separate research found that while 60% of marketers plan to\nincrease AI-related media spending, only 19% believe AI is causing major workflow transformation — a\ngap between stated intent and actual operational change that should temper every vendor claim in\nthis chapter [20]. \"Agentic\" is, at this moment, doing genuine and heavy marketing duty across the\nsector; treat every company's use of the word as a claim about positioning until it is backed by a\ntransaction count, a dollar figure, or an independently verifiable log, the way PubMatic's\ndisclosure — imperfect as it is — at least attempts to be.\n\nThree structural questions remain entirely unsettled, and none of the companies making agentic\nclaims has a public answer to any of them. How is an agent-negotiated deal audited? Traditional\nprogrammatic auditing assumes a human-legible chain of bid requests, deal IDs, and log-level data\nthat a compliance team or a Media Rating Council review can reconstruct after the fact; an agent\nthat reasons its way to a decision through a large language model's internal process does not\nnecessarily produce that same legible trail, and no standards body has yet published an agreed\nmethodology for auditing model-driven media decisions the way MRC accredits impression counts today.\nHow is brand safety enforced when a model, not a human-configured keyword or category list, is the\none picking the inventory? An LLM's contextual classification can be wrong in ways that are hard to\npredict in advance and hard to explain after the fact, and \"the model decided this was brand-safe\"\nis not yet a standard a brand's legal or compliance function has accepted as sufficient. And who is\nliable when an agentic transaction goes wrong — when an autonomous campaign overspends,\nunder-delivers, buys unsafe inventory, or gets defrauded by the agentic-bot traffic DoubleVerify is\nalready tracking? The agency, the platform whose agent executed the trade, the model provider, or\nsome newly invented shared-liability framework — nobody in this chapter's source record has offered\na settled answer, and until one exists, the honest expectation is that agentic trading will keep\nexpanding fastest in the lowest-stakes, most reversible corners of the media plan (small-budget,\ndirect-response-adjacent, brand-tolerant categories like the flavored-malt-beverage campaign that\nmade the first headline) rather than in the categories — regulated, brand-sensitive, high-stakes —\nwhere the audit and liability gaps would actually bite.\n\n## The Cross-Cutting Shocks That Could Reset the Board by 2029\n\nEverything above describes AI and agentic protocols as forces the sell side is choosing to adopt.\nThe five forces below are different in kind: none of them originates inside ad tech's own product\nroadmaps, all of them are already operating today in some measurable form, and any one of them could\nreorder who has meaningful CTV supply-side leverage by 2029 regardless of how the agentic story\nresolves. Read them together, not separately — several compound each other.\n\n**Privacy and signal loss: the VPPA wave and what it does to ACR-derived targeting.** The mechanism\nis specific and worth stating precisely: the Video Privacy Protection Act (VPPA) is a 1988 federal\nlaw, originally written after a newspaper published a Supreme Court nominee's video-rental history,\nthat prohibits a \"video tape service provider\" from disclosing a consumer's video-viewing history\nwithout consent — and plaintiffs' firms have spent the past three years successfully arguing that\nstreaming apps and, increasingly, the smart TVs and set-top boxes underneath them, count as\nvideo-tape service providers under that forty-year-old statute. Automatic content recognition (ACR —\nsoftware embedded in a smart TV or connected device that samples the screen's audio and video every\nfew hundred milliseconds and matches it against a reference database to identify exactly what is\nplaying, independent of any app-level tracking) is now the direct target: Samsung Electronics\nAmerica was sued on January 9, 2026 in the Southern District of New York over allegations that its\nTVs' ACR software builds detailed viewing profiles and shares or sells that data to companies\nincluding Google and X, sampling the screen roughly every 500 milliseconds [21]. Amazon was sued on\ncomparable ACR-tracking grounds on May 6, 2026 in the Western District of Washington over Fire TV\n[21]. These are not the first VPPA actions to reach settlement — a case against Willow TV settled\nfor $850,000 covering subscribers who streamed cricket video between mid-2021 and late 2023,\nevidence the exposure is not hypothetical [21] — but the Samsung and Amazon suits target the\ndevice-level ACR layer directly, which is the layer that feeds a meaningful share of CTV's identity\nand targeting data once cookie- and mobile-ID-based signal degrades elsewhere. Compounding the\nexposure: the U.S. Supreme Court agreed in early 2026 to hear a VPPA case, which means the scope of\nthe statute itself — who counts as a covered provider, what counts as a disclosure — is now a live\nquestion at the highest level rather than settled district-court-by-district-court [22]. The\nmechanism by which this reshapes the sell side: if ACR-derived viewing data becomes legally\nradioactive, or simply more expensive to collect and share under stricter consent requirements,\ncontextual signaling — the LLM-based approach detailed earlier in this chapter — becomes not just a\nnice-to-have alternative but the load-bearing targeting method by default, accelerating exactly the\nshift Magnite and Index are already betting on. State privacy laws layer on top of VPPA exposure\nrather than replacing it: a growing number of states now have comprehensive privacy statutes with\ntheir own consent and sale-of-data restrictions that apply independently of the federal VPPA fight,\nmeaning even a favorable Supreme Court ruling would not eliminate the compliance burden, only cap\none dimension of it. The counter-force: ACR vendors and device manufacturers have strong commercial\nincentive to build compliant consent flows rather than exit the business — ACR data monetization is\na meaningful revenue line for TV manufacturers with thin hardware margins — and a Supreme Court\nruling that narrows VPPA's applicability to modern streaming (plausible, given the statute's age and\ndrafting for a pre-internet context) could relieve pressure rather than intensify it. This is a\ngenuinely two-sided legal risk, not a certainty running in one direction.\n\n**The Google ad-tech antitrust remedy: what a forced divestiture or a lighter behavioral remedy\nwould each do to supply paths.** Judge Leonie Brinkema has already ruled, in the liability phase,\nthat Google illegally monopolized both the publisher ad-server market (via DoubleClick for\nPublishers) and the ad-exchange market (via AdX), tying the two together [23]. What remains open, as\nof this writing, is the remedy: closing arguments concluded November 21, 2025, and Brinkema herself\nsignaled she is deciding between structural remedies (a forced divestiture of AdX, potentially DFP\nas well, with Google's own auction logic opened to outside scrutiny) and purely behavioral remedies\n(mandated interoperability, bans on self-preferencing, independent monitoring, with structural\nbreak-up held in reserve rather than ordered outright) [23][24]. Most observers cited in the trade\npress expected a ruling landing sometime in mid-2026, with years of appeals to follow regardless of\noutcome [24]. The mechanism, for the sell side specifically: Google's ad exchange and publisher ad\nserver are structurally central to a large share of programmatic CTV's plumbing today, even for\npublishers who use an independent SSP as their primary monetization partner, because DFP remains one\nof the most widely used publisher ad servers and AdX one of the largest exchanges by volume. A\nforced AdX divestiture would create, almost overnight, a new independent exchange competitor sized\nsomewhere between a scaled independent SSP and Google's current footprint — a genuinely novel supply\npath that does not exist today, though Brinkema's own skepticism about \"commercial reality,\" her\nconcern that no buyer for AdX has been identified, and her acknowledgment that Google itself once\nestimated a two-year window to actually separate this infrastructure all argue for a long, messy\nimplementation even if ordered [23]. A lighter, behavioral-only remedy — interoperability mandates\nand self-preferencing bans without a break-up — would be far less disruptive to existing supply\npaths but would still constrain how Google can favor its own exchange and ad server relative to\nindependent SSPs, which is itself a material, if smaller, opening for Magnite, PubMatic, Index, and\npeers to compete on more equal footing for publisher ad-server business they currently cannot easily\nwin. The counter-force in either direction: appeals. Google has signaled intent to appeal any\nstructural remedy, and Brinkema's own comments about timing suggest she is aware a divestiture order\ncould be tied up in appellate process for years before it takes practical effect — meaning even the\nmaximal remedy may not reshape supply paths on any timeline inside this chapter's 2029 horizon.\n\n**Streamer in-housing: every major streamer that builds its own stack is inventory leaving the\nindependent field.** The mechanism here is the simplest and the most linear of the five: a streamer\nthat builds its own ad server, its own curation and targeting logic, and its own direct sales\nrelationships needs an independent SSP for less of its inventory over time, even if it never fully\neliminates third-party programmatic access. Netflix is the clearest and most advanced case: it\nlaunched its own in-house ad platform, the Netflix Ads Suite, in November 2024, and 2026 is\ndescribed as the first full year Netflix has operated primarily on that in-house stack rather than a\nlicensed third-party ad server [25]. Netflix expects to roughly double its advertising revenue in\n2026, targeting around $3 billion, and is using the year to extend its own targeting and measurement\ncapabilities globally rather than deepen third-party dependence [25]. Critically, though, in-housing\nthe ad server has not meant abandoning programmatic access entirely — Netflix inventory remains\navailable through The Trade Desk, Google's DV360, and Magnite, and Netflix opened Amazon DSP access\nacross all ad-supported markets in 2026, with Yahoo DSP access following — which means in-housing\nthe ad server and the core decisioning stack is compatible with keeping several demand paths open,\nrather than a full walled-garden retreat [25]. Disney has moved in a comparable direction with its\nown Real-Time Ad Exchange (DRAX), while still integrating both Google's DV360 and The Trade Desk for\nprogrammatic access to its streaming inventory rather than closing the door to independent demand\nentirely [25]. Amazon and Roku, the two largest CTV platforms by reach, both now run their own DSPs\nin addition to owning their supply-side stacks, and their 2026 exclusive-partnership arrangement —\ncreating a shared addressable identifier across an estimated 80 million U.S. CTV households, more\nthan 80% of the domestic CTV household base — is precisely the kind of platform-to-platform\narrangement that routes volume between two owned stacks with less need for an independent\nintermediary in between [26]. The compounding mechanism across all of these: each streamer or device\nplatform that in-houses does not just remove its own inventory from the independent field, it also\nnormalizes the model for the next platform considering the same move, and it changes what a \"premium\nCTV supply path\" even means — increasingly, an inventory pool licensed to a handful of preferred\nDSPs directly, rather than exposed broadly across independent SSPs. The counter-force: agencies and\nadvertisers are pushing back toward a multi-DSP model precisely because managing five separate\nwalled-garden DSPs is operationally expensive and fragments reporting and frequency management\nacross platforms — Digiday's 2026 coverage of this dynamic notes independent DSPs like The Trade\nDesk remain essential specifically for publisher-centric buying strategies and private marketplace\ndeals spanning multiple streaming apps, a job no single platform-owned DSP can do across\ncompetitors' inventory [26]. In-housing is real and accelerating, but it produces genuine friction\nfor advertisers that keeps a cross-platform, independent layer commercially necessary even as each\nindividual platform's owned share grows.\n\n**The measurement-currency transition: what happens when the number everyone transacts against stops\nbeing one number.** For decades, Nielsen's ratings were the single, near-universal currency — the\nagreed unit both buyer and seller priced a TV deal against — for national television. That monopoly\non the unit of account is breaking apart in real time: Comscore, iSpot, and VideoAmp all received\nJoint Industry Committee (JIC) certification as currencies of record ahead of the 2025-2026\nbroadcast season, meaning multiple, non-interchangeable measurement providers are now simultaneously\naccredited to be the number a deal transacts against [27]. VideoAmp alone cleared roughly $3 billion\nin upfront deals in a recent cycle — an 880% increase year over year — across NBCUniversal,\nParamount, Warner Bros. Discovery, Amazon, Netflix, and all five major agency holding companies,\nevidence this is not a niche challenger but a genuine share shift already underway [27]. The\nmechanism by which this reshapes the sell side: when every buyer and seller agreed on one currency,\nan SSP's job included routing supply and reporting outcomes against a single, universally legible\nnumber; a multi-currency market means the same impression can be \"worth\" a different number\ndepending on which measurement provider a given buyer has chosen to trust, which raises the value of\na sell side that can normalize, reconcile, or arbitrate across currencies — and simultaneously\nraises the risk of disputes and reconciliation friction that did not exist under a single-currency\nregime. Layered on top of the multi-currency shift is a second, faster-moving trend: 2026 reporting\ndescribes outcome-based measurement — tying an ad's value directly to a business result rather than\nto a ratings or reach currency at all — as actively overtaking the currency debate itself, with\nadvertisers increasingly indifferent to which panel-based currency a deal cleared against so long as\nan outcome metric validates the spend [27]. That shift, if it continues, could make the entire\ncurrency-of-record fight moot faster than any of the JIC-certified competitors currently expect,\nredirecting the sell side's measurement investment toward the outcomes infrastructure covered in the\nadjacent chapter on performance-based buying rather than toward reconciling Nielsen against its\nchallengers. The counter-force: currency fragmentation is expensive and confusing for buyers used to\none number, and there is a real possibility the market converges back toward one or two dominant,\nmutually-accepted standards once the JIC's certification process forces some consolidation —\nmulti-currency chaos has historically been a transitional state in TV measurement, not a permanent\none, and both agencies and sellers have a shared interest in eventually settling back onto fewer,\nnot more, competing numbers.\n\n**The macro advertising cycle: the force none of the above control.** Every mechanism described in\nthis chapter and the ones before it — agentic adoption, contextual AI investment, curation-fee\ngrowth, in-housing capital expenditure — assumes a marketing budget willing to fund experimentation.\nA macro advertising downturn does not eliminate any of these trends, but it changes their sequencing\nsharply: in a contraction, buyers historically cut the newest, least-proven line items first and\ndefend the most measurable, most established ones, which would mean agentic trading — the newest,\nleast-proven, least-material-revenue item in this entire chapter — is disproportionately exposed\nrelative to the unglamorous, already-quantified AI (fraud detection, yield optimization) that\nsurvives any budget cycle because it demonstrably saves money rather than merely promising future\nefficiency. A downturn would also likely slow the pace of streamer in-housing capital investment,\nsince building an in-house ad stack is a multi-year capital commitment easiest to justify against a\ngrowing, not shrinking, ad budget, and it could shift measurement-currency leverage back toward\nwhichever provider offers the cheapest, most defensible number rather than the most innovative one.\nThe evidence this force is \"operating\" in mid-2026 specifically is less about a downturn already\nunderway — advertising spend in 2026 has generally been resilient, with CTV budgets reported as\ngrowing for a majority of surveyed marketers even as trust in performance claims lags — and more\nabout its latent, ever-present status as the variable that determines how much slack exists in the\nsystem to fund every AI and agentic bet described above [28]. The counter-force, such as it is, cuts\nthe other way from most macro risk: a downturn that squeezes marketing budgets could accelerate\nrather than delay AI adoption specifically, because cost-saving, ROI-provable AI tools (the\nunglamorous tier) become more attractive, not less, when budgets tighten and every dollar needs to\nbe justified against a measurable return — meaning a recession could simultaneously kill the\nspeculative agentic story and accelerate the boring, already-proven one.\n\nTaken together, these five forces do not point in one direction. Signal loss and streamer in-housing\nboth push against the independent sell side's supply and targeting position; a favorable Google\nremedy outcome and continued agency resistance to walled-garden fragmentation both push in its\nfavor; the measurement transition and the macro cycle are genuinely undetermined swing factors that\ncould break either way by 2029. The agentic protocol fight this chapter opened with will be resolved\ninside that same uncertain frame — a shock to signal availability, supply-path structure, or\nad-budget growth would change which counterparty an agent has any reason to negotiate with in the\nfirst place, which means the disintermediation question is not separable from these five forces so\nmuch as downstream of how each of them resolves.\n\n## Open Questions\n\n- Does AdCP or AAMP become the dominant agentic-transaction protocol, do they converge into a single\ninteroperable standard, or does the market end up running both depending on counterparty — and on\nwhat timeline?\n- What does PubMatic's and Magnite's disclosed agentic deal volume and dollar figure look like a\nyear from now — does the growth rate documented in early 2026 continue, plateau, or prove to have\nbeen front-loaded by early-adopter enthusiasm?\n- Will an independent auditing or brand-safety-attestation standard for agent-negotiated\ntransactions emerge from the IAB Tech Lab, the Media Rating Council, or elsewhere before agentic\nvolume reaches a scale where its absence becomes a genuine liability event?\n- Does a buyer's agent ever demonstrate a full negotiate-and-transact cycle against publisher\ninventory with no supply-side platform in the chain at all — the strong version of the\ndisintermediation thesis this chapter found no public evidence of as of mid-2026?\n- How does Judge Brinkema's eventual remedies ruling in the Google ad-tech case, and its appellate\nfate, actually land relative to the mid-2026 window most observers expected — and does the outcome\nmeaningfully redraw independent SSPs' addressable supply paths before 2029?\n- Does the Supreme Court's pending VPPA case narrow the statute's applicability to modern streaming\nand ACR data in a way that relieves the current litigation wave, or does it affirm broad coverage\nand accelerate the shift toward contextual, identifier-free targeting?\n\n## Sources\n\n1. PubMatic, \"Automated Bid Throttling & Machine Learning for Bid Requests\" and \"Improving Publisher\nMonetisation through Bid Throttling,\" PubMatic Blog, 2025-2026,\nhttps://pubmatic.com/blog/bid-throttling-efficient-infrastructure/ — Tier 6 (vendor blog); source\nfor the 50-billion-impression / 5-trillion-bid-request scale illustration and Smart Throttling\nmechanism, used as evidence of the claimed product function, not an independently verified\nperformance number.\n2. PubMatic, \"Why Traffic Shaping is Key to Success for CTV Buyers and Publishers,\" PubMatic Blog,\n2025-2026,\nhttps://pubmatic.com/blog/why-traffic-shaping-is-key-to-success-for-ctv-buyers-and-publishers/ —\nTier 6; supporting detail on ML-driven traffic shaping mechanics.\n3. PubMatic, \"Decision Fabric: How We Put Partner Intelligence Inside the Auction,\" PubMatic Blog,\n2026, https://pubmatic.com/blog/decision-fabric-how-we-put-partner-intelligence-inside-the-auction/\n— Tier 6; background on PubMatic's in-auction partner AI model architecture.\n4. Basis, \"Top DSPs for Ad Fraud Protection and Brand Safety in 2026,\" 2026,\nhttps://basis.com/insights/top-dsps-for-ad-fraud-protection-and-brand-safety-in-2026; and\nBidSwitch/industry coverage of bid-shading savings, 2026 — Tier 5/6; source for DoubleVerify's 140%\nYoY CTV fraud-scheme increase, the 50+ distinct bot attack/variant count, the identification of\nagentic-AI bot traffic as a new fraud vector, and the ~20% first-price bid-shading savings estimate.\n5. Beet.TV, \"Contextual Targeting Gains Ground in CTV: Magnite's Ryan Kenney,\" February 2026,\nhttps://www.beet.tv/2026/02/contextual-targeting-gains-ground-in-ctv-magnites-ryan-kenney.html —\nTier 5; source for Magnite's internal-test 2-9x contextual scale claim and framing of contextual\nsignals as central to 2026 CTV targeting.\n6. Magnite, \"Magnite Integrates Anoki ContextIQ Platform and AI Copilot to Bring Scene Level\nTargeting to CTV,\" press release, 2025-2026,\nhttps://www.magnite.com/press/magnite-integrates-anoki-contextiq-platform-and-ai-copilot-to-bring-scene-level-targeting-to-ctv/\n— Tier 6 (press release); source for the ContextIQ integration and \"first SSP\" claim — reported as\nMagnite's own claim.\n7. Magnite/GlobeNewswire, \"Magnite and Cognitiv Announce Deep Learning Integration for Real-Time\nCuration,\" January 6, 2026,\nhttps://www.globenewswire.com/news-release/2026/01/06/3213563/0/en/Magnite-and-Cognitiv-Announce-Deep-Learning-Integration-for-Real-Time-Curation.html\n— Tier 3 (wire); source for the ClearLine/Cognitiv deep-learning curation integration, dated and\nconfirmed live as of January 2026.\n8. ExchangeWire, \"Index Marketplaces Accelerates: Index Exchange Adds Data Vendor Ecosystem to Power\nSell-Side Audience Activation,\" February 17, 2026, and \"Adnami & I
