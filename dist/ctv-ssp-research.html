ncy for connected TV (CTV, television watched through internet-connected apps and devices rather than a cable box or antenna) the way viewability or gross rating points are. It is best described in 2026 as a premium overlay: a small, growing slice of CTV spend is priced or targeted using attention scores, while the overwhelming majority of programmatic CTV dollars still clear on reach, frequency, and completion rate. The case for attention rests on a real and unresolved measurement gap — CTV's unskippable, full-screen ad format makes the standard viewability metric almost meaningless as a quality signal, so buyers have a genuine reason to want something else. But the vendors supplying that \"something else\" measure different things, on incompatible scales, from small opt-in panels, and validate their own products mostly against brand-lift proxies rather than sales — and the marketing-science establishment, led by the Ehrenberg-Bass Institute, has produced peer-reviewed evidence that attention scores do not reliably predict the sales outcomes advertisers actually care about. The most inconvenient fact for the entire category: CTV already sits at or near the top of every attention leaderboard vendors publish, which makes attention a weak tool for discriminating quality *within* CTV even where it is a strong one *across* channels.\n\n## What Attention Measurement Actually Is\n\nThe \"so what\": four different things get called attention measurement, and they are not interchangeable — a buyer who does not know which one they are looking at cannot compare vendors, cannot audit a claim, and cannot tell whether a \"high-attention\" placement is validated science or a marketing brochure.\n\nAttention measurement, broadly, is any method that tries to estimate whether a human being was actually looking at, and cognitively engaged with, an ad — as distinct from merely having it rendered on a screen they were near. Four distinct methodologies compete under that one label, and they differ in what they can actually observe.\n\n**Panel-based eye-tracking and in-room presence** is the most literal form. TVision, the longest-running player in TV-specific attention measurement, uses cameras installed in an opt-in panel of roughly 5,000 U.S. households, weighted to Census demographics, to capture person-level, second-by-second data on who is in the room, where they are looking, and whether their eyes are on the screen when an ad plays — computer-vision detection of gaze and presence, not survey or self-report [1][2]. This is a genuine behavioral measurement, not a model, for the households in the panel. Its limitation is scale: it is a sample of thousands of homes statistically projected onto a national population of well over a hundred million TV households, which means every attention number TVision reports for a given publisher, daypart, or piece of creative carries sampling error that is rarely disclosed alongside the headline figure [3].\n\n**Modelled or predictive quality scoring** takes a different approach: rather than watching anyone in real time, it trains a statistical model on many campaigns' worth of contextual signals — time of day, share of voice, device and screen size, market, flight timing, static versus video creative, ad pod position — and predicts the likelihood that a placement would capture attention, calibrated against downstream outcomes like brand lift or store visits. Adelaide's AU (Attention Unit) metric is the leading example: a 0–100 score, refreshed quarterly, that is a probability estimate of attentive impact rather than a direct observation of any individual viewer [4]. This is a meaningfully different epistemic object from TVision's panel data — AU is inference from patterns across a large dataset of past campaigns, not a sensor reading of the specific impression a buyer is being asked to pay for.\n\n**Facial coding and emotion measurement** goes a layer deeper than presence-and-gaze, attempting to read valence and engagement from webcam-captured facial expressions against a machine-learning model trained on a large corpus of labeled human reactions. Realeyes is the leading vendor here, with a claimed training set of more than 18 million human observations mapped across roughly 350 billion video frames in 90 countries, used to predict not just whether someone was watching but how they felt about what they saw [5]. Facial coding is opt-in and panel-based like TVision, but adds an inferential layer — emotion classification from facial muscle movement — that is itself a modeled prediction, compounding the uncertainty of a panel-based measurement with the uncertainty of an emotion-recognition model trained on a different population than the one being measured.\n\n**Platform-side proxies** are the cheapest and most widely available category, and the one every CTV publisher and SSP (supply-side platform, the ad-tech system publishers use to auction their inventory to buyers) already has data for at essentially zero marginal cost: completion rate, share of screen, ad pod position, and co-viewing (how many people are in the room with the device on, versus a single dedicated viewer). These are not attention measurements in the strict sense — none of them observes an eye or a face — but they correlate with attention closely enough that publishers use them as a lower-cost stand-in. TVision's own research finds CTV content carries roughly 74% higher co-viewing incidence than linear television, and frames that as evidence of a more social, engaged viewing occasion [6] — a finding worth reading with the caveat that TVision sells attention data and has an obvious interest in CTV testing well.\n\nThe table below sets these approaches side by side, because the differences in unit and evidentiary basis are the single most important fact a buyer needs before treating any vendor's attention number as comparable to any other's.\n\n| Vendor / method | What it observes | Unit | Basis | Cost to buyer |\n|---|---|---|---|---|\n| TVision | Eye gaze, in-room presence, second-by-second | Proprietary attention score / seconds of attentive exposure | ~5,000-home opt-in panel, Census-weighted, projected | Licensed data feed |\n| Adelaide (AU) | Contextual signals, modeled against outcomes | 0–100 score | Predictive model trained on hundreds of quality signals and outcome data, refreshed quarterly | Licensed score, embedded in DSP/SSP integrations |\n| Realeyes | Facial expression and inferred emotion | Attention + emotion index | Opt-in webcam panel, emotion-recognition model | Licensed via Nielsen Outcomes Marketplace and direct |\n| Lumen Research | Eye-tracking calibrated to device/context | Attention probability / seconds | Eye-tracking panel across 50+ countries, extrapolated model | Licensed via publisher/platform integrations (e.g., Teads) |\n| DoubleVerify (Authentic Attention) | Exposure and engagement signals, MRC-audited | Engagement Index, Exposure Index | Modeled from bid-stream and exposure data | Licensed via DV platform |\n| Platform proxies (completion rate, share of screen, co-viewing) | Playback and device-level signals | Percentages, counts | Census-level (every impression, not a panel) but not a direct attention observation | Free, native to SSP/publisher reporting |\n\n## The CTV-Specific Problem: Why Viewability Stopped Discriminating\n\nThe \"so what\": CTV buyers lost their main quality filter the moment CTV became the dominant screen, and attention vendors have built an entire industry on filling that gap — which is the whole reason this frontier exists.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: CTV already tops the attention leaderboard — which is why attention struggles to discriminate within it<\/div><svg viewBox=\"0 0 700 104\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">20<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">40<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">60<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">80<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">Connected TV<\/text><rect x=\"185\" y=\"8\" width=\"386.6\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"579.6\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">69.5<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">Online video<\/text><rect x=\"185\" y=\"42\" width=\"213.6\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"406.6\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">38.4<\/text><\/svg><figcaption> <span class=\"credit\">Source: Adelaide AU scores as published by the vendor and reported via MNTN Research — vendor-sourced, not independently accredited.<\/span><\/figcaption><\/figure>\n\n\n\nViewability — the Media Rating Council's (MRC, the U.S. ad-measurement industry's accreditation body) standard that an ad must have at least 50% of its pixels on screen for at least one continuous second (two seconds for video) to count as \"viewable\" — was built for a banner-ad and pre-roll internet where a large share of inventory failed the test: ads loaded off-screen, below the fold, or in background tabs. On CTV, that discriminating power collapses. A CTV ad plays full-screen, unskippable, on a device that is either on or off; there is no scroll, no background tab, no partially-rendered pixel. CTV viewability rates routinely clear 90% and often approach 100% [7][8]. That is precisely the problem: a metric that is true for nearly every impression cannot help a buyer tell a good placement from a bad one. A viewer who has walked out of the room, is asleep on the couch, or is scrolling a phone while the CTV app plays in the background still counts as a 100%-viewable impression under the existing standard, because viewability measures pixel rendering, not human presence.\n\nAttention measurement is being sold, explicitly, as the replacement discriminator CTV needs — the metric that tells a buyer which of two equally \"viewable\" placements actually had a person watching. That is the crux of the entire category's pitch to CTV buyers specifically, as distinct from its pitch to display or social advertisers, where viewability retained more discriminating power because a meaningful share of inventory still fails it. It is also, not coincidentally, the industry's most self-interested framing: attention vendors need CTV's viewability ceiling to be a real problem in order to have a product to sell into it, and every major attention vendor markets directly to this gap [9][10].\n\n## Where Attention Is Actually Applied on the Sell Side\n\nThe \"so what\": attention has moved from research deck to live product on several SSPs and publishers over the past eighteen months, but the applications are narrow, opt-in, and layered on top of — not replacing — conventional targeting and pricing.\n\n**Pre-bid attention segments.** The clearest form of attention becoming an actual buying mechanism, rather than a post-campaign report, is a pre-bid segment: a filter applied before the auction that excludes inventory predicted to fall below an attention threshold. OpenX and TVision launched what they billed as the first supply-side attention targeting solution built specifically for CTV in March 2026, combining TVision's panel-derived predictive attention models with OpenX's real-time bidstream signals — device type, time of day, viewing duration — to let buyers apply attention targeting to any CTV deal curated inside OpenX's OpenXSelect environment, available across OpenX's claimed 231 million-plus monthly unique CTV users [11][12]. Separately, Index Exchange embedded attention signals from xpln.ai, calibrated against large-scale eye-tracking data, directly into its SSP in February 2026, enabling buyers to prioritize or exclude inventory pre-bid based on predicted attention [13].\n\n**Attention-curated deals and marketplaces.** StreamVantage and Adelaide announced what they called the first high-attention CTV ad-targeting marketplace built specifically for FAST (free ad-supported streaming TV) and AVOD (ad-supported video on demand) in January 2025, packaging inventory pre-screened against Adelaide's AU score [14]. Magnite folded curation and activation into a single interface, ClearLine, built on its SpringServe infrastructure, in October 2025 — attention is one of several quality signals buyers can apply inside that curated environment, alongside brand safety and supply-path optimization filters, though Magnite's own public materials emphasize curation broadly rather than attention specifically [15].\n\n**Attention as a filter inside SSP curation more broadly.** The pattern across Magnite, PubMatic, and Index Exchange in 2025–26 is the same: curation — a paid layer where the SSP or a third-party \"curator\" pre-packages inventory against a buyer's quality criteria — has become the place attention signals get inserted, rather than attention becoming a standalone product line. PubMatic launched AgenticOS in January 2026, an operating environment for AI agents to handle yield optimization and deal troubleshooting, which is adjacent to but not the same thing as attention-based pricing [16].\n\n**Publisher pricing and packaging.** TripleLift became, by its own account, the first SSP to sell a CTV deal package with a guaranteed AU score, certified by Adelaide — a partnership that dates to September 2023 and, per TripleLift's own 2026 guidance on measuring CTV campaigns, remains part of its current CTV measurement offering [17][18]. Adelaide's research on that partnership claimed TripleLift's CTV inventory scored roughly 8% above Adelaide's category benchmark — a number that is Adelaide's own case study of its own client, and should be read as a vendor claim, not an independent finding [17]. Teads expanded its exclusive partnership with Lumen Research to bring eye-tracking-derived attention prediction to its CTV HomeScreen placement across the US, EMEA, APAC, and LATAM in May 2026, building on Lumen's separate work bringing attention measurement to Netflix's ad tier in five European markets [19][20]. Integral Ad Science (IAS) launched IAS Total TV in April 2026, folding show-level content data from Disney, NBCUniversal, Paramount, and Prime Video into a unified measurement view — a transparency play more than a strict attention product, though it sits in the same \"beyond viewability\" positioning as the attention vendors [21].\n\n**Attention-guaranteed deals** remain rare enough that TripleLift's arrangement with Adelaide is still cited industry-wide as the reference example three years after it launched — a sign that the guaranteed-outcome structure has not spread as fast as the pre-bid-segment and curation applications have.\n\n## Consolidation and Institutionalization\n\nThe \"so what\": attention measurement is professionalizing — fewer, larger vendors, a real accreditation process, and academic-scale validation studies — but institutionalization is still mid-build, not complete, and no CTV-specific attention metric has cleared the industry's own accreditation bar as of mid-2026.\n\nThe clearest consolidation signal is Viant Technology's agreement to acquire TVision for $40 million ($22.5 million cash, $17.5 million stock), announced in early 2026 and expected to close in the second quarter [22][23]. Viant, a demand-side ad-buying platform, framed the deal as completing a \"trifecta\" of identity, context, and verified attention inside its own programmatic stack — folding an independent, panel-based measurement vendor into a buying platform that will now have a direct commercial interest in the attention scores it reports, a conflict worth naming plainly: a DSP that owns its own attention vendor can no longer be treated as a neutral reporter of whether its own recommended inventory scored well. TVision's relationship with Adelaide, which predates the Viant deal by three years — TVision's linear and CTV panel data feeds directly into Adelaide's omnichannel AU score, and the two companies have jointly built attention-based private marketplaces with Microsoft Advertising and Teads since 2023 [24][25] — will need to be watched for whether it survives TVision's change of ownership on the same terms.\n\nOn standards, the IAB (Interactive Advertising Bureau) and MRC released draft Attention Measurement Guidelines for public comment in May 2025, the product of a 200-plus-member IAB Attention Task Force, and finalized Version 1.0 in November 2025 [26][27]. That document is explicitly designed to be \"the basis for MRC accreditation audits of attention measurement services\" going forward [27] — meaning the guidelines are the precondition for accreditation, not accreditation itself. As of mid-2026, the accreditation record shows meaningful but incomplete progress: DoubleVerify holds MRC accreditation for its Authentic Attention metrics (Engagement Index, Exposure Index) across desktop, mobile web, and mobile in-app environments, first granted in January 2023 and extended in April 2026 to cover additional impression categories [28][29] — but that accreditation is not CTV-specific; DoubleVerify's separate CTV accreditations, most recently expanded in 2026, cover viewability and brand-suitability segments, not attention [30]. No vendor has yet secured MRC accreditation for a CTV-specific attention metric under the new November 2025 guidelines, which is the honest state of play: the rulebook now exists, but the audits it was built to enable have not yet certified a single CTV attention product.\n\nThe Advertising Research Foundation (ARF) has run the most sustained independent academic-style validation effort, its multi-phase Attention Measurement Validation Initiative. Phase 1 found that definitions of attention are shaped by the capabilities of the specific tool measuring it — a methodologically important finding, since it means the category has not agreed on what it is even trying to measure. Phase 2 found limited consistency across measurement approaches in creative testing. Phase 3, released in June 2026, moved into live campaign conditions across television, online video, social, and display, and found attention measures aligned reasonably well at the broad channel level — where the underlying exposure conditions are structurally very different — but diverged more as the analysis moved to the platform and placement level, where the different vendors' definitions of what counts as \"attention\" pull apart [31][32]. That is a genuinely important finding for a chapter asking whether attention can reprice individual placements: the ARF's own multi-year research says vendor attention scores are least reliable exactly where the sell side wants to use them most — to distinguish one placement from another within a channel.\n\nIs attention becoming a trading currency, as opposed to a reporting overlay? The language of \"currency\" is now common in vendor and trade-press marketing for 2026, but a currency in the strict marketing-science sense — a mutually agreed, auditable unit both buyer and seller price a transaction against, the way Nielsen ratings or MRC-accredited viewability function — does not yet exist for attention. What exists instead is a set of parallel, non-interoperable scores (AU, TVision's proprietary attention index, DV's Engagement/Exposure Indices, Lumen's attention probability) each licensed separately and each usable only within the ecosystem that adopted it. That is a filter, or several competing filters, not a currency.\n\n## The Strongest Skeptical Case\n\nThe \"so what\": this is the section that should most change a buyer's confidence, because the doubts come not from competitors but from the peer-reviewed marketing-science tradition that has spent decades studying what actually predicts sales — and its findings cut against the entire premise that attention scores should command a price premium.\n\n**Karen Nelson-Field's own research is a more complicated ally for the attention industry than the industry's marketing suggests.** Nelson-Field, a former academic and founder of the attention-measurement firm Amplified Intelligence, is the closest thing the attention movement has to an academic figurehead, and her research is frequently the empirical backbone cited in vendor decks [33]. But her own findings are double-edged: her research on \"inequitable impressions\" — the finding that a large share of paid impressions across digital media, by her estimate around 75%, never deliver value close to what the buyer paid for — is as much an indictment of low-quality programmatic supply broadly as it is a case for attention specifically, and it does not, by itself, establish that a higher attention score reliably converts to more sales for a given brand [33]. It is also worth stating plainly that Nelson-Field runs a company that sells attention measurement, which does not make her research wrong, but does mean it should be read with the same skepticism the CRITICAL VOICE standard applies to any vendor-funded study — a point Nelson-Field's own sharpest critic has made explicitly.\n\n**Byron Sharp and the Ehrenberg-Bass Institute have produced the most direct academic rebuttal, and it is substantive, not just contrarian.** Sharp, director of the Ehrenberg-Bass Institute for Marketing Science at the University of South Australia — the research group behind the empirically grounded \"laws of marketing growth\" that much of the advertising-effectiveness field treats as its closest thing to settled science — has argued plainly that \"attention scores for advertisements do not appear to predict advertising effectiveness,\" and that for familiar brands, ads work through fleeting, low-attention, repeated exposure rather than deep sustained engagement — the mere-exposure effect, in which people come to prefer things they have merely seen repeatedly, works with attention levels far below what attention vendors treat as a quality threshold [34][35]. Sharp's institute has gone further, arguing that chasing high-attention placements actively trades off against Ehrenberg-Bass's first empirical rule of brand growth — maximizing reach — because attention-optimized targeting narrows a campaign toward already-engaged, often already-loyal audiences rather than building the broad category awareness that drives long-run growth [35][36]. Sharp names the conflict of interest explicitly: he warns that \"claims from those selling attention measurement or high-attention media... may contribute to its importance being exaggerated,\" and counsels treating vendor-funded attention research with the same caution this analysis applies throughout [34]. It is fair to note the debate runs in both directions — Nelson-Field and Lumen Research's Mike Follett have published rebuttals arguing reach and attention are complements, not substitutes, and that Sharp understates how creative and context interact with exposure [37] — but the core of Sharp's critique, that attention is necessary rather than sufficient for effectiveness and does not license a price premium on its own, has not been empirically overturned.\n\n**The validation problem is structural, not just a matter of which side is right.** Adelaide's own promotional research — a 2026 Outcomes Guide built from 60 vendor-selected case studies — claims attention-powered campaigns saw a 33% average lift in upper-funnel brand metrics and a 53% lift in lower-funnel metrics in 2025 [38][39]. Those are Tier-6 vendor claims: self-selected case studies published by the company that sells the product being validated, not an independent study with a comparison group. The IAB/MRC guidelines themselves concede the limits of what attention is validated to do, defining it as \"a complementary signal, not a replacement\" for click-through rate, viewability, or conversion metrics, and noting attention data improves prediction of brand recall and lift specifically — while performance campaigns should still rely on cost-per-acquisition and click-through data as the primary signal [27]. That is the industry's own standards body saying, in effect, that attention is validated against brand-lift proxies, not sales — precisely the gap this analysis was asked to weigh.\n\n**The units are not comparable, and no one has fixed that.** An Adelaide AU score, a TVision attentive-second, a Realeyes emotion index, and a Lumen attention probability are four different statistical constructs, built from four different data sources (a predictive model trained on contextual signals; a panel of cameras; a panel of webcams feeding an emotion-recognition model; a cross-country eye-tracking panel), reported on four different scales. A trade-press argument specifically against standardizing attention metrics — on the grounds that forcing a single definition, the way MRC did with viewability's \"50% of pixels for one second,\" would artificially compress a genuinely more complex phenomenon into a false binary — has real force, but it also means the industry has, for now, chosen incomparability over rigor: a buyer cannot look at two competing CTV deals, one priced against an AU score and one against a TVision attention index, and know which is actually the higher-quality placement without separately trusting each vendor's internal model [40].\n\n**Panel size and projection error are rarely disclosed alongside the headline number.** TVision's panel of roughly 5,000 homes, and comparably sized panels at Lumen and Realeyes, are being used to project attention behavior onto national CTV audiences of well over a hundred million households. Panel-based measurement is, by its own trade-press critics, \"extrapolated from small panels\" rather than a probabilistic signal applied at the scale of the actual audience being bought — a panel represents a model of attention behavior calibrated on a few thousand homes, not a direct read of the specific impression a buyer is purchasing [41]. None of the attention vendors surveyed here publish confidence intervals or margin-of-error figures alongside their headline scores in the marketing materials aimed at buyers, which means the number that shows up in a media plan typically carries an unstated but real amount of sampling noise.\n\n**The incentive problem runs through nearly every number in this analysis.** Adelaide, TVision, Realeyes, and Lumen are all companies whose core product is the attention score itself; the case studies, leaderboards, and lift figures cited above are, with only the ARF and IAB/MRC material as exceptions, produced or commissioned by the parties with the most to gain from a favorable result. This is not an accusation of fabrication — TVision's panel methodology and Adelaide's model architecture are disclosed in some detail — but it is the single most important interpretive caveat in this chapter: nearly every efficacy claim in the \"where attention is applied\" and \"consolidation\" sections above traces back, directly or through a client case study, to a company selling the thing being validated.\n\n**The most awkward finding for the whole category is the one the vendors themselves publish: CTV already wins the attention leaderboard.** Adelaide's own Attention Leaderboard shows CTV's average attention score climbing from 57.55 to 69.53 in a little over a year, outpacing online video and display by a wide margin [42][43], and TVision's research finds CTV content scores roughly 13% higher on its attention index than linear television, with far higher co-viewing incidence besides [6]. If CTV is already, on the vendors' own numbers, close to the top of every channel comparison, then attention's usefulness as a discriminator collapses exactly where the sell side most wants to use it: not in choosing CTV over social or display — where the case is real and vendors have a legitimate story — but in choosing one CTV placement over another, where the ARF's Phase 3 finding that vendor scores diverge most at the platform and placement level means the tool is weakest precisely at the resolution buyers need for pricing.\n\n## The Honest Verdict\n\nOn the evidence gathered here, attention is informing CTV planning far more than it is pricing CTV inventory in 2026. The planning-level case is genuinely strong and getting stronger: buyers increasingly use attention scores to choose which platforms, dayparts, and creative formats to favor, and to argue for or against specific publisher relationships in upfront and programmatic guaranteed negotiations. The pricing-level case is real but narrow: a handful of named, dated integrations — OpenX/TVision pre-bid segments, Index Exchange's xpln.ai integration, TripleLift's Adelaide-guaranteed deals, Teads/Lumen's CTV HomeScreen product — mean that some identifiable slice of CTV inventory does clear at attention-adjusted rates today. But there is no MRC-accredited CTV attention standard, no cross-vendor unit of comparison, and no peer-reviewed evidence that attention scores predict sales outcomes better than the reach-and-frequency fundamentals the Ehrenberg-Bass tradition has spent decades validating. The honest read is that attention in CTV in 2026 is a premium curation layer sold to buyers willing to pay for a story about quality, sitting on top of a bulk market that still transacts, and will keep transacting through the near term, on reach, frequency, and completion rate.\n\n## Drivers and Counter-Forces Feeding the 2029 Outlook\n\nThe mechanisms below are what will determine whether attention becomes an actual traded currency for CTV inventory by 2029, or settles into a permanent premium-overlay role. Each is stated with the evidence that it is currently operating and a rough read of its strength.\n\n**Driver: MRC accreditation reaching a CTV-specific attention standard.** The IAB/MRC Attention Measurement Guidelines, finalized in November 2025, exist specifically to enable future accreditation audits [27]. If a vendor clears a CTV-specific attention accreditation in the next two to three years — something that has not yet happened as of mid-2026 despite DoubleVerify's broader Authentic Attention accreditation — it would be the single strongest catalyst toward currency status, because it would give buyers and sellers a mutually trusted, audited number for the first time. Evidence this is operating: the guidelines exist and MRC has an active accreditation pipeline for other CTV metrics. Strength: moderate — the guidelines are a precondition, not a guarantee, and the gap between \"guidelines finalized\" (Nov 2025) and \"first accredited CTV attention product\" (not yet, as of Jul 2026) shows the process moving slower than the marketing language around attention suggests.\n\n**Driver: DSP/SSP consolidation folding attention vendors directly into the transaction stack.** Viant's acquisition of TVision is the clearest example: once an attention vendor is owned by a buying or selling platform rather than operating as a neutral third party, its scores can be embedded directly into bidding logic rather than reported after the fact [22][23]. Evidence: one completed acquisition (pending close), plus deep SSP-side integrations at OpenX, Index Exchange, and Magnite. Strength: moderate-to-strong — this is the most concrete structural change in the sector, but it also undercuts neutrality, which could slow trust-building with buyers who want an independent number rather than a platform-owned one.\n\n**Counter-force: the incomparability of vendor units.** As long as an AU score, a TVision index, and a Realeyes measure cannot be reconciled to a common unit, no single number can function as a currency the way a Nielsen rating or an MRC-accredited viewable impression does. Evidence: active trade-press argument against standardization on the grounds that it would flatten real methodological differences [40]. Strength: strong and likely durable — there is no current initiative to force interoperability, and the vendors have commercial reasons to prefer differentiated, non-comparable products.\n\n**Counter-force: the Ehrenberg-Bass critique gaining rather than losing ground.** If subsequent ARF phases, or independent academic work, continue to show attention scores diverging at the placement level and failing to out-predict reach-and-frequency models on actual sales outcomes, the empirical foundation for a price premium weakens rather than strengthens. Evidence: ARF Phase 3 (June 2026) already found divergence increasing at finer granularity, and Sharp's critique has not been rebutted with sales-outcome data, only brand-lift data [31][34]. Strength: moderate — this is a slow-moving academic debate, not a single event, but it has directional momentum against the vendors' preferred framing.\n\n**Driver: CTV ad-spend growth increasing the absolute dollars at stake in any quality discriminator.** U.S. CTV ad spending is projected near $38 billion in 2026 [21], and continued double-digit growth (CTV spend growth was pegged near 14% for 2026 in supply-side marketing materials [12]) means even a small percentage of spend moving to attention-priced deals represents real and growing dollars, which funds continued vendor investment and sell-side integration regardless of the academic debate's resolution. Evidence: consistent spend-growth figures across multiple 2025-26 sources. Strength: strong as a scale driver, though it says nothing about whether the *rate* of attention-priced transactions grows proportionally.\n\n**Counter-force: the incentive problem never fully resolving.** Because the four leading attention vendors' core business is licensing attention scores, and the most-cited efficacy studies to date are vendor-commissioned, buyer trust may plateau below what would be needed for attention to become a true shared currency — currencies require a level of institutional neutrality that a for-profit scoring vendor structurally cannot fully provide on its own. Evidence: every major lift and leaderboard statistic surveyed in this analysis originates from a company selling attention data; only ARF and IAB/MRC sit outside that incentive structure, and their multi-year work has moved more slowly and reached more qualified conclusions than the vendor material. Strength: moderate — independent bodies exist and are active, but their pace has lagged commercial deployment by roughly two to three years so far.\n\n## Open Questions\n\n- Will any vendor clear MRC accreditation for a CTV-specific attention metric, and if so, does that measurably shift dollar volume toward attention-priced deals, or does accreditation mostly function as a marketing credential?\n- Does Viant's ownership of TVision change TVision's data or methodology in ways that affect its usability as a neutral third-party signal for buyers who are not Viant clients?\n- Will the ARF's Attention Measurement Validation Initiative produce a phase that directly tests attention scores against sales data (not brand lift), and if so, which direction does the evidence move?\n- Is there a credible, non-vendor-funded study comparing attention-priced CTV deals against equivalent non-attention-priced deals on actual campaign ROI, holding creative and audience constant?\n- Do any of the major CTV platform owners (the walled gardens covered elsewhere in this analysis) plan to build or license their own attention products, and would that resolve or worsen the incomparability problem?\n\n## Sources\n\n1. TVision, \"TVision Methodology Overview,\" tvisioninsights.com, accessed July 2026, https://www.tvisioninsights.com/resources/tvision-methodology-overview — Tier 6 (vendor); panel size, opt-in structure, Census weighting.\n2. TVision, \"Passive TV Measurement | TVision Panel,\" tvisioninsights.com, accessed July 2026, https://www.tvisioninsights.com/our-panel — Tier 6 (vendor); computer-vision gaze/presence detection method.\n3. VideoWeek, \"Different Attention Measurement Tools Produce Significantly Different Results, finds ARF Study,\" May 28, 2024, https://videoweek.com/2024/05/28/different-attention-measurement-tools-produce-significantly-different-results-finds-arf-study/ — Tier 5; independent framing of panel-based measurement variance.\n4. eMarketer, \"Attention Metric (AU),\" industry KPI reference, accessed July 2026, https://www.emarketer.com/industry-kpis/attention-metric-au — Tier 4; neutral description of Adelaide's AU methodology and inputs.\n5. Realeyes, company technology pages, accessed July 2026, https://www.realeyesit.com/technology/facial-coding/ — Tier 6 (vendor); training-set size and facial-coding method claims.\n6. TVision, \"How Co-Viewing Demographics Impact CTV Attention,\" tvisioninsights.com, accessed July 2026, https://www.tvisioninsights.com/resources/ctv-co-viewing-demographics — Tier 6 (vendor); co-viewing incidence and attention-index comparison, CTV vs. linear.\n7. StackAdapt, \"Why Are Viewability Rates on Connected TV So High?,\" accessed July 2026, https://www.stackadapt.com/resources/blog/connected-tv-viewability — Tier 5; explains structural reasons CTV viewability approaches 100%.\n8. Adgully, \"Rethinking measurement: from viewability to true attention in CTV,\" accessed July 2026, https://www.adgully.com/post/8669/rethinking-measurement-from-viewability-to-true-attention-in-ctv — Tier 5; states the viewability-ceiling problem directly.\n9. Adelaide, \"CTV & Attention Metrics: The Essential FAQ Guide for Advertisers,\" adelaidemetrics.com, accessed July 2026, https://www.adelaidemetrics.com/attention-resources/ctv-the-definitive-guide-for-advertisers — Tier 6 (vendor); vendor framing of attention as the CTV quality discriminator.\n10. AudienceX, \"Turning Attention Metrics Into Performance KPIs for CTV,\" insights.audiencex.com, accessed July 2026, https://insights.audiencex.com/turning-attention-metrics-into-performance-kpis-in-ctv-and-display/ — Tier 5; describes CTV viewability-vs-attention gap and cites attention as more predictive.\n11. OpenX, \"OpenX and TVision Launch First Supply-Side Attention Targeting Solution for CTV,\" press release, March 11, 2026, https://www.openx.com/press-releases/openx-and-tvision-launch-first-supply-side-attention-targeting-solution-for-ctv-enabling-real-time-activation-on-high-engagement-inventory/ — Tier 6 (press release); primary announcement, product mechanics, reach claim.\n12. Digiday, \"Future of TV Briefing: OpenX adds attention targeting for CTV ads backed by TVision,\" accessed July 2026, https://digiday.com/future-of-tv/future-of-tv-briefing-openx-adds-attention-targeting-for-ctv-ads-backed-by-tvision/ — Tier 5; independent trade-press coverage and 2026 CTV spend-growth figure.\n13. ppc.land, \"Index Exchange embeds AI attention signals into SSP for pre-bid targeting,\" accessed July 2026, https://ppc.land/index-exchange-embeds-ai-attention-signals-into-ssp-for-pre-bid-targeting/ — Tier 5; Index Exchange/xpln.ai integration, February 2026 date, pre-bid mechanics.\n14. Financial Content / newsdirect, \"StreamVantage and Adelaide Announce First-Ever High-Attention CTV Ad Targeting Marketplace... for F RC Release Attention Measurement Guidelines for Public Comment,\" May 2025, https://www.iab.com/news/attention-measurement-guidelines-public-comment/ — Tier 1; official announcement, Task Force size, public-comment timeline.\n27. IAB, \"IAB and MRC Attention Measurement Guidelines FINAL Version 1.0,\" November 2025, https://www.iab.com/wp-content/uploads/2025/11/IAB_MRC_Attention_Measurement_Guidelines_November_2025.pdf — Tier 1; final guidelines document, basis for future MRC accreditation audits, \"complementary signal\" framing.\n28. DoubleVerify, \"DoubleVerify Continues Leadership in Attention Metrics, Earning MRC Accreditation for Attention Measurement Solution,\" doubleverify.com, January 2023 (extension referenced April 2026), https://doubleverify.com/company/newsroom/doubleverify-continues-leadership-in-attention-metrics-earning-mrc-accreditation-for-attention-measurement-solution — Tier 1 (company/MRC accreditation record); original accreditation scope and date, MRC CEO quote.\n29. TV News Check, \"DoubleVerify Earns MRC Accreditation for Attention Measurement Solution,\" accessed July 2026, https://tvnewscheck.com/business/article/doubleverify-earns-mrc-accreditation-for-attention-measurement-solution/ — Tier 5; independent coverage of the 2026 extension to authentic non-viewable and modeled video impressions.\n30. Nasdaq / DoubleVerify, \"DV Earns MRC Accreditation for CTV Viewability, Reinforcing its Leadership in Pre- and Post-Bid CTV Measurement,\" accessed July 2026, https://www.nasdaq.com/press-release/dv-earns-mrc-accreditation-for-ctv-viewability-reinforcing-its-leadership-in-pre-and — Tier 1/5; confirms DV's CTV-specific MRC accreditations are viewability/brand-suitability, not attention.\n31. The ARF, \"ARF Releases Large-Scale Study of Attention Metrics in Live Campaigns\" (Phase 3), June 2026, https://thearf.org/wp-content/uploads/2026/06/Attention-Phase-3-Press-Release-June-2026_FINAL_CLEAN.pdf — Tier 2 (independent research body); Phase 3 methodology and channel-vs-placement divergence finding.\n32. MediaVillage, \"ARF Attention Phase 2 Report Overturns Widely Held Assumptions,\" accessed July 2026, https://www.mediavillage.com/article/arf-Attention-Phase-2-Report-Overturns-Widely-Held-Assumptions/ — Tier 5; independent summary of ARF Phase 2 (creative-testing consistency) findings.\n33. Mi3, \"'Reach curves have gone rogue': Karen Nelson-Field warns 'scrollable media' attention decay cuts audience reach volumes by up to 70%,\" accessed July 2026, https://www.mi-3.com.au/05-04-2023/reach-curves-have-gone-rogue-karen-nelson-field-warns-scrollable-media-attention-decay — Tier 5; Nelson-Field background, Amplified Intelligence, \"inequitable impressions\" (~75%) research claim.\n34. Forbes, Charles R. Taylor, \"Do Attention Levels Drive Ad Effectiveness? Byron Sharp Says No — And He Has A Point,\" September 3, 2024, https://www.forbes.com/sites/charlesrtaylor/2024/09/03/do-attention-levels-drive-advertising-effectiveness-byron-sharp-says-no--and-he-has-a-point/ — Tier 4; Sharp's core argument, mere-exposure-effect framing, explicit conflict-of-interest warning about attention vendors.\n35. Ehrenberg-Bass Institute for Marketing Science, \"Do Attention Levels Drive Ad Effectiveness? Byron Sharp Says No,\" marketingscience.info, accessed July 2026, https://marketingscience.info/do-attention-levels-drive-ad-effectiveness-byron-sharp-says-no/ — Tier 2 (academic institute); institute's own restatement of the critique.\n36. Ehrenberg-Bass Institute for Marketing Science, \"Byron Sharp is right: chasing fleeting attention is a waste of money,\" marketingscience.info, accessed July 2026, https://marketingscience.info/byron-sharp-is-right-chasing-fleeting-attention-is-a-waste-of-money/ — Tier 2 (academic institute); reach-vs-attention tradeoff argument.\n37. WARC, \"Why attention and reach need each other: Karen Nelson-Field and Mike Follett respond to Byron Sharp,\" accessed July 2026, https://www.warc.com/newsandopinion/opinion/why-attention-and-reach-need-each-other-karen-nelson-field-and-mike-follett-respond-to-byron-sharp/en-gb/5870 — Tier 5; the pro-attention rebuttal to Sharp, for balance.\n38. ExchangeWire, \"Adelaide's 2026 Outcomes Guide Reveals How Attention Drives Results,\" January 20, 2026, https://www.exchangewire.com/blog/2026/01/20/adelaides-2026-outcomes-guide-reveals-how-attention-drives-results/ — Tier 5; independent coverage of vendor case-study collection.\n39. Adelaide, \"2026 Outcomes Guide: How Attention Metrics Drive Results,\" adelaidemetrics.com, accessed July 2026, https://www.adelaidemetrics.com/blog/adelaide-releases-2026-outcomes-guide — Tier 6 (vendor); 33%/53% lift claims, 60-case-study basis, self-selected.\n40. AdExchanger, Jana Jakovljevic, \"Why Standardization Is Wrong For Attention Metrics,\" accessed July 2026, https://www.adexchanger.com/data-driven-thinking/why-standardization-is-wrong-for-attention-metrics/ — Tier 5; argument against forcing a common attention unit, incomparability discussion.\n41. VideoWeek, \"How is the Industry Measuring Attention?,\" March 7, 2022, https://videoweek.com/2022/03/07/how-is-the-industry-measuring-attention/ — Tier 5; panel-size and extrapolation critique.\n42. MNTN Research, \"CTV's Ad Attention Scores Hit 69.5, Outpacing Online Video and Display,\" research.mountain.com, accessed July 2026, https://research.mountain.com/trends/ctvs-ad-attention-scores-hit-69-5-outpacing-online-video-and-display/ — Tier 6 (vendor-adjacent); CTV attention-score trend (57.55 to 69.53), cross-channel comparison, note MNTN is a CTV ad platform with an interest in favorable CTV attention comparisons.\n43. MarTech Cube, \"Adelaide releases Attention Leaderboard Feat. Top CTV Platforms,\" accessed July 2026, https://www.martechcube.com/adelaide-releases-attention-leaderboard-feat-top-ctv-platforms/ — Tier 5; CTV platform-level leaderboard (Peacock, Hulu, Max, Paramount, Discovery+)."}, {"order": 5, "file": "05_Performance_And_Outcomes.md", "title": "Selling an Outcome, Not an Impression", "summary": "", "body": "# Selling an Outcome, Not an Impression\n\n## Bottom Line\n\nTelevision's sell side is being asked to stop selling attention and start selling results — a site visit, an app install, a store trip, a sale — and to guarantee the price of getting there. That conversion is real and accelerating: every major streaming seller now offers self-serve or outcome-linked buying, retailers have put their purchase data directly into the CTV bidstream, and a public company (MNTN) has built a nine-figure-revenue business on the premise that TV can be bought like search.\n\nBut the guarantee at the center of this shift is underwritten by attribution methods — last-touch credit dressed up as causal proof — that most of the industry privately concedes are weak. Every dollar a seller stakes on an outcome it does not fully control is a dollar of risk moved onto a media balance sheet that was never built to carry it, and no seller in this record discloses what happens when the guarantee misses. The marketing-science objection is not decoration: Ehrenberg-Bass and Binet & Field's evidence that short-term optimization erodes the very brand equity that makes future conversions cheap is direct testimony against the frontier this chapter describes. The sell side that wins here will be the one that prices outcome risk honestly rather than the one that grows fastest by underpricing it.\n\n## What \"Performance CTV\" Actually Means\n\nThe old television transaction bought reach against a demographic: a 30-second spot priced on how many adults 25-54 would likely see it, with no promise about what any of them would do afterward. Performance CTV — sometimes called \"outcomes-based\" or \"performance TV\" — buys against a business result instead: a completed purchase, a lead form, a store visit, an app open. tvScientific, the performance-CTV platform now owned by Pinterest, frames the pitch bluntly: advertisers set a cost-per-outcome (CPO) they are willing to pay, and the platform is supposed to deliver against it, so the buyer pays for results rather than exposure [1].\n\nThat promise only works if three separate technical and commercial problems get solved simultaneously. Each is harder than it sounds, and each is where the sell side's actual product investment has gone.\n\n### The linking problem: identity resolution\n\nA television is, by design, a shared household device with no login and no cursor. Linking a household that saw an ad on that screen to an action that happened somewhere else — a phone, a browser, a retailer's point-of-sale system — requires identity resolution. This runs on automatic content recognition (ACR, the technology built into most smart TVs that fingerprints what is on screen frame by frame) combined with device graphs that stitch a television to the other devices in the same home.\n\nThat stitching happens two ways. Deterministic matching, through shared logins or account credentials, runs roughly 0.95-plus confidence by the industry's own measure. Probabilistic matching, through signals like a shared home IP address, timing co-occurrence, or postal-code proximity, typically runs 0.4 to 0.7 confidence depending on the method [2]. The gap between those two numbers is the gap between a claim a seller can stand behind and a claim it cannot, and it is why 2026 best-practice guidance in this space now calls for disclosed probabilistic tiers rather than a single blended confidence score presented as fact [2].\n\n### The causation problem: incrementality\n\nEven a perfectly resolved household-to-purchase link only proves correlation. Incrementality — establishing that the action would not have happened anyway — is the harder and more expensive problem, because a shopper who was already going to buy a product and then happened to see an unrelated ad for it is not a marketing success story; she is noise the measurement system has to be built to exclude.\n\nDoing that rigorously requires a controlled experiment: a matched group that did not see the ad, compared against one that did. Doing it cheaply, which is what most vendor-published \"lift\" studies actually do, means a pre/post comparison of exposed versus unexposed households with no true control — a method vulnerable to exactly the selection bias this chapter's counter-case section returns to.\n\n### The pricing problem: who eats the seller's uncertainty\n\nThe third requirement is the one the industry discusses least: a way for the seller to price its own uncertainty. A standard cost-per-thousand-impressions (CPM) deal makes the seller's only variable whether the ad rendered and was viewable — a risk the seller can control and therefore price confidently.\n\nA cost-per-acquisition (CPA) or return-on-ad-spend (ROAS) deal makes the seller's revenue contingent on the advertiser's landing page, offer, creative, and funnel — none of which the seller controls, and all of which the seller is now financially exposed to. That third piece is the crux of the economics section later in this chapter, and it is the piece most vendors are least willing to quantify in public.\n\n## Who Is Actually Buying This Way\n\nThe honest starting point is that CTV's history is a brand-budget history: national advertisers moving linear dollars to streaming to preserve reach, not performance marketers discovering television. That mix is shifting, but unevenly, and the size of the shift is harder to pin down than the trade press headlines suggest.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the pot grows ~$13B by 2029 — so sellers can lose share every year and still book growth<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"288.0\" x2=\"686\" y2=\"288.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"292.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"220.0\" x2=\"686\" y2=\"220.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"224.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">15<\/text><line x1=\"60\" y1=\"152.0\" x2=\"686\" y2=\"152.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"156.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">30<\/text><line x1=\"60\" y1=\"84.0\" x2=\"686\" y2=\"84.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"88.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">45<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">60<\/text><rect x=\"136.3\" y=\"116.0\" width=\"56.0\" height=\"172.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"164.3\" y=\"110.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">37.95$B<\/text><text x=\"164.3\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2026<\/text><rect x=\"345.0\" y=\"75.4\" width=\"56.0\" height=\"212.6\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"373.0\" y=\"69.4\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">46.89$B<\/text><text x=\"373.0\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2028<\/text><rect x=\"553.7\" y=\"56.8\" width=\"56.0\" height=\"231.2\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"581.7\" y=\"50.8\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">51$B<\/text><text x=\"581.7\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2029<\/text><\/svg><figcaption> <span class=\"credit\">Source: Emarketer US CTV ad spend forecasts; 2028 is the year CTV is projected to pass traditional TV.<\/span><\/figcaption><\/figure>\n\n\n\n### The market-level numbers\n\nUS CTV ad spend is on pace for roughly $37.95 billion in 2026, up around 14 to 15% year over year [3]. The IAB's 2026 Digital Video Ad Spend & Strategy report — released July 14, 2026, and based on a February-March 2026 survey of 360 media executives fielded by Advertiser Perceptions — puts CTV growth specifically at 11% for the year, within a total digital video market exceeding $80 billion and growing 20% faster than the ad market overall [4].\n\nNew customer acquisition remains the single most-cited buyer objective in that survey: 54% of ad buyers named it their top priority, even after a 10-point decline from 2025, and cross-platform measurement climbed from 64% of buyers naming it a priority in 2025 to 72% in 2026 — a reasonable proxy for how much more weight the industry now places on proving outcomes rather than merely claiming reach [4].\n\nTargeting capability, not content quality, is now the top investment criterion cited by CTV buyers for the first time on record: 49% named it, up 10 percentage points year over year, in eMarketer's 2026 buyer-priority tracking — a direct sign that \"can this reach the household likely to convert\" is displacing \"is this a good environment to be seen in\" as the sell side's core pitch [34].\n\n### The self-serve build-out\n\nThe clearest hard evidence of a down-market shift is structural rather than survey-based: self-serve platforms with minimum spends low enough for a local business now exist across every major streaming seller. Roku Ads Manager's disclosed floor is $500 in total campaign spend, or roughly $50 a day [5].\n\nAmazon removed its self-serve minimum for Streaming TV entirely as of its unBoxed 2025 event. The $50,000-a-month figure that circulated for years described Amazon's white-glove managed service, which still carries that floor, but the self-serve Streaming TV product spanning Prime Video, Fire TV, Twitch and open-internet CTV inventory now has none, though practitioners cite $8,000 to $12,000 a month as the practical floor for adequate frequency [6].\n\nSmall-business CTV adoption, per aggregated 2026 trade data, rose from 60% to 85% of surveyed small businesses using or planning to use the channel — a figure worth reading as directional rather than precise, since it comes from vendor-adjacent research rather than a government or exchange-audited source [7].\n\n### The clearest capital-markets signal\n\nIn June 2026, Walmart agreed to pay $1.4 billion for Vibe.co, a self-serve CTV platform built explicitly to bring small and mid-sized businesses onto streaming television, folding it into Walmart Connect alongside the Vizio smart-TV operating system Walmart had bought in December 2024 for $2.2 billion [8][9]. A retailer committing $3.6 billion combined to own two separate on-ramps for small-advertiser CTV spend is a stronger signal about where the growth is believed to be than any single survey statistic — Walmart is not spending that money on a hunch.\n\n### The public-company proof point, with its caveat attached\n\nThe clearest public proof that a performance-first business model can work at scale on CTV is MNTN, a publicly traded company whose entire product is self-serve, ROAS-optimized television advertising. Its 2025 Form 10-K reported $290 million in revenue, 29% growth, positive operating income of roughly $24 million, and a 23% adjusted-EBITDA margin, with revenue tied directly to client ad spend and pronounced seasonality — fourth-quarter revenue was 30% of the year's total [10]. That MNTN is profitable and growing on a pure-performance model is real evidence the segment has scaled past a niche.\n\nIt is also, on its own, a selection-biased data point. MNTN's own risk factors flag that its growth \"will be impacted by the overall growth of the CTV ad market and reliance on marketers using CTV as a performance marketing channel\" [10]. A company built entirely on this thesis is not a neutral witness to whether the thesis is sound market-wide — its 10-K is evidence the model can work for a specialist that designed its entire stack around it, not proof that legacy premium sellers can retrofit the same economics.\n\n## What the Sell Side Has Built\n\nThe sell side's response to performance demand has four parts: new deal structures that shift risk between buyer and seller, retail and commerce data brought directly into the curation layer, interactive and shoppable formats, and self-serve front doors that make the whole transaction feel like a search or social buy.\n\n### Deal types, and where the risk actually sits\n\nThe table below lays out where risk sits in each structure, because that allocation — not the marketing language around \"guarantees\" — is the substantive difference between them.\n\n| Deal type | What's guaranteed | Who bears the shortfall if the outcome misses |\n|---|---|---|\n| Standard CPM (impression-priced) | Impressions delivered, viewability | Advertiser bears all performance risk; seller is paid regardless of outcome |\n| Programmatic guaranteed (fixed price, guaranteed volume, no auction) | Volume and price, not outcome | Advertiser; seller's only obligation is delivery |\n| CPA / cost-per-outcome (tvScientific's Guaranteed Outcomes model) | A defined result — sale, lead, install — at a set price per outcome | The platform: it absorbs the cost of every serve that does not convert and recovers spend only on completed events [1][11] |\n| ROAS-target campaigns (MNTN-style) | An optimization target, not a hard guarantee | Shared — the platform optimizes toward the target but the advertiser still bears variance; missing the target is typically a service failure, not a financial one, absent an explicit guarantee clause [10] |\n| Performance-linked hybrid (spend commitment, CPM adjusted to CPA/ROAS thresholds) | Spend level; price floats with performance | Publisher shares downside by discounting price when thresholds are missed — an emerging structure, not yet standard or publicly priced [12] |\n\nPublishers have historically resisted pure CPA deals for exactly the reason this table implies. In a CPA arrangement, \"the platform absorbs the cost of any ad serve that does not produce that outcome and recovers the spend only on completed events,\" which means the seller — not the buyer — holds the downside on every impression that does not convert [11]. That is a fundamentally different business than selling airtime, and it is the seller's balance sheet, not the buyer's, that has to absorb the variance until scale and historical data make the seller's aggregate prediction reliable enough to price confidently.\n\n### The guaranteed-outcome products specifically\n\ntvScientific launched \"Guaranteed Outcomes\" in June 2025 after a beta with LG, Staples, ezCater, Crocs and Weight Watchers, letting qualified advertisers name a cost-per-outcome and pay only when it is hit; the company claims its AI-optimized campaigns deliver 30% better CPOs than advertiser targets on average — a company-reported figure that should be read as a vendor claim, not an independent audit [1].\n\nRoku became, by its own account, the first major streaming platform to let advertisers optimize live campaigns against a third-party outcomes measurement feed rather than delivery metrics, integrating iSpot's \"Outcomes at Scale\" product on January 6, 2026. An early test with SimpliSafe reported a 23% lift in leads and a 31% lift in website visits for an optimized group versus a control [13].\n\nNBCUniversal rolled out \"LIVE Total Impact\" ahead of CES 2026, with early adopter State Farm reporting a 90% incremental lift in insurance quote starts — again, a single advertiser's self-reported result released through the seller's own announcement, not an independently audited figure [14]. Magnite folded its curation and activation tools into a unified ClearLine platform in October 2025, and in a 2024 statewide political-race case study reported 4% incremental reach beyond other digital and TV components and 8% beyond DSPs alone over a two-week window — a modest, narrowly scoped number relative to the marketing language typically attached to \"outcomes\" products [15].\n\nNexxen announced a full-funnel AI performance suite in March 2026 combining in-flight optimization, what it calls \"ghost bidding\" incrementality testing, and its nexAI algorithms, designed specifically to connect CTV exposure to downstream conversions. Its Q1 2026 results reported $81.9 million in programmatic revenue and $29.4 million in CTV revenue, and an agency partner, H/L, is cited by Nexxen as having driven \"up to a 14x lift in conversion outcomes\" for clients across verticals — a figure that, like the others in this section, is a partner-cited case-study number rather than an audited industry benchmark [16].\n\nYahoo DSP launched agentic AI capabilities in January 2026 aimed at autonomously executing corrective actions across planning, activation, optimization and measurement workflows, and separately licensed Nexxen's ACR-derived audience segments for targeting in the US, UK and Germany in the fourth quarter of 2025 — evidence that even buy-side platforms are now building performance-optimization features on top of sell-side data feeds rather than waiting for publishers to supply them [16].\n\nOpenX and TVision launched what the companies describe as the first supply-side attention-targeting product built for CTV in March 2026, moving attention scoring — a prediction of how likely a viewer is to be actively watching rather than merely present in the room — from a post-campaign report into a pre-bid input inside OpenXSelect, so buyers can choose which impressions to purchase before the auction clears, across a claimed 231 million-plus monthly unique users [35].\n\nEquativ, in May 2026, expanded its Titan OS partnership to launch what it calls the first programmatic CTV home-screen video advertising product across Europe and Latin America, and eMarketer's 2026 tracking shows interactive-format engagement rates nearly doubling year over year to 1.94% in 2025 — small in absolute terms, but a real, dated data point on whether shoppable and interactive units actually move viewers to act rather than merely existing as a sell-side talking point [35].\n\n### Commerce and retail-media data on the sell side\n\nThe most consequential structural change in this space is that retailers' purchase data now sits inside the CTV curation layer rather than behind a wall the seller has to license across after the fact. Amazon's Marketing Cloud (AMC) — its clean room, meaning a secure environment where two parties can jointly analyze combined data sets without either seeing the other's raw records, producing only aggregated insights — opened access to all advertisers running Amazon sponsored-ads campaigns during 2025, replacing what had been a registration-gated tool.\n\nOn November 11, 2025, AMC launched Prime Video viewership signals in open beta across the US, Canada, Japan and Australia, letting any advertiser combine Prime Video content-engagement data with their own AMC datasets; the UK, Germany, Spain, Italy and France followed in the first quarter of 2026 [17].\n\nWalmart's Vibe.co deal is built on the same logic from the other direction: a shopper sees an ad on a Vizio television, targeted using Walmart's first-party purchase data through Vibe.co's self-serve technology, and the resulting purchase — in-store or online — closes the loop back to Walmart Connect [8].\n\nPubMatic's December 4, 2025 partnership with BrightLine brings interactive CTV formats — shoppable carousels, quizzes, branded overlays — onto its programmatic marketplace across LG Ad Solutions, Samsung TV Plus and Vizio inventory, with PubMatic's existing commerce-media integrations, Rippl and Instacart, extending those campaigns to SKU-level purchase reporting [18]. PubMatic cites survey figures showing 41% of US marketers incorporating interactive and shoppable formats into CTV strategy as of late 2025, with 52% expecting such formats in at least a quarter of their ad units — again, figures released by a party with a direct commercial stake in the answer, worth treating as directional rather than audited [18].\n\n### Clean rooms more broadly\n\nLiveRamp, which absorbed the independent clean-room vendor Habu in a January 2024 acquisition, offers templated measurement use cases — audience overlap, optimal frequency, incrementality, attribution — across streaming and TV publisher data sets, and in 2025 extended clean-room-based measurement into a Microsoft Advertising integration for omnichannel comparison [19].\n\nThe trade-press read on the Habu deal is candid about what consolidation does to the independent middle of the measurement market: fewer neutral, vendor-agnostic clean rooms mean more advertisers doing their data collaboration inside a platform that also sells them media — a conflict worth naming rather than glossing over [19]. Roughly a third of companies report extensive current clean-room use, with about 90% expecting usage to grow over the next year, per aggregated 2026 industry surveys — directional, not audited, numbers [19].\n\n### Interactive and shoppable formats, and the self-serve front doors\n\nBeyond the PubMatic/BrightLine build, the sell side's self-serve layer has widened materially through 2025-2026: Roku's Ads Manager and open Ads API, Amazon's no-minimum Streaming TV self-serve product, and Walmart's incoming Vibe.co integration all exist specifically to let an advertiser with a five-figure — not seven-figure — budget transact programmatically against premium CTV inventory without an agency or an insertion order [5][6][8]. That is a genuine product build-out, not vaporware: each of these tools has a dated 2025-2026 launch or expansion behind it, which is the going-concern discipline this chapter holds itself to throughout.\n\n## The Measurement Layer Underneath It\n\nEvery outcome guarantee, every clean-room insight, and every \"incremental lift\" figure cited above ultimately rests on a measurement methodology, and this is where the frontier's evidentiary base gets noticeably thinner.\n\n### Incrementality testing and geo-experiments\n\nIncrementality testing — running a controlled experiment where one group sees the ad and a matched control group does not, then comparing downstream results — is the closest thing this space has to a gold standard for proving causation rather than correlation. It is typically executed as household-level holdouts or geo-lift tests, meaning the test splits by ZIP code or media market rather than by individual household.\n\nAdoption is real: 52% of US brand and agency marketers report already using incrementality testing, with 36% planning to invest more over the coming year, according to 2025-2026 industry survey data [20]. Vendors including Jamloop have built self-serve incrementality tooling specifically for CTV, expanding household-level holdout and geo-based testing capabilities through 2026, with self-serve experiment configuration on Jamloop's near-term roadmap [20].\n\nThe honest caveat is stated by trade coverage rather than by any vendor selling the tests. A MarTech industry piece on the subject is candid enough in its own framing that most CTV incrementality tests fail in practice, citing underpowered sample sizes, contaminated control groups, and short test windows that miss delayed conversion effects as recurring, acknowledged failure modes rather than hypothetical ones. Households in the \"unexposed\" control group frequently see the same brand's ads through other channels anyway, which quietly erodes the test's validity without showing up anywhere in the reported result [20].\n\n### Attribution's structural weaknesses\n\nMulti-touch attribution (MTA) — crediting multiple touchpoints along a customer's path to purchase, rather than only the final click — was built on the premise of stitching individual-level journeys across devices using persistent identifiers. That premise is increasingly called \"almost completely false\" by industry commentary in 2025-2026, now that third-party cookies are largely gone from the open web and mobile identifiers are increasingly restricted [21].\n\nLast-touch attribution — crediting only the final interaction before conversion — is the older, cruder alternative, and it carries an asymmetric bias worth stating plainly. It systematically under-credits upper-funnel exposures like a television ad seen days before a purchase, because a later, closer touchpoint — a branded search click, a retargeting ad — captures the conversion event even when the earlier TV exposure is what actually created the intent [21].\n\nTrade analysis citing modeled results claims that under proper multi-touch attribution, CTV impressions constituting 38% of total exposures were credited with driving 63% of conversions — a number that, if directionally accurate, argues television is dramatically undervalued by naive last-click accounting. But it is a single vendor-adjacent modeled estimate, not an audited industry-wide finding, and attribution outputs of this kind are highly sensitive to the attribution window and channel taxonomy chosen by whoever built the model [21].\n\nThe honest synthesis is stated by EDO's Kevin Krim in AdExchanger's coverage of outcomes measurement: outcomes-based measurement occupies \"actions that follow impressions and precede sales\" as an intermediate layer precisely because sales-based attribution is hard to scale. Sales data sits locked inside retail media networks' own walled gardens, and third-party data aggregators only see a partial view into it, which is a structural limit on how good any cross-platform attribution can get regardless of the methodology chosen [22].\n\n### The outcome-measurement vendor landscape\n\nOutcome-measurement vendors have consolidated and specialized rather than converged on a single standard. Mediaocean completed its acquisition of Innovid on February 13, 2025 and rebranded its combined ad-tech business under the Innovid name in March 2025, positioning the merged entity — which also owns the former measurement competitor Flashtalking — as an independent, omnichannel measurement and ad-serving platform [23]. iSpot and VideoAmp remain independently operated, with iSpot's Outcomes at Scale product now integrated into Roku's live optimization stack as described above [13][23].\n\nEDO — which measures \"outcomes\" defined as web search and site-visit activity attributable to an ad exposure, rather than sales directly — expanded data-sharing integrations with VideoAmp, Kantar Media and DoubleVerify's Scibids during 2025, in addition to its existing Nielsen relationship, and struck a programmatic measurement partnership with The Trade Desk in June 2025 [24]. Blockgraph, the identity and data-collaboration venture owned by a consortium of major media companies, integrated its platform with VideoAmp specifically to connect linear and CTV viewing data to sales data [25].\n\nComscore's Proximic unit released its 2026 State of Programmatic Report in January 2026, surveying over 200 media buyers and finding 87% describing cross-channel performance metrics inside programmatic platforms as critical or valuable to their decisions — evidence that the demand for this kind of measurement is broad-based, not confined to the vendors selling it [26]. Comscore also partnered with Yahoo DSP in March 2026 on political CTV measurement and announced a cross-platform measurement deal with ESPN in January 2026, both signs the measurement layer is actively courting both political and premium-sports inventory as performance-adjacent use cases [26].\n\n### The accreditation and standards layer\n\nThe Media Rating Council (MRC) — the industry body that accredits measurement methodologies — has had an outcomes-and-data-quality standard in place since 2022, developed through a project involving more than 100 organizations and covering attribution, multi-touch attribution, market-mix modeling, and experimental methods alongside underlying data-quality requirements [27].\n\nAccreditation activity in this space has continued through 2025-2026: DoubleVerify earned MRC accreditation for CTV viewability in April 2024, and IAS earned MRC accreditation for third-party Amazon DSP measurement in November 2025, alongside separate MRC updates to Attention Measurement Guidelines in November 2025 and Digital Advertising Auction Transparency Standards in January 2026 [27].\n\nWhat is notably absent from this accreditation activity, based on the sources reviewed for this chapter, is a comparably specific, comparably dated MRC accreditation naming any of the guaranteed-outcome or CPA-optimization products described above. The accreditation infrastructure has moved fastest on viewability and auction transparency, more slowly on the causal-outcome claims those products are actually selling — and that gap is itself informative about which claims in this space are easiest to independently verify.\n\n### The currency transition\n\nNielsen — for decades the near-monopoly source of the TV \"currency,\" meaning the agreed measurement standard both buyer and seller price a transaction against — retired Panel-Only ratings for national transactional purposes effective September 1, 2025, moving fully to a \"Big Data + Panel\" methodology that blends its traditional household panel with set-top-box and smart-TV census data. Panel-Only Automatic Content Measurement was removed from transactional systems entirely as of January 1, 2026, though it remains available for historical comparison [28].\n\nThis is a genuine structural shift away from a single-panel monopoly toward a multi-sourced, hybrid currency, and AdExchanger's coverage frames buyers as broadly relieved to move past panel-only ratings' well-known small-sample volatility. But Nielsen itself made further adjustments to seven TV currency metrics in mid-2026, forcing buyers to re-validate their models mid-cycle — a reminder that \"currency transition\" in this market has meant continual, not one-time, change [29].\n\n### The honest problem, stated directly\n\nStrip the vendor branding from most \"performance CTV\" measurement products and a large share of what remains is last-touch or near-last-touch attribution wearing an \"outcomes\" label: a search-activity spike, a site-visit count, a mobile app open recorded in a short window after ad exposure, credited to the ad with no true control group behind it.\n\nThat methodology systematically over-credits television in setups where the advertiser's other channels — paid search, retargeting — are running simultaneously and capturing the same underlying demand, because a TV-exposed household that would have converted anyway looks identical, in this kind of measurement, to one the ad genuinely moved. It just as systematically under-credits television in setups where a longer, delayed path to purchase — the more plausible mechanism for a channel whose historical function was brand-building rather than demand capture — falls outside the attribution window entirely.\n\nBoth errors can be operating in the same market simultaneously, for different advertisers, and neither the \"TV outperforms digital\" claims nor the \"TV is unmeasurable and therefore worthless\" claims circulating in the trade press adequately account for that duality.\n\n## The Economics: What a Guarantee Costs the Seller\n\nGuaranteeing an outcome converts a media-selling business into a risk-bearing business, and that conversion has consequences that go beyond the marketing pitch.\n\n### From delivery risk to funnel risk\n\nA seller offering a CPM deal is paid on delivery: it takes on operational risk — did the ad render, was it viewable — but none of the advertiser's downstream funnel risk. A seller offering a CPA or guaranteed-outcome deal is paid only when the advertiser's landing page converts, the advertiser's offer is competitive, and the advertiser's own tracking correctly fires — none of which the seller controls, and all of which the seller is now financially exposed to.\n\nAbsorbing that exposure requires either working capital, meaning the seller serves impressions and eats the cost of the ones that do not convert, recovering revenue only later and only partially, or a hedge, typically achieved by pooling risk across a large enough advertiser base and a large enough sample of historical conversion data that the seller's aggregate CPA prediction is more reliable than any single advertiser's own forecast of its funnel.\n\ntvScientific's public framing captures the shift precisely: \"instead of paying for exposure and hoping it turns into performance, marketers can align TV investment more directly to business results\" [1]. The flip side of that sentence, rarely stated by the vendor making it, is that the platform is now the party hoping its performance model is priced correctly — the hope has not disappeared, it has simply moved from the buyer's side of the table to the seller's.\n\n### Who actually eats the loss — and the disclosure gap\n\nIndustry commentary on outcome-based deals more broadly is candid that publishers historically avoided CPA precisely because \"they take on all the uncertainty with no guaranteed return unless a conversion happens\" [11]. The emerging middle ground — performance-linked hybrid deals, where an advertiser commits to a spend level and the seller's CPM floats up or down against whether CPA or ROAS thresholds are hit — is one attempt to share rather than fully transfer that risk. It remains a described structure in trade commentary rather than a widely disclosed, standardized product with public pricing [12].\n\nWho actually eats the loss when a guarantee misses is, frankly, not something any seller discloses with real numbers. No public SSP or performance-CTV platform reviewed for this chapter breaks out, in a 10-K or an earnings call, what percentage of guaranteed-outcome campaigns underperformed their target, what the average shortfall cost the platform, or what m
