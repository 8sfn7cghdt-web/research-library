rism\n\nCarlyle's most consequential technical choice is the sustained **historical present**. He narrates events a half-century gone as though they are happening now, before our eyes, with the outcome unknown. This is not decorative: critics agree it is load-bearing for his theory of history. Ann Talbot's reading is representative — \"His use of the present tense is characteristic. He aims to make the reader experience what it was like to be there,\" conveying \"a sense of the rush of events and the uncertainties of the time,\" and keeping the Revolution a \"living struggle that would continue to influence the centuries to come\" [6]. Vanden Bossche makes the philosophical version of the point: in the present-tense narration \"past and present are not separate,\" so that the \"beliefs and actions\" of the Revolution \"constitute the lives of the narrator and his readers\" [8]. The tense is the grammar of Carlyle's conviction that the Revolution is not over.\n\nThe Bastille passage above is in the present throughout (\"de Launay gives fire,\" \"Bursts forth insurrection,\" \"The Bastille is besieged!\"). So is the wine-merchant-turned-gunner vignette:\n\n> \"Cholat the wine-merchant has become an impromptu cannoneer. See Georget, of the Marine Service, fresh from Brest, ply the King of Siam's cannon… Yet now, at the right instant, they have got together, and discourse eloquent music.\" [1]\n\nThe deictic imperative \"See Georget\" is the verbal equivalent of a director pointing the lens.\n\n### The cinematic cut: wide shot, close-up, montage\n\nThe most striking modern reading of Carlyle's method is frankly cinematic, and it predates film — which is why critics reach for Eisenstein as the nearest analogue. Talbot: \"There is a cinematic character in the way they both present history,\" with Carlyle cutting from a panoramic procession and \"just as rapidly focusing in on the individuals\" [6]. Mark Allison, in *Victorian Literature and Culture* (\"The French Revolution Now; or, Carlyle's Eternal Return,\" 2018), describes the technique as \"unattributed, 'polyphonic discourse'\" through which \"we seem to peer into an abyss of seething elemental forces,\" and the narrative perspective as fragmented across consciousnesses \"approximating modern cinematic montage\" [7]. The NEH essay summarizes Carlyle's \"remarkable talent for painting historical scenes through alternating wide shots and close-ups, motion and stillness, refrains, montage, and expressive angles\" [5][11].\n\nThe Bastille \"Fire-Mahlstrom\" passage is the textbook montage — a fast cut between the panoramic (\"At every street-barricade, there whirls simmering, a minor whirlpool\") and the elemental wide shot of the whole city as a single vortex:\n\n> \"all minor whirlpools play distractedly into that grand Fire-Mahlstrom which is lashing round the Bastille. And so it lashes and it roars.\" [1]\n\nThe execution of the King is built the same way — a slow tracking shot of the scaffold, then tight close-ups (the puce coat, the white flannel waistcoat, \"his face very red\"), then the cut to the severed head and the crowd:\n\n> \"He mounts the scaffold, not without delay; he is in puce coat, breeches of grey, white stockings. He strips off the coat; stands disclosed in a sleeve-waistcoat of white flannel… The Axe clanks down; a King's Life is shorn away. It is Monday the 21st of January 1793… Executioner Samson shews the Head: fierce shout of Vive la République rises, and swells; caps raised on bayonets, hats waving.\" [1]\n\nThe same montage governs the fall of Robespierre, where Carlyle explicitly flags his cutting technique as the only way to render chaos — \"Our fifth-act, of this natural Greek Drama, with its natural unities, can only be painted in gross; somewhat as that antique Painter, driven desperate, did the foam\" [1] — before cutting between the meeting of armed forces in the Place de Grève, the silvering dawn over the \"Ring-Dial of the Heaven,\" and the close-up of Robespierre on the deal table. The historical present, in short, is load-bearing for the whole technique: it abolishes the distance between reader and event to keep the Revolution a still-undecided process, and it is paired with a montage of wide shots and close-ups that Talbot, Allison, and the NEH all read as proto-cinematic.\n\n---\n\n## 3. The Prophetic / Sermonic Voice\n\n### The narrator as seer and preacher\n\nCarlyle's narrator is not a detached historian but a **prophet-preacher** who stands over the events pronouncing their meaning, rebuking the dead, blessing them, and turning to the reader with the second-person \"thou\" and the cadences of the King James Bible. Landow calls Carlyle a \"secular prophet\" who conveys both the \"meaning and experience\" of history at once [2]. Talbot notes \"an element of the prophet about Carlyle,\" for whom \"history was a truly human 'revelation'\" [6]. The voice is sermonic in its grammar: rhetorical questions, imperatives, benedictions, and the apostrophe.\n\nThe opening of the book sounds the note. On the death of Louis XV, the narrator turns from the courtiers' \"hollow phantasmagory\" to address mortality itself in pulpit cadence:\n\n> \"Frightful to all men is Death; from of old named King of Terrors. Our little compact home of an Existence, where we dwelt complaining, yet as in a home, is passing, in dark agonies, into an Unknown of Separation, Foreignness, unconditioned Possibility… it is a summing-up of Life; a final settling, and giving-in the 'account of the deeds done in the body.'\" [1]\n\n\"The deeds done in the body\" is a direct scriptural lift (2 Corinthians 5:10); \"King of Terrors\" is Job 18:14. The history opens, that is, in the register of a funeral sermon.\n\n### Address to the dead; benediction; the rhetorical question\n\nThe most distinctive move of the prophetic voice is **apostrophe to the dead**, warning men of fates already sealed. De Launay is addressed mid-siege as if he could still choose: \"Wo to thee, de Launay, in such an hour, if thou canst not, taking some one firm decision, rule circumstances!\" [1]. The voice can also turn to benediction. Over Robespierre's corpse — having just rendered the \"hideous\" final shriek — the narrator stops and pleads mercy in a closing benediction that is pure sermon:\n\n> \"O unhappiest Advocate of Arras, wert thou worse than other Advocates?… His poor landlord, the Cabinetmaker in the Rue Saint-Honoré, loved him; his Brother died for him. May God be merciful to him, and to us.\" [1]\n\nAnd the famous mid-narrative turn to the reader — \"Shut thy eyes, O Reader, see not this misery, peculiar to these later times\" [1] — uses the rhetorical imperative to implicate the living in the suffering of the dead. Mill recognized the originating warmth of this voice as the book's signature, praising that in it \"every idea and sentiment is given out exactly as it is thought and felt, fresh from the soul of the writer\" [5]. This prophet-preacher voice — the King James cadence and direct scriptural quotation, the archaic \"thou,\" the rhetorical questions, imperatives, benedictions, and sustained apostrophe to the dead — is what Landow, Talbot, and Mill alike identify as central to the work's authority and effect.\n\n---\n\n## 4. Recurring Image-Systems\n\nCarlyle's prose is held together less by argument than by a small set of recurring **image-systems** that carry the meaning symbolically. Vanden Bossche's central thesis is that Carlyle writes \"symbolic history\" — the narrator \"seeks to interpret this world by discovering its symbols,\" and public events function as \"Symbolic Representation[s] of belief\" [8]. Holloway likewise stresses that the imagery — especially \"water, fire, and animal imagery\" — does the persuasive work, an \"elemental\" rhetoric [3]. Four systems dominate.\n\n### 4.1 Fire, conflagration, phoenix\n\nFire is the master-symbol: the Revolution is a burning, and the burning is at once destruction and rebirth. The Bastille becomes a \"fire-chaos,\" a \"Fire-Mahlstrom\"; the imperative \"Let conflagration rage; of whatsoever is combustible!\" [1] is both report and prophecy. The system culminates in the **World-Phoenix**, where destruction is recast as the necessary prelude to renewal:\n\n> \"Behold the World-Phoenix, in fire-consummation and fire-creation; wide are her fanning wings; loud is her death-melody, of battle-thunders and falling towns; skyward lashes the funeral flame, enveloping all things: it is the Death-Birth of a World!\" [1]\n\nThe phoenix makes Carlyle's providential theory of revolution into an image: what burns is the Sham; \"Sansculottism will burn much; but what is incombustible it will not burn\" [1].\n\n### 4.2 The sea and the tide\n\nThe crowd and the course of events are rendered as **sea, tide, current, and maelstrom**. The mob at the Bastille is a rising tide — \"Ever wilder swells the tide of men; their infinite hum waxing ever louder\" [1]. The King's death is a descent into \"the black Mahlstrom and descent of Death\" [1]. The dissident armed forces on the night of Thermidor make Paris \"a huge Mahlstrom, sounding there, under cloud of night,\" with the city \"rushing confused, as Ocean-currents do\" [1]. Landow's reading foregrounds a related \"shipwreck paradigm,\" with figures \"swimming passively\" (Louis XV) or sinking (Loménie-Brienne) — the sea as both moral chaos and impersonal historical force beyond any individual's control [2].\n\n### 4.3 The spectral and phantasmagoric\n\nCarlyle repeatedly dissolves the solid world into **spectres, phantasms, and phantasmagory** — the unreal made of the over-real. The court of the dying Louis XV is \"a hollow phantasmagory, where like mimes they mope and mowl, and utter false sounds for hire\" [1]. From the Bastille's heights Thuriot is made to behold \"what other Phantasmagories, and loud-gibbering Spectral Realities\" are to come [1]. The oxymoron \"Spectral Realities\" is the engine: the Revolution is a haunting that is nonetheless the only real thing, the truth breaking through the masks. (The 2023 Strachan-edited Oxford scholarly edition, reviewed by Mark Philp under the apt title \"Haunting the Revolution,\" confirms the centrality of this register to current readings, though Philp's own spectral language is applied to the editorial apparatus rather than the text [12].)\n\n### 4.4 Masks, clothes, and Sansculottism as a force of nature\n\nThe *Sartor Resartus* clothes-philosophy persists: society is a costume, and the Revolution is the tearing-off of masks to reveal the \"buckram\" beneath. At the eruption of Sansculottism the courtly \"buckram masks start together, terror-struck,\" and the narrator warns \"Let whosoever is but buckram and a phantasm look to it\" [1]. Above all, **Sansculottism is personified as an elemental force of nature** — many-headed, fire-breathing, rising from the earth like a Titan:\n\n> \"on a sudden, the Earth yawns asunder, and amid Tartarean smoke, and glare of fierce brightness, rises SANSCULOTTISM, many-headed, fire-breathing, and asks: What think ye of me?\" [1]\n\nThroughout the third volume Sansculottism acts, sprawls, dies, and is buried as a single mythic agent (\"Sansculottism, once more flung resupine, lies sprawling; sprawling its last\"; \"So dies Sansculottism, the body of Sansculottism, or is changed\") [1]. Vanden Bossche reads such personifications, alongside the mock-epic deflations (\"Mars de Broglie,\" \"Mercury… de Brézé\"), as the symbolic machinery by which Carlyle represents a nation's \"unbelief\" [8]. That the work is organized by these four image-systems — fire/conflagration/phoenix, sea/tide/maelstrom, the spectral/phantasmagoric, and masks/clothes with Sansculottism personified as a Titanic force of nature — is the standard reading, developed by Vanden Bossche, Holloway, and Landow.\n\n---\n\n## 5. Prose-Epic / Prose-Poem: The Genre Boundary and the Double Verdict\n\n### Carlyle's own ambition\n\nCarlyle did not conceive himself as writing a conventional history in the line of Gibbon. He aimed, in his own phrase, at \"an Epic Poem of the Revolution,\" borrowing \"tone and grandeur from Homer, Virgil, and Milton\" and the novelist's tools of \"shifting point of view, imagery, and telling details\" [5][9]. He flags the epic register self-consciously and even self-deprecatingly — at the Bastille, \"To describe this Siege of the Bastille (thought to be one of the most important in history) perhaps transcends the talent of mortals,\" and the combatants are likened to \"the war of Pygmies and Cranes\" [1]; the fall of Robespierre is staged as \"our fifth-act, of this natural Greek Drama, with its natural unities\" [1]. Allison places this ambition in literary history: the book is \"perhaps the last significant attempt before the high modernists to develop a narrative alternative to the novel,\" conceived as \"an Epic Poem of the Revolution\" that rejects novelistic convention [7]. George Levine's *The Boundaries of Fiction* (1968) groups Carlyle with Macaulay and Newman precisely as a writer working the contested frontier between imaginative literature and factual prose — the book's whole frame is that Victorian historical and religious prose deliberately blurs the line fiction and history were supposed to keep [13].\n\n### The double verdict — then and now\n\nThe genre-straining is the book's power and the ground of the charge against it, and the two verdicts arrived together in 1837. Mill's review fused them in the formula that has organized all later judgment: the book is \"not so much a history as an epic poem; and notwithstanding this, or even in consequence of this, the truest of histories\" [4][5]. Mill's claim is radical: poetic form is not a *concession against* truth but, for this subject, the *condition of* truth — only the epic-present-tense rendering can convey what the Revolution actually was as lived experience. Thackeray's \"prose run mad,\" delivered in an otherwise favorable review, is the same observation read as a debit: the very intensity that makes it live makes it suspect as sober history [4][9].\n\nThat double verdict is permanent. The present-tense camera-eye and the prophetic voice are exactly what make the set-pieces unforgettable — and exactly what later positivist and professional historians distrust as the importation of the novelist's license into the historian's domain. Rosenberg's *Carlyle and the Burden of History* (1985) is the fullest modern defense of taking the literary form seriously as historiography: Rosenberg reads the book as understanding history at once \"as poetry, prophecy, biography, and social criticism,\" and devotes chapters to \"The Grand Poem of Our Time: The French Revolution\" and to Carlyle's \"Narrative Voices,\" treating the poetic technique as a mode of historical knowing rather than a decorative liability [2]. The modern revival of literary narrative history — Simon Schama's *Citizens* (1989) is the obvious heir — is a vindication of Mill's side of the ledger; the persistence of the \"unreliable as science\" charge is the survival of Thackeray's. That the book was conceived as a prose-epic straining the boundary between history and literature, and that the very features making it literature are at once its greatest power and the ground of the charge against it, is the central conclusion to draw from its style.\n\n---\n\n## Open Questions\n\n1. **How much is the \"cinematic\"/Eisenstein reading anachronistic projection vs. genuine structural homology?** The montage analogy is now near-ubiquitous in criticism (Talbot, Allison, NEH), but it is a 20th–21st-century optic applied to an 1837 text. A rigorous narratological account of Carlyle's actual cutting devices (deixis, tense-switching, focalization shifts) — independent of the film metaphor — would test whether the resemblance is structural or merely evocative.\n2. **What exactly does Rosenberg argue about narrative voice and the present tense?** *Carlyle and the Burden of History* is the key modern defense, known here through its table of contents (\"The Grand Poem of Our Time,\" \"Narrative Voices\") rather than its chapters; the precise argument and its supporting close readings remain to be consulted directly.\n3. **How does Levine's *Boundaries of Fiction* specifically characterize Carlyle's frontier-crossing** as against Macaulay's and Newman's? The framing is clear from secondary description, but Levine's particular claims about *The French Revolution*'s techniques were not read in the original.\n4. **Provenance of the Tennyson \"not until Joyce\" judgment** and the broader modernist-genealogy claim for Carlylese: the quotation is well-attested in summary but should be located in *\"Sartor\" Called \"Resartus\"* (1965) with page reference, and the *Sartor*→*French Revolution* stylistic continuity mapped passage-to-passage.\n5. **The reception history of the *style specifically*** (as distinct from the book's overall fame) — how the verdict on Carlylese moved from 1837 enthusiasm/alarm, through late-Victorian canonization, to 20th-century embarrassment, to the recent (2023 Oxford edition) scholarly recuperation — belongs to the chapter on reception and influence but intersects this one.\n\n---\n\n## Sources\n\n**Tier 1 — The text itself (quoted directly)**\n1. Thomas Carlyle, *The French Revolution: A History* (1837), Project Gutenberg ebook #1301, HTML edition, https://www.gutenberg.org/files/1301/1301-h/1301-h.htm (accessed 2026-06-08). All bracketed [1] quotations — the storming of the Bastille (Louis Tournay, the \"Fire-Mahlstrom,\" \"Let conflagration rage\"), the death of Louis XV (\"hollow phantasmagory,\" \"King of Terrors,\" \"deeds done in the body\"), the World-Phoenix and Sansculottism eruption passages, the execution of Louis XVI (\"The Axe clanks down… Son of Saint Louis, ascend to Heaven\"), the September Massacres frame, and the fall of Robespierre (the deal table, the bound jaw, the final shriek, \"May God be merciful to him, and to us\") — were extracted and verified verbatim from this text. *Contribution: the primary evidence; every stylistic claim is anchored in a quoted set-piece.*\n\n**Tier 2 — Literary-critical scholarship**\n2. George P. Landow, \"Thomas Carlyle's *The French Revolution*\" / \"The 'Shipwreck' Paradigm,\" *The Victorian Web* (victorianweb.org), https://victorianweb.org/art/crisis/crisis4c.html (accessed 2026-06-08). *Contribution: Carlyle as \"secular prophet\" conveying meaning + experience; the shipwreck/sea paradigm; shifting sympathetic/judgmental perspective; \"history, epic, mock-epic, and sermon.\"* Also John D. Rosenberg, *Carlyle and the Burden of History* (Harvard UP, 1985), chapters \"The Grand Poem of Our Time: The French Revolution\" and \"Narrative Voices\" — cited from publisher/secondary summary (not read in original; see Open Q2). *Contribution: the fullest modern defense of Carlyle's poetic form as a mode of historical knowing.*\n3. John Holloway, *The Victorian Sage: Studies in Argument* (1953), chapter on Carlyle, via Internet Archive, https://archive.org/details/victoriansagestu0000holl_g9l0 (accessed 2026-06-08); features summarized via search. *Contribution: the argument that Carlylese's apparent chaos is controlled (\"less irresponsible than they seem\"); \"elemental\" water/fire/animal imagery as rhetoric; \"a wild passionate energy… leaving an indelible impression of life, force, vitality.\"* [Analytical reading.]\n4. John Stuart Mill, review of *The French Revolution*, *London and Westminster Review* (1837), as quoted in standard reference and critical-heritage summaries; \"epic poem… the truest of histories\" verified across multiple sources. *Contribution: the founding double-verdict formula; \"fresh from the soul of the writer.\"* [Tier 1/2 — primary critical document, accessed here via secondary quotation; see Open Q.] \n5. Steve King / NEH, \"The Voracious Pen of Thomas Carlyle,\" *Humanities* (National Endowment for the Humanities), March/April 2009, https://www.neh.gov/humanities/2009/marchapril/feature/the-voracious-pen-thomas-carlyle (accessed 2026-06-08). *Contribution: \"an Epic Poem of the Revolution\"; Homer/Virgil/Milton tone; \"wide shots and close-ups, motion and stillness… montage\"; Mill, Thackeray, Dickens, Emerson reception.*\n6. Ann Talbot, \"Present historic: Carlyle, Robespierre and the French Revolution,\" World Socialist Web Site, 17 July 2010, https://www.wsws.org/en/articles/2010/07/fren-j17.html (accessed 2026-06-08). *Contribution: the present tense as \"experience what it was like to be there\"; the \"cinematic character\" and Estates-General cut from procession to individuals; \"an element of the prophet.\"* [Tier 5/6 — analytical essay on a partisan outlet; used for its close-reading of technique, not for political framing.]\n7. Mark Allison, \"The French Revolution Now; or, Carlyle's Eternal Return,\" *Victorian Literature and Culture* (Cambridge UP), 2018, https://www.cambridge.org/core/journals/victorian-literature-and-culture/article/french-revolution-now-or-carlyles-eternal-return/67D7210ABFCEB99A421E068384CC7F42 (accessed 2026-06-08). *Contribution: \"unattributed, 'polyphonic discourse'\"; \"abyss of seething elemental forces\"; cinematic montage; \"the last significant attempt before the high modernists to develop a narrative alternative to the novel.\"* [Peer-reviewed; analytical.]\n8. Chris R. Vanden Bossche, \"*The French Revolution* as Symbolic History\" (from *Carlyle and the Search for Authority*), *The Victorian Web*, https://victorianweb.org/authors/carlyle/vandenbossche/3e.html (accessed 2026-06-08). *Contribution: the \"symbolic history\" thesis — the narrator \"discovers its symbols\"; events as \"Symbolic Representation[s] of belief\"; mock-epic deflation; present-tense collapse of past and present.* [Analytical reading.]\n9. William Makepeace Thackeray, review of *The French Revolution* (1837), as quoted in standard reference summaries: \"stiff, short, and rugged… Germanisms… choking double words\"; \"prose run mad.\" *Contribution: the canonical hostile description of Carlylese; the debit side of the double verdict.* [Tier 1/2 primary critical document via secondary quotation.]\n10. G. B. Tennyson, *\"Sartor\" Called \"Resartus\"* (Princeton UP, 1965), as quoted: \"not until [James] Joyce is there a comparable inventiveness in English prose.\" *Contribution: the standard account of how Carlylese was forged in *Sartor*; the modernist genealogy.* [Cited via secondary quotation; see Open Q4.]\n11. Cinema & Media Studies course listing and Eisenstein scholarship (monoskop.org, UPenn cinemastudies), used only to corroborate that the Carlyle–Eisenstein montage comparison is an established critical commonplace, not original to this document. *Contribution: corroboration of the cinematic-comparison tradition.*\n12. Mark Philp, \"Haunting the Revolution\" (review of the Oxford scholarly edition of *The French Revolution*, ed. Mark Cumming / David Sorensen / Brent E. Kinser / et al.), *Essays in Criticism* 73.2 (2023): 255–, https://academic.oup.com/eic/article/73/2/255/7224726 (accessed 2026-06-08). *Contribution: evidence of a current authoritative scholarly edition and of the \"haunting/spectral\" critical register around the book (applied by Philp to the apparatus, not the text).* [Peer-reviewed review.]\n13. George Levine, *The Boundaries of Fiction: Carlyle, Macaulay, Newman* (Princeton UP, 1968), via Internet Archive listing, https://archive.org/details/boundariesoffict0000levi (accessed 2026-06-08). *Contribution: the frame of Victorian prose deliberately blurring history and fiction; Carlyle as a frontier-crosser between imaginative literature and factual prose.* [Cited from publisher/secondary description; see Open Q3.]"}, {"order": 4, "file": "04_Allusion_And_Intertextuality.md", "title": "Allusive Texture — Bible, Shakespeare, Milton, Dante, Goethe, Classics", "summary": "", "body": "# Carlyle's Allusive Texture: How *The French Revolution* Is Built Out of Older Texts\n\n## Bottom Line\n\nCarlyle's *The French Revolution: A History* (1837) is not a neutral chronicle dressed in figurative language; it is a **prose-epic deliberately constructed out of the King James Bible, Homer, Shakespeare, Milton, Dante, Goethe, and the Greek and Roman classics**, layered so densely that on almost any page two or three of these older texts are speaking at once. The deepest stratum is scriptural: Carlyle's Calvinist Annandale upbringing gave him a prose cadence drawn from the prophets (Isaiah, Jeremiah, Ezekiel) and an apocalyptic frame drawn from Revelation, so that the Bastille and the Terror are staged as a \"Crack of Doom,\" the Revolution as the \"Wrath\" and \"Eternal Justice\" of God poured out on a guilty old order, and Sansculottism as a scriptural fire and whirlwind. On top of this he lays a classical-and-Miltonic-and-Dantean machinery of hell: the storming of the Bastille is \"the Titans warring with Olympus,\" Marie-Antoinette's trial is \"the pale kingdoms of Dis... Styx and Lethe... Fire-Phlegethon and Cocytus,\" and the September Massacres are \"Night and Orcus... burst forth from their subterranean imprisonment.\" The compositional record is concrete and load-bearing: in early 1834, *before* writing, Carlyle read the *Iliad* in Greek and called the projected book \"the grand Poem of our Time\" and asked whether \"true History\" might be \"the only possible Epic\" — so the epic borrowing is a stated method, not a critic's retro-fit. The governing scholarly accounts — Mark Cumming's *A Disimprisoned Epic* (1988), John D. Rosenberg's *Carlyle and the Burden of History* (1985), and Chris Vanden Bossche's symbolic-history reading — agree that the work claims its authority by presenting itself as a successor to the Bible, Homer, and Dante. The critical question that stays open is whether that borrowed sacred-cosmic grandeur **illuminates** the Revolution (by registering its felt enormity) or **distorts** it (by translating contingent politics into divine drama and Manichaean fire) — a tension visible in the prose itself.\n\n---\n\n## 1. Why Allusion Is the Engine, Not the Ornament\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 520\" role=\"img\" aria-label=\"A geological cross-section of stacked horizontal strata representing the literary sources from which Carlyle&#8217;s The French Revolution is built. From the thin topmost layer downward the bands widen and deepen: Classical Antiquity (Nemesis, Titans, Tacitus, epic machinery) is the thin uppermost crust; Goethe and German Romanticism (Symbol, the Clothes-philosophy, the Earth-Spirit) lies beneath; then Dante&#8217;s Inferno (the descent, the damned); then Shakespeare (the Revolution as tragedy and history-play); then Milton&#8217;s Paradise Lost (Hell, Chaos, fallen grandeur); and at the base, by far the thickest, the bedrock stratum of the King James Bible (the prophetic cadence, apocalypse, the whole sermonic register). A small ember accent marks the bedrock. A synthesis question runs along the foundation: does the borrowed grandeur illuminate or distort?\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">BUILT OUT OF OLDER TEXTS<\/text>\n<text x=\"350\" y=\"48\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">the allusive strata of The French Revolution<\/text>\n<rect x=\"150\" y=\"72\" width=\"400\" height=\"34\" rx=\"2\" class=\"f-t4\" opacity=\".82\"/>\n<text x=\"350\" y=\"89\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-inv\" letter-spacing=\"1\">CLASSICAL ANTIQUITY<\/text>\n<text x=\"350\" y=\"101\" text-anchor=\"middle\" font-size=\"8\" class=\"t-inv\" opacity=\".88\">Nemesis &#183; Titans &#183; Tacitus &#183; epic machinery<\/text>\n<rect x=\"130\" y=\"110\" width=\"440\" height=\"46\" rx=\"2\" class=\"f-t5\" opacity=\".88\"/>\n<text x=\"350\" y=\"130\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">GOETHE &#8212; German Romanticism<\/text>\n<text x=\"350\" y=\"144\" text-anchor=\"middle\" font-size=\"8.4\" class=\"t-inv\" opacity=\".9\">Symbol &#183; the Clothes-philosophy &#183; the Earth-Spirit<\/text>\n<rect x=\"112\" y=\"160\" width=\"476\" height=\"54\" rx=\"2\" class=\"f-t3\" opacity=\".92\"/>\n<text x=\"350\" y=\"183\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" class=\"t-inv\">DANTE &#8212; Inferno<\/text>\n<text x=\"350\" y=\"197\" text-anchor=\"middle\" font-size=\"8.6\" class=\"t-inv\" opacity=\".9\">the descent &#183; the damned<\/text>\n<rect x=\"94\" y=\"218\" width=\"512\" height=\"62\" rx=\"2\" class=\"f-t2\" opacity=\".94\"/>\n<text x=\"350\" y=\"244\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"bold\" class=\"t-inv\">SHAKESPEARE<\/text>\n<text x=\"350\" y=\"259\" text-anchor=\"middle\" font-size=\"8.8\" class=\"t-inv\" opacity=\".92\">the Revolution as tragedy and history-play<\/text>\n<rect x=\"74\" y=\"284\" width=\"552\" height=\"72\" rx=\"2\" class=\"f-t1\" opacity=\".96\"/>\n<text x=\"350\" y=\"313\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" class=\"t-inv\">MILTON &#8212; Paradise Lost<\/text>\n<text x=\"350\" y=\"329\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\" opacity=\".92\">Hell &#183; Chaos &#183; fallen grandeur<\/text>\n<rect x=\"50\" y=\"360\" width=\"600\" height=\"112\" rx=\"3\" style=\"fill:var(--t1)\"/>\n<rect x=\"50\" y=\"360\" width=\"600\" height=\"112\" rx=\"3\" fill=\"none\" class=\"s-t2\" stroke-width=\"1.5\" opacity=\".5\"/>\n<polygon points=\"350,392 357,406 372,408 361,418 364,433 350,425 336,433 339,418 328,408 343,406\" class=\"f-t3\"/>\n<text x=\"350\" y=\"392\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif t-inv\" letter-spacing=\"2\">THE KING JAMES BIBLE<\/text>\n<text x=\"350\" y=\"450\" text-anchor=\"middle\" font-size=\"9.2\" class=\"t-inv\" opacity=\".92\">the prophetic cadence &#183; apocalypse &#183; the whole sermonic register<\/text>\n<text x=\"350\" y=\"463\" text-anchor=\"middle\" font-size=\"8.4\" class=\"t-inv\" opacity=\".75\" font-style=\"italic\">bedrock &#8212; deepest &amp; most pervasive<\/text>\n<text x=\"60\" y=\"377\" font-size=\"8.6\" class=\"t-inv\" opacity=\".7\" font-style=\"italic\">depth &#8595;<\/text>\n<text x=\"60\" y=\"68\" font-size=\"8.6\" class=\"t-muted\" font-style=\"italic\">surface &#8593;<\/text>\n<line x1=\"60\" y1=\"63\" x2=\"60\" y2=\"476\" class=\"ln-soft\" stroke-width=\"1\" opacity=\".4\"/>\n<text x=\"350\" y=\"494\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-style=\"italic\">synthesis question (ch.4 &#167;8): does the borrowed grandeur illuminate &#8212; or distort?<\/text>\n<text x=\"350\" y=\"510\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">Not &#8220;influenced by&#8221; &#8212; built <tspan class=\"t-acc\">out of<\/tspan> these texts, the King James Bible the bedrock the whole edifice stands on.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The French Revolution is not merely &#8220;influenced by&#8221; the canon &#8212; it is quarried from it in strata, each older text supplying a load-bearing course: Milton&#8217;s fallen grandeur, Shakespeare&#8217;s tragic plot, Dante&#8217;s descent, Goethe&#8217;s Symbol, the classical machinery of Nemesis and Titans. Beneath them all the King James Bible runs thickest and deepest &#8212; the prophetic cadence and apocalyptic register are the bedrock the whole edifice stands on, which is why the book&#8217;s ch.4 &#167;8 synthesis question (does the borrowed grandeur illuminate or distort?) is really a question about that foundation.<\/figcaption>\n<\/figure>\n\n\nMost histories use literary allusion to decorate; Carlyle uses it to *constitute* his subject. The proof is biographical and compositional, and it is unusually firm. In the months before he began writing, Carlyle prepared himself the way an epic poet would: he \"read four books of the *Iliad*, perhaps more, in Greek,\" together with Voss's German translation and the Homeric commentaries of Heyne, Knight, and Blackwell, having (in Vanden Bossche's words) \"determined to write an epic history\" and sought \"to prepare himself by a close study of the *Iliad*\" [1]. He had already written to Mill in September 1833 that \"the right History... of the French Revolution\" was \"the grand Poem of our Time,\" and would soon ask whether \"true History\" might be \"the only possible Epic\" [1]. The trial run was \"The Diamond Necklace,\" his \"first experiment\" at seeing \"whether by sticking actually to the Realities of the thing... one could not make a kind of Poem of it\" [1].\n\nThe claim that Carlyle *intended* an epic woven from older texts is not an inference from the style — it is attested in his letters and the documented reading program. The figurative texture that follows is the execution of a plan: Carlyle conceived and prepared the book as an epic poem in prose, and the allusive texture is therefore a deliberate method, not incidental decoration.\n\nThe two foundational monographs converge here. Rosenberg writes that Carlyle \"conceived of his histories as modern prose-epics — successors to the Bible, Homer, and Milton,\" and reads history for him as \"poetry, prophecy, biography, and social criticism combined\" [2]. Cumming, in *A Disimprisoned Epic*, \"reestablishes [the work] as an epic experiment in literary form,\" arguing that it \"combines the myths of epic with the facts of history; the nobility of tragedy with the grotesque absurdity of farce,\" and devotes a closing chapter to \"the literary inheritance that Carlyle in his history seeks to supersede, including everything from the Bible to Gibbon and Sir Walter Scott\" [3]. The publisher's and reviewers' synopses confirm that Cumming's organizing thesis is precisely that Carlyle builds the History out of, and against, prior epic and scriptural forms [3]. Both governing studies, then, read *The French Revolution* as a prose-epic that derives its authority from prior canonical texts — above all the Bible, Homer, Milton, and Dante — with Carlyle simultaneously imitating and trying to supersede them.\n\nA note on Carlyle's *theory* of epic, which shapes which models he honors and which he holds at arm's length. In \"On History\" and \"On Biography\" he treated genuine epics as \"histories, and understood to be narratives of facts,\" and held that epic authority \"derived from collective cultural belief, not individual authorial imagination\" [1]. On those grounds he counted the Bible and Dante's *Commedia* as *authentic* epics (\"[the *Commedia*] belongs to ten Christian centuries, only the finishing of it is Dante's\") but excluded Milton's *Paradise Lost* as \"too self-consciously authored,\" lacking the \"unselfconscious song\" of true epic [1]. The paradox worth flagging: Carlyle's *practice* is saturated with Miltonic diction even though his *theory* demotes Milton — so the Miltonic layer is a matter of inherited idiom and imagery, not of avowed model. The gap between Carlyle's stated epic theory and his Miltonic practice is an observation drawn from juxtaposing his account of the theory [1] with the Miltonic texture documented in section 3 below.\n\n---\n\n## 2. The King James Bible — The Deepest Layer\n\n### 2.1 The Calvinist substrate\n\nCarlyle was born in 1795 in Ecclefechan, Dumfriesshire, into a strict Burgher (Calvinist) household; his father James Carlyle was \"a man of profound Calvinist convictions whose character and way of life had a profound and lasting influence on his son,\" and Thomas attended the village school and then Annan Academy before Edinburgh [4]. The standard biographical accounts agree that Carlyle \"fused elements of his Calvinist upbringing... with German romanticism,\" and that his temperament combined \"a serious Calvinistic desire to denounce evil\" with prophetic harangue [4]. This is the soil of the prose. Even after Carlyle lost orthodox belief, the *cadence* and *vocabulary* of the Authorized Version remained his native register — the parallelism, the apostrophe, the \"Behold,\" the second-person address, the prophetic denunciation. Biographers treat this prophetic-harangue register, this \"Calvinistic desire to denounce evil,\" as a lasting structural feature of his writing even after he abandoned orthodox doctrine.\n\n### 2.2 The apocalyptic frame: Bastille and Terror as Last Judgment\n\nThe Bible enters the *History* most forcibly as the Book of Revelation. The Revolution is repeatedly staged as the Last Judgment — the seals broken, the wrath poured out, the old order weighed and found wanting. The clearest verified instance is in the Bastille chapter, where Carlyle compresses three sacred-and-mythic registers into a single drumbeat:\n\n> \"Smoke as of Tophet; confusion as of Babel; noise as of the Crack of Doom!\" [5]\n\nEvery term here is an allusion. **Tophet** is the valley of burning outside Jerusalem, the Old-Testament type of hell-fire (Isaiah 30:33, 2 Kings 23:10). **Babel** is Genesis 11, the archetype of confounded speech and collapsing human ambition. **The Crack of Doom** is the trump of the Last Judgment (and, doubly, Shakespeare's *Macbeth* IV.i, \"the crack of doom\" — see §4). In one clause Carlyle has fused scripture, Genesis, and Shakespeare; the Bastille assault is at once hell, the fall of human pride, and the end of the world.\n\nThe motif recurs as cosmic dissolution in Genesis-and-Flood diction:\n\n> \"The fountains of the great deep boil forth; fire-fountains, enveloping, engulfing. Your 'Earth-rind' is shattered, swallowed up; instead of a green flowery world, there is a waste wild-weltering chaos.\" [6]\n\n\"The fountains of the great deep\" is Genesis 7:11 (the Flood) verbatim; the \"waste... chaos\" reaches back to Genesis 1:2 (\"without form, and void\"). And the divine-judgment register is explicit in the address to the suffering masses:\n\n> \"Ye are heard in Heaven. And the answer too will come, — in a horror of great darkness, and shakings of the world, and a cup of trembling which all the nations shall drink.\" [6]\n\n\"A horror of great darkness\" is Genesis 15:12 (the covenant with Abram); \"a cup of trembling which all the nations shall drink\" fuses Isaiah 51:17 (\"the cup of trembling\") with the wrath-cup of Revelation 14:10 and Jeremiah 25:15 (\"this wine cup of fury\"). The Revolution is thus framed not as a political event but as the prophesied drinking of the wrath-cup by the nations — the Bastille and the Terror staged as the Last Judgment through dense, verifiable King James echoes.\n\n### 2.3 Sansculottism as scriptural fire and whirlwind; the \"Eternal Justice\"\n\nCarlyle's governing abstraction, **Sansculottism**, is treated not as a sociological category but as a quasi-scriptural force — a plague, a whirlwind, a fire of judgment that \"still lives... still works far and wide,\" perpetually reborn [7]. Vanden Bossche notes Carlyle's pointed contrast of the secular Feast of Pikes with \"the 'Hebrew Feast of Tabernacles'\" where \"A whole Nation gathered, in the name of the Highest,\" and reads \"the 'destructive wrath' of Sansculottism\" as the engine of the whole narrative [7]. The Revolution is, in Carlyle's own recurring phrase-family, the operation of **\"the Eternal Justice\"** and the **\"Wrath\"** upon a society of Shams — the guilty *ancien régime* judged and burned away.\n\nThe apocalyptic frame culminates, fittingly, in a vision of the world as one sea of fire. In the closing book Carlyle gives (through the mouth of \"Cagliostro\") the prophecy:\n\n> \"Imposture is in flames. Imposture is burnt up: one red sea of Fire, wild-billowing, enwraps the World.\" [8]\n\n\"One red sea of Fire\" is at once the Red Sea of Exodus and the lake of fire of Revelation 20 — the destroying and purifying flood become flame. Imposture (Carlyle's \"Sham\") is consumed exactly as the wicked are consumed in apocalyptic prophecy. That the fire-and-wrath framing is pervasive is well attested (Vanden Bossche on the \"destructive wrath\" of Sansculottism); the specific reading of \"red sea of Fire\" as a doubled Exodus/Revelation allusion is drawn from the text itself.\n\n---\n\n## 3. Milton — *Paradise Lost* as Template for Hell, Chaos, and Fallen Grandeur\n\nMilton supplies Carlyle with the architecture of hell and the grammar of fallen grandeur, even though (per §1) Carlyle's *theory* of epic demotes him. The revolutionary assemblies and mobs are repeatedly figured as **Pandemonium** — the council of fallen angels — and the revolutionary leaders as Satanic Titans whose ruin is magnificent. The diction of \"Chaos and old Night\" (*Paradise Lost* I–II) runs through the storm-and-sea imagery of the crowd scenes; the \"waste wild-weltering chaos\" quoted in §2.2 is as Miltonic as it is Genesis-derived (Milton's Chaos is \"a dark / Illimitable ocean without bound\").\n\nThe Bastille assault — \"It was the Titans warring with Olympus; and they, scarcely crediting it, have *conquered*\" [5] — is more classical than Miltonic in its proper names, but the *structure* of the image (rebel host storming the seat of established power, astonished at its own success) is the Miltonic-Satanic plot: the war in Heaven retold as the war on the Bastille. Carlyle's signature treatment of Mirabeau and Danton as figures of **Satanic grandeur** — Titans of fire and ruin, morally compromised yet sublime, \"earthquake\" natures — follows the long Romantic reading of Milton's Satan as the poem's tragic hero. Carlyle calls Mirabeau a \"Titan,\" a \"world-compeller,\" a fire-natured ruin.\n\nA caution on sourcing: no single scholar's essay isolates \"Carlyle's Miltonic borrowings in *The French Revolution*\" by name, the way Vanden Bossche isolates the symbolic method or Cumming the epic form. The Miltonic layer is real and visible in the diction (chaos / old night / Pandemonium / fallen-angel grandeur), Cumming's \"literary inheritance\" chapter treats Milton among the predecessors [3], and Rosenberg names Milton explicitly as one of the models Carlyle's histories succeed [2] — but the fine-grained Milton attributions below the level of those general statements are read from the text here. In short, that Milton is a named model is well established; the granular, passage-level Miltonic readings — Pandemonium-as-assembly, the Satanic-Titanic grandeur of Mirabeau and Danton — are interpretive.\n\n---\n\n## 4. Shakespeare — The Revolution as Tragedy and History-Play\n\nCarlyle reads and stages the Revolution dramaturgically: scenes are blocked like theatre, the present-tense \"camera-eye\" narration works like stage directions, and individual actors are cast as tragic protagonists. The most precise verifiable Shakespearean tag is again the Bastille's **\"the Crack of Doom\"** — a phrase that is biblical (the Last Judgment) but whose currency in English is owed to *Macbeth* IV.i.117, where the line of kings stretches \"to th' crack of doom\" [5]. The *Macbeth* matrix — blood that will not wash out, regicide, the \"tomorrow and tomorrow\" futility, the witches' equivocation — is the natural Shakespearean substrate for a narrative of king-killing and its haunted aftermath, and Carlyle's recurring blood-and-doom diction draws on it.\n\nMore structurally, Carlyle treats the whole as a tragic **Drama** with named acts. He repeatedly invokes prior historical massacres as a tragic series — \"Bartholomew Butchery,\" the \"Armagnac Massacres,\" the \"Sicilian Vespers\" — placing the September Massacres in a line of staged historical tragedy [9]. The work's tripartite architecture (*The Bastille* / *The Constitution* / *The Guillotine*) is itself a three-act tragic structure moving from rising action through crisis to catastrophe. Cumming's thesis — that the *History* yokes \"the nobility of tragedy with the grotesque absurdity of farce\" [3] — is precisely the Shakespearean mixture of the tragic and the grotesque-comic (the gravediggers in *Hamlet*, the Porter in *Macbeth*) transposed onto history. That Cumming reads the work through tragedy-and-farce is well established; the specific *Macbeth* mapping of blood and regicide is read from the text here.\n\n---\n\n## 5. Dante — The *Inferno*, the Descent, the Damned\n\nDante is the one infernal model Carlyle's *theory* explicitly endorses (the *Commedia* as an authentic epic \"of ten Christian centuries\" [1]), and the *Inferno* surfaces in the *History* as explicit, named allusion — the most textually secure of all the borrowings after the Bible. The set-piece is Marie-Antoinette's trial in the Terror, where Carlyle pulls the entire underworld into one sentence:\n\n> \"Dim, dim, as if in disastrous eclipse; like the pale kingdoms of Dis! Plutonic Judges, Plutonic Tinville; encircled, nine times, with Styx and Lethe, with Fire-Phlegethon and Cocytus named of Lamentation!\" [10]\n\nThis is not vague hell-imagery: **Dis** is the lower city of Dante's *Inferno* (Cantos VIII–IX); the \"nine\" encirclements are the nine circles of Hell; **Styx, Lethe, Phlegethon (the river of fire), and Cocytus (the frozen lake of lamentation at Hell's bottom)** are precisely Dante's and Virgil's infernal rivers. Fouquier-Tinville, the public prosecutor, becomes a \"Plutonic Judge,\" a Minos or Rhadamanthus of the Pit. The Revolutionary Tribunal is staged as a literal descent into the *Inferno*, the trial as a damnation.\n\nThe September Massacres are figured the same way: \"Night and Orcus... have burst forth, here in this Paris, from their subterranean imprisonment,\" and the reader \"who looks earnestly through this dim Phantasmagory of the Pit\" sees a Lapland-witch darkness [9]. **Orcus** is the Roman underworld; \"the Pit\" is both classical Tartarus and the biblical pit of Sheol/Revelation. The descent-into-Hell of the *Inferno* gives Carlyle his model for the Terror as the soul's (and a nation's) journey through damnation. This is among the most textually secure allusions in the entire work.\n\n---\n\n## 6. Goethe and German Romanticism — Symbol, Clothes, Earth-Spirit\n\nBefore he was a historian, Carlyle was Britain's foremost translator and apostle of Goethe: he translated *Wilhelm Meister's Apprenticeship* (1824), wrote a *Life of Schiller* (1825), and produced the four-volume *German Romance* (1827), steeping himself in Goethe, Schiller, Novalis, and Jean Paul Richter [11]. Charles Frederick Harrold's *Carlyle and German Thought, 1819–1834* (Yale, 1934) is the standard study of this formation, tracing how Carlyle absorbed, amplified, and sometimes distorted German thought \"in favour of his own belief\" [11]. The German inheritance enters the *History* in two main ways.\n\nFirst, **the philosophy of clothes and symbol** carried over from *Sartor Resartus* (written just before, published in book form 1838). Vanden Bossche's reading is that the *History* is a symbolic history in which \"public events function as 'Symbolic Representation[s] of belief'\" and the narrator \"discovers the symbolic import of events\" rather than merely recording facts [7]. The Bastille is the symbol of \"the old imprisoning order\" broken open; the royal family's \"cumbersome berline\" is the symbol of \"the accretions of privilege and meaningless tradition\" that made the monarch powerless [7]. This is the *Sartor* clothes-philosophy — institutions as worn-out garments to be cast off — applied to revolution. (Vanden Bossche carefully distinguishes the two works: in *Sartor* the Editor imposes pattern on chaos; in the *History* Carlyle claims to \"derive his interpretation... from the historical material itself\" [7].)\n\nSecond, **the fire/Phoenix-rebirth myth** — *palingenesia*. The Goethean-Romantic vision of cyclical death-and-rebirth gives Carlyle \"the burning of a World-Phoenix\" to represent civilization undergoing \"death and Palingenesia, or Newbirth,\" a figure carried from *Sartor* directly into the conflagration imagery of the *History* [12]. The Earth-Spirit of Goethe's *Faust* (\"'Tis thus at the roaring Loom of Time I ply\") stands behind Carlyle's recurring image of history as a living, weaving, fire-shot process. G. B. Tennyson, whose *Sartor Called Resartus* (1965) is the standard study of *Sartor*'s genesis and style, judged Carlyle's prose inventiveness unequaled \"not until [James] Joyce\" — a reminder that the German-derived symbol-method produced a genuinely new English prose [13]. Both strands — the clothes-philosophy of institutions as worn-out garments and the Phoenix/*palingenesia* fire-rebirth myth as the master figure of revolution — are scholar-attested, by Harrold on the German formation and Vanden Bossche on the symbolic method.\n\n---\n\n## 7. Classical Antiquity — Nemesis, Titans, Tacitus, Epic Machinery\n\nThe classical layer is the one most directly continuous with Carlyle's documented preparation (the *Iliad* in Greek, §1) and it operates at three levels.\n\n**(a) Epic machinery and Homeric narration.** The present-tense, panoramic, catalogue-driven narration — the massing of crowds, the named heroes, the divine-eye sweep over the battlefield of Paris — is Homeric in technique, the fruit of Carlyle's 1834 *Iliad* study and his conviction that \"true History [is] the only possible Epic\" [1]. Synecdochal forces — \"Royalism,\" \"Patriotism,\" \"Rumour,\" \"Hunger\" — act as quasi-Homeric agents striding through the narrative, a device the Cambridge essay \"The French Revolution Now\" identifies as Carlyle's central innovation: \"synecdochal personification to depict ideological loyalties and instinctual drives, with collective forces... serving as principal narrative agents\" [14].\n\n**(b) Titans, Olympus, and Nemesis/Fate.** The Bastille assault as \"the Titans warring with Olympus\" [5] casts the Revolution as the Titanomachy — the older, chthonic powers rising against the established gods. Greek-tragic **Nemesis** and **Fate** govern the moral structure: the *ancien régime*'s guilt incurs an inexorable retribution, exactly as hubris incurs *nemesis* in Aeschylus and Sophocles. The Revolution as Nemesis-upon-Sham is the classical-tragic twin of the biblical \"Eternal Justice\" — the same idea in two inherited vocabularies, pagan Fate and Calvinist Providence fused.\n\n**(c) Roman underworld and Tacitean register.** The infernal scenes draw Roman as well as Dantean material — \"Orcus,\" \"Dis,\" \"Plutonic\" judges, the \"Pit\" [9][10]. And the moral-historical voice — terse, indignant, sententious, exposing the corruption beneath imperial spectacle — is recognizably **Tacitean**, the Roman historian of decadence and tyranny standing behind Carlyle's anatomies of the dying court. Of these three, the Homeric method is scholar-attested (Vanden Bossche; \"French Revolution Now\"), while the Nemesis and Tacitus readings are partly inference from the text.\n\n---\n\n## 8. Synthesis — Does the Borrowed Grandeur Illuminate or Distort?\n\nStack the layers and the method becomes clear. On any given page Carlyle may run scripture, Homer, Milton, Dante, Shakespeare, and the classics simultaneously: \"Smoke as of Tophet [Bible]; confusion as of Babel [Bible]; noise as of the Crack of Doom [Bible + *Macbeth*]\" while \"the Titans war with Olympus [Greek]\" — four traditions in two sentences. The effect is to lift contingent political events out of mere chronology and present them as **cosmic, sacred drama**: the Bastille as Doomsday, the Terror as a Dantean descent into Dis, Sansculottism as the wrath of the Eternal, the whole as a tragic three-act poem ending in purifying fire and the Phoenix's death-birth.\n\nThe borrowed authority does real work. It lets Carlyle claim for a recent, messy, partisan subject the gravity of scripture and epic — to insist, against the cool Enlightenment historians he despised, that the Revolution *meant* something, that it was Judgment and not mere chaos. Cumming's title — *A Disimprisoned Epic* — captures the ambition: Carlyle frees epic from the dead past and reattaches it to living history [3]. Rosenberg names the corresponding paradox: Carlyle is \"the poet of the insubstantiality of the 'real' and reality of the Phantasmagoric\" [2] — the allusive haze is how he makes events feel more real than realism could.\n\nBut the same machinery is also the central **critical liability**, and honest scholarship has long said so. Translating politics into apocalypse risks: (1) **Manichaeanism** — a world of pure Sham judged by pure Wrath, with the messy middle (the moderates, the institutional questions, the economic causes) burned away in the fire-imagery; (2) **determinism** — if the Revolution is Nemesis and Providence, then human agency and contingency shrink, and the guillotine becomes fated rather than chosen; (3) **the sublime overwhelming the analytic** — the reader feels the Terror as Hell but may understand it less, the Dantean splendor of \"Styx and Lethe... Fire-Phlegethon\" substituting for explanation of *why* the Tribunal killed. The Cambridge reading frames the whole as \"inverted utopianism — an apocalyptic manifestation of a utopian longing for heaven on earth\" [14], which is exactly the double edge: the apocalyptic frame is the source of both the work's prophetic power and its distortion.\n\nThe fairest verdict — and the one these pages leave as a genuinely open critical question rather than a settled judgment — is that Carlyle's allusive grandeur is **simultaneously illuminating and distorting**: it registers the felt enormity and moral weight of the Revolution as no Whig chronicle could, and it systematically over-writes the contingent with the cosmic. The allusions are not a layer you can strip off to find the \"real\" history underneath; they *are* Carlyle's history. To read the *Iliad*, the King James Bible, the *Inferno*, and *Paradise Lost* into the fall of the Bastille is, for Carlyle, to tell the truth about it. Whether that borrowed authority net-illuminates or net-distorts remains a live, unsettled critical question.\n\n---\n\n## Open Questions\n\n1. **Mirabeau and Danton as Satanic-Miltonic figures — verbatim confirmation.** The reading of Carlyle's Mirabeau (\"Titan,\" fire-natured ruin) and Danton rests on the secondary record; pinning the exact Mirabeau-death passage (Vol. 2, Book 3) word for word would harden the Miltonic reading of those figures (section 3).\n\n2. **A dedicated study of Carlyle's *Miltonic* borrowing.** Cumming treats the epic form, Rosenberg the burden of history, Vanden Bossche the symbolic method, Harrold the German thought — but no essay isolates Milton-in-*The-French-Revolution* at passage level. Does such a study exist (e.g., in *Carlyle Studies Annual*)? If so it would put several of the section 3 readings on firmer ground.\n\n3. **Carlyle and the Bible — a single authoritative study.** The scriptural layer here rests on the text plus biographical accounts of Carlyle's Calvinism; no monograph titled specifically on \"Carlyle and the Bible\" appears to exist. Identifying the standard study (and its specific catalogue of scriptural echoes) would strengthen section 2.\n\n4. **The Shakespeare layer.** Beyond \"the Crack of Doom,\" which specific *Macbeth*/*Hamlet*/history-play tags do annotated critical editions (e.g., the Oxford Carlyle, ed. Cumming/Sorensen/Engel/Kinser, 2019) actually gloss? Their notes would put the *Macbeth* mapping read here on an editorial footing.\n\n5. **Net illumination vs. distortion.** The synthesis in section 8 is left deliberately open. Where does the weight of modern scholarly judgment fall — and has it shifted (e.g., post-Schama, post-2022 \"French Revolution Now\")?\n\n---
