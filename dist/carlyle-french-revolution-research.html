 Carlyle's chronology and event-descriptions; both give the true seven Bastille prisoners; \"fire deluge\"/\"living sea\" shared fire-and-water metaphor.\n15. Aggregated symbolism scholarship (SparkNotes; SuperSummary; Study.com; Britannica \"Madame Defarge\"). Tier 5 (study apparatus) with the primary novel behind it (Tier 1). Accessed 2026-06-08. — broken wine-cask, \"tigerish smear,\" \"BLOOD\" scrawled in wine; Defarge's knitting as Fate/Moirai; Dickens troubled by revolutionary violence; novel \"refuses simple moral judgments.\"\n16. *Encyclopaedia Britannica*, \"Madame Defarge.\" Tier 2 (expert reference). Accessed 2026-06-08. — knitting/tricoteuse iconography and its fatalism.\n17. Victorianweb / Study.com on *A Tale of Two Cities* themes: Sydney Carton \"recalled to life,\" \"I am the Resurrection and the life,\" resurrection/redemption motif. Tier 5, primary novel behind it. Accessed 2026-06-08. — Dickens's displacement of redemption onto private Christian sacrifice.\n18. Victorianweb, \"The Genre of Sage-Writing (or Secular Prophecy)\" / \"Elegant Jeremiahs\" (George Landow; John Holloway); and biographical material on Froude's *Life*. Tier 2/5. Accessed 2026-06-08. — Carlyle as founder of sage-writing; Froude's biography both confirming the prophet and devastating the personal reputation.\n19. Thomas Carlyle — Wikipedia, on the Froude controversy (\"almost overnight... object of puzzled dislike, or even of revulsion\"). Tier 7 navigational; the characterization traces to Froude scholarship (Ciaran Brady, *James Anthony Froude*, EUP 2013). Accessed 2026-06-08.\n\n### Texts referenced but not consulted directly\n- J. S. Mill, review of *The French Revolution*, *London and Westminster Review* 5 (July 1837) — full original not read.\n- Jules Paul Seigel, ed., *Thomas Carlyle: The Critical Heritage* (Routledge, 1971) — the standard collection of 1837 reviews; not read.\n- Michael Goldberg, *Carlyle and Dickens* (University of Georgia Press, 1972) — not read.\n- Andrew Sanders, *The Companion to A Tale of Two Cities* and \"'Cartloads of Books'\" chapter — read only in summary.\n- *The Letters of Charles Dickens*, Pilgrim Edition, vols. for 1859 — not read in original.\n- Joseph Slater, ed., *The Correspondence of Emerson and Carlyle* (1964) — not read.\n- Edgar Johnson, *Charles Dickens: His Tragedy and Triumph* (1952) — cited at second hand (p. 955).\n- J. A. Froude, *Thomas Carlyle: A History of His Life in London* (1884) and *Reminiscences* (1881) — not read."}, {"order": 7, "file": "07_Historiographical_Place_And_Modern_Assessment.md", "title": "Place in French Revolution Historiography and Modern Assessment", "summary": "", "body": "# Place in French Revolution Historiography and Modern Assessment\n\n## Bottom Line\n\nCarlyle's *The French Revolution: A History* (1837) occupies a peculiar and durable position in the long argument over the Revolution: it belongs to no school that subsequently won, and that is precisely why it has survived. It is not Whig-progressive, not Marxist-social (Mathiez, Lefebvre, Soboul), and not Furet-revisionist; it is *sui generis* — a Romantic, providential, moral history, the prime English specimen of the \"history-as-epic / history-as-biography\" strand that flourished in the 1820s–40s alongside Thiers, Mignet, and above all its great French rival, Jules Michelet. The professional consensus that hardened across the twentieth century is unambiguous and has barely moved: as *analysis* the book is unreliable — insufficiently empirical by modern standards, organized around heroes and moral judgment rather than social structure or ideology, prophetic where it should be probative — yet as *narrative art* and as a still-quotable evocation of the Revolution's lived texture it remains valuable, in print, and assigned to students nearly two centuries on. The most consequential modern echo is Simon Schama's bicentenary *Citizens* (1989), an explicit return to vivid event-driven narrative and to a Carlyle-like, Furet-inflected skepticism about revolutionary violence; the comparison is the clearest single proof that the Carlylean mode never fully died. The frank verdict a working historian reaches today: read it for the texture, the set-pieces, the moral seriousness, and the sheer prose; never trust it for cause, chronology-as-argument, social mechanism, or a balanced ledger of the Terror.\n\n---\n\n## 1. The Field Carlyle Entered: Histories of the Revolution circa 1837\n\nWhen Carlyle published in 1837, the historiography of the Revolution was scarcely a generation old and already crowded. The dominant French accounts were the liberal-constitutional narratives of **Adolphe Thiers** (*Histoire de la Révolution française*, 1823–27) and **François Mignet** (*Histoire de la Révolution française*, 1824), both of which Carlyle read and used as source-quarries even as he despised their interpretive temper. Thiers and Mignet treated the Revolution as the broadly necessary, broadly justified triumph of the bourgeoisie and the constitutional principle over a decayed *ancien régime* — a story of impersonal forces working themselves out toward a liberal settlement (alphahistory.com, \"French Revolution historiography,\" accessed 2026-06-08). [1]\n\nCarlyle explicitly rejected that deterministic, forces-over-persons temper, insisting instead on individual moral responsibility and the lived experience of particular human beings, and naming Mirabeau, Danton, and Napoleon as the Revolution's three \"great men.\" [1][2] He \"rejected Thiers' deterministic view of history which emphasised inexorable historical forces over individual moral responsibility, and was more interested in the lived experience of individuals\" (alphahistory.com; corroborated by Britannica). [1][6]\n\nCarlyle thus positioned himself *against* the prevailing French liberal determinism, not because he favored the Revolution less but because he read it differently — as a moral and providential drama, a divine judgment, rather than the mechanical unfolding of class interest or constitutional logic. This anti-determinist, person-and-judgment-centered stance is the hinge on which his entire historiographical placement turns. Britannica records the governing idea baldly: \"Carlyle believed that the excesses of the French Revolution were a divine judgment upon a selfish monarchy and nobility,\" and praises the book's \"outstanding set pieces and character studies\" rather than any analytical apparatus (Britannica, \"The French Revolution by Carlyle\"). [6]\n\nThe English field he entered was thinner but real, and Carlyle would soon define its center. **Hedva Ben-Israel's** *English Historians on the French Revolution* (Cambridge University Press, 1968) treats the British writers on the Revolution from 1789 to 1900 — Smyth, Carlyle, Alison, Croker, Acton, and others — as a coherent \"school\" sharing common aims, methods, and above all a political point of view, with a chapter devoted in detail to Carlyle as the most prominent of them (Ben-Israel, 1968). [3] It is the foundational modern monograph for situating Carlyle in *English-language* Revolution historiography specifically.\n\n---\n\n## 2. The Great Romantic Rival: Carlyle and Michelet\n\nIf Carlyle has a true counterpart, it is **Jules Michelet** (1798–1874), whose *Histoire de la Révolution française* (1847–53) is the other towering monument of Romantic Revolution-writing. François Furet — the late-twentieth-century revisionist — called Michelet's history \"the cornerstone of all revolutionary historiography and is also a literary monument\" (via alphahistory.com; Gossman). [1][4] The pairing of Carlyle and Michelet is the most illuminating single comparison here, because the two men share a mode and divide sharply on its content.\n\n**Lionel Gossman's** essay \"Jules Michelet and Romantic Historiography\" supplies the best available definition of the category both men inhabit. Gossman argues that Romantic historiography aimed at a \"synthesis of scholarship and narrative art\" — reconciling \"the investigative and disruptive practice of historical criticism and scholarship with the narrative art that establishes connections and asserts continuities\" — and was \"intimately associated with the moderately liberal and nationalist aspirations of the period immediately following the French Revolution and the Napoleonic wars\" (Gossman, \"Jules Michelet and Romantic Historiography,\" in *European Writers*). [4] On Gossman's account the French Restoration and July-Monarchy historians (Barante, the Thierrys, Guizot, Michelet, Martin) \"probably stand alone in their combination of scholarship and artistry\" [4] — which makes Carlyle, writing in English and outside that French liberal-national project, the great *outlier* practitioner of the same fusion, sharing the narrative ambition while serving a providential-moral rather than liberal-national end.\n\nThe two diverge on the Revolution's protagonist and its meaning. Michelet made **\"the People\"** the collective hero — the Revolution as \"the tardy advent of Eternal Justice,\" creative and redemptive, personified by a People whose joy and misery he evokes \"on every page\" (alphahistory.com; Gossman). [1][4] Carlyle, by contrast, foregrounded individuals and moral judgment; **Giuseppe Mazzini** lodged the classic critique that Carlyle \"lacked the true conception of Humanity,\" recognizing \"no collective life or collective aim... only individuals\" (Mazzini, via alphahistory.com / Cambridge). [1][7]\n\nYet whether Carlyle's history is \"individualist\" is itself disputed, and the dispute is a live interpretive crux rather than a settled reading. Where Mazzini charged Carlyle with seeing only individuals, recent scholarship (Mark Allison, Cambridge, 2022) argues the reverse — that in *The French Revolution* \"the roused collectivities are the primary agents of his narrative and simply dragoon a leader as a kind of figurehead,\" making the Paris mob, not any great man, the effective hero. [1][7] The hero-theory of *On Heroes* (1841) and the crowd-driven practice of *The French Revolution* (1837) pull against each other.\n\nThe rivalry was personal and explicit. Michelet, who saw the Revolution as creative where Carlyle saw it as destructive, dismissed Carlyle's book in **1868** as \"a wretched work,\" \"devoid of study\" and \"full of false flights\" (Michelet, 1868, via alphahistory.com). [1] It is a striking datum — the era's other great Romantic historian rejecting Carlyle on grounds (insufficient study, rhetorical excess) that anticipate the modern professional verdict.\n\nThe Victorian English reception ran the other way: contemporaries often judged Michelet's *Histoire* \"less picturesquely accurate than Carlyle's work,\" while still crediting Michelet's \"idiosyncrasy and literary power\" (Victorian-era criticism, via alphahistory.com / victorianweb.org). [1][8] The phrase \"picturesquely accurate\" captures the whole problem: it concedes vividness and concedes that vividness is being asked to stand in for accuracy.\n\n---\n\n## 3. The Schools, and Why Carlyle Belongs to None of Them\n\nThe twentieth-century historiography of the Revolution organized itself into a sequence of warring schools, and Carlyle's defining feature is that he fits none.\n\n**The Marxist / social-interpretation school.** From the late 1920s to the 1960s, social and economic analysis — often explicitly Marxist — dominated, associated above all with **Albert Mathiez**, **Georges Lefebvre**, and **Albert Soboul**. Soboul used explicit Marxist categories (mode of production, relations of production) and located the revolutionary motor in \"the masses of peasants, petty producers, artisans, and other urban workers rather than the bourgeoisie\" (alphahistory.com / marxists.org). [1][9] This dominant twentieth-century interpretation read the Revolution as class struggle driven by objective social forces, an approach methodologically antithetical to Carlyle's hero-and-judgment narrative: his history has no concept of class as a structural motor, no economic substructure, no social mechanism, and on the social interpretation's own terms it is not analysis at all.\n\n**The revisionist challenge.** From the 1960s, **Alfred Cobban** and then **François Furet** dismantled the Marxist social interpretation. Furet shifted the explanatory weight from objective class dynamics to \"the subjective ideological discourse of revolutionaries as the main factor conditioning the outcome of events,\" and argued that Terror was \"built in\" to revolutionary action from its early days (Furet, *Penser la Révolution française*, 1978, via alphahistory.com / muse.jhu.edu). [1][10] This relocation of the driving force from social class to political and ideological discourse matters for Carlyle in two opposite ways. Furet's *method* — analytical, anti-narrative, theory-driven — is alien to Carlyle; but Furet's *conclusion* about the intrinsic violence of the Revolution rhymes with Carlyle's lurid moral reading of the Terror as judgment, a rhyme Schama would exploit (see §4).\n\n**Where Carlyle stands.** Carlyle is not Whig-progressive (he scorned the liberal-constitutional teleology of Thiers/Mignet and the complacent march-of-progress story). He is not Marxist (no class analysis, no materialism). He is not revisionist (no analytical method, no discourse-theory; his anti-narrative opposite). He is the prime English instance of the **Romantic / providential / moral** strand — \"history as epic / biography,\" the tradition Gossman anatomizes and Hayden White would later formalize. To classify him this way — *sui generis*, the leading English exemplar of the Romantic, providential, narrative-epic mode, alongside Michelet on the French side — is the consensus framing implicit across Ben-Israel, Gossman, and the standard overviews. [1][3][4]\n\n**Hayden White's** *Metahistory* (1973) gives the theoretical underwriting for treating Carlyle this way. White argued that nineteenth-century historical writing was structured by literary tropes and emplotments — that the historian's choice of narrative form is itself an interpretive act — which licenses reading Carlyle's \"Romantic emplotment\" as a *kind* of historical argument rather than a failure to make one (White, *Metahistory*, 1973). [11] On White's account the old charge \"Carlyle wrote literature, not history\" mistakes the universal condition of history-writing for Carlyle's idiosyncratic vice.\n\n**John Clive**, the Harvard historian of historiography, made the complementary biographical-interpretive point: Carlyle \"did not see himself as a historian, rather as a prophet who wanted to share his beliefs,\" beliefs shaped by his own life, so that although he intended the book as a *warning* about how revolutions erupt, \"many people read it as a kind of epic poem\" (Clive, *Not by Fact Alone*, 1989). [12] Clive's framing is now the standard way historiography-of-history scholars place Carlyle: the gap between authorial intent (warning) and reception (poem) is itself the key fact, and understanding the book requires reading Carlyle's biography alongside it.\n\n---\n\n## 4. The Narrative-History Revival: Schama's *Citizens* (1989)\n\nThe single clearest modern proof that the Carlylean mode survived is **Simon Schama's** *Citizens: A Chronicle of the French Revolution*, published in 1989 for the bicentenary. Schama deliberately returned to \"the epic narratives employed by historians like Carlyle, focusing on people and events\" — narrative history \"filled with colour, drama and suspense but light on theory and intensive analysis\" — in conscious reaction against the analytical, theory-heavy academic mainstream (Wikipedia citing reviews → underlying reviews; alphahistory.com). [13][14] The subtitle \"A Chronicle\" itself signals the deliberate archaism: chronicle, the oldest form of history, set against analytical history, and the book was widely received as exactly this return to the lineage of Carlyle and Michelet.\n\nSchama's relation to the schools is instructive and double. His *conclusions* sit broadly in the **Furet/Cobban revisionist** camp — he draws on both as \"the principal authors of the 'revisionist' attack on the Marxist interpretation\" — but his *method* is the oldest kind of history, narrative chronicle, not Furet's analytical discourse-history (alphahistory.com; Callinicos, marxists.org). [1][15] In fusing a revisionist (Furet/Cobban) interpretive stance with an emphatically pre-academic narrative method, *Citizens* produced what critics called a Furet conclusion delivered by Carlylean means — the precise structural parallel to Carlyle, a moral/providential reading of revolutionary violence carried by narrative rather than by analysis.\n\nThe deepest Carlyle echo is **on violence**. Schama argued, in a much-quoted formulation, that \"violence... was not just an unfortunate side effect... it was the Revolution's source of collective energy. It was what made the Revolution revolutionary\" — the Terror as \"merely 1789 with a higher body count\" (Schama, *Citizens*, 1989; via Wikipedia → underlying text). [13] This thesis — that violence was constitutive of the Revolution rather than an aberration, the Terror latent in 1789 — revives a Carlyle-like horror at revolutionary bloodshed and a Furet-like claim that the violence was intrinsic, not contingent. Where Carlyle read the carnage as divine judgment and Furet read it as built into revolutionary discourse, Schama read it as the Revolution's own metabolic energy — three different idioms for the same refusal to treat the Terror as a regrettable detour.\n\n*Citizens* drew the predictable fire, and the lines of attack are exactly those leveled at Carlyle. The Marxist historian **Morris Slavin** charged that Schama lacked sympathy \"for the revolutionaries in the real circumstances of a profound social and political crisis\" and judged events \"from the standpoint of royalist elites\" (Slavin, via Wikipedia → review). [13] **Alex Callinicos** (a Marxist) and others attacked the very form: that narrative focused on \"particular people and incidents sidesteps the problems of perspectives and generalization\" — that \"you can't have a narrative and make an argument\" (Callinicos, marxists.org, 1989; NYRB exchange). [15][16] That last objection is the perennial anti-Carlyle objection in modern dress. Where these critics argued that narrative history of the Schama/Carlyle type cannot sustain a real argument and smuggles in an elite/royalist sympathy under cover of vividness, defenders such as Robert Forster countered that Schama \"desacralized the Revolution... by his inimitable style and wit\" [13][15][16]. The debate over *Citizens* is, almost line for line, a re-run of the nineteenth-century debate over Carlyle — which is why the comparison is so revealing.\n\n---\n\n## 5. Modern Assessment: The Consensus and Its Dissents\n\n### 5a. The settled professional verdict\n\nThe mainstream modern assessment is stable and can be stated cleanly: **unreliable as analysis, valuable as art and as evocation.** Carlyle's work was \"written in a vivid and often stylised way that resembled poetic fiction rather than historical narrative,\" and \"many academics savaged Carlyle's writing style, claiming that he had blended history with romantic literature\" — yet the book \"is still in print nearly 200 years after it was first published\" and is still read by students (alphahistory.com / cambridge.org). [1][17] That the work is unreliable as historical analysis but valuable as narrative art and as an enduring evocation of the Revolution's texture — and that it remains continuously in print and assigned to students nearly two centuries after publication [1][6][17] — is the summary judgment that holds across the field.\n\nThe standard methodological objections cluster into four:\n1. **Insufficiently empirical** — impressionistic, source-credulous, indifferent to the archival-critical standards professionalized after Ranke;\n2. **Hero-focused** — organized around individuals and moral agency rather than social structure;\n3. **Ignores structure and ideology** — no class analysis (the Marxist objection), no discourse analysis (the revisionist objection);\n4. **Prophetic, not probative** — built to deliver a moral warning and a providential reading rather than to test causal claims.\n\nA sympathetic but candid formulation, from the scholarship on his method, casts Carlyle \"as an artist dealing with reported fact, handling materials which 'however manifestly unreliable they themselves might be, always demanded some degree of accuracy and good faith'\" (PMLA, \"Carlyle's General Method in *The French Revolution*\"). [18] Even this sympathetic scholarship classifies Carlyle primarily as an artist working *upon* reported fact rather than as an empirical investigator — the charitable version of the consensus: not that Carlyle lied or invented, but that his fidelity was to the imaginative truth of the scene rather than to the analytical truth of the cause.\n\n### 5b. The recuperative dissent\n\nAgainst the \"great prose, bad history\" consensus runs a counter-current that takes the book's *thought* seriously. **Mark Allison's** \"The French Revolution Now; or, Carlyle's Eternal Return\" (*Victorian Literature and Culture*, 2022) argues for recuperating the work as \"a thoroughgoingly radical work\" whose insights into \"collective action, sympathy, and utopianism\" remain pertinent to contemporary crises of oligarchical capitalism (Allison, 2022). [7] On this reading the book is not merely an art-object but a formally innovative and theoretically serious work on sympathy, collectivity, and narrative, whose political diagnosis — the betrayal of the \"liberatory promise of Sansculottism\" by an emergent oligarchy — speaks directly to twenty-first-century politics. The revaluation is real but minority; it argues for the book's *ideas*, not its *accuracy*, and so does not overturn the empirical-unreliability consensus so much as relocate the conversation onto literary-theoretical and political-theory ground.\n\nAllison also names the elephant: Carlyle's later racist and authoritarian writings put him \"at risk of cancellation,\" and Allison's pragmatic answer is to \"take, with thanks, from so irregular a genius, what seems to us good... and leave the rest alone\" (Allison, 2022). [7] This reputational drag — the later *Latter-Day Pamphlets*, the \"Occasional Discourse on the Negro Question,\" the proto-authoritarian hero-worship — is the single largest non-literary force bearing on the book's twenty-first-century standing, and it is treated at length in the chapter on the trajectory of the work's reputation.\n\n### 5c. The frank working-historian verdict\n\nWhat does a working historian of the Revolution actually *get* from Carlyle now, and what would they never trust him for?\n\nWhat it offers is real. There is the *texture* and atmosphere of 1789–95 — the Bastille, the women's march on Versailles, the flight to Varennes, the September Massacres, the guillotine — rendered with a present-tense immediacy no analytical history matches, the famous set-pieces still quoted as evocations. There is a model of narrative history as a serious form, the lineage Schama revived and that the trade-history market still rewards. There is a document of how the Romantic age read the Revolution, since Carlyle is itself a primary source for nineteenth-century historical consciousness — Ben-Israel's whole premise [3]. And there is a moral seriousness about violence and the fragility of order that the revisionists (Furet) and Schama re-validated.\n\nWhat it cannot be trusted for is equally clear. Not causation and chronology-as-argument, where the providential/Sham framework is theology rather than explanation; not social and economic mechanism, of which there is essentially none; not a balanced ledger of the Terror, where the moral-judgment lens distorts proportion; not factual precision at the granular level, built as the book is on inferior sources (Thiers, the *Deux Amis*, memoir literature, the *Moniteur*) handled imaginatively; and not anything resembling the post-Ranke evidentiary standard the discipline now requires.\n\nThe defensible working-historian position, then, is to cite Carlyle for atmosphere, set-piece, and as a primary document of nineteenth-century historical imagination, while excluding him entirely from the evidentiary base for causal, social, ideological, or quantitative claims about the Revolution [1][6][18] — a synthesis of the consensus sources rather than a single attributable verdict, offered as the practical upshot.\n\n---\n\n## 6. Competing Assessments at Full Strength\n\nHere are the two strongest opposed positions, each stated at full strength in its own voice:\n\n**The dismissive case (the analytical-professional historian):** Carlyle is a magnificent writer and a negligible historian. His book has no theory of causation worth the name, no social analysis, no ideological analysis, no evidentiary rigor; it is built on second-rate sources handled like a novelist's raw material; its providential-moral frame is a category mistake imported from the pulpit; and its hero-worship is not merely wrong but pernicious, the seed of the authoritarian politics Carlyle later embraced. That it is still assigned says more about the seductiveness of prose than about its value as history. Michelet's own 1868 verdict — \"wretched... devoid of study\" — was right. [1]\n\n**The recuperative case (the literary-historiographical / political-theory reader):** The dismissal rests on an anachronism — judging an 1837 Romantic history by a post-Ranke empirical standard it never claimed. Hayden White showed that *all* history is emplotted; Carlyle simply did openly what others do covertly. [11] His narrative is not the absence of an argument but a different *kind* of argument — about sympathy, collectivity, and the moral meaning of violence — that Schama and Furet, in their different idioms, vindicated. [7][13] Read for what it is, *The French Revolution* is a radical and prescient diagnosis of how revolutionary promise curdles into oligarchy, and its prophetic horror at the Terror has aged better than the Marxist apologetics that long dominated the field. [7]\n\nBoth positions are strong, and these pages do not adjudicate between them. They disagree less about the facts (everyone agrees the book is empirically weak and rhetorically overwhelming) than about *what history is for* — and that is a values disagreement not resolvable by evidence.\n\n---\n\n## Open Questions\n\n1. **Did Michelet actually write \"a wretched work, devoid of study, full of false flights\" in 1868, and in what context?** The quotation circulates secondhand; it should be traced to a scholarly edition of Michelet's correspondence or journal before being treated as verified. (See §2.)\n2. **How does Carlyle's standing in *French* (as opposed to Anglophone) historiography read today?** The sources drawn on here are heavily Anglophone; a direct reading of how Furet's *Dictionnaire critique de la Révolution française* or recent French scholarship treats Carlyle (if at all) would correct the bias.\n3. **Is the Allison \"radical recuperation\" thesis (2022) gaining traction or an outlier?** Tracking whether it is cited and built upon would calibrate the recuperative current's real weight.\n4. **What exactly did Schama say about Carlyle in his own prefatory/acknowledgment matter in *Citizens*?** Reviews assert the debt; the primary text of Schama's preface was not directly consulted here and would strengthen the account of *Citizens* as a Carlylean revival (§4).\n5. **Where does Carlyle sit relative to Tocqueville's *L'Ancien Régime et la Révolution* (1856)** in the analytical-vs-narrative axis? Tocqueville is the great analytical near-contemporary and a natural third point of triangulation not developed here.\n6. **How do recent (2010s–2020s) French Revolution survey textbooks and bibliographies actually cite Carlyle** — as living source, as historiographical artifact, or not at all? A citation-pattern check would empirically test the \"still cited\" claim (5.1).\n\n---\n\n## Sources\n\n1. Alpha History, \"French Revolution historiography\" and \"Historian: Thomas Carlyle,\" alphahistory.com, accessed 2026-06-08. Educational survey relaying scholarly judgments and quotations including Thiers/Mignet context, Mazzini's critique, Michelet's 1868 dismissal, and Furet on Michelet.\n2. Alpha History, \"Historian: Thomas Carlyle,\" accessed 2026-06-08. Carlyle's rejection of Thiers; great-men (Mirabeau/Danton/Napoleon) framing.\n3. Hedva Ben-Israel, *English Historians on the French Revolution* (Cambridge University Press, 1968), via publisher/Google Books descriptions and AHR notice, accessed 2026-06-08. The standard scholarly survey treating nineteenth-century English Revolution-historians as a school, with a detailed chapter on Carlyle.\n4. Lionel Gossman, \"Jules Michelet and Romantic Historiography,\" in *European Writers* (Scribner), PDF via Open Book Publishers (openbookpublishers.com), accessed 2026-06-08. Definition of Romantic historiography; the French Romantic historians' scholarship-plus-art synthesis; Michelet's centrality.\n5. Lionel Gossman, \"Jules Michelet and Romantic Historiography,\" in *European Writers* (Scribner), via Open Book Publishers (openbookpublishers.com), accessed 2026-06-08. Same source as [4].\n6. Encyclopædia Britannica, \"The French Revolution by Carlyle,\" britannica.com, accessed 2026-06-08. Providential-judgment thesis; \"outstanding set pieces and character studies\"; Dickens influence; reputation.\n7. Mark Allison, \"The French Revolution Now; or, Carlyle's Eternal Return,\" *Victorian Literature and Culture* (Cambridge University Press), 2022, cambridge.org, accessed 2026-06-08. The recuperative thesis; crowd-as-hero reading; the \"at risk of cancellation\" reputational point; Sansculottism betrayed.\n8. The Victorian Web, victorianweb.org (Carlyle and Michelet pages), accessed 2026-06-08. Victorian comparative reception (\"picturesquely accurate\").\n9. marxists.org / Alpha History on the social-Marxist school (Mathiez, Lefebvre, Soboul), accessed 2026-06-08. Used to characterize the social interpretation's content.\n10. François Furet, *Penser la Révolution française* (1978) / *Interpreting the French Revolution*, via Project MUSE review and alphahistory.com, accessed 2026-06-08. Discourse-centered revisionism; Terror \"built in.\"\n11. Hayden White, *Metahistory: The Historical Imagination in Nineteenth-Century Europe* (Johns Hopkins University Press, 1973), accessed 2026-06-08. Tropological theory of historical narrative licensing the \"Romantic emplotment\" reading of Carlyle.\n12. John Clive, *Not by Fact Alone: Essays on the Writing and Reading of History* (1989), accessed 2026-06-08. Carlyle as prophet-not-historian; warning-vs-epic-poem reception gap.\n13. \"Citizens: A Chronicle of the French Revolution,\" reviews and reception (incl. Schama's violence thesis, Slavin and Forster reviews) via en.wikipedia.org → underlying reviews and the text of *Citizens* (Simon Schama, Knopf, 1989), accessed 2026-06-08. Narrative revival; Terror-as-energy thesis; critical reception.\n14. Alpha History, \"French Revolution historian: Simon Schama,\" accessed 2026-06-08. *Citizens* as return to Carlyle/Michelet-style narrative, \"light on theory.\"\n15. Alex Callinicos, \"Revising the revolution,\" *Socialist Worker Review* (1989), marxists.org, accessed 2026-06-08. The \"you can't have a narrative and make an argument\" objection; Schama's revisionist debts.\n16. Simon Schama and Norman Hampson, \"'The Two French Revolutions': An Exchange,\" *The New York Review of Books*, 1989-05-18, nybooks.com, accessed 2026-06-08. Narrative-vs-analysis debate around *Citizens*.\n17. \"Carlyle's General Method in *The French Revolution*,\" *PMLA* (Cambridge Core) and \"The French Revolution Now\" (Cambridge), accessed 2026-06-08. \"Still in print nearly 200 years\"; academics \"savaged\" the style; artist-on-reported-fact framing.\n18. PMLA, \"Carlyle's General Method in *The French Revolution*,\" cambridge.org, accessed 2026-06-08. Carlyle as artist demanding \"some degree of accuracy and good faith\" of unreliable materials.\n\n---\n\n*Anglophone source-bias acknowledged (see Open Question 2); several quotations (Michelet 1868, Mazzini) reach these pages secondhand and would benefit from corroboration against the primary texts.*"}, {"order": 8, "file": "08_Trajectory_Of_Reputation.md", "title": "Trajectory of the Work's Reputation and Use", "summary": "", "body": "# Trajectory of the Work's Reputation and Use\n\n## Bottom Line\n\nCarlyle's *The French Revolution: A History* (1837) enters the late 2020s in a paradoxical position. On one side, Carlyle the **man and prophet** has suffered one of the sharpest reputational collapses of any major Victorian: his later reactionary writings — the *Latter-Day Pamphlets* (1850), the \"Occasional Discourse on the Negro Question\" (1849/1853), and his leadership of the Governor Eyre Defence Fund (1865–66) — together with the twentieth-century \"proto-fascist\" charge (Ernst Cassirer's *The Myth of the State*, 1946, naming Carlyle \"the father of the modern myth of the hero\"), pushed him from the commanding height of Victorian sage to a figure \"little read today\" outside specialist circles. On the other side, *The French Revolution* itself has been **partly insulated** from that collapse: it is the early, radical, pre-reactionary masterpiece, it remains continuously in print across at least three trade editions (Oxford World's Classics, Modern Library, and others), it received its **first comprehensive scholarly edition only in 2019** (the Oxford four-editor critical text), and it is the object of an active, if small, twenty-first-century scholarly reassessment (e.g., Mark Allison's 2022 \"The French Revolution Now\" in *Victorian Literature and Culture*) that explicitly proposes \"selectively appropriating\" the early work while bracketing the late. The two strongest **tailwinds** are the durable popularity of vivid narrative history (the lineage running through Simon Schama's *Citizens*, 1989, which self-consciously revived \"the epic narratives employed by historians like Carlyle\") and the recent scholarly-edition infrastructure (Oxford 2019; the open-access *Carlyle Letters Online*; free Project Gutenberg text). The strongest **headwinds** are the secular decline of \"great man\" historiography and of biography-centered history in the academy, the reputational drag of Carlyle's racism and authoritarianism in a period acutely attentive to both, and the work's sheer stylistic difficulty (\"Carlylese\") for non-specialist readers. The realistic forecast space through 2040 is one of **stable niche survival** — a perennial in-print classic and a teachable specimen in Victorian-studies and history-of-historiography contexts — rather than either canonical revival or disappearance.\n\n---\n\n## 1. The Carlyle Reputational Problem and How It Bears on *The French Revolution*\n\n### 1.1 The shape of the collapse\n\nThe single most important driver of the work's future standing is not the work but its author. Carlyle's nineteenth-century reputation was immense — by mid-century he was, with Ruskin, one of the two reigning \"sages\" of Victorian Britain, and *The French Revolution* (1837) was the book that made him famous and financially solvent (as the chapter on the book's composition describes). That standing then underwent a long twentieth-century collapse driven overwhelmingly by his **later** writings and public positions, not by the History.\n\nThe proximate causes followed in rough chronological order of the offense. First came the **\"Occasional Discourse on the Negro Question\"** (Fraser's Magazine, December 1849; revised and reissued in 1853 as a pamphlet under a cruder racial slur in the title), which mocked the abolitionist movement and effectively argued for the coerced labor of formerly enslaved people in the West Indies — a piece that \"met with widespread disapproval, and in the minds of many people, Carlyle's reputation was forever tarnished\" [1]. Next came the ***Latter-Day Pamphlets*** (1850), a splenetic assault on democracy, philanthropy, and parliamentary government that alienated much of his liberal readership. Then came his leadership of the **Eyre Defence and Aid Fund** (1865–66), defending Governor Edward John Eyre's violent suppression of the Morant Bay rebellion in Jamaica, which split the Victorian intelligentsia: Carlyle, Tennyson, Dickens, and Ruskin defended Eyre, while the Jamaica Committee — J. S. Mill, Darwin, Herbert Spencer, and others — sought his prosecution [2].\n\nThese positions, **and then a second wave of damage after the World Wars**, drove the collapse. As the standard summary puts it: \"Carlyle's reputation further declined in the aftermaths of the First World War and the Second World War, when his philosophy was seen as a precursor of both Prussianism and fascism\" [1]. The result by the later twentieth century: Carlyle is \"rarely read by nonspecialists and only occasionally appears on reading lists within the academy\" [3], though \"growing scholarship in the field of Carlyle studies since the 1950s has improved his standing\" [1].\n\n### 1.2 The \"proto-fascist\" charge — and its key qualification\n\nThe intellectual core of the twentieth-century indictment is the link from Carlyle's **hero-worship** (codified in *On Heroes, Hero-Worship, and the Heroic in History*, 1841 — a separate, later work from the History) to twentieth-century fascism. The locus classicus is **Ernst Cassirer's *The Myth of the State*** (Yale University Press, 1946, published posthumously) [4]. Cassirer traces the intellectual genealogy of the Nazi state not to \"the barracks and beer cellars of Munich and Vienna\" but to Machiavelli, Hegel, Carlyle, and Gobineau, and he names Carlyle as \"the father of the modern myth of the hero\" (with Gobineau \"the father of the modern myth of race\") [4][5].\n\n**The load-bearing qualification, frequently lost in the secondary repetition:** Cassirer explicitly declines to hold Carlyle responsible for the uses later made of hero-worship. In the primary text he writes that \"to charge Carlyle with all the consequences that have been drawn from his theory would be against all the rules of historical objectivity,\" and he stresses that the transformation of \"old ideas\" into \"strong political weapons\" came later, \"accommodated to the understanding of a different audience\" [5][6]. In other words, the single most-cited authority for the \"Carlyle → fascism\" line is himself **a qualified, not a wholesale, accuser**. The point matters: the strongest version of the indictment is more cautious than its popular echo.\n\nThe German fascist **appropriation** was nonetheless real and is documented: National Socialist academics did invoke *Heroes and Hero-Worship* to justify the *Führerprinzip*, with Theodor Jost writing in 1935 that \"Carlyle established, in fact, the mission of the Führer historically and philosophically\" [3]. Hitler is also reported to have taken solace in Carlyle's *Frederick the Great* in the bunker (a biographical anecdote that recurs in the literature, best treated as a much-repeated claim rather than a primary-sourced fact).\n\n### 1.3 The defenders: separating the early prophet from the late reactionary\n\nAgainst the indictment stands a defensive tradition that does one of two things — either it **separates** the early radical Carlyle from the late reactionary, or it **denies the split** and reads him as coherent but not fascist.\n\nThe \"two Carlyles\" defense is the one most directly relevant to *The French Revolution*, because it locates the masterpiece on the safe side of the line. Mark Allison's \"The French Revolution Now; or, Carlyle's Eternal Return\" (*Victorian Literature and Culture* 50.1, 2022) is the cleanest recent statement: he acknowledges \"Carlyle's damaged reputation due to his later racist and authoritarian writings\" but proposes \"selectively appropriating\" the early work, positioning *The French Revolution* as \"a thoroughgoingly radical work\" and \"the author's masterpiece — distinct from his problematic later output\" [7]. The \"coherent but not fascist\" defense, by contrast, rejects the biographical split: Noel Annan, reviewing Philip Rosenberg in *The New York Review of Books* (1974), rejects the \"schizophrenic reading\" by which Carlyle \"went wrong\" after 1848, insisting his \"late Caesarism grew inevitably from his earlier radical critique,\" rooted in a consistent Calvinist framework — troubling, but not reducible to proto-fascism [8], while G. B. Tennyson and others have argued that Carlyle's anti-modernism and anti-egoism actually \"disqualify him from association with twentieth-century totalitarianism\" [3]. And Cassirer himself, as noted (§1.2), \"rejected the notion of Carlyle as proto-fascist… emphasizing the moral underpinning of his thought\" in the very text most cited against him [3].\n\n**Net assessment:** The two-Carlyles framing is the mechanism by which *The French Revolution* is partly insulated from its author's collapse. It is a live, respectable scholarly move, but it is contested (Annan's coherentist reading cuts against it), and it does not fully neutralize the drag: a reader or syllabus-setter who rejects Carlyle wholesale rejects the History too. The drag is real but **partial and decreasing among specialists, persistent among generalists.**\n\n---\n\n## 2. Status of the Book Itself: In Print, Editions, Digital Availability\n\nThe work's material availability is a concrete, documentable driver — books that fall out of print fall out of memory. On this axis *The French Revolution* is in strong shape.\n\n### 2.1 Trade editions in print\n\n- **Oxford World's Classics** — the long-standing accessible edition (originally ed. K. J. Fielding and David Sorensen, 1989), now superseded by a 2019 OWC edition (ISBN 9780198815594) edited by David R. Sorensen, Brent E. Kinser, and Mark Engel, also available as a Kindle e-book [9][10].\n- **Modern Library Classics** — *The French Revolution: A History* (ISBN 9780375760228), edited and introduced by John D. Rosenberg, published 2002, distributed by Penguin Random House; listed as in print at $18.95 as of early 2026, and available as an e-book [11][12].\n- Numerous **public-domain reprints** (the text entered the public domain long ago), of varying quality, keep cheap copies perpetually available.\n\n**A correction worth noting:** some secondary references assume a **Penguin Classics** edition of *The French Revolution*, but a current Penguin **Classics**-imprint edition cannot be confirmed (the Modern Library edition is the Penguin Random House–distributed trade scholarly paperback). The substantive point — multiple competing in-print trade editions — stands regardless.\n\n### 2.2 The scholarly edition: the 2019 Oxford critical text\n\nThe signal event of the last decade is the appearance of the **first comprehensive scholarly edition** of the work, **183 years after publication**:\n\n> *Thomas Carlyle: The French Revolution: A History*, edited by Mark Cumming, David R. Sorensen, Mark Engel, and Brent E. Kinser (Oxford University Press, hardcover, ISBN 9780198809159, published 2019).\n\nThe publisher states plainly: \"This is the first time that Thomas Carlyle's remarkable *The French Revolution: A History* has been published in a comprehensive scholarly form\" [13]. The edition presents a critical text close to the 1837 first edition with a full record of Carlyle's later emendations, plus \"literary, textual, historical, and photographic\" apparatus, with the introduction tracing Carlyle's allusions \"to Homer, Virgil, Shakespeare, Milton, and the Bible\" [13]. The OWC paperback (9780198815594, 2019) carries a reduced version of this apparatus to the general reader [9].\n\n**Why this matters:** a first critical edition is a leading indicator of scholarly seriousness and a precondition for sustained teaching and citation. It arrives late but it arrives, and it gives the work a stable scholarly anchor for the 2020s–2040s.\n\n### 2.3 The California \"Strouse Edition\" — what it does and does not include\n\nThe **Norman and Charlotte Strouse Edition of the Writings of Thomas Carlyle** (University of California Press), the major ongoing scholarly edition of Carlyle's works, is a second piece of infrastructure — but with a **specific and telling gap**. Its published and forthcoming volumes are:\n\n- *On Heroes, Hero-Worship, and the Heroic in History* (1993)\n- *Sartor Resartus* (2000)\n- *Historical Essays* (2002/2003)\n- *Past and Present* (2006)\n- *Essays on Literature* (2020)\n- *Essays on Politics and Society* (2022)\n- *Essays on German Literature and Culture*, Parts I & II (2024)\n- *Latter-Day Pamphlets*, Parts I & II (scheduled 2026) [14][15]\n\nThere is **no dedicated Strouse volume for *The French Revolution*** [14]. The standalone scholarly home of the History is therefore the Oxford 2019 edition (§2.2), not California. This is worth noting because it means the work's scholarly-edition base, while real, is **single-edition and recent** rather than redundantly supported. (Carlyle's *Historical Essays* in the Strouse edition does include his shorter essays touching the Revolution, but not the three-volume *History*.)\n\n### 2.4 Digital availability\n\n- **Project Gutenberg** carries the full three-volume text free (ebook #1301), maximizing casual access [16].\n- The ***Carlyle Letters Online*** (CLO), a Duke University Press / Western Carolina University project based on the Duke-Edinburgh *Collected Letters of Thomas and Jane Welsh Carlyle*, has been **open access since its 2006 debut**; the print edition reached its final volume, with a further CLO-only volume of undated/late-found letters planned for 2024. The CLO encodes the first 30-plus volumes of correspondence [17][18]. This is not the *History* itself, but it is the primary-source substrate (including the famous Mill-burning correspondence) that keeps Carlyle scholarship tractable and digitally native.\n\n**Net assessment:** On availability, the work is well-positioned for 2040 — continuously in print, freshly edited (2019), and fully digitized free, with a strong open-access correspondence apparatus. Availability is a tailwind, not a risk.\n\n---\n\n## 3. The Narrative-History Market: Tailwind and Headwind\n\n### 3.1 Tailwind — the durable appetite for vivid narrative history\n\n*The French Revolution* is the **ur-text of vivid, present-tense, scene-painting narrative history** (discussed in the chapter on Carlyle's style). The genre it founded never died and periodically surges. The clearest modern instance is **Simon Schama's *Citizens: A Chronicle of the French Revolution*** (Knopf, 1989, published for the bicentenary), which \"returns to the epic narratives employed by historians like Carlyle, focusing on people and events\" and is repeatedly described as emulating \"the great 19th-century narratives\" [19]. Schama's commercial and critical success — a 900-page narrative history that \"appeals both to the mass market and the specialist\" — demonstrates a standing market for exactly the mode Carlyle pioneered.\n\nThe broader publishing fact: popular narrative history (Antony Beevor, Simon Sebag Montefiore, Stacy Schiff, Hilary Mantel's adjacent historical fiction, the entire \"big narrative history\" category) remains commercially robust into the 2020s. To the extent readers keep wanting history that reads like literature, Carlyle remains the named ancestor and an object of periodic rediscovery. This is a genuine tailwind for the *book's cultural memory*, even if not for casual readership of the difficult original.\n\n### 3.2 Headwind — academic professionalization and the structural turn\n\nAgainst the popular tailwind runs the academic headwind. Professional historiography of the French Revolution moved decisively, across the twentieth century, **away from** the romantic-narrative, individual-centered mode Carlyle exemplifies and **toward** social-structural, quantitative, cultural, and \"history from below\" approaches (the chapter on the work's place in the historiography maps the full arc: Romantic → Whig → Marxist/social → Furet-led revisionist → cultural/linguistic → recent emotions/intellectual turns). Carlyle's *History* is, by professional standards, **not a source historians cite for facts** — it is studied as literature, as a document of nineteenth-century thought, or as a specimen in the history of history-writing, not as current scholarship.\n\nRecent major Revolution histories illustrate the displacement: Timothy Tackett's *The Coming of the Terror in the French Revolution* (Harvard, 2015) works through the \"new history of emotions\"; Jonathan Israel's *Revolutionary Ideas* (2014) through intellectual history; Haim Burstin's *Révolutionnaires* through micro-history of participation [20]. Carlyle is, at most, a venerable forebear acknowledged in a historiographical preface — not an interlocutor on the facts.\n\n**Net assessment:** The narrative-history market is a **bifurcated** driver. It sustains the work's cultural prestige and trade viability (tailwind) while the academy continues to use it only as object-of-study, not as authority (headwind). The two are not in contradiction; they describe the work's settled dual identity — a **literary classic about history** rather than a history that practitioners trust. This dual identity is itself stable and is the most likely 2040 equilibrium.\n\n---\n\n## 4. The \"Great Man\" Theory Debate and Its Trajectory\n\nBecause Carlyle is, fairly or not, the **named popularizer of the \"great man\" theory of history** (via *Heroes*, 1841), the fortunes of that debate are a second-order driver of his — and thus partly the *History*'s — standing. The mechanism: when \"great man\" framing is fashionable, Carlyle is cited (often pejoratively, sometimes approvingly) and stays in circulation; when it is in disrepute, he is the convenient straw man.\n\nThe documented arc:\n\n- The great-man approach \"was most fashionable with professional historians in the 19th century\" and was popularized by Carlyle's 1840 lectures [21].\n- It \"faced significant criticism by the mid-20th century,\" from Herbert Spencer onward, who argued that societal factors, not innate traits, produce great individuals; the rise of social history and \"history from below\" displaced it [21].\n- David R. Sorensen (one of the Oxford editors) \"notes the modern decline in support for Carlyle's theory in particular but also for 'heroic distinction' in general\" [21].\n- **Contemporary status:** the debate is unresolved and shows some agency-centric revival. Recent commentary argues that \"individual agency\" has \"gained traction amid critiques of overreliance on structural explanations,\" with analysts crediting singular figures' interventions for recent political upheavals [21]. There is a small popular-intellectual \"in defence of the great man theory\" current (e.g., heterodox essays) running against the academic consensus.\n\n**What this means for the work's future:** The \"great man\" debate is unlikely to resolve by 2040; it oscillates. A period of personalized politics (charismatic strongmen, founder-worship in tech) tends to **revive interest in Carlyle as diagnostic ancestor** — but this cuts both ways for *The French Revolution* specifically, because the *History* is in fact the work where Carlyle most undercuts the great-man thesis (it is the **crowd**, sansculottism, and impersonal Necessity that drive his Revolution, not heroes — as the chapter on his argument shows). A sophisticated revival could thus rehabilitate the *History* as the \"good Carlyle\" who saw mass forces; a crude revival merely re-tars him. The direction depends on whether the revival is scholarly or polemical.\n\n---\n\n## 5. Signals to Watch (Leading Indicators)\n\nThese are the concrete, trackable signals that should shape any view of the work's standing between now and 2040.\n\n### 5.1 New critical editions and apparatus\n- **Achieved:** Oxford comprehensive scholarly edition (2019) [13]; OWC paperback refresh (2019) [9]; *Carlyle Letters Online* open access and effectively complete [17][18].\n- **Watch:** whether a Strouse (California) volume for *The French Revolution* is ever commissioned (none to date) [14]; whether the Oxford critical text is reprinted / goes to paperback scholarly format; emergence of a digital scholarly edition with full allusion-apparatus (the 2019 edition's strength).\n\n### 5.2 Citations in major new Revolution histories\n- **Watch:** whether the next generation of big Revolution narratives (successors to Schama, Tackett, Israel) engage Carlyle substantively in their historiographical framing, or merely name him. A serious chapter-length engagement in a widely read new history would be a strong positive signal; continued one-line acknowledgment is the neutral base case.\n\n### 5.3 Presence on syllabi\n- **Current picture (low-resolution):** the work \"only occasionally appears on reading lists within the academy\" [3] and is taught mainly in **Victorian literature / history-of-historiography** contexts rather than in French Revolution history courses. I did not find quantitative syllabus data; this is a known gap (see Open Questions).\n- **Watch:** whether the 2019 critical edition drives renewed teaching; whether Carlyle survives canon-revision pressures in English departments given his racism.\n\n### 5.4 The \"great man\" debate trajectory\n- **Watch:** scholarly vs. polemical character of any revival (§4); whether new work distinguishes the crowd-driven *History* from the hero-driven *Heroes*.\n\n### 5.5 New biographies and scholarly reassessments of Carlyle\n- **Existing base:** Fred Kaplan, *Thomas Carlyle: A Biography* (Cornell UP, 1983 — Pulitzer and NBCC finalist, long treated as definitive) [22]; Simon Heffer, *Moral Desperado: A Life of Thomas Carlyle* (Weidenfeld & Nicolson, 1995 — a rehabilitative-leaning popular biography that nonetheless leaves Carlyle \"as much of a moral desperado as he was in his Victorian context\") [23].\n- **Watch:** any major new biography (none signaled as imminent in 2026). A serious, widely reviewed new *Life* would be a strong reputational event either way; a generation has passed since Kaplan/Heffer, so one is plausible within the horizon.\n- **Scholarly-reassessment current:** Allison's 2022 essay [7], the Cambridge *Works of Thomas Carlyle* scholarly apparatus, the *Carlyle Studies Annual*, and the Strouse Edition program collectively keep a small but persistent academic engine running [7][14][24].\n\n---\n\n## 6. Synthesis: The Drivers Arrayed\n\n| Driver | Direction | Strength | Mechanism | Status |\n|---|---|---|---|---|\n| Carlyle's racism / authoritarianism | Headwind | Strong | Wholesale rejection drags the early work with the late | Documented, persistent [1][2] |\n| \"Proto-fascist\" charge | Headwind | Medium (qualified) | Hero-worship → fascism genealogy; but key authority (Cassirer) disclaims responsibility | Documented + qualified [4][5][6] |\n| \"Two Carlyles\" insulation | Tailwind | Medium | Locates the *History* as the pre-reactionary masterpiece | Live, contested [7][8] |\n| In-print / digital availability | Tailwind | Strong | Multiple trade editions + free Gutenberg keep access frictionless | Documented [9][11][16] |\n| 2019 scholarly edition | Tailwind | Medium-strong | First critical text anchors teaching/citation for the horizon | Documented [13] |\n| Narrative-history market | Tailwind (cultural) | Medium | Schama-lineage keeps Carlyle the named ancestor | Documented [19] |\n| Academic structural turn | Headwind | Strong | Profession uses the work as object-of-study, not authority | Documented [20] |\n| \"Great man\" debate oscillation | Ambiguous | Medium | Personalized-politics eras revive interest, polarity uncertain | Documented + inference [21] |\n| New biographies / reassessment | Ambiguous | Medium | Could re-litigate reputation either way; small engine already running | Base exists [7][22][23][24] |\n\n**The equilibrium these point to:** *The French Revolution* is most likely to occupy, through 2040, the status of a **durable literary classic about history** — perennially in print, freshly edited, free online, taught in a niche, named as the ancestor of narrative history, and read whole by relatively few. It is neither a candidate for canonical revival to general readership (the style barrier and the author's reputation both cut against that) nor a candidate for disappearance (the availability and scholarly-edition infrastructure both cut against that). The single biggest swing factor is **how hard the academy and educated public press the racism/authoritarianism question** — i.e., whether the \"two Carlyles\" insulation holds or collapses — and the secondary swing factor is whether a **major new biography or a serious new narrative history** re-centers him within the horizon.\n\n---\n\n## Open Questions\n\n1. **Syllabus data.** I could not find quantitative or systematic evidence of *The French Revolution*'s actual presence on university syllabi (English, history, or historiography). The \"only occasionally on reading lists\" claim [3] is impressionistic. A real audit (Open Syllabus Project or equivalent) would sharpen the teaching-presence signal materially.\n2. **Penguin Classics edition.** Does a current **Penguin Classics**-imprint edition of *The French Revolution* actually exist, distinct from the Penguin Random House–distributed Modern Library edition? It is often assumed to, but cannot be confirmed; a direct catalog check is needed.\n3. **Sales / readership figures.** No data found on actual print runs, sales, or library-circulation figures for any edition. \"In print\" is documented; \"read\" is not quantified.\n4. **The Hitler/Frederick anecdote.** The claim that Hitler took comfort in Carlyle's *Frederick the Great* in the bunker is widely repeated but not firmly primary-sourced; it should be treated with caution, given its rhetorical weight in the proto-fascism narrative.\n5. **Whether a Strouse FR volume is planned.** California's edition conspicuously lacks a *French Revolution* volume [14]. Is one commissioned or deliberately ceded to Oxford? This affects the redundancy of the scholarly-edition base.\n6. **Generational reception.** Is there any evidence (reviews, reading-group data, BookTok/Goodreads activity) of how younger 2020s readers encounter the work, if at all? The narrative-history tailwind assumes a transmission mechanism that is unverified for this specific, difficult text.\n7. **Direction of a \"great man\" revival.** Whether the agency-centric revival in 2020s commentary [21] is scholarly (which could rehabilitate the crowd-driven *History*) or polemical (which merely re-tars Carlyle) is genuinely uncertain and consequential for the work's future.\n\n---\n\n## Sources\n\n1. \"Thomas Carlyle,\" Wikipedia (used here only as a navigation pointer to its cited sources; substantive claims traced to the underlying record). Summarizes the post-WWI/WWII Prussianism/fascism reputational decline and the post-1950s recovery in Carlyle studies. Accessed 2026-06-08. *Tier 7 as cited; claims corroborated against Tiers 4–5 below.* https://en.wikipedia.org/wiki/Thomas_Carlyle\n2. \"When Intellectuals Split: The Eyre Case,\" JSTOR Daily; and Sarah Winter, \"On the Morant Bay Rebellio
