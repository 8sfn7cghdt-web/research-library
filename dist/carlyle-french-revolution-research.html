edu/ ; https://carlyleletters.dukeupress.edu/about-project\n18. \"Open Access: The Carlyle Letters Online,\" Duke University Press News (2017). Confirms continued open-access status. Accessed 2026-06-08. *Tier 5 (publisher news / Tier 1 for the access fact).* https://dukeupress.wordpress.com/2017/03/07/open-access-the-carlyle-letters-online/\n19. Simon Schama, *Citizens: A Chronicle of the French Revolution* (Knopf, 1989), with reference summaries describing it as reviving \"the epic narratives employed by historians like Carlyle.\" Accessed 2026-06-08. *Tier 1 (the book) + Tier 5 (reviews/summaries).* https://en.wikipedia.org/wiki/Citizens:_A_Chronicle_of_the_French_Revolution ; https://alphahistory.com/frenchrevolution/historian-simon-schama/\n20. \"Never the Same Again: On Some Recent Interpretations of the French Revolution,\" *Annales: Histoire, Sciences Sociales* (English ed.), Cambridge Core — on Tackett (*The Coming of the Terror*, 2015), Israel (*Revolutionary Ideas*, 2014), and Burstin (*Révolutionnaires*); evidence of the structural/emotions/intellectual turns that displace Carlylean narrative as authority. Accessed 2026-06-08. *Tier 2 (peer-reviewed).* https://www.cambridge.org/core/journals/annales-histoire-sciences-sociales-english-edition/article/never-the-same-again-on-some-recent-interpretations-of-the-french-revolution/BD4ED305B36CB90A45D20BB95192A8B1\n21. \"Great man theory\" — overview sources including EBSCO Research Starters, ScienceDirect Topics, and a heterodox \"In defence of the Great Man Theory\" essay (The Common Reader); includes David R. Sorensen's note on the modern decline of Carlyle's theory and of \"heroic distinction.\" Accessed 2026-06-08. *Tiers 2–6 mixed; the Sorensen attribution and the agency-revival framing noted as such.* https://www.ebsco.com/research-starters/religion-and-philosophy/great-man-theory ; https://www.commonreader.co.uk/p/in-defence-of-the-great-man-theory\n22. Fred Kaplan, *Thomas Carlyle: A Biography* (Cornell University Press, 1983) — Pulitzer Prize and National Book Critics Circle Award finalist; long the standard scholarly biography. Accessed 2026-06-08. *Tier 2 (university-press biography).* https://www.fredkaplanbiographer.com/thomas-carlyle-a-biography.html\n23. Simon Heffer, *Moral Desperado: A Life of Thomas Carlyle* (Weidenfeld & Nicolson, 1995); title from Mill's \"moral desperado\" characterization; a rehabilitative-leaning popular biography. Accessed 2026-06-08. *Tier 4/5 (trade biography by a journalist; note Heffer's conservative lean).* https://www.publishersweekly.com/9780297815648\n24. \"The Voracious Pen of Thomas Carlyle,\" National Endowment for the Humanities (Humanities magazine, March/April 2009); and *The Works of Thomas Carlyle* (Cambridge UP) — evidence of the active scholarly apparatus (editions, *Carlyle Studies Annual*) and the \"innovator and survivor\" reassessment framing. Accessed 2026-06-08. *Tier 5 (NEH) / Tier 1–2 (Cambridge edition).* https://www.neh.gov/humanities/2009/marchapril/feature/the-voracious-pen-thomas-carlyle ; https://www.cambridge.org/core/books/works-of-thomas-carlyle/A8D1754BD2126B985D8F21F26FCCBB81"}, {"order": 9, "file": "Future_Trajectory.md", "title": "Future Trajectory: Reputation and Use through ~2040", "summary": "", "body": "# Future Trajectory: The Reputation and Use of Carlyle's *The French Revolution* through ~2040\n\n> **Bottom line.** The most probable future for *The French Revolution: A History* is not revival and not disappearance but **stable niche survival** — a perennially in-print literary classic *about* history, freshly anchored by its first comprehensive scholarly edition (Oxford, 2019), free online forever, named as the ancestor of vivid narrative history, taught in a small Victorian-studies / history-of-historiography niche, and read whole by relatively few. The single largest swing factor is whether the \"two Carlyles\" insulation — which quarantines the early radical masterpiece from the author's late racism and authoritarianism — holds or collapses under canon-revision pressure. The secondary swing factor is whether a major new biography or a serious new narrative history of the Revolution re-centers Carlyle within the horizon.\n\nWhat follows builds calibrated, scenario-based forecasts from the drivers traced in the preceding chapter on the work's reputation. The aim is forecasting, not predicting: a useful probability distribution over plausible futures, with the conditions that would shift weight between them — not a single called outcome. Probabilities are ranges; they express calibrated uncertainty, not precision. The scenario weighting below is one disciplined reading of the driver evidence, and the probability bands are best treated as indicative.\n\n---\n\n## The Drivers, Arrayed\n\nThe forecast rests on nine drivers, established and sourced in the chapter on the work's reputation. In compressed form:\n\n| Driver | Direction | Strength |\n|---|---|---|\n| Carlyle's racism / authoritarianism (the late writings) | Headwind | Strong |\n| The \"proto-fascist\" charge (hero-worship → fascism) | Headwind | Medium, *qualified* |\n| The \"two Carlyles\" insulation (early radical vs. late reactionary) | Tailwind | Medium, *contested* |\n| In-print + free-digital availability | Tailwind | Strong |\n| The 2019 Oxford scholarly edition | Tailwind | Medium-strong |\n| The narrative-history market (the Schama lineage) | Tailwind (cultural) | Medium |\n| The academic structural turn (history from below, quantitative, cultural) | Headwind | Strong |\n| The \"great man\" debate's oscillation | Ambiguous | Medium |\n| Prospect of a major new biography / narrative history | Ambiguous | Medium |\n\nTwo features of this array matter for the forecast. First, the headwinds and tailwinds do not cancel — they **bifurcate the work's identity**. The tailwinds (availability, the new edition, the narrative-history market) sustain the book as a *cultural and literary* object; the headwinds (the structural turn, the reputational drag) remove it from use as a *historical authority*. The result is not a contested middle but a settled dual identity: a literary classic that historians study rather than trust. Second, the strongest single force is **exogenous to the book** — it is the trajectory of Carlyle's *personal* reputation, driven by his post-1840s writings, that most threatens or protects the 1837 work.\n\nA key, frequently-lost nuance firms up the base case: the most-cited authority for the \"Carlyle → fascism\" genealogy, Ernst Cassirer's *The Myth of the State* (1946), is himself a *qualified* accuser. Cassirer names Carlyle \"the father of the modern myth of the hero\" but writes that \"to charge Carlyle with all the consequences that have been drawn from his theory would be against all the rules of historical objectivity.\" The strongest version of the indictment is more cautious than its popular echo — which is part of why total cancellation is a tail risk rather than the base case.\n\n---\n\n## Base Rates\n\nForecasting a 189-year-old book's next 14 years is mostly an exercise in base rates for cultural durability, because the dominant prior is inertia:\n\n- **Canonical-classic persistence.** Works that have stayed continuously in print for ~150+ years and have received a modern critical edition very rarely fall out of print within a subsequent two-decade window. The relevant base rate for \"in print in 2040 given continuously in print since the 19th century and a 2019 critical edition\" is high — well above 90%.\n- **Reputational volatility of the author vs. survival of the single masterwork.** Even authors who suffer severe reputational collapse (the relevant comparison class: Victorian sages whose politics aged badly) typically retain *one* insulated early masterwork in the teaching canon (the \"two X's\" move is common — e.g., the early vs. late split applied across many compromised figures). This supports the insulation tailwind as the modal path.\n- **Niche-text teaching persistence.** A text already taught \"only occasionally\" and mainly in adjacent fields (Victorian literature, history of historiography) rather than its nominal field (French Revolution history) has a *low-volatility* teaching footprint: there is not far to fall, and the niche audiences (sage-writing, narrative-history pedagogy, Carlyle studies) are self-sustaining.\n\nThe base rates push hard toward continuity. The scenarios below essentially distribute probability over *how* that continuity is inflected — recuperated, eroded, or merely sustained.\n\n---\n\n## Scenarios (through ~2040)\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 470\" role=\"img\" aria-label=\"A fan-forecast of the 1837 book&#8217;s reputation from 2026 to 2040. A single origin point at left opens into four stacked probability bands spreading rightward, each of differing thickness. The widest band, the base case, is Stable Niche Survival at 55 to 65 percent: in print, anchored by the 2019 Oxford critical edition, taught in a small durable niche, cited for texture and set-piece, never for cause. Two narrower bands of equal weight flank it: Scholarly Recuperation or Modest Revival at 15 to 22 percent rising, and Reputational Erosion or Cancellation Drag at 15 to 22 percent falling. A thin tail band, Popular Rediscovery at 3 to 6 percent, runs along the top. A note records that no liquid prediction markets exist for this question. The geometry shows the forecast bifurcating into a settled dual identity rather than a single trajectory.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"2.5\">A CLASSIC THEY STUDY, NOT TRUST<\/text>\n<text x=\"350\" y=\"48\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">the 1837 book&#8217;s reputation through ~2040<\/text>\n<line x1=\"120\" y1=\"92\" x2=\"120\" y2=\"404\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"120\" y1=\"404\" x2=\"660\" y2=\"404\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"120\" y=\"420\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\">2026<\/text>\n<text x=\"390\" y=\"420\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\">2033<\/text>\n<text x=\"660\" y=\"420\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\">2040<\/text>\n<text x=\"113\" y=\"96\" text-anchor=\"end\" font-size=\"8\" class=\"t-muted\" font-style=\"italic\">today&#8217;s<\/text>\n<text x=\"113\" y=\"106\" text-anchor=\"end\" font-size=\"8\" class=\"t-muted\" font-style=\"italic\">standing<\/text>\n<path d=\"M120,248 C 320,222 480,196 660,176 L 660,206 C 480,224 320,242 120,256 Z\" class=\"f-t3\" opacity=\".5\"/>\n<text x=\"664\" y=\"184\" text-anchor=\"start\" font-size=\"8.5\" class=\"t-acc\" font-style=\"italic\">3&#8211;6%<\/text>\n<text x=\"652\" y=\"196\" text-anchor=\"end\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--t3)\">Popular Rediscovery<\/text>\n<text x=\"652\" y=\"207\" text-anchor=\"end\" font-size=\"7.6\" class=\"t-muted\">the long-shot tail<\/text>\n<path d=\"M120,250 C 320,230 480,214 660,212 L 660,272 C 480,266 320,256 120,262 Z\" class=\"f-t4\" opacity=\".42\"/>\n<text x=\"664\" y=\"232\" text-anchor=\"start\" font-size=\"8.5\" style=\"fill:var(--t4)\">15&#8211;22%<\/text>\n<text x=\"652\" y=\"244\" text-anchor=\"end\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--t4)\">Scholarly Recuperation<\/text>\n<text x=\"652\" y=\"255\" text-anchor=\"end\" font-size=\"7.6\" class=\"t-muted\">modest revival &#183; rising &#8594;<\/text>\n<path d=\"M120,266 C 320,262 480,260 660,278 L 660,360 C 480,344 320,328 120,322 Z\" class=\"f-t1\" opacity=\".46\"/>\n<text x=\"664\" y=\"324\" text-anchor=\"start\" font-size=\"8.5\" class=\"t-acc\">15&#8211;22%<\/text>\n<text x=\"652\" y=\"338\" text-anchor=\"end\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-acc\">Reputational Erosion<\/text>\n<text x=\"652\" y=\"349\" text-anchor=\"end\" font-size=\"7.6\" class=\"t-muted\">cancellation drag &#183; falling &#8595;<\/text>\n<path d=\"M120,256 C 320,250 480,246 660,242 L 660,322 C 480,326 320,330 120,326 Z\" class=\"f-t2\" opacity=\".9\"/>\n<polygon points=\"150,278 156,266 162,278\" class=\"f-t3\"/>\n<ellipse cx=\"156\" cy=\"288\" rx=\"6\" ry=\"11\" class=\"f-t3\"/>\n<circle cx=\"156\" cy=\"282\" r=\"3.4\" class=\"f-t2\"/>\n<text x=\"186\" y=\"280\" text-anchor=\"start\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\" letter-spacing=\".5\">STABLE NICHE SURVIVAL<\/text>\n<text x=\"186\" y=\"293\" text-anchor=\"start\" font-size=\"8.4\" class=\"t-inv\" opacity=\".9\">in print &#183; anchored by the 2019 Oxford critical edition<\/text>\n<text x=\"186\" y=\"305\" text-anchor=\"start\" font-size=\"8.4\" class=\"t-inv\" opacity=\".9\">taught in a small durable niche &#183; cited for texture &amp; set-piece, never for cause<\/text>\n<text x=\"350\" y=\"288\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" class=\"t-inv\" letter-spacing=\"1.5\">55&#8211;65%<\/text>\n<text x=\"350\" y=\"316\" text-anchor=\"middle\" font-size=\"8.4\" class=\"t-inv\" opacity=\".85\" font-style=\"italic\">the base case &#8212; widest band<\/text>\n<circle cx=\"120\" cy=\"287\" r=\"4.5\" class=\"f-t1\"/>\n<circle cx=\"120\" cy=\"287\" r=\"9\" fill=\"none\" class=\"s-t1\" stroke-width=\"1\" opacity=\".5\"/>\n<text x=\"130\" y=\"384\" text-anchor=\"start\" font-size=\"8\" class=\"t-muted\" font-style=\"italic\">No liquid prediction markets exist for this question &#8212; bands are reasoned priors, not market-implied odds.<\/text>\n<text x=\"350\" y=\"448\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\" font-style=\"italic\">The headwinds and tailwinds do not cancel &#8212; they <tspan class=\"t-acc\">bifurcate<\/tspan> the work: a literary classic that historians study rather than trust.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 6.<\/strong> The forecast is not one trajectory but a settled dual identity: in better than half of futures (the 55&#8211;65% base case) the book survives in print &#8212; anchored by the 2019 Oxford critical edition and a small durable teaching niche &#8212; precisely as it is abandoned as a historical authority, cited for texture and set-piece but never for cause. The near-mirrored 15&#8211;22% bands for scholarly revival and cancellation drag, with only a 3&#8211;6% tail of popular rediscovery, show why the headwinds and tailwinds do not cancel but bifurcate: the work endures as a literary classic exactly to the degree it is dropped as fact.<\/figcaption>\n<\/figure>\n\n\n### Scenario 1 — Stable Niche Survival *(base case)*\n\n**Probability: 55–65%.** **Time horizon: through 2040.**\n\nThe work persists exactly as it now stands: continuously in print (Oxford World's Classics, Modern Library, public-domain reprints), free on Project Gutenberg, anchored by the 2019 Oxford critical edition, taught in a small but durable niche, and invoked as the named ancestor whenever narrative history is discussed. Carlyle's personal reputation neither recovers nor fully collapses; the \"two Carlyles\" framing holds well enough among specialists to keep the 1837 book on the safe side of the line, while generalist wariness keeps it off broad survey syllabi. Historians continue to cite it for *texture, set-piece, and as a primary document of nineteenth-century historical imagination* — never for cause, social mechanism, or a balanced ledger of the Terror.\n\n- **Drivers:** availability (strong tailwind) + the 2019 edition (anchor) + the settled dual identity (literary classic, not authority) + the low-volatility niche footprint. The headwinds are already priced in; they have done their work and reached equilibrium.\n- **Signals consistent with this path:** the Oxford critical text stays in print; one-line historiographical acknowledgments continue in new Revolution histories; *Carlyle Studies Annual* and the Strouse edition keep a small engine running; no major reputational event.\n- **What would move probability:** a major new biography or narrative history (toward Scenario 2 or 3, depending on tenor); an intensification of canon-revision pressure (toward Scenario 3).\n\n### Scenario 2 — Scholarly Recuperation / Modest Revival\n\n**Probability: 15–22%.** **Time horizon: 2030–2040.**\n\nThe minority recuperative current (Mark Allison's 2022 \"The French Revolution Now,\" and like-minded work) gathers force. The 2019 Oxford edition drives renewed teaching; a serious new narrative history or a widely-reviewed new *Life* of Carlyle re-centers the early radical, crowd-driven Carlyle as distinct from the late reactionary; and a period of personalized, charismatic politics makes the *History* newly legible — but in the *sophisticated* form that recognizes it is the **crowd**, Sansculottism, and impersonal Necessity, not the hero, that drive Carlyle's Revolution. The book is rehabilitated less as accurate history than as a prescient diagnosis of how revolutionary promise curdles into oligarchy (\"the Aristocracy of the Moneybag\") and of the moral meaning of political violence — themes that the Furet/Schama vindication of \"violence as constitutive\" already made respectable.\n\n- **Drivers:** the 2019 edition (precondition) + the recuperative scholarship + a sophisticated \"great man / agency\" revival + the durable narrative-history market.\n- **Signals:** chapter-length engagements with Carlyle in major new histories (not one-liners); a new biography that is taken seriously; the Allison thesis getting cited and built upon; the *History* migrating onto more syllabi as \"the good Carlyle.\"\n- **Risk to the scenario:** a *crude* (polemical rather than scholarly) great-man revival, which would re-tar Carlyle rather than rehabilitate the book — collapsing this path back toward Scenario 1 or into Scenario 3.\n\n### Scenario 3 — Reputational Erosion / Cancellation Drag\n\n**Probability: 15–22%.** **Time horizon: 2028–2040.**\n\nThe \"two Carlyles\" insulation fails. Under sustained canon-revision pressure in English and history departments — acutely attentive to the \"Occasional Discourse on the Negro Question,\" the Eyre affair, and the proto-fascist genealogy — the wholesale rejection of Carlyle drags the early work down with the late. The *History* is quietly dropped from the syllabi where it still appears; new narrative historians cease even the one-line acknowledgment; the book survives essentially as a free public-domain text and as an object of specialist study (now often framed as a case study in a compromised author), not as a living model. Note the asymmetry that bounds this scenario: the *material* base (in print, the 2019 edition, Gutenberg) does not disappear — books do not get un-printed — so \"erosion\" means loss of *status and teaching presence*, not literal unavailability.\n\n- **Drivers:** the racism/authoritarianism headwind (strong) + the structural turn + a hardening of canon politics + the contested, possibly-failing insulation.\n- **Signals:** the Annan-style \"coherentist\" reading (late Caesarism grew from the early radicalism — so no clean split) gaining ground over the \"two Carlyles\" reading; Carlyle dropped from Victorian survey courses; the 2019 edition not reprinted; reviews and reading-group framing foregrounding the author's racism over the book's art.\n- **What would arrest it:** the Cassirer-style qualification reasserting itself (the indictment is more careful than its echo); a strong new defense of the early work's radicalism.\n\n### Scenario 4 — Popular Rediscovery (general-readership revival)\n\n**Probability: 3–6%.** **Time horizon: through 2040.**\n\nA genuine broad-readership revival — the difficult original (not just its reputation) read widely outside the academy. This is the low-probability tail. Two structural barriers make it unlikely: the sheer stylistic difficulty of \"Carlylese\" for non-specialist twenty-first-century readers, and the reputational drag that discourages mainstream promotion. A catalyzing event (a prestige screen adaptation of the Revolution citing Carlyle, a breakout popular-history bestseller built explicitly on him, a viral cultural moment) could trigger it, but the transmission mechanism for *this specific, hard text* is weak even when the narrative-history *genre* thrives. The genre's popularity tends to send new readers to Schama, not to Carlyle.\n\n---\n\n## Prediction-Market Snapshot\n\nNo liquid prediction markets exist for the reputation or readership of a nineteenth-century history book; Polymarket, Kalshi, Manifold, and Metaculus carry nothing relevant. This is expected for a cultural-durability question on a long horizon and is not a gap in the research — there is simply no market to price. The forecast therefore rests on base rates and driver analysis alone, which is the appropriate method for slow-moving cultural-status questions.\n\n---\n\n## Forecast-Change Triggers (what would make me revise)\n\n- **A major new biography of Carlyle** (none signaled as imminent in 2026; a generation has passed since Kaplan 1983 / Heffer 1995, so one is plausible within the horizon). Tenor decides direction: sympathetic → Scenario 2; prosecutorial → Scenario 3.\n- **A landmark new narrative history of the Revolution** that engages Carlyle substantively (chapter-length, not a one-liner) → Scenario 2; one that pointedly ignores or repudiates him → Scenario 3.\n- **A commissioned Strouse (California) edition of *The French Revolution*** — currently conspicuously absent — would signal redundant scholarly investment and firm up the tailwind.\n- **Quantitative syllabus data** (e.g., Open Syllabus Project) showing the work *rising* or *falling* on reading lists — currently the single biggest evidentiary gap (the \"only occasionally taught\" claim is impressionistic).\n- **The resolution (or sharpening) of the \"great man\" debate** toward a sophisticated, agency-with-structure synthesis (helps the crowd-driven *History*) versus a crude strongman-worship revival (hurts it).\n- **A shift in the insulation consensus** — the Annan coherentist reading displacing the \"two Carlyles\" reading among specialists would be a leading indicator for Scenario 3.\n\n---\n\n## Open Questions\n\n1. Does a current **Penguin Classics** edition exist distinct from the Penguin-distributed Modern Library edition? (Affects the strength of the availability tailwind.)\n2. Is there any **generational-reception** evidence (Goodreads/BookTok/reading-group activity) for how 2020s readers actually encounter this difficult text? The narrative-history tailwind assumes a transmission mechanism unverified for *this* work.\n3. Will the academy's canon politics around compromised authors **harden or soften** over the horizon — the master variable behind Scenarios 2 vs. 3?\n\n## Sources\n\nThe factual base for this forecast is the chapter on the work's reputation, supplemented by the chapter on its historiographical place and modern assessment. Key load-bearing items include the 2019 Oxford critical edition, the in-print trade editions, Cassirer's qualified indictment (*The Myth of the State*, 1946), Schama's *Citizens* as the narrative-history revival, and Allison's 2022 recuperative essay (*Victorian Literature and Culture*). No prediction-market or quantitative-readership data was available; the forecast rests on base rates and driver analysis, and the scenario weighting is one disciplined reading of that evidence."}], "glossary": [{"term": "Annales school", "aliases": ["Annales", "Annales, Histoire, Sciences Sociales"], "def": "A twentieth-century French approach to history that favors long-run social, economic, and cultural patterns over the deeds of kings and great men, in contrast to the individual-and-moral-drama style of narrative history."}, {"term": "apostrophe", "aliases": ["apostrophize", "apostrophizes"], "def": "A writing technique in which the narrator directly addresses someone who cannot answer back — a dead person, an abstraction, or the reader — as if they were present, used for dramatic or emotional effect."}, {"term": "berline", "aliases": [], "def": "A heavy, enclosed four-wheeled carriage of the kind the French royal family used in their failed 1791 escape attempt to Varennes, later read by critics as a symbol of a monarchy too weighed down by its own privilege to move quickly."}, {"term": "Bourbon Restoration", "aliases": ["Restoration", "post-Restoration"], "def": "The period from 1814 to 1830 when the French monarchy, under the Bourbon royal family, was reinstated after Napoleon's defeat — the era in which the first wave of professional French Revolution histories were written."}, {"term": "Carlylese", "aliases": ["Carlylean"], "def": "The nickname contemporaries gave to Thomas Carlyle's highly unusual writing style — broken, exclamatory sentences, German-influenced word order, invented compound words, and abstract ideas treated as if they were living characters."}, {"term": "cause-and-effect history", "aliases": ["philosophical history", "Philosophy (history)"], "def": "A style of history writing that explains events as a chain of rational causes leading to effects, which Carlyle rejected as a false simplification of a reality he saw as too tangled and simultaneous to reduce to a straight line."}, {"term": "Death-Birth of a World", "aliases": ["Death-Birth"], "def": "Carlyle's own phrase for revolution as a single event that is simultaneously an ending and a beginning — the violent destruction of an old order and the painful emergence of a new one at once."}, {"term": "emplotment", "aliases": ["emplotted", "Romantic emplotment"], "def": "A term from literary theory for the way a historian shapes real events into a story with a recognizable shape — such as tragedy, comedy, or romance — meaning that even supposedly neutral history-writing makes storytelling choices."}, {"term": "eschatological", "aliases": ["eschatology"], "def": "Having to do with the end of the world or a final, decisive divine judgment — used here to describe Carlyle's sense that the Revolution was not just political upheaval but something closer to doomsday."}, {"term": "Girondins", "aliases": ["Girondin"], "def": "A relatively moderate political faction in the French Revolution's National Convention, associated with figures like Madame Roland, who were eventually purged and executed by the more radical Jacobins."}, {"term": "great man theory", "aliases": ["great-man theory", "great-man reading", "great-man doctrine"], "def": "The idea, popularized by Carlyle, that major historical change is driven chiefly by exceptional individual leaders rather than by broad social, economic, or collective forces — a theory later challenged by historians who stressed social conditions instead."}, {"term": "Histoire de deux amis de la liberté", "aliases": ["deux amis", "History by Two Friends of Liberty"], "def": "A multi-volume, unevenly reliable contemporary narrative of the Revolution written in the 1790s by anonymous authors, which Carlyle drew on for color and incident and which is one of the main channels through which factual errors entered his book."}, {"term": "Histoire parlementaire", "aliases": ["Histoire parlementaire de la Révolution française", "Buchez and Roux"], "def": "A forty-volume French compilation of speeches, decrees, and official proceedings from the Revolution, assembled by Buchez and Roux in the 1830s, which served as Carlyle's principal raw documentary source."}, {"term": "historical present", "aliases": ["present tense narration", "present-tense", "camera-eye"], "def": "A storytelling technique in which past events are narrated as though they are happening right now, which erases the reader's sense of safe hindsight and makes the outcome feel undecided."}, {"term": "Jacobins", "aliases": ["Jacobin"], "def": "The most radical and ultimately dominant political faction of the French Revolution, associated with Robespierre and the Terror, known for its zeal in purging perceived enemies of the revolutionary cause."}, {"term": "Journées", "aliases": ["journée"], "def": "A French term (literally \"days\") used by historians for the major single-day mass uprisings of the Revolution, such as the storming of the Bastille, treated as distinct dramatic turning points."}, {"term": "Marxist / social interpretation (of the Revolution)", "aliases": ["Marxist-social", "social interpretation", "class analysis"], "def": "A twentieth-century school of French Revolution history that explained the Revolution as the product of economic class conflict and material interests, associated with historians like Mathiez, Lefebvre, and Soboul — an approach Carlyle's book has essentially none of."}, {"term": "Moniteur", "aliases": ["Moniteur universel"], "def": "The quasi-official French newspaper of record during the Revolution, which printed Assembly debates and government decrees, giving Carlyle a source of dated, near-verbatim parliamentary material."}, {"term": "National Assembly", "aliases": ["National Convention", "the Convention", "the Assemblies"], "def": "The revolutionary legislative bodies that successively governed France after 1789, replacing the king's absolute authority with representative (though increasingly radicalized) rule."}, {"term": "palingenesia", "aliases": ["Palingenesia", "palingenesis"], "def": "A Greek-derived term for cyclical death-and-rebirth, used by Carlyle (via the Phoenix image) to suggest that a civilization must be symbolically destroyed by fire before it can be reborn in a new form."}, {"term": "parataxis", "aliases": ["paratactic"], "def": "A sentence style that strings short clauses together with minimal connecting words (often just commas, semicolons, or dashes) rather than linking them through logical subordination, producing a clipped, breathless rhythm."}, {"term": "prose-epic", "aliases": ["prose epic", "Epic Poem of the Revolution"], "def": "A long prose work that borrows the scale, grandeur, and mythic framing of classical epic poetry (like Homer's) while remaining technically nonfiction — Carlyle's own description of what he was attempting to write."}, {"term": "proto-fascism charge", "aliases": ["proto-fascist charge", "proto-fascist genealogy", "proto-fascist reading"], "def": "The argument, made by some twentieth-century critics, that Carlyle's celebration of strong individual leaders and of violence as a purifying force helped lay intellectual groundwork later exploited by fascist movements."}, {"term": "revisionist school", "aliases": ["Furet-revisionist", "revisionism", "revisionist challenge"], "def": "A late-twentieth-century approach to French Revolution history, led by François Furet, that rejected the Marxist emphasis on economic class conflict and instead located the Revolution's causes and its slide into violence in political ideology and language."}, {"term": "sage-writing", "aliases": ["secular prophecy", "the sage", "Sage of Chelsea"], "def": "A Victorian literary mode, which Carlyle is credited with founding, in which a writer adopts the tone and authority of an Old Testament prophet to denounce the moral failings of contemporary society."}, {"term": "Sansculottism", "aliases": ["sans-culottes", "Sansculottes"], "def": "Carlyle's term for the radical, working-class energy of the Revolution's crowds, which he treats not as an ordinary political faction but as an almost supernatural elemental force of destruction and renewal."}, {"term": "Sham", "aliases": ["Shams", "Sham vs. Reality"], "def": "Carlyle's key term for any social institution — a monarchy, a church, a law — that has lost its genuine moral substance and survives only as an empty, hollow formality, which he believed revolution violently exposes and sweeps away."}, {"term": "Terror", "aliases": ["the Terror", "Reign of Terror"], "def": "The roughly year-long period (1793–1794) of the French Revolution marked by mass arrests and executions of perceived enemies of the revolutionary government, presided over largely by Robespierre."}, {"term": "Vendémiaire", "aliases": ["13 Vendémiaire", "whiff of grapeshot"], "def": "A royalist uprising in Paris in October 1795 that Napoleon crushed with cannon fire, an event Carlyle famously described as a \"whiff of grapeshot\" and treated as the effective end of the Revolution."}, {"term": "Whig-progressive history", "aliases": ["Whig-progressive", "Whiggish", "Whig history"], "def": "A style of history that presents the past as a story of steady, more-or-less inevitable progress toward liberal, constitutional government — a framework Carlyle rejected because it treated the Revolution as a rational triumph rather than a moral judgment."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  var sceneTpl = document.getElementById('reader-scene-template');
  if (sceneTpl && h1 && sceneTpl.content && sceneTpl.content.firstElementChild) {
    well.insertAdjacentElement('afterend', sceneTpl.content.firstElementChild.cloneNode(true));
  }
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
const menuBtn = document.getElementById('menu-btn');
menuBtn.onclick = () => document.body.classList.toggle('menu-open');
function closeMenu() { document.body.classList.remove('menu-open'); }

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}
function chunkText(t) {
  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);
  return out;
}
function pickVoice() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  const name = sel && sel.value;
  const vs = synth.getVoices();
  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';
    tip.textContent = 'Tip: download Enhanced or Premium voices in your OS accessibility settings for much richer audio.';
    document.body.appendChild(tip); setTimeout(() => tip.remove(), 8000);
  }
}
function speakChunk() {
  if (!listening) return;
  if (lidx >= lchunks.length) {
    if (sleepMode === 'chapter') { stopListen(); return; }
    if (listenAuto && listenIdx < docs.length - 1) {
      listenIdx++; autoNext = true; show(listenIdx); autoNext = false;
      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();
    } else stopListen();
    return;
  }
  const u = new SpeechSynthesisUtterance(lchunks[lidx]);
  u.rate = listenRate; const vo = pickVoice(); if (vo) u.voice = vo;
  u.onend = () => { if (listening && !paused) { lidx++; speakChunk(); } };
  u.onerror = () => { if (listening && !paused) { lidx++; speakChunk(); } };
  synth.speak(u);
}
function startListen() {
  if (!synth) return;
  synth.cancel(); listening = true; paused = false; listenIdx = current;
  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.add('on');
  speakChunk();
}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  if (lbar) lbar.classList.remove('show');
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.remove('on');
}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }
function setSleep(sec) {
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  sleepMode = sec === 1 ? 'chapter' : 'none';
  if (sec > 1) sleepTimer = setTimeout(stopListen, sec * 1000);
}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);
  lbar.querySelector('#lb-toggle').onclick = togglePause;
  lbar.querySelector('#lb-stop').onclick = stopListen;
  lbar.querySelector('#lb-rate').onchange = function () { listenRate = +this.value; };
  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };
  populateVoices();
  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });
};
window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command
// palette jumps that land on a chapter of the corpus already open (no reload).
window.addEventListener('hashchange', () => {
  const h = location.hash.match(/^#ch-(\d+)$/);
  if (h && +h[1] !== current) show(+h[1]);
});

// Related reading at the foot of the column — corpus-level, from the inlined
// library manifest's precomputed similarity graph (no fetch). Deferred to
// DOMContentLoaded because the shell (which carries #library-manifest) is
// injected into the page AFTER this script.
function renderRelated() {
  const relEl = document.getElementById('related');
  const mEl = document.getElementById('library-manifest');
  if (!relEl || !mEl) return;
  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }
  const me = LIB.find(x => x.slug === corpus.slug);
  const rel = (me && me.related) || [];
  if (!rel.length) return;
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'
        + '<span class="related-cat">' + esc(r.category || '') + '</span>'
        + '<span class="related-t">' + esc(r.title) + '</span></a>').join('')
    + '</div>';
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {
  var bar = document.getElementById('reader-progress'); if (!bar) return;
  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }
  document.addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '620px', normal: '700px', wide: '820px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {
    contentEl.style.setProperty('--reader-fs', SIZES[fs]);
    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';
    document.body.appendChild(panel);
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var v = b.getAttribute('data-v');
      if (b.parentNode.id === 'tp-size') { fs = v; localStorage.setItem('reader-fs', v); }
      else { meas = v; localStorage.setItem('reader-measure', v); }
      applyType(); mark();
    });
  }
  btn.onclick = function (e) {
    e.stopPropagation();
    if (!panel) build();
    if (panel.classList.toggle('open')) {
      mark();
      var r = btn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      var top = r.top - panel.offsetHeight - 8;
      panel.style.top = (top < 8 ? r.bottom + 8 : top) + 'px';
    }
  };
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
})();

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;
      b.setAttribute('data-term', m.term); b.setAttribute('data-def', m.def);
      b.setAttribute('aria-label', m.term + ': ' + m.def);
      node.parentNode.insertBefore(b, after);
      used[m.term] = 1; break;                                    // one chip per text node
    }
  });
}

(function setupGlossary() {
  if (!GLOSS.length) return;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var pop = document.createElement('div'); pop.id = 'gloss-pop'; pop.setAttribute('role', 'tooltip');
  document.body.appendChild(pop);
  var hoverCap = !(window.matchMedia && window.matchMedia('(hover: none)').matches);
  var openFor = null, cEl = document.getElementById('content');
  function open(btn) {
    pop.innerHTML = '<div class="gp-term"></div><div class="gp-def"></div>';
    pop.querySelector('.gp-term').textContent = btn.getAttribute('data-term');
    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');
    pop.classList.add('open');
    var r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 8));
    var top = r.top - ph - 8; if (top < 8) top = r.bottom + 8;
    pop.style.left = left + 'px'; pop.style.top = top + 'px'; openFor = btn;
  }
  function close() { pop.classList.remove('open'); openFor = null; }
  if (hoverCap) {
    cEl.addEventListener('pointerover', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b) open(b); });
    cEl.addEventListener('pointerout', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b && openFor === b) close(); });
    cEl.addEventListener('focusin', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b) open(b); });
    cEl.addEventListener('focusout', function () { close(); });
  }
  cEl.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.gloss'); if (!b) return;
    e.preventDefault(); if (openFor === b) close(); else open(b);
  });
  document.addEventListener('click', function (e) {
    if (openFor && !(e.target.closest && (e.target.closest('.gloss') || e.target.closest('#gloss-pop')))) close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener('scroll', function () { if (openFor) close(); }, { passive: true });

  var tbtn = document.getElementById('terms-btn'); if (!tbtn) return;
  tbtn.hidden = false; var panel = null;
  tbtn.addEventListener('click', function () {
    if (!panel) {
      panel = document.createElement('div'); panel.id = 'gloss-panel';
      var sorted = GLOSS.slice().sort(function (a, b) { return a.term.localeCompare(b.term); });
      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';
      sorted.forEach(function (e) { h += '<dt>' + esc(e.term) + '</dt><dd>' + esc(e.def) + '</dd>'; });
      panel.innerHTML = h + '</dl>'; document.body.appendChild(panel);
    }
    var opened = panel.classList.toggle('open');
    if (opened) {
      var r = tbtn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();
</script>

      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
