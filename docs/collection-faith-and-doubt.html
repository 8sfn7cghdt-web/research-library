: marking the edge of what his method can know and declining to trespass. It is the same self-restraint we will see him exercise around the psychoid archetype and the unus mundus (Chapters 06 and 07), where again he insists he is describing the structure of experience, not pronouncing on the structure of reality.\n\nThe trouble is that he did not always keep to his own boundary. This is the nuance the research record is careful to preserve, and it would be dishonest to soften it: scholars — the philosopher Richard Capobianco prominent among them — have charged that Jung *repeatedly lapsed into the very metaphysics he disclaimed*. The hedge is stated once, formally, and then the prose around it keeps behaving as though the question were already settled in Jung's favor — as though evil's substantial reality were not merely a fact about the psyche but a fact about the cosmos and about God. When, in *Answer to Job* (the subject of **Chapter 05**), Jung speaks of \"the evil face of God\" as though reporting a discovered truth, the \"I presume no judgement\" has quietly evaporated. The empiricist who promised to stay in his lane is, by then, making confident pronouncements about the moral interior of the deity.\n\n*A fair reading has to hold both of these at once.* The disclaimer is genuine; Jung means it when he writes it. But the disclaimer is also, in practice, honored as much in the breach as the observance. The tension is not a flaw to be explained away — it is the live wire of the whole project. Jung wants the protections of the empiricist (\"I only report what the psyche shows\") *and* the reach of the metaphysician (\"God has a dark side\"), and he is not always willing to pay the price of choosing. The serious critique of Jung — distinct from the empiricist complaint that he is too mystical — often starts exactly here: that he over-reaches, that the careful \"psychological\" framing is a rhetorical airlock through which he smuggles strong theological claims. We will return to this when we weigh his legacy in **Chapter 12**.\n\n## Three and four\n\nThe deepest stake in the *privatio boni* quarrel is structural, and Jung worked it out first in **\"A Psychological Approach to the Dogma of the Trinity\"** (1942, in CW 11). The Christian Godhead is a *Trinity*: Father, Son, Holy Spirit — three persons, and, on the orthodox account, wholly good, wholly light, perfect and complete. Jung's question is the question of a man who has spent his life watching what the psyche does with symbols of totality: *is three actually a symbol of wholeness?*\n\nHis answer is no — and the reason is mathematical before it is theological. In the symbolic grammar Jung found everywhere from alchemy to mandalas to his patients' dreams, the number of *completeness* is four, not three. Three is dynamic, directional, a movement; four is static, square, whole — the four cardinal points, the four functions of consciousness, the four-fold mandala that he took to be the psyche's native picture of its own totality. A trinity, by this reckoning, is not a finished figure. It is a figure with one corner missing. And the missing fourth, Jung argued, is precisely whatever the perfect, all-good Trinity has had to exclude in order to *be* perfect and all-good: evil, the dark, matter, the body, the feminine, the rejected created world. The price of the Trinity's perfection is the expulsion of a fourth — and the expelled fourth does not vanish. It waits.\n\nThis is the structural payoff of the *privatio boni* argument. If evil were a mere privation, the Trinity could be complete without it; you cannot be incomplete for lacking a *nothing*. But if evil is substantial, an equivalent opposite, then a Godhead that excludes it is genuinely missing something, and the doctrine that papers over the absence — *privatio boni* — is doing exactly the concealing work Jung suspects. The Trinity-versus-Quaternity problem and the *privatio boni* polemic are one argument wearing two faces. Reject the privation theory, and the missing fourth becomes unavoidable. **Chapter 05** follows this all the way to its most startling destination: Jung's claim that God himself has \"a good side and a fourth side — the evil face of God,\" and that the 1950 declaration of the Assumption of Mary was the unconscious of Western Christendom trying to install the feminine as that fourth. Jung named the missing fourth variously — evil, the feminine, matter, creation — and the variability is itself telling: what unites his candidates is that each is something the official picture of perfection had to leave out.\n\nIt is worth pausing on how audacious this is, and how it lands for a reader who knows Jung through Jordan Peterson's Biblical lectures (the matter of **Chapter 11**). Peterson is at home with the Trinity as a psychological structure and at home with the integration of the shadow as a moral task. He is markedly less comfortable, the record suggests, with the place this argument actually arrives — a God who is not wholly good, who owes humanity a moral debt. Whether Peterson finally flinches from the dark conclusion of *Answer to Job* is, on the present evidence, an open question rather than a settled one. *I flag that as genuinely unresolved.* But the structural setup belongs here, in the quaternity argument, because it is here that \"evil is real\" stops being a clinical observation and starts becoming a claim that reorganizes the Godhead.\n\n## The shadow: the problem of evil, brought home\n\nAll of this would remain a quarrel among theologians and depth psychologists were it not for the move that makes Jung Jung: he insisted that the cosmic question is *first* a personal one, and that no one has any business pronouncing on the evil in God who has not first reckoned with the evil in himself. The name for that personal reckoning is the **shadow**.\n\nThe shadow, in Jung's technical sense, is everything in a person that the conscious, presentable, daylight personality has refused — the appetites, cruelties, cowardices, envies, and inconvenient energies that do not fit the picture one wishes to have of oneself. It is not, note, simply \"the bad.\" The shadow is the *rejected*, and what gets rejected is often vitality, instinct, and power that the ego found too threatening or too shameful to claim. But its darker contents are real, and they are the personal-scale form of the very thing the *privatio boni* tries to define out of existence: substantial, autonomous evil, living inside the house.\n\nJung's clinical claim is blunt and, once seen, hard to unsee. The shadow does not disappear when it is disowned. It goes *underground* — into the unconscious — where, unwatched, it gains autonomy and force. The respectable man who has banished his own capacity for cruelty does not thereby become harmless; he becomes *dangerous in a particular way*, because his cruelty now operates without his knowledge, leaking out in his certainties, his contempts, his projections. And projection is the shadow's signature trick: the evil I refuse to see in myself I see, magnified and intolerable, in my neighbor, my rival, my enemy, the out-group. The man most sure of his own goodness is, for Jung, exactly the man whose shadow is most completely off the leash — because conscious goodness, uncut by any acknowledgment of the dark, is the surest sign that the dark has been driven down to where it can do its work unobserved.\n\nThis is why Jung came to regard the *moral* repression of evil as not merely inadequate but actively dangerous — and here the line back to *privatio boni* tightens into a knot. A doctrine that teaches evil is mere absence, mere privation, encourages exactly the psychological maneuver Jung most feared: the conviction that one is, or could be, simply good, with the dark understood as a deficiency to be corrected rather than a real and permanent inhabitant to be known. Treat your evil as a *nothing* and you will not watch it; what you do not watch, you cannot govern; what you cannot govern, governs you. The *privatio boni*, in Jung's reading, is not just a metaphysical error. It is a recipe for the unconscious acting-out of the very evil it pretends does not substantially exist. He thought he had watched a whole civilization prove the point — the eruption he diagnosed in the \"Wotan\" essay (**Chapter 12**) is, on one reading, the collective shadow of a Christianized Europe returning with interest after centuries of being told it was nothing.\n\n## Integration is not indulgence — the distinction everything turns on\n\nNow we arrive at the idea that is most often misquoted into its own opposite, and the chapter's central labor is to state it correctly. Jung says one must *integrate* the shadow rather than repress it. The careless reader hears: *give the darkness its head, act out your evil, the bad in you is really good if you embrace it.* This is not merely a misreading; it is the precise inversion of what he meant, and the inversion is consequential enough to mark in bold.\n\n**To integrate the shadow is to bring it into consciousness — not into action.** It is to *know* the cruelty, the envy, the violence, the lust for power that lives in you; to own it as yours; to stop pretending it belongs to your neighbor; and, by that conscious owning, to be able to *answer for it* — to hold it under the eye of a wider self rather than letting it run you from the cellar. Integration is the opposite of indulgence precisely because indulgence requires no consciousness at all. The man who acts out his rage has not integrated his shadow; he has *been overrun by it* — which is exactly the fate Jung says befalls those who repress it. Integration and acting-out are not points on a spectrum. They are opposed responses to the same buried material: the one makes the darkness conscious so it can be governed, the other lets it govern. The person who has integrated his capacity for cruelty is, for Jung, *less* likely to be cruel, not more — because cruelty seen is cruelty that can be checked, while cruelty disowned acts in the dark.\n\nThere is a moral asymmetry here that is easy to lose and worth stating plainly. Jung is not a relativist who thinks good and evil are illusions to be dissolved into some grand indifference. He thinks they are *real* — that is the whole point of the *privatio boni* polemic — and that their reality is exactly what makes the conscious moral struggle inescapable. To integrate evil is to take it *more* seriously, not less: to stop comforting yourself with the fiction of your own innocence and shoulder the lifelong work of knowing, watching, and refusing to be ruled by the dark you carry. The goal is not to become evil, and it is not the brittle, deluded \"goodness\" of the man who has hidden his evil from himself. It is *wholeness* — the conscious, governing inclusion of both halves under the regulating center Jung called the self (**Chapter 02**). This is why he could say in the same breath that Christ \"realized the idea of the self\" and yet that, lacking \"the nocturnal side of the psyche's nature\" and being \"without sin,\" the Christ-figure \"is not a totality\": **\"Without the integration of evil there is no totality\"** (CW 11, ¶231–232). A symbol of wholeness that has expelled its own dark half is, by Jung's lights, not yet whole — and neither is a man.\n\n## Setting up the quarrel of Chapter 11\n\nIt is worth marking, before closing, the contrast that **Chapter 11** will have to adjudicate, because the shadow is exactly where it is fought. The Jungian doctrine of integration — *make the darkness conscious so that it may be governed by the self* — sits near, and yet decisively apart from, a moralized reading that has gained wide currency through Jordan Peterson and others: the counsel to *become a \"controlled monster,\" to make oneself capable of harm and then aim that capacity at the good.* The two can sound alike. Both refuse the bloodless ideal of the man who is harmless because he is weak; both insist that the disowned dark is a danger; both prize a person who has met his own capacity for violence.\n\nBut the emphases diverge, and the divergence matters. The \"controlled monster\" framing locates the work in the *will* — the ego cultivating a fearsome capacity and then *directing* it, a sword sharpened and pointed. Jung's integration locates the work in *consciousness* and ultimately in the *self*, the supraordinate center that is not the ego at all: the aim is less the ego's command over a weaponized darkness than the dethroning of the ego's pretense to be the whole story, so that a larger wholeness — which includes the dark without being mastered *by* the ego — can take the helm. One is closer to a heroic ethic of self-control; the other to a religious ethic of self-surrender to something greater than the conscious \"I.\" Whether Peterson's reading is a faithful popularization or a subtle moralizing distortion of Jung — and whether, in particular, it can follow Jung all the way to a God with an \"evil face\" — is the question **Chapter 11** must weigh. The materials for that judgment are laid here, in the difference between *aiming* the darkness and *integrating* it.\n\nWhat survives all the contested readings is the one conviction Jung never surrendered, on either staircase, cosmic or personal: that evil is *real* — substantial, weighty, an equivalent opposite that \"always predicate[s]\" its opposite — and that any psychology, theology, or self-understanding which treats it as a mere absence has, by that very evasion, handed itself over to the thing it refused to see. The *privatio boni* was, for Jung, the West's most elegant way of not looking. The shadow is the name of what looks back.\n\n## Sources\n\n1. C.G. Jung, *Aion: Researches into the Phenomenology of the Self* (CW 9ii, 1951) — esp. \"Christ, a Symbol of the Self\" and the privatio boni argument (¶98). Transcription: https://carljungdepthpsychologysite.blog/2020/10/14/carl-jung-cw-9ii-aion/\n2. C.G. Jung, \"A Psychological Approach to the Dogma of the Trinity\" (1942), in *Psychology and Religion: West and East* (CW 11). https://www.jungiananalysts.org.uk/wp-content/uploads/2018/07/C.-G.-Jung-Collected-Works-Volume-11_-Psychology-and-Religion_-West-and-East.pdf\n3. C.G. Jung, *Answer to Job* (1952), in CW 11 — for the \"evil face of God\" and the quaternity. Overview: https://en.wikipedia.org/wiki/Answer_to_Job\n4. \"Privatio boni\" (peer-reviewed treatment, *International Journal of Jungian Studies*) — on the doctrine and the Capobianco-type charge that Jung lapsed into disclaimed metaphysics: https://www.ijsj.ie/assets/uploads/2021%20edition%202/5.%20pdf%20Privatio%20boni%20Changes%20noted.pdf"}, {"order": 4, "file": "collection-faith-and-doubt-4.md", "title": "Six Easy Pieces of Thomas Carlyle's Calvinism", "summary": "The Calvinist Without a Creed", "body": "*From [The Calvinist Without a Creed](carlyle-research.html#ch-0) — chapter 1*\n\n# Six Easy Pieces of Thomas Carlyle's Calvinism\n\n*How a Scottish boy's lost religion became the engine of a Victorian prophet — and why it still starts arguments.*\n\n## The man who kept the grammar and threw away the creed\n\nHere is the one thing to hold onto. Thomas Carlyle (1795–1881) was the most listened-to moral voice in Victorian Britain, and the quickest way to understand him is this: he was **a Calvinism that had lost its confession but kept its grammar.**\n\nHe grew up in a stonemason's house in a tiny Scottish village, in a strict breakaway Presbyterian church — the Burgher Seceders, a group that had split from Scotland's national church to keep its doctrine pure. (Calvinism is the stern strand of Protestant Christianity that teaches God has already fixed each soul's fate, that human beings are deeply flawed, and that the Bible's word is law.) The family read Scripture, said the catechism (the set questions-and-answers about the faith, learned by heart), and treated every day's work as owed to God. Carlyle was raised to be a minister.\n\nThen, in his twenties, he lost the belief — not the habits of mind, the belief. He no longer held the doctrines. But he never stopped *thinking like a Calvinist*: history was still God's judgment unfolding, work was still holy, the world was still full of frauds to be smashed, and his job was still to stand up and thunder at people about it. He simply stopped naming God and started naming other things. That gap — faith gone, machinery still running — is the whole man.\n\n## Why a dead theology in a dead writer still matters\n\nA forgotten Victorian's lost religion sounds like a museum piece. It isn't, for two reasons.\n\nFirst, Carlyle *built* ideas we still live inside. His book *Past and Present* (1843) invented the modern cry that a society measured only in money is a sick society — that \"cash payment\" cannot be the only bond between people. That line runs straight into a hundred years of writing about the cruelty of unchecked markets. His \"Gospel of Work\" — the conviction that honest labor is sacred and idleness is spiritual death — is the same idea a sociologist would later call the \"Protestant work ethic.\" When people argue today about whether work gives life meaning, or what happens to that meaning when machines take the jobs, they stand on ground Carlyle cleared.\n\nSecond, and more uncomfortably, the same mind that wrote that humane cry later wrote, in 1849, a defense of slavery in the Caribbean. The identical instinct — order, hierarchy, everyone in their God-given place, working — produced the compassion in one book and the cruelty in the other. Carlyle is the clearest case of how one moral engine can drive a person toward justice and toward its opposite. That is not a safe historical curiosity. It is a live warning.\n\n## The cast: a church, a few books, and a handful of words\n\nYou need only a small set of names to follow the rest.\n\n- **The Burgher Seceders** — the strict Scottish breakaway church Carlyle was raised in. Doctrine kept pure, the Bible as law, work as duty to God.\n- **Calvinism** — the branch of Protestantism behind that church: God has fixed each soul's fate, humans are fallen, Scripture rules.\n- **The leftover machinery** — the thing this whole account is about: the Calvinist *habits of mind* Carlyle kept after the faith itself was gone. Think of a factory that keeps running full-tilt after the owner who built it has walked out the door.\n- **Sham** — Carlyle's favorite curse-word, meaning any hollow fake: a fraud, empty preachy talk, a fake dressed up as truth. Unmasking Sham is what he thought a writer was *for*.\n- **The Gospel of Work** — his doctrine that all true labor is sacred.\n- **Hero-worship** — his idea that history turns on great individuals through whom something divine acts. His book *On Heroes* (1841) is really about this.\n- **Carlylese** — the nickname for his roaring, capital-letter, Old-Testament prose style. It reads like a sermon because, underneath, it is one.\n\nThe books to know are few: *Sartor Resartus* (1834), his strange spiritual autobiography; *The French Revolution* (1837), the history that made him famous; *On Heroes* (1841); *Past and Present* (1843), his humane peak; and the dark late work — the 1849 pro-slavery tract and the *Latter-Day Pamphlets* (1850) — where the engine goes wrong.\n\n## How the engine actually works\n\nThe mechanism is simpler than it looks. Take any core piece of Carlyle's thought, and underneath it you will find a Calvinist doctrine with the God-language filed off. Walk the chain:\n\nThe Calvinist believes God has **predestined** all events — history is God's verdict playing out. Strip the word \"God,\" and you get Carlyle's **history-as-judgment**: for him, the French Revolution wasn't chaos, it was a sentence coming due on a rotten old order. Events don't just happen; they *come due*.\n\nThe Calvinist believes each person has a **calling** — a station appointed by God, to be worked at faithfully. Strip the theology, and you get the **Gospel of Work**: labor is sacred, and a society that turns work into a mere wage transaction has committed something close to blasphemy.\n\nThe Calvinist believes the world is full of **idols** — false gods the faithful must smash. Strip the religion, and you get the **war on Sham**: Carlyle doesn't argue with an opponent, he *unmasks* him as a fraud.\n\nThe Calvinist reveres **Scripture** read aloud from the pulpit. Strip the church, and you get **Carlylese** — prose built to be preached, positioning the reader not as a debating partner but as a congregation being warned.\n\nThe Calvinist waits for **God to act in the world**. Strip that, and you get **hero-worship**: the great man becomes the place where the divine still breaks into history — a stand-in for a savior in a system that no longer has one.\n\nEvery load-bearing piece of Carlyle works this way. That's why he holds together as one thinker instead of a bag of moods — and it's why the cruelty and the compassion are the same engine. The doctrine of *everyone in their appointed place, working under a rightful authority* writes a beautiful defense of the poor laborer's dignity in one decade and an ugly defense of forced labor in the next. Nothing was added from outside to spoil him. The failure was inside the machine, waiting for the right pressure.\n\n## The fight: a category error, or a warning label?\n\nSmart people still argue hard about what Carlyle *is*, and both sides have a real case.\n\nOne camp says: **he is dangerous, and the line runs forward.** He preached obedience to strongmen, contempt for democracy, and hierarchy by race. His hero-worship fed German nationalism; his books were later admired and quoted by fascists. And today a reactionary online right — most visibly Curtis Yarvin, a modern online writer whose anti-democracy ideas have reached people close to real political power — has openly named Carlyle a master and mined him for anti-democratic ammunition. Reading him warmly, this camp says, is reading past the harm.\n\nThe other camp says: calling him a **proto-fascist is a category error** — judging a nineteenth-century man by twentieth-century horrors he never saw. His politics were a specific, dated brew: a Scottish Calvinist faith that God's hand steers history (what they called *providence*); an old-fashioned Tory (British conservative) belief that the powerful should look after the poor the way a stern father looks after children; and a Romantic disgust with the machine age. That the wrong people later admired him tells you about *them*, not about what he wrote. And the fashionable modern version of Carlyle — Yarvin's — has quietly thrown away the very thing that gave the original its conscience: the religious moral seriousness, the demand for mercy, the sense of standing under judgment yourself.\n\nThe honest verdict is not a clean win for either. The category-error people are right that \"fascist\" reads history backward. But they are too eager to quarantine the humane early Carlyle from the vicious late one. The strongest reading refuses both comforts: he is one machine, and you have to hold the great cry against cruelty and the defense of cruelty in the same hand, and understand that they came from the same place.\n\n## Where it's heading: a quiet recovery under a political cloud\n\nSo what happens to Carlyle now? Three honest sketches.\n\nThe most likely, over the next decade, is a **quiet recovery under a political cloud.** A long project publishing his complete works finishes in 2026, freeing scholars to write fresh books, and the \"lost his confession, kept his grammar\" reading keeps gaining ground as the sharpest way to see him. But he stays largely off university reading lists, because no one has found a clean way to teach the 1849 racism at scale, and the political fight keeps his name charged. Two motions at once: slow rehabilitation among specialists, fast controversy everywhere else.\n\nLess likely but real: the political cloud **wins**, and he becomes shorthand for \"the bad old reactionary tradition,\" pushed further out of the classroom. Or the opposite — a **surprise return to the mainstream**, if the argument over work and meaning in the age of AI sends people back to the man who first called work sacred.\n\nThe one thing to watch is whether those two speeds can hold together — scholars quietly finding him useful while the public treats him as toxic — for years. That a thinker could be prized in the seminar room and radioactive on the street at once sounds like a contradiction. With Carlyle, it is not. It is the forecast. He kept the grammar and threw away the creed, and a century and a half later we are still trying to decide what to do with a prophet who is half conscience and half warning."}, {"order": 5, "file": "collection-faith-and-doubt-5.md", "title": "Six Easy Pieces of Phenomenology and Pragmatism", "summary": "Experience and Consequences", "body": "*From [Experience and Consequences](phenomenology-pragmatism-research.html#ch-0) — chapter 1*\n\n# Six Easy Pieces of Phenomenology and Pragmatism\n\n*Two philosophies of the working mind — one born in Germany, one in America — and how they drifted apart and found their way back.*\n\n## The two philosophies that started as the same question\n\nAround 1890, on two continents, two men were trying to solve the same problem, and neither knew he had a twin.\n\nIn Massachusetts, William James finished a 1,400-page book on how the mind actually works — the stream of thought, the pull of habit. In Germany, Edmund Husserl was reading that very book, marking it up in the margins, on his way to founding **phenomenology** — the disciplined description of how things show up in conscious experience, taken exactly as experienced. James's own movement got a plainer name: **pragmatism** — the idea that you judge a belief by what practical difference it makes in action, not by how well it mirrors some fixed reality behind the world.\n\nHere is the one idea to carry: phenomenology and pragmatism are the two most important philosophies of the past 150 years that grew up *outside* the analytic mainstream. Analytic philosophy — the style that came to rule British and American departments — tried to make thinking as exact as mathematics: break every sentence into its parts, define every term, prove each step in order. These two traditions asked a different question. Not *is this argument valid?* but *what is experience actually like?* And the textbook that files one under \"European\" and the other under \"American\" hides the real story: they started at the same time, from the same frustration, reading the same books. European and American philosophers barely read each other back then, which is exactly why no one guessed these two were twins. Both wanted to describe the mind at work without grinding it into sensory atoms (the old British way) or dissolving it into grand speculation (the old German way). Academic politics kept them apart for fifty years; they have spent the last fifty finding their way back.\n\n## Why a philosophy fight should matter to you\n\nYou can go a whole life without reading Husserl. So why should this land on anyone outside a seminar room?\n\nBecause these two traditions quietly built the picture of the mind that now runs underneath psychology, therapy, and the argument about artificial intelligence. When a psychologist studies a patient's *lived experience* instead of just scoring a symptom checklist, that method has a phenomenological pedigree. When a clinician insists some things about a person must be *understood from the inside*, not only *explained* from the outside, that distinction was written into psychiatry in 1913 by a phenomenologist. When cognitive scientists say your thinking isn't trapped in your skull but spread across your body, tools, and surroundings, they are spelling out a conviction both traditions reached first.\n\nThe stakes reach into religion, too — phenomenology produced the richest vein of religious thought in twentieth-century philosophy; pragmatism produced the deepest American religious writing there is. And artificial intelligence has a horse in this race: Hubert Dreyfus, the philosopher who spent decades insisting computers could never think like us — because understanding is a skilled body coping with a world, not a rulebook in the head — was arguing straight from this playbook. His name keeps coming up now that machines can talk.\n\n## The cast: two founders' rows and the words they left behind\n\nYou need only a small cast to follow the rest.\n\nOn the phenomenology side: **Franz Brentano**, an ex-priest who in 1874 revived a medieval idea, **intentionality** — the fact that every mental act is *about* something (you don't just fear, you fear something). **Edmund Husserl**, his student, who built a method on the **epoché** — deliberately suspending your automatic assumption that the world is simply \"out there,\" so you can study how experience is actually structured. **Martin Heidegger**, Husserl's brilliant and troubling heir, who shifted the question from consciousness to plain existence and coined **being-in-the-world** — that we're never detached minds watching reality but always already caught up in a world of people, tools, and cares. (Heidegger joined the Nazi party in 1933 and never renounced it; that shadow falls across how he is taught.) And **Maurice Merleau-Ponty**, who put the *living body* at the center of perception.\n\nOn the pragmatism side: **Charles Sanders Peirce**, the most original and least lucky American thinker, who gave the movement its engine, the **pragmatic maxim** — to find the meaning of any idea, ask what practical difference it would make if it were true. **William James**, who made pragmatism famous and founded American scientific psychology in one stroke. **John Dewey**, who built it into something close to America's national philosophy of democracy and education. And, generations later, **Richard Rorty**, who revived the whole tradition in 1979 under the banner of **neopragmatism**.\n\nOne enemy unites both rows: **Descartes** — or rather the picture he left us, of a mind as an inner theater, sealed off, watching a screen and trying to guess whether the outside world matches. Everything that follows is two teams dismantling that theater.\n\n## How the argument actually runs, step by step\n\nWalk the logic once and you'll have the mechanism. Descartes' picture is the target: a thinking thing inside, a world outside, and a permanent worry about whether the inner screen is accurate. Both traditions reject it at the root — but by different routes.\n\nPhenomenology's route is *description*. Husserl says: stop assuming the world and look at experience itself. Consciousness is never blank — it is always *of* something (Brentano's intentionality). And what you focus on comes wrapped in a **horizon** — a fuzzy background of the almost-noticed, the sides of the cup you can't see but somehow expect. (James called it the \"fringe\"; Husserl took the word from him — the two really were reading each other.) Then Heidegger pushes harder. Watch yourself use a hammer, he says. When it works, you don't perceive \"a hammer\" at all — the tool disappears into the task and you're just *hammering*. It pops into view as a separate object only when it breaks. So the detached, staring mind Descartes started from isn't where we live; it's a rare breakdown mode. Normally we're absorbed, skilled, already in the world. The theater was never real.\n\nPragmatism's route is *consequences*. Peirce says a belief isn't a picture in the head; it's a habit of action. So the meaning of an idea just *is* the practical difference it would make. \"This water is boiling\" means: expect steam, don't touch it. Truth, then, isn't a match between an inner image and an outer fact; it's what reliably works out as inquiry goes on. Dewey drives it home in 1896. The reigning model said a stimulus comes in, a response goes out — a straight line from world to mind to muscle. Dewey answers: there is no straight line. A child reaches for a candle *because* she's already looking, grabs *because* she's reaching, pulls back *because* she felt the burn — one continuous loop of a whole creature coping. Mind isn't a screen the world prints on; it's what an organism *does* to get on in its environment.\n\nNow stand back: both routes reach the same place from opposite sides. Heidegger's absorbed tool-user and Dewey's coping child are the same figure. The mind is not a spectator. It's a participant — embodied, skilled, already entangled with the world. That shared conclusion is why, a century later, the traditions could merge. Where they merged has a name: **4E cognitive science** — thinking as *embodied* (shaped by having a body), *embedded* (shaped by its surroundings), *enacted* (something you do, not done to you), and *extended* (sometimes reaching out into tools and notes and phones). Its founding book, *The Embodied Mind* (1991), is built from Merleau-Ponty's phenomenology with pragmatist debts to Dewey and James. The philosophers' argument became the scientists' working assumption.\n\n## The fight that's still live\n\nHere is where honest, informed people still disagree — and it's worth stating both sides at full strength before leaning either way.\n\nThe sharpest fight is over religion, and it has a name: the **theological turn**. Late in the twentieth century, a group of French phenomenologists — Jean-Luc Marion the most prominent — began using phenomenology's tools to describe religious experience: prayer, revelation, a gift or presence that overflows anything you can wrap a concept around. Marion called these **saturated phenomena** — experiences so overwhelming no concept can contain them, the opposite of a tidy object you can define. His claim: this is legitimate phenomenology. Husserl's method only brackets — sets aside, suspends; the epoché again — the *God of the philosophers*, the abstract first-cause idea of God argued over in the seminar room. It leaves room for a God who might actually *give himself* in experience, exceeding our grip.\n\nThe counterpunch came from Dominique Janicaud, and it was blunt: this is theology wearing phenomenology's coat. Phenomenology promised to describe only what appears, to anyone, in plain experience. Smuggle in God, grace, and revelation and you've abandoned the discipline — doing apologetics and calling it description. Both sides are strong. Marion is right that phenomenology never proved God *couldn't* show up in experience; Janicaud is right that a method open to revelation has stopped being neutral. The honest verdict: the debate is *unresolved*, and where you land depends partly on what you already believe.\n\nA parallel fight runs on the pragmatist side, older and more political. Dewey's optimism — that patient, democratic problem-solving can steadily improve the human lot — met a hard Christian rebuttal from Reinhold Niebuhr: pragmatism has no serious account of *sin*, of the way groups behave worse than individuals, of evil that reason and goodwill can't engineer away. That quarrel is still central to American religious thought, and pragmatism's reply — that Niebuhr caricatured a naïveté Dewey never held — hasn't ended it.\n\nUnderneath both runs a quieter tension the convergence never dissolved. Phenomenology, in its pure form, wants timeless *essences* — the necessary structure of any possible experience. Pragmatism distrusts anything timeless: even our best ideas are revisable tools, answerable to results. The thinkers who married the traditions mostly did it by demoting the essences to something more modest — which is an honest way of saying they gave up the purest phenomenology to get the marriage. The seam still shows.\n\n## Where it's heading\n\nSo what happens to two 150-year-old philosophies from here? The honest answer is *partial absorption with a surviving name* — and the interesting action is at the edges, not the center.\n\nPicture three rooms. In the **philosophy departments**, the likeliest path is quiet survival: chairs stay filled and journals keep printing, but the *new* work happens at the borders with cognitive science, religion, and AI rather than under the banners \"phenomenology\" or \"pragmatism.\" In the **science of mind**, the embodied 4E picture looks set to stay a standard frame; the open question is only whether the *word* \"phenomenology\" survives in the technical vocabulary or the ideas march on while the label drops away. In **theology**, expect the French religious phenomenology to consolidate in Catholic circles while the pragmatist-Christian line runs on chiefly through the *Black prophetic tradition* — the strand of American religious thought, from the spirituals and the Black church through the civil-rights movement, that reads grounded religious action against suffering as itself a kind of pragmatism. Cornel West, who named it \"prophetic pragmatism,\" is its public face; whether a younger figure inherits that role is a real open question.\n\nTwo wild cards could swing all three rooms. The first is **artificial intelligence**: if machines keep gaining ground, the philosophy of mind gets rebuilt around exactly the question these traditions spent a century sharpening — is understanding a matter of rules in the head, or a skilled body in a world? They are unusually well-placed to speak, or to be swept aside. The second is plainer: most of the living giants of both traditions — Jean-Luc Marion, Charles Taylor, Cornel West, and their peers — were born in the 1930s, '40s, and '50s. They are old, and who inherits their chairs — and whether one great book finally fuses the two traditions the way no one yet has — will shape the next generation more than any argument on the page.\n\nSo watch two things: whether cognitive-science papers on body and mind keep *citing* Husserl and Dewey by name or just borrow the ideas and forget them, and whether that one synthesizing book arrives. It comes maybe once a career, and if it lands it decides which of these futures we get. The deepest thing these two traditions show, together, is simple enough to keep: the most powerful philosophy of the last century refused to treat the mind as a lonely spectator behind glass, and insisted — from two directions at once — that to think is to be a living body already at work in the world."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {
  let h = document.getElementById('kbd-help');
  if (!h) {
    h = document.createElement('div'); h.id = 'kbd-help';
    h.innerHTML = '<div class="kh"><h3>Keyboard</h3><dl>'
      + '<dt>⌘K</dt><dd>command palette</dd>'

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}

  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);

}

  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';

}
function speakChunk() {

      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();

}
function startListen() {
  if (!synth) return;

  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();

}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();

}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }

}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);

  lbar.querySelector('#lb-stop').onclick = stopListen;

  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };

  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });

window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command

window.addEventListener('hashchange', () => {

// Related reading at the foot of the column — corpus-level, from the inlined

function renderRelated() {

  const mEl = document.getElementById('library-manifest');

  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }

  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {

  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '620px', normal: '700px', wide: '820px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {

    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;

  document.body.appendChild(pop);

  var openFor = null, cEl = document.getElementById('content');

    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');

  });

      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';

      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();

.card-prog { display: inline-flex; align-items: center; gap: .34rem; font-family: var(--mono); font-size: .64rem;

    view.s = s; view.x = (sw - (2 * x + w) * s) / 2; view.y = (sh - (2 * y + h) * s) / 2; apply();
  }

  function load() {
    if (loading) return; loading = true;
    fetch(base + 'atlas.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) {
        DATA = j; buildPick();
        var sm = ''; try { sm = localStorage.getItem('atlas-pick') || ''; } catch (e) {}
        if (sm && j.connections && j.connections[sm]) mode = sm;
        paint(true); loaded = true; if (msg) msg.remove(); syncPick(); updateSub();
      })
      .catch(function () { if (msg) msg.textContent = 'The Atlas needs to load its map data — open it on the live site (calvincollins.xyz).'; });
  }

  // The research picker turns the Atlas from a single mosaic into a per-corpus
  // explorer: pick a work and the map redraws as that corpus's intellectual world.
  function buildPick() {
    if (!pick || !DATA) return;
    var conn = DATA.connections || {}, seen = {}, opts = '<option value="">✦ All researches — the whole map</option>';
    (DATA.places || []).filter(function (p) { if (seen[p.slug] || !conn[p.slug]) return false; seen[p.slug] = 1; return true; })
      .map(function (p) { return { slug: p.slug, title: p.title }; })
      .sort(function (x, y) { return x.title.localeCompare(y.title); })
      .forEach(function (it) { opts += '<option value="' + esc(it.slug) + '">' + esc(it.title) + '</option>'; });
    pick.innerHTML = opts;
  }
  function syncPick() { if (pick) pick.value = mode; }
  function setMode(m) {
    if (!DATA) return;
    m = m || ''; if (m && !(DATA.connections && DATA.connections[m])) m = '';
    if (m === mode) { syncPick(); return; }
    mode = m; try { localStorage.setItem('atlas-pick', mode); } catch (e) {}
    hideCard(); paint(true); syncPick(); updateSub();
  }
  function updateSub() {
    var sub = back && back.querySelector('#atlas-sub'); if (!sub) return;
    var C = (mode && DATA && DATA.connections && DATA.connections[mode]) ? DATA.connections[mode] : null;
    if (C) sub.textContent = C.home.name + '’s intellectual world — ' + C.nodes.length + ' geographic connections. Hover a place to trace its thread.';
    else sub.textContent = 'Every research is one equal stamp, pinned to its place. Click a place name to zoom in — or pick a research above to trace its intellectual world.';
  }

  // Repaint the whole surface for the active mode. Cheap enough to rebuild wholesale.
  function paint(doFit) {
    if (!DATA) return;
    var j = DATA, C = (mode && j.connections && j.connections[mode]) ? j.connections[mode] : null;
    var s = '<svg id="atlas-svg" viewBox="' + j.viewBox + '" width="' + j.w + '" height="' + j.h
      + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">';
    s += '<defs>';
    if (!C) j.places.forEach(function (p) {
      s += '<clipPath id="ac-' + p.slug + '"><rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="7"/></clipPath>'; });
    else s += '<clipPath id="ahome"><circle cx="' + C.home.x + '" cy="' + C.home.y + '" r="58"/></clipPath>';
    s += '</defs>';
    s += '<g id="atlas-grat">'; (j.graticule || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += '<g id="atlas-bd">'; (j.backdrop || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += C ? connLayer(C) : placesLayer(j);
    s += '</svg>';
    world.innerHTML = s;
    bySlug = {};
    computeBounds(C);
    if (C) wireConn(C); else wirePlaces(j);
    if (doFit === false) { apply(); return; }
    fit();
  }

  // The stamp mosaic: leader lines + anchor dots first, then the callout
  // plates, then every corpus as one equal-size stamp with a short caption.
  function placesLayer(j) {
    var plateById = {};
    (j.plates || []).forEach(function (pl) { plateById[pl.id] = pl; });
    var s = '<g id="atlas-lead">';
    (j.plates || []).forEach(function (pl) {
      if (pl.leader) s += '<path class="atlas-leader" d="M' + pl.leader[0] + ' ' + pl.leader[1] + 'L' + pl.leader[2] + ' ' + pl.leader[3] + '"/>';
    });
    j.places.forEach(function (p) {
      var pl = plateById[p.plate];
      if (pl && (Math.abs(p.ax - pl.cx) > 2 || Math.abs(p.ay - pl.cy) > 2))
        s += '<line class="atlas-spoke" x1="' + pl.cx + '" y1="' + pl.cy + '" x2="' + p.ax + '" y2="' + p.ay + '"/>';
      s += '<circle class="atlas-anchor" cx="' + p.ax + '" cy="' + p.ay + '" r="5" fill="' + esc(p.accent) + '"/>';
    });
    s += '</g><g id="atlas-plates">';
    (j.plates || []).forEach(function (pl) {
      s += '<g class="atlas-plate" data-plate="' + esc(pl.id) + '">'
        + '<rect class="atlas-plbg" x="' + pl.x + '" y="' + pl.y + '" width="' + pl.w + '" height="' + pl.h + '" rx="10"/>'
        + '<line class="atlas-plrule" x1="' + (pl.x + 12) + '" y1="' + (pl.y + 33) + '" x2="' + (pl.x + pl.w - 12) + '" y2="' + (pl.y + 33) + '"/>'
        + '</g>';
    });
    // names in their own layer ABOVE every plate box, so a counter-scaled
    // label never hides under a neighbouring plate
    s += '</g><g id="atlas-plnames">';
    (j.plates || []).forEach(function (pl) {
      s += '<text class="atlas-plname" data-plate="' + esc(pl.id) + '" x="' + (pl.x + pl.w / 2) + '" y="' + (pl.y + 25) + '" text-anchor="middle">' + esc(pl.name) + '</text>';
    });
    s += '</g><g id="atlas-stamps">';
    j.places.forEach(function (p) {
      s += '<g class="atlas-place" data-slug="' + esc(p.slug) + '">';
      if (p.img) { var href = esc(base + p.img);
        s += '<image class="atlas-img" href="' + href + '" xlink:href="' + href + '" x="' + p.x + '" y="' + p.y
          + '" width="' + p.w + '" height="' + p.h + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac-' + p.slug + ')"/>';
      } else {
        s += '<rect class="atlas-fallback" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="7" fill="' + esc(p.accent) + '"/>'
          + '<text class="atlas-initial" x="' + (p.x + p.w / 2) + '" y="' + (p.y + p.h / 2 + 18) + '" text-anchor="middle" fill="' + esc(p.accent) + '">' + esc((p.title || '?').charAt(0)) + '</text>';
      }
      s += '<rect class="atlas-ring" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="7" stroke="' + esc(p.accent) + '" stroke-width="2.5"/>';
      (p.cap || []).forEach(function (ln, li) {
        s += '<text class="atlas-cap" x="' + (p.x + p.w / 2) + '" y="' + (p.y + p.h + 14 + li * 14) + '" text-anchor="middle">' + esc(ln) + '</text>';
      });
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function arcPath(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = Math.min(170, len * 0.16), cx = mx - dy / len * off, cy = my + dx / len * off;
    return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  function clipText(t, n) { t = t || ''; return t.length > n ? t.slice(0, n - 1).replace(/[\s,;:&/-]+$/, '') + '…' : t; }
  function connLayer(C) {
    var ac = esc(C.home.accent || '#b3502f'), H = C.home, R = 58;
    var s = '<g id="atlas-threads" stroke="' + ac + '">';
    C.nodes.forEach(function (n, i) { s += '<path class="atlas-thread" data-i="' + i + '" d="' + arcPath(H.x, H.y, n.x, n.y) + '"/>'; });
    s += '</g>';
    // home badge drawn UNDER the place nodes, so their dots + labels are never masked
    s += '<g class="atlas-home">';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + (R + 6) + '" fill="var(--bg)"/>';
    if (H.img) { var href = esc(base + H.img);
      s += '<image href="' + href + '" xlink:href="' + href + '" x="' + (H.x - R) + '" y="' + (H.y - R) + '" width="' + (2 * R) + '" height="' + (2 * R) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ahome)"/>'; }
    else s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="' + ac + '"/>';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="none" stroke="' + ac + '" stroke-width="4.5"/>';
    s += '<text class="atlas-hlabel" x="' + H.x + '" y="' + (H.y + R + 33) + '" text-anchor="middle" fill="' + ac + '">' + esc(H.name) + '</text>';
    s += '</g>';
    s += '<g id="atlas-cnodes">';
    C.nodes.forEach(function (n, i) {
      // splay each label outward from home so the European cluster doesn't pile up
      var dx = n.x - H.x, dy = n.y - H.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var lx = n.x + dx / L * 15, ly = n.y + dy / L * 15 + (dy >= 0 ? 16 : -8);
      var anchor = dx > 30 ? 'start' : (dx < -30 ? 'end' : 'middle');
      s += '<g class="atlas-cnode" data-i="' + i + '">';
      s += '<circle class="atlas-chalo" cx="' + n.x + '" cy="' + n.y + '" r="17" stroke="' + ac + '" fill="none"/>';
      s += '<circle class="atlas-cdot" cx="' + n.x + '" cy="' + n.y + '" r="9" fill="' + ac + '"/>';
      s += '<text class="atlas-clabel" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(clipText(n.name, 30)) + '</text>';
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function computeBounds(C) {
    var X0 = 1e9, Y0 = 1e9, X1 = -1e9, Y1 = -1e9;
    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      (DATA.plates || []).forEach(function (pl) {
        X0 = Math.min(X0, pl.x); Y0 = Math.min(Y0, pl.y); X1 = Math.max(X1, pl.x + pl.w); Y1 = Math.max(Y1, pl.y + pl.h); });
      DATA.places.forEach(function (p) { bySlug[p.slug] = p;
        X0 = Math.min(X0, p.ax); Y0 = Math.min(Y0, p.ay); X1 = Math.max(X1, p.ax); Y1 = Math.max(Y1, p.ay); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
    var byId = {};
    (j.plates || []).forEach(function (pl) { byId[pl.id] = pl; });
    [].forEach.call(world.querySelectorAll('.atlas-plate, .atlas-plname'), function (el) {
      var pl = byId[el.getAttribute('data-plate')];
      el.addEventListener('click', function () { if (moved || !pl) return; zoomToRect(pl.x - 30, pl.y - 30, pl.w + 60, pl.h + 60); });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
