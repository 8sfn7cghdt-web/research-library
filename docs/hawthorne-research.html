best-known expression of this from\nHawthorne's own side is his 1855 remark, in a letter to his publisher William Ticknor, that the\nAmerican market was overrun by \"a damned mob of scribbling women.\" The quotation is widely\nreported, and an obituary of the scholar Nina Baym records it as a letter of 1855. It has been\nused by critics to show Hawthorne's contempt for the women writers who were outselling him, and\nby others to show his self-pity about the market. Both uses are interpretations of the same\nsentence, and the sentence itself is not in dispute among the people who have checked it. Its\nmeaning is.\n\n## The Victorian Reputation and Henry James\n\nFor roughly thirty years after Hawthorne's death in 1864, his reputation was that of a classic\nwho had been admired by the right people. He became a fixture of the American literary\ncurriculum and of the Atlantic Monthly's cultural pantheon, but his books were read more as\nmonuments of a vanished New England than as living contributions to the novel. The most\nimportant critical statement of this period is Henry James's study *Hawthorne*, published in\n1879 in the English Men of Letters series. James's book is still the most intelligent early\naccount of Hawthorne, and it is a remarkable document for what it both gives and withholds.\n\nJames opens by placing Hawthorne in the Puritan line. His famous claim, which is widely\nrepeated, is that Hawthorne was by race of the clearest Puritan strain, and James takes that\ninheritance seriously as a fact about Hawthorne's imagination. The argument that follows is\nsubtler than the opening suggests. James holds that Hawthorne's relation to the Puritan\nconscience was largely intellectual rather than moral or theological. Hawthorne used the Puritan\nmaterial, the guilt, the scaffolding of sin and confession, as a resource for art, and he was\nnot himself haunted by it in the way that the more ordinary adherents of the faith would have\nbeen. This distinction between the artist's use of an inheritance and the believer's submission\nto it is the seed of a long argument that runs through the twentieth century. Critics who want\nHawthorne to be a historian of Puritanism tend to read James's opening as the beginning of an\naccount of inheritance; critics who want him to be a psychologist of conscience tend to read the\nintellectual-not-moral claim as an opening onto the interior life.\n\nJames's book also carries a famous and much-quoted reservation about Hawthorne's range. He is\ngenerous about the romances and the tales, and he is severe about the limits of the characters,\nthe thinness of the social world, and what he calls the absence of the \"usual\" materials of the\nEnglish novel. These judgments became the template for a generation of Anglo-American readers\nwho admired Hawthorne as a tale-writer and doubted that he had the broad social canvas that the\nnovel was supposed to require. In chapter three, James takes issue with the French critic Émile\nMontégut, who had described Hawthorne as a writer of dark and misanthropic temperament, and\nJames's objection is that the darkness is an effect of the art and not a settled disposition of\nthe man. The objection is one of the earliest explicit statements of a view that later\nbiographical and psychological critics would have to take seriously and that the symbolists,\nparadoxically, would largely neglect.\n\nThe Victorian reputation then undergoes a slow decline that is harder to narrate than the\nrevival that follows. Hawthorne is read in schools, reprinted in cheap editions, and used as an\nexample of the moral tale. By the end of the nineteenth century he is an established name, and\nthe critical interest that the 1850s had shown in Melville's kind of darkness has faded into a\nmore genteel regard. The Edwardian period brings a related but distinct development. The cult\nthat forms around the romances in the 1890s and 1900s emphasizes the atmosphere of the tales,\nthe Gothic quality of Salem, and the pleasures of the historical setting, and the moral and\npolitical seriousness that Melville had claimed for him recedes. Scholars of the period are\ndivided about how deep this \"cult\" was. Some treat it as a genuine readership that kept the\nbooks alive; others treat it as a species of sentimental antiquarianism that blunted the\nintellectual edge of the work. The evidence for the cult is largely in the form of editions,\nreprint runs, and commentary in the monthly press, and the attributions are sometimes contested.\nWhat is clear is that by the 1920s the sense that Hawthorne was a serious writer for the present\nhad weakened, and that the recovery of the 1930s and 1940s had to begin from a reputation that\nmany critics regarded as dated.\n\n## The Mid-Century Recovery: Matthiessen, Chase, Male, and Trilling\n\nThe recovery is the most important development in the modern history of the reception, and it is\ninseparable from the institutional changes in American literary study that took place in the\n1930s and 1940s. The key figure is F. O. Matthiessen, whose *American Renaissance: Art and\nExpression in the Age of Emerson and Whitman* appeared in 1941. Matthiessen did not write a book\nabout Hawthorne alone, but his account of the American Renaissance made the five authors of the\nperiod, Emerson, Thoreau, Hawthorne, Melville and Whitman, into a canon whose internal tensions\ncould be read as the expression of a shared cultural moment. Hawthorne's place in that canon\nowes a great deal to Matthiessen's insistence that the romances are central works of the period\nand that their darkness is a serious response to the moral problems of American democracy.\nMatthiessen's method was historical and formal at once: he was a student of the expressive\nintentions of the authors and of the formal solutions they found, and his book is in some\nmeasure an early statement of the New Criticism's concern with the internal organization of the\ntext, combined with a historicism that the New Criticism usually disavowed.\n\nRichard Chase's *The American Novel and Its Tradition*, published in 1957, extended this\nrecovery into a theory of the American romance. Chase argued that the American novel had been\ncharacterized by a persistent tendency toward romance rather than the realistic social canvas of\nthe European novel, and that this tendency reflected the peculiar conditions of American life:\nthe thinness of the social world, the frontier, the moral and psychological dislocations of a\nsociety without a fixed aristocratic order. Hawthorne was central to Chase's argument, because\nthe romances displayed the features he took to be typical of the American form, including the\nuse of allegory, the heightening of the ordinary into the emblematic, and the strange\njuxtaposition of the actual and the fabulous. Chase's account has been criticized for\novergeneralizing from a few canonical books and for imposing a national character on a wide and\nvarious literature. But it remains the most influential statement of the romance thesis, and\nmost subsequent discussions of Hawthorne's form have to position themselves against it. The\nattribution of Chase's 1957 date and the specifics of his Hawthorne chapter were not checked\nagainst the book itself in this essay, and should be confirmed before citation in the final text.\n\nRoy R. Male's *Hawthorne's Tragic Vision*, published by W. W. Norton in 1957, took the symbolist\nmethod to its most systematic form. Male argued that Hawthorne's fiction was organized around a\nset of symbols whose meanings were stable and recoverable and that the tragic structure of the\nromances depended on the reader's ability to see the symbols as carrying a moral and sometimes\nreligious charge. The book is an important document of the symbolist school. Frederick C. Crews's critique of it in PMLA objected, as the secondary literature reports, that Male's method admitted only those symbols that could bear a Biblical or sacramental gloss, and that this tended to turn Hawthorne into a Christian moralist.\nThat objection is a precise statement of the central weakness of the symbolist method, and it is\none that later critics would press with more force.\n\nLionel Trilling, the Columbia critic whose essays on the English and American novel were among\nthe most widely read literary criticism of the postwar period, addressed Hawthorne in an essay\nthat appeared in *Partisan Review* in 1964. Trilling's position is ambivalent. He admires\nHawthorne's moral intelligence and his refusal of the easy resolutions of the novel of manners,\nbut he is skeptical of the image of Hawthorne as a \"dark\" poet, an image that he sees as partly\nproduced by the critics who had recovered him. The essay argues, in effect, that the\ncontemporary reader is bound to find Hawthorne somewhat disappointing, because his art is\norganized around a moral seriousness that the modern novel had largely abandoned, and because\nthe critical industry that had built his reputation had made him more gloomy and more symbolic\nthan he was. Trilling's essay is one of the first signs that the symbolist consensus was\nbeginning to crack, and it anticipates a line of criticism that treats the symbolist recovery as\nitself a cultural event that needs explaining.\n\nThe symbolism debate that these books generated is best understood as a dispute about the\nreader's authority. The symbolist critics, Male most explicitly, held that the symbols had\ndeterminate meanings that a competent reader could recover by attention to the text and to its\nBiblical and theological background. Their critics, from the 1960s onward, argued that the\nsymbols were unstable, that they were produced by the interpretive habits of the readers who\nfound them, and that the moral certainty the symbolists claimed for the romances was an effect\nof their own critical method. This is a dispute that has never been decisively resolved, and it\nhas reappeared in every subsequent generation. The factual background is not disputed. Every\nreader agrees that the scarlet letter is a letter and that the black veil is worn by Mr. Hooper.\nThe interpretive question is what the letter means and how far the reader's sense of its meaning\nis licensed by the text.\n\n## The Puritan-History Turn: Colacurcio and Bercovitch\n\nThe most important correction to the symbolist reading came from scholars who took Hawthorne's\nPuritan material seriously as history. Michael J. Colacurcio's *The Province of Piety: Moral\nHistory in Hawthorne's Early Tales* was published by Harvard University Press in 1984, and it is\nthe most sustained argument for reading Hawthorne as a historian of New England Puritanism.\nColacurcio argues against the symbolist and psychologizing interpretations, and he insists that\nHawthorne's early tales are to be understood first as engagements with the seventeenth-century\nhistoriography, the sermon literature, and the legal and theological debates of the Puritan\ncolonies. The \"moral history\" of the subtitle is the history of the moral questions that the\nPuritans asked about sin, grace, and the relation between the individual and the community, and\nColacurcio's claim is that Hawthorne's stories are in a precise sense answers to those\nquestions. The book is a work of very close reading, and its strength is that it shows how much\nof the apparent mystery of a tale such as \"Young Goodman Brown\" or \"The Maypole of Merry Mount\"\ndissolves when the reader knows the Puritan sources that Hawthorne was working from.\n\nColacurcio's argument has been widely accepted in its general direction, and it has changed the\nway that specialists read the early tales. Its limitations are principally two. The first is\nthat it can make Hawthorne's Puritan material seem more determinate than it is, so that the\nhistorical reading comes close to replacing the literary one. The second is that its scope is\nthe early tales more than the late romances, and the argument that the historical method\nexplains the novels has been pressed less thoroughly. Those who think that the romances are\ndoing something different from the tales have to explain why a historical reading should stop\nworking at the point where the most famous books begin.\n\nSacvan Bercovitch's *The Puritan Origins of the American Self*, published by Yale University\nPress in 1975, places Hawthorne in a broader argument about American culture. Bercovitch argues\nthat the American self-image of exceptionalism, the sense of a nation with a special errand, was\nformed in the rhetoric of the New England Puritans, and that this rhetoric was a rhetoric of\ninterpretation, a way of reading history as the unfolding of a providential design. The book has\nchapters on the Puritan self, the vision of history, the elect nation in New England, the move\nfrom hermeneutics to symbolism, and the myth of America, and it includes a reading of Cotton\nMather's life of John Winthrop. Hawthorne's place in this argument is complicated. He is one of\nthe American writers who inherit the Puritan rhetoric of election and errand, and also one of\nthose who most sharply question it. Bercovitch's account of the transition from Puritan\nhermeneutics to American symbolism is, among other things, a historical account of the symbolist\nmethod that the mid-century critics had used to read Hawthorne, and it gives that method a\ngenealogy.\n\nBercovitch's account has been criticized by historians and by some literary critics for the\nbreadth of its claims and for underweighting the spiritual and moral content of Puritan thought.\nThe objection is that Bercovitch treats the Puritan rhetoric of errand as a function of\nideology, a way of legitimating a social order, and that this downplays the religious experience\nthat the rhetoric was meant to express and that Hawthorne took seriously. The objection is a\nreal one, and it touches the central interpretive question of this chapter. If the Puritan\nmaterial is primarily ideological, then Hawthorne is a critic of that ideology. If it is\nprimarily religious, then Hawthorne is a writer whose ambivalence reflects a genuine spiritual\ninheritance that he could not simply reject. The debate between these readings has not been\nsettled, and it reappears in almost every serious study of the romances.\n\nThe Puritan-history turn also changed the factual record. Hawthorne's own family history, and in\nparticular the role of his ancestor John Hathorne, a magistrate at the Salem witch trials of\n1692, became part of the material of interpretation. Hawthorne wrote about the trials and about\nhis ancestor, and he is reported to have added a \"w\" to his surname, a point that is widely\nrepeated and that deserves to be checked against the family and biographical records before it\nis relied on. The biographical facts about the ancestor are not in serious dispute. What critics\nhave made of them is.\n\n## Feminist and Gender Readings: Baym Against the Hester-as-Rebel Reading\n\nFeminist criticism entered the reception of Hawthorne in the 1970s, and it did so in two very\ndifferent ways that are still in tension. The first and most influential reading treats Hester\nPrynne as a figure of resistance to patriarchal authority, a woman who refuses to name her\nlover, who challenges the Puritan law that condemns her, and who imagines, in the forest scene\nwith Dimmesdale, a different social order in which women and men might be free. On this reading\nHawthorne is a writer who saw the oppressions of his society with unusual clarity, and Hester is\nin part his vehicle for a critique of those oppressions. The reading draws on the sympathetic\nportrait of Hester's labor, her needlework, her charity, and her isolation, and on the novel's\nclose attention to the social and legal mechanisms by which women's bodies and reputations were\ncontrolled. It has been developed in many forms and it is the dominant popular reading of the\nnovel.\n\nNina Baym's reply, which is the most important scholarly challenge to that reading, takes a\ndifferent line. Baym's *Woman's Fiction: Novels by and about Women in American, 1820–1870*,\npublished in 1978, is a study of the large body of novels written by and about women in the\nperiod, and it is the work that established the sentimental and domestic tradition as a serious\nobject of literary history. Baym's argument is that the domestic novel had its own coherent\nconventions and its own set of values, and that these values, centered on the home, the moral\nauthority of the mother, and the moral education of the reader, were not simply the ideology of\na restricted sphere but a position from which women writers could speak with some authority.\nBaym's reading of Hawthorne is that he was, in important respects, writing against this\ntradition and was contemptuous of it, and that his treatment of women in the romances is partly\nshaped by his anxious sense of the domestic writers' popularity. The 1855 remark about the \"mob\nof scribbling women\" is the document most often cited in connection with this argument, though\nthe link between the remark and Baym's reading is the present chapter's inference rather than a\npoint the sources state.\n\nBaym's own book on the novel, *The Scarlet Letter: A Reading*, published by Twayne in 1986,\ndevelops a version of her approach. She argues against reading the novel as realistic historical\nfiction and defends it as a romance, a form that makes its meanings through the arrangement of\nemblems and characters rather than through social verisimilitude. This is a conventional move in\nthe Hawthorne criticism of the period, but Baym's use of it is shaped by her interest in the\ndomestic tradition, and the result is a reading in which Hester's rebellion is both real and\nbounded, real in what it asserts and bounded by the conventions within which Hawthorne is\nwilling to imagine it.\n\nThe debate between the rebel reading and the domestic reading is in part a factual dispute about\nthe text. Both readings agree that Hester is excluded from the community, that the novel gives\nher a voice in some scenes and silences her in others, and that the ending gives Hester a return\nto Boston and a limited, perhaps ambiguous, form of life in the cottage. They disagree about how\nto weigh these features, and about whether the novel's sympathies lie with Hester or with the\ncommunity that condemns her. The disagreement is not one that more evidence will settle, because\nthe evidence is the text, and the text supports both emphases. What is contestable is the claim\nthat Hawthorne's own views are reliably represented by either reading.\n\nA related strand of feminist criticism, developed in the 1980s and after, asks not whether\nHawthorne was for or against women but how his texts construct gender and whose experience they\ntreat as the norm. This line of inquiry has been productive in showing how the romances take the\nmale consciousness as the center of their moral drama, and how Hester, Zenobia, Phoebe, and\nMiriam are made to carry meanings that serve the male protagonists' inner conflicts. It is a\nreading that shares a great deal with the psychoanalytic approach discussed below, and it has\nbeen criticized for assuming that the male consciousness is the only one available to the text.\nThe defensibility of this reading is high, but its scope is contested: some critics think it\ncaptures a central feature of the romances, and others think it imposes a modern categorization\non a writer who did not think in those terms.\n\n## New Historicist and Psychoanalytic Readings\n\nThe approaches of the 1970s and 1980s brought two further methods to Hawthorne, and they have\nshaped the most recent debates. The first is new historicism. Its major statements on Hawthorne\ncame from scholars who read the romances as participants in the cultural economy of the\nantebellum period rather than as escapes from it. Michael Gilmore's *American Romanticism and\nthe Marketplace*, published in 1985, reads the romances in relation to the market for literature\nand the professional position of the writer in a commercial society, and argues that Hawthorne's\nrelation to the market was one of ambivalence, in which the writer's desire for recognition was\nentangled with his contempt for the mass audience. Gillian Brown's *Domestic Individualism*,\npublished in 1990, reads the romances and the domestic fiction of the period together, and\nargues that the idea of the individual self in American culture was produced through the\ndomestic sphere, so that Hawthorne's preoccupation with the inner life is inseparable from the\nsocial arrangements of the family and the household. Both books are in a broad sense new\nhistoricist, in that they treat the literary text as part of the discursive order of its moment,\nand both have been influential in moving Hawthorne criticism away from the purely formal\nconcerns of the symbolists.\n\nThe new historicist readings have been criticized from several directions. Traditional literary\nscholars object that they can reduce the text to an instance of a historical process and lose\nthe specific features of the art. Historians object that the new historicist use of historical\nsources is often selective and that its picture of the antebellum period is too uniform. And\ncritics concerned with Hawthorne's religious content object that the historicist method, which\ntends to treat religion as a discourse of social control, misses the genuine spiritual question\nthat the Puritan material raises. These objections are not decisive, but they mark the limits of\nthe approach, and they point to the place where the new historicist debate most directly meets\nthe Puritan-history turn: both want to read Hawthorne historically, and they disagree about what\nkind of history the texts are most fully about.\n\nThe psychoanalytic approach is older than new historicism in Hawthorne criticism, and it has a\nmore complicated history. Frederick Crews's *The Sins of the Fathers: Hawthorne's Psychological\nThemes*, published in 1966, is the most important early study in this vein. Crews reads the\nromances as dramatizations of guilt, repression, and the Oedipal structure of the family, and he\ntreats the Puritan material as a vehicle for the expression of psychological conflicts that the\nauthor could not fully articulate. Crews's study was a deliberate challenge to the symbolist\nconsensus, and it produced a generation of readings in which the romances were treated as the\nrecord of a divided psyche. The method has been criticized for reducing the moral content of the\nfiction to a symptom, and for assuming that the author's experience is available to the critic\nin a way that the historical evidence does not warrant. Its defenders argue that the romances\nthemselves are preoccupied with the inner life, with concealment, and with the relation between\nthe private sin and the public consequence, and that a psychological reading is therefore a fair\naccount of what the text is doing.\n\nThe relation between the psychological and the historical readings is one of the live questions\nof the field. A critic like Colacurcio would say that the psychological readings take the\ncharacters' inner conflicts as primary and neglect the historical sources that give those\nconflicts their content. A critic like Crews would say that the historical readings, however\ncareful, cannot account for the intensity of the romances' interest in guilt and concealment.\nThe most productive recent work has tried to combine them, reading the Puritan sources as the\nvocabulary in which the psychological problems were made available to Hawthorne, and treating\nthe psychological problems as the form in which the historical material became art. That\nsynthesis is defensible and widely shared, but it has not produced a single agreed method.\n\n## The Live Debate: Historian, Psychologist, or Romancer of Nationhood?\n\nThe field now contains three broad answers to the question of what kind of writer Hawthorne was,\nand the answers are not mutually exclusive, though they tend to be argued as if they were.\n\nThe first answer treats Hawthorne as a historian of Puritanism. On this view his romances are\nfirst of all engagements with the moral and theological history of New England, and their\ninterest lies in how they reconstruct the Puritan problem of sin and community and reflect on\nits afterlife in American culture. The leading advocates are Colacurcio and, in a broader sense,\nBercovitch, and the view has the advantage of grounding the reading in the documentary record.\nIts weakness is that it can make the romances seem like extended historical commentary and can\nunderrepresent their literary inventiveness, their use of fantasy and allegory, and the\nemotional intensity that critics from Melville onward have found in them. Its defenders reply\nthat the inventiveness is itself a historical response to the Puritan problem, and that\nHawthorne's allegorical method is the form in which the Puritan hermeneutics of typology has\nbeen secularized.\n\nThe second answer treats Hawthorne as a psychologist of conscience. On this view the romances\nare studies of guilt, concealment, and the divided self, and their enduring power comes from\ntheir insight into the mechanisms by which people hide from themselves and each other. The\napproach is supported by the textual emphasis on secrecy and the moral consequences of hidden\nacts, and it has been the dominant approach in many readings of Dimmesdale, Chillingworth, Ethan\nBrand, and Donatello. It is also the most accessible to general readers, and it has the\nadvantage of addressing the moral seriousness that Melville and James both identified in the\nwork. Its weakness is that the psychological vocabulary is anachronistic in ways that can\ndistort the Puritan material, and that the critic's own psychological framework can determine\nwhat the text is found to say. Its defenders reply that the anachronism is a matter of\ntranslation and that every reading of a past text has to translate its concepts into present\nones.\n\nThe third answer treats Hawthorne as a romancer of nationhood. On this view the romances are\nconcerned with the making of an American culture out of a European inheritance and an unsettled\nmoral history, and their subject is the question of what kind of nation can be built on the\nfoundations of Puritan election and republican ideals. The approach draws on Chase's romance\nthesis and on the American Renaissance tradition, and it is supported by the romances'\npersistent concern with inheritance, with the authority of the past over the present, and with\nthe relation between private life and public order. Its strength is that it places Hawthorne in\na national context that the historicist readings have made central, and that it can account for\nthe political dimension that is sometimes neglected by the psychological readers. Its weakness\nis that the nationalist frame can make the romances seem more confident about the American\nproject than they often are. Hawthorne's skepticism about reform, his doubts about the public\nsphere, and his unease with the cant of abolitionism all complicate any simple account of the\nromances as expressions of national purpose.\n\nThese three answers correspond to three different ways of weighting the evidence. The historian\nof Puritanism weights the documentary sources. The psychologist weights the characters'\ninteriors. The romancer of nationhood weights the public and political meanings of the emblems.\nEach is a legitimate way of reading the texts, and each has produced important work. What is\ncontested is whether one of them is the true account of Hawthorne's art, or whether the art is\nprecisely the place where these concerns cannot be separated. The most defensible position is\nprobably the last one, but it is also the least satisfying for a reader who wants a single key\nto the works.\n\n## The Factual Disputes\n\nIt is worth separating the questions of fact that have been argued over in the reception from\nthe interpretive questions, because they are settled in different ways. The factual questions\ninclude the composition and publication dates of the major works, the circumstances of\nHawthorne's removal from the Salem Custom House in 1849 after the change of administration, the\npublication and sales figures for *The Scarlet Letter*, the text and textual history of\nMelville's essay, the terms and timing of the Liverpool consulship, and the record of\nHawthorne's political and personal statements about slavery.\n\nMost of these are settled in outline. The Liverpool consulship was confirmed by the Senate on March 26, 1853, according to the Concord Free Public Library, after Franklin Pierce's election, and Hawthorne held the post until 1857. The\ncampaign biography of Pierce, *The Life of Franklin Pierce*, was published in 1852 in support of\nPierce's presidential candidacy, and its account of Pierce's position on slavery has been\ndescribed in secondary sources as softening his pro-slavery reputation, presenting him as a man\nof peaceable temperament who believed that the institution would fade without federal\nintervention. Abolitionists are reported to have mocked the book, and Emerson and other Concord\nfriends objected to Hawthorne's political loyalty to Pierce, though Emerson later served as a\npallbearer at the funeral in 1864. These facts are in the secondary literature and in the\nstandard biographical accounts, and they are not seriously disputed. The text of the campaign\nbiography should be read directly before any strong claim about its treatment of slavery is\nmade, and the claim should be stated as a claim about what the text says.\n\nThe record on slavery is more complicated than the popular picture, and it is the place where\nthe factual and interpretive disputes meet. Hawthorne's writings of the 1850s and early 1860s\nare often read as showing a man who was skeptical of abolitionism, who thought of the slavery question as a source of\nunnecessary division, and who found the moral rhetoric of the abolitionist movement distasteful.\nHis essay \"Chiefly About War Matters,\" published in the *Atlantic Monthly* in 1862 after a trip\nto Washington and the front, takes up the abolitionist cause in terms the sources do not settle. Secondary summaries describe its stance as wary, but whether it is wary, hostile, or ambivalent is an open question. The essay does register a sense that the war had become a struggle against slavery, which did not fit his earlier expectations that the institution would disappear without violence. The factual\nclaims here are not in dispute: the essay exists, its terms are public, and it says what it\nsays. The interpretive questions are whether Hawthorne's views were consistent over time,\nwhether they expressed a settled political position or a temperamental unease with moral\nenthusiasm, and how they bear on the romances' treatment of reform and of the public sphere.\n\n## The Interpretive Disputes\n\nBeyond the factual record, the central interpretive disputes concern the nature of the symbols,\nthe reliability of the narrators, the status of the romance form, and the orientation of the\ntexts toward their own moral claims. Each of these has been argued in terms that the other\nreadings tend to dismiss.\n\nOn the symbols, the question is whether they have determinate meanings that the reader can\nrecover or whether they are open structures that generate meanings in the act of reading. The\nsymbolists held the first view and the deconstructive and reader-response critics of the 1970s\nand 1980s held the second. The reader-response position, associated with critics who argued that\nliterary meaning is produced through the reader's engagement with the text, has been applied to\nHawthorne in ways that emphasize the instability of the emblems and the ambiguity of the\nendings. The response from the symbolist side is that the instability is itself a feature of the\ntext, and that Hawthorne's romances are constructed to make the reader doubt and reconstruct\ntheir own readings. Both sides agree that the emblems are ambiguous. They disagree about whether\nthe ambiguity is a stable effect that the text controls or an unstable effect that the reader\nproduces.\n\nOn the narrators, the question is how far the narrative voice can be trusted. The romances often\nspeak through narrators who are ironic, evasive, or self-deprecating, and the narrator's\njudgments of characters are not always reliable. The question is whether the narrator's\nambivalence is a sign of the author's moral uncertainty, a deliberate strategy of the romance\nform, or a feature of the Puritan rhetoric that the author is parodying. Critics who read the\nnarrator as a reliable moral guide tend to see the romances as moral instruction. Critics who\nread the narrator as a deliberately unreliable voice tend to see them as demonstrations of the\nimpossibility of moral certainty. The dispute is old and it has never been resolved, because the\ntexts support both readings in different passages.\n\nOn the romance form, the question is what the romance is for. Chase and the romance theorists\nheld that the romance was a national form that gave American writers a freedom from the\nconstraints of the realistic novel, and that its emblematic method was a response to the\nAmerican social world. Baym and the historicists held that the romance was a strategy for\ndistancing and managing sensitive material, a way of making political and social criticism\nwithout direct statement. The dispute is partly about the historical origins of the form and\npartly about its present interpretive value, and it has consequences for how the prefaces are\nread. The prefaces, especially the Custom House introduction to *The Scarlet Letter* and the\npreface to *The House of the Seven Gables*, are among the most quoted texts in the reception,\nand they are read by different critics as either a statement of a romance theory or as a defense\nagainst the charge of unreality.\n\nOn the moral orientation, the question is whether the romances endorse the moral judgments that\nthey represent or whether they stand back from them. This is the question that divides the\ncritics who see Hawthorne as a moral teacher from those who see him as a skeptic about moral\nteaching. The first group points to the consistent moral seriousness of the texts, the attention\nto sin and redemption, and the sense that the characters' suffering has a meaning that the\nnarrator can articulate. The second group points to the ambiguities of the endings, the failures\nof reform in *Blithedale* and *The Marble Faun*, and the narrator's refusal to adjudicate the\nmoral claims of the characters. The most sophisticated versions of both positions acknowledge\nthe evidence for the other, and the disagreement is largely about where the weight should fall.\n\n## What Counts as Established, Defensible, and Contested\n\nIt is useful to state the conclusions of this survey in the three categories the chapter uses.\nThe following are established, in the sense that they are not seriously disputed among\nspecialists: the chronology of the major works; the Liverpool consulship and its dates; the fact\nof the campaign biography and its general aims; Melville's authorship of the 1850 essay and its\nappearance in the Literary World; the basic outline of the symbolist recovery and its principal\nfigures; and the existence of a significant feminist and gender literature on the romances,\nincluding Baym's work on the domestic tradition.\n\nThe following are defensible, in the sense that a competent critic could hold and argue for\nthem, though they are not uncontested: that Hawthorne is most fully understood as a historian of\nPuritan moral questions, read through the sources Colacurcio identified; that the romances are\npreoccupied with conscience, concealment, and guilt in a way that a psychological reading\ncaptures; that the romance form is a deliberate and self-conscious strategy for making moral and\npolitical statements at a distance; that the Hester-as-rebel reading and the domestic reading\nare both available within the text; and that Hawthorne's treatment of reform and of the public\nsphere is skeptical rather than simply conservative.\n\nThe following are contested, in the sense that the disagreement among specialists is itself the\nsubject of the scholarship: whether Hawthorne's views on slavery were consistent and what they\namount to politically; whether the symbols have stable meanings; whether the narrator can be\ntrusted; whether the romances endorse or stand back from the moral judgments of their\ncharacters; whether the Hester-as-rebel reading is an accurate account of the novel or an\nimposition of modern categories; whether the psychological readings are anachronistic; and\nwhether the national frame of the romance thesis captures the romances or distorts them.\n\nThe difference between the defensible and the contested is not always clear, and some of the\nmost important work in the field consists in moving claims from one category to the other by\nshowing what the evidence supports. A reader who wants to form a view should begin with the\nestablished claims and then work through the defensible readings in the light of the textual\nevidence, recognizing that the contested questions are those on which reasonable critics\ncontinue to differ.\n\n## Open Questions\n\nSeveral questions remain open and are worth stating plainly. The first is whether the\nPuritan-history turn has finished its work. Colacurcio's reading of the early tales is widely\naccepted, but the extension of the historical method to the late romances has been less\nthorough, and it is not clear whether the historical reading can account for *The Marble Faun*\nin the way it accounts for \"Young Goodman Brown.\" The second is whether the factual record of\nHawthorne's politics, particularly his statements about slavery in the 1850s and early 1860s, is\nyet complete. The campaign biography and the war essays are well known, but the private\ncorrespondence has been studied less systematically than the public texts, and the picture it\ngives may be more or less favorable to the critical readings that have been advanced. The third\nis how to weigh the Melville essay in its original form against the revised text, and whether\nthe differences between them bear on the argument about American literary nationalism. The\nfourth is whether the feminist reading of Hester can be given a more precise textual anchor than\nthe broad sympathy of the novel, and whether the domestic reading can account for the full range\nof women characters in the romances.\n\nA fifth question concerns the future of the psychological reading. The psychoanalytic approach\nhas been criticized as anachronistic, but it has also been the most durable of the modern\napproaches to Hawthorne, and it is not obvious that its concepts have been exhausted. The sixth\nconcerns the place of religion in the current debate. The new historicist and feminist readings\nhave tended to treat religion as a discourse of social control, and this has made it harder to\ntake the genuine spiritual content of the romances seriously. Whether a return to the religious\nquestion can be made without reverting to the older symbolist consensus is an open problem.\n\n## Sources\n\n1. Herman Melville, \"Hawthorne and His Mosses,\" *The Literary World*, August 17 and 24, 1850,\n   under the byline \"By a Virginian Spending July in Vermont.\" Tier 1 (primary, the essay\n   itself). The Northwestern-Newberry text differs from the magazine printing; quotations here\n   were checked against an online
