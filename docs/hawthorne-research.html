f*, New Haven: Yale University\n   Press, 1975. Tier 2 (scholarly monograph). Chapter outline checked against a catalogue\n   description. Bercovitch's death year is reported differently in two sources (2014 and 2015)\n   and is not relied on here.\n\n9. Nina Baym, *Woman's Fiction: A Guide to Novels by and about Women in America, 1820–1870*,\n   Ithaca: Cornell University Press, 1978. Tier 2 (scholarly monograph). The 1978 date and the\n   book's scope were checked against a bibliographic description; the specific argument about\n   the domestic tradition is summarized from the author's own account.\n\n10. Nina Baym, *The Scarlet Letter: A Reading*, Boston: Twayne, 1986. Tier 2 (scholarly\n   monograph). The argument that the novel is a romance rather than historical realism is stated\n   in the author's Penguin introduction; the Twayne 1986 date was checked against a bookseller\n   listing.\n\n11. Michael Gilmore, *American Romanticism and the Marketplace*, Chicago: University of Chicago\n   Press, 1985. Tier 2 (scholarly monograph). Summarized from standard secondary accounts; not\n   consulted directly in this essay.\n\n12. Gillian Brown, *Domestic Individualism: Imagining Self in Nineteenth-Century America*,\n   Berkeley: University of California Press, 1990. Tier 2 (scholarly monograph). Summarized from\n   standard secondary accounts; not consulted directly in this essay.\n\n13. Frederick Crews, *The Sins of the Fathers: Hawthorne's Psychological Themes*, New York:\n   Oxford University Press, 1966. Tier 2 (scholarly monograph). The psychoanalytic reading is\n   summarized from the book's reception; not consulted directly in this essay.\n\n14. Leland S. Person, *The Cambridge Introduction to Nathaniel Hawthorne*, Cambridge: Cambridge\n   University Press, 2007. Tier 2 (scholarly survey). Recommended as the starting bibliography;\n   its contents were not confirmed in this essay and should be consulted directly before final\n   use.\n\n15. Bibliographic descriptions of the 1850 first edition of *The Scarlet Letter*, as reported by\n   rare-book dealers and an institutional library page (Maryland State Law Library, Special\n   Collections). Tier 5 (specialized secondary, bibliographic). The sellout figure of 2,500\n   copies within about ten days appears across several catalogue and library pages that appear\n   to derive from one shared account; treat as a reported figure.\n   https://www.courts.state.md.us/lawlib/research/special-collections-room/scarlet-letter\n\n16. Obituary note for Nina Baym, *Shelf Awareness*, June 28, 2018. Tier 5 (trade-press\n   obituary). Source for the 1855 \"mob of scribbling women\" remark and Baym's account of the\n   origin of her project; the original letter was not consulted.\n   https://www.shelf-awareness.com/theshelf/2018-06-28/obituary_note:_nina_baym.html\n\n17. Biographical and historical account of the Franklin Pierce campaign biography and the\n   Liverpool consulship, drawn from the Concord Free Public Library's Hawthorne collection and\n   related institutional summaries. Tier 5 (institutional summary). Used for the dates of the\n   consulship and the general characterization of the 1852 biography; the primary text, *The\n   Life of Franklin Pierce* (1852), should be read directly before strong claims about its\n   treatment of slavery. https://sc.concordlibrary.org/items/show/2029\n\n18. Nathaniel Hawthorne, \"Chiefly About War Matters,\" *The Atlantic Monthly*, July 1862. Tier 1\n   (primary essay). Not reread in this essay; cited for its existence and general stance toward\n   abolitionism.\n\n19. Nathaniel Hawthorne, *The Life of Franklin Pierce*, Boston: Ticknor, Reed and Fields, 1852.\n   Tier 1 (primary, campaign biography). Not consulted directly in this essay.\n\n20. Nathaniel Hawthorne, *The Scarlet Letter*, Boston: Ticknor, Reed and Fields, 1850. Tier 1\n   (primary). The Custom House introduction and the novel's text should be checked against the\n   Ohio State Centenary Edition before final quotation.\n\n21. Nathaniel Hawthorne, *The House of the Seven Gables*, Boston: Ticknor, Reed and Fields,\n   1851. Tier 1 (primary). Preface to be checked against the Centenary Edition.\n\n## Figures Cited But Not Read\n\nSeveral figures are named in this chapter without a direct reading of their work in this essay:\nF. O. Matthiessen, Richard Chase, Michael Gilmore, Gillian Brown, Frederick Crews, Leland\nPerson, Émile Montégut, Stephen Greenblatt, William D. Ticknor, Evert Duyckinck, and Elizabeth\nPalmer Peabody. Their positions are summarized from the standard secondary literature and should\nbe checked against the books and articles before the final text is published.\n\n## Primary Texts Not Consulted\n\nThe following primary texts are cited or relied on in this chapter without being reread in this\nessay: the Ohio State Centenary Edition of *The Scarlet Letter* and its Custom House\nintroduction; the Centenary Edition of *The House of the Seven Gables* and its preface; the 1852\n*Life of Franklin Pierce*; the 1862 essay \"Chiefly About War Matters\"; Hawthorne's 1855 letter\nto William D. Ticknor; the Northwestern-Newberry text of Melville's \"Hawthorne and His Mosses\";\nand Henry James's 1879 *Hawthorne* in its full text. These should be read directly before the\nchapter is finalized, especially for any claim about slavery, the textual history of Melville's\nessay, and the exact wording of James's Puritan passages."}, {"order": 6, "file": "06_Critique_And_Objections.md", "title": "Objections to Hawthorne: Escapism, Paralysis, the Pierce Biography, Slavery, Women, and Symbol", "summary": "", "body": "# Objections to Hawthorne: Escapism, Paralysis, the Pierce Biography, Slavery, Women, and Symbol\n\n## Bottom Line\n\nHawthorne's moral fiction draws its force from the Puritan inheritance he could not escape, and that same inheritance is the source of the most serious objections to him. The charges that he hid in a costume of Puritan history, that his pessimism about human reform disabled his politics, that he sold his literary integrity to a Democratic candidate, that his romances fall silent on slavery, that his women are fantasies of gender rather than critiques of it, and that his symbols are overdetermined are not all of equal weight. The political charges, particularly the Pierce biography and the Fugitive Slave Act, rest on the strongest documentary evidence and are the hardest to answer, though the answer is less a rescue than a separation of Hawthorne the friend and officeholder from Hawthorne the novelist. The aesthetic charges, escapism and symbolic overdetermination, are the most dependent on how a reader wants a romance to behave, and they are weakest where they assume that a symbol with several meanings is a symbol with no meaning. The gender charge is the most productive, because it turns on a real ambiguity: the romances seem to diagnose a gender order and at the same time to lean on its categories. The honest verdict is that Hawthorne's critics are right about the political record and about a real evasion on slavery, and that the strongest defences of the fiction succeed as readings of the fiction while leaving the man and the Liverpool years open to a harsher judgment.\n\n## How to Read the Charges\n\nBefore taking up the six objections, this essay needs three working terms, used the same way throughout.\n\nBy *escapism* I mean the charge that a writer turns from a present social problem to a past or allegorical scene in order to avoid naming it. The charge is not that the fiction is unreal; romance is unreal by design. It is that the displacement serves the writer's comfort, not the reader's understanding. An *aesthetic of displacement* is the defence: the romance is a deliberate instrument for seeing a present problem at a distance, and the distance is the point.\n\nBy *paralysis* I mean the charge that a moral vision which locates sin in the constitution of the human heart, rather than in institutions, makes reform look either futile or self-defeating. A writer can hold that every reformer carries the same egotism as the sinner he condemns and still be a reformer in fact. The charge is strongest where the fiction seems to make the reformer the villain. The defence is that Hawthorne's pessimism is a diagnosis of motive, not a programme of inaction, and that a diagnosis of motive is a precondition for honest reform.\n\nBy *overdetermination* I mean the charge that a symbol, a name, or a scene carries so many simultaneous meanings that the text can no longer be said to mean anything in particular. The charge is a close cousin of the old complaint about allegory. The defence is that polysemy is not vagueness, and that Hawthorne's habit of letting a symbol resist a single reading is itself a claim about how guilt and knowledge work in the mind.\n\nTwo further distinctions are needed. The first is between what a critic can establish from the record, what a defensible interpretation can argue, and what remains contested. Where this essay says a point is established, it means the record shows it, usually from a primary document or a finding aid. Where it says a point is defensible, it means a reasonable reader can hold it on the evidence, though another reasonable reader may not. Where it says a point is contested, the record allows more than one answer and the scholarship has not settled it. The second distinction is between Hawthorne the author and Hawthorne the public man. Much of the case against him depends on blurring those two, and the defence depends on keeping them apart. Each side is entitled to argue the separation, but neither is entitled to assume it.\n\nA note on the evidence itself is also required. The primary record for this chapter is strongest on the Pierce biography, which is a published text that can be read in full, and weakest on the consular dispatches from Liverpool, which the search for this chapter did not locate in a usable published form. Where the chapter relies on secondary characterisations, it says so. Where it could not confirm a figure or passage directly, it marks the point as not confirmed in this essay, and it does not supply a reconstructed quotation.\n\n## The Costume Objection: Escapism and the Puritan Stage\n\nThe strongest version of the charge runs as follows. Hawthorne was a man of the 1840s and 1850s, living through the rise of the cotton economy, the expansion of slavery into the territories, the Mexican War, the wave of reform movements that called themselves the moral conscience of the republic, and the passage of the Fugitive Slave Act. His fiction, by contrast, is set in seventeenth-century Boston, in a Salem house haunted by a witch-trial judge, in a Roman art world, and in a utopian farm that is itself a sort of historical costume. On this reading the Puritan setting is not a window onto the present but a theatre in which the present cannot be seen. The writer who most insistently spoke of his ancestors' guilt was the writer who spoke least about the guilt of his own society, and the Puritan costume let him feel historically serious while avoiding any judgment that would cost him a reader or a friend. The charge is sharpened by Hawthorne's own preface to *The House of the Seven Gables* and by the Custom House introduction to *The Scarlet Letter*, both of which describe the romance as a medium that removes the work from the ordinary light of the present. A critic can say, in effect, that Hawthorne told us in advance that he was hiding.\n\nThe best defence is that the displacement is the mechanism of the fiction rather than an evasion of it. Hawthorne's account of romance is that it occupies a \"neutral territory\" between the actual and the imagined, where a writer may present moral truths without the pressure of verisimilitude. On this reading the Puritan past is chosen because it makes the moral structures of guilt, concealment, and inherited sin legible in a way that contemporary social detail does not. A reader who is shown Hester Prynne's public shame is being asked to see the mechanics of public judgment, and the mechanics do not change with the calendar. Defenders such as those who follow the Bercovitch line on the American jeremiad argue that the Puritan inheritance is itself a present concern, because the American self-understanding as a chosen and self-judging people is continuous with the rhetoric of the reformers. On this view Hawthorne's costume is a way of reading the reformers' own idiom back to them, and the displacement lets him do it without the partisan heat that would make a contemporary novel a pamphlet.\n\nA second defence goes further. Escapism is a charge about motive, and motive is hard to establish from texts. The fiction's preoccupations, with secrecy, the price of public confession, and the corruption that passes for virtue, are themselves a response to the social world of the 1840s, in which reputation and respectability were political instruments. A romance that dramatises how a community punishes a sin it has not examined is not an evasion of the community; it is a portrait of it.\n\nThe verdict here leans against the strong form of the charge and toward a weaker, more interesting version. The displacement defence succeeds as a reading of the romances: *The Scarlet Letter* is not about the 1840s, but its account of how a community manages sin in public is recognisable as a theory of social judgment, and the romances are at their best exactly where the costume is worn most lightly. The defence fails, however, where it is asked to cover the omissions. The romances have very little to say about the institutional sins of Hawthorne's own generation, and the Custom House introduction, which is the closest thing to a self-portrait in the fiction, presents the author's own political exile from the present with a pleasure that does not survive close reading. The honest position is that the costume is real and does work, but it does not account for everything the costume leaves out.\n\n## Paralysis: Reform, Brook Farm, and the Monomaniac Reformer\n\nThe second charge is the most often repeated. Hawthorne's moral psychology locates sin in the heart, and the heart, on this account, does not reform by external means. The reformer is therefore either hypocritical or blinded by his own egotism, and his efforts to improve the world are at best a displacement of his private pride. The charge is that this vision leaves no room for political action: if every attempt at reform is contaminated by the will that undertakes it, then reform is not merely hard but suspect, and a reader who takes the fiction seriously will conclude that the honest course is to do nothing about the world but watch one's own soul. The strongest version of the charge points to three figures. The first is Hollingsworth in *The Blithedale Romance*, a philanthropist who has devoted his life to the reform of criminals and who is shown, in the novel, as a man whose benevolence is a monomania that consumes the people around him. The second is Zenobia, who in the novel is an advocate for women's rights and who is destroyed in part by her own pride and by Hollingsworth's indifference. The third is Brook Farm itself, the Transcendentalist community that Hawthorne joined in 1841 and left within the year, and which the novel presents as a scene of comic and bitter self-deception.\n\nThe record of Brook Farm is well established. Hawthorne joined the community in the spring of 1841, put money into it, and left in the autumn of the same year, and his own letters and notebooks from the period express a mixture of hope and disillusion. The novel's portrait of the community is not a neutral report, and the chapter takes no view that the novel is a neutral source for the history of Brook Farm. The charge that the novel is contemptuous of reform has real purchase, and it is reinforced by the way Coverdale, the narrator, observes the reformers with a detachment that begins to look like contempt. A critic can argue that the novel asks us to see every reformer as Hollingsworth and every reform as a stage for personal vanity, which is precisely the paralysis the charge names.\n\nThe best defence is that the novel is an examination of motive rather than a verdict on the cause. Hollingsworth's monomania is not presented as a refutation of prison reform; it is presented as a demonstration that a cause can be served by a man who is not free to see his own use of other people. The novel's irony bears on the reformer's self-knowledge, not on the goal. A defender can point out that Hawthorne's own life of reform was complicated but real in one respect: he was a writer who, in the Custom House years and then at Liverpool, held and used public office, and who never claimed that the official world was innocent of corruption. On this reading the pessimism is a discipline that makes reform more honest, not less possible. The defender can add that Zenobia's fate, read carefully, is not simply a judgment on women's rights. Her pride is shown as the pride of a woman whose public gifts have no public outlet, and the novel's sympathy for her is at least as strong as its judgment.\n\nThe verdict is that the paralysis charge is defensible as a reading of the novel and not defensible as a description of Hawthorne's politics. The novel does make reform look dangerous to the reformer, and it does treat the Brook Farm experiment with a disdain that the record does not fully support, since the community had its own serious members and serious aims. The best defence succeeds in showing that Hawthorne's pessimism is about motive and not about goals, and that a reader who wants a reform-minded Hawthorne will have to look for him in the notebooks and the public record rather than in the romances. The evidence leans toward the view that the romances are strongest as analyses of how good causes are corrupted by the people who serve them, and weakest as guidance for those who serve.\n\nTwo points about Zenobia deserve particular care. The identification of Zenobia with Margaret Fuller is widely made in criticism and was a commonplace of contemporary reading, but it remains an identification and not a documented intention on Hawthorne's part, and the chapter treats it as a defensible reading rather than an established fact. The novel's handling of Zenobia is also one of the places where the charge of paralysis and the charge about women converge, and the reader should keep the two charges separate: a novel can be harsh on a reformer's pride without being harsh on the cause of women's rights, though the two are hard to disentangle in Zenobia's case.\n\n## The Pierce Biography and the Price of Loyalty\n\nThe third charge concerns the *Life of Franklin Pierce*, the campaign biography Hawthorne wrote in 1852 for his Bowdoin classmate, who was then the Democratic candidate for president. It is the most documented of the objections, and it is the one on which the case against Hawthorne is least dependent on interpretation.\n\nThe text is a published work, and its status is not in doubt. The Project Gutenberg transcription of the *Sketches and Studies* volume, which contains the *Life* as its opening work, gives the preface dated Concord, 27 August 1852. Its sixth chapter is titled \"The Compromise and Other Matters,\" and it is the chapter on which the critique of the book centres. There Hawthorne writes that Pierce \"was true to the principles which he had long ago avowed,\" and that Pierce's approval \"embraced the whole series of these acts, as well those which bore hard upon northern views and sentiments.\" The chapter's account of the slavery question is the most damaging passage for the defence. It presents one view of slavery as one that \"looks upon slavery as one of those evils which divine Providence does not leave to be remedied by human contrivances,\" and it describes that view as \"probably as wise a one\" as any. It also records Pierce's position against antislavery agitation in the sentence \"if this work must be done, let others do it.\" The chapter then turns to the Fugitive Slave Law, through a letter from an antislavery committee asking Pierce's correspondent about the law, and the biography quotes the correspondence's view that the law was unconstitutional, unjust, and oppressive, without answering it on the merits so much as by placing Pierce above the dispute.\n\nThese passages were transcribed in this essay from the Project Gutenberg text, and the wording should be checked against the Centenary Edition before it is quoted in a published argument. The sense of the passages is not in doubt.\n\nThe charge against the biography has three strands. The first is that Hawthorne, who had written the most searching American fiction about inherited guilt, used his talent to whitewash a candidate whose record on the Compromise measures included enforcement of a law that the antislavery press regarded as monstrous. The second is that the biography's handling of slavery is a deliberate evasion, which treats the institution as a providential burden rather than a moral wrong and which makes the Fugitive Slave Law a matter of constitutional obligation rather than human injustice. The third is that the friendship and the post are connected. Hawthorne was appointed to the consulship at Liverpool in 1853 after Pierce won the election, the post was one of the most lucrative in the consular service, and the office was widely understood as a reward. The Bowdoin finding aid gives the tenure as 1853 to 1857. A Shapell Manuscript Foundation essay describes the post as a gift of gratitude, and the critic can argue that the biography and the appointment belong to the same transaction.\n\nThe best defence has several parts, and they should be stated fully. The first is that the biography is a campaign document in a genre that required partisan advocacy, and that a reader who expects a campaign life to be a critical history has misunderstood the genre. The second is that Hawthorne's account of Pierce's position on the Compromise is not, in itself, an endorsement of the Fugitive Slave Law's cruelty, and that the passage on Providence is presented as one view among others rather than as the author's own. The third is that Hawthorne's friendship with Pierce was a personal loyalty dating from their student days at Bowdoin, and that loyalty is a moral category which the romances themselves treat as valuable. Hawthorne's fiction is full of characters whose fidelity to a person outlasts their judgment of that person's conduct, and the defender can argue that the biography is a case in point. The fourth is that the appointment was not a bribe, because Hawthorne did not write the biography in exchange for it and the office was not offered as the price of the book. A defender can point to the disagreement among sources about whether the consular salary was an issue Hawthorne himself raised, and about whether Congress later fixed it at $7,500, as evidence that the financial dimension of the appointment has been overread.\n\nThe verdict leans against the defence on the biography's treatment of slavery, and the defence's best arguments are strongest about the genre and the friendship rather than about the substance. A campaign life can be partisan, but the passages on the Compromise and the Fugitive Slave Law are not neutral reporting; they take a side, and the side is the candidate's. The claim that the providential view is merely one view among others is true as a description of the text and misleading as a description of its effect, because the biography presents the view with evident sympathy and does not give the antislavery critique anything like the same weight. The friendship defence is persuasive as a description of Hawthorne's character and less persuasive as a justification of the book, because the book was a public act with a public purpose. On the appointment, the evidence is thin in both directions. Gratitude is a plausible motive, and the record does not show a quid pro quo, so the critic should argue the relation and not the bargain. The defensible claim is that Hawthorne's political loyalty was real, that it shaped his public writing in 1852, and that the biography is the clearest case in the corpus of a writer who could see the moral structure of guilt in others and did not apply the same scrutiny to the cause he served.\n\nIt is worth adding a note on what the biography does not show. The *Life* is a document about a candidate's record, and it is not evidence of Hawthorne's private views on slavery. Readers should be cautious about inferring those views from a campaign text, and the same caution applies to the Liverpool years. The letters and notebooks that would show Hawthorne's private judgment are the record the chapter most needs and could not locate in a usable form for this essay.\n\n## The Liverpool Consulship and the Silence of the Dispatches\n\nThe Liverpool years are the least documented part of the Hawthorne record that bears on this critique. The consulship is well established as a fact: Hawthorne held it from 1853 to 1857, and his family remained in Liverpool for some time after his tenure ended. Its political meaning is contested. The critic reads the appointment as a reward for loyalty, a sinecure that kept a novelist in comfortable exile from the sectional crisis while the country moved toward war. The defender reads it as a job that a man with a family and no independent income needed, in which the work of certifying cargo and handling American seamen was ordinary administration rather than political service.\n\nThe strongest version of the charge is that the Liverpool years are the period in which Hawthorne's public conscience was most in abeyance. The novelist who had written about inherited guilt was, for four years, the official representative of a government whose policies on slavery and expansion were the subject of the most passionate moral argument in the country. A critic can argue that Hawthorne's silence in the period, in the public record and in the surviving letters, is the silence of a man who has bought his comfort with his reticence. The defence is that the record of the period is largely private and that a consul's dispatches, which might have shown official engagement with the questions of the day, are the kind of document that would settle the matter. The chapter's most serious limitation is that it could not locate the dispatches in a usable published form, and so it cannot say whether they show engagement or indifference. The search for this chapter turned up only background on the appointment, the pay disputes, and the Bowdoin holdings of personal letters, among them a letter to his old friend Horatio Bridge dated 22 August 1856. Those letters are personal, not official dispatches, and a reader should not take them as a substitute.\n\nThe pay dispute is itself a useful test of the critic's method. Sources reached in the search disagree about whether the figure of $7,500 was a sum Hawthorne asked for or a salary Congress later fixed, and they differ on how the consular fees worked in practice. A critic who wants the appointment to look like a favour can read the complaints about pay as the grievance of a man who expected more from his patron. A defender can read the same complaints as the ordinary frustration of a salaried official with a large household and fee income that was hard to predict. Neither reading can be settled on the evidence this chapter could assemble, and the disagreement is a reminder that the Liverpool record is thinner than the biography record, and that conclusions drawn from it should be held more loosely.\n\nA further point concerns the period of the consulship itself. The appointment ran through the years of the Crimean War, the Kansas crisis, and the run-up to the election of 1856, and it ended, by the Bowdoin dating, in 1857, a year of financial panic in the United States. The family remained in Liverpool after the tenure, and the Italian journey that produced *The Marble Faun* followed. A critic who wants to link the consulship to the silence on slavery has to decide how far the consular position itself, rather than the author's temperament, explains that silence. Official office in a foreign port is a position of restraint, and a consul who wrote publicly against his own government's domestic policy would have been acting outside the role. That structural explanation is not an excuse, but it is a rival hypothesis, and the critique is stronger if it addresses it directly rather than assuming that reticence can only be a personal failing.\n\nThe chapter therefore leaves the Liverpool question open in an important sense. The charge that the consulship marks a silence is defensible on the evidence of the biography, the appointment, and the absence of public antislavery statements that the chapter could find. The defence that the consular record might show more is also defensible, because the dispatches have not been examined here. A reader who wants to settle the matter should consult the consular correspondence in the national archives and the published Hawthorne letters, and should treat the verdict in this chapter as provisional on that point.\n\n## Silence and Ambivalence on Slavery in the Romances\n\nThe fourth charge is broader than the biography. It is that the romances, which are the most searching fiction of their generation about guilt and inheritance, say almost nothing directly about slavery, the institution that was the central moral question of the antebellum republic. On this reading the romances are the work of a writer who saw the moral structure of sin in the Puritan past and did not look for the same structure in the American present, and whose silence was itself a political act.\n\nThe strongest form of the charge is that the silence is structural. Hawthorne's fiction works by placing guilt in private and historical contexts, and its most famous sins are sexual, intellectual, or familial. Slavery is a sin of public power, and the romances' method is poorly suited to it, because a fiction that locates guilt in the individual heart can represent a master's cruelty only as a private failing rather than as the foundation of an economy. The critic can point out that the romances do have figures who hold power over others, Chillingworth and Pyncheon among them, and that the power these figures exercise is always personal and psychological. The result is a moral psychology that cannot see the institutional forms of domination that it claims to diagnose. The silence is not the absence of a theme but the presence of a limit, and the limit reflects the writer's own political positions.\n\nThe best defence is that the romances are more engaged with the question of domination than the silence charge allows. Hawthorne's fiction is intensely concerned with the way one person's will can control another, and that concern is not confined to the sexual or familial. The defence can point to *The House of the Seven Gables*, where the Pyncheon fortune is built on a seventeenth-century dispossession and where the sins of the family are the sins of property and of its concealment. A reader who sees the Pyncheon house as a figure of inherited property built on injustice is reading the novel as a sustained image of the structures that slavery also depended on, and the defence argues that the romances teach the reader to see those structures without naming the institution. On this reading the silence is a rhetorical choice that allows the reader to make the connection, and the choice was not without risk in a country where the connection was already fiercely contested.\n\nA second defence is biographical. Hawthorne's private letters are not silent on the sectional crisis, and the chapter notes that the Bowdoin and related collections hold letters from the period that the search did not reach. The defender argues that the public silence is a poor guide to private judgment, and that the critic has to examine the letters before concluding that the author was indifferent.\n\nThe verdict is that the silence charge is one of the strongest in this chapter, and that the defence succeeds only in showing that the romances are not blind to power. The Pyncheon reading is persuasive, but it is a reading, and it requires the reader to supply the connection that the text does not make. The biography is a more direct case, because it speaks about slavery explicitly and takes a side. The honest assessment is that the romances are about domination and property in ways that touch the slavery question, but they do not confront the institution as such, and the writer's failure to do so is one of the real limits of the fiction. The defence is strongest as a claim about the romances' moral structure and weakest as a claim about their political courage, and the chapter treats that difference as the central point. A reader who wants a Hawthorne who spoke out on slavery will not find him in the romances. A reader who wants to understand why the romances nevertheless carry so much of the moral weight of their period will find the answer in the way they teach the reader to see property and power as inherited guilt.\n\nIt is important to be exact about the legal and political context the critic invokes. The Compromise of 1850 included the Fugitive Slave Act, which made federal officers and citizens responsible for the return of fugitives even in free states, and the Act was enforced under Pierce's administration. The Anthony Burns case in Boston in 1854 is the most famous instance of that enforcement, and the reaction to it in Massachusetts was intense. Hawthorne was living in the state during these years, and the critic is entitled to ask why his fiction, which is so attentive to public judgment, does not register the Burns case or anything like it. The searches did not turn up a Hawthorne letter on the Fugitive Slave Act or the Burns case, and this chapter does not claim that such a letter does not exist. The one letter the searches did find that addresses slavery directly is dated June 15, 1851, some three years before the Burns case, and in it Hawthorne tells a Salem friend that he has \"not, as you suggest, the slightest sympathy for the slaves\" (as quoted in History News Network). The question of his silence in the 1850s remains open.\n\n## Women as Critique or Fantasy: Hester, Zenobia, Phoebe, and Miriam\n\nThe fifth charge concerns the women of the romances, and it is the most contested of the six. The strongest version of the charge is that Hawthorne's women are fantasies of gender that the fiction uses to examine male guilt. Hester Prynne is the bearer of public shame, and her sin is the occasion for the men's moral drama. Zenobia is a woman of intellect and public ambition whose fate is decided by the men around her. Phoebe in *The House of the Seven Gables* is a model of domestic light, and her function is to restore a house of male failure to health. Miriam in *The Marble Faun* carries a secret that the men of the novel use to define their own consciences. On this reading each woman is an instrument, and the fiction's sympathy for them is a sympathy for the men who are made to see themselves through them.\n\nThe critic's case can be strengthened by the record of the period. The 1840s and 1850s were years of intense argument about the position of women, and the romances' women are placed within that argument without quite joining it. Zenobia is the clearest case, because the reader is invited to identify her with a real public figure whose advocacy of women's rights was known to Hawthorne's circle, and the novel's treatment of her ends in her suicide. A critic can argue that the fiction punishes the woman who claims public authority and redeems the woman who accepts domestic subordination. Hester's fate, the critic adds, is to be restored to a life of charity rather than to any public or sexual authority of her own.\n\nThe best defence has two parts that need to be kept distinct. The first is that the romances are a critique of gender and not a simple expression of it. Hawthorne's women see the men with an acuity that the men lack, and in *The Scarlet Letter* the conclusion, in which Hester returns to Boston and looks forward to a time when women's position will be different, is a prophecy about gender that the fiction does not make comfortable. The phrase about a \"new truth\" in that conclusion, to be revealed by a future prophet, is a reference the defence can use to argue that Hawthorne saw the existing order of gender as provisional and historically specific. The second is that the critic's reading of Zenobia depends on taking her as a representation of women's rights, when the novel's Zenobia is a complicated figure whose pride and public performance are shown as the pride of a woman whose gifts have no proper outlet. The defender can argue that the novel's sympathy for her is real and that its judgment is aimed at the men who fail to see her, at least as much as at her own excesses.\n\nThe verdict is that the gender charge is defensible in its strong form as a reading of the romances' outcomes and that the defence succeeds as a reading of their method. The romances do place their women within a moral drama that centres on men, and the outcomes for the most ambitious women, Zenobia above all, are harsh. But the fiction's women are also the most perceptive observers in their texts, and the fiction does not say that the existing order is natural. The honest reading is that the romances are a critique of gender in the sense that they show its costs to everyone who lives within it, and a fantasy of gender in the sense that the costs are borne mostly by women and resolved mostly by male conscience. Nina Baym's influential argument that the romances are revisionist in their treatment of women has been a central point of reference, and the chapter's own assessment is that her reading is strong on the critique and weaker on the fantasy. The chapter reports the secondary reading of Judith Fryer, as cited in the search, that Hawthorne presents patriarchal attitudes alongside conflicting ones, and it reports Leland S. Person's view, as cited in secondary summaries, that Hawthorne is not a feminist in the nineteenth-century sense and that *The Scarlet Letter* is unsettling in its treatment of women. The chapter could not confirm the primary texts of those arguments in this essay, and it presents them as characterised in the secondary sources that the search reached.\n\nIt is worth noting one interpretive risk the critic should avoid. Zenobia's identification with Fuller is a widely repeated claim, but the chapter treats it as a defensible reading and not as a fact about Hawthorne's intention. A critic who builds an argument about Hawthorne's view of women's rights on that identification is building on a reading that the text invites and does not establish, and the argument should say so.\n\n## The Charge of Overdetermined Symbolism\n\nThe sixth charge is the one most often made by readers who find the romances difficult. It is that Hawthorne's symbols are so densely loaded that they cannot bear interpretation. The scarlet letter means adultery, pride, artistic power, and the \"A\" of an angel, among other things. The rose bush by the Boston prison, the black veil of Mr. Hooper, the chequered shadow of Pyncheon, the marble faun, and the brook that runs through the Seven Gables all carry meanings that the text makes available without deciding among them. The critic says that a symbol that means everything means nothing in particular, and that the romances' method is a way of avoiding the commitment that a moral fiction requires. The strongest version of the charge places this method within the older tradition of allegory that Hawthorne's contemporaries thought he had outgrown, and treats the symbolism as a substitute for argument.\n\nThe best defence is that the overdetermination is itself a claim about moral experience. Guilt, concealment, and conscience are not single things, and the romances represent them as multiple because the characters experience them as multiple. The scarlet letter is not an allegory with a fixed key; it is a sign that the community and the wearer read differently, and the novel's interest lies in the gap between those readings. A symbol that means different things to different people is, on this reading, the right instrument for a fiction about public judgment. The defender can add that the romances use their symbols with a discipline that the charge ignores. The rose bush, the veil, and the letter recur with changing functions, and the reader who attends to the changes finds a logic to the symbolism that is not a logic of fixed equivalence.\n\nThe verdict is that the overdetermination charge is defensible as a description of the reading experience and weak as a description of the texts' structure. The symbols do resist single readings, and a reader who wants a key will be disappointed. But the resistance is patterned, and the patterns are the substance of the fiction. The charge most accurately applies to the late romances, especially *The Marble Faun*, where the symbolism sometimes accumulates faster than the narrative can absorb it, and the defence is weakest there. The chapter's view is that the symbolism of the major romances is a strength when it is read as a theory of how meaning is distributed among individuals and communities, and a weakness when it is read as a set of puzzles to be solved. The critic who finds the romances empty has mistaken the difficulty of the sign for its absence.\n\n## Where the Weight Lies\n\nSetting the six charges side by side, the chapter's assessment is uneven, and the unevenness is itself a finding. The political charges, the Pierce biography and the silence on slavery, are the best documented and the hardest to answer. They do not depend on contested readings, because the biography is a text and the Fugitive Slave Act is a statute with a known history. The defence of those charges is strongest where it concerns the genre of the campaign life and the moral category of personal loyalty, and weakest where it concerns the substance of the passages on slavery. The aesthetic charges, escapism and symbolic overdetermination, depend more on the reader's expectations of romance, and the defence of them succeeds more often than the charge. The charges about paralysis and about women are the most interesting, because they turn on real ambiguities in the romances. The romances do make reform look dangerous and do place women within a drama of male conscience, and they also contain some of the most searching critiques of their period's moral psychology. The reader who wants a single verdict on Hawthorne's relation to reform or to women will be disappointed, and the chapter thinks that disappointment is the right response to the texts.\n\nThe most important distinction the chapter draws is between the romances and the man. The critic is right that the romances are more ambitious than their author's public conduct, and that the Liverpool years and the Pierce biography show a loyalty and a reticence that the fiction's moral seriousness does not fully account for. The defence is right that the romances are not simply the expression of their author's political positions, and that a fiction can see guilt more clearly than the person who writes it. Neither side can settle the question by appeal to the other, and the chapter's verdict is that the two must be held apart. The romances are a serious moral inquiry into inherited guilt, concealment, and the limits of reform, and they are limited by their refusal to confront the institutional forms of domination that were the great question of their age. The man was a loyal friend and a dependent officeholder, and his public record in 1852 and after shows the limits that the fiction, for all its acuity, does not overcome.\n\n## A Closer Look at the Strongest Single Text: The Blithedale Judgment\n\nOf all the romances, *The Blithedale Romance* is the one on which the paralysis and women charges meet most directly, and it repays a longer look. The novel is narrated by Miles Coverdale, a man who joins a reform community, in the novel's own account, partly from a wish for a more real form of fellowship, and who spends the book watching the people around him make decisions he declines to make himself. The narrator's detachment is the first thing a critic notices. He is an observer of the reform, a man who loves the idea of the community and withholds himself from its labour, and the novel's irony often falls on his own refusal to act. A critic who reads the novel as a case against reform has to reckon with the fact that the most damning portrait of a reformer is delivered by a narrator whose inaction is at least as culpable. A defender can use the same fact in the opposite direction: the novel is a study of the observer's complicity, and Coverdale's inertia is the target rather than the reform.\n\nThe novel's treatment of Hollingsworth is the second point of pressure. Hollingsworth's commitment to the reform of criminals is presented as real and as ruinous. He uses Zenobia's money and Priscilla's devotion, and he is blind to the emotional cost of his cause to the people who serve it. The strongest version of the charge is that Hawthorne could imagine no reform that did not require a sacrifice of the self to the cause, and that he presented that sacrifice as a moral failing rather than as the price of seriousness. The best defence is that Hollingsworth's failing is a specific failing, the failing of a man who does not see other people as ends, and that the novel's judgment is aimed at that failing rather than at the reform. On this reading Hawthorne's distrust is of the monomaniac, and a reformer who keeps a sense of others' claims is not condemned by the book.\n\nThe third point is the Zenobia plot, where the charges about reform and women become one. Zenobia's public speech, her theatrical performance of independence, and her eventual death are the centre of the novel's melancholy. A reader who takes the Fuller identification seriously will see in her fate a judgment on the public woman, and a reader who takes the novel's own voice seriously will see a woman whose gifts are wasted by a society that offers her only a stage. The chapter's verdict is that the novel's sympathy is real but that its structure places Zenobia's excess at the centre of the tragedy, and that the reader who wants Hawthorne to be a clear ally of women's public ambition will find the book more ambivalent than hoped. The defender is right to note that the men are judged too, and the critic is right that the judgment falls more heavily on the woman who claims a public voice than on the men who prevent her from using it.\n\nThe novel also ends without the consolations of its predecessors. The Seven Gables closes with a reconciliation and a sort of restored domestic order; Blithedale closes with a death, a dissolution, and a narrator who has gained nothing he can use. A critic can read that ending as the fullest expression of the pessimism that drives the paralysis charge. A defender can read it as the novel's refusal to offer a comfort it does not believe in, which is a form of honesty about the limits of reform rather than a counsel of despair. The verdict is that the ending is the strongest evidence for the charge and also the strongest evidence that the novel is an inquiry rather than a manifesto.\n\n## The Sins of Property: Seven Gables and the Limits of the Defence\n\nThe Pyncheon reading, which this chapter has treated as the best available defence of the romances against the silence charge, deserves a sharper test than it has so far received. The Pyncheon house is built on a seventeenth-century dispossession, the accusation of witchcraft against Matthew Maule, and the seizure of his land. The novel's sins are the sins of property: the fortune is held by a family that has forgotten the injustice on which it rests, and the present members of the family are shaped by the inheritance of that forgetting. The defender can argue that this is a fiction about the moral structure of property and inheritance, and that the same structure underlies the plantation economy whose legal and moral sanction was the Fugitive Slave Act. The argument has force, because Hawthorne's ancestors are also in the story, and the novel's preoccupation with the sins of the fathers has a close kinship with the Puritan thought that the whole corpus examines.\n\nThe test is whether the argument can be made without turning the novel into an allegory it does not announce. The critic should press the point hard. Maule's dispossession is a dispossession of a particular man by a particular family, and the novel's moral is that inherited property carries inherited guilt. That is a claim about property in general, and the claim is compatible with a reading that makes slavery one of its instances. But the novel never names slavery, never represents an enslaved person, and never makes the institution of human property the subject of its judgment. The limit of the defence is therefore exact: the Pyncheon reading shows that the romances can think about domination and inheritance in ways that touch the slavery question, and it does not show that the romances confronted slavery. A critic who presses the defence too far will find it turning into the very evasion it was meant to answer.\n\nThe defence can be refined in one direction, which is toward the figure of Clifford and the prison that the Pyncheons have made of him. Clifford's imprisonment is the imprisonment of a man whose freedom has been taken by the family's sins, and his release is the moment at which the novel most closely approaches a claim about freedom as a social condition. The defender can argue that Clifford's freedom is the novel's most explicit political image. The critic can reply that the freedom in question is psychological and familial, the release of a man from the consequences of his family, and that the novel makes no claim about the freedom of those whom the family has dispossessed. That exchange is one the chapter thinks is genuinely open, and the honest assessment is that it can be argued in both directions.\n\n## Symbol, Method, and the Late Romance\n\nThe symbolism charge is sharpest when applied to *The Marble Faun*, and the chapter's earlier discussion needs one addition. The late romance is set in Rome and Tuscany, in a world of art and sculpture, and its symbolism is at once more explicit and more diffuse than the symbolism of the earlier romances. The faun, the catacombs, the tower, and the Medici copy of the Faun all carry meanings that the characters debate and that the narrator declines to settle. The critic can argue that the late romance has lost the discipline that made the earlier symbolism work, and that the symbols now stand for a set of moral possibilities that the novel cannot choose among. The defence is that the late romance is a meditation on the relation between art and sin, and that its refusal to settle the meaning of the faun is the point, since the novel's interest is in the way a work of art receives and deflects the viewer's moral projections.\n\nA reader who attends to the novel's own commentary will find that the narrator is aware of the problem. The narrator reflects on the difficulty of reading the faun, the sculpture, and the characters' moral condition, and he does so in terms that anticipate the critic's objection. That self-consciousness is a real defence, because it means the overdetermination is a theme the novel examines rather than a failure it hides. But the defence has a limit: a novel that thematises its own difficulty can still be too difficult, and the reader who finds the late symbolism tiresome has a case that the self-consciousness does not answer. The verdict on the late romance is that the symbolism is strongest when it is read as a theory of art and weakest when the reader expects it to deliver a moral conclusion the novel withholds.\n\nThe broader point is methodological. Overdetermination is a charge that presupposes a standard of determinacy, namely that a good symbol should have a single correct reading. Hawthorne's romances reject that standard in favour of a model in which the symbol's meaning depends on the observer, and in which the observer's own sin or innocence is part of what the symbol reveals. That model can be defended as a serious account of how moral meaning is produced, and it can be criticised as a way of avoiding the commitments a moral fiction is supposed to make. The chapter's view is that both positions are available and that the choice between them depends on what a reader thinks a romance is for.\n\n## Open Questions\n\nThe first open question is what the Liverpool consular dispatches contain. The chapter could not locate them in a usable published form, and their content would bear directly on whether the consulship was a period of official silence or of official engagement with the questions of the day. A reader who wants to settle the political charge should look at the consular correspondence in the national archives before concluding.\n\nThe second is whether Hawthorne's private letters of the 1850s contain a considered view of the Fugitive Slave Act, of the Burns case, or of slavery as a question. The searches reached one private letter on slavery, from 1851, but none from the 1850s that addresses the Act or the Burns case, and the absence of a public statement is not the same as the absence of a private one. The Bowdoin and Peabody family collections are the obvious places to look.\n\nThe third is how far the Zenobia and Fuller identification should shape an argument about Hawthorne's view of women's rights. The identification is widely repeated, but the text invites it rather than establishing it, and a critic who builds on it should say so.\n\nThe fourth is whether the Pyncheon reading of *The House of the Seven Gables* as an image of property built on dispossession can be pressed further as an account of slavery, and whether that reading is a defence of the romances or a way of relieving them of a judgment they do not make.\n\nThe fifth is how much weight the late romances, especially *The Marble Faun*, should carry in a charge of overdetermination, given that the symbolism there may be a sign of the writer's exhaustion as much as of his method. That question is one of periodisation, and the chapter does not settle it.\n\n## Sources\n\n1. Nathaniel Hawthorne, *The Life of Franklin Pierce* (1852), preface dated Concord, Mass., 27 August 1852, in *Sketches and Studies*, Project Gutenberg eBook #8091. Publisher: Project Gutenberg. URL: https://gutenberg.org/files/8091/8091-h/8091-h.htm. Tier 1 (primary text, digital transcription). Note: passages quoted here were read from this transcription in this essay; check wording against the Ohio State University Press Centenary Edition before publication.\n\n2. Nathaniel Hawthorne, *The Blithedale Romance* (1852). Tier 1 (primary text). Note: read for the Hollingsworth and Zenobia passages; cite the Centenary Edition for page references. URL not confirmed in this essay.\n\n3. Nathaniel Hawthorne, *The Scarlet Letter* (1850). Tier 1 (primary text). Note: the Custom House introduction and the closing chapter are cited for the account of romance and for the prophecy about women. URL not confirmed in this essay.\n\n4. Nathaniel Hawthorne, *The House of the Seven Gables* (1851). Tier 1 (primary text). Note: the Pyncheon property and the preface are cited. URL not confirmed in this essay.\n\n5. Nathaniel Hawthorne, *The Marble Faun* (1860). Tier 1 (primary text). Note: cited for the late symbolism. URL not confirmed in this essay.\n\n6. Ohio State University Press, *The Centenary Edition of the Works of Nathaniel Hawthorne*. Tier 2 (scholarly reference edition). Note: the reference text the chapter recommends for quotation; not consulted directly in this essay. URL not confirmed in this essay.\n\n7. Bowdoin College Library, \"Guide to the Nathaniel Hawthorne Collection, 1819–2000.\" Tier 1 (institutional finding aid). URL: https://library.bowdoin.edu/arch/mss/nhg. Note: cited for the consulship tenure (1853–1857) and the consulate-period letters to Horatio Bridge; the summary was read through search results and the page was not opened in full in this essay.\n\n8. Herman Melville, \"Hawthorne and His Mosses\" (1850), in *The Literary World*. Tier 1 (primary, contemporaneous review). Note: named as the foundational reception essay; the text was not fetched in this essay and should be checked before quotation. URL not confirmed in this essay.\n\n9. Shapell Manuscript Foundation, essay on the Franklin Pierce biography and the friendship. Tier 5 (document-collection institution, analytical commentary). URL: https://www.shapell.org/manuscript/franklin-pierce-nathaniel-hawthorne-biography-friendship/. Note: cited for the reading of the consulship as a gift of gratitude; read through search results, not opened in full.\n\n10. Concord Free Public Library, Nathaniel Hawthorne item record. Tier 5 (local institutional summary). URL: https://sc.concordlibrary.org/items/show/2029. Note: cited for the Concord objections to the Pierce biography and Emerson's role at the funeral; read through search results, not opened in full.\n\n11. Leland S. Person, *The Cambridge Introduction to Nathaniel Hawthorne* (2007). Tier 2 (scholarly monograph). Note: cited for the view that Hawthorne is not a feminist in the nineteenth-century sense; the position was read in secondary summary and the book was not consulted directly in this essay. URL not confirmed in this essay.\n\n12. Nina Baym, essays on the revisionist reading of *The Scarlet Letter* and on women in the American romance. Tier 2 (scholarly). Note: cited as secondhand through the secondary sources the search reached; the essay itself, including the title given in the planning notes, was not located or confirmed in this essay.\n\n13. Shari Benstock, scholarly discussion of Hawthorne's patriarchal and feminist elements. Tier 2 (scholarly). Note: cited as secondhand through a student thesis in search results; the original was not consulted in this essay.\n\n14. Judith Fryer, *The Faces of Eve: Women in the Nineteenth-Century American Novel* (1976). Tier 2 (scholarly monograph). Note: cited as secondhand through a search summary; the original was not consulted in this essay.\n\n15. Long Road to Justice, \"Anthony Burns and the Fugitive Slave Act.\" Tier 5 (advocacy-educational summary). URL: https://www.longroadtojustice.org/topics/slavery/anthony-burns.php. Note: cited for the general account of the Burns case and the Fugitive Slave Act; read through search results, not opened in full.\n\n16. Massachusetts Historical Society, manuscript holdings relating to the Burns case, including a letter of Mary E. Blanchard, 4 June 1854. Tier 1 (archival). Note: the holding was identified through secondary search results and the letter itself was not examined in this essay. URL not confirmed in this essay.\n\n17. The Compromise of 1850 and the Fugitive Slave Act (1850), 9 Stat. 462. Tier 1 (statutory primary text). Note: the statute is cited for its content; the chapter did not fetch the statute text in this essay. URL not confirmed in this essay.\n\n## A Note on What Was Not Confirmed\n\nThis chapter's sources were read under real constraints. The Liverpool consular dispatches were not located. The Hawthorne letters on the Fugitive Slave Act and the Burns case were not located. The primary texts of Nina Baym, Judith Fryer, Shari Benstock, and Leland S. Person were not consulted directly, and their positions are reported as characterised in secondary sources. Several figures in the secondary record disagree or rest on thin sourcing, including the sales figure for the Pierce biography and the consular salary, and the chapter does not adopt them. Where a conclusion depends on a point the sources do not settle, it is marked as provisional, and a reader should treat the conclusions about the Liverpool years and the letters as open."}, {"order": 7, "file": "Future_Trajectory.md", "title": "Nathaniel Hawthorne's Standing Through 2050", "summary": "", "body": "# Nathaniel Hawthorne's Standing Through 2050\n\n## Bottom Line\n\nHawthorne is more likely than not to be read, taught and argued over in 2050, and about seven chances in ten that he is still counted among the core American writers of the nineteenth century. The real uncertainty is what kind of writer he will be taken to be inside that core. The field now pulls him three ways: toward a historian of Puritan moral argument, toward a psychologist of conscience, and toward a romancer of nationhood whose political record is documented and unresolved. This outlook gives the largest weight, about one in two, to a stable center in which the psychology of guilt remains the usual way in. It gives about one in six to a revival driven by new editions and new readings. The rest falls to two kinds of demotion: a drift into specialism, and a reclassification as a regional or genre writer. The ranges are wide on purpose, because the reference classes are small.\n\n## How the Numbers Were Reached\n\nNo live prediction market exists for Hawthorne's reputation, and none is expected, so the prediction-market check is recorded as empty. Every probability below comes from one of three processes: a count from a reference class, a product of conditional steps, or a rate projected from a counted record. The counts come from the standard literary-history record as recalled, and from the bibliography the other essays in this study cite. They were not checked against a database for this outlook. The items to confirm are listed at the end.\n\nThe chain runs in six steps.\n\n1. **Core retention, outside view.** The five writers F. O. Matthiessen made the core of the American Renaissance in 1941 (Emerson, Thoreau, Hawthorne, Melville, Whitman) have all stayed in the survey core since. Five of five, over eighty-five years. A rule-of-succession estimate gives (5 + 1) / (5 + 2), about 0.86, that the class holds its place over the next stretch. The sample is tiny, so this is a prior, not a finding.\n2. **Hawthorne-specific adjustment.** Multiply by about 0.80, with a plausible range of 0.70 to 0.90. The reasons are particular to him. The romances after *The Scarlet Letter* and *The House of the Seven Gables* are taught far less than those two books and the early tales. The Pierce biography and the silences on the Fugitive Slave Act are documented in the critique essay and rest on the strongest evidence in the study. And the reception essay records a real eclipse between about 1900 and 1940, when he was called dated.\n3. **Core retention.** 0.86 × 0.80 ≈ 0.69 (range 0.60 to 0.77).\n4. **Revival.** Counting identifiable reappraisal waves since 1941 gives four: Matthiessen's recovery; the symbolism and psychoanalytic wave of about 1957 to 1966; the feminist, historicist and Puritan-history wave of about 1976 to 1991; and the renewed biographical and critical attention of about 2003 to 2007. Four waves in eighty-five years is about 0.047 a year. Over twenty-four years that gives a 0.68 chance of at least one wave (1 − e^−1.13). Only one of the four clearly lifted general standing as well as scholarship, so the lift rate is about 0.25 (range 0.15 to 0.35). Revival ≈ 0.68 × 0.25 ≈ 0.17 (range 0.10 to 0.24).\n5. **Stable center.** Core retention minus revival: 0.69 − 0.17 = 0.52 (range 0.45 to 0.58).\n6. **Demotion, and how it splits.** The residual is 1 − 0.69 = 0.31 (range 0.23 to 0.40). Its split comes from a nine-writer table of nineteenth-century American authors who had major reputations in their own lifetimes: Poe, Melville, Dickinson, Stowe, Jewett, Longfellow, Whittier, Holmes and Cooper. Across the twentieth century one kept a steady place (Poe); four were revived after an eclipse (Melville, Dickinson, Stowe, Jewett); three fell to minor or regional status (Longfellow, Whittier, Holmes); and one kept a reduced classic standing outside the core (Cooper). Among the demoted, three went regional or minor and one went specialist, a three-to-one split. So regional reclassification is 0.31 × 3/4 ≈ 0.23 (range 0.17 to 0.29), and specialist drift is 0.31 × 1/4 ≈ 0.08 (range 0.05 to 0.11).\n\nThe four end-states add to 1.00: 0.52 + 0.08 + 0.23 + 0.17.\n\n## Scenarios\n\nThe four scenarios are defined by their end-state in 2050, so they are mutually exclusive. A stable center and a revival both keep him in the survey core. Specialist drift and regional reclassification both take him out of it, and they differ on whether he keeps national standing among scholars.\n\n| Scenario | Probability | Range | Time horizon |\n| --- | --- | --- | --- |\n| Stable center | 0.52 | 0.45 to 0.58 | Steady through 2050 |\n| Specialist drift | 0.08 | 0.05 to 0.11 | Mostly 2035 to 2045 |\n| Regional and genre reclassification | 0.23 | 0.17 to 0.29 | Mostly 2035 to 2050 |\n| Revival through editions and readings | 0.17 | 0.10 to 0.24 | 2030 to 2040, if it comes |\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Scenario probabilities for Hawthorne&#x27;s standing through 2050<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Stable center<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"405.9\" y=\"8\" width=\"63.8\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"477.8\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">45–58%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Specialist drift<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"209.6\" y=\"44\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"247.0\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">5–11%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Regional and genre reclass…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"268.5\" y=\"80\" width=\"58.9\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"335.4\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">17–29%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Revival through editions a…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"234.1\" y=\"116\" width=\"68.7\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"310.8\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">10–24%<\/text><\/svg><figcaption>Each bar shows the plausible range; the midpoints sum to one. <span class=\"credit\">Source: Scenario probabilities, this outlook (reference-class counts and conditional products; no live market).<\/span><\/figcaption><\/figure>\n\n\n\n**Stable center (about 0.52).** In this end-state Hawthorne is taught in the survey core, *The Scarlet Letter* and *The House of the Seven Gables* remain the default entries, and the psychology of concealment remains the usual way in. The political record is taught as a known complication, not as a reason to remove him. The drivers are mostly the ones the close readings identify as most accessible: Young Goodman Brown, the minister's veil, Dimmesdale's scaffold and Zenobia's drowning all make guilt and concealment legible to a new reader. The theory essay adds that the moral-knowledge reading of the romance keeps him useful for courses in ethics and not only in period literature. The reception essay's established claims, including the chronology, Melville's 1850 essay and the Liverpool dates, are not in dispute, which keeps the factual base steady. The signal for this scenario is simple: the Scarlet Letter stays in the nineteenth-century sections of the survey anthologies, and adoption of the two central romances holds. No inflection is expected in this scenario.\n\n**Specialist drift (about 0.08).** General readers and survey courses drop him, the field keeps him, and his home becomes early American and Puritan history. The drivers are the historical reading the origins essay traces from Michael Colacurcio's *The Province of Piety* and the jeremiad frame of Sacvan Bercovitch. The reception essay's first open question asks whether the Puritan-history turn can be extended to the late romances, and if it cannot, the early tales become his lasting specialist claim. The origins essay also notes that Puritan vocabulary is the most checkable part of the work, which favors archival specialists. This is a low-probability end-state, but the scholarly tilt toward Puritan history is already visible, so it is the outcome that arrives first if the general readership fades. The signals are published monographs that still cite him in early-American work while general-reader editions shrink, and early-American courses that teach the tales rather than the romances. The likely horizon is 2035 to 2045.\n\n**Regional and genre reclassification (about 0.23).** He is taught chiefly as a New England Gothic or regional writer, placed beside figures such as Sarah Orne Jewett, and he drops out of the national canon in the sense that a survey treats him as a period curiosity. This is the largest demotion branch, and it draws on the critique essay, which describes the political charges as the best documented and hardest to answer. If curricula begin to pair the period with slavery literature, the Pierce biography and the 1851 letter on slavery become the reasons to replace him with writers who address the institution directly, such as Douglass and Jacobs. The reception essay's note on James's 1879 reservation about the thin social canvas of the romances, and the theory essay's point that the romance keeps moral claims at a distance, supply the aesthetic half of the same argument. The signals are falling adoption of *The Blithedale Romance* and *The Marble Faun* in survey courses, and the Pierce biography entering curriculum debates. The likely horizon is 2035 to 2050.\n\n**Revival through editions and readings (about 0.17).** New material changes the record: digitized letters, the consular correspondence from Liverpool, the notebooks and the full private correspondence of 1851 to 1857. New historicist, psychoanalytic and feminist readings reopen the romances and bring general readers back. The drivers are the gaps this study could not close: the reception essay's open questions on the Fugitive Slave Act letters and the Liverpool dispatches, the life-arc essay's questions on the Brook Farm letters and the composition of *The Marble Faun*, and the close readings' question about the later chapters of that novel. If the consular letters show sustained engagement with slavery, the political charge weakens and the revival has something concrete to rest on. If they show deliberate silence, the revival is less likely and the regional scenario gains. The signals are a born-digital letters and consular archive, a new survey anthology that restores *The Blithedale Romance*, and a book on the romances that reaches a general audience. Any revival would most likely show between 2030 and 2040.\n\n## Base Rates at a Glance\n\n- **Survey-core retention.** Five of five Matthiessen writers retained since 1941; rule-of-succession estimate 0.86 for the class, then 0.80 for Hawthorne-specific factors.\n- **Eclipse and revival among nineteenth-century major writers.** Nine writers; one steady, four revived after eclipse, three demoted to minor or regional, one reduced classic. Demotions split three regional to one specialist.\n- **Reappraisal waves.** Four identifiable waves in eighty-five years, about 0.047 a year, so a 0.68 chance of at least one in twenty-four years, and roughly one in four waves lifting general standing.\n- **Major monographs.** The study's own bibliography cites ten book-length studies from 1957 to 2007, about 0.2 a year. It cites none after 2007. That list is curated, not a census, so the gap is a signal to check rather than a finding. At 0.1 to 0.2 a year, the expected count of major monographs from 2026 to 2050 is 2.4 to 4.8, and the chance of none is about 9 percent at the low rate and about 1 percent at the high one.\n- **Born-digital editions.** Three of the five Matthiessen writers (Whitman, Dickinson and Melville, from recall) have large born-digital scholarly archives. Hawthorne has none in the sources this study reached, and his standard edition is in print. Rule of succession gives (3 + 1) / (5 + 2) ≈ 0.57 that a major born-digital Hawthorne archive exists by 2050. The timing is unknown.\n\n## What Would Change the Outlook\n\n- **Survey anthologies.** If a major survey drops *The Scarlet Letter* from its nineteenth-century section, the stable-center probability falls and the regional and specialist branches rise. If it restores *The Blithedale Romance*, the revival branch gains.\n- **The consular and private letters, 1851 to 1857.** Evidence of sustained antislavery engagement would raise the revival branch and lower the regional one. Evidence of deliberate silence would do the reverse.\n- **A born-digital letters and notebooks archive.** Publication would raise the revival branch, and it would also make the political record easier to test in teaching.\n- **Monograph flow.** Two or more major monographs from a leading press between 2027 and 2030 would restore the rate to about 0.2 a year and favor the stable and revival branches. None by 2030 would lower the rate toward 0.1 and favor the demotion branches.\n- **Where the Puritan-history readings land.** If courses adopt the tales in early-American settings more often than the romances in general courses, that is the first sign of specialist drift.\n\n## Open Questions and What to Verify\n\nThe least grounded number is the 0.80 Hawthorne-specific adjustment. If it is 0.70, core retention falls to 0.60 and the stable center to about 0.43. If it is 0.90, core retention rises to 0.77 and the stable center to about 0.60. The rest of the chain is more mechanical, but it depends on counts from recall. Before this outlook is relied on, four items need checking: the nine-writer eclipse table against the literary-history record; the four reappraisal waves and their dates; the monograph list, including any post-2007 books the bibliography missed; and the dates of the three born-digital author archives. The late-career and consular questions in the life-arc and critique essays are the most likely to move the numbers, and they are the two places where the record is thinnest.\n\nBecause every probability here is derived from counts and products rather than a market price, the outlook should be revisited when a new reference-class count or a new archive changes one of its inputs."}], "glossary": []}</script>
