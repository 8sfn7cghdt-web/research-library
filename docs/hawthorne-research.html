he reformers Hollingsworth (a philanthropist with a plan to reform criminals), Zenobia (a feminist and salonnière with a flamboyant independence), and Priscilla (a shy young woman who has been used by Westervelt, a mesmerist). Coverdale is a dilettante and an observer, a man who watches the reform project from the outside and who is drawn to the intimacy it promises without committing himself to it. His narration is the novel's central problem: he tells the story of the community's collapse, but his own role is the role of the spectator, and his account is shaped by his jealousy, his desire, and his self-deception.\n\nThe novel's account of Coverdale's position is one of the most sophisticated in Hawthorne's fiction. He is the figure of the observer who claims to understand the human heart and who is in fact its most interested party. The confirmed detail from the novel's sixth chapter shows his fascination with Zenobia: \"I noticed—and wondered how Zenobia contrived it—that she had always a new flower in her hair.\" The sentence is typical of the narrator's method, in which an apparently trivial observation betrays a deeper interest. Coverdale's attention to Zenobia is a form of desire and also a form of judgment, and it reveals the novel's central concern, which is the way the observer's vision distorts the thing observed.\n\nThe novel's sin is therefore not a single act but a set of relations: the appetite of the reformers for power and recognition, the sexual and emotional entanglements that the community's ideals cannot contain, and the narrator's own complicity in watching and judging. Sin in this novel is the condition of a community that has tried to escape the world's corruption and has found that it cannot escape the corruption of its own members.\n\n*The strongest reading* is that the novel is a critique of the utopian reform movements of the 1840s, and that Coverdale's perspective embodies the disillusioned intellectual's view of the reformers. The reading is well established and draws support from Hawthorne's own experience at Brook Farm, which he left after a few months in 1841 and which he later described unfavorably in his letters and in the novel's preface. The biographical link is widely accepted, though the degree to which the novel is autobiography is contested among biographers.\n\n*The strongest objection* is that the novel's critique of reform is too comfortable. Coverdale is a privileged observer who condemns the reformers from the security of his own idleness, and the novel's presentation of the community's failure can be read as a defense of the status quo. The objection is serious, and historicist critics have pressed it strongly, arguing that the novel's contempt for reform reflects a political conservatism and a refusal to engage with the social causes that the reformers championed. The chapter's view is that the objection is partly right: the novel does not take the reform causes seriously, and its silence on slavery and on the conditions of the poor is a real limit. The novel's critique of reform's self-deception is nevertheless a serious one, and it does not depend on the reformers being wrong about the causes.\n\n### Hollingsworth and the Reform Project\n\nHollingsworth is the novel's most important reformer, and his project (the reform of criminals through a kind of moral and emotional transformation) is the novel's most explicit statement of the reformist ideal. He is a man of great moral seriousness and great emotional rigidity, and the novel's account of him is that his commitment to reform has made him unable to love. His relations with Zenobia and Priscilla show the cost of his single-mindedness: he uses Zenobia's money and Priscilla's devotion for his project and abandons them when they are no longer useful.\n\nThe novel's critique of Hollingsworth is precise. His reform is a form of egotism, a desire to impose his moral vision on others that the novel treats as a version of the intellect triumphing over the heart, the sin that Brand names in the tale of 1851. The novel makes Hollingsworth's reformism the mirror of Chillingworth's investigation: both men are obsessed with the moral condition of another person, and both are blind to the cost of their obsession.\n\n*The strongest reading* is that the novel's account of Hollingsworth is a psychological study of the reformer as a type. The reading is well established, and it has been developed by critics of the Transcendentalist and utopian movements. Its strongest form is the argument that Hawthorne saw the reform movement as an expression of the same moral self-righteousness that Puritanism had encouraged, and that the reformers were heirs of the Puritan conscience without its theology.\n\n*The strongest objection* is that the novel's treatment of Hollingsworth is unfair to the reform movements it represents. The abolitionist movement in particular, which Hawthorne knew and disliked, was a movement of real moral urgency, and the novel's contempt for reform may be a contempt for the cause as well as for the self-righteousness of some of its advocates. The objection is defensible and important. The chapter's view is that the novel's critique is aimed at the reformer's psychology rather than at the causes, and that this distinction is real but not always maintained in the text; the novel's limits on this question are part of the argument about Hawthorne's politics.\n\n### Zenobia's Death and the Failure of Sympathy\n\nZenobia's fate is the novel's most powerful episode and its most troubling. She is a woman of intellect and passion, a feminist who wants to live independently, and her relationship with Hollingsworth is the novel's central tragedy. When Hollingsworth rejects her in favor of Priscilla's devotion and his own reformist mission, Zenobia drowns herself in the millrace. Her death is the novel's sin and its punishment at once: the community's failure to offer her sympathy, and the failure of Hollingsworth's reform to recognize her as a person rather than an instrument.\n\nThe novel's account of Zenobia's death is both sympathetic and judgmental, and the mixture is characteristic of Hawthorne's method. The narrator presents her as a figure of tragic dignity and also as a woman whose pride contributed to her fate. The death is a form of inherited sin in the sense that the community's sins (its appetite for power, its rigidity, its use of others) fall on the most vulnerable member. The novel does not offer a redemption for Zenobia, and its silence about her death is part of its moral argument.\n\n*The strongest reading* is that the novel dramatizes the failure of sympathy within a community dedicated to brotherhood. This is the moral center of the book and the reading is well established. Zenobia's death is the consequence of the community's inability to love in the way it claims to, and the novel insists on the link between the reformers' ideals and the cruelty they commit.\n\n*The strongest objection* is that the novel uses Zenobia's suicide as a device for the moral education of the male characters, and that her subjectivity is subordinated to the story of the men's guilt. The objection is one of the most sustained feminist criticisms of the novel, and it is serious. Baym's argument about the woman-centered tradition in Hawthorne is relevant: the novel's sympathy for Zenobia is real but limited, and the book's moral economy belongs to Coverdale and Hollingsworth. The chapter's view is that the objection is strong and that the novel does not fully answer it.\n\n## V. The Marble Faun (1860)\n\n### The Fall of Donatello\n\nThe Marble Faun (published in England as Transformation) is the last completed romance and the most explicitly theological of the major works. It is set in Rome, and its central figures are Donatello, a young Italian count who has a faunlike innocence; Miriam, an artist with a dark secret, which turns out to be that she was pursued by a man who has since been killed; Hilda, an American copyist of great purity; and Kenyon, an American sculptor who serves as the narrator's surrogate. Donatello's crime is the murder of the man who threatens Miriam, and the novel's account of his fall is the story of a man who moves from innocence to guilt and then to a moral awakening that is also a kind of suffering.\n\nThe novel's account of sin is developed through its characters' reactions to Donatello's crime. Miriam says that Donatello needed \"a sin to soften\" him, in the confirmed phrase \"you need a sin to soften you\" (Chapter XXIII), and the claim is an important clue to the novel's moral position. Sin here is not only a corruption; it is a condition that can produce sympathy and humanity. Donatello's fall gives him a depth of feeling that his innocence did not have, and the novel presents his guilt as the means by which he becomes fully human.\n\nThe narrator's claims about sin in the novel's middle section are the most important. The confirmed passage in Chapter XIX says that an individual wrong \"melts into the great mass of human crime,\" and the sentence goes on to claim that such a wrong \"makes us guilty of the whole.\" The claim is that sin is social and that every person's guilt is part of a collective guilt that binds humanity together. The novel's characters respond to this claim with different degrees of acceptance, and the novel's own position is ambiguous.\n\nHilda's remark in Chapter XXIII, that \"the sins of generations past have created an atmosphere of sin for those that follow,\" is the novel's version of the inheritance theme that appeared in The House of the Seven Gables. The confirmed text in the novel's middle section is consistent with this: sin is an atmosphere as well as an act, and it passes between generations through the air of the world.\n\n*The strongest reading* is that the novel is Hawthorne's most developed theology of sin, and that its claim that sin can soften and humanize is a version of the Christian doctrine of the fortunate fall (the felix culpa of the medieval liturgy). The reading is defensible, and it has been developed by critics who see the novel as a religious meditation. The novel's own text does not use the phrase felix culpa, and the chapter does not claim it does; the theological parallel is the critics' gloss.\n\n*The strongest objection* is that the novel's theology of sin is a romantic aestheticism, in which the criminal's suffering is valued as an artistic experience and the murder is treated as a moral education for the sympathetic observers. The objection is serious. The novel's narrator is preoccupied with the aesthetic beauty of Donatello and Miriam, and the claim that sin softens the human may be a way of making guilt picturesque. The chapter's view is that the objection has force and that the novel leaves the reader to judge whether the aesthetic consolation is earned.\n\n### The Unpardonable Sin and the Question of Concealment\n\nThe Marble Faun is the novel in which the unpardonable sin, which Ethan Brand had identified as the sin of the intellect that has lost the sense of brotherhood, returns in a different form. Miriam's secret, the crime that she has concealed, is the novel's central moral problem. The narrator does not say directly what Miriam's crime was, and the reticence is part of the novel's strategy. Her concealment is the form of her sin, and the novel asks whether a sin that is never confessed can be a way of remaining in the community of guilt.\n\nThe novel's confirmed passage on Miriam's heart, in Chapter XXII, says that she is \"trying to dissolve her whole heart into sympathy\" and that she pities the man she has wronged \"from the very depths of my soul.\" The claim is that sympathy is the remedy for sin, and that Miriam's attempt to achieve sympathy is a form of moral effort. The novel's position is that such effort may fail, and that the failure may be unrecognized by the one who makes it. The narrative does not make Miriam's sympathy complete, and it leaves open whether her concealment is a form of cowardice or of mercy.\n\nThe unpardonable sin in this novel is therefore not explicitly named. Its shape can be seen in the novel's treatment of the hardened heart that refuses the sympathy by which sin might be softened. Miriam's refusal to confess, the novel suggests, is a version of the intellect's refusal of brotherhood: she keeps her secret as a form of self-sufficiency. The novel does not condemn her for it outright, and that ambiguity is the novel's most interesting feature.\n\n*The strongest reading* is that the novel places the unpardonable sin in the realm of the heart's refusal of community, and that the sin is the refusal to be softened by sympathy. This is a defensible reading, and it is consistent with Ethan Brand and with the broader theology that Hawthorne inherited from the New England tradition.\n\n*The strongest objection* is that the novel's theology of sympathy is too vague to bear the weight the reading puts on it. The narrator's commitment to sympathy is real, but the novel does not define it, and critics have argued that the concept functions in the text as a sentimental gesture rather than a coherent moral principle. The objection, pressed by critics who prefer the sharper moral definitions of the earlier tales, is serious. The chapter's view is that the vagueness is partly deliberate: Hawthorne's late romance is a meditation rather than a doctrine, and its claims about sympathy are provisional.\n\n### The Question of the Romance Itself\n\nThe Marble Faun is also the novel in which Hawthorne's theory of romance is most fully tested. The novel is set in a real city with real works of art, and its moral claims are tied to the aesthetic experience of Rome. The narrator's judgment of Donatello's fall is shaped by the sculptures he has seen, and the novel's sympathy is bound up with a Renaissance humanism that makes the faun's innocence and guilt into a conflict of ideal forms.\n\nThe romance's license, which the novel's preface defends, is here at its most extended. The novel gives its characters the freedom to move through a moral world that is also an aesthetic world, and it asks whether the aesthetic can carry the moral weight the novel places on it. The critics have divided on this, and the division is one of the most important in Hawthorne scholarship: some read the novel as a mature synthesis of moral and aesthetic concern, and others read it as the exhaustion of the romance form.\n\n## VI. What the Works Assert Together\n\nRead in sequence, the major works develop a consistent account of sin and reform that changes shape as Hawthorne's career progresses. The early tales treat sin as a discovery made in solitude, a knowledge that destroys trust and paralyzes judgment. The Scarlet Letter moves the discovery into the community, and it shows the community's readings of sin as a form of its own corruption. The House of the Seven Gables gives sin a history, in which the sins of the fathers shape the lives of the children, and it makes inheritance into a debt that must be paid or forgiven. The Blithedale Romance tests reform against the appetites of the reformers, and it finds the reform project wanting. The Marble Faun asks whether sin itself can be a way of humanizing the sinner, and it leaves that question open.\n\nThe shared element is the refusal of easy moral closure. Hawthorne's characters rarely reach a clear condition of guilt or innocence, and the narratives rarely offer a definite judgment on their conduct. The works are structured by ambiguity: the forest may be a dream, the letter may be a sign of strength or shame, the curse may be superstition or social fact, the reformers may be fools or saints, and the sinner may be fallen or redeemed. This ambiguity is not an evasion. It is the expression of a moral psychology that takes the difficulty of judging the human heart as its subject.\n\nThe critics' disagreements can be arranged along two axes. The first is whether the ambiguity is a stance or a failure. Richard Chase's reading of the American romance treats it as the characteristic strength of an art that cannot resolve the moral contradictions of its society, and that represents those contradictions in images rather than doctrines. Roy Male's study of the tragic vision reads Hawthorne's symbols as carrying stable moral and religious meanings, and Frederick C. Crews's PMLA critique of that method objected that it admits only symbols that bear a Biblical or sacramental gloss. Whether Chase's account of ambiguity stands up against that comparison is a separate question, and the sources consulted do not settle it.\n\nThe second axis is whether the works' moral psychology is separable from their social and political context. The tradition running through Colacurcio and Bercovitch argues that it is not: the early tales are a form of moral history, and the romances are part of a national story about the making of American identity. On this reading, Hawthorne's concern with inherited guilt is a concern with the Puritan past as the foundation of the American present, and the moral psychology is the means by which the author examines that foundation. The objection to this reading, developed by critics who prefer the psychological emphasis of Chase and Male, is that it reduces the works' moral seriousness to historical symptom. The chapter's view is that the two readings are complementary: the moral psychology is genuinely psychological, and it is also genuinely historical, and the works' power comes from the way they hold the two together.\n\nBaym's work on the woman-centered readings and the shape of Hawthorne's career complicates both axes. Her argument that the women characters are the works' real moral centers, and that the male characters' guilt is a way of organizing the narrative around male self-examination, changes the question of whose sin the novels are about. The objection to Baym's reading, which is serious, is that it can make the women into symbols of the men's moral condition, and that it can underrate the works' interest in the male psychology for its own sake. The chapter takes the view that Baym's reading is a necessary corrective to the male-centered criticism of the mid-century, and that it does not fully account for the works' interest in Dimmesdale, Coverdale, or Donatello as subjects of moral inquiry.\n\nPerson's Cambridge Introduction gives a synthesis of these debates, and its value for this chapter is that it shows the critical consensus on the core questions: the centrality of guilt and concealment, the importance of the Puritan inheritance, and the ambiguity of the moral verdicts. Where Person and the critics diverge is on the question of Hawthorne's politics, and specifically on whether the novels' silence on slavery and on the conditions of the poor is an omission that compromises their moral claims. This is the most important open question in the critical literature, and it is the question on which the works' long-term reputation is likely to turn.\n\n## VII. The Strongest Objections, Taken Together\n\nThe strongest general objection to the reading offered here is that Hawthorne's moral psychology is so consistent, and so consistently pessimistic, that it becomes a fixed worldview rather than an inquiry. On this view, the works repeat a single lesson (that sin is universal, that concealment is destructive, that reform is self-deceiving) across different settings, and the variety of the fiction is a variety of costume. The objection is serious because it is partly true. The recurrence of the same moral structures in the tales and the romances is evident, and it is one reason that some critics have found Hawthorne's work monotonous in its ethical outlook.\n\nThe response is that the consistency is an inquiry rather than a doctrine. The works do not reach the same verdict each time. The Scarlet Letter gives Hester a dignity that the community cannot grant, the House of the Seven Gables gives the Maules a justice that the novel's logic makes impossible, The Blithedale Romance gives Zenobia a tragic stature and then withholds the sympathy that might have saved her, and The Marble Faun gives Donatello a humanity that his guilt produces. The consistency is in the questions, and the answers vary with the situation. A reader who sees only the pessimism has missed the variation, and a reader who sees only the variation has missed the questions.\n\nThe second serious objection is political: the works' silences on slavery, on the Mexican War, on the abolitionist movement, and on the economic conditions of the working poor make the moral psychology a form of evasion. The objection has been developed with force by historicist critics, and it is the strongest argument against the view that Hawthorne's major works are great moral fiction. The response available to the moral-psychological reader is that the works are not political treatises, and that their concern with the inner life is a legitimate form of moral attention. The reply is weaker than it needs to be, because the works' own preoccupation with inherited injustice (the Maule claim, the Pyncheon debt) invites the political question, and the novels do not answer it. The chapter's assessment is that the political objection is correct in its substance and that it does not destroy the moral psychology; it shows the moral psychology's limits, and the limits are the subject of the next generation's reading.\n\nThe third objection is about the romance form itself. The works' claims about sin and reform depend on the license the romance gives: the supernatural curse, the forest rite, the elixir, the bloodless garden, and the sculpted faun are all devices that allow the author to make moral claims without the constraints of realistic causation. The objection, which goes back to the reviewers of the 1850s, is that the romance is an escape from the difficulty of moral realism. The reply is that the romance is the form in which Hawthorne could make sin an act of the imagination and then examine the imagination's responsibility. The objection and the reply are both defensible, and the question of whether the romance's license is an evasion or a discovery remains open.\n\n## VIII. Open Questions\n\nThe first open question is whether the forest scene in \"Young Goodman Brown\" is a dream or an event, and whether the answer changes the story's moral. The text leaves it undecided, and the critical tradition has divided along the lines of its own assumptions about the reality of the Puritan world.\n\nThe second is the meaning of the scarlet letter at the end of The Scarlet Letter. The novel says the letter had \"done its office,\" and the question is whether that phrase means the letter has been emptied of meaning, or that its meaning has been completed in the community's acceptance of Hester.\n\nThe third is whether Holgrave's marriage in The House of the Seven Gables is a resolution or a retreat. The critics are divided, and the division bears on the larger question of whether Hawthorne believed in the possibility of reform.\n\nThe fourth is the precise nature of the unpardonable sin in the later romances. \"Ethan Brand\" gives the sin in a set of definitions, and the novels imply it without naming it. Whether these are the same sin, and whether Hawthorne himself held a settled view, are questions the texts do not fully answer.\n\nThe fifth, and the most important for the long-term reputation of the works, is whether the silences on slavery and class in the major fiction compromise its moral claims. This is the question on which the works' next critical generation is likely to divide most sharply.\n\nThe sixth concerns Marble Faun. The chapter has relied on confirmed passages from the first and middle portions of the novel and has not been able to check the later chapters against the Gutenberg text in full. The claims about sympathy and the unpardonable sin in the later chapters need that check before they are treated as settled. The chapter's reading of the novel's conclusion, in particular, rests on secondary characterization and should be confirmed against the text.\n\nThe seventh concerns the three shorter tales not treated in full here: \"The Minister's Black Veil,\" \"Rappaccini's Daughter,\" and \"Dr. Heidegger's Experiment.\" The chapter's summaries of these are drawn from the standard plot record and from the critical literature, and the specific quotations from them are not confirmed in this essay. A reader who wants to rely on the interpretations should check them against the Centenary Edition text.\n\n## Sources\n\n1. Hawthorne, Nathaniel. *The Scarlet Letter*. Project Gutenberg, eBook #33. https://www.gutenberg.org/files/33/33-h/33-h.htm. Tier 1 (primary text). Confirmed passages: Ch. IV (\"the Black Man that haunts the forest round about us\"; \"The reason is not far to seek\"), Ch. XV (\"Be it sin or no\"), Ch. XVII (\"little caring though his cheek rested on the scarlet letter\"), Ch. XXIII (\"ye, that have loved me!\"; \"God's eye beheld it!\"), Ch. XXIV (\"ON A FIELD, SABLE, THE LETTER A, GULES\"; \"now that it has done its office\"). Edition in the chapter's frame: Ohio State Centenary Edition, which the Gutenberg text does not reproduce; check chapter numbers against it.\n\n2. Hawthorne, Nathaniel. *The House of the Seven Gables*. Project Gutenberg, eBook #77. https://www.gutenberg.org/files/77/77-h/77-h.htm. Tier 1. Confirmed: Ch. I (\"God will give him blood to drink!\"; \"the curse which the latter flung from his scaffold was remembered\"; \"the water of Maule's Well ... grew hard and brackish\"); Author's Preface (the \"moral\" of the wrong-doing of one generation). Full text was only partly checked in this essay.\n\n3. Hawthorne, Nathaniel. *The Blithedale Romance*. Project Gutenberg, eBook #2081. https://www.gutenberg.org/files/2081/2081-h/2081-h.htm. Tier 1. Confirmed: Ch. VI (\"she had always a new flower in her hair\"); Ch. I (the mesmeric \"phenomenon\"). Later chapters not checked in this essay.\n\n4. Hawthorne, Nathaniel. *The Marble Faun; or, The Romance of Monte Beni*, Vol. I. Project Gutenberg, eBook #2181. https://gutenberg.org/files/2181/2181-h/2181-h.htm. Tier 1. Confirmed: Ch. II (\"before sin, sorrow or morality itself had ever been thought of!\"); Ch. XIX (\"melts into the great mass of human crime\"); Ch. XX (\"I feel as if he were lying right across my heart\"); Ch. XXII (\"trying to dissolve her whole heart into sympathy\"; \"such was his crime, unless love, annihilating moral distinctions, made it otherwise\"); Ch. XXIII (\"you need a sin to soften you\"; \"the sins of generations past have created an atmosphere of sin for those that follow\"). Vol. II is Project Gutenberg eBook #2182 (https://www.gutenberg.org/ebooks/2182) and was not checked.\n\n5. Hawthorne, Nathaniel. \"Young Goodman Brown,\" in *Mosses from an Old Manse* (1846). Project Gutenberg, eBook #512. https://gutenberg.org/files/512/512-h/512-h.htm. Tier 1. Confirmed: \"My Faith is gone!\"; \"the heart of the dark wilderness\"; the closing sentence, \"they carved no hopeful verse upon his tombstone, for his dying hour was gloom.\" The 1846 collection is the authoritative text; the Centenary Edition, which the chapter takes as its default reference, should be checked for variants.\n\n6. Hawthorne, Nathaniel. \"Ethan Brand,\" in *Little Masterpieces*, ed. Bliss Perry. Project Gutenberg, eBook #39716. https://gutenberg.org/files/39716/39716-h/39716-h.htm. Tier 1 (text) with Tier 2 editorial frame. Confirmed: \"The sin of an intellect that triumphed over the sense of brotherhood with man and reverence for God\"; \"It is a sin that grew within my own breast\"; \"A sin that grew nowhere else!\"; \"There is an Unpardonable Sin!\"; \"They were all of one family\" (narrator, lime-burner's memories). The anthology edition is a secondary selection, not a scholarly critical edition; the original publication was in 1852 (Ticknor, Reed, and Fields) per the standard record, though some secondary sources give 1851.\n\n7. Melville, Herman. \"Hawthorne and His Mosses.\" *Literary World*, August 17 and 24, 1850. Tier 1 (primary essay). The \"blackness of darkness beyond\" passage is quoted widely with small wording variants across reprints; the chapter does not quote it verbatim and recommends checking the 1850 printing or a scholarly reprint before quotation. Source reached through secondary transcription: https://www.litandwriting.umb.edu/engl651/fall06/documents/HawthorneandMelville.doc (course document, Tier 7-adjacent; used for pointing, not for citation).\n\n8. Chase, Richard. *The American Novel and Its Tradition*. Garden City, NY: Doubleday, 1957. Tier 2 (scholarly monograph). Reading of Hawthorne as romance-writer and of the American romance's pattern of innocence meeting the dark. Its chapter on Hawthorne is the reference point for the romance-tradition reading.\n\n9. Male, Roy R. *Hawthorne's Tragic Vision*. Austin: University of Texas Press, 1957. Tier 2. Reading of Hawthorne's tragic pessimism. Bibliographic details from memory; a catalog check is recommended, since the search did not confirm them.\n\n10. Colacurcio, Michael J. *The Province of Piety: Moral History in Hawthorne's Early Tales*. Cambridge, MA: Harvard University Press, 1984. Tier 2. Historical reading of the early tales as moral history; Duke University Press paperback followed (1995). https://www.dukeupress.edu/the-province-of-piety. Confirmed via publisher listing.\n\n11. Bercovitch, Sacvan. *The Office of \"The Scarlet Letter\"*. Baltimore: Johns Hopkins University Press, 1991. Tier 2. Historicist-rhetorical reading of the novel and of \"America\" as a national and symbolic claim; winner of the MLA James Russell Lowell Prize. The 1991 date is from memory and should be confirmed in a catalog.\n\n12. Baym, Nina. *The Shape of Hawthorne's Career*. Ithaca: Cornell University Press, 1976. Tier 2. Woman-centered reading and the shape of Hawthorne's career. Bibliographic details from memory; confirm in a catalog.\n\n13. Person, Leland S. *The Cambridge Introduction to Nathaniel Hawthorne*. Cambridge: Cambridge University Press, 2007. Tier 2. Concise synthesis of the critical debates on guilt, concealment, politics, and gender used in the chapter's final section.\n\n14. Crews, Frederick C. *The Sins of the Fathers: Hawthorne's Psychological Themes*. New York: Oxford University Press, 1966. Tier 2. Psychoanalytic reading of inherited guilt in the romances. Cited for the psychological tradition that the chapter's objections often engage. Bibliographic details from memory.\n\n15. Scripture references (Matthew 12:31-32; Mark 3:28-29; Luke 12:10), King James Version, for the unpardonable sin as a theological term of art. Tier 1 for the text.\n\n## Figures Named but Not Consulted\n\nThe chapter names several critics whose work was not read in full for this essay. Richard Chase and Roy Male are described from the standard critical account and from secondary reference; their chapters were not consulted directly. Sacvan Bercovitch's argument is described from the publisher and award record, not from the book's text. Nina Baym's argument is described from its reputation in the criticism, not from the monograph. Leland Person's synthesis is described from its general shape. Frederick Crews's psychoanalytic reading is named as part of the psychological tradition and is not summarized in detail here. Michael Colacurcio's argument about moral history is described from its title and the publisher's description.\n\nHerman Melville's 1850 essay is named as the first major critical response to the romances. It praises the \"blackness\" in Hawthorne's work, and its key phrase, \"the blackness of darkness beyond,\" is quoted here in the form given by the course reprint, which varies from other transcriptions. Henry James's 1879 study, which is among the most influential early readings of Hawthorne's moral psychology, is named but not consulted. The Pierce biography, the Liverpool consulship, and the Brook Farm years are referred to only as they bear on the novels, and the historical record of those episodes is covered in the life chapter, not here.\n\n## Primary Texts Not Consulted in Full\n\nThe following texts are discussed in this chapter but were not read in full in this essay, and the claims about them rest on the plot record and critical summary: \"The Minister's Black Veil\" (1836), \"Rappaccini's Daughter\" (1844), \"Dr. Heidegger's Experiment\" (1837), the Centenary Edition text of The Scarlet Letter (only the Gutenberg text was checked), the later chapters of The House of the Seven Gables (only Chapters I through III were checked), the later chapters of The Blithedale Romance (only Chapters I through VIII were checked), Vol. II of The Marble Faun (not checked), and the Author's Preface to The Marble Faun (not checked). The Custom House introduction to The Scarlet Letter and the preface to The House of the Seven Gables, both of which bear directly on the theory of romance, are not discussed in full here and belong to the theory chapter."}, {"order": 4, "file": "04_Theory_Of_Romance_And_American_Renaissance.md", "title": "The Romance and Its Company: Hawthorne's Theory of Fiction and the American Renaissance", "summary": "", "body": "# The Romance and Its Company: Hawthorne's Theory of Fiction and the American Renaissance\n\n## Bottom Line\n\nHawthorne's theory of the romance is a claim about latitude: a romance may set its people in a half-real space, bend probability, and let symbols carry moral weight that a novel, bound to the texture of ordinary life, could not carry. The prefaces state this claim with real care, but they also say something he rarely says outright, which is that the latitude exists in order to test a moral proposition. Whether the romance is first a theory of the imagination or first a theory of moral knowledge is the question on which the rest of the chapter turns, and the best readings resolve it in opposite directions. His distance from Emerson's optimism is real and well documented, though it is more a matter of temperament and of the Brook Farm experience than of a finished philosophical rival. The American Renaissance, as Matthiessen framed it in 1941, remains a useful period label, but the canon it fixed has been challenged on grounds of gender, race, and the politics of criticism that Matthiessen's own work did not fully anticipate.\n\n## The Problem of the Name\n\nBefore Hawthorne's theory can be assessed, the word has to be fixed. In the nineteenth century, a \"novel\" meant a long prose fiction that claimed to represent contemporary manners with a high degree of fidelity to the ordinary: the social world of marriage, money, and manners that Austen, Trollope, and later Howells mapped. A \"romance,\" in the sense Hawthorne inherited from Walter Scott's prefaces and from the older tradition of the marvellous tale, was a looser form. It allowed for improbable incident, for characters who are types as much as individuals, for settings that are partly remote in time or place, and for symbols that do not have to be explained away by the plot. Hawthorne's own preface to *The House of the Seven Gables* describes the difference in this way: when a writer calls his work a romance, he wishes \"to claim a certain latitude,\" and the novel, by contrast, is presumed to aim at \"a very minute fidelity\" to the actual [1]. The distinction is his, not a modern critic's, and everything else in this chapter depends on taking it seriously.\n\nA second term needs defining at the outset. *Allegory*, in the sense relevant here, is a mode in which the narrative is a continuous set of correspondences between a literal level and a moral or doctrinal level, so that each figure has a fixed referent. Hawthorne's romances are not allegories in this strict sense. They use allegorical devices, personification, the emblematic object, the moral lesson stated at the end, but they refuse the one-to-one key. Melville's 1850 essay registers the same quality when it treats Hawthorne's darkness as something that works on the reader's sense of depth rather than delivering a message (see the discussion of that essay below) [3]. The question of how far Hawthorne's symbolism is allegorical is one of the oldest in the reception history, and it bears directly on the claim that his theory is about moral knowledge: a fixed allegory produces knowledge that is already known, while a romance is supposed to produce knowledge the reader has to make.\n\n## Hawthorne's Three Prefaces\n\nThe theory is not stated in a single essay. It is distributed across three prefatory pieces, and each adds something the others lack. The first, the preface to *The House of the Seven Gables* (1851), is the most explicit statement of the genre distinction. It argues that the romance has \"fairly a right to present that truth under circumstances, to a great extent, of the writer's own choosing\" [1]. The truth in question is not the surface of daily life but a truth about the human heart, and the romancer is entitled to arrange the circumstances in which that truth can be seen clearly. The latitude, then, is not an excuse for fantasy. It is a method for producing an experiment in which the variables are set by the author.\n\nThe preface to *The Marble Faun* (1860), written after an interval of several years in which Hawthorne had published little, is more guarded and more melancholy. It asserts that \"Romance and poetry, ivy, lichens, and wallflowers, need ruin to make them grow\" [2]. It also states the author's aim in a sentence that is often quoted for its modesty and that matters more than its modesty suggests: he \"proposed to himself merely to write a fanciful story, evolving a thoughtful moral\" [2]. The phrase \"evolving a thoughtful moral\" is the clearest evidence in the prefaces that the romance is meant to do moral work. The fancy is the vehicle; the moral is the thing carried. A reader who takes the preface at its word should expect the moral to be present in the fiction, not floating above it.\n\nThe Marble Faun preface also contains the passage most often cited for the contrast between Europe and America. Hawthorne writes that the romancer needs \"no shadow, no antiquity, no mystery, no picturesque and gloomy wrong,\" and he complains of a country \"where actualities would not be so terribly insisted upon as they are, and must needs be, in America\" [2]. This is a remarkable statement for a writer who had spent much of his career trying to find his own version of the old country, and it is one of the most direct statements in Hawthorne of how the American situation burdens the imagination. Its significance for the American Renaissance is considerable, since it names a problem every American writer of the period shared: the absence of the accumulated past that gave European fiction its shadows, and the insistent presence of an actuality that refused to become symbol. Hawthorne's answer, in the romances set in New England, was to make the past itself an actuality, a set of inherited guilts and houses that the present cannot shake off.\n\nThe third piece is the preface to *The Blithedale Romance* (1852), which is in some ways the most self-aware. Hawthorne describes the Brook Farm community, which he had joined and left, as \"essentially a day-dream, and yet a fact,\" and he says that its use to him was to provide \"an available foothold between fiction and reality\" [5]. The phrase is worth stopping on. It states in miniature the whole theory: the romance needs an actual place, enough of a foothold that the reader believes in the ground, but not so much actuality that the ground pins down the meaning. The Blithedale preface also claims that the socialist community is \"merely\" a stage for the characters. That claim is itself a sort of evasion, and it is one of the things the strongest critics of the novel have seized on. A community that is only a stage cannot be judged on its merits, and the novel's failure to take the reform seriously may be the consequence of the theory rather than an accident of it.\n\nAcross the three prefaces, the theory has a consistent shape. The romance is granted latitude; its materials are shadow, ruin, and the past; its end is moral; and its ground is an actual place that is kept at the edge of plausibility. What the prefaces do not supply is a systematic account of how a symbol produces knowledge. For that we have to turn to the fiction and to the Custom House introduction to *The Scarlet Letter* (1850), which is closer to a theory of the imagination and of the author's relation to his own inheritance than any of the prefaces.\n\n## The Custom House as Epistemology\n\nThe Custom House sketch that opens *The Scarlet Letter* is the most theoretically dense passage Hawthorne wrote about his own process. In it he describes the Salem customs house, his fellow officers, and the discovery of a scarlet letter with its associated documents. He also describes the imaginative region in which the romancer works: \"a neutral territory, somewhere between the real world and fairy-land,\" where \"the Actual and the Imaginary may meet, and each imbue itself with the nature of the other\" [6]. The point that the romancer lives in a mixed territory rather than in either the factual or the purely fanciful is widely attested in the criticism and is consistent with the prefaces [6].\n\nThe sketch matters because it places the romance's moral power in the act of discovery. The letter is found, the documents are read, and the author takes up the story as a kind of inherited relic. The scarlet letter's meaning is not given; it is produced by the imagination working on the evidence. This is where the theory becomes more than a genre claim. A romance is a way of testing a moral proposition by inhabiting a set of relics until their meaning becomes visible. The proposition, in the case of *The Scarlet Letter*, concerns guilt, concealment, and the publicity of sin, and the test is conducted through characters whose positions are arranged so that each can be seen from several angles.\n\nThe Custom House also contains Hawthorne's most famous account of his own unfitness for the practical world, and this has a bearing on the theory. He presents himself as a man whose sensibility is out of step with the commercial and political life of the town. The romancer's latitude, on this account, is a compensation for a kind of exile. That reading is available in the text and has been developed by critics who see the romance as a form of self-defence. It is also one of the places where the theory of the imagination and the theory of moral knowledge begin to diverge, since the exile is at once a social fact and a claim about the conditions under which truth is available.\n\n## The Two Readings: Imagination or Moral Knowledge\n\nThe central interpretive question about Hawthorne's theory can be put this way. Is the romance first a theory of the imagination, a claim about what fiction is free to do, with moral meaning as one of its effects? Or is it first a theory of moral knowledge, a claim about how a certain kind of truth about the human heart can be grasped only by a method that deliberately sets aside the ordinary? Both readings have distinguished advocates, and both are supported by the prefaces. Their differences matter for the rest of the chapter.\n\nThe imaginative reading has the stronger textual support in the Seven Gables preface, where the stress falls on latitude and on the author's right to arrange circumstances. On this view, Hawthorne is a theorist of the freedom of fiction, and the moral seriousness of the romances is a consequence of the freedom rather than its purpose. Its strongest form runs as follows. A romance is a region in which the author can create the conditions for seeing a truth that realism would obscure by its insistence on the actual. The truths in question are about the heart, but the heart is not accessible except through images, and images are what the romance supplies. The reader who complains that the moral is too neat has missed the point: the neatness is the sign that the image has done its work and the reader has been given a symbol to think with. On this account Hawthorne's theory belongs in the company of Coleridge's distinction between the symbol and the allegory and of the later American claim, made in various forms, that literature is the place where imagination exceeds the merely descriptive.\n\nThe moral-knowledge reading has the support of the Marble Faun preface, with its \"thoughtful moral,\" and of the consistent pattern in the fiction, where the plot always resolves into a moral lesson the characters are made to learn or fail to learn. Its strongest form is more severe. The romance, on this account, is a theory of how moral knowledge is produced in a world where guilt is inherited and the instruments of reform are themselves corrupt. The latitude is a means and not an end. The author chooses the romance because it can stage the inheritance of sin in a way that realism cannot, since realism tends to accept the social world as given and to treat its moral failures as failures of individuals. A romance can show a guilt that is structural, communal, and transmitted, and it can show the failure of reform as a failure of the reformer's heart. This reading places Hawthorne closer to Puritan casuistry than to Coleridgean symbolism, and it treats his refusal of allegorical closure as a way of keeping the moral question open rather than of evading it.\n\nThe two readings disagree about the reader. For the imaginative reading, the reader's task is to feel the force of the symbol and to participate in the freedom of the text. For the moral reading, the reader's task is to draw a conclusion the text has made difficult to draw, and the difficulty is part of the lesson. Hawthorne's own remarks on his readers, especially the \"all-sympathizing critic\" the Marble Faun preface invokes, lean toward the second position, since sympathy in that passage is an ethical attitude rather than an aesthetic one [2]. But the imaginative reading can fairly claim that the sympathy is the reader's freedom to feel and not a prescription.\n\nMy own assessment is that the moral reading is the stronger account of the late romances and the imaginative reading the stronger account of the early tales, and that the prefaces themselves do not decide between them because Hawthorne did not think the two could be separated. The romance is a theory of the imagination in which imagination is the only available instrument of moral knowledge. That claim is contestable, but it is more defensible than either pure version.\n\n## Hawthorne and Emerson: The Transcendentalist Debate\n\nThe relation between Hawthorne and Emerson is among the most discussed in American literary history, and it is often told as a contrast between a sunny optimist and a dark pessimist. That contrast is too simple. Its origins are real: Emerson's essays of the 1830s and 1840s, especially \"Nature\" (1836) and \"Self-Reliance\" (1841), preach an intuitive access to the divine through the individual mind and a confidence that the world is a moral system whose laws the self can read. Hawthorne's romances, by contrast, repeatedly show the self as self-deceived, the intuitive mind as prone to pride, and the moral order as more opaque and more punishing. The Transcendentalist debate, in the form in which it reached the novel, is therefore a debate about whether the individual can read the moral order directly.\n\nThe biographical record gives this contrast some support. Hawthorne joined Brook Farm in April 1841 and left in November of the same year. According to the Encyclopedia.com account of *The Blithedale Romance*, he did heavy farm labour at first, but his letters show growing discontent, and he later wrote that \"the real Me was never an associate of the community\" [5]. I did not locate that letter in a primary edition and cite it here secondhand. The account of his time at the farm, and his judgement of it, is the most direct evidence of his distance from the reform impulse that Emerson's circle embodied. Hawthorne left Brook Farm, married Sophia Peabody in July 1842, and moved to the Old Manse in Concord, where the household was physically close to Emerson's.\n\nThe Blithedale Romance (1852) is the fullest literary expression of that distance. It is set in a community plainly modelled on Brook Farm and is narrated by Coverdale, a man who has joined the community and who is, at least in part, an observer of its failure. The novel's characters have been identified with real people, and the identifications have been contested. Some critics read Zenobia as based on Margaret Fuller, who visited Brook Farm and whose self-dramatising personality the novel seems to satirise. Hawthorne's notebook calls Fuller \"a great humbug,\" according to the Encyclopedia.com account, though I have not confirmed the notebook entry in the Centenary text [5]. Hollingsworth has been variously identified with George Ripley, Albert Brisbane, and Theodore Parker, and the same account suggests that the figure of Fourier may be closer to the attacks Hollingsworth makes on the reformers [5]. Emerson is not a character. His presence in the novel is indirect, and this is itself worth noticing: the figure who most embodies the optimism the novel doubts does not appear in the fiction at all.\n\nThe Transcendentalist debate therefore runs through Hawthorne's work as a sustained refusal of intuition as a sufficient guide to moral truth. The strongest form of this reading is that Hawthorne is a Calvinist moralist who has absorbed the Transcendentalist vocabulary of the self and turned it against its own claims. On this view the romances are a critique of the inner light, and the Puritan doctrine of depravity is the rational core that Emerson's optimism leaves out. The defence of Emerson is that the optimism is itself a moral stance, one that Hawthorne understood and admired in part, and that Hawthorne's pessimism is not a settled doctrine but a continual test of the optimism's claims.\n\nThe objection to this contrast is substantial. Several critics have argued that Hawthorne's relation to Transcendentalism was more ambivalent than the opposition suggests, and that his fiction shares with Emerson's essays a belief that the self is the site of moral truth. Hawthorne's characters, on this reading, are not overturnings of Transcendentalism but its dramatised consequences: Dimmesdale's inner confession, Hester's self-command, and the solitary inquirers of the tales are all forms of the self in search of its own law. The response to this objection is that the difference is not in the premise but in the conclusion. Both writers assume that the self must find its way to moral truth. Emerson concludes that the self is trustworthy; Hawthorne concludes that the self is treacherous and that its treachery is inherited. That is a real difference, and it is the difference the Blithedale satire enacts.\n\n## Thoreau and the Concord Circle\n\nHawthorne's relation to Thoreau is less dramatic than his relation to Emerson, and it tells us something about the limits of the Concord contrast. Hawthorne recorded a visit from Thoreau in his notebook on 1 September 1842, the day after Thoreau dined with the Hawthornes. The entry describes Thoreau as \"a keen and delicate observer of nature, — a genuine observer,\" and adds that such a character is \"almost as rare . . . as even an original poet\" [4]. The same entry calls him \"a healthy and wholesome man to know\" [4]. These are generous words, and they show that Hawthorne could recognise in Thoreau the kind of empirical attention to the natural world that his own fiction rarely attempts.\n\nThe generosity does not extend to the Transcendentalist project as Thoreau might have understood it. Hawthorne's romances treat nature as a moral surface on which the imagination writes, and they rarely take the natural world on its own terms. Thoreau's *Walden* (1854) takes the natural world as a field of observation and a source of moral instruction that depends on accurate perception rather than on symbolic reading. The contrast is between two ways of making nature mean something. Hawthorne's way is the emblem; Thoreau's way is the record. The emblem asks the reader to see through the object to the moral; the record asks the reader to see the object more carefully. Hawthorne's praise of Thoreau's observation can be read as a recognition of a method he deliberately did not practise.\n\nThe strongest reading of the Thoreau relation holds that Hawthorne's emblematic method is a form of resistance to the empirical turn in American letters, and that the romance is the last refuge of a Puritan habit of reading the world as a text. The objection is that this makes Hawthorne a conservative against Thoreau's radicalism, which underestimates the political reach of the romance. The more defensible position is that both writers were interested in the same question, what a human being owes to the natural and social order, and gave different answers because they had different relations to inheritance. Thoreau could walk away from Concord; Hawthorne could not, since the inheritance was in his blood and in his name.\n\n## Melville and the 1850 Review\n\nMelville's \"Hawthorne and His Mosses,\" published pseudonymously in *The Literary World* on 17 and 24 August 1850, is the most important critical document of the American Renaissance and the first major attempt to place Hawthorne in a literary tradition. It was written in the period when Melville was completing *Moby-Dick* and when *The Scarlet Letter* had recently established Hawthorne's reputation. The essay is in part a review of *Mosses from an Old Manse* (1846) and in part a manifesto for a literature of depth and darkness against the sunny conventions of American taste. It is signed \"By a Virginian Spending July in Vermont,\" a pseudonym whose irony has been widely noticed [3].\n\nThe essay's central move is to identify Hawthorne's darkness as the source of his power. Melville describes the \"blackness\" of Hawthorne's work in several passages. In the discussion of \"The Christmas Banquet\" and \"The Bosom Serpent,\" he writes that the dark side of Hawthorne is \"shrouded in a blackness, ten times black\" [3]. He goes on to say that \"this blackness it is that furnishes the infinite obscure of his background\" [3]. The most famous claim is that this \"power of blackness\" in Hawthorne \"derives its force from its appeals to that Calvinistic sense of Innate Depravity and Original Sin\" [3]. Melville does not treat this as a theological endorsement. He treats it as a source of artistic force, one that makes Hawthorne more American and more profound than the writers who avoid it.\n\nMelville's essay also raises the question of whether the darkness is the author's craft or his inheritance. He asks \"whether there really lurks in him, perhaps unknown to himself, a touch of Puritanic gloom\" [3]. The phrase \"unknown to himself\" is the key to the essay's psychology. Melville is not sure whether Hawthorne's darkness is chosen or inherited, and his uncertainty mirrors the problem of the romance theory: the latitude of the romance allows the author to choose his shadows, but the shadows may choose him. On this reading the uncertainty is itself part of the literary meaning, which is a claim the essay makes more by implication than by explicit argument.\n\nThe essay is also notable for its attention to Shakespeare, whom Melville invokes as the model of depth. He writes, \"if I magnify Shakespeare, it is not so much for what he did do, as for what he did not do, or refrained from doing\" [3]. The comparison is a way of praising Hawthorne for the same reticence: the romance's refusal to close its meaning is a form of genius. The essay closes with the claim that \"The Mosses from an Old Manse\" will be \"ultimately accounted his masterpiece\" [3], a prediction that the reception has not confirmed, since *The Scarlet Letter* and *The House of the Seven Gables* have come to occupy the centre of the canon.\n\nMelville's essay has been read as a manifesto for the American Renaissance and as a sign of its limits. Its strongest reading places Melville and Hawthorne together as the two writers who most fully confronted the darkness of the American inheritance, one through the romance and the other through the epic-tragic novel. Its weakest reading treats the essay as a friendship letter disguised as criticism, which underrates its analytical force. The evidence supports a middle position. The essay is criticism, and it is also a claim about what American literature should be, and the second claim is the one that gave the period its sense of direction.\n\nThe textual status of the essay needs a caveat. Its wording varies across editions, and the Northwestern-Newberry edition, the standard scholarly text, should be consulted for exact quotation. The quotations here are drawn from a transcription of the 1850 printing and have been checked against the transcription's own wording rather than against the Northwestern-Newberry text.\n\n## Matthiessen and the Period Concept\n\nF. O. Matthiessen's *American Renaissance: Art and Expression in the Age of Emerson and Whitman* was published by Oxford University Press in 1941 [7]. The book treats five writers, Emerson, Thoreau, Hawthorne, Melville, and Whitman, as the core of a flowering of American literature in the decade or so before the Civil War. Matthiessen's claim was that these writers, despite their differences, shared a commitment to making American experience the substance of high art, and that their work constituted a coherent literary period comparable to the Renaissance of Italy or England. The term \"American Renaissance\" became a standard label, and the book is one of the founding texts of American Studies as an academic field.\n\nMatthiessen's canon was selective, and his method was sympathetically but not uncritically historicist. He treated the period's writers as responding to a shared set of cultural pressures, including democracy, Puritan inheritance, the frontier, and the problem of the individual, and he read their work as an answer to those pressures. For Hawthorne, this meant treating the romance as an engagement with the Puritan past and its moral residue, which is close to the reading developed in this chapter. The book's main achievement was to make the five writers into a single unit of analysis.\n\nThe period concept has been criticised from several directions. The most influential challenge, developed over the 1970s and 1980s, was that Matthiessen's canon excluded women writers, African American writers, and other writers whose work did not fit the masculine, Protestant, and Northeastern frame the book assumed. William E. Cain, in a study of Matthiessen's critical politics, describes the book's canon as formed by an \"extreme white male formation\" that later readers would have to correct; the phrase comes from a secondary summary of Cain's argument that I did not confirm against the text [8]. Russell Reising's *The Unusable Past* (Methuen, 1986) treats the whole tradition of American literary theory, including the Matthiessen line, as a set of canon-forming moves whose assumptions about Puritan origins and national identity needed to be made visible [9]. Reising's book was reviewed in *American Literature* in 1989 by David S. Reynolds, and it is part of the wider critique of the national literature as a category [9].\n\nThe strongest case for the period concept, as against its critics, runs as follows. The American Renaissance is not a fixed list but a historical claim about a cluster of writers who were responding to the same cultural problem: how to make a literature out of a society that had no accumulated tradition and a religious inheritance it could not fully shed. Matthiessen's five writers do share that problem, and their work does form a recognisable conversation. The critics who expand the canon do not overturn the claim; they add to it. The period concept survives its critics because it is a good account of the relations among the writers it names.\n\nThe objection is more serious than the defence allows. The period concept depends on a prior decision about what counts as the central literature of the nation, and that decision is itself a political act. Matthiessen's canon serves a particular account of American identity, one in which the moral seriousness of the New England writers stands for the nation's deepest self. That account excludes the literatures of the enslaved, the Indigenous, and the immigrant, and it treats the writers of the Northeast as the normative centre. The critics are right that the period concept needs to be historicised, and the response has been to treat the American Renaissance as a contested category rather than a settled one. For Hawthorne, the consequence is that his romance has to be read within a wider field of antebellum writing that includes the sentimental and popular novel, the slave narrative, and the political pamphlet, and the theory of romance has to be tested against these alternatives rather than assumed as the national norm.\n\n## Objections and Responses\n\nThe theory of romance attracts objections that deserve separate treatment, since the chapter's conclusions depend on how they are answered. The first is that the theory is an evasion. The latitude the romance claims can be used to avoid the actual, and the Blithedale preface's claim that the reform community is \"merely\" a stage looks like a refusal to take social questions seriously. On this objection, the romance is a form of escapism dressed as moral inquiry, and its darkness is a way of not having to choose a political position. The response is that the romance's refusal of closure is itself a political position: it withholds the comfort of a reform programme in a period when reform was offering comfort to many, and it insists that structural guilt cannot be dissolved by individual sincerity. The objection is strongest against the early tales and weakest against the late romances, where the social pressure is more visible.\n\nThe second objection is that the theory reflects a Puritan nostalgia. Hawthorne's preoccupation with inherited guilt and his fascination with the figure of John Hathorne, the Salem magistrate of the witch trials, can be read as a backward-looking attachment to a religious order that the nineteenth century had already left behind. On this reading the romance is a memorial rather than an analysis. The response is that Hawthorne's relation to the Puritan past is critical as well as attached: the romances show the Puritan categories of sin, guilt, and election as tools of social control, and they show the Puritan inheritance as a burden that the present cannot simply discard. The nostalgia objection assumes that the only alternative to nostalgia is progressive optimism, which is the position Hawthorne refuses.\n\nThe third objection is the one that bears most directly on the question of imagination versus moral knowledge. It holds that the romance's symbols are too flexible to produce knowledge at all. If a symbol can mean anything, the reader has no way of testing a moral claim, and the romance becomes a set of pleasing ambiguities. The response has two parts. The first is that the romances are constrained by their plots: the narrative makes certain moral positions more costly than others, and the reader can trace the consequences of each choice. The second is that the flexibility is itself a claim about the moral world, which in Hawthorne's view is not transparent to the individual. The symbol is ambiguous because the truth about the heart is ambiguous, and a theory of moral knowledge that produces certainty would be false to the object.\n\nA fourth objection comes from the Melville side of the argument. If Hawthorne's darkness is a Calvinist inheritance that he cannot shake, then his romances are not a theory of anything but a symptom, and the period concept that places him beside Melville and Thoreau overstates the common ground. The response is that the symptom and the theory cannot be separated in the best readings, and that Melville's own essay treats the darkness as the sign of a serious mind confronting its inheritance. The difference between the two writers is one of method and temperament rather than of purpose: Melville pushes the darkness into the epic and the tragic, Hawthorne contains it in the emblem.\n\n## Assessment\n\nThe theory of the romance is best understood as a claim about the conditions under which a moral truth about the human heart can be seen in fiction. Its three main statements, in the Seven Gables, Blithedale, and Marble Faun prefaces, agree that the romance has latitude, that its materials are shadow and ruin, that its end is moral, and that its ground is an actual place kept at the edge of plausibility. The Custom House adds a theory of discovery: the moral meaning of the romance is produced by the imagination working on inherited relics. Taken together, these claims make the romance a theory of moral knowledge that depends on the imagination as its instrument. The imaginative reading captures the freedom; the moral reading captures the purpose; the two are not in conflict once the instrument is seen as the means by which the purpose is pursued.\n\nThe distance from Emerson is real, but it is best described as a difference in conclusions drawn from a shared premise: that the self must find its way to moral truth. Emerson concludes the self is trustworthy, and Hawthorne concludes it is treacherous and inherited. The Brook Farm experience gave this difference its concrete form, and the Blithedale satire, whatever its failures, enacts it. The Thoreau relation shows that Hawthorne could admire empirical observation while refusing its method, and the Melville essay shows that the darkness of the romance could be read by a contemporary as a sign of depth rather than of failure.\n\nThe American Renaissance is a defensible period concept if it is treated as a historical claim rather than a canon. Matthiessen's five writers do share a set of problems, and the critics who expand the canon have not overturned the claim so much as enlarged it. The period should be read alongside its excluded literatures, and Hawthorne's place in it should be understood as one contested position among several, not the normative centre of a national tradition.\n\nThe chapter's most important unresolved question is whether the theory of romance can survive the historical reading that the period concept now requires. If the romance is a theory of inherited guilt, it is also a theory of the inheritance of the institutions that produced the guilt, and a reading that takes that seriously has to ask who was excluded from the inheritance and who paid for the shadows. Hawthorne's theory has room for that question, but his practice rarely pursues it, and that gap between theory and practice is where the most productive later criticism has worked.\n\n## Open Questions\n\nThe first open question concerns the text of the Custom House sketch. The passages quoted in this chapter come from a Project Gutenberg transcription, and their exact wording should be confirmed against the Ohio State Centenary edition of *The Scarlet Letter* before the formulation is relied on. A reader who needs the exact formulation should consult the Centenary edition directly.\n\nThe second concerns the Hawthorne letters on Brook Farm. The statement that the \"real Me was never an associate of the community\" is reported in a secondary reference and has not been checked against the letters themselves, which are collected in the Centenary Edition's letters volumes and in the Bowdoin holdings. Its significance for the Transcendentalist contrast depends on its exact context, which should be established before it is relied on.\n\nThe third concerns the notebook judgement of Fuller as \"a great humbug.\" The phrase is reported secondhand and should be checked in the Centenary journals before it is used as evidence for the Zenobia identification.\n\nThe fourth concerns the Cain and Reising critiques. The characterisation of Cain's argument rests on a summary, and the account of Reising's book rests on library and review descriptions rather than on a reading of the text. Both critiques should be read in full before the chapter's account of the canon debate is considered final.\n\nThe fifth concerns the Melville essay's wording. The transcription used here should be checked against the Northwestern-Newberry edition, since variants between the 1850 printing and the manuscript affect several of the quoted phrases.\n\n## Sources\n\n1. Nathaniel Hawthorne, \"Preface\" to *The House of the Seven Gables* (1851). Boston: Ticknor, Reed, and Fields. Text as reproduced by the USF Lit2Go edition. https://etc.usf.edu/lit2go/104/the-house-of-the-seven-gables/1745/preface/ . Tier 1. Primary text; the Lit2Go page is a reproduction, and the Ohio State Centenary Edition is the reference text for the phrases quoted.\n\n2. Nathaniel Hawthorne, \"Preface\" to *The Marble Faun* (1860). Boston: Ticknor and Fields. Text as reproduced by the Eldritch Press. https://ibiblio.org/eldritch/nh/mfpf.html . Tier 1. Primary text in reproduction; the quoted phrases were checked against this transcription.\n\n3. Herman Melville, \"Hawthorne and His Mosses,\" *The Literary World*, 17 and 24 August 1850, signed \"By a Virginian Spending July in Vermont.\" Transcription at https://ibiblio.org/eldritch/nh/hahm.html . Tier 1. Primary text in transcription; the Northwestern-Newberry edition should be consulted for exact wording.\n\n4. Nathaniel Hawthorne, journal entry of 1 September 1842, as printed in *Passages from the American Note-Books of Nathaniel Hawthorne* (Boston: Houghton Mifflin, 1896), reproduced at Walden Woods Project, https://www.walden.org/hawthorne-writes-about-thoreau/ . Tier 1. Primary text in a nineteenth-century printing; the Centenary journals are the scholarly source.\n\n5. William E. Cain, \"The Blithedale Romance,\" *American History Through Literature 1820–1870*, Encyclopedia.com, https://www.encyclopedia.com/arts/culture-magazines/blithedale-romance . Tier 2. Authoritative reference entry; the Brook Farm chronology, the letter quotation, and the Fuller and Hollingsworth identifications are reported from it, and the \"great humbug\" entry is attributed to the notebook through it.\n\n6. Nathaniel Hawthorne, \"The Custom-House\" (introduction to *The Scarlet Letter*, 1850). Ohio State University Press, Centenary Edition, *The Scarlet Letter*. Tier 1. Cited for the sketch's content; the exact phrasing is not quoted here, and no stable online URL was confirmed.\n\n7. F. O. Matthiessen, *American Renaissance: Art and Expression in the Age of Emerson and Whitman* (New York: Oxford University Press, 1941). Catalogue record at https://lib.yg.kobe-wu.ac.jp/opac/opac_link/bibid/BB01044229 . Tier 2. Scholarly monograph; the book's content is described from its title and the period-concept literature, not from a reading of the text in this chapter.\n\n8. William E. Cain, *F. O. Matthiessen and the Politics of Criticism* (Madison: University of Wisconsin Press, 1988). Cited through a secondary summary of its argument. Tier 2. The bibliographic details are from memory and were not checked against a catalogue in this session.\n\n9. Russell J. Reising, *The Unusable Past: Theory and the Study of American Literature* (London: Methuen, 1986; New Accents series). Routledge catalogue at https://www.routledge.com/Unusable-Past/Reising/p/book/9780415866422 . Tier 2. Scholarly monograph; the account of its argument is drawn from a review summary and a catalogue description. David S. Reynolds reviewed it in *American Literature*, March 1989, pp. 109–111.\n\n10. Blithedale preface (1852), as quoted through Cain (source 5). Tier 1 in origin; quoted here only as the phrases \"essentially a day-dream, and yet a fact\" and \"an available foothold between fiction and reality,\" both as reported in the Cain entry and not checked against the Centenary text."}, {"order": 5, "file": "05_Reception_And_Scholarly_Debate.md", "title": "Reception and the Scholarly Debate", "summary": "", "body": "# Reception and the Scholarly Debate\n\n## Bottom Line\n\nHawthorne's reputation has been argued over almost continuously since 1850, and most of the\nargument has concerned what kind of writer he was rather than whether he was good. Melville's\n1850 essay made him the figure of a dark, tragic American imagination, and that image held\nthrough the nineteenth century even as the Victorian critics who followed Henry James's 1879\nstudy found him admirable but remote. The mid-twentieth-century recovery turned him into a\nsymbolist and a myth-maker, and the debates that followed have pulled him in three directions:\ntoward the Puritan history he was writing about, toward a psychology of guilt and conscience,\nand toward a national romance that stages the making of American culture. The factual disputes,\nabout what he wrote when and what he said about slavery, are mostly settled in outline and still\nmatter for interpretation. The interpretive disputes, about what his symbols mean and whose side\nhis fiction takes, are not settled and probably will not be.\n\n## A Note on Method and Terms\n\nThis essay is a chapter in a larger study, so it does not retell the plots or the biography. It\nconcerns the history of how readers have judged the work, and the arguments those judgments have\nproduced. A few terms of art recur and should be defined on first use. Symbolism, in the sense\nthat matters here, is the mid-twentieth-century reading practice that treats Hawthorne's emblems\n(the scarlet A, the black veil, the brook, the portrait) as carriers of a doubled meaning, a\nliteral surface and a moral or metaphysical depth that the text invites the reader to decipher.\nThe New Criticism is the close-reading movement, associated with the American universities of\nthe 1930s through the 1950s, that treated the literary text as a self-contained object whose\nmeaning could be recovered from its own internal relations without appeal to the author's\nbiography or the historical moment. New historicism is the approach, associated especially with\nStephen Greenblatt and his circle from the early 1980s, that reads literary texts as\nparticipants in the circulation of power and discourse in their period, and treats the boundary\nbetween \"literary\" and \"historical\" documents as porous. Feminist criticism here means the body\nof work from the 1970s onward that asks how texts construct gender, who is made to speak and who\nis silenced, and whose experience is taken as the norm. Reader-response criticism is the family\nof approaches, from the late 1960s on, that locates literary meaning in the activity of the\nreader rather than in the text alone.\n\nEach school is stated here at its strongest, then given its objections, then the replies, then\nan assessment. Claims are sorted as established (the matter is not seriously disputed among\nspecialists), defensible (a reasonable reading that a competent critic could hold and argue\nfor), or contested (specialists disagree and the disagreement is itself the subject).\n\n## The 1850s: Popularity, Melville, and the Two Audiences\n\nThe first thing to get straight is that Hawthorne was popular before he was canonical. *The\nScarlet Letter* was published in Boston by Ticknor, Reed and Fields in 1850, and it sold well enough that its first printing of 2,500 copies is reported to have been exhausted within about ten days. The figure comes from the Maryland State Law Library's special-collections page, and dealer listings repeat it without adding an independent source, so it should be treated as a single-origin report. The broader fact of a quick sell-through is still consistent with the other evidence of the book's early success. The novel was read in Boston and Salem, reviewed widely, and discussed in\nthe kind of drawing rooms where the Peabody family's circle moved. That circle matters. Sophia\nPeabody, whom Hawthorne had married in 1842, was a painter and a reader of his work from its\nearliest stages, and her sister Elizabeth Palmer Peabody, the educator and bookseller who ran a\nBoston bookshop and was a central figure in the Transcendentalist and reform circles of the\nperiod, was among the people who shaped his local reputation. The Ticknor and Fields publishing\nhouse, and in particular William D. Ticknor, who handled Hawthorne's business affairs, gave him\na publisher committed to the American literary market in a way that the earlier American book\ntrade had not been. The publishing context is part of the reception story, and the reception\nhistory cannot be separated from the economics of the book trade that carried it.\n\nThe most consequential early reading, however, is Herman Melville's essay \"Hawthorne and His\nMosses.\" It was published anonymously, under the byline \"By a Virginian Spending July in\nVermont,\" in two installments in *The Literary World* on August 17 and 24, 1850. The essay is a\nreview of the *Mosses from an Old Manse* collection, but it is best understood as Melville's own\nstatement of what American literature could be. Melville argues that Hawthorne is a writer of\nprofound darkness, a writer who sees the \"blackness\" underneath the cheerful surface of American\nlife and renders it with an intensity that British and European writers, in Melville's account,\ncould not match. The most quoted phrase is the image of the other side, \"like the dark half of the physical sphere,\" shrouded in \"a blackness, ten times black,\" and the essay speaks of \"the power of blackness\" in Hawthorne's imagination\nand of the \"infinite obscure\" that furnishes his background. Melville's claim is not simply that\nHawthorne is gloomy. He claims that Hawthorne's darkness is a form of honesty, a refusal to\nflatter a democratic audience that wants its literature to be cheerful and affirming.\n\nThe essay has a textual history that matters for anyone quoting it. The Northwestern-Newberry\nedition, which is the standard scholarly text of Melville's writings, prints a version that\ndiffers in places from the version that appeared in the magazine, and a scholarly note in the\nliterature reports that Melville's manuscript was extensively revised before publication, with\nthe editorial involvement of Evert Duyckinck, the New York man of letters who ran the Literary\nWorld. Readers who quote the essay should say which text they are using. The differences may\nmatter for the argument about nationalism that Melville is making, since one scholarly article\nreportedly argues that the printed 1850 version carries a more sophisticated account of American\nliterary nationalism than the revised text does. That is an interpretive claim about the two\nversions, and the claim that the printed text differs is the part that can be settled by\ncollation. The interpretive question of how much weight to put on the difference is open.\n\nThe 1850s reception also has a second, more hostile strand. Hawthorne's relations with other\nAmerican writers were complicated by the perception that his work was morbid, retrospective, and\ndisconnected from the democratic energies of the moment. The
