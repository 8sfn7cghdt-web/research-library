and Affective Politics,\" *Polity* 55:4 (2023). Cited for the sentiments→residues inference and the modern restatement of Class I/Class II. https://www.journals.uchicago.edu/doi/full/10.1086/726280 — Accessed 2026-06-13. **Tier 2** (peer-reviewed journal). *Note:* the open-access PDF returned by one fetch was a mis-cached Atkinson economics paper; the substantive summary used here is from the abstract/search snippet and the article record, not the full text.\n8. \"Pareto's Concept of Residues and Derivation (7 Criticisms)\" and companion entries, Your Article Library (sociology study compendium summarizing Bogardus, Bottomore, and standard textbook critiques: vagueness, lack of psychological depth, agnosticism about the nature of residues). https://www.yourarticlelibrary.com/sociology/paretos-concept-of-residues-and-derivation-7-criticism/43783 — Accessed 2026-06-13. **Tier 5** (educational summary; used only as a pointer to the standard criticisms, which are independently attested in Aron/Coser/Bottomore; not relied on for any primary claim).\n9. \"Pareto's Concept of Residues: Meaning, Characteristics and Classification,\" Your Article Library; corroborated against the primary §888 table. Cited for the \"six classes, 26 subclasses, ~25 further subdivisions\" figure and the standard observation that Classes I and II are the analytically critical ones. https://www.yourarticlelibrary.com/sociology/paretos-concept-of-residues-meaning-characteristics-and-classification/43782 — Accessed 2026-06-13. **Tier 5** (educational summary; the substantive taxonomy verified directly against primary source [3]).\n10. Femia, Joseph V., *Pareto and Political Theory* (Routledge, 2006). Cited for the claim that derivations may be logico-experimentally false yet socially potent by activating residues, and for the argument that the residue theory does not strictly preclude liberal-democratic politics. Drawn from the publisher's description and review literature. https://www.routledge.com/Pareto-and-Political-Theory/Femia/p/book/9780415663717 — Accessed 2026-06-13. **Tier 2** (university/scholarly monograph; consulted via description/review, not read in full).\n11. \"Pareto's Concept of Derivation: Meaning, Characteristics and Types,\" Your Article Library; corroborated against primary §1419. Cited for the plain-language statement of the four classes (assertion, authority, accord with sentiment, verbal proof) with the \"honesty is the best policy\" example. https://www.yourarticlelibrary.com/sociology/paretos-concept-of-derivation-meaning-characteristics-and-types/43776 — Accessed 2026-06-13. **Tier 5** (educational summary; the four-class scheme verified directly against primary source [4]).\n12. \"Pareto, Vilfredo (1848–1923),\" Encyclopedia.com (drawing on the *International Encyclopedia of the Social Sciences*). Cited for the \"largely Baconian\" characterization of the logico-experimental method's empirical requirements. https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/pareto-vilfredo-1848-1923 — Accessed 2026-06-13. **Tier 2/5** (reference work drawing on a scholarly encyclopedia; method claim corroborated by primary §§6, 55, 69).\n13. Aron, Raymond, *Main Currents in Sociological Thought, Vol. II: Durkheim, Pareto, Weber* (Basic Books, 1967; orig. French *Les étapes de la pensée sociologique*), chapter on residues and derivations. Cited for Aron's framing of the theory of derivations as a contribution to the social psychology of inter-group/political relations, and his neo-Machiavellian reading of Pareto's anti-humanitarianism. Book record and chapter: https://www.taylorfrancis.com/chapters/mono/10.4324/9780203786703-11/residues-derivations-raymond-aron ; Internet Archive copy: https://archive.org/details/maincurrentinsoc0000raym — Accessed 2026-06-13. **Tier 2** (foundational secondary; consulted via chapter record/snippets, not read in full for this pass).\n14. Bongiorno, Andrew, \"A Study of Pareto's Treatise on General Sociology,\" *American Journal of Sociology* 36:3 (1930), pp. 349–370. The first major Anglophone scholarly study of the *Trattato*; Bongiorno later co-translated the English edition. Cited as the canonical early AJS analysis of the logical/non-logical and residue/derivation distinctions. https://doi.org/10.1086/215412 — Accessed 2026-06-13. **Tier 2** (peer-reviewed journal; consulted via record/abstract, not the full article for this pass).\n15. Coser, Lewis A., \"Vilfredo Pareto, 1848–1923,\" in *Masters of Sociological Thought: Ideas in Historical and Social Context* (Harcourt Brace Jovanovich, 1977). Standard scholarly overview; cited for the reception of the residue taxonomy's vagueness and the systemic-equilibrium emphasis. **Tier 2** (scholarly monograph; consulted via reference, not read in full).\n\n> **Single-source / consultation honesty.** Every claim about what Pareto *actually says* (the four-genera table at §151; the six residue classes and their § ranges at §888; Class I at §889; Class II at §§991–992; the four derivation classes at §1419; the a/b/c/d scheme and Combination ranking at §§2205–2206; the equilibrium definition at §§2067–2069; the final §2612) is sourced **directly to the primary text** [2–5], read in the original English edition via the Internet Archive full text, and is therefore Tier 1 and not single-source-fragile. The *critiques* (8.2–8.4) are the standard ones in the reception literature, attested across multiple secondary sources [6,8,13,15]; the *self-referential problem* (8.1) is presented as an inference generated by Pareto's own premises (§§6, 1397–1398) rather than attributed to a single named author, and is flagged as such. The bibliographic facts (page count, translators, volume titles, § range) are corroborated across [1], the primary volumes [2–5], and the translator's note."}, {"order": 5, "file": "05_Elite_Theory_And_The_Circulation_Of_Elites.md", "title": "Elite Theory and the Circulation of Elites", "summary": "", "body": "# Elite Theory and the Circulation of Elites\n\n## Bottom Line\n\nThe theory of elites is the spine of Pareto's sociology and the reason James Burnham resurrected him in 1943. It rests on one austere claim: every society, in every age, is governed by a minority. The interesting science is not *whether* a minority rules but *which* minority, *how* it rules, and *how* it is replaced. Pareto defines the \"elite\" twice: broadly and almost neutrally, as those who score highest in any branch of activity (the chess champion, the courtesan, the swindler, and the statesman all qualify in their own line); and narrowly, dividing the high-scorers into a *governing elite* that wields political power, a *non-governing elite* that does not, and the *non-elite mass* below. The mass is, for Pareto, an object of politics, not its subject. What makes the theory move is the **circulation of elites**: individuals rise into and fall out of the elite, and — more consequentially — whole governing classes give way. The psychological engine is the distribution of *residues* (treated at length in ws4). **Lions** run heavy in Class II residues (the persistence of aggregates — force, faith, group loyalty, the will to violence); **foxes** run heavy in Class I residues (the instinct for combinations — cunning, finance, manipulation, compromise). Their economic doubles are the conservative, lion-like **rentier** and the innovating, fox-like **speculator**. A governing class that fills up with foxes grows clever and rich but loses the nerve to use force; it decays, buys off its enemies, and is finally swept away by a counter-elite of lions rising from below. Hence \"history is a graveyard of aristocracies\" (§2053). Elite *closure* — the failure to recruit the able from below — is the trigger of revolution, and revolution is not the abolition of elite rule but the violent re-opening of circulation. From this Pareto derives his mordant verdict on modern democracy: a **\"demagogic plutocracy.\"** A fox-dominated elite of speculators and demagogues governs through manipulation, spoils, machine politics, and the manufacture of consent rather than open force, with \"humanitarian\" sentiment functioning as a symptom of elite self-disarmament. The theory bites hardest as a deflationary tool against political pieties. It is weakest where it has been most attacked: as pessimistic and near-circular, defining \"elite\" so broadly it risks tautology, underrating institutions, ideas, and genuine mass agency, and resting on a lion/fox typology more literary than measurable.\n\n---\n\n## 1. Two Definitions of the Elite\n\nPareto builds his elite concept from the ground up, taking unusual care to strip away the honorific freight the word usually carries. He lays the definition out in the *Trattato di sociologia generale* (1916), Chapter XIII, in the famous run of paragraphs that the Livingston–Bongiorno English edition, *The Mind and Society* (1935), numbers §§2025–2059. [1][2]\n\n### 1.1 The broad, statistical sense\n\n\"In a broad sense,\" Pareto writes, \"I mean by the elite in a society people who possess in marked degree qualities of intelligence, character, skill, capacity, of whatever kind. … On the other hand I entirely avoid any sort of judgment on the merits and utility of such classes\" (§2026n, quoting his student Marie Kolabinska). [1] The procedure is deliberately mechanical: imagine assigning every individual, in every branch of human activity, an index \"the way grades are given in the various subjects in examinations in school.\" The best lawyer gets 10; the man who never gets a client, 1; the idiot, 0. The man who made millions, honestly or dishonestly, gets 10; the sneak-thief who grabs a fork and runs into a policeman's arms gets 1. The courtesan who infatuates a man of power and shapes his career — Aspasia, Maintenon, Pompadour — gets 8 or 9; the strumpet who merely satisfies the senses gets 0. The poet Carducci gets 8 or 9 \"according to our tastes\"; the scribbler, 0 (§2027). [1]\n\nThen comes the constitutive move: \"So let us make a class of the people who have the highest indices in their branch of activity, and to that class give the name of *elite*\" (§2031). [1] The elite is simply the top of every distribution, lumped together. Note three features. First, it is value-neutral by construction: the swindler and the saint can both be elite. Second, it is *actual*, not potential — the student who \"could\" know English but doesn't gets a zero, and Pareto applies the same rule to virtue (\"his grade as a thief is zero,\" §2028). [1] Third, it is plural: every field has its elite, and most of them have nothing to do with governing.\n\n### 1.2 The narrow, political division\n\nFor the study of *social equilibrium* — Pareto's real object — he subdivides the elite. \"It will help if we further divide that class into two classes: a governing elite, comprising individuals who directly or indirectly play some considerable part in government, and a non-governing elite, comprising the rest\" (§2032). [1] The chess champion is elite, \"but it is no less certain that his merits as a chess-player do not open the doors to political influence for him; and hence … he is not a member of the governing elite\" (§2033). [1]\n\nThe result is the three-tier stratification that the whole theory presupposes: \"So we get two strata in a population: (1) A lower stratum, the non-elite … then (2) a higher stratum, the elite, which is divided into two: (a) a governing elite; (b) a non-governing elite\" (§2034). [1] Some later commentators add a fourth label, the *political elite* — those who \"effectively and particularly exercise political power\" — but this is a refinement of the governing-elite category, not a new tier. [2]\n\n### 1.3 Labels, not examinations\n\nPareto then complicates his own scheme, and the complication matters for his politics. \"In the concrete, there are no examinations whereby each person is assigned to his proper place\" (§2035). [1] *Labels* fill positions — \"lawyer,\" \"minister,\" \"Senator,\" \"general\" — and the fit between label and quality is loose. In the open professions the label is mostly won directly. But in the governing elite \"some of the labels — the label of wealth, for instance — are hereditary,\" and \"an individual who has inherited a sizable patrimony can easily be named Senator … or can get himself elected to the parliament by buying votes\" (§2036). [1] The gap between the label-holders and the genuinely high-scoring is therefore *variable*, and its variation \"give[s] rise to situations having an important bearing on the social equilibrium\" (§2040). [1] This is the seam through which decay enters: when too many in the governing elite wear labels they have not earned, and too many of the genuinely able are left labelless below, the system is primed for circulation — or, if circulation is blocked, for collapse.\n\n> **Cross-reference (ws4).** The \"index of activity\" and the residues machinery are two faces of the same anthropology. The *quality* an elite needs is, in Pareto's framework, a matter of which **residues** predominate in it — see ws4 Claim 4.x on Class I (instinct for combinations) and Class II (persistence of aggregates). The elite definition here is the social-stratification correlate of the residue theory there.\n\n---\n\n## 2. Every Society Is Ruled by a Minority\n\nUnderneath the careful definitions sits a flat empirical thesis, which Pareto shares with Mosca: there has never been, and on his account never can be, a society in which the many rule the few. As Tom Bottomore puts the shared premise of the Italian elitists, \"in every society there is, and must be, a minority which rules over the rest of society.\" [3] Raymond Aron, in his classic essay, defines the elite simply as \"the minority which, in any society, performs the function of ruling the community.\" [3]\n\nFor Pareto the rule is not even contingent on the form of government. Among the quotations gathered from his political writing: \"All governments use force, and all assert that they are founded on reason. … it is always an oligarchy that governs.\" [4] And the corollary that makes him so quotable on the right and so detested on the left: in modern democracies the diverse natures of men have produced an arrangement \"to provide the appearance of power in the people and the reality of power in an elite.\" [4] The mass, in this picture, is the medium in which elites compete and the resource they mobilize — but it is not itself an agent. It is, in the corpus's framing, an *object* of politics, not a *subject*.\n\nThis claim does the most ideological work and draws the most fire, so its exact status is worth pinning down. Pareto is not saying the mass has no *causal weight* — the welling-up of Class II residues \"from the lower stratum\" is, as we will see, the very thing that renews or topples elites (§2048). [1] He is saying the mass does not *govern itself*: collective rule is, for Pareto, a derivation (a comforting myth), not a fact. The strong reading — that the masses are cognitively incapable of politics — Pareto does *not* assert. Natasha Piano stresses that his analysis \"does not impute to the masses an inherent cognitive incapacity for participating in politics,\" but rather emphasizes \"the durability of the complex process of the construction of their passivity.\" [5] That distinction will reappear in §8 as one of the live cracks in the theory.\n\n---\n\n## 3. The Circulation of Elites\n\n### 3.1 Two senses of circulation\n\nPareto's \"circulation of elites\" (*circulation des élites*; Italian *circolazione delle élites*) names two related but distinct processes, and a great deal of confusion in the secondary literature comes from running them together. The translator Arthur Livingston flags the ambiguity in a footnote: the phrase has been used to mean only \"circulation *within* the elite,\" but the principles \"apply to circulation within such lower classes as one may choose\" too (§2042n). [1]\n\nThe two senses are:\n\n1. **Individual circulation** — the movement of particular persons *into* the elite (the parvenu, the upstart, the \"new man\" who has \"always been a subject of interest,\" §2047) and *out* of it (the degenerate scion who slides back down). [1] This is ordinary social mobility, but Pareto treats it as functionally vital: it is how the elite restocks itself with quality.\n\n2. **Replacement of whole governing elites** — the wholesale supersession of one governing class by another, sometimes gradually, sometimes by revolution. This is the macro-historical sense that gives the theory its bite. As Pareto frames the whole of history elsewhere: \"History of men is the history of the continuous replacement of certain elites: as one ascends, another declines.\" [2]\n\n### 3.2 Circulation as the river and the flood\n\nThe most vivid statement of the macro-process is §2056: \"In virtue of class-circulation, the governing elite is always in a state of slow and continuous transformation. It flows on like a river, never being today what it was yesterday. From time to time sudden and violent disturbances occur. There is a flood — the river overflows its banks. Afterwards, the new governing elite again resumes its slow transformation. The flood has subsided, the river is again flowing normally in its wonted bed.\" [1] The river is ordinary individual circulation; the flood is revolution. Both are *the same process at different velocities*.\n\n### 3.3 Velocity, supply, and demand\n\nPareto treats the *rate* of circulation as the key variable and analyzes it in frankly economic terms of supply and demand. \"Velocity in circulation has to be considered not only absolutely but also in relation to the supply of and the demand for certain social elements\" (§2044). [1] A country always at peace overproduces generals it does not need; a country at continuous war cannot produce enough (§2044). [1] One note anticipates the modern \"elite overproduction\" literature by a century. Kolabinska, whom Pareto endorses, observes that when \"the production of persons possessing unusual qualities as regards education may far surpass the number of such persons that the elite can accommodate … then we get what has been called an 'intellectual proletariat'\" (§2044n). [1] An over-supply of would-be elites who cannot be absorbed is, on this analysis, destabilizing.\n\n---\n\n## 4. History Is a Graveyard of Aristocracies\n\nThe phrase everyone quotes states the master conclusion of the whole theory, and it sits at §2053: \"Aristocracies do not last. Whatever the causes, it is an incontestable fact that after a certain length of time they pass away. **History is a graveyard of aristocracies.** The Athenian 'People' was an aristocracy as compared with the remainder of a population of resident aliens and slaves. It vanished without leaving any descent. The various aristocracies of Rome vanished in their time. … Where, in France, are the descendants of the Frankish conquerors? … very few families still remain to claim descent from the comrades of William the Conqueror. The rest have vanished.\" [1]\n\nThe decisive sentence is the next one, because it specifies the *mechanism* of decay and ties it directly to the residues: \"They decay not in numbers only. They decay also in quality, in the sense that they lose their vigour, that there is a decline in the proportions of the residues which enabled them to win their power and hold it\" (§2054). [1] An aristocracy is not destroyed mainly by being out-bred or out-numbered. It is hollowed out by a change in its *psychic composition* — it loses the residues that built it, above all Class II: faith, loyalty, the will to fight.\n\nTwo movements \"restore\" the governing class, Pareto says: \"by families rising from the lower classes and bringing with them the vigour and the proportions of residues necessary for keeping themselves in power,\" and \"by the loss of its more degenerate members\" (§2054). [1] When *either* movement stalls, trouble begins; \"if they both come to an end, the governing class crashes to ruin and often sweeps the whole of a nation along with it\" (§2055). [1] The danger Pareto names is symmetrical and precise: \"the accumulation of superior elements in the lower classes and, conversely, of inferior elements in the higher classes\" (§2055). [1]\n\nThis is the analytic heart of the corpus, and it is worth stating it as a closed loop:\n\n- An elite holds power because of a certain mix of residues (and, behind them, certain qualities).\n- Over generations, hereditary labels detach quality from position; the elite's residue mix drifts (typically: away from Class II force/faith, toward Class I cunning/combination).\n- Meanwhile able, vigorous people accumulate *below*, denied entry.\n- If circulation re-opens — the able are recruited up, the degenerate fall out — the elite renews itself and the cycle resets (the river).\n- If circulation is *blocked* (elite closure), the pressure builds until it bursts (the flood: revolution).\n\n---\n\n## 5. The Engine: Lions and Foxes\n\n### 5.1 Force and cunning, Class II and Class I\n\nPareto borrows the imagery from Machiavelli's *Prince* — the prince must be part lion (to frighten wolves) and part fox (to recognize traps) — but he grounds it in his own residue theory. **Lions** are elites in whom **Class II residues (persistence of aggregates)** predominate: they have faith, ideology, group loyalty, and class solidarity; they gain and hold power through force. **Foxes** are elites in whom **Class I residues (instinct for combinations)** predominate: they innovate, experiment, calculate, manipulate, prefer materialistic to idealistic goals, lack fidelity to fixed principles, and rule by guile, fraud, finance, and compromise. [6][7] (For the residue classes themselves, see ws4 Claim 4.x.)\n\nThe crucial point, and the one casual summaries miss: this is not a static taxonomy of two kinds of ruler. It is a *dynamic* about the changing *proportions* of the two residue-types inside one governing class over time, and the cycle that the shifting proportion drives.\n\n### 5.2 The degeneration cycle, in Pareto's own steps\n\nThe mechanism is set out with unusual rigour at §2178. Tracing \"the correlations that subsist between this method of applying force and other social facts,\" Pareto lays out the sequence by which a governing class shifts from lions to foxes: [8]\n\n> \"1. A mere handful of citizens, so long as they are willing to use violence, can force their will upon public officials who are not inclined to meet violence with equal violence. If the reluctance of the officials to resort to force is primarily motivated by **humanitarian sentiments**, that result ensues very readily. … 2. To prevent or resist violence, the governing class resorts to 'diplomacy,' fraud, corruption — **governmental authority passes, in a word, from the lions to the foxes.** … In the long run that sort of procedure comes to exercise a far-reaching influence on the selection of the governing class, **which is now recruited only from the foxes, while the lions are blackballed** … 3. So it comes about that the residues of the combination-instinct (Class I) are intensified in the governing class, and the residues of group-persistence (Class II) debilitated. … 4. Policies of the governing class are not planned too far ahead in time. … making the governing class more satisfied with the present and less thoughtful of the future. … 5. Some of these phenomena become observable in international relations as well. Wars become essentially economic. Efforts are made to avoid conflicts with the powerful and the sword is rattled only before the weak.\" (§2178) [8]\n\nRead it as a feedback loop: an initial reluctance to use force (often from humanitarian conviction) → reliance on guile instead → selection pressure that promotes foxes and freezes out lions → an ever-more-fox-heavy elite that is cleverer, richer, more present-minded, and steadily *less willing and less able to use force at all*. The elite selects for its own helplessness.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The lion→fox degeneration cycle (Trattato §§2178–2179, 2057)<\/div><div class=\"viz-flow\"><span class=\"flowstep cv-fade\" style=\"--d:0.00s\">Lion-elite wins power by force<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.08s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.16s\">Grows rich; reluctant to use force<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.24s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.32s\">Rules by guile, fraud, finance<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.40s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.48s\">Foxes selected in, lions blackballed<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.56s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.64s\">Elite closes its ranks<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.72s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.80s\">Able lions accumulate below<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.88s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.96s\">Counter-elite overthrows it<\/span><span class=\"flowarrow cv-fade\" style=\"--d:1.04s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:1.12s\">Circulation re-opens — cycle resets<\/span><\/div><figcaption>Revolution does not abolish elite rule; it replaces one governing elite with another and re-opens the clogged channels of circulation. The masses do the fighting; a counter-elite does the ruling. <span class=\"credit\">Source: Pareto, The Mind and Society §§2178–2179, 2057.<\/span><\/figcaption><\/figure>\n\n\n\n### 5.3 The counter-movement and revolution\n\nThe other half of the cycle is the rise of the lions from below. §2179 gives the corresponding relations on the subject-class side: \"When the subject class contains a number of individuals disposed to use force and with capable leaders to guide them, the governing class is, in many cases, overthrown and another takes its place. **That is easily the case where governing classes are inspired by humanitarian sentiments primarily, and very very easily if they do not find ways to assimilate the exceptional individuals who come to the front in the subject classes. A humanitarian aristocracy that is closed or stiffly exclusive represents the maximum of insecurity.**\" [8]\n\nThat sentence fuses three of the workstream's load-bearing claims into one: humanitarian sentiment (fox-rule), elite closure, and revolution. A fox-heavy elite that has lost the will to fight *and* shut its doors to able newcomers is at maximum risk. A clever elite that co-opts the talented — assimilating \"most of the individuals in the subject class who show those same talents\" — is, by contrast, \"in the highest degree difficult to overthrow\" (§2179). [8] Co-optation, not repression, is the foxes' best survival strategy.\n\nSo the full cycle: a lion-elite wins power by force, grows wealthy, drifts toward foxes, loses its nerve, closes ranks, and is overthrown by a new lion-elite welling up from below — which then begins the same descent. History oscillates between rule by force and rule by cunning, \"from rule by lions to rule by foxes and back again,\" and a *durable* elite is precisely one that keeps \"a strong mixture of both Class I and Class II elements.\" [6][7]\n\n### 5.4 Revolution as re-opening, not abolition\n\nPareto's theory of revolution (§2057) follows directly: \"Revolutions come about through accumulations in the higher strata of society — either because of a slowing-down in class-circulation, or from other causes — of decadent elements no longer possessing the residues suitable for keeping them in power, and shrinking from the use of force; while meantime in the lower strata of society elements of superior quality are coming to the fore, possessing residues suitable for exercising the functions of government and willing enough to use force.\" [1] And the deflationary observation that recurs in his work: \"in general, in revolutions the members of the lower strata are captained by leaders from the higher strata\" (§2058) — it is the *decayed part of the old elite* that supplies the brains for the uprising. [1] Pareto put it bluntly: \"almost all revolutions have been the work, not of the common people, but of the aristocracy, and especially of the decayed part of the aristocracy.\" [4]\n\nThe political upshot is what most separates Pareto from every emancipatory theory of revolution: revolution does **not** abolish elite rule. It *replaces* one governing elite with another and re-opens the clogged channels of circulation. The masses do the fighting; a counter-elite does the ruling. After the flood, the river resumes in its bed (§2056). [1] This is the precise point Burnham seized on, and the precise point Marxists most resent — for Pareto, the \"classless society\" is a derivation, a comforting myth, not an achievable state.\n\n---\n\n## 6. The Economic Analog: Rentiers and Speculators\n\nPareto, the Lausanne economist turned sociologist, gives the lion/fox cycle an economic twin, and the parallel is exact and deliberate. The classification (§§2233–2236) descends from his 1911 essay \"Rentiers et spéculateurs.\" [9]\n\nHe sorts income-earners into two categories. **Group S — \"speculators\"** — are \"individuals whose incomes are essentially variable and depend upon the person's wide-awakeness in discovering sources of gain\": entrepreneurs, promoters, stockholders, building-and-land speculators, stock-exchange operators, bankers \"who make money on governmental, industrial, and commercial loans,\" and all who \"directly or indirectly speculate and in one way or another manage to increase their incomes by ingeniously taking advantage of circumstances\" (§§2233–2234). [9] **Group R — \"rentiers\"** — are \"persons who have fixed or virtually fixed incomes not depending to any great extent on ingenious combinations\": savers, annuitants, bondholders, owners of non-speculative real estate, and the salaried and wage-earning who depend on them (§2234). [9]\n\nThe mapping to the residues is explicit: \"In the speculator group Class I residues predominate, in the rentier group, Class II residues\" (§2235). [9] Speculators are the economic foxes; rentiers are the economic lions. And the social functions mirror the political ones: \"The S group is primarily responsible for change, for economic and social progress. The R group, instead, is a powerful element in stability, and in many cases counteracts the dangers attending the adventurous capers of the S's. A society in which R's almost exclusively predominate remains stationary and, as it were, crystallized. A society in which S's predominate lacks stability, lives in a state of shaky equilibrium that may be upset by a slight accident from within or from without\" (§2235). [9]\n\nTwo refinements keep this from being crude. First, Pareto warns against confusing R's with \"conservatives\" and S's with \"progressives\" — the categories are *psychological*, not partisan; an R-revolution founded the Roman Empire and (he says) drove the Protestant Reformation (§2235). [9] Second, and here the economic analog feeds straight back into the politics, the rentiers, \"blinded by sentiment,\" are repeatedly \"the artisans of their own ruin\": the feudal lords who let the Crusades destroy them, and \"the French nobility living on income … not succumbed to the lure of humanitarian sentiments, they would not have prepared the ground for the Revolution that was to be their undoing.\" In Pareto's own day, \"those among the R's who are known as 'intellectuals' are following in the footprints of the French nobles of the eighteenth century and are working with all their might to encompass the ruin of their own class\" (§2235). [9] The balance of S and R types in the governing class, he concludes at §2236, \"correspond to differing\" political characters of the regime — exactly the bridge to his account of democracy. [9]\n\n---\n\n## 7. Democracy as Demagogic Plutocracy\n\n### 7.1 The diagnosis\n\nFew parts of Pareto's work are cited more and read less sympathetically than his verdict on modern liberal democracy. He calls it a **\"demagogic plutocracy\"** (*plutocrazia demagogica*) — Joseph Femia, whose 1995 article remains the standard treatment, calls it Pareto's term for \"the liberal state.\" [10][11] The structure is this: a fox-dominated, speculator-heavy elite (the plutocrats) holds real power but governs *behind a democratic façade* by manufacturing consent — manipulating mass sentiment, dispensing spoils, running the machine — rather than by open force. \"Plutocrats are able to forge an effective union because they are astute and can deceive the masses by manipulating public sentiment. This gives rise to the widely observed phenomenon of demagogic plutocracy\" (Pareto, *Trasformazione della democrazia*, 1921, as rendered by Lombardinilo). [11]\n\nThe \"demagogic\" half is essential, and it is what distinguishes Pareto's plutocracy from a naked oligarchy: the speculator-elite *needs* the demagogue's arts to keep the consent of the numbers, allying with the working classes and buying acquiescence. Pareto's own account of how it is actually done is unsparing. The governing class, he writes at §2257, holds power through two instruments drawn from the subject class: \"The one group uses force and is made up of soldiers, police … the other uses cunning\" — and in the United States, his exemplar, \"the chief actual instrument of governing … is the political 'machine.'\" The machine's \"principal way is the least conspicuous\": the administration \"looks after the interests of\" favored groups by tacit understanding, while the cruder methods — \"the bribery of voters, elected officials, government ministers, newspaper-owners\" — are better known but, Pareto drily notes, only \"regarded as more important from the ethical standpoint\" (§2257). [12] This is rule by manipulation and the manufacture of consent, set down in 1916.\n\n### 7.2 The myth of democracy\n\nBecause politics for Pareto is overwhelmingly *non-logical*, \"democracy\" itself is a **derivation** — a myth that rationalizes and legitimizes the rule it conceals, not a description of who rules. Burnham makes this the center of his reading: democratic ideology is \"equally ridiculous from the point of view of scientific truth\" as any other political formula, but may serve or harm a society depending on context. [13] What matters about a political myth is not its truth but its social utility — the alignment it produces between individual and collective interest. [13] This is the kinship with Sorel's \"myth\" and with Mosca's \"political formula\": the open creed of a regime is a mask over the real distribution of power.\n\nAgainst the flatter readings, one point bears stressing: Pareto's contempt is aimed at *demagogic plutocracy specifically*, not at all popular government. Femia notes that Pareto \"harboured a lingering admiration for the democratic ideal,\" that his \"critique of demagogic plutocracy stemmed from a desire to safeguard liberal individualism against the encroachments of the leviathan state,\" and that Pareto in fact praised Switzerland's \"forms of direct democracy\" as \"the best government now in existence\" (§ in *The Mind and Society*, p. 1568). [14][15] This is the textual basis for Femia's \"sceptical liberal\" Pareto (see §9).\n\n### 7.3 Humanitarianism as elite self-disarmament\n\nThe final move folds the democracy critique back into the lion/fox cycle. \"Humanitarian\" sentiment — the cluster of derivations urging tolerance, non-violence, sympathy for the criminal and the enemy — is, for Pareto, the ideological symptom of a fox-elite that has lost the nerve to defend itself. Recall §2178: the reluctance to meet violence with violence, \"if … primarily motivated by humanitarian sentiments,\" lets a determined minority impose its will \"very readily.\" [8] And §2179: \"a humanitarian aristocracy that is closed or stiffly exclusive represents the maximum of insecurity.\" [8] Humanitarianism is not, in this reading, a moral advance; it is the rationalization a decadent elite tells itself while disarming. Pareto pairs it explicitly with the rentier-intellectuals \"working with all their might to encompass the ruin of their own class\" (§2235), and with the \"spineless humanitarians\" who let their cause go undefended. [9] The cycle is thus also a cycle of *ideology*: lion-elites believe in something and will fight; fox-elites believe in tolerance and will not — and that belief is the leading edge of their fall.\n\nApplied to his own moment — 1920s Europe — Pareto saw the liberal demagogic-plutocracies generating ruinous public debt and exhausting taxation, breeding the reaction (whether socialist or, as it turned out, fascist) that would replace them. \"Increase in the wealth per capita fosters democracy; but the latter … entails great destruction of wealth … Hence it is its own grave-digger.\" [4] The relation of all this to the fascism question — whether Pareto's late writings amount to a welcome of Mussolini or a diagnosis that happened to be vindicated — is the subject of ws6 and is bracketed here.\n\n---\n\n## 8. The Strongest Objections — Going Beyond Burnham\n\nBurnham presented Pareto as a hard-headed scientist of politics whose realism was a \"defense of freedom.\" A 2026 reading has to be more adversarial. Here are the strongest objections, each followed by where the theory nonetheless bites.\n\n### 8.1 Pessimism and near-circularity\n\nThe deepest charge is that the theory is a closed, self-confirming pessimism. Aron, a broadly sympathetic reader, calls Pareto an \"ironic pessimist,\" \"the spokesman for a pessimistic or cynical way of thinking which, fortunately, no one has ever believed in altogether, not even Pareto himself.\" [16] Worse than the mood is the *structure*: the theory risks being unfalsifiable. If an elite rules well, it is a healthy mix of lions and foxes; if it rules badly and falls, it had become too foxy and decadent. Either way the theory is confirmed. Aron presses exactly this: Pareto's circulation-of-elites analysis is \"overly psychological,\" reducing \"historical complexities by interpreting all elites through the frame of the same opposing sets of residues,\" collapsing \"the diversity of forms of government into dualism,\" and thus failing to \"represent reality in all its complexity.\" [16] Pareto's translation of all behavior into residues, Aron concludes, traps him at \"an intermediary level\" that is \"neither particularly psychological nor specifically historical,\" leaving his sociology \"somewhat lacking in explanatory power.\" [16]\n\n*Where it bites anyway:* even a near-tautology can be a useful lens if it directs attention to real variables. \"Watch the recruitment rate from below\" and \"watch whether the elite still has the will to use force\" are genuinely diagnostic questions, not empty ones — they generate predictions (closed + disarmed = unstable) that are at least in principle checkable.\n\n### 8.2 \"Elite\" defined so broadly it risks tautology\n\nThe statistical definition — \"those with the highest index in any activity\" — is so capacious that, critics note, it threatens to define the elite into existence: the elite is whoever is on top, so \"society is ruled by an elite\" reduces to \"society is ruled by whoever rules.\" There is also a documented *internal* ambiguity: Pareto slides between passages where elite position reflects superior qualities and passages where position is assigned by *label* (§§2035–2036) regardless of quality — so the \"elite\" may be precisely those who do *not* have the requisite capabilities. [17] And Pareto offers \"no method of measuring and distinguishing between the supposedly superior qualities of the elite\" and the mass; he \"simply assumes\" the superiority. [17]\n\n*Where it bites anyway:* the label/quality gap that creates the ambiguity is also the theory's sharpest empirical tool — the *mismatch* between who wears the labels and who has the qualities is a measurable thing (hereditary office, blocked mobility, credential inflation) and is exactly what the closure-and-revolution claim turns on.\n\n### 8.3 Underrating institutions, ideas, and mass agency\n\nThe most consequential modern objection is that Pareto's psychologism crowds out three things that demonstrably move history: **institutions** (constitutions, parties, courts, federalism — Mosca, by contrast, gave the \"political formula\" and organizational structure real causal weight, which is why Bottomore finds Mosca's \"ruling class\" more sociologically supple than Pareto's residue-driven \"governing elite\"); [18] **ideas** as more than rationalizing derivations (Pareto's treatment of all doctrine as ex-post justification denies ideology any independent causal force, which is hard to sustain against, e.g., the actual history of abolition or of constitutional design); and **genuine mass agency** (the claim that the masses are only an object, never a subject). On the last, Femia identifies a real tension *inside* Pareto: alongside the \"primacy of residues\" that \"renders democracy impossible,\" there is Pareto's own logic of \"reciprocal determination,\" on which \"the extension of democratic practices could encourage innovative fox-like Class I tendencies among the masses, making them more capable of governing themselves.\" [14] Pareto's system, in other words, contains the resources to refute his own fatalism about the mass — a point he never developed.\n\n*Where it bites anyway:* the institutional critique is decisive *against the strong form* of the theory but compatible with a chastened version — institutions are, among other things, *devices for managing circulation* (open recruitment, peaceful elite turnover via elections). Higley and Burton's \"elite settlement\" research and the broader democratic-elitism tradition essentially reconstruct Pareto's circulation as an institutional variable: stable democracies are those that have institutionalized peaceful elite circulation. [3]\n\n### 8.4 The lion/fox typology is literary, not measurable\n\nThe lions-and-foxes (and rentiers-and-speculators) typology is vivid precisely because it is metaphor. Pareto never operationalizes \"the proportion of Class II residues in the governing class\"; there is no index, no measurement, no time-series — only illustrative history (Athens vs. Sparta, the late Roman Empire, Louis XVI, the Victorian aristocracy \"heralded\" into decline \"by the 'Parliament Bill,'\" §2059). [1][13] The economic version (S vs. R) is more tractable — one can in principle classify incomes as variable vs. fixed — but even there Pareto concedes the categories blur (§2235). [9] The danger is that the typology becomes a Rorschach: any decline can be narrated as foxes-displacing-lions after the fact.\n\n*Where it bites anyway:* the typology has proven genuinely *generative* — it maps recognizably onto real oppositions (force vs. fraud, faith vs. calculation, finance vs. arms, conviction vs. compromise) and it generated a falsifiable-ish modern descendant in Peter Turchin's quantitative \"elite overproduction,\" which *does* attempt to operationalize the supply-of-elites-vs-positions variable Pareto sketched at §2044n. [19]\n\n### 8.5 The \"two graveyards\" rejoinder\n\nMeisel's pointed summary captures the ambivalence at the theory's core: Pareto could claim to have been, \"like Marx, one of [the bourgeoisie's] most effective grave-diggers\" even as he was \"the bourgeoisie's answer to Marx.\" [16] The theory cuts both ways. Read as the right reads it, it is a counsel of elite self-preservation (recruit the able, keep your nerve, don't disarm). Read as Piano and the recent revisionists read it, it is \"a subversive tool disrupting the domination of a particular ruling class\" — an anti-plutocratic exposé in the service, ultimately, of \"a greater striving for democracy.\" [5][20] That a theory can be enlisted by both Mussolini and the Jacobin essayist (§ below) is either its great flaw or its peculiar power.\n\n---\n\n## 9. The Revisionist Pareto and the Contemporary Revival\n\n### 9.1 Sceptical liberalism\n\nThe dominant scholarly correction to Burnham's (and the right's) Pareto runs through Femia. On Femia's reading, Pareto belongs not to proto-fascism but to \"the Machiavellian tradition of sceptical liberalism\": a realist who places \"force and conflict at the heart of politics,\" who is anti-utopian and anti-universalist, but who retains \"a recognition of objective cognitive norms\" and a commitment to \"the ethical primacy of the individual.\" [14][21] Femia argues Pareto \"would have been a critic of fascism had he lived beyond 1923\" — and that his critique of demagogic plutocracy was, at bottom, a *defense of liberal individualism* against the leviathan state. [14] Robert Jackson's 2021 article situates this within a wider re-evaluation (Piano, Finocchiaro, Bellamy) that reframes the Italian elitists not as \"elite theorists of democracy\" but as \"democratic theorists of elitism\" — pessimists whose honest exposure of elite rule was meant to *spur* democratization, not foreclose it. [22][5] This is the most important way a 2026 reading goes beyond Burnham, who flattened the liberal-sceptical and anti-plutocratic dimensions in favor of the realist \"defense of freedom.\"\n\n### 9.2 The political revival\n\nPareto's circulation of elites has had a striking second life in 2010s–2020s political argument, mostly on the right. The phrase has become a recognized motif: an entrenched governing elite becomes \"sclerotic, corrupt, or weak\" and is replaced by \"a new elite arising from below\" — a frame congenial to populist and \"post-liberal\" critiques of the managerial class. [23] The transmission belt is largely Burnham: contemporary writers route Pareto through Burnham's *Machiavellians* and *Managerial Revolution*, and Burnham's managerial-elite thesis has been \"repurposed into an anti-globalist critique.\" [24] Online-right and \"neo-reactionary\" writers (Curtis Yarvin among them, later cited by figures in mainstream politics) have folded a zero-sum, Paretian \"regime change by elite replacement\" into their social theory. [23][25] On the left, Clyde Barrow's March 2026 *Jacobin* essay reads Pareto's \"sociology of a ruling class in decline\" as a disturbingly apt diagnosis of the contemporary United States — lions giving way to foxes, force \"deployed for personal retribution rather than public interest\" — while noting Barrow omits a reckoning with Pareto's own anti-egalitarianism. [26]\n\n### 9.3 The scholarly revival\n\nAcademic political theory has returned to elite theory on its own track. A 2022 *Topoi* special issue (\"Elite Theory: Philosophical Challenges\") frames a revival of interest premised on elite theory's \"explanatory strength\" for the discontents of contemporary democracy. [27] And Turchin's cliodynamics has given the supply-side of circulation — \"elite overproduction\" — a quantitative research program and a public profile, complete with the (contested) 2010 prediction of serious U.S. unrest \"around 2020.\" [19] Whether this amounts to vindication or merely fashion is the question ws8 and the forecast take up; the point here is that the *core mechanism* of this document — circulation, closure, and the lion/fox cycle — is the live wire that the revival has grabbed.\n\n---\n\n## Open Questions\n\n1. **Is the theory falsifiable?** Aron and others charge near-circularity. Turchin's elite-overproduction program is the most serious attempt to operationalize a Paretian variable — does it actually rescue the theory's testability, or does it test something narrower than Pareto claimed? (See ws8 / forecast.)\n2. **How much does the §2035–2036 label/quality ambiguity damage the theory?** If \"elite\" is sometimes the genuinely able and sometimes whoever holds the label, is the circulation thesis one claim or two? Femia and Bellamy disagree on how serious the inconsistency is. [17][14]\n3. **Does Pareto's own \"reciprocal determination\" defeat his fatalism about the masses?** Femia thinks Pareto's system contains an undeveloped argument that democratic practice could make the masses capable of self-government. [14] How far can this be pushed without abandoning the elite principle?\n4. **Lions/foxes vs. rentiers/speculators — is the economic analog tighter or looser than the political one?** The S/R distinction is more measurable; does that make it a better theory, or does it just relocate the vagueness?\n5. **What exactly did Pareto think *causes* the lion→fox drift?** §2178 describes the selection mechanism but the *initiating* cause (why the first reluctance to use force?) hovers between \"humanitarian sentiment\" (ideational) and structural affluence — a tension that maps onto the institutions-vs-psychology debate.\n6. **Is the contemporary right's \"circulation of elites\" actually Pareto's, or a Burnham-mediated simplification?** The zero-sum \"replace the regime\" reading drops Pareto's emphasis on *gradual* circulation (the river) and on *co-optation* as the foxes' winning strategy. (ws7 / ws8.)\n\n---\n\n## Sources\n\n1. Pareto, Vilfredo. *The Mind and Society* (*Trattato di sociologia generale*, 1916), trans. Andrew Bongiorno & Arthur Livingston, ed. Arthur Livingston. New York: Harcourt, Brace, 1935. Vol. III, §§2025–2059 (definition of the elite, governing/non-governing elite, circulation, \"history is a graveyard of aristocracies,\" theory of revolution). Internet Archive full text accessed 2026-06-13. **Tier 1 (primary).** — The foundational text for §§1–5 of this document.\n2. Delican, Mustafa. \"Elite Theories of Pareto, Mosca and Michels.\" *İstanbul Üniversitesi İktisat Fakültesi Mecmuası* (n.d., c. 2000), pp. 323–334. dergipark.org.tr/tr/download/article-file/9789, accessed 2026-06-13. **Tier 5 (academic, low-circulation).** — Confirms primary-text citations (Pareto 1935, p.1421, §2026; pp.1422–23) and the governing/non-governing/political-elite distinction; comparative framing.\n3. Bottomore, Tom. *Elites and Society* (1964; 2nd ed. Routledge 1993), and Aron, Raymond, \"Social Structure and the Ruling Class,\" *British Journal of Sociology* 1.1–1.2 (1950), as quoted in Jackson 2021 [22]. **Tier 2 (scholarly).** — \"In every society there is, and must be, a minority which rules\"; Aron's definition of the elite.\n4. Pareto, Vilfredo — collected direct quotations (\"it is always an oligarchy that governs\"; \"the appearance of power in the people and the reality of power in an elite\"; \"almost all revolutions … the work … of the decayed part of the aristocracy\"; \"its own grave-digger\"). AZ Quotes compilation, azquotes.com/author/20356-Vilfredo_Pareto, accessed 2026-06-13. **Tier 7 for sourcing discipline (quote aggregator)** — used only as a pointer to Pareto's wording; the substantive claims are corroborated by the primary text [1] and the scholarship [10][11][14].\n5. Piano, Natasha. \"Queen Christina's moment: Pareto, Mosca, and the 'realist' critique of democracy\" / \"Disfigurations\" discussion of Piano 2019, as quoted in Jackson 2021 [22]. **Tier 2 (scholarly).** — The masses' passivity as *constructed*, not innate; the anti-plutocratic, \"democratic theorists of elitism\" reading.\n6. \"Pareto's Circulation of Elites: Characteristics and Criticisms,\" yourarticlelibrary.com/sociology/.../43779; and HandWiki/New World Encyclopedia summaries, accessed 2026-06-13. **Tier 5/7 (tertiary explication).** — Lion/fox ↔ Class II/Class I correspondence; \"judicious mixture\" for stability. Corroborated against primary text [1][8][9].\n7. New World Encyclopedia, \"Vilfredo Pareto,\" newworldencyclopedia.org/entry/Vilfredo_Pareto, accessed 2026-06-13. **Tier 5 (tertiary, expert-edited).** — Speculator/rentier ↔ Class I/II; the en-masse replacement of elites; lions rule by force / foxes by guile.\n8. Pareto, *The Mind and Society* [1], Vol. III, §§2178–2179 (the lions→foxes degeneration sequence; humanitarian reluctance to use force; foxes recruited / lions blackballed; \"a humanitarian aristocracy that is closed or stiffly exclusive represents the maximum of insecurity\"; theory of revolution). Internet Archive full text, accessed 2026-06-13. **Tier 1 (primary).** — Load-bearing for §5.\n9. Pareto, *The Mind and Society* [1], Vol. IV (*The General Form of Society*), §§2233–2236 (the S/R \"speculators and rentiers\" classification, from \"Rentiers et spéculateurs,\" 1911; Class I/II predominance; S = change, R = stability; rentiers \"the artisans of their own ruin\"; intellectuals \"working … to encompass the ruin of their own class\"). Internet Archive full text, accessed 2026-06-13. **Tier 1 (primary).** — Load-bearing for §6.\n10. Femia, Joseph V. \"Pareto's Concept of Demagogic Plutocracy.\" *Government and Opposition* 30.3 (1995): 370–392. cambridge.org/core/journals/government-and-opposition/article/.../, accessed 2026-06-13. **Tier 2 (scholarly).** — \"Demagogic plutocracy\" as Pareto's term for the liberal state; the neglected parallel to Marx's critique of the capitalist state.\n11. Lombardinilo, Andrea. \"The limits of reality: Pareto and the myth of democracy.\" *Quaderni di Sociologia* (2021). journals.openedition.org/qds/4700, accessed 2026-06-13. **Tier 2 (scholarly).** — Demagogic plutocracy via manipulation of sentiment; force-vs-consensus oscillation; humanitarianism as elite weakness; democracy as myth/derivation. Quotes Pareto, *Trasformazione della democrazia* (
