to, Vilfredo (1848–1923)\" — the Baconian logico-experimental desiderata; logical/non-logical conduct definitions; the inconsistency between denying value judgments and calling societies \"decadent\"; the unexplained \"why\" of derivations. https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/pareto-vilfredo-1848-1923 (accessed 2026-06-13). [Reference work; treated as Tier 2 expert-authored.]\n12. \"Machiavelli Before Pareto: Foxes, Lions, and the Social Equilibrium as the Result of Non-Logical Actions,\" *Journal of the History of Economic Thought* (Cambridge) — non-logical action and social equilibrium; foxes/lions; ophelimity-vs-utility transition; successive approximation. Via academia.edu copy (https://www.academia.edu/52848327/) (accessed 2026-06-13).\n\n**Tier 5 — Analytical / specialized (lean noted):**\n\n13. Alberto Mingardi (with Giandomenica Becchio, Rosolino Candela et al.), \"Liberty and Cynicism: Was Vilfredo Pareto a Liberal?,\" *Liberty Matters*, Online Library of Liberty (Liberty Fund, Nov. 2018) — Pareto's disillusionment with Italian protectionism; \"The Eclipse of Freedom\" (1903); the free-trade-keeps-losing puzzle as motive for the sociology; demagogic plutocracy. [Liberty Fund: classical-liberal lean.] https://oll.libertyfund.org/publications/liberty-matters/alberto-mingardi-vilfredo-pareto-liberalism-november-2018 (accessed 2026-06-13).\n14. \"Pareto's Dilemma: The Allocation of Liberty between Rationality and Irrationality,\" *Liberty Matters* (Liberty Fund, 2018) — logical (market) vs non-logical (political) action; the irresolvable rationality/irrationality dilemma; \"use rationality not to discover the truth but to manipulate it.\" [Classical-liberal lean.] https://oll.libertyfund.org/publications/liberty-matters/2018-11-06-pareto-s-dilemma-the-allocation-of-liberty-between-rationality-and-irrationality (accessed 2026-06-13).\n15. \"Vilfredo Pareto,\" Econlib (Library of Economics and Liberty) — \"men act nonlogically, 'but they make believe they are acting logically.'\" [Classical-liberal lean; concise biography.] https://www.econlib.org/library/Enc/bios/Pareto.html (accessed 2026-06-13).\n16. Brett Riggle / *City Journal*, review of *Vilfredo Pareto's Contributions to Modern Social Theory* — disillusionment with the \"idealistic project\" of teaching economics; \"irrationality fundamental to human nature\"; \"ideas were epiphenomena of their instincts\"; Friedrich on the unmasking of ideologies; the detached-scholar-devoured-by-political-passions tension. [Manhattan Institute: conservative lean.] https://www.city-journal.org/article/review-of-vilfredo-paretos-contributions-to-modern-social-theory (accessed 2026-06-13).\n\n**Tier 5 — reference/encyclopedic (used for orientation and corroboration, not as sole support for load-bearing claims):**\n\n17. \"Circulation of elites\" and \"The Mind and Society\" — encyclopedic overviews used to corroborate the standard summary of elite circulation and the publication facts of the *Trattato*; substantive claims sourced to the items above, not to these. (accessed 2026-06-13).\n18. SAGE Encyclopedia of Political Behavior, \"Elite Theory (Pareto)\"; *New Statesman*, \"What does 'elites' mean…\" (2017) — corroboration that \"élite\" in the modern sense first appears in *Les Systèmes socialistes* and that the work frames Marxism as secular religion. (accessed 2026-06-13).\n19. Government and Opposition / Springer, \"Pareto's Concept of Demagogic Plutocracy\" — corroboration of the demagogic-plutocracy concept, speculators=foxes / rentiers=lions, parliament-as-mask. https://www.cambridge.org/core/journals/government-and-opposition/article/abs/paretos-concept-of-demagogic-plutocracy/ (accessed 2026-06-13)."}, {"order": 4, "file": "04_The_Treatise_Residues_And_Derivations.md", "title": "The Treatise: Residues and Derivations", "summary": "", "body": "# The Treatise: Residues and Derivations\n\n## Bottom Line\n\nPareto's *Trattato di sociologia generale* (1916), Englished by Arthur Livingston's team as *The Mind and Society* (1935, four volumes, ~2,033 pages, 2,612 numbered sections), is the conceptual engine of everything else in his sociology — the circulation of elites, the lions and the foxes, the critique of democracy, the whole machinery that Burnham would later borrow. The argument is simpler than its bulk suggests, and more often caricatured than understood. Pareto starts from one empirical observation: most human conduct is **non-logical** — not *illogical*, but conduct in which the link between act and end is not, objectively and subjectively, a logical-experimental one (§150). Beneath this conduct lie **sentiments**, psychic states we cannot observe directly. Their relatively constant, instinct-like *manifestations* in behavior and speech he calls **residues**, sorted into six classes — of which only two carry the weight of his social theory: **Class I, the \"instinct for combinations\"** (innovation, recombination, scheming — the psychology of the foxes; §§889–990) and **Class II, the \"persistence of aggregates\"** (conservatism, loyalty, faith, family, force — the psychology of the lions; §§991–1088). The variable, after-the-fact verbal justifications people manufacture to make non-logical conduct look logical he calls **derivations**, sorted into four classes (assertion, authority, accord with sentiment, verbal proof; §1419). His master claim is deflationary: most ideology, theology, law, and political doctrine is *derivation* — the froth, not the wave. Society is a system in mutual dependence among four elements — **residues (a), interests (b), derivations (c), and social heterogeneity/circulation (d)** (§§2205–2206) — tending toward a moving **equilibrium**. The method is \"logico-experimental\": claims count only as they reduce to observable fact (§§6, 55, 69). The system's notorious vulnerabilities are real and were noticed early: residues are a near-untestable *ad hoc* taxonomy, the scheme verges on the circular and the unfalsifiable, and Pareto's *own* theory looks suspiciously like a derivation by his own definition. Hold those alongside what is genuinely powerful in the analysis — the insistence that ideology is mostly rationalization, and that the relatively constant residues, not the endlessly mutable derivations, do the social work.\n\n---\n\n## 1. The book itself: scale, structure, translation\n\nBefore the ideas, the object. The *Trattato di sociologia generale* was published in Florence in two volumes in 1916 (a second edition, with a third volume of additions, followed in 1923). The French translation, *Traité de sociologie générale*, appeared in 1917–19. The English translation — *The Mind and Society: A Treatise on General Sociology* — was published by Harcourt, Brace and Company in New York in 1935 in four volumes, edited by Arthur Livingston with translation by Andrew Bongiorno and James Harvey Rogers; the *American Political Science Review* notice records the four volumes at 2,033 pages [1]. The four volumes carry distinct titles that map the architecture of the argument: **Vol. I, *Non-Logical Conduct***; **Vol. II, *Analysis of Sentiment (Theory of Residues)***; **Vol. III, *Sentiment in Thinking (Theory of Derivations)***; and **Vol. IV, *The General Form of Society*** [2,3,4,5].\n\nTwo structural features must be flagged because they shape how the book is read and mis-read.\n\nFirst, **the length is not incidental — it is method**. Pareto piles up thousands of historical, literary, theological, and ethnographic examples (Hesiod, Macrobius, Roman law, Greek religion, the church fathers, medieval magic, contemporary French politics) because his \"logico-experimental\" program demands that general propositions be syntheses of *facts*. The accumulation is meant to function as induction. Critics found it self-defeating from the start: Talcott Parsons, who took Pareto seriously enough to give him roughly a quarter of *The Structure of Social Action* (1937), still regarded the work as needlessly complex and its taxonomy alienating [6,15]. The bulk is a feature in Pareto's eyes and a bug in almost everyone else's.\n\nSecond, **the numbered-paragraph apparatus**. Pareto used a continuous run of numbered sections — running 1 through 2,612 across the whole work — as his sole citation system, cross-referencing his own argument by § number rather than by page (the highest section, §2612, is verifiable directly in the closing paragraph of Vol. IV) [5]. Livingston explicitly retained \"a peculiar system of numbering\" that \"Pareto used, with one variation or another, in many of his writings\" [2]. This is why serious scholarship on Pareto cites him by § number, and why this document does the same: it is the only stable address into a text whose pagination differs across editions and languages.\n\n**On Livingston's translation choices.** The English edition is not transparent. Livingston interpolates substantial bracketed editorial notes (signed \"—A. L.\") that are themselves valuable scholarship, and he made lexical decisions that have colored a century of Anglophone reception. The most consequential is his rendering of *persistenza degli aggregati*. In a long note at §991 Livingston tells the reader he settled on \"**group-persistences**\" / \"residues of group-persistence\" only \"after careful and painful experimentation with all possible other translations,\" and explains why he rejected \"persisting aggregates\" (it would imply the aggregate, not its *persistence in time*, does the work) and \"persistence of combinations\" (it would wrongly fuse Class II with Class I) [3]. The same agony, he notes, attended \"non-logical actions.\" So the reader of *The Mind and Society* reads Pareto *through* Livingston's interpretive grid at exactly the points where the theory is most load-bearing. Where this document quotes the English, it is quoting Livingston's Pareto; the underlying Italian terms are flagged where the distinction matters.\n\n> **Caveat on the title.** \"The Mind and Society\" is Livingston's coinage, not a translation of *Trattato di sociologia generale* (\"Treatise on General Sociology\"). It is an elegant gloss that slightly over-promises a philosophy-of-mind register the Italian title does not have. Throughout, \"the Treatise\" and \"the *Trattato*\" refer to the same work.\n\n---\n\n## 2. Logical and non-logical action: the four-genera schema\n\nThe whole edifice rests on a distinction Pareto draws in Volume I and refuses to let go: between **logical** and **non-logical** action. It is the single most caricatured idea in the book, so it is worth getting exactly right.\n\nPareto's definition (§150): \"**There are actions that use means appropriate to ends and which logically link means with ends. There are other actions in which those traits are missing.**\" The crucial move is that he evaluates the link **twice over** — under its *objective* aspect (do means in fact connect to the end, judged by someone with wider knowledge?) and under its *subjective* aspect (does the actor *believe* means connect to the end?). His example is the Greek mariners who sacrificed to Poseidon and rowed with oars: \"In the eyes of the Greek mariners sacrifices to Poseidon and rowing with oars were equally logical means of navigation\" (§150). Subjectively, both acts are logical to the sailor. Objectively, rowing works and sacrificing does not.\n\nPareto then fixes his terms with characteristic fussiness: \"**Suppose we apply the term logical actions to actions that logically conjoin means to ends not only from the standpoint of the subject performing them, but from the standpoint of other persons who have a more extensive knowledge — in other words, to actions that are logical both subjectively and objectively** ... Other actions we shall call **non-logical** (by no means the same as 'illogical')\" (§150). He warns, in a footnote, that he would *prefer* meaningless letters of the alphabet for his categories and resorts to ordinary words only for readability; \"the reader must bear in mind that such words ... in no way serve to describe the things they stand for\" (§150 n.1). This nominalist disclaimer recurs throughout the book, and a fair reading depends on it: when Pareto says \"residue\" or \"derivation,\" he is asking you to forget the etymology and attend only to the defined thing.\n\n**The synoptic table (§151)** is the four-genera classification — the part casual summaries either skip or garble:\n\n| Class / Genus | Logical objectively? | Logical subjectively? |\n| --- | --- | --- |\n| **CLASS I — Logical actions** (objective end = subjective purpose) | Yes | Yes |\n| **CLASS II — Non-logical actions** (objective end ≠ subjective purpose) | | |\n| — Genus 1 | No | No |\n| — Genus 2 | No | Yes |\n| — Genus 3 | Yes | No |\n| — Genus 4 | Yes | Yes |\n\nwith species 3a/4a (the objective end *would* be accepted by the subject if he knew it) and 3β/4β (the objective end *would* be rejected if he knew it) (§151).\n\nSeveral points that the caricatures lose:\n\n- **Genus 4 is real and important.** It covers conduct that is objectively *and* subjectively logical — the means do connect to the end and the actor knows it — yet still counts as *non*-logical, because in the strict sense the objective end differs from the subjective purpose, or the conduct follows a rule whose ultimate ground is sentiment. Pareto's point is not that non-logical conduct is stupid or ineffective; non-logical actions can be \"admirably adapted to the realization of logical purposes.\" Here is the single most common misreading — that \"non-logical\" means \"irrational\" or \"dumb.\" It does not.\n- **The subjective varnish.** Pareto observes that \"Human beings have a very conspicuous tendency to paint a varnish of logic over their conduct. Nearly all human actions therefore work their way into genera 2 and 4\" (§154). This is the germ of the theory of derivations: the *varnish* of logic over non-logical conduct *is* what derivations supply.\n- **Logical action is not rare.** \"Logical actions are very numerous among civilized peoples. Actions connected with the arts and sciences belong to that class ... The actions dealt with in political economy also belong in very great part in the class of logical actions\" (§152). Economics, his old field, is precisely the science of the logical residue of conduct. Sociology is the science of everything economics brackets out — which is most of social life: \"non-logical actions play an important part in society\" (§153).\n\nSo Pareto is *not* saying humans are irrational. He is saying that the domain economics models (logical, means-end optimizing action) is a thin slice, and that a general science of society must take seriously the vast non-logical remainder — and must do so without the moralizing condescension of calling it \"irrational.\"\n\n---\n\n## 3. Sentiments: the unobservable substrate\n\nUnderneath non-logical conduct lie **sentiments** (*sentimenti*) — psychic states, dispositions, instincts. They are the real motive forces. But Pareto insists they are **not directly observable**: we infer them only from their manifestations. He is careful about this point of method; commentary often blurs it. As one recent scholarly treatment puts it, \"one could only infer the existence of sentiments from the observable behaviors he called the 'residues' of sentiments\" [7].\n\nThe relationship is layered:\n\n- **Sentiments** — the underlying, inaccessible psychic states.\n- **Residues** — the relatively *constant* manifestations of those sentiments, which the analyst can isolate by holding a body of conduct/reasoning up against comparison and stripping away the variable parts. Livingston's gloss (§868 n.1): a residue is \"what is left (the constant element) when the variable elements have been eliminated from an action or a reasoning by a comparative analysis\"; it \"is always reducible to the synonymous phrase: 'principle underlying a non-logical action or reasoning'\" [3].\n- **Derivations** — the *variable* manifestations: the verbal/ideological superstructure.\n\nPareto is emphatic that residues are not the sentiments themselves but their traces. This matters for the later critique: because the sentiments are unobservable and the residues are inferred from precisely the conduct they are supposed to explain, the door to circularity is open from the start (see §10).\n\nOne further refinement matters: residues are distinct from the actual *instincts* and from **interests**. Pareto reserves a separate analytic place for interests — the rational pursuit of advantage, wealth, power — and treats them as a distinct element in the social equilibrium (the element *b*; see §8). Residues are not \"drives\" in a crude biological sense; Pareto stays studiously agnostic about their ultimate nature, and critics fault exactly that agnosticism — he \"has not tried to say whether these drives are physical or natural facts or results of socio-historical process\" [8].\n\n---\n\n## 4. Residues: the six classes\n\nHaving argued that non-logical conduct dominates and that sentiments lie beneath it, Pareto devotes the whole of Volume II to extracting and classifying the residues. He divides them into **six classes**, then into 26-odd genera and a further fifty-some species and sub-species — a taxonomy of baroque elaboration (the figure of \"six classes, subdivided into genera and species\" is canonical) [9]. The full synoptic table appears at §888. The six classes are:\n\n1. **Class I — Instinct for Combinations** (*Istinto delle combinazioni*) (§§889–990)\n2. **Class II — Group-Persistences / Persistence of Aggregates** (*Persistenza degli aggregati*) (§§991–1088)\n3. **Class III — Need of Expressing Sentiments by External Acts** (activity, self-expression) (§§1089–1112)\n4. **Class IV — Residues Connected with Sociality** (§§1113–1206)\n5. **Class V — Integrity of the Individual and His Appurtenances** (§§1207–1323)\n6. **Class VI — The Sex Residue** (§§1324–1396)\n\nPareto himself, and every serious commentator after him, treats **Classes I and II as the load-bearing ones** — these are the residues that drive his theory of social and political change. Classes III–VI are real and analyzed at length, but they mostly serve as background; the cycle of history turns on the relative strength of Class I versus Class II. As one survey of the literature notes, \"only two of these — the instinct for combinations (class I residues) and the persistence of aggregates (class II residues) — are critical to an understanding of his approach\" [9].\n\n### 4.1 Class I — the Instinct for Combinations (§§889–990)\n\nThis is the psychological basis of the **foxes**. Pareto's definition (§889): \"**This class embraces the residues corresponding to the instinct for combinations, which is intensely powerful in the human species and has probably been, as it still remains, one of the important factors in civilization. Figuring as a residue in vast numbers of phenomena is an inclination to combine certain things with certain other things.**\"\n\nThe combinatory impulse runs the full spectrum, from the rigorous to the absurd. Pareto is explicit that it underlies both science and superstition: \"The scientist in his laboratory makes combinations according to certain norms, certain purposes, certain hypotheses, for the most part rational ... His activity is primarily logical. The ignorant person makes combinations in view of analogies that are mostly fantastic, absurd, childish ... In any event they are in large part non-logical acts. There is an instinct that prompts to combinations in general, for reasons which are fleeting, momentary, undetectable\" (§889). One residue produces the chemist's experiment, the financier's deal, the politician's coalition, the gambler's system, and the magician's spell.\n\nThe subclasses (§888) give a sense of the range:\n- **I-α**: generic combinations;\n- **I-β**: combinations of similars or opposites (including I-β2 \"unusual things and exceptional occurrences,\" I-β3 \"objects and occurrences inspiring awe or terror,\" I-β4 the lucky/unlucky association, I-β5 \"assimilation\" — consuming substances to absorb their qualities);\n- **I-γ**: the mysterious workings of things and the mysterious linking of names and things;\n- **I-δ**: the need for *combining* residues;\n- **I-ε**: the **need for logical developments** (§§972–975) — the impulse to give things a logical or pseudo-logical form;\n- **I-ζ**: faith in the efficacy of combinations.\n\nTwo subclasses matter disproportionately. **I-ε, the \"need for logical developments,\"** is the residue that *produces derivations* — the human hunger to dress conduct in logical clothing (§§1397–1398; see §6). And the cluster as a whole is what makes a population *innovative, restless, speculative, scheming, manipulative*: the residues of the people Pareto will call **speculators** in economics and **foxes** in politics. An elite rich in Class I residues is dynamic, inventive, financially clever, and unscrupulous — good at devising new combinations (new financial instruments, new political maneuvers, new ideologies) but weak in conviction, prone to short-termism, and loath to use force.\n\n### 4.2 Class II — the Persistence of Aggregates (§§991–1088)\n\nThis is the psychological basis of the **lions**. The term repays care, because Livingston's \"group-persistences\" can mislead. Pareto's idea (§991, with Livingston's long gloss): certain combinations of sensations consolidate into an **aggregate** — a unit the mind treats as a persisting thing with a personality of its own, often marked by a *name* (Livingston's examples: \"Uncle Sam,\" \"the Devil,\" \"Russia,\" \"goodness,\" \"honour,\" \"Santa Claus,\" \"the individual,\" \"Vilfredo Pareto\" — and, by studied omission, \"God\") [3]. The Class II residue is the **force that resists the dissolution of these aggregates and keeps them persisting in time**.\n\nPareto's mechanical analogy (§992): \"an instinct very often comes into play that tends with varying energy to prevent the things so combined from being disjoined, and which, if disintegration cannot be avoided, strives to dissemble it by preserving the outer physiognomy of the aggregate. **This instinct may be compared roughly to mechanical inertia: it tends to resist the movement imparted by other instincts. To that fact the tremendous social importance of Class II residues is to be ascribed.**\" Where Class I is the engine of change, **Class II is the principle of inertia, continuity, and conservation**.\n\nThe subclasses (§888) name the durable bonds of social life:\n- **II-α**: persistence of relations between a person and other persons and places — family and kinship (II-α1), relations with places/homeland (II-α2), and relations of **social class** (II-α3);\n- **II-β**: persistence of relations between the living and the dead (ancestor reverence);\n- **II-γ**: persistence of relations between the dead and their possessions;\n- **II-δ**: persistence of abstractions;\n- **II-ε**: persistence of uniformities;\n- **II-η**: personifications;\n- **II-θ**: the need of new abstractions.\n\nThis is the residue cluster behind **family, religion, patriotism, tradition, loyalty, faith, social hierarchy, and the readiness to use force to defend the group**. An elite rich in Class II residues is solid, courageous, faithful, willing to fight and die, attached to ancestral institutions — but rigid, slow to innovate, and economically cautious. In economics these are the **rentiers**; in politics, the **lions**.\n\n> **The Class I / Class II antithesis is the hinge of the entire sociology.** Pareto presents history as governed by the changing ratio of these two residue clusters within the governing class. Too much Class I and the elite becomes a clique of clever, faithless manipulators who cannot defend themselves; too much Class II and the elite becomes a rigid, brave, but stagnant caste. The healthy society — and the durable elite — is a *judicious mixture* of the two, and the engine of historical change is the **circulation of elites** by which the proportions shift and correct. That mechanism is the subject of the sibling document (05); here the point is only that the lions/foxes machinery is built *entirely* out of the Class I / Class II distinction in the residues. Livingston himself, in a note at §991, flags an unresolved ambiguity in Pareto: whether Class II should be understood as the force that makes the *combinations of Class I* habitual and permanent — Pareto \"seems to hesitate\" and \"should have made it far more explicit\" [3]. The relationship between the two master residues is, even in Pareto's own hands, not perfectly nailed down.\n\n### 4.3 Classes III–VI (briefly)\n\n- **Class III — Need of Expressing Sentiments by External Acts** (§§1089–1112): the impulse to *do something* — religious ecstasies, rituals, demonstrations. The residue behind why people must act out, not merely feel.\n- **Class IV — Residues Connected with Sociality** (§§1113–1206): the cluster of social-belonging sentiments — the need for uniformity and conformity (IV-β, including \"neophobia,\" the fear of the new), pity and cruelty (IV-γ), self-sacrifice (IV-δ), sentiments of hierarchy and rank (IV-ε), and asceticism (IV-ζ). Pareto's long, scornful treatment of **humanitarian sentiment** and asceticism lives here, and it is the residue-basis of his later polemic that humanitarian derivations function as elite self-disarmament.\n- **Class V — Integrity of the Individual and His Appurtenances** (§§1207–1323): the defense of self, property, and standing — including \"sentiments of resistance to alterations in the social equilibrium\" (V-α), sentiments of equality in inferiors (V-β), and the restoration of integrity by vengeance (V-δ).\n- **Class VI — The Sex Residue** (§§1324–1396): the influence of sexual sentiment, which Pareto treats less as a driver of social structure than as a pervasive distorter of moralizing and reasoning (he spends much of the class showing how sexual sentiment contaminates ostensibly high-minded religious and ethical discourse).\n\nThese four classes are not throwaways — Pareto analyzes each at length — but the architecture of his *social dynamics* runs almost entirely through Classes I and II.\n\n---\n\n## 5. Derivations: the four classes\n\nIf residues are the constant element, **derivations** are the variable element: the **reasonings, doctrines, ideologies, theologies, and verbal justifications** by which people make their non-logical, sentiment-driven conduct *appear* logical. Volume III is devoted to them.\n\nPareto's definition (§868, with Livingston's note): residues are the *a*, derivations the *b*, derivatives the *c*; \"nothing, absolutely nothing, is to be inferred from the proper meanings of those words or their etymologies\" (§868) [3]. Etymologically, Livingston notes, a derivation is \"what is derived\" — but the defined sense is: the non-logico-experimental theory that grows up around a residue.\n\nThe pivotal claim: **derivations do not cause conduct; they decorate it**. Pareto (§1397): \"**Human beings are persuaded in the main by sentiments (residues), and we may therefore foresee, as for that matter experience shows, that derivations derive the force they have, not, or at least not exclusively, from logico-experimental considerations, but from sentiments.**\" And the structure of a derivation (§1398): \"the principal nucleus in a derivative (a non-logico-experimental theory) is a residue, or a number of residues, and around it other secondary residues cluster.\" The engine that produces derivations in the first place is **residue I-ε**, the \"need for logical developments\" — the hunger to give conduct a logical or pseudo-logical form (§1398). In short: people *do* X because of a sentiment; then, prompted by another sentiment (the need for logical developments), they *manufacture a reason* for X. The reason is the derivation. **Most ideology, theology, law, and political doctrine is, on this view, derivation** — post-hoc rationalization of conduct whose real springs lie in the residues.\n\nThis is why a derivation can be experimentally false and socially potent at once. As Femia summarizes Pareto, derivations \"may be technically false from the standpoint of 'logico-experimental' truth,\" yet their capacity \"to activate or intensify dormant or weak residues can compel behavior that benefits society\" [10]. The truth-value of an ideology is nearly independent of its social force.\n\n**The four classes of derivations (§1419):**\n\n1. **Class I — Assertion** (§§1420–1433). Simple statements presented as fact, with no experimental backing — dogmatic, axiomatic, or aphoristic affirmations. Subclasses: I-α assertions of fact (real or imaginary); I-β assertions of sentiment; I-γ mixtures of fact and sentiment. *Example*: \"Honesty is the best policy\" — asserted, not demonstrated. [3,11]\n\n2. **Class II — Authority** (§§1434–1463). A claim is to be accepted because some authority stands behind it. Subclasses: II-α the authority of individuals (a sage, an expert, a great name); II-β the authority of tradition, usage, and custom; II-γ the authority of divine beings or personifications. *The appeal is to who said it, not to whether it is so.* [3,11]\n\n3. **Class III — Accords with Sentiments or Principles** (§§1464–1542). The justification appeals to *agreement with* a sentiment, an interest, a \"universal\" judgment, the will of the people, the general interest, or a juridical/metaphysical/supernatural principle. This is the largest and most elastic class — the home of \"everybody agrees,\" \"natural law,\" \"the public good,\" and metaphysical entities pressed into argumentative service. [3,11]\n\n4. **Class IV — Verbal Proofs** (§§1543–1686). Argument by *language* rather than fact: indefinite or equivocal terms, metaphors, analogies, allegories, and vague designations that smuggle a conclusion through the slipperiness of words. *The form of words does the persuading; no experimental content is added.* [3,11]\n\nTwo things follow. First, **the four-class derivation taxonomy is genuinely a theory of rhetoric and ideology** — a catalogue of the standard moves by which non-rational appeals masquerade as proof. It anticipates, roughly, later work on propaganda, motivated reasoning, and the rhetoric of legitimation. Second, the asymmetry between residues and derivations is total: residues are *few and constant*; derivations are *many and variable*. One residue can be dressed in countless successive derivations as fashions in justification change, which is why ideologies come and go while the underlying sentiments persist. Pareto's closing example (§2612) makes the point: the same Byzantine institutions are condemned in an age that loves freedom and praised in an age that loves \"planning\" — \"undulations in derivations follow undulations in social facts\" [5].\n\n---\n\n## 6. How residues, derivations, interests, and heterogeneity hang together\n\nThe genius — and the slipperiness — of Pareto's system is that he refuses to make any one element the master cause. Volume IV (\"The General Form of Society\") assembles the parts into a model of **social equilibrium**.\n\n**The elements (§2060).** \"The form of a society is determined by all the elements acting upon it and it, in turn, reacts upon them.\" Pareto lists external conditions (soil, climate, the influence of other societies, the prior state of this one) and then the **internal elements**: \"race, residues (or better, the sentiments manifested by them), proclivities, interests, aptitudes for thought and observation, state of knowledge ... Derivations also are to be counted among these\" (§2060). Crucially: \"These elements are not independent: for the most part, they are **interdependent**\" (§2061). The relation is one of **reciprocal determination**, not linear causation — Pareto's deliberate analogy is the *general economic equilibrium* of his old teacher Walras, transposed from prices to the whole society (§§2067 ff.).\n\n**The four-letter scheme (§§2205–2206).** Pareto condenses the model to four interacting elements, named by letters precisely to strip them of connotation: \"Residues, **a**; interests, **b**; derivations, **c**; social heterogeneity and circulation, **d**\" (§2205). He then states the interdependence as a matrix of mutual action (§2206): \"(I) that **a** acts upon **b, c, d**; (II) that **b** acts upon **a, c, d**; (III) that **c** acts upon **a, b, d**; (IV) that **d** acts upon **a, b, c**.\"\n\nHis ranking of these combinations is one of the most revealing — and most quoted — passages in the book (§2206):\n\n- **Combination I (residues acting on the rest)** \"yields a very considerable portion of the social phenomenon\"; it is what those who made *ethics* the foundation of society dimly perceived, and it is what gives history its **continuity**, \"since the category *a* varies slightly or slowly.\"\n- **Combination II (interests acting on the rest)** \"also yields a very considerable portion\"; this is the truth the **economic determinists** (Marxists) glimpsed — \"but they fell into the error of substituting the part for the whole and disregarding the other combinations.\"\n- **Combination III (derivations acting on the rest)** \"is the **least important of all**. Failure to perceive that fact has rendered the lucubrations of humanitarians, 'intellectuals,' and worshippers of the goddess Reason, erroneous, inconclusive, fatuous\" (§2206).\n- **Combination IV (heterogeneity/circulation acting on the rest)** \"is of no mean importance,\" noticed by Plato and Aristotle; ignoring it \"fundamentally vitiates so-called democratic theories\" (§2206).\n\nThis passage is the analytic core of the whole project, and the answer to anyone who reduces Pareto to \"ideas don't matter.\" His real claim is sharper and more interesting: **residues and interests do most of the social work; derivations (ideology) do the least; and the structure and circulation of elites does a great deal**. The cardinal error of both camps — the idealists who overrate ideas, the economic determinists who overrate interests — is mistaking a part for the whole.\n\n**The circular causation (§2207).** Pareto insists the actions and reactions \"follow one on another indefinitely and, as it were, **in a circle**\": a variation in *a* changes *b, c, d* (\"immediate effects\"), which feed back to change *a* again (\"mediate effects\"), and so on without end (§2207). The concrete equilibrium of any real society is the *resultant of all these effects*. Pure economics, he notes, isolates only element *b* and yields a \"theoretical equilibrium\" that is necessarily *different* from the concrete social equilibrium that would require all four elements together (§2207). This is Pareto explicitly placing his old discipline, economics, inside a larger sociological frame.\n\n**Social heterogeneity (d).** The fourth element connects the residue/derivation machinery to the theory of elites proper: society is *not* homogeneous but stratified, with an elite and a non-elite, and individuals *circulate* between the strata. The concentration of Class I versus Class II residues differs across those strata; the speculators (Class I) and rentiers (Class II) of economics, and the foxes (Class I) and lions (Class II) of politics, are the social embodiments of the residue distribution (§§2233–2235). Pareto's own term-fixing (§2233): \"**suppose we use the term 'speculators' for members of category S and the French term rentiers for members of category R** ... In the speculator group Class I residues predominate, in the rentier group, Class II residues\" [5]. Element *d* is the bridge from the psychology of Volumes II–III to the political dynamics of Volume IV — and to the circulation-of-elites theory that is the corpus's center of gravity (developed in document 05).\n\n---\n\n## 7. The logico-experimental method\n\nPareto's name for his method — **\"logico-experimental\"** (*logico-sperimentale*) — appears on nearly every page, and the system cannot be assessed without it. The program is austerely empiricist, almost positivist, modeled by design on the natural sciences.\n\nPareto's opening declaration (§6): \"**we here venture to expound a sociology that is purely experimental, after the fashion of chemistry, physics, and other such sciences.**\" [4] The governing rule is the primacy of fact over principle (§55): \"principles are nothing but abstract propositions summarizing the traits common to many differing facts ... **The principles depend on the facts, not the facts on the principles.**\" And (§69): general principles are \"nothing but hypotheses designed to formulate syntheses of facts ... Theories ... are altogether subordinate to facts\" [4]. As one standard characterization puts it, Pareto's conception was \"largely Baconian,\" requiring that \"all concepts have strictly controlled empirical reference, all theories be subject to rigorous experimental or observational control, and all inferences follow with strict logic from the data\" [12].\n\nThree consequences shape the whole book:\n\n1. **A bracketing of truth and value.** Logico-experimental science can say whether a proposition accords with the facts; it *cannot* pronounce on the good, the beautiful, or the just, which lie outside experience. This is why Pareto can analyze religion, ethics, and political ideology with clinical detachment as *derivations* — he claims not to be judging whether they are true or noble, only describing their form and function. (Whether he sustains this neutrality is contestable; his tone is famously sardonic.)\n\n2. **The radical demotion of ideology.** Because most doctrine fails the logico-experimental test (it is assertion, authority, sentiment-accord, or verbal proof, not fact), most doctrine is *derivation*. The method is what licenses the deflationary reading of ideology that is the book's signature.\n\n3. **The induction-by-accumulation.** The thousands of examples are the \"experiment\": Pareto means to *show*, by exhaustive comparative survey, that the same residues recur under endlessly varying derivations across cultures and centuries. The constancy of the residue is, in his eyes, an empirical finding, not a postulate.\n\nThe aspiration is genuinely scientific; the achievement is exactly where the critics dig in. The method promises that residues are *read off* the facts by stripping away the variable. The objection: there is no independent, replicable procedure for doing the stripping — and Pareto's own taxonomy is, by his own standard, suspiciously under-controlled.\n\n---\n\n## 8. The system turned on itself: the internal tensions\n\nA fair close reading must be as hard on the Treatise as Pareto is on everyone else. The objections below are not external moralizing; several were raised by his most sympathetic readers, and the sharpest of them are generated *by Pareto's own premises*.\n\n### 8.1 The self-referential problem: is Pareto's theory a derivation?\n\nThis is the deepest tension, and it is internal to the system. Pareto says that human beings have a *residue* (I-ε, the \"need for logical developments\") that drives them to manufacture pseudo-logical theories — derivations — around their sentiments (§§1397–1398). But the *Trattato* is itself a vast, elaborate logical development. By Pareto's own taxonomy, what guarantees that his sociology is a piece of genuine logico-experimental science rather than just an unusually self-aware **derivation** — a verbal structure (largely Class IV verbal-proof and Class I assertion) erected around Pareto's own sentiments (his evident contempt for democracy, humanitarianism, and the \"intellectuals\")?\n\nPareto's only defense is the methodological one: his propositions, unlike derivations, *reduce to observable fact* and claim no authority beyond it (§§6, 55, 69). But that merely relocates the problem onto the method. If there is no fact-independent way to verify that a residue is \"really there\" (see 8.2), then the claim that the *Trattato* is fact-bound rather than sentiment-bound cannot itself be cashed out experimentally. The system has no clean way to exempt itself from its own corrosive analysis. This is not a gotcha invented by hostile readers; it falls straight out of the architecture, and it is why even admirers treat the logico-experimental claim as Pareto's least convincing pretension. (Pareto would presumably answer that the asymmetry of residues and derivations is *itself* an empirical finding from the comparative survey, not a sentiment — but that defense leans on exactly the contested taxonomy.)\n\n### 8.2 Near-unfalsifiability and the *ad hoc* taxonomy\n\nThe six classes, with their genera and species, were charged from the beginning with being a vague, un-operationalized catalogue. Emory Bogardus's complaint that \"the classification of residues is vague\" is representative of the early reception [8], and Parsons — among the most invested of Pareto's readers — judged the taxonomy needlessly complex and obscuring [6,15]. The substantive worries are two:\n\n- **No measurement.** Residues are inferred from conduct and speech, but Pareto offers no independent metric for the *strength* of a residue in a person or population. We call a society \"rich in Class I residues\" because it innovates and schemes — then explain the innovating and scheming by the Class I residues. There is no thermometer for the sentiments; the residue is read off precisely the behavior it is meant to explain.\n- **Elasticity.** Because the taxonomy is so finely subdivided, and the same conduct can often be assigned to more than one residue, a determined analyst can fit almost any social fact into the scheme after the event. A theory that accommodates any outcome predicts none. This is the **near-unfalsifiability** charge, the standard one in the textbook reception [8].\n\nA defender can answer that residues are *ideal-typical analytic categories*, not measurable variables, and that Pareto's claim is comparative-historical rather than predictive. That is a reasonable retreat — but it concedes that the \"logico-experimental,\" natural-science self-presentation oversells what the apparatus can actually do.\n\n### 8.3 The circularity charge\n\nClosely related: the explanation can read as a loop. *Why* did the elite fall? Because it became too rich in Class I residues (clever, faithless, unwilling to use force). *How do we know* it was rich in Class I residues? Because it behaved cleverly and faithlessly and would not use force. The explanans is identified through the explanandum. Pareto's reply — that the constancy of residues across wildly varying derivations is an independent empirical regularity — has force, but it does not fully dissolve the circle at the level of the individual case.\n\n### 8.4 The thinness of the psychology\n\nA recurring verdict in the secondary literature is that \"the doctrine of residues and derivations lacks psychological depth\" — that Pareto stops at a descriptive taxonomy of manifestations and never grounds it in a worked-out theory of mind or a developmental/historical account of where residues come from [8]. He is deliberately agnostic about whether residues are biological instinct or social product; that agnosticism is methodologically honest but leaves the foundation hanging.\n\n### 8.5 Where the commentary (including Burnham) simplifies\n\nThe corpus must mark where downstream readers flatten the machinery:\n\n- **The \"non-logical = irrational\" flattening.** Popular and even some scholarly summaries equate non-logical action with stupidity or irrationality. Pareto's Genus 4 explicitly covers conduct that is objectively *and* subjectively effective and *still* non-logical; \"non-logical\" is a technical classification about the means-end *link*, not a slur on the actor (§§150–154).\n- **Collapsing residues into derivations, or sentiments into residues.** Careless accounts treat \"residue\" and \"sentiment\" as synonyms; Pareto is careful that residues are the *manifestations* of unobservable sentiments, not the sentiments themselves (§868, §870). And residues are *not* derivations — that distinction (constant vs. variable, drive vs. justification) is the whole point.\n- **Burnham's instrumental reading.** James Burnham, in *The Machiavellians* (1943), presents Pareto's apparatus crisply but selectively: he foregrounds the **residues/derivations** distinction as a debunking tool (ideology = \"formula\"/rationalization), the **circulation of elites**, and the gap between political \"formula\" and political reality, and he marshals all of it toward a single thesis — that a science of politics must look past professed ideals (derivations) to the real distribution of power. What Burnham *flattens*: the fine taxonomy (he has little use for six classes, genera, and species — he wants Class I vs. Class II, foxes vs. lions); the equilibrium model of mutual dependence (the *a/b/c/d* matrix barely survives); and the economics entirely. Burnham also reads Pareto's value-neutral logico-experimental pose as licensing a hard-headed \"defense of freedom\" through institutional checks on elites — a normative use Pareto himself, qua logico-experimental scientist, would have classified as a derivation. The corpus's Burnham document (07) develops this; the point here is that the *Trattato*'s machinery is considerably more qualified, more interdependent, and more self-undermining than the streamlined version that entered Anglophone political theory through Burnham.\n\n### 8.6 The standing of the system, fairly stated\n\nNone of these objections is fatal to the *insight*, and it would be a mistake to let the methodological problems bury what is durable. Two contributions survive the critique robustly. First, the **deflationary theory of ideology** — that most political doctrine, theology, and ethics functions as after-the-fact justification of sentiment-driven conduct rather than as its cause — which prefigures a century of work on rationalization, motivated reasoning, and the sociology of legitimation. Second, the **Class I / Class II dynamic** as a model of the perennial tension between innovation and conservation, cunning and force, in any governing group — the framework that, stripped of its taxonomic excess, still does real explanatory work in the elite-theory tradition and its contemporary revival. Aron's measured verdict captures the balance: Pareto's theory of derivations is best taken as \"a contribution to the psychology of interpersonal and inter-group relations, especially in the field of politics\" [13] — valuable as a sociology of how power justifies itself, overreaching as a value-free natural science of society.\n\n---\n\n## 9. The Compendio and the abridged routes in\n\nBecause the *Trattato* is nearly unreadable at length, the canonical shorter entries matter. Pareto authorized a **Compendio di sociologia generale** (1920), an abridgment Giulio Farina prepared under his supervision, which condenses the system and is the standard \"short Pareto\" in Italian (Englished much later as *Compendium of General Sociology*, 1980). For Anglophone readers the most useful curated selection is **S. E. Finer's *Vilfredo Pareto: Sociological Writings*** (1966), whose long introduction is among the best concise reconstructions of the residues/derivations apparatus and whose selections render the key sociological passages afresh. Henderson's *Pareto's General Sociology: A Physiologist's Interpretation* (1935) is the classic exposition of the **equilibrium** concept by the Harvard physiologist who ran the famous Pareto seminar that shaped Parsons and others; it reads the social system through physiological homeostasis and supplies much of the \"equilibrium\" emphasis in American Pareto reception. These are the on-ramps — and, inevitably, *interpretations*, each foregrounding a different face of the system (Finer the political, Henderson the systemic-equilibrium). The Treatise itself, cited by § number, remains the court of final appeal.\n\n---\n\n## Open Questions\n\n1. **Is there any defensible operationalization of residues?** Did anyone in the empirical-sociology tradition (Lasswell on propaganda, content analysis, later quantitative political psychology) succeed in turning Class I / Class II into measurable variables, or does the apparatus remain irreducibly interpretive? (Turchin's \"elite overproduction\" is arguably a quantitative cousin — worth testing the lineage.)\n2. **How tight is the Class I–Class II relationship in Pareto's own text?** Livingston flags Pareto's hesitation over whether Class II is the consolidation of Class I's combinations or an independent residue (§991 n.). Resolving this changes how mechanical vs. dialectical the lions/foxes cycle is.\n3. **Does the self-referential problem have a principled solution within logico-experimental terms,** or must the *Trattato*'s scientific status be defended on grounds Pareto himself would not accept?\n4. **How much does Livingston's English shape the Anglophone Pareto?** A systematic comparison of \"group-persistences\" / \"non-logical\" / \"derivation\" against the Italian *persistenza degli aggregati* / *non-logico* / *derivazione* — and against Finer's and Powers's later renderings — would quantify the translation effect.\n5. **The fact/value firewall.** Pareto claims logico-experimental neutrality but writes with evident contempt for humanitarianism and democracy. Is the contempt a leak in the firewall (i.e., his own derivations showing) or is it, as he would claim, a value-free report of social facts?\n6. **Relation to Durkheim and Weber.** Parsons yoked the three together in *The Structure of Social Action*; how genuinely convergent is Pareto's \"non-logical action\" with Weber's *wertrational*/traditional action and Durkheim's non-contractual elements of contract? (Comparative document territory, but it bears on whether residues are *sui generis*.)\n\n---\n\n## Sources\n\n1. *The Mind and Society. By Vilfredo Pareto. Edited by Arthur Livingston.* (New York: Harcourt, Brace and Company, 1935. Four volumes. Pp. 2,033.) — *American Political Science Review* book notice (recording the four-volume, 2,033-page edition). https://www.cambridge.org/core/journals/american-political-science-review/article/abs/mind-and-society-by-vilfredo-pareto-edited-by-arthur-livingston-new-york-harcourt-brace-and-company-1935-four-volumes-pp-2033/B0FE875401F7493CFD100D3F25BFCDFC — Accessed 2026-06-13. **Tier 2** (scholarly journal notice; used for the bibliographic facts).\n2. Pareto, Vilfredo, *The Mind and Society*, Vol. I: *Non-Logical Conduct* (Harcourt, Brace, 1935; trans. Livingston/Bongiorno/Rogers). Full text, Internet Archive. Cited for §§6, 55, 69, 150–154 (definition of logical/non-logical action, the four-genera table, the logico-experimental method) and Livingston's translation note. https://archive.org/stream/ParetoTheMindAndSocietyVol4TheGeneralFormOfSociety/Pareto%20-%20The%20Mind%20and%20Society%20Vol%201;%20Non-Logical%20Conduct_djvu.txt — Accessed 2026-06-13. **Tier 1** (primary text).\n3. Pareto, Vilfredo, *The Mind and Society*, Vol. II: *Analysis of Sentiment (Theory of Residues)* (Harcourt, Brace, 1935). Full text, Internet Archive. Cited for §§868–870 (definition of residues/derivations/derivatives; Livingston's gloss), §888 (synoptic table of residue classes), §889 (Class I), §§991–994 (Class II, \"mechanical inertia,\" Livingston's long translation note on *persistenza degli aggregati*), and the subclass structure of all six classes. https://archive.org/stream/ParetoTheMindAndSocietyVol4TheGe
