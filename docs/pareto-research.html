o/criticism/criticism/j-jaffe-essay-date-1960 — accessed 2026-06-13. **Tier 2** (scholarly essay; the death/senatorship facts and the qualified, liberty-warning character of Pareto's late fascist sympathy).\n25. Femia, Joseph V. *Pareto and Political Theory* (Routledge, 2006), publisher/abstract and reviews. https://www.routledge.com/Pareto-and-Political-Theory/Femia/p/book/9780415663717 — accessed 2026-06-13. **Tier 2** (scholarly monograph via abstract/reviews; the \"sceptical liberalism\" relocation, refutation of proto-fascist charge, scepticism-toward-one's-own-beliefs as precondition of compromise).\n26. \"Pareto and Fascism Reconsidered\" (van der Zanden) and \"Disfigurations of Democracy? Pareto, Mosca and the Challenge of 'Elite Theory,'\" Jackson (2021). https://e-space.mmu.ac.uk/628575/1/Jackson2021_Article_DisfigurationsOfDemocracyParet.pdf — accessed 2026-06-13. **Tier 2** (peer-reviewed; the two-sided fascism debate and the Mosca/Pareto distinctions).\n27. Britannica, \"Elite theory\" and \"Vilfredo Pareto,\" for the Mosca/Pareto priority dispute and the ruling-class/political-formula terminology. https://www.britannica.com/topic/elite-theory — accessed 2026-06-13. **Tier 2** (authoritative reference).\n28. Drochon, Hugo. \"Robert Michels, the iron law of oligarchy and dynamic democracy,\" *Constellations* (2020). https://onlinelibrary.wiley.com/doi/full/10.1111/1467-8675.12494 — accessed 2026-06-13. **Tier 2** (peer-reviewed; the specific, empirical, organizational character of Michels's iron law vs. Pareto's general theory).\n29. Yarvin, Curtis (\"Mencius Moldbug\"). \"James Burnham's Dante: Politics as Wish,\" Unqualified Reservations, 2007-08-07. https://www.unqualified-reservations.org/2007/08/james-burnhams-dante-politics-as-wish/ — accessed 2026-06-13. **Tier 7** (neo-reactionary blog; cited ONLY as primary evidence of the NRx reading of Burnham, never as evidence of any fact about Burnham's text).\n30. \"An antidemocratic philosophy called 'neoreaction' is creeping into GOP politics,\" The Conversation, and Joshua Tait, \"The Silicon Valley Elite.\" https://theconversation.com/an-antidemocratic-philosophy-called-neoreaction-is-creeping-into-gop-politics-182581 and https://joshuatait.substack.com/p/the-silicon-valley-elite — accessed 2026-06-13. **Tier 5/6** (analytical/journalistic; the Yarvin–Thiel–Burnham milieu as a fact of contemporary reception, lean noted)."}, {"order": 8, "file": "08_Comparisons_Legacy_And_Revival.md", "title": "Pareto in Comparative Context: The Elitist School, Its Legacy, and the Contemporary Revival", "summary": "", "body": "# Pareto in Comparative Context: The Elitist School, Its Legacy, and the Contemporary Revival\n\n## Bottom Line\n\nPareto did not invent elite theory alone, and the corpus should stop pretending he did. He belongs to a trio — Gaetano Mosca, Robert Michels, and (more loosely) Georges Sorel — that James Burnham later branded the \"neo-Machiavellians.\" The most important fact about that trio is that they disagreed. Mosca got there first: his ruling-class doctrine dates to 1884, sixteen years before Pareto's. He accused Pareto of taking his ideas without credit, rejected the very word *élite* as smuggling in a moral judgment, and ended up a constitutional liberal who defended parliamentary government. Pareto was the psychologist and the cynic, modeling power as a cyclical, almost physiological circulation of lions and foxes. Michels, working from inside the German Social Democratic Party, produced the hardest empirical version — the \"iron law of oligarchy\" — and then followed it into Italian Fascism. Sorel supplied the theory of myth and violence that made the family resemblance look like a school.\n\nThe 20th-century legacy splits cleanly into two channels. One runs through American sociology and political science as a *structural* reformulation that drops Pareto's psychology: C. Wright Mills's institutional *Power Elite* (1956), Schumpeter's \"competitive\" or democratic elitism, Raymond Aron, T. B. Bottomore, Suzanne Keller's \"strategic elites,\" and — in a strange domestication — Talcott Parsons's Harvard \"Pareto circle,\" which mined Pareto for systems theory while quietly dropping the politics. The other is the pluralist rebuttal: Robert Dahl's *Who Governs?* (1961) argued power in an American city was dispersed, not held by a single elite, and for two decades the discipline treated classical elitism as refuted, fascist-tainted, and unfalsifiable. By the 1980s the empirical wing revived under John Higley and Michael Burton's \"elite settlement\" theory, which made elite consensus the hinge of democratic stability — a quieter, testable elite theory shorn of the cyclical metaphysics.\n\nThe contemporary revival is real but bifurcated, and the corpus must keep the two halves apart. The *scholarly* revival is exemplified by Hugo Drochon's *Elites and Democracy* (Princeton, 2026), which recovers Mosca/Pareto/Michels as serious individual thinkers and reads populism as elite circulation rather than its negation, and by Peter Turchin's cliodynamics, whose \"elite overproduction\" is a genuine quantitative descendant of circulation-of-elites — and which drew heavy fire (Mounk, Parenti/Compact, Reeves) for a slippery definition of \"elite,\" unfalsifiable framing, and overclaiming a \"science of history.\" The *rhetorical* revival is the online/dissident right's appropriation of Burnham's *Machiavellians* and *Managerial Revolution* — Curtis Yarvin's \"Cathedral,\" the \"managerial elite\" and \"longhouse\" vocabulary — better understood as anti-elite weaponry than as scholarship, and which (as Burnham scholars note) sits awkwardly with Burnham's own contempt for populist faith in the people's virtue. For the forecast, the drivers favoring continued revival are concrete: rising top-end inequality legible as a literal Pareto distribution; credential inflation feeding elite aspirant surplus; populist anti-elite politics; the visibility of tech/finance power concentration; the intellectual fashion cycle. The counter-forces are equally concrete: academic norms against cyclical \"great-man\" history; the empirical thinness of strong cyclical claims; normative resistance to anti-democratic implications; and the discrediting effect of the theory's use as a partisan cudgel.\n\n---\n\n## 1. The Italian / Elitist School: Pareto Among the Neo-Machiavellians\n\n### 1.1 The school and the label\n\nPareto is almost never read alone. He is read as one of three (sometimes four) figures who, between roughly 1884 and 1916, independently and then competitively arrived at one claim: every organized society — whatever its formal constitution — is in fact governed by an organized minority. Burnham's 1943 *The Machiavellians: Defenders of Freedom* fixed the grouping in the Anglophone mind, treating Machiavelli, Mosca, Pareto, Michels, and Sorel as a single tradition of political realists who studied power as it is rather than as it ought to be [1][8]. The discipline's standard term for them is \"elite theory\" or \"the Italian school of elitism\" — Mosca and Pareto were both Italian; Michels was German-born but Italianized [2][9].\n\nThe crucial corrective, pressed hardest in recent scholarship by Hugo Drochon, is that lumping the three together as interchangeable \"elite theorists\" flattens real and consequential differences. Drochon argues political science wrongly treated them as a bloc when they \"merit individual analysis\" [10]. The differences are not cosmetic. They track a deep split between a *juridical/institutional* and a *psychological/cyclical* conception of power, and between a *liberal-constitutionalist* and a *cynical-realist* politics.\n\n### 1.2 Gaetano Mosca: the ruling class, the political formula, and the priority dispute\n\n**Mosca (1858–1941)** was a Sicilian-born professor of constitutional law who also served as a deputy, an undersecretary, and ultimately a senator [Mosca-bio][11]. His foundational claim appeared in *Sulla teorica dei governi e sul governo parlamentare* (1884), written when he was twenty-six, and matured in *Elementi di scienza politica* (1896; a much-expanded edition in 1923; translated into English as *The Ruling Class* in 1939) [1][11]. The core proposition: in every society there are \"two classes of people — a class that rules and a class that is ruled,\" and the ruling class is always an *organized minority* that prevails over the disorganized majority precisely because it is organized [9][11].\n\nTwo Mosca concepts are load-bearing for the corpus:\n\n- **The \"ruling class\" / \"political class\"** — Mosca's preferred term, denoting simply those \"best suited to govern,\" carrying *no* moral judgment. This is the heart of his terminological quarrel with Pareto (below) [Bobbio][11].\n- **The \"political formula\"** — the doctrine, body of belief, or myth \"with which the class in power tries to justify its own superiority\" and legitimates the political structure [Bobbio][11]. James Meisel, Mosca's most authoritative English-language interpreter, titled his 1958 study *The Myth of the Ruling Class* precisely because the political formula is the mythic self-justification every ruling class requires [Meisel]. Bobbio's methodological warning is that one must study what a ruling class *does*, not what its formula *says* [Bobbio].\n\n**The priority dispute.** This was genuinely bitter, and it matters. Mosca's ruling-class doctrine (1884) preceded Pareto's first statement of elite theory (an article around 1900, then *Les Systèmes socialistes*, 1902–03) by roughly sixteen years. Mosca accused Pareto of appropriating his ideas without due credit; both men waged the polemic over priority and originality \"with vigor and bitterness\" [1][Mosca-enc]. Historical consensus today generally credits Mosca with priority on the ruling-class idea [1][Bobbio]. Bobbio documents Pareto's personal animosity, citing a July 1900 letter in which Pareto dismissed Mosca as \"a balloon full of hot air\" [Bobbio]. (This quotation is single-sourced to Bobbio's reading of the correspondence and should be flagged as such.) James Meisel's *The Myth of the Ruling Class* (1958) gives the most exhaustive treatment of the dispute [Meisel].\n\n**The real analytical differences.** Beyond priority, Mosca and Pareto differ in three ways the corpus should foreground:\n\n1. **Method.** Mosca, the law professor, worked historically and institutionally; Pareto worked psychologically, grounding politics in sentiments (residues). Bobbio frames this as juridical-historical (Mosca) versus psychological-cyclical (Pareto) [Bobbio].\n2. **Terminology and moralism.** Mosca explicitly rejected Pareto's term *élite* on the grounds that it wrongly implies the rulers are morally or intellectually *superior*; his \"ruling class\" is value-neutral [Bobbio][10].\n3. **Politics.** This is the deepest difference. Mosca was a **constitutional liberal**. His concept of \"juridical defense\" (*difesa giuridica*) describes a society in which law, moral codes protecting individual rights, and the distribution of power among competing interests all check the ruling class's power — \"power is a check on power\" [Bobbio][11]. In later editions he increasingly championed representative/parliamentary government as the system that best lets new forces enter the ruling class and best disperses power, even while he denied that \"democracy\" in the literal sense exists [11]. Pareto drew far more cynical and cyclical conclusions, treating democracy as a \"demagogic plutocracy\" and elite turnover as a quasi-physiological cycle of degeneration and renewal [Bobbio][2]. Where Mosca's realism issues in a defense of constitutional checks, Pareto's issues in something closer to contempt for all formulas.\n\n### 1.3 Robert Michels and the iron law of oligarchy\n\n**Robert Michels (1876–1936)** was a German-born sociologist who became an Italian citizen and academic. His 1911 *Zur Soziologie des Parteiwesens* (English: *Political Parties*) produced the most famous and most testable proposition of the school: the **iron law of oligarchy** [Michels-1][12]. The formulation: \"It is organisation that gives birth to the domination of the elected over the electors, of the mandataries over the mandators, of the delegates over the delegators. Who says organisation, says oligarchy.\" [12].\n\nWhat distinguishes Michels methodologically is his **case**. He studied not abstract societies but the German Social Democratic Party (SPD) — the largest, richest, best-organized, most powerful socialist party in the world, of which he had been an active member from 1902 to 1907 [12]. The bite of the argument is that even an *avowedly democratic*, egalitarian, mass organization, explicitly committed to internal democracy, inexorably develops a professional, entrenched leadership that places its own survival above the members' goals. The mechanism is organizational, not psychological: competent leadership, centralized authority, specialized division of labor, and bureaucratic expertise all concentrate power at the top. Michels drew explicitly on Weber's analysis of bureaucracy as well as on Pareto and Mosca [12][Michels-1].\n\nTwo critical caveats the corpus should keep. **First, the empirical objections.** Hugo Drochon's analysis (in *Jacobin*, 2024) argues Michels *underestimated* the genuinely democratic elements within the SPD — its annual party congresses, its robust internal debates — and that some of his pessimism reflected his own narrow experience in tiny Marburg, plus his absorption of Gustave Le Bon's discredited crowd psychology (the masses \"need\" to hero-worship leaders) [Michels-2]. **Second, the political trajectory.** Disillusioned with the SPD's failure to marginalize reformists, Michels drifted toward conservative liberalism and ultimately embraced Mussolini as a charismatic leader, joining the orbit of Italian Fascism in the 1920s–30s [Michels-2][Fascism-elite]. As with Pareto's contested late-life proximity to Fascism, Michels's open Fascism did real damage to the postwar reputation of the entire school (§2.5).\n\n### 1.4 Georges Sorel: myth and violence\n\n**Georges Sorel (1847–1922)**, a French engineer-turned-social-theorist, is the looser member of the family. His *Réflexions sur la violence* (1908; English *Reflections on Violence*, trans. T. E. Hulme) is remembered chiefly for the theory of **myth** as a catalyst for collective action — the archetype being the syndicalist myth of the *general strike*, which Sorel treated not as an empirical prediction but as a mobilizing image capable of inspiring revolutionary action [Sorel-1][Sorel-2]. The work famously \"provided inspiration for Marxists and Fascists alike\" [Sorel-1].\n\nBurnham included Sorel among his neo-Machiavellians for his *anti-formalism* — his refusal to accept conventional democratic theory at face value and his insistence that what moves men is myth and force, not rational argument [Sorel-1][8]. This is the genuine bridge among the four. Mosca's \"political formula,\" Pareto's \"derivations\" (the rationalizing ideologies that dress up non-logical action), and Sorel's \"myth\" are three names for one phenomenon: the gap between the *real* drivers of political action (interest, sentiment, organization, force) and the *stated* justifications. Sorel emphasized myth's productive, creative power; Pareto its function as post-hoc rationalization; Mosca its function as legitimation. The shared move is the unmasking of stated reasons.\n\n### 1.5 How the three (four) relate and differ — a synthesis\n\n| | Mosca | Pareto | Michels | Sorel |\n|---|---|---|---|---|\n| Core unit | Ruling/political class | Governing & non-governing elite | Party oligarchy | The myth |\n| Mechanism of rule | Organized minority | Circulation of lions & foxes | Iron law (organization) | Mobilizing myth + violence |\n| Method | Juridical / historical | Psychological / cyclical | Empirical / organizational | Voluntarist / philosophical |\n| \"Mask\" concept | Political formula | Derivations | (inherited) | Myth |\n| Politics | Liberal constitutionalist | Cynical realist; anti-democratic | SPD → Fascism | Syndicalist → ambiguous |\n| Priority on elite idea | 1884 (first) | c. 1900 | 1911 | 1908 |\n\nSources: [1][2][8][9][10][11][12][Bobbio][Sorel-1].\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Elite theory: a 140-year arc<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">1884<\/div><div class=\"tlbody\">Mosca — the ruling class (priority on the elite idea)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">1908<\/div><div class=\"tlbody\">Sorel — Reflections on Violence (the myth)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">1911<\/div><div class=\"tlbody\">Michels — the iron law of oligarchy<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">1916<\/div><div class=\"tlbody\">Pareto — Trattato (circulation; lions &amp; foxes)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">1943<\/div><div class=\"tlbody\">Burnham — The Machiavellians (Anglophone transmission)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">1956<\/div><div class=\"tlbody\">Mills — The Power Elite (the structural turn)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">1961<\/div><div class=\"tlbody\">Dahl — Who Governs? (the pluralist rebuttal)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">1980s<\/div><div class=\"tlbody\">Higley &amp; Burton — elite-settlement theory (testable revival)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.56s\"><div class=\"tldate\">2023<\/div><div class=\"tlbody\">Turchin — End Times (elite overproduction)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.63s\"><div class=\"tldate\">2026<\/div><div class=\"tlbody\">Drochon — Elites and Democracy (scholarly recovery)<\/div><\/div><\/div><figcaption>The school sank under the fascism taint and the unfalsifiability charge (c. 1945–1980), then returned in chastened structural, empirical, and contested-predictive forms. <span class=\"credit\">Source: This corpus, doc 08.<\/span><\/figcaption><\/figure>\n\n\n\nThe takeaway, and the corrective to a Pareto-centric reading: the strongest *empirical* claim is Michels's, which points to a testable mechanism in real organizations; the most *politically liberal* thinker is Mosca, with his juridical defense and parliamentarism; and Pareto's distinctive contribution is the *dynamic, cyclical* model — circulation as an engine, not a static fact — plus the psychological substrate (residues) that the others lacked. Drochon's recovery insists each man left a specific bequest: from Pareto, the word \"elite\" and the lions/foxes typology; from Mosca, representative government as the optimal integrator of social forces; from Michels, the warning about party oligarchy [10].\n\n---\n\n## 2. The 20th-Century Legacy: Transmission, Domestication, Rebuttal, and Decline\n\n### 2.1 C. Wright Mills and the structural turn\n\nThe single most important transmission into postwar social science is **C. Wright Mills's *The Power Elite* (1956)** [Mills][13]. Mills explicitly continued the Mosca–Pareto tradition, then transformed it. Where Pareto grounded elite rule in *superior personal/psychological qualities* and treated it as inevitable, Mills argued power in postwar America was concentrated in three *interlocking institutional hierarchies* — the corporate rich, the military \"warlords,\" and the political directorate — whose members shared social origins, schooling, and worldview [13]. The shift is decisive. Mills explained elite rule **institutionally and structurally**, not psychologically, and (against Pareto) treated it as the contingent product of bureaucratic centralization in mid-century America rather than a transhistorical law [13]. He was careful to deny that this was a conspiracy: it emerges from the structural logic of growing institutions, not deliberate coordination [13]. Mills also tilted the normative valence. Where Pareto was detached, Mills was a critic, treating elite consolidation as exploitative and democratically corrosive.\n\n### 2.2 Schumpeter and \"democratic elitism\"\n\n**Joseph Schumpeter's** *Capitalism, Socialism and Democracy* (1942), Part IV, produced the version of elite theory that the mainstream could *accept*: the \"competitive theory of democracy,\" often labeled **democratic elitism** [Schumpeter]. Schumpeter redefined democracy minimally and procedurally — \"that institutional arrangement for arriving at political decisions in which individuals acquire the power to decide by means of a competitive struggle for the people's vote\" [Schumpeter]. The classical doctrine of popular self-rule is discarded. Voters are largely uninformed and emotional; what democracy *actually* delivers is not the will of the people but a mechanism for the *peaceful, periodic, competitive replacement of elites* [Schumpeter]. This is elite theory made safe for liberal democracy: it concedes the elitists' descriptive point (the people do not rule) while turning it into a defense of electoral competition. The line from Mosca's \"the best system lets new forces into the ruling class\" to Schumpeter's \"democracy = competition among would-be elites\" is direct, and from Schumpeter it runs into Anthony Downs's economic theory of democracy and the whole rational-choice reframing of politics.\n\n### 2.3 Aron, Bottomore, Keller: the mid-century synthesizers\n\nThree figures consolidated and disseminated elite theory as a teachable subfield:\n\n- **Raymond Aron** distinguished pluralistic, differentiated Western elites from the unified \"monopolistic\" elite of Soviet-type societies — a Cold War application turning elite analysis into a tool for comparing regime types [Bottomore][14].\n- **T. B. Bottomore's *Elites and Society* (1964)** became the standard survey, tracing the line from Mosca and Pareto through Mills and Aron and posing the fundamental questions about elite *theory* versus elite *ideology* [Bottomore][14]. Bottomore, a Marxist, used the survey partly to interrogate the ideological function of the concept.\n- **Suzanne Keller's *Beyond the Ruling Class: Strategic Elites in Modern Society* (1963)** advanced the field by replacing the single, unified \"ruling class\" with **plural \"strategic elites\"** — functionally specialized leadership groups (economic, political, military, moral, cultural) each responsible for different social goals [Keller][14]. Keller drew on Aron, Mills, and Parsons; her move pluralizes and de-dramatizes the concept, converging partly with Dahl's pluralism (§2.4).\n\n### 2.4 The pluralist rebuttal: Dahl and the community-power debate\n\nThe strongest mid-century *attack* on elite theory was the pluralist one, and it nearly buried the field. The community-power debate pitted two methods against each other:\n\n- **Floyd Hunter's *Community Power Structure* (1953)** used a *reputational* method — asking insiders who held power — and found a small business-dominated elite running Atlanta [Dahl-1].\n- **Robert Dahl's *Who Governs? Democracy and Power in an American City* (1961)** used a *decisional* method — examining who actually prevailed across specific policy decisions in New Haven — and found power *dispersed* among competing groups, not monopolized by a single elite [Dahl-1][Dahl-2]. Power was unequally distributed but **pluralistic**: different actors won in different issue areas, and patrician/entrepreneurial monopolies had broken down [Dahl-1].\n\nDahl's target was explicitly Mills and Hunter; *Who Governs?* is the canonical empirical rebuttal of the power-elite thesis [Dahl-1][13]. The methodological dispute — reputational versus decisional — mattered in its own right: it raised the problem that elite theory can be unfalsifiable if \"real power\" is defined as whatever the elite is presumed to hold regardless of observable decisions. Critics later answered Dahl with the \"second face of power\" / non-decision-making critique — Bachrach and Baratz — arguing Dahl missed power exercised by keeping issues *off* the agenda; this preserved a defensible elite-theoretic position. And note the irony the corpus should flag: Dahl was himself later criticized for an *elitist* premise — that democracy rests on a relatively apathetic, non-participating population and does not require mass participation [Dahl-1].\n\n### 2.5 Parsons's domestication and the \"Pareto circle\"\n\nA peculiar episode. In the 1930s, the biochemist-sociologist **Lawrence J. Henderson** ran an informal Harvard seminar — the \"Pareto circle\" — devoted to the *Trattato*; its participants included the young **Talcott Parsons** and George Homans [Parsons-1][Parsons-2]. Parsons drew on Pareto (alongside Weber, Durkheim, and Marshall) in *The Structure of Social Action* (1937) and credited Henderson's insistence on the *system* concept — \"the attempt to delineate the social system as a system was the most important contribution of Pareto's great work\" — as central to *The Social System* (1951) [Parsons-2]. This is **domestication**: Parsons mined Pareto for *systems theory and social equilibrium* while quietly dropping the *politics* — the elite circulation, the cynicism about democracy, the residues-as-ideology. One scholarly reading holds that the Henderson/Homans/Parsons reception actually *misread* Pareto, \"corrupting\" the equilibrium concept and turning a theory of conflictual circulation into a theory of consensual stability [Parsons-2]. The corpus should note this as a case where Pareto's reputation *survived* precisely by being depoliticized.\n\n### 2.6 Public choice and rational-choice elite models\n\nElite theory's descriptive core — that organized minorities prevail over disorganized majorities — got fresh microfoundations from **rational-choice and public-choice theory**, which were meant to be value-neutral and which \"strengthened empirical elitism by offering new arguments for the inevitability of elite rule\" [Elite-theory-Brit]. The pivotal text is **Mancur Olson's *The Logic of Collective Action* (1965)**: because individuals free-ride, large diffuse groups (the \"majority\") struggle to organize for collective benefit, while small concentrated groups (potential \"elites\") organize easily [Olson]. This is Mosca's \"organized minority defeats disorganized majority\" re-derived from methodological individualism — a rational-choice vindication of the elitists' central empirical claim, stripped of the cyclical metaphysics and the residues.\n\n### 2.7 Higley and Burton: elite-settlement theory and the empirical revival\n\nBy the 1980s the empirical wing of elite theory revived in a testable form under **John Higley and Michael Burton**. Their **elite-settlement / elite-configuration theory** makes elite *integration* the key variable for regime outcomes: **disunified** national elites produce unstable regimes that oscillate between authoritarian and democratic forms, while **consensually unified** elites produce stable regimes capable of evolving into stable democracies [Higley-1][Higley-2]. \"Elite settlements\" are relatively sudden, deliberate compromises among previously warring elite factions (e.g., post-authoritarian pacts in Southern Europe and Latin America) that establish agreement on the rules of the game and \"tame\" politics [Higley-1][Higley-2]. Synthesized in *Elite Foundations of Liberal Democracy* (Higley & Burton, 2006), this is classical elite theory shorn of fascist taint and cyclical determinism: it keeps the elitist premise (elites are decisive and inevitable) but answers the *democratic* objection by showing that *some* elite configurations sustain liberal democracy [Higley-1][Higley-2]. It is the most respectable living descendant of the school inside comparative politics.\n\n### 2.8 Where the reputation sank — and where it persisted\n\nThree forces drove classical elite theory into disrepute roughly 1945–1980:\n\n1. **The fascism taint.** Pareto's contested late-life proximity to Mussolini (the offered senatorship, his last articles) and Michels's *open* embrace of Fascism gave the school an indelible association with authoritarianism; \"elite theorists such as Pareto and Michels had undeniable ties with the Italian Fascist party, which significantly damaged the credibility of elite theory in the postwar period\" [Fascism-elite]. The taint was unfair to Mosca, a critic of Fascism, but stuck to the school as a whole.\n2. **The unfalsifiability charge.** If elite rule is true by definition — there is *always* an organized minority; power is *whatever* the elite holds — then the theory predicts nothing and excludes nothing. This charge, sharpened in the Dahl debate and again in the Turchin debate, is the deepest analytical wound. Pareto's residues/derivations apparatus was a special target: critics argued it could \"explain\" any behavior post-hoc.\n3. **The rise of behavioralism.** Postwar political science prized value-neutral, quantitative, falsifiable behavioral research; \"later approaches such as behavioralism and rational-choice theory were meant to be value neutral,\" and the grand, normatively loaded, cyclical theorizing of the Italian school looked like the unscientific past [Elite-theory-Brit][Fascism-elite].\n\nWhere it *persisted*: in Mills's structural reformulation; in democratic elitism (Schumpeter → Downs); in rational-choice elitism (Olson); in the empirical elite-settlement program (Higley/Burton); and as a permanent fixture in the *teaching* of political sociology. The classical theory never died; it went underground as a depoliticized, structuralized, or testable variant — and waited.\n\n---\n\n## 3. The Contemporary Revival (Forecast Substrate)\n\nThe revival of the 2010s–2020s is genuine but **bifurcated**, and the corpus's central critical task is to separate the two strands: a *scholarly* revival that does real analytic work, and a *rhetorical* revival that deploys the vocabulary as a partisan weapon. A few authors and currents sit between them.\n\n### 3.1 The scholarly revival: Drochon and the recovery of the school\n\nThe clearest sign of a *bona fide* intellectual revival is **Hugo Drochon's *Elites and Democracy*** (Princeton University Press, 2026) — a Cambridge-trained political theorist's full-length recovery of Mosca, Pareto, and Michels as serious, individually distinct thinkers [10][Drochon-rev]. Drochon's thesis: \"We live in the age of the revolt against the elites,\" but elite theory is not an *attack* on democracy — it is \"an X-ray of its weaknesses\" [10]. He reads contemporary populism (Trump, Brexit, Le Pen) as **elite circulation**: outside elites challenging crystallized establishments. Crucially, he insists populist leaders *are themselves elites* despite anti-elite rhetoric, and that real change requires established elites to *defect* and align with rising movements — a direct application of Pareto's circulation and Mosca's \"let new forces into the ruling class\" [10]. Populism, Drochon argues explicitly, is \"part and parcel of democracy,\" not necessarily its enemy [10]. This is elite theory used as a *descriptive analytic*, with scholarly distance from the political actors it analyzes — the model of a genuine revival.\n\nA parallel, more quantitative scholarly current re-engages elite theory against the populism literature: recent work argues the \"populist model\" lacks a coherent, applicable definition and that *elite theory* — focused on elite recomposition and circulation at the apex — is the stronger framework for explaining democratic backsliding and the rise of leader-centered coalitions that repurpose competitive institutions [Backsliding-1][Backsliding-2]. Higley/Burton's elite-configuration program (§2.7) feeds directly into this.\n\n### 3.2 Turchin's cliodynamics: the quantitative descendant of circulation-of-elites\n\n**Peter Turchin's** *End Times: Elites, Counter-Elites, and the Path of Political Disintegration* (2023) is the most prominent quantitative descendant of Pareto's circulation-of-elites [Turchin-1][Turchin-2]. Turchin — founder of the field of **cliodynamics**, editor of *Cliodynamics: The Journal of Quantitative History and Cultural Evolution*, and founding director of the *Seshat: Global History Databank* — builds on Jack Goldstone's **structural-demographic theory (SDT)** [Turchin-3][Turchin-4]. The model identifies four drivers of instability: **popular immiseration, elite overproduction, declining state finances, and geopolitical pressure** [Turchin-1].\n\nThe Pareto inheritance is direct. **Elite overproduction** is the cliodynamic restatement of the circulation/closure cycle: when a society produces far more elite *aspirants* (degree-holders, would-be officeholders, the wealthy seeking influence) than there are elite *positions*, the surplus becomes \"frustrated elite aspirants\" who turn into **counter-elites**, harnessing popular resentment to attack the established order [Turchin-1][Turchin-5]. The **\"wealth pump\"** — rising inequality channeling income upward — both immiserates the masses and inflates the aspirant pool [Turchin-1]. This is circulation-of-elites with a demographic-economic engine bolted on and a quantitative apparatus built around it. Turchin's notoriety rests on a **2010 *Nature* commentary** forecasting that the 2010–2020 decade would bring rising instability in the US and Western Europe — a forecast he and co-authors later argued was substantially borne out by rising anti-government demonstrations and riots [Turchin-3][Turchin-6].\n\n### 3.3 The critiques of Turchin: vagueness, unfalsifiability, overclaiming\n\nTurchin drew heavy fire, and the critiques recapitulate exactly the charges that sank classical elite theory (§2.8) — itself analytically revealing.\n\n- **Yascha Mounk** (\"There Is No Surplus Elite in America,\" *Persuasion*, Dec. 5, 2024) makes the sharpest version: Turchin equivocates between a \"Broad Elite Hypothesis\" (elites = the wealthy) and a \"Narrow Elite Hypothesis\" (elites = holders of rare positions like elected office), and \"is able to detect elite overproduction in so many historical eras because he has a flexible definition of 'elite.'\" Mounk calls the method \"astrology for politics nerds\" and \"unfalsifiable,\" notes that college-educated Americans earn well above median and recent-graduate unemployment is ~5%, and argues the actual counter-elite (Bannon, Patel) has \"precious little in common with that history postdoc\" — Trump's base is working-class, not frustrated elite aspirants [Mounk]. *(Persuasion is a center/heterodox outlet; this is position-evidence and analytic critique, not a fact-claim about Turchin's data.)*\n- **Christian Parenti** (\"Peter Turchin's False Prophecy,\" *Compact*, Aug. 8, 2023) — from the post-liberal left — argues the central concept of \"elite\" expands until it is \"too broad to be analytically useful,\" that mathematical modeling \"flattens the specificities... of climate, geography, personality, individual genius, charisma,\" that it resembles discredited models (he cites Neil Ferguson's pandemic models), and that Turchin ignores how modern surveillance/security states *prevent* the collapse he predicts [Parenti]. *(Compact is a heterodox post-liberal magazine; position-evidence.)*\n- **Richard Reeves** (*Literary Review*) and others register a milder version: compelling read, interesting modeling, but the strong claims fall short [Turchin-2][Reeves].\n\nThe pattern is the point. The strongest descendant of circulation-of-elites faces the *same* objections — conceptual vagueness of \"elite,\" unfalsifiability, and overclaiming a \"science of history\" — that retired the original. This is the central evidentiary fact for the forecast on the *strong* (cyclical, predictive) version of elite theory.\n\n### 3.4 The rhetorical revival: Burnham, NRx, and the \"managerial elite\" vocabulary\n\nThe other half of the revival is the **online/dissident-right** appropriation of Burnham, and it should *not* be confused with the scholarly strand. The lineage runs from Burnham's *The Managerial Revolution* (1941) — a transatlantic bestseller arguing capitalists would be displaced by a new class of managers/technocrats, and a major influence on Orwell's *1984* — plus *The Machiavellians* (1943), through paleoconservative and neo-reactionary channels to the contemporary right [Burnham-MR][Burnham-bio][Havers].\n\nThe signature artifact is **Curtis Yarvin's \"the Cathedral\"** — his term for the de facto US ruling regime, \"journalism plus academia,\" a self-reinforcing \"monoculture\" of opinion-makers that propagandizes for an oligarchy [Yarvin-1][NRx-1]. Yarvin cites Burnham as an influence; the \"Dark Enlightenment\"/NRx movement draws explicitly on Burnham's analysis of power elites and managerial control [NRx-1][Yarvin-1]. The vocabulary — \"managerial elite,\" \"the Cathedral,\" the \"professional-managerial class\" (PMC), the meme of \"the longhouse\" — has migrated into mainstream Republican discourse: Vice President JD Vance has praised Yarvin by name and echoed the call to \"fire every single mid-level bureaucrat... and replace them with our people,\" a vision partly enacted via the post-inauguration DOGE firings in early 2025 [Yarvin-2][NRx-2]. The \"new class\"/managerialism revival has, in the past several years, spread across populists \"of all stripes\" [Burnham-MR].\n\n**The critical reading the corpus must apply.** Scholars of Burnham (notably Grant Havers, *James Burnham's Elite Theory and the Postwar American Right*) make two points that puncture the appropriation. First, Burnham's *Machiavellian realism* sits in genuine tension with the *populist* faith in the people's virtue. Burnham rejected the populist belief that \"the people\" are virtuous and self-governing — the whole point of elite theory is that they are not — so the populist deployment of Burnham is internally strained [Havers][Burnham-right]. Second, the \"managerial elite\" label is selectively applied: populist conservatives often use it to mean left-leaning academics, journalists, and bureaucrats while staying silent about their own billionaire and corporate backers — a use that is **rhetorical weaponry, not analysis** [Burnham-right][Havers]. Orwell's \"Second Thoughts on James Burnham\" (1946) anticipated the danger. He read Burnham's worship of power and his serial mis-prediction (Germany, then the USSR, would win) as evidence that Burnham mistook the trend of the moment for an iron law [Orwell].\n\n### 3.5 Pareto distributions and the inequality revival\n\nA quieter but robust revival runs through *economics*, where Pareto's name attaches to a literal statistical object. The **Pareto distribution / power law** — Pareto's 1890s empirical finding that the upper tail of income/wealth follows a power law (the \"80–20\" pattern in its popular form) — has returned to the center of inequality research [Pareto-Piketty][Equitable]. Since the early 2000s, the work of Piketty, Saez, and collaborators \"revolutionized our understanding of income and wealth inequality,\" and \"one of the key links between data and theory is the Pareto distribution\" [Pareto-Piketty]. Charles Jones's *Pareto and Piketty: The Macroeconomics of Top Income and Wealth Inequality* (NBER WP 20742, 2014; *Journal of Economic Perspectives*, 2015) shows that simple economic mechanisms generate Pareto tails and that the gap between the rate of return and growth (r − g) governs top-end concentration [Pareto-Piketty]. The self-similar property — \"if the top 1% owns 40% of wealth, the top 0.01% owns 40% of the wealth of the top 1%\" — is the modern, mathematized face of Pareto's original observation [Equitable]. This is a *fully legitimate* scientific revival, and it matters for the forecast: it makes elite/inequality concentration *measurable and salient*, feeding the popular and scholarly appetite for elite analysis (§4).\n\n### 3.6 Distinguishing genuine revival from rhetorical weapon — the corpus's verdict\n\n| Strand | Character | Status |\n|---|---|---|\n| Drochon, *Elites and Democracy* (2026); elite-settlement scholarship | Scholarly, descriptive, distance from actors | **Genuine intellectual revival** |\n| Pareto distributions / Piketty-Saez-Jones inequality economics | Empirical, quantitative, mainstream | **Genuine scientific revival** |\n| Turchin / cliodynamics / elite overproduction | Quantitative but contested; overclaims a science of history | **Genuine but disputed** (strong version empirically thin) |\n| NRx / Yarvin \"Cathedral\" / \"managerial elite\" populist vocabulary | Rhetorical, partisan, selectively applied | **Largely citation-as-weapon**, not analysis |\n\nThe honest summary: elite theory is *unambiguously back* as (a) a frame for understanding populism and democratic backsliding, (b) a measurable feature of the inequality distribution, and (c) a meme. Its *strong* form — a predictive, cyclical science of history — remains as contested in 2026 as in 1956, and for the same reasons.\n\n---\n\n## 4. Mechanism-Specific Drivers for the Forecast\n\nThe following are the concrete drivers and counter-forces the forecast workstream should lift directly, each with its mechanism.\n\n### 4.1 Drivers favoring continued revival\n\n1. **Rising top-end inequality, legible as a literal Pareto tail.** *Mechanism:* the empirical resurgence of power-law inequality research (Piketty/Saez/Jones) makes elite concentration *measurable and undeniable*; a literally Pareto-shaped distribution makes \"the elite\" a quantifiable object, lowering the cost of elite-theoretic argument and lending it data [Pareto-Piketty][Equitable]. Strength: high; it is the most empirically grounded driver.\n2. **Credential inflation feeding elite-aspirant surplus.** *Mechanism:* mass expansion of higher education (law, MBA, PhD) produces more credentialed aspirants than elite positions, generating frustrated would-be elites — Turchin's elite-overproduction engine and Pareto's \"blocked circulation\" [Turchin-1][Turchin-5]. Strength: contested in magnitude (Mounk disputes the US numbers) but directionally real; the *mechanism* holds even where the strong claim overreaches.\n3. **Populist anti-elite politics.** *Mechanism:* the electoral ascendance of anti-establishment movements (US 2024, Italy 2022, Argentina 2023, Netherlands 2024) creates demand for frameworks that explain elite-vs-counter-elite dynamics; elite theory supplies the vocabulary, and populist actors *themselves* adopt anti-elite framing [10][Backsliding-1]. Strength: high; this is the proximate cause of the current wave.\n4. **Legibility of power concentration in tech and finance.** *Mechanism:* the visible concentration of economic and informational power in a few platforms and a few founders/CEOs (and their open political engagement) makes a small-organized-minority story intuitively plausible, and supplies a concrete \"elite\" to point at [Yarvin-2][NRx-2]. Strength: high in salience.\n5. **The intellectual fashion cycle.** *Mechanism:* periodic exhaustion of the dominant paradigm (here, both naive pluralism and the \"populism\" literature's definitional problems) creates openings for revived heterodox frameworks; elite theory is the available alternative with a ready canon [Backsliding-1][10]. Strength: medium; real but faddish.\n\n### 4.2 Counter-forces\n\n1. **Academic norms against cyclical / \"great-man\" / deterministic history.** *Mechanism:* mainstream historiography and social science remain hostile to grand cyclical theories and to claims of a predictive \"science of history,\" limiting the *strong* version's penetration into the academy (the Turchin critiques) [Mounk][Parenti]. Strength: high against strong forms.\n2. **Empirical thinness of the strong cyclical claim.** *Mechanism:* the unfalsifiability/vagueness-of-\"elite\" problem (§2.8, §3.3) means the predictive version cannot be cleanly tested; this caps its scholarly respectability even as the descriptive version thrives [Mounk][Parenti]. Strength: high against strong forms; low against descriptive/structural forms.\n3. **Normative resistance to anti-democratic implications.** *Mechanism:* the theory's historic fascist associations and its current use to justify anti-democratic \"neocameralist\" schemes (Yarvin) provoke active scholarly and public pushback, raising the reputational cost of association [Fascism-elite][NRx-2]. Strength: medium-high.\n4. **Discrediting by partisan weaponization.** *Mechanism:* as \"managerial elite\"/\"Cathedral\" becomes a recognizable partisan cudgel, serious analysts may *avoid* the vocabulary to escape contamination — the rhetorical revival can crowd out the scholarly one [Havers][Burnham-right]. Strength: medium; a genuine risk to the *scholarly* strand.\n\n### 4.3 Leading vs. lagging\n\n- **Leading (likely to dominate the next phase):** populist electoral dynamics and the inequality-data revival — both are accelerating and self-reinforcing.\n- **Lagging (reactive):** the academic recovery (Drochon, elite-settlement scholarship) trails events by the usual scholarly lag; the rhetorical revival is co-moving with politics and could peak and recede with the current populist cycle.\n\n---\n\n## Open Questions\n\n1. **Does the descriptive revival survive the discrediting of the strong/predictive version?** If Turchin's cliodynamics is widely judged to have overreached, does that drag down the respectable descriptive elite theory (Drochon, Higley/Burton) by association, or do scholars successfully quarantine the strong claims?\n2. **Is \"elite overproduction\" measurable enough to be science?** Can anyone operationalize \"elite\" consistently enough to make the overproduction thesis falsifiable, or is the vagueness charge (Mounk, Parenti) fatal to the quantitative program?\n3. **How much of the right's \"managerial elite\" framing is downstream of Burnham specifically versus a generic anti-establishment populism that would exist without him?** The Burnham→Yarvin lineage is documented, but its causal weight relative to broader currents is unclear.\n4. **Will the inequality-economics \"Pareto\" and the political-sociology \"elite theory\" ever re-merge?** They share Pareto's name and the concentration phenomenon but currently run in separate literatures; a synthesis (power-law inequality *as* the engine of elite circulation) is latent but unbuilt.\n5. **Does Mosca's juridical-liberal version offer a usable third way** between cynical Paretan realism and naive pluralism for theorizing democratic resilience — and is anyone developing it?\n6. **What is the actual content of Pareto's 1900 article and the 1900 correspondence with/about Mosca** beyond Bobbio's reading? (Primary-text gap — see below.)\n\n---\n\n## Sources\n\n**Tier 1 — Primary texts (referenced; see gap notes for which were read directly):**\n\n- [Mills] C. Wright Mills, *The Power Elite* (Oxford University Press, 1956). — Canonical structural reformulation of elite theory; the three interlocking hierarchies.\n- [Michels-1] Robert Michels, *Political Parties: A Sociological Study of the Oligarchical Tendencies of Modern Democracy* (1911; Eng. trans. 1915). — Source of the iron-law formulation.\n- [Turchin-1] Peter Turchin, *End Times: Elites, Counter-Elites, and the Path of Political Disintegration* (Penguin Random House, 2023). — Elite overproduction, the wealth pump, the four drivers.\n- [Schumpeter] Joseph A. Schumpeter, *Capitalism, Socialism and Democracy* (1942), Part IV. — The competitive n- [Backsliding-1] \"Time for a change: replacing the populist model with elite theory,\" ResearchGate/journal, https://www.researchgate.net/publication/365608651 (accessed 2026-06-13); [Backsliding-2] Yesilkagit, \"Beyond Democratic Backsliding: Bureaucracy, Elite Dynamics and Administrative Change,\" *Governance* (Wiley, 2026), https://onlinelibrary.wiley.com/doi/10.1111/gove.70124 (accessed 2026-06-13). — Elite theory re-engaged against the populism literature. Tier 2.\n- ['Disfigurations'] \"'Disfigurations' of Democracy? Pareto, Mosca and the Challenge of 'Elite Theory',\" *Topoi* (Springer, 2021), https://link.springer.com/article/10.1007/s11245-021-09773-y (accessed 2026-06-13). — The Machiavellian framing and the democracy challenge. Tier 2.\n\n**Tier 2/3 — Reference works (used for dates/biography, cross-checked):**\n\n- [1] [Mosca-enc] [Mosca-bio] [11] \"Gaetano Mosca,\" Encyclopedia.com (1858–1941 entry), https://www.encyclopedia.com/humanities/encyclopedias-almanacs-transcripts-and-maps/mosca-gaetano-1858-1941 (accessed 2026-06-13); Cairn.info Bobbio chapter; Britannica \"Gaetano Mosca.\" — Dates, works (1884; 1896; 1923; *The Ruling Class* 1939), ruling class / political formula / juridical defense, parliamentarism, priority dispute. Tier 2/3.\n- [12] [Michels bio] \"Iron law of oligarchy,\" Britannica, https://www.britannica.com/topic/iron-law-of-oligarchy (accessed 2026-06-13); SPD membership 1902–1907; the canonical formulation. Tier 3.\n- [Elite-theory-Brit] [9] \"Elite theory,\" Britannica, https://www.britannica.com/topic/elite-theory (accessed 2026-06-13). — Residues, behavioralism/rational-choice as value-neutral successors, organized-minority claim. Tier 3.\n- [13] \"The Power Elite,\" and Mills/Pareto/Burnham contrast (sociology references), incl. https://en.wikipedia.org/wiki/The_Power_Elite (navigation only; substantive claims sourced to Mills directly). — Three hierarchies; institutional vs. psychological contrast. Tier 1 (Mills) via Tier 3 phy-called-neoreaction-is-creeping-into-gop-politics-182581 (accessed 2026-06-13); \"Curtis Yarvin,\" Britannica, https://www.britannica.com/biography/Curtis-Yarvin; WBUR On Point, \"JD Vance and the rise of the 'New Right',\" 2025-04-05. — The Cathedral, Burnham influence, Vance/DOGE. Tier 4/5 (mainstream reporting/reference) for the *existence and content* of the vocabulary; the ideas themselves are position-evidence.\n- [Burnham-right] Michael Lind, \"The Importance of James Burnham,\" *Tablet*, https://www.tabletmag.com/sections/news/articles/burnham-michael-lind (accessed 2026-06-13). — Managerialism's transmission to the populist right; selective application of \"managerial elite.\" Tier 6 (analysis; position).\n- [Orwell] George Orwell, \"Second Thoughts on James Burnham,\" *Polemic* (1946), The Orwell Foundation, https://www.orwellfoundation.com/the-orwell-foundation/orwell/essays-and-other-works/second-thoughts-on-james-burnham/ (accessed 2026-06-13). — Burnham's power-worship and serial mis-prediction. Tier 1 (primary essay).\n- [Fascism-elite] \"Fascism and Elite Theories,\" Earlham Sociology pages, https://earlhamsociologypages.uk/fascelitesummi-2/ (accessed 2026-06-13). — Pareto/Michels Fascist ties and the postwar reputational damage. Tier 5 (educational synthesis; cross-checked).\n- [Equitable] \"The Pareto distribution and r > g,\" Washington Center for Equitable Growth, https://equitablegrowth.org/pareto-distribution-r-g/ (accessed 2026-06-13). — Self-similarity of the Pareto tail; link to Piketty. Tier 5 (center-left think tank; lean noted).\n- [Drochon-rev] Reviews of *Elites and Democracy*: American Affairs (\"Rediscovering a Dynamic Elite?\", 2026-05), Irish Times (2026-05-30), Law & Liberty (\"The Elite Revolt Against Elites\"). — Reception of the scholarly revival. Tier 5/6 (lean varies; position-evidence on reception).\n\n**Tier 8 — label/navigation only (no substantive claim):** Wikipedia entries on Iron law of oligarchy, The Power Elite, Elite theory, Elite overproduction, Peter Turchin, Curtis Yarvin, James Burnham, Structural-demographic theory were used for navigation to primary/scholarly sources; no substantive claim rests on them.\n\n---\n\n*Compiled 2026-06-13 for the Pareto deep-research corpus, workstream 08. This document supplies the mechanism-specific drivers (§4) for the Round 2 forecast (`Future_Trajectory.md`).*"}, {"order": 9, "file": "Future_Trajectory.md", "title": "Future Trajectory: Will Elite Theory Last?", "summary": "", "body": "# Future Trajectory: Will Elite Theory Last?\n\n> **A note on method.** The deep-research workflow that built this corpus completed Round 1, triage, and most adversarial verification, then stopped at the gap-fill stage when a monthly spend limit halted its subagents — before the forecast judge-panel ran. This document was therefore written in the main loop, grounded directly in the verified pillar documents and, above all, in the mechanism-by-mechanism driver analysis the comparisons workstream prepared as forecast substrate ([08](08_Comparisons_Legacy_And_Revival.md), §4). It preserves disagreement rather than averaging it away, and it states its probabilities as ranges, not points.\n\n## Bottom Line\n\nElite theory is not going anywhere — but the question \"will it last?\" hides four different objects with four different fates, and the single most important act of forecasting here is to keep them apart. The *descriptive* core (rule by organized minorities; circulation and closure; competitive elites as the real guarantor of liberty) is already normalized and will stay so: it has become a standard lens on populism, democratic backsliding, and the visible concentration of power in tech and finance. The *empirical* Pareto — the power-law tail of income and wealth — is now permanent furniture in economics, carried by Piketty, Saez, and Jones, and makes \"the elite\" a measurable object rather than a rhetorical one. The *strong* version — a predictive, cyclical *science* of history, of which Peter Turchin's \"elite overproduction\" is the leading descendant — will remain contested through 2035, because it faces in 2026 the very objections (a slippery definition of \"elite,\" unfalsifiability, overclaiming) that retired classical elitism after 1945. And the *rhetorical* version — Burnham routed through Curtis Yarvin into \"the managerial elite\" and \"the Cathedral,\" now audible in the American administration — is the most visible and the least durable: it is citation-as-weapon, co-moving with a populist cycle that will eventually crest. The base rate for grand cyclical theories of history is unkind; the base rate for a flexible, structural sociology of power that flatters no one and explains a chaotic decade is much friendlier. So our central expectation is *continued, even rising relevance for the descriptive and empirical forms, persistent contestation for the strong form, and a politicized boom-and-partial-bust for the rhetorical form* — with the live risk that the weaponized version contaminates the serious one. The forecast that matters is therefore conditional: elite theory's scholarly health over the next decade depends less on new evidence than on whether its respectable wing can quarantine itself from its partisan wing.\n\n---\n\n## The Three-Layer Setup\n\nA forecast is only as good as the thing it forecasts, and \"elite theory\" is four things wearing one name. The corpus has separated them throughout; the forecast inherits the separation as its scaffolding.\n\n1. **Descriptive / structural elite theory** — the claim that organized minorities rule, that elites circulate and close, and (in its democratic-elitist form) that competitive, plural elites, not literal popular sovereignty, are what actually protects liberty. This is the chastened, testable wing: Schumpeter's competitive elitism, Mills's institutional *Power Elite*, Higley and Burton's *elite-settlement* research, and Hugo Drochon's 2026 recovery of Mosca, Pareto, and Michels as distinct serious thinkers ([08](08_Comparisons_Legacy_And_Revival.md), §§2.2, 2.7, 3.1). Its health is **strong and rising**.\n\n2. **Empirical \"Pareto\" (the inequality tail)** — the power-law distribution of top incomes and wealth, revived since the early 2000s by Piketty, Saez, and Charles Jones's *Pareto and Piketty* ([08](08_Comparisons_Legacy_And_Revival.md), §3.5; [02](02_The_Economist.md), §§X–XI). This is a fully legitimate scientific revival and the most empirically grounded driver of the whole field, because it makes elite concentration *quantifiable*. Its health is **robust and politically load-bearing**.\n\n3. **The strong cyclical / predictive form** — elite theory as a *science of history* with forecasting power. Turchin's cliodynamics and \"elite overproduction\" are the quantitative descendant of Pareto's circulation-and-closure and his §2044 note on the \"intellectual proletariat\" ([05](05_Elite_Theory_And_The_Circulation_Of_Elites.md), §3.3; [08](08_Comparisons_Legacy_And_Revival.md), §§3.2–3.3). Its health is **genuine but disputed** — the part of the field most likely to be judged, by 2035, either to have matured or to have overreached.\n\n4. **The rhetorical / partisan form** — Burnham's *Machiavellians* and *Managerial Revolution* routed through the dissident right (Yarvin's \"Cathedral,\" the \"managerial elite,\" \"the longhouse\"), now migrated into mainstream Republican discourse ([07](07_Burnham_And_The_Machiavellians.md), §7; [08](08_Comparisons_Legacy_And_Revival.md), §3.4). Its health is **high in salience, low in durability, and corrosive to the others by association**.\n\nAnyone who forecasts \"elite theory\" as a single thing will be wrong about at least one of these four. The interesting uncertainty lives in how they interact.\n\n---\n\n## Drivers and Counter-Forces\n\nThe comparisons workstream did the mechanism work; the forecast lifts it ([08](08_Comparisons_Legacy_And_Revival.md), §4). The drivers are concrete, and so are the brakes.\n\n**Pushing the revival forward.** First and strongest, *rising top-end inequality, legible as a literal Pareto tail*: the Piketty–Saez–Jones research program turned \"the elite\" into a measurable, undeniable object, and a literally Pareto-shaped distribution lowers the cost of every elite-theoretic argument by handing it data. Second, *credential inflation feeding an elite-aspirant surplus* — more law degrees, MBAs, and PhDs than elite positions to hold them — which is Turchin's overproduction engine and Pareto's blocked circulation; the *mechanism* holds even where the strong numerical claim is disputed. Third, *populist anti-elite politics*, the proximate cause of the current wave: the electoral ascendance of anti-establishment movements across the US, Italy, Argentina, and the Netherlands creates demand for a vocabulary of elite-versus-counter-elite, and the populists adopt the framing themselves. Fourth, *the legibility of power concentration in tech and finance* — a few platforms, a few founders, openly political — which makes the small-organized-minority story intuitively plausible and supplies a concrete elite to point at. Fifth, *the intellectual fashion cycle*: the exhaustion of naive pluralism and of the \"populism\" literature's definitional muddle opens a lane for a heterodox framework with a ready-made canon.\n\n**Holding it back.** First, *academic norms against cyclical, deterministic, \"great-man\" history*, which cap how far the strong, predictive version can penetrate the academy — the Turchin critiques are this norm in action. Second, *the empirical thinness of the strong cyclical claim*: the unfalsifiability-and-vagueness problem means the predictive version cannot be cleanly tested, which limits its respectability even as the descriptive version thrives. Third, *normative resistance to the anti-democratic implications*, sharpened by the theory's historic fascist associations ([06](06_Politics_Liberalism_And_Fascism.md); [08](08_Comparisons_Legacy_And_Revival.md), §2.8) and its present use to license openly anti-democratic schemes. Fourth — and most interesting — *discrediting by partisan weaponization*: as \"managerial elite\" and \"Cathedral\" harden into recognizable cudgels, serious analysts may avoid the vocabulary to escape contamination, so the rhetorical revival can actively crowd out the scholarly one.\n\nThe asymmetry to hold onto: the drivers act most powerfully on the *descriptive and empirical* forms, while the brakes bite hardest on the *strong and rhetorical* ones. That asymmetry is the spine of the scenarios.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast: trajectory of elite theory through ~2035 (scenario probabilities)<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">A · Mainstream normalizati…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"381.4\" y=\"8\" width=\"88.4\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"477.8\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">40–58%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">B · Politicized boom &amp; par…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"283.2\" y=\"44\" width=\"63.8\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"355.0\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">20–33%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">C · Cliodynamic breakthrou…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"219.4\" y=\"80\" width=\"54.0\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"281.4\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">7–18%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">D · Quiet fade / reabsorpt…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"214.5\" y=\"116\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"271.6\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">6–16%<\/text><\/svg><figcaption>Bars show calibrated probability ranges, not confidence intervals; central estimates A≈0.50, B≈0.27, C≈0.12, D≈0.11. Scenarios are competing trajectories for the field as a whole and are mutually exclusive. <span class=\"credit\">Source: This corpus, Future_Trajectory.md, drivers from doc 08 §4.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## The Scenarios\n\n### Scenario A — Mainstream normalization (central estimate ≈ 0.50; range 40–58%)\n\nThe most likely path is the quiet one. Through 2035 the *descriptive* elite theory becomes simply part of how educated people read politics — the default frame for populism, democratic backsliding, and concentrated power — while the *empirical* Pareto tail stays central to inequality economics. Drochon's *Elites and Democracy* and the elite-settlement program mark the respectable academic center of gravity; the inequality literature supplies the data; Turchin's strong cyclical claims remain a debated specialty rather than a consensus. The field's normative valence settles where Mosca and the democratic elitists left it: a realism about power that is *used to defend* competitive, pluralist institutions rather than to attack them. Pareto's own name remains attached most firmly to the distribution and to the lions-and-foxes vocabulary; his fatalism stays a museum piece.\n\n*Why it leads.* It requires no new evidence and no breakthrough — only the continuation of trends already in motion (inequality salience, populism, the fashion cycle) plus the academy's demonstrated capacity to absorb elite theory in chastened form, which it has done at least three times since 1945 (Schumpeter, Mills, Higley/Burton). It is the scenario of least resistance.\n\n*Drivers:* rising legible inequality; populist demand for the vocabulary; the academy's track record of domesticating the theory; the descriptive form's compatibility with mainstream method. *Signals it is unfolding:* elite-circulation and elite-settlement language appearing in non-specialist political science and serious journalism without scare-quotes; syllabi and handbooks treating \"elite theory\" as a standing subfield again; the inequality-economics \"Pareto\" and the political-sociology \"elite\" beginning to cite each other.\n\n### Scenario B — Politicized boom and partial bust (≈ 0.27; range 20–33%)\n\nThe rhetorical revival keeps climbing with the populist cycle — \"managerial elite,\" \"the Cathedral,\" and Burnham-via-Yarvin stay loud in and around the current US administration and its imitators abroad — and then crests and recedes as that cycle does, leaving the *term* \"elite theory\" partly contaminated. Serious scholars increasingly avoid the vocabulary to escape the partisan taint, much as the fascist association drove the school underground after 1945. The descriptive and empirical forms survive, but under other names (inequality economics, the sociology of power, configuration analysis), and the explicit \"elite theory\" banner becomes a marker of a political faction rather than a research program. This is the scenario in which weaponization wins the word and loses the science.\n\n*Why it is plausible.* It has a direct historical precedent — the fascism taint of Pareto and Michels did exactly this once before — and the mechanism (a recognizable cudgel repelling careful users) is already observable. *Drivers:* the durability and reach of the NRx-to-mainstream pipeline; the salience of tech/finance power; the reputational cost of association. *Signals:* scholars explicitly disavowing the label while keeping the concepts; \"elite theory\" appearing mainly in partisan outlets; the Burnham revival being treated as a political phenomenon to be explained rather than a body of theory to be used.\n\n### Scenario C — Cliodynamic breakthrough (≈ 0.12; range 7–18%)\n\nThe strong, predictive version matures rather than fades. Better data (Seshat and successors), a visible crisis that observers judge to have matched the structural-demographic forecasts, and methodological tightening give \"elite overproduction\" enough operational rigor to answer the vagueness-and-unfalsifiability charge. Cliodynamics earns a foothold as a quantitative historical social science, and Pareto's circulation-and-closure is vindicated not as metaphor but as mechanism. This is the scenario the strong program's advocates expect; it is also the one most exposed to the base rate against predictive theories of history.\n\n*Why it is a long shot.* The same objections that retired classical elitism — what counts as an \"elite,\" and whether the theory excludes anything — remain unanswered in 2026, and the critiques (Mounk, Parenti, Reeves) land on the definition, not the details. A \"science of history\" has been announced and disappointed many times. *Drivers:* data infrastructure; a legible crisis read as confirmation; a charismatic, productive research community. *Signals:* a *consensus* operational definition of \"elite\" gaining traction; pre-registered cliodynamic forecasts that are later judged correct by people who are not the forecasters; cliodynamics appearing in mainstream economics or political-science journals rather than its own.\n\n### Scenario D — Quiet fade / reabsorption (≈ 0.11; range 6–16%)\n\nThe populist wave ebbs, the fashion cycle moves on, and \"elite theory\" as a *named* framework recedes again — its durable insights quietly reabsorbed into inequality economics and political sociology without the banner, exactly as happened between roughly 1965 and 2000. Pareto keeps his distribution and his place in the history of economic thought; the elite theory becomes, once more, a chapter in the story rather than a live program. Note that even here the *content* survives; what fades is the label and the moment.\n\n*Why it could happen.* Much of the current revival is genuinely faddish and politics-coupled; if the politics cool, the fashion can cool with them, and the academy's appetite for grand frameworks is cyclical. *Drivers:* a receding populist cycle; paradigm fatigue; the migration of the useful parts into better-behaved literatures. *Signals:* falling citation and search interest in \"elite theory\" and \"circulation of elites\"; the inequality work proceeding without elite-theoretic framing; the Burnham revival fading from political discourse without a scholarly successor.\n\n---\n\n## Base Rates, and Why They Cut Both Ways\n\nForecasting a *theory's* fortunes is unusual, but two base rates discipline the guess. The first is brutal toward the strong form: **grand, cyclical, predictive theories of history have a poor survival record** — Spengler, Toynbee, and the various \"laws of history\" were celebrated and then discounted, and the unfalsifiability charge that sank them is precisely the one aimed at cliodynamics today. This is the empirical floor under Scenario C's low probability. The second base rate is kinder to the descriptive form: **a flexible structural sociology of power that explains a chaotic present and flatters no faction tends to persist**, because it earns its keep as a lens rather than as a prophecy — which is why the descriptive elite theory has come back, in chastened form, after every period of disrepute since 1945. The two base rates are why the forecast splits the difference *by layer* rather than issuing one verdict: the same evidence that makes the predictive science a long shot makes the descriptive frame a near-certainty to endure.\n\nA third, softer regularity belongs to reception history specifically. Pareto has been claimed by libertarians, the left, the authoritarian right, and the methodologists in turn, each finding the doctrine that suited them ([01](01_Life_And_Intellectual_Formation.md), §10). A *normatively empty realism about power* is, by construction, promiscuous — it furnishes itself with whatever values its user brings ([06](06_Politics_Liberalism_And_Fascism.md), §6). The best base-rate prediction about Pareto's *use* is therefore that it will continue to be claimed by whoever is currently losing a fight with an establishment — which means the rhetorical revival is less a fact about Pareto than a fact about the political weather.\n\n---\n\n## What Would Change This Forecast\n\nA calibrated forecast names the observations that would move it. The probabilities above should shift if:\n\n- **The respectable wing fails to quarantine itself.** If Drochon-style scholarship and the elite-settlement program start to be tarred with the Yarvin brush in serious venues, weight moves from A toward B.\n- **A consensus operationalization of \"elite\" emerges.** If anyone makes \"elite overproduction\" cleanly falsifiable and the field accepts it, weight moves sharply toward C — this is the single highest-leverage development to watch.\n- **Inequality compresses.** If top income and wealth shares fall materially (war, depression, a redistributive turn — the twentieth century showed the tail is *not* fixed; [02](02_The_Economist.md), §XI), the empirical driver weakens and weight drifts toward D.\n- **The populist cycle breaks decisively** in the major democracies, removing the proximate demand for elite-versus-counter-elite framing, which favors B's \"bust\" half and D.\n- **A visible crisis is widely read as confirming a published structural forecast.** That would be the strongest possible boost to C — and the most contestable, since \"the forecast came true\" is exactly the claim the unfalsifiability critique distrusts.\n\n---\n\n## The Honest Uncertainty\n\nTwo things should keep the confidence at \"medium,\" not \"high.\" First, the object is reflexive: forecasting elite theory's fortunes is itself an elite-theoretic act, subject to the same fashion and faction pressures it analyzes, and a corpus that finds elite theory \"back\" has a mild interest in finding it durable. Second, the decisive variable — whether the scholarly and partisan wings stay coupled or decouple — is a *sociology-of-knowledge* question about academic norms and political weather, not a question the corpus's evidence can settle. We can say with reasonable confidence that the descriptive frame and the empirical tail will persist and that the strong predictive science will stay contested. We cannot say whether, in 2035, \"elite theory\" will name a respected research program or a political slogan. On present trends it will, uncomfortably, name both.\n\n---\n\n## Open Questions\n\n1. **Decoupling.** Will the scholarly revival successfully separate itself from the rhetorical one, or will the shared vocabulary bind their fates? This is the hinge between Scenarios A and B and the corpus's single biggest forecasting uncertainty.\n2. **Falsifiability.** Can \"elite\" and \"elite overproduction\" be operationalized consistently enough to make the strong program a science rather than, in Mounk's phrase, \"astrology for politics nerds\"? ([08](08_Comparisons_Legacy_And_Revival.md), §3.3.)\n3. **Re-merger.** Will the inequality-economics \"Pareto\" and the political-sociology \"elite theory\" ever fuse — power-law concentration modeled *as* the engine of elite circulation — or keep running in separate literatures that merely share a name?\n4. **The populist clock.** How tightly is the rhetorical revival coupled to the current populist cycle, and what is that cycle's half-life? The answer largely sets the timing of Scenario B's bust.\n5. **Mosca's third way.** Does Mosca's juridical-liberal version — realism about elites married to a defense of constitutional checks — offer a usable middle path between cynical Paretan fatalism and naive pluralism, and is anyone building it? ([08](08_Comparisons_Legacy_And_Revival.md), §1.2.)\n\n---\n\n## Sources\n\nThis forecast is a synthesis of the verified corpus rather than a fresh research pass; its evidentiary base is the documents it cites, above all the driver analysis prepared as forecast substrate.\n\n1. [08_Comparisons_Legacy_And_Revival.md](08_Comparisons_Legacy_And_Revival.md), esp. §3 (the bifurcated revival) and §4 (mechanism-specific drivers and counter-forces). **The primary substrate for every scenario.** Internal corpus document, itself sourced to Drochon (*Elites and Democracy*, Princeton 2026), Turchin (*End Times*, 2023), Jones (*Pareto and Piketty*, NBER 2014 / *JEP* 2015), Higley & Burton, Mounk (*Persuasion*, 2024), Parenti (*Compact*, 2023), and the Burnham/NRx reception literature.\n2. [05_Elite_Theory_And_The_Circulation_Of_Elites.md](05_Elite_Theory_And_The_Circulation_Of_Elites.md), §§3.3, 9 — circulation/closure as the mechanism the strong revival operationalizes; the \"intellectual proletariat\" of §2044n as the ancestor of elite overproduction.\n3. [02_The_Economist.md](02_The_Economist.md), §§X–XII — the Pareto distribution, the non-constancy of α (the empirical refutation of fixed inequality), and the inequality-economics revival.\n4. [06_Politics_Liberalism_And_Fascism.md](06_Politics_Liberalism_And_Fascism.md), §§6–7 — the normatively empty realism and its promiscuous use; the contemporary stakes of the fascism question.\n5. [07_Burnham_And_The_Machiavellians.md](07_Burnham_And_The_Machiavellians.md), §7 and §6.4 — the Burnham→Yarvin rhetorical channel and the \"present-trends-continue\" prediction pathology Orwell diagnosed, a standing warning against over-confident forecasting in this tradition.\n6. [01_Life_And_Intellectual_Formation.md](01_Life_And_Intellectual_Formation.md), §10 — \"Pareto is a magnet for projection,\" the reception-history base rate behind the rhetorical revival.\n\n*Probabilities are the author's calibrated judgments derived from the cited drivers and base rates, offered as a distribution over plausible futures, not a prediction. They are explicitly held at medium confidence.*"}]}</script>
