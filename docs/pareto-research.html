tion: \"demagogic plutocracy\" as Pareto's description of the liberal state; speculators/rentiers; humanitarian rhetoric as instrument of elite consent.\n\n7. Vilfredo Pareto, *The Transformation of Democracy* (*Trasformazione della democrazia*, 1921), ed. Charles Powers, trans. Renata Girola (Transaction, 1984); summarized via publisher and secondary descriptions. https://www.routledge.com/The-Transformation-of-Democracy/Powers/p/book/9780878559497 — accessed 13 June 2026. **Tier 1** (Pareto's text) via **Tier 5** descriptions (not read in full here). Contribution: the plutocratic cycle; democracy → plutocracy thesis; the cyclical (self-overthrowing) structure of plutocratic rule.\n\n8. On Bobbio and the liberal/antifascist reception of elitism: search-synthesized from coverage of Norberto Bobbio's work (incl. *tandfonline.com*, \"Norberto Bobbio: a life for democracy,\" 2022) and standard reference. https://www.tandfonline.com/doi/full/10.1080/13569317.2022.2129211 — accessed 13 June 2026. **Tier 2–4**. Contribution: Bobbio's \"democracy as it is\" realist reading; elite theory's influence on Gobetti, Dorso, Burzio, Einaudi, Croce, Salvemini (liberal antifascists).\n\n9. Biographical chronology (death 19 August 1923, Céligny; senatorial nomination invalidated by Fiuman citizenship taken to pursue divorce; League of Nations arms-commission resignation), synthesized from Britannica, Encyclopædia Universalis, and Citizendium biographical entries. https://www.britannica.com/biography/Vilfredo-Pareto ; https://www.universalis.fr/encyclopedie/vilfredo-pareto/ — accessed 13 June 2026. **Tier 5** (reference works; the death date and the Fiuman-citizenship detail are corroborated across multiple). Contribution: precise death date and the senatorship technicality.\n\n10. Search-corroborated historical consensus that Mussolini's claim to have attended Pareto's 1903–04 Lausanne lectures is unsupported by evidence (multiple independent attestations via WebSearch synthesis). — accessed 13 June 2026. **Tier 2–5** (consensus of secondary sources). Contribution: the pupil legend as fabrication.\n\n11. Renato Cirillo, \"Was Vilfredo Pareto Really a 'Precursor' of Fascism?\", *The American Journal of Economics and Sociology*, 42(2), 1983, pp. 235–246. https://onlinelibrary.wiley.com/doi/abs/10.1111/j.1536-7150.1983.tb01708.x (abstract/secondary summary; full text paywalled — **not read in full**). **Tier 2** (peer-reviewed). Contribution: the thesis that Pareto \"remained a radical libertarian till the end,\" kept \"serious reservations about fascism,\" and would likely \"have revolted against fascism.\"\n\n12. Joseph V. Femia, *Pareto and Political Theory* (Routledge Studies in Social and Political Thought, 2006). https://www.routledge.com/Pareto-and-Political-Theory/Femia/p/book/9780415663717 — accessed 13 June 2026. **Tier 2** (university-press-tier monograph; described via publisher and reviews, not read in full). Contribution: the \"sceptical liberalism\" relocation; the refutation of the proto-fascist charge; the \"liberal potential\" in Pareto's realism.\n\n13. James Burnham, *The Machiavellians: Defenders of Freedom* (John Day, 1943); summarized via reviews and reference (Kirk Center; Mattick 1943; reference summaries). https://kirkcenter.org/reviews/only-power-restrains-power/ — accessed 13 June 2026. **Tier 1** (Burnham's text) via **Tier 5–6** descriptions. Contribution: Burnham's reading of Pareto (logical/non-logical action, residues/derivations, circulation, the \"defense of freedom\" via diffused elite power) and its selectivity. Treated in depth in Chapter 07.\n\n14. On the contemporary revival (Burnham → Yarvin/neoreaction; Turchin's elite overproduction): The Conversation, \"An antidemocratic philosophy called 'neoreaction'…,\" 2022 (https://theconversation.com/an-antidemocratic-philosophy-called-neoreaction-is-creeping-into-gop-politics-182581); and coverage of Peter Turchin's cliodynamics. — accessed 13 June 2026. **Tier 4–5** (Turchin) and **Tier 5–6** (neoreaction coverage; flag as reception/position evidence). Contribution: the live stakes — Pareto/Burnham as a usable resource for a contemporary authoritarian-curious right and for crisis forecasting. Developed fully in Chapter 08 and the forecast.\n\n15. Italian primary-text apparatus (cited *through* Barbieri [4] and Busino's collected editions, not read in original here): Pareto, *Lettere a Maffeo Pantaleoni 1890–1923* (ed. De Rosa); *Scritti politici* and *Scritti sociologici minori* (ed. Busino, Utet); *Vilfredo Pareto dal carteggio con Carlo Placci* (ed. Giacalone-Monaco, Cedam). **Tier 1** (primary; not directly consulted — flagged below). Contribution: the original letters and articles from which the verbatim quotations derive."}, {"order": 7, "file": "07_Burnham_And_The_Machiavellians.md", "title": "Burnham and the Machiavellians: Reconstructing — and Going Beyond — His Use of Pareto", "summary": "", "body": "# Burnham and the Machiavellians: Reconstructing — and Going Beyond — His Use of Pareto\n\n## Bottom Line\n\nNo single book did more to deliver Vilfredo Pareto to an English-reading political audience than James Burnham's *The Machiavellians: Defenders of Freedom* (1943). Burnham built a synthetic \"Machiavellian tradition\" — Machiavelli as fountainhead; Mosca, Sorel, Michels, and Pareto as the moderns — united by one method: study politics as it *is*, not as moralists wish it to be. From Pareto he took the split between the **formal** meaning of political speech (the derivations, the myths, the \"formula\") and its **real** meaning (the drive for power and the interests of an elite); the contrast between **logical** and **non-logical** conduct; the **circulation of elites**; and the **lion/fox** dynamic. He fused these into a few hard propositions — no society is ruled by the majority, all are ruled by an organized minority, so the only live question is whether the elite is open and checked. Then he sprang his paradox: this cold realism is offered as a *defense of freedom*, because liberty survives only where rival elites and a real opposition restrain power — \"only power restrains power\" — never through the myth of popular sovereignty. The book is the political-theory bookend to his bestseller *The Managerial Revolution* (1941), whose claim that a new managerial elite was inheriting power across the U.S., USSR, and Nazi Germany the Machiavellian framework underwrites. The sharpest contemporary critique came from George Orwell, who diagnosed Burnham's \"power worship\" and his habit of mistaking whoever is winning at the moment for the permanent victor. Burnham went on to co-found *National Review*, theorize Cold War \"liberation,\" and receive the Presidential Medal of Freedom from Reagan in 1983. **Beyond Burnham:** a careful 2026 reading should keep his recovery of the formal/real distinction and the circulation concept, but flag five departures — he largely ignored Pareto the economist, sidestepped the fascism problem, read Pareto selectively to serve an anti-Stalinist, anti-utopian argument, hardened Pareto's probabilistic, equilibrium-minded sociology into something closer to an iron law, and fused Pareto with Mosca and Michels in ways that blur real and important differences among the three.\n\n---\n\n## 1. The Book's Project: Constructing a \"Machiavellian Tradition\"\n\n### 1.1 What Burnham was trying to do\n\n*The Machiavellians: Defenders of Freedom* (John Day Co., 1943) is intellectual portraiture in service of a thesis. Burnham takes five thinkers — Niccolò Machiavelli and four moderns, Gaetano Mosca, Georges Sorel, Robert Michels, and Vilfredo Pareto — and argues that, despite very different idioms, they constitute a single tradition: the only thinkers who have produced, or pointed toward, a genuine *science of politics* [1][2][3]. What unites them is a method, not a doctrine. The Machiavellians study politics empirically, as a domain of facts about how power is won, held, and lost; they refuse to confuse the description of politics with prescriptions about how it ought to run; and they treat the moralizing, universalist language of politics as data to be explained rather than arguments to be answered [1][3][4].\n\nThe book's organization mirrors the thesis. It opens not with Machiavelli but with **Dante**, used as a foil — the anti-Machiavellian, the political writer whose words must be decoded — then proceeds through Machiavelli himself, Mosca, Sorel, Michels, and Pareto, before a concluding synthesis [3][4][5]. Each modern recovers, formalizes, or extends an insight latent in Machiavelli. The cumulative effect is to manufacture a canon. By 1943, \"elite theory\" or \"the Italian school\" was a loose and largely untranslated body of continental social science; Burnham's book, more than any other Anglophone work, fused it into a recognizable \"Machiavellian tradition\" with a shared method and a shared enemy — the moralist, the utopian, the believer in literal popular self-government [2][6].\n\n### 1.2 The formal and the real meaning of political speech\n\nThe engine of the whole book arrives in the opening chapters through Dante and is, in Burnham's telling, Pareto's discovery generalized. Burnham distinguishes the **formal meaning** of a political utterance — its explicit, surface, logical content — from its **real meaning**, the underlying drive, interest, or social force the utterance actually expresses and serves [4][5]. His set-piece example is Dante's *De Monarchia*. Its formal meaning is a high metaphysical argument for a universal world-state under the Holy Roman Empire; its real meaning, recoverable only after a history of the Guelph–Ghibelline conflict, is a propagandistic plea on behalf of a faction of Florentine exiles — Dante among them — who wanted the Emperor to restore them to power in Florence [5]. To make the point contemporary and bipartisan rather than antiquarian, Burnham pairs Dante with the 1932 Democratic Party platform — pledges of spending cuts and balanced budgets — set against what Roosevelt actually did [4][5].\n\nBurnham's own formulation: it is \"characteristic of *De Monarchia*, and of all similar treatises, that there should be this divorce between formal and real meanings, that the formal meaning should not explicitly state but only indirectly express, and to one or another extent hide and distort, the real meaning. The real meaning is thereby rendered irresponsible, since it is not subject to open and deliberate intellectual control; but the real meaning is nonetheless there\" [5]. He sharpens it into an epigram about how political debate feels from the inside: \"We think we are debating universal peace, salvation, a unified world government … when what is really at issue is whether the Florentine Republic is to be run by its own citizens\" [4].\n\nThis is, in substance, Pareto's distinction between **derivations** (the verbal, theoretical, ideological superstructure people erect to justify their conduct) and **residues** (the relatively constant sentiments and drives underneath) — transposed from Pareto's sociology of belief onto the reading of any political text. Burnham makes the formal/real cut the master key of the book and credits the Machiavellians collectively with forging it. The science of politics, for Burnham, just *is* the disciplined practice of reading the real meaning out from under the formal one [3][4].\n\n---\n\n## 2. Reconstructing Burnham's Pareto Chapter\n\nBurnham gives Pareto the largest and most technical of the modern portraits, distilling the four-volume *Trattato di sociologia generale* (English: *The Mind and Society*, 1935) into a compact apparatus. This is the chapter where his general method acquires its sociological machinery.\n\n### 2.1 Logical versus non-logical conduct\n\nBurnham foregrounds Pareto's foundational distinction between **logical** and **non-logical** action. Logical action, in Pareto's restricted sense, is conduct in which the means are objectively and subjectively appropriate to the end — where the actor's mental picture of what he is doing matches what he is actually accomplishing, judged by the standard of logico-experimental knowledge [6][7]. Non-logical action is everything else: not *illogical* (Burnham is careful here), but action whose real springs lie in sentiment and instinct rather than in valid reasoning from evidence to goal. Burnham presses the radical scope of the claim — for Pareto the *great bulk* of human social behavior, political behavior emphatically included, is non-logical, even though human beings compulsively dress it up in logical-seeming justifications afterward [6][7]. As one close reading of the chapter puts it, the rule Burnham draws is: \"Where there is a disparity between the 'formal' goal and the 'real' goal of an action, then the action is non-logical\" [7]. This is the formal/real distinction again — now grounded in a theory of mind.\n\n### 2.2 Residues and derivations\n\nOn this base Burnham builds Pareto's pair of analytic categories. **Residues** are the relatively constant elements in social behavior — the manifestations of underlying sentiments and instincts that persist across time and place. **Derivations** are the variable elements — the \"work of the mind in accounting for\" the residues, the rationalizations, ideologies, theories, and myths through which people explain why they do what the residues drive them to do [7][8]. Burnham emphasizes the crucial asymmetry: residues are comparatively stable and *causally* important; derivations shift constantly and are causally *trivial* with respect to the underlying sentiment, even though they dominate the surface of intellectual and political life. As Mattick's hostile 1943 summary accurately renders Burnham's reading, for Pareto \"residues determine history while derivations merely deceive\" [9]. Burnham seizes on this because it licenses the whole project: if derivations are epiphenomenal, the analyst's job is to ignore what political actors *say* and reconstruct the residues and interests they actually serve.\n\nBurnham stays with the usable layer of Pareto's taxonomy and spares the reader all six classes of residues and four classes of derivations in their full forbidding detail. He concentrates on the two residue-classes that drive his political argument: **Class I, the \"instinct for combinations\"** (innovation, recombination, speculation, the appetite for novelty and manipulation) and **Class II, \"the persistence of aggregates\"** (conservation, loyalty, the durability of established bonds, the willingness to use force to defend the group) [7][8]. These two become his foxes and his lions.\n\n### 2.3 The circulation of elites — Burnham's center of gravity\n\nThe heaviest emphasis in Burnham's Pareto chapter, and arguably in the book, falls on the **circulation of elites**. Burnham presents Pareto's \"elite\" in the descriptive sense — those who score highest in any given activity — and then the politically decisive **governing elite**: the minority that in fact holds and exercises power, as against the governed mass [3][6][8]. Pareto's claim, which Burnham makes load-bearing, is that elites are not static. A healthy society continuously **circulates** new, able individuals up from the mass into the governing minority and lets the decadent fall out of it. A closed elite that stops recruiting talent and stops shedding its incompetents accumulates two things at once: an ossified ruling group, and a reservoir of capable, frustrated people shut out of power — the raw material of revolution [3][8]. \"A relatively free circulation of elites is a prerequisite for a healthy society; otherwise society is threatened either with revolution or destruction from outside,\" as one summary of Burnham's reading puts it [1]. Orwell, no friend of the book, captured the point exactly: Burnham \"lays much stress on Pareto's theory of the 'circulation of the élites,' arguing that if a ruling class is to stay in power it must constantly admit suitable recruits from below, so that the ablest men may always be at the top\" [10].\n\n### 2.4 Lions and foxes\n\nBurnham dramatizes the dynamics of circulation through Pareto's Machiavelli-derived imagery of **lions and foxes**, mapping it onto the residue-classes. **Foxes** are the Class I people — they live by their wits, by combination, fraud, persuasion, maneuver, ideological innovation; they are flexible, ready for change, comfortable with novelty, weak on the use of force [7][11]. **Lions** are the Class II people — they rely on force, solidarity, hierarchy, faith, and tradition; they are conservative, loyal, willing to coerce and to die, but rigid and credulous about the schemes of the foxes [7][11]. Burnham reads political history through this lens as a cycle. A regime founded and held by lions tends, over time, to be infiltrated and then dominated by foxes, who govern by manipulation, credit, and ideology rather than force. The foxes hollow out the will to coercion until the regime can no longer defend itself. Then force re-enters history from outside or below, and a new generation of lions either renews the elite or replaces it [3][7][8]. The instability is built in: each type lacks the strength of the other, so equilibrium never holds and the cycle recurs.\n\n### 2.5 The hard propositions Burnham extracts\n\nOut of Pareto, reinforced by Mosca and Michels, Burnham draws a small set of propositions he presents as the *scientific* findings of the tradition. In the concluding chapters they crystallize into roughly these [12][13]:\n\n1. **Politics is the study of the struggle for social power** — its real subject is who holds power and how, not the ideals invoked.\n2. **All societies are ruled by an organized minority.** \"No societies are governed by the people, by a majority; all societies, including societies called democratic, are ruled by a minority\" [12]. Government *by* the majority is, on the evidence, impossible; the choice is never minority rule versus majority rule but only *which* minority and *on what terms*.\n3. **The primary aim of every elite is to keep its power and privilege.**\n4. **The real, scientific study of politics attends to elite behavior**, decoding formal meanings into real ones.\n5. **An objective science of politics is possible**, independent of the analyst's ideology and moral preferences.\n\nBecause majority self-rule is ruled out as a fact of social structure, only one political question remains: the quality and openness of the ruling minority — whether it circulates, whether it is checked.\n\n---\n\n## 3. The Central Paradox: Elite Realism as a *Defense of Freedom*\n\nThe book's subtitle is not ironic. Burnham's wager is that the *most* clear-eyed realism about elites is the surest *defense of freedom* — and that the sentimental democratic theory it demolishes is freedom's real enemy, because it blinds people to where threats to liberty come from.\n\nThe argument runs like this. If no society can be ruled by the majority, then \"self-government\" in the literal sense is a **myth** — a derivation, a political \"formula\" (Mosca's term, which Burnham folds in) that every ruling minority uses to legitimate itself [3][6][12]. Believing the myth literally disarms the public: it teaches people to look for tyranny in the wrong place, in formal violations of the popular-sovereignty creed, and to miss it in the right place, in the unchecked concentration of real power. Liberty, on Burnham's account, is not produced by good intentions, moral exhortation, constitutions on paper, or the people's supposed control of their rulers. It comes from **the division of power among rival elites and the existence of a genuine opposition** able to resist the chief power. Hence the book's most quoted line, which Burnham presents as the bedrock political fact: \"No theory, no promises, no morality, no amount of good will, no religion will restrain power. Only power restrains power\" [13]. And: \"Liberty is preserved by those who are against the existing chief power\" [12][13]. An opposition that expresses no real social force is, in his image, as harmless to entrenched power as a court jester [13].\n\nSo the paradox resolves into a claim about social mechanism. Freedom is an *equilibrium effect* of competing elites, not a moral achievement or a popular possession. A society stays free not because its rulers are virtuous or because the people rule, but because power is *split* — because there are rival minorities, a press not wholly captured, oppositions with teeth, courts and institutions that embody competing forces. Burnham's realism, on this reading, is pro-liberty precisely because it locates the only durable guarantor of liberty, the pluralism of power, and strips away the comforting illusion — the literal sovereignty of the people — that lets liberty be lost while everyone celebrates the formula [3][12][13]. This is the seed of what later scholars would call **democratic elitism**: the move, made \"in the hands of James Burnham and others,\" by which the classical elite theorists' cynical descriptions of inescapable minority rule are turned into a defense of competitive, pluralist, representative government [6].\n\nThe tension critics seized on, and that Burnham never fully closes, is this: if morality is irrelevant to politics and only power restrains power, what *internal* reason does the analyst have to prefer the free, checked elite over the closed, tyrannical one? Burnham's answer is prudential and consequentialist — open, circulating, checked elites are more stable, less prone to catastrophic revolution, and happen to preserve the liberty he values — but it is not, and on his own premises cannot be, a *moral* answer. The Kirk Center reviewer flags the gap directly: if moral principle is irrelevant to the framework, it is unclear *how* recognizing the centrality of power reliably yields limited government [13]. That worry is the hinge Orwell and the left both pushed on.\n\n---\n\n## 4. *The Managerial Revolution* (1941): The Frame Pareto Underwrites\n\n*The Machiavellians* is the political-theory companion to the book that made Burnham famous two years earlier. *The Managerial Revolution: What Is Happening in the World* (John Day, 1941) argues that capitalism is not permanent and is not being replaced by socialism. A third thing is arising instead — a **managerial society**, ruled by a new class of **managers** [14][15][16].\n\n### 4.1 The thesis\n\nThe managers are neither the capitalists (the legal owners, the shareholders, the financiers) nor the proletariat. They are the people who exercise *operational and technical control* over the actual instruments of production and administration — the executives, engineers, plant superintendents, planners, administrators, and bureaucrats who run the great corporations and the great state apparatuses [14][16]. Burnham's pivot is the **separation of ownership from control**: in the modern large enterprise, legal ownership has become dispersed and passive, while real control has migrated to the managerial stratum. \"Ownership means control,\" Burnham argues, so as control passes to the managers, effective ownership — and class power — passes with it, even though formal property titles still rest with shareholders [16]. The managers consolidate not chiefly through private property but through their control of the state, which fuses with the economy. They exploit society as a corporate body and reproduce themselves by controlling recruitment, privilege, and \"command of educational facilities\" [16].\n\n### 4.2 The convergence claim\n\nBurnham's most arresting move, and the one that most exposed him to refutation, was the **convergence** thesis: he read Soviet central planning, German and Italian fascism, and the American New Deal as three regional variants of one underlying managerial transformation [14][15][16]. The ideologies differed wildly; the deep structure was, he claimed, the same everywhere — the rise of the managerial elite, the absorption of the economy by an administrative state, the eclipse of the bourgeois owner and the parliamentary legislature. The framing drew on the earlier work of Bruno Rizzi, whose *La Bureaucratisation du monde* identified the Soviet, fascist, and New Deal regimes as a single bureaucratic-collectivist type — a debt Burnham acknowledged thinly [15].\n\n### 4.3 How Pareto underwrites it\n\nThe two books interlock. *The Managerial Revolution* supplies the **economic-historical** content — *which* elite is rising and *how* — while *The Machiavellians* supplies the **political-theoretical** license: the general law that every society is ruled by a minority, that the real story is always elite succession, and that ideologies (capitalist, socialist, fascist, democratic alike) are derivations masking the underlying transfer of power [3][17]. Pareto's framework lets Burnham treat the managerial revolution not as one contingent development but as an instance of an iron sociological regularity — the circulation and replacement of elites, observed in real time. Read together, they form a single model: managerialism as a new ruling elite, intelligible through Machiavellian realism rather than Marxist inevitability or liberal-democratic self-flattery [17]. Julius Krein, writing the major Trump-era reassessment in *American Affairs* (a national-conservative journal, lean noted), frames it just this way: *The Machiavellians* marks Burnham's move from Marxism to elite theory, and that frame becomes \"foundational to Burnham's managerialism thesis\" [17].\n\n---\n\n## 5. Reception\n\n### 5.1 Orwell's \"Second Thoughts on James Burnham\" (1946)\n\nThe most influential critique came from George Orwell, in an essay first published in the British magazine *Polemic* in May 1946 and reissued as a pamphlet, *James Burnham and the Managerial Revolution* [10][18]. Orwell's verdict is double-edged. He concedes that Burnham is \"a man of much more than average ability\" and that the general drift of modern society has \"almost certainly been towards oligarchy\" and toward \"an increasing concentration of industrial and financial power\" [10]. But he indicts the cast of mind behind the predictions.\n\nOrwell's central charge is **power worship**. \"Power worship blurs political judgement because it leads, almost unavoidably, to the belief that present trends will continue. Whoever is winning at the moment will always seem to be invincible\" [10]. He drives it home with a catalogue of Burnham's serially falsified forecasts, each one extrapolating the momentary winner into the permanent victor: \"If the Japanese have conquered south Asia, then they will keep south Asia for ever; if the Germans have captured Tobruk, they will infallibly capture Cairo; if the Russians are in Berlin, it will not be long before they are in London; and so on\" [10]. Burnham had at various points, Orwell notes, predicted German victory and Britain \"dissolving,\" treated the Nazi conquest of Europe as irreversible, expected the USSR to crack apart into eastern and western halves, and judged that Germany would not attack the Soviet Union until Britain was beaten — \"at each point Burnham is predicting a continuation of the thing that is happening\" [10]. Orwell's deeper claim is that Burnham's vaunted \"realism\" is the opposite of realism: wish-thinking dressed as objectivity, which \"damage[s] … the sense of reality\" by the very cultivation of what is called realism [10]. He notes too, with disquiet, that Burnham's sympathies seemed to follow the strong horse — drawn to Germany while Germany was winning, to the USSR after — the emotional tell of power worship [10]. On the Machiavellian theory itself, Orwell summarizes Burnham's thesis as the reduction of politics to nothing but the struggle for power, with \"all talk about democracy, liberty, equality, fraternity\" treated as \"humbug\" covering the ambitions of a rising class [10]. The essay's afterlife is large. George Kateb and others have argued it belongs to the intellectual matrix of *Nineteen Eighty-Four*, whose \"managerial\" oligarchs, perpetual war, and naked power-for-power's-sake read as a dystopian extrapolation of Burnham's premises [18].\n\n### 5.2 The contemporaneous left\n\nAmong Burnham's former comrades the reception was scathing. Paul Mattick's 1943 review (council-communist, Tier 6 — evidence of a position) accepts Burnham's *summary* of Pareto as accurate but turns the whole edifice into an indictment. Burnham's \"science,\" Mattick argues, merely restates \"the long-known difference between reality and ideology\" while smuggling in the acceptance of permanent class hierarchy as natural and inevitable, and it makes *success* the criterion of rational conduct, so that whoever holds power is thereby \"scientific\" [9]. Mattick presses hardest on the defense-of-freedom paradox. Burnham concedes that the Machiavellian must serve whatever the \"broad pattern\" of the age requires, so \"if these 'broad pattern' [changes] change a liberal into a fascist society, a Machiavellian must also change from a defender to a destroyer of 'freedom'\" — exposing \"liberty,\" in Mattick's reading, as mere tactical positioning for elites rather than a principle [9]. The charge that Burnham's realism is a sophisticated apology for whoever rules recurs across the left reception and prefigures Orwell.\n\n### 5.3 Burnham's later trajectory\n\nBurnham's biography is itself a circulation-of-elites story. He began on the far left: through the 1930s he was a leading American Trotskyist intellectual, prominent in the Socialist Workers Party [19][20]. In early 1940, after the Nazi–Soviet pact and the Soviet invasions of Poland, Finland, and the Baltics, he and Max Shachtman broke with the SWP majority over the \"Russian question,\" and Burnham broke at the same time with **dialectical materialism** itself — his February 1940 essay \"Science and Style: A Reply to Comrade Trotsky\" rejected the dialectic in favor of modern logic and the unity-of-science movement. He resigned, helped launch the Workers Party, then left organized Marxism entirely [20]. From there his arc runs rightward and upward. *The Managerial Revolution* (1941) made him a public intellectual; in 1955 he became a founding senior editor of William F. Buckley Jr.'s *National Review*, where his long-running column shaped a generation of conservative thinking on foreign policy [19][21]. He became the leading theorist of an offensive Cold War strategy he called **\"liberation\"** (others called it \"rollback\"), counterposed to George Kennan's containment, in a trilogy beginning with *The Struggle for the World* (1947) [19][21][22]. He had ties to U.S. intelligence circles and the cultural Cold War. On **February 23, 1983**, President Ronald Reagan awarded him the **Presidential Medal of Freedom**, crediting him with having \"profoundly affected the way America views itself and the world\" and saying \"I owe him a personal debt, because throughout the years … I have quoted you widely\" [22]. Burnham died in 1987. Commentators across the spectrum credit him as an intellectual godfather of the Reagan Doctrine [21][22].\n\n---\n\n## 6. Beyond Burnham: What He Flattened, Downplayed, and Instrumentalized\n\nThis is the workstream's explicit mandate. Burnham's book is a genuine achievement of transmission and synthesis — but a careful reading has to mark, precisely, where Burnham's Pareto departs from Pareto's, and why. Five charges, each weighed.\n\n### 6.1 He largely ignored Pareto the economist\n\nBurnham reads Pareto almost entirely through the *Trattato* — the sociology — and lets the economist vanish. *The Machiavellians* says essentially nothing about the *Cours d'économie politique* (1896–97), the *Manuale* (1906), ordinal utility and indifference curves, **Pareto optimality**, or the **Pareto distribution** of income — the contributions on which Pareto's twentieth-century reputation among economists actually rests. This is a real loss, not a mere omission of scope. Pareto's economics and his sociology are *connected*: it was precisely the discovery that economic theory could model only *logical* action — the rational allocation of scarce means — that drove Pareto to invent a sociology of the *non-logical* residue that economics brackets out [6][7]. Cut the economics and you lose the intellectual motive for the sociology, and you lose Pareto's own sense of the *limits* of his elite theory. For him it was the analysis of the messy remainder the elegant equilibrium economics could not reach, not a master science of everything. Burnham, needing a usable political theory, takes the remainder and discards the original system it was the remainder *of*. A 2026 reading should restore the economist-to-sociologist arc, because it reframes the elite theory as one (avowedly cruder) tool among Pareto's instruments rather than his deepest word on society.\n\n### 6.2 He downplayed and sidestepped the fascism problem\n\nBurnham presents Pareto cleanly as a value-neutral scientist of power and a tacit ally of freedom, and quietly walks past the most contested fact of Pareto's life: that Mussolini's regime claimed him. The historical record is genuinely tangled, and Burnham's tidy version flattens it. Pareto died at Céligny on **August 19, 1923**, less than a year into the fascist era [23][24]. In late 1922 / 1923 the new regime conferred on him the title of **Senator of the Kingdom of Italy** and named him a delegate to the Geneva disarmament conference. He declined the Geneva role, and his senatorship was, by some accounts, never validated because he had taken Fiuman citizenship to pursue a divorce. In any case he never sat — he remarked, in his sardonic way, that \"at my age and in my state of health, I can work by staying in Céligny: I could not come to Rome\" [23][24]. His last articles expressed a guarded sympathy for fascism *while explicitly warning it to preserve liberty, freedom of the press, and not to make itself permanent or destroy the institutions of liberty* [23][24]. This is exactly the ambiguity that should be foregrounded. By presenting a sanitized Pareto, Burnham neither defends him against the \"Marx of Fascism\" charge nor reckons with why the charge was made. The scholarly debate is live and two-sided. The older, hostile reading (e.g., the \"Karl Marx of Fascism\" epithet circulating in the 1930s) holds that Pareto's debunking of democracy and humanitarianism, and his late warmth toward Mussolini, make him at minimum a fellow-traveler. The revisionist reading, most fully argued by **Joseph Femia** in *Pareto and Political Theory* (2006), refutes the proto-fascist charge and relocates Pareto in a \"Machiavellian tradition of **sceptical liberalism**,\" noting that he disapproved of universal suffrage but praised the direct democracy of small Swiss cantons and treated individual liberty as paramount [25][26]. Burnham's silence is not neutral. By skipping the fascism problem entirely, he forecloses the one debate that most tests whether elite realism is a \"defense of freedom\" or a solvent of it.\n\n### 6.3 He read Pareto selectively to serve an anti-Stalinist, anti-utopian Cold War argument\n\nBurnham's Pareto is a Pareto built for a purpose. Writing in 1943 as an ex-Trotskyist who had just broken with Marxism, Burnham needed a theory that could (a) explain why the socialist utopia had produced Stalinism rather than emancipation, (b) discredit utopian and \"humanitarian\" politics in general as derivation-masked drives for power, and (c) preserve a defense of Western liberty without resting it on the democratic myths he now scorned. Pareto's apparatus does all three. The circulation of elites explains the Soviet outcome (one elite replaced another; the \"classless society\" was a derivation); the residues/derivations machinery debunks every emancipatory ideology in advance; and democratic elitism rescues liberty as the by-product of competing elites. The point is not that this is illegitimate — selective use of a thinker is the normal currency of intellectual history — but that the resulting \"Pareto\" is shaped by Burnham's polemical needs as much as by Pareto's text. The *anti-utopian* edge in particular is Burnham's emphasis. Pareto was anti-utopian, but his sociology was also a general theory of *all* belief, liberal and scientistic belief included. Burnham keeps the blade pointed at the left and at \"humanitarianism\" and lets it rest before it cuts toward his own commitments.\n\n### 6.4 He hardened Pareto's probabilistic, equilibrium-minded sociology into an iron law\n\nThis is the deepest distortion. Pareto, trained as an engineer and a mathematical economist, conceived society as a **system in moving equilibrium**, governed by *tendencies*, *forces*, and *oscillations* rather than by deterministic laws — the social analog of mechanical equilibrium, with residues and derivations as interacting variables whose balance shifts and restores itself probabilistically over cycles [6][7]. The circulation of elites and the lion/fox oscillation are, in Pareto, statements about *recurrent tendencies* and the conditions of *equilibrium* — hedged and undulating, not categorical predictions. Burnham, needing hard propositions a political reader can wield, recasts these tendencies as near-laws: *all* societies are ruled by a minority; majority rule is *impossible*; elite circulation *must* occur or revolution *will* follow. The probabilistic, system-in-flux quality of Pareto's thought is squeezed into something closer to Michels's \"**iron law of oligarchy**\" — precisely the over-determinism Orwell's \"present trends will continue\" critique skewers at the level of method [10]. The irony is sharp: Burnham flattens Pareto's hedged equilibrium sociology into iron certainty, then makes iron-certain forecasts that fail. Femia's sympathetic-but-critical reading insists on restoring the probabilistic, equilibrium-minded, *sceptical* Pareto — including a scepticism toward one's *own* beliefs that is the cultural precondition of a politics of compromise — exactly the register Burnham's hardening drains away [25][26].\n\n### 6.5 He fused Pareto with Mosca and Michels in ways that blur real differences\n\nThe \"Machiavellian tradition\" is partly Burnham's construction, and the fusion costs precision. The three Italians were not one school:\n\n- **Mosca** worked with the *political class* / *ruling class* and the *political formula* (the legitimating belief a ruling class propagates), and built his analysis on organization and the structure of social forces. He bitterly resented being merged with Pareto and waged a long **priority dispute**, insisting he had reached the ruling-class idea first and independently; late in life he was also more genuinely constitutional-liberal and more critical of the regime than Pareto [6][27]. Burnham takes his \"formula\" from Mosca and his \"derivation\" from Pareto, and tends to treat them as the same thing. They are not. Mosca's *formula* is a sociological account of legitimation tied to organized social forces; Pareto's *derivation* is a psychological account of rationalization rooted in residues.\n- **Pareto** worked with residues/derivations, logical/non-logical action, and a *psychological-equilibrium* model centered on sentiment. His elite theory is the political face of a general sociology of non-logical belief.\n- **Michels** produced the **iron law of oligarchy** from a *specific empirical study* of how mass democratic and socialist parties — organizations explicitly committed to internal democracy — inexorably develop entrenched leadership oligarchies [6][28]. His law is narrower, more empirical, and more deterministic than anything in Pareto; it is a claim about *organizations*, not a general theory of sentiment.\n\nBurnham's synthesis takes the most usable element from each — Pareto's circulation, Mosca's formula, Michels's iron law — and welds them into a single hard doctrine of inescapable minority rule. The weld is rhetorically powerful and historically influential, but it suppresses real disagreements: between Pareto's psychological and Mosca's organizational explanations of elite power; between Pareto's hedged tendencies and Michels's iron necessity; and between three quite different political temperaments — Mosca the wary constitutionalist, Pareto the sardonic late sympathizer-with-warnings, Michels who drifted toward fascism. A 2026 reading should un-weld them.\n\n### 6.6 What a careful 2026 reading keeps, discards, and adds\n\n**Keep:** the formal/real distinction as a genuinely useful analytic discipline for reading political speech; the circulation-of-elites concept as a real mechanism of stability and instability (it anticipates contemporary work on **elite overproduction**, e.g., Peter Turchin's cliodynamics, treated in the comparisons/revival workstream); the democratic-elitist insight that competitive pluralism, not literal popular sovereignty, is the operative guarantor of liberty; and the warning that ideologies can be derivations masking interest.\n\n**Discard:** the hardening of tendencies into iron laws and the resulting over-confident, \"present-trends-continue\" prediction style Orwell rightly punctured; the power-worship register that follows from making success the criterion of rationality; the flattening of three distinct theorists into one doctrine; and the silent sanitizing of the fascism problem.\n\n**Add:** Pareto the economist, restoring the economics→sociology arc that gives the elite theory its proper (limited) place; the live fascism debate, steelmanned both ways, as the necessary test case for whether elite realism defends or dissolves freedom; the probabilistic, equilibrium-minded, sceptical Pareto recovered by Femia and others; and an explicit reckoning with the book's contemporary afterlife — the Trump-era revival in *American Affairs* (Krein) and the neo-reactionary appropriation (Curtis Yarvin / \"Mencius Moldbug,\" whose widely-circulated reading of Burnham's Dante chapter, \"Politics as Wish,\" is itself a piece of the reception, Tier 7 — evidence of a position, not of fact) [17][29]. Burnham deserves criticism. So do both camps that flank him: the power-worship critics, who sometimes underrate how much he got right about managerial concentration, and the current admirers, who take the hardened, prophetic Burnham at face value and skip the probabilistic, self-sceptical Pareto underneath.\n\n---\n\n## 7. Distinguishing Burnham's Text from Later Partisan Readings\n\nA recurring hazard in this material is conflating what Burnham *wrote* with what later partisans *made of it*. Three distinctions are worth holding:\n\n1. **Burnham's 1943 argument was, in its own terms, pro-liberal-pluralist** — a defense of opposition, rival elites, and checks. The *content* is closer to mid-century democratic elitism (the lineage that runs through Schumpeter's competitive elitism into pluralist theory) than to any anti-democratic program [6][13]. Reading it as straightforwardly authoritarian is a later overlay.\n2. **The Trump-era national-conservative revival** (Krein, *American Affairs*) takes Burnham's *managerial* analysis and turns it into a critique of a detached, globalized, incompetent managerial class — a populist diagnosis Burnham's own text does not fully license, since he regarded managerial ascendancy as more or less inexorable rather than as something a populist politics could roll back [17].\n3. **The neo-reactionary appropriation** (Yarvin and the \"dark enlightenment\" milieu) reads Burnham as confirming that liberal democracy is a managerial oligarchy wearing a popular-sovereignty mask, and pushes toward openly anti-democratic conclusions Burnham himself did not draw [29][30]. This reading exists and matters as a fact of reception, but it should be cited as evidence of a *position*, never attributed to Burnham's text as its plain meaning.\n\nHolding these apart is itself an application of Burnham's own method: the *formal* meaning of \"Burnham revival\" hides at least three quite different *real* meanings, serving three different contemporary interests.\n\n---\n\n## Open Questions\n\n1. **The Pareto chapter's exact text.** This document reconstructs Burnham's Pareto chapter from direct knowledge of the book plus multiple close readings and reviews; several specific in-chapter quotations and Burnham's precise wording of his concluding list would benefit from page-level verification against a print or scholarly edition of the 1943 John Day text (and the 1987 Gateway reissue).\n2. **The senatorship facts.** Sources disagree on whether Pareto's senatorship was conferred in 1922 or 1923 and whether it was formally validated; the Fiuman-citizenship complication is reported but under-documented in English. A primary check against Italian biographical scholarship (e.g., Bobbi; the Pareto correspondence) is needed.\n3. **How far Burnham *deliberately* hardened Pareto.** It is unclear whether Burnham's iron-law cast is a conscious simplification for a lay audience or a genuine misreading. Burnham's own later prefaces and his correspondence might settle intent.\n4. **Mosca's priority dispute** and how Burnham handled (or elided) it deserves its own treatment in the comparisons workstream. This document only flags it.\n5. **Femia's specific critique of Burnham.** Femia clearly recovers a probabilistic, sceptical-liberal Pareto, but the extent to which Femia engages *Burnham by name* (versus the general Anglophone reception) needs the full text of *Pareto and Political Theory* to confirm.\n6. **Orwell ↔ 1984 link.** The Kateb thesis that \"Second Thoughts\" is an intellectual basis of *Nineteen Eighty-Four* is widely asserted; the strength of the textual evidence (versus a plausible-but-loose influence claim) should be checked against Kateb's actual argument.\n\n---\n\n## Sources\n\n1. \"Pareto, Residues, and The Circulation of the Elite,\" Charlemagne (Substack), close reading of Burnham's Pareto chapter. https://charlemagne.substack.com/p/pareto-residues-and-the-circulation — accessed 2026-06-13. **Tier 6** (named amateur close reading; used for its paraphrase of Burnham's framing, corroborated against primary text).\n2. \"The Machiavellians,\" Wikipedia (used only for navigation; substantive claims sourced to what it cites). https://en.wikipedia.org/wiki/The_Machiavellians — accessed 2026-06-13. **Tier 7** (reference/navigation only; not cited for any substantive claim).\n3. Burnham, James. *The Machiavellians: Defenders of Freedom* (New York: John Day Co., 1943). **Tier 1** (primary text, read directly). The book's project, structure, Pareto reading, and concluding propositions.\n4. \"The Real Meaning of 'Politics as Wish,'\" Vincent Waters (Substack), on Burnham's formal/real distinction and the 1932 platform example. https://vincentwaters.substack.com/p/the-real-meaning-of-politics-as-wish — accessed 2026-06-13. **Tier 6** (position/close reading; corroborates primary text).\n5. \"The Machiavellians: Defenders of Freedom (James Burnham),\" Charles Haywood, The Worthy House, 2021-08-14. https://theworthyhouse.com/2021/08/14/the-machiavellians-defenders-of-freedom-james-burnham/ — accessed 2026-06-13. **Tier 6** (detailed review, right-leaning; used for structure, the *De Monarchia* reading, and direct Burnham quotations it reproduces).\n6. Bachrach, Peter et al., *Democratic Elitism* (sample/introduction), Harvard University Press. https://www.hup.harvard.edu/file/feeds/PDF/9780674295377_sample.pdf — accessed 2026-06-13. **Tier 2** (scholarly; the \"in the hands of Burnham\" democratic-elitism framing, and distinctions among the theorists).\n7. \"Summary: The M
