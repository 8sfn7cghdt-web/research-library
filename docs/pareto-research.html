ntermediary level … neither psychological nor historical\"; Meisel's \"grave-digger\" of the bourgeoisie.\n17. \"Pareto's Circulation of Elites\" critical summaries (Studocu/yourarticlelibrary) consolidating the standard objections, accessed 2026-06-13. **Tier 5/7 (tertiary).** — The label-vs-quality ambiguity; absence of a measurement method for elite superiority. Treated as a pointer to the standard scholarly critique, corroborated against Aron [16] and the primary text §§2035–2036 [1].\n18. Bottomore, *Elites and Society* [3], on the contrast between Pareto's \"governing elite\" (organised vs. unorganised) and Mosca's \"ruling/political class\" (dominant vs. subject, with greater scope for organised \"social forces\"), as discussed in Jackson 2021 [22]. **Tier 2 (scholarly).** — Basis for the \"underrates institutions\" objection.\n19. Turchin, Peter. *End Times: Elites, Counter-Elites, and the Path of Political Disintegration* (2023); \"Elite overproduction\" overview, accessed 2026-06-13. **Tier 2/5 (scholarly + explication).** — The quantitative descendant of Pareto's §2044n \"intellectual proletariat\"; the 2010 forecast of ~2020 unrest. (Developed in ws8 / forecast.)\n20. Piano, Natasha. \"Revisiting Democratic Elitism: The Italian School of Elitism, American Political Science, and the Problem of Plutocracy,\" *Journal of Politics* 81.2 (2019): 524–538, as quoted in Jackson 2021 [22]. **Tier 2 (scholarly).** — The anti-plutocratic, pro-transparency re-reading; \"democratic theorists of elitism.\"\n21. Aron 1974 [16] on Machiavellianism as \"an attempt to see through the hypocrisies of the social comedy,\" via Jackson 2021 [22]. **Tier 2 (scholarly).**\n22. Jackson, Robert P. \"'Disfigurations' of Democracy? Pareto, Mosca and the Challenge of 'Elite Theory.'\" *Topoi* (2021), DOI 10.1007/s11245-021-09773-y. Open-access PDF, e-space.mmu.ac.uk/628575/, read in full 2026-06-13. **Tier 2 (scholarly).** — The synthesizing secondary source for §§2, 7, 8, 9: marshals Femia, Aron, Bottomore, Bellamy, Finer, Finocchiaro, Piano, Urbinati on the elite definition, demagogic plutocracy, the residues/reciprocal-determination tension, and the revisionist revival.\n23. \"The Circulation of Elites and the Dynamics of Political Power,\" and overview reporting on the right-wing uptake of \"circulation of elites,\" accessed 2026-06-13. **Tier 5/6 (analytical/commentary).** — The contemporary \"sclerotic elite replaced from below\" framing and its political valence.\n24. Lind, Michael, and others on Burnham's managerial-elite thesis repurposed by contemporary populism (American Affairs; Tablet, \"The Importance of James Burnham\"), accessed 2026-06-13. **Tier 5/6.** — The Burnham→populism transmission. (ws7/ws8.)\n25. Reporting and scholarship on Curtis Yarvin and \"post-liberal\" elite-replacement thought (Britannica biography; Rosenberg, \"Reactionary Bricolage,\" *Theory, Culture & Society*, 2026), accessed 2026-06-13. **Tier 4/5.** — Evidence of the online-right appropriation of Paretian/Burnhamite circulation.\n26. Barrow, Clyde W. \"Vilfredo Pareto's Sociology of a Ruling Class in Decline.\" *Jacobin*, March 17, 2026, jacobin.com/2026/03/pareto-sociology-ruling-class-decline, accessed 2026-06-13. **Tier 6 (left commentary).** — Contemporary left reading: lions→foxes decline applied to the present-day U.S.; \"aristos → decline → decadence → depravity\"; \"history is a graveyard of aristocracies.\" Used as position-evidence.\n27. \"Introduction. Elite Theory: Philosophical Challenges,\" *Topoi* (2022), DOI 10.1007/s11245-022-09794-1, accessed 2026-06-13. **Tier 2 (scholarly).** — Frames the scholarly revival of elite theory and its explanatory claims for contemporary democratic discontent."}, {"order": 6, "file": "06_Politics_Liberalism_And_Fascism.md", "title": "Politics, Liberalism, and the Fascism Question", "summary": "Pareto's political arc from ardent free-trade liberalism to the cynical anatomist of 'demagogic plutocracy,' and the contested charge that he fathered fascism — staged at full strength and then adjudicated, with the evidence separated into what Pareto endorsed, what his theory lent itself to, and what the regime appropriated.", "body": "# Politics, Liberalism, and the Fascism Question\n\n*How a young Manchester liberal who wrote 167 free-trade pamphlets became the old \"hermit of Céligny\" whom Mussolini's regime claimed as a prophet — and whether that claim was ever true. This chapter follows the political Pareto from the Anti-Corn-Law enthusiasms of his thirties to the ten contested months between the March on Rome and his death, and then tries the fascism charge in open court.*\n\n## Bottom Line\n\nVilfredo Pareto's politics describe a long descending arc from hope to disabused realism, not a conversion from left to right. He began as a doctrinaire free-trade liberal — anti-protectionist, anti-militarist, an admirer of Cobden and Bastiat who ran for parliament on a Manchester-liberal platform and lost. He never abandoned the *worldview* of classical liberalism (free exchange, the individual, suspicion of the plundering state); what he abandoned, by roughly 1900, was the *belief that liberalism could win politically*. Out of that disillusionment came his mature political theory: democracy as a \"derivation\" — a comforting myth masking the rule of an elite — and the modern liberal state recast as a \"demagogic plutocracy,\" an alliance of financial speculators and organized labor exploiting the rest through deficit finance and managed sentiment. On the fascism question, the chronology is decisive context: Pareto died on 19 August 1923, roughly ten months after the October 1922 March on Rome and ten months *before* the Matteotti murder (June 1924) that turned the regime totalitarian — so he never saw the dictatorship at all. In his last year he did welcome fascism, calling it a force that might break the \"red tyranny\" and restore an anti-statist liberalism, and Mussolini's regime eagerly claimed him (the senatorial nomination, the manufactured \"I was his pupil\" legend). But in the same months Pareto warned, repeatedly and specifically, against the abuse of force and the suppression of press, religious, and academic freedom, and he hoped fascism would be a transitional restorer of liberty, not its grave. The strongest scholarly verdict the evidence supports: Pareto was an *anti-democratic liberal* whose realism the fascists could quarry, not a fascist; the \"Marx of Fascism\" label is a real strand of the reception (S.E. Finer floated it as a provocation he then largely retracted) but is anachronistic as a description of the man, who died before fascism became the thing the label names. What he personally endorsed, what his theory lent itself to, and what the regime appropriated are three different things, and most of the controversy comes from collapsing them.\n\n---\n\n## 1. The Manchester Liberal: Pareto Before the Disillusionment\n\nThe fascism controversy starts with a fact its critics tend to forget: how thoroughly *liberal* the young Pareto was. Not vaguely \"liberal\" in the loose modern sense, but a programmatic, crusading, nineteenth-century free-trader of the Cobden-Bastiat school.\n\nHis formation was unambiguous. Around the age of sixteen Pareto read Frédéric Bastiat and found that the French economist \"wholly pleased my inclinations,\" in conscious contrast to his rejection of the absolutist Bossuet [1]. He took his economics from the classical school and his political temper from John Stuart Mill (he championed proportional representation, following Mill) and from Herbert Spencer, holding the Spencerian line that \"when no harm is suffered in legal terms, the state has no duty to intervene\" [1]. This was a man who, in his own later recollection, regarded \"political economy, as it was established by the so-called classical economists,\" as \"a perfect, or almost-perfect, science,\" so that \"what only remained was to put into practice its principles\" [1].\n\n\"Putting into practice\" was the point. Pareto did not theorize liberalism from a study; he agitated for it. After managerial work in the Italian iron industry — at the San Giovanni Valdarno ironworks, under the patronage of Ubaldino Peruzzi, the leading liberal politician and former mayor of Florence — he watched the protectionist tariff regime approved in 1887 as \"the working of vested interests\" that strangled genuine entrepreneurship; regulations tied to Italy's protectionist turn thwarted his own attempts to innovate in pig-iron processing [1][2]. That first-hand collision with the tariff state hardened him into an activist. He admired Richard Cobden and \"marveled at how the Anti-Corn Law League mobilized people in support of free trade,\" arguing Italy needed the same mass economic education to resist protectionist seduction [2]. Between 1889 and 1893 he poured out his campaign in print: \"no less than 167 articles\" against the government's protectionist and militarist policies \"in the name of free trade and old-fashioned liberalism\" [2]. He ran for the Italian parliament in 1882 — and lost [1].\n\nTwo features of this early Pareto matter enormously for the fascism question. First, his liberalism was *anti-militarist and anti-imperialist*, not merely economic: the later scholarly summary by Christopher Adair-Toteff catalogs Pareto as \"anti-socialist, anti-state intervention, anti-colonialism, anti-militarism, anti-racism, and anti-anti-Semitism\" — a profile that, whatever else it is, \"resists simple fascist categorization\" [3]. A man hostile to colonialism, militarism, and racism is poorly cast as the precursor of a movement defined by all three. Second, the liberalism failed — and Pareto knew it failed. The 1882 electoral loss, the futile free-trade campaign against entrenched interests, the spectacle of nominal liberals pursuing (in his words) \"their own interests more energetically than the cause of liberty itself\" [3]: this left a residue of bitterness his enemies would later mistake for reaction. As the historian Giovanni Busino's reading has it, Pareto's political psychology took its cast from the failed 1882 run; he came to see politics as \"evil\" and \"corruption\" and retreated into \"colder rationality\" [1].\n\nHere is the distinction Alberto Mingardi draws, the one the whole revisionist case turns on: Pareto abandoned the classical-liberal *program* by the turn of the century — by 1913 he dismissed his years of advocacy as \"all wasted time\" — but he never abandoned the classical-liberal *worldview* [1]. He went on believing free exchange superior, the individual primary, and the state a plundering machine. What died was the optimism that those truths could be made to prevail by argument and the ballot. \"Liberal doctrine is optimistic,\" he wrote already in 1903, \"as it presupposed men can cease pillaging each other. Before experience decided the issue, this hope could appear something else than a chimerical one, but facts shew at an advantage that, at the very least, the times are not ripe for its being made a reality\" [1]. The disappointed liberal, not the convert, is the figure who walks into the rest of this story.\n\n## 2. From Liberty to Realism: Pareto's Quarrel with Democracy\n\nPareto's hostility to democracy is genuine, deep, and easy to misread. It is not the hostility of a man who wants a king or a duce; it is the hostility of a man who thinks \"democracy\" names a *myth* — a flattering story societies tell about who really rules.\n\nThe theoretical engine is the residue/derivation machinery laid out elsewhere in this corpus (see Chapters 04 and 05). In Pareto's scheme, \"derivations\" are the rationalizations human beings drape over the non-logical \"residues\" (sentiments) that actually drive them. Democracy, on this analysis, is a derivation: a logical-sounding justification — popular sovereignty, the will of the people, government by consent — for a reality whose essence is something quite different, the rule of an organized minority [4]. Andrea Lombardinilo's reading puts it cleanly: Pareto \"interprets democracy as a derivation — a rationalization masking deeper sentiments,\" and democratic institutions as \"constructs reflecting underlying social forces rather than genuine popular governance\" [5]. The same treatment falls on socialism, which Pareto analyzed (in *Les Systèmes socialistes*, 1901–02) as a quasi-religious myth, \"ideology masking elite succession rather than genuine liberation\" [2]. Crucially, he held socialism's economics to be \"as bad as those of the protectionist rulers\" while crediting the socialists with \"purer motives\" than the bourgeois exploiters he despised more [2] — a telling asymmetry for anyone tempted to file Pareto as a simple man of the right.\n\nSo who actually rules under the democratic mask? Pareto's answer is the concept of the **demagogic plutocracy**. Joseph Femia, in the standard treatment, characterizes the term as Pareto's description of *the liberal state itself*: not genuine democratic governance but a system in which \"wealthy elites maintain power while appearing to serve public interests through democratic mechanisms\" [6]. The mechanism is an alliance. Pareto distinguished, in politics as in economics, between \"speculators\" — the cunning, innovative, risk-taking elite, heavy in what he called Class I residues (the \"instinct for combinations\") — and \"rentiers,\" the conservative savers heavy in Class II residues (the \"persistence of aggregates\"). In the modern demagogic plutocracy, the speculators win: they forge an alliance with organized labor and the masses, deceiving \"the multitudes\" with \"various financial measures\" whose \"principal goal\" is precisely deception, and they exploit the residual classes (savers, the disorganized middle) through reckless deficit finance and managed humanitarian sentiment [5][7]. \"Humanitarian\" rhetoric is not, for Pareto, a moral good corrupted; it is an *instrument* — \"emotional appeals and humanitarian rhetoric as key instruments\" by which elites \"maintain popular consent while preserving their material advantages\" [6].\n\nThis is the argument of *The Transformation of Democracy* (*Trasformazione della democrazia*, 1921), the last of his major works and the one most directly relevant to his political testament. Its thesis is that \"European democracies in the 1920s were being transformed into plutocracies,\" and its third chapter, \"The Plutocratic Cycle,\" lays out how a money-elite comes to dominate and what follows [7]. The work is, importantly, a *cyclical* not a triumphalist account: Pareto argues that \"the deception and corruption associated with plutocratic rule would eventually produce a reaction and lead to the system's downfall,\" after which democratic forms \"decay and are eventually reinvigorated\" [7]. The plutocracy, in other words, is not the end of history; it is a phase that overreaches and provokes its own overthrow — by a fresh elite. Read in 1921, on the eve of the fascist seizure, the argument has an obvious application — exactly the one Pareto's last articles would make.\n\nTwo points of nuance keep this from being a reactionary creed. First, Pareto's anti-democracy is *descriptive realism*, not a program: he is saying democracy *is* elite rule wearing a mask, not that elite rule *ought* to wear a different mask. Norberto Bobbio later read precisely this strand of elitism as \"a realistic view of 'democracy as it is' rather than idealistic 'as it should be'\" — a view he found compatible with, and useful to, *democratic* theory [8]. Second, Pareto's contempt is even-handed: he held the same contempt for *all* ruling elites, the rising one as much as the falling one. As early as 1900 he warned that what stood \"in front of the ruling class\" was not \"the people\" but \"a new and future aristocracy, which leans on the people\" — and that one could \"already see some marks of contrast between that new aristocracy and the rest of the people\" [1]. The man who wrote that sentence is not easily recruited as anyone's court philosopher; he is the analyst who tells you that your liberators will become your masters.\n\n## 3. The Chronology That Decides Half the Argument\n\nFix the calendar first. A great deal of the fascism controversy dissolves once the dates are laid side by side.\n\n- **28 October 1922** — the March on Rome; Mussolini is invited to form a government.\n- **Late 1922 – mid-1923** — fascism is a coalition government, not yet a dictatorship. Mussolini governs with parliament, a non-fascist majority cabinet in part, and the constitutional monarchy intact. The single-party state does not yet exist.\n- **19 August 1923** — Pareto dies at his villa in Céligny, on Lake Geneva, the \"hermit of Céligny\" [9].\n- **10 June 1924** — Giacomo Matteotti, the socialist deputy who had denounced fascist electoral violence, is murdered. This is the hinge: the Matteotti crisis is what turns Mosca, among others, decisively against the regime [4].\n- **1925–1926** — the *leggi fascistissime*; press suppression, the abolition of opposition parties, the construction of the totalitarian state.\n\nThe consequence is stark, and scholars across the spectrum concede it: **Pareto witnessed only fascism's earliest, still-ambiguous phase and died before it became a dictatorship.** Giovanni Barbieri, in the 2024 *Italian Sociological Review* study that is the most careful recent treatment, states it flatly: \"Pareto died in 1923 and, thus, was unable to witness fascism's transformation into a totalitarian regime\" [4]. He continues: \"Pareto's position was less clear. Since he died in August 1923, he did not witness the events that led Mosca to distance himself from fascism\" [4]. The \"popular fascism of the period between 1919 and 1920,\" Barbieri reminds, \"was immensely different from the form of fascism that, some years later, transformed into a totalitarian regime\" [4]. To call Pareto a fascist on the strength of his last ten months is, at minimum, to attribute to him approval of a thing he never saw.\n\n## 4. The Regime's Embrace: Senatorship, the Pupil Legend, and the Last Articles\n\nMussolini's regime worked hard to claim Pareto. Three threads of that appropriation need to be told accurately, because the regime's claims are routinely mistaken for Pareto's own.\n\n### 4.1 The \"I was his pupil\" legend\n\nMussolini liked to boast that he had attended Pareto's lectures at the University of Lausanne — which let him pose as the great sociologist's pupil and heir. The boast is almost certainly false. Mussolini claimed to have attended \"some of Pareto's lectures in Lausanne, in 1903–1904: there is no evidence he did,\" and multiple historians treat the claim as a fabrication \"to legitimize himself as an intellectual heir to Pareto's ideas after rising to power\" [1][10]. What *is* documented is Mussolini's early debt to elite theory in general: as a young socialist journalist in 1908 he called it \"the most brilliant conception of modern times\" [4]. The distinction matters. That fascism's leader admired Paretian-Moschian elite theory is a real fact about *fascism's* intellectual sources; that Mussolini sat in Pareto's classroom is propaganda. (One genuine complication: the Mingardi symposium reports that Pareto himself appeared to *confirm* the attendance in a letter to Carlo Placci of 5 January 1923 [1] — but this is a single, late, contested attestation, written when Pareto was newly warm to the regime, and it runs against the dominant scholarly finding that there is no record of Mussolini in Lausanne. The honest position is that the pupil legend is at best unverified and most likely manufactured. **[single-source / contested]**)\n\n### 4.2 The senatorial nomination\n\nThe regime nominated Pareto a senator of the Kingdom of Italy in early 1923 — a high honor and an obvious bid to enlist his prestige. But the nomination was never consummated, and the reason is almost comic in its un-ideological quality. Pareto \"could not accept his nomination as senator of the Kingdom of Italy because he had just renounced Italian citizenship to acquire that of the Free State of Fiume\"; the appointment \"could not be validated because Pareto had obtained Fiuman citizenship in the meantime in order to pursue the divorce he longed for\" [9]. (Fiuman citizenship offered a route to the divorce that Italian law denied him.) A second strand of the record holds simply that the fascists \"offered Pareto appointment as a senator… an invitation to which he never responded\" [3]. Either way, the operative facts are: nominated, yes; seated as a fascist senator, no — and the obstacle was a domestic-law technicality about a divorce, not a grand refusal. He was also named Italy's representative to the League of Nations commission for arms reduction, \"from which he resigned for health reasons shortly after his appointment\" [9] — a detail worth keeping for anyone tempted to make him a militarist.\n\n### 4.3 The last articles — what Pareto actually published in 1922–23\n\nThis is the Tier 1 core of the whole question. In his final year Pareto wrote a remarkable concentration of pieces on fascism, several in *Gerarchia*, the fascist review Mussolini had founded. Reconstructed from the scholarly bibliographies (Busino's collected editions), the sequence runs:\n\n- *Il fascismo*, in *La Ronda*, January 1922 — written *before* the March on Rome [4].\n- *Il fascismo e le classi*, in *Il nuovo Paese*, 3 January 1923 [4].\n- *I provvedimenti del governo* (\"The Measures of the Government\"), in *Il Giornale economico*, 10 January 1923 [4].\n- *Paragoni* (\"Comparisons\"), in *Gerarchia*, January 1923 [4].\n- *Legalità* (\"Legality\"), in *Gerarchia*, April 1923 [4].\n- *Libertà* (\"Liberty\"), in *Gerarchia*, July 1923 [4].\n- *Pochi punti di un futuro ordinamento costituzionale* (\"A Few Points on a Future Constitutional Order\"), in *La vita italiana*, September–October 1923 — appearing *after his death* [1][4].\n\nTheir content is double-edged, and the double edge is the whole crux. On one side, genuine welcome. Pareto came to see fascism as \"a vital force capable of contrasting the social disintegration caused by socialism and the red tyranny\" [4]. His most-quoted line, from *Legalità* (April 1923), endorses the breaking of legal forms to save the state: \"given that the governments of that time did not want or could not [stop the slide to anarchy] in a legal manner, it was necessary that others, able to oppose 'illegality' to 'illegality', came to the fore… To 'legality', which leads to ruin, peoples end up preferring 'illegality' that saves\" [4]. He saw the fascist victory as a *confirmation of his own theory*: to Lello Gangemi on 13 November 1922 he wrote, \"The victory of fascism largely confirms the predictions I made in my Sociologia and in many of my articles. Then, I can be glad of this both as man and as a scientist\" [4]. And in the letter to Carlo Placci of 5 January 1923 he reached for *The Prince*, suggesting Mussolini was \"the man that the Sociology can invoke,\" and that he could now close his treatise with Machiavelli's closing exhortation to a new prince [4]. That last line is the single strongest piece of evidence the prosecution has.\n\nBut on the other side — in the *same* months, often the *same* documents — Pareto issued warnings that read like a checklist of everything the dictatorship would later do. Less than two months after the March on Rome, on 23 December 1922, he wrote to his old friend Maffeo Pantaleoni: \"In Italy, signs, very slight in reality, of a future less prosperous than what one could hope are springing up. The danger is that use of force shifts in its abuse\" [4]. In the same letter he defended \"the freedom to express one's own thoughts, even if they are biased,\" and the necessity of freedom of religion as \"a precondition for maintaining a plurality of perspectives and preventing ideological conformity\" [4]. On academic freedom he conceded that teaching might be constrained in primary and secondary schools but insisted it \"should remain unrestricted in universities, enabling the teaching of the theories of Newton, Einstein, Marx, or the historical school without any constraints\" [4]. And in his posthumous constitutional sketch, *Pochi punti di un futuro ordinamento costituzionale*, he laid down the limits of any durable government: \"To only govern with the consent of a majority, however large, cannot be done… To only govern with force, for any length of time, cannot be done… For this a House of Representatives is quite useful… A broad freedom of the press is indispensable… Care should be taken lest one yields to the temptation of strongly curbing it\" [1]. Barbieri's summary is exact: \"Despite having been a fierce critic of parliamentarism, in his final work, Pareto did not argue in favour of abolishing parliament. The maintenance of one chamber, as well as the referendum and freedom of the press, were considered useful for understanding whether the government was trusted by the majority\" [4].\n\nThe most defensible reading of these last articles, and the one Barbieri reaches, is that \"Pareto's satisfaction primarily related to his perception of fascism as a force that would support the development of liberalism\" — he \"saw in it an anti-statist, anti-centralistic, and liberalist force,\" because the early fascists \"at least initially, championed decentralisation and economic freedom\" [4]. He welcomed a movement he expected to *restore* a liberal order by force, and he warned, in real time, that it might instead become a tyranny of force. He died before learning which it would be.\n\n## 5. The Debate at Full Strength\n\nStage the controversy honestly, each side in its strongest form.\n\n### 5.1 The prosecution: Pareto as godfather of fascism\n\nThe case that Pareto fathered fascism rests on four pillars. None is frivolous.\n\n**(a) The label and its authority.** Pareto was tagged \"the Karl Marx of fascism\" early (T.H. Worthington, 1933) and the phrase stuck; he has been portrayed \"by some as the ideological father of fascism ('Marx of the bourgeoisie'), by others as a precursor of fascism\" [4][11]. The most prestigious version of the charge is associated with **S.E. Finer**, whose 1966 selection *Sociological Writings* (with its long introduction) is the standard English gateway to Pareto and who floated the \"Marx of Fascism\" framing — a provocation that gave the label scholarly currency even as Finer himself, two years later, \"defended Pareto vigorously in 1968 against such mischaracterizations\" [3]. (I have not read Finer's introduction in the original; its precise wording and the exact balance of his verdict are flagged below as a primary text not consulted. **[primary-text-not-consulted]**)\n\n**(b) The theory was usable, and used.** Fascist thinkers did quarry elite theory. Mussolini's 1908 praise of elite theory as \"the most brilliant conception of modern times\" is real [4]; Karl Mannheim observed that fascism \"incorporated Paretian theory, particularly regarding myths and elite leadership\" [5]. Barbieri grants the structural point: elitist thought \"represents one of the main theoretical reference points for fascism,\" and the elitists' \"critiques of democracy, anti-parliamentarism, and denunciations of the corrupt and inefficient political class\" plausibly \"contribute[d] to an atmosphere of mistrust towards Italy's representative and democratic institutions\" that helped clear the ground for Mussolini [4]. A theory that says democracy is a fraud, that force renews societies, and that a vigorous elite is the engine of history is, on its face, congenial to a movement built on exactly those three propositions.\n\n**(c) Pareto's own late words.** The Gangemi letter (\"I can be glad of this both as man and as a scientist\"), the Placci letter invoking *The Prince* and Mussolini as \"the man that the Sociology can invoke,\" and *Legalità*'s endorsement of saving \"illegality\" are documentary, in Pareto's hand, and unmistakably warm [4]. He published in *Gerarchia*, the regime's own journal. He accepted (or did not refuse) the honors. To the prosecution, the warnings are footnotes to an endorsement.\n\n**(d) The charge of advocating violence.** Hannah Arendt characterized Pareto as \"a preacher of violence\" [3] — and the analysis of force, the lions-vs-foxes glorification of the elite that *dares* to use it, and the apparent contempt for \"humanitarian\" squeamishness can be read as an apology for political brutality.\n\n### 5.2 The defense: the label is anachronistic and instrumentalized\n\nThe revisionist case — Femia, Bobbio, Cirillo, Barbieri, and the recent peer-reviewed literature — answers each pillar in turn.\n\n**(a) Anachronism.** The decisive move is the calendar of §3: Pareto died before fascism *was* the totalitarian thing the label names. To call him a fascist is to make him answer for a regime (post-1925) he never saw. Recent scholarship adds that \"his initial sympathy for early fascism has been overestimated and probably had been manipulated by the regime\" (Giandomenica Becchio) [1] — that the warm Pareto of the prosecution's exhibits is partly a regime construction, the senatorial nomination and the pupil legend included.\n\n**(b) The theory was *also* usable by liberals and democrats — and was.** Femia relocates Pareto in the tradition of \"sceptical liberalism,\" which \"scorns metaphysical abstraction and assigns ontological primacy to the individual,\" and argues that Pareto's \"methodological individualism and hostility to speculative abstraction\" reveal \"a liberal potential in his realist political theory,\" not a proto-fascist one [12]. The historical record bears this out: Paretian (and Moschian) elite theory \"influenced in Italy liberal and antifascist authors like Gobetti, Dorso, Burzio, Einaudi, Croce, and Salvemini,\" and Bobbio built a *democratic* theory of \"democracy as it is\" on the realist foundation [8]. A theory that fed Croce's and Salvemini's *anti*-fascism cannot be reduced to fascism's seedbed. (Note the contrast with Roberto Michels, the one classical elitist who genuinely became a committed fascist — admiring Mussolini as Weber's \"charismatic leader,\" teaching at fascist Rome, excusing the castor-oil thugs [4]. The discipline of the comparison is that it shows the *theory* did not compel the politics: the same elite theory produced a true believer (Michels), a critic who broke with the regime after Matteotti (Mosca), and Pareto, who died too soon to choose.)\n\n**(c) Pareto's late words cut both ways, and the warnings are not footnotes.** The defense insists the warnings are the *load-bearing* evidence about the man's principles, not the endorsements. Pareto's first reaction to fascism, in 1921, was *hostile*: he wrote to Pantaleoni that the catastrophe \"will not be averted either by maces nor by revolvers of fascists\" and that the fascists were \"devoid of moral courage\" [4]; to Arturo Linaker (19 April 1921) he likened fascism to \"the French White Terror during the restoration\" and asked whether one should not \"prefer those countries where neither the [red] nor the other one is present\" [4]; he mocked Mussolini as \"Mussolino\" (after a Calabrian brigand), \"a fixer… devoid of authority… not, ultimately, a leader\" [4]. His later warmth was conditional — predicated on fascism restoring an anti-statist liberalism — and it coexisted, to the end, with explicit defense of press, religious, and academic freedom and of a surviving parliament [1][4]. As for Arendt's \"preacher of violence\": the City Journal/Adair-Toteff rejoinder is that she \"misread him, cherry-picking from his letters,\" and that his bitterness was \"the disappointment of a true liberal\" watching liberals betray liberty [3]. Pareto analyzed force as a permanent fact of political life; analyzing it is not preaching it.\n\n**(d) The counterfactual.** Barbieri's careful conclusion — the strongest the evidence will bear — is that Pareto's \"arguments against the government's abuse of power and restrictions of the freedoms of expression, the press, and religion, as well as his advocacy for maintaining parliament, support the thesis that he would have begun, like Mosca, to disapprove of fascism\" — *but* \"it is impossible to provide a definitive statement to this effect\" [4]. Renato Cirillo's 1983 article posed the question in its title — \"Was Vilfredo Pareto Really a 'Precursor' of Fascism?\" — and answered that he \"remained a radical libertarian till the end\" who \"continued to express serious reservations about fascism,\" with \"strong reasons to believe that, had he lived long enough, Pareto would have revolted against fascism\" [11]. The counterfactual is honest precisely because it is offered *as* a counterfactual: we are told what the evidence suggests *and* that it cannot be proved.\n\n## 6. Adjudication: Which Way Does the Evidence Lean, and Why\n\nThree things have to be kept apart, because nearly all the heat in this controversy comes from fusing them.\n\n**(a) What Pareto personally endorsed.** He endorsed early fascism *conditionally and provisionally*, as a force he hoped would break the socialist threat and restore an anti-statist, decentralizing, economically liberal order — and he warned, in the same breath, against the abuse of force and the suppression of liberties he correctly foresaw as the danger. He did not endorse dictatorship, single-party rule, press censorship, or the totalitarian state, because he did not live to see them and because the principles he stated in 1922–23 are flatly incompatible with them. He was, in the end, an *anti-democratic liberal*: contemptuous of democracy as a myth, but attached to the concrete liberties — press, religion, inquiry, a representative chamber as a barometer of consent — that liberalism exists to protect. The evidence here leans clearly against the simple \"Pareto was a fascist\" claim.\n\n**(b) What his theory lent itself to.** Here the prosecution has a real point, and the defense should concede it. Pareto's theory *is* usable by fascism: the demolition of democracy as fraud, the analysis of myths/derivations as tools of rule, the lions-and-foxes celebration of the elite that dares to act, the cyclical justification of force as social renewal — all of this can be, and was, picked up by people building an authoritarian order. But the theory is *promiscuous*. It lent itself equally to Croce's liberalism, Bobbio's democratic realism, Mills's left critique of the American \"power elite,\" and the contemporary online right's reading of Burnham (see Chapters 07–08). A tool usable by everyone indicts no one in particular. The fair verdict: Pareto built a realism with no built-in normative guardrails, and a normatively empty realism will be furnished with whatever values its user brings. Fascism brought ugly ones. That is a fact about fascism's appetite more than about Pareto's intent.\n\n**(c) What the regime appropriated.** The regime appropriated *the prestige of the name* — through the senatorial nomination, the manufactured pupil legend, the welcome into *Gerarchia*, and the selective amplification of his warm lines while burying his warnings. Becchio's point that the sympathy was \"manipulated by the regime\" [1] is the key to reading the documentary record: some of what looks like Pareto endorsing fascism is fascism endorsing Pareto and putting words in a dead man's mouth. The dead cannot object; Pareto died in August 1923 and the canonization proceeded without him.\n\nSo which way does the evidence lean? **Toward the revisionists, with one honest concession.** As a description of the *man*, \"fascist\" or \"Marx of Fascism\" is anachronistic and largely a regime-assisted reception artifact; the better description is \"disillusioned, anti-democratic liberal whose realism the fascists could and did quarry.\" The honest concession is that the theory genuinely *was* a usable resource for fascism (and for several incompatible politics besides), and that Pareto's last-year warmth, while conditional, was real and not invented — the Placci and Gangemi letters are in his hand. The \"Karl Marx of Fascism\" formula survives best not as a verdict on Pareto but as a description of a *reception*: the way a fascist movement, and later its interpreters, made a prophet out of a sceptic who would very likely have disowned them. The single irreducible uncertainty — and it should be stated plainly — is the counterfactual: *we cannot know* whether the Pareto who warned against the abuse of force in December 1922 would have followed Mosca into open opposition after Matteotti in 1924, because he was eleven months dead by then. The evidence makes it *likely*. It cannot make it *certain*.\n\n## 7. Why the Controversy Still Burns: The Contemporary Stakes\n\nThis is not an antiquarian quarrel. The fascism question is hot again because elite theory is hot again — and the same ambiguity that let fascism quarry Pareto now lets a contemporary authoritarian-curious right do the same, usually through Burnham rather than directly.\n\nThe reception line runs: Pareto → Burnham's *The Machiavellians: Defenders of Freedom* (1943), which presented Pareto, Mosca, Michels, and Sorel as scientific realists whose unmasking of the democratic \"myth\" was, paradoxically, the true *defense of freedom* (because only the diffusion of power among rival elites — \"not leaders but the unyielding opponents of leaders\" — restrains tyranny) [13]. Burnham's reading is itself selective in exactly the way this chapter warns against: it foregrounds the cold realism and the \"defense of freedom\" gloss, and it downplays both Pareto's economics and the fascism entanglement (see Chapter 07). From Burnham the line runs to the present: Curtis Yarvin and the \"neoreactionary\" current cite Burnham among their primary influences, and Burnham's elite-as-permanent-ruler thesis — \"the primary object of every elite or ruling class is to preserve power and privilege\" couched in \"democratic rhetoric\" — is now a staple of an online right that reads the \"myth of democracy\" as license rather than warning [14]. On a different vector, Peter Turchin's cliodynamics revives the Paretian \"circulation of elites\" as \"elite overproduction\" driving political crisis [14]. The corpus's forecast workstream takes this up in full; the point for *this* chapter is narrower and sharper. The very feature that makes Pareto perennially appropriable — a brilliant, normatively empty realism about power — is what made the original fascism controversy possible and what makes its echo live today. Reading Pareto's last year honestly is therefore not only a historical exercise. It is a test case in how a realism without guardrails gets claimed by the politics its author neither chose nor lived to see.\n\n---\n\n## Open Questions\n\n1. **The counterfactual after Matteotti.** Would Pareto have broken with fascism as Mosca did after June 1924? The principles in his 1922–23 warnings make it likely, but he died before the test. This is irreducibly unknowable; the most any source can honestly say is \"probably\" [4][11].\n2. **The Placci letter and the pupil legend.** Did Pareto really confirm Mussolini's Lausanne attendance in the 5 January 1923 letter [1], and if so, how to weigh that single late attestation against the dominant finding that there is no evidence Mussolini attended [1][10]? The primary letter (in the Giacalone-Monaco edition of the Pareto–Placci correspondence) has not been read directly here.\n3. **Finer's actual verdict.** The \"Marx of Fascism\" framing is attributed to Finer's 1966 introduction, but Finer \"defended Pareto vigorously in 1968\" [3]. The precise wording and trajectory of Finer's view require reading his introduction to *Sociological Writings* (1966) directly — not done here.\n4. **How much of the \"warm\" record is regime manipulation?** Becchio's claim that the sympathy was \"manipulated by the regime\" [1] is plausible but would need the original Italian editions (Busino's *Scritti politici* / *Scritti sociologici minori*) and the fascist-press archive to quantify.\n5. **The economics–politics seam.** How tightly does Pareto's *welfare* economics (Pareto optimality, the new welfare economics) connect to his political pessimism? Mingardi and Wagner gesture at a \"bridge\" between economic and political action [1]; the corpus's economics chapter (02) and this one need to be read together.\n\n---\n\n## Sources\n\n1. Alberto Mingardi, \"Liberty and Cynicism: Was Vilfredo Pareto a Liberal?\", *Liberty Matters* symposium, Online Library of Liberty (Liberty Fund), November 2018. https://oll.libertyfund.org/publications/liberty-matters/alberto-mingardi-vilfredo-pareto-liberalism-november-2018 — accessed 13 June 2026. **Tier 5–6** (classical-liberal/libertarian lean, but quotes Pareto's texts and letters with page citations; the verbatim Pareto quotations are the value). Contribution: early liberalism and the worldview/program distinction; verbatim Pareto on liberty, democracy, and the constitutional sketch; the Placci-letter complication; Becchio's \"manipulated by the regime.\"\n\n2. \"Vilfredo Pareto (1848–1923): A Libertarianism.org Guide,\" Libertarianism.org (a Cato Institute project), n.d. https://www.libertarianism.org/topics/vilfredo-pareto-1848-1923 — accessed 13 June 2026. **Tier 5–6** (explicit libertarian lens; note lean). Contribution: free-trade/anti-protectionist activism, Cobden/Bastiat, *Les Systèmes socialistes* as analysis of socialism-as-myth, the speculator/rentier distinction, press-freedom in the posthumous article.\n\n3. Daniel J. Mahoney (or s
