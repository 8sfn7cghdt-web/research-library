's transparency tooling and Driver 6's governance vacuum collide directly. Who writes the rules for CTV content-level safety, in the absence of GARM, may simply be *whoever ships the measurement product everyone adopts*.\n\n**Leading vs. lagging.** The *leading* drivers — the ones likely to dominate the next phase — are FAST/AVOD growth (1), fraud economics (2), and the governance vacuum (6), because all three are unresolved, self-reinforcing, and still intensifying in 2026. The *lagging-but-rising* drivers are AI classification (4) and content-level transparency (8) — reactive responses, accelerating but not yet caught up to the problem. Privacy law (3) is a slow secular ratchet. Consolidation (7) and retail-media convergence (5) are structural reframers that change *what the discipline optimizes for* more than they change its size.\n\n---\n\n## Open Questions\n\n1. **Does content-level transparency reach the FAST long tail, or only premium head inventory?** IAS Total TV and Gracenote–PubMatic (2026) cover major broadcasters; the 1,610+ FAST channels and 178,000+ programs where the safety gap is widest are not yet covered. The forecast hinges on whether content signal diffuses down-tail by 2030.\n\n2. **Who inherits the GARM floor — a successor body, the IAB Tech Lab, the DV/IAS duopoly's products, or no one?** No formal stewardship transfer has occurred as of June 2026. This is the central governance uncertainty.\n\n3. **Does AI content classification cross the accuracy/explainability threshold agencies and EU regulators will trust?** The capability is shipping (Zefr's 2025 patent, agentic frameworks) but the reliability and auditability ceilings are unresolved, and AI is simultaneously generating new content to classify.\n\n4. **How much does the precise CTV fraud rate matter versus its direction?** Vendor-sourced IVT figures (~18%, SSAI ~2× amplification) are directionally corroborated but commercially interested; the forecast should not lean on exact percentages.\n\n5. **Does retail-media convergence raise or lower the safety floor?** Commerce data could align performance incentives with safety (low-quality adjacencies convert poorly) or subordinate suitability to conversion. The sign is genuinely ambiguous.\n\n6. **How synchronized is global signal loss?** GDPR/DSA, DPDP (to May 2027), US state laws, LGPD and Australia's reforms arrive on different timelines, so the migration to content-level safety is regionally staggered rather than a single event — complicating any global forecast.\n\n7. **Does the verification duopoly broaden or tighten further?** The Scope3 retreat (Adloox → Peer39, June 2026) suggests the challenger lane is hard to monetize; whether a credible third independent verifier emerges by 2030 is open.\n\n8. **Will cryptographic device attestation actually deploy at scale** as a fraud counter-force, or remain a frontier proposal? Its deployment would materially shift Driver 2's arms race.\n\n---\n\n## Sources\n\n1. apprupt, \"FAST Channel Viewership Statistics: 2025, 2026 & Beyond,\" 2025. https://www.apprupt.com/fast-channel-viewership-statistics — accessed 2026-06-17. [Tier 5, trade analysis; FAST channel counts (1,610+), 21% 2025 growth, 178,000+ programs, 626% reality-channel growth, 1.8B hours / 43% YoY, 120M / 62% AVOD viewer projections, platform viewer counts.]\n2. Comscore, \"Comscore's 2025 State of Streaming Report Reveals Surging Growth of Both Ad-Supported Platforms and FAST Channels,\" press release, 2025-10. https://www.comscore.com/Insights/Press-Releases/2025/10/Comscores-2025-State-of-Streaming-Report — accessed 2026-06-17. [Tier 5 / Tier 1 measurement-firm release; corroborates AVOD/FAST surge. Press release — used as evidence of Comscore's reported measurement, not as independent proof.]\n3. PPC Land, \"IAS Total TV brings show-level transparency to CTV ad buying,\" 2026-04. https://ppc.land/ias-total-tv-brings-show-level-transparency-to-ctv-ad-buying/ — accessed 2026-06-17. [Tier 4/5; IAS Total TV launch April 27, 2026, show/genre/rating/language transparency, Disney/NBCU/Paramount/Prime Video coverage via Publica.]\n4. Pixalate / Spider AF / trade compilations on CTV IVT, 2025–2026 (e.g., spideraf.com \"Video Ad Fraud 2025 Playbook\"; attekmi.com \"CTV Ad Fraud 2026\"; trafficforensics.com \"State of Ad Fraud 2026\"). https://spideraf.com/articles/video-ad-fraud-the-2025-playbook-to-protect-ctv-youtube-and-programmatic-video-budgets — accessed 2026-06-17. [Tier 5 vendor fraud-lab data; CTV IVT ~18% Q1/Q2 2025 vs ~12% prior, programmatic IVT splits, $7.5M/month single-bot figure. Vendor commercial interest noted.]\n5. Pixalate, SSAI IVT research (Q1–Q2 2024), via Pixalate blog and trade compilations. https://www.pixalate.com/blog/webinar-ad-fraud-server-side-ad-insertion-ssai-ott-ctv — accessed 2026-06-17. [Tier 5 vendor; SSAI IVT ~110–140% higher than non-SSAI.]\n6. DoubleVerify, \"DV Global Insights 2025 | Bot Fraud in CTV: The Hidden Drain on Ad Budgets,\" 2025. https://doubleverify.com/blog/ctv/verify/dv-global-insights-2025-bot-fraud-in-ctv-the-hidden-drain-on-ad-budgets — accessed 2026-06-17. [Tier 5 vendor; CTV bot fraud as material budget drain.]\n7. firstlaunch.in, \"DPDP Act: What Digital Marketers in India Must Know in 2026,\" 2026. https://firstlaunch.in/blog/dpdp-act-marketers-2026/ — accessed 2026-06-17. [Tier 5/6 marketer-advisory; shift to server-side/first-party, contextual impact. Advisory lean noted.]\n8. EY India, \"Transforming data privacy: DPDP Act, 2023 and DPDP Rules, 2025,\" and Rainmaker / India-Briefing / Privacy World analyses, 2025–2026. https://www.ey.com/en_in/insights/cybersecurity/transforming-data-privacy-digital-personal-data-protection-rules-2025 ; https://www.india-briefing.com/news/dpdp-rules-2025-india-data-protection-law-compliance-40769.html/ — accessed 2026-06-17. [Tier 5 legal analysis citing Tier 1 statute; DPDP Rules notified 2025-11-13, phased enforcement (consent managers 2026-11-13, substantive 2027-05-13), GDPR comparison.]\n9. EU GDPR/DSA primary texts and US state-law sources — see the regional chapters (the United States and Canada; the EU, India, LATAM, and Australia) for full citations on the EU/US legal spine.\n10. Zefr / Business Wire, \"Zefr Awarded New U.S. Patent for AI-Powered Content Classification Process,\" 2025-12-16. https://www.businesswire.com/news/home/20251216899842/en/ ; Adweek wire and Omnicom OM Media Trials study on ad adjacency to AI-generated content. https://www.adweek.com/adweek-wire/zefr-awarded-new-u-s-patent-for-ai-powered-content-classification-process/ — accessed 2026-06-17. [Tier 5 trade / Tier 1 patent claim; LLM-agent classification, hybrid human escalation, GenAI-adjacency study.]\n11. eMarketer / Marketing Dive on retail-media × CTV, 2025–2026: \"Walmart and Vizio sharpen retail media and CTV pitch\"; \"Inside Walmart Connect as retail media, CTV convergence accelerates.\" https://www.emarketer.com/content/walmart-vizio-sharpen-retail-media-ctv-pitch ; https://www.marketingdive.com/news/inside-walmart-connect-as-retail-media-ctv-convergence-accelerates/807682/ — accessed 2026-06-17. [Tier 4/5; Walmart–Disney 2024, Prime Video closed-loop, Walmart/Vizio/L'Oréal shoppable, 45.5% 2025 growth, 1-in-5-by-2027 projection.]\n12. Skai / Tinuiti / Rockbot retail-media 2026 outlooks. https://skai.io/blog/the-2026-state-of-retail-media-dsp-ctv-and-social-commerce-accelerating-beyond-the-shelf/ ; https://blog.rockbot.com/retail-media-trends-2026 — accessed 2026-06-17. [Tier 5; ~$200B+ retail-media market sizing, CTV as fast-growing channel.]\n13. Vendor histories — see the chapters on origins and history and on the present-day vendors and actors for full citations: Oracle 2024 advertising exit, DV/IAS near-duopoly, IAS Publica/CTV expansion, DV Scibids 2023. Adweek/AdExchanger 2024–2026 coverage. — accessed 2026-06-17. [Tier 4/5.]\n14. AI classification debate — see the chapter on live debates and tensions for the full accuracy/explainability/cost sourcing. — accessed 2026-06-17.\n15. eMarketer, \"US Connected TV (CTV) Ad Spending, 2022–2028\" and related forecast charts; adwave compilation \"CTV Advertising 2026 Update.\" https://www.emarketer.com/chart/266519/us-connected-tv-ctv-ad-spending-2022-2028-billions-change-of-digital-ad-spending ; https://adwave.com/resources/ctv-advertising-2026-update — accessed 2026-06-17. [Tier 5 / market-sizing; ~$33.35B 2025 → ~$38B 2026 → ~$47B 2028 surpassing linear, growth cooling 14%→11% by 2029.]\n16. DoubleVerify, Form 8-K and Annual Report (ARS), FY2025, SEC EDGAR — Rockerbox acquisition ($85.0M cash, announced 2025-02-26). https://www.sec.gov/Archives/edgar/data/0001819928/000155837025001812/dv-20250227xex99d2.htm — accessed 2026-06-17. [Tier 1 primary filing; acquisition terms and strategic rationale.]\n17. Nielsen/Gracenote–PubMatic, \"Gracenote and PubMatic Bring Curated Live Sports and Content-Level Deals to Programmatic CTV,\" 2026-06-17; TVREV \"How Video-Level Data And Content Identifiers Solve The Transparency Problem In CTV\"; TV Tech \"IAB Tech Lab Introduces Standardized Signals For CTV Ad Portfolio\"; IAB Tech Lab CTV Programmatic Guide; IAB Spain Feb 2026 bid-request harmonization. https://www.nielsen.com/news-center/2026/gracenote-and-pubmatic-bring-curated-live-sports-and-content-level-deals-to-programmatic-ctv/ ; https://www.tvrev.com/news/how-video-level-data-and-content-identifiers-solve-the-transparency-problem-in-ctv — accessed 2026-06-17. [Tier 1/4/5; episode-level deal IDs, Agentic Real-Time Framework 0.1–0.5ms, 86%-of-planners barrier stat (partner-issued), \"open-bid-stream is a non-starter\" framing.]\n18. Scope3 / Peer39 — Scope3 sells Adloox to Peer39 (2026-06-02); Scope3 exit from verification. See the chapter on live debates and tensions for full sourcing. — accessed 2026-06-17. [Tier 4/5; challenger-lane retreat, Peer39 inherits Adloox.]\n19. IAB Tech Lab, \"GARM Brand Suitability: Developing a Collaborative Interpretation of the Standard\"; IABTechLab/Brand-Suitability-Test-Benchmarks (GitHub); Brand Safety Institute Frameworks library; WFA-hosted GARM Brand Safety Floor + Suitability Framework PDF. https://iabtechlab.com/garm-brand-suitability-developing-a-collaborative-interpretation-of-the-standard/ ; https://github.com/IABTechLab/Brand-Suitability-Test-Benchmarks — accessed 2026-06-17. [Tier 1/5 standards-body materials; framework survival, 11 categories × 4 levels, no formal stewardship successor.]\n20. FAST safety — see the chapter on live debates and tensions for the curation-vs-UGC case and sourcing. — accessed 2026-06-17.\n21. GARM shutdown timeline — see the chapters on origins and history and on live debates and tensions for full sourcing: WFA discontinuation 2024-08-08, X suit 2024-08-06, House Judiciary July 2024 report. — accessed 2026-06-17. [Tier 1–4.]"}, {"order": 8, "file": "08_Primary_Sources_And_Standards.md", "title": "Primary Sources and Standards: Direct Readings of the Load-Bearing Texts Underlying CTV Brand Safety", "summary": "", "body": "# Primary Sources and Standards\n\n## Bottom Line\n\nNo single statute or specification governs CTV brand safety. It is assembled at runtime from a stack: voluntary technical standards (IAB Tech Lab's VAST, OpenRTB, ads.txt/app-ads.txt, sellers.json, the SupplyChain Object); measurement standards (the MRC's viewability and Invalid Traffic guidelines, audited by accredited vendors); a content-classification framework that has outlived the body that wrote it (the GARM Brand Safety Floor + Suitability Framework, now embedded in the IAB Tech Lab Content Taxonomy and a public benchmark dataset); buy-side guidance (the 4A's APB framework, the ANA's transparency study); and a patchwork of privacy and platform statutes (GDPR, the DSA, India's DPDP Act and its 2025 Rules, Brazil's LGPD) that govern *how* ads are targeted rather than *what content* they run against. Read these documents directly — not the trade-press summaries of them — and four corrections recur. First, **most of the \"brand safety\" plumbing in CTV is actually fraud and supply-chain plumbing**: the VAST CTV Addendum, ads.txt, sellers.json, and the SupplyChain Object answer *who is authorized to sell this impression and whether it is real*, not *whether the content is suitable*. Second, **the core verification primitive web brand safety relied on — client-side JavaScript measurement (VPAID) — does not run in CTV**, a fact DoubleVerify states flatly in its own SneakyTerra report and the MRC encodes in its SSAI-spoofing IVT category. Third, **the most-cited content framework in the discipline, GARM's, was written by a body the WFA discontinued in August 2024**; the framework survives only because IAB Tech Lab folded its eleven (now twelve) categories into a maintained taxonomy and a public benchmark repo, and the antitrust suit that triggered the shutdown was itself dismissed with prejudice in March 2026 (now under appeal). Fourth, **the regulatory texts most often called \"brand safety law\" are targeting and transparency law** — they constrain ACR-derived household profiling, sensitive-data inference, and ads to children, not content suitability. The documents below are where any downstream claim in these pages can be checked against what the source actually says.\n\n---\n\n## How to Read This Document\n\nThis is the grounding chapter. When you hear that \"VAST supports verification,\" or \"GARM defined eleven categories,\" or \"the DSA bans sensitive-data targeting,\" or \"a court ruled the TCF illegal,\" this is where you check the claim against the primary text. Each source gets a citation, the context that produced it, a **direct reading** of what it says (as distinct from how it is summarized), and its significance. The sources fall into six groups:\n\n- **(A) IAB Tech Lab technical specifications** — VAST 4.x and the CTV Addendum; OpenRTB 2.6 Content/Channel/Network objects; ads.txt/app-ads.txt; sellers.json + the SupplyChain Object; the Content Taxonomy.\n- **(B) MRC measurement standards** — viewability; the Invalid Traffic Detection and Filtration Standards Addendum.\n- **(C) The GARM content framework and its successors** — the Brand Safety Floor + Suitability Framework; the post-2024 dissolution, the X lawsuit and its dismissal, and the framework's absorption into IAB Tech Lab.\n- **(D) Buy-side governance documents** — the 4A's Advertiser Protection Bureau framework; the ANA Programmatic Media Supply Chain Transparency Study; TAG's certification programs.\n- **(E) Regulatory texts** as they bear on CTV ads — the DSA; India's DPDP Act and the 2025 Rules; Brazil's LGPD; GDPR and the IAB Europe TCF litigation.\n- **(F) Vendor fraud-lab reports** read as primary evidence of fraud method — DoubleVerify's SneakyTerra; Pixalate's CTV SSAI and bundle-ID benchmarks.\n\nA note on what these documents can and cannot tell us. The specifications, the framework, the statutes, and the vendor reports are all authoritative *for what they say* — they are the things themselves. They are not authoritative for whether what they say is *true of the world*: a vendor report claiming a scheme cost advertisers $5M/month is reliable evidence of the *claim*, not of the dollar figure. A self-interested quantitative claim deserves caution. A widely misread document — and several here are — gets its misreading named and corrected against the text.\n\nA note on dates. Standards versions, framework custodianship, court outcomes, and statutory commencement dates go stale silently. Every present-tense status claim in these pages is dated, and the four most volatile — GARM's status, the X-suit outcome, the DPDP Rules' commencement, the TCF litigation's current posture — are stated as of mid-2026, with a note wherever an earlier account or trade source has them wrong.\n\n---\n\n## A. IAB Tech Lab Technical Specifications\n\nNo regulator compels these standards. They are voluntary, licensed under Creative Commons, and owned by the IAB Technology Laboratory (\"Tech Lab\") — a non-profit consortium founded in 2014 and headquartered in New York. [1] Their force comes from network effects: a DSP that ignores them cannot transact with compliant supply. Read as a set, they answer three questions — *what is this ad and how is it measured* (VAST), *what is this impression* (OpenRTB), and *who is authorized to sell it and is the path real* (ads.txt, sellers.json, schain). Not one of them, on its own, answers *is this content suitable*.\n\n### A.1 — VAST 4.x and the VAST CTV Addendum 2024\n\n**Citation:** IAB Tech Lab, *VAST CTV Addendum 2024*, released July 2024 (final PDF and GitHub markdown at iabtechlab.com/wp-content/uploads/2024/07/VAST-CTV-Addendum-2024-FINAL.pdf and github.com/InteractiveAdvertisingBureau/vast); and IAB Tech Lab, *Digital Video Ad Serving Template (VAST) 4.3*, December 2022, iabtechlab.com/standards/vast/. Accessed 2026-06-17. [1][2]\n\n**Context.** VAST (Video Ad Serving Template) is the XML template a video player and an ad server use to exchange the details of a video ad — the creative file, tracking pixels, the ad ID, verification resources. It is the single most-deployed video-ad standard. The 2024 Addendum addresses fragmentation: VAST dominates video ad serving, but many publishers still run versions older than 4.x, which lack the standardized fields CTV measurement and verification need. [1] Tech Lab's Advanced TV / Programmatic Video working groups produced it, opening it for public comment in spring 2024 before the July 2024 final.\n\n**Direct reading.** Trade coverage widely cites the Addendum as a \"CTV brand safety\" document. **It is not.** Read directly, its central purpose is *cross-version compatibility* for ad identification and measurement:\n\n- **Ad identification — back-porting `UniversalAdId`.** VAST 4.0 introduced the `<UniversalAdId>` field to carry a registered ad ID plus the registration authority (AD-ID in the US, ARPP/ClearCast equivalents elsewhere). The Addendum's \"key update\" enables pre-4.0 VAST users (2.0/3.x, still dominant) to implement `UniversalAdId` and its two components — the ID value and the registry URL — via an `<Extension>`. [1] This is an identity-plumbing fix, not a content-safety control.\n- **Verification runs through `<AdVerification>` + the Open Measurement SDK (OMID), not VPAID.** The Addendum directs implementers to incorporate the `<AdVerification>` node \"in all versions of VAST\" to support OM SDK third-party verification of impressions. [1] It documents the deprecation path explicitly: VPAID (2008) \"allowed for direct interaction with the player and could disrupt player operation\" and \"confused third party verification with tracking interactive events\"; it was replaced by **SIMID** (Secure Interactive Media Interface Definition, 2019, for interaction) and **Open Measurement** (for verification), with VAST 4.x deprecating VPAID. [1][2] This is the textual basis for the single most important CTV fact in the discipline: the JavaScript-based, in-player measurement that web/mobile brand safety relied on does not exist in the CTV verification path.\n- **DSA transparency is wired into VAST via the `<Icon>` node.** A \"key update added after public comment\" is icon support for displaying ad information to comply with the EU Digital Services Act — \"similar to the Digital Advertising Alliance's Ad Choices program.\" [1] A VAST tag can now carry a machine-readable flag (a `regs` attribute on the icon) that a DSA-required transparency icon is present. This is a rare, concrete instance of a privacy/transparency statute operationalized inside an ad-serving spec.\n\n**Significance.** The Addendum is the primary text establishing two things: that CTV verification is OMID-based, not VPAID-based — which is *why* third-party blocking in CTV is harder and frequently post-bid rather than pre-render — and that the spec layer has become a regulatory-compliance surface (DSA). Call the VAST CTV Addendum a \"brand-safety standard\" and you have misread it; it is an ad-identification and measurement-plumbing standard with two brand-safety-adjacent hooks (OMID verification presence, DSA icon presence).\n\n### A.2 — OpenRTB 2.6: the Content, Channel, and Network objects\n\n**Citation:** IAB Tech Lab, *OpenRTB Specification Version 2.6*, April 2022; canonical machine-readable version at github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md. Accessed 2026-06-17. [3]\n\n**Context.** OpenRTB is the bid-request/bid-response protocol of programmatic. The bid request describes the impression for sale; the buyer decides whether and how much to bid, in milliseconds. For CTV brand safety, the bid request is the *only* pre-bid information a buyer has about the content the ad will run against. Version 2.6 (April 2022) added the structured CTV metadata that earlier versions lacked.\n\n**Direct reading.** The relevant object is the **`Content` object** (spec §3.2.16), nested inside the **`App` object** — CTV inventory is an app, not a site. A bid request \"must not contain more than one of a Site, App or DOOH object\"; the `App` object carries `bundle` (\"the store ID of the app in an app store\") and `storeurl`. [3] The Content object's CTV-relevant fields, read from the spec:\n\n- `id`, `title` (e.g., \"A New Hope\"), `series` (e.g., \"The Office\"), `season` (e.g., \"Season 3\"), `episode` — the episodic-metadata fields. [3]\n- `genre`/`genres`/`gtax` — a free-text genre plus structured genre IDs against a named taxonomy (`gtax` says which taxonomy). The spec instructs that `genres` \"should only be used to describe the genre of the holistic piece of content.\" [3] The December 2024 Content Taxonomy 3.1 update (see A.5) exists precisely to convert these free-text strings into enumerated values. [13]\n- `livestream` (0 = VOD; 1 = scheduled/linear), `realtime`, `firstbroadcast`, `len` (length in seconds). [3]\n- **`network` (§3.2.23) and `channel` (§3.2.24)** — the headline 2.6 additions. The Network object represents a content licensor/owner (e.g., A+E Networks); the Channel object represents a specific channel (e.g., The History Channel). [3] The widely-cited worked example: a publisher passing channel name \"CMDY\" is meaningless until the channel object's `domain` field carries \"cc.com\" — then everyone knows the channel is Comedy Central.\n\n**Significance and the load-bearing caveat.** This is the primary text behind the central structural claim of CTV brand safety: **the metadata exists in the protocol, but it is optional and publisher-declared.** Every one of these fields is something the publisher *may* populate, accurately or not. There is no URL — the web's ground-truth address bar — only these self-reported strings. The spec gives buyers the *vocabulary* for content-level transparency; it cannot give them the transparency itself, which depends on publishers choosing to pass honest values and having no incentive to under-disclose sensitive content. So the gap between \"OpenRTB 2.6 supports content-level CTV metadata\" (true of the spec) and \"buyers can verify CTV content\" (false in practice) is exactly the gap at the heart of CTV brand safety. It lives in the distance between what the spec *defines* and what it *requires* — and the spec requires almost nothing.\n\n### A.3 — ads.txt and app-ads.txt: authorized digital sellers\n\n**Citation:** IAB Tech Lab, *ads.txt (Authorized Digital Sellers) Specification* and *ads.txt 1.1 Implementation Guide*, with the app-ads.txt extension for app-distributed inventory; iabtechlab.com/ads-txt/. Accessed 2026-06-17. [4]\n\n**Context.** ads.txt (2017) was the industry's first structural answer to domain spoofing: a publisher posts a plain-text file at `/ads.txt` listing every exchange and reseller authorized to sell its inventory, so buyers can reject inventory offered by unauthorized intermediaries. app-ads.txt extends this to apps \"distributed through mobile app stores, connected television app stores, or other application distribution channels.\" [4]\n\n**Direct reading and the CTV-specific break.** On the web, a buyer finds the ads.txt file at the page's domain. For CTV, **there is no domain** — so the spec defines a different, more fragile lookup: the DSP takes the app-store URL or `bundle` ID from the bid request, retrieves the developer's website URL from the app-store listing, and appends `/app-ads.txt`. [4] That indirection is where CTV breaks the web model. The mechanism depends on app stores exposing a machine-readable developer-URL field. Per trade analysis of the spec's operation, **Roku properly exposes this metadata while Apple does not** (forcing DSPs to build custom scrapers), and some stores (e.g., certain console storefronts) have \"no public store listings\" for streaming apps, leaving that inventory unverifiable against any app-ads.txt file. [5] The spec also defines `inventorypartnerdomain`, which lets a publisher whose content is redistributed by a vMVPD or aggregator point to the *content owner's* app-ads.txt rather than forcing the distributor to maintain entries — a CTV-licensing-specific provision that matters because the same content flows through many apps. [5]\n\n**Significance.** ads.txt/app-ads.txt is an **authorization** standard, not a content standard. It answers \"is this seller allowed to sell this app's ads?\" — not \"is this content safe?\" Its CTV implementation is structurally weaker than its web implementation because the app-store lookup is platform-dependent and breaks where stores do not expose developer URLs. This is the primary evidence that supply-chain transparency in CTV is real but partial.\n\n### A.4 — sellers.json and the SupplyChain Object\n\n**Citation:** IAB Tech Lab, *sellers.json Specification*, July 2019 (FAQ updated September 2020), iabtechlab.com/sellers-json/; *SupplyChain Object*, canonical at github.com/InteractiveAdvertisingBureau/openrtb/blob/main/supplychainobject.md. Accessed 2026-06-17. [6][7]\n\n**Context.** ads.txt/app-ads.txt let buyers verify the *first* seller — but programmatic chains run through many intermediaries: SSPs, resellers, aggregators. sellers.json and the SupplyChain Object together extend transparency along the whole path, end to end.\n\n**Direct reading.** Two complementary documents:\n\n- **sellers.json** is the mirror image of ads.txt: each exchange/SSP publishes a file declaring every seller and intermediary it represents and that entity's relationship type (PUBLISHER, INTERMEDIARY, BOTH). Where ads.txt says \"these exchanges may sell my inventory,\" sellers.json says \"here is who we, the exchange, are selling on behalf of.\" [6]\n- **The SupplyChain Object** (\"schain\") rides inside the bid request at `BidRequest.Source.schain` in OpenRTB 2.6+. [7] Read from the spec: it is \"composed primarily of a set of nodes where each node represents a specific entity that participates in the selling of a bid request.\" A **`complete` flag** (0/1) indicates \"whether the chain contains all nodes involved in the transaction leading back to the owner of the site, app or other medium.\" Each `SupplyChainNode` carries `asi` (advertising system ID, a domain), `sid` (the seller ID, which must match an entry in that system's sellers.json), plus `hp` (whether the node is paid), `rid`, `name`, `domain`. [7] The first node in a *complete* chain is the inventory owner; the last is the entity sending the request.\n\n**Significance.** Together these three (app-ads.txt + sellers.json + schain) let a buyer reconstruct and validate the entire payment path of a CTV impression and detect undisclosed resellers — the structural defense against the \"domain laundering\" and reseller-spoofing the MRC's IVT standard lists as SIVT (see B.2). The honest caveat sits in the spec itself: the `complete` flag can be 0, and an *incomplete* chain is still valid OpenRTB. The standard documents transparency; it does not mandate it. The fraud value materializes only when buyers refuse incomplete or unverifiable chains — a buying *policy*, not a property of the spec. This is why the discipline turns on adoption rates (see D.2, F.2) as much as on the specs themselves.\n\n### A.5 — IAB Tech Lab Content Taxonomy 3.x (the classification layer)\n\n**Citation:** IAB Tech Lab, *Content Taxonomy* standards page and *Content Taxonomy 3.1* (announced 11 December 2024; public comment through 24 January 2025); the *Implementation Guide for Brand Suitability with the Content Taxonomy*; the *Taxonomies* GitHub repository. iabtechlab.com/standards/content-taxonomy/. Accessed 2026-06-17. [13]\n\n**Context.** The Content Taxonomy is the maintained, machine-readable scheme that turns free-text content descriptions into enumerated category IDs a DSP can act on. Crucially, it is where the GARM brand-suitability categories now live (see C.2). Version 3.0 (2021) added a \"Sensitive Topics\" node; version 3.1 (December 2024) was \"a minor update to the genres list\" (adding e.g. Thriller) and standardized CTV genre handling via the OpenRTB `genres`/`gtax` fields. [13]\n\n**Direct reading.** Two things matter for brand safety. First, the **Sensitive Topics node** carries the high-risk topic categories advertisers treat as suitability-relevant (terrorism, adult/explicit sexual content, hate speech, etc.) — these map onto the GARM categories of C.1. The *Implementation Guide for Brand Suitability* documents how to express GARM-style risk tiers via taxonomy IDs. Second, the 3.1 genre standardization is the operational answer to A.2's caveat: it gives the bidstream enumerated genre values (`gtax` identifies the taxonomy) so a DSP is not parsing arbitrary publisher strings. [13]\n\n**Significance.** This is the document that makes the GARM framework *runnable* after GARM's dissolution. It is also where the de-branding shows: the current taxonomy and 3.1 announcement standardize content classification **without naming GARM**, even though the Sensitive Topics categories descend directly from the GARM framework. The taxonomy is the technical successor. The governance — who adds a category — is the open question (see C.2).\n\n---\n\n## B. MRC Measurement Standards\n\nWhere IAB Tech Lab writes the *protocols*, the Media Rating Council (MRC) writes the *measurement rules* and audits vendors against them. The MRC is the US accreditation body for media measurement, and its standards are the closest thing the discipline has to an authoritative definition of \"viewable\" and \"invalid.\" DoubleVerify, IAS, HUMAN, and Pixalate all hold MRC accreditations measured against these documents.\n\n### B.1 — MRC/IAB Viewability standard (and why CTV breaks it)\n\n**Citation:** MRC (with IAB), *Viewable Ad Impression Measurement Guidelines*, and the MRC video viewability standard; mediaratingcouncil.org. Read via the operative thresholds; the full CTV-specific MRC text was not consulted line-by-line. Accessed 2026-06-17. [8]\n\n**Direct reading.** The MRC viewability threshold is precise and widely quoted correctly: **for display, ≥50% of the ad's pixels in view for ≥1 continuous second; for video, ≥50% of pixels for ≥2 continuous seconds.** [8] The under-appreciated point is the *premise*: the standard assumes a measurable viewport and a measurement script that can observe pixel coverage. In CTV, the ad typically fills the **full screen**, and there is no in-player JavaScript to observe pixel-percentage. So CTV viewability is treated differently — full-screen, sound-on, completion-oriented metrics rather than the 50%/2s pixel rule — because the web definition is not directly computable in a server-side, full-screen environment. It would be a mistake to assert that \"the MRC 50%/2s rule applies to CTV.\" Read directly, the rule is a *web/in-browser* construct whose mechanics do not transfer; what transfers is the *principle* (a minimum opportunity-to-see threshold), re-expressed for full-screen TV.\n\n**Significance.** This is the primary basis for the claim that CTV's measurement *advantages* (full-screen, hard to skip, sound-on, often unskippable) coexist with a measurement *deficit* (no client-side pixel observation). The same architecture that makes a CTV ad more impactful makes the web's verification primitive inapplicable. \"CTV is more viewable\" is true in spirit and a category error in mechanism.\n\n### B.2 — MRC Invalid Traffic Detection and Filtration Standards Addendum\n\n**Citation:** Media Rating Council, *Invalid Traffic Detection and Filtration Standards Addendum* (Update, Final), June 2020, ~55 pp.; mediaratingcouncil.org. Read directly via PDF extraction. Accessed 2026-06-17. [9]\n\n**Context.** This is the authoritative US standard defining what counts as ad fraud (\"invalid traffic\") and what an accredited vendor must do to detect and filter it. It is the single most load-bearing document for the fraud half of CTV brand safety, because in CTV the line between \"fraud\" and \"unsafe\" blurs — much of what looks like a brand-safety failure in CTV is actually invalid traffic.\n\n**Direct reading.** The Addendum establishes **two categories** of IVT, defined verbatim:\n\n- **General Invalid Traffic (GIVT)** — \"traffic identified through routine means of filtration executed through application of lists or with other standardized parameter checks.\" [9] Enumerated examples include: known invalid data-center traffic; bots/spiders/crawlers (except sophisticated ones); non-browser user-agent headers; pre-fetch/pre-rendered traffic where the ad was never accessed; \"invalid placements\" such as 0x0 and 1x1 ad sizes; and \"non-rendering capabilities\" — sessions on devices \"incapable of or illogical with rendering ability,\" e.g., headless browsers. [9]\n- **Sophisticated Invalid Traffic (SIVT)** — \"more difficult to detect situations that require advanced analytics, multi-point corroboration/coordination, significant human intervention.\" [9] Its enumerated list is where CTV fraud lives. Quoting the categories directly, SIVT includes: automated browsing from dedicated and non-dedicated (infected/hijacked) devices; incentivized human invalid activity (click farms); manipulated activity; **\"Falsified measurement events: visit, impression, viewability, click, location… consent string… as well as Server Side Ad Insertion (SSAI) spoofing where applicable to a measurement organization\"**; and **\"Domain and App misrepresentation: App ID spoofing, domain laundering and falsified domain / site location.\"** [9] It also lists adware/malware ad injection, hijacked ad tags, invalid proxy traffic, and cookie stuffing.\n\n**Significance and three corrections.** First, **SSAI spoofing and App-ID spoofing are not exotic edge cases — they are named SIVT categories in the governing standard.** The two fraud methods most specific to CTV (see F.1, F.2) sit explicitly in scope of the MRC IVT standard; they are not novel beyond the rulebook. Second, the standard distinguishes itself from TAG's IVT Taxonomy: its GIVT categories \"should not be confused with the Trustworthy Accountability Group's (TAG's) IVT Taxonomy v2.0, which… was not expressly created for MRC IVT audit purposes.\" [9] Trade writing routinely conflates the two; the MRC explicitly does not. Third, the standard anticipates its own obsolescence: SIVT items \"may be incorporated into standardized, objective lists… and as a result, may be re-categorized as GIVT.\" [9] Fraud detection is a moving boundary by the standard's own design — an SSAI scheme detectable only by advanced analytics today can become a list-based GIVT check tomorrow. This is why vendor fraud labs (Section F) matter as primary sources: they are where SIVT is first characterized before it hardens into a GIVT list.\n\n---\n\n## C. The GARM Content Framework and Its Successors\n\nThis is the only widely-adopted document that classifies *content* — not traffic or supply — for advertising suitability. It is also the most misread. Its authoring body no longer exists, and the litigation around it has been mis-dated across the trade press.\n\n### C.1 — GARM Brand Safety Floor + Suitability Framework\n\n**Citation:** Global Alliance for Responsible Media (GARM) / World Federation of Advertisers (WFA), *Brand Safety Floor + Suitability Framework*, first published September 2020; Misinformation category added 2021; the captured document is the \"23 Sept\" version, hosted at wfanet.org and ana.net. Read directly via PDF extraction. Accessed 2026-06-17. [10]\n\n**Context.** GARM was a cross-industry initiative founded November 2019 under the WFA, uniting marketers, agencies, platforms, and ad-tech vendors. Its stated premise: \"you cannot address the challenge of harmful online content if you are unable to describe it using consistent and understandable language.\" [10] The Framework was its flagship output — common definitions agreed in consultation with GARM's NGO Consultative Group.\n\n**Direct reading — the actual structure.** The Framework has two parts, and conflating them is the most common error in the trade press.\n\n1. **The Brand Safety Floor** — \"Content not appropriate for any advertising support.\" This is a hard floor: content below it should not be monetized at all, by anyone.\n2. **The Brand Suitability Framework** — \"Sensitive content appropriate for advertising supported by enhanced advertiser controls,\" graded into **High / Medium / Low Risk** tiers per category. This is where individual advertisers set their own tolerance. There is no single \"GARM-safe\" setting; suitability is configurable per advertiser.\n\nThe categories — usually cited as \"eleven,\" though the maintained document lists **twelve** after Misinformation was added in 2021 — are, from the Framework: [10]\n\n1. **Adult & Explicit Sexual Content** — Floor: child sexual abuse material; \"Explicit or gratuitous depiction of sexual acts… real or animated.\" Suitability runs from \"Suggestive sexual situations\" (High) through \"Artistic Nudity\" (Medium) to \"Educational, Informative, Scientific treatment of… sexuality\" (Low).\n2. **Arms & Ammunition** — Floor: promotion/advocacy of illegal arms sales; instructive content on obtaining/making illegal arms; \"Glamorization of illegal arms for the purpose of harm.\"\n3. **Crime & Harmful acts to individuals and Society, Human Right Violations** — Floor: \"Graphic promotion, advocacy, and depiction of willful harm and actual unlawful criminal activity\"; harassment/bullying.\n4. **Death, Injury or Military Conflict** — Floor: incitement of violence/death; \"Live action footage/photos of military actions & genocide or other war crimes.\"\n5. **Online piracy** — Floor: \"Pirating, Copyright infringement, & Counterfeiting.\"\n6. **Hate speech & acts of aggression** — Floor: content that \"incites hatred, promotes violence, vilifies, or dehumanizes groups or individuals based on race, ethnicity, gender, sexual orientation, gender identity, age, ability, nationality, religion, caste… immigration status, or serious disease sufferers.\"\n7. **Obscenity and Profanity** — Floor: \"Excessive use of profane language or gestures and other repulsive actions that shock, offend, or insult.\"\n8. **Illegal Drugs/Tobacco/e-cigarettes/Vaping/Alcohol** — Floor: promotion/sale of illegal drug use; promotion of tobacco/vaping/alcohol to minors. Note the explicit federalism hedge: \"Federal jurisdiction applies, but allowable where legal local jurisdiction can be effectively managed.\"\n9. **Spam or Harmful Content** — Floor: \"Malware/Phishing.\"\n10. **Terrorism** — Floor: \"Promotion and advocacy of graphic terrorist activity.\"\n11. **Debated Sensitive Social Issue** — Floor: \"Insensitive, irresponsible and harmful treatment of debated social issues… that demean a particular group or incite greater conflict.\"\n12. **Misinformation** (added 2021) — Floor: \"verifiably false or willfully misleading content that is directly connected to user or societal harm.\"\n\nThe suitability tiers follow a recurring logic worth reading directly. Across nearly every category, the **Low Risk** tier is reserved for \"Educational, Informative, Scientific treatment\" and \"News feature stories on the subject,\" while the **Medium Risk** tier covers \"Dramatic depiction… presented in the context of entertainment\" and \"Breaking News or Op-Ed coverage.\" [10] This is the textual root of the **news-avoidance problem**: under a literal reading, breaking-news coverage of a war is *Medium Risk* in the \"Death, Injury or Military Conflict\" category — so advertisers who exclude Medium-and-above mechanically defund journalism about exactly the events that matter most. The Framework's authors plainly intended news to be *more* suitable than entertainment depiction; the operational reality of keyword and category blocking inverts that intent.\n\n**Significance.** Three corrections. (1) \"Eleven categories\" is the canonical shorthand, but the maintained version has **twelve** (Misinformation). (2) The Floor and the Suitability tiers are different instruments — the Floor is industry-wide and near-absolute; the tiers are advertiser-configurable — so treating \"GARM-safe\" as a single switch misrepresents the framework. (3) The Framework is a *content-classification* standard; it says nothing about how to *detect* content in a CTV impression, where there is no transcript and no page, only the OpenRTB metadata of A.2. Its categories are only as good as the classification layer applied on top — which in CTV is the weakest link.\n\n### C.2 — The post-GARM vacuum: dissolution, the X lawsuit, the dismissal, and where the framework went\n\n**Citation:** WFA statement discontinuing GARM, 8–9 August 2024 (reported by CNBC, Marketing Dive, Legal Dive); *X Corp v. World Federation of Advertisers et al.*, US District Court for the Northern District of Texas, dismissed with prejudice by Judge Jane Boyle on 26–27 March 2026; X's notice of appeal to the 5th Circuit (filed ~April 2026); IAB Tech Lab Content Taxonomy 3.1 (December 2024) and the IABTechLab/Brand-Suitability-Test-Benchmarks GitHub repository. Accessed 2026-06-17. [11][12][13][14][22]\n\n**Context and direct reading.** These are present-tense, going-concern facts — and the ones most likely to be reported staler than they are. Each is dated:\n\n- **GARM is defunct.** The WFA discontinued GARM in **August 2024**, two days after X Corp filed its antitrust suit; WFA CEO Stephan Loerke informed members on 8 August 2024 (CNBC), and GARM's own statement said the litigation had \"significantly drained its resources and finances,\" making continuation untenable. [11] As of June 2026, GARM has not been revived. Any source describing GARM as a *current* operating body is out of date.\n- **The X lawsuit was dismissed WITH PREJUDICE — in March 2026, not 2025.** X had alleged that advertisers' coordinated use of GARM's standards constituted an illegal boycott costing it \"billions\" in revenue (defendants named included Unilever, Mars, CVS Health, Nestlé, Colgate-Palmolive, Lego, Shell, Ørsted, Tyson, Abbott, and Pinterest; the suit was filed August 2024 and expanded February 2025). On **26–27 March 2026**, Judge Jane Boyle (N.D. Tex.) dismissed the case **with prejudice**, ruling that X failed to show antitrust injury and that the alleged conduct, even if proven, would not state an antitrust claim — writing that \"the very nature of the alleged conspiracy does not state an antitrust claim, and the court therefore has no qualm dismissing with prejudice.\" [12][22] Some trade coverage places this dismissal in 2025; the correct date is March 2026. [22]\n- **The dismissal is now under appeal.** X filed a notice of appeal to the **5th Circuit Court of Appeals** (~April 2026); as of mid-2026, X had filed notice but not yet briefed substantive arguments. [22] So the litigation is *not* fully closed — but the body it killed (GARM) remains dissolved regardless of the appeal's outcome. The \"sued into dissolution regardless of the suit's merits\" dynamic is the durable fact here.\n- **The framework outlived its author by being absorbed into IAB Tech Lab.** The GARM categories live on inside the **IAB Tech Lab Content Taxonomy** — current version **3.1, released December 2024** — the maintained, machine-readable classification vendors map content against, and in the *Implementation Guide for Brand Suitability with the Content Taxonomy*. [13] They are also operationalized in the **IABTechLab/Brand-Suitability-Test-Benchmarks** GitHub repository — \"media content that has been human labeled according to the GARM standard,\" with labels across the GARM categories and a pull-request challenge process for disputed labels. [14]\n\n**Significance — the most important correction here.** The phrase \"post-GARM vacuum\" is half right. There is a *governance* vacuum: no convening body now sets or updates the content-safety floor, and documented reluctance to fill it runs deep, for fear of antitrust exposure (the X suit's deterrent survives even its own dismissal, and X's appeal keeps the threat live). But there is **no specification vacuum**. The eleven/twelve categories survive, maintained and de-branded, inside IAB Tech Lab's taxonomy and benchmark repo. Tellingly, the current IAB Tech Lab content-classification materials **no longer foreground GARM by name** — the framework is being quietly absorbed and stripped of the brand that became a legal liability. So it is wrong to say \"brand safety has no standard since GARM.\" The standard persists *technically* while its *governance* has gone dark. One more trap: the **4A's Advertiser Protection Bureau (APB)** \"Brand Suitability Framework and Brand Safety Floor\" is sometimes cited as a GARM *successor* — but the APB framework dates to **2018**, *predating* GARM, and is a buy-side guidance document, not a 2024+ replacement governance body (see D.1). Treating it as the post-GARM successor is a chronological error. [15]\n\n---\n\n## D. Buy-Side Governance Documents\n\nGARM and IAB Tech Lab are sell-side and standards-body texts. The buy side — advertisers and their agencies — has its own canon: the 4A's APB framework, the ANA's transparency study, and TAG's certification programs. These are the documents that tell *advertisers* what to demand.\n\n### D.1 — The 4A's Advertiser Protection Bureau (APB) Brand Safety Framework\n\n**Citation:** American Association of Advertising Agencies (4A's), Advertiser Protection Bureau, *Brand Safety Framework / Brand Suitability Framework and Brand Safety Floor*, originally 2018, periodically updated; aaaa.org. Read via the framework's public description and the 4A's APB materials. Accessed 2026-06-17. [15]\n\n**Context and direct reading.** The 4A's stood up the APB in 2016 to give the buy side a coordinated voice on fraud, brand safety, and supply-chain integrity. Its Brand Safety Framework (2018) predates GARM and is structurally similar — a floor of content unsuitable for any advertising plus risk-tiered suitability categories — but it is a *buy-side* guidance instrument: it tells agencies and advertisers how to set blocklists, contract for verification, and demand transparency, rather than convening platforms to agree common definitions (GARM's distinct role). [15]\n\n**Significance and the chronology correction.** The APB framework is frequently miscast in trade coverage as either a clone of GARM or a post-GARM successor. Neither is right. It *predates* GARM (2018 vs. GARM's 2019 founding / 2020 framework), it serves a different constituency (advertisers/agencies, not the cross-industry alliance), and it was never the body that set the industry-wide floor. After GARM's dissolution, the APB is one of the buy-side homes where suitability practice continues — but it is not a replacement for GARM's convening function. It is best understood as parallel and prior, not successor.\n\n### D.2 — ANA Programmatic Media Supply Chain Transparency Study (2023)\n\n**Citation:** Association of National Advertisers (ANA), *Programmatic Media Supply Chain Transparency Study* — \"First Look\" June 2023; full report December 2023; ana.net. Read via the published findings and the report PDF. Accessed 2026-06-17. [23]\n\n**Context.** The ANA is the largest US advertiser trade body. This study — conducted September 2022–January 2023, covering $123M in ad spend across 35.5 billion impressions from 21 participating marketers — is the most-cited buy-side empirical document on where open-web programmatic spend leaks. It is the primary text behind the \"Made-for-Advertising\" (MFA) problem that crosses directly into CTV/FAST.\n\n**Direct reading.** The headline findings, from the report:\n\n- **MFA sites consumed 21% of impressions and 15% of ad spend** in the studied buys. [23] MFA sites are \"generally designed to fool digital advertising buyers\": they show *high* measurability, *good* viewability, *low* IVT, and \"brand-safe environments\" — precisely the metrics a conventional verification stack rewards. [23]\n- The broader frame: the ~$88B open-web programmatic ecosystem is \"rife with waste,\" and the study estimated advertisers could recover on the order of $20B in efficiency by, among other steps, **excluding MFA inventory** unless specifically wanted. [23]\n\n**Significance for CTV.** The MFA finding is the load-bearing bridge between web brand safety and the FAST-channel problem. MFA is the *inverse* of the classic brand-safety failure: the content is not unsafe, it is *worthless* — arbitraged inventory engineered to pass every safety and viewability check while delivering no real attention. The FAST explosion (thousands of low-cost, ad-saturated channels) is the CTV analogue, and the study's central correction is that **a \"brand-safe, viewable, low-IVT\" label can co-exist with near-zero value.** Verification metrics that web brand safety treats as proof of quality are exactly the metrics MFA is engineered to satisfy. This is why the discipline's frontier — taken up elsewhere in the live debates over suitability — is moving from \"is it safe?\" to \"is it suitable *and* valuable?\" — a shift this primary text documents with hard numbers.\n\n### D.3 — TAG (Trustworthy Accountability Group) certification programs\n\n**Citation:** Trustworthy Accountability Group, *Certified Against Fraud Program*, *Brand Safety Certified Program*, and the *TAG IVT Taxonomy v2.0*; tagtoday.net / tagtrust.net. Read via program descriptions; the IVT Taxonomy referenced (and distinguished from the MRC standard per B.2). Accessed 2026-06-17. [24]\n\n**Context and direct reading.** TAG is an industry self-regulatory body (founded by the ANA, 4A's, and IAB) that runs *certification* rather than measurement. Its \"Certified Against Fraud\" seal certifies that a company applies anti-fraud practices; its \"Brand Safety Certified\" program certifies brand-safety controls. TAG also maintains its own *IVT Taxonomy v2.0* — which, as the MRC standard expressly notes (B.2), \"was not expressly created for MRC IVT audit purposes\" and should not be conflated with the MRC's GIVT/SIVT definitions. [9][24]\n\n**Significance.** TAG matters as the *certification* layer atop the MRC's *measurement* layer and IAB Tech Lab's *protocol* layer — a third governance modality (seal-of-approval) distinct from accreditation and specification. Its relevance to CTV is real but partial: certification attests to *process*, not to *per-impression* outcomes, and the MRC's explicit refusal to equate the two IVT taxonomies is the primary-text warning against treating a TAG seal as an MRC-grade measurement guarantee. It is worth keeping the three layers distinct: TAG certifies, the MRC measures, IAB Tech Lab specifies.\n\n---\n\n## E. Regulatory Texts as They Bear on CTV Advertising\n\nNone of these statutes regulates brand *safety* — content suitability — directly. They regulate *targeting*: the data flows that decide which ad runs against which viewer, plus platform transparency. They are load-bearing for the regional chapters, and each is routinely misdescribed as \"brand-safety law\" when it is targeting and transparency law.\n\n### E.1 — EU Digital Services Act, Articles 26 and 28\n\n**Citation:** Regulation (EU) 2022/2065 (Digital Services Act), Articles 26 and 28. Official text at EUR-Lex (eli/reg/2022/2065). Accessed 2026-06-17. [16]\n\n**Direct reading.** Article 26 (\"Advertising on online platforms\") imposes **per-impression transparency**: a platform must ensure the recipient can identify, \"in a clear, concise and unambiguous manner and in real time,\" that the item is an advertisement; on whose behalf it is presented; who paid for it if different; and \"meaningful information… about the main parameters used to determine the recipient\" of the ad, plus how to change them. [16] Article 26(3) adds a **targeting prohibition**: platforms \"shall not present advertisements… based on profiling… using special categories of personal data referred to in Article 9(1) [GDPR]\" — i.e., no ad targeting on sensitive data (health, religion, sexual orientation, etc.). [16] Article 28(2) extends this to minors: platforms shall not present advertising \"based on profiling… using personal data of the recipient… when they are aware with reasonable certainty that the recipient… is a minor.\" [16]\n\n**Significance for CTV.** Two things connect this statute to the CTV ad stack. First, Article 26's real-time disclosure is exactly what the VAST CTV Addendum's `<Icon regs=\"1\">` flag (A.1) is built to satisfy — a direct spec-to-statute linkage, and one of the few places a privacy/transparency statute is operationalized inside an ad-serving spec. Second, the sensitive-data and minors prohibitions constrain CTV's most valuable asset: deterministic, household-level, ACR-derived targeting. In the EU, a CTV platform with rich viewing profiles cannot lawfully draw special-category inferences or target minors by profile. The DSA does not say \"run safe content\"; it says \"do not target on these data, and disclose how you targeted.\"\n\n### E.2 — India's Digital Personal Data Protection (DPDP) Act 2023, Section 9 — AND the DPDP Rules 2025\n\n**Citation:** *Digital Personal Data Protection Act, 2023* (India), Section 9; *Digital Personal Data Protection Rules, 2025*, notified by MeitY on 13 November 2025 via Gazette G.S.R. 846(E), Rule 10 (children's data). Statutory and rules text. Accessed 2026-06-17. [17][25]\n\n**Direct reading — the statute (verbatim).** Section 9 is unusually blunt for an adtech-relevant statute:\n\n- **9(1):** \"The Data Fiduciary shall, before processing any personal data of a child… obtain verifiable consent of the parent… or the lawful guardian.\" [17] A \"child\" is anyone under 18 — a notably high threshold versus GDPR's 16/13.\n- **9(2):** A Data Fiduciary \"shall not undertake such processing… that is likely to cause any detrimental effect on the well-being of a child.\" [17]\n- **9(3):** \"A Data Fiduciary shall not undertake tracking or behavioural monitoring of children or targeted advertising directed at children.\" [17]\n- **9(4)/9(5):** The Central Government *may* exempt classes of fiduciaries or purposes from (1) and (3), and *may* lower the effective age threshold for fiduciaries that process children's data \"verifiably safe[ly].\" [17]\n\n**Direct reading — the Rules.** The DPDP Rules are no longer \"still being finalized,\" as they were once described. The **DPDP Rules 2025 were notified on 13 November 2025** (Gazette G.S.R. 846(E)). [25] **Rule 10** operationalizes Section 9: Data Fiduciaries must obtain *verifiable parental consent* before processing a child's data and must deploy technical measures to detect and prevent processing without verified parental consent. [25] The Rules set an **eighteen-month phased compliance window** for the core operational obligations (Rules 3, 5–16, 22, 23), with **full compliance due by 13 May 2027.** [25] The behavioural-tracking and child-targeting prohibitions of Section 9(3) carry through: platforms \"must not track, monitor, or profile children, or engage in behavioural targeting directed at children,\" and \"must not serve targeted advertising to children.\" [25]\n\n**Significance and the corrected caveat.** On its face, Section 9(3) is a **flat ban** on behavioural tracking and targeted advertising directed at under-18s, with no consent-based override (consent satisfies 9(1), not 9(3)). For a CTV market like India's — large, mobile-first, with substantial family and children's AVOD viewing — this is the most restrictive children's-advertising provision among the regions surveyed here. The *previously open* caveat (operative scope pending the Rules) is now **resolved in the direction of the statute's plain text**: the November 2025 Rules confirm the children's-data regime and set a hard 2027 compliance deadline rather than diluting the ban. So the claim \"India bans targeted ads to children\" is now supportable as *both* the statute's text *and* the notified Rules — pending only enforcement practice, which will not be observable until after the May 2027 deadline.\n\n### E.3 — Brazil's LGPD (Art. 14) and the ANPD's children's-data position\n\n**Citation:** *Lei Geral de Proteção de Dados* (LGPD, Law 13.709/2018), Article 14; ANPD Statement CD/ANPD No. 1/2023 (May 2023); pending \"Digital ECA\" child-online-safety bill. Accessed 2026-06-17. [18]\n\n**Direct reading.** LGPD Article 14 governs processing of children's and adolescents' data, requiring it be in their \"best interest\" and, where consent is the basis, that it be given by a parent/guardian \"in a specific and conspicuous way.\" [18] The frequently-misreported point is the **legal basis**: the ANPD's May 2023 Statement clarified that processing children's/adolescents' data \"can be relied on any lawful basis provided for in Articles 7 and 11 of the LGPD, and it does not require… consent in every case\" — i.e., consent is *not* the sole gateway. [18] Brazil's pending \"Digital ECA\" child-online-safety bill goes further, prohibiting profiling-based advertising to minors and barring emotional-analysis/AR/VR for advertising. [18]\n\n**Significance.** Brazil is the largest LATAM CTV market and one of its highest-IVT markets. The regulatory texture differs from India's flat ban: LGPD permits multiple legal bases for children's data, but the trajectory — the Digital ECA — points toward an India-style profiling prohibition. LGPD should not be equated with GDPR or DPDP. Its consent architecture is more permissive, and the children's-advertising profiling restriction is mostly *prospective* — in the pending ECA, not yet fully in force.\n\n### E.4 — GDPR and the IAB Europe TCF: the Belgian litigation, read through to 2026\n\n**Citation:** GDPR (Regulation 2016/679), Arts. 6 (legal bases) and 9 (special categories); Belgian Data Protection Authority (APD/GBA) decision on IAB Europe's Transparency & Consent Framework (Feb 2022, €250,000 fine); Brussels Market Court ruling, 14 May 2025; Brussels Market Court ruling, 7 January 2026; TCF v2.3 (released 19 June 2025, mandatory from 28 Feb 2026). Accessed 2026-06-17. [19][26]\n\n**Direct reading.** GDPR Art. 6 requires a lawful basis (consent, legitimate interest, etc.) for any processing; Art. 9 prohibits processing special-category data absent specific conditions. The **IAB Europe Transparency & Consent Framework (TCF)** is the adtech industry's mechanism for collecting and signalling consent via a \"TC String.\" The litigation, read in sequence:\n\n- **Feb 2022 (APD decision):** the Belgian DPA found IAB Europe was a *data controller* for the TC String and that the framework infringed GDPR; €250,000 fine plus an action plan. [19]\n- **14 May 2025 (Brussels Market Court):** the Court held IAB Europe was a **joint controller** for the *creation and use of the TC String* — but **not** for how downstream TCF participants process personal data (e.g., for targeted advertising). It confirmed the TC String is personal data when combined with an IP address, and **upheld most GDPR-violation findings and the €250,000 fine** (Arts. 5.1.a/6 legal basis; 12–14 transparency; 24/25/5.1.f/32 security; 30 records; 35 DPIA; 37 DPO). [26]\n- **7 January 2026 (Brussels Market Court — the going-concern update):** the Court **annulled** the APD's determination requiring changes to the TCF *beyond* IAB Europe's controllership, and **referred the matter back to the APD** to reassess the action plan and give IAB Europe an opportunity to respond before a new decision. [26] Trade coverage framed this as a partial IAB Europe win — the framework was *not* ordered dismantled.\n- **Versioning:** **TCF v2.3** was released **19 June 2025** with a transition period through **28 February 2026**, after which it is the expected standard. [26]\n\n**Significance and the correction.** The TCF is the consent plumbing beneath open-market programmatic in the EU, and CTV programmatic inherits it. The widely-circulated claim that \"a court ruled the TCF illegal\" is **a misread on two counts.** First, the May 2025 ruling found *specific* GDPR non-compliance and narrowed IAB Europe's controllership to the TC String — it did not declare the framework illegal. Second, the **January 2026** ruling went further in IAB Europe's favour, annulling part of the APD's order and sending it back. The accurate, current picture is therefore: the EU's primary adtech consent mechanism has been found partially non-compliant and has had its governing body's liability *narrowed*, with the regulator now required to redo part of its remedy — sustained legal pressure, not illegality, and a litigation posture that has *softened* for IAB Europe since 2025. That is the regulatory backdrop against which EU CTV targeting operates as of mid-2026.\n\n---\n\n## F. Vendor Fraud-Lab Reports as Primary Evidence of Fraud Method\n\nThese are vendor-published, commercially-interested documents. They are **Tier 1 for the fraud mechanisms they describe** — the vendor caught and reverse-engineered the scheme — and **not Tier 1 for the dollar-impact or prevalence figures**, which are self-interested and unaudited. Read them for *method*; flag them for *magnitude*. Their value as primary sources is that they characterize SIVT *before* it hardens into a list-based GIVT check (per B.2's \"moving boundary\").\n\n### F.1 — DoubleVerify Fraud Lab: SneakyTerra (SSAI session hijacking)\n\n**Citation:** DoubleVerify Fraud Lab, *FraudLab Flash Report: Sophisticated SSAI Scheme Hijacks Real CTV Device Sessions* (\"SneakyTerra\"), and DoubleVerify press release, 4 March 2021. Accessed 2026-06-17. [20]\n\n**Direct reading — the mechanism.** SneakyTerra is, per DV, \"the first-ever server-side ad insertion (SSAI) scheme known to hijack real CTV device sessions.\" [20] The method, read directly from the report's three-phase walkthrough:\n\n- **Phase 1 (execute SSAI fraud):** fraudsters spoof impression opportunities; multiple advertisers bid on and win what they believe is real inventory, but \"the impression data has been spoofed… the opportunity isn't real.\" [20]\n- **Phase 2 (store winning bids):** fraudsters store the won creatives \"for future use.\" [20]\n- **Phase 3 (hijack a real session):** they \"obtain impression trackers from multiple ads through spoofed SSAI calls,\" insert all those trackers \"into one ad,\" and serve that single creative to a *real* CTV device during a *real* viewing session. \"Although only one ad is seen, impressions for multiple ads are generated.\" [20]\n\nThe report says, in DV's own words, why this is uniquely a CTV problem: the scheme is \"more difficult to detect than previous SSAI schemes\" because \"the ad calls… all serve on real devices.\" [20] And it states the structural reason third-party blocking is hard in CTV — DV's filtering matters because CTV is an environment \"where blocking fraudulent, non-brand safe or non-brand suitable and out-of-geo impressions requires a technology standard called **VPAID, which is not supported in CTV**.\" [20] DV reports its Fraud Lab \"caught and stopped 12 SSAI schemes\" over the prior year, naming LeoTerra and ParrotTerra as predecessors. [20]\n\n**Magnitude claims (flagged).** DV's related communications put SneakyTerra at a peak of \"over 2 million devices each day\" and potential cost \"more than $5M per month… based on an average $20 CPM.\" [20] These are **vendor estimates, unaudited**; cite as DV's claim, not as established fact.\n\n**Significance.** SneakyTerra is the canonical primary example of why SSAI breaks web fraud assumptions. In client-side ad insertion, the device's own signals can be inspected; in SSAI, the ad server stitches ads into the stream server-side, so the impression-tracker calls can be **decoupled from the real device** and multiplied. The scheme corroborates, from the field, exactly the SIVT category the MRC standard names (\"SSAI spoofing,\" B.2) and the verification gap the VAST Addendum implies (\"VPAID, not supported in CTV,\" A.1). It is the load-bearing specimen connecting the standards documents to observed CTV fraud.\n\n### F.2 — Pixalate CTV benchmarks: SSAI proxy and Bundle-ID (App-ID) spoofing, quantified\n\n**Citation:** Pixalate, *Global Q1 2024 Server-Side Ad Insertion (SSAI) Benchmark Report for Connected TV* (3 July 2024); *Top 11 Roku CTV Ad Fraud Types, Q1 2024*; *Top 11 Amazon Fire CTV Ad Fraud Types, Q1 2024*; *Top 8 Samsung CTV Ad Fraud Types, Q1 2024*; *Q1 2025 Malformed & Fraudulent CTV Bundle IDs Risk Report*. Read via the published benchmark findings and press releases. Accessed 2026-06-17. [21]\n\n**Direct reading — method and field prevalence.** Pixalate's CTV benchmarks are the primary quantitative evidence that the MRC's two named CTV-specific SIVT categories (SSAI spoofing; App-ID/domain misrepresentation, B.2) are not theoretical:\n\n- **SSAI is now near-ubiquitous and fraud-elevated.** Pixalate reports ~**85% of CTV apps use SSAI** for open programmatic (up from ~78% in H2 2023), and that **SSAI traffic carries ~140% higher IVT** than non-SSAI CTV traffic; non-transparent SSAI runs ~20% higher IVT than transparent SSAI. [21]\n- **The dominant fraud type differs by platform — and maps to the MRC categories.** On **Roku**, \"Invalid SSAI (Proxy)\" is the No. 1 fraud type, ~**40% of all IVT** (impacting 2,000+ apps). On **Amazon Fire TV**, \"Bundle ID (App) Spoofing\" is No. 1 at ~**60% of IVT**, with Invalid SSAI second (~17%). On **Samsung**, Bundle-ID spoofing is again No. 1 (~43% of IVT), SSAI proxy second (~30%). [21]\n- **Bundle-ID hygiene is poor.** In Q1 2025, Pixalate found ~**3% of CTV Bundle IDs malformed/unidentified/fraudulent**, and only ~51% of Roku-traffic Bundle IDs used the recommended actual App-Store ID. [21]\n\n**Magnitude caveat (flagged).** These are **Pixalate's measurements**, not independently audited figures; prevalence depends on Pixalate's detection methodology and sample. Cite as vendor measurement of fraud *method and pattern*, robust as corroboration of the MRC categories, but treat the precise percentages as vendor data, not settled fact.\n\n**Significance.** Where DoubleVerify's SneakyTerra (F.1) gives the *mechanism* of one named SSAI scheme, Pixalate's benchmarks give the *field prevalence* of the two MRC SIVT categories across the major CTV platforms — and crucially, that the dominant fraud type is *platform-specific* (SSAI-proxy on Roku; bundle-ID spoofing on Fire TV/Samsung). This is primary evidence that CTV fraud is not one problem but a platform-shaped distribution of the same two MRC-defined SIVT categories — the empirical complement to the standards-text reading in B.2.\n\n---\n\n## Cross-Reading: How the Documents Fit Together\n\nRead as a system, the texts answer different questions, and the central claim of CTV brand safety is visible in the *gaps between* them:\n\n- **Identity / measurement** (VAST CTV Addendum, A.1): *what is this ad, and can it be measured?* Answer: OMID, not VPAID — measurement is harder in CTV.\n- **Impression description** (OpenRTB 2.6, A.2): *what content is this ad running against?* Answer: optional, publisher-declared metadata; no URL ground truth.\n- **Authorization / supply integrity** (ads.txt, sellers.json, schain, A.3–A.4): *who is authorized to sell this, and is the path real?* Answer: verifiable, but only when buyers refuse incomplete chains.\n- **Content classification** (GARM framework + Content Taxonomy, C.1, A.5): *is this content suitable?* Answer: twelve categories, advertiser-configurable tiers — but only as good as the (weak) CTV classification layer.\n- **Measurement rules / fraud definition** (MRC, B.1–B.2): *what counts as viewable and what counts as fraud?* Answer: web viewability doesn't transfer; SSAI- and App-ID-spoofing are named SIVT.\n- **Buy-side practice** (4A's APB, ANA MFA study, TAG, D.1–D.3): *what should advertisers demand?* Answer: exclude MFA; certify process; remember \"safe + viewable\" can still be worthless.\n- **Targeting / transparency law** (DSA, DPDP, LGPD, GDPR/TCF, E.1–E.4): *how may the ad be targeted and disclosed?* Answer: constrains ACR profiling, sensitive data, and ads to children — not content.\n- **Observed fraud** (DV SneakyTerra, Pixalate benchmarks, F.1–F.2): *does the fraud the standards name actually happen?* Answer: yes, mechanism and field-prevalence both documented.\n\nOne fact emerges above the rest when you read them together: **no document in this stack closes the content-suitability gap in CTV.** OpenRTB defines the metadata fields but doesn't require honest population. The GARM/Taxonomy framework defines the categories but doesn't detect content. The VAST Addendum defines verification presence but can't run client-side measurement in SSAI. The statutes regulate targeting, not content. Brand safety in CTV is therefore an *assembled* discipline — a buying policy stitched across voluntary specs, an accreditation regime, a de-branded taxonomy, and a patchwork of targeting law — with the content-suitability layer the weakest seam.\n\n---\n\n## Open Questions\n\n1. **What does the VAST CTV Addendum's verification path actually guarantee in a fully server-side SSAI environment?** OMID/`<AdVerification>` presupposes an SDK in a rendering client. When the ad is stitched server-side and delivered to a TV app with no OM SDK, what verification survives? The Addendum documents the *fields*; it does not resolve whether measurement *executes* in pure-SSAI CTV.\n2. **Is there a maintained, public, post-2024 governance process for updating the GARM categories, or only a frozen taxonomy?** The categories live in Content Taxonomy 3.1 and the benchmark repo, but who has authority to *add a category* (the way Misinformation was added in 2021) now that GARM is dissolved and X's appeal keeps antitrust exposure live? The benchmark repo references the GARM committee for label disputes — does that committee still convene?\n3. **How are the OpenRTB Content-object fields populated in practice in each region's CTV supply?** The spec defines `series`/`season`/`episode`/`genres`/`channel`/`network`, but field-population rates and accuracy are empirical and vary by platform (Roku vs. Samsung vs. Amazon) and region. Not resolvable from the spec.\n4. **What enforcement practice will India's DPDP Rule 10 produce after the 13 May 2027 deadline?** The statute and the notified 2025 Rules both read as a flat ban on child-targeted advertising; what \"verifiable parental consent\" technically requires, and how the Data Protection Board enforces 9(3) against AVOD platforms, will not be observable until post-2027.\n5. **Does any CTV-specific MRC measurement standard formally supersede the web 50%/2s viewability rule, and with what thresholds?** The web rule does not transfer; the precise CTV viewability/completion standard the MRC accredits against should be read in its own operative text.\n6. **Will X's 5th Circuit appeal revive the antitrust theory, and does the *threat* of the appeal chill a GARM successor regardless?** The March 2026 dismissal removed the legal theory at the district level, but X's notice of appeal keeps it live; the deterrent (\"sued into dissolution regardless of merits\") may persist independent of the appeal's outcome.\n7. **How does the January 2026 Brussels Market Court remand resolve at the APD?** The court sent the TCF action plan back to the regulator; the new APD decision (post-remand) will determine the operative compliance posture for EU CTV programmatic — not yet issued as of mid-2026.\n\n---\n\n## Sources\n\n1. IAB Tech Lab, *VAST CTV Addendum 2024*, July 2024, https://iabtechlab.com/wp-content/uploads/2024/07/VAST-CTV-Addendum-2024-FINAL.pdf and GitHub (InteractiveAdvertisingBureau/vast) — **Tier 1** (the spec). Primary text on CTV ad-ID (`UniversalAdId` back-port), OMID verification path, VPAID deprecation, DSA `<Icon>` integration. Read directly.\n2. IAB Tech Lab, *VAST 4.3*, December 2022, https://iabtechlab.com/standards/vast/ — **Tier 1**. Current VAST major version; SIMID/OMID alignment, VPAID deprecation.\n3. IAB Tech Lab, *OpenRTB Specification v2.6*, April 2022, GitHub canonical (2.6.md) — **Tier 1**. Content/Channel/Network/App object definitions for CTV. Read directly.\n4. IAB Tech Lab, *ads.txt / app-ads.txt Specification & 1.1 Implementation Guide*, 2022, https://iabtechlab.com/ads-txt/ — **Tier 1**. Authorized-seller standard and its CTV app-store lookup.\n5. AdTechExplained / specialist trade analysis, *Ads.txt for CTV Explained* — **Tier 5** (specialist commentary). app-ads.txt CTV operation, Roku/Apple/console gaps, `inventorypartnerdomain`. Labeled commentary on the spec.\n6. IAB Tech Lab, *sellers.json Specification* (July 2019) & FAQ (Sept 2020), https://iabtechlab.com/sellers-json/ — **Tier 1**. Seller-disclosure standard.\n7. IAB Tech Lab, *SupplyChain Object* spec, GitHub canonical (supplychainobject.md) — **Tier 1**. `schain` node structure, `complete` flag, `asi`/`sid`. Read directly.\n8. MRC/IAB, *Viewable Ad Impression Measurement Guidelines* (50%/1s display, 50%/2s video) — **Tier 1/2** (measurement standard). Read via operative thresholds; full CTV-specific MRC text not consulted directly.\n9. Media Rating Council, *Invalid Traffic Detection and Filtration Standards Addendum* (Final), June 2020 (~55 pp.) — **Tier 1**. GIVT/SIVT definitions incl. SSAI spoofing and App-ID spoofing; explicit non-equivalence to TAG IVT Taxonomy. Read directly via PDF extraction.\n10. GARM/WFA, *Brand Safety Floor + Suitability Framework*, Sept 2020 (Misinformation added 2021; \"23 Sept\" version), ana.net / wfanet.org — **Tier 1**. All 11/12 categories, Floor + High/Med/Low tiers, verbatim. Read directly via PDF extraction.\n11. CNBC, \"Ad group suspends GARM after X, Elon Musk's antitrust lawsuit,\" 8 Aug 2024; Marketing Dive, \"GARM shutters following X antitrust suit,\" Aug 2024 — **Tier 3/4**. GARM discontinuation date (Aug 2024) and WFA's stated rationale (resources/finances drained).\n12. The Next Web / The Drum / MM&M, \"Judge dismisses X's antitrust lawsuit… with prejudice,\" March 2026 — **Tier 4**. Dismissal with prejudice and quoted ruling language (\"the very nature of the alleged conspiracy does not state an antitrust claim\").\n13. IAB Tech Lab, *Content Taxonomy* standards page + *Content Taxonomy 3.1* (announced 11 Dec 2024; comment through 24 Jan 2025) + *Implementation Guide for Brand Suitability with the Content Taxonomy*, https://iabtechlab.com/standards/content-taxonomy/ — **Tier 1**. Current taxonomy version; Sensitive Topics node; GARM no longer foregrounded by name.\n14. IABTechLab/Brand-Suitability-Test-Benchmarks, GitHub — **Tier 1** (the artifact). GARM-standard human-labeled content benchmark; label challenge via pull request.\n15. 4A's Advertiser Protection Bureau, *Brand Safety / Brand Suitability Framework*, 2018, aaaa.org — **Tier 1** (the framework) / **Tier 5** (description). Buy-side guidance; predates GARM; not a post-GARM successor body.\n16. Regulation (EU) 2022/2065 (Digital Services Act), Arts. 26, 28; EUR-Lex (eli/reg/2022/2065) — **Tier 1**. Per-impression transparency; sensitive-data and minors targeting prohibitions.\n17. *Digital Personal Data Protection Act, 2023* (India), Section 9 — **Tier 1**. Verifiable parental consent; flat ban on tracking/behavioural monitoring/targeted advertising directed at children (under 18).\n18. *Lei Geral de Proteção de Dados* (LGPD, Law 13.709/2018), Art. 14; ANPD Statement CD/ANPD No. 1/2023 (May 2023); pending \"Digital ECA\" bill — **Tier 1** (statute/ANPD) / **Tier 4** (ECA reporting). Multiple legal bases for children's data; prospective profiling-ad ban.\n19. Belgian DPA (APD/GBA) decision on IAB Europe TCF, Feb 2022 (€250k fine); GDPR Arts. 6, 9 — **Tier 1**. Controllership and infringement findings; consent plumbing for EU programmatic.\n20. DoubleVerify Fraud Lab, *FraudLab Flash Report: SneakyTerra* + press release, 4 March 2021 — **Tier 1 for method**, vendor estimate for magnitude. First SSAI scheme to hijack real CTV device sessions; \"VPAID not supported in CTV\"; 3-phase mechanism. $5M/month and 2M devices/day figures flagged as unaudited DV estimates.\n21. Pixalate, *Global Q1 2024 SSAI Benchmark for CTV* (3 July 2024); Roku/Fire/Samsung *Top CTV Ad Fraud Types Q1 2024*; *Q1 2025 Bundle ID Risk Report* — **Tier 1 for method/pattern**, vendor measurement for prevalence. SSAI ~85% adoption / +140% IVT; Roku SSAI-proxy 40% of IVT; Fire/Samsung bundle-ID spoofing dominant. Percentages flagged as vendor data.\n22. Bloomberg, \"X Loses Lawsuit Over Alleged Advertiser Boycott,\" 26 Mar 2026; CBC News, \"Judge hands defeat to Musk's X,\" Mar 2026; MediaPost, \"Musk Appeals Dismissal Of Ad Boycott Suit Against WFA,\" 28 Apr 2026 — **Tier 3/4/5**. Verified dismissal date (26–27 March 2026, NOT 2025), Judge Jane Boyle (N.D. Tex.), with-prejudice status, and X's notice of appeal to the 5th Circuit.\n23. Association of National Advertisers (ANA), *Programmatic Media Supply Chain Transparency Study* — First Look June 2023, full report Dec 2023, ana.net — **Tier 1** (the study) / **Tier 5** (interpretation). MFA = 21% of impressions / 15% of spend; ~$20B recoverable efficiency; MFA passes safety/viewability/IVT checks.\n24. Trustworthy Accountability Group (TAG), *Certified Against Fraud* / *Brand Safety Certified* programs + *IVT Taxonomy v2.0*, tagtoday.net — **Tier 1** (programs). Certification (not measurement) layer; IVT taxonomy distinct from MRC's per the MRC standard.\n25. *Digital Personal Data Protection Rules, 2025* (India), notified by MeitY 13 Nov 2025 (Gazette G.S.R. 846(E)), Rule 10; PIB notification; India-Briefing/EY/Seclore compliance guides — **Tier 1** (the Rules) / **Tier 5** (guides). Children's-data operationalization; 18-month phased compliance; full compliance by 13 May 2027. Confirms the Rules are notified, not still being finalized.\n26. Brussels Market Court ruling 14 May 2025 (DLA Piper/Freshfields/Lewis Silkin analyses; €250k fine upheld, joint-controller for TC String) and ruling 7 Jan 2026 (OneTrust/IAB Europe FAQ Jan 2026; APD order partly annulled, remanded); TCF v2.3 (released 19 June 2025, mandatory 28 Feb 2026) — **Tier 1** (rulings) / **Tier 5** (legal-analysis blogs). Corrects the \"court ruled TCF illegal\" misread; documents the 2025→2026 softening for IAB Europe.\n\n---\n\n*These pages are the grounding text for everything that follows: where a spec, framework, statute, or fraud report is invoked, the direct reading is here. Present-tense status claims are dated to mid-2026; the four most volatile — GARM's status, the X-suit outcome and appeal, the DPDP Rules' commencement, and the TCF litigation posture — are stated as of that date, with a note wherever common accounts or t
