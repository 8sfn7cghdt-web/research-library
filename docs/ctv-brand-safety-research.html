/* ── animated reveal on scroll (corpus-visuals) ──────────────────────────────
   Figures and their marks start hidden ONLY after the page JS adds .reveal-armed
   (it skips this under prefers-reduced-motion), so with no-JS or reduced motion
   everything is fully visible by default — motion is purely additive. When a
   figure scrolls into view the observer adds .is-revealed and CSS does the rest.
   The cv-* classes are a shared reveal vocabulary used by BOTH the build-time viz
   charts and hand-authored corpus-fig figures; the per-mark `--d` var staggers

.reveal-armed.is-revealed { opacity: 1; transform: none; }
.reveal-armed .cv-fade { opacity: 0; transition: opacity .6s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-fade { opacity: 1; }
.reveal-armed .cv-rise { opacity: 0; transform: translateY(10px);
  transition: opacity .6s var(--cv-ease) var(--d, 0s), transform .6s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-rise { opacity: 1; transform: none; }
.reveal-armed .cv-grow-up { transform: scaleY(0); transform-box: fill-box; transform-origin: bottom;
  transition: transform .85s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-grow-up { transform: scaleY(1); }
.reveal-armed .cv-grow-right { transform: scaleX(0); transform-box: fill-box; transform-origin: left;
  transition: transform .85s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-grow-right { transform: scaleX(1); }
.reveal-armed .cv-draw { stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset 1.15s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-draw { stroke-dashoffset: 0; }
.reveal-armed .cv-spin { opacity: 0; transform: rotate(-55deg) scale(.72); transform-box: fill-box;
  transform-origin: center; transition: transform .95s var(--cv-ease) var(--d, 0s), opacity .7s var(--cv-ease) var(--d, 0s); }

<script id="corpus-data" type="application/json">{"slug": "ctv-brand-safety-research", "title": "Safe Beside What?", "subtitle": "Brand safety in programmatic Connected TV — and the global fight over who sets the floor", "author": "", "generated": "2026-06-17", "documents": [{"order": 0, "file": "00_Briefing.md", "title": "Programmatic CTV Brand Safety Across the Globe", "summary": "", "body": "# Programmatic CTV Brand Safety Across the Globe\n\n> **The single sentence.** Brand safety was built for a web of page URLs, JavaScript tags, and cookies; Connected TV took every one of those away at the moment streaming reached scale — and the body that would have written CTV's content-suitability rules dissolved in a political and legal fight just as the channel needed it most.\n\n## Bottom Line\n\nBrand safety as an instrumented, vendor-served discipline is barely a decade old. It congealed between 2014 and 2020 out of web and mobile crises — ad fraud, unviewable impressions, the 2017 YouTube \"adpocalypse,\" and Procter & Gamble's transparency ultimatum — and the apparatus it produced assumed an observable page: a URL to crawl, a browser to run a verification script, a cookie to drop. **Connected TV negates all three.** A CTV impression carries an app bundle ID, not a page URL — like knowing your ad ran \"somewhere on Pluto TV\" without knowing the program. The content-level metadata that would tell you *which show* exists in the protocol but arrives sparsely (one 2024 analysis found an average of ~0.73 usable content categories per program). Most CTV devices cannot run the JavaScript that powers web verification, so render-time blocking — the web's strongest safety control — largely disappears, and enforcement shifts to a data-starved pre-bid gate. Server-side ad insertion (SSAI), the dominant delivery method, severs the client-side data trail and has been weaponized into the channel's largest fraud schemes. Invalid-traffic rates run an order of magnitude above protected web inventory — roughly 18% globally in 2025, far higher in some regions and devices.\n\nOnto that technical substrate landed a governance rupture. The **Global Alliance for Responsible Media (GARM)** — the advertiser-side body whose Brand Safety Floor and Suitability Framework gave the whole ecosystem its shared vocabulary — was sued by Elon Musk's X in August 2024 and dissolved within days, just as CTV reached scale. A U.S. court dismissed X's antitrust suit *with prejudice* in March 2026 (now under appeal), but vindication came too late to revive the body, and the U.S. Federal Trade Commission has since extracted consent orders from the largest agency holding companies barring coordinated, politically-keyed brand-safety standards. The result is a genuine governance vacuum: the suitability framework survives as orphaned text inside IAB Tech Lab's taxonomy, with no neutral body to evolve it for CTV's new questions — and a U.S. legal posture that now treats *coordination itself* as suspect, even as the EU's Digital Services Act pushes in the opposite direction, toward mandatory platform-level safety.\n\nThe verification market that does the measuring has consolidated to a near-duopoly that is itself in flux: **DoubleVerify** (public, NYSE: DV, FY2025 revenue $748M) and **Integral Ad Science** (taken private by Novacap in December 2025), with Oracle's Moat/Grapeshot gone (2024) and challenger Scope3 having exited verification entirely (selling its Adloox unit to Peer39 in June 2026). Globally, brand safety is not one discipline but four or five, each shaped by its region's binding constraint — U.S. politicization, EU consent law, India's incoming privacy regime, LATAM's fraud crisis, Australia's staged reform. The forecast through 2030: continued growth (CTV passes linear TV around 2028) but a **fragmented floor** as the most likely governance outcome — suitability set by vendor defaults, per-advertiser lists, and platform policies rather than a shared standard — unless content-level transparency and AI classification mature fast enough, and under enough shared rules, to close the gap first.\n\n---\n\n## The Origin Story, in Five Beats\n\nThe history is not background; it is why the present looks the way it does.\n\n1. **The measurement crisis (2012–2016).** Programmatic scaled faster than buyers could verify what they bought. Fraud (Methbot, 2016) and non-viewability built the verification scaffolding — the MRC's 2014 viewability standard, TAG's 2014 founding — that brand safety would later run on. The lesson it bequeathed: *the buyer cannot see what it is buying.* CTV would restore that condition in a new form.\n\n2. **The hinge year (2017).** *The Times* of London reported ads beside extremist YouTube content; 250+ advertisers pulled spend in the \"adpocalypse,\" proving adjacency is a brand risk independent of fraud. Weeks earlier, P&G's Marc Pritchard gave the most consequential advertiser speech of the decade, turning voluntary verification standards into procurement requirements for anyone wanting the world's largest ad budget.\n\n3. **The vendors and the plumbing (2009–2021).** Integral Ad Science (founded as AdSafe Media, 2009), DoubleVerify, and Oracle's Moat/Grapeshot built the machinery; IAB Tech Lab built the files (ads.txt 2017, app-ads.txt 2019 — the first formal acknowledgment that CTV needed its own authorization plumbing). IAS and DV both IPO'd in 2021 and turned their war chests toward CTV.\n\n4. **GARM gives the field a shared language (2019–2020).** Launched at Cannes in 2019 under the World Federation of Advertisers, GARM's September 2020 Brand Safety Floor + Suitability Framework defined the content categories (eleven, plus Misinformation added in 2021) and the low/medium/high risk tiers that became the industry lingua franca — and the language CTV inherited.\n\n5. **The migration breaks the toolkit (2018 onward).** As cord-cutting and the FAST explosion moved audiences to streaming, the web-native stack could not follow: no URL, app-level not content-level transparency, SSAI severing measurement, ACR as a partial substitute, MFA-style opacity recurring at TV scale. The discipline has spent 2018–2026 rebuilding observability by other means — none a drop-in replacement for the JavaScript tag.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The Inflection Points: How CTV Brand Safety Got Here<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">2014<\/div><div class=\"tlbody\">MRC viewability standard; TAG founded — the verification scaffolding<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">2017<\/div><div class=\"tlbody\">YouTube &#x27;adpocalypse&#x27; + P&amp;G/Pritchard ultimatum — adjacency becomes board-level risk<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">2019-20<\/div><div class=\"tlbody\">GARM launches; Brand Safety Floor + Suitability Framework gives the field its shared language<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">2021<\/div><div class=\"tlbody\">DV and IAS IPO; war chests turn toward CTV<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">Aug 2024<\/div><div class=\"tlbody\">X sues GARM; WFA dissolves it within days — the governance vacuum opens<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">2025<\/div><div class=\"tlbody\">FTC consent orders bar coordinated brand-safety standards; IAS taken private<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">Mar 2026<\/div><div class=\"tlbody\">X suit dismissed with prejudice (now under appeal) — vindication too late to revive GARM<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">2026<\/div><div class=\"tlbody\">Content-level transparency ships (IAS Total TV, Gracenote-PubMatic) — at the premium head only<\/div><\/div><\/div><figcaption> <span class=\"credit\">Source: Synthesis of the sources cited throughout.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## Why CTV Is Different — the Technical Core\n\nThe central thesis: **every pillar web brand safety stood on is absent or degraded in CTV, while the channel's premium CPMs make it the most attractive target for organized fraud.**\n\n| Dimension | Web / mobile | Programmatic CTV |\n| --- | --- | --- |\n| Environment identifier | `site.page` URL — crawlable | `app.bundle` — container only, not content |\n| Content ground truth | Crawl and read the real page | Volunteered metadata, usually incomplete (~0.73 categories/program) |\n| Independent content check | Yes — vendor reads the page | No — nothing to crawl; ACR is walled-garden & post-hoc |\n| Verification execution | JavaScript tag in the browser | No JS on most devices; OMID partial |\n| Post-bid blocking | Yes — refuse to render | Largely no — enforcement shifts pre-bid |\n| Dominant delivery | Client-side, per impression | SSAI server-side stitching (severs client trail) |\n| Signature fraud | Domain spoofing, bot traffic | Device spoofing, bundle-ID spoofing, SSAI session-hijack |\n| Open-programmatic IVT | Low single digits (protected) | ~18% global, up to 36% by region/device |\n| Suitability vocabulary | GARM framework (mature) | Same framework, least-mature application; post-GARM vacuum |\n\nThe compensating moves are real but partial: content graphs (Gracenote, Peer39), ACR fingerprinting, the supply-chain transparency stack (app-ads.txt, sellers.json, the SupplyChain Object), and — the November 2025 frontier — cryptographic device attestation (OM SDK 1.6). The unsolved core is **consistent content-level transparency**: the most valuable layer, and the one still missing across the long tail.\n\n---\n\n## The Live Battlefield\n\nBrand safety in 2026 is a contested political and legal object as much as an engineering problem. Seven debates are live; four matter most.\n\n**The politicization.** Was GARM a responsible-media initiative or an illegal censorship cartel? A U.S. court answered the *antitrust* question in March 2026 — declining to advertise is not a boycott when no agreement to favor a competitor is alleged — dismissing X's suit with prejudice. But the FTC enforced the opposite theory by *settlement*, extracting consent orders from Omnicom/IPG (2025) and WPP, Publicis, and Dentsu (April 2026) that bar coordinated, politically-keyed brand-safety standards. A court vindicated one side; the executive branch enforced the other. The chilling effect on standards-setting is the through-line to every other debate.\n\n**News over-blocking.** Context-blind keyword blocklists demonetize suitable journalism at scale — one 2026 vendor analysis found ~54% of brand-safe Reuters news URLs would be needlessly blocked. The economic case (blunt tools waste money and starve newsrooms) is strongest kept separate from the newer political case; merging them lets opponents dismiss a real measurement problem as a partisan grievance.\n\n**The transparency fight.** CTV is, by some buy-side accounts, *less* transparent than YouTube — the walled garden the industry spent a decade criticizing. Publishers withhold show-level data to protect yield; buyers say they cannot verify what they cannot see. This is the structural fight beneath the FAST-sprawl and MFA debates.\n\n**AI classification and the fraud/suitability conflation.** Multimodal AI promises to finally read the *scene* rather than the URL — but accuracy and explainability lag the marketing, and independent research finds vendors' classifiers disagree with each other on the same content. Meanwhile independent researcher Adalytics has put the verifiers on the defensive about whether \"100% brand-safe\" marketing matches reality, and whether fraud filtering and content suitability are being honestly measured as distinct things.\n\n---\n\n## The World Is Not One Market — Six Regions, Different Binding Constraints\n\nBrand safety in programmatic CTV is shaped less by the technology of the impression than by each region's regulatory and market reality.\n\n- **United States** (~$33B 2025 → ~$38B 2026; the most mature and most contested market) — the binding constraint is **politicization**: FTC antitrust pressure, the post-GARM vacuum, free-speech politics. Privacy is a 20-state patchwork with no federal law; COPPA's 2025 amendments push children's CTV toward contextual, non-personalized ads.\n- **Canada** (~US$1.3–2.5B, an order of magnitude smaller) — the binding constraint is **regulation of data and content**, not brand-safety conduct: PIPEDA modernization (Bill C-36 tabled June 2026), Quebec's Law 25 (North America's strictest), and the Online Streaming Act's 15% Canadian-content levy (May 2026). A standards-*taker* importing the U.S./IAB toolkit, with no political weaponization.\n- **European Union** — the binding constraint is **consent legality**: the GDPR and the IAB Europe TCF litigation (narrowed in IAB Europe's favor in January 2026; TCF v2.3 mandatory from February 2026) plus the DSA's ad-transparency, minors-profiling ban, and €120M X fine. The question precedes suitability: *can the signals even be processed?* The UK leads; Germany and France are more broadcaster-direct.\n- **India** — the binding constraint is **a brand-new regime meeting an exploding market**: the DPDP Rules (notified November 2025, full compliance May 2027) impose verifiable-parental-consent and a near-categorical children's-targeting ban as CTV grows ~35%/year under JioStar/JioHotstar — against a documented trust gap and thin local verification.\n- **LATAM** — the binding constraint is **fraud**: Brazil's CTV IVT ran 43% and Mexico's 21% in Q2 2025 (Pixalate), the highest the vendor measures, so paying for *real* inventory precedes suitability. Brazil's ANPD is now an autonomous regulator; Mexico dissolved its independent INAI into an executive ministry in 2025.\n- **Australia** — the binding constraint is **staged, deliberately permissive reform**: the 2024 Privacy Act tranche tightened children's privacy but *excluded* advertising-targeting provisions for a pending tranche two. A mature BVOD market on a trusted currency (OzTAM VOZ) gives Australia the strongest safety baseline of the non-US/EU regions.\n\nThe unifying thread: **everywhere, privacy law is tightening the identifiers brand-safety and fraud tools depend on, while CTV's supply chain grows faster than its transparency standards.** The regions are at different points on the same collision course — Australia earliest and gentlest, the EU furthest and hardest, India and LATAM in the steepest part of the curve.\n\n---\n\n## The Forecast Through 2030, in Brief\n\nThe full scenarios are taken up in the outlook. In short: CTV keeps growing and passes linear TV around 2028, but the *governance* of brand safety is the open question, and the base rates pull toward fragmentation.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">US CTV Ad Spend — the Growth That Makes the Safety Gap Urgent ($B)<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">15<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">30<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">45<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">60<\/text><rect x=\"110.2\" y=\"119.7\" width=\"56.0\" height=\"130.3\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"138.2\" y=\"113.7\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">33.4$B<\/text><text x=\"138.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 138.2 268.0)\">2025<\/text><rect x=\"266.8\" y=\"101.8\" width=\"56.0\" height=\"148.2\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"294.8\" y=\"95.8\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">38$B<\/text><text x=\"294.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 294.8 268.0)\">2026<\/text><rect x=\"423.2\" y=\"66.7\" width=\"56.0\" height=\"183.3\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"451.2\" y=\"60.7\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">47$B<\/text><text x=\"451.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 451.2 268.0)\">2028 (passes …<\/text><rect x=\"579.8\" y=\"55.0\" width=\"56.0\" height=\"195.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.15s\"/><text x=\"607.8\" y=\"49.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50$B<\/text><text x=\"607.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 607.8 268.0)\">2029<\/text><\/svg><figcaption> <span class=\"credit\">Source: eMarketer forecasts as reported.<\/span><\/figcaption><\/figure>\n\n\n\n\n- **Fragmented Floor (35–45%, base case)** — no GARM successor; suitability set by vendor defaults, per-advertiser lists, and platform policies; content-level transparency real at the premium head, thin across the FAST tail. The base-rate center of gravity.\n- **Content-Level Resolution (18–25%)** — transparency (IAS Total TV, Gracenote–PubMatic) and accredited AI classification mature and diffuse *down-tail*; CTV's missing-URL problem gets engineered around; IAB Tech Lab becomes de facto steward.\n- **Walled-Garden Consolidation (12–18%)** — premium streamers and retail-media networks absorb CTV dollars into proprietary safety regimes; open programmatic shrinks.\n- **Fraud-and-Fragmentation Drift (12–18%)** — the problem outruns the tooling; IVT stays high; budgets flee to PMPs and gardens.\n- **Re-coordination Under Legal Cover (8–14%)** — the EU's DSA mandates safety and exports it (Brussels effect), or a U.S. legal clarification lets a neutral body reconstitute.\n\nThe deepest uncertainty is not technological — CTV's content problem is increasingly solvable — but institutional: **whether an industry told that coordination is suspect can build the shared rules its hardest problems require.**\n\n---\n\n## How to Read These Pages\n\n- **5 minutes:** this opening account.\n- **30 minutes:** this opening account, plus the chapter on why CTV is different technically, and the outlook on where it goes.\n- **The regional question:** the two regional deep-dives — the United States and Canada, and the EU, India, LATAM, and Australia.\n- **The politics:** the chapter on the live debates and tensions.\n- **To check any claim against the source:** the chapter on the primary sources and standards, which gives direct readings of the specs, frameworks, and statutes.\n- **The full version:** the chapters that follow, in order.\n\n---\n\n## Open Questions These Pages Leave Live\n\n1. Who, if anyone, inherits the GARM floor — a successor body, IAB Tech Lab by default, the DV/IAS product layer, or no one?\n2. Does content-level transparency reach the FAST long tail before 2030, or stall where it is least needed?\n3. Does AI content classification cross the accuracy/explainability threshold agencies *and* EU regulators will trust?\n4. Does the EU's mandatory-safety path export globally, or stay regionally contained against a permanently fragmented U.S.?\n5. Is the verification market a durable DoubleVerify-plus-private-IAS structure, or does a credible third verifier — or platform-native measurement — reshape it?\n\n---\n\n## A Note on Method and Honesty\n\nThis account draws on primary specifications, statutes, regulator and court documents, company filings, wire and trade reporting, and vendor research — the last used as evidence of *what an entity claims or how a scheme works*, never as independent proof of contested dollar figures or prevalence. Fraud magnitudes (IVT rates, scheme costs) are overwhelmingly single-vendor and are flagged as such throughout; their *direction* is corroborated, their *precise percentages* are not audited industry constants. Present-tense status claims about products, ad tiers, accreditations, and bodies carry recent dated sources, because that is exactly what goes stale — facts such as IAS's take-private, the X-suit dismissal date and appeal, the TCF version, and Mexico's dissolved regulator reflect the most recent material as of mid-2026. Where the evidence is thin or contested, these pages say so rather than smoothing it into false consensus."}, {"order": 1, "file": "01_Origins_And_History.md", "title": "Origins and History of Brand Safety and Suitability — From Web Display to Connected TV", "summary": "", "body": "# Origins and History: How Brand Safety Became a Discipline, and How It Did Not Quite Fit Into the Television\n\n## Bottom Line\n\nBrand safety as a named, instrumented, vendor-served discipline is younger than most people assume. It congealed between roughly 2014 and 2019 out of a sequence of crises in web and mobile display advertising: an industry-wide reckoning over ad fraud and unviewable impressions, a 2017 chain of advertiser boycotts triggered by ads appearing beside terrorist and extremist video on YouTube (the so-called \"adpocalypse\"), and a transparency ultimatum from the largest advertiser on earth, Procter & Gamble's Marc Pritchard. The scaffolding that resulted was built for a web-native world of page URLs, JavaScript tags, and tracking pixels: the Media Rating Council's 2014 viewability standard, the Trustworthy Accountability Group founded in 2014, IAB Tech Lab's ads.txt (2017) and app-ads.txt (2019), the verification vendors Integral Ad Science, DoubleVerify, and Oracle's Moat/Grapeshot, and finally the Global Alliance for Responsible Media (GARM) founded under the World Federation of Advertisers in 2019. That toolkit assumed an observable page, a measurable impression, and a cookie. Connected TV broke all three at once. As streaming scaled from roughly 2018 onward, the discipline had to be partly reinvented for an environment with no page URL, app-level rather than content-level transparency, server-side ad insertion that severs client-side measurement, automatic content recognition as a substitute signal, and an explosion of free ad-supported (FAST) channels. Then the governance story turned sharply political. GARM, the closest thing the field had to a global standards body, was sued by Elon Musk's X and shut down in August 2024 — leaving its Brand Safety Floor and Suitability Framework orphaned and the discipline without a coordinating center just as it entered the CTV era in earnest. This account traces those contingent decisions and inflection points, because everything that follows — including the forecast through 2030 — inherits both their technical assumptions and their unresolved governance vacuum.\n\n---\n\n## 1. What \"Brand Safety\" Means, and Why the Word Matters\n\nStart with a definition, because everything here depends on it. \"Brand safety\" in its narrow, original sense is **binary and protective**: keeping an advertiser's message away from content that would damage the brand by association — terrorism, hate speech, graphic violence, child sexual abuse material, piracy. \"Brand suitability\" is the **graduated, brand-specific successor concept**: not \"is this content universally unsafe?\" but \"is this content appropriate *for this particular brand, in this particular campaign, at this particular risk tolerance?*\" A beer brand and a children's toy brand share a safety floor but not a suitability profile [13]. This history runs along two intertwined migrations: binary safety to graduated suitability, and web to television. The two are entangled, because television — long-form, professionally produced, sparse in metadata — is exactly where blunt binary tooling fails most expensively.\n\nThe phrase \"brand safety\" is not neutral. To its practitioners it means consumer protection and prudent risk management. To its critics — a coalition that by 2024 included Elon Musk, the Republican-led U.S. House Judiciary Committee, and some publishers — the same activity looks like coordinated demonetization, a soft censorship of disfavored speech dressed as risk management [11][12]. These pages use \"brand safety\" and \"suitability\" as the industry's own descriptive terms while flagging, where relevant, that the activity they name is politically contested. Neither the protective framing nor the censorship framing is adopted here as settled fact.\n\n---\n\n## 2. The Pre-History: Fraud, Viewability, and the Loss of Trust (c. 2012–2016)\n\nBrand safety did not begin with a content-adjacency scandal. It began with a measurement crisis. In the early 2010s, programmatic advertising — the automated, auction-based buying of impressions across thousands of sites — scaled faster than the industry could verify what it was buying. Two problems dominated: **ad fraud** (impressions served to bots rather than humans, or on spoofed domains) and **non-viewability** (ads served below the fold or in unrendered slots, counted as delivered but never seen by a human). Neither was a brand-safety problem in the adjacency sense. But together they built the verification infrastructure — third-party tags, vendor measurement, accreditation bodies — that brand safety would later run on.\n\nThe institutional response came in 2014. The **Media Rating Council (MRC)**, working with the Interactive Advertising Bureau (IAB), finalized the first industry **viewability standard**: a display ad counts as \"viewable\" only if at least 50% of its pixels are in view for at least one continuous second; for video, the threshold is 50% of pixels for at least two continuous seconds [5][6]. The standard mattered far beyond its narrow definition. It established a principle: an impression is not a fact the seller reports but a *measurable event* an accredited third party can verify. Every later layer of verification, brand safety included, was built on that foundation.\n\nThe same year, the industry stood up an accreditation and anti-fraud body. The **Trustworthy Accountability Group (TAG)** was founded in 2014 by three trade bodies — the Association of National Advertisers (ANA), the American Association of Advertising Agencies (the 4A's), and the IAB — to fight fraud, malware, and piracy in the digital supply chain [7][8]. Within three years, TAG's \"Certified Against Fraud\" and related seals became something an advertiser could demand of every counterparty.\n\nThe fraud problem was not abstract. In December 2016, the security firm White Ops (later HUMAN) disclosed \"Methbot,\" a Russian-operated bot farm estimated to be defrauding advertisers of millions of dollars a day by faking video-ad views — a scheme prominent enough that Marc Pritchard would name \"methbot fraud\" from the stage weeks later [2][3]. The pre-history's lesson, inherited by brand safety, was simple and corrosive: **the buyer could not see what it was buying.** That opacity runs through this entire document. It is precisely the condition CTV would later restore in a new form.\n\n---\n\n## 3. 2017: The Hinge Year — The \"Adpocalypse\" and the Pritchard Ultimatum\n\nIf brand safety has a birth year as a mass-market discipline, it is 2017. Two events months apart turned a back-office measurement concern into a board-level brand-risk imperative.\n\n### 3.1 The YouTube \"Adpocalypse\"\n\nIn February 2017, *The Times* of London reported that advertisements — including ads placed by the British government and by major private-sector brands — were appearing alongside YouTube videos supporting terrorist organizations and other extremist content [1]. The report detonated. Within weeks, more than 250 advertisers — among them, by contemporaneous accounts, McDonald's, Toyota, AT&T, PepsiCo, Starbucks, Verizon, and Walmart — pulled or paused their YouTube and Google Display Network spending in what the trade and internet culture came to call the **\"adpocalypse\"** [1]. One brokerage (Nomura Instinet) estimated Google could lose up to $750 million from the boycott [1]. Google's EMEA head, Matt Brittin, apologized publicly; YouTube paused certain ad formats and accelerated machine-classification of extremist content, working with bodies including the Anti-Defamation League and the Institute for Strategic Dialogue [1].\n\nThe adpocalypse is the discipline's founding trauma for a specific reason: it proved that **adjacency is a brand risk independent of fraud and viewability.** The impressions in question were real, viewable, served to humans — and catastrophic, because of *what they ran next to*. No viewability standard or fraud seal touched that. The industry needed a new category of control: content-adjacency verification. (Note: \"adpocalypse\" is partly a creator-economy term — YouTube creators experienced it as mass demonetization — and partly an advertiser term. It is used here as a period label, not as a neutral analytic category.)\n\n### 3.2 Marc Pritchard's Transparency Ultimatum\n\nOn January 29, 2017 — weeks before the *Times* story broke — Procter & Gamble's chief brand officer **Marc Pritchard** delivered a keynote at the IAB Annual Leadership Meeting in Florida that is widely regarded as the most consequential advertiser speech of the decade [2][3][4]. Pritchard, speaking for the world's largest advertiser by spend, indicted a \"murky\" and \"antiquated\" digital media supply chain riddled with unreliable measurement, hidden agency rebates, and fraud (he named bot and \"methbot\" fraud directly) [2][3]. Crucially, he issued an **ultimatum with a deadline**: every entity touching P&G's digital media had until the end of 2017 to meet four conditions or lose the business — (1) adopt one MRC-validated viewability standard, (2) accept accredited third-party measurement verification, (3) operate under transparent agency contracts, and (4) be TAG-certified against fraud [2][3][4].\n\nPritchard's intervention is the contingent inflection point that gave the nascent verification industry its market. He did not invent the standards — MRC, TAG, and third-party verification all pre-existed. He made compliance with them **non-optional for anyone who wanted the largest ad budget in the world.** Because the rest of the Fortune 500 followed P&G's lead, the speech converted a menu of voluntary standards into de facto procurement requirements, and turned verification vendors from optional add-ons into mandatory supply-chain participants.\n\n---\n\n## 4. The Verification Vendors: Who Built the Machinery\n\nThe discipline needed companies to do the actual measuring. Three lineages dominate, and their histories matter because their web-native origins shaped — and limited — what each could carry into CTV.\n\n**Integral Ad Science (IAS).** Founded in 2009 as **AdSafe Media**, IAS was, as the original name signals, built first around *safety* — keeping ads off objectionable sites — and later broadened into viewability and fraud [Vendor histories, via [15][16]]. Private-equity firm Vista Equity Partners took a majority stake in 2018, and IAS went public on the Nasdaq in **June 2021** [15][17]. In summer 2021 IAS acquired the CTV ad-server company **Publica**, an explicit bet that the future of verification ran through the streaming ad-server layer rather than the browser tag [17].\n\n**DoubleVerify (DV).** DV grew up as a verification specialist and took a ~$200M investment from Providence Equity (valuing it above $300M) on its way to scale; it **IPO'd in April 2021** at a valuation around $5.4 billion — one of the larger ad-tech offerings of the cycle — and directed capital toward CTV and social integrations [15][18].\n\n**Oracle's Moat and Grapeshot.** Oracle assembled an advertising-measurement stack by acquisition: it bought **Moat** (viewability/attention measurement, known for auditing across Facebook, YouTube, and Snapchat) in 2017, and **Grapeshot** (contextual targeting and brand-safety classification) in April 2018, folding both into Oracle Data Cloud / Oracle Advertising [15]. This lineage matters disproportionately because of how it ended. **Oracle exited the advertising business in mid-2024**, and its former Moat and Grapeshot customers scattered across the surviving vendors — DoubleVerify absorbed many, pushing the verification market toward a DV/IAS near-duopoly, while contextual specialists such as Peer39 courted the orphaned Grapeshot accounts [15][19]. The Oracle exit is a crucial fact about the present landscape: a major verification and contextual provider that stood at the start of the CTV era is gone, and any account of \"the vendor landscape\" must treat Moat and Grapeshot as historical, not live.\n\n**comScore** rounds out the lineage as the measurement-and-audience incumbent that crossed into validation and brand-safety-adjacent measurement, though its center of gravity stayed in audience and content measurement rather than pure verification. (Its precise present-day brand-safety product posture is harder to pin down, and is taken up among the open questions below.)\n\n---\n\n## 5. The Institutional Scaffolding: Standards, Files, and Taxonomies\n\nAround the vendors grew a set of **standards bodies and technical specifications** that gave brand safety its shared language and its plumbing. Four threads matter.\n\n**The MRC** (above) supplied accredited measurement and the viewability standard. Over time MRC accreditation extended toward SIVT (sophisticated invalid traffic) detection and, eventually, toward CTV-specific measurement guidance.\n\n**The IAB and IAB Tech Lab** supplied the technical specifications. Two are foundational to brand safety's anti-fraud and transparency layer:\n- **ads.txt** (\"Authorized Digital Sellers\"), released by IAB Tech Lab's OpenRTB Working Group in **June 2017**, let publishers publicly declare which companies are authorized to sell their inventory — directly attacking domain spoofing and unauthorized reselling [21][22].\n- **app-ads.txt**, released in final form on **March 13, 2019**, extended that authorization mechanism to mobile *apps* and, critically, to **connected-TV app stores** — the first formal acknowledgment that the apps-and-CTV environment needed its own authorization plumbing because it had no web domain to anchor to [21][22].\n\nIAB Tech Lab also maintained the **Content Taxonomy**, the \"common language\" for describing content that later became the substrate for machine brand-suitability classification [10][23].\n\n**TAG** (above) supplied fraud certification and, later, brand-safety certification programs.\n\n**The 4A's** (American Association of Advertising Agencies) contributed agency-side playbooks; its Brand Safety Playbook was produced with TAG, the Brand Safety Institute, and IAB Tech Lab [23].\n\nNotice the pattern. By 2019 the discipline had a remarkably complete *web/mobile* stack — accredited measurement (MRC), fraud certification (TAG), authorization files (ads.txt / app-ads.txt), a content taxonomy (IAB Tech Lab), and competing verification vendors. Every piece assumed an addressable unit: a domain, an app bundle ID, a tag that could fire JavaScript, a pixel that could phone home. CTV would honor one of these — app-ads.txt — and break the rest outright.\n\n---\n\n## 6. GARM: The Attempt at a Global Coordinating Center (2019–2024)\n\nThe verification vendors and IAB specs solved the *how*. They left the *what* unsolved — a shared definition of which content categories are unsafe, and at what risk level. The **Global Alliance for Responsible Media (GARM)** filled that gap, briefly and consequentially.\n\n### 6.1 Founding (June 2019)\n\nGARM was launched in **June 2019 at the Cannes Lions festival** as an initiative of the **World Federation of Advertisers (WFA)**, in partnership with the ANA's CMO Growth Council [9][24]. The WFA's own founding announcement names **17 of the world's leading advertisers** as founders — including Adidas, Bayer, BP, Danone, Diageo, General Mills, GSK Consumer Healthcare, LVMH, Mars, Mastercard, Mondelēz, NBCUniversal, Nestlé, Procter & Gamble, Shell, Unilever, and Vodafone — alongside major agencies, platforms (Google/YouTube, Facebook, Twitter), and industry associations [24]. (Note a common discrepancy: many secondary accounts say \"16 founding advertisers\"; the WFA's own June 2019 release says **17**. This account follows the primary source [24] while flagging the 16-vs-17 inconsistency.)\n\nGARM's framing catalyst is itself a contested historical point. Many retrospective accounts state GARM was formed *in the wake of the March 2019 Christchurch mosque shooting*, which the attacker livestreamed on Facebook [9]. The WFA's own founding announcement, however, does **not** mention Christchurch and frames the launch around general \"digital safety\" and a commitment to challenge \"hate speech, bullying and disinformation\" [24]. The Christchurch-as-catalyst claim is plausible and widely repeated but is *not* confirmed by the primary founding document — an important caution, and one of the open questions taken up below.\n\n### 6.2 The Brand Safety Floor and Suitability Framework (September 2020)\n\nGARM's most durable artifact, and its single most important contribution to the CTV era, is the **Brand Safety Floor + Suitability Framework**, first published in **September 2020** [9][10]. It did three things the field had never had in one place:\n1. **Eleven content categories** of harmful/sensitive content (e.g., adult/explicit, arms/ammunition, crime/violence, death/injury, hate speech, terrorism, drugs, spam/malware, obscenity, illegal drugs, sensitive social issues), developed with GARM's NGO Consultative Group [9][10].\n2. A **Brand Safety Floor** — content unsuitable for *any* monetization.\n3. A **Suitability Framework** sorting content above the floor into **low / medium / high risk** tiers, so a given brand could choose its own tolerance. The same topic could be Low Risk as news/education, Medium Risk as entertainment/op-ed, and High Risk when glamorized or gratuitous [9][10].\n\nThis is the operationalization of the safety-to-suitability shift. It gave verification vendors, agencies, and platforms a *shared vocabulary*, which IAB Tech Lab then activated technically by mapping it to its Content Taxonomy and building human-labeled benchmark datasets to grade classifiers against the GARM standard [10][23]. For CTV specifically, GARM categories became the lingua franca that vendors such as Peer39 and Zefr used to describe streaming content suitability [10].\n\n### 6.3 The Shutdown (August 2024) and the Governance Vacuum\n\nGARM's end is the most politically charged inflection point in the entire history. Through 2023 and 2024, GARM came under sustained attack from the U.S. **House Judiciary Committee** under chairman **Jim Jordan (R-OH)**, which issued a sharply critical report in July 2024 alleging GARM functioned as an illegal antitrust cartel that coordinated advertiser boycotts of disfavored, often conservative, outlets and platforms [11][12]. Days later, on **August 6, 2024**, Elon Musk's **X Corp filed an antitrust lawsuit** against the WFA, GARM, and several member advertisers, alleging GARM organized an illegal boycott that starved X of revenue [11][12]. On **August 8, 2024**, the WFA announced it was **discontinuing GARM activities**, stating the litigation had become a distraction and had \"significantly drained its resources and finances,\" while maintaining the allegations were unfounded and pledging to defend itself in court [11][12].\n\nThe shutdown left the field's only global coordinating body gone and its central artifacts — the Brand Safety Floor and Suitability Framework — without a clear steward. As of mid-2026, the GARM framework continues to circulate and to be implemented through **IAB Tech Lab's taxonomy and benchmark work, the Brand Safety Institute, and the 4A's**, but there is no confirmed formal \"transfer of stewardship\" of the GARM standard to a successor body — only continued de facto use [10][23][25]. Whether a successor coordinating center emerges by 2030, and whether the standard fragments without one, is a central question the outlook must address. The vacuum cuts deepest for CTV, which reached scale at the very moment the body that would have written its suitability rules dissolved.\n\n---\n\n## 7. The Migration into CTV: Why the Web-Native Toolkit Did Not Transfer (2018 onward)\n\nBy 2018–2019 the web/mobile brand-safety stack was mature. In exactly those years the audience began moving to a fundamentally different surface — the television — and the stack could not follow cleanly. This section establishes *why*, because the entire premise here is that CTV breaks the assumptions web brand safety was built on.\n\n### 7.1 The Scaling Event: Cord-Cutting and the FAST Explosion\n\nConnected TV advertising scaled on the back of two simultaneous shifts: subscription streaming's rise and, critically for ad-supported brand safety, the **explosion of free ad-supported streaming television (FAST)**. Between 2018 and 2020, as cord-cutting accelerated, FAST services filled the gap for viewers who wanted free, lean-back, linear-like content. The three U.S. leaders — **Pluto TV** (acquired by Viacom in 2019), **Tubi** (acquired by Fox in 2020), and **The Roku Channel** (launched 2017) — grew fast; usage data show Pluto and Tubi roughly doubling household reach year over year around 2018–2019, and the pandemic drove explosive growth, with Tubi and Pluto each crossing ~50 million monthly active users by 2021 [26][27]. The advertising consequence: thousands of new ad-supported channels appeared almost overnight, many thinly documented, with sparse metadata and uneven supply-chain hygiene — exactly the conditions under which brand-safety risk and fraud thrive.\n\n### 7.2 Five Structural Breaks\n\nThe web brand-safety toolkit rested on a tag firing JavaScript in a browser, on a page with a URL, dropping a cookie. CTV negates every premise:\n\n1. **No page URL.** A web ad runs on a page with an address; a verification tag reads that URL and the page's content to judge adjacency. A CTV ad runs *inside an app*, in an episode of long-form video. There is no URL to read. The richest signal of the web era simply does not exist.\n\n2. **App-level vs. content-level opacity.** What the buyer can typically see is the *app* (e.g., \"a news app,\" sometimes only an obfuscated bundle ID), not the *specific program, episode, or scene* the ad ran beside. Brand safety operates at the content level; CTV often exposes only the app level. A \"kids\" app and a \"true crime\" app differ, but within a single FAST app the content can swing from a nature documentary to a graphic crime re-enactment with no per-impression signal of which one carried the ad.\n\n3. **Server-side ad insertion (SSAI) severs client-side measurement.** SSAI stitches the ad into the video stream on the server to deliver a smooth, buffer-free \"broadcast-quality\" experience. But it also means the ad is not rendered by a client-side player the verification vendor can instrument; the buyer cannot directly validate playback, device characteristics, or render events. Independent measurement has found **invalid-traffic (IVT) rates materially higher on SSAI traffic** — by one vendor's Q1-2024 figure, ~140% higher on SSAI than non-SSAI paths — because SSAI both obscures the true app/IP/household and gives fraudsters a layer to hide in [28]. SSAI is the CTV analogue of the early-2010s \"the buyer can't see what it's buying\" problem, re-created by the very technology that made streaming ads watchable.\n\n4. **Automatic Content Recognition (ACR) as a substitute signal.** Because there is no URL, the industry reached for **ACR** — fingerprinting the actual pixels/audio on the screen via smart-TV operating systems — as a way to know *what is actually playing*. ACR is the CTV-native attempt to recover the content-level signal that the URL used to provide, but it is controlled by the TV-OS owners (the platforms), is uneven in coverage, and raises its own privacy questions, making it a partial and contested substitute rather than a clean replacement.\n\n5. **MFA and supply-chain murk re-appear at TV scale.** \"Made-for-advertising\" (MFA) sites — low-quality, ad-cluttered pages built to harvest programmatic spend — are a web phenomenon, but the ANA's December 2023 Programmatic Media Supply Chain Transparency Study found MFA comprised **~21% of impressions and ~15% of ad spend** (about $10.1B of a $67.3B sample) and that only **31% of advertisers had access to their own log-level data** [29][30]. The same opacity-and-arbitrage dynamics extend into CTV, where opaque resold inventory, obscure FAST channels, and limited log-level visibility recreate the MFA problem in long-form video.\n\nThe synthesis: **the web era's brand-safety apparatus assumed observability — a page it could read, an impression it could instrument, a cookie it could drop.** CTV restored the broadcast-era condition of *opacity by architecture*: you cannot tag a server-stitched stream the way you tag a browser. So the industry has spent 2018–2026 rebuilding observability by other means — app-ads.txt authorization, ACR fingerprinting, ad-server-level verification (hence IAS buying Publica), SSAI-transparency demands, supply-path optimization. None of them is a drop-in replacement for the JavaScript tag.\n\n---\n\n## 8. The Contextual Counter-Movement: Suitability's Technical Engine\n\nRunning parallel to the safety crises was the technical lineage that became the engine of suitability: **contextual analysis**. Binary safety relied on **keyword block-lists** — block any page mentioning \"shooting,\" \"death,\" \"ISIS.\" Contextual analysis tried to read *meaning*, separating a news report on a tragedy (suitable for most brands) from content that glamorizes it (unsuitable). The IAB has reported that the overwhelming majority of marketers — on the order of 90%+ — use keyword block-lists, and that crude block-listing both starves publishers of legitimate revenue and fails at actual suitability by blocking safe-but-keyword-matching content [13][31].\n\nThe contextual vendors that powered this shift — **Grapeshot** (Oracle), **Peer39**, and others — carried a pre-cookie, page-reading heritage that positioned them well as two forces converged: (1) the suitability movement's demand for content-level nuance, and (2) **third-party cookie deprecation**. Apple's Safari began restricting third-party cookies via Intelligent Tracking Prevention in 2017, and Google announced in 2019 its intent to phase out third-party cookies in Chrome [31]. As behavioral targeting's cookie foundation eroded, contextual analysis gained a second rationale — it is identity-free by construction — and the same content-classification engines used for *suitability* (is this content appropriate?) doubled as engines for *targeting* (is this content relevant?). The two purposes fused. That fusion is why \"brand suitability\" and \"contextual targeting\" are often the same product sold under two labels, and it is the technical bridge by which suitability thinking entered CTV: with no cookie and no URL, content-classification (now via ACR and metadata rather than page-reading) is one of the few signals left.\n\n---\n\n## 9. Contingency: Where It Could Have Gone Differently\n\nA history of inflection points should name its counterfactuals, because the forecast inherits them. Each turning point could have turned the other way.\n\n- **If P&G had not issued the 2017 ultimatum**, verification might have remained a niche, optional service rather than a procurement requirement; the vendor industry (IAS, DV) might never have reached the scale that funded their CTV pivots and IPOs.\n\n- **If GARM had survived the 2024 litigation**, CTV suitability standards would likely be converging under a single global body precisely as CTV reaches scale; instead the standard is orphaned and the field faces possible fragmentation — a genuinely open future, not a foregone conclusion.\n\n- **If SSAI had not become the dominant CTV delivery method**, client-side verification might have transferred from web more cleanly; the measurement crisis of CTV is substantially a *consequence of an engineering choice* (server-side stitching for stream quality) rather than an inherent property of television.\n\n- **If third-party cookies had not been deprecated**, the contextual/suitability vendors might have remained a brand-safety sideline rather than becoming central to both suitability *and* targeting — the fusion that now carries suitability into the cookieless, URL-less CTV environment.\n\n- **If app-ads.txt had been designed earlier or adopted faster**, the CTV authorization layer would be more complete; uneven app-ads.txt adoption is repeatedly cited as a reason SSAI fraud is easier to pull off in CTV than in web [28].\n\nThese are not idle hypotheticals. Each is a live variable in the 2026–2030 forecast: the durability of the DV/IAS duopoly, the emergence (or not) of a GARM successor, the trajectory of SSAI transparency, the resolution of cookie deprecation, and the maturation of CTV authorization plumbing. The history that produced them is contingent; so is the future they shape.\n\n---\n\n## 10. Regional Note: A Discipline Made in America and Exported\n\nThis history is U.S.-centric by the nature of its sources — the adpocalypse, P&G's IAB speech, TAG, the ANA study, the GARM litigation, and the verification IPOs are all American or American-led events. That is itself a historical fact: brand safety as a formal discipline was substantially **invented in the U.S. and exported**. The WFA/GARM layer was the European-led (Brussels-headquartered WFA) attempt to globalize it, and its collapse under *U.S.* political and legal pressure shows American regulatory-political dynamics reshaping a global standard. The regional chapters that follow (US, Canada, EU, India, LATAM, Australia) inherit a discipline whose vocabulary (GARM categories) is global but whose governance is now unanchored, and whose privacy-law substrates diverge sharply — GDPR's strictness vs. the U.S. patchwork vs. India's 2023 DPDP Act vs. LATAM's LGPD-and-others vs. Australia's reforms. The division of labor is clean: the *what* (categories, vendors, mechanisms) is established here; the *where* (regional maturity, regulatory interplay) is taken up next.\n\n---\n\n## Open Questions\n\n1. **Did Christchurch actually catalyze GARM?** The catalyst claim is widely repeated but is not confirmed by the WFA's own June 2019 founding announcement, which omits it. Needs a primary WFA/GARM statement or contemporaneous reporting that ties the two directly.\n2. **16 vs. 17 founding advertisers.** The WFA primary release says 17; many secondary accounts say 16. Which list is canonical, and what accounts for the discrepancy (e.g., counting WFA itself, or an advertiser that joined days later)?\n3. **Who, if anyone, now formally stewards the GARM Brand Safety Floor & Suitability Framework?** Is there a confirmed transfer to IAB Tech Lab, the 4A's, or a new body — or is the standard simply being used without an owner? Much of the outlook hinges on the answer.\n4. **comScore's present-day brand-safety posture.** comScore's current role in brand-safety/suitability verification (vs. audience/content measurement) was not independently verified and should be confirmed against recent sources.\n5. **Is the ~140% SSAI IVT figure corroborated beyond a single vendor?** The figure traces to one verification vendor's research; an independent or cross-vendor corroboration is needed before treating it as an industry constant.\n6. **MRC's CTV-specific measurement and brand-safety guidance.** The MRC has extended toward CTV; the precise current state of MRC CTV accreditation/standards was not pinned down here.\n7. **The TAG Brand Safety certification's current scope in CTV.** TAG launched brand-safety certification programs; their current CTV applicability and adoption need verification.\n8. **Exact YouTube adpocalypse chronology.** The 2017 *Times* report, the boycott waves, and the later \"Elsagate\"/comments-driven 2019 second wave should be disentangled with precise dates and primary reporting.\n\n---\n\n## Sources\n\n1. MarTech, \"Timeline: Google's path to tackling YouTube brand safety problems,\" martech.org. Tier 5 (trade). Synthesizes the 2017 *Times* report, the 250+ advertiser boycott, named brands, ~$750M estimate, and Google's response. https://martech.org/google-youtube-brand-safety-timeine/ (accessed 2026-06-17).\n2. CNBC, \"Procter & Gamble chief marketer slams 'crappy media supply chain,'\" 2017-01-31. Tier 3–4 (wire/major). Pritchard's IAB speech, supply-chain critique, methbot reference. https://www.cnbc.com/2017/01/31/procter-gamble-chief-marketer-slams-crappy-media-supply-chain.html (accessed 2026-06-17).\n3. Marketing Week / Mark Ritson, \"P&G's Marc Pritchard has made the biggest marketing speech for 20 years,\" 2017. Tier 5 (trade/analysis). Frames the four-point plan, viewability, fraud, deadline. https://www.marketingweek.com/mark-ritson-marc-pritchard-viewability-fraud-speech/ (accessed 2026-06-17).\n4. The Drum, \"P&G to review all agency contracts in 2017 in four-step plan to bring transparency to media supply chain,\" 2017-01-30. Tier 5 (trade). The four-point plan and end-2017 ultimatum. https://www.thedrum.com/news/2017/01/30/pg-review-all-agency-contracts-2017-four-step-plan-bring-transparency-media-supply (accessed 2026-06-17).\n5. Pixalate, \"MRC Viewability Standards: definition & history,\" pixalate.com. Tier 5 (vendor/trade — used for the 2014 dating and thresholds, corroborated). 50%/1s display, 50%/2s video, 2014. https://www.pixalate.com/blog/mrc-viewability-standards-definition-history (accessed 2026-06-17).\n6. Publift, \"MRC Viewability Explained for Publishers,\" publift.com. Tier 5 (trade). Corroborates 2014 MRC/IAB viewability thresholds. https://www.publift.com/blog/mrc-viewability (accessed 2026-06-17).\n7. Integral Ad Science, \"10 minutes with the Trustworthy Accountability Group (TAG),\" integralads.com. Tier 5 (vendor — used for TAG founding facts). TAG founded 2014 by ANA, 4A's, IAB. https://integralads.com/insider/10-minutes-trustworthy-accountability-group-tag/ (accessed 2026-06-17).\n8. FIPP, \"Trustworthy Accountability Group (TAG) on tackling criminal activity in digital advertising,\" fipp.com. Tier 5 (trade). Corroborates TAG's anti-fraud mission and founding. https://www.fipp.com/news/tag-on-tackling-criminal-activity-digital-advertising/ (accessed 2026-06-17).\n9. WFA, \"Global Alliance for Responsible Media launches to address digital safety,\" 2019-06-18 (primary). Tier 1. GARM June 2019 Cannes launch, WFA initiative, founding-member list. https://wfanet.org/knowledge/item/2019/06/18/Global-Alliance-for-Responsible-Media-launches-to-address-digital-safety (accessed 2026-06-17).\n10. GARM/WFA, \"GARM Brand Safety Floor + Suitability Framework\" (Sept 2020; primary framework doc). Tier 1. Eleven categories, floor, low/med/high tiers. https://wfanet.org/knowledge/item/2022/06/17/GARM-Brand-Safety-Floor--Suitability-Framework-3
