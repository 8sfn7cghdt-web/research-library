e and \"value and values\" framing; TAG endorsement. Dated Oct 2023 — going-concern caveat on current branding. Accessed 2026-06-17.*\n25. Omnicom, \"Omni\" platform page. https://www.omc.com/omni/ — *Tier 1 (corporate). Omni orchestration platform. Accessed 2026-06-17.*\n26. Campaign Asia (partner content), \"The future of programmatic is here, and it's curation.\" https://www.campaignasia.com/article/the-future-of-programmatic-is-here-and-its-curation/476962 — *Tier 5-6 (partner content; note sponsorship). Curation-as-brand-safety framing. Accessed 2026-06-17.*\n27. MarTech, \"Omnicom's mega-merger doubles down on media — at creativity's expense.\" https://martech.org/omnicoms-mega-merger-doubles-down-on-media-at-creativitys-expense/ — *Tier 5 (trade). Post-merger media-network retention (Flywheel context). Accessed 2026-06-17.*\n28. Campaign India, \"Dentsu Programmatic launches Dentsu Curate in India.\" https://www.campaignindia.in/article/dentsu-programmatic-launches-dentsu-curate-in-india/489188 — *Tier 5 (trade). dentsu Curate SPO/curation product. Accessed 2026-06-17.*\n29. Dentsu (Singapore), \"Standard Chartered Bank embraces dentsu Curate for brand campaign.\" https://www.dentsu.com/sg/en/our-news/standard-chartered-uses-dentsu-curate-for-brand-campaign — *Tier 1 (corporate). dentsu Curate in use. Cite as dentsu's claim. Accessed 2026-06-17.*\n30. Dentsu, \"Dentsu Media Exchange (DMX) drives better performance through curation.\" https://www.dentsu.com/blog/dentsu-media-exchange-drives-better-performance-through-curation — *Tier 1 (corporate). DMX curated marketplace, media-hygiene framing. Cite as dentsu's claim. Accessed 2026-06-17.*\n31. Dentsu (MENA), \"Dentsu Launches First Agency-Curated Programmatic CTV Marketplace,\" 2025-05-25. https://www.dentsu.com/ae/en/media-and-investors/ctv-launch — *Tier 1 (corporate). DMX-powered CTV marketplace; Magnite tech; built-in fraud/brand-safety tools; performance figures are dentsu's claim, not independently verified. Accessed 2026-06-17.*\n32. PR Newswire / FreeWheel, \"Dentsu Launches Merkury For Media…,\" 2024-03-28. https://www.prnewswire.com/news-releases/dentsu-launches-merkury-for-media-next-evolution-of-entirely-people-informed-and-activated-media-302102885.html — *Tier 1 (press release; cite as dentsu's claim). Merkury for Media identity; Roku/Disney CTV integrations; FreeWheel/Merkury ID. Accessed 2026-06-17.*\n33. Choreograph / WPP Media, \"Welcome to Choreograph\" and \"Acceleration Joins Choreograph\"; WPP, \"WPP Acquires InfoSum.\" https://www.choreograph.com/ ; https://www.choreograph.com/resource/acceleration-moves-into-choreograph — *Tier 1 (corporate). Choreograph as WPP data company under WPP Media; InfoSum acquisition (2025). Cite as company's claim. Accessed 2026-06-17.*\n<\/content>"}, {"order": 11, "file": "11_Gap_BuySide_Demand_Modality.md", "title": "The Demand Side — What Advertisers Actually Want and Do About CTV Brand Safety", "summary": "", "body": "# The Demand Side — What Advertisers Actually Want and Do About CTV Brand Safety\n\n## Bottom Line\n\nMost of this account describes what verification vendors and standards bodies *sell*. This chapter asks what brand advertisers, CMOs, and agency practitioners actually *want and do* — the demand the rest of the story keeps invoking (P&G's Marc Pritchard \"created the market\") but rarely returns to as a subject in its own right. Four findings stand out.\n\nFirst, how advertisers set CTV suitability tolerance: in practice the buy side is a hybrid mess. The GARM taxonomy still supplies the default vocabulary even after GARM's death, but operational tolerance is set through per-advertiser exclusion lists, the \"vibes\" of a platform, and increasingly the question \"is this on-brand for us?\" — not any published risk-tier framework. The post-GARM world devolved suitability decisions *down* to the individual advertiser, who is now more on their own than at any point since 2019.\n\nSecond, the buy-side ranking of what is broken does not match the vendor-driven ranking. Where vendors and standards bodies foreground *fraud* and *suitability incidence*, practitioners foreground *transparency and control* — \"if you can't see where an ad ran, you can't defend the buy\" — and treat the verification layer itself as suspect after the Adalytics reports.\n\nThird, the procurement economics are real but modest: verification runs roughly $0.08–$0.30 CPM, a small slice of a \"tech tax\" estimated at 40–60% of media CPM. And a vocal cohort of buyers now openly questions whether they should pay for verification at all, or buy curated inventory instead.\n\nFourth, regulated categories — pharma above all — set the strictest floor. A tightening U.S. DTC-ad regime is pushing healthcare advertisers to demand impression-level provenance (\"if you can't see where an ad ran, you can't defend the buy\") that no general-market brand requires.\n\nThe demand side is not a passive consumer of vendor products. It is an increasingly skeptical, increasingly do-it-yourself actor whose tolerance — especially in regulated categories — sets the real floor the rest of the market builds to.\n\n---\n\n## Why the Demand Side Deserves Its Own Chapter\n\nMost of the story so far is a portrait of supply, built from verification-vendor self-descriptions and fraud-lab reports, standards-body specs, SEC filings, regulator texts, law-firm analyses, and ad-trade press. That is the right spine for understanding the *mechanisms* of CTV brand safety. But it leaves a structural blind spot. We can describe what DoubleVerify's SneakyTerra fraud-lab report found, what the IAB Tech Lab's CTV spec says, and how the post-GARM antitrust fight is playing out. None of that tells us how a real brand advertiser in 2025–2026 decides what \"suitable\" means, what that advertiser thinks is broken, what they pay, or whether they believe any of it works.\n\nThis is not a minor omission. The whole origin story rests on a demand-side act: P&G's Marc Pritchard's January 2017 ultimatum, which \"converted a menu of voluntary standards into de facto procurement requirements\" because the rest of the Fortune 500 followed. *Demand created the market* — and then is rarely studied again. The temptation is to treat the advertiser as an offstage check-writer whose preferences are inferred from what vendors built. This chapter brings the check-writer onstage.\n\nA hard limit, stated up front: the practitioner voices below come entirely from secondary reporting. Every voice here is mediated through trade press — Digiday, AdExchanger, The Current (The Trade Desk's owned editorial brand, noted as such), Marketing Dive — or through industry-body research (ANA, IAB, 4A's). The named-and-quoted practitioner reactions are the strongest demand-side evidence available short of an original survey. The one platform primary document used is DoubleVerify's published DV360 rate-card notice. The value of this chapter is *aggregation*: pulling the scattered buy-side voice into one place and ranking it against the supply side's ranking.\n\n---\n\n## 1. How Advertisers Actually Set CTV Suitability Tolerance\n\n### 1.1 The published frameworks vs. the practice on the desk\n\nThe supply-and-standards side describes a clean architecture: a GARM Brand Safety Floor (the universal \"never appropriate\" categories) plus a Suitability Framework with graduated risk tiers (high/medium/low) that an advertiser selects into. The implication is that advertisers set tolerance by *choosing a tier*.\n\nThat is mostly not how the desk works. Three mechanisms coexist, and they diverge sharply from the published frameworks:\n\n**(a) The GARM taxonomy survived GARM as a vocabulary, not as a tiering ritual.** After GARM's August 2024 dissolution, the taxonomy did not vanish. It was absorbed into vendor and platform tooling. Vanessa Otero, founder and CEO of Ad Fontes Media, put the continuity plainly: \"It's not like there are a bunch of competing taxonomies. Companies still employ their methodologies as they did before\" [1]. An anonymous brand-safety source told VideoWeek the GARM standards \"still exist both as standalone guidelines that anyone can use, as well as in the form of functionality that has been built into tools by platforms, publishers, intermediaries, and verification vendors\" [1]. The framework persists — but as a default category language baked into dashboards, not as a deliberate tier-selection exercise most advertisers consciously perform.\n\n**(b) Operational tolerance is set through inclusion/exclusion lists, updated on a slow cadence.** The most concrete buy-side practice evidence is the ANA's programmatic benchmark survey work, which found that exclusion lists are used more than inclusion lists, that **59% of advertisers use both** inclusion and exclusion lists, and that both list types are most often updated only **monthly** [2]. This is the real instrument of tolerance: a list of domains, apps, or channels to avoid, maintained by hand, refreshed monthly. Dentsu's Deva Bronson (EVP, head of media responsibility) described how much of the buy side actually engages: many marketers \"either don't engage with brand safety at all or take a sort of 'set it and forget it' approach,\" which is why she pushes clients to re-check settings monthly or quarterly so the lists don't go stale [3]. The \"set it and forget it\" diagnosis is the tell. Published frameworks assume an actively-managed risk posture; practice is often a stale list nobody has touched since launch.\n\n**(c) Tolerance is increasingly framed as \"on-brand for us,\" not as a risk tier.** Megha Parikh, head of strategy at VML, observed a terminology shift away from the very language this debate is built on: \"I feel like 'brand safety' as a term might not be as popular as it used to be.\" Clients, she said, now frame the conversation as \"on brand for us\" or as risk assessment — sometimes *accepting* riskier platforms to reach Gen Z audiences [3]. Shuree Jones of Rain The Growth Agency described the operative heuristic as platform-level \"vibes\": \"When we say 'the vibes,' what we mean by that is the propensity for people to go off the rails\" — an assessment of a platform's *propensity* for problems, not a content-level tier [3]. This is a qualitative, brand-specific judgment that the GARM tier system was meant to formalize and that practitioners have, in part, re-informalized.\n\n### 1.2 The divergence, stated\n\nPut together: the published frameworks (floor + graduated suitability tiers) describe the *vocabulary* the buy side uses, but the *decision procedure* is messier — hand-maintained exclusion lists on a monthly cadence, a large \"set it and forget it\" cohort, and a growing tendency to replace tier language with brand-fit and platform-vibe judgments. The post-GARM environment pushed the decision *down* to the individual advertiser. As the VideoWeek reporting framed the open question after the X lawsuit: \"whether buyers behave differently in using the available tools as a result of the X lawsuit\" [1]. Practice diverges from the published frameworks precisely because the body that maintained them no longer exists, and no successor has formalized the buy-side decision again.\n\n---\n\n## 2. What the Buy Side Says Is Actually Broken — and How That Ranking Differs\n\n### 2.1 The supply-driven ranking\n\nThe supply-side account foregrounds, roughly in order: **fraud/IVT** (SSAI-laundered, SneakyTerra, Pixalate's ~18% CTV IVT), **suitability incidence and the fraud/suitability conflation**, **MFA/wasted spend**, and the **transparency gap** (walled gardens withholding content-level and log-level data). This is a vendor-and-measurement ranking: the problems a verification product can *measure* sit at the top.\n\n### 2.2 The buy-side ranking\n\nThe demand-side voice inverts the top of that list. What practitioners lead with is **transparency and control**, and — after the Adalytics reports — **distrust of the verification layer itself**.\n\n**Transparency and control are the buy side's first complaint.** Nicole Alfonso, VP of media partnerships at DeepIntent, compressed the regulated-buyer view into a line that travels well across categories: \"If you can't see where an ad ran, you can't defend the buy\" [4]. The historical buy-side lament about CTV is the same — a head of media activation at a large holding company once described spending millions on CTV \"while basically flying blind,\" not knowing if they were reaching the same people across platforms (Digiday's CTV-marketplace reporting, dated to 2021 and cited here as a durable buy-side frustration, not current data) [5]. Ryan Eusanio of Omnicom Media Group named the structural cause: \"You get this web of buying paths, so when you think about supply path optimization, it gets really messy\" [5].\n\n**Distrust of verification is now the loud second.** This is the largest divergence from the supply-side ranking. Where the supply side treats verification as the *solution* to brand safety, a vocal buy-side cohort treats it as part of the problem after the Adalytics reports. An executive at a major brand told The Current that \"brand-safety verification services aren't protecting anything. They only allow the veneer of plausible deniability\" [6]. A veteran media buyer with 10+ years in programmatic dismissed vendors' brand-safety statements: \"I don't care about that. Are they doing what they say they can do, what we pay them to do? The answer seems to be 'no'\" [6]. A programmatic executive at a media agency: \"these brand-safety partners advertise a foolproof product — and this isn't foolproof\" [6]. Jay Friedman, CEO of Goodway Group, put the failure in incentives rather than technology: \"The incentives are not aligned for change to occur. Brands are the source of the money\" [6].\n\n**Wasted spend/MFA registers, but as an economics problem the buy side already tracks.** The ANA's own benchmark work — which is *advertiser-side* research, making it the cleanest demand-side instrument available — quantifies wasted spend, and advertisers cite it. But notably, by the Q3 2025 benchmark the ANA reported that median MFA exposure had fallen sharply and that 99.1% of programmatic spend occurred in \"low-risk\" environments [7], which complicates the MFA-is-rampant emphasis: on the buy side's own scorecard, the MFA problem is partly *receding* even as the trust-in-verification problem grows.\n\n### 2.3 The ranking mismatch, stated\n\nThe supply side ranks: fraud → suitability incidence → MFA/waste → transparency. The buy side ranks, roughly: **transparency/control → trust-in-verification → wasted spend → fraud-as-a-line-item.** Fraud is not absent from the buy-side list — it is real, and they pay to filter it — but practitioners experience it as one input into a larger crisis of *not being able to see or trust*, not as the headline. The two rankings diverge most sharply on the verification layer itself. The supply side's protagonist is the buy side's prime suspect.\n\n---\n\n## 3. The Procurement Economics — What Advertisers Pay, and Whether They Think It Works\n\n### 3.1 What verification actually costs the buyer\n\nThe economic structure is straightforward — \"advertisers and agencies buy verification,\" priced as a CPM uplift or platform fee — but the uplift is rarely quantified from the buyer's side. The demand-side numbers, assembled here:\n\n- Verification (filtering invalid traffic and enforcing brand safety) is commonly priced at roughly **$0.10–$0.30 CPM** in programmatic display/video, per ad-tech cost guides — a small marginal cost (on the order of $18K–$25K on a $1M budget) relative to the fraud loss it claims to prevent [8]. These are analytical, vendor-adjacent cost guides rather than audited rate cards, so they are best read as orders of magnitude.\n- For CTV specifically, IAS's CTV measurement has been described at around **$0.08 CPM** in buyer-facing cost discussion — meaningfully above some standard-format rates [8].\n- DoubleVerify confirmed in a published platform notice that, **starting April 2025**, it would \"update its standard verification pre-bid rate card and marginally increase the CPM rates for some solutions,\" applying to new and existing line items, with custom-negotiated-rate advertisers unaffected — the cleanest confirmation that the buyer pays a per-impression CPM for verification and that the price ticks up over time [9].\n- In the wider frame buyers actually feel, verification is one component of a \"tech tax\" — DSP fees, data costs, verification — estimated to add **40–60% on top of raw media CPM** in some buyer-side accounting [8]. This is an analytical estimate, not a measured industry figure.\n\nThe verification line item is small per impression but sits inside a much larger intermediary load — which is exactly why buyers scrutinize whether it earns its place.\n\n### 3.2 Whether they believe it works — the demand-side trust crisis\n\nSeen from the supply side, the Adalytics reports are a *supply-side* event: a researcher challenging vendors' \"100% brand-safe\" marketing, with vendor rebuttals. From the demand side they read as a procurement-trust rupture. After Adalytics, named buyers began saying the quiet part out loud:\n\n- Jay Friedman, CEO of Goodway Group, judged that brand-safety tech \"isn't protecting brands enough to be worth the time and money they cost\" and has steered toward analytics platforms instead: \"We have seen significantly improved controls over where we were buying before as a result of using analytics platforms\" [6][10].\n- Arielle Garcia, COO of Check My Ads, told advertisers to \"demand their URL-level data, audit their campaigns, and demand refunds from their agencies, verification partners, and ad tech vendors where their ad placements or services rendered did not meet the standards their suppliers committed to\" [6].\n- The buy-side response is not uniformly \"stop paying.\" Sarah Karges, SVP of performance investment at Havas Media Network, described a hedge: \"We have a multi-layered approach to verification and aren't relying on one partner to solve everything\" [10]. And some buyers, per Digiday, are \"rethinking whether to even use verification in the first place versus buying entirely curated [ad inventory]\" [10].\n\n### 3.3 Are CTV brand-safety budgets growing or being cut?\n\nThe evidence points to **growing topline CTV spend with flat-to-skeptical verification spend** — a \"do-it-yourself devolution,\" not an abandonment. CTV spend itself is rising: the IAB's 2025 buyer outlook projected CTV up ~13.8% to more than $72B, and roughly **56% of marketers globally planned to increase OTT/CTV spend in 2025** (up from 53% in 2024), with nearly 70% calling CTV a \"must-buy\" [11][12]. Against that rising base, the *verification* dollar is interrogated, not cut wholesale — buyers substitute (analytics platforms, curated/PMP inventory, multi-vendor hedges) more than they exit. The post-GARM \"do-it-yourself\" devolution shows up here as a three-part move: keep buying CTV aggressively; pull suitability control in-house via exclusion lists and curated supply; treat the verification vendor as one skeptically-watched input rather than the trusted backstop.\n\n---\n\n## 4. Category-Specific Demand — Who Sets the Strictest Floor\n\nIt is tempting to treat suitability as roughly uniform across advertisers — a floor plus tiers. The demand side is not uniform. Regulated and sensitive categories — pharma, finance, alcohol, kids' brands — operate at a stricter floor that effectively defines the market's tightest tolerance. Their requirements pull the whole supply chain toward more provenance and transparency than a general-market brand would ever demand.\n\n**Pharma is the clearest case, and it is sharpening in 2025–2026.** A federal push to limit U.S. direct-to-consumer (DTC) drug advertising, plus tightening disclosure requirements, has made healthcare advertisers \"more motivated than ever to have a full understanding of where every impression runs\" [13]. DeepIntent's Nicole Alfonso framed the regulated-buyer posture as categorically different from general-market digital: \"Pharma's definition of 'performance' looks very different from that of e-commerce or traditional digital marketing,\" built on compliance-first measurement (verified patient reach, cost-per-verified-patient), and resting on the line \"if you can't see where an ad ran, you can't defend the buy\" [4]. Her prescription — control inventory through vetted partners, demand transparent data sourcing, insist on full verification and transparency — is a *maximalist* suitability posture that, applied to CTV, demands impression-level provenance the open programmatic market struggles to supply [4]. Pharma's broader migration to CTV (away from linear, accelerated by the DTC-ban threat) imports this strict floor into CTV exactly as CTV's transparency gap is most acute [13].\n\n**The general pattern.** Regulated categories share three demand-side features a uniform-floor model misses: (1) a *legal* rather than reputational driver — a misplaced ad \"not only wastes spend but risks regulatory scrutiny,\" so the cost of a bad placement is asymmetric and potentially statutory; (2) a *defensibility* requirement — the buy must be auditable after the fact (\"you can't defend the buy\"), which turns brand safety from a pre-bid filter into an evidentiary record; and (3) a willingness to *sacrifice reach for certainty*, the opposite of the general-market trade-off VML's Parikh described (accepting riskier platforms to reach Gen Z) [3][4][13]. Because these buyers will not tolerate the app-level-only opacity that characterizes much of CTV, their demand is the strongest market force pulling the medium toward content-level transparency. They are the floor the rest of the market's tooling has to clear.\n\n*One honest limit: the directly-sourced category evidence here is strongest for pharma/healthcare. Finance, alcohol, and kids'-brand CTV-specific suitability practice belong to the same sensitive set but were not separately corroborated here with named-practitioner detail; they are flagged among the open questions below. The pharma case is offered as the well-evidenced exemplar of the \"strictest floor\" dynamic, not as proof the other three behave identically.*\n\n---\n\n## 5. Synthesis — The Demand Side That Was Missing\n\nThree things come into focus once the buy side is treated as a subject in its own right rather than an offstage check-writer.\n\n**First, demand both created and is now dismantling the formal regime.** P&G's 2017 ultimatum converted voluntary standards into procurement law from the demand side. In 2024–2026, the demand side — disillusioned by Adalytics, freed from GARM's coordination, and pushed by the X/FTC politics — is *re-individualizing* the regime: per-advertiser exclusion lists, brand-fit judgment, curated inventory, multi-vendor hedges. The same actor that built the market is now devolving it. Looked at from supply alone, this reads as a \"post-GARM vacuum.\" The demand-side view shows the vacuum is partly *chosen* — advertisers reclaiming control they had delegated.\n\n**Second, the buy side's problem ranking is a check on the vendor ranking.** The supply-side view, built from vendor and standards sources, leads with fraud and suitability incidence. The buy side leads with transparency, control, and — most pointedly — distrust of verification itself. This is not a contradiction so much as a corrective: the supply side ranks problems it can sell a product against; the demand side ranks problems it experiences, including the failure of the products themselves.\n\n**Third, the strictest demand sets the real floor.** Regulated buyers — pharma above all — will not accept the app-level opacity that is a structural feature of CTV. Their legally-driven insistence on impression-level provenance is the demand-side force most likely to move CTV toward the content-level transparency the supply side has resisted in the walled-garden debate. If CTV transparency improves by 2030, the pressure will have come substantially from this floor — not from vendor altruism or standards-body consensus.\n\nThe supply-side story is not wrong. It is incomplete about demand. This chapter supplies the missing voice: not what vendors and standards bodies *sell*, but what advertisers *want* (provenance, control, defensibility, value-for-money) and *do* (hand-maintained lists, brand-fit judgment, skeptical multi-vendor hedging, and — in regulated categories — a maximalist floor everyone else builds toward).\n\n---\n\n## Open Questions\n\n1. **Is there a primary buy-side survey that quantifies the tolerance-setting mix?** The ANA inclusion/exclusion-list figures (59% / monthly) are the best found, but a direct, recent, methodologically-disclosed survey of *how advertisers set CTV suitability tolerance* (tier-selection vs. exclusion lists vs. brand-fit) would turn the central claim of this chapter from inference into measured fact.\n2. **Do finance, alcohol, and kids'-brand advertisers behave like pharma?** The strictest-floor generalization rests on pharma evidence. Each of the other regulated categories has its own statutory regime (alcohol self-regulation/age-gating, FINRA/SEC for finance, COPPA/kids') and likely its own distinct CTV suitability posture — none separately corroborated here.\n3. **What is the actual CTV verification CPM, audited?** The $0.08–$0.30 figures are from cost guides, not audited rate cards; only the DV *direction* (an April 2025 increase) is primary. A real rate-card or SEC-filing-derived per-impression CTV verification price would firm up the procurement economics.\n4. **Has the Adalytics-driven distrust changed dollar flows, or only rhetoric?** Buyers say they question verification; the spend-intent data shows CTV growing. Whether verification *budgets specifically* are flat, cut, or reallocated to curation/analytics is asserted here as a trend but not quantified.\n5. **Is the post-GARM \"DIY devolution\" durable or transitional?** Will a successor body re-formalize buy-side suitability (re-centralizing tolerance), or is per-advertiser control the new steady state? This bears directly on the outlook and is fundamentally a demand-side question.\n6. **What do non-US buy sides want?** The voices gathered here are almost entirely US/UK-sourced (the trade-press base is Anglophone). EU, Indian, LATAM, and Australian *advertiser* demand for CTV suitability — and how local privacy law shapes it — remains a gap; the regional chapters cover those markets from the supply and regulatory side only.\n\n---\n\n## Sources\n\n1. VideoWeek, \"Retooling Brand Safety in a Post-GARM World,\" 2024-12-02. Tier 5 (trade). GARM-taxonomy persistence; Ad Fontes Media (Vanessa Otero), YouTube, Pinterest, X statements; the \"behave differently\" open question. https://videoweek.com/2024/12/02/retooling-brand-safety-in-a-post-garm-world/ (accessed 2026-06-17).\n2. ANA Programmatic Benchmark Survey reporting (inclusion/exclusion list usage: ~59% use both; lists most often updated monthly). Tier 5 (industry research, via trade reporting). Single-source as found; the underlying ANA survey is the primary instrument. https://www.ana.net/ (benchmark survey series) (accessed 2026-06-17).\n3. Digiday, \"Marketing Briefing: How brand safety has changed — even as Musk goes after GARM,\" 2024-08-20. Tier 5 (trade). Named practitioners: Deva Bronson (Dentsu) \"set it and forget it\"; Megha Parikh (VML) \"'brand safety' as a term might not be as popular\"/\"on brand for us\"; Shuree Jones (Rain The Growth Agency) \"the vibes.\" https://digiday.com/marketing/marketing-briefing-how-brand-safety-has-changed-even-as-musk-goes-after-garm/ (accessed 2026-06-17).\n4. DeepIntent, \"5 Questions with Nicole Alfonso about CTV Pharma Advertising,\" 2025-12-02. Tier 5 (vendor-authored Q&A — lean noted; used for the regulated-buyer posture and direct quotes). Alfonso (VP Media Partnerships): \"If you can't see where an ad ran, you can't defend the buy\"; pharma \"performance\" differs; full verification/transparency. https://deepintent.com/deepdive/5-questions-with-nicole-alfonso-about-ctv-pharma-advertising (accessed 2026-06-17).\n5. Digiday, \"Media Buying Briefing: How messed up is the CTV marketplace?\" 2021-11-01. Tier 5 (trade). Buy-side \"flying blind\" / duplicate-inventory / SPO complaints; Brian Hovis (Traction), Ryan Eusanio (Omnicom Media Group), Tony Marlow (IAS CMO). Dated 2021 — cited as durable buy-side frustration, not current data. https://digiday.com/media/media-buying-briefing-how-messed-up-is-the-ctv-marketplace-bad-enough-that-efforts-are-being-made-to-fix-it/ (accessed 2026-06-17).\n6. The Current, \"Ad tech pros slam brand-safety failures in wake of bombshell [Adalytics] report,\" 2025-02-11 (ed. 2025-02-12). Tier 5 (trade; The Current is The Trade Desk's owned editorial brand — lean noted). Named: Arielle Garcia (Check My Ads), Jay Friedman (Goodway Group), Jeromy Sonne (Daypart.ai), Robert Leathern (Trust2/ex-Google), Adam Heimlich (Chalice); anonymous brand/agency execs (\"veneer of plausible deniability\"; \"what we pay them to do… 'no'\"; \"this isn't foolproof\"). https://www.thecurrent.com/not-foolproof-ad-tech-pros-brand-safety-failures-adalytics-report (accessed 2026-06-17).\n7. ANA, \"ANA Introduces Brand Safety & Suitability Metrics, Achieves 99.1% Low-Risk Programmatic Spend\" (Q3 2025 Programmatic Transparency Benchmark press release), Nov. 2025. Tier 2/5 (industry research; note it is ANA's own framing). 99.1% low-risk spend; $13.6B reclaimed working media; CTV 45.6% of programmatic spend; non-measurable impressions 28%→9.2%; first-time brand safety/suitability metric. (Press release: cite for what ANA claims, not as independent proof.) https://www.ana.net/content/show/id/pr-2025-11-transparency (accessed 2026-06-17; full text 403 to agent — figures via ANA release text surfaced in search).\n8. Programmatic cost guides (Stackmatix, \"Programmatic Advertising Costs\"; AI Digital, \"CTV Media Buying\"). Tier 5 (vendor-adjacent analytical guides — used for order-of-magnitude cost ranges only). Verification ~$0.10–$0.30 CPM; IAS CTV measurement ~$0.08 CPM; \"tech tax\" 40–60% of media CPM. https://www.stackmatix.com/blog/programmatic-advertising-costs ; https://www.aidigital.com/blog/ctv-media-buying (accessed 2026-06-17).\n9. Google Display & Video 360 Help, \"Updates to DoubleVerify's standard verification pre-bid rate card in April 2025.\" Tier 1 (platform primary doc for what DV charges). \"Starting April 2025, DoubleVerify will update its standard verification pre-bid rate card and marginally increase the CPM rates for some solutions\"; applies to new + existing line items; custom-rate advertisers unaffected. https://support.google.com/displayvideo/answer/16142752 (accessed 2026-06-17).\n10. Digiday, \"Ad verification is under fire: Ad execs are questioning its role as protector.\" Tier 5 (trade). Buyers \"rethinking whether to even use verification… versus buying entirely curated\"; Jay Friedman (Goodway) on analytics platforms; Sarah Karges (Havas Media Network) \"multi-layered approach\"; Dan Slivjanovski (DV CMO) rebuttal. https://digiday.com/marketing/ad-verification-is-under-fire-ad-execs-are-questioning-its-role-as-protector/ (accessed 2026-06-17).\n11. IAB, \"2025 Outlook: A Snapshot into Ad Spend, Opportunities, and Strategies for Growth\" (Jan. 2025; survey of buyers at brands and agencies). Tier 5 (industry research). CTV +13.8% to >$72B projected; customer acquisition top goal (64%); half of users insisting on human oversight/brand-safety protocols; only 21% of publishers always provide log/dashboard access. https://www.iab.com/insights/ (2025 Outlook) (accessed 2026-06-17).\n12. WARC / eMarketer CTV spend-intent reporting (2025). Tier 5 (industry research/analysis). ~56% of marketers globally planned to increase OTT/CTV spend in 2025 (up from 53% in 2024); ~70% call CTV a \"must-buy.\" https://www.warc.com/ ; https://www.emarketer.com/content/us-tv-ctv-ad-spending-benchmarks-q4-2025 (accessed 2026-06-17).\n13. Digiday, \"Pharma marketers weigh economy and chance of TV ad ban during upfronts season,\" 2025. Tier 5 (trade). Tightening DTC-ad regime; pharma \"more motivated than ever to have a full understanding of where every impression runs\"; pharma CTV migration; healthcare cannot afford misalignment (regulatory scrutiny risk). https://digiday.com/marketing/pharma-marketers-weigh-economy-and-chance-of-tv-ad-ban-during-upfronts-season/ (accessed 2026-06-17)."}, {"order": 12, "file": "Future_Trajectory.md", "title": "Future Trajectory: Programmatic CTV Brand Safety Through 2030", "summary": "", "body": "# Future Trajectory: Programmatic CTV Brand Safety Through 2030\n\n## Bottom Line\n\nThrough 2030 the central question is not whether CTV advertising grows — it does, past linear TV around 2028 — but **who sets the floor for what content advertising money will sit beside, and whether the tools to see CTV content mature before fraud and fragmentation define that floor by default.** Three forces enlarge the problem (the FAST/AVOD content-surface explosion, an adversarial fraud economy amplified by server-side ad insertion, and privacy law stripping the identifiers safety tools lean on). Three reshape the toolkit and the money (AI/multimodal classification, the content-level transparency push now shipping real product, and retail-media convergence). And two govern the rules themselves, pulling against each other: the post-GARM standards vacuum and a verification market consolidating around a single public incumbent (DoubleVerify) and a newly private one (Integral Ad Science, taken private by Novacap in December 2025). The most likely 2030 is not resolution but a **fragmented floor** — no single successor body, suitability set by vendor product defaults, per-advertiser exclusion lists, and platform policies, with content-level transparency real at the premium head and still thin across the long tail. The widest source of uncertainty is governance, not technology: the United States has made *coordinated* standard-setting legally suspect at the exact moment CTV's new, unsolved questions most need coordinating, while the EU is moving the opposite way, using the DSA to make platform-level safety partly mandatory. The forecast below holds those disagreements open as scenario uncertainty rather than averaging them into a false consensus.\n\n> **The single sharpest tension:** the coordination brand safety needs to solve its hard CTV problems is the very coordination the U.S. government has now declared presumptively suspect — while Europe is regulating in the opposite direction. The discipline's 2030 shape turns on which gravitational field wins.\n\n---\n\n## How This Forecast Is Built\n\nThis forecast lifts the eight drivers shaping the discipline, the current-state map established earlier, and the contingencies in the historical record, and turns them into a probabilistic, scenario-based forecast. It does five things, in order: states the **base rates** (what comparable transitions did), names the **drivers** that differentiate the scenarios, lays out **five scenarios** with probability ranges and signals to watch, pulls a **prediction-proxy snapshot** (liquid markets on these precise questions are thin, so this is disclosed honestly), and lists the **forecast-change triggers** — the concrete near-term events that would move weight between scenarios. Probabilities are ranges, not points, and the scenarios are not mutually exclusive: the real 2030 will be a *blend*, weighted toward whichever gravitational field dominates. Where the underlying figures come from a single vendor or remain contested, that uncertainty is carried forward rather than smoothed over.\n\n---\n\n## Base Rates: What Comparable Transitions Did\n\nA forecast unmoored from base rates is vibes. Four reference classes discipline this one.\n\n**Measurement standards converge, but slowly, and usually around an accredited referee.** Web viewability took roughly 2014–2018 to move from a published MRC threshold to near-universal procurement requirement, and it converged because an accredited neutral body (the MRC) and a buy-side ultimatum (P&G, 2017) forced it. The base rate for a *new* measurement problem reaching settled, accredited standardization is **5–8 years from first spec to operative norm** — which puts CTV content-level suitability, whose first shipping products date to 2026, on a path to maturity *around* 2030 at the earliest, and only if a referee exists.\n\n**Fraud is never solved, only taxed.** Across display, mobile, and video, every fraud type that became detectable was met with a new vector (the documented CTV lineage ICEBUCKET → StreamScam/LeoTerra → ParrotTerra → SneakyTerra → VASTFLUX is the canonical case). The base rate is unambiguous: **invalid traffic becomes a permanent cost of doing business, not a problem that goes to zero.** No reference class supports \"CTV fraud is solved by 2030.\"\n\n**Privacy law ratchets one way.** GDPR (2018), the U.S. state patchwork (2020→), India's DPDP (Rules notified November 2025, full compliance May 2027), Brazil's LGPD, Australia's staged reform — the historical pattern is that data-protection regimes tighten and essentially never loosen. The base rate says the identifier base keeps shrinking, mechanically pushing safety toward content-and-context methods region by region, on staggered timelines.\n\n**Standards bodies, once destroyed, rarely return in the same form.** When a coordinating body collapses under political or legal pressure (the reference class is thin but real), the function usually devolves to surviving private actors and de facto technical custodians rather than reconstituting as a new neutral convener — especially when the legal theory that killed it remains live. GARM's collapse fits this pattern, and the base rate argues *against* a clean GARM successor by 2030.\n\nThe base rates pull toward the **Fragmented Floor** scenario as the center of gravity. The scenarios differ in how far the countervailing forces (content-level transparency, AI, EU regulation) pull away from it.\n\n---\n\n## The Drivers, Ranked by Forecast Leverage\n\nRanked by how much each can move the 2030 outcome:\n\n1. **Governance (post-GARM vacuum + vendor consolidation)** — highest leverage, because it sets *who writes the rules*. Currently pulling hard toward fragmentation.\n2. **Content-level transparency** — the swing driver. If program/episode-level signal diffuses from the premium head down the FAST long tail, suitability becomes tractable; if it stalls at the head, the gap persists.\n3. **AI/multimodal classification** — the enabling driver. It is what makes content-level safety economically feasible at 178,000+ programs — *if* accuracy and explainability cross the threshold agencies and EU regulators will trust.\n4. **Privacy-law signal loss** — the redirecting driver. It does not raise or lower the floor; it forces the whole discipline toward content methods, making drivers 2 and 3 mandatory rather than optional.\n5. **FAST/AVOD sprawl** — the problem-generating driver. Decelerating in spend growth toward 2029, but the surface keeps expanding.\n6. **Fraud economics** — the permanent tax. Self-reinforcing, never solved, siphons budget and attention from suitability.\n7. **Retail-media convergence** — the reframing driver. Ambiguous sign: subordinates suitability to \"does it convert?\", which can align with or erode safety.\n\n---\n\n## The Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">CTV Brand-Safety Governance in 2030 — Scenario Probabilities<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Fragmented Floor (base cas…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"356.9\" y=\"8\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"413.9\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">35–45%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Content-Level Resolution<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"273.4\" y=\"44\" width=\"34.4\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"315.8\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">18–25%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Walled-Garden Consolidation<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"243.9\" y=\"80\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"281.4\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">12–18%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Fraud-and-Fragmentation Dr…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"243.9\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"281.4\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">12–18%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Re-coordination (under leg…<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"152\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"261.7\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">8–14%<\/text><\/svg><figcaption> <span class=\"credit\">Source: Synthesis from the eight drivers; ranges are calibrated estimates, not market prices.<\/span><\/figcaption><\/figure>\n\n\n\n*Probabilities are ranges and the scenarios overlap; the 2030 reality will be a weighted blend. They are anchored on the base rates above and the driver balance, not on liquid markets (which do not exist on these precise questions — see the prediction-proxy snapshot).*\n\n### Scenario 1 — The Fragmented Floor (35–45%, base case)\n\n**The story.** No body inherits GARM's convening role by 2030. The X-suit dismissal (March 2026, with prejudice) is vindication on the antitrust merits, but the FTC consent orders against the major holding companies — and X's pending Fifth Circuit appeal — keep collective standard-setting legally radioactive in the United States. The Brand Safety Floor survives only as orphaned text inside IAB Tech Lab's Content Taxonomy and benchmark repo. Suitability is set in three places at once: the surviving verifiers' product defaults (DoubleVerify and IAS), each large advertiser's bespoke exclusion lists, and each platform's own policy. Content-level transparency (IAS Total TV, Gracenote–PubMatic) covers premium broadcasters but reaches only a fraction of the FAST long tail. AI classification improves but is unevenly trusted and unaccredited. The discipline works, transacts, and grows — but as a patchwork of non-interoperable private floors with no neutral updater for CTV's new questions.\n\n**Probability:** 35–45%. **Time horizon:** dominant by 2028, persistent through 2030.\n\n**Drivers that produce it:** post-GARM vacuum (6) + vendor consolidation (7) set the floor by default; content-level transparency (8) arrives head-first; FTC chilling effect deters re-coordination. This is what the base rates predict.\n\n**Signals it is forming:** no successor convening body announced through 2027; FTC orders survive (or are not challenged); verification stays a DV/IAS-anchored market; transparency products stay concentrated on premium publishers.\n\n**What it means for an advertiser:** brand safety becomes a procurement-and-configuration discipline — choosing vendors, tuning exclusion lists, demanding supply-chain hygiene — not a matter of adopting a shared industry standard.\n\n### Scenario 2 — Content-Level Resolution (18–25%)\n\n**The story.** The transparency push (Driver 8) and AI classification (Driver 4) mature and, crucially, *diffuse down-tail*. Episode-level deal IDs, content identifiers, and clearinghouse/content-graph matching (the Gracenote–PubMatic model, IAB Tech Lab's signaling standards, IAB Spain's bid-request harmonization) become common enough that a buyer can know *which show* an ad runs in across most of the market, not just premium head inventory. Multimodal AI crosses the accuracy-and-explainability threshold and gets an MRC-style accreditation, converting \"AI brand safety\" from marketing label to audited capability. CTV's missing-URL problem is substantially *engineered around*. IAB Tech Lab becomes the de facto technical steward of suitability classification — governance by specification rather than by convening body.\n\n**Probability:** 18–25%. **Time horizon:** credible by 2029–2030 if the down-tail diffusion accelerates.\n\n**Drivers that produce it:** content-level transparency (8) reaches the long tail; AI (4) becomes trustworthy and accredited; privacy law (3) forces everyone onto content methods, accelerating adoption.\n\n**Signals it is forming:** transparency products expand from a handful of premium publishers to FAST aggregators and OEM platforms; an accredited AI-classifier benchmark appears; content IDs converge toward one interoperable standard rather than competing schemes.\n\n**The skeptic's caution (preserved):** transparency arrives first where it is least needed (premium broadcasters, already relatively safe) and last where it is most needed (the FAST long tail). The head/tail mismatch is the single biggest reason this scenario is a minority, not the base case.\n\n### Scenario 3 — Walled-Garden Consolidation (12–18%)\n\n**The story.** The premium streamers (Netflix's in-house ad platform, Amazon's Prime Video + DSP, Disney) and retail-media networks (Amazon, Walmart Connect/Vizio) absorb a growing share of CTV dollars into environments with proprietary, internal safety regimes. The 2025 partial openings to MRC-accredited *fraud/viewability* measurement do **not** extend to independent *content-level suitability* verification inside the owned-and-operated streamers. Safety gets handled platform-by-platform, on the platform's terms, with limited log-level transparency. Open-programmatic CTV — where third-party verification actually operates — shrinks as a share of premium spend. Brand safety becomes a function of *trusting each garden's grading*, a partial return to the broadcast-era \"it's premium TV, it's safe\" posture.\n\n**Probability:** 12–18%. **Time horizon:** advancing throughout, most visible 2028–2030.\n\n**Drivers that produce it:** retail-media convergence (5) + walled-garden dynamics; consolidation (7); the transparency fight resolved in the sell-side's favor.\n\n**Signals it is forming:** streamer O&O inventory grows as a share of CTV spend while third-party content-level accreditation inside those environments stalls; log-level access fights resolve toward sellers; retail-media CTV passes the projected one-in-five-dollars mark and keeps climbing.\n\n### Scenario 4 — Fraud-and-Fragmentation Drift (12–18%)\n\n**The story.** The problem outruns the tooling. FAST sprawl (Driver 1) and the fraud economy (Driver 2) grow faster than transparency and AI can cover the long tail. IVT stays elevated (the ~18% global CTV baseline persists or worsens in fast-growth regions); SSAI session-hijacking and bundle-ID spoofing evolve faster than detection; MFA-style arbitrage entrenches in CTV. Trust erodes, and the rational buy-side response is a *flight to safety* — budgets concentrate into PMPs, curated marketplaces, and walled gardens (the ANA's documented PMP migration accelerates), starving the open long tail. This is the pessimistic cousin of Scenario 3: consolidation driven not by streamer pull but by fraud push.\n\n**Probability:** 12–18%. **Time horizon:** a slow drift, entrenched if device attestation (OM SDK 1.6) and supply-chain hygiene fail to scale.\n\n**Signals it is forming:** CTV IVT rates rise rather than stabilize; a major new SSAI scheme breaks at ICEBUCKET-or-larger scale; device attestation adoption stalls; open-exchange CTV share of premium spend falls.\n\n### Scenario 5 — Re-coordination Under Legal Cover (8–14%)\n\n**The story.** Coordination returns — but it needs a legal shield to do so. Two paths: (a) the EU's DSA effectively *mandates* platform-level risk mitigation and ad transparency, forcing convergence on standards in Europe that then export globally as multinationals build to the strictest regime (the \"Brussels effect\"); or (b) the Fifth Circuit appeal, an FTC change of posture, or a safe-harbor carve-out clarifies that voluntary, viewpoint-neutral suitability standards are lawful, and a re-chartered neutral body (IAB-led, or a GARM successor under different governance) reconstitutes. Either way, a shared floor returns — under regulation in Europe, under legal clarification in the U.S.\n\n**Probability:** 8–14%. **Time horizon:** EU path live now and through 2030; U.S. path contingent on the appeal and the next administration's enforcement posture.\n\n**Signals it is forming:** the DSA's minors/transparency obligations are enforced against CTV-specific platforms (not just social VLOPs); a new neutral convener launches with explicit antitrust counsel; the Fifth Circuit narrows the FTC's theory.\n\n---\n\n## The Regional Forecast: One Collision Course, Four Speeds\n\nThe global forecast hides sharp regional divergence. Every region is on the same collision course — privacy law tightening the identifiers brand-safety tools depend on, while CTV supply grows faster than transparency standards — but at different points on the curve.\n\n- **United States** — governance is the variable. Politicization (FTC orders, the appeal) keeps collective standard-setting suppressed; the market defaults to the Fragmented Floor. Most likely 2030: vendor-and-platform-set floors, the world's most measured and most legally contested CTV market.\n- **European Union** — regulation is the variable. The DSA pushes toward *mandatory* platform safety and transparency; the TCF litigation (narrowed in IAB Europe's favor in January 2026, TCF v2.3 mandatory from February 2026) leaves the consent plumbing intact but under permanent legal pressure. Most likely 2030: the EU is where Scenario 5's regulatory path is live, and where \"brand safety\" is most a compliance discipline.\n- **India** — the compliance clock is the variable. DPDP full enforcement (May 2027) lands a near-categorical children's-targeting ban on a market scaling ~35%/year under JioStar/JioHotstar dominance, with a documented trust gap and thin local verification. Most likely 2030: rapid maturation inside walled gardens, children's-data compliance as the forcing function.\n- **LATAM** — fraud is the variable. Brazil's ~43% and Mexico's ~21% CTV IVT (Pixalate Q2 2025) make *paying for real inventory* the dominant problem; Brazil's newly autonomous ANPD and Mexico's executive-ministry enforcement reshape the privacy overlay. Most likely 2030: fraud remains the binding constraint; suitability is secondary until supply-chain hygiene improves.\n- **Australia** — staged reform is the variable. The deferred tranche-two advertising provisions could move Australia from permissive to GDPR-adjacent; a mature BVOD market on a trusted currency (OzTAM VOZ) gives it the strongest safety baseline of the non-US/EU regions. Most likely 2030: gentle convergence toward the EU model if tranche two passes, premium-trust-led safety in the interim.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">CTV Invalid-Traffic Rate by Region — the Fraud Gradient (Pixalate, Q1–Q2 2025)<\/div><svg viewBox=\"0 0 700 274\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"266\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"266\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">15<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"266\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">30<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"266\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">45<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"266\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">60<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">Brazil<\/text><rect x=\"185\" y=\"8\" width=\"318.9\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"511.9\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">43% IVT<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">APAC (region)<\/text><rect x=\"185\" y=\"42\" width=\"267.0\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"460.0\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">36% IVT<\/text><text x=\"175\" y=\"92\" font-size=\"13\" text-anchor=\"end\">EMEA (region)<\/text><rect x=\"185\" y=\"76\" width=\"222.5\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.10s\"/><text x=\"415.5\" y=\"92\" font-size=\"12.5\" class=\"t-muted\">30% IVT<\/text><text x=\"175\" y=\"126\" font-size=\"13\" text-anchor=\"end\">Canada<\/text><rect x=\"185\" y=\"110\" width=\"192.8\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.15s\"/><text x=\"385.8\" y=\"126\" font-size=\"12.5\" class=\"t-muted\">26% IVT<\/text><text x=\"175\" y=\"160\" font-size=\"13\" text-anchor=\"end\">UK<\/text><rect x=\"185\" y=\"144\" width=\"178.0\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.20s\"/><text x=\"371.0\" y=\"160\" font-size=\"12.5\" class=\"t-muted\">24% IVT<\/text><text x=\"175\" y=\"194\" font-size=\"13\" text-anchor=\"end\">Mexico<\/text><rect x=\"185\" y=\"178\" width=\"155.8\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.25s\"/><text x=\"348.8\" y=\"194\" font-size=\"12.5\" class=\"t-muted\">21% IVT<\/text><text x=\"175\" y=\"228\" font-size=\"13\" text-anchor=\"end\">United States<\/text><rect x=\"185\" y=\"212\" width=\"133.5\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.30s\"/><text x=\"326.5\" y=\"228\" font-size=\"12.5\" class=\"t-muted\">18% IVT<\/text><\/svg><figcaption> <span class=\"credit\">Source: Pixalate Q1 2025 Global &amp; Q2 2025 LATAM CTV Ad Supply Chain Trends Reports; open-programmatic figures, directional.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## Prediction-Proxy Snapshot (Disclosed Honestly)\n\nThere are **no liquid prediction markets** (Polymarket, Kalshi, Metaculus, Manifold) on the precise questions this forecast turns on — \"will a GARM successor exist by 2030,\" \"will CTV content-level transparency reach the FAST long tail,\" \"will the FTC orders survive appeal.\" This is disclosed rather than papered over with a fabricated number. The closest *market-priced* proxies are indirect: equity markets price DoubleVerify (NYSE: DV) as an ongoing concern with CTV as its fastest-growing segment (FY2025 revenue $748.3M, +14%), and Novacap's ~$1.9B take-private of IAS (December 2025) is a private-market bet that independent verification retains durable value even as the public-market duopoly framing dissolves. Both are consistent with the base-case Fragmented Floor: verification demand persists and concentrates regardless of which governance scenario wins. The forecast-change triggers below are the substitute for missing markets — concrete, dated events to watch.\n\n---\n\n## Forecast-Change Triggers (What Would Move the Weights)\n\nThe test of whether a forecast is real or rhetorical is whether it names what would change it. Through ~2028, watch for:\n\n1. **A successor convening body** — any credible, antitrust-counseled neutral convener for content suitability. Its launch moves weight from Scenario 1 toward Scenario 5; its continued absence through 2027 cements Scenario 1.\n2. **The Fifth Circuit ruling on X's appeal** and any shift in FTC enforcement posture. A narrowing of the \"coordination = collusion\" theory reopens the U.S. re-coordination path (Scenario 5); a broadening deepens the Fragmented Floor.\n3. **Content-level transparency reaching the FAST long tail** — IAS Total TV, Gracenote–PubMatic, or a successor expanding from premium broadcasters to FAST aggregators and OEM platforms. This is the single strongest signal toward Scenario 2.\n4. **An accredited AI-classifier benchmark** — MRC (or equivalent) accreditation of a multimodal content classifier with disclosed precision/recall. Converts AI from claim to capability and powers Scenario 2.\n5. **A new SSAI scheme at ICEBUCKET scale** (≈1B+ daily requests) — would push toward Scenario 4 and accelerate the flight-to-walled-gardens.\n6. **Device attestation (OM SDK 1.6) scaling** across Roku, Samsung, LG, and the open long tail — would blunt Driver 2's arms race and weaken Scenario 4.\n7. **EU DSA enforcement reaching CTV-specific platforms** (not just social VLOPs) — would activate Scenario 5's regulatory path and harden the EU/US divergence.\n8. **India's May 2027 DPDP enforcement** producing a named children's-CTV action — the first real test of the toughest children's-advertising regime examined here.\n\n---\n\n## What This Forecast Is Not\n\nIt is not a prediction that any one scenario happens. It is a probability distribution over plausible 2030s, with the conditions that would shift weight between them. The honest center of gravity is the **Fragmented Floor** — not because it is desirable (a shared, accountable floor would serve advertisers, publishers, and the public better) but because the base rates, the governance vacuum, and the U.S. legal posture all pull toward it, and the countervailing forces (transparency, AI, EU regulation) are real but not yet strong enough to overcome it by 2030. The reader should hold all five scenarios at once, weight them toward the base case, and update as the triggers fire. The deepest uncertainty is not technological — CTV's content problem is increasingly *solvable* — but political and institutional: whether an industry that has been told coordination is suspect can build the shared rules its hardest problems require.\n\n---\n\n## Open Questions Carried to the Reader\n\n1. Does content-level transparency diffuse from the premium head to the FAST long tail before 2030 — or stall where it is least needed?\n2. Does *anyone* inherit the GARM floor — a successor body, IAB Tech Lab by default, the DV/IAS product layer, or no one?\n3. Does AI classification cross the accuracy/explainability threshold agencies *and* EU regulators will trust — while AI is also generating the content to be classified?\n4. Does the EU's DSA-driven, mandatory-safety path export globally (Brussels effect), or stay regionally contained against a permanently fragmented U.S.?\n5. Does retail-media convergence raise the floor (low-quality adjacencies convert poorly) or lower it (performance pressure tolerates risk that converts)?\n6. Is the verification market a durable DV-plus-private-IAS structure, or does a credible third independent verifier emerge by 2030 — or does platform-native measurement erode all of them?\n\n---\n\n## Sources\n\nThis forecast synthesizes the findings and citations established in the preceding chapters rather than introducing new primary sources; every quantitative claim traces to a cited source. Key load-bearing anchors: eMarketer CTV market sizing; Pixalate Q1/Q2 2025 IVT benchmarks; the GARM dissolution and X-suit timeline including the March 2026 dismissal-with-prejudice and X's Fifth Circuit appeal; the FTC consent orders; IAS's December 2025 take-private by Novacap; DoubleVerify FY2025 results; and the 2026 content-level transparency launches — IAS Total TV and Gracenote–PubMatic."}], "glossary": [{"term": "ACR", "aliases": ["Automatic Content Recognition", "automatic content recognition"], "def": "A feature built into many smart TVs that identifies whatever is actually showing on the screen by matching samples of the picture or sound against a reference database, so a company can learn what a household watched even though there is no web-style address to read."}, {"term": "ad-server-level verification", "aliases": [], "def": "Checking whether an ad is safe and real at the system that assembles and delivers the video stream, rather than by running a script inside a web page, which is the fallback CTV needs because there is no page to inspect."}, {"term": "adpocalypse", "aliases": ["the adpocalypse"], "def": "The 2017 episode in which hundreds of advertisers pulled their money from YouTube after discovering their ads were running next to videos from extremist and terrorist groups, which proved that even real, fraud-free ad views could still damage a brand through bad company."}, {"term": "ads.txt", "aliases": ["Authorized Digital Sellers"], "def": "A public list a website publishes stating exactly which companies are allowed to sell its ad space, so buyers can spot and refuse ads offered by impostors pretending to represent that site."}, {"term": "advertising ID", "aliases": ["RIDA", "IFA", "device advertising ID"], "def": "A unique code assigned to a streaming device or phone that lets advertisers recognize the same device across different apps and ad requests without knowing a person's real identity."}, {"term": "agentic advertising", "aliases": ["agentic media", "agentic AI"], "def": "A newer approach in which software agents, rather than people or fixed rules, negotiate and evaluate ad placements automatically, including judging on the fly whether a given piece of content is appropriate for a brand."}, {"term": "app bundle ID", "aliases": ["bundle ID", "app.bundle"], "def": "The unique code an app store assigns to a streaming app, which is the closest thing a CTV ad has to a web address — it tells a buyer which app an ad ran in, but nothing about which show or scene it ran next to."}, {"term": "app-ads.txt", "aliases": [], "def": "The version of ads.txt built for apps and connected-TV platforms, since those don't have a website address of their own: it lets a publisher's app-store listing point to an authorized-sellers file so buyers can verify who is really allowed to sell that app's ad space."}, {"term": "arbitrage", "aliases": ["content arbitrage"], "def": "The practice of cheaply acquiring or producing content mainly to generate ad inventory to resell at a markup, rather than to genuinely inform or entertain viewers."}, {"term": "Brand Safety Floor", "aliases": ["the Floor"], "def": "The GARM-defined baseline of content considered unsuitable for any advertising at all — such as terrorism, child exploitation, or extreme violence — below which no brand, however risk-tolerant, is expected to advertise."}, {"term": "clean room", "aliases": ["clean rooms"], "def": "A secure system that lets two companies (such as a retailer and an advertiser) match and analyze their data together to measure ad results, without either side seeing the other's raw underlying data."}, {"term": "consent-manager framework", "aliases": ["consent manager"], "def": "A registered third-party system that collects and manages a user's privacy choices on a company's behalf, letting other businesses check what that user has and hasn't agreed to without collecting the consent themselves."}, {"term": "content graph", "aliases": [], "def": "A database that matches sparse or partial signals about a video (like a title fragment or genre) against a reference catalog of known shows, letting a company fill in what a bare-bones ad request doesn't say."}, {"term": "content ID", "aliases": ["content identifier"], "def": "A code attached to a specific piece of video content that lets buyers and sellers reliably refer to the same show or episode across different systems, without having to expose full viewing logs."}, {"term": "content opacity", "aliases": ["CTV data gap"], "def": "The condition in which an advertiser can see which app an ad ran in but not which specific show, episode, or scene it ran next to, because that deeper information rarely gets passed along in the ad transaction."}, {"term": "content taxonomy", "aliases": ["IAB Content Taxonomy", "IAB Tech Lab Content Taxonomy"], "def": "A standardized, tree-like list of content categories and labels (like Sensitive Topics or genres) that lets computers sort and describe video content consistently, so an ad system can act on a category instead of parsing free-text descriptions."}, {"term": "curated marketplace", "aliases": ["curation", "supply-path curation"], "def": "A pre-screened pool of ad inventory that a buyer's agency or platform has already vetted for quality and safety, so only approved publishers and apps are eligible before an ad auction even happens."}, {"term": "data-center traffic", "aliases": ["datacenter traffic"], "def": "Ad impressions that appear to come from computer-hosting facilities rather than real homes, which is a strong sign of fake, non-human viewing since genuine viewers watch from residential internet connections."}, {"term": "device attestation", "aliases": ["cryptographic device attestation"], "def": "A newer anti-fraud method in which the maker of a smart TV or streaming device cryptographically confirms that a given ad request really came from a genuine device it manufactured, making it much harder to fake device identities at scale."}, {"term": "device spoofing", "aliases": [], "def": "A type of ad fraud in which criminals fabricate or impersonate streaming devices and TVs to generate fake ad views that are made to look like real, valuable television inventory."}, {"term": "FAST", "aliases": ["Free Ad-Supported Streaming TV", "free ad-supported streaming television"], "def": "Free, ad-supported streaming TV channels (like Pluto TV or Tubi) that behave like old-fashioned linear TV channels but run over the internet, funded entirely by the ads shown during programming instead of a subscription fee."}, {"term": "GARM", "aliases": ["Global Alliance for Responsible Media"], "def": "An advertiser-led group, founded in 2019 and shut down in 2024 after being sued by Elon Musk's X, whose shared vocabulary for what counts as unsafe or risky content became the industry-wide reference point that advertisers, ad-tech companies, and platforms still use even though the group itself no longer exists."}, {"term": "genre / content object", "aliases": ["content object", "OpenRTB Content object"], "def": "A section of the technical message sent during an ad auction that is supposed to carry details about the specific program an ad will run in — its title, episode, genre, and rating — but which publishers fill in only inconsistently, if at all."}, {"term": "GIVT", "aliases": ["General Invalid Traffic"], "def": "Obviously fake or non-human ad traffic — like known bots or malformed ad requests — that can be caught with simple, standardized checks and blocklists rather than deep investigation."}, {"term": "invalid traffic", "aliases": ["IVT"], "def": "Ad impressions that don't represent a genuine human viewing, whether from bots, fraud schemes, or technical errors — the industry's umbrella term for fake or unusable ad views."}, {"term": "log-level data", "aliases": ["log-level access", "log-level transparency"], "def": "The raw, impression-by-impression records of exactly where and when a company's ads ran, which publishers are often reluctant to share because it would let buyers see (and cherry-pick) their best-performing content."}, {"term": "made-for-advertising", "aliases": ["MFA", "made-for-arbitrage"], "def": "Cheaply produced, ad-cluttered websites or channels engineered mainly to attract programmatic ad dollars rather than to genuinely inform or entertain an audience — technically 'safe' content that is nonetheless close to worthless to the advertiser."}, {"term": "mini walled gardens", "aliases": [], "def": "A description of how CTV's many streaming sellers each hold onto their own viewing data tightly and offer buyers different, incompatible levels of access, so the industry ends up with lots of small closed data silos instead of one open marketplace."}, {"term": "MRC", "aliases": ["Media Rating Council"], "def": "The nonprofit body that certifies whether ad-measurement products actually measure what they claim to, by auditing a company's methods and data — the closest thing the advertising industry has to an independent referee for what counts as a real, viewable ad."}, {"term": "OMID", "aliases": ["Open Measurement Interface Definition", "Open Measurement SDK", "OM SDK"], "def": "A standardized piece of software that lets independent measurement companies verify what happened during an ad's playback on a device — but it depends on the device supporting it, and many CTV devices and streaming setups don't."}, {"term": "OpenRTB", "aliases": [], "def": "The common technical language that ad buyers and sellers use to describe an ad opportunity and place a real-time bid on it in the fraction of a second before an ad loads."}, {"term": "over-blocking", "aliases": ["news over-blocking"], "def": "The unintended side effect of blunt keyword-based ad filters that block perfectly safe articles or shows simply because they contain a flagged word, starving legitimate journalism and content of ad revenue for no real safety benefit."}, {"term": "pixel stuffing", "aliases": ["impression stacking", "impression recycling"], "def": "A fraud technique that packs multiple invisible or overlapping ad trackers into a single ad slot so that one real viewer's impression gets billed to several different advertisers at once."}, {"term": "post-bid verification", "aliases": ["post-bid blocking"], "def": "A safety check that runs after an ad has already been served, confirming whether it actually appeared in an acceptable place — and, on the web, can still stop the ad from rendering, a blocking power that mostly doesn't exist on CTV."}, {"term": "pre-bid verification", "aliases": ["pre-bid filtering"], "def": "A safety check applied before an advertiser's money is spent, screening out an ad opportunity based on whatever limited information (like an app ID or category) is available at auction time."}, {"term": "programmatic advertising", "aliases": ["programmatic"], "def": "The automated buying and selling of ad space through real-time software auctions, rather than humans negotiating and booking each placement by hand."}, {"term": "proxy traffic", "aliases": [], "def": "Ad impressions routed through an intermediary server that disguises or misrepresents the real device or location generating them, a common technique for manufacturing fake CTV ad views at scale."}, {"term": "retail media", "aliases": ["retail-media network"], "def": "Advertising sold by a retailer (like Amazon or Walmart) using its own shopper purchase data, letting brands target and measure ads against actual buying behavior rather than general audience estimates."}, {"term": "sellers.json", "aliases": [], "def": "A public file that an ad exchange publishes listing every publisher and intermediary it is authorized to sell ad space for, so a buyer can trace exactly who stands to get paid along the chain before bidding."}, {"term": "server-side ad insertion", "aliases": ["SSAI", "ad stitching", "DAI", "dynamic ad insertion"], "def": "A technique that splices ads directly into a video stream on a server before it reaches the viewer's device, producing smooth, buffer-free playback that resists ad-blockers — but which also hides the viewer's device from the advertiser's measurement tools, making it the single biggest opening for CTV fraud."}, {"term": "SIVT", "aliases": ["Sophisticated Invalid Traffic"], "def": "Ad fraud clever enough to evade basic filters, requiring advanced analysis or human investigation to catch — the category that covers most CTV-specific schemes like device spoofing and stream-hijacking."}, {"term": "Suitability Framework", "aliases": ["brand suitability framework"], "def": "The companion system to the Brand Safety Floor that sorts borderline content into low-, medium-, and high-risk tiers, letting individual brands choose how cautious they want to be above the absolute floor."}, {"term": "supply-chain transparency", "aliases": ["supply-path optimization", "SPO"], "def": "The broader effort to let advertisers see and verify every intermediary that touches their ad dollars on the way to a publisher, aimed at rooting out hidden fees, unauthorized resellers, and fraud."}, {"term": "SupplyChain Object", "aliases": ["schain"], "def": "A record traveling inside every ad auction request that lists, in order, every company involved in reselling that particular ad space, letting a buyer reconstruct the full chain of hands an impression passed through."}, {"term": "UniversalAdId", "aliases": [], "def": "A standardized ID tag attached to a video ad creative that ties it back to an official industry registry, so the specific ad — not just the campaign — can be tracked and identified."}, {"term": "VAST", "aliases": ["Video Ad Serving Template"], "def": "The standard technical format that packages a video ad along with its tracking and verification instructions so a video player knows how to play it and report back on what happened."}, {"term": "viewability", "aliases": ["viewable impression"], "def": "A measurement standard requiring that a set share of an ad's pixels actually appeared on screen for a minimum length of time before it counts as a genuine ad impression, rather than one that loaded but was never actually visible."}, {"term": "VPAID", "aliases": [], "def": "An older web standard that let a verification company's tracking code run interactively inside a video ad in a browser — since replaced for CTV because it doesn't work on TV apps and streaming devices, which is a major reason ad verification is harder on television than online."}, {"term": "walled garden", "aliases": [], "def": "A large platform (like Amazon or a major streaming service) that keeps tight control over its own advertising data and inventory, historically limiting outside companies' ability <script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme
const themePref = localStorage.getItem('corpus-theme');
if (themePref) document.documentElement.dataset.theme = themePref;

function runSearch() {
  const q = searchBox.value.trim().toLowerCase();

  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';

      const exact = d.body.slice(pos, pos + q.length);

// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain

// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)

    acceptNode: function (n) {

      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }

    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;
