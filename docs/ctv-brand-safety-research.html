llers.json Supply Chain Transparency\" and app-ads.txt (incl. CTV-enhanced) implementation guides. https://iabtechlab.com/sellers-json/ ; https://iabtechlab.com/wp-content/uploads/2022/04/Ads.txt-1.1-Implementation-Guide.pdf — Tier 1 (spec). Accessed 2026-06-17. *Contribution: app-ads.txt authorized-seller mechanism; streaming-TV-specific app-ads.txt; sellers.json contents.*\n36. IAB Tech Lab, \"FAQ for sellers.json and SupplyChain Object,\" July 2019 (updated Sept 2020); Sellers.json final spec. https://iabtechlab.com/wp-content/uploads/2019/07/FAQ-for-sellers.json_supplychain-object.pdf — Tier 1 (spec). Accessed 2026-06-17. *Contribution: SupplyChain Object node structure; sellers.json roles; July 31 2019 finalization.*\n37. IAB Tech Lab / Brand Safety Institute / MRC, \"GARM Brand Safety Floor + Suitability Framework\" and Content Taxonomy 2.2 implementation guide. https://iabtechlab.com/garm-brand-suitability-developing-a-collaborative-interpretation-of-the-standard/ ; https://www.brandsafetyinstitute.com/resources/frameworks/brand-safety-floor-suitability — Tier 1/2 (standards body + institute). Accessed 2026-06-17. *Contribution: 11 categories × 4 risk levels; Content Taxonomy 2.2 \"Sensitive Topics\"; MRC incorporation by reference; open benchmark repo; framework survives GARM.*\n38. WebClassifAI / IAB, \"IAB Content Taxonomy 2.1 → 2.2: Sensitive Topics & Risk Levels.\" https://blog.webclassifai.com/blog/2.2-guide — Tier 5 (vendor explainer of IAB spec). Accessed 2026-06-17. *Contribution: 11 Sensitive-Topics nodes detail.*\n39. Marketing Dive / CNBC, \"GARM shutters following X antitrust suit,\" August 2024. https://www.marketingdive.com/news/garm-wfa-x-advertising-antitrust-lawsuit-elon-musk/723830/ ; https://www.cnbc.com/2024/08/08/ad-group-suspends-garm-after-of-x-elon-musks-antitrust-lawsuit-.html — Tier 4 (major/trade reporting). Accessed 2026-06-17. *Contribution: GARM shutdown Aug 2024; X lawsuit; WFA \"distraction/drained resources\" statement.*\n40. Zefr / PRWeek / Campaign US, \"GARM's discontinuation 'sad day for industry,' brand safety experts say,\" 2024. https://zefr.com/press/how-elon-musk-took-down-brand-safety-group-garm-whats-next-for-advertisers-looking-for-controls ; https://www.prweek.com/article/1884579/ — Tier 5/6 (trade + vendor commentary; position evidence). Accessed 2026-06-17. *Contribution: governance-vacuum characterization; GARM \"invented the standards.\"*"}, {"order": 3, "file": "03_Vendors_Standards_Actors.md", "title": "Vendors, Standards Bodies, and Platforms: The Present-Day Actors in CTV Brand Safety", "summary": "", "body": "# Vendors, Standards Bodies, and Platforms: The Present-Day Actors in CTV Brand Safety\n\n## Bottom Line\n\nThree layers of actors run present-day CTV brand safety, and they pay and answer to one another. The **verification vendors** sell the measurement and avoidance products advertisers and agencies buy: DoubleVerify (DV) and Integral Ad Science (IAS) form the public-market duopoly, joined by content-suitability specialist Zefr, fraud-and-IVT specialists Pixalate and HUMAN Security, and the recently-pivoted Scope3. The **standards and governance bodies** — IAB Tech Lab, the IAB and its regional sibling IAB Europe, the Media Rating Council (MRC), and the Trustworthy Accountability Group (TAG) — write the specs and grant the accreditations and certifications vendors and platforms seek. The **supply and platform layer** is the inventory whose safety is in question: Roku, Amazon, Samsung, LG, Tubi, Pluto TV, the open-programmatic conduits The Trade Desk and Google DV360, and the premium streamer ad tiers (Netflix, Disney+, Max, Peacock). It splits sharply between walled gardens that grade their own homework and open-programmatic supply that admits third-party verification. The largest structural change of the period is governance. GARM, the advertiser-side body that authored the industry's shared Brand Safety Floor and Suitability Framework, dissolved in August 2024 under an antitrust suit from Elon Musk's X — a suit a federal judge dismissed *with prejudice* in March 2026 — leaving the framework alive as orphaned text embedded in vendor tools, with no body to evolve it. The money runs in opposite directions. At the verification layer, advertisers and agencies buy (DV booked $748M and IAS roughly $600M in 2025); at the accreditation layer, vendors and platforms pay MRC and TAG to be audited and certified.\n\n---\n\n## 1. The Verification and Measurement Vendors\n\nBrand-safety verification is sold, not given. The buyer is almost always the advertiser or its agency, paying a vendor to confirm — pre-bid, post-bid, or both — that an impression reached a human, fully on-screen, next to content that fits the brand's suitability tolerance. The two largest vendors are publicly traded, which makes their CTV trajectory unusually legible through SEC filings and earnings disclosures.\n\n### 1.1 DoubleVerify (DV)\n\nDoubleVerify is the larger of the two public verification firms by revenue. DV reported full-year 2025 revenue of **$748.3 million, up 14% year-over-year**, with net income of $50.7 million and adjusted EBITDA of $245.6 million (a 33% margin) [1]. The company credits growth to \"social, CTV measurement, and programmatic activation,\" and discloses CTV-specific operating metrics: media transactions measured (MTM) for CTV rose 33% for the full year, with a 45% jump in Q2 and a 22% rise in Q4 2025 [1][2]. CTV is, in DV's own framing, one of its fastest-growing measured channels.\n\nDV's CTV products are demonstrably live. Its \"Brand Suitability\" capability page describes property-level (app-level) ad verification accredited by the MRC, and in 2025 the firm earned a fresh **MRC accreditation for CTV viewability** covering both pre-bid and post-bid measurement [3][4]. Its Fraud Lab is active too: in 2025 it identified and named a server-side ad insertion (SSAI) scheme it calls **\"SneakyTerra,\"** which hijacks real CTV device sessions, at peak spoofed more than 2 million devices a day, and may have cost unprotected advertisers more than $5 million a month at an average $20 CTV CPM [5]. Naming SneakyTerra is itself evidence that DV's CTV fraud operation is current in 2025-2026, not legacy.\n\nDV's accreditation footprint is broad. Beyond CTV viewability it holds MRC accreditation for property-level brand suitability across desktop and mobile in 40-plus languages and for CTV in nine languages, and separately earned MRC accreditation for an attention-measurement solution [3][6]. One caveat: the \"40+ languages\" and \"nine languages for CTV\" figures come from DV's own capability page — a corporate self-description, not independent proof of scope. The underlying MRC accreditations, though, are independently auditable through MRC's process.\n\n### 1.2 Integral Ad Science (IAS)\n\nIAS is the second public verification firm and DV's closest competitor. It reported Q3 2025 total revenue of **$154.4 million, up 16% year-over-year**, split between optimization revenue ($73.7M, +21%) and measurement revenue ($57.1M, +8%), with adjusted EBITDA of $55.3M (a 36% margin) [7]. Annualizing the 2025 quarterly run-rate puts full-year IAS revenue in the roughly $600 million range — materially smaller than DV, but in the same tier.\n\nIAS's flagship CTV product is **Total Media Quality (TMQ) for CTV**. In 2025, partnering with contextual-data firm IRIS.TV, it announced what it called the industry's first **video-level (content-level) brand suitability measurement for CTV** — a direct attempt to close the app-level-versus-content-level transparency gap that defines CTV's brand-safety problem [8][9]. IAS also markets a CTV transparency product, \"Total TV,\" meant to give buyers linear-like show-, genre-, and rating-level data across major networks and publishers using the Publica ad server [10]. In December 2025 it announced enhancements to its **Context Control Avoidance** solution aimed at AI-generated-content challenges [11], and in June 2026 it extended brand-safety and suitability measurement to YouTube audio ads [12] — both recent enough to confirm the product line is actively maintained.\n\nIAS's most significant 2025 accreditation news is structural. On **November 13, 2025**, the firm earned MRC accreditation for third-party measurement of impressions, viewability, and invalid traffic on **Amazon DSP / Amazon properties** via a server-to-server (S2S) integration — described as the first time an independent verification provider received MRC certification for these metrics inside Amazon's advertising ecosystem [13][14]. IAS separately holds MRC accreditation for sophisticated invalid traffic (SIVT) filtration in the CTV environment [15]. The Amazon accreditation matters beyond IAS: it marks the first crack in a previously closed walled garden (see §3).\n\n### 1.3 Zefr — the content-suitability specialist\n\nZefr is privately held and works a narrower niche than DV or IAS: **content-level brand suitability** on large video platforms. Its patented \"Cognition\" AI process combines human review and machine learning, explicitly mapped to the 11 categories and four risk tiers of the GARM / 4A's Brand Safety and Suitability Framework [16][17]. Its relevance to CTV runs two ways. First, its single largest surface is YouTube — itself the world's largest ad-supported CTV platform by some measures — and Zefr's brand-suitability data is applied to YouTube CTV buys [18]. Second, Zefr's content-level decisioning reaches premium CTV inventory through the **IRIS.TV contextual video marketplace**, which it joined as a partner [16][19].\n\nZefr's CTV-relevant accreditations are recent and specific. In **January 2026** it earned MRC accreditation for viewability reporting on YouTube via Google's Ads Data Hub (ADH) [20], and it holds MRC accreditation for content-level brand-safety and suitability labeling and reporting of English-language in-stream YouTube content **across desktop, mobile web, mobile app, and connected TV environments** [21]. Its reaction to GARM's dissolution is on the record too: the firm called it a \"sad day for the industry,\" which both confirms Zefr was operating at the time and signals its dependence on the GARM standard it measures against [22].\n\n### 1.4 Pixalate — the IVT and supply-fraud benchmarker\n\nPixalate is privately held and specializes in fraud, invalid traffic (IVT), and supply-chain integrity. It also serves the ecosystem as a *public benchmarker*: its quarterly IVT and Ad Fraud Benchmark reports are widely cited reference points, and they are demonstrably current. Pixalate's **Q4 2025** North America report (released March 2026) put the U.S. CTV IVT rate at 19% and analyzed over 103 billion programmatic impressions; its Q3 2025 global report put CTV IVT at 19% (versus 21% web and 33% mobile-app) [23][24]. Pixalate also publishes a CTV-specific **\"Malformed & Fraudulent CTV Bundle IDs\"** report — in Q3 2025, 18% of measured CTV bundle IDs (786 of 4,252) were malformed, unidentified, or fraudulent [25]. That bundle-ID work bears directly on CTV brand safety, because a malformed or spoofed bundle ID is exactly how an advertiser loses the ability to know what app — let alone what content — an impression ran in. These are dated 2025-2026 releases under Pixalate's own byline, so the work is plainly current.\n\n### 1.5 HUMAN Security — the SIVT-detection specialist\n\nHUMAN Security (formed by the 2020 merger that absorbed White Ops) is the group's bot-and-fraud-detection specialist, privately held, and notable for an accreditation milestone that anchors much of the industry's CTV fraud discipline: White Ops/HUMAN was **the first company to receive MRC accreditation for both pre-bid and post-bid invalid-traffic detection and mitigation across desktop, mobile web, mobile in-app, and Connected TV** — including the first-ever accreditation for pre-bid detection and mitigation of sophisticated invalid traffic (SIVT) [26][27]. Amazon also names HUMAN as a qualified third-party verification provider inside its protections, alongside DV and IAS [28]. One caveat: the \"first-ever MRC accreditation\" claim was a milestone true when granted, but the document confirming it (HUMAN's own solution brief and a 2021-era press release) is not freshly dated, so the current status of the accreditation is best confirmed against MRC's live list rather than assumed. HUMAN's continued naming as an Amazon-qualified provider in 2025 material indicates it remains an active CTV-fraud actor [28].\n\n### 1.6 Scope3 — the pivot away from verification\n\nScope3 is the most important *change* among the vendors, and a cautionary case in how fast a present-tense claim can go stale. It entered the brand-safety conversation by acquiring the verification firm **Adloox** and through its carbon/sustainability media-quality work, raising $25M in new funding in October 2024 [29]. But by 2025-2026 Scope3 had pivoted hard toward an \"agentic\" advertising platform — AI agents transacting media — and, critically, **sold Adloox to Peer39** in 2025-2026, with Peer39 framing the acquisition as unifying contextual intelligence and brand safety across Google, Meta, and the open web [30][31]. Scope3 retains a \"Brand Standards\" product (using LLMs rather than keyword lists to evaluate context, tone, and meaning, and to eliminate MFA, fraud, IVT, and non-brand-safe inventory by default), and it remains relevant to CTV through an ANA/Scope3 sustainability study [29][30]. The practical takeaway: **the Adloox verification asset now lives at Peer39, not Scope3** — a precise example of how a present-tense \"Scope3 is a verification vendor\" claim silently went stale via divestiture. Note too that Adloox/Scope3 remained a supported third-party verification label inside Google DV360 during the transition [32]; whether that integration is now branded Peer39 is exactly the kind of status that needs re-confirmation.\n\n### 1.7 Oracle Moat — the exited incumbent\n\nOracle's advertising business — the **Moat** measurement and verification platform (acquired for $850 million in 2017) and the broader Oracle Data Cloud — is **shut down**. Oracle announced the wind-down during its earnings call for the quarter ending March 31, 2024, after ad revenue collapsed from roughly $2 billion in 2022 to about $300 million in fiscal 2024, and it supported the products only through **the end of September 2024** [33][34]. The causes were privacy-law and data-business pressure: the Cambridge Analytica fallout and GDPR enforcement undercut Oracle's third-party data segments [33]. This matters because Moat was a genuine third pillar of viewability/verification alongside DV and IAS. Its exit consolidated the market into a near-duopoly and sent ad-tech competitors scrambling to fill the void [35]. Any present-tense reference to \"Oracle Moat\" as a live CTV verification option is, as of late 2024, false.\n\n### 1.8 Who pays whom, at the vendor layer\n\nThe economic structure is consistent: **advertisers and agencies buy verification.** DV's and IAS's revenue is, in essence, the sum of advertiser/agency spend on measurement and avoidance, priced as a CPM uplift or a platform fee on measured/optimized media. The platforms — Roku, Amazon, the streamers — are not the vendors' direct customers for the safety product. They are the *measured surface*, and their incentive runs the other way: they seek accreditation and integration so advertiser money flows to inventory the advertiser's verification vendor will bless. This two-sided structure is why the accreditation layer (§2) is load-bearing — it is the neutral arbiter both sides defer to.\n\n---\n\n## 2. The Standards and Governance Bodies\n\nIf the vendors sell measurement, the standards bodies define what is being measured and certify who may measure it. Four bodies matter most for CTV brand safety. A fifth — GARM — matters precisely because it is gone.\n\n### 2.1 The Media Rating Council (MRC)\n\nThe MRC is the closest thing the industry has to a neutral referee. This non-profit **accredits measurement products, not companies in the abstract** — accreditation goes to specific products and metrics after an independent audit of a vendor's methodology, data collection, disclosure, and controls; vendors must comply with MRC's Minimum Standards for Media Rating Research and submit to MRC-designed audits [36]. The MRC defines the viewability standard the entire industry uses (for video, 50% of pixels in view for two continuous seconds) and the GIVT/SIVT split that structures fraud detection [36]. As of 2025, it reports more than 110 research products under audit [36]. It remains the destination accreditation for CTV verification: DV's 2025 CTV-viewability accreditation, IAS's 2025 Amazon-DSP accreditation, Zefr's January 2026 YouTube accreditations, and HUMAN's pre/post-bid CTV-IVT accreditation are all MRC grants [3][13][20][26]. The accreditation *regime* is plainly live (the MRC issued Q2 2025 accreditation updates) [37], but the current status of any *individual* vendor's accreditation is best checked against the published list, because accreditations can lapse or be qualified.\n\nWho pays whom here: **vendors and platforms pay the MRC** to be audited and accredited. The advertiser benefits from the accreditation but is not MRC's direct customer for it.\n\n### 2.2 IAB Tech Lab\n\nIAB Tech Lab is the technical-standards body and, post-GARM, the most plausible institutional home for CTV brand-safety infrastructure. Its CTV-relevant standards portfolio is active and recently updated. The Tech Lab maintains the supply-chain transparency standards that underpin CTV brand safety — **ads.txt, app-ads.txt, sellers.json, and the SupplyChain Object** — and operates a **Transparency Center** that aggregates these files across the web [38]. Crucially for CTV, it released **enhanced, CTV-specific versions of ads.txt and app-ads.txt** to handle the content-owner/distributor relationships peculiar to streaming [38]. In **December 2025** it announced a new **CTV Ad Portfolio** and a major update to its Guide to Programmatic CTV, defining six core CTV ad formats from more than 100 industry submissions [39] — recent, dated evidence that the Tech Lab's CTV standards work is current.\n\nOn the GARM taxonomy specifically: IAB Tech Lab folded the GARM Brand Safety framework's 11 categories into its **Content Taxonomy 2.2** as \"Sensitive Topics,\" built in collaboration with GARM, and maintains GARM-aligned brand-suitability test benchmarks (human-labeled content) and an implementation guide [40][41]. This is how the GARM standard *survives its author's death*: encoded in a Tech Lab taxonomy vendors and publishers still use. One caveat: there is no clear, dated 2025-2026 statement that IAB Tech Lab has formally *adopted ownership* of and committed to *evolving* the GARM Floor + Suitability Framework as such. The Content Taxonomy integration predates GARM's dissolution, and the post-GARM governance gap (§2.5) remains open.\n\n### 2.3 The IAB and IAB Europe\n\nThe IAB (Interactive Advertising Bureau, US) is the trade body and a publisher of guidelines and ad specifications. **IAB Europe** is its European counterpart and operates the Transparency & Consent Framework (TCF) that intersects GDPR compliance — relevant to CTV because consent-signal availability shapes what can be measured. Here the IAB's role is convener and guideline publisher, not accreditor (that is MRC's role) or deep-technical-spec author (that is Tech Lab's). The IAB's brand-safety guideline work continues, but there is no discrete 2025-2026 IAB (as distinct from Tech Lab) CTV brand-safety standard to point to as currently live — IAB-proper remains an active body without a fresh dated CTV-specific deliverable in hand.\n\n### 2.4 The Trustworthy Accountability Group (TAG)\n\nTAG runs the industry's **certification seal programs**, distinct from MRC's product accreditation. It certifies *companies* (not products) against best practices in four programs: **Certified Against Fraud, Certified Against Malvertising, Brand Safety Certified, and Certified for Transparency** [42]. TAG is demonstrably live and growing: in 2025 it awarded a **record 326 Certification Seals** (up from 321 in 2024) to 207 certified companies, with 34 companies reaching \"Platinum\" status (three or more seals) and the malvertising program up 31% year-over-year [42]. The directly relevant program is the Brand Safety Certified seal, which certifies that a company has adopted brand-safety best practices; ad-tech intermediaries and CTV supply players seek it. TAG's 2025 certification announcement (March 2026) and its 2025 analysis report confirm the program is operating now [42][43]. Who pays whom: **companies pay TAG** to be certified.\n\n### 2.5 GARM — the dissolved body and the post-2024 vacuum\n\nThe most consequential governance fact of the period is a subtraction. The **Global Alliance for Responsible Media (GARM)**, a non-profit initiative housed within the World Federation of Advertisers (WFA), authored the **Brand Safety Floor + Suitability Framework** — the shared 11-category, four-risk-tier taxonomy that became the industry's common language for what content advertisers will and won't sit next to. In **August 2024, GARM shut down**, days after Elon Musk's X Corp filed an antitrust suit alleging GARM had coordinated an illegal advertiser boycott of X; GARM said the allegations had become a distraction and had \"significantly drained its resources and finances\" [44][45]. The legal end came later. On **March 26, 2026**, U.S. District Judge Jane Boyle (Northern District of Texas) **dismissed X's suit with prejudice**, ruling that even if X's allegations were true they would not establish an antitrust claim — X had not shown antitrust injury [46][47]. The dismissal-with-prejudice means X can never refile, but it came *after* GARM was already gone. The legal vindication did not resurrect the body.\n\nThe vacuum is real, and as of this writing no single successor has filled it. Industry reporting in late 2024 found that **no single organization has assumed GARM's role**; the Framework persists only as (a) standalone guidelines anyone may use and (b) functionality already baked into platform, publisher, and verification-vendor tools — YouTube, Pinterest, and others restated that their GARM-derived policies remained in place [48]. Observers flag a structural **\"chilling effect\"**: the antitrust theory X advanced, even though dismissed, discourages advertisers from collectively setting standards again, threatening the very *collaboration* that produced GARM [49]. The IAB Tech Lab Content Taxonomy 2.2 integration (§2.2) is the most concrete surviving vessel for the taxonomy, but evolving the standard — not merely preserving the 2023 snapshot — currently has no clear owner. This is the single biggest open governance question in CTV, and in digital brand safety at large.\n\n---\n\n## 3. The Supply and Platform Layer: The Inventory in Question\n\nThe platforms do not buy verification; they are the surface being verified. And they divide along the most important fault line in CTV brand safety: **walled gardens** that historically resisted independent third-party measurement versus **open-programmatic supply** that admits it.\n\n### 3.1 The walled-garden vs. open-programmatic divide\n\nIn open programmatic — inventory transacted through SSPs and bought by DSPs like The Trade Desk and Google DV360 — advertisers can attach their own MRC-accredited verification vendor (DV, IAS, Scope3/Peer39) pre-bid and post-bid, and lean on IAB Tech Lab supply-chain standards (app-ads.txt, sellers.json, SupplyChain Object) to trace what they bought [38][32]. In walled gardens — historically Amazon, and the streamers' owned-and-operated environments — measurement happened on the platform's terms, often with limited or no independent verification. The defining trend of 2025-2026 is the **partial opening of the walled gardens to MRC-accredited third-party verification**, with Amazon and Netflix the leading examples.\n\n### 3.2 The Trade Desk (open programmatic)\n\nThe Trade Desk (TTD) is the largest independent DSP and the primary open-programmatic conduit for CTV. It has adopted the IAB supply-chain standards (sellers.json, SupplyChain Object, app-ads.txt) and requires them of supply, and it lets advertisers attach integrated third-party brand-safety/verification vendors to inventory transacted through its marketplaces, including its curated \"Sellers and Publishers 500+,\" which spans CTV [50][51]. In 2025 TTD acquired the supply-data firm **Sincera** and launched **OpenSincera**, a free service that exposes media-quality and supply-chain metrics — ad load, refresh rate, viewability context — that bear directly on brand-suitability decisioning [52][53]. TTD is publicly traded and continues to file 8-Ks through FY2025, confirming it is an operating concern [54]. The Sincera acquisition and OpenSincera launch are both recent, dated to 2025 [52].\n\n### 3.3 Google DV360 (open programmatic, walled-garden-adjacent)\n\nGoogle's Display & Video 360 (DV360) is the other major DSP and a hybrid: it buys open programmatic but also fronts Google's own inventory. For CTV, DV360 supports third-party verification labels from **IAS, DoubleVerify, and Scope3 (formerly Adloox)** via its Structured Data File integration, though the *available* CTV brand-safety settings run narrower than for display — for CTV, only Ad Fraud Prevention, Brand Suitability, Context Control Avoidance, and Quality Sync (IAS's settings) are offered [32][55]. Google said it would update the DV360 brand-suitability experience in 2025 [32]. That narrowed control set is itself evidence of the content-level transparency gap: even inside a sophisticated DSP, CTV offers fewer brand-safety levers than web display. One caveat: the \"Scope3 (formerly Adloox)\" label inside DV360 may now be Peer39-owned (§1.6) — a status worth re-confirming.\n\n### 3.4 Roku\n\nRoku is the largest U.S. CTV operating-system and ad platform by several measures, publicly traded, filing 10-Qs and 8-Ks through FY2025 [56]. Its scale makes it a central piece of CTV inventory. One caveat worth stating plainly: Roku is unambiguously an operating, public company in 2025, but there is no clean, dated 2025-2026 source confirming a *specific named* Roku brand-safety verification partnership with DV or IAS — Roku's SEC filings discuss the ad business generally, not a specific verification integration [56]. So a current Roku-DV/IAS brand-safety partnership cannot be asserted as fact here. What is established is narrower: Roku is a major, operating CTV ad platform whose inventory sits in the open and curated programmatic supply pool. The named-partnership question is left open below rather than answered.\n\n### 3.5 Amazon (Fire TV, Prime Video ads)\n\nAmazon is the highest-stakes walled-garden case, because of its 2025 partial opening. **Prime Video introduced ads**, and Amazon operates the Fire TV OS and the Amazon DSP. Historically Amazon resisted independent third-party verification of its owned inventory. That changed in 2025. Third-party verification via **DoubleVerify, Integral Ad Science, and Adloox** is now available on Amazon DSP via server-to-server integrations, and for streaming-TV/Prime-Video ads Amazon accepts third-party impression tracking from certified vendors [57]. The landmark event: on **November 13, 2025, IAS earned MRC accreditation for third-party measurement (impressions, viewability, IVT) on Amazon properties** via S2S integration — described as the first independent MRC certification of these metrics inside Amazon's ecosystem [13][14]. Amazon's own brand-safety posture names **HUMAN, DoubleVerify, and Integral Ad Science** as qualified third-party providers, and excludes impressions later found invalid from billing [28][57]. The significance: as of late 2025 the Amazon walled garden is measurably more open than it was, but the opening is recent and partial, and the accreditation is metric-specific (impressions/viewability/IVT), not full content-level suitability.\n\n### 3.6 The premium streamer ad tiers: Netflix, Disney+, Max, Peacock\n\nThe premium streamers' ad-supported tiers are the most-watched and least-independently-verified CTV inventory. In 2025, several of them opened to programmatic and third-party measurement.\n\n- **Netflix** fully transitioned to its **own ad-tech platform** in 2025 and opened programmatic access through multiple DSPs — **The Trade Desk, Google DV360, Yahoo DSP, Microsoft, and (added September 2025) Amazon DSP** [58][59]. Critically, Netflix says it works with **more than 50 global ad-measurement vendors**, and named a verification/measurement lineup including **DoubleVerify, Integral Ad Science, Nielsen, iSpot, Kantar, EDO, TVision, NCSolutions, Affinity Solutions, and Lucid** [58]. In November 2025 Netflix said its ad tier reached roughly 190 million monthly active viewers under a new metric [60]. This is the clearest evidence yet that a flagship walled garden has admitted DV and IAS for measurement.\n- **Peacock (NBCUniversal), Max (Warner Bros. Discovery), Tubi and Fox One (Fox), Paramount+ and Pluto TV (Paramount Skydance), and Disney+/Hulu/ESPN (Disney)** all hold programmatic ad deals with **Amazon Ads** as of 2025 [59], placing their inventory in a partially-verifiable programmatic pool. One caveat: an Amazon DSP deal confirms programmatic *access*, not the depth of independent third-party brand-safety verification on each O&O surface — that varies by streamer and is not uniformly MRC-accredited.\n\nThe pattern across §3.5-3.6 is clear: the premium-streamer and Amazon walled gardens are opening to MRC-accredited *fraud/viewability* measurement faster than to independent *content-level suitability* verification. That suitability gap is the hardest one — and the one IAS's video-level CTV product (§1.2) and Zefr's IRIS.TV reach (§1.3) are built to close.\n\n### 3.7 Samsung TV Plus, LG Channels, and the FAST layer\n\nThe FAST (Free Ad-Supported Streaming TV) layer is the most fragmented and lowest-transparency inventory. The device-manufacturer FASTs — **The Roku Channel, Samsung TV Plus, LG Channels, Vizio WatchFree+, TCL Channel** — and the media-company FASTs — **Pluto TV (Paramount Skydance) and Tubi (Fox)** — have proliferated to thousands of channels [61]. **Samsung TV Plus** is the largest by channel count, with nearly 700 U.S. channels, over 3,500 globally across 24 countries, and 88 million monthly active users as of 2025 [61]. The brand-safety problem here is structural: the sheer channel count, the app-level (not content-level) transparency of most FAST inventory, and the supply-chain opacity that breeds malformed bundle IDs (Pixalate, §1.4) make FAST the canonical \"wild west\" that IAB Tech Lab's CTV-specific app-ads.txt aims at [38]. One caveat: the *scale and existence* of these FAST platforms in 2025-2026 is well documented [61], but no platform-specific, dated brand-safety verification program for Samsung TV Plus or LG Channels is on the record — that gap remains open below. The honest current-state claim: FAST inventory is large, fast-growing, and structurally under-verified relative to premium streaming.\n\n---\n\n## 4. How the Three Layers Pay and Answer to One Another\n\nThe cleanest way to hold the present-day map is to follow two sets of arrows: the money and the accreditation. They run in opposite directions, and that opposition is the system's load-bearing tension.\n\n**Money (verification):** Advertiser/agency → verification vendor. DV's $748M and IAS's ~$600M in 2025 revenue is, in aggregate, advertiser spend on knowing what they bought [1][7]. The platform is the measured surface, not the paying customer.\n\n**Accreditation/certification (trust):** Vendor and platform → MRC and TAG. Vendors pay MRC to audit and accredit specific products (DV's CTV viewability, IAS's Amazon-DSP metrics, Zefr's YouTube suitability, HUMAN's CTV SIVT) [3][13][20][26]; companies pay TAG for Brand Safety Certified and Certified Against Fraud seals [42]. The advertiser *benefits* from these accreditations but does not buy them directly.\n\n**Standards (language):** IAB Tech Lab authors the specs — Content Taxonomy 2.2, app-ads.txt/sellers.json/SupplyChain Object, the December 2025 CTV Ad Portfolio — that both vendors and platforms implement [38][39][40]. GARM authored the *suitability* language, and its dissolution left that specific dialect without a maintainer [44][48].\n\nThe walled-garden-vs-open-programmatic divide cuts across all three layers. Open programmatic lets the advertiser bring its own accredited verification vendor and its own supply-chain checks; walled gardens historically forced the advertiser to trust the platform's grading. The 2025 story is those gardens cracking open to MRC-accredited third-party measurement (Amazon, Netflix) under advertiser pressure [13][58].\n\n---\n\n## Open Questions\n\n1. **Who, if anyone, becomes GARM's institutional successor?** The Brand Safety Floor + Suitability Framework survives as text and as embedded tooling, and the Content Taxonomy 2.2 carries the categories, but no body has publicly claimed ownership of *evolving* the suitability standard post-2024. Does IAB Tech Lab, the 4A's, or a new advertiser coalition formally take it on — and does the X-suit \"chilling effect\" (even post-dismissal) deter collective standard-setting?\n\n2. **Does the Amazon/Netflix opening extend from fraud/viewability to content-level suitability?** The 2025 walled-garden openings are concentrated on MRC-accredited impressions/viewability/IVT, not independent content-level brand-suitability verification. Whether DV, IAS, and Zefr get accredited content-level measurement *inside* the O&O streamer environments is the next frontier.\n\n3. **What is Roku's actual current third-party brand-safety verification posture?** No clean, dated 2025-2026 named Roku-DV/IAS brand-safety partnership is on the public record; that should be established before any present-tense claim is made.\n\n4. **Where does the Adloox verification asset now live, and under what brand inside DSPs?** Scope3 sold Adloox to Peer39; whether the DV360 \"Scope3 (formerly Adloox)\" label is now Peer39, and what Scope3's residual \"Brand Standards\" product covers in CTV, needs re-confirmation.\n\n5. **Is HUMAN Security's CTV SIVT accreditation still current, and how does it compare to DV's and IAS's CTV IVT accreditations today?** The milestone accreditation is older; its present status should be checked against MRC's live list.\n\n6. **What are the platform-specific brand-safety programs (if any) at Samsung TV Plus, LG Channels, and the major FASTs?** Scale is confirmed; verification posture is not.\n\n7. **Does the verification duopoly (DV + IAS) consolidate further** now that Oracle Moat is gone and Scope3 has exited verification — or do contextual players (Peer39, IRIS.TV) and platform-native measurement erode the duopoly's content-level moat?\n\n---\n\n## Sources\n\n1. DoubleVerify Holdings, Inc., \"DoubleVerify Reports Fourth Quarter and Full Year 2025 Financial Results,\" investor relations / SEC 8-K, Feb 2026. https://ir.doubleverify.com/news-events/press-releases/press-releases-details/2026/DoubleVerify-Reports-Fourth-Quarter-and-Full-Year-2025-Financial-Results/default.aspx — *Tier 1 (company filing). Full-year 2025 revenue $748.3M (+14%), net income, EBITDA, CTV MTM growth metrics. Accessed 2026-06-17.*\n2. Investing.com, \"DoubleVerify Q2 2025 slides: Revenue jumps 21% as social and CTV strategies deliver,\" 2025. https://www.investing.com/news/company-news/doubleverify-q2-2025-slides-revenue-jumps-21-as-social-and-ctv-strategies-deliver-93CH-4171618 — *Tier 4. Corroborates CTV MTM growth (Q2 +45%) d Fraud Benchmarks: CTV IVT Rate in United States at 19%,\" Mar 9 2026. https://www.globenewswire.com/news-release/2026/03/09/3251883/0/en/ — *Tier 1 (vendor benchmark) / Tier 5 (analytical). 103B impressions analyzed; US CTV IVT 19%. Accessed 2026-06-17.*\n24. Yahoo Finance / Pixalate, \"Q3 2025 Global IVT & Ad Fraud Benchmarks: Web 21%; Mobile App 33%; CTV 19%,\" Nov 2025. https://finance.yahoo.com/news/pixalate-releases-q3-2025-global-210600106.html — *Tier 1/5. Global CTV IVT benchmark. Accessed 2026-06-17.*\n25. Pixalate, \"Q3 2025 Malformed & Fraudulent CTV Bundle IDs Risk Report.\" https://www.pixalate.com/blog/q3-2025-malformed-fraudulent-ctv-bundle-ids-risk-report — *Tier 1/5. 18% of measured CTV bundle IDs malformed/fraudulent. Accessed 2026-06-17.*\n26. HUMAN Security, \"White Ops is the First Company to Receive MRC Accreditation for Both Pre-Bid and Post-Bid Invalid Traffic Detection and Mitigation Across Desktop, Mobile Web, Mobile In-App and Connected TV.\" https://www.humansecurity.com/newsroom/white-ops-is-the-first-company-to-receive-mrc-accreditation... — *Tier 1 (press release). First pre/post-bid CTV SIVT accreditation; date older — currency flagged. Accessed 2026-06-17.*\n27. HUMAN Security, \"First Company with MRC Accreditation for End-to-End SIVT\" (solution brief PDF). https://www.humansecurity.com/hubfs/HUMAN_Solution-Brief_MRC-Accreditation.pdf — *Tier 1 (corporate). SIVT accreditation detail. Accessed 2026-06-17.*\n28. Amazon Ads, \"Amazon Ads verified supply for programmatic advertising.\" https://advertising.amazon.com/library/expert-advice/verified-supply-programmatic-advertising — *Tier 1 (platform). Names HUMAN, DoubleVerify, IAS as qualified third-party providers; invalid impressions excluded from billing. Accessed 2026-06-17.*\n29. Digiday, \"Scope3 aims to upend ad tech with an 'agentic platform' for effective, responsible advertising.\" https://digiday.com/media-buying/scope3-aims-to-upend-ad-tech-with-an-agentic-platform... — *T
