.\n36. StackAdapt / Anoki, multimodal AI for CTV brand safety overviews, 2025–2026. https://www.stackadapt.com/resources/blog/brand-safety-advertising ; https://anoki.ai/multimodal-ai-for-ctv-101 — Tier 5/6 (vendor educational content; cited for capability description + as interested promotion).\n37. USPTO patent documents on multimodal video classification for brand safety (mechanism reference). https://image-ppubs.uspto.gov/ — Tier 1 (primary patent texts; mechanism, not efficacy).\n38. Levi, Levi, Mishra, Morra, \"AI vs. Human Moderators: A Comparative Evaluation of Multimodal LLMs in Content Moderation for Brand Safety,\" arXiv:2508.05527, 2025-08. https://arxiv.org/pdf/2508.05527 — Tier 2 (preprint; documents competitive performance AND failure cases; specific numeric scores not extracted from PDF — flagged).\n39. Marketing Brew, \"Legislators ask DoubleVerify, IAS for answers after new report finds ads next to explicit content,\" 2025-02-10. https://www.marketingbrew.com/stories/2025/02/10/ — Tier 5 (trade; reports Congressional letters re: URL reporting + AI transparency).\n40. Adweek, \"Scope3's New Brand Safety AI Takes on IAS and DoubleVerify,\" 2025-03. https://www.adweek.com/programmatic/scope3-ias-doubleverify-ai-agents-brand-safety/ — Tier 5 (trade; Scope3 funding + Adalytics-pressure context).\n41. PPC Land, \"Peer39 snaps up Adloox from Scope3 to challenge DoubleVerify and IAS,\" 2026-06-02 (Scope3 exit from verification; O'Kelley quotes; layoffs Aug. 2025 & Feb. 2026). https://ppc.land/peer39-snaps-up-adloox-from-scope3-to-challenge-doubleverify-and-ias/ — Tier 5 (trade; GOING-CONCERN source for Scope3's pivot). Corroborated by Adweek, \"Peer39 Acquires Adloox from Scope3.\"\n42. GlobeNewswire / DoubleVerify, \"DoubleVerify Uncovers 'SneakyTerra' — the First SSAI Fraud Scheme to Hijack Real CTV Device Sessions,\" 2021-03-04. https://www.globenewswire.com/news-release/2021/03/04/ — Tier 1 (vendor fraud-lab release; HISTORICAL 2021 — cited as origin example, not current scale).\n43. Pixalate, \"Most Common Programmatic Ad Fraud Types in CTV Apps\" (March 2026; ~887M impressions, ~4,000 apps; proxy-IVT shares by platform) and Q3 2025 supply-chain reports. https://www.pixalate.com/blog/pixalates-march-2026-most-common-programmatic-ad-fraud-types-in-ctv-apps — Tier 5 (vendor data; recent; interest noted).\n44. AdExchanger, \"Adalytics Report Challenges Verifiers And Pubs That Claim 100% Brand-Safe Media,\" 2024–2025. https://www.adexchanger.com/marketers/adalytics-report-challenges-verifiers-and-pubs-that-claim-100-brand-safe-media/ — Tier 5 (trade; reports Adalytics findings + vendor responses).\n45. DoubleVerify, \"DoubleVerify's Response to Adalytics' March 28 GIVT Report\" and \"Statement on Adalytics Report,\" 2025. https://doubleverify.com/blog/web/verify/doubleverifys-response-to-adalytics-march-28-givt-report — Tier 1/6 (vendor rebuttal; cite as DV's position).\n46. DoubleVerify, \"Video Filtering\" / VPAID-availability product documentation (CTV last-line-filter constraint). https://doubleverify.com/ — Tier 1/6 (vendor self-description of a technical constraint).\n47. Adweek, \"FTC Orders WPP, Publicis, and Dentsu to Stop Alleged Brand Safety Collusion,\" 2026-04; eMarketer and M&M Global coverage. https://www.adweek.com/agencies/ftc-cracks-down-on-ad-giants-over-alleged-brand-safety-collusion/ — Tier 5 (trade; independent corroboration of FTC settlement terms and that firms did not admit wrongdoing)."}, {"order": 5, "file": "05_Regional_US_Canada.md", "title": "Regional Deep-Dive — Brand Safety & Suitability in Programmatic CTV: United States and Canada", "summary": "", "body": "# Regional Deep-Dive: The United States and Canada\n\n## Bottom Line\n\nThe United States runs the world's most mature programmatic Connected TV (CTV) market — and, as of mid-2026, its most politically contested. US CTV ad spend is on track to reach roughly **$38 billion in 2026** (eMarketer), up from about **$33.4 billion in 2025**, and 2026 is the first year CTV's upfront commitments are projected to exceed primetime linear's. Brand safety here migrated wholesale from web and social into streaming through three verification incumbents — DoubleVerify, Integral Ad Science (IAS), and Comscore — built on standards from the IAB Tech Lab and the Media Rating Council (MRC). Then the discipline's governance backbone snapped. In August 2024, the World Federation of Advertisers (WFA) discontinued the **Global Alliance for Responsible Media (GARM)**, days after Elon Musk's X filed an antitrust suit. No successor standards body filled the vacuum. The **US federal government** did. Through 2025–2026, the Federal Trade Commission (FTC), under a Republican majority, opened a sweeping antitrust probe into \"brand-safety collusion,\" extracted a viewpoint-neutrality condition from the **Omnicom–IPG merger** (final order September 2025), and in April 2026 announced settlements with **WPP, Publicis, and Dentsu** barring coordinated brand-safety standards keyed to political content. Brand safety in the US is no longer merely an ad-quality discipline. It is a First Amendment and antitrust battlefield.\n\nCanada is structurally similar but roughly **10–25x smaller** (Canada CTV ad spend is variously put near **US$1.3 billion to US$2.5 billion** depending on source and definition for 2025–2026), and its brand safety carries no equivalent political weaponization. Canadian buyers source brand-safe CTV through the same US-built verification stack and the same IAB Tech Lab standards. The regulatory overlay is where the two diverge. Canada's federal privacy law (PIPEDA) is finally being modernized — **Bill C-36, the Protecting Privacy and Consumer Data Act, was tabled June 15, 2026**, replacing the twice-failed C-27. **Quebec's Law 25** already operates as North America's strictest consent-and-penalty regime. And the **Online Streaming Act (Bill C-11)** is dragging foreign streamers into a Canadian-content contribution regime (raised by the CRTC to **15% of revenue in May 2026**) that has no US analogue. The contrast is clean: the US fights about *what content advertisers may avoid*; Canada regulates *who must pay into the content system and how data may be used*.\n\n> **Going-concern note.** These pages treat every \"currently operates / is owned by / is in market\" assertion as a dated factual claim. Verification-vendor ownership moved fast in 2025: **IAS was taken private by Novacap on December 23, 2025**, and **DoubleVerify remained NYSE-listed (DV)** through its most recent confirmable filings. GARM is **discontinued, not dormant** — there is no live successor body as of this writing. Treat any present-tense status below as confirmed only to the cited date.\n\n---\n\n## 1. The United States: Market Scale and Maturity\n\n### 1.1 The size of the prize\n\nThe US is the single largest CTV advertising market on earth, and the one where programmatic transaction of CTV inventory is most developed. Per eMarketer (Insider Intelligence) forecasts reported across the 2025–2026 trade press, US CTV ad spend reached approximately **$33.35 billion in 2025** and is projected at roughly **$38 billion in 2026**, a year-over-year increase near **14%** [1][2]. The climb continues: third-party syntheses of eMarketer and other forecasts put US CTV near **$47 billion by 2028** and above **$50 billion by 2029** [2][3].\n\nTwo structural milestones make 2026 the year CTV stops being \"emerging.\" First, eMarketer projects that **US CTV upfront ad spend (~$17.73 billion) will exceed primetime linear-TV upfront spend (~$16.98 billion) for the first time** in 2026 [1] — and the upfront market is the clearest signal of where the largest, most brand-conscious advertisers commit dollars a year ahead. Second, on the broader measure, eMarketer and MNTN-cited forecasts expect CTV to **surpass traditional TV advertising outright around 2028** [2][3].\n\nA caveat worth keeping in view: the 2026 dollar figure is a forecast, not an actual. Different eMarketer vintages and competing forecasters (MNTN Research, StackAdapt syntheses) produce figures in a **$33–38 billion** band for the 2025–2026 window. The \"~$33B in 2025, ~$38B in 2026\" pair is best read as the central eMarketer estimate — a single forecaster's projection, even if it is widely re-reported [1][2][3].\n\n### 1.2 The platform layer that defines the safety problem\n\nBrand safety in CTV turns on *who controls the inventory*. Unlike the open web, there is no page URL, so the safety question collapses into \"which app, on which device, showing what content.\" In the US, the device layer is concentrated. Per Pixalate's quarterly CTV device market-share reports, **Roku led US CTV device share at roughly 37–38% in Q1–Q2 2025**, followed by Amazon Fire TV (~17–18%), Samsung Smart TV (~12%), Apple TV (~12–13%), and LG webOS (~5–7%) [4][5]. Pixalate noted Amazon Fire TV's US device share rose **~65% year-over-year** into 2025 [5]. On a separate \"open programmatic ad platform\" measure, Roku held roughly a **32% share** of CTV open-ad supply [6].\n\nThis concentration cuts two ways. The walled, login-required, content-owned platforms (Amazon, Roku's owned channels, the major broadcasters' apps) offer relatively clean, high-transparency inventory. The long tail — the explosion of free ad-supported streaming TV (**FAST**) channels and small apps — is where app-spoofing, server-side-ad-insertion (SSAI) fraud, and made-for-advertising (MFA) dynamics concentrate, and where verification vendors earn their keep (see §6).\n\n### 1.3 Why CTV is the most \"verified-but-opaque\" channel\n\nThe US market is mature enough that nearly all premium CTV impressions are *measured* by a verification vendor — DoubleVerify claims app-transparency coverage of **over 93% of CTV impressions** [7] — yet the channel stays structurally opaque relative to web. There is no URL. The buyer sees an app bundle ID and a device, not the specific program or scene. Content-level brand suitability (was my ad next to a violent scene, a partisan news segment, a tragedy livestream?) is therefore harder in CTV than on the web, and the US is where vendors race to close that gap — Comscore, for instance, ships a second-by-second content-level brand-safety product for livestreaming news [8]. The US is thus at once the most *measured* CTV market and the one where the hardest suitability problems — content-level, live, FAST tail — remain least solved.\n\n---\n\n## 2. The United States: The Privacy Patchwork\n\n### 2.1 No federal law — and 2025 was the year the map stopped growing (briefly)\n\nThe defining feature of US privacy law is its **absence at the federal level**. There is no comprehensive US federal consumer-privacy statute; a growing patchwork of state laws governs the field, alongside sector-specific federal rules (COPPA for children, HIPAA for health, etc.) and the FTC's general unfair/deceptive-practices authority. As of 2026, **roughly 20 US states have enacted comprehensive consumer-privacy laws** [9][10], beginning with California and now including Virginia, Colorado, Connecticut, Utah, Texas, Oregon, Montana, Delaware, Indiana, Iowa, Tennessee, and others [9]. Multiple trackers report that **2025 was the first year in five with no new comprehensive state privacy law enacted** [9] — a plateau, not a reversal, with previously passed laws still phasing into effect (Indiana's, for example, took effect **January 1, 2026** [9]).\n\nFor CTV brand safety, the patchwork bites on *targeting and measurement data*, not on suitability per se. The log-level, device-graph, and ACR (automatic content recognition) data that power CTV addressability are exactly the personal-information flows these state laws regulate, with opt-out rights for \"sale,\" \"sharing,\" and \"targeted advertising.\"\n\n### 2.2 California as the anchor: CCPA / CPRA\n\nCalifornia set the template. The **California Consumer Privacy Act (CCPA)**, signed June 28, 2018 and effective January 1, 2020, was the first comprehensive US state privacy law; the **California Privacy Rights Act (CPRA)**, a 2020 ballot-initiative amendment, strengthened it and created the **California Privacy Protection Agency (CPPA)** as a dedicated enforcer [9][10]. Its opt-out-of-sale/sharing model, \"sensitive personal information\" category, and treatment of cross-context behavioral advertising are the de facto floor that national CTV platforms build to, because building separately for 20 states is impractical. California binds only California residents — yet it sets the *effective* national standard for CTV data practices [9][10].\n\n### 2.3 The Virginia/Colorado branch and the \"opt-out preference signal\" model\n\nVirginia's **Consumer Data Protection Act (VCDPA)**, signed March 2, 2021 and effective January 1, 2023, was the second comprehensive state law and seeded a distinct \"Virginia model\" (controller/processor framing borrowed from GDPR vocabulary, opt-in for sensitive data, no private right of action) that most subsequent states followed [9][11]. Colorado's **Colorado Privacy Act (CPA)**, signed July 8, 2021 and effective July 1, 2023, added mandatory recognition of a **universal opt-out mechanism** (the Global Privacy Control signal) [9]. For CTV, these laws decide whether a household's smart-TV viewing and device data can be used for targeted advertising without consent, and whether browser/OS-level opt-out signals must be honored downstream in the bid stream.\n\n### 2.4 The interplay with brand safety\n\nUS privacy law and US brand safety are *adjacent but distinct* problems, and conflating them is a common error. Privacy law governs **whose data may be used to target an ad**; brand safety/suitability governs **what content an ad may appear next to**. They intersect mainly at the edges: (a) children's content, where COPPA both restricts data use *and* effectively forces content-level safeguards (see §3); and (b) the bid-stream data minimization that privacy law encourages, which can starve the very signals (precise content, device graph) that content-level vetting would want. A privacy-minimized bid request is a brand-safety blinder. This tension is underexplored in the trade literature and is flagged here as an open question (§9).\n\n---\n\n## 3. The United States: FTC Posture, COPPA, and Children's CTV\n\n### 3.1 The FTC as the de facto national privacy and ad-conduct regulator\n\nWith no federal privacy statute, the **FTC** is the closest thing the US has to a national data-and-advertising regulator, operating through Section 5 (unfair or deceptive acts or practices) and specific rules like COPPA. Under the Republican majority seated in 2025, the FTC's posture toward the ad industry shifted from a privacy-enforcement emphasis to an **antitrust-and-viewpoint emphasis** — the single most important development for CTV brand safety in this window, treated in full in §5.\n\n### 3.2 The amended COPPA Rule — the children's-CTV pivot\n\nThe **Children's Online Privacy Protection Act (COPPA)** and its implementing Rule are the one place where US federal law directly forces content-and-data discipline on CTV. The FTC finalized major **COPPA Rule amendments in January 2025**, published in the Federal Register **April 22, 2025**, with the amended Rule **effective June 23, 2025** and a **compliance deadline of April 22, 2026** [12][13][14].\n\nFor streaming aimed at or attracting children, the amendments land hard:\n\n- **Separate verifiable parental consent for third-party disclosure tied to targeted advertising.** Operators must now obtain *separate* opt-in consent before disclosing a child's personal information to third parties for targeted advertising — a direct constraint on the programmatic monetization of kids' CTV inventory [12][13][14].\n- **Expanded \"personal information\"** to include **biometric identifiers** (voiceprints, facial patterns, gait) and **government identifiers** [13][14] — relevant as smart-TV interfaces add voice and camera features.\n- **Data-retention limits**: operators may not retain children's data longer than necessary for the documented purpose, then must delete it [13][14].\n- **Safe Harbor transparency**: FTC-approved COPPA Safe Harbor programs must publicly disclose membership and report more to the FTC [12][13].\n\nFor CTV specifically, COPPA pushes children's-content apps and FAST kids' channels toward *contextual, non-personalized* advertising — the safest brand-safety posture by default. The legal risk of targeting forces a content-level model, not an audience-level one.\n\n*Going-concern note:* the **June 23, 2025 effective date and April 22, 2026 compliance deadline** are the operative dates as of this writing [12][13][14]; the Rule is in force.\n\n### 3.3 FTC enforcement cadence\n\nBeyond rulemaking, the FTC's children's-and-streaming enforcement has historically reached the largest platforms — the YouTube/Google COPPA settlement of 2019 is the canonical precedent for the \"kids' video = no behavioral ads\" rule of thumb. The 2025 amendments codify and extend that posture. Whether any *new* CTV-specific COPPA enforcement action has landed in 2025–2026 remains an open question; no named CTV-platform COPPA action surfaced within this window, and that absence is worth noting (§9).\n\n---\n\n## 4. The United States: The Post-GARM Standards Vacuum\n\n### 4.1 What GARM was and why it died\n\nThe **Global Alliance for Responsible Media (GARM)** was a cross-industry initiative housed at the **World Federation of Advertisers (WFA)**, launched in 2019, that produced the brand-safety vocabulary the entire programmatic ecosystem adopted: the **GARM Brand Safety Floor + Suitability Framework**, which mapped **11 content categories against four risk tiers (low/medium/high/floor)** [15][16]. The IAB Tech Lab's **Content Taxonomy 2.x** built on this framework (the 11 categories appear as \"Sensitive Topics\" children in Taxonomy 2.2), and the **MRC's** content-level brand-safety verification supplement incorporated it by reference [16]. GARM was, in effect, the shared dictionary that let advertisers, DSPs, SSPs, and verification vendors mean the same thing by \"high-risk content.\"\n\nOn **August 8–9, 2024**, the WFA **discontinued GARM**, days after **X (formerly Twitter) filed an antitrust lawsuit** alleging that the WFA, GARM, and member brands (CVS Health, Mars, Ørsted, Unilever) had colluded to suppress ad revenue to X [17][18]. The WFA cited \"recent allegations that … misconstrue its purpose\" and the resource drain of litigation; X's suit followed a **US House Judiciary Committee** report accusing GARM of wielding market power against disfavored platforms [17][18]. WFA leadership first said it meant to fight in court, then conceded it lacked the resources to do so [17].\n\n### 4.2 The vacuum and what (didn't) replace it\n\nGARM's discontinuation removed the *governance* layer but **not the artifacts**. The GARM Brand Safety Floor categories survive inside the **IAB Tech Lab Content Taxonomy** and the **MRC** verification standards, and verification vendors continue to ship \"GARM-aligned\" suitability segments [15][16]. No successor standards body had assumed GARM's convening role as of mid-2026 — a genuine vacuum. Claims that \"the industry standardized on GARM\" must now be read in the past tense, and any present-tense reference to a GARM successor would be unsupported.\n\nThe practical effect is **fragmentation**. Brand-safety definitions have devolved to three places: the surviving taxonomy artifacts, each verification vendor's proprietary category set (DoubleVerify cites **100+ brand-suitability categories** [7]), and each advertiser's bespoke exclusion lists. The IAB Tech Lab remains the most active standards actor — its **CTV Programmatic Guide** and a **new CTV Ad Portfolio standardizing six ad formats** (Pause, Menu, Screensaver, In-Scene, Squeezeback, Overlay) opened for public comment **through January 31, 2026** [19][20] — but those govern *format and plumbing*, not the *suitability-governance* function GARM performed.\n\n---\n\n## 5. The United States: The Political Overlay (Post-GARM, Free-Speech Politics)\n\nThis is the dimension that makes the US sui generis. In 2025–2026, brand safety stopped being purely a media-quality discipline and became an **antitrust and First Amendment fight** — with the federal government taking the position that coordinated brand-safety standards can amount to an unlawful, politically motivated boycott.\n\n### 5.1 The Omnicom–IPG merger condition (June–September 2025)\n\nWhen **Omnicom moved to acquire IPG (Interpublic) for ~$13.5 billion**, the FTC used merger review as leverage. It announced a **proposed consent order on June 23, 2025** and **finalized it in September 2025** [21][22]. The order **bars Omnicom from steering ad dollars away from publishers based on their political or ideological viewpoint**, except at the express, individualized direction of an advertiser client [21][22]. The FTC's Bureau of Competition framed coordinated viewpoint-based ad-suppression as a threat \"not only [to] competition between ad agencies, but also [to] public discussion and debate\" [21]. It was the first US merger remedy to target *brand-safety conduct* as an antitrust harm.\n\n### 5.2 The Media Matters / NewsGuard investigative-demand fight (2025–2026)\n\nIn parallel, the FTC issued **civil investigative demands (CIDs)** — subpoena-like orders — in a broad probe of \"potentially unlawful advertiser boycotts,\" reportedly **17 outstanding CIDs** spanning ad trade associations, brand-safety/suitability rating organizations, and advocacy groups including **Media Matters** and **NewsGuard** [23]. Media Matters **sued to block its CID in June 2025**, and a federal district judge (Judge Sparkle Sooknanan) found Media Matters **likely to show the probe violated the First Amendment**; the FTC appealed [23]. By **April 2026, the FTC withdrew the document demands** to Media Matters, NewsGuard, and others, after settling related antitrust claims against the major advertisers [23]. The episode is the clearest evidence for the \"chilling effect\" critique — that aggressive antitrust scrutiny of brand-safety coordination deters advertisers from avoiding content at all.\n\n### 5.3 The WPP/Publicis/Dentsu settlements (April 2026)\n\nThe capstone came in **April 2026, when the FTC (with a coalition of states) announced settlements** with **WPP, Publicis, and Dentsu** to resolve allegations that the agencies, beginning around 2018 and working through trade associations, **unlawfully coordinated a common \"Brand Safety Floor\"** to target \"misinformation,\" rendering flagged sites (the FTC named **X** and **Breitbart** as flashpoints) categorically ad-ineligible [24][25]. Under the proposed orders, the agencies commit **not to direct clients' ad budgets away from media based on political content**, and not to enter agreements setting common brand-safety standards keyed to such criteria, absent individualized client direction [24][25].\n\n### 5.4 What this means for the brand-safety discipline\n\nThe cumulative US legal posture as of mid-2026 is that **coordinated, industry-wide brand-safety standards that have the effect of defunding politically disfavored media are antitrust-suspect**. This does *not* outlaw brand safety — an individual advertiser may still set its own exclusions at its \"express and individualized direction\" [21][24] — but it dismantles the *collective* standard-setting that GARM embodied and that gave the discipline its shared vocabulary. The legal overlay thus reinforces the §4 fragmentation from the opposite direction: GARM died by lawsuit, and the FTC now penalizes any attempt to rebuild it. Critics across the spectrum read this differently. Proponents (and the FTC majority) frame it as restoring competition and free speech in \"the modern public square\"; opponents (commentary in *Reason*, say, and groups like Public Knowledge) warn the orders themselves risk **chilling protected, politically motivated boycott conduct** and **forcing advertisers to fund content they reasonably wish to avoid** [23][26]. Both framings are best read as positions, not as settled fact.\n\n---\n\n## 6. The United States: The Dominant Vendors and the Mechanics of CTV Brand Safety\n\n### 6.1 The verification triumvirate\n\nThree measurement/verification vendors deliver most US CTV brand safety, each having migrated its web/social products into CTV:\n\n- **DoubleVerify (NYSE: DV)** — as of its most recent confirmable filings, a **publicly traded** company; 2024 revenue grew ~15% to **$656.8 million**, with management attributing growth to **CTV measurement (up ~95% YoY)**, social, and programmatic activation; Q1 2025 revenue grew ~17% to **$165.1 million** [27][28]. DV offers CTV fraud/IVT protection, **100+ brand-suitability categories**, and claims **>93% CTV app-transparency coverage** [7][27]. DV expanded via acquisitions — **Scibids (AI activation)** earlier and **Rockerbox (attribution), closed March 13, 2025 for $82.6M** [27]. *Going-concern:* DV was NYSE-listed (DV) as of these 2025 filings; confirm no subsequent take-private before asserting present-tense public status.\n- **Integral Ad Science (IAS)** — **taken private by Novacap** (a North American PE firm) in an all-cash deal valuing IAS at **~$1.9 billion ($10.30/share)**, **completed December 23, 2025**; IAS common stock is **no longer listed on any public market** and continues under the IAS brand [29][30]. IAS validates CTV completion rates and freedom from IVT and ships pre-bid contextual/suitability segments [31]. *Going-concern:* IAS is private as of 2025-12-23, no longer the publicly traded company (Nasdaq: IAS) it was before the Novacap deal [29][30].\n- **Comscore** — provides CTV content-level contextual targeting and brand safety, including **second-by-second brand safety for livestreaming news content** [8], targeting the hardest CTV suitability problem (live, content-level).\n\nAdjacent players include **Pixalate** (CTV fraud analytics and device market-share measurement) [4][5], **HUMAN Security** (bot/fraud defense; surfaced in pre-bid suitability stacks) [32], **Peer39** (pre-bid contextual CTV) [33], and **Zefr** (GARM-aligned suitability, originally social-first) [17]. DSPs (The Trade Desk, Amazon DSP, and others) and the IAB Tech Lab/MRC standards bind these into the bid stream.\n\n### 6.2 The CTV fraud surface that brand safety must defend\n\nUS brand-safety practice is inseparable from CTV's distinctive fraud surface, because in CTV the same vendors handle both invalid traffic (IVT) and suitability.\n\n- **SSAI fraud.** Server-side ad insertion — the technique that stitches ads into streams server-side — is both legitimate and the leading CTV fraud vector. Pixalate reported **IVT on CTV was ~140% higher when SSAI was present**, and that **~26% of SSAI used for OTT/CTV programmatic was invalid** [34][35]. DoubleVerify documented **\"SneakyTerra,\"** an SSAI scheme spoofing **>2 million devices/day** at peak, potentially costing unprotected advertisers **>$5M/month** at a ~$20 CTV CPM [36]. The earlier **VASTFLUX** operation stacked up to **25 video ads per slot** and spoofed **~1,700 apps** [34].\n- **App spoofing and the FAST tail.** A **CleanTap October 2025 study** showed cheap counterfeit setups (Raspberry Pi + emulators) received premium CTV ads from **54 brands (nine Fortune 100)** across five SSPs and four DSPs, with **100% of counterfeit activity accepted into live auctions** [34] — a stark demonstration that device/app verification, not page context, is the core CTV defense.\n- **Baseline IVT.** Q2 2025 global programmatic IVT ran **~18% on CTV** (vs. ~19% web, ~29% mobile app) — CTV is *not* immune despite \"premium big-screen\" assumptions [34].\n\nThe point for brand safety: in CTV, the **first-order risk is not \"next to bad content\" but \"not real inventory at all.\"** US verification spend therefore leads with fraud/IVT, then layers content-level suitability on top. That ordering sets CTV apart from web and social brand safety, where context risk dominates.\n\n---\n\n## 7. Canada: Market Scale and the Same Stack, Smaller\n\n### 7.1 Market size relative to the US\n\nCanada is a structurally mature but far smaller CTV market. Estimates for Canadian CTV ad spend in the 2025–2026 window range from **~US$1.29 billion in 2026 (eMarketer, +16% YoY)** to **~US$2.5 billion in 2025** in other syntheses [37][38] — the spread reflecting differing definitions (CTV display vs. all streaming video, CAD vs. USD). On the conservative eMarketer figure, Canada's CTV market runs **3–4%** the size of the US market; even on the higher figure it stays well under **10%**. The safest summary is \"Canada CTV ≈ US$1.3–2.5B (2025–26), an order of magnitude smaller than the US,\" with the range reflecting genuine divergence between sources [37][38].\n\nCord-cutting and streaming penetration are advanced. Smart-TV penetration among Canadian internet users **exceeds 50%**, CTV's share of total TV time is projected to reach **~38% by 2026** (from 21.7% in 2019), and CRTC data show household spending shifting from broadcast distribution (BDU) — down from **$36.2/mo (2021) to $28.6/mo (2024)** — to online undertakings, up from **$25.7 to $34.7/mo** over the same period; Canadian pay-TV penetration fell **below 50% by 2023** [38][39]. Ad-supported tiers (Tubi, Pluto TV, the platform AVOD tiers) drive the same FAST-tail dynamics as the US, at smaller scale [38].\n\n### 7.2 The platform layer differs at the margin\n\nCanada's device mix is *not* a copy of the US. Pixalate's **Q1 2025** report found **Apple TV led Canadian CTV device share at ~25%** [4][5] — a contrast with Roku's US dominance — reflecting Canada's higher iOS/Apple-ecosystem penetration. Roku and Amazon Fire TV remain major, but the leadership ordering differs, and that shapes where Canadian buyers concentrate their app-level allow/block lists.\n\n### 7.3 How Canadian buyers source brand-safe CTV\n\nThe key fact: **Canadian buyers source brand safety through the same US-built infrastructure.** The verification triumvirate (DoubleVerify, IAS, Comscore) operates in Canada; the standards Canadian buyers rely on are the **IAB Tech Lab's** global CTV Programmatic Guide and CTV Ad Portfolio, with **IAB Canada** (President **Sonia Carreno**, per IAB Canada's December 2025 statement) explicitly endorsing the global standards as the basis for the Canadian market to \"scale responsibly\" [19][20]. There is no distinct Canadian brand-safety taxonomy. Canada is a *standards-taker*, importing the GARM-derived/IAB Tech Lab vocabulary wholesale. That leaves Canadian brand-safety practice tightly bound to US and global decisions — including the post-GARM fragmentation — while the *political* weaponization of brand safety has **no Canadian counterpart** (there is no Canadian equivalent of the FTC boycott probe).\n\n---\n\n## 8. Canada: The Regulatory Overlay (Privacy + Streaming Content)\n\nWhere Canada diverges most from the US is regulation. Two distinct regimes bear on CTV: **privacy law** (federal PIPEDA modernization plus Quebec Law 25) and **streaming/content regulation** (the Online Streaming Act and the CRTC).\n\n### 8.1 PIPEDA and its long-delayed modernization\n\nCanada's federal private-sector privacy law is the **Personal Information Protection and Electronic Documents Act (PIPEDA)**, enacted 2000, consent-based and principles-based, enforced by the **Office of the Privacy Commissioner of Canada (OPC)**. PIPEDA governs the targeting/measurement data underlying CTV addressability much as US state laws do, but it is widely viewed as outdated for the programmatic era.\n\nModernization has been tortured. **Bill C-27** (the Digital Charter Implementation Act) bundled three pieces — the **Consumer Privacy Protection Act (CPPA)** to replace PIPEDA's Part 1, a **data-protection Tribunal**, and the **Artificial Intelligence and Data Act (AIDA)**. C-27 **died on the Order Paper when Parliament was prorogued on January 6, 2025**, and a federal election followed (called March 23, 2025; held April 28, 2025) [40][41]. The government signaled that C-27 would **not return in its old form** and that **AIDA was off the table as drafted** [40].\n\nThe replacement arrived in 2026.\n\n**Bill C-36, the Protecting Privacy and Consumer Data Act, was tabled June 15, 2026** by the Minister of Artificial Intelligence and Digital Innovation (**Evan Solomon**) [42]. Per the first legal analyses, C-36:\n\n- **Amends PIPEDA into the \"Electronic Documents Act,\"** repealing **Part 1** of PIPEDA and stripping out its privacy provisions, which move into the new statute [42];\n- Creates a new **Digital Safety and Data Protection Commission** [42];\n- **Recognizes privacy as a constitutionally protected right** [42];\n- Imposes penalties **up to $10 million or 3% of global revenue** [42];\n- Adds **deletion rights, automated-decision-making transparency, and data mobility** [42];\n- **Deliberately omits AI legislation** — AIDA is decoupled and not in C-36 [42].\n\n*Going-concern note:* As of **2026-06-17**, **C-36 is newly tabled, not enacted** — it is a *bill*, days old, and its passage is uncertain given C-27's fate. Any assertion that \"Canada has modernized PIPEDA\" is **premature**; the correct present-tense status is \"PIPEDA remains in force; C-36 was tabled June 15, 2026 and is before Parliament\" [42]. This is exactly the kind of present-tense status that goes stale fast.\n\n### 8.2 Quebec Law 25 — North America's strictest regime\n\nQuebec is the exception that proves Canada's fragmentation. **Law 25** (formerly **Bill 64**, \"An Act to modernize legislative provisions as regards the protection of personal information\"), **adopted September 21, 2021**, is widely described as the **most stringent privacy regime in North America**, exceeding both PIPEDA and most US state laws [43][44]. The **Commission d'accès à l'information (CAI)** enforces it, and it entered force in phases, with **all phases in effect as of September 22, 2024** [43][44].\n\nLaw 25's CTV-relevant features:\n\n- **Consent and transparency** stricter than PIPEDA, with **privacy-by-default** and explicit rules on **automated decision-making** disclosure [43][44];\n- **Mandatory privacy-impact assessments (PIAs)** and **72-hour breach notification** [43][44];\n- A **two-tier penalty regime** — **administrative monetary penalties up to CAD $10 million or 2% of global turnover**, and **penal fines up to CAD $25 million or 4% of global turnover** [43][44].\n\nFor CTV brand safety, Law 25 mainly bites on the *data* side — consent for the device/viewing data that drives targeting and measurement, and ADM transparency for algorithmic ad decisioning. A national CTV platform must build to Law 25 for Quebec residents much as it builds to CCPA for Californians. And Law 25's penalty ceilings are, on paper, **steeper than CCPA's per-violation fines** — making Quebec a compliance anchor far heavier than its market size.\n\n### 8.3 The Online Streaming Act (Bill C-11) and CRTC content regulation\n\nThe regulation with no US analogue is the **Online Streaming Act (Bill C-11)**, which **received royal assent April 27, 2023**, amending the Broadcasting Act to bring online streaming services under **CRTC** jurisdiction [45][46]. At its core is a **financial contribution** requirement on foreign streamers:\n\n- In **June 2024**, the CRTC required foreign streaming services unaffiliated with a Canadian broadcaster and earning **>CA$25 million annually** to contribute **5% of Canadian revenue** to funds supporting Canadian content [45][46].\n- In **May 2026**, the CRTC **raised the expenditure requirement to 15%** as part of a wider overhaul of Canadian Programming Expenditure (CPE) mandates (incorporating the existing 5% base) [45][46], a change the regulator says will **\"stabilize\" Canadian-content funding near CA$2 billion/year** [46].\n- In **November 2025**, the CRTC also **updated the definition of \"Canadian content\"** for audio-visual broadcasting [45][47].\n\nThe brand-safety *content* implication is indirect but real. C-11 reshapes **what content streaming platforms must carry, fund, and (via discoverability provisions) surface** to Canadian audiences. As Canadian-content quotas and discoverability rules push more Cancon — news, documentary, and potentially politically sensitive Canadian programming — into the streams that programmatic CTV monetizes, the **suitability surface a Canadian buyer must vet shifts**. C-11 is itself politically contested on free-expression grounds; critics argue the discoverability provisions amount to content manipulation. That gives Canada a *milder* version of the content-politics friction the US experiences — through a content-regulation lens, not a brand-safety-boycott one.\n\n*Going-concern note:* the **15% contribution (May 2026)** and **Cancon-definition update (November 2025)** are the operative current states [45][46][47]; the 5% figure is now historical. A US-based industry team is liable to cite the stale 5% figure, so it is worth double-checking.\n\n### 8.4 The contrast, sharpened\n\nThe US and Canada arrive at CTV brand safety from opposite regulatory directions:\n\n| Dimension | United States | Canada |\n|---|---|---|\n| Federal privacy law | **None** (FTC Section 5 + ~20 state laws) | **PIPEDA** (in force); **C-36** tabled 2026-06-15 (not yet law) |\n| Strictest sub-national regime | California (CCPA/CPRA, CPPA agency) | **Quebec Law 25** (CAI; up to CAD $25M / 4% penal) |\n| Brand-safety politics | **Acute** — FTC antitrust probes, Omnicom-IPG condition, WPP/Publicis/Dentsu settlements | **Absent** — no boycott probe; politics enters via C-11 content regulation |\n| Standards posture | Standards-*maker* (IAB Tech Lab, MRC, ex-GARM) | Standards-*taker* (imports IAB Tech Lab global standards) |\n| Streaming content regulation | None (First Amendment forecloses it) | **C-11**: 15% Cancon contribution (May 2026), discoverability |\n| Market size (CTV ad, 2025–26) | ~**$33–38B** | ~**US$1.3–2.5B** |\n| Children's content | **Amended COPPA** (eff. 2025-06-23) | PIPEDA/Law 25 general consent; no COPPA analogue |\n\nThe irony lands sharp: **the US, with no comprehensive privacy law, regulates brand safety hardest through antitrust; Canada, with strong privacy law, barely touches brand-safety conduct but regulates the content pipeline directly.** A multinational advertiser running CTV across both must reconcile three pressures at once — a US regime *suspicious of coordinated content-avoidance*, a Canadian and Quebec regime *strict on data consent*, and a Canadian content regime that *shapes the inventory itself*.\n\n---\n\n## 9. Open Questions\n\n1. **Does privacy-driven bid-stream minimization degrade content-level suitability?** US state laws and Quebec Law 25 push toward data minimization in the bid request; content-level CTV suitability wants *more* signal (precise program, scene, device graph). Is there measurable tension, and how are vendors resolving it? Not resolved in the trade literature consulted.\n2. **Is there any GARM successor forming?** As of mid-2026 no body has reassumed GARM's convening role, and the FTC posture actively discourages collective standard-setting. Does brand-safety governance reconstitute somewhere (IAB? MRC? a vendor consortium?), or does it stay permanently fragmented to per-advertiser exclusion lists?\n3. **Will C-36 actually pass, and in what form?** C-27 died twice over (committee + prorogation). C-36 is days old as of this writing. Its enactment timeline, final penalty structure, and treatment of adtech are all unknown.\n4. **Has any CTV-specific COPPA enforcement landed post-amendment?** No named CTV-platform COPPA action surfaced in the 2025–2026 window; the April 22, 2026 compliance deadline may yet generate one.\n5. **What is Canada's *actual* CTV figure, and on what definition?** The US$1.3B vs. US$2.5B spread is a definitional and currency artifact that would need reconciling against a single eMarketer Canada vintage.\n6. **How exactly do the FTC settlements interact with individual-advertiser exclusions?** The orders preserve \"express and individualized\" client direction. Where is the line between a permitted individual exclusion list and a prohibited \"coordinated standard,\" in operational terms a buyer can act on?\n7. **Does C-11's discoverability/Cancon push measurably change the Canadian CTV suitability surface?** The mechanism is plausible (more Cancon news/documentary in monetized streams) but unquantified here.\n8. **DoubleVerify's current ownership status.** Confirmed NYSE-listed through 2025 filings; given the IAS take-private and sector consolidation, DV's status is worth re-confirming before any present-tense \"publicly traded\" assertion.\n\n---\n\n## Sources\n\n1. eMarketer / Insider Intelligence forecasts as reported — \"How Big Will CTV Advertising Be in 2026?\" Adwave, 2026 (synthesizing eMarketer: ~$33.35B 2025, ~$38B 2026, upfront crossover). https://adwave.com/resources/ctv-advertising-forecast-2026 — *Tier 5 (trade synthesis of Tier 3-4 forecaster data); CTV market-size figures. Accessed 2026-06-17.*\n2. eMarketer, \"Digital Video Forecast and Trends Q2 2026\" / \"US Ad Spending 2026.\" https://www.emarketer.com/content/digital-video-forecast-trends-q2-2026 ; https://www.emarketer.com/content/us-ad-spending-2026 — *Tier 5 (specialized forecaster, disclosed methodology). Core US CTV figures. Accessed 2026-06-17.*\n3. MNTN Research, \"CTV Ad Spend Will Grow to $46.89 Billion by 2028.\" https://research.mountain.com/trends/ctv-ad-spend-will-grow-to-46-89-billion-by-2028/ — *Tier 5 (vendor-affiliated research). Long-range trajectory. Accessed 2026-06-17.*\n4. Pixalate, \"Q1 202 https://doubleverify.com/sophisticated-ssai-scheme-hijacks-real-ctv-device-sessions/ — *Tier 1-5 (vendor threat research). Accessed 2026-06-17.*\n37. eMarketer, \"Canada CTV and Digital Video 2025\" (Canada CTV ~US$1.29B 2026, +16%). https://www.emarketer.com/content/canada-ctv-and-digital-video-2025 — *Tier 5 (forecaster). Canada market size. Accessed 2026-06-17.*\n38. We Are Other, \"2025 Canadian Media Trends\"; Adwave / StackAdapt syntheses (Canada CTV ~US$2.5B 2025; smart-TV >50%; CTV ~38% of TV time by 2026). https://www.weareother.ca/insights/2025-canadian-media-trends-what-marketers-need-to-know — *Tier 5 (trade synthesis). Canada penetration. Accessed 2026-06-17.*\n39. CRTC, \"Annual highlights of the broadcasting sector 2023-2024\" (BDU spend $36.2→$28.6/mo; online $25.7→$34.7/mo); nScreenMedia (pay-TV <50% by 2023). https://crtc.gc.ca/eng/publications/reports/policymonitoring/2025/rad.htm — *Tier 1-2 (regulator data). Cord-cutting. Accessed 2026-06-17.*\n40. Fasken, \"Prorogation's Digital Impact: Canada's Digital Bills Set to Die on the Order Paper\" (C-27 died at prorogation 2025-01-06); Gowling WLG, \"Federal privacy reform: Where we left off and what's next.\" https://www.fasken.com/en/knowledge/2025/01/prorogations-digital-impact ; https://gowlingwlg.com/en/insights-resources/articles/2025/federal-privacy-reform — *Tier 5 (law-firm analysis of Tier 1 legislative record). C-27 status. Accessed 2026-06-17.*\n41. Parliament of Canada, LEGISinfo, Bill C-27 (44-1). https://www.parl.ca/legisinfo/en/bill/44-1/c-27 — *Tier 1 (primary legislative record). Accessed 2026-06-17.*\n42. Gowling WLG, \"Ottawa tables long-awaited federal privacy reform legislation\" (Bill C-36, Protecting Privacy and Consumer Data Act, tabled 2026-06-15; repeals PIPEDA Part 1 into \"Electronic Documents Act\"; Digital Safety and Data Protection Commission; penalties up to $10M/3%; no AIDA). https://gowlingwlg.com/en-ca/insights-resources/articles/2026/ottawa-tables-long-awaited-fede
