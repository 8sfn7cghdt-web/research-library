5 (trade). IAS June 2021 IPO and CTV strategy (Publica). https://www.adexchanger.com/platforms/ias-goes-public-in-bid-to-retain-competitive-edge/ (accessed 2026-06-17).\n18. SEC EDGAR, DoubleVerify Holdings Inc. Form 8-K, FY2021 (primary filing). Tier 1. DV April 2021 IPO / public-company status. https://www.sec.gov/Archives/edgar/data/0001819928/000110465921071929/tm2117538d1_ex99-1.htm (accessed 2026-06-17).\n19. Peer39, \"Transition from Oracle's Grapeshot and Moat with Peer39,\" peer39.com. Tier 6 (vendor marketing — used ONLY as evidence that Oracle Moat/Grapeshot exited and customers needed migration, not as proof of Peer39 superiority). https://www.peer39.com/transition-from-oracle-grapeshot-and-moat-with-peer39 (accessed 2026-06-17).\n20. StratPulse CTV Hub, \"CTV measurement vendors in India: IAS, DoubleVerify, Nielsen, Kantar,\" ctv.stratpulsetechlabs.com. Tier 5 (specialized trade). DV/IAS as the two verification vendors with CTV coverage incl. India. https://ctv.stratpulsetechlabs.com/kb/measurement/attribution-models/ctv-measurement-vendors-india.html (accessed 2026-06-17).\n21. IAB Tech Lab, \"Authorized Sellers for Apps (app-ads.txt) v1.0,\" 2019-03 (primary spec). Tier 1. app-ads.txt final 2019-03-13; covers mobile and CTV app stores. https://iabtechlab.com/wp-content/uploads/2019/03/app-ads.txt-v1.0-final-.pdf (accessed 2026-06-17).\n22. MarTech, \"IAB Tech Lab releases final version of app-ads.txt to fight mobile app fraud,\" martech.org. Tier 5 (trade). Corroborates ads.txt (June 2017) and app-ads.txt (March 13, 2019) dates. https://martech.org/iab-lab-tech-releases-final-version-of-app-ads-txt-to-fight-mobile-app-fraud/ (accessed 2026-06-17).\n23. IAB Tech Lab, \"GARM Brand Suitability: Developing a Collaborative Interpretation of the Standard,\" iabtechlab.com. Tier 1/5 (standards body). Taxonomy mapping to GARM; human-labeled benchmark datasets. https://iabtechlab.com/garm-brand-suitability-developing-a-collaborative-interpretation-of-the-standard/ (accessed 2026-06-17).\n24. WFA (primary founding release), founding-member list including 17 named advertisers — see [9]. Tier 1. Used specifically for the 17-vs-16 founder count and the absence of a Christchurch reference. (Same URL as [9].)\n25. Brand Safety Institute, \"Frameworks — Brand Safety Resource Library,\" brandsafetyinstitute.com. Tier 5 (industry org). Continued circulation/use of GARM-derived frameworks post-2024. https://www.brandsafetyinstitute.com/resources/frameworks (accessed 2026-06-17).\n26. StreamTV Insider, \"FAST channel growth explodes, but for how long?,\" streamtvinsider.com. Tier 5 (specialized trade). FAST 2018–2020 growth; Pluto/Tubi/Roku usage trajectories. https://www.streamtvinsider.com/video/fast-channel-growth-explodes-how-long (accessed 2026-06-17).\n27. Media Play News / Parks Associates, \"Tubi, The Roku Channel and Pluto TV are Top Three U.S. FAST Services,\" mediaplaynews.com. Tier 5 (trade citing research firm). FAST leaders and reach. https://www.mediaplaynews.com/parks-associates-tubi-the-roku-channel-and-pluto-tv-are-top-three-us-fast-services/ (accessed 2026-06-17).\n28. Pixalate (citing Ad Age), \"Programmatic CTV advertising for brands: SSAI tips,\" pixalate.com; and DoubleVerify SSAI fraud research. Tier 5–6 (vendor research — single-vendor for the 140% figure, flagged). SSAI measurement opacity, elevated IVT (~140% higher Q1 2024), app-ads.txt adoption gap. https://www.pixalate.com/blog/programmatic-ctv-advertising-for-brands-ssai-tips (accessed 2026-06-17).\n29. ANA, \"Programmatic Media Supply Chain Transparency Study\" (Dec 2023; primary research report). Tier 2/5 (industry research). MFA ~21% impressions / ~15% spend / ≈$10.1B; 31% advertiser log-level-data access. https://www.ana.net/miccontent/show/id/rr-2023-12-ana-programmatic-media-supply-chain-transparency-study (accessed 2026-06-17).\n30. Marketing Dive, \"ANA: 15% of programmatic ad spend is wasted on click-bait websites,\" marketingdive.com (2023). Tier 4 (trade-major). Corroborates ANA MFA spend findings. https://www.marketingdive.com/news/ana-programmatic-transparency-ad-spend-report/653362/ (accessed 2026-06-17).\n31. AdExchanger, \"Can Contextual Targeting Replace Third-Party Cookies?,\" adexchanger.com; and Peer39 cookie-deprecation explainers. Tier 5 (trade). Safari ITP (2017), Google's 2019 cookie phase-out announcement, contextual's identity-free rationale. https://www.adexchanger.com/online-advertising/can-contextual-targeting-replace-third-party-cookies/ (accessed 2026-06-17).\n\n---\n\n*This history draws on sources spanning 2014–2026, with an acknowledged concentration in U.S. and Anglophone reporting; the non-Anglophone regional grounding comes in the regional chapters that follow. Vendor-marketing sources ([19], [28]) are used only as evidence of what a company claims, or as flagged single-vendor data, never as independent proof of a contested fact.*"}, {"order": 2, "file": "02_Technical_And_Measurement_Landscape.md", "title": "The Technical and Measurement Landscape of Brand Safety in Programmatic CTV", "summary": "", "body": "# The Technical and Measurement Landscape of Brand Safety in Programmatic CTV\n\n## Bottom Line\n\nWeb brand safety rested on one fact every impression carried: a page URL. From that single string you could derive the domain, crawl the surrounding text, classify the content, run a verification script in the browser, and decide — before or after the bid — whether your ad belonged there. **Connected TV demolishes every one of those assumptions.** There is no URL. The strongest identifier a CTV impression reliably carries is an app bundle ID — like knowing your ad ran \"somewhere on YouTube\" without knowing the video. Content-level signals (the specific program, episode, genre, and rating) arrive inconsistently, often not at all: a 2024 Gracenote analysis put the average bid request at roughly **0.73 biddable metadata categories per program**, far short of what suitability decisions require. CTV devices generally cannot run the JavaScript that powers web verification, so the industry leans on pre-bid filtering, server-side beaconing, and probabilistic device-level analysis instead of the in-page measurement tags it trusted on the web. Server-side ad insertion (SSAI) — the dominant ad-delivery method on premium streaming — solves real engineering problems (no buffering, ad-blocker resistance, smooth ad pods), but it severs the client-side data trail and has repeatedly been weaponized into the largest fraud schemes the channel has seen, from StreamScam and ParrotTerra to SneakyTerra. Invalid-traffic rates in open-programmatic CTV run far above web norms: Pixalate measured 18% globally in Q1 2025, up from 12% a year earlier, with regional peaks of 36% in APAC and device-level rates as high as 36% on some Samsung inventory. The supply-chain transparency stack (app-ads.txt, sellers.json, the SupplyChain Object) and emerging device-attestation cryptography (OM SDK 1.6, November 2025) are the industry's structural answers, but they remain partial. What follows maps, mechanism by mechanism, how CTV brand safety and fraud defense actually function — and where they break.\n\n---\n\n## 1. What a CTV impression carries — and what a web impression carries\n\nLay a CTV bid request next to a web bid request and ask one question: *what does the buyer actually know about where this ad will run?*\n\n### 1.1 The web baseline: the page URL is everything\n\nOn the open web, a programmatic display or video impression travels as an OpenRTB bid request with a populated `site` object. The load-bearing field is `site.page` — the full URL of the page the ad will render on — supported by `site.domain`, `site.cat` (IAB content categories), and often `site.content` and `site.keywords`. From the URL alone, a brand-safety vendor can do what no CTV equivalent allows: **independently fetch and read the actual page.** Pre-bid contextual vendors (Peer39, IAS, DoubleVerify, Oracle's now-divested contextual unit, Zefr) crawl the URL, run natural-language and image classification on the real content, and return a verdict — \"this article is about a plane crash, flag it for an airline\" — that owes nothing to the publisher's honesty about its own inventory. The page is the ground truth, and it is checkable.\n\nThat checkability is the single most important thing CTV loses.\n\n### 1.2 The CTV bid request: app, not page\n\nA CTV impression is delivered through an **app**, so its OpenRTB bid request populates the `app` object rather than `site`. FreeWheel's programmatic-metadata guidance is explicit that for inventory whose declared device type is CTV, an `app` object is generated (set-top-box inventory may still use a `site` object) [1]. The fields that matter:\n\n- **`app.bundle`** — the store-assigned app identifier, the closest CTV analogue to a domain. IAB Tech Lab's *OTT/CTV Store Assigned App Identification Guidelines* (2020) stress that buyers need a standardized way to identify the app they are buying for \"targeting, blacklisting, brand safety and fraud prevention,\" exactly as domains serve on the web — and warn that non-unique identifiers (such as the raw iOS/tvOS bundle id) must **not** be used as the unique identifier; the store-assigned ID is the correct value [2].\n- **`app.name`, `app.domain`, `app.cat`** — human-readable name, publisher domain (used to locate the app-ads.txt file), and coarse content categories.\n- **`app.publisher` / `app.storeurl`** — publisher identity and the app-store listing.\n- **`device`** object — make, model, OS, IP, and (where present) the device advertising ID (RIDA/IFA), used heavily in fraud analysis.\n- **`content` object** — the deep field where program/episode/genre/rating *can* live (see §2), but frequently does not.\n\nThe structural point: **the app bundle ID tells you the container, not the contents.** Knowing an ad ran in \"Pluto TV\" or \"The Roku Channel\" or \"Tubi\" is like knowing a web ad ran \"somewhere on a 10,000-page news site\" — it bounds the risk loosely but never says whether the ad sat beside a children's cartoon, a true-crime documentary, or a politically charged news segment. On the web you would just read the page. On CTV, the supply chain has to *volunteer* that same information in the content object — and it rarely arrives complete.\n\n### 1.3 VAST, OpenRTB, and OMID: the three specs that frame a CTV impression\n\nThree IAB Tech Lab specifications together define the technical envelope of a CTV ad:\n\n- **OpenRTB** governs the *bid request/response* — the auction-time metadata (the `app`, `device`, `content`, and `source`/SupplyChain objects). This is where pre-bid brand-safety and fraud decisions are made.\n- **VAST (Video Ad Serving Template)** governs the *ad response itself* — how the creative, tracking pixels, and verification resources are packaged and delivered to the player. VAST 4.x is the relevant generation for CTV. VAST 4.1 (Nov 2018) cleanly separated the `<MediaFile>` (the actual video/audio asset) from interactive logic (`<InteractiveCreativeFile>`), and formalized the `<AdVerifications>` node that signals which third-party measurement scripts the player should execute [3][4]. VAST 4.2 (June 2019) and VAST 4.3 (Dec 2022) extended support for server-side ad-stitching workflows — tracking, viewability, and verification in SSAI environments specifically [4][5].\n- **OMID (Open Measurement Interface Definition)** is the measurement-SDK standard that VAST's `<AdVerifications>` node points to. On platforms that support an Open Measurement SDK, OMID is how a verification vendor's code gets a viewability/verification signal off the device. **The catch:** many CTV environments — particularly SSAI-stitched streams and lower-end devices — cannot or do not run OMID, so the verification node degrades or is ignored. The IAB notes that when components of the chain differ in capability, \"the workflow defaults to the lowest common denominator,\" sometimes falling all the way back to VAST 3 semantics that predate modern verification entirely [6].\n\nEven at the spec level, then, the web's reliable \"fetch the page, run a script in the browser\" loop has no clean CTV equivalent. The metadata is volunteered (OpenRTB content object), the verification hook is optional and often unsupported (VAST `<AdVerifications>` + OMID), and the delivery method frequently cuts the client-side trail (SSAI, §5).\n\n---\n\n## 2. App-level vs. content-level transparency — the hard gap\n\nIf there is one sentence that captures the central technical failure of CTV brand safety, it is this: **the industry can usually tell you the app, but rarely the content — and brand suitability lives at the content level.**\n\n### 2.1 Where content-level metadata is supposed to live\n\nOpenRTB defines a `content` object (nested under `app`) precisely to carry the program-level descriptors web buyers never needed because they could read the page: `content.title` (program/episode name), `content.series`, `content.season`, `content.episode`, `content.genre`/`content.cat`, `content.contentrating` (e.g., TV-MA), `content.language`, `content.livestream`, and `content.len`. FreeWheel's metadata guide frames the distinction exactly: buyer understanding \"often stops at the URL or app level,\" whereas content metadata \"goes one level deeper, describing the actual video rather than its more generic environment,\" and is meant to flow through the standard content-object parameters [1].\n\n### 2.2 Why it is the hard gap: the metadata is usually incomplete\n\nThe fields exist; publishers and SSPs simply populate them sparsely, inconsistently, or not at all. A 2024 Gracenote analysis of more than **6.8 billion publisher-supplied bid requests** found that almost no program carried complete information across metadata categories — an average of just **0.73 biddable categories per program** — even though more than half of CTV content has two or more genres and nearly 20% has three to four [7]. Gracenote calls the result the **\"CTV data gap\": the loss of content-level intelligence between the viewer experience and the advertising transaction**, where advertisers receive impressions \"tagged only with app or genre-level data, without deeper content descriptors\" [7]. Rain the Growth Agency, in a Gracenote case study, names the same condition **\"content opacity\"** — buyers lacking \"visibility into specific shows or screen environments\" [8].\n\nThis matters economically as well as technically. A 2026 Gracenote/Nielsen survey of programmatic traders found **100% rated show-level transparency as \"very\" or \"extremely\" important** for brand safety and inventory quality, **95% said the absence of show-level signals prevented them from advocating for more CTV budget**, and **47% of media planners cited limited content-level data as a primary barrier to moving more spend into CTV** [9]. Gracenote's own modeling ranked show-level metadata the second-most important predictor of conversions (behind ZIP code) and **4x more predictive than app-bundle targeting** [8]. The missing layer, in other words, is the valuable one — for safety and performance alike.\n\n### 2.3 Why CTV cannot just \"read the page\" to fill the gap\n\nOn the web, when metadata is missing, the contextual vendor crawls the URL and classifies the real content. On CTV there is **nothing to crawl** — the content is a video stream inside an app, not an addressable document. Every fallback is second-best:\n\n1. **Trust the supply chain's volunteered content object** — vulnerable to omission, error, and (in fraud cases) outright fabrication.\n2. **Match against an external content graph** (Gracenote, Peer39) keyed off whatever partial identifiers do arrive — works only when enough of a title/series/EPG signal is present, and depends on the graph's coverage.\n3. **Use ACR** — recognize the actual content off the glass (§3) — but ACR is walled-garden, device-fragmented, and operates *post*-exposure, not pre-bid.\n\nNone of these reconstitute the web's clean, checkable, pre-bid ground truth. That is why content-level transparency is *the* hard gap rather than merely *a* gap.\n\n---\n\n## 3. ACR: what it can and cannot do for safety\n\nAutomatic Content Recognition is the most-hyped technical answer to the content-opacity problem. Its limits are where the real story lives.\n\n### 3.1 The mechanism\n\nACR identifies whatever is actually displayed on the TV's glass — programming, ads, or input from an attached device — without user input, using **fingerprinting** (hashing samples of the video/audio and matching them against a reference database) or **watermarking** (a signal embedded in the content) [11]. Smart-TV manufacturers embed ACR and collect content-consumption data at the screen or speaker level; the recognized content is matched against a database of known works, letting the platform know, for example, that a given household watched a specific show at 9 p.m. [11]. Vizio markets this as \"glass-level\" certainty — knowing \"for certain what the TV glass is displaying at any given time — programming or ads — regardless of whether it comes from CTV, linear, or other sources\" [12].\n\n### 3.2 What ACR genuinely adds for safety and fraud\n\n- **True content identification** independent of the volunteered metadata — closing, in principle, exactly the content-opacity gap of §2.\n- **Ad-occurrence verification** — confirming an ad actually rendered on a real screen, a fraud-relevant signal Vizio explicitly markets for \"viewability, brand safety and fraud detection\" [12].\n- **Cross-source coverage** — it recognizes anything on the glass, including linear and HDMI-attached sources, not only app-delivered streams.\n\n### 3.3 The hard limits — why ACR is not the fix\n\n- **It is walled-garden and fragmented.** The most urgent problem with ACR, per AdExchanger, is fragmentation: Samsung, Vizio, LG, and Roku each hold rich ACR datasets **\"only executable within their own platforms\"** [13]. No cross-manufacturer ACR layer exists for a buyer to apply uniformly across a programmatic CTV campaign.\n- **Coverage is partial.** ACR sees only opted-in smart-TV households on participating manufacturers. Nielsen's Gracenote ACR footprint and Vizio's Inscape panel are measured in the tens of millions of US sets — Inscape around 11.2 million opted-in Vizio sets and Gracenote roughly 18.9 million devices per AdExchanger — meaningful panels, but nowhere near census-level, and absent on streaming sticks, game consoles, and many devices entirely [14].\n- **It is post-exposure, not pre-bid.** ACR tells you what played *after* it played. It is a measurement and panel-modeling tool, not a real-time gate that can stop a bid from landing next to unsuitable content. The pre-bid decision still has to be made on the impoverished bid-request metadata.\n- **It raises its own privacy exposure.** ACR collects granular viewing data at the household level, which is precisely the kind of sensitive processing that regulators (and a 2024 academic study of smart-TV ACR tracking) scrutinize [15] — a tension that interacts directly with regional privacy law, examined later.\n\nThe honest summary: within a single manufacturer's footprint, ACR confirms and enriches content identity and genuinely helps with measurement and fraud signals. Across the channel, though, it is fragmented, partial, post-hoc, and privacy-loaded — not a general pre-bid suitability solution.\n\n---\n\n## 4. Pre-bid vs. post-bid verification — and why post-bid is hard on CTV\n\n### 4.1 The web model both timings inherit\n\nOn the web, **pre-bid** verification evaluates the bid request (and, for contextual vendors, the crawled page) *before* the buyer spends, blocking the bid if the URL/category fails the rules. **Post-bid** verification runs *after* the ad renders: a JavaScript measurement tag inside the creative loads in the browser, reports viewability and verification, and — critically — can **block the creative from rendering** if it detects an unsafe environment. The web has both gates. The second one works because the browser executes the verifier's JavaScript.\n\n### 4.2 Why post-bid breaks on CTV: no JavaScript on the glass\n\nCTV is where the post-bid web model breaks at the root. **Most CTV environments do not run the JavaScript that web verification tags depend on.** IAS and DoubleVerify's standard web approach uses JavaScript tags to measure on-screen and viewable time; that execution model does not hold on CTV devices or in SSAI-stitched streams [16]. The consequences:\n\n- **No client-side blocking.** Without an executing verifier in the rendering environment, there is no reliable way to *prevent* a rendered impression — the web's \"don't paint the ad if the page is unsafe\" capability largely disappears.\n- **Verification shifts to other surfaces.** DoubleVerify's CTV approach explicitly **does not require an SDK or custom integration**; instead it leans on custom-built algorithms, a dedicated hardware lab that reverse-engineers CTV threats, server-side ad-insertion analysis, and device-level signals to confirm ads reached legitimate household devices [16]. Verification migrates from in-page script to **pre-bid filtering plus probabilistic, server-side, device-signal analysis.**\n- **OMID is the partial exception.** Where a platform supports an Open Measurement SDK and VAST 4.x `<AdVerifications>`, a constrained measurement signal can be obtained — but coverage is uneven and SSAI streams frequently fall outside it (§1.3, §5).\n\n### 4.3 The practical upshot\n\nBecause post-bid blocking is weak on CTV, **the weight of brand-safety enforcement shifts forward to pre-bid** — but pre-bid on CTV is itself \"low-signal,\" hemmed in by the metadata limits of §1–§2. The result is a pincer: the pre-bid gate is starved of content data, and the post-bid gate cannot reliably execute. Specificity Inc.'s framing — pre-bid as prevention versus post-bid as \"merely a forensic report that documents your losses after the budget is spent\" [17] — is doubly true on CTV, where the forensic report is often the *only* thing available. This is the deepest inversion from web brand safety. On the web you could catch problems at render; on CTV you catch them at the auction, with worse data, or not at all.\n\n---\n\n## 5. SSAI: the engine of scale and the engine of fraud\n\nServer-side ad insertion is the single most consequential technical fact in CTV brand safety. It is at once the feature that makes premium streaming ads work and the mechanism behind the channel's largest fraud.\n\n### 5.1 How SSAI works\n\nIn SSAI (also \"ad stitching\" or, in some vendors' usage, DAI — dynamic ad insertion), ads are **inserted into the video stream on a server before it reaches the device**, rather than fetched and rendered separately by a client-side player. When playback starts, the SSAI platform sends an ad request to an Ad Decision Service, receives one or more ads, conditions them to match the source stream's specification, and **stitches them into the content at ad-break points marked by SCTE-35 cue markers**, delivering one continuous stream the device plays \"like any other piece of content\" [18][19]. The viewer experiences seamless ad pods with no buffering, and — because the ad is part of the content stream — **client-side ad blockers cannot strip it out** [18].\n\nThese benefits are real and large: smooth playback on constrained TV hardware, frame-accurate ad pods, ad-block resistance, and a uniform experience across a fragmented device base. With good reason, SSAI is the dominant delivery method for premium and FAST streaming inventory.\n\n### 5.2 Why SSAI breaks verification and enables spoofing\n\nThe same architecture that delivers those benefits **moves the ad-decisioning and tracking logic off the client and onto the server.** Two problems follow.\n\n1. **The client-side data trail is severed.** Third-party verification vendors lose access to client-side data; measurement must rely on **server-side beaconing** rather than an in-browser tag [18][20]. Ad servers, measurement vendors, and buyers need basic device/environment data for measurement, verification, and fraud analysis — and SSAI is the layer that can either faithfully relay or quietly fabricate that data [20].\n2. **The SSAI server becomes a single point an attacker can impersonate.** Because the device trusts the stitched stream and the buyer trusts the SSAI server's reported signals, **a fraudulent or spoofed SSAI server can manufacture device, IP, and app signals at industrial scale.** IAB Tech Lab has run dedicated workshops on exactly these SSAI measurement and trust gaps [21].\n\n### 5.3 The fraud lineage: ICEBUCKET → StreamScam → ParrotTerra → SneakyTerra\n\nThe CTV fraud record is, in large part, a record of SSAI being weaponized. The lineage matters because each scheme exploited a different facet of one severed-trust architecture.\n\n- **ICEBUCKET (2020).** An early large-scale SSAI fraud operation that, per reporting, counterfeited more than 300 publishers, spoofed at least 2 million IP addresses across 30+ countries, and at peak generated roughly **1.9 billion ad requests per day** [22]. The template: stand up counterfeit SSAI servers and fabricate CTV inventory across unlimited apps, IPs, and devices.\n- **LeoTerra / StreamScam (2020).** DoubleVerify uncovered \"LeoTerra\" in July 2020; it resurfaced as \"StreamScam,\" identified by Oracle five months later, and is reported to have stolen about **$14.5 million** [22][23].\n- **ParrotTerra (early 2021).** Briefly the largest scheme to date, scaling as many as **3.7 million device signatures and 2.7 million IP addresses per day** — roughly triple StreamScam — and on track to steal an estimated **$30–$50 million** before DoubleVerify blocked it [22][24].\n- **SneakyTerra (announced March 4, 2021).** The most instructive case, because it shows the *next* evolution: rather than fabricating fake devices wholesale, SneakyTerra **hijacks real CTV device sessions.** Per DoubleVerify, the scheme buys a genuine impression, then inserts impression trackers from *multiple* ads — obtained via **spoofed SSAI calls** — into a single creative response. When an actual CTV device receives that response, **pixels fire for all the stuffed trackers**, so one ad is seen but impressions for many are generated [25][26]. At peak it was **spoofing over 2 million devices per day** and, at an assumed **$20 CPM**, could have cost unprotected advertisers **more than $5 million per month** [25][26]. What made it sophisticated and hard to detect: because the stuffed impressions ultimately serve on *real* devices, ad servers and measurement vendors receive **genuine serving data**, not obviously-spoofed SSAI data [26]. DoubleVerify credits detection to its DV Video Filtering layer (launched November 2020), which evaluated video-impression opportunities against fraud/brand-safety/geo rules and surfaced the spoofed SSAI transactions before they executed on real devices [26].\n\nA caveat on the numbers. The SneakyTerra, ParrotTerra, StreamScam, and ICEBUCKET disclosures originate with verification vendors (DoubleVerify, Oracle/Moat, HUMAN) and their press releases, which have a commercial interest in dramatizing threats they sell protection against. The *existence and mechanics* of these schemes are well-attested — multiple vendors and trade outlets corroborate the SSAI-spoofing pattern — but the precise dollar figures and device counts are vendor estimates, single-sourced to the disclosing vendor and not independently audited. The cumulative \"$144M annually\" figure for schemes like MultiTerra and SneakyTerra is likewise a DoubleVerify projection [22].\n\n### 5.4 The web contrast\n\nThere is no clean web analogue to SSAI fraud. On the web, the verification tag runs in the user's browser and reports from the actual render environment; spoofing it means faking the browser itself, which leaves detectable fingerprints. SSAI removes the browser from the loop, so the fraudster only has to convince a *server* — and the server's reports are what everyone downstream trusts. **The vulnerability is not a bug in SSAI. It is the structural consequence of moving trust from the client to the server.**\n\n---\n\n## 6. The CTV invalid-traffic and fraud taxonomy\n\nCTV's fraud surface differs from web and mobile because the channel is high-CPM, low-signal, app-based, and SSAI-mediated. The result is both elevated IVT rates and a taxonomy of its own.\n\n### 6.1 The scale: IVT far above web norms\n\nPixalate, analyzing over 100,000 CTV apps and roughly **7 billion open-programmatic transactions in Q1 2025**, reported a **global open-programmatic CTV IVT rate of 18%** — up from 12% in Q1 2024 (a ~50% year-over-year rise) and down from a holiday-season 24% in Q4 2024 [27][28]. Well-managed web/mobile display IVT in protected inventory typically sits in the low single digits; CTV's open-programmatic IVT runs an order of magnitude higher. The regional and device spread is wide:\n\n| Cut | IVT rate (Pixalate, Q1 2025) |\n| --- | --- |\n| APAC | 36% |\n| EMEA | 30% |\n| LATAM | 24% |\n| North America | 18% |\n| Canada | 26% |\n| United Kingdom | 24% |\n| United States | 18% |\n| Roku (device) | 11% (lowest) |\n| Amazon Fire TV | 16% |\n| Apple TV | 20% |\n| Samsung Smart TV | 36% (highest) |\n\nSource: Pixalate Q1 2025 Global CTV Ad Supply Chain Trends Report [27]. (Q1 2025 global open-programmatic CTV ad spend: **$5.02 billion**, +10% YoY [27].)\n\nA caveat on the numbers. Pixalate sells IVT detection; its \"IVT\" definition follows MRC standards but the measurement is proprietary. The directional finding — CTV IVT materially exceeds web norms and varies sharply by region and device — is corroborated across Pixalate's quarterly series and other vendors, but exact percentages are single-vendor figures.\n\n### 6.2 The taxonomy: CTV-specific fraud types\n\n- **Device spoofing.** Fabricating or impersonating CTV devices to generate impressions that look like premium TV inventory. CTV is \"particularly attractive\" for this because it commands premium CPMs and is a \"low-signal environment with limited pre-bid transparency,\" which makes real-time device verification hard [29]. This is the core mechanic behind ICEBUCKET, StreamScam, and ParrotTerra.\n- **App (bundle ID) spoofing.** Misrepresenting the app in the bid request — Pixalate defines it as impressions where the reported app identifier \"does not match the characteristics of the app detected\" [27]. This attacks the *only* reliable CTV environment signal (§1.2): if the bundle ID is the domain-equivalent and it can be faked, the buyer's brand-safety allow/block lists are running on fiction. Pixalate publishes a recurring \"Malformed & Fraudulent CTV Bundle IDs\" risk report tracking exactly this [30].\n- **Datacenter / proxy traffic.** Impressions originating from datacenter IPs or routed through intermediary proxy devices \"that exist to manipulate traffic counts, pass non-human or invalid traffic, or fail to comply with the protocol\" [27]. Legitimate household CTV traffic should originate from residential IPs; datacenter origination is a strong non-human signal.\n- **Impression recycling / stacking via SSAI.** The SneakyTerra pattern (§5.3): stuffing multiple impression trackers into one real creative response so several \"impressions\" bill against a single genuine ad view [25].\n- **Bot / non-human traffic (NHT).** The MRC-standard residual — spiders, bots, automated agents generating impressions [27].\n\n### 6.3 The web/mobile contrast\n\nWeb fraud taxonomies center on domain spoofing, bot traffic, ad stacking and pixel stuffing in hidden iframes, and click fraud — all of which leave browser-observable traces. CTV's distinctive additions are **device spoofing** (no browser to fingerprint), **bundle-ID spoofing** (attacking the app identifier because there is no URL), and **SSAI-mediated impression manipulation** (attacking the server-side trust layer web inventory does not have). The premium CPM makes each fraudulent CTV impression worth far more to steal than a typical display impression. That is why the channel draws disproportionate, organized fraud.\n\n---\n\n## 7. Made-for-advertising (MFA) and its CTV analogue\n\n### 7.1 MFA on the web\n\nMade-for-advertising sites are low-quality, ad-cluttered web properties engineered to harvest programmatic spend rather than serve readers — the canonical suitability-without-safety problem (technically \"safe,\" yet valueless and reputation-eroding). The ANA's 2024 Programmatic Benchmark Study found MFA's share of measured ad spend fell sharply, from 15% in 2023 to **6.2% in 2024**, with median spend dropping from 10% to 1.1% — evidence that web MFA controls have tightened [31][32].\n\n### 7.2 The CTV analogue: FAST-channel sprawl and content arbitrage\n\nCTV's structural equivalent is the **explosion of low-quality FAST (Free Ad-Supported Streaming TV) channels and content-arbitrage apps.** The dynamics rhyme with MFA on three counts:\n\n- A long tail of thinly-watched FAST channels and apps exists primarily to generate ad inventory, often recycling cheap or public-domain content.\n- Because content-level metadata is opaque (§2), buyers cannot easily distinguish a premium, professionally-produced FAST channel from a low-value arbitrage channel — the *suitability* signal that would separate them is exactly the missing layer.\n- The same supply-path obscurity that hides fraud also hides low-quality-but-legitimate inventory, so MFA-style waste and outright IVT blur together in the open-programmatic CTV long tail.\n\nThe ANA's 2024 study, which for the first time incorporated CTV, found CTV at **28% of measured programmatic spend with ~80% of marketers using it**, while the number of domains and apps in the analysis fell from 44,000 to **22,634** — a deliberate narrowing toward curated, brand-safe environments [31][32][33]. That contraction is the industry's blunt-instrument answer to CTV's MFA-analogue problem: when you cannot evaluate the long tail at the content level, you prune the long tail. The ANA also estimated that more than half of programmatic spend is diverted before reaching consumers, with only about **$439 of every $1,000** reaching the viewer [31][33] — macro evidence that the waste-MFA-IVT complex remains large.\n\nA note on currency. The ANA Programmatic Benchmark is a recurring series, with 2023, 2024, and Q2 2025 reports [31][34]. FAST as a category — and named platforms such as Pluto TV, Tubi, The Roku Channel, and Samsung TV Plus — was in-market in 2024–2026 trade coverage, but specific channel-level lineups churn constantly.\n\n---\n\n## 8. The supply-chain transparency stack\n\nBeyond vendor detection, the industry's structural answer to CTV's missing-URL, severed-trust problem is a set of IAB Tech Lab supply-chain standards imported from web programmatic and adapted for apps. They do not solve content opacity, but they attack spoofing and unauthorized reselling.\n\n### 8.1 app-ads.txt (and the CTV variant)\n\napp-ads.txt extends the web `ads.txt` standard to apps: a publisher posts, at a domain referenced from its app-store listing, a public list of the sellers and resellers authorized to monetize its inventory. Buyers (and SSPs) can then reject bid requests claiming to sell a publisher's inventory through an unauthorized path — **directly countering app/bundle-ID spoofing.** The store-assigned unique app ID (§1.2) is what makes app-ads.txt enforceable, which is why IAB Tech Lab ties the two specs together [2][35]. IAB Tech Lab has released an **enhanced version of app-ads.txt designed specifically for streaming/CTV** to handle the device and store-listing peculiarities of the TV environment [35].\n\n### 8.2 sellers.json\n\nsellers.json is the seller-side counterpart: each SSP/exchange publishes a machine-readable file declaring every seller and intermediary it represents, with name, domain, and role (publisher vs. intermediary) — letting buyers **verify the legitimacy and position of every entity** that could be paid for an impression [35][36]. The OpenRTB Working Group finalized sellers.json alongside the SupplyChain Object on **July 31, 2019** [36].\n\n### 8.3 The OpenRTB SupplyChain Object (schain)\n\nThe SupplyChain Object travels *inside the bid request* and enumerates, as an ordered set of **nodes**, every entity that is selling or reselling that specific request, end to end [36]. Read together with sellers.json (which says who each node *is*) and app-ads.txt (which says who is *authorized*), the SupplyChain Object lets a buyer reconstruct and validate the full monetization path of a single CTV impression — the closest the channel gets to provenance.\n\n### 8.4 What the stack does and does not fix\n\n- **Fixes (partially):** unauthorized reselling, domain/bundle spoofing of *authorized-seller status*, and hidden intermediary hops — the plumbing-level integrity problems.\n- **Does not fix:** content opacity (it says nothing about what *program* an ad runs against), sophisticated SSAI session-hijacking that operates *within* an authorized path (SneakyTerra's stuffed impressions ride real, authorized inventory), or device spoofing where the device signal itself is fabricated. The transparency stack authenticates the *supply path*, not the *content* and not, by itself, the *device*.\n\n### 8.5 The frontier: cryptographic device attestation\n\nThe newest structural answer targets the device-spoofing gap the transparency stack leaves open. IAB Tech Lab's **Open Measurement SDK 1.6, announced November 4, 2025**, adds **device attestation**: a publisher integrating OM SDK 1.6 triggers an attestation call; the measurement provider requests an attestation token directly from the device manufacturer; the manufacturer issues a token using the **IETF Privacy Pass protocol** (which prevents reverse-engineering), delivering a **deterministic, manufacturer-signed signal** that the impression came from a genuine device rather than a probabilistic proxy guess [29]. Initial participants named in trade coverage include manufacturers Google, Apple, and Amazon (supporting Apple and Fire TV devices at launch) and ad-tech participants AdsWizz, Amazon Ads, DoubleVerify, Google, HUMAN, and IAS [29]. **The explicit limitation:** attestation addresses only *spoofed devices* — it cannot stop fraud that uses *legitimate* devices disconnected from an actual television to manufacture impressions [29].\n\nA note on currency. OM SDK 1.6 with device attestation was announced November 4, 2025 — very recent. Its real-world adoption breadth as of mid-2026 remains unclear; the participant list is the *announced* roster, not verified production deployment.\n\n---\n\n## 9. The standards and governance backdrop — and the post-GARM vacuum\n\nBrand *suitability* — distinct from fraud and IVT — depends on a shared vocabulary for what counts as risky content. CTV inherited that vocabulary from the GARM era, and now operates amid its partial collapse.\n\n### 9.1 The GARM framework and the IAB content taxonomy\n\nThe Global Alliance for Responsible Media (GARM), a WFA initiative, released the **Brand Safety Floor + Suitability Framework** in 2019 — **11 content categories mapped against 4 risk levels** (floor, high, medium, low) — which became the de facto common language for suitability across digital media [37]. IAB Tech Lab operationalized it technically: **Content Taxonomy 2.2**, built in partnership with GARM, added a top-level **\"Sensitive Topics\"** node with 11 sub-nodes (terrorism, adult/explicit sexual content, hate speech, etc.) so the ecosystem could machine-describe potentially unsuitable content consistently [37][38]. The MRC incorporated the Brand Safety Floor by reference into its Supplemental Guidance on Content-Level Context and Brand Safety Ad Verification, tying the framework to accreditation [37]. IAB Tech Lab maintains an open human-labeled benchmark repository for the GARM standard [37].\n\n### 9.2 The vacuum: GARM's August 2024 shutdown\n\nIn **August 2024, GARM shut down** within days of an antitrust lawsuit filed by Elon Musk's X (formerly Twitter), which alleged GARM and members coordinated an advertiser boycott; the WFA said the allegations had become \"a distraction\" that \"significantly drained its resources and finances\" [39][40]. A US judge later dismissed X's antitrust claims, but GARM never returned as an operating body [39]. Industry reaction (Zefr, PRWeek, Campaign) called it a \"sad day,\" noting that GARM had effectively \"invented the standards\" for brand-safety governance, leaving a **governance vacuum** [40].\n\nThe technically important nuance: **the GARM-derived *framework* and *taxonomy* survive even though the *organization* does not.** IAB Tech Lab, the Brand Safety Institute, and the MRC's accreditation regime now steward the Brand Safety Floor + Suitability Framework and IAB Content Taxonomy 2.2, rather than GARM itself [37][38]. The shared vocabulary persists as a technical artifact. But the convening body that updated it, arbitrated disputes, and coordinated enforcement is gone — and as of mid-2026 no equivalent multi-stakeholder body has fully replaced it. For CTV this cuts deepest, because CTV suitability is *least* mature: the framework was built for social and web video, and applying its content-level categories to a channel that struggles to pass content-level metadata at all (§2) is doubly hard with no active standards body driving CTV-specific implementation.\n\nA note on currency. GARM's shutdown (Aug 2024) and the survival of its framework under IAB Tech Lab, Brand Safety Institute, and MRC stewardship are present-tense governance claims [37][39][40]. The Brand Safety Institute maintains the framework resources, but the precise division of stewardship after GARM is still evolving.\n\n---\n\n## 10. Synthesis: the web-to-CTV inversion, in one table\n\n| Dimension | Web / mobile display & video | Programmatic CTV |\n| --- | --- | --- |\n| Environment identifier | `site.page` URL — fully addressable, crawlable | `app.bundle` store ID — container only, not content |\n| Content ground truth | Crawl and classify the real page | Volunteered `content` object; usually incomplete (~0.73 categories) [7] |\n| Independent verification of content | Yes — vendor reads the page | No — nothing to crawl; ACR is walled-garden & post-hoc |\n| Verification execution | JavaScript tag in the browser | No JS on most devices; OMID partial; server-side beaconing |\n| Post-bid blocking | Yes — verifier can refuse to render | Largely no — enforcement shifts pre-bid |\n| Dominant ad delivery | Client-side, per-impression | SSAI server-side stitching (severs client trail) |\n| Signature fraud | Domain spoofing, bot traffic, ad stacking | Device spoofing, bundle-ID spoofing, SSAI session-hijack |\n| IVT magnitude (open programmatic) | Low single digits (protected) | ~18% global, up to 36% regionally [27] |\n| Provenance tooling | ads.txt, sellers.json, schain | app-ads.txt (CTV variant), sellers.json, schain + device attestation (OM SDK 1.6) |\n| Suitability vocabulary | GARM framework / IAB Taxonomy 2.2 (mature) | Same framework, least-mature application; post-GARM governance vacuum |\n\nThe through-line: **every pillar web brand safety stood on — the URL, the crawlable page, the in-browser verifier, the render-time block — is absent or degraded in CTV, while the channel's premium CPMs make it the most attractive target for organized fraud.** The industry's compensating moves — content graphs, ACR, pre-bid filtering, the supply-chain transparency stack, and now cryptographic device attestation — are real and improving. But each is partial, and the most valuable layer of all, consistent content-level transparency, remains the unsolved core.\n\n---\n\n## Open Questions\n\n1. **Will content-level metadata ever become reliably census-grade?** Content graphs (Gracenote, Peer39) and ACR are converging on the problem, but neither is universal. Is there a plausible path to consistent, standardized content-object population across all CTV supply — or is the channel structurally stuck at app-level for the long tail?\n2. **How broadly will device attestation (OM SDK 1.6) actually deploy?** The November 2025 launch is promising but recent; real adoption across Roku, Samsung, LG, and the open programmatic long tail is unknown, and attestation explicitly does not stop legitimate-device-disconnected-from-TV fraud.\n3. **What replaces GARM's governance function for CTV specifically?** The framework survives, but no active multi-stakeholder body is driving CTV suitability implementation. Does the MRC/IAB Tech Lab/BSI distribution suffice, or does fragmentation set back CTV suitability further?\n4. **How much of measured CTV \"IVT\" is fraud vs. measurement artifact of SSAI?** SSAI's severed client trail makes some legitimate impressions hard to verify; the line between \"fraud\" and \"unverifiable\" is genuinely blurry, and vendor IVT figures may conflate them.\n5. **Can pre-bid verification ever compensate for the loss of post-bid blocking on CTV?** With the enforcement weight shifted forward to a data-starved pre-bid gate, is there a ceiling on how safe CTV can be made without solving content transparency first?\n6. **What is the cross-vendor, independently-audited true IVT rate?** All headline figures are single-vendor (Pixalate, DV, HUMAN). Is there an MRC-accredited, methodology-transparent benchmark that reconciles them?\n\n---\n\n## Sources\n\n1. FreeWheel, \"A Guide to Programmatic Metadata,\" 2023. https://www.freewheel.com/wp-content/uploads/2023/07/FreeWheel_Programmatic_Metadata_Guide.pdf — Tier 5 (vendor technical guide; note FreeWheel is a Comcast ad-tech unit w \n25. WebSearch synthesis of DoubleVerify FraudLab Flash Report (SneakyTerra one-sheet). https://doubleverify.com/hubfs/46126064/content/DV_Onesheet_FraudLab_SneakyTerra.pdf — Tier 5/vendor (DV self-disclosure; flag interest). Accessed 2026-06-17. *Contribution: SneakyTerra impression-stuffing mechanic via spoofed SSAI; pixels fire for multiple trackers on one real device.*\n26. GlobeNewswire (DoubleVerify press release), \"DoubleVerify Uncovers 'SneakyTerra' — the First SSAI Fraud Scheme to Hijack Real CTV Device Sessions,\" March 4, 2021. https://www.globenewswire.com/news-release/2021/03/04/2187455/0/en/DoubleVerify-Uncovers-SneakyTerra-the-First-SSAI-Fraud-Scheme-to-Hijack-Real-CTV-Device-Sessions.html — Tier 1 for *what DV claims* / treat numbers as vendor estimates. Accessed 2026-06-17. *Contribution: 2M+ devices/day, $20 CPM, >$5M/month; DV Video Filtering (Nov 2020) detection; \"real serving data\" sophistication.*\n27. Pixalate, \"Q1 2025 Global CTV Ad Supply Chain Trends Report.\" https://www.pixalate.com/blog/q1-2025-global-ctv-ad-supply-chain-trends-report — Tier 5/vendor (sells IVT detection; flag interest). Accessed 2026-06-17. *Contribution: 18% global IVT Q1 2025 (12% Q1 2024, 24% Q4 2024); regional (APAC 36/EMEA 30/LATAM 24/NA 18) and device rates (Roku 11/Fire 16/AppleTV 20/Samsung 36); $5.02B spend; bundle-ID-spoofing & proxy definitions.*\n28. GlobeNewswire (Pixalate), \"Q4 2024 CTV Ad Supply Chain Trends: Global open programmatic CTV ad spend rises 10% YoY to $7.6B despite IVT surge to 24%,\" March 26, 2025. https://www.globenewswire.com/news-release/2025/03/26/3049986/0/en/ — Tier 1 for *what Pixalate claims* (press release). Accessed 2026-06-17. *Contribution: Q4 2024 24% IVT, $7.6B spend; ~100K apps / 12B transactions analyzed.*\n29. AdExchanger, \"CTV Manufacturers Have A New Tool For Catching Spoofed Devices,\" Nov 2025. https://www.adexchanger.com/tv/ctv-manufacturers-have-a-new-tool-for-catching-spoofed-devices/ — Tier 5 (trade). Accessed
