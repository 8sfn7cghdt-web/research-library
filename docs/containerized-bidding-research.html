w.publicisgroupe.com/en/news/press-releases/publicis-to-acquire-lotame-the-world-s-leading-independent-end-to-end-data-solution (accessed 2026-06-20). *Tier 1 — press release (claim, not proof); identity-graph and CoreAI positioning.*\n22. LiveRamp Holdings / Publicis (Publicis $2.2B LiveRamp acquisition), SEC DEFA14A/8-K FY2026. https://www.sec.gov/Archives/edgar/data/0000733269/000110465926062918/tm2614904d1_ex99-2.htm (accessed 2026-06-20). *Tier 1 — primary filing; $2.2B enterprise value, \"leader in data co-creation… agentic business transformation,\" raised 2027–28 growth objectives, Epsilon track record.*\n23. Digiday, \"Agencies are moving closer to supply, and it's reshaping the programmatic middle layer,\" digiday.com, May 20, 2026 (also names Publicis/LiveRamp). https://digiday.com/media-buying/agencies-are-moving-closer-to-supply-and-its-reshaping-the-programmatic-middle-layer/ (accessed 2026-06-20). *Tier 5 trade — the \"closer to supply\" thesis; Index Cloud/Bedrock as holdco-relevant; Publicis $2.2B LiveRamp; Kevin Flood (First Party Capital, disclosed Bedrock backer) value framing; leverage/lock-in worry.*\n24. Digiday, \"Publicis Groupe to buy Lotame in a rare instance of agency-led ad tech consolidation,\" digiday.com, 2025. https://digiday.com/media-buying/publicis-groupe-to-buy-lotame-in-a-rare-instance-of-agency-led-ad-tech-consolidation/ (accessed 2026-06-20). *Tier 4/5 trade — agency-led ad-tech consolidation framing; CoreAI/Epsilon context.*\n25. The Drum, \"'The exposure is significant': The fallout from Publicis's $2.2bn LiveRamp deal,\" thedrum.com, 2026. https://www.thedrum.com/news/the-exposure-is-significant-inside-the-implications-of-publicis-2-bn-liveramp-deal (accessed 2026-06-20). *Tier 5 trade — concentration/neutrality risk of a holdco owning LiveRamp's cross-industry infrastructure. Single-source caution.*\n26. Ad Age / ANA, \"ANA Report: Marketers Expand In-House Programmatic Buying,\" adage.com. https://adage.com/article/agency-news/ana-report-marketers-expanding-house-programmatic-media-buying/311688 (accessed 2026-06-20). *Tier 4/5 + Tier 2 (ANA study) — 35% expanded in-house programmatic (2× the ~14% of 2016); named brands Kellogg, Netflix, P&G; transparency/data-control motives.*\n27. PPC Land, \"87% of agency pros say the traditional agency model is broken,\" ppc.land, 2026. https://ppc.land/87-of-agency-pros-say-the-traditional-agency-model-is-broken/ (accessed 2026-06-20). *Tier 5 trade — 87.3% \"model broken/within 3–5 yrs\" (single-source survey — treat figure with caution); hybrid-in-housing context.*\n28. AdExchanger, \"Hyundai Tests Containerized Ad Tech To Drive New Efficiency,\" adexchanger.com, Jun 16, 2026. https://www.adexchanger.com/marketers/hyundai-tests-containerized-ad-tech-to-drive-new-efficiency/ (accessed 2026-06-20). *Tier 4 trade — Hyundai/OpenXBuild/Chalice; \"retains IP ownership of targeting models,\" \"own that\" vs. Google PMax; proprietary high-value-action signals.*\n29. AdExchanger, \"How SPO Helped This Indie Agency Cut Its SSP Partners To Single Digits\" (Goodway/Goodpath/Jounce), adexchanger.com, 2026. https://www.adexchanger.com/agencies/how-spo-helped-this-indie-agency-cut-its-ssp-partners-to-single-digits/ (accessed 2026-06-20). *Tier 4 trade — Goodway 20→single-digit SSPs; Goodpath/Jounce curation; \"28% more spend to working media.\" Independent-agency SPO exemplar.*\n30. First Party Capital, \"Containerised Bidding Arrives: How Bedrock Platform Is Redefining The $200+ Billion Programmatic Ad Business,\" newsletter.firstpartycapital.com, 2026. https://newsletter.firstpartycapital.com/p/containerised-bidding-arrives-how (accessed 2026-06-20). *Tier 6 (interested party — Bedrock backer). Value-to-agencies framing; cite as position-evidence, not fact.*\n31. Marketing Brew, \"How The Trade Desk is aiming to remain 'king of the open web,'\" marketingbrew.com, Apr 9, 2026. https://www.marketingbrew.com/stories/2026/04/09/the-trade-desk-strategy-exec-changes-agency-scrutiny (accessed 2026-06-20). *Tier 5 trade — Omnicom + Publicis ran formal audits of TTD fee structures; TTD's direct-to-brand counter (Jeff Green \"JBPs… over half of our business\"); Luke Stillman (Madison & Wall) on performance-over-transparency.*\n32. Digiday, \"Agencies are moving closer to supply…\" (leverage/lock-in worry), May 20, 2026. https://digiday.com/media-buying/agencies-are-moving-closer-to-supply-and-its-reshaping-the-programmatic-middle-layer/ (accessed 2026-06-20). *Tier 5 trade — executives wary of \"vertically integrated auction environments where they feel their scaled buying operations lose leverage.\" Same article as [23]; cited separately for the leverage worry.*\n\n---\n\n*Related reading: the chapter on origins and evolution (SPO and GroupM's Premium Marketplace — the demand-side precondition); the chapter on architecture and plumbing (Hyundai \"own that,\" buy-side data in the container — the in-housing mechanism); the chapter on standards and governance (ARTF vs. AdCP/agent-negotiation fault line — which WPP Media hedges across); the market and competitive map (independent-agency testers, MiQ buyer-side intelligence relocating, who keeps the spread, and the governance roster including WPP Media and Basis); and the chapter on risks and contested claims (\"agencies moving closer to supply\" and the leverage/lock-in worry — developed strategically here).*"}, {"order": 13, "file": "Future_Trajectory.md", "title": "Containerized Bidding: Future Trajectory", "summary": "", "body": "# Containerized Bidding: Future Trajectory\n\n## Bottom Line\n\nThe argument worth having about containerized bidding is not whether it becomes real. It does. Four independent lines of reasoning, working from different angles, converge on roughly an 80% chance that buyer-side logic running inside exchange data centers becomes durable open-web infrastructure by 2030. The egress savings are mechanically sound, three fabrics are already live, and a real IAB standard is pulling the architecture forward. That floor is not seriously in doubt.\n\nThe real question is **who keeps the money the architecture moves** — and here the read is sobering for anyone betting on a new margin-capturing seat. The single most likely outcome (40–46%) is that containerized bidding becomes plumbing: a feature every SSP offers, valuable, widely used, and competed to near-zero rent, exactly the way header-bidding wrappers, Prebid Server, and supply-path optimization all became plumbing before it. The auction moves closer to the buyer; the margin map barely shifts. A genuinely new, defended seat for an independent fabric operator or a re-rated DSP tier is the second scenario, not the first (20–28%). The reason is structural: ARTF's \"deploy-once\" portability, the very property that drives adoption, is also the property that destroys any single host's pricing power. The probabilities rest on reference-class base rates and decomposition, not a market — no prediction market trades this question, and none was invented.\n\n> **The forecast in one line:** containerized bidding almost certainly becomes real open-web infrastructure; it most likely does *not* mint a durable new margin seat — the relocated dollar is largely competed away or claimed by forces (the DSP fee war, the walled gardens) that were already in motion.\n\n---\n\n## The market sweep: no price exists\n\nThe first move is always to look for a market price, because a liquid market is the strongest external anchor a forecast can have. There is none here. A three-way sweep of Polymarket, Kalshi, Manifold, and Metaculus on June 20 2026 — on the exact question, on decomposed sub-questions (container-side spend share, SSP margin capture, DSP take-rate compression), and on the nearest adjacent question (the Google ad-tech antitrust remedy) — returned zero liquid markets. \"Containerized bidding\" is too young and too niche for money to have formed an opinion. So every probability below is built the harder way: from counted reference classes and from decompositions a reader can reconstruct, never from a number picked because it felt right.\n\n---\n\n## The five scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Containerized bidding through 2030 — five scenarios (probability bands)<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Absorbed / bounded plumbin…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"381.4\" y=\"8\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"418.9\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">40–46%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Margin relocation with a r…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"283.2\" y=\"44\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"330.5\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">20–28%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">AdCP topology bypass<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"239.0\" y=\"80\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"276.5\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">11–17%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Stall / abandonment<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"261.7\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">8–14%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Incumbent-fabric capture<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"152\" width=\"24.5\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"256.8\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">8–13%<\/text><\/svg><figcaption>Reconciled probability ranges. The disagreement is not whether the architecture becomes real (~80% across all lines of reasoning) but who captures the margin it relocates.<\/figcaption><\/figure>\n\n\n\n### 1 — Absorbed / Bounded Plumbing · 40–46% · *modal*\n\nContainerized bidding becomes exactly what its boosters promise on the technical merits and nothing more: real, multi-fabric, open-web infrastructure that every major SSP offers and many buyers use — and a commoditized feature, not a new seat at the margin table. The work that actually runs at scale inside the fabrics is host-signal enrichment (fraud, brand-safety, contextual) and small model-driven DSPs of the Bedrock class, not the incumbent performance bidders the strategic case was built on.\n\nThis is the strongest convergence in the forecast: every independent line of reasoning lands between 38% and 48%. It rests on the sharpest reference class in the corpus. Of roughly five standards-blessed open-web infrastructure shifts over the last fifteen years — OpenRTB (2010), header bidding (2014), Prebid Server (2017), supply-path optimization (2017), the identity graphs (UID2/RampID, 2021) — about four became durable but bounded layers. And of those four, the majority (header-bidding wrappers, Prebid Server, SPO) ended as commoditized plumbing absorbed into incumbent stacks *without minting a durable new margin seat.* The auction moved; the margin map mostly didn't. ARTF's deploy-once portability is the mechanism that reproduces that history here: the same portability that lowers a buyer's switching cost and speeds adoption also guarantees that no single SSP can charge a defended rent for hosting (Claim 2.8, Claim 5.14). The decisive move in the reasoning was the contrarian correction — *a durable layer is not the same thing as a durable new margin seat* — which the other lines of reasoning ultimately conceded.\n\n*Watch for:* GA announcements versus continued closed beta from Index, PubMatic, and OpenX through 2027; whether any SSP publishes **and sustains** a containerized-hosting take-rate above 2–3% of routed spend across several quarters, rather than bundling it free to win supply; the first at-scale containerized revenue accruing to fraud/contextual/verification agents rather than bidders; and trade-press framing shifting from \"new category\" to \"standard feature.\"\n\n### 2 — Margin Relocation with a Real Seat · 20–28%\n\nThe strategic case comes true: in-fabric execution forms a genuinely defended rent — either an independent SSP that holds a hosting-and-curation margin against portability, or an incumbent-scale DSP that becomes a real fabric tenant — and the standalone DSP-infrastructure tier re-rates. This is the world where containerization is a margin-relocation event with a beneficiary you can name, not just a faster pipe.\n\nIt is a real possibility, not a fantasy, and it leans on the corpus's most credible structural lever: QPS-decoupling lets a sub-scale buyer see a full exchange's bidstream for the first time, which is the one disintermediation argument that comes from cost structure rather than a vendor case study (Claim 2.8). The multi-homing of independent decisioning vendors — Chalice across Index, OpenX, and PubMatic; SWYM across five hosts — is the strongest evidence that a market, not a scatter of betas, already exists. But this scenario's probability was cut hard under scrutiny, because the driver-decomposition view's original 27–37% double-counted the exogenous DSP fee war (see below) as if containers were causing compression that was already happening for other reasons. The decomposition that survives: roughly 80% chance of a durable layer, times roughly 30% chance that the durable layer forms a *defended* independent-SSP seat or wins incumbent-scale tenancy — the residual left over once the modal absorbs most of the probability.\n\n*Watch for:* any move by The Trade Desk, Yahoo, DV360, or Amazon DSP from ARTF-contributor to actual production tenant, independently corroborated; a disclosed fabric commercial model that undercuts incumbent DSP take and holds across quarters; an ANA or Adalytics benchmark showing the DSP slice falling *specifically* where containerized routes are used; and MRC or an equivalent moving toward lift/incrementality accreditation for in-fabric decisioning.\n\n### 3 — AdCP Topology Bypass · 11–17%\n\nA different architecture wins the future and quietly shrinks the problem containerized bidding solves. Under AdCP — the Scope3-led, MCP-based rival standard — buyer agents and seller agents negotiate deals directly, routing around the impression auction rather than accelerating it (Claim 3.9). If that topology takes hold, the relocated margin flows to publishers and the orchestrating agents and SSPs that broker the negotiation, not to the auction-fabric hosts containerized bidding depends on.\n\nThis is the existential branch: it is not a speed optimization but a genuine topology change, which is why it gets real weight. The tailwinds are specific — CTV's crown-jewel data favors direct, private, clean-room-style deals over open auctions, and the broader AI-agent and MCP momentum is a tailwind for AdCP's substrate in particular. Yahoo, the most forward-leaning incumbent, is a founding member, an explicit hedge. This was held at 11–17% rather than higher because the obvious bullish anchor is a trap: private marketplace deals are 81.6% of programmatic spend, but PMP volume still *clears through* the auction, SSP, and deal-ID plumbing — that is coexistence evidence, not bypass evidence. Adjusted for AdCP's youth (about eight months) and its missing demand-side incumbents (TTD, DV360, Amazon DSP all absent), a route-around base rate of ~0.5 falls well below that.\n\n*Watch for:* AdCP membership additions, especially any demand-side incumbent; trade reports of live AdCP-negotiated deals *at volume* rather than spec announcements; and — the subtle one — whether an end-to-end transaction ever composes AdCP-negotiation with ARTF-execution. Its absence supports this scenario; a documented composed transaction undercuts it.\n\n### 4 — Stall / Abandonment · 8–14%\n\nThe category never escapes the beta pen. It stays pilot-bound, or collapses into a single proprietary fabric, and is not even absorbed as a standard feature. This is the failure case, and it is a live one because the strategic promise is genuinely unredeemed today: ARTF v1.0 ships no trusted execution environment, so the sandbox gates buy-side data and only host-held-signal use cases actually work (Claim 2.5, Claim 2.6) — a smaller market that may not sustain standalone pilots. The performance thesis rests on an identity substrate the architecture does not touch (IP-to-household accuracy at 13–16%, Claim 6.x), there is no published commercial model, and there are zero MRC accreditations for in-fabric lift (Claim 5.5) — which together leave no underwritable reason for a cautious buyer to shift budget.\n\nThis sits at the *lower* end of the historical stall band (hyped ad-tech bets fail to generalize perhaps one time in three or four — Privacy Sandbox, most unified-ID, blockchain-in-adtech) because the sound egress/QPS utility floor, three live fabrics, and a real standard make outright abandonment less likely than quiet absorption. A macro ad-spend downturn, or a regulator naming a container fabric, is the most plausible accelerant.\n\n*Watch for:* persistent closed-beta status and tester-roster churn through 2027; no independent performance validation by 2028; no second full DSP joining after Bedrock; and ARTF v2.0 shipping without confidential compute as adoption flatlines.\n\n### 5 — Incumbent-Fabric Capture · 8–13%\n\nContainerization scales, but a hyperscaler or walled garden — Amazon via AWS RTB Fabric plus its donated Dynamic Traffic Engine, or Google — ends up owning the fabric layer, and open-web independents become thin tenants on someone else's metal. The capital and integration advantages are real, and walled-garden share is climbing from ~78% of digital spend toward ~83% by 2027, starving independent SSPs of the spend needed to fund a defended fabric.\n\nThis sits lowest among the \"it scales\" outcomes because of the single sharpest fact in the corpus's revealed-preference reading: AWS RTB Fabric is a managed *network*, not in-exchange co-location, and Amazon donated DTE — a QPS-signalling file format — to IAB Tech Lab specifically to cut auction load *at the protocol layer while keeping the auction in place* (Claim 4.x). That is revealed preference *against* a fabric-landlord pivot, not toward one. This scenario requires Amazon or Google to reverse that posture.\n\n*Watch for:* AWS RTB Fabric moving from managed-network toward true container hosting; Index's owned-metal stance breaking as independent fabrics migrate onto hyperscaler infrastructure; or a hyperscaler acquiring an independent fabric-builder.\n\n---\n\n## Why the forecast splits where it does\n\nThe disagreement was never about survival. Every line of reasoning agrees containerized bidding becomes real open-web infrastructure — the ~80% floor. They split, and the corpus deliberately preserves the split as scenario spread rather than averaging it away, on **who captures the relocated margin.** Three grounded positions diverge. The seat is competed to zero, because portability and SSP-versus-SSP competition commoditize hosting and the margin stays exogenous — the modal read. An independent SSP defends a hosting-and-curation rent, or an incumbent DSP becomes a tenant — the 20–28% read, leaning on doc 05's SSP-dependency and QPS-decoupling logic. Or an integrated incumbent, Amazon or Google, captures it — the 8–13% read. The whole split turns on two facts the corpus cannot settle: whether ARTF portability proves real in production (which would destroy the independent-SSP rent), and whether a confidential-compute/TEE unlock ever ships (which would pull incumbent buy-side budget into the fabrics). Until those resolve, honest spread beats false precision.\n\n---\n\n## The reference classes underneath the numbers\n\nEvery probability above traces to a counted base rate. The load-bearing ones:\n\n| Reference class | What it tells us |\n| --- | --- |\n| **Open-web infra diffusion** (OpenRTB, header bidding, Prebid Server, SPO, identity graphs) | ~4 of ~5 became durable-but-bounded layers; ~1 went dominant-within-domain; almost never universal. Modal = durable material layer, not winner-take-all. |\n| **Absorption refinement** (the contrarian correction) | Of those durable layers, the majority ended as commoditized plumbing absorbed into incumbent stacks *without* a new margin seat — the engine of the modal scenario. |\n| **Walled-garden ceiling** | ~78% of digital spend in 2024, heading to ~83% by 2027. Containerization addresses only open programmatic (~20–30% of spend) — a hard cap on the prize regardless of adoption speed. |\n| **Topology route-arounds** (HB vs waterfall; PMP vs open auction; garden-direct vs open RTB) | Succeeded at *material, not total* scale ~half the time — but PMP clears *through* the auction, so AdCP's at-the-auction's-expense odds sit below that base. |\n| **Hyped launches that stalled** (Privacy Sandbox, most unified-ID, blockchain-in-adtech) vs those that stuck (ads.txt/sellers.json) | ~1-in-3-to-4 fail to generalize; the live fabrics + real standard pull abandonment to the low end. |\n| **Exogenous fee compression** (Amazon DSP ~1%, TTD turned negotiable, non-container Direct Booking Engines) | DSP take was *already* falling before containers — so some margin movement is near-certain but much is exogenous and must not be credited to the architecture. |\n| **Incumbent revealed preference** | TTD/Yahoo/DV360/Amazon absent from open-web fabric tenancy; AWS RTB Fabric is a network not a co-location host; DTE keeps the auction in place. The sharpest single constraint on both Relocation and Incumbent-Capture. |\n| **Confidential compute / TEE in ad tech** (clean rooms, 2021–) | Scaled slowly, stayed niche — the reference class anchoring why a \"TEE-by-2028\" prior near 0.45 is too high (~0.25–0.35 fits), and why the at-scale workload is enrichment, not richer-signal bidding. |\n\n---\n\n## The ten signals that will move this forecast\n\nThe forecast is a probability distribution, not a prediction, and the following observations would shift weight between scenarios. In rough order of information value:\n\n1. **GA transition.** Whether Index Cloud, PubMatic Decision Fabric, and OpenXBuild move from closed beta to general availability with disclosed production volume by 2027–2028 — the highest-information event on the calendar.\n2. **The defended-rent test.** Whether any SSP publishes *and sustains* a containerized-hosting take-rate above 2–3% of routed spend — the cleanest line separating the modal (plumbing) from the relocation (real seat) scenario.\n3. **Incumbent-DSP tenancy.** Any move by TTD, Yahoo, DV360, or Amazon DSP from contributor to corroborated production tenant — shifts mass toward Relocation.\n4. **Confidential compute.** Whether ARTF v2.0 ships a TEE/host-blind provision by ~2027–2028 — the highest-leverage technical unknown; it redeems richer-signal bidding and removes the neutrality conflict at once.\n5. **Incumbent-fabric reversal.** Whether Amazon or Google ships *true* in-fabric hosting that captures open-web bidding volume — moves mass to Incumbent-Capture.\n6. **AdCP trajectory.** Whether AdCP adds a large demand incumbent and ships agent-negotiated deals at volume that *bypass* (not compose with) the auction.\n7. **Independent performance validation.** Any MRC-adjacent or independent incrementality study validating or refuting in-fabric lift — the category is 100% vendor-reported today.\n8. **Portability proof.** A single ARTF container documented running unchanged across two competing fabrics — it defeats the lock-in objection but, paradoxically, *commoditizes the hosting seat*, reinforcing the modal.\n9. **The ANA/Adalytics benchmarks, 2026–2029.** Whether DSP-fee compression tracks container routing specifically, or just the market-wide fee war.\n10. **Regulatory contact.** Any regulator opening an inquiry naming a container fabric or in-exchange data co-location (the FTC's bidstream-data theory; EU AI Act high-risk classification after August 2026).\n\n---\n\n## Open Questions\n\nThe forecast leaves four things genuinely unresolved, and they are the same four the rest of the corpus could not settle. Whether ARTF portability is real in production — the fact that decides whether any independent fabric can defend a rent — is unknown until containers run across competing fabrics at scale. Whether confidential compute ever ships in ARTF is a technical coin-flip weighted toward \"slowly, if at all\" by the clean-room reference class. Whether the relocated margin is causally the architecture's doing or just the pre-existing fee war wearing a new costume cannot be disentangled without a benchmark that isolates container-routed spend. And whether AdCP and ARTF end up rivals or composable layers — the topology question — will not resolve inside this horizon if the first composed transaction keeps not appearing. A reader should treat the modal scenario as the base case and the two unknowns above (portability, TEE) as the switches that would move probability toward Relocation if they flip.\n\n## Method Note\n\nThis forecast begins with a market sweep, then weighs several independent lines of reasoning — each steelmanning a distinct angle (base-rate-first, driver-decomposition, contrarian, discontinuity-first) — against one another, weighting each position by *surviving grounding* rather than averaging them. No liquid prediction market exists on the question, so probabilities rest on reference-class M-of-N counts and Fermi decomposition. Scrutiny defeated three initial positions: the driver-decomposition view's 27–37% Relocation read (its \"routes-through-containers\" factor double-counted the exogenous fee war; cut to 20–28%); an AdCP read inflated by the PMP=81.6% anchor (PMP clears through the auction; cut to 11–17%); and a discontinuity read with an over-eager TEE-by-2028 S-curve (trimmed on the clean-room class and the doc-04 revealed-preference evidence). The geometric mean of odds on the modal sits at 0.41.\n\n## Sources\n\nThe forecast is grounded in the verified corpus rather than new research. Its evidence base is the eight reference classes above and the current-state and driver findings in the pillar documents — principally `01_Origins_and_Evolution.md` (the diffusion history), `04_Market_and_Competitive_Map.md` (the live fabrics and incumbent revealed preference), `05_Performance_and_Commercial_Model.md` (the margin waterfall, the exogenous fee war, the absent price card), and `06_Risks_and_Contested_Claims.md` (the sandbox limit, the identity substrate, the walled-garden ceiling). Full citations live in those documents and in `Sources.md`; the prediction-market sweep (Polymarket, Kalshi, Manifold, Metaculus, 2026-06-20) returned no liquid market on the question or any decomposition."}], "glossary": [{"term": "AAMP", "aliases": ["Agentic Advertising Management Protocols"], "def": "The umbrella brand under which the industry's ad-tech standards body groups all of its work on AI-agent buying, of which the container-hosting framework (ARTF) is just one piece."}, {"term": "ACR", "aliases": ["Automatic Content Recognition"], "def": "A feature built into many smart TVs that samples what's on screen to identify the show or channel being watched, letting advertisers target and measure ads based on real viewing rather than guesswork."}, {"term": "AdCOM", "aliases": ["Ad Common Object Model"], "def": "A shared data dictionary that defines the common terms and fields used inside real-time ad-auction messages, so different companies' systems describe the same things the same way."}, {"term": "AdCP", "aliases": ["Ad Context Protocol"], "def": "A rival standard to the container-hosting approach that lets AI buying and selling agents negotiate ad deals directly with each other, potentially skipping the traditional auction altogether and shifting more money toward publishers."}, {"term": "Agent service", "aliases": ["agent services"], "def": "In the container-hosting framework, any specialized piece of software packaged to run inside an exchange's computers — for example a program that resolves who a user is, checks for fraud, adds contextual signals, or bids on an ad."}, {"term": "AGPL-3.0", "aliases": [], "def": "A type of open-source software license; code released under it can be freely used and modified, but any service built on it must also share its own source code."}, {"term": "ARTF", "aliases": ["Agentic Real-Time Framework", "Agentic RTB Framework"], "def": "The advertising industry's official technical standard for packaging a buyer's decision-making software as a sealed container that runs inside a seller's own computers, right next to the auction, instead of talking to it over the internet."}, {"term": "Bid duplication", "aliases": ["bid-duplication"], "def": "A long-standing problem in online ad auctions where the same ad opportunity gets offered to a buyer through several different paths at once, so the buyer risks bidding against itself and driving its own price up."}, {"term": "Bid request", "aliases": ["bid requests"], "def": "The message a seller's system sends out describing an available ad opportunity — the webpage, the user's browser and device details, the ad sizes available — so buyers can decide whether and how much to bid."}, {"term": "Bid shading", "aliases": ["BID_SHADE"], "def": "A technique for lowering a bid slightly below what a buyer would actually be willing to pay, based on a prediction of the lowest price likely to still win, so the buyer doesn't overpay in auctions where it would have won anyway."}, {"term": "Bidstream", "aliases": ["bid stream"], "def": "The continuous flow of bid requests and responses moving between sellers and buyers across the advertising industry at any given moment — essentially the live river of ad-auction data."}, {"term": "Clean room", "aliases": ["clean rooms", "data clean room"], "def": "A controlled environment where two companies can jointly analyze their combined customer data to get useful results, without either company actually seeing the other's raw underlying data."}, {"term": "Cloud egress", "aliases": ["egress", "egress fees"], "def": "The fee a cloud computing provider charges every time data leaves its network and travels out to the internet or to another provider, which becomes a major recurring cost when billions of ad requests are shipped back and forth every day."}, {"term": "Confidential compute", "aliases": ["Trusted Execution Environment", "TEE", "TEEs"], "def": "A hardware-based security technology that lets code process sensitive data while keeping that data encrypted even while it's being used, so that not even the owner of the computer it's running on can see it — the strongest technical guarantee of secrecy currently available."}, {"term": "Container", "aliases": ["OCI container", "Docker container", "containers", "containerized"], "def": "A self-contained, portable package of software — code, its dependencies, and settings — that can run unchanged on someone else's computer, the same technology that powers most modern cloud applications; in advertising, it lets a buyer's bidding program run physically inside a seller's data center."}, {"term": "Contextual targeting", "aliases": ["contextual", "contextual classification"], "def": "Choosing which ads to show based on the content of the page or show a person is viewing — its topic, genre, or quality — rather than based on who that person is."}, {"term": "CPA", "aliases": ["cost per acquisition"], "def": "A measure of advertising efficiency: how much money was spent, on average, to generate one desired outcome such as a purchase, sign-up, or store visit — lower is considered better."}, {"term": "CPM", "aliases": ["cost per thousand impressions", "cost per mille"], "def": "The price an advertiser pays for one thousand views of an ad, the standard pricing unit in digital and TV advertising."}, {"term": "Curation", "aliases": ["curated deals", "curation platform"], "def": "The practice of a middle-layer company pre-filtering and packaging a subset of available ad inventory — chosen for quality or fit — into a more targeted, ready-to-buy bundle for advertisers, rather than exposing the entire raw marketplace."}, {"term": "Deal ID", "aliases": ["deal IDs"], "def": "A code that identifies a specific, pre-negotiated arrangement between a buyer and seller for particular ad inventory, letting that inventory be bought on agreed terms rather than through a fully open auction."}, {"term": "Demand-side platform", "aliases": ["DSP", "DSPs"], "def": "Software that advertisers and their agencies use to automatically buy ad space across many different websites, apps, and streaming services in real time."}, {"term": "DOOH", "aliases": ["Digital Out-of-Home"], "def": "Digital advertising screens in public places — billboards, transit displays, screens in stores — that can be bought and updated programmatically like online ads."}, {"term": "Egress lockdown", "aliases": ["egress prohibition", "no external network access"], "def": "A security rule in the container-hosting standard that forbids a hosted buyer's program from sending any data back out to the internet, so whatever it learns while running inside a seller's system can never be secretly extracted."}, {"term": "First-party data", "aliases": ["buy-side data", "buyer's first-party data"], "def": "Information a company collects directly from its own customers — such as purchase history or account details — as opposed to data purchased or gathered from outside sources."}, {"term": "GDPR", "aliases": [], "def": "The European Union's comprehensive law governing how companies may collect, use, and store people's personal data, with substantial fines for violations."}, {"term": "Global Media Sustainability Framework", "aliases": ["GMSF"], "def": "An industry-developed standard method for calculating the carbon emissions caused by advertising campaigns across digital, TV, print, and other media, so companies can measure and report a comparable number."}, {"term": "gRPC", "aliases": [], "def": "A fast, efficient method computer systems use to call functions on each other over a network, generally quicker than the more common web-request format used by older ad-auction systems."}, {"term": "Header bidding", "aliases": [], "def": "A technique, introduced around 2014, that lets a publisher's webpage ask several ad exchanges to bid on an ad space at the same time before the page finishes loading, replacing an older system where exchanges were offered the space one at a time in sequence."}, {"term": "HEM", "aliases": ["hashed email"], "def": "An email address that has been run through a one-way scrambling process so it can be matched against other scrambled versions of the same address without ever exposing the actual email — used as a privacy-preserving way to recognize the same person across different ad platforms."}, {"term": "Holdout", "aliases": ["holdout test", "holdout design"], "def": "A way of testing whether an advertising technique actually works by withholding it from a randomly chosen slice of the audience and comparing outcomes against the group that received it — done independently, it's convincing; done by the company selling the technique, it's a much weaker form of evidence."}, {"term": "IAB", "aliases": ["Interactive Advertising Bureau"], "def": "The advertising industry's main trade association, which develops and promotes shared technical standards for digital advertising."}, {"term": "IAB Tech Lab", "aliases": ["Tech Lab"], "def": "The technical standards-setting arm of the advertising industry's main trade association, responsible for creating and maintaining the common protocols — including the real-time bidding standard and the container-hosting framework — that let different companies' ad systems talk to each other."}, {"term": "Identity resolution", "aliases": [], "def": "The process of figuring out that separate pieces of data — a device, a browser cookie, an email address — all belong to the same real person or household, so advertisers can target and measure consistently across different screens and sessions."}, {"term": "Impression", "aliases": ["impressions"], "def": "One single instance of an ad being shown to one person on one page, app, or screen — the basic unit that most digital advertising is bought and sold in."}, {"term": "In-housing", "aliases": ["in-house agency", "in-house programmatic buying"], "def": "The practice of a brand building its own internal team and technology to buy advertising directly, rather than paying an outside advertising agency to do it."}, {"term": "Jevons paradox", "aliases": ["Jevons-paradox rebound", "rebound effect"], "def": "An economic pattern where making something more efficient to use — and therefore cheaper — causes people to use so much more of it that total consumption rises rather than falls, even though each individual use now costs less."}, {"term": "Kubernetes", "aliases": [], "def": "A widely used open-source system for automatically deploying, managing, and scaling large numbers of software containers across many computers at once."}, {"term": "Last look", "aliases": [], "def": "A now-discontinued advantage Google's ad exchange gave itself, in which it could see the highest bid from every competing exchange and then beat it by a fraction of a cent before the auction closed."}, {"term": "Latency", "aliases": ["latency tax"], "def": "The delay caused by data having to travel across a network from one computer to another and back — in real-time ad auctions, every millisecond of delay eats into the tiny time window a buyer has to decide whether to bid."}, {"term": "MCP", "aliases": ["Model Context Protocol"], "def": "An open technical standard, created by the AI company Anthropic, that lets AI-agent software connect to outside tools, data sources, and services in a consistent way; a rival ad-buying protocol is built on top of it."}, {"term": "MRC", "aliases": ["Media Rating Council"], "def": "A US nonprofit organization that independently audits and certifies the methods advertising companies use to measure things like viewability and fraud — its seal of approval is one of the few outside checks the ad industry has."}, {"term": "Mutation", "aliases": ["OpenRTB Patch"], "def": "In the container-hosting standard, a small, itemized proposed change to an ad auction's bid — such as adding an audience segment or adjusting a price floor — that a hosted program suggests but does not have the power to apply on its own; the host decides whether to accept it."}, {"term": "OCI", "aliases": ["Open Container Initiative"], "def": "The industry-wide technical standard that defines the file format for software containers, ensuring any container built to the standard can run on any compatible system — the same standard behind the widely used Docker software."}, {"term": "OpenRTB", "aliases": ["Open Real-Time Bidding"], "def": "The open technical standard, created in 2010, that defines how ad sellers and ad buyers exchange auction messages over the internet — the common language nearly all real-time digital ad auctions are still built on."}, {"term": "Passback", "aliases": [], "def": "In the older sequential ad-selling system, the act of an ad network or exchange declining an available ad slot and handing it down to the next network in line."}, {"term": "Prebid.js", "aliases": ["Prebid Server", "Prebid.org"], "def": "A widely used free, open-source software system that lets publishers solicit bids from many ad exchanges simultaneously, either running in the visitor's web browser or, later, moved into a data center for speed."}, {"term": "Principal media", "aliases": [], "def": "A business practice where an advertising agency buys ad inventory itself, taking on the financial risk as the actual purchaser, and then resells it to its clients — a departure from the traditional role of an agency simply acting on the client's behalf."}, {"term": "Programmatic advertising", "aliases": ["programmatic"], "def": "The automated buying and selling of digital advertising space through software and real-time auctions, rather than through direct human negotiation."}, {"term": "PUE", "aliases": ["power-usage effectiveness"], "def": "A standard measure of how efficiently a data center uses electricity, comparing total power drawn against the power actually used by computing equipment."}, {"term": "QPS", "aliases": ["queries per second"], "def": "The rate at which a seller's system sends bid requests to a buyer's system; because evaluating each request costs money, buyers cap how many they'll accept, meaning they only ever see a fraction of the available ad opportunities."}, {"term": "REC", "aliases": ["Renewable Energy Certificate", "RECs/PPAs"], "def": "A certificate a company can buy to claim credit for an amount of renewable electricity generated somewhere on the grid, even if the actual power running its own servers at any given moment comes from fossil fuels."}, {"term": "ROAS", "aliases": ["return on ad spend"], "def": "A measure of advertising payoff: how much revenue was generated for every dollar spent on ads — for example, a 5x ROAS means five dollars of attributed revenue per dollar spent."}, {"term": "RTB", "aliases": ["real-time bidding"], "def": "The practice of auctioning off a single ad slot — for one specific user, on one specific page load — in the fraction of a second while a webpage or app screen is loading."}, {"term": "Sandbox", "aliases": ["sandboxed execution", "sandboxing"], "def": "A restricted, isolated environment in which a piece of software can run and see only a limited, controlled set of data, unable to access anything outside its boundaries — used to describe today's container deployments, which let a buyer's model run inside a seller's system but only see the signals the seller chooses to expose."}, {"term": "Supply-path optimization", "aliases": ["SPO"], "def": "A buy-side practice of deliberately narrowing down the many possible routes to reach a given ad opportunity to just a handful of trusted, efficient sellers, rather than transacting through every available intermediary."}, {"term": "Supply-side platform", "aliases": ["SSP", "SSPs"], "def": "Software that publishers use to offer and sell their available ad space to many buyers at once through automated auctions."}, {"term": "Take-rate", "aliases": ["take rate"], "def": "The cut of an advertiser's spending that a middleman company keeps for itself before the rest reaches the publisher — for example, if an advertiser spends a dollar and the publisher gets 80 cents, the combined take-rate of everyone in between is 20 percent."}, {"term": "TCF", "aliases": ["Transparency and Consent Framework"], "def": "A technical standard used across the digital advertising industry, mainly in Europe, for recording and sharing a user's privacy consent choices between different companies."}, {"term": "Tmax", "aliases": ["`tmax`"], "def": "A setting in the standard ad-auction message format that specifies the maximum number of milliseconds a seller's system will wait for a buyer's bid before closing the auction without it."}, {"term": "UID2", "aliases": ["Unified ID 2.0"], "def": "An industry identity system built on hashed email addresses that lets advertisers recognize and target the same person across different websites and apps without relying on traditional tracking cookies."}, {"term": "VAST", "aliases": ["Video Ad Serving Template"], "def": "A technical standard that defines how video ads are packaged and delivered to video players, used across online video and connected-TV advertising."}, {"term": "Viewability", "aliases": [], "def": "A measure of whether an ad actually had a genuine opportunity to be seen by a real person on their screen, as opposed to loading somewhere off-screen or being served to a bot."}, {"term": "Walled garden", "aliases": ["walled gardens"], "def": "A large advertising platform — such as the biggest search, social, or e-commerce companies — that runs its own closed, self-contained ad auction and does not open its inventory or data to outside buying tools the way the open web does."}, {"term": "Waterfall", "aliases": ["daisy chain"], "def": "An older method of selling unsold ad space in which ad networks and exchanges were offered the opportunity one at a time, in a fixed ranked order, rather than all competing for it simultaneously."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme
const themePref = localStorage.getItem('corpus-theme');
if (themePref) document.documentElement.dataset.theme = themePref;

  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];

function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });

}

const synth = window.speechSynthesis;

          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')

  if (!vs.length) return;
  vs.sort((a, b) => {

    return rank(a) - rank(b);

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain

// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)

  function restore() {
    try { var v = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (v && isFinite(v.s) && isFinite(v.x) && isFinite(v.y) && v.s > 0) { view.s = v.s; view.x = v.x; view.y = v.y; return true; }
    } catch (e) {}
    return false;
  }
  // Is enough of the map on-screen? Guards a saved view that lands off-stage when
  // the Atlas is reopened (or resized) at a very different viewport size.
  function enoughVisible() {
    if (!DATA || !DATA._b) return true;
    var b = DATA._b, sw = stage.clientWidth, sh = stage.clientHeight;
    var L = view.x + b.x * view.s, T = view.y + b.y * view.s,
        Rr = view.x + (b.x + b.w) * view.s, B = view.y + (b.y + b.h) * view.s;
    return view.s > 0 && (Math.min(Rr, sw) - Math.max(L, 0) >= 60) && (Math.min(B, sh) - Math.max(T, 0) >= 60);
  }
  function zoomAt(px, py, f) {
    var ns = Math.max(0.22, Math.min(9, view.s * f)), k = ns / view.s;
    view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = ns; apply(); save();
  }
  function fit() {
    if (!DATA || !DATA._b) return;
    var b = DATA._b, sw = stage.clientWidth, sh = stage.clientHeight, pad = 46;
    var s = Math.max(0.22, Math.min(9, Math.min((sw - pad * 2) / b.w, (sh - pad * 2) / b.h)));
    view.s = s; view.x = (sw - (2 * b.x + b.w) * s) / 2; view.y = (sh - (2 * b.y + b.h) * s) / 2; apply(); save();
  }

  function load() {
    if (loading) return; loading = true;
    fetch(base + 'atlas.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) {
        DATA = j; buildPick();
        var sm = ''; try { sm = localStorage.getItem('atlas-pick') || ''; } catch (e) {}
        if (sm && j.connections && j.connections[sm]) mode = sm;
        paint(true); loaded = true; if (msg) msg.remove(); syncPick(); updateSub();
      })
      .catch(function () { if (msg) msg.textContent = 'The Atlas needs to load its map data — open it on the live site (calvincollins.xyz).'; });
  }

  // The research picker turns the Atlas from a single mosaic into a per-corpus
  // explorer: pick a work and the map redraws as that corpus's intellectual world.
  function buildPick() {
    if (!pick || !DATA) return;
    var conn = DATA.connections || {}, seen = {}, opts = '<option value="">✦ All corpora — the mosaic</option>';
    (DATA.places || []).filter(function (p) { if (seen[p.slug] || !conn[p.slug]) return false; seen[p.slug] = 1; return true; })
      .map(function (p) { return { slug: p.slug, title: p.title }; })
      .sort(function (x, y) { return x.title.localeCompare(y.title); })
      .forEach(function (it) { opts += '<option value="' + esc(it.slug) + '">' + esc(it.title) + '</option>'; });
    pick.innerHTML = opts;
  }
  function syncPick() { if (pick) pick.value = mode; }
  function setMode(m) {
    if (!DATA) return;
    m = m || ''; if (m && !(DATA.connections && DATA.connections[m])) m = '';
    if (m === mode) { syncPick(); return; }
    mode = m; try { localStorage.setItem('atlas-pick', mode); } catch (e) {}
    hideCard(); paint(true); syncPick(); updateSub();
  }
  function updateSub() {
    var sub = back && back.querySelector('#atlas-sub'); if (!sub) return;
    var C = (mode && DATA && DATA.connections && DATA.connections[mode]) ? DATA.connections[mode] : null;
    if (C) sub.textContent = C.home.name + '’s intellectual world — ' + C.nodes.length + ' geographic connections. Hover a place to trace its thread.';
    else sub.textContent = 'Pick a research above to trace its intellectual world — or roam the mosaic of every corpus. Drag to pan, scroll to zoom.';
  }

  // Repaint the whole surface for the active mode. Cheap enough to rebuild wholesale.
  function paint(doFit) {
    if (!DATA) return;
    var j = DATA, C = (mode && j.connections && j.connections[mode]) ? j.connections[mode] : null;
    var s = '<svg id="atlas-svg" viewBox="' + j.viewBox + '" width="' + j.w + '" height="' + j.h
      + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">';
    s += '<defs>';
    for (var rid in j.regions) s += '<clipPath id="ar-' + rid + '"><path d="' + j.regions[rid].d + '"/></clipPath>';
    if (!C) j.places.forEach(function (p) { var c = p.cell;
      s += '<clipPath id="ac-' + p.slug + '"><rect x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3] + '"/></clipPath>'; });
    else s += '<clipPath id="ahome"><circle cx="' + C.home.x + '" cy="' + C.home.y + '" r="58"/></clipPath>';
    s += '</defs>';
    s += '<g id="atlas-grat">'; (j.graticule || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += '<g id="atlas-bd">'; (j.backdrop || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += C ? connLayer(C) : placesLayer(j);
    s += '</svg>';
    world.innerHTML = s;
    bySlug = {};
    computeBounds(C);
    if (C) wireConn(C); else wirePlaces(j);
    if (doFit === false) { apply(); return; }
    if (!C && restore()) { apply(); if (!enoughVisible()) fit(); }
    else fit();
  }

  function placesLayer(j) {
    var s = '<g id="atlas-places">';
    j.places.forEach(function (p) {
      var c = p.cell;
      s += '<g class="atlas-place" data-slug="' + esc(p.slug) + '"><g clip-path="url(#ar-' + p.region + ')">';
      if (p.img) { var href = esc(base + p.img);
        s += '<image class="atlas-img" href="' + href + '" xlink:href="' + href + '" x="' + c[0] + '" y="' + c[1]
          + '" width="' + c[2] + '" height="' + c[3] + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac-' + p.slug + ')"/>'; }
      s += '<rect class="atlas-ring" x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3]
        + '" clip-path="url(#ac-' + p.slug + ')" fill="none" stroke="' + esc(p.accent) + '" stroke-width="3"/>';
      s += '</g></g>';
    });
    s += '</g><g id="atlas-lines">';
    for (var r2 in j.regions) { var R = j.regions[r2];
      s += '<path class="atlas-rgn" d="' + R.d + '"/>';
      (R.dividers || []).forEach(function (d) {
        s += '<line class="atlas-div" x1="' + d[0] + '" y1="' + d[1] + '" x2="' + d[2] + '" y2="' + d[3] + '" clip-path="url(#ar-' + r2 + ')"/>'; });
    }
    s += '</g>';
    return s;
  }

  function arcPath(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = Math.min(170, len * 0.16), cx = mx - dy / len * off, cy = my + dx / len * off;
    return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  function clipText(t, n) { t = t || ''; return t.length > n ? t.slice(0, n - 1).replace(/[\s,;:&/-]+$/, '') + '…' : t; }
  function connLayer(C) {
    var ac = esc(C.home.accent || '#b3502f'), H = C.home, R = 58;
    var s = '<g id="atlas-lines">';
    for (var rid in DATA.regions) s += '<path class="atlas-rgn" d="' + DATA.regions[rid].d + '"/>';
    s += '</g>';
    s += '<g id="atlas-threads" stroke="' + ac + '">';
    C.nodes.forEach(function (n, i) { s += '<path class="atlas-thread" data-i="' + i + '" d="' + arcPath(H.x, H.y, n.x, n.y) + '"/>'; });
    s += '</g>';
    // home badge drawn UNDER the place nodes, so their dots + labels are never masked
    s += '<g class="atlas-home">';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + (R + 6) + '" fill="var(--bg)"/>';
    if (H.img) { var href = esc(base + H.img);
      s += '<image href="' + href + '" xlink:href="' + href + '" x="' + (H.x - R) + '" y="' + (H.y - R) + '" width="' + (2 * R) + '" height="' + (2 * R) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ahome)"/>'; }
    else s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="' + ac + '"/>';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="none" stroke="' + ac + '" stroke-width="4.5"/>';
    s += '<text class="atlas-hlabel" x="' + H.x + '" y="' + (H.y + R + 33) + '" text-anchor="middle" fill="' + ac + '">' + esc(H.name) + '</text>';
    s += '</g>';
    s += '<g id="atlas-cnodes">';
    C.nodes.forEach(function (n, i) {
      // splay each label outward from home so the European cluster doesn't pile up
      var dx = n.x - H.x, dy = n.y - H.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var lx = n.x + dx / L * 15, ly = n.y + dy / L * 15 + (dy >= 0 ? 16 : -8);
      var anchor = dx > 30 ? 'start' : (dx < -30 ? 'end' : 'middle');
      s += '<g class="atlas-cnode" data-i="' + i + '">';
      s += '<circle class="atlas-chalo" cx="' + n.x + '" cy="' + n.y + '" r="17" stroke="' + ac + '" fill="none"/>';
      s += '<circle class="atlas-cdot" cx="' + n.x + '" cy="' + n.y + '" r="9" fill="' + ac + '"/>';
      s += '<text class="atlas-clabel" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(clipText(n.name, 30)) + '</text>';
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function computeBounds(C) {
    var X0 = 1e9, Y0 = 1e9, X1 = -1e9, Y1 = -1e9;
    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      DATA.places.forEach(function (p) { bySlug[p.slug] = p; var c = p.cell;
        X0 = Math.min(X0, c[0]); Y0 = Math.min(Y0, c[1]); X1 = Math.max(X1, c[0] + c[2]); Y1 = Math.max(Y1, c[1] + c[3]); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
