sing framework.\" https://www.thecurrent.com/marketing-strategy-iab-tech-lab-adcp-agentic-advertising-framework-ai (accessed 2026-06-20). *Heimlich \"standardize something unproven.\"*\n5. Adweek, \"IAB Launches Technical Standard for Faster, AI Agent-Friendly Ad Auctions.\" https://www.adweek.com/media/iab-tech-lab-ai-agentic-rtb-framework/ (accessed 2026-06-20; partial via excerpt). *CTV clean-room angle; backer list.*\n6. Digiday, \"For the agentic-curious: WTF is the Agentic RTB Framework?\" Nov 2025. https://digiday.com/marketing/for-the-agentic-curious-wtf-is-the-agentic-rtb-framework/ (accessed 2026-06-20). *\"400–600ms → a fraction\"; CTV-seller clean-room.*\n7. Index Exchange, \"What Is the Agentic Real-Time Framework (ARTF)?\" indexexchange.com/index-explains (accessed 2026-06-20). **Conflict: SSP and ARTF co-author/host beneficiary.** *\"Up to 95%\" / \"under 10ms\"; \"run logic locally in the same data center.\"*\n9. MarTech, \"IAB Tech Lab unveils Agentic RTB Framework…,\" Nov 13, 2025. https://martech.org/iab-tech-lab-unveils-agentic-rtb-framework-to-boost-real-time-ad-trading-efficiency/ (accessed 2026-06-20). *Source of \"600–800ms → ~100ms,\" explicitly attributed \"According to the Tech Lab.\"*\n15. ARTF Specs, \"Technical Specs.\" https://artf.ai/technical-specs (accessed 2026-06-20). *gRPC/protobuf; OpenRTB Patch; \"coexist with not replace OpenRTB\"; \"400–800 ms → ~100 ms.\"*\n27. Digiday, \"WTF is Ad Context Protocol (AdCP)?,\" Oct 15, 2025. https://digiday.com/media-buying/wtf-ad-context-protocol/ (accessed 2026-06-20). *AdCP definition; buyer agent ↔ publisher agent direct negotiation; margin toward publishers; built on MCP/A2A.*\n28. PubMatic, \"Moving Beyond AdCP vs ARTF: How Both Power Agentic Advertising.\" https://pubmatic.com/blog/moving-beyond-adcp-vs-artf-understanding-their-roles-in-agentic-advertising/ (accessed 2026-06-20). **Conflict: PubMatic sits in both camps.** *Application-layer vs transaction-layer; \"coexistence without fragmenting the market.\"*\n29. Samba TV / mobilemarketingreads, AdCP launch coverage and founding/supporting member list; coalition forming non-profit governance. https://www.samba.tv/press-releases/industry-coalition-launches-ad-context-protocol-adcp-open-standard-for-agentic-advertising-infrastructure and https://www.mobilemarketingreads.com/ad-context-protocol-adcp-launch/ (accessed 2026-06-20). *Founding members Optable, PubMatic, Scope3, Swivel, Triton, Yahoo; \"no single company controls the protocol's evolution.\"*\n31. IAB UK / IAB Australia roadmap explainers and SmartyAds/MediaPost summaries. https://www.iabuk.com/news-article/future-agentic-understanding-new-standards-ai-digital-advertising (accessed 2026-06-20). *\"Extending… OpenRTB, AdCOM, VAST, GPP, TCF, rather than replacing\"; \"evolution, not revolution\"; roadmap cross-check.*\n32. Broadbrand, \"The Protocol War Between ARTF and AdCP Splits Agentic Adtech.\" https://broadbrand.ai/blog/the-protocol-war-between-artf-and-adcp-splits-agentic-adtech (accessed 2026-06-20). *\"Accelerates the existing pipes, keeps DSPs central\"; AdCP \"seller agents negotiate directly… shifting margin toward publishers\"; \"not a technical disagreement… a fight over who sits in the middle.\" Tier 5 analysis; cross-checked against primary sources for factual claims.*\n\n**Tier 5/6 — Named-analyst commentary (position-evidence; disclosed expertise, personal venues)**\n\n25. Alanna Laforet (CEO, Laforet Productions), \"Ad Tech's Agentic Arms Race Is Solving the Wrong Problem,\" ExchangeWire, Mar 12, 2026. https://www.exchangewire.com/blog/2026/03/12/ad-techs-agentic-arms-race-is-solving-the-wrong-problem/ (accessed 2026-06-20). *\"Wrong problem\" / accountability critique — cite as position.*\n26. Amit Goel (ad-tech analyst), \"The Protocols Are Being Debated. The Agents Haven't Arrived Yet…,\" bidstream.amitgoel.me (Substack), Jun 3, 2026. https://bidstream.amitgoel.me/p/the-protocols-are-being-debated-the (accessed 2026-06-20). *\"Propose vs decide\"; \"zero protocols address measurement.\" Personal Substack — position-evidence, not fact.*"}, {"order": 4, "file": "04_Market_and_Competitive_Map.md", "title": "Market & Competitive Map — Who's Building, Who's Running Inside, Who's Left Out", "summary": "", "body": "# Market & Competitive Map — Who's Building, Who's Running Inside, Who's Left Out\n\n## Bottom Line\n\nAs of mid-2026, containerized bidding has moved from one publisher pilot to a live, three-SSP product category in under a year — but it is still measured in pilots, closed betas, and single-digit named participants, not revenue. **The supply side is building the fabric and selling the seat.** Three independent SSPs now host a buyer's bidding logic inside their own compute: **Index Exchange** (Index Cloud, announced April 21, 2026, closed beta), **OpenX** (OpenXBuild, piloting with Hyundai), and **PubMatic** (Decision Fabric on AgenticOS, launched June 1, 2026). The \"first containerized DSP\" is **Bedrock Platform**, whose bidder went live inside Index Cloud on April 21, 2026 — a structurally important first, but a small, model-driven DSP, not an incumbent. The recurring tenants inside these fabrics are not the big DSPs at all; they are **platform-independent AI-decisioning vendors** — Chalice AI, inPowered AI, Nano Interactive, SWYM.AI — and, increasingly, the **cross-DSP buyer-side intelligence vendor MiQ**, which PubMatic named as a Decision Fabric pilot partner to bring \"buyer-side trading intelligence inside the supply path.\" The major independent DSPs (**The Trade Desk** with Kokai, **Yahoo DSP**) are leaning into *agentic* buying but conspicuously have **not** put their core bidders inside a rival SSP's data center; the walled gardens (**Google DV360, Amazon DSP**) are not running inside open-web SSP fabrics either, and **Amazon's** contribution to the space is the opposite gesture — it *donated* its Dynamic Traffic Engine to IAB Tech Lab (April 15, 2026) to cut QPS waste at the protocol layer rather than co-locate its bidder. **Who keeps the spread?** The early signal is a downward re-rating of the DSP take-rate: a new \"direct DSP / direct-booking\" category, of which Index Cloud is the flagship, competes on \"dramatically lower take rates,\" pushing margin toward publishers and agencies while the SSP captures a new compute-and-hosting position in the middle. The entire map is the most stale-prone material in this account: most of it is six to twelve weeks old, beta-stage, and announced by the participants themselves — adoption is asserted by press release and only thinly corroborated by independent reporting.\n\n---\n\n## How to Read This Map\n\nThese pages answer four questions in order: **who is building the compute fabric, who is running their logic inside it, who is staying out (and why), and who ends up keeping the margin.** This is a market-structure and commercial account. The *plumbing* of how a container executes is taken up earlier, in the chapter on architecture and plumbing, and the *standards politics* (ARTF vs. AdCP, the OpenRTB relationship, the AAMP umbrella) in the chapter on standards and governance. Where the discussion here touches standards, it does so only to locate a participant on the map; the fault-line analysis lives in that standards chapter.\n\nOne framing carried over from the standards chapter is load-bearing here: **containerized bidding is the ARTF-aligned architecture.** It keeps the auction, the bidstream, and the DSP→SSP→exchange chain central and simply moves the compute next to the data. That is why the companies on this map are, almost without exception, the companies that backed ARTF — and why the question \"who keeps the spread\" is not settled by speed alone.\n\nA note on evidence. Almost every \"live\" status below originates in a **company press release or product page** — Tier 1 only for *what the company claims*, never proof of adoption. Where independent trade reporting (AdExchanger, ExchangeWire, Digiday, PPC Land, Adweek, Mi3) corroborates, it is cited alongside. Where it does not, the claim rests on that single source. Read the participant tables as a snapshot of **announced** status as of June 20, 2026 — not audited deployment.\n\n---\n\n## 1. The Fabric Builders — Who Owns the Compute\n\nThe defining move of containerized bidding is that the **SSP becomes the host**. The buyer no longer rents public cloud (AWS/GCP/Azure) and round-trips a bid request over the open internet. Instead the buyer's decisioning runs as a signed container *inside the SSP's own data center*, beside the auction. Three independent SSPs have shipped a version of this. They differ sharply in what runs inside, where the compute physically lives, and who pays for it.\n\n### 1.1 Index Exchange — Index Cloud (the flagship)\n\n**Index Cloud** is Index Exchange's \"proprietary neutral compute environment built inside their global data centers,\" in which \"partners deploy custom models, data, and applications directly within the exchange to run during real-time transactions.\" [1] It was announced **April 21, 2026** and is, per Index's own page, **\"currently in closed beta with select partners.\"** [1] That closed-beta status is the single most important current fact about the flagship: as of mid-2026, Index Cloud is *not* generally available.\n\nWhat makes it distinctive on the map:\n\n- **Index runs its own cloud.** Index Cloud \"is not built on GCP, AWS, or Azure… a cloud we own and operate ourselves rather than a public cloud.\" [1] This is the purest version of the architecture — Index controls the physical metal, so there is no public-cloud egress bill to anyone.\n- **The container is the full unit of buyer logic.** When an opportunity arises, \"a partner's container receives impression-level signals, applies the partner's own logic, and returns a decision, all before the bid request is constructed and sent to DSPs,\" with an execution window \"under five milliseconds.\" [1] Index frames the security boundary tightly: container images are \"cryptographically signed by partners and verified by Index,\" access is \"tightly permissioned,\" and \"DSPs receive decisions only, not the underlying intelligence.\" [1]\n- **Index positions it as the open internet closing the walled-garden performance gap.** CEO Andrew Casale: \"When intelligence moves closer to the impression, the constraints that have historically limited scale begin to fall away.\" [1] In a separate interview he framed today's inefficiency as a \"cloud tax\" and argued containerization lets \"the open internet stop apologizing and start gaining meaningful share\" through performance parity rather than philosophy. [9] Index grounds the product in the standards process: it was \"one of the pioneering companies behind the Agentic Real-Time Framework (ARTF), introduced by the IAB Tech Lab,\" and Index Cloud is \"built in alignment with it.\" [1]\n\nIndex lists six use cases for the fabric — hosted DSP bidders, AI-driven decisioning, audience/signal enrichment, deal activation, contextual/content classification, and impression valuation [1]. That breadth is the tell: Index sees this as a *platform*, not a single bidder feature.\n\n> **A caution on status:** Index Cloud is **closed beta** as of its April 21, 2026 launch [1]. Any claim that it is generally available, or that a named participant is in production rather than testing, would be stale or unsupported. The earliest independent corroboration of the architecture working in market is the **Zillow pilot** (§5.1), which predates the Index Cloud brand name.\n\n### 1.2 OpenX — OpenXBuild (the cloud-native challenger)\n\n**OpenX** repositioned itself as **\"The Intelligent SSP™\"** on **April 14, 2026** [12] and is the second independent SSP with a live containerized-bidding product, **OpenXBuild**. The pilot advertiser is **Hyundai**, which is testing **Chalice AI's** containerized bidding model through OpenXBuild across three models (Tucson, Santa Fe, Palisade) before a planned full-fleet expansion. [11] (Hyundai's CMO Sean Gilpin and OpenX CTO Joel Meyer are the named principals. [11])\n\nOpenX differs from Index in its cloud posture, and therefore in its **cost model**. OpenX is \"the only major SSP or DSP architected entirely in the cloud,\" [12] built on **Google Cloud Platform** — which means OpenX, not the buyer, \"bears the bandwidth expenses\" when a buyer runs a container inside it. [11] CTO Joel Meyer argues this is still a net saving for the system: \"the added costs of buyers operating containers in OpenX's platform is smaller than generally the egress cost of sending the bid requests out to the DSPs.\" [11] That is a genuinely different economic argument from Index's owned-metal model, and it matters for the take-rate question in §6. OpenX is absorbing a public-cloud compute bill in exchange for sitting in the new middle.\n\n> **A caution on status:** OpenXBuild's containerized model is described in market via a **single AdExchanger report** [11] on the Hyundai test; treat the deployment as a **named pilot**, not general availability. OpenX's \"Intelligent SSP\" rebrand is corroborated by its own release and ExchangeWire [12].\n\n### 1.3 PubMatic — Decision Fabric on AgenticOS (the scale player's answer)\n\n**PubMatic** is the largest publicly traded independent SSP to ship a containerized-decisioning layer. On **June 1, 2026** it launched **Decision Fabric**, \"a containerization layer built on AgenticOS that runs partner decisioning models natively inside the programmatic supply path.\" [4][5] **AgenticOS** is PubMatic's broader agentic operating system — \"20+ autonomous agents and 1,000 AI-powered deals\" working across \"2.7 trillion advertiser bids per day\" and \"100,000+ digital properties globally, including 28 of the top 30 streaming platforms.\" [4][5] CEO Rajeev Goel positioned it as the successor to PubMatic's earlier **Activate** product: \"Decision Fabric builds on our success with Activate and gives partner intelligence a native environment inside the supply path.\" [4]\n\nDecision Fabric differs from Index Cloud in three commercially significant ways:\n\n1. **What runs inside is an audience/segment model, not a full bidder.** PubMatic's three-stage process runs *Training* (PubMatic ships a \"privacy-safe sample of exchange-wide bidstream data… more than 60 OpenRTB fields,\" personal data hashed), *Deployment* (partners package models as a \"Docker container image… built on Open Container Initiative specifications,\" response time \"under ten milliseconds\"), and *Activation* (containers \"return a list of segment IDs\" that flow into curated deals). [16] Returning segment IDs into curated deals is a narrower act than Bedrock's full in-exchange bidder, and it leaves the actual DSP auction downstream intact.\n2. **PubMatic explicitly invites DSPs to run inside.** \"For DSPs in particular, Decision Fabric represents a direct entry point into AgenticOS… If a DSP deploys an audience model via container, PubMatic's inventory and audience agents can invoke that model directly to sharpen campaign targeting or surface higher-value deals.\" [4] PubMatic's agents calling a partner's container is a different topology from Index's \"decisions only, not the underlying intelligence\" sandbox. It is collaborative, not arms-length.\n3. **It claims dedicated AI hardware.** PubMatic cites \"GPU-accelerated computing and dedicated AI inferencing servers,\" \"approximately one millisecond inference latency,\" and \"85% fewer auction timeouts.\" [4][5] These are PubMatic's own numbers, unverified independently.\n\nPubMatic frames Decision Fabric as ARTF-native and lock-in-free: it is \"built using the IAB Tech Lab's ARTF open containerisation protocol, enabling partners to deploy once on a standard architecture and operate across PubMatic's full supply footprint without proprietary lock-in.\" [4] That \"deploy once, run across SSPs\" claim is the standards bet that the same container could move between Index Cloud, Decision Fabric, and OpenXBuild — though no source as of mid-2026 documents a single container actually doing so.\n\n> **A discrepancy worth noting:** PubMatic's own release names **four** Decision Fabric pilot partners — **inPowered AI, MiQ, Chalice AI, and SWYM.AI** [4][5]. Independent PPC Land reporting on the same launch describes only **inPowered as \"live today\"** and **Chalice as \"currently in onboarding,\" with no mention of MiQ or SWYM.AI** [16]. The four-partner roster is therefore a **press-release claim of intent**, not four confirmed live integrations. Read MiQ and SWYM.AI as *announced* rather than *running* until independently corroborated.\n\n### 1.4 The fabric-builder comparison\n\n| Fabric | Owner | Launched | Status (Jun 2026) | Where compute lives | What runs inside | Who pays the compute |\n|---|---|---|---|---|---|---|\n| **Index Cloud** | Index Exchange (independent SSP) | Apr 21, 2026 [1] | Closed beta [1] | Index's own data centers (not AWS/GCP/Azure) [1] | Full buyer bidder / models (decision returned pre-bid-request) [1] | Index (owned metal) |\n| **OpenXBuild** | OpenX (independent SSP) | ~Apr 2026 [11][12] | Named pilot (Hyundai) [11] | Google Cloud Platform [11] | Buyer AI decisioning model (e.g., Chalice) [11] | OpenX (absorbs GCP bandwidth) [11] |\n| **Decision Fabric / AgenticOS** | PubMatic (public SSP, PUBM) | Jun 1, 2026 [4] | Pilot, partner roster announced [4][16] | PubMatic infrastructure + GPU inferencing servers [4] | Audience/segment model returning segment IDs [16] | PubMatic (\"no cloud egress costs\") [16] |\n\nThe pattern: **the open-web independents are building the fabric; the walled gardens and the big DSPs are not** (§4). Note too who is *absent* as a fabric-builder. **Magnite**, the largest independent SSP by some measures, has signalled readiness but not shipped a containerized-bidding product of its own (§3.2).\n\n---\n\n## 2. The First Tenant — Bedrock Platform and What \"First Containerized DSP\" Means\n\n**Bedrock Platform** is the flagship's flagship: \"the first DSP to host an instance of its bidder directly inside Index Cloud,\" debuting **April 21–24, 2026.** [1][2][3] PPC Land's framing is the cleanest: Bedrock is \"the first DSP to run its bidder inside an exchange.\" [8]\n\n### 2.1 What Bedrock actually is\n\nBedrock is a **London-headquartered, model-driven DSP** [8] focused on \"model-driven decisioning and efficiency at scale.\" [2] Its co-founder and CEO is **Shane Shevlin**; its head of engineering is **Damian Naglak**. [1][8] It is emphatically *not* an incumbent. It is a small, AI-first buying platform whose entire pitch is that the containerized architecture lets a non-giant compete. Shevlin's line is the thesis statement of the whole category: \"Scale shouldn't be limited to the largest DSPs. By running our bidder closer to the impression, we can participate across a broader share of available opportunities and compete on decisioning and performance rather than infrastructure.\" [1][8]\n\n### 2.2 What \"first containerized DSP\" means — and what it doesn't\n\nThe phrase is doing precise work. It does **not** mean Bedrock invented containers, nor that it was the first buyer-side logic to run inside an SSP (Chalice's algorithm ran inside Index for the Zillow pilot in August 2025 — §5.1). It means Bedrock deployed **its complete decisioning and bidding logic — a full bidder, not just an optimization algorithm or an audience model — directly within the SSP's infrastructure rather than on rented public cloud.** [8] PPC Land puts it cleanly: \"the DSP controls what executes inside\" while \"the exchange provides the environment.\" [8] That distinction — full bidder versus audience-qualification model — is exactly what separates Bedrock-on-Index from the segment-ID model PubMatic's Decision Fabric runs (§1.3).\n\nThe performance and economic mechanics Bedrock claims:\n\n- **No QPS caps.** Engineering head Damian Naglak: \"Throttling existed because processing each bid request — egress, cross-network latency, serialization — carried a real per-request cost.\" [8] Inside the cluster that cost \"drops to near zero,\" so the bidder can \"evaluate every impression on a deal, not a sampled slice.\" [8] Naglak's blunter version: \"The one that matters most: no QPS caps.\" [2]\n- **Decoupling infrastructure spend from market access.** The structural claim, per ExchangeWire and PPC Land, is that historically \"infrastructure spend moved alongside market access — larger DSP budgets meant seeing more supply,\" and containerization \"decouples this relationship,\" so \"independent agencies now access materially broader supply without proportional infrastructure spending.\" [3][8]\n- **Claimed early results.** \"Higher win rates, more consistent delivery, near-lossless bid request handling, significantly lower infrastructure costs.\" [2][8] These are Bedrock/Index figures with no independent holdout; treat as vendor-reported (the holdout caveat is taken up later, in the chapter on performance and the commercial model).\n\n### 2.3 The agency/tester slate around Bedrock\n\nBedrock's launch named a specific early-tester cohort — and this is the part most exposed to staleness:\n\n| Participant | Type | Role in Bedrock/Index Cloud launch | Source |\n|---|---|---|---|\n| **InterMedia Group** | Independent agency | Among \"the first to test the integration\"; SVP Digital David Nyurenberg quoted | [1][2][3] |\n| **Bay Street Media** | Independent agency | Named early tester of the integration | [1][2][3] |\n| **Navigator** | \"Advanced marketing platform\" | Named early tester | [1][2][3] |\n\nDavid Nyurenberg (InterMedia Group SVP Digital) supplies the buy-side rationale: \"This is about enabling AI to actually do its job. In an AI-first world, performance comes down to evaluating and scoring every opportunity in the moment.\" [3][8] These are **named testers in a closed beta**, not disclosed production accounts. They are the highest-decay-risk names on the entire map.\n\n---\n\n## 3. The Participant Slate — Who Runs Inside the Fabrics\n\nStrip away the SSPs and the one full DSP, and the recurring names inside these containers are a small set of **platform-independent AI-decisioning vendors**, plus one **cross-DSP buyer-side intelligence player**. This is the most analytically interesting feature of the map: the tenants are mostly *not* DSPs.\n\n### 3.1 The independent AI-decisioning vendors\n\nThese vendors build a model and run it inside whichever SSP fabric will host it — often more than one. They are the connective tissue of the whole category.\n\n| Vendor | What it does | Where it runs inside (Jun 2026) | Status & source |\n|---|---|---|---|\n| **Chalice AI** | Custom/\"platform-independent AI media decisioning\" (founded by Adam Heimlich) | **Index Cloud** [1]; **OpenXBuild** (Hyundai pilot) [11]; **Decision Fabric** (PubMatic — \"onboarding\") [4][16]; ran the **Zillow** pilot inside Index (Aug 2025) [10][14] | Live across multiple fabrics; the single most-cited tenant. Heimlich is also the sharpest ARTF partisan (discussed in the standards chapter). |\n| **inPowered AI** | Real-time outcome qualification against live bidstream signals (CEO Peyman Nilforoush) | **Index Marketplaces** — \"fastest-growing containerized solution on Index Marketplaces\" (Oct 22, 2025) [13]; **Decision Fabric** — \"live today\" [16] | Live on Index; first active Decision Fabric integration [16]. A Feb 2026 case study claims a 75% cost-per-site-visit reduction for an apparel retailer [8][9]. |\n| **Nano Interactive** | Contextual/audience signal (privacy-first, ID-free targeting) | **Index Cloud** — named launch partner [1] | Named Index Cloud partner [1]; no independent production corroboration as of mid-2026. |\n| **SWYM.AI** | Real-time inventory curation + bid optimization | **Decision Fabric** — named PubMatic pilot partner [4][5] | **Announced only** — not in PPC Land's live/onboarding list [16]. Rests on the PubMatic release alone. |\n\nThe strategic read: **Chalice and inPowered are the category's \"swing tenants.\"** They are platform-independent by design — they will run inside Index, OpenX, *and* PubMatic — which is exactly the \"deploy once, run anywhere\" promise ARTF makes. Their multi-fabric presence is the strongest available evidence that a real, if early, market exists, rather than three isolated proprietary betas.\n\n> **A caution on status:** Nano Interactive and SWYM.AI are each attested **only by the SSP launch release that names them** [1][4]. inPowered's Index status is corroborated by an Index release dated Oct 22, 2025 [13] (eight months old as of mid-2026 — treat with care if cited as current production scale). Chalice is the only tenant corroborated by independent trade reporting across multiple fabrics [10][11][14].\n\n### 3.2 The buyer-side intelligence vendor — MiQ and the cross-DSP players\n\nWhere do the **MiQ-type cross-DSP buyer-side intelligence vendors** fit? The answer arrived June 1, 2026: **MiQ is a named Decision Fabric pilot partner**, described as bringing \"buyer-side trading intelligence inside the supply path, giving one of the world's largest independent trading desks a native environment to optimize outcomes at the moment inventory is available.\" [4][5]\n\nThis is a meaningful structural signal. MiQ's historical business is **cross-DSP** — it sits above multiple DSPs (TTD, DV360, Amazon, Yahoo), buying through all of them and adding intelligence/measurement on top. For such a player, a containerized SSP fabric is attractive for one specific reason: it offers **direct, unmediated access to the full supply pool** without the DSP rationing/QPS throttle, plus a place to run proprietary trading models *beside the auction* rather than from outside it. If buyer-side intelligence migrates from \"a layer above the DSPs\" to \"a container inside the SSP,\" that is a genuine relocation of where cross-DSP value is created — and a reason the DSPs themselves might view the fabric warily (§4).\n\n> **A caution on status:** MiQ's Decision Fabric participation is attested **only by PubMatic's own release** [4][5] and is **not** corroborated by PPC Land's independent account of which partners are live [16]. It rests on that single source; treat as announced intent.\n\n### 3.3 The participant-slate pattern\n\nPut the tenants side by side and the picture is stark: of the named participants running inside SSP fabrics in mid-2026, the count is **one full DSP (Bedrock)**, **four-plus independent AI-decisioning vendors (Chalice, inPowered, Nano Interactive, SWYM.AI)**, **one cross-DSP buyer-side intelligence vendor (MiQ, announced)**, and a **handful of early-tester agencies (InterMedia, Bay Street, Navigator)**. The big DSPs are absent as tenants. That absence is the next section.\n\n---\n\n## 4. The DSPs' Posture — Embrace, Hedge, or Resist\n\nThe central market-structure question is whether the large demand-side platforms will run their bidders inside someone else's exchange — surrendering the independence that is their entire brand — or resist it. As of mid-2026, the honest answer is blunt: **none of the major DSPs has put its core bidder inside a rival open-web SSP's fabric, and several are building agentic capabilities that route around the need to.**\n\n### 4.1 The Trade Desk (Kokai) — agentic, but on its own platform\n\nThe Trade Desk is \"the standard-bearer for the independent DSP market,\" and its independence — \"no owned media means no conflicts\" — is its explicit competitive moat. [6] Its flagship platform **Kokai** is an AI-driven rebuild that \"analyzes more than 15 million ad opportunities per second,\" with early adopters cited at a 26% CPA decrease. [6] TTD is leaning into agentic buying via **Koa Agents** \"within its platform.\" [18][19]\n\nBut that is the point: TTD's agentic story runs **inside Kokai, on TTD's infrastructure** — not inside Index Cloud or Decision Fabric. TTD was a **named contributor to ARTF** (it sits in the Container Project working group [17] and is named in the ARTF launch materials, as the standards chapter details), so it is not boycotting the standard. But contributing to the spec is very different from running your bidder as a tenant in a competitor's data center. **No source as of mid-2026 shows TTD's bidder running inside an SSP fabric.** For the company whose value proposition is independence from supply-side conflicts, doing so would be a brand contradiction — and the early \"direct DSP\" framing (§6) treats lower-take-rate in-exchange buying as a *threat* to TTD's margin, not an offer it has accepted.\n\n### 4.2 Yahoo DSP — embraces the orchestration layer, guards the core\n\n**Yahoo DSP** has been the most forward-leaning incumbent on agentic buying — it \"made waves at CES\" (January 2026) bringing AI agents into its DSP [18][19] and is positioning for \"the agentic era of media-buying when the distinction between DSP and SSP is moot.\" [18] Yahoo pairs with third parties (e.g., Kochava's orchestration) and is \"moving campaign orchestration upstream into a third-party layer.\" [20]\n\nYahoo is **drawing a line at its core**, though. Per Digiday (May 5, 2026), Yahoo embraces external orchestration layers while insisting that \"data, machine-learning-driven decisioning, optimization, and measurement remain proprietary\" and that it stays \"the system of record, responsible for enforcing performance and quality standards.\" [20] Yahoo is also an **AdCP founding member** (see the standards chapter) — it hedges toward the *direct-negotiation* topology, not the containerized-in-exchange one. So the posture is: embrace agentic *workflow*, resist surrendering the *bidder*.\n\n### 4.3 Google DV360 and Amazon DSP — the walled gardens stay walled\n\nNeither walled-garden DSP is running inside an open-web SSP fabric, and their relationship to the open-web container category is oblique:\n\n- **Google DV360** connects to the open-web SSPs (Index, OpenX, PubMatic, Magnite, Yahoo) as a *buyer over OpenRTB* [21] — it is on the other end of the wire, not inside the box. Google's own performance edge has always come from co-locating data and compute inside its *own* stack; it has no incentive to run DV360 inside a competitor's exchange.\n- **Amazon's** posture is the most telling. Rather than co-locate a bidder, Amazon **donated its Dynamic Traffic Engine (DTE) to IAB Tech Lab as open source on April 15, 2026** — a \"file-based signaling system\" that lets DSPs \"communicate bidding priorities directly to supply-side platforms,\" cutting QPS waste at the *protocol* layer. [7][22] IAB Tech Lab CEO Anthony Katsur framed it as addressing \"the industry's QPS waste and escalating infrastructure costs\" so \"every bid request represents a high-value opportunity\"; Amazon's Pieter de Zwart described \"shifting from guessing to knowing.\" [22] This is a **different bet than containerization**. DTE attacks the same QPS-waste problem from the buy side, by sending *fewer, better* requests over the wire, rather than by moving the bidder *into* the SSP. Amazon — and the largest DSPs — is, in effect, proposing the auction stay where it is and get smarter, not relocate compute inside the exchange. **Amazon, TTD, and DV360 are all absent from the AdCP coalition** too (as the standards chapter notes): the incumbents are hedging against *both* topologies that threaten the existing DSP middle.\n\n### 4.4 The DSP posture summarized\n\n| DSP | Agentic posture | Bidder inside an SSP fabric? | ARTF / standards stance | Source |\n|---|---|---|---|---|\n| **The Trade Desk** | Koa Agents inside Kokai; independence as moat | **No** | ARTF Container Project contributor; not an AdCP member | [6][17][18] |\n| **Yahoo DSP** | Most forward; agents at CES; embraces orchestration layer | **No** — guards core decisioning | **AdCP** founding member (direct-negotiation hedge) | [18][20] |\n| **Google DV360** | Buys open web over OpenRTB; agentic inside Google stack | **No** | Not in AdCP; own walled compute | [21] |\n| **Amazon DSP** | Donated DTE to cut QPS waste at protocol layer | **No** | Contributes bidstream-efficiency tooling, not a tenant | [7][22] |\n\nThe headline: **the buyer-side incumbents are building agentic capability without becoming tenants.** The companies that *do* run inside the fabrics are the small DSP (Bedrock), the independent decisioning vendors, and the cross-DSP intelligence player — exactly the participants for whom QPS throttling and infrastructure cost were binding constraints, and for whom independence-from-supply was never the brand promise.\n\n---\n\n## 5. The Publisher Side — Why the Demand-Side Story Started With a Publisher's Problem\n\nContainerized bidding is usually told as a DSP/SSP story. But the **first live, independently reported deployment was a publisher-quality use case** — and it predates every product brand on this map.\n\n### 5.1 Zillow's containerized RTB pilot (the origin proof point)\n\nIn **August 2025**, real-estate platform **Zillow** became \"the first brand advertiser to test… containerized real-time bidding.\" [10][14] The configuration: Zillow's agency **Canvas Worldwide** ran **Chalice Custom Algorithms'** ad-buying model **inside Index Exchange's servers**, eight months before the \"Index Cloud\" name existed. [10][14] AdExchanger's August 6, 2025 reporting is the earliest independent corroboration that the architecture works in market. [14]\n\nHere is what the publisher-side mechanism actually delivers. Running inside the SSP grants access to **granular site-level signals unavailable in a standard OpenRTB bidstream** — \"ad ratios, audio settings, refresh rates, video content length, scroll behavior, and vendor call frequency.\" [14] Zillow's VP of Media Ed Wild wanted environments \"where we are proud to show up,\" and reframed the value as **quality over price**: \"the most direct programmatic metrics — the CPM and the twin stars reach and frequency — can be awfully misleading,\" and the company saw \"better returns by reaching people in those trustworthy places.\" [14] Canvas VP Sally Lee added the operational case: AI curation can \"dynamically add new sites to the inclusion list\" rather than rely on static lists, \"since millions of new sites are added to the web every week.\" [14]\n\n### 5.2 What publishers gain\n\nThe publisher-side value of the architecture is distinct from the buyer-side QPS story:\n\n- **Premium-environment buyers can finally *see* premium signals.** A static inclusion list cannot keep pace with the web; running a buyer model inside the SSP lets it score the *actual* page environment (ad load, autoplay behavior, refresh) at impression time. This rewards high-quality publishing environments that \"resist programmatic optimization tactics like excessive ad loading or muted autoplay videos.\" [10]\n- **Yield retention.** Across the category, the explicit pitch is that \"publishers retain more yield\" as the ad-tech tax falls (§6). [15]\n- **It is the cleanest answer to the \"garbage in\" critique.** The Hyundai/OpenX case makes the same point from the advertiser side: Hyundai prioritizes \"identifying high-intent buyer pools over lowest CPMs\" and \"retains IP ownership of targeting models,\" avoiding reliance on platform-provided solutions like Google's Performance Max. [11]\n\n> **A caution on status:** The Zillow pilot is a **2025 pilot** — independently reported [14] but a pilot, not a permanent program. Canvas was reportedly running the same technology with \"one undisclosed car brand\" [14]. Whether Zillow has scaled, paused, or productionized this since August 2025 is **not** documented as of mid-2026; treat it as a landmark pilot, not current-state scale.\n\n---\n\n## 6. Who Keeps the Spread — The Value-Chain Relocation\n\nThis is the question that matters most. Containerized bidding does not change *who is eligible* to bid; the architecture \"does not change how the auction operates or which DSPs are eligible to compete,\" preserving \"the independent roles of DSPs, SSPs, agencies, and media owners.\" [8] What it changes is **where compute happens, and therefore where margin can be extracted.** Three seats shift.\n\n### 6.1 The SSP captures a new compute-and-hosting position in the middle\n\nBy hosting the buyer's logic, the SSP becomes \"not just an SSP but the compute and data environment within which AI-driven programmatic decisioning happens.\" [16] This is the single clearest margin-relocation claim: the SSP adds a **new layer of value** (and potential lock-in) by being the landlord of the compute. Index owns the metal; OpenX absorbs the GCP bill; PubMatic touts \"no cloud egress costs, no third-party dependencies.\" [16] Whether SSPs monetize the seat as a hosting fee, a curation/deal take, or a bundled service is **not yet disclosed** in any source. The commercial model is the biggest open question (taken up later, in the chapter on performance and the commercial model).\n\n### 6.2 The DSP take-rate gets re-rated downward — the \"direct DSP\" category\n\nThe sharpest commercial signal comes from ExchangeWire's **June 17, 2026** analysis, \"A New Type of DSP Is Emerging.\" [15] It describes a new category — a \"direct DSP\" / \"Direct Booking Engine\" — \"an intelligent booking layer sitting closer to supply… integrating directly into agency systems,\" whose defining feature is **margin**: \"these platforms operate at a margin that is a step change below the major established DSPs,\" offering \"dramatically lower take rates\" and \"more working media per dollar.\" [15] The named variants explicitly include **Index Exchange (Index Cloud), PubMatic (Activate), and Magnite (ClearLine)** alongside lower-margin direct-inventory access from **DV360 and Amazon DSP**, plus booking engines like **Pontiac Intelligence** and **Universal Ads.** [15] One cited datapoint: a Universal Ads competitor, Onetag Dynamo, claims \"25% lower CPA with zero tech fee.\" [15]\n\nThe structural logic: containerized/in-exchange buying \"decouples infrastructure spend from market access\" [8], which removes one of the historical justifications for a high DSP take-rate — the cost and scale of running a global bidding infrastructure. If a small DSP or an agency can see the full supply pool from inside the exchange, the premium that incumbents charged for *reach via infrastructure* compresses. ExchangeWire's read: \"publishers retain more yield\" and agencies gain \"measurable advantage on every plan,\" reflecting \"a real need… to get closer together and lower the ad tech tax.\" [15]\n\n### 6.3 The buyer-side intelligence layer relocates from \"above the DSPs\" to \"inside the SSP\"\n\nAs §3.2 argued, MiQ's move into Decision Fabric (announced) signals that **cross-DSP buyer intelligence can migrate into the SSP fabric.** If the value a trading desk adds — proprietary models, measurement, optimization — can run beside the auction rather than from a layer stacked above several DSPs, the trading-desk margin partially relocates into the SSP's compute environment too. This is the least settled seat, and the most contested.\n\n### 6.4 The \"who keeps the spread\" exhibit\n\n| Value-chain seat | Pre-containerization | Mid-2026 direction | Evidence strength |\n|---|---|---|---|\n| **SSP / exchange** | Auction host + curation take | **Gains** a compute/hosting landlord position; potential lock-in | Strong (3 fabrics live/beta) [1][4][11] |\n| **Large independent DSP (TTD)** | High take-rate for reach-via-infrastructure | **Pressured** — \"direct DSP\" category undercuts take rate | Medium (one trade analysis) [15] |\n| **Small / model-driven DSP (Bedrock)** | Throttled by QPS, sub-scale | **Gains** — competes without infrastructure scale | Medium (vendor-reported) [1][2][8] |\n| **Independent decisioning vendors (Chalice, inPowered)** | A feature sold to DSPs | **Gains** — become first-class tenants across SSPs | Medium-strong (multi-fabric) [1][11][13][16] |\n| **Cross-DSP intelligence (MiQ)** | A layer above the DSPs | **Relocating** inside the SSP (announced) | Weak (one source) [4] |\n| **Publisher / media owner** | ~36¢ of the media dollar | **Gains** yield + quality-buying demand | Medium [8][14][15] |\n| **Walled-garden DSPs (DV360, Amazon)** | Co-located compute advantage | **Unmoved** — stay outside open-web fabrics; attack QPS at protocol layer (DTE) | Strong [7][21][22] |\n| **Agencies (InterMedia, Bay St., Canvas)** | Buy through DSPs | **Gains** — direct supply access, \"lower ad tech tax\" | Medium (testers) [3][15] |\n\nThe honest synthesis: **the early evidence points to margin flowing toward publishers, agencies, and the SSPs that host the compute, and away from the high DSP take-rate.** But this is a *directional read off a handful of pilots and one trade analysis*, not a measured shift in disclosed take-rates. The \"36 cents per media dollar to publishers\" figure that recurs in the trade framing [8] is the inefficiency the category claims to attack — not a measured result of it.\n\n> **A contested framing:** The \"SSP-favoring\" read is itself contested. ExchangeWire's CEO Rachel Smith pushed back on framing that favors SSPs over DSPs, arguing containerization actually \"enables independent DSPs to compete more effectively for open internet spend,\" benefiting publishers with unsold inventory. [9] The margin relocation is best read as a live question, not a settled outcome — the same caution the standards chapter applies to the ARTF-vs-AdCP margin fight.\n\n---\n\n## 7. The Competitive Map at a Glance\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 612\" role=\"img\" aria-label=\"A market map of who actually runs inside a seller's exchange fabric. Three host columns stand on the exchange's own racks: Index Cloud, on Index Exchange's own data centers, in closed beta since April 2026; PubMatic's Decision Fabric, on AgenticOS, since June 2026; and OpenX's OpenXBuild, the Hyundai pilot. A footnote notes that Magnite's ClearLine with Cognitiv is a fourth native-integration topology, not an open self-serve host. Seated inside these fabrics as sealed-container chips is a recurring set of tenants that are almost all platform-independent AI-decisioning and enrichment vendors: Bedrock Platform, the first containerized DSP; Chalice AI; inPowered AI; Nano Interactive; SWYM.AI; Cognitiv, a deep-learning bidder; MiQ, cross-DSP intelligence; and Gracenote, contextual data from Nielsen. Below, clearly separated, a band labelled BUILDING, BUT STAYING OUT holds the incumbent demand-side platforms that decline to co-locate: The Trade Desk's Kokai, Yahoo, Google DV360, and Amazon. Amazon instead donated its Dynamic Traffic Engine to IAB Tech Lab, and its AWS RTB Fabric is a managed network rather than in-exchange co-location. The revealed-preference fact is that the tenants are independent decisioning vendors, not the big DSPs.\">\n<rect x=\"8\" y=\"8\" width=\"684\" height=\"596\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"34\" text-anchor=\"middle\" font-size=\"16\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--text)\">WHO&#8217;S ON THE FABRIC<\/text>\n<text x=\"350\" y=\"52\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">who builds the hosting metal, who agrees to run inside it &#8212; and who pointedly will not<\/text>\n<text x=\"38\" y=\"80\" font-size=\"9.5\" class=\"t-mono t-acc\" letter-spacing=\"1.5\" font-weight=\"bold\">THREE SSP FABRICS<\/text>\n<text x=\"38\" y=\"93\" font-size=\"8.5\" class=\"t-mono t-muted\">the hosts &#8212; each builder&#8217;s metal, the tenants seated inside<\/text>\n<g class=\"cv-rise\">\n<rect x=\"34\" y=\"104\" width=\"206\" height=\"296\" rx=\"3\" class=\"f-panel\" s \"/>\n<text x=\"48\" y=\"514\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--text)\">Amazon donated its <tspan font-weight=\"bold\">Dynamic Traffic Engine<\/tspan> to IAB Tech Lab; its <tspan font-weight=\"bold\">AWS RTB Fabric<\/tspan> is a managed<\/text>\n<text x=\"48\" y=\"527\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--text)\"><tspan style=\"fill:var(--t5)\">NETWORK<\/tspan>, not in-exchange co-location &#8212; the big buyers build agentic capability, then route <tspan class=\"t-muted\">around<\/tspan> the host.<\/text>\n<line x1=\"40\" y1=\"560\" x2=\"660\" y2=\"560\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"578\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">The recurring tenants are independent decisioning and enrichment vendors, not the incumbent DSPs &#8212; the single<\/text>\n<text x=\"350\" y=\"592\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">sharpest fact constraining the margin-relocation thesis: the big buyers will not run inside someone else&#8217;s exchange.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> The tenants who agree to sit inside a seller&#8217;s fabric are independent decisioning and enrichment vendors &#8212; Bedrock, Chalice, Cognitiv, MiQ, Gracenote &#8212; not the incumbent demand-side platforms. <em>The Trade Desk, Yahoo, DV360, and Amazon build agentic capability of their own but pointedly decline to co-locate; Amazon even donated its Dynamic Traffic Engine to the IAB and kept its RTB fabric a managed network rather than an in-exchange tenancy. That refusal by the largest buyers is the single sharpest revealed-preference fact constraining the margin-relocation thesis.<\/em><\/figcaption>\n<\/figure>\n\n\nPulling the slate together as of **June 20, 2026** (statuses are *announced* unless independently corroborated):\n\n**Fabric builders (SSPs hosting buyer logic):** Index Exchange (Index Cloud, closed beta) · OpenX (OpenXBuild, Hyundai pilot) · PubMatic (Decision Fabric/AgenticOS, launched + pilot roster). **Building toward but not shipped:** Magnite (hybrid-infrastructure readiness, ClearLine direct-booking; no containerized-bidding product of its own confirmed). [1][4][11][17]\n\n**Tenants running inside (or testing):**\n- *Full DSP:* Bedrock Platform (inside Index Cloud) — the \"first containerized DSP.\" [1][8]\n- *Independent AI-decisioning vendors:* Chalice AI (Index, OpenX, PubMatic) · inPowered AI (Index, PubMatic) · Nano Interactive (Index, announced) · SWYM.AI (PubMatic, announced). [1][4][11][13][16]\n- *Cross-DSP buyer-side intelligence:* MiQ (PubMatic Decision Fabric, announced). [4]\n- *Agencies / early testers:* InterMedia Group · Bay Street Media · Navigator (Index/Bedrock) · Canvas Worldwide (Zillow pilot inside Index). [1][14]\n- *Advertiser pilots:* Zillow (Aug 2025, inside Index) · Hyundai (inside OpenXBuild) · an undisclosed car brand (Canvas). [11][14]\n\n**Standing outside the fabric (by posture):** The Trade Desk (independence as moat; agentic via Kokai/Koa) · Google DV360 (walled compute; buys over OpenRTB) · Amazon DSP (donated DTE to attack QPS at protocol layer) · Yahoo DSP (embraces orchestration, guards core; AdCP founding member). [6][7][18][20][21]\n\n**The governance table** (who set the rules): the ARTF Container Project working group — Index Exchange, OpenX, The Trade Desk, Chalice (core contributors), plus Amazon Ads, Netflix, Yahoo, Paramount, Optable, HUMAN Security, Magnite, PubMatic, WPP Media, Basis Technologies. [17] Note the **CTV-supply weighting** (Netflix, Paramount) — the same pattern the standards chapter flags. And note that the demand-side incumbents at the table (TTD, Amazon, Yahoo) are contributors to the *spec* but not tenants of the *fabric*.\n\n---\n\n## 8. Status Watch — What Goes Stale Fastest\n\nThis is the material most exposed to stale-status error. Ranked by decay risk:\n\n1. **Beta/pilot statuses.** Index Cloud is **closed beta** [1]; OpenXBuild and Decision Fabric are **pilots** [4][11]. Any of these could reach GA — or quietly stall — within weeks. The single highest-value status update would be a GA announcement or a participant churn report.\n2. **Named tester agencies (InterMedia, Bay Street, Navigator).** Closed-beta testers are the likeliest names to silently drop or rotate. [1]\n3. **Announced-but-not-live partners (MiQ, SWYM.AI on Decision Fabric; Nano Interactive on Index Cloud).** Press-release rosters routinely overstate live status; PPC Land's narrower live/onboarding list for Decision Fabric already diverges from PubMatic's four-partner claim. [4][16]\n4. **The \"first\" claims.** \"First containerized DSP\" (Bedrock) and \"first to run a bidder inside an exchange\" are correct as of April 2026 [1][8] but will be superseded the moment a second full DSP goes in — a likely near-term event given three live fabrics.\n5. **Product names and repositionings.** OpenX rebranded to \"The Intelligent SSP\" in April 2026 [12]; PubMatic folded Activate into Decision Fabric/AgenticOS [4]. Brand/product renames are frequent here and a classic source of stale-status error.\n6. **Take-rate / \"direct DSP\" framing.** The June 17, 2026 \"new type of DSP\" thesis [15] is six weeks old at compile time and based on one outlet's synthesis; the category label itself (\"direct DSP\" vs. \"Direct Booking Engine\" vs. \"direct\" DSP) is unstable.\n\n---\n\n## Open Questions\n\n1. **Will a second full DSP — or any incumbent DSP — run its bidder inside an SSP fabric?** Bedrock is a small model-driven DSP; the category's significance hinges on whether a TTD-scale player ever becomes a tenant, or whether independence keeps them out permanently. As of mid-2026, none has.\n2. **What is the actual commercial model of the seat?** No source discloses whether SSPs charge a hosting fee, take a curation cut, bundle it into a deal take, or treat it as a loss-leader. The \"who keeps the spread\" answer is directional, not quantified.\n3. **Is \"deploy once, run across SSPs\" real?** ARTF promises portability, and Chalice/inPowered run in multiple fabrics — but is any *single container* documented running unchanged across Index Cloud, Decision Fabric, and OpenXBuild? Not as of mid-2026.\n4. **Does Magnite ship a containerized-bidding product, or stay \"hybrid-ready\"?** The largest independent SSP has signalled readiness and offers ClearLine, but has not shipped an Index-Cloud-equivalent. Its move (or non-move) reshapes the fabric-builder map.\n5. **How big is this, actually?** Every metric on the map is vendor-reported and pilot-stage. No independent measure exists of containerized-bidding volume, spend, or share of programmatic. The map is real but tiny.\n6. **Does the AdCP topology undercut the whole map?** If direct buyer-agent/seller-agent negotiation (discussed in the standards chapter) routes around the auction, the elaborate machinery of running a bidder inside an exchange addresses a receding problem. Yahoo's AdCP membership is a hedge against exactly this.\n\n---\n\n## Sources\n\n1. Index Exchange, \"Introducing Index Cloud,\" indexexchange.com, Apr 21, 2026. https://www.indexexchange.com/2026/04/21/introducing-index-cloud/ (accessed 2026-06-20). *Tier 1 — company announcement; evidence of Index's claims, closed-beta status, partner names (Bedrock, Chalice, inPowered, Nano Interactive), Casale/Shevlin quotes, ARTF alignment. Not proof of adoption.*\n2. Bedrock Platform, \"Bedrock Platform Launches the First Containerized DSP in Index Cloud,\" bedrockplatform.com, Apr 2026. https://bedrockplatform.com/news/bedrock-platform-launches-the-first-containerized-dsp-in-index-cloud/ (accessed 2026-06-20). *Tier 1 — company release; Naglak \"no QPS caps\" quote, performance claims (vendor-reported).*\n3. ExchangeWire, \"Bedrock Debuts Containerised DSP Deployment on Index Cloud, Enabling Model-Driven Bidding at Scale,\" exchangewire.com, Apr 24, 2026. https://www.exchangewire.com/blog/2026/04/24/bedrock-debuts-containerised-dsp-deployment-on-index-cloud-enabling-model-driven-bidding-at-scale/ (accessed 2026-06-20, via search snapshot). *Tier 4 trade — independent corroboration of Bedrock/Index launch, tester names, Nyurenberg quote.*\n4. PubMatic, Inc., \"PubMatic Launches Decision Fabric on AgenticOS…,\" investors.pubmatic.com / BusinessWire, Jun 1, 2026. https://investors.pubmatic.com/news-releases/news-release-details/pubmatic-launches-decision-fabric-agenticos-giving-partner (accessed 2026-06-20). *Tier 1 — company release (public co.); AgenticOS scale figures, four-partner roster (inPowered, MiQ, Chalice, SWYM.AI), Goel quote, ARTF alignment. Press-release claim, not proof of live integration.*\n5. Advanced Television, \"PubMatic launches Decision Fabric on AgenticOS,\" advanced-television.com, Jun 1, 2026. https://www.advanced-television.com/2026/06/01/pubmatic-launches-decision-fabric-on-agenticos/ (accessed 2026-06-20). *Tier 5 trade — corroborates Decision Fabric specs, partner roles, hardware claims.*\n6. PredictStreet / FinancialContent, \"The 2026 Comeback: A Deep-Dive Research Report on The Trade Desk (TTD),\" Jan 2, 2026. https://markets.financialcontent.com/wral/article/predictstreet-2026-1-2-the-2026-comeback-a-deep-dive-research-report-on-the-trade-desk-ttd (accessed 2026-06-20). *Tier 5/6 — analyst-style report; TTD independence framing, Kokai 15M opportunities/sec and 26% CPA figures (treat as analyst-cited, not audited).*\n7. IAB Tech Lab, \"IAB Tech Lab Announces Dynamic Traffic Engine Donation from Amazon Ads to Improve Bidstream Efficiency,\" iabtechlab.com / PRNewswire, Apr 15, 2026. https://iabtechlab.com/press-releases/iab-tech-lab-announces-dynamic-traffic-engine-donation-from-amazon-ads/ (accessed 2026-06-20). *Tier 1 — standards-body release; DTE mechanics, Katsur and de Zwart quotes, QPS-waste framing.*\n8. PPC Land, \"Bedrock becomes first DSP to run its bidder inside an exchange,\" ppc.land, Apr 2026. https://ppc.land/bedrock-becomes-first-dsp-to-run-its-bidder-inside-an-exchange/ (accessed 2026-06-20). *Tier 4/5 trade — strongest independent technical/market account; QPS mechanics, decoupling thesis, 36¢-to-publishers framing, standards timeline, inPowered 75% case study, Zillow reference.*\n9. PPC Land, \"Index Cloud, Meta CTV, and synthetic audiences: what ad tech needs to know\" and \"Index Exchange CEO outlines programmatic's shift to impression-level AI,\" ppc.land, 2026. https://ppc.land/index-cloud-meta-ctv-and-synthetic-audiences-what-ad-tech-needs-to-know/ and https://ppc.land/index-exchange-ceo-outlines-programmatics-shift-to-impression-level-ai/ (accessed 2026-06-20). *Tier 4/5 trade — Casale \"cloud tax\"/\"stops apologizing\" framing; Rachel Smith DSP-favoring rebuttal; Zillow-Chalice origin.*\n10. PPC Land, \"Zillow pilots containerized RTB to improve programmatic ad quality,\" ppc.land, Aug 2025. https://ppc.land/zillow-pilots-containerized-rtb-to-improve-programmatic-ad-quality/ (accessed 2026-06-20). *Tier 4/5 trade — Zillow/Chalice/Index publisher-quality mechanics.*\n11. AdExchanger, \"Hyundai Tests Containerized Ad Tech To Drive New Efficiency,\" adexchanger.com, 2026. https://www.adexchanger.com/marketers/hyundai-tests-containerized-ad-tech-to-drive-new-efficiency/ (accessed 2026-06-20). *Tier 4 trade — OpenXBuild/Chalice/Hyundai pilot, GCP cost model, Meyer egress-cost quote, Gilpin IP-ownership framing.*\n12. OpenX / ExchangeWire, \"OpenX Repositions as The Intelligent SSP™ to Simplify Advertising,\" openx.com / exchangewire.com / BusinessWire, Apr 13–14, 2026. https://www.exchangewire.com/blog/2026/04/14/openx-repositions-as-the-intelligent-ssp-to-simplify-advertising/ (accessed 2026-06-20). *Tier 1 + Tier 4 — OpenX rebrand date, Sattel quote, cloud-native positioning, OpenXBuild reference.*\n13. Index Exchange, \"inPowered AI Becomes the Fastest-Growing Containerized Solution on Index Marketplaces Since Its Launch,\" indexex
