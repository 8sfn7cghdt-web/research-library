/* ── animated reveal on scroll (corpus-visuals) ──────────────────────────────
   Figures and their marks start hidden ONLY after the page JS adds .reveal-armed
   (it skips this under prefers-reduced-motion), so with no-JS or reduced motion
   everything is fully visible by default — motion is purely additive. When a
   figure scrolls into view the observer adds .is-revealed and CSS does the rest.
   The cv-* classes are a shared reveal vocabulary used by BOTH the build-time viz
   charts and hand-authored corpus-fig figures; the per-mark `--d` var staggers
   them. transform-box:fill-box anchors each SVG mark's scale to its own geometry. */
figure.viz, figure.corpus-fig { --cv-ease: cubic-bezier(.25,.1,.25,1); }
.reveal-armed.viz, .reveal-armed.corpus-fig { opacity: 0; transform: translateY(6px);
  transition: opacity .35s var(--cv-ease), transform .35s var(--cv-ease); will-change: opacity, transform; }
.reveal-armed.is-revealed { opacity: 1; transform: none; }
.reveal-armed .cv-fade { opacity: 0; transition: opacity .35s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-fade { opacity: 1; }
.reveal-armed .cv-rise { opacity: 0; transform: translateY(6px);

rgin-relocation event, not a margin-elimination event**: roughly 53% of the advertiser's dollar still fails to reach the publisher; containerization redistributes that cut — squeezing the DSP's ~16% take, handing the SSP a new compute-hosting line — rather than shrinking it. And the whole thing is bounded: it touches only the open programmatic web (~20–30% of ad spend) while the walled gardens take the rest. Our forecast through 2030 is that containerized bidding almost certainly becomes durable infrastructure (~80%) but most likely becomes **commoditized plumbing that mints no new margin seat** (40–46%) — competed away by the same portability that drives its adoption.\n\n> **So what.** If you sell demand-side technology, the bidder is ceasing to be a moat. If you operate an exchange, you may be about to host your competitors' brains for a fee you cannot defend. If you buy media, the prize is better unit economics, not a smaller middleman stack — and you should demand an independent lift test before believing the performance pitch.\n\n## How to Read This\n\nThe **five-minute version** is this Bottom Line and the three synthesis sections below. The **full version** is the chapters that follow, in order — origins, architecture, standards, market, economics, and risks, followed by the closer studies that pressure-test and extend them, and the outlook through 2030.\n\n> The three sections below are written at a briefing's altitude — interpretation and connection, not a recap of the chapters that follow.\n\n## Origins (Brief)\n\nContainerized bidding is the endpoint of a fifteen-year effort to shorten, and finally delete, the distance between a buyer's decision and a seller's auction. The protocol that built the open programmatic market, OpenRTB (2010), is also the source of its central constraint: it asks buyers to value each impression over the internet inside a hard time budget — the `tmax` field, typically 80–120 milliseconds including network latency — and discards have pointedly *not* become tenants, and Amazon's revealed preference is the sharpest fact in the whole picture: it donated its Dynamic Traffic Engine to IAB Tech Lab to cut auction load *at the protocol layer while keeping the auction in place*, and its AWS RTB Fabric is a managed network, not in-exchange co-location.\n\nThe technical reality is more bounded than the marketing. The decisive architectural fact is the **data boundary**: ARTF runs each container with its ingress and egress sealed except to the host, which protects both the exchange's bidstream and the buyer's model — but also means most deployments are *sandboxes* (\"bring your model, see only the host's signals\"), not the *open compute* that would let a buyer freely bring its own first-party data in. That seal caps the \"richer signal\" promise. ARTF itself extends OpenRTB rather than replacing it, and sits under IAB Tech Lab's AAMP umbrella (named February 2026) — which is why it collides with **AdCP**, the rival Scope3-led standard that would let seller and buyer *agents* negotiate directly and route around the auction entirely, shifting margin toward publishers. That is the real stake beneath the acronyms: a fight over who sits in the middle of the next decade of ad buying. The honest current-state verdict: real plumbing, oversold performance, resting on a decaying identity substrate the architecture cannot fix (IP-to-household accuracy at 13–16%), in a market the walled gardens cap at ~20–30% of spend.\n\n## Forecast (Brief)\n\nThe forecast, taken up in full in the outlook, starts from a point of near-agreement and then splits. Working from different angles, the analysis puts roughly **80%** on containerized bidding becoming durable open-web infrastructure by 2030 — the egress utility is sound, three fabrics are live, the standard is real. The disagreement, preserved as scenario spread rather than averaged away, is **who captures the margin the architecture relocates.** The modal outcome (**40–4 ainerization (Amazon DSP at ~1%, TTD turned negotiable), so the margin movement the architecture will get credit for is substantially exogenous and cannot yet be isolated.\n\nNothing here is presented as more settled than it is."}, {"order": 1, "file": "01_Origins_and_Evolution.md", "title": "Origins & Evolution — The Road to Containerized Bidding", "summary": "", "body": "# Origins & Evolution — The Road to Containerized Bidding\n\n## Bottom Line\n\nContainerized bidding is the endpoint of a fifteen-year campaign to remove network distance between a buyer's decision and the seller's auction. The programmatic ad ecosystem was built on **OpenRTB** — an open protocol, launched in 2010, in which a seller's exchange broadcasts each ad opportunity (a \"bid request\") over the public internet to dozens of buyers, who must value it and respond inside a budget of roughly **80–120 milliseconds** before the page renders [1][2][8]. That round-trip is a structural \"latency tax.\" Every hop costs time, and any buyer that responds late is simply dropped from the auction [8].\n\nEach move since has tried to win that time and money back. Header bidding and its **wrapper/\"container,\"** Prebid.js (2015); server-side header bidding via Prebid Server (2017); supply-path optimization, or **SPO** (from ~2017), which pruned the number of exchanges a buyer transacts through; and the migration of bidders into public cloud — every one of them left the buyer's brain and the seller's auction in *different data centers*, separated by network egress fees and a queries-per-second (**QPS**) ceiling [4][5][11][13]. The conceptual leap, arriving in market in 2025–2026, stops moving the request to the buyer and instead moves the buyer to the request: package the bidder as an **OCI/Docker container** — a portable, sealed bundle of code — and run it *inside the exchange's own compute fabric*, co-located with the auction and its signals [9][12][14]. The trigger is now. **Machine-learning bidders** want to run next to the signal, public-**cloud egress fees** make remote bidding expensive when the inventory already sits in the seller's cloud, and supply has consolidated into a handful of large SSP fabrics worth co-locating with [11][13][16].\n\nAs of mid-2026 the architecture is live but young. Index Exchange's **Index Cloud** went to beta on April 21, 2026 with Bedrock as the first containerized DSP; PubMatic's **Decision Fabric** launched June 1, 2026; and the **IAB Tech Lab** is standardizing the pattern under its **Agentic RTB Framework (ARTF)**, in public comment through January 15, 2026 [9][12][14][17][19]. What follows traces how each link in that chain was forged — and why the chain is being collapsed now.\n\n---\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Fifteen years of deleting the wire — the road to containerized bidding<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">Nov 2010<\/div><div class=\"tlbody\">OpenRTB consortium forms — the open protocol, and its structural latency tax<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">2014–15<\/div><div class=\"tlbody\">Header bidding emerges; the &#x27;wrapper/container&#x27; enters the vocabulary<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">2017<\/div><div class=\"tlbody\">Server-side header bidding (Prebid Server) + supply-path optimization concentrate supply into a few SSP fabrics<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">Oct 2025<\/div><div class=\"tlbody\">AWS RTB Fabric (managed network) reaches GA<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">Nov 2025<\/div><div class=\"tlbody\">IAB Tech Lab releases ARTF v1.0 for public comment; AdCP launches as the rival topology<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">Feb 2026<\/div><div class=\"tlbody\">IAB Tech Lab names the umbrella AAMP<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">Apr 2026<\/div><div class=\"tlbody\">Index Cloud beta; Bedrock = first containerized DSP<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">Jun 2026<\/div><div class=\"tlbody\">PubMatic Decision Fabric launches; Gracenote×PubMatic ARTF integration<\/div><\/div><\/div><figcaption>Each step moved the buyer&#x27;s decision closer to the seller&#x27;s auction; containerization co-locates them. <span class=\"credit\">Source: Synthesized from the sources cited in this chapter.<\/span><\/figcaption><\/figure>\n\n\n\n## 1. The starting condition: OpenRTB and the \"latency tax\"\n\n**So what:** Programmatic advertising's foundational protocol forces every buyer to value an ad impression *across the public internet* inside a sub-150-millisecond window. That round-trip is the original sin the field has spent its whole history trying to undo — and containerized bidding is the move that finally deletes the trip.\n\n### What RTB and OpenRTB actually are\n\n**Real-time bidding (RTB)** is the practice of auctioning a single ad impression — one ad slot, one user, one page-load — in the milliseconds while a web page or app screen is loading. **OpenRTB** is the open, vendor-neutral *protocol* that standardizes the messages in that auction: the **bid request** (the seller describing the opportunity — the URL, the user's signals, the ad sizes) and the **bid response** (a buyer's price and creative). In the canonical flow, a **supply-side platform (SSP)** — the seller's technology, representing the publisher's inventory — broadcasts the bid request to many **demand-side platforms (DSPs)** — the buyers' technology, representing advertisers — collects their responses, runs an auction, and returns a winner [4][6].\n\nThe OpenRTB Consortium assembled the protocol in **November 2010** — a pilot group of six firms split across both sides of the market: DSPs **DataXu, MediaMath, and Turn**, and SSPs **AdMeld, PubMatic, The Rubicon Project, and ContextWeb** [1]. The first specification (December 2010) standardized block lists; OpenRTB Mobile 1.0 followed in February 2011; a unified display/video/mobile **OpenRTB 2.0** shipped June 2011; and the **IAB** (Interactive Advertising Bureau) adopted it as an industry standard with **version 2.1 in January 2012** [1]. Governance later moved to the **IAB Tech Lab**, the IAB's technical-standards arm, which still maintains it [2]. The crucial design fact: OpenRTB is a *networked request/response protocol over the open internet*. By construction, buyer and seller sit in separate systems that talk by passing messages.\n\n### The tax: time you don't have\n\nThat design imposes a hard, physical time budget. The OpenRTB bid request carries a field, **`tmax`** — the maximum number of milliseconds the exchange will wait for a bid, *including internet latency*, before it closes the auction without you [8]. In practice SSPs set `tmax` between roughly **80 and 120 milliseconds**, and Google's exchange historically enforced a tight deadline in this range — though it is a *dynamic* per-request deadline (`response_deadline_ms`), not a fixed 100-millisecond ceiling [8][16]. Of that budget, the buyer's own machine-learning model inference should consume only about **5 milliseconds**, leaving the rest for network transit, data preprocessing, and response formatting [16]. The squeeze is real: as a matter of engineering practice, if the 99th-percentile auction duration drifts much above the deadline \"you are losing auctions,\" and with on the order of **25–30 DSPs** called per auction the probability that at least one times out climbs steeply — hence engineering targets nearer **70 ms** to protect tail latency [8][16].\n\nThe tax is paid in three currencies. **Timeouts:** a buyer whose response arrives after `tmax` is discarded, so a slow buyer simply does not compete, no matter how high it would have bid [8]. **Lost match value:** the most valuable impressions are the ones a buyer can identify and target, yet round-trips spent on identity resolution and data lookups eat into the inference budget [9][16]. **Wasted compute:** SSPs broadcast enormous volumes of requests speculatively — PubMatic alone processes **2.7 trillion advertiser bid requests per day** as of 2026 — and the overwhelming majority are never bid on, burning electricity and bandwidth on both sides [17]. The latency tax is not a bug to be patched. It is a property of putting an auction and its bidders on opposite ends of a wire. Every chapter that follows tries to shorten — and finally to delete — that wire.\n\n> **Note.** OpenRTB remains the live lingua franca of open-market programmatic as of 2026; the IAB Tech Lab explicitly frames its newest agentic work as \"powered by OpenRTB,\" i.e., layered on top of rather than replacing it [14][19].\n\n---\n\n## 2. Header bidding and the first \"container\": parallelizing demand\n\n**So what:** Before buyers could move into the exchange, sellers had to break the single-file \"waterfall\" that throttled their yield. The fix — header bidding — introduced the **wrapper**, the first piece of ad-tech vocabulary called a \"container,\" and re-architected the page so that many exchanges could be asked at once. It solved the seller's yield problem but multiplied the buyer's latency problem.\n\n### What header bidding replaced: the waterfall and \"last look\"\n\nThrough the early 2010s, a publisher that couldn't sell an ad slot directly passed it down a **waterfall** (also \"daisy chain\"): ad networks and exchanges were offered the impression *sequentially*, ranked by historical average yield, each handed a **passback** to the next if it declined [10]. The waterfall priced inventory at *average* historical CPM (cost per thousand impressions), not the *current* market-clearing price — so a buyer willing to pay a premium for this specific user often never got the chance to bid [10]. Worse, the dominant ad server — Google's DoubleClick for Publishers (DFP), via **Dynamic Allocation** (introduced 2007) — gave Google's own exchange (AdX) a structural edge known as **\"last look\":** AdX could see the highest competing bid and beat it by a cent [3]. A leaked April-2015 Google deck titled \"Why first look is crucial\" stated the logic plainly: \"First look allows access to the most valuable cookies, hence the highest-paying impressions\" [3]. Google retired Last Look in 2018, but by then it had already provoked the publisher rebellion that became header bidding [3].\n\n### The mechanism — and the word \"container\"\n\n**Header bidding** is a publisher-side technique, emerging in **2014**, that places a snippet of JavaScript in the *header* of the web page so that, before the ad server is even called, the browser solicits bids from multiple SSPs/exchanges **simultaneously** and passes the winning price to the ad server to compete on equal footing [4][10]. Early on it had no settled name — \"tagless,\" \"pre-bidding,\" \"parallel auction\" — and no one is quite sure who coined \"header bidding\" (Digiday's oral history calls its origin \"an ad tech urban legend\"); a 2015 AdExchanger article, \"The Rise Of 'Header Bidding' And The End Of The Publisher Waterfall,\" helped popularize the term, which spread through the trade press (AdExchanger, AdMonsters, Digiday) over the summer of 2015 [4].\n\nThe software that orchestrates those simultaneous calls — managing each bidder's timeout, collecting responses, and handing the winner to the ad server — is the header-bidding **wrapper**, and it is **also called a \"container\"** [5]. This is where \"container\" first entered programmatic vocabulary, and the distinction matters: it means something *different* from the OCI/Docker container of today's containerized bidding. The wrapper is a coordination *layer in the browser*, not a sealed compute artifact deployed into a data center. The dominant wrapper, **Prebid.js**, launched in **2015** as a free, open-source collaboration originated by **AppNexus**, explicitly to bring \"conformity and simplicity\" to a process that had been \"dominated by bad practices, proprietary tech, poor standards\" [5]. Prebid is governed today by **Prebid.org**, an independent organization spun up by AppNexus and Rubicon Project [5].\n\nHeader bidding solved the seller's problem — it broke the waterfall, ended Last Look's grip, and raised publisher yield by exposing every impression to simultaneous competition [4][10]. But it handed the *buyer* a new burden: DSPs now received \"dozens of bids for the exact same ad impression\" arriving from multiple paths, multiplying the request volume — and therefore the latency and compute load — that the buy side had to absorb [4][13]. The seller's cure became the buyer's disease, and the disease was again *distance and duplication*.\n\n---\n\n## 3. Server-side header bidding: auction logic migrates into data centers\n\n**So what:** Client-side header bidding ran in the user's browser, where each added bidder slowed the page. Moving the auction off the browser and into a data center — server-side header bidding — was the first migration of *auction logic out of the open client and into controlled compute*. It is the direct conceptual ancestor of running a bidder inside the exchange.\n\nClient-side header bidding had a ceiling. Every demand partner added to the page header meant another browser call, more JavaScript, and a slower page — a direct user-experience and revenue tax, especially on mobile [5][11]. The response was to lift the auction off the browser entirely. **Prebid Server**, launched by **AppNexus on May 3, 2017**, ran the same multi-bidder auction *server-side* — in a data center — instead of in the page header, \"minimizing browser calls and increasing bid density… while managing latency\" [11]. It was open-sourced and designed to interoperate with Prebid.js, letting a publisher call a few partners client-side and many more through the server [5][11]. Facebook joined AppNexus in promoting the server-to-server drive, explicitly framed as a challenge to Google's \"digital monopoly\" [11].\n\nThe significance for our story is conceptual, not commercial. Server-side header bidding established that the *auction itself* — the matching of demand to a specific impression — could profitably be relocated from the open, latency-bound client into purpose-built, controlled compute. Once the auction lives in a data center, the obvious next question is whether the *buyer's decisioning* can move into the same data center. Server-side header bidding moved the auction halfway to the exchange's fabric. Containerized bidding moves the bidder the rest of the way.\n\n> **Note on the trade-off.** Server-side shifted the auction out of the browser but did *not* co-locate buyer and seller: the DSP still sat in its own infrastructure, reached by a server-to-server OpenRTB call. The latency tax was reduced, relocated, and partly hidden — not removed [11][8].\n\n---\n\n## 4. SSP consolidation and supply-path optimization (SPO): concentrating the fabric\n\n**So what:** Header bidding had exploded the number of paths to any given impression. **Supply-path optimization (SPO)** was the buyer's counter-move — deliberately pruning those paths down to a few trusted SSPs. The unintended consequence was *concentration*: supply pooled into a handful of large SSP compute fabrics. Containerized bidding is only worth the engineering if there are a small number of big fabrics to move into — and SPO built exactly that precondition.\n\n**Supply-path optimization (SPO)** is the buy-side discipline, with its \"first inning\" around **2017**, of analyzing the many routes to a given impression and deliberately choosing which SSPs, exchanges, and resellers to transact through — and which to drop [13]. Chris Kane of Jounce Media framed it as \"understanding who is touching your inventory and removing as many touches as you possibly can\" [13]. The motivation was a direct consequence of header bidding: because publishers now offered the same impression through many SSPs at once, a DSP would receive the identical opportunity along a dozen paths of varying fee, latency, and trustworthiness; SPO is the buyer's choice to bid only through the efficient ones [13].\n\nSPO's directional effect is **concentration**. Goodway Group reduced its SSP partners from roughly **20 to single digits**; GroupM built a curated \"Premium Marketplace\"; The Trade Desk launched **OpenPath** to connect to publishers directly [13]. The industry rhetoric speaks of collapsing from ~1.5 million sellable properties toward a managed roster of perhaps \"100–1,000 sellers\" [13]. The result is that open-market supply increasingly clears through a *small number of large SSPs* — Magnite, PubMatic, Index Exchange, and a few others — each operating a high-throughput compute fabric.\n\nThat concentration is the quiet precondition for containerized bidding. Co-locating a bidder inside a single exchange is only economically rational if that exchange commands enough of the supply to be worth the integration; in a maximally fragmented market, a buyer would have to deploy a container into hundreds of tiny exchanges to see meaningful inventory. SPO did the consolidation work first. By 2025–2026, a DSP can deploy a container into Index Exchange or PubMatic and reach a material share of the open market — precisely because SPO spent the prior decade pruning the long tail and pooling spend into those few fabrics [13][9][17].\n\n---\n\n## 5. The cloud-cost and egress squeeze: the bidder is in the wrong building\n\n**So what:** Once both the auction and the bidder were running in cloud data centers, a perverse geometry emerged — the buyer's bidder and the seller's auction were often in *different clouds*, so every bid request crossed a paid network boundary. Cloud **egress fees** (charges to move data *out* of a cloud) and per-request compute turned high-volume bidding into a metered cost, and that meter is what forces the QPS ceiling. Containerized bidding's core economic claim is that it deletes this meter.\n\nBy the early 2020s, both DSPs and SSPs largely ran on public hyperscale clouds (AWS, Google Cloud, Azure). At programmatic scale the economics are unforgiving in one specific dimension: **egress** — the fee a cloud charges to send data *out* of its network. AWS charges roughly **$0.09 per GB** for internet egress (first 10 TB/month tier); Google Cloud's premium tier runs about **$0.12 per GB**; and even cross-availability-zone transfer inside AWS costs **$0.01/GB in each direction** [15]. Egress is widely estimated to account for on the order of **6–12% of typical cloud bills** — a general-cloud figure applied here by analogy rather than an ad-tech-specific measurement, and the cross-AZ charge cited above is AWS-specific (GCP, for instance, does not meter same-region cross-zone traffic) [15]. At programmatic volumes the numbers are large: an illustrative API serving 500 million requests/month at a 12 KB response generates ~5.7 TB of egress, roughly **$513,000/month in bandwidth alone** at $0.09/GB [15] — and a real bidder evaluates orders of magnitude more requests than that.\n\nThis is the origin of the **queries-per-second (QPS) ceiling** — the rate limit a buyer imposes on how many bid requests it will even look at. Bedrock's head of engineering, **Damian Naglak**, put the causal chain bluntly: \"Throttling existed because processing each bid request — egress, cross-network latency, serialization — carried a real per-request cost. Inside the cluster, that cost drops to near zero\" [9][12]. Because each request seen is a request paid for, DSPs rationed their attention: industry accounts hold that a typical DSP processed only **20–30% of the available bidstream**, throttling away the rest rather than pay to evaluate it [12]. Index Exchange CEO **Andrew Casale** named the phenomenon a **\"cloud tax\"** [12].\n\nThe geometry is the problem. When the auction runs in the SSP's cloud and the bidder runs in the buyer's cloud, *every bid request is an egress event* — data leaving one paid network and entering another, with latency and serialization cost on top. The buyer is, quite literally, in the wrong building: paying rent to a hyperscaler to ship the seller's data across town and back, on a clock it cannot afford to miss. Containerized bidding's economic pitch is to move the bidder into the seller's building, where the request never crosses a billed boundary at all [9][12].\n\n---\n\n## 6. ML-driven bidding: the bidder becomes a model that wants to sit next to the signal\n\n**So what:** The final push is the nature of the modern bidder itself. It is no longer a rules engine but a **machine-learning model** whose accuracy depends on rich, fresh signal and whose inference must finish in a few milliseconds. Models are hungriest exactly where the latency tax and egress meter bite hardest — at the point of the impression. Co-location is what a model would design if it could choose where to live.\n\nThe contemporary DSP bidder is a trained model — typically a gradient-boosted or neural scorer — that ingests 200+ features per auction and must return a price [16]. Two constraints define it. First, **the inference budget is tiny:** model inference should complete in **under ~5 ms**, with the remainder of the sub-100 ms window consumed by network transit and data handling [16]. Second, **accuracy scales with signal proximity and freshness:** incorporating real-time auction signals — competition levels, device, time-of-day, and crucially the SSP's own page- and user-level context — materially improves bid accuracy over models trained on historical data alone [16]. The richest signals, however, are exactly the ones held by the SSP closest to the publisher and never fully serialized into the OpenRTB bid request that crosses the wire [9].\n\nThis is the conceptual hinge. A model that (a) must finish in milliseconds, (b) gets more accurate the closer it sits to fresh signal, and (c) is penalized by egress for every request it evaluates is a model that *wants to run inside the exchange*. The Zillow containerized-RTB pilot made the point concretely: by hosting Chalice AI's buying model inside Index Exchange, the model could analyze granular site-quality signals — ad-to-content ratio per page, default video sound settings, refresh rates, data-broker calls — that are \"typically available only to sell-side vendors with direct publisher relationships\" and are not present in a standard bid request [18]. Co-location is not a performance tweak. It changes the *information set* the model can train and decide on. As Bedrock's launch framing put it, \"in an AI-first world, performance comes down to evaluating and scoring every opportunity in the moment\" — and you cannot score what you throttled away or never received [9][12].\n\n---\n\n## 7. The leap: co-locating the buyer's decision with the auction\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 486\" role=\"img\" aria-label=\"A before-and-after anatomy of where the buyer's bidder runs. On the left, the traditional path: the buyer's DSP bidder sits in a remote public cloud, and every bid request round-trips over the public internet to the exchange's auction and back. A hard time budget of 80 to 120 milliseconds is almost entirely consumed by network transit, leaving only about 5 milliseconds for the buyer's model to think; cloud egress is billed at roughly nine cents a gigabyte, and a queries-per-second ceiling forces the DSP to evaluate only 20 to 30 percent of the bidstream and throttle the rest — what Index Exchange's CEO calls the cloud tax. On the right, the containerized path: the buyer ships a sealed OCI container holding its model, which is lifted off the internet and set down on the exchange's own racks, running beside the auction inside the data center. The wire is deleted. A decision returns in under 5 milliseconds, egress on the auction round-trip falls to near zero, the throttle disappears, and the buyer evaluates every single impression.\">\n<rect x=\"8\" y=\"8\" width=\"684\" height=\"470\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--text)\">OFF THE WIRE, ONTO THE METAL<\/text>\n<text x=\"350\" y=\"50\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">where the buyer&#8217;s bidder runs &#8212; and what the wire costs to cross<\/text>\n<line x1=\"350\" y1=\"64\" x2=\"350\" y2=\"408\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/>\n<text x=\"186\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1.5\" style=\"fill:var(--t5)\">TRADITIONAL &#183; OVER THE WIRE<\/text>\n<text x=\"516\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1.5\" style=\"fill:var(--t1)\">CONTAINERIZED &#183; ONTO THE METAL<\/text>\n<g class=\"cv-fade\">\n<rect x=\"34\" y=\"98\" width=\"118\" height=\"80\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.4\" style=\"stroke:var(--t5)\"/>\n<text x=\"93\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">REMOTE PUBLIC CLOUD<\/text>\n<text x=\"93\" y=\"130\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" style=\"fill:var(--t5)\">AWS &#183; GCP<\/text>\n<rect x=\"48\" y=\"140\" width=\"90\" height=\"26\" rx=\"2\" fill=\"none\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\"/>\n<text x=\"93\" y=\"152\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--text)\">DSP BIDDER<\/text>\n<text x=\"93\" y=\ var(--border)\"/>\n<text x=\"46\" y=\"242\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">TIME BUDGET &#8212; t&#8202;max<\/text>\n<rect x=\"46\" y=\"248\" width=\"258\" height=\"22\" rx=\"2\" class=\"f-t2\" opacity=\".28\"/>\n<rect x=\"46\" y=\"248\" width=\"244\" height=\"22\" rx=\"2\" class=\"f-t5\" opacity=\".5\"/>\n<rect x=\"290\" y=\"248\" width=\"14\" height=\"22\" rx=\"1\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"168\" y=\"263\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--text)\">network transit<\/text>\n<text x=\"305\" y=\"278\" text-anchor=\"end\" font-size=\"8\" class=\"t-mono\" style=\"fill:var(--t1)\">&#8593; ~5&#8202;ms to think<\/text>\n<\/g>\n<text x=\"58\" y=\"262\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t5)\">80&#8211;120&#8202;ms<\/text>\n<g font-size=\"9.5\" class=\"t-mono\">\n<rect x=\"34\" y=\"296\" width=\"282\" height=\"92\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t3)\"/>\n<text x=\"46\" y=\"314\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">WHAT THE WIRE COSTS<\/text>\n<circle cx=\"52\" cy=\"332\" r=\"2.4\" class=\"f-t3\"/>\n<text x=\"62\" y=\"335\" font-size=\"10\" style=\"fill:var(--text)\">EGRESS billed at <tspan class=\"t-mono\" style=\"fill:var(--t3)\">~$0.09&#8202;/GB<\/tspan> (AWS)<\/text>\n<circle cx=\"52\" cy=\"352\" r=\"2.4\" class=\"f-t3\"/>\n<text x=\"62\" y=\"355\" font-size=\"10\" style=\"fill:var(--text)\">QPS ceiling throttles the bidstream<\/text>\n<circle cx=\"52\" cy=\"372\" r=\"2.4\" class=\"f-t3\"/>\n<text x=\"62\" y=\"375\" font-size=\"10\" style=\"fill:var(--text)\">only <tspan class=\"t-mono\" style=\"fill:var(--t3)\">20&#8211;30%<\/tspan> of impressions evaluated<\/text>\n<\/g>\n<rect x=\"396\" y=\"98\" width=\"268\" height=\"160\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.4\" style=\"stroke:var(--t2)\"/>\n<text x=\"410\" y=\"116\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">EXCHANGE DATA CENTER &#8212; ON THE RACK<\/text>\n<g style=\"fill:var(--t2)\" opacity=\".5\">\n<rect x=\"410\" y=\"126\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"135\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"144\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"153\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"162\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"171\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"180\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"189\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"198\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"207\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"216\" width=\"44\" height=\"6\" rx=\"1\"/>\n<rect x=\"410\" y=\"225\" width=\"44\" height=\"6\" rx=\"1\"/>\n<\/g>\n<g class=\"cv-grow-up\">\n<rect x=\"476\" y=\"126\" width=\"100\" height=\"98\" rx=\"3\" class=\"f-panel\" stroke-width=\"2.2\" style=\"stroke:var(--t1)\"/>\n<rect x=\"476\" y=\"126\" width=\"100\" height=\"98\" rx=\"3\" fill=\"none\" stroke-width=\"2.2\" style=\"stroke:var(--t1)\" stroke-dasharray=\"3 3\" opacity=\".55\"/>\n<text x=\"526\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">SEALED OCI<\/text>\n<text x=\"526\" y=\"158\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">CONTAINER<\/text>\n<rect x=\"490\" y=\"168\" width=\"72\" height=\"42\" rx=\"2\" fill=\"none\" stroke-width=\"1.4\" style=\"stroke:var(--t1)\"/>\n<text x=\"526\" y=\"186\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t1)\">DSP MODEL<\/text>\n<text x=\"526\" y=\"200\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\">runs in-cluster<\/text>\n<\/g>\n<g class=\"f-t2\">\n<rect x=\"586\" y=\"126\" width=\"64\" height=\"98\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.4\" style=\"stroke:var(--t2)\"/>\n<\/g>\n<text x=\"618\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">AUCTION<\/text>\n<g style=\"fill:var(--t2)\">\n<rect x=\"596\" y=\"156\" width=\"44\" height=\"7\" rx=\"1\" opacity=\".85\"/>\n<rect x=\"596\" y=\"167\" width=\"44\" height=\"7\" rx=\"1\" opacity=\".7\"/>\n<rect x=\"596\" y=\"178\" width=\"44\" height=\"7\" rx=\"1\" opacity=\".85\"/>\n<rect x=\"596\" y=\"189\" width=\"44\" height=\"7\" rx=\"1\" opacity=\".7\"/>\n<rect x=\"596\" y=\"200\" width=\"44\" height=\"7\" rx=\"1\" opacity=\".85\"/>\n<\/g>\n<text x=\"618\" y=\"220\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\">beside it<\/text>\n<path d=\"M576,162 L 586,162\" fill=\"none\" class=\"s-t1\" stroke-width=\"2.6\"/>\n<path d=\"M586,188 L 576,188\" fill=\"none\" class=\"s-t1\" stroke-width=\"2.6\"/>\n<polygon points=\"583,157 591,162 583,167\" class=\"f-t1\"/>\n<polygon points=\"579,183 571,188 579,193\" class=\"f-t1\"/>\n<text x=\"581\" y=\"178\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono\" style=\"fill:var(--t1)\">in&#8202;&#183;&#8202;out<\/text>\n<text x=\"526\" y=\"246\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" style=\"fill:var(--text)\">no internet round-trip &#8212; the wire is deleted<\/text>\n<g font-size=\"10\" class=\"t-mono\">\n<rect x=\"396\" y=\"272\" width=\"268\" height=\"58\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t1)\"/>\n<text x=\"408\" y=\"290\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">DECISION LATENCY<\/text>\n<rect x=\"408\" y=\"296\" width=\"244\" height=\"22\" rx=\"2\" class=\"f-t1\" opacity=\".18\"/>\n<rect x=\"408\" y=\"296\" width=\"16\" height=\"22\" rx=\"2\" class=\"f-t1 cv-grow-right\" opacity=\".95\"/>\n<text x=\"528\" y=\"311\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t1)\">UNDER 5&#8202;ms &#183; in-cluster<\/text>\n<\/g>\n<g font-size=\"10\" class=\"t-mono\">\n<rect x=\"396\" y=\"344\" width=\"268\" height=\"44\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t1)\"/>\n<circle cx=\"414\" cy=\"362\" r=\"2.4\" class=\"f-t1\"/>\n<text x=\"424\" y=\"365\" font-size=\"10\" style=\"fill:var(--text)\">egress on the round-trip &#8594; <tspan class=\"t-mono\" style=\"fill:var(--t1)\">~zero<\/tspan><\/text>\n<circle cx=\"414\" cy=\"380\" r=\"2.4\" class=\"f-t1\"/>\n<text x=\"424\" y=\"383\" font-size=\"10\" style=\"fill:var(--text)\">throttle gone &#8212; <tspan class=\"t-mono\" style=\"fill:var(--t1)\">every impression<\/tspan> seen<\/text>\n<\/g>\n<line x1=\"34\" y1=\"404\" x2=\"316\" y2=\"404\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"175\" y=\"422\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" style=\"fill:var(--t5)\">the &#8220;cloud tax&#8221; &#8212; Andrew Casale, Index Exchange<\/text>\n<line x1=\"40\" y1=\"446\" x2=\"660\" y2=\"446\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"466\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">Fifteen years of latency, egress, and throttling collapse the moment the bidder stops crossing the wire<\/text>\n<text x=\"350\" y=\"480\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">and starts running on the seller&#8217;s metal.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> The whole corpus turns on one move: lifting the buyer&#8217;s sealed bidder off the public internet and setting it down on the exchange&#8217;s own racks. <em>Over the wire, an 80&#8211;120&#8202;ms budget is spent almost entirely on transit &#8212; leaving ~5&#8202;ms to think &#8212; while cloud egress (~$0.09/GB) and a QPS ceiling let the DSP evaluate only 20&#8211;30% of the bidstream, the &#8220;cloud tax.&#8221; Co-located in a sealed OCI container beside the auction, the decision returns in under 5&#8202;ms, egress falls to near zero, and the throttle disappears &#8212; so the buyer sees every impression.<\/em><\/figcaption>\n<\/figure>\n\n\n**So what:** Stack the six pressures — the OpenRTB latency tax, header bidding's request explosion, the auction's migration into data centers, SPO's concentration of supply, the cloud egress meter, and the model's hunger for proximate signal — and one move resolves all of them at once: package the bidder as an OCI/Docker container and run it inside the exchange's compute fabric, beside the auction. That is containerized bidding.\n\n### Defining the architecture\n\n**Containerized bidding** is the architecture in which a buyer's bidding logic is packaged as an **OCI/Docker container** — using the **Open Container Initiative** standard, a portable, self-contained bundle of code and dependencies that can run unchanged on someone else's machine — and deployed *inside the SSP/exchange's own compute fabric*, co-located with the auction, rather than reached over OpenRTB across the public internet [9][14][17]. IAB Tech Lab CEO **Tony Katsur** described the underlying need as the imperative to \"containerize the architecture\" so that demand and supply technologies no longer \"operate in separate data centers\" pinging each other by API [14]. The crucial inversion: instead of moving the *request* to the buyer, you move the *buyer* to the request.\n\n### Why it dissolves the prior constraints\n\nCo-location attacks every link in the chain simultaneously [9][12]:\n\n- **Latency tax → near-zero transit.** With the bidder inside the cluster, the bid request never traverses the public internet. Index Cloud reports the full container **execution window under 5 milliseconds**; the IAB's ARTF targets up to **80% reduction** in bid request/response time [12][14][19].\n- **Egress meter → deleted.** The request never crosses a billed network boundary, so per-request egress cost \"drops to near zero\" [9][12].\n- **QPS ceiling → removed.** Because evaluating a request no longer carries a real per-request cost, the buyer can look at the *full* bidstream rather than the throttled 20–30% [12].\n- **Signal poverty → full context.** The container can read signals at the point of transaction that were never serialized into the wire-format bid request [18][9].\n- **Infrastructure-spend-as-moat → decoupled.** Bedrock's thesis is that co-location \"decouples infrastructure spend from market access,\" so a smaller buyer can compete on decisioning quality rather than on the size of its compute budget — narrowing the structural edge long held by the walled gardens (Google, Meta, Amazon), which always co-located data, compute, and decisioning [9][12].\n\n### Status of the live implementations (mid-2026)\n\nThe architecture moved from concept to market across 2025–2026. Each of the following is a present-tense status claim — exactly the kind that goes stale fastest — with its most recent dated confirmation:\n\n- **The Zillow / Chalice AI / Index Exchange pilot** — first brand-advertiser test of containerized RTB, hosting Chalice's model inside Index Exchange — was reported **August 6, 2025** [18]. *(Pilot; status beyond launch not independently confirmed.)*\n- **IAB Tech Lab's Agentic RTB Framework (ARTF) v1.0**, which standardizes containerized agent services running inside host infrastructure, opened for **public comment on November 13, 2025, closing January 15, 2026** [14][19]. As a draft framework in comment, its final form is not settled.\n- **AAMP (Agentic Advertising Management Protocols)** — the IAB Tech Lab umbrella under which ARTF sits — was formally named **February 26, 2026** [20].\n- **Amazon Ads donated its Dynamic Traffic Engine (DTE)** — a file-based system letting DSPs signal bidding priorities to SSPs to cut wasted requests — to the IAB Tech Lab open-source project on **April 15, 2026** [21].\n- **Index Cloud** — Index Exchange's proprietary compute environment (explicitly \"not built on GCP, AWS, or Azure\") — entered **beta on April 21, 2026** with **Bedrock Platform** as the first containerized DSP, and lists **Chalice AI, inPowered AI, and Nano Interactive** among partners; Index describes it as \"live today\" as of the April–May 2026 announcements [9][12][22][17].\n- **PubMatic's Decision Fabric** — which hosts partner AI models as Docker (OCI) containers inside PubMatic's auction, returning segment IDs in **under 10 ms** — **launched June 1, 2026**, with inPowered live and Chalice AI onboarding [17].\n\nThese are early, partly closed-beta deployments. The pattern is consistent across at least two independent SSP fabrics (Index, PubMatic) plus a standards effort (IAB), which is why it reads as an emerging architecture rather than a single-vendor product — but the caveat is heavy: closed betas can stall, frameworks in comment can change, and present-tense \"live\" claims here rest on vendor announcements within the last 1–7 months.\n\n---\n\n## 8. Standards and governance: ARTF, OpenRTB, and the AdCP tension\n\n**So what:** A new architecture needs a rulebook, and in 2025–2026 two rival approaches emerged. The IAB Tech Lab's ARTF treats containerized/agentic bidding as an *evolution layered on OpenRTB*; the competing Ad Context Protocol (AdCP) treats agentic trading as a clean-slate *revolution*. Which standard wins shapes who controls the fabric and the take-rate.\n\nThe IAB Tech Lab's position is explicitly **evolutionary**: ARTF is \"powered by OpenRTB,\" updating real-time bidding infrastructure to accommodate agents and containerized execution while preserving the installed protocol base [14][19]. The competing **Ad Context Protocol (AdCP)** — launched October 2025 by founding companies **Scope3, Yahoo, PubMatic, Swivel, Triton, and Optable** — provides \"a shared language for agents to negotiate ad campaigns with platforms\" and is characterized, in trade coverage, as the \"burn it all down\" view that agentic trading is a *new paradigm* [14][20]. Katsur publicly questioned whether a separate body was even needed [20]. The tension is unresolved as of the IAB's February 2026 Annual Leadership Meeting, where Digiday reported it remained \"unclear… to what extent the two frameworks are compatible or competitive.\" Note the cross-membership wrinkle: PubMatic and Optable appear among AdCP's founders *and* are building containerized execution that aligns with the IAB's ARTF direction — so the camps are not cleanly drawn [20][17].\n\nThe governance stakes are commercial. Whoever defines the container interface, the host/agent security boundary, and the signaling layer (e.g., where Amazon's donated DTE fits) shapes which party owns the fabric, and therefore who captures margin as buyer logic moves in-exchange [21][14]. That margin question — who keeps the take-rate once the bidder lives inside the seller's building — is taken up later, in the chapter on the economics and commercial model. Here it is enough to flag the point: the standards fight *is* the margin fight, conducted in protocol language.\n\n---\n\n## Open Questions\n\n1. **How durable is the latency/cost advantage once everyone co-locates?** If most major buyers run containers inside the few large SSP fabrics, does the relative edge compress back to a new baseline — recreating, inside the exchange, the same competition-on-compute that egress fees once imposed outside it?\n2. **Who actually captures the freed margin?** Co-location removes egress and QPS cost, but it is unsettled whether the savings accrue to advertisers (lower CPMs), to SSPs (new hosting/compute take-rate), to the surviving DSPs, or to the new \"ad-tech middle\" players (ad networks, principal buyers) the architecture seems to favor [9].\n3. **Does this disintermediate DSPs, SSPs, both, or neither?** When a buyer's bidder runs inside an SSP, the line between DSP and SSP blurs — \"SSPs compete with legacy DSPs, and legacy DSPs compete with SSPs\" [9]. Which incumbents are structurally threatened is contested.\n4. **ARTF vs. AdCP — convergence or fork?** Will the IAB's evolutionary, OpenRTB-anchored ARTF and the clean-slate AdCP converge, interoperate, or split the market into incompatible agentic stacks? [14][20]\n5. **What is the real security/trust model?** Vendors describe cryptographically signed, tightly permissioned containers where \"DSPs receive decisions but not the logic\" and SSPs host code without seeing it [9][17]. How robust this mutual-blindness boundary is to data leakage, model theft, or auction manipulation is asserted by interested parties, not yet independently audited.\n6. **How much supply is actually reachable this way?** Co-location's value depends on each fabric's share of quality supply post-SPO; precise, independent figures for what fraction of the open market clears through Index, PubMatic, et al. were not located in this window.\n7. **Goes-stale-fastest watch:** the closed-beta and \"live\" statuses of Index Cloud, Decision Fabric, and the Zillow/Chalice pilot, and the draft status of ARTF, are the most perishable facts in this document and should be re-verified before any downstream use.\n\n---\n\n## Sources\n\n1. **OpenRTB / IAB Tech Lab history** — IAB Tech Lab, \"OpenRTB (Real-Time Bidding),\" and corroborating history of the November 2010 OpenRTB Consortium (DataXu, MediaMath, Turn; AdMeld, PubMatic, Rubicon, ContextWeb); Dec 2010 first spec; OpenRTB 2.0 June 2011; v2.1 IAB standard Jan 2012. https://iabtechlab.com/standards/openrtb/ ; cross-checked vs. pubscale.com OpenRTB guide. Accessed 2026-06-20. *Tier 1–2 (standards body + explainer).*\n2. **OpenRTB as living standard** — IAB Tech Lab standards page, OpenRTB maintained by Tech Lab. https://iabtechlab.com/standards/openrtb/ . Accessed 2026-06-20. *Tier 1.*\n3. **Waterfall, Dynamic Allocation, and \"last look\"** — MarTech, \"Countering header bidding, Google drops its 'last look' advantage\"; AdMonsters, \"Last Stand for Google's 'Last Look'\"; leaked April-2015 Google \"Why first look is crucial\" deck (surfaced via DOJ ad-tech litigation). Last Look discontinued 2018; Dynamic Allocation introduced 2007. https://martech.org/countering-header-bidding-google-drops-last-look-advantage/ . Accessed 2026-06-20. *Tier 4–5; underlying deck is Tier 1 via litigation.*\n4. **Header bidding origins (2014) and the 2015 naming** — AdExchanger, \"The Rise Of 'Header Bidding' And The End Of The Publisher Waterfall\" (2015), as recounted in setupad.com and newormedia.com histories. https://setupad.com/blog/what-is-header-bidding/ . Accessed 2026-06-20. *Tier 4 primary (AdExchanger) via Tier 5 secondary recounting.*\n5. **Prebid.js, the \"wrapper\"/\"container,\" and Prebid governance** — Prebid.org, \"Introduction to Prebid for Header Bidding.\" Prebid.js launched 2015 by AppNexus collaboration; wrapper also called \"container\"; Prebid.org independent org. https://docs.prebid.org/overview/intro.html . Accessed 2026-06-20. *Tier 1 (primary project docs).*\n6. **DSP/SSP/exchange roles** — Amazon Ads, \"What is a Supply-Side Platform (SSP)?\"; YOC, \"SSP, DSP & Ad Exchange explained.\" https://advertising.amazon.com/library/guides/supply-side-platform . Accessed 2026-06-20. *Tier 5 (vendor explainer) + Tier 5.*\n7. *(reserved)*\n8. **OpenRTB `tmax`, 80–120 ms timeouts, lost auctions** — OpenRTB v3.0 spec (tmax definition); LeadsWORK \"RTB.tmax understanding\"; Prebid timeouts docs; practitioner/engineering analysis on Google's dynamic per-request deadline (`response_deadline_ms`, not a fixed 100 ms ceiling), p99 drift = lost auctions, ~25–30 DSPs/auction, and ~70 ms tail-latency targets (figures reflect broader RTB engineering practice). https://docs.prebid.org/features/timeouts.html . Accessed 2026-06-20. *Tier 1 (spec) + Tier 5 (practitioner).*\n9. **Bedrock first containerized DSP; egress/QPS/latency mechanics; market-structure thesis** — PPC Land, \"Bedrock becomes first DSP to run its bidder inside an exchange.\" Naglak quote on per-request cost; Casale; Shevlin; 5 ms execution window; cryptographically signed containers; se — co-located execution, 80% reduction, comment window Nov 13 2025–Jan 15 2026** — IAB Tech Lab, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment\"; Katsur/Prismon/Heimlich quotes; \"powered by OpenRTB.\" https://iabtechlab.com/press-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment/ . Accessed 2026-06-20. *Tier 1 (standards body press release).*\n20. **AAMP naming (Feb 26, 2026) and AdCP tension (launched Oct 2025; Scope3, Yahoo, PubMatic, Swivel, Triton, Optable)** — PPC Land, \"IAB Tech Lab names its agentic ad initiative AAMP\"; The Current, \"IAB Tech Lab, not a fan of AdCP…\"; Digiday, \"AdCP vs. IAB Tech Lab\" (Feb 17, 2026, Tim Peterson). https://ppc.land/iab-tech-lab-names-its-agentic-ad-initiative-aamp-to-end-market-confusion/ . Accessed 2026-06-20. *Tier 5 (trade) + Tier 4 (Digiday).*\n21. **Amazon Dynamic Traffic Engine donation (April 15, 2026; DTE Cloud / Evaluator Library / Filtering)** — IAB Tech Lab press release; AdExchanger, \"Amazon Ads Hands The IAB Tech Lab A Tool That Promises To Waste Fewer Bid Requests\"; PPC Land. https://iabtechlab.com/press-releases/iab-tech-lab-announces-dynamic-traffic-engine-donation-from-amazon-ads/ . Accessed 2026-06-20. *Tier 1 (press release) + Tier 4 (AdExchanger).*\n22. **Index Cloud live status + partner roster (Bedrock, Chalice AI, inPowered AI, Nano Interactive); Bedrock launch Apr 21, 2026** — Index Exchange press release \"Bedrock Debuts Containerized DSP Deployment on Index Cloud\"; ExchangeWire (Apr 24, 2026). https://www.indexexchange.com/press/press-releases/bedrock-debuts-containerized-dsp-deployment-index-cloud/ . Accessed 2026-06-20. *Tier 1 (vendor primary) + Tier 5 (ExchangeWire).*\n\n*Analyst synthesis used and labeled inline:* Optable blog \"The Potential Impact of 'Containerized Bidding' on Ad Tech\" (Bosko Milekic, Aug 4 2025) and First Party Capital newsletter \"Containerised Bidding Arrives\" (Apr 24 2026) — Tier 5/6, vendor- and investor-authored; used for framing of margin/disintermediation, not as fact sources, lean noted."}, {"order": 2, "file": "02_Architecture_and_Plumbing.md", "title": "Architecture & Plumbing — How Containerized Bidding Actually Works", "summary": "", "body": "# Architecture & Plumbing — How Containerized Bidding Actually Works\n\n## Bottom Line\n\nContainerized bidding moves a buyer's decision logic *off* the public internet and *into* the seller's own computers. Today an exchange ships a bid request out over OpenRTB and waits 100–600 milliseconds for an answer to travel back. With containerized bidding, the buyer instead ships a sealed software package — an **OCI container**, the same Docker-style unit that runs modern cloud apps — and the exchange runs it next to the auction. When an impression appears, the exchange hands that container a slice of the signals it already holds, the container's model scores the opportunity, and it returns a decision in **under five milliseconds** (Index Exchange's stated figure for its Index Cloud, launched 21 April 2026 [1][2]). The round-trip is gone because there is no trip.\n\nThe decisive design question is not *can a container run inside an exchange* — that is solved — but *what data is the container allowed to see, and what is it forbidden to do*. The IAB Tech Lab's Agentic RTB Framework (ARTF v1.0, in public comment 13 Nov 2025 – 15 Jan 2026 [3][4]) answers the second half bluntly: agent containers run with \"no external network access — all network ingress and egress is prohibited except for service communications with the orchestrating entity\" [5]. That single sentence is the entire security model. The container is a sealed room. The host slides data under the door according to a \"least data\" rule [6], and nothing the container learns can be carried back out. This is what lets a buyer run proprietary models inside a competitor's data center — without the host stealing the model, and without the buyer exfiltrating the host's bidstream.\n\nBut sealing the room also caps the promise. Most live deployments today are **sandboxes**, not **open compute fabrics**: you can bring your *model* as an executable, but you cannot yet freely bring your *buy-side first-party data* in alongside it — \"Think Snowpark, not Docker,\" as Aqfer CTO Dan Jaye puts it [7]. The exceptions are emerging, and they are exactly where the architecture is contested: OpenX's OpenXBuild already lets Hyundai bid on \"data signals … that aren't in the bidstream\" [8]. The commercial payoff rides on one mechanic above all — co-location severs the link between **infrastructure spend and market access**. Bid-request egress at scale runs to roughly 725 TB per month for a mid-size exchange, ~90% of it spent shipping requests that get no-bids [9]; eliminating that round-trip is where the documented 80%+ networking savings come from [9][10]. Once the per-request cost \"drops to near zero,\" a small buyer can evaluate *every* impression instead of a throttled sample. That is the real disintermediation story, told in the plumbing.\n\n---\n\n## 1. The Container Itself — What Gets Packaged, and How\n\n### What a container is, decoded\n\nA **container** packs a piece of software so it runs the same everywhere. It bundles the program, its code libraries, and its runtime settings into one sealed, portable unit — but unlike a full virtual machine, it shares the host computer's operating-system kernel, which makes it lightweight and fast to start. **OCI** stands for the *Open Container Initiative*, the industry standard (the same one behind Docker) that defines the file format for these images, so any compliant runtime can run any compliant image. When the IAB Tech Lab specifies that \"agents must be structured as OCI-compliant containers manageable via Kubernetes, Docker Compose, or cloud-based systems\" [6], it is saying: package your bidder the way every modern cloud application is already packaged. Nothing exotic, nothing proprietary to ad tech.\n\nThis lowers the barrier. A buy-side engineering team that already knows how to build a Docker image and deploy it to **Kubernetes** (the dominant open-source system for running fleets of containers) does not have to learn an ad-tech-specific deployment model. The bidder is \"just\" a container.\n\n### What goes inside the image\n\nIn containerized bidding, the OCI image carries the buyer's **bidding logic** — increasingly a trained **machine-learning model** plus the code that runs it (\"inference\"). In the canonical Index Exchange framing, partners \"deploy their own models, data, and logic in isolated infrastructure adjacent to the transaction\" [11]. Concretely, the image holds four things: the scoring model (which decides how much an impression is worth), the feature-engineering code that turns raw signals into model inputs, any lookup tables or embeddings the model needs, and the bid-shaping rules. Bedrock — the first DSP to do this — describes \"model-driven bidding at scale,\" where \"each impression can be properly assessed and prioritised based on its likelihood to drive an outcome\" [12].\n\nThe load-bearing point is this: what is packaged is the *intelligence*, and the entire commercial logic of the architecture depends on that intelligence remaining the buyer's secret even while it executes on the seller's hardware.\n\n### How it's deployed\n\nDeployment follows the standard container lifecycle, with one ad-tech-specific twist: **cryptographic signing**. The buyer signs the container image with a private key; the host verifies that signature before running it. Index describes this directly: \"Code and the container image is cryptographically signed by the partner and verified by Index, and access is tightly permissioned\" [1][11]. The signature does two jobs at once. It proves the image came from the buyer, so the host can't quietly swap in tampered code, and it gives the host a basis for an audit trail. Digiday's plain-language version: containers are \"cryptographically signed to prevent tampering,\" with \"permissioning and intent-based controls to ensure that agents behave as expected\" [13].\n\n---\n\n## 2. The ARTF Host-Platform / Agent-Service Model\n\nThe IAB Tech Lab's **Agentic RTB Framework (ARTF)** exists to standardize this pattern, so it is not reinvented — incompatibly — at every exchange. Its vocabulary is worth decoding precisely, because the whole framework comes down to three nouns and a verb.\n\n### The three nouns\n\n- **Host platform** — \"the SSP, DSP, exchange, ad server, or curation platform that runs the core auction or decisioning workflow\" [14]. The host owns the data center, owns the auction, and owns the data-access decisions. In practice today the host is a sell-side platform (an SSP or exchange), because the sell side holds the impression and the bidstream.\n- **Agent service** — a \"third-party or first-party service packaged as a container\" that handles a discrete task: identity resolution, fraud detection, signal enrichment, *bidding logic*, or measurement [14]. The buyer's bidder is one kind of agent service.\n- **Container** — the \"standardized, lightweight container\" the agent service ships in, enabling \"low-latency execution\" inside the host's environment [14].\n\nThe mental model: the host is a landlord running a building (the data center) next to the marketplace (the auction). Agent services are tenants who move proprietary machinery into sealed rooms. The host decides what each tenant can see, and which of the tenant's proposed actions actually take effect.\n\n### The verb — the per-bid lifecycle\n\nThe lifecycle is easiest to picture as a flow: it has a slow path (deploy, once) and a fast path (invoke, per impression).\n\n**Deploy (once, out of band).** The buyer builds an OCI image, signs it, and registers it with the host. The host verifies the signature and provisions the container into its fabric (on Kubernetes or equivalent). The container is now resident and warm — it does *not* cold-start per bid.\n\n**Invoke (per bid opportunity, in the hot path).** When an impression becomes available, the host calls the resident container. In the ARTF reference implementation this is a single **gRPC** method — `GetMutations(RTBRequest) returns (RTBResponse)`, served on port 50051 [15]. **gRPC** is a high-performance, strongly-typed remote-procedure-call protocol, much faster than the HTTP/JSON that OpenRTB has historically used over the open internet; **Protocol Buffers** (\"protobuf\") is the compact binary serialization format gRPC carries [16][15]. The host passes the container a bid request shaped from OpenRTB v2.6 definitions [15].\n\n**Return (a bid, or more precisely a *patch*).** The agent does not hand back a free-form bid object. It returns an **OpenRTB Patch** — \"a collection of atomic 'mutations' that reference paths within the OpenRTB object,\" each tagged with an **intent** describing *why* the change is proposed [16][6]. The host then \"can accept or reject proposed mutations individually\" [16]. The ARTF reference implementation enumerates seven mutation intents: `ACTIVATE_SEGMENTS`, `ACTIVATE_DEALS`, `SUPPRESS_DEALS`, `ADJUST_DEAL_FLOOR`, `ADJUST_DEAL_MARGIN`, `BID_SHADE` (bid-price optimization), and `ADD_METRICS` (appending viewability and similar) [15].\n\nThat last design choice is subtle and important. In its v1.0 framing, ARTF is not strictly \"a DSP runs its whole bidder inside the SSP and emits a price.\" It is a *bidstream-mutation* framework: agents enrich and shape the request, and the host's auction remains the host's. A containerized DSP like Bedrock is the maximal case — its mutation is effectively the bid decision — but the framework is built so an identity vendor, a fraud vendor, and a bidder can all be co-resident agents, invoked \"sequentially or in parallel, depending on dependencies,\" with the orchestrator logging \"which agents were invoked, what mutations they proposed, and which changes were ultimately applied\" [16].\n\n### Where ARTF sits relative to OpenRTB\n\nARTF does not replace OpenRTB. It sits *below* it as an \"execution-layer framework,\" reusing OpenRTB's object model as the lingua franca for the patches [14][17]. Index Exchange chief architect Joshua Prismon framed it as \"agentic standards applied through ARTF and powered by OpenRTB\" [4]. As of March 2026, all of the Tech Lab's agentic work — ARTF, Agentic Audiences, Agentic Mobile, the Agentic Ad Object, an agent registry — was gathered under the umbrella name **AAMP (Agentic Advertising Management Protocols)**, explicitly extending rather than replacing OpenRTB, AdCOM, VAST, GPP, and TCF [18]. (The standards-layer detail and the ARTF-vs-AdCP tension are taken up later, in the chapter on standards and governance; here the only architectural point is that the container speaks OpenRTB-shaped patches, not a new bid language.)\n\n**A note on status.** ARTF is *not yet a finalized standard*. It was released for public comment on 13 November 2025; the comment window closed 15 January 2026; the Tech Lab states it \"will be finalized soon\" with \"Version 2.0 already underway\" [3][4]. Any present-tense claim that ARTF \"is the standard\" is premature as of June 2026 — it is a near-final v1.0 framework with running reference code, not a ratified specification.\n\n---\n\n## 3. The Compute Fabric — Index Cloud as the Canonical Exemplar\n\nA **compute fabric**, decoded, is just the pool of servers, networking, and orchestration a platform offers as a place to run other people's containers. The phrase signals an in-house cloud rather than a rented slice of AWS.\n\n### Index Cloud — how Index Exchange describes it\n\nIndex Exchange's **Index Cloud** is the reference implementation the whole category is named after. Index describes it as a \"neutral compute environment for decisioning closer to when impressions originate,\" where partners \"deploy their own models, data, and logic in isolated infrastructure adjacent to the transaction\" [11]. One choice defines the architecture: **Index Cloud runs in Index's own global data centers, with no third-party cloud dependency** — \"not built on GCP, AWS, or Azure\" [11][19]. Index frames this as offering \"the autonomy of the public cloud, but without the latency, signal loss, cost premiums, and added overhead of running outside\" the auction [19].\n\nThe mechanics, in Index's words: when an ad opportunity appears, \"a partner's container receives impression-level signals, applies the partner's own logic, and returns a decision, all before the bid request is constructed and sent to DSPs,\" with \"the entire execution window under five milliseconds\" [1][19]. It claims \"immediate, scaled access to 3,000+ global media owners\" across CTV, web display, online video, native, and mobile app [11].\n\n**This is the host platform's own framing.** Index is selling Index Cloud; every adjective (\"neutral,\" \"objective,\" \"your value stays yours\") is a marketing claim, not an independently verified fact. The under-5ms figure, the cryptographic-signing claim, and the \"no third-party cloud\" claim are all Index's assertions. They are reported by independent trade press (PPC Land, ExchangeWire, Adweek, Mi3 [2][12][20][21]), but the underlying performance numbers have not been independently audited as of June 2026 — a recurring caveat for this entire category, and one the later chapter on performance and the commercial model returns to in discussing the vendor-holdout problem.\n\n### The general pattern — SSPs offering in-house container runtimes\n\nIndex Cloud is the cleanest exemplar, but it is one instance of a pattern. **OpenX** offers **OpenXBuild**, a \"software suite that enables marketers to … deploy proprietary logic in real time,\" using what OpenX calls **Custom Decisioning** — buy-side models running \"as always-on bidding agents within OpenX's infrastructure, enabling rapid, impression-level decisioning without added latency\" [8][22]. OpenX differs from Index on the one architectural axis that matters most for economics. **OpenX is built entirely on Google Cloud Platform** [8], so OpenX is *renting* its fabric, where Index *owns* its data centers. That distinction reappears in §5 as a cost-structure fork.\n\nA third pattern attacks the *network* fabric rather than the *compute* fabric. **AWS RTB Fabric** (generally available, documented 16 June 2026) is \"a purpose-built network service … that replaces traditional internet-based bid routing with a dedicated infrastructure,\" connecting DSPs and SSPs \"through managed gateways optimized for OpenRTB protocol traffic\" [10]. It is explicitly *not* container execution inside an exchange — it shortens and cheapens the round-trip rather than eliminating it — but it solves the same egress-and-latency problem from the network layer, and it is a competitive reference point for the in-exchange model.\n\n**Named runtimes asserted as live (as of June 2026):**\n\n| Fabric / product | Operator | Model | Hosting | First / most-recent dated confirmation |\n|---|---|---|---|---|\n| Index Cloud | Index Exchange | In-exchange container runtime | Index's own data centers (no public cloud) | Launched 21 Apr 2026 [1][2]; Bedrock deploy confirmed 21–24 Apr 2026 [2][12] |\n| OpenXBuild / Custom Decisioning | OpenX | In-exchange container runtime | Google Cloud Platform | Hyundai pilot reported 16 Jun 2026 [8][22] |\n| AWS RTB Fabric | Amazon Web Services | Managed RTB *network* fabric (not in-exchange containers) | AWS | Documented 16 Jun 2026 [10] |\n| ARTF reference implementation | IAB Tech Lab (open source) | Spec + sample code, not a commercial runtime | GitHub (AGPL-3.0) | v1.0 public comment closed 15 Jan 2026 [3][15] |\n\n---\n\n## 4. The Data-Access & Security Boundary — The Crux\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 560\" role=\"img\" aria-label=\"An anatomical cutaway of a single ARTF bidder container welded onto the exchange host's rack. At the center sits the buyer's signed OCI container, holding its machine-learning model, inference code, and bid-shaping rules. A welded boundary seals the box: under the IAB Tech Lab ARTF v1.0 spec all ingress and egress are blocked except one channel. That single channel runs to the host: per bid opportunity the host invokes the container over gRPC and the container returns an OpenRTB-Patch of mutations to the bid object. Two side lanes show what the seal permits and forbids. The allowed lane carries host-held signals the container may read: site quality, ad ratios, video settings, refresh rate, and engagement context. The blocked lane, struck through, is the buyer's own first-party and buy-side data, which the sandbox forbids it from freely bringing in; Aqfer's CTO calls today's pilots Snowpark, not Docker. A callout warns there is no hardware trusted execution environment in ARTF v1.0, so host-opacity rests on cryptographic signing plus the egress lockdown, a policy promise rather than a cryptographic guarantee. The closing line states that the same seal protects the buyer's model and the host's bidstream while stranding the buy-side data that would make the bidder smarter.\">\n<rect x=\"8\" y=\"8\" width=\"684\" height=\"544\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--text)\">THE SEALED BOUNDARY<\/text>\n<text x=\"350\" y=\"50\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">anatomy of one ARTF container welded to the host&#8217;s metal<\/text>\n<line x1=\"40\" y1=\"62\" x2=\"660\" y2=\"62\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"40\" y=\"84\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1.5\">EXCHANGE HOST &#183; ON THE RACK<\/text>\n<rect x=\"30\" y=\"92\" width=\"640\" hei
