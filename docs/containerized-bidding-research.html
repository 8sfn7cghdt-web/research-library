 t-muted\">the buyer&#8217;s image &#183; ingress &amp; egress BLOCKED<\/text>\n<rect x=\"270\" y=\"152\" width=\"160\" height=\"30\" rx=\"2\" fill=\"none\" stroke-width=\"1.3\" style=\"stroke:var(--t1)\"/>\n<text x=\"350\" y=\"167\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--text)\">ML MODEL<\/text>\n<text x=\"350\" y=\"178\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\">the buyer trains it; the host never reads it<\/text>\n<rect x=\"270\" y=\"190\" width=\"160\" height=\"26\" rx=\"2\" fill=\"none\" stroke-width=\"1.2\" style=\"stroke:var(--t1)\"/>\n<text x=\"350\" y=\"207\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" style=\"fill:var(--text)\">INFERENCE CODE<\/text>\n<rect x=\"270\" y=\"224\" width=\"160\" height=\"26\" rx=\"2\" fill=\"none\" stroke-width=\"1.2\" style=\"stroke:var(--t1)\"/>\n<text x=\"350\" y=\"241\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" style=\"fill:var(--text)\">BID-SHAPING RULES<\/text>\n<text x=\"350\" y=\"270\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono t-muted\">runs in-cluster &#183; signing + egress lockdown =<\/text>\n<text x=\"350\" y=\"281\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t1)\">the welded boundary<\/text>\n<\/g>\n<text x=\"146\" y=\"106\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono t-muted\" letter-spacing=\"1\">HOST SIGNALS<\/text>\n<rect x=\"96\" y=\"116\" width=\"118\" height=\"124\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.3\" style=\"stroke:var(--t3)\"/>\n<text x=\"155\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t3)\">ALLOWED IN<\/text>\n<g font-size=\"8.7\" class=\"t-mono\" style=\"fill:var(--text)\">\n<circle cx=\"106\" cy=\"146\" r=\"1.8\" class=\"f-t3\"/>\n<text x=\"113\" y=\"149\">site-quality signals<\/text>\n<circle cx=\"106\" cy=\"161\" r=\"1.8\" class=\"f-t3\"/>\n<text x=\"113\" y=\"164\">ad ratios<\/text>\n<circle cx=\"106\" cy=\"176\" r=\"1.8\" class=\"f-t3\"/>\n<text x=\"113\" y=\"179\">video settings<\/text>\n<circle cx=\"106\" cy=\"191\" r=\"1.8\" class=\"f-t3\"/>\n<text x=\"113\" y=\"194\">refresh rate<\/text>\n<circle cx=\"106\" cy=\"206\" r=\"1.8\" class=\"f-t3\"/>\n<text x=\"113\" y=\"209\">engagement /<\/text>\n<text x=\"113\" y=\"220\">context fields<\/text>\n<\/g>\n<text x=\"155\" y=\"236\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-mono t-muted\">host-held &#183; host-exposed<\/text>\n<g class=\"cv-grow-right\">\n<rect x=\"214\" y=\"172\" width=\"34\" height=\"14\" rx=\"2\" class=\"f-t3\" opacity=\".82\"/>\n<\/g>\n<polygon points=\"246,165 258,179 246,193\" class=\"f-t3\"/>\n<text x=\"231\" y=\"164\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-mono\" style=\"fill:var(--t3)\">read<\/text>\n<text x=\"546\" y=\"106\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono t-muted\" letter-spacing=\"1\">BUY-SIDE DATA<\/text>\n<rect x=\"486\" y=\"116\" width=\"118\" height=\"124\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.3\" stroke-dasharray=\"4 4\" style=\"stroke:var(--t4)\"/>\n<text x=\"545\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t4)\">BLOCKED<\/text>\n<g font-size=\"8.7\" class=\"t-mono\" style=\"fill:var(--muted)\">\n<text x=\"545\" y=\"152\" text-anchor=\"middle\">first-party data<\/text>\n<line x1=\"496\" y1=\"148.5\" x2=\"594\" y2=\"148.5\" class=\"s-t4\" stroke-width=\"1.2\"/>\n<text x=\"545\" y=\"172\" text-anchor=\"middle\">buy-side audiences<\/text>\n<line x1=\"496\" y1=\"168.5\" x2=\"594\" y2=\"168.5\" class=\"s-t4\" stroke-width=\"1.2\"/>\n<text x=\"545\" y=\"192\" text-anchor=\"middle\">CRM / outcomes<\/text>\n<line x1=\"496\" y1=\"188.5\" x2=\"594\" y2=\"188.5\" class=\"s-t4\" stroke-width=\"1.2\"/>\n<\/g>\n<text x=\"545\" y=\"216\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono\" style=\"fill:var(--t4)\">no free bring-your-own<\/text>\n<text x=\"545\" y=\"229\" text-anchor=\"middle\" font-size=\"7.8\" class=\"t-mono t-muted\" font-style=\"italic\">&#8220;Snowpark, not Docker&#8221;<\/text>\n<line x1=\"486\" y1=\"179\" x2=\"454\" y2=\"179\" class=\"s-t4\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<line x1=\"468\" y1=\"172\" x2=\"476\" y2=\"186\" class=\"s-t4\" stroke-width=\"2\"/>\n<line x1=\"476\" y1=\"172\" x2=\"468\" y2=\"186\" class=\"s-t4\" stroke-width=\"2\"/>\n<text x=\"470\" y=\"166\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-mono\" style=\"fill:var(--t4)\">sealed out<\/text>\n<g class=\"cv-draw\">\n<path d=\"M350,294 L 350,316\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.4\" pathLength=\"1\"/>\n<\/g>\n<polygon points=\"344,312 350,326 356,312\" class=\"f-t2\"/>\n<rect x=\"252\" y=\"300\" width=\"196\" height=\"30\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.4\" style=\"stroke:var(--t2)\"/>\n<text x=\"350\" y=\"313\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--t2)\">THE ONE CHANNEL OUT<\/text>\n<text x=\"350\" y=\"324\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\">the only hole in the weld<\/text>\n<rect x=\"30\" y=\"350\" width=\"640\" height=\"120\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--border)\"/>\n<text x=\"48\" y=\"370\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1.5\">PER BID OPPORTUNITY &#8212; THE gRPC HANDSHAKE<\/text>\n<rect x=\"48\" y=\"384\" width=\"150\" height=\"64\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.3\" style=\"stroke:var(--t2)\"/>\n<text x=\"123\" y=\"404\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t2)\">HOST<\/text>\n<text x=\"123\" y=\"418\" text-anchor=\"middle\" font-size=\"8.3\" class=\"t-mono t-muted\">exchange invokes<\/text>\n<text x=\"123\" y=\"429\" text-anchor=\"middle\" font-size=\"8.3\" class=\"t-mono t-muted\">the container,<\/text>\n<text x=\"123\" y=\"440\" text-anchor=\"middle\" font-size=\"8.3\" class=\"t-mono t-muted\">one call per bid<\/text>\n<rect x=\"502\" y=\"384\" width=\"150\" height=\"64\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.6\" style=\"stroke:var(--t1)\"/>\n<text x=\"577\" y=\"404\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t1)\">CONTAINER<\/text>\n<text x=\"577\" y=\"418\" text-anchor=\"middle\" font-size=\"8.3\" class=\"t-mono t-muted\">scores the bid,<\/text>\n<text x=\"577\" y=\"429\" text-anchor=\"middle\" font-size=\"8.3\" class=\"t-mono t-muted\">returns mutations<\/text>\n<text x=\"577\" y=\"440\" text-anchor=\"middle\" font-size=\"8.3\" class=\"t-mono t-muted\">to the bid object<\/text>\n<path d=\"M198,402 L 502,402\" fill=\"none\" class=\"s-t2 cv-draw\" stroke-width=\"2.2\" pathLength=\"1\" stroke-dasharray=\"6 5\"/>\n<polygon points=\"498,397 510,402 498,407\" class=\"f-t2\"/>\n<text x=\"350\" y=\"396\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t2)\">gRPC invoke &#8594;<\/text>\n<path d=\"M502,432 L 198,432\" fill=\"none\" class=\"s-t1 cv-draw\" stroke-width=\"2.2\" pathLength=\"1\" stroke-dasharray=\"6 5\"/>\n<polygon points=\"202,427 190,432 202,437\" class=\"f-t1\"/>\n<text x=\"350\" y=\"446\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t1)\">&#8592; OpenRTB-Patch &#183; bid-object mutations<\/text>\n<rect x=\"30\" y=\"482\" width=\"640\" height=\"46\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.3\" stroke-dasharray=\"4 4\" style=\"stroke:var(--t3)\"/>\n<text x=\"48\" y=\"500\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--t3)\">NO HARDWARE TEE IN ARTF v1.0<\/text>\n<text x=\"48\" y=\"516\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--text)\">host-opacity rests on cryptographic <tspan style=\"fill:var(--t3)\" font-weight=\"bold\">SIGNING + egress lockdown<\/tspan> &#8212; a <tspan font-style=\"italic\">policy<\/tspan> promise, not a cryptographic guarantee<\/text>\n<text x=\"350\" y=\"546\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">The welded boundary is the whole story: it guards the buyer&#8217;s model and the host&#8217;s bidstream at once &#8212;<\/text>\n<text x=\"350\" y=\"558\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">and in sealing the box, it strands the buy-side data that would make the bidder smarter.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> Under IAB Tech Lab&#8217;s ARTF v1.0 the buyer&#8217;s bidder is a <em>sandbox, not open compute<\/em>: a signed OCI image &#8212; model, inference code, bid-shaping rules &#8212; runs on the exchange&#8217;s metal with all ingress and egress blocked except a single gRPC channel, invoked per bid opportunity and returning an OpenRTB-Patch of mutations. <em>It may read host-held signals (site quality, ad ratios, video settings, refresh rate, context) but cannot freely bring in its own first-party / buy-side data &#8212; Aqfer&#8217;s CTO calls the pilots &#8220;Snowpark, not Docker.&#8221; With no hardware TEE in v1.0, host-opacity rests on signing plus the egress lockdown: a policy promise, not a cryptographic guarantee. The same seal that protects both sides also caps the richer-signal promise &#8212; most live deployments are model-only sandboxes.<\/em><\/figcaption>\n<\/figure>\n\n\nEverything else is plumbing. *This* is the architecture's center of gravity, because it determines who can use it, who profits, and whether the performance promise survives contact with privacy law and competitive paranoia.\n\n### What the container *can* see\n\nWhen the host invokes the container, it passes a curated slice of the signals it already holds for that impression. Bedrock's deployment gives the clearest documented inventory: the container \"accesses impression-level signals already held by the SSP — time of day, page URL, browser version, operating system, carrier, and zip code — without requiring data transfer across the network\" [2]. Aqfer's Dan Jaye notes the upside: \"exchange-side containers expose richer impression context\" than a buyer typically receives in a thinned-out bid request [7]. These are **sell-side / bidstream signals** — the things the exchange sees because the impression originated on its supply: site/app context, ad-slot characteristics, device and geo, and (in fuller deployments) ad ratios, refresh rates, and viewability history that an exchange can observe but rarely forwards intact.\n\n### What the container *cannot* see — and cannot do\n\nThe hard boundary is the **egress lockdown**. The IAB Tech Lab's blueprint states it without hedging: agents \"operate with no external network access — all network ingress and egress is prohibited except for service communications with the orchestrating entity\" [6]. The ARTF reference implementation enforces it at the runtime level: containers run \"as non-root user,\" with \"read-only filesystem enforcement\" and \"no external network access\" [15]. **Egress**, decoded, is any outbound network traffic. The container cannot phone home, cannot call an external API, cannot ship data to the buyer's servers. It can only talk to the host orchestrator that invoked it.\n\nThis is the security model in one move, and it is symmetric:\n\n- **It protects the host.** The buyer's container sees host bidstream data but can never carry it out. Tony Katsur, IAB Tech Lab CEO, frames containerization as \"inherently secure\" — \"the communication channel is open, but the black box remains closed\" [17]. The host can therefore \"provide greater access to data and more interaction opportunities to service agents without concerns about leakage\" [6].\n- **It protects the buyer.** The host runs the buyer's image but, with signing plus isolation, the host receives outputs, not source. Index's formulation: \"DSPs receive decisions, not the intelligence behind them\" [1][2]. Bedrock keeps \"full control over its decisioning and bidding\" while resident inside Index [12].\n\nThe host also mediates *outputs*: \"all inputs to and outputs from agents are mediated and audited by the host, which can accept or reject proposed mutations individually,\" under a **least-data** principle where \"the host determines which fields of the bid request or related context are shared with each agent\" [16][6]. The inbound slice is rationed. The outbound patch is filtered. The host controls both doors.\n\n### Sandbox vs. open compute — the distinction that defines the present\n\nHere is the cut that matters most, and it is the single most clarifying frame in this account. People mean two very different things by \"containerized bidding,\" and most live pilots are the more limited one.\n\n| Dimension | **Sandboxed execution** (the present) | **True open compute fabric** (the promise) |\n|---|---|---|\n| What you bring in | Your *model*, as a signed executable | Your model *and* your raw buy-side data |\n| Data the container sees | Host's bidstream/impression signals only, rationed by least-data | Bidstream signals **plus** freely ingested first-party / buy-side data |\n| Network posture | Egress prohibited; sealed room | Controlled ingestion of external data permitted |\n| Analogy (Jaye) | **Snowpark** — run code where the data lives | **Docker** — full freedom to bring your own everything |\n| Buyer's first-party data | Cannot (yet) be brought in freely | Activated directly \"at the edge\" |\n| Example | Bedrock on Index Cloud (model-as-executable) | OpenXBuild's stated direction; the frontier |\n\nAqfer's Dan Jaye is the cleanest independent voice: \"many current pilots look more like sandboxed execution environments than true open compute fabrics. Think Snowpark, not Docker,\" and the binding constraint is that \"you can't yet bring in buy-side data freely\" [7]. That constraint \"constrains the bigger promises of containerized RTB\" [7]. A bidder's edge usually comes from *its own* data — conversion histories, suppression lists, audience models — and a sandbox that exposes only the seller's signals re-prices what the exchange already knows, rather than fusing it with what the buyer uniquely knows.\n\nThe frontier is moving, though, and OpenX is the documented example. In the Hyundai pilot, OpenX CTO Joel Meyer and Hyundai CMO Sean Gilpin describe the container letting the buyer \"bid on data signals and other factors that aren't in the bidstream\" [8] — Hyundai feeding in proprietary \"high-value actions\" like dealership test-drives as conversion signals, and explicitly wanting to \"own that\" model rather than rent Google's Performance Max [8]. That is the sandbox cracking open toward the buyer's own data. Whether it generalizes — and how it survives privacy law once buy-side identifiers enter a seller's environment — remains an open question, taken up later in the chapter on risks and contested claims.\n\nThis is the load-bearing point of these pages: the difference between sandbox and open compute is the difference between a modest efficiency play and a structural relocation of the bidder. Conflating the two — which vendor marketing routinely does — is the single most common error in coverage of this space.\n\n### TEEs — present in adjacent architectures, not (yet) required by ARTF\n\nA **Trusted Execution Environment (TEE)**, decoded, is a hardware-isolated \"enclave\" inside a chip where code and data stay encrypted even while in use, so not even the machine's owner or cloud administrator can read the memory [23][24]. TEEs are the gold standard for \"I'll run my data on your hardware and you still can't see it.\"\n\nTwo things are true and worth keeping distinct. First, **TEEs are heavily used in adjacent ad-tech privacy architectures.** Google made a TEE-based \"confidential matching\" the *default* for advertiser first-party data in Customer Match [25], and Google's Privacy Sandbox runs its FLEDGE/Protected Audience \"Bidding and Auction\" services inside TEEs [26]. Clean rooms (Decentriq, Duality, Azure confidential computing) lean on TEEs so that \"even the clean room provider or cloud providers cannot access the underlying information\" [23][24]. Second, **ARTF v1.0 does not require a TEE.** Its isolation model is container sandboxing plus the egress lockdown plus cryptographic signing — software and network isolation, not hardware-enclave isolation. The public ARTF technical material contains \"no mention of TEEs\" [16]. This is a meaningful gap. A software sandbox protects against accidental leakage and casual snooping, but a determined host with root on the machine is a different threat than a hardware enclave defends against. If containerized bidding moves toward true open compute — buyers ingesting raw first-party data — the pressure to adopt TEE-grade isolation will rise, because the data at risk becomes the buyer's crown jewels, not just the seller's bidstream.\n\n### Exfiltration and IP-protection concerns, both directions\n\nThe architecture creates two mirror-image fears, and both are real:\n\n- **Buyer's fear:** my model is my edge; running it on the seller's hardware risks the seller reverse-engineering it. Mitigation: the host receives *decisions, not intelligence* [1]; the image is signed; the container is isolated. But this is a *policy and isolation* guarantee, not a *cryptographic* one in ARTF v1.0 — the buyer is trusting the host's enforcement.\n- **Seller's fear (and the privacy regulator's):** a buyer's container, fed rich bidstream and possibly first-party data, could exfiltrate it. Mitigation: egress is prohibited [6][15]; outputs are mediated and audited [16]. This is exactly why the egress lockdown is the load-bearing control — it is the only thing standing between \"rich data access at the edge\" and a data-leakage incident.\n\nIn short, the egress prohibition is doing the work that, in a more mature architecture, a hardware TEE would do. It is sufficient for a model-only sandbox; it is the thing under most strain the moment buy-side data is allowed in.\n\n---\n\n## 5. Latency / QPS Mechanics — Why Co-Location Changes the Economics\n\n### Latency — the round-trip that isn't\n\nTraditional OpenRTB is an internet round-trip: the SSP serializes a bid request, sends it over the public internet to many DSPs, each DSP deserializes it, scores it, and sends a response back — all inside a hard auction timeout. IAB Tech Lab CEO Tony Katsur describes \"typical ad serving response times between 400–600 milliseconds,\" creating \"a 'time crunch'\" [17]; ARTF's own materials cite \"typical ranges of 400–800 ms\" [16]. Co-location collapses this. The ARTF target is to \"reduce bid request/response times by up to approximately 80%, … down to roughly 100 ms\" [16], and the reference implementation aims for \"low to sub-millisecond response times\" for the in-fabric agent call itself [6]. Index's claimed end-to-end container execution window is \"under five milliseconds\" [1][2]. The mechanism is trivial to state and decisive in effect. **There is no network round-trip because there is no network** — the data and the compute sit in the same data center, often the same machine or virtual machine [4].\n\n### QPS — the throttle that co-location removes\n\n**QPS** is *queries per second* — the rate at which an exchange sends bid requests to a buyer. In the traditional model, QPS is *throttled*: an exchange caps how many requests it sends each DSP, and a DSP caps how many it will accept, because every request costs money to process and transmit on both sides. The economics are brutal. A mid-size exchange generates on the order of 8.64 billion bid requests/day at ~3 KB each — roughly **725 TB of monthly egress** — and \"~90% of all inbound traffic results in no-bids\" [9]. The exchange pays full freight to ship requests that mostly come back empty; the DSP pays to receive and reject them. So both sides throttle, and a *throttled DSP sees only a sampled slice of inventory*. It literally cannot bid on impressions it never receives.\n\nCo-location dissolves the throttle. Bedrock's head of engineering, Damian Naglak, gives the cleanest statement of the mechanic: \"throttling existed because processing each bid request … carried a real per-request cost. Inside the cluster, that cost drops to near zero, so the bidder can evaluate every impression on a deal, not a sampled slice\" [2]. Per-request cost \"drops to near zero\" because the request never leaves the building — no egress byte charge, no load-balancer processing fee, no serialization-over-the-wire tax.\n\n### The decisive consequence — infrastructure spend decoupled from market access\n\nThis is the sentence the whole chapter points at. Index/Bedrock frame it as \"a shift in the cost curve of programmatic buying, reducing the dependency between infrastructure spend and market access\" [12][1]. Andrew Casale, Index Exchange CEO: \"When intelligence moves closer to the impression, the constraints that have historically limited scale begin to fall away\" [1]. Decoded: to bid on *more* inventory you historically had to *buy more infrastructure* — more servers, more bandwidth, more egress — to ingest and score more requests. Only the largest DSPs could afford to see everything; everyone else bid on a throttled sample. Co-location breaks that link. A small buyer's container can see every impression on a deal without the buyer paying internet-scale ingest costs. Bedrock's pitch is precisely this: \"Scale shouldn't be limited to the largest DSPs\" [1][12].\n\n### The egress economics, quantified\n\nThe numbers make the mechanic concrete. Public cloud egress runs ~$0.09/GB (AWS, first 10 TB) to ~$0.12/GB (GCP Premium) [9]. AWS RTB Fabric, attacking the same problem from the network layer, documents \"84% cost reduction from $13,666 per month to $2,192 per month\" for a DSP and \"65% … from $29,663 to $10,532\" for an SSP, by shifting pricing \"from per-byte to per-transaction\" and capping QPS \"at the network layer\" [10]; multiple participants report \"over 80% networking cost savings\" [9][10]. In-exchange containers go one step further than a network fabric: they eliminate the round-trip rather than optimizing it.\n\nThe cost-structure fork from §3 returns here, and it is the commercial subtlety of the whole architecture. **Who pays for the compute depends on who owns the fabric.** OpenX, on Google Cloud, *pays for the bandwidth and compute the containers consume* — \"OpenX is hosting, and therefore paying for, greater bandwidth cloud consumption\" [8]. But OpenX CTO Joel Meyer argues the trade still favors the host: that hosting cost \"is smaller than generally the egress cost of sending the bid request\" out to DSPs [8]. Index, owning its data centers, has a different and more favorable cost structure — no public-cloud egress to anyone [11][19]. Either way, the buyer offloads infrastructure cost to the seller and pays in some other coin: a take-rate, a fee, a revenue share. That is the margin-relocation question the later chapter on performance and the commercial model takes up.\n\n---\n\n## Open Questions\n\n1. **Sandbox or open compute — which wins?** Will the category remain model-as-executable sandboxes (the safe, privacy-defensible default) or move to true open compute where buyers freely ingest first-party data? OpenX's Hyundai pilot points toward the latter; ARTF's egress lockdown and the absence of TEEs point toward caution. The answer determines whether this is an efficiency tweak or a structural relocation of the bidder.\n\n2. **Does the egress lockdown survive buy-side data?** ARTF v1.0's \"no ingress/egress\" rule is sufficient for a model-only sandbox. The moment a buyer brings in raw first-party data, the threat model changes — does the architecture then *require* hardware TEEs, and who bears that cost and complexity?\n\n3. **Multi-fabric fragmentation.** Aqfer's Jaye flags that \"once every SSP spins up its own container, frequency management and deduplication get messy\" [7]. If a buyer must deploy a separate container into Index Cloud, OpenXBuild, and every other SSP fabric, the operational burden and the bidding-against-yourself problem could erode the efficiency gains. Does ARTF standardization actually solve portability, or just paper over it?\n\n4. **Is \"neutral\" verifiable?** Index calls Index Cloud \"neutral\" and says it does \"not intermediate your unique value\" [11]. Is there any independent mechanism (audit, attestation, MRC-style accreditation) to verify a host is not advantaging its own demand or peeking at tenant logic? As of June 2026 there appears to be none.\n\n5. **What is the real latency/performance number?** Every performance figure here (under-5ms, 80% reduction, the Hyundai CPA/CPM lift) originates with an interested party. No independent, controlled, holdout-validated benchmark of containerized vs. traditional bidding exists in the public record as of June 2026.\n\n6. **Does ARTF actually become the standard?** It is in near-final v1.0, with a competing AdCP approach in the field, as the chapter on standards and governance details. If the standard fragments, the \"deploy once, run anywhere\" promise of OCI portability fails at the API layer even though it holds at the container layer.\n\n---\n\n## Sources\n\n1. Index Exchange (own press release / product communications), \"Bedrock Debuts Containerized DSP Deployment on Index Cloud,\" 21 Apr 2026. https://www.indexexchange.com/press/press-releases/bedrock-debuts-containerized-dsp-deployment-index-cloud/ — **Tier 6 (host self-interest / press release)**; accessed 20 Jun 2026. Source for under-5ms, cryptographic signing, \"decisions not intelligence,\" QPS/cost-curve claims *as asserted by Index*.\n2. PPC Land, \"Bedrock becomes first DSP to run its bidder inside an exchange,\" ~Apr 2026. https://ppc.land/bedrock-becomes-first-dsp-to-run-it nXBuild/Chalice/Hyundai, GCP hosting, Meyer egress-cost quote, Gilpin \"bid on signals not in the bidstream\"/\"own that,\" buy-side data in container.\n9. AWS, \"Next-generation programmatic advertising: How AWS RTB Fabric redefines the game\" (industries blog), 16 Jun 2026 — and supporting egress-cost reporting via egresscost.com / PPC Land. https://aws.amazon.com/blogs/industries/next-generation-programmatic-advertising-how-aws-rtb-fabric-redefines-the-game/ — **Tier 6 (vendor blog) + Tier 5 (trade)**; accessed 20 Jun 2026. Egress math (725 TB/mo, ~90% no-bids), per-GB pricing, 80%+ networking savings.\n10. AWS RTB Fabric blog (as [9]) — specific cost-reduction figures (84% DSP, 65% SSP), per-byte→per-transaction, network-layer QPS cap. **Tier 6 (vendor self-interest)**; treat figures as AWS's own.\n11. Index Exchange, \"Index Cloud — Purpose-built for Programmatic\" (product page). https://www.indexexchange.com/platform/index-cloud/ — **Tier 6 (host self-interest)**; accessed 20 Jun 2026. \"Neutral compute environment,\" own-data-centers/no-public-cloud, isolation/signing, \"your value stays yours,\" 3,000+ media owners.\n12. ExchangeWire, \"Bedrock Debuts Containerised DSP Deployment on Index Cloud,\" 24 Apr 2026. https://www.exchangewire.com/blog/2026/04/24/bedrock-debuts-containerised-dsp-deployment-on-index-cloud-enabling-model-driven-bidding-at-scale/ — **Tier 5 (trade press)**; accessed 20 Jun 2026. QPS-constraint mitigation, infrastructure-spend/market-access decoupling, Shevlin/Casale quotes, model-driven bidding.\n13. Seb Joseph, \"For the agentic-curious: WTF is the Agentic RTB Framework?,\" Digiday, 13 Nov 2025. https://digiday.com/marketing/for-the-agentic-curious-wtf-is-the-agentic-rtb-framework/ — **Tier 5 (trade press explainer)**; accessed 20 Jun 2026. Plain-language host/agent/container, gRPC vs HTTP, cryptographic signing, sensitive-data-stays-in-container, 400–600ms compression.\n14. ARTF Specs, \"Technical Specs,\" artf.ai. https://artf.ai/technical-specs — **Tier 1 (primary spec, project-run)**; accessed 20 Jun 2026. Definitions of host platform / agent service / container, gRPC+protobuf, OpenRTB Patch, sandboxing, least-data, 80% latency target, v1.0 scope.\n15. IAB Tech Lab, \"agentic-realtime-framework\" reference implementation (GitHub). https://github.com/IABTechLab/agentic-realtime-framework — **Tier 1 (primary source code / .proto definitions)**; accessed 20 Jun 2026. `GetMutations` gRPC method, seven mutation intents, OpenRTB v2.6 protos, non-root/read-only-fs/no-network runtime, AGPL-3.0 license, port map.\n16. ARTF Specs technical material (as [14]) — OpenRTB Patch/mutation/intent detail, host-mediation/accept-reject, sequential/parallel orchestration, audit logging, \"no mention of TEEs.\"\n17. Allison Schiff / AdExchanger, \"The IAB Tech Lab Releases Its First Framework For Agentic Ad Buying Standards,\" 13 Nov 2025. https://www.adexchanger.com/platforms/the-iab-tech-lab-releases-its-first-framework-for-agentic-ad-buying-standards/ — **Tier 5 (trade press)**; accessed 20 Jun 2026. Katsur \"containerize the architecture\"/\"black box remains closed\"/\"inherently secure\"; 400–600ms; Index+Chalice testing.\n18. IAB UK, \"Is the future agentic?: Understanding new standards for AI in digital advertising,\" and IAB Tech Lab 2026 roadmap materials. https://www.iabuk.com/news-article/future-agentic-understanding-new-standards-ai-digital-advertising — **Tier 5/1 (trade body explainer / standards roadmap)**; accessed 20 Jun 2026. AAMP umbrella (Mar 2026), three pillars, extends-not-replaces OpenRTB/AdCOM/VAST/GPP/TCF.\n19. Index Exchange, \"Introducing Index Cloud,\" 21 Apr 2026. https://www.indexexchange.com/2026/04/21/introducing-index-cloud/ — **Tier 6 (host self-interest)**; accessed 20 Jun 2026. \"Autonomy of public cloud without latency/signal loss/cost,\" under-5ms window, deploy-receive-decide flow.\n20. Adweek, \"Index Exchange Welcomes DSPs into New Cloud Infra, Bringing Bidders Closer to h.\n26. Google Privacy Sandbox, \"protected-auction-services-docs / trusted_services_overview\" (GitHub). https://github.com/privacysandbox/protected-auction-services-docs/blob/main/trusted_services_overview.md — **Tier 1 (primary technical docs)**; accessed 20 Jun 2026. FLEDGE/Protected Audience Bidding & Auction services execute in TEEs."}, {"order": 3, "file": "03_Standards_ARTF_AAMP.md", "title": "Standards & Governance — ARTF, AAMP, and the Protocol Fault Line", "summary": "", "body": "# Standards & Governance — ARTF, AAMP, and the Protocol Fault Line\n\n## Bottom Line\n\n**Containerized bidding has a standard, and that standard has a name: the IAB Tech Lab Agentic Real-Time Framework (ARTF).** ARTF specifies how a buyer's bidding logic gets packaged as a container and run inside an exchange's own data center. It is, in effect, the rulebook for the architecture these pages are about. Released for public comment on November 13, 2025, ARTF v1.0 standardizes the \"container/host-platform pattern\": a demand- or data-side participant ships its logic as a sandboxed, OCI-compliant (Docker-class) container; the auction host runs it locally — \"within the same data center, server, or even virtual machine rather than across networks\" — and the two talk over a fast local channel instead of a public-internet round trip. The pitch is speed. The Tech Lab says ARTF is \"designed to reduce the current time for bid requests and responses up to 80%,\" which trade press rendered as cutting round trips \"from 600–800ms to approximately 100ms.\" **That number is an IAB Tech Lab design target, attributed to the Tech Lab, with no published independent benchmark** — directionally credible (removing network hops genuinely saves time) but specifically unverified, and the Lab's own materials cite mutually inconsistent figures.\n\nARTF does **not** replace OpenRTB. It extends it. Containers return changes as \"OpenRTB Patch\" deltas against the existing bid object; the host decides which to apply; the wire format leans on existing IAB taxonomies (OpenRTB, AdCOM, VAST). That continuity is the entire strategic point. ARTF lives under an umbrella the Tech Lab named **AAMP — Agentic Advertising Management Protocols — on February 26, 2026**, explicitly to \"end market confusion\" after observers kept mistaking ARTF (plus the Agentic Audiences signal schema) for the whole of the Lab's agentic program. AAMP has three pillars — execution, protocols, trust — and a set of \"agentic\" components, each mapped onto an existing IAB standard.\n\nThe real story is the **protocol fault line**. ARTF is one of two competing answers to \"how will AI agents buy media,\" and it is the answer that **preserves the demand-side stack**. It \"accelerates the existing pipes, keeps DSPs central, and gives buyers more speed without forcing them to rewire procurement.\" Its rival, **AdCP (Ad Context Protocol)** — an open standard built on Anthropic's Model Context Protocol (MCP) and stewarded by a Scope3-led coalition — \"fundamentally rewrites the system: seller agents negotiate directly with buyer agents, compressing the supply chain and shifting margin toward publishers and the SSPs that orchestrate them.\" As one trade analysis put it bluntly: \"This is not a technical disagreement. It is a fight over who sits in the middle of the next decade of advertising.\" For *containerized bidding specifically*, the alignment is clean: **containerized bidding is the ARTF-shaped architecture.** It keeps the auction, the bidstream, and the intermediary chain central; it just moves the compute next to the data. AdCP, if it wins the topology, routes *around* the auction — a different world from the one described here. IAB Tech Lab CEO Anthony Katsur backs ARTF and is cold on AdCP: he told the industry to \"expect several false starts in deploying agentic solutions\" and argued the \"fastest and smartest way forward is to build on an existing shared foundation, not introduce multiple new standards that create fragmentation.\" SSPs that sit in both camps — PubMatic most vocally — insist the two are complementary layers, not rivals. Governance sits with IAB Tech Lab, a member-funded standards body whose board is heavy with the very platforms that host containers. That is both ARTF's legitimacy and its conflict of interest. **All of this is fast-moving: ARTF and AAMP version numbers turn over in weeks, and every present-tense status below is dated.**\n\n---\n\n## 1. Why a Standard Was Needed at All\n\n**Answer first:** No single exchange can do containerized bidding alone and have it matter. For a buyer to ship its bidding logic into *many* exchanges' data centers, every exchange has to agree on the same container contract — how the logic is packaged, what it may see, how it returns a bid, what it is forbidden to do. That agreement is a standard. ARTF is that standard. Without it, \"containerized bidding\" would be a pile of incompatible one-off vendor integrations, not an architecture.\n\nThe programmatic advertising industry has a default place where this kind of agreement gets made: the **IAB Tech Lab** (Interactive Advertising Bureau Technology Laboratory), a non-profit standards body that publishes and maintains the open protocols the open-web ad market runs on — chiefly **OpenRTB** (the JSON message format demand-side platforms and supply-side platforms exchange to run a real-time auction), **AdCOM** (Ad Common Object Model, the shared data dictionary OpenRTB uses), and **VAST** (Video Ad Serving Template, the XML standard for serving video and Connected-TV ads). The Tech Lab's existence is the reason a bid request from one company's DSP is intelligible to a different company's SSP at all.\n\nSo when the question \"how should AI agents and containerized logic participate in the auction\" arrived in 2025, the Tech Lab had both the incentive and the institutional position to answer it — and a strong interest in answering it *in a way that kept its existing standards, and the supply chain built on them, at the center.* That interest is not hidden. It is the explicit design philosophy of ARTF.\n\n### 1.1 The acronyms, decoded once\n\nThis subject is acronym-dense. Decode them here and use plain language afterward:\n\n- **ARTF — Agentic Real-Time Framework.** The IAB Tech Lab spec for containerized, in-data-center execution of bidding/agent logic. (Originally announced as the \"Agentic **RTB** Framework\"; the Lab broadened \"RTB\" to \"Real-Time\" as scope grew. Same spec; older sources use \"RTB,\" newer ones \"Real-Time.\") [1][8]\n- **AAMP — Agentic Advertising Management Protocols.** The umbrella brand under which the Tech Lab groups all its agentic work, including ARTF. Named Feb 26, 2026. [12][17]\n- **AdCP — Ad Context Protocol.** A *rival* open standard — a shared language for AI agents to negotiate media deals — stewarded by a coalition led by Scope3, launched October 2025. The architectural alternative to ARTF. [27][29]\n- **MCP — Model Context Protocol.** Anthropic's open standard (Nov 2024) for connecting LLM-based agents to external tools and data. AdCP is built on top of MCP; ARTF names MCP as a supported interface. [27][1]\n- **OpenRTB / AdCOM / VAST** — the existing IAB standards (auction protocol / data dictionary / video-ad template) that ARTF extends rather than replaces. [1][15]\n- **A2A — Agent-to-Agent.** Google's protocol for agents talking to one another; named as a supported interface by both ARTF and AdCP. [27][1]\n- **DSP / SSP** — Demand-Side Platform (buys for advertisers) and Supply-Side Platform (sells for publishers). The intermediaries whose fate the fault line decides.\n\n---\n\n## 2. What ARTF Standardizes — The Container/Host Pattern\n\n**Answer first:** ARTF standardizes one architectural pattern and the contract that governs it: a **container** (the buyer's or data vendor's packaged logic) runs inside a **host platform** (the SSP/exchange that runs the auction), and a strict propose-decide-patch protocol governs what the container can do. This *is* containerized bidding's rulebook.\n\n### 2.1 The container/host-platform pattern\n\nThe IAB Tech Lab's November 13, 2025 press release describes the move plainly: ARTF enables \"technologies to interact within the same data center, server, or even virtual machine rather than across networks.\" [1] The mechanism is a **container** — a small, self-contained, portable unit of software, a vendor's sealed \"black box\" of identity-matching, fraud-scoring, or bid-optimization code. The host runs it on its own machines, co-located with the auction, instead of calling out to the vendor's separate cloud over the public internet. [1][3][6]\n\nThe containers are **OCI-compliant** — the Open Container Initiative standard, i.e., the same Docker/Kubernetes-class format the rest of the software industry uses — so they can be \"dropped in\" to host networks and orchestrated with standard tooling (Kubernetes, Docker Compose, or cloud services such as Amazon ECS). [10][15] This is the literal sense in which the architecture is \"containerized\": the unit of deployment is an OCI container.\n\n### 2.2 The host-decides asymmetry: propose, decide, patch\n\nThe flow ARTF defines is deliberately asymmetric, and that asymmetry is the load-bearing design choice for everything downstream — speed, security, and (critically) who keeps control:\n\n1. An impression triggers a bid request inside the host (the SSP/exchange).\n2. The host makes a **local** call to each applicable agent container, handing it the request. [7]\n3. Each container returns a **proposed mutation** — expressed as an **OpenRTB Patch**: atomic changes that reference paths in the OpenRTB object (add an audience segment, activate a deal ID, adjust a floor, attach a signal), each tagged with a declared **intent** (e.g., \"identity resolution,\" \"fraud detection,\" \"deal activation\"). [7][10][13]\n4. **The host decides** which mutations to merge into the live bid request, applying its own policies and least-privilege data access. The container *cannot* unilaterally change the auction. [10][13]\n\nIndex Exchange's chief architect Joshua Prismon — a named ARTF contributor — framed the value proposition this way: \"We want you to take your black box — the magic that you do really well — and express a series of changes\" without each party having to rebuild the other's infrastructure. [3] **Disclose the conflict:** Index Exchange is an SSP and an ARTF co-author that benefits as a host platform.\n\nThis \"propose, don't decide\" structure is what lets ARTF claim to *extend* OpenRTB (§3) and what fuels the critique that \"agentic\" is overstated (§7). For the standards layer it means one thing above all: **the incumbent host stays in charge.**\n\n### 2.3 The security boundary — why CTV cares\n\nARTF's technical blueprint specifies that agent containers \"operate with no external network access — all network ingress and egress is prohibited except for service communications with the orchestrating entity.\" [10] Combined with colocation, that produces a clean-room-like cell: a buyer's logic runs *next to* a seller's sensitive data, computes a result (a match, a segment, a bid adjustment), and returns only that result. The raw data never leaves the seller's perimeter.\n\nThat property is why Connected-TV (internet-delivered television) sellers are an obvious early audience for containerized bidding. Show-level and household-level viewing data is a CTV seller's crown jewel, and they have historically refused to pour it into the open bidstream for fear of leakage. ARTF's containment model targets that reluctance directly. The architecture, security, and CTV details are taken up elsewhere — in the chapters on how containerized bidding actually works, the competitive map, and the skeptic's case. The point here is narrower: the security boundary is written into the **standard**, not left to each implementer.\n\n---\n\n## 3. ARTF's Relationship to OpenRTB — Extends, Does Not Replace\n\n**Answer first:** ARTF **extends** OpenRTB (and AdCOM and VAST). It does not wrap it as a foreign black box, and it does not replace it. The unit of agentic action is an *OpenRTB Patch to an OpenRTB bid request*, so the agentic era happens *inside* the existing auction object rather than in a parallel system. This continuity is ARTF's central strategic argument — and the cleanest reason to call containerized bidding an evolutionary, not revolutionary, architecture.\n\n### 3.1 The extension, concretely\n\nThe IAB Tech Lab frames the broader roadmap as enabling \"secure, interoperable agentic execution across digital advertising **without rebuilding the market's foundational languages**.\" [16][31] The mechanism is the OpenRTB Patch: rather than inventing a new bid object, containers return additions, changes, and deletions to the existing OpenRTB request, each tagged with an intent, with mutation paths referencing AdCOM/OpenRTB semantic concepts so the changes speak the existing data dictionary. [7][13] Trade and Lab materials describe ARTF as \"extending protocols like OpenRTB, AdCOM, VAST, GPP, and TCF, rather than replacing them,\" explicitly characterized as \"evolution, not revolution.\" [31] Index Exchange's contributor statement in the launch release called it \"bringing robust, production-tested agentic standards to OpenRTB.\" [1]\n\n### 3.2 What continuity buys — and who it buys it for\n\nThis is the standards-politics heart of the matter, stated plainly:\n\n- **No rip-and-replace.** A DSP or SSP with a decade of OpenRTB integrations does not throw them away; ARTF wraps the existing investment. ARTF contributor Adam Heimlich (CEO, Chalice) contrasted this with the rival AdCP's attempt to \"standardize something that's unproven,\" positioning ARTF as built on the \"proven\" programmatic ecosystem. [4]\n- **The bidstream stays central.** Because the unit of change is an OpenRTB Patch *to a bid request*, the agentic action happens *inside the auction*, not in a separate negotiation that could bypass it. The DSP→SSP→exchange supply chain — and its take-rates — is preserved by construction.\n- **The Lab keeps the pen.** Extending its own standards keeps governance, versioning, and the GitHub repositories under IAB Tech Lab control rather than ceding the field to an outside working group (§6).\n\nKatsur put it this way: \"The fastest and smartest way forward is to build on an existing shared foundation, not introduce multiple new standards that create fragmentation.\" [16] That sentence is the whole ARTF thesis in one line — and, not coincidentally, a thesis that favors the incumbents who already own the foundation.\n\n---\n\n## 4. The Latency Claim — Load-Bearing, and Treated Skeptically\n\n**Answer first:** The famous \"up to 80% / ~100ms\" figure is an **IAB Tech Lab design target, attributed to the Tech Lab, with no published independent benchmark.** It is plausible *in principle* — removing network hops genuinely saves time — but it is best read as a standards-body/vendor claim, because (a) no third party has measured it, (b) the Lab's own materials cite at least three numbers that don't reconcile, and (c) the \"before\" baseline is itself reported inconsistently (400–600ms, 400–800ms, and 600–800ms all appear in the same news cycle).\n\n### 4.1 What the primary sources actually say\n\nThe **November 13, 2025 press release** is the most cautious primary source. ARTF is \"designed to reduce the current time for bid requests and responses up to 80%\" — and **contains no millisecond figures at all.** [1] Katsur's quoted language there is qualitative (\"a fundamental step toward modernizing how systems interact in real time\"). [1] The spec site, **artf.ai**, adds the millisecond gloss: ARTF \"is designed to reduce bid request/response times by up to approximately 80%, from typical ranges of several hundred milliseconds to around 100 ms, depending on implementation.\" [2] The hedges — \"designed to,\" \"up to approximately,\" \"depending on implementation\" — are doing real work. This is an engineering aspiration, not a measured outcome.\n\n### 4.2 The numbers don't agree with each other\n\n- **MarTech** (Nov 13, 2025) renders it \"from 600–800ms to approximately 100ms,\" explicitly attributed: \"**According to the Tech Lab**, ARTF can reduce…\" [9]\n- **AdExchanger** (Nov 2025): Katsur says \"typical ad serving response times are between **400 and 600 milliseconds**,\" with no post-ARTF figure given. [3]\n- **Digiday** (Nov 2025): \"from **400–600 milliseconds** to 'a fraction of that.'\" [6]\n- **artf.ai technical specs**: \"**400–800 ms** down to roughly 100 ms, subject to implementation.\" [15]\n- **Index Exchange** (ARTF co-author, SSP — conflict disclosed): \"up to **95%**\" reduction, container execution \"in under 10 milliseconds.\" [7]\n\nThese do not reconcile cleanly. The headline \"~80% / ~100ms\" (end-to-end round trip), Index Exchange's \"95% / <10ms\" (container execution in isolation), and the blueprint's \"low to sub-millisecond\" (local function-call overhead) span two orders of magnitude — most likely because they measure *different things*. But the spec publishes no single, defined, reproducible measurement, and **no external party has benchmarked ARTF.** [10]\n\n### 4.3 The honest verdict\n\nDirectionally credible, specifically unverified. Removing network round trips lowers latency — basic distributed-systems physics, borne out by edge- and colocated-compute analogues. But \"up to 80%\" is a ceiling, not a typical result; the realized gain depends entirely on how many network hops a given auction currently makes; and an auction already running mostly in-house saves little. **The latency figure is best read as an IAB design target, never as an established performance result.** (The quantified commercial and performance analysis comes later, in the chapter on the economics of containerized bidding; the task here is to fix the *provenance and status* of the claim.)\n\n---\n\n## 5. The AAMP Umbrella — and Why It Was Named to \"End Confusion\"\n\n**Answer first:** AAMP (Agentic Advertising Management Protocols) is the brand and governance container for *all* of the Tech Lab's agentic work, of which ARTF is one piece. The Lab created the umbrella on February 26, 2026, explicitly to stop the market from treating ARTF as the whole program.\n\n### 5.1 The naming and its stated reason\n\nOn **February 26, 2026**, in a post authored by CEO Anthony Katsur, IAB Tech Lab formally named its umbrella agentic initiative **AAMP**. [12][17] The stated reason was \"confusion in the market\": since ARTF's November 2025 release, observers had \"repeatedly treated ARTF and the Agentic Audiences Framework [formerly the User Context Protocol] as the sum total of the organization's agentic work,\" each covered in isolation, \"none of them consistently understood as part of a coordinated whole.\" [12][17] AAMP is \"the umbrella initiative under which all this work is developed in partnership with the advertising ecosystem,\" with ARTF positioned as its \"execution pillar.\" [12][17] The tagline: \"Standards for Agentic Advertising, powered by the same proven Standards that power the ecosystem today.\" [11]\n\nThe naming move matters for containerized bidding because it formally subordinates ARTF, the container architecture, to a larger program. Containerized bidding is being standardized not as a stand-alone product but as one tier of an integrated stack the Tech Lab controls end to end.\n\n### 5.2 The three pillars and the \"built-on\" map\n\nPer the IAB Tech Lab AAMP standards page (last updated April 23, 2026) and the Feb 2026 naming coverage: [11][12]\n\n| Pillar | What it covers | Key component(s) |\n| --- | --- | --- |\n| **1. Agentic Foundations** (execution) | High-performance delivery infrastructure | **ARTF** (the container architecture); Agentic Guardrails (sandboxing, verification) |\n| **2. Agentic Protocols** (management) | Schemas/tools for buyer, seller, and adtech-provider integration | Agentic Audiences, Agentic Ad Objects, Agentic Direct, Agentic Deals, Agentic Bid, etc. |\n| **3. Trust & Transparency** | Agent identity, verification, disclosure | **Agent Registry** |\n\nThe Tech Lab's design tell is consistent: each \"agentic\" component maps onto an existing IAB standard — Agentic Direct on OpenDirect, Agentic Ad Objects on AdCOM, Agentic Deals on the Deals API, Agentic Bid on OpenRTB, Agentic Audiences on the donated User Context Protocol. [11][12] The pattern is identical to ARTF's relationship with OpenRTB: extend, don't replace, and keep the existing standards — and their owners — central.\n\n### 5.3 AAMP/ARTF version status (dated, fast-moving)\n\n| Date | Event | Source |\n| --- | --- | --- |\n| **Oct 2025** | AdCP launched by Scope3-led coalition (the rival) | [27][29] |\n| **Nov 3, 2025** | LiveRamp donates User Context Protocol → IAB Tech Lab (later \"Agentic Audiences\") | [19] |\n| **Nov 13, 2025** | **ARTF v1.0 released for public comment** | [1][8] |\n| **Jan 6, 2026** | IAB Tech Lab Agentic Roadmap published; Katsur \"several false starts\" quote | [16][31] |\n| **Jan 15, 2026** | ARTF v1.0 public-comment period closes | [1][8][16] |\n| **Feb 18, 2026** | IAB ARTF standards page: comment closed, \"finalized soon,\" \"**Version 2.0 development is already underway**\" | [8] |\n| **Feb 26, 2026** | **AAMP umbrella named** \"to end market confusion\"; three pillars disclosed | [12][17] |\n| **Mar 1, 2026** | Agent Registry launches | [21] |\n| **Apr 23, 2026** | AAMP standards page last updated; **AAMP 2.0** is current | [11] |\n| **Apr 29, 2026** | **AAMP 2.0** announced: transaction-ready Buyer/Seller Agent SDKs | [20][22] |\n| **(as of Jun 2026)** | No public evidence of a finalized ARTF v2.0 or AAMP 3.0 beyond \"underway\" | [8][11] |\n\n**Version flags.** (i) ARTF's status is best described as **\"v1.0 (public comment closed Jan 15, 2026), v2.0 in active development\"** — the most recent IAB page reviewed (Apr 23, 2026) shows AAMP at 2.0 and does not confirm a published ARTF v2.0 or AAMP 3.0. Any \"current version\" claim should be dated to **April 2026 at the latest** and flagged as likely superseded. (ii) The \"RTB\"→\"Real-Time\" rename means older sources name the *Agentic RTB Framework* and newer ones the *Agentic Real-Time Framework*; same spec. (iii) Version numbers turn over in weeks; treat every present-tense capability claim here as a snapshot.\n\n---\n\n## 6. THE Protocol Fault Line — ARTF vs. AdCP\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 470\" role=\"img\" aria-label=\"A forking network-flow diagram showing two competing ad-tech standards that start from the same point but clear the trade two different ways. On the left a single shared node reads: a buyer wants an impression. The flow forks into two rows. The top row, ARTF, keeps the auction in the middle: the chain runs Advertiser slash IO to a DSP-or-buyer-agent container running inside the exchange, into the impression auction as the clearing point, then to the SSP, then to the publisher. ARTF extends OpenRTB, expressing agentic actions as OpenRTB Patch deltas, so the bidstream and the DSP-to-SSP-to-exchange chain stay central; it is backed by IAB Tech Lab, Index Exchange, Chalice, with The Trade Desk as a contributor. The bottom row, AdCP, routes around the auction: a buyer agent and a seller agent negotiate directly over MCP and A2A, with no auction node between them, and the relocated margin flows toward publishers and orchestrating agents; it is a clean-slate protocol launched October 2025, led by a Scope3 coalition including Optable, PubMatic, Swivel, Triton, and Yahoo, and notably excludes the big demand incumbents The Trade Desk, DV360, and Amazon DSP. The diagram makes plain that the two standards differ not in speed but in topology: a fight over who sits in the middle of the next decade of ad buying.\">\n<rect x=\"8\" y=\"8\" width=\"684\" height=\"454\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--text)\">TWO TOPOLOGIES<\/text>\n<text x=\"350\" y=\"50\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">same start, two ways the trade clears &#8212; through the auction, or around it<\/text>\n<g class=\"cv-fade\">\n<rect x=\"26\" y=\"190\" width=\"96\" height=\"72\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<text x=\"74\" y=\"212\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">THE SHARED START<\/text>\n<text x=\"74\" y=\"231\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--text)\">A buyer wants<\/text>\n<text x=\"74\" y=\"245\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--text)\">an impression<\/text>\n<text x=\"74\" y=\"257\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\">one trade, two routes<\/text>\n<\/g>\n<path d=\"M122,212 C 150,212 150,108 178,108\" fill=\"none\" class=\"s-t1 cv-draw\" pathLength=\"1\" stroke-width=\"2.2\"/>\n<polygon points=\"172,103 184,108 172,113\" class=\"f-t1\"/>\n<path d=\"M122,240 C 150,240 150,344 178,344\" fill=\"none\" class=\"s-t4 cv-draw\" pathLength=\"1\" stroke-width=\"2.2\"/>\n<polygon points=\"172,339 184,344 172,349\" class=\"f-t4\"/>\n<line x1=\"150\" y1=\"100\" x2=\"150\" y2=\"356\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/>\n<text x=\"350\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1.5\" style=\"fill:var(--t1)\">ARTF &#183; THROUGH THE AUCTION<\/text>\n<text x=\"690\" y=\"80\" text-anchor=\"end\" font-size=\"8.5\" class=\"t-mono t-muted\">extend muted\">&#8212; The Trade Desk contributes<\/tspan><\/text>\n<line x1=\"40\" y1=\"226\" x2=\"660\" y2=\"226\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"248\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1.5\" style=\"fill:var(--t4)\">AdCP &#183; AROUND THE AUCTION<\/text>\n<text x=\"690\" y=\"248\" text-anchor=\"end\" font-size=\"8.5\" class=\"t-mono t-muted\">clean slate &#183; launched Oct 2025<\/text>\n<g class=\"cv-rise\" style=\"--d:.12s\">\n<rect x=\"190\" y=\"304\" width=\"120\" height=\"60\" rx=\"3\" class=\"f-panel\" stroke-width=\"2.2\" style=\"stroke:var(--t4)\"/>\n<text x=\"250\" y=\"322\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\" letter-spacing=\"1\">built on MCP / A2A<\/text>\n<text x=\"250\" y=\"340\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--t4)\">BUYER AGENT<\/text>\n<text x=\"250\" y=\"355\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono t-muted\">negotiates directly<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.28s\">\n<rect x=\"450\" y=\"304\" width=\"120\" height=\"60\" rx=\"3\" class=\"f-panel\" stroke-width=\"2.2\" style=\"stroke:var(--t4)\"/>\n<text x=\"510\" y=\"322\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\" letter-spacing=\"1\">built on MCP / A2A<\/text>\n<text x=\"510\" y=\"340\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--t4)\">SELLER AGENT<\/text>\n<text x=\"510\" y=\"355\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono t-muted\">at the publisher<\/text>\n<\/g>\n<g class=\"s-t4\">\n<line x1=\"310\" y1=\"326\" x2=\"448\" y2=\"326\" stroke-width=\"2.4\" class=\"cv-draw\" pathLength=\"1\"/>\n<line x1=\"448\" y1=\"342\" x2=\"310\" y2=\"342\" stroke-width=\"2.4\" class=\"cv-draw\" pathLength=\"1\"/>\n<\/g>\n<polygon points=\"442,321 452,326 442,331\" class=\"f-t4\"/>\n<polygon points=\"316,337 306,342 316,347\" class=\"f-t4\"/>\n<text x=\"380\" y=\"320\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t4)\">direct negotiation &#8594;<\/text>\n<text x=\"380\" y=\"356\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t4)\">&#8592; terms<\/text>\n<g class=\"cv-fade\" style=\"--d:.4s\">\n<rect x=\"346\" y=\"276\" width=\"128\" height=\"20\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.1\" style=\"stroke:var(--t5)\" stroke-dasharray=\"4 3\"/>\n<text x=\"410\" y=\"290\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--t5)\">NO IMPRESSION AUCTION<\/text>\n<\/g>\n<path d=\"M384,296 C 392,300 396,300 400,304\" fill=\"none\" class=\"s-t5\" stroke-width=\"1.1\" stroke-dasharray=\"3 3\"/>\n<text x=\"640\" y=\"330\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t3)\">margin &#8594;<\/text>\n<text x=\"640\" y=\"343\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\" style=\"fill:var(--t3)\">publishers<\/text>\n<line x1=\"570\" y1=\"334\" x2=\"600\" y2=\"334\" class=\"s-t3\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/>\n<polygon points=\"596,329 606,334 596,339\" class=\"f-t3\"/>\n<rect x=\"190\" y=\"378\" width=\"380\" height=\"22\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--t4)\"/>\n<text x=\"200\" y=\"393\" font-size=\"8.5\" class=\"t-mono t-muted\" letter-spacing=\"1\">COALITION<\/text>\n<text x=\"266\" y=\"393\" font-size=\"9.5\" style=\"fill:var(--text)\">Scope3 &#183; Optable &#183; PubMatic &#183; Swivel &#183; Triton &#183; Yahoo<\/text>\n<rect x=\"190\" y=\"404\" width=\"380\" height=\"20\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--t5)\" stroke-dasharray=\"4 3\"/>\n<text x=\"200\" y=\"418\" font-size=\"8.5\" class=\"t-mono t-muted\" letter-spacing=\"1\">EXCLUDES<\/text>\n<text x=\"266\" y=\"418\" font-size=\"9.5\" style=\"fill:var(--t5)\">The Trade Desk &#183; DV360 &#183; Amazon DSP <tspan class=\"t-muted\">&#8212; the demand incumbents<\/tspan><\/text>\n<text x=\"350\" y=\"446\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">Not a speed disagreement but a topology fight &#8212; over who sits in the middle.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> The two standards share a starting point &#8212; a buyer wants an impression &#8212; and then disagree about where the trade should clear. <em>ARTF (top) keeps the auction and its intermediaries in the middle, extending OpenRTB so the bidstream and the DSP&#8594;SSP&#8594;exchange chain stay central; containerized bidding is a native citizen of this world. AdCP (bottom) is a clean-slate route-around: a buyer agent and a seller agent negotiate directly over MCP/A2A, deleting the impression auction and relocating margin toward publishers &#8212; and its coalition pointedly excludes the big demand incumbents. The fault line is not latency but topology: who sits in the middle of the next decade of ad buying, and whether the auction survives there at all.<\/em><\/figcaption>\n<\/figure>\n\n\n**Answer first:** This is the single most important thing in the standards layer, and it is **not** a technical disagreement. ARTF and AdCP encode two opposite answers to the question *who sits in the middle of the ad transaction?* ARTF **keeps the existing middle** (DSPs, the auction, the bidstream) and makes it faster by moving compute into containers. AdCP **dissolves the middle**, letting seller agents negotiate directly with buyer agents and shifting margin toward publishers. **Containerized bidding is the ARTF-aligned architecture** — it is what \"winning\" looks like for the incumbent-preserving side of this fight.\n\n### 6.1 What AdCP is (decode the rival)\n\n**AdCP (Ad Context Protocol)** is \"an open-source communication protocol that lets AI agents — whether built by advertisers, publishers, or ad tech intermediaries — interact using a common language,\" launched in **October 2025** by a coalition of 20-plus ad-tech companies. [27][29] Its founding members are **Optable, PubMatic, Scope3, Swivel, Triton Digital, and Yahoo**, with supporting members including AccuWeather, Butler/Till, LG Ads, Raptive, Samba TV, and The Weather Company. [27][29] AdCP is built on **Anthropic's Model Context Protocol (MCP)** and agent-to-agent (A2A) frameworks, and standardizes how machines \"exchange structured data about audiences, inventory, and campaign objectives.\" [27][29] Notably, the coalition does *not* include The Trade Desk, Google's DV360, or Amazon DSP — the largest demand-side incumbents. [29]\n\nThe canonical AdCP example: an advertiser tells its AI assistant \"find women interested in rock climbing in the UK,\" and **the buyer's agent communicates directly with publisher agents**, which respond with inventory and audience options. This enables \"direct\" campaigns that \"run inside publisher ad servers or through private marketplaces,\" bypassing the traditional DSP/SSP auction layer. [29] Publishers \"expose their inventory and contextual data directly to agents — with transparent deal parameters and instant feedback loops,\" reducing dependency on intermediaries. [29] **That is a topology change, not a speed optimization.**\n\n### 6.2 The fault line, stated as a fight over the middle\n\nThe cleanest articulation comes from a Broadbrand trade analysis of the split: ARTF \"accelerates the existing pipes, keeps DSPs central, and gives buyers more speed without forcing them to rewire procurement,\" while AdCP \"fundamentally rewrites the system: seller agents negotiate directly with buyer agents, compressing the supply chain and shifting margin toward publishers and the SSPs that orchestrate them.\" Its summary line is the one to remember: **\"This is not a technical disagreement. It is a fight over who sits in the middle of the next decade of advertising.\"** [32]\n\n### 6.3 The comparison table\n\n| Dimension | **ARTF** (Agentic Real-Time Framework) | **AdCP** (Ad Context Protocol) |\n| --- | --- | --- |\n| **What it is** | A containerized *execution* model for in-auction logic | A shared *negotiation language* for agent-to-agent media deals |\n| **Layer** | Transaction / execution — \"how do we execute this quickly\" | Application / negotiation — \"what should we buy and why\" |\n| **Built on** | Extends OpenRTB / AdCOM / VAST; gRPC + protobuf transport; MCP & A2A interfaces | Built on MCP (Anthropic) + A2A as substrate |\n| **Steward** | IAB Tech Lab (under the AAMP umbrella) | Scope3-led coalition (non-profit governing entity forming) |\n| **Topology** | **Keeps DSP→SSP→exchange chain central; compute moves into the host** | **Seller agents negotiate directly with buyer agents; can bypass the auction** |\n| **Margin effect** | Preserves existing supply chain and take-rates by construction | Shifts margin toward publishers; questions the DSP/SSP margin stack |\n| **Autonomy** | Containers *propose*; host *decides* | Negotiation can be genuinely agent-to-agent |\n| **Time scale** | Synchronous, millisecond (the RTB window) | Asynchronous; doesn't require millisecond decisions |\n| **Relationship to containerized bidding** | **This *is* the containerized-bidding architecture** | The architecture that routes *around* containerized auctions |\n| **Notable backers** | IAB Tech Lab; Index Exchange, Chalice, The Trade Desk contributors; Netflix/Paramount/Amazon in working group | Optable, PubMatic, Scope3, Swivel, Triton, Yahoo (no TTD/DV360/Amazon DSP) |\n\n### 6.4 Why the fault line is the spine of this account\n\nContainerized bidding is, definitionally, the ARTF answer. The architecture only makes sense in a world where the auction is still the center of gravity and the gain comes from co-locating compute with it. If AdCP's topology wins — if buyer and seller agents negotiate deals directly and the impression-level auction shrinks — then the elaborate machinery of running a buyer's container inside an exchange's data center addresses a problem that is itself receding. So the fault line is not a side debate here. It is the **existential question for the architecture.** A reader should hold both possibilities: ARTF and containerization entrench the auction and make it faster and more private; AdCP and direct negotiation could route around the auction entirely. The two are not mutually exclusive in the short run (they operate at different layers, §6.6), but their long-run topologies pull in opposite directions.\n\n### 6.5 Who backs which side, and the \"coexist\" position\n\n- **ARTF's camp** is led by IAB Tech Lab, with contributors including **Index Exchange, Chalice, and The Trade Desk** named in the launch release, and a working-group roster weighted toward CTV supply (Netflix, Paramount, Magnite, PubMatic, Amazon Ads). [1][5] Heimlich (Chalice) is the sharpest ARTF partisan, dismissing AdCP as standardizing \"something that's unproven.\" [4]\n- **AdCP's camp** is the Scope3-led coalition above. [27][29]\n- **The \"both can coexist\" position** is held most prominently by **PubMatic**, which sits in *both* camps (its leaders are on the boards of the IAB, IAB Tech Lab, and Prebid.org, and it was a founding AdCP member). PubMatic argues \"the real question is not whether one approach replaces the other, but how platforms and implementers navigate coexistence without fragmenting the market\" — AdCP at the application layer, ARTF at the transaction layer. [28] **Disclose the lean:** PubMatic, as an SSP, benefits commercially from coexistence regardless of which topology dominates, so its \"complementary layers\" framing is interest-aligned and should be read as a position, not a neutral finding.\n- **IAB Tech Lab's posture toward AdCP is cold.** Katsur called the rival effort one the industry didn't need — \"another trade group\" — and argued the Tech Lab already addresses what AdCP claims to solve. [16] His \"**several false starts**\" warning is the institutional caution: \"Although AI solutions will increasingly take shape, the industry should expect several false starts in deploying agentic solutions,\" and \"its practical application will require years of market experimentation, standardization and alignment across platforms, agencies and publishers.\" [16][31] That caution is double-edged — it manages expectations for ARTF's own slow real-world adoption while implicitly warning that AdCP is one of the false starts.\n\n### 6.6 The honest \"complementary layers\" caveat\n\nThe technical truth is that ARTF (execution) and AdCP (negotiation) operate at different layers and *could* compose: an AdCP-negotiated deal could in principle execute through an ARTF container. The \"complementary\" reading is advanced largely by SSPs that sit on both bodies and profit from coexistence, and no widely documented worked end-to-end example of the two composing in one live transaction had surfaced as of mid-2026. So the layers may be complementary *and* the long-run topologies may still be rivalrous. Speed at the bottom does not settle who captures margin at the top. The coexistence claim is best read as an (interested) position, with the margin fight left open.\n\n---\n\n## 7. The Strongest Case Against ARTF (and Therefore Against Containerized Bidding as \"The\" Answer)\n\n**Answer first:** The best critiques do not deny that colocation cuts latency. They argue that (a) ARTF **solves the wrong problem** — speed is not the binding constraint; measurement, accountability, and identity are; (b) \"agentic\" is **overstated** — the containers propose, the incumbent host decides, so nothing is autonomous and incumbents stay in control; and (c) the standard is written by infrastructure vendors, **entrenching the bidstream** it claims to modernize.\n\n### 7.1 \"Solving the wrong problem\"\n\nAd-tech executive Alanna Laforet (CEO, Laforet Productions), in ExchangeWire (March 12, 2026), makes the sharpest version: \"An industry obsessed with agent-to-agent infrastructure is skipping the harder question: for what should the agents actually be optimising?\" [25] She grants that the speed is real and calls it *strategically irrelevant*: ARTF and AdCP \"are solving for speed, scale, and interoperability while largely sidestepping the question that actually keeps CMOs up at night\" — brand suitability and accountability. On accountability: \"who is accountable when an agent makes a brand-damaging buy that was technically within spec? This question has no clean answer today — not from AdCP, not from ARTF.\" [25]\n\n### 7.2 \"Agentic is window dressing; the host still decides\"\n\nAd-tech analyst Amit Goel (who reads the actual specs; Substack, June 3, 2026) argues the autonomy claim is overstated: the containers \"are specialists that *propose*; the host platform *decides*,\" an asymmetry documented in the spec itself (§2.2) that \"preserves incumbent control.\" [26] His broader frame — \"Three protocols address execution. Zero address measurement\" — names the gap ARTF's speed focus leaves open. [26] This critique bites hardest for *containerized bidding* specifically. If the host always decides, then moving a buyer's logic into the host's data center may transfer capability and dependency to the host rather than power to the buyer.\n\n### 7.3 \"It entrenches the bidstream\"\n\nBecause ARTF's unit of work is an OpenRTB Patch *inside the auction* hosted by the incumbent SSP/exchange, value keeps flowing through the existing chain by construction. Laforet notes the coalition is \"infrastructure-first,\" with brand marketers \"largely advisory at best.\" [25] The fair ARTF rebuttal: low latency is *necessary* (it unlocks in-auction enrichment and clean-room collaboration previously impossible in the open market) even if not *sufficient*. Both can be true — which is why \"necessary ≠ sufficient\" is the honest summary.\n\n---\n\n## 8. Governance — Who Holds the Pen, and the Interoperability Risk\n\n**Answer first:** ARTF is governed by **IAB Tech Lab**, a member-funded non-profit standards body, through an open public-comment process and public GitHub repositories — but its board and working groups are populated by the very platforms that host containers, which is both its legitimacy and its conflict of interest. AdCP is governed by a forming non-profit so that \"no single company controls the protocol's evolution.\" [29] The headline governance risk is **fragmentation**: two governance bodies, two specs, two topologies, and no guarantee of interoperability.\n\n### 8.1 The ARTF process\n\nARTF followed the Tech Lab's standard path: a v1.0 draft released for public comment (Nov 13, 2025), an extended comment window (closed Jan 15, 2026), incorporation of feedback toward a final spec, and continued development of v2.0 via the Agentic Working Group. [1][8] The spec and reference implementations live on IAB Tech Lab's public GitHub (the `agentic-realtime-framework` and `AAMP` repositories). The process is genuinely open. But the working group that shaped it — Index Exchange, Chalice, The Trade Desk, and a CTV-heavy roster of sellers — are the parties that *benefit* from an incumbent-preserving standard. Open process, interested authors.\n\n### 8.2 The interoperability and concentration risks\n\n- **Two specs, one market.** With ARTF and AdCP advancing in parallel under separate stewards, an implementer may have to support both, support neither well, or bet on one. Katsur's own \"fragmentation\" warning is, ironically, the risk the *existence* of two specs creates — and IAB's refusal to adopt AdCP guarantees the duplication it warns against. [16]\n- **Host concentration.** Containerized bidding concentrates compute (and therefore dependency) in the hosts that run the fabric. A standard that says \"the host decides\" hands governance-by-default to whichever handful of exchanges achieve scale as host platforms — a market-structure question flagged here and mapped later, in the chapter on the competitive landscape.\n- **Governance capture.** A member-funded standards body whose largest members are the standard's largest beneficiaries is a familiar pattern in ad tech; the same body governs OpenRTB. It is not disqualifying, but it means the spec's neutrality should be treated as a claim to be tested, not assumed.\n\n---\n\n## Open Questions\n\n1. **Has anyone independently benchmarked ARTF's latency?** No published third-party measurement exists as of June 2026. Until one does, \"up to 80% / ~100ms\" is an IAB design target, and the *typical* (not best-case) reduction for an already-mostly-in-house auction is unknown.\n2. **Does ARTF or AdCP win the topology — and is \"coexistence\" stable?** The layers may compose technically while the margin fight stays live. Is there a documented end-to-end transaction where an AdCP-negotiated deal executes through an ARTF container?\n3. **What is the actual finalized version status?** As of late June 2026 AAMP stood at 2.0 (Apr 29) and ARTF at v1.0 with v2.0 \"underway,\" but with no confirmed published ARTF v2.0 or AAMP 3.0. The exact current version is the fastest-staling fact in these pages.\n4. **Does the host-decides asymmetry survive future versions?** Is \"propose, don't decide\" a permanent design principle (and incumbency guarantee), or does v2.0 grant containers more autonomy?\n5. **What is real adoption depth?** Named integrations and a handful of Registry entries are early signals; how many *live, production* colocated deployments process real bid volume — and how much of that is CTV?\n6. **Where does measurement live?** Goel's \"zero protocols address measurement\" — does any AAMP component close the real-time outcome-measurement loop that genuine agentic optimization requires?\n7. **Governance neutrality.** Can a member-funded body whose biggest members are the standard's biggest beneficiaries credibly arbitrate a fault line that decides those members' margins?\n\n---\n\n## Sources\n\n**Tier 1 — Primary (IAB Tech Lab / spec / press releases — read as the entity's claims, not proof of measured results)**\n\n1. IAB Tech Lab, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment,\" PRNewswire / iabtechlab.com, Nov 13, 2025. https://www.prnewswire.com/news-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment-302613712.html and https://iabtechlab.com/press-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment/ (accessed 2026-06-20). *\"Up to 80%\" design target; \"same data center, server, or even virtual machine\"; Prismon/Heimlich/Miklos named contributors; \"bringing… agentic standards to OpenRTB.\" Press release — evidence of IAB's claims only.*\n2. ARTF Specs (artf.ai), \"The Agentic Standard for Programmatic Advertising,\" IAB Tech Lab. https://artf.ai/ (accessed 2026-06-20). *\"Up to ~80%, several hundred ms → ~100 ms, depending on implementation.\"*\n8. IAB Tech Lab, \"ARTF (Agentic Real Time Framework)\" standards page. https://iabtechlab.com/standards/artf/ (last updated Feb 18, 2026; accessed 2026-06-20). *Comment closed Jan 15 2026, \"finalized soon,\" v2.0 underway.*\n10. IAB Tech Lab (Miguel Morales), \"Breaking Down the Walls: IAB Tech Lab's Blueprint for Containerized Agent-Powered Advertising.\" https://iabtechlab.com/breaking-down-the-walls-iab-tech-labs-blueprint-for-containerized-agent-powered-advertising/ (accessed 2026-06-20). *OCI/gRPC/protobuf; no-egress security; \"low to sub-millisecond\" container response.*\n11. IAB Tech Lab, \"AAMP — Agentic Advertising Management Protocols\" standards page. https://iabtechlab.com/standards/aamp-agentic-advertising-management-protocols/ (last updated Apr 23, 2026; accessed 2026-06-20). *Three pillars; component-to-standard map; AAMP 2.0 current.*\n12. IAB Tech Lab, \"Framing the Agentic Advertising Management Protocols (AAMP) Initiative\" (Katsur). https://iabtechlab.com/framing-the-agentic-advertising-management-protocols-aamp-initiati
