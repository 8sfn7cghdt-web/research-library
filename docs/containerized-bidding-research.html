--\n\n*Related reading elsewhere in these pages: the chapter on architecture and plumbing (container runtime, host/agent model, security boundary, latency/QPS mechanics) · the chapter on standards and governance (ARTF vs. AdCP fault line, OpenRTB relationship, AAMP umbrella, governance) · the chapter on performance and the commercial model (documented performance lift, the vendor-holdout caveat, take-rate quantification) · the chapter on risks and contested claims (DSP neutrality, vendor lock-in, walled-garden ceiling).*"}, {"order": 5, "file": "05_Performance_and_Commercial_Model.md", "title": "Performance & Commercial Model — The Economics of Containerized Bidding and Who Captures the Value", "summary": "", "body": "# Performance & Commercial Model — The Economics of Containerized Bidding and Who Captures the Value\n\n## BOTTOM LINE\n\nContainerized bidding has a **real, mechanically sound cost story** and a **soft, mostly unverified performance story** — and conflating the two is the central analytical error to avoid. The cost story is the load-bearing one. When a buyer's bidding logic runs as a container *inside* the exchange instead of round-tripping bid requests across the public internet, three economic forces fire at once: **latency collapses** (the IAB Tech Lab's Agentic RTB Framework claims \"up to 80%\" reduction; secondary framing puts it at 600–800ms down to ~100ms — figures that are architectural estimates, not measured benchmarks); **cloud egress fees fall toward zero** because data stops crossing priced network boundaries (a precise AWS worked example shows a DSP's monthly networking bill dropping **84%, from $13,666 to $2,192**, and an SSP's dropping **65%, from $29,663 to $10,532**, on ~259 billion requests/month); and **QPS throttling decouples from infrastructure spend**, letting a buyer evaluate every impression rather than the ~20–30% slice it could previously afford — what Index Exchange frames as breaking the link between compute budget and market access. Those are *structural* claims about plumbing and pricing, and they hold up.\n\nThe performance story is where the discipline has to bite. Every CPA/ROAS/cost-per-visit number attached to a named containerized deployment — inPowered AI's **75% reduction in cost per site visit** for an apparel retailer (Index Exchange, Feb 2026), the broader cluster of 5x–16x ROAS and 50–80% CPA-reduction claims from custom-bidding vendors — is a **vendor-run holdout or self-reported case study**. As of June 2026, **no MRC accreditation exists for containerized-bidder performance lift**; the MRC's January 2026 Digital Advertising Auction Transparency Standards govern auction *disclosure*, not lift validation, and are voluntary. Treat each performance figure as a directional vendor claim, not a measured fact.\n\nCommercially, this is a **margin-relocation event, not a margin-elimination event**. The intermediary take — roughly **53% of the advertiser dollar still does not reach the publisher** even after recent improvement (ANA Q3 2025: working media on web/mobile up from 36% in 2023 to 47.1%) — gets redistributed, not deleted. The DSP's historical 10–20% take (The Trade Desk ~20%; independents 10–15%; Amazon DSP undercutting at ~1% on some open-web inventory) is the layer under pressure, because the DSP's bidder *was* its moat and a third-party container now does the decisioning. The SSP gains a new revenue line as compute host; a new \"direct DSP\" category (Bedrock the exemplar) competes explicitly on \"dramatically lower take rates.\" **Winners: SSPs that build the fabric (Index Exchange, PubMatic, Magnite), buy-side intelligence vendors who run inside it (inPowered AI, Chalice, MiQ), and advertisers on a unit-cost basis. Losers: the standalone DSP infrastructure tier, and any intermediary whose only value was operating a remote bidder.** The thesis is most exposed where the going-concern risk is highest: every fabric named here launched or expanded within the last 6–12 months, and the commercial terms (who pays whom, and how much) remain almost entirely undisclosed.\n\n---\n\n## A note on vocabulary (every term decoded once)\n\nThis account is written for a sharp generalist, not a trade insider. The load-bearing jargon, in plain language:\n\n- **Take-rate** — the cut an intermediary keeps out of the advertiser's media dollar before it reaches the publisher. If an advertiser spends $1.00 and the publisher receives $0.80, the combined take-rate of everyone in between is 20%.\n- **Egress** — the fee a cloud provider (AWS, Google Cloud, Azure) charges to move data *out* of its network — out to the internet, to another region, or across an availability zone. Ingress (data in) is usually free; egress is metered per gigabyte. In high-volume bidding this becomes one of the largest recurring infrastructure costs.\n- **QPS** — *queries per second*. The rate at which an exchange sends bid requests to a buyer, and the rate the buyer's servers can answer. Because every query costs compute, buyers cap (throttle) how many they accept. The cap limits how much of the market the buyer can even see.\n- **Holdout** — a measurement method: split traffic so a randomized slice gets *no* containerized/optimized treatment (the holdout/control), then compare outcomes. Done rigorously and independently, it isolates the treatment's true incremental effect. Done by the vendor selling the treatment, it is suggestive but not dispositive — the vendor controls the design, the analysis, and which results get published.\n- **CPA** — *cost per acquisition* (cost per conversion: a purchase, install, sign-up, or visit). Lower is better.\n- **ROAS** — *return on ad spend* (revenue generated per dollar spent). \"5x ROAS\" means $5 of attributed revenue per $1 of ad spend. Higher is better. Both CPA and ROAS depend entirely on the attribution method underneath them.\n- **MRC** — the *Media Rating Council*, the US non-profit that audits and accredits ad-measurement methodologies (viewability, invalid-traffic detection, etc.). \"MRC-accredited\" means an independent third party audited the methodology against a written standard. It is the closest thing the industry has to an external seal — and it is conspicuously absent from containerized-bidding performance claims.\n\n---\n\n## 1. The performance lift — what is claimed, by whom, and how much to believe it\n\n### 1.1 Latency: the one number everyone cites, and where it actually comes from\n\nThe headline benefit of containerization is latency reduction, and it is the most-quoted figure in the entire category. It is also the figure most often passed around without its provenance attached.\n\nThe **authoritative source** is the IAB Tech Lab's own announcement of the Agentic RTB Framework (ARTF) v1.0, released for public comment on **November 13, 2025**. The exact wording is that ARTF can \"reduce the current time for bid requests and responses **up to 80%**\" by allowing \"technologies to interact within the same data center, server, or even virtual machine\" rather than across networks [1]. That is the only specific percentage in the primary IAB release. In the same announcement, IAB Tech Lab CEO Tony Katsur framed the *baseline* as \"typical ad serving response times... between 400 and 600 milliseconds\" under current OpenRTB [2].\n\nThe more dramatic \"**600–800ms down to ~100ms**\" framing — an ~80–87% cut — circulates widely and appears in secondary coverage, but it traces to vendor and trade-press restatement, not to a measured benchmark in the IAB spec. One trade source even cites \"up to 95%.\" The honest characterization: **the 80% figure is an architectural estimate from the standards body, not an independently measured result, and the before/after millisecond numbers vary by source.** Index Exchange's own implementation claim is tighter and more specific — the entire container execution window runs in \"**under five milliseconds**\" [3] — but that, too, is a vendor figure with no independent verification or MRC accreditation stated [3][4].\n\nWhy latency matters economically: in real-time bidding the whole auction must resolve inside a fixed timeout (`tmax`), typically a few hundred milliseconds. Every millisecond a buyer's logic spends on the network is a millisecond it cannot spend thinking. Co-locating the bidder with the auction returns that time budget to computation — which is the precondition for running heavier models (see §1.4 on the 50ms/100ms framing) without timing out. The latency claim is therefore *plausible and mechanistically sound*; it is simply not measured-and-audited the way a buyer should demand before underwriting a budget shift.\n\n### 1.2 The cost-per-outcome claims — the cluster, and the asterisk on all of them\n\nBeyond latency, vendors attach outcome numbers — CPA reductions, ROAS lifts, cost-per-visit drops — to specific containerized deployments. These are the figures that get put in front of advertisers, and they are the ones to scrutinize hardest.\n\nThe single best-documented containerized-bidding outcome claim, because it is tied to a named, dated, in-exchange deployment:\n\n> **inPowered AI / Index Exchange, \"75% reduction in cost per site visit\"** for a major apparel retailer running always-on programmatic online-video, published by Index Exchange on **February 3, 2026** [5]. inPowered built a custom predictive model on the retailer's historical DSP performance data and deployed it as a container *inside* Index's infrastructure, scoring supply-side signals (time of day, page URL, browser, OS, carrier, ZIP) in real time. The stated comparison baseline is \"traditional demand-side-only optimization.\" **Accreditation status: vendor-run case study; no holdout design disclosed, no independent third-party verification, no MRC accreditation** [5]. This is the flagship number for the in-exchange-container model specifically — and it is single-source (Index Exchange) and self-reported.\n\nThe wider custom-bidding performance literature — much of it from buy-side optimization vendors whose algorithms *can* run in a container but historically ran via DSP APIs — clusters CPA reductions in the **15–40% range with outliers toward 80%**, and ROAS multiples of **5x–16x** in performance-CTV case studies. These originate almost entirely from **vendor case-study libraries** (the same structural caveat). They are useful as evidence of *what the category claims is achievable*; they are not evidence that a given advertiser will see those results, and they should never be aggregated into a portfolio expectation. Three reasons:\n\n1. **Survivorship bias.** Published case studies are the wins. The deployments that did not move CPA do not get written up. A vendor library is a curated highlight reel, not a representative sample.\n2. **Self-controlled measurement.** A vendor-run holdout is designed, executed, and reported by the party whose product is being measured. Even with honest intent, the degrees of freedom (which campaigns, which window, which attribution model, which baseline) systematically favor the treatment.\n3. **Attribution fragility.** ROAS and CPA are only as real as the attribution underneath them. Last-click and platform-reported attribution over-credit the channel; true incrementality (geo holdouts, ghost ads) routinely shows smaller effects. The container can optimize *perfectly* against a flawed attribution signal and still over-credit conversions that would have happened anyway.\n\n### 1.3 The accreditation gap — stated plainly\n\nAs of June 2026, **there is no MRC accreditation, and no established independent-verification standard, for the *performance lift* of a containerized bidder.** This is the most important single sentence in the performance section.\n\nWhat *does* exist is adjacent and easy to confuse with it. The MRC released **Digital Advertising Auction Transparency Standards in January 2026** — the first standard formalizing how auctions must disclose pricing, bid adjustments, floor prices, bid multipliers, and bid-level reporting across RTB, OpenRTB, and CTV [6][7]. But that standard governs *auction disclosure and fee transparency*, not the validation of a lift claim, and adoption is **voluntary, via independent third-party audit** [6]. Separately, independent verification vendors have earned MRC accreditation for *measurement* functions in specific environments — e.g., IAS for third-party impression/viewability/invalid-traffic measurement on Amazon DSP in **November 2025** [8] — but that is measurement of delivery quality, not validation that a containerized bidder *caused* a CPA improvement.\n\nThe practical implication for a buyer: when a containerized-bidding vendor presents a performance number, the correct questions are (a) *Was there a randomized holdout, and who designed it?* (b) *Was incrementality measured, or is this last-click/platform-reported ROAS?* (c) *Has any third party audited the methodology?* In the current market, the honest answers are usually: a vendor-designed holdout at best; platform-reported attribution; and no.\n\n### 1.4 The one genuinely new performance mechanism: a bigger compute budget at decision time\n\nThere is a forward-looking performance argument that does *not* depend on vendor case studies, and it is worth separating out because it is the most intellectually credible part of the thesis. By collapsing network round-trips, containerization returns time to the buyer's compute budget *within* the auction window. Bedrock co-founder/CEO Shane Shevlin's framing: if models are given \"50 milliseconds or 100 milliseconds\" of in-window compute, \"they believe they can drive a level of performance on the open internet that hasn't been seen before\" [9].\n\nThis is a *prospective* claim — \"we believe\" — not a measured result, and it should be quoted as such. But it identifies a real mechanism: heavier models (deep neural nets, larger embeddings) that would time out over the public internet become feasible co-located. Whether that translates into outcome lift is exactly the unverified question §1.2–1.3 flag. The mechanism is sound; the magnitude is unproven.\n\n---\n\n## 2. Cloud-egress savings — the most concrete, best-sourced number in the category\n\nIf the performance story is soft, the egress story is hard, and it is where pushing on the numbers actually pays off. This is the part of the economic case that survives skeptical scrutiny because it follows directly from published cloud pricing.\n\n### 2.1 Why egress is a structural cost in programmatic\n\nReal-time bidding is a high-volume, low-margin, chatty workload. An SSP broadcasts each impression's bid request to many DSPs; each DSP answers (overwhelmingly with a no-bid). When the two sides sit in different clouds, regions, or even availability zones, **every one of those requests and responses crosses a metered network boundary and incurs egress charges, priced per gigabyte** [10]. At scale this is enormous: AWS's own worked example models **8.64 billion bid requests per day at ~3 KB each — 259.2 billion requests per month, ~741,580 GB (~725 TB) of monthly egress** [10]. Against per-GB transfer pricing of roughly **$0.01/GB same-region (cross-AZ), $0.02/GB cross-region, and $0.05/GB internet egress** [10], and with \"**over 90% of all DSP responses... no-bids**\" [10], a platform is paying real money to move data that produces no revenue. As the AWS authors put it, \"with profit margins measured in fractions of a cent per transaction... cost efficiency isn't just a design principle — it's a survival requirement\" [10].\n\n### 2.2 The hard numbers\n\nThere are two distinct architectures that attack egress, and keeping them straight matters:\n\n**(a) In-exchange containerization (the actual subject here).** When the buyer's container runs *inside* the exchange's cluster, the bid request never leaves the cluster — there is no internet egress on the auction round-trip. Index Exchange's framing is that per-request overhead inside the cluster falls to \"**near zero**,\" which is what lets the bidder \"evaluate every impression on a deal, rather than a sampled slice,\" because each external bid request previously \"carried a real per-request cost\" [11]. Index does not publish a dollar figure for this, so the \"near zero\" claim is directional and self-reported [11].\n\n**(b) Managed RTB networking (AWS RTB Fabric — a related but distinct play).** AWS RTB Fabric, **generally available October 23, 2025** [12], is *not* in-exchange container co-location; it is a managed network that connects ad-tech parties with single-digit-millisecond latency and per-billion-transaction pricing instead of per-GB egress [12][13]. It is the cleanest published cost data in the category because AWS modeled it explicitly:\n\n| Party | Traditional monthly egress | RTB Fabric monthly cost | Reduction |\n| --- | --- | --- | --- |\n| SSP | $29,663 | $10,532 | **65%** |\n| DSP | $13,666 | $2,192 | **84%** |\n\n*(AWS RTB Fabric worked example, ~259B requests/month; per-billion pricing of $4.50 internal / $34.00 external / $3.00 no-bid external) [10].*\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the cost case is the real one — networking-bill reduction from co-location<\/div><svg viewBox=\"0 0 700 104\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"80\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"96\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">DSP networking bill ($13,6…<\/text><rect x=\"185\" y=\"8\" width=\"373.8\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"566.8\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">84%<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">SSP networking bill ($29,6…<\/text><rect x=\"185\" y=\"42\" width=\"289.2\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"482.2\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">65%<\/text><\/svg><figcaption>AWS RTB Fabric worked example, ~259B requests/month. The cost story is verified; the performance story (CPA/ROAS lift) is vendor-reported and unaccredited. <span class=\"credit\">Source: AWS for Industries, &#x27;How AWS RTB Fabric redefines the game,&#x27; 2026-06-16 (Claim 5.1).<\/span><\/figcaption><\/figure>\n\n\n\nThe widely cited \"**up to 80% lower networking costs**\" headline [12][13] is corroborated by named customers under attribution: TripleLift (Sean Kumar, VP Infrastructure & Security) reports **>80% networking-cost reduction, 15–20% latency reduction, +30% ad spend and +30% win volume** with two integrated partners; Viant and Bigabid each report **>80% networking-cost savings**; Affle reports **80% higher network efficiency**; Azerion reports **>50% reduction in timeouts and connection errors**; Yieldmo reports **>80% timeout reduction** [14][13].\n\n### 2.3 The skeptic's asterisk on the egress number (do not skip this)\n\nThe \"80%\" figure carries a crucial qualifier that vendor decks omit. TripleLift's 80% is **against AWS's *publicly listed* pricing**. Against TripleLift's *existing negotiated AWS agreement*, the savings were only **\"20% to 25% lower costs\"** [15]. That gap matters enormously for any buyer modeling the case: large platforms already negotiate steep custom discounts off list egress pricing, so the realized saving for a sophisticated operator is materially smaller than the headline. **The 80% is a true number against the wrong baseline for most large players.** For a smaller buyer paying list prices, 80% may be closer to reality; for a hyperscale buyer on a custom contract, 20–25% is the honest figure. Any egress-savings claim should be read as \"up to 80% vs. list, ~20–25% vs. an already-negotiated rate.\"\n\nNet: egress savings are **real, large, and well-documented** — and they are the strongest plank in the economic case — but the magnitude is baseline-dependent, and the cleanest published numbers (AWS RTB Fabric) describe a *managed-network* architecture adjacent to, not identical to, in-exchange containerization.\n\n---\n\n## 3. QPS-decoupling — buying market access without buying proportional infrastructure\n\n### 3.1 The mechanism\n\nThe third economic force is the subtlest and, strategically, perhaps the most important: containerization **decouples market access from infrastructure spend.**\n\nIn the traditional model, a DSP must run enough server capacity to receive and answer bid requests at a given QPS rate. Because every request costs compute, and because over 90% of responses are no-bids [10], buyers throttle — they cap how many requests they accept and ask SSPs to send only a filtered subset. PubMatic's engineering describes the scale of the waste being managed: \"Suppose we get 50 billion impressions... and send the corresponding bid requests to 100 DSPs without any bid throttling. This would lead to a staggering **5 trillion potential bid requests**\" [16]. Throttling exists precisely because no buyer can afford to evaluate that volume. The consequence: a DSP typically sees and evaluates only a fraction of available impressions. Trade coverage of the Bedrock launch puts that fraction at \"**20% or 30% of available impressions**\" under throttling constraints [11].\n\nThe relationship is the thing to internalize: **infrastructure spend and market access have historically moved together — the more supply you want to see, the more compute you must buy.** Index Exchange's explicit pitch for Index Cloud is that it \"decouples that relationship, letting [a buyer] compete on the quality of its decisioning rather than the size of its infrastructure budget\" [11]. Inside the cluster, with per-request overhead near zero and no QPS ceiling imposed by the round-trip, a containerized buyer can evaluate the *full* impression stream [11]. Bedrock's Shevlin frames the competitive consequence directly: \"Scale shouldn't be limited to the largest DSPs. By running our bidder closer to the impression, we can participate across a broader share of available opportunities without the QPS constraints we'd otherwise face\" [3].\n\n### 3.2 Why this is an economic claim, not just a technical one\n\nQPS-decoupling is where the architecture becomes a *strategic* lever rather than a cost optimization. If market access no longer scales with infrastructure budget, then the historical advantage of the largest DSPs — they could afford to see more of the market — erodes. A small, smart buyer can now see *all* of a given exchange's supply and compete on model quality alone. This is the mechanism behind the \"scale shouldn't be limited to the largest DSPs\" thesis, and it is the most credible disruption argument in the whole category because it follows from the cost structure rather than from a case study.\n\nThe caveat: this advantage is **per-exchange**. A container inside Index sees all of Index's supply, but says nothing about OpenX, Magnite, or PubMatic supply. Full-market access still requires multi-homing across every fabric — which reintroduces an infrastructure-and-coordination cost, just relocated. QPS-decoupling removes the throttle *within* a fabric; it does not remove the cost of being present in *every* fabric.\n\n---\n\n## 4. The commercial models — who pays whom\n\nThis is the question the category most wants to avoid answering in public, and the honest finding is: **as of June 2026, the commercial terms are almost entirely undisclosed.** No fabric operator has published a price card. What follows separates the few sourced facts from the structurally likely models, and labels each.\n\n### 4.1 What is actually known (sourced)\n\n- **Index Cloud is in closed beta** with select partners; \"no pricing details disclosed... no mention of Index charging DSPs for hosting, compute fees, revenue share, take-rate, or subscription costs\" in its launch materials [4]. The architecture is described as a \"**neutral compute environment**\" where \"partners deploy their own models, data, and logic in isolated infrastructure\" [17].\n- **Bedrock is positioned as a new \"direct DSP\"** competing on \"**dramatically lower take rates**\" — but no specific percentage is published [18]. The ExchangeWire framing (June 17, 2026) names the emerging category a \"Direct Booking Engine,\" sitting \"closer to supply,\" and quotes the value redistribution as \"for advertisers, more working media per dollar; for publishers, more yield retained; for agencies, a measurable advantage on every plan\" — again with no take-rate figures attached [18].\n- **PubMatic launched Decision Fabric on AgenticOS on June 1, 2026** — a competing containerization layer that runs partner decisioning models natively inside PubMatic's supply path, piloting with **inPowered AI, MiQ, Chalice AI, and SWYM.AI** [19]. This is a press-release-stage product; no commercial terms are disclosed [19] (press release — cited as evidence of what PubMatic claims, not that the product is at scale).\n- **Magnite (ClearLine) and PubMatic (Activate)** are named alongside Index Cloud as supply-adjacent buying routes that compress the intermediary stack [18].\n\n### 4.2 The plausible commercial models (labeled as inference)\n\nBecause no operator has published terms, the following is **structured inference** from the architecture and from analogous deals, not sourced fact. Five models are observable or likely; most production deals will blend two or three:\n\n| # | Model | How the money moves | Status |\n| --- | --- | --- | --- |\n| 1 | **Hosting / compute fee** | SSP charges the buyer a flat fee per container deployment plus per-QPS or per-compute overage | *Inference* — no published Index/PubMatic price card |\n| 2 | **Revenue share on measured lift** | Container operator takes a % of CPA reduction / ROAS lift over a holdout | *Inference*, but matches the established model for buy-side optimization vendors (Scibids, Chalice) |\n| 3 | **% of media (take-rate)** | Operator charges a flat % of spend routed through the container, replacing or stacking on the DSP take | *Inference* — the \"direct DSP\" lower-take-rate positioning [18] |\n| 4 | **Per-impression / CPM premium** | A $X CPM uplift on impressions decisioned in-container | *Inference* — plausible for in-stream fraud/brand-safety/curation containers |\n| 5 | **Exclusivity / first-look premium** | Buyer pays the SSP for a privileged container slot or first look on premium supply | *Inference* — consistent with launch-partner arrangements (Index–Bedrock) |\n\nThe economically interesting combination is **#2 + #5**: pay the SSP for a privileged placement, then capture revenue share on documented lift. If it scales, that turns a buy-side container operator from a media buyer into something closer to an *algorithmic asset manager* — a structurally higher-multiple business. But this is a hypothesis about where the money *could* concentrate, not a description of signed terms, and it should be read that way.\n\n### 4.3 The going-concern caveat on every entity in §4\n\nEvery product named above is a present-tense status claim, and the category turns over fast. Index Cloud (announced April 21, 2026; closed beta) [4][17]; Bedrock as first containerized DSP (April 21, 2026) [3]; PubMatic Decision Fabric (June 1, 2026, *pilot*) [19]; inPowered AI on Index Marketplaces (case study Feb 3, 2026) [5]. The most recent confirmation for each is within the last 6 months — appropriate for a category this young — but a reader six months from now should re-verify each, because a rename, a pricing announcement, a pulled pilot, or a successor product is exactly the kind of change that silently invalidates a present-tense claim here.\n\n---\n\n## 5. The take-rate / margin waterfall — relocation, not elimination\n\nTo see who captures value, follow the advertiser dollar down the chain. The central, sourced finding: **roughly half the advertiser's dollar still does not reach the publisher, and containerization redistributes that half — it does not delete it.**\n\n### 5.1 The waterfall today (sourced)\n\nThe best primary data is the **ANA Programmatic Transparency Benchmark, Q3 2025** [20]. Headline movement: working media on web and mobile rose from **36% in 2023 to 47.1% in Q3 2025** — an 11-point gain, worth **~$13.6 billion in recovered efficiency** in a ~$123B market [20]. In CTV specifically, seller revenue rose from 74.8% to **76.2%** of total ad spending, driven mainly by a **~1.9-point drop in SSP fees** (14.7% → 12.8%) [20]. (The blended transaction-cost improvement — roughly 25.2% to 23.8% — is the overall benchmark figure; it could not be independently corroborated as a CTV-specific number, so read the CTV gain through the confirmed seller-revenue and SSP-fee lines.) So even on the optimistic, post-improvement number, **~53% of the dollar is consumed before the publisher on web/mobile**, and ~24% on CTV.\n\nThe component breakdown (per ANA Q3 2025 as summarized in trade coverage [21]): of the ~29% in platform/transaction costs in the prior reading, roughly **8% DSP transaction cost, 2% DSP additional, 6% DSP data, and 13% SSP cost** — i.e., the SSP layer is already the single largest platform slice, and the DSP's combined cut (~16%) is the layer most exposed to disintermediation. Independent verification of the *variability* comes from Adalytics' log-level work: combined DSP+SSP fees of \"**up to 35% on average**,\" with a quarter of impressions losing 46%+ to intermediaries, median single-SSP supply fee \"**approximately 20%**,\" and extreme cases where platforms retain \"**98% of a media buyer's bid**\" leaving the publisher ~2% [22]. (ISBA's 2020 baseline: ~51% of advertiser spend reached the publisher, with a notable \"unknown delta\" [22].)\n\n### 5.2 The DSP take-rate — the layer under pressure (sourced)\n\n| Buyer | Take-rate | Source / status |\n| --- | --- | --- |\n| The Trade Desk | ~20% (2024 ~20.3%; range 19–21%) | Public estimate; TTD's \"platform fee... around 20% of media cost\" [23] |\n| Independent DSPs (typical) | 10–15% | Trade-press range [24] |\n| Amazon DSP (open web) | ~1% (0% on Amazon-owned media) | Adage/eMarketer — undercutting incumbents [25] |\n| Magnite (SSP, last disclosed) | 14.5% (FY19); est. 11–13% now | Last disclosed FY19; current is analyst estimate [26] |\n| PubMatic (SSP) | est. 18–22% (never disclosed) | Analyst estimate via days-receivable method [26] |\n\nThe competitive context is decisive: in 2025, **Google, Amazon, and The Trade Desk all moved on DSP fees** for the first time in years. Amazon DSP's ~1% open-web take (vs. Google's ~4% on programmatic-guaranteed) put real pressure on TTD, whose \"fixed\" 15–20% effective fees became \"negotiable, with 1% to 2% reductions or post-auction discounts\" for agencies hitting spend thresholds [25]. **The DSP take was already compressing before containerization — containerization accelerates it by removing the DSP's algorithmic monopoly.**\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the DSP take is the layer under pressure — and it was already moving<\/div><svg viewBox=\"0 0 700 172\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">7.5<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">15<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">22.5<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">30<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">The Trade Desk (~20.3%, 20…<\/text><rect x=\"185\" y=\"8\" width=\"301.1\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"494.1\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">20.3%<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">Independent DSPs (typical)<\/text><rect x=\"185\" y=\"42\" width=\"185.4\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"378.4\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">12.5%<\/text><text x=\"175\" y=\"92\" font-size=\"13\" text-anchor=\"end\">Google (programmatic-guara…<\/text><rect x=\"185\" y=\"76\" width=\"59.3\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.10s\"/><text x=\"252.3\" y=\"92\" font-size=\"12.5\" class=\"t-muted\">4%<\/text><text x=\"175\" y=\"126\" font-size=\"13\" text-anchor=\"end\">Amazon DSP (open web)<\/text><rect x=\"185\" y=\"110\" width=\"14.8\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.15s\"/><text x=\"207.8\" y=\"126\" font-size=\"12.5\" class=\"t-muted\">1%<\/text><\/svg><figcaption>Estimated DSP take-rate (% of media cost). Amazon&#x27;s ~1% open-web rate had already turned TTD&#x27;s &#x27;fixed&#x27; fee negotiable before containerization arrived. <span class=\"credit\">Source: TTD investor materials; Adage/eMarketer 2025 (Claims 5.9, 5.10).<\/span><\/figcaption><\/figure>\n\n\n\n### 5.3 The margin waterfall under containerization (the exhibit)\n\nPutting it together — a stylized $1.00 advertiser dollar on open-web/CTV programmatic, \"before\" reflecting the ANA/Adalytics-anchored status quo and \"after\" reflecting the *direction* of containerized restructuring (the \"after\" column is directional inference, since no operator publishes terms):\n\n```\n                          TRADITIONAL              CONTAINERIZED (directional)\nADVERTISER  $1.00         $1.00                    $1.00\n  │\n  ├─ Agency fee           ~$0.10 (10%)             ~$0.10   (unchanged)\n  │\n  ├─ Buy-side intel /     (bundled in DSP or       ~$0.03–0.08  NEW EXPLICIT LINE\n  │   container operator    managed-service fee)     (perf. fee / rev-share on lift)\n  │\n  ├─ DSP take             ~$0.15–0.20              ~$0.01–0.10   ▼ COMPRESSES\n  │                        (TTD ~20%; indies          (Amazon 1%; \"direct DSP\"\n  │                         10–15%)                     lower take; bidder no\n  │                                                      longer the moat)\n  │\n  ├─ SSP take             ~$0.13–0.20              ~$0.13–0.20 + hosting  ▲ EXPANDS\n  │                        (SSP cost ~13% ANA;         (adds compute-host\n  │                         ~20% median Adalytics)      revenue line)\n  │\n  ├─ Data / verification  ~$0.06–0.08              ~$0.06–0.08   (roughly flat)\n  │\n  └─ PUBLISHER receives   ~$0.47 (web/mobile)      ~flat to modestly higher\n                          ~$0.76 (CTV)              (less \"unknown delta\";\n                                                     more impressions evaluated)\n```\n\nThe waterfall makes the thesis legible: **the DSP slice shrinks, the SSP slice grows (it adds a hosting line on top of its take), a new explicit buy-side-intelligence line appears, and the publisher is roughly flat-to-better.** Total intermediary take does not collapse — it *relocates* from the DSP tier toward the SSP-plus-intelligence tier. The advertiser's gain, if any, comes from better unit economics (more outcome per dollar) rather than from a dramatically smaller stack.\n\n---\n\n## 6. Unit economics — containerized bidder vs. remote-cloud bidder\n\nThe cost-structure comparison is where the egress (§2) and QPS (§3) findings combine into the operating-model difference. This is a stylized cost-driver comparison (the absolute dollars are illustrative; the *direction and relative magnitude* of each line are sourced above):\n\n| Cost driver | Remote-cloud bidder (traditional) | Containerized bidder (in-exchange) | Source basis |\n| --- | --- | --- | --- |\n| **Network / egress** | High — per-GB egress on every request/response across the public internet; ~725 TB/mo at scale | **Near zero on the auction round-trip** (data stays in-cluster) | AWS worked example; Index \"near zero\" [10][11] |\n| **Compute** | Sized to a *throttled* QPS; only ~20–30% of supply evaluated | Sized to evaluate *full* supply, but per-request overhead near zero in-cluster | [11][16] |\n| **Latency budget** | Network eats much of `tmax`; lighter models only | More of `tmax` returned to compute; heavier models feasible | ARTF \"up to 80%\"; <5ms window [1][3] |\n| **Market access** | Scales *with* infrastructure spend (more supply = more compute) | **Decoupled** from infrastructure spend (within a fabric) | [11] |\n| **Hosting / platform fee** | Cloud bill paid to AWS/GCP/Azure | New fee paid to the *SSP* as compute host | Inference — no price card [4] |\n| **Multi-homing cost** | One bidder reaches many exchanges over the network | One container *per fabric*; coordination/dedup cost across fabrics | Inference from per-exchange scope (§3.2) |\n| **Operating dependency** | Buyer controls its own cloud | Buyer dependent on SSP's runtime, SLAs, and (eventual) pricing power | Inference (§7) |\n\nThe unit-economics punchline: **containerization trades a large, variable, network-dominated cost base for a smaller, compute-dominated one — and trades cloud-vendor dependency for SSP dependency.** The buyer that previously paid AWS for egress now pays (or will pay) the SSP for hosting; the dollar moves, and the *counterparty with pricing power* moves with it. For a buyer with a defensible model and first-party data, the trade is attractive: more supply evaluated, lower network cost, heavier models. For a buyer whose only asset was a remote bidder, the trade is existential — the thing it sold is now a commodity container slot.\n\n---\n\n## 7. The value-chain restructuring thesis — is this an unbundling event, and who wins?\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 560\" role=\"img\" aria-label=\"An anatomy of how containerization unbundles the demand-side platform and relocates its margin. On the left, the historical DSP bundle is drawn as three stacked layers in a single sealed case: the bidder — the decisioning model plus the compute that runs it — is the bottom layer and the moat that justified the take-rate; above it sits supply access, the integrations into the exchanges; and on top sits the commercial relationship with agencies and advertisers. A curved arrow lifts the bidder layer out of the bundle as a portable sealed container and sets it down inside the seller's rack. Three consequences follow: supply access migrates to the SSP because the SSP is the supply; the bidder becomes a substitutable container slot; and the commercial relationship is up for grabs. On the right, a before-and-after stacked bar of the advertiser dollar. Before, the publisher receives about forty-seven percent, the DSP take is about sixteen percent, the SSP take is roughly thirteen to twenty percent, and the rest is other intermediary fees. After containerization, the DSP slice shrinks under pressure, a new explicit buy-side-intelligence line appears, and the SSP gains a new compute-hosting line on top of its existing take, while the publisher stays flat to slightly better near forty-seven percent. The margin does not vanish — it relocates. But a closing twist notes that the same deploy-once portability that drives adoption also commoditizes the hosting rent, so the relocated margin is most likely competed toward zero rather than captured into a new seat.\">\n<rect x=\"8\" y=\"8\" width=\"684\" height=\"544\" rx=\"3\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"32\" text-anchor=\"middle\" font-size=\"16\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--text)\">UNBUNDLING THE DSP<\/text>\n<text x=\"350\" y=\"50\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">pull out the one defensible layer &#8212; and the margin relocates, it does not vanish<\/text>\n<line x1=\"338\" y1=\"64\" x2=\"338\" y2=\"470\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 4\"/>\n<text x=\"172\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1.5\" style=\"fill:var(--t1)\">THE BUNDLE COMES APART<\/text>\n<text x=\"518\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1.5\" style=\"fill:var(--t3)\">THE DOLLAR RELOCATES<\/text>\n<text x=\"40\" y=\"100\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">HISTORICAL DSP BUNDLE &#8212; ONE SEALED CASE<\/text>\n<rect x=\"40\" y=\"108\" width=\ ss=\"t-mono t-muted\" letter-spacing=\"1\">THE ADVERTISER DOLLAR &#8212; ANA Q3 2025<\/text>\n<text x=\"406\" y=\"120\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--t5)\">BEFORE<\/text>\n<text x=\"600\" y=\"120\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--t1)\">AFTER<\/text>\n<g class=\"cv-grow-up\">\n<rect x=\"376\" y=\"132\" width=\"60\" height=\"113\" rx=\"2\" class=\"f-t5\" opacity=\".82\"/>\n<rect x=\"376\" y=\"245\" width=\"60\" height=\"38\" rx=\"2\" class=\"f-t3\" opacity=\".85\"/>\n<rect x=\"376\" y=\"283\" width=\"60\" height=\"40\" rx=\"2\" class=\"f-t2\" opacity=\".7\"/>\n<rect x=\"376\" y=\"323\" width=\"60\" height=\"29\" rx=\"2\" class=\"f-t4\" opacity=\".55\"/>\n<\/g>\n<rect x=\"376\" y=\"132\" width=\"60\" height=\"220\" rx=\"2\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"406\" y=\"192\" text-anchor=\"middle\" font-size=\"11\" class=\"t-mono t-inv\" font-weight=\"bold\">~47%<\/text>\n<text x=\"406\" y=\"268\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono t-inv\" font-weight=\"bold\">~16%<\/text>\n<text x=\"406\" y=\"307\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\" style=\"fill:var(--text)\">13&#8211;20%<\/text>\n<g class=\"cv-grow-up\">\n<rect x=\"570\" y=\"138\" width=\"60\" height=\"113\" rx=\"2\" class=\"f-t5\" opacity=\".82\"/>\n<rect x=\"570\" y=\"251\" width=\"60\" height=\"20\" rx=\"2\" class=\"f-t3\" opacity=\".85\"/>\n<rect x=\"570\" y=\"271\" width=\"60\" height=\"20\" rx=\"2\" class=\"f-t1\" opacity=\".9\"/>\n<rect x=\"570\" y=\"291\" width=\"60\" height=\"40\" rx=\"2\" class=\"f-t2\" opacity=\".7\"/>\n<rect x=\"570\" y=\"331\" width=\"60\" height=\"19\" rx=\"2\" class=\"f-t1\" opacity=\".55\"/>\n<\/g>\n<rect x=\"570\" y=\"138\" width=\"60\" height=\"212\" rx=\"2\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"600\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" class=\"t-mono t-inv\" font-weight=\"bold\">~47%<\/text>\n<text x=\"600\" y=\"266\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-inv\" font-weight=\"bold\">DSP&#8595;<\/text>\n<text x=\"600\" y=\"285\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-inv\" font-weight=\"bold\">INTEL<\/text>\n<text x=\"600\" y=\"345\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-inv\" font-weight=\"bold\">HOST&#43;<\/text>\n<path d=\"M442,189 C 500,189 512,195 564,195\" fill=\"none\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<path d=\"M442,266 C 500,266 512,261 564,261\" fill=\"none\" class=\"s-t3 cv-draw\" pathLength=\"1\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"/>\n<polygon points=\"560,257 568,261 560,265\" class=\"f-t3\"/>\n<text x=\"503\" y=\"252\" text-anchor=\"middle\" font-size=\"7.5\" class=\"t-mono\" style=\"fill:var(--t3)\">DSP take compresses<\/text>\n<g font-size=\"9\" class=\"t-mono\">\n<rect x=\"362\" y=\"368\" width=\"312\" height=\"80\" rx=\"3\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--border)\"/>\n<text x=\"374\" y=\"384\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">READING THE SHIFT<\/text>\n<rect x=\"374\" y=\"392\" width=\"9\" height=\"9\" rx=\"1.5\" class=\"f-t3\" opacity=\".85\"/>\n<text x=\"389\" y=\"400\" font-size=\"9\" style=\"fill:var(--text)\">DSP take (~16%; TTD ~20%) &#8212; the layer under pressure, already<\/text>\n<text x=\"389\" y=\"411\" font-size=\"9\" style=\"fill:var(--text)\">compressing pre-container (Amazon DSP ~1% open-web rate)<\/text>\n<rect x=\"374\" y=\"418\" width=\"9\" height=\"9\" rx=\"1.5\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"389\" y=\"426\" font-size=\"9\" style=\"fill:var(--text)\">SSP gains a <tspan class=\"t-mono\" style=\"fill:var(--t1)\">compute-hosting<\/tspan> line on top of its take; a new explicit<\/text>\n<text x=\"389\" y=\"437\" font-size=\"9\" style=\"fill:var(--text)\"><tspan class=\"t-mono\" style=\"fill:var(--t1)\">buy-side-intelligence<\/tspan> line appears &#8212; publisher (~47%) flat-to-better<\/text>\n<\/g>\n<line x1=\"40\" y1=\"468\" x2=\"660\" y2=\"468\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"486\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--t4)\">THE TWIST &#8212; THE MODAL FORECAST<\/text>\n<text x=\"350\" y=\"504\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-mono\" style=\"fill:var(--text)\">ARTF&#8217;s deploy-once portability commoditizes the hosting rent by the very mechanism that drives adoption<\/text>\n<line x1=\"120\" y1=\"520\" x2=\"580\" y2=\"520\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"538\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">The auction moved; the margin map mostly didn&#8217;t &#8212; the freed rent is more likely competed to zero<\/text>\n<text x=\"350\" y=\"552\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">than captured into a new seat.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> Containerization unbundles the DSP by pulling out its one defensible asset &#8212; the bidder &#8212; and the margin it frees relocates rather than vanishes. <em>Supply access migrates to the SSP (which is the supply), the bidder becomes a substitutable container slot, and the commercial tie is up for grabs; on the dollar, the DSP take (~16%; TTD ~20%) compresses while the SSP adds a compute-hosting line and a new buy-side-intelligence line appears, the publisher (~47%) flat-to-better. But because the container is portable by the same deploy-once mechanism that drives adoption, that relocated rent is more likely competed to zero than captured into a new seat &#8212; the auction moved; the margin map mostly didn&#8217;t.<\/em><\/figcaption>\n<\/figure>\n\n\n### 7.1 The thesis stated\n\nContainerized bidding is best understood as **the unbundling of the DSP.** Historically a DSP bundled three things: (1) the *bidder* (the decisioning algorithm and the compute that runs it), (2) *supply access* (integrations with exchanges), and (3) the *commercial/account relationship* with agencies and advertisers. The bidder was the moat — it was where the \"intelligence\" lived and what justified the take-rate. Containerization pulls the bidder out of that bundle and lets a third party (or the buyer itself) run decisioning logic *inside the SSP*, co-located with supply. Once the bidder is a portable container, the DSP's bundle decomposes: supply access migrates toward the SSP (it is the supply), the bidder becomes substitutable, and the commercial relationship is up for grabs.\n\n### 7.2 Who wins, who loses\n\n**Winners:**\n- **SSPs that build the fabric** (Index Exchange / Index Cloud; PubMatic / Decision Fabric; Magnite / ClearLine). They become the compute host with a new revenue line *and* the gravitational center of supply access. The SSP layer was already the largest platform slice (~13% ANA, ~20% Adalytics median); hosting fees stack on top [20][22][4][19].\n- **Buy-side intelligence vendors that run inside the fabric** (inPowered AI, Chalice AI, MiQ, SWYM.AI as named pilot/case-study partners) [5][19]. Their algorithm becomes directly deployable and separately priceable, no longer hidden inside a DSP's bidder.\n- **\"Direct DSPs\"** (Bedrock the exemplar) that natively containerize and compete on lower take-rates [18]. First-mover, natively-containerized economics may compound faster than incumbents can retrofit.\n- **Advertisers, on a unit-cost basis** — *if* the performance claims are real (the §1 caveat). More supply evaluated, lower network cost, potentially better outcome-per-dollar.\n\n**Losers:**\n- **The standalone DSP *infrastructure* tier.** When the bidder is a commodity container slot, a DSP whose value was operating a remote bidder has little left to charge for. This is the layer the ~16% combined DSP take (§5.1) is exposed to, and it is the layer already compressing under Amazon/Google fee cuts [25].\n- **Pure managed-service intermediaries** whose only function was operating a remote bidder for a client — unless they reposition as the buy-side intelligence layer (the MiQ move: become a named container partner [19]).\n- **The \"open internet\" as a structurally diverse market**, at the margin: containerization concentrates volume in whichever SSPs offer the fabric, creating concentration risk for buyers and publishers alike.\n\n### 7.3 The counter-case (the thesis is not inevitable)\n\nThree forces push back, and a sober reading states them:\n\n1. **DSP-native AI may match the lift.** The Trade Desk (Kokai), DV360, and Amazon (Performance+) are investing heavily in their own bidder AI. If DSP-native optimization delivers comparable outcomes *and* the DSP keeps the agency relationship and supply integrations, the median buyer never leaves — and containerization stays a niche for performance-critical campaigns.\n2. **SSP dependency may be worse than cloud dependency.** Moving from a neutral cloud (AWS) to an SSP-owned runtime hands pricing power and data-access governance to a party that is also a counterparty in the auction. Once an SSP sees the volume running through its containers, it can renegotiate. The \"neutral compute environment\" framing [17] is a claim, not a guarantee.\n3. **The performance substrate is weak upstream.** Containerization solves latency and signal-access *at the auction point*. It does nothing for the identity-and-measurement problems *upstream* of the auction (taken up later, in the chapter on risks and contested claims). If the audience signal feeding the container is decayed, no amount of co-location rescues the outcome — and the ROAS/CPA claims rest on that substrate.\n\n---\n\n## 8. Synthesis — what a buyer should actually believe\n\n1. **The cost case is real; the performance case is unproven.** Egress savings (§2) and QPS-decoupling (§3) are mechanically sound and reasonably sourced. The CPA/ROAS lift (§1) is vendor-run, single-source, and unaccredited. Underwrite the former; demand proof on the latter.\n2. **Egress savings are large but baseline-dependent.** \"Up to 80%\" is vs. list pricing; ~20–25% vs. an already-negotiated cloud contract [15]. Model both.\n3. **This is margin relocation, not elimination.** ~53% of the web/mobile dollar still misses the publisher [20]. The DSP slice shrinks; the SSP-plus-intelligence slice grows; the publisher is roughly flat-to-better.\n4. **The commercial terms are undisclosed.** No fabric operator has published a price card as of June 2026. Every \"who pays whom\" model in §4.2 is inference. The single most valuable thing a buyer can do is *get the term sheet*.\n5. **The dependency moves with the dollar.** Containerization trades cloud-vendor dependency for SSP dependency — and the SSP is also a counterparty in the auction.\n6. **Going-concern risk is acute.** Every fabric, pilot, and deployment named here is ≤6 months old. Re-verify status before quoting it.\n\n---\n\n## OPEN QUESTIONS\n\n1. **What are the actual commercial terms?** No operator (Index, PubMatic, Magnite) has published a price card. Is it a hosting fee, a CPM premium, a revenue share on lift, a stacked take-rate — and at what level? This is the single largest evidence gap in the account.\n2. **Will any containerized-bidding performance lift ever be MRC-accredited or independently replicated?** As of June 2026, none is. Will the MRC's January 2026 auction-transparency standard evolve toward lift validation, or will the category remain self-reported?\n3. **How much of the 75% cost-per-visit (inPowered) and the 5x–16x ROAS cluster survives a rigorous, independent incrementality test (geo holdout / ghost ads) rather than a vendor-run, platform-attributed one?**\n4. **For a hyperscale buyer on a negotiated cloud contract, is the realized egress saving closer to 20–25% than 80% — and does that change the build/deploy decision?**\n5. **Does QPS-decoupling actually let small buyers compete with large DSPs, or does the per-fabric scope (and the cost of multi-homing across every fabric) reintroduce the scale advantage it claims to remove?**\n6. **Where does pricing power settle?** If SSPs become the compute host *and* the supply gateway, do they renegotiate terms against buy-side container operators once volume is captive — and what stops them?\n7. **What is the realistic SAM, and at what take?** Crisp, primary market-sizing (IAB IAR, eMarketer, GroupM/MAGNA) for the containerizable corridor (CTV + retail media + premium open-web) and a defensible take-rate assumption are needed to size the revenue pool — this account deliberately did not invent one.\n\n---\n\n## SOURCES\n\n1. IAB Tech Lab, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment,\" press release, 2025-11-13. https://iabtechlab.com/press-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment/ — *Tier 1 (standards body / primary). The \"up to 80%\" latency-reduction figure and Jan 15 2026 comment deadline.* Accessed 2026-06-20.\n2. AdExchanger (A. Vargas / staff), \"The IAB Tech Lab Releases Its First Framework For Agentic Ad Buying Standards,\" 2025-11-13. https://www.adexchanger.com/platforms/the-iab-tech-lab-releases-its-first-framework-for-agentic-ad-buying-standards/ — *Tier 5 (specialized trade press). Katsur's \"400–600ms\" baseline; no commercial terms.* Accessed 2026-06-20.\n3. Index Exchange, \"Bedrock Debuts Containerized DSP Deployment on Index Cloud,\" press release, 2026-04-21. https://www.indexexchange.com/press/press-releases/bedrock-debuts-containerized-dsp-deployment-index-cloud/ — *Tier 1 (press release — evidence of claim, not proof). <5ms window; QPS framing; Shevlin/Casale quotes; no performance metric, no accreditation.* Accessed 2026-06-20.\n4. Index Exchange, ng: How AWS RTB Fabric redefines the game,\" AWS for Industries blog (S. Pahwa, G. Louw), 2026-06-16. https://aws.amazon.com/blogs/industries/next-generation-programmatic-advertising-how-aws-rtb-fabric-redefines-the-game/ — *Tier 1/5 (vendor technical blog with worked example). 8.64B requests/day, 3KB/bid, 725TB/mo; per-GB tiers ($0.01/$0.02/$0.05); SSP 65% & DSP 84% reductions; per-billion pricing; >90% no-bids.* Accessed 2026-06-20.\n11. PPC Land, \"Bedrock becomes first DSP to run its bidder inside an exchange\" (same as [9], cited for the QPS-decoupling and \"evaluate every impression\" framing). Accessed 2026-06-20.\n12. AWS, \"Now generally available: AWS RTB Fabric for real-time bidding workloads,\" What's New, 2025-10-23. https://aws.amazon.com/about-aws/whats-new/2025/10/aws-rtb-fabric-generally-available/ — *Tier 1 (company). GA date; single-digit-ms; \"up to 80% lower networking costs\"; six regions.* Accessed 2026-06-20.\n13. AWS, \"Introducing AWS RTB Fabric for real-time advertising technology workloads,\" AWS News Blog (A. Vargas), 2025-10-23. https://aws.amazon.com/blogs/aws/introducing-aws-rtb-fabric-for-real-time-advertising-technology-workloads/ — *Tier 1 (company). Per-billion-transaction pricing; named partners; managed-network (not container co-location).* Accessed 2026-06-20.\n14. AWS, \"AWS RTB Fabric customers,\" product page. https://aws.amazon.com/rtb-fabric/customers/ — *Tier 1 (company — customer-attributed claims). TripleLift (Kumar) 15–20% latency / +30% spend / +30% win / >80% networking; Viant, Bigabid >80%; Affle 80% efficiency; Azerion >50% timeout/error; Yieldmo >80% timeout.* Accessed 2026-06-20.\n15. AdExchanger (A. Vargas), \"AWS Launches A Cloud Infrastructure Service For Ad Tech,\" 2025-10-23. https://www.adexchanger.com/platforms/aws-launches-a-cloud-infrastructure-service-for-ad-tech/ — *Tier 5 (specialized trade press). CRITICAL: TripleLift 80% is vs. AWS list pricing; only 20–25% vs. its existing negotiated AWS agreement. f ANA Q3 2025 component breakdown (8% DSP transaction / 2% DSP additional / 6% DSP data / 13% SSP). Component split via search aggregation of ANA Q3 2025 coverage; cross-reference the ANA primary PDF [20] for the headline figures. *Tier 5 — component split is secondary; headline figures are primary in [20].* Accessed 2026-06-20.\n22. Adalytics, \"How much in fees are ad tech companies charging publishers & advertisers?\" https://adalytics.io/blog/adtech-supply-fees — *Tier 5 (independent analytics research). Combined DSP+SSP up to ~35% avg; median single-SSP ~20%; extremes 98% retained / 2% to publisher; ISBA 2020 ~51% reaches publisher.* Accessed 2026-06-20.\n23. MediaPlanningTool / Quo Vadis analysis of TTD take-rate, 2026. https://www.mediaplanningtool.com/the-trade-desk/pricing/ — *Tier 5 (analyst/trade estimate). TTD ~20.3% (2024); 19–21% range; \"~20% of media cost.\" Cross-reference TTD 10-K for primary.* Accessed 2026-06-20.\n24. The Drum, \"Understanding programmatic fees,\" 2025-04-29. https://www.thedrum.com/opinion/2025/04/29/understanding-programmatic-fees-will-help-you-get-the-most-ad-spend — *Tier 5/6 (trade opinion). Typical independent-DSP fee 10–15%.* Accessed 2026-06-20.\n25. Adage, \"Google, Amazon and The Trade Desk cut DSP fees to win ad dollars,\" 2025; corroborated by eMarketer, \"The Trade Desk loosens fees as Amazon DSP pressure intensifies.\" https://adage.com/technology/ad-tech/aa-google-amazon-trade-desk-cut-dsp-fees-to-win-ad-dollars/ — *Tier 4/5 (trade press). Amazon DSP ~1% open web (0% owned) vs Google ~4%; TTD effective 15–20% now negotiable with 1–2% reductions.* Accessed 2026-06-20.\n26. Quo Vadis / Triscari, \"#43: Magnite + PubMatic, unknown take rates,\" 2023-04-04. https://www.quovadisnews.com/p/43-magnite-pubmatic-unknown-take — *Tier 5 (analyst newsletter — ESTIMATE, not disclosure). Magnite last-disclosed 14.5% (FY19); estimated current Magnite ~11–13%, PubMatic ~18–22%; derived via days-receivable method.* Accessed 2026-06-20.\n\n---\n\n*Tier discipline note: The structural cost claims (egress, QPS, take-rate waterfall) rest on Tier 1–2 primary sources (AWS worked examples, ANA primary study, IAB/MRC standards). The performance-lift claims rest on Tier 1 press releases and case studies cited explicitly as **evidence of what a vendor claims**, never as proof the claim is true — and every one is flagged as vendor-run and unaccredited. The commercial-model section separates the few sourced facts from clearly labeled inference, because no operator has published terms. SSP take-rates [26] are analyst estimates, not disclosures, and are labeled as such.*"}, {"order": 6, "file": "06_Risks_and_Contested_Claims.md", "title": "Risks & Contested Claims — The Skeptic's Case", "summary": "", "body": "# Risks & Contested Claims — The Skeptic's Case\n\n## BOTTOM LINE\n\nStrip away the launch-day enthusiasm and containerized bidding faces eight distinct objections. Most are real but survivable. **Three are load-bearing — they go at the root of the value proposition, not the edges.**\n\n**First, the richer-signal promise is mostly unredeemed today.** The whole pitch is that co-locating a buyer's model with the auction lets it bid on *more* signal. But the live deployments are sandboxes. You bring your model as a signed executable, and the host decides which fields of the bid request it sees. You cannot freely bring your own buy-side or first-party data in. Aqfer's CTO Dan Jaye, no enemy of the architecture, says the quiet part plainly: \"many current pilots look more like sandboxed execution environments than true open compute fabrics... you can't yet bring in buy-side data freely. Until that changes, the bigger promises of containerized RTB will remain constrained\" [1]. In the flagship Zillow pilot, the container saw page-quality signals the SSP already held — ad ratio, sound settings, refresh rate — not the advertiser's CRM [2]. That is a real and valuable use case. It is not the \"richer signal\" story being sold.\n\n**Second, the performance thesis rests on an identity substrate that is decaying — and co-locating the algorithm does nothing to fix it.** The CTV performance claims lean on connecting an IP address to a household. A November 2025 study by Truthset for CIMM and Go Addressable, benchmarking nearly a billion IP records against ground truth from two ISPs and a virtual MVPD, found IP-to-postal linkages accurate **13% of the time** and IP-to-email **16%** [3]. Their cascade math: of a dollar of media, **three cents** reaches the intended audience once IP, postal, email, and demographic error compound [3]. A faster, closer algorithm fed bad identity produces fast, confident, wrong decisions. The auction was never the bottleneck.\n\n**Third, the performance numbers themselves are vendor holdouts, not accredited measurement.** The MRC's January 2026 Digital Advertising Auction Transparency Standards cover auction *mechanics* — first- vs. second-price, floors, bid adjustments — and explicitly *not* performance, incrementality, or lift [4]. The MRC's own SVP confirms transparency accreditation \"is completely separate from other MRC accreditations,\" and incrementality standards remain under development [4]. Every \"132% conversion lift / 57% lower CPA\"-style figure in this category is, as of mid-2026, a marketed result, not an audited one.\n\nThe other five risks — cross-fabric frequency chaos, vendor lock-in, DSP neutrality, the walled-garden ceiling, and privacy/antitrust — range from genuine-but-bounded to genuine-and-unsolved. The cross-fabric frequency problem (the same impression appearing in every SSP's container, the buyer bidding against itself) is the one structural risk the architecture's own proponents concede has no fix yet [1]. The walled-garden ceiling is a hard mathematical cap: containerization addresses the open internet, roughly 20-30% of programmatic spend, while the gardens take 70-80% and are projected to *gain* share [5]. Where the evidence actually lands: containerized bidding is a **genuine latency-and-compute improvement** wrapped in **overstated signal-and-performance claims**, sitting on a **decaying identity foundation** it does not address, in a **shrinking addressable market**. The plumbing is real. The miracle is not.\n\n---\n\n## How to read this chapter\n\nThis is the critical voice. The affirmative case — the latency wins, the egress savings, the architecture — is made elsewhere; here the aim is to break the thesis. For each of eight risks it states the **strongest version** of the objection, the **counter-argument** a proponent would offer, and **which way the evidence leans**. Op-eds and vendor statements are tagged by the author's commercial interest, because in ad tech nobody is disinterested. Where a risk names a specific product or pilot, it carries a date — this category is young and fast, and present-tense status is exactly what goes stale.\n\nA note on neutrality: the affirmative case is mostly made by people who sell the architecture (Index Exchange, Bedrock, Chalice) or sell into it (clean-room and data vendors). The skeptical case here leans heavily on **primary measurement studies** (Truthset/CIMM), **regulators** (the FTC, the EU), **standards bodies' own documents** (the ARTF spec, MRC standards), and the **conceded limitations of proponents themselves** (Aqfer, Casale). That asymmetry is deliberate. Facts beat positions.\n\n---\n\n## Risk 1 — Sandboxed execution vs. open compute: the richer-signal promise is mostly unredeemed\n\n### The strongest version\n\nThe headline pitch for containerized bidding is *signal access*. In traditional OpenRTB, a buyer's bidder lives in its own cloud and receives a bid request over the wire; QPS and egress costs force it to throttle, and it never combines the request with the full weight of its own first-party data at auction time without expensive data movement. Move the bidder *inside* the exchange, the story goes, and it can decision against richer signal, closer to the impression, at lower cost.\n\nHere is the problem. **The production deployments are sandboxes, not open compute fabrics.** The IAB Tech Lab's own Agentic RTB Framework (ARTF) v1.0 specification — the standard the whole category is built on — describes \"least-privilege data access\" in which \"the host determines which fields of the bid request or related context are shared with each agent,\" agents \"interact with the bidstream through a standardized API that exposes only the data needed for a given task,\" and the host \"mediates all inputs to and outputs from agents\" [6]. Agents run in \"sandboxed containers\" with cryptographic image signing [6]. You bring a model. You do **not** bring a data lake.\n\nAqfer CTO Dan Jaye — whose firm sells ad-tech data infrastructure and therefore has no incentive to talk down the architecture — states the limitation directly: \"many current pilots look more like sandboxed execution environments than true open compute fabrics... you can't yet bring in buy-side data freely. Until that changes, the bigger promises of containerized RTB will remain constrained\" [1]. The marketing framing, from a clean-room vendor (Optable, commercial interest in data collaboration), is that containers enable \"privacy-first\" activation \"directly and securely at the edge\" [7] — but that is the *aspiration*, and the spec confirms the current reality is host-gated inputs.\n\nThe flagship public pilot proves the point. When Zillow piloted containerized RTB with Chalice and Index Exchange (announced August 2025), the container analyzed signals the *SSP* already held — \"ad ratio per page, default sound settings for video ads, refresh rates, organic video length, and data broker calls,\" per Sally Lee, VP of programmatic at Canvas Worldwide, the agency on the account [2]. Zillow's VP of media Ed Wild framed the win as showing up in \"environments where we are proud to show up\" — a *brand-suitability and inventory-quality* outcome, not a first-party-data-activation outcome [2]. That is genuinely useful. It is also a much smaller claim than \"richer signal.\"\n\nSo the skeptic's charge: as deployed in 2026, the architecture is a **better place to run a fraud check, a brand-safety filter, or a supply-quality model** — things that depend on signals the host already has — and a **worse fit than advertised for the buy-side-data-rich performance bidding** that justifies the strategic excitement. The gap between sandboxed execution and open compute \"guts much of the richer-signal promise,\" and closing it requires either trusting the host with your data (which buyers resist) or a confidential-compute mechanism that does not yet exist in the spec.\n\n### The counter-argument\n\nThree rebuttals. **(a) Latency and compute are real wins regardless of data.** Even sandboxed, the architecture removes egress costs and the QPS ceiling. Index Exchange CEO Andrew Casale: \"The most exciting and realistic win that we're already seeing with the Bedrock bidder is that QPS caps open up dramatically\" [8] — meaning a buyer can now *evaluate the full bidstream* rather than a throttled fraction, which is itself a signal-access gain (more *impressions* seen, even if not more *data per impression*). **(b) The sandbox is a feature, not a bug, for some buyers.** Firms with strong first-party data can, in principle, activate it \"at the edge\" without exporting it to a data marketplace — the privacy-preserving framing [7]. **(c) It's early.** ARTF v2.0 is already in progress, and confidential-compute / trusted-execution approaches could let buyers bring data in without the host seeing it.\n\n### Where the evidence leans\n\n**The skeptic is right about the present and the proponent may be right about the future.** As of mid-2026, the spec [6], the pilots [2], and a friendly proponent [1] all agree: today's containers are sandboxes that gate buy-side data. The richer-*data* promise is unredeemed. But the richer-*reach* benefit (full-bidstream evaluation via QPS relief) is real and shipping [8]. The honest framing: containerization delivers a **compute and reach** improvement now and a **signal-richness** improvement only *if* the data boundary is solved later. Buyers evaluating the category in 2026 should price the latter as a roadmap promise, not a live capability. **Verdict: load-bearing limitation, partially mitigated, future-dependent.**\n\n---\n\n## Risk 2 — Frequency management and deduplication: the unsolved cross-fabric problem\n\n### The strongest version\n\nThis is the risk the architecture's own advocates concede they cannot yet answer. Programmatic already has a bid-duplication problem: the same impression is offered through multiple SSPs and supply paths, so a buyer can bid against itself and bid up its own costs. The Trade Desk's then-VP of inventory development Will Doherty described the status quo bluntly — SSPs \"send 30% of the publisher's traffic... and they send it three times\" [9]. Frequency caps already fail to synchronize across DSPs; a 3-per-user cap set across two DSPs can double CPMs because neither sees the other's deliveries [10]. GroupM, trying to cap frequency across its buys, discovered the whole thing is fundamentally \"a data integration challenge,\" not a setting you flip [11].\n\nNow multiply that by a container fabric in every exchange. If Index, PubMatic, Magnite, and OpenX each host the same buyer's container, that buyer makes *independent* bid decisions in four isolated sandboxes that, by design, cannot see each other — the ARTF spec's whole security model is that the host mediates inputs and outputs and agents don't reach out [6]. The spec does not address cross-host frequency capping or deduplication at all [6]. Aqfer's Dan Jaye names this \"the biggest challenge\": \"Once every SSP spins up its own container, frequency management and deduplication get messy... Without a fix, containers could make that problem worse\" [1]. The architecture that promises efficiency could, at the level that most affects the advertiser's wallet, make the canonical inefficiency *worse*. It removes the one thing that could coordinate — a single bidder with a single view — and replaces it with N isolated bidders.\n\n### The counter-argument\n\n**(a) The problem pre-exists containerization and has known mitigants.** Shared identity layers (UID2, RampID) and OpenRTB's transaction IDs / Global Placement IDs (GPIDs) already let buyers dedupe across paths [10][9]; nothing about containers breaks those, and a buyer can still run a coordination layer outside the fabrics. **(b) Containerization can *help* dedup.** Because the container runs sell-side, it sees supply-path metadata the buyer's remote bidder might miss, potentially making duplicate-path detection *easier* at the point of decision. **(c) QPS relief reduces the incentive for SSPs to spam-duplicate.** Doherty's \"send it three times\" behavior is partly a yield tactic in a throttled world; if the bidder evaluates everything, the gamesmanship loses some of its point [8][9].\n\n### Where the evidence leans\n\n**Genuine and currently unsolved, but not unique to containerization — and solvable in principle.** The cross-fabric coordination gap is real, conceded by proponents [1], and absent from the spec [6]. But it is a *coordination* problem layered on a *pre-existing* duplication problem [9][10][11], and the industry has partial tools (identity-based dedup, transaction IDs) that survive the transition. The risk is that those tools are themselves weak — UID2 adoption is incomplete and IP-based identity is decaying (see Risk 3) — so the coordination layer a multi-fabric buyer needs is exactly the layer that is least reliable. **Verdict: load-bearing for any buyer who multi-homes across fabrics; mitigable only as well as the underlying identity layer allows — which is not very, today.**\n\n---\n\n## Risk 3 — Identity-substrate decay: the performance thesis is undercut at the root\n\n### The strongest version\n\nThis is the deepest cut. Containerized bidding's most exciting use case is **performance CTV** — bid on a streaming impression, attribute it to a household, prove a conversion. Every step of that depends on resolving a device or IP address to a real household with known attributes. And that resolution is failing.\n\nThe evidence is a primary measurement study, not an opinion. In November 2025, Truthset — on behalf of CIMM (the Coalition for Innovative Media Measurement) and Go Addressable — benchmarked **247 million distinct IP addresses and 938 million IP-to-postal linkage pairs** from six major data providers against authoritative ground truth: actual subscriber assignments from **two ISPs and one virtual MVPD**, who alone know which household a router IP belongs to [3]. The findings:\n\n- **IP-to-postal linkages are accurate, on average, 13% of the time** [3].\n- **IP-to-email linkages are accurate, on average, 16% of the time** [3].\n- Providers **agree with each other only 6.4% of the time** on IP-to-postal and **2.8%** on IP-to-email; **93% of linkages are unique to a single provider** — i.e., there is no consensus signal, just noise that disagrees [3].\n- Data providers report **3.2 IPs per postal** where ground truth shows **1.2** — they invent household multiplicity that isn't there [3].\n- **IPv6 addresses are under-represented by 72%** in provider files (15% of provider data vs. 54% real US adoption) — a structural blind spot that grows as IPv6 grows [3].\n\nThe cascade is the killer. Truthset stacks the error: starting from $1.00 of media, after IP error, postal error (the 2023 study found email-to-postal ~51% accurate), email error, and demographic error compound, **$0.03 of every dollar reaches the intended audience** [3]. The study's own conclusion: \"With 13-16% average linkage accuracy, most audiences built on IP data will be wrong. This impacts any system that relies on IP-to-postal or IP-to-email mappings to build or measure digital audiences\" [3].\n\nFreeWheel (a Comcast company) amplified this in a February 2026 post, framing it as \"IP-based ad targeting can miss 87% of households\" — citing the same CIMM/Truthset data, not independent research [12]. The skeptic's syllogism is short: containerized bidding makes the *decision* faster and closer; the decision is only as good as the *signal*; the signal is 13-16% accurate; therefore co-locating the algorithm \"doesn't fix it — it just lets you be wrong at lower latency.\" The performance thesis is undercut at the root.\n\n### The counter-argument\n\n**(a) Not all identity is IP-based.** Deterministic signals — smart-TV ACR, logged-in publisher IDs, hashed emails (HEMs), UID2 — are far more accurate, and the right read of the Truthset study is \"stop using probabilistic IP graphs,\" not \"performance CTV is impossible.\" Truthset itself recommends prioritizing \"MVPDs with deterministic IP linkage data\" [3]. FreeWheel's pitch is precisely that deterministic-source IP \"is as good as any identifier\" [12]. **(b) Containerization can *improve* identity resolution** by running the resolver sell-side against signals the publisher holds (login state, first-party graph) rather than guessing from a remote IP. **(c) The accuracy floor affects *all* programmatic equally** — it is not a containerization-specific defect, and a buyer with a better identity graph wins regardless of where the bidder runs.\n\n### Where the evidence leans\n\n**The skeptic is right that the substrate is weak, and the counter-argument concedes the point while relocating it.** Both sides agree probabilistic IP identity is 13-16% accurate [3][12]. The disagreement is whether the *deterministic* alternatives are widely enough available to carry performance CTV — and there the evidence is mixed: ACR and login-based identity are real but fragmented across walled identity layers (Roku, Amazon, Disney each hold their own), and HEM/UID2 coverage is incomplete. The decisive point: **containerization does not address identity at all.** It is orthogonal. So whether the performance thesis stands depends entirely on an upstream factor the architecture neither improves nor worsens. A buyer pairing a container with a strong deterministic graph (e.g., an ACR panel) has a real edge; a buyer pairing a container with a probabilistic IP graph has a fast path to confident error. **Verdict: load-bearing for the performance-CTV use case specifically; the architecture is signal-agnostic, so the risk lives entirely in the identity layer beneath it.** This is, in one line, the single most important caveat in the whole account: *containerization solves the auction, not the signal.*\n\n---\n\n## Risk 4 — Vendor lock-in and SSP dependency: power concentrates in the host\n\n### The strongest version\n\nTo run inside an SSP's fabric, you build to that SSP's container interface, deploy on its infrastructure, depend on its uptime, and accept its data-access rules. As of mid-2026 there is effectively **one production fabric — Index Cloud**, introduced April 21, 2026 [13], with Bedrock as the first containerized DSP (April 24, 2026) [14] and a partner slate (Chalice AI, inPowered AI, Nano Interactive) in what reporting describes as \"closed beta with select partners\" [14]. Bedrock's deployment is \"single-vendor (Index Exchange only)\" with \"no mention of multi-homing\" at launch [14].\n\nThat is concentration risk in three flavors. **(a) Switching cost.** Once a buyer's bidding logic, deployment pipeline, and optimization loop are tuned to one host's API and signal exposure, moving to another fabric is a rebuild, not a config change. **(b) Renegotiation leverage.** The host sets the rules of data access and, plausibly, the commercial terms — hosting fees, revenue share. Once volume flows through its container, it can renegotiate from strength. Digiday's reporting on agencies moving closer to supply captured the worry that \
