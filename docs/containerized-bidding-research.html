four converging facts, all dated and sourced above: (1) the spec names them first-among-equals and gives them native verbs [1][12]; (2) the standard's own launch explainer illustrated the concept with fraud, not bidding [2]; (3) the two in-market fabric proof points beyond Bedrock — Zillow/Index (Aug 2025) and PubMatic Decision Fabric (Jun 2026) — are both supply-quality/qualification use cases [3][10][21]; and (4) the non-bidding agents do not hit the sandbox-vs-open-compute wall, because their inputs are host-held signals, so they are *deployable today* in a way buy-side performance bidding is not [4]. On the architecture's own terms, the path of least resistance runs through fraud, contextual, quality, and measurement — not bidding.\n\n**The case against over-claiming** is equally real: (a) Bedrock — a *full bidder* — is the single most-celebrated and most-cited live deployment, and Index Cloud's marketing leads with bidders [21]; (b) the verification giants' loudest 2026 \"agent\" launches (DV Neura, IAS Agent) are MCP assistants, *not* ARTF containers, so the containerized verification thread is thinner than the headlines suggest [6][7]; (c) PubMatic's Decision Fabric qualification tenants (inPowered, MiQ, Chalice, SWYM) sit *between* bidding and verification — buy-side-aligned *qualification* models, not classic third-party verification [10]; and (d) no public revenue figures exist to settle which category actually books the first dollars at scale, since every performance and adoption claim here is vendor-sourced and unaudited (a caveat that runs through this whole account).\n\nThe thesis correction, then: the available evidence as of June 2026 supports a reframing — the *first at-scale containerized deployments are more likely non-bidding enrichment agents (fraud, contextual, supply-quality, measurement, identity) than relocated bidders* — but the claim is directional, not settled: it rests on use-case primacy (spec, launch framing, the two non-bidding fabric pilots) and on the non-bidders' freedom from the open-compute constraint, *not* on revenue data, which does not exist in the public record. The bidder-first margin story should be re-cast as one chapter — likely the second chapter — of a story whose first chapter is trust and supply quality.\n\n### What this does to the margin thesis\n\nThe margin argument set out earlier is that co-location decouples infrastructure spend from market access and relocates take-rate. That mechanic is *agent-agnostic* — it holds whether the resident container is a bidder, a fraud filter, or a contextual classifier. But *who captures the relocated margin* changes by tenant. If the first at-scale tenants are verification/quality agents, the early winners are the SSPs hosting them (new hosting/data fees) and the verification vendors gaining upstream signal fidelity (DV's \"reduce media waste\" pitch [5]) — *not* DSPs disintermediating themselves. The disintermediation-of-the-DSP story, the dramatic core of the bidder thesis, would then be the *later* act, gated on the open-compute/first-party-data problem being solved, while the *earlier* act quietly re-prices the trust-and-quality layer of the supply chain. The protagonist of Act I is the verification/quality agent. The bidder is the protagonist of Act II — which has not yet started at scale.\n\n---\n\n## Open Questions\n\n1. **Will any verification vendor ship a *true ARTF container* (not an MCP assistant) in production, and when?** As of June 2026, the containerized verification thread is roster (HUMAN, Optable, Basis in the working group), governance (GumGum, Oracle, Zefr in the Architecture Group), endorsement (DV's Carlton on Index's panel), and one born-for-it startup (Gamera) — but no dated \"X's fraud/brand-safety container is live in exchange Y\" announcement with run-rate. The first such announcement would turn this question from directional to settled.\n\n2. **Does the MRC (or any accreditor) accredit in-container measurement?** Measurement run inside the measured exchange, sealed from the advertiser, is a conflict-of-interest and auditability problem the verification industry exists to police. Whether an independent body blesses it — or whether advertisers reject \"private but unauditable\" measurement — will decide if measurement is a viable container tenant at all.\n\n3. **Where does the contextual category's ARTF energy actually land post-Oracle?** With Oracle's Grapeshot/Moat winding down and Peer39/GumGum/Zefr/Proximic absorbing the function, which of them first runs a *contextual classifier as an ARTF container* (the paradigm host-signal-only agent) rather than as a pre-bid data feed?\n\n4. **Are PubMatic Decision Fabric's qualification tenants \"verification\" or \"bidding\"?** inPowered/MiQ/Chalice/SWYM are audience-qualification and curation models — neither classic third-party verification nor full bidders. If the modal first tenant is this *qualification* middle category, the bidder-vs-verifier binary used here may itself be the wrong cut.\n\n5. **Does the black-box/explainability tension force a two-tier product?** Will verification vendors run a sealed model host-side (for the exchange relationship) *and* an explainable layer advertiser-side (for trust) — and does maintaining both erode the efficiency the container was supposed to deliver?\n\n---\n\n## Sources\n\n1. ARTF Specs, \"Technical Specs,\" artf.ai. https://artf.ai/technical-specs — **Tier 1 (primary spec, project-run)**; accessed 20 Jun 2026. Agent-service definition listing \"identity resolution, fraud detection, contextual or audience enrichment, bidding logic, or measurement\"; sequential/parallel multi-agent invocation; intent-as-purpose.\n2. Allison Schiff / AdExchanger, \"The IAB Tech Lab Releases Its First Framework For Agentic Ad Buying Standards,\" 13 Nov 2025. https://www.adexchanger.com/platforms/the-iab-tech-lab-releases-its-first-framework-for-agentic-ad-buying-standards/ — **Tier 5 (specialized trade nt-classification throughput claim; MCP/AdCP connectivity.\n14. HUMAN Security, \"2026 State of AI Traffic and Cyberthreat Benchmark Report,\" 9 Apr 2026 (via trade coverage). https://www.humansecurity.com/ and PPC Land, \"AI agents are now buying things — and fraud looks identical.\" https://ppc.land/ai-agents-are-now-buying-things-and-fraud-looks-identical/ — **Tier 5/6 (vendor report + trade)**; accessed 20 Jun 2026. Agentic-AI traffic +7,851%; legitimate-vs-fraud gap ~0.5pp — evidence of HUMAN's agentic-era fraud positioning, *not* of a shipped ARTF container.\n15. HUMAN Security, \"HUMAN Sightline: Cyberfraud Defense for the Agentic AI Era\" (blog). https://www.humansecurity.com/learn/blog/human-sightline-cyberfraud-defense-agentic-era/ — **Tier 6 (vendor blog; HTTP 403 on direct fetch, title/summary via search)**; accessed 20 Jun 2026. Agentic-era defense product framing. **Single-source, fetch-blocked**; flagged.\n16. IABTechLab/agentic-realtime-framework GitHub (license + governance). https://github.com/IABTechLab/agentic-realtime-framework — **Tier 1 (primary)**; accessed 20 Jun 2026. Architecture Group (Extreme Reach, GroupM, GumGum, Oracle, Tapad, The Trade Desk); contributions from Google, Index, TTD, **Zefr**. Also discussed in the skeptic's-case chapter.\n17. Peer39, \"Transition from Oracle's Grapeshot and Moat with Peer39.\" https://www.peer39.com/transition-from-oracle-grapeshot-and-moat-with-peer39 — **Tier 6 (vendor marketing)**; accessed 20 Jun 2026. Evidence that Oracle's contextual/verification assets (Grapeshot, Moat) are sunsetting and the function is redistributing to Peer39 (and peers). Vendor self-interest — evidence of the migration, not a neutral market measure.\n18. Digiday, \"How contextual targeting providers' pitch to brand clients and agencies has changed.\" https://digiday.com/media-buying/how-contextual-targeting-providers-pitch-to-brand-clients-and-agencies-has-changed/ — **Tier 5 (trade press)**; accessed 20 Jun 2026. Contextual cohort (GumGum, Peer39, Proximic, Zefr) as the standalone content-categorization category positioning into agentic/decisioning.\n19. AdExchanger, \"Gamera Raises $1.6 Million To Protect The Open Web's Media Quality.\" https://www.adexchanger.com/publishers/gamera-raises-1-6-million-to-protect-the-open-webs-media-quality/ — **Tier 5 (trade press)**; accessed 20 Jun 2026. Gamera profile: founder Gareth Glaser, 2022 founding, ~$1.6M raised, code-on-page real-time impression verification — the born-for-ARTF non-bidding quality startup.\n20. Advanced Television and Martech360, \"PubMatic launches Decision Fabric on AgenticOS,\" 1 Jun 2026. https://www.advanced-television.com/2026/06/01/pubmatic-launches-decision-fabric-agenticos/ — **Tier 5 (trade press)**; accessed 20 Jun 2026. Independent corroboration of the ARTF-based fabric and its qualification/curation tenant list.\n21. The market-map chapter of this account. PubMatic Decision Fabric runs a segment-ID/qualification model distinct from Bedrock's full bidder; Bedrock as the celebrated full-bidder exception; MiQ's cross-DSP intelligence migrating into the fabric."}, {"order": 9, "file": "09_Gap_Sustainability_Carbon_Lens.md", "title": "The Carbon Lens — Does Containerized Bidding Actually Decarbonize Programmatic, or Just Relocate the Compute?", "summary": "", "body": "# The Carbon Lens — Does Containerized Bidding Actually Decarbonize Programmatic, or Just Relocate the Compute?\n\n## Bottom Line\n\nFor all the angles on containerized bidding, one ties most directly to its core mechanic and is too often skipped: carbon. What this architecture eliminates — speculative bid-request egress and the ~90% of requests that come back as no-bids (the 725 TB/month of traffic described earlier) — is, by independent measurement, the single largest source of programmatic advertising's carbon footprint. Scope3 puts roughly **60% of programmatic's carbon in \"ad selection,\"** and a separate measurement firm (Cedara) puts **73% in \"auctioning calls\"** — bid requests and responses crossing the wire — with **87% of programmatic emissions coming from network utilization and only ~6% from data-center compute** [1][7]. That last split is the whole argument in one line: if the carbon lives in the *network transit*, then an architecture that deletes the round-trip and moves the compute next to the data is, on its face, a decarbonization story. Optable, an AdCP founding member, already gestures at this — \"more sustainable economics… without needing to run global, always-on infrastructure\" — but never quantifies it and never reckons with the obvious objection [2].\n\nThat objection is the heart of this chapter — a genuine open question, not a rhetorical one. Co-location does not make compute free; it **relocates** it. The resident container is *always on* and warm (it does not cold-start per bid), and the GPU-inferencing fabric the host runs to make this fast (PubMatic's NVIDIA L40S deployment) is a new, energy-hungry compute layer that did not exist in the thin-client OpenRTB world [3]. Worse, the architecture's own headline benefit — Bedrock's claim that per-request cost \"drops to near zero,\" so a buyer can \"evaluate every impression… not a sampled slice\" — is a textbook **Jevons-paradox rebound**: make scoring an impression nearly free, and the rational response is to score *vastly more impressions*. The peer-reviewed literature on AI efficiency (Luccioni, Strubell & Crawford, FAccT 2025) is blunt that efficiency gains \"do not reliably reduce total energy\" and the inverse is \"highly plausible\" absent a countervailing constraint [4]. The honest verdict cuts both ways: containerized bidding has a credible mechanism to cut the network-transit carbon that dominates today's footprint, *and* it introduces resident-compute and induced-demand mechanisms that could erase or invert the saving. No independent, holdout-validated carbon study of containerized vs. traditional bidding exists in the public record as of June 2026 — the same evidentiary vacuum that hangs over the performance question.\n\nTwo live forces make this lens matter commercially, not just morally. First, **regulation is arriving on a fixed clock**: California's SB 253 forces $1B+ revenue companies to disclose Scope 1–2 emissions by **August 10, 2026** and Scope 3 from **2027**, and the **Global Media Sustainability Framework v1.2** (operational mid-2025) for the first time gives programmatic, CTV, and DOOH a standardized, activity-based emissions formula [5][6]. Carbon is becoming a *reportable line item*, and most of an ad platform's footprint (>95%) is Scope 3 — the supply chain this architecture restructures [7]. Second, the ARTF-vs-AdCP fault line hides an **unexamined sustainability dimension**. Scope3 is at once the carbon-data incumbent *and* the steward of AdCP — and AdCP's whole pitch is to **route around the auction** rather than co-locate compute inside it. If the dominant carbon source is auction round-trips, then the rival protocol, not containerization, may be the larger decarbonization play: you cannot emit a bid request you never send. That is the question this chapter leaves on the table.\n\n---\n\n## 1. The Carbon Mechanism — Where Programmatic's Emissions Actually Come From\n\n### The footprint, measured\n\nDigital advertising is material in carbon terms because it is millions of servers doing real-time work. Scope3 — the firm founded by AppNexus creator Brian O'Kelley, now the de-facto carbon-measurement standard for the industry — estimated that **programmatic advertising generates roughly 215,000 metric tons of CO₂ each month across five major economies** (UK, France, Germany, US, Australia) [1]. Scope3's own framing makes the unit intuitive: **1,000 digital impressions consume about the same energy as one load of laundry**, and publisher emissions range from **187 to 1,772 grams of CO₂ per thousand impressions** depending on how clean or wasteful the supply path is [1]. O'Kelley's recurring shorthand is \"roughly **one gram of CO₂ per programmatic impression**\" served [8].\n\nThe load-bearing number here is the breakdown of *where inside programmatic* that carbon sits. Two independent measurements, built on different methodologies, converge on the same conclusion:\n\n- **Scope3:** \"**Ad selection counts for 60% of programmatic's carbon footprint**\" — ad selection being the real-time-bidding machinery: the bid requests, the auctions, the decisioning [1][9].\n- **Cedara** (a separate digital-media carbon-accounting firm, methodology summarized by IAB Europe, May 2024): **73% of programmatic emissions are tied to \"auctioning calls\"** (avail transmission, bid requests and responses); **14% to creative transmission**; **87% total to network utilization**; and only **~6% to data centers** [7].\n\nThese are not the same number, and I will not pretend they are — 60% (Scope3, \"ad selection\") and 73% (Cedara, \"auctioning calls\") rest on different category definitions and different reference years. But they agree on the structural fact: **the real-time-bidding round-trip, not creative delivery and not data-center compute, is the dominant programmatic emissions source.** That agreement is what makes the containerized-bidding carbon thesis credible enough to take seriously.\n\n### Why RTB is so carbon-heavy: the waste is the point\n\nThe waste is well documented mechanically: a mid-size exchange ships on the order of **8.64 billion bid requests/day at ~3 KB each — roughly 725 TB/month of egress — and ~90% of inbound traffic results in no-bids** [10]. The carbon framing is the same fact read through a different meter. O'Kelley puts it most memorably: *\"This is an entire industry that's effectively leaving the lights on. It's millions of servers and data centers serving ads to nobody\"* [9].\n\nScope3 surfaced the pathological extreme: a single ad slot **auctioned 28,000 times** — \"we thought it [was] broken,\" said Scope3 COO Anne Coghlan [11]. The structural number is tamer but still damning: a typical display impression triggers on the order of **1,000–2,000 bid requests** across the duplicative \"auctions of auctions\" before a winner is paid, and the win rate on any given request runs well under 1% (one 2026 case study cites a **0.8% baseline win rate** — i.e., ~99.2% of requests are pure waste) [9][12]. Every losing request crossed the network, consumed serialization and load-balancer cycles on both ends, and emitted carbon for nothing.\n\nThe takeaway: the dominant source of programmatic advertising's carbon footprint is the real-time-bidding round-trip — the speculative, mostly-no-bid traffic that containerized bidding is specifically designed to eliminate. This is the mechanistic basis for the entire decarbonization thesis, and it is corroborated by two independent measurement firms (Scope3, ~60% \"ad selection\"; Cedara, ~73% \"auctioning calls\" / 87% network).\n\n### The favorable split — and why it matters for the relocate question\n\nThe Cedara breakdown holds the single most important data point for adjudicating the \"relocate vs. eliminate\" debate: **~87% of programmatic emissions come from network utilization, and only ~6% from data centers** [7]. Read that against what containerized bidding actually does to the two buckets:\n\n- **Network utilization (87% of emissions):** containerized bidding *deletes* the speculative round-trip. The container runs next to the auction; there is no internet transit because there is no trip. On the dominant bucket, the architecture is unambiguously subtractive.\n- **Data-center compute (6% of emissions):** containerized bidding *adds* here. The resident container is always-on; the GPU fabric is new compute. On the small bucket, the architecture is additive.\n\nIf — and it is a real \"if,\" resting on Cedara's averages — the network bucket genuinely dwarfs the compute bucket by ~14×, then even a *substantial* increase in data-center compute could come out carbon-positive overall, because it buys down a much larger network-transit cost. This is the strongest quantitative form of the bull case. It is also the most fragile: it depends entirely on the compute bucket staying small — and the next section shows the GPU-inferencing trend and the Jevons rebound threatening exactly that.\n\n---\n\n## 2. The Counter-Mechanism — Relocate, Not Eliminate (the Case Against)\n\nThe decarbonization thesis has three credible failure modes. Honesty requires taking the strongest version of each seriously.\n\n### 2.1 The resident container is always on\n\nIn traditional OpenRTB, a DSP that is not bidding on a given exchange consumes no resource *on that exchange's infrastructure*. In the containerized model, the buyer's container is **provisioned into the host's fabric and kept warm** so it can answer in single-digit milliseconds — it \"does not cold-start per bid.\" Multiply that by every buyer × every exchange hosting them, and you have a population of always-resident, always-powered containers occupying memory and compute whether or not an impression is in flight. That same resident-warm design is what makes the latency claim work; the carbon cost is the same fact with a different sign. Optable's framing does quiet rhetorical work here — host \"only the bidding logic necessary for a given transaction… without needing to run global, always-on infrastructure\" [2]. It describes the *buyer* shedding always-on infrastructure while relocating an always-on footprint onto the *host*. The footprint does not vanish. It changes whose balance sheet — and whose Scope 1–2 — it sits on.\n\n### 2.2 GPU inferencing is a new, power-dense compute layer\n\nThe fast, model-driven decisioning that justifies co-location increasingly runs on GPUs — far more power-dense than the CPU fleets that served thin OpenRTB requests. **PubMatic deployed NVIDIA L40S GPUs and Triton Inference Servers** for real-time ad decisioning, claiming it cut inference latency \"from the industry standard of 5–10 milliseconds to approximately 1 millisecond\" and \"85% fewer auction timeouts\" [3]. The same announcement claims the deployment \"reduces energy consumption by 30% while delivering superior performance,\" and PubMatic separately reports consolidating \"five data center racks into one… processing 3× more ad requests per server\" [3][13]. Two things are true at once, and must be held together:\n\n- **The host's pitch (the strongest version):** GPU inferencing can be *more* energy-efficient *per decision* than CPU inferencing, and PubMatic claims a 30% energy reduction and 3× density gain. If real and durable, the added compute layer is more efficient than what it replaces.\n- **The correction:** every one of those figures is the host's own, unaudited, in a press release selling the capability — precisely the kind of self-interested claim to treat with caution. A 30%-per-decision efficiency gain says nothing about *total* energy if the number of decisions rises faster (§2.3). And GPUs carry high **embodied carbon** (manufacturing emissions) that a per-operation efficiency stat ignores entirely. PubMatic also claims **100% renewable energy** across its data centers [13]; if true, that would blunt the operational-carbon objection for *that one host*. But renewable-energy claims for ad-tech data centers are typically procurement (RECs/PPAs), not 24/7 carbon-free power, and they do not transfer to other hosts running on grid mixes.\n\nThe contested takeaway: containerized bidding adds an always-on, increasingly GPU-based compute layer inside the exchange. Whether this added compute is carbon-positive or carbon-negative on net depends on (a) whether per-decision efficiency gains are real and durable, (b) embodied GPU carbon, (c) the host's grid mix, and (d) whether decision *volume* rises — none of which has been independently measured for this architecture.\n\n### 2.3 The Jevons rebound — the deepest objection\n\nThe architecture's signature benefit is also its signature carbon risk. Bedrock's head of engineering, Damian Naglak, states the mechanic plainly: \"throttling existed because processing each bid request… carried a real per-request cost. Inside the cluster, that cost drops to near zero, so the bidder can evaluate **every impression** on a deal, not a sampled slice.\" In carbon terms, that is a near-perfect statement of the **Jevons paradox**: make a resource (per-impression compute) dramatically cheaper, and total consumption of it tends to *rise*, not fall.\n\nThe peer-reviewed framing comes from Luccioni, Strubell & Crawford, \"From Efficiency Gains to Rebound Effects\" (FAccT 2025) [4]. Their central finding: \"just because an AI model becomes more efficient, that does not imply that overall AI resource consumption will decrease, and in fact the inverse effect is highly plausible.\" Their empirical anchor: data-center energy use has kept *rising* even as average PUE (power-usage effectiveness) \"dropped steadily\" and per-chip efficiency improved, because the *volume* of work scaled faster. Apply that here. Today a throttled DSP scores ~20–30% of available inventory; containerized bidding lets it score ~100%. If per-request carbon falls 80% but request volume rises 3–5×, total carbon is flat or higher. In the literature the rebound can exceed 100% — efficiency that *increases* total consumption.\n\nThe load-bearing inference: containerized bidding's headline benefit — near-zero marginal cost to evaluate every impression, removing QPS throttling — is a direct Jevons-rebound trigger. By making impression-scoring nearly free, it incentivizes scoring far more impressions, which could neutralize or invert the per-request carbon saving. This is an inference grounded in the FAccT 2025 literature and the architecture's own stated mechanics, not a measured outcome; it is the most important unexamined risk in the carbon case.\n\n### The honest synthesis\n\nThe two-sided verdict: containerized bidding has a **real, mechanically sound carbon-*reduction* story on the network bucket** (87% of emissions, per Cedara) and a **real, mechanically sound carbon-*addition* story on the compute bucket** (6% of emissions, plus rebound-driven volume). Whether the net is decarbonizing turns on one empirical question no public study has answered: does the architecture reduce *total bid requests sent over the wire*, or merely move the same — or greater — decisioning volume inside the building? Shrink wire traffic, and the dominant bucket wins: it decarbonizes. Hold wire traffic constant and add compute, and it relocates carbon, perhaps adding to it. The marketing (\"more sustainable economics\") asserts the first; the Jevons logic warns of the second. **The honest framing is a decarbonization *thesis*, never a decarbonization *fact*.**\n\n---\n\n## 3. The Regulatory and Standards Driver — Carbon Becomes a Reportable Line Item\n\nThe carbon lens is not only a moral or efficiency argument; it is becoming a compliance obligation on a fixed timetable. Three live instruments matter.\n\n### 3.1 California SB 253 — mandatory Scope 3 disclosure\n\nThe **Climate Corporate Data Accountability Act (SB 253)** requires U.S. companies with **over $1 billion in annual revenue** doing business in California to disclose greenhouse-gas emissions measured against the GHG Protocol [5]. The precise schedule:\n\n- **Scope 1 and Scope 2** emissions: first disclosure by **August 10, 2026** [5].\n- **Scope 3** emissions (the value chain — for ad platforms, >95% of the footprint): required **beginning in 2027**, with a good-faith **safe harbor through 2030** during which companies are not penalized for misstatements [5].\n\nStatus as of mid-2026: CARB **unanimously approved the implementing regulations on February 26, 2026**; SB 253 (unlike its companion SB 261) is **not enjoined** — the Ninth Circuit's injunction does not apply to it, and it remains in effect despite a pending compelled-speech challenge argued January 9, 2026 (no ruling yet) [5]. The threshold sweeps in essentially every large advertiser, agency holding company, and major ad-tech platform. Once Scope 3 reporting begins in 2027, the *programmatic supply chain* — the thing containerized bidding restructures — becomes a number a CFO must put in a public filing, and eventually assure.\n\nThe established takeaway: California SB 253 makes large-company emissions disclosure mandatory on a fixed schedule — Scope 1–2 by August 2026, Scope 3 from 2027 — converting the programmatic supply chain's carbon from a voluntary talking point into a reportable, eventually-assured line item for $1B+ companies.\n\n### 3.2 The Global Media Sustainability Framework (GMSF) v1.2 — the measurement standard\n\nYou cannot manage, report, or arbitrage what you cannot measure consistently. The **GMSF**, stewarded by **Ad Net Zero** and built with 100+ organizations, is the industry's attempt at a single emissions-measurement methodology across digital, TV, print, audio, cinema, and out-of-home, aligned to the GHG Protocol and ISO 14067 [6]. **Version 1.2** (PDF dated June 2025; described by IAB Europe and trade press as operational in late 2025) is the release that matters here: it \"adds granularity for programmatic, CTV, and DOOH,\" overhauls the digital methodology (formulae, data levels, default values), and introduces a **data-quality hierarchy that prioritizes supplier-contributed actual data over modeled defaults** [6][14]. That hierarchy is exactly the lever a containerized-bidding host could pull. An exchange running the auction *and* the buyer's compute in one place holds the ground-truth activity data — requests sent, requests avoided, kWh consumed — that GMSF v1.2 ranks as the gold standard. Co-location, in other words, could make the host the authoritative carbon reporter for every transaction it touches.\n\n### 3.3 Carbon-aware / carbon-weighted bidding — the optimization layer\n\nSitting on top of measurement is a fast-growing optimization practice: treating carbon as a live bidding signal. **Carbon-aware (or carbon-weighted) bidding** scores each impression's emissions (using GMSF v1.2 factors) and applies a bid modifier — conceptually `bid_adjustment = 1 − (carbon_score × penalty_weight)` — alongside viewability and conversion probability; major DSPs now expose carbon scoring \"as a native bidding dimension… as accessible as frequency caps or geo-targeting\" [15]. The headline claim: campaigns using carbon-weighted formulas \"achieved emission reductions of **22–41%** while maintaining or improving KPIs\" [15]. **Provenance caveat:** that 22–41% range is attributed to \"early implementations\" with no named study and rests on a single source; treat it with caution. The most independently grounded numbers in this space come from **Greenbids**, whose mechanism is explicitly **bid-request reduction**. Founder Guillaume Grimbert frames it as \"trying to reduce the waste in the programmatic chain to make sure that we only have relevant impressions,\" and the firm reports publisher-side carbon reductions of **20–35%**, a **YouTube product averaging 41% carbon reduction with ~28% lower cost-per-view**, and cumulative savings on the order of thousands of tons/month [16].\n\n**This is the quiet tell of the whole lens.** Greenbids' carbon-saving mechanism is *not* moving compute next to the auction — it is **sending fewer bid requests** (targeting only relevant SSPs/DSPs, filtering pre-bid). Independent 2026 case studies report the same: a supply path compressed from **11 intermediaries to 4 cut carbon ~61%**, and **pre-bid filtering cut bid requests 62%** [17]. Every demonstrated, vendor-measured carbon win to date comes from *reducing the number of requests* — conceptually closer to AdCP's route-around-the-auction topology than to containerization's keep-the-auction-but-move-the-compute topology. Containerization's carbon win is *theorized*: delete the round-trip. Request-reduction's carbon win is *being booked today*.\n\n---\n\n## 4. The ARTF-vs-AdCP Fault Line Has a Carbon Dimension\n\nThe standards fight, taken up earlier, is over \"who sits in the middle of the next decade of advertising\": ARTF (containerized bidding's home) **keeps the auction and moves compute next to the data**; AdCP **routes around the auction**, with seller agents negotiating directly with buyer agents and \"compressing the supply chain.\" What no one has examined is that **these two topologies have opposite carbon profiles on the dominant emissions bucket.**\n\nRecall the structural fact: ~60–73% of programmatic carbon is the auction round-trip, ~87% is network transit (§1). Now overlay the two protocols:\n\n- **ARTF / containerized bidding** keeps the auction and the bidstream central. It *speeds up and co-locates* the round-trip but does not, by itself, reduce the *number* of auctions or requests in the system — and by removing QPS throttling, it may increase requests evaluated (the Jevons risk, §2.3). Its carbon claim is \"the same auction, with less transit per request.\"\n- **AdCP** compresses the supply chain — fewer hops, agent-to-agent negotiation instead of broadcast-everywhere bid requests. If the carbon is in the *count of requests broadcast across the network*, then **structurally collapsing that count is a larger lever than co-locating the compute for a request you still send.** You cannot emit a bid request you never send.\n\nThe irony rarely stated: **Scope3 is on both sides of this.** It is the carbon-data incumbent whose own measurements establish that the auction round-trip is the dominant emissions source [1][9] — *and* it is the steward of AdCP, the protocol that most directly attacks that round-trip by routing around it [18]. Whether by conviction or by commercial design, Scope3's carbon thesis and Scope3's protocol point the same way: **reduce the requests, don't just relocate the compute.** That is, at minimum, a coherent worldview; at most, a structural argument that the rival protocol, not containerization, is the bigger decarbonization play.\n\nThe contested inference: the ARTF-vs-AdCP fault line maps onto a carbon fault line. Containerization (ARTF) reduces *per-request* transit while risking *more* requests via de-throttling; AdCP reduces the *number* of requests by compressing the supply chain. Because programmatic carbon is dominated by request volume over the network (60–87% by independent measures), supply-chain compression may be a larger carbon lever than compute co-location. This connects the two protocols' topology to the measured emissions split in §1; it is not a claim either party has published in this form, and it cuts against the very technology under examination here.\n\n**The strongest case for the containerization side (fairness requires it):** the two are not mutually exclusive, and ARTF's defenders would argue co-location *enables* request reduction. A resident container with rich impression context can decide *not* to participate without a wire round-trip at all, and can pre-filter inside the building. A containerized bidder that evaluates everything but transmits nothing it loses on could, in principle, cut wire traffic more than a route-around-the-auction protocol that still negotiates over the network. The empirical answer — which topology actually moves fewer bytes and burns fewer joules per won impression — does not exist yet. Both camps are asserting carbon virtue ahead of the data.\n\n---\n\n## 5. Viability and Credibility Caveats\n\nThree caveats keep this account honest and current.\n\n**The evidence vacuum.** Every directional carbon claim here rests on one of three legs: (a) Scope3/Cedara's measurements of *traditional* programmatic (robust, independent, but not about containerized bidding specifically), (b) vendor self-claims about efficiency (PubMatic's 30% energy reduction, Index's near-zero per-request cost — unaudited), or (c) inference from the Jevons literature. **There is no independent, holdout-controlled measurement of containerized vs. traditional bidding's end-to-end carbon as of June 2026.** This is the carbon twin of the performance-measurement vacuum noted earlier. Treat \"containerized bidding decarbonizes programmatic\" as a *hypothesis with a plausible mechanism*, not an established fact.\n\n**Scope3's own going-concern wobble.** The carbon-data incumbent this analysis leans on is itself under commercial strain: trade press (PPC Land) reported Scope3 \"cuts engineering and sales staff again as agentic AI pivot hits reality\" [19]. If the steward of both the dominant carbon dataset *and* the rival AdCP protocol is retrenching, both the measurement baseline and the route-around-the-auction counter-thesis carry institutional risk. The carbon-data layer is not a settled utility. It is a venture-funded company pivoting.\n\n**Renewable-energy and offset claims need scrutiny.** Hosts will increasingly answer the compute-addition objection with renewable-energy claims (PubMatic's \"100% renewable\" [13]). These are typically annual procurement matching (RECs/PPAs), not 24/7 carbon-free energy, and they do not generalize across hosts on different grids. A buyer's container running inside a coal-heavy-grid data center is not decarbonized by the host's annual REC purchase. Carbon-accounting standards (GMSF v1.2, GHG Protocol) are still debating market-based vs. location-based accounting, and the answer materially changes whether co-located compute looks green.\n\n---\n\n## Open Questions\n\n1. **The decisive empirical test:** Does containerized bidding reduce *total bid requests transmitted over the network per won impression*, or hold them constant while adding compute? This single measurement would resolve the relocate-vs-eliminate question — and no one has published it.\n2. **Does the Jevons rebound bite?** When de-throttling lets a buyer evaluate ~100% of inventory instead of ~25%, does total decisioning compute (and its carbon) rise faster than per-decision efficiency falls? What is the net?\n3. **Embodied vs. operational carbon of the GPU fabric:** PubMatic's per-decision operational efficiency claim ignores GPU manufacturing carbon. Over a realistic refresh cycle, is the GPU-inferencing layer net carbon-positive?\n4. **Is AdCP's route-around-the-auction topology measurably lower-carbon than ARTF's co-locate-the-compute topology?** This is the unbuilt study that would turn §4's inference into a finding — and it pits Scope3's protocol against the corpus's own subject.\n5. **Will SB 253 / GMSF v1.2 create a carbon-arbitrage incentive** that pulls compute toward clean-grid data centers, and does co-location help or hurt that (by concentrating compute in the host's fixed locations vs. distributing it)?\n6. **Does co-location make the *host* the authoritative GMSF v1.2 \"contributed data\" reporter** for transactions it touches — and is that a new source of host power and lock-in (a carbon-data moat layered on the compute moat examined elsewhere)?\n\n---\n\n## Sources\n\n1. Scope3, \"Programmatic advertising generates 215,000 metric tons of carbon emissions each month across five major global economies,\" and Scope3 State of Sustainable Advertising figures (215k mt/mo across UK/FR/DE/US/AU; 60% from ad selection; 187–1,772 gCO2pm; 1,000 impressions ≈ one laundry load). https://scope3.com/news/scope3-report-programmatic-advertising-generates-215-000-metric-tons-of-carbon-emissions-each-month-across-five-major-global-economies — **Tier 5/6 (vendor research, but the de-facto industry measurement standard; corroborated independently by [11])**; accessed 2026-06-20.\n2. Bosko Milekic (CTO/co-founder, Optable), \"The Potential Impact of 'Containerized Bidding' on Ad Tech,\" Optable blog, 4 Aug 2025. https://www.optable.co/blog/containerized-bidding-impact — **Tier 6 (vendor / AdCP founding member, self-interest)**; accessed 2026-06-20. Source for \"more sustainable economics… without needing to run global, always-on infrastructure\"; note: no emissions data, no acknowledgment of resident compute — the gap this chapter fills.\n3. PubMatic / NVIDIA, \"PubMatic Delivers 5x Faster, Smarter Advertising Decisions with NVIDIA,\" 8 Oct 2025. https://pubmatic.com/news/pubmatic-delivers-5x-faster-smarter-advertising-decisions-with-nvidia/ — **Tier 6 (host press release, unaudited self-claim)**; accessed 2026-06-20. NVIDIA L40S GPUs, Triton servers, 5–10ms→~1ms latency, \"85% fewer auction timeouts,\" \"reduces energy consumption by 30%.\" Treat all figures as PubMatic's own.\n4. Sasha Luccioni (Hugging Face), Emma Strubell (CMU), Kate Crawford (Microsoft Research/USC), \"From Efficiency Gains to Rebound Effects: The Problem of Jevons' Paradox in AI's Polarized Environmental Debate,\" ACM FAccT 2025 (arXiv:2501.16548). https://arxiv.org/html/2501.16548v1 — **Tier 2 (peer-reviewed conference, top-tier authors)**; accessed 2026-06-20. Efficiency gains \"do not reliably reduce total energy\"; rebound \"highly plausible\"; data-center energy rose despite falling PUE.\n5. Nixon Peabody LLP, \"California climate disclosure laws update,\" 2 Mar 2026 (legal analysis of SB 253). https://www.nixonpeabody.com/insights/alerts/2026/03/02/california-climate-disclosure-laws-update — **Tier 5 (law-firm analysis) summarizing Tier 1 statute**; accessed 2026-06-20. $1B+ threshold; Scope 1–2 by Aug 10 2026; Scope 3 from 2027; safe harbor to 2030; CARB regs approved 26 Feb 2026; SB 253 not enjoined. Primary statute: CA SB-253, leginfo.legislature.ca.gov.\n6. Ad Net Zero, \"Global Media Sustainability Framework v1.2\" (PDF, Jun 2025) and \"Ad Net Zero Strengthens Global Framework to Calculate Media Emissions.\" https://adnetzero.com/wp-content/uploads/2025/06/GlobalMediaSustainabilityFrameworkV1.2.pdf and https://adnetzero.com/global-media-sustainability-framework/ — **Tier 1/5 (industry-body standard document)**; accessed 2026-06-20. GMSF aligned to GHG Protocol & ISO 14067; v1.2 adds programmatic/CTV/DOOH granularity and a contributed-data quality hierarchy.\n7. IAB Europe, \"Connecting the Dots: Product-Level Programmatic Emissions and AdTech's Total Greenhouse Gas Footprint\" (summarizing Cedara, \"Scope 1–3 Emissions Measurement for Digital Media Businesses,\" May 2024). https://iabeurope.eu/connecting-the-dots-product-level-programmatic-emissions-and-adtechs-total-greenhouse-gas-footprint/ — **Tier 5 (trade body) summarizing Tier 5 vendor methodology**; accessed 2026-06-20. 73% auctioning calls; 14% creative transmission; 87% network utilization; 6% data centers; >95% of platform emissions are Scope 3.\n8. Brian O'Kelley (CEO, Scope3), per Adweek/Numberly interview coverage, \"~1 gram of CO₂ per programmatic impression.\" (Adweek piece HTTP-403 on direct fetch; figure widely attributed to O'Kelley across trade coverage.) — **Tier 5/6 (executive self-attribution)**; accessed 2026-06-20. Single-source for the precise \"1 gram\" figure; flagged.\n9. AdExchanger, \"Scope3 Announces New AI Products To Reduce Ad Tech's Growing Carbon Emissions Levels,\" 13 Mar 2025. https://www.adexchanger.com/ai/scope3-announces-new-ai-products-to-reduce-ad-techs-growing-carbon-emissions-levels/ — **Tier 5 (specialized trade press)**; accessed 2026-06-20. O'Kelley \"leaving the lights on… serving ads to nobody\"; agentic platform filters high-climate-risk/MFA inventory.\n10. AWS RTB Fabric egress math (725 TB/mo, ~90% no-bids), AWS vendor blog; treat as vendor figure.\n11. Kendra Barnett, \"'One ad slot auctioned 28,000 times': the carbon cost of ineffectual bidding,\" The Drum, 19 Apr 2023. https://www.thedrum.com/news/2023/04/19/one-ad-slot-auctioned-28000-times-the-carbon-cost-ineffectual-bidding — **Tier 5 (trade press), independent corroboration of Scope3 figures**; accessed 2026-06-20. 28,000-auction case; 215k mt/mo across 5 economies; 60% ad selection; 187–1,772 gCO2pm; washing-machine equivalence; Coghlan quotes.\n12. carbonintelligence.green, \"5 Practical Ways to Cut Programmatic Advertising Carbon Emissions,\" 14 Jan 2026 (GMSF v1.2 methodology). https://carbonintelligence.green/blog/reduce-programmatic-emissions/ — **Tier 5 (carbon-measurement vendor, self-interest noted)**; accessed 2026-06-20. 0.8% win-rate baseline; 11→4 intermediaries = 61% carbon drop; 62% bid-request reduction via pre-bid filtering; spend-based overstates activity-based by ~450%.\n13. PubMatic, \"PubMatic Achieves 100% Renewable Energy Across Global Data Centers,\" and FY2025 infrastructure-optimization figures (336.8T impressions, 3× requests/server, 5→1 rack consolidation). https://pubmatic.com/news/pubmatic-renewable-energy-global-data-centers/ — **Tier 6 (company press release / 8-K)**; accessed 2026-06-20. Renewable claim is procurement-based; treat as company assertion.\n14. IAB Europe, \"Driving Media Decarbonisation Through Precision: GMSF v1.2 and the Power of Contributed Data.\" https://iabeurope.eu/driving-media-decarbonisation-through-precision-gmsf-v1-2-and-the-power-of-contributed-data/ — **Tier 5 (trade body)**; accessed 2026-06-20. Contributed-data hierarchy detail for GMSF v1.2.\n15. carbonintelligence.green, \"Carbon-Aware Bidding: How AI is Transforming Programmatic in 2026,\" 12 Jan 2026. https://carbonintelligence.green/blog/carbon-aware-bidding/ — **Tier 5 (carbon-measurement vendor)**; accessed 2026-06-20. 22–41% carbon-weighted-bidding reduction (attributed to \"early implementations,\" **single-source, no named study**); carbon as native DSP bidding dimension; bid_adjustment formula; 247-campaign analysis (Jan–Mar 2026).\n16. Allison Schiff, \"Greenbids Is Making A Bid To Reduce Carbon Across The Programmatic Supply Chain,\" AdExchanger, 4 Mar 2024. https://www.adexchanger.com/sustainability/greenbids-is-making-a-bid-to-reduce-carbon-across-the-programmatic-supply-chain/ — **Tier 5 (specialized trade press)**; accessed 2026-06-20. Mechanism = bid-request reduction (relevant-SSP/DSP targeting); 20–35% publisher-side, 41% YouTube product / 28% lower CPV; Grimbert \"reduce the waste in the programmatic chain.\"\n17. carbonintelligence.green case-study figures (as [12]) — 61% from supply-path compression, 62% from pre-bid filtering.\n18. \"Standards: ARTF & AAMP,\" discussed earlier in these pages — ARTF keeps-the-auction vs. AdCP routes-around-the-auction; Scope3-led AdCP coalition (Optable, PubMatic, Scope3, Swivel, Triton, Yahoo).\n19. PPC Land, \"Scope3 cuts engineering and sales staff again as agentic AI pivot hits reality,\" 2026. https://ppc.land/scope3-cuts-engineering-and-sales-staff-again-as-agentic-ai-pivot-hits-reality/ — **Tier 5 (trade press)**; accessed 2026-06-20. Going-concern signal for the carbon-data incumbent / AdCP steward."}, {"order": 10, "file": "10_Gap_Direct_Booking_Engine_Cohort.md", "title": "The Direct Booking Engine Cohort: Pontiac, Universal Ads, Onetag Dynamo, and Why a Low Take Rate Is Not the Same as a Container", "summary": "", "body": "# The Direct Booking Engine Cohort — A Status Check and a Taxonomy Correction\n\n## Bottom Line\n\nThree names carry a load they cannot bear. The case for a new low-take-rate \"direct DSP / Direct Booking Engine (DBE)\" category leans on a single trade article — ExchangeWire's June 17, 2026 \"A New Type of DSP Is Emerging\" — which names **Pontiac Intelligence**, **Universal Ads**, and **Onetag Dynamo** as exemplars and cites a \"25% lower CPA with zero tech fee\" datapoint. All three exist and operate as of mid-2026, so the claim about their viability survives. But the deeper move — treating these names as evidence for *containerized bidding* — does not. **None of the three is a container running inside a third-party exchange's compute fabric.** Pontiac is an independent, transparent, omnichannel DSP that has run since 2015/2016 on its *own* bidder (plus third-party Vistar/Xandr APIs), and whose published self-service take rate is a **20% \"transparent\" software-license fee** — roughly The Trade Desk's level, not \"dramatically lower.\" Universal Ads is Comcast/FreeWheel's free self-serve direct-buy platform for premium video, aimed at SMBs and social-budget advertisers: a sell-side storefront, not a buyer's bidder at all. Onetag Dynamo is a supply-side *curation* optimization layer that is explicitly \"DSP-agnostic\" and runs at Onetag's own exchange, \"before the bid.\" ExchangeWire itself frames the DBE as a **commercial/business-model category** — fee compression, supply proximity, agency-system integration — and does **not** equate it with containers, ARTF, or Index Cloud. The verdict that matters: **the \"lower take rate\" the DBE cohort markets is attributable to the business model — disintermediation, transparency, and zero/curation-fee pricing — not to containerization.** If a buyer can compress the ad-tech tax this way *without* running a container inside an exchange, then containerization is not the load-bearing mechanism of fee compression. It is one route among several. The DBE names belong not as \"evidence for containerized bidding\" but as \"an adjacent fee-compression movement that the containerized-bidding thesis must be distinguished from.\"\n\n---\n\n## 1. Why this question matters\n\nThe commercial thesis behind containerized bidding is that it triggers a \"margin-relocation event\" in which the high DSP take-rate compresses because the bidder is no longer the DSP's moat once a third-party container does the decisioning inside the exchange. To dramatize the compression, the case often reaches for ExchangeWire's \"new type of DSP\" framing and imports its named exemplars — Pontiac Intelligence, Universal Ads, and the \"Onetag Dynamo … 25% lower CPA with zero tech fee\" datapoint. The problem is twofold:\n\n1. **Viability.** Each name is a present-tense competitive claim resting on one trade article. Do these entities exist, operate, and mean what is implied of them as of mid-2026?\n2. **Conceptual.** The framing silently merges two different things. A **Direct Booking Engine** is a *commercial* route to supply that competes on lower fees and supply proximity. **Containerized bidding** is an *architectural* arrangement in which a buyer's bidder runs as an OCI/Docker container co-located with the auction inside the SSP's compute. If DBEs deliver the same margin relocation *without* containers, they undercut the central claim that containerization is the mechanism doing the work.\n\nWhat follows resolves both: a dated viability profile of each entity, a taxonomy separating DBE from containerized bidding, and a verdict on what the \"lower take rate\" should be attributed to.\n\n---\n\n## 2. The source under load: what ExchangeWire actually says\n\nRead the primary source first, because it is easy to over-read.\n\nExchangeWire's \"A New Type of DSP Is Emerging\" (June 17, 2026) [1] defines a **\"direct DSP\"** as \"a bundled buying platform tightly integrated with the SSP layer\" that competes \"on operational efficiency, direct supply-path access, transparency, and dramatically lower take rates,\" and a **\"Direct Booking Engine (DBE)\"** as \"what a DSP looks like when it's purpose-built for transparency, supply-path integrity, and fee compression.\" [1] The motivating diagnosis is fee creep: \"Margins have compounded into a meaningful ad tech tax, and agency clients are pushing harder on working-media dollars.\" [1] The named cohort includes Pontiac Intelligence, Universal Ads, Magnite (ClearLine), PubMatic (Activate), Index Exchange (Index Cloud), DV360, Amazon DSP, and Onetag Dynamo. The \"25% lower CPA with zero tech fee\" line is the *title of a related Onetag article*, not a measured result the DBE piece itself produced [1][2].\n\nThe decisive observation here: **the article frames the DBE as a business-model category, not an architecture.** It never describes DBEs as containers, and never uses \"containerized,\" \"OCI,\" \"co-located compute,\" or \"running inside the exchange\" to define them. Index Cloud is mentioned only in passing — \"Index Exchange recently outlined a more open yet similar infrastructure approach with Index Cloud\" — and ARTF appears only as an \"earlier incarnation\" agentic framework offering \"methods to activate on publisher inventory without utilising a legacy DSP.\" [1] The container architecture is adjacent furniture in the article, not the definition of the DBE. Quote the DBE language as if it belonged to a discussion of containerization, and you inherit an equivalence the source never asserts.\n\n> **A note on the source.** ExchangeWire is a single specialised-trade outlet, and this is a single-outlet synthesis. It is legitimate as *evidence of a framing* and as a pointer to entities; it is not adequate, on its own, for a load-bearing architectural claim. The right use of it is as a map to primary sources, with each entity then checked against those.\n\n---\n\n## 3. Status profiles (dated)\n\n### 3.1 Pontiac Intelligence — an established independent transparent DSP, not a container\n\n**Status: operating.** Pontiac Intelligence is a private, New York–based company, 11–50 employees, founded **2015/2016** (Crunchbase lists 2015; other profiles 2016) by the Thorson family [3]. It is categorised as a **Demand-Side Platform / programmatic-buying / RTB** company, with active 2026 G2 and Crunchbase profiles [3][4]. It launched a Connected TV bidder as far back as October 2022 [5]. This is not a 2026 startup conjured by a press release. It is a decade-old going concern.\n\n**What it actually is.** Pontiac describes itself as \"a fully transparent Demand Side Platform\" giving advertisers omnichannel access \"across CTV, Digital Out of Home, Display, Native, Video, and Audio\" [3][6]. Its own product pages call it \"a powerful proprietary Demand Side Platform with access to 100% of all programmatic inventory\" [6]. Architecturally it runs a **hybrid of its own bidder and third-party rails**: \"We built our own CTV and OLV tools in-house,\" built \"Pontiac OOH over the Vistar API,\" and \"Pontiac Origin for display, native, and audio over the Xandr Invest API\" [6]. The CTV bidder has historically been offered \"on a Bidder-as-a-Service model or a percentage-of-media model\" [5]/[3]. Nothing in Pontiac's self-description mentions a \"container inside a third-party SSP.\" The architecture is the *opposite* of co-located in-exchange compute: Pontiac runs its own decisioning and reaches supply over conventional integrations.\n\n**On fees — the important correction.** ExchangeWire and Pontiac's own marketing both say \"lowest platform fees in the industry\" and \"dramatically lower take rates\" [1][6]. But Pontiac's published self-service price is concrete and not especially low: a **\"fully transparent 20% Software License fee on all media purchased through the platform\"** for advertisers who self-activate, with three support tiers (self-service, guided, managed) and \"better rates with commitments\" on the managed/MSA tier [6]. A 20% self-service software fee is *roughly The Trade Desk's ~20% platform fee*, not a step-change below it. Read the \"dramatically lower take rate\" framing as **transparency-and-independence positioning** — not a measured fee delta versus incumbents, and certainly not a delta produced by containerization.\n\n> **A caveat on the 20%.** The specific \"20%\" figure traces to Pontiac's own `media-buying` materials — what Pontiac claims, not independently audited. No independent fee audit was available, and Pontiac's third-party pricing listings were inaccessible. Treat the 20% as Pontiac's stated self-service rate, not a verified effective take.\n\nThe premise that pontiac.media positions itself as a \"Booking Engine / DBE\" with \"dramatically lower take rates\" and direct CTV/DOOH/omnichannel integrations is only half right. The \"Booking Engine / DBE\" label is ExchangeWire's framing applied to Pontiac, and search syntheses echo it [1]; Pontiac's own `media-buying` page never uses the terms \"Booking Engine,\" \"Direct Booking Engine,\" or \"DBE\" [6]. It does claim direct CTV/DOOH/omnichannel integrations and transparent low fees [6]. So Pontiac is a real, low-fee-positioned, omnichannel independent DSP that *a trade outlet has retrofitted into a new category* — not a self-declared DBE, and not a containerized bidder.\n\n### 3.2 Universal Ads — Comcast/FreeWheel's free self-serve direct-buy storefront, not a buyer's bidder\n\n**Status: operating and expanding.** Universal Ads was announced by Comcast on **January 6, 2025**, launched in Q1 2025, and as of **April 27, 2026** added self-service *linear* TV inventory alongside streaming — a live, growing product, not a vaporware listing [7][8][9].\n\n**What it actually is.** Universal Ads is \"a one-stop TV advertising platform\" — \"a free self-service, easy-to-use TV ads buying tool\" built \"on top of FreeWheel's industry-leading ad technology,\" designed to \"seamlessly allow ad buyers and sellers to directly transact all in one place\" [7]. Its target is performance advertisers and SMBs — the platform's own research cites \"50% of advertisers who have never advertised on TV\" and \"89% … willing to try TV advertising\" [7]. Launch partners span A+E, AMC Networks, DIRECTV, Fox, NBCUniversal, Paramount, Roku, TelevisaUnivision, Warner Bros. Discovery, and Xumo [7]; by April 2026 it spanned \"more than 20 premium publishers\" in a Universal Audience Network plus Comcast-owned linear inventory [9]. The pitch is \"the ease and familiarity of social ad buying\" for premium video [9], with \"direct access to premium, brand-safe video\" — where \"direct\" means *buying directly from media owners*, not \"running a container in an exchange\" [7].\n\n**Why it is misclassified.** Universal Ads sits on the **sell-side of the value chain** — a publisher-consortium self-serve storefront on FreeWheel, a Comcast-owned sell-side ad server. It is a *direct-buy* tool (cut the DSP and the ad-tech tax by buying premium video from the source) and **free to the buyer**. That is a fee-compression story, but it is the *most distant possible thing* from \"a buyer's bidding logic running as an OCI container inside an SSP's compute fabric.\" No buyer-supplied bidder, no container, no co-located decisioning. Universal Ads compresses the ad-tech tax by *removing the intermediary entirely* for self-serve premium-video buys. It is the demonstration case that fee compression does not require containerization — a publisher storefront can deliver it.\n\n### 3.3 Onetag Dynamo — a supply-side curation optimization layer that runs \"before the bid,\" DSP-agnostic\n\n**Status: operating; recently launched.** Onetag Dynamo launched **June 15, 2026** [2]. Its parent, **Onetag**, is an Italy-headquartered global ad exchange + \"Smart Curation\" platform: originally a DSP (2015), it built a performance SSP for Procter & Gamble and globalised it (2020), launched Smart Curation (2022), is backed by PE sponsor **Wise Equity**, and **acquired Aryel** (an Italian immersive-creative adtech) on **March 2, 2026** to build \"the new value exchange for the open internet\" [2][10][11]. Onetag's exchange connects \"more than 2,000 premium publishers\" and ~5,000 advertisers across North America, EMEA, and LATAM [2][11]. This is a real, funded, operating curation business.\n\n**What Dynamo actually is.** Per Onetag's own launch [2], Dynamo is an **\"outcomes optimisation solution\"** that stacks three components: \"Onetag's next-gen Global Exchange, directly connected to more than 2,000 premium publishers\"; \"the Onetag Smart Curation Platform, layered on top of the Global Exchange\"; and \"custom AI algorithmic optimisation.\" It \"brings buy-side intelligence directly to the source of inventory decisioning … to improve the pre-selection and prioritisation of high-performing impressions\" — it optimises **\"before the bid,\"** at the curation/exchange layer, pre-filtering and prioritising inventory before it enters the bidstream [2]. Crucially, Onetag states Dynamo \"is **DSP-agnostic**,\" is \"available at **no cost to advertisers and agencies**\" (the \"zero tech fee\"), and carries \"no technology fee\" [2]. It is **not a DSP, not a container, and not an in-exchange tenant of a third-party SSP.** It is Onetag's *own* sell-side curation/exchange product that any DSP can buy through.\n\n**The \"25% lower CPA\" datapoint — sourced and bounded.** The figure is a **single client testimonial.** Phil Farrington, Head of Programmatic at the agency Tomorrow, is quoted: \"we have seen CPA reductions of 25% while CPMs have increased by 12%\" [2]. Onetag also cites \"benchmark business-outcomes improvements of 20–50% across CPA, CPC, and CPL\" [2] — with no disclosed methodology, sample size, or holdout. So the \"25% lower CPA with zero tech fee\" is (a) Onetag's own marketing, (b) attributed to one named agency client, and (c) a *curation* result: better pre-bid impression selection raising media quality (CPMs went *up* 12%, CPAs down 25%) — **not** a take-rate reduction and **not** a containerization result. The mechanism Onetag claims is *outcome optimisation at the supply source* — the curation thesis, not the container thesis.\n\n---\n\n## 4. The taxonomy: DBE vs. containerized bidding\n\nWith the three entities profiled, the categories separate cleanly — and the distinction is worth setting down plainly.\n\n| | **Containerized bidding** (the subject here) | **Direct Booking Engine / \"direct DSP\"** (the ExchangeWire cohort) |\n|---|---|---|\n| **Nature** | An *architecture* | A *commercial route* / business model |\n| **Defining feature** | Buyer's bidder runs as an OCI/Docker container co-located with the auction inside the SSP's compute fabric | Lower take rates + supply proximity + transparency + agency-system integration |\n| **Where compute runs** | Inside the exchange (Index Cloud, Decision Fabric, OpenXBuild) | On the buyer's own infra (Pontiac), on a publisher storefront (Universal Ads/FreeWheel), or on the curator's exchange (Onetag) |\n| **What it changes** | *Where* decisioning happens (relocates compute, removes QPS throttle within a fabric) | *How much* the intermediary keeps (compresses or removes the fee) |\n| **Mechanism of fee change** | Removes the DSP's infrastructure-scale justification for its take | Disintermediation, transparency pricing, zero/curation fees, direct media-owner buying |\n| **Exemplars** | Bedrock (inside Index Cloud); Chalice/inPowered/MiQ as fabric tenants | Pontiac (own DSP), Universal Ads (publisher storefront), Onetag Dynamo (curation) |\n| **Relationship to a container** | *Is* the container | Achieves fee compression *without* a container |\n\n**Three resolutions of the question (a/b/c).** The question is whether DBEs are (a) the same architecture, (b) an adjacent competitor compressing fees *without* in-exchange containers, or (c) a downstream commercial wrapper around containerized fabrics. The evidence says **(b)**, with a small slice of (c):\n\n- **Pontiac → (b).** Independent DSP, own bidder, conventional supply integrations. Fee compression via independence/transparency, not via a container. *Not* a wrapper around any fabric.\n- **Universal Ads → (b), the purest case.** Publisher-consortium self-serve storefront on FreeWheel; removes the intermediary entirely for self-serve premium video. Fee compression by disintermediation; no container anywhere.\n- **Onetag Dynamo → (b).** Supply-side curation that optimises before the bid; DSP-agnostic; zero buyer fee. Compresses cost-per-outcome via media-quality selection, not via a container.\n- **The thin (c) overlap.** ExchangeWire lists Index Cloud, PubMatic Activate, and Magnite ClearLine in the *same breath* as Pontiac/Universal Ads [1]. Index Cloud is a containerized fabric; Activate/ClearLine are SSP-side curation/direct-booking products. So the *cohort label* spans both architectures — which is exactly why treating the label as a synonym for containerization conflates them. Only the SSP-fabric members (Index Cloud) are containerized; the named *Booking Engines* (Pontiac, Universal Ads, Onetag) are not.\n\nThe honest one-line taxonomy: **\"Direct Booking Engine\" is a commercial movement to compress the ad-tech tax by getting closer to supply; containerized bidding is one — and only one — of several architectures that movement can ride on.** Treating the two as synonyms is the error.\n\n---\n\n## 5. The verdict: is the \"lower take rate\" attributable to containerization or to the DBE business model?\n\n**To the business model.** The containerization thesis says the DSP take compresses because the bidder is no longer the moat once a container does the decisioning inside the exchange. That is a *plausible* mechanism for the genuinely containerized members (Bedrock inside Index Cloud). But the three DBE names so often cited as *evidence* for that compression deliver it through entirely **non-container** mechanisms:\n\n1. **Disintermediation** (Universal Ads: buy premium video direct from media owners on a free FreeWheel storefront — the intermediary fee goes to zero because there is no intermediary).\n2. **Transparency / independence pricing** (Pontiac: a flat, disclosed 20% software-license fee positioned against opaque incumbent stacks — and note 20% is *not* below TTD's ~20%).\n3. **Supply-side curation with zero buyer fee** (Onetag Dynamo: better pre-bid impression selection lowering cost-per-outcome, with no tech fee, DSP-agnostic).\n\nNone of these requires — or uses — a container co-located with the auction. So the load-bearing inference: **the fee compression the DBE cohort markets is a property of the DBE business model, not of containerization.** This *weakens, but does not refute,* the containerization thesis. It weakens it because the DBE names had been doing duty as corroboration that *containerization* relocates margin, when they actually show margin can be relocated *without* containers — containerization is **sufficient-at-most, not necessary** for fee compression. It does not refute the thesis because the genuinely containerized route (Bedrock/Index Cloud) still has its own distinct mechanism: QPS-decoupling removes the infrastructure-scale justification for the DSP take, which the DBE names neither prove nor disprove.\n\n**The upshot.** The DBE cohort should be read not as \"evidence for containerized fee compression\" but as \"an adjacent, partly-overlapping fee-compression movement that the containerization thesis must be distinguished from — and against which containerization must justify itself as the *load-bearing* mechanism rather than one route among several.\" The \"margin-relocation, not elimination\" framing actually survives this better than the stronger \"containerization causes the re-rating\" framing: margin is clearly being relocated by *several* forces at once, of which containerization is one.\n\n---\n\n## 6. Where the common framing goes wrong\n\n1. **The competitive read that \"the 'direct DSP' category undercuts the large independent DSP's take rate.\"** The directional read holds, but it should stop implying the undercut is *containerization*. The named undercutters — Pontiac, Universal Ads, Onetag — compress fees by business model, not container: via disintermediation, transparency pricing, and curation, mechanisms independent of in-exchange containers.\n\n2. **The sentence naming Pontiac Intelligence and Universal Ads, plus the \"Onetag Dynamo 25% lower CPA\" line.** Each deserves an annotation: Pontiac is an independent omnichannel DSP on its own bidder (self-service fee a *disclosed 20%*, not \"dramatically lower\"); Universal Ads is Comcast/FreeWheel's free self-serve direct-buy storefront for premium video (sell-side, no buyer bidder); Onetag Dynamo is supply-side curation, DSP-agnostic, zero tech fee, and the \"25% CPA\" is one agency testimonial about *outcome optimisation*, not take-rate.\n\n3. **The claim that \"Bedrock is positioned as a new 'direct DSP,' the category ExchangeWire names a 'Direct Booking Engine.'\"** This needs the taxonomy caveat: ExchangeWire frames the DBE as a *commercial* category and does not equate it with containerized bidding; the article mentions Index Cloud and ARTF only in passing and does not define the DBE as a container. Bedrock (inside Index Cloud) is the only *containerized* member; the *Booking Engines* (Pontiac, Universal Ads, Onetag) are not.\n\n4. **The margin waterfall.** Where the \"after\" column attributes lower DSP take to containerization, it should note that the observable low/zero-fee cases (Universal Ads free; Onetag zero tech fee; Pontiac disclosed-20%) achieve it *without* containers — so the compression is over-attributed to architecture.\n\n5. **The status of the entities themselves.** All three are operating: Pontiac (since 2015/16), Universal Ads (operating; linear added Apr 27 2026), Onetag Dynamo (launched Jun 15 2026). All three survive the status check; only the *architectural classification* was wrong.\n\n---\n\n## Key Claims\n\n**All three DBE exemplars exist and are operating as of mid-2026.** Pontiac Intelligence (NY-based DSP, founded 2015/16, 11–50 employees, active 2026 G2/Crunchbase) [3][4][5]; Universal Ads (Comcast, launched Q1 2025, linear added Apr 27 2026) [7][9]; Onetag Dynamo (launched Jun 15 2026, parent Onetag PE-backed, acquired Aryel Mar 2026) [2][10][11]. The present-tense competitive claims made about all three hold up.\n\n**None of the three is containerized bidding; each compresses fees by a non-container mechanism.** Pontiac runs its own bidder + Vistar/Xandr APIs (own infra, not in-exchange) [6]; Universal Ads is a FreeWheel-built publisher self-serve storefront (sell-side, no buyer bidder) [7]; Onetag Dynamo is DSP-agnostic supply-side curation running \"before the bid\" on Onetag's own exchange [2]. The \"lower take rate\" is therefore attributable to the DBE business model — disintermediation, transparency pricing, zero/curation fees — not to containerization.\n\n**ExchangeWire frames the DBE as a commercial category, not as containerized bidding.** The source defines the DBE by \"transparency, supply-path integrity, and fee compression,\" mentions Index Cloud only in passing and ARTF only as an \"earlier incarnation,\" and never defines the DBE as a container [1]. The equivalence — treating DBE language as if it described containerization — is an over-read of the source.\n\n**Pontiac's published self-service fee is a \"transparent 20% Software License fee\" — roughly TTD-level, not \"dramatically lower.\"** Pontiac's `media-buying` page states a \"fully transparent 20% Software License fee on all media purchased through the platform\" on self-service, with \"better rates\" on managed/MSA tiers [6]. A 20% self-service fee is comparable to The Trade Desk's ~20% platform fee. The \"dramatically lower take rate\" framing [1] is positioning, not a verified fee delta. (Not independently audited; Pontiac's third-party pricing listings were inaccessible.)\n\n**The \"25% lower CPA with zero tech fee\" is one agency testimonial about curation outcomes, not a take-rate cut.** Attributed to Phil Farrington, Head of Programmatic at agency Tomorrow: \"CPA reductions of 25% while CPMs have increased by 12%\" [2]. The mechanism is *outcome optimisation / media-quality selection* (CPMs rose), not a fee reduction; \"zero tech fee\" describes Dynamo's pricing, not a take-rate delta. No methodology, sample size, or holdout disclosed [2].\n\n**Containerization is sufficient-at-most, not necessary, for this fee compression.** Because Universal Ads (free), Onetag Dynamo (zero buyer fee), and Pontiac (disclosed flat fee) compress the ad-tech tax without any in-exchange container, the claim that containerization is the *load-bearing* mechanism of fee compression is weakened: containerization (Bedrock/Index Cloud) is one route among several, distinguished by its own QPS-decoupling mechanism, not by fee compression per se. This is the verdict that bears on the central thesis.\n\n---\n\n## Open Questions\n\n1. **What is Pontiac's *effective* take across tiers and channels?** The disclosed 20% is self-service software license [6]; managed/MSA \"better rates\" are undisclosed, and CTV \"Bidder-as-a-Service\" vs. percentage-of-media pricing [5] may differ. An independent effective-fee audit would settle whether \"lowest in the industry\" is real or positioning.\n2. **Does Universal Ads remain free at scale, and does it take any sell-side margin via FreeWheel?** \"Free to the buyer\" is a buyer-side statement; whether Comcast/FreeWheel captures a sell-side fee on the inventory is undisclosed in the consumer-facing materials [7][9].\n3. **Is Onetag Dynamo's \"zero tech fee\" cross-subsidised by a curation/exchange take?** A curation layer must monetise somewhere; \"no cost to advertisers\" [2] likely means the margin sits on the sell/curation side. The actual money flow is undisclosed.\n4. **Will the DBE label survive, and will any DBE *adopt* containerization?** ExchangeWire's category mixes architectures [1]. If Pontiac or Onetag ever deploys a container inside Index Cloud/Decision Fabric, the (b)/(c) boundary moves. As of mid-2026, none has.\n5. **Is a \"fee-compression landscape\" the right frame** — one that places containerization, DBEs, direct-buy storefronts, and curation side by side as *parallel* attacks on the ad-tech tax, rather than folding DBEs in under containerization?\n\n---\n\n## Sources\n\n1. ExchangeWire, \"A New Type of DSP Is Emerging,\" 2026-06-17. https://www.exchangewire.com/blog/2026/06/17/a-new-type-of-dsp-is-emerging/ — *Tier 5 specialised trade press; single-outlet synthesis. Defines \"direct DSP\" / \"Direct Booking Engine\"; names Pontiac, Universal Ads, Onetag Dynamo, Index Cloud, Activate, ClearLine, DV360, Amazon DSP. Frames DBE as a commercial category, NOT as containerized bidding; mentions Index Cloud/ARTF only in passing.* Accessed 2026-06-20.\n2. Onetag, \"Onetag Dynamo Delivers 25% Lower CPA with Zero Tech Fee by Optimising Outcomes Before the Bid,\" via ExchangeWire pressbox, 2026-06-15. https://www.exchangewire.com/blog/2026/06/15/onetag-dynamo-delivers-25-lower-cpa-with-zero-tech-fee-by-optimising-outcomes-before-the-bid/ — *Tier 1 for what Onetag claims (vendor press); Tier 5 host. Dynamo = curation/outcome-optimisation layer; DSP-agnostic; zero tech fee; \"before the bid.\" \"25% CPA / +12% CPM\" attributed to Phil Farrington, Tomorrow. Follows Aryel acquisition.* Accessed 2026-06-20.\n3. Crunchbase, \"Pontiac Intelligence — Company Profile & Funding.\" https://www.crunchbase.com/organization/pontiac-intelligence — *Tier 5 directory. Private, NY, 11–50 employees, founded 2015 (others 2016), Thorson family; categorised DSP / programmatic-buying / RTB / CTV / DOOH. Confirms operating status.* Accessed 2026-06-20.\n4. G2, \"Pontiac Intelligence Reviews 2026: Details, Pricing & Features.\" https://www.g2.com/products/pontiac-intelligence/reviews — *Tier 5 review directory. Categorises Pontiac as a DSP; active 2026 listing (pricing page returned HTTP 403).* Accessed 2026-06-20.\n5. BusinessWire, \"Pontiac Intelligence Launches A Connected TV Bidder,\" 2022-10-25. https://www.businesswire.com/news/home/20221025005912/en/Pontiac-Intelligence-Launches-A-Connected-TV-Bidder — *Tier 1 (press release) for what Pontiac claims. CTV bidder offered on Bidder-as-a-Service or percentage-of-media model; establishes Pontiac's own-bidder lineage to 2022.* Accessed 2026-06-20 (via search; full fetch failed once).\n6. Pontiac Intelligence, \"Media Buying\" and \"Pontiac DSP\" / Home pages. https://pontiac.media/media-buying/ ; https://pontiac.media/ ; https://drive.pontiac.media/pontiac-dsp-0 — *Tier 1 for self-description and stated pricing. \"Fully transparent 20% Software License fee\" self-service; \"lowest platform fees\"; \"proprietary DSP\"; built CTV/OLV in-house, OOH over Vistar API, display/native/audio over Xandr Invest API. No \"Booking Engine/DBE\" wording on its own pages; no in-exchange/container language.* Accessed 2026-06-20.\n7. Comcast Corporate, \"Comcast to Launch Industry-Changing, Cross-Publisher Advertising Solution For the Premium Video Category,\" 2025-01-06. https://corporate.comcast.com/press/releases/comcast-cross-publisher-advertising-solution-premium-video-category — *Tier 1 (press release) for what Comcast claims. Universal Ads = free self-service TV ads tool on FreeWheel; SMB/performance target; launch partners A+E, AMC, DIRECTV, Fox, NBCU, Paramount, Roku, TelevisaUnivision, WBD, Xumo. \"Direct\" = buy direct from media owners.* Accessed 2026-06-20.\n8. CNBC (A. Sherman), \"Comcast to launch Universal Ads in bid to win smaller advertisers over from tech,\" 2025-01-06. https://www.cnbc.com/2025/01/06/comcast-universal-ads-platform.html — *Tier 4 major outlet. Independent confirmation: free self-serve platform built on FreeWheel; aimed at advertisers who spend on tech/social; partner roster.* Accessed 2026-06-20.\n9. Universal Ads newsroom / BusinessWire, \"Comcast's Universal Ads Makes Linear TV Self-Service…,\" 2026-04-27. https://www.universalads.com/newsroom/self-service-linear-tv — *Tier 1 for what Universal Ads claims; corroborated by Morningstar/Yahoo Finance syndication. Confirms platform operating and expanding (linear + streaming), 20+ premium publishers, self-service.* Accessed 2026-06-20.\n10. Tech.eu, \"Onetag acquires Aryel to build a new programmatic ad exchange,\" 2026-03-02. https://tech.eu/2026/03/02/onetag-acquires-aryel-to-build-a-new-programmatic-ad-exchange/ — *Tier 5 specialised trade press. Confirms Onetag (Italy) is an operating ad exchange + curation platform; Aryel acquisition; Wise Equity sponsor.* Accessed 2026-06-20.\n11. AdExchanger, \"Curation Platform Onetag Just Acquired This Creative Tech Startup. Here's Why,\" 2026-03. https://www.adexchanger.com/programmatic/curation-platform-onetag-just-acquired-this-creative-tech-startup-heres-why/ — *Tier 5 specialised trade press (strong adtech authority). Independently characterises Onetag as a curation platform/exchange (not a DSP); ~2,000 publishers / ~5,000 advertisers; DSP-history (2015) → P&G SSP (2020) → Smart Curation (2022).* Accessed 2026-06-20."}, {"order": 11, "file": "11_Gap_Gracenote_Contextual_Tenants.md", "title": "The Metadata Tenant — Gracenote, ARTF, and the Contextual-Container Class the Map Forgot", "summary": "", "body": "# The Metadata Tenant — Gracenote, ARTF, and the Contextual-Container Class the Map Forgot\n\n## Bottom Line\n\nThere is a class of containerized tenant that most maps of this space leave out. On **June 17, 2026**, Gracenote (Nielsen's content-intelligence business) and PubMatic announced a partnership in which Gracenote's content metadata runs **on the IAB Tech Lab's Agentic Real-Time Framework (ARTF)**, \"built to operate within PubMatic's AgenticOS,\" matching bid opportunities against episode-level data **in real time at-auction** while \"adding just 0.1 to 0.5 milliseconds to transactions.\" [1][2] That latency figure is tighter and more concrete than any bidding deployment usually held up as the example: Bedrock's sub-5ms window and PubMatic's \"approximately one millisecond inference\" are both broader, host-asserted numbers. The deployment is also a *category* most participant slates omit entirely — a **contextual / content-metadata agent**, not a bidder, not an audience-segment model, not buyer-side trading intelligence. These vendors — Gracenote, Peer39, IRIS.TV, Comscore — hold exactly the show-level metadata that, as the chapter on standards and governance argues, CTV sellers refuse to pour into the open bidstream. That makes them the most *natural* containerized tenants of all: the container lets a seller expose \"what is playing behind the impression\" to a buyer's decision without broadcasting it to the whole exchange. Two cautions keep this honest. First, the **Index Exchange–Gracenote** integration (industry-first SSP integration of Gracenote IDs, September 16, 2025; show-level reporting with Spectrum Reach at CES, January 7, 2026) is **reporting-only and not containerized** — no source describes it running on ARTF — so it belongs in the contextual-vendor story but not the containerized one. Second, every \"live\" status here originates in a company release; independent trade pickup (Storyboard18, StockTitan) corroborates the *announcement* and the ARTF/latency claims but not audited production scale.\n\n---\n\n## The Deal in Detail\n\n### Gracenote and PubMatic: an ARTF-native, AgenticOS-resident content-metadata integration\n\nOn June 17, 2026, Gracenote (Nielsen's content-intelligence business) and PubMatic announced a strategic partnership whose implementation \"runs on the IAB Tech Lab's Agentic Real-Time Framework (ARTF), a standard for fast, containerized data integrations in programmatic advertising, and is built to operate within PubMatic's AgenticOS.\" [1][2] The Nielsen and PR Newswire texts carry the identical dateline \"New York and Redwood City, Calif., June 17, 2026\" and the verbatim sentence about ARTF and AgenticOS. [1][2] Storyboard18, published the next day, independently states the partnership \"operates on IAB Tech Lab's Agentic Real-Time Framework (ARTF) within PubMatic's AgenticOS.\" [3] This matters because AgenticOS and ARTF are the central objects of this whole study: PubMatic's Decision Fabric is \"built on AgenticOS\" and \"built using the IAB Tech Lab's ARTF open containerisation protocol,\" and the standard itself is the field's organizing protocol. Gracenote is a tenant of exactly that fabric, in exactly that standard. (As ever with a company release: this is evidence of what the companies claim, not proof of live scale.)\n\n### Matching bids against episode-level data in real time, at 0.1–0.5 ms\n\n\"Through the integration, PubMatic can matc
