h bid opportunities against Gracenote episode-level data in real time at-auction,\" and \"it supports real-time decisioning with minimal impact to the bidstream, adding just 0.1 to 0.5 milliseconds to transactions.\" [1][2] That band is materially *tighter and lower* than any latency the more familiar bidding deployments assert: Bedrock-on-Index is described as a sub-5ms execution window, and PubMatic's own Decision Fabric audience containers claim \"approximately one millisecond inference latency\" and a \"response time under ten milliseconds.\" A 0.1–0.5 ms enrichment is plausible precisely because a metadata lookup — match an impression to an episode ID — is computationally lighter than running a bidder or a segment model. It is a join against a static content graph, not an inference. The figure is the company's own and should not be read as audited. But even discounted, it is the most concrete latency datapoint attached to a *named, dated, in-market* ARTF deployment in the field.\n\n### A tenant category the usual participant maps omit\n\nGracenote occupies a tenant category absent from the standard participant taxonomy. The usual roster of tenants runs to \"one full DSP (Bedrock),\" \"four-plus independent AI-decisioning vendors (Chalice, inPowered, Nano Interactive, SWYM.AI),\" \"one cross-DSP buyer-side intelligence vendor (MiQ),\" and tester agencies. A **contextual / content-metadata vendor** — supplying verified show-level and live-sports schedule data — is not on that list, yet Gracenote is now a named ARTF/AgenticOS tenant. [1][2] The Gracenote deal is a different function: it does not bid, does not return audience segment IDs, and does not optimize a buyer's spend. It *enriches the impression with verified content identity* — \"what is actually playing behind a connected TV impression\" [3] — so that curated deal IDs can be built against specific programming. The architecture anticipated this: Index Exchange's six published Index Cloud use cases include \"contextual/content classification\" as a distinct category alongside \"hosted DSP bidders\" and \"audience/signal enrichment.\" The *use case* was visible in the abstract; what arrived is the *first named vendor* filling it.\n\n### Why the contextual-metadata tenant is the most natural fit of all\n\nContextual-data vendors are a more *structurally natural* fit for the containerized model than the bidders that usually take center stage, because the data they hold is exactly the show-level and household data that CTV sellers refuse to put in the open bidstream for fear of leakage. The container lets a seller expose content identity to a buyer's decision *without broadcasting it to the whole exchange.* [1][2] The security boundary is straightforward: show-level and household-level viewing data is a CTV seller's crown jewel, and sellers have historically refused to pour it into the open bidstream for fear of leakage; ARTF's containment model targets that reluctance directly. Gracenote's own market research quantifies the demand side of that gap: in a survey of 500 U.S. media professionals fielded March 5–23, 2026, **86% of media planners said they would move more linear TV budget into CTV if show-level targeting and reporting were consistently available** [5]. So the structural logic is: sellers withhold show-level data, buyers say that withholding is the top barrier to budget migration, and a containerized metadata agent resolves both by computing the match in-cell and returning only a curated deal association. That is a cleaner fit for the architecture's privacy-preserving promise than a full bidder — the function over which the central risk (that the host can see the bidder's logic) bites hardest. A metadata enrichment exposes far less proprietary buyer logic than a hosted bidder does.\n\n### The Index Exchange–Gracenote tie is real and dated — but reporting-only, not containerized\n\nIndex Exchange and Gracenote announced \"the industry's first SSP integration of Gracenote\" contextual intelligence on September 16, 2025, and extended it to show-level reporting with Spectrum Reach at CES on January 7, 2026 — but both are conventional data and reporting integrations, **not** containerized and **not** described as running on ARTF. [6][7][8] The September 16, 2025 Gracenote newsroom item calls it \"the industry's first SSP integration of Gracenote contextual intelligence,\" making Index \"the first SSP to embed Gracenote's brand safety segments and granular Do-Not-Air (DNA) controls directly into its platform\"; it mentions no ARTF, no container, no co-located compute. [6] The January 7, 2026 CES extension (Index + Gracenote + Spectrum Reach) is explicitly **reporting-only** — \"show-level transparency for buyers without requiring activation against Gracenote segments,\" delivering impression counts and program-level reports — and thedesk.net's independent piece notes \"no mention of containerized deployment or ARTF... a conventional data integration.\" [7][8] The two should not be conflated: the containerized Gracenote deployment is the **PubMatic** one, eight months later and on a different SSP. Index–Gracenote = non-containerized contextual reporting (Sept 2025 / Jan 2026); PubMatic–Gracenote = containerized ARTF/AgenticOS enrichment (June 2026).\n\n### The wider cohort — Peer39, IRIS.TV, Comscore — sits adjacent, but only Gracenote is confirmed on ARTF\n\nPeer39, IRIS.TV, and Comscore all supply show- and program-level contextual data into CTV programmatic and are the natural peer cohort for the contextual-container category — but **none is documented running on ARTF or in a containerized SSP fabric** as of mid-2026; their integrations are conventional curation/deal or measurement integrations. Only Gracenote-on-PubMatic is a confirmed containerized contextual tenant. [9][10][11][12]\n\n- **Peer39** targets CTV \"at the program level — by show, genre, rating, and content quality\" and integrates with major DSPs for programmatic buying [9]; no ARTF/container claim found.\n- **IRIS.TV** runs a content-data clean room and the IRIS_ID content identifier (90M+ IDs for shows/movies, 40%+ CTV coverage); it has a PubMatic curation partnership (May 27, 2025) — but that partnership is described as a conventional Connect/Activate PMP/PG deal integration, **with no mention of ARTF, AgenticOS, or containerization** [10][11]. IRIS.TV is, notably, the exact clean-room model the standards chapter describes — which makes it the most likely *next* contextual vendor to containerize.\n- **Comscore** launched daily program- and episode-level reporting across CTV and linear (announced January 6, 2026), \"Powered by Amazon Bedrock agentic AI on AWS\" — and here a naming caution is warranted: this \"Bedrock\" is **AWS's generative-AI service**, not \"Bedrock Platform,\" the containerized DSP. The two unrelated \"Bedrock\"s are a live source of confusion in this space [12].\n\nThe honest read: the contextual-container *category* exists with one confirmed live member (Gracenote/PubMatic) and a clear bench (Peer39, IRIS.TV, Comscore) that has not yet, on the public record, moved into the fabric. The same announced-but-not-live caution applied elsewhere applies to this new tenant class.\n\n### Status: announced and dated June 17, 2026, with no audited scale\n\nAs of mid-2026, the Gracenote–PubMatic ARTF integration is **announced and presented as operational** but carries no independent production-scale audit. PubMatic asserts \"tens of millions of verified live sports impressions\" on its platform curated using Gracenote schedule data, and says content intelligence is \"available to buyers however they choose to activate.\" None of the releases uses explicit \"beta,\" \"pilot,\" \"rolling out,\" or \"available [date]\" language. [1][2] Unlike Index Cloud (\"closed beta\") or Decision Fabric (\"pilot, partner roster announced\"), the Gracenote–PubMatic release frames the integration in the present tense without a stage label. That absence is itself a caution: without a \"beta\" tag, readers may over-read it as generally available. The defensible statement: *announced June 17, 2026; described as operational; ARTF/AgenticOS-resident; latency and impression-volume figures are PubMatic and Gracenote's own and unaudited; no independent confirmation of scale, or of a buyer actually transacting against it, so far.*\n\n---\n\n## Narrative\n\n### 1. The aside that buried the lede\n\nA single partner note turned out to be the story. A June 16, 2026 ExchangeWire interview with Index Exchange's Andrew Casale — the source of the most quotable line in this whole space (\"We don't see the code... it's effectively a black box\") and of the \"mini DSP renaissance\" framing — in passing \"notes Bedrock + Gracenote/Nielsen as containerized partners.\" That aside pointed at something easy to miss: contextual-metadata vendors are becoming containerized tenants, and one of them — Gracenote — would surface the very next day as the most concretely dated ARTF deployment on the public record.\n\nThe phrase \"Bedrock + Gracenote/Nielsen\" is also treacherous, because two unrelated \"Bedrock\"s circulate in this market. One is **Bedrock Platform**, the small model-driven DSP that became the \"first containerized DSP\" on Index Cloud. The other is **Amazon Bedrock**, the AWS generative-AI service that powers Comscore's program-level measurement. The Casale interview means the DSP. But the slippage is real enough that the AWS service should be named explicitly wherever \"Bedrock\" appears near Comscore or Nielsen.\n\n### 2. What the Gracenote–PubMatic deal actually is\n\nStrip the marketing and the mechanism is simple. PubMatic ingests Gracenote's content graph — \"50M+ titles and 80K+ channels and catalogs,\" including live-sports program schedules. When a CTV bid opportunity arrives, PubMatic matches it against Gracenote **episode-level data in real time at-auction**, and associates qualifying impressions with curated deal IDs — including, prominently, live-sports deals in PubMatic's \"AI-powered Live Sports Marketplace.\" [1][2] The buyer no longer guesses at context; the impression carries verified content identity. Gracenote's Jake Richardson frames it as \"content intelligence that works at the speed of the bidstream\"; PubMatic's Nicole Scaglione calls live sports \"the most premium inventory in the industry\" and says Gracenote brings \"verified content intelligence that powers impression-level decisioning to be more precise and more measurable.\" [2]\n\nThe architecturally load-bearing sentence is the infrastructure one: the implementation \"runs on the IAB Tech Lab's Agentic Real-Time Framework (ARTF), a standard for fast, containerized data integrations in programmatic advertising, and is built to operate within PubMatic's AgenticOS,\" \"adding just 0.1 to 0.5 milliseconds to transactions.\" [1][2] That places Gracenote *inside the exact fabric* the market map describes — Decision Fabric on AgenticOS — but in a different lane than the audience-segment containers (inPowered, Chalice, MiQ, SWYM.AI) that fabric is usually catalogued around. Gracenote does not return segment IDs to sharpen a buyer's targeting; it attaches *verified content identity to supply* so curated deals can be assembled. The familiar tenants were demand-enrichment containers. This one enriches supply.\n\n### 3. Why contextual vendors are the natural tenant class\n\nThe thesis was already in place before the tenant had a name: CTV sellers treat show-level and household viewing data as crown jewels and refuse to broadcast it in the open bidstream, and ARTF's containment model \"targets that reluctance directly.\" A containerized contextual agent is the cleanest possible expression of that promise. The container computes the content match *inside* the seller's (or the SSP's) perimeter and returns only the result — a deal association, a brand-suitability flag — never the raw show-by-show, household-by-household map. The seller differentiates its supply; the buyer gets verified context; neither side has to dump the crown jewels into a bidstream that 200 unbidding parties can read.\n\nAnd the demand is quantified. Gracenote's March 2026 survey of 500 U.S. media professionals found 86% of media planners would move more linear budget into CTV if show-level targeting and reporting were consistently available [5]. That is the buyer-side mirror of the seller-side reluctance: the data both sides want to transact on is the data sellers won't expose in the open. The container is the bridge. So the contextual-metadata tenant has a *better* structural case for the architecture than the hosted bidder that (rightly) gets foregrounded for its drama. The bidder triggers the central risk — that the host can observe the bidder's logic — most acutely; a metadata enrichment exposes comparatively little proprietary buyer logic. The architecture's privacy-preserving framing is most defensible precisely in the use case that has been under-weighted.\n\n### 4. The Index–Gracenote integration is the control case, not a second containerized deployment\n\nPut the two Gracenote threads side by side and it would be easy to treat the Index Exchange–Gracenote tie as a second containerized contextual deployment. It is not, and the distinction matters. Index and Gracenote announced \"the industry's first SSP integration of Gracenote\" contextual intelligence on September 16, 2025 — brand-safety segments and Do-Not-Air controls embedded in Index's platform [6] — and extended it at CES on January 7, 2026 to show-level *reporting* with Spectrum Reach, explicitly \"without requiring activation against Gracenote segments.\" [7] Both are conventional data and reporting integrations. No source describes either as containerized or ARTF-based; thedesk.net's independent account calls the CES capability \"a conventional data integration.\" [8]\n\nSo the clean framing is a *before/after* pair on the same vendor:\n- **Index–Gracenote (Sept 2025 / Jan 2026):** non-containerized contextual reporting and brand-safety segments — the pre-ARTF way a contextual vendor reaches an SSP.\n- **PubMatic–Gracenote (June 2026):** containerized, ARTF/AgenticOS-resident, in-auction content matching — the post-ARTF way.\n\nThe same vendor, nine months apart, on two different SSPs, crossing the line from integration-over-API to tenant-in-the-fabric. That illustrates what containerization changes more cleanly than any bidder anecdote, because the *function* — give buyers verified show-level context — stays fixed while the *architecture* shifts underneath it.\n\n### 5. The bench: who containerizes next\n\nThe contextual-data category has obvious next movers, none yet documented on ARTF. **IRIS.TV** is the most likely: it already runs a content-data clean room and the IRIS_ID identifier, already partners with PubMatic on curation (May 2025), and embodies exactly the clean-room model the standards chapter describes — but its current PubMatic tie is a conventional Connect/Activate deal integration, not a container [10][11]. **Peer39** sells program-level CTV targeting through DSP integrations [9]. **Comscore** ships daily program-level reporting powered by Amazon Bedrock (the AWS AI service) [12]. Any of the three crossing into a containerized SSP fabric would confirm the category — the single highest-value thing to watch coming out of all this.\n\n### 6. How the map of the field should change\n\nThree concrete corrections follow:\n1. **There is a fifth tenant class** the usual participant taxonomy misses: *contextual / content-metadata vendors*, with Gracenote (live, PubMatic, ARTF) as the first member and Peer39 / IRIS.TV / Comscore as the announced-or-adjacent bench.\n2. **The Gracenote–PubMatic deal is the most concretely dated ARTF deployment on record** (June 17, 2026; 0.1–0.5 ms; AgenticOS) — with the standard caveat that latency and impression-volume figures are the companies' own.\n3. **The two \"Bedrock\"s need to be kept apart** wherever Bedrock appears near Nielsen or Comscore, and the Index–Gracenote (non-containerized) tie must not be confused with the PubMatic–Gracenote (containerized) one, lest a passing gloss be read as putting Gracenote inside Index Cloud.\n\n---\n\n## Open Questions\n\n1. **Is the Gracenote container *the same* ARTF container that could run unchanged on Index Cloud or OpenXBuild?** The \"deploy once, run across SSPs\" portability question applies directly: Gracenote is on PubMatic's AgenticOS today; is its ARTF packaging portable to other fabrics, or PubMatic-specific?\n2. **Does a buyer transact against the Gracenote-curated live-sports deals in the window, or is \"tens of millions of impressions\" inventory-side supply?** The figure is impressions *available*, not impressions *bought*. Independent confirmation of a buyer actually activating is missing.\n3. **Will IRIS.TV — the purest clean-room contextual vendor — containerize on ARTF, and on which SSP first?** Its existing PubMatic curation tie makes PubMatic the obvious venue; watch for an AgenticOS/ARTF upgrade announcement.\n4. **Does Index Exchange move its Gracenote tie *into* Index Cloud?** Index has both the Gracenote relationship (since Sept 2025) and the containerized fabric (Index Cloud, April 2026) — but has not, on the public record, married them. If it does, the contextual-container category gains a second SSP host.\n5. **How is a containerized contextual enrichment priced** — bundled into PubMatic's curation take, a Gracenote data-license fee, or a hosting fee? The central \"who keeps the spread\" question is unanswered for this tenant class specifically.\n\n---\n\n## Sources\n\n1. Nielsen / Gracenote, \"Gracenote and PubMatic Bring Curated Live Sports and Content-Level Deals to Programmatic CTV,\" nielsen.com news-center, June 17, 2026. https://www.nielsen.com/news-center/2026/gracenote-and-pubmatic-bring-curated-live-sports-and-content-level-deals-to-programmatic-ctv/ (accessed 2026-06-20). *Tier 1 — primary company release. Source for the ARTF/AgenticOS framing, the 0.1–0.5 ms latency, episode-level at-auction matching, the Live Sports Marketplace, \"50M+ titles and 80K+ channels,\" the 86% statistic, and executive quotes (Jake Richardson, Gracenote; Nicole Scaglione, PubMatic). Evidence of what the companies claim, NOT proof of live adoption or audited scale.*\n2. PR Newswire, \"Gracenote and PubMatic Bring Curated Live Sports and Content-Level Deals to Programmatic CTV,\" prnewswire.com, June 17, 2026. https://www.prnewswire.com/news-releases/gracenote-and-pubmatic-bring-curated-live-sports-and-content-level-deals-to-programmatic-ctv-302802828.html (accessed 2026-06-20). *Tier 1 — same primary release (New York / Redwood City dateline). Confirms verbatim ARTF/AgenticOS and 0.1–0.5 ms wording, \"Gracenote, Nielsen's content intelligence business,\" and full executive quotes.*\n3. Storyboard18, \"Gracenote, PubMatic team up to bring content-level targeting and live sports deals to CTV,\" storyboard18.com, June 18, 2026. https://www.storyboard18.com/brand-marketing/gracenote-pubmatic-team-up-to-bring-content-level-targeting-and-live-sports-deals-to-ctv-101537.htm (accessed 2026-06-20). *Tier 5 trade — independent pickup; corroborates the ARTF/AgenticOS framing and the \"see what is actually playing behind a CTV impression\" reading. Largely restates the release; modest independent analysis.*\n4. StockTitan, \"PubMatic, Gracenote add live sports data to CTV deals | PUBM Stock News,\" stocktitan.net, June 2026. https://www.stocktitan.net/news/PUBM/gracenote-and-pub-matic-bring-curated-live-sports-and-content-level-9eq257kbroh2.html (accessed 2026-06-20). *Tier 5 (investor-news aggregator) — corroborates the deal and date; reproduces the ARTF/0.1–0.5 ms and 86% claims. Aggregator of the release, not independent reporting.*\n5. PPC Land, \"Gracenote: missing show data is costing CTV billions in linear TV ad budgets,\" ppc.land, May 14, 2026. https://ppc.land/gracenote-missing-show-data-is-costing-ctv-billions-in-linear-tv-ad-budgets/ (accessed 2026-06-20). *Tier 5 trade — independent write-up of the Gracenote survey. Source for the 86% figure and its methodology: 500 U.S. media professionals (206 planners/strategists, 213 linear buyers, 81 programmatic traders), fielded March 5–23, 2026. Note: the survey is Gracenote's own commissioned research — directional, with a vendor interest in the answer.*\n6. Gracenote, \"Index Exchange and Gracenote team to enhance contextual intelligence in programmatic streaming TV,\" gracenote.com newsroom, September 16, 2025. https://gracenote.com/newsroom/index-exchange-and-gracenote-team-to-enhance-contextual-intelligence-in-programmatic-streaming-tv/ (accessed 2026-06-20). *Tier 1 — company release. Source for \"industry's first SSP integration of Gracenote contextual intelligence,\" brand-safety/Do-Not-Air controls, and the absence of any ARTF/containerization claim (i.e., a conventional integration).*\n7. Index Exchange / Nielsen, \"Index Exchange Launches Gracenote-Powered Show-Level Reporting with Spectrum Reach,\" nielsen.com / indexexchange.com, January 7, 2026 (announced at CES 2026). https://www.nielsen.com/news-center/2026/index-exchange-launches-gracenote-powered-show-level-reporting-with-spectrum-reach/ (accessed 2026-06-20). *Tier 1 — company release. Source for reporting-only, segment-free show-level transparency; Spectrum Reach as first adopter; \"the only SSP offering show-level reporting powered directly by Gracenote's content ID graph (TMS IDs).\" No ARTF/container claim.*\n8. thedesk.net, \"Index Exchange, Gracenote expand show-level transparency for ad buys,\" thedesk.net, January 2026. https://thedesk.net/2026/01/index-exchange-gracenote-expand-show-level-transparency-for-ad-buys/ (accessed 2026-06-20). *Tier 5 trade — independent account; confirms the September 2025 origin date and that the integration is reporting-only and \"a conventional data integration,\" with no containerization/ARTF.*\n9. Peer39, \"Connected TV (CTV) Contextual Targeting,\" peer39.com. https://www.peer39.com/connected-tv (accessed 2026-06-20). *Tier 1 (vendor product page) — establishes Peer39's program-level CTV contextual targeting (show, genre, rating, content quality) and DSP integration; evidence of capability, not of any ARTF/containerized deployment.*\n10. IRIS.TV / Beet.TV materials on IRIS_ID and the CTV contextual clean room (incl. Beet.TV, \"IRIS.TV's Field Garthwaite: Contextual Targeting Enables Privacy-First CTV Performance,\" Feb 2026; IRIS.TV product pages). https://www.iris.tv/product/iris-id/ ; https://www.beet.tv/2026/02/post-99763.html (accessed 2026-06-20). *Tier 1 (vendor) + Tier 5 (Beet.TV trade) — IRIS_ID scale (90M+ IDs; 40%+ CTV coverage), content-data clean-room model. No ARTF/container claim.*\n11. PubMatic, \"In CTV's New Era, Curation Gets Smarter: PubMatic & IRIS.TV Expand What's Possible,\" pubmatic.com blog, May 27, 2025. https://pubmatic.com/blog/in-ctv-new-era-curation-gets-smarter-pubmatic-iris-tv-expand-whats-possible/ (accessed 2026-06-20). *Tier 1 (vendor blog) — the PubMatic–IRIS.TV curation tie via IRIS_ID through Connect/Activate (PMP/PG deals). Explicitly NOT described as ARTF/AgenticOS/containerized — a conventional curation integration, useful as the contrast to the Gracenote container.*\n12. Comscore, \"Comscore Launches Daily Program-Level Reporting with Deduplicated Insights on Shows and Episodes across CTV and Linear TV,\" comscore.com, January 6, 2026. https://www.comscore.com/Insights/Press-Releases/2026/1/Comscore-Launches-Daily-Program-Level-Reporting (accessed 2026-06-20). *Tier 1 — company release. Program- and episode-level CTV and linear reporting \"Powered by Amazon Bedrock agentic AI on AWS\" (the AWS generative-AI service, NOT Bedrock Platform the DSP) — the source for the two-\"Bedrock\"s disambiguation.*"}, {"order": 12, "file": "12_Gap_Agency_Holdco_Posture.md", "title": "The Holdco Counter-Map — Agency Holding Companies and the Demand-Side Response to Containerized Supply", "summary": "", "body": "# The Holdco Counter-Map — Agency Holding Companies and the Demand-Side Response to Containerized Supply\n\n## Bottom Line\n\nThe supply side of containerized bidding is well charted — who builds the fabric and who rents a seat. But the demand side tends to flatten into either a closed-beta tester (InterMedia, Bay Street, Navigator, Canvas) or a generic \"winner\" that gains lower ad-tech tax. That misses the single most consequential demand-side actor: the **agency holding company**, which is not testing the standard so much as helping *write* it. WPP Media sits in the ARTF Container Project working group and the IAB Tech Lab Architecture Group; Basis Technologies sits in the Architecture Group; GroupM/WPP Media authored the curated-supply precondition the whole thesis depends on. **As of mid-2026, the holdco posture toward in-exchange containers is conspicuous restraint paired with parallel construction.** None of the three majors — WPP Media, Omnicom (now the largest holdco after closing IPG on November 26, 2025), or Publicis — has put a proprietary bidder inside Index Cloud, Decision Fabric, or OpenXBuild. Each is instead building its *own* spine and its *own* agentic buying layer, to which an SSP fabric would be, at most, one downstream venue. WPP's **Elevate28** (February 26, 2026) abandons the holding-company model for a single AI-enabled entity built on **WPP Open**, and WPP Media launched its own **Agentic Standards Initiative** and **Buyer Agent for Video** (June 18, 2026) — a buyer-agent / seller-agent topology that competes with, rather than enlists, the in-exchange container. Omnicom's post-IPG thesis is **scale-as-AI-training-data** plus a multibillion-dollar **principal-media** book (estimated $2B+ in 2025); principal media — owning the inventory and reselling it — is a different, and partly rival, way of \"getting closer to supply\" than co-locating a bidder. Publicis bets on the **Epsilon/Lotame/CoreAI/LiveRamp** identity spine. The deeper question — does containerized bidding accelerate brand **in-housing** and threaten the agency layer itself? — cuts both ways. It lowers the infrastructure barrier that historically protected the holdco's scaled-buying franchise (the Hyundai \"we want to own that\" model), but the holdcos' answer is to make themselves indispensable as the **AI/data/identity layer above** the fabric, not a tenant inside it. The synthesis: **the independent-agency testers and the holdco standard-setters are playing different games.** The testers want cheaper supply access without DSP infrastructure; the holdcos want to remain the orchestration brain as buying automates — and for them the in-exchange container is a tool to be governed and possibly absorbed, not a seat to rent. This is the most stale-prone material on the demand side: WPP's restructuring is four months old, the WPP Media buyer agent was new at the time of writing, and most forward-posture reads rest on a single trade analysis each.\n\n---\n\n## How to Read This Counter-Map\n\nThe earlier market map answers \"who keeps the spread\" from the SSP's seat. This is its **demand-side mirror**: it asks what the buyer *holding companies* — the entities that command the media dollars and, increasingly, co-author the standards — are doing in response to a supply side that now offers to host their logic. It proceeds in five moves: (1) why the holdco level is the structurally important unmapped actor; (2) the WPP Media case, where restructuring and standards-setting collide most sharply; (3) the Omnicom-post-IPG and Publicis cases and the **principal-media** alternative to co-location; (4) the in-housing dynamic — whether containerization disintermediates the agency layer or entrenches it; and (5) the independent-agency-vs-holdco split that the usual tester slate obscures.\n\nA note on evidence. Almost every forward-posture claim below rests on a **single trade analysis** (AdExchanger, Digiday, ExchangeWire, eMarketer) or a **company strategy update** (good evidence for what the company claims, never proof of execution). Holdco restructurings are announced in investor decks and executed over years; a February 2026 strategy slide is not a June 2026 operating reality. Where a claim rests on one outlet or one press release, that is noted. Read this as a map of *announced posture and disclosed strategy*, not audited behavior.\n\n---\n\n## 1. Why the Holdco Level Is the Unmapped Actor\n\nThe known tester slate — InterMedia Group, Bay Street Media, Navigator, Canvas Worldwide — is, with one exception, **independent agencies and advanced marketing platforms**, not holding-company subsidiaries. That is not an accident of sampling. It reflects a real divide. The independents are the natural early adopters of a technology whose pitch is \"compete without DSP-scale infrastructure\" [1][2]. The holdcos already *have* scale; for them the calculus is different, and their presence in the standard's governance — not its beta — is the tell.\n\n### 1.1 The holdcos are at the standards table, not in the tester pool\n\nThe governance roster is on record: the ARTF Container Project working group includes **WPP Media** alongside Index, OpenX, TTD, Chalice, Amazon, Netflix, Paramount, and others, and the IAB Tech Lab Architecture Group that governs the reference implementation includes **GroupM** (now WPP Media) and **Basis Technologies** among Extreme Reach, GumGum, Oracle, Tapad, and The Trade Desk [3]. That is a categorically different relationship to the technology than a closed-beta tester has. A tester can be dropped. A working-group member shapes what the container can see, how data egress is locked down, and which topology (in-exchange container vs. buyer-agent negotiation) the standard privileges. **The holdcos are helping decide whether the architecture that could disintermediate them gets built in a form they can live with.**\n\n### 1.2 The holdco is the demand-side precondition that goes unpersonified\n\nGroupM's **Premium Marketplace** and the broader supply-path-optimization (SPO) discipline are a load-bearing precondition: containerized bidding is \"only worth the engineering if there are a small number of big fabrics to move into,\" and SPO — Goodway cutting SSPs from ~20 to single digits, **GroupM building a curated Premium Marketplace**, TTD's OpenPath — did the concentration work first [4]. The usual telling stops there and never asks the forward question: *given that GroupM/WPP Media already curates supply through direct SSP relationships, is co-locating a container the next step, a competing path, or an irrelevance?* That question is the spine of what follows.\n\n### 1.3 The scale of what is at stake\n\nThe holdcos are no marginal demand-side actor. **WPP Media** (the former GroupM) manages \"over USD 60 billion in annual media investment across 80 markets\" [5] (a trade-profile figure — treat the exact number as approximate). After Omnicom closed its acquisition of IPG on **November 26, 2025**, the combined entity became \"the largest holding company by revenue, displacing WPP from the top position it held for years,\" per eMarketer citing Advertiser Perceptions [6][7]. When the question is whether the demand side becomes tenants of the fabric or builds around it, the answer for $60-billion-plus media engines matters far more than the answer for a closed-beta independent.\n\n---\n\n## 2. The WPP Media Case — Where Restructuring and Standards-Setting Collide\n\nWPP is the holdco named in the ARTF working group. It is also executing the most radical holdco restructuring of the cycle. The collision of those two facts is the heart of the matter.\n\n### 2.1 Elevate28 — the holding company dissolves into a single AI-enabled entity\n\nOn **February 26, 2026**, WPP announced **Elevate28**, a multi-year plan that *abandons the holding-company model itself*. In WPP's own language, the company is \"transitioning from a holding company structure to a single company\" to \"deliver fully integrated, AI-enabled solutions\" through four operating units — **WPP Media, WPP Creative, WPP Production, and WPP Enterprise Solutions** — across four regions [8]. WPP Media is \"formerly GroupM, rebranded last year\" [9]. The plan targets **£500 million in annualised gross savings by 2028** (~$677M) against ~£400M in implementation costs, on a three-phase arc: Stabilise (2026), Build (2027), Accelerate (2028+) [8][9]. CEO **Cindy Rose** (in role since September 2025) named the rationale bluntly: \"Our recent underperformance has been driven by excessive organisational complexity\" [9]. The context is existential — WPP's market cap fell from ~£25B in 2016 to below £3B by early 2026 [10].\n\nThe load-bearing piece here is the technology spine. All four units run on **WPP Open**, described in WPP's release as \"our pioneering agentic marketing platform,\" whose **Open Intelligence** layer \"securely connect[s] live data from clients, partners and WPP in a privacy-first way\" using InfoSum's data-collaboration technology [8]. The Accelerate phase explicitly targets \"a simpler, lower-cost, AI-enabled business\" [8]. **WPP is not restructuring toward becoming a container tenant. It is restructuring toward owning an AI orchestration platform that buys across whatever venues exist.** That is the MiQ move — a buyer-side intelligence layer — generalized to holdco scale, but pointed at *owning the layer above the auction*, not renting a seat inside it.\n\n### 2.2 The Agentic Standards Initiative — the holdco builds a rival topology\n\nThe clearest evidence that WPP Media is choosing parallel construction over tenancy arrived **June 18, 2026**, when WPP Media launched an **Agentic Standards Initiative** and unveiled a **Buyer Agent for Video** [11][12]. The Buyer Agent operates \"within WPP Open's Agentic Activation Orchestration Layer,\" coordinating \"how our people, agents, data, tools, approval controls, and partner systems interact\" [11]. The decisive detail is architectural: the initiative is a **buyer-agent / seller-agent** model in which \"media owners and platform partners will each operate their own Seller Agents and orchestration layers,\" covering \"audience discovery, inventory evaluation, planning recommendations, seller-agent communication, proposal and approval workflows\" [11]. Founding collaborators are premium media owners and standards bodies — **Comcast/FreeWheel, Disney, Fox, NBCUniversal, Netflix, Paramount, IAB Tech Lab, and Prebid.org** [11][13]. WPP Media expects to move \"from alpha and beta testing to a model capable of supporting large-scale TV and video investment over the next 6–9 months,\" with reference workflows and proposed standards shared \"in early 2027\" [11].\n\nThis is the analytical hinge. **WPP Media's chosen topology is the AdCP-style buyer-agent-negotiates-with-seller-agent model — the standards fault line discussed earlier — not the ARTF container-inside-the-exchange model, even though WPP Media sits in the ARTF working group.** The holdco is hedging across both standards camps: a contributor to the container spec, but a *builder* of the negotiation-agent alternative. For a $60B media engine, owning the buyer agent and its orchestration layer keeps the holdco in the position it values — the brain that decides. Becoming a container tenant inside Index or PubMatic would relocate that brain into a supply-side landlord's data center. WPP Media's executives frame this as continuity of the programmatic revolution, not surrender of it: CEO **Brian Lesser** opened the announcement, \"Two decades ago, the move to programmatic marked a fundamental change…\" [11].\n\n> **On the topology:** WPP Media is in the **ARTF Container Project** [3] *and* is building an **agent-negotiation** initiative with CTV owners [11] — the two rival topologies. Read WPP Media as **hedged across both**, with its own-build energy going to the agent-negotiation side, not the in-exchange container. No source documents WPP Media running a proprietary bidder inside any SSP fabric.\n\n### 2.3 The Premium Marketplace forward posture — federation, not co-location\n\nGroupM's Premium Marketplace stands as the SPO precondition. Its forward posture toward in-exchange compute is now researchable — and the answer is **federation through curation, explicitly not running its own logic inside the SSP.** Per AdExchanger (May 22, 2025), GroupM's collaboration with PubMatic centers on **curated deals via PubMatic's Connect**, where AI agents suggest deal IDs against campaign KPIs to tame the \"unmanageable\" number of deal IDs agencies juggle [14]. GroupM's **Jason Jutla** put the value plainly — \"reducing steps to publishers and to audiences is a very valuable thing\" — and, critically, described GroupM as training \"its buying processes to align with the way programmatic platforms like PubMatic handle real-time bidding\": a **federated** posture that leverages the SSP's proximity-to-publisher data advantage *without* acquiring the data asset or deploying GroupM's own models inside the exchange [14]. Jutla conceded the boundary is blurring — \"Everyone was asking what was the value of the SSP… Now [SSPs' proximity provides] differentiating data that's not available in the bidstream\" [14] — which is precisely the containerized-bidding value proposition. But as of that reporting, GroupM's chosen mechanism was **partnership-based curation, not containerization** [14].\n\nThe synthesis: WPP Media is \"getting closer to supply\" through **three** non-tenancy moves — curated marketplaces, an owned agentic buyer agent, and an AI/data orchestration spine — rather than by co-locating a bidder. The container is something its standards-group seat lets it shape, not something it has rented.\n\n> **A note on currency:** The GroupM/PubMatic federation read rests on a **single AdExchanger report dated May 2025** [14] — about a year old and predating both Elevate28 and the Buyer Agent. WPP Media's posture may have moved; treat this as the most recent *detailed* account, not a current-state guarantee.\n\n---\n\n## 3. Omnicom and Publicis — Scale, Principal Media, and the Identity Spine\n\nThe other two majors are chasing the same destination — own the layer above the fabric — by different routes. Neither is a container tenant. Both are building rival forms of \"closeness to supply.\"\n\n### 3.1 Omnicom post-IPG — scale-as-AI-fuel and the principal-media alternative\n\nOmnicom closed IPG on **November 26, 2025** [15], creating the largest holdco by revenue [6]. The merger thesis, per Digiday, is **scale as AI training data**: scale is now \"critical to the training models of the AI investments\" both companies emphasized, and the combined **Omni** platform is \"a central nervous system that connects all Omnicom units,\" now fed by **Acxiom** (from IPG) and **Flywheel** commerce data [16][17]. Omnicom positions enterprise AI as its \"core value proposition\" [7], building \"a central spine for identity, data, software and media trading that everything else plugs into: agencies, studios, in-house teams, and potentially even rivals\" [18].\n\nThe piece relevant to containerization is **principal media** — and it is the most important conceptual addition this account makes. Principal media is the practice of an agency *buying inventory as a principal* (owning it, taking purchase risk) and reselling it to clients, rather than acting purely as the client's agent [19]. It is a fast-growing multibillion-dollar holdco revenue stream: GroupM exceeded **$1 billion** in global \"non-product-related income\" (its internal euphemism for principal media) in 2023, with forecast 15% growth into 2024; Omnicom's estimated principal-media revenue exceeded **$2 billion in 2025** [19] (AdExchanger, March 18, 2026). Omnicom CEO **John Wren** is unapologetic: \"it is what it is… it is a product\"; GroupM CEO Brian Lesser says marketers \"are asking us for more\" [19].\n\nWhy this matters for the containerization thesis: **principal media is a rival answer to \"get closer to supply\" that often goes unnamed.** Co-locating a bidder inside an SSP fabric gets a buyer *closer to the impression*. Buying as principal gets a holdco *ownership of the inventory itself* — a deeper form of supply proximity, monetized as arbitrage margin rather than as performance lift. The two are not the same bet. A holdco maximizing principal-media margin has a structural reason to keep its trading **opaque and proprietary**, which sits in tension with the container model's \"decisions only, transparent governance\" framing. The Trade Desk's Jeff Green attacks exactly this: agencies \"who wave the flag of transparency publicly, but run from it in practice as they arbitrage in the inefficiencies of programmatic\" [19]. So the holdco posture toward containerization is partly *defensive of a different margin pool*: a transparent, lower-take-rate in-exchange container could erode the very inefficiencies principal media monetizes.\n\n> **A note on framing:** The principal-media revenue figures (GroupM $1B 2023, Omnicom $2B+ 2025) are AdExchanger's reporting of \"internal WPP documents\" and estimates [19] — single-outlet, partly estimated. The \"arbitrage in inefficiencies\" characterization is Jeff Green's — a directly interested DSP CEO — and should be read as a position, not settled fact. The ANA principal-media governance debate is taken up elsewhere.\n\n### 3.2 Publicis — the identity spine (Epsilon / Lotame / CoreAI / LiveRamp)\n\nPublicis's route is **data and identity**, not co-located compute. It acquired identity firm **Lotame** (announced March 2025) to feed Epsilon's \"identity spine,\" adding ~1.6 billion global IDs to push the audience graph \"close to 4 billion unique profiles\" and reach \"91% of all adults who use the internet\" [20][21] (vendor and press figures, not independently audited). It bolted on content-intelligence firm **AdgeAI** (March 2026) for its **CoreAI** platform. Most consequentially, it agreed to acquire **LiveRamp** for a **$2.2 billion** enterprise value to \"become a leader in data co-creation… an enabler of agentic business transformation\" [22][23][24]. Publicis raised its 2027–2028 growth objectives on the back of the deal [22].\n\nThe containerization-relevant read: Publicis is assembling the **identity-resolution and data-collaboration layer** that a containerized buyer model would *consume as an input*. A container running inside an SSP fabric still needs identity to be useful — and the decay of the identity substrate is itself a risk to the whole performance thesis. Whoever owns the dominant identity spine — Publicis via Epsilon/LiveRamp, Omnicom via Acxiom, WPP via WPP Open/InfoSum — holds leverage *over* the fabric, not dependence *on* it. **Publicis's bet is that the identity layer is the durable choke point, and the container a downstream execution venue that must come to its data.** The Drum's coverage flagged that the LiveRamp deal also concentrates risk — \"the exposure is significant\" — given LiveRamp's neutral-infrastructure role across rival holdcos [25].\n\n> **A note on currency:** The Publicis/LiveRamp deal was an **announced agreement** [22], not yet closed at the time of writing; integration risk is real (see Omnicom's \"mixed results\" integrating Acxiom, where CheckMyAds' Arielle Garcia argued Acxiom \"hasn't been able to thread the needle on justifying that $2.3 billion investment\" [16]). Identity-graph reach figures (91% / ~4B profiles) are vendor claims [20][21].\n\n### 3.3 The three-holdco posture, summarized\n\n| Holdco | Restructuring / spine | Containerized-bidding posture | \"Closer to supply\" mechanism | Source |\n|---|---|---|---|---|\n| **WPP Media** (ex-GroupM) | Elevate28 → single entity on **WPP Open**; **Buyer Agent for Video** + Agentic Standards Initiative | **Not a tenant.** ARTF working-group member (shapes spec); builds rival **agent-negotiation** topology | Curated Premium Marketplace (federation) + owned buyer agent + AI spine | [3][8][11][14] |\n| **Omnicom** (post-IPG) | Largest holdco; **Omni** spine fed by Acxiom + Flywheel | **Not a tenant.** No container deployment reported | **Principal media** ($2B+ 2025) — owns inventory, takes purchase risk | [6][16][18][19] |\n| **Publicis** | **CoreAI** + Epsilon + Lotame + (pending) LiveRamp | **Not a tenant.** No container deployment reported | **Identity spine** — owns the data layer the container must consume | [20][22][25] |\n\nThe pattern is stark and consistent: **all three majors are building the layer *above* the fabric — agentic orchestration (WPP), inventory ownership (Omnicom), identity (Publicis) — and none is running a proprietary bidder *inside* one.** The \"generic agency winner gains direct supply access\" story holds for the *independent* testers, not for the holdcos, whose strategy is to remain indispensable rather than disintermediate themselves into a tenant.\n\n---\n\n## 4. In-Housing — Does the Container Threaten the Agency Layer Itself?\n\nHere is the sharpest question of all: does containerized bidding accelerate brand **in-housing** (the Hyundai \"we want to own that\" model) by letting brands and agencies deploy proprietary models without DSP infrastructure — threatening the agency layer? The evidence says the *mechanism* is real and the *trend* is established. But containerization is an accelerant on an already-moving train, and the holdcos' counter is to absorb the trend rather than be erased by it.\n\n### 4.1 The in-housing trend is large, established, and pre-dates containers\n\nIn-housing is not speculative. Per the ANA, **82% of member organizations reported having an in-house agency** (up from 78% in 2018) [6][7]; an earlier ANA study found **35% of marketers had expanded in-house programmatic buying**, reducing the role of external agencies — more than double the ~14% of 2016 [26]. Brands that pulled programmatic in-house include **Kellogg, Netflix, and P&G**, citing control and protection of their own data [26]. AI is now an explicit accelerant: a Typeface survey found **60% of US senior marketing leaders said they spend less on agencies in 2025 as a direct result of AI** [6][7], and **87.3% of agency professionals believe the traditional agency model is broken or will be within 3–5 years** [27] (a single survey — treat the precise figure with caution). The structural pressure on the agency layer is real and well-attested, independent of containerized bidding.\n\n### 4.2 The container as in-housing accelerant — the Hyundai proof point\n\nContainerization sharpens the exact lever in-housing pulls. The proof point is already on the table: Hyundai, testing through OpenXBuild, feeds proprietary \"high-value actions\" (dealership test-drives) as conversion signals, **\"retains IP ownership of targeting models,\"** and explicitly wants to \"own that\" model rather than rent Google's Performance Max [28]. That is the in-housing thesis in one case: containerization lets an advertiser run a *proprietary model* against live supply **without owning DSP infrastructure** — removing the historical reason a brand needed either a DSP seat or an agency's scaled-buying franchise. If a brand can package its model as a container and run it inside the SSP, the infrastructure moat that protected the holdco's media-trading business thins.\n\n### 4.3 But the holdco answer is to *become* the in-housing partner, not to be erased\n\nThe countervailing force is that in-housing rarely means going it alone — and the holdcos have repositioned to be the partner of the in-housed brand. eMarketer's read of the 2026 landscape: it \"rewards those with scale, AI fluency, and proprietary data,\" and \"many brands now [move] to a hybrid model\" where in-house teams keep control and first-party data while agencies bring \"specialist expertise, buying power, and tech stacks\" [27][6]. The holdco spines described above are *designed to be the picks-and-shovels of in-housing*: Omnicom's Omni explicitly plugs into \"in-house teams\" [18]; WPP Open Pro is a **self-service** tier [8]; Publicis's identity graph is sold as a brand-side data advantage. **The container need not disintermediate the holdco if the holdco supplies the model-deployment platform, the identity, and the orchestration the in-housed brand runs.** The threat is real to the *labor-arbitrage, undifferentiated-execution* part of the agency. The holdco bet is that the *technology-and-data* part survives and grows.\n\n### 4.4 The honest two-sided synthesis\n\n- **Accelerant case:** containerization lowers the infrastructure barrier (no DSP needed, no public-cloud bidder) that historically forced brands through agencies or DSPs; combined with AI authoring the model, it makes proprietary in-house buying cheaper and more capable. The Hyundai case is the demonstration; the ANA/Typeface data is the trend. This pressures the holdco's scaled-buying and principal-media franchises.\n- **Entrenchment case:** in-housing is overwhelmingly hybrid; the scarce inputs are identity, premium-supply curation, AI orchestration, and governance — exactly what the holdco spines now sell. A container still needs a model, data, identity, and a buying strategy; the holdco aims to own those. Containerization relocates *where compute runs* without, by itself, supplying the *intelligence that runs there*.\n\nThe net is indeterminate, hostage to a variable no current source resolves: **whether the durable value in media buying is the infrastructure (which containers commoditize) or the data-and-decisioning layer (which holdcos are racing to own).** Any forecast (taken up in the outlook) should treat holdco disintermediation-by-container as a *live downside scenario for the agency labor model*, not a settled outcome — and should note that the holdcos' explicit strategy is to convert the in-housing wave into platform and data revenue.\n\n---\n\n## 5. The Two Games — Independent Testers vs. Holdco Standard-Setters\n\nThe usual tester slate obscures a real strategic divergence. The independents and the holdcos are not early- and late-adopters of the same move. They are playing **different games with different win conditions.**\n\n### 5.1 The independent-agency game — supply access without infrastructure\n\nFor independents, containerized bidding is plainly attractive: it delivers \"materially broader supply without proportional infrastructure spending\" [2]. Bedrock's launch testers — **InterMedia Group, Bay Street Media, Navigator** — are independents for whom QPS throttling and cloud cost were binding constraints [1][2]. The independent SPO cohort (Goodway, which cut SSPs from ~20 to single digits and claims **28% more spend reaches working media** via its Goodpath/Jounce curation [29]) is already \"getting closer to supply\" through curation; the container is the next rung. First Party Capital — a Bedrock backer, and therefore a commercially interested voice — frames the value as letting \"more value flow back to agencies and publishers instead of being consumed by operational costs\" [2][30]. **The independent game is margin and access: the container lets a sub-scale buyer punch above its infrastructure weight.**\n\n### 5.2 The holdco game — remain the brain as buying automates\n\nFor holdcos, the binding constraint was never infrastructure scale — they have it. Their existential risk is **disintermediation by automation**: if AI and direct supply access let brands and SSPs transact without the holdco's orchestration, the franchise erodes. So the holdco game is to **own the standards, the orchestration agent, the identity, and the inventory** — to make the automated future route *through* them. Omnicom and Publicis have already moved from passive participants to active scrutinizers of the DSP layer: both ran **formal audits of The Trade Desk's fee structures** in 2026 [31], and TTD's counter — expanding direct-to-brand relationships (\"JBPs accounted for well over half of our business,\" per Jeff Green) — is itself an attempt to route around holdco gatekeepers [31]. The holdcos are at once pressuring the DSP layer from above and building agent and identity layers that could absorb its function. **The holdco game is control: stay the indispensable orchestrator of a buying process automating underneath them.**\n\n### 5.3 Why the two games produce opposite container postures\n\nThis is the synthesis that matters. The independent *rents the container* because it lacks infrastructure and the container supplies it. The holdco *declines to rent, shapes the standard, and builds the layer above* because tenancy would relocate its decisioning brain into a supply-side landlord's data center — surrendering the leverage (and the principal-media and data margins) that are its actual franchise. The holdco worry was captured early on in Digiday's words: executives are wary of \"vertically integrated auction environments where they feel their scaled buying operations lose leverage\" [32]. **That single sentence is the whole holdco posture: the leverage the independent gains by going in is the leverage the holdco fears to lose by going in.**\n\n> **A note on framing:** The \"two games\" framing is an analytical synthesis across multiple trade sources, not a claim any single source makes in these words. It is an *inference*, grounded in the divergent observed behavior (independents as testers [1]; holdcos as standard-setters [3] and own-builders [11][18][20]) and the leverage worry [32]. Read it accordingly.\n\n---\n\n## 6. What This Adds to the \"Who Keeps the Spread\" Picture\n\nThe earlier \"who keeps the spread\" exhibit gives agencies one line (\"Gains — direct supply access, 'lower ad tech tax'\"). That line is right for the independent testers and incomplete for the holdcos. The demand-side seat splits in three:\n\n| Demand-side seat | Pre-container posture | Mid-2026 direction | Evidence strength |\n|---|---|---|---|\n| **Independent agency / SPO shop** (InterMedia, Bay St., Navigator, Goodway) | Buy through DSPs; throttled, sub-scale | **Gains** — rents the container; broader supply, lower tax | Medium (testers + SPO data) [1][2][29] |\n| **Holdco as standard-setter** (WPP Media in ARTF) | Buy through DSPs at scale | **Shapes, doesn't rent** — co-authors the spec; builds rival agent topology | Medium (governance roster + own-build) [3][11] |\n| **Holdco as layer-above-fabric** (Omnicom/Publicis spines) | Scaled buying + nascent data | **Builds around** — principal media (Omnicom), identity (Publicis), AI orchestration (WPP Open) | Medium (one analysis each) [18][19][20] |\n| **Brand in-housing** (Hyundai model) | Buy through agency/DSP | **Enabled** — proprietary model in-container, no DSP needed; pressures agency labor | Medium (Hyundai case + ANA/Typeface trend) [28][26][6] |\n\nThe corrected synthesis: **margin and access flow to the independents that rent the seat and to the brands that in-house; control accrues to the holdcos that shape the standard and own the layer above — provided the durable value sits in data, identity, and orchestration rather than in the commoditized infrastructure the container relocates.** The holdco is neither a \"tester\" nor a generic \"winner.\" It is the actor deciding, from inside the standards body and from atop its own AI spine, whether the architecture that could disintermediate it gets built in a form it can absorb.\n\n---\n\n## Open Questions\n\n1. **Will any holdco ever run a proprietary bidder inside an SSP fabric?** As of mid-2026 none has, and all three are building the layer *above* the fabric instead. The thesis's holdco-scale significance hinges on whether WPP Media's owned **Buyer Agent** ever deploys as an in-exchange container, or whether the holdcos permanently prefer agent-negotiation and federation. No source resolves this.\n2. **Which topology wins inside the holdcos — ARTF containers or AdCP-style agent negotiation?** WPP Media is hedged across both (ARTF member *and* agent-negotiation builder). The standards fault line is, at the holdco level, an *unresolved internal hedge*, not a chosen side.\n3. **Does the container erode principal media?** A transparent, lower-take-rate in-exchange model is in tension with the opaque arbitrage that principal media ($2B+ at Omnicom) monetizes. Whether the holdcos resist containerization *because* it threatens that margin pool is plausible but undocumented.\n4. **Is in-housing-by-container a real threat or a hybrid that feeds the holdcos?** The Hyundai case proves the mechanism; the ANA/Typeface data proves the trend; but the holdco spines are explicitly built to be the in-housing partner. The net effect on the agency layer is indeterminate and source-thin.\n5. **Has GroupM/WPP Media's federation posture survived Elevate28 and the Buyer Agent?** The detailed \"federation, not co-location\" account is a May 2025 AdExchanger piece — thirteen months stale, pre-restructuring. A current-state read of WPP Media's SSP posture is the highest-value update.\n6. **Will holdco DSP-fee audits (Omnicom, Publicis vs. TTD) tip into building/buying a bidder?** The audits signal scrutiny; whether scrutiny becomes a make-or-buy decision on owned bidding infrastructure is unanswered.\n\n---\n\n## Sources\n\n1. Index Exchange, \"Introducing Index Cloud,\" indexexchange.com, Apr 21, 2026. https://www.indexexchange.com/2026/04/21/introducing-index-cloud/ (accessed 2026-06-20). *Tier 1 — company announcement; Index Cloud, Bedrock, named independent testers (InterMedia, Bay Street, Navigator).*\n2. PPC Land, \"Bedrock becomes first DSP to run its bidder inside an exchange,\" ppc.land, Apr 2026. https://ppc.land/bedrock-becomes-first-dsp-to-run-its-bidder-inside-an-exchange/ (accessed 2026-06-20). *Tier 4/5 trade — \"broader supply without proportional infrastructure,\" decoupling thesis, agency-access framing.*\n3. Adweek / SmartyAds / medianews4u (ARTF working-group + Architecture Group roster), 2025–26. https://www.adweek.com/media/iab-tech-lab-ai-agentic-rtb-framework/ (accessed 2026-06-20, via search; Adweek body paywalled). *Tier 4/5 — WPP Media in ARTF Container Project; GroupM + Basis Technologies in IAB Tech Lab Architecture Group.*\n4. AdExchanger, \"AdExplainer: What Is Supply-Path Optimization (SPO)?\" adexchanger.com. https://www.adexchanger.com/adexplainer/adexplainer-what-is-supply-path-optimization-spo/ (accessed 2026-06-20). *Tier 4 trade — Goodway 20→single-digit SSPs; GroupM Premium Marketplace; TTD OpenPath.*\n5. Storyboard18, \"The world's largest media agencies: Inside WPP Media, Omnicom Media, Publicis Media, Dentsu and Havas,\" storyboard18.com, 2026. https://www.storyboard18.com/brand-makers/the-worlds-largest-media-agencies-inside-wpp-media-omnicom-media-group-publicis-media-dentsu-and-havas-89698.htm (accessed 2026-06-20). *Tier 5 trade — WPP Media \"$60B+ across 80 markets\"; consolidation of GroupM under WPP Media. Single-source for the dollar figure.*\n6. eMarketer, \"FAQ on ad agencies: Consolidation, AI disruption, and what's changing in 2026,\" emarketer.com, 2026. https://www.emarketer.com/content/faq-on-ad-agencies--consolidation--ai-disruption--what-s-changing-2026 (accessed 2026-06-20). *Tier 5 analytical — Omnicom-IPG largest holdco (citing Advertiser Perceptions); Big Six US share 44.6%→29.6%; ANA 82% in-house; Typeface 60% spend-less-due-to-AI; hybrid-in-housing framing.*\n7. eMarketer, \"FAQ on AI media buying: Platform tools, agency strategy, and how to win in 2026,\" emarketer.com, 2026. https://www.emarketer.com/content/faq-on-ai-media-buying--platform-tools--agency-strategy--how-win-2026 (accessed 2026-06-20). *Tier 5 analytical — scale/AI-fluency/proprietary-data thesis; Publicis AdgeAI (Mar 2026) + Lot
