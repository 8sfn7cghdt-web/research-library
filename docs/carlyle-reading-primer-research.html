#pager { max-width: 700px; width: 100%; margin: 0 auto; padding: 1.1rem 2rem 3rem;
  display: flex; align-items: center; justify-content: space-between; font-family: var(--sans);
  border-top: 1px solid var(--border); }
#pager button { background: none; border: 0; border-radius: 0; padding: .2rem 0;
  font-family: var(--sans); font-size: .68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .12em; color: var(--accent); cursor: pointer; max-width: 40%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s var(--ease), transform .16s var(--ease); }
#pager button:hover:not(:disabled) { color: var(--text); }
#prev:hover:not(:disabled) { transform: translateX(-3px); }
#next:hover:not(:disabled) { transform: translateX(3px); }
#pager button:disabled { opacity: .35; cursor: default; }
#pager-label { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--muted); }

  body.menu-open #sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  #menu-btn { display: block; }
  #main { margin-left: 0; }
  #content { padding-top: 3.6rem; }

/* a deep-linked passage flashes briefly when the reader scrolls to it */
@keyframes passageFlash { 0% { background: var(--mark); } 100% { background: transparent; } }
.passage-flash { animation: passageFlash 2.2s ease; border-radius: 4px; box-decoration-break: clone; }
/* related reading at the foot of the reading column */

.related-h { font-family: var(--display); font-weight: 600; font-size: 1.08rem; margin: 0 0 .9rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

  position: relative;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease),
              border-color .16s var(--ease), outline-color .16s var(--ease); }
.related-card:hover, .related-card:focus-visible { border-color: var(--text);

  letter-spacing: .14em; color: var(--accent); margin: 0 0 .3rem; }

@media (min-width: 861px) {

  align-items: center; justify-content: center; }

<script id="corpus-data" type="application/json">{"slug": "carlyle-reading-primer-research", "title": "Before You Open Carlyle", "subtitle": "A reader's primer to The French Revolution: A History (1837)", "author": "", "generated": "", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces on Reading Carlyle's The French Revolution", "summary": "Thomas Carlyle's The French Revolution (1837) is a three-volume history written as if it were happening in front of you. It is not a safe guide to what happened, and it is not meant to be: read it as a dramatized eyewitness, alongside a sober history, and it is the most gripping account of the Revolution in English.", "body": "# Six Easy Pieces on Reading Carlyle's *The French Revolution*\n### What to know before you open the first of three volumes\n\n## A history that refuses to stay in the past tense\n\nOpen the book to the Bastille and you do not read that the crowd stormed the prison. You read that the crowd *is storming it*, right now, and that you are standing in the smoke. Thomas Carlyle, a poor Scottish writer, published *The French Revolution: A History* in 1837. He wrote it in the present tense, so that nobody in it yet knows how it ends.\n\nThat is the one idea to carry in. This is a book to be *experienced*, not consulted. Carlyle believed the Revolution was a kind of judgment: a society whose kings, priests and laws had hollowed out into empty forms (he calls them \"Shams\") was burned down by something real. He did not write to explain it. He wrote to make you stand inside it.\n\n## Why bother with a book that gets things wrong\n\nIt does get things wrong. Carlyle fixes a journey's length wrongly, gives some dramatic moments more pages than their importance deserves, and sees the Revolution through a stern Protestant moral lens that no modern historian shares. Yet people have kept reading it for nearly two centuries. Charles Dickens kept it by his side while writing *A Tale of Two Cities*, and in his preface he said no one could hope to add to \"the philosophy of Mr. Carlyle's wonderful book.\"\n\nThe reason is simple. Most history tells you what happened. Carlyle makes you feel what it was like to be there when it did. Use him for that, and use a sober historian for the facts.\n\n## What you need to know about the Revolution first\n\nCarlyle wrote for readers who already knew the plot, so he skips the connective tissue. Here it is. By 1789 the French monarchy was broke. It tried to tax the privileged, and the privileged refused, so the king called a national assembly, the Estates-General, that he could not control. Over the next six years, the pattern was a ratchet. Each crisis (bread, money, the king's attempted escape, foreign invasion, civil war) made the next faction more radical and the last one look like traitors. The Bastille fell in July 1789. The monarchy fell in August 1792. The king was executed in January 1793. Then came the Terror, the stretch of months when the Revolution put its own enemies, and then its own leaders, to death. It ended with the fall of Robespierre in July 1794 and, in October 1795, a young general named Bonaparte firing cannon into a royalist crowd: Carlyle's \"whiff of grapeshot,\" where his book stops.\n\n## How the book is built, and the cast\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 605\" role=\"img\" aria-label=\"The architecture of Carlyle&#8217;s French Revolution as three stacked rows of blocks, one per volume, each block sized to its chapter count. Volume I, The Bastille, has seven books and 50 chapters; Volume II, The Constitution, six books and 54 chapters; Volume III, The Guillotine, seven books and 55 chapters; 159 chapters in all. Ten numbered markers show where the ten minimum-viable chapters fall: one in Book 1.1, one each in 1.5 and 1.7, one each in 2.3, 2.4 and 2.6, and one each in 3.1, 3.2, 3.4 and 3.7.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-s t x=\"504\" y=\"429\" text-anchor=\"start\" font-size=\"9\">Terror<\/text>\n<text x=\"480\" y=\"442\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.5<\/text>\n<text x=\"504\" y=\"442\" text-anchor=\"start\" font-size=\"9\">Terror the Order of the Day<\/text>\n<text x=\"480\" y=\"455\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.6<\/text>\n<text x=\"504\" y=\"455\" text-anchor=\"start\" font-size=\"9\">Thermidor<\/text>\n<text x=\"480\" y=\"468\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.7<\/text>\n<text x=\"504\" y=\"468\" text-anchor=\"start\" font-size=\"9\">Vend&#233;miaire<\/text>\n<line x1=\"40\" y1=\"485\" x2=\"660\" y2=\"485\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"40\" y=\"501\" text-anchor=\"start\" font-size=\"8.6\" class=\"t-muted\" letter-spacing=\"1.5\">THE MINIMUM: TEN CHAPTERS (marked above, at their place in the book)<\/text>\n<text x=\"40\" y=\"519\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">1<\/text>\n<text x=\"56\" y=\"519\" text-anchor=\"start\" font-size=\"9\">1.1.I &#8220;Louis the Well-Beloved&#8221;<\/text>\n<text x=\"40\" y=\"532\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">2<\/text>\n<text x=\"56\" y=\"532\" text-anchor=\"start\" font-size=\"9\">1.5.VI &#8220;Storm and Victory&#8221;<\/text>\n<text x=\"40\" y=\"545\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">3<\/text>\n<text x=\"56\" y=\"545\" text-anchor=\"start\" font-size=\"9\">1.7.IV &#8220;The Menads&#8221;<\/text>\n<text x=\"40\" y=\"558\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">4<\/text>\n<text x=\"56\" y=\"558\" text-anchor=\"start\" font-size=\"9\">2.3.VII &#8220;Death of Mirabeau&#8221;<\/text>\n<text x=\"40\" y=\"571\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">5<\/text>\n<text x=\"56\" y=\"571\" text-anchor=\"start\" font-size=\"9\">2.4.VII &#8220;The Night of Spurs&#8221;<\/text>\n<text x=\"350\" y=\"519\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">6<\/text>\n<text x=\"366\" y=\"519\" text-anchor=\"start\" font-size=\"9\">2.6.VII &#8220;The Swiss&#8221;<\/text>\n<text x=\"350\" y=\"532\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">7<\/text>\n<text x=\"366\" y=\"532\" text-anchor=\"start\" font-size=\"9\">3.1.IV &#8220;September in Paris&#8221;<\/text>\n<text x=\"350\" y=\"545\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">8<\/text>\n<text x=\"366\" y=\"545\" text-anchor=\"start\" font-size=\"9\">3.2.VIII &#8220;Place de la R&#233;volution&#8221;<\/text>\n<text x=\"350\" y=\"558\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">9<\/text>\n<text x=\"366\" y=\"558\" text-anchor=\"start\" font-size=\"9\">3.4.I &#8220;Charlotte Corday&#8221;<\/text>\n<text x=\"350\" y=\"571\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t4)\" font-weight=\"bold\">10<\/text>\n<text x=\"366\" y=\"571\" text-anchor=\"start\" font-size=\"9\">3.7.VII &#8220;The Whiff of Grapeshot&#8221;<\/text>\n<text x=\"350\" y=\"595\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">a borrower&#8217;s three-volume set: the middle volume is the longest row but the shortest list of books<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> Ten chapters, ten different books: the emergency ration samples exactly half of the twenty (three in Volume I, three in II, four in III) and passes over the rest, so it delivers the pictures but not the argument, which accumulates across all 159 chapters.<\/figcaption>\n<\/figure>\n\n\nThe work has three volumes: *The Bastille*, *The Constitution* and *The Guillotine*. Together they hold 20 books and 159 chapters (7 books in the first volume, 6 in the second, 7 in the third). It runs to about 288,000 words, and it is built like a series of set pieces, not a chain of cause and effect. Volume I is a slow fuse: three books of rot, then the explosion at the Bastille and the women's march on Versailles. Volume II is the long middle, where a paper Constitution cannot make a nation march, with four peaks to read for: the Feast of Pikes, the death of Mirabeau, the flight to Varennes, and 10 August. Volume III is the one everyone remembers: the king's trial, Charlotte Corday, the Terror and the fall of Robespierre.\n\nCarlyle does not hand you a cast list. He nicknames people on sight and judges them by one test: is this person a Reality or a Sham? Robespierre is \"seagreen.\" Danton is a Titan. The market-women who marched on Versailles are \"Judiths,\" after the biblical heroine. Lafayette is \"Cromwell-Grandison,\" a general who is half dictator and half gentleman. Learn the nicknames and you will recognize people faster than if you try to memorize the political parties.\n\n## Where to be careful\n\nTreat the set pieces as dramatized testimony, not the record. Three soft spots matter most: Varennes (the flight of the royal family), where a nineteenth-century historian found the distances and timings carelessly wrong; Mirabeau, whom Carlyle admires more than later documents about his dealings with the court allow; and the September Massacres, where the scale and who was responsible are still argued over. His casualty numbers at Nancy, Avignon and the Champ-de-Mars run higher than reference works give. And he gives the Terror's machinery less attention than its atmosphere, while saying almost nothing of the 1794 abolition of slavery in the colonies.\n\nThere is also a trap in his vocabulary. Two words famous as \"Carlylisms,\" *Dryasdust* and *Dilettantism*, do not appear in this book at all. They belong to his other works.\n\n## How to read it, and what to expect\n\nLearn his moves in the first fifty pages: the narrator who stands in the crowd, the capitalized forces (Sham, Paper, Sansculottism), the exclamations and the mockery under the solemnity. Read aloud when a sentence jams. It is a book written to be heard, and the audio recording runs about thirty-seven hours across the three volumes.\n\nFor a first reading, buy the Oxford World's Classics paperback or start free on Project Gutenberg, and keep a balanced modern history beside you. Doyle's *Oxford History of the French Revolution* is the safe pick. Go at three books a week and finish in six weeks, or two books a week in twelve. If you have only a few evenings, read these ten chapters: Louis the Well-Beloved, Storm and Victory, The Menads, Death of Mirabeau, The Night of Spurs, The Swiss, September in Paris, Place de la Révolution, Charlotte Corday, and The Whiff of Grapeshot.\n\nYou will know you read it well if, at the end, you can feel the crowd and still say what Carlyle got wrong."}, {"order": 1, "file": "01_The_Revolution_In_Order.md", "title": "The Revolution in Order: What Carlyle Assumes You Already Know", "summary": "A plain chronological briefing on the French Revolution from the death of Louis XV (1774) to Vendémiaire (1795), told as one causal story, mapped onto Carlyle's three volumes, with five places where his emphasis departs from the modern account.", "body": "# The Revolution in Order: What Carlyle Assumes You Already Know\n\n## Bottom Line\n\nCarlyle wrote for readers who already knew the plot of the Revolution, so he skips the connective tissue and plunges into set pieces. This chapter supplies that tissue: a bankrupt monarchy tried to tax its privileged orders, summoned a national assembly it could not control, and then lost the initiative step by step to the Paris crowd, to its own indecision, and finally to a war that made every compromise look like treason. The causal engine to keep in view is a ratchet: each crisis (money, bread, the king's flight, invasion, civil war) made the next faction more radical and the previous one a traitor, until the Terror consumed its own authors and the survivors built a regime designed to stop the ratchet. Carlyle's three volumes (The Bastille, The Constitution, The Guillotine) follow this arc faithfully, but his emphasis falls on crowds, personalities and portents more than on finance, ideology or the provinces, and a modern reader should know where he leans [1][2].\n\n## How to use this chapter\n\nThis is a map, not a substitute for the book. It tells you what happened and why, in order. Where it is useful, it also tells you where Carlyle spends his time. The book's own structure is a fixed point: three volumes, twenty books and 159 chapters, as the table of contents of the Project Gutenberg text shows [1]. Volume I, \"The Bastille,\" has seven books (50 chapters) and runs from Book I, \"Death of Louis XV,\" through Book VII, \"The Insurrection of Women.\" Volume II, \"The Constitution,\" has only six books (54 chapters) and runs from \"The Feast of Pikes\" to \"The Marseillese.\" Volume III, \"The Guillotine,\" has seven books (55 chapters) and runs from \"September\" to \"Vendémiaire.\" The book's composition, sources and reputation are treated in a companion chapter of this primer [2]; this chapter stays with the events themselves.\n\nOne warning about Carlyle's relation to chronology. He is not a strict annalist. He loops back, leaps forward, and halts a scene for pages to look at one face. The dates below are the skeleton; the book is the flesh and often the hallucination. Where a section below says \"Carlyle gives this x,\" the claim is about proportion and placement as visible in the table of chapter titles, not a word count.\n\n## 1. The old regime and its money problem (1774-1786)\n\nLouis XV died of smallpox on 10 May 1774, and Carlyle opens with the deathbed [1]. The first book, \"Death of Louis XV,\" is a portrait of a monarchy that has stopped believing in itself. The successor, Louis XVI, was nineteen, well-meaning, indecisive, and married to Marie-Antoinette, an Austrian archduchess whom much of France regarded as a foreigner. Carlyle's second book, \"The Paper Age,\" is about what happened to ideas and money in this reign: Voltaire the \"Patriarch,\" Beaumarchais, Rousseau's \"Contrat Social,\" the chapter called \"Windbags\" on a talking society that believes it can climb to the Empyrean on words, and a culture of printed paper that has outrun the realities beneath it. The pun is intentional and will recur, because the Revolution runs on paper money (assignats) and paper constitutions.\n\nThe structural problem was fiscal and constitutional, not moral. The French crown could not tax its richest subjects effectively. The nobility and clergy enjoyed large exemptions, and the tax system was a patchwork in which the burden fell on peasants and the urban poor. The crown's finances were damaged further by an expensive naval and colonial war against Britain, culminating in support for the American rebels (1778-83), which was financed by borrowing rather than by taxes. Reform ministers such as Turgot and Necker tried to rationalise the system, and were removed when privileged interests balked. This is the standard account in Doyle's work on the Revolution's origins, and it remains the backbone of the modern view that the monarchy fell from within, driven by a fiscal and political crisis of its own, before social revolution from below made it irreversible [3]. Carlyle's book acknowledges the debts but narrates them as a story of one minister after another trying a new patch.\n\nWhere this falls in Carlyle: Volume I, Books I and II. The ministers appear in Book III, \"The Parlement of Paris,\" which has chapters on Calonne, the Notables, and Loménie de Brienne [1].\n\n## 2. The failure of reform and the road to the Estates-General (1786-1789)\n\nBy 1786 the controller-general Calonne told the king that the deficit could not be closed by economies; the privileges themselves had to go. To avoid the Parlements, the high courts of law that claimed the right to register (or block) royal edicts, he called a hand-picked Assembly of Notables in February 1787. They refused, and Calonne fell. His successor, Loménie de Brienne, tried again with edicts, then with a clash with the Parlement of Paris, which declared that only the Estates-General (the nation's traditional representative body, last summoned in 1614) could approve new taxes. By the summer of 1788 the monarchy was in effect bankrupt, forced to concede, and in August 1788 it announced that the Estates-General would meet. Necker, popular and recalled, returned to the finance ministry [3].\n\nTwo things happened in the months between summoning and meeting. First, the agricultural year was disastrous: a hailstorm in July 1788 and a hard winter made bread dear, and the winter of 1788-89 was one of unusual cold. Second, a pamphlet war erupted about how the Estates would vote. Traditionally the three Estates (clergy, nobility, Third Estate, meaning everyone else) met separately and voted by order, so the two privileged orders could always outvote the commoners. The Third Estate demanded double its representation and voting by head. Abbé Sieyès's pamphlet \"What Is the Third Estate?\" gave the programme its famous opening: that the Third Estate is everything, has been nothing, and asks to be something. The king doubled the Third's deputies but left the voting question unresolved. That omission was the fuse.\n\nWhere this falls in Carlyle: Volume I, Book III (\"The Parlement of Paris\") and Book IV (\"States-General\"), with its chapters \"The Election,\" \"Grown Electric\" and \"The Procession\" [1]. The electric image is characteristic. Carlyle treats the spring of 1789 as a nation becoming conductive to a single charge.\n\n## 3. The National Assembly and the Tennis Court Oath (May-June 1789)\n\nThe Estates-General opened at Versailles on 5 May 1789 with a procession. Then nothing happened. The Third Estate refused to verify its credentials separately; for weeks the three orders argued about method. Carlyle's Book V, \"The Third Estate,\" opens with a chapter called \"Inertia,\" and the word is accurate. On 17 June the Third Estate, joined by some clergy, declared itself the National Assembly, a claim to represent the whole nation. On 20 June, finding their hall locked, the deputies gathered in a nearby indoor tennis court and swore not to disperse until they had given France a constitution. Historians treat this as the true constitutional break, since a body of deputies had claimed sovereignty on behalf of the nation. The king ordered a royal session on 23 June, which tried to reassert the old order; the Third Estate refused to leave when told to; the king backed down, and by 27 June he ordered the other two orders to join the Assembly [3].\n\nThis is also the moment when the monarchy began to prepare force. Troops, many of them foreign regiments, moved towards Paris and Versailles. Necker was dismissed on 11 July. The rumour in Paris was that the court would dissolve the Assembly by arms. Carlyle's chapters on Broglie \"the War-God\" and on the calls \"To Arms!\" and \"Give us Arms\" belong to this tension [1].\n\n## 4. The Bastille and the first great fear (July-August 1789)\n\nOn 14 July 1789 a Paris crowd, searching for weapons and gunpowder, attacked the Bastille, a medieval fortress used as a state prison and symbol of arbitrary royal power. It held seven prisoners. The governor, de Launay, was killed after the surrender, and his head was paraded on a pike. The fall of the Bastille was not a military event of any size; it was a political event of enormous size, because it demonstrated that the army could not be relied on to suppress Paris, and that the king had lost control of the capital. Louis visited the city on 17 July and accepted the tricolour cockade. Carlyle's chapters \"Storm and Victory\" and \"Not a Revolt\" bracket the event, and \"The Lanterne\" records the first lynchings, the grim underside [1].\n\nThe summer brought a second shock in the countryside, the Great Fear: panic spread through rural France in late July and early August, driven by rumours that brigands, in the pay of aristocrats, were coming to burn the crops. Peasants armed themselves and attacked manor houses and burned feudal records. The panic forced the Assembly to act. On the night of 4 August the deputies voted to abolish feudal privileges and seigneurial dues in a night of emotional speeches, though the details were negotiated for months. On 26 August the Assembly issued the Declaration of the Rights of Man and of the Citizen [3]. Carlyle gives the countryside less attention than the city, a point returned to below. He does treat the \"Brigands\" panic in Book V and the night of 4 August in Book VI, but he sees both mainly from Paris and the Assembly.\n\nWhere this falls in Carlyle: the Bastille is the climax of Volume I, Book V; Book VI, \"Consolidation,\" covers the Assembly's work of making a constitution, with chapters titled \"The Constituent Assembly\" and \"The General Overturn,\" a title that gives away his attitude to the August legislation [1].\n\n## 5. The October Days and the king in Paris (October 1789)\n\nBread remained short. On 5 October 1789 a crowd of Parisian women, many from the market districts, marched to Versailles to demand bread and to confront the king; thousands of National Guards under Lafayette followed. The crowd invaded the palace the next morning, and the royal family was escorted to Paris, to the Tuileries palace, where in effect they became hostages of the capital. The Assembly followed soon after. This is a decisive hinge: the monarchy was now inside Paris, under the eyes and the pressure of the crowd and the press. Carlyle gives the whole of Book VII to this episode, \"The Insurrection of Women,\" with eleven chapters, a very large allocation for a three-day event, and chapter titles such as \"The Menads,\" \"Usher Maillard,\" \"To Versailles\" and \"Lafayette\" show why: it suits his taste for a crowd with faces [1].\n\n## 6. The Constituent Assembly, the clergy, and the Feast of Pikes (1790)\n\nThrough 1790 the National Assembly (usually called the Constituent Assembly) rebuilt France on rational lines: it replaced the old provinces with eighty-three departments, abolished the nobility's titles, and removed the internal customs barriers. It also nationalised Church lands in November 1789 to cover the debt, issuing paper money secured on them (assignats), then in July 1790 passed the Civil Constitution of the Clergy, which made priests state-paid officials elected by local voters. In November 1790 it required them to swear an oath to the new order. About half refused, creating a split between \"juring\" and \"non-juring\" (refractory) clergy. Historians count this as one of the Revolution's most damaging own goals, because it turned religion into a line of political division, especially in the west of France [3].\n\nOn 14 July 1790, the first anniversary of the Bastille, the Festival of Federation took place on the Champ de Mars in Paris, where delegates from every region swore loyalty to nation, law and king. Carlyle's Volume II opens with \"The Feast of Pikes,\" and the book's tone changes: the gigantic ceremony is treated as a moment of hope and also of deception, with chapters called \"Symbolic,\" \"Mankind,\" and \"Sound and Smoke\" [1]. Book II, \"Nanci,\" deals with the August 1790 army mutiny at Nancy, which was crushed by the Marquis de Bouillé. It demonstrates the tension between a revolutionary nation and a royal army whose officers were aristocrats.\n\n## 7. The flight to Varennes (June 1791)\n\nThe turning point in the monarchy's fortunes is the king's own act. Mirabeau, the one statesman who might have bridged crown and Assembly, died on 2 April 1791 [1][3]. On the night of 20-21 June 1791 Louis XVI and his family slipped out of the Tuileries in disguise and set out for the eastern frontier, where loyal troops under Bouillé waited. The royal party was recognised, according to the standard account, by Jean-Baptiste Drouet, the postmaster at Sainte-Menehould; some sources say he knew the king's face from an assignat, which is an inference, not an established fact [4]. The family was stopped at Varennes on the night of 21 June, and returned to Paris in a silent, hostile procession. Carlyle gives Varennes its own book, Volume II, Book IV, with chapters including \"The New Berline,\" \"Old-Dragoon Drouet,\" and \"The Night of Spurs\" [1].\n\nThe consequence mattered more than the incident. Louis had left behind a manifesto denouncing the Revolution, which meant that every earlier oath he had sworn looked hollow. The Assembly nonetheless chose to keep him on the throne, pretending he had been \"abducted,\" because the alternative (a republic) frightened the moderates. On 17 July 1791 a crowd gathered at the Champ de Mars to sign a republican petition; Mayor Bailly raised the red flag of martial law, and National Guards under Lafayette's command fired on the crowd, killing a number of people (Bailly reported twelve; radical papers claimed far more, and modern estimates vary), creating a lasting bitterness between the radicals and Lafayette's moderates. Carlyle tells it in the chapter \"Sharp Shot,\" calling Lafayette \"Sieur Motier\" and Bailly's red flag the \"Drapeau Rouge\" [1]. Timothy Tackett's study of the flight argues that this event, more than any previous one, destroyed trust in constitutional monarchy and fostered the culture of suspicion that fed the Terror [4]. That is an argument about contingency: a different king, or a better-run escape, and the story goes differently.\n\n## 8. The Constitution of 1791 and the Legislative Assembly (1791-92)\n\nThe Constitution of 1791, completed in September, made France a constitutional monarchy: a one-chamber Legislative Assembly, a king with a suspensive veto, and a restricted franchise based on tax payment (so-called active citizens). The king accepted it on 14 September. The Constituent Assembly, in a self-denying decree, barred its own members from the next one, and so the new Legislative Assembly, which met on 1 October 1791, was filled with inexperienced men [3]. Carlyle's title for Volume II, Book V, is \"Parliament First,\" and the chapters, including \"The Jacobins,\" \"Minister Roland,\" and \"Constitution will not march,\" show his scepticism: he regards the paper constitution as a thing that will not work in practice [1].\n\nTwo forces now pushed events. The first was the emigres, nobles who had left France and were organising counter-revolution from abroad, with the tacit encouragement of foreign courts. The second was the Jacobin Club in Paris and its provincial affiliates, which became the organising centre of the radical left. The Assembly was divided between the Feuillants (constitutional monarchists), and the Brissotins or future Girondins, who were eager for a war that they hoped would expose the court's treachery and spread the Revolution abroad.\n\n## 9. War and the fall of the monarchy (April-September 1792)\n\nFrance declared war on Austria on 20 April 1792, with Prussia joining soon after. The opening campaigns were disastrous, with French troops retreating, officers deserting, and the court widely suspected of passing information to the enemy (the suspicion was substantially correct, since Marie-Antoinette had in fact been in correspondence with her Austrian relatives). In July the Brunswick Manifesto, issued by the allied commander, threatened Paris with destruction if the royal family was harmed. Its effect was the opposite of the one intended: it made the king look like a collaborator [3].\n\nOn 10 August 1792 the Paris sections and provincial volunteers (the fédérés, including the Marseillais who had marched singing the song later called the Marseillaise) attacked the Tuileries. The Swiss Guard, ordered to defend the palace, were slaughtered in large numbers. The king took refuge with the Assembly, which suspended him. The insurrection was organised by the radical Paris Commune, which now stood alongside, and in practice above, the legislature. Carlyle devotes the close of Volume II to this: Book VI, \"The Marseillese,\" ends with \"The Swiss\" and \"Constitution burst in Pieces\" [1].\n\n## 10. The September Massacres, Valmy, and the Republic (September 1792)\n\nAs the Prussian army advanced on Paris and the fortress of Verdun fell, the city was gripped by fear that the prisons, full of aristocrats and priests, would be emptied by royalists when the volunteers left for the front. Between 2 and 6 September, crowds and improvised tribunals killed well over a thousand prisoners in Paris. Timothy Tackett puts the toll at roughly 1,100 to 1,400, and other counts run from about 1,100 up to the mid-1,600s; sources differ, and most of the dead were ordinary criminals rather than priests or aristocrats [3][11]. There were killings in some provincial towns as well. The authorities did little or nothing to stop it. Danton, the Minister of Justice, remains the focus of argument over his responsibility; Carlyle's chapters \"Danton,\" \"Dumouriez\" (which turns into the story of the Prussian advance and the fall of Verdun) and \"September in Paris\" set the issue up in the first book of Volume III [1].\n\nOn 20 September 1792, at Valmy, the French army held against the Prussians in an artillery duel. It was not a large battle but it saved the Revolution at a moment of acute danger. On the same day the new National Convention, elected by something close to manhood suffrage, met, and on 21 September it abolished the monarchy. France was a republic. The Convention was soon divided between the Girondins, who had led the war party, and the Montagnards (the \"Mountain,\" so called for their high seats), including Danton, Robespierre and Marat, supported by the Paris sections. Carlyle reflects this split in the title of Book III of Volume III, \"The Girondins\" [1].\n\n## 11. The trial and execution of the king (December 1792 - January 1793)\n\nThe discovery of a hidden iron chest in the Tuileries in November 1792 produced papers that showed the king's contacts with foreign powers and with Mirabeau. The Convention put him on trial in December. The votes of 15-20 January 1793 are often misreported in popular accounts, so the sequence matters: on 15 January roughly 690 deputies declared Louis guilty with none voting him innocent, the rest abstaining or absent (sources give 693 of 745 present, and Carlyle counts about twenty-eight abstentions); a motion to submit the verdict to the people for ratification was defeated by about 424 votes to somewhere between 283 and 287; and in the roll call on the penalty, which ran from 16 into 17 January, 387 deputies voted for death against 334 for other penalties, but 26 of the 387 attached a reservation about mercy or delay, so that the unconditional death votes numbered 361 against 360 and the margin was a single vote on the strictest count. A last motion for delay was refused by a majority of about seventy. Published tallies differ in detail depending on how the conditional votes are counted [5]. Carlyle gives his own version of the same arithmetic in \"The Three Votings\": a majority of fifty-three, \"but One\" if the twenty-six hedged votes are shifted across, and \"Seventy\" against delay [1]. A last attempt at reprieve failed, and Louis was guillotined on 21 January 1793 in the Place de la Révolution. Carlyle gives this a whole book, Volume III, Book II, \"Regicide,\" of eight chapters running from \"The Deliberative\" and \"The Executive\" through \"The Three Votings\" to \"Place de la Révolution\" [1]. Among the votes he singles out Sieyès's \"Death without phrases\" and Philippe Égalité's death vote. It was also the closest thing he has to a formal tragedy.\n\n## 12. War everywhere, the Vendée, and the Federalist revolt (spring-summer 1793)\n\nThe execution of the king brought Britain, Spain and the Dutch into the war. In February 1793 the Convention ordered a levy of 300,000 men. In March, in the west of France, the Vendée, this conscription ran into a population already aggrieved by the treatment of its priests and by the new regime's demands, and the result was a mass rebellion that turned into a civil war. The death toll is disputed and sources differ widely: Reynald Secher's count of about 117,000 is among the lower figures that still reach six digits, many historians speak of 200,000 or more across both sides, and older partisan claims of 500,000 are generally rejected. Whether the Republic's repression amounted to genocide remains bitterly contested among historians [6]. Carlyle sees the rising from Paris, naming the wool-dealer Cathelineau and \"fanatic Peoples of La Vendée\" in passing. The Convention's generals, Dumouriez among them, were also in trouble: after defeat in Belgium, Dumouriez tried to turn his army on Paris and then went over to the Austrians in early April 1793. Carlyle narrates his flight in Book III (\"The Girondins\"), in the chapter \"The Traitor\" [1].\n\nThe state answered with new machinery. The Revolutionary Tribunal was set up on 10 March 1793, the Committee of Public Safety on 6 April, and representatives on mission were sent to the provinces. The factional fight in the Convention came to a head: on 2 June 1793 armed Parisian sections surrounded the Convention and forced the arrest of twenty-nine Girondin deputies. In response, a number of departments rose in what is called the Federalist revolt (sources differ on how many were in open revolt as against merely protesting), with Lyon, Marseille, Bordeaux and Caen among the centres, and Toulon in August 1793 opened its port to the British [7]. Marat was stabbed to death in his bath on 13 July 1793 by Charlotte Corday, a young woman from Caen with Girondin sympathies. Carlyle's chapter \"Charlotte Corday\" opens Book IV, \"Terror,\" in Volume III, followed by \"In Civil War\" [1]. Notice that Carlyle puts Corday ahead of the military and provincial crisis; the order in the book is dramatic rather than strictly chronological.\n\n## 13. The Terror (September 1793 - July 1794)\n\nThe Terror was not a single decision. It was a set of measures taken in the face of invasion, civil war, inflation and food shortage, and enforced by a Committee of Public Safety on which Robespierre became the leading figure after he joined it in July 1793. On 5 September 1793 pressure from the Paris sections led the Convention to place \"terror\" on the order of the day, the phrase Carlyle borrows for Book V. The Law of the Maximum fixed prices; on 17 September the Law of Suspects authorised the arrest of anyone whose conduct, associations or language marked them as an enemy of liberty. Marie-Antoinette was guillotined on 16 October, and twenty-one Girondins on 31 October. The Republic also adopted a revolutionary calendar, dated from the abolition of the monarchy, and a campaign of \"de-Christianisation\" in the autumn, which Robespierre eventually opposed [7]. The Convention sent representatives to Lyon, Toulon and the west, where the repression was often far bloodier than in Paris.\n\nIn the spring of 1794 the Committee turned on its own flanks. The Hébertists, an ultra-radical faction, were executed on 24 March; Danton and his \"Indulgents,\" who called for a relaxation of the Terror, on 5 April. On 10 June the Law of 22 Prairial stripped the Revolutionary Tribunal of what remained of defence rights and sped the trials; the weeks that followed (the \"Great Terror\") saw Paris executions climb sharply. The military position, meanwhile, was improving, as the French won the battle of Fleurus on 26 June 1794. The reason for the Terror, as its advocates had argued, was now disappearing, and the machine continued [7].\n\nOn numbers, the standard source is Donald Greer's 1935 statistical study, which counted about 16,594 formal death sentences under the Terror, roughly 2,600 of them in Paris. Adding summary executions and deaths in prison, Greer's overall estimate is commonly given as 35,000 to 40,000, and later historians, Jean-Clément Martin among them, work in a similar range of a few tens of thousands; the exact figure depends on what is counted [7]. The geography matters: the great majority of executions took place outside Paris, in areas of rebellion.\n\nCarlyle spreads this across Volume III, Books IV, V and VI: \"Terror,\" \"Terror the Order of the Day,\" and \"Thermidor.\" Book V's chapters (\"Rushing down,\" \"Death,\" \"Destruction,\" \"Carmagnole complete,\" \"Like a Thunder-Cloud,\" \"Do thy Duty,\" \"Flame-Picture\") are largely panoramic and apocalyptic tableaux. He does stop to describe the machinery, but briefly and in his own idiom: the founding of the small Committee of Public Safety in Book III, the Revolutionary Tribunal as a \"Sword\" and the Law of the Maximum as a \"Provender-scrip,\" a paragraph on the Committee and its \"Cloud-Compellers\" (Robespierre, Billaud, Collot, Couthon, Saint-Just, with Carnot \"organising victory\"), the representatives on mission, and Couthon's Decree of the Twenty-second Prairial. The Law of Suspects he mentions only in passing. A reader who wants the committees' working in detail will need a modern history beside him [1].\n\n## 14. Thermidor (July 1794)\n\nBy mid-1794 many in the Convention feared they would be next. On 8 Thermidor (26 July) Robespierre gave a speech hinting at a new purge without naming names. On 9 Thermidor (27 July) he was shouted down when he tried to speak, arrested with his closest allies, briefly freed by the Commune, and recaptured. He was guillotined on 10 Thermidor (28 July) with about twenty others, and more followed [8]. The coup was not the work of moderates, but of former terrorists and fearful members of the Committees, who were protecting themselves. Its effect was to end the Terror's machinery: the Law of 22 Prairial was repealed, the Jacobin Club was closed, and the prisons began to empty. Carlyle's Book VI, \"Thermidor,\" runs from \"The Gods are athirst\" through \"Danton, No Weakness,\" \"The Tumbrils,\" \"Mumbo-Jumbo\" (his name for the Festival of the Supreme Being, which also carries the Prairial decree), \"The Prisons\" and \"To Finish the Terror,\" to \"Go Down to.\" The book's gravitational centre is Robespierre's fall [1].\n\n## 15. After the Terror: the Thermidorian Convention to Vendémiaire (1794-1795)\n\nThe period of the \"Thermidorian reaction\" brought an economic collapse and a harsh winter (1794-95), a \"white terror\" against Jacobins in the south, the closing of the Jacobin Club, the end of price controls, and runaway inflation of the assignats. Two popular insurrections in Paris, those of 12 Germinal (1 April 1795) and 1 Prairial (20 May 1795), were suppressed by force. Carlyle's Book VII, \"Vendémiaire,\" covers this with eight chapters, among them \"Decadent,\" \"La Cabarus\" (a salon hostess, Thérésa Cabarrus, who personifies the new luxury), and \"Quiberon\" (the failed British-backed royalist landing in Brittany in June-July 1795) [1].\n\nThe Convention drafted a new Constitution of the Year III (August 1795): property qualifications for voting, two chambers (the Council of Five Hundred and the Council of Ancients), and an executive Directory of five. To make sure that the new assemblies did not simply return royalists, the Convention decreed that two-thirds of the new members must come from its own ranks. Royalist Paris rose against this on 13 Vendémiaire, Year IV (5 October 1795). The Convention's defence passed to Paul Barras, who gave command of the artillery to a young general, Napoleon Bonaparte. He fired on the insurgents in the streets near the church of Saint-Roch. Casualty figures vary by account: reference works commonly give about three hundred insurgent dead and under a hundred on the Convention's side, while Carlyle's own text says \"some two hundred men\" were blown to air, mainly around Saint-Roch [1][9]. Bonaparte became a national figure. The Directory was installed a few weeks later, in late October to early November 1795, and the Convention dissolved. Carlyle's closing chapters, \"The Whiff of Grapeshot\" and \"Finis,\" are his version of this [1]. It is the most famous phrase in the book, and it is a callback: the words first appear in Volume I, Book V, in the chapter \"Broglie the War-God,\" where the court party boasts that Marshal Broglie, \"with a whiff of grapeshot,\" will give a quick account of the Third Estate, and Carlyle remarks in the last volume that the shot \"was promised\" six years earlier but \"could not be given then.\" He uses it to close the Revolution rather than begin the Empire [1].\n\n## Four hinges to keep in mind while reading\n\nIf the chronology above feels long, four dates carry most of its weight. The first is 17 June 1789, when the Third Estate renamed itself the National Assembly: after that, the question was no longer whether the king would reform, but who held sovereignty. The second is 14 July, which showed that the army could not be counted on against Paris, and so moved the real balance of force from Versailles to the capital. The third is the flight to Varennes in June 1791, after which neither revolutionaries nor royalists could treat the king's word as binding. The fourth is the declaration of war in April 1792, which turned every disagreement about the constitution into a question of loyalty in wartime, and which led by way of 10 August and the September Massacres to the Republic and to the trial of the king.\n\nCarlyle gives each of these hinges a full set piece, which is why a reader who knows only this skeleton can still follow him. What he does not supply is the reason the pieces connect, and that connecting reason is almost always money, bread or the fear of invasion. Keep those three pressures in view and the rapid changes of faction in Volumes II and III stop looking like a series of accidents.\n\n## Timeline\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 470\" role=\"img\" aria-label=\"A rising staircase of nine marked events from 1787 to 1795 with a calendar ribbon beneath it. Seven ascending steps are the Assembly of Notables in February 1787, the fall of the Bastille on 14 July 1789, the flight to Varennes in June 1791, the declaration of war on 20 April 1792, the execution of the king in January 1793, the Vendee rising and Revolutionary Tribunal in March 1793, and the Law of 22 Prairial on 10 June 1794. A dashed line then drops at Thermidor, 27 and 28 July 1794, and runs flat to Vendemiaire, 5 October 1795. Leader lines connect each step to its true date on a calendar ribbon divided into Volume I to July 1790, Volume II to September 1792 and Volume III to October 1795. Volume I spans about sixteen years and 50 chapters; Volumes II and III about five years and 109 chapters.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THE RATCHET<\/text>\n<text x=\"350\" y=\"48\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">each crisis made the next faction more radical and the last one a traitor<\/text>\n<path d=\"M24,268 L24,268 L92,268 L92,244 L92,244 L160,244 L160,220 L160,220 L228,220 L228,196 L228,196 L296,196 L296,172 L296,172 L364,172 L364,148 L364,148 L432,148 L432,124 L432,124 L500,124 \" fill=\"none\" class=\"s-t2\" stroke-width=\"3\" stroke-linejoin=\"round\"/>\n<path d=\"M500,124 L500,268 L636,268\" fill=\"none\" class=\"s-t5\" str \" height=\"22\" fill=\"none\" class=\"s-t1\" stroke-width=\"1.4\"/>\n<text x=\"274.383\" y=\"361\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-mono\" font-weight=\"bold\">I<\/text>\n<rect x=\"508.8\" y=\"346\" width=\"61.7\" height=\"22\" class=\"f-t2\" opacity=\".4\"/><rect x=\"508.8\" y=\"346\" width=\"61.7\" height=\"22\" fill=\"none\" class=\"s-t2\" stroke-width=\"1.4\"/>\n<text x=\"539.621\" y=\"361\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-mono\" font-weight=\"bold\">II<\/text>\n<rect x=\"570.5\" y=\"346\" width=\"89.5\" height=\"22\" class=\"f-t3\" opacity=\".4\"/><rect x=\"570.5\" y=\"346\" width=\"89.5\" height=\"22\" fill=\"none\" class=\"s-t3\" stroke-width=\"1.4\"/>\n<text x=\"615.238\" y=\"361\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-mono\" font-weight=\"bold\">III<\/text>\n<line x1=\"58.5\" y1=\"368\" x2=\"58.5\" y2=\"374\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"58.5421\" y=\"385\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\">1775<\/text>\n<line x1=\"203.4\" y1=\"368\" x2=\"203.4\" y2=\"374\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"203.402\" y=\"385\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\">1780<\/text>\n<line x1=\"348.3\" y1=\"368\" x2=\"348.3\" y2=\"374\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"348.262\" y=\"385\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\">1785<\/text>\n<line x1=\"493.1\" y1=\"368\" x2=\"493.1\" y2=\"374\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"493.121\" y=\"385\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\">1790<\/text>\n<line x1=\"638.0\" y1=\"368\" x2=\"638.0\" y2=\"374\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"637.981\" y=\"385\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-mono\">1795<\/text>\n<text x=\"40\" y=\"334\" text-anchor=\"start\" font-size=\"8.6\" class=\"t-muted\" letter-spacing=\"1.5\">THE SAME DATES ON A TRUE CALENDAR, 1774&#8211;1795, SPLIT BY VOLUME<\/text>\n<text x=\"40\" y=\"404\" text-anchor=\"start\" font-size=\"9\">Vol I: 1774&#8211;Jul 1790 &#183; about 16 years &#183; 50 chapters<\/text>\n<text x=\"660\" y=\"404\" text-anchor=\"end\" font-size=\"9\">Vols II + III: about 5 years &#183; 109 chapters<\/text>\n<line x1=\"508.8\" y1=\"389\" x2=\"508.8\" y2=\"396\" class=\"ln-soft\"/>\n<text x=\"350\" y=\"460\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">About two-thirds of the chapters cover the last five years: the book speeds up as the ratchet does<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The Revolution is a ratchet &#8212; money, the army, the king&#8217;s trust, war, regicide, civil war, then the Great Terror, each step locking in the last &#8212; and Thermidor is the one drop, after which Vend&#233;miaire (1795) installs a regime built to stop it; on a true calendar the steps crowd into the last five years, which is why 109 of Carlyle&#8217;s 159 chapters live there.<\/figcaption>\n<\/figure>\n\n\n| Date | Event | Carlyle (volume, book) |\n|---|---|---|\n| 10 May 1774 | Death of Louis XV; Louis XVI succeeds | I.1 |\n| 1778-83 | France enters the American war; debt climbs | I.2-3 (background) |\n| Feb 1787 | Assembly of Notables under Calonne | I.3 |\n| Aug 1788 | Estates-General summoned; Necker recalled | I.3-4 |\n| 5 May 1789 | Estates-General opens at Versailles | I.4 |\n| 17 June 1789 | Third Estate declares itself the National Assembly | I.5 |\n| 20 June 1789 | Tennis Court Oath | I.5 |\n| 14 July 1789 | Fall of the Bastille | I.5 |\n| 4 Aug / 26 Aug 1789 | Feudalism abolished; Declaration of Rights | I.6 |\n| 5-6 Oct 1789 | Women's march to Versailles; royal family to Paris | I.7 |\n| 14 July 1790 | Festival of Federation (Feast of Pikes) | II.1 |\n| Aug 1790 | Mutiny at Nancy | II.2 |\n| 2 Apr 1791 | Death of Mirabeau | II.3 |\n| 20-21 June 1791 | Flight to Varennes | II.4 |\n| 17 July 1791 | Champ de Mars shooting | II.4 (\"Sharp Shot\") |\n| Sept 1791 | Constitution of 1791 accepted | II.5 |\n| 20 Apr 1792 | War declared on Austria | II.5-6 |\n| 10 Aug 1792 | Storming of the Tuileries; king suspended | II.6 |\n| 2-6 Sept 1792 | September Massacres | III.1 |\n| 20-21 Sept 1792 | Valmy; Convention meets; monarchy abolished | III.1 |\n| 15-21 Jan 1793 | Trial, votes, execution of Louis XVI | III.2 |\n| Mar 1793 | Vendée rising; Revolutionary Tribunal created | III.3 (Tribunal); Vendée mentioned in III.1, III.3 and III.4 |\n| 6 Apr 1793 | Committee of Public Safety | III.3 |\n| 2 June 1793 | Girondin leaders arrested | III.3 |\n| 13 July 1793 | Marat killed by Charlotte Corday | III.4 |\n| 17 Sept 1793 | Law of Suspects | mentioned only in passing |\n| 16 / 31 Oct 1793 | Marie-Antoinette and the Girondins executed | III.4 |\n| 24 Mar / 5 Apr 1794 | Hébertists and Dantonists executed | III.6 |\n| 10 June 1794 | Law of 22 Prairial; Great Terror | III.6 |\n| 27-28 July 1794 | 9-10 Thermidor: Robespierre falls and is executed | III.6 |\n| Apr-May 1795 | Germinal and Prairial insurrections crushed | III.7 |\n| Aug 1795 | Constitution of the Year III | III.7 |\n| 5 Oct 1795 | 13 Vendémiaire: Bonaparte's \"whiff of grapeshot\" | III.7 |\n| Late Oct-Nov 1795 | Directory installed; Convention dissolves | III.7 |\n\nThe right-hand column is based on the book's table of chapters [1] and is exact where a chapter title names the event (Varennes, the Swiss, Regicide, Thermidor, Vendémiaire) and approximate where an event is folded into a larger chapter. Treat the \"approximate\" entries as a guide to where to look, not a citation to a page.\n\n## Five places where Carlyle departs from the modern account\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 514\" role=\"img\" aria-label=\"A bar chart of chapters per book for all twenty books in Carlyle's French Revolution. Values: 1.1 four, 1.2 eight, 1.3 nine, 1.4 four, 1.5 nine, 1.6 five, 1.7 eleven, 2.1 twelve, 2.2 six, 2.3 seven, 2.4 nine, 2.5 twelve, 2.6 eight, 3.1 eight, 3.2 eight, 3.3 nine, 3.4 eight, 3.5 seven, 3.6 seven, 3.7 eight. The mean is 7.95. Books 1.7, 2.4 and 3.2, the October Days, Varennes and the Regicide, are highlighted and total 28 chapters; the two Terror books, 3.4 and 3.5, are highlighted separately and total 15.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">WHERE THE PAGES GO<\/text>\n<text x=\"350\" y=\"48\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">chapters per book: Carlyle&#8217;s proportion is his argument<\/text>\n<text x=\"40\" y=\"89\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.1<\/text>\n<text x=\"66\" y=\"89\" text-anchor=\"start\" font-size=\"9.5\">Death of Louis XV<\/text>\n<rect x=\"228\" y=\"79\" width=\"120\" height=\"13\" class=\"f-t1\" opacity=\".38\"/>\n<text x=\"354\" y=\"89\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">4<\/text>\n<text x=\"40\" y=\"107\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.2<\/text>\n<text x=\"66\" y=\"107\" text-anchor=\"start\" font-size=\"9.5\">The Paper Age<\/text>\n<rect x=\"228\" y=\"97\" width=\"240\" height=\"13\" class=\"f-t1\" opacity=\".38\"/>\n<text x=\"474\" y=\"107\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">8<\/text>\n<text x=\"40\" y=\"125\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.3<\/text>\n<text x=\"66\" y=\"125\" text-anchor=\"start\" font-size=\"9.5\">The Parlement of Paris<\/text>\n<rect x=\"228\" y=\"115\" width=\"270\" height=\"13\" class=\"f-t1\" opacity=\".38\"/>\n<text x=\"504\" y=\"125\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">9<\/text>\n<text x=\"40\" y=\"143\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.4<\/text>\n<text x=\"66\" y=\"143\" text-anchor=\"start\" font-size=\"9.5\">States-General<\/text>\n<rect x=\"228\" y=\"133\" width=\"120\" height=\"13\" class=\"f-t1\" opacity=\".38\"/>\n<text x=\"354\" y=\"143\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">4<\/text>\n<text x=\"40\" y=\"161\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.5<\/text>\n<text x=\"66\" y=\"161\" text-anchor=\"start\" font-size=\"9.5\">The Third Estate<\/text>\n<rect x=\"228\" y=\"151\" width=\"270\" height=\"13\" class=\"f-t1\" opacity=\".38\"/>\n<text x=\"504\" y=\"161\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">9<\/text>\n<text x=\"40\" y=\"179\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.6<\/text>\n<text x=\"66\" y=\"179\" text-anchor=\"start\" font-size=\"9.5\">Consolidation<\/text>\n<rect x=\"228\" y=\"169\" width=\"150\" height=\"13\" class=\"f-t1\" opacity=\".38\"/>\n<text x=\"384\" y=\"179\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">5<\/text>\n<text x=\"40\" y=\"197\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t1)\" font-weight=\"bold\">1.7<\/text>\n<text x=\"66\" y=\"197\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\">The Insurrection of Women<\/text>\n<rect x=\"228\" y=\"187\" width=\"330\" height=\"13\" class=\"f-t2\" opacity=\".95\"/>\n<text x=\"564\" y=\"197\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\">11<\/text>\n<text x=\"40\" y=\"215\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t2)\" font-weight=\"bold\">2.1<\/text>\n<text x=\"66\" y=\"215\" text-anchor=\"start\" font-size=\"9.5\">The Feast of Pikes<\/text>\n<rect x=\"228\" y=\"205\" width=\"360\" height=\"13\" class=\"f-t2\" opacity=\".38\"/>\n<text x=\"594\" y=\"215\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">12<\/text>\n<text x=\"40\" y=\"233\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t2)\" font-weight=\"bold\">2.2<\/text>\n<text x=\"66\" y=\"233\" text-anchor=\"start\" font-size=\"9.5\">Nanci<\/text>\n<rect x=\"228\" y=\"223\" width=\"180\" height=\"13\" class=\"f-t2\" opacity=\".38\"/>\n<text x=\"414\" y=\"233\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">6<\/text>\n<text x=\"40\" y=\"251\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t2)\" font-weight=\"bold\">2.3<\/text>\n<text x=\"66\" y=\"251\" text-anchor=\"start\" font-size=\"9.5\">The Tuileries<\/text>\n<rect x=\"228\" y=\"241\" width=\"210\" height=\"13\" class=\"f-t2\" opacity=\".38\"/>\n<text x=\"444\" y=\"251\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">7<\/text>\n<text x=\"40\" y=\"269\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t2)\" font-weight=\"bold\">2.4<\/text>\n<text x=\"66\" y=\"269\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\">Varennes<\/text>\n<rect x=\"228\" y=\"259\" width=\"270\" height=\"13\" class=\"f-t2\" opacity=\".95\"/>\n<text x=\"504\" y=\"269\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\">9<\/text>\n<text x=\"40\" y=\"287\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t2)\" font-weight=\"bold\">2.5<\/text>\n<text x=\"66\" y=\"287\" text-anchor=\"start\" font-size=\"9.5\">Parliament First<\/text>\n<rect x=\"228\" y=\"277\" width=\"360\" height=\"13\" class=\"f-t2\" opacity=\".38\"/>\n<text x=\"594\" y=\"287\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">12<\/text>\n<text x=\"40\" y=\"305\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t2)\" font-weight=\"bold\">2.6<\/text>\n<text x=\"66\" y=\"305\" text-anchor=\"start\" font-size=\"9.5\">The Marseillese<\/text>\n<rect x=\"228\" y=\"295\" width=\"240\" height=\"13\" class=\"f-t2\" opacity=\".38\"/>\n<text x=\"474\" y=\"305\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">8<\/text>\n<text x=\"40\" y=\"323\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.1<\/text>\n<text x=\"66\" y=\"323\" text-anchor=\"start\" font-size=\"9.5\">September<\/text>\n<rect x=\"228\" y=\"313\" width=\"240\" height=\"13\" class=\"f-t3\" opacity=\".38\"/>\n<text x=\"474\" y=\"323\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">8<\/text>\n<text x=\"40\" y=\"341\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.2<\/text>\n<text x=\"66\" y=\"341\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\">Regicide<\/text>\n<rect x=\"228\" y=\"331\" width=\"240\" height=\"13\" class=\"f-t2\" opacity=\".95\"/>\n<text x=\"474\" y=\"341\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\">8<\/text>\n<text x=\"40\" y=\"359\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.3<\/text>\n<text x=\"66\" y=\"359\" text-anchor=\"start\" font-size=\"9.5\">The Girondins<\/text>\n<rect x=\"228\" y=\"349\" width=\"270\" height=\"13\" class=\"f-t3\" opacity=\".38\"/>\n<text x=\"504\" y=\"359\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">9<\/text>\n<text x=\"40\" y=\"377\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.4<\/text>\n<text x=\"66\" y=\"377\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\">Terror<\/text>\n<rect x=\"228\" y=\"367\" width=\"240\" height=\"13\" class=\"f-t4\" opacity=\".95\"/>\n<text x=\"474\" y=\"377\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\">8<\/text>\n<text x=\"40\" y=\"395\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.5<\/text>\n<text x=\"66\" y=\"395\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\">Terror the Order of the Day<\/text>\n<rect x=\"228\" y=\"385\" width=\"210\" height=\"13\" class=\"f-t4\" opacity=\".95\"/>\n<text x=\"444\" y=\"395\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\" font-weight=\"bold\">7<\/text>\n<text x=\"40\" y=\"413\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.6<\/text>\n<text x=\"66\" y=\"413\" text-anchor=\"start\" font-size=\"9.5\">Thermidor<\/text>\n<rect x=\"228\" y=\"403\" width=\"210\" height=\"13\" class=\"f-t3\" opacity=\".38\"/>\n<text x=\"444\" y=\"413\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">7<\/text>\n<text x=\"40\" y=\"431\" text-anchor=\"start\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t3)\" font-weight=\"bold\">3.7<\/text>\n<text x=\"66\" y=\"431\" text-anchor=\"start\" font-size=\"9.5\">Vend&#233;miaire<\/text>\n<rect x=\"228\" y=\"421\" width=\"240\" height=\"13\" class=\"f-t3\" opacity=\".38\"/>\n<text x=\"474\" y=\"431\" text-anchor=\"start\" font-size=\"9.5\" class=\"t-mono\">8<\/text>\n<line x1=\"466.5\" y1=\"70\" x2=\"466.5\" y2=\"438\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n<text x=\"466.5\" y=\"66\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\">mean 7.95<\/text>\n<rect x=\"40\" y=\"452\" width=\"14\" height=\"10\" class=\"f-t2\" opacity=\".95\"/>\n<text x=\"60\" y=\"461\" text-anchor=\"start\" font-size=\"9\">the three set pieces the primer calls out: women&#8217;s march 11 + Varennes 9 + trial 8 = 28 chapters<\/text>\n<rect x=\"40\" y=\"470\" width=\"14\" height=\"10\" class=\"f-t4\" opacity=\".95\"/>\n<text x=\"60\" y=\"479\" text-anchor=\"start\" font-size=\"9\">the two Terror books: Terror 8 + Terror the Order of the Day 7 = 15 chapters (9% of the book)<\/text>\n<text x=\"350\" y=\"502\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">chapter counts, not page counts: the primer reads placement as a guide to drama, not to historical weight<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> Carlyle spends 28 chapters on three set pieces &#8212; the women&#8217;s march, the flight to Varennes and the trial of the king &#8212; and 15 on the Terror, the period modern accounts explain through committees, laws and the war economy; his proportions follow scene, not mechanism, which is the fifth of the primer&#8217;s five places where he departs from the modern account.<\/figcaption>\n<\/figure>\n\n\n**1. The crowd is the protagonist, and it is a crowd of faces rather than a class.** Carlyle's Revolution is a revolution from below, in which the insurrectionary crowd is the object of fascination and the motive force, and he insists, as a biographer would, on individuals within the mass [10]. Modern social historians would add what he leaves in the shadows: the structural position of artisans and shopkeepers (the sans-culottes), the price of bread and the organisation of the sections. His crowd is spontaneous and elemental; much recent work shows it was organised, informed, and often led.\n\n**2. Money and administration are told as moral allegory.** The fiscal crisis, which most modern accounts treat as the trigger, is in Carlyle a story about paper: false credit, false ideals, false constitutions. His books on Calonne and Loménie contain the facts, but the explanatory weight is moral and rhetorical. A reader who wants the mechanics of privilege, tax exemption and venal offices should supplement him with Doyle [3].\n\n**3. The countryside, the provinces and the Vendée recede.** The Great Fear, the peasant destruction of the feudal order, and the western civil war are marginal to the architecture of the book. The Parisian stage takes the centre, and the provinces appear in passing (\"Brigands and Jalès,\" \"In Civil War\"). Modern historiography, as in Furet and Ozouf's work on the geography of counter-revolution, treats the provinces as central to understanding why the Terror happened [6]. Slavery is largely absent. Carlyle names Brissot as \"friend of the Blacks\" and, in Volume II, Book V, Chapter IV (\"No Sugar\"), narrates the 1791 Saint-Domingue rising as a cause of the Paris sugar shortage, in language that reflects the racial attitudes of the 1830s; but a search of the full text finds no mention of the Convention's decree of February 1794 abolishing slavery in the colonies, and the Haitian Revolution appears only as \"African Haiti,\" a \"monition to the world.\" A modern reader will want a separate account of that story.\n\n**4. Individuals, not ideology, make events; Robespierre is hollow.** The modern debate between Furet-style political-cultural readings (ideology and the logic of revolutionary discourse) and social readings has no place in Carlyle's framework, which turns on character: Mirabeau and Danton are strong and imperfect forces, Robespierre a man of formulas. The modern scholarly view is more mixed and more concerned with the Terror's institutional dynamics [7][10]. Carlyle's Robespierre is a literary creation, memorable for exactly that reason.\n\n**5. The flight to Varennes, the October Days, and the Regicide get their own books; the machinery of government does not.** The proportions of the book are the argument: eleven chapters for the women's march, nine for Varennes and eight for the trial, against a Terror that dissolves into tableaux. Tackett's thesis that Varennes was the great loss of trust is therefore close to Carlyle's own structural emphasis, even though Carlyle gets there by instinct for scene rather than by archival argument [4]. The departure is that modern accounts spend more time on the committees, the laws and the war economy, which are the explanation of the Terror, where Carlyle, though he does describe them briefly, gives chiefly the experience of it.\n\n## Open Questions\n\n- The exact breakdown of the votes on the king: published tallies differ by how conditional votes are counted, and the printed roll call in the Archives parlementaires is the place to settle the matter [5].\n- Whether the Vendée repression is best described as genocide; the scholarly literature is divided and the death estimates span a factor of four [6].\n- Where, exactly, the line falls between the Terror's military emergency and its ideological logic; the casualty ranges above leave that argument open.\n- The size of the crowd and the dead at the Champ de Mars on 17 July 1791, for which contemporary figures diverge sharply.\n- Whether the Drouet-recognised-the-king-from-an-assignat story is documented or later embroidery [4].\n\n## Sources\n\n1. Carlyle, Thomas. *The French Revolution: A History* (1837). Project Gutenberg ebook 1301, table of contents (volumes, books, chapters). Tier 1 (the text itself). https://www.gutenberg.org/cache/epub/1301/pg1301-images.html (accessed 2026-10-24)\n2. The companion study of the book's composition, method and reception (a separate study of Carlyle's French Revolution in the same library). Tier 5; cross-reference only.\n3. Doyle, William. *The Oxford History of the French Revolution* (Oxford University Press) and *Origins of the French Revolution*. Tier 2 (university-press monographs). Cited for the standard narrative of the fiscal and political crisis, the Estates-General, the Constituent Assembly and the Legislative Assembly. See also Popkin, Jeremy, *A Short History of the French Revolution* (Pearson), for the same sequence.\n4. Tackett, Timothy. *When the King Took Flight* (Harvard University Press, 2003). Tier 2. On the Drouet and assignat detail, see also the summary at https://en.wikipedia.org/wiki/Flight_to_Varennes; the assignat recognition is hedged even there, so treat it as a story, not an established fact.\n5. \"The Execution of Louis XVI,\" Origins (Ohio State University / Miami University), January 2018. Tier 2-4 (university-published public history). https://origins.osu.edu/milestones/january-2018-execution-louis-xvi (accessed 2026-10-24). Vote counts also compared with https://en.wikipedia.org/wiki/Votes_on_the_death_of_Louis_XVI and with Carlyle's own tally in \"The Three Votings\" [1]; tallies are disputed.\n6. War in the Vendée, summary of estimates and cited scholarship (Tilly; Furet and Ozouf; Jones; Martin; Levene), via https://en.wikipedia.org/wiki/War_in_the_Vend%C3%A9e (accessed 2026-10-24); estimates of Secher (about 117,000) and of Martin discussed in the H-France review at https://www.h-france.net/vol4reviews/mcphee3.html. Tier 5 as an aggregator; the underlying scholarship is Tier 2.\n7. Terror chronology and casualty figures: Greer, Donald. *The Incidence of the Terror during the French Revolution: A Statistical Interpretation* (Harvard University Press, 1935); Martin, Jean-Clément. *La Terreur: vérités et légendes* (Perrin, 2017); Schama, Simon. *Citizens* (1989), all as cited in https://en.wikipedia.org/wiki/Reign_of_Terror (accessed 2026-10-24). Tier 2 for the monographs; Greer's 16,594 formal sentences and the 35,000-40,000 overall estimate are the standard citation.\n8. 9 Thermidor and its aftermath: reference pages (World History Encyclopedia, McKay textbook chapter on the Thermidorian Reaction and the Directory). Tier 5. https://www.worldhistory.org/Thermidorian_Reaction/\n9. 13 Vendémiaire: https://en.wikipedia.org/wiki/13_Vend%C3%A9miaire (accessed 2026-10-24; navigation only; casualty figures vary by account). Tier 5.\n10. Scholarly summaries of Carlyle's treatment of the crowd and of individuals, a Reims HAL repository article and a Cambridge Core reader. Tier 2 (peer-reviewed). https://hal.univ-reims.fr/hal-02501251v1/document\n\n11. Tackett, Timothy. \"Rumor and Revolution: The Case of the September Massacres,\" *French History and Civilization* (2011), and *The Coming of the Terror in the French Revolution* (Harvard University Press, 2015); the 1,100-1,400 Paris range and the large share of common criminals among the dead. Also https://en.wikipedia.org/wiki/September_Massacres for the wider range of counts. Tier 2 (scholarly) and Tier 5.\n\nA note on dates: the standard, uncontested dates not individually footnoted (for example 10 May 1774, 5 May 1789, 17 June 1789, 20 June 1789, 14 July 1789, 20 April 1792, 10 August 1792, 21 September 1792) come from the established public record and can be checked against Doyle or Popkin. Casualty figures and vote tallies are the contested numbers and are flagged where they appear."}, {"order": 2, "file": "02_Volume_I_The_Bastille.md", "title": "Volume I — The Bastille: A Book-by-Book Reader's Guide", "summary": "A chapter-by-chapter guide to Volume I of Carlyle's The French Revolution (1837): seven Books and fifty chapters, from Louis XV's deathbed in May 1774 to the royal family's carriage-ride into Paris on 6 October 1789, with the set-pieces, the places to slow down or skim, and what to carry into Volume II.", "body": "# Volume I — The Bastille: A Book-by-Book Reader's Guide\n\n## Bottom Line\n\nVolume I runs from a dying king in May 1774 to a captive king carried to Paris in October 1789, and it is built like a slow fuse: three Books of rot, one of election, then three of detonation and aftermath. The hard part is the front half, where Carlyle spends roughly two-fifths of the volume on pre-1789 decay in a prophetic, allusion-thick voice, and the reward is Books V and VII, where the fall of the Bastille and the women's march to Versailles are written as if the reader were standing in the crowd. If you only have the energy for part of the volume, read Book I.II, the whole of Book V and the whole of Book VII, and use this guide to bridge the rest.\n\n## The Map\n\nThe structure below is taken from the contents page and body of the Project Gutenberg text [1]. Titles are Carlyle's own. In that edition each chapter carries a Book number and a chapter number (1.5.VI means Volume I, Book V, chapter VI); the book itself prints them simply as Book V, Chapter VI. The contents page prints a stray footnote digit after the title of the last chapter of Book I (\"Louis the Unforgotten2\"); the digit is an artefact and the title is simply \"Louis the Unforgotten\" [1]. The \"weight\" column is a rough guide to how much of the volume each Book occupies, judged by line count in the Gutenberg file, and is a proxy for length, not a count of words.\n\n| Book | Title | Period covered | Chapters | Weight |\n| --- | --- | --- | --- | --- |\n| I | Death of Louis XV. | May 1774 | 4: Louis the Well-Beloved; Realised Ideals; Viaticum; Louis the Unforgotten | light (about 860 lines) |\n| II | The Paper Age | c. 1774–1786, with glances to 1788 | 8: Astræa Redux; Petition in Hieroglyphs; Questionable; Maurepas; Astræa Redux without Cash; Windbags; Contrat Social; Printed Paper | medium (about 1,170) |\n| III | The Parlement of Paris | 1781–Sept 1788 | 9: Dishonoured Bills; Controller Calonne; The Notables; Loménie's Edicts; Loménie's Thunderbolts; Loménie's Plots; Internecine; Loménie's Death-throes; Burial with Bonfire | heavy (about 1,860) |\n| IV | States-General | late 1788–4 May 1789 | 4: The Notables Again; The Election; Grown Electric; The Procession | medium, back-loaded (about 1,230) |\n| V | The Third Estate | May–July 1789 | 9: Inertia; Mercury de Brézé; Broglie the War-God; To Arms!; Give us Arms; Storm and Victory; Not a Revolt; Conquering your King; The Lanterne | heaviest (about 2,080) |\n| VI | Consolidation | July–Sept 1789 | 5: Make the Constitution; The Constituent Assembly; The General Overturn; In Queue; The Fourth Estate | medium-light (about 950) |\n| VII | The Insurrection of Women | Sept–6 Oct 1789 | 11: Patrollotism; O Richard, O my King; Black Cockades; The Menads; Usher Maillard; To Versailles; At Versailles; The Equal Diet; Lafayette; The Grand Entries; From Versailles | heavy (about 1,800) |\n\nThat is 4 + 8 + 9 + 4 + 9 + 5 + 11 = fifty chapters in all, as the printed contents count them [1]. The whole work has twenty Books (seven, six and seven) and 159 chapters (fifty, fifty-four and fifty-five).\n\nOne structural fact is worth carrying in your head. Of the volume's roughly ten thousand lines, the storming of the Bastille, the event that names the volume, is one chapter (V.VI), with the build-up in V.V and the grim aftermath in V.VII. Carlyle is a historian of conditions and crowds, not a chronicler of single days. The title is the volume's destination, not its subject.\n\nA second fact: the volume opens with a German epigraph from Goethe, an anvil-and-hammer image about a people beaten by arbitrary blows on a sheet of metal that is never finished into a kettle [1]. It is a fair advance warning of the book's temperament. Carlyle does not argue that the Revolution was right or wrong; he argues that it was a consequence, and that consequences are what arbitrary power and a hollow belief eventually buy.\n\n## How to Read the Volume as a Whole\n\nCarlyle narrates in the present tense, addresses the reader and his characters directly (\"Look to it, D'Aiguillon\"), and shifts without warning between the ironic, the biblical and the slapstick. The practical effect is that the pace is set by his interest, not by the calendar. Louis XV's deathbed gets four chapters; the entire election of the Estates-General gets one. The summer of 1789 is compressed into Book V, and a single October day swells to eleven chapters in Book VII.\n\nTreat Volume I as having three speeds. Books I–III are slow and reflective, with the author more interested in what a society believes about itself than in what happens next. Book IV is a pause for breath, a tableau, ending in the great portrait gallery of \"The Procession.\" Books V–VII are fast, dramatic and, for Carlyle, unusually concrete, though never entirely free of his habit of stepping out of the scene to lecture the cast.\n\nTwo running devices will help you from the first page. The first is his vocabulary of \"Sham\" and \"Reality\": an institution is judged by whether the belief behind it is still alive, and a society organised round a Sham is always being presented with a bill. The second is the image of the \"Œil-de-Bœuf,\" the antechamber at Versailles that he uses as shorthand for the court's whispering, self-interested world. (The longer treatment of his style, allusions and themes belongs to the guide on reading Carlylese; this one stays with the narrative.)\n\n## Book I — Death of Louis XV. (four chapters)\n\n**What it covers.** One sickbed, in May 1774. Carlyle opens with President Hénault's flattering explanation of why Louis XV was called the Well-Beloved, then sets the reality beside it: thirty years after the fever at Metz that earned the name, the king lies ill at Versailles and the flock, in Carlyle's phrase, \"heeds it not\" [1, I.I]. The cast around the bed is the factional court: the royal mistress Madame du Barry, the Duke d'Aiguillon, Maupeou and his Parlement, against the Dauphin's party and the dismissed Choiseul. The practical question of the Book is whether the king will be given the last sacraments, because administering them means dismissing the mistress and therefore the government built on her [1, I.III]. The disease is \"confluent small-pox,\" and the king dies on 10 May 1774 [1, I.III–IV]; the date agrees with standard reference histories.\n\n**What Carlyle does with it.** This is the volume's thesis in miniature. In \"Realised Ideals\" he argues that kingship was once a living belief, in which men could \"make themselves a King, almost as the Bees do,\" by nourishing and decorating a man into the role and then loyally obeying him; and that the belief has died while the office remains [1, I.II]. He sets beside it the Church, the other great \"realised ideal,\" and finds both decaying, with the philosophes and pamphleteers now exercising the real spiritual guidance of France. The chapter closes on Lord Chesterfield's famous remark, written some twenty years earlier, that all the symptoms that precede great revolutions in government now exist in France. The chapter is an essay, not a scene. \"Viaticum\" and \"Louis the
