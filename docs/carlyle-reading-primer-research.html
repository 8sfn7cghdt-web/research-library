Unforgotten\" return to narrative, with the king's terror of death rendered in the moral register of a sermon, a comic anteroom politics of nods and silk dowagers, and, at the end, the new king and queen falling on their knees with \"O God, guide us, protect us; we are too young to reign!\" [1, I.IV].\n\n**What he lingers on and skips.** He lingers on the king's fear and the courtiers' manoeuvring, and on the loyal daughters (\"Rag, Snip, Pig\") who alone sit at the bed. He skips the real policy history of the reign: the wars, the colonial losses, the finance. A reader who wants those has to bring them.\n\n**Set-pieces.** \"Realised Ideals\" (the \"what is a king\" essay) and \"Louis the Unforgotten\" (the deathbed, the thunderstorm over the chapel, the unceremonious funeral).\n\n**Going in.** Know that Louis XV's grandson becomes Louis XVI, and that Carlyle's reading of the 1789 crisis is that the dying king's state is France's state.\n\n**Where it gets hard.** The first chapter is a mountain of names with no introductions. Do not stop to look anyone up. The names that matter recur; the rest are texture. If the allusive density wears you down, read \"Realised Ideals\" and then jump to \"Viaticum,\" which is a comedy of anteroom politics.\n\n## Book II — The Paper Age (eight chapters)\n\n**What it covers.** The first dozen years of Louis XVI's reign, treated not as a chronology but as a portrait of an age, with its title naming the new power: print, pamphlet, and paper money to come. The Book opens with a paradox (\"Happy the people whose annals are vacant\") and moves quickly to the young, well-meaning king, who makes locks, and the young queen, \"walking like a goddess of Beauty\" [1, II.I]. The Age of Hope is told through its ministers (Turgot, then Necker, who comes and goes), its salons and its American war.\n\n**What Carlyle does with it.** The chapters are not all of one kind. Read them as a sequence of small essays on a single image.\n\n\"Astræa Redux\" sets out the Age of Hope: Turgot in office, Voltaire at Ferney, the philosophes dining with financiers, \"victorious Analysis\" promising to abolish want and, perhaps, death [1, II.I]. \"Petition in Hieroglyphs\" is the counter-picture. Twenty to twenty-five million working people, whom the educated lump together as the canaille, are in Carlyle's insistence each a unit with a heart and a skin that bleeds; and on 2 May 1775 the hungry crowds that come to Versailles in the grain-price troubles of Turgot's first year are answered by a \"new gallows forty feet high\" [1, II.II]. That gallows returns again and again in the next chapters as a refrain. \"Questionable\" asks whether the Age of Hope is a simulacrum, and gives Carlyle's central account of society as an \"Earth-rind\" of unwritten habit laid over chaos, which a Constitution on paper only summarises; it is the chapter to read if you want to know why he distrusts constitution-making [1, II.III]. \"Maurepas\" shows the old minister as a \"Nestor\" and weathercock, asks where the government of France actually is (\"Despotism tempered by Epigrams\"), and follows Turgot's fall, Voltaire's last triumph in Paris, and Beaumarchais [1, II.IV].\n\n\"Astræa Redux without Cash\" is the American war and its price: Franklin and Deane soliciting in the salons, Lafayette's laurels, the French navy's defeats, the vanished explorer Lapérouse, and the unlucky Gibraltar; then the finance ministers (Clugny, Necker) and Necker's book [1, II.V]. \"Windbags\" is the frivolous centre of the Book: Longchamp in Lent, Anglomania and jockeys, the Duke de Chartres (the future Philippe Égalité) in his decay, the Palais-Royal garden, the Montgolfier balloon, and Mesmer's magnetic tubs [1, II.VI]. \"Contrat Social\" is an essay against Rousseau's gospel, against sentiment, theory and \"Cant,\" which Carlyle calls the double-distilled lie [1, II.VII]. \"Printed Paper\" is best read as a tour of the symptom-literature of the age rather than a history of the press: street ballads, manuscript newspapers, Linguet and Raynal, the young Mirabeau's lawsuits and his father's sixty lettres de cachet, the Diamond Necklace affair, and the two novels and a play that Carlyle takes for the \"last speech of old Feudal France\" (Beaumarchais's Figaro, Saint-Pierre's Paul et Virginie, Louvet's Faublas) [1, II.VIII].\n\n**What he lingers on and skips.** He lingers on the fashionable spectacle and on hunger. He gives short shrift to the actual governance of the reign; ministers appear as portraits rather than as policies.\n\n**Set-pieces.** \"Petition in Hieroglyphs\" (the peasantry as individuals, and the forty-foot gallows), \"Windbags\" (balloon and magnetism as emblems of an Age of Hope that mounts \"so unguidably\"), and \"Printed Paper\" (the Necklace affair and the death-rattle literature).\n\n**Going in.** This is the bridge between the old order and the crisis, and it is not a narrative of the reign. If you want a narrative, read a short survey first; if you do not, treat the Book as a run of linked essays and let the chronology blur. The one fixed point to hold is the bankrupt treasury that runs under every chapter.\n\n**Where it gets hard.** The weakest stretch for a reader looking for plot. Carlyle's sarcasm is on constant duty and the Enlightenment names come thick. The way through is the two-picture structure: every chapter shows either the glitter or the hunger, and the point is always the gap between them. \"Questionable\" and \"Contrat Social\" are the most abstract; skim them if you must, but read their opening and closing pages.\n\n## Book III — The Parlement of Paris (nine chapters)\n\n**What it covers.** The fiscal collapse of the monarchy and the constitutional skirmishing it set off. Book III opens not in 1786 but with Maurepas's death at the end of 1781, and it closes in September 1788. It follows controller after controller as they fail to \"choke the Deficit\": Joly de Fleury and d'Ormesson, then Calonne from November 1783, then Loménie de Brienne in 1787–88, with Necker recalled at the end.\n\n**What Carlyle does with it.** He frames the Parlement as one of the \"chimneys\" through which the coming explosion tries to vent [1, III.I], and the Book is a sequence of blows and answers, with each chapter a distinct beat, not three versions of the same one.\n\n\"Dishonoured Bills\" gives the theory (a lie is a bill drawn on Nature's reality, and Bankruptcy is its presentation for payment) and the court's melancholy: Besenval telling the queen the suppressions of places leave one \"as well in Turkey.\" \"Controller Calonne\" is the portrait of a man of genius for borrowing, who spends \"a million daily,\" whose answer to the queen was \"if it is but difficult, it is done,\" and who ends by convoking the Notables [1, III.II]. \"The Notables\" runs from 22 February to 25 May 1787: Calonne, standing at bay for five hours before a hundred and thirty-seven questioners, then his dismissal on 9 April, the promotion of Archbishop Loménie, and Lafayette's first public call for a national assembly [1, III.III]. In \"Loménie's Edicts\" the Parlement of Paris refuses to register a stamp tax and a land tax, a Bed of Justice at Versailles on 6 August 1787 is declared null the next day, and the Parlement announces that only the Estates-General can authorise taxes [1, III.IV]. \"Loménie's Thunderbolts\" is the exile of the Parlement to Troyes on 15 August 1787, with a cool account of what the Parlement really was (an unloved, venal body that happened to be fighting a worse one) and its return on 20 September [1, III.V]. \"Loménie's Plots\" is the Royal Session of 19 November 1787, at which the Duke of Orléans asks whether it is a Bed of Justice or a Royal Session and enters his protest, and the lettres de cachet that follow [1, III.VI]. \"Internecine\" is the pamphlet flood of winter 1787–88, the queen turning from Besenval's warning, and the Loménie–Lamoignon plan to starve the Parlement of lawsuits with new courts and a \"Plenary Court\" [1, III.VII]. \"Loménie's Death-throes\" is the key chapter: d'Espréménil learns of the plan by bribing a printer's wife for a proof in a ball of clay, the Parlement swears its \"One-and-all\" oath on 3 May 1788, Captain d'Agoust arrives at midnight with torches and sappers to seize d'Espréménil and Goislard, and the provinces rise (Rennes, Grenoble, Pau), with a Breton deputation becoming the \"Breton Club,\" Carlyle's first germ of the Jacobins [1, III.VIII]. The chapter ends with the hailstorm of 13 July, the promise of the States-General for the following May, the \"Edict concerning Payments\" and Loménie's fall. \"Burial with Bonfire\" is Necker's recall on 24 August 1788 and the mock burial of the \"wicker mannequin\" Archbishop on the Pont Neuf, followed on 14 September by the first appearance of the Paris street crowd, \"Rascality,\" in the new era [1, III.IX].\n\n**What he lingers on and skips.** He lingers on personalities and the bodily comedy of institutions in panic. The queen asks Besenval his opinion and then changes the subject; d'Orléans rolls uneasily in his seat before he speaks. He skips most of the technical finance. The arithmetic of the deficit, the tax-farm and the nature of privileges are given as atmosphere. Expect to feel you have missed a lecture.\n\n**Set-pieces.** \"Controller Calonne\" for the portrait; \"Loménie's Plots\" for the Orléans protest; \"Loménie's Death-throes\" for the midnight arrival of d'Agoust and the Parlement sitting in silence as d'Espréménil compares it with the Roman senators awaiting the Gauls; and \"Burial with Bonfire\" for the crowd.\n\n**Going in.** The Parlement is not a parliament in the English sense; it is a hereditary law court that registers royal edicts and claims the right to remonstrate. Its defiance is therefore a clash of privileges, and the irony of the Revolution is that the privileged institutions start the cascade they will not survive. A glance at a standard encyclopedia entry on the Parlement of Paris before you begin will repay the five minutes.\n\n**Where it gets hard.** This is the densest stretch in the volume. The pace is set by the intrigue; there is no crowd to hold onto until the end. Hold the cycle (king demands money, Parlement refuses, king punishes, public cheers the Parlement), let the minister of the month blur, and watch for the moment the cycle breaks. Read III.I, III.II and III.VIII–IX properly; skim III.IV–VII for the pattern, but do not miss the Orléans protest in III.VI.\n\n## Book IV — States-General (four chapters)\n\n**What it covers.** From the doubling of the Third Estate's deputies (Necker's report of December 1788, the royal edict of 24 January 1789) to the opening procession of 4 May 1789 and the first session next day. Nobody had met since 1614, as Carlyle notes: the structure, powers and procedures are \"wholly a vague possibility\" and \"clay which the potter may shape\" [1, IV.I].\n\n**What Carlyle does with it.** \"The Notables Again\" sets out the argument over how the Estates should be built: Sieyès's three questions (What is the Third Estate? Everything. What has it been? Nothing. What does it want? To be something), the Princes' Memorial to the King, Necker's \"circumambulating,\" the second assembly of Notables from 6 November to 12 December 1788 (in the hardest winter since 1709), and the two moot points, double representation and the vote by head [1, IV.I]. \"The Election\" is the nation learning to speak: the signal runs \"as through vast forests the rushing of a mighty wind,\" with parish assemblies and cahiers, with Mirabeau expelled from the Provençal noblesse and standing as a deputy of the Third Estate (and the tale that he opened a cloth-shop), with Doctor Guillotin's petition, and with the first \"Brigands,\" Carlyle's name for the half-real, half-imagined armed hungry [1, IV.II]. \"Grown Electric\" is not about agitators in the Palais-Royal, as one might expect from the title. It is the Réveillon riot of 27–28 April 1789 in the Faubourg Saint-Antoine, when a paper-manufacturer reported to have said a workman could live on fifteen sous a day has his warehouse sacked, and Besenval's Swiss Guards leave four or five hundred dead by Carlyle's count. Carlyle calls it the \"proof-stroke\" of insurrection and says the \"master-stroke\" will follow [1, IV.III]. \"The Procession\" is the opening day: the usher de Brézé opens both doors for the nobles and clergy and only one for the Third Estate; the long march from Saint-Louis to Notre-Dame; and a gallery of portraits that is the volume's casting list (below) [1, IV.IV].\n\n**What he lingers on and skips.** He lingers on the Procession; the final chapter alone runs close to seven hundred lines, longer than the other three put together. He skips the detail of the pre-election pamphlet war and passes over the second Notables' meeting in a few paragraphs.\n\n**Set-pieces.** \"The Procession.\" Come to it as you would to a stage tableau, because Carlyle is introducing a cast: Baroness de Staël at a window; the \"brown eloquent Beauty\" Théroigne imagined in the crowd; Marat, \"squalidest bleared mortal\"; Danton, \"esurient, unprovided,\" and Camille Desmoulins beside him; Mirabeau's long life-story; the seagreen Robespierre; Pétion, Barnave, Sieyès, Guillotin, Bailly, Lafayette, Talleyrand, Maury, and the queen \"shut thy eyes on the future.\" The chapter ends with the hats: the Third Estate clap on their hats as the king puts on his, and he takes his off [1, IV.IV].\n\n**Going in.** The mechanism to understand is the three Estates (Clergy, Nobility, Third Estate) and the dispute over whether they vote by order or by head, because Book V is that dispute turned into revolution. Without it the next Book's opening makes no sense.\n\n**Where it gets hard.** \"The Procession\" is long and thronged with deputies introduced one by one. Treat it as a gallery walk. Notice the three or four you can place and let the rest go; the people who matter will be introduced again when they act. \"The Notables Again\" is the one chapter where the arithmetic of representation matters.\n\n## Book V — The Third Estate (nine chapters)\n\n**What it covers.** May to July 1789, the hinge of the whole volume. The Third Estate refuses to act as a separate order and on 17 June turns itself into a National Assembly; the Court locks it out of its hall; the deputies take their oath in a tennis court on 20 June; the king overrides them on 23 June and Mirabeau answers; the troops gather; Necker is dismissed; Paris rises, arms itself and storms the Bastille on 14 July; the king comes to Paris; the crowd takes its first lynching victims.\n\n**What Carlyle does with it.** The Book is shaped as a duel of gods, and each chapter moves one step along it. \"Inertia\" is the Third Estate's six weeks of doing nothing \"in a judicious manner\" (\"these were their still creation-days; wherein they sat incubating\"), refusing to verify its powers separately; it ends on 17 June with the new name [1, V.I]. \"Mercury de Brézé\" is the Court's first god from the machine: closed doors and carpenters on 20 June, the Tennis-Court Oath, the Royal Session of 23 June, and Mirabeau's rejoinder to the usher that nothing but bayonets will move the deputies [1, V.II]. \"Broglie the War-God\" is the second god: Marshal Broglie's troops massing, and the Gardes Françaises beginning to refuse, with Carlyle's reasoning that \"grapeshot is good on one condition, that the shooter also were made of metal\" [1, V.III]. \"To Arms!\" is Sunday 12 July: the news of Necker's dismissal, Camille Desmoulins on a café table with a pistol in each hand, green cockades, the wax busts of Necker and d'Orléans, and Prince Lambesc's charge in the Tuileries garden [1, V.IV]. (Marat's printed advice to abstain from violence is mentioned in a single line; Camille is the chapter's centre.) \"Give us Arms\" is Monday 13 July: the red-and-blue tricolor (\"will go round the world\"), the burning of Saint-Lazare, pikes forged, the Charleville boxes full of rags, the Gardes Françaises coming over, and the old Marquis de Mirabeau dying in the middle of it [1, V.V]. \"Storm and Victory\" is 14 July, below. \"Not a Revolt\" is the grim chapter after the victory: the killing of de Launay and the hanging of Invalides, Flesselles shot, the seven Bastille prisoners and the letter from the dead Quéret Démery, and only at its very end the exchange between the king and the Duke de Liancourt [1, V.VII]. \"Conquering your King\" is the court's retreat and the king's visit to Paris on 17 July with a tricolor cockade, with the first emigration of the Princes and Mayor Bailly's line that \"the people have conquered their King\" [1, V.VIII]. \"The Lanterne\" opens with the \"Brigands\" rumour riding out of Paris and freezing France into a National Guard, then gives the lynching of Foulon and Berthier on 22 July [1, V.IX].\n\n**What he lingers on and skips.** He lingers on the Parisian mornings: the smiths hammering pikes, the women sewing cockades, the city \"foaming like some Venice wine-glass into which you had dropped poison.\" He skips most of the debate-by-debate parliamentary record; the constitutional argument is mostly offstage.\n\n**Set-pieces.**\n- \"Mercury de Brézé\" has the Tennis-Court Oath and Mirabeau's reply; the volume's first great parliamentary moment [1, V.II].\n- \"To Arms!\" gives Camille Desmoulins on the table in the Palais-Royal, the speech Carlyle prints in \"such, or fitter, words\" [1, V.IV].\n- \"Storm and Victory\" is the Bastille chapter itself: the sleepless Permanent Committee crying \"Arms! Arms!\", Thuriot on the battlements with de Launay, the 82 old Invalides and 32 Swiss behind walls nine feet thick, Louis Tournay's axe on the chain of the outer drawbridge, \"every man his own engineer,\" Marat's cameo on the Pont Neuf, and Usher Maillard crossing the ditch on a plank to take the terms of surrender. The chapter ends on \"the Bastille is fallen!\" [1, V.VI]. It is as much about the besieging crowd as the fortress, and it is deliberately unheroic about the aftermath.\n- \"Not a Revolt,\" for the contrast between the victory and what it did on the Place de Grève, and for the Liancourt exchange [1, V.VII].\n- \"The Lanterne,\" for Foulon's head carried on a pike with grass in its mouth [1, V.IX].\n\n**Going in.** Three facts help. The Bastille was a state prison with very few prisoners (Carlyle gives seven), and the first objective on 14 July was gunpowder and weapons, not liberation. Necker's dismissal on 11 July was the trigger (Carlyle has the news break on Sunday 12 July). And the Gardes Françaises, the best regiment of the line, had already changed sides before the assault. Carlyle assumes all of it.\n\n**Where it gets hard.** Not in the prose, which is at its most compelling, but in the cast: Besenval, Broglie, Flesselles, Hulin, Thuriot, de Launay and a hundred more arrive at speed. The method is the opposite of Book III's: do not look names up. Read for the movement of the crowd and let the individuals surface when Carlyle singles them out. One caution about interpretation. Carlyle is ironic about conspiracy theories (he mocks the royalist and Patriot belief that d'Orléans's gold and Mirabeau's couriers produced the Revolution, and says the \"Brigands\" were a rumour), but he treats the suspicion itself as a force that drives events [1, V.IX]; do not read him as a flat debunker.\n\n## Book VI — Consolidation (five chapters)\n\n**What it covers.** July to the end of September 1789, the interval after the Bastille. The title is ironic and Carlyle says so at the start of Book VII: \"this Revolution is not of the consolidating kind.\" The Book follows the Constituent Assembly's attempt to make a constitution while the country burns, the bread queues in Paris and the first tide of newspapers.\n\n**What Carlyle does with it.** \"Make the Constitution\" opens with the volume's only real definitional pause: what is meant by the \"French Revolution,\" since all things are in change? His answer is a loose functional one, the \"open violent Rebellion, and Victory, of disimprisoned Anarchy against corrupt worn-out Authority,\" which he calls \"Sansculottism,\" with the promise that it will burn what is combustible and spare the rest. The same chapter asks where the Revolution \"specially is,\" dismisses the historians who sit in the reporters' chair in the Assembly, and introduces the \"Theory of Irregular Verbs,\" his mock-title for constitution-building [1, VI.I]. \"The Constituent Assembly\" is his judgment that an assembly of twelve hundred is fit for one thing, destroying, because the French believed in \"Gospels according to Jean Jacques\" that a constitution could be made. Here, not in the next chapter, are the Declaration of the Rights of Man (Carlyle: \"neglecting to declare the Duties of Man!\" and forgetting the \"Mights\"), the night of 4 August when privilege was abolished in a rush of enthusiasm \"after dinner,\" the Right and Left sides, and the portraits of Maury, Cazalès, Robespierre, Sieyès and above all Mirabeau [1, VI.II]. \"The General Overturn\" turns from the Assembly to the countryside. \"Of the King's Court, for the present, there is almost nothing whatever to be said,\" it begins; then it follows the hunger and the peasants' war on the châteaux, with Arthur Young's testimony, the old Marquis de Mirabeau's prophecy of the \"culbute générale,\" Necker's triumphal return and the autumn exodus of game and gentry [1, VI.III]. \"In Queue\" is the Paris of the bread-lines, jubilee ceremonies and the new Mayor and General, Bailly and Lafayette, \"Scipio-Americanus,\" trying to feed Paris and keep it from fighting [1, VI.IV]. \"The Fourth Estate\" is the press as a new power: Loustalot, Marat, Camille Desmoulins (who calls himself \"Procureur-Général de la Lanterne\"), Carra, the Palais-Royal orators, the strikes of tailors and cordwainers, and Danton's Cordeliers District [1, VI.V]. Camille's journal is named by Carlyle as \"Revolutions of Paris and Brabant\"; the paper is usually cited as \"Révolutions de France et de Brabant,\" so take Carlyle's title as a slip.\n\n**What he lingers on and skips.** He lingers on the bread-queue (the Paris people learning to stand in line, an art that \"will become one of their marks\") and on the burning countryside. He skips the substance of the Assembly's legislation and gives the Declaration of Rights a few lines of scorn.\n\n**Set-pieces.** \"The Constituent Assembly\" (the night of 4 August in one paragraph, and the Assembly's inner life) and \"The General Overturn\" (the rural uprising, an unusual Carlyle chapter on the peasant); \"In Queue\" is short and good.\n\n**Going in.** The Book is where the reader's expectations get tested. Anyone coming from a textbook account will expect the Declaration of the Rights of Man to be a high point; Carlyle treats it with scorn, as abstract paper, and keeps his eye on the pantry. That is his argument.\n\n**Where it gets hard.** This is the one Book in Volume I where the argument outweighs the action, and where Carlyle's polemic against constitution-making is thickest. If it drags, remember that it is a breathing-space between the two great crowd-chapters on either side. \"The Fourth Estate\" is a good short close; it ends not on a flourish but on the districts, the strikes and the question of whether anyone can \"consolidate\" a revolution in the middle of a feast of shells.\n\n## Book VII — The Insurrection of Women (eleven chapters)\n\n**What it covers.** 1–6 October 1789. A bread crisis and a banquet of Versailles officers turn into a march of Paris market women, followed by the National Guard under Lafayette; the Palace is invaded at dawn; the royal family is brought to Paris. The volume ends on the night of 6 October with the king on the Hôtel-de-Ville balcony.\n\n**What Carlyle does with it.** The first three chapters build the pressure. \"Patrollotism,\" his coinage for the National Guard's policing of a hungry city, takes in the Patriotic Gifts, the quarrel over the royal veto and the arrest of Saint-Huruge [1, VII.I]. \"O Richard, O my King\" is the arrival of the Regiment de Flandre and the banquet of 1 October in the Opera Hall at Versailles, with the queen showing the Dauphin to the diners, the song \"O Richard, O mon Roi,\" white cockades and trampled tricolors, the \"Thyestes repast\" that tips Paris over [1, VII.II]. \"Black Cockades\" is Sunday 4 October in Paris, a woman speaking at the Café de Foy, and the plucking of black cockades from hats [1, VII.III]. From \"The Menads\" on the narration follows the women. He calls the insurrection \"the Art of Insurrection,\" an art the French have perfected, and a young woman seizes a drum at Saint-Eustache; the Hôtel-de-Ville is invaded and the Abbé Lefevre half-hanged on a belfry rope [1, VII.IV]. In \"Usher Maillard,\" the Bastille hero Maillard beats the drum and leads the women out as general; Théroigne is on a cannon \"with pike and helmet\" (her first appearance in the march); Mirabeau warns the Assembly's president that \"Paris marches on us\"; the Centre Grenadiers force Lafayette to lead thirty thousand men to Versailles [1, VII.V]. \"To Versailles\" is the arrival at the hilltop in the drizzle, Maillard's order to put the cannon to the rear and sing \"Henri Quatre,\" and the first deputation of women into the Assembly [1, VII.VI]. \"At Versailles\" is the afternoon: Théroigne working the dragoons and the Flandre soldiers, Louison Chabray before the king (\"It was well worth while\"), the nearly lynched Louison, the sword fights with the Bodyguards, and the first shots [1, VII.VII]. The Théroigne scene is here, not in the road narration. \"The Equal Diet\" is the night in the Assembly hall, women filling the benches, a slain warhorse roasted outside, and sausages brought in so that the Assembly can go on with the penal code [1, VII.VIII]. \"Lafayette\" is the midnight arrival after nine hours on four leagues of road, the oath at Montreuil and the interview with the king [1, VII.IX]. \"The Grand Entries\" is the dawn of 6 October: the Bodyguard's shot, the murder of Deshuttes and Varigny, the queen's flight through the corridor to the king, the Centre Grenadiers saving the Bodyguards at the Œil-de-Bœuf door, and the ironic last flicker of etiquette in the Master of Ceremonies's \"the king grants you the Grand Entries\" [1, VII.X]. \"From Versailles\" is the balcony, the Queen alone with her hands crossed, the cry \"The King to Paris,\" and the great slow procession with the carts of flour and the cry of \"the Baker, the Bakeress and the Baker's boy.\" The volume ends with the king at the Tuileries, \"Tuesday the sixth of October 1789\" [1, VII.XI]. (Carlyle's weekday is correct: 6 October 1789 was a Tuesday.)\n\n**What he lingers on and skips.** He lingers on movement and weather: the draggled women on the last hilltop, the dim moist landscape, Lafayette's slow march. He is almost tender with the Queen's night and unsparing with the clamour. He skips nothing important; this Book runs close to event-for-event. At the end of XI he asks the question the historians still ask, whether the days were plotted by d'Orléans or by the court, and gives the answer that suspicion is itself a force.\n\n**Set-pieces.** \"The Menads\" and \"Usher Maillard\" (the march forms); \"At Versailles\" and \"The Equal Diet\" (the afternoon and the night; unusually comic); \"The Grand Entries\" (the dawn violence, and the queen's escape); and \"From Versailles\" (the balcony and the procession).\n\n**Going in.** The central surprise for a modern reader is that Carlyle's women are not a sentimental symbol. He admires their energy and shows their menace, and he is clear that bread is the cause. His scorn for the Court's blindness is carried over from Book V, where the king, \"kept in happy ignorance,\" dreams of the woods of Meudon while Paris arms [1, V.VII].\n\n**Where it gets hard.** It does not, much. This Book is the volume's easiest and the best argument for pushing through the slow middle. The one watch-out is the cast of National Guard officers and Assembly figures in the middle chapters; follow Maillard, Lafayette and Mirabeau and let the rest recede.\n\n## Where to Slow Down and Where to Skim\n\n| Stretch | Advice |\n| --- | --- |\n| I.I–I.IV | Read \"Realised Ideals\" and \"Louis the Unforgotten\" carefully; skim names in the first chapter |\n| II.I–II.VIII | Read II.II, II.VI and II.VIII for the two pictures (glitter, hunger); skim the salon names; II.III and II.VII are essays |\n| III.I–III.IX | Hardest stretch; read I, II, VI, VIII and IX; skim IV, V and VII for the pattern |\n| IV.I–IV.IV | Read the Election and Réveillon (II–III); tour the Procession |\n| V.I–V.IX | Read everything; this is the volume's centre of gravity |\n| VI.I–VI.V | Read VI.II (the Assembly and 4 August), VI.III (the peasantry) and VI.IV (the queue); skim the rest |\n| VII.I–VII.XI | Read everything; this is the volume's reward |\n\n## What to Carry from Volume I into Volumes II and III\n\nFour threads begin here and keep running. First, the Sham and the Reality: every institution is judged by whether the belief behind it is alive, and Volume I's kings, parlements and philosophies all fail that test in different ways. Second, hunger as a political fact: bread is the cause of the 14 July crowd, the October march and the Revolution's later spasms. Third, the crowd as character: the \"Sansculotte,\" the Menads and the Bastille mob are given collective personality, not just a body-count. Fourth, a small repertory company: Mirabeau, Camille Desmoulins, Danton (briefly, \"esurient, unprovided\" in the Procession of IV.IV), Lafayette, Théroigne and Maillard enter in Volume I and will not all survive Volume III.\n\nTwo details to remember because Carlyle reuses them. The forty-foot gallows of Book II returns when Volume II asks what the people were answered with. And Mirabeau's mounting authority in Books IV–VII is the thread that Volume II lets go at his deathbed.\n\nOne note on editions. This guide follows the Gutenberg text and its chapter order, which reproduces the standard three-volume arrangement (The Bastille, The Constitution, The Guillotine) [1][2]. Page references and volume breaks vary between editions; the Book and chapter titles do not. Modern paperbacks are sometimes selections: a 2010 Continuum Histories volume with an introduction by Ruth Scurr, for example, is catalogued as a 195-page selection, so it will not contain every chapter named here [3].\n\n## Open Questions\n\n- Edition variance: whether the Book and chapter numbering matches the reader's own edition. The titles are stable across editions as far as can be told, but a modern Oxford or Penguin text may drop or move footnotes and the apparatus.\n- The factual orientation points in the \"Going in\" notes (the date of Louis XV's death, the Bastille's seven prisoners, the date of Necker's dismissal) come from Carlyle's own text and standard reference histories. They have not been set against specialist monographs.\n- Carlyle's dates and numbers are not always a modern historian's. His casualty counts at the Réveillon riot and the Bastille, and his account of who plotted the October days, are matters on which later accounts differ.\n- The weight column rests on line counts in the Gutenberg file, which are a proxy for length, not a count of words or printed pages.\n- How much of the pre-1789 Books a modern general reader should be asked to read at full attention is a judgment call, not a settled fact.\n\n## Sources\n\n1. Carlyle, Thomas. *The French Revolution: A History*, Volume I \"The Bastille\" (Books I–VII). Project Gutenberg eBook #1301, plain-text edition. https://www.gutenberg.org/cache/epub/1301/pg1301.txt (fetched 2026-10-24). Tier 1 (primary text). Book and chapter titles, quoted fragments and all chapter-content statements are drawn from this text, which was read through for every Book of the volume.\n2. Project Gutenberg catalogue entry, \"The French Revolution: A History by Thomas Carlyle.\" https://www.gutenberg.org/ebooks/1301. Tier 1 (edition metadata); describes a three-volume work.\n3. Catalogue records for *The French Revolution*, introduced and selected by Ruth Scurr (Continuum Histories, London and New York, 2010, ISBN 9780826440525; listing 195 pages), for example https://www.abebooks.com/9780826440525/Carlyles-French-Revolution-Continuum-Histories-0826440525/plp. Tier 5 (bookseller and library catalogue records); cited only for the point that this edition is a selection. Source quality: catalogue listing only; used for that one point."}, {"order": 3, "file": "03_Volume_II_The_Constitution.md", "title": "Volume II, The Constitution: A Book-by-Book Reader's Guide", "summary": "A guide to the middle volume of Carlyle's French Revolution (1837): six Books and fifty-four chapters, from the Tuileries of October 1789 through the Feast of Pikes, Nancy, Mirabeau's death, Varennes and the Legislative Assembly to the fall of the monarchy on 10 August 1792. What he lingers on, what he skips, the set-pieces, and where the going gets hard.", "body": "# Volume II, The Constitution: A Book-by-Book Reader's Guide\n\n## Bottom Line\n\nVolume II is the book's long middle, and it is shorter on headline events than the volumes on either side of it. It is also the volume where Carlyle's whole argument shows its cards: that a paper Constitution is a \"Constitutional Theory of Defective Verbs\" and cannot make a nation march, while the real action is underneath, in hunger, panic, oaths, newspapers and one hapless King. A prefatory correction for anyone working from a secondhand outline: the volume has **six** Books, not seven (the seven-Book pattern belongs to Volumes I and III), and fifty-four chapters in all [1].\n\nRead it for five peaks: the Feast of Pikes (Book I), the death of Mirabeau (Book III), the flight to Varennes (Book IV), the Twentieth of June (end of Book V), and the storming of the Tuileries (Book VI). Treat the stretches between them as terrain to be crossed at a steady pace, not studied.\n\n## The Map\n\nThe volume runs from October 1789, where Volume I ended with the royal family brought to Paris, to 13 August 1792, when the deposed king is taken to the Temple. Chapter titles below are Carlyle's own, as printed in the Gutenberg text; the Roman numerals are chapter numbers within the book. The totals match the printed contents: 12 + 6 + 7 + 9 + 12 + 8 = 54 [1].\n\n| Book | Title | Chapters | Span | What happens |\n|---|---|---|---|---|\n| I | The Feast of Pikes | 12 | Oct 1789 to July 1790 | The Assembly sits in the Riding-school; press, clubs and oath-taking multiply; the Federation of 14 July 1790 |\n| II | Nanci | 6 | Summer 1790 | The army, rotten with arrears and politics, mutinies at Nancy and is crushed by Bouillé on 31 August |\n| III | The Tuileries | 7 | Late 1790 to April 1791 | A court in a cage; duels and the Day of Poniards; Mirabeau's last months and death on 2 April |\n| IV | Varennes | 9 | April to 17 July 1791 | The royal flight, arrest and return; the Champ-de-Mars shooting |\n| V | Parliament First | 12 | Sept 1791 to 20 June 1792 | The Constitution is accepted; the Legislative Assembly; Avignon, emigrants, Roland, war, the Twentieth of June |\n| VI | The Marseillese | 8 | June to 13 Aug 1792 | Fédérés and Marseillais, the Country in Danger, the Brunswick Manifesto, the Tenth of August |\n\nChapters in full:\n\n**Book I, The Feast of Pikes.** I. In the Tuileries. II. In the Salle de Manége. III. The Muster. IV. Journalism. V. Clubbism. VI. Je le jure. VII. Prodigies. VIII. Solemn League and Covenant. IX. Symbolic. X. Mankind. XI. As in the Age of Gold. XII. Sound and Smoke [1].\n\n**Book II, Nanci.** I. Bouillé. II. Arrears and Aristocrats. III. Bouillé at Metz. IV. Arrears at Nanci. V. Inspector Malseigne. VI. Bouillé at Nanci [1].\n\n**Book III, The Tuileries.** I. Epimenides. II. The Wakeful. III. Sword in Hand. IV. To fly or not to fly. V. The Day of Poniards. VI. Mirabeau. VII. Death of Mirabeau [1].\n\n**Book IV, Varennes.** I. Easter at Saint-Cloud. II. Easter at Paris. III. Count Fersen. IV. Attitude. V. The New Berline. VI. Old-Dragoon Drouet. VII. The Night of Spurs. VIII. The Return. IX. Sharp Shot [1].\n\n**Book V, Parliament First.** I. Grande Acceptation. II. The Book of the Law. III. Avignon. IV. No Sugar. V. Kings and Emigrants. VI. Brigands and Jalès. VII. Constitution will not march. VIII. The Jacobins. IX. Minister Roland. X. Pétion-National-Pique. XI. The Hereditary Representative. XII. Procession of the Black Breeches [1].\n\n**Book VI, The Marseillese.** I. Executive that does not act. II. Let us march. III. Some Consolation to Mankind. IV. Subterranean. V. At Dinner. VI. The Steeples at Midnight. VII. The Swiss. VIII. Constitution burst in Pieces [1].\n\nSpellings are Carlyle's: \"Nanci\" for Nancy, \"Marseillese\" for Marseillais. Volume II runs 54 chapters and Volume III 55, and the Gutenberg listing agrees on the six Books of this volume [1][2].\n\n## Before You Start: What Volume II Is For\n\n**The shape of the volume.** Volume I was a book of explosions: the old regime dying, the Bastille, the October days. Volume III will be the Terror. Volume II is the interval between, and Carlyle knows it. He opens by saying that once the victim has had his stroke-of-grace, only \"sharper agonies\" are worth watching, and he asks whether Royalty, wrenched out of its tapestries on 6 October, is such a victim [1, 2.1.I]. The volume's governing joke is the Constitution that is always being built and never works. His running tag is that it \"will march\" if only it had legs; in Book V one chapter is simply titled \"Constitution will not march,\" and Book VI ends with the Constitution \"burst in Pieces\" [1].\n\n**His angle.** Carlyle is not neutral and does not pretend to be. He admires force and sincerity, despises cant, and has no patience for parliamentary talk. That makes him unfair to the men who wrote the 1791 Constitution (he dismisses the Legislative of Book V as \"Unhappy Legislative,\" a body history can only drop a tear over) and unusually alert to crowds, rumours, symbols, and individual panic. Expect the Assembly to be a babble offstage and the street, the barracks and the royal bedchamber to get the chapters.\n\n**What he skips.** The very thing the volume is named for gets the least space. The Constituent Assembly's legislation, the 1790 reorganisation of the Church, the courts, the departments, the assignats: all of this is mentioned in passing and by sarcasm, rarely explained. In 2.1.II he does give a hurried summary (the Parlements put in \"permanent vacation\" and sealed up with wax on 13 November 1790; the old provinces replaced by eighty-three departments; assignats decreed on 19 December 1789 as the first of many paper issues). But a reader who wants to know what the Civil Constitution of the Clergy actually did must look elsewhere; Carlyle gives its consequence (a country \"rent asunder\" over religion, refractory priests and a King who signs against his conscience) rather than its content [1, 2.1.II, 2.3.IV]. This is the single largest gap for a first-time reader, and the reason a short companion outline is worth having beside you.\n\n**What you need in your head.** Four things. First, the factions of the Assembly. The Right (Maury, Cazalès) are royalists; Mirabeau is the commanding independent; Lafayette commands the National Guard; the Jacobins are growing in the clubs. Second, the monarchy's real position: Louis is a king in all but power, hostage to a Paris that keeps him in the Tuileries. Third, the army: Bouillé, a general on the eastern frontier, is the monarchy's last military hope and appears throughout. Fourth, the foreign danger: Austria and Prussia, the emigrant nobles gathered at Coblentz, and the Duke of Brunswick, whose march drives the last book. You do not need dates beyond that; Carlyle supplies them in his own idiosyncratic way.\n\n**Technical note on format.** The text is a continuous flow of short chapters with titles that are often puns, quotations or pointers. Do not skim the titles for content; they are a second voice. Reread the table above after finishing each book. One small habit to expect: Carlyle's own arithmetic is not always reliable. He says, for instance, that the royal family will sit in the Tuileries \"for one-and-forty months\" [1, 2.1.I]; from October 1789 to August 1792 is about thirty-four.\n\n## Book I: The Feast of Pikes\n\n**Period.** October 1789 to 14 July 1790.\n\n**The long version.** Twelve chapters. \"In the Tuileries\" sets the scene: the royal family lodged in the old palace, the King filing locks, the Queen reading, the Dauphin gardening, Lafayette's blue guards round the place \"wooingly,\" and Carlyle's image of a King Log who cannot hunt [1, 2.1.I]. \"In the Salle de Manége\" is the longest chapter in the volume by a wide margin, and it is less a gallery of speakers than a survey of everything the Assembly is doing and failing to do: the roll of orators (Abbé Maury, Cazalès, Barnave, Pétion, Sieyès, the Lameths), Mirabeau's suspected venality and his triumph in the debate on who may declare war, the assignats, the departments, the Church \"like a weltering hydra-coil,\" the Right Side's refusal to learn, the aborted royalist plots and the hanging of Favras in February 1790, and finally Marat's proposal that two hundred Neapolitan bravoes with dirks could finish the work [1, 2.1.II]. \"The Muster,\" \"Journalism\" and \"Clubbism\" are a sociology of the Revolution's engine: the rising of \"low-lying figures\" (Marat, Chaumette, Tallien, Collot d'Herbois, then Danton and the foreign adventurers who flock to Paris, among them Paine, the fading John Paul Jones and Anacharsis Clootz); the placard-pasters and pamphleteers; and the clubs. \"Clubbism\" is Carlyle's account of why the Jacobins matter: the Germans, he suggests, hold that enthusiasm just is \"Congregating\" (his gloss on Schwärmerey), and the Jacobin Mother-Society, leasing a convent hall and spawning daughter-clubs, is to be the grand fact of the time [1, 2.1.III–V].\n\nThen the book turns to hope. \"Je le jure\" is the King's visit to the Assembly on 4 February 1790 and the wave of oath-taking that follows it, \"such three weeks of swearing!\" \"Prodigies\" is its dark twin: Carlyle's reflection on the Social Contract as a faith (a promise cannot bind a people that changes every hour), and the apocalyptic fringe of the royalist side, a prophetess who foresees a mock-sun stamped with the head of the hanged Favras, and two Rouen magistrates who arrive at Saint-Cloud with a \"magnetic vellum\" to save the monarchy [1, 2.1.VI–VII]. \"Solemn League and Covenant\" traces how the Federation idea grows: a meeting of National Guards at Étoile on 29 November 1789, then Montélimar, then the great Lyons festival of May 1790 where Madame Roland first walks onto the page [1, 2.1.VIII]. \"Symbolic\" is a short meditation on why nations make ceremonies, comparing the Scots who signed their Covenant in a dingy close with the French, who must have a Champ-de-Mars [1, 2.1.IX]. The last three chapters carry the Federation itself: \"Mankind,\" \"As in the Age of Gold,\" and \"Sound and Smoke\" [1, 2.1.X–XII].\n\n**What Carlyle does with it.** He lingers on feeling rather than law. The Federation is for him the \"highest recorded triumph of the Thespian Art,\" a whole Pit of Twenty-five Millions applauding itself and then leaping onto the stage, and he insists that staged enthusiasm is worth less than the spontaneous kind (the women's march of Volume I) [1, 2.1.X]. The bitter irony is built into the structure: Book II opens by calling the whole Federation a last, loudest \"Hep-hep-hurrah\" in a national feast of constitution-making, with the discords only momentarily assuaged.\n\n**Set-pieces not to miss.**\n- *Chapter X, \"Mankind.\"* On 19 June 1790 Anacharsis Clootz, the Prussian-born \"orator of the human race,\" leads a deputation of foreigners (Swedes, Spaniards, \"Chaldeans, Turks\") into the Assembly to claim a place at the Federation, an episode that ends in the abolition of titles of nobility, so that Lafayette becomes \"the Sieur Motier.\" The same chapter introduces the \"Dean of the Human Species,\" a 120-year-old serf from the Jura. Funny and moving at once [1].\n- *Chapter XI, \"As in the Age of Gold.\"* The whole of Paris, rich and poor, digs the Champ-de-Mars: monks beside Opera nymphs, the King's guard of honour of spades, Abbé Sieyès pulling a tumbril. Possibly the book's best sustained image of collective enthusiasm [1].\n- *Chapter XII, \"Sound and Smoke.\"* The Federation morning itself: Lafayette (\"General of France for four-and-twenty hours\") swears the oath, the King swears, Talleyrand blesses the banners, and it rains on three or four hundred thousand people. The chapter closes on the Bastille-ground ball (\"Ici l'on danse\") and on the question why an oath sworn with such joy was broken within a year, with the sour image of a wedding feast after which the bride has \"burnt her bed\" [1].\n\n**Where it gets hard.** Chapter II. It is the longest chapter in the volume, a procession of orators, many of them unfamiliar. Do not try to memorise them. Carlyle introduces them by tag-phrase, and almost none matter again except Mirabeau, Maury, Robespierre and Sieyès. Push through to Chapter III, where the prose speeds up. \"Prodigies\" and \"Symbolic\" are essay-chapters you can skim.\n\n## Book II: Nanci\n\n**Period.** Summer 1790; the action proper runs from the Federation's aftermath to 31 August.\n\n**The long version.** Six chapters, a compact case study. \"Bouillé\" introduces the commander at Metz, the monarchy's last refuge, \"worth a glance,\" Carlyle says, because his position \"will throw light on many things\" [1, 2.2.I]. \"Arrears and Aristocrats\" explains why the army has come loose: discipline \"works by faith,\" the faith broke at the Bastille, and the soldiers have two grievances (their officers are aristocrats of four generations' standing, and they are cheated of their pay). It contains one of the book's best digressions: a glimpse of a twenty-one-year-old artillery sub-lieutenant at Auxonne, living in a barber's house and walking twenty miles to correct the proofs of his pamphlet against a Corsican deputy, whose name is \"Napoleon Buonaparte\" [1, 2.2.II]. \"Bouillé at Metz\" gives the best single scene of the Book: Bouillé facing the mutinous Regiment de Salm for two hours on the staircase, sword in hand, until the Mayor talks the soldiers home [1, 2.2.III]. \"Arrears at Nanci\" describes the tense garrison town, with its aristocratic municipality and its three regiments, including the Swiss of Château-Vieux, who are flogged for demanding their arrears [1, 2.2.IV]. \"Inspector Malseigne\" follows the Herculean royalist inspector sent to settle the accounts, who draws his sword at the barracks gate, flees to Lunéville and is brought back a prisoner, in a comic hunt that leaves Nancy a Bedlam [1, 2.2.V]. \"Bouillé at Nanci\" is the action: on 31 August Bouillé's column reaches the gate, young Captain Desilles throws himself on a cannon and is shot, and a \"thunderous belch of grapeshot\" starts two hours of street fighting [1, 2.2.VI].\n\n**What Carlyle does with it.** He treats the affair as a hinge: if Bouillé fails, the whole soldiery goes over; if he succeeds, the army stays an army and the Revolution gets its first deep wound. He writes it in the historical present, straining the sentences to the breaking point (\"Haste with help, thou brave Bouillé\"). He is frank about the cost: \"Three thousand, as some count, lie mangled, gory.\" That figure is the high end of contemporary rumour; reference accounts give far lower figures (a few hundred killed), and they describe the aftermath (a number of Swiss hanged, others sent to the galleys) in terms that agree with Carlyle's outline [3]. By the end of Book V the affair has hardened into a Patriot grievance, the \"Massacre of Nanci,\" as Carlyle says when the surviving Swiss are celebrated in 2.5.X [1].\n\n**Set-pieces.** Chapter III (the staircase), Chapter V (Malseigne), Chapter VI (the action, with Desilles on the cannon, the woman who throws a pail of water on another gun, and Necker's sad departure from Paris on 3 September).\n\n**What you need.** Know that the army of 1790 was officered by nobles and manned by commoners; the rest follows. Carlyle gives the facts in the chapters.\n\n**Where it gets hard.** Few readers struggle here; the book is short and plot-driven. If anything it is the easiest book in the volume. Its lesson (the royal army cannot be counted on, which is why the King will later flee toward Bouillé) pays off in Book IV.\n\n## Book III: The Tuileries\n\n**Period.** Autumn 1790 to early April 1791, with a leap ahead to July 1791 at the start.\n\n**The long version.** The court in its captivity. Chapter I, \"Epimenides,\" is a meditation rather than narrative, and it contains a jump: the classical sleeper, or Rip Van Winkle, who falls asleep under the Altar of the Fatherland on Federation Day and wakes on 17 July 1791 to find the cheering turned to shrieks and the red flag of martial law over the Champ-de-Mars. Carlyle uses the image to say that no one sleeps in this world, that nothing dead remains idle, and that every deed persists and works its consequences [1, 2.3.I]. Chapter II, \"The Wakeful,\" is the press and the clubs again: a hundred and thirty-three journals, Marat's calls for gibbets, Captain Dampmartin harangued from an inn window in January 1791, Fauchet's Cercle Social [1, 2.3.II]. Chapter III, \"Sword in Hand,\" is the Assembly in noisy session, with Mirabeau awing down the Jacobins and with the duelling craze: Barnave and Cazalès, then Lameth wounding himself on the Duke de Castries's sword, which sets off the sack of the Hôtel Castries by the crowd on 13 November 1790 [1, 2.3.III]. Chapter IV, \"To fly or not to fly,\" opens with the Civil Constitution of the Clergy, which the King sanctioned reluctantly and which splits France along religious lines. Carlyle dates the King's signing \"January 21st,\" which sits uneasily with the usual dates (the Civil Constitution was sanctioned in August 1790 and the clerical-oath decree in late December 1790), and he appears to be reaching for an echo of another 21 January [1, 2.3.IV; 4]. The chapter goes on to the court's flight-schemes: the whist game at which the King will not consent \"to be forced away,\" the Aunts' flight to Rome in February 1791, the report of saddled horses at Versailles, and, at the end, Mirabeau's secret meeting with the Queen in the park at Saint-Cloud [1, 2.3.IV].\n\nChapter V, \"The Day of Poniards,\" narrates 28 February 1791, when Saint-Antoine marches on the castle of Vincennes to pull it down and armed nobles (\"men in black\" with hunting knives and sword-sticks) gather at the Tuileries; Lafayette disperses the crowd at Vincennes, then returns to find the Tuileries guards throwing the \"Chevaliers of the Poniard\" down the stairs [1, 2.3.V]. Chapters VI and VII give Mirabeau's last weeks and his death.\n\n**What Carlyle does with it.** Mirabeau is the only large human figure the volume admits, and Carlyle treats his death as a historical hinge that he immediately refuses to treat as a hinge: \"would-have-beens\" are, he says, \"a vanity,\" and the world's history \"could never in the least be what it would, or might, or should\" [1, 2.3.VII]. This is the book's moral and philosophical centre. A man dies; the one force that might have worked a bridge between Crown and Revolution goes with him; and Carlyle both mourns and refuses to say it would have mattered. The farewell to Mirabeau (2 April 1791; funeral on 4 April; the first tenant of the new Pantheon, later cast out) is his best character-summing in the book [1, 2.3.VII].\n\n**Set-pieces.**\n- *Chapter VII, \"Death of Mirabeau.\"* The chapter opens on the \"Pale Messenger\" who \"beckons silently\" (a phrase to keep) and moves through the last days, the whole of Paris holding its breath, and a funeral of a league's length [1].\n- *Chapter V, \"The Day of Poniards.\"* A good short farce-with-menace: aristocrats armed with hidden knives, Lafayette in the middle.\n- *Chapter IV,* the whist scene and the Saint-Cloud rendezvous, for the plotting court.\n- *Chapter I, \"Epimenides,\"* if you like the philosophical Carlyle; skip it if you want the plot.\n\n**Where it gets hard.** Chapter I, if you have no patience for the sage. It sets a theme (that actions endure) rather than advancing the story, and a reader in a hurry can read the first page and move on. Chapters II and III, the bill-stickers and the duels, are the transitional chapters most likely to feel like filler, though both pay off later.\n\n## Book IV: Varennes\n\n**Period.** Easter (18 April) to the Champ-de-Mars shooting on 17 July 1791.\n\n**The long version.** The most famous book in the volume, and one of the most famous in the whole work. \"Easter at Saint-Cloud\" is the royal family prevented from leaving Paris for Easter on 18 April, held in their carriage in the Carrousel for an hour and three-quarters by the crowd; \"Easter at Paris\" gathers the religious quarrel (the Pope burned in effigy in the Palais-Royal by Saint-Huruge on 4 May) and the King's decision to flee, \"to seek a great May-be\" [1, 2.4.I–II]. \"Count Fersen\" is the preparation: the dressing-case (the queen's \"Nécessaire of inlaid ivory and rosewood,\" which is forwarded and never arrives), the Russian \"Baroness de Korff\" and her enormous new Berline, Bouillé's camp at Montmédy, and then the night of 20 June, with Fersen as the glass-coach driver and the queen, taking the wrong turning in the Carrousel, brushing Lafayette's carriage-wheel with her little cane [1, 2.4.III]. \"Attitude\" is Paris on the morning of the 21st: the Assembly votes that the King has been \"abducted\" and passes calmly to the order of the day, the people \"take a great attitude,\" the word Roi vanishes from shop signs, and Robespierre, convinced of a coming St Bartholomew of Patriots, asks what a Republic might be [1, 2.4.IV]. \"The New Berline\" follows the carriage on its slow road and the clouds of Bouillé's cavalry escorts (\"thunder-chain\") waiting in the villages [1, 2.4.V]. \"Old-Dragoon Drouet\" is the postmaster of Sainte-Menehould recognising the traveller's face against the portrait on a new assignat, and riding off in pursuit. \"The Night of Spurs\" is the avalanche of alarm, the arrest at Varennes under the archway, the King's bread and Burgundy at the grocer Sausse's house, and the failure of the rescue. \"The Return\" is the slow ignominious road and the silent procession through Paris on Saturday 25 June, with Barnave and Pétion in the carriage. \"Sharp Shot\" is the question of what to do with a King who ran [1, 2.4.VI–IX].\n\n**What Carlyle does with it.** This is where the \"camera-eye\" Carlyle is best known for operates at full strength. He cuts between distant villages and the lumbering carriage; between the postmaster's attention to the road and the King's inattention to its meaning. He treats the flight as the moment the Revolution passes from a mutual pretence (the King is free, the Constitution is his) to open confrontation, and he refuses to excuse Louis. The famous passage in VII imagines the King for once saying \"it is the King; tremble ye to know it,\" and the whole of French history different; Carlyle's judgment is that \"it was not in the poor phlegmatic man\" [1, 2.4.VII]. In IX the monarchy is \"set up again on its vertex\" by the Barnave–Lameth triumvirate; Carlyle says the Throne is an overturned pyramid propped to stand \"while it is held\" [1, 2.4.IX].\n\nThe chapter ends with the Champ-de-Mars on Sunday 17 July: the petition for deposition on the altar, two men with a gimlet and a wooden leg found hiding under the platform and lynched, Lafayette and Bailly arriving with the red flag, and the shooting. Carlyle gives Bailly's \"Twelve unfortunately shot\" and adds that Patriotism counts \"by tens and even by hundreds\" [1, 2.4.IX]. Modern reference accounts put the dead somewhere between a dozen and about fifty, and treat the numbers as uncertain [5]. It was not \"the first time the Revolution's own soldiers fire on the people\": the army and National Guard had fought the crowd at the Réveillon riot, at Nancy, and elsewhere. What Carlyle says is \"Once more Patrollotism has triumphed: one other time; but it is the last.\"\n\n**Set-pieces.**\n- *Chapter III, \"Count Fersen.\"* The night drive: Fersen on the box, the Queen lost in the Carrousel, the glass-coach turned adrift in a ditch. The bridge into the whole book [1].\n- *Chapter VI, \"Old-Dragoon Drouet.\"* A summer evening in the village; Drouet in his nightgown, a new assignat in his hand, comparing \"the Paper-money Picture with the Gross-Head\" in the carriage. The best-known passage in the book for a reason [1].\n- *Chapter VII, \"The Night of Spurs.\"* The pursuit through the dark; the chapter compares the spreading alarm to the first stir of an Alpine avalanche. The Varennes archway, the grocer Sausse, the tocsin [1].\n- *Chapter VIII, \"The Return.\"* The road back to Paris and the silent crowds. It opens with Carlyle's summary of royalist plotting, from the Séance Royale to the Opera Repast to Varennes, \"not one solitary Plot of which has issued otherwise,\" and with the glance at Théroigne, now lying in an Austrian prison [1].\n\n**What you need.** Nothing more than the premise: the royal family tried to leave France in disguise in June 1791 and were stopped at Varennes. Carlyle gives you the rest, so well that previous knowledge may be a handicap (it spoils the suspense, but not the interest).\n\n**Where it gets hard.** Chapters II (\"Easter at Paris\") and IV (\"Attitude\") move more slowly. The latter is a report on Paris's collective reaction to the flight and is mainly an extended pause. Skim if you must; the main thread picks up again at V.\n\n## Book V: Parliament First\n\n**Period.** September 1791 to the Twentieth of June 1792.\n\n**The long version.** The hardest book. Twelve chapters, long ones, spread over a new national legislature that Carlyle clearly finds uninteresting. Chapter I, \"Grande Acceptation,\" is the end of the Constituent Assembly: the King accepts the finished Constitution on 14 September 1791, the Champs-Élysées are illuminated and Paris dances through the last nights of the month, and on 30 September the President declares the Assembly's mission finished. It is a false dawn, and Carlyle draws it so that the reader senses the end; the departing deputies are sketched one by one [1, 2.5.I]. Chapter II, \"The Book of the Law,\" describes the new Legislative with undisguised boredom (\"Unhappy Legislative, what can History do with it; if not drop a tear over it, almost in silence?\"), and then gives a portrait gallery: Vergniaud, Brissot, Condorcet, Isnard, Carnot, the Cordelier trio, Couthon on crutches, Cambon. It ends on the \"Baiser de Lamourette\" and the first statement of the chapter title's joke [1, 2.5.II].\n\nFrom there the book turns outward, to the places where the Revolution is actually happening. Chapter III (\"Avignon\") narrates the murder of the patriot L'Escuyer in the Cordeliers church on 16 October 1791, the \"brave Brigands of Avignon\" under Jourdan the headsman, and the reprisal in the dungeons of the papal palace, ending in the Glacière tower, where Carlyle counts \"a Hundred and Thirty Corpses.\" Modern French accounts give a figure of about sixty, so take Carlyle's as an overstatement [1, 2.5.III; 6]. Chapter IV (\"No Sugar\") is not about food riots in general: it surveys the south and the north (the riots at Perpignan and Caen; Simonneau, the mayor of Étampes, trampled to death), then crosses the Atlantic to Saint-Domingue, where the free man of colour Ogé's rising of 1790 is followed in 1791 by a slave revolt that burns the Plain of Cap Français, and ends on Paris groceries and the sugar boycott [1, 2.5.IV]. Chapter V (\"Kings and Emigrants\") has three parts: the King's double game (Bertrand de Moleville's plan to make the Constitution fail by obeying it, the hired \"applauders\" of the Rivarol staff, d'Orléans spat on at the Levee), the Pilnitz declaration of August 1791 and the \"common cause of Kings,\" and the Coblentz emigrants with their forged assignats [1, 2.5.V]. Chapter VI (\"Brigands and Jalès\") is about the war question and rural panic: the paper Royalist \"camp of Jalès,\" which Carlyle says is mostly theatre until it actually musters in June 1792, the Girondin–Robespierre argument over whether to declare war, and the great fear of the spring of 1792, when the \"Brigands\" are imagined at every village and peasants scour the roads with scythes [1, 2.5.VI].\n\nChapter VII (\"Constitution will not march\") makes the central joke explicit: the Legislative can pass decrees against emigrants and refractory priests, and the King's veto paralyses every one; there are sketches of the Assembly's scenes (Bishop Torné flinging down his cross, smoke in the hall when Bertrand de Moleville is being questioned) [1, 2.5.VII]. Chapter VIII (\"The Jacobins\") shows the Mother-Society as the real governing body, in Toulongeon's description of the vast circus-like hall with its bust of Marat, with Théroigne speaking from the tribune, Robespierre droning and Louvet rising to oppose him; the Feuillant club has been hissed out of existence on 18 February 1792 [1, 2.5.VIII]. Chapter IX (\"Minister Roland\") brings in the Patriot ministry of 15–23 March 1792, with Dumouriez at Foreign Affairs, Roland at the Interior, Clavière at Finance, and the \"Quaker endimanché\" going to kiss the King's hand with ribbon on his shoes. It ends with the declaration of war on 20 April. Chapter X (\"Pétion-National-Pique\") is the high-spirited festival chapter: the Swiss of Château-Vieux, released from the Brest galleys, are paraded through Paris in a triumphal car on 15 April, and the baptism of a child \"Pétion-National-Pique\" on the Altar of the Fatherland. Chapter XI (\"The Hereditary Representative\") is the war going wrong: the panic and murder of General Dillon at Lille, the Camp of Twenty Thousand and the decree against priests, the King's veto of both, Roland's letter, and the dismissal of the Patriot ministry on 13 June. Chapter XII (\"Procession of the Black Breeches\") is the Twentieth of June [1, 2.5.IX–XII].\n\n**What Carlyle does with it.** The volume's thesis lands here: the new machine of government is \"tied up by an unmarching Constitution\" and can oppose the real crisis only with \"mere bursts of parliamentary eloquence\" [1, 2.5.VII]. Carlyle stops narrating the Assembly and narrates the country instead. Be prepared for a book that moves like a map more than a story, with places (Avignon, Jalès, Saint-Domingue, the frontiers) in place of the Assembly's debates.\n\n**Set-pieces.**\n- *Chapter I, \"Grande Acceptation.\"* The false dawn of the 1791 Constitution, with its illuminations and fireworks, and the farewell to the Constituent [1].\n- *Chapter III, \"Avignon.\"* Violent and unflinching; the one chapter in the volume that approaches the horror of Volume III.\n- *Chapter V, \"Kings and Emigrants,\"* for its sweep of Europe and the humiliation of d'Orléans at Court.\n- *Chapter XII, \"Procession of the Black Breeches.\"* On 20 June 1792 the crowd of Saint-Antoine and Saint-Marceau, led by Santerre and Saint-Huruge, with a pair of old black breeches on a pole (\"Tremble tyrants, here are the Sansculottes\"), enters the Tuileries; the King, in the window embrasure, is handed a red cap, sets it on his head and puts a Grenadier's hand on his heart: \"Fear? feel then.\" A good scene to carry into Book VI [1].\n\n**What you need.** The Legislative that meets in October 1791 is a different body from the Constituent: new men, because the old Assembly's members had barred themselves from re-election. Carlyle assumes you know this. He also assumes you know the names Brissot, Roland, Dumouriez and Pétion, who come in fast: Girondins, ministers, and the Mayor of Paris. Keep a short scrap of paper listing them.\n\n**Where it gets hard.** The whole of it, honestly. The risk is Chapters II, IV, VI and VII, where the narrative scatters and Carlyle's irony over-works. A practical approach is to read Chapters I, III and XII as a spine, dip into IV–VI for the Saint-Domingue pages, the Pilnitz sweep and the Jalès comedy, read VII–IX quickly for the minister-portraits, and read X–XII at full attention as the rush toward war and insurrection begins. The final four chapters regain momentum.\n\n## Book VI: The Marseillese\n\n**Period.** 20 June to 13 August 1792.\n\n**The long version.** Eight chapters, one clear drive, the best-constructed book in the volume after Varennes. \"Executive that does not act\" opens after the Twentieth of June: a sympathy for the King that the King cannot use; Lafayette's visit to the Assembly on 28 June and the thirty guards who answered his call; Pétion's suspension; and the thin streaks of provincial Fédérés wending towards Paris [1, 2.6.I]. \"Let us march\" is the departure of the \"Six Hundred who know how to die\" (Carlyle counts five hundred and seventeen) from Marseilles in early July, and the hymn that becomes theirs (Rouget de Lisle composed it at Strasbourg in April 1792; the federates carried it to Paris, where they arrived on 30 July) [9]; the chapter's tone is of a march about whose members history is silent [1, 2.6.II]. \"Some Consolation to Mankind\" is the second Federation Feast on 14 July, with the King wearing a quilted cuirass under his waistcoat, cries of \"Pétion or Death,\" the proclamation of the Country in Danger on 22 July and the enrolment tents, and then the Brunswick Manifesto [1, 2.6.III]. \"Subterranean\" is the insurrectionary committee at the Golden Sun, the Central Committees of the Fédérés and Sections, the quiet Tuileries cut off by a tricolor ribbon [1, 2.6.IV]. \"At Dinner\" is the Marseillais' arrival on 29–30 July, their dinner at the Blue Dial, and the brawl with the Filles-Saint-Thomas Grenadiers that kills a sub-lieutenant named Duhamel; it ends with the last brilliant Levee on 5 August [1, 2.6.V]. \"The Steeples at Midnight\" is the night of 9–10 August: Mandat's squadrons, the improvised Commune, Mandat murdered on the Townhall steps, the courtiers listening to the bells [1, 2.6.VI]. \"The Swiss\" is the day [1, 2.6.VII]. \"Constitution burst in Pieces\" is its aftermath [1, 2.6.VIII].\n\n**What Carlyle does with it.** The volume returns to the bright sun and open-air collective energy of Book I, only now the energy is violent and has a destination. The Marseillais are, in his phrase, a \"blackbrowed\" \"grim host,\" and he writes the insurrection as an elemental tide (\"like the Ocean-tide\") that no King, \"Canute or Louis,\" can stop [1, 2.6.VII]. His treatment of the Swiss is the most generous passage in the book. The Swiss stand \"peaceable and yet immovable,\" a \"red granite pier\"; when the shooting starts he has three Marseillese cannon fired from the Carrousel by \"a gunner of bad aim,\" and the Swiss answer with a volley. Historians still disagree about who fired first (accounts from the time put the blame in different places), so treat Carlyle's version as one narrative among several [1, 2.6.VII; 7]. His sympathy then breaks out in a direct address: \"Honour to you, brave men; honourable pity, through long times!\" ends with the Lucerne lion. The chapter also has the cameo of the young Napoleon, an onlooker who thinks that the Swiss would have won with a commander [1, 2.6.VII].\n\nThe last chapter, \"Constitution burst in Pieces,\" is less a battle than an inventory of consequences, and it opens on the line \"Thus is the Tenth of August won and lost.\" Carlyle gives it as a day of carnage in the Tuileries (a hundred and eighty bodies piled up, the furniture thrown from windows), as the strange hours of the King and his family boxed into the stenographer's Logographe in the Assembly, as Vergniaud's motion to suspend the King and call a National Convention, as the fall of the statues of kings, as the recall of Roland, Clavière and Danton, who becomes Minister of Justice \"through the breach of Patriot cannon.\" The royal family is moved to the Temple on 13 August; Lafayette's army \"send him thither\" by refusing to follow him, and he flies across the border [1, 2.6.VIII]. The Swiss losses (Carlyle: Patriots reckon their own slain \"by thousand on thousand\" but will reduce them to some twelve hundred) are another number to treat as rhetorical; reference accounts give hundreds of Swiss killed, many after they stopped fighting [7].\n\n**Set-pieces.**\n- *Chapter II, \"Let us march.\"* The marching song's context, the five hundred and seventeen of the Marseilles contingent, and the sense of a body whose motives history will not tell you. A good short chapter for newcomers [1].\n- *Chapter III,* the Brunswick Manifesto summarised at length (Carlyle quotes it as a promise that a \"military execution\" will blast Paris asunder if the King is harmed) followed by a call to console mankind. It is the reason the volume's war-fever tightens [1].\n- *Chapter VI, \"The Steeples at Midnight.\"* The tocsin; the night before. Carlyle at his most rhythmic: the listening courtiers who discriminate the steeple bells, Marat himself pulling the Townhall bell-rope, the Commune improvising itself while the King's sister points the Queen to a beautiful sunrise [1].\n- *Chapter VII, \"The Swiss.\"* The assault on the Tuileries, narrated in rolling scenes from the first sun-rays to the slaughter and the dispersal of the Swiss column.\n- *Chapter VIII, \"Constitution burst in Pieces,\"* for the Logographe scene.\n\n**What you need.** The Brunswick Manifesto (the Allied commander's declaration, dated 25 July 1792, threatening vengeance on Paris if the royal family were harmed) is what turns Parisian anxiety into fury [8]. Carlyle does explain it in VI.III, but at his own pitch, as a rhetorical set-piece, so a plain account beforehand helps. The date matters: it was written in the last week of July, and Carlyle puts the departure of Brunswick's army on the same day.\n\n**Where it gets hard.** The opening chapters (I and III) are low-energy; wait for Chapter II, then go straight through. The hardest thing in Book VI is not difficulty but emotional: the Swiss chapter is bloody, and Carlyle's pity for the dead is as genuine as his certainty that the Revolution cannot be stopped.\n\n## Reading Strategy for the Volume\n\n**Pacing.** Volume II is roughly a third of the whole book; the longest chapters, from the line counts of the printed text, are 2.1.II (Salle de Manége), 2.5.V (Kings and Emigrants), 2.6.VI (The Steeples at Midnight), 2.3.IV (To fly or not to fly) and 2.2.VI (Bouillé at Nanci); the shortest are 2.1.IX (Symbolic), 2.5.X (Pétion-National-Pique), 2.2.I, and 2.6.II [1]. Reading a chapter or two per sitting works better than long sessions.\n\n**The disorienting bit.** Because Volume II contains fewer headline events than either of its neighbours, readers often report a sag in the first half of Book V. This is not a failure of attention; it is the book's shape, and Carlyle's own opinion of the Legislative is the reason.\n\n**What to hold onto.** Four threads run through every book. The Constitution that will not march (its construction in Book I, its mockery in Book V, its end in Book VI). The King and Queen as a failing couple, from the Tuileries of October 1789 to the Logographe box. The slow gathering of the street as a political force, from \"The Muster\" to \"The Swiss.\" And the recurring figures of Mirabeau (alive, then dead and missed), Lafayette (rising in Book I, waning from the Champ-de-Mars, flying in Book VI) and Théroigne, who appears in Volume I, is a prisoner in Austria in 2.4.VIII, speaks at the Jacobins in 2.5.VIII, and stalks the night of 9 August in 2.6.VI.\n\n**What to carry into Volume III.** The September that opens Volume III begins with the \"Improvised Commune\" and Danton; carry in the Commune of 10 August, the Fédérés, the Legislative waiting for the Convention, and Dumouriez commanding the army.\n\n**The check on Carlyle.** His admiration for strength and sincerity makes him unjust to the men who tried to build institutions; his hostility to constitution-making is a thesis, not a finding. A reader who comes away believing the Legislative of 1791 was merely a joke has taken a position from Carlyle, not from the record. His numbers (the dead at Nancy, the Glacière, the Swiss) are the numbers of a rhetorician; his dates are mostly reliable but not always.\n\n## Open Questions\n\n- The exact print pagination of any given chapter varies among editions (the Oxford World's Classics and Centenary Edition are paginated differently from each other and from the Gutenberg text), so this guide gives chapter titles and numbers only. A page-level map would need a chosen edition.\n- The line-count proxy for chapter length is for the Gutenberg text only; word counts would be more exact.\n- Some readers argue Book V is the volume's weakest; others, Book III. This guide's difficulty judgments are critical opinion, not measurement.\n- The casualty figures given by modern accounts for Nancy, the Champ-de-Mars, the Glacière and the Tuileries come from general reference sources and cover a wide range; none rests on a specialist monograph. Treat them as orders of magnitude.\n- Who fired first on 10 August is contested; the Brunswick Manifesto's dating (25 July) and its arrival in Paris are given here from reference sources, not from a monograph.\n- Carlyle's date for the King's signing of the clerical decree (\"January 21st\") does not match the usual dates, and his month count for the Tuileries stay overshoots; whether these are slips or deliberate echoes is a matter of interpretation.\n\n## Sources\n\n1. Carlyle, Thomas. *The French Revolution: A History* (1837). Project Gutenberg eBook #1301, plain-text edition (table of contents and full text of Volume II, Books I to VI, read through). https://www.gutenberg.org/cache/epub/1301/pg1301.txt. Tier 1 (the work itself). Accessed 2026-10-24.\n2. Project Gutenberg catalogue entry for the work. https://www.gutenberg.org/ebooks/1301. Tier 1 (edition metadata); describes a three-volume work.\n3. \"Nancy affair\" and related reference entries, for the date (31 August 1790), the death of Desilles and the range of casualty figures (a few hundred rather than Carlyle's three thousand). https://en.wikipedia.org/wiki/Nancy_affair. Tier 5 (encyclopedia); a reference entry only, so used for orders of magnitude and the date, not detail.\n4. Reference summaries of the Civil Constitution of the Clergy (World History Encyclopedia, https://www.worldhistory.org/Civil_Constitution_of_the_Clergy/, and similar), for the usual dates: passed July 1790, sanctioned August 1790; oath decree passed 27 November, sanctioned 26 December 1790. Tier 5; reference entry only, used for the dates.\n5. Reference accounts of the Champ-de-Mars shooting of 17 July 1791 (World History Encyclopedia timeline and AlphaHistory), giving estimates from about a dozen to about fifty dead and describing the numbers as uncertain. https://www.worldhistory.org/timeline/Champ_de_Mars_Massacre. Tier 5; reference entry only, used for the dates.\n6. \"Massacres of La Glacière\" (Avignon, 16–17 October 1791) and a French departmental-archive article, both giving about sixty victims. https://en.wikipedia.org/wiki/Massacres_of_La_Glaci%C3%A8re. Tier 5; reference entry only, used for the dates.\n7. Roy Rosenzweig Center for History and New Media, *Liberty, Equality, Fraternity* (revolution.chnm.org), documents on the journée of 10 August 1792, for the dispute over who fired first. https://www.revolution.chnm.org/d/428. Tier 3 (scholarly document collection); used only to show that the question is disputed.\n8. Reference entries on the Brunswick Manifesto (dated 25 July 1792; widely said to have intensified the radicalisation of the summer). https://en.wikipedia.org/wiki/Brunswick_Manifesto. Tier 5; reference entry only, used for the dates.\n9. Assemblée nationale (France), \"La Marseillaise : hymne national,\" for the composition at Strasbourg in April 1792 and the Marseille federates' arrival in Paris on 30 July 1792. https://www2.assemblee-nationale.fr/decouvrir-l-assemblee/histoire/dossier-historique-la-marseillaise/la-marseillaise-hymne-national. Tier 2 (institutional); used for the dates only."}, {"order": 4, "file": "04_Volume_III_The_Guillotine.md", "title": "Volume III, The Guillotine: A Reader's Guide, Book by Book", "summary": "A chapter-by-chapter map of Carlyle's final volume (Books I-VII, August 1792 to October 1795), with the set-pieces worth stopping for, the places the prose turns hard, and a reading of the last pages.", "body": "# Volume III, The Guillotine: A Reader's Guide, Book by Book\n\n## Bottom Line\n\nThe third volume is the one people remember and the one fewest people finish with their bearings intact. It runs from the weeks after the fall of the monarchy in August 1792 to the cannon in front of the Tuileries on 5 October 1795, and in that stretch Carlyle stops being a narrator of events and becomes something closer to a prosecutor, a mourner and a prophet in rotation. Read it as seven movements, each with one or two chapters built to be re-read, and be willing to skim the connective tissue between them. The volume is organized by set-piece, not by chain of cause, and several of its chapters are best understood as essays that happen to be about a month in 1793.\n\nThe volume has seven books and fifty-five chapters. The whole work has twenty books (seven in the first volume, six in the second, seven in the third) and 159 chapters (50, 54 and 55), so this volume is the longest by chapter count but not the most tangled.\n\n## The Map\n\nThe table is taken from the contents page and the chapter headings of the Project Gutenberg text (#1301) [1]. Every book and chapter title in the contents matches the heading printed above the chapter in the body of the text, all fifty-five of them. The chapter counts per book are 8, 8, 9, 8, 7, 7 and 8. Dates are the historical record's, not Carlyle's, who prefers to give you the Revolutionary calendar and let you do the arithmetic.\n\n| Book | Title | Roughly | Chapters |\n| --- | --- | --- | --- |\n| 3.I | September | Aug.-Sept. 1792 | The Improvised Commune; Danton; Dumouriez; September in Paris; A Trilogy; The Circular; September in Argonne; Exeunt |\n| 3.II | Regicide | Sept. 1792-Jan. 1793 | The Deliberative; The Executive; Discrowned; The Loser Pays; Stretching of Formulas; At the Bar; The Three Votings; Place de la Révolution |\n| 3.III | The Girondins | Jan.-June 1793 | Cause and Effect; Culottic and Sansculottic; Growing Shrill; Fatherland in Danger; Sansculottism Accoutred; The Traitor; In Fight; In Death-Grips; Extinct |\n| 3.IV | Terror | June-Oct. 1793 | Charlotte Corday; In Civil War; Retreat of the Eleven; O Nature; Sword of Sharpness; Risen against Tyrants; Marie-Antoinette; The Twenty-two |\n| 3.V | Terror the Order of the Day | Nov. 1793-spring 1794 | Rushing down; Death; Destruction; Carmagnole complete; Like a Thunder-Cloud; Do thy Duty; Flame-Picture |\n| 3.VI | Thermidor | Spring-July 1794
