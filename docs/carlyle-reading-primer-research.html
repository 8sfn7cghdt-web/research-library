| The Gods are athirst; Danton, No Weakness; The Tumbrils; Mumbo-Jumbo; The Prisons; To Finish the Terror; Go Down to |\n| 3.VII | Vendémiaire | July 1794-Oct. 1795 | Decadent; La Cabarus; Quiberon; Lion not Dead; Lion Sprawling its Last; Grilled Herrings; The Whiff of Grapeshot; Finis |\n\nTwo things are worth noticing before you open the volume. First, the book titles are mostly names of months, factions or acts (September, Regicide, Thermidor, Vendémiaire), which tells you he is organizing by crisis rather than by theme. Second, the chapter titles do a good deal of the interpretive work: \"Stretching of Formulas,\" \"Culottic and Sansculottic,\" \"Mumbo-Jumbo,\" \"Grilled Herrings.\" If you read only the contents page you already have his argument in compressed form.\n\nA housekeeping note on the numbering. Gutenberg prints the books as \"3.I,\" \"3.II\" and so on and the chapters as \"3.1.I,\" \"3.1.II,\" and this guide uses that scheme so that you can find a chapter by searching the text. The Gutenberg file does not say which printing it was transcribed from. The recent Oxford World's Classics edition (Sorensen, Kinser and Engel) is described by its publisher as a critical text using the 1837 first edition as its copy-text, collated against later editions Carlyle revised in his lifetime [2]. That edition's note on the text was not available for this guide, so whether every book and chapter division here matches the 1837 printing is unconfirmed; the safest statement is that this is the standard division found in the text in circulation. If you need to cite a chapter, cite it by book and chapter title, which will survive any edition.\n\nThe volume opens with a German epigraph from Goethe, four lines about the self-styled apostles of freedom, ending with the advice that if you would liberate many you must dare to serve many [1]. It is a small thing, but it is the volume's thesis in advance: Carlyle distrusts liberty talked about and trusts service performed.\n\n## What to Know Before You Start\n\nVolume III assumes you have survived Volume II, so the assumptions are heavy. You need to know that the monarchy fell on the Tenth of August 1792 and that the royal family sits in the Temple prison; that France is at war with Austria and Prussia and is losing; that a new National Convention is about to meet; and that the parties you are about to watch destroy one another (Girondins, the Mountain, Jacobins, Cordeliers) are not parties in the modern sense but clusters of men who often dined together a year earlier. If any of that is hazy, a chapter-length refresher from any standard history is worth the twenty minutes. Carlyle will not provide it.\n\nYou also need to know his habits of address, which by now you have either accepted or abandoned. He narrates in the present tense, addresses the Reader and the dead directly, gives people epithets that stick (the seagreen Robespierre, the Advocate of Arras, Samson the executioner), and treats every large event as a weather system. What changes in Volume III is the pitch. The early volumes can be ironic about a tottering Old Regime; here the irony curdles into horror and the horror into a kind of pity, and the prose develops long stretches in which nothing is explained and everything is conjured. For the idiom itself, see the decoder in this primer's chapter on reading Carlylese.\n\nFinally, know the footnotes exist. The Gutenberg edition carries numbered notes running to 787 by the end of the volume, and the ones sampled are bare source citations: the Moniteur, the Histoire parlementaire, memoirs of Mercier, Meillan, Genlis, Dumouriez [1]. You do not need them to follow the story. You do want them if you wish to see how often a set-piece rests on a single memoirist. The note to the Cagliostro prophecy in the last chapter is a good example of a different kind: it points not to a source but to Carlyle's own essay \"The Diamond Necklace,\" which means the prophecy is a piece of his own invention revisited, not a recovered document [1].\n\n## Book I: September\n\n**What it covers.** The weeks after the fall of the monarchy: the Paris Commune seizing the machinery of the capital, Danton as Minister of Justice rallying the city against the invasion, the fall of Verdun, the prison killings of the first days of September, and then, in the same stretch, the cannonade at Valmy on 20 September and the first sitting of the Convention [1].\n\n**What Carlyle does with it.** He puts the massacres and the war in the same book on purpose. \"September in Paris\" and \"September in Argonne\" are twin chapters: the one shows a city killing its prisoners out of terror, the other the army that is the reason for the terror holding the line on the frontier. You are meant to feel the two as a single pulse. He does not defend the killings, but he refuses the easy distance of the historian who treats them as an aberration. \"A Trilogy\" lets three eyewitnesses speak, one after another (Jourgniac, the Abbé Sicard, the advocate Maton), and Carlyle's introduction to it is a small manifesto of method: delineation, however epic, must rest on belief and provable fact, so let the reader see through the eyes of those who were there [1]. Then he mostly gets out of the way.\n\n**Set-pieces not to miss.**\n- *Danton* (3.1.II). The first full portrait of the man who will be the volume's tragic counterweight to Robespierre. In it Danton demands, and gets, the decree authorizing \"domiciliary visits\" to search for arms and to seize and imprison suspects, with two thousand stand of arms and some four hundred new prisoners taken in a single night [1]. That decree is the legal seed of what follows. Read it for the pairing of energy with something loose in the moral machinery.\n- *September in Paris* (3.1.IV). The rumor of Verdun's fall arrives before the fall itself; the city's logic of fear sets in. This is the chapter people quote against Carlyle and for him, depending on what they want.\n- *Exeunt* (3.1.VIII). A tidy hinge. While Kellermann's horse is shot from under him at the mill of Valmy, the newly elected deputies gather to constitute themselves, and on the next day the old Legislative Assembly comes over to merge into the National Convention [1].\n\n**What you should have in mind.** The massacres are narrated with a refusal to look away and a refusal to indict a single villain. If you are expecting moral clarity in the modern sense, you will be disappointed; if you are expecting spectacle, you will be satisfied.\n\n**Where it gets hard.** The two middle chapters, 3.1.V \"A Trilogy\" and 3.1.VI \"The Circular,\" carry long stretches of quoted testimony and the circular letter that the Commune sent to the provinces. They are essential documents and slow reading. Keep the witnesses, skim the letter.\n\n## Book II: Regicide\n\n**What it covers.** The Convention's opening months, the quarrel over September, the questions of the armies, of bread and of the dethroned king, and above all the trial of Louis XVI, ending with his execution on 21 January 1793 [1][3].\n\n**What Carlyle does with it.** The book begins with an image of France looking upon Democracy face to face and being burned, like the nymph Semele who insisted on seeing her god as he truly was [1]. That sets the register: not a legal narrative but a mythic one. He then does something that distinguishes him from most historians of the trial. He treats the argument over procedure (can a king be tried at all, and by whom, and with what appeal) as comedy and tragedy at once. \"Stretching of Formulas\" is the chapter where the Convention discovers that none of its inherited forms fits the act it has decided on; the title is the argument.\n\nNotice also the structure: the book alternates between the Convention's floor and the war outside. \"The Loser Pays\" opens on 6 November 1792, a great day \"outwardly, over the Frontiers; inwardly, in the Salle de Manége,\" with Dumouriez winning at Jemappes while the Convention argues at home [1]. Victory abroad, panic and ruthlessness at home: the pairing recurs through the rest of the volume.\n\n**Set-pieces not to miss.**\n- *At the Bar* (3.2.VI). The king's journey on Tuesday, 11 December, in the green carriage of Mayor Chambon through dull drizzling weather, under guard of Santerre's cannon, cavalry and a double row of infantry, to be indicted before the Convention [1]. Carlyle does the staging by street and weather.\n- *The Three Votings* (3.2.VII). The three questions put to the Convention (guilt; whether the sentence needs ratifying by appeal to the people; the penalty) and the roll call that answers them, deputy by deputy [1]. This is the best place in the volume to see his gift for making a procedure into a drama.\n- *Place de la Révolution* (3.2.VIII). The execution chapter. It opens on the king as a man caught in the old machine of law that has wasted innumerable lives, and the Irish confessor, the Abbé Edgeworth, arrives in it [1]. Carlyle pities and indicts at once. Read it all the way through, and then read the closing pages of the book, where he describes how the killing of the king divides friends at home and unites enemies abroad, England giving the French ambassador's cloak, Chauvelin, eight days to leave, and the great war beginning [1].\n\n**What you should have in mind.** Carlyle is neither a royalist nor a regicide. He regards the king's death as the consequence of a long accumulation of injustice that finally came home, and he insists, in the same breath, that suffering is suffering, whoever the sufferer. A reader who wants him to pick a side will find him unsatisfying here.\n\n**Where it gets hard.** The middle of the book (3.2.II \"The Executive,\" 3.2.III \"Discrowned\") is parliamentary maneuvering: factions, motions, the names of departments and deputies. He keeps the pace up with images, but there are a lot of names. Do not try to keep every deputy straight. Track the three or four who will matter again (Robespierre, Danton, the Girondins as a body, Marat) and let the rest be weather.\n\n## Book III: The Girondins\n\n**What it covers.** The slow collapse of the moderate republican faction under pressure from the Mountain, the sections of Paris, famine and military defeat, culminating in the insurrection of 31 May 1793 and the expulsion of the Girondin leaders from the Convention in early June [1].\n\n**What Carlyle does with it.** This is the book where he sets out his sociology, and it is the one most likely to be mistaken for a mere factional chronicle. It is, more exactly, nine short chapters of which several are essays and several are narrative, and it helps to know which is which.\n\n*Cause and Effect* (3.3.I) asks whether the volcanic flood loosed by the Revolution will flow according to the formulas of the educated, monied, respectable class, or will make its own course. A passage in it states Carlyle's view of what the Revolution was for: hunger and nakedness among twenty-five million people, not the wounded vanities of philosophical advocates, were its prime mover; the feudal fleur-de-lys had become an insupportable banner, but the \"Moneybag of Mammon\" that the respectable middle-class republic would raise is a worse one [1]. Hold on to that sentence; it comes back in the last book.\n\n*Culottic and Sansculottic* (3.3.II) sets the weapons of the two sides against each other. The Girondins have political philosophy, respectability and eloquence and carry the departments and the readers of parliamentary debates; the Mountain has audacity and impetuosity and carries the indigent millions of Paris. Carlyle calls the Girondins \"the Jesuits of the Revolution\" only to say that the name is too hard, and he is blunt that their tone toward \"our poorer brethren\" is patronizing [1]. That is a verdict, and a debatable one; hold it at arm's length.\n\n*Growing Shrill* (3.3.III) is a gallery. The Girondins prod two sore places in the Mountain, Marat and the Duke of Orléans, now \"Egalité\"; there is a pitiful scene of Orléans taking leave of Madame de Genlis and his daughter from Genlis's memoirs; then two peacemakers, Barrère (\"Anacreon of the Guillotine,\" in Burke's phrase, a supple master of \"the Art of Varnish\") and Danton, who is loved by the Mountain and distrusted by the Girondins because \"there rests on him a shadow of September.\" It ends with the Girondins' own shrillness, Louvet, Barbaroux, the silent wife of Roland, and with the image of the magician's apprentice who summons a goblin to fetch water and cannot stop it [1].\n\n*Fatherland in Danger* (3.3.IV) says outright that the parties might have throttled each other in the ordinary bloodless parliamentary way if France had been able to exist meanwhile, but that the people need bread and the armies lost their victories in the spring [1]. *The Traitor* (3.3.VI) is the defection of Dumouriez, the hero of Valmy and Jemappes: a general with a fugitive army and a pretender in his pocket, and the question whether the Revolution is a prodigy or a counter-revolution waiting to happen [1].\n\n*Sansculottism Accoutred* (3.3.V), is the most useful chapter in the book for a student of institutions. Carlyle takes inventory of the machinery the Mountain builds in the spring of 1793: the revolutionary committees in every township, some forty-four thousand of them, with their house-door lists and cards of civic virtue; the Extraordinary Tribunal that will become the Revolutionary Tribunal, \"a Sword of Sharpness\"; the Committee of Public Salvation, founded at the end of March with nine members, \"an insignificant-looking thing at first,\" soon to reduce the Convention to obedience; the Law of the Maximum on the price of grain; and the progressive taxes and forced loan. The chapter ends on the line that this is \"not a Republic of the Virtues\" but \"a Republic of the Strengths\" [1]. If you want one chapter to understand why the Terror had institutions, this is it.\n\n*In Fight* (3.3.VII), is the chronicle of the break. On 1 April the Girondin Lasource insinuates that Danton was an accomplice of Dumouriez; Danton, \"like a lava-flood,\" answers that there is no peace possible with these men and that the Republic will be saved without them. Then on 11 April the Girondin Duperret draws a sword in the hall; the Girondins vote to send Marat before the Revolutionary Tribunal; and Carlyle closes on the phrase \"war without truce or treaty\" and the image of Formula and Reality \"in death-grips\" [1].\n\n**Set-pieces not to miss.**\n- *In Death-Grips* (3.3.VIII). The six-week wrestle. It records the Convention's move on the Tenth of May from the old Salle de Manége into the new hall in the Tuileries, Marat's acquittal and chairing through the streets on 24 April, the Commission of Twelve and its arrests of Hébert and of Varlet, and the fate of Théroigne de Méricourt, attacked by furious women in the Tuileries garden and soon in a madhouse [1].\n- *Extinct* (3.3.IX). The Thirty-first of May. Mayor Pache comes to the Convention to report that in the grey of the morning some ninety-six persons entered the Townhall, as on the Tenth of August, declared themselves commissioners of the sections in a state of insurrection, and dismissed the municipality, which was then reinstated by the same \"Sovereign\" [1]. The Girondin end is rendered as ritual, not victory.\n- *The Traitor* (3.3.VI), for how fast and how coldly Carlyle writes treachery.\n\n**Where it gets hard.** Book III has the most names per page in the volume, and the Girondin side is hard to love. The chapters not to skip are the first, the fifth and the last, because they carry the ideas. The gallery chapters can be read lightly.\n\n## Book IV: Terror\n\n**What it covers.** Summer and autumn 1793: the provincial revolt of the proscribed Girondins at Caen, Charlotte Corday's assassination of Marat, the civil war at Lyons and Marseilles, the festival of the new Constitution on 10 August, the levy in mass, the trial and execution of Marie-Antoinette in October, and the trial of the twenty-two Girondin deputies [1].\n\n**What Carlyle does with it.** This is the volume's pivot, and he knows it. He gives the Terror its own book heading here and a second one (\"Terror the Order of the Day\") in Book V. The pivot is an act of a young woman, and he writes it with something very like tenderness.\n\n**Set-pieces not to miss.**\n- *Charlotte Corday* (3.4.I). Unmissable. It opens with the Girondin fugitives gathering at Caen and printing their own bulletin, narrows to the woman who will answer them (leaving Caen on Tuesday, 9 July, in the text's own dating), and ends with her trial and death in Paris; the stabbing of Marat in his bath falls on \"the thirteenth of the month\" [1]. The standard reference accounts date the assassination to 13 July and her execution to 17 July 1793, which matches the text [3]. Read it twice: once for narrative, once to see how Carlyle stages the assassin as the only character in the volume who acts from clean motive. Its last lines mourn \"the Beautiful and the Squalid,\" mutually extinctive, and mention Adam Lux, who proposed a statue to her inscribed \"Greater than Brutus\" [1].\n- *Marie-Antoinette* (3.4.VII). It begins by naming the court, the date (Monday, the Fourteenth of October 1793) and the judge, and then says that only silence is adequate to such changes of human fortune [1]. Short, restrained, and one of the most affecting chapters in the book. A good contrast to Carlyle's loudest manner.\n- *O Nature* (3.4.IV). The festival of the Constitution on the Tenth of August 1793, a new Feast of Pikes, with David's pageant and a statue of Nature spouting water from her breasts on the ruins of the Bastille [1]. Easy to read as pageant; harder to see that he is already showing how quickly a revolution turns its own founding into ceremony.\n\n**The chapters between.** These are easy to dismiss as filler, and they are not.\n- *In Civil War* (3.4.II) is Lyons and the South: the Girondin party's rule at Lyons, the execution of the Jacobin Chalier the day after Corday's, Marseilles marching, and a first glimpse of an artillery major named Napoleon Buonaparte fighting under General Cartaux and publishing a dialogue, *The Supper of Beaucaire* [1].\n- *Retreat of the Eleven* (3.4.III) is not a military chapter at all. It follows the Girondin fugitives on their march from Caen toward Bordeaux and the sea, losing the road, sleeping in straw, and hiding in the woods at Quimper, from Louvet's account of the itinerary. (The chapter title says Eleven; the text itself speaks of \"the Twelve\" along the way.) It also records the ruin of Buzot's house, the arrest of Brissot at Moulins, and the siege losses of Mainz and Valenciennes, with Goethe's account of the French garrison marching out of Mainz [1].\n- *Sword of Sharpness* (3.4.V) takes stock of the whole war: Vendée burning, the Coalition pouring in, Toulon surrendering to the English, and the great explosion at Lyons [1].\n- *Risen against Tyrants* (3.4.VI) is the levy in mass of 23 August, with Barrère's \"the Republic is one vast besieged city,\" the Law of the Forty Sous, and Danton's line that they will \"burn France to ashes\" rather than yield; it is worth reading for the banner \"The French People risen against Tyrants\" [1].\n- *The Twenty-two* (3.4.VIII) is the trial and execution of the Girondin deputies, on the night of 30 October and the morning of the 31st [1][3].\n\n## Book V: Terror the Order of the Day\n\n**What it covers.** The Terror at full machine speed, November 1793 to early spring 1794: the death of Philippe Égalité and of Bailly, Barnave and Madame Roland, the repression in the south and west, the dechristianization campaign and the new calendar, the mobilization of the whole country, and the strange hopes and inventions of the winter [1].\n\n**What Carlyle does with it.** He does the thing for which readers either love or resent him: he refuses to narrate it in sequence. The first chapter (\"Rushing down\") announces that the whole thing has arrived at a black precipice where all tends to fall together. Then the book proceeds as a set of aspects. \"Destruction\" is the \"Tophet-black\" one (the Revolutionary Army under Ronsin, the drownings and shootings at Nantes under Carrier, Tallien at Bordeaux). \"Carmagnole complete\" is the \"Tophet-red\" one, the destruction of the Catholic religion. \"Like a Thunder-Cloud\" is what he calls the \"primary and generic aspect,\" the one he says history has overlooked: the mobilization of an entire nation, with fourteen armies on foot and Carnot \"organising victory\" [1]. \"Do thy Duty\" is the forge and the foundry. \"Flame-Picture\" is the collective portrait, and the place where the inventor's telegraph on the heights of Ecouen and the school and decimal projects of the Convention appear beside the guillotine.\n\nThis arrangement is a real argument. It insists that the Terror had two faces, one of killing and one of making, and that the French armies' victories at the frontiers are inseparable from the guillotine at home. Readers will differ on whether that is brilliant or an alibi.\n\n**Set-pieces not to miss.**\n- *Death* (3.5.II). Opens with the last journey of Philippe, Duke of Orléans, who took the name Égalité and voted for the king's death, arriving in Paris on 3 November 1793, the same day Madame du Barry and Josephine de Beauharnais are imprisoned. The chapter goes on to the deaths of Madame Roland, Bailly and Barnave [1]. \"Iscariot Egalité\" appears much later, in the Cagliostro vision of the last chapter, where he is flung into the sea of fire; the Duke is given a tragic cadence here and a damning epithet there.\n- *Like a Thunder-Cloud* (3.5.V). The national mobilization. If you read only one chapter from Book V, take this one; it is where Carlyle's anti-liberal admiration for energy is most open.\n- *Carmagnole complete* (3.5.IV). The dechristianization chapter, opening with Mercier's observation that on Corpus Christi Day 1792 the whole world, authority included, walked in religious gala, and that eighteen months later the altar is gone [1].\n\n**Where it gets hard.** This is the book where the reader's patience is tested by repetition: lists of decrees and dismantled things, the proliferation of festivals and renamings. It is deliberate; the weight is in the piling up. Read it in long sittings, or not at all.\n\n## Book VI: Thermidor\n\n**What it covers.** The last spring and summer of the Terror, from the destruction of the Hébertists and the Dantonists in March and April 1794, through the Festival of the Supreme Being on 8 June (20 Prairial), the Great Terror of June and July, and the coup of 9 Thermidor (27 July 1794) that brings down Robespierre [1][3].\n\n**What Carlyle does with it.** He writes it as tragedy with a pair of protagonists. The opening chapter (\"The Gods are athirst\") is a meditation on what \"La Révolution\" is: not an entity but \"the Madness that dwells in the hearts of men,\" invisible, impalpable, and yet \"a truer Reality\" than a black angel of death with wings over half a continent [1]. \"Danton, No Weakness\" then sets the two chief products of a victorious Revolution face to face and renders the incompatibility between them through the seagreen \"Formula\" looking with feminine terror at the colossal \"Reality\" and growing greener to behold him. Hear in this Carlyle's lasting preference, which he does not hide, for the man who acts out of nature over the man who acts out of principle, even when principle is sincere.\n\nThe book's moral turn comes at the end, in the portrait of Robespierre after his execution. Carlyle is hard on him throughout (the vanity, the frizzled hair, the seagreen busts in his room, the Formulas) and then, at the foot of the scaffold, gives him one of the most unexpected paragraphs in the volume: \"O unhappiest Advocate of Arras, wert thou worse than other Advocates?\" A stricter man to his creed there was not in that age, and his landlord the cabinet-maker loved him. It closes: \"May God be merciful to him, and to us\" [1]. It declines both the demonization and the rehabilitation.\n\n**Set-pieces not to miss.**\n- *The Tumbrils* (3.6.III). Opens a week after Danton's death, on 10 April: \"a new Nineteen,\" including Chaumette, Gobel, Hébert's widow and the widow of Camille Desmoulins, rolling to the guillotine. Hébert's widow weeps; Camille's widow tries to comfort her [1]. Danton's own end sits in the chapter before this one, which is the preparation.\n- *Mumbo-Jumbo* (3.6.IV). The Festival of the Supreme Being in the Tuileries garden on the Décadi, 20 Prairial (8 June), with Robespierre as President of the Convention in a sky-blue coat made for the occasion. Carlyle sets the African Mumbo-Jumbo of the woods beside Robespierre's \"new Deity\" and finds the African one \"venerable,\" because the Parisian one is a conscious Mumbo-Jumbo that knows he is machinery [1]. It is the book's cruellest and funniest chapter, and it shows what a Cult of Virtue looks like to a Calvinist-bred skeptic of cant.\n- *Go Down to* (3.6.VII). The Ninth of Thermidor: Tallien's squeeze of the hand and his words to the Convention, Saint-Just's report cut short by interruption, the long night, Robespierre sitting with his lower jaw shattered by a pistol that failed to kill him, the mangled jaw bound in bloody linen, and the cart to the scaffold [1]. The chapter's title is the curse a woman in the crowd hurls at him from the side of the tumbril: \"go down to Hell, with the curses of all wives and mothers.\" Carlyle places the fall on 9 Thermidor, \"27th of July, 1794,\" and the executions on the next day, 10 Thermidor, the 28th [1]; this agrees with the reference accounts [3].\n- *The Prisons* (3.6.V). A more subdued chapter, and an important one: twelve Houses of Arrest in Paris, which held five thousand when Desmoulins moved for a Committee of Mercy and held twelve thousand by Carlyle's count, in conditions he describes as unequalled in squalor and also as strangely sociable [1].\n\n**Where it gets hard.** The knottiest chapter is \"To Finish the Terror\" (3.6.VI), which tracks the plotting inside the Committees: Robespierre withdrawing from the Committee, the satirical report on the prophetess Catherine Théot, the imprisoned Madame de Fontenay (born Cabarrus) and Tallien's fear for her. It is a tangle of rumor, and the reader who loses the thread is in good company. It pays off only if you read \"Go Down to\" straight after.\n\n## Book VII: Vendémiaire\n\n**What it covers.** The aftermath: the Thermidorian reaction, the Jeunesse Dorée, the end of the Jacobin Club, the military triumphs and the Quiberon landing, the bread riots of Germinal and the insurrection of the Sections that ends on 13 Vendémiaire (5 October 1795) under the guns of a young general named Buonaparte [1][4].\n\n**What Carlyle does with it.** He writes the epilogue as a decline, and his title for the first chapter, \"Decadent,\" tells you the tone, though the chapter itself is a surprising one. It argues that Robespierre's death was the keystone of the whole arch of Sansculottism, not only of a man, and that once he fell great multitudes saw one another for the first time and the nation \"resolves itself into a Committee of Mercy\": public opinion, not any statesman, ended the Terror. It reports the first acts of the Thermidorian Convention: the Committees to be renewed by a quarter each month, and a right to know the accusation, which leaves Fouquier's trade \"effectual only against Robespierre's Tail\" [1].\n\nThree middle chapters carry the book's argument about what replaced the Terror.\n\n*La Cabarus* (3.7.II) is the best social history in the volume. The Convention, \"broken, bewildered by long terror,\" has no pilot and not even a Danton, and \"all Sansculottic things are passing away; all things are becoming Culottic.\" Carlyle reads it off the clothes: red nightcaps give way to Greek tunics and sandals, \"Victim Balls\" in which you could only dance if you had lost a relative to the Terror, the *Merveilleuses* in flesh-coloured drawers from Mercier's account, and the *Muscadins* or \"Gilt Youth\" with lead-loaded clubs. At the center is Thérésa Cabarrus, released from prison and now married to Tallien, with Josephine de Beauharnais at her side, and in the room a thin, taciturn, ill-favoured artillery officer from Toulon looking into \"a future as waste as the most.\" Dancing, the chapter says, is one of the forms of mourning [1].\n\n*Quiberon* (3.7.III) is not mainly about Quiberon. It is about the army. The Republic that is \"abhorrent of her Guillotine, loves her Army\"; Pichegru's men overrun a frozen Holland in straw-rope shoes; Spain and Prussia make peace at Basel; Hoche pacifies the Vendée at the cost, as they reckon in round numbers, of a hundred thousand lives. Carlyle then pauses over his famous contrast between the quick \"Gaelic fire,\" which burns dry jungle and is \"admirable for roasting eggs,\" and the \"Teutonic\" fire of anthracite coal, \"preferable for smelting metals,\" a passage that tells you a good deal about his politics. The royalist landing at Quiberon in July 1795 and its defeat at Fort Penthièvre come in last, with the death of the young Sombreuil [1].\n\n*Lion not Dead* (3.7.IV) takes the dismantling to the Jacobins. Marat's body is moved into the Pantheon, and four months later is thrown into the Montmartre sewer; Billaud says \"the lion is not dead, he is only sleeping\"; on Hallow-eve the Gilt Youth stone the Jacobin hall and the club is suspended for good, its hall becoming a market for poultry and greens. The Maximum is abolished and the assignat collapses (a hackney-coachman asks six thousand livres). Then the cry goes up on 12 Germinal, \"Bread, and the Constitution of Ninety-three,\" and Pichegru ends the riot with two blank cannon-shots and the line \"Representatives, your decrees are executed\" [1]. The sentence that sums up the chapter is Carlyle's: it was for \"the Cabarus,\" her Muscadins and money-changers, then, that we fought?\n\n**Set-pieces not to miss.**\n- *The Whiff of Grapeshot* (3.7.VII). The big one. It begins as a meditation on the Moneybag: after the \"Aristocracy of Feudal Parchment\" comes the \"Aristocracy of the Moneybag,\" \"the basest yet known,\" and Carlyle calls on the generous heart of every age to refuse Mammon [1]. This is the passage that most clearly links the book to the England in which he wrote, and it is the same argument first stated in \"Cause and Effect.\" Then it turns into an hour-by-hour account of the Thirteenth of Vendémiaire (the fifth of October, he notes, the anniversary of the women's march to Versailles): the Convention in permanent session, the sections of Paris in arms, the ship of state labouring on the bar, the cannon at Saint-Roch, and the ship over the bar to the sound of vivats [1]. The phrase \"whiff of grapeshot\" is not new here: it first appears in Volume I, where the war-god Broglie is said to have it in reserve for the Paris crowd in July 1789 and does not use it, and the chapter's closing lines pick it up as a payoff six years later. A reference article on the day says Carlyle probably coined the phrase [1][4].\n- *Lion Sprawling its Last* (3.7.V). Carrier goes to the guillotine in December; the Revolutionary Tribunal, which has \"only, as Anarchic things do, to devour itself,\" sees Fouquier-Tinville and his jurors plead at the bar once his own [1]. A short, bitter chapter.\n- *Grilled Herrings* (3.7.VI). The funeral of Sansculottism, delivered as black comedy: \"Sansculottism is dead,\" its dance transformed into a dance of Cabarus Balls, yet its soul lives on in changed shape [1].\n\n**Where it gets hard.** Not very; Book VII is the most readable in the volume. The caution is the opposite one: it moves quickly across eighteen months, and the reader who wants the Convention's politics of 1794-95 in detail (the Thermidorians, the Constitution of Year III) will need another book. Carlyle gives them a few paragraphs because he is interested in what they feel like, not how they work.\n\n## How the Book Ends\n\nThe last chapter is a few short paragraphs, titled \"Finis,\" and it does something you may not expect. It does not conclude the Revolution; it declines to [1].\n\nThe first move is the epic comparison. Homer's Epos, he says, \"does not conclude, but merely ceases,\" like a bas-relief, and so does the epos of universal history. He then fast-forwards: Directorates, Consulates, Emperorships, Restorations and Citizen-Kingships succeed in due series; there will be a Babeuf insurrection \"next year\" that dies in the birth, an Eighteenth of Fructidor accomplished by the mere show of bayonets, an Eighteenth of Brumaire; and such changes will henceforth be managed by intrigue and word of command, not by sacred right of insurrection [1].\n\nThe second move is a tally, grudging and honest. The Directorate began with an old table, a sheet of paper and an ink-bottle and did wonders; France has been a new France since the Terror hushed, awakened like a giant, and has gone on making internal progress. In its external forms nothing has been replaced: Shams are burnt up, and even their Cant, but the new Realities are not yet come, only Phantasms and tentative prefigurements. France now has four million landed properties, the \"black portent of an Agrarian Law\" realised, and all Frenchmen have the right of duel, so that the hackney-coachman may call out the peer. The form of government is a Citizen King, frequently shot at, not yet shot [1].\n\nThe third move is the vision. Carlyle puts a prophecy into the mouth of Cagliostro, the Archquack of the earlier volumes, and calls it fulfilled \"ex-postfacto indeed.\" The Empire of Imposture bursts into flames; thrones, mitres, Prebendal stalls, and \"all the Gigs of Creation,\" his emblem of Respectability, are hurled into a sea of fire, and the world is black ashes, \"which, ah, when will they grow green?\" The question he poses to the reader is whether the prophecy has been fulfilled, or is fulfilling. The tense is the point: it is still burning [1].\n\nThe last move is the farewell, and it is the one to read slowly. \"O Reader, the time has come for us two to part.\" To him the reader was \"a beloved shade,\" the not yet embodied spirit of a brother; to the reader he was only \"a Voice.\" And he ends by saying that so long as the voice of man speaks with man, the fountain from which all sacred things sprang is still there to spring again, that man is \"an incarnated Word,\" and that if he has spoken falsely, the reader's part was to hear truly. \"Farewell\" [1].\n\nWhat are the last pages doing? Three things at once. They deny closure: the Revolution is not over, it is an unfinished conflagration, and the century that follows is the afterglow. They bring the book's two organizing metaphors, fire and the Word, into the same sentence, so that burning and speaking are revealed as one act. And they put the reader on the hook. The farewell is not decoration; it is the claim that history is a conversation between the living and the dead, and that a reader who has followed through the volume has done the labor of the dead's attention. It is a very Carlylean ending, which means it is a sermon, and one of the finest in English prose.\n\n## Reading Strategy for the Volume\n\nIf you have limited time, read these chapters first and fill in the rest around them: 3.2.VI to 3.2.VIII (the king); 3.3.V (the machinery of the Terror, if you want its institutions); 3.4.I (Corday) and 3.4.VII (the Queen); 3.5.V (the national mobilization); 3.6.II, 3.6.IV and 3.6.VII (Danton and Robespierre, the festival, Thermidor); 3.7.II (the Cabarus), 3.7.VII and 3.7.VIII (grapeshot and farewell). That path takes about a third of the volume and gives you its best prose and its argument.\n\nIf you read the whole, expect the energy to dip in Book III, to concentrate in Book VI, and to spike once more at the end. Expect to lose track of names and not to mind. Carlyle's own advice, in effect, is to stay with the weather and trust the faces to surface as they need to.\n\n## Open Questions\n\n- Whether the book and chapter divisions in the Gutenberg text are identical to those of the 1837 first edition is not settled here. The titles agree with the standard contents list, the Gutenberg file does not name its source printing, and the Oxford edition's publisher describes its text as a critical text with the 1837 edition as copy-text, but its note on the text was not available here. Anyone who needs to quote the 1837 divisions exactly should check a printed copy.\n- The dates in this guide come in two groups. Those the text itself gives (the king's trial on 11 December 1792, the king's death on 21 January 1793, Corday's departure on 9 July and Marat's death on the thirteenth, the Queen's trial on 14 October 1793, 9 Thermidor as 27 July 1794, 13 Vendémiaire as 5 October 1795) were read directly. The remaining dates (Corday's execution on 17 July, the Queen's execution on 16 October, the Girondins' on 31 October) come from reference summaries of the period rather than from a close reading of the specialist histories by Doyle or Tackett, which would be the next place to look.\n- Carlyle's version of the Terror's chapters is a single narrator's reading of memoirists. A reader who wants to measure it against modern scholarship, for instance on the death toll of the September massacres or of the Vendée, should consult a specialist history. His own figure for the Vendée, \"a Hundred Thousand fellow-mortals,\" is a round number he attributes to others.\n- The footnotes have not been traced chapter by chapter, so how far a given set-piece depends on one memoirist remains open for most chapters.\n\n## Sources\n\n1. Carlyle, Thomas. *The French Revolution: A History* (1837), Volume III, \"The Guillotine,\" Books 3.I to 3.VII. Project Gutenberg eBook #1301, plain-text edition (the file does not name its source printing). Book and chapter titles match the headings in the body text, and the chapter descriptions above are drawn from the text itself. https://www.gutenberg.org/cache/epub/1301/pg1301.txt (fetched 2026-10-24).\n2. Carlyle, *The French Revolution*, ed. David R. Sorensen, Brent E. Kinser and Mark Engel, Oxford World's Classics (2019): publisher's listing, which describes a critical text with the 1837 first edition as copy-text, collated with later editions. https://www.oupjapan.co.jp/en/products/detail/25181\n3. Reference summaries for dates: \"Charlotte Corday,\" Wikipedia (assassination 13 July, execution 17 July 1793); \"Reign of Terror,\" Wikipedia (Marie-Antoinette 16 October, the Girondins 31 October 1793, fall of Robespierre 27 July and execution 28 July 1794). https://en.wikipedia.org/wiki/Charlotte_Corday ; https://en.wikipedia.org/wiki/Reign_of_Terror\n4. \"13 Vendémiaire,\" Wikipedia (5 October 1795; grapeshot at Saint-Roch; notes that Carlyle probably coined \"whiff of grapeshot\"). https://en.wikipedia.org/wiki/13_Vend%C3%A9miaire"}, {"order": 5, "file": "05_The_Cast.md", "title": "The Cast: Who Is Who in Carlyle's French Revolution, and How He Handles Them", "summary": "A phase-by-phase roster of the people, factions and crowds a first-time reader meets in Carlyle's 1837 history, with what each did, which club or party they belonged to, and the epithets, sympathies and blind spots Carlyle brings to them.", "body": "# The Cast: Who Is Who in Carlyle's French Revolution, and How He Handles Them\n\n## Bottom Line\n\nCarlyle does not give you a cast list; he gives you a crowd of people introduced mid-gesture, nicknamed on sight, and judged by a single test: is this man a Reality or a Sham, a force with an eye or a mouth full of formulas? Keep that test in your pocket and the book sorts itself. Mirabeau, Danton and the nameless crowd are on the side of reality; the Girondin talkers, Lafayette's legalism and, above all, Robespierre's paper creed are on the other, and the pious, bewildered King and Queen are pitied rather than judged.\n\nThe practical advice is this. The factions are less important than the epithets. Carlyle names the clubs but he cares about temperaments, so the reader who remembers \"seagreen\" for Robespierre, \"Titan\" for Danton, \"Hero of two Worlds\" for Lafayette, and \"Judiths\" for the market-women will recognise a figure faster than one who tries to memorise Feuillant versus Girondin. This chapter groups the cast by the phase in which each person first matters, then closes with the collective characters and a short field guide to the parties.\n\nA note on sources. Every epithet and quoted fragment below comes from Carlyle's own text as published on Project Gutenberg [1] and matches it. The biographical summaries (what the person did) are the standard textbook record, drawn from reference works and from Carlyle's own narrative [2]. Where an epithet often credited to Carlyle is not in his text, that is said plainly.\n\n## How the book is built, and why it matters for the cast\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 507\" role=\"img\" aria-label=\"A four-column card catalogue of Carlyle's epithets. Sham: Robespierre, seagreen Incorruptible; Lafayette, Cromwell-Grandison and Hero of two Worlds. Pitied: Louis XVI, poor Louis; Marie Antoinette, poor Queen. Reality: Mirabeau, a Reality not a Sham; Danton, the Titan; the market-women of October 1789, the Judiths. Tagged but not sorted: Marat, Friend of the People; Charlotte Corday, cruel-lovely; Fouquier-Tinville, ferret-visage; the Committee of Public Safety, Cloud-Compellers; Carnot, iron Carnot; Saint-Just, mild-toned youth; Hebert, brutallest Newspaper.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">A COAT-CHECK OF EPITHETS<\/text>\n<text x=\"350\" y=\"48\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">Carlyle&#8217;s test: is this man a Reality, with an eye, or a Sham, with a formula?<\/text>\n<rect x=\"40\" y=\"66\" width=\"156\" height=\"38\" rx=\"3\" class=\"f-t2\" opacity=\".9\"/>\n<text x=\"118\" y=\"83\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-inv\" font-weight=\"bold\" letter-spacing=\"1.5\">SHAM<\/text>\n<text x=\"118\" y=\"96\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-inv\" font-style=\"italic\">a paper creed or a legal formula<\/text>\n<rect x=\"40\" y=\"114\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"114\" width=\"4\" height=\"44\" class=\"f-t2\"/>\n<text x=\"52\" y=\"129\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Robespierre<\/text>\n<text x=\"52\" y=\"143\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;seagreen Incorruptible&#8221;<\/text>\n<text x=\"52\" y=\"154\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5<\/text>\n<rect x=\"40\" y=\"165\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"165\" width=\"4\" height=\"44\" class=\"f-t2\"/>\n<text x=\"52\" y=\"180\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Lafayette<\/text>\n<text x=\"52\" y=\"194\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;Cromwell-Grandison&#8221;<\/text>\n<text x=\"52\" y=\"205\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 2<\/text>\n<rect x=\"40\" y=\"210\" width=\"156\" height=\"24\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"210\" width=\"4\" height=\"24\" class=\"f-t2\"/>\n<text x=\"52\" y=\"225\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">also &#8220;Hero of two Worlds&#8221;<\/text>\n<rect x=\"194.667\" y=\"66\" width=\"156\" height=\"38\" rx=\"3\" class=\"f-t5\" opacity=\".9\"/>\n<text x=\"272.667\" y=\"83\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-inv\" font-weight=\"bold\" letter-spacing=\"1.5\">PITIED<\/text>\n<text x=\"272.667\" y=\"96\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-inv\" font-style=\"italic\">crushed by a system they cannot steer<\/text>\n<rect x=\"194.667\" y=\"114\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"194.667\" y=\"114\" width=\"4\" height=\"44\" class=\"f-t5\"/>\n<text x=\"206.667\" y=\"129\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Louis XVI<\/text>\n<text x=\"206.667\" y=\"143\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;poor Louis&#8221;<\/text>\n<text x=\"206.667\" y=\"154\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 1<\/text>\n<rect x=\"194.667\" y=\"165\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"194.667\" y=\"165\" width=\"4\" height=\"44\" class=\"f-t5\"/>\n<text x=\"206.667\" y=\"180\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Marie Antoinette<\/text>\n<text x=\"206.667\" y=\"194\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;poor Queen&#8221;<\/text>\n<text x=\"206.667\" y=\"205\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 1<\/text>\n<rect x=\"349.333\" y=\"66\" width=\"156\" height=\"38\" rx=\"3\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"427.333\" y=\"83\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-inv\" font-weight=\"bold\" letter-spacing=\"1.5\">REALITY<\/text>\n<text x=\"427.333\" y=\"96\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-inv\" font-style=\"italic\">a living soul, an eye<\/text>\n<rect x=\"349.333\" y=\"114\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"349.333\" y=\"114\" width=\"4\" height=\"44\" class=\"f-t1\"/>\n<text x=\"361.333\" y=\"129\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Mirabeau<\/text>\n<text x=\"361.333\" y=\"143\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;a Reality, not a Sham&#8221;<\/text>\n<text x=\"361.333\" y=\"154\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 2<\/text>\n<rect x=\"349.333\" y=\"165\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"349.333\" y=\"165\" width=\"4\" height=\"44\" class=\"f-t1\"/>\n<text x=\"361.333\" y=\"180\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Danton<\/text>\n<text x=\"361.333\" y=\"194\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;the Titan&#8221;<\/text>\n<text x=\"361.333\" y=\"205\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5<\/text>\n<rect x=\"349.333\" y=\"216\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"349.333\" y=\"216\" width=\"4\" height=\"44\" class=\"f-t1\"/>\n<text x=\"361.333\" y=\"231\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">The market-women<\/text>\n<text x=\"361.333\" y=\"245\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;Judiths&#8221;<\/text>\n<text x=\"361.333\" y=\"256\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 3, Oct 1789<\/text>\n<rect x=\"504\" y=\"66\" width=\"156\" height=\"38\" rx=\"3\" class=\"f-t4\" opacity=\".9\"/>\n<text x=\"582\" y=\"83\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\" letter-spacing=\"1.5\">TAGGED, NOT SORTED<\/text>\n<text x=\"582\" y=\"96\" text-anchor=\"middle\" font-size=\"7.6\" class=\"t-inv\" font-style=\"italic\">the book refuses a verdict<\/text>\n<rect x=\"504\" y=\"114\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"114\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"129\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Marat<\/text>\n<text x=\"516\" y=\"143\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;Friend of the People&#8221;<\/text>\n<text x=\"516\" y=\"154\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 3<\/text>\n<rect x=\"504\" y=\"165\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"165\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"180\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Charlotte Corday<\/text>\n<text x=\"516\" y=\"194\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;cruel-lovely&#8221;<\/text>\n<text x=\"516\" y=\"205\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5, Vol III Bk 4<\/text>\n<rect x=\"504\" y=\"216\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"216\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"231\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Fouquier-Tinville<\/text>\n<text x=\"516\" y=\"245\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;ferret-visage&#8221;<\/text>\n<text x=\"516\" y=\"256\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5<\/text>\n<rect x=\"504\" y=\"267\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"267\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"282\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">The Committee<\/text>\n<text x=\"516\" y=\"296\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;Cloud-Compellers&#8221;<\/text>\n<text x=\"516\" y=\"307\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5<\/text>\n<rect x=\"504\" y=\"318\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"318\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"333\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Carnot<\/text>\n<text x=\"516\" y=\"347\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;iron Carnot&#8221;<\/text>\n<text x=\"516\" y=\"358\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5<\/text>\n<rect x=\"504\" y=\"369\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"369\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"384\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Saint-Just<\/text>\n<text x=\"516\" y=\"398\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;mild-toned youth&#8221;<\/text>\n<text x=\"516\" y=\"409\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 5<\/text>\n<rect x=\"504\" y=\"420\" width=\"156\" height=\"44\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"504\" y=\"420\" width=\"4\" height=\"44\" class=\"f-t4\"/>\n<text x=\"516\" y=\"435\" text-anchor=\"start\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">H&#233;bert<\/text>\n<text x=\"516\" y=\"449\" text-anchor=\"start\" font-size=\"9.2\" class=\"t-acc\" font-style=\"italic\">&#8220;brutallest Newspaper&#8221;<\/text>\n<text x=\"516\" y=\"460\" text-anchor=\"start\" font-size=\"7.8\" class=\"t-muted\">profiled in Phase 3<\/text>\n<text x=\"350\" y=\"495\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">only the left three columns are sorted by the primer; the right-hand column is epithet without verdict<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> Learn the tag and the faction follows: Carlyle sorts his cast by one test &#8212; Reality or Sham &#8212; and pins an epithet that returns until the reader can place a face by its colour, so &#8220;seagreen&#8221; (Robespierre) and &#8220;Titan&#8221; (Danton) will identify a figure faster than Feuillant versus Girondin.<\/figcaption>\n<\/figure>\n\n\nThe History runs in three volumes, twenty books and 159 chapters (Volume I has seven books and 50 chapters, Volume II six books and 54 chapters, Volume III seven books and 55 chapters). Volume I, \"The Bastille\", covers the death of Louis XV, the Versailles of the new reign, the financial collapse, the Estates-General and the fall of the prison, and it ends with the women's march that drags the royal family to Paris. Volume II, \"The Constitution\", is the age of oaths, clubs and journals, the flight to Varennes, and the slide to war. Volume III, \"The Guillotine\", is the republic, the King's trial, the Terror and, at its tail, Thermidor and Napoleon's cannon [1].\n\nCarlyle writes in the historical present and in the second person. Figures are \"signalised\", pointed at, addressed, and apostrophised (\"O thou...\"). He is a dramatist more than a chronicler. This means that a person often appears for a paragraph, gets a nickname, vanishes for two hundred pages and returns with the nickname attached. Learn the nickname, and you are fine.\n\n## Phase one: the old order (Volume I, Books 1 and 2)\n\n### Louis XV, and the corpse the book opens on\n\nThe book opens with the dying of Louis XV, \"the Well-Beloved\" in Carlyle's chapter title and \"the Unforgotten\" in a later one [1]. Carlyle uses him as a sermon: a king who was nothing but a Sham of kingship, a man who ruled by being worshipped and who is dead before the bill arrives. The reader should not mistake the opening for a character study. Louis XV is the thing the Revolution will be a reaction to, and Carlyle wants his stench in your nose before anyone else arrives. His mistress Madame du Barry is the \"Witch Dubarry\" of the book; she is there to show the court as a theatre of rot [1].\n\n### Louis XVI, \"poor Louis\"\n\nWhat he did: succeeded in 1774 at nineteen, dismissed and recalled ministers, backed the American war, summoned the Estates-General in 1789, accepted the Constitution of 1791, fled to Varennes in June 1791, was brought back, declared war on Austria in 1792 under pressure and with ulterior hopes, fell with the monarchy on 10 August 1792, and was tried and guillotined on 21 January 1793.\n\nHow Carlyle treats him: with a pity that is real and also condescending. He is \"poor Louis\", a man whose \"fault\" in Carlyle's phrasing is not wrongdoing but that he was born into a place he could not fill [1]. Early on he is a \"young, still docile, well-intentioned King\", and in the Maurepas years Carlyle calls him \"a King Popinjay\", a puppet among shifting ministers. The famous line of pity is \"Thou hast done nothing, poor Louis! Thy fault is properly even this, that thou didst nothing\" [1]. The insider's reading is that Carlyle forgives Louis as a person to damn kingship as a form: a decent man cannot save a Sham, and the more sympathetic the portrait, the more the system stands indicted. Be aware that this is generous. Historians now give Louis more agency, and more duplicity, in 1791 and 1792 than Carlyle's pathos allows, because the flight to Varennes and the secret correspondence with foreign courts were acts of a man with a plan. Carlyle sees the flight vividly (the berline, the Night of Spurs, Drouet) but treats it as bungling rather than strategy.\n\nWho holds the cards: nobody, for most of the period. That is Carlyle's point and the reader should watch for the moment in Volume II when the King's veto and his private letters make him, briefly, the one person whose decision could change the outcome, and he fails to decide.\n\n### Marie Antoinette\n\nWhat she did: Austrian archduchess, married to the future Louis XVI in 1770; hated for her extravagance and her foreignness; the centre of the court party; the real adviser behind the flight and the foreign appeals in 1791 and 1792; imprisoned in the Temple; tried and guillotined on 16 October 1793.\n\nHow Carlyle treats her: the \"fair young Queen\" of the early chapters, a figure of glitter and brightness; in the Procession chapter of 1789, \"Poor Marie Antoinette; with thy quick noble instincts\", whose vision is \"all-too fitful narrow for the work\" [1]. Carlyle gives her real courage and real dignity at the end (the chapter titled with her name, Volume III, Book IV, Chapter VII, sits among the great set pieces), and he treats the Diamond Necklace scandal as a symptom of the court's rot rather than as a charge against her. The blind spot is the same as with Louis: she is magnificent in suffering and under-examined in politics. Her role as the hidden hand of counter-revolution is something you will have to supplement from outside the book.\n\n### The ministers: Turgot, Maurepas, Necker, Calonne, Brienne\n\nThese are the men who fail to repair the finances in the years before 1789. Carlyle's gift is the one-line caricature. Turgot is the \"virtuous philosophic Turgot\", right and defeated. Maurepas is the \"Nestor of France\", a \"lightly-jesting lightly-gyrating\" old courtier, to whom Carlyle gives a chapter of his own [1]; his policy, in Carlyle's telling, is to keep the music playing.\n\nNecker deserves a closer look because readers meet him as a hero and leave him as a failure. Jacques Necker was a Genevese banker and the one minister the public trusted, recalled in 1788 and dismissed on 11 July 1789 (the dismissal that triggered the crowd marching on the Bastille). Carlyle calls him \"Genevese Necker\", describes his banker's skill and credit, and makes him an \"Atlas-like\" bearer of the burden of the state [1]. The irony is deliberate: Atlas carries the sky and the sky falls anyway. Necker's popularity came from his reputation for honest accounts, and Carlyle's point is that no accountant can balance a book whose columns are nobility's privilege and the people's hunger.\n\n### The Parlement of Paris\n\nA collective character first. The Parlement was not a legislature but a high court of hereditary lawyer-nobles who registered royal edicts and claimed the right to refuse. In the 1780s it posed as the people's champion against royal taxation while defending its own privileges. Carlyle's attitude is dry contempt for a body that thought itself a guardian of liberty while serving as a brake on any reform that touched its own class. When it fades from the story, the reader should not mourn it.\n\n### The writers in the wings: Voltaire, Rousseau, Beaumarchais\n\nCarlyle makes Voltaire the \"Patriarch\" and the age of the philosophes the dissolving acid. Beaumarchais, the \"lean French Hercules\" of his lawsuit victory, is the first modern celebrity-pamphleteer [1]. These matter because Carlyle's whole account of ideas is that the Revolution is in part a book come to life: \"paper\" turning into pikes.\n\n## Phase two: 1789, the Estates and the Bastille (Volume I, Books 3 to 7)\n\n### Mirabeau\n\nWhat he did: Honoré-Gabriel Riqueti, Comte de Mirabeau, was a noble disowned by his father, imprisoned, debauched and brilliant, elected to the Third Estate. He was the Assembly's greatest orator, pushed for a constitutional monarchy with a strong crown, was secretly in the King's pay from 1790, and died of illness in April 1791 before his double game could be tested.\n\nHow Carlyle treats him: as the great man of the first act. Carlyle writes in the Procession chapter that Mirabeau is \"the greatest\" of the Six Hundred of the Third Estate, and he builds the portrait on the old Marquis's own words that his son had \"made away with\" all formulas: this is a man of instincts and insights, \"not with logic-spectacles but with an eye\", without a moral code yet with \"a strong living Soul in him, and Sincerity there: a Reality, not an Artificiality, not a Sham\" [1]. That sentence is the clearest statement of Carlyle's test. He gives Mirabeau a chapter (\"Mirabeau\") and then a death chapter (\"Death of Mirabeau\") in Volume II, Book III, shows him taking secret counsel with the Court and the Queen, and writes that \"Had Mirabeau lived one other year!\" the history of France might have run differently [1].\n\nThe blind spot: Carlyle is dazzled by force of character. In the passages on Mirabeau's dealings with the Court he stresses plans and counsel; modern accounts stress that Mirabeau was paid by the King from 1790, a fact that sits uneasily with the heroic portrait. The insider's reading is that Mirabeau is Carlyle's template for what a leader should be, and everyone else is measured by how far they fall short.\n\n### Sieyès, Barnave, Pétion and the sixty-odd other deputies\n\nWhen the Estates-General open, Carlyle does a roll-call of faces. Abbé Sieyès, author of the pamphlet on the Third Estate, is for Carlyle \"the light thin man; cold, but elastic, wiry; instinct with the pride of Logic\", the \"System-builder, Constitution-builder General\" who builds constitutions \"skyhigh\" which \"fall before he get the scaffolding away\" [1]. At the king's trial Carlyle has him mount the tribune and say only \"La Mort sans phrase\" [1]. This is Carlyle's verdict on the whole Constitution of 1791 in one sentence and he repeats it with variations. Sieyès is brilliant, abstract and survives everything (he outlasts the Terror and helps bring Napoleon to power in 1799, which is beyond Carlyle's book).\n\nBarnave appears first as \"a slender young eloquent and vehement\" deputy, and later as one of the Triumvirs (with Duport and Lameth) of the Left [1]. His best scene comes after Varennes: sent with Pétion to bring the royal family back, Barnave is \"discreet, sympathetic\" in the berline, wins the Queen's trust, and becomes \"henceforth a Queen's adviser, if advice could profit\" [1]. Carlyle then returns to him on the scaffold in 1793: \"Barnave's appearance at the Revolutionary Tribunal was of the bravest; but it could not stead him,\" and he stamped his foot and asked, \"This then is my reward?\" [1]. So Carlyle does not neglect him, but he treats him as a cautionary figure of the moderate who is overtaken by events, not as the strongest case for constitutional monarchy; a reader who wants that case has to look at Barnave and the Feuillants outside Carlyle.\n\nPétion, a lawyer from Chartres with \"placid-unalterable\" convictions and a violin, is a Jacobin who will be mayor of Paris from late 1791 and later a Girondin fugitive; in the Varennes chapters Carlyle shows him eating his luncheon in the royal berline and telling the King a republic was \"not ripe yet\" [1].\n\n### Bailly\n\nJean-Sylvain Bailly, an astronomer, presided over the National Assembly at the Tennis Court Oath (\"President Bailly has covered himself with honour\") and became the first mayor of Paris. Carlyle's description is fond and a touch patronising: \"Poor Bailly, how thy serenely beautiful Philosophising\" ends in \"foul thick confusion,\" and \"Speculation is not practice\" [1]. Bailly is the tragedy of the honest expert. At the Champ de Mars on 17 July 1791 Carlyle shows him \"with elongated visage\" carrying the red flag of martial law, and reporting \"Twelve unfortunately shot\" while Patriotism counted the dead \"by tens and even by hundreds\" [1]. He was guillotined in November 1793 in a cold sleet, answering a jeer that he trembled with \"c'est de froid\"; Carlyle gives the date as 10 November, while reference works commonly give 12 November [1]. Carlyle sums up his crime as \"leaving his Astronomy to meddle with Revolution.\"\n\n### Lafayette\n\nWhat he did: Marie-Joseph, Marquis de Lafayette, hero of the American war, commander of the National Guard from July 1789, escorted the royal family back to Paris in October 1789, commanded the National Guard that fired on the crowd at the Champ de Mars in July 1791, then commanded an army in 1792, tried to march on Paris to defend the Crown, and fled to Austrian captivity.\n\nHow Carlyle treats him: with ironic affection and steady scorn for his legalism. When he first appears, in the Procession chapter of 1789, the prophecy is that his \"name shall be Cromwell-Grandison, and fill the world\"; he alone of Frenchmen has a theory of the world, \"the Washington-formula,\" and can become \"the hero of one idea\" [1]. Cromwell is the strong man who cuts through; Grandison is the polite, scrupulous gentleman of Richardson's novel; so the compound means a would-be Cromwell paralysed by manners and principles. The reversed form \"Grandison-Cromwell\" appears later, in Volume II, Book VI, in the lament \"O thou poor Grandison-Cromwell!\", and Lafayette's other label is the \"Hero of two Worlds\" (America and France), which turns bitter as the book goes on, ending in a \"gossamer Colossus\" whose following has evaporated [1]. The note to remember: the standard shorthand that Carlyle's term is \"Grandison-Cromwell\" is half right; the book first uses the reverse order \"Cromwell-Grandison\".\n\nWhy Carlyle dislikes him: Lafayette insists on forms. The Revolution, in Carlyle's physics, is a fire, and fires do not read statutes. Lafayette's attempt to hold the middle (loyal to the King, loyal to the Assembly, loyal to law) ends, in Carlyle's telling, by pleasing no one. Historians are more sympathetic to him as a rare man of integrity who knew exactly how far he could go.\n\n### Desmoulins and Danton at the Bastille\n\nThe Palais-Royal and the street give Carlyle two figures he pins down in one go. Camille Desmoulins, the journalist who leapt on a table and called Paris to arms on 12 July 1789, has a \"face of dingy blackguardism, wondrously irradiated with genius\", with \"infinite shrewdness, wit, nay humour\" [1]. Carlyle says it would be \"falsehood to pretend one did not almost love thee\". Remember the affection; it pays off in Volume III when Camille goes to the scaffold with Danton.\n\nDanton is introduced beside him as the \"huge, brawny\" lawyer with a \"rude flattened face\" through which \"looks a waste energy as of Hercules not yet furibund\", President of the Cordeliers district, with \"lungs of brass\" [1]. The book's whole feeling for Danton is in that first image: immense unrealised power.\n\n### The Parisian crowd as actor\n\nThe storming of the Bastille on 14 July, the October Days: Carlyle's genius is to make the crowd a hero with many faces, and he names individuals within it (Hulin, Maillard, Lecointre the draper, Santerre the \"sonorous Brewer\") [1]. Treat this as a method. When the narrative says \"Paris\" it means this composite.\n\n## Phase three: the October Days and the age of the Constitution (end of Volume I, Volume II)\n\n### The women: the \"Judiths\"\n\nOn 5 October 1789 a mass of Paris market-women marched to Versailles. Carlyle calls them \"Judiths\", a reference to the biblical Judith who killed Holofernes, and he uses the word repeatedly through the march (\"the ten thousand Judiths press up, resistless\") [1]. Two things to know. First, the word comes from Camille Desmoulins, whom Carlyle quotes (\"Grand it was, says Camille, to see so many Judiths, from eight to ten thousand of them in all\"), and Carlyle runs with it, lending the women some grandeur. Second, he is not sentimental: the same women are bread-hunters whose violence he narrates in full. Later, in Volume III, the \"famed Tricoteuses, Patriot Knitters\" who sit at the guillotine are his darker female chorus [1].\n\n### The National Assembly (Constituent)\n\nCarlyle's attitude to the Assembly changes with the weather. In 1789 it is a rising of the Third Estate, and a real Reality. By the time of the Constitution it is a mill of constitution-making, and Carlyle's scorn is for the faith that enough debate yields a new society. His chapter \"Windbags\" (Volume I, Book II) is not about the Assembly at all but about the talking society of the 1770s and 1780s, whose faith in words, he says, would have men \"riding on windbags\" up to the Empyrean; the Assembly inherits the mockery [1]. When it dissolves, handing the field to the Legislative, the reader should expect no regret.\n\n### The King's escape: Fersen, Bouillé, Drouet\n\nCount Fersen, Swedish aristocrat and, in many accounts, the Queen's close friend or lover (historians disagree), organises the flight; the Marquis de Bouillé commands the loyal troops on the frontier whom he had used to crush the Nancy mutiny of 1790; Drouet, the postmaster and old dragoon, recognises the King at Sainte-Menehould and sets the countryside against him. These are chapter heroes in Volume II, \"Count Fersen\", \"Old-Dragoon Drouet\", \"The Night of Spurs\", and they show Carlyle at his best: a chase told as a thriller. The cast is small and the stakes are huge.\n\n### Marat, \"Friend of the People\"\n\nWhat he did: Jean-Paul Marat, physician and scientist manqué, ran the newspaper L'Ami du peuple, demanded heads, hid in cellars, was elected to the Convention, was acquitted when the Girondins put him on trial, and was stabbed in his bath by Charlotte Corday on 13 July 1793.\n\nHow Carlyle treats him: first as a voice in the wings. \"Acrid, corrosive, as the spirit of sloes and copperas, is Marat, Friend of the People\" [1]. Carlyle reports that Desmoulins names him \"Maximum of Patriotism\" and \"Cassandra-Marat\" (the prophet who is never believed), and adds that \"were it not singular\" if his \"dirk-and-muff plan\" (two hundred Naples bravoes, each with a dirk and a muff on the left arm) \"proved to be precisely the plan adopted?\" [1]. That is Carlyle at his most unsettling: he distrusts Marat, paints him in a squalid cellar, and still concedes the force of his diagnosis that the Assembly's talk would never save the Revolution. The reader should note how much of the Revolution's radicalism Carlyle is willing to call prescient even as he finds it repellent.\n\nMarat is also where the book refuses easy moral sorting: he is a monster and an oracle.\n\n### Hébert and Père Duchesne\n\nJacques-René Hébert, deputy procureur of the Paris Commune and publisher of the coarse paper Le Père Duchesne, became the voice of the extreme sansculottes and a leader of the \"Hébertist\" faction. Carlyle calls his paper the \"brutallest Newspaper yet published on Earth\" [1]. He is arrested in May 1793 in the quarrel with the Girondins, restored by the Commune's pressure, and in March 1794 is destroyed with the Hébertists as the Committee consolidates; Carlyle gives him only a few paragraphs and, no friend to him, treats him as a symptom of the rage below.\n\n### The clubs: Jacobins, Cordeliers, Feuillants\n\nCarlyle explains the clubs as they appear. The Jacobins, meeting in a former convent in the rue Saint-Honoré, began as deputies' dining society and became the national network. The Cordeliers, Danton's district, were more street-level and more violent. The Feuillants, a breakaway of moderate Jacobins after Varennes (Lafayette, Barnave and the Lameths), are named in Volume II as the \"Feuillans Club\" for their meeting place [1]. Keep the geography: Jacobins, Rue Saint-Honoré; Cordeliers, left bank; Feuillants, near the Tuileries.\n\n## Phase four: the Legislative, war and the fall of the throne (late Volume II, start of Volume III)\n\n### Brissot and the Girondins\n\nThe Girondins (named for the department of the Gironde where several leaders came from) are Carlyle's \"Brissotins\", after Jacques-Pierre Brissot de Warville, journalist and former friend of the Blacks (the anti-slavery Société des Amis des Noirs) [1]. They pushed for war in 1792. Carlyle writes of Brissot \"and his Brissotins, or Girondins, in the Legislative\" crying aloud for the \"defiant plan\" of war while Robespierre pleads for delay [1]. This is one of the best sorting devices in the book: the Girondins want war, Robespierre argues against it, and the war ends up destroying the Girondins.\n\nCarlyle's attitude is respectful but cool. He introduces the Gironde group as men \"of fervid Constitutional principles; of quick talent, irrefragable logic, clear respectability; who will have the Reign of Liberty establish itself, but only by respectable methods,\" known as Girondins \"to the sorrowing wonder of the world\" [1]. Brissot himself he calls \"restless, scheming, scribbling Brissot,\" \"a man of the windmill species, that grinds always, turning towards all winds\" [1]. They are eloquent, philosophical and ineffective, and their idea of liberty is a salon's. Condorcet, the philosopher-mathematician, is among them. Madame Roland, who ran the salon and whose husband Jean-Marie Roland was minister of the interior, is \"the brave Dame Roland, bravest of all French women\" [1], one of Carlyle's rare unqualified tributes to a woman. The warning: because the Girondins wrote the memoirs that shaped the nineteenth-century memory (Lamartine's romantic histories), their prestige is higher than their political performance, and Carlyle's coolness is partly a corrective.\n\n### Dumouriez\n\nCharles-François Dumouriez, a soldier and diplomatist, became foreign minister in the Girondin government of spring 1792 and commanded at Valmy and Jemappes. Carlyle gives him his own chapter title at the head of Volume III (\"Dumouriez,\" Book I, Chapter III), though that chapter is mostly the story of the Prussian advance and the fall of Verdun, with Beaurepaire's suicide, seen from the general's side. His fall is told in Book III, in the chapter \"The Traitor\": after defeat in Belgium, Dumouriez quarrels with the Convention's commissioners, has them seized, and in early April 1793 flees to the Austrians. He is the pattern of the general who fights for France but cannot be trusted by the Republic, a recurring danger in the book.\n\n### Pétion, Santerre and the 10 August\n\nPétion as mayor of Paris, Santerre as commander of the faubourg Saint-Antoine national guard: these are the practical men of the day the Tuileries falls. Carlyle gives the faubourgs a loud voice. The attack on 10 August 1792, the Swiss Guard massacre and the fall of the throne are the book's most chaotic set pieces; you will meet many named people for a line each. Don't worry about them.\n\n### The September Massacres\n\nThe prison killings of September 1792 appear in Volume III under the name of the \"Septemberers\" (Septembriseurs) [1]. No single figure; Marat's incendiary journalism is the usual suspect and Danton as minister of justice is accused of not stopping it. Carlyle neither whitewashes nor moralises; he treats it as a fit of terror in a besieged city.\n\n## Phase five: the Convention, the Terror and the great duels (Volume III)\n\n### Danton\n\nWhat he did: Georges-Jacques Danton, lawyer, Cordeliers leader, minister of justice after 10 August, voice of national defence, member of the first Committee of Public Safety (Carlyle notes that Danton proposed giving it full power and then \"would take no hand in it\"), then the leader of the \"Indulgents\" who wanted the Terror eased, arrested in March 1794 and guillotined on 5 April 1794 with Desmoulins and others.\n\nHow Carlyle treats him: as a Titan. \"Danton the Titan rises in this hour, as always in the hour of need\", with a voice \"reverberating from the domes\" [1]. There is a chapter in Volume III titled \"Danton, No Weakness\", which captures Carlyle's reading of the man as a force who, at the end, is undone by what looks like weakness but is really weariness and over-confidence. Carlyle loves him. The reader should see this: Danton is Carlyle's second great man after Mirabeau, a Hercules who is too lazy, too trusting and too much of a sensualist to defeat a colder opponent. The criticism that applies is that Carlyle's affection leads him to underplay Danton's corruption and his part in the September violence.\n\n### Robespierre\n\nWhat he did: Maximilien Robespierre, lawyer from Arras, opposed war in 1792, Jacobin leader, deputy of the Convention, destroyer of the Girondins in alliance with the Commune, member of the Committee of Public Safety from July 1793, eliminated Hébertists and Dantonists in spring 1794, set up the cult of the Supreme Being in June 1794, and fell on 9 Thermidor (27 July 1794), guillotined the next day.\n\nHow Carlyle treats him: with a fascinated loathing and with the most sustained epithets in the book. Carlyle introduces him in 1789 as an \"anxious, slight, ineffectual-looking man, under thirty, in spectacles\", with a complexion whose final shade \"may be the pale sea-green\" [1]. From that grows the refrain \"seagreen Robespierre\" and \"seagreen Incorruptible\" [1]. The word \"Incorruptible\" was Robespierre's own admirers' title; Carlyle pins \"seagreen\" onto it, so the dignified word is made to wear a bilious colour. It recurs through the later volumes, including the apostrophe \"O thou seagreen Incorruptible\" [1]. In the chapters on the cult of the Supreme Being he is \"O seagreen Prophet, unhappiest of windbags blown nigh to bursting\", presiding over a \"conscious Mumbo-Jumbo\" that \"knows that he is machinery\" [1].\n\nWhy Carlyle dislikes him: Robespierre is the Sham Carlyle hates most, a man of a paper creed (Rousseau's Social Contract) who tries to govern a nation by formula. He is honest, which makes him worse, because honesty harnessed to a formula is how fanatics arise. Carlyle does grant him sincerity, which is exactly why he cannot be Mirabeau.\n\nThe blind spot: a nineteenth-century moralist's refusal to see Robespierre as a politician managing a war emergency with a tiny and fractured committee. For a modern view, read Carlyle's Robespierre as caricature that has outlived its accuracy, and also as the origin of the English-language image of him.\n\n### Saint-Just\n\nLouis-Antoine de Saint-Just: deputy of the Aisne, prosecutor of Louis XVI (\"no one can reign innocently\"), Robespierre's younger ally, author of the Ventôse decrees, commissioner on missions to the army, guillotined on 10 Thermidor. Carlyle's first glimpse is \"more like a Student than a Senator: not four-and-twenty yet\", \"a youth of slight stature, with mild mellow voice, enthusiast olive-complexion, and long dark hair\" and \"the black-haired, mild-toned youth\" [1]. Notice the gap between gentleness of manner and the harshness of the policy, which Carlyle lets sit without comment.\n\n### Camille Desmoulins in the Convention\n\nDesmoulins, the man who began it all, ends it as editor of the \"Vieux Cordelier, Old Cordelier,\" whose pamphlets Carlyle calls full of wit and humour, pricking at the Law of the Suspect, and who had demanded a \"Committee of Mercy\" [1]. The affection Carlyle seeds in 1789 gives the end its force. His death with Danton is the book's great moment of friendship dissolved.\n\n### Charlotte Corday\n\nMarie-Anne Charlotte Corday (Carlyle writes \"d'Armans\"), a Norman woman of minor noble family and Girondin sympathies, travelled to Paris and stabbed Marat on 13 July 1793, believing that killing him would end the ci
