vil war; she was guillotined four days later. Carlyle gives her the opening of Volume III's fourth book: \"a young Lady... of stately Norman figure; in her twenty-fifth year; of beautiful still countenance\", \"cruel-lovely, with half-angelic, half-demonic splendour\", who \"emerged from her secluded stillness, suddenly like a Star\" [1]. A note on an epithet: the popular tag \"Beautiful Aristocratic Republican\" is often credited to Carlyle in secondary writing, but it does not appear in the Gutenberg text; the phrases the book actually uses are the ones just quoted, together with a line he cites that \"She was a Republican before the Revolution, and never wanted energy.\" Treat the tag as not Carlyle's.\n\nCarlyle's attitude: awe. This is the one assassin he treats as a figure of tragic grandeur. The politics are secondary; what he wants you to see is the single will that cuts through the machinery.\n\n### Fouquier-Tinville and the Revolutionary Tribunal\n\nAntoine Fouquier-Tinville, public prosecutor of the Revolutionary Tribunal from March 1793, sent thousands to the guillotine and was himself executed after Thermidor. Carlyle calls him the \"ferret-visage of Fouquier-Tinville\" [1]: a creature of narrowness and appetite, introduced early among the attorneys and then given the role of the machinery's operator. He is a functionary, not an ideologue, and Carlyle uses him to show that the Terror was run by clerks.\n\n### The Committee of Public Safety, Carnot, Barère, Collot, Billaud\n\nThe Committee ran the war and the Terror from summer 1793. Carlyle calls its members \"Cloud-Compellers\" and lists \"a Robespierre, a Billaud, a Collot, Couthon, Saint-Just,\" adding that little intellectual talent is needed there \"except in the head of Carnot, busied organising victory\" [1]. He first meets Carnot in the Legislative Assembly of 1791-92, where he calls him, by a slip, \"Captain Hippolyte Carnot\" (Hippolyte was Lazare Carnot's son), \"iron Carnot, far-planning, imperturbable, unconquerable\" with a \"cold mathematical head,\" and he gives the dinner-table anecdote of Carnot finding his own name on a list of forty in Robespierre's pocket [1]. Barère is the Committee's mouthpiece, and Carlyle's portrait is a small masterpiece of irony: \"Ingenious Barrère,\" whose motto is \"success to the winning side,\" master of \"the great Art of Varnish,\" later \"Anacreon of the Guillotine,\" and author of the invented tale of the sinking of the Vengeur [1]. Collot d'Herbois and Billaud-Varenne, the harsh Jacobins who will turn on Robespierre, matter in the last chapters. Carlyle is more interested in individuals' temperament than in committee mechanics, though he does pause to describe the Committee as the centre round which the Anarchy has \"organised itself\" [1].\n\n### Philippe Egalité\n\nLouis-Philippe-Joseph, Duke of Orléans, cousin of the King, renamed himself Philippe Egalité, voted for the King's death in the Convention, and was himself guillotined in November 1793. Carlyle uses him as a curious case of a prince who joins the Revolution and is devoured by it. His son becomes King Louis-Philippe in 1830, which Carlyle mentions in passing, \"Napoleons, Louis Philippes\" [1].\n\n### Thermidor and the fall\n\nThe 9 Thermidor chapter shows Robespierre \"reappear in Convention; mounts to the Tribune\" with a \"biliary face\" and a speech \"long-winded, unmelodious as the screech-owl's\" [1], and the conspirators Tallien, Bourdon and the rest. These are men who feared they were next. Carlyle treats the fall as a failure of a man who had never built a party but only a following.\n\n## Phase six: Napoleon\n\nNapoleon Buonaparte arrives in the book twice before the end. First, in Volume II, Book I (the Feast of Pikes year), he is a minor sublieutenant (\"To such height of Sublieutenancy has he risen\") [1]. Then, at Toulon in 1793, he is \"an Artillery Chef de brigade, of extreme diligence\", \"a short taciturn, olive-complexioned young man... one of the best Artillery-officers yet met with\" [1]. Toulon is the reader's introduction: he helps retake the port from the British.\n\nThe payoff comes in Volume III's last chapters, in the chapter titled \"The Whiff of Grapeshot\" (13 Vendémiaire, October 1795). The Convention is threatened by a Parisian royalist insurrection and Napoleon, under Barras, fires on the crowd outside the church of Saint-Roch. Carlyle remarks that, in Marshal Broglie's day, \"six years ago, this Whiff of Grapeshot was promised; but it could not be given then, could not have profited then\" and now \"the time is come for it, and the man\", and \"the thing we specifically call French Revolution is blown into space by it, and become a thing that was!\" [1]. Note two points. The phrase \"whiff of grapeshot\" first appears in Volume I, Book V, Chapter III, \"Broglie the War-God,\" where Carlyle reports the court party's boast that brave Broglie, \"with a whiff of grapeshot,\" would deal with the Third Estate; the last-volume use is deliberately an echo [1]. Carlyle's own count of the dead at Saint-Roch is \"some two hundred men\" [1]. And Carlyle ends his story here, with the Revolution replaced by the age of the soldier. He is not interested in Napoleon's empire; Napoleon is the answer to the question the book has been asking, namely what happens when a Sham is swept away and no new Reality has grown.\n\n## The collective characters\n\n### The sansculottes and the crowd\n\nThe sansculottes, the \"without-breeches\", are the Paris working people and artisans who give the Revolution its street energy. Carlyle uses the word without translating its contempt: it was an aristocratic insult turned into a badge. He gives the crowd a will, a hunger and an anger, and on the whole he trusts it more than any assembly. That is his big sympathy and also his big blind spot. He shows the crowd as a force of nature, but is slow to analyse its leaders or its economic grievances beyond hunger, and he flinches when it turns to mass killing. The crowd is Carlyle's mighty Reality, and the book's tragedy is that it is led by Shams.\n\n### The women\n\nThe Judiths of October 1789, the Tricoteuses of the Terror, and the individual women (Corday, Madame Roland, Marie Antoinette) are Carlyle's chorus of female energy. He is more admiring of women who act as individuals than of women as a political mass.\n\n### The Parlement, the Assemblies, the Convention\n\nCarlyle does not describe institutions so much as stage them. The Parlement is a court of lawyers defending privilege; the National Assembly is a cathedral of rhetoric; the Legislative is a short interlude of nobodies; the Convention is the arena of the great duels. The reader gets a sense of the institution as a place with weather. Do not look for procedural clarity.\n\n## A field guide to the factions\n\nA rough map, which is good enough for reading Carlyle.\n\nThe Feuillants are the constitutional monarchists after Varennes: Lafayette, Barnave and the Lameths, with Bailly in sympathy. Carlyle is cool to them because they cling to forms.\n\nThe Girondins (Brissotins) are the war party of 1792, eloquent, provincial and republican: Brissot, Vergniaud, Condorcet, Roland, Madame Roland, Pétion, Barbaroux. Carlyle gives them respect and a faint sorrow. They were proscribed on 2 June 1793 (\"The Twenty-two\" is a Volume III chapter heading) [1].\n\nThe Jacobins are the club network that Robespierre came to dominate; the Montagnards (\"the Mountain\") are the Jacobin-aligned deputies who sat on the high benches of the Convention. The Mountain defeated the Girondins; its leading figures are Robespierre, Danton, Marat, Saint-Just, Couthon, Billaud and Collot.\n\nThe Cordeliers are the Danton–Marat–Hébert street wing, later split between Danton's Indulgents (who wanted mercy) and Hébert's extremists (who wanted more terror). Robespierre destroyed both in spring 1794. The way to keep them straight: Danton falls for being too moderate, Hébert for being too extreme, and Robespierre for being the last man standing with nothing but a theory.\n\nThe Plain or Marsh is the uncommitted bulk of the Convention that decided by fear; it matters at Thermidor.\n\n## What to carry into the book\n\nCarlyle's own tests, as a reader can reconstruct them. First, does the person have an eye, a Reality, or is he a mouth for formulas? Mirabeau, Danton, the crowd and Corday pass; Sieyès, Robespierre and the Girondins mostly do not, and Lafayette passes only as \"the hero of one idea.\" Second, is the person's suffering larger than their politics? Louis, Marie Antoinette and Camille are kept by pity. Third, does the person have a nickname? If so, he or she is a figure of fate; if not, a clerk.\n\nWhere to resist him: he underrates the constitutional monarchists; he flatters his heroes (Mirabeau's money, Danton's part in September); he caricatures Robespierre; he is thin on the economics of the sansculottes; and he has little interest in the men who won the war.\n\n## Open Questions\n\nWas the \"Beautiful Aristocratic Republican\" label for Corday ever Carlyle's? It does not appear in the Gutenberg text, and no other source located assigns it to him; its origin is unresolved.\n\nHow far does Carlyle credit the Girondins' memoirs and Lamartine's romantic history for his reading of the party? His footnotes cite many memoirists, and a closer comparison would show which of his portraits rest on which source.\n\nCarlyle's debts to specific memoirists (Dumont for Mirabeau, Bertrand de Molleville and Madame Campan for the court, Prudhomme's \"Révolutions de Paris\" for street life) shape each portrait. A line-by-line comparison would show which epithets are his invention and which are borrowed from the memoir. This has not been done.\n\nThe date of Bailly's execution (Carlyle: 10 November 1793; reference works: 12 November) and the Louis XVI vote tallies given in the companion chapter are the places where Carlyle's figures differ from the usual modern ones; the printed record of the Convention would settle both.\n\n## Sources\n\n1. Carlyle, Thomas. *The French Revolution: A History* (1837). Project Gutenberg #1301. https://www.gutenberg.org/ebooks/1301 (plain text read at https://www.gutenberg.org/cache/epub/1301/pg1301.txt). Tier 1 (the text itself). All quoted fragments and epithets in this chapter come from this source.\n2. Encyclopaedia Britannica, \"The French Revolution\" (Carlyle's History, noted for portraits of Lafayette and Robespierre). https://www.britannica.com/print/article/219453 . Tier 2. The biographical summaries elsewhere in this chapter rest on the standard reference record and on Carlyle's own narrative.\n3. Alpha History, \"Historian: Thomas Carlyle\". https://alphahistory.com/frenchrevolution/historian-thomas-carlyle/ . Tier 5 (educational site); used only for the general characterisation that Carlyle admires Mirabeau and Danton, despises Robespierre and pities the King and Queen.\n4. Wikipedia, \"The French Revolution: A History\". https://en.wikipedia.org/wiki/The_French_Revolution:_A_History . Navigation only; no claim rests on it."}, {"order": 6, "file": "06_Reading_Carlylese.md", "title": "Reading Carlylese: A Practical Decoder for The French Revolution", "summary": "A working guide to Carlyle's 1837 idiom for a reader about to open volume one: how the present tense and the 'camera' work, a glossary of his recurring capitalized terms, tied to the passages where they occur, how to spot irony, which set-pieces to read first, and a method for surviving the fog.", "body": "# Reading Carlylese: A Practical Decoder for The French Revolution\n\n## Bottom Line\n\nCarlyle's prose looks like a wall, but it is built from a small number of repeating moves: a present-tense narrator who stands in the crowd, a handful of capitalized abstractions that he treats as living forces (Sham, Reality, Paper, Sansculottism, Formula), a lot of exclamation and direct address, and a steady undertone of mockery that you learn to hear. Learn those moves in the first fifty pages, read aloud when a sentence jams, treat the set-pieces as the point of the book, and let the fog wash over you. It lifts more often than it seems it will.\n\nOne caution up front. Two of the \"famous\" Carlyle words you may have heard about, Dryasdust and Dilettantism, are not in this book at all. A full-text search of the Gutenberg edition finds neither, in any spelling. This chapter says which words are his and which belong to other works, because the 1837 history is the only thing that matters when you are standing at its door.\n\nThis is the reader-practical layer. For the literary history of the style and its German lineage, see the companion study of the book's style and allusion; this chapter does not repeat it, it tells you how to use them while turning pages. All chapter references below use the book-and-chapter numbering of the Gutenberg text (for example 1.4.IV is Volume I, Book IV, Chapter IV).\n\n## 1. First Contact: What You Are Looking At\n\nOpen the book at random and you will meet some combination of these: sentences that begin with the verb (\"So rolls and dances the Procession\"); words with capital letters that are not names (\"Paper,\" \"Reality,\" \"Respectability\"); hyphenated monsters (\"Fire-Mahlstrom,\" \"World-Phoenix\"); the narrator speaking to the dead (\"Smite, thou Louis Tournay\") or to you (\"O Reader\"); dashes everywhere; and untranslated French in italics [1].\n\nWilliam Thackeray, reviewing the book in The Times in August 1837, put the complaint memorably. The style, he wrote, \"is stiff, short, and rugged,\" abounding \"with Germanisms and Latinisms, strange epithets, and choking double words\" [2]. He did also say of Carlyle's account of the storming of the Bastille, \"This is prose run mad,\" but the sentence continues \"according to our notions of the sober gait and avocations of homely prose,\" and the paragraph goes on to ask whether sober prose could have described the fall of the Bastille more forcefully [2]. So the famous phrase is real, but it is a half-sentence from a review that is finally a defense. His point also doubles as a map. The Germanisms are mostly inversion and compounding. The \"strange epithets\" are a closed set, and you will meet each of them many times. The \"choking double words\" are very often a metaphor for fire, flood or ghosts.\n\nCarlyle is not trying to be obscure. His claim, scattered through the book, is that the Revolution was too large and too chaotic to be narrated in a calm, balanced period. He says so at the climax of Thermidor, where the night of the coup \"can only be painted in gross; somewhat as that antique Painter, driven desperate, did the foam\" (3.6.VII) [1]. The style is his answer to the problem of describing a crowd.\n\n## 2. The Present Tense and the Camera\n\n### What it is\n\nFor long stretches Carlyle narrates 1789 or 1793 in the present tense. The Bastille falls now. The King mounts the scaffold now. This is the first thing to adjust to, and the adjustment is simple: treat the book as a newsreel, not a history lecture. When the verbs go present, the outcome is not yet known to the narrator or to anyone in the scene, and he is asking you to stand in the street.\n\nThe tense does not hold all the way through. He slides out of it for commentary, retrospect and sermon, and the slide itself is a signal. Present tense equals scene; \"we\" and \"thou\" and the past tense mean the narrator is stepping out to tell you what the scene means. Learning to feel that shift is most of the work of reading him.\n\nThe scholarly reading of this is worth knowing. Chris Vanden Bossche argues that Carlyle deliberately gives up the omniscient, past-tense historian's voice, which conceals the narrator's assumptions behind an air of settled fact, in favor of a first-person voice that keeps the act of interpreting in view [3]. John Stuart Mill, in his 1837 review, had already said the book was closer to an epic poem than to a conventional history, and Vanden Bossche calls it an \"inverse epic,\" one that records a failure of belief rather than a triumph of it [3]. You do not need the theory to read the book. It is useful mainly as a reassurance: the narrator who keeps interrupting is the design, not a lapse.\n\n### The camera\n\nCritics have reached for visual analogies, and the most useful for a reader is the camera. Carlyle cuts. In the Bastille chapter (1.5.VI, \"Storm and Victory\") he gives you the whole city as one swirling pool, \"that grand Fire-Mahlstrom which is lashing round the Bastille,\" then slams in to a single man with a name and a trade: Louis Tournay, cartwright of the Marais and old soldier, whose axe is to strike the chain of the outer drawbridge. The call is imperative, in the middle of the assault: \"Smite, thou Louis Tournay... smite at that Outer Drawbridge chain, though the fiery hail whistles round thee!\" [1]. A few lines later he is on the wine-merchant who has turned himself into a gunner: \"Cholat the wine-merchant has become an impromptu cannoneer. See Georget, of the Marine Service, fresh from Brest, ply the King of Siam's cannon\" [1]. That is the verbal equivalent of pointing.\n\nThe practical advice: when he gives you a name and a trade, slow down. That is a close-up. When he lists regiments, sections, streets and torchlights, that is the wide shot, and you can let it pour past. A reader who tries to hold every name in the wide shot will drown by page sixty. A reader who watches for the close-up will find the book is full of tiny human portraits, from the fishwife to the dragoon.\n\n### The roving \"we\"\n\nAnother mark of the camera is the mobile narrator. \"We\" appears in the middle of an assault, as if the author and reader are in the line together. \"Reader\" is addressed directly in several forms, \"good Reader\" (1.4.IV) and \"O Reader\" (1.1.II, 1.5.IX, 2.4.I among others) both occur [1]. Treat these as stage directions. He is moving you.\n\n## 3. The Glossary: Recurring Terms and Their Plain Meanings\n\nThe table covers terms that actually recur in the 1837 text. Counts come from a text search of the full Gutenberg edition and are given only to show how persistent a word is; spelling and capitalization vary, so treat them as order of magnitude. Where a term has a famous first appearance the table gives the chapter.\n\n| Term | What it means in plain English | Where to meet it |\n| --- | --- | --- |\n| **Sansculottism** | The popular, plebeian, anarchic force of the Revolution; literally \"the without-breeches,\" from the sans-culottes, the poor Paris militants. Carlyle makes it a mythic power and uses the word close to a hundred times. He treats it as an elemental fact, not an ideology. | The vision at the opening of Book VI of Volume I (1.6.I), where SANSCULOTTISM rises \"many-headed, fire-breathing\" from the earth; its funeral in 3.7.VI |\n| **Sansculotte** | An individual member of that plebeian force. | Throughout |\n| **Paper Age** or \"Era of Hope\" | The pre-Revolution decades, when France ran on books, pamphlets, promissory notes and bright talk. Paper is both literal (printing, later assignats) and figurative (hope without substance). Carlyle says \"we will honour a Paper Age too; an Era of hope\" and then calls the age \"this its Paper Age, or Era of Hope.\" | 1.2.III \"Questionable\" and 1.2.VI \"Windbags\" (Book 1.II is titled \"The Paper Age\") |\n| **Sham(s)** | Anything that claims authority or reality it does not have: titles, forms, rituals, institutions whose life is gone. At the opening of the Estates he announces \"sentence of death is pronounced on Shams.\" | 1.4.IV; the \"Shams shall be no more\" refrain in 2.4.IX; the last chapter, 3.7.VIII |\n| **Reality / Realities** | The opposite of Sham: what actually exists beneath the form. Carlyle's whole moral scheme is a contest between Shams and Realities. | The same Doom-trumpet passage, 1.4.IV: \"judgment of resuscitation... is pronounced on Realities\" |\n| **Formula** | The Girondin habit of mind: government by pre-established rule and philosophy rather than by the strength the moment demands. \"Formula and Reality\" are named as combatants in 3.3.VII, \"in death-grips.\" | Book 3.III generally; 3.6.II, where the seagreen Robespierre is called \"the poor seagreen Formula\" |\n| **Quack / Quackery** | The pretender who lives off Sham. The root occurs about twenty times in all (Quack, Quacks, Quackery, a few in lower case), so \"Quack\" is a working word, though not a constant one. A quack is not necessarily a fraud in intent; he is a man selling a formula he does not have. | Cagliostro in 1.2.VIII; \"the race of Quacks was grown many as the sands of the sea\" in 3.5.I; Cagliostro again in 3.7.VIII |\n| **Phantasm / Phantasmagory** | Unreal appearance posing as substance; the court, the Paris crowd seen from outside, even whole reigns. The family runs to about two dozen occurrences. | The deathbed of Louis XV, 1.1.IV (\"a hollow phantasmagory\"); 1.6.I; the \"new Realities are not yet come: ah no, only Phantasms\" of the last chapter |\n| **Buckram / Tailor and Upholsterer** | A cluster from his earlier *Sartor Resartus*: society as stuffed clothes with no body. In the Sansculottism vision, the world has become \"the work of the Tailor and Upholsterer mainly, and men were buckram masks.\" | 1.6.I |\n| **Respectability** | The comfortable conventional person, who in Carlyle is almost always a mild target (about twenty-six occurrences of the word and its variants). At the return from Varennes a deputy is dismissed as \"a mere respectability, and man of whom all men speak well.\" In the last chapter, \"all the Gigs of Creation\" burn, and RESPECTABILITY leaves the earth. | 2.4.VIII; the \"ten thousand persons of respectability\" who attended the Cercle Social in 2.3.II; 3.7.VIII |\n| **Foam** | Froth. The court life of the 1780s is \"the lightest-hearted frivolous foam of Existence; yet an artfully refined foam; pleasant were it not so costly, like that which mantles on the wine of Champagne.\" At the climax the foam is what cannot be painted: the chaos of Thermidor. | 1.2.I; 3.6.VII |\n| **Fire / Phoenix / Mahlstrom** | The master metaphor of destruction as renewal. The word \"fire\" alone occurs a couple of hundred times. \"World-Phoenix\" is the hope that something comes out of the ash; \"Mahlstrom\" (three occurrences) is the churning of the crowd. | 1.5.VI; 1.6.I; the sea of fire in 3.7.VIII |\n| **Chaos / Anarchy** | The dissolution of old form. Carlyle is not cheering; he says that Anarchy is to be hated \"as Death.\" | Passim; 3.7.VII |\n| **Gospel / Evangel** | His word for what a people believes. The \"Gospel according to Jean-Jacques\" is Rousseau's creed as a secular scripture that drives the age; in the Thermidor book he writes that \"Evangel of Jean-Jacques, and most other Evangels, becoming incredible,\" leave only the old Evangel of Mammon. | 1.2.VII \"Contrat Social\"; 3.7.VII |\n| **Mumbo-Jumbo** | Carlyle's term for idol-making. In 3.6.IV he sets the African Mumbo-Jumbo of the woods beside Robespierre's \"new Deity\" and prefers the African: the Paris one is \"a conscious Mumbo-Jumbo, and knows he is machinery.\" Not a general term for any idol; here it names a state religion that knows itself to be a device. | 3.6.IV, \"Mumbo-Jumbo\"; also in 3.5.IV |\n| **Seagreen / Incorruptible** | Robespierre. \"Seagreen\" is his complexion (first met as \"pale sea-green\" in 1.4.IV), \"Incorruptible\" his public title; the pair is a refrain (about twenty-six and thirty-two occurrences), used with a mix of pity and contempt. | 1.4.IV to 3.6.VII |\n| **Menads / Menadism** | The Paris women, especially in the October march to Versailles; from the Greek maenads. Not an insult exactly; a diagnosis of ecstatic violence. The word and its derived forms occur about fifty times. | 1.7.IV \"The Menads\"; revived in 3.7.IV when the bread riot of Germinal recalls \"the Menads of Maillard, five years ago\" |\n| **Tail / Queue** | The bread line: \"Queues, or Tails,\" people \"arranged in tail, so that the first come be the first served.\" A second sense appears at the end: after Thermidor the \"Tail of Robespierre\" means his remaining followers. | 1.6.IV \"In Queue\"; 3.6.VII, 3.7.I |\n| **Cromwell-Grandison** | Lafayette. Carlyle's own coinage, with the hyphen's first element showing the Cromwell side: \"a Lafayette; whose name shall be Cromwell-Grandison, and fill the world.\" The word is not glossed. The second half is, by general consensus, an allusion to the faultlessly gentlemanly hero of Samuel Richardson's novel *Sir Charles Grandison* (1753); the text itself does not name Richardson. Later the order reverses: \"O thou poor Grandison-Cromwell!\" (the Gutenberg file prints \"pour,\" evidently a typo). | 1.4.IV (first use); 2.6.I (reversed form); the Index of the Gutenberg edition lists it under Lafayette |\n| **Hero of Two Worlds** | Also Lafayette, but not Carlyle's invention: it is a stock epithet for a man who fought in America and led in France. He uses it with growing irony: \"With inexhaustible patience, the Hero of two Worlds remonstrates\" (2.3.III), \"colossal Hero of two Worlds... a gossamer Colossus\" (2.6.I), and the farewell \"Adieu, thou Hero of two worlds; thinnest, but compact honour-worthy man!\" (2.6.VIII, when Lafayette rides into Austrian hands). | 2.3.III to 2.6.VIII |\n| **Austrian Committee** | A suspected but, as far as the text shows, imagined cabal. Carlyle writes: \"Is there not what we may call an 'Austrian Committee,' *Comité Autrichien*, sitting daily and nightly in the Tuileries? Patriotism, by vision and suspicion, knows it too well!\" The phrase is a record of what Paris believed, not a claim by Carlyle that the committee existed. About seven uses, all in the second volume. | 2.4.I, then 2.5.II, 2.5.V, 2.5.XI, 2.5.XII and 2.6.I |\n| **ci-devant** | \"Formerly.\" A title for dethroned nobles. Not Carlyle's coinage; about thirty-four occurrences, almost all (thirty-two) in the third volume. | 3.1 onward |\n| **Ça-ira** | \"It will go.\" The Revolution's marching song, recurring as a refrain; first met at the Federation. | 2.1.VI \"Je le jure\" onward |\n| **Lanterne** | The lamp-iron on which mobs hanged enemies. A character in itself. | 1.5.IX \"The Lanterne\" |\n| **Septemberer** | A participant in the September massacres. | 3.1.VI, 3.3.II |\n| **Cimmerian** | The coalition of foreign powers, in a Homeric word for a land of darkness. \"Cimmerian Coalition\" is his standing phrase for the invaders. | 1.7.X onward; 3.7.III |\n| **Moneybag / Mammon** | The new aristocracy that replaces feudal parchment; for Carlyle, \"the basest yet known.\" | 3.3.I and 3.7.VII |\n\nTwo entries from the usual \"Carlylese\" lists are conspicuously absent. **Dryasdust**, the name for the historian who piles up facts without feeling, does not appear in the 1837 text; it comes from Walter Scott's prefaces, where it is the name of an imaginary antiquary, and Carlyle took it up later, notably in his work on Cromwell [4]. **Dilettantism** and its spelling variants are likewise absent from the French Revolution. If you find them in a guide to \"reading Carlyle,\" the guide is drawing on the whole body of his work. In this book, the nearest figure for the dull historian is Carlyle himself arguing against the dull account, not a named character.\n\nTwo entries need a note on method. First, \"Procession\" is not a term Carlyle defines, and it is not a standard term in the criticism that could be traced; it is a reader's shorthand for a recurring image, and it is left out of the table. The image itself is real and worth watching for. At Longchamp, in 1.2.VI, the carriages of the court roll by \"steady, of firm assurance, as if it rolled on adamant and the foundations of the world; not on mere heraldic parchment,—under which smoulders a lake of fire,\" and the passage ends in a scriptural warning to sow the wind and reap the whirlwind [1]. There is also a chapter actually titled \"The Procession\" (1.4.IV), which is the procession of the Estates at Versailles on 4 May 1789, and a later one entitled \"Procession of the Black Breeches\" (2.5.XII), a mock parade of the poor. The three share a word, not a single motif, and the best use of the idea is as a prompt: when a parade appears, ask who is marching and what is under the road.\n\nSecond, \"Cromwell-Grandison\" is an easy joke to over-read. The coinage pairs a revolutionary strongman with a pattern of gentlemanly virtue, and the paragraph around it makes the pairing a double-edged compliment: Lafayette sticks to \"the Washington-formula\" and can become \"a hero and perfect character, were it but the hero of one idea.\" Whether he is \"too decent for the job,\" as a reader might paraphrase it, is an interpretation; Carlyle's text says only that he is a hero of one idea.\n\n## 4. Epithets and Refrains: The Music\n\nCarlyle's way of keeping hundreds of people straight is the **epithet**. A figure is tagged once and the tag then follows him: the *seagreen* Incorruptible, the *Menads*, *Cromwell-Grandison*. The tag is a character note. When it changes, you are being told the man has changed.\n\nThree other kinds of recurrence:\n\n**Refrains.** Phrases that return like a chorus, sometimes at the end of a chapter. \"Poor Louis\" is the best: he first uses it of Louis XV (\"In such a decadent age... had our poor Louis been born,\" 1.1.II) and gathers it in the deathbed chapter (\"Thou hast done nothing, poor Louis! Thy fault is properly even this, that thou didst *nothing*,\" 1.1.IV), then of Louis XVI many times through the first two volumes (1.5.VII, 1.7.XI, 2.1.I, 2.4.I, 2.4.II and beyond), and the pity deepens as the book goes on [1]. The same method gives \"poor Queen\" and \"Poor Marie Antoinette.\" The refrain does not mean he is soft on the monarchy. It means that he sees people crushed by a system they cannot steer, and he will say so out loud.\n\n**Structural echoes.** The Longchamp parade of the first volume has an answer in the later \"Procession of the Black Breeches,\" and the foam of the court has its answer in the unpaintable foam of Thermidor. The \"whiff of grapeshot\" that Broglie is said to hold in reserve in 1789 (1.5.III) is the phrase that reappears as the chapter title of 3.7.VII, when the Convention's young general finally uses it. If you notice a scene that rhymes with an earlier scene, you have found a structural joint.\n\n**Lists as music.** He loves to pile up names and categories into a rhythm. In 1.6.I: \"Hierarchies and Dynasties of all kinds, Theocracies, Aristocracies, Autocracies, Strumpetocracies, have ruled over the world; so it was appointed... that this same Victorious Anarchy, Jacobinism, Sansculottism, French Revolution... should have its turn\" [1]. The goal is cadence, not information. You are allowed to hear it and move on.\n\n## 5. Syntax: How to Parse the Sentences\n\n### Inversions\n\nVerb first, subject last. \"So rolls and dances the Procession.\" \"Volition bursts forth involuntary.\" Read it as if it were \"The Procession rolls and dances so,\" and move on. This is the single easiest Germanism to defuse. The same is true of \"Wo also to many a one who is not wholly buckram\": \"Woe also,\" in an old spelling.\n\n### Dashes, semicolons and the stutter\n\nHe strings clauses together with dashes and semicolons, giving a stuttering, breathless pace. It is meant to sound like a crowd running. Do not try to hold the whole sentence in your head. Treat each dash as a breath.\n\n### Exclamations and questions\n\nExclamation marks and rhetorical questions are the narrator's pulpit voice. The questions are almost never real. In 2.4.IX, after the failed flight to Varennes, he asks: \"Was the meaning of our so glorious French Revolution this, and no other, That when Shams and Delusions, long soul-killing, had become body-killing, and got the length of Bankruptcy and Inanition, a great People rose and, with one voice, said, in the Name of the Highest: *Shams shall be no more?*\" The sentence is a sermon: it wants the answer yes, and it wants you to feel the price [1].\n\n### Apostrophe: addressing the absent\n\nThe most characteristic device is speaking to people who cannot hear him. \"Smite, thou Louis Tournay.\" \"Dance on, ye foolish ones.\" \"Thou hast done nothing, poor Louis!\" He addresses a king, a cartwright, an entire class. When you see \"thou,\" the voice has gone from reporting to prophecy. The archaic pronoun is a flag. In the full Gutenberg text \"thou\" itself occurs about three hundred times, and with \"thee,\" \"thy,\" \"thine\" and the plural \"ye\" the archaic forms come to some seven hundred; not the thousands that an impression of the book suggests, but dense enough to mark every pulpit passage [1].\n\n### Compounds\n\nHyphenated compounds (\"fire-consummation,\" \"soul-killing,\" \"body-killing\") are Germanisms in structure. Read them as a single piece: noun-noun or adjective-noun fused. They are worth spelling out slowly the first time and skimming after.\n\n## 6. The German Habits (and What You Can Ignore)\n\nCarlyle learned his manner from German Romantic prose, above all Jean Paul Richter, and from Goethe's symbol-seeing sense of things. A reference summary of the scholarship says that in his essays on Jean Paul Carlyle rejects the dismissive, ironic humor of Voltaire in favor of Jean Paul's warm, sympathetic kind [5]. You do not need to read any of those writers. What matters for a reader is three consequences.\n\n1. **Humor and tenderness coexist.** The same sentence can mock and mourn. Do not expect a single emotional register per paragraph. A typical example is his farewell to Robespierre at the foot of the scaffold, hard for a whole volume and then: \"O unhappiest Advocate of Arras, wert thou worse than other Advocates?\" (3.6.VII).\n2. **Symbols are meant to be real.** Carlyle thinks a flag, a crown, a guillotine is a literal embodiment of what a people believes. When he says Sham he is not just being rude; he means the symbol no longer points to anything.\n3. **Capital letters are philosophical.** Reality, Truth, Necessity, Anarchy are Germanic abstractions in capitals, treated as forces. If you read them as ordinary nouns the passage will seem silly. Read them as characters.\n\nCarlyle's coinages are a real contribution to English, not mere oddity. A reference table that draws on the Oxford English Dictionary Online (2012) counts 547 first quotations for him, of which 87 are words in common use today; those figures could not be checked against the dictionary itself, so they stand as one source's report rather than as a settled number [5]. The same reference page records \"Carlylese\" as first appearing in 1858, which is to say, no one in 1837 had a name for what they were reading [5].\n\n## 7. Humor, Mock-Heroic, and How to Know He Is Being Ironic\n\nThis is the part new readers miss. Carlyle is frequently funny, and the humor is the key to his position.\n\n### The mock-heroic\n\nHe deflates the grand by treating it in epic or biblical terms and then letting the tone slip. The court of the 1780s is \"the lightest-hearted frivolous foam of Existence; yet an artfully refined foam; pleasant were it not so costly, like that which mantles on the wine of Champagne\" (1.2.I) [1]. The comparison to champagne foam is the joke: it is pretty, and the bill is the Revolution.\n\nHe reverses it too. A cartwright, a wine merchant, a dragoon are given Homeric treatment. The effect is to level the aristocracy and elevate the crowd.\n\n### Six working signals for irony\n\n1. **Capitalized words used flatly.** When Respectability, Order, Constitution or Philosophe appears in capitals with a deadpan description, the capital is the quotation marks.\n2. **The bathetic drop.** A grand build-up ending in something small or silly (\"Strumpetocracies\" in the list of solemn government types) is a signal that the list is a joke.\n3. **Pity phrasing.** \"Poor,\" \"unhappy,\" \"hapless\" attached to a powerful figure means pity and contempt in the same breath.\n4. **Mock-formal address.** \"Messieurs of the popular Triumvirate: Never!\" (2.4.IX). The address to the Barnave Triumvirate is part serious, part mock.\n5. **Italicized foreign phrases.** An italic French phrase, especially a bureaucratic or military one, is often being held up with tongs. In the Girondin chapters, *Les cochons, les imbecilles* is Marat's, quoted with relish in 3.3.III.\n6. **Pairs that do not match.** \"Cromwell-Grandison,\" \"Sham-Priest,\" \"Strumpetocracies.\" Whenever two incompatible things are joined by a hyphen, the hyphen is a punchline.\n\n### Where he is not being ironic\n\nThe sermons. When he writes \"This day it is declared aloud, as with a Doom-trumpet, that a Lie is unbelievable\" (1.4.IV), he means it [1]. So when the tone climbs toward the Biblical (thou, ye, \"Was it not, from of old, written\"), assume sincerity. The hard part is the transition. A useful test: does the sentence ask you to look *at* something (irony) or to kneel *to* something (sermon)? Ask it and you will mostly be right.\n\n## 8. Three Voices: Narration, Sermon, and Lyric\n\nThink of the book as three registers in rotation.\n\n**Narration** is present tense, scene-bound, moving. It hands you the facts in a hurry. Details: names, places, times.\n\n**Sermon** steps out of the scene and interprets it, usually with \"thou,\" \"ye,\" exclamations and Biblical echo. It often closes a chapter. The pattern is: scene, then a paragraph of verdict. If the narration is the drama, the sermon is the chorus. The Longchamp parade is the model: a splendid image of carriages, then the warning \"Dance on, ye foolish ones; ye sought not wisdom, neither have ye found it. Ye and your fathers have sown the wind, ye shall reap the whirlwind\" (1.2.VI) [1].\n\n**Lyric** is the breathless, nature-flooded passage: dawn over a city, a river of people, the sea. It is the shortest register and the most beautiful. It tends to appear at the moment before a catastrophe. A modest example is the Thermidor night, where the \"meek brightness\" of the moon passes along \"the great Ring-Dial of the Heaven\" while \"on Earth all is confused shadow and conflict\" (3.6.VII) [1].\n\nWhen you lose the thread, ask which register you are in. Narration needs your attention to events. Sermon needs your attention to the argument. Lyric needs only your ear.\n\n## 9. Names, Spellings, and Untranslated French\n\n### Odd names and spellings\n\nCarlyle writes some words in a way that can look wrong: \"Mahlstrom\" for maelstrom (the German-Dutch spelling), \"Menads\" for Maenads, \"Bourdeaux\" for Bordeaux, \"Sansculottism\" itself. Titles and nicknames are often translated or glossed in the same sentence, so a French term is followed by its English rendering. Do not hunt for modern spellings; use the context.\n\nMany figures appear under shifting labels (the Gironde and the Girondins are the same faction under two names; the Mountain and the Jacobins overlap). A short cast list at your elbow will save you more time than any dictionary. Another part of this primer supplies one.\n\n### Untranslated French\n\nFrench quotations, slogans and legal phrases are italicized and often not translated. Most of the time the surrounding sentence gives you the gist. Examples: *la Lanterne*, *ça-ira*, *faisant le mort* (\"playing dead,\" said of the King's Government in 2.4.II) [1]. If you do not read French, treat each as local color first and look them up only if they seem to carry the argument. A good annotated edition does this for you. The Oxford World's Classics edition by Sorensen, Kinser and Engel is described by its publisher as a critical text based on the 1837 first edition, with explanatory notes and an annotated index; see the edition guide in this primer for options [6].\n\n## 10. When He Is a Historian and When He Is Not\n\nA reader should keep a second voice in mind: the critic who asks whether this is true. Carlyle compresses, he invents interior speech, he omits what does not suit, and his adjectives carry his politics. Hugh Trevor-Roper is among those who objected to the drama, the personal judgments and the rhetorical interruptions in Carlyle's histories, a criticism Vanden Bossche reports and then answers by treating those features as the point [3]. Treat the vividness as evidence of his method, not of the event. Where the book's reliability matters, check the companion pieces on chronology and sources. For reading purposes, keep two notebooks in your head: *what happened* (names, dates, outcomes) and *what Carlyle wants me to feel*. They overlap and they diverge.\n\nThackeray's own advice is worth repeating: the book demands patience, and its merits are better known to those who persevere [2]. That is a fair summary of what this chapter is for.\n\n## 11. The Greatest Hits: Passages Worth Reading Even If You Skip the Rest\n\nThe following are chosen because they work as free-standing set-pieces and teach you the idiom fast. Chapter names and numbers are those in the Gutenberg table of contents, and each passage was re-read in the text [1].\n\n1. **\"Louis the Unforgotten\" (1.1.IV).** Within Book I, the deathbed of Louis XV. Opens with \"Poor Louis!\" and a sermon on mortality, and the refrain gathers here. It tells you the voice.\n2. **The Longchamp parade, in \"Windbags\" (1.2.VI).** Gilt carriages as flower-borders, the warning about sowing the wind, and the whole Paper Age (\"this its Paper Age, or Era of Hope\") in a page.\n3. **The Sansculottism passage at the opening of 1.6.I (\"Make the Constitution\").** The vision of SANSCULOTTISM rising from the earth is the moment where the book's central character is introduced. Short and hot.\n4. **\"The Menads\" through \"To Versailles\" (1.7.IV-VI).** The October march: the crowd as protagonist, with Usher Maillard as the close-up.\n5. **\"Storm and Victory\" (1.5.VI).** Present tense, camera cuts, Louis Tournay, Fire-Mahlstrom: the clearest demonstration of everything in Section 2.\n6. **Varennes: \"The New Berline\" through \"Sharp Shot\" (2.4.V-IX).** Almost a thriller. Drouet's night ride and the king's capture, with Carlyle's deadpan irony about the \"respectabilities.\"\n7. **\"September in Paris\" (3.1.IV).** The massacres. Read it slowly to see how he handles horror without euphemism and without absolution.\n8. **\"Charlotte Corday\" (3.4.I).** A clean character study with lyric air.\n9. **The king's trial and death: \"At the Bar,\" \"The Three Votings,\" \"Place de la Révolution\" (3.2.VI-VIII).** A masterclass in the slow track and close-up. He does not shy from the death.\n10. **\"The Tumbrils\" and \"Mumbo-Jumbo\" (3.6.III-IV).** The Terror at its most intense; Mumbo-Jumbo is the book's thesis on idolatry.\n11. **\"The Whiff of Grapeshot\" and \"Finis\" (3.7.VII-VIII).** The ending, where the Revolution is closed by the soldier and Carlyle declines to resolve it neatly: \"Homer's Epos... does not conclude, but merely ceases.\"\n\nIf you only have a weekend, read items 1, 3, 5, 6, 9 and 11, in that order, and you will have the shape of the book.\n\n## 12. Stumbling Blocks and a Method\n\n### The five usual stumbling blocks\n\n1. **Name-overload in the first hundred pages.** The Court and the Paper Age chapters carry long lists of unfamiliar people. Skim them. They set a mood, not an exam.\n2. **The jump between scene and sermon.** You may reread a paragraph three times before realizing it is a sermon. Look for \"thou\" and \"ye.\"\n3. **Metaphor chains.** Fire, ocean, ghosts, clothes: these repeat. If a metaphor loses you, ask whether it is fire, flood, ghost or clothes.\n4. **Untranslated asides.** Treat as texture.\n5. **Assuming it is a textbook.** If you want dates and clean causation, read a modern narrative first or alongside. Carlyle presumes you know the outline.\n\n### A method that works\n\n- **Read aloud.** Not the whole book, but any sentence that jams. Carlyle wrote for the ear; the dashes and inversions fall into place when you speak them.\n- **Read for the set-piece.** Each chapter is a short scene with a title. Ask: what is the picture? What is the verdict? Then go on.\n- **Tolerate fog.** There will be paragraphs where the images stack and the point stays out of focus. Let them go by. The next scene will clarify what the last one blurred.\n- **Mark the capitals.** The first time you see a recurring Capitalized word, circle it. By its third appearance you will know what it does.\n- **Keep a cast list nearby.** Epithets are only helpful if you know whom they refer to.\n- **Read in short sessions.** The prose is high-calorie. Twenty to thirty pages a sitting is about right. Move on when you flag.\n- **Notice the humor.** If you are enjoying yourself, you are reading him correctly.\n\n## Open Questions\n\n- The frequencies given for recurring words come from a text search of one edition, and spellings and capitalization vary; treat them as order of magnitude.\n- Scholarly accounts of exactly how much of Carlyle's irony is directed at the narrator's own prophetic pose (a self-mocking element) were available here only in summary. A dedicated reading of Rosenberg, Levine and Vanden Bossche in full would sharpen Section 7; only Vanden Bossche's account of the narrator is cited, and only as far as the Victorian Web pages carry it.\n- Whether \"Procession\" is a recognized critical term in the secondary literature is not established; it is treated in Section 3 as a reader's shorthand for a recurring image, not as established vocabulary.\n- The \"Grandison\" in \"Cromwell-Grandison\" is conventionally read as Richardson's hero; the text does not say so, and no critical source that settles the point beyond that convention could be traced.\n- The Oxford English Dictionary figures (547 first quotations, 87 in common use) come through a reference summary and have not been checked against the dictionary itself; the 1858 date for \"Carlylese\" likewise.\n- Which scene is \"the\" greatest passage is a matter of taste; the list above weights teaching value as much as literary quality.\n\n## Sources\n\n1. Carlyle, Thomas. *The French Revolution: A History* (1837). Project Gutenberg eBook #1301; the file does not name its source printing. Primary text; every quotation, chapter reference and word count above comes from this text. https://www.gutenberg.org/ebooks/1301\n2. Thackeray, William Makepeace. Review of *The French Revolution: A History*, The Times, 3 August 1837; text hosted on the Victorian Web, source of the quoted style passage and the \"prose run mad\" sentence. https://victorianweb.org/authors/wmt/carlyle.html\n3. Vanden Bossche, Chris R. *Carlyle and the Search for Authority* (Ohio State University Press, 1991); chapters hosted on the Victorian Web (the discussion of the narrator and the \"inverse epic\" reading, with Mill's \"epic poem\" remark and the Trevor-Roper objection). https://victorianweb.org/authors/carlyle/vandenbossche/4a.html ; https://victorianweb.org/authors/carlyle/vandenbossche/3e.html\n4. \"Dryasdust.\" Wikipedia, and Britannica entry on Dryasdust (origin in Scott's prefaces; later use by Carlyle). https://en.wikipedia.org/wiki/Dryasdust ; https://www.britannica.com/topic/Dryasdust\n5. \"Thomas Carlyle's prose style.\" Wikipedia. A reference summary that reports the Jean Paul and Voltaire contrast, the OED Online (2012) figures on Carlyle's first quotations, and the 1858 first record of \"Carlylese.\" Secondary source. https://en.wikipedia.org/wiki/Thomas_Carlyle%27s_prose_style\n6. Carlyle, *The French Revolution*, ed. David R. Sorensen, Brent E. Kinser and Mark Engel, Oxford World's Classics (2019): publisher's listing, which describes a critical text with the 1837 first edition as copy-text, explanatory notes and an annotated index. https://www.oupjapan.co.jp/en/products/detail/25181\n7. The companion study of the book's style and allusion, including its reporting of Mill, Holloway, Landow, Talbot and Allison (a separate study in the same library). Tier 5; cross-reference only."}, {"order": 7, "file": "07_Editions_Companions_And_A_Reading_Plan.md", "title": "Editions, Companions and a Reading Plan", "summary": "Which Carlyle to buy or download, what to read beside it, where he cannot be trusted, and a six-week and twelve-week schedule across all twenty books, plus the ten chapters to read if you read nothing else.", "body": "# Editions, Companions and a Reading Plan\n\n## Bottom Line\n\nRead the Oxford World's Classics paperback (2019, about 900 pages) if you want notes and a carefully edited text, or the free Project Gutenberg file if you want to start tonight; pair either with the LibriVox audio, because this book is written to be heard. Keep one balanced modern history to hand (Doyle's *Oxford History* is the safe pick), treat Carlyle's set pieces as dramatized testimony rather than a record, and move at roughly three books a week for six weeks, or two for twelve, with ten chapters as your emergency ration. The main text runs to about 288,000 words, so this is a long book but not an endless one.\n\n## Choosing a text\n\nThe decision is simpler than the shelf suggests. As of October 2026 there are two real options for a general reader, one used-market option, and one for a library.\n\n**The one to buy: Oxford World's Classics (2019).** This is *The French Revolution*, edited by David R. Sorensen and Brent E. Kinser, with Mark Engel credited in Oxford's biographical note, ISBN 9780198815594 [1][2]. Retailers list it at 944 pages; the Open Library record gives 896, so treat \"roughly 900\" as the safe figure and trust the copy in your hand [2]. Oxford describes it as a critical text based on a collation of the 1837 first edition, with a new index and chronologies [1]. For a reader who has never met the Revolution, the notes are the point: Carlyle name-drops two or three people a page and assumes you know who they are. It replaces the older Oxford World's Classics text of 1989, edited by K. J. Fielding and David Sorensen (ISBN 0192818430), which library catalogues still list [4]. Prefer the 2019 volume; whether the 1989 one is still in print is unconfirmed.\n\n**The strictly scholarly one: the three-volume Oxford edition (2020).** *Thomas Carlyle: The French Revolution: A History* (ISBN 9780198809159) is edited by Mark Cumming and David R. Sorensen, with Mark Engel and Brent E. Kinser as text editors, and published by Oxford University Press in 2020 [3]. A university faculty directory lists it as an Oxford Scholarly Edition and records that it received the Modern Language Association's Scholarly Editions Award in 2021 [3]. Its volumes carry individual ISBNs (9780198809166, 9780198809173, 9780198809180) [3]. It is a library purchase, not a reading copy. It is sometimes described as a \"Clarendon Edition\", but no source uses that label, so do not use it. The University of California Press Strouse Edition of Carlyle's works has no *French Revolution* volume [5]. Do not go looking for it there.\n\n**The used-market one: Modern Library (2002).** A paperback with an introduction by John D. Rosenberg, ISBN 9780375760228, listed at 848 pages by one retailer (the Open Library record gives xliii plus 798) and described as complete and unabridged [6]. Retailers list it as out of stock, so it is a secondhand option. It is a serviceable reading text with fewer notes than the Oxford, and how its text was established is unclear, so check any quotation against the Oxford or Gutenberg before you use it.\n\n**What does not exist.** There is no current Penguin Classics edition. The Everyman's Library edition exists only as the old Dent/Dutton two-volume set with an introduction by Hilaire Belloc, which library catalogues date from the early 1900s through the 1970s; there is no current printing [25]. Cheap reprints, print-on-demand paperbacks and AI-narrated audio listings also circulate under Carlyle's name. They are usually the public-domain text with no notes. Nothing wrong with that, but you get no help with the allusions.\n\n**A note on abridgements.** Many old school editions cut the book heavily. If the page count on the back is well under 500, you are probably reading a digest, and you will miss the long accumulating rhythm that makes the book work.\n\n## The free options\n\n**Project Gutenberg #1301.** The complete text, all three volumes in one file, released 15 February 2006 and last updated 8 February 2025, in EPUB, Kindle, HTML and plain-text formats [7]. Its table of contents lists every Book and chapter title, which makes it a good navigation tool even if you are reading a paper copy [7]. Chapters are numbered by volume, book and chapter (for example 2.4.VII), and that is the system this plan uses. The file also includes Carlyle's own footnotes and an index of the people and places. Gutenberg gives you Carlyle's words with none of the editors' help, and it does not tell you which printing of his text you are reading. For a first trip through, that rarely matters.\n\n**LibriVox, the volunteer audio.** All three volumes are on LibriVox, and the running times below come from the catalogue pages [8]:\n\n| Volume | Reader | Running time |\n| --- | --- | --- |\n| I, *The Bastille* (Version 2) | Peter Dann | 11:09:15 |\n| II, *The Constitution* | Gillian Hendrie | 13:25:17 |\n| III, *The Guillotine* | Peter Dann | 12:44:56 |\n\nThat is about 37 hours and 19 minutes in all. A second, separately catalogued recording of Volume I by a group of volunteers runs 11:11:33 [8]. Volunteer recordings vary in quality; if one reader grates, the other version of Volume I is worth sampling. A commercial narration (Robert Bethune, listed as published in 2009) also exists; I did not find a free source for it [8].\n\n**The Internet Archive and HathiTrust.** The Internet Archive holds scans of the 1837 first edition. One is the James Fraser printing (Fraser published the original three-volume edition) at https://archive.org/details/frenchrevolutio16carlgoog [9]. Another is catalogued as Chapman and Hall, 1837, Volume I, at https://archive.org/details/carlylefrenchrevolution01 [9]. A Google-digitized copy of Volume II also appears as https://archive.org/details/frenchrevolutio19carlgoog. Internet Archive dates and imprints come from volunteer cataloguing, so check the title page before you cite a scan as the true first edition. HathiTrust holds digitized Victorian printings, among them a Harper and Brothers (New York) edition of 1851 and a Chapman and Hall (London) printing of 1871 [10]. These are useful if you want to see the book as the Victorians held it, and a poor way to read it. No complete *French Revolution* text on Wikisource could be confirmed, though the site carries an index of Carlyle's collected works.\n\n**How long it is.** A word count of the Gutenberg file puts the narrative itself, from the first chapter to the farewell at the end of Volume III, comes to about 288,000 words: roughly 89,600 in Volume I, 96,600 in Volume II and 101,600 in Volume III. The index adds about 6,600 words and Carlyle's end-of-file footnotes about 7,600 more. These are counts of the Gutenberg text, not of the Oxford page. At a plain 250 words a minute, silent reading comes to about 19 hours; at 200 words a minute, about 24 hours. Carlyle slows nearly everyone down, so budget 25 to 30. These are estimates from the count, not published figures. The volunteer audio is slower than silent reading: 288,000 words in about 37 hours is only about 130 words a minute.\n\n**The recommendation.** Buy the Oxford paperback. Install the Gutenberg EPUB on your phone for commuting. Play the LibriVox chapter while you follow along on the page for the first two or three books, until the rhythm becomes familiar. Carlyle wrote in a present tense full of shouts, exclamations and inversions; hearing a chapter aloud is the quickest way to stop fighting the sentences.\n\n## Reading Carlyle's sentences\n\nA few habits of the prose are worth knowing before you start, because they are visible in the contents page itself. Carlyle coins words: \"Patrollotism\" (1.7.I), \"Culottic and Sansculottic\" (3.3.II), \"Mumbo-Jumbo\" (3.6.IV). He titles chapters with a shout, \"To Arms!\" (1.5.IV) or \"Give us Arms\" (1.5.V), and with a flat label, \"Inertia\" (1.5.I). He gives people epithets and repeats them until they stick. He addresses you directly, and at the end of Volume III he says goodbye to you in words that end: \"Farewell.\"\n\nNone of this is decoration. The present tense and the interjections keep you inside the event instead of looking back at it, and the coinages are his way of naming forces he thinks earlier historians had no words for. When a sentence has you stumped, read it aloud once and look for the main verb; it is usually there, buried under apposition.\n\n## What to read beside it\n\nCarlyle gives you the Revolution as a sequence of tableaux. He does not give you a map. Three jobs need doing by something else: supplying the chronology, filling in the structural causes he treats as moral weather, and correcting him where scholarship has moved on. No single companion does all three, so pick by job.\n\n**For a backbone: William Doyle, *The Oxford History of the French Revolution*.** First published by Oxford University Press in 1989, with a second edition in 2002 and a third in 2018 (ISBN 9780198804932, 512 pages in the paperback listing) [11]. It runs from the accession of Louis XVI in 1774 to Napoleon's consolidation in 1802 and has been widely used as a textbook. What it does for a Carlyle reader: it tells you who is who, in order, without a thesis fighting you. What it does not give is pleasure; its strength is political chronology. If you read one companion, read this, in installments alongside the matching Book.\n\n**For a rival narrative: Simon Schama, *Citizens: A Chronicle of the French Revolution* (1989).** Roughly 900 pages, ending with Robespierre's death in 1794, and written as a vivid narrative [12]. Its thesis is that violence was central to the Revolution from the start. Reviewers split between admiration for the writing and the charge that it is hostile to the Revolution it describes [12]. For a Carlyle reader the interest is double: it is the closest modern equivalent to the narrative-with-attitude tradition he founded, and it shares his tendency to read the whole Revolution through its violence. Read it after you finish Carlyle, so that two charismatic narrators do not blur together. Page counts online differ by edition, so trust the edition in your hand.\n\n**For the cultural lens: Lynn Hunt, *Politics, Culture, and Class in the French Revolution* (1984; later editions, including a twentieth-anniversary one with a new preface, are in print).** It argues that the Revolution should be understood through its political practices, symbols and rhetoric, in two parts: \"The Poetics of Power\" and \"The Sociology of Politics\" [13]. This is the book to read if you want to know why Carlyle's tricolour cockades, oaths, festivals and sacred language sound so odd and so insistent. The Feast of Pikes (Volume II, Book 1) is a Hunt chapter in Carlyle's hands, and her work gives you the vocabulary he lacked.\n\n**For the Terror's causes and for the flight to Varennes: Timothy Tackett.** His *The Coming of the Terror in the French Revolution* (Harvard University Press, Belknap, 2015; about 460 to 480 pages depending on the count) asks why the Revolution produced the Terror and answers in terms of the changing mindset of revolutionary leaders and the revolutionary process itself [14]. His *When the King Took Flight* (Harvard University Press) is the standard modern book on Varennes: a hardcover of 2003 (about 270 pages) and a paperback of 2004 [15]. Read Tackett's Varennes after you have read Carlyle's, and Carlyle's Terror before you read Tackett's, because the contrast is the lesson.\n\n**For the book's best-known echo: Dickens, *A Tale of Two Cities* (1859).** Dickens's preface says he hoped \"to add something to the popular and picturesque means of understanding that terrible time\", while allowing that \"no one can hope to add anything to the philosophy of Mr. Carlyle's wonderful book\" [16]. Both phrases appear in the preface as printed in the Standard Ebooks text. The National Endowment for the Humanities' magazine adds that Dickens relied heavily on the book while writing the novel [17]. You will recognise the cadence, the recurring images of storm and tide, and the sudden close-ups. Read the novel before Carlyle if you want a gentle on-ramp, or after if you want to watch a master novelist domesticate a prophet's rhythms. Either order works.\n\n**Carlyle's own sources and rivals: Thiers and Mignet.** François Mignet's *Histoire de la Révolution française* appeared in 1824 and Adolphe Thiers's in ten volumes from 1823 to 1827; both belong to the liberal tradition and were hugely popular in their day [23]. They are the books against which Carlyle's narrative reacts. They are worth sampling only if you are curious about the older, smoother kind of narrative. The sources he leaned on most heavily are the contemporary pamphlets, newspapers and memoirs of the period; the NEH account notes that John Stuart Mill gave Carlyle his library of books and pamphlets [17]. The Oxford edition's notes are the place to trace them chapter by chapter.\n\n## What to read first, what after\n\nThe sensible order, for a reader who knows little about the Revolution:\n\n1. **A short chronology.** One page: 1774 (Louis XVI), 1789 (States-General, Bastille, October Days), 1791 (Varennes), 1792 (the Tuileries, the September killings), 1793 (the king's execution, Charlotte Corday, the Terror), 1794 (Thermidor), 1795 (Vendémiaire). The other volumes in this primer give it in detail.\n2. **Carlyle, Volume I, Books 1 and 2**, without a companion. Let him set the tone. If you hate the opening chapters (1.1.I to 1.1.II), you will hate the book, and it is better to know in the first week.\n3. **Doyle in the margin** from Book 3 onward, a chapter or two when you lose the thread.\n4. **Carlyle finished, then Schama or Tackett.** The moment you close Volume III is the moment you can enjoy being argued with.\n5. **Dickens last**, as a coda, or first, as a primer.\n\nIf you only have patience for one of the two narrators, read Carlyle for the sensation and Doyle for the facts.\n\n## What to distrust\n\nCarlyle claimed to be after truth, and many readers have taken him at his word. A first-time reader needs a short, honest list of where the ground is soft. It is limited to what can be traced to a text or a named scholar.\n\n**1. Varennes: accuracy bends to picture.** The cleanest case is a number you can check yourself. In 2.4.VII Carlyle writes that the fleeing royal family \"accomplishes Sixty-nine miles in Twenty-two incessant hours\" [19]. Oscar Browning, in a paper read to the Royal Historical Society in 1886 (\"The Flight of Louis XVI. to Varennes. A Criticism of Carlyle\") and reprinted in his *The Flight to Varennes and Other Historical Essays* (1892), called this \"a statement of almost incredible carelessness\": the road from Paris to Varennes is about 150 miles, and the royal party covered it in some 23 hours, a good deal faster than Carlyle's figures allow [18]. Browning was a fair critic as well as a hard one. He granted that the narrative is \"in its broad outlines ... consistent with the truth\" and that Carlyle's accuracy \"can be trusted where he has visited the scenes which he describes, and where he is not carried away by preconceived prejudices or ideas\" [18]. He also stated that if his criticisms held, the rest of the book would deserve the same suspicion; that is his conditional argument, not an established result, and later readers have generally kept the Varennes chapters while correcting them. The lesson is not that Varennes is invented. Read it as a reconstruction, and use Tackett for the route, the hours and the people [15].\n\n**2. Proportion follows drama.** The NEH feature observes that the Nancy mutiny of 1790 and the Legislative Assembly's machinations \"receive the same number of pages\" [17]. The weight of a chapter tells you about its theatrical value, not its historical weight. Do not infer importance from page count.\n\n**3. His sources were vivid, uneven, and prized for being on the spot.** Mill lent him a large library of contemporary books and pamphlets [17]. The practical consequence is that a fine detail may be an eyewitness's panic as readily as a fact. Browning, for one, argued that Carlyle drew his account of the flight mainly from two memoirs, Bouillé's and Choiseul's, each written as a defence of its author [18].\n\n**4. The September killings are a contested episode; read his chapters beside the modern debate.** Tackett puts the toll at 1,100 to 1,400 over four days; a few hundred of the dead were political prisoners (nobles, refractory priests, Swiss guards), and over two-thirds were common criminals [20]. He calls the origins of the massacres \"a difficult problem for historians\", points to the Prussian invasion, the Brunswick Manifesto and fear for the families left behind as immediate circumstances, and stresses the role of rumour of a prison conspiracy [20]. He also records that the active support of members of the insurrectional Commune and its surveillance committee \"greatly facilitated\" the killings, and that many newspapers and revolutionaries at first accepted them [20]. Historians differ on how spontaneous or directed it was. Carlyle gives the episode a chapter (3.1.IV \"September in Paris\") and a related one on the Commune's message to the provinces (3.1.VI \"The Circular\"), and how closely either matches the modern accounts has not been checked. Read them as gripping scenes of a contested event, and check the toll and the prisoners' identity before you quote them.\n\n**5. Mirabeau is Carlyle's hero, and the full evidence came later.** The correspondence between Mirabeau and the Comte de La Marck, covering 1789 to 1791, was published by Bacourt in 1851 [21]; Carlyle's book appeared in 1837, so he could not have drawn on it. Scholars have kept refining Mirabeau's relations with the court since; Munro Price's \"Mirabeau and the Court: Some New Evidence\" (*French Historical Studies* 29, no. 1, 2006, pp. 37–76) is one example [22]. The article's conclusions are not summarised here. Treat his Mirabeau (Volume II, Book 3, Chapters VI and VII) as a portrait, not a ledger.\n\n**6. His politics frame everything.** The book is not a neutral report. Thackeray's review in *The Times* was favourable but called the style \"prose run mad\" [17], a reminder that even admirers saw the strangeness. Carlyle rewards strong leaders (Mirabeau, Danton), mocks parliamentary talk, and treats the revolutionaries' violence as horrifying yet explicable by the misery that preceded it; the Revolution is a judgment on a rotten system more than a victory for a doctrine. Expect a moral story told by a man who believes in force of character and distrusts talk, which is not the same as an even-handed one. A list of famous reactions (Mazzini, Michelet, Taine) is left out because it could be traced only to a general encyclopedia page, not to the critics themselves.\n\n**7. The Terror's causes.** Carlyle's explanation is moral and nearly providential. Modern scholarship looks for a mechanism. Tackett attributes the Terror to the leaders' evolving mindset and to the revolutionary process itself [14]. Older debates set interpretations that stress war and counter-revolution (Mathiez, Lefebvre) against those that find the logic of violence already present in revolutionary ideology (Cochin, later Furet) [24]. Carlyle belongs to neither camp, and you will understand him better after reading one of them.\n\nA final caution, about the edition: Oxford says its text is based on the first edition of 1837, so you are reading Carlyle as he first printed himself, with the editors' record of later changes in the apparatus [1]. If you quote a passage, cite the edition you used.\n\n## The reading plan\n\nThe book is **three volumes, twenty books, 159 chapters**, counted from the Gutenberg contents: Volume I *The Bastille* has seven books (50 chapters), Volume II *The Constitution* has six (54), and Volume III *The Guillotine* has seven (55) [7]. The plan below paces by book, because the book is the unit Carlyle built; the chapters are short.\n\n| Book | Title | Chapters |\n| --- | --- | --- |\n| 1.1 | Death of Louis XV | 4 |\n| 1.2 | The Paper Age | 8 |\n| 1.3 | The Parlement of Paris | 9 |\n| 1.4 | States-General | 4 |\n| 1.5 | The Third Estate | 9 |\n| 1.6 | Consolidation | 5 |\n| 1.7 | The Insurrection of Women | 11 |\n| 2.1 | The Feast of Pikes | 12 |\n| 2.2 | Nanci | 6 |\n| 2.3 | The Tuileries | 7 |\n| 2.4 | Varennes | 9 |\n| 2.5 | Parliament First | 12 |\n| 2.6 | The Marseillese | 8 |\n| 3.1 | September | 8 |\n| 3.2 | Regicide | 8 |\n| 3.3 | The Girondins | 9 |\n| 3.4 | Terror | 8 |\n| 3.5 | Terror the Order of the Day | 7 |\n| 3.6 | Thermidor | 7 |\n| 3.7 | Vendémiaire | 8 |\n\nThe totals are 50, 54 and 55, which sum to 159. Note that the book numbers 1.6 and 1.7 appear in the Gutenberg contents as \"Book VI\" and \"Book VII\" without the volume prefix; they are Books 6 and 7 of Volume I.\n\n### Six weeks\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 448\" role=\"img\" aria-label=\"A six-row reading ledger. Each row is a week, drawn as a bar of book blocks sized to chapter counts. Week 1 holds Volume I Books 1 to 3, 21 chapters. Week 2
