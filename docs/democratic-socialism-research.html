-right\" opacity=\"0.3\" style=\"--d:.1s\"/>\n<rect x=\"220\" y=\"100\" width=\"97\" height=\"18\" rx=\"1\" class=\"f-t1 cv-grow-right\" opacity=\"0.55\" style=\"--d:.15s\"/>\n<text x=\"345\" y=\"113\" text-anchor=\"start\" font-size=\"8\" class=\"t-muted\" style=\"fill:var(--t1)\">20&#8211;25%<\/text>\n<text x=\"65\" y=\"106\" text-anchor=\"start\" font-size=\"8.5\" font-weight=\"bold\">Nationalist-Populist Foreclosure<\/text>\n<text x=\"65\" y=\"118\" text-anchor=\"start\" font-size=\"7.5\" class=\"t-muted\">Welfare-chauvinism wins the distributional-grievance constituency; democratic channels narrow<\/text>\n<text x=\"210\" y=\"156\" text-anchor=\"end\" font-size=\"8\" font-weight=\"bold\">B<\/text>\n<rect x=\"220\" y=\"144\" width=\"97\" height=\"18\" rx=\"1\" class=\"f-t2 cv-grow-right\" opacity=\"0.3\" style=\"--d:.2s\"/>\n<rect x=\"220\" y=\"144\" width=\"73\" height=\"18\" rx=\"1\" class=\"f-t2 cv-grow-right\" opacity=\"0.55\" style=\"--d:.25s\"/>\n<text x=\"321\" y=\"157\" text-anchor=\"start\" font-size=\"8\" class=\"t-muted\" style=\"fill:var(--t2)\">15&#8211;20%<\/text>\n<text x=\"65\" y=\"150\" text-anchor=\"start\" font-size=\"8.5\" font-weight=\"bold\">Structural-Crisis Opening<\/text>\n<text x=\"65\" y=\"162\" text-anchor=\"start\" font-size=\"7.5\" class=\"t-muted\">AI unemployment / climate cascade opens an Attlee-1945-style moment; left has infrastructure to capture it<\/text>\n<text x=\"210\" y=\"200\" text-anchor=\"end\" font-size=\"8\" font-weight=\"bold\">D<\/text>\n<rect x=\"220\" y=\"188\" width=\"97\" height=\"18\" rx=\"1\" class=\"f-t5 cv-grow-right\" opacity=\"0.3\" style=\"--d:.3s\"/>\n<rect x=\"220\" y=\"188\" width=\"73\" height=\"18\" rx=\"1\" class=\"f-t5 cv-grow-right\" opacity=\"0.55\" style=\"--d:.35s\"/>\n<text x=\"321\" y=\"201\" text-anchor=\"start\" font-size=\"8\" class=\"t-muted\">15&#8211;20%<\/text>\n<text x=\"65\" y=\"194\" text-anchor=\"start\" font-size=\"8.5\" font-weight=\"bold\">Techno-Oligarchic Foreclosure<\/text>\n<text x=\"65\" y=\"206\" text-anchor=\"start\" font-size=\"7.5\" class=\"t-muted\">AI capital concentration atrophies democratic will-formation; not suppression but structural enfeeblement<\/text>\n<text x=\"210\" y=\"244\" text-anchor=\"end\" font-size=\"8\" font-weight=\"bold\">E<\/text>\n<rect x=\"220\" y=\"232\" width=\"73\" height=\"18\" rx=\"1\" class=\"f-t3 cv-grow-right\" opacity=\"0.3\" style=\"--d:.4s\"/>\n<rect x=\"220\" y=\"232\" width=\"49\" height=\"18\" rx=\"1\" class=\"f-t3 cv-grow-right\" opacity=\"0.55\" style=\"--d:.45s\"/>\n<text x=\"273\" y=\"245\" text-anchor=\"start\" font-size=\"8\" class=\"t-muted\" style=\"fill:var(--t3)\">10&#8211;15%<\/text>\n<text x=\"65\" y=\"238\" text-anchor=\"start\" font-size=\"8.5\" font-weight=\"bold\">Nordic / Social-Democratic Consolidation<\/text>\n<text x=\"65\" y=\"250\" text-anchor=\"start\" font-size=\"7.5\" class=\"t-muted\">SAP return; updated Meidner for AI era; Nordic model as proof of concept for Anglophone democracies<\/text>\n<text x=\"350\" y=\"278\" text-anchor=\"middle\" font-size=\"7.5\" class=\"t-muted\" font-style=\"italic\">Wider band = deeper uncertainty. B and D are not mutually exclusive; a crisis (B) can accelerate oligarchic capture (D) rather than democratic socialism.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> Five scenarios through 2040, ranked by probability. The base case (A) extends the current municipal-revival pattern without a national breakthrough. The scenarios requiring most attention are C (nationalist-populist capture of the distributional grievance) and D (techno-oligarchic attrition of democratic channels) &#8212; together accounting for 35&#8211;45% of the probability space, they represent the foreclosure path.<\/figcaption>\n<\/figure>\n\n\n\n\n<div class=\"viz-error\"><strong>Unrendered visualization<\/strong> (&#x27;items&#x27;)<pre>{&#10; &quot;type&quot;: &quot;range&quot;,&#10; &quot;title&quot;: &quot;Forecast scenarios — through 2040&quot;,&#10; &quot;credit&quot;: &quot;the-forecaster — Predictive Council&quot;,&#10; &quot;data&quot;: [&#10;  {&#10;   &quot;label&quot;: &quot;Gradualist Consolidation — The Groundhog Loop Holds&quot;,&#10;   &quot;low&quot;: 38,&#10;   &quot;high&quot;: 47&#10;  },&#10;  {&#10;   &quot;label&quot;: &quot;Nationalist and Right-Populist Capture — Grievances Route Right&quot;,&#10;   &quot;low&quot;: 19,&#10;   &quot;high&quot;: 27&#10;  },&#10;  {&#10;   &quot;label&quot;: &quot;Constrained Breakthrough — Power Without Transformation&quot;,&#10;   &quot;low&quot;: 18,&#10;   &quot;high&quot;: 27&#10;  },&#10;  {&#10;   &quot;label&quot;: &quot;Structural Rupture — The Eschatological Wager&quot;,&#10;   &quot;low&quot;: 8,&#10;   &quot;high&quot;: 14&#10;  },&#10;  {&#10;   &quot;label&quot;: &quot;Techno-Oligarchic and Institutional Foreclosure&quot;,&#10;   &quot;low&quot;: 9,&#10;   &quot;high&quot;: 15&#10;  }&#10; ]&#10;}<\/pre><\/div>\n\n\n\n### Scenario 1: Gradualist Consolidation — The Groundhog Loop Holds\n\n**Probability: 38–47%**\n\nDemocratic socialism persists organizationally through 2040 without structural transformation. The Nordic SAP governs via ageing-driven welfare expansion, confirmed by the 94% Polymarket market. UK Labour under Starmer and his successors remains managerial. DSA scales to 3–5 metropolitan strongholds but cannot assemble the coalition arithmetic for federal-level structural legislation. The 5/6 absorption base rate — SPD 1914, SPD 1933, SAP Meidner 1984, Syriza 2015, Labour/Sanders 2015–20 — holds as the gravitational constant.\n\n**How this number was derived.** Four council members worked independently. Driver-dominant: 36–48%. Base-rate-first: 38–50%. Discontinuity-first: 36–46%. Contrarian: 37–47%. Lower-bound geometric mean of odds: (0.5625 × 0.6129 × 0.5625 × 0.5873)^0.25 ≈ 0.596, yielding 1/1.596 ≈ 37.4%, rounded to 38%. Upper-bound geometric mean of odds: (0.923 × 1.000 × 0.852 × 0.887)^0.25 ≈ 0.909, yielding 47.6%, rounded to 47%. The Polymarket SAP 94%/$1.13M and Andersson 73%/$2.13M markets confirm Nordic continuity without structural advance. The OECD operative content remains 4–5/22 expanded redistributive universalism, not 18/22.\n\nThe dominant drivers are the 7/7 organizational persistence base rate (governing survival, not transformation), the 5/6 absorption rate under capital pressure, union density collapse in the US (9.9% in 2024, BLS) and Germany (14.1%, OECD/AIAS ICTWSS) that destroys the translation infrastructure between electoral majorities and structural change, and parliamentary eschatology — the grammar of \"the next election\" — that rationalizes indefinite structural deferral.\n\nThis scenario holds so long as no catastrophic AI or climate shock ruptures political routines before 2032, US union density stays below 15% through 2030, and SAP coalition arithmetic prevents structural legislation post-2026. The signals to watch are SAP coalition negotiations in November 2026 (which coalition parties, what is structurally ruled out), DSA membership trajectory (plateaus below 150k by 2028 or sustains growth), the Mamdani NYC 18-month record (public banking operational or administrative pragmatism), and UK Labour conference 2027 (left wins binding nationalization votes or managed containment). Distinguishing features of this scenario become visible by 2028–2030; the scenario persists through 2040 by definition if structural rupture does not arrive.\n\n### Scenario 2: Nationalist and Right-Populist Capture — Grievances Route Right\n\n**Probability: 19–27%**\n\nDemocratic-socialist movements fragment while material grievances are captured by nationalist-populist parties. The Wagenknecht–Die Linke split becomes the Continental paradigm. AI-driven displacement of workers routes to anti-immigration framing via pre-built nationalist infrastructure rather than anti-capital framing that requires new organizational construction. This is the path in which the left's organizational losses become the right's organizational gains.\n\n**How this number was derived.** Cross-examination removed the Weimar/Austria/Italy cases as paramilitary, not electoral-democratic. The cleaned reference class — France 2022, US 2016/2024, UKIP/Brexit — yields 2–3/3 partial working-class capture, non-paramilitary. Decomposition: P(nationalist wins AI-displacement translation race) ≈ 0.45, derived from 5/8 center-left governments that ceded new-issue framing to nationalist parties (approximately 62%), discounted to 0.45 for two counter-cases where the left won new-issue framing. P(forecloses breakthrough | nationalist captures displacement narrative) ≈ 0.55, drawn from the 5/6 absorption rate plus 0.05 for the nationalist-capture mechanism. Product: 0.45 × 0.55 ≈ 0.25. Lower bound 19% reflects the 62% under-30 socialist favorability headwind that limits nationalist working-class capture in the short run; upper bound 27% reflects AI-displacement acceleration scenarios.\n\nThe key insight is structural asymmetry: anti-immigration framing is pre-built and requires no new organizational construction, while anti-capital framing demands the creation of new economic-nationalist or socialist frames from scratch. The AfD, Rassemblement National, and Trump coalition have already demonstrated working-class penetration of social-democratic electoral bases. Christian nationalism pre-occupies the prophetic-communal framing space that climate-justice democratic socialism would otherwise claim. Union density collapse leaves displaced workers organizationally unattached at the moment of maximum vulnerability.\n\nThis scenario requires AI displacement to materialize before democratic-socialist parties develop coherent anti-capital framing, the Christian nationalist synthesis to hold over economic policy conflicts, and AfD-pattern parties to maintain structural working-class vote share through 2030. The fork point is 2027–2032; the AI-displacement narrative battle is the decisive contingency. Watch AfD polling above 20% while SPD governs through 2027, AI displacement media framing within six months of any major qualifying event, the Le Pen/RN 2027 French presidential result, and progressive denominational membership (ELCA, UMC, UCC) trajectories through 2030.\n\n### Scenario 3: Constrained Breakthrough — Power Without Transformation\n\n**Probability: 18–27%**\n\nA democratic-socialist government achieves national executive power in at least one major Western state by 2033 and implements genuine but partial structural reform short of Meidner-scale transformation. The Attlee 1945–51 pattern: real redistribution — NHS-equivalent public institutions, genuine wealth taxation, partial public ownership — without superseding capital's structural position in investment decisions. Power is achieved; the commanding heights are not.\n\n**How this number was derived.** Three-factor decomposition: P(left captures national power by 2035) ≈ 0.40, from 4/10 left-populist G7 surges since 1990 that achieved or nearly achieved national executive power (Jospin 1997, Schroeder 1998, Zapatero 2004, Lula analog). P(attempts structural program | power) ≈ 0.55, since the 5/6 absorption rate implies 83% full capitulation, but 0.55 allows for the attempted-but-constrained middle path given the Mamdani proof-of-concept and 62% under-30 socialist favorability. P(partial success under capital pressure) ≈ 0.30, from Attlee 1/6 (16.7%) adjusted upward for sovereign-currency states lacking Bretton Woods constraints. Product: 0.40 × 0.55 × 0.30 = 0.066. Adjusted to 18% via explicit multipliers: 0.066 × generational-turnover factor ~1.8 (62% under-30 vs. 35% general, becoming approximately 55% of the electorate by 2030) × Mamdani proof-of-concept factor ~1.5 (updating power-capture probability approximately 15 percentage points) ≈ 0.178. Upper bound 27% adds the AI white-collar displacement pathway, which is unpriced in the base decomposition and would expand the constituency for democratic-socialist economic frames.\n\nThe scenario is most plausible in a sovereign-currency state outside the Eurozone — most likely the United States or the United Kingdom — where a Syriza-style Troika constraint is absent. Mamdani's NYC mayoral victory (50.4%) demonstrated that DSA-aligned infrastructure can defeat machine-Democratic opposition; the question is whether the municipal proof-of-concept translates upward. AI displacement creating a white-collar professional constituency historically unreachable by socialist frames is the novel pathway that makes this scenario's upper bound plausible. Attlee 1945–51 remains the 1/6 partial precedent; that it happened once is the grounding.\n\nThis scenario requires a major economic shock providing political opening before 2033, DSA organizational presence in professional sectors before grievances route right, and stable democratic institutions through 2033. The 2028–2030 signals are determinative; watch the 2028 Democratic primary (democratic-socialist candidate polling above 35%), Mamdani NYC structural policy wins operational by 18 months, post-Starmer UK Labour leadership direction by 2028, and AI structural unemployment crossing 3% in professional sectors of any G7 before 2030.\n\n### Scenario 4: Structural Rupture — The Eschatological Wager\n\n**Probability: 8–14%**\n\nClimate catastrophe or AI-driven mass professional unemployment ruptures political routines before 2032, enabling democratic-socialist vehicles to implement genuine structural transformation: wealth taxes above 40%, public ownership of utilities and AI infrastructure, Meidner-scale wage-earner funds or their contemporary equivalents. This is the scenario the millenarian grammar of democratic socialism has always anticipated — the rupture that finally breaks the cycle of absorption.\n\n**How this number was derived.** Two independent pathways, partially correlated. Climate pathway: P(qualifying climate rupture, defined as >50k G7 deaths from a single attributable event) ≈ 0.55, from IPCC AR6's high-likelihood assessment of 1.5°C crossing by 2035 — no hard reference class for this cell, so this is an expert-estimate residual. P(left wins attribution contest | qualifying event) ≈ 0.45, revised downward from 0.55 in cross-examination, incorporating the contrarian's concern about Christian nationalist pre-occupation of prophetic-communal framing; the chair's 0.45 is the disciplined compromise. P(infrastructure sufficient for structural legislation | left wins attribution) ≈ 0.60, expert-estimate residual bounded by 0/5 hard ceiling. Climate product: 0.55 × 0.45 × 0.60 = 0.149. AI pathway: P(AI structural displacement >5% professional sectors any G7 before 2030) ≈ 0.35 × P(left wins framing) ≈ 0.25, revised down per contrarian absorption critique × P(sufficient infrastructure) ≈ 0.50 = 0.044. Combined, with partial correlation ~0.30: 0.149 + 0.044 − 0.30√(0.149 × 0.044) ≈ 0.163. Hard ceiling adjustment: 0/5 post-WWII Anglophone structural ownership proposals implemented; 0/1 Meidner-scale. Adjusted to 8–14%. Three of the six pathway factors are expert-estimate residuals; the 0/5 hard ceiling is the primary grounding anchor.\n\nPolicy blueprints are intellectually complete — the Meidner-tradition AI ownership proposals, Piketty's participatory socialism — and the millenarian grammar offers ready-made language for transformed commonwealth in crisis. Generational turnover completes by 2030–2032. None of this matters without the qualifying rupture. The probability decays sharply if no rupture arrives by 2032; after that point, absorption mechanisms are likely to have calcified.\n\nThe rupture window is 2028–2032. Watch IPCC 2027 assessment for tipping-point trajectory revisions, BLS and comparable G7 data for AI displacement above 3% in cognitive-labor sectors by 2030, climate events above 50k G7 deaths and whether fossil-fuel attribution dominates within six months, and professional-sector union formation at scale in the US or Germany by 2029.\n\n### Scenario 5: Techno-Oligarchic and Institutional Foreclosure\n\n**Probability: 9–15%**\n\nDemocratic institutions degrade sufficiently in one to three major Western democracies to foreclose meaningful democratic-socialist electoral competition via three overlapping channels: Roberts Court redistributive ceilings (Chevron reversal, non-delegation doctrine, takings), EU fiscal architecture replicating the Syriza precedent for any Eurozone government that attempts structural programs, and techno-oligarchic AI and media concentration that makes mass democratic-socialist communication structurally difficult. Metaculus Q14141 on US democratic continuity returned HTTP 403 and is excluded from derivations.\n\n**How this number was derived.** Primary anchor: V-Dem reference class of 4/30 liberal democracies since 1980 with backsliding severe enough to disable comparable parliamentary strategy = 13.3%. Channel decomposition: P(judicial channel disables strategy) ≈ 0.55 × 0.35 = 0.19, from Chevron reversal plus non-delegation; the 0.35 factor is an expert-estimate residual for what \"disables strategy\" means at the operative threshold. P(EU fiscal channel forecloses Eurozone mandate) ≈ 0.25, from Syriza 1/1 — a thin reference class. Combined probability with partial correlation ~0.40: 0.19 + 0.25 − 0.40 × √0.0475 ≈ 0.37. Discounted for the partial-foreclosure threshold (complete foreclosure, not just constraint): 0.37 × 0.27 ≈ 0.10. V-Dem 13.3% is the primary anchor; channel derivation 10% is consistent; range 9–15% brackets both. Three sub-factors are expert-estimate residuals; V-Dem is the grounding floor.\n\nThe structural backdrop is the Roberts Court's already-accomplished work — Chevron reversal, non-delegation doctrine expansions, takings jurisprudence — which collectively impose a redistributive ceiling with no prior revival analog. US top-1% wealth share reached 31.7% in Q3 2025 (FRED), the highest since the Gilded Age. The critical window is 2028–2035; degradation that arrives by 2030–2032 locks in before the generational turnover can be electorally expressed.\n\nWatch V-Dem Liberal Democracy Index annual scores for the US, UK, and France trending below 0.5; EU Digital Markets Act and AI Act enforcement through 2027; SCOTUS rulings on major redistribution legislation 2027–2029; and major AI platform antitrust action in the US or EU before 2028.\n\n## Base Rates\n\nSeven reference classes grounded this forecast. All survived cross-examination intact, though two required re-scoping from the submitted derivations.\n\n**Post-defeat organizational persistence: 7/7** (SPD after 1919, UK Labour after 1951, Labour after 1979, SPD after 1994/1998, Democrats after 2000, Democrats after 2010, Labour after 2019). This is the primary anchor for Scenario 1 and the most robustly grounded finding in the corpus. Every democratic-socialist or social-democratic party in this class survived its \"fatal\" defeat and continued as a going concern. This class governs survival, not transformation.\n\n**Absorption under capital pressure: 5/6** (SPD war credits 1914, SPD capitulation to Hindenburg/Papen 1933, SAP defeat of the Meidner Plan 1984, Syriza-Troika memorandum 2015, Labour/Sanders structural program abandonment 2015–20; Attlee 1945–51 as the partial counter-case). This is the gravitational constant for Scenarios 1, 2, and 3. A 5/6 rate is strong enough to treat absorption as the expected outcome and breakthrough as requiring explanation.\n\n**OECD welfare-state persistence 1980–2020: 18/22 raised spending, but 4–5/22 expanded redistributive universalism.** The base-rate-first council member initially used the 18/22 class as the Scenario 1 anchor; cross-examination required re-scoping to the operative 4–5/22 class, which covers actual programmatic expansion rather than any increase in welfare spending, which can reflect demographic aging rather than political transformation.\n\n**Structural ownership transformation since 1900: 1/25–30 partial (Attlee), 0/25–30 Meidner-scale.** This is the hard ceiling for Scenario 4. The 0/25–30 Meidner-scale finding is the single most constraining fact in the corpus. The blueprint exists; the political execution has never occurred.\n\n**Nationalist-populist working-class capture, non-paramilitary: 2–3/3 partial** (France 2022, US 2016/2024, UKIP/Brexit). Cross-examination removed Weimar, Austria 1934, and Italy 1922 as paramilitary cases whose mechanism (street violence) is not operative in contemporary Western democracies. The cleaned class is small but directionally clear.\n\n**Democratic foreclosure: V-Dem 4/30 (~13.3%) severe backsliding.** This is the primary anchor for Scenario 5 and survived intact. It brackets both the channel-decomposition estimate (10%) and the final range (9–15%).\n\n**Four-member council convergence: driver-dominant 36–48%, base-rate-first 38–50%, discontinuity-first 36–46%, contrarian 37–47%.** Geometric-mean of lower-bound odds ≈ 37.4% → 38%; geometric-mean of upper-bound odds ≈ 47.6% → 47%. The convergence is unusually tight for a 15-year horizon, reflecting the strength of the 7/7 and 5/6 base rates.\n\n**Polymarket markets as liquid anchors: SAP Riksdag Sept 2026 at 94%/$1.13M; Andersson PM at 73%/$2.13M (both pulled 2026-06-19).** These are the only real-money, high-volume markets directly relevant to the forecast and are used as decomposed factors in Scenario 1.\n\n**Manifold US UBI by 2030: 22–30% YES on thin play-money volume.** Directional signal only; not used as a factor in any probability adjustment per predictions protocol prohibiting thin-market anchoring.\n\n**Metaculus Q14141 US democracy continuity: ~30% NO, unconfirmed (HTTP 403).** Excluded from derivations. The V-Dem base rate serves as the grounding alternative.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n|--------|----------|-------|--------|-------------|\n| Polymarket | Which party wins greatest seats in Swedish Riksdag, Sept 13, 2026? | SAP (S): 94%; SD: 3.5%; all others <1% | $1,134,274 | 2026-06-19 |\n| Polymarket | Who will be next Prime Minister of Sweden following 2026 election? | Magdalena Andersson (SAP): 73%; Kristersson: 24%; Akesson: 1.7% | $2,130,985 | 2026-06-19 |\n| Polymarket | ACA credits extended and House winner 2026? | Not Extended & Democratic Party: 81%; Not Extended & Republican Party: 19% | $401,001 total; $52,300 liquidity | 2026-06-19 |\n| Manifold | Will universal basic income be introduced in the US by 2030? | 22% YES | 35 holders; 40 trades (play-money, thin) | 2026-06-19 |\n| Manifold | Will the US implement a UBI before 2030? | 30% YES | Mana 3,800 liquidity; 31 holders; 65 trades (play-money, thin) | 2026-06-19 |\n| Manifold | Will there be a country with UBI by 2030? | 100% (RESOLVED YES — Marshall Islands) | Mana 21,000; 94 holders; 202 trades | 2026-06-19 |\n| Metaculus | US continuously a Liberal Democracy until resolution year? (Q14141) | Not confirmed — HTTP 403 | Unknown | 2026-06-19 |\n| Metaculus | US Democracy Index in 2040? (Q4333) | Not confirmed — HTTP 403 | Unknown | 2026-06-19 |\n| Metaculus | Will US, UK, China, or any EU country enact UBI before 2030? (Q22388) | Not confirmed — HTTP 403 | Unknown | 2026-06-19 |\n| Metaculus | Five years after AGI, will there be UBI? (Q26326) | Not confirmed — HTTP 403 | Unknown | 2026-06-19 |\n| Metaculus | US Gini coefficient in 2030? (Q4968) | Not confirmed — HTTP 403 | Unknown | 2026-06-19 |\n\nThe two high-volume Polymarket markets are the forecast's strongest liquid anchors and are straightforwardly consistent with Scenario 1 (Gradualist Consolidation): a 94% SAP Riksdag win and 73% Andersson PM market reflect deep market confidence in Nordic social-democratic continuity without any expectation of structural advance. The Manifold UBI markets (22–30% YES, thin play-money) are directionally interesting for Scenarios 3 and 4 but are too illiquid to use as factor inputs. The Marshall Islands Manifold market resolving YES is not informative for Western democratic-socialist trajectory. The Metaculus markets would be the most directly relevant to Scenario 5 (democratic foreclosure) but all returned HTTP 403 on access attempts; the V-Dem reference class serves as the grounding alternative. The ACA Polymarket market (ACA not extended at 81%) is a related signal about US redistributive politics but does not directly map to any of the five scenarios.\n\n## What Would Change My Forecast\n\n1. SAP coalition negotiations rule out structural economic legislation by November 2026 — Scenario 1 upper bound confirmed; Scenario 3 lower bound trimmed toward 15%.\n\n2. Mamdani NYC produces two or more structural policy wins confirmed operational by 2028 (public banking, land trust, or equivalent) — Scenario 3 raises toward 25–30%.\n\n3. A second Corbyn/Sanders-style defeat after leading polls by double digits — Scenario 4 collapses to 3–5% tail; Scenario 3 drops to 8–12%; Scenario 1 approaches 50%.\n\n4. AI displacement crosses 5% professional-sector unemployment in any major G7 before 2030 — Scenarios 3 and 4 rise; Scenario 2 also rises if nationalist framing dominates within six months.\n\n5. AI displacement media framing routes to immigration vs. capital-labor frame within six months of a qualifying event (BLS or G7 data showing >1% professional-sector contraction) — the single most consequential contingency distinguishing Scenarios 2 and 3/4; the forecast is most sensitive to this variable.\n\n6. Christian nationalism exceeds 40% of US Christians (Pew annual survey) before 2028 — Scenario 4 collapses to 5–8%; Scenario 2 raises toward 27–32%.\n\n7. Climate event above 50k G7 deaths with fossil-fuel attribution dominant in mainstream media within six months — Scenario 4 raises to 14–22%.\n\n8. US V-Dem Liberal Democracy Index falls below 0.5 in any annual dataset before 2030 — Scenario 5 raises to 18–25%.\n\n9. SCOTUS strikes major redistributive legislation before 2030 — Scenario 5 raises to 15–22%.\n\n10. DSA achieves 500k+ dues-paying members with working-class majority per DSA membership survey before 2030 — Scenario 3 raises toward 25–30%.\n\n11. Major AI or media platform antitrust breakup successful before 2028 — Scenario 5 reduces to 4–7% tail.\n\n12. SAP introduces wage-earner-fund-adjacent legislation 2026–2030 — Nordic sub-variant shifts toward Scenario 3; this would require revising the entire Scenario 1/3 boundary upward.\n\n## Open Questions\n\nThree questions are causally central but currently unresolvable with available evidence.\n\n**The AI-displacement framing race.** Whether AI-driven labor displacement — when it becomes politically salient — routes to anti-capital frames (\"the algorithm took your job\") or anti-immigration frames (\"immigrants are being prioritized over you\") will be decided by which organizational infrastructure can move fastest. Democratic-socialist parties have the better analytical account; nationalist parties have the pre-built infrastructure. No historical base rate governs this contingency directly because AI-scale cognitive-labor displacement is novel. This is the single highest-value empirical question for revising the Scenario 2 vs. 3/4 boundary.\n\n**The Mamdani municipal proof-of-concept.** The Mamdani NYC mayoralty is the first DSA-aligned executive office in a major American city. Whether it produces structural wins — public banking, community land trusts, wage-earner participation — or is absorbed into administrative pragmatism within two years (the historical pattern) will update Scenario 3 most directly. The 18-month record through mid-2027 will be informative.\n\n**The Christian nationalist synthesis durability.** Christian nationalism currently occupies both the prophetic-communal framing space that climate-justice democratic socialism would need and substantial working-class loyalty that democratic-socialist parties have historically relied on. Whether the synthesis holds through economic policy conflicts (tariffs, industrial policy, AI displacement) or fractures along class lines is a second major contingency for distinguishing Scenarios 2 and 4. Pew's annual religious landscape data is the best available leading indicator.\n\n## Sources\n\nThis forecast draws on the full source corpus of the Western Democratic Socialism research volume. Primary among the sources informing the forecast's empirical grounding:\n\n**Federal Reserve, FRED series WFRBST01134.** US top-1% wealth share (31.7%, Q3 2025) — used in Scenario 5 structural backdrop.\n\n**Bureau of Labor Statistics, \"Union Members Summary,\" January 2025.** US union density (9.9%, 2024) — used in Scenario 1 driver analysis.\n\n**OECD/AIAS ICTWSS Database, 2024.** Cross-national union density (Germany 14.1%) — used in Scenario 1 driver analysis.\n\n**Warner, Neil.** \"Asymmetric Mobilisation and the Defeat of Wage-Earner Fund Policies in Sweden.\" *Economic and Industrial Democracy* (2025). Meidner Plan defeat — base rate for Scenario 4 hard ceiling.\n\n**Varoufakis, Yanis.** *Adults in the Room.* Farrar, Straus and Giroux, 2017. First-person account of Syriza-Troika — 5/6 absorption class entry.\n\n**Frontiers in Political Science.** \"From Protest to Paradox: A Decade of SYRIZA\" (2025). Syriza trajectory — Scenario 2 and 5 reference class.\n\n**Springer / British Politics.** \"A New Era of Minimal Social Democracy? Comparing UK Labour Under Keir Starmer\" (2025). Labour managerialism — Scenario 1 grounding.\n\n**City & State NY, January 2026.** DSA membership figures (~104,689 as of March 2026) — Scenario 3 infrastructure assessment.\n\n**NPR.** \"Mamdani wins NYC mayor general election,\" November 4–5, 2025. Primary wire source — Scenario 3 Mamdani proof-of-concept.\n\n**Cato Institute / YouGov 2025.** 62% of Americans under 30 favorable to socialism — Scenario 3 generational-turnover multiplier.\n\n**World Council of Churches.** \"Ecumenical Decade of Climate Justice Action 2025–2035\" (2025). Religious-left climate organizing — Scenario 4 prophetic-framing assessment.\n\n**Pew Research Center.** 2023–24 Religious Landscape Study (February 2025). Religious affiliation and political alignment — Christian nationalism framing.\n\n**V-Dem Institute.** Liberal Democracy Index (annual). 4/30 severe-backsliding reference class — Scenario 5 primary anchor.\n\n**Polymarket.** Swedish Riksdag 2026 (SAP 94%/$1.13M), Andersson PM (73%/$2.13M), ACA credits/House 2026 — https://polymarket.com/event/sweden-parliamentary-election-winner; https://polymarket.com/event/next-prime-minister-of-sweden; https://polymarket.com/event/aca-credits-extended-house-winner-2026. Pulled 2026-06-19.\n\n**Manifold Markets.** US UBI by 2030 (22% YES): https://manifold.markets/YakshBirla/will-universal-basic-income-be-intr; US UBI before 2030 (30% YES): https://manifold.markets/vicli/will-an-ubi-universal-basic-income; Country with UBI by 2030 (RESOLVED YES): https://manifold.markets/O/will-there-be-a-country-with-univer. Pulled 2026-06-19.\n\n**Metaculus.** Q14141 (US democracy continuity), Q4333 (US Democracy Index 2040), Q22388 (G7 UBI by 2030), Q26326 (post-AGI UBI), Q4968 (US Gini 2030) — all returned HTTP 403; URLs on record but excluded from derivations. https://www.metaculus.com/questions/14141/; https://www.metaculus.com/questions/4333/; https://www.metaculus.com/questions/22388/; https://www.metaculus.com/questions/26326/; https://www.metaculus.com/questions/4968/.\n\n**Piketty, Thomas.** *Capital and Ideology.* Harvard University Press, 2020. Participatory socialism blueprint — Scenario 3 and 4 policy architecture.\n\n**Esping-Andersen, Gosta.** *The Three Worlds of Welfare Capitalism.* Princeton University Press, 1990. Decommodification typology — OECD welfare-state base rate.\n\n**Berman, Sheri.** *The Primacy of Politics.* Cambridge University Press, 2006. Democratic-socialist intellectual history synthesis — base-rate contextualization.\n\n**UK Parliament House of Commons Library.** Passenger Railway Services (Public Ownership) Act 2024. First major UK nationalization since the 1990s — Scenario 1 going-concern marker."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme
const themePref = localStorage.getItem('corpus-theme');
if (themePref) document.documentElement.dataset.theme = themePref;
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length + ' · ' + docs[current].title
    + ' · ' + Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220)) + ' min';
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }

function runSearch() {

    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';

      results.appendChild(div);

  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);

  if (prev && vs.find(v => v.name === prev)) sel.value = prev;

    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';

  // explorer: pick a work and the map redraws as that corpus's intellectual world.
  function buildPick() {
    if (!pick || !DATA) return;
    var conn = DATA.connections || {}, seen = {}, opts = '<option value="">✦ All corpora — the mosaic</option>';
    (DATA.places || []).filter(function (p) { if (seen[p.slug] || !conn[p.slug]) return false; seen[p.slug] = 1; return true; })
      .map(function (p) { return { slug: p.slug, title: p.title }; })
      .sort(function (x, y) { return x.title.localeCompare(y.title); })
      .forEach(function (it) { opts += '<option value="' + esc(it.slug) + '">' + esc(it.title) + '</option>'; });
    pick.innerHTML = opts;
  }
  function syncPick() { if (pick) pick.value = mode; }
  function setMode(m) {
    if (!DATA) return;
    m = m || ''; if (m && !(DATA.connections && DATA.connections[m])) m = '';
    if (m === mode) { syncPick(); return; }
    mode = m; try { localStorage.setItem('atlas-pick', mode); } catch (e) {}
    hideCard(); paint(true); syncPick(); updateSub();
  }
  function updateSub() {
    var sub = back && back.querySelector('#atlas-sub'); if (!sub) return;
    var C = (mode && DATA && DATA.connections && DATA.connections[mode]) ? DATA.connections[mode] : null;
    if (C) sub.textContent = C.home.name + '’s intellectual world — ' + C.nodes.length + ' geographic connections. Hover a place to trace its thread.';
    else sub.textContent = 'Pick a research above to trace its intellectual world — or roam the mosaic of every corpus. Drag to pan, scroll to zoom.';
  }

  // Repaint the whole surface for the active mode. Cheap enough to rebuild wholesale.
  function paint(doFit) {
    if (!DATA) return;
    var j = DATA, C = (mode && j.connections && j.connections[mode]) ? j.connections[mode] : null;
    var s = '<svg id="atlas-svg" viewBox="' + j.viewBox + '" width="' + j.w + '" height="' + j.h
      + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">';
    s += '<defs>';
    for (var rid in j.regions) s += '<clipPath id="ar-' + rid + '"><path d="' + j.regions[rid].d + '"/></clipPath>';
    if (!C) j.places.forEach(function (p) { var c = p.cell;
      s += '<clipPath id="ac-' + p.slug + '"><rect x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3] + '"/></clipPath>'; });
    else s += '<clipPath id="ahome"><circle cx="' + C.home.x + '" cy="' + C.home.y + '" r="58"/></clipPath>';
    s += '</defs>';
    s += '<g id="atlas-grat">'; (j.graticule || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += '<g id="atlas-bd">'; (j.backdrop || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += C ? connLayer(C) : placesLayer(j);
    s += '</svg>';
    world.innerHTML = s;
    bySlug = {};
    computeBounds(C);
    if (C) wireConn(C); else wirePlaces(j);
    if (doFit === false) { apply(); return; }
    if (!C && restore()) { apply(); if (!enoughVisible()) fit(); }
    else fit();
  }

  function placesLayer(j) {
    var s = '<g id="atlas-places">';
    j.places.forEach(function (p) {
      var c = p.cell;
      s += '<g class="atlas-place" data-slug="' + esc(p.slug) + '"><g clip-path="url(#ar-' + p.region + ')">';
      if (p.img) { var href = esc(base + p.img);
        s += '<image class="atlas-img" href="' + href + '" xlink:href="' + href + '" x="' + c[0] + '" y="' + c[1]
          + '" width="' + c[2] + '" height="' + c[3] + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac-' + p.slug + ')"/>'; }
      s += '<rect class="atlas-ring" x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3]
        + '" clip-path="url(#ac-' + p.slug + ')" fill="none" stroke="' + esc(p.accent) + '" stroke-width="3"/>';
      s += '</g></g>';
    });
    s += '</g><g id="atlas-lines">';
    for (var r2 in j.regions) { var R = j.regions[r2];
      s += '<path class="atlas-rgn" d="' + R.d + '"/>';
      (R.dividers || []).forEach(function (d) {
        s += '<line class="atlas-div" x1="' + d[0] + '" y1="' + d[1] + '" x2="' + d[2] + '" y2="' + d[3] + '" clip-path="url(#ar-' + r2 + ')"/>'; });
    }
    s += '</g>';
    return s;
  }

  function arcPath(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = Math.min(170, len * 0.16), cx = mx - dy / len * off, cy = my + dx / len * off;
    return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  function clipText(t, n) { t = t || ''; return t.length > n ? t.slice(0, n - 1).replace(/[\s,;:&/-]+$/, '') + '…' : t; }
  function connLayer(C) {
    var ac = esc(C.home.accent || '#b3502f'), H = C.home, R = 58;
    var s = '<g id="atlas-lines">';
    for (var rid in DATA.regions) s += '<path class="atlas-rgn" d="' + DATA.regions[rid].d + '"/>';
    s += '</g>';
    s += '<g id="atlas-threads" stroke="' + ac + '">';
    C.nodes.forEach(function (n, i) { s += '<path class="atlas-thread" data-i="' + i + '" d="' + arcPath(H.x, H.y, n.x, n.y) + '"/>'; });
    s += '</g>';
    // home badge drawn UNDER the place nodes, so their dots + labels are never masked
    s += '<g class="atlas-home">';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + (R + 6) + '" fill="var(--bg)"/>';
    if (H.img) { var href = esc(base + H.img);
      s += '<image href="' + href + '" xlink:href="' + href + '" x="' + (H.x - R) + '" y="' + (H.y - R) + '" width="' + (2 * R) + '" height="' + (2 * R) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ahome)"/>'; }
    else s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="' + ac + '"/>';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="none" stroke="' + ac + '" stroke-width="4.5"/>';
    s += '<text class="atlas-hlabel" x="' + H.x + '" y="' + (H.y + R + 33) + '" text-anchor="middle" fill="' + ac + '">' + esc(H.name) + '</text>';
    s += '</g>';
    s += '<g id="atlas-cnodes">';
    C.nodes.forEach(function (n, i) {
      // splay each label outward from home so the European cluster doesn't pile up
      var dx = n.x - H.x, dy = n.y - H.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var lx = n.x + dx / L * 15, ly = n.y + dy / L * 15 + (dy >= 0 ? 16 : -8);
      var anchor = dx > 30 ? 'start' : (dx < -30 ? 'end' : 'middle');
      s += '<g class="atlas-cnode" data-i="' + i + '">';
      s += '<circle class="atlas-chalo" cx="' + n.x + '" cy="' + n.y + '" r="17" stroke="' + ac + '" fill="none"/>';
      s += '<circle class="atlas-cdot" cx="' + n.x + '" cy="' + n.y + '" r="9" fill="' + ac + '"/>';
      s += '<text class="atlas-clabel" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(clipText(n.name, 30)) + '</text>';
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function computeBounds(C) {
    var X0 = 1e9, Y0 = 1e9, X1 = -1e9, Y1 = -1e9;
    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      DATA.places.forEach(function (p) { bySlug[p.slug] = p; var c = p.cell;
        X0 = Math.min(X0, c[0]); Y0 = Math.min(Y0, c[1]); X1 = Math.max(X1, c[0] + c[2]); Y1 = Math.max(Y1, c[1] + c[3]); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
