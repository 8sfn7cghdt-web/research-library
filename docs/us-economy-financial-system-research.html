l as chair after a year of presidential pressure, a now-dropped criminal probe of Powell, and a live Supreme Court fight over whether the President can fire governors — all while an Iran-driven energy shock pushed CPI to 4.2%, the highest since 2023, pressing a Fed to cut into rising inflation. Private credit ($1.5-2T) drew a formal FSB warning in May and a Fed bank-exposure inquiry in April after redemptions and rising defaults. Beneath the strong aggregates sit a K-shaped split, a tariff regime reshaped by a February Supreme Court ruling, and a dollar still dominant (~57% of reserves) but visibly hedged against. What follows presents each camp at full strength, in its own language, with the facts each side cites and the one fact that would settle it. Who benefits from each framing is noted throughout: the people loudest about rate cuts are rarely the ones who would suffer most from inflation.\n\n---\n\n## How to Read This Account\n\nThis lays out the strongest version of each side, not a verdict. Each debate is presented with its camps at maximum strength, in the vocabulary each side's best advocates actually use, with the facts each cites and a clear marker of what would resolve it. Every section also asks *cui bono* — who benefits from each framing, and where the stated position diverges from the real one.\n\nA distinction runs throughout: **factual disagreements** (resolvable in principle by evidence — e.g., \"will r exceed g?\") are kept apart from **value/interpretation disagreements** (not resolvable that way — e.g., \"is 1.2% of GDP of adjustment a 'big deal'?\"). The point here is to present the arguments, not to adjudicate between them.\n\nA note on fast-moving facts: several status claims here are time-stamped and fragile. Warsh is chair *as of May 2026*; the Powell criminal probe was opened in January and *dropped April 24, 2026*; the tariff regime was *restructured by a February 20, 2026 Supreme Court ruling*. These are exactly the facts that go stale, so each is dated where it appears.\n\n---\n\n## The Macro Backdrop the Debates Are Conducted On\n\nStart with the shared terrain. As of mid-2026 the U.S. economy is large, still growing, and visibly stressed at the seams. The FOMC's March 2026 Summary of Economic Projections — the central bank's own median forecast — pegged 2026 real GDP growth at 2.4%, PCE inflation at 2.7%, unemployment at 4.4%, and the year-end federal funds rate at 3.4%. [SEP] Those are the baseline numbers, and they describe a \"soft landing\" still intact.\n\nBut the March SEP was assembled before two shocks reset the board. The first was the **U.S.-Iran conflict and the energy shock it produced**, which by May had pushed headline CPI to 4.2% year-over-year — the highest reading since April 2023, and the third consecutive monthly acceleration — driven by energy up 23.5% over twelve months. [23] The second was the **February 20 Supreme Court tariff ruling**, which forced a wholesale restructuring of the trade regime mid-stream. [38] Layer on a $39.3 trillion debt rolling at the fastest pace in history, a Fed leadership change executed under political pressure, the highest equity-market concentration on record, and a private-credit sector drawing its first formal international warning. The aggregates look fine; the internals are the subject of seven simultaneous arguments. That gap between headline and internals is the through-line of everything that follows.\n\nOne more point worth making plainly: in nearly every one of these debates, the advocates are not neutral. The fiscal hawks, the rate-cut advocates, the private-credit defenders, the bubble shorts — each has a balance-sheet reason to want their framing to win. The discipline below is to present each at full strength *and* to name the interest. Both can be true: an argument can be self-serving and correct.\n\n---\n\n## Debate 1 — Fiscal Sustainability: Approaching Crisis or Manageable?\n\n> **Stakes at a glance.** Federal debt $39.28T (June 17, 2026); debt held by public 101% of GDP, headed to 120% by 2036; FY26 deficit ~$1.9T (5.8% of GDP); net interest already over $1T and headed to $2.1T by 2036, now exceeding the entire defense budget. The single new fact of 2026: the CBO baseline now shows r>g (the interest rate on the debt overtaking nominal growth) arriving late this decade — the precise condition the \"manageable\" camp said would not occur.\n\n### The numbers both sides start from\n\nTotal federal debt closed at **$39.28 trillion on June 17, 2026** — debt held by the public at $31.64 trillion (80.5%), intragovernmental holdings at $7.64 trillion. [1] Gross debt is up roughly $2.99 trillion year-over-year and is climbing about $9.1 billion a day over the trailing month; on current trajectory it reaches $40 trillion around late September 2026. [1]\n\nThe CBO's February 2026 *Budget and Economic Outlook: 2026-2036* puts the FY2026 deficit at **$1.9 trillion (5.8% of GDP)**, rising to $3.1 trillion (6.7% of GDP) by 2036 — against a 50-year average deficit of 3.8% of GDP. [2] Debt held by the public rises from 101% of GDP in 2026 to 120% by 2036, surpassing the 1946 wartime peak of 106%. [2]\n\nNet interest costs **more than double from $970 billion in 2025 to $2.1 trillion by 2036**, rising from a record 3.2% of GDP to 4.6%. [2] Nobody contests these figures. What they *mean* is the whole fight.\n\n### Camp A — The bond-vigilante / debt-spiral view\n\nThe crisis camp argues that the U.S. has crossed from \"large but stable\" debt into the early mechanics of a self-reinforcing spiral, and that the bond market is already pricing it. Their strongest single fact is new in 2026: under the CBO's own baseline, **the average interest rate on all federal debt will exceed nominal GDP growth (r>g) later this decade** — by FY2031 on CRFB's read of the baseline — precisely the condition that converts a stable debt ratio into an exploding one. [3][4] CRFB, citing CBO, puts the current average rate at 3.32% rising to 3.9% by 2036, against nominal growth sliding from 4.1% toward 3.8%; the lines cross, and \"that could represent the start of a debt spiral.\" [4]\n\nThe mechanism, in their language: higher debt pushes yields up, slower growth shrinks tax revenue, wider deficits add debt, and rates climb again — a feedback loop, not a level problem. [3] Interest now **exceeds the entire defense budget**, the first time a financing line has overtaken the country's largest discretionary program. [3] And they point to *price signals*, not just projections: a run of weak Treasury auctions in late March 2026 — $69B of 2-year, $70B of 5-year, $44B of 7-year notes — drew soft demand, cleared at higher-than-expected yields, and leaned hard on primary dealers; the 7-year tail came in at 0.8bp against a 0.3bp average. [5][6] The 30-year yield hit levels not seen since the Great Recession. [7] Ed Yardeni's \"bond vigilantes\" — coined in the 1980s for traders who sell debt to discipline profligate governments — are, on this view, riding again, with $10 trillion of debt to roll over in 2026 colliding with a war-driven risk premium after the U.S.-Iran conflict. [6][7] \"The bond market remains undefeated,\" as one Fortune headline put it. [6]\n\nA second strand of the crisis case is **crowding out**. As Treasury issuance balloons — $10 trillion to refinance in 2026 alone — the federal government competes with private borrowers for a finite pool of savings, and the price of that competition is higher rates for everyone. [6] On this view the interest bill is not just a budget line; it is a tax on private investment, mortgages, and corporate borrowing, and the AI capex boom (Debate 2) is happening *despite* a fiscal headwind, not without one. The crisis camp also leans on the *speed* of the deterioration: the 2025 reconciliation act and immigration-related administrative actions added a combined ~$5.2 trillion to projected deficits, only partly offset by ~$3.0 trillion of tariff revenue — the trajectory worsened by policy choice, not just inertia. [2]\n\nThe historical precedent the camp invokes is the U.K.'s September 2022 \"Truss moment,\" when an unfunded fiscal package triggered a gilt-market revolt that forced a government out in weeks — proof, they argue, that bond-market discipline is real, fast, and humiliating once confidence breaks, even for a reserve-adjacent sovereign. The weak 2026 auctions, in this reading, are the first tremors of the same mechanism.\n\n**Who benefits from this framing:** fiscal hawks and the think tanks built around them (CRFB, the Peterson Foundation); bond managers who are short duration and want the term premium repriced; and politicians seeking leverage to cut spending they oppose on other grounds. The stated motive is solvency; the real motive is often a spending fight by another name. The framing's honest core, though, is that it is the only camp whose central prediction (r>g) the official scorekeeper now shares.\n\n### Camp B — The \"manageable\" view\n\nThe manageable camp, whose most prominent voice is Paul Krugman (with intellectual lineage to the Furman-Summers low-rate argument), holds that there is no crisis on any horizon a forecaster should take seriously. Krugman's formulation: \"a debt spiral is caused by the interest rate on government debt being significantly larger than economic growth, which isn't the case,\" and asked whether the U.S. faces a debt crisis \"anytime soon, or even in the next decade or two,\" he answers \"almost surely not.\" [8] The U.S. borrows in its own currency, can never be forced into involuntary default, and historically governments never repay large debts — they outgrow them. [8] The real burden is the *primary* balance and debt service relative to GDP; on that measure the situation is uncomfortable, not catastrophic.\n\nTheir strongest structural points: the U.S. retains unique safe-asset demand — the world wants Treasuries precisely when things go wrong — and the dollar's reserve role gives Washington fiscal space no other borrower has. They note that the fiscal gap needed to stabilize debt is on the order of 1.2% of GDP, which Krugman has called \"no big deal\" — a tax or spending adjustment well within historical precedent. [9] And they point to the empirical record: debt crises in advanced economies with their own central banks and floating currencies are rare, and the catastrophes \"doomsayers\" have predicted for decades have not arrived. [8]\n\nThe manageable camp also reframes the auctions the crisis camp cites. A handful of soft auctions is *noise*, they argue — a war-risk premium and a heavy 2026 refinancing calendar colliding in a single quarter, not a verdict on solvency. [6] Demand at Treasury auctions has wobbled many times over four decades without presaging a crisis; the safe-asset bid reasserts itself precisely when risk appetite falls, the opposite of how a true fiscal crisis behaves. In a real crisis, government bonds sell off *with* risk assets, as in an emerging-market default — and that is not what U.S. Treasuries do. The camp's deeper point is institutional: the U.S. is a monetary sovereign with a central bank that can, in extremis, backstop the market, so the \"involuntary default\" scenario that defines a true debt crisis is essentially off the table. The risk, they concede, is *inflation*, not default — a different and more manageable problem than the bond-vigilante framing implies.\n\nOn the Truss analogy, the manageable camp's rebuttal is that the U.K. is precisely *not* the U.S.: it lacks the global reserve currency, the deepest capital market in the world, and the safe-asset monopoly. Applying a mid-sized-economy cautionary tale to the issuer of the world's reserve asset is, on this view, a category error.\n\n**Who benefits:** incumbents who prefer not to cut spending or raise taxes now; the administration of the day, which always wants fiscal room; and Keynesian-leaning economists whose policy program (public investment, social spending) depends on debt not being a binding constraint. The stated motive is sober macroeconomics; the real motive often includes protecting a spending agenda. The framing's honest core is that the bond market has cried wolf for forty years and the catastrophists have a terrible forecasting record.\n\n### What would settle it — and what is value, not fact\n\nThe **factual** crux is narrow and testable: does the average interest rate on the debt durably exceed nominal GDP growth, and does it do so while the primary deficit stays large? If r>g holds for several years with a 5-6% primary deficit, the spiral math is real; if g reasserts (AI productivity, immigration-driven labor supply) or rates fall, it does not. The CBO now forecasts the crossover; the manageable camp bets the forecast is wrong, as CBO long-run forecasts often have been. The **value** crux is non-resolvable: whether a 1.2% of GDP adjustment is \"no big deal\" (Krugman) or \"$2.4 trillion over ten years, more than double the President's proposed savings\" (CRFB) — the same number, opposite valence. [9] No new data settles that; it is a judgment about pain tolerance and priorities.\n\n**Warning signs to watch (both camps agree these are the dials):** the trajectory of long-end yields and the term premium; auction tails and bid-to-cover on coupon auctions; foreign official demand at auctions; and whether the Fed is pressured into yield-curve control or de facto debt monetization — the moment \"financial repression\" begins is the moment the manageable case quietly concedes.\n\n---\n\n## Debate 2 — The AI Bubble: Productivity Revolution, Bubble, or Both?\n\n> **Stakes at a glance.** ~$500-525B of AI-specific hyperscaler capex in 2026 (inside a $650-725B total capex envelope); Goldman projects ~$7.6T cumulative 2026-31. Mag-7 is ~34% of the S&P 500 (~$22.7T market cap). Hyperscaler capex is ~1.6% of GDP — large enough that the buildout is now a *macro* variable, not just an equity story. If it is a productivity revolution, it underwrites the \"manageable debt\" and \"Fed can cut\" cases simultaneously. If it is a bubble, a 30-50% drawdown in the most-weighted names is a recession-grade shock to household wealth and the index every passive saver owns.\n\n### The numbers both sides start from\n\nHyperscaler capital spending in 2026 is tracking around **$500-525 billion in AI-specific infrastructure**, inside a broader Big-5/hyperscaler capex envelope variously estimated at $650-725 billion; Amazon alone plans ~$200 billion. [10][11] Goldman Sachs projects roughly **$7.6 trillion in cumulative AI capex 2026-2031**, with annual spend more than doubling from ~$765 billion in 2026 to ~$1.6 trillion by 2031. [12] Hyperscaler capex is estimated at ~1.6% of U.S. GDP in 2026, up from ~1.3% in 2025. [13] The seven AI champions make up roughly **28% of the S&P 500 on Risk.net's narrower count and 33.8% on the Mag-7 definition** as of June 2026, a combined market cap near $22.7 trillion, with Nvidia ~22% of the group. [13][14] These figures are agreed; the disagreement is whether the spend pays off.\n\n### Camp A — The bull case\n\nThe bull case, articulated most institutionally by Goldman Sachs, is that this is a structural productivity buildout, not a speculative mania — \"akin to the internet boom of the late 1990s, but with more immediate profitability.\" [12] Three pillars:\n\n**Real usage, not just promises.** Anthropic reached ~$30 billion in annualized revenue by April 2026, up from ~$1 billion at the start of 2025 — a 30-fold jump in 15 months — with more than 1,000 business customers each spending over $1 million a year. [15] Uber's CTO reported burning the company's entire 2026 AI budget in four months as engineer adoption rose from 32% to 84% and ~70% of committed code began coming from AI. [15] These are demand signals from paying enterprises, not vendor hype.\n\n**The buildout is funded from profits, not debt.** The bulls' single strongest distinction from 1999: across the big spenders, the ratio of capex to free cash flow sits **below one** — they spend what they earn, not what they borrow. [15] Classic credit-fueled bubbles end when the leverage breaks; here the leverage is largely absent at the hyperscaler level. Goldman models AI contributing a 0.4% direct uplift to S&P 500 EPS in 2026, nearly tripling by 2027. [12]\n\n**FOMO and option value.** Goldman's own research frames the spend as rational insecurity: in a winner-take-most race, under-investing risks irrelevance, so even a low probability of transformative payoff justifies the capex as a real option. [16] Fed Chair Warsh has built a macro thesis on this — AI is \"the most productivity enhancing wave of our lifetimes,\" which, he argues, lets the Fed cut rates without reigniting inflation. [17]\n\n**Who benefits:** the hyperscalers and Nvidia (whose valuations require the narrative); the sell-side and asset managers long the trade; index providers and passive funds mechanically riding the weighting; and an administration that wants the wealth effect and the AI-productivity story to validate rate cuts. The stated motive is technological optimism; the real motive includes that an enormous amount of capital is now committed and needs the thesis to hold.\n\nA fourth bull point, often understated, is the **historical base rate on general-purpose technologies**: electrification, the railroads, and the internet all involved capex that looked insane in real time, drew bubble accusations, and ultimately produced the productivity the skeptics said would never come — just on a longer timeline than the bulls promised. The bull's wager is that AI sits in that lineage, and that the market's impatience — wanting the productivity this quarter — mistakes a timing error for a thesis error. Goldman's \"broadening\" call — a 7,600 S&P target predicated on AI productivity diffusing from the builders to the *users* across non-tech sectors — is the institutional expression of that bet. [12]\n\n### Camp B — The bear case\n\nThe bear case has serious names — Jeremy Grantham, Michael Burry, Apollo's Torsten Sløk — and a sharper edge in 2026.\n\n**The returns aren't there yet.** An MIT Media Lab study found that despite $30-40 billion in enterprise generative-AI investment, **95% of organizations reported zero measurable return**; Goldman itself concedes it finds \"no meaningful relationship between productivity and AI adoption at the economy-wide level.\" [16][18] If the revenue doesn't materialize, the capex is stranded.\n\n**Circular financing.** Nvidia committed up to $100 billion to OpenAI — money substantially spent buying Nvidia chips; Microsoft owns ~27% of OpenAI and is its main cloud provider, recycling Azure revenue into Nvidia. [18][19] GMO calls this \"reminiscent of the circular financing of the internet bubble,\" and 2026 analyses estimate $800 billion-plus of such arrangements that create the *appearance* of commercial demand. [18] OpenAI's economics underline the fragility: ~$13 billion of 2025 revenue against a reported $1.4 trillion of eight-year capex commitments and a projected $74 billion operating loss in 2028 alone; Deutsche Bank pegs cumulative 2024-2029 losses near $140 billion. [18]\n\n**Depreciation and concentration.** The GPUs at the center of the buildout lose value fast and may need replacing well before the decades-long horizons used to justify data-center economics. [18] And Sløk's \"diversification illusion\": 87% of venture funding now flows to AI (versus under 40% to internet firms in 1999), and S&P concentration means a Mag-7 stumble is a market event, not a sector one. [13][14] Grantham: the AI boom \"meets every condition of the railroads and the internet\" and the odds it doesn't bust are \"slim to none,\" with a potential 50% drawdown. [20] Burry has taken a leveraged short via 2027 SOXX puts, telling subscribers \"the end of this is nigh.\" [20]\n\n**Who benefits:** short-sellers and permabears (whose positions need the crack); value managers underexposed to tech who want a re-rating; and commentators for whom a correct bubble call is career-defining. The stated motive is risk discipline; the real motive sometimes includes being painfully out of the trade.\n\nA further bear strand worth taking seriously is the **macro fragility** argument: because hyperscaler capex is now ~1.6% of GDP, AI investment has become a meaningful contributor to *measured GDP growth itself*. [13] If the capex cycle stalls, the bears argue, it subtracts directly from growth — meaning the AI boom is not just propping up the stock market but flattering the GDP print the \"soft landing\" and \"manageable debt\" cases rely on. On this view a capex pause would hit the real economy and the equity market and the fiscal arithmetic at once, which is why the bears treat the AI question as the master risk that sits upstream of several other debates.\n\n### \"Both\" — the synthesis camp\n\nA third position, held by GMO (\"Extreme Bubble, New Golden Era, or Both\") and implicitly by Goldman's later notes, is that AI is *simultaneously* a genuine general-purpose technology and an asset bubble — railroads were both real and a financial catastrophe for early investors. [18] The technology can be transformative *and* today's valuations can be wrong; the productivity shows up over a decade while the equity repricing happens in a quarter. This position separates most cleanly the *factual* question (is AI economically real?) from the *financial* question (are today's prices justified?) — and answers \"yes\" and \"probably not\" respectively. It is also the position least useful to anyone with a book to talk, which is part of why the public argument underplays it.\n\n### What would settle it\n\n**Factual cruxes:** (1) Does measurable, economy-wide productivity growth attributable to AI appear in the BLS/BEA data within ~2-3 years? (2) Does AI revenue distribute across productive enterprises generating returns, or stay trapped in the hyperscaler-to-Nvidia loop? (3) Does the capex-to-FCF ratio stay below one, or do the hyperscalers start funding with debt (the moment the bull case's best argument breaks)? The **interpretation** crux — whether a real technology inside a bubble is \"fine\" or \"dangerous\" — is not resolvable by data; it depends on your time horizon and your leverage.\n\n---\n\n## Debate 3 — Fed Independence: The Politics of Monetary Policy\n\n> **Stakes at a glance.** A Fed leadership change executed under a year of presidential pressure; a now-dropped criminal probe of the outgoing chair; a live Supreme Court case on whether the President can fire governors; and an inflation print (4.2%) that makes the demanded rate cuts treacherous. What is at risk is the single most valuable intangible asset the U.S. financial system owns: the market's belief that the central bank will set rates on the economics, not the politics. The cost of losing it shows up as a permanently higher term premium on $39T of debt — which means the campaign to lower the interest bill by cutting rates could, by destroying credibility, *raise* it.\n\n### The status, as of mid-2026\n\n**Kevin Warsh, 56, was sworn in as the 11th modern Fed chair in May 2026, succeeding Jerome Powell**, who completed eight years and chose to stay on as a governor (his governor term runs to January 2028) — the first chair to do so in nearly 80 years, a move read as defending the institution from inside. [17][21] Powell's selection followed a 2025 competition with as many as 11 candidates. [17] In January 2026 the DOJ served grand-jury subpoenas in a criminal probe of Powell tied to his congressional testimony about the Fed building renovation; **that investigation was dropped on April 24, 2026.** [22] Separately, the Supreme Court heard *Trump v. Cook* on January 21, 2026, on whether the President can remove Governor Lisa Cook over mortgage-fraud allegations — the live test of \"for cause\" removal authority over the Fed. [22]\n\n### Camp A — \"Cut now; the Fed is too tight\"\n\nThe pro-cut camp, led from the White House and now articulated by Warsh, argues that policy is needlessly restrictive and that an AI supply-side boom changes the inflation calculus. Warsh's thesis: AI is \"the most productivity enhancing wave of our lifetimes,\" so output can rise fast enough to let the Fed cut \"aggressively without reigniting inflation.\" [17] On this view the neutral rate is lower than the FOMC thinks, the 2026 SEP's 3.4% median fed-funds path is too high, and holding rates here slows growth and inflates the interest bill for no reason. President Trump told a rally rates would come down \"very quickly.\" [21]\n\nThe camp's strongest *economic* — as opposed to political — argument is about the *composition* of the current inflation. If an energy shock from the Iran conflict drives the 4.2% headline — a supply event the Fed cannot fix with rates — then \"looking through\" it is the textbook response, and core CPI at 2.9% with core commodities actually *falling* supports the view that underlying inflation runs closer to target than the headline suggests. [23] On this read, holding rates high to fight a war-driven oil spike fights the wrong enemy and punishes the real economy for nothing. The supply-side optimists add that tariff effects on prices peaked in Q1 and are fading, removing another supposed inflation source going forward. [44]\n\n**Who *really* wants cuts, and why — the insider read:** the stated rationale is supply-side optimism. The real drivers are (1) the fiscal arithmetic — every 100bp of rate relief shaves tens of billions off a $1T-plus interest bill, so the Treasury and the administration have a direct budgetary stake; (2) the political cycle — lower rates support asset prices and growth into an election; and (3) leveraged asset owners and the housing/private-equity complex, who benefit most from cheaper money. This is the cleanest *cui bono* of the seven debates: the people loudest for cuts are disproportionately those who finance long and benefit from inflation eroding fixed debt.\n\n### Camp B — \"Independence is the asset; cutting into this inflation would burn it\"\n\nThe independence camp — most economists, former Chair/Secretary Janet Yellen, and the markets — argues that the entire value of the Fed is its credibility, and that cutting into rising inflation under political pressure is exactly how that asset is destroyed. The data is against the cut: the May 2026 CPI came in at **4.2% year-over-year — the highest since April 2023 — the third straight monthly acceleration**, driven by a 3.9% monthly energy jump (energy +23.5% over 12 months) from the Iran energy shock; core CPI was 2.9%. [23] Markets expect the Fed *on hold through most of 2026* and price the next move as a possible *hike* in December. [21][23] Cutting into that would be the textbook error.\n\nThe mechanism of the cost, in their language: fiscal dominance — markets coming to believe the Fed will inflate or repress to ease the government's debt — \"is likely to raise term premia and borrowing costs.\" [24] Once inflation expectations unanchor, re-anchoring them costs far more than holding now; the NY Fed's one-year expectations sit at 3.2%. [25] Yellen's Brookings framing casts central-bank independence as the institutional firewall against exactly this. [24] The irony the camp presses: political pressure to cut, if it works, *raises* long-term rates via the term premium — self-defeating for the very interest bill the pro-cut camp wants to lower.\n\nThe camp's historical anchor is the **Burns-era 1970s**, when a Fed widely seen as accommodating presidential pressure let inflation become entrenched, requiring the brutal Volcker disinflation of 1979-82 — a recession and double-digit rates — to undo. The lesson, in their telling, is asymmetric: cutting too soon under political pressure risks a re-run of that decade; holding too long costs comparatively little. They also marshal the *comparative* evidence — the long literature finding that more-independent central banks deliver lower and more stable inflation, the empirical foundation for granting the Fed insulation in the first place. [25] The deepest version of the argument is that independence is not a courtesy but a commitment device: it works precisely *because* the central bank can refuse the politically convenient cut. A Fed that cannot refuse is not independent, whatever its formal structure.\n\n**Who benefits:** bondholders and savers (who want inflation killed); the institutional Fed and its alumni (whose authority is the thing being defended); and foreign holders of Treasuries who need to trust the currency. The stated motive is price stability; the real motive aligns with it unusually well here, which is part of why the camp is broad and bipartisan.\n\n### What would settle it\n\nThis is largely a **factual** dispute about a hidden parameter — the neutral rate and whether AI has raised potential growth enough to disinflate — overlaid on a **value** dispute about how much short-run growth to trade for long-run credibility. The tells to watch: 5y5y forward breakevens (2.34% in early 2026 — if they climb, the market is pricing lost credibility); the term premium; the dollar; and whether the new Fed cuts *before* inflation is convincingly back toward 2%. A cut into 4% CPI would be the market's test of whether the institution still has its independence.\n\n---\n\n## Debate 4 — Market Concentration: Systemic Risk from Index Funds and the Mag-7\n\n> **Stakes at a glance.** Top-10 S&P 500 names ~40% of the index (up from 22% in 2020); passive assets ~$19T, now a majority of fund assets. The systemic question is whether the index every 401(k) holder owns has quietly become a leveraged bet on seven correlated AI-exposed stocks — and whether passive vehicles act as stabilizers or forced sellers when the trade turns. This debate is downstream of Debate 2: the concentration risk only matters if the AI names fall, but if they fall, the concentration is what turns a sector correction into a market event.\n\n### The numbers both sides start from\n\nThe top 10 S&P 500 names reached **~40% of the index by end-2025, up from 22% in 2020**; the Mag-7 alone is 33.8% (June 2026). [14] Passive assets in ETFs and mutual funds hit ~$19 trillion by October 2025 versus ~$16 trillion active, with the index-fund share of fund assets rising from ~28% to ~53% over the decade to January 2026. [26] Concentration is now the highest in the index's modern history.\n\n### Camp A — Concentration is a systemic vulnerability\n\nThe risk camp argues that passive flows and concentration have created a reflexive, fragile market. Their mechanism: index funds buy in proportion to market cap, so money flowing into passive vehicles disproportionately bids up the largest stocks, which raises their weight, which attracts more passive money — a momentum machine with degraded price discovery. [26][27] Risk.net's poll ranks AI/concentration the top portfolio risk for 2026, with concentration cited by 44% (up from 24% in 2025). [26] The tail scenario: index funds aren't normally forced sellers, but a sharp AI drawdown could trigger mass redemptions that *force* selling of the most-weighted names, cascading downward — a \"diversification illusion\" (Sløk) in which a portfolio that looks diversified is really a leveraged bet on seven correlated stocks. [13][27] Governance concentration (BlackRock/Vanguard/State Street holding decisive blocks across the whole market) is a second-order worry.\n\n**Who benefits from sounding the alarm:** active managers (whose pitch is that concentration makes stock-picking valuable again); volatility and tail-hedge sellers; and advisors steering clients to \"diversifiers.\" The stated motive is prudence; the real motive sometimes includes selling the cure.\n\n### Camp B — Concentration reflects fundamentals; passive is stabilizing\n\nThe sanguine camp argues that concentration is the *result* of the largest firms genuinely being the most profitable and fastest-growing companies on earth — not a distortion but accurate pricing. The Mag-7's earnings share roughly tracks its market-cap share, unlike 1999, when the leaders' valuations vastly outran their profits. Passive investing, on this view, *reduces* costs and churn and is not normally a forced seller, so it dampens rather than amplifies volatility in ordinary conditions. The 2000-era top-seven names traded at far richer multiples than today's leaders, so the historical analogy cuts the other way.\n\nThe camp also pushes back on the \"passive distorts prices\" mechanism directly: passive funds are price-*takers*, not price-*setters* — they buy at whatever price active managers and arbitrageurs have set, so active capital still sets the marginal price. As long as enough active money remains to enforce fundamentals — and trillions still do — passive flows ride the price rather than dictate it. On the forced-seller fear, the camp notes that index funds only sell when their *own* investors redeem, and retirement-account passive money has stayed remarkably sticky even through past drawdowns: 401(k) contributors kept buying through 2008 and 2020. The \"diversification illusion\" critique, they argue, is really a complaint about *valuation*, not *structure*. If you think the Mag-7 is overvalued, say so — but that is a view about prices, not a flaw in indexing.\n\n**Who benefits:** index providers and passive managers; the mega-caps; and long-term investors who'd rather not pay active fees. The stated motive is empirical (price = fundamentals); the real motive includes defending a $19 trillion business model.\n\n### What would settle it\n\n**Factual cruxes:** Does passive flow demonstrably move large-cap prices independent of fundamentals (the academic literature is genuinely split)? In the next real drawdown, do passive vehicles act as forced sellers or stabilizers? Until a stress event, this is partly untested — which is itself the risk camp's point. The **interpretation** crux: whether \"the market is seven stocks\" is a fact about fragility or a fact about where the value actually is.\n\n---\n\n## Debate 5 — Private Credit / Shadow Banking: Dispersed Safety or Untested Vulnerability?\n\n> **Stakes at a glance.** A $1.5-2.0T asset class that grew up almost entirely outside the post-2008 bank regulatory perimeter, now drawing its first formal FSB warning (May 6, 2026) and a Fed bank-exposure inquiry (April 2026) triggered by real redemptions and rising defaults. Bank exposure is officially ~$220B but commercially estimated up to $500B — the size of the data gap is itself a finding. The asset class has never been through a full default cycle at this scale. The single most telling fact: the industry's loudest public defenders are, behind the scenes, de-risking their own books.\n\n### The status and the numbers\n\nThe private-credit market is estimated at **$1.5-2.0 trillion** as of end-2024. [27a][28] Two regulatory actions in 2026 anchor the debate: the **FSB published its *Report on Vulnerabilities in Private Credit* on May 6, 2026**, formally warning on the sector [28]; and in **April 2026 the Federal Reserve launched an inquiry into U.S. banks' exposure to private credit**, prompted by \"a surge in redemptions from the funds and a rise in troubled loans.\" [29] Both are live, recent, and central.\n\n### Camp A — The FSB/regulator view: opaque, leveraged, untested\n\nThe risk camp's case is now institutional, not just commentary. The FSB warns the sector's \"complexity, leverage, and interconnectedness could amplify stress in adverse scenarios.\" [28] Specifics: **direct bank exposure of ~$220 billion in drawn/undrawn facilities** (commercial estimates run $270-500 billion), revealing data gaps; valuation opacity and reliance on private credit ratings that \"can amplify strains in stress\"; borrowers with lower credit quality and higher leverage than public comparables, rising use of payment-in-kind, and rising defaults; concentration in technology, healthcare, and services; and \"opaque, multi-layered structures.\" [28] The newest worry is the **\"retailisation\"** of private credit — funds marketed to wealthy retail investors with redemption options that introduce a liquidity mismatch and procyclicality the sector was supposed not to have. [28] The Fed's April inquiry was triggered by exactly that mismatch showing up — redemptions and troubled loans — which the risk camp reads as the first tremor. [29] The structural critique: the asset class has never been tested by a full default cycle at this scale, valuations are marked by the managers themselves, and the interconnection with banks and insurers means a private-credit shock need not stay contained.\n\nThe deeper analytical worry is about *valuation* and *transparency*. Public credit is marked to market daily; private credit is marked by the managers themselves, often quarterly, using models. In a downturn, the risk camp argues, this lets losses be deferred and smoothed rather than recognized — which feels like stability but is opacity, and opacity is what turns a manageable downturn into a confidence crisis when the marks finally catch up to reality. The spread of \"payment-in-kind\" arrangements (where a struggling borrower pays interest with more debt rather than cash) is, on this reading, a way of hiding stress: a loan that is technically performing because the borrower was allowed to defer cash interest is not a healthy loan. [28] And the interconnection map — private credit funds borrowing from banks, selling to insurers, owned by private-equity sponsors — means a shock in one node can transmit through channels regulators cannot yet see, the precise gap the FSB's data agenda is meant to close. [28]\n\n**Who benefits from the warning:** regulators (expanding remit); banks that lost the lending business and would like it re-regulated; and short-sellers of BDCs. The stated motive is financial stability; the real motive sometimes includes turf and competitive resentment.\n\n### Camp B — The Apollo/Blackstone view: this is *safer* than banking\n\nThe industry's defense, led by Apollo's Marc Rowan and Blackstone's Steve Schwarzman, is that the entire panic targets the wrong risk. Rowan: critics fixate on \"a tiny sliver of risky loans\" and treat it as if it represents a $40 trillion market; \"people have really just lost their minds.\" [30] The structural case: lending migrating *out* of deposit-funded, 10:1-leveraged banks *into* long-term, locked-up funds **disperses** credit risk onto patient capital that cannot be forced to sell — the opposite of the 2008 short-funding fragility. [30][31] Schwarzman: private credit is \"much more conservative for the system\" than banks leveraged 10:1. [31] Supporting points the camp cites: fund lifespans average 10-12 years (minimal maturity mismatch); funds hold equity of 65-80% of assets, \"over six times bank capitalization\"; and most private credit held by insurers and pension buyers is investment-grade. [30] On redemptions, Rowan's blunt line — anyone who can't meet 5% fund redemptions is \"an idiot\" — is meant to say the liquidity terms are conservative by design. [30]\n\nThe camp's most sophisticated argument turns the systemic framing on its head: the 2008 crisis happened *because* credit risk sat on highly-leveraged, short-funded bank balance sheets that faced runs. Move that same risk into vehicles with locked-up capital, low leverage, and patient owners, and you *remove* the run dynamic that makes banking crises catastrophic. Private credit, on this view, is not a shadow banking system to be feared but a *de-risking of the financial system* — the very migration the post-2008 reformers should have wanted. Defaults will happen, Rowan concedes; that is what credit does. But a default a long-term fund absorbs without selling is a P&L event, not a systemic one.\n\n**The insider tell — stated vs. real:** the camp's *choice of arguments* is itself a signal. Even as Rowan defends the asset class publicly, Apollo has been *systematically reducing portfolio risk since late 2025*, and Rowan himself has warned of a coming \"shakeout amid rising defaults.\" [30] The public message is \"nothing to see here\"; the private behavior is de-risking. That gap is the most important fact in this debate.\n\n**Who benefits:** Apollo, Blackstone, Ares, KKR (whose AUM and fee streams depend on the asset class staying unregulated and trusted); and the insurers and pensions already invested, who need the marks to hold. The stated motive is structural soundness; the real motive is protecting an enormously profitable, lightly regulated business.\n\n### What would settle it\n\n**Factual cruxes:** (1) How do private-credit marks behave in a genuine default cycle — do they take real losses or just deferred ones via PIK and amend-and-extend? (2) Are the redemption gates actually binding when retail money runs, or do they fail like the open-end real-estate funds did? (3) What is the *true* bank and insurer exposure once the FSB closes the data gap — $220B or $500B? The Fed inquiry and FSB data agenda are designed to answer (3). Until a default cycle tests (1) and (2), \"dispersed and safe\" and \"opaque and untested\" are both consistent with the present evidence — which is the heart of why the debate is unresolved.\n\n---\n\n## Debate 6 — The K-Shaped Economy and Affordability: Strong Aggregates vs. Household Strain\n\n> **Stakes at a glance.** Real GDP printing as high as 4.3% annualized in a recent quarter and consumption powering the economy — yet a large share of households report being worse off, with housing affordability standards drifting from \"30% of income\" to \"40% as the new 30%.\" This is the debate where the political and the economic most directly collide: it is simultaneously about distributional facts (real wages and delinquencies by income tier) and about a value judgment (does a strong average excuse a strained bottom half?) that no dataset resolves.\n\n### The tension\n\nThe aggregate data is genuinely strong: real GDP grew at a 4.3% annualized rate in one recent quarter, the FOMC projects 2.4% growth for 2026, unemployment near 4.4%, and consumer spending keeps powering the economy. [21][32] Yet sentiment is sour and a large slice of households report being worse off — the disconnect labeled, depending on the writer, \"vibecession,\" \"vibepression,\" or the \"K-shaped economy.\" [32][33]\n\n### Camp A — The K is real and widening\n\nThis camp argues the averages mask a genuine split. The top arm of the \"K\" — asset-owning, high-credit households — leverages wealth and spends freely, propelled by stock and home gains. The bottom arm is stretched by cumulative price levels (not just the rate of inflation), the resumption of student-loan payments, and rising revolving debt; the standard for housing affordability has shifted from \"30% of income\" toward \"40% as the new 30%.\" [33][34] Stress shows in chronic revolving-debt growth and reliance on high-cost alternative credit among underserved borrowers. [33] Even some six-figure earners are \"on thin ice.\" [35] The strong aggregate consumption number, on this read, is *composition* — the top quartile spending enough to lift the average while the bottom half retrenches.\n\nThe camp's analytical core is that **wealth effects now drive consumption more than wage income**, which tilts the economy toward the asset-owning top. When stock and home prices rise, the households that own those assets feel richer and spend more — but those households cluster in the top quartile, so a strong aggregate consumption number can coexist with a retrenching bottom half. The bottom arm of the \"K,\" by contrast, lives on wage income against a cumulative price level ~20% above its pre-2021 baseline; even with inflation *slowing*, the *level* of prices remains a daily grievance. Add the resumption of student-loan payments, rising revolving-credit balances, and reliance on high-cost alternative credit among the underserved, and the camp's picture is of an economy whose strength is real but narrowly held. [33]\n\n**Who benefits from this framing:** the political opposition of the day (strain is an indictment of incumbents); progressive economists and advocacy groups whose agenda (transfers, minimum wage, housing) the framing supports; and outlets whose audience feels the squeeze. The stated motive is empathy/accuracy; the real motive often includes a distributional politics.\n\n### Camp B — The aggregates are real; the \"vibecession\" is sentiment, not substance\n\nThis camp argues that hard data beats vibes: people keep spending because their finances are actually fine, and the gloom is a measurement and media artifact. Strong household balance sheets and rising wealth are \"keeping Americans spending\"; the puzzle is that attitudes turned sour while behavior didn't, echoing the 2022-23 Biden-era vibecession when \"gloomy consumers stoked fears of a downturn but the economy hummed along.\" [32][36] The Minneapolis Fed's own review questions how cleanly \"K-shaped\" the consumer data actually is, and some indicators show the *lower* end (sub-580 credit scores) improving faster than the top recently — the opposite of a widening K. [34][37] On this view, the disconnect is real but psychological — driven by price *levels* people resent even as incomes catch up.\n\nThe camp's sharpest point is methodological: the K-shaped narrative leans heavily on *anecdote* and *sentiment surveys*, which have diverged from *behavior* since 2022. People tell pollsters the economy is terrible and then go shopping; sentiment indices crashed while retail sales rose. If revealed preference (what people do with their money) beats stated preference (what they tell surveys), then the \"strain\" is partly a story people tell, amplified by media and partisanship, rather than a balance-sheet reality. The Minneapolis Fed's data review lends qualified support, finding the consumer data less cleanly \"K-shaped\" than the narrative implies and noting recent improvement at the *lower* end (sub-580 credit scores rising faster than prime) — the opposite of a widening K. [34][37]\n\n**Who benefits:** incumbents (the economy is good, trust the data); economists invested in \"revealed preference\" (spending is the truth); and equity bulls who need the consumer intact. The stated motive is empiricism; the real motive includes defending a record.\n\n### What would settle it — mostly a value dispute\n\nThis is the debate where **fact and value blur most**. The aggregates and the distribution are *both* true — strong mean, wide variance — so \"is the economy good?\" depends on whose experience you weight. The factual sub-questions are resolvable (real wage growth by quintile, delinquency rates by income, the actual housing cost-burden distribution), but \"does a strong average excuse a strained bottom half?\" is a value judgment no dataset closes. The tells: subprime auto and credit-card delinquencies, the savings rate by income tercile, and whether real wages at the bottom keep pace with the cumulative price level.\n\n---\n\n## Debate 7 — Tariffs and Trade: Macro Effects, Inflation Pass-Through, and the Reordering\n\n> **Stakes at a glance.** A trade regime legally restructured mid-stream by a 6-3 Supreme Court ruling (Feb 20, 2026) that killed the IEEPA tariffs and forced a 10% Section 122 replacement, leaving a ~11.7% weighted-average applied tariff rate — the highest in generations, down from a pre-ruling peak. Critics score it a regressive inflation tax and a ~0.3-0.6pp growth drag; defenders point to muted measured pass-through (Dallas Fed: peaked Q1 2026), ~$98B of revenue, and a CBO line scoring tariffs as *cutting* deficits $3.0T. The 150-day Section 122 clock means the regime's level is itself legally uncertain — which suppresses the very investment the policy aims to redirect.\n\n### The status and the numbers\n\nThe tariff regime was **legally restructured on February 20, 2026**, when the Supreme Court ruled 6-3 (Roberts writing) that **IEEPA does not authorize the President to impose tariffs**, invalidating roughly $166 billion in collected IEEPA tariff revenue (refunds owed). [38][39] Trump responded on February 24, 2026 by imposing a **10% global tariff under Section 122** (which allows up to 15%), covering an estimated $1.2 trillion (~34%) of annual imports on a 150-day clock, leaving Section 232 and 301 tariffs untouched. [38][39] The resulting weighted-average applied tariff rate stands at **~11.7%** as of mid-2026, up from a ~1.5% pre-Trump baseline — the highest in generations. [39] Tax Foundation (libertarian-leaning) estimates ~$98 billion of 2026 tariff revenue (0.31% of GDP), a long-run GDP drag of ~0.3% from the Section 232 tariffs before retaliation, and a ~$700 average household cost in 2026 (down from ~$1,000 in 2025 as the regime shrank post-ruling). [39]\n\n### Camp A — Tariffs are a net macro drag and an inflation tax\n\nThe critics' case: tariffs are a regressive consumption tax that raises prices, lowers real incomes, and slows growth, with the burden falling hardest on lower-income households. The Peterson Institute (PIIE) forecasts a ~0.62pp reduction in 2026 growth; American firms saw ~40% of unit-cost growth in 2025-26 from tariffs; Fed Vice Chair Jefferson attributed \"lack of progress\" on inflation to \"tariff effects.\" [40][41] CFR frames a \"hidden cost\" running through Treasuries — protectionism that unsettles trade also unsettles the foreign demand the U.S. relies on to fund its deficit. [42] Jeffrey Frankel (Project Syndicate) argues the real tariff hit to inflation and real incomes may land *in 2026* even if it was muted in 2025 — a delayed, termite-like erosion rather than a single shock. [43] The reordering critique: retaliation hits agriculture and key exports, supply chains fracture, and the uncertainty itself suppresses investment.\n\nThe distributional mechanism is central to the critics' case. A tariff is a tax on consumption, and consumption is a larger share of income for poorer households, so the burden is regressive almost by construction — the ~$700-$1,000 average household cost lands hardest on those least able to absorb it. [39] The critics also stress the *second-order* damage: retaliation that closes export markets for American farmers and manufacturers, the disruption of integrated North American supply chains in energy and steel, and — most insidiously — the chill that *uncertainty* puts on business investment, since firms cannot plan capacity around a tariff schedule that changes by executive order or court ruling. CFR's \"hidden cost\" argument extends this to the Treasury market itself: a trade policy that antagonizes the foreign creditors who fund the U.S. deficit risks raising the very borrowing costs Debate 1 is about. [42]\n\n**Who benefits from this framing:** importers, retailers, multinationals, and free-trade economists (Peterson, CFR) whose worldview and clients favor open trade; and the political opposition. The stated motive is consumer welfare; the real motive includes the interests of globally-integrated business.\n\n### Camp B — The tariffs are working better than predicted; the pass-through is muted\n\nThe defenders' case got an unexpected assist from the data: core *commodities* prices actually *fell* 0.1% in the May 2026 CPI, and the Dallas Fed found tariff effects on PCE prices **peaked in Q1 2026** and have largely moved through the system — i.e., the pass-through to consumers was smaller and more transitory than critics warned. [23][44] Frankel's own question — \"Why haven't Trump's tariffs crashed the US economy?\" — concedes the catastrophe didn't arrive on schedule. [43] On this view, foreign exporters and supply chains absorbed much of the cost, tariff revenue (~$98B) is real money, and CBO scored higher tariffs as *reducing* deficits by $3.0 trillion over the window — a fiscal positive. [2][39] The strategic case: tariffs are leverage for reshoring critical supply chains (the energy/steel/critical-minerals reordering) and a bargaining tool, and the 10% Section 122 rate deliberately leaves headroom to escalate. [38]\n\nThe defenders' deeper claim is about the *incidence* of the tax — who actually pays. Standard trade theory says the importing country's consumers bear the tariff; the defenders argue that in practice, exporters facing a large, hard-to-replace market like the U.S. absorb much of it in their margins to keep volume, which is why the measured pass-through to U.S. consumer prices has stayed muted. [44] The Q1-2026 \"peak and fade\" pattern, on their read, is evidence that the worst-case inflation forecasts never materialized. They pair this with a strategic-autonomy argument: tariffs are leverage to reshore critical supply chains — semiconductors, critical minerals, steel — whose offshoring now reads as a national-security vulnerability rather than an efficiency gain, and the consumer cost is the premium paid for resilience. The 10% Section 122 rate, deliberately set below the 15% statutory ceiling, is presented as calibrated leverage with room to escalate against specific partners. [38]\n\n**Who benefits:** the administration (vindication and revenue); domestic producers in protected sectors; and economic-nationalist think tanks. The stated motive is strategic/industrial; the real motive includes a political win and a deficit-reduction line in the CBO score.\n\n### What would settle it\n\n**Factual cruxes:** (1) Where does the incidence actually fall — the Q1-2026 \"peak and fade\" evidence suggests more was absorbed abroad than critics predicted, but Frankel's delayed-effect thesis says wait for the 2026 data. (2) Does the ~0.3-0.6pp growth drag show up in realized GDP? (3) Does reshoring materialize, or just higher prices? The **interpretation** crux: whether tariff revenue and reshoring \"justify\" the consumer cost is a value trade-off, not a fact. The wild card is legal — the 150-day Section 122 clock and further litigation mean the regime's *level* is itself uncertain, which suppresses the very investment decisions the policy aims to redirect.\n\n---\n\n## Cross-Cutting Dynamic — The Iran Energy Shock as the 2026 Wildcard\n\nRunning underneath several debates is a development that arrived only in 2026: a **U.S.-Iran conflict that produced an energy shock**, with energy prices up 23.5% over twelve months and a 3.9% monthly jump driving May CPI to 4.2%. [6][23] This single event reshapes three debates at once: it is the proximate cause of the inflation re-acceleration that makes a Fed cut treacherous (Debate 3); it added a war-risk premium to the weak Treasury auctions cited by the bond-vigilante camp (Debate 1); and it sharpened the dollar-as-weapon dynamic in the reserve-currency debate. The macro arguments of mid-2026 are being conducted on ground a geopolitical shock can move under everyone's feet — a fact both the \"manageable debt\" and \"soft-landing\" camps have to absorb.\n\n---\n\n## Cross-Cutting Dynamic — Dollar Dominance: Eroding Slowly, Not Collapsing\n\nThough dollar dominance is largely a forecast question taken up in the outlook, it is also a live mid-2026 *debate* and belongs here in brief. The agreed facts: the dollar is ~57% of global FX reserves (2025Q3), down from over 70% two decades ago, with the euro a distant second at ~20% and no rival close. [45]\n\nThe **de-dollarization camp** points to three dynamics. First, gold's rising reserve share — EM central-bank gold holdings are ~9%, roughly double a decade ago, with China, Russia, and Türkiye the largest buyers — as central banks diversify away from a currency they increasingly see as a political liability. [45] Second, the \"weaponization paradox\": the more the U.S. uses dollar-system exclusion as a sanctions tool, the more even allied countries quietly hedge their dollar exposure, because no one wants to be the next country cut off. [46] Third, the Iran-war risk premium and the broader politicization of the Fed and trade policy under the current administration, which erode the *trust* that underpins reserve status as much as any mechanical alternative. [46]\n\nThe **dollar-resilience camp** counters that all of this is real but slow, and that \"de-dollarization\" in the dramatic sense requires a *replacement* that does not exist. The euro area lacks a unified, deep safe asset (there is no \"Eurobond\" market remotely the size of Treasuries); the renminbi is not freely convertible and sits behind capital controls China is unwilling to remove; and gold is a store of value, not a transaction or invoicing currency. The realistic path, on this view, is a gradual drift toward a *multipolar* reserve world — the dollar still the largest by far, sharing influence with the euro, the renminbi at the margins, and gold — rather than a discontinuous collapse. The network effects are formidable: the dollar is dominant partly *because* it is dominant, and incumbency in a network good is extraordinarily sticky.\n\nClaims of a launched BRICS gold-backed \"Unit\" currency circulate widely but rest largely on weak sourcing and are best treated as contested. The factual crux is narrow: does any rival build a deep, liquid, trusted safe asset at scale? Absent that, the erosion stays gradual — which is itself the resilience camp's point and the de-dollarization camp's frustration.\n\n---\n\n## How the Seven Debates Interlock\n\nThese are not seven independent arguments; they share variables, and the connections are where the real risk lives. The point here is not to settle them but to show the dependencies that link them.\n\n**AI is the master variable.** Debate 2 sits upstream of at least three others. If the AI productivity story is real, it lifts potential growth (helping the \"manageable debt\" case in Debate 1 by raising g), justifies rate cuts without inflation (the pro-cut case in Debate 3), and validates the concentration as fundamentals-driven (the sanguine case in Debate 4). If it is a bubble, a drawdown in the most-weighted names (Debate 4) hits household wealth (worsening the K-shape in Debate 6), subtracts from GDP (since capex is ~1.6% of it), and removes the growth that made the debt look manageable. The AI question is therefore not one debate among seven; it is the hinge on which the others turn.\n\n**The Fed sits at the center of the fiscal-inflation-credibility triangle.** A rate cut (Debate 3) lowers the interest bill (helping Debate 1) but, if it unanchors expectations, raises the term premium (hurting Debate 1) — the same action with opposite signs depending on credibility. The energy shock makes every choice harder.\n\n**Private credit and concentration are the two untested systemic nodes.** Both (Debates 4 and 5) are structures that *look* stable in normal conditions and whose behavior under stress is genuinely unknown. They are also linked: a market drawdown that pressures private-credit borrowers and triggers fund redemptions would test both at once.\n\n**Tariffs and the energy shock are the exogenous inflation sources** feeding Debate 3 and complicating Debate 1. The difference is that one (tariffs) is a domestic policy choice subject to litigation, and the other (energy/Iran) is a geopolitical event no one controls.\n\n---\n\n## Dynamics in Motion — What Is Actively Changing\n\nBeyond the static map of camps, several dynamics are *moving* the system in mid-2026, and they interlock.\n\n**The Fed is changing hands and possibly changing doctrine.** The Powell-to-Warsh transition is not merely a personnel change; Warsh has staked his chairmanship on an AI-supply-side disinflation thesis that, if wrong, collides head-on with a 4.2% CPI. [17][23] The institution is at once defending its removal protections at the Supreme Court (*Trump v. Cook*) and absorbing the precedent of a chair staying on as governor to guard independence from inside. [21][22] This is the most consequential institutional change of the period.\n\n**Regulators are catching up to private credit in real time.** The FSB warning (May) and the Fed inquiry (April) mark the moment the post-2008 supervisory apparatus turned its attention to a sector that grew to $1.5-2T largely outside it. [28][29] The \"retailisation\" trend — selling private credit to wealthy retail investors with redemption options — is the specific dynamic that converted a slow-burn concern into an active one, because it introduced the liquidity mismatch the asset class was supposed not to have. [28]\n\n**The tariff regime is legally unstable and therefore strategically unstable.** The February Supreme Court ruling did not end the trade war; it forced it into a different statutory channel (Section 122, Section 232/301) on a 150-day clock. [38] The dynamic to watch is not the *level* of tariffs but their *legal durability* — every importer and manufacturer is making capacity decisions against a regime that could change again by court order or expiry.\n\n**Concentration is self-reinforcing until it isn't.** Passive flows mechanically buy the largest names, raising their weight, attracting more flows — a momentum dynamic that has run for a decade and is now at a record. [26] The question is not whether it continues but what reverses it; the reversal mechanism (mass redemptions forcing passive selling of the most-weighted names) is the untested tail. [27]\n\n**The energy shock is the swing variable.** If the Iran-driven energy spike fades, the 2026 inflation re-acceleration partially reverses, the Fed's bind eases, and the AI-disinflation thesis gains plausibility. If it persists or worsens, the inflation/rate/fiscal debates all tighten at once. [23] No other single variable touches as many of the seven debates.\n\n---\n\n## Open Questions\n\n1. **Does r>g actually arrive and persist?** The CBO baseline now says yes by ~2031; the manageable camp bets the forecast is wrong. The single most important fiscal fact of the decade is unresolved until the data lands.\n2. **Is the AI capex-to-FCF ratio sustainable?** The bull case's strongest plank is that the buildout is funded from profits, not debt. If the hyperscalers start issuing debt to fund capex, the best bull argument breaks — and that shift would be observable in real time.\n3. **Will the new Fed cut into 4%+ inflation?** A cut before inflation is convincingly back toward 2% would be the live test of whether the institution retained its independence through the Powell-to-Warsh transition. Watch 5y5y breakevens and the term premium.\n4. **Does private credit survive a default cycle?** The asset class has never been stress-tested at $1.5-2T scale. The Fed's April inquiry and FSB's data agenda will reveal true bank/insurer exposure; only a downturn reveals whether marks and gates hold.\n5. **Where does tariff incidence ultimately fall?** Q1-2026 evidence suggests foreign absorption exceeded predictions, but Frankel's delayed-effect thesis is unfalsified. The 2026 full-year data, plus the outcome of Section 122 litigation, will settle level and incidence.\n6. **Is the K-shape widening or narrowing?** Recent data showing sub-580 borrowers improving faster than prime borrowers complicates the \"widening K\" story — but this may be noise. Delinquency trends by income tercile are the dial.\n7. **How load-bearing is the Iran energy shock?** If energy prices normalize, much of the 2026 inflation re-acceleration could reverse, partially vindicating the AI-disinflation thesis Warsh has staked his chairmanship on. If the conflict persists, the Fed's bind tightens.\n8. **Does any genuine dollar alternative emerge?** Multipolar drift is the consensus path; a discontinuous break requires a rival safe asset that does not currently exist. The renminbi's convertibility and any credible euro-area safe asset are the things to watch.\n\n---\n\n## Sources\n\nSEP. Federal Reserve, \"FOMC Projections materials\" (Summary of Economic Projections), March 18, 2026 (median: 2026 real GDP 2.4%, PCE inflation 2.7%, unemployment 4.4%, fed funds 3.4%; 2027-28 and longer-run paths). https://www.federalreserve.gov/monetarypolicy/fomcprojtabl20260318.htm — Tier 1 (Fed primary). Accessed 2026-06-21.\n1. U.S. Treasury Fiscal Data / Joint Economic Committee Republicans, \"Monthly Debt Update,\" debt-to-the-penny figures through June 17, 2026 ($39.28T total; $31.64T public; +$2.99T YoY). https://fiscaldata.treasury.gov/datasets/debt-to-the-penny/ ; https://www.jec.senate.gov/public/vendor/_accounts/JEC-R/debt/Monthly%20Debt%20Update.html — Tier 1 (primary government data). Accessed 2026-06-21.\n2. Congressional Budget Office, \"The Budget and Economic Outlook: 2026 to 2036,\" February 2026 (FY26 deficit $1.9T/5.8% GDP → $3.1T/6.7% by 2036; debt 101%→120% of GDP; net interest $970B (2025)→$2.1T (2036); tariffs scored as cutting deficits $3.0T). https://www.cbo.gov/publication/61882 — Tier 1/2 (authoritative institutional). Accessed 2026-06-21.\n3. The Fiscal Times, \"Soaring Interest Costs Spark New Warnings of Potential Debt Spiral,\" May 27, 2026 (feedback-loop mechanism; interest exceeds defense). https://www.thefiscaltimes.com/2026/05/27/Soaring-Interest-Costs-Spark-New-Debate-Potential-Debt-Spiral — Tier 5 (analytical). Accessed 2026-06-21.\n4. Committee for a Responsible Federal Budget (citing CBO), via Fortune, \"A U.S. 'debt spiral' could start soon…,\" Feb 14, 2026 (avg rate 3.32%→3.9%; nominal growth 4.1%→3.8%; \"start of a debt spiral\"; r>g by ~FY2031). https://fortune.com/2026/02/14/us-debt-spiral-interest-rate-treasury-bond-yields-economic-growth-gdp/ — CRFB is a center/deficit-hawk think tank (Tier 5, position-evidence); underlying CBO data Tier 1. Accessed 2026-06-21.\n5. CRFB, \"Weak Auctions Un
