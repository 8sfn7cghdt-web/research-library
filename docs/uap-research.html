#pager { max-width: 700px; width: 100%; margin: 0 auto; padding: 1.1rem 2rem 3rem;
  display: flex; align-items: center; justify-content: space-between; font-family: var(--sans);
  border-top: 1px solid var(--border); }
#pager button { background: none; border: 0; border-radius: 0; padding: .2rem 0;
  font-family: var(--sans); font-size: .68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .12em; color: var(--accent); cursor: pointer; max-width: 40%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s var(--ease), transform .16s var(--ease); }
#pager button:hover:not(:disabled) { color: var(--text); }
#prev:hover:not(:disabled) { transform: translateX(-3px); }
#next:hover:not(:disabled) { transform: translateX(3px); }
#pager button:disabled { opacity: .35; cursor: default; }
#pager-label { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--muted); }

  body.menu-open #sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  #menu-btn { display: block; }
  #main { margin-left: 0; }
  #content { padding-top: 3.6rem; }

/* a deep-linked passage flashes briefly when the reader scrolls to it */
@keyframes passageFlash { 0% { background: var(--mark); } 100% { background: transparent; } }
.passage-flash { animation: passageFlash 2.2s ease; border-radius: 4px; box-decoration-break: clone; }
/* related reading at the foot of the reading column */

.related-h { font-family: var(--display); font-weight: 600; font-size: 1.08rem; margin: 0 0 .9rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

  position: relative;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease),
              border-color .16s var(--ease), outline-color .16s var(--ease); }
.related-card:hover, .related-card:focus-visible { border-color: var(--text);

  letter-spacing: .14em; color: var(--accent); margin: 0 0 .3rem; }

@media (min-width: 861px) {

  align-items: center; justify-content: center; }

<script id="corpus-data" type="application/json">{"slug": "uap-research", "title": "From Roswell to Disclosure", "subtitle": "The U.S. UFO/UAP phenomenon, 1947–2030", "author": "", "generated": "", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of UAP", "summary": "For eighty years people have reported strange things in the sky that no one can identify; the real fight is not whether the reports exist — they plainly do — but whether the leftover unexplained cases are ordinary things we haven't pinned down yet, or something genuinely new the government is hiding.", "body": "# Six Easy Pieces of UAP\n*What we actually know about strange things in the sky — and what we only argue about*\n\n## The sky is full of things nobody can name\n\nIn the summer of 1947 a pilot named Kenneth Arnold saw nine fast objects near a mountain in Washington State. A reporter turned his words into the phrase \"flying saucers,\" and within weeks Americans were reporting saucers everywhere. That was the start. It has never really stopped.\n\nHere is the one idea to hold onto. For eighty years, ordinary and credible people — airline captains, radar operators, Navy fighter pilots — have reported seeing things in the sky they could not explain. That much is not in dispute. The dispute is about the leftovers. When you take all the reports and patiently rule out the balloons, the drones, the camera glitches, and the planet Venus low on the horizon, a small pile of cases is left over that still resists every ordinary explanation. The entire modern argument turns on that pile. One side says the leftovers are just cases we haven't cracked yet, waiting on better cameras. The other side says at least a few of them are something genuinely new — and that the U.S. government has known for decades and kept it secret. Almost everything else is a footnote to that single question.\n\nThe neutral name for the whole subject is now **UAP** — Unidentified Anomalous Phenomena, the government's deliberately dull replacement for \"UFO.\" The dullness is the point. \"UFO\" makes you picture a saucer with aliens; \"UAP\" just means \"something we can't identify yet,\" with no guess baked in about what it turns out to be.\n\n## Why a serious person should care\n\nYou might think this is a hobby for people with a shortwave radio and a lot of free time. It stopped being that in December 2017.\n\nThat month, *The New York Times* revealed that the Pentagon had been quietly studying UFO reports and had gun-camera videos of Navy pilots chasing objects they couldn't identify. A fifty-year taboo broke overnight. Since then the subject has moved into the most serious rooms in the country: sworn testimony before Congress, a standing Pentagon office, NASA studies, annual laws.\n\nThe stakes now split in two directions, and both are real. If the leftover cases are foreign spy drones and balloons — and some clearly are — then objects are flying over restricted U.S. military airspace, for hours, and nobody is stopping them. That is a straightforward national-security failure. If instead a senior intelligence officer is right that the government has secretly recovered craft \"of non-human origin,\" then Congress has been kept in the dark about the biggest secret in history — a failure of the whole system of oversight. You do not have to believe in aliens for this to matter. Either answer is a problem worth a hearing. And roughly **44% of Americans** already believe their government is hiding what it knows — an unusually high level of specific distrust for any single subject, and it climbs among younger people.\n\n## The players you need to keep straight\n\nA handful of names and terms carry the rest.\n\n**AARO** — the All-domain Anomaly Resolution Office, the Pentagon shop created in 2022 to investigate sightings and publish the government's official findings. Think of it as the referee. Its verdict so far: no evidence of alien craft, and about 95% of cases resolve into ordinary things.\n\n**PURSUE** — a 2026 White House initiative that dumps old government UFO files straight onto the internet, raw and unexplained, and lets the public sort them out. AARO explains; PURSUE just unseals.\n\n**The whistleblowers.** A small group of former officials who say a secret program exists. The central figure is **David Grusch**, a former intelligence officer who testified under oath in 2023 that he was told — in the course of his job — about a hidden \"crash-retrieval and reverse-engineering\" program, and that the U.S. holds \"non-human biologics.\" Around him: **Luis Elizondo** and **Christopher Mellon**, both ex-Pentagon.\n\n**The skeptics.** People like video analyst **Mick West**, who argue the famous Navy videos show camera artifacts and misjudged distances, not exotic craft.\n\n**The scientists.** Harvard astronomer **Avi Loeb** runs the **Galileo Project**, building civilian telescopes to hunt for anomalies without waiting on the government — the idea being that if independent instruments find something, it can't be dismissed as a secret military program.\n\n**NHI** — \"non-human intelligence,\" the careful term advocates prefer over \"aliens.\" It's built to be broader: it leaves room for visitors from another planet, but also for stranger possibilities, without committing to the science-fiction version.\n\n## How you actually get from a report to a verdict\n\n<figure class=\"corpus-fig\" role=\"group\">\n<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgFBgcGBQgHBgcJCAgJDBMMDAsLDBgREg4THBgdHRsYGxofIywlHyEqIRobJjQnKi4vMTIxHiU2OjYwOiwwMTD/2wBDAQgJCQwKDBcMDBcwIBsgMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDD/wAARCALdBEwDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAQACAwQFBgcI/8QAXxAAAgEDAgMFBQQECAkHCQUJAQIDAAQREiEFMUETIlFhcQYygZGhFCNCsVJiwdEHFTNygpLh8BYkJTRDU6Kys1Rjc6O0wvEmJzU2RHSTpMMXN1VkdYPSRWWEhZQIRv/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EAC8RAQEAAgICAgEEAQQCAQUAAAABAhEhMRJBA1ETIjJhcQR NVW50IbmkaRpUUqVKlQKlSpUCpdKVKgFGlSoEaVKlQKlSpUCpUqVAqVI0qBUqVKgVKlSoBRpUqBUqVKgFGhRFAqVKlQKlSpUCoUaVAKNClQGlSpCgVKlSoFSoUqD/2Q==\" alt=\"A sober investigation room with radar screens, pilot equipment, evidence panels, and one unresolved bright object over a runway.\" style=\"width:100%;height:auto;display:block;border-radius:var(--fig-radius,4px)\" loading=\"lazy\" decoding=\"async\">\n<figcaption><strong>From sighting to verdict.<\/strong> The serious UAP question is not belief first, but the disciplined sorting of sensors, witnesses, known objects, and the residue that remains.<\/figcaption>\n<\/figure>\n\n\nHere is the machine that now runs, step by step.\n\nA Navy pilot on a training flight sees something odd and — this is new since about 2019 — files a report without fear of being laughed out of the ready room. That report, plus the radar track and the heat-camera footage, flows to AARO. There, analysts try to knock the case down. Was it a Chinese surveillance balloon? A hobbyist drone? A Starlink satellite train? A lens flare or a glitch in the targeting pod? A weather effect that bends radar into a fake blip? Most cases fall to one of these. What survives, AARO calls a residual — an unresolved case.\n\nTwo things about this machine matter more than any single sighting.\n\nFirst, the flood is growing on its own, for a boring reason. Cameras and sensors are everywhere now, and pilots finally feel safe reporting. So the number of reports keeps rising even if the number of real oddities in the sky stays flat. AARO takes in roughly five new cases for every one it closes. The backlog is the story.\n\nSecond — and this is the crux — a residual case is not evidence of anything exotic. It's an admission of ignorance. The skeptics' bet is that better cameras shrink the leftover pile toward zero. The advocates' bet is that it won't shrink, because some of it is real. Every serious argument in the field is a wager on which way that pile moves as the data gets better. Nobody yet knows, and saying so plainly is more honest than picking a side.\n\n## The fight at the center\n\nStrip away the noise and one question generates the heat: **is there a secret U.S. program holding recovered non-human craft?**\n\nTake the yes case at full strength. Grusch is a serving-era intelligence officer who testified under oath, put his career and freedom on the line, and filed a formal complaint that an inspector general judged \"credible and urgent.\" He says he interviewed some forty first-hand witnesses. His allies add a clever structural point: a program this sensitive would be a **Special Access Program** — a secrecy tier so tight that even normal congressional oversight can't see in. So the *absence* of a smoking gun proves nothing. If it existed, you wouldn't be able to find it. That is a genuinely hard argument to beat.\n\nNow the no case, also at full strength. AARO — the office built to investigate exactly this — interviewed many of the same people and found \"no empirical evidence.\" Its explanation is **circular reporting**: a claim that looks independently confirmed because many people repeat it, but which traces back to the same small group passing a story around, not to any object. AARO's first director notes the hard historical fact that America's most secret aircraft, like the F-117 stealth jet, stayed hidden for about a decade before the sheer effort of running them forced them into the light — never seventy-plus years across administrations of both parties. And after eighty years, every scrap of the recovery story is still testimony. Nobody has ever put a piece of the craft on a lab bench.\n\nNotice the trap the two sides are in. The advocates' theory predicts AARO will keep finding nothing (the program is hidden from AARO too). The skeptics' theory also predicts AARO will keep finding nothing (there's nothing there). Same result, opposite meaning. That is why years of official denials haven't ended the fight, and why it can't be settled from the outside. It ends only if someone gets access — or produces an actual piece of the thing.\n\n## Where this goes next\n\nDon't expect a clean reveal. The honest forecast is a set of directions, not a date.\n\nThe most likely path is grinding and partial. More files get unsealed, more hearings are held, AARO keeps closing ordinary cases, and the leftover pile neither vanishes nor delivers a bombshell. Disclosure that satisfies no one but slowly raises the floor of what the public knows. The underlying pressure only builds: sensors keep multiplying, younger voters keep believing, and pilots won't un-learn that they're allowed to report. That floor doesn't fall.\n\nA louder path is possible. A file dump or a new sensor case lands with something genuinely novel, the White House drives the pace instead of Congress, and independent scientists get to examine real material. Or the quiet path: a war or a crisis swallows all the attention, and UAP work quietly folds into the ordinary job of tracking drones over U.S. bases.\n\nWatch two signals, both things an ordinary reader can check. One: when the government unseals files, is there anything *new* in them, or just old rumors reprinted? Two: does one case ever arrive with clean, multi-instrument data that no ordinary explanation can fit — and can outsiders reproduce the finding? Until that second thing happens, the smart move is the patient one: the reports are real, most have dull answers, a stubborn few don't, and whether that stubborn few is ignorance or discovery is a question the sky has not yet answered."}, {"order": 1, "file": "01_Origins_And_Deep_History.md", "title": "Origins and Deep History: The U.S. UFO Phenomenon, 1947-1969", "summary": "", "body": "# Origins and Deep History: The U.S. UFO Phenomenon, 1947-1969\n\nThe modern UFO phenomenon began as a domestic American press event in late June 1947, when private pilot Kenneth Arnold's report of nine fast-moving objects near Mt. Rainier was rendered into the phrase \"flying saucers\" by wire-service reporters and within weeks generated hundreds of imitative sightings nationwide [1][2][3]. Across the next two decades the U.S. Air Force ran three sequential investigations — Project Sign (1948), Project Grudge (1949), and Project Blue Book (1952-1969) — and one classified CIA-convened scientific panel (Robertson, 1953) whose collective institutional posture moved from open-minded curiosity in 1948 to active public-debunking by the mid-1950s [4][5][6][7]. The period closed with a contracted university study, the 1968-69 Condon Report, that judged further scientific investigation of UFOs unjustified — even as roughly a third of the cases the committee examined remained unexplained — and the Air Force used the Condon conclusion to terminate Blue Book on December 17, 1969, with cumulative totals of 12,618 sightings investigated and 701 still classified \"unidentified\" [8][9][10]. The historical consensus among academic historians (Jacobs 1975; Eghigian 2024) is that this period produced a real and sustained \"phenomenon-of-reports\" — large numbers of credible witnesses describing things they could not explain — without producing defensible evidence of extraterrestrial origin; and that the U.S. government's institutional response was driven less by a coherent picture of what UFOs were than by Cold War anxieties about radar, panic, and propaganda [11][12].\n\nWhat follows traces that arc in order — the founding sighting and the press machinery that named it, the Roswell flap and its long dormancy, the three Air Force investigations and the CIA panel that reset their posture, the contactee and abduction cultures that grew alongside them, and finally the Condon study that closed the era without resolving its central question.\n\n## The Founding Event: Kenneth Arnold, June 24, 1947\n\nOn the afternoon of June 24, 1947, Kenneth Arnold — a fire-extinguisher salesman and experienced\nprivate pilot from Boise, Idaho — was flying a single-engine CallAir A-2 near Mt. Rainier in\nWashington State. He was looking for the wreckage of a downed C-46 Marine Corps transport, for\nwhich a $5,000 reward had been posted [1][3].\n\nAt approximately 3:00 p.m. Arnold saw what he later described as nine bright objects flying in\nechelon formation between Mt. Rainier and Mt. Adams. He calculated their speed by stopwatch and\nknown landmarks at over 1,200 miles per hour — far faster than any then-known aircraft. The\nsighting lasted between two and three minutes; Arnold's CallAir was at approximately 9,200 feet\n[1][3].\n\nArnold landed at Yakima, Washington, told the story to his friend Al Baxter, then continued to\nPendleton, Oregon, where he gave fuller interviews to the *East Oregonian*'s Bill Bequette and\nNolan Skiff [1][3]. The crucial linguistic moment came in those interviews. Arnold described\nthe objects' *motion* — \"they flew like a saucer would if you skipped it across the water\" —\nand separately described their *shape* variously as crescent, \"like a pie plate that was cut\nin half, with a sort of a convex triangle in the rear,\" and \"like the tail of a Chinese kite\"\n[1][2].\n\nBequette's June 25 Associated Press wire piece compressed Arnold's motion-simile into\n\"saucer-like objects.\" Within 24 hours every major U.S. newspaper carried the phrase. Within\ntwo weeks dozens — eventually hundreds — of similar reports came in from across the country,\nvirtually none of them describing the crescent shape Arnold had drawn but nearly all of them\ndescribing \"saucers\" [1][3].\n\nThis is the foundational moment of the U.S. UFO phenomenon as a press-cultural object: a\nmistranslation of a witness's motion-simile produced a noun, the noun produced a category,\nand the category produced a self-perpetuating reporting wave. Arnold himself spent the rest\nof his life trying to clarify what he had said and refusing to disown the phrase entirely. The\nSmithsonian's editorial framing — \"1947: Year of the Flying Saucer\" — captures the press\ndynamic: a half-month of wire-service amplification, mass imitation, and the Army Air Forces\n(newly redesignated the U.S. Air Force as of September 18, 1947) suddenly facing public\npressure to investigate something that had not previously been a recognized category [3].\n\nThe number of \"flying saucer\" reports in U.S. newspapers between June 24 and the end of July\n1947 has been estimated at over 850, distributed across 48 states. The wave dropped sharply in\nAugust. Almost all of the reports remain unattributed in surviving records — most were not\ninvestigated at the time, since no investigative apparatus yet existed [4][12].\n\n## The Roswell Press Flap and Its Long Latency\n\nTwo weeks after Arnold's sighting, on the evening of July 7, 1947, ranch foreman W.W. \"Mac\"\nBrazel brought in pieces of debris he had collected from a pasture on the Foster ranch about 75\nmiles northwest of Roswell, New Mexico [13]. The debris consisted primarily of foil, rubber-like\nmaterial, balsa-wood sticks, and parchment-like paper — material that Brazel said had been\nstrewn across approximately three quarters of a mile.\n\nRoswell Army Air Field — base of the 509th Bomb Group, then the only atomic-bomb-equipped unit\nin the world — sent intelligence officer Major Jesse Marcel to investigate, accompanied by\ncounter-intelligence officer Captain Sheridan Cavitt. On July 8, 1947, RAAF public information\nofficer Walter Haut issued a press release stating that the field had come into possession of a\n\"flying disc\" through cooperation with local ranchers and the sheriff [13]. The *Roswell Daily\nRecord*, an afternoon paper, ran the now-famous headline: \"RAAF Captures Flying Saucer on\nRanch in Roswell Region.\"\n\nWithin hours the Eighth Air Force in Fort Worth took control of the messaging. Brigadier General\nRoger Ramey held a press conference that same afternoon at Fort Worth Army Air Field, displayed\ndebris on the floor of his office (later identified by skeptics and Air Force investigators\nalike as a foil-and-balsa radar-target attached to a balloon train), and issued a corrected\nrelease: a weather balloon had been recovered, not a flying disc [13][14]. The Associated Press\nmoved the corrected story by July 9. National press picked up the retraction.\n\nThe story dropped from national press within 48 hours. Critically, it does not appear in the\nProject Sign records of 1948-49, in Project Grudge, or in early Project Blue Book as anything\nmore than a balloon misidentification [4][12][14]. Through the entire span of this period —\n1947 to 1969 — \"Roswell\" is not a category in the institutional UFO literature. It is\nnot raised at the Robertson Panel in 1953. It is not addressed in the Condon Report. It is not\npart of the discourse Hynek, Keyhoe, the Lorenzens, or McDonald operate within. There was, in\nthis period, no Roswell mythology to address.\n\nRoswell's transformation into the central mythic event of American ufology happened thirty-one\nyears later, between 1978 and 1980. Nuclear physicist and disclosure advocate Stanton Friedman\nlocated Jesse Marcel in Louisiana in February 1978; Friedman's interview produced Marcel's\nrevised testimony, which (now in retirement, having been reduced in rank, and in declining\nhealth) departed substantially from his 1947 contemporaneous report. Charles Berlitz and\nWilliam Moore's 1980 *The Roswell Incident* assembled the case. By the late 1980s the Roswell\nmythos included claims of recovered alien bodies, an alien autopsy, and a multi-decade\ngovernment cover-up — almost none of these claims correlated to contemporaneous 1947 evidence.\n\nThe 1994-95 USAF Roswell Reports — *The Roswell Report: Fact vs. Fiction in the New Mexico\nDesert* (1994) and *The Roswell Report: Case Closed* (1997) — were issued in response to a\n1993-94 Government Accountability Office investigation initiated by Congressman Steven Schiff\nof New Mexico. The reports identified the actual debris source as **Project Mogul Flight 4**,\na high-altitude constant-level balloon train launched from Alamogordo Army Air Field on June 4,\n1947, carrying acoustic sensors designed to detect distant Soviet nuclear tests [13][14].\n\nMogul was a then-classified Army Air Forces contract program (managed at New York University\nunder physicist Charles B. Moore) attempting to use long-distance acoustic propagation in the\nupper atmosphere as a means of detecting Soviet nuclear weapons tests. The Mogul balloon trains\nused neoprene weather balloons strung together with balsa-wood spreaders and aluminum-foil\nradar-target reflectors of a specific design — the same materials and configuration matching\nthe debris described and photographed at Fort Worth. The unusual \"hieroglyphic\" symbols Brazel\nlater remembered seeing on some debris were identified as flower-pattern tape used by the\nballoon manufacturer.\n\nThe Mogul explanation has been the documentary baseline since 1995. It remains contested in\nthe disclosure-advocacy literature [11][13]. The 2024 AARO Historical Record Report Volume 1,\nwhich independently reviewed the question, endorsed the Mogul finding.\n\nThe historiographical point matters: in the 1947-1969 period, \"Roswell\" is\nnot a major event. The institutional machinery the U.S. military built around UFOs — Sign,\nGrudge, Blue Book, Robertson, Condon — did not address Roswell because Roswell was, at the\ntime, a 24-hour press flap that had been resolved. The mythology came later, in the post-Blue\nBook era taken up in the chapter on the modern arc.\n\n## The Air Force's Three Investigations: Sign → Grudge → Blue Book\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 460\" role=\"img\" aria-label=\"A horizontal timeline of U.S. official posture toward unidentified aerial phenomena from 1947 to 2026, with a shaded posture band above the axis showing four phases. The band moves from curiosity at Project Sign in 1948, to active debunking after the 1953 Robertson Panel, to closure when Project Blue Book was terminated in 1969 having filed 701 of 12,618 cases as unidentified, through an underground stretch from 1969 to 2007, to re-opening after the December 2017 New York Times disclosure of AATIP, the UAP Task Force, AARO, the FY2026 NDAA, and the May 2026 PURSUE declassification of more than 160 files. Nodes mark Kenneth Arnold, Project Grudge, Project Blue Book, the Robertson Panel, the swamp-gas remark and Condon study, and the Condon Report. Posture, not evidence, drives the curve.\">\n<text x=\"350\" y=\"28\" text-anchor=\"middle\" font-size=\"14.5\" class=\"t-serif\" letter-spacing=\"2\">SIGN, GRUDGE, BLUE BOOK &#8212; AND AFTER<\/text>\n<text x=\"350\" y=\"46\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">78 years of U.S. official posture toward UAP<\/text>\n<text x=\"350\" y=\"78\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\" letter-spacing=\"2\">OFFICIAL POSTURE<\/text>\n<rect x=\"40\" y=\"90\" width=\"142\" height=\"38\" rx=\"2\" class=\"f-t1\" opacity=\".22\"/>\n<rect x=\"182\" y=\"90\" width=\"180\" height=\"38\" rx=\"2\" class=\"f-t2\" opacity=\".24\"/>\n<rect x=\"362\" y=\"90\" width=\"128\" height=\"38\" rx=\"2\" class=\"f-t3\" opacity=\".26\"/>\n<rect x=\"490\" y=\"90\" width=\"170\" height=\"38\" rx=\"2\" class=\"f-t4\" opacity=\".24\"/>\n<rect x=\"40\" y=\"90\" width=\"620\" height=\"38\" rx=\"2\" fill=\"none\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<line x1=\"182\" y1=\"90\" x2=\"182\" y2=\"128\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"362\" y1=\"90\" x2=\"362\" y2=\"128\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"490\" y1=\"90\" x2=\"490\" y2=\"128\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"111\" y=\"106\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-mono\" letter-spacing=\"1\">CURIOSITY<\/text>\n<text x=\"111\" y=\"119\" text-
