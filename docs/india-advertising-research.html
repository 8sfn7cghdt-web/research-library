lsen-for-cross-media-measurement-pilot-to-build-unified-audience-framework-90888.htm — Tier 5 (trade press). Accessed 2026-06-17. Contribution: pilot live as of Feb 2026, deduplication methodology, live-events focus, JioStar/Nielsen IPL <5% overlap.\n20. medianews4u, \"BARC pilots cross-media ratings framework with JioStar.\" https://www.medianews4u.com/barc-pilots-cross-media-ratings-framework-with-jiostar-signalling-shift-toward-unified-tv-digital-measurement/ — Tier 5 (trade press). Accessed 2026-06-17. Contribution: JioStar anchor, TV–digital unification shift.\n21. BestMediaInfo, \"BARC, Nielsen and TAM race to fix India's cross-media measurement gap.\" https://bestmediainfo.com/mediainfo/mediainfo-digital/barc-nielsen-and-tam-race-to-fix-indias-cross-media-measurement-gap-11203842 — Tier 5 (trade press). Accessed 2026-06-17. Contribution: three-body competition for cross-media currency.\n22. BestMediaInfo / DoubleVerify, \"India's CTV surge is unstoppable, but trust gaps worry advertisers\"; \"DV Global Insights 2025: Bot Fraud in CTV.\" https://bestmediainfo.com/mediainfo/mediainfo-digital/indias-ctv-surge-is-unstoppable-but-trust-gaps-worry-advertisers-10903261 ; https://doubleverify.com/blog/ctv/verify/dv-global-insights-2025-bot-fraud-in-ctv-the-hidden-drain-on-ad-budgets — Tier 5 (trade press + verification vendor, commercial interest noted). Accessed 2026-06-17. Contribution: ~110% YoY India CTV fraud-rate jump, 7–8% wasted spend, 10–30% open-auction ROI gap, MRC-accredited verification, SSAI opacity.\n23. Pixalate, \"Q3 2025 Global Invalid Traffic (IVT) & Ad Fraud Benchmarks\" (via Yahoo Finance / ExchangeWire). https://finance.yahoo.com/news/pixalate-releases-q3-2025-global-210600106.html — Tier 5 (verification vendor benchmark, commercial lean noted). Accessed 2026-06-17. Contribution: CTV IVT ~19%, web ~21%, mobile-app ~33%.\n24. LiveLaw / Pioneer Legal & Asia IP, on IT Rules 2021 OTT advisory and CCPA Guidelines 2022. https://www.livelaw.in/law-firms/law-firm-articles-/advertising-standards-council-of-india-cable-television-network-rules-central-consumer-protection-authority-consumer-protection-act-pioneer-legal-224285 — Tier 2/5 (legal analysis). Accessed 2026-06-17. Contribution: Feb 2025 MIB OTT advisory; CCPA Guidelines 2022 gazetted 9 June 2022.\n25. Hammurabi & Solomon / Bar & Bench, \"Surrogate advertising... self-regulatory nature of ASCI Code.\" https://www.barandbench.com/view-point/surrogate-advertising-intoxicating-products-self-regulatory-nature-asci-code-covert-advertising — Tier 2 (legal analysis). Accessed 2026-06-17. Contribution: ASCI statutory recognition via Rule 7(9) Cable TV Networks Rules 1994; CCPA Guidelines applicability.\n26. ASV Legal / MediaNama, on ASCI influencer enforcement and disclosure obligations. https://www.asvlawoffices.com/influencer-advertising-and-legal-compliance-in-india-obligations-under-asci-and-consumer-protection-law/ — Tier 2/5 (legal analysis). Accessed 2026-06-17. Contribution: 1,409 violations through Nov 2025 / 94% disclosure failures (single-source, flagged); CCPA fines up to ₹50 lakh, 3-year ban.\n27. ASCI, \"Guidelines for Influencer Advertising in Digital Media.\" https://www.ascionline.in/social/wp-content/uploads/2025/04/ASCI-Influencer-Guidelines.pdf — Tier 1 (primary guideline text). Accessed 2026-06-17. Contribution: material-connection disclosure, label list, video-duration disclosure rules.\n28. LexOrbis, \"ASCI Updates Influencer Guidelines for Health and Finance Sectors.\" https://www.lexorbis.com/asci-updates-influencer-guidelines-for-health-and-finance-sectors-strikes-balance-between-expertise-and-expression/ — Tier 2 (law firm). Accessed 2026-06-17. Contribution: April 2025 BFSI/health qualification-disclosure update.\n29. Campaign Asia, \"India's ad body changes influencer rules for health and finance sectors.\" https://www.campaignasia.com/article/indias-ad-body-changes-influencer-rules-for-health-and-finance-sectors/502211 — Tier 5 (trade press). Accessed 2026-06-17. Contribution: corroboration of 2025 health/finance update.\n30. Pitchonnet / TheMediaAnt, \"CTV advertising to reach critical mass in India in 2025\"; \"Smart TV Buyers in India.\" https://www.pitchonnet.com/pitch-feature/ctv-advertising-to-reach-critical-mass-in-india-in-2025-36578.html — Tier 5 (trade press / Pitch Madison-linked). Accessed 2026-06-17. Contribution: ₹2,300–2,500 crore CTV 2025, 50–60M CTV households.\n31. BestMediaInfo / IBEF (GroupM), \"Retail media and CTV to power India's Rs 2 lakh crore adex in 2026: WPP Media TYNY\"; \"Addressable TV advertising to reach US$1.2bn (Rs 9,872 crore) in 2026: GroupM.\" https://bestmediainfo.com/mediainfo/advertising/retail-media-and-ctv-to-power-indias-rs-2-lakh-crore-adex-in-2026-wpp-media-tyny-10890683 ; https://ibef.org/news/addressable-tv-advertising-to-reach-us-1-2-billion-rs-9-872-crore-in-2026-groupm — Tier 5/2 (agency forecast + govt-linked IBEF). Accessed 2026-06-17. Contribution: ~₹8,000 crore CTV by 2026; addressable-TV ~₹9,872 crore 2026.\n\n---"}, {"order": 6, "file": "06_Competitive_Dynamics.md", "title": "Competitive Dynamics & Future Structure — The Indian Advertising Market", "summary": "", "body": "# Competitive Dynamics & Future Structure\n\n## Bottom Line\n\nIndia's advertising market is worth roughly ₹1.55 lakh crore in 2025, with digital now the majority of spend. But its shape is being set less by organic growth than by **who controls the pipes between attention and money**. Five structural forces dominate the next-five-years picture.\n\nFirst, a **consolidation gravity well around Reliance/Jio**. The Reliance–Disney JV that formed JioStar (completed November 14, 2024; post-money valuation ₹70,352 crore / ~$8.5B) fused over 100 channels and the merged JioHotstar streaming service into a single entity — by some distance the largest *seller of premium video inventory* in the country. And it sits inside a group that also owns the largest telecom network (Jio, ~520M+ subscribers) and a commerce arm.\n\nSecond, a **global-platform duopoly**. Google and Meta together took ~64% of India's digital ad rupees in 2025, a dependence that hands two foreign firms enormous pricing and data leverage over a million-plus Indian advertisers.\n\nThird, **retail and commerce media** — the fastest-growing structural shift. E-commerce and retail-media ad revenue ran around ₹22,000 crore (≈23% of digital) in 2025, and quick-commerce ad budgets tripled off a small base: a third pole forming between the duopoly and the video sellers.\n\nFourth, **AI**, which cuts both ways. It is a tailwind (generative creative, automated targeting, where India leads global adoption) and a threat to the search-ad business model alike, via AI Overviews and zero-click answers.\n\nFifth, the **'Bharat' frontier** — regional-language, rural and sub-1M-town audiences, now >55% of CTV viewers. This is where the next 100M+ ad-addressable users live, and where measurement, monetization rates, and ROI claims are thinnest.\n\n**Be skeptical:** nearly every optimistic forecast in this space is published by a party that sells into it — agency holding companies, ad-tech vendors, the platforms themselves. The consensus \"₹2 lakh crore by 2026, retail-media-and-CTV-led\" story is real in direction, but its precision is manufactured. And the single most consequential structural fact is the one the industry's own boosters have the least incentive to dwell on: that one vertically integrated group may end up controlling content, distribution pipe, and a large slice of inventory all at once.\n\n---\n\n## 1. The Reliance/Jio Consolidation Gravity Well\n\n### 1.1 What JioStar is, and that it exists today\n\nThe defining structural event of the Indian media market this decade is the **JioStar** joint venture — the merger of Disney's Star India / Disney+ Hotstar assets with Reliance's Viacom18 / JioCinema assets into a single company. The transaction **completed on November 14, 2024**, after the National Company Law Tribunal (Mumbai), the Competition Commission of India, and other regulators cleared it [1][2].\n\nThe deal's terms, from Reliance and Disney's own completion announcement [1]:\n\n- **Post-money valuation:** ₹70,352 crore (~US$8.5 billion).\n- **Ownership:** Viacom18 holds 46.82%, Disney 36.84%, and Reliance Industries 16.34% directly — giving the Reliance side ~63.16% in aggregate (16.34% direct + 46.82% via Viacom18) and **control of the JV**. Disney holds the remaining 36.84% [1][2].\n- **Growth investment:** Reliance committed ₹11,500 crore (~$1.4 billion) into the JV for growth [1].\n- **Combined revenue:** ~₹26,000 crore (~$3.1B) pro forma for FY ended March 2024 [1].\n- **Assets:** over 100 TV channels and 30,000+ hours of annual TV entertainment content, plus the merged digital streaming service [1].\n- **Leadership (per the completion release):** Nita M. Ambani as Chairperson, Uday Shankar as Vice Chairperson, with Kevin Vaz (Entertainment), Kiran Mani (Digital), and Sanjog Gupta (Sports) as business-unit CEOs [1].\n\nThe CCI approved the transaction on **August 27, 2024, subject to voluntary modifications** — a conditional clearance, not an unconditional one. The conditions reflect the regulator's concern about the combined entity's market power in cricket-rights bundling and ad pricing [2][3]. The entity and its 100-plus channels are confirmed live as of the FY26 results published April 2026 (see 1.3). The specific voluntary modifications, and whether they are being enforced, remain only partly documented in the public record.\n\n### 1.2 Why \"one dominant video-inventory seller\" is the structural story\n\nBefore the merger, premium video ad inventory in India was split across two large camps: Disney/Star, with the legacy IPL TV rights and a deep entertainment catalogue, and Reliance/Viacom18, with the IPL *digital* rights it had won in 2022 and a fast-growing JioCinema. The merger ended that competition. The result is a single seller that controls:\n\n- the largest bouquet of entertainment and sports TV channels;\n- the merged JioHotstar streaming platform, which now carries both the digital and (post-rights-consolidation) effectively the full IPL and major ICC cricket;\n- and the cross-screen (TV + CTV + mobile) ad-sales motion across all of it.\n\nThis matters because **cricket is the single most valuable advertising vehicle in India**, and the JV now controls both the linear and digital sides of it. JioHotstar recorded **72.5 million peak concurrent viewers** during a global cricket final — a scale effectively un-buyable anywhere else [4][7]. An advertiser who wants live mass-reach premium video in India increasingly has *one* primary counterparty. That is the textbook setup for inventory-seller pricing power: the mirror image of the buy-side power Google and Meta hold (Section 2).\n\nHere is the critical, under-discussed asymmetry. The same group, Reliance, that controls this dominant *content/inventory* seller also controls the dominant *distribution pipe* (Jio telecom, ~520M+ subscribers as of early 2026 [8]) and a commerce arm (JioMart). No other media market of India's size has telecom, premium content, and a retail platform under one corporate roof at this scale. Whoever benefits from the \"India ad market is booming\" framing rarely names the second-order question: what does a structurally integrated gatekeeper do to ad rates, to rival publishers' carriage, and to the data moat over time? (That question is returned to in the Open Questions below.)\n\n### 1.3 JioStar is live and large as of FY26\n\nJioStar is not a paper entity; it is the dominant operating media company. Per FY26 results reported in late April 2026 [4][7]:\n\n- **JioStar FY26 gross revenue: ₹36,248 crore**; revenue from operations ~₹31,048 crore [4][7].\n- **JioHotstar averaged ~450M monthly active users in Q3 FY26** and **~500M MAUs in the March (Q4) quarter** [4][5][7]. The ~450M average MAU and 300,000+ hours figures are consistent with mid-FY26 reporting [5].\n- TV entertainment viewership share ~34.2%; digital watch-time up ~35% [4].\n- The company stated digital ad revenue rose on a wider client base and improved monetization, with record cricket-event monetization [4].\n\nSo the picture of a single dominant video-inventory seller with ~450M MAU and 300,000+ hours holds up against the most recent (FY26, April 2026) disclosures [1][4][5][7].\n\n---\n\n## 2. The Global-Platform Duopoly vs. Domestic Players\n\n### 2.1 Google and Meta own the demand side\n\nIf JioStar is the dominant *seller* of premium video, **Google and Meta are the dominant buyers' destination**. Per the FICCI-EY Media & Entertainment report (released March 24, 2026), search and social platforms led by Google and Meta **captured ~64% of India's ₹94,700 crore digital ad market in 2025** [6]. Digital advertising overall grew ~26% year-on-year [6].\n\nThe duopoly's grip is structurally deeper than the headline share because of *who* depends on it. Roughly **one million SME and long-tail advertisers** collectively spent ~₹36,000 crore on digital media in 2025, overwhelmingly through performance channels on Meta and Google [6][9]; reporting indicates ~92% of Meta's India advertiser base is SMEs [9]. These advertisers have no agency leverage, no direct deals, and no realistic alternative for performance reach — they are price-takers. That is the demand-side mirror of JioStar's supply-side power.\n\n### 2.2 Domestic challengers exist but are sub-scale\n\nDomestic platforms — ShareChat/Moj, Dailyhunt, InMobi, and the regional-OTT cluster — scale primarily through *regional-language* content, which is genuinely where audience growth is [10][11]. But on revenue they remain a fraction of the duopoly. The honest read: India has a vibrant domestic *content* layer and a thin domestic *ad-monetization* layer. The money still routes through foreign infrastructure (Google's ad stack, Meta's auction), and the one credible domestic counterweight on the *video* side is JioStar — which is less a \"domestic challenger to the duopoly\" than a *different* concentration of power on a different side of the market.\n\n**Who benefits from the \"domestic players are rising\" framing?** Domestic ad-tech firms raising capital, and policymakers who prefer a story of indigenous competition to one of foreign-platform dependence. The data supports rising *engagement* on domestic platforms more than rising *share of ad rupees*. Be skeptical of decks that conflate the two.\n\n### 2.3 Amazon and the third pole\n\nAmazon sits awkwardly across categories: a global platform (like Google/Meta) but monetizing through *retail* media rather than search/social. Amazon India's ad take (reported ~₹8,342 crore in a recent year [12]) and Flipkart's (~₹6,317 crore, +27% YoY [12]) make commerce media the genuine third pole — covered next.\n\n---\n\n## 3. Retail Media & Commerce Media — The Structural Shift\n\n### 3.1 The fastest-growing pole\n\nThe clearest *new* structural force is **retail and commerce media** — advertising sold by e-commerce and quick-commerce platforms against their first-party purchase data and at the point of sale. Per FICCI-EY, **e-commerce/point-of-sale advertising jumped ~50% to ~₹22,000 crore in 2025, ~23% of total digital ad revenue, up from ~20% in 2024** [6]. WPP Media's TYNY (Tier-5 agency forecast, note the holding-company lean) projects commerce-media revenue to ~$3.9 billion in 2026, +29%, with a further +21.7% in 2027 [13][14].\n\nThe two largest players are **Amazon and Walmart-owned Flipkart**; the most explosive growth is in **quick commerce** — Blinkit, Zepto, Swiggy Instamart — where ad revenue is compounding at 100%+ off small bases [12][13]. Pitch Madison reported quick-commerce AdEx scaling from ~₹1,325 crore to ~₹4,000 crore (a ~202% jump) and projects ~₹6,000 crore in 2026 [15].\n\n### 3.2 Why this is structural, not cyclical\n\nRetail media re-routes ad budgets toward the *closest-to-conversion* surface, with first-party, login-bound data that is largely immune to the cookie/identity disruption hammering the open web (covered in the chapter on regulation, measurement, and trust). In a privacy-constrained, post-cookie environment, the platform that owns the purchase event owns the most durable targeting signal. That makes retail media a *defensible* share gain, not a fad — which is why it appears in every credible 2026 forecast as a lead growth driver.\n\n**The critical caveat:** retail media's measurement is largely *self-reported by the seller of the inventory* (a classic marking-your-own-homework problem), and the \"incrementality\" of much retail-media spend — whether it drives new sales or merely harvests purchases that would have happened anyway — is contested and under-audited. The optimism here is real but the independent verification is thin.\n\n### 3.3 Reliance's commerce angle closes the loop\n\nJioMart plus JioStar plus Jio telecom gives Reliance a *potential* retail-media network fed by telecom, content-consumption, and purchase data simultaneously — a combination no rival can replicate. Whether Reliance executes a commerce-media network at Amazon/Flipkart scale is unproven as of mid-2026, but the structural option is there, and it is the cleanest illustration of why the consolidation gravity well (Section 1) matters for the *whole* market, not just video.\n\n---\n\n## 4. AI in Advertising — Tailwind and Threat\n\n### 4.1 Generative creative and AI targeting (the tailwind)\n\nIndia is, by survey measures, a **global leader in generative-AI adoption** — one widely cited figure puts India at ~73% adoption vs. ~45% US / ~29% UK (Tier-5 vendor/survey data; treat as directional, not precise) [16]. In advertising specifically, generative AI is being used for (a) **creative production at scale** — variant generation, localization into dozens of languages, synthetic video; reporting cites ~86% of media buyers using or planning to use GenAI for video creative [16] — and (b) **targeting/optimization**, where the platform auctions (Google's PMax, Meta's Advantage+) increasingly hide the levers behind AI black boxes. WPP Media's TYNY tags an India \"intelligence\"/AI-enabled advertising category expected to exceed **$2.5 billion in 2026** [13][14].\n\nThe honest read on the tailwind: GenAI **lowers the cost of creative**, which is good for the million-SME long tail (cheaper to produce ads) and good for the platforms (more advertisers, more auction density). It does *not* obviously increase total ad *demand* — it increases ad *volume and efficiency*. The \"$X billion AI advertising market\" figures conflate AI-touched spend with AI-caused incremental spend; be skeptical.\n\n### 4.2 AI Overviews and the threat to search-ad real estate\n\nThe clearest *threat* vector is **Google's own AI Overviews / generative search**, which answer queries on the results page and suppress clicks to the links beneath. The disconfirming-the-optimists evidence is strong and from credible sources:\n\n- A **Pew Research Center** study found users clicked a result ~8% of the time when an AI summary appeared vs. ~15% without — roughly a **47% relative reduction** [17].\n- A peer-reviewed/field-experiment line of work (Agarwal & Sen, SSRN) and **eMarketer** estimate AI Overviews cut referral/organic clicks materially — eMarketer cites referral-traffic declines of up to ~25% [17][18].\n- Industry tallies cite zero-click searches at a large and rising majority of queries [17][18].\n\nFor *advertising*, this cuts two ways. It threatens **publishers** (less referral traffic → less inventory and revenue on the open web → ~$2B in sector ad-revenue loss estimated by some analyses [17]) and it pressures the **search-ad CTR/CPC model** itself, since the click is the unit being sold. But it may *benefit Google's own monetization* if Google inserts ads into AI answers — moving value from the open web *into* the walled platform. The net effect on India specifically is not yet quantified in the sources here; the mechanism (zero-click erosion of the link economy) is well evidenced globally and there is no reason India is exempt.\n\n**Who benefits from each AI framing?** Ad-tech vendors and agencies benefit from \"AI is a massive new advertising category.\" Publishers benefit from \"AI Overviews are killing the open web.\" Google benefits from neither framing being examined too closely, since it is simultaneously the largest beneficiary of AI-creative auction density *and* the proximate cause of the zero-click threat.\n\n---\n\n## 5. The Regional-Language & Rural 'Bharat' Frontier\n\n### 5.1 The demographic facts\n\nThe next leg of ad-addressable growth is not metro English-speaking India; it is **regional-language, rural, and small-town India**. The evidence:\n\n- India's CTV user base grew ~85% YoY to ~129.2 million active users across ~55–60 million households in 2025, with **>55% of those viewers from villages and towns under one million population** [10][19].\n- ~35 million new CTV viewers were added in Q1 2025; streaming grew ~53% in tier-2 and ~78% in tier-3 cities, and a Kantar reading found CTV reach approaching urban-rural parity [10][19].\n- ~50% of OTT consumption is now in non-Hindi regional languages; ~57% of users prefer vernacular content; a regional-OTT cluster (Aha, Chaupal, Hoichoi, Sun NXT, Shemaroo, Dangal Play, etc.) leads this layer [10][11].\n\n### 5.2 Why this is the frontier — and where the optimism is thin\n\nThe \"Bharat\" story is structurally sound: cheap data (a Jio legacy), affordable smart TVs, and FAST (free ad-supported streaming TV) channels are converging to put premium-feeling, ad-supported video in front of an audience that linear TV under-served. CTV ad spend is projected at ~₹2,000 crore by end-2025, rising to ~₹3,500 crore by 2027 [10]. For advertisers, this is the only place to add *net-new reach* at scale.\n\n**But the skeptic's notes are essential:**\n\n1. **Monetization lags reach badly.** >55% of viewers in sub-1M towns is a *reach* statistic; the ad *rates* in those markets are a fraction of metro rates, and CTV AdEx (~₹2,000 crore) is still tiny against the ~₹94,700 crore digital total [6][10]. The reach-to-revenue gap is the whole risk.\n2. **Measurement is weakest exactly where growth is fastest.** Rural/regional CTV is the least-measured surface in Indian advertising (no robust independent panel parity with metro), which makes ROI claims hard to verify and easy to inflate. The parties asserting Bharat's value — CTV ad-tech vendors, FAST operators, agencies pitching \"the next 100M\" — are the ones selling into it.\n3. **The same consolidation gravity applies.** JioStar (with the deepest regional-channel bouquet) and the regional-OTT cluster are the inventory; whoever aggregates and prices Bharat CTV inventory inherits the seller-power dynamic of Section 1, now in the highest-growth segment.\n\n### 5.3 The seeds for the forecast\n\nNet it out: the *audience* migration to regional/rural CTV is established and fast; the *money* migration is real but lags, dependent on (a) measurement maturing, (b) CPMs in non-metro markets rising toward metro, and (c) who controls inventory aggregation. The bull case prices in fast convergence; the bear case is a durable reach-without-revenue gap. The truth is probably a slow grind upward — the audience is already there, the rupees follow with a lag and a discount.\n\n---\n\n## 6. Synthesis: Three Concentrations and One Question\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 360\" role=\"img\" aria-label=\"Three concentrations of power in Indian advertising — JioStar on the premium-video sell side, Google and Meta on the performance demand side, and Amazon, Flipkart and quick-commerce in commerce media — with Reliance/Jio as a single integrator arcing across all three via telecom, content and commerce.\">\n<text x=\"350\" y=\"28\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THREE CONCENTRATIONS, ONE INTEGRATOR<\/text>\n<text x=\"350\" y=\"46\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">where control of inventory, data and distribution is pooling<\/text>\n<path d=\"M70,86 C 70,70 630,70 630,86\" fill=\"none\" class=\"s-t4\" stroke-width=\"2.5\"/>\n<rect x=\"250\" y=\"64\" width=\"200\" height=\"26\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"350\" y=\"82\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">RELIANCE / JIO — the integrator<\/text>\n<text x=\"350\" y=\"104\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">telecom pipe (~520M subs) + JioStar content + JioMart commerce, under one roof<\/text>\n<rect x=\"50\" y=\"130\" width=\"190\" height=\"150\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"50\" y=\"130\" width=\"190\" height=\"26\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"145\" y=\"148\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">SELL-SIDE: premium video<\/text>\n<text x=\"145\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\">JioStar / JioHotstar<\/text>\n<text x=\"145\" y=\"200\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">FY26 gross ₹36,248 cr<\/text>\n<text x=\"145\" y=\"216\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">~450–500M MAU · cricket<\/text>\n<text x=\"145\" y=\"240\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">~one counterparty for<\/text>\n<text x=\"145\" y=\"254\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">mass-reach video<\/text>\n<rect x=\"255\" y=\"130\" width=\"190\" height=\"150\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"255\" y=\"130\" width=\"190\" height=\"26\" rx=\"2\" class=\"f-t2\"/>\n<text x=\"350\" y=\"148\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">DEMAND-SIDE: performance<\/text>\n<text x=\"350\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\">Google + Meta<\/text>\n<text x=\"350\" y=\"200\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">~64% of digital ad rupees<\/text>\n<text x=\"350\" y=\"216\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">~1M dependent SMEs<\/text>\n<text x=\"350\" y=\"240\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">auction + identity power;<\/text>\n<text x=\"350\" y=\"254\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">favoured by privacy rules<\/text>\n<rect x=\"460\" y=\"130\" width=\"190\" height=\"150\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"460\" y=\"130\" width=\"190\" height=\"26\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"555\" y=\"148\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">COMMERCE MEDIA: the 3rd pole<\/text>\n<text x=\"555\" y=\"178\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\">Amazon · Flipkart · q-comm<\/text>\n<text x=\"555\" y=\"200\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">~₹22,000 cr · ~23% of digital<\/text>\n<text x=\"555\" y=\"216\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">growing ~2× the market<\/text>\n<text x=\"555\" y=\"240\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">first-party purchase data,<\/text>\n<text x=\"555\" y=\"254\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">durable post-cookie<\/text>\n<line x1=\"240\" y1=\"205\" x2=\"255\" y2=\"205\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n<line x1=\"445\" y1=\"205\" x2=\"460\" y2=\"205\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n<text x=\"350\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">The 2030 question is not how big the market gets — it is how concentrated this control becomes, and whether regulators constrain it.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> Indian advertising is consolidating into three power blocks — a premium-video seller (JioStar), a performance-demand duopoly (Google, Meta), and a fast-rising commerce-media tier (Amazon, Flipkart, quick commerce) — with one actor, Reliance/Jio, uniquely arcing across all three through telecom, content and commerce. No other media market of India's size has those three layers under a single corporate roof. (JioStar FY26 results; FICCI-EY M&amp;E 2026; TRAI-derived subscriber data.)<\/figcaption>\n<\/figure>\n\n\nThe competitive structure heading into 2030 is best read as **three concentrations of power, plus one integrating actor that touches all three**:\n\n| Pole | Power type | Key actors | Structural leverage |\n|---|---|---|---|\n| Premium video inventory (sell-side) | Seller pricing power | **JioStar/JioHotstar** | Cricket + 100+ channels + 450–500M MAU; ~one counterparty for mass-reach video [1][4] |\n| Performance/demand (buy-side) | Buyer/auction power, data | **Google, Meta** | ~64% of digital ad rupees; ~1M dependent SMEs [6][9] |\n| Commerce/retail media | Closest-to-conversion data | **Amazon, Flipkart, quick-commerce** | First-party purchase data, post-cookie durable; fastest growth [6][12][13] |\n| The integrator | Cross-layer gravity | **Reliance/Jio** | Telecom pipe (~520M subs) + JioStar content + JioMart commerce under one roof [1][8] |\n\nThe single most important *structural* question for 2030 is not \"how big does the market get\" (every forecaster agrees: ~₹2 lakh crore in 2026, growing high-single to low-double digits [13][15]) — it is **how concentrated the *control* of inventory, data, and distribution becomes, and whether regulators (CCI, the DPDP regime) constrain it.** That is the question the industry's own optimism systematically under-weights, because the parties producing the forecasts mostly profit from the concentration.\n\n---\n\n## Open Questions\n\n1. **What exactly are the CCI's \"voluntary modifications\" on the JioStar approval, and are they being enforced?** The Aug 27, 2024 clearance was conditional [2][3], but the specific behavioral/structural remedies (especially on cricket-rights bundling and ad-pricing) are not documented in the sources consulted. This is load-bearing for any \"JioStar pricing power\" claim, and resolving it would require the text of the CCI order itself.\n2. **Does Reliance build a retail-media network at Amazon/Flipkart scale, and on what data?** The structural option (telecom + content + commerce data) is unique to Reliance; whether it is executed by 2030 is the swing factor for whether the \"third pole\" stays Amazon/Flipkart-led or becomes a four-way fight.\n3. **What is the India-specific magnitude of AI-Overview click erosion on Indian publishers and Indian search-ad CPCs?** The mechanism is well evidenced globally [17][18]; the India numbers are not separately quantified here.\n4. **How fast do non-metro CTV CPMs converge toward metro rates?** This is the entire bull/bear hinge on the Bharat frontier and depends heavily on measurement maturing.\n5. **Is the GenAI \"advertising category\" (WPP's ~$2.5B \"intelligence\") incremental demand or re-labeled existing spend?** The forecasts conflate AI-touched with AI-caused; the distinction matters for sizing.\n6. **Does Disney exercise any put/exit option on its 36.84% over the horizon, and what happens to the JV's competitive posture if it does?** Not addressed in sources consulted.\n\n---\n\n## Sources\n\n1. **Reliance & Disney completion announcement (primary, Tier 1):** \"Reliance and Disney Announce Completion of Transaction to Form Joint Venture…,\" JioStar, Nov 14, 2024. https://www.jiostar.com/news/reliance-and-disney-announce-completion-of-transaction… — Deal terms: ₹70,352 cr post-money valuation, ownership splits (Viacom18 46.82% / Disney 36.84% / Reliance 16.34%, Reliance controlling), ₹11,500 cr growth investment, ~₹26,000 cr combined revenue, 100+ channels, 30,000+ hours, named leadership. Accessed 2026-06-17. *(Tier 1 corporate disclosure — proof of what the parties claim/announced, which here is the deal structure itself.)*\n2. **Disney Star / JV completion (Tier 4 secondary corroboration):** Sportcal, \"Disney Star-Reliance Industries media assets merger completed,\" Nov 2024; Business Standard, \"Reliance-Disney JV deal gets European Commission approval,\" Nov 1, 2024. https://www.business-standard.com/companies/news/reliance-disney-joint-venture-deal-gets-european-commission-approval-124110100301_1.html — Confirms NCLT/CCI/EC clearances and completion. Accessed 2026-06-17.\n3. **CCI conditional approval analysis (Tier 5, legal-analysis lean):** Mondaq, \"Decoding CCI Approval Of The Reliance Disney Handshake.\" https://www.mondaq.com/india/antitrust-eu-competition/1552868/ — CCI approved Aug 27, 2024 subject to voluntary modifications. Accessed 2026-06-17. *(Analytical/legal-commentary tier; the Aug 27 date and conditional nature corroborated; specific remedies not fully extracted.)*\n4. **JioStar FY26 results reporting (Tier 4-5 trade press):** Social Samosa, \"JioStar reports Rs 36,248 cr FY26 revenue…,\" Apr 27, 2026. https://www.socialsamosa.com/industry-updates/jiostar-revenue-digital-advertising-subscription-growth-11770234 — FY26 gross revenue ₹36,248 cr, ~500M MAU avg, 72.5M peak concurrency, 34.2% TV share, +35% digital watch time. Accessed 2026-06-17. *(Going-concern confirmation that JioStar is live and large.)*\n5. **JioHotstar Q3 FY26 MAU (Tier 4-5 trade press):** BestMediaInfo, \"JioStar posts Rs 8,010 crore gross revenue in Q3 FY26; JioHotstar averages 450 million MAUs.\" https://bestmediainfo.com/mediainfo/television/jiostar-posts-rs-8010-crore-gross-revenue-in-q3-fy26-jiohotstar-averages-450-million-maus-11006857 — ~450M average MAU figure. Accessed 2026-06-17.\n6. **FICCI-EY M&E report figures (Tier 5 industry report via Tier 4-5 trade press):** Storyboard18, \"Google and Meta hold two-thirds of India's digital ad market,\" reporting FICCI-EY (released Mar 24, 2026). https://www.storyboard18.com/advertising/google-meta-claim-64-of-india-digital-ads-as-e-commerce-surges-93065.htm — Digital ad market ₹94,700 cr 2025 (+26%); Google+Meta ~64%; e-commerce ads ₹22,000 cr / 23%; programmatic 42%; CTV ad revenue ₹9,900 cr (+42%). Accessed 2026-06-17. *(FICCI-EY is an industry-body/consultancy report — directional authority, note it is produced for the M&E industry.)*\n7. **JioStar/JioHotstar FY26 detail (Tier 4-5 trade press):** Storyboard18, \"JioHotstar hits 500 million MAUs, 72.5 million concurrency; drives ₹36,248 crore FY26 gross revenue.\" https://www.storyboard18.com/brand-marketing/jiohotstar-hits-500-million-maus-72-5-million-concurrency-drives-%E2%82%B936248-crore-fy26-gross-revenue-96368.htm — Corroborates [4]. Accessed 2026-06-17.\n8. **Reliance Jio subscriber base (Tier 4-5, TRAI-derived):** Statista / Open Magazine, \"Reliance Jio Tops India Telecom Growth…,\" reporting ~519.64M (Feb 2026) / ~523.44M (Mar 2026) subscribers. https://openthemagazine.com/india/reliance-jio-leads-as-india-adds-millions-of-new-telecom-users-in-march-2026 — Underlying data is TRAI; cited here via secondary. Accessed 2026-06-17. *(Single secondary source for the exact figure; the underlying TRAI data is authoritative but cited here via that secondary.)*\n9. **SME advertiser dependence (Tier 5 via FICCI-EY reporting):** Storyboard18 [6] and related, ~1M SME/long-tail advertisers spending ~₹36,000 cr; ~92% of Meta India advertisers are SMEs. Accessed 2026-06-17. *(The 92% Meta-SME figure is single-sourced in reporting and should be treated as directional.)*\n10. **CTV regional/rural frontier (Tier 4-5 trade press):** afaqs, \"Tier 2 and 3 cities: The new epicentre of India's CTV-led brand growth\"; Storyboard18, \"How CTV emerged as a leader in 2025…\"; adtechtoday. https://www.afaqs.com/news/guest-article/tier-2-and-3-cities-the-new-epicentre-of-indias-ctv-led-brand-growth-10605283 — CTV +85% YoY to ~129.2M users; >55% from sub-1M towns; tier-2 +53%, tier-3 +78%; CTV AdEx ~₹2,000 cr 2025 → ~₹3,500 cr 2027. Accessed 2026-06-17. *(Trade press, some guest-authored — note vendor lean; cross-sourced where possible.)*\n11. **Regional-language consumption (Tier 5 trade press):** Marketing Mind / Exchange4media on ZEE5 and regional OTT. https://marketingmind.in/40-zee5-viewership-comes-from-tier-2-3-markets/ — ~50% non-Hindi OTT consumption; ~57% prefer vernacular; regional-OTT cluster named. Accessed 2026-06-17.\n12. **Retail-media player revenues (Tier 4-5 trade/financial press):** Exchange4media / reporting on Flipkart ₹6,317 cr ad income (+27%), Amazon India ₹8,342 cr, Myntra ₹914 cr; quick-commerce 100%+ growth. https://www.exchange4media.com/digital-news/is-fast-delivery-the-real-winner-in-indias-retail-media-ad-spend-race-149598.html — Accessed 2026-06-17. *(Company-period figures via secondary reporting rather than the underlying filings.)*\n13. **WPP Media TYNY India 2026 (Tier 5 agency forecast — holding-company lean):** WPP Media, \"WPP Media Releases TYNY India Forecast…,\" and trade coverage (mediabrief, adgully). https://www.wppmedia.com/news/wpp-media-india-tyny-report — India ad market ~$22.5B / ~₹2 lakh cr 2026 (+8.8–9.7% across cuts); commerce media ~$3.9B (+29%); social/digital ~$8.3B (+13.2%); \"intelligence\"/AI ~$2.5B. Accessed 2026-06-17. *(Agency forecast — WPP sells into this market; treat as directional, note the conflict of interest.)*\n14. **WPP TYNY corroboration (Tier 4-5 trade press):** Social Samosa, \"India's ad revenue to grow 8.8% to $22.5 Bn…\"; Campaign India, \"2026 is looking bright for commerce media: WPP Media.\" https://www.socialsamosa.com/report/india-ad-revenue-grow-economic-pressures-wpp-media-12043543 — Accessed 2026-06-17.\n15. **Pitch Madison Advertising Report 2026 (Tier 5 industry report via trade press):** Social Samosa / Pitchonnet on PMAR 2026. https://www.socialsamosa.com/report/digital-sixty-percent-indias-ad-market-pitch-madison-advertising-report-11125052 — 2025 AdEx ₹1,55,105 cr (digital ₹93,156 cr / 60%, +22%; traditional ₹61,949 cr / 40%, −1%); 2026 projection ₹1,74,605 cr; MSME digital ₹35,814 cr; q-comm ₹1,325→₹4,000 cr (+202%), ~₹6,000 cr projected 2026. Accessed 2026-06-17. *(PMAR is the agency-co-produced standard reference; widely cited but produced by interested parties.)*\n16. **GenAI adoption in Indian advertising (Tier 5-6 survey/vendor data):** MMA India \"State of AI in Marketing\"; Exchange4media \"e4m Report Card 2025: AI in Indian marketing\"; ASCI ADNext report. https://www.exchange4media.com/digital-news/e4m-report-card-2025-ai-in-indian-marketing-and-what-actually-mattered-150501.html — ~73% India adoption (survey); ~86% media buyers using/planning GenAI video creative; ~42% in experimentation phase. Accessed 2026-06-17. *(Survey/vendor data — directional only; adoption-rate surveys are notoriously methodology-dependent.)*\n17. **AI Overviews click erosion (Tier 2-4):** Pew Research Center study (users click ~8% with AI summary vs ~15% without); Digital Content Next; Search Engine Journal. https://digitalcontentnext.org/blog/2025/08/14/facts-googles-push-to-ai-hurts-publisher-traffic/ — ~47% relative CTR reduction; publisher traffic −10% to −60%; ~$2B sector ad-revenue loss estimate. Accessed 2026-06-17. *(Pew is Tier 2-quality; the $2B figure is an estimate from analysis, treat as such.)*\n18. **AI Overviews / referral traffic (Tier 2-5):** eMarketer, \"Google AI Overviews decrease referral traffic as much as 25%\"; Agarwal & Sen, \"Google AI Overviews and Publisher Traffic: Evidence from a Field Experiment,\" SSRN. https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6513059 — Field-experiment evidence of click decline; eMarketer ~25% referral decline. Accessed 2026-06-17. *(SSRN working paper — Tier 2 with preprint caveat.)*\n19. **Kantar CTV report (Tier 4):** Business Standard, \"Connected TV adds 35 million viewers, equal urban-rural presence,\" Jun 17, 2025. https://www.business-standard.com/companies/news/connected-tv-adds-35-million-viewers-equal-urban-rural-presence-125061700947_1.html — 35M viewers added Q1; urban-rural parity. *(Figures cross-corroborated via [10].)* Accessed 2026-06-17."}, {"order": 7, "file": "Future_Trajectory.md", "title": "Future Trajectory — The Indian Advertising Market through 2030", "summary": "", "body": "# Future Trajectory — The Indian Advertising Market through 2030\n\n> **Bottom line.** The size question is nearly settled and nearly boring: every forecaster sees India's ad market near ₹2 lakh crore in 2026 and digital past 70% of spend by 2027, with India entering the top five global digital ad markets. The *open* question is structural — how concentrated the control of inventory, data, and distribution becomes, and whether the trust infrastructure (a cross-platform measurement currency, accredited fraud verification, workable consent plumbing) matures fast enough to keep open programmatic CTV a real growth frontier rather than a channel that quietly cedes its budgets to walled gardens. We hold four scenarios. The most likely (≈55%) is a **steady digital-led grind** in which retail media and CTV lead, DPDP compliance lands in 2027 with manageable friction, and Reliance's integrated gravity tightens without triggering hard intervention. The upside (≈20%) is the **Bharat unlock**, where regional/rural reach converts to revenue faster than expected. The downside (≈15%) is a **trust-and-concentration drag**. And a ≈10% tail holds genuine structural shocks — a forced JioStar remedy, a hard data-localization notification, a TikTok return, or AI search breaking the search-ad model.\n\n---\n\n## What is essentially locked in\n\nA handful of trends are robust enough across independent forecasters that the scenarios differ on their *pace and distribution*, not their *direction*:\n\n- **Digital keeps taking share.** dentsu projects digital to 70% of AdEx by 2027; Madison's expanded series has it at ~64% in 2026; WPP's broadest cut already reads 68% in 2026. The crossover past linear TV happened in 2025; it does not reverse.\n- **Linear TV declines slowly, not catastrophically.** TV ad spend fell ~5% in 2025, and dentsu's medium path takes TV from a 21% share toward 15% by 2027 — erosion, not collapse, with the combined \"large screen\" (linear + CTV) roughly flat as CTV doubles.\n- **Retail and commerce media is the lead growth engine.** ~₹22,000 crore in 2025 (~23% of digital), growing at roughly twice the market, structurally defensible because it owns the purchase event in a post-cookie world.\n- **CTV compounds at ~20%+ a year** off a contested base, toward 90 million+ households by 2028 on the broad count.\n- **The market roughly doubles by decade's end.** From a ~₹1.55 lakh crore (expanded) 2025 base, low-double-digit compounding points toward a market well north of ₹2.5 lakh crore by 2030 — and India crossing into the top tier of global digital ad markets. *(This 2030 endpoint is an inference extrapolated from 2026–27 sourced forecasts, not itself a sourced figure; treat as directional.)*\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">India ad market — sourced points (2024–27) and base-case extrapolation (2028–30)<\/div><div class=\"viz-legend\"><span><i style=\"background:var(--t1)\"><\/i>Total AdEx (₹ &#x27;000 cr, expanded)<\/span><span><i style=\"background:var(--t2)\"><\/i>Digital share (%)<\/span><\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"286.0\" x2=\"682\" y2=\"286.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"290.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"218.0\" x2=\"682\" y2=\"218.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"222.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">75<\/text><line x1=\"60\" y1=\"150.0\" x2=\"682\" y2=\"150.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"154.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">150<\/text><line x1=\"60\" y1=\"82.0\" x2=\"682\" y2=\"82.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"86.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">225<\/text><line x1=\"60\" y1=\"14.0\" x2=\"682\" y2=\"14.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"18.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">300<\/text><text x=\"60.0\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2024<\/text><text x=\"163.7\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2025<\/text><text x=\"267.3\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2026<\/text><text x=\"371.0\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2027<\/text><text x=\"474.7\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2028<\/text><text x=\"578.3\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2029<\/text><text x=\"682.0\" y=\"312\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2030<\/text><polyline points=\"60.0,160.9 163.7,145.5 267.3,127.3 371.0,109.2 474.7,89.3 578.3,67.5 682.0,43.0\" fill=\"none\" pathLength=\"1\" class=\"s-t1 cv-draw\" style=\"--d:0.00s\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"60.0\" cy=\"160.9\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.50s\"/><circle cx=\"163.7\" cy=\"145.5\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.52s\"/><circle cx=\"267.3\" cy=\"127.3\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.54s\"/><circle cx=\"371.0\" cy=\"109.2\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.56s\"/><circle cx=\"474.7\" cy=\"89.3\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.58s\"/><circle cx=\"578.3\" cy=\"67.5\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.60s\"/><circle cx=\"682.0\" cy=\"43.0\" r=\"3\" class=\"f-t1 cv-fade\" style=\"--d:0.62s\"/><polyline points=\"60.0,236.1 163.7,231.6 267.3,228.0 371.0,222.5 474.7,219.8 578.3,218.0 682.0,216.2\" fill=\"none\" pathLength=\"1\" class=\"s-t2 cv-draw\" style=\"--d:0.18s\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"60.0\" cy=\"236.1\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.68s\"/><circle cx=\"163.7\" cy=\"231.6\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.70s\"/><circle cx=\"267.3\" cy=\"228.0\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.72s\"/><circle cx=\"371.0\" cy=\"222.5\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.74s\"/><circle cx=\"474.7\" cy=\"219.8\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.76s\"/><circle cx=\"578.3\" cy=\"218.0\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.78s\"/><circle cx=\"682.0\" cy=\"216.2\" r=\"3\" class=\"f-t2 cv-fade\" style=\"--d:0.80s\"/><\/svg><figcaption>Solid years are sourced (Madison expanded; 2028–30 are base-case inference at ~11% CAGR, not sourced figures). Digital share path from dentsu/Madison. <span class=\"credit\">Source: Pitch Madison 2026 (2024–26); dentsu-e4m 2026 (2027 share); 2028–30 = base-case inference.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## The drivers that decide which scenario wins\n\nThe forecast is non-arbitrary because it traces to forces already visible in the market's history and present state. Five dominate.\n\nThe **Reliance/Jio consolidation gravity well** is the deepest. The JioStar joint venture (completed 14 November 2024, ₹70,352 crore post-money, Reliance controlling ~63%) created the country's dominant seller of premium video — and it sits inside a group that also owns the dominant telecom pipe (~520 million subscribers) and a commerce arm. No other media market of India's size has telecom, premium content, and retail under one roof at this scale. This force pushes toward seller-side pricing power, a unique cross-data moat, and the structural option of a Reliance commerce-media network that no rival can replicate. Its counter-force is the regulator: the CCI cleared the JV *conditionally*, and the DPDP regime constrains how even an integrated group may use data.\n\nThe **Google–Meta demand-side duopoly** (~64% of digital) pushes the opposite direction — buyer and auction power over a million price-taking SMEs — and is reinforced, not threatened, by privacy regulation that rewards logged-in first-party scale. Its counter-force is the **commerce-media third pole** (Amazon, Flipkart, quick commerce), the one genuinely new concentration, defensible because it owns conversion data. **AI** cuts both ways: a tailwind that lowers creative cost and thickens auctions (India leads global GenAI-in-advertising adoption), and a threat via AI Overviews and zero-click search that erodes the very click the search-ad model sells — a mechanism well-evidenced globally (Pew: ~47% relative CTR reduction when an AI summary appears) whose India magnitude is not yet quantified. And the **\"Bharat\" frontier** — regional-language, rural, sub-million-town audiences now >55% of CTV viewers — is where net-new reach lives, but where monetization lags reach badly and measurement is thinnest.\n\nCutting across all five is the **trust-infrastructure variable**: whether a cross-platform currency (BARC–Nielsen), accredited verification (the ~7–8% CTV waste problem), and workable DPDP consent plumbing mature on schedule. This is the single most important swing factor, because it determines whether the open programmatic ecosystem captures CTV's growth or hands it to closed gardens by default.\n\n---\n\n## The scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios for the Indian ad market through 2030 (probability)<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Steady digital-led grind (…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"420.7\" y=\"8\" width=\"58.9\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"487.6\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">48–60%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">The Bharat unlock (upside)<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"258.6\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"315.8\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">15–25%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Trust-and-concentration dr…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"234.1\" y=\"80\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"281.4\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">10–18%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Structural shock (tail)<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"219.4\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"256.8\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">7–13%<\/text><\/svg><figcaption>Probabilities are a calibrated estimate, not a sourced figure; they sum to ~100% across the four mutually exclusive scenarios. <span class=\"credit\">Source: Synthesis, 2026-06-17.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario 1 — Steady digital-led grind (base case, ≈55%)\n\nThe consensus extended without heroics. The market reaches ~₹2 lakh crore in 2026 and grinds upward at low-double digits toward ~₹2.7 lakh crore by 2030; digital passes 70% by 2027 and keeps climbing. Retail media and CTV lead growth; linear TV erodes slowly; the Google–Meta duopoly holds the high-50s-to-low-60s of digital as commerce media takes share at the margin. JioStar consolidates its position as the premium-video counterparty and launches — but does not yet dominate with — a commerce-media play. DPDP's May 2027 cliff arrives roughly on time and the ecosystem absorbs it with cost and friction but no rupture, accelerating the pivot to first-party data, contextual targeting, and consent infrastructure. The BARC–Nielsen cross-media currency moves from pilot toward partial adoption but is not yet the single trading standard by 2030. **Drivers:** all five, in balance. **Signals this is the world we're in:** Madison/dentsu/WPP 2027–28 prints landing near forecast; CTV ad spend reaching the low-to-mid ₹teens-thousand crore by 2028; no major CCI action against JioStar; DPDP enforcement beginning without a landmark penalty.\n\n### Scenario 2 — The Bharat unlock (upside, ≈20%)\n\nThe reach-to-revenue gap closes faster than the skeptics expect. Non-metro CTV CPMs converge toward metro rates as independent measurement (Comscore for YouTube CTV, BARC–Nielsen for cross-media) matures and gives advertisers confidence to pay for rural/regional inventory at scale; FAST and self-serve (JioHotstar from ₹4,000, Samsung TV Plus) pull the MSME long tail onto the big screen. CTV overshoots toward the FICCI-EY broad path (₹16,000 crore+ by 2028 and beyond); India vaults into the top three digital markets. The creator and regional-language economy formalizes. **Drivers:** Bharat frontier + trust infrastructure maturing early + commerce media. **Signals:** Comscore India CTV measurement live and validating (not deflating) the \"new TV\" reach claims; CTV-spend estimates *converging* across houses (the definitional fog lifting); non-metro CPM data rising; quick-commerce ad revenue beating the ~₹4,900 crore 2026 forecast.\n\n### Scenario 3 — Trust-and-concentration drag (downside, ≈15%)\n\nThe infrastructure does not keep up. The measurement vacuum persists, CTV fraud and the ~7–8% waste problem stay unresolved, and advertisers keep money in walled gardens rather than fund open programmatic CTV at scale — so CTV grows but underperforms the bullish forecasts. DPDP compliance proves costlier and messier than expected (verifiable parental consent at India scale is genuinely hard), chilling targeted spend and especially youth-heavy inventory. AI Overviews erode search-ad and publisher economics measurably in India. Growth slows toward high-single digits, and the very concentration that defines the market — Reliance's integration, the foreign duopoly — invites a regulatory or political response that adds uncertainty. **Drivers:** trust infrastructure lagging + AI-Overview threat + concentration backlash. **Signals:** the BARC–Nielsen pilot stalling or not achieving adoption; a high-profile DPDP penalty or a delayed/relaxed May 2027 deadline signaling dysfunction; CTV waste/fraud figures worsening; visible India publisher-traffic declines from AI search.\n\n### Scenario 4 — Structural shock (tail, ≈10%)\n\nA discontinuity rewrites the board. Candidates, any one of which is individually low-probability: the CCI's conditional JioStar remedies are tightened into a real structural constraint (or a forced divestiture); the government publishes a restricted-jurisdiction list or a hard data-localization mandate, disrupting global DSPs and measurement vendors overnight; TikTok returns to India (or a successor is permitted), re-fragmenting short video and the creator economy YouTube and Meta inherited; or generative AI search advances far enough to break the search-ad click model faster than Google can re-monetize answers. **Drivers:** regulatory/political discontinuity or technological rupture. **Signals:** CCI enforcement filings; a MeitY cross-border notification; any India–China app-policy thaw; step-changes in AI-search adoption and zero-click share.\n\n---\n\n## What would change our minds\n\nThe forecast is calibrated, not predictive — its value is the conditions that shift weight between scenarios. Weight moves toward the **Bharat unlock** if independent CTV measurement goes live and *validates* platform reach claims, and if CTV-spend estimates start converging (the surest sign the definitional fog is lifting). Weight moves toward the **drag** if the BARC–Nielsen effort stalls, if DPDP enforcement looks dysfunctional, or if AI-Overview click erosion shows up clearly in Indian publisher and search-ad data. Weight moves to the **tail** on any CCI action against JioStar, any cross-border-transfer restriction, or any India–China app-policy reversal. The base case simply requires that none of these break decisively in either direction — which, given how many moving parts must stay in balance, is itself a real assumption rather than a safe default.\n\n---\n\n## Open Questions (forecast-specific)\n\nThe deepest uncertainties that the scenarios turn on: whether the May 2027 DPDP deadline holds or slips; how \"verifiable parental consent\" actually works at India scale; whether a cross-platform currency gets *adopted* or merely *piloted*; how fast non-metro CTV CPMs converge toward metro rates; whether Reliance builds a commerce-media network at Amazon/Flipkart scale; the India-specific magnitude of AI-Overview click erosion; and what the CCI's voluntary modifications on the JioStar approval actually require and whether they are enforced. Each is developed further in the chapters that precede this one; together they are the instrument panel for revising this forecast as 2027–2030 unfolds."}], "glossary": []}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme
const themePref = localStorage.getItem('corpus-theme');
if (themePref) document.documentElement.dataset.theme = themePref;

function runSearch() {
  const q = searchBox.value.trim().toLowerCase();

  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';

      const exact = d.body.slice(pos, pos + q.length);

// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain

// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)

    acceptNode: function (n) {

      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }

    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;

    else sub.textContent = 'Pick a research above to trace its intellectual world — or roam the mosaic of every corpus. Drag to pan, scroll to zoom.';
  }

  // Repaint the whole surface for the active mode. Cheap enough to rebuild wholesale.
  function paint(doFit) {
    if (!DATA) return;
    var j = DATA, C = (mode && j.connections && j.connections[mode]) ? j.connections[mode] : null;
    var s = '<svg id="atlas-svg" viewBox="' + j.viewBox + '" width="' + j.w + '" height="' + j.h
      + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">';
    s += '<defs>';
    for (var rid in j.regions) s += '<clipPath id="ar-' + rid + '"><path d="' + j.regions[rid].d + '"/></clipPath>';
    if (!C) j.places.forEach(function (p) { var c = p.cell;
      s += '<clipPath id="ac-' + p.slug + '"><rect x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3] + '"/></clipPath>'; });
    else s += '<clipPath id="ahome"><circle cx="' + C.home.x + '" cy="' + C.home.y + '" r="58"/></clipPath>';
    s += '</defs>';
    s += '<g id="atlas-grat">'; (j.graticule || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += '<g id="atlas-bd">'; (j.backdrop || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += C ? connLayer(C) : placesLayer(j);
    s += '</svg>';
    world.innerHTML = s;
    bySlug = {};
    computeBounds(C);
    if (C) wireConn(C); else wirePlaces(j);
    if (doFit === false) { apply(); return; }
    if (!C && restore()) { apply(); if (!enoughVisible()) fit(); }
    else fit();
  }

  function placesLayer(j) {
    var s = '<g id="atlas-places">';
    j.places.forEach(function (p) {
      var c = p.cell;
      s += '<g class="atlas-place" data-slug="' + esc(p.slug) + '"><g clip-path="url(#ar-' + p.region + ')">';
      if (p.img) { var href = esc(base + p.img);
        s += '<image class="atlas-img" href="' + href + '" xlink:href="' + href + '" x="' + c[0] + '" y="' + c[1]
          + '" width="' + c[2] + '" height="' + c[3] + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac-' + p.slug + ')"/>'; }
      s += '<rect class="atlas-ring" x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3]
        + '" clip-path="url(#ac-' + p.slug + ')" fill="none" stroke="' + esc(p.accent) + '" stroke-width="3"/>';
      s += '</g></g>';
    });
    s += '</g><g id="atlas-lines">';
    for (var r2 in j.regions) { var R = j.regions[r2];
      s += '<path class="atlas-rgn" d="' + R.d + '"/>';
      (R.dividers || []).forEach(function (d) {
        s += '<line class="atlas-div" x1="' + d[0] + '" y1="' + d[1] + '" x2="' + d[2] + '" y2="' + d[3] + '" clip-path="url(#ar-' + r2 + ')"/>'; });
    }
    s += '</g>';
    return s;
  }

  function arcPath(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = Math.min(170, len * 0.16), cx = mx - dy / len * off, cy = my + dx / len * off;
    return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  function clipText(t, n) { t = t || ''; return t.length > n ? t.slice(0, n - 1).replace(/[\s,;:&/-]+$/, '') + '…' : t; }
  function connLayer(C) {
    var ac = esc(C.home.accent || '#b3502f'), H = C.home, R = 58;
    var s = '<g id="atlas-lines">';
    for (var rid in DATA.regions) s += '<path class="atlas-rgn" d="' + DATA.regions[rid].d + '"/>';
    s += '</g>';
    s += '<g id="atlas-threads" stroke="' + ac + '">';
    C.nodes.forEach(function (n, i) { s += '<path class="atlas-thread" data-i="' + i + '" d="' + arcPath(H.x, H.y, n.x, n.y) + '"/>'; });
    s += '</g>';
    // home badge drawn UNDER the place nodes, so their dots + labels are never masked
    s += '<g class="atlas-home">';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + (R + 6) + '" fill="var(--bg)"/>';
    if (H.img) { var href = esc(base + H.img);
      s += '<image href="' + href + '" xlink:href="' + href + '" x="' + (H.x - R) + '" y="' + (H.y - R) + '" width="' + (2 * R) + '" height="' + (2 * R) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ahome)"/>'; }
    else s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="' + ac + '"/>';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="none" stroke="' + ac + '" stroke-width="4.5"/>';
    s += '<text class="atlas-hlabel" x="' + H.x + '" y="' + (H.y + R + 33) + '" text-anchor="middle" fill="' + ac + '">' + esc(H.name) + '</text>';
    s += '</g>';
    s += '<g id="atlas-cnodes">';
    C.nodes.forEach(function (n, i) {
      // splay each label outward from home so the European cluster doesn't pile up
      var dx = n.x - H.x, dy = n.y - H.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var lx = n.x + dx / L * 15, ly = n.y + dy / L * 15 + (dy >= 0 ? 16 : -8);
      var anchor = dx > 30 ? 'start' : (dx < -30 ? 'end' : 'middle');
      s += '<g class="atlas-cnode" data-i="' + i + '">';
      s += '<circle class="atlas-chalo" cx="' + n.x + '" cy="' + n.y + '" r="17" stroke="' + ac + '" fill="none"/>';
      s += '<circle class="atlas-cdot" cx="' + n.x + '" cy="' + n.y + '" r="9" fill="' + ac + '"/>';
      s += '<text class="atlas-clabel" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(clipText(n.name, 30)) + '</text>';
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function computeBounds(C) {
    var X0 = 1e9, Y0 = 1e9, X1 = -1e9, Y1 = -1e9;
    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      DATA.places.forEach(function (p) { bySlug[p.slug] = p; var c = p.cell;
        X0 = Math.min(X0, c[0]); Y0 = Math.min(Y0, c[1]); X1 = Math.max(X1, c[0] + c[2]); Y1 = Math.max(Y1, c[1] + c[3]); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
