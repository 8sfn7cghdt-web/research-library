2026-06-17.\n9. adgully / socialsamosa, \"WPP Media TYNY ... ₹2.02 lakh cr in 2026; Digital at 68%, Commerce surges 24%,\" Feb 2026. https://www.adgully.com/post/12358/wpp-media-india-tyny-report-estimates-97-ad-growth-in-2026 — Tier 5. Commerce +24.2%. Accessed 2026-06-17.\n10. Storyboard18, \"Google and Meta hold two-thirds of India's digital ad market,\" (FICCI-EY M&E 2026), 24 Mar 2026. https://www.storyboard18.com/advertising/google-meta-claim-64-of-india-digital-ads-as-e-commerce-surges-93065.htm — Tier 5 (citing FICCI-EY, Tier 2/industry). 64% duopoly, Rs 94,700 cr digital, retail media Rs 22,000 cr, SME Rs 36,300 cr, CTV Rs 9,900 cr. Accessed 2026-06-17.\n11. FICCI-EY Media & Entertainment Report 2026 (as reported), released 24 Mar 2026 — Tier 2 (industry-authoritative joint report). Duopoly share, digital 63%. Accessed via [10]. Accessed 2026-06-17.\n12. bestmediainfo, \"Madison puts out ADEX early; 2026 pegged at Rs 1,74,605 crore,\" Feb 2026. https://bestmediainfo.com/mediainfo/advertising/tyny-day-madison-puts-out-adex-early-2026-pegged-at-rs-174605-crore-11125225 — Tier 5. Q-Comm Rs 4,000 cr +202%, linear TV Rs 32,855 cr, 2026 legacy Rs 1,25,600 cr. Accessed 2026-06-17.\n13. medianews4u, \"Digital Ad Spends Cross ₹71,000 Crore ... dentsu report,\" Feb 2026. https://www.medianews4u.com/digital-ad-spends-cross-%E2%82%B971000-crore-seen-touching-%E2%82%B998000-crore-by-2027-dentsu-report/ — Tier 5. E-retail Rs 17,601 cr / 24.6%. Accessed 2026-06-17.\n14. exchange4media, \"Digital ad spends climb across sectors in 2025, led by FMCG & eCommerce: dentsu-e4m report,\" 2026. https://www.exchange4media.com/digital-news/digital-ad-spends-climb-across-sectors-in-2025-led-by-fmcg-ecommerce-151591.html — Tier 5. FMCG 32%/Rs 23,243 cr; category digital intensity; print advertisers. Accessed 2026-06-17.\n15. Storyboard18 / companiesmarketcap / industry coverage, \"Google India gross revenue Rs 34,742 cr FY24-25; Meta India ~Rs 28,000 cr FY25 est.; YouTube India not di in India", "summary": "", "body": "# Programmatic Advertising and Connected TV in India\n\n## Bottom Line\n\nIndia's connected-TV (CTV) market is real, large, and growing fast — but it is measured so inconsistently that the single most important \"fact\" about it, the size of CTV ad spend, ranges across published 2025 estimates from roughly ₹1,500 crore (dentsu) to ₹6,000 crore (Madison) to ₹9,900 crore (FICCI-EY), a more-than-six-fold spread driven almost entirely by definition rather than by disagreement about the underlying market. The plumbing is consolidating around a small number of players: on the supply side, JioStar/JioHotstar is the gravitational center — the single largest seller of premium video inventory in India, now running its live-sports and entertainment programmatic stack on Magnite's SpringServe ad server and mediation layer under an expanded partnership announced 4 June 2026, including the 2026 ICC Men's T20 World Cup. On the demand side, The Trade Desk, Google's DV360, and Amazon DSP are the principal independent and platform buying routes into Indian CTV, with Magnite and PubMatic the leading independent SSPs. Household and user penetration are likewise contested — credible figures span ~45 million CTV households / ~129 million users to ~68 million households (40 million weekly-active) — because \"household,\" \"user,\" and \"weekly active\" are not the same denominator. A persistent measurement-and-trust gap (an estimated 7–8% of Indian CTV spend delivering no measurable value in 2025, per DoubleVerify-anchored trade reporting) is the chief brake on the channel maturing into a performance medium. The honest reading: CTV in India is at an inflection — penetration, sports yield (IPL/ICC), addressable linear, OEM/FAST inventory, and self-serve democratization are all compounding — but the numbers you cite depend entirely on whose definition you adopt, and most of the central figures here rest on a single source or a particular methodology.\n\n---\n\n## 1. The Definitional Problem That Governs This Entire Market\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 300\" role=\"img\" aria-label=\"Five published estimates of India's 2025 CTV ad spend, ascending: dentsu ₹1,500 crore (narrow), trade synthesis ₹2,500 crore, Madison ₹6,000 crore (most-cited mid-point), WPP Media about ₹6,300 crore, FICCI-EY ₹9,900 crore (broad). A 6.6-fold spread.\">\n<text x=\"350\" y=\"28\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THE CTV FOG<\/text>\n<text x=\"350\" y=\"46\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">India's 2025 connected-TV ad spend — five estimates, a 6.6× spread (₹ crore)<\/text>\n<rect x=\"210\" y=\"70\" width=\"436\" height=\"168\" class=\"f-panel\" opacity=\".45\"/>\n<text x=\"210\" y=\"96\" text-anchor=\"end\" font-size=\"10\" class=\"t-muted\" transform=\"translate(-6,0)\"> <\/text>\n<rect x=\"210\" y=\"82\" width=\"66\" height=\"22\" class=\"f-t3\"/>\n<text x=\"282\" y=\"98\" font-size=\"10\" class=\"t-mono\">₹1,500 — dentsu (narrow / programmatic-only)<\/text>\n<rect x=\"210\" y=\"116\" width=\"110\" height=\"22\" class=\"f-t3\"/>\n<text x=\"326\" y=\"132\" font-size=\"10\" class=\"t-mono\">₹2,500 — trade synthesis<\/text>\n<rect x=\"210\" y=\"150\" width=\"264\" height=\"22\" class=\"f-t1\"/>\n<text x=\"480\" y=\"166\" font-size=\"10\" class=\"t-mono\" font-weight=\"bold\">₹6,000 — Madison (most-cited mid-point)<\/text>\n<rect x=\"210\" y=\"184\" width=\"277\" height=\"22\" class=\"f-t3\"/>\n<text x=\"493\" y=\"200\" font-size=\"10\" class=\"t-mono\">₹6,300 — WPP Media (~$760M)<\/text>\n<rect x=\"210\" y=\"218\" width=\"436\" height=\"22\" class=\"f-t5\"/>\n<text x=\"210\" y=\"234\" font-size=\"10\" font-weight=\"bold\" class=\"t-inv\" transform=\"translate(8,0)\">₹9,900 — FICCI-EY (broad / all big-screen streaming)<\/text>\n<line x1=\"210\" y1=\"70\" x2=\"210\" y2=\"248\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"200\" y=\"266\" text-anchor=\"start\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">Narrow definitions count only device-delivered programmatic inventory; broad ones fold in direct-sold sports streaming.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> CTV is the corpus's sharpest case of definitional fog: published 2025 estimates run from ₹1,500 crore to ₹9,900 crore — a 6.6× spread driven almost entirely by what counts as \"CTV,\" not by disagreement about the underlying market. A single ICC cricket tournament earned JioStar over ₹2,000 crore in direct-sold ad revenue, which is why \"broad\" definitions balloon. (dentsu-e4m; exchange4media trade synthesis; PMAR 2026; WPP Media TYNY; FICCI-EY M&amp;E 2026.)<\/figcaption>\n<\/figure>\n\n\nBefore any number here can be used, one fact must be foregrounded: **there is no agreed definition of \"CTV ad spend\" in India, and the published estimates therefore diverge by more than 6x.** This is not a footnote — it is the central analytical finding of this chapter, and it must travel with every figure cited below.\n\n### Published 2025 India CTV ad-spend estimates range from ~₹1,500 cr to ₹9,900 cr, a spread driven by definition\n\nThe dentsu e4m report has at points pegged India's CTV advertising market near ₹1,500 crore [1]; trade synthesis of Pitch Madison and dentsu put a 2025 figure around ₹2,300–2,500 crore [2]; the Pitch Madison Advertising Report (PMAR) 2026 estimated CTV roughly **doubled to ₹6,000 crore in 2025** [3]; and the FICCI-EY Media & Entertainment Report 2026 reported **CTV ad revenues of ₹9,900 crore (₹99 billion), up 42% year-on-year** in 2025 [4]. WPP Media's \"This Year Next Year\" (TYNY, December 2025) sits in the middle in dollar terms — roughly **USD 760 million in 2025 (~20% growth)** rising to **~USD 1 billion in 2026 (~22%)**, with CTV's share of TV/professional video climbing from 12% (2024) to ~14% (2025) to 17% (2026) [5].\n\nThe reconciliation is definitional, not factual:\n- **The narrow definition** (dentsu, the low end) counts only *CTV-device-delivered, independently-transacted/programmatic* video inventory — ads served to a smart-TV/streaming-stick screen, often only the open-programmatic or addressable slice.\n- **The broad definition** (FICCI-EY, the high end) appears to fold in a much larger pool of premium streaming/BVOD ad revenue that reaches the big screen — including direct-sold sports inventory (IPL/ICC) that is enormous in rupee terms but is not \"programmatic CTV\" in the narrow sense.\n- **Madison and WPP** sit between, treating CTV as the large-screen streaming slice of digital video, which is why Madison's ₹6,000 cr aligns with WPP's ~USD 760M (≈₹6,300 cr at ~₹83/USD) far better than with dentsu's ₹1,500 cr.\n\n**Implication for everything that follows:** when a single figure is needed, the defensible framing is \"CTV ad spend in India in 2025 was somewhere between roughly ₹2,500 crore (narrow/programmatic-CTV) and ₹9,900 crore (broad/all big-screen streaming revenue), with ₹6,000 crore (Madison) the most-cited mid-point.\" Madison projects CTV to **₹8,000 crore in 2026** [3]; WPP projects ~USD 1 billion / roughly ₹6,800–8,000 crore [5]; FICCI-EY's trajectory implies ₹16,400 crore by 2028 at ~18% CAGR [4]. All of these are estimates from interested industry bodies and agencies, and none should be cited as a hard fact without the definitional caveat.\n\n---\n\n## 2. Household and User Penetration — The Second Contested Denominator\n\n### India had on the order of 45–68 million CTV households and ~129 million CTV users in 2025, with figures diverging by denominator\n\nPenetration figures diverge for the same reason spend figures do — different denominators:\n- **~45 million households / ~129 million users**: a widely-circulated framing (MiQ Advanced TV-type framing and trade reporting) puts India at more than **129 million CTV users across ~45 million connected-TV households**, with the user count representing everyone who streamed on a CTV at least once in the past month [6][7].\n- **~68 million households, ~40 million weekly-active**: the FICCI-EY Report 2026 counts **~68 million CTV households**, of which **~40 million are active on a weekly basis**, on a base of ~60 million broadband-enabled homes [4].\n- **60–70 million CTV homes / 129.2 million active users**: MiQ's Advanced TV framing has also been reported as **129.2 million active users across 60–70 million CTV homes** [7].\n- **50–60 million households by mid-2026**: trade consensus for mid-2026 [2][6].\n\nThe reconciliation: a \"CTV household\" (a home with at least one internet-connected TV) is a larger and more stable number than \"weekly-active CTV household\" (a home where someone actually streamed to the TV in the last 7 days). The ~45M vs ~68M gap is partly a 2025-vs-projected timing difference and partly whether you count *capable* devices or *active* ones. The ~129M user figure is a per-month reach number, not a household number — citing it alongside a household figure without that distinction is the most common error in Indian CTV commentary.\n\n### India CTV households are growing roughly 20–22% YoY\n\nCTV households are reported growing at approximately **21% year-on-year**, with CTV ad revenue projected to grow ~20% in 2025 and ~22% in 2026 [2][5]. FICCI-EY projects **90+ million CTV households and ~67 million weekly-active users by 2028** [4]. These are forecasts from industry bodies; treat as directional.\n\n### Smart-TV/CTV reach is the structural driver, not subscription growth\n\nIndia's CTV growth is hardware-and-broadband-led: falling smart-TV prices, cheap streaming sticks, and ubiquitous low-cost broadband/Jio fiber are converting linear-TV and mobile-only homes into big-screen streaming homes [4][8]. This is the same mobile-first leapfrog dynamic that built India's digital ad market, now playing out on the television set.\n\n---\n\n## 3. The Supply Side — JioStar/JioHotstar as the Gravitational Center\n\n### JioStar (Reliance/Viacom18 + Disney Star JV) is the dominant Indian video-inventory seller; JioHotstar is its streaming arm\n\nJioStar was formed by the merger of **Viacom18 and Disney Star**, a joint venture of **Reliance Industries, Viacom18, and Disney India**, with the formal transition beginning **14 November 2024** [9][10]. As of mid-2026 JioStar operates **130+ television channels** across multiple languages, reaches **~750 million weekly viewers** across platforms, and reported combined annual revenues estimated at **₹17,000+ crore** [9]. Its streaming service **JioHotstar** — formed in **February 2025** from the merger of JioCinema and Disney+ Hotstar [10][11] — reports **~450 million monthly active users**, programming in **19 languages** exceeding **300,000 hours** [11] (an alternate figure of ~150 million MAU appears in the JioStar year-one piece [9]; the 450M figure is the more recent partnership-release number — the gap likely reflects \"registered/reach\" vs \"active\"). JioHotstar holds **~31% SVOD market share in 2025**, ahead of Prime Video (~23%) and Netflix (~19%) [8]. JioStar holds IPL (digital), ICC (TV + digital), Women's Premier League, and Pro Kabaddi rights [9]. The company was confirmed operating in this form as of the 4 June 2026 Magnite release [11] and the 21 May 2026 self-serve launch [12]; the 150M-vs-450M MAU discrepancy remains unresolved.\n\n### JioHotstar runs its live-sports/entertainment programmatic ad stack on Magnite's SpringServe (ad server + mediation), under an expanded partnership announced 4 June 2026 — including the 2026 ICC Men's T20 World Cup\n\nOn **4 June 2026** (dated Mumbai), Magnite (NASDAQ: MGNI) announced an **expanded partnership** under which JioHotstar uses **SpringServe** — Magnite's unified video ad server and supply-side platform (the SpringServe ad server and Magnite SSP were merged in April 2025) — to power **advanced programmatic mediation** across its **live, sports, and entertainment** portfolio [11][13][14]. Mediation here means SpringServe controls which advertiser bids are accepted, in what order, and under what conditions — managing competition between direct-sold campaigns, private marketplace (PMP) deals, and open-exchange demand, with floor pricing, creative-quality filters, and category exclusions [13]. **Magnite supported JioHotstar during the 2026 ICC Men's T20 World Cup** [11][13]. Named quotes: **Bharath Ram, Chief Product Officer, JioHotstar** (\"Magnite has consistently been a key partner…\"), and **Sahil Bansal, Country Manager, India, Magnite** [11][14]. The release describes \"deepening of an existing commercial relationship,\" indicating a prior SpringServe collaboration whose terms are not disclosed [11][13].\n\nOne caveat is worth stating plainly: every downstream report (Globe & Mail, PPC.land, Mediabrief, StockTitan, ManilaTimes) is a syndication of the *same* Magnite press release. A press release establishes what the companies claim, not proof that the integration performs as described. The *existence and date* of the partnership are well-attested; the operational claims (scale, performance) are the companies' own.\n\n### JioStar offers addressable TV / dynamic ad insertion (DAI) on linear, and addressable programmatic during live sports\n\nJioStar runs an **addressable-TV initiative for dynamic ad insertion (DAI) in linear TV** and programmatic buying for digital inventory; the tech consolidation integrated Viacom18's CMS and ad stack into JioHotstar while Disney's streaming infrastructure was phased out [9]. During live IPL streaming, programmatic inventory is served to **identified, logged-in users** using Jio's consumer data, commanding premium CPMs [15]. The **ICC Men's World Cup generated over ₹2,000 crore in ad revenue** for JioStar [9] — a figure that illustrates why \"broad\" CTV/streaming spend definitions balloon: a single tournament's direct-sold ad revenue rivals a whole year of \"narrow\" programmatic-CTV spend.\n\n### JioStar's \"Moment.AI\" AI contextual ad-insertion tool is live on the entertainment network and rolling out to JioHotstar\n\nJioStar launched **Moment.AI**, an AI-powered contextual ad-insertion tool that scans video to decode emotions/objects and place ads at moments of \"peak emotional resonance,\" reported as **active across JioStar's entertainment network and rolling out to JioHotstar**, with a company-claimed **34% uplift** in ad effectiveness [15][16]. It was announced around September 2025; the 34% uplift is the company's own figure, not independently measured.\n\n### JioHotstar launched a self-serve ads platform opening IPL/premium inventory to SMEs from ₹4,000\n\nOn **21 May 2026**, JioHotstar opened **self-serve advertising** with a **minimum spend of ₹4,000**, offering pre-roll/mid-roll across IPL, live sports, entertainment, movies and regional content, with city/pincode-level, demographic, device, and team-based IPL targeting, and CPC/performance options [12]. This is a material structural shift — it pulls the MSME long tail (the same demand pool YouTube and Meta monetize) into premium CTV/streaming inventory.\n\n### IPL on JioHotstar drew a record CTV audience; CTV is now a major share of IPL streaming\n\nCTV viewership of the IPL hit a record **235 million viewers, a 44% YoY jump**, and JioHotstar represents the single largest aggregation of premium video inventory in India [8][15]. The IPL is the anchor tenant of Indian CTV monetization — the event that pulls advertiser budgets onto the big screen and sets the CPM ceiling.\n\n---\n\n## 4. The Demand Side and the Programmatic Plumbing — DSPs, SSPs, Exchanges\n\n### The Trade Desk operates in India CTV with named OTT/OEM partners; products include Kokai/Koa, OpenPath, UID2\n\nThe Trade Desk (TTD) markets a CTV/OTT offering for India and lists premium India inventory partners including **Airtel Xstream, JioHotstar, JioTV+, LG, Mi (Xiaomi), MX Player, Samsung TV, SonyLIV, TCL, and ZEE5**, surfacing products **Koa/Kokai** (AI optimization), **OpenPath** (direct-to-publisher supply), and **UID2** (identity) [17]. TTD has an **India General Manager, Tejinder Gill** [18]. TTD's original Samsung Ads CTV collaboration extending Samsung TV Plus inventory programmatically dates to 2021 [19]. One caveat: TTD's India CTV page carries only a \"©2026\" footer and no dated content, so the *list* of partners cannot be independently timestamped to mid-2026 from the page alone — the page asserts current operation but is the company's own marketing. The GM role is separately attested.\n\n### Google DV360 and Amazon DSP are the other principal buying routes into Indian CTV\n\nGlobally and in India, **Google Display & Video 360 (DV360)** is the dominant route for advertisers in the Google ecosystem (and the principal programmatic path to YouTube/CTV YouTube inventory), and **Amazon DSP** offers deterministic, logged-in-shopper audiences plus CTV inventory via Prime Video/Fire TV [20][21]. TTD typically charges ~15–20% of spend and is positioned as the leading *independent* CTV DSP [20]. One caveat: India-specific DV360 and Amazon DSP CTV market-share data could not be located, so the India-specific application here is an inference from global product positioning. (The detailed treatment of YouTube and DV360 in India comes later, in the chapter on YouTube.)\n\n### Magnite and PubMatic are the leading independent SSPs relevant to Indian CTV\n\n**Magnite** is the largest independent sell-side ad company with particular CTV strength (CTV Contribution ex-TAC grew to **$63.2M in Q1 2025 (+15% YoY)** and **$71.5M in Q2 2025 (+14%)**) and is now the named SSP/ad-server for JioHotstar [11][22]. **PubMatic** is a key SSP rival with strong CTV momentum (CTV revenue **up >50% YoY in Q1 2025**, ~40% of total revenue) [23]. PubMatic, with India engineering roots (Pune), is a structurally significant player though no specific 2025–26 India CTV publisher deal could be confirmed. One caveat: the Magnite/PubMatic CTV financials are company-reported, and a specific *India* PubMatic streaming deal, though searched for, was **not** found.\n\n### The supply chain is contracting toward direct/publisher routes (OpenPath, SpringServe mediation)\n\nThe global structural trend — TTD's OpenPath cutting SSPs out as \"resellers,\" PubMatic's direct CTV routes, and publishers (JioHotstar via SpringServe) taking ownership of their own mediation/yield — is reshaping Indian CTV plumbing toward fewer, more direct hops between buyer and premium publisher [13][24]. This concentrates power with the largest sellers (JioStar) and the largest independent DSP (TTD).\n\n---\n\n## 5. Smart-TV OEM Inventory and the FAST-Channel Landscape\n\n### Samsung TV Plus is India's leading OEM FAST service (~150+ channels, ~14M+ Samsung smart TVs)\n\n**Samsung TV Plus**, Samsung's free ad-supported streaming TV (FAST) service in India, carries **150+ channels** (some reports 160+) and reaches **14M+ Samsung smart TVs** in India, actively expanding content partnerships in 2026 — adding channels from India TV Group (India TV, Speed News, Aap Ki Adalat, Yoga), five exclusive Warner Bros. Television FAST channels, ZEE5 FAST channels, Green Gold TV (kids), and creator channels [25][26][27]. It was confirmed live and expanding through 2026 via dated Samsung Newsroom India releases [25][26].\n\n### LG Channels operates in India (~100 channels) but trails Samsung TV Plus\n\n**LG Channels**, LG's FAST service launched in India in **September 2023**, offers ~100 live channels on LG webOS TVs — fewer than Samsung TV Plus's count [28]. It was confirmed operating and expanding per 2025–26 trade reporting [28].\n\n### OEM inventory (Samsung/LG/Xiaomi) is a distinct, programmatically-accessible CTV supply pool\n\nSmart-TV OEMs (Samsung, LG, Xiaomi/Mi, TCL) sell **home-screen, discovery, and FAST-channel** inventory accessible programmatically — TTD lists LG, Mi, Samsung TV, and TCL among India CTV partners [17], and Samsung Ads home-screen/discovery inventory benchmarks at **~₹200–500 CPM** [29]. This OEM layer is structurally important because it is the one CTV supply pool *not* controlled by JioStar — the principal counterweight to Reliance's gravity in big-screen inventory.\n\n### FAST is an emerging but still-small segment with weak inventory metadata\n\nIndia's FAST ecosystem is expanding (Samsung TV Plus, LG Channels, plus publisher FAST feeds from ZEE5 etc.) but remains small relative to AVOD/BVOD, and **FAST channel inventory repeatedly lacks granular metadata**, a measurement weakness [30][25]. This is one contributing factor to the trust gap discussed below.\n\n---\n\n## 6. Measurement, Invalid Traffic (IVT)/Fraud, and the \"Trust Gap\"\n\n### An estimated 7–8% of Indian CTV ad spend delivered no measurable value in 2025 (IVT, unviewable, unmeasurable)\n\nTrade reporting (12 December 2025), drawing on DoubleVerify's 2025 Global Insights and Indian verification vendors, estimates that **7–8% of CTV ad spend in India delivered no measurable value in 2025** — i.e., for every ₹100 spent, advertisers received ₹90–97 of real addressable opportunity — with **open-auction environments showing 10–30% ROI drops** versus log-level data buys [30]. One caveat: the 7–8% figure traces to a single trade synthesis; the underlying DoubleVerify data is global, and the India-specific 7–8% is that outlet's estimate.\n\n### CTV fraud is dominated by bots; global SIVT filter rates spiked, but India improved YoY\n\nPer DoubleVerify: **bot fraud accounted for ~65% of all CTV fraud in 2024** (14% higher than other channels), global CTV **fraud/SIVT filter rates rose ~110% YoY**, and a single bot variant can waste **>$7.5M/month** globally [30][31]. India specifically saw a reported **~60% improvement in CTV fraud/SIVT violation rates YoY**, and earlier DoubleVerify data credited India with a **36% reduction in overall ad-fraud rates** as verification adoption rose [30][32]. One caveat worth keeping in mind: DoubleVerify is a verification vendor with a commercial interest in framing fraud as a large, addressable problem, and the data is its own.\n\n### India CTV measurement is structurally opaque: inconsistent OEM device-level transparency, varying log-level reporting, partial standards\n\nOnly ~50% of CTV impressions offered full app transparency in 2024 (improving to ~64% globally by Q1 2025); **63% of marketers report difficulty confirming real viewer delivery** and **68% require transparency to justify CTV's premium cost** [30][31]. India-specific drivers: **device-level transparency inconsistent across OEMs, log-level reporting varying widely, FAST inventory lacking metadata, and unified measurement standards only partially adopted** [30].\n\n### Multiple verification/measurement vendors operate in India CTV\n\nNamed vendors active in/around India CTV verification and measurement: **DoubleVerify (DV)** and **Integral Ad Science (IAS)** (the two majors), plus India-rooted **mFilterIt** (Founder/CEO Amit Relan; Co-founder/CTO Dhiraj Gupta) and **Frodoh** (Founder/CEO Russhabh R Thakkar), with **Nielsen** and **Kantar** on the audience-measurement side [30][33]. Their presence is confirmed via Dec 2025 trade reporting; specific India CTV product coverage by IAS/DV is asserted in trade sources rather than in the vendors' own product documentation.\n\n---\n\n## 7. Pricing and CPMs\n\n### Indian CTV CPMs span ~₹150–₹1,200 by inventory type, far below US CTV CPMs\n\nA CTV benchmark hub (StratPulse, updated April 2026, explicitly \"directional, not guarantees,\" derived from agency-reported rates and rate-card analysis) puts Indian CTV CPMs at: **open-programmatic non-skippable pre-roll ₹150–₹350; audience-targeted PMP/direct ₹350–₹700; premium platform/content direct (JioHotstar/SonyLIV/ZEE5, ex-IPL) ₹700–₹1,200; live IPL pre-roll ₹400–₹600+ (negotiated with Jio Ads); Samsung Ads OEM home-screen/discovery ₹200–₹500** [29]. By contrast US CTV CPMs run ~$20–$40 (≈₹1,700–₹3,400) — India CPMs are materially lower owing to lower ad-GDP intensity and measurement uncertainty [29]. One caveat: these are a single specialist source's directional benchmarks, not transacted-rate data. The IPL-pre-roll being *lower* than premium ex-IPL entertainment is counter-intuitive and may reflect IPL's massive scale/volume pricing rather than scarcity pricing.\n\n### Premium logged-in, addressable CTV inventory commands the highest CPMs\n\nThe pricing gradient is consistent across sources: identified, logged-in, audience-targeted, brand-safe premium inventory (JioHotstar live sports to logged-in users; PMP/direct deals) commands multiples of open-auction CPMs [15][29]. This is the economic engine pushing the whole ecosystem toward addressability and first-party data (Jio's consumer graph being the largest).\n\n---\n\n## 8. How the Pieces Fit — Market-Structure Synthesis\n\nThe Indian CTV/programmatic system in mid-2026 has a clear shape:\n\n1. **One dominant seller.** JioStar/JioHotstar is the anchor of premium big-screen inventory (sports + entertainment + 31% SVOD share), now running its programmatic stack on Magnite SpringServe and pulling SMEs in via self-serve. The \"Reliance gravity well\" is the defining structural fact.\n2. **A small DSP oligopoly on the buy side.** TTD (independent leader, with named India OTT/OEM partners), DV360 (Google ecosystem + YouTube), Amazon DSP (commerce data) — with Magnite and PubMatic the independent SSPs.\n3. **An OEM/FAST counterweight.** Samsung TV Plus (leader), LG Channels, Xiaomi/TCL — the one big-screen supply pool outside JioStar's control, programmatically accessible, lower-CPM, metadata-weak.\n4. **A measurement/trust gap (~7–8% waste)** that is the chief brake on CTV maturing into a true performance channel, with DV/IAS/mFilterIt/Frodoh and Nielsen/Kantar competing to close it.\n5. **A definitional fog** over the headline numbers (₹2,500–₹9,900 cr 2025 spend; 45–68M households; 129M users) that any reader of these figures must carry forward.\n\nThe trajectory through 2030 (taken up in the outlook) points to: continued ~20%+ CTV household growth toward 90M+ by 2028; CTV spend toward ₹16,000 cr+ by 2028 on FICCI-EY's broad definition; supply-chain contraction toward direct/publisher routes; addressability and first-party data (Jio's graph) as the value driver; and measurement standardization as the gating variable.\n\n---\n\n## Open Questions\n\n1. **Which CTV-spend definition will the industry standardize on?** Until BARC/an industry body sets one, the ₹2,500-vs-₹9,900-crore fog persists, and cross-source comparison is unsafe.\n2. **What is JioHotstar's true MAU?** The 150M (year-one trade) vs 450M (June 2026 partnership release) gap is unresolved and material to inventory-scale claims.\n3. **What demand sources actually transact through SpringServe at JioHotstar?** The release names categories (direct/PMP/open) but no specific DSPs — is TTD/DV360/Amazon DSP demand flowing through, and at what split?\n4. **What is the real, transacted India CTV CPM distribution?** Only directional benchmarks (StratPulse) were found; no transacted-rate dataset.\n5. **Is the 7–8% waste figure reproducible from primary DoubleVerify India data**, or is it a single trade outlet's India extrapolation of global numbers?\n6. **What is the actual India-specific CTV share for DV360 and Amazon DSP?** No reliable figure is publicly available — a genuine data gap.\n7. **Does PubMatic have a named 2025–26 India CTV publisher deal?** Searched, not confirmed.\n8. **How large is FAST in rupee terms?** Channel counts are reported; FAST ad revenue is not separately sized in available sources.\n9. **Moment.AI's real performance** — the 34% uplift is a vendor claim; no independent measurement found.\n10. **Addressable linear-TV DAI scale** — JioStar's addressable-TV initiative is confirmed to exist but not quantified (households reached, revenue).\n\n---\n\n## S rification-tools-doubleverify-8th-annual-dv-global-insights-2024-trends-report\n\n33. CTV measurement vendors in India (IAS, DoubleVerify, Nielsen, Kantar), StratPulse CTV Hub, 2026. Tier 5. Contribution: vendor landscape. Accessed 2026-06-17. https://ctv.stratpulsetechlabs.com/kb/measurement/attribution-models/ctv-measurement-vendors-india.html"}, {"order": 4, "file": "04_YouTube_India.md", "title": "YouTube in India — Scale, the Reporting Gap, the Creator Economy, Shorts, and the Living-Room Pivot", "summary": "", "body": "# YouTube in India\n\n## Bottom Line\n\nYouTube is the single largest digital surface in India and, by most independent counts, the largest YouTube market on earth — roughly 491 million users in early 2025, a figure Google's own ad-planning data later pushed past 500 million in 2026. Where Connected-TV programmatic is the *plumbing* reshaping where Indian ad money flows, YouTube is the *destination* that money increasingly chases, on mobile and now on the living-room screen. The central analytical problem is a measurement gap: Alphabet has never broken out India-specific YouTube ad revenue, and only disclosed YouTube's *global* total revenue ($60 billion for 2025) for the first time in February 2026 — so every India number must be triangulated from proxies, and every Google-supplied figure (Brandcast, the \"YouTube Impact India\" report, Think with Google) must be read as a self-interested platform making a market for its own inventory. Within that caution: the creator economy is real and large (Rs 21,000 crore paid out over three years, 65,000+ channels earning over Rs 1 lakh in 2024), the post-TikTok-ban Shorts surge is structural (India and the US are Shorts' two biggest markets, but Shorts monetizes at a lower 45% creator share and a fraction of long-form RPM), and the \"YouTube is the new TV\" thesis is the live commercial battleground for 2025–2030 (75M+ adults on CTV as of April 2025, CTV the fastest-growing screen, Comscore now measuring it). The honest reader should treat YouTube's India scale as established, its India *revenue* as estimated, and its promotional GDP/jobs claims as advocacy backed by a commissioned consultancy.\n\n---\n\n## 1. Scale — the largest YouTube market on earth\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 320\" role=\"img\" aria-label=\"YouTube India is three businesses on one audience of about 491 million users: a long-form ad business (55% creator share, mobile-dominant, ~$1-2B estimated), a short-form Shorts engine (650M+ monthly viewers, 45% creator share, weaker per-view economics), and an emergent connected-TV business (75M+ adults, fastest-growing, premium).\">\n<text x=\"350\" y=\"28\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THREE BUSINESSES, ONE AUDIENCE<\/text>\n<text x=\"350\" y=\"46\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">YouTube India — the largest YouTube market on earth, ~491M users, sits under three ad models<\/text>\n<rect x=\"60\" y=\"240\" width=\"580\" height=\"34\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"350\" y=\"262\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" class=\"t-inv\">ONE AUDIENCE BASE — ~491M users (early 2025) → ~518M ad-reach (2026)<\/text>\n<rect x=\"60\" y=\"86\" width=\"180\" height=\"140\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"60\" y=\"86\" width=\"180\" height=\"24\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"150\" y=\"103\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">LONG-FORM<\/text>\n<text x=\"150\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">the historic core<\/text>\n<text x=\"150\" y=\"156\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" class=\"t-acc\">55%<\/text>\n<text x=\"150\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">creator revenue share<\/text>\n<text x=\"150\" y=\"194\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">mobile-dominant<\/text>\n<text x=\"150\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">~$1–2B est. (not disclosed)<\/text>\n<rect x=\"260\" y=\"86\" width=\"180\" height=\"140\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"260\" y=\"86\" width=\"180\" height=\"24\" rx=\"2\" class=\"f-t2\"/>\n<text x=\"350\" y=\"103\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">SHORTS<\/text>\n<text x=\"350\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">post-TikTok-ban inheritance<\/text>\n<text x=\"350\" y=\"156\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" class=\"t-acc\">45%<\/text>\n<text x=\"350\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">creator share (pooled)<\/text>\n<text x=\"350\" y=\"194\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">650M+ monthly viewers<\/text>\n<text x=\"350\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">~₹5–30 RPM vs ₹50–200<\/text>\n<rect x=\"460\" y=\"86\" width=\"180\" height=\"140\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"460\" y=\"86\" width=\"180\" height=\"24\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"550\" y=\"103\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">CONNECTED TV<\/text>\n<text x=\"550\" y=\"132\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">\"YouTube is the new TV\"<\/text>\n<text x=\"550\" y=\"156\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" class=\"t-acc\">75M+<\/text>\n<text x=\"550\" y=\"170\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">adults on CTV (Apr 2025)<\/text>\n<text x=\"550\" y=\"194\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">fastest-growing screen<\/text>\n<text x=\"550\" y=\"210\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\">highest premium-ad value<\/text>\n<line x1=\"150\" y1=\"226\" x2=\"150\" y2=\"240\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"350\" y1=\"226\" x2=\"350\" y2=\"240\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"550\" y1=\"226\" x2=\"550\" y2=\"240\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"298\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">Alphabet discloses no India figure — every revenue number above the audience line is an estimate or a platform claim.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> YouTube India is best read as three overlapping ad businesses sitting on one ~491-million-user base: a mobile long-form core (55% creator share), a Shorts engine that won the audience TikTok lost but monetizes far weaker (45% share, a fraction of long-form RPM), and the emergent living-room CTV business that is the explicit 2025–2030 land-grab on television budgets. The standing caution: every figure above the audience line is an estimate or a YouTube-supplied claim — Alphabet breaks out no India revenue. (DataReportal; YouTube/Brandcast 2025; YouTube Help monetization policy.)<\/figcaption>\n<\/figure>\n\n\n### India is the largest YouTube market by users (~491M, early 2025)\n\nIndia had approximately 491 million YouTube users as of February 2025, making it the largest YouTube market globally — nearly double the United States' ~253 million.\n\nDataReportal / We Are Social ad-planning data (sourced from Google's own ad-reach tool) reported 491 million Indian YouTube users in early 2025, up about 29 million (≈6.3% YoY) from January 2024, equal to roughly 33.7% of India's population and 60.9% of the country's internet users [1][2]. The 253M US comparison is from the same dataset family [1]. Note the metric: this is *ad-reach / addressable audience* derived from Google's ad planner, not a logged-in MAU disclosed by Alphabet — it is the standard independent proxy, but it is a Google-fed number repackaged by a third party.\n\n### Google's own ad audience for India crossed ~518M by April 2026\n\nBy April 2026, India was the country with the largest YouTube advertising audience reach at roughly 518 million, per Google ad-planning data reported through DataReportal/Statista.\n\nStatista and DataReportal-derived trackers report ~518M India YouTube ad-reach in 2026, up from the 491M early-2025 figure [3][2]. The audience is still growing, not plateauing. The same caveat applies — ad-reach, not MAU, and the precise number is best treated as approximate.\n\n### Forecast trajectory toward ~859M by 2029\n\nIndependent trackers forecast India's YouTube user base reaching roughly 859 million by 2029, citing statistics aggregators drawing on Statista/DataReportal projection series [1][3]. This is a modeled extrapolation, not a measured count, and is best read as directional. It would require India's total internet base to keep expanding into rural and lower-income cohorts — plausible but contingent.\n\n### Demographics skew young; consumption skews regional-language\n\nRoughly 80% of India's YouTube audience is under 45 (the 25–34 band ~30%/147M and 18–24 ~24%/118M being the two largest), and the overwhelming majority of consumption is in regional (non-English) languages.\n\nThe age-band breakdown comes from DataReportal-family demographic data [1]. The regional-language dominance is repeatedly asserted across Google's Brandcast/Think with Google messaging and independent trade coverage; YouTube launched dedicated music charts for six high-volume languages — Bhojpuri, Haryanvi, Hindi, Punjabi, Tamil, Telugu [4]. The specific \"~90% of consumption is regional-language\" number appears in aggregator write-ups and should be treated as approximate rather than a precisely measured share [1].\n\n---\n\n## 2. The reporting gap — why every India revenue number is a proxy\n\n### Alphabet first disclosed YouTube *global* total revenue only in February 2026\n\nAlphabet broke out YouTube's total annual revenue for the first time in its Q4/full-year 2025 earnings (reported February 2026): roughly $60 billion for 2025, splitting into ~$40.37 billion advertising and ~$19–20 billion subscriptions; Q4 2025 ad revenue alone was ~$11.4 billion.\n\nThis was reported off Alphabet's Q4 2025 earnings by Variety and Tubefilter; prior to this, Alphabet disclosed YouTube quarterly *ad* revenue but never the platform's total (ads + subscriptions) annual figure [5][6]. The $60B exceeded Netflix's 2025 revenue (~$45B) [5][6]. It is the anchor for any India proxy.\n\n### Alphabet does NOT break out India-specific YouTube ad revenue\n\nThere is no India-specific YouTube revenue figure in Alphabet's filings; the company publishes no country-level YouTube breakdown, so every India figure is an external estimate.\n\nIndependent trade analysis (Exchange4media) states plainly that there is \"no official breakdown, no India-specific number in Alphabet's quarterly reports, and no public document that hints at the size of YouTube's Indian advertising revenue\" [7]. Alphabet's segment reporting groups Google advertising (including YouTube) without per-country YouTube splits [5]. This is the load-bearing caveat behind every India revenue assertion below.\n\n### Independent estimates put YouTube India ad revenue in the ~$1–2 billion range\n\nIndustry analysts estimate YouTube India's annual ad revenue at roughly $1–2 billion, with the caveat that this is modeled, not disclosed; ad revenue is estimated to be >90% of YouTube India's total, and 65–75% (≈70%) of that ad revenue is estimated to come from mobile.\n\nTrade-press synthesis reports analyst estimates in the $1–2 billion range and the ad-vs-subscription and mobile-vs-CTV splits as estimates derived from viewership data, explicitly labeling exact figures \"speculative\" because Google publishes no country numbers [7][8]. India's *total* digital ad market for FY2025 was ~Rs 49,000 crore (≈$6B), digital ~44% of a ~Rs 1.55 lakh crore total market [9][10] — so a $1–2B YouTube India figure would be a material but not dominant slice, consistent with order-of-magnitude sanity checks. The $1–2B band is best treated as the best available estimate, not a fact.\n\n---\n\n## 3. The creator economy — large, real, and Google-narrated\n\n> Throughout this section, the headline figures originate in YouTube's own \"Impact in India\" report (prepared with Oxford Economics) and Brandcast/blog communications. They are **promotional in purpose** — YouTube is making the case to advertisers, creators, and the Indian government that it is an economic good. They are not fabricated, but they are advocacy figures from a commissioned consultancy, and are read here accordingly.\n\n### YouTube paid >Rs 21,000 crore to Indian creators/artists/media over three years (YPP, 55% share)\n\nVia the YouTube Partner Program — which shares 55% of ad and subscription revenue with creators on long-form content — YouTube paid out more than Rs 21,000 crore to Indian creators, artists, and media companies over the three years to 2025.\n\nThis is stated in YouTube's official India blog (May 5, 2025, \"YouTube's India bet…\", attributed to CEO Neal Mohan) and the \"Impact in India\" report, and widely relayed (Business Standard, Storyboard18, Trak.in) [11][12][13]. The 55% YPP long-form revenue share is the standard global program rule [14]. The source is the platform itself — no independent audit of the payout total exists, so it is credible as a corporate claim but unverifiable as fact.\n\n### 65,000+ Indian channels earned over Rs 1 lakh in 2024\n\nMore than 65,000 Indian YouTube channels earned over Rs 1 lakh (≈$1,200) in 2024.\n\nThis comes from the \"Impact in India\" report (with Oxford Economics), released ~November 24, 2025, relayed by buzzincontent and Storyboard18 [15][16]. The same caveat applies: platform-supplied, consultancy-packaged. The May 2025 blog separately claimed 15,000+ Indian channels surpassed 1 million subscribers and 100M+ channels uploaded content in the prior year [11].\n\n### The \"Rs 16,000 crore GDP contribution\" and \"9.3 lakh FTE jobs\" claims\n\nYouTube's creative ecosystem contributed more than Rs 16,000 crore to India's GDP and supported over 9.3 lakh (≈930,000) full-time-equivalent jobs in 2024, per the Oxford Economics study.\n\nThis comes from the \"Impact in India\" report prepared by Oxford Economics for YouTube, Nov 2025 [15][16]. \"Economic contribution\" and \"FTE jobs supported\" figures from platform-commissioned consultancies use multiplier methodologies (direct + indirect + induced effects) that are inherently expansive and not externally audited; Oxford Economics has produced analogous YouTube reports for other markets using a consistent house methodology. The figure is best read as *YouTube's estimate of its own footprint*, not an independent national-accounts measurement. A 2023 predecessor Oxford/YouTube study claimed YouTube income \"financially secures over 700,000 creators in India,\" showing the report is a recurring promotional series, not a one-off [17].\n\n### Survey-based reliance claims (music labels, SMBs, media, primary income)\n\nPer the same report: 92% of music companies call YouTube an important revenue source (81% \"critical for breaking new artists\"); ~70% of SMBs report YouTube-attributed revenue growth; 63% of earning creators consider YouTube their primary income source.\n\nThese are self-reported survey responses commissioned by YouTube [15]; useful as evidence of *perceived reliance* and *position*, weaker as objective economic fact. The music-label reliance is independently plausible given T-Series' status as India's most-subscribed channel and Asia's largest music label [4].\n\n### The Rs 850 crore / $100M \"Creator Nation\" commitment\n\nYouTube committed US$100 million (≈Rs 850 crore) over two years (announced May 2025) to grow Indian creators, artists, and media partners.\n\nThis was announced on the official YouTube India blog, May 5, 2025 [11], relayed by Storyboard18 [16]. It is a *pledge* announced in May 2025; as of mid-2026 there is no independent confirmation of disbursement progress, so it is best treated as an announced commitment, not verified spend.\n\n---\n\n## 4. Shorts — the post-TikTok-ban surge and its weaker economics\n\n### Shorts launched in India weeks after the 2020 TikTok ban; India and the US are its two biggest markets\n\nIndia banned TikTok in June 2020; YouTube launched Shorts in beta in India in September 2020, and India and the US are now Shorts' two largest markets.\n\nThe TikTok ban (June 2020, national-security grounds) and the September 2020 India Shorts beta launch are documented [18][19]; Shorts reportedly hit 3.5 billion+ daily views within months of the India launch, and the US rollout followed in March 2021 [18]. India being the biggest market for both YouTube and Instagram (and the TikTok ban creating the opening) is well-reported [18]. The ban handed YouTube and Meta a creator and audience base that was already on-platform — which is why short-form money concentrated on YouTube/Meta in India rather than TikTok.\n\n### Shorts has 650M+ monthly logged-in viewers in India\n\nYouTube Shorts has over 650 million monthly logged-in viewers in India (as of June 2025).\n\nThis was announced at Brandcast 2025 (Sept 11, 2025) and in YouTube's India blog [20][21][22]. It is a YouTube-supplied figure; no independent verification of the precise 650M exists, but it is consistent with the ~491–518M total user base plus heavy Shorts engagement.\n\n### Shorts monetizes at a 45% creator revenue share vs 55% for long-form\n\nShorts ad revenue is pooled per-country into a Creator Pool and distributed by share of engaged views, with creators receiving 45% of the revenue share, versus 55% for standard long-form videos.\n\nYouTube's official Shorts monetization policy and program rules document the Creator Pool mechanic and the 45% Shorts vs 55% long-form share [23][14]. This is a current platform monetization rule.\n\n### Shorts RPM in India is a fraction of long-form (~Rs 5–30 vs ~Rs 50–200 per 1,000 views)\n\nIn India, Shorts generate roughly Rs 5–30 RPM (revenue per 1,000 views) versus roughly Rs 50–200 RPM for long-form — i.e., Shorts earn creators substantially less per view.\n\nMultiple India creator-economy explainers report Shorts RPM of Rs 5–30 vs long-form Rs 50–200, an ~5–10x gap [24][8]. RPM figures vary enormously by niche, language, season, and advertiser demand; these are illustrative ranges from creator-facing trade content, not audited data. The *direction* (Shorts << long-form per view) is robust and follows mechanically from the pooled model plus the 45% share [23]. The specific rupee bands are soft, and best treated as approximate.\n\n---\n\n## 5. The living-room pivot — \"YouTube is the new TV\"\n\n### YouTube reached 75M+ Indian adults (18+) on CTV by April 2025\n\nYouTube reached more than 75 million people aged 18+ in India on Connected TV in April 2025, and CTV is YouTube's fastest-growing screen in India.\n\nThis was announced at Brandcast 2025 (Sept 11, 2025) [20][21][22] and reiterated at APOS 2026 (June 17, 2026) [25]. YouTube claims top reach across CTV screens in India among media properties per Comscore data (May 2025) [26] — meaning the *reach-rank* has some independent (Comscore) backing even though the 75M absolute is YouTube-supplied.\n\n### The screen mix: still mobile-dominant but CTV rising fast\n\nIn H1 2025, Indians spent ~87% of YouTube time on mobile, ~11% on CTV, and ~2% on desktop; CTV is the fastest-growing screen and watch-time on CTV has grown sharply (one trade figure cites +219% YoY).\n\nThe screen-mix split is reported in trade analysis [27][7]; the +219% CTV-time growth figure appears in bestmediainfo coverage [28]. The screen split is consistent across sources; the 219% growth figure traces to Google/Brandcast-aligned data and should be read as promotional in origin. The structural point — mobile still dominates total time, CTV is where *growth* and *premium ad value* are — is well-supported.\n\n### Long-form and \"prime-time\" framing on the TV screen\n\nMore than half of YouTube watch time on the TV screen in India is now on videos longer than 21 minutes; YouTube positions itself as India's \"prime-time screen.\"\n\nThis comes from Brandcast 2025 and APOS 2026 messaging; \"more than 50% of TV watch time is on videos longer than 21 minutes\" [20][22], and Gunjan Soni (Country Managing Director, YouTube India): \"YouTube is now India's prime-time screen, where internet authenticity meets cinematic quality on the largest canvas in the home\" [25]. This is the rhetorical core of the \"new TV\" thesis — an explicit pitch to move TV ad budgets onto YouTube CTV inventory. It is best read as a commercial argument with data attached, not neutral analysis.\n\n### Comscore is rolling out independent YouTube CTV measurement in India\n\nComscore announced (Feb 20, 2025) an expansion of YouTube CTV viewership measurement to international markets including India (alongside Argentina, Brazil, Germany, Indonesia, Italy, Mexico, UK), and was reported to launch India measurement by end-2025.\n\nThe Comscore press release ran Feb 20, 2025 [26]; bestmediainfo reported the India launch targeted for end-2025 [29]. The Feb 2025 release lists India as *slated/planned*, and the end-2025 launch is a reported target. As of mid-2026 there is no independent confirmation that India CTV measurement is fully live in production — so it is best read as in-rollout. Independent CTV measurement maturing is itself a key 2025–2030 development: it could either validate or deflate YouTube's self-reported CTV reach. It is the antidote to the self-reporting problem, though its launch status remains a moving target.\n\n---\n\n## 6. Brandcast India, ad formats, and the commercial machine\n\n### Brandcast 2025 India was held September 11, 2025\n\nYouTube's flagship India advertiser upfront, Brandcast 2025, was held on/around September 11, 2025.\n\nThe YouTube India blog dated and described it as the flagship event [20][21]. Brandcast India is a recurring annual upfront; the 2025 edition is confirmed, while a 2026 edition is expected but not yet confirmed as of mid-2026.\n\n### New CTV/AI ad formats announced at Brandcast 2025\n\nBrandcast 2025 introduced Immersive Masthead on CTV (edge-to-edge homepage placement on the TV screen), Shoppable CTV (browse/buy from the big screen), Peak Points (Gemini-AI placement of ads at high-engagement moments, launching the following year), urban/rural geographic targeting (India-first), and a Creator Partnerships Hub in Google Ads.\n\nThese come from the YouTube India blog and Think with Google recaps [20][30][22]. They are *announcements*; Peak Points was explicitly \"launching next year\" (i.e., 2026), so its live status should be re-confirmed. Product announcements are claims about intent, not proof of in-market availability — the live status of each format should be re-confirmed.\n\n### Advertiser case studies presented at Brandcast (Acko, Myntra, Sebamed)\n\nYouTube presented advertiser results including Acko (40% YoY business growth with 82% lower media cost via CTV/Shorts/Demand Gen), Myntra (Shorts-first Big Fashion Festival reaching 19M users at 60% lower cost-per-reach), and Sebamed (2x sales uplift, 33% YoY brand-search lift via creator Partnership Ads).\n\nThese come from Brandcast 2025 materials and recaps [20][30][22]. They are vendor-supplied case studies — selected, favorable, and unaudited — and are best read as evidence of what YouTube markets, not as independently verified ROI.\n\n### Shopping/commerce and cricket as engagement engines\n\nYouTube reports 200M+ logged-in Indian users searched shopping-related content (shopping watch-time +250% YoY), and 190 billion cricket-related content views in 2025 (96% of surveyed Indian cricket viewers watched cricket on YouTube/Shorts).\n\nThese come from APOS 2026 statements by Gunjan Soni [25][31]. They are platform-supplied engagement metrics — useful as direction (commerce and cricket are major monetization vectors), unverifiable as precise counts. Cricket is independently the dominant Indian video category, so the *thrust* is credible.\n\n---\n\n## 7. Music, labels, and regional language — the content base\n\n### Music is YouTube India's gravitational center; T-Series anchors it\n\nMusic is the dominant consumption category on YouTube India, and T-Series — India's most-subscribed YouTube channel and Asia's largest music label — anchors the music ecosystem.\n\nMusic's dominance is reported across independent trade and statistics coverage [1][4]; T-Series' status as most-subscribed India channel and largest Asian label is well-documented [4]. The music-industry reliance on YouTube (92% of labels calling it an important revenue source) reinforces a structural dependency: Indian recorded-music monetization runs substantially through YouTube [15][4].\n\n### Regional-language content and dedicated charts\n\nYouTube India consumption is overwhelmingly in regional languages; YouTube launched year-end music charts for six high-volume languages (Bhojpuri, Haryanvi, Hindi, Punjabi, Tamil, Telugu), and multilingual simultaneous releases (Hindi/Tamil/Telugu/Kannada) are now standard for trailers and creator launches.\n\nMusic Ally and trade coverage of YouTube's 2025 India music charts and regional hits (Marathi, Bundeli appeared in the top ten) document this [4]; multilingual release patterns are reported in the same coverage [4]. Regional-language depth is the structural reason YouTube's India reach exceeds any single-language platform's.\n\n---\n\n## 8. Subscriptions — the second monetization layer\n\n### YouTube Premium (~Rs 149) and Premium Lite (~Rs 89) are live in India\n\nYouTube Premium is priced at ~Rs 149/month in India; YouTube launched Premium Lite at Rs 89/month in India in late September 2025 — a cheaper, ad-free-for-most-videos tier (no background play, no offline, no YouTube Music, ads still on Shorts/music/search).\n\nThe official YouTube India blog and reporting (Business Standard, Digit, Croma) dated September 29, 2025 cover the Premium Lite launch at Rs 89 [32][33]. The Rs 149 standard Premium price is reported alongside [32]. The Premium Lite launch is dated and recent (Sept 2025), and described at launch as rolling out gradually — broad availability should be assumed but the precise price is subject to change. Subscriptions are estimated at <10% of YouTube India revenue [8], but Premium Lite is a deliberate move to monetize price-sensitive Indian users who won't pay Rs 149.\n\n---\n\n## 9. Synthesis — what YouTube India means for the ad market through 2030\n\nYouTube in India is best understood as three overlapping businesses sitting on one audience: a **long-form ad business** (the historic core, mobile-dominant, ~$1–2B estimated, 55% creator share), a **short-form engagement engine** (Shorts — huge reach, weaker per-view economics, the post-TikTok-ban inheritance, 45% creator share), and an **emergent living-room TV business** (CTV — fastest-growing, highest premium-ad potential, the explicit 2025–2030 land-grab on traditional-TV budgets). The competitive frame: YouTube's chief India rivals for video ad money are Meta (Instagram Reels, 362M+) on short-form and JioStar/JioHotstar on premium streaming/CTV — the latter being the more direct threat as YouTube pushes its \"new TV\" thesis into the same living room JioStar serves with cricket and entertainment.\n\nThe two analytical hazards for anyone forecasting from here: (1) **the revenue opacity** — never state an India YouTube revenue figure as fact; the $1–2B band is a triangulated estimate and the only Alphabet-disclosed anchor is the global $60B (2025) figure; and (2) **the promotional-data dependency** — the most quotable India numbers (75M CTV, 650M Shorts, Rs 16,000 cr GDP, Rs 21,000 cr payouts, 72 min/day) all originate with YouTube/Brandcast/Oxford-Economics-for-YouTube and must be read as advocacy. The single most important *independent* development to watch is Comscore's India YouTube CTV measurement maturing — it is the mechanism by which the \"new TV\" claim either gets verified into a buyable currency or gets discounted as vendor marketing.\n\n---\n\n## Open Questions\n\n1. **What is YouTube India's actual ad revenue?** No disclosed figure exists; the $1–2B estimate is soft. A credible independent triangulation (India digital-video ad pool × YouTube share-of-time × monetization rate) would materially sharpen the picture.\n2. **Is Comscore's India YouTube CTV measurement fully live in production as of mid-2026, and what does it say?** The Feb 2025 release listed India as planned; end-2025 was a reported target. Live status and first independent reach numbers are unconfirmed as of mid-2026.\n3. **How much of YouTube India's revenue is CTV vs mobile in money terms (not time)?** The 87/11/2 split is *time*; CTV likely over-indexes on revenue due to higher CPMs, but no figure was found.\n4. **What is the disbursement progress on the $100M / Rs 850 crore \"Creator Nation\" commitment?** Announced May 2025; no spend confirmation found.\n5. **Is Peak Points (and Shoppable CTV) actually live in India in 2026?** Announced at Brandcast 2025 as forthcoming; live status unconfirmed.\n6. **How does the DPDP Act 2023 + 2025 Rules affect YouTube's ad targeting/measurement in India?** Taken up in the chapter on regulation, measurement, and trust; it is directly load-bearing on YouTube's addressable-targeting roadmap (e.g., the new urban/rural targeting).\n7. **What is the independent (non-Google) basis, if any, for the Oxford Economics Rs 16,000 cr GDP figure?** The methodology is not externally audited.\n\n---\n\n## Sources\n\n1. \"YouTube Users in India / India YouTube Statistics 2025\" (DataReportal / We Are Social-derived ad-planning data, repackaged by statistics aggregators incl. GrabOn, The Global Statistics). Early 2025. Tier 2/5 (Google ad-planner data via third parties). Accessed 2026-06-17. — India ~491M users, demographics, regional-language consumption.\n2. DataReportal / We Are Social, \"Digital 2026: India\" and \"Essential YouTube Stats.\" 2026. https://datareportal.com/reports/digital-2026-india ; https://datareportal.com/essential-youtube-stats . Tier 5 (analytical, Google-data-sourced). Accessed 2026-06-17. — India largest YouTube ad audience; user growth.\n3. Statista, \"YouTube ad reach by country 2026\" / \"Number of monthly unique YouTube users.\" 2026. https://www.statista.com/statistics/280685/number-of-monthly-unique-youtube-users/ . Tier 5 (data aggregator). Accessed 2026-06-17. — ~518M India ad audience 2026; 2029 projection.\n4. Music Ally, \"25 insights about India's music industry in 2025,\" Dec 18, 2025. https://musically.com/2025/12/18/25-insights-about-indias-music-industry-in-2025/ ; BW Marketing World, \"YouTube Emerges As India's New Cultural Language In 2025.\" Tier 5 (specialist trade). Accessed 2026-06-17. — music dominance, T-Series, regional-language charts.\n5. Variety, \"YouTube Revenue for Full-Year 2025 Topped $60 Billion,\" Feb 2026. https://variety.com/2026/digital/news/youtube-2025-total-revenue-ads-subscriptions-alphabet-earnings-1236652260/ . Tier 5 (trade, relaying Tier 1 Alphabet filing). Accessed 2026-06-17. — first-ever YouTube total revenue disclosure.\n6. Tubefilter, \"Alphabet reveals YouTube revenue for first time: $60 billion in 2025,\" Feb 5, 2026. https://www.tubefilter.com/2026/02/05/alphabet-q4-2025-youtube-earnings-revenue-60-billion/ . Tier 5 (trade, off Alphabet filing). Accessed 2026-06-17. — $60B total, $40.37B ads, $11.4B Q4 ads, disclosure history.\n7. Exchange4media, \"Breaking down YouTube India revenues: Mobile leads, CTV catches up,\" 2025. https://www.exchange4media.com/digital-news/breaking-down-youtube-india-revenues-mobile-leads-ctv-catches-up-144240.html (note: direct fetch returned 403; relied on search-surfaced summary + corroborating coverage). Tier 4/5 (India trade press). Accessed 2026-06-17. — no India breakdown exists; mobile 65–75% of ad revenue; ad >90% of total.\n8. Trade/creator-economy synthesis (upGrad, sevafunds, newswriters) on YouTube India earnings and revenue composition, 2025–2026. Tier 5/6 (creator-facing explainers). Accessed 2026-06-17. — $1–2B estimate band; ad vs subscription split; RPM ranges. (Soft tier — used only for estimate ranges, flagged.)\n9. CRISIL, \"Digital media scooped ~46% of India's Rs 1 lakh crore+ ad spend,\" Aug 2025. https://www.crisil.com/.../digital-media-scooped-46percent... . Tier 2/5 (ratings agency analysis). Accessed 2026-06-17. — India total ad market and digital share context.\n10. Outlook Business / industry reports, \"Indian Digital Ad Market Likely to Double to $22 Bn by 2030\"; Statista India digital ad-spend series. 2025–2026. Tier 5. Accessed 2026-06-17. — ~Rs 49,000 cr / ~$13.22B 2025 digital, 2029–2030 projections.\n11. YouTube/Google official blog (India), \"YouTube's India bet: INR 21,000 crore paid out… INR 850 crore commitment,\" attributed to Neal Mohan, May 5, 2025. https://blog.google/intl/en-in/products/platforms/youtubes-india-bet-inr-21000-crore-paid-out-to-indian-creators-commits-inr-850-crores-to-power-indias-creator-nation/ . Tier 1 (corporate, PROMOTIONAL). Accessed 2026-06-17. — Rs 21,000 cr payouts; 15,000+ channels >1M subs; 100M+ uploading channels; $100M/Rs 850 cr commitment; 45B intl watch hours; Modi 25M+ subs.\n12. Business Standard, \"YouTube paid ₹21,000 crore to Indian creators over the last three years,\" May 1, 2025. https://www.business-standard.com/entertainment/youtube-paid-21-000-crore-to-indian-creators-over-the-last-three-years-125050100859_1.html . Tier 4 (major Indian outlet, relaying YouTube). Accessed 2026-06-17.\n13. Trak.in, \"YouTube Paid Rs 21,000 Crore To Indi
