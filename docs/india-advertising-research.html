r 5 (trade). Accessed 2026-06-17. — three-lever strategy; CTV fastest-growing; 75M+; Gunjan Soni \"prime-time screen\" quote; 200M shopping searchers; 190B cricket views; 96% cricket viewers.\n26. Comscore, \"Comscore Expands YouTube CTV Viewership Measurement to International Markets,\" Feb 20, 2025. https://www.comscore.com/Insights/Press-Releases/2025/2/Comscore-Expands-YouTube-CTV-Viewership-Measurement-to-International-Markets . Tier 1/2 (measurement firm press release — claim of intent). Accessed 2026-06-17. — India slated for rollout; markets list; person-level CTV metrics.\n27. Storyboard18, \"How CTV emerged as a leader in 2025 and took control of India's video economy.\" 2025. https://www.storyboard18.com/digital/how-ctv-emerged-as-a-leader-in-2025-and-took-control-of-indias-video-economy-86542.htm . Tier 5 (India ad-trade). Accessed 2026-06-17. — screen mix 87/11/2 (H1 2025); living-room shift.\n28. bestmediainfo, \"Social's new prime time is TV: YouTube CTV time up 219% in India.\" 2025. https://bestmediainfo.com/insights/socials-new-prime-time-is-tv-youtube-ctv-time-up-219-in-india-10445366 . Tier 5 (India trade, Google-data-origin). Accessed 2026-06-17. — +219% CTV time (promotional-origin, flagged).\n29. bestmediainfo, \"Comscore to launch YouTube CTV measurement in India by the end of 2025.\" 2025. https://bestmediainfo.com/mediainfo/mediainfo-digital/comscore-to-launch-youtube-ctv-measurement-in-india-by-the-end-of-2025-9298367 . Tier 5. Accessed 2026-06-17. — India CTV measurement targeted end-2025.\n30. Influencer Marketing Hub, \"YouTube's Latest Ad Innovations from BrandCast 2025: Peak Points, Shoppable TV, and More.\" 2025. https://influencermarketinghub.com/youtube-ad-innovations-from-brandcast/ . Tier 5/6. Accessed 2026-06-17. — Shoppable CTV, Peak Points (Gemini), Immersive Masthead details.\n31. Social Samosa, \"200 mn users searched for shopping content on YouTube in India, says Gunjan Soni.\" 2026. https://www.socialsamosa.com/industry-updates/200-mn-users-searched-shopping-content-youtube-india-gunjan-soni-12048501 . Tier 5 (India trade). Accessed 2026-06-17. — shopping engagement figures (YouTube-sourced).\n32. YouTube/Google official blog (India), \"YouTube Premium Lite Arrives in India,\" Sept 29, 2025. https://blog.google/intl/en-in/products/platforms/youtube-premium-lite-arrives-in-india/ ; Business Standard, \"YouTube launches Premium Lite plan in India at ₹89,\" Sept 29, 2025. https://www.business-standard.com/technology/tech-news/youtube-launches-premium-lite-plan-in-india-at-89-per-month-what-s-new-125092900643_1.html . Tier 1 + Tier 4. Accessed 2026-06-17. — Premium Rs 149, Premium Lite Rs 89, feature differences.\n33. Digit / Croma Unboxed, YouTube Premium Lite India launch coverage, Sept 2025. https://www.digit.in/news/apps/youtube-premium-lite-launched-in-india-at-rs-89-benefits-validity-and-more.html . Tier 5. Accessed 2026-06-17.\n34. Storyboard18, \"Indian adults spend over 72 minutes a day on YouTube, overtaking TV,\" Sept 12, 2025. https://www.storyboard18.com/digital/indian-adults-spend-over-72-minutes-a-day-on-youtube-overtaking-tv-80834.htm . Tier 5 (India trade, relaying YouTube Brandcast PROMOTIONAL survey). Accessed 2026-06-17. — 72 min/day; 87% daily-preference vs TV/VOD (no independent corroboration)."}, {"order": 5, "file": "05_Regulation_Measurement_Trust.md", "title": "Regulation, Measurement & Trust — The Cross-Cutting Layer of Indian Advertising", "summary": "", "body": "# Regulation, Measurement & Trust — The Cross-Cutting Layer of Indian Advertising\n\n## Bottom Line\n\nIndia's advertising market is being reshaped less by a new ad format than by a new legal floor under it. The Digital Personal Data Protection (DPDP) Rules, 2025 — notified in the Official Gazette dated **13 November 2025** (Gazette notification G.S.R. 846(E)), with the first set of commencement provisions taking effect **14 November 2025** — give India its first operational privacy regime, and they land on an industry whose growth engines (programmatic CTV, YouTube, retail media) all depend on the very behavioral data the law restricts. The Rules phase in over roughly 18 months: the Data Protection Board provisions came alive immediately, Consent Manager registration switches on around November 2026, and the bulk substantive obligations — notice, consent, breach reporting, security safeguards, data-principal rights, and the children's-data regime — become effective around **13–14 May 2027** (sources differ by a day depending on whether the count runs from the gazette date or the publication date). The single most consequential provision for adtech is Section 9 of the Act read with Rule 10: an absolute prohibition on tracking, behavioral monitoring, and targeted advertising directed at children (anyone under 18), plus mandatory verifiable parental consent — with narrow carve-outs for healthcare, education, and real-time child-safety location tracking. This pushes the entire ecosystem toward first-party data, consent infrastructure, and contextual targeting at the same moment Google has *abandoned* third-party-cookie deprecation in Chrome (April 2025), leaving India to build its own identity stack rather than inherit a Privacy-Sandbox future. Running underneath all of this is a measurement vacuum: there is still no single cross-platform \"currency\" reconciling linear TV, CTV, mobile, and desktop. BARC India's cross-media pilot with Nielsen (reported live as of February 2026, JioStar/JioHotstar as anchor) is the leading attempt, but a true unified reach metric is years out — even as CTV ad spend races toward roughly ₹8,000 crore by 2026. The result is a structural tension worth holding onto: CTV is growing far faster than the industry's ability to measure it cleanly or verify it for fraud (India saw a reported ~110% year-over-year jump in CTV fraud-filter rates), which keeps money flowing into walled gardens (Google, Meta, Amazon capture an estimated 70–80% of programmatic spend) precisely because they offer closed-loop measurement the open web cannot match.\n\n---\n\n## 1. The DPDP Act and Rules — India's Privacy Floor\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 300\" role=\"img\" aria-label=\"The DPDP phased compliance schedule: notified 13 November 2025 with the Data Protection Board immediate; Consent Manager registration and enforcement powers around November 2026; full bulk obligations including the children's-data regime around 13-14 May 2027.\">\n<text x=\"350\" y=\"28\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THE REGULATORY FLOOR<\/text>\n<text x=\"350\" y=\"46\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">India's DPDP Rules phase in over ~18 months to a 2027 compliance cliff<\/text>\n<line x1=\"90\" y1=\"120\" x2=\"610\" y2=\"120\" class=\"ln\" stroke-width=\"2\"/>\n<circle cx=\"110\" cy=\"120\" r=\"7\" class=\"f-t4\"/>\n<line x1=\"110\" y1=\"120\" x2=\"110\" y2=\"86\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"110\" y=\"78\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">13 Nov 2025<\/text>\n<text x=\"110\" y=\"148\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">Rules notified<\/text>\n<text x=\"110\" y=\"161\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">Data Protection Board<\/text>\n<circle cx=\"350\" cy=\"120\" r=\"7\" class=\"f-t1\"/>\n<line x1=\"350\" y1=\"120\" x2=\"350\" y2=\"86\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"78\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">~Nov 2026<\/text>\n<text x=\"350\" y=\"148\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">Consent Managers register<\/text>\n<text x=\"350\" y=\"161\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">enforcement powers switch on<\/text>\n<circle cx=\"590\" cy=\"120\" r=\"9\" class=\"f-t2\"/>\n<line x1=\"590\" y1=\"120\" x2=\"590\" y2=\"82\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"590\" y=\"74\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">~13–14 May 2027<\/text>\n<text x=\"590\" y=\"148\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">full compliance cliff<\/text>\n<rect x=\"120\" y=\"196\" width=\"460\" height=\"64\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"120\" y=\"196\" width=\"9\" height=\"64\" class=\"f-t2\"/>\n<text x=\"146\" y=\"216\" font-size=\"11\" font-weight=\"bold\">The provision that bites adtech hardest<\/text>\n<text x=\"146\" y=\"234\" font-size=\"9.8\" class=\"t-muted\">Effectively absolute ban on behavioural tracking + targeted ads to anyone under 18,<\/text>\n<text x=\"146\" y=\"248\" font-size=\"9.8\" class=\"t-muted\">plus verifiable parental consent — penalties up to ₹200 crore. (Section 9 + Rule 10.)<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> India's first operational privacy regime arrives on a ~18-month clock: notified 13 November 2025, consent-manager and enforcement machinery around November 2026, and the real compliance cliff — notice, consent, and the children's-data regime — around 13–14 May 2027. Because the children's provision is read as an absolute bar on behavioural targeting of under-18s, India's young, video-heavy platforms face a binary: reliably wall off minors, or drop behavioural targeting on youth-heavy inventory. (Shardul Amarchand Mangaldas; S.S. Rana &amp; Co.; Bar &amp; Bench; EY India; statute text.)<\/figcaption>\n<\/figure>\n\n\n### 1.1 What was passed, and when\n\nThe **Digital Personal Data Protection Act, 2023** received Presidential assent in August 2023, but it was a framework statute — it created obligations in outline and left the operational detail (\"as may be prescribed\") to subordinate rules. For more than two years the Act sat largely dormant: enforceable in principle, un-operational in practice, because the Rules that would give it teeth had not been notified. Draft Rules were released for consultation on 3 January 2025 [1][2].\n\nThe finalized **Digital Personal Data Protection Rules, 2025** were notified by the Ministry of Electronics and Information Technology (MeitY) in the Official Gazette via notification **G.S.R. 846(E), dated 13 November 2025** [2][3].\n\n### 1.2 Resolving the \"Nov 13 vs Nov 14\" discrepancy\n\nSources conflict between 13 and 14 November 2025. Across multiple law-firm analyses, the picture is this, and it is worth stating precisely because the dating cascades into the 2027 deadline:\n\n- The **gazette notification itself is dated 13 November 2025** (G.S.R. 846(E)). Shardul Amarchand Mangaldas, S.S. Rana & Co., and Bar & Bench all cite the notification as \"dated November 13, 2025\" [2][3][4].\n- Several other analyses describe the **commencement/effective dates** as a sequence of **14 November 2025, 14 November 2026, and 14 May 2027** [1]. One Shardul Amarchand summary explicitly frames the *publication* date and *immediate commencement* as 14 November 2025 [1].\n- The reconciliation: the gazette document is *dated* 13 November; the first commencement provisions take effect on (or are published on) **14 November 2025**, with the 12-month and 18-month milestones counted forward from there. The one-day spread in the May 2027 deadline (13 vs 14 May 2027) is the same artifact — counting 18 months from 13 November lands on 13 May 2027; counting from 14 November lands on 14 May 2027 [1][3][5].\n\nIn short: the DPDP Rules, 2025 were notified by gazette **dated 13 November 2025**; the first tranche of provisions commenced on/around **14 November 2025**; full bulk compliance obligations become effective on/around **13–14 May 2027**, with the one-day variance noted above.\n\n### 1.3 The phased compliance schedule\n\nThe Rules deliberately avoid a single big-bang enforcement date. Instead [1][5][6]:\n\n- **Immediate (from ~14 November 2025):** commencement provisions, establishment of the Data Protection Board of India (DPBI), and consequential amendments to related laws.\n- **~12 months (around November 2026):** registration of **Consent Managers** and the DPBI's enforcement and investigation powers switch on.\n- **~18 months (around 13–14 May 2027):** the core obligations — privacy notice, consent, breach reporting, security safeguards, data-principal rights, grievance redressal, and the children's-data regime — become enforceable. This is the date the industry treats as the real compliance cliff.\n\nThis ~18-month runway is intentional: it gives Data Fiduciaries (the law's term for entities that determine how personal data is processed — i.e., publishers, platforms, brands, adtech vendors) time to rebuild consent capture, retire non-compliant tracking, and stand up the consent-manager plumbing.\n\n### 1.4 Consent: the operational core\n\nThe DPDP regime is consent-first. Consent must be **free, specific, informed, unconditional, and unambiguous, with a clear affirmative action**, and as easy to withdraw as to give — the law contemplates one-click withdrawal. Notices must be provided in plain language and made available in English and the 22 languages of the Eighth Schedule of the Constitution [1][6][7]. For adtech this is a material change: bundled, pre-ticked, or buried consent — long the default for ad personalization and cross-site tracking — does not survive the standard.\n\nThe Rules also create a **Consent Manager** institution: a registered intermediary (registration opening ~November 2026) through which data principals can give, manage, review, and withdraw consent across fiduciaries, and which must resolve grievances within 90 days [3][6]. Whether consent managers become a genuine clearinghouse for ad-consent or a compliance formality is an open question (see Open Questions).\n\n### 1.5 Children: the provision that bites adtech hardest\n\n**Section 9 of the DPDP Act, read with Rule 10 of the 2025 Rules, is the single most consequential provision for the advertising industry.** It imposes what practitioners call a \"triple lock\" on children's data — children defined as anyone **under 18**, a notably high threshold by global standards [7][8]:\n\n1. **Verifiable parental/guardian consent** is mandatory before processing any child's personal data. Approved verification methods include identity verification of the parent as an identifiable adult, with the Rules contemplating mechanisms such as integration with government identity infrastructure (e.g., DigiLocker) [5][7].\n2. **Absolute prohibition on tracking and behavioral monitoring** of children — covering cookie-based tracking, device fingerprinting, location tracking, activity monitoring, and cross-site tracking [8].\n3. **Absolute prohibition on targeted advertising directed at children** — including interest-based ads, retargeting, lookalike-audience targeting, and demographic profiling for ad delivery [8].\n\nCrucially, prohibitions (2) and (3) are described by analysts as **absolute** — they apply even where a parent consents and even where the targeting is core to a platform's business model [8]. (This is an analytical characterization of the statute; the precise operational scope will be tested in enforcement.)\n\n**The carve-outs.** The Rules exempt certain classes of fiduciaries and purposes from some children's obligations. The notified exemptions include processing for **healthcare**, **educational services**, and **real-time tracking of a child's location for her safety** [1][5]. The common framing — \"except essential services: healthcare/education/real-time safety\" — is confirmed by the AMSS analysis [1].\n\n**What this means for the industry.** Platforms with significant under-18 audiences — and India's YouTube, gaming, and short-video ecosystems skew young — face a binary: either reliably distinguish and wall off under-18 users (hard, given India's thin age-verification infrastructure) or forgo behavioral targeting against any user who might be a minor. The penalty for breach of the children's-data obligations runs up to **₹200 crore** [8]. The practical effect pushes toward age-assurance systems, contextual (non-behavioral) ad serving for youth-heavy inventory, and first-party logged-in environments where age can be asserted.\n\n### 1.6 Penalties and the enforcement body\n\nThe DPDP Act's Schedule sets graduated financial penalties. The headline figures: up to **₹250 crore** for failure to implement reasonable security safeguards (Section 8(5)); up to **₹200 crore** for failure to notify the Board or data principals of a breach (Section 8(6)) and for breach of children's-data obligations [8][9]. These penalty provisions become effective with the ~May 2027 tranche [9].\n\nEnforcement sits with the **Data Protection Board of India (DPBI)**, an adjudicatory body constituted under the Rules, with its establishing provisions made effective immediately on notification [9]. As of mid-2026, the Board exists in law from November 2025; its full investigative and penalty powers phase in with the later tranches.\n\n### 1.7 Cross-border data and localization\n\nThe DPDP Act takes a comparatively liberal \"blacklist\" (negative-list) approach to cross-border transfers: personal data may flow to any country *except* those the Central Government specifically restricts [10][11]. As of mid-2026, **the government had not published any list of restricted jurisdictions**, so transfers to all countries remained permissible [10]. This matters for global adtech: India did not, in the notified Rules, impose the hard data-localization mandate some had feared, which leaves room for global DSPs, measurement vendors, and cloud-based identity graphs to operate — subject to consent and security obligations. (One caveat: the absence of a restricted-jurisdiction list is a *present* status that could change by executive notification.)\n\n---\n\n## 2. Third-Party Cookies, First-Party Data, and India's Identity Response\n\n### 2.1 The global reversal\n\nFor most of the 2020s the adtech industry planned around the death of the third-party cookie in Chrome. That plan collapsed. In **April 2025, Google announced it would not roll out a separate prompt for third-party-cookie deprecation in Chrome and would effectively keep third-party cookies in place**, leaving users to manage preferences through existing Chrome settings — a reversal of years of Privacy Sandbox messaging [12][13].\n\n### 2.2 Why this matters specifically for India\n\nThe reversal has a paradoxical effect in India. Even though Chrome will *keep* third-party cookies, India's own regulatory trajectory — DPDP's consent standard and the children's-data prohibitions — pushes the market toward a post-third-party-data posture *regardless of what Google's browser does*. In other words, India's privacy pressure is now statutory and domestic, not inherited from a browser vendor's roadmap.\n\nThe market response, per trade reporting, is a pivot to **first-party data, telecom/operator partnerships, data clean rooms, server-side tagging, contextual AI targeting, and universal/alternative IDs** [12][14]. Publishers increasingly treat first-party data as the primary monetization asset; one industry survey cited 85% of publishers expecting first-party data's monetization role to grow in 2026 [12].\n\n### 2.3 The walled-garden gravity well\n\nHere the regulatory and identity story converges with market structure. Because the **walled gardens (Google, Meta, Amazon) own logged-in, consented first-party relationships at scale**, they are structurally advantaged by a privacy regime that prizes exactly those assets. Redseer-cited analysis estimates walled gardens capture **70–80% of programmatic ad spend** even though users spend the majority of their time on the open internet [15][16]. In a DPDP world that makes open-web behavioral targeting harder and consent more expensive to obtain, the gardens' advantage compounds: they already have the consent surface, the identity, and the closed-loop measurement.\n\n---\n\n## 3. Measurement — The Currency Problem\n\n### 3.1 BARC and the legacy of the linear panel\n\nThe **Broadcast Audience Research Council (BARC India)** is the industry's joint-industry body for television audience measurement, owned by broadcaster, advertiser, and agency bodies. For years its panel-based linear-TV ratings have been *the* currency for TV trading. The structural problem: that panel was built for linear television and does not natively measure connected-TV, mobile streaming, or desktop video on a comparable, deduplicated basis [17][18].\n\n### 3.2 The push to cross-platform\n\nUnder direction from the Ministry of Information & Broadcasting to incorporate connected-TV viewership into ratings, and under competitive pressure from a market where streaming is eating viewing, BARC has moved to build a **cross-media / cross-platform measurement framework** [17][19].\n\nThe leading initiative is a **BARC–Nielsen cross-media pilot**, reported as actively underway as of **February 2026**, using Nielsen's digital trackers and deduplication methodology to produce a single, unified view of audiences across linear TV, CTV, and mobile, beginning with advertising exposure during live events [19][20]. JioStar/**JioHotstar** is the anchor platform, with **IPL 2026** positioned as the major real-world test [17][20].\n\nTrade reporting also references a tool branded \"**BARC | Nielsen ONE Ads**\" combining BARC's TV panel with Nielsen's digital/CTV data for deduplicated reach, frequency, and GRPs, with JioHotstar as first adopter [17]. The exact branding and launch status across sources is not perfectly consistent (one detailed pilot writeup did not mention the \"ONE Ads\" brand), so the *branding* remains uncertain while the *underlying BARC–Nielsen cross-media effort* is multiply attested [17][19][20].\n\n### 3.3 The substantive finding: incremental reach\n\nOne genuinely important measurement result, surfaced in these pilots: cross-platform audience **duplication between TV and digital stayed below ~10%** (and a JioStar/Nielsen IPL study found **<5%** overlap for ad views) — meaning TV and streaming audiences are largely *distinct*, and integrated planning delivers real incremental reach rather than re-hitting the same viewers [17][20]. This is the empirical case for cross-media currency: if the audiences barely overlap, you cannot plan or de-duplicate them with separate single-medium tools. (These figures are pilot-specific, not census-wide.)\n\n### 3.4 The honest state of play: no unified currency yet\n\nDespite the activity — BARC, Nielsen, and TAM are all named as racing to fill the gap [21] — there is **no single, adopted cross-platform measurement currency** in India today. Trade analysis is blunt that a *true* cross-platform unified-reach metric is **years away** (one estimate: at least five years; meaningfully expanded BARC streaming coverage not before ~2027) [18]. This is the measurement lag at the heart of this account.\n\n---\n\n## 4. Ad Fraud, Invalid Traffic, and Brand Safety\n\n### 4.1 The CTV fraud surface\n\nConnected TV is structurally vulnerable to invalid traffic (IVT): server-side ad insertion (SSAI) obscures device-level signals, OEMs expose inconsistent data, and many ad-supported (AVOD) platforms are reluctant to share log-level data — leaving buyers with limited transparency on what they actually bought [22].\n\nThe numbers, from independent verification vendors:\n\n- Pixalate's Q3 2025 global benchmarks put **CTV IVT at ~19%**, web IVT at ~21%, and mobile-app IVT at ~33% [23].\n- DoubleVerify (DV) reported India experiencing a **~110% year-over-year increase in CTV fraud/SIVT filter rates**, driven primarily by bot fraud [22].\n- India-specific audit analysis cited by trade press estimated **~7–8% of CTV ad spend delivered no working value** (across IVT, unviewable, and unmeasurable impressions) — i.e., roughly ₹90–97 of every ₹100 reached real addressable opportunity [22].\n\n### 4.2 Brand safety and the transparency gap\n\nThe ROI gap widened in **open-auction environments with poor device transparency** — where ROI reportedly dropped 10–30% versus buys using log-level data and controlled supply paths [22]. India sits on the more opaque end of the spectrum for device-level data. This is a direct mechanism feeding the walled-garden preference (Section 2.3): the gardens' closed loops sidestep the open-auction transparency problem.\n\n### 4.3 The verification standard\n\nThe industry standard for trustworthy measurement is **MRC (Media Rating Council) accreditation** for SIVT (sophisticated invalid traffic) detection across environments. **DoubleVerify is MRC-accredited for IVT detection across desktop, mobile web, mobile apps, and CTV** [22]. (DV's accreditation status is a present-tense fact as of 2025 and could change.) The presence of accredited third-party verification, and brands' growing insistence on it, is the trust mechanism the market is reaching for to close the verification lag.\n\n---\n\n## 5. IT Rules, Influencer Disclosure, and ASCI\n\n### 5.1 The layered content/advertising regime\n\nBeyond DPDP (data) sits a separate stack governing *advertising content* and *intermediary conduct*:\n\n- The **Information Technology (Intermediary Guidelines and Digital Media Ethics Code) Rules, 2021** (\"IT Rules 2021\") extend oversight to digital media and OTT platforms; in February 2025 the Ministry of Information & Broadcasting issued an advisory pressing OTT platforms and self-regulatory bodies on adherence [24].\n- The **Consumer Protection Act, 2019** and the **CCPA Guidelines for Prevention of Misleading Advertisements and Endorsements, 2022** (gazetted 9 June 2022) apply to all advertisements regardless of medium, and give the Central Consumer Protection Authority (CCPA) statutory teeth — fines and endorsement bans [24][25].\n\n### 5.2 ASCI's role and standing\n\nThe **Advertising Standards Council of India (ASCI)** is the self-regulatory body. Its Code gained a statutory flavor when Rule 7(9) was inserted into the Cable Television Networks Rules, 1994 (under the Cable Television Networks (Regulation) Act, 1995), making ASCI standards binding on TV advertisements [25]. ASCI's reach now spans digital and influencer advertising.\n\n### 5.3 Influencer disclosure\n\nASCI's **Guidelines for Influencer Advertising in Digital Media** (introduced 17 August 2023, updated through 2025) require clear, prominent, upfront disclosure of any \"material connection\" between influencer and advertiser, using labels such as #ad, #sponsored, #paidpartnership, #collaboration [26][27]. The format rules are specific: on video, disclosures must be on-screen long enough to be noticed (e.g., at least 3 seconds for ≤15-second videos; one-third of the duration for 15-second-to-2-minute videos; full duration where the brand is discussed for >2-minute videos) [27].\n\n**2025 update:** in April 2025 ASCI tightened rules for the **health and finance (BFSI)** sectors, requiring influencers giving technical advice to hold and disclose relevant qualifications/certifications [28][29].\n\n**Enforcement scale:** ASCI processed **1,409 influencer violations through November 2025, with ~94% involving disclosure failures** [26]. The CCPA can layer statutory penalties on top — fines reportedly up to ₹50 lakh and endorsement bans up to 3 years [26].\n\n---\n\n## 6. The Central Tension — Growth Outrunning Trust Infrastructure\n\nThe throughline here is a timing mismatch. Three things are happening at once:\n\n1. **CTV (and digital video broadly) is growing fast.** CTV ad spend is projected at roughly **₹2,300–2,500 crore in 2025** rising toward **~₹8,000 crore by 2026** (≈USD ~1 billion), against 50–60 million CTV households by end-2025 [30][31]. (These are Pitch Madison / GroupM / Madison forecasts, and the figures vary by source and definition.)\n2. **Measurement cannot yet keep up.** No unified cross-platform currency exists; BARC–Nielsen's pilot is live but a true metric is years out (Section 3).\n3. **Verification cannot yet keep up.** CTV IVT runs ~19% globally with a reported ~110% YoY fraud-rate jump in India, in an opaque device environment (Section 4).\n\nLayer DPDP on top — restricting behavioral targeting, banning it outright for under-18s, and raising the cost of open-web consent — and the equilibrium becomes legible: money concentrates in **walled gardens** that already have consent, identity, and closed-loop measurement, while the **open web** carries both the fraud risk and the measurement gap. The regulatory regime, the measurement vacuum, and the fraud surface are not three separate stories; they are one structural pressure pushing Indian ad spend toward logged-in, first-party, closed environments — at the very moment open programmatic CTV is supposed to be the growth frontier. Resolving this requires the trust infrastructure (cross-media currency + accredited verification + workable consent plumbing) to mature faster than it is currently maturing. Whether it does is the 2027–2030 question.\n\n---\n\n## Open Questions\n\n1. **Will the May 2027 deadline hold, or slip?** India's privacy timeline has slipped before (the Act sat un-operational from 2023 to late 2025). Whether the ~13–14 May 2027 full-compliance date survives is uncertain.\n2. **How will \"verifiable parental consent\" actually work at India scale?** The Rules gesture at DigiLocker-style verification, but India lacks robust, universal age-assurance. The operational mechanism — and whether youth-heavy platforms can comply without excluding minors entirely — is unresolved.\n3. **Is the children's-targeting ban truly \"absolute\"?** Analysts characterize Section 9(3) as absolute, but the carve-outs (healthcare/education/safety) and the \"as may be prescribed\" exemption power leave room for the scope to be narrowed or contested in enforcement and litigation.\n4. **Will a cross-platform currency actually get adopted, or just piloted?** BARC–Nielsen, TAM, and Nielsen are all in the field. Pilots are not currencies. Adoption depends on broadcaster, agency, and platform buy-in — and on JioStar's posture given its dominant position.\n5. **Does the absence of a restricted-jurisdiction list survive?** Cross-border transfers are currently open; an executive notification could change this overnight, with large consequences for global adtech and measurement vendors.\n6. **Will consent managers become real ad-consent infrastructure or a formality?** The institution exists in law; whether it becomes a functional clearinghouse for advertising consent is untested.\n7. **How will DPDP interact with retail media and clean rooms?** Retail media's first-party data is its asset; the consent and purpose-limitation rules could constrain how that data is used for targeting and measurement.\n\n---\n\n## Sources\n\n1. Shardul Amarchand Mangaldas & Co., \"Enforcement of the DPDP Act and notification of the DPDP rules,\" ~Nov 2025. https://www.amsshardul.com/insight/enforcement-of-the-dpdp-act-and-notification-of-the-dpdp-rules/ — Tier 2 (law firm). Accessed 2026-06-17. Contribution: phased commencement dates (14 Nov 2025 / 14 Nov 2026 / 14 May 2027), children's exemptions (healthcare/education/real-time safety), consent-manager grievance window.\n2. Bar & Bench, \"MeitY notifies final Digital Personal Data Protection Rules 2025,\" 2025-11-17. https://www.barandbench.com/view-point/meity-notifies-final-digital-personal-data-protection-rules-2025 — Tier 2 (legal media). Accessed 2026-06-17. Contribution: gazette dated 13 Nov 2025.\n3. S.S. Rana & Co., \"MeitY Notifies Final Digital Personal Data Protection Rules 2025,\" ~Nov 2025. https://ssrana.in/articles/meity-notifies-final-digital-personal-data-protection-rules-2025/ — Tier 2 (law firm). Accessed 2026-06-17. Contribution: gazette no. G.S.R. 846(E) dated 13 Nov 2025; phased
