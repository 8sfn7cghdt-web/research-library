   everything is fully visible by default — motion is purely additive. When a
   figure scrolls into view the observer adds .is-revealed and CSS does the rest.

.reveal-armed .cv-fade { opacity: 0; transition: opacity .6s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-fade { opacity: 1; }
.reveal-armed .cv-rise { opacity: 0; transform: translateY(10px);

.reveal-armed.is-revealed .cv-rise { opacity: 1; transform: none; }
.reveal-armed .cv-grow-up { transform: scaleY(0); transform-box: fill-box; transform-origin: bottom;
  transition: transform .85s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-grow-up { transform: scaleY(1); }
.reveal-armed .cv-grow-right { transform: scaleX(0); transform-box: fill-box; transform-origin: left;
  transition: transform .85s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-grow-right { transform: scaleX(1); }
.reveal-armed .cv-draw { stroke-dasharray: 1; stroke-dashoffset: 1;
  transition: stroke-dashoffset 1.15s var(--cv-ease) var(--d, 0s); }
.reveal-armed.is-revealed .cv-draw { stroke-dashoffset: 0; }

  transform-origin: center; transition: transform .95s var(--cv-ease) var(--d, 0s), opacity .7s var(--cv-ease) var(--d, 0s); }

<script id="corpus-data" type="application/json">{"slug": "india-advertising-research", "title": "A Billion Screens", "subtitle": "India's advertising market — the digital tipping point, programmatic CTV, and YouTube", "author": "", "generated": "2026-06-17", "documents": [{"order": 0, "file": "00_Briefing.md", "title": "The Indian Advertising Market", "summary": "", "body": "# The Indian Advertising Market\n\n> **Bottom line.** India's advertising market crossed a threshold in the mid-2020s: for the first time, every major measurement house calls it digital-majority. Madison's expanded reckoning puts 2025 spend at **₹1.55 lakh crore with digital at 60%**; its own legacy series, kept for continuity, says **₹1.15 lakh crore and 46%**. Both describe the same market — the gap is a *definition*, not a disagreement, and learning to read that gap is the first skill these pages teach. Underneath the headline, three things are happening at once and they do not move at the same speed. Money is flowing to digital faster than India can *measure* it, faster than it can *verify* it for fraud, and into a structure that is concentrating around a small number of gatekeepers — a foreign demand-side duopoly (Google and Meta, ~64% of digital), a domestic supply-side colossus (Reliance's JioStar, the country's dominant seller of premium video), and a fast-rising commerce-media third pole (Amazon, Flipkart, and the quick-commerce trio). Connected TV and YouTube are the two surfaces where television money and digital targeting now meet, and they are where the next five years will be decided.\n\n---\n\n## How India got here\n\nThe arc is unusually compressed and unusually mobile. For roughly half a century Indian advertising was a print-and-television business, mediated by an agency-and-measurement establishment — the Pitch Madison report, BARC for TV ratings, the global holding companies in their Indian forms. The 1991 liberalization and the near-simultaneous arrival of satellite television (STAR in December 1991, Zee in October 1992) produced the first advertising boom. The second, far larger inflection came not from media policy but from telecom: **Reliance Jio's September 2016 launch collapsed the price of mobile data by roughly 85%** and put cheap 4G video into hundreds of millions of hands. Because India had largely skipped the desktop-web era, the country went digital-and-mobile in a single step — natively mobile, natively video, natively app-based, with no installed base of desktop habits to migrate (traced in the chapter on origins and the digital tipping point).\n\nThree further shocks compounded the shift. The **June 2020 ban on TikTok** — following the Galwan border clash — displaced roughly 200 million short-video users to YouTube Shorts and Instagram Reels, handing two ad-funded American platforms the creator economy TikTok had built. The **COVID lockdowns** roughly doubled paid streaming subscriptions in a single year, seeding the connected-TV audience. And the **UPI payments rail** made digital commerce frictionless, manufacturing the retail-media spend that the market would later learn to count. The most recent inflection is the subtlest: in February 2026, the Pitch Madison report **redefined \"AdEx\" to include quick-commerce and MSME digital spend** — which is precisely why 2025 now has two sizes. The money was always being spent; the boundary finally moved to include it.\n\n---\n\n## What the market looks like now\n\nThe single most important methodological fact here is that **India has no one advertising-expenditure figure — it has at least five**, produced by five institutions with five definitions. The headline 2025 number ranges from roughly ₹1.15 lakh crore to over ₹1.84 lakh crore, and digital's share from 46% to ~68%, depending entirely on whose ruler you pick (the money-flows map in the chapter on current market structure lays this out). The trap is comparing two numbers from two houses without checking what each one counts. The discipline to enforce: always name the house and the definition.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">India&#x27;s 2025 ad market — five rulers, one market (₹ crore)<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">50k<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">100k<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">150k<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">200k<\/text><rect x=\"110.2\" y=\"115.1\" width=\"56.0\" height=\"134.9\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"138.2\" y=\"109.1\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">115.3k cr<\/text><text x=\"138.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 138.2 268.0)\">Madison legacy<\/text><rect x=\"266.8\" y=\"108.0\" width=\"56.0\" height=\"142.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"294.8\" y=\"102.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">121.3k cr<\/text><text x=\"294.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 294.8 268.0)\">dentsu<\/text><rect x=\"423.2\" y=\"68.5\" width=\"56.0\" height=\"181.5\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"451.2\" y=\"62.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">155.1k cr<\/text><text x=\"451.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 451.2 268.0)\">Madison expan…<\/text><rect x=\"579.8\" y=\"34.7\" width=\"56.0\" height=\"215.3\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.15s\"/><text x=\"607.8\" y=\"28.7\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">184k cr<\/text><text x=\"607.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 607.8 268.0)\">WPP Media (de…<\/text><\/svg><figcaption>The ~₹40,000 cr gap between Madison&#x27;s two figures is almost entirely quick-commerce (₹4,000 cr) plus MSME digital (₹35,814 cr) — money that was always spent but previously sat below the reporting line. <span class=\"credit\">Source: Pitch Madison Advertising Report 2026; dentsu-e4m 2026; WPP Media TYNY (2025 base derived); FICCI-EY M&amp;E 2026.<\/span><\/figcaption><\/figure>\n\n\n\nBeneath the definitional fog, the structure is legible. **Digital is now the largest medium and linear TV is shrinking** — TV fell ~5% to ₹32,855 crore in 2025, with ad volumes down ~10%. Inside digital, social and online video together are about 57% of spend (Meta on social; YouTube and JioHotstar on video), paid search another ~23%, and the fastest-growing slice is **retail and commerce media** — roughly a quarter of digital, growing at about twice the market rate, as advertisers chase the 3–8% conversion of quick commerce against the 1.5–3% of traditional digital. The **Google–Meta duopoly still holds ~64% of digital**, so the word is still directionally right — but the qualifier is now mandatory, because Amazon, Flipkart, and the quick-commerce trio (Blinkit, Zepto, Swiggy Instamart) are eroding that share visibly. The honest descriptor is \"two platform incumbents plus a rising commerce-media tier,\" not a bare duopoly. The other half of the story is the **MSME long tail**: roughly a million small advertisers spending ~₹36,000 crore, overwhelmingly self-serve on Meta and Google — the tier that makes the \"60% digital\" headline possible and the tier most locked to the gardens.\n\n---\n\n## The two surfaces that matter most: programmatic CTV and YouTube\n\n**Connected TV** is real, large, and growing fast — and measured so inconsistently that the single most important fact about it, the size of CTV ad spend, ranges across published 2025 estimates from roughly ₹1,500 crore (dentsu, narrow/programmatic-only) to ₹6,000 crore (Madison, the most-cited mid-point) to ₹9,900 crore (FICCI-EY, broad/all-big-screen-streaming) — a more-than-sixfold spread driven almost entirely by definition (examined in the chapter on programmatic advertising and connected TV). Household counts are just as contested (~45 million to ~68 million, against a ~129 million \"users\" reach figure that is not a household number at all). The plumbing, though, has a clear shape. On the supply side, **JioStar/JioHotstar is the gravitational center** — the largest seller of premium video inventory in India, now running its live-sports and entertainment programmatic stack on **Magnite's SpringServe** under an expanded partnership announced 4 June 2026, and opening IPL inventory to small advertisers via self-serve from ₹4,000 (21 May 2026). On the demand side, a small DSP oligopoly — The Trade Desk, Google's DV360, Amazon DSP — buys against a smart-TV OEM/FAST counterweight (Samsung TV Plus, LG Channels) that is the one big-screen supply pool *outside* Reliance's control. The brake on all of it is a **measurement-and-trust gap**: an estimated 7–8% of Indian CTV spend delivered no measurable value in 2025, and India saw a reported ~110% year-on-year jump in CTV fraud-filter rates.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">India CTV ad spend, 2025 — a 6× spread that is definitional, not factual<\/div><svg viewBox=\"0 0 700 206\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"198\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"198\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2,500<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"198\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">5,000<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"198\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">7,500<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"198\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">10k<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">dentsu (narrow)<\/text><rect x=\"185\" y=\"8\" width=\"66.8\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"259.8\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">1,500 cr<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">trade synthesis<\/text><rect x=\"185\" y=\"42\" width=\"111.2\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"304.2\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">2,500 cr<\/text><text x=\"175\" y=\"92\" font-size=\"13\" text-anchor=\"end\">Madison (mid-point)<\/text><rect x=\"185\" y=\"76\" width=\"267.0\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.10s\"/><text x=\"460.0\" y=\"92\" font-size=\"12.5\" class=\"t-muted\">6,000 cr<\/text><text x=\"175\" y=\"126\" font-size=\"13\" text-anchor=\"end\">WPP Media (~$760M)<\/text><rect x=\"185\" y=\"110\" width=\"280.4\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.15s\"/><text x=\"473.4\" y=\"126\" font-size=\"12.5\" class=\"t-muted\">6,300 cr<\/text><text x=\"175\" y=\"160\" font-size=\"13\" text-anchor=\"end\">FICCI-EY (broad)<\/text><rect x=\"185\" y=\"144\" width=\"440.6\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.20s\"/><text x=\"633.5\" y=\"160\" font-size=\"12.5\" class=\"t-muted\">9,900 cr<\/text><\/svg><figcaption>Narrow definitions count only device-delivered programmatic inventory; broad ones fold in direct-sold sports streaming (a single ICC tournament earned JioStar ₹2,000 cr+). ₹6,000 cr is the most-cited mid-point. <span class=\"credit\">Source: dentsu-e4m; exchange4media trade synthesis; Pitch Madison 2026; WPP Media TYNY; FICCI-EY M&amp;E 2026.<\/span><\/figcaption><\/figure>\n\n\n\n**YouTube** is the destination that money increasingly chases. It is the largest YouTube market on earth — roughly 491 million users in early 2025, past 500 million on Google's own ad-planning data by 2026 — and the central analytical problem is a measurement gap of a different kind: **Alphabet has never broken out India-specific YouTube revenue**, and only disclosed YouTube's *global* total ($60 billion for 2025) for the first time in February 2026. Every India figure is therefore a proxy; the best analyst estimates put YouTube India ad revenue in a soft ~$1–2 billion band (the chapter on YouTube in India works through the proxies). Within that caution, three businesses sit on one audience: a mobile-dominant **long-form ad business** (the historic core, 55% creator share), a **short-form engine** in Shorts (650 million+ monthly viewers, the post-TikTok-ban inheritance, but a weaker 45% creator share and a fraction of long-form RPM), and an emergent **living-room TV business** (75 million+ adults on CTV by April 2025, the explicit \"YouTube is the new TV\" land-grab on traditional-TV budgets). The most important *independent* development to watch is Comscore's India YouTube CTV measurement maturing — the mechanism by which the \"new TV\" claim either becomes a buyable currency or gets discounted as vendor marketing. A standing caution runs through this whole section: the most quotable India numbers (75M CTV, 650M Shorts, ₹16,000 cr GDP contribution, ₹21,000 cr creator payouts) all originate with YouTube/Brandcast/Oxford-Economics-for-YouTube and must be read as advocacy with data attached, not neutral measurement.\n\n---\n\n## The layer underneath: regulation, measurement, trust\n\nIndia's market is being reshaped less by a new ad format than by a new legal floor under it. The **Digital Personal Data Protection (DPDP) Rules, 2025** — notified by gazette dated 13 November 2025, with the first provisions live the next day — give India its first operational privacy regime, phasing in over roughly 18 months to a full-compliance cliff around **13–14 May 2027** (the chapter on regulation, measurement, and trust details the phase-in). The provision that bites adtech hardest is the children's-data regime: an effectively **absolute prohibition on behavioral tracking and targeted advertising directed at anyone under 18** — a notably high threshold — plus mandatory verifiable parental consent, with narrow carve-outs for healthcare, education, and child-safety. For India's young, video-heavy platforms, that is a binary: reliably wall off minors, or forgo behavioral targeting on youth-heavy inventory entirely.\n\nThe deep irony is that this lands at the exact moment Google **abandoned third-party-cookie deprecation in Chrome** (April 2025) — so India's privacy pressure is now statutory and domestic, not inherited from a browser vendor's roadmap. And because a privacy regime prizes logged-in, consented, first-party relationships, it structurally advantages the very **walled gardens** that already own them: Google, Meta, and Amazon are estimated to capture 70–80% of programmatic spend, and DPDP compounds that advantage. Running under everything is a **measurement vacuum** — there is still no single cross-platform currency reconciling linear TV, CTV, mobile, and desktop. The BARC–Nielsen cross-media pilot (live as of February 2026, JioHotstar as anchor, IPL 2026 as the test) is the leading attempt, but a true unified metric is years out. The result is one structural pressure, not three separate stories: regulation, the measurement vacuum, and the fraud surface all push Indian ad money toward closed, logged-in, first-party environments — at the very moment open programmatic CTV is supposed to be the growth frontier.\n\n---\n\n## Where it goes — the forecast in brief\n\nEvery forecaster agrees on direction and roughly on size: India's ad market reaches around **₹2 lakh crore in 2026** (₹1.74 lakh crore on Madison's expanded base; ₹2.02 lakh crore on WPP's broadest), growing high-single-to-low-double digits, with digital climbing toward **70% of spend by 2027**. India is entering the top five global digital ad markets. The *interesting* question is not how big the market gets — the boosters agree on that, and most of them sell into it — but **how concentrated the control of inventory, data, and distribution becomes, and whether regulators constrain it.** Our base case (≈55%) is a steady digital-led grind: retail media and CTV lead growth, DPDP compliance lands in 2027 with manageable friction, measurement matures slowly, and Reliance's integrated gravity (telecom pipe + JioStar content + JioMart commerce) tightens without triggering hard intervention. The upside case turns on the \"Bharat\" frontier — regional-language, rural, sub-million-town audiences, already >55% of CTV viewers — converting *reach* into *revenue* faster than expected. The downside case is the trust-and-concentration drag: DPDP friction, the measurement vacuum, fraud, and AI-Overview erosion of the search-ad click economy combining to slow the grind, while concentration invites a regulatory response. The full scenario set, with probabilities, drivers, and signals to watch, is taken up in the outlook.\n\n---\n\n## How to read what follows\n\nStart here, then follow your interest. The chapter on origins and the digital tipping point is the history that makes the present legible — the Jio shock, the TikTok ban, the 2026 redefinition. The chapter on current market structure is the money-flows map and the indispensable guide to the five measurement frameworks. The chapters on programmatic CTV and on YouTube in India are the two deep dives at the center of this account — the plumbing and the destination. The chapter on regulation, measurement, and trust is the constraint layer; the chapter on competitive dynamics is the structural-power analysis that seeds the forecast, and the outlook gathers the scenarios. The single discipline to carry through all of it: in Indian ad reporting, **every headline number is definition-dependent** — never quote one without its ruler."}, {"order": 1, "file": "01_Origins_Digital_Tipping_Point.md", "title": "Origins and the Digital Tipping Point — How India's Advertising Market Got Here", "summary": "", "body": "# Origins and the Digital Tipping Point — How India's Advertising Market Got Here\n\n## Bottom Line\n\nIndia reached its **digital tipping point in the mid-2020s**, and the arc that carried it there is unusually compressed and unusually mobile. For roughly half a century the market was a print-and-television business, mediated by a measurement-and-agency establishment: the Pitch Madison Advertising Report, BARC for TV ratings, and the global holding companies WPP/GroupM, dentsu, Publicis and Omnicom in their Indian forms. The 1991 economic liberalization and the near-simultaneous arrival of satellite TV (STAR in December 1991, Zee in October 1992) created the first advertising boom. The second, far larger inflection came not from media policy but from telecom. **Reliance Jio's September 2016 launch collapsed the price of mobile data by roughly 85% and put cheap 4G video into hundreds of millions of hands** — and because India had largely skipped the desktop-web era, the country went digital-and-mobile in one step. Three further shocks compounded the shift: the **June 2020 ban on TikTok**, which displaced ~200 million short-video users to YouTube Shorts and Instagram Reels; the **COVID lockdowns**, which roughly doubled paid streaming subscriptions in 2020; and the **UPI payments rail**, which made digital commerce — and the retail-media advertising that rides on it — frictionless. The most recent inflection is definitional rather than physical: in February 2026 the Pitch Madison Advertising Report **redefined \"AdEx\" to include quick-commerce and MSME digital spend**, which is why 2025 market-size figures now diverge sharply — **~₹1,15,291 crore on the legacy definition (46% digital) versus ~₹1,55,105 crore on the expanded definition (60% digital)**. The same market, measured two ways, tells the same story. India's ad economy has flipped decisively to digital, and the open question that follows is how programmatic CTV and YouTube divide the spoils.\n\n---\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The inflection points that built India&#x27;s digital ad market<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">1991-92<\/div><div class=\"tlbody\">Liberalization + STAR/Zee satellite TV — the first ad boom<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">2014<\/div><div class=\"tlbody\">BARC becomes sole authorized TV-ratings agency<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">Sep 2016<\/div><div class=\"tlbody\">Reliance Jio launch — ~85% data-price collapse, the video flood<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">Jun 2020<\/div><div class=\"tlbody\">TikTok ban — ~200M users shift to YouTube Shorts / Reels<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">2020-21<\/div><div class=\"tlbody\">COVID roughly doubles paid streaming subscriptions<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">Nov 2024<\/div><div class=\"tlbody\">JioStar JV completed — the dominant video-inventory seller forms<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">Nov 2025<\/div><div class=\"tlbody\">DPDP Rules 2025 notified — India&#x27;s first operational privacy regime<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">Feb 2026<\/div><div class=\"tlbody\">PMAR 2026 redefines AdEx — digital reads 60% (expanded) vs 46% (legacy)<\/div><\/div><\/div><figcaption>A decade-and-a-half from the first satellite-TV boom to a digital-majority market — most of it compressed into 2016-2026. <span class=\"credit\">Source: Compiled 2026-06-17.<\/span><\/figcaption><\/figure>\n\n\n\n## 1. The pre-digital order: print, television, and the measurement-agency establishment\n\n### The shape of the legacy market\n\nThrough the 1980s and into the 2010s, Indian advertising was a two-medium business — **print and television** — with radio, out-of-home (OOH), and cinema at the margins. Print proved unusually durable in India compared with Western markets. Vernacular dailies (Hindi, Tamil, Telugu, Marathi, Malayalam and others) commanded mass readership and local-advertiser loyalty long after print declined elsewhere. As late as 2024, print still **crossed the ₹20,000-crore mark for the first time post-COVID, reaching ₹20,272 crore**, growing 5% [1] — a figure unthinkable in most mature markets, and a measure of how slowly the legacy order eroded.\n\nTelevision was the growth engine of the liberalization era and remained the single largest legacy medium into the 2020s. In 2024 TV reached **₹34,453 crore**, but grew only 5% — its slowest pace in eight years apart from the COVID year of 2020 — and its share slipped from 33% to 32% [1]. By 2025, on Madison's accounting, **linear TV actually declined ~5% to ₹32,855 crore, with volumes down ~10%** [2]. That decline is the clearest single signal that the legacy order had stopped growing.\n\n### Who measures the market: the Pitch Madison Advertising Report\n\nThe authoritative annual measure of Indian \"AdEx\" (advertising expenditure) is the **Pitch Madison Advertising Report (PMAR)**, published by **Madison World** and fronted by its chairman **Sam Balsara**. PMAR is the closest thing India has to a canonical market-size series, and most figures in this account trace back to it. The **24th edition (PMAR 2026) was unveiled on 24 February 2026 in Mumbai** [2][3]. Because PMAR is a single industry-body estimate rather than an audited primary dataset, its figures should be read as the best available consensus, not as ground truth — and its 2026 redefinition of the market (Section 8) is itself a major event.\n\n### The agency and holding-company lineage\n\nThe buying and planning side of the market is dominated, as in most countries, by the global advertising holding companies operating through Indian subsidiaries and networks:\n\n- **WPP / GroupM → \"WPP Media.\"** GroupM was for years the largest media-buying group in India and globally. In **May 2025 WPP rebranded GroupM globally as \"WPP Media,\"** folding agencies such as Mindshare, Wavemaker and EssenceMediacom into a single division connected to WPP's AI platform \"WPP Open\" [4][5]. WPP CEO Mark Read framed the move as ending \"holding companies within holding companies\"; WPP Media is described as managing more than **$60 billion in media across 80 markets** [4]. This is a present-tense status claim — GroupM as a standalone brand no longer operates as of the rebrand.\n- **dentsu.** Dentsu entered the global agency tier via its **£3.16 billion acquisition of Aegis Group (completed 26 March 2013)**, which brought Carat, iProspect and Vizeum into its stable [6]. In India, dentsu operates a Performance Practice spanning Sokrati, iProspect, Carat and Dentsu X [6]. As of 2025 dentsu was undergoing a \"One Dentsu\" global restructuring and exploring a sale of its international arm — a live, unresolved corporate-status question flagged in trade press [6].\n- **Publicis Groupe and Omnicom** complete the holding-company set; the **Omnicom–IPG merger** (a major global consolidation) was the backdrop against which WPP consolidated GroupM into WPP Media [4]. (Publicis and Omnicom India are mapped in more depth in the chapter on current market structure.)\n\n### Who measures the audience: BARC and the TRP system\n\nTelevision ad pricing in India rests on the **TRP (Television Rating Points)** currency produced by the **Broadcast Audience Research Council (BARC India)**, the sole authorized TV-ratings agency since 2014 [7]. BARC measures roughly **230 million-plus TV households via about 58,000 people-meters** — a penetration of ~0.025% [7]. The measurement system is itself in flux and contested: starting **26 June 2025, BARC moved to weekly \"unrolled\" viewership data** (from four-week rolling averages) [8], and on **2 July 2025 the Ministry of Information & Broadcasting released a draft TRP policy** explicitly designed to end BARC's monopoly, allow multiple measurement agencies, and capture digital/CTV viewership [7][9]. This regulatory motion is the trust-and-measurement seam that runs through these pages.\n\n---\n\n## 2. Liberalization and the first advertising boom (1991–2000s)\n\nThe modern Indian ad market begins with the **1991 economic liberalization** under Prime Minister P.V. Narasimha Rao and finance minister Manmohan Singh, which opened sectors to foreign investment and private enterprise and ended the state's broadcasting monopoly (Doordarshan) [10][11].\n\nTwo media events followed almost immediately:\n\n- **STAR TV (Satellite Television Asian Region)**, a Hong Kong–based broadcaster, **began beaming five channels over the subcontinent via AsiaSat-1 in December 1991** [10].\n- **Zee TV launched on 1 October 1992** as India's first privately owned Hindi satellite channel, initially carried on the STAR platform [10].\n\nThe effect on advertising was a boom. By 1995, television reached **more than 70 million homes and a viewing population over 400 million through 100-plus channels** [10]. Rising middle-class purchasing power plus a sudden multiplication of commercial channels turned TV from a government messaging instrument into a competitive, plural, ad-funded medium [10][11]. This is the period in which the agency-and-measurement establishment described in Section 1 took its mature shape: holding companies built Indian scale, and the need for a TV ratings currency drove the precursors to BARC.\n\nFor the next two decades the market grew steadily but conventionally: print held the vernacular mass, TV captured national brand budgets, and digital was a rounding error. The genuinely disruptive inflection was still to come — and when it came, it came from the telecom sector, not from media.\n\n---\n\n## 3. The mobile-first leapfrog: why India skipped the desktop web\n\nThe single most important structural fact about Indian digital advertising is that **India largely skipped the desktop-internet era**. Where the US and Europe built a decade-plus of desktop-web advertising (banner ads, search on PCs, desktop display) before mobile arrived, India's mass internet adoption happened **directly on smartphones**.\n\nBy 2024 India had roughly **886 million internet users, growing ~8% year-on-year, and is set to surpass 900 million in 2025**, with the surge **led by rural areas (488 million rural users, ~55% of the total)** [12]. Crucially, adoption was \"driven by mobile connectivity rather than desktop infrastructure\" — affordable smartphones and cheap data, not PCs and broadband, brought the next several hundred million Indians online [12].\n\nThe consequence for advertising is profound and runs through everything that follows: the Indian digital ad market is **natively mobile, natively video, and natively app-based**. There was no large installed base of desktop habits to migrate; the formats that won — short video, mobile search, social, and increasingly connected TV — won on a population that had no prior digital frame of reference. This is why platforms like YouTube and the short-video apps could scale so fast after 2016, and it is the precondition for everything in Sections 4–7.\n\n---\n\n## 4. The Jio shock: cheap data and the video flood (2016)\n\nIf liberalization built the first ad boom, **Reliance Jio built the second and larger one** — indirectly, by collapsing the price of mobile data.\n\n**Mukesh Ambani announced Jio's commercial launch at Reliance Industries' AGM on 1 September 2016; services launched 5 September 2016**, offering free unlimited voice, free 4G data, free SMS and zero roaming through (initially) March 2017 [13][14]. The pricing was deliberately destructive:\n\n- In 2015, **1GB of mobile data cost about ₹225**; Jio's effective cost fell to roughly **$0.33/GB versus an incumbent average near $2/GB — an ~85% reduction** [13].\n- Industry ARPUs fell from ~₹120 (stable since mid-2014) toward ~₹82.7 by March 2017, a roughly one-third decline [13][14].\n\nThe subscriber and consumption response was the fastest in global telecom history:\n\n- Jio passed **100 million subscribers within months** and ~108 million by 31 March 2017 [13][14].\n- **Indian internet users went from ~300 million (2016) toward 700 million-plus by 2020**, and monthly data use jumped from under 1GB to over 10GB per user [13][14].\n- Within six months of launch, monthly data consumption rose roughly six-fold to ~1.2 billion GB/month, making India the world's largest mobile-data consumer [13][14].\n\nFor video and advertising specifically, cheap data meant **YouTube viewing tripled and streaming services (Netflix, Prime Video) found millions of new users** [13]. The market also consolidated violently: ARPU pressure drove Tata Teleservices, Telenor and MTS out, shrinking a dozen-operator market to three (Jio, Airtel, Vodafone Idea) [13]. The advertising significance is that Jio manufactured, almost overnight, the audience that digital advertising would monetize — a mass, mobile, video-consuming population that did not exist in 2015.\n\nJio's 2016 launch terms — free data — were promotional and have long since ended. The durable effect is not the introductory pricing but the price collapse itself and the mass video audience it created.\n\n---\n\n## 5. The TikTok ban and the short-video displacement (June 2020)\n\nThe next inflection was geopolitical. In **June 2020, following a deadly India–China border clash in the Galwan Valley** (20 Indian and 4 Chinese soldiers killed, per the reporting), India banned TikTok along with dozens of other Chinese apps, citing sovereignty and data-security concerns [15][16].\n\nAt the time **India had ~200 million TikTok users — the largest base outside China — and the ban was sudden and permanent** [15][16]. The displacement reshaped India's short-video and creator-advertising economy:\n\n- **Google launched YouTube Shorts and Meta pushed Instagram Reels** into the vacuum within months, and the two captured most of the market TikTok vacated [15][16].\n- Domestic clones (Moj, MX TakaTak, Chingari) surged — by November 2020 at least 13 of the top 100 Indian Play Store social apps were TikTok clones — but they could not displace Reels and Shorts long-term [15][16].\n\nFor advertising, the TikTok ban handed ~200 million engaged short-video users — and the creator/influencer economy attached to them — to two ad-funded American platforms. YouTube Shorts in particular became a central pillar of India's video-ad market: by the mid-2020s YouTube reported **over 650 million monthly logged-in Shorts viewers in India** [17]. The ban is therefore not a side story; it is a major reason YouTube's Indian position is as dominant as it is.\n\n---\n\n## 6. COVID and the streaming acceleration (2020–21)\n\nThe pandemic lockdowns of 2020 compressed years of streaming adoption into months. Per Omdia's accounting:\n\n- **India's OTT/SVOD subscriptions roughly doubled, from ~32 million (end-2019) to ~62 million (end-2020)** [18].\n- Paid subscribers rose ~30% between March and July 2020 alone (from ~22.2 million to ~29.0 million) [18].\n- International platforms reported large upticks (Amazon Prime ~67%, Netflix ~65%); domestic players (ZEE5, AltBalaji) also grew sharply [18].\n- **Netflix and Disney+ Hotstar together accounted for ~50% of all Indian SVOD subscribers in 2020**, with Disney+ Hotstar leading on subscription share [18].\n\nThe advertising relevance is twofold. First, COVID normalized large-screen and on-demand streaming consumption, seeding the connected-TV (CTV) audience that becomes central later. Second, the lockdown depressed traditional-media spending (live sport paused, OOH and cinema collapsed) while accelerating digital — pulling the digital share of AdEx forward by what is plausibly a couple of years. Note that the platform landscape has since changed materially (Disney+ Hotstar has been folded into JioHotstar in the subsequent Reliance–Disney combination), so the 2020 market-share snapshot is historical, not current.\n\n---\n\n## 7. UPI and the payments rail under digital advertising\n\nA less obvious but load-bearing enabler is **UPI (Unified Payments Interface)**, the real-time payments rail operated by the **National Payments Corporation of India (NPCI)**. UPI is the plumbing that makes mobile commerce — and therefore retail-media and performance advertising — frictionless for hundreds of millions of users.\n\nThe growth is extreme: annual UPI transaction volume expanded from ~2 crore in FY2016-17 toward **over 24,000 crore transactions in FY2025-26**, and **calendar-year 2025 saw ~228 billion transactions worth ~₹300 lakh crore**, up from ~172 billion (₹246.82 lakh crore) in 2024 [19][20]. **Monthly volumes crossed 2,000 crore for the first time in August 2025, and December 2025 set a record at ~2,163 crore (21.6 billion) transactions** [19][20]. The average ticket size has fallen to ~₹1,348, reflecting everyday low-value use [19].\n\nUPI matters to advertising because it removes the checkout friction that elsewhere throttles e-commerce conversion. A population that pays instantly by phone is a population that buys on impulse from quick-commerce apps — which is precisely the spend that the 2026 AdEx redefinition (Section 8) folds into the market. UPI did not advertise anything; it made the advertised transaction trivially completable, and thereby helped create the retail-media and q-commerce ad categories.\n\n---\n\n## 8. The 2026 redefinition: why the market size now diverges\n\nThe most recent — and most analytically important — inflection is **definitional**. With the **Pitch Madison Advertising Report 2026 (24th edition, launched 24 February 2026)**, Madison **expanded the definition of \"AdEx\" to fully incorporate Quick Commerce (q-commerce) advertising and MSME digital spend** [2][3][21]. This is why anyone reading 2025 figures encounters two different numbers for the same market:\n\n| Definition | 2025 total AdEx | Digital share | Traditional share | YoY growth |\n|---|---|---|---|---|\n| **Legacy** (continuity with prior editions) | **₹1,15,291 crore** | **46%** | 54% | 7% [21] |\n| **Expanded** (adds q-comm + MSME digital) | **₹1,55,105 crore** | **60%** (₹93,156 cr) | 40% (₹61,949 cr) | 12% [2][21] |\n\nUnder the expanded definition, **total digital AdEx in 2025 was ₹93,156 crore (60% share), up ~22% from ~₹76,261 crore in 2024**, while traditional media *declined ~1%* to ₹61,949 crore (40%) [21][22]. Digital under this definition has three components [21][22]:\n\n- **Core digital** (search, social, video, display, e-commerce/retail media) — with e-commerce/retail media around ₹10,257 crore (up ~27%) [2].\n- **Q-commerce advertising** (Blinkit, Zepto, Swiggy Instamart) — **scaled from ₹1,325 crore to ₹4,000 crore, a ~202% jump** [21][22].\n- **MSME digital spend** — **₹35,814 crore in 2025, up ~21%**, and projected to grow ~20% to ~₹42,976 crore in 2026 [21][22].\n\nOn the traditional side, the 2025 breakdown shows **linear TV declining ~5% to ₹32,855 crore (volumes down ~10%)** while **connected TV (CTV) doubled to ~₹6,000 crore**, so the \"large screen\" total (linear + CTV) was ~₹38,855 crore [2]. This is the precise hinge that the chapters ahead turn on: the large screen is no longer synonymous with linear TV, and the growth inside the large screen is entirely CTV.\n\nPMAR 2026 forecasts that on the expanded base **India's AdEx reaches ~₹1,74,605 crore in 2026 (12–13% growth), pushing digital to ~64% (~₹1,11,976 crore)** [2][21][22]. Sam Balsara's framing — \"digital has to be the planning spine, not a bolt-on\" — captures the editorial thesis of the redefinition [2].\n\nThe two series are not contradictory; they are the **same market measured with two different boundaries**. The legacy series preserves comparability with prior years and global benchmarks; the expanded series captures spend (q-commerce and MSME digital) that genuinely exists and is genuinely advertising but that the older boundary excluded. Anyone citing \"India's 2025 ad market\" must state which definition they mean — this is the single most important methodological caveat in these pages.\n\n---\n\n## 9. The CTV and YouTube on-ramp (where the story is headed)\n\nThe history above terminates at the threshold the later chapters explore: **programmatic CTV and YouTube**. The setup is already visible in the historical data:\n\n- India had roughly **50–60 million CTV households by mid-2025** (with smart-TV-owning households projected toward 80 million), and CTV ad spend roughly **doubled to ~₹6,000 crore in 2025**, with projections toward ₹8,000 crore in 2026 [2][23].\n- **YouTube is the dominant CTV surface in India**, reporting **75 million-plus connected-TV viewers** and **650 million-plus monthly logged-in Shorts viewers** as the mid-2020s base [17][23]. YouTube's positioning event \"Brandcast 2025\" explicitly framed CTV and Shorts as \"India's new TV\" [24].\n\nThese are present-tense scale claims drawn from 2023–2025 platform and trade sources; they are the handoff to the chapters on market structure, money flows, and the outlook. The historical point is simply that every precondition — mobile-first audiences (Section 3), cheap data and a video habit (Section 4), a displaced short-video population captured by YouTube (Section 5), a COVID-seeded large-screen streaming habit (Section 6), a frictionless payments rail feeding retail media (Section 7), and a market definition that finally counts all of it (Section 8) — was assembled in roughly a single decade, 2016–2026.\n\n---\n\n## Open Questions\n\n1. **Which AdEx definition becomes the standard?** If Madison's expanded definition is adopted as the new baseline, year-over-year comparisons before 2025 break. Does PMAR (or any body) publish a back-cast of the expanded series to restore continuity?\n2. **How large is MSME digital spend really?** The ₹35,814-crore MSME-digital figure is a Madison estimate of a famously hard-to-measure, fragmented category. What is the methodology, and how confident is it? This is a load-bearing component of the \"60% digital\" claim.\n3. **What replaces BARC, and when?** The July 2025 draft TRP policy aims to end BARC's monopoly and capture CTV viewership. Does a multi-agency / digital-inclusive measurement currency actually emerge, and on what timeline?\n4. **Is dentsu's international arm sold, and to whom?** As of mid-2026 this was an open corporate-status question with India-buyer speculation. Resolution affects the agency structure taken up in the chapter on current market structure.\n5. **How durable is the TikTok ban, and could a successor (or TikTok itself) return?** The ban's permanence is the foundation of YouTube/Reels dominance in short video; any reversal would be a major structural shock.\n6. **Pre-2016 digital-AdEx baseline:** Precise digital-ad-spend figures for the 2010–2016 period (the \"rounding error\" era) remain hard to pin down. A cleaner pre-Jio digital baseline would sharpen the \"tipping point\" narrative.\n7. **Print's vernacular resilience:** Why does Indian print remain a ₹20,000-crore-plus medium when print collapsed elsewhere? The vernacular/local-advertiser mechanism deserves a dedicated treatment.\n\n---\n\n## Sources\n\n1. MxMIndia / Indian Printer & Publisher, \"Pitch Madison report: AdEx set to grow by 11% in 2025\" and \"Print adex is still in the race,\" Feb 2025. https://www.mxmindia.com/advertising/pitch-madison-report-adex-set-to-grow-by-11-in-2025/ ; https://indianprinterpublisher.com/blog/2025/02/print-adex/ — Tier 5 (trade press, India). 2024 medium-by-medium AdEx figures (TV ₹34,453 cr, print ₹20,272 cr, digital ₹45,292 cr). Accessed 2026-06-17.\n2. medianews4u, \"India's Ad Market Crosses ₹1.55 Lakh Crore in 2025; Digital Now 60% of ADEX: Madison Report 2026,\" Feb 2026. https://www.medianews4u.com/indias-ad-market-crosses-%E2%82%B91-55-lakh-crore-in-2025-digital-now-60-of-adex-madison-report-2026/ — Tier 5 (trade press). Detailed PMAR 2026 breakdown: legacy ₹1,15,291 cr / expanded ₹1,55,105 cr, linear TV ₹32,855 cr, CTV ₹6,000 cr, q-comm ₹4,000 cr, MSME ₹35,814 cr, 2026 forecast. Accessed 2026-06-17.\n3. pitchonnet, \"Pitch Madison Advertising Report 2026 to launch on February 24\" and \"…to launch tomorrow,\" Feb 2026. https://www.pitchonnet.com/pitch-feature/pitch-madison-advertising-report-2026-to-launch-on-february-24-39028.html — Tier 5 (Madison-affiliated trade outlet). Confirms PMAR 2026 = 24th edition, launched 24 Feb 2026, Mumbai; Sam Balsara / Madison World authorship. Accessed 2026-06-17.\n4. Marketing Dive, \"GroupM becomes WPP Media as holding company prepares for future,\" May 2025. https://www.marketingdive.com/news/groupm-becomes-wpp-media-as-holding-company-prepares-for-future/749462/ — Tier 5 (trade press). GroupM→WPP Media rebrand (May 2025), >$60B media / 80 markets, Mark Read framing, Omnicom-IPG backdrop. Accessed 2026-06-17.\n5. Variety, \"WPP Erases 'GroupM,' One of Madison Avenue's Most Influential Names,\" 2025. https://variety.com/2025/tv/news/wpp-media-groupm-rename-advertising-1236411920/ — Tier 5 (trade press). Corroborates GroupM→WPP Media rebrand and agency consolidation (Mindshare, Wavemaker, EssenceMediacom). Accessed 2026-06-17.\n6. Storyboard18 / Campaign India / exchange4media, dentsu coverage: \"Inside the gamble of Dentsu's international arm sale,\" \"dentsu India strengthens leadership for performance marketing push,\" \"Inside dentsu's global challenges,\" 2025. https://www.storyboard18.com/advertising/dentsus-international-arm-sellout-bold-leap-forward-or-billion-dollar-culture-burden-80034.htm — Tier 5 (trade press). Aegis acquisition (£3.16B, completed 26 Mar 2013) bringing Carat/iProspect/Vizeum; dentsu India Performance Practice (Sokrati, iProspect, Carat, Dentsu X); \"One Dentsu\" restructuring; international-arm sale exploration. Accessed 2026-06-17.\n7. Organiser / ThePrint / bestmediainfo / PIB, \"Govt drafts TRP policy to end BARC monopoly,\" July 2025; PIB press release on opening TV ratings measurement (PRID 2141914). https://organiser.org/2025/07/04/300940/ ; https://www.pib.gov.in/PressReleasePage.aspx?PRID=2141914 — Tier 1 (PIB government press release) + Tier 5/6 (analysis). BARC as sole authorized TRP agency since 2014; ~230M+ TV households / ~58,000 people-meters (~0.025% penetration); draft TRP policy released 2 July 2025 to end monopoly. Accessed 2026-06-17.\n8. Storyboard18, \"From June 26, BARC to release weekly unrolled viewership data,\" 2025. https://www.storyboard18.com/television/from-june-26-barc-to-release-weekly-unrolled-viewership-data-71492.htm — Tier 5 (trade press). BARC shift to weekly unrolled data from 26 June 2025 (confirms BARC is currently publishing). Accessed 2026-06-17.\n9. PIB (Ministry of Information & Broadcasting), \"Entry barriers removed to allow multiple agencies in television ratings measurement,\" 2025. https://www.pib.gov.in/PressReleasePage.aspx?PRID=2141914 — Tier 1 (government press release; primary for what the government states it intends, not proof of outcome). Draft policy to allow multiple ratings agencies and capture digital/CTV viewership. Accessed 2026-06-17.\n10. Journalism University, \"Transforming Indian Television: The Post-Gulf War Media Landscape\" / \"The Evolution of Indian Television Post-Gulf War,\" n.d. https://journalism.university/introduction-to-journalism-and-mass-communication/evolution-indian-television-post-gulf-war/ — Tier 5/secondary educational. 1991 deregulation; STAR TV via AsiaSat-1 (Dec 1991); Zee TV launch (1 Oct 1992); ~70M homes / 400M viewers / 100+ channels by 1995. Triangulate dates against a Tier 2 media-history source where possible. Accessed 2026-06-17.\n11. IAFOR conference paper, \"In India till 1991 there was only one television channel,\" MediAsia 2013. https://papers.iafor.org/wp-content/uploads/papers/mediasia2013/MediAsia2013_0139.pdf — Tier 2 (peer-reviewed conference paper, with caution). Liberalization-era broadcasting context and the Doordarshan-monopoly-to-plurality transition. Accessed 2026-06-17.\n12. IBEF / Business Standard, \"India's internet users to exceed 900 million in 2025\"; \"India set to exceed 900mn internet users by 2025,\" Jan 2025. https://www.ibef.org/news/india-s-internet-users-to-exceed-900-million-in-2025-driven-by-indic-languages — Tier 5 (IBEF, India Brand Equity Foundation — government-backed, note promotional lean) + Tier 4 (Business Standard). 886M users in 2024 (~8% growth); rural 488M (~55%); mobile-first/leapfrog framing. Accessed 2026-06-17.\n13. Rest of World, \"How Mukesh Ambani won India's mobile data price war,\" 2020. https://restofworld.org/2020/how-india-mobile-data-became-worlds-cheapest/ — Tier 5 (specialized international press). Jio launch (1/5 Sep 2016); ~85% data-price collapse; ARPU decline; 100M+ subscribers; internet users 300M→700M+; YouTube viewing tripled; operator consolidation to three. Accessed 2026-06-17.\n14. ICMR / TeleGeography / academic case studies, \"Reliance Jio: Disrupting the Indian Telecom Industry\" / \"The Jio Effect,\" 2017–. https://www.icmrindia.org/casestudies/catalogue/Business%20Strategy/reliance-jio-disrupting-indian-telecom-industry-excerpts.htm ; https://resources.telegeography.com/the-jio-effect-how-the-newcomer-made-an-impact-in-india — Tier 2/5 (case study + telecom-data analyst). Corroborates subscriber growth (~108M by Mar 2017), data-consumption surge (~6x to ~1.2B GB/month), ARPU figures. Accessed 2026-06-17.\n15. PBS NewsHour, \"Here's what happened when India banned TikTok,\" 2024–25. https://www.pbs.org/newshour/world/heres-what-happened-when-india-banned-tiktok — Tier 4 (major outlet). June 2020 ban after Galwan clash; ~200M Indian TikTok users; permanent ban; rise of Shorts/Reels and domestic clones. Accessed 2026-06-17.\n16. CNN Business, \"India banned TikTok overnight but 200 million people learned to live without it,\" Mar 2024. https://www.cnn.com/2024/03/14/tech/india-us-tiktok-ban-analysis-intl-hnk — Tier 4 (major outlet). Corroborates ~200M users, overnight/permanent ban, YouTube Shorts & Instagram Reels capturing the vacated market. Accessed 2026-06-17.\n17. Think with Google APAC / Google blog, \"Brandcast 2025: CTV, Shorts, and YouTube as India's New TV\"; \"YouTube CTV in India: Premium Audiences,\" 2025. https://blog.google/intl/en-in/brandcast-2025-ctv-shorts-and-youtube-as-indias-new-tv/ — Tier 1 for *what Google claims* (platform self-report; not independent proof). 650M+ monthly logged-in Shorts viewers; 75M+ CTV viewers in India. Requires triangulation for use as fact. Accessed 2026-06-17.\n18. Omdia (via exchange4media / Omdia press), \"Netflix and Disney+ Hotstar account for 50% of SVOD subscribers in India in 2020,\" Mar 2021. https://omdia.tech.informa.com/pr/2021/mar/netflix-and-disney-hotstar-account-for-50-of-svod-subscribers-in-india — Tier 5 (analyst/research firm). OTT subs ~32M (2019)→~62M (2020); ~30% paid-sub rise Mar–Jul 2020; Netflix/Disney+ Hotstar ~50% of SVOD. HISTORICAL snapshot — platform map has since changed. Accessed 2026-06-17.\n19. Elets BFSI / Deccan Chronicle, \"UPI Smashes Records with 21.6 Billion Transactions in December 2025\"; \"Rs 300 Lakh Crore of UPI Transactions Made in CY2025,\" Jan 2026. https://bfsi.eletsonline.com/upi-smashes-records-with-21-6-billion-transactions-in-december-2025/ — Tier 4/5 (financial trade press). Dec 2025 record 21.6B transactions; CY2025 ~228B transactions / ~₹300 lakh crore; Aug 2025 first 2,000-crore month; avg ticket ~₹1,348. Accessed 2026-06-17.\n20. NPCI / PIB, UPI product statistics and \"UPI completes 10 glorious years\" (PRID 2257087). https://www.npci.org.in/product/upi/product-statistics ; https://www.pib.gov.in/PressReleasePage.aspx?PRID=2257087 — Tier 1 (NPCI primary statistics + government release). FY2016-17 ~2 crore → FY2025-26 24,000+ crore transactions; world's largest real-time payments platform. Accessed 2026-06-17.\n21. socialsamosa / Roastbrief, \"Digital now drives 60% of India's ₹1.55 lakh crore ad market: PMAR\"; \"PMAR 2026: India's ₹1.55 lakh crore ad market is already 60% Digital,\" Feb 2026. https://www.socialsamosa.com/report/digital-sixty-percent-indias-ad-market-pitch-madison-advertising-report-11125052 ; https://roastbrief.us/pmar-2026-indias-%E2%82%B91-55-lakh-crore-ad-market-is-already-60-digital/ — Tier 5 (trade press). Legacy ₹1,15,291 cr (46% digital) vs expanded ₹1,55,105 cr (60%); digital ₹93,156 cr (+22% from ₹76,261 cr); traditional ₹61,949 cr (−1%); three digital components; q-comm +202%; MSME ₹35,814 cr. Accessed 2026-06-17.\n22. exchange4media, \"PMAR 2026 Preview: India's Rs 1.55 lakh crore ad market is already 60% digital,\" Feb 2026. https://www.exchange4media.com/advertising-news/pmar-2026-indias-rs-155-lakh-crore-ad-market-is-already-60-digital-152117.html — Tier 5 (leading India ad-trade outlet; 403 on direct fetch but corroborated via search snippet and parallel outlets). Corroborates expanded/legacy figures, q-comm and MSME components, 2026 forecast ₹1,74,605 cr / ~64% digital. Accessed 2026-06-17 (via search; direct fetch blocked).\n23. The Media Ant / mediasmart / Storyboard18 / agencyreporter, India CTV 2025 coverage. https://www.themediaant.com/blog/smart-tv-buyers-ctv-viewers-india-2025/ ; https://www.storyboard18.com/digital/how-ctv-emerged-as-a-leader-in-2025-and-took-control-of-indias-video-economy-86542.htm — Tier 5/6 (trade + vendor blogs; vendor lean noted). ~50–60M CTV households mid-2025 (smart-TV households toward 80M); CTV ad spend ~₹2,300–3,000 cr range / doubling to ₹6,000 cr (per PMAR); YouTube CTV leadership. Vendor-blog figures need triangulation against PMAR. Accessed 2026-06-17.\n24. Google India blog, \"Brandcast 2025: CTV, Shorts, and YouTube as India's New TV,\" 2025. https://blog.google/intl/en-in/brandcast-2025-ctv-shorts-and-youtube-as-indias-new-tv/ — Tier 1 for platform claims (self-report). YouTube framing CTV + Shorts as \"India's new TV.\" Position/marketing evidence, not independent fact. Accessed 2026-06-17."}, {"order": 2, "file": "02_Current_Market_Structure.md", "title": "The Indian Advertising Market — Current Structure, Money Flows, and Platform Stack", "summary": "", "body": "# The Indian Advertising Market in 2025–26: Current Structure, Money Flows, and Platform Stack\n\n## Bottom Line\n\nFor the first time, every major measurement house calls India's 2025 advertising market digital-majority. But *how* digital-majority depends entirely on which ruler you use — and the rulers now disagree by more than Rs 80,000 crore. Madison's \"expanded\" definition, which folds in quick-commerce and the long tail of MSME digital spend, sizes the 2025 market at **Rs 1,55,105 crore with digital at 60%**. The same firm's \"legacy\" definition, kept for continuity, puts it at **Rs 1,15,291 crore with digital at 46%**. dentsu lands in between at **Rs 1,21,339 crore with digital at 59%**. WPP Media's TYNY, which counts the digital extensions of TV/print/audio/OOH inside \"digital,\" sizes 2026 at **Rs 2,01,891 crore with digital at ~68%**. One structural fact holds across all of them: **digital is now the largest medium, linear TV is shrinking** (Rs 32,855 crore, down 5% in 2025 on Madison's count), and the growth engine has migrated from brand-building display toward **outcome-driven commerce media** — retail media, quick-commerce ads, and a million-strong MSME long tail. The Google–Meta \"duopoly\" still holds roughly **64% of digital** (FICCI-EY), but Amazon, Flipkart, and the quick-commerce trio (Blinkit, Zepto, Instamart) are eroding that share visibly, their ad businesses growing at roughly twice the market rate. CTV and YouTube are the bridge categories where TV money and digital targeting meet — CTV ad revenue hit **Rs 9,900 crore in 2025, up 42%**. The rule for everything that follows: treat every headline rupee number in Indian adex reporting as definition-dependent, and never compare two numbers from two houses without checking what each one counts.\n\n---\n\n## 1. The Measurement Problem Comes First\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 340\" role=\"img\" aria-label=\"Four measurement houses size India's 2025 ad market differently: Madison legacy ₹1,15,291 crore at 46% digital; dentsu ₹1,21,339 crore at 59%; Madison expanded ₹1,55,105 crore at 60%; WPP Media ₹1,84,047 crore at 68%. Each bar is split into a digital segment and a traditional segment.\">\n<text x=\"350\" y=\"28\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">FIVE RULERS, ONE MARKET<\/text>\n<text x=\"350\" y=\"46\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">India's 2025 advertising market, measured four ways — bar split: digital (marigold) vs traditional<\/text>\n<line x1=\"200\" y1=\"64\" x2=\"200\" y2=\"276\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"321\" y1=\"64\" x2=\"321\" y2=\"276\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<line x1=\"442\" y1=\"64\" x2=\"442\" y2=\"276\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<line x1=\"563\" y1=\"64\" x2=\"563\" y2=\"276\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<text x=\"321\" y=\"290\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\">50k cr<\/text>\n<text x=\"442\" y=\"290\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\">1 lakh cr<\/text>\n<text x=\"563\" y=\"290\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono t-muted\">1.5 lakh cr<\/text>\n<text x=\"194\" y=\"99\" text-anchor=\"end\" font-size=\"10.5\" font-weight=\"bold\">Madison legacy<\/text>\n<rect x=\"200\" y=\"86\" width=\"128\" height=\"24\" class=\"f-t1\"/>\n<rect x=\"328\" y=\"86\" width=\"151\" height=\"24\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"264\" y=\"102\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" class=\"t-inv\">46%<\/text>\n<text x=\"485\" y=\"102\" font-size=\"10\" class=\"t-mono\">₹1,15,291 cr<\/text>\n<text x=\"194\" y=\"144\" text-anchor=\"end\" font-size=\"10.5\" font-weight=\"bold\">dentsu<\/text>\n<rect x=\"200\" y=\"131\" width=\"173\" height=\"24\" class=\"f-t1\"/>\n<rect x=\"373\" y=\"131\" width=\"121\" height=\"24\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"286\" y=\"147\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" class=\"t-inv\">59%<\/text>\n<text x=\"500\" y=\"147\" font-size=\"10\" class=\"t-mono\">₹1,21,339 cr<\/text>\n<text x=\"194\" y=\"189\" text-anchor=\"end\" font-size=\"10.5\" font-weight=\"bold\">Madison expanded<\/text>\n<rect x=\"200\" y=\"176\" width=\"226\" height=\"24\" class=\"f-t1\"/>\n<rect x=\"426\" y=\"176\" width=\"150\" height=\"24\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"313\" y=\"192\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" class=\"t-inv\">60%<\/text>\n<text x=\"582\" y=\"192\" font-size=\"10\" class=\"t-mono\">₹1,55,105 cr<\/text>\n<text x=\"194\" y=\"234\" text-anchor=\"end\" font-size=\"10.5\" font-weight=\"bold\">WPP Media<\/text>\n<rect x=\"200\" y=\"221\" width=\"303\" height=\"24\" class=\"f-t1\"/>\n<rect x=\"503\" y=\"221\" width=\"143\" height=\"24\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"351\" y=\"237\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\" class=\"t-inv\">68%<\/text>\n<text x=\"503\" y=\"215\" font-size=\"10\" class=\"t-mono\">₹1,84,047 cr (derived)<\/text>\n<text x=\"200\" y=\"316\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">The ~₹69,000 cr gap between the shortest and longest ruler is almost all definition — quick-commerce + MSME digital.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> The same 2025 market is ₹1.15 lakh crore or ₹1.84 lakh crore, and digital is 46% or 68%, depending only on which house's ruler you pick — Madison's expanded series adds quick-commerce (₹4,000 cr) and MSME digital (₹35,814 cr) that the legacy series leaves out. The lesson the corpus enforces everywhere: never quote an Indian ad-market number without naming its definition. (PMAR 2026; dentsu-e4m 2026; WPP Media TYNY.)<\/figcaption>\n<\/figure>\n\n\nBefore any number means anything, know this: India in 2025–26 has no *single* advertising-expenditure figure. It has at least four credible ones, produced by four institutions with four different definitions of what \"advertising\" and \"digital\" include. This is not a quibble. The headline 2025 number ranges from roughly **Rs 1.15 lakh crore to over Rs 1.84 lakh crore** depending on the source, and digital's share ranges from **46% to ~68%**. Any analysis that quotes a single number as \"the size of the Indian ad market\" without naming the source and the definition is, at best, careless.\n\nThe four frameworks:\n\n**(a) Madison \"expanded\" definition (Pitch Madison Advertising Report 2026).** PMAR is published by Madison World in association with Pitch and exchange4media; the 2026 edition was previewed in February 2026 ahead of a formal launch on 24 February in Mumbai [1][2]. Beginning with this edition, Madison reports a deliberately broadened \"expanded\" series that *adds* two categories the legacy series excluded: **Quick-Commerce (Q-Comm) advertising** and **MSME digital spends** (the long tail of small-business performance buys) [1][3]. On this basis, 2025 adex = **Rs 1,55,105 crore, +12% over 2024**, with **digital at 60% (Rs 93,156 crore)** and traditional at 40% (Rs 61,949 crore) [3][1].\n\n**(b) Madison \"legacy\" definition.** To preserve continuity with earlier PMAR editions, Madison also publishes the older, narrower series. On this basis 2025 adex = **Rs 1,15,291 crore, +7%**, with **digital at 46%** and traditional at 54% [4][1]. Same firm, same year, same underlying market — and a Rs 40,000 crore gap between its own two numbers, driven entirely by whether you count Q-Comm and MSME digital.\n\n**(c) dentsu (dentsu-e4m Digital Advertising Report 2026, covering 2025).** dentsu's base is narrower than Madison's expanded definition but its digital share is similar: 2025 adex = **Rs 1,21,339 crore, +8.3%**, with **digital the largest medium at Rs 71,621 crore (59%, +19%)** — the first year digital is India's single largest ad medium on dentsu's count [5][6][7].\n\n**(d) WPP Media \"This Year, Next Year\" (TYNY) India.** WPP Media (the rebranded GroupM) counts \"digital\" inclusive of the **digital extensions of TV, audio, print and OOH**, which mechanically inflates the digital share. Its 2026 forecast = **Rs 2,01,891 crore, +9.7%** over 2025 (an increment of Rs 17,844 crore, implying a 2025 base near **Rs 1,84,047 crore**), with **digital at 68.1%** [8][9]. This is the largest of the headline numbers and the least comparable to the others.\n\n**(e) FICCI-EY** (the annual Media & Entertainment report, 2026 edition released 24 March 2026) is a fifth lens, focused on the M&E sector rather than pure adex, and is the source most analysts cite for the **Google-Meta share** and for **CTV**: it puts 2025 digital advertising at **Rs 94,700 crore, +26%**, with **digital at 63% of total ad spend** [10][11].\n\nThe takeaway for the rest of this document: every number is tagged to its house and its definition. Where the houses can be reconciled, I reconcile them. Where they genuinely measure different things, I say so rather than averaging.\n\n### Why the gap exists (reconciliation)\n\nThe Rs 1,15,291 cr legacy vs. Rs 1,55,105 cr expanded gap is almost fully explained by Madison's two additions [3]:\n\n- **MSME digital: Rs 35,814 crore** (+21%), the spend of roughly a million small-business and long-tail advertisers buying performance and e-commerce ads [3][10].\n- **Q-Comm advertising: Rs 4,000 crore** (+202% from Rs 1,325 crore in 2024) [12].\n\nAdd those (~Rs 39,800 cr) to the legacy base and you land within rounding of the expanded figure. So the \"tipping point to 60% digital\" is not a sudden behavioral shift. It is partly a *measurement* decision — counting money that was always being spent but previously sat below the reporting line. That decision is itself one of the most important structural facts about the 2025 market: the long tail and commerce media grew too large to leave out.\n\n---\n\n## 2. The Top-Line Numbers (2025 actual, 2026 forecast)\n\nA consolidated reconciliation table, every cell tagged to a source:\n\n| Metric | Madison legacy | Madison expanded | dentsu | WPP Media TYNY | FICCI-EY |\n|---|---|---|---|---|---|\n| 2025 total adex | Rs 1,15,291 cr [4] | Rs 1,55,105 cr [3] | Rs 1,21,339 cr [5] | ~Rs 1,84,047 cr (derived) [8] | — (M&E framing) |\n| 2025 growth | +7% [4] | +12% [3] | +8.3% [5] | — | — |\n| 2025 digital value | — | Rs 93,156 cr [3] | Rs 71,621 cr [5] | — | Rs 94,700 cr [10] |\n| 2025 digital share | 46% [4] | 60% [3] | 59% [5] | — | 63% [10] |\n| 2026 total forecast | Rs 1,25,600 cr [12] | Rs 1,74,605 cr [2] | Rs 1,30,416 cr [5] | Rs 2,01,891 cr [8] | — |\n| 2026 digital share | — | ~64% (Rs 1,11,976 cr) [1] | ~half→rising [5] | 68.1% [8] | — |\n\nNote the **digital-value convergence** the share numbers hide: Madison expanded (Rs 93,156 cr) and FICCI-EY (Rs 94,700 cr) sit within ~2% of each other on the *value* of digital, even though they disagree on the denominator. dentsu's Rs 71,621 cr runs lower because its digital base excludes some of what Madison and FICCI-EY count — notably the full MSME long tail and parts of commerce media. On the size of digital, the houses agree far more than their share headlines suggest.\n\n---\n\n## 3. Inside Digital: The dentsu Format Split\n\ndentsu provides the cleanest format-level breakdown of 2025 digital spend (Rs 71,621 cr base) [5][6]:\n\n| Format | Value | Share of digital |\n|---|---|---|\n| Social media | Rs 21,057 cr | 29% |\n| Online video | Rs 20,004 cr | 28% |\n| Paid search | Rs 16,581 cr | 23% |\n| Display banners | Rs 11,581 cr | 16% |\n| Other formats | — | 3% |\n\nRead it two ways. First, **social + online video = 57% of digital** — over half of India's digital advertising is now feed and video, inventory dominated by Meta (social) and YouTube/JioHotstar (video). Second, **e-retail/retail media inside the dentsu base = Rs 17,601 crore, +55.86%, ~24.6% of digital** [5][13] — roughly a quarter of dentsu's digital adex is now commerce media, and it is the fastest-growing slice. dentsu also reports **programmatic at Rs 30,081 crore (42% of digital, +19%)** in 2025, forecast to Rs 42,435 cr (43%) by 2027 [5] — a figure that matters for connected TV, taken up later, since programmatic is the buying rail CTV runs on.\n\nFMCG remains the anchor category: **FMCG = 32% of digital spend, Rs 23,243 crore**, with FMCG's digital share of its own media budget rising from 53% (2024) to 64% (2025) and auto's from 37% to 44% [14]. The category mix is going digital too, not just the aggregate.\n\n---\n\n## 4. The Duopoly Question: Does It Still Fit?\n\nThe short answer: **Google + Meta still hold roughly two-thirds of Indian digital advertising, so \"duopoly\" is still directionally accurate — but the qualifier is now mandatory, because the share is being eroded fast by commerce media.**\n\n**The duopoly's current size.** FICCI-EY's 2026 report puts **Google and Meta at a combined 64% of India's digital ad revenues in 2025** [10][11]. On the entity level: Google India's gross revenue was **Rs 34,742 crore in FY2024-25** [15]; Meta India's gross ad revenue across Facebook, Instagram and WhatsApp is estimated by analysts at **~Rs 28,000 crore for FY25** (up from Rs 22,730 crore, +24%, in FY24) [15]. One caveat: Meta India's FY25 figure is an analyst estimate, not a filed number. YouTube India's advertising revenue is **not separately disclosed by Alphabet** in any filing; any India-specific YouTube number in the trade press is an estimate [15]. Globally, for scale context, YouTube's ad business hit **$11.4 billion in Q4 2025** and Google posted **$82.3 billion** of ad revenue that quarter [16].\n\n**The challengers.** The erosion is real and quantified:\n\n- **Amazon + Flipkart together: more than Rs 15,500 crore (Rs 15,574 cr) in ad revenue in FY2025, ~15% of India's digital adex** — Amazon Seller Services Rs 8,342 cr (+25%), Flipkart+Myntra Rs 7,232 cr (+27%), Myntra alone Rs 914.5 cr (+28%) [17].\n- **Retail media / e-commerce + point-of-sale advertising: Rs 22,000 crore, +50%, now 23% of digital revenues** (up from 20% in 2024) per FICCI-EY — spread across Amazon, Flipkart, Zomato, Zepto, Blinkit, Nykaa, Myntra and Instamart [10].\n- Globally, **Amazon is the world's third-largest digital ad player** (>$60 billion ad revenue expected in 2025), behind Google and Meta — the same triopoly structure is forming in India [10].\n\n**The \"third force\" wildcard.** Indian trade press has begun framing **JioStar/JioHotstar** as a potential domestic \"third force\" against Google and Meta in the ad-revenue race, on the strength of its streaming + sports inventory [18]. No hard JioStar ad-revenue figure has been independently verified; treat the \"third force\" framing as a position in the trade press, not a settled fact.\n\n**Verdict on \"duopoly.\"** Use it with the qualifier: *a Google-Meta duopoly that still holds ~64% of digital but is now flanked by a fast-growing commerce-media tier (Amazon, Flipkart, quick commerce) and a possible domestic streaming challenger.* The neutral descriptor preferred here is \"the two platform incumbents plus a rising commerce-media tier,\" not a bare \"duopoly.\"\n\n---\n\n## 5. Retail Media and Quick Commerce: The Structural Disruptor\n\nRetail media is the single most important structural story in the 2025 market, for two reasons: it is *where the duopoly's share is going*, and it is *why the long tail became countable*.\n\n**Retail media overall:** Rs 22,000 crore in 2025, +50%, 23% of digital revenues (FICCI-EY) [10]; or Rs 17,601 cr / 24.6% of digital on dentsu's narrower base, +55.86% [5][13]. Either way: ~a quarter of digital, growing at ~2x the market.\n\n**Quick commerce specifically:** Madison's expanded definition counts **Q-Comm advertising at Rs 4,000 crore in 2025, +202%** from Rs 1,325 crore in 2024 [12]. The three platforms — **Blinkit, Zepto, Swiggy Instamart** — generated an estimated **Rs 3,000–3,500 crore in ad ARR in FY25**, and the trio is **projected to reach ~Rs 4,900 crore in advertising revenue in calendar 2026** [19][20]. Platform detail: **Zepto's ad ARR surged ~5x to Rs 1,670 crore (~$200M)**; **Blinkit crossed Rs 1,000 crore** in ad revenue, ~15% of its total revenue, after passing Rs 400 cr in FY24 [19][20]. The economic driver advertisers cite: sales conversion of **3–8% on quick commerce vs 1.5–3% on traditional digital**, pulling D2C spend away from Meta and Google [19].\n\n**Where the named platforms stand today:**\n\n- **Blinkit** — live, owned by **Eternal Limited (formerly Zomato)**, market leader at **~45–50%+ q-comm share** as of Sep 2025 / 2026 reporting [21][20]. Confirmed live in an April 2026 market report [21].\n- **Swiggy Instamart** — live, the rapid-delivery arm of **Swiggy Limited**, ~25–27% share [21]. Confirmed live April 2026 [21].\n- **Zepto** — live, independent, well-funded, ~21–29% share [21]. Confirmed live April 2026 [21].\n- **Second-tier entrants — JioMart (Reliance) and BigBasket (Tata)** — scaling q-comm capability as of the April 2026 report [21]. *Caveat:* \"scaling/entering\" is the report's characterization; I have not verified current order volumes for these two.\n\nThe India quick-commerce market is sized at **~$3.65 billion in 2026** (Mordor) and projected variously to **$12.97 billion by 2029** (one report). The spread between forecasters is wide; treat q-comm GMV forecasts as contested [21].\n\n---\n\n## 6. The MSME Long Tail\n\nThe other half of the \"expanded definition\" gap is the long tail. Roughly **one million SME and long-tail advertisers spent ~Rs 36,300 crore on digital media in 2025** (FICCI-EY), mostly through performance and e-commerce channels [10]; Madison's expanded series counts essentially the same money as **MSME digital = Rs 35,814 crore, +21%** [3]. Why is this tier so large and so platform-locked? **~92% of Meta's advertiser base in India is small and medium enterprises** [10] — the long tail buys self-serve auction inventory on Meta and Google, which is *why* counting it raises the headline digital share. It is also the tier most exposed to the duopoly and least visible in legacy measurement — the reason Madison broadened its definition at all.\n\n---\n\n## 7. Linear TV vs Digital: The Crossover\n\nThe crossover is the defining media-cultural fact of 2025.\n\n- **Linear TV adex fell 5% in 2025 to Rs 32,855 crore**, with TV ad *volumes* down 10% (WPP Media / Madison) [8][12]. On dentsu's count, **television = Rs 25,964 crore, 21% share** (a different base, but the same downward direction) [5].\n- **Digital overtook TV as the single largest medium** for the first time in 2025 on dentsu, Madison-expanded, and FICCI-EY counts [5][3][10].\n- The rest of traditional (dentsu base): **print Rs 16,594 cr (14%), OOH Rs 4,724 cr (4%), radio Rs 1,501 cr (1%), cinema Rs 935 cr (1%)** [5].\n- The bridge category: when CTV is added to linear, **\"Large Screen\" (TV+CTV) = Rs 38,855 crore, ~+4%, with CTV alone doubling to ~Rs 6,000 crore** in 2025 (Madison) [8]. For 2026 Madison forecasts Large Screen ~Rs 40,855 cr (+5%) with CTV ~Rs 8,000 cr even as linear TV stays flat [8].\n\nSo the honest framing is not \"TV is dying\" but \"**linear TV is shrinking ~5%/yr while its CTV extension is doubling**, and the combined large screen is roughly flat-to-up-slightly.\" TV's *decline* feeds digital's *gain* only at the margin. Most of digital's growth comes from commerce media and the long tail, not from cannibalizing TV.\n\nCTV detail (FICCI-EY, the primary CTV source): **CTV ad revenue Rs 9,900 crore in 2025, +42%; ~68 million CTV households, ~40 million weekly-active (up from 30M in 2024)** [10][22]. (Madison's Rs 6,000 cr \"CTV\" and FICCI-EY's Rs 9,900 cr differ on what counts as CTV inventory — another definitional gap.) YouTube CTV leads viewership with **60M+ Indians watching YouTube on connected TVs**, followed by **JioHotstar** [22][23]. The deeper CTV and YouTube treatment comes later, in the chapter on programmatic and connected TV; here it matters as the place where TV budgets and programmatic digital converge.\n\n---\n\n## 8. Top Categories and Advertisers (2025)\n\n**Categories (digital):** FMCG leads at **32% / Rs 23,243 cr**, with e-commerce the other anchor; auto, BFSI, and D2C scaling behind [14]. FMCG's digital intensity rose to 64% of its media budget; auto's to 44% [14].\n\n**Top advertisers (PMAR 2026):** **Hindustan Unilever (HUL) remained India's largest advertiser at Rs 4,000–4,500 crore**; **Cadbury India (Mondelez brand) moved to #2 at Rs 1,300–1,400 cr**, with **P&G** in the same band; **Coca-Cola India, Reckitt Benckiser, Swiggy, and Nestlé India** each in the **Rs 1,100–1,200 cr** range; **Google, Samsung India, and Eternal Ltd (Zomato)** also in the top cohort [24]. The 2025 top-10 saw a \"change of guard\": Reliance Industries, Maruti Suzuki, Dream11, Amazon Online India, Mondelez and Godrej Consumer dropped out vs 2024, while Cadbury, Coca-Cola, Swiggy, Nestlé, Samsung and Eternal entered [24]. That **Swiggy and Eternal (Zomato)** — two food/q-comm platforms — now sit among the *largest* advertisers is itself a marker of the commerce-media era. **Maruti Suzuki remained the #1 print advertiser** [14].\n\n*A note on the named advertisers and entities:* HUL, P&G, Coca-Cola India, Nestlé India, Reckitt, Samsung India, Google, Swiggy, and Eternal Ltd (the renamed Zomato parent) are all live, active advertisers per the PMAR 2026 report dated Feb 2026 [24] — current as of mid-2026. \"Eternal Ltd\" is the current corporate name for the Zomato/Blinkit parent; \"Mondelez\" markets the \"Cadbury India\" entity. These names go stale via rebrands (Zomato→Eternal already happened).\n\n---\n\n## 9. The 2026 Outlook\n\nThe full forecast comes later, in the outlook. For the immediately-current 2026 view, all houses agree: **single-digit-to-low-double-digit total growth, led entirely by digital**. dentsu: total to **Rs 1,30,416 cr (2026)** and Rs 1,40,001 cr (2027), a 7.41% CAGR, with **digital to 70% of adex by 2027 (Rs 98,034 cr)** [5][25]. Madison expanded: **Rs 1,74,605 cr (2026), digital ~64%** [2][1]. WPP Media: **Rs 2,01,891 cr (2026), digital 68.1%**, with **commerce-led advertising the fastest-growing segment at +24.2%** [8][9]. dentsu's medium forecast: **TV from 21%→18%→15%** and **print 14%→12%→10%** across 2025-27, with **OOH the only traditional format growing** (~3% CAGR, helped by digital OOH) [25]. Business Standard's read of the 2026 outlook: \"marginal, digital-led growth\" [26].\n\n---\n\n## Open Questions\n\n1. **Which definition will become the market standard?** Madison's expanded series and FICCI-EY's framing both pull the long tail and commerce media in; dentsu and the legacy series leave parts out. If the industry converges on the broad definition, the \"digital share\" story is partly a measurement artifact, not a behavioral one. Unresolved.\n2. **What is YouTube India's actual ad revenue?** Alphabet does not disclose it; every India figure is an estimate. This is a real gap — the second-largest video platform's India revenue is genuinely unknown from primary sources.\n3. **Is JioStar/JioHotstar a genuine \"third force\"?** The framing exists in trade press but I could not verify a hard ad-revenue figure (source 403'd). Needs a primary or filed number.\n4. **Do the CTV figures reconcile?** Madison (~Rs 6,000 cr) and FICCI-EY (Rs 9,900 cr) disagree by ~65% on 2025 CTV ad revenue — a definitional gap (what inventory counts as \"CTV\") that the chapter on connected TV takes up.\n5. **How durable is quick-commerce ad growth?** Rs 4,900 cr forecast for 2026 assumes the q-comm GMV boom continues; q-comm GMV forecasts themselves span $6.6B–$13B by 2029-31 across houses. The ad layer rides on contested GMV assumptions.\n6. **Meta India FY25 ad revenue** is an analyst estimate (~Rs 28,000 cr), not a filed figure — needs the MCA filing or Meta's India entity accounts to confirm.\n\n---\n\n## Sources\n\n1. exchange4media, \"PMAR 2026: India's Rs 1.55 lakh crore ad market is already 60% digital,\" Feb 2026. https://www.exchange4media.com/advertising-news/pmar-2026-indias-rs-155-lakh-crore-ad-market-is-alread
