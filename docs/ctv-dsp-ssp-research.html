<script id="corpus-data" type="application/json">{"slug": "ctv-dsp-ssp-research", "title": "Who Keeps the Spread", "subtitle": "Programmatic CTV's DSPs and SSPs — and where the margin really sits for a platform-agnostic intermediary", "author": "", "generated": "2026-06-19", "documents": [{"order": 0, "file": "00_Briefing.md", "title": "DSPs & SSPs for Programmatic CTV: A Briefing", "summary": "", "body": "# DSPs & SSPs for Programmatic CTV: A Briefing\n\n> **Bottom line.** The clean split between buy-side (DSP) and sell-side (SSP) platforms — born ~2007–2013 — has dissolved. By 2026 SSPs sell to buyers (PubMatic Activate, Magnite ClearLine, Index Marketplaces) and DSPs buy from publishers (The Trade Desk OpenPath, Yahoo Backstage), and curation is how the majority of programmatic now transacts. For a platform-agnostic, ACR-activating, margin-capturing CTV intermediary, no single platform is \"best\"; the eight differ enormously in how much margin-bearing landscape they let an outside party work. The durable position is **curator-on-a-neutral-rail** — own deal creation and ACR-data attachment on a transparent, DSP-agnostic exchange while keeping spend free to move across the scaled DSPs and the indispensable supply SSPs. The undifferentiated take rate — margin for invisible arbitrage — is dying under log-level data, principal-buying disclosure, the ANA benchmark, and Amazon's sub-2%-tech-fee floor. The differentiated take rate — margin for proprietary ACR targeting, owned deals, curation you control, and demonstrable performance — survives, but the seat is now **contested from both sides**: SSP curation from below, holding-company principal media and brand in-housing from above.\n\n## How the stack got here\n\nProgrammatic began as a tidy three-body system — a DSP bidding for buyers, an SSP yielding for sellers, an exchange between them. Header bidding (2015–2019) shattered the publisher waterfall and put the first lasting pressure on take rates; TV budgets then poured into CTV from ~2018, and CTV proved structurally deal-and-PMP-heavy — a small premium-publisher universe (the top ~10% is roughly 40 CTV sellers) that refuses to commoditize scarce inventory. Supply-Path Optimization taught buyers to consolidate onto fewer paths and, in doing so, handed SSPs a direct line to the buyer. The result is the 2023–2026 convergence, and the bluntest tell is Microsoft sunsetting its Xandr Invest DSP (February 2026) while keeping its sell-side Curate and Monetize. The history hands an agnostic intermediary one instruction above all: **deal-centricity is its friend** — a market that transacts through PMPs and curated deal IDs has seams, and an intermediary captures margin in seams — but the transparency tide is rising, and it sets a deadline on any margin that depends on opacity.\n\n> 💡 **A note on names.** \"Beeswax\" no longer exists under that name: Comcast's FreeWheel rebranded it (April 29, 2025) to **FreeWheel DSP** + **FreeWheel Buyer Cloud**. Any contract or integration should use the FreeWheel names.\n\n## The eight platforms — dimension matrix\n\nTwo families, now blurring. **Sell-side / curation:** Index Exchange, Magnite (and its buy-side tool ClearLine), PubMatic. **Buy-side / DSP:** The Trade Desk, Yahoo DSP (independent generalists), Amazon DSP (walled garden), FreeWheel DSP / Buyer Cloud (the former Beeswax, a Comcast-owned bidder-as-a-service platform).\n\nRatings are **fitness for *this* model** (not absolute quality): ●●● strong / ●● moderate / ● weak. \"Self/managed alignment\" rates whether the platform *avoids* competing with the intermediary for the same managed budget.\n\n| Platform | Type | 1·CTV supply | 2·Fee transparency | 3·ACR/3P activation | 4·Deal & curation | 5·Self/managed alignment | 6·Clean room/identity | 7·Log-level data | 8·Margin-capture fit |\n|---|---|:--:|:--:|:--:|:--:|:--:|:--:|:--:|:--:|\n| **Index Exchange** | SSP / curation | ●● | ●●● | ●●● | ●●● | ●●● | ●● | ●● | ●●● |\n| **Magnite** | SSP | ●●● | ●● | ●● | ●●● | ●●● | ●● | ●● | ●● |\n| **ClearLine** (Magnite) | SSP buy-side tool | ●● | ●● | ●● | ●●● | ●● | ●● | ●● | ●● |\n| **PubMatic** | SSP / curation | ●● | ●● | ●●● | ●●● | ●● | ●● | ●● | ●● |\n| **The Trade Desk** | Independent DSP | ●●● | ● | ●● | ●● | ●●● | ●●● | ●●● | ●● |\n| **Yahoo DSP** | Independent DSP | ●● | ●●● | ●● | ●●● | ●● | ●●● | ●● | ●● |\n| **Amazon DSP** | Walled-garden DSP | ●●● | ● | ● | ● | ● | ●● | ● | ● |\n| **FreeWheel / Beeswax** | Specialized DSP / BaaS | ●● | ●●● | ●●● | ●● | ●●● | ●● | ●●● | ●●● |\n\n*Two cells the dots can't carry: The Trade Desk's fee opacity (●) is, perversely, room for a reseller to embed spread even as it scores worst for explaining costs to a client; Amazon's headline DSP tech fee is actually low (~1–2% on third-party media), yet its total economics — managed minimums, owned-and-operated self-preferencing, pre-auction deductions, no raw logs — make it the least margin-friendly seat overall. Yahoo's log-level (●●) reflects that the partner-gated **Yahoo Measurement Feed** exists; it is conditional, not absent.*\n\n## Current state: positives vs. negatives\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Where the CTV programmatic dollar goes (Q3 2025, including CTV)<\/div><svg viewBox=\"0 0 700 172\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">20<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">40<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">60<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">80<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">Reaches the publisher (sel…<\/text><rect x=\"185\" y=\"8\" width=\"423.9\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"616.9\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">76.2%<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">SSP platform cost<\/text><rect x=\"185\" y=\"42\" width=\"71.2\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"264.2\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">12.8%<\/text><text x=\"175\" y=\"92\" font-size=\"13\" text-anchor=\"end\">DSP platform cost<\/text><rect x=\"185\" y=\"76\" width=\"33.4\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.10s\"/><text x=\"226.4\" y=\"92\" font-size=\"12.5\" class=\"t-muted\">6%<\/text><text x=\"175\" y=\"126\" font-size=\"13\" text-anchor=\"end\">DSP data cost<\/text><rect x=\"185\" y=\"110\" width=\"15.0\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.15s\"/><text x=\"208.0\" y=\"126\" font-size=\"12.5\" class=\"t-muted\">2.7%<\/text><\/svg><figcaption>The visible &#x27;ad-tech tax&#x27; is falling and shifting composition — SSP fees down, DSP data fees up — but ~24% still does not reach the publisher. <span class=\"credit\">Source: ANA Programmatic Transparency Benchmark, Q3 2025 (Tier 2/5, LLD-grounded; participation-funded — not disinterested).<\/span><\/figcaption><\/figure>\n\n\n\n**Index Exchange — the neutral curation rail.** The cleanest fee posture in the set: a single publisher-side media share, **no separate data-marketplace fee**, data vendors keep 100% of segment revenue, and the most direct third-party ACR path via the **Samba×Index agentic-curated marketplace** (Dec 2025, 50+ countries). Not the CTV supply leader, and sell-side decisioning concentrates control with the exchange. *Role:* activate licensed ACR sell-side **and set your own disclosed margin** while keeping optionality.\n\n**Magnite — the indispensable supply partner.** The largest independent CTV SSP, with direct Disney/Netflix/Roku/NBCUniversal relationships and SpringServe. You transact *through* it rather than capturing spread *within* it, except via curation. *Role:* a must-use supply node; capture margin through curation/ClearLine on top.\n\n**ClearLine (Magnite) — fee compression on Magnite's supply.** A DSP-free buy-side path unifying curation and activation (Oct 2025, ~109M households), claiming **\"+20% working media vs DSP\"** — but that figure is *unverified vendor framing*, and ClearLine locks the intermediary into Magnite's supply. *Role:* a margin-compression vehicle for the Magnite slice of the book, not an agnostic spine.\n\n**PubMatic — the most full-featured single-vendor stack.** Connect (curation, 190+ data partners) feeding Activate (non-bidded, DSP-free), AgenticOS, and a claimed **+37% CPM** applying data sell-side vs buy-side — a *vendor figure presented without methodology*. The least agnostic — Activate ties spend to PubMatic supply. *Role:* a strong sell-side ACR venue when its supply fits, not a neutral rail.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Curation fee structures across curated deal IDs (April 2025)<\/div><div class=\"viz-donutwrap\"><svg viewBox=\"0 0 220 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"cv-spin\"><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t1\" stroke-width=\"42\" stroke-dasharray=\"223.96 228.43\" stroke-dashoffset=\"-0.00\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t2\" stroke-width=\"42\" stroke-dasharray=\"152.29 300.10\" stroke-dashoffset=\"-223.96\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t3\" stroke-width=\"42\" stroke-dasharray=\"44.79 407.60\" stroke-dashoffset=\"-376.24\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t4\" stroke-width=\"42\" stroke-dasharray=\"31.35 421.04\" stroke-dashoffset=\"-421.04\" transform=\"rotate(-90 110 110)\"/><\/g><\/svg><div class=\"viz-legend viz-legend-col\"><span><i style=\"background:var(--t1)\"><\/i>Zero incremental fee <b>50%<\/b><\/span><span><i style=\"background:var(--t2)\"><\/i>Margin-based (median ~14%) <b>34%<\/b><\/span><span><i style=\"background:var(--t3)\"><\/i>CPM-based <b>10%<\/b><\/span><span><i style=\"background:var(--t4)\"><\/i>Static-price (can exceed 50%) <b>7%<\/b><\/span><\/div><\/div><figcaption>Curation relocates the ad-tech tax more than it abolishes it — about half of curated deal IDs carry no extra fee; the opaque &#x27;static-price&#x27; tail can exceed 50% margin. <span class=\"credit\">Source: Jounce Media, April 2025 (Tier 5; reported via AdExchanger).<\/span><\/figcaption><\/figure>\n\n\n\n**The Trade Desk — the unavoidable performance-and-scale workhorse.** The deepest independent CTV pool ($13.4B gross spend, 2025; CTV its largest channel); **self-service only — never your managed-service competitor** (the cleanest alignment); **REDS raw event-level data** for independent auditing (decisive); portable UID2/EUID identity. Against it: the deepest, most opaque fee stack (~20% headline, plausibly ~29%+ effective); OpenPath removes post-auction give-backs; Koa AI on by default; Ventura/OpenPath drift toward owning the whole chain. *Role:* anchor for scale and performance; license REDS, audit everything, override the AI where your optimization wins.\n\n**Yahoo DSP — the transparency-and-identity hedge.** Genuine fee/data transparency (first DSP to adopt IAB Data Transparency Labels — though *not* \"first to give full LLD to the ANA benchmark\"); \"speed not AI\" with the Blueprint optimizer optional; **ConnectID identity scale (213M US / 345M global)** for ACR/first-party activation; an open, inspectable curation suite. It *does* offer an event-level feed (the partner-gated Yahoo Measurement Feed), narrower open-market scale than TTD, *can* itself offer managed service, and — the central flag — **Apollo ownership with exploratory 2025 sale interest = continuity risk.** *Role:* the philosophical-fit hedge and identity alternative; don't make it a single point of dependence.\n\n**Amazon DSP — must-use, never-trust.** The only programmatic path to the *authenticated* ~80M-household Roku + Fire TV reach (the June 2025 Amazon–Roku exclusive binds the **identity layer, not all of Roku's inventory**, as the chapter on Roku's buy-side stack details) plus Prime Video; AMC clean room broadly open (Sept 2025). Against it: a walled garden — no published take rate, **no log-level data**, ACR demoted to a seed list, an owned-and-operated self-preferencing incentive, and exclusivity that holds the authenticated-reach slice captive. *Role:* a **sink** for spend that demands its exclusive reach — never the spine.\n\n**FreeWheel / Beeswax — the structurally best fit.** Built around **owned bidding (BYOA), full log-level data ownership, and transparent BaaS economics** — so a licensed ACR dataset can be the *brain* of the buy; premium publisher heritage plus a unique **biddable-linear PMP** (Oct 2025). The asterisk is parent gravity: Comcast is owner + premium publisher + DSP/SSP, and the chapter on Comcast's Universal Ads sharpens it — Comcast *also* runs **Universal Ads**, a free, self-serve, no-spread SMB buying tool that is hostile to a margin intermediary. So Comcast is friendly to the intermediary as a Buyer Cloud *infrastructure customer* and hostile as a *margin layer*. *Role:* a primary spine candidate — use the parent's inventory while owning your tools, data, and identity.\n\n> ⚠️ **Where this gets contested.** The sell-side thesis rests on a performance lift (PubMatic's +37% CPM; the \"25–40% reach lift\") that originates with interested parties and is hard to audit precisely because the log-level data needed to check it is withheld. And the ANA's headline figures, while the best public data, come from a small, self-selecting, participation-funded cohort. Treat the *direction* (margin relocates; LLD closes gaps; CTV carries the waste) as solid and the *exact magnitudes* as order-of-magnitude.\n\n## Forecast (brief)\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Programmatic-CTV landscape scenarios through 2028 (likelihood of becoming a defining feature)<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">A · Curation eats the stack<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"356.9\" y=\"8\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"413.9\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">35–45%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">B · The pincer (margin com…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"332.3\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"389.4\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">30–40%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">D · Walled-garden gravity …<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"258.6\" y=\"80\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"315.8\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">15–25%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">C · Agentic routing commod…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"234.1\" y=\"116\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"291.2\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">10–20%<\/text><\/svg><figcaption>Overlapping dominant modes, not mutually exclusive — the realistic 2028 blends A and B. Taken up in the outlook. <span class=\"credit\">Source: Synthesis of the analysis that follows; probabilities derived from base rates and driver decomposition, as no liquid market exists.<\/span><\/figcaption><\/figure>\n\n\n\nThe master-trend through 2028 stays the **collapse of the buy/sell line**. **Scenario A (35–45%, modal): curation eats the stack** — sell-side decisioning becomes the default CTV mode, and the intermediary thrives only if it becomes the curator on a neutral rail. **Scenario B (30–40%, widened): the pincer** — log-level data, principal-buying disclosure, and Amazon's low fee floor make the undifferentiated spread legible *while* SSP curation, holdco principal media, and in-housing squeeze the seat from both sides; the differentiated take rate survives as a shrinking, two-front niche. **Scenario D (15–25%, narrowed after the Roku correction): walled-garden gravity** — Amazon and the streamers pull premium CTV into closed/PG environments, but less totally than first thought, since Roku stays DSP-interoperable. **Scenario C (10–20%): agentic routing commoditized** — advertisers' own agents route path-agnostically, collapsing the routing service into the protocol layer; slower than vendors project. Beyond the scenarios sit three **tail risks to the ACR-margin model specifically**: Samba/ACR concentration (the model rests on one graph; *multi-source it*), the legal durability of ACR under VPPA/privacy law, and a Google AdX/DFP remedy wildcard.\n\n## Verdict: which platforms best serve a DSP/SSP-agnostic margin-capture model\n\nNo single winner — a portfolio with defined roles.\n\n- **Build the margin-bearing spine here.** **FreeWheel Buyer Cloud** (owned bidder, full log-level data, ACR-as-decisioning; asterisk: the Comcast/Universal-Ads conflict) and **Index Exchange** (the neutral curation rail — no separate data fee, the cleanest place to activate licensed ACR sell-side and set a disclosed margin).\n- **Indispensable; transact deliberately.** **The Trade Desk** (unavoidable scale and performance, non-competing self-service, REDS auditability — audit the fee stack, override the AI) and **Magnite** (the supply you cannot route around — capture via curation/ClearLine on top).\n- **Use for specific jobs.** **Yahoo DSP** (transparency + ConnectID identity hedge; watch the ownership risk), **PubMatic** (full-featured sell-side ACR activation when its supply fits; least agnostic), **ClearLine** (fee compression on Magnite supply; not an agnostic spine).\n- **A sink, never a home.** **Amazon DSP** — take the authenticated Roku/Prime Video reach when a campaign demands it, price it as access-and-performance, never make it the spine.\n\nThe throughline: against a field of platforms each drifting toward owning more of the chain — and a seat now pressed from below by curation and from above by principal media and in-housing — **optionality is the intermediary's last durable margin lever**, and the margin that survives 2028 is paid for visible data and outcomes, not invisible arbitrage.\n\n## What This Account Can't Settle\n\nA few figures here rest on disclosures the parties have not made and on vendor numbers that cannot be independently audited. The performance lifts the sell-side thesis leans on come from interested parties, and several take rates — Yahoo's actual number, FreeWheel's cut, Amazon's true total economics — remain undisclosed. Treat those magnitudes as order-of-magnitude rather than precise. The sharpest open questions: whether sell-side activation's lift is real or relocated, how long the Amazon–Roku *identity* exclusivity holds, whether the agentic mediation layer is a seat or a utility, and whether the intermediary can multi-source ACR before any tail risk fires.\n\n## What follows\n\nThe chapters ahead trace how the stack converged and the buy/sell line blurred; profile the independent DSPs (The Trade Desk, Yahoo) and then the walled-garden and specialized DSPs (Amazon, FreeWheel/Beeswax); turn to sell-side and curation (Index, Magnite/ClearLine, PubMatic); and work through the margin economics — fees, take rates, transparency — alongside ACR data, identity, and clean rooms, and the drivers of competitive dynamics. From there the account widens to Comcast's Universal Ads, Roku's buy-side stack, rival intermediaries and the in-housing counter-case, the measurement and currency layer, Google's ad-tech antitrust remedies, Samba's going-concern and ACR-concentration risk, and the VPPA/privacy questions around the legal durability of ACR — closing with the outlook."}, {"order": 1, "file": "00_Start_Here.md", "title": "DSPs & SSPs for Programmatic CTV — Start Here", "summary": "Buying and selling streaming-TV ads used to be two separate jobs done by two separate machines; that wall has fallen, and a middleman who wants to keep a cut now has to earn it from data and results, not from being hard to see through.", "body": "# Start Here\n### Who keeps the spread on a streaming-TV ad\n\n## The wall in the middle fell down\n\nPicture a farmers' market with a fence down the middle. On one side, buyers with cash. On the other, sellers with tomatoes. What built the fence was plumbing: for years the buying software and the selling software spoke through pipes only a middleman had wired up, so a buyer couldn't just walk over and deal with a seller directly — the wiring ran through the broker. In the gap between them stands that broker, taking a coin from every basket that changes hands, because for a long time only he could reach across.\n\nFirst, the thing nobody ever tells you: every time a streaming show pauses for an ad, a lightning-fast auction happens in the background. Dozens of advertisers bid for that one empty slot, and a winner is picked, in less time than it takes the ad to appear on your screen. It runs invisibly, billions of times a day. Once you can see those hidden auctions, the rest makes sense.\n\nFor fifteen years, online advertising worked like that fence. On the buying side sat the **DSP** — the demand-side platform, the software an advertiser uses to buy ad space automatically, deciding in that split second which ad to show which viewer and what to bid. On the selling side sat the **SSP** — the supply-side platform, the mirror image, the software a publisher like a streaming app uses to run the auction for each empty ad slot and hand it to the highest bidder. Buyers used DSPs, sellers used SSPs, and money flowed across the fence in between.\n\nTwo ways of buying grew up on top of those auctions, and the difference matters later. Some ad slots go to a wide-open auction anyone can bid in. Others are sold in private, invitation-only deals arranged ahead of time between a particular buyer and seller — a public free-for-all versus a reserved table.\n\nThe one idea to carry through everything that follows is this: **the fence is gone.** The pipes got rewired. Buying software and selling software can now talk to each other directly, so sellers sell straight to buyers, buyers buy straight from sellers, and the old spots where a middleman could quietly take a coin are being lit up one by one. This is a story about eight of those buying-and-selling machines — and about how a broker who wants to keep a cut can still earn one once the fence he depended on has fallen.\n\n## Why anyone should care about a plumbing fight\n\nFollow one hundred dollars a brand spends to run an ad on a streaming show. Roughly seventy-six of those dollars reach the company that actually made the show. The other twenty-four are eaten along the way by the machinery — the auction software, the data fees, and the brokers, who are just one of several mouths biting into that twenty-four, not the whole of it. (The fight later in this story is over the broker's slice, not all twenty-four cents.) That gap is real money: streaming-TV ads in the United States are about a **thirty-three-billion-dollar** business a year, and climbing past old-fashioned cable and broadcast around 2028.\n\nFor years, a big slice of that twenty-four percent was invisible. Nobody could see exactly who took what. That was a fine business to be in — if you were the one taking it. Now the lights are coming on. New tools let a buyer trace every dollar. A giant new competitor is charging almost nothing for the same plumbing. And that changes who gets paid, and for what. If you sell things and buy streaming ads, this is the difference between paying for a service and paying a toll to a stranger you can't see.\n\n## The cast: eight machines and one broker\n\nAlmost everyone in this story is trying to be a broker on that streaming-TV market — to stand in the flow of ad dollars and keep a slice, the **take rate**, the cut a middleman keeps as money passes through. The eight machines split into two old families that are now blurring together:\n\n**The sellers' machines (SSPs), moving toward buyers:**\n- **Magnite** — the biggest independent seller of streaming ad space; the supply you can't route around, with direct lines to Disney, Netflix, Roku, and others.\n- **Index Exchange** — a seller's machine run as a clean, neutral rail: it takes one honest cut and, unusually, charges no extra fee for attaching audience data.\n- **PubMatic** — the most feature-packed seller's stack, but the one that most ties your spending to its own inventory.\n- **ClearLine** — Magnite's tool that lets a buyer skip the buying machine entirely and reach straight into Magnite's shelves.\n\n**The buyers' machines (DSPs), moving toward sellers:**\n- **The Trade Desk** — the largest independent buying machine, unavoidable for reach and results; it never competes with you as a rival middleman, but its fees are the hardest to see.\n- **Yahoo DSP** — the transparency-and-identity option: it explains its costs and knows who a huge number of viewers are, but its owner has flirted with selling it.\n- **Amazon DSP** — a **walled garden**: a giant that keeps its audience and tools inside its own private walls. (A different wall from the market fence that fell: that one separated buyers from sellers and came down, while a walled garden is one company's fence around its own audience, kept up on purpose because it's worth money.) It owns the only path to a vast, verified streaming audience — and shows you almost nothing about what it charges.\n- **FreeWheel** (once called Beeswax) — Comcast's build-your-own buying machine: you can bring your own bidding brains and keep every scrap of the raw records.\n\nOne more character matters. **ACR** — automatic content recognition, the feature in a smart TV that watches what's on its own screen and reports back what you watched. A broker's best claim to a fair cut is that it can aim ads using this rare viewing signal, licensed mostly from one company, **Samba TV**. Hold onto ACR; it's the hinge of the whole argument.\n\n## Follow one dollar through the machine\n\nHere is how a broker actually keeps a coin, step by step.\n\nA brand hands its budget to the broker and says: reach people who watched cooking shows last week. The broker holds a license to ACR data — it knows, household by household, who those viewers are. The old way: pour the money into a buying machine, attach the audience data there, and pay that machine a fee on top of a data fee. Simple, and easy to skim.\n\nThe new way flips the order. Instead of attaching the audience on the buying side, the broker packages it *on the selling side*: it bundles specific ad slots together with the viewer list into a single ready-made deal. Bundling slots and an audience into a pre-built deal like this has a name — **curation**. And each deal gets a label so buyers can find it: a **deal ID**, basically a short code, like a reservation number, that any buying machine can type in to grab exactly that bundle. The pre-built deal and its deal ID are the same thing seen two ways — the package, and the code that points at it. That code is now a product the broker built and owns. And it's one of those private, invitation-only deals, not the open auction — which is where the fence-fall pays off, because about **seventy percent** of streaming ad-buying now flows through the private kind. So the broker who *builds the deals* isn't in a backwater. Picture where he stands now: with the fence gone, he has walked over to the sellers' side and set up shop next to the shelves, packaging the goods. He no longer guards a gate between two sides; he stands beside the seller, and his product is the deal itself.\n\nThe dollar then rides through whichever machine is cheapest and cleanest — Index's neutral rail to set an honest, disclosed cut; FreeWheel's build-your-own bidder to run the ACR data as the actual brain of every bid. The broker keeps a margin. But now — and this is the part that used to be hidden — the buyer can often *see* that margin. So the cut has to be for something real: the audience list only the broker holds, the deals only the broker built, the results the broker can prove. One place the market picture stays loose — there's no single tidy marketplace with one broker beside one seller, but thousands of those split-second auctions firing at once, with many brokers elbowing for the same spot beside the shelves. But the shape holds: the broker earns by owning something scarce in the open flow, not by owning a gate nobody can get past anymore.\n\n## The fight: is the middleman's cut earned or just relocated?\n\nSmart people in this business genuinely disagree about one thing, and the whole future turns on it.\n\n**One side says the cut is now earned.** Move your audience data to the selling side, close to the moment the ad shows, and the ad performs better. Ad prices here are always quoted per thousand views — that's the standard yardstick in this business, the way gas is priced per gallon — and one seller's machine claims its method lifts that price by more than a third. If that lift is real, a broker who curates deals is adding worth, not just taking a toll, and deserves its margin.\n\n**The other side says the cut just moved to a new hiding place.** Curation, they argue, mostly relocates the same fees to a spot that's harder to audit — and the reason the performance lift is hard to disprove is that the raw records needed to check it are exactly the records the sellers won't hand over. Roughly half of curated deals add no extra fee at all, but a small tail quietly charge more than fifty percent.\n\nWhere does the evidence lean? Toward a split verdict. The honest reading: the *invisible* cut — margin paid for being hard to see through — is dying, squeezed by better tracking tools, by rules forcing brokers to admit when they've quietly bought ad space with their own money and resold it to you at a markup rather than just arranging the deal for a stated fee, and by Amazon charging as little as one to two percent for the same plumbing. The *visible* cut — margin paid for proprietary data, deals you built, and results you can prove — survives. But even that surviving seat is now pressed from two sides at once: sellers' machines absorbing the broker's job from below, and giant ad-buying agencies and brands doing it in-house from above.\n\n## Where it's heading, and what to watch\n\nNobody knows the exact finish, and anyone selling false precision is selling something. Three honest sketches through 2028:\n\n**Most likely — curation eats the stack.** Building deals on the selling side becomes the normal way streaming ads trade. The broker thrives only by becoming the deal-builder on a neutral rail, owning the audience and the deal, charging a cut it will state out loud.\n\n**Nearly as likely — the squeeze.** The invisible margin becomes legible everywhere and the pressure comes from both sides; the middleman survives as a smaller, sharper specialist paid for data and outcomes, not for standing in a doorway.\n\n**Less likely, but real — the gardens win.** Amazon and the big streamers pull the best inventory behind their fences, where a broker can place a dollar but can't keep a spread. This one looks narrower than it first seemed: Amazon's grip on that huge verified audience is a lock on knowing *who the viewer is*, not on all the inventory.\n\nUnderneath all three sits one fragile assumption worth watching: that the ACR viewing signal stays freely licensable. It leans heavily on one company. If Samba TV were bought, or the law tightened on what a TV may quietly report about what you watch, the broker's best claim to an earned cut could wobble overnight.\n\nThe one line to remember: **when the wall in the middle falls, the middleman who survives is the one who owns something scarce in the open — not the one who owned the gate.**"}, {"order": 2, "file": "01_Evolution_And_Buy_Sell_Blur.md", "title": "Evolution of the Programmatic CTV Stack & the Buy/Sell Blur", "summary": "", "body": "# Evolution of the Programmatic CTV Stack & the Buy/Sell Blur\n\n## Bottom Line\n\nProgrammatic advertising was born on a clean split. Demand-side platforms (DSPs) represented buyers, supply-side platforms (SSPs) represented sellers, and the two met at an ad exchange running a real-time auction. That architecture crystallized roughly between 2007 and 2013. It is now dissolving.\n\nFour forces dissolved it. Header bidding (2015–2019) shattered the publisher waterfall, multiplied auction duplication, and put the first sustained pressure on SSP take rates. Television budgets then began migrating into programmatic Connected TV (CTV) from around 2018 — programmatic now accounts for the large majority of US CTV transactions — and CTV proved structurally private-marketplace-and-deal-heavy rather than open-auction: its publisher universe is small, its inventory premium and scarce, and its sellers refuse to dump it into an anonymous open exchange. Supply Path Optimization (SPO), beginning around 2017, taught buyers to consolidate onto fewer, cleaner, cheaper paths — and in doing so handed SSPs a reason to talk directly to buyers.\n\nThe result is the central fact of 2023–2026: **convergence**. SSPs have built buy-side curation and sell-side decisioning that lets advertisers transact through the exchange without a DSP (PubMatic Activate, Magnite ClearLine, Index Marketplaces); DSPs have built direct-to-publisher paths that route around SSPs (The Trade Desk OpenPath, Yahoo Backstage). The bluntest signal: Microsoft is sunsetting its Xandr Invest DSP by February 28, 2026 while keeping its Curate and Monetize sell-side products — the industry now expects value to accrue on the sell side. A 2025–2026 agentic-AI overlay sits on top of both sides.\n\nThe **why** is consistent across every move: third-party signal loss, take-rate compression, CTV's deal-centricity, and a race to own data activation. But the \"efficiency\" narrative each player uses to justify cutting out the other side hides a quieter truth. A removed fee is usually a relocated fee, and curation has reintroduced an opaque, stackable \"ad tech tax\" under a friendlier name. What follows maps that structural stage. The per-platform chapters that follow ask where, on it, a DSP/SSP-agnostic margin-capture intermediary should stand.\n\n---\n\n## 1. The Clean Split: RTB, Ad Exchanges, and the Birth of DSP vs SSP (≈2007–2013)\n\n### 1.1 The 2007 land-grab for exchanges\n\nModern programmatic begins not with an algorithm but with three acquisitions in a single year. In 2007, Yahoo bought Right Media (April), Google announced its acquisition of DoubleClick for $3.1 billion in cash (April 2007, closed 2008), and Microsoft bought AdECN (August) [1][2]. Each buyer instantly controlled a pool of inventory and a nascent marketplace for trading it. The competitive logic of the next decade — own the pipe, own the auction — was set [2].\n\nWhat they bought was the **ad exchange**: a neutral-ish marketplace where display impressions changed hands one at a time, modeled loosely on a financial exchange. The earliest exchanges — Right Media, AdECN, and DoubleClick's — were first understood as a way to monetize *remnant* inventory, the impressions a publisher could not sell directly [3]. That framing matters. Programmatic entered the world as the clearinghouse for what premium direct sales had left behind. The echoes of that status hierarchy still shape why CTV sellers resist the open auction today (Section 3).\n\n### 1.2 RTB and the two new species: DSP and SSP\n\nAround 2009, the first real-time-bidding (RTB) exchanges went live, Google's DoubleClick Ad Exchange the canonical pioneer [3][4]. RTB is the mechanism: when a page loads, an auction for that single impression runs in the milliseconds before the ad renders, and the highest bidder wins [4]. RTB did something more important than speed up trading. It created two new kinds of business whose entire reason to exist was to sit on opposite sides of that auction [3]:\n\n- The **Demand-Side Platform (DSP)** is software for buyers. It plugs into many exchanges and SSPs, decides which impressions to bid on and how much, applies the advertiser's audience data and budget pacing, and optimizes toward a campaign goal [3].\n- The **Supply-Side Platform (SSP)** is software for sellers. It connects a publisher's inventory to many sources of demand, runs yield management, sets floors, and tries to extract the highest clearing price for each impression [3].\n\nThis is the **clean split**: one piece of software represents the buyer, one represents the seller, and the exchange in the middle is the neutral venue. The tidiness of that arrangement is exactly what makes the present convergence so disorienting. The categories were *defined* by whose interest they served.\n\n### 1.3 The contingent decisions that built the stack\n\nThe companies that became the era's giants were assembled, not born whole. AppNexus, founded by ex–Right Media engineers Brian O'Kelley and Mike Nolet, grew into a hybrid that ran DSP, SSP, and ad-serving functions under one roof — an early hint that the \"clean split\" was a product taxonomy, not a law of nature [5]. Google acquired the DSP **Invite Media** in June 2010 for roughly $81 million and rebranded it as DoubleClick Bid Manager, later DV360 [6][7]. The pattern of these years — Google bundling a leading ad server (DFP, from DoubleClick), a leading exchange (AdX), and a leading DSP under one corporate roof — is the same vertical integration that, fifteen years later, became the subject of US antitrust litigation [2][7]. The point is structural: even in the era of the \"clean split,\" the largest player was already integrated across buy and sell. Convergence was the original condition at Google. The rest of the industry is only now catching up.\n\nBy roughly 2013 the architecture had stabilized into the textbook diagram every ad-tech explainer still draws: advertiser → agency → DSP → ad exchange → SSP → publisher, with a data-management platform (DMP) feeding audience segments to the buy side. Each box took a small fee, and the chain looked rational. The next decade is the story of that chain getting longer, more duplicative, and more expensive — until the buyers revolted.\n\n### 1.4 Where audience data lived — and why that location is now contested\n\nOne feature of the clean-split era deserves special emphasis, because it is the seed of the ACR-activation contest that animates this account. In the 2009–2015 architecture, **audience data lived on the buy side.** The data-management platform (DMP) sat beside the DSP. Advertisers and their agencies loaded first-party CRM data and licensed third-party segments into the DMP, the DMP resolved them against a third-party-cookie identity graph, and the DSP applied those segments when deciding which impressions to bid on. The publisher and its SSP were comparatively *blind* — they sold inventory and let the buyer decide whom it was worth to. The economic consequence followed automatically. Because the buy side held the data, the buy side captured the data-driven premium, and the SSP competed on price and fill.\n\nThat arrangement held only as long as a durable, cross-site identifier — the third-party cookie — let the buy side recognize the same user across the open web. The moment that identifier began to erode (Section 5.4), the buy side's advantage eroded with it, because its whole apparatus assumed a stable identity key it no longer had. The party that still held a reliable first-party, logged-in or device-level signal at the moment of the impression was the publisher — in CTV especially, the publisher and the device. Sell-side curation is, at root, the relocation of the *data* layer from the buy side to the sell side, to follow the identity that survived. Hold this in mind and the 2023–2026 convergence reads not as a fad but as data gravity reasserting itself: the audience premium migrates to wherever the usable identity now lives.\n\n---\n\n## 2. The Header-Bidding Era: Breaking the Waterfall, Multiplying the Auction (≈2015–2019)\n\n### 2.1 The waterfall and its discontents\n\nBefore header bidding, publishers monetized programmatic through the **waterfall**, also called daisy-chaining: the ad server offered each impression to demand sources *sequentially*, ranked by each source's historical average price, stopping at the first one that filled [8]. The waterfall was structurally biased. It \"ignores pockets of high-value inventory and reduces competition,\" because a buyer ranked lower in the chain never got to bid on an impression a higher-ranked buyer took — even if the lower buyer would have paid more for *that specific* impression [8]. Worse, Google's own ad server (DoubleClick for Publishers) ran a feature called **dynamic allocation** that let its exchange (AdX) peek at the waterfall and cherry-pick impressions before rivals could compete — a privileged position publishers and rival exchanges resented [8].\n\n### 2.2 Header bidding levels the field — and detonates the bid stream\n\nHeader bidding was the answer from the publisher and exchange side. Publishers placed a snippet of JavaScript in the header of their pages that solicited bids from multiple SSPs/exchanges *simultaneously*, before the ad-server call, so demand sources competed \"side by side rather than sequentially\" [8]. AdExchanger's June 18, 2015 piece by Sarah Sluis, \"The Rise Of 'Header Bidding' And The End Of The Publisher Waterfall,\" marks the era's arrival; by mid-2015 adoption had \"quintupled over the past year,\" with Index Exchange claiming ~150 publisher partners and Rubicon 50+ [8]. Header bidding raised publisher yield, pushed the market toward first-price auctions, and pressured SSPs toward fee transparency and fee reduction — all wins for sellers, in the short run [8][9].\n\nBut it created a structural problem the buy side was never built to absorb: **auction duplication**. A single impression could now be offered into a dozen exchanges at once, so it arrived at a DSP a dozen times, each as a separate bid request [10][11]. AdExchanger documented both halves of the damage. First, an infrastructure crisis: header bidding \"unleashed a huge infrastructure problem\" as query-per-second volumes exploded, and ad tech would \"either sink or swim\" under the load [10]. Second, a margin crisis on the buy side: if a DSP's economics are tied to impressions purchased, duplication makes it \"pay more to buy the same ads\" while its revenue does not rise, squeezing DSP margins [11].\n\n### 2.3 What it did to SSP economics\n\nHeader bidding's effect on SSPs was double-edged, and it is the hinge for everything that follows. On one hand it democratized access — any SSP could now compete for any impression rather than sit locked in a waterfall slot — which is why the number of SSPs a publisher integrated ballooned [12]. On the other, that same democratization commoditized SSPs and put their take rates under permanent scrutiny: if every SSP sees the same impression, why pay several of them? The race that followed — SSPs differentiating on data, on exclusivity, on direct buyer relationships — is the seed of sell-side curation a decade later. Header bidding made SSPs at once more numerous and more replaceable. The entire convergence story is the sell side's long attempt to become un-replaceable again.\n\nA subtler legacy is worth tracing. The move toward **first-price auctions** changed how every downstream player thought about price. Under the old second-price regime, a winning buyer paid one cent above the second-highest bid, so SSP fees hid inside the gap between first and second price. Under first-price auctions, buyers pay exactly what they bid. That made the *true* clearing price legible — and made every fee taken between the buyer's bid and the publisher's payout newly visible and newly resented. The same first-price transparency header bidding forced is the transparency the buy side later weaponized through SPO, and the ANA now weaponizes through log-level data. The industry has spent a decade discovering exactly how much of a buyer's dollar reaches the publisher, and the intermediaries have spent that same decade obscuring it. Bid shading — DSP-side algorithms that shave a first-price bid down toward the likely clearing price — emerged as the buy-side counter-move, and the cat-and-mouse of shading versus floor-setting is a margin contest layered on top of the fee contest. First price, shading, floors, SPO, log-level data: every step is a chapter in the same long story, the slow and contested exposure of where the money goes.\n\n---\n\n## 3. TV Budgets Migrate to Programmatic CTV — and Why CTV Is Deal-Heavy by Design (≈2018 →)\n\n### 3.1 The scale of the shift\n\nFrom roughly 2018, the budgets that had lived in linear television began moving into programmatic CTV, and by the mid-2020s that migration was the dominant force in the entire programmatic market. US CTV ad spending reached approximately $33.35 billion in 2025 by eMarketer's count (up ~15.8% year over year), and is forecast to surpass traditional TV for the first time around 2028 [13]. The IAB's measure put CTV at $23.6 billion in 2024 (16% YoY growth) [13]. **Programmatic** is now the default mode of CTV trading: roughly three-quarters of CTV transactions are programmatic, and programmatic CTV video spend is variously estimated above $24 billion (2024) and rising past $27 billion (2025) [13]. The ANA's 2025 transparency work found CTV had jumped to roughly **44% of programmatic spend** — no longer a niche but increasingly the center of gravity [14][15].\n\n### 3.2 Why CTV refuses the open auction\n\nThe single most important structural fact for an agnostic intermediary is this: **CTV is private-marketplace-and-deal-heavy by design, not by accident.** Most CTV inventory transacts through programmatic guaranteed (PG) and private marketplace (PMP) deals, not the open exchange. PubMatic estimated in 2023 that around 57% of the then-$65 billion global CTV market — roughly $37 billion — still moved via direct insertion orders rather than programmatically at all [16][17]. The reasons are intrinsic to the medium:\n\n1. **A small, premium publisher universe.** Web display has millions of sites; CTV has dozens of significant programmatic publishers. Yahoo's own analysis found that its top ~10% of demanded publishers amounted to roughly 100 display publishers but only **~40 CTV publishers** — the entire premium CTV supply buyers actually want fits on a short list [18]. With so few sellers, the anonymity and scale logic of the open auction adds little.\n2. **Inventory is scarce and expensive.** A 15- or 30-second non-skippable spot in premium streaming content is nothing like a remnant display banner. Sellers will not commoditize it into an anonymous open auction where they lose price control and brand context [16].\n3. **Brand safety, fraud, and transparency fears.** Buyers regard the open CTV market as opaque \"at best and fraudulent at worst,\" so they prefer PMPs that show where ads run and how they perform [16].\n4. **The medium inherited TV's relationship culture.** TV was always bought through negotiated, guaranteed deals between people; CTV's programmatic plumbing was bolted onto that culture, not the reverse [16].\n\nThe consequence is decisive. In CTV, the **deal** — the PMP, the PG, the curated deal ID — is the native transaction object, and whoever controls deal creation and audience attachment controls the margin. That is exactly the territory sell-side curation moved to seize (Section 5), and exactly why an ACR-data-activating intermediary cares so much about *where* deals are built.\n\n### 3.3 The walled gardens are a separate margin regime\n\nA history of CTV that described only the open-web converging set would mislead, because a large share of premium CTV impressions never touches that set at all. The **walled gardens** — Amazon (Prime Video, plus its exclusive Fire TV and third-party supply), Roku, YouTube, and the device/OS owners — run their own auctions, their own identity, their own clean rooms, and their own pricing, and they expose only what they choose. Amazon's DSP, examined in detail later in the chapter on the walled-garden platforms, is the clearest case: it can buy Prime Video and Amazon-exclusive Roku supply that no open-web DSP or SSP can reach, it resolves identity against Amazon's own logged-in graph rather than a third-party cookie, and it runs measurement inside the Amazon Marketing Cloud clean room on Amazon's terms. The strategic point is that the walled gardens are not merely large publishers. They are **vertically integrated buy-and-sell stacks** that were *born* converged — exactly the integrated condition Google reached in display a decade earlier (Section 1.3). The open-web convergence described in Section 5 is, in part, the independent ecosystem trying to manufacture the same end-to-end control the gardens already enjoy. For an agnostic intermediary, the gardens define the boundary of what is routable: spend inside a garden is spend the intermediary can place, but rarely spend whose internal spread it can capture, because the garden keeps the margin-bearing layers for itself. The competitive question that runs through the chapters that follow is therefore not only \"DSP or SSP?\" but \"open ecosystem or walled garden?\" — and the answer changes with where the audience actually watches.\n\n---\n\n## 4. Supply Path Optimization: Buyers Demand Fewer, Cleaner, Cheaper Paths (≈2017 →)\n\n### 4.1 SPO as the rational response to header-bidding chaos\n\nIf header bidding multiplied the paths from buyer to seller, **Supply Path Optimization (SPO)** was the buy side's deliberate effort to prune them. AdExchanger's AdExplainer (April 25, 2022, Anthony Vargas) dates SPO's first inning to around 2017, \"a few years after the rise of header bidding,\" and defines it as buyers identifying the most efficient connections for transacting with sellers so they can \"avoid inefficient or expensive purchasing routes\" [12]. The principle was simple: a single impression might be reachable through ten different SSPs, and those paths differ in fees, transparency, and quality. SPO is the discipline of choosing the cheapest, cleanest, most direct path — sometimes an entire SSP, sometimes a specific publisher-SSP pairing [12].\n\n### 4.2 Jounce Media and the empirics of the supply chain\n\nSPO turned from slogan into discipline because of measurement. Jounce Media, founded by Chris Kane, crawled tens of thousands of `ads.txt` and `sellers.json` files to map the actual size and directness of the major exchanges, giving buyers fact-based grounds to consolidate [19]. The finding Jounce kept reporting to the market — that buyers \"want to work more deeply with fewer partners\" — became the operating thesis of SPO 1.0 [12][19].\n\n### 4.3 The strategic twist: SPO invited the sell side to talk to buyers directly\n\nHere is the under-appreciated hinge. SPO was a *buy-side* movement, but its logical endpoint was buyers negotiating *directly with SSPs* — often hopping over their own DSP to strike a path deal [12]. Once buyers were willing to call the SSP directly to discuss fees and paths, the SSP had a relationship with the buyer it never had before. SPO, meant to discipline the sell side, instead gave the sell side a seat at the buyer's table. Everything in Section 5 — SSPs building buyer-facing activation tools — is the sell side cashing in that invitation. The efficiency the buyer sought, fewer hops, became the wedge the seller used to cut out the buyer's DSP.\n\n---\n\n## 5. The 2023–2026 Convergence: The Buy/Sell Line Dissolves\n\nThis is the heart of the story. Two pincers close at once. SSPs build buy-side curation and sell-side decisioning that let advertisers transact without a DSP; DSPs build direct-to-publisher paths that route around SSPs. Each side justifies its move with the language of efficiency and transparency. Each side is also, plainly, trying to capture the other side's margin.\n\n### 5.1 DSPs move upstream: direct-to-publisher paths\n\n**The Trade Desk OpenPath (launched February 15, 2022).** OpenPath lets publishers integrate directly with The Trade Desk via a Prebid adapter, so TTD can \"bypass SSPs and bid directly on publisher inventory\" [20][21][22]. CEO Jeff Green framed it as leveling the playing field and removing \"opaque and harmful privileges of the walled gardens,\" and TTD simultaneously announced it would exit Google's Open Bidding by April 15, 2022 [20][21]. Initial partners included Reuters, The Washington Post, Gannett/USA Today, Condé Nast, Hearst, and Nexstar [20]. The critical, less-quoted reading comes from AdTechExplained (February 21, 2022, Trey Titone): OpenPath does not eliminate the fee so much as **relocate** it. TTD \"takes a rev share on media,\" so the supply chain gets shorter but the DSP, not the SSP, now captures the spread [22]. For an agnostic intermediary, that is the whole game in miniature. Disintermediation is rarely free. It transfers margin from one layer to another.\n\n**Yahoo Backstage (announced June 19, 2023; live to all Yahoo DSP advertisers Q3 2023).** Backstage gives Yahoo DSP advertisers a direct path to curated premium publisher inventory, circumventing third-party SSPs by using Yahoo's own legacy SSP technology — deal-ID functionality and Prebid adapters — to connect demand directly to publishers [23][24]. Yahoo deliberately limited Backstage to the **top ~10% of publishers by demand** — roughly 100 display and ~40 CTV publishers — on the logic that only the inventory buyers actually want is worth a direct path [24]. SVP Adam Roodman's framing is revealing: \"Advertisers want to go direct,\" and \"the role of an SSP looks very different in CTV\" given the small publisher universe [24]. By Yahoo's own later account, 82% of Yahoo DSP buyers had tried Backstage at least once and tens of thousands of campaigns ran on it in a single quarter [23]. Backstage's continued operation is supported by Yahoo's own materials through 2024–2025, and the scale figures here are Yahoo-reported.\n\n### 5.2 SSPs move downstream: buy-side curation and DSP-free activation\n\n**Magnite ClearLine (launched April 17, 2023).** ClearLine is a self-service product letting agencies buy premium video inventory directly on Magnite's platform **without a DSP**, repurposing Magnite's SpringServe ad-server technology for buyer access [25][26]. Launch partners were GroupM, Camelot, and MiQ [25][26]. Buying directly through ClearLine, an agency \"pays a single negotiated fee rather than separate DSP and SSP fees\" — the explicit value proposition is fee compression and more dollars to working media [25]. In 2025 Magnite moved to **unify curation and activation within ClearLine**, making it both the place a curator builds an audience-attached deal and the place a buyer activates it [27][28]. GroupM's Andrew Meaden offered the diplomatic version: \"Our aim is not to remove the DSPs… but to provide more buying options\" [25] — language that at once reassures DSP partners and describes cutting them out.\n\n**PubMatic Activate (launched May 8, 2023).** Activate lets brands and agencies buy CTV and online video directly through PubMatic via PG deals and PMPs — explicitly **non-bidded, no real-time bidding, no DSP** [29][30]. It was enabled by PubMatic's September 2022 acquisition of the buy-side measurement/workflow company **Martin** [29]. CEO Rajeev Goel pitched it as collapsing the chain — \"significantly reduce the hops, discrepancies, data proliferation, opacity\" — and sized the target at the ~$65 billion of CTV+OLV still transacted via insertion orders [29][30]. Digiday's framing (May 8, 2023, Ronan Shields) is the canonical statement of the era: Activate debuted \"as the line between demand- and sell-side players continues to blur,\" with SSPs moving downstream to serve buyers directly, \"mirroring how buy-side players like The Trade Desk previously moved upstream\" [30].\n\n**Index Marketplaces and sell-side decisioning (Index Marketplaces debuted 2024).** Index Exchange built a curation/data marketplace on the sell side, letting curators select data from pre-integrated vendors, attach them to deal IDs, and package audiences for publishers — \"shifting control from demand-side platforms to the supply side\" [31]. Index positions this under the banner of **sell-side decisioning**: applying intelligence to an ad opportunity *before* the bid request reaches the DSP [32]. By H1 2025 Index reported Marketplaces adoption \"more than tripling year over year,\" powering hundreds of millions of impressions daily across multiple regions [31]. In October 2025 Index added a **Data Vendor Ecosystem** of ~17 launch data partners (Audigent, Experian, LiveRamp Data Marketplace, Lotame, Peer39, Proximic by Comscore, **Samba TV**, and others), putting third-party audience intelligence directly at the point of sell-side decisioning [33][31]. Index's pointed competitive claim: it \"collects no separate data marketplace fees, only media revenue shares,\" positioning itself as more transparent than rivals that stack a data fee [31].\n\n**The defining sell-side ACR moment — Samba TV joins Index Marketplaces (announced December 3, 2025).** This is the most direct new path for ACR-data activation. Samba TV and Index launched an **agentic-curated media marketplace** that embeds Samba's first-party ACR behavioral/contextual signals directly into Index's Data Vendor Ecosystem, **live in more than 50 countries**, with agentic workflows that activate curated media \"entirely from prompts\" [34][33]. Samba describes contributing data from tens of millions of opted-in TVs and an \"identity spine of over one billion person-level IDs,\" and Index CEO Andrew Casale framed it as \"setting a higher standard of transparency\" [34]. The marketplace was confirmed live as of the December 3, 2025 announcement (Samba TV and Index press releases, plus Advanced Television and TVNewsCheck trade coverage) [34][33].\n\n### 5.3 The bluntest signal: a DSP is killed, the sell side is kept\n\nIf one event proves where the industry expects value to accrue, it is Microsoft's decision to **sunset its Xandr Invest DSP by February 28, 2026** while *retaining and investing in* its sell-side products — the **Curate** curation layer and the **Monetize** SSP [35][36]. Microsoft's own description: the Xandr business had \"three parts… the DSP called Invest, a curation layer called Curate, and an SSP called Monetize,\" and it is the DSP that dies [36]. Xandr's pre-shutdown share was estimated at roughly 6–8% [36]. Microsoft attributed the move to a pivot toward AI-powered/conversational advertising, but the trade press drew the structural reading without hedging: supply-side curation, not buy-side aggregation, is where the next decade's value is now expected to live [37][35]. For an agnostic intermediary, the Xandr decision is a warning and an opportunity at once. Independent DSPs are no longer guaranteed survivors, and the sell side is consolidating power over the deal.\n\n### 5.4 Why convergence is happening — the four engines\n\nThe \"what\" of convergence is two pincers closing. The \"why\" is four reinforcing pressures, and each tells the intermediary where the durable margin will sit.\n\n1. **Signal loss.** The slow erosion of third-party identifiers — even after Google in July 2024 abandoned the forced phase-out of Chrome cookies and reaffirmed that stance in April 2025 — pushed the industry toward authenticated and first-party data [38]. The party with the best *first-party* signal at the moment of the impression holds the advantage, and at that moment the party is the **publisher and its SSP**, not the DSP. Sell-side curation is, at bottom, the sell side monetizing its proximity to publisher and viewing data the buy side can no longer match with cookies [32][38]. AdExchanger's AdExplainer on sell-side curation (May 21, 2024, Anthony Vargas) dates SSP curation products to PubMatic Encore (2020) and Xandr Curate (2021) and ties their rise directly to cookie deprecation, MFA waste, and publishers' need to activate first-party data [39].\n\n2. **Take-rate compression.** Header bidding and SPO drove down per-hop fees and made every intermediary justify its cut. The way to escape a compressed take rate is to capture a *different* layer's: DSPs reach for the SSP's spread (OpenPath) and SSPs reach for the DSP's (Activate/ClearLine). Economically, convergence is a fight over which layer keeps the margin that SPO squeezed out of the chain [22][25].\n\n3. **CTV's deal-centricity.** Because CTV transacts through deals and PMPs rather than the open auction (Section 3), the strategic prize is *control of deal creation and audience attachment*. Sell-side curation is purpose-built to own exactly that object. CTV did not just grow programmatic; it grew the *deal-shaped* part of programmatic that curation is designed to capture [16][39].\n\n4. **The race to own data activation.** AdExchanger's sell-side-curation reporting cited claims of **25–40% reach lift** when audiences are applied on the sell side rather than the buy side, plus avoidance of bid duplication and MFA placements [39]. Whether or not that lift is fully real (it is a curator-friendly statistic — see 5.5), the *belief* in it is reorganizing the market: whoever owns the activation surface owns the audience relationship, the reporting, and the spread. For an ACR-data intermediary, this is the most consequential engine of all — a direct contest over the very activation path the intermediary's economics depend on.\n\n### 5.5 Be critical: who benefits, and where the efficiency story hides a fee\n\nEvery convergence move is sold as removing waste. Sometimes it does. But the agnostic intermediary must hold two skeptical facts firmly in view.\n\n**Disintermediation usually relocates the fee rather than deleting it.** OpenPath shortens the chain but lets TTD \"take a rev share on media\" — the SSP's margin becomes the DSP's, and the advertiser's net cost may not move much [22]. ClearLine collapses two fees into \"a single negotiated fee,\" but that fee is negotiated *with the SSP*, which now holds both the inventory and the buyer relationship [25]. The chain gets shorter. What actually changed is *who keeps the spread*.\n\n**Curation has reintroduced an opaque, stackable \"ad tech tax\" under a nicer name.** The most important corrective in this whole landscape comes from Jounce Media and AdExchanger. Jounce's April 2025 report found that **multi-seller curated deal IDs now make up about 73% of all bidding opportunities**, versus only ~18.6% pure open-auction bids — curation is no longer a niche but the dominant transaction type [40][41]. Jounce identified four fee structures: roughly **50% of curated bid requests carry zero incremental fee**, ~34% use margin-based fees with a **median take rate around 14%** (some reaching far higher), ~10% use CPM-based fees, and ~7% use static-price curation that can produce **margins exceeding 50%** [40][41]. Jounce pegged the **median effective curation margin at ~30%** [41]. AdExchanger's blunt verdict (May 1, 2025, Anthony Vargas): curation fees are \"just the same old ad tech tax\" — the net to the publisher and the gross from the marketer are roughly unchanged, and what curation mostly does is reshuffle who collects the toll [42]. Jounce's sharpest line names the real problem: \"The problem with curation fees isn't that they're high. It's that they're non-transparent… It should not take a forensic analysis of the bidstream to understand the basic economics of a programmatic auction\" [40][41].\n\nThe implication for a margin-capture intermediary is double-edged, and worth stating plainly. On one hand, an opaque, stackable curation fee is *precisely the kind of spread an intermediary can capture* — convergence has built new surfaces on which to charge. On the other, the same opacity that lets the intermediary capture margin is the opacity the ANA and the buy side are mobilizing to *eliminate*, with log-level data as the weapon (Section 6). The intermediary that builds its model on hidden spread is building on the exact ground the transparency movement is trying to clear.\n\n**A note on principal-based buying.** The convergence story has a cousin that sharpens the ethics-and-economics question for any intermediary: the resurgence of **principal-based buying**, in which an agency or intermediary takes title to media inventory as principal and resells it to the advertiser at a margin, rather than acting purely as a disclosed agent on the client's behalf. Principal-based buying is, in effect, an intermediary openly capturing the IO-vs-clearing spread the agnostic intermediary's business lives on — and it has drawn intensifying scrutiny precisely because the advertiser may not see what the intermediary paid versus what it charged. Curation and principal-based buying rhyme. Both insert a re-priced layer between buyer and seller; both are defensible when disclosed and indefensible when hidden. The agnostic intermediary modeled in these pages sits squarely in that contested zone, and the durable version of its business is the one that survives the disclosure the market is moving toward — capturing margin for genuine service (audience activation, campaign performance, supply curation) rather than for opacity alone.\n\n**Who actually benefits, named plainly.** Strip the efficiency language and the beneficiaries are clear. *OpenPath* benefits The Trade Desk, which captures the rev-share an SSP used to take, and large premium publishers, who gain a direct demand relationship; it disadvantages independent SSPs. *ClearLine, Activate, and Index Marketplaces* benefit the SSPs that built them — they capture buyer relationships and data-activation spread DSPs used to own — and publishers seeking first-party-data monetization; they disadvantage DSPs and the independent data/DMP layer. *Curation generally* benefits whoever sits at the deal-creation point and can attach data, increasingly the SSP and the curator, often at the *expense of the publisher's own direct sales team* and of buy-side transparency. The advertiser, in whose name every move is justified, benefits unevenly and frequently last. The ANA's persistent 25%+ transaction cost is the empirical sign that a decade of \"efficiency\" innovations has not yet meaningfully lowered the toll the advertiser pays [15][42].\n\n---\n\n## 6. The Margin Backdrop: What the Transparency Data Says\n\nThis chapter is history, and the economics get their full treatment later, in the chapter on margin economics. But the convergence story is incomprehensible without the economic stakes that drove it, so the load-bearing figures belong here.\n\nThe ANA's Programmatic Transparency Benchmark — built with TAG TrustNet and Fiducia and grounded in impression **log-level data (LLD)** — found in its Q2 2025 reading that roughly **$26.8 billion** in global media value is lost annually to programmatic inefficiency, a ~34% increase from ~$20 billion in 2023 [14][15]. Transaction costs remained \"stubbornly high, consistently above 25% of total spend\" [15]. Media-productivity loss reached ~37.8% of spend in Q2 2025 (up from 32.9% in Q1), and the ANA reported a ~36.5% gap between stated CPM and the true cost of an impression [15]. Critically, the ANA found CTV had risen to ~44% of programmatic spend while showing **lower media productivity** and widening performance gaps — CTV is where the money is going *and* where a disproportionate share of the waste now sits [14][15]. The ANA's prescribed cure is the same instrument that threatens an opaque-spread model: reallocating spend toward higher-quality impressions guided by **log-level data** [14][15]. The throughline to convergence is direct. A market that is 26%+ transaction cost and rising is a market whose buyers will keep hunting for shorter paths — exactly the demand OpenPath, ClearLine, Activate, and Index Marketplaces all claim to satisfy, and exactly the demand each of them partly re-monetizes.\n\n---\n\n## 7. The 2025–2026 Agentic-AI Overlay\n\nOn top of both converging sides, a new layer arrived in 2025–2026: **agentic AI** — software \"agents\" that interpret a natural-language brief, plan a media strategy, and execute the buy with minimal human configuration.\n\n- **The Trade Desk** runs its AI as **Koa**, woven into the **Kokai** platform, plus an \"Open Agentic Kit\" framework intended to let third-party agents interoperate with TTD's infrastructure [43].\n- **PubMatic** went furthest rhetorically, launching **AgenticOS** (January 2026) as an \"operating system\" for agent-to-agent advertising running on NVIDIA-accelerated computing, and in June 2026 added **Decision Fabric** to give partner decision models a native environment inside the supply path [43][44]. CEO Rajeev Goel forecast autonomous AI executing 25% of digital advertising by 2028 and 50% by 2030, and reported running 250+ agentic campaigns since launch [44].\n- **Magnite** embedded its first seller agent inside **SpringServe** in December 2025 and ran an early agentic test with Scope3 as the buyer agent [43].\n- **Index Exchange's** Samba TV marketplace is explicitly \"agentic-curated,\" activating curated deals from prompts [34].\n- **FreeWheel** has piloted an **MCP server** plugged into premium video deals (with PMG) [45].\n\nThe standards layer matters because it is where the agentic overlay either entrenches or dissolves the buy/sell distinction. The **Advertising Context Protocol (AdCP)**, built on Anthropic's Model Context Protocol, was launched by a coalition including Scope3, Yahoo, PubMatic, and others, and IAB Tech Lab formally named its **Agentic Advertising Management Protocols (AAMP)** on February 26, 2026, defining a three-tier agent hierarchy (buyer agents, seller agents, mediation layer) with an Agent Registry [43].\n\nThe critical observation for this history: agentic buying *accelerates* convergence rather than resolving it. An agent that can plan and execute from a prompt does not care whether the inventory comes via a DSP or directly via an SSP's curation layer — it routes to whatever path is cheapest and best-performing. That is precisely the agnostic logic an intermediary already runs, which makes agentic AI at once the intermediary's natural ally (it formalizes path-agnostic routing) and its most direct existential threat (it may let an advertiser's own agent route without paying an intermediary at all). A heavy caveat applies here. The agentic products above are very new, launched within the last 6–18 months, several still in pilot or early-adoption phases, and their present-tense status is the most likely thing in this chapter to change through a quiet pivot, rebrand, or quiet death.\n\nA second observation about the standards layer sharpens the stakes. AAMP's three-tier taxonomy — buyer agents, seller agents, and a mediation layer between them — is striking precisely because it *re-inscribes* the buy/sell distinction the product layer has spent three years dissolving. The protocol designers found that even an agentic future needs *some* representation of \"who is acting for the buyer\" and \"who is acting for the seller.\" That suggests the clean split was never purely an accident of 2009 architecture, but a real, recurring need to know whose interest a piece of software serves. Convergence dissolves the *companies'* positions; the agentic protocols may quietly restore the *roles*. Whether the mediation layer — the place an agnostic intermediary would naturally live — becomes a value-capturing seat or a commoditized routing utility is, as of mid-2026, genuinely unsettled. It is among the most consequential open questions for the intermediary's future.\n\n---\n\n## 8. The Structural Stage on Which the Eight Platforms Now Compete\n\nThe history above sets up the board the per-platform chapters that follow will analyze. As of mid-2026, the \"clean split\" survives only as vestigial vocabulary. The real positions:\n\n- **Index Exchange** — an SSP that has become a sell-side decisioning and curation hub (Index Marketplaces + Data Vendor Ecosystem), now the most prominent third-party ACR-activation path via the Samba TV marketplace, and explicitly differentiating on *no separate data fee* [31][33][34].\n- **Magnite (incl. ClearLine)** — the largest independent CTV SSP, with **ClearLine** as a DSP-free buy-side activation tool that unifies curation and activation, leaning on its SpringServe ad-server heritage [25][27][28].\n- **PubMatic** — an SSP that built a full non-bidded buyer platform (**Activate**, enabled by the Martin acquisition) and has bet hardest on agentic AI (**AgenticOS**, **Decision Fabric**) [29][44].\n- **The Trade Desk** — the dominant independent DSP, which moved upstream with **OpenPath** to bid publishers directly and runs the **Kokai/Koa** agentic stack [20][43].\n- **Amazon DSP** — the walled-garden buy-side platform (taken up later, in the chapter on the walled-garden platforms), whose Prime Video and exclusive supply, AMC clean room, and data restrictions make it a different animal entirely from the open-web converging set.\n- **FreeWheel / Beeswax** — rebranded April 29, 2025: **Beeswax DSP → FreeWheel DSP**, **Beeswax BaaS → FreeWheel Buyer Cloud**, plus a new **FreeWheel Curation Hub**, under Comcast/FreeWheel, with Comcast making **linear TV biddable** via Buyer Cloud (October 23, 2025) [46][47][48].\n- **Yahoo DSP** — a generalist DSP that moved upstream with **Backstage** (direct path to the top ~10% of publishers) and runs a curation suite [23][24].\n\nEvery one of these platforms now does some of what its category was once defined *against*. SSPs sell to buyers; DSPs buy from publishers; both attach data and both run agents. The clean split is gone. What remains is a contest over **who controls the deal, who attaches the audience, who keeps the spread, and who the agent routes through** — exactly the contest an agnostic ACR-data intermediary lives inside, and exactly the contest the chapters that follow evaluate platform by platform.\n\n### 8.1 What history hands the agnostic intermediary\n\nThe historian's job is to make the present legible, not to forecast it (the forecast is taken up in the outlook). But the structural inheritance states cleanly, and it is the lens through which every per-platform chapter should be read.\n\nFirst, **deal-centricity is the intermediary's friend.** A market that transacts through PMPs, PG deals, and curated deal IDs has many seams, and an intermediary captures margin in seams. The open auction is a margin desert; the deal-heavy CTV market is a margin landscape. The eight platforms differ enormously in how much of that landscape they let an outside party work, and that variation — not any single \"best DSP\" — is the practical heart of the analysis.\n\nSecond, **convergence multiplies the surfaces on which to charge, and the parties competing to charge there.** Every new buyer-facing SSP tool and every new publisher-facing DSP path is both an opportunity (a place the intermediary can insert ACR-activated curation) and a competitor (a platform that would rather capture that activation spread itself). The agnostic intermediary's edge is the one thing the platforms cannot be: indifferent to which path wins. A platform must defend its own path; an intermediary can route to whichever path, in a given campaign, delivers the best performance at the best clearing price. That is the performance-plus-spread mandate that defines the model.\n\nThird, **the transparency tide is rising, and it sets a deadline.** Log-level data, first-price legibility, principal-based-buying scrutiny, the ANA's waste accounting, and Jounce's bidstream forensics all push one way: toward a market where every fee is visible. The intermediary whose margin depends on opacity is on borrowed time. The intermediary whose margin is earned by activating licensed ACR data into the best-performing CTV deals — and who can *show* that performance — is built to survive the disclosure the market is bringing. The history hands the intermediary both a rich landscape and a clear instruction: capture margin for service rendered, in the open, before the market forces the openness anyway.\n\nThe chapters that follow take each platform onto this stage and ask, dimension by dimension, where on it an agnostic CTV margin-capture model should actually stand.\n\n---\n\n## Open Questions\n\n1. **Does sell-side activation actually deliver the 25–40% reach lift** that curators cite, or is that a curator-friendly statistic that survives because the very log-level data needed to audit it is withheld? The figure is load-bearing for the entire sell-side-curation thesis yet originates largely from interested parties [39].\n2. **Where does the spread durably sit after convergence?** OpenPath relocates the SSP fee to the DSP; Activate/ClearLine relocate the DSP fee to the SSP. Five years out, does the buyer's net cost actually fall, or does convergence simply rotate which layer is the toll-collector? The ANA's persistent 25%+ transaction-cost finding suggests the net has *not* meaningfully fallen yet [15][42].\n3. **Is the agentic overlay a tool the intermediary wields or the thing that replaces it?** If
