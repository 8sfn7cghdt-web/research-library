lo SSP shutdown. https://www.adexchanger.com/publishers/yahoos-dsp-is-cutting-out-ssps-but-only-for-the-top-10-of-publishers/ *(Tier 5 trade.)* Accessed 2026-06-17.\n26. Yahoo Inc., \"Yahoo DSP to Adopt IAB Tech Lab's Standardized Data Transparency Labels,\" press release, Jan 28, 2025. https://www.yahooinc.com/press/yahoo-dsp-to-adopt-iab-tech-labs-standardized-data-transparency-labels *(Tier 6 release; position-evidence.)* Accessed 2026-06-17.\n27. \"Yahoo Is The First DSP To (Finally) Adopt The IAB Tech Lab's Data Transparency Labels,\" AdExchanger, Jan 28, 2025 — labels disclose segment construction, signals, freshness, lookback, audit; Gardelli supermarket analogy; Katsur quote. https://www.adexchanger.com/programmatic/yahoo-is-the-first-dsp-to-finally-adopt-the-iab-tech-labs-data-transparency-labels/ *(Tier 5 trade.)* Accessed 2026-06-17.\n28. \"Ask the Expert: Yahoo DSP,\" Experian, 2026; Comscore/Yahoo DSP CTV political-audiences release, Mar 2026 — ConnectID 213M US / 345M global (Q1 2026), always-on, 90% of spend ConnectID-enabled, 40+ CDPs/DMPs. *(Tier 5; relays Yahoo data.)* Accessed 2026-06-17.\n29. Yahoo Inc., \"Yahoo Further Expands its CTV Measurement Suite with Comscore, iSpot, and Samba TV,\" press release. https://www.yahooinc.com/press/yahoo-further-expands-its-ctv-measurement-suite-with-comscore-ispot-and-samba-tv *(Tier 6 release; position-evidence.)* Accessed 2026-06-17.\n30. \"Yahoo places curation at the center of its CES pitch,\" Digiday, Jan 2025; Mi3, \"Yahoo DSP unveils global partnerships with Jounce, Peer39, Scope3,\" Jan 8, 2025. https://digiday.com/media-buying/yahoo-places-curation-at-the-center-of-its-ces-pitch/ *(Tier 5 trade.)* Accessed 2026-06-17.\n31. \"Yahoo DSP reveals new partnerships for 2025,\" adobo Magazine, 2025 — Jounce (SPO), Peer39 (contextual), Scope3 (sustainability). *(Tier 5 trade.)* Accessed 2026-06-17.\n32. \"Yahoo's DSP bet: why speed, not AI, has become the biggest selling point,\" The Drum, Jan 8, 2025 — Roodman \"speed, speed, speed, speed\"; Blueprint launched June 2024, 10x faster, 90% more signals, optional, savings returned. https://www.thedrum.com/news/2025/01/08/yahoo-s-dsp-bet-why-speed-not-ai-has-become-the-biggest-selling-point *(Tier 5 trade.)* Accessed 2026-06-17.\n33. \"Yahoo Partner,\" Programmatic Mechanics — Yahoo DSP managed service (strategy, ad ops, optimization, dashboards). *(Tier 6 partner site; position-evidence.)* Accessed 2026-06-17.\n34. \"EXCLUSIVE: Yahoo Moves Downmarket With DSP Performance Push,\" Adweek, 2026 — mid-market advertiser push. *(Tier 5 trade.)* Accessed 2026-06-17.\n35. \"Publicis buys LiveRamp for $2.5 billion…,\" PPC Land, 2026; clean-room consolidation (LiveRamp/Habu 2024, InfoSum/WPP 2025). *(Tier 5 trade.)* Accessed 2026-06-17.\n36. \"Yahoo DSP Advances Agentic Media-Buying Models,\" MediaPost, Jan 7, 2026; \"Yahoo rolls out Agentic AI tools across global DSP,\" eCommerceNews — agentic activation/troubleshooting/audience discovery live Jan 2026. *(Tier 5 trade.)* Accessed 2026-06-17.\n37. \"This Is Yahoo's More Transparent Answer to Set-It-and-Forget-It Tools: Blueprint Performance,\" Adweek; Experian expert interview — In-Flight Outcomes (IFO), SKU-level tracking, 22% ROAS lift case, in-platform reporting. *(Tier 5 trade.)* Accessed 2026-06-17.\n38. Yahoo Inc., \"Blueprint | Demand Side Platform,\" company page — Blueprint ML performance engine. https://www.yahooinc.com/yahoo-dsp/blueprint *(Tier 1 company; position-evidence.)* Accessed 2026-06-17.\n39. \"Potential buyers are probing Yahoo's ad tech assets,\" Digiday, Nov 2025; \"Ad Tech Briefing: How much could Yahoo's DSP sell for — and to whom?,\" Digiday/Gradient Group; AdExchanger daily roundup, Nov 4, 2025; \"PE Firm Apollo Is Buying Verizon Media For $5 Billion,\" AdExchanger (2021) — Apollo ownership, SSP shutdown 2023, exploratory DSP sale talks/inbound interest Nov 2025. https://digiday.com/media-buying/potential-buyers-are-probing-yahoos-ad-tech-assets/ *(Tier 5 trade.)* Accessed 2026-06-17."}, {"order": 4, "file": "03_WalledGarden_And_Specialized_DSPs_Amazon_FreeWheel.md", "title": "The Walled-Garden & Specialized DSPs: Amazon DSP & FreeWheel/Beeswax", "summary": "", "body": "# The Walled-Garden & Specialized DSPs: Amazon DSP & FreeWheel/Beeswax\n\n## Bottom Line\n\nThese two demand-side platforms sit at opposite poles of the agnostic intermediary's strategic map. **Amazon DSP (ADSP)** is the strongest gravitational object in CTV. It controls the only programmatic path to the *deterministic, authenticated* ~80M-household Roku + Fire TV reach — the June 16, 2025 Amazon–Roku exclusive, live to all ADSP advertisers by Q4 2025, which covers the OS-level authenticated *identity* layer, not all Roku inventory: Roku's broader supply remains buyable via other DSPs. It also sits on Prime Video (programmatic-guaranteed in self-serve since August 2024), and it has thrown open its Amazon Marketing Cloud (AMC) clean room to every sponsored-ads advertiser (September 18, 2025). But it is a walled garden built to keep value inside. It discloses no take-rate percentage, gives no log-level or bid-level data, prefers its own retail-and-viewership *signals* over external identifiers, and has a structural incentive to keep dollars and conversions inside its own ecosystem (its owned-and-operated ad inventory bypasses the external \"ad tax\" and its commerce-trained models favor Amazon conversion paths). An intermediary that routes spend through ADSP rents access to inventory it cannot get elsewhere — and surrenders most of the transparency and optionality its margin model depends on. **FreeWheel DSP / FreeWheel Buyer Cloud** is the mirror image. Rebranded in April 2025 from Beeswax (Beeswax DSP → FreeWheel DSP; Beeswax Bidder-as-a-Service/BaaS → FreeWheel Buyer Cloud; both under Comcast/FreeWheel, with the beeswax.com brand still live and now badged \"Beeswax is now part of FreeWheel\"), it is the rare platform built around *owned bidding, full log-level data, and cost transparency* — the bidder-as-a-service model that attracts an intermediary wanting to control its own decisioning and see clearing prices. Its premium-publisher heritage (NBCUniversal, broadcaster supply) and the October 23, 2025 move making Comcast's linear TV biddable through Buyer Cloud's PMP give it differentiated supply; its March 11, 2026 AI-agent/MCP-server infrastructure pushes toward agentic execution. The catch is a different conflict: Comcast is owner, premium publisher, and DSP at once, and Buyer Cloud's best supply path runs through its parent's inventory. **For a DSP/SSP-agnostic margin-capture model, FreeWheel Buyer Cloud is far friendlier — owned bidder, log-level data, transparent fees, portable decisioning — while Amazon DSP is a must-use-but-never-trust node: take the exclusive Roku reach, but treat ADSP as a sink, not a home, and never let it become the spine of the book.**\n\n---\n\n## How to read what follows\n\nThe intermediary whose vantage this account takes cares about four things: (1) activating licensed ACR audience data — e.g. Samba TV — at scale; (2) capturing the spread between the IO/CPM it charges advertisers and what it actually clears in-platform; (3) honoring supply commitments to publishers; and (4) running the best-performing CTV campaigns while staying free to move spend across any DSP or SSP. Each platform below is graded on eight dimensions: **(1) CTV supply access & scale; (2) fee/take-rate structure & transparency; (3) custom/3rd-party audience onboarding & ACR (Samba) activation; (4) deal/PMP & curation; (5) self-service vs managed-service control; (6) clean room & identity; (7) reporting & log-level data; (8) margin-capture friendliness.** A walled-garden-vs-open lens runs through all of it: how does the intermediary use each platform *without surrendering margin, data control, or optionality* — and where are the lock-in traps, conflicts of interest, and one-way data mirrors?\n\nA note on dated facts. Every product, partnership, and brand described here in the present tense is a dated factual claim, not connective background. The Amazon–Roku exclusive, AMC's open access, the Beeswax→FreeWheel rebrand, Comcast's biddable linear, and FreeWheel's MCP infrastructure each enter below as discrete, sourced claims. Where the most recent confirmation is older, or a claim rests on a single source, it is flagged.\n\n---\n\n# PART I — AMAZON DSP (ADSP)\n\nAmazon DSP belongs to the world's largest retailer, the third-largest digital-ad seller, and — since the Roku deal — the operator of the largest authenticated CTV footprint in the United States. It is also a *walled garden*: every architectural choice tends to keep data, measurement, and margin inside Amazon's own gravity well. For the agnostic intermediary, ADSP is the single most important node on the board, and the single most dangerous.\n\n## A1. CTV supply access & scale\n\nAfter the 2025 Roku integration, Amazon DSP's CTV supply is the most consequential in the US market — and a meaningful slice of it is *exclusive*.\n\n**Prime Video.** Amazon turned on ads across Prime Video in early 2024, creating one of the largest premium streaming ad-inventory pools in the world overnight. By **August 1, 2024**, it launched **programmatic-guaranteed (PG) deals for Prime Video available to self-service advertisers** in Amazon DSP — fixed-CPM, guaranteed-delivery buys in three structures: run-of-service across all ad-supported content, contextual deals targeting genres/title groups, and audience-based deals against Amazon segments [1][2]. Prime Video inventory that once demanded an insertion order and a managed relationship can now transact self-serve as PG — a more controllable, more margin-legible path, though still a fixed-price guaranteed buy rather than open auction.\n\n**The Roku exclusive — the defining 2025 supply event.** On **June 16, 2025**, Amazon Ads and Roku announced an exclusive partnership that, per the companies, creates \"the largest authenticated CTV footprint\" in the US, reachable **exclusively through Amazon DSP**. Using a custom identity-resolution service that lets ADSP recognize logged-in viewers deterministically across Roku OS and Fire TV devices, the integration reaches an estimated **80 million US CTV households — more than 80% of US CTV households** (per ComScore data cited by the companies). The combined footprint spans The Roku Channel, Prime Video, and major streaming apps including Disney, Fox Corporation, Paramount+, Pluto TV, Tubi, and Warner Bros. Discovery. Amazon stated the solution would be **available to all advertisers using Amazon DSP by Q4 2025** [3][4][5]. AdExchanger confirmed the deal \"targets 80% of US CTV-watching households\" and that the enriched cross-device identity sits behind ADSP [6].\n\nOne word should jump out at the intermediary: **exclusively**. Amazon's own newsroom uses \"exclusive partnership\" and \"exclusively through Amazon DSP\" [3][4]. AdExchanger framed it as a Cannes-Lions-timed move that hands ADSP a deterministic reach asset no competing DSP can replicate [6]. Early tests, per the companies, reached **40% more unique viewers at the same budget** and cut redundant frequency by ~30%, with Amazon DSP VP Kelly MacLean citing in AdExchanger's account \"three times improvement in return on ad spend\" and \"42% more unique reach at the same media budget and a 27% frequency reduction\" [4][6]. (Those are vendor-supplied test figures, and should be read as position-evidence, not independently audited results.)\n\n**Fire TV, Freevee, Twitch, and owned-and-operated.** Beyond Prime Video and the Roku footprint, ADSP brokers Amazon's own Fire TV operating-system inventory, Twitch, and (historically) Freevee, plus a broad third-party CTV/OTT supply set. Trade estimates put Fire TV/OTT CPMs in the ~$25–$45 range and online-video (including Twitch/Freevee pre-roll) at ~$12–$25, versus ~$3–$8 for standard display [7] — directional only, since these are practitioner estimates, not Amazon-published rates.\n\n**The strategic read.** For supply, ADSP now stands in a class of one for a specific, large, deterministic reach asset. That is exactly the kind of asset that breaks agnosticism: an intermediary that needs the authenticated Roku+Fire footprint *cannot* honor a \"move spend anywhere\" doctrine for that reach, because there is no second door. The exclusive is a lock-in mechanism dressed as a feature.\n\n## A2. Fee / take-rate structure & transparency\n\nThis is ADSP's weakest dimension for a margin-driven intermediary, and the weakness is by design.\n\n**The published model is \"cost + fees,\" with the fee left blank.** Amazon's own pricing-transparency guide describes a \"cost + fees\" model: total advertiser cost = supply cost + demand-side fees + other amounts payable to Amazon, where the technology fee is \"a percent of media cost\" disclosed \"at the time of campaign setup,\" and managed-service fees are an additional percent-based layer [8]. But **Amazon does not publish the percentage** anywhere in that guide — it is reserved for the setup conversation [8].\n\n**Practitioner-observed economics.** Trade and agency sources converge on a picture: self-service = media cost + a technology fee (a percentage of spend) with no formal minimum (though sub-$5K/month is too thin to optimize, and ~$10K+ is the practical floor); managed service = a ~**$50,000/month minimum spend** plus a percentage-based service fee, in exchange for an Amazon consultant running the account [7][9][10]. Agencies layering on top typically charge ~8–15% of spend [10]. These are practitioner figures, useful for direction and not as audited rates.\n\n**Transparency: red-rated.** Amazon DSP is a walled garden and, like its peers, **does not provide log-level transparency** — industry assessments have \"red-rated\" it on log-file transparency [11]. Advertisers receive aggregated, platform-curated metrics; ADSP draws documented frustration for offering \"no white-label options, minimal API access, and limited ability to pull data into external dashboards\" [11]. Worse, sources describe deductions that occur before a bid enters the auction — an advertiser's $1 bid effectively becoming ~$0.80 to the publisher — so the intermediary cannot see, at the impression level, how much of its money became media versus fees [11]. (This bid-haircut figure is illustrative from a practitioner review, not an Amazon disclosure.)\n\n**The intermediary's problem.** Margin capture on the IO-vs-clearing spread depends on *seeing the clearing price*. Inside ADSP, the clearing price and the fee stack stay opaque: the platform discloses a structure but not the number, gives no impression-level cost data, and takes pre-auction deductions the buyer cannot reconcile. An intermediary can still mark up its IO over what ADSP reports as cost — but it marks up over a number Amazon controls and does not fully expose. Against an observed clearing price in an open DSP, that is a structurally weaker hand.\n\n## A3. Custom / 3rd-party audience onboarding & ACR (Samba) activation\n\nThis is the dimension where Amazon's \"signals, not IDs\" philosophy collides most directly with the intermediary's ACR-data business model.\n\n**Five audience types.** ADSP exposes: Amazon Audiences (pre-built segments from Amazon's first-party retail+viewership data), Remarketing, **Advertiser Audiences** (the buyer's own data uploaded via pixels, DMP transfers, CRM), Lookalike/modeled, and AMC Audiences (custom SQL-built segments) [12]. Amazon's differentiator is repeatedly stated as its *own* deterministic purchase-and-browse signal, with modeled reach \"layered on top of an authenticated foundation\" [13][14].\n\n**First-party onboarding is well-supported — via Amazon's pipes.** At unBoxed 2024 Amazon launched **Ads Data Manager (ADM)**, a standalone interface to onboard first-party data once and reuse it across Amazon DSP, AMC, and Events Manager — via UI uploader, Ads APIs, or CDP/MMP connectors [15]. Amazon's own ADM documentation and the cited reporting confine activation to Amazon's ecosystem (DSP, AMC, Events Manager); claims that ADM audiences can be pushed *out* to third-party platforms like The Trade Desk appear only in uncited secondary sources and should be treated as unverified — the gravity runs inward [15].\n\n**Third-party audiences exist, but as a marketplace, not a free pipe.** Since October 2021, ADSP has offered one-click access to \"thousands of third-party audiences\" from branded data providers (the launch named Zeotap) [16]. But these are curated third-party *segments* Amazon has integrated, not an open lane for any licensed dataset.\n\n**The critical ACR/Samba question.** Can a licensed ACR dataset like Samba TV be onboarded and activated inside ADSP? The honest answer from available sourcing: **partially, and not natively as an ACR-decisioning layer.** Samba TV's own model takes a hashed audience, matches it against its identity graph, and **distributes one deterministic audience to 40+ platforms — including Amazon DSP** [17]. So an intermediary *can* push a Samba-derived segment into ADSP as an Advertiser/onboarded audience and target it. What it generally *cannot* do is run Samba's ACR signal as a live in-flight decisioning/optimization layer inside ADSP, the way it can in an open DSP. The richest Samba in-platform integrations to date (e.g., StackAdapt's fully self-serve ACR forecasting and 24-hour incremental-reach measurement, May 2024; and ACR partnerships with The Trade Desk and DV360) live in open DSPs, where ACR-derived audiences transact on deal IDs and the platform exposes the data the buyer planned on [18][19]. Amazon's posture is the opposite: it prefers its own retail+viewership signals, models reach without external identifiers, and treats audiences as activatable segments rather than as a competing ACR identity spine [13][14]. Two structural limits compound this: ACR data is household-level (it cannot match individual viewing or industry currencies cleanly) [19], and walled gardens generally restrict ACR *collection* on their own apps (Netflix and \"a couple of the bigger folks\" block it) [19].\n\n**The intermediary's read.** ADSP will *ingest* a Samba audience as a target, but it will not let Samba's ACR be the brain of the buy. Amazon's models, trained on its own full-funnel commerce signal, are the brain — and the platform is built to keep it that way. For an intermediary whose differentiation is licensed ACR activation, the constraint is real: inside ADSP, your ACR edge shrinks from a decisioning advantage to a seed list.\n\n## A4. Deal / PMP & curation capability\n\nADSP supports deals and PMPs, but its center of gravity is its own owned-and-operated and exclusive supply, not open curation.\n\n**Prime Video PG and guaranteed deals** are the marquee deal capability: self-serve PG with run-of-service, contextual, and audience-based structures, reviewed and activatable in minutes [1][2]. Amazon also centralizes deal discovery across Amazon properties and third-party inventory in an **inventory hub** [2], and supports creating deals with Amazon Media quickly inside ADSP [2]. The Roku exclusive is effectively the largest \"deal\" of all — a private, ADSP-only path to authenticated cross-device reach [3][4].\n\n**But curation in the open-web sense — assembling third-party supply + third-party data into a packaged deal ID an intermediary controls — is not ADSP's strength.** ADSP is a buying platform into Amazon's gravity, not a neutral curation surface. An intermediary that wants to curate ACR-data-backed deals across diverse SSP supply will do that on the sell side (Index, Magnite, PubMatic) or in an open DSP, then — at most — bring the resulting audience into ADSP. The PMP value in ADSP is *access* to scarce premium and exclusive inventory, not curation flexibility.\n\n## A5. Self-service vs managed-service control\n\nADSP offers both, and the choice maps directly onto the intermediary's control-vs-handholding tradeoff.\n\n**Self-service** gives the buyer the console, media-cost-plus-tech-fee economics, and operational control, with the practical floor noted above (~$10K+/month to optimize) [9][10]. An intermediary wanting to retain control and capture margin will use this mode. **Managed service** hands campaign strategy and optimization to an Amazon consultant in exchange for the ~$50K/month minimum and a higher fee [7][9][10] — operationally easier, but it puts Amazon's hands on the optimization and deepens the gravity. The 2024 PG-deal launch and the broadening of AMC self-service (below) have steadily made self-serve more capable, which is the right direction for an intermediary [1][20].\n\n**The catch:** even in self-service, ADSP's optimization models are Amazon's — trained on Amazon's signal, and tuned (critics argue) to favor Amazon's own conversion environments. Self-service is control of the *levers*, not the *engine*.\n\n## A6. Clean room & identity capability\n\nHere is the paradox: this is at once ADSP's most-improved dimension and its most one-way mirror.\n\n**AMC is now broadly open.** Amazon Marketing Cloud — Amazon's \"secure, privacy-safe clean room\" for analyzing pseudonymized, event-level signals — was historically gated behind partners or registration. On **September 18, 2025**, Amazon made AMC accessible to **all sponsored-ads advertisers** directly in the ads console (under Measurement & Reporting), covering Sponsored Products, Sponsored Display, Sponsored Brands, and Sponsored TV, with no-code analysis templates for onboarding [20][21]. Trade coverage characterized this as Amazon giving a free clean-room service to essentially all sponsored-campaign advertisers [22]. AMC is also available at no cost to Amazon Ads console and ADSP advertisers, and AMC on AWS Clean Rooms reached general availability to let advertisers collaborate on their first-party signals, including event-level [20][23]. This is genuine democratization: an intermediary can now run event-level analysis and build SQL-defined audiences in AMC without a special partnership.\n\n**Identity: the authenticated graph.** Amazon's identity story is its **authenticated graph**, which it says reaches over 90% of US households deterministically, extended by modeling rather than third-party identifiers [13][14]. The Roku integration's custom identity-resolution service is the CTV crown jewel of this graph [3]. Powerful — but it is *Amazon's* graph, not an interoperable ID the intermediary can carry elsewhere.\n\n**The one-way-mirror problem.** AMC is event-level *inside Amazon's environment*. The intermediary can analyze Amazon's signal against its own first-party data in AMC, (audience export beyond Amazon's own DSP/AMC/Events Manager is not confirmed in Amazon's documentation) [15] — but the rich event-level granularity is observable in AMC, not extractable as raw log-level data the intermediary owns. You can look through the glass and run queries; you cannot take the glass home. For an intermediary that wants portable, owned data, AMC is a capability you rent inside the walls.\n\n## A7. Reporting & log-level data access\n\nTwo layers, pulling in opposite directions.\n\n**AMC gives event-level analytics** — granular, pseudonymized, queryable signals for bespoke insight and optimization [20][23]. That is genuinely more than most walled gardens expose, and it has improved with the September 2025 opening.\n\n**But there is no log-level / bid-level data in the open-DSP sense.** ADSP is red-rated on log-file transparency; advertisers get aggregated, platform-curated metrics, no raw impression- or user-level logs, minimal API access, and limited ability to pipe data into external dashboards [11]. Performance tracking gets \"cloudier outside Amazon's ecosystem\" [11]. So the intermediary can run sophisticated *analysis in AMC* but cannot get the *raw transaction logs* it would need to audit clearing prices, reconcile the fee haircut, or feed a fully owned, cross-platform data warehouse. AMC is analysis-as-a-service, not log-level data ownership.\n\n## A8. Margin-capture friendliness for an intermediary\n\nLow to moderate — and structurally adversarial to the intermediary's core economics.\n\nThe margin case *for* ADSP is access-driven: the exclusive Roku reach, Prime Video, and Amazon's conversion-grade signal can produce the best-performing campaigns for certain objectives, which lets the intermediary justify a premium IO. If you win the account *because* you can deliver authenticated Roku reach no competitor can, that is margin defended by differentiation.\n\nThe margin case *against* ADSP is everything else. (1) **No clearing-price visibility** — the intermediary marks up over a cost Amazon controls and partially obscures, with pre-auction deductions it cannot see [8][11]. (2) **No log-level data** to audit the spread [11]. (3) **Retail-media gravity and conflict of interest** — Amazon is retailer + publisher + DSP at once, with a clear incentive to keep dollars (and conversions) inside its own ecosystem: its owned-and-operated ad inventory bypasses the external \"ad tax\" hops and its ad segment runs far higher margins than its retail business (no public source quantifies the precise O&O-versus-third-party margin gap), and its commerce-trained models naturally treat Amazon environments as higher-confidence conversion paths — a self-preferencing pressure buyers cannot easily prove [24]. (4) **Lock-in via exclusivity** — the *deterministic, authenticated* Roku reach cannot be replicated elsewhere (though Roku's broader inventory remains buyable via other DSPs), so spend is captive for that authenticated-identity layer specifically. (5) **The data one-way mirror** — AMC lets you analyze but not own.\n\nNet: ADSP is a node where the intermediary captures margin by being the one who can deliver scarce, exclusive, high-performing reach — but it captures *less* margin per dollar, with *less* control and auditability, than an open DSP, and every architectural choice nudges value back toward Amazon. Use it as a sink for the spend that demands its exclusive supply. Never let it become the spine of the book, and never assume the reported cost is the real clearing price.\n\n---\n\n# PART II — FREEWHEEL DSP / FREEWHEEL BUYER CLOUD (FORMERLY BEESWAX)\n\n## B0. The rebrand\n\nThis one is worth stating precisely, because it is exactly the kind of present-tense status that goes stale in silence. **In April 2025 (announced April 29, 2025), Comcast's FreeWheel rebranded the Beeswax product line:**\n\n- **Beeswax DSP → FreeWheel DSP** (positioned as a turnkey, performance-focused programmatic buying tool — \"the most efficient path to premium TV inventory with built-in optimization\").\n- **Beeswax Bidder-as-a-Service (BaaS) → FreeWheel Buyer Cloud** (cloud-based, modular infrastructure for agencies to integrate CTV into their own systems, with \"full transparency and control over data activation, decisioning, optimization, and measurement\").\n\nThese two now sit inside the **FreeWheel Advertiser Suite**, alongside the **FreeWheel Curation Hub** (a buy-side curation tool). On the sell side, MRM/TV Platform became **FreeWheel Streaming Hub** and the StickyAds/SFX lineage became **FreeWheel SSP**, under the **Publisher Suite** [25][26][27]. FreeWheel stated the changes were to naming, structure, and navigation — *not* to platform functionality [27]. Comcast/FreeWheel is the owner; FreeWheel remains Comcast Advertising's core ad-tech vehicle [26].\n\n**Brand persistence note:** the **beeswax.com domain remains live** and now carries \"Beeswax is now part of FreeWheel,\" directing visitors to freewheel.com/advertisersuite while still describing \"FreeWheel's Beeswax Platform,\" the DSP, and BaaS — dual branding rather than a hard cutover [28]. The hub.freewheel.tv documentation likewise still labels release notes \"Beeswax Release Notes\" under the \"FreeWheel Buyer Cloud User Guide\" [29]. So both the old and new names remain in active circulation as of 2026 — something an intermediary's contracts and integrations should account for.\n\n## B1. CTV supply access & scale\n\nFreeWheel's supply story is premium-publisher-led and, increasingly, parent-supply-led — a different shape from the open-exchange breadth of an independent DSP.\n\n**Premium publisher heritage.** FreeWheel was built as supply-side technology for broadcasters and premium programmers — it manages direct-sold premium video for the likes of NBCUniversal, Paramount, and other major programmers, and its marketplace connects buyers to premium streaming and broadcast supply [30]. For a buyer, that puts FreeWheel DSP/Buyer Cloud unusually close to genuinely premium, direct, high-quality CTV inventory — including, via the FreeWheel Streaming Hub, a direct Open-RTB connection into **Roku's supply in the FreeWheel Marketplace** [31].\n\n**Comcast linear becomes biddable — the October 2025 differentiator.** On **October 23, 2025**, Comcast Advertising announced it had made **traditional/linear TV inventory biddable for the first time, available through FreeWheel Buyer Cloud**, letting media buyers bid and target linear TV inside a Programmatic Private Marketplace (PMP) alongside digital inventory [32][33]. The first campaign (dentsu, for Briarcliff Entertainment's *Stitch Head*, with Rabbits Black) combined CTV and \"for the first time in advertising history, biddable linear\" [33]. AdExchanger framed it as advancing \"the dream of programmatic linear TV\" with real RTB applied to all of Comcast's linear inventory — distinct from prior efforts that \"only automated parts\" of the process — while flagging the limits: it is **currently available only through FreeWheel (Comcast's own platform)**, expansion to other buy-side platforms is *planned* not delivered, and most programmers are expected to favor PG/PMP over open exchange because TV inventory is scarce and media owners want to control buyer access [34]. Comcast said that after the beta (running on Comcast's own inventory first), FreeWheel publisher clients would later be able to enable their own inventory [32][33].\n\n**The intermediary's read.** FreeWheel offers differentiated, genuinely premium CTV supply and a unique biddable-linear path — but the best of it (especially biddable linear at launch) runs through Comcast's own inventory and only through FreeWheel's own buying tools. The supply is excellent. The breadth and the agnosticism are hemmed in by the parent's gravity.\n\n## B2. Fee / take-rate structure & transparency\n\nThis is FreeWheel's structural advantage for a margin-driven buyer, and it is the inverse of Amazon's posture.\n\n**Cost transparency is the BaaS pitch.** The Buyer Cloud / former-BaaS model was built to give buyers \"full transparency and control over data activation, decisioning, optimization, and measurement\" [27], with \"transparent, granular analytics with enriched log-level data\" [25]. FreeWheel markets Buyer Cloud as delivering **reduced ad-tech fees**, better auction performance through ad-server proximity, and unified streaming+linear activation [25]. The owned-bidder architecture (inherited from Beeswax) lets a sophisticated buyer run its own bidding logic in its own cloud and see the full RTB bidstream — auctions through conversions — that is, **see the clearing prices** [35].\n\n**Caveat:** FreeWheel does not publish a fixed take-rate percentage either, and the turnkey **FreeWheel DSP** carries more conventional, less-exposed economics than the customizable Buyer Cloud. The transparency advantage is strongest in the Buyer Cloud / owned-bidder mode; the turnkey DSP behaves more like a normal managed DSP. \"Transparent,\" then, is a property the intermediary unlocks by choosing the BaaS path — not an automatic feature of the brand.\n\n## B3. Custom / 3rd-party audience onboarding & ACR (Samba) activation\n\nFreeWheel's owned-bidder lineage makes it among the friendliest environments for activating *any* licensed data, including ACR.\n\n**Bring your own data, your own algorithm.** The defining Beeswax/Buyer Cloud capability is **\"Bring Your Own Algorithm\" (BYOA)** and buyer-controlled decisioning: customers can write their own bidding algorithms, in their language of choice, in their own AWS instance, with their own data, and can dictate their own supply pool using \"virtually anything available in the bid request\" — specific exchanges, publishers, audiences, or IDs [35]. This is the architecture an ACR-data-activating intermediary wants. No native data is forced on you, so a licensed Samba ACR dataset can sit at the center of the buy as a decisioning input rather than a seed list.\n\n**Identity-enriched activation.** Buyer Cloud integrates marketer and publisher data for **deterministic identity resolution** and exposes **identity-enriched logs** for segment extension, traffic shaping, frequency capping, optimization, and closed-loop measurement [36][37]. FreeWheel's broader Identity Network lets buyers customize the graph with their own first-party IDs and request partner IDs, matching deterministically where possible and probabilistically to hold scale [38].\n\n**ACR/Samba specifics — better than Amazon, but verify the integration.** No available source names a *direct, native Samba-into-FreeWheel-Buyer-Cloud* productized integration with a date; Samba's published distribution list (40+ platforms) names Amazon DSP, TTD, DV360, Magnite, PubMatic, Index, OpenX, Meta and \"other leading platforms,\" but I did not confirm FreeWheel Buyer Cloud as a named Samba destination [17]. **What is well-established is architectural:** because Buyer Cloud lets the buyer ingest arbitrary data and IDs into its own bidder and supply logic [35], an ACR dataset can be activated as a decisioning layer here in a way ADSP's signals-first model resists. The *capability* is strong; the *named, dated Samba↔Buyer-Cloud integration* is not confirmed here and should be validated directly (see Open Questions). DSPolitical's case (below) shows the data-onboarding strength: it reported 18x higher match performance on incoming CTV bid requests vs other identity providers and >30% faster audience onboarding through Buyer Cloud — vendor-supplied figures, but indicative of the data-friendly architecture [39].\n\n## B4. Deal / PMP & curation capability\n\nStrong and improving, with a dedicated curation product and a unique linear-PMP capability.\n\n**FreeWheel Curation Hub** is a distinct buy-side curation tool launched as part of the April 2025 suite reorganization [26][27] — so FreeWheel now has a first-class curation surface, aligning it with the broader 2025–26 curation boom. **Biddable linear in a PMP** (Oct 2025) lets buyers transact linear TV via deal IDs alongside CTV in one PMP [32][33]. The premium-publisher heritage makes PMP/PG access to genuinely premium, direct supply a core strength. For an intermediary that curates ACR-backed deals, FreeWheel offers a native curation product plus the closest thing in market to a unified premium-video-plus-linear PMP — but, again, the deepest supply pool at launch is Comcast's own.\n\n## B5. Self-service vs managed-service control\n\nThe Buyer Cloud spectrum is the most control-friendly design among the platforms examined here.\n\nFreeWheel markets Buyer Cloud as a *spectrum* — \"from turnkey DSP features for fast activation to fully customizable buying environments tailored to your needs\" [27][26]. The **FreeWheel DSP** is the turnkey/managed-ish end (fast, built-in optimization), while **Buyer Cloud / BaaS** is the fully self-controlled end (owned bidder, owned algorithm, owned AWS instance, owned data) [27][35]. An intermediary can therefore start turnkey and graduate to owning its bidding logic without changing vendors — and the BYOA model gives the maximum self-service control available in this set. The tradeoff is operational burden: owning a bidder demands engineering investment the turnkey path does not. That is the price of control and transparency.\n\n## B6. Clean room & identity capability\n\nSolid and buyer-controllable, though less of a household-name clean room than AMC.\n\nFreeWheel's **Identity Network / Customized Graph** supports deterministic-first, probabilistic-fallback matching at the household level, customizable with the buyer's own first-party IDs and partner IDs, used for segment extension, frequency capping, optimization, and **closed-loop measurement with identity-enriched logs \"securely without risking data leakage\"** [36][38]. This is data-collaboration in service of the buyer, not a walled garden's gated clean room. The 2025 identity initiative emphasized **ID interoperability** — a posture aligned with an agnostic intermediary's need to carry identity across platforms, in contrast to Amazon's self-contained graph [38]. FreeWheel does not market a consumer-facing clean-room brand on AMC's scale, but the identity-enriched-logs model gives the buyer more *owned* data than AMC's look-but-don't-take design.\n\n## B7. Reporting & log-level data access\n\nThis is FreeWheel's clearest win over Amazon and the reason a data-controlling intermediary leans toward it.\n\nThe Beeswax/Buyer Cloud architecture delivers **full log-level data across the RTB bidstream — auctions through conversions — delivered to the buyer's own data store** [35], plus \"transparent, granular analytics with enriched log-level data\" and **identity-enriched logs** [25][36][37]. This is genuine log-level data *ownership*, not analysis-inside-a-clean-room. An intermediary that wants to audit clearing prices, reconcile its IO-vs-clearing spread, feed an owned cross-platform warehouse, and run its own attribution will find Buyer Cloud built for exactly that. It is the structural opposite of ADSP's red-rated, aggregated, no-raw-logs posture [11].\n\n## B8. Margin-capture friendliness for an intermediary\n\nHigh — among the friendliest of the platforms examined here, with one important conflict-of-interest asterisk.\n\nThe margin case *for* FreeWheel Buyer Cloud is strong on the intermediary's own terms: (1) **owned bidder + owned algorithm** = the intermediary controls decisioning and can encode its ACR edge directly [35]; (2) **full log-level data ownership** = the intermediary can see clearing prices and defensibly mark up its IO over an observed cost [35]; (3) **stated cost transparency and reduced ad-tech fees** in the BaaS model [25][27]; (4) **premium supply + biddable linear** = differentiated inventory that supports a premium IO [32][33]; (5) **arbitrary-data activation** = the ACR-activation business model is welcome, not resisted. This is close to the ideal architecture for an IO-vs-clearing margin model.\n\nThe asterisk is **conflict of interest and parent gravity.** Comcast is at once **owner + premium publisher (NBCUniversal) + DSP/SSP (FreeWheel on both sides)**. The biddable-linear crown jewel runs through Comcast's own inventory and, at launch, only through FreeWheel's own buying tools [34]. So while the *architecture* is agnostic-friendly, the *best supply* and the *deepest integration* pull toward the parent — a softer, more transparent version of the walled-garden dynamic Amazon embodies, but real. The mitigation is the architecture itself: because Buyer Cloud gives the buyer owned data, owned logic, and portable identity, an intermediary can use FreeWheel for what it does best (premium supply, transparent owned-bidder economics) *without* surrendering optionality — it can carry the same bidder logic and data elsewhere. With Amazon you rent the garden; with FreeWheel you use the parent's inventory while still owning your own tools.\n\n## B9. The March 2026 AI-agent / MCP infrastructure\n\nOn **March 11, 2026**, FreeWheel launched an **AI-agent infrastructure** built on a **Model Context Protocol (MCP) server** plus a suite of **Intelligence tools**, piloting with **PMG** (integrated into PMG's \"Alli\" marketing operating system) [40][41][42]. The MCP server is a secure bridge that lets external AI agents connect to FreeWheel's platform and *execute actions* — read performance data and issue real-time instructions to adjust deals, respond to inventory signals, and modify campaign parameters — while the Intelligence tools continuously monitor deal performance, analyze spend and inventory quality, **track commitments**, and automate routine decisions [41][42]. PPC Land's analysis called this \"true technical interoperability\" (live platform access + action execution) rather than recommendation-only AI [42]. For an intermediary, the commitment-tracking and inventory-quality features map directly onto the \"honor supply commitments to publishers\" requirement, and the owned-bidder lineage lets agentic execution sit atop the buyer's own logic. (This is recent and largely vendor- and trade-sourced; treat the \"execute actions live\" framing as the vendor's claim pending independent confirmation of production scope.)\n\n---\n\n# Head-to-head: Amazon DSP vs FreeWheel for an agnostic margin-capture model\n\n| Dimension | Amazon DSP (ADSP) | FreeWheel DSP / Buyer Cloud |\n|---|---|---|\n| 1. CTV supply & scale | Best-in-class & partly **exclusive** (Roku ~80M HH, Prime Video, Fire TV) — but the exclusive *is* the lock-in | Premium-publisher-led + unique **biddable linear** (Oct 2025); deep but parent-weighted (Comcast/NBCU) |\n| 2. Fees & transparency | Opaque; no published take rate; **red-rated** log transparency; pre-auction deductions | **Transparent owned-bidder** economics; reduced ad-tech fees claimed; no public % either, but clearing prices visible |\n| 3. 3P/ACR (Samba) activation | Ingests Samba as a **seed audience**; resists ACR-as-decisioning; signals-first | **BYOA / arbitrary-data** decisioning — ACR can be the brain of the buy; named Samba integration unconfirmed |\n| 4. Deal/PMP & curation | PG/PMP into Amazon's own & exclusive supply; weak open curation | **Curation Hub** + unified premium-video-plus-**linear PMP**; deepest pool is Comcast's |\n| 5. Self vs managed | Both; ~$50K/mo managed min; self-serve = control of levers, not engine | Full **turnkey↔owned-bidder spectrum**; max control via BaaS (at engineering cost) |\n| 6. Clean room & identity | **AMC** broadly open (Sep 2025), event-level — but Amazon's own graph, look-don't-take | Identity Network (deterministic-first, **interoperable**); identity-enriched logs you own |\n| 7. Reporting & log-level | No raw logs; AMC analysis-as-a-service only | **Full log-level data ownership** across bidstream to your own store |\n| 8. Margin-capture friendliness | Low–moderate; gravity + opacity + O&O self-preferencing incentive; access-driven margin only | **High**; owned logic + owned data + clearing-price visibility; asterisk: Comcast conflict |\n\n**The reasoned verdict.** For a DSP/SSP-agnostic CTV margin-capture model, **FreeWheel Buyer Cloud is the structurally superior fit** — one of the few platforms whose architecture (owned bidder, owned algorithm, full log-level data, interoperable identity, arbitrary-data activation, transparent BaaS economics) actively *supports* the intermediary's margin model and ACR-activation differentiation rather than resisting it. Its weakness is parent gravity (Comcast as owner+publisher+DSP), and the fact that its best supply at launch runs through Comcast — but because the buyer owns its tools and data, that gravity does not cost optionality the way Amazon's does.\n\n**Amazon DSP is a must-use node the intermediary should never trust as a home.** Its exclusive Roku reach and Prime Video supply are, for certain campaigns, simply unavailable elsewhere, and its commerce-grade signal can produce the best performance in conversion-led objectives — letting the intermediary win and price accounts it otherwise could not. But it is a walled garden built to keep margin, data, and conversions inside: no clearing-price visibility, no log-level data, an ACR posture that demotes the intermediary's edge to a seed list, an O&O self-preferencing incentive that biases the engine, and exclusivity (on the authenticated-identity layer) that holds that slice of spend captive. **Use ADSP as a sink for the spend that demands its exclusive supply; build the book's spine on platforms — FreeWheel Buyer Cloud chief among them — that let you own your bidder, see your clearing price, activate your ACR data as decisioning, and carry your identity and logs across any DSP or SSP.** The walled garden is a room you visit for what only it has; it is not a house you live in.\n\n---\n\n## Open Questions\n\n1. **Is there a named, dated, productized Samba TV ↔ FreeWheel Buyer Cloud integration?** The available sourcing confirms Samba distributes audiences to 40+ platforms (Amazon DSP named) and that Buyer Cloud's BYOA architecture *can* ingest arbitrary ACR data — but it does not name FreeWheel as a Samba destination with a date. Validate directly with both vendors.\n\n2. **What is Amazon DSP's actual technology-fee percentage and managed-service fee, and how large is the pre-auction deduction?** Amazon publishes a structure but no numbers; the \"$1 bid → $0.80\" haircut is a practitioner illustration, not a disclosure. The true take rate is load-bearing for any margin model and is not publicly confirmed.\n\n3. **Can an external ACR signal ever run as a live in-flight decisioning layer inside ADSP**, or is it permanently limited to seed-audience ingestion? Amazon's signals-first posture suggests the latter, but a definitive Amazon statement would settle it.\n\n4. **How exclusive is the Roku–Amazon arrangement, and for how long?** \"Exclusively through Amazon DSP\" is Amazon's and Roku's own language; the term, scope (all inventory vs. the authenticated cross-device identity specifically), and any sunset are not publicly detailed. This is the central lock-in question.\n\n5. **Did the Comcast biddable-linear PMP expand beyond FreeWheel's own buy-side tools and beyond Comcast-owned inventory after the Oct 2025 beta?** AdExchanger described expansion as *planned*; whether it has shipped to third-party DSPs and FreeWheel publisher clients as of mid-2026 needs current confirmation.\n\n6. **What are FreeWheel DSP/Buyer Cloud's actual take-rate economics**, beyond the \"reduced ad-tech fees\" marketing claim? The transparency advantage is architectural (you can see clearing prices); the platform's own cut is not publicly quantified.\n\n7. **Is FreeWheel's March 2026 MCP/agentic infrastructure in production at scale, executing actions live**, or still a PMG-only pilot with vendor framing? The \"true interoperability / executes actions\" claim is recent and largely vendor/trade-sourced.\n\n8. **How does AMC's September 2025 opening change data-export rights, if at all?** AMC analysis is broadly available now, but whether any of the newly opened access translates into *more* extractable/owned data (vs. more analysis inside the room) is unclear.\n\n---\n\n## Sources\n\n1. Amazon Ads, \"Scale your message with Prime Video programmatic guaranteed,\" advertising.amazon.com (Prime Video PG deals, launched ~Aug 1, 2024). Tier 1 (primary, vendor doc). https://advertising.amazon.com/resources/whats-new/scale-your-message-using-prime-video-programmatic-guaranteed-deals — accessed 2026-06-17.\n2. PPC Land, \"Amazon introduces Guaranteed Deals for Prime Video Ads\" / \"Create new deals with Amazon Media quickly using Amazon DSP,\" ppc.land & advertising.amazon.com (PG deal structures, inventory hub), 2024. Tier 5 / Tier 1. Accessed 2026-06-17.\n3. Amazon Ads, \"Roku and Amazon Ads announce an exclusive partnership,\" advertising.amazon.com, June 16, 2025. Tier 1 (primary, vendor newsroom). \"exclusive partnership,\" \"exclusively through Amazon DSP,\" ~80M HH / >80% of US CTV HH, custom identity resolution
