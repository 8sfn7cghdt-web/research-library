-Enriched Logs,\" hub.freewheel.tv. Tier 1 (vendor). Segment extension, traffic shaping, frequency capping, optimization, closed-loop measurement via identity-enriched logs \"without data leakage.\" — accessed 2026-06-17.\n37. FreeWheel, \"Get to Know the Identity Graph of the Future\" / \"Your Questions on the State of Identity, Answered,\" freewheel.com/insights. Tier 1 (vendor). Deterministic-first, probabilistic-fallback, household-level matching. — accessed 2026-06-17.\n38. FreeWheel, \"FreeWheel Launches New Identity Initiative Enabling Enhanced ID Interoperability...,\" freewheel.com/news, 2025. Tier 1 (vendor). Customized Graph with buyer's own 1P IDs + partner IDs; interoperability emphasis. — accessed 2026-06-17.\n39. Business Wire, \"DSPolitical and FreeWheel Unlock Scalable, High-Performance CTV Ahead of 2026 Midterm Elections,\" May 19, 2026. Tier 1 (press release — position-evidence only). 18x higher CTV match performance vs other identity providers; >30% faster audience onboarding via Buyer Cloud (vendor figures). — accessed 2026-06-17.\n40. FreeWheel / Business Wire, \"FreeWheel Launches AI Agent Infrastructure to Transform How Premium Video Advertising Is Bought and Sold, Pilots with PMG,\" freewheel.com/news & businesswire.com (20260311925764), Mar 11, 2026. Tier 1 (primary, vendor/press release). MCP server + Intelligence tools; PMG/Alli pilot. — accessed 2026-06-17.\n41. ExchangeWire, \"FreeWheel Launches AI Agent Infrastructure for Premium Video Ads, Pilots with PMG,\" exchangewire.com, Mar 11, 2026; TV Tech, \"FreeWheel Launches AI Agent Infrastructure.\" Tier 5 (trade). MCP server bridges external AI agents to platform; Intelligence tools monitor deals, spend, inventory quality, track commitments. — accessed 2026-06-17.\n42. PPC Land, \"FreeWheel plugs an MCP server into premium video ad deals, pilots with PMG,\" ppc.land, Mar 2026. Tier 5 (trade analytical). \"True technical interoperability\" framing (live platform access + action execution vs recommendation-only). — accessed 2026-06-17."}, {"order": 5, "file": "04_SellSide_And_Curation_Index_Magnite_PubMatic.md", "title": "The Sell-Side & Curation Platforms: Index Exchange, Magnite (incl. ClearLine) & PubMatic", "summary": "", "body": "# The Sell-Side & Curation Platforms: Index Exchange, Magnite (incl. ClearLine) & PubMatic\n\n## Bottom Line\n\nCuration is the structural story of the 2024–2026 sell side. For an agnostic CTV intermediary that wants to apply its own licensed ACR data (Samba TV being the canonical example) without paying a DSP for the privilege, it is the single most important development of the period. All three leading independent SSPs have built sell-side decisioning layers that let a buyer or curator attach audience data to inventory *before the bid request leaves the exchange*. Index Exchange does it through **Index Marketplaces** plus its **Data Vendor Ecosystem** — and, since December 2025, a Samba TV agentic-curated marketplace live in 50+ countries. Magnite does it through **Magnite Access** and the **ClearLine** buy-side activation tool. PubMatic does it through **Connect** (curation) feeding **Activate**, a non-bidded direct-buy path that explicitly removes the DSP.\n\nThe three platforms differ sharply on the one axis an intermediary cares about most: **fee transparency and where the curation margin lands.** Index has staked out the cleanest position — a single publisher-side fee, no upstream curator charge, DSP-agnostic, with \"Transparent Dynamic Take Rates\" it can audit per impression. That makes it the most defensible venue for an intermediary that wants to *set its own margin* on top of a known, disclosed exchange take. Magnite owns the supply: a reported ~99% of US CTV supply with a 24%+ lead per a March 2025 Jounce study (Magnite's framing of a Jounce finding), plus direct Disney/Netflix/Roku/NBCU relationships. ClearLine is its most aggressive disintermediation play, claiming \"+20% working media vs DSP activation\" and \"no hidden fees/upcharges\" — but those are *vendor claims*, and ClearLine locks an intermediary into Magnite's supply and a thinner agnostic posture. PubMatic's Connect+Activate+AgenticOS stack is the most product-complete buy-side-on-the-sell-side offering: a built-in \"Fee Transparency\" agent, 200–300+ data/commerce partners, and a measured CTV business (+50% YoY in Q1 2025, +18% in early 2026). But its own investors have called the agentic business \"an immaterial percentage\" of revenue, and Activate, like ClearLine, ties spend to PubMatic supply.\n\nThe honest verdict for a DSP/SSP-agnostic margin model: **Index is the best neutral curation rail and the strongest fit for activating licensed ACR data sell-side while preserving optionality; Magnite is the indispensable supply partner you must transact with regardless; PubMatic is the most full-featured single-vendor stack but the least agnostic.** One caution survives every test. The strongest critique — that curation merely *relocates* the ad-tech tax rather than eliminating it, that \"+20% working media\" is unverifiable, and that curated deal IDs *reduce* auction transparency for buyers — holds up under scrutiny. The sell side is no free lunch.\n\n\n---\n\n## 1. Why Curation Is the Through-Line\n\nThe whole margin thesis for an intermediary rests on what \"curation\" and \"sell-side decisioning\" actually mean. Start there.\n\nIn the classic programmatic stack, audience data is applied **on the buy side**: a DSP loads a segment, matches it against incoming bid requests, and bids. That costs the buyer a DSP seat fee and a data fee, and it exposes the data to signal loss across the SSP→DSP hop. **Curation** flips this. A curator — an SSP, a data company, an agency, or an intermediary — packages inventory *and* audience data into a deal ID *on the sell side*, so targeting resolves at or near the exchange, \"closer to the impression.\" The buyer then activates that deal ID through whatever DSP it likes — or, in the Activate/ClearLine model, through no DSP at all.\n\nFor an intermediary whose economics depend on (1) activating licensed ACR data at scale, (2) capturing the spread between the IO/CPM it charges and what it clears, (3) honoring publisher supply commitments, and (4) running the best campaigns while staying free to move spend, curation is attractive for four concrete reasons:\n\n1. **It is the most direct ACR-activation path.** Licensed ACR data (e.g., Samba TV's viewership graph) can be embedded sell-side as a curated segment, applied to CTV inventory before the bid leaves the exchange — higher match rates, less signal loss than onboarding the same data into a DSP. Samba TV's December 2025 entry into Index Marketplaces is the cleanest live example: Samba's \"over a billion person-level IDs\" connected directly to Index's platform, activatable in curated deals across any DSP [12].\n2. **It can avoid or reduce DSP fees.** The Activate/ClearLine variants remove the DSP layer entirely for non-bidded (PG/PMP) buys; the Index variant keeps the DSP but moves the *data* fee to the sell side.\n3. **It lets the intermediary be the curator** — i.e., set its own margin as a curation markup, which is precisely the IO-vs-clearing spread, now made explicit and sell-side-resident.\n4. **It is where the supply is.** CTV inventory is concentrated on the sell side (Magnite's direct Disney/Netflix relationships are the extreme case), so transacting closer to that supply is structurally efficient.\n\nThe catch, which the critique section develops, is that curation does not create margin out of nothing. As Scott Messer (Messer Media) put it in a May 2025 AdExchanger piece, \"the net amount to the publisher is roughly the same, and the gross amount that the marketer paid is roughly the same. It's all middle vendors taking their fees out\" [9]. Curation reallocates the ad-tech tax; it does not abolish it. So the real question for an intermediary is whether it can position itself *as* one of the fee-takers — the curator — rather than paying them, and which platform's economics make that position defensible and transparent.\n\nThe scale of the shift is already settled. Jounce Media's April 2025 report found that **multi-seller curated deal IDs represent ~73% of total programmatic bidding opportunities** [8]. Curation is no longer a niche. It is how the majority of the open programmatic market now transacts, and by 2024 it had become a roughly **$1 billion category** on Index's own framing [16][20].\n\n---\n\n## 2. Index Exchange\n\nIndex Exchange is a privately held, independent ad exchange (SSP) headquartered in Toronto, founded in 2003 and long positioned as the \"neutral, transparent\" exchange. Of the three, Index is the platform whose entire 2024–2026 strategy mirrors the posture the intermediary wants for itself: curation without owning the buy side, a single disclosed fee, DSP-agnosticism.\n\n### 2.1 CTV supply access & scale\n\nIndex runs one of the largest open-web exchanges: **62% of header-bidding publishers include Index in their demand stack**, per a 2025 industry roundup [15] (a vendor-adjacent listicle, so directional). Index Marketplaces, its omnichannel curation layer, launched out of beta in early 2024 and \"powers hundreds of millions of impressions daily\" across North America, Europe, and APAC [20] (company framing). Index's CTV/streaming supply is real but **not in Magnite's league**. It has no Disney/Netflix-style direct exclusive relationships of the kind Magnite touts, and CTV is a smaller share of its mix. Index's edge is *omnichannel breadth* — web, mobile, CTV, DOOH — and curation reach, not premium-CTV concentration. Index is excellent for cross-screen curated activation, but it cannot be the sole CTV supply source the way Magnite can.\n\n### 2.2 Fee/take-rate structure & transparency\n\nThis is Index's signature differentiator, and the most important fact for a margin-capturing intermediary. **Index charges only one fee — its standard share of publisher media revenue — and takes no additional fee on its data marketplace** [11][7]. CEO Andrew Casale framed Index Marketplaces from launch as charging \"only its standard publisher fee, without any additional upstream fee charged to the curator, unlike other SSPs\" [16]. VP of Product Michael Richardson, announcing the Data Vendor Ecosystem (Oct 7, 2025), said curation vendors \"can set their own margin and create relationships with marketplace customers directly\" [11]. In other words, Index openly invites the curator — which could be the intermediary — to capture the data margin while Index keeps only its exchange take.\n\nIn October 2025 Index launched **Transparent Dynamic Take Rates**: a per-impression adjustment that *lowers* Index's take to help an underpriced bid clear and *slightly raises* it in competitive auctions, described as \"revenue-neutral — sometimes even revenue-negative — for Index,\" with media owners receiving \"their contracted take rate, or even slightly more, within a given billing cycle,\" and \"every impression fully auditable through our Client Audit Logs\" [13]. Index explicitly positions this against SSPs that \"capitalised on volatility by adjusting their take rates to capture the spread between what buyers paid and what media owners earned\" — a pointed contrast, with the slogan \"We only grow if you grow — full stop\" [13]. A Guardian pilot reported a 4% revenue increase and 45% more impressions [13] (publisher case-study, single-source, vendor-published).\n\n**Assessment:** Index has the cleanest, most auditable fee story of the three. For an intermediary, that is decisive: a known, disclosed exchange take, plus the freedom to set your own curator margin, equals a defensible, transparent IO-vs-clearing spread. One caveat. Index's \"single fee\" applies only to *its* take; the intermediary's own curation markup and any third-party data fees still stack on top. The *total* path cost is not magically low. It is just legible.\n\n\n### 2.3 Custom/3rd-party audience onboarding & ACR/Samba activation\n\nIndex's **Data Vendor Ecosystem** (launched Oct 7, 2025) is purpose-built for exactly the intermediary use case. It lets curators \"pick data sources from a list of companies Index Exchange has already partnered with and activate them in deal IDs across any DSP\" [11], with 15+ partners at launch: **Experian, Audigent, Attain, Audience Town, DoubleVerify, Dstillery, illuma, IRIS.TV, LiveRamp Data Marketplace, Lumen, Mobian, Nano Interactive, Peer39, Proximic by Comscore, Samba TV, and The Weather Company** [11].\n\nThe headline ACR event: on **December 3, 2025, Samba TV joined Index Marketplaces** to launch an \"agentic-curated media marketplace\" live in **more than 50 countries**, with Samba's \"over a billion person-level IDs globally from web browsing and TV viewership data … now directly connected to Index's platform,\" embedded \"directly at the point of decision\" [12]. Samba segments are activatable \"across web, mobile, streaming TV, and online video through curated programmatic deals within Index Marketplaces,\" and the two are \"collaborating on agentic workflows that would activate curated media entirely from prompts\" [12]. Index CEO Casale called Samba's viewership data \"among the most powerful in market\" [12].\n\n**Assessment:** For an intermediary whose model depends on activating licensed ACR data (Samba being the named example), the Index–Samba marketplace is the single most directly relevant product covered here. It is the canonical rail: apply licensed ACR data sell-side, across any DSP, with the curator setting its own margin. **This is Index's strongest claim on the intermediary's spend.** It was confirmed live as of the Dec 3, 2025 announcement [12], with no later source contradicting it. But that confirmation is ~6 months old as of mid-2026 and should be re-checked before being treated as a present fact.\n\n### 2.4 Deal/PMP & curation capability\n\nIndex Marketplaces is a full curation product: data curators, DMPs, and retail media networks activate curated PMP deals across Index's publisher network; marketers match their data against publisher datasets and buy only within targeted PMPs [16]. During closed beta (from Sept 2023) it scaled to a **$100M run-rate across six partners in four months** — faster than Index's streaming-TV offering took to hit the same mark [16]. Launch partners included Audigent, LiveRamp, IAS, IRIS.TV, JW Player, plus OMG UK and Dentsu Japan [16]. The Data Vendor Ecosystem (2025) extends this with pre-integrated data and the Samba agentic layer (2025).\n\n**Assessment:** Strong and, crucially, **DSP-agnostic**. Index deliberately did *not* build a buy-side product to exclude DSPs. As AdExchanger noted in Jan 2024, \"unlike PubMatic and Magnite, which recently launched direct buy-side products that exclude DSPs, Index Marketplaces remains 'DSP-agnostic'\" [16]. For an intermediary that wants to stay free to move spend across any DSP, that restraint is a feature, not a gap.\n\n### 2.5 Self-service vs managed-service control\n\nIndex Marketplaces and the Data Vendor Ecosystem are self-service curation tools for curators and buyers (deal-ID creation, data selection, margin-setting) [11]. Index does not run a managed-service buying desk in the DSP sense; it provides the rails and lets the curator/buyer/agency operate them. For a sophisticated intermediary with its own trading capability, self-service control is preferable — it keeps execution and margin in-house.\n\n### 2.6 Data clean room & identity capability\n\nThis is Index's relative *weakness*. Its identity and data-collaboration story rests on **partner** capabilities rather than an owned clean room: LiveRamp and Experian in the Data Vendor Ecosystem handle identity resolution and onboarding, and the Samba identity spine (1B+ IDs) supplies cross-screen identity for the Samba marketplace [11][12]. Index has historically emphasized being identity-agnostic, supporting multiple ID frameworks rather than betting on one. There is **no evidence** of an Index-owned data clean room (e.g., no confirmed Optable-style acquisition); the clean-room/identity layer is effectively outsourced to ecosystem partners. For an intermediary that already owns its ACR data and identity, that is acceptable — the intermediary brings the data, Index brings the rail. But Index cannot be relied on to *provide* clean-room match infrastructure the way a walled garden or a clean-room-owning SSP could. That is a real gap.\n\n### 2.7 Reporting & log-level data access\n\nIndex's Transparent Dynamic Take Rates explicitly cite \"Client Audit Logs and reporting,\" with every impression \"fully auditable\" [13], and exchange transparency is a core Index brand pillar [pages cited in 11/13]. That is materially better than the industry norm, where, per Jounce, \"DSP log files offer little more than a hazy summary, bundling SSPs and publisher payments together\" and \"SSPs privately negotiate their fees with publishers\" [10]. One caveat applies to Index as it does to all curated deals: when a buyer targets a curated deal ID, it \"loses visibility into which data providers power the targeting and where their money goes\" [7]. That is a structural property of curation, not an Index-specific flaw. In spirit, Index sits on the right side of the IAB Tech Lab transparency work — the pending deals API and schain extension [10].\n\n### 2.8 Margin-capture friendliness for an intermediary\n\n**The best of the three for a neutral margin model.** The combination is hard to beat for the intermediary's stated economics: one disclosed exchange fee; an explicit invitation for the curator to set its own margin [11]; DSP-agnostic activation that preserves the freedom to move spend; a live Samba ACR rail for the intermediary's core data activation; and auditable take rates. The intermediary can *be the curator*, attach its licensed ACR data, set a transparent markup, and activate through any DSP — capturing the IO-vs-clearing spread as a clean, defensible curation margin. The only ceiling is supply. For premium CTV concentration, Index alone is not enough; the intermediary will still need Magnite.\n\n---\n\n## 3. Magnite\n\nMagnite (NASDAQ: MGNI) is the largest independent sell-side advertising company, formed from the 2020 merger of Rubicon Project and Telaria and built out since through acquisitions including SpotX, SpringServe, and streamr.ai. It is the supply gorilla of independent CTV. For an intermediary, Magnite is less a choice than a necessity: you transact with Magnite because that is where the premium streaming supply lives. ClearLine is its bid to turn that supply leverage into buy-side fee capture.\n\n### 3.1 CTV supply access & scale — the load-bearing 99% claim\n\nMagnite's central marketing claim: per the **March 2025 Jounce Supply Path Benchmarking Report**, Magnite has **99% of CTV supply coverage and 96% of overall omnichannel supply coverage, with a 24%+ lead over the next company** [1][2]. The figure reaches us through *Magnite's own press release* (March 5, 2025) characterizing a Jounce report — evidence of *what Magnite claims*, not independent proof. Magnite repeated the same figure when launching next-gen SpringServe (\"99% of US streaming supply, a dollar-weighted figure verified by Jounce Media in their March 2025 Supply Path Benchmarking Report\") [3], and trade and finance outlets [1] recirculated it — but they all trace back to the Magnite release. The underlying Jounce report has not been read directly, so the precise number rests on a single origin. The *qualitative* leadership, though, is corroborated independently. Magnite is \"the only sell-side advertising company that has direct relationships with leading media owners including Disney and Netflix, in addition to long-standing partnerships with publishers including Roku, Warner Bros. Discovery\" [1], and Forrester's Sell-Side Wave awarded Magnite \"the highest possible score for curation capabilities\" [17] (an analyst report, cited via AdExchanger). The supply leadership is real. The precise \"99%/24% lead\" number belongs in quotes as a Jounce finding *as relayed by Magnite*, not as bare fact.\n\nThe premium relationships are well-documented and dated. **Disney** signed a new multiyear agreement in October (2024) expanding Magnite's purview to more Latin American inventory and live sports (college football, ESPN/ABC News podcasts) [17][MGNI Q3 commentary]. With **Netflix**, Magnite supported the ad expansion to all ad-supported markets, with Netflix anticipated to become \"one of Magnite's biggest customers\" [17][Q4 2025 commentary]. **NBCU, Roku, WBD** are named top growers [Q4 2025 commentary via 4]. Most telling: on NBCU, Magnite serves as \"a superior programmatic layer despite the inventory being owned by Comcast and Comcast owning FreeWheel\" [Q4 2025 commentary]. Magnite wins premium supply even where a rival owns the publisher.\n\n**Financials:** Q1 2025 CTV revenue grew 15% YoY to $63.2M [MGNI Q1 2025]; for full-year 2025, **CTV contribution ex-TAC reached $304.2M, up 17%**, with Q4 2025 CTV ex-TAC of $93.6M (48% of total quarterly contribution) and total FY2025 revenue of $714.0M, up 7% [4]. Q4 2025 CTV grew 32% ex-political / 20% including political [4]. The CTV business is large, growing, and the company's center of gravity.\n\n**Assessment:** On supply access and scale, Magnite is #1 for independent CTV, full stop. It is the non-negotiable supply partner. The only caveat is to cite the 99% figure with its provenance.\n\n### 3.2 Fee/take-rate structure & transparency\n\nMagnite's exchange take rate is privately negotiated with publishers (the industry norm) and not disclosed as a single headline number. The transparency story is weaker than Index's. Magnite has published no Index-style \"we only grow if you grow / fully auditable per-impression take rate\" framework; its transparency pitch is instead bound up with **ClearLine's** \"one negotiated fee\" claim (see 3.9). For the SSP itself, an intermediary should expect a conventional, negotiated, non-public take, and should not assume Index-level fee legibility.\n\n### 3.3 Custom/3rd-party audience onboarding & ACR activation — Magnite Access\n\n**Magnite Access** is Magnite's data and audience solution, integrated across SpringServe and ClearLine, offering \"easy access to first- and third-party data\" for packaging deals [3]. In August 2023 Magnite partnered with **Attain** (purchase/retail transaction data, refreshed every 15 minutes via the Klover app) and **restricted that data to ClearLine agencies first**, declining to say when it would reach DSP buyers [18]. The exclusivity is a deliberate disintermediation incentive: the freshest data flows *only* to those who buy through Magnite's own tool, not through their DSP [18]. (The Attain detail is dated Aug 2023; treat the *exclusivity* as a 2023 fact whose current status was not re-confirmed.)\n\nFor ACR specifically, Samba TV is an Attain/ACR-type data partner across the ecosystem, but there is **no Magnite-specific Samba ACR marketplace** analogous to the Index–Samba launch. Magnite's ACR-data activation runs through Magnite Access's first/third-party data packaging, not a named ACR marketplace. An intermediary *can* onboard licensed audience data into Magnite Access for sell-side packaging. But the named, agentic, 50-country ACR rail belongs to Index, not Magnite.\n\n### 3.4 Deal/PMP & curation capability\n\nMagnite's curation business is growing fast — \"revenue from curating publisher audiences growing over 100% year-over-year\" as of Q3 2024 [17] — and Forrester scored its curation capability top of the Sell-Side Wave [17]. Curation runs through Magnite Access, SpringServe deal management, and ClearLine. The October 2025 move to **unify curation and activation within ClearLine** [5][6] is the strategic consolidation: instead of separate tools, Magnite is collapsing both into ClearLine so \"buyers and curators can discover, package, and activate inventory in one platform\" [6].\n\n### 3.5 Self-service vs managed-service control\n\nMagnite Streaming/SpringServe are sell-side tools for publishers; **ClearLine is the self-serve buy-side tool** (see Section 3.9). For an intermediary, the relevant self-service surface is ClearLine. SpringServe next-gen (April 2025) adds \"centralized deal management … across direct and programmatic demand (including ClearLine deals)\" and a \"streamlined user interface and reporting\" [3].\n\n### 3.6 Data clean room & identity capability\n\nMagnite's identity and clean-room story runs through Magnite Access (data packaging) and ecosystem partners, not an owned clean room. SpringServe next-gen integrates Magnite Access for first/third-party data [3]. Magnite supports the standard ID frameworks (UID2, RampID, etc.), as an exchange must. There is no evidence of a proprietary Magnite clean room comparable to Amazon Marketing Cloud; clean-room collaboration is partner-mediated. That is a real gap. For an intermediary that needs clean-room match infrastructure, Magnite is a data-packaging venue, not a clean-room provider.\n\n### 3.7 Reporting & log-level data access\n\nSpringServe next-gen advertises improved reporting and centralized deal visibility [3], and ClearLine \"executes closer to the impression … higher data fidelity, reduced signal loss\" [6]. But there is **no specific confirmation of buyer log-level data access within ClearLine** — the available material offers no detail on it. This is a genuine open question. Magnite's reporting is publisher- and deal-oriented; the granularity of *buyer-side* log-level access — the kind an intermediary needs to verify clearing prices and defend its spread — remains undocumented.\n\n### 3.8 Margin-capture friendliness (Magnite the SSP)\n\nAs an SSP, Magnite is margin-capture-*adjacent*: the intermediary captures margin by curating through Magnite Access and activating, but the headline margin tool is ClearLine, evaluated separately below. The structural tension for an agnostic intermediary is sharp. Magnite's best data (Attain exclusivity) and best activation economics (ClearLine's \"one fee\") are both gated behind *using Magnite's own buy-side tool*, which pulls against the agnostic posture. You get the best Magnite economics by being the least agnostic.\n\n---\n\n### 3.9 ClearLine — evaluated as its own buy-side platform\n\nClearLine is Magnite's self-serve buy-side activation and curation tool, launched April 17, 2023 and materially expanded October 1, 2025 to unify curation and activation [5][6][14]. Because it functions as a buying platform in its own right, it is worth evaluating against the same eight dimensions.\n\n**The headline vendor claims (to scrutinize, not accept):**\n- **\"+20% working media vs DSP activation.\"** Magnite's positioning states \"buyers have seen an increase in working media of upwards of 20% vs DSP activation\" [14]. **This is a vendor/launch-partner claim.** Critically, it does **not** appear in the original Digiday or AdExchanger launch coverage [19], which quoted Magnite's CRO only generally (\"high sensitivity in putting more dollars toward working media\"). The 20% figure surfaces in Magnite's own materials and partner framing (GroupM, Camelot, MiQ) [14]. **No independent verification was found.** It is plausible as an arithmetic of fee-elimination (removing a DSP fee + DSP data fee from the path) but is presented without methodology, baseline, or audit. **Treat as unverified marketing.**\n- **\"No hidden fees / no upcharges.\"** Magnite positions ClearLine as \"a low platform cost and without hidden fees and upcharges like DSP platforms,\" with GroupM paying \"one negotiated fee, rather than fielding fees from both a DSP and an SSP\" [14]. The \"one fee\" structure is credible and is the genuine economic logic of the product; \"no hidden fees\" is a marketing characterization, not an audited fact.\n\n**ClearLine on the eight dimensions:**\n\n1. **CTV supply access & scale:** Excellent — ClearLine rides Magnite's ~99%-coverage supply and \"direct access to … 109 million US ad-supported households\" plus online video, display, audio [PPC Land]. This is ClearLine's single biggest advantage: the best independent CTV supply, accessed directly.\n2. **Fee/take-rate & transparency:** \"One negotiated fee\" replacing DSP+SSP stacking [14] — economically attractive *if* the negotiated fee is genuinely lower than the combined DSP+SSP take. But the fee is negotiated and non-public; \"+20% working media\" is unverified; and the buyer loses the ability to comparison-shop the clearing price across exchanges (because ClearLine *is* the path). Transparency is asserted, not auditable in the Index sense.\n3. **Custom/3rd-party audience & ACR activation:** ClearLine packages first- and third-party audiences via Magnite Access [6], and got *exclusive* early access to Attain retail data [18]. Good for sell-side data application; the exclusivity cuts both ways (better data, less agnosticism).\n4. **Deal/PMP & curation:** As of Oct 2025, ClearLine unifies curation + activation — \"define deal terms, pricing, and targeting directly,\" package deals with Magnite Access first/third-party audiences [6]. This is now a full curation+activation surface.\n5. **Self vs managed:** Self-serve by design — \"a new, efficient route to premium video inventory\" for agencies [14]. Adopters include GroupM, Horizon, Camelot, OMG Germany, Dentsu [14]. For an intermediary, self-serve = control.\n6. **Clean room & identity:** Via Magnite Access + partners; no proprietary clean room. Same gap as Magnite SSP.\n7. **Reporting & log-level data:** Undocumented at buyer-log-level granularity (see 3.7). \"Closer to the impression … higher data fidelity\" is a fidelity claim, not a log-access claim.\n8. **Margin-capture friendliness:** **High in theory, with a strategic cost.** ClearLine lets the intermediary collapse the DSP fee into a single Magnite fee and capture the difference — a real margin lever *if* the intermediary's clients accept Magnite-supply-only execution. The strategic cost is agnosticism: spend in ClearLine is spend locked to Magnite supply and Magnite's tool. An agnostic intermediary can use ClearLine *opportunistically* (for Magnite-premium CTV where the one-fee economics beat the DSP path) but cannot make it the default without abandoning the \"free to move spend across any DSP/SSP\" principle.\n\n**ClearLine verdict:** The most aggressive disintermediation tool of the three platforms and, on Magnite's premium CTV supply, potentially the highest-margin path. But the \"+20%\" and \"no hidden fees\" claims are unverified vendor framing, transparency is asserted rather than auditable, and the tool ties spend to Magnite — making it the *least* compatible with an agnostic posture. Use it as a tactical margin instrument, not a strategic home.\n\n**AI/agentic:** Magnite acquired **streamr.ai (announced Sept 9, 2025)** and plans to integrate \"AI assistance and agentic workflows\" into ClearLine; streamr.ai generates video ads and launches them on CTV \"in under two minutes\" [6]. Magnite also integrated Cognitiv's deep-learning AI into ClearLine curation [28]. Agentic workflows are *planned/beta*, not fully GA, per the Oct 2025 framing (\"coming soon in beta\") [6] — flag as forward-looking.\n\n---\n\n## 4. PubMatic\n\nPubMatic (NASDAQ: PUBM) is a publicly traded, independent SSP built on an unusually vertically integrated, owned-infrastructure model. Its 2024–2026 strategy is the most product-complete attempt to build a buy-side business on the sell side: **Connect** (curation/data), **Activate** (non-bidded direct-buy that removes the DSP), **OpenWrap** (header bidding), and **AgenticOS** (an agentic operating system layering across all of it).\n\n### 4.1 CTV supply access & scale\n\nPubMatic's CTV business is growing fast off a smaller premium base than Magnite's: **CTV revenue grew over 50% YoY in Q1 2025** [21], and CTV \"as a standalone category was up 18% YoY\" in early 2026 [24]. Its premium-inventory footprint, per the April 2026 AgenticOS materials, spans \"2,000+ publishers and 100,000+ sites/apps (28 of top 30 global streamers)\" and \"821 billion daily ad impressions\" [24]. PubMatic does not claim Magnite-level CTV coverage and lacks the marquee Disney/Netflix *direct exclusive* framing, but its CTV supply is substantial, and \"28 of top 30 global streamers\" signals broad premium reach. Total Q1 2025 revenue was $63.8M, down 4% YoY [21]. PubMatic is the smaller company, navigating a major-DSP-buyer disruption and a tough post-political comparison.\n\n### 4.2 Fee/take-rate & transparency\n\nPubMatic collects a percentage of advertiser spend on Activate and was \"exploring subscription models\" [22]. AgenticOS includes a dedicated **\"Fee Transparency\" agent** among its 20+ agents [24]: PubMatic is making transparency a product feature. CEO Rajeev Goel frames end-to-end agentic deals as having \"no other ad tech intermediary collecting fees,\" likening the single-layer model to \"what the walled gardens leverage\" [25]. As with Magnite, though, PubMatic's core exchange take is negotiated and not a public headline number. The transparency story is product-led — the Fee Transparency agent — rather than the auditable per-impression-take model Index publishes.\n\n### 4.3 Custom/3rd-party audience & ACR activation — Connect\n\n**Connect** is PubMatic's curation/data platform. As of March 2025 it had **\"more than 190 premium data partners\"**, including commerce networks (Instacart, Intuit, Western Union), and \"over 821 billion daily ad impressions\" [Connect press release, Mar 20 2025]. By April–May 2026, PubMatic reported Connect at **\"200+ … data and commerce media partners\"** in one place and **\"more than 300 data and commerce media partners, including Walmart Connect and PayPal Ads\"** in another [AgenticOS Apr 2026][AgenticOS-beyond-direct-deals, May 2026]. The count has grown from 190+ (Mar 2025) to 200+/300+ (2026); the earlier \"190+\" figure now undercounts. The discrepancy between \"200+\" and \"300+\" across the two 2026 sources likely reflects different scopings (data-only vs data+commerce), so the count is best read as a range.\n\nConnect's performance claims (vendor/case-study, March 2025): \"25%+ higher eCPMs vs non-curated deals,\" \"up to 14 percentage-point increase in spend from a broader range of buyers,\" and — most relevant to the intermediary thesis — **\"campaigns with data applied via Connect have seen CPM improve by 37% vs campaigns where the same data is applied on the buy-side\"** [Connect press release]. That 37% sell-side-vs-buy-side figure is the direct PubMatic analog to Magnite's \"+20% working media\": a *vendor claim*, not independently verified, presented without methodology. It is at once the strongest single piece of evidence for the curation thesis and exactly the kind of number to scrutinize.\n\nFor ACR specifically, Samba TV is among Connect's data partners (Samba partners broadly across SSPs), and Gracenote (Nielsen) joined PubMatic in 2026 for \"curated live sports and content-level deals\" [Gracenote/Nielsen 2026]. PubMatic has no named Samba *exclusive agentic marketplace* like Index's, but Connect is a fully capable rail for onboarding licensed audience/ACR data sell-side.\n\n### 4.4 Deal/PMP & curation — Connect + Activate\n\n**Activate** is the disintermediation product: launched May 2023, an end-to-end direct-buy solution for CTV and online video via **programmatic guaranteed and PMP deals — explicitly excluding real-time bidding** and \"eliminating the demand-side platform layer entirely\" [AdExchanger Activate]. Goel's rationale: \"When you have an SSP and a DSP, there are hops that lead to discrepancies, latency, match rate issues\" [AdExchanger Activate]. Buyers \"view available inventory, apply first-party data to target audiences, launch campaigns, and access reporting … [and] retain flexibility to use their preferred ad servers\" [AdExchanger Activate]. **SPO reached a record 55%+ of platform activity in Q1 2025 (up from 50% a year prior), driven by Activate** [PubMatic Q1 2025]. Connect curation revenue grew \"over 100% YoY\" [PubMatic Q1 2025]. Activate \"tripled its business since last Q1\" by 2026 [AgenticOS-beyond, May 2026].\n\nThe Connect→Activate combination is the most complete \"buy-side on the sell-side\" stack: curate audience and inventory in Connect, then activate directly — no DSP — in Activate. PubMatic estimates the addressable opportunity at \"57% of the $65B global CTV market (~$37B) [transacting] via direct insertion orders\" — spend that programmatic infrastructure has not yet captured [AdExchanger Activate].\n\n### 4.5 Self vs managed\n\nActivate and Connect are self-serve buy-side/curation tools; AgenticOS adds autonomous (agentic) execution on top. For an intermediary, this is a self-serve stack — control retained.\n\n### 4.6 Clean room & identity\n\nPubMatic supports the standard identity frameworks and runs **OpenWrap** (Prebid-based header-bidding) pre-integrated with **Identity Hub** for publisher ID management [27]. Its identity story is publisher-side ID orchestration plus partner data via Connect. As with Index and Magnite, there is no proprietary clean room of AMC scale; clean-room collaboration is partner-mediated. The same gap applies as for the other two.\n\n### 4.7 Reporting & log-level data\n\nActivate provides \"reporting and analytics\" to buyers [AdExchanger Activate], and AgenticOS includes \"Insights\" and \"Fee Transparency\" agents [AgenticOS]. The sources do not specifically confirm buyer-side log-level data access, but the Fee Transparency agent and the single-layer framing suggest PubMatic is positioning toward more buyer visibility than the SSP norm. **Partly documented; granularity uncertain.**\n\n### 4.8 Margin-capture friendliness\n\n**High product-completeness, moderate agnosticism.** Connect+Activate+AgenticOS is the most full-featured way for an intermediary to curate, apply data sell-side, and activate without a DSP, and the Fee Transparency agent is a genuine differentiator. The \"37% CPM improvement\" (if real) and the elimination of DSP fees make Activate a strong margin path. The constraints mirror ClearLine's. Activate is *non-bidded* (PG/PMP only, no RTB), and spend in Activate is spend on PubMatic supply through PubMatic's tool — less agnostic than Index's keep-your-DSP model. **Investor skepticism is a real signal.** In May 2026, critics noted AgenticOS is \"an immaterial percentage\" of PubMatic's overall business [AgenticOS-beyond, May 2026], and CFO Steve Pantelick had to defend its broader impact. The agentic/disintermediation narrative is outrunning the revenue.\n\n### 4.9 AgenticOS\n\nAgenticOS is confirmed live and accelerating through 2026: \"more than 20 agents\" (Audience Discovery, Inventory Marketplace & Curation, Media Activation, Deal Management, **Fee Transparency**, Insights); live in US, France, Netherlands, Australia, India; \"30 live end-to-end agentic campaigns\" and \"1,000+ AI-enabled deals\" [AgenticOS, Apr 27 2026]. One named CTV proof point: **PubMatic + Havas launched \"the first agentic CTV campaign in Spain\" for Telefónica, \"achieving 18% lower CPM vs target\"** (June 9, 2026) [Havas/Telefónica BusinessWire] — a vendor case study, single-source, but recent and specific.\n\n---\n\n## 5. Cross-Platform Comparison\n\n### 5.1 The eight dimensions at a glance\n\n| Dimension | Index Exchange | Magnite (SSP) | Magnite ClearLine | PubMatic |\n|---|---|---|---|---|\n| **CTV supply & scale** | Strong omnichannel; mid-tier premium CTV | **#1 independent CTV (~99% coverage claim); direct Disney/Netflix/Roku/NBCU** | Rides Magnite's ~99% supply; 109M US households | Substantial; 28 of top-30 streamers; +50% (Q1'25)/+18% (2026) |\n| **Fee/take-rate & transparency** | **Best — single disclosed fee, no curator upcharge, auditable dynamic take rate** | Negotiated, non-public | \"One fee\" vs DSP+SSP stacking (asserted, not audited) | % of spend; **Fee Transparency agent**; negotiated core take |\n| **3rd-party / ACR activation** | **Best — Data Vendor Ecosystem + live Samba 50-country agentic ACR marketplace** | Magnite Access; Attain exclusivity; no named ACR marketplace | Magnite Access; exclusive early Attain data | Connect (190+→200–300+ partners); Samba/Gracenote present |\n| **Deal/PMP & curation** | Strong, DSP-agnostic ($100M run-rate in 4 mo. beta) | Curation +100% YoY; Forrester top score | Unified curation+activation (Oct 2025) | Connect curation +100% YoY; Activate (no-DSP) |\n| **Self vs managed** | Self-serve curation rails | Sell-side tooling | **Self-serve buy-side** | Self-serve + agentic autonomous |\n| **Clean room & identity** | Partner-mediated (LiveRamp/Experian/Samba); no owned clean room | Partner-mediated; no owned clean room | Same as Magnite | OpenWrap/Identity Hub; partner-mediated; no owned clean room |\n| **Reporting & log-level** | **Best — Client Audit Logs, fully auditable take** | Deal-oriented; buyer log-level undocumented | Buyer log-level undocumented | Insights/Fee Transparency agents; granularity uncertain |\n| **Margin-capture for intermediary** | **Best neutral rail — be the curator, set your margin, any DSP** | Adjacent (via Access/ClearLine) | High margin lever, **low agnosticism** (Magnite-locked) | Full-featured, **moderate agnosticism** (PubMatic-locked, non-bidded) |\n\n### 5.2 Positives vs negatives\n\n**Index Exchange**\n- *Positives:* Cleanest, auditable single-fee model; explicit \"curator sets its own margin\"; DSP-agnostic (preserves spend freedom); the live Samba 50-country ACR agentic marketplace is the single best ACR-activation rail for the intermediary; best transparency posture.\n- *Negatives:* Smaller premium-CTV supply than Magnite; no owned clean room (identity/match outsourced to partners); curated-deal-ID opacity still applies to buyers downstream.\n\n**Magnite (SSP + ClearLine)**\n- *Positives:* Indispensable, #1 independent CTV supply with direct premium relationships; Forrester-top curation; ClearLine is the most aggressive DSP-fee-elimination tool; exclusive data hooks (Attain).\n- *Negatives:* \"+20% working media\" and \"no hidden fees\" are **unverified vendor claims**; transparency asserted, not auditable; buyer log-level access undocumented; ClearLine ties spend to Magnite supply — **directly conflicts with agnosticism**; best economics gated behind using Magnite's own tool.\n\n**PubMatic (Connect + Activate + AgenticOS)**\n- *Positives:* Most product-complete buy-side-on-sell-side stack; Fee Transparency agent is a real differentiator; Connect's large/growing data ecosystem; Activate removes DSP for PG/PMP; agentic execution most mature; recent, specific CTV proof points.\n- *Negatives:* \"37% CPM improvement\" is an unverified vendor claim; Activate is non-bidded (PG/PMP only) and PubMatic-supply-locked — **moderate agnosticism**; agentic business is \"an immaterial percentage\" of revenue per its own investors; smaller company navigating revenue pressure.\n\n### 5.3 Which platforms best serve a DSP/SSP-agnostic CTV margin-capture model\n\n**Ranked for the intermediary's stated economics:**\n\n1. **Index Exchange — best fit.** It is the only one of the three architected *not* to trap the intermediary. The intermediary can be the curator, attach licensed ACR data (Samba, live, 50 countries), set its own transparent margin, and activate across *any* DSP — exactly the IO-vs-clearing spread the model needs, made legible and defensible. The cost is supply: Index alone cannot cover premium CTV.\n\n2. **Magnite — indispensable supply, use ClearLine tactically.** You must transact with Magnite regardless, because the premium CTV supply is there. Use Magnite Access for sell-side data packaging across DSPs, and use ClearLine *opportunistically* where the one-fee economics on Magnite-premium CTV beat the DSP path — but never as the default, because ClearLine spend is agnostic spend forfeited.\n\n3. **PubMatic — most full-featured single stack, least agnostic of the curated rails.** Connect is a strong neutral data/curation rail; use it the way you use Index's. Activate and AgenticOS are powerful margin tools, but, being non-bidded and PubMatic-locked, they trade agnosticism for completeness. Reach for them where the intermediary wants the most automated, transparent (Fee Transparency agent) single-vendor execution and accepts PubMatic-supply concentration.\n\n**The strategic synthesis:** an agnostic intermediary's ideal posture is to **curate on the neutral rails — Index Marketplaces and the Data Vendor Ecosystem first, PubMatic Connect second — where it can be the curator and keep its DSP optionality**, while treating the buy-side-direct tools (ClearLine, Activate) as **tactical margin instruments for specific premium-CTV deals** rather than the default home. Every dollar that moves into ClearLine or Activate is a dollar locked to one platform's supply, which is the opposite of the agnostic principle. The margin is real. The lock-in is the price.\n\n---\n\n## 6. The Strongest Critique: Does Curation Actually Capture Margin, or Just Move It?\n\nThe vendor claims are seductive and the independent evidence is mixed. An honest evaluation has to put the strongest possible case *against* the sell-side margin thesis.\n\n**(a) Curation relocates the ad-tech tax; it does not abolish it.** This is the central, well-sourced critique. Scott Messer (Messer Media), May 2025: \"the net amount to the publisher is roughly the same, and the gross amount that the marketer paid is roughly the same. It's all middle vendors taking their fees out, and it doesn't really change what the publisher gets\" [9]. AdExchanger's framing of the same piece: \"moving curation to the sell side merely relocates fees rather than eliminating them\" [9]. Its verdict: \"**No structural improvement** — curation merely redistributes existing ad-tech margins rather than recovering publisher revenue lost to traditional middlemen\" [9]. For the intermediary this is actually compatible with the model — the intermediary *wants* to be one of the fee-takers — but it punctures any claim that curation is a magic efficiency benefiting everyone.\n\n**(b) The \"+20% working media\" and \"37% CPM\" claims do not survive as facts.** Magnite's \"+20%\" [14] and PubMatic's \"37%\" [Connect press release] are vendor/launch-partner claims, absent from independent launch coverage [Digiday], presented without baseline or methodology. They are *plausible* as fee-elimination arithmetic, but they remain marketing until independently audited. An intermediary should model its own spread from observed clearing prices, not from vendor uplift figures.\n\n**(c) Curated deal IDs *reduce* buyer auction transparency.** Jounce's April 2025 finding: when buyers target curated deal IDs, \"they lose visibility into which data providers power the targeting and where their money goes,\" a \"step backward for an industry moving toward greater financial transparency\" [7][8]. Jounce founder Chris Kane: \"In their worst form, curators add another supply chain fee for simply loading a site list into an SSP\" [10], and the \"static price\" model is \"a model that feels value extracting\" because \"we don't know how much … is retained by the exchange, versus data providers, versus curators\" [9]. SWYM.ai's Ravi Patel: \"Most curators operate in a black box … some charge 30%+ for repackaging existing SSP inventory into 'exclusive' lists without adding real value\" [19]. This cuts *against* the intermediary when it is the *buyer* and *for* it when it is the *curator*. But it also means the intermediary's own clients may, rightly, demand the very transparency the intermediary benefits from withholding.\n\n**(d) Fee-stacking is real but not universal.** The reassuring counter-fact, also from Jounce: **~50% of curated deal IDs carry no additional fee beyond the standard exchange take**; of the rest, the median margin-based curation fee is ~14%, with 36% in the 5–10% band [8][9]. So curation does *not* necessarily raise total RTB costs. It depends entirely on the model and the platform. Index's no-upcharge structure [11][16] is the clean end; \"static price\" curation is the opaque end [9]. The platform you pick determines whether the intermediary's margin is transparent (Index) or buried (worst-case static-price curation elsewhere).\n\n**(e) Sell-side conflicts of interest.** SSPs running buy-side tools (ClearLine, Activate) represent publishers (maximize their revenue) and at the same time offer buyers \"more working media\" (minimize cost) — a structural conflict. The \"+20% working media\" pitch and the publisher \"+25% eCPM\" pitch cannot both be fully true on the same impression; one side's gain is bounded by the other. This is not disqualifying, but an intermediary should not assume the SSP's interests are aligned with its own on price.\n\n**Critique verdict:** The sell-side margin opportunity is **real but conditional**. It is real because (i) ~50% of curated deals add no fee, (ii) fee elimination of the DSP layer is genuine for non-bidded buys, and (iii) the intermediary can position as the curator. It is conditional because (i) the headline uplift numbers are unverified, (ii) curation reduces downstream transparency, (iii) the best economics come with platform lock-in, and (iv) the intermediary's own clients may demand the transparency that erodes the margin. Of every configuration on offer, **Index's transparent, no-upcharge, DSP-agnostic model is where the opportunity is most real and least compromised.**\n\n---\n\n## Open Questions\n\n1. **What is the actual ClearLine and Activate buyer-side log-level data granularity?** Neither was confirmable. An intermediary needs to verify clearing prices to defend its spread; if these tools do not expose buyer log-level data, the \"transparency\" claims are weaker than Index's audited model.\n2. **Does the \"+20% working media\" (Magnite) / \"37% CPM\" (PubMatic) uplift survive independent audit?** No methodology, baseline, or third-party verification was found for either. Model them from observed data; do not accept them.\n3. **What is Magnite's actual exchange take rate, and how does ClearLine's \"one negotiated fee\" compare numerically to a DSP+SSP stack?** Non-public. The economic case for ClearLine rests entirely on this comparison being favorable — and that cannot be verified externally.\n4. **Is the Index–Samba 50-country agentic marketplace still live and at what scale in mid-2026?** Confirmed at Dec 3, 2025 launch [12]; a ~6-month-old confirmation. Re-verify before treating as present fact.\n5. **Do any of the three SSPs offer a proprietary data clean room?** None found. Clean-room/identity is partner-mediated for all three — a real gap vs. walled gardens (AMC). For an intermediary needing match infrastructure, this matters.\n6. **What is the precise current PubMatic Connect partner count — 200+ or 300+?** Two 2026 sources disagree, likely on scoping (data vs data+commerce). Needs reconciliation.\n7. **Reconcile the \"99% CTV coverage\" by reading the actual Jounce March 2025 report.** All citations trace to Magnite's characterization of it; the primary Jounce document was never read.\n8. **How material is the agentic/disintermediation revenue, really?** PubMatic's own investors called AgenticOS \"immaterial\" (May 2026). What share of each platform's revenue do these buy-side-direct tools actually represent? The narrative may be outrunning the economics.\n\n---\n\n## Sources\n\n1. Magnite (via GlobeNewswire / investor.magnite.com), \"Magnite's CTV Supply Leadership Is Unmatched With 99% Market Coverage, Shows Latest Jounce Report,\" March 5, 2025. https://www.globenewswire.com/news-release/2025/03/05/3037366/0/en/Magnite-s-CTV-Supply-Leadership-Is-Unmatched-With-99-Market-Coverage-Shows-Latest-Jounce-Report.html — **Tier 1 (press release): evidence of what Magnite claims about a Jounce finding; not independent proof of the 99% figure.** Accessed 2026-06-17.\n2. Magnite, press page, \"Magnite's CTV Supply Leadership Is Unmatched With 99% Market Coverage,\" March 2025. https://www.magnite.com/press/ — Tier 1 (company). Corroborates [1]. Accessed 2026-06-17.\n3. Magnite (via GlobeNewswire), \"Magnite Unveils Next Generation of SpringServe, Combining Its Streaming Ad Server and SSP,\" April 23, 2025. https://www.globenewswire.com/news-release/2025/04/23/3066336/0/en/Magnite-Unveils-Next-Generation-of-SpringServe-Combining-Its-Streaming-Ad-Server-and-SSP.html — Tier 1 (press release). SpringServe unification; restates 99% figure; initial clients (Disney, LG, Paramount, Roku, Samsung, WBD). Accessed 2026-06-17.\n4. PPC Land, \"Magnite's CTV bet pays off: 32% growth signals a streaming ad shift\" (Q4 2025 / FY2025 results coverage), ~Feb 2026. https://ppc.land/magnites-ctv-bet-pays-off-32-growth-signals-a-streaming-ad-shift/ — Tier 5 (trade press, note: PPC Land is a programmatic trade outlet). FY2025 CTV ex-TAC $304.2M (+17%), Q4 figures, premium deals. Accessed 2026-06-17.\n5. Magnite (via investor.magnite.com / GlobeNewswire), \"Magnite To Unify Curation and Activation Within ClearLine,\" October 1, 2025. https://www.globenewswire.com/news-release/2025/10/01/3159421/0/en/Magnite-To-Unify-Curation-and-Activation-Within-ClearLine.html — Tier 1 (press release). Accessed 2026-06-17.\n6. PPC Land, \"Magnite unifies curation and activation within ClearLine platform,\" October 2025. https://ppc.land/magnite-unifies-curation-and-activation-within-clearline-platform/ — Tier 5 (trade press). ClearLine Oct 2025 unification, SpringServe infra, streamr.ai, Magnite Access, deal terms. Accessed 2026-06-1
