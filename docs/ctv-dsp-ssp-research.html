r Curation Delivers for Publishers: Drives 25%+ Higher eCPMs…,\" March 20, 2025. https://investors.pubmatic.com/news-releases/news-release-details/pubmatics-connect-platform-curation-delivers-publishers-drives/ — **Tier 1 (press release): source of \"190+ data partners,\" \"25%+ eCPM,\" and the \"37% CPM improvement vs buy-side\" claim. Performance figures treated as vendor claims.** Accessed 2026-06-17.\n24. PubMatic, \"PubMatic's AgenticOS Accelerates Globally…,\" April 27, 2026. https://pubmatic.com/news/pubmatics-agenticos-accelerates-globally-as-agentic-campaigns-unlock-efficiency-and-performance/ — Tier 1 (company). 20+ agents incl. Fee Transparency; 5 countries; 30 live agentic campaigns; 1,000+ AI-enabled deals; 200+ data/commerce partners; CTV +18%. Accessed 2026-06-17.\n25. AdExchanger, \"PubMatic's Agentic AI Is Going Beyond Direct Deals,\" May 8, 2026. https://www.adexchanger.com/programmatic/pubmatics-agentic-ai-is-going-beyond-direct-deals/ — Tier 5 (specialized trade). 300+ data/commerce partners (Walmart Connect, PayPal Ads); Activate tripled; \"immaterial percentage\" investor skepticism; Goel/Pantelick. Accessed 2026-06-17.\n26. PubMatic + Havas (via BusinessWire), \"PubMatic and Havas Launch the First Agentic CTV Campaign in Spain for Telefónica, Achieving 18% Lower CPM Vs Target,\" June 9, 2026. https://www.businesswire.com/news/home/20260609675674/ — Tier 1 (press release). Vendor case study, single-source. Accessed 2026-06-17.\n27. PubMatic, \"OpenWrap\" product page (header bidding + Identity Hub). https://pubmatic.com/products/openwrap/ — Tier 1 (company). OpenWrap/Prebid; Identity Hub. Accessed 2026-06-17.\n28. Magnite (via StockTitan), \"Magnite and Cognitiv Announce Deep Learning Integration for ClearLine curation,\" 2025. https://www.stocktitan.net/news/MGNI/ — Tier 5 (finance-news aggregator relaying Magnite release). Cognitiv AI in ClearLine. Accessed 2026-06-17."}, {"order": 6, "file": "05_Margin_Economics_Fees_TakeRates_Transparency.md", "title": "Margin Economics: Fees, Take Rates, Transparency & Supply-Path Optimization", "summary": "", "body": "# Margin Economics: Fees, Take Rates, Transparency & Supply-Path Optimization\n\n## Bottom Line\n\nThe programmatic CTV stack is squeezed from both ends, and for a margin-capturing intermediary that squeeze is the whole story. The Association of National Advertisers' (ANA) quarterly Programmatic Transparency Benchmark — the only impression-level, log-data-grounded public dataset on where money leaks — shows the visible \"ad-tech tax\" (platform transaction costs) falling from roughly 28–29% of programmatic spend in 2023 to about 24–26% by Q3 2025, even as CTV climbed to 45.6% of benchmarked programmatic spend. The decline is real, but it mostly *relocates* margin rather than kills it. Sell-side (SSP) fees fell while DSP data fees rose, and curation — the defining 2025–26 motion — moves the curator's cut from the DSP to the SSP rather than abolishing it: about half of curated deal IDs carry no extra fee, the half that do run a ~14% median margin, and the most opaque \"static price\" deals exceed 50%. Only two take rates in the field are genuinely transparent. The Trade Desk's is publicly derivable at ~20% of gross spend ($2.4B revenue on $12B spend in 2024); Amazon DSP's, reported by multiple analysts, runs ~1–2% on third-party media and near-zero on its owned-and-operated supply. Amazon's structural price advantage is now reshaping the competitive floor. For an intermediary that charges an IO/CPM and clears in-platform, the spread is *defensible* where it rests on proprietary or licensed ACR audience data (e.g., Samba TV, now embedded sell-side in Index Marketplaces), owned publisher deals, curation it controls, and managed-service execution skill. It *erodes* wherever log-level-data (LLD) reconciliation, client fee audits, ANA-driven transparency norms, principal-buying disclosure scrutiny, and Amazon-style sub-2% walled-garden pricing make the spread legible and comparable. The durable position is to capture margin on *data and outcomes the client cannot get elsewhere* — not on *arbitrage the client can discover with a log file*.\n\n---\n\n## 1. The Anchor: What the ANA Benchmark Actually Says (and Doesn't)\n\nEvery serious conversation about programmatic margin in 2025–26 starts from the ANA Programmatic Transparency Benchmark, for one reason: it is the only widely cited number set built from **matched impression-level log data (LLD)** rather than survey self-report or vendor marketing. The ANA runs it with **TAG TrustNet** and **Fiducia**, on the same LLD platform that powered the landmark 2023 ANA Programmatic Media Supply Chain Transparency Study [1][2][3]. Its headline figures carry weight, but they come with a well-documented methodology debate that belongs alongside them. Here is what it says, and what it doesn't.\n\n### 1.1 The 2023 baseline\n\nThe December 2023 ANA study examined roughly **$123 million** in ad spending across **35.5 billion impressions** from **21 participating marketers** (17 publicly named), out of **67** who originally expressed interest [3][4]. It framed the **open-web programmatic market at ~$88 billion** and estimated **~$22 billion** could be more effectively allocated — split between roughly **$10B in made-for-advertising (MFA) waste** and **~$12B in ad-tech margin/transaction inefficiency** [4][5]. The cost framing: **transaction costs ≈ 29%** of every dollar, **loss of media productivity ≈ 35%** [3][5].\n\n### 1.2 The methodology debate (treat the headline figures with this caveat)\n\nThe 2023 study drew sustained pushback worth carrying alongside its numbers. Vendors disputed the **quality of the campaign sample**, arguing the analysis \"may have a poor framing of programmatic because it used campaign data from less sophisticated brands\" [4]. The sample was small and self-selecting. Only **21 of 67** interested advertisers could legally obtain their own vendor log files, so the dataset reflects advertisers who *both* cared about transparency *and* held the contractual rights to pull LLD — a non-random slice [4]. Only **three DSPs** (Adform, Adobe Advertising, and one unnamed) took part [4]. These limits are real. The ANA numbers are directionally authoritative on *where* leakage occurs and *that* LLD closes gaps, but the precise dollar magnitudes read best as order-of-magnitude estimates from a particular, non-representative cohort — not a census of the market.\n\n### 1.3 The 2025 quarterly benchmark: the current numbers\n\nThe ongoing benchmark (launched 2024) puts harder, fresher numbers on the table. The **Q3 2025** edition — drawn from **39 participating marketers, 21 actively contributing data**, **17.5 billion impressions**, and **$142M** in analyzed spend over the quarter — reports the following [1]:\n\n| Metric (Q3 2025, including CTV) | Value | QoQ change |\n| --- | --- | --- |\n| Transaction costs (TrueAdSpend waterfall) | **23.8%** | down from 25.2% (Q2) |\n| Median transaction costs | **26.0%** | down from 28.2% |\n| SSP platform cost (CTV waterfall) | **12.8%** | down from 14.7% |\n| DSP platform cost | **6.0%** | flat |\n| DSP data cost | **2.7%** | up from 1.6% |\n| Seller revenue (share reaching publisher) | **76.2%** | up from 74.8% |\n| Media productivity loss | **37.2%** | down from 37.8% |\n| CTV share of programmatic spend | **45.6%** | up from 44.2% |\n| PMP share of all spend | **81.6%** | down from 82.6% |\n| CTV transacted via PMP | **~100%** | — |\n\nTwo structural facts in this table dominate the margin story. First, **the visible ad-tech tax is falling while its composition shifts**: SSP fees dropped nearly two points as **DSP data costs rose** (1.6% → 2.7% in the CTV waterfall; 2.2% → 3.6% in the web/mobile waterfall) [1]. Money saved on sell-side intermediation is partly recaptured as buy-side data fees. Second, **CTV is now ~46% of programmatic spend but transacts almost entirely through PMPs and curated deals** — exactly the terrain where an intermediary's deal-and-data leverage lives [1].\n\n### 1.4 The $26.8B figure and the LLD-recovery estimate\n\nThe widely quoted **\"$26.8B in wasted programmatic spend\"** (from the Q2 2025 release) is the 2023 \"$22B opportunity\" grown with the market. The ANA states the figure reflects the **median TrueCPM Opportunity (~21.8%)** applied to an estimated **~$123B global open-web 2025 market** [1][6]. The Q3 2025 benchmark instead headlined a **39.9% TrueCPM Index** and an estimated **$13.6B in reclaimed working media** (the working-media share rose from 36% in 2023 to **47.1%** in Q3 2025, web/mobile) [1]. The precise Q3 TrueCPM *Opportunity* percentage is reported less cleanly than the Q1–Q2 series (Q1 ~20.8% → Q2 25.8%), so **the $26.8B headline is best cited as the Q2 2025 figure rather than reconstructed for Q3** — the Q3 release does not contain a \"21.8% over $123B\" footnote. The recovery estimate moves quarter to quarter; cite it with its quarter [1][6]. **Caveat:** these are ANA/Fiducia self-published figures, with a clear interest in promoting LLD adoption and benchmark participation — participation now starts at $12,000/year [1]. They are the best public data available, but they are not disinterested.\n\n### 1.5 The crucial CTV nuance: lower media productivity, premium CPMs\n\nCTV is the largest and fastest-growing slice, yet the benchmark is explicit that it carries **lower measured media productivity** under a **different measurement framework**. In Q3 2025, **28.1% of CTV impressions were classified \"non-viewable\"** and **9.2% non-measurable** — but the ANA itself notes much of this reflects *measurement limitation* (no JavaScript, server-side ad insertion/SSAI, walled-garden opacity) rather than genuine non-visibility, since a full-screen streaming ad with sound on is arguably inherently viewable [1]. CTV's median TrueCPM ran **$23.92** against **$7.48** for web/mobile [1]. The margin takeaway: those high CPMs make **every point of take rate worth far more in absolute dollars**, and CTV's measurement opacity has historically *protected* intermediary margin. LLD and CTV-specific TrueKPI frameworks are now eroding that protection.\n\n---\n\n## 2. The Take-Rate Stack, Platform by Platform\n\nThis is the core comparison, and the honest framing comes first: **only two of the eight platforms have a publicly derivable take rate** (The Trade Desk and Amazon DSP), and **the SSPs stopped disclosing take rates after ~2019**. Everything else is estimated from financials, analyst work, or platform disclosure with a clearly noted lean. The table below is the field's best public reconstruction. Read the per-platform notes for the uncertainty around each cell.\n\n### 2.1 Comparison table — fee/take-rate structure & transparency\n\n| Platform | Side | Headline take rate / fee | How it's known | Fee transparency | LLD / raw-log access | Margin-capture friendliness for an intermediary |\n| --- | --- | --- | --- | --- | --- | --- |\n| **The Trade Desk** | DSP | **~20% of gross spend** (effective; $2.4B rev / $12B spend, 2024). Platform fee \"mid-teens\"; +OpenPath 4.5% publisher fee; +Predictive Clearing bid-shading embedded; data add-ons (new Audience Unlimited 3.3%/4.4% tiers) | TTD earnings disclose gross spend annually [7][8]; component fees from analyst/practitioner reporting [9][12] | Medium: gross-spend math is public; component \"junk fees\" criticized as buried in CPM [9] | **Green** on TAG TrustNet — produces US LLD; REDS/Snowflake exposure feeds [10][13] | Medium. High effective take but transparent enough that clients can audit; neutral supply; rich LLD enables closed-loop optimization |\n| **Amazon DSP** | DSP (walled garden) | **~1–2% on 3rd-party media; ~0% on owned/O&O guaranteed deals** | Needham & Co. and multiple analyst reports [14][15][16] | Low-to-medium: simple fee, but O&O margin captured upstream; no log transparency | **Red** on TAG TrustNet — walled garden, no LLD [10] | Low for arbitrage (fee is too low to \"beat\"); but $50K managed-service min, conflict of interest (retailer + platform), data-sharing concerns |\n| **Yahoo DSP** | DSP | Not publicly disclosed; positions on **fee transparency** (no ad-serving fees, audience pricing shown in-UI); Backstage = direct-to-publisher | Yahoo disclosure [17][18] | High (claimed): **first DSP to adopt IAB Data Transparency Labels**; *now provides* full LLD + cost transparency to the ANA/TrustNet benchmark (the \"first DSP\" superlative holds only for the IAB Labels, **not** for LLD) [18][19] | **Green**-trajectory — now provides full LLD + cost transparency to ANA/TrustNet [18] | Medium-low. Transparency posture cuts both ways: hard to hide spread, but lower base fees |\n| **FreeWheel DSP / Buyer Cloud** (ex-Beeswax) | DSP / BaaS | **SaaS subscription, not % of media** | [20][21][22] | High: fixed, predetermined fees | Self-hosted bidder → buyer owns the logs (BaaS) | **High** structurally: subscription model means the intermediary keeps 100% of any spread it can generate on top; full control & transparency |\n| **Index Exchange** | SSP / curation | Standard exchange take rate; **no data fees** charged on its data marketplace | [23][24] | Medium-high: positions on not charging data fees | Green-trajectory; sell-side decisioning | High for ACR activation (Samba TV embedded sell-side); curator controls the deal |\n| **Magnite (incl. ClearLine)** | SSP / curation + buy-side tool | Historical Rubicon ~14.5% (FY19); implied ~11–12% (FY21–22 est.); **ClearLine fee undisclosed**, pitched as \"more working media\" | Historical disclosure + revenue-ex-TAC reverse-math [25][26] | Low: stopped disclosing post-2019; ClearLine take rate \"deflected\" [26][27] | Green on TAG; #1 CTV SSP (35.4% of benchmarked CTV spend) [1] | High. Largest independent CTV SSP; ClearLine is a direct buy-side path the intermediary can own |\n| **PubMatic** | SSP / curation + Activate | Never disclosed; estimated ~**22–30%** net-rev-implied (FY22 reverse-math); curation via Connect/Activate | Estimate from net revenue / imputed gross [26] | Low: never disclosed take rate | Green on TAG; SSP LLD products [10][28] | Medium-high. Activate (100% Big Six agency adoption, Jan 2025) is a buy-side curation path; 190+ data partners |\n| **Google DV360** (reference) | DSP | Not disclosed; ~ low-teens historically | — | **Green only when buying non-Google media; Red on O&O** [10] | Mixed | Reference point only |\n\n### 2.2 The two transparent anchors\n\n**The Trade Desk — the field's transparency benchmark by accident.** Because TTD discloses **gross spend on its platform annually**, anyone can compute its take rate: **$2.4B revenue on a record $12B of platform spend in 2024 = ~20%** (some calculate 20.3%) [7][8]. Management says the take rate has \"been consistently around 20% of spend... and there is no plan to change that\" [9]. The *effective* cost to an advertiser runs higher, and stays less visible. The buy-side platform fee is \"mid-teens.\" **OpenPath** (TTD's direct-to-publisher SPO path) added a **4.5% publisher-side fee** in late 2024. **Predictive Clearing** (TTD's bid-shading) sits embedded in the CPM and \"typically absent from contracts/invoices.\" And third-party **data** historically ran clients ~20% of media cost before the **Audience Unlimited** overhaul (Sept 2025) introduced bulk **3.3%/4.4% tiered** data pricing [9][11][12]. Practitioners and TTD's own critics put the **all-in effective take at ~21%** [9]. And the pressure is current: WPP and Dentsu reportedly *exited OpenPath* over \"economics and opacity\" — a sign that even TTD's transparency is being contested by its largest customers [9].\n\n**Amazon DSP — the price-war anchor.** Multiple analysts (Needham & Co., cited Aug 2025) report Amazon's **ad-sales fees at ~1% (1–2%)** on third-party media — versus TTD's 12–15% platform fee — and **~0% on owned-and-operated programmatic-guaranteed deals** [14][15][16]. The structure explains why: as one practitioner put it in a post Jeff Green himself liked, \"Amazon can slash margins because they own the pipes\" [16]. Amazon captures most of its margin **upstream** — as the publisher/retailer of Prime Video, Fire TV, Twitch, and IMDb, and through retail-media data — and runs the DSP as a **near-cost distribution layer**. The consequence is concrete: a global automotive brand reportedly **moved $80M/year from TTD to Amazon DSP** by Q1 2025, and Prime Video ad spend through the DSP jumped from 26% (Q3) to 36% (Q4) [14][16]. **For an intermediary, Amazon's ~1% fee is not an arbitrage opportunity — it's a margin-floor threat.** You cannot mark up an Amazon-cleared impression by 15% when the client can buy it direct at 1%.\n\n### 2.3 The SSP take-rate black box\n\nSSP take rates went dark in 2019. **Magnite (ex-Rubicon Project)** last disclosed **14.5% (FY19)**; reverse-engineering from revenue-ex-TAC over total ad spend implies **~11.9% (FY21)** and **~11.4% (FY22)** [25][26]. **PubMatic** has *never* disclosed a take rate; a matrix estimate from its ~$256M FY22 net revenue over ~$1.4B imputed gross spend puts it in a probable **22–30%** band [26]. That methodology is explicitly an estimate — days-receivable assumptions applied to balance-sheet figures — so treat the PubMatic 22–30% range as **inference, not established fact** [26]. The general SSP rule of thumb, **~10–15%**, holds for Magnite but likely *understates* PubMatic, and the impression-level reality below contradicts it outright.\n\n### 2.4 The Adalytics counter-finding: take rates at the impression are wildly variable\n\nContracted take rates and observed impression-level take rates diverge sharply. An Adalytics LLD analysis found that across DSP+SSP combined, \"**up to 35% on average** of a bid goes to the DSP and SSP,\" with **22–45% for half of impressions**, **46%+ for one in four**, and extreme cases where **up to 98%** of a media buyer's bid was consumed by intermediaries before reaching the publisher [29]. The median observed *SSP* supply fee was **~20%**, ranging **7%–42%** for the same SSP/publisher pair, with two SSPs showing **>50%** observed fees [29]. One documented impression tells the whole story: an **$8.04 bid; the publisher received $0.29 (4%)** — DSP + SSP took ~96% [29]. This is the single most important caveat to the entire take-rate table. **The \"10–15% SSP / 20% DSP\" framing describes blended averages; at the individual-impression level the tax runs far higher and far more variable.** That variance is exactly why LLD reconciliation threatens opaque margin so much.\n\n---\n\n## 3. Curation and the Fee-Stacking Problem: Does It Lower Cost or Just Move It?\n\nCuration is the defining 2025–26 motion, and it poses the right question: does it genuinely lower the ad-tech tax, or merely relocate it? The best public evidence — Jounce Media's supply-path benchmarking, summarized in AdExchanger and Playwire — says mostly relocate, with transparency the real casualty [30][31][32].\n\n### 3.1 The Jounce taxonomy of curated-deal fees\n\nJounce Media's April 2025 report breaks curated deal IDs into four fee models [30][31]:\n\n| Curation fee model | Share of curated deal IDs / requests | Typical fee |\n| --- | --- | --- |\n| **Zero-fee** (only standard exchange take rate) | **~50%** | exchange's open-auction take only |\n| **Margin-based** (% markup) | **~34%** | **median 14%** take; 40% fall in 5–10% |\n| **CPM-based** (fixed per-impression) | **~10%** | **median $0.48** |\n| **Static-price** (most opaque) | **~7%** | margins often **>50%** |\n\nJounce's conclusion is unambiguous: \"**curation doesn't necessarily increase the total fees of processing an RTB transaction**\" — instead it **shifts control and margin from DSPs toward SSPs**. The median *effective* margin on curated deals is **~30%** at a median effective CPM of **~$0.51** [30]. Industry voices quoted in AdExchanger say the same. Scott Messer: \"the net amount to the publisher is roughly the same, and the gross amount that the marketer paid is roughly the same.\" Chris Kane (Jounce founder): \"the only difference in sell-side curation is that an SSP accrues and pays the curator's fee, rather than the DSP\" [31].\n\n### 3.2 What this means for an intermediary\n\nThe fee-stacking critique — sequential SSP + curation + data + measurement fees compounding into a \"$10 CPM that costs the brand $20\" — is real, but curation does not *add* a net-new layer so much as **re-domicile the existing layer on the sell side**. For a margin-capturing intermediary, that is good news *if the intermediary is the curator*. When it owns the curated deal — its own ACR segments, its own publisher commitments, its own inclusion lists — the ~14–30% curation margin accrues to *it* on the sell side rather than to a DSP it doesn't control. Index Exchange sharpens the point: Index \"doesn't collect fees from its data marketplace, just its usual share of media revenue\" and **does not charge data fees** [23][24], so a curator riding Index keeps more of the data-driven margin. **The strategic conclusion: curation is the single best structural development for an agnostic intermediary's margin model — as long as the intermediary controls the curation layer rather than renting it.**\n\n### 3.3 The transparency casualty\n\nJounce's real warning is about opacity, not cost: \"It should not take a forensic analysis of the bidstream to understand the basic economics of a programmatic auction\" [30]. The **static-price** model (7% of deals, >50% margins) is the danger zone — the curation analogue of the old \"buried in CPM\" DSP fee. An intermediary that lives in the static-price zone is capturing margin an LLD audit will eventually surface and a sophisticated client will eventually challenge.\n\n---\n\n## 4. Bid Shading: The Margin Mechanism Nobody Sees\n\nBid shading is the quiet, embedded margin layer in first-price auctions — now the universal RTB standard. The mechanic is simple. In a first-price auction the winner pays its full bid, so DSPs and SSPs run ML \"shading\" algorithms that submit a lower bid estimated to still win. The buyer saves money, but the **shading logic stays proprietary and undisclosed** [33]. TTD's **Predictive Clearing** is the canonical case: embedded in the cleared CPM and \"typically absent from contracts/invoices,\" it turns the *delta between the buyer's max bid and the shaded clearing price* into a structurally invisible margin surface [9][33]. PubMatic and DV360 also run shading; most platforms \"treat their bid shading algorithms as proprietary and do not disclose the exact logic\" [33]. **Margin implication:** bid shading lets an intermediary capture spread — the difference between what it tells the client it bid and what cleared — but it is also exactly the invisible fee that ANA-driven transparency norms and LLD reconciliation are built to expose. It is defensible only as long as it stays invisible.\n\n---\n\n## 5. Principal-Based / Agency-Principal Buying and the Disclosure Debate\n\nPrincipal-based buying is the holding-company version of the same margin question, now under intensifying scrutiny — and directly relevant, because an \"intermediary capturing spread on the IO-vs-clearing price\" is, economically, *doing a form of principal buying*. Principal media occurs when an agency (or intermediary) acts as **both buyer and reseller** of inventory — buying media as principal, then reselling it to the client at a marked-up price — rather than as a transparent purchasing agent [34][35].\n\nThe practice is growing, and the anxiety is growing with it. Per an ANA survey (114 client-side marketers, Oct–Dec 2025, 81% director-level+) [35]:\n- **56%** of marketers expect to use principal media in 2026 (up from 41% in 2024).\n- Only **57%** have governance guidelines for it.\n- **90%** cite uncertainty that principal media is in their best interest (up from 79% in 2024).\n- Over **one-third** lack contracts addressing it.\n\nThe drivers are structural: pressure on publicly traded holding companies to show financial performance, and consolidation (the Omnicom–IPG combination would create a ~$25B-revenue holdco) [34][36]. The flashpoints are **rebates** — agencies pocketing volume benefits earned with client budgets — and a live **lawsuit against WPP Media** alleging undisclosed rebates [35][36]. The ANA's safeguard recommendations — rigorous approval, explicit contract treatment, budget caps, full visibility into deployment, and requiring \"concrete business use cases... with cost and audience comparisons\" — form a near-perfect template for the questions a sophisticated client will eventually put to *any* margin-capturing intermediary [35]. **The disclosure debate is the macro version of the intermediary's spread problem, and the direction of travel is toward forced disclosure of where the markup sits.** The questions coming for the agencies are the questions coming for everyone in the middle.\n\n---\n\n## 6. Seat Economics and Minimum Spends\n\nMargin capture starts with the cost of holding a seat, and that cost varies enough to shape which platforms favor an intermediary model:\n\n- **Amazon DSP:** **$50,000 minimum** for *managed service* (Amazon runs the campaign; varies by country). **Self-service has no formal minimum** but is practically uneconomic below ~$5–10K/month for optimization data; brands often access self-service via agency/intermediary seats [37][38]. The $50K managed-service floor is a *barrier the intermediary can monetize* (it can aggregate sub-$50K clients into one seat).\n- **The Trade Desk:** platform fee on spend (mid-teens) plus data and feature fees; no single public \"minimum\" but the cost structure assumes scale; Joint Business Plans reportedly offer fee flexibility above spend thresholds [9].\n- **FreeWheel DSP / Buyer Cloud (ex-Beeswax):** **SaaS subscription, not a % of media** — the single most intermediary-friendly model in the set, because the intermediary keeps 100% of any spread it generates on top of a fixed cost. Buyer Cloud's BaaS lets the buyer install its own bidding algorithms and own its logs [20][21][22].\n- **ClearLine (Magnite):** pitched explicitly on **low platform cost / \"more working media,\"** putting more dollars toward media versus DSP activation — though Magnite has consistently **declined to disclose the actual take rate** [27]. The quantified evidence is a reach study (Cross Screen Media: ClearLine drove +4% incremental reach over other digital/TV and **+8% over DSPs alone** in a 2024 race) — *reach* lift, **not** a verified \"+20% working media\" cost figure [39].\n\n**A caution on the \"+20% working media\" claim:** the often-repeated \"ClearLine returns +20% working media vs DSP activation\" figure is **not corroborated** in the primary sources. Magnite's public ClearLine materials make a *qualitative* \"more working media\" claim and a *separate* reach study (4%/8% incremental reach); no primary source supports a specific \"+20% working media\" number. It is best treated as an **unverified vendor framing** unless a primary Magnite case study surfaces.\n\n---\n\n## 7. Log-Level / Raw-Data Access by Platform — Who Enables Closed-Loop Optimization\n\nLLD access is the hinge between *defensible* and *eroding* margin. Whoever holds the raw logs can reconcile what was bid against what cleared, audit every fee, and run closed-loop optimization. Whoever withholds them protects opaque margin. The mechanism that runs this at industry scale is **TAG TrustNet** (with Fiducia), which keeps a **quarterly LLD Register** grading platforms green / yellow / red on whether they provide impression-level logs [10][40].\n\n### 7.1 The TrustNet grading (as of the Nov 2023 register, with 2025–26 updates)\n\n| Platform | LLD rating | Notes |\n| --- | --- | --- |\n| **The Trade Desk** | **Green** | Produces US-advertiser log files; REDS/Exposure Feeds via Snowflake [10][13] |\n| **Google DV360** | **Green (conditional)** | Green only when buying *non-Google* media; Red on O&O [10] |\n| **Amazon DSP** | **Red** | Walled garden — no LLD [10] |\n| **Amazon Publisher Services** | **Red** | Walled garden [10] |\n| **YouTube / Google AdX (O&O)** | **Red** | Walled garden [10] |\n| **PubMatic** | **Green** | SSP LLD products; standardizing buy-side usage [10][28] |\n| **Magnite** | **Green** (TAG-certified) | [10][41] |\n| **Yahoo** | **Green-trajectory** | First DSP to provide *full* LLD + cost transparency to ANA benchmark; first to adopt IAB Data Transparency Labels [18][19] |\n\n**Recency caveat:** the granular green/red ratings above are anchored to the **November 2023** AdExchanger reporting of the TrustNet register [10]; the register updates quarterly, so individual ratings may have shifted. What is confirmed *current*: TAG's certification program is **operating as of March 2026** — TAG awarded **307 seals to 196 companies** on **March 5, 2026**, with **32 at Platinum** including **Amazon Ads, Microsoft Advertising, PubMatic, Magnite, and Yahoo** [41]. **Standing caveat:** TAG's industry mandate has *weakened* — reporting indicates **P&G dropped its TAG mandate** and **Google and The Trade Desk dropped some TAG certifications**, so TrustNet's grading is influential but no longer universally adopted [42].\n\n### 7.2 Snowflake shares and closed-loop feeds\n\nThe technical frontier of LLD is the **Snowflake data share**. TTD's **Raw Event Data Stream (REDS) / Exposure Feeds** deliver impression-level logs into a client's Snowflake for end-to-end audience-and-conversion analysis [13]. Beeswax/FreeWheel plugged into Snowflake early too [13]. When Goodway Group fed LLD into its DSP algorithm, performance \"soared\" — concrete proof that **LLD is not just an audit tool, it is a performance edge** [43]. The asymmetry cuts both ways. Platforms that *give* LLD (TTD, Yahoo, PubMatic, Magnite, FreeWheel/Beeswax) let the intermediary build closed-loop optimization that *justifies* a performance margin — but those same logs let the *client* audit the intermediary's spread. Platforms that *withhold* LLD (Amazon, Google O&O) shield the intermediary from audit while denying it the closed-loop edge. There is no free lunch: **transparency is at once the intermediary's best performance tool and its biggest margin threat.**\n\n---\n\n## 8. The Heart of the Matter: Where Is the IO-vs-Clearing Spread Defensible vs. Eroding?\n\nThis is the question everything so far has been building toward. A platform-agnostic managed-service intermediary makes money on the **spread between the IO/CPM it charges the advertiser and what it clears in-platform**. That spread has four classic sources, and each is moving on its own trajectory.\n\n### 8.1 The four spread sources, scored\n\n| Spread source | Mechanism | Trajectory | Why |\n| --- | --- | --- | --- |\n| **Proprietary / licensed ACR audience data** | Mark up impressions targeted with Samba TV–class ACR data the client can't self-serve | **DEFENSIBLE & strengthening** | Sell-side decisioning (Index Marketplaces + Samba, Dec 2025; PubMatic Connect 190+ partners) embeds ACR data *at the point of decision* in curated deals the intermediary controls [44][28] |\n| **Owned publisher deals / supply commitments** | Capture margin on inventory secured via direct/PMP relationships | **DEFENSIBLE** | CTV is ~100% PMP; deals are relationship-gated, not auditable line items; honoring supply commitments is itself a moat [1] |\n| **Curation the intermediary controls** | Earn the ~14–30% curation margin on its own curated deals (sell-side) | **DEFENSIBLE if owned, ERODING if rented** | Curation *relocates* margin to the sell side — good if you're the curator [30][31] |\n| **Managed-service execution skill** | Charge for running the best-performing campaigns (bid strategy, optimization, LLD-driven tuning) | **DEFENSIBLE (outcome-priced)** | Goodway-style LLD-fed optimization is a genuine performance edge clients pay for [43] |\n\nVersus the eroding forces:\n\n| Erosion force | Mechanism | Effect on spread |\n| --- | --- | --- |\n| **LLD reconciliation** | Client pulls raw logs (TrustNet/Fiducia), reconciles bid vs. clear | Surfaces any pure-arbitrage spread; kills \"buried in CPM\" margin |\n| **Client fee audits** | ANA-style audits, TrueCPM benchmarking | Makes the intermediary's markup comparable to a public benchmark |\n| **ANA transparency norms** | Working-media % becomes a contracted KPI | Reframes the relationship around *net* working media, squeezing gross spread |\n| **Principal-buying disclosure rules** | 90% marketer concern; ANA safeguards; WPP lawsuit | Forces disclosure of where the markup sits — the macro version of the spread problem |\n| **Self-serve / DTC** | Client buys direct (Amazon ~1%, TTD self-serve, FreeWheel SaaS) | Removes the intermediary entirely on commoditized buys |\n| **Walled-garden sub-2% pricing** | Amazon undercuts the floor | You can't mark up a 1%-fee impression by 15% |\n\n### 8.2 The synthesis: capture margin on what the client can't get elsewhere\n\nThe unifying principle falls out of the two tables: **arbitrage spread is dying; data-and-outcome spread is durable.** Specifically —\n\n1. **Margin built on a price difference the client could discover with a log file is eroding fast.** Bid-shading deltas, buried CPM fees, static-price curation (>50% margin), and reselling an Amazon-or-TTD impression the client can buy direct — LLD reconciliation, fee audits, and ANA norms expose all of them. This is the disintermediation thesis in margin terms.\n\n2. **Margin built on proprietary/licensed ACR data, owned deals, controlled curation, and execution skill is defensible** — because the client *cannot* replicate it by pulling a log. The intermediary that activates Samba TV ACR data via sell-side decisioning in a curated deal it controls (Index Marketplaces model) captures a spread the client has no transparent substitute for. The data and the deal are the moat. The markup is *for the data and the outcome*, not for the transaction.\n\n3. **The platform choice follows the spread logic.** The most margin-friendly platforms for this model are, in rough order:\n   - **FreeWheel DSP / Buyer Cloud (BaaS)** — SaaS pricing means the intermediary keeps 100% of self-generated spread; full control and log ownership. Best pure structure.\n   - **Index Exchange / Magnite ClearLine** — sell-side curation the intermediary can *own*, with ACR data embedded at decision (Samba/Index); no data fees (Index); largest independent CTV SSP (Magnite). Best for data-driven, deal-controlled margin.\n   - **PubMatic (Activate/Connect)** — buy-side curation path with 190+ data partners and Big-Six adoption; relocates margin sell-side under the intermediary's control.\n   - **The Trade Desk** — neutral, scaled, rich LLD for closed-loop optimization, but its own ~20% take and increasing transparency leave *less room* for an additional intermediary markup and make any markup auditable.\n   - **Yahoo DSP** — transparent and curation-capable but its transparency posture cuts the intermediary both ways.\n   - **Amazon DSP** — *worst* for margin capture: sub-2% fee floor, walled-garden data, retailer conflict, and no LLD; useful for *reach* (Prime Video, Roku-exclusive) but not a place to capture spread.\n\n### 8.3 The blunt conclusion\n\nFor a DSP/SSP-agnostic CTV margin-capture model, **the defensible future is sell-side, data-led curation the intermediary controls — not buy-side arbitrage**. The platforms that best serve it do two things: they let the intermediary own the curated deal and embed its licensed ACR data at the point of decision (Index Marketplaces, Magnite/ClearLine, PubMatic Activate), and they price on a model that leaves the spread with the intermediary (FreeWheel's SaaS BaaS). The Trade Desk remains the indispensable neutral execution-and-LLD layer, but increasingly a place where margin is *earned on performance*, not *captured on opacity*. Amazon is a reach destination, not a margin one. The ANA's entire transparency project is, in effect, a campaign to convert the first kind of margin — opaque arbitrage — into the second: disclosed, performance-justified. The conversion is coming either way. The intermediary that has already made it is the one that survives it.\n\n---\n\n## Open Questions\n\n1. **What is the actual ClearLine and Index/PubMatic curation take rate to a buyer?** All three decline to disclose; the public curation-fee taxonomy (Jounce) describes the *market*, not these specific platforms' buyer-facing rates.\n2. **Is the \"+20% working media via ClearLine\" claim real?** The public record offers only qualitative \"more working media\" framing and an unrelated reach study (4%/8%); the specific 20% figure is unverified.\n3. **What does Amazon DSP actually capture upstream?** The ~1% third-party fee is reasonably well established, but the *total* economics — O&O margin, retail-media data monetization, the Roku-exclusive arrangement's terms — stay opaque. Amazon's true \"take\" of the value chain runs far above 1% but is not publicly decomposable.\n4. **How much of the ANA's reported efficiency gain is selection effect?** The benchmark cohort is self-selected toward transparency-motivated, LLD-capable advertisers; the gains may not generalize to the median CTV buyer.\n5. **Will principal-buying disclosure rules reach managed-service intermediaries?** The ANA safeguards target agencies; whether they extend to non-agency margin-capturing intermediaries is unresolved and consequential.\n6. **What is Yahoo DSP's actual take rate?** Despite its transparency posture on *fees-in-UI*, no public effective take rate exists.\n7. **Does the DSP data-fee rise (1.6%→2.7% CTV) reflect genuine value or margin recapture?** The ANA flags it neutrally; whether it is data-driven performance or sell-side savings being clawed back by the buy side is unclear.\n8. **How durable is TAG TrustNet as the LLD standard given P&G/Google/TTD pullbacks?** If the certification ecosystem fragments, the reconciliation mechanism that threatens opaque margin weakens.\n\n---\n\n## Sources\n\n1. ANA / TAG TrustNet / Fiducia, *Programmatic Transparency Benchmark — Q3 2025 Benchmark Findings*, PDF (hosted via MediaPost), Nov 2025. https://s3.amazonaws.com/media.mediapost.com/uploads/Q32025ProgrammaticTransparencyBenchmark.pdf — Accessed 2026-06-17. **Tier 2/5** (industry benchmark with LLD methodology; ANA/Fiducia have an interest in promoting LLD adoption). Primary source for all Q3 2025 figures: 23.8% transaction cost, 12.8% SSP / 6.0% DSP platform / 2.7% DSP data, 45.6% CTV share, 81.6% PMP, CTV TrueCPM $23.92, CTV SSP rankings (Magnite 35.4%, FreeWheel 21.6%, Google 17.5%), $13.6B recovered efficiency, $26.8B / 21.8% opportunity framing.\n2. ANA, *The ANA Q3 2025 Programmatic Transparency Benchmark* (press release), Nov 2025. https://www.ana.net/content/show/id/pr-2025-11-transparency — Accessed 2026-06-17 (via search summary; direct fetch 403). **Tier 1/5** (ANA self-published).\n3. ANA, *Programmatic Media Supply Chain Transparency Study (Complete Report)*, Dec 2023. https://www.ana.net/miccontent/show/id/rr-2023-12-ana-programmatic-media-supply-chain-transparency-study — Accessed 2026-06-17 (referenced via secondary reporting). **Tier 2/5**. Baseline: $123M spend, 35.5B impressions, 21 marketers, ~29% transaction cost, ~35% media-productivity loss.\n4. James Hercher, \"The ANA Releases Its Second Transparency Report – Hits The Open Web As 25% Waste,\" AdExchanger, Dec 5, 2023. https://www.adexchanger.com/online-advertising/the-ana-releases-its-second-transparency-report-hits-the-open-web-as-25-waste/ — Accessed 2026-06-17. **Tier 5** (specialized ad-tech trade press). Source for $88B market, $22B waste ($10B MFA + $12B margin), 21/67 advertisers, 3 DSPs, sample-quality critique.\n5. MediaPost / Lexology coverage of the 2023 ANA study (~$20–22B effi tps://digiday.com/media-buying/how-omnicoms-purchase-of-ipg-changes-the-notion-of-an-agency-holding-company/ — Accessed 2026-06-17. **Tier 5**. ~$25B combined revenue; rebate disclosure debate.\n37. mediaplanningtool.com / Skale Strategy, \"Amazon DSP Minimum Spend.\" https://www.skalestrategy.com/blog/amazon-dsp-minimum-spend — Accessed 2026-06-17. **Tier 5/7** (commercial). $50K managed-service minimum; self-service no formal minimum.\n38. Amazon Ads, *Amazon DSP* product page. https://advertising.amazon.com/solutions/products/amazon-dsp — Accessed 2026-06-17. **Tier 1** (company). DSP supply scope (Prime Video, Fire TV, third-party); managed vs self-service.\n39. Magnite / GlobeNewswire, \"Magnite's ClearLine Equips Cross Screen Media with the Tools to Maximize Voter Reach,\" Mar 19, 2025. https://www.globenewswire.com/news-release/2025/03/19/3045317/0/en/Magnite-s-ClearLine-Equips-Cross-Screen-Media-with-the-Tools-to-Maximize-Voter-Reach.html — Accessed 2026-06-17. **Tier 1** (press release; treat as claim). +4% incremental reach over other digital/TV, +8% over DSPs alone (Cross Screen Media measurement). **No \"+20% working media\" figure found.**\n40. TAG TrustNet, *LLD Register* and methodology. https://www.tagtrust.net/ ; Fiducia methodology https://www.fiducia.eco/methodology — Accessed 2026-06-17. **Tier 1/5** (program operator). Quarterly green/yellow/red LLD grading.\n41. ppc.land, \"TAG hands out 307 seals to 196 companies in 2026 recertification,\" Mar 5, 2026. https://ppc.land/tag-hands-out-307-seals-to-196-companies-in-2026-recertification/ — Accessed 2026-06-17. **Tier 5**. Going-concern confirmation: TAG/TrustNet operating Mar 2026; 32 Platinum incl. Amazon Ads, Microsoft, PubMatic, Magnite, Yahoo; four certification categories incl. Transparency.\n42. Adweek, \"TAG Loses Ground as P&G Drops Mandate and Google, Trade Desk Ditch Certifications.\" https://www.adweek.com/media/tag-loses-ground-as-pg-drops-mandate-and-google-trade-desk-ditch-certifications/ — Accessed 2026-06-17 (direct fetch 403; **single-source via search summary, flagged**). **Tier 5**. TAG mandate weakening; standing caveat on TrustNet universality.\n43. AdExchanger, \"When Goodway Group Added Log-Level Data To Its DSP Algo, Performance Soared.\" https://www.adexchanger.com/platforms/programmatic-log-level-data-performance/ — Accessed 2026-06-17. **Tier 5**. LLD as performance edge, not just audit tool.\n44. Samba TV / Index Exchange, \"Samba TV Joins Index Marketplaces to Launch Agentic-curated Media Marketplace,\" Dec 3, 2025. https://www.indexexchange.com/press/press-releases/samba-tv-index-agentic-curated-media-marketplace/ — Accessed 2026-06-17. **Tier 1** (joint press release; treat as claim). Samba ACR/behavioral/contextual data embedded sell-side in Index; >1B person-level IDs; live in 50+ countries; agentic curation workflows.\n\n---\n\n*Compiled 2026-06-17. Margin figures reflect the most recent public data available through that date; take rates are a moving target and the SSP/curation figures in particular rest on estimates and disclosure-with-interest, not audited disclosure. The ANA benchmark figures are the best available public LLD-grounded data but are self-published by parties (ANA/Fiducia/TAG) with an interest in promoting LLD adoption, and rest on a small, self-selected cohort — cite with that caveat.*"}, {"order": 7, "file": "06_ACR_Data_Identity_And_CleanRooms.md", "title": "Audience, ACR-Data Activation, Identity & Clean Rooms", "summary": "", "body": "# Audience, ACR-Data Activation, Identity & Clean Rooms\n\n## Bottom Line\n\nFor an intermediary whose differentiation rests on *licensed* ACR data — Samba TV is the named example — the most consequential 2025–26 decision is no longer \"which DSP do I buy on.\" It is \"where do I put my segment so it does not leak, does not get taxed twice, and stays mine.\" Two activation architectures now run in parallel. The legacy path is **DSP-side onboarding**: resolve the ACR household to an identifier (LiveRamp RampID, The Trade Desk's UID2/EUID, Yahoo ConnectID, Experian, or Amazon's first-party graph), push the audience into the DSP, and target it there. The ascendant path is **sell-side decisioning / curation**: embed the segment directly in an SSP's curation layer (the Index Data Vendor Ecosystem and the Samba×Index marketplace launched December 2025; PubMatic Connect/Activate; Yahoo's curation suite; Magnite ClearLine) so targeting happens *at the point of decision*, closer to the impression, packaged as a deal ID any DSP can buy.\n\nThe economic verdict is sharp. Sell-side curation best preserves both ACR-data control and intermediary margin, for three reasons grounded in primary sources: (1) Index charges **no separate data-marketplace fee** — only its usual media share — and lets data vendors **retain 100% of segment revenue** [12][13]; (2) PubMatic's own data show applying data via Connect yields a **37% CPM improvement versus buy-side data application** and **25%+ higher eCPMs** [9], because matching the segment to publisher first-party data sell-side dodges the match-rate decay of pushing it through a DSP; and (3) the segment never has to be uploaded into a buyer platform that could observe, model, or commoditize it. The strongest counter-case is real and consequential. Sell-side decisioning concentrates strategic control and margin with SSPs, curator fees are frequently a non-transparent \"black box\" (some curators reportedly take 30%+ for repackaging) [22], and buyers lose log-level insight into how segments were built. The WPP/Dentsu exit from The Trade Desk's OpenPath in February 2026 over \"hidden fees and transparency\" [27] shows the same opacity complaint cuts *both* ways — buy-side and sell-side.\n\nThe landscape shifted hard through 2025 and into 2026, and it is present-tense fact, not background: Samba TV launched **Project Gravity** (its own cross-platform onboarding rail into 40+ platforms) in May 2026 [4][5]; Experian **acquired Audigent** in December 2024 [19]; LiveRamp **acquired Habu** and WPP **acquired InfoSum**, which AdExchanger framed as \"the end of the data clean room era\" — standalone clean rooms absorbed into cloud and holdco infrastructure [16]; Amazon made **AMC free for Sponsored Ads advertisers** (September 2025) and extended its lookback window to 25 months (November 2025) [7]; and the **Ad Context Protocol (AdCP)**, built on Anthropic's Model Context Protocol with Audience-Activation and Curation sub-protocols, launched October 2025 with Yahoo, PubMatic, Magnite, Samba TV, and LG Ad Solutions among its members [25]. The net: the most ACR-friendly, margin-defensible posture is **curation-first, DSP-agnostic**, with DSP-side onboarding reserved for walled gardens (Amazon) and performance pockets where the DSP's identity graph genuinely adds reach.\n\n---\n\n## 1. The ACR-Data Activation Problem, Framed for an Intermediary\n\n### 1.1 What the intermediary actually owns\n\nAn intermediary that *licenses* ACR data does not own the smart-TV glass; it licenses a viewership signal from a vendor that does. The value of that license rests entirely on two things: (a) how losslessly the segment activates across whatever DSP or SSP the campaign needs, and (b) whether the activation path exposes the segment so a platform — or a rival — can reconstruct, model, or undercut it. Every dollar of margin the intermediary earns on the IO-vs-clearing spread is at risk if activation degrades the segment (match-rate loss inflates effective CPMs) or commoditizes it (the segment leaks and stops being a differentiator).\n\nFor this seat, dimension-3 (audience onboarding / ACR activation) and dimension-6 (clean room / identity) are not two of eight equal dimensions — they *are* the differentiation. Supply access, take rates, and reporting matter, but they are table stakes several platforms can match. The moat is the ability to put *proprietary ACR targeting* into market at scale, cheaply, without leaking it.\n\n### 1.2 The ACR vendor landscape the intermediary draws from\n\nSamba TV is the leading example, set against the surrounding landscape — VIZIO Inscape, LG Ad Solutions, iSpot/Tatari, Telly/Theta. One structural fact defines it: the **licensing split**. Most OEM ACR data is *walled-garden-executable only*; a minority openly licenses to third parties.\n\n- **Samba TV** — first-party data from \"tens of millions of opted-in TVs across more than 50 countries,\" an identity spine of \"over a billion person-level IDs globally\" anchored by ~1.489 billion connected IDs, and (per Samba) 90%+ accuracy in resolving phones/tablets/PCs/TVs to an individual and 90%+ opt-in rates on Samba-enabled devices by 2026 [3][2]. An older AdExchanger marketer's guide listed Samba at ~14.4M US sets and stated Samba \"does not license its data\" [6]; that snapshot is now stale — Samba's Index marketplace (Dec 2025) and Project Gravity (May 2026) are explicit licensing/activation programs [1][4]. The licensing posture changed.\n- **VIZIO Inscape** — a pure data-licensing business; AdExchanger's guide put it at ~11.2M US TV sets, while Inscape's own marketing cites 24M+ opted-in TVs / 79M viewers and notes it fuels measurement for Nielsen, iSpot, VideoAmp, and Comscore [6][24]. Inscape and Nielsen Gracenote are the canonical *open licensors*. (VIZIO is owned by Walmart following the 2024 acquisition — a retail-media overlay an intermediary should weigh.)\n- **LG Ad Solutions** — built on Alphonso (LG took a controlling stake in 2021 and absorbed it); ~15M households of ACR per the guide; primarily executable within LG's own ad stack, though LG adopted UID2 in partnership with The Trade Desk to extend addressability [6][23].\n- **Nielsen Gracenote** — ~18.9M devices across 12 manufacturers; licenses to iSpot, VideoAmp, 605, and others; identifies ~70% of content at ~98% accuracy [6]. More a measurement-grade reference than an activation segment.\n- **Samsung Ads / Roku** — ~33M and ~10M+ opted-in TVs respectively; *do not sell or license* their ACR data — walled-garden execution only [6]. An intermediary cannot license these as portable segments; it can only buy *into* them.\n- **iSpot / Tatari** — measurement-and-attribution-led rather than raw-ACR-licensing-led. Tatari is a managed CTV/linear buying platform (Made In's UID2 CTV case study ran through Tatari); iSpot is a cross-platform measurement currency that *consumes* Inscape/Gracenote ACR rather than selling a portable household segment.\n- **Telly / Theta** — the ad-subsidized free-TV hardware play; an emerging first-party ACR source, but small-scale and not yet a primary licensable segment at the scale of Samba/Inscape as of mid-2026. (Not yet established at activation scale; treat as watch-list.)\n\nThe takeaway for the intermediary: **the licensable ACR universe is essentially Samba TV + Inscape + Gracenote-derived segments**. Samsung/Roku/VIZIO-platform and (largely) LG inventory must be *bought into*, not *licensed and ported*. Samba is the one vendor that pairs large open-licensed scale with a person-level identity spine built for cross-platform activation. That is exactly why it is the leading example, and why its activation architecture (below) anchors this chapter.\n\n---\n\n## 2. The Two Activation Architectures\n\n### 2.1 DSP-side onboarding (the legacy path)\n\nThe classic flow: the intermediary takes its licensed ACR households, resolves them to a portable identifier, and pushes the resulting audience into a DSP for targeting.\n\n- **LiveRamp / RampID** is the workhorse onboarding rail. Samba integrates its first-party ACR data into LiveRamp so marketers can target and measure people-based campaigns across CTV, video, display, native, and audio. RampID is buyable and frequency-cappable inside The Trade Desk and activatable on Amazon DSP [8].\n- **UID2 / EUID** (The Trade Desk-developed, now operated as an open framework) creates a deterministic, salted-and-hashed, encrypted ID from an email or phone number; EUID is the GDPR-stringent European variant with non-interchangeable tokens. CTV's high logged-in rate makes UID2 unusually effective there; AMC Networks, Disney, Dish, FreeWheel, NBCUniversal, Roku, Paramount, LG, and Philo have integrated it. The Made In/Tatari CTV campaign reported a 20% CPA improvement and 33% faster time-to-convert when UID2 was in the conversion path.\n- **Yahoo ConnectID** reaches 213M logged-in users in the US and 345M globally (Q1 2026), powering cross-device targeting, frequency, and measurement across display, native, video, and CTV.\n- **Experian** runs its own onboarding using the Tapad graph (acquired 2020) plus Audigent's curation/identity stack (acquired December 2024) [19]; Experian/Audigent data is ranked #1 in accuracy by Truthset per Experian's marketing.\n- **Amazon** is its own closed world — first-party shopper graph plus AMC; third-party/licensed data enters only via clean-room upload (Section 4.1), not a generic onboarding pipe.\n\nThe deterministic-vs-modeled distinction matters here. An ACR household resolved deterministically to RampID or UID2 (via a shared, consented email/MAID/IP key) is worth far more than one matched probabilistically. But every hop — license → onboard → DSP graph → bid — sheds match. LiveRamp itself recommends a CTV-ID sync *before* sending CTV IDs to lift match rates — an admission that the default match is lossy.\n\n### 2.2 Sell-side decisioning / curation (the ascendant path)\n\nThe newer flow inverts the geography: the segment sits in the SSP's curation layer, gets matched against publisher first-party data *before* the auction, and sells as a deal ID any DSP can buy. The DSP never has to ingest, store, or model the raw segment.\n\n- **Index Data Vendor Ecosystem (DVE)** — launched October 2025; the **Samba×Index agentic-curated marketplace** launched December 2025, live in 50+ countries [1][12]. Samba's signals are \"embedded directly at the point of decision,\" activatable across web, mobile, streaming TV, and OLV through curated deals in Index Marketplaces [1]. Crucially, DVE charges **no separate data-marketplace fee** (only Index's usual media share), data vendors **retain 100% of segment revenue**, segments activate **in deal IDs across any DSP**, and there are **no one-to-one fee/billing/integration negotiations** [12][13].\n- **PubMatic Connect (curation) + Activate (media activation)** — 190+ premium data partners; data embedded sell-side at the publisher level; **37% CPM improvement** when data is applied via Connect vs. buy-side, **25%+ higher eCPMs**, and Activate adopted by **100% of the \"Big Six\" agencies** [9]. PubMatic explicitly positions Activate as cutting DSP hops out of direct CTV/OLV buys.\n- **Magnite ClearLine** — unified curation and activation in one tool (October 2025), built on the SpringServe infrastructure so curated campaigns execute \"closer to the impression,\" reaching 109M US ad-supported households; agentic workflows via the streamr.ai acquisition.\n- **Yahoo curation suite + Backstage** — Backstage is Yahoo's direct-to-publisher supply path; the curation suite layers Jounce/Peer39/Scope3 supply intelligence; Nexxen's ACR segments were licensed into Yahoo DSP's Unified TV Audience offering (October 2025), strengthened with ConnectID.\n- **FreeWheel Curation Hub** — a *new* buy-side curation tool in the April 2025 rebrand, letting agencies unify CTV supply portfolios and \"curate and activate their own deals,\" with the FreeWheel Identity Network layering Comcast first-party data.\n\nPractitioners state the structural advantage plainly: SSP-level matching gives near-real-time activation and reporting, whereas DSP-level curation historically meant waiting \"30 to 90 days,\" and sell-side matching sidesteps \"DSP gatekeeping\" of alternative IDs. For an ACR intermediary, curation keeps the segment proprietary — it lives in *your* curated deal, not in a buyer's audience library — and keeps the margin defensible, with no data-marketplace tax on top of the SSP fee, at least at Index.\n\n---\n\n## 3. Platform-by-Platform: Dimension 3 (ACR Onboarding/Activation) and Dimension 6 (Clean Room/Identity)\n\n### 3.1 The Trade Desk\n\n**Dimension 3 — onboarding/ACR activation.** Best-in-class buy-side onboarding via UID2/EUID and RampID; ACR households resolve to UID2 with strong CTV match because of logged-in inventory. The December 2025/early-2026 **\"Audience Unlimited\"** overhaul of its data marketplace prices third-party data inclusively at **3.3% / 4.4% of impression costs in Control Mode** (free in Performance Mode), AI-scoring segments by campaign relevance across hundreds of providers and replacing a-la-carte data pricing. For a *licensed* ACR segment, the intermediary typically onboards it as a custom audience via RampID/UID2 rather than buying from the marketplace. So the onboarding mechanics matter more than the Audience Unlimited rate — and TTD does not fee first-party/custom uploads separately.\n\n**Dimension 6 — clean room/identity.** UID2 is the deterministic spine; TTD has no general-purpose clean room of AMC's depth, but offers measurement and Deal Desk. The live caveat for the intermediary's *control*: **WPP and Dentsu quietly exited TTD's OpenPath (February 2026) over hidden fees and transparency** [27] — a direct signal that even the buy-side \"open\" path can obscure economics. TTD's response was that OpenPath is offered at cost [27].\n\n*Intermediary verdict:* excellent for deterministic CTV activation and reach; the segment is reasonably protected as a custom audience, but the platform's scale and OpenPath economics create disintermediation pressure on the intermediary's spread.\n\n### 3.2 Yahoo DSP\n\n**Dimension 3.** Onboards ACR via ConnectID (213M US / 345M global logged-in, Q1 2026) and standard partners (Experian, LiveRamp). The Nexxen ACR licensing into Yahoo's Unified TV Audience (Oct 2025, US/UK/Germany) is the template for how a *third-party ACR vendor's* segments enter Yahoo and get \"strengthened with ConnectID\". An intermediary's Samba segment can ride the same rail.\n\n**Dimension 6.** ConnectID is a logged-in identity asset; Backstage + the Jounce/Peer39/Scope3 curation suite give a sell-side decisioning option *inside* Yahoo's stack. Yahoo is a founding AdCP member [25].\n\n*Intermediary verdict:* strong identity reach and a credible curation suite; less DSP-agnostic by nature (its value concentrates in Yahoo's owned identity and supply), but a real ACR activation home.\n\n### 3.3 Amazon DSP\n\n**Dimension 3.** The most *restrictive* home for licensed third-party ACR data. There is no generic 3P-onboarding pipe. The intermediary brings its own pseudonymous data into **AMC** (Section 4.1) and joins it to Amazon signals, or activates RampID-based audiences via the LiveRamp–Amazon integration (bid and frequency-cap on RampID in Amazon DSP) [8]. Custom audiences built in AMC require **2,000+ matched customers** before DSP use, and uploads match at roughly **65–80%**.\n\n**Dimension 6.** AMC is the gold-standard retail-outcome clean room: built on AWS Clean Rooms, event/user-level querying with aggregation thresholds, attribution windows up to 28 days, lookback extended to **24–25 months** (Nov 2025), and **free for Sponsored Ads advertisers since September 2025** [7]. It connects CTV impressions to in-Amazon purchases — uniquely valuable for outcome measurement.\n\n*Intermediary verdict:* indispensable for retail-outcome measurement and Prime Video/Roku-adjacent reach, but a walled garden where the ACR segment must be uploaded into Amazon's environment and cannot be ported out — the *least* margin-friendly path and the highest data-exposure risk for a portable segment. Use it for measurement and closed-loop, never as the primary activation home for a proprietary ACR segment.\n\n### 3.4 FreeWheel DSP + Buyer Cloud (Comcast/FreeWheel)\n\n**Dimension 3.** The April 2025 rebrand (Beeswax DSP → FreeWheel DSP; Beeswax BaaS → FreeWheel Buyer Cloud) added **FreeWheel Curation Hub**, a buy-side curation tool for agencies to curate/activate their own deals, plus the **FreeWheel Identity Network** layering Comcast first-party data with third-party identity solutions. Buyer Cloud (bidder-as-a-service) gives \"full transparency and control over data activation, decisioning, optimization, and measurement\" — the most *customizable* onboarding for a sophisticated intermediary that wants to run its own bidder logic.\n\n**Dimension 6.** Comcast made **linear TV biddable via Buyer Cloud (October 23, 2025)** — 11B+ monthly linear impressions in PMPs alongside CTV. Identity rests on Comcast/FreeWheel first-party data plus integrated solutions; no AMC-class clean room, but premium NBCU/Comcast supply.\n\n*Intermediary verdict:* the most *control-friendly* infrastructure (custom bidder, transparency, customization) and a strong premium-CTV + biddable-linear supply story; the trade-off is concentration in Comcast supply and a smaller open-market footprint.\n\n### 3.5 Index Exchange\n\n**Dimension 3 — the standout for proprietary ACR activation.** The **Data Vendor Ecosystem** + **Samba×Index agentic marketplace** is the cleanest sell-side path: embed the ACR segment at the point of decision, activate in deal IDs across any DSP, **no separate data fee**, **vendor keeps 100% of segment revenue** [1][12][13]. Launch DVE partners include Experian, Audigent, LiveRamp Data Marketplace, Lotame, Peer39, Proximic, IRIS.TV, and (for streaming TV) Samba [12].\n\n**Dimension 6.** Index is a pure SSP — no owned consumer identity graph and no AMC-class clean room — which is precisely *why* it is attractive: it does not compete with the intermediary for the audience relationship; it rents the rails. Identity is brought *by* the data vendor (Samba's spine, RampID, etc.). Index is leaning into agentic curation (AdCP-adjacent) [1][25].\n\n*Intermediary verdict:* the **most margin- and control-friendly** home for a proprietary licensed ACR segment — no data tax, no owned-identity competition, DSP-agnostic by construction.\n\n### 3.6 Magnite (incl. ClearLine)\n\n**Dimension 3.** ClearLine unifies curation and activation (Oct 2025); buyers/curators discover, package, and activate inventory in one tool with access to first-party data and content signals across 109M US ad-supported households; built on SpringServe so execution is close to the impression; agentic via streamr.ai. An intermediary can curate its ACR segment into ClearLine deals.\n\n**Dimension 6.** Like Index, Magnite is sell-side; identity is brought by the data partner; no owned consumer graph or AMC-class clean room. AdCP member [25].\n\n*Intermediary verdict:* strong CTV-scale curation home and the largest pure-CTV SSP footprint; ClearLine's dual identity (buy-side tool *and* SSP) is a mild conflict-of-interest flag (Magnite can act as curator), but the activation mechanics are sound and DSP-agnostic.\n\n### 3.7 PubMatic\n\n**Dimension 3.** Connect (190+ data partners) + Activate is a mature sell-side activation stack; **37% CPM improvement** applying data via Connect vs. buy-side, **25%+ higher eCPMs** [9]. The intermediary's ACR segment can be curated into Connect and bought via Activate or any DSP.\n\n**Dimension 6.** Sell-side; identity brought by partner; PubMatic positions itself as \"enabling the business model of curators, rather than PubMatic as a curator\" — a deliberately intermediary-friendly stance. PubMatic's CEO argues the buyer-paid CPM is declared in the SSP at deal setup, so hidden stacking \"cannot occur,\" and most ecosystems use net bidding. AdCP founding member [25].\n\n*Intermediary verdict:* highly intermediary-friendly curation economics and strong performance lift; PubMatic explicitly does not want to be the curator competing with you — a meaningful trust signal.\n\n---\n\n## 4. Clean Rooms: Building ACR Audiences and Running Measurement\n\n### 4.1 Amazon Marketing Cloud (AMC)\n\nAMC is the deepest closed-loop clean room for an ACR intermediary that needs retail outcomes. The intermediary uploads pseudonymous inputs (its licensed ACR households, hashed) into a dedicated AMC instance, joins them to Amazon campaign and shopping signals, builds custom audiences (2,000+ minimum), and measures CTV→purchase attribution. Match rate runs **65–80%**; lookback **24–25 months**; attribution windows up to 28 days; **free for Sponsored Ads advertisers since Sept 2025** [7]. The catch: the segment lives in Amazon's environment and activates only on Amazon DSP. Powerful for closed-loop, useless for portability.\n\n### 4.2 Snowflake (and cloud-native collaboration)\n\nSnowflake is the warehouse-native option — best when both the intermediary and the data partner already live in the Snowflake Data Cloud and have the technical depth to use it. It is the most *neutral* venue, with no media owner incentivized to commoditize the segment, but it makes the intermediary build its own identity resolution and activation plumbing. This is collaboration infrastructure, not a turnkey activation pipe.\n\n### 4.3 LiveRamp Clean Room (powered by Habu)\n\nLiveRamp acquired Habu (2024) to add a pre-built activation footprint connecting AWS, Google Cloud, Snowflake, Azure, and Databricks [16]. For an intermediary already onboarding via RampID, LiveRamp's clean room is the natural measurement-and-collaboration layer with the widest activation reach — the closest thing to a neutral, interoperable, identity-anchored clean room that also activates.\n\n### 4.4 InfoSum (now WPP)\n\nInfoSum's \"non-movement\" architecture is now embedded in WPP Open [16]. The consequence: InfoSum is no longer a neutral third party. It is holdco infrastructure. An independent intermediary should weigh whether routing ACR collaboration through a holding-company-owned clean room squares with staying agnostic and shielding its IP from a competitor's parent.\n\n### 4.5 The interoperability limit — and \"the end of the clean room era\"\n\nThe honest constraint: clean rooms do not interoperate cleanly. Running an ACR audience across AMC *and* Snowflake *and* LiveRamp means duplicated data prep, management, extraction, and per-system ad-server integration — friction the IAB Tech Lab's own guidance acknowledges. The IAB's first interoperability standard, **Open Private Join and Activation (OPJA)**, gave way to **PAIR** (donated by Google), now the de-facto match-activation spec. AdExchanger's framing — **\"2025 marked the end of the data clean room era\"** [16] — does not mean clean rooms failed. It means they were *absorbed*: AWS Clean Rooms (free, native), Snowflake, and Google Cloud marginalized standalone vendors, and the language shifted to \"data collaboration\" and \"composability.\" The practical reading for the intermediary: **pick the clean room that matches where your activation lives** — AMC for Amazon outcomes, LiveRamp/Habu for cross-platform reach, Snowflake for neutral collaboration — and do not expect to run one ACR audience seamlessly across all three.\n\n---\n\n## 5. Identity: How an ACR Household Maps Into Each Framework\n\n| Framework | Type | How an ACR household maps in | Best fit for the intermediary |\n|---|---|---|---|\n| **RampID (LiveRamp)** | Deterministic, people-based | ACR household → shared email/MAID/IP key → RampID; buyable & freq-cappable in TTD, Amazon DSP | Cross-platform portable activation; CTV-ID sync first to lift match |\n| **UID2 / EUID** | Deterministic, hashed email/phone | ACR household needs an authenticated email/phone to resolve; strongest on logged-in CTV | TTD-centric and logged-in CTV; EUID for EU |\n| **Yahoo ConnectID** | Deterministic logged-in (Yahoo) | ACR segment strengthened *by* ConnectID inside Yahoo (Nexxen template) | Yahoo-DSP activation and Yahoo-owned supply |\n| **Experian/Tapad + Audigent** | Deterministic + modeled graph | ACR onboarded to Experian graph; activatable DSP & SSP via Audigent SmartPMP | Curation-led activation with identity enrichment |\n| **Amazon first-party** | Deterministic (Amazon-only) | Hashed upload into AMC; 65–80% match; Amazon-DSP-only activation | Closed-loop retail outcomes; not portable |\n| **Samba identity spine** | Deterministic+modeled, 1B+ person IDs | The ACR data *is* Samba's; Project Gravity assigns one deterministic ID into 40+ platforms | The intermediary's own segment, ported widely |\n| **Seller-Defined / Curated Audiences (IAB)** | ID-less taxonomy | ACR audience expressed as a publisher-side audience taxonomy, no shared ID | ID-less environments; standards-based portability |\n\nThe deterministic-vs-modeled line is the value line. Samba's spine and RampID/UID2 are deterministic where a consented key exists, modeled at the edges; AMC is deterministic but Amazon-bounded; IAB Seller-Defined/Curated Audiences (rebranded from SDA, end-2024) are deliberately ID-less and run over OpenRTB/Prebid — a fallback for cookieless/ID-less CTV that trades precision for reach and privacy durability. Deterministic where you can get it; modeled where you cannot.\n\n---\n\n## 6. The Case For and Against Sell-Side Curation as the ACR Activation Path\n\n### 6.1 The case FOR (curation keeps ACR proprietary and margin defensible)\n\n1. **No data tax on the best venue.** Index DVE charges no separate data-marketplace fee; the data vendor keeps 100% of segment revenue [12][13]. The intermediary's spread is not eroded by a curation tax stacked on the SSP fee.\n2. **Higher working media / lower effective CPM.** PubMatic's 37% CPM improvement and 25%+ eCPM lift from sell-side data application [9], and Magnite's claim of materially higher working media via ClearLine vs. DSP activation (discussed in the chapter on margin economics), reflect that matching the segment to publisher first-party data *before* the auction beats pushing it through a DSP with match decay.\n3. **The segment stays yours.** In a curated deal the ACR audience lives in *your* deal ID, not in a buyer's audience library where it can be observed, modeled, or copied. The DSP buys the *outcome* (a deal), not the *segment*.\n4. **DSP-agnostic by construction.** A deal ID is buyable across any DSP [12]. Curation is the one architecture that lets the intermediary stay free to move spend across DSPs while keeping one canonical, proprietary ACR segment on the sell side.\n5. **Real-time and agentic-ready.** Sell-side matching is real-time (vs. 30–90 day DSP cycles), and AdCP's Audience-Activation and Curation sub-protocols (Oct 2025) standardize agentic curation — the curation rail is where the agentic future is being built [25].\n\n### 6.2 The case AGAINST (the strongest counter: curation concentrates power and opacifies fees)\n\n1. **Power and margin migrate to SSPs.** Sell-side curation moves strategic control *and* margin from DSPs to SSPs; the industry's \"center of gravity\" is shifting sell-side. An intermediary that becomes curation-dependent is dependent on platforms that can change terms.\n2. **Curator fees are a black box.** Critics document curators charging **30%+** to repackage existing SSP inventory into \"exclusive\" lists, with non-disclosed markups bundled into the CPM [22]. The \"no Index data fee\" virtue is *Index-specific*; the broader curation market is opaque, and fee-stacking (curator cut after the DSP fee, before the SSP is paid) is the live concern PubMatic's CEO had to rebut [22].\n3. **Buyers lose log-level insight.** DSPs \"raise the alarm\" about ID-bridging — they cannot verify which alternative IDs built a sell-side segment. The intermediary running performance campaigns may lose the granular signal it needs to optimize and to *prove* the ACR segment's incrementality.\n4. **Conflict of interest where the SSP is also the curator.** Magnite ClearLine is both an SSP and a buy-side curation tool; an SSP that curates can favor its own packages. The intermediary must watch for self-preferencing.\n5. **Opacity is not unique to the sell side.** The WPP/Dentsu OpenPath exit (Feb 2026) over \"hidden fees and transparency\" [27] shows the *buy-side* \"open\" paths can be just as opaque — the lesson is that *any* intermediated path, buy or sell, requires fee transparency the intermediary must contractually force, not assume.\n\n### 6.3 Reasoned synthesis\n\nThe counter-case does not defeat the case; it conditions it. Sell-side curation is the right default *for a proprietary ACR segment* because it uniquely keeps the segment out of buyer audience libraries, avoids match decay, and (at Index specifically) carries no data tax. But four disciplines apply. The intermediary must (a) prefer venues with declared, net-bidding, no-separate-data-fee economics (Index DVE, PubMatic's curator-enabling stance) over black-box curators, (b) write log-level / impression-level reporting into every curation deal to preserve optimization signal and incrementality proof, (c) treat AMC as a measurement/closed-loop tool rather than an activation home for portable segments, and (d) keep DSP-side onboarding (RampID/UID2) live for walled gardens and reach pockets where the DSP's identity genuinely adds match. The agnostic posture is one line: **one canonical ACR segment, curated sell-side as the default, onboarded DSP-side where the garden is walled, measured in the clean room that matches the outcome.**\n\n---\n\n## 7. Risks: Match Rates, Onboarding Fees, and Data-Leakage / IP Protection\n\n- **Match rates.** AMC matches ~65–80%; LiveRamp explicitly recommends a CTV-ID sync to lift CTV match; UID2 depends on authenticated email/phone, which is scarcer on some CTV inventory. Every onboarding hop sheds match; sell-side matching against publisher first-party data is the loss-minimizing path.\n- **Onboarding / data fees.** DSP-side: TTD Audience Unlimited at 3.3%/4.4% of impression cost (Control Mode); a-la-carte data and LiveRamp Data Marketplace pricing add CPM- or PoM-based fees. Sell-side: Index charges *no* separate data fee [12]; other curators may take 30%+ opaquely [22]. The fee delta strongly favors disciplined sell-side venues.\n- **Data leakage / IP protection — the existential risk.** Uploading a licensed ACR segment into a buyer platform (custom audience) or a media-owner clean room (AMC) exposes it to observation, modeling, and potential commoditization, and may violate the ACR license's resale/derivation terms. Curation mitigates this: the segment stays in the intermediary's deal, and the buyer transacts the deal, not the segment. **Does activating on a given platform expose or commoditize the segment? Yes, most on Amazon DSP/AMC (segment enters Amazon's environment) and on any DSP custom-audience upload; least on a pure-SSP curated deal (Index/Magnite/PubMatic) where the SSP has no owned-identity incentive to replicate it.** Project Gravity is Samba's own answer — keeping the matching and ID assignment under Samba's control before distributing one deterministic ID to 40+ platforms [4][5] — and an intermediary licensing Samba data inherits it as a leakage control.\n\n---\n\n## Open Questions\n\n1. **What is Index DVE's economic durability?** \"No separate data fee\" is the current, Index-specific virtue. Will it survive as DVE scales and extends to media owners in 2026, or will a data fee appear? (Single-source-ish on the fee structure: Index's own materials + AdExchanger.)\n2. **What are real, current CTV match rates by path?** Published rates are sparse and vendor-stated. The intermediary needs measured match rates for Samba→RampID→TTD vs. Samba→Index curation on the *same* inventory.\n3. **Does the ACR license permit sell-side curation at all?** Samba's own programs (Index, Gravity) clearly do; a *generic* ACR license (e.g., Inscape) may restrict derivation/resale into curated deals. License terms govern which architectures are even legal.\n4. **How much log-level data do curation deals actually expose?** The optimization and incrementality-proof case for curation depends on getting impression-level data back; the depth varies by SSP and is under-documented.\n5. **Will AdCP's Curation/Audience-Activation protocols commoditize the curation advantage?** If agent-to-agent audience discovery becomes standardized and open, does the proprietary-segment moat erode (anyone's agent can find and buy the segment) or strengthen (the intermediary's agent activates faster)?\n6. **Is Telly/Theta a real future ACR source at activation scale?** Not yet established at scale as of mid-2026.\n7. **Post-WPP, is InfoSum usable by an independent intermediary** without exposing IP to a holdco competitor's infrastructure?\n\n---\n\n## Sources\n\n1. Index Exchange, \"Samba TV Joins Index Marketplaces to Launch Agentic-Curated Media Marketplace,\" press release, 2025-12-03. https://www.indexexchange.com/press/press-releases/samba-tv-index-agentic-curated-media-marketplace/ — *Tier 1 (primary, company release; position-evidence for performance claims). Accessed 2026-06-17.*\n2. Samba TV, \"Samba TV Joins Index Marketplaces…,\" press release, 2025-12-03. https://www.samba.tv/press-releases/samba-tv-joins-index-marketplaces-to-launch-agentic-curated-media-marketplace-powered-by-sambas-first-party-behavioral-and-contextual-data — *Tier 1 (primary). Identity-spine figures. Accessed 2026-06-17.*\n3. Samba TV, \"Samba TV Launches Project Gravity,\" GlobeNewswire, 2026-05-21. https://www.globenewswire.com/news-release/2026/05/21/3299822/0/en/samba-tv-launches-project-gravity-an-independent-data-activation-platform-for-the-agentic-era.html — *Tier 1 (primary via newswire). Scale/opt-in figures. Accessed 2026-06-17.*\n4. Advanced Television, \"Samba TV: Project Gravity, Independent Data Activation Platform for the Agentic Era,\" 2026-05-22. https://www.advanced-television.com/2026/05/22/samba-tv-project-gravity-independent-data-activation-platform-for-the-agentic-era/ — *Tier 5 (trade press). 40+ platforms, named DSPs/SSPs. Accessed 2026-06-17.*\n5. Samba TV, \"Samba TV Launches Data Activation Platform for the Agentic Era,\" via Demand Gen Report, 2026-05. https://www.demandgenreport.com/industry-news/news-brief/samba-tv-launches-data-activation-platform-for-the-agentic-era/53262 — *Tier 5 (trade). Corroborates Gravity. Accessed 2026-06-17.*\n6. AdExchanger, \"The Marketer's Guide To ACR Tech In Smart TVs.\" https://www.adexchanger.com/ad-exchange-news/the-marketers-guide-to-acr-tech-in-smart-tvs/ — *Tier 5 (trade). ACR vendor scale and licensing split; NOTE: snapshot is dated re: Samba licensing. Accessed 2026-06-17.*\n7. Amazon Ads / eMarketer reporting, AMC free for Sponsored Ads advertisers (Sept 2025) and 13→25-month lookback (Nov 2025), via eMarketer \"FAQ on data clean rooms.\" https://www.emarketer.com/content/faq-on-data-clean-rooms-how-retail-media-driving-adoption-marketers-demand-proof — *Tier 5 (analytical). Going-concern AMC updates. Accessed 2026-06-17.*\n8. LiveRamp, \"LiveRamp Delivers New Privacy-Centric Integrations with Amazon Ads,\" 2024-02-13. https://liveramp.com/news/liveramp-delivers-new-privacy-centric-integrations-with-amazon-ads — *Tier 1 (primary). RampID in AMC + Amazon DSP. NOTE: dated 2024; mechanics current but confirm recency. Accessed 2026-06-17.*\n9. PubMatic, \"PubMatic's Connect Platform for Curation Delivers for Publishers…,\" press release, 2025-03-20. https://pubmatic.com/news/pubmatics-connect-platform-for-curation-delivers-for-publishers-drives-25-higher-ecpms-incremental-revenue-and-diverse-demand/ — *Tier 1 (primary; performance figures are company-stated, position-evidence). 190+ partners, 37% CPM, 25%+ eCPM. Accessed 2026-06-17.*\n10. PubMatic, \"Activate Achieves Significant Industry Adoption: 100% of 'Big Six' Agencies.\" https://pubmatic.com/news/pubmatics-activate-industry-adoption-efficiency-and-growth/ — *Tier 1 (primary; adoption is company-stated). Accessed 2026-06-17.*\n11. AdExchanger, \"PubMatic Cuts DSPs Out Of Direct CTV And O
