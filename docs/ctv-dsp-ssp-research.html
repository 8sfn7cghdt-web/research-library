an advertiser's own agent can route path-agnostically from a prompt, the agnostic-routing service an intermediary sells may be commoditized into the protocol layer (AAMP/AdCP) itself.\n4. **How durable is the independent DSP?** Microsoft killed Xandr Invest while keeping its sell side; does that foreshadow further independent-DSP attrition, and does it leave TTD as the last large independent buy-side platform standing — with the pricing power that implies?\n5. **Will the transparency movement (ANA + log-level data) actually clear the opacity that makes margin capture possible?** The intermediary's spread and the buy side's transparency demand are on a collision course; the timeline of that collision is unsettled.\n6. **Does CTV's deal-centricity persist as supply scales, or does growth eventually push more CTV into the open/curated auction**, changing where audience attachment (and thus margin) lives?\n7. **How will walled gardens (Amazon, Roku, Prime Video) interact with the open-web convergence** — do they open enough to be part of the agnostic intermediary's routable supply, or do they remain separate margin regimes the intermediary cannot capture spread inside?\n\n---\n\n## Sources\n\n1. SEC EDGAR / Google Inc., Form 8-K (DoubleClick acquisition, $3.1B), April 2007. https://www.sec.gov/Archives/edgar/data/0001288776/000119312507084483/dex991.htm — **Tier 1** (primary filing). Confirms DoubleClick price/date.\n2. Digiday, \"How Google took control over online advertising, according to those who watched it happen.\" https://digiday.com/marketing/how-google-took-control-over-online-advertising-according-to-those-who-watched-it-happen/ — **Tier 4/5** (trade outlet, retrospective). 2007 exchange land-grab and Google vertical integration.\n3. AdExchanger / industry history syntheses on RTB origins and the DSP/SSP split, and the \"remnant inventory\" framing of early exchanges (paleoadtech / AdExchanger archive). https://www.adexchanger.com/data-driven-thinking/history zing Jounce; note sell-side lean). Source for the specific percentages.\n42. AdExchanger, Anthony Vargas, \"Publishers: Don't Fear Curation Fees, They're Just The Same Old Ad Tech Tax,\" May 1, 2025 (net-to-publisher/gross-to-marketer roughly unchanged; Messer and Chen quotes on opacity). https://www.adexchanger.com/programmatic/publishers-dont-fear-curation-fees-theyre-just-the-same-old-ad-tech-tax/ — **Tier 5** (trade). The fee-relocation/\"ad tech tax\" critique.\n43. INMA, \"Advertising enters the agentic era…\" and AdExchanger \"PubMatic Is All In On Agentic AI\" (Feb 26, 2026); coverage of TTD Koa/Kokai/Open Agentic Kit, Magnite SpringServe seller agent (Dec 2025) + Scope3 test, AdCP on Anthropic MCP, IAB Tech Lab AAMP named Feb 26, 2026. https://www.inma.org/blogs/advertising-initiative/post.cfm/advertising-enters-the-agentic-era-as-ai-agents-begin-buying-and-selling-media ; https://www.adexchanger.com/programmatic/pubmatic-is-all-in-on-agentic-ai/ — **Tier 5** (trade) + standards bodies. Agentic overlay and AAMP/AdCP.\n44. PubMatic, \"PubMatic Launches AgenticOS…\" (Jan 2026) and BusinessWire \"PubMatic Launches Decision Fabric on AgenticOS\" (June 1, 2026); Goel 25%/2028, 50%/2030 forecast, 250+ agentic campaigns. https://pubmatic.com/news/pubmatic-launches-agenticos-the-operating-system-for-agent-to-agent-advertising/ ; https://www.businesswire.com/news/home/20260601293162/en/ — **Tier 1** (company press releases: claims/forecasts, not independent proof). Agentic product status and dates.\n45. PPC.land, \"FreeWheel plugs an MCP server into premium video ad deals, pilots with PMG,\" 2025/2026. https://ppc.land/freewheel-plugs-an-mcp-server-into-premium-video-ad-deals-pilots-with-pmg/ — **Tier 5** (trade). FreeWheel agentic/MCP pilot.\n46. FreeWheel, \"FreeWheel Unveils New Suite and Solution Names,\" and PPC.land \"FreeWheel unifies CTV product ecosystem with new suite names\" (May 3, 2025, confirming April 29, 2025 rebrand; Beeswax DSP → FreeWheel DSP; BaaS → Buyer Cloud; new Curation Hub). https://www.freewheel.com/insights/blog/freewheel-unveils-new-suite-and-solution-names ; https://ppc.land/freewheel-unifies-ctv-product-ecosystem-with-new-suite-names/ — **Tier 1 (company) + Tier 5 (trade)**. Rebrand mapping. **Going-concern: rebrand confirmed April 29, 2025.**\n47. AdTechRadar, \"FreeWheel Declutters With New CTV Suites,\" April 28, 2025 (corroborating rebrand and product structure). https://adtechradar.com/2025/04/28/freewheel-declutters-with-new-ctv-suites/ — **Tier 5** (trade).\n48. Comcast Advertising / BusinessWire, \"Comcast Advertising Makes Traditional TV Biddable for the First Time,\" Oct 23, 2025 (biddable linear via FreeWheel Buyer Cloud; PMP; Dentsu/Stitch Head campaign; 11B monthly linear impressions opened). https://www.businesswire.com/news/home/20251023783708/en/ ; https://comcastadvertising.com/news/comcast-advertising-makes-traditional-tv-biddable-for-the-first-time/ — **Tier 1 (PR) + Tier 5 (trade)**. **Going-concern: announced Oct 23, 2025; post-beta rollout described as in progress — verify current availability.**\n\n---\n\n*Tier and lean notes:* This document leans heavily on Tier 5 trade press (AdExchanger, Digiday, ExchangeWire, AdTechExplained) and specialist analysts (Jounce Media), because the recent history of ad-tech product launches and convergence is documented almost nowhere else with this granularity — the peer-reviewed corpus lags by years. Where a claim rests on a company's own press release (Tier 1), it is flagged as evidence of what the company *claims/announced*, not as independent proof the product works or persists. Vendor and sponsored sources (Index \"WTF is sell-side decisioning,\" Playwire/Jounce summaries) are used for definitions, positions, and specific disclosed figures, with their sell-side or buy-side lean noted. No Wikipedia citation is used for a substantive claim; the two Wikipedia references are navigation aids whose facts are corroborated against trade reporting. Adoption and scale figures attributed to a single vendor (Yahoo Backstage usage, Index Marketplaces tripling, PubMatic agentic counts) are flagged as that vendor's own reporting and should be triangulated before forward reliance."}, {"order": 3, "file": "02_Independent_DSPs_TradeDesk_Yahoo.md", "title": "The Independent Generalist DSPs: The Trade Desk & Yahoo DSP", "summary": "", "body": "# The Independent Generalist DSPs: The Trade Desk & Yahoo DSP\n\n## Bottom Line\n\nAn intermediary lives on the spread between what it bills an advertiser and what it clears in-platform. Two big independent generalist DSPs sit in front of it, and they split on a single axis: **scale-with-friction (The Trade Desk) versus flexibility-with-fragility (Yahoo DSP)**.\n\nThe Trade Desk is the deepest non-walled-garden CTV pipe in the market — $13.4B of gross platform spend in 2025, CTV its largest channel, 95%+ client retention for twelve straight years. Yet structurally it is the *least* hospitable seat for a reseller's margin model. Its take rate stays opaque: ~20% of platform spend disclosed-by-inference, plausibly nearer 29% advertiser-side once data/feature fees stack. Its self-service-only design means it runs no managed-service arm that competes with you. But its forced march to the Kokai AI interface (75% of platform spend by Q1 2026, not the 100% management targeted) and its OpenPath direct-supply push both erode two things an intermediary uses to defend margin: auction visibility and post-auction give-backs.\n\nYahoo DSP is the more *intermediary-friendly* of the two on paper: explicit \"no hidden fees\" positioning, a Backstage take rate it calls \"a fraction\" of SSP and rival-DSP rates, the first DSP to adopt IAB Data Transparency Labels (Jan 2025 announcement), a \"speed not AI\" pitch that keeps the human trader in control, and a 213M-US / 345M-global ConnectID identity spine (Q1 2026) that activates licensed ACR data well. But it is a smaller, Apollo-owned asset that held exploratory sale talks in late 2025 — the riskier long-term bet for a partner whose supply commitments must outlive a change of owner.\n\n**The agnostic intermediary's defensible play is to treat The Trade Desk as the performance-and-scale workhorse it cannot avoid while ruthlessly auditing its fee stack, and to treat Yahoo DSP as the transparency-and-flexibility hedge — not to trust either's black-box optimizer (Koa/Kokai or Blueprint) without log-level verification.** Licensed ACR data (Samba TV) now activates across both, but increasingly *around* them via Samba's own Project Gravity onboarding layer (launched May 2026) — itself a quiet disintermediation of the DSP's audience-marketplace fee.\n\n---\n\n## Orientation: why these two, and why \"independent generalist\" matters\n\nThe CTV buy-side is no longer a clean DSP-versus-SSP map. Walled gardens — Amazon, Roku, the streamers' own stacks — wall off inventory. Sell-side platforms have built buy-side activation that disintermediates DSPs. DSPs have built direct-to-publisher paths that disintermediate SSPs. Inside that blur, **The Trade Desk and Yahoo DSP occupy the same niche an agnostic intermediary most depends on: independent, generalist, multi-publisher demand-side platforms that are not themselves a media owner.** Neither tries to sell you *their* inventory the way a Comcast/FreeWheel or an Amazon does; both are, in principle, neutral routers of spend across the open CTV ecosystem. That neutrality is exactly what an intermediary that wants to \"stay free to move spend across any DSP or SSP\" needs. It is also exactly what direct-supply land-grabs (TTD's OpenPath, Yahoo's Backstage) and AI optimizers are quietly compromising on both platforms, abstracting away the auction the intermediary needs to see.\n\nWhat follows evaluates each platform across the eight dimensions in turn, then closes with a positives-versus-negatives comparison and a reasoned view of which better serves a DSP/SSP-agnostic margin-capture model. **A standing caveat on take rates:** neither platform discloses a clean, auditable take rate. TTD's ~20% is *inferred* from publicly reported gross spend versus revenue; Yahoo's stays private under Apollo. Every margin claim below should be read against that limit.\n\n---\n\n# PART ONE — THE TRADE DESK\n\nThe Trade Desk is the largest independent DSP in the world and, by its own and analysts' accounting, the deepest pool of non-walled-garden CTV demand. It is also the platform whose interface, supply strategy, and fee structure all moved in 2025–26 to *reduce* an intermediary's room to operate. You cannot run serious open-market CTV without it. It is also the least margin-friendly seat in the market. That tension is the whole story.\n\n## TTD-1. CTV supply access & scale\n\n**The Trade Desk is the scale leader in independent CTV demand, and CTV is its single largest channel.** For full-year 2025 the company reported **$2.9B in revenue (up 18% YoY)** on **$13.4B of gross spend** across its platform, with **adjusted EBITDA of $1.196B (41% margin)** and **customer retention above 95% for the twelfth consecutive year** [1]. On the Q4 2025 call, management characterized CTV as its largest and fastest-growing channel, with video (inclusive of CTV) accounting for roughly half of the business in Q4 2025 [1]. Q1 2026 revenue came in at **$689M, up ~12% YoY**, beating consensus [2].\n\nTTD's CTV supply is genuinely broad. It transacts across the major ad-supported streamers and FAST services in the open programmatic market, supplemented by **OpenPath** direct-publisher integrations (A+E, CTV providers, and \"thousands of publishers\" per Digiday) [3] and, from 2025–26, an OS-level ecosystem play in **Ventura** (below). The practical read for an intermediary is simple. If you need open-market CTV scale outside the walled gardens, you cannot route around The Trade Desk, and most performance CTV benchmarks the market quotes are run there.\n\nThe caveat is *what kind* of supply. Premium streamers increasingly transact via private marketplace (PMP) and programmatic guaranteed rather than open auction — Deal Desk's own framing is that PMP is \"over 60% of programmatic spend\" [4]. So \"supply access\" on TTD increasingly means *deal access*. That raises the stakes on two other dimensions: the deal/curation question (TTD-4) and the transparency of OpenPath (TTD-2).\n\n## TTD-2. Fee/take-rate structure & transparency\n\n**This is the dimension where The Trade Desk is hardest on an intermediary, and where the public record is thinnest.** TTD does *not* publish a take rate as a line item. The widely cited \"~20% of spend\" comes from dividing reported revenue by reported gross spend — for 2025, $2.9B / $13.4B ≈ **21.6%**, consistent with prior years' ~19–20% implied figures [1]. TTD itself has said publicly its take rate \"has been consistently around 20% of spend on our platform, and there is no plan to change that\" — but that is a positioning statement, not an audited disclosure.\n\nThe more important point for a margin-capturing intermediary: the *advertiser-side* effective cost runs materially higher than the platform's headline take. Reconstructing TTD's economics from its own disclosures, analyst Tom Triscari (Quo Vadis) argued the ~19% platform take understates a real advertiser-side take closer to **~29%** once you count pre-auction deductions — agency-desk, audience-data, ad-serving, and verification fees that come out before media clears — plus TTD's audience-targeting revenue [5]. Digiday practitioners likewise report effective total fees of **30%+ of gross spend** once data and feature costs stack on top of the core platform fee [6]. Triscari leans skeptical of TTD's disclosure sufficiency; his number is an *inference*, not an audited figure. Read it as a directional argument that the fee stack runs deeper than \"20%.\"\n\nTwo 2025–26 supply moves are doubly relevant here:\n\n- **OpenPath** (launched 2022) is TTD's direct-to-publisher path. It is free to advertisers/agencies; publishers pay roughly **5% of advertiser spend** [3]. But media buyers in late 2025 *pulled or paused* OpenPath spend over transparency: agencies reported \"not a ton of visibility\" into exact pricing, one buyer estimated TTD applied a **\"premium between 10 to 15%\"** on OpenPath versus a direct publisher deal, and — critically for an intermediary — OpenPath's \"clean\" supply **removes the post-auction give-backs agencies traditionally use to protect margin** [3]. Several large agencies \"significantly deprioritized OpenPath\" from autumn 2025 [3].\n- **OpenSincera** (free, launched June 6, 2025, after TTD acquired Sincera) exposes publisher-level supply-chain quality metrics — ads-in-view, ads-to-content ratio, page weight, refresh frequency — across 400,000+ publishers via an open API, even to competitors [7]. This is genuine *supply* transparency, not *fee* transparency: it tells you about inventory quality, not about TTD's own take.\n\nNet for an intermediary: **TTD's fee opacity cuts both ways.** The missing line-item take rate that frustrates auditors also lets a sophisticated reseller bury its own spread inside a complex bill. But it also means the intermediary cannot cleanly answer a client who asks \"what is TTD taking versus what are you taking?\" And OpenPath's removal of post-auction give-backs attacks a classic margin-recovery mechanism head-on.\n\n## TTD-3. Custom/3rd-party audience onboarding & ACR-data (Samba) activation\n\nTTD has a mature data marketplace and supports custom and third-party audience onboarding at scale; its **UID2/EUID** identity spine (TTD-6) is the privacy-durable rail most onboarding now rides. On ACR specifically, **The Trade Desk and Samba TV have a long-standing partnership** — originally integrating Samba's commercial-exposure/ACR data into TTD's Planner tool (announced May 2019), projected to ~80M US households, and **expanded globally in March 2020** beginning with Australia [8][9]. The integration enables cross-device reach/frequency forecasting, exposed/unexposed targeting against specific TV commercials, and audience segmentation of cord-cutters and light TV viewers [8].\n\nTwo honest caveats for the intermediary:\n\n1. **The most recent *dedicated* TTD–Samba milestone on the public record is the 2019–2020 integration/expansion.** There is no 2024–2026 TTD–Samba renewal or new-scope announcement; the partnership is best described as long-standing and presumably continuing, but its *present-tense* status rests on older sources and the broader ACR-activation pattern rather than a fresh confirmation.\n2. **ACR activation increasingly happens *around* the DSP.** Samba launched **Project Gravity** in May 2026 — an independent data onboarding/activation platform that matches advertiser first-party data against Samba's identity graph and pushes the resulting identifier into 40+ platforms including The Trade Desk, DV360, Amazon, Magnite, Meta, and TikTok [10]. For an intermediary this cuts both ways. It makes Samba ACR audiences portable across *every* DSP/SSP, which is good for agnosticism. But it routes activation through Samba's layer, potentially compressing the audience-marketplace fee the DSP — and any reseller marking up data — would otherwise capture.\n\nACR's structural limits apply on TTD as everywhere: ACR is **household-level, opt-in, and blocked by major streamers (notably Netflix)**. It is a planning/extension/measurement signal, not a universal targeting key [11].\n\n## TTD-4. Deal/PMP & curation capability\n\nTTD's deal capability matured sharply in 2025 with **Deal Desk**, launched June 2025 and in open beta by Q2 2026 — a centralized interface inside Kokai to propose, negotiate, activate, and manage PMP deals, with standardized deal metadata, shared **\"Deal Quality Scores\"** visible to both buyer and seller, and AI suggestions to expand or modify underperforming deals [4]. Disney was an early publisher; SVP Jamie Power is quoted supporting it [4]. The pitch is that PMP — \"over 60% of programmatic spend\" — historically lacked transparency and optimization, and Deal Desk standardizes it [4].\n\nFor an intermediary, Deal Desk is a genuine operational upgrade: it makes curated/PMP CTV deals manageable in-platform rather than over email. But note the strategic edge. **Shared Deal Quality Scores and identical performance benchmarks for buyer and seller reduce information asymmetry** — precisely the asymmetry an intermediary's curation/markup value depends on. The more the publisher sees the same numbers the buyer sees, the harder it is to defend a spread on \"we got you a better deal.\"\n\n\nCuration on TTD is comparatively *DSP-native*, not an open third-party curation marketplace. TTD's model historically routes data and supply decisioning through its own platform and OpenPath rather than encouraging the sell-side-curation pattern (à la Index Marketplaces / PubMatic Connect) that some intermediaries now use to inject ACR data on the sell side. This matters for the agnostic margin model: **TTD wants the curation value to accrue inside its own walls.**\n\n## TTD-5. Self-service vs managed-service control\n\n**This is The Trade Desk's single most intermediary-friendly structural fact, and it is strategically decisive.** TTD is **self-service only** — \"the world's leading independent, self-service media buying platform\" — and runs **no** managed-service arm that competes with its agency, trading-desk, and intermediary clients for the same advertiser budgets [12]. It supports buyers through a **Certified Service Partners** program (e.g., Goodway Group) rather than by inserting itself as a managed reseller [12]. For an agnostic intermediary, that means **TTD is a tool, not a rival**: it will not call your client and offer to run the campaign cheaper itself. That alignment is rarer than it sounds. Amazon DSP and the SSP-side activation tools increasingly do compete with the buyers they serve.\n\nThe friction sits inside the self-service experience. **Kokai**, TTD's AI-forward buying interface (its \"Programmatic Table,\" modeled on the periodic table, a Jeff Green design), has been pushed hard but landed unevenly:\n\n- Two years post-launch (mid-2025), roughly **two-thirds** of clients were on Kokai; management targeted **100% by end-2025**, then by **end-2026** [13][14].\n- By **Q1 2026, Kokai powered ~75% of platform spend** — short of the 100% management had projected, with full adoption still \"expected by the end of the year\" [2].\n- Buyer friction is well-documented: complaints center on the UI (\"a lot more clicks,\" \"strong learning curve,\" one town-hall attendee: \"it gives me PTSD from high school chemistry\"), with Assembly reportedly still using the older Solimar interface ~60% of the time [13]. InterMedia's David Nyurenberg: TTD \"continues to be an industry leader… But I can't stress enough how disruptive and anti-user the Kokai UI is\" [14].\n- TTD says Solimar is **not** being deprecated and frames Kokai adoption as agency choice; an August 2025 Reddit allegation of forced adoption was attributed to individual agencies/holdcos restricting new-campaign creation to Kokai, not a TTD mandate [14].\n\nFor the intermediary the read is straightforward. **The self-service-only model protects you from TTD-as-competitor. But the Kokai migration imposes real retraining cost and — because Kokai defaults to AI (Koa) optimization (TTD-8) — pushes the human trader's control of the auction down a notch.**\n\n## TTD-6. Data clean room & identity capability\n\nTTD's identity strategy is **UID2 (Unified ID 2.0) and EUID (European Unified ID)** — its open-source, deterministic, email/phone-derived identity framework, positioned as the durable post-cookie rail and increasingly the spine for CTV addressability [15]. Adoption is broad and continuing: LG Ad Solutions, Perion, Lotame, Spotify (EUID across Europe), and others have integrated, and TTD has built UID2 support into clean-room environments including Databricks' Data Clean Room [15]. A documented soft spot: a 2025 episode in which a CTV publisher's broken UID2 tokens went undetected for months — an operational-oversight risk for anyone relying on token integrity for measurement [15].\n\nTTD delivers clean-room capability largely through **partner integrations** (Snowflake, Databricks, LiveRamp) rather than a single proprietary clean room of the Amazon-AMC type. The practical upshot for an intermediary: TTD plays well with the clean-room and identity tooling you already use, and UID2 is a genuinely portable asset — UID2-keyed audiences move across platforms, which serves agnosticism. The risk is concentration. TTD *governs* UID2, so leaning on it ties part of your identity stack to one vendor's roadmap and operational discipline.\n\n## TTD-7. Reporting & log-level/raw data access\n\n**This is a clear strength for an intermediary that wants to verify rather than trust.** TTD offers **REDS (Raw Event Data Stream)** — log-level RTB event data (impressions, clicks, video events, conversions) delivered via near-real-time secure data sharing through the **Snowflake and Databricks marketplaces**, intended for customers who run their own analytics and want to merge TTD logs with other partners' data for measurement, audience, and enrichment [16]. There is also an Enterprise API suite and reporting/My-Reports APIs [16].\n\nLog-level data is the single highest-leverage transparency asset in programmatic: the ANA's 2025 benchmark work estimated that using impression-level log data for closed-loop optimization could close the efficiency gap by **~$21.6B (≈20.8%)** across the global programmatic market [17]. For an intermediary, REDS is exactly what lets you verify what cleared versus what you billed, optimize independently of Koa's black box, and defend your performance claims with event-level evidence. **The catch:** REDS is a feed you must license, ingest, and operate (a data-engineering cost), and access/cost terms are not publicly transparent. It is not free reporting; it is infrastructure. Still, its existence makes TTD far more auditable than a platform that exposes only aggregated dashboards.\n\n## TTD-8. Margin-capture friendliness for an intermediary\n\nPulling the threads together, **The Trade Desk is the most powerful and least margin-friendly seat in the independent DSP market — a paradox the intermediary must manage rather than resolve.**\n\nFriendly:\n- **Self-service only; not a managed-service competitor** (TTD-5) — the structural foundation of the agnostic model.\n- **Log-level data (REDS)** (TTD-7) — lets you audit the spread and optimize independently.\n- **Scale and performance** (TTD-1) — Kokai's claimed 24% lower cost-per-conversion / 20% lower CPA [13] mean the best raw CTV outcomes are often here, which protects the *advertiser-facing* value of your IO.\n- **Fee opacity** (TTD-2) — perversely, the absence of a clean line-item take rate gives a reseller room to embed its own spread.\n\nHostile:\n- **Deep, opaque fee stack** (~20% headline, ~29%+ effective) (TTD-2) — every dollar TTD takes is a dollar your spread competes against, and you cannot cleanly explain it to a client.\n- **OpenPath removes post-auction give-backs** (TTD-2) — directly attacks a classic margin-recovery lever.\n- **Deal Desk's shared Deal Quality Scores** (TTD-4) — reduce the buyer/seller information asymmetry your curation markup relies on.\n- **Koa/Kokai default AI optimization** (TTD-8) — Kokai's Q2 2026 update keeps Koa enabled by default across campaign dimensions unless manually overridden, with three optimization modes (performance/delivery, efficiency, allocate-by-priority) [4]. A black-box optimizer that you cannot fully inspect both improves outcomes and *takes control of where spend clears*, which is the variable an intermediary's spread is built on. The Digiday \"buyers still not fully sold\" critique [13] is precisely about trusting an optimizer you can't see.\n- **Disintermediation drift** — Ventura (below) and OpenPath both push TTD toward owning more of the supply chain itself.\n\n**Ventura — the going-concern and strategic flag.** On **February 24, 2026**, TTD launched the **Ventura Ecosystem**, an industry collaboration to unite TV operating systems and streaming platforms around a \"more transparent, revenue-optimized\" CTV marketplace; **V (formerly VIDAA, ~50M+ devices, Hisense/Toshiba OEMs)** and **Nexxen** were the first collaborators [18][19]. Ventura is TTD's CTV operating-system play, bundling OpenPath, UID2/EUID, the OpenAds auction wrapper, and OpenPass SSO into an OS-level offer; SVP Matthew Henick framed the pitch as countering TV OSes \"owned by companies focused on their own agendas\" [18]. **OpenAds** itself (announced Oct 2, 2025) is a forked-Prebid auction wrapper that restores cross-exchange transaction-ID visibility after Prebid.org removed it (Aug 27, 2025), aimed at exposing duplicate bid requests [20]. For the intermediary, Ventura is the clearest signal yet that TTD intends to own the CTV stack end-to-end: better transparency in theory, more TTD-controlled chokepoints in practice. It went live in February 2026.\n\n---\n\n# PART TWO — YAHOO DSP\n\nYahoo DSP is the smaller, scrappier independent generalist — repositioned since 2024 around **identity scale (ConnectID), speed, transparency, and choice**, and explicitly set against The Trade Desk's black-box-AI direction. For an intermediary, it is the more *philosophically* aligned partner: it sells transparency and control as features, runs explicit \"no hidden fees\" messaging, and was the first DSP to adopt IAB Data Transparency Labels. The countervailing risk is institutional. Yahoo DSP is an Apollo-owned asset that fielded exploratory sale interest in late 2025, which makes its long-run continuity less certain than TTD's.\n\n## Y-1. CTV supply access & scale\n\nYahoo DSP positions CTV as a **core capability** and pitches **\"100% non-walled-garden CTV inventory\"** — premium streaming reach beyond closed ecosystems, with identity-based cross-device frequency management and outcome optimization [21]. Its differentiated supply asset is **Backstage**, the direct-to-publisher path (Y-4), which now reaches premium CTV publishers including **Paramount, Disney (Hulu, Disney+), Roku, Samsung, LG, Fox, DAZN, and Warner Bros.** across 150+ domains globally [22]. A January 2025 three-pronged Roku tie-up **connected the Roku Exchange directly to Yahoo Backstage and enabled Yahoo ConnectID through Roku Data Cloud** [22][23].\n\nYahoo does not disclose CTV gross-spend figures at TTD's granularity, and as a standalone DSP it is materially smaller than TTD. The practical read for an intermediary: **Yahoo's CTV supply is premium and broad but narrower than TTD's open-market depth** — strong where Backstage has direct deals (top publishers, Roku), thinner in the long tail. Backstage's deliberate \"top ~10% of publishers\" design (Y-4) concentrates scale in quality rather than breadth.\n\n## Y-2. Fee/take-rate structure & transparency\n\n**Yahoo DSP is, on the public record, the more fee-transparent of the two — by positioning and by a concrete first-mover act.** Yahoo markets **\"no hidden fees — everything is displayed on the DSP,\" no extra fees for Audience Insights, and no ad-serving fees** [24]. On **Backstage**, Yahoo says its take rate \"varies but remains *a fraction* of both traditional SSP and non-Backstage DSP rates,\" positioning Backstage as lean infrastructure without exchange functionality [25]. Crucially, **Yahoo was the first DSP to adopt the IAB Tech Lab's standardized Data Transparency Labels** (announced **January 28, 2025**; accessible in-platform \"early 2025\"), the \"nutrition labels\" that disclose how an audience segment was built, what signals determined membership, data freshness/refresh, lookback windows, and IAB audit status [26][27]. IAB Tech Lab CEO Anthony Katsur called a major DSP enabling this \"a huge step forward\" [27].\n\nThe honest caveats:\n- Yahoo's specific take-rate *number* is **not publicly disclosed** (Apollo-owned, private). \"A fraction of SSP/rival-DSP rates\" is a positioning claim, not an audited figure — treat as position-evidence.\n- \"No hidden fees\" is marketing language; it speaks to fee *visibility*, not to fee *level*.\n\nFor an intermediary, this cuts two ways. The transparency posture is genuinely useful — Data Transparency Labels let you verify and explain *data* costs to a client, and the \"no hidden fees\" framing reduces the audit burden. But the same transparency that helps you defend your pricing also **shrinks the shadows a reseller can hide a spread in**: a maximally transparent DSP is, all else equal, a harder place to embed an unexplained markup than a fee-opaque one. So Yahoo's transparency is a feature for the *client* relationship and a mild constraint on the *spread*.\n\n## Y-3. Custom/3rd-party audience onboarding & ACR-data (Samba) activation\n\nYahoo DSP onboards custom and third-party audiences and interoperates with **40+ CDPs and DMPs**; **90% of Yahoo DSP spend runs on ConnectID-enabled supply**, so onboarded audiences resolve against a deterministic identity spine rather than cookies [28]. On ACR specifically, **Yahoo expanded its CTV measurement suite to include Samba TV (alongside Comscore and iSpot)** [29], and Samba's identity graph \"powers accurate measurement solutions for Yahoo DSP clients in the U.S., Australia, and U.K.\" including deduplicated cross-screen reach/frequency and conversion reporting [10]. As with TTD, **Samba's Project Gravity (May 2026)** makes ACR-linked audiences portable into Yahoo DSP among 40+ platforms [10].\n\nThe intermediary read: Yahoo's onboarding is solid, and its identity-first architecture lets ACR-linked and first-party audiences activate against ConnectID rather than fragile cookie matches — generally better match persistence on CTV. The same Project Gravity caveat applies: ACR activation increasingly routes through Samba's own layer, portable across DSPs but compressing the data-marketplace fee. So do the same ACR structural limits — household-level, opt-in, streamer-blocked [11].\n\n## Y-4. Deal/PMP & curation capability\n\n**Curation is the center of Yahoo DSP's pitch.** At CES 2025 Yahoo placed curation at the heart of its strategy, unveiling supply-intelligence partnerships with **Jounce Media (supply-path optimization), Peer39 (contextual), and Scope3 (carbon/sustainability + media quality)** [30][31]. These let buyers curate and segment supply by SPO quality, contextual relevance, and sustainability directly in-platform. Layered on the **Data Transparency Labels** (Y-2), Yahoo's curation stack is unusually inspectable.\n\n**Backstage** is at once Yahoo's curation/SPO engine and its direct-supply engine. Launched June 2023, it is a header-bidding-based direct path — built on Yahoo's legacy deal-ID functionality and the Prebid adapter from its shuttered SSP — that **cuts out SSPs for the top ~10% of publishers, roughly 100 display + 40 CTV publishers** [25]. Yahoo's Adam Roodman framed the selectivity bluntly: \"If there's a pub that's spamming us with an insane amount of inventory and we aren't buying a lot, that's not sustainable\" [25]. Yahoo keeps server-to-server SSP integrations (FreeWheel, IAS Publica, Magnite SpringServe) for broader CTV access, so SSPs aren't fully eliminated [25].\n\nFor an intermediary, Yahoo's curation suite is **genuinely useful and more open than TTD's DSP-native approach** — you can inject third-party curation/SPO logic (Jounce/Peer39/Scope3) and verify it. Backstage's direct path is the analog to OpenPath, with the same double edge: cheaper, cleaner supply (good for advertiser value) but a more transparent path that compresses where a reseller hides margin.\n\n## Y-5. Self-service vs managed-service control\n\nYahoo DSP supports **both self-service and managed-service**, with **choice as an explicit design philosophy** — most visibly in Blueprint (Y-8), which the trader turns on or off rather than having forced on by default [24][32]. Managed service is available, partly via partners such as Programmatic Mechanics (campaign strategy, ad ops, optimization, custom dashboards) [33], and a hybrid model (brand licenses the seat, third party runs operations) is common. In 2026 Yahoo also **moved down-market** with a DSP performance push aimed at mid-market advertisers [34].\n\nThe strategic nuance for an intermediary: Yahoo's flexibility (self-serve *and* managed) is convenient, but it means **Yahoo itself can offer managed service**. Unlike TTD, Yahoo *can* in principle compete with a reseller for the same managed-CTV budget. In practice Yahoo leans on partners and positions managed service as a service to buyers, not a wedge against them, and its mid-market push targets advertisers an enterprise intermediary may not. But the structural fact stands: **TTD's self-service-only design is a cleaner alignment guarantee than Yahoo's hybrid model.**\n\n## Y-6. Data clean room & identity capability\n\n**Identity is Yahoo DSP's flagship strength.** **Yahoo ConnectID reaches 213M logged-in users in the US and 345M globally (Q1 2026)**, built on deterministic, consented data from Yahoo properties and trusted partners; it is \"always activated\" in the DSP and powers targeting, frequency, and measurement across display, native, video, and CTV [28]. ConnectID expanded across CTV through 2025 — by **November 21, 2025** it was adopted across AMC Networks, DIRECTV Advertising, Telly, and LG Ads (joining Paramount, Tubi, NBCUniversal, FreeWheel), which Yahoo says scales it \"across the majority of programmatic CTV supply\" [23]. NBCUniversal reported a **4x conversion-rate lift and 71% lower CPA** for Peacock advertisers using ConnectID over one year [23].\n\nClean-room capability is delivered through interoperability with the major providers (LiveRamp and others) rather than a single proprietary walled clean room; the 2024–26 consolidation of independent clean rooms (LiveRamp acquired Habu; InfoSum absorbed into WPP; Publicis acquiring LiveRamp) is reshaping the landscape Yahoo plugs into [35]. Yahoo also rolled out **agentic AI capabilities across the DSP (live January 2026)** for activation, troubleshooting, and audience discovery, with more shipping through 2026 [36].\n\nFor an intermediary, ConnectID is a real asset: a large, deterministic, CTV-scaled identity spine that activates licensed ACR and first-party data with strong CTV persistence and household/user-level frequency control. The dependency caveat mirrors TTD's UID2. ConnectID is *Yahoo's* graph, so leaning on it ties identity to Yahoo's roadmap — and, given the ownership question (Y-8), to Yahoo's survival.\n\n## Y-7. Reporting & log-level/raw data access\n\nYahoo DSP's transparency story is strongest on **methodology and data disclosure** — Data Transparency Labels, in-platform fee visibility, IFO outcome measurement [26][37]. On **raw log-level data**, the public record runs thinner than TTD's REDS. Yahoo offers conversion/attribution programs and integrations (e.g., a Yahoo Conversions API documented via LiveRamp), \"everything displayed on the DSP\" reporting, and near-real-time **In-Flight Outcomes (IFO)** including SKU-level tracking [37]. Yahoo *does* expose a documented event-level feed — the **Yahoo Measurement Feed** (user-keyed impression/click/conversion events, delivered daily to S3/Azure in ORC/Parquet/Avro/JSON, ~2-day delay) — but it is **gated to Partner Match participants** and certain supply sources cannot be passed at the event level. So the honest framing is *partner-gated and supply-restricted, not absent*: TTD's REDS is more openly documented and less conditional, but Yahoo does offer event-level data. For impression-level cleared-vs-billed reconciliation, TTD remains the cleaner path and Yahoo a gated alternative.\n\n## Y-8. Margin-capture friendliness for an intermediary\n\nYahoo DSP is the **more intermediary-aligned of the two in posture, but the more fragile in institution.**\n\nFriendly:\n- **Transparency-as-feature** (Y-2) — \"no hidden fees,\" IAB Data Transparency Labels, inspectable curation. Easy to explain to clients; reduces audit burden.\n- **\"Speed not AI\" / Blueprint-by-choice** (Y-8) — the human trader keeps control of the auction. At CES 2025 GM Adam Roodman: \"The words aren't AI; the words are speed, speed, speed, speed\" [32]. **Blueprint** (launched June 2024) is a 10x-faster, 90%-more-signals optimizer that is **optional, not default**, with savings positioned as returned to the customer [32][38]. For an intermediary that distrusts black-box optimization, \"you choose whether the optimizer runs\" is materially friendlier than Koa-on-by-default.\n- **ConnectID identity scale** (Y-6) — best-in-class deterministic CTV identity to power your ACR/first-party activation.\n- **Open curation stack** (Y-4) — inject third-party SPO/contextual/sustainability logic and verify it.\n\nHostile / risky:\n- **Transparency compresses the spread** (Y-2) — maximal fee/data transparency leaves fewer shadows for an unexplained markup.\n- **Yahoo can offer managed service** (Y-5) — weaker alignment guarantee than TTD's self-service-only model.\n- **Weaker raw-log posture** (Y-7) — harder to reconcile cleared-vs-billed at event level.\n- **Smaller open-market scale** (Y-1) — premium-but-narrower CTV supply than TTD.\n- **Ownership/continuity risk — the central going-concern flag.** Yahoo DSP is owned by **Apollo Global Management** (which bought Yahoo from Verizon in 2021 for ~$5B), and Apollo has been *unwinding* Yahoo's ad-tech footprint — it **shuttered Yahoo's SSP in 2023** and sold off assets like TechCrunch [25][39]. By **November 2025**, Yahoo had held **exploratory talks with investment banks and fielded inbound interest** in the DSP, with speculated buyers ranging from retail-media players (Kroger, Walmart) to other challengers [39]. The DSP is described as a well-regarded, independent, feature-rich asset. But for an intermediary making *multi-year supply commitments* and embedding ConnectID into its identity stack, **a possible change of owner is a structural risk TTD does not carry.** As of November 2025 this was exploratory/inbound interest, not a formal sale process; the status could shift.\n\n---\n\n# PART THREE — HEAD-TO-HEAD & VERDICT\n\n## Dimension-by-dimension comparison\n\n| Dimension | The Trade Desk | Yahoo DSP | Edge for an agnostic margin-capturing intermediary |\n|---|---|---|---|\n| **1. CTV supply access & scale** | Largest independent open-market CTV pool; $13.4B gross spend 2025; CTV = largest channel; OpenPath + Ventura | Premium but narrower; Backstage top ~10% publishers (~40 CTV pubs); Roku Exchange; \"100% non-walled-garden\" | **TTD** for depth; Yahoo for premium-direct quality |\n| **2. Fee/take-rate transparency** | No disclosed take rate; ~20% inferred, ~29%+ effective; OpenPath opacity; OpenSincera = supply (not fee) transparency | \"No hidden fees\"; first DSP with IAB Data Transparency Labels; Backstage \"a fraction\" of SSP/DSP rates (undisclosed number) | **Yahoo** on transparency; **TTD** on spread-hiding room (perverse) |\n| **3. ACR (Samba) onboarding & activation** | Long-standing Samba integration (2019–20, recency-gapped); 40+ CDPs via UID2; Project Gravity portable | Samba in CTV measurement suite; ~90% spend ConnectID-enabled; 40+ CDPs/DMPs; Project Gravity portable | **Yahoo** slightly — identity-first activation; both increasingly routed via Samba's own layer |\n| **4. Deal/PMP & curation** | Deal Desk (in-platform PMP, shared Deal Quality Scores); DSP-native curation | Jounce/Peer39/Scope3 open curation suite; Backstage SPO; Data Transparency Labels | **Yahoo** for open, inspectable curation; TTD's shared scores reduce asymmetry |\n| **5. Self-service vs managed control** | **Self-service ONLY — does not compete as managed service**; Certified Service Partners | Self-service + managed (can compete); \"choice\" philosophy; mid-market push | **TTD** — cleanest alignment guarantee |\n| **6. Clean room & identity** | UID2/EUID (open, deterministic, broadly adopted); partner clean rooms | ConnectID 213M US/345M global, always-on, CTV-scaled; partner clean rooms; agentic AI live Jan 2026 | **Yahoo** on raw identity scale/CTV persistence; TTD on portability/openness |\n| **7. Reporting & log-level data** | **REDS raw event-level feed** via Snowflake/Databricks; Enterprise APIs | Strong methodology/fee transparency, IFO; **Yahoo Measurement Feed** (event-level, but Partner-Match-gated) | **TTD** — openly documented REDS edges it, but the gap is narrower than first stated |\n| **8. Margin-capture friendliness** | High performance + log-level + non-competing, but deep opaque fees, give-back removal, AI-default, disintermediation drift | Transparent + choice-based AI + identity, but spread-compressing, can compete, weaker logs, **ownership risk** | Split — see verdict |\n\n## Positives vs. negatives, distilled\n\n**The Trade Desk — positives:** unmatched independent CTV scale and performance; self-service-only (never your managed-service competitor); REDS log-level data for independent auditing/optimization; UID2/EUID portable identity; OpenSincera supply transparency; Deal Desk operational maturity.\n**The Trade Desk — negatives:** deepest and most opaque fee stack (~20% headline / ~29%+ effective); OpenPath removes post-auction give-backs; Deal Desk's shared scores erode buyer/seller asymmetry; Koa/Kokai AI on-by-default abstracts the auction; Kokai migration friction (only 75% of spend by Q1 2026 despite the push); Ventura/OpenPath = creeping end-to-end control and disintermediation drift.\n\n**Yahoo DSP — positives:** genuine fee/data transparency (no-hidden-fees, first IAB Data Transparency Labels); \"speed not AI\" with optional Blueprint (human keeps auction control); ConnectID identity scale (213M/345M) with deep CTV penetration; open, inspectable curation (Jounce/Peer39/Scope3); Backstage premium direct CTV (Roku Exchange); flexible self-serve + managed.\n**Yahoo DSP — negatives:** smaller open-market CTV scale than TTD; transparency compresses spread-hiding room; can itself offer managed service (weaker alignment than TTD); an event-level feed that is partner-gated and supply-restricted (vs TTD's openly documented REDS); **Apollo ownership + exploratory 2025 sale interest = continuity risk** for a multi-year partner.\n\n## Reasoned verdict: which better serves a DSP/SSP-agnostic margin-capture model?\n\nThere is no single winner. The two platforms serve **different jobs** in an agnostic intermediary's portfolio. The right answer is to run both, deliberately.\n\n**The Trade Desk is the unavoidable performance-and-scale workhorse.** No serious open-market CTV operation can route around it, its best-in-class outcomes protect the *advertiser-facing value* of your IO/CPM, its self-service-only design guarantees it will not poach your managed-service relationship, and — decisively — **REDS gives you event-level data to audit the spread and optimize independently of Koa.** The price of admission is fee opacity and disintermediation drift (OpenPath give-back removal, Deal Desk symmetry, Ventura). So the discipline with TTD is fixed: **use it for scale and performance, license REDS and verify everything, override Koa where your own optimization beats it, and price your spread as managed-service-and-data value rather than as an arbitrage you cannot explain.** The arbitrage room is shrinking. The fee stack is too deep to hide inside indefinitely.\n\n**Yahoo DSP is the transparency-and-flexibility hedge — and the better *philosophical* fit, with an asterisk.** Its \"you choose whether the optimizer runs\" stance, its IAB Data Transparency Labels, its open curation suite, and its ConnectID identity scale all align with an intermediary that wants control, verifiability, and a portable identity spine for ACR/first-party activation. The asterisks: scale narrower than TTD, the fact that Yahoo *can* compete as managed service, the weaker raw-log posture, and above all the **ownership/continuity risk** — building deep supply commitments and identity dependencies on an Apollo asset that may change hands is a real strategic exposure.\n\n**Net:** For the **agnostic margin-capture model specifically**, *neither independent DSP is structurally generous.* Both are tightening the screws resellers historically relied on — give-backs, asymmetry, opacity — and the durable margin is migrating from arbitrage toward demonstrable *managed-service-plus-data* value. Within that reality, **TTD wins on the two dimensions that most protect an intermediary's defensibility — non-competition (self-service-only) and event-level auditability (REDS) — which is why it should anchor the stack despite its hostile fee economics.** **Yahoo earns its place as the transparency hedge and identity-scale alternative, but its continuity risk argues against making it the single point of dependence.** Keep spend free to move across both, plus the SSPs and walled gardens taken up elsewhere in these pages. Against two platforms each drifting toward owning more of the chain, **optionality is the intermediary's last durable margin lever.**\n\n---\n\n## Open Questions\n\n1. **What is Yahoo DSP's actual take rate?** \"A fraction of SSP/DSP rates\" and \"no hidden fees\" are positioning, not audited numbers. Apollo ownership keeps the real figure private. An intermediary cannot fully model its Yahoo spread without it.\n2. **Is the TTD–Samba ACR integration still current and at what scope?** The most recent dedicated TTD–Samba milestone confirmed here is 2019–2020. Has it been renewed/expanded in 2024–26, or is ACR activation on TTD now effectively mediated by Samba's Project Gravity layer?\n3. **How open is Yahoo's event-level feed in practice?** The Yahoo Measurement Feed exists (event-level, Partner-Match-gated, supply-restricted); the live question is how conditional its access and coverage are versus TTD's openly documented REDS.\n4. **Will Yahoo DSP change hands, and what would a new owner (retail-media or otherwise) do to its independence and intermediary-friendliness?** Exploratory talks were inbound as of Nov 2025; the outcome materially affects any multi-year reliance.\n5. **How much of Kokai's claimed performance lift (24% lower CPC, 20% lower CPA) survives independent, log-level scrutiny?** These are TTD figures; REDS makes them checkable. The Digiday \"buyers still not fully sold\" critique suggests the gap between claim and trader experience is real.\n6. **How fast does OpenPath/OpenAds (TTD) and Backstage (Yahoo) cannibalize the SSP layer an intermediary uses for ACR sell-side activation and margin-recovery give-backs?** This is the convergence dynamic that most directly threatens the spread.\n7. **What exact take/premium does OpenPath apply?** Buyers estimated a 10–15% premium vs. direct; TTD has not confirmed a number.\n8. **How does Project Gravity's economics work** — does Samba's onboarding layer charge in a way that compresses both the DSP's data-marketplace fee and a reseller's data markup, and across which platforms is it actually live versus announced?\n\n---\n\n## Sources\n\n1. The Trade Desk, \"The Trade Desk Reports Fourth Quarter and Fiscal Year 2025 Financial Results,\" investor release, Feb 25, 2026. https://investors.thetradedesk.com/news-and-events/news/news-details/2026/The-Trade-Desk-Reports-Fourth-Quarter-and-Fiscal-Year-2025-Financial-Results/default.aspx — and PPC Land summary, \"Trade Desk posts $2.9B in 2025 revenue but growth slows to 18%,\" 2026. *(Tier 1 primary; Tier 5 trade summary.)* Accessed 2026-06-17.\n2. \"The Trade Desk Stock Fell After Q1 2026 Earnings…,\" TIKR, May 2026; Seeking Alpha, \"The Trade Desk outlines
