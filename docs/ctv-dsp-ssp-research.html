ds Will Actually Work\" and related; plus AdExchanger FreeWheel tag. Universal Ads built using FreeWheel; many partners are FreeWheel clients; \"transact directly, without hidden and layered fees\"; \"eliminates intermediaries.\" https://www.admonsters.com/why-comcasts-universal-ads-will-actually-work/ — Tier 5 (analytical trade). Used for the disintermediation framing and FreeWheel-client overlap.\n10. Augeo / Brand Networks, \"Brand Networks Expands Aimy with AI-Powered TV Advertising, Built on Comcast's Universal Ads API,\" 2025-11-05. https://www.augeomarketing.com/resources/news/november-5-2025 — Tier 1 (partner announcement). Universal Ads Reporting + Creative APIs; third-party developers build on the platform; Borow quote; SMB focus.\n11. Spaceback (Casey Saran), \"Why Comcast's Universal Ads Will Actually Work,\" 2025-02-26. https://www.spaceback.com/post/why-comcasts-universal-ads-will-actually-work — Tier 6 (vendor-CEO opinion; position-evidence only). Direct-transaction / disintermediation thesis; \"added costs, complexity and opaqueness\" of programmatic; FreeWheel+Beeswax foundation. Used as evidence of how the disintermediation argument is made, not as fact.\n12. VideoWeek, \"Comcast's 'Universal Ads' Takes a Novel Approach to Reaching Small Advertisers,\" 2025-03-12. https://videoweek.com/2025/03/12/comcasts-universal-ads-takes-novel-approach-to-reaching-small-advertisers/ — Tier 5 (specialist trade). SME target; James Grant GM quote; $500 Ramp credit; competitors MNTN/Vibe; does NOT disclose fee structure (basis for the no-published-take-rate finding).\n13. Adweek, \"Koddi and Comcast's Universal Ads Ink Deal to Target Streaming Ads With Commerce Data,\" 2025 (exact date not captured; 403 on direct fetch — title/summary via search index). https://www.adweek.com/commerce/koddi-and-comcasts-universal-ads-ink-deal-to-target-streaming-ads-with-commerce-data/ — Tier 4/5 (trade). Commerce-data targeting partnership; cited as directional evidence of the platform's targeting roadmap. (Flagged: fetched only via search summary, not full text.)"}, {"order": 10, "file": "09_Gap_Roku_BuySide_Platform.md", "title": "Roku as a Buy-Side and Data Platform — The Disintermediator Bought Through and Competed Against", "summary": "", "body": "# Roku as a Buy-Side and Data Platform\n\n## Bottom Line\n\nIt is tempting to treat Roku as inventory. That is the blind spot. By 2025–2026 Roku is a vertically integrated buy-side + data + supply stack — the exact disintermediation pattern most analyses track obsessively for Amazon and Comcast, but rarely for Roku. Roku runs **Roku Ads Manager** (a self-serve CTV buying tool launched September 18, 2024, $500 minimum, now fed by the **Roku Ads API** launched November 4, 2025) and the **Roku Data Cloud** clean-room/identity suite (launched January 6, 2025, the rebranded successor to Roku's clean room). And since late 2023/early 2024 it has been **sunsetting OneView** — the dataxu DSP it bought for $150M in 2019 and relaunched as OneView in 2020 — redirecting resources to Ads Manager for SMB/mid-market while pushing enterprise buyers onto third-party DSPs (The Trade Desk, Yahoo, DV360, Amazon).\n\nThe single most important correction for the central forecast lever: **the Amazon–Roku exclusive (announced June 16, 2025) is exclusive only at the level of Roku's OS-level authenticated identity signals — not all Roku inventory.** Roku has stated plainly that it \"remains interoperable with most major DSPs,\" that its inventory is \"still available via rival DSPs\" and direct sales, and that unique formats (Marquee, Action Ads) stay exclusive to Roku. The common reading — that \"the authenticated Roku footprint cannot be reached except through ADSP\" — is defensible but slightly over-broad: the lock-in is real, but narrower than that implies. So the intermediary faces Roku in three roles at once — supply partner, data partner, and a direct self-serve competitor selling the same ACR-data-plus-clean-room-plus-CTV-buying bundle the intermediary monetizes.\n\n---\n\n## Why This Matters to the Thesis\n\nThe thesis here is about a platform-agnostic managed-service intermediary that (1) activates licensed ACR data, (2) captures spread between IO/CPM and clearing price, (3) honors supply commitments, and (4) stays free to move spend across any DSP/SSP. Amazon and Comcast/FreeWheel are the usual examples of vertically integrated stacks that threaten that model by combining supply + data + a DSP under one roof. Roku is the same shape of threat — and it is rarely named as one:\n\n- Roku owns supply (The Roku Channel, the Roku OS home screen, ~90M+ streaming households).\n- Roku owns ACR + identity data (Roku Data Cloud, opt-in OS signals, the Roku ID).\n- Roku owns a self-serve buying tool (Roku Ads Manager) plus an API — i.e., it sells the *intermediary's own service* directly to SMBs and performance marketers, at a $500 floor.\n\nThat is the disintermediation pattern usually tracked for Amazon's retail-media gravity and Comcast's owner-publisher-DSP conflict. For Roku, it tends to go unnoticed. These pages close that competitive omission and resolve the question of OneView's viability.\n\n---\n\n## The Roku Platform, Point by Point\n\n### Roku runs a self-serve buy-side platform (Roku Ads Manager), launched Sept 18, 2024, now API-fed (Nov 4, 2025)\n\nRoku operates **Roku Ads Manager**, a self-service platform for buying, managing, and optimizing CTV campaigns across Roku's own inventory and third-party streaming inventory, launched **September 18, 2024**, with a **$500 minimum spend** aimed at SMBs and performance/growth marketers. On **November 4, 2025**, Roku launched the **Roku Ads API** — described as \"a fully open, self-serve developer platform for connected TV advertising\" that \"feeds directly into the company's self-serve Ads Manager,\" with reporting, audience-targeting, and conversion endpoints at launch and campaign-management/creative endpoints to follow [1][2][3].\n\nAdExchanger dated the Ads Manager launch to Sept 18, 2024 and described buying across Roku's ecosystem — Netflix, Prime Video, Max, Peacock — plus Roku's Action Ads (QR-code overlays) [1]. It separately dated the Ads API to \"Tuesday, November 4, 2025,\" quoting that it \"feeds directly into the company's self-serve Ads Manager,\" with \"only reporting, audience targeting and conversion capabilities … available at launch\" [2]. Roku's own newsroom (Nov 2025) and trade coverage corroborate the open, no-manual-approval developer model [3].\n\n---\n\n### OneView (the dataxu DSP) is being sunset; resources moved to Roku Ads Manager + third-party DSPs\n\nRoku acquired the video DSP **dataxu for ~$150M in late 2019** and relaunched it as **OneView in 2020**, marrying Roku's first-party data to the bought DSP. Beginning **late 2023 / early 2024**, Roku began **sunsetting OneView**: buy-side sources told Digiday (Feb 22, 2024) that Roku was \"moving resources over to Roku Ads Manager\" and \"not doing updates or new product work to OneView,\" and a separate Digiday report (Apr 30, 2024) noted Roku \"hinted it would gradually sunset OneView over the course of 2024.\" The strategic shape: **Ads Manager for SMB/mid-market; third-party DSPs (The Trade Desk, Yahoo, DV360, Amazon) for enterprise** demand, rather than Roku operating its own enterprise DSP [4][5][6]. As a corroborating signal, Roku's standalone OneView solutions page (advertising.roku.com/solutions/advertise/oneview) now returns HTTP 404.\n\nDigiday (Feb 2024) quoted a buyer: \"We were told they're moving resources over to Roku Ads Manager, and they're not doing updates or new product work to OneView … it's going to be mostly accessible to SMEs who want … Roku inventory but can't get it through a larger DSP\" [5]. Digiday (Apr 2024) reported the gradual-sunset framing and CEO Anthony Wood's stated strategy of \"expanding and deepening our relationships with third-party platforms\" as programmatic share grew [4].\n\nOne caveat. Residual OneView branding still appears on some regional Roku pages and third-party listing/review sites (G2, LiveRamp partner directory) as of mid-2026 — but review-site listings lag reality and do not prove the product is actively sold. There is no dated Roku press release announcing a hard OneView end-of-life; the sunset is reported through buy-side sourcing and the absence of new product work, not a formal obituary. \"OneView is effectively deprecated as Roku's go-forward enterprise DSP\" is well-established; any specific shut-off date is unconfirmed.\n\n---\n\n### The Amazon–Roku exclusive is exclusive at the identity/OS-signal layer, not over all Roku inventory\n\nThe June 16, 2025 Amazon–Roku partnership makes **Amazon DSP the exclusive programmatic means of accessing Roku's CTV inventory *via the shared, OS-level authenticated identifier*** — the first time Roku has shared these ID signals at the operating-system level. It is **not** an exclusive over all Roku inventory. Roku has stated it \"remains interoperable with most major DSPs including The Trade Desk, Google DV360, Yahoo, Amazon, and others,\" that \"Roku inventory is still available via rival DSPs\" and via direct sales, and that \"Roku offers unique inventory, targeting, and measurement that is not available solely through Amazon Ads,\" including Marquee ads and Action Ads that remain \"exclusive to Roku\" [7][8][9].\n\nAdMonsters (post-deal analysis) isolated the exclusive element as \"the identity resolution service\" / \"Roku's audience signals directly via the Roku device's operating system … the first time Roku has shared these ID signals at an OS level,\" and quoted Roku that not all inventory is exclusive [7]. Digiday (June 16, 2025) framed the exclusivity as \"the exclusive means of accessing Roku's CTV advertising inventory *via a shared identifier*,\" and stated flatly that \"Roku inventory is still available via rival DSPs, and the streaming giant's ad inventory can also be purchased via direct sales\" [8]. Roku Media president Charlie Collier's framing — \"open and interoperable solutions\" — fits a deliberately scoped exclusive, not a total one [8][9].\n\nWhy it matters: a common reading holds that the authenticated Roku+Fire footprint cannot be honored under a \"move spend anywhere\" doctrine because there is no second door, and that the picture turns on whether \"the Roku–Amazon exclusivity holds and is not opened to rival DSPs.\" Both hold *for the deterministic cross-device identity* — but go over-broad if read as \"Roku inventory is reachable only through ADSP.\" Here is the accurate statement: an intermediary can still buy Roku O&O and Roku Channel inventory through TTD, DV360, Yahoo, or Roku Ads Manager directly. What it cannot get anywhere but ADSP is the Amazon-exclusive deterministic Roku-OS-plus-Fire-TV identity graph. The lock-in is on *deterministic authenticated reach/measurement*, not on *Roku inventory access*.\n\n---\n\n### Roku Data Cloud is a live clean-room/identity offering Roku sells directly (launched Jan 6, 2025)\n\nRoku launched the **Roku Data Cloud** collaboration suite on **January 6, 2025**, the rebranded evolution of Roku's earlier clean room. It exposes Roku's OS-level signals — ACR, IP, opt-in first-party sign-up/purchase data, and identity — inside a privacy-safe clean room where partners match their own data against Roku's without raw PII leaving. Launch partners included **Omnicom Media Group** (Omni) and **PMG** (Alli), and Roku extended its Yahoo partnership to enable **Yahoo ConnectID through Roku Data Cloud** [10][11][12].\n\nAdExchanger (\"Roku's Clean Room Evolves Into Its New Form: The Roku Data Cloud\") and the CDP Institute both document the clean-room→Data Cloud rebrand; Advanced Television and Roku's own resource page date the collaboration-suite launch to Jan 6, 2025 and name Omnicom/PMG partners and the three-part Yahoo integration [10][11][12]. This squares with the Roku Exchange → Yahoo Backstage routing (ConnectID via Roku Data Cloud) and with the fact that Roku does not license its ACR data for portable export.\n\nFor the intermediary, Roku Data Cloud is a *look-don't-take* environment, in the same family as Amazon's AMC: the intermediary can match and measure against Roku signals but cannot port a Roku-derived segment out as a licensable audience — Roku ACR must be bought into, not licensed and ported. The sting is competitive: Roku sells this clean-room-plus-data bundle *directly to the same agencies and brands* the intermediary serves.\n\n---\n\n### Roku is a direct self-serve competitor to the agnostic intermediary, growing and now profitable\n\nRoku is both supply/data partner *and* direct competitor to a managed-service CTV intermediary: through Ads Manager + the Ads API + Roku Data Cloud it sells self-serve CTV buying, ACR-grade audience targeting, and clean-room data collaboration directly to advertisers — the same bundle the intermediary monetizes — and it is doing so from a position of growing financial strength. Roku reported **Q4 platform revenue of ~$1.22B (up 18% YoY)** and **full-year 2025 platform revenue of ~$4.145B (up 18%)**, \"driven by strength in video advertising,\" and described **Roku Ads Manager momentum** as \"largely incremental\" SMB/performance demand that \"further diversifies demand\" [13][14].\n\nRoku's FY2025 8-K exhibits and trade summaries report the $1.22B Q4 / $4.145B FY platform-revenue figures and 18% growth; Roku management framed Ads Manager as incremental SMB demand and credited deepened third-party DSP integrations (including the June Amazon DSP tie-up) [13][14]. The \"direct competitor\" characterization is a reading of product scope (self-serve buying + data + clean room sold to advertisers), not a claim Roku makes about the intermediary.\n\nFor the intermediary, Roku's competitive threat is asymmetric and bounded. It competes hardest for **SMB/performance** budgets (the $500-floor Ads Manager lane) and for **agency clean-room/data** relationships — but it has *exited* the enterprise-DSP business (the OneView sunset above), deliberately routing big programmatic demand to third-party DSPs. That is good news for an agnostic intermediary. Roku has chosen to be a *supply-and-data* counterparty for enterprise rather than a *demand* rival, leaving the cross-publisher buying-and-arbitrage layer to others. The intermediary competes with Roku for the small/self-serve buyer and the clean-room data deal, but partners with Roku for premium CTV supply routed through TTD/Yahoo/DV360/ADSP.\n\n---\n\n## The Eight-Dimension Read on Roku (as a platform, for the agnostic intermediary)\n\nHere is the same eight-dimension grid used elsewhere in this account, run on Roku-as-platform — the cut that usually goes unrun.\n\n1. **CTV supply access & scale.** Large and premium: The Roku Channel + the Roku OS home screen + ~90M+ streaming households; reachable through Roku Ads Manager directly *and* through TTD/DV360/Yahoo/ADSP. The *deterministic authenticated* slice is ADSP-exclusive; the rest is open (as set out above). For the intermediary, Roku is a must-have supply node with multiple doors — only one of which, the ID-enriched door, is locked.\n\n2. **Fee/take-rate structure & transparency.** Opaque, like every O&O seller. Ads Manager is a self-serve auction into Roku's own inventory, and Roku takes an undisclosed media margin: no published take-rate, no clearing-price disclosure. Worse for an intermediary than an independent DSP, and comparable to Amazon's O&O posture.\n\n3. **Custom/3rd-party audience onboarding & ACR-data activation.** Onboarding is via Roku Data Cloud clean room — match-in, don't-export. The intermediary can activate a Samba-style licensed segment *against* Roku, but a Roku-derived audience cannot be ported out. Hostile to the \"license ACR once, activate everywhere\" model.\n\n4. **Deal/PMP & curation capability.** Roku offers PMPs/direct deals and routes premium inventory through third-party DSPs (e.g., Roku Exchange → Yahoo Backstage; Roku in the FreeWheel Streaming Hub via Open-RTB). Curation is possible but the richest targeting (deterministic ID) is gated to ADSP.\n\n5. **Self-service vs managed-service control.** Roku Ads Manager is explicitly self-serve and SMB-tilted ($500 floor); enterprise is pushed to third-party DSPs. This is the dimension where Roku most directly competes with — and most directly cedes ground to — the managed-service intermediary, depending on advertiser size.\n\n6. **Data clean room & identity capability.** Strong but walled: Roku Data Cloud + the Roku ID + OS-level ACR. Powerful for measurement and matching; not portable. A \"look-don't-take\" room in the AMC family (as described above).\n\n7. **Reporting & log-level data access.** Self-serve reporting via Ads Manager and now the Ads API (reporting endpoint at launch). No evidence of true bid/log-level transparency on O&O auctions — the opposite of the FreeWheel Buyer Cloud model favored elsewhere in this account.\n\n8. **Margin-capture friendliness for an intermediary.** Low on O&O bought direct (opaque clearing price, walled data), but *neutral-to-good* on the supply path: because Roku routes enterprise demand through agnostic third-party DSPs, the intermediary can capture spread on Roku inventory *inside its preferred DSP* (TTD/DV360/Yahoo) rather than inside Roku's own tool. The trap is the deterministic-ID door (ADSP-only), which reproduces the Amazon lock-in for that specific reach asset.\n\n---\n\n## Positives vs. Negatives (Roku as a node on the intermediary's board)\n\n**Positives.** (a) Roku has *exited* the enterprise DSP business — OneView is sunset — so it is not a head-to-head buying-layer rival for large programmatic budgets; it deliberately feeds third-party DSPs, which preserves the intermediary's agnostic optionality over most Roku inventory. (b) Roku inventory is broadly DSP-interoperable (TTD, DV360, Yahoo, ADSP) and direct-sold, so there are multiple doors. (c) Roku Data Cloud is a usable measurement/matching surface.\n\n**Negatives.** (a) The deterministic, OS-level authenticated identity graph is ADSP-exclusive — a genuine lock-in for that reach/measurement asset (the kernel of truth in the lock-in scenario taken up in the outlook). (b) Roku Data Cloud is look-don't-take — no portable Roku ACR segment. (c) Roku Ads Manager + Ads API make Roku a *direct self-serve competitor* for SMB/performance budgets and for agency clean-room relationships — the disintermediation usually tracked for Amazon/Comcast but rarely flagged for Roku. (d) O&O take-rate and clearing prices are opaque.\n\n**Net.** For a DSP/SSP-agnostic margin-capture model, Roku is a **supply-and-data partner with one locked door, not a buying-layer rival** — a materially friendlier posture than Amazon, which keeps the whole stack closed. Roku is friendlier precisely *because* it abandoned its own DSP. The instinct to lump the \"authenticated Roku footprint\" entirely behind ADSP overstates the cage. Most of Roku is reachable agnostically; only the deterministic-ID overlay is captive.\n\n---\n\n## Does the Walled-Garden Reading Hold Up?\n\n**Mostly yes, with one scope correction that should be made explicit.**\n\n- The core factual spine in the walled-garden account (June 16, 2025 deal; ~80M HH / >80% of US CTV HH per ComScore; deterministic cross-device identity behind ADSP; Q4 2025 rollout) is **confirmed and well-sourced**.\n- Its *strategic gloss* — \"there is no second door\" for the authenticated Roku footprint — is **true only of the deterministic authenticated-identity layer**, not of Roku inventory generally. The language should be narrower: the lock-in is on **deterministic authenticated reach + cross-device measurement**, while Roku O&O / Roku Channel inventory remains buyable via TTD, DV360, Yahoo, and Roku Ads Manager (as set out above).\n- The lock-in scenario in the outlook is structurally sound — its \"exclusivity holds and is not opened to rival DSPs\" condition is the right hinge — but its weight should reflect that the exclusive is **narrowly scoped to identity signals**, which makes \"Amazon opens/sunsets the Roku exclusive\" a question about *the ID overlay*, not about *all Roku supply*. The probability on that scenario should arguably be slightly lower, because the open ecosystem retains agnostic access to most Roku inventory today.\n- A **fact often omitted entirely**: Roku has **sunset OneView** and become a self-serve-plus-third-party-DSP company. This belongs in the competitive map as Roku the bounded disintermediator — and it *strengthens* the agnostic intermediary's position rather than weakening it.\n\n---\n\n## Open Questions\n\n1. **Hard OneView end-of-life date.** No dated Roku release confirms a specific shut-off; the sunset is sourced from buy-side reporting and absence of product work. A primary confirmation (a Roku notice or filing) would close this.\n2. **Term and renewal of the Amazon–Roku identity exclusive.** Scope (\"OS-level ID signals\") is now clear; duration and any renewal/sunset terms are still undisclosed — the same open question raised elsewhere, now sharpened to *the identity layer specifically*.\n3. **Does Roku throttle the deterministic Roku ID inside third-party DSPs?** Roku is interoperable with TTD/DV360/Yahoo for inventory, but it is unclear whether the *deterministic* Roku ID (vs. probabilistic/contextual targeting) is reserved for ADSP — the exact question a 2024 Digiday source raised (\"will The Trade Desk access the Roku ID, or is that reserved for Roku DSP?\").\n4. **Roku Ads API maturity.** Campaign-management and creative endpoints were \"coming soon\" at the Nov 2025 launch; whether the API becomes rich enough for an intermediary to build managed-service automation on top of Roku O&O is unresolved.\n5. **Roku Ads Manager's competitive trajectory into mid-market.** If the $500-floor self-serve tool moves up-market, the direct-competition surface with the intermediary widens; today it is bounded to SMB/performance.\n\n---\n\n## Sources\n\n1. AdExchanger, \"Roku Launches Its Own Self-Serve Ad Platform,\" Sept 18, 2024. Tier 5 (trade analytical). https://www.adexchanger.com/tv/roku-launches-its-own-self-serve-ad-platform/ — accessed 2026-06-19.\n2. AdExchanger, \"Roku Jumps On The API Bandwagon For Its Self-Serve Ads,\" Nov 4, 2025. Tier 5. https://www.adexchanger.com/tv/roku-jumps-on-the-api-bandwagon-for-its-self-serve-ads/ — accessed 2026-06-19.\n3. Roku Newsroom, \"Roku Launches Self-Serve API Suite for Connected TV,\" Nov 2025. Tier 1 (vendor; product existence/feature description only). https://newsroom.roku.com/news/2025/11/roku-launches-self-serve-api-suite-for-connected-tv/ew3rvmze-1762184372 — accessed 2026-06-19.\n4. Digiday, \"Roku is set to reveal a tie-up with The Trade Desk as the streaming platform further opens up programmatic access,\" Apr 30, 2024. Tier 5. https://digiday.com/future-of-tv/roku-is-set-to-reveal-a-tie-up-with-the-trade-desk-as-the-streaming-platform-further-opens-up-programmatic-access/ — accessed 2026-06-19.\n5. Digiday, \"CTV providers court SME ad spend as the streaming wars enter a new era,\" Feb 22, 2024. Tier 5. https://digiday.com/media-buying/ctv-providers-court-sme-ad-spend-as-the-streaming-wars-enter-a-new-era/ — accessed 2026-06-19.\n6. AdExchanger, \"Roku Relaunches Dataxu As OneView, Marrying Its User Data To The DSP,\" 2020. Tier 5 (for dataxu acquisition/OneView relaunch history). https://www.adexchanger.com/digital-tv/roku-relaunches-dataxu-as-oneview-marrying-its-user-data-to-the-dsp/ — accessed 2026-06-19.\n7. AdMonsters, \"Keep Your Frenemies Close: Amazon & Roku's CTV Data Deal,\" June 2025. Tier 5. https://www.admonsters.com/inside-the-roku-amazon-pact/ — accessed 2026-06-19.\n8. Digiday, \"Amazon and Roku kick off Cannes Lions with DSP tie-up,\" June 16, 2025. Tier 5. https://digiday.com/media-buying/amazon-and-roku-kick-of-cannes-lions-with-dsp-tie-up/ — accessed 2026-06-19.\n9. Amazon Ads, \"Roku and Amazon Ads announce an exclusive partnership,\" advertising.amazon.com, June 16, 2025; Roku Newsroom joint release same date. Tier 1 (vendor; executive quotes and scope language, not proof of reach claims). https://advertising.amazon.com/library/news/roku-amazon-ads-partnership — accessed 2026-06-19.\n10. AdExchanger, \"Roku's Clean Room Evolves Into Its New Form: The Roku Data Cloud,\" 2025. Tier 5. https://www.adexchanger.com/tv/rokus-clean-room-evolves-into-its-new-form-the-roku-data-cloud/ — accessed 2026-06-19.\n11. Advanced Television, \"Roku launches Data Cloud collaboration suite,\" Jan 6, 2025. Tier 5. https://www.advanced-television.com/2025/01/06/roku-launches-data-cloud-collaboration-suite/ — accessed 2026-06-19.\n12. Roku, \"Roku unveils data cloud collaboration suite,\" advertising.roku.com. Tier 1 (vendor; partner list/feature description). https://advertising.roku.com/learn/resources/roku-unveils-data-cloud-collaboration-suite — accessed 2026-06-19.\n13. Roku, Inc., Form 8-K (FY2025 quarterly exhibits), SEC EDGAR. Tier 1 (primary filing). https://www.sec.gov/Archives/edgar/data/0001428439/000142843925000035/a08form8ker-exhibit991q225.htm — accessed 2026-06-19.\n14. PPC Land, \"Roku reaches profitability milestone with $1.22B platform revenue in Q4,\" 2026. Tier 5 (summarizing the filing). https://ppc.land/roku-reaches-profitability-milestone-with-1-22b-platform-revenue-in-q4/ — accessed 2026-06-19."}, {"order": 11, "file": "10_Gap_Rival_Intermediaries_And_InHousing_CounterCase.md", "title": "Rival Intermediaries and the In-Housing Counter-Case", "summary": "", "body": "# Rival Intermediaries and the In-Housing Counter-Case\n\n> **Bottom line.** These pages evaluate eight platforms *from* the seat of an agnostic, ACR-activating, margin-capturing CTV intermediary — but two questions an honest field guide must answer remain open: who else sits in that seat, and what is the strongest case that the seat disappears. Take the first. The seat is occupied, and it has a name. **MiQ is the canonical incumbent** — agnostic since 2010, running its own ACR-partnership \"Identity Spine\" and, since June 2025, a unified AI platform (MiQ Sigma) that is the productized version of the \"curator-on-a-neutral-rail\" position the outlook calls most defensible. Around it sit at least six more credible rivals — Goodway Group, Tinuiti, Kepler, Cadent (now an owned-tech platform after the $324M AdTheorent deal), Horizon Media, and the curation-native challengers (Audigent, now Experian, plus Chalice) — each competing for some slice of the same spread. The \"neutral-rail curator\" position is therefore **not a green field; it is a contested one**. The differentiator that matters is no longer \"we are agnostic\" — everyone says that — but the depth and exclusivity of the ACR/identity asset and the credibility of the performance claim. Now the second question. The strongest bear case is real, and it deserves fuller engagement than it usually gets. The threat is not the SSP curation squeeze from below alone but a **pincer**: SSP curation absorbing the activation margin from below *while* holdco principal-media desks (GroupM/WPP Media >$1B, Omnicom >$2B in 2025) and brand in-housing pull ACR-and-trading in-house from above. The independent intermediary's honest reply is not that the pincer is wrong but that it has a specific escape. It survives in the gap principal media has *poisoned* — the 90%-of-marketers-distrust-it transparency wound — and in the gap in-housing keeps failing to staff, where talent is the #1 cited barrier. The thesis \"the differentiated take rate survives\" holds, but only as a claim about a **shrinking, more contested niche**, not a comfortable one. The bear case deserves a named seat in Scenario B.\n\n---\n\n## Why this chapter exists\n\nThe earlier chapters build a rich, eight-dimension comparison of the platforms an agnostic CTV intermediary buys and sells through. The outlook names the most defensible 2028 position — \"curator-on-a-neutral-rail\" — and the analysis of competitive drivers concedes a \"structural squeeze.\" But that account has a blind spot shaped exactly like its own protagonist. It never maps the **other firms already sitting in the protagonist's chair**, and it never lets the **bear case argue at full strength**. Both omissions flatter the model. What follows supplies the missing competitive map and the strongest version of the opposing case, then re-weighs the thesis against them.\n\nA note on framing: \"margin-capturing intermediary,\" \"arbitrage,\" and \"principal media\" are partly contested terms — some practitioners would call the same activity \"managed service\" or \"outcome-based pricing.\" Where the distinction is load-bearing, I name both framings rather than adopt one side's loaded vocabulary.\n\n---\n\n## Part I — The Rival Intermediaries: who else sits in this seat\n\n### MiQ is the canonical incumbent in exactly this seat, and has been since before the term \"curation\" existed\n\nMiQ — founded London, 2010, by Gurman Hundal and Lee Puri — is a platform-agnostic, managed-service programmatic intermediary whose entire positioning is the model described here. It uses \"the best buying platforms, ad inventory, and audience intelligence\" rather than locking to one stack, and it builds its TV targeting on a portfolio of ACR partnerships it describes as \"pretty much agnostic to the provider,\" unified under an \"Identity Spine\" for cross-platform measurement. In June 2025 it launched **MiQ Sigma**, a unified AI platform bringing data, technology, and campaign workflows together — the productized form of the agnostic-curator position. MiQ's existence and posture is the single most important fact the earlier chapters left out; it is living proof that the \"most defensible position\" is already occupied.\n\nMiQ describes its approach as agnostic \"since 2010,\" leveraging the best platforms and audience intelligence rather than owning a single DSP [1][2]. MiQ's Tom Richards has described the firm's TV intelligence as built on ACR data through partnerships that are \"pretty much agnostic to the provider,\" with an \"Identity Spine\" tackling cross-measurement fragmentation in CTV [3]. MiQ Sigma was announced 4 June 2025 as \"the first AI platform that unifies the programmatic ecosystem,\" uniting data, technology, and workflows under applied AI [4][5]. In late 2025 MiQ added Titan OS-level European viewing signals (20M+ CTVs), positioning itself as \"the only managed service provider with access to Titan OS-level intelligence\" — a direct managed-service-plus-data claim [6]. MiQ's self-characterizations are evidence of how it positions itself, not proof of performance.\n\n[1] MiQ, \"Agnostic data strategy\" corporate materials, accessed 2026-06-19. [3] TVREV, \"MiQ's Tom Richards On How ACR Data Is Driving Programmatic Marketing Intelligence,\" accessed 2026-06-19. [4] BusinessWire, \"MiQ Sigma Breaks the Fragmentation Cycle,\" 2025-06-04. [5] Advanced Television, \"MiQ launches MiQ Sigma AI platform,\" 2025-06-04. [6] MiQ, \"MiQ Builds Unparalleled TV Intelligence in Europe Through Deal With Titan OS,\" accessed 2026-06-19.\n\n---\n\n### MiQ's scale is real but its current financials are opaque; the most-cited figures are 4–5 years stale\n\nMiQ is a global, profitable, PE-backed company at meaningful scale, but the publicly verifiable revenue/profit figures date to 2021 and should not be treated as current. Bridgepoint acquired MiQ from ECI Partners in September 2022 at a roughly $900M valuation; the most-cited financials are FY2021 revenue near $465M with ~$45M profit. As of 2025–2026 MiQ was reported to be in talks with new PE backers and weighing M&A. Scale matters for whether MiQ is a *peer* competitor or merely an analogue, but the exact number is not decisive.\n\nBridgepoint acquired MiQ from ECI Partners in September 2022 at ~$900M [7]. FY2021 revenue was reported near $465M (up ~37.7%) with ~$45.4M profit; US revenue is reportedly two-thirds of group [7][8]. In 2025 Digiday reported MiQ in advanced talks with potential new PE backers and mulling M&A [9]. **The FY2021 figures are nearly five years old and almost certainly understate current scale; treat them as a floor, not a current read.** No audited 2024–2025 revenue figure could be located.\n\n[7] Digiday, \"MiQ mulls M&A moves with new PE-backers,\" 2025, accessed 2026-06-19. [8] Pantheon International / Bridgepoint MiQ case studies, accessed 2026-06-19 (PE-investor materials — interested source). [9] Digiday, \"MiQ has entered advanced talks with potential new private equity backers,\" accessed 2026-06-19.\n\n---\n\n### At least six more credible rivals compete for slices of the same spread; the seat is contested, not empty\n\nBeyond MiQ, a credible competitive set for the agnostic, data-led, managed-service CTV intermediary spread includes **Goodway Group** (independent, platform-agnostic, ACR-targeting CTV, aggressively SPO-disciplined), **Tinuiti** (the largest independent performance agency, multi-DSP managed CTV), **Kepler** (data-and-engineering-led managed buying, named as a design partner in Magnite's buyer-agent tests), **Cadent** (a converged-TV platform that became an *owned-tech* player via the $324M AdTheorent acquisition in 2024), **Horizon Media** (the largest US independent media agency, with its own trading/data operations), and **curation-native challengers** — Audigent (acquired by Experian, Dec 2024) and Chalice — that productize the curation-and-data layer the intermediary would otherwise assemble itself. Each differs on the axis that matters: depth/ownership of the ACR-identity asset and the credibility of the performance claim. This competitive map — \"the neutral-rail seat is crowded\" — is the core finding of Part I.\n\n- **Goodway Group** explicitly runs a platform-agnostic CTV model, recommends ACR targeting as a CTV-native advantage, and has practiced hard SPO — reducing its SSP set from ~20 (end of 2024) to single digits — and publicly advocates CTV bid transparency [10][11].\n- **Cadent** acquired AdTheorent for ~$324M (announced 1 April 2024, closed 21 June 2024), folding a machine-learning programmatic platform and audience-identity graph into its converged-TV stack — moving Cadent from intermediary toward *owned-platform* [12][13].\n- **Kepler** was named (alongside Disney Advertising, MiQ, and Spectrum Reach) as a partner in Magnite's buyer-agent testing — corroborating its standing as a sophisticated managed-buying intermediary, as noted in the earlier chapter on competitive drivers.\n- **Audigent**, \"one of the industry's first data curation platforms\" (SmartPMP/ContextualPMP/CognitivePMP, Hadron ID), was acquired by **Experian** on 4 December 2024 (est. ~$200–250M), folding curation-native tooling into an identity giant [14][15].\n- **Tinuiti** and **Horizon Media** are widely recognized as the largest independent performance agency and largest US independent media agency respectively, both running multi-platform managed CTV with proprietary data/measurement layers (positioning corroborated by trade coverage; precise CTV-spread economics are not publicly disclosed).\n\n[10] Beet.TV, \"Transparency in CTV Bidding... Goodway Group's Friedman,\" 2025-03. [11] Goodway Group corporate materials, accessed 2026-06-19 (company self-description). [12] AdExchanger, \"Cadent Acquires AdTheorent For $324 Million,\" 2024-04. [13] StreamTV Insider, \"Cadent to acquire AdTheorent for $324M,\" 2024. [14] Experian PLC, \"Experian accelerates identity and activation capabilities with acquisition of Audigent,\" 2024-12-04. [15] Digiday, \"A sign of things to come: Experian's acquisition of Audigent highlights curation's rising influence,\" 2024-12.\n\n---\n\n### \"We are agnostic\" has stopped being a differentiator; the moat is the ACR/identity asset and the auditable performance claim\n\nBecause every credible rival now markets platform-agnosticism, neutrality is table stakes, not an edge. The differentiators that actually separate these firms are (a) ownership or exclusivity of the ACR/identity data asset, and (b) whether the performance lift can be *shown* rather than asserted. MiQ leads on (a) via its multi-partner ACR Identity Spine; the curation-native challengers (Audigent/Experian, Chalice) compete by selling the data-curation layer as a product, which both arms rivals and commoditizes the assembly work; and the holdco/owned-platform players (Cadent post-AdTheorent) compete by owning the algorithm. This is the answer to \"how crowded is the neutral-rail seat,\" and it directly qualifies the outlook's \"most defensible position\" claim.\n\nThe earlier analysis of competitive drivers already isolates the four counter-forces that keep an intermediary valuable — proprietary ACR licensing, managed-service expertise, genuine optionality, and supply commitments — and notes that optionality is *more* useful as fragmentation grows. But if every rival claims optionality, the *first* counter-force (proprietary/exclusive ACR data) becomes the binding constraint. The curation-native challengers selling SmartPMP-style tooling [14] mean an intermediary can now *buy* the curation layer, which lowers the barrier to entry for the seat and raises the premium on owning data the layer can't replicate. This is reasoning from the competitive map, not a measured market-share figure.\n\n---\n\n## Part II — The Counter-Tradition: the strongest case the seat disappears\n\nThe earlier driver analysis concedes a \"structural squeeze,\" but it engages only the *lower jaw* — SSP curation and transparency tooling compressing the spread from below. The real bear case is a **pincer**. The upper jaw — holdco principal media and advertiser in-housing pulling the ACR-and-trading function in-house from above — is the part the earlier chapters never let argue at full strength. Stated in its own strongest voice, the counter-tradition runs:\n\n> *The third-party margin-capturing intermediary is a transitional artifact. Below it, SSP curation (Index, PubMatic, Magnite ClearLine) absorbs the activation-and-data margin and sells it directly to buyers. Above it, the holdcos have rebuilt principal media into a multi-billion-dollar business and brands are bringing programmatic trading in-house for control and transparency — both pulling the ACR-licensing, deal-building, and trading functions out of the independent's hands. Platform convergence erases the relay; advertiser in-housing erases the agent. What is left for a firm whose value proposition is \"we sit in the middle and move your spend around\"?*\n\n### Holdco principal media is now a multi-billion-dollar business pulling the margin-capture function inside the agencies\n\nThe holding companies have institutionalized principal media — buying inventory as principal and reselling to clients, often at a markup — at a scale that directly competes with the independent intermediary's spread. In 2025, GroupM/WPP Media's principal-media revenue reportedly exceeded $1B, Omnicom's was estimated north of $2B, and Publicis's principal media accounted for slightly more than half its third-party service costs. WPP Media manages over ~$60B in annual media investment across ~80 markets. This is the upper jaw of the pincer the earlier chapters left out — the institutional competitor for the exact spread they call survivable.\n\nDigiday reported principal-media demand underpinning WPP's turnaround plan, with GroupM/WPP Media principal revenue exceeding $1B and Omnicom's estimated north of $2B in 2025, and Publicis principal media at slightly more than half its third-party service costs [16]. WPP retired the GroupM brand in 2025, consolidating under **WPP Media**, managing >~$60B across ~80 markets [16][17]. GroupM/WPP leadership has framed principal trading as a cheaper route to addressable-TV, social, and retail-media inventory for marketers under performance pressure [16]. AdExchanger frames the rise of principal media as structurally reshaping the agency model [18]. The per-holdco dollar figures are interested-party commentary reported via trade press — directionally robust, precisely uncertain.\n\n[16] Digiday, \"Rising demand for principal media buying underpins WPP's turnaround plan,\" 2025, accessed 2026-06-19. [17] Storyboard18, \"The world's largest media agencies... WPP Media,\" 2025. [18] AdExchanger, \"The Rise Of Principal Media And The End Of The Agencies As We Knew Them,\" accessed 2026-06-19.\n\n---\n\n### The Omnicom–IPG merger concentrates buying power against the independent intermediary\n\nOmnicom completed its acquisition of IPG on/by 26 November 2025 (shareholders approved 18 March 2025; ~$13B), creating the world's largest ad holding company. The concentration raises the counterparty power of the in-house-trading-and-principal-media bloc that competes with independent intermediaries for the same managed CTV budgets — the same pressure on counterparty power the earlier driver analysis flags, now intensified. It reinforces the principal-media picture above without being the decisive point on its own.\n\nOmnicom announced completion of the IPG acquisition, \"forming the world's leading marketing and sales company,\" with shareholders of both having approved on 18 March 2025 and close reported by 26 November 2025 after EU approval [19][20]. The combined entity consolidates media-investment scale and the principal-media/in-house-trading capability that competes with independents [19][20].\n\n[19] Omnicom, \"Omnicom Completes Acquisition of Interpublic...,\" 2025-11, accessed 2026-06-19 (press release). [20] Campaign US, \"Omnicom completes acquisition of IPG, creating world's largest ad holding company,\" 2025-11.\n\n---\n\n### Brand in-housing of programmatic is mainstream but plateauing and talent-constrained — the upper jaw bites but does not close\n\nAdvertiser in-housing of programmatic is a mainstream, multi-year movement, but the data shows it is hybrid more than full, plateauing rather than accelerating to completion, and chronically blocked by a talent shortage — which is precisely the gap a specialist intermediary fills. IAB-cited figures put roughly 25% of advertisers fully in-house with hybrid models common; ~70% still rely on external partners for programmatic buying; and talent is the most-cited barrier, with ~75% of industry agreeing quality talent is hard to find. This is the intermediary's honest *rebuttal* to the upper jaw — what keeps the bear case from being decisive. The magnitude and trajectory are genuinely disputed across surveys; an older IAB framing claimed ~69% had taken *some* programmatic in-house.\n\nRecent IAB-cited research puts ~25% of advertisers fully in-house with hybrid adoption a distinct, smaller slice, and nearly 70% still relying on external partners for programmatic buying [21][22]. Talent is repeatedly the top barrier: ~75% of brands, agencies, and publishers agree quality talent is hard to find [21]. An older IAB framing reported ~69% of brands had taken *some* programmatic in-house — but \"some in-house\" and \"fully in-house\" are very different claims, and the headline has been over-read [23]. **The honest read: in-housing is broad but shallow — many brands run a hybrid where a specialist still does the hard CTV/ACR execution.** Figures vary materially by survey, region, and definition.\n\n[21] IAB / trade summaries of in-housing research, accessed 2026-06-19. [22] The Version2 / Epom syntheses of IAB in-housing data, 2025 (secondary syntheses; use as directional). [23] Chief Marketer, \"IAB Report: 69 Percent of Brands Have Taken Programmatic Advertising In-House,\" accessed 2026-06-19.\n\n---\n\n### Principal media's own transparency wound is the independent intermediary's best defense\n\nThe same principal-media surge that competes with the independent intermediary has generated a trust crisis the independent can position *against*: per ANA-cited data established earlier, ~56% of marketers expected to use principal media in 2025 (up from 41%), markups run ~30–90%, **~90% of client-side marketers are uncertain principal media is in their best interest** (up from 79%), and only 57% have governance guidelines. A transparent, disclosed-margin independent on a neutral rail is the structural antidote to exactly the opacity brands distrust in holdco principal media. This is the synthesis that lets the \"differentiated take rate survives\" thesis stand *against* the strongest opposing case rather than merely beside it.\n\nThe ANA principal-media figures (56% adoption, 30–90% markups, 90% distrust, 57% governance) are established in the earlier driver analysis [Marketing Dive 2025; Digiday]. The strategic inference: if the holdcos' upper-jaw competitor is *itself* the most-distrusted form of margin capture in the market, the independent's disclosed-margin, neutral-rail posture is not just survivable but **differentiated precisely against the competitor pulling the function in-house**. The bear case's upper jaw is therefore self-limiting: brands fleeing holdco principal-media opacity are a demand source for transparent independents. This is the central reconciliation; the figures are established, the implication is reasoned inference.\n\nMarketing Dive, \"Principal media buying: How marketers can safeguard themselves, per ANA,\" 2025; Digiday, \"WTF is principal media?,\" accessed 2026-06-19.\n\n---\n\n## Synthesis — re-weighing the thesis against both omissions\n\n### The neutral-rail seat is occupied and contested (Part I)\n\nThe outlook names \"curator-on-a-neutral-rail\" the most defensible 2028 position and implies the intermediary can move into it. Part I corrects the omission: **MiQ has occupied that exact position since 2010 and productized it as Sigma in 2025**, and at least six more rivals (Goodway, Tinuiti, Kepler, Cadent, Horizon, plus curation-native Audigent/Experian and Chalice) compete for slices of the same spread. The seat is real and defensible — but it is not empty, and \"agnostic\" is no longer a differentiator. The binding constraint is the **depth and exclusivity of the ACR/identity asset and the auditability of the performance claim.** This *sharpens* the thesis rather than refuting it: the differentiated take rate survives, but the differentiation has to run deeper than neutrality, because neutrality is now a commodity.\n\n### The pincer is real; the earlier chapters engaged only one jaw (Part II)\n\nThe earlier driver analysis engaged the lower jaw (SSP curation, transparency tooling). Part II supplies the upper jaw: **holdco principal media (>$1B GroupM/WPP Media, >$2B Omnicom in 2025) and brand in-housing pulling ACR-and-trading in-house**, concentrated further by the Omnicom–IPG close (Nov 2025). The strongest bear case — the independent is a transitional artifact, erased by convergence below and in-housing above — is coherent, and it deserves a named seat in the forecast.\n\n### But the bear case is self-limiting, and the thesis survives — as a claim about a narrower niche\n\nThe reconciliation: in-housing is **broad but shallow and talent-starved** — the gap a specialist fills — and holdco principal media carries a **90%-distrust transparency wound** the disclosed-margin independent is structurally positioned *against*. So the thesis \"the undifferentiated take rate dies, the differentiated one survives\" holds. But the honest restatement is narrower than the confident framing earlier: **the differentiated take rate survives in a shrinking, contested niche, defended on two fronts (against SSP curation below and holdco/in-house trading above), and only for operators who own a genuinely exclusive ACR/identity asset and can audit their lift.** That is survival, not comfort.\n\n### Tie-back to the scenarios\n\n- **Scenario B (Transparency Squeeze)** should be widened to a **two-jaw pincer**: today it reads as SSP-curation-plus-LLD from below; it should explicitly carry holdco principal media and in-housing from above. The same disclosure wave that compresses the independent's spread *also* wounds the holdco principal-media competitor — so the net effect on independents is **ambiguous, not strictly negative**, which the current Scenario B does not capture.\n- **Scenario A (Curation Eats the Stack)** gains a competitor list: if curation eats the stack, the curators are not only Index/Magnite/PubMatic (platforms) but **MiQ-and-peers (intermediaries who curate on those rails)** and **Audigent/Experian-and-Chalice (curation-native vendors)** — the question \"who becomes the curator\" has more contestants than the earlier chapters name.\n- The \"structural squeeze\" is better understood as a structural **pincer**, with the upper jaw (principal media + in-housing) added to its four lower-jaw forces, and the self-limiting counter (the principal-media trust wound; the in-housing talent gap) added to its counter-forces.\n\n---\n\n## Open Questions\n\n1. **What is MiQ's current (2024–2025) revenue and managed-spend scale?** The public figures are FY2021; a current read would establish whether MiQ is a peer-scale competitor or a category-defining leader several times the size of the protagonist implied throughout this account.\n2. **Does the in-housing curve plateau or resume climbing?** The data shows hybrid dominance and a talent constraint today; if agentic AI (Scenario C) erases the talent barrier, in-housing could resume — collapsing the specialist's gap. This is the swing variable for the upper jaw.\n3. **Will principal media's transparency wound heal or worsen?** If holdcos adopt disclosed principal models (ANA governance pressure), they neutralize the independent's best differentiator; if the distrust persists, it remains a demand source for transparent independents.\n4. **Do the curation-native challengers (Audigent/Experian, Chalice) arm the independents or replace them?** Selling the curation layer as a product lowers the barrier to the seat (good for new entrants) but commoditizes the assembly work (bad for incumbents whose margin was the assembly).\n5. **How exclusive is any third-party ACR asset, really?** MiQ's \"agnostic to the provider\" framing is a strength for coverage but a weakness for exclusivity — if every rival can license the same Samba/ACR partners, the asset is shared, not owned, and the moat described above is thinner than it looks.\n\n---\n\n## Sources\n\nVendor and PE-investor self-descriptions are treated as evidence of positioning, not proof of performance. Per-holdco principal-media dollar figures are interested-party commentary relayed via trade press — directionally robust, precisely uncertain.\n\n1. MiQ corporate materials (agnostic strategy; Identity Spine; Sigma). Company self-description. https://www.wearemiq.com — accessed 2026-06-19.\n2. Roku Advertising, \"The future of CTV performance: a conversation with MiQ.\" (co-published — interested). accessed 2026-06-19.\n3. TVREV, \"MiQ's Tom Richards On How ACR Data Is Driving Programmatic Marketing Intelligence.\" accessed 2026-06-19.\n4. BusinessWire, \"MiQ Sigma Breaks the Fragmentation Cycle: The First AI Platform That Unifies the Programmatic Ecosystem,\" 2025-06-04. (press release).\n5. Advanced Television, \"MiQ launches MiQ Sigma AI platform,\" 2025-06-04.\n6. MiQ, \"MiQ Builds Unparalleled TV Intelligence in Europe Through Deal With Titan OS.\" Company self-description. accessed 2026-06-19.\n7. Digiday, \"MiQ mulls M&A moves with new PE-backers,\" 2025. accessed 2026-06-19.\n8. Pantheon International / Bridgepoint MiQ case studies. (PE-investor — interested). accessed 2026-06-19.\n9. Digiday, \"MiQ has entered advanced talks with potential new private equity backers.\" accessed 2026-06-19.\n10. Beet.TV, \"Transparency in CTV Bidding Is Key... Goodway Group's Friedman,\" 2025-03.\n11. Goodway Group corporate materials (platform-agnostic CTV; ACR; SPO). Company self-description. accessed 2026-06-19.\n12. AdExchanger, \"Cadent Acquires AdTheorent For $324 Million, With Plans To Expand Beyond TV,\" 2024-04.\n13. StreamTV Insider, \"Cadent to acquire AdTheorent for $324M,\" 2024.\n14. Experian PLC, \"Experian accelerates identity and activation capabilities with acquisition of Audigent,\" 2024-12-04. (press release).\n15. Digiday, \"A sign of things to come: Experian's acquisition of Audigent highlights curation's rising influence,\" 2024-12.\n16. Digiday, \"Rising demand for principal media buying underpins WPP's turnaround plan,\" 2025. (relays interested investor commentary). accessed 2026-06-19.\n17. Storyboard18, \"The world's largest media agencies: Inside WPP Media, Omnicom Media, Publicis Media, Dentsu and Havas,\" 2025.\n18. AdExchanger, \"The Rise Of Principal Media And The End Of The Agencies As We Knew Them.\" accessed 2026-06-19.\n19. Omnicom, \"Omnicom Completes Acquisition of Interpublic, Forming the World's Leading Marketing and Sales Company,\" 2025-11. (press release).\n20. Campaign US, \"Omnicom completes acquisition of IPG, creating world's largest ad holding company,\" 2025-11.\n21. IAB / trade summaries of in-housing research (talent barrier; in-house share). accessed 2026-06-19.\n22. The Version2; Epom, syntheses of IAB in-housing data, 2025. (secondary syntheses — directional only). accessed 2026-06-19.\n23. Chief Marketer, \"IAB Report: 69 Percent of Brands Have Taken Programmatic Advertising In-House.\" (older framing — over-read headline). accessed 2026-06-19."}, {"order": 12, "file": "11_Gap_Measurement_Verification_Currency_Layer.md", "title": "The Measurement, Verification & Currency Layer", "summary": "The fourth structural seat alongside DSP, SSP, and identity: the layer that produces the proof on which the whole differentiated-take-rate thesis rests. Maps Nielsen, VideoAmp, iSpot/605, Comscore/Proximic, DoubleVerify, and IAS — dated and present-tense — and asks whether independent measurement is friend or foe to a margin built on auditable lift.", "body": "# The Measurement, Verification & Currency Layer\n\n> **Bottom line.** One survival condition matters above all others — and it recurs throughout this account: the only margin that survives 2028 is the *differentiated* take rate, margin paid for \"proprietary ACR targeting,\" \"demonstrable performance,\" \"auditable lift,\" and \"proof of incrementality.\" Yet the layer that *produces* that proof and *adjudicates* that lift is rarely mapped directly. Measurement, verification, and currency vendors tend to appear only passively — Nielsen Gracenote and iSpot/VideoAmp/Comscore as ACR *consumers*, DoubleVerify as one of seventeen Index data partners, IAS as a supply integration. None is dimensioned as its own competitive and economic actor. These pages install the missing seat. The finding is a **two-edged dependency** that mirrors the transparency framing exactly. Independent, accredited measurement is the intermediary's best *friend* when it proves ACR-driven lift to a client and lets the intermediary charge for outperformance. It is the most dangerous *foe* when the same independent audit could *debunk* the sell-side curation lift (PubMatic's +37% CPM, the \"25-40% reach lift\") and collapse the curation premium the whole sell-side thesis rests on. The layer is at once a margin **defense** (the audit that justifies the spread) and a margin **sink** (another fee on an already-long chain). The going-concern news is mixed and consequential. **Nielsen** went private in 2022 (Elliott/Brookfield, $16B) and remains the primary upfront currency, its Big Data + Panel product MRC-accredited in January 2025 — but **Nielsen ONE was descoped** and the multi-currency future \"hit a wall.\" **The JIC certified Comscore, iSpot, and VideoAmp** as transactable currencies (April 2024, two-year term) while Nielsen declined to participate. **The rumored alt-currency consolidation did not happen in the form reported** — there is no iSpot↔VideoAmp merger; iSpot acquired **605** in September 2023, and VideoAmp survived heavy distress (multiple layoff rounds, a CEO change to Tony Fagan in December 2025) but is **independent and not profitable**. **Comscore** ran a Goldman-advised strategic review ending in a 2025 recapitalization — solvent but financially fragile. The verification duopoly consolidated upward into outcomes: **DoubleVerify bought Rockerbox** (closed March 2025, $82.6M) and **IAS was taken private by Novacap** (closed December 2025, $1.9B). Most important of all, the intermediary's own licensed ACR asset — **Samba TV** — is *itself* a currency-grade measurement vendor (ICPM, TRF, incremental-reach guarantees), so the intermediary can **vertically integrate its proof layer** rather than rent it. That is the single most important and least appreciated fact here: the asset that produces the targeting also produces the audit.\n\n---\n\n## Why this layer matters\n\nThe earlier chapters map where the intermediary *buys* (DSPs), *yields* (SSPs), and *activates identity* (the ACR and clean-room layer). They then all converge on one survival condition: the differentiated take rate, the margin paid for *auditable* performance. The surviving margin, put plainly, is \"earned by activating licensed ACR data into the best-performing deals, and who can *show* the performance.\" The moat is \"ACR-asset exclusivity plus auditable lift.\" And the central open question of the outlook is whether \"an independent audit either validates or debunks the sell-side performance lift.\"\n\nSo the entire thesis rests on *proof* — and it is worth asking who supplies it, whether they still exist, and whether they help or hurt the intermediary's margin. Measurement is no peripheral vendor category here. It is the **fourth structural seat**. The DSP decides the bid, the SSP decides the deal, identity decides who the household is, and **measurement/currency decides whether the buy worked and whether the lift was real.** Without that fourth seat, \"auditable lift\" is an assertion with nothing behind it. What follows installs the seat, dimensions its occupants, dates their solvency, and answers the friend-or-foe question.\n\nA note on terms: \"currency,\" \"measurement,\" and \"verification\" are three distinct functions the trade press often blurs. **Currency** = the dataset both buyer and seller agree to transact and reconcile on (Nielsen, Comscore, iSpot, VideoAmp for national TV). **Measurement** = audience, reach, frequency, and outcome quantification (overlaps with currency but is broader). **Verification** = the gatekeeping layer for viewability, fraud/IVT, and brand safety on a given impression (DoubleVerify, IAS). I keep them separate where the distinction is load-bearing, because each bears on the intermediary's margin in a different way.\n\n---\n\n## Part I — The Four Functions and Who Runs Them (dated, present-tense)\n\n### Nielsen: private, still primary, but Nielsen ONE descoped\n\nNielsen went private in 2022, remains the primary TV currency in 2026, and got its Big Data + Panel product MRC-accredited in January 2025 — but Nielsen ONE, as the single cross-platform currency, was descoped.\n\nNielsen Holdings was taken private on October 11, 2022 by a consortium led by Evergreen Coast Capital (an Elliott Investment Management affiliate) and Brookfield Business Partners for $28/share, ~$16B including debt. Under PE ownership, Nielsen's strategic product is **\"Big Data + Panel\"** national TV measurement, which the Media Rating Council **accredited in January 2025** (the first accredited Big Data + Panel national measurement) and **reaffirmed in 2026**; it draws on smart-TV and set-top data from 45M+ homes / 75M+ devices. **Nielsen ONE** — the once-promised single cross-platform (linear + digital) currency — was *not* submitted to MRC and was effectively descoped from \"the cross-platform currency\" to a planning/outcomes suite layered on Big Data + Panel. Nielsen retired panel-only national measurement by the end of 2025, making Big Data + Panel the primary upfront currency for 2025-26.\n\nThis matters because Nielsen's continued primacy is the constraint that determines whether an agnostic intermediary can *choose* a currency that flatters its ACR-targeted buys or is locked to the incumbent.\n\nThe Evergreen/Brookfield consortium closed the $16B take-private October 11, 2022; shares stopped trading October 12, 2022 [1]. MRC accredited Nielsen's Big Data + Panel national TV measurement in January 2025 and reaffirmed it in 2026, with the underlying data drawn from 45M+ homes and 75M+ devices via Comcast, DirecTV, Dish, Roku, and Vizio partnerships [2][3]. Nielsen ONE \"is not submitted to MRC for auditing/evaluation at present but is planned for the future\"; Nielsen expanded Nielsen ONE to *outcomes* and *advanced audiences* rather than shipping it as the single transactional cross-platform currency [2][4]. The MRC instructed Nielsen to make methodology fixes and Nielsen delayed two of them to August 2026, leaving the 2025 audit open [4]. Nielsen's self-descriptions of scale are company-stated; the MRC accreditation is the independent check.\n\nSources: [1] Nielsen, \"Nielsen Announces Closing of Transaction With Evergreen- and Brookfield-Led Consortium,\" 2022-10-11; PRNewswire mirror; Private Equity Wire, \"PE consortium completes $16bn Nielsen acquisition.\" [2] Nielsen / MRC, \"The Media Rating Council Accredits Nielsen's Innovative Big Data + Panel National TV Measurement,\" 2025-01; Marketing Dive, \"Nielsen's latest MRC accreditation returns it to measurement pole position,\" 2025; eMarketer, \"Nielsen Big Data + Panel measurement achieves MRC accreditation.\" [3] The Desk, \"MRC reaffirms accreditation for Nielsen's Big Data + Panels currency,\" 2026-05. [4] The Current (The Trade Desk-owned trade outlet — note ownership lean), \"Nielsen delays MRC-required fixes to TV currency beyond upfronts,\" 2025. All accessed 2026-06-19.\n\n---\n\n### The JIC certified Comscore, iSpot, and VideoAmp — and Nielsen declined\n\nThe U.S. Joint Industry Committee certified Comscore, iSpot, and VideoAmp as transactable national TV currencies (April 2024, two-year term); Nielsen declined to participate; the audit was reaffirmed for 2025-26.\n\nThe U.S. Joint Industry Committee (US-JIC) — formed by broadcasters and the VAB to vet Nielsen alternatives — granted **conditional certification** to Comscore, iSpot, and VideoAmp in September 2023, then **full transactional certification** to Comscore and VideoAmp in **April 2024** (iSpot completing shortly after), for a **two-year term covering calendar 2024 and 2025**. A **mid-term audit completed July 10, 2025** reaffirmed all three as \"currency-grade\" for the 2025-26 broadcast season, with **Comscore newly clearing the \"personified demographics\" benchmark** to join iSpot and VideoAmp as transactable across personified demographics, households, and advanced audiences. **Nielsen was invited but declined to participate** in the JIC certification process. The audit ran 699+ tests across data evaluation, total ad supply, and sports.\n\nThis matters because JIC certification is exactly the mechanism that *could* let an agnostic intermediary pick a currency other than Nielsen; whether it produced a real multi-currency market (vs. a paper option) is the pivot of Part II.\n\nThe JIC granted conditional certification to all three in September 2023, then full certification to Comscore and VideoAmp in April 2024, with certifications granted for a two-year term covering 2024-2025 and an audit of 699+ tests [5][6]. The JIC's July 10, 2025 mid-term audit reaffirmed certification and currency-grade readiness for 2025-26, with Comscore newly meeting the personified-demographics benchmark [7]. Nielsen was invited but declined to participate [7][6]. The JIC is an interested body — it exists to validate Nielsen alternatives — so \"certified\" means \"passed the JIC's transactability audit,\" not \"won the market.\" That distinction is taken up below, where the multi-currency market is examined directly.\n\nSources: [5] MediaPost, \"US-JIC Fully Certifies Comscore, VideoAmp As 'Transactional' Currencies,\" 2024-04-03; Marketing Dive, \"Comscore, iSpot, VideoAmp picked for JIC's next measurement move.\" [6] Next TV, \"Nielsen Rivals Comscore, iSpot, VideoAmp Get Conditional Certification…\"; AdExchanger, \"The JIC Certifies Comscore And VideoAmp As National TV Currencies.\" [7] VideoAmp / US-JIC, \"U.S. Joint Industry Committee Completes Audit of Certified Currencies…,\" 2025-07-10 (primary release); Marketing Dive, \"Comscore, iSpot, VideoAmp pass currency audit ahead of broadcast season.\" All accessed 2026-06-19.\n\n---\n\n### No iSpot–VideoAmp merger: 605 went to iSpot, VideoAmp survived distress\n\nThe rumored alt-currency consolidation did not happen in the form reported: there is no iSpot↔VideoAmp merger. iSpot acquired 605 (Sept 2023); VideoAmp survived distress and remains independent and unprofitable.\n\nThe rumor was of \"strong 2025 consolidation pressure among alt-currencies — a merger or shutdown.\" **No iSpot↔VideoAmp combination occurred.** The actual consolidation event is older and different: **iSpot.tv acquired 605 in September 2023**, folding 605's big-data TV panel into iSpot. iSpot had earlier taken a $325M Goldman Sachs investment and earned the first-ever **MRC accreditation for national TV ad occurrence reporting** (September 2023, 178 networks). **VideoAmp** went through severe distress — a ~10% layoff (2023), a further ~20% cut with founder Ross McCray stepping down (2024-25), then **Tony Fagan named CEO in December 2025** — but it **remains an independent company** (≈$534M raised across 8 rounds; ≈706 employees mid-2026) and **is still not profitable**, dependent on campaign-activation revenue rather than pure currency fees. So the going-concern verdict is: iSpot = stable and acquisitive; VideoAmp = fragile-but-alive; no merger.\n\nThis matters because an analysis that leaned on \"auditable lift\" while a key auditor had merged or wound down would be silently wrong; settling the going-concern question of every named vendor is therefore essential.\n\niSpot acquired 605 in September 2023, adding \"the largest big data panel for measurement in TV,\" after a $325M Goldman Sachs investment [8]. iSpot earned first-ever MRC accreditation for national TV ad occurrence reporting across 178 networks in September 2023 [9]. VideoAmp cut ~10% of staff in 2023 and ~20% with CEO Ross McCray stepping down to Executive Chairman Peter Liguori amid debt pressure after a $150M Series G; it appointed Tony Fagan CEO in December 2025; it has raised ~$534M total and is not profitable, making most of its money from campaign activation [10][11]. No source reports any iSpot-VideoAmp merger or acquisition; the rumored combination did not occur in the 2025 window. The \"no merger\" finding is an absence-of-evidence read across the outlets that would have reported it — strong but inherently not a positive citation.\n\nSources: [8] AdExchanger, \"iSpot Acquires TV Measurement Competitor 605\"; StreamTV Insider, \"iSpot expands TV measurement capabilities with 605 acquisition\"; Axios, \"iSpot acquires TV measurement company 605,\" 2023-09-13. [9] MediaPost, \"iSpot Gets MRC Accreditation For National Occurrence Data,\" 2023-09-27; Variety, \"Media Rating Council Grants Accreditation to iSpot Measurement Technology.\" [10] Ad Age, \"VideoAmp CEO Ross McCray steps down as company lays off 20% of staff\"; Axios, \"VideoAmp quietly laid off 10% of staff just before Series G announcement,\" 2023-09-14. [11] AdExchanger, \"Why VideoAmp Stumbled In The Race To Replace Nielsen\"; Tracxn, \"VideoAmp — 2026 Company Profile\" (Tracxn is an aggregator — corroborating figure only). All accessed 2026-06-19.\n\n---\n\n### Comscore: solvent but fragile, with Proximic as the growth engine\n\nComscore is solvent but financially fragile: a 2025 Goldman-advised strategic review ended in a recapitalization, and Proximic — its curation/contextual arm — is the growth engine, distinct from its measurement currency.\n\nComscore (NASDAQ: SCOR) remains a going concern but is the most financially fragile of the named currency vendors. In 2025 it ran a **Goldman Sachs-advised strategic review** that culminated in a **Q3 2025 recapitalization** — exchanging all outstanding preferred stock for common and new no-dividend preferred, freeing cash to invest in cross-platform measurement. As of September 30, 2025 it held ~$29.9M cash against ~$44.7M senior-secured term-loan principal. Its growth is concentrated in **Cross-Platform**, where **Proximic by Comscore** — the privacy-forward contextual/audience-targeting and curation arm that appears elsewhere as an Index and PubMatic data partner — is gaining traction, even as Comscore tempered Proximic's Q4 2025 outlook. Comscore's **measurement/currency arm** and **Proximic (curation/activation)** are best read as two different businesses with different bearings on the intermediary.\n\nThis matters for the going-concern picture: Comscore is a JIC-certified currency *and* an ACR-data partner; if it failed, both a currency option and a curation data source would vanish.\n\nComscore announced a strategic review that culminated in a recapitalization (preferred-for-common-plus-new-preferred exchange, no annual dividends) to gain financial flexibility for cross-platform investment; Q3 2025 cross-platform revenue grew ~20% YoY [12]. As of September 30, 2025, cash/equivalents/restricted cash totaled ~$29.9M against ~$44.7M term-loan principal [12]. Proximic's privacy-forward audience targeting is gaining traction within Cross-Platform, with Q4 2025 Proximic growth expectations tempered [12][13]. Comscore's own framing of the recap as \"increased financial flexibility\" is company-stated; the cash-vs-debt figures are from its reported results and SEC filing — the independent read is that ~$29.9M cash against ~$44.7M debt is a thin cushion that makes Comscore a fragility risk, not an imminent-failure risk.\n\nSources: [12] Comscore, \"Comscore Reports Third Quarter 2025 Results,\" 2025-10; Comscore Form 8-K FY2025 (SEC EDGAR, CIK 0001158172); Quiver Quantitative summary, \"Comscore Reports Q3 2025 Financial Results Highlighting 20% Growth in Cross-Platform Solutions and Recapitalization Strategy.\" [13] Comscore, \"Proximic by Comscore Releases 2025 State of Programmatic Report,\" 2025-01. All accessed 2026-06-19.\n\n---\n\n### The verification duopoly moved into outcomes\n\nThe verification duopoly consolidated upward into outcomes: DoubleVerify bought Rockerbox (closed March 2025, $82.6M); IAS was taken private by Novacap (closed December 2025, $1.9B) and launched IAS Total TV (April 2026) on Publica.\n\nThe brand-safety/viewability/fraud verification duopoly — **DoubleVerify** and **Integral Ad Science (IAS)** — both moved decisively from gatekeeping (viewability/IVT/brand-safety) toward **outcomes and attribution**, the exact layer that proves or debunks lift. **DoubleVerify acquired Rockerbox** (multi-touch attribution, marketing-mix modeling, and incrementality testing), announced February 26, 2025, **closed March 13, 2025 at $82.6M**; DV's CTV \"Media Transactions Measured\" grew 30-45% across 2025 quarters. **IAS was taken private by Novacap** (a North American PE firm) in an all-cash **$1.9B deal at $10.30/share, announced September 24, 2025, closed December 23, 2025**, and in April 2026 launched **IAS Total TV**, a CTV suite spanning show/genre/rating/program-level data across Prime Video, Disney, NBCUniversal, and Paramount and publishers on the **Publica** ad server (the same Publica that appears elsewhere only as a supply integration). Both verification players now gate brand-safety/viewability/fraud on the deal IDs an intermediary curates *and* increasingly sell the outcome measurement that adjudicates lift.\n\nThis matters because these two firms gate the deal IDs the intermediary curates and now also produce the incrementality/outcome proof; their move into outcomes is what makes the measurement layer a *competitor* to the intermediary's own proof story, not just a passive utility.\n\nDoubleVerify announced the Rockerbox acquisition February 26, 2025, adding MTA, MMM, and incrementality testing across open web, search, social, and CTV; the deal closed March 13, 2025 at $82.6M; DV's CTV Media Transactions Measured rose ~45% in Q2 2025 and ~30% by Q3 2025 [14]. IAS agreed to be acquired by Novacap for ~$1.9B ($10.30/share, all cash) on September 24, 2025; the deal closed December 23, 2025; IAS launched IAS Total TV on April 27, 2026 across Prime Video, Disney, NBCUniversal, Paramount, and Publica-served publishers, unifying content insights, media quality, supply path, and outcomes in its Signal platform [15][16]. DV's growth percentages are company-reported; the acquisition prices and closing dates are from primary releases and SEC filings.\n\nSources: [14] DoubleVerify, \"DoubleVerify To Acquire Rockerbox…,\" 2025-02-26; DV Form 8-K FY2025 (SEC EDGAR, CIK 0001819928); Advanced Television, \"DoubleVerify acquires Rockerbox,\" 2025-02-27; Fintel, \"$82.6M Rockerbox acquisition completed March 13, 2025.\" [15] IAS, \"IAS Announces Completion of Acquisition by Novacap\"; IAS Form 8-K FY2025 (SEC EDGAR, CIK 0001842718); Marketing Dive coverage of the Novacap deal. [16] Marketing Dive, \"IAS touts 'linear-like' transparency with CTV ad measurement solutions\" / IAS Total TV (2026-04); Social Samosa, \"Integral Ad Science launches CTV suite.\" All accessed 2026-06-19.\n\n---\n\n### The multi-currency future stalled: certification produced paper options\n\nThe multi-currency future stalled: certification produced paper options, not a transacting market. Nielsen remains the primary upfront currency in 2025-26; alternatives are \"shadow currencies\" and tests.\n\nDespite JIC certification of three alternatives, the multi-currency transaction future the industry promised **did not arrive by 2026 — it \"hit a wall.\"** Nielsen remains the currency on which 2025-26 upfront deals are actually agreed, with multiyear Nielsen contracts at Netflix, TelevisaUnivision, Warner Bros. Discovery, Tubi, and seven top agencies; alternative-currency inclusion is \"largely limited to tests\" and \"shadow currencies.\" The one genuine alt-currency traction story is **VideoAmp**, which cleared ~$3B in 2024 upfront deals (an 880% jump from 2023) across NBCU, Paramount, WBD, Amazon, Netflix, and all five holdcos, and projects ~$6B in currency-and-measurement transactions for 2026 — but both VideoAmp and Comscore have signaled uncertainty about taking *meaningful* national-currency share this cycle. **Practical consequence for the intermediary: it cannot reliably \"pick the currency that flatters its ACR-targeted buys\" at the transacting layer — Nielsen still anchors the deal.** The intermediary's leverage is therefore *not* currency-shopping but *measurement-shopping*: running independent incrementality/outcome measurement (including its own Samba asset) alongside the Nielsen-denominated buy.\n\nThis is the genuinely contested point of the chapter. The *direction* — Nielsen still primary — is well-established; the *magnitude and durability* of alt-currency traction is disputed and vendor-inflated. It answers directly whether an agnostic intermediary can pick its currency or is locked to Nielsen, and the answer reshapes where the intermediary's measurement leverage actually sits.\n\nA TV-network executive characterized the currency transition as having \"kind of just hit a wall\"; Nielsen's measurements remain the currency on which upfronts are agreed, with multiyear deals at Netflix, TelevisaUnivision, WBD, Tubi, and seven top agencies, and alternative inclusion \"largely limited to tests\" [17]. VideoAmp cleared ~$3B in 2024 upfront deals (up ~880% YoY) and projects ~$6B for 2026, but both VideoAmp and Comscore signaled uncertainty about meaningful national-currency share [17][18]. Nielsen phased out panel-only national measurement by end-2025, making Big Data + Panel the primary 2025-26 upfront currency [17]. VideoAmp's $3B/$6B figures are company-stated and should be read as directional traction evidence, not audited transaction volume; the \"hit a wall\" framing is a named-but-anonymous network executive via Digiday.\n\nSources: [17] The Current, \"Everyone complains about Nielsen. Upfronts still run on it\" (TTD-owned — note lean); Digiday, \"'Hit a wall': Why TV advertising's measurement currency change won't happen in this year's upfront cycle.\" [18] Digiday, \"Advertisers, TV networks plan to set Nielsen alternatives as 'shadow currencies'\"; Ad Age, \"How to transact on alternative currencies in TV upfront.\" All accessed 2026-06-19.\n\n---\n\n### Samba TV is itself a currency-grade measurement vendor\n\nThe intermediary's own ACR asset, Samba TV, is itself a currency-grade measurement vendor, not only a targeting segment — vertically integrating the proof layer.\n\nThis corrects the common treatment of Samba as merely an ACR *targeting* segment. **Samba TV sells outcome and incremental-reach measurement as a product** — it has launched **ICPM** (positioned explicitly \"as an alternative to Nielsen\" for cross-platform measurement and a potential transacting currency), **TRF (True Reach and Frequency)** as a currency-grade metric, **Incremental Reach Forecasting and Measurement**, and **Samba AI** for holistic ROI measurement across paid media, product placement, and sponsorship. Samba is a named measurement partner in **Disney's** multi-vendor measurement approach (alongside Comscore and Nielsen) and powers in-platform incremental-reach measurement for partners like **StackAdapt** and **Attain**. The strategic consequence: an intermediary licensing Samba data **does not have to rent its proof from Nielsen, iSpot, VideoAmp, DV, or IAS** — the same asset that produces the targeting also produces the audit. That is a genuine vertical integration of the proof layer and a direct answer to the friend-or-foe question: it makes independent measurement *more* friend than foe, because the intermediary can supply the lift evidence from an asset it already controls — provided buyers accept Samba-sourced measurement as independent of the Samba-sourced targeting (a conflict a skeptical client will probe).\n\nThis is the single most consequential and least-appreciated fact here; it converts the measurement layer from a pure external dependency into a potential owned capability.\n\nSamba TV launched ICPM as a Nielsen alternative for cross-platform measurement and potential currency [19]; offers TRF as a currency-grade metric, plus Incremental Reach Forecasting/Measurement and Samba AI ROI measurement across paid media, product placement, and sponsorship [19][20]. Disney works with Samba TV, Comscore, and Nielsen on measurement [21]; StackAdapt and Attain use Samba for in-platform incremental reach and linear incrementality [22]. Samba's currency-grade and accuracy claims are company-stated and not MRC- or JIC-certified in the way Nielsen/Comscore/iSpot/VideoAmp national currencies are — so the vertical-integration advantage is real for client-facing proof but does not (yet) let the intermediary transact on a Samba currency at the upfront. The conflict-of-interest flag — same vendor for targeting and measurement — is the honest limit on this advantage.\n\nSources: [19] Next TV, \"Samba TV Launches ICPM To Guarantee Incremental Reach\"; AdExchanger, \"Samba TV On Why Measurement's Future Is All About Incremental Reach And Guaranteed Outcomes.\" [20] Samba TV, \"Samba TV Extends Samba AI to Holistically Measure ROI from Paid Media, Product Placement, and Sports Sponsorship\" (primary release
