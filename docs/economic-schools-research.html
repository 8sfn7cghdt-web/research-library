nd it is the scaffolding on which everything else in Marx's economics is built.\n\nJournalism got Marx expelled from Prussia, then from Paris, then (after a brief stint in Brussels where he and Engels wrote the *Communist Manifesto* for the Communist League in 1848) from Cologne after the failed revolutions of that year swept Europe. He met Engels in Paris in 1844; the son of a Manchester textile manufacturer, Engels had already published an empirically grounded indictment of industrial poverty, *The Condition of the Working Class in England*, and he became Marx's lifelong patron, co-author, and — after Marx's death — editor, assembling volumes two and three of *Capital* from Marx's unfinished manuscripts. In 1849 Marx settled permanently in London, where he would live for the rest of his life in genuine and often desperate poverty, subsidized substantially by Engels's income from the family firm. Three of Marx's seven children died in infancy or childhood, in circumstances his biographers link to that poverty. From the early 1850s Marx spent years of research in the Reading Room of the British Museum, working through the accumulated literature of English political economy — Smith, Ricardo, and the mass of parliamentary Blue Books on factory conditions that gave *Capital* its extraordinary empirical texture. The first volume of *Capital* appeared in 1867; Marx never finished the second and third, and Engels published them posthumously from his notes in 1885 and 1894. A fourth planned volume, on the history of economic theory, survives as *Theories of Surplus Value*, also edited posthumously (by Karl Kautsky). The scale of the unfinished project matters for what follows: the theory of capitalist crisis that Marxists later treated as settled doctrine was, in Marx's own hands, still being worked and reworked at the time of his death in 1883.\n\n## The apparatus: value, surplus value, and exploitation\n\nMarx did not invent the labor theory of value; he inherited it from Ricardo, who had inherited a version of it from Smith, and radicalized it into a theory of exploitation that neither of his predecessors intended. The classical version, as covered in the chapter on Smith and Ricardo, held roughly that the relative prices of freely reproducible commodities track the labor required to produce them. Marx kept this as his starting premise in *Capital* volume one — a commodity's value is the socially necessary labor time embodied in it, \"socially necessary\" meaning the average labor time required under prevailing technology and skill, not the actual time any particular worker happens to take — but he used it to ask a question Ricardo had mostly avoided: if commodities exchange in proportion to the labor embodied in them, and workers are paid the value of their labor, where does profit come from at all?\n\nMarx's answer turns on a distinction he considered his central original contribution: the difference between labor and labor-power. A worker does not sell her labor to a capitalist; she sells her labor-power — her capacity to work for a given period — and that capacity, like any other commodity, has a value determined by what it costs to reproduce it: the food, housing, and training needed to keep the worker (and her replacements, her children) alive and able to work. Under a working day of, say, ten hours, it might take only six hours of labor to produce enough value to cover that reproduction cost. The other four hours of labor the worker performs produce value that costs the capitalist nothing beyond the wage already paid; Marx called this surplus value, and its extraction — legally and voluntarily, through an ordinary wage contract, with no fraud required — is what he meant by exploitation. Profit, interest, and rent are, in this framework, surplus value in different institutional guises, all ultimately derived from unpaid labor time. This is the theoretical core of *Capital*, and it is why Marx thought capitalism was not a system of mutual benefit dressed up in unequal outcomes but a system whose ordinary, lawful operation required extracting more value from workers than it returned to them.\n\nThe theory ran into a technical problem that dogged it from the start and that Marx himself recognized in his unpublished manuscripts: if commodities exchange according to embodied labor, but different industries use very different ratios of labor to machinery and raw materials (what Marx called the organic composition of capital), then a uniform rate of profit across industries — which is what competitive markets in fact tend to produce — should be impossible unless labor-intensive industries earn systematically higher profit rates than capital-intensive ones, which they empirically do not. This is the \"transformation problem\": how to get from labor values to competitive prices without contradiction. Marx sketched a solution in the unfinished third volume of *Capital*, treating the equalization of profit rates as a redistribution of a fixed pool of surplus value across sectors via the price system, but generations of economists — sympathetic and hostile alike, from Ladislaus Bortkiewicz early in the twentieth century onward — have argued that Marx's own algebra does not actually balance, and that his proposed reconciliation between values and prices is internally inconsistent as stated. The debate over whether the transformation problem can be \"solved\" on Marx's own terms, and whether the labor theory of value is doing any necessary work once you have a workable price theory, has run continuously in specialist journals for more than a century and remains open among people who still think the question matters; most economists outside that specialist literature concluded decades ago that the labor theory of value is not needed to explain either prices or profit and quietly stopped using it, which is one reason \"Marxian economics\" and \"mainstream economics\" diverged into separate professional conversations rather than remaining a single argument inside one.\n\n## Historical materialism and the theory of crisis\n\nThe base/superstructure model, laid out most compactly in the 1859 preface to *A Contribution to the Critique of Political Economy*, holds that a society's \"mode of production\" — its technology and the property relations organized around it — forms an economic base that conditions, without mechanically determining, the legal, political, and ideological \"superstructure\" built on top of it: law, the state, religion, philosophy, art. History, on this account, moves through successive modes of production — primitive communism, slavery, feudalism, capitalism, and (Marx predicted) socialism/communism — each of which eventually generates internal contradictions between its productive forces and its property relations that force a transition to the next stage, usually through the political agency of the class whose interests the old relations now frustrate. This is the engine that makes Marxism a theory of historical inevitability rather than merely a moral critique of capitalism; it is also the part of Marx's system that has taken the heaviest empirical and philosophical battering, since twentieth-century history did not oblige by producing proletarian revolutions in the most industrially advanced countries (Britain, Germany, the United States) where Marx's own theory predicted them, and instead produced self-declared Marxist revolutions in overwhelmingly agrarian Russia and China, a discrepancy that later Marxists (Lenin among the first) had to theorize around rather than simply confirm.\n\nCrisis theory is where the value-theoretic apparatus and the historical-materialist frame meet. Marx's best-known specific mechanism is the tendency of the rate of profit to fall: as capitalists compete by substituting machinery for labor to cut costs (raising what he called the organic composition of capital), and since in his framework only labor creates new value, the same capital investment yields a shrinking rate of profit even as the total mass of profit may still grow. Marx did not present this as a smooth, uninterrupted decline; in the third volume of *Capital* he listed several \"counteracting factors\" — more intense exploitation of existing labor, driving wages below the value of labor-power, cheapening the machinery and raw materials that make up constant capital, a growing reserve army of the unemployed that disciplines wage demands, and cheaper inputs secured through foreign trade — that could offset or delay the tendency, sometimes for long stretches. But he argued the counteracting factors were themselves limited and that periodic crises — overproduction, credit collapse, mass unemployment — were how the contradiction between capitalism's drive to accumulate and its narrowing profitability periodically resolved itself, clearing out inefficient capital and resetting the cycle. This is a genuinely falling-rate-of-profit theory of crisis, distinct from later, non-Marxist business-cycle theories built on monetary mismanagement (the chapter on the Austrian school covers one) or on deficient aggregate demand (Keynes); whether it is empirically vindicated is contested even among Marxist economists, since measuring an economy-wide \"organic composition of capital\" and \"rate of profit\" from national accounts not designed for the purpose is itself a fraught exercise, and different researchers using different methods have found the postwar rate of profit falling, flat, or cyclical depending on assumptions.\n\nAlienation is the more humanistic register of the same diagnosis, developed earliest, in the unpublished 1844 *Economic and Philosophic Manuscripts* that only surfaced in 1932, decades after Marx's death, when the Soviet Union's Marx-Engels-Lenin Institute published them. Marx there argues that wage labor under capitalism estranges workers in four linked ways: from the product of their labor, which belongs to someone else the moment it is made; from the act of labor itself, which becomes forced and external rather than an expression of the worker's own purposes; from their fellow workers, set into competition with one another; and from their own human potential as creative, self-directing beings — their \"species-being.\" The concept gives Marx's economics a moral and psychological dimension that the drier value-theoretic apparatus of *Capital* lacks on its own, and it is the part of Marx most readily absorbed into non-economic disciplines — sociology, critical theory, psychology — independent of any judgment about the labor theory of value's technical soundness.\n\n## The fork: what Marx wrote, and what got built\n\nMarx wrote almost nothing about how a post-capitalist economy should actually be organized — a gap he treated as a virtue rather than an oversight, on the theory that detailed blueprints for the future were utopian speculation unworthy of a \"scientific\" socialism grounded in analysis of existing tendencies rather than moral wish-lists. The closest he came is the *Critique of the Gotha Programme*, a short 1875 polemic against a draft platform for the newly unifying German socialist party, which sketches a two-phase transition — a \"lower phase\" in which workers are compensated by labor-time vouchers rather than money, followed by a \"higher phase\" of full communism organized on the principle \"from each according to his ability, to each according to his needs\" — but even this is a few pages of programmatic sketching, not an institutional design. Marx said essentially nothing about how a planning authority would set investment priorities, allocate scarce inputs across competing uses, price intermediate goods, or determine what to produce in the near-total absence of the market signals he had spent three volumes analyzing as capitalism's actual coordination mechanism, however exploitative he considered it. This is the single largest gap between the theorist and the states that acted in his name, and it is not a minor technicality: it is the gap into which the entire socialist calculation debate falls.\n\nThat debate began in 1920, when Ludwig von Mises published \"Economic Calculation in the Socialist Commonwealth,\" arguing that a socialist economy without private ownership of the means of production would have no genuine market for capital goods and therefore no prices for them, and without prices for capital goods a planning board would have no way to compare the relative efficiency of different production methods — it could know what people wanted but not what it cost, in terms of alternative uses of scarce resources, to give it to them. Friedrich Hayek later restated and extended the argument on different grounds in \"The Use of Knowledge in Society\" (1945), contending that even a planning board with unlimited computational power would still fail, because the relevant economic knowledge — a machine's true wear, a manager's tacit sense of a local supply bottleneck, a consumer's changing taste — is irreducibly dispersed across millions of individuals and constantly changing, and only a decentralized price system driven by real transactions can aggregate it in usable form. Market socialists Oskar Lange and Abba Lerner replied in the 1930s that a planning board could simulate a market by announcing trial prices and adjusting them in response to observed shortages and surpluses, effectively running a planned economy on shadow prices; Mises and Hayek's followers considered this response to miss the point, since it presupposed that the relevant information about scarcity and preference could be centrally observed and processed at all, rather than generated by the very process of decentralized entrepreneurial risk-taking that a planning board, by construction, does not do. This argument is developed at length, from the Austrian side, in the chapter on the Austrian school; the relevant point here is that it was aimed squarely at the practical problem Marx himself declined to solve, not at the labor theory of value or the concept of surplus value as such — a socialist planning board could in principle be organized on entirely non-Marxian premises and would face the identical calculation problem.\n\n## The empirical record\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Great Leap Forward famine: scholarly death-toll estimates<\/div><svg viewBox=\"0 0 700 172\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">15<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">30<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">45<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"148\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"164\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">60<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">Lower bound of the scholar…<\/text><rect x=\"185\" y=\"8\" width=\"111.2\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"304.2\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">15 million<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">Yang Jisheng<\/text><rect x=\"185\" y=\"42\" width=\"267.0\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"460.0\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">36 million<\/text><text x=\"175\" y=\"92\" font-size=\"13\" text-anchor=\"end\">Frank Dikotter<\/text><rect x=\"185\" y=\"76\" width=\"333.8\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.10s\"/><text x=\"526.8\" y=\"92\" font-size=\"12.5\" class=\"t-muted\">45 million<\/text><text x=\"175\" y=\"126\" font-size=\"13\" text-anchor=\"end\">Upper bound of the scholar…<\/text><rect x=\"185\" y=\"110\" width=\"407.9\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.15s\"/><text x=\"600.9\" y=\"126\" font-size=\"12.5\" class=\"t-muted\">55 million<\/text><\/svg><figcaption>Estimates vary widely by method and archival access; the range itself is the honest finding, not any single figure. <span class=\"credit\">Source: Dikotter, Mao&#x27;s Great Famine; Yang Jisheng, Tombstone; survey of the wider historiographical range.<\/span><\/figcaption><\/figure>\n\n\n\nThe states that called themselves Marxist did not run economies designed on Marx's blueprint, because none existed; they improvised command economies under the doctrinal label \"Marxism-Leninism,\" a term formulated only after Lenin's death, during Stalin's consolidation of power in the late 1920s, and never used or sanctioned by Marx or, in that exact form, by Lenin either. What got built — first in the Soviet Union from 1928 under the First Five-Year Plan, later replicated with local variations in Maoist China, the Eastern Bloc, and elsewhere — was centralized state ownership of the means of production, output targets set by planning ministries rather than by market-clearing prices, and forced collectivization of agriculture. The human cost of the two largest instances is well documented and not seriously disputed in its broad magnitude, even though precise figures remain contested among historians. Soviet collectivization and the associated grain requisitioning produced a famine across the grain-growing regions of the USSR in 1932–33 that most modern historians attribute primarily to policy rather than to weather, killing somewhere in the range of 5.7 to 8.7 million people across the Soviet Union as a whole, with the Ukrainian famine (the Holodomor) accounting for the largest single share of that toll — the careful demographic reconstructions of the last decade put Ukrainian excess deaths at roughly 3.5 to 3.9 million, against older and more politically freighted estimates that ran as high as seven million and are no longer the scholarly mainstream; historians broadly agree that collectivization destroyed the incentive to produce a marketable surplus, since anything above bare subsistence was liable to be confiscated, and that this incentive collapse compounded the shortfall from bad harvests in 1931 and especially 1932. China's Great Leap Forward, Mao's 1958–1962 push to collectivize agriculture and force rapid industrialization through backyard steel production and inflated output reporting up the chain of command, produced a famine now estimated by most serious historians in the range of roughly 15 to 55 million excess deaths, with prominent specific estimates — Frank Dikötter's 45 million, Yang Jisheng's 36 million in his study *Tombstone* — clustering in the tens of millions; the range itself reflects genuine disagreement about methodology and what to count, not doubt that a policy-driven catastrophe on an enormous scale occurred. Both episodes are best understood as direct consequences of the calculation and incentive problems the Austrians had predicted in the abstract a decade or more earlier: planners set production targets without market prices to signal true scarcity or reward true productivity, local officials had every incentive to overstate output to please superiors rather than report shortfalls honestly, and the state's ability to compel farmers to hand over grain even amid starvation was a direct product of the same centralization of control that made planning possible in the first place.\n\nBeyond the acute famines, the chronic condition of centrally planned economies — shortages of consumer goods, queuing, informal \"second economies\" that emerged to route around official allocation, stagnating productivity growth relative to market economies — is best captured by the divided-Germany case, sometimes treated as close to a controlled experiment because it split one population, with a shared culture, language, and pre-1945 economic base, into a market economy and a planned one for four decades. By reunification in 1990, West German GDP per capita stood at roughly three times East Germany's, and East German labor productivity was estimated at well under half of the West German level; the gap has narrowed substantially since reunification but had not fully closed more than three decades later, with eastern productivity still running around three-quarters of western levels by the late 2010s. And alongside material shortage, the states built under Marx's name generated a durable inequality of their own, one the Yugoslav dissident and former high Communist Party official Milovan Djilas diagnosed from the inside in his 1957 book *The New Class*: state ownership of the means of production did not abolish a privileged class, it created a new one, made up of party functionaries, planners, and administrators — the nomenklatura, in Soviet terminology — who secured preferential housing, imported goods, foreign travel, and insulated consumption unavailable to the population in whose name they governed, effectively reconstituting the inequality Marx had indicted capitalism for producing, now organized around political rather than market position. This is the fact pattern behind the observation, made by critics across the political spectrum and conceded by many Marxist historians as well, that the practical outcome of twentieth-century Marxism-Leninism was rule by a new administrative elite rather than the classless society Marx had theorized as the end state of historical development — and it is a distinct question from whether Marx's economic analysis of capitalism was itself correct, even though popular argument routinely treats the two as the same claim.\n\n## The afterlife: Western Marxism, dependency theory, and the current academic address\n\nMarxism's most durable intellectual legacies outside the Soviet sphere ran less through economics departments than through social and political theory. \"Western Marxism,\" a loose label for a generation of European theorists writing after the disappointment of the failed post-1918 revolutions in the advanced industrial countries, shifted attention from the base to the superstructure — from Marx's economic mechanics to questions of culture, ideology, and consciousness. Georg Lukács's 1923 *History and Class Consciousness* diagnosed \"reification,\" the way capitalist social relations come to feel like natural facts rather than human arrangements; Antonio Gramsci, writing from Mussolini's prisons, developed the concept of cultural \"hegemony\" to explain why advanced capitalist societies had not produced the revolutions Marx expected, arguing that ruling-class dominance operated as much through the consent manufactured by civil society and culture as through coercion by the state; the Frankfurt School (Adorno, Horkheimer, Marcuse, and later Habermas), drawing on Lukács alongside Freud and Weber, built a \"critical theory\" that applied Marxist method to mass culture, authoritarianism, and psychology. None of this work is primarily economic analysis, and much of it is explicitly a retreat from the claim that economic contradiction alone would deliver revolution.\n\nDependency theory took the opposite tack, staying resolutely economic but relocating Marx's exploitation dynamic from the factory floor to the relationship between nations. Emerging out of the UN's Economic Commission for Latin America under Raúl Prebisch in 1950, and radicalized by Andre Gunder Frank's argument that the underdevelopment of poor countries was not a stage on the way to development but an actively produced condition — \"the development of underdevelopment,\" generated by wealthy \"core\" countries extracting surplus from a \"periphery\" — dependency theory fed directly into Immanuel Wallerstein's world-systems analysis in the 1970s, which generalized the core-periphery structure into a single integrated global division of labor. This lineage remains influential in development sociology and in strands of international-relations theory, though it has never displaced neoclassical trade and growth theory as the working framework inside multilateral lending institutions.\n\nInside academic economics proper, the discipline that once contained Marx as one voice among the classical political economists split cleanly, over the course of the twentieth century, into a mainstream that does not use the labor theory of value or surplus-value accounting at all, and a self-consciously \"heterodox\" minority that does. That minority has a real, if modest, institutional address: in the United States its best-known home is the economics department at the University of Massachusetts Amherst, which took what is often described as its \"heterodox turn\" in the 1970s by hiring a cohort of left economists including Samuel Bowles, and which today runs a doctoral program with an explicit political-economy track alongside the Political Economy Research Institute; its main English-language journal outlets include the Review of Radical Political Economics, published for the Union for Radical Political Economics since 1969, and the Cambridge Journal of Economics, both of which run Marxian scholarship alongside post-Keynesian, Sraffian, feminist, and institutionalist work under the broader \"heterodox economics\" umbrella. This is a live, peer-reviewed research community, not a museum piece, but it is a minority current inside the profession, structurally separate from the top-five-journal mainstream that trains the staff economists who go on to work at the Federal Reserve, the IMF, or a finance ministry; Marxian economics has essentially no institutional presence inside central banking or in the standard macroeconomic models used for interest-rate or fiscal-policy decisions in market economies, which is the clearest empirical marker of how far it sits from actual policymaking today, whatever its standing in academic debate.\n\nThe one place Marx's specific intuition about capital broke back into mainstream economic conversation at real scale was Thomas Piketty's 2013 *Capital in the Twenty-First Century*, whose title deliberately echoes Marx's and whose central empirical claim — that the return on capital has historically tended to exceed the overall growth rate of the economy (Piketty's shorthand \"r > g\"), concentrating wealth among capital owners over time unless disrupted by war, depression, or deliberate policy — restates in a different technical register the same worry that animated Marx's account of accumulation. Piketty himself, a social democrat, explicitly rejects the Marxist framework and the labor theory of value along with it, and his definition of \"capital\" (broadly, accumulated wealth of any kind, market-valued) differs sharply from Marx's, for whom capital was inseparably a social and political relation of control over production rather than a stock of value that happens to be owned. But the reception of Piketty's book — debated respectfully inside the mainstream profession, awarded serious attention by economists who would never cite *Capital* volume one — is the strongest evidence available that a Marx-adjacent concern about capital's tendency to concentrate wealth over time can command a mainstream hearing when it is repackaged in the empirical and mathematical idiom the profession now requires, even as the original apparatus that produced the concern remains outside the disciplinary mainstream.\n\n## Open Questions\n\nWhether the transformation problem admits of a solution on terms Marx himself would recognize, or whether the labor theory of value is simply dispensable machinery once a workable price theory exists, remains disputed within Marxian economics itself and is not close to settled even among specialists sympathetic to the project. Whether the tendency of the rate of profit to fall is empirically real at the level of a national or global economy, and whether it explains actual postwar recessions better than demand-side or monetary accounts of the business cycle, is an open empirical question turning heavily on measurement choices that different researchers make differently. Whether a planning economy that used modern computation and real-time data — a possibility increasingly discussed under labels like \"digital planning\" or \"Cybersyn\"-style proposals, after Salvador Allende's short-lived Chilean experiment — could overcome the Hayekian dispersed-knowledge objection in a way the twentieth-century planning economies could not is genuinely contested and cannot be resolved by appeal to the historical record alone, since no state has yet tried it at scale; the chapter on the Austrian school takes up this question from the other side. And whether the moral case against Marx's economics is strengthened or weakened by the historical record of the states built in his name is itself an open normative question rather than a factual one — reasonable historians agree on the scale of the Soviet and Chinese famines and on the analytical gap between Marx's texts and Leninist practice, while disagreeing sharply about how much responsibility a theorist bears for regimes that invoked his authority while ignoring his own explicit reluctance to prescribe a governing blueprint.\n\n## Sources\n\n- Marx, Karl. *Capital: A Critique of Political Economy*, Volume I (1867); Volumes II–III, ed. Friedrich Engels (1885, 1894). Marxists Internet Archive, marxists.org.\n- Marx, Karl and Friedrich Engels. *The German Ideology* (written 1845–46, published 1932); Marx, *Critique of the Gotha Programme* (1875); Marx, *Economic and Philosophic Manuscripts of 1844* (published 1932). Marxists Internet Archive, marxists.org.\n- Marx/Engels Biographical Archive, \"Karl Marx: Biographical Overview (until 1869),\" marxists.org, https://www.marxists.org/archive/marx/works/download/Biographies_of_Marx.pdf\n- \"The Young Hegelians and Karl Marx,\" Wikipedia (background aggregator; underlying claims cross-checked against the Marxists Internet Archive biographical materials above).\n- \"Transformation problem,\" Wikipedia overview of the technical debate, cross-referenced against: Steedman, Ian, and others summarized in the Marxian Transformation Problem literature; David Harvey, \"Marx's Refusal of the Labour Theory of Value,\" davidharvey.org, 2018, https://davidharvey.org/2018/03/marxs-refusal-of-the-labour-theory-of-value-by-david-harvey/ (a sympathetic Marxist geographer's own reassessment of the theory's limits).\n- \"Tendency of the rate of profit to fall,\" and Geoff Hodgson, \"The Theory of the Falling Rate of Profit,\" New Left Review I/84 (March–April 1974), https://newleftreview.org/issues/i84/articles/geoff-hodgson-the-theory-of-the-falling-rate-of-profit.pdf\n- Mises, Ludwig von. \"Economic Calculation in the Socialist Commonwealth\" (1920), and overview via the Mises Institute, mises.org; Hayek, Friedrich. \"The Use of Knowledge in Society,\" American Economic Review (1945), summarized via AIER, \"Mises and Hayek: Two Complementary Critiques of Central Planning,\" aier.org, https://aier.org/article/mises-and-hayek-two-complementary-critiques-of-central-planning/\n- \"Economic calculation problem\" and \"Socialist Calculation Debate,\" Libertarianism.org guide, https://www.libertarianism.org/topics/socialist-calculation-debate\n- Applebaum, Anne, and the broader historical consensus on Soviet collectivization famine mortality, summarized via VoxDev, \"Stalin's famine: The causes of the Holodomor,\" https://voxdev.org/topic/institutions-political-economy/stalins-famine, and \"Holodomor\" background aggregation cross-checked against that source and against the 2015 demographic reconstruction by the Ukrainian Institute of Demographic and Social Studies with the University of North Carolina at Chapel Hill for the 3.5–3.9 million Ukrainian excess-death range and the 5.7–8.7 million USSR-wide range.\n- Dikötter, Frank. *Mao's Great Famine* (2010), cited death toll of approximately 45 million; Yang Jisheng, *Tombstone: The Great Chinese Famine, 1958-1962* (translated edition, 2012), cited death toll of approximately 36 million; both figures as summarized via Facts and Details, \"Great Famine of Maoist-Era China: Maybe 45 Million Dead,\" https://factsanddetails.com/china/cat2/sub6/item2854.html\n- Djilas, Milovan. *The New Class: An Analysis of the Communist System* (1957), summarized via Wikipedia's article on the book and Encyclopedia.com, \"New Class,\" https://www.encyclopedia.com/social-sciences/applied-and-social-sciences-magazines/new-class\n- Pew Research Center, \"East Germany has narrowed economic gap with West Germany since fall of communism, but still lags,\" November 6, 2019, https://www.pewresearch.org/short-reads/2019/11/06/east-germany-has-narrowed-economic-gap-with-west-germany-since-fall-of-communism-but-still-lags/\n- Our World in Data, \"The two Germanies: Planning and capitalism – GDP per capita,\" https://ourworldindata.org/grapher/the-two-germanies-planning-and-capitalism\n- Lukács, Georg. *History and Class Consciousness* (1923); Gramsci, Antonio, *Prison Notebooks* (written 1929–35); overview via Routledge Encyclopedia of Philosophy, \"Marxism, Western,\" https://www.rep.routledge.com/articles/thematic/marxism-western/v-1\n- Prebisch, Raúl. *The Economic Development of Latin America and Its Principal Problems* (1950); Frank, Andre Gunder, on \"the development of underdevelopment\"; Wallerstein, Immanuel, world-systems theory (1970s onward); overview via Global South Studies, \"Latin American Dependency Theory,\" https://www.globalsouthstudies.org/keyword-essay/latin-american-dependency-theory/\n- Review of Radical Political Economics, journal history and scope, Union for Radical Political Economics (URPE), https://urpe.org/resource/radical-journals/ and SAGE Journals, https://journals.sagepub.com/home/RRP\n- Boston Globe, \"Socialists, look to economists at UMass Amherst for support,\" February 29, 2016, https://www.bostonglobe.com/business/2016/02/29/umass-economists-find-place-during-year-outsider/BoYaoXTDa2cIYJGLglCnKJ/story.html\n- Piketty, Thomas. *Capital in the Twenty-First Century* (Harvard University Press, 2014, English translation). Reception and comparison with Marx summarized via Dissent Magazine, \"Kapital for the Twenty-First Century?\", https://dissentmagazine.org/article/kapital-for-the-twenty-first-century/ and International Socialism, \"Piketty and Marx,\" https://isj.org.uk/piketty-and-marx/\n- \"Marxism-Leninism\" terminology and its post-Lenin, Stalin-era formulation, summarized via New World Encyclopedia, \"Marxism-Leninism,\" https://www.newworldencyclopedia.org/entry/Marxism-Leninism, cross-checked against standard historical accounts of the Stalinist codification of doctrine in the late 1920s–1930s."}, {"order": 3, "file": "03_List_And_National_School.md", "title": "Friedrich List and the German National/Historical School", "summary": "", "body": "# Friedrich List and the German National/Historical School\n\n## Bottom Line\n\nFriedrich List is the economist every industrial-policy government quietly reads and almost no free-trade government cites. His argument, stripped of nationalist varnish, is narrow and specific: a country trying to catch up to a more advanced industrial rival needs a period of deliberate protection to build manufacturing capacity — what he called \"productive power\" — before it can benefit from free exchange on equal terms with that rival. He did not think free trade was wrong in principle; he thought it was a policy that happened to suit whichever nation had already won the race, and that Britain's advocacy of universal free trade in the 1820s and 1830s was the argument of a champion who wanted to keep the field to itself. Every successful late industrializer since — the United States after List's own American teachers, Germany after List, Japan, South Korea, Taiwan, and arguably China — followed some version of his sequence: protect, build, then open. Every failed one — much of import-substituting Latin America, several African economies in the 1960s-80s — followed the same rhetoric without the discipline List actually specified, and protection became a permanent subsidy to inefficiency and political clients rather than a scaffold that came down once the building was finished. The 2020s revival of industrial policy in Washington, Brussels, and Beijing gestures at List's name more than it follows his design; the CHIPS Act and the Inflation Reduction Act look less like List's disciplined infant-industry sequencing and more like the very rent-distribution he did not anticipate, dressed in his vocabulary. List's ghost is invoked far more often than it is actually obeyed.\n\n## Formation in Exile: How an American Prison Sentence Made a German Economist\n\nFriedrich List was born on August 6, 1789, in Reutlingen, a free imperial city in Württemberg, the son of a tanner who wanted him in the family trade. He instead went into the Württemberg civil service, rose to under-secretary in the ministry of finance by 1816, and in 1817 was appointed to a newly created chair of administration and politics at the University of Tübingen — a rapid ascent for a man not yet thirty ([Encyclopedia.com](https://www.encyclopedia.com/people/social-sciences-and-law/economics-biographies/friedrich-list); [History of Economic Thought website](https://www.hetwebsite.net/het/profiles/list.htm)). The fall of the ministry that had backed him cost him the post in 1819, and List moved into agitation: he became secretary of a league of German merchants and manufacturers pushing for the abolition of the internal tariffs that still fragmented German trade into three dozen or more separate customs zones. That advocacy work, combined with a stint as an elected member of the Württemberg legislature where he attacked entrenched bureaucratic privilege, got him prosecuted for sedition. He was sentenced to ten months of fortress imprisonment, fled briefly to France and England, returned to serve part of the sentence, and secured early release only on condition that he emigrate.\n\nHe arrived in the United States in 1825 and stayed until 1832. This is the hinge of List's intellectual life, and it is worth being precise about what happened there rather than treating it as an incidental biographical detail. List did not arrive with a developed theory of national economics; he arrived a free-trade liberal of the Smithian type, as most educated German reformers of his generation were. In Pennsylvania he fell in with the circle of American protectionist economists and publicists — most importantly the tradition running from Alexander Hamilton's 1791 *Report on Manufactures* through the \"American System\" economists of the 1820s, figures like Daniel Raymond and Mathew Carey, and the political program associated with Henry Clay ([americansystemnow.com](https://americansystemnow.com/friedrich-list/); [FEE, \"The Intellectual Foundations of Protectionism\"](https://fee.org/articles/the-intellectual-foundations-of-protectionism/)). He farmed briefly, ran a newspaper for German-American readers, and — the detail that mattered most for his later fortune, though not his theory — acquired land that turned out to sit on coal, which gave him a degree of financial independence he would need later. He also built a modest fortune and connections building one of America's earliest railroads, giving him a hands-on sense of what infrastructure investment did to a regional economy that no amount of reading Adam Smith in a Tübingen library could have supplied.\n\nWhat List absorbed in America was not really original American theory so much as it was the underlying claim that a still-agrarian country facing a manufacturing power with a head start needed the state's help to build its own manufacturing sector, and that this was not a departure from sound economics but a different economics suited to a different stage of development. He returned to Europe in 1832, worked for some years as an American consular official (a job that let him stay financially afloat while he wrote), and spent the 1830s and early 1840s turning what had been an American policy argument into a general theory, publishing *Das nationale System der politischen Oekonomie* — *The National System of Political Economy* — in 1841. He never fully recovered financially or in health from the pressures of that decade of advocacy and disappointment; he lost much of his American property in the financial panics of the era, his health failed, and he took his own life on November 30, 1846, a few years before the Zollverein he had championed reached its full extent and decades before Bismarck's Germany would industrialize along broadly the lines he had urged ([Encyclopedia.com](https://www.encyclopedia.com/people/social-sciences-and-law/economics-biographies/friedrich-list)). It is one of the harder ironies in the history of economic thought that the man most associated with German industrial nationalism died feeling like a failure, in a Germany still divided into dozens of tariff zones, a full generation before unification vindicated the policies he had spent his life urging.\n\n## The National System: Productive Powers Against Exchange Value\n\nList's core theoretical move in *The National System* is a redefinition of what economics is supposed to explain. Classical political economy from Smith through Ricardo — covered in the chapter on classical foundations — is fundamentally a theory of *value*: what determines the price of a good, how gains from trade get divided, how resources get allocated efficiently given existing endowments. List did not dispute the internal logic of that theory so much as he denied that it was the right question for a nation still building its industrial base. His question was not \"how do we maximize the value of goods exchanged today,\" but \"how do we build the capacity to produce more, and more valuable, goods tomorrow.\" He called this capacity a nation's \"productive powers,\" and he argued — this is the theoretical center of the book — that the power to create wealth is more important than wealth itself, in the same way that the capacity of a tree to bear fruit matters more than any single season's harvest.\n\nFrom this follows List's central heresy against Smithian orthodoxy: a policy that reduces a nation's wealth today (a tariff that raises the price of imported manufactured goods, forcing consumers and downstream producers to pay more) can still be rational if it builds productive powers that will generate far more wealth in the future once domestic industry matures. This is the formal version of the \"infant industry\" argument, and List is usually credited as its most systematic early theorist in Europe — though the search evidence here is honest and unflattering to a purely List-centered story: the argument's first systematic statements actually came from American writers, chiefly Hamilton and Daniel Raymond, whom List encountered directly during his American years and then re-exported to a European audience with far greater theoretical elaboration ([Ha-Joon Chang, cited via research on \"Kicking Away the Ladder\"](https://www.concertedaction.com/2017/01/19/ha-joon-changs-kicking-away-the-ladder-theory/)). List's real contribution was not inventing the infant-industry logic but systematizing it into a general theory of national economic development with a supporting stages-of-growth framework, and giving it a name and an institutional program serious enough that a fragmented Germany could organize a customs union and, eventually, a national economic policy around it.\n\nList's stages theory divided national economic development into a rough sequence — a pastoral/agricultural stage, an agricultural-manufacturing stage, and a mature agricultural-manufacturing-commercial stage — and argued that the right trade policy differs by stage. A purely agricultural nation gains from free trade with more advanced partners, since it has no manufacturing sector to protect and benefits from cheap manufactured imports. A nation with a nascent manufacturing sector capable of eventually competing, but not yet able to, needs tariff protection to let that sector grow to competitive scale, shielded from a more efficient foreign producer that would otherwise crush it in the cradle. A mature industrial nation, having built its productive powers, then benefits from free trade like everyone else — trading its efficiency for the efficiency of others. Britain, on List's telling, occupied that third position by the 1820s and 1830s, having built its manufacturing base behind centuries of Navigation Acts, colonial preference systems, and tariffs, and was now — having climbed the ladder — the world's leading and loudest advocate of universal free trade, a policy that, conveniently, would have kept every rising manufacturing competitor from ever reaching the top.\n\nThis is the origin of the idea now known by Ha-Joon Chang's phrase \"kicking away the ladder\": that a country that has attained a position of economic strength through protection and state support then has every incentive to preach free trade to everyone still climbing, denying them the very tools it used itself. It is worth being precise about attribution here, since this document should credit List's actual insight rather than launder a later economist's branding back onto him. List himself used the image and made the substantive argument — that Britain's free-trade evangelism was self-interested rather than universal wisdom — in the 1840s; the specific phrase \"kicking away the ladder\" as the title and organizing metaphor of the modern argument comes from Ha-Joon Chang's 2002 book of that name, which explicitly borrows and extends List's framing as its central device ([Wikipedia summary corroborated by multiple sources including dustysojourner.wordpress.com and concertedaction.com](https://dustysojourner.wordpress.com/2010/09/18/friedrich-list-kicking-away-the-ladder/); [Chang, *Kicking Away the Ladder: Development Strategy in Historical Perspective*, Anthem Press, 2002](https://www.researchgate.net/publication/280189343_Kicking_away_the_Ladder_Development_Strategy_in_Historical_Perspective_20053H-J_Chang_Kicking_away_the_Ladder_Development_Strategy_in_Historical_Perspective_London_Anthem_Press_2002)). So the insight is List's; the durable slogan is Chang's, built to carry List's argument into late-twentieth-century development debates about the WTO, structural adjustment, and the conditions rich countries imposed on poor ones.\n\nIt is also worth stating plainly what List did not argue, because his legacy gets stretched by both nationalist admirers and free-trade critics into something cruder than the original text. List was not a permanent protectionist and not an autarkist. His stages framework has an exit: protection is a developmental tool for a specific window, not a philosophy of national self-sufficiency for its own sake, and he expected — indeed wanted — nations to graduate into free trade once their productive powers matured. He also was not indifferent to consumer cost; he simply argued that near-term consumer cost was the price of long-term national capacity, a trade-off he thought classical economists systematically undervalued because their theory had no language for capacity-building, only for allocation of what already existed. Later nationalist and autarkic movements — including, most damagingly for his reputation, German economic nationalism under the Nazi regime, which cited List selectively as intellectual cover for programs of self-sufficiency (*Autarkie*) that List's own text does not actually endorse as a permanent state — used his name for a far harder-edged and more permanent version of protection than he had proposed. This gap between List's actual, bounded, developmental argument and the uses later nationalists made of his name is one of the more consequential cases of a economist's legacy being hijacked by movements with harder politics than his own.\n\n## The Zollverein: List as Political Operator, Not Just Theorist\n\nList's importance is not confined to the seminar room; he was also a working political organizer, and this is a part of his career that gets underplayed when he is treated purely as a theorist. The German Customs Union — the Zollverein — was formed in 1834, uniting a number of German states, chiefly under Prussian leadership, into a common tariff territory that abolished internal customs duties among members while presenting a unified external tariff to the rest of the world ([Encyclopedia.com, \"Zollverein\"](https://www.encyclopedia.com/history/modern-europe/german-history/zollverein)). List had campaigned for exactly this kind of arrangement since his years as a merchants'-league secretary in the early 1820s, well before he went to America, and his American exile sharpened and systematized the argument he brought back to the campaign. The scholarly account of the Zollverein's formation credits a mix of factors — Prussian fiscal interest, the smaller states' desire to escape a maze of transit duties, and pressure generated in part by British trade competition ([Cambridge Journal of Economic History, \"How Britain Unified Germany\"](https://www.cambridge.org/core/journals/journal-of-economic-history/article/how-britain-unified-germany-trade-routes-and-the-formation-of-the-zollverein/C792A2C396A5689B2E85CC5A7730617C)) — and List's own influence on the union's founding should be read as one advocate's contribution to a movement with multiple sponsors and interests, not as a project he single-handedly authored. But List was its most articulate public champion, and once it existed he treated it as the practical embodiment of his theory: a market large enough to let German manufacturing achieve the scale it needed, protected at the perimeter, integrated internally.\n\nList paired the Zollverein argument with an equally passionate campaign for German railway construction, describing the customs union and the railway network as the \"Siamese twins\" of German economic modernization — market integration and physical integration reinforcing each other, since a common tariff territory is not economically meaningful if goods cannot actually move across it quickly and cheaply ([search synthesis of multiple sources on the Zollverein and railways]). He wrote extensively in the 1830s promoting a national railway system for Germany years before such a system existed, treating infrastructure investment as a form of nation-building infrastructure that private capital alone, fragmented across dozens of small states, would underprovide. This is a distinctly modern-sounding argument — that transport and communications infrastructure is a public good with externalities that justify state coordination even for economists otherwise committed to private enterprise — and it is part of why twentieth-century development economists and industrial-policy planners read List not just for the tariff argument but for a broader theory of state-coordinated infrastructure-building.\n\n## The Wider German Historical School and the Methodenstreit\n\nList is usually treated as a forerunner of, rather than a full member of, the German Historical School proper, which crystallized as an academic movement a generation after his death, led by figures like Wilhelm Roscher, Bruno Hildebrand, Karl Knies in the \"older\" historical school and, most importantly for what follows, Gustav Schmoller leading the \"younger\" historical school from the 1870s through the early twentieth century. What List and the Historical School share is a rejection of the claim that economics is a single body of universal, ahistorical laws deducible from a few axioms about self-interested behavior — the claim implicit in classical political economy and made explicit and rigorous by the Austrian marginalists. The Historical School instead argued that economic behavior and institutions are deeply conditioned by national history, culture, and stage of development, and that economic knowledge has to be built inductively, out of detailed empirical and historical study of particular economies, rather than deduced from abstract first principles applicable everywhere.\n\nThat methodological argument came to open war in the 1880s in what is now called the Methodenstreit — the \"battle of methods\" — between Schmoller, leading the Historical School from a position of considerable institutional power in German universities and the Prussian civil service, and Carl Menger, the founder of the Austrian School, whose 1871 *Principles of Economics* had launched marginalist economics as a rigorous deductive alternative to both classical and historical approaches. The conflict became explicit when Schmoller reviewed Menger's 1883 methodological treatise dismissively in the Historical School's own journal, and Menger responded with a polemical pamphlet attacking the historicists directly ([Cambridge Core, \"Marginalism and Scope in the Early Methodenstreit\"](https://www.cambridge.org/core/journals/journal-of-the-history-of-economic-thought/article/marginalism-and-scope-in-the-early-methodenstreit/C30DCFFAA072F6B22375B7DCFBCF9476); [Wikipedia-corroborated summary of the Methodenstreit via multiple secondary sources](https://en.wikipedia.org/wiki/Methodenstreit)). The core of the disagreement was genuinely deep and not just professional rivalry dressed up as theory: Menger held that economic laws — diminishing marginal utility, the logic of exchange, price formation — were universal, applying to any human being anywhere making choices under scarcity, and that Schmoller's insistence on exhaustive historical description before any theorizing amounted to abandoning economics as a science in favor of accumulating undigested facts. Schmoller held that Menger's universal laws disregarded genuine, load-bearing differences between national economic traditions and institutional settings, and that a theory built for an idealized abstract economic actor could not responsibly guide policy for an actual national economy embedded in its own history, law, and social structure.\n\nSchmoller had the institutional upper hand for decades: as the dominant figure in German academic economics and an advisor to the Prussian and then imperial German state, he shaped how an entire generation of German economists were trained, favoring detailed empirical and historical monographs over theoretical model-building, and steering economics toward what would later be recognized as a precursor to institutional economics and public-policy-oriented social science. As the chapter on the Austrian School covers from the other side, Menger's deductive, subjective-value approach lost the immediate institutional battle in Germany but proved to be the intellectual seed that grew into twentieth-century Austrian economics via Böhm-Bawerk, Mises, and Hayek, eventually becoming one of the most durable rivals to Keynesian and neoclassical mainstream economics. The practical stakes of the Methodenstreit were real, not just academic: German economic policy through unification, into Bismarck's welfare-state innovations, and into the Weimar and early Nazi periods was shaped by an economics profession trained in the historicist, state-oriented, empirically-inductive tradition that Schmoller built, a tradition considerably more comfortable with tariffs, cartels, social insurance, and state coordination of the economy than the classical liberal or Austrian traditions were.\n\n## From Gerschenkron to the Developmental State: The Direct Twentieth-Century Lineage\n\nThe most consequential afterlife of List's argument runs through the field that would come to be called development economics, and the single most important transmission node is Alexander Gerschenkron, a Harvard economic historian writing chiefly in the 1950s and 1960s. Gerschenkron's 1962 collection *Economic Backwardness in Historical Perspective* argued, against a then-dominant assumption that all industrializing economies would follow something like Britain's original path, that the *degree* of a country's relative backwardness at the moment it began industrializing systematically shaped how it industrialized: the more backward the starting point relative to the leading economies, the more a country's industrialization would rely on large-scale enterprise, capital-goods production over consumer goods, and — crucially — special institutions, particularly investment banks or the state itself, to mobilize and direct capital that private markets in a backward economy could not organize on their own ([Harvard University Press description of *Economic Backwardness in Historical Perspective*](https://www.hup.harvard.edu/catalog.php?isbn=9780674226005); [Journal of Economic History summary of Gerschenkron's model](https://www.cambridge.org/core/journals/journal-of-economic-history/article/abs/economic-backwardness-and-the-characteristics-of-development/49A8AE93A7BB8D5B8C140712128519D5)). Gerschenkron was writing about nineteenth-century Germany and Russia specifically, and his account of Germany's industrialization — bank-led, state-coordinated, tariff-protected, catching up to Britain by substituting institutions for the preconditions Britain had accumulated organically — is, in substance, a rigorous empirical elaboration of exactly the argument List had made a century earlier from intuition and advocacy rather than systematic economic history. Gerschenkron rarely gets described as a List disciple in a narrow sense, and it would overstate the case to call his work simply an application of List's theory — Gerschenkron was engaging with a distinct academic literature on stages of growth and was skeptical of universal-stages theorizing of the Walt Rostow type — but the family resemblance between \"backwardness\" as a condition demanding special institutional substitutes and List's \"productive powers\" doctrine is close enough that historians of development economics routinely treat List as Gerschenkron's most important nineteenth-century forerunner.\n\nThe line from there to the East Asian developmental state is well documented and, unlike some claimed List lineages, genuinely direct in the sense that the actors involved knew the intellectual tradition they were drawing on. Chalmers Johnson's 1982 book *MITI and the Japanese Miracle* put the term \"developmental state\" into general circulation — the phrase had drifted through the literature before him, but it is his book that made it a category — to describe how Japan's Ministry of International Trade and Industry directed the postwar Japanese economy's rapid industrialization through licensing, credit allocation, technology transfer coordination, and selective protection of targeted sectors, and Johnson traced the intellectual pedigree of that approach directly back through the German economic nationalism of List and the Hamiltonian protectionism behind it ([search synthesis; Springer Nature chapter on developmental-state literature](https://link.springer.com/chapter/10.1007/978-981-99-0285-9_1); [Grokipedia summary of the developmental-state concept and its List roots](https://grokipedia.com/page/Developmental_state)). Johnson's framework was then extended by a second generation of scholars — Alice Amsden on South Korea, Robert Wade on Taiwan, and others — to describe pilot planning agencies analogous to MITI across the region: South Korea's Economic Planning Board under Park Chung-hee's government from the early 1960s, which combined export promotion with directed credit to favored conglomerates (the chaebol) and protection for targeted heavy industries; and Taiwan's Council for Economic Planning and Development, which pursued a broadly similar strategy with a somewhat different balance between state-owned enterprise and small-and-medium private firms. All three cases combine List's core sequence — protect and subsidize a targeted sector while it builds scale and competence, push it toward export markets once competitive, and treat trade policy as an instrument of national capacity-building rather than of static efficiency — with institutional tools (five-year plans, directed bank lending, export targets tied to continued state support) that go well beyond anything List specified but clearly operate in his conceptual frame.\n\nIt is worth being honest about where this lineage gets murkier. Not every element of the East Asian developmental-state playbook traces cleanly to List; much of it reflects Cold War geopolitics (American tolerance, even active support, for protectionist industrial policy in frontline anti-communist states that would not have been tolerated in a purely economic calculus), Japanese colonial-era institutional legacies in Korea and Taiwan, and genuinely novel institutional inventions — export-performance discipline that forced protected firms to prove themselves in foreign markets rather than settling into permanent protection — that List's own text does not anticipate and that later scholars, including Amsden, treat as the actual secret of East Asian success relative to failed Latin American import substitution. The distinction between \"protection with an exit test\" (East Asia) and \"protection without one\" (much of postwar Latin America and Africa) is arguably more explanatory than List's name is, even though List's framework supplies the underlying logic for why protection might work at all.\n\n## Ha-Joon Chang and the Explicit Twenty-First-Century Revival\n\nHa-Joon Chang, a Cambridge-trained development economist, is the most direct and self-conscious modern revivalist of List specifically, as opposed to economists who arrived at similar conclusions independently through development economics or economic history. Chang's 2002 *Kicking Away the Ladder: Development Strategy in Historical Perspective* is explicitly built around List's metaphor and argument, extending it into a systematic historical claim that essentially every currently rich country — Britain, the United States, Germany, France, Japan, South Korea — used tariffs, subsidies, and other forms of infant-industry protection during its own catch-up phase, and that the free-trade and free-market conditions later imposed on developing countries by rich-country governments and by institutions like the IMF and World Bank through structural-adjustment lending amount to denying poor countries the tools the rich countries themselves relied on ([Concerted Action summary of Chang's argument](https://www.concertedaction.com/2017/01/19/ha-joon-changs-kicking-away-the-ladder-theory/); [Goodreads/publisher description of the book](https://www.goodreads.com/book/show/187808.Kicking_Away_the_Ladder)). Chang's subsequent work, including *Bad Samaritans* (2007) and a stream of commentary through the 2010s and 2020s, has kept List's name and framework in active circulation in development-policy debates in a way that most nineteenth-century economists do not enjoy; List is probably more actively cited by name in live 2020s policy argument than any figure treated in these pages outside Smith, Marx, and Keynes.\n\nChang's revival is also where the register of this argument shifts from academic history to live political advocacy, and where the costs List himself acknowledged tend to get soft-pedaled. Chang is candid that protection has efficiency costs and that rich-country protectionist histories are not spotless success stories, but the polemical use of \"kicking away the ladder\" in political debate — at the WTO, in aid-conditionality fights, in trade-negotiation rhetoric from developing-country governments — tends to flatten List's actually bounded, stage-limited argument into a simpler claim that protection is good and free trade is a rich-country trick, which is closer to a nationalist reading of List than to List's own text. This is worth flagging plainly: the popularizers of List's insight, sympathetic as their underlying case may be, have sometimes done to his argument what the nineteenth-century German nationalists did — stripped out the stages-and-exit qualification that made the original theory more defensible than the slogan it produces.\n\n## The 2020s Industrial-Policy Revival: List's Ghost, or Convergent Reinvention?\n\nBy the mid-2020s, industrial policy — a phrase that was close to disqualifying in mainstream American and European policy circles for the four decades of the neoliberal consensus covered in the chapter on monetarism and the Chicago School — had become respectable again across a remarkably wide political spectrum. The United States' 2022 CHIPS and Science Act committed roughly $280 billion over a decade, including direct subsidies aimed at reducing American dependence on foreign, especially Taiwanese, semiconductor manufacturing, and the Inflation Reduction Act layered on large tax credits and subsidies explicitly conditioned on domestic content and domestic manufacturing location for clean-energy technology ([Atlantic Council on IRA/CHIPS manufacturing effects](https://www.atlanticcouncil.org/blogs/econographics/the-ira-and-chips-act-are-supercharging-us-manufacturing-construction/); [Boston Fed analysis of manufacturing gains](https://www.bostonfed.org/publications/current-policy-perspectives/2024/manufacturing-gains-from-green-energy-and-semiconductor-spending.aspx)). In the European Union, Mario Draghi's September 2024 report on European competitiveness explicitly called for an active sectoral industrial policy and hundreds of specific reforms, feeding into the European Commission's 2025 \"Competitiveness Compass\" and a \"Clean Industrial Deal\" pairing decarbonization with re-industrialization ([European Commission summary of the Draghi report](https://commission.europa.eu/topics/competitiveness/draghi-report_en); [Bruegel analysis of Draghi's industrial masterplan](https://www.bruegel.org/first-glance/draghis-industrial-masterplan-has-decarbonisation-its-core)). And China's \"Made in China 2025\" program, launched in 2015 and still shaping policy through the 2020s, combined roughly 800 state-guided investment funds worth an estimated 2.2 trillion yuan, forced technology-transfer requirements, targeted procurement, and direct semiconductor investment exceeding $150 billion through its National IC Fund, aimed at reducing dependence on foreign technology across a list of strategic sectors ([U.S.-China Economic and Security Review Commission report on Made in China 2025](https://www.uscc.gov/sites/default/files/2025-11/Made_in_China_2025--Evaluating_Chinas_Performance.pdf); [Rhodium Group assessment](https://rhg.com/research/was-made-in-china-2025-successful/)).\n\nThe honest answer to whether List's actual theory is driving this revival, or whether his name is being invoked as after-the-fact intellectual cover for policies decided on other grounds, is mixed, and the mix looks different in each jurisdiction. Dani Rodrik — a Harvard economist and probably the most influential living academic advocate for industrial policy — published, with Réka Juhász and Nathan Lane, \"The New Economics of Industrial Policy\" in 2024, arguing that the theoretical case for industrial policy (correcting for market failures like knowledge spillovers and coordination problems that leave promising sectors under-invested by private markets alone) is broad and defensible, and that the recent empirical literature on industrial policy is far more rigorous than the largely correlational studies of the 1980s and 1990s that had discredited the field ([Rodrik, Juhász, and Lane, \"The New Economics of Industrial Policy,\" NBER Working Paper 31538, and Annual Review of Economics 2024](https://www.nber.org/papers/w31538); [RIETI summary](https://www.rieti.go.jp/en/special/p_a_w/203.html)). Rodrik's framing is explicitly List-adjacent in spirit — market-failure correction to build capacity a market alone would underinvest in — but Rodrik's own emphasis on informational shortcomings (governments genuinely not knowing which sectors deserve support) and political capture as the live risks, rather than the abstract case for intervention, is a more cautious and mechanism-specific argument than List's productive-powers doctrine, closer to a modern welfare-economics justification bolted onto List's older intuition than a direct restatement of it.\n\nThe CHIPS Act and IRA look, on close reading, less like a disciplined List-style sequence — protect a targeted sector for a defined developmental window, subject it to an exit test, withdraw support once it is competitive — and more like a grab bag of subsidies distributed partly on economic logic and partly on political logic, a criticism made pointedly from the center-left as well as the free-market right: analysts at the Council on Foreign Relations have argued the CHIPS and IRA subsidy programs \"resemble industrial policy of the past — a grab bag that delivers political rents to specific allies\" rather than a List-style time-limited developmental ladder ([Council on Foreign Relations, \"The Curse of Nostalgia: Industrial Policy in the United States\"](https://www.cfr.org/articles/curse-nostalgia-industrial-policy-united-states)). The Institute for New Economic Thinking has made a related, if less pointed, version of the same critique, faulting the CHIPS Act's diffuse allocation across many small projects as better suited to \"the American system of log-rolling, coalition building\" than to a disciplined developmental sequence ([Institute for New Economic Thinking commentary](https://www.ineteconomics.org/perspectives/blog/industrial-policy-is-a-good-idea-but-so-far-we-dont-have-one)). Whether the roughly 115,000 semiconductor-sector jobs CHIPS funding is projected to help create justifies the scale of subsidy, and whether the resulting fabs will actually operate competitively once subsidies taper, remain open and contested questions rather than settled successes, and skeptics have specifically challenged whether the jobs and onshoring numbers justify the fiscal cost.\n\nChina's Made in China 2025 program is, if anything, the case that most resembles List's actual sequence in form — sustained state-directed capital allocation into targeted sectors, explicit stage-based ambitions (self-sufficiency targets for defined years), and an openly stated goal of catching up to and eventually surpassing more advanced economies — while also being the case where independent assessment finds the most mixed results: it fell short of its own stated technological self-sufficiency targets in semiconductors, aerospace, and advanced manufacturing equipment even as it achieved striking success in others (batteries, solar panels, electric vehicles), and it provoked a wave of trade restrictions and supply-chain diversification from trading partners specifically in reaction to the subsidy and forced-technology-transfer tools it relied on ([U.S.-China Economic and Security Review Commission](https://www.uscc.gov/sites/default/files/2025-11/Made_in_China_2025--Evaluating_Chinas_Performance.pdf); [Rhodium Group, \"China's Next-Generation Industrial Policy\"](https://rhg.com/research/chinas-next-generation-industrial-policy/)). That mixed record is itself very List-like in an unflattering way List's admirers rarely emphasize: even a state genuinely committed to his sequence, with enormous administrative capacity and financial resources, gets the sector-picking wrong often enough that the aggregate record looks like a portfolio of successes and expensive failures rather than a guaranteed formula.\n\nThe fairest overall judgment is that List's ghost is a real but partial presence in the 2020s revival: his underlying logic — that catch-up industrialization sometimes requires state-supported capacity-building that a pure free-trade regime would not produce — is genuinely operative in how Rodrik, Chang, and a wide range of current policymakers think about the problem, and his name is invoked with unusual frequency and specificity for a nineteenth-century economist. But the actual policy instruments in Washington, Brussels, and Beijing owe at least as much to Gerschenkron's institutional-substitution framework, to Cold War and now great-power-competition geopolitics that have nothing to do with List's stages theory, and to garden-variety interest-group politics that List's developmental logic does not predict or endorse. Treating List as the sole or primary intellectual author of the 2020s industrial-policy turn overclaims; treating him as one of several converging intellectual ancestors, and easily the most quotable one, is the more defensible reading.\n\n## The Standing Counter-Case: Efficiency Losses, Capture, and Survivorship Bias\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 350\" role=\"img\" aria-label=\"List's prescribed developmental sequence against what industrial policy usually does in practice. The prescribed sequence runs protect, build capacity, expose to competition, then withdraw protection. In practice the fourth step is rarely reached: protection acquires a constituency and persists. East Asian cases reached the exit; Latin American import substitution did not.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" letter-spacing=\"2.5\">THE LADDER, AND THE MISSING RUNG<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">List's sequence depends entirely on a step almost nobody takes<\/text>\n<text x=\"40\" y=\"82\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">PRESCRIBED<\/text>\n<rect x=\"40\" y=\"94\" width=\"132\" height=\"52\" rx=\"2\" class=\"f-t4\" opacity=\".9\"/>\n<text x=\"106\" y=\"118\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\" font-weight=\"bold\">1 · Protect<\/text>\n<text x=\"106\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">tariff the infant industry<\/text>\n<path d=\"M176,120 L196,120\" class=\"s-t4\" stroke-width=\"2\"/>\n<polygon points=\"192,115 204,120 192,125\" class=\"f-t4\"/>\n<rect x=\"208\" y=\"94\" width=\"132\" height=\"52\" rx=\"2\" class=\"f-t4\" opacity=\".9\"/>\n<text x=\"274\" y=\"118\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\" font-weight=\"bold\">2 · Build<\/text>\n<text x=\"274\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">productive powers<\/text>\n<path d=\"M344,120 L364,120\" class=\"s-t4\" stroke-width=\"2\"/>\n<polygon points=\"360,115 372,120 360,125\" class=\"f-t4\"/>\n<rect x=\"376\" y=\"94\" width=\"132\" height=\"52\" rx=\"2\" class=\"f-t4\" opacity=\".9\"/>\n<text x=\"442\" y=\"118\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\" font-weight=\"bold\">3 · Expose<\/text>\n<text x=\"442\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">meet real competition<\/text>\n<path d=\"M512,120 L532,120\" class=\"s-t2\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n<polygon points=\"528,115 540,120 528,125\" class=\"f-t2\"/>\n<rect x=\"544\" y=\"94\" width=\"132\" height=\"52\" rx=\"2\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\"/>\n<text x=\"610\" y=\"118\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">4 · Withdraw<\/text>\n<text x=\"610\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" class=\"t-acc\">let protection lapse<\/text>\n<text x=\"610\" y=\"164\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">the rung that decides<\/text>\n<text x=\"610\" y=\"176\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">whether it was a ladder<\/text>\n<line x1=\"40\" y1=\"200\" x2=\"660\" y2=\"200\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"40\" y=\"228\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">IN PRACTICE<\/text>\n<rect x=\"40\" y=\"240\" width=\"300\" height=\"46\" rx=\"2\" class=\"f-t4\" opacity=\".9\"/>\n<text x=\"190\" y=\"260\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\" font-weight=\"bold\">Reached the exit<\/text>\n<text x=\"190\" y=\"276\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">Japan, South Korea, Taiwan — protection ended<\/text>\n<rect x=\"360\" y=\"240\" width=\"300\" height=\"46\" rx=\"2\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"510\" y=\"260\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\" font-weight=\"bold\">Never reached it<\/text>\n<text x=\"510\" y=\"276\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">Latin American import substitution — protection stayed<\/text>\n<text x=\"350\" y=\"316\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\" font-style=\"italic\">The success stories are the cases with an exit. They are also the cases most often counted.<\/text>\n<text x=\"350\" y=\"334\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">Judging the doctrine by them alone is the survivorship problem its critics press hardest.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> List's argument is a sequence, and its whole force rests on a fourth step almost no political system performs: letting protection lapse once it has built a constituency. The East Asian cases usually cited in the doctrine's favour are precisely the ones that reached that rung — which is why counting only them tells you less about industrial policy than it appears to.<\/figcaption>\n<\/figure>\n\n\nList's framework has never lacked serious critics, and the honest version of this chapter has to give those critics their due rather than treating the East Asian success stories as the last word. The static efficiency case against protection is the oldest and most basic: tariffs and subsidies raise prices for domestic consumers and downstream producers, misallocate capital toward politically favored sectors rather than economically optimal ones, and — because the true cost of protection is diffuse (spread across all consumers) while the benefit is concentrated (captured by protected producers) — create a structural political bias toward protection persisting long after any developmental rationale has expired. This is not a hypothetical: it is the empirically documented pattern in Latin American import-substitution industrialization from the 1940s through the 1970s, where tariff protection for domestic manufacturing, especially in larger economies like Brazil and Argentina, produced firms that never achieved international competitiveness, that lobbied successfully to keep protection permanent rather than temporary, and that — in a frequently cited example — left Brazil's protected computer industry producing technologically inferior, overpriced copies of foreign machines for a captive domestic market decades after the policy began, with the technology gap actually widening rather than closing ([Americas Quarterly, \"Failed Protectionism: What Latin America Can Teach Us\"](https://www.americasquarterly.org/article/failed-protectionism-what-latin-america-can-teach-us/); [IMF, \"Trade and Industrial Policy Reform in Latin America\"](https://www.elibrary.imf.org/display/book/9781557755179/ch07.xml)). Research by trade economists including Anne Krueger and Bela Balassa in the early 1980s do
