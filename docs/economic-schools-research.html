omists advising them, are treated as impartial. The record of the rules themselves is\nthe strongest available test, and it is not kind: the United States adopted statutory deficit\ntargets, many states adopted balanced-budget and tax-limitation rules, and federal debt continued\nto rise under governments of both parties. The school's funding history and the argument over\nNancy MacLean's 2017 account of it have generated more heat than any dispute in this survey; the\nsober position is that MacLean's specific narrative was substantially damaged by scholars across\nthe political spectrum, and that the documented facts about donor influence at George Mason\nUniversity — which surfaced independently, from the university's own records — remain damaging on\ntheir own without her framing.\n\n## Origins: A Discipline Applied Where It Had Not Been Applied\n\nThe Virginia School began in a specific institutional place. Buchanan and G. Warren Nutter founded\nthe Thomas Jefferson Center for Studies in Political Economy at the University of Virginia in\n1957; the program moved with Buchanan to Virginia Polytechnic Institute in 1969 as the Center\nfor Study of Public Choice, and to George Mason University in 1983. A learned society and a\njournal followed in the 1960s — the body that became the Public Choice Society, and the journal\nthat became *Public Choice* — which is the ordinary machinery by which an argument turns into a\nschool.\n\nBuchanan's intellectual debt was unusual and he was scrupulous about it. Working in the library\nas a young scholar, he found the 1896 dissertation of the Swedish economist Knut Wicksell on\nthe theory of public finance, and took from it two ideas that organized everything he later did.\nThe first is that public finance must be analyzed as an exchange: taxes are the price citizens\npay for public goods, and the discipline's habit of analyzing taxation and spending separately\nobscures the transaction. The second is the unanimity criterion. If a public project genuinely\nmakes everyone better off, then in principle a distribution of its costs exists that everyone\nwould accept; a decision rule approaching unanimity therefore screens out projects that merely\ntransfer resources from a minority to a majority. Buchanan translated Wicksell's work and cited\nhim in the Nobel lecture as the precursor who made the program possible.\n\n*The Calculus of Consent: Logical Foundations of Constitutional Democracy* (1962), written with\nTullock, is the founding text. Its central analytical device is a trade-off that any voter can\nrecognize once it is pointed out. As a decision rule moves from simple majority toward unanimity,\nthe *external costs* imposed on people who lose the vote fall — under unanimity, nobody can be\nforced to bear a cost they refuse. But the *decision-making costs* rise, since bargaining a\nlarger coalition into agreement takes time and may fail entirely. The optimal decision rule is\nthe one minimizing the sum, and — this is the payoff — it differs by the kind of decision. Routine\nadministrative choices warrant simple majorities; decisions with large and irreversible\ndistributive consequences warrant supermajorities or constitutional entrenchment. That is a\ngenuinely useful framework, and it is also, notice, a framework in which the case for making\nchange harder is always available and the case for making it easier rarely arises.\n\n## The Analytical Core\n\nThe school's most durable contributions are a handful of mechanisms that now appear in political\nscience, law, and journalism without attribution, which is the surest sign a research program has\nsucceeded.\n\nAnthony Downs's *An Economic Theory of Democracy* (1957), written adjacent to rather than inside\nthe Virginia group, supplied rational ignorance: since a single vote almost never determines an\noutcome, the expected return to a citizen from becoming informed is close to zero, so remaining\nignorant is rational rather than lazy. Mancur Olson's *The Logic of Collective Action* (1965)\nsupplied the asymmetry that follows: a small group with a large per-member stake organizes\neasily, while a large group with a small per-member stake does not, because each member of the\nlarge group gains more by free-riding. A tariff worth a hundred million dollars to twelve firms\nand costing each consumer a few dollars a year will be lobbied for ferociously and opposed by\nnobody. This single mechanism explains more about trade policy, agricultural subsidy, and\noccupational licensing than any theory of the national interest.\n\nWilliam Niskanen's *Bureaucracy and Representative Government* (1971) modeled the public agency as\nmaximizing its budget rather than fulfilling its mandate at least cost, on the grounds that\nsalary, staff, prestige, and post-government opportunities all scale with the budget. George\nStigler's \"The Theory of Economic Regulation\" (*Bell Journal of Economics and Management\nScience*, 1971) — from Chicago rather than Virginia, and treated in the chapter on the Chicago\nSchool — supplied the complementary claim about regulators: that regulation is typically acquired\nby the industry and operated for its benefit.\n\nThe school's most distinctive concept is rent-seeking. Tullock's \"The Welfare Costs of Tariffs,\nMonopolies, and Theft\" (*Western Economic Journal*, 1967) observed that the standard measure of\nmonopoly's cost — the deadweight triangle — omits something large. If a monopoly position is\nworth a billion dollars, firms will spend up to a billion dollars competing to obtain it, on\nlawyers, lobbyists, campaign contributions, and political favors, and that expenditure is real\nresources consumed in producing nothing. Anne Krueger supplied the name in \"The Political Economy\nof the Rent-Seeking Society\" (*American Economic Review*, 1974) and estimated the magnitudes for\nIndia and Turkey, finding them very large relative to conventional deadweight-loss measures. Note\nwhat happened there: the concept was created by a libertarian at Virginia and given its name and\nits first serious empirical application by an economist who later became chief economist of the\nWorld Bank and first deputy managing director of the IMF. Rent-seeking passed immediately into\nthe mainstream because it is analytically useful regardless of one's politics, and it is now\ndeployed as readily against private incumbents as against public agencies.\n\n## From Policy to Rules\n\nBuchanan's later program follows from taking the diagnosis seriously. If ordinary politics is\nstructurally biased toward concentrated interests, deficit finance, and the growth of budgets,\nthen advising governments about better policy is futile — one is advising the very actors whose\nincentives are the problem. The leverage point is the constitution: the rules chosen before\nanyone knows which side of a future decision they will be on. Buchanan called this constitutional\npolitical economy, and the Nobel committee named it in the 1986 citation, awarding the prize \"for\nhis development of the contractual and constitutional bases for the theory of economic and\npolitical decision-making.\"\n\n*Democracy in Deficit: The Political Legacy of Lord Keynes* (1977), with Richard Wagner, is the\napplied version and the one that shaped a generation of American fiscal argument. Its thesis,\ndiscussed also in the chapter on Keynesianism, is that Keynes's technical case for\ncounter-cyclical deficits was politically naive: deficits in recession require surpluses in\nbooms, and no democratic legislature will ever run the surpluses, because spending is popular and\ntaxing is not. Keynesianism therefore removed the pre-Keynesian balanced-budget norm — an\ninformal constitutional rule of real force — and put nothing in its place. Whatever one concludes\nabout the economics, this is a strong historical observation, and the postwar fiscal record of\nmost advanced democracies is broadly consistent with it.\n\n## What the School Did Once It Had Influence\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 330\" role=\"img\" aria-label=\"Public choice theory's diagnostic claims against its prescriptive record. On the diagnosis side: rational ignorance, the collective-action asymmetry, budget-maximizing bureaus, rent-seeking and regulatory capture all held up and entered general use. On the prescription side: Gramm-Rudman-Hollings was amended, partly struck down and abandoned; later statutory sequesters were suspended; and activity migrated to tax expenditures, off-budget vehicles and regulation.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" letter-spacing=\"2.5\">DIAGNOSIS AND PRESCRIPTION<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">a school whose analysis outperformed its remedy<\/text>\n<rect x=\"34\" y=\"66\" width=\"300\" height=\"212\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1.5\"/>\n<text x=\"184\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">THE DIAGNOSIS — held<\/text>\n<circle cx=\"60\" cy=\"114\" r=\"4\" class=\"f-t4\"/>\n<text x=\"74\" y=\"118\" font-size=\"10\">Rational ignorance of voters<\/text>\n<circle cx=\"60\" cy=\"142\" r=\"4\" class=\"f-t4\"/>\n<text x=\"74\" y=\"146\" font-size=\"10\">Small concentrated groups beat<\/text>\n<text x=\"74\" y=\"159\" font-size=\"10\">large diffuse ones<\/text>\n<circle cx=\"60\" cy=\"184\" r=\"4\" class=\"f-t4\"/>\n<text x=\"74\" y=\"188\" font-size=\"10\">Budget-maximizing bureaus<\/text>\n<circle cx=\"60\" cy=\"212\" r=\"4\" class=\"f-t4\"/>\n<text x=\"74\" y=\"216\" font-size=\"10\">Rent-seeking and capture<\/text>\n<text x=\"184\" y=\"252\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">Now common property across<\/text>\n<text x=\"184\" y=\"265\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">economics, left and right alike.<\/text>\n<rect x=\"366\" y=\"66\" width=\"300\" height=\"212\" rx=\"2\" fill=\"none\" style=\"stroke:var(--border)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/>\n<text x=\"516\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">THE PRESCRIPTION — did not<\/text>\n<text x=\"392\" y=\"118\" font-size=\"10\">Gramm-Rudman-Hollings<\/text>\n<text x=\"392\" y=\"131\" font-size=\"9\" class=\"t-muted\">amended, partly struck down, abandoned<\/text>\n<line x1=\"386\" y1=\"112\" x2=\"386\" y2=\"136\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<text x=\"392\" y=\"160\" font-size=\"10\">Later statutory sequesters<\/text>\n<text x=\"392\" y=\"173\" font-size=\"9\" class=\"t-muted\">suspended when they bound<\/text>\n<line x1=\"386\" y1=\"154\" x2=\"386\" y2=\"178\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<text x=\"392\" y=\"202\" font-size=\"10\">Spending itself<\/text>\n<text x=\"392\" y=\"215\" font-size=\"9\" class=\"t-muted\">migrated to tax expenditures,<\/text>\n<text x=\"392\" y=\"228\" font-size=\"9\" class=\"t-muted\">off-budget vehicles, regulation<\/text>\n<line x1=\"386\" y1=\"196\" x2=\"386\" y2=\"233\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<text x=\"516\" y=\"258\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">Rules written for self-interested actors<\/text>\n<text x=\"516\" y=\"271\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">were arbitraged by self-interested actors.<\/text>\n<text x=\"350\" y=\"304\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\" font-style=\"italic\">The theory's own logic predicts this outcome. It did not exempt the rule-writers.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> Public choice insisted on one behavioural model for markets and government alike, and its diagnostic half was vindicated so thoroughly that its terms are now used by people who reject the school entirely. The prescriptive half failed on its own premises: constitutional rules aimed at self-interested actors were amended, suspended, or routed around by those same actors, because nothing in the theory ever explained why rule-writers would be the exception.<\/figcaption>\n<\/figure>\n\n\nThe insider's test is what happened when the doctrine reached institutions, and public choice\nreached them substantially, mostly in the United States and mostly through rules.\n\nThe federal attempt was the Balanced Budget and Emergency Deficit Control Act of 1985 —\nGramm-Rudman-Hollings — which set declining statutory deficit targets enforced by automatic\nacross-the-board cuts. It was amended when the targets proved unreachable, partly struck down on\nseparation-of-powers grounds, and effectively abandoned; its successors, from the Budget\nEnforcement Act's pay-as-you-go rules to the 2011 Budget Control Act's sequester, have a similar\nhistory of suspension when binding. The state-level record is more substantial: nearly every US\nstate operates under some balanced-budget requirement, and a wave of tax-and-expenditure\nlimitations followed California's Proposition 13 in 1978, the most stringent being Colorado's\n1992 Taxpayer's Bill of Rights, which caps revenue growth at population plus inflation and\nrequires voter approval for tax increases. Supermajority requirements for tax increases, term\nlimits, and independent fiscal councils all draw on the same analysis. Outside the United States,\nthe strongest expression of the constitutional-rules logic is European rather than American — the\nGerman debt brake and the EU's fiscal rules, which the chapter on ordoliberalism treats and which\narrive at similar institutional conclusions from an entirely different intellectual tradition.\n\nJudged against its own predictions, the record is mixed in a specific and revealing way. The\ndiagnostic half performed well: government spending as a share of output rose across the\ndemocratic world through the period, concentrated interests did capture large parts of tax and\nregulatory policy, and deficits persisted in expansions as *Democracy in Deficit* predicted. The\nprescriptive half performed badly: the constitutional rules designed to stop it were repeatedly\nwaived, redefined, or circumvented, because a rule adopted by a legislature can be suspended by a\nlegislature, and rules that survive tend to shift activity rather than reduce it — toward\noff-budget vehicles, tax expenditures, unfunded mandates, and regulation, which achieves the\npolicy without the appropriation. This is public choice defeating public choice: the theory's own\nlogic predicts that self-interested actors will arbitrage any rule that binds them, and it does\nnot exempt the rules the theory recommends.\n\nThe most contested episode in the school's institutional history is Chile. Buchanan visited in\n1980 and again in 1981, during the Pinochet dictatorship and in the period when the 1980\nconstitution — with its supermajority requirements, entrenched provisions, and constrained\nfuture majorities — was being designed and defended. The strong claim, most prominently in\nMacLean's account, is that Buchanan helped design a constitution engineered to insulate economic\npolicy from democratic majorities. The scholarly literature examining the archives is more\ncareful and genuinely divided: work published in the *Southern Economic Journal* (2019) on the\n1980 visit and in the *Review of Austrian Economics* (2019) on the 1981 visit reaches different\nconclusions about whether Buchanan defended or criticized the regime's authoritarian features,\nand both note the tension with Buchanan's own repeated methodological insistence that the\npolitical economist must not act as adviser to a benevolent despot. What can be said without\noverclaiming is that the visits happened, that Chilean constitutional design in this period drew\non ideas of entrenched limits on majorities that are recognizably in the family, and that the\nspecific counterfactual — what the constitution would have looked like without him — is not\nestablished by the available evidence.\n\n## Money, and the Argument About the Argument\n\nNo school in this survey has a funding history as central to its public reception, and it has to\nbe handled carefully in both directions.\n\nThe documented facts came from George Mason University's own records, released after open-records\nlitigation in 2018. Agreements accepted by the university between 2003 and 2011, all relating to\nthe Koch-funded Mercatus Center, gave donors formal input into faculty appointments; the most\nrecent of them provided for five-member selection committees with two members chosen by donors.\nThe university's president, Ángel Cabrera, told faculty that the agreements raised questions\nabout donor influence in academic matters, called them problematic, said they fell short of the\nstandards of academic independence he expected of any gift, and ordered a review of all donor\nagreements supporting faculty positions. That is not an allegation by a critic; it is an\nadmission by the institution.\n\nNancy MacLean's *Democracy in Chains* (2017) placed Buchanan at the center of a much larger\nclaim: that public choice was the intellectual engine of a deliberate, decades-long project to\nconstrain democratic majorities on behalf of concentrated wealth, with a lineage running back to\nSouthern resistance to school desegregation. The book won a wide readership and a National Book\nAward nomination. It also drew unusually severe criticism, and the composition of the critics\nmatters. Attacks from libertarian-aligned scholars — Philip Magness, Michael Munger, David\nBernstein, Jonathan Adler, the *Cato Journal*, and a review essay in the *Journal of Economic\nLiterature* — were predictable and should be weighted accordingly. But Henry Farrell and Steven\nTeles, political scientists whose own work is broadly critical of the libertarian right, argued\npublicly that the book's evidentiary practice was unsound, that quotations were used in ways the\nsources did not support, and that the failure was damaging precisely because the underlying\nsubject deserved serious treatment. MacLean's response, that her critics were substantially\nassociated with Koch-funded institutions, was accurate about some of them and did not address\nFarrell and Teles. Some historians defended her, arguing that the critics were applying\neconomists' standards to a work of historical interpretation and had not engaged the questions of\nmethod on their own terms.\n\nThe defensible position on the whole affair is a double one that neither side finds satisfying.\nMacLean's specific causal narrative — the segregationist origin story in particular — did not\nsurvive scrutiny and should not be relied on. And the institutional facts about donor influence\nover hiring at the university housing the school's flagship center, together with the school's\nown theory that funders act on their interests, make it entirely legitimate to ask cui bono of\npublic choice as a body of ideas. Indeed the school supplies the tools for the question: a\ntradition holding that concentrated interests reliably purchase favorable policy cannot\nconsistently claim that concentrated funding of a research program has no effect on what the\nprogram produces. That does not make its findings false — rent-seeking is a real phenomenon and\nthe evidence for it does not depend on who paid for the office — but it does mean that the\nselection of questions asked, and not asked, is a legitimate object of inquiry.\n\n## The Missing Symmetry, and the Answer from Bloomington\n\nThe strongest internal criticism of public choice is not about money. It is that the school\napplies its behavioral assumption asymmetrically. Voters, legislators, and bureaucrats are\nself-interested; the framers of constitutional rules, and the economists who advise them, are\nimplicitly disinterested, deliberating behind a veil about rules for a future they cannot\npredict. But actual constitutions are written by actual people with actual interests, usually at\nmoments of crisis in which one faction is temporarily dominant, and the theory offers no reason\nto expect the resulting rules to be neutral. Applying the school's own assumption consistently\nturns constitutional entrenchment from a solution into another arena of rent-seeking — arguably\nthe most valuable arena, since a rule entrenched today constrains every future majority.\n\nThe empirical criticism is that the school's models frequently do not fit the data. Niskanen's\nbudget-maximizing bureaucrat has performed poorly against the observed behavior of agencies, many\nof which pursue mission, autonomy, or professional prestige and sometimes resist budget\nincreases that come with unwanted mandates. The median-voter theorem's record in explaining\nactual legislative outcomes is mixed at best. Voter turnout itself remains the field's standing\nembarrassment: on the rational-ignorance logic, an instrumentally rational citizen should rarely\nbother to vote at all, yet turnout in national elections routinely exceeds half the electorate,\nwhich suggests the behavioral model is missing something substantial about civic motivation.\n\nThe most constructive answer came from within the broader family. Elinor Ostrom, working with\nVincent Ostrom at Indiana University's Bloomington workshop, accepted the public-choice starting\npoint — study how real institutions structure real incentives — and then went and looked. Her\nfieldwork on irrigation systems, fisheries, forests, and grazing commons, synthesized in\n*Governing the Commons* (1990), established that communities frequently develop durable\nself-governing arrangements that avoid both privatization and state control, and identified the\ndesign principles that distinguish the arrangements that last from those that collapse. She\nreceived the Nobel in 2009 for her analysis of economic governance, especially the commons — the\nfirst woman to receive the economics prize. The chapter on institutionalism treats her work in\nits institutional-economics context; the point here is that Bloomington is the rebuttal to\nVirginia delivered in Virginia's own idiom. Where public choice reasons deductively from a\nself-interest postulate to the conclusion that collective action fails and must be constrained\nconstitutionally, Ostrom demonstrated empirically that collective action often succeeds, and that\nwhether it does is a question about specific institutional design rather than about human nature.\n\n## Open Questions\n\nWhether constitutional rules can ever bind a legislature that retains the power to amend or\nsuspend them, or whether the entire constitutional-economics program is defeated by its own\npremise, is unresolved and is the school's central unanswered question; the European experience\nwith fiscal rules that were suspended in 2020 and renegotiated afterward is the best recent\nevidence and points toward the pessimistic reading. Whether the documented donor influence at\nGeorge Mason materially shaped the school's research agenda, as opposed to funding work its\nrecipients would have done anyway, is not established either way and would require the kind of\nsystematic content analysis of research output that no one has yet published. What Buchanan\nactually said and advised in Chile in 1980 and 1981 remains contested in the peer-reviewed\nliterature, with the archives supporting more than one reading. Whether rational ignorance and\nthe collective-action asymmetry hold in an information environment transformed by social media —\nwhich lowers the cost of becoming informed and simultaneously lowers the cost of organizing\ndiffuse interests, cutting in opposite directions — is an open empirical question with\nsignificant implications for the school's core predictions. And whether public choice's diagnosis\nsurvives its own prescriptive failure — that is, whether a theory can retain authority when its\naccount of the disease is confirmed and its treatment does not work — is a question the school's\ncurrent practitioners answer more candidly than its popularizers do.\n\n## Sources\n\n- James M. Buchanan and Gordon Tullock, *The Calculus of Consent: Logical Foundations of Constitutional Democracy* (University of Michigan Press, 1962) — primary text (Tier 1).\n- James M. Buchanan, \"Public Choice: Politics Without Romance\" (1979) and Nobel lecture materials — primary texts (Tier 1).\n- Nobel Foundation, press release and documentation for the 1986 Prize in Economic Sciences (Buchanan), \"for his development of the contractual and constitutional bases for the theory of economic and political decision-making,\" nobelprize.org (Tier 1, primary).\n- Knut Wicksell, *Finanztheoretische Untersuchungen* (1896), as translated and cited by Buchanan — primary text via Buchanan's own account (Tier 1).\n- Anthony Downs, *An Economic Theory of Democracy* (1957) — primary text (Tier 1).\n- Mancur Olson, *The Logic of Collective Action* (Harvard University Press, 1965) — primary text (Tier 1).\n- William A. Niskanen, *Bureaucracy and Representative Government* (1971) — primary text (Tier 1).\n- George J. Stigler, \"The Theory of Economic Regulation,\" *Bell Journal of Economics and Management Science* (1971) — primary text (Tier 1).\n- Gordon Tullock, \"The Welfare Costs of Tariffs, Monopolies, and Theft,\" *Western Economic Journal* 5, no. 3 (1967): 224-232 — primary text (Tier 1).\n- Anne O. Krueger, \"The Political Economy of the Rent-Seeking Society,\" *American Economic Review* 64, no. 3 (1974): 291-303 — primary text (Tier 1).\n- James M. Buchanan and Richard E. Wagner, *Democracy in Deficit: The Political Legacy of Lord Keynes* (1977) — primary text (Tier 1).\n- Rosolino A. Candela, \"Public Choice: The Virginia School,\" in the *Encyclopedia of Law and Economics* (Springer) — scholarly reference (Tier 2).\n- Econlib (Liberty Fund), biographical entries on James M. Buchanan and Gordon Tullock, econlib.org (Tier 5/6, libertarian-affiliated reference work, lean noted — used for chronology).\n- Balanced Budget and Emergency Deficit Control Act of 1985 (Gramm-Rudman-Hollings); Budget Control Act of 2011 — primary legislation (Tier 1).\n- Colorado Taxpayer's Bill of Rights (1992), Colorado Constitution Article X, Section 20 — primary legal text (Tier 1).\n- Andrew Farrant, \"What Should (Knightian) Economists Do? James M. Buchanan's 1980 Visit to Chile,\" *Southern Economic Journal* (2019) — peer-reviewed (Tier 2).\n- \"James M. Buchanan's 1981 visit to Chile: Knightian democrat or defender of the 'Devil's fix'?,\" *Review of Austrian Economics* 32, no. 1 (2019) — peer-reviewed, Austrian-school-affiliated journal, lean noted (Tier 2/5).\n- *Inside Higher Ed*, \"Koch agreements with George Mason gave foundation role in faculty hiring and oversight,\" May 1, 2018, insidehighered.com (Tier 4).\n- *The Chronicle of Higher Education*, \"Why George Mason's Agreements With the Koch Foundation Raised Red Flags,\" chronicle.com (Tier 4).\n- Foundation for Individual Rights and Expression, \"Open records request reveals donor influence at George Mason University,\" thefire.org (Tier 5, civil-liberties advocacy organization, lean noted).\n- American Association of University Professors, *Journal of Academic Freedom*, \"From Direct to Diffuse Donor Influence: Charles Koch…,\" aaup.org (Tier 2/5, faculty-association outlet, lean noted).\n- Nancy MacLean, *Democracy in Chains: The Deep History of the Radical Right's Stealth Plan for America* (Viking, 2017) — primary text of the thesis under discussion (Tier 1).\n- *Journal of Economic Literature*, \"The Sound of Silence: A Review Essay of Nancy MacLean's *Democracy in Chains*,\" aeaweb.org — peer-reviewed review essay, economics-profession lean noted (Tier 2).\n- *Cato Journal*, review of *Democracy in Chains*, Fall 2017, cato.org (Tier 5, libertarian think tank, lean noted).\n- *Inside Higher Ed*, \"Historian alleges coordinated criticism of her latest book,\" July 12, 2017, insidehighered.com (Tier 4) — source for MacLean's own response.\n- Society for US Intellectual History, \"The Controversy over *Democracy in Chains*,\" s-usih.org (Tier 5, scholarly association blog) — source for the defense of MacLean on grounds of historical method.\n- Elinor Ostrom, *Governing the Commons: The Evolution of Institutions for Collective Action* (Cambridge University Press, 1990) — primary text (Tier 1).\n- Nobel Foundation, 2009 Prize in Economic Sciences (Ostrom and Williamson), nobelprize.org (Tier 1, primary).\n\n## Glossary\n\n**Public choice**: the application of economic analysis — self-interest, incentives, constraints — to political actors and processes rather than to markets.\n\n**Politics without romance**: Buchanan's summary of the school's method: analyze voters, politicians, and officials as ordinary self-interested people rather than as public-spirited agents.\n\n**Constitutional economics**: the study of the rules that constrain future political decisions, on the argument that improving the rules matters more than improving individual policies.\n\n**Unanimity criterion**: Wicksell's standard, adopted by Buchanan, that a genuinely beneficial public project could in principle be financed in a way everyone would accept.\n\n**External costs / decision-making costs**: the two costs traded off in choosing a voting rule — the burden imposed on outvoted minorities, and the difficulty of assembling larger agreeing coalitions.\n\n**Rational ignorance**: the conclusion that a voter's near-zero chance of being decisive makes it rational not to invest in becoming informed.\n\n**Collective-action asymmetry**: Olson's finding that small groups with large per-member stakes organize far more effectively than large groups with small per-member stakes.\n\n**Rent-seeking**: expending real resources to obtain a privileged position — a tariff, licence, or monopoly — rather than to produce anything; named by Krueger in 1974 after Tullock's 1967 analysis.\n\n**Regulatory capture**: Stigler's claim that regulation is typically acquired by the regulated industry and operated primarily for its benefit.\n\n**Budget-maximizing bureaucrat**: Niskanen's model of a public agency head who maximizes the agency's budget rather than delivering its mandate at least cost.\n\n**Tax-and-expenditure limitation**: a statutory or constitutional cap on the growth of government revenue or spending, such as Colorado's Taxpayer's Bill of Rights.\n\n**Bloomington School**: the Ostroms' empirically grounded research program on how communities actually govern shared resources — the constructive counterpart to Virginia's deductive pessimism."}, {"order": 13, "file": "Future_Trajectory.md", "title": "Whose Economics Governs by 2035", "summary": "", "body": "# Whose Economics Governs by 2035\n\n## Bottom Line\n\nNo single school wins. That is not a hedge — it is the finding the evidence most strongly supports, and it has a specific shape worth stating precisely rather than leaving as a shrug.\n\nThrough 2035, the most likely world by a wide margin keeps the operating system of economic policy exactly as syncretic as it has been since 2008: different schools owning different rooms of the same building. New Keynesian modelling and inflation targeting keep running monetary policy. That framework has survived every test put to it, including a four-decade inflation high and a hostile change of Federal Reserve leadership. Friedrich List's logic — protect and build strategic capacity the market would underinvest in — keeps running an expanding but bounded slice of fiscal policy, dressed in the language of national security and market-failure correction rather than in List's own vocabulary. Ordoliberal and institutionalist thinking supplies the frontier vocabulary, because the binding constraints on industrial policy turn out to be permitting, workforce, and administrative capacity rather than money. And the Austrian and monetarist inheritance operates through no government at all. It operates through the credit markets, where the ratings agencies have already stripped the United States of its last AAA and the thirty-year yield has held above five percent for the longest stretch since the financial crisis. Call that scenario *Eclectic Consolidation*: **38–48%**, and modal.\n\nThe two live alternatives cut in opposite directions, and each is about half as likely. *Security-Industrial Consolidation* sits at **18–28%**: List-adjacent policy stops being one instrument among many and becomes the organizing doctrine, complete with a permanent state investment apparatus generalized from the government's 2025 equity stake in Intel. *Fiscal Discipline Reassertion* sits at **14–22%**: the interest burden and the bond market force a consolidation, and the ordoliberal-monetarist instinct for rules over discretion reasserts itself.\n\nA genuine rupture — a funding or inflation event that breaks the framework and forces either de facto monetization or hard-money retrenchment — sits at **8–14%**. That number is low, but it is not small, and it is the one most likely to be underpriced. The counted record that makes rupture look improbable is a record of eighty years in which no reserve-currency issuer has faced a funding crisis. That is precisely the kind of long-peace evidence that trains forecasters to over-predict continuity.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Which economics governs by 2035 — scenario probabilities<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Eclectic Consolidation<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"371.6\" y=\"8\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"428.7\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">38–48%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Security-Industrial Consol…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"273.4\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"330.5\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">18–28%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Fiscal Discipline Reassert…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"253.7\" y=\"80\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"301.0\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">14–22%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Crisis Rupture<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"261.7\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">8–14%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">New Entrant<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"199.7\" y=\"152\" width=\"19.6\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"227.4\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">3–7%<\/text><\/svg><figcaption> <span class=\"credit\">Source: Scenario probabilities, this forecast.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## Method\n\nFour things ground the numbers below, and one important thing does not.\n\nStart with what does not. **No prediction market prices this question, and I am not going to pretend otherwise.** Neither Polymarket nor Kalshi nor Metaculus lists a contract on which school of economic thought governs, and no such contract could easily be written: the resolution criteria would be an argument rather than an observation. What the markets do price, richly and with real money, are the *conditions* each scenario below requires — control of Congress, the party holding the presidency in 2029, the path of the federal funds rate, the odds of a recession. I use those as conditional anchors, adjusted for the gap between what the contract resolves on and what this forecast is asking. Where I have adjusted, I say by how much.\n\nNow the four that do. First, **the fiscal arithmetic** — the least contested input available, and the one that constrains every other driver. The Congressional Budget Office's February 2026 baseline puts the fiscal 2026 deficit at $1.9 trillion, or 5.8% of GDP, widening to 6.7% by 2036. Debt held by the public rises from 101% of GDP to 120%. Net interest goes from $1.0 trillion, or 3.3% of GDP, to $2.1 trillion, or 4.6%. That last line matters most here, because interest is the only major category of federal spending that no school of economic thought has a program for reducing, except by changing one of the other lines. Every scenario below inherits that arithmetic.\n\nSecond, **counted base rates on how often the governing framework actually changes.** Since the founding of political economy, Anglo-American policy has been organized around a genuinely different school on three occasions: classical laissez-faire from roughly the 1820s to the 1930s, Keynesian demand management from the 1940s to the 1970s, and the monetarist-neoliberal settlement from 1979 to 2008. Three transitions in roughly 250 years is about one per 65 to 80 years, which over a nine-year window implies a base rate near 12–15% for a full regime change. More useful still: all three followed a macroeconomic catastrophe — the Depression, the stagflation of 1973–79, the financial crisis. So the honest way to model a rupture is not to pick a number. It is to multiply the probability of a forcing event by the probability that the event breaks the framework rather than tightening it.\n\nThird, **the actual instrument mix, which changed materially in February 2026.** The Supreme Court held 6–3 in *Learning Resources, Inc. v. Trump* that the International Emergency Economic Powers Act does not authorize tariffs. The weighted average applied US tariff rate fell from 14.9% to 8.2% as a result, with roughly $175 billion owed back to importers. The substitute 10% across-the-board tariff imposed under Section 122 carried a statutory 150-day life and expired on 24 July 2026. What survived is sectoral: Section 232 national-security tariffs, export controls, and subsidy. That is a structural fact about *which* school can be put to work. Broad Listian protection now requires an act of Congress; targeted Listian capacity-building through subsidy, equity, and export control does not. The asymmetry runs through every scenario below, and it is the single most underweighted development of the past year.\n\nFourth, **the evidence in these pages about what each school actually runs versus what it is credited with running.** The chapter on Keynes draws the distinction that matters most: New Keynesian economics as a working research program inside every major central bank, against \"Keynesian\" as a rhetorical permission slip for deficits unconnected to any output gap. That distinction is the most important analytical tool in this forecast, and it generalizes. Modern Monetary Theory lost its label after the 2021–23 inflation while the fiscal behavior it rationalized continued under other justifications. List's name is invoked far more often than his sequence is followed; the chapter on the National School is blunt that the CHIPS Act and the Inflation Reduction Act look less like disciplined infant-industry sequencing than like rent distribution wearing his vocabulary. Behavioral economics never contested the macro question at all. A forecast that counts citations rather than institutions would get all of this backwards.\n\nGenuine disagreement survives all four inputs, and it is preserved below as scenario spread rather than averaged away. The sharpest unresolved question is whether industrial policy in 2026 is early or late — whether the fabs, the equity stakes, and the European Technological Sovereignty Package are the opening of a durable regime or the high-water mark of one that peaked in 2022 and is now running into a labour bottleneck, a hostile court, and an interest bill. I lean toward the second reading more than most observers do. That lean is why the industrial-policy scenario below tops out at 28% rather than running away with the distribution.\n\n---\n\n## Scenarios\n\n### Eclectic Consolidation\n\n**38–48%. The modal case.**\n\nNothing has to happen for this one. In 2035 the Federal Reserve, the European Central Bank, and the Bank of England are still running inflation-targeting regimes informed by dynamic stochastic general equilibrium models with New Keynesian nominal rigidities at their core. That apparatus met the worst inflation in forty years and came out modified rather than abandoned. Fiscal policy remains what these pages describe it as already being: permanently expansionary, defended by whichever justification is locally convenient — national security, social insurance, tax relief, competitiveness — and almost never by the symmetric countercyclical logic Keynes specified. Industrial policy persists as a real, funded, bipartisan carve-out for semiconductors, defence, energy, and critical minerals, without generalizing into a doctrine of the economy as a whole. Competition policy and regulatory design keep drifting toward the institutionalist and ordoliberal register, because the questions that bind are institutional-capacity questions rather than questions about the money supply or the multiplier: how to permit a fab in under two years, how to train 115,000 semiconductor workers, how to keep a subsidy programme from being captured. Nobody declares a winner, because nobody is having the argument in those terms.\n\n*Derivation.* This is the residual, and it is also independently supported. Start with the counted regime-change rate: three transitions in about 250 years gives roughly 12–15% for a full break over nine years, so continuity of *some* kind carries roughly 85–88%. Then partition that continuity between this scenario and the two directional tilts below, using the persistence evidence for each anchor. The monetary anchor is very strong. Of roughly 28 advanced economies that adopted inflation targeting since New Zealand in 1990, essentially none has abandoned the framework, and the 2021–23 inflation — a direct, maximal test — produced framework *reviews* rather than replacements. So P(the monetary core survives to 2035) ≈ 0.88. The fiscal anchor is weaker but still favours continuity. Of four major US sectoral programmes that faced a change of party control (Sematech, the 2009 clean-energy loan programme, CHIPS, the IRA), four survived in restructured or truncated form and none was repealed outright, but at least two were materially truncated. The modal fiscal outcome is therefore \"persists, reshaped\" — not \"consolidates,\" and not \"reversed.\" Multiplying the surviving continuity mass against the roughly 50/27/23 split between this scenario and the two tilts gives 0.86 × 0.50 ≈ **0.43**, the midpoint of the band.\n\n*Drivers.* The fiscal arithmetic, which crowds out doctrinal ambition in every direction. The durability of the central-bank framework across a hostile leadership transition. The absence of a rival macro framework with anything like a clean predictive win — the point the chapter on Chicago makes about 2008 is the general case: efficient-markets theory took real damage and no single successor claimed the ground.\n\n*Signals to watch.* The Federal Reserve's next framework review and whether it modifies or replaces flexible average inflation targeting. Whether appropriations bills after the November 2026 midterms keep funding CHIPS-successor and energy-manufacturing lines under a divided Congress. Whether \"state capacity\" and permitting reform continue to displace stimulus-versus-austerity as the frame of American economic argument.\n\n*Time horizon.* Distinguishable from the alternatives by roughly 2029 — one full budget cycle after the next presidential term begins.\n\n*The challenge to it.* The strongest objection is that this scenario describes an equilibrium, and the period since 2008 has not produced equilibria. That is fair, and it is why the band tops out at 48% rather than in the fifties. But note what the scenario already contains: a real and growing industrial-policy carve-out, a bond market imposing discipline no legislature voted for, and continuous drift in the regulatory register. It is stable in its architecture, not in its contents.\n\n### Security-Industrial Consolidation\n\n**18–28%.**\n\nList's logic stops being one instrument and becomes the organizing frame. The government's August 2025 conversion of $8.9 billion in Intel grants into a roughly 10% equity stake is not remembered as an anomaly but as the template: a standing federal investment vehicle taking positions in strategic firms, generalized beyond semiconductors into critical minerals, pharmaceuticals, shipbuilding, and energy. Congress writes the tariff authority the Supreme Court denied the executive, or Section 232 findings expand to cover most of what IEEPA once did. The European Union's Chips Act 2.0, proposed in June 2026 as part of a Technological Sovereignty Package, becomes the first instalment of a genuinely federal European industrial policy rather than a coordination layer over twenty-seven national subsidy races. Germany's March 2025 constitutional exemption of defence spending above 1% of GDP from any borrowing limit — the largest breach of ordoliberal fiscal doctrine in the Federal Republic's history — turns out to be the opening move rather than an emergency measure. China's 50% domestic-equipment mandate and 80% self-sufficiency target for 2030 are met or nearly met, and the demonstration effect is decisive.\n\n*Derivation.* A decomposition. P(industrial-policy spending persists and grows as a share of non-interest discretionary spending through 2035) ≈ 0.65. That is high, because the survival base rate above is near one and because security competition is funded by both American parties. It is held below 0.7 by the interest burden reaching 4.6% of GDP and by the 61% Polymarket price on a Democratic 2028 presidency, which implies a change in *which* sectors get favoured even if the apparatus survives. Then P(it becomes the organizing doctrinal frame rather than one instrument among several | it grows) ≈ 0.35. That is the hard factor, and three things visible in the 2026 data hold it down. The binding constraint on the American programme is now labour rather than capital: US semiconductor manufacturing employment has *fallen* from about 401,000 in 2023 to 368,400 by March 2026, and as many as 67,000 of the 115,000 positions needed by 2030 look likely to go unfilled. Europe's own evaluators have told it to abandon its 20% market-share target rather than pursue it. And the most influential academic case for industrial policy presents itself as market-failure correction within mainstream welfare economics — a claim to sit *inside* the mainstream, not to replace it. Product: 0.65 × 0.35 ≈ **0.23**.\n\n*Drivers.* Great-power competition, which is the only driver strong enough to override the fiscal constraint. The instrument shift from tariffs to subsidy, equity, and export control forced by the February 2026 ruling. Europe's defence build-out, projected to take German core defence spending from €95 billion in 2025 to €162 billion by 2029.\n\n*Signals to watch.* Whether the Intel equity model is applied to a second and third company. Whether Congress passes a standing tariff or industrial-strategy authority to replace what IEEPA provided. Whether semiconductor manufacturing employment turns and starts rising against the 368,400 March 2026 level. Whether Chips Act 2.0 emerges from the Council and Parliament with binding money attached or as another coordination framework.\n\n*Time horizon.* The instrument question resolves by 2028; the doctrinal question by 2032.\n\n*The challenge to it.* This scenario is the consensus read among people who follow industrial policy closely, and consensus reads on ascendant policy fashions have a poor record. The chapter on the National School documents that essentially every failed twentieth-century case used List's rhetoric without his exit discipline, and none of the three current programmes has any institutional mechanism for winding down. A programme with no exit test is not a ladder; it is a constituency. That is compatible with the spending persisting and with the doctrine never consolidating, which is what the low second factor encodes.\n\n### Fiscal Discipline Reassertion\n\n**14–22%.**\n\nThe bond market wins the argument that no legislature would win. Thirty-year yields hold above 5%, real yields sit near 3%, no agency rates the United States AAA, and the interest line crosses 4% of GDP well before the CBO's 2036 date. A divided or opposition-controlled Congress after November 2026 finds that its cheapest available position is refusing to fund the other party's champions. The result is a de facto consolidation nobody campaigned on: subsidy sunsets honoured rather than extended, tariff revenue reframed as a fiscal instrument rather than a strategic one, a statutory spending cap regime resembling the 2011 Budget Control Act, and a Federal Reserve under Kevin Warsh — confirmed 54–45 in May 2026, and the most vocally rules-over-discretion chair since Volcker — institutionalizing a harder anti-inflation line. This is not an Austrian revolution. Nobody returns to gold, and the hard-money forecasting record documented in these pages is too poor to carry a policy programme. It is the ordoliberal and monetarist instinct — rules, credibility, a state that sets the frame rather than picks the winners — reasserting itself under creditor pressure.\n\n*Derivation.* A base rate, adjusted. Count American fiscal consolidations since 1945 in which the primary balance improved by two or more points of GDP over a sustained stretch: 1946–48, 1993–98, and 2011–2015 under the Budget Control Act. Three episodes across roughly eight overlapping nine-year windows gives a raw rate near 35%. But all three required a forcing event — the end of a war, an explicit bond-market-driven deficit deal, or a debt-ceiling crisis. So the conditional structure is P(forcing pressure present) × P(consolidation follows | pressure). The pressure is already present and observable on the tape: 5%-plus long yields, the loss of the last AAA rating, an interest line above $1 trillion. Call P(pressure sustained through 2035) ≈ 0.6 and P(it produces consolidation rather than being absorbed) ≈ 0.3, since both American parties currently have expensive priorities and the 2028 market leans away from the party more inclined to spending restraint on domestic programmes. Product: 0.6 × 0.3 ≈ **0.18**.\n\n*Drivers.* Compounding interest, which is the one driver that operates without anyone deciding anything. Divided government. A Federal Reserve chair whose intellectual formation is closer to the Chicago and hard-money tradition than to the New Keynesian consensus he now administers.\n\n*Signals to watch.* A failed or badly tailed thirty-year Treasury auction. Whether the CHIPS-successor and IRA-successor lines are allowed to expire on schedule rather than extended. Any statutory spending-cap deal attached to a debt-limit increase. Whether the Warsh Fed's first framework statement moves toward a stricter, more rules-based reaction function.\n\n*Time horizon.* The first observable tests are the fiscal 2028 appropriations cycle and the next debt-limit expiry.\n\n*The challenge to it.* Consolidation under high debt is far more often *talked about* than done. The same interest arithmetic that makes discipline urgent also makes it harder, because a rising interest line shrinks the discretionary base a consolidation could plausibly cut. The counted record above also shows that two of three American consolidations were accidents of divided government rather than doctrinal victories. So this scenario can happen without any school winning the argument, and part of its probability mass is really just Eclectic Consolidation with a tighter budget.\n\n### Crisis Rupture\n\n**8–14%.**\n\nA funding or inflation event breaks the framework. The plausible forms are specific: a genuine failure to place long-dated Treasury debt at any acceptable price; a re-acceleration of inflation that a Fed already at 3.50–3.75% cannot contain without a recession severe enough to be politically intolerable; or a debt-limit episode that crosses from brinkmanship into actual missed payment. Whatever the trigger, the response is not incremental. Two branches follow, and they run in opposite directions. In the larger branch — call it roughly 55% of this scenario's mass — the state does what states under fiscal duress have generally done: some combination of yield-curve control, financial repression through captive domestic buyers, and central-bank balance-sheet absorption of deficits. That is Modern Monetary Theory's mechanism, implemented without its label and against the wishes of everyone implementing it. In the smaller branch, the response is retrenchment: a hard nominal anchor, statutory monetary rules, aggressive consolidation, and the closest thing to an Austrian-flavoured settlement any advanced economy has attempted since 1979.\n\n*Derivation.* A decomposition, built so the number is a product rather than a pick. Start with P(an acute fiscal or monetary forcing event by 2035). The counted reference class is unhelpful in the direction of complacency: among reserve-currency issuers since 1945 there have been zero true funding crises, with the United Kingdom's 1976 IMF loan the nearest analogue and sterling already a fading reserve currency by then. Zero of four issuers over eighty years argues for a very low number. But the debt and interest path sits outside the range that reference class was drawn from, and the calibration literature is explicit that stable periods train forecasters to under-predict breaks. I adjust the base rate up to 0.20 rather than the near-zero the raw count implies. Then P(the framework breaks rather than tightens | event) ≈ 0.5, since two of the three counted historical regime changes moved toward more state activism and one toward less, and a crisis that merely produces the discipline scenario above is not a rupture. Product: 0.20 × 0.5 ≈ **0.10**, band 8–14%.\n\n*Drivers.* The interest line. The maturity structure of the debt and the concentration of refinancing. The political system's demonstrated inability to run Keynes's symmetric prescription, documented across both parties' records in these pages.\n\n*Signals to watch.* Term premium behaviour at the long end, which is already elevated. Any Treasury or Federal Reserve action that touches the shape of the yield curve directly. Foreign official holdings of Treasuries. Statutory proposals for monetary rules or for capital controls on outbound investment.\n\n*Time horizon.* Unbounded within the window — this scenario has no scheduled date, which is exactly what makes it hard to price.\n\n*The challenge to it.* There is real tension between the two grounding routes. The regime-change base rate suggests 12–15% for a break over nine years; the reserve-issuer funding-crisis base rate suggests far less. I have landed between them and widened the band rather than splitting the difference into false precision, and I want to be explicit that this is the scenario whose derivation I trust least.\n\n### New Entrant\n\n**3–7%.**\n\nA school not currently in contention becomes materially load-bearing. The candidates are visible, but none is close. An artificial-intelligence-driven productivity acceleration large enough to change the growth term in the debt dynamics would not so much vindicate a school as dissolve the question the other four scenarios are arguing about. A distributive turn is the second candidate: a wealth-tax and public-ownership agenda drawing on the Piketty-adjacent inheritance rather than on Marx's own apparatus, which these pages document as having essentially no presence in central banking or finance ministries. It is more plausible in Europe than in the United States, and more plausible as a tax programme than as an economics. A genuinely computational planning proposal, of the kind the chapter on Marx flags as untested against the Hayekian knowledge objection, remains a seminar topic.\n\n*Derivation.* Residual after the four scenarios above, cross-checked against one observation. All three counted historical regime changes were led by schools that had been publicly arguing their case for at least twenty years before they governed — Keynes from 1919, the Chicago monetarists from the late 1940s, both roughly two decades ahead of their moment. Nothing outside the eight schools mapped in these pages currently has that twenty-year runway pointed at 2035, which caps this scenario near the low single digits.\n\n---\n\n## Base Rates\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 340\" role=\"img\" aria-label=\"Five counted reference classes underpinning the forecast. Governing-framework transitions preceded by catastrophe: three of three. Inflation-targeting regimes abandoned since 1990: none of about twenty-eight. US industrial programmes surviving a change of party: four of four. US fiscal consolidations since 1945 requiring a forcing event: three of three. Reserve-currency funding crises since 1945: none of four issuers.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" letter-spacing=\"2.5\">THE COUNTED RECORD<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">every probability in the outlook is anchored to one of these tallies<\/text>\n<text x=\"20\" y=\"86\" font-size=\"10.5\">Regime changes preceded by catastrophe<\/text>\n<rect x=\"404\" y=\"74\" width=\"220\" height=\"16\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<rect x=\"404\" y=\"74\" width=\"220\" height=\"16\" class=\"f-t1 cv-grow-right\" style=\"--d:.05s\"/>\n<text x=\"636\" y=\"87\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">3 / 3<\/text>\n<text x=\"20\" y=\"132\" font-size=\"10.5\">Inflation-targeting regimes abandoned since 1990<\/text>\n<rect x=\"404\" y=\"120\" width=\"220\" height=\"16\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<rect x=\"404\" y=\"120\" width=\"2\" height=\"16\" class=\"f-t2 cv-grow-right\" style=\"--d:.15s\"/>\n<text x=\"636\" y=\"133\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">0 / 28<\/text>\n<text x=\"20\" y=\"178\" font-size=\"10.5\">US industrial programmes surviving a party change<\/text>\n<rect x=\"404\" y=\"166\" width=\"220\" height=\"16\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<rect x=\"404\" y=\"166\" width=\"220\" height=\"16\" class=\"f-t3 cv-grow-right\" style=\"--d:.25s\"/>\n<text x=\"636\" y=\"179\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">4 / 4<\/text>\n<text x=\"20\" y=\"224\" font-size=\"10.5\">Fiscal consolidations needing a forcing event<\/text>\n<rect x=\"404\" y=\"212\" width=\"220\" height=\"16\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<rect x=\"404\" y=\"212\" width=\"220\" height=\"16\" class=\"f-t4 cv-grow-right\" style=\"--d:.35s\"/>\n<text x=\"636\" y=\"225\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">3 / 3<\/text>\n<text x=\"20\" y=\"270\" font-size=\"10.5\">Reserve-currency funding crises since 1945<\/text>\n<rect x=\"404\" y=\"258\" width=\"220\" height=\"16\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<rect x=\"404\" y=\"258\" width=\"2\" height=\"16\" class=\"f-t5 cv-grow-right\" style=\"--d:.45s\"/>\n<text x=\"636\" y=\"271\" font-size=\"11\" font-weight=\"bold\" class=\"t-acc\">0 / 4<\/text>\n<line x1=\"20\" y1=\"294\" x2=\"680\" y2=\"294\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"316\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\" font-style=\"italic\">Two of these tallies are zero, and a zero is the most dangerous number in a forecast.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The forecast's anchors are counts, not intuitions — but the two zeroes do the most work and carry the most risk. No inflation-targeting regime has been abandoned and no reserve-currency issuer has faced a funding crisis since 1945, which is a record of a long peace rather than a law of nature; treating either as impossible is how a forecaster gets surprised.<\/figcaption>\n<\/figure>\n\n\n**Regime changes in the governing framework: 3 in ~250 years.** Classical laissez-faire (c.1820s–1930s), Keynesian demand management (1940s–1970s), monetarist-neoliberal (1979–2008). About one per 65–80 years; roughly 12–15% over a nine-year window.\n\n**Regime changes triggered by catastrophe: 3 of 3.** The Depression, the 1973–79 stagflation, the 2008 financial crisis. There is no counted case of an advanced economy switching governing frameworks in calm conditions, which is why the rupture scenario above is built as a conditional product rather than a standalone number.\n\n**Inflation-targeting abandonment: ~0 of ~28 advanced-economy adopters since 1990.** Adopted by New Zealand in 1990 and spread widely thereafter; modified repeatedly (flexible average inflation targeting, dual-mandate variants) but not abandoned, including through the 2021–23 inflation that tested it directly.\n\n**US industrial programmes surviving a change of party control: 4 of 4, with at least 2 materially truncated.** Sematech (1987, wound down on schedule in 1996), the 2009 clean-energy loan programme, the CHIPS Act (restructured into an equity stake in August 2025 rather than repealed), the IRA (truncated by the One Big Beautiful Bill Act in July 2025 rather than repealed). Small sample; the honest reading is \"persists, reshaped,\" not \"safe.\"\n\n**US fiscal consolidations of ≥2 points of GDP since 1945: 3, all with a forcing event.** 1946–48 (war's end), 1993–98 (bond-market pressure plus a divided-government deal), 2011–2015 (debt-ceiling crisis and the Budget Control Act).\n\n**Reserve-currency funding crises since 1945: 0 of 4 issuers.** The UK's 1976 IMF loan is the nearest analogue and is imperfect. This is the base rate that makes rupture look improbable, and it is exactly the kind of long-peace record that warrants an upward adjustment rather than literal application.\n\n**Lead time from a school's public case to its governing moment: ~20 years, 3 of 3.** Keynes from the 1919 *Economic Consequences of the Peace* to the 1940s; Friedman and the Chicago monetarists from the late 1940s to 1979; the industrial-policy revival from Chang's 2002 *Kicking Away the Ladder* to 2022. This is the constraint that caps the New Entrant scenario.\n\n---\n\n## Prediction Market Snapshot\n\nSwept 8 August 2026. **No market prices this question directly**, on Polymarket, Kalshi, Metaculus, or Manifold, and none plausibly could — \"which school of economic thought shapes policy\" has no observable resolution criterion. What follows are markets on the *conditions* the scenarios depend on, each with the gap to the target question stated.\n\n| Market | Question | Price | Notes |\n| --- | --- | --- | --- |\n| Polymarket | Which party wins the 2028 US presidential election | Democratic 61% / Republican 39% | Volume roughly $2.0M — thin for a market this far out, and the price tracks generic-ballot polling closely enough to be more of a poll aggregator than an independent signal. Bears on whether the industrial-policy apparatus changes hands or changes purpose. |\n| Polymarket | Which party will win the House in 2026 | Democratic ~83% (late July reading) | The most consequential near-term price here. A Democratic House from January 2027 is the appropriations gate every industrial-policy line has to pass through, and it is the mechanism inside the Fiscal Discipline scenario. |\n| Polymarket | Which party will win the Senate in 2026 | Republican ~54.5% | Implies divided government as the modal outcome, with the split-Congress branch of the Balance of Power market around 40.5%. |\n| Polymarket | How many Fed rate cuts in 2026 | Zero cuts 57%; two hikes ~36% | Against a 3.50–3.75% funds rate, headline CPI 3.5% year-on-year in June 2026 and core near 2.6%. The market is pricing a Warsh Fed that holds or tightens, which is the monetary condition the Fiscal Discipline scenario needs. |\n| Polymarket / Kalshi | US recession in 2026 | 28% / 22% | A recession is a trigger for fiscal expansion under any label, and is the most likely route by which deficit-financed stimulus returns without the MMT name attached. Not itself a rupture. |\n\nThe adjustment I make from these prices to the forecast is worth stating plainly. The markets collectively price a divided American government from 2027, a hawkish central bank, and a probable change of presidential party in 2029. That combination is much friendlier to Eclectic Consolidation and to Fiscal Discipline Reassertion than to Security-Industrial Consolidation. A doctrine consolidates when one coalition holds the instruments long enough to institutionalize them, and the market says nobody will.\n\n---\n\n## What Would Change This Forecast\n\nEach of these is observable, dated where possible, and would move the distribution rather than merely feeling significant.\n\n**Toward Security-Industrial Consolidation.** Congress passes a standing tariff or industrial-strategy authority replacing what IEEPA provided before the end of the 2027 session. The federal government takes an equity position in a second and third strategic firm on the Intel template. US semiconductor manufacturing employment rises above its 2023 peak of roughly 401,000. Chips Act 2.0 emerges from the European Council and Parliament with binding money rather than coordination language. China credibly reaches its 80% self-sufficiency target ahead of 2030.\n\n**Toward Fiscal Discipline Reassertion.** A thirty-year Treasury auction fails or tails badly enough to move the long end by more than 25 basis points in a session. A statutory spending-cap regime is attached to a debt-limit increase. The CHIPS-successor and clean-manufacturing lines are allowed to lapse on schedule in an appropriations bill rather than extended. The Warsh Fed's first framework statement adopts a materially more rules-based reaction function.\n\n**Toward Crisis Rupture.** Any direct official action on the shape of the yield curve. A missed federal payment of any size. Inflation re-accelerating above 5% with the funds rate already restrictive. A sustained decline in foreign official Treasury holdings.\n\n**Toward Eclectic Consolidation (that is, reinforcing the modal case).** The 2026 midterms delivering divided government as priced. Appropriations after January 2027 funding industrial-policy lines at roughly flat real levels. The next Fed framework review modifying rather than replacing the targeting regime.\n\n**Toward New Entrant.** Measured US total factor productivity growth exceeding 2% annually for three consecutive years, which would change the debt dynamics enough to make the argument between the other scenarios substantially moot.\n\n---\n\n## Open Questions\n\nWhether the labour bottleneck constraining American fabs is a transitional problem that training pipelines resolve by 2030, or a structural ceiling on how much reshoring subsidy can buy. That is the single most consequential unresolved fact here, and the hinge between the first and second scenarios.\n\nWhether the absence of any exit mechanism in the current industrial-policy programmes — none of the American, European, or Chinese efforts has an institutional test for winding down — turns them into permanent constituencies rather than temporary ladders. And if it does, whether a permanent constituency counts as List's doctrine governing or as its failure.\n\nWhether the fiscal behaviour that Modern Monetary Theory rationalized between 2019 and 2021 returns under a different justification in the next recession. That would make the theory's apparent political defeat a defeat of the label rather than of the practice — a distinction these pages argue matters more than it usually gets credit for.\n\nWhether Germany's March 2025 constitutional exemption of defence borrowing from the debt brake is a bounded emergency measure or the beginning of the end of ordoliberal fiscal doctrine as a live constraint on European policy. The interest line in the German federal budget roughly doubling by 2029 will test this before 2035 does.\n\nWhether a hawkish Federal Reserve chair confirmed on a near-party-line vote strengthens or weakens central-bank independence over a decade, and whether the New Keynesian framework's persistence depends on the institution's political insulation or would survive without it.\n\nAnd whether the eclectic settlement described in the modal scenario is a genuine intellectual position or simply the absence of one — whether \"no school wins\" is a stable governing arrangement or the interval between the last paradigm and the next.\n\n---\n\n## Sources\n\n- Congressional Budget Office, *The Budget and Economic Outlook: 2026 to 2036*, February 2026, cbo.gov/publication/61882 — deficit, debt, and net-interest projections.\n- Committee for a Responsible Federal Budget, analysis of CBO's February 2026 baseline, crfb.org.\n- Peter G. Peterson Foundation, national debt and interest-cost tracker, pgpf.org.\n- Congressional Research Service, \"Supreme Court Rules Against Tariffs Imposed Under the International Emergency Economic Powers Act (IEEPA),\" LSB11398, congress.gov — *Learning Resources, Inc. v. Trump*, 20 February 2026.\n- Tax Foundation, \"Tariff Tracker: 2026 Trump Tariffs & Trade War by the Numbers,\" taxfoundation.org — weighted average applied tariff rate falling from 14.9% to 8.2%; Section 122 substitute tariff and its 24 July 2026 expiry.\n- Freshfields, \"Post-IEEPA Tariff Landscape: New Authorities and the Path to Refunds,\" freshfields.com.\n- Congressional Research Service, \"Semiconductor Fabrication Facilities Funded by the CHIPS Act,\" R49031, updated July 2026, congress.gov.\n- Bloomberg, \"US Semiconductor Labor Shortage Threatens Billions in Chip Factory Investments,\" 7 July 2026, and Semiconductor Industry Association workforce blueprint, semiconductors.org — the 115,000 / 67,000 gap and the 401,000 to 368,400 employment decline.\n- Intel Newsroom and CNBC, August 2025, on the conversion of $8.9 billion in CHIPS awards into a roughly 10% federal equity stake.\n- European Commission, \"Chips Act 2.0,\" digital-strategy.ec.europa.eu, and Council document ST-10094-2026-INIT, June 2026 — the Technological Sovereignty Package.\n- Bruegel, \"Revamping Europe's chips strategy: indispensability, not self-sufficiency,\" bruegel.org; ifo Institute EconPol, February 2026.\n- Bruegel, \"What does German debt brake reform mean for Europe?\", and European Commission economic forecast material on Germany's fiscal framework reform — the €500 billion infrastructure fund and the exemption of defence spending above 1% of GDP.\n- CNBC, \"Kevin Warsh wins Senate confirmation as the next Federal Reserve chair,\" 13 May 2026; Federal Reserve Board press release, 15 May 2026.\n- Fortune and CNBC coverage of the thirty-year Treasury yield above 5% and the Moody's downgrade to Aa1, May 2025 and May 2026.\n- International Monetary Fund, \"Industrial Policy Is Adapting to Crises, but Remains Hard to Implement Effectively,\" 28 May 2026, imf.org.\n- Polymarket: \"Which party wins 2028 US Presidential Election\"; \"Which party will win the House in 2026\"; \"Which party will win the Senate in 2026\"; \"Balance of Power: 2026 Midterms\"; \"How many Fed rate cuts in 2026\" — all pulled 8 August 2026.\n- Kalshi and Polymarket US recession 2026 contracts, pulled 8 August 2026.\n- The eight preceding chapters in these pages, for the institutional record of each school: in particular the accounting of what New Keynesian economics actually runs versus what \"Keynesian\" is credited with, the assessment of List's ghost in the 2020s revival, the Austrian post-2008 inflation-forecasting record, the Chicago School's split verdict after 2008, and the ordoliberal inheritance in German and EU fiscal architecture."}], "glossary": [{"term": "Labor theory of value", "aliases": ["LTV"], "def": "The classical idea that a good's worth is set by the amount of labor needed to produce it — the theory Marx took over from Ricardo and pushed much further."}, {"term": "Comparative advantage", "aliases": [], "def": "Ricardo's finding that two countries both gain from trade even if one is better at making everything, so long as each concentrates on what it is relatively best at."}, {"term": "Surplus value", "aliases": [], "def": "Marx's term for the difference between what workers produce and what they are paid — in his account, the source of profit."}, {"term": "Historical materialism", "aliases": [], "def": "Marx's view that a society's economic structure shapes its politics, law, and ideas rather than the other way around."}, {"term": "Transformation problem", "aliases": [], "def": "The unresolved technical difficulty of converting Marx's labor-based 'values' into actual market prices in a consistent way."}, {"term": "Nomenklatura", "aliases": [], "def": "The list of party-appointed posts in Soviet-style states, and by extension the privileged administrative class that filled them."}, {"term": "Productive powers", "aliases": [], "def": "List's idea that a nation's capacity to produce matters more than the value of what it currently trades."}, {"term": "Infant industry protection", "aliases": ["infant-industry"], "def": "Temporarily shielding a new domestic industry from foreign competition until it is strong enough to compete unaided."}, {"term": "Zollverein", "aliases": [], "def": "The German customs union founded in 1834 that removed tariffs between German states and helped knit them into one market."}, {"term": "Methodenstreit", "aliases": [], "def": "The 1880s dispute over method between economists who wanted universal deductive laws and those who insisted economics must be built from historical study."}, {"term": "Developmental state", "aliases": [], "def": "A government that actively steers industrial growth through planning, credit, and protection, as in postwar Japan, South Korea, and Taiwan."}, {"term": "Import substitution industrialization", "aliases": ["ISI"], "def": "A strategy of replacing imported manufactured goods with domestically produced ones behind tariff walls."}, {"term": "Effective demand", "aliases": [], "def": "Keynes's term for the total spending actually present in an economy, which he argued can settle too low to employ everyone."}, {"term": "Liquidity preference", "aliases": [], "def": "Keynes's explanation of interest rates as the price of persuading people to part with cash they would rather hold."}, {"term": "The multiplier", "aliases": [], "def": "The idea that one unit of new spending raises total income by more than one unit, as each recipient spends part of it onward."}, {"term": "Animal spirits", "aliases": [], "def": "Keynes's phrase for the instinctive confidence or fear that drives investment decisions beyond what calculation justifies."}, {"term": "Say's Law", "aliases": [], "def": "The classical proposition, often condensed as 'supply creates its own demand,' that production generates the income to buy what is produced."}, {"term": "Neoclassical synthesis", "aliases": [], "def": "The postwar merger of Keynes's macroeconomics with conventional supply-and-demand microeconomics, taught through the IS-LM model."}, {"term": "IS-LM model", "aliases": ["IS/LM"], "def": "Hicks's diagram summarizing Keynes by showing where the goods market and the money market are simultaneously in balance."}, {"term": "DSGE model", "aliases": ["DSGE", "dynamic stochastic general equilibrium"], "def": "The class of computer models central banks use to simulate an economy of forward-looking households and firms hit by random shocks."}, {"term": "New Keynesian economics", "aliases": [], "def": "The modern school that keeps rational, forward-looking agents but assumes prices and wages adjust slowly, leaving room for policy to matter."}, {"term": "Post-Keynesian economics", "aliases": [], "def": "A more radical Keynesian branch, associated with Minsky, that stresses genuine uncertainty and the financial system's tendency to generate crises."}, {"term": "Financial instability hypothesis", "aliases": ["Minsky moment"], "def": "Minsky's argument that long periods of stability encourage the borrowing that eventually produces a crash."}, {"term": "Praxeology", "aliases": [], "def": "Mises's method of deriving economic laws logically from the premise that people act purposefully, without testing them against data."}, {"term": "Socialist calculation problem", "aliases": ["calculation debate", "calculation problem"], "def": "The argument that without real market prices a central planner has no way to know which uses of resources are worthwhile."}, {"term": "Spontaneous order", "aliases": [], "def": "Hayek's idea that useful social arrangements can emerge from many individual actions without anyone designing them."}, {"term": "Malinvestment", "aliases": [], "def": "Investment that looks profitable only because interest rates were held artificially low, and turns out to be waste when they rise."}, {"term": "Austrian business cycle theory", "aliases": ["ABCT"], "def": "The Austrian account of booms and busts as the product of credit expansion misleading investors about real saving."}, {"term": "Regression theorem", "aliases": [], "def": "Mises's argument that a money's value traces back to its earlier value as an ordinary commodity — invoked by some Austrians against Bitcoin."}, {"term": "Monetarism", "aliases": [], "def": "The view, associated with Friedman, that the quantity of money is the dominant influence on inflation and the business cycle."}, {"term": "Quantity theory of money", "aliases": [], "def": "The proposition that, other things equal, changes in the money supply transla
