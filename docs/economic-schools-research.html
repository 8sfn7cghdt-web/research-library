te into changes in the price level."}, {"term": "Natural rate of unemployment", "aliases": [], "def": "The unemployment rate an economy settles at once inflation is fully anticipated — below which, Friedman argued, stimulus only raises prices."}, {"term": "Phillips curve", "aliases": [], "def": "The observed short-run trade-off between unemployment and inflation, which broke down in the 1970s."}, {"term": "Stagflation", "aliases": [], "def": "The combination of stagnant growth, high unemployment, and high inflation that the postwar models said should not occur together."}, {"term": "Rational expectations", "aliases": [], "def": "The assumption that people form forecasts using all available information, so predictable policy loses much of its effect."}, {"term": "Lucas critique", "aliases": [], "def": "The warning that statistical relationships in economic data will shift once policy changes, because people change their behaviour in response."}, {"term": "Efficient markets hypothesis", "aliases": ["EMH"], "def": "The claim that asset prices already reflect all available information, so consistently beating the market is not possible."}, {"term": "Inflation targeting", "aliases": [], "def": "The now-standard central-bank framework of publicly committing to a numerical inflation goal and setting rates to hit it."}, {"term": "Washington Consensus", "aliases": [], "def": "The package of liberalization, privatization, and fiscal discipline that the IMF and World Bank pressed on indebted countries from the 1980s."}, {"term": "Structural adjustment", "aliases": [], "def": "Loan conditions requiring a borrowing government to cut spending, privatize, and open markets in exchange for financing."}, {"term": "Chicago Boys", "aliases": [], "def": "The Chilean economists trained at the University of Chicago who designed and ran Pinochet-era economic policy."}, {"term": "El Ladrillo", "aliases": [], "def": "The economic blueprint Chilean free-market economists finished just before the 1973 coup and handed to the military the day after."}, {"term": "Negative income tax", "aliases": ["NIT"], "def": "Friedman's proposal to replace welfare programs with automatic cash top-ups for people earning below a threshold."}, {"term": "Ordoliberalism", "aliases": [], "def": "The German doctrine that government's job is to write and enforce strict rules keeping markets competitive, rather than to plan or stand aside."}, {"term": "Social market economy", "aliases": ["soziale Marktwirtschaft"], "def": "The postwar West German model pairing competitive markets with a strong legal framework and social protections."}, {"term": "Wirtschaftswunder", "aliases": ["economic miracle"], "def": "West Germany's rapid postwar recovery, conventionally dated from Erhard's 1948 currency reform."}, {"term": "Ordnungspolitik", "aliases": ["Ordo"], "def": "Policy aimed at setting the framework rules within which markets operate, as opposed to intervening in particular outcomes."}, {"term": "Debt brake", "aliases": ["Schuldenbremse"], "def": "The German constitutional limit on government borrowing, substantially reformed in March 2025 to exempt defence spending."}, {"term": "Outright Monetary Transactions", "aliases": ["OMT"], "def": "The ECB's 2012 bond-buying backstop, announced alongside Draghi's 'whatever it takes' pledge and opposed by the Bundesbank."}, {"term": "Conspicuous consumption", "aliases": [], "def": "Veblen's term for buying visibly expensive things mainly to display status rather than for their use."}, {"term": "Transaction cost", "aliases": [], "def": "The cost of arranging and enforcing an exchange — searching, bargaining, contracting — which Coase used to explain why firms exist."}, {"term": "New Institutional Economics", "aliases": ["NIE"], "def": "The Nobel-winning tradition of Coase, North, and Williamson analysing how property rights, contracts, and institutions shape economic outcomes."}, {"term": "Hold-up problem", "aliases": [], "def": "The risk that once one party has made an investment specific to a relationship, the other can renegotiate to grab the gains."}, {"term": "Modern Monetary Theory", "aliases": ["MMT"], "def": "The view that a government issuing its own currency is constrained by inflation and real resources rather than by any risk of running out of money."}, {"term": "Chartalism", "aliases": [], "def": "The theory that money has value because the state accepts it for taxes, not because of any commodity backing."}, {"term": "Functional finance", "aliases": [], "def": "Lerner's rule that taxing and spending should be judged by their effect on employment and inflation, not by whether the budget balances."}, {"term": "Prospect theory", "aliases": [], "def": "Kahneman and Tversky's finding that people judge gains and losses against a reference point and feel losses about twice as keenly."}, {"term": "Loss aversion", "aliases": [], "def": "The tendency to weigh a loss more heavily than an equivalent gain."}, {"term": "Nudge", "aliases": ["choice architecture", "libertarian paternalism"], "def": "Changing how options are presented so people make better choices, without removing any option."}, {"term": "Industrial policy", "aliases": [], "def": "Deliberate government action to build up particular industries through subsidy, protection, procurement, or ownership."}, {"term": "CHIPS Act", "aliases": [], "def": "The 2022 US law funding domestic semiconductor manufacturing, research, and workforce development."}, {"term": "Inflation Reduction Act", "aliases": ["IRA"], "def": "The 2022 US law whose clean-energy tax credits became the largest piece of American industrial policy, partly rolled back in 2025."}, {"term": "IEEPA", "aliases": ["International Emergency Economic Powers Act"], "def": "The emergency statute used to impose broad tariffs until the Supreme Court struck that use down in February 2026."}, {"term": "Base rate", "aliases": [], "def": "How often something has actually happened in comparable past cases — the anchor a forecast is built from rather than guessing."}, {"term": "Marginal revolution", "aliases": ["marginalism"], "def": "The 1870s shift to explaining value by the usefulness of one additional unit to a buyer, displacing the labor theory of value."}, {"term": "Physiocrats", "aliases": [], "def": "The 18th-century French school holding that land and agriculture were the true source of a nation's wealth."}, {"term": "Laissez-faire", "aliases": [], "def": "The doctrine that government should leave markets substantially alone."}, {"term": "Corn Laws", "aliases": [], "def": "British tariffs on imported grain, repealed in 1846 in the defining victory of free-trade politics."}, {"term": "Fiscal policy", "aliases": [], "def": "A government's use of taxing and spending to influence the economy."}, {"term": "Monetary policy", "aliases": [], "def": "A central bank's use of interest rates and the money supply to influence inflation and employment."}, {"term": "Central bank", "aliases": [], "def": "The public institution that issues a country's currency and sets its interest rates, such as the US Federal Reserve."}, {"term": "Business cycle", "aliases": [], "def": "The recurring swing of an economy between expansion and recession."}, {"term": "General equilibrium", "aliases": ["GE"], "def": "A model solving all markets in an economy at once, rather than one market in isolation."}, {"term": "Pareto efficiency", "aliases": [], "def": "An allocation where nobody can be made better off without making someone worse off — a standard that says nothing about fairness."}, {"term": "First welfare theorem", "aliases": [], "def": "The result that a competitive market equilibrium is efficient in the Pareto sense."}, {"term": "Second welfare theorem", "aliases": [], "def": "The result that any efficient allocation can be reached by markets after suitable lump-sum transfers."}, {"term": "Sonnenschein–Mantel–Debreu theorem", "aliases": ["SMD"], "def": "The finding that individual rationality places almost no constraint on market-level demand, so equilibrium need not be unique or stable."}, {"term": "Reswitching", "aliases": [], "def": "The possibility that the same production technique is most profitable at both high and low interest rates, breaking the neat link between capital and interest."}, {"term": "Solow residual", "aliases": [], "def": "The part of economic growth left unexplained after accounting for more capital and more labor — conventionally read as technical progress."}, {"term": "Creative destruction", "aliases": [], "def": "Schumpeter's term for innovation that destroys existing firms and industries while building their replacements."}, {"term": "Credibility revolution", "aliases": [], "def": "Economics' turn toward research designs that can credibly identify cause and effect, rather than relying on theory alone."}, {"term": "Top five", "aliases": [], "def": "The five journals whose publication decisions function as the de facto tenure standard in academic economics."}, {"term": "Big push", "aliases": [], "def": "The argument that a poor country must industrialize many sectors at once, because each provides the others' customers."}, {"term": "Dual-sector model", "aliases": ["Lewis model"], "def": "Lewis's account of development as surplus rural labor moving into a modern sector at roughly constant wages."}, {"term": "Lewis turning point", "aliases": [], "def": "The moment surplus rural labor runs out and wages begin to rise."}, {"term": "Prebisch–Singer hypothesis", "aliases": [], "def": "The claim that commodity exporters face a long-run decline in what their exports buy in manufactured goods."}, {"term": "Structuralism", "aliases": [], "def": "The view that underdevelopment reflects a country's structural position in the world economy, not merely bad policy."}, {"term": "Dependency theory", "aliases": [], "def": "The argument that poor countries are kept poor by the terms of their integration into the world economy, not by exclusion from it."}, {"term": "Entitlement (Sen)", "aliases": [], "def": "What a person can lawfully obtain with what they own or earn — whose collapse, Sen showed, causes famine even when food is available."}, {"term": "Capability approach", "aliases": ["capabilities"], "def": "Judging development by what people are actually free to be and do, rather than by income or satisfaction."}, {"term": "Human Development Index", "aliases": ["HDI"], "def": "The UNDP's composite measure combining life expectancy, schooling and income."}, {"term": "External validity", "aliases": [], "def": "Whether a result found in one place and time also holds elsewhere — the central objection to randomized trials in development."}, {"term": "Production boundary", "aliases": [], "def": "The national-accounting rule deciding what counts as economic production and what does not."}, {"term": "Satellite account", "aliases": [], "def": "A supplementary set of national accounts that measures something excluded from headline GDP without changing it."}, {"term": "Child penalty", "aliases": [], "def": "The persistent fall in a mother's earnings after a first birth, relative to a comparable father's."}, {"term": "Steady-state economy", "aliases": [], "def": "An economy designed to hold its material throughput constant rather than grow it."}, {"term": "Integrated assessment model", "aliases": ["IAM", "DICE"], "def": "A model coupling the climate system to economic growth to price climate policy."}, {"term": "Discount rate (climate)", "aliases": [], "def": "The weight placed on future welfare against present welfare — the parameter that drives most disagreement in climate economics."}, {"term": "Planetary boundaries", "aliases": [], "def": "Nine Earth-system limits proposed as a safe operating space for humanity; six are assessed as crossed."}, {"term": "Decoupling", "aliases": [], "def": "Economic output growing without a matching rise in resource use or emissions."}, {"term": "Public choice", "aliases": [], "def": "The application of economic analysis to voters, politicians and officials, assuming they pursue their own interests like anyone else."}, {"term": "Constitutional economics", "aliases": [], "def": "The study of the rules that constrain policy, rather than of policies themselves."}, {"term": "Rational ignorance", "aliases": [], "def": "The finding that it is individually reasonable not to research issues when one vote is very unlikely to decide anything."}, {"term": "Rent-seeking", "aliases": [], "def": "Spending real resources to obtain a privilege or protection rather than to produce anything."}, {"term": "Regulatory capture", "aliases": [], "def": "Regulation coming to serve the industry it was meant to constrain."}, {"term": "Bloomington School", "aliases": [], "def": "Elinor and Vincent Ostrom's research program showing communities can govern shared resources without either privatization or state control."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  var sceneData = document.getElementById('reader-scenes-data');
  var sceneHtmls = [];
  if (sceneData) {
    try { sceneHtmls = JSON.parse(sceneData.textContent || '[]') || []; } catch (e) { sceneHtmls = []; }
  }
  if (sceneHtmls.length && h1) {
    var sceneTpl = document.createElement('template');
    sceneTpl.innerHTML = sceneHtmls[current % sceneHtmls.length] || '';
    if (sceneTpl.content && sceneTpl.content.firstElementChild) {
      well.insertAdjacentElement('afterend', sceneTpl.content.firstElementChild.cloneNode(true));
    }
  }
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {
  let h = document.getElementById('kbd-help');
  if (!h) {
    h = document.createElement('div'); h.id = 'kbd-help';
    h.innerHTML = '<div class="kh"><h3>Keyboard</h3><dl>'
      + '<dt>⌘K</dt><dd>command palette</dd>'
      + '<dt>← / k</dt><dd>previous chapter</dd>'
      + '<dt>→ / j</dt><dd>next chapter</dd>'
      + '<dt>g g</dt><dd>first chapter</dd>'
      + '<dt>g e</dt><dd>last chapter</dd>'
      + '<dt>Z</dt><dd>focus mode</dd>'
      + '<dt>?</dt><dd>this help</dd></dl></div>';
    h.addEventListener('click', (ev) => { if (ev.target === h) toggleHelp(); });
    document.body.appendChild(h);
  }
  h.classList.toggle('open');
}

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
const menuBtn = document.getElementById('menu-btn');
menuBtn.onclick = () => document.body.classList.toggle('menu-open');
function closeMenu() { document.body.classList.remove('menu-open'); }

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}
function chunkText(t) {
  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);
  return out;
}
function pickVoice() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  const name = sel && sel.value;
  const vs = synth.getVoices();
  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');

// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text

      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
