, preprints, and the collapse of the\njournal's monopoly on distribution is genuinely uncertain, and the evidence on tenure practice\nlags the evidence on how research is actually read. Whether machine learning and the\navailability of administrative microdata are producing a further methodological turn — one that\nprivileges prediction over the causal identification the credibility revolution prized — is\nvisibly under way in published work but too recent to assess against tenure and promotion\noutcomes. And the deepest open question is whether a discipline whose welfare criterion cannot\nrank distributions can continue to serve as the authoritative language of public economic\nargument in a period whose central political disputes are distributional.\n\n## Sources\n\n- Alfred Marshall, *Principles of Economics* (1890) — primary text (Tier 1).\n- Léon Walras, *Elements of Pure Economics* (1874/1877) — primary text, characterized via secondary histories of general-equilibrium theory (Tier 1/2).\n- Paul A. Samuelson, *Foundations of Economic Analysis* (Harvard University Press, 1947) — primary text (Tier 1).\n- Paul A. Samuelson, *Economics: An Introductory Analysis* (1st ed. 1948; 19 editions through 2009) — primary text; publication and circulation history via Nobel Foundation biographical materials and publisher records (Tier 1/2).\n- Nobel Foundation, biographical and prize documentation for the 1970 Prize in Economic Sciences (Samuelson), nobelprize.org (Tier 1, primary).\n- Kenneth J. Arrow and Gérard Debreu, \"Existence of an Equilibrium for a Competitive Economy,\" *Econometrica* 22, no. 3 (July 1954): 265-290 — primary text (Tier 1).\n- The Econometric Society, publication record for the 1954 Arrow-Debreu paper, econometricsociety.org (Tier 1, primary/institutional).\n- John Geanakoplos, \"Kenneth Arrow's Contributions to General Equilibrium,\" Econometric Society memorial essay, econometricsociety.org (Tier 2, scholarly).\n- Kenneth J. Arrow, \"Uncertainty and the Welfare Economics of Medical Care,\" *American Economic Review* (1963) — primary text, cited for Arrow's own work on the failure conditions of the welfare theorems (Tier 1).\n- Hugo Sonnenschein (1972, 1973), Rolf Mantel (1974), and Gérard Debreu (1974) on aggregate excess demand — the Sonnenschein-Mantel-Debreu results, characterized via secondary summaries in the general-equilibrium literature (Tier 1/2).\n- Piero Sraffa, *Production of Commodities by Means of Commodities* (Cambridge University Press, 1960) — primary text (Tier 1).\n- Paul A. Samuelson, \"A Summing Up,\" *Quarterly Journal of Economics* 80, no. 4 (1966): 568-583 — primary text; Samuelson's concession on reswitching (Tier 1).\n- Avi J. Cohen and G. C. Harcourt, \"Retrospectives: Whatever Happened to the Cambridge Capital Theory Controversies?,\" *Journal of Economic Perspectives* (2003) — peer-reviewed retrospective (Tier 2).\n- *European Journal of Economics and Economic Policies*, \"The Cambridge-Cambridge controversy on the theory of capital: 50 years after\" (2020) — peer-reviewed, heterodox-leaning journal, lean noted (Tier 2/5).\n- Robert M. Solow, \"A Contribution to the Theory of Economic Growth,\" *Quarterly Journal of Economics* (1956), and \"Technical Change and the Aggregate Production Function,\" *Review of Economics and Statistics* (1957) — primary texts (Tier 1).\n- Nobel Foundation, 1987 Prize in Economic Sciences (Solow), \"for his contributions to the theory of economic growth,\" nobelprize.org (Tier 1, primary).\n- Joseph A. Schumpeter, *The Theory of Economic Development* (1911; English ed. 1934) and *Capitalism, Socialism and Democracy* (1942) — primary texts (Tier 1).\n- Paul M. Romer, \"Endogenous Technological Change,\" *Journal of Political Economy* (1990) — primary text (Tier 1).\n- Philippe Aghion and Peter Howitt, \"A Model of Growth Through Creative Destruction,\" *Econometrica* 60, no. 2 (March 1992): 323-351 — primary text (Tier 1).\n- Nobel Foundation, press release for the 2025 Prize in Economic Sciences to Joel Mokyr, Philippe Aghion, and Peter Howitt, October 13, 2025, nobelprize.org (Tier 1, primary).\n- American Economic Association, announcement of the 2025 Nobel Prize in Economic Sciences, aeaweb.org (Tier 2, institutional).\n- CEPR/VoxEU, \"Sustained growth through creative destruction: Nobel laureates Philippe Aghion and Peter Howitt,\" cepr.org (Tier 2, research-institution outlet).\n- Joshua D. Angrist and Jörn-Steffen Pischke, \"The Credibility Revolution in Empirical Economics,\" *Journal of Economic Perspectives* 24, no. 2 (2010): 3-30 — peer-reviewed (Tier 2).\n- Joshua Angrist, Pierre Azoulay, Glenn Ellison, Ryan Hill, and Susan Feng Lu, \"Economic Research Evolves: Fields and Styles,\" *American Economic Review* Papers and Proceedings 107, no. 5 (2017): 293-297 — peer-reviewed (Tier 2).\n- Nobel Foundation, 2021 Prize in Economic Sciences (Card, Angrist, Imbens), nobelprize.org (Tier 1, primary).\n- David Card and Alan B. Krueger, \"Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania,\" *American Economic Review* (1994) — primary text (Tier 1).\n- Paul M. Romer, \"Mathiness in the Theory of Economic Growth,\" *American Economic Review* Papers and Proceedings (2015), aeaweb.org (Tier 2).\n- Paul M. Romer, \"The Trouble with Macroeconomics\" (2016), paulromer.net — author's own working paper, position stated as his (Tier 1/6).\n- James J. Heckman and Sidharth Moktan, \"Publishing and Promotion in Economics: The Tyranny of the Top Five,\" *Journal of Economic Literature* 58, no. 2 (2020): 419-470 — peer-reviewed (Tier 2).\n- American Economic Association, Committee on the Status of Women in the Economics Profession, 2024 Annual Report and annual survey series, aeaweb.org (Tier 1/2, institutional primary).\n\n## Glossary\n\n**Partial equilibrium**: Marshall's method of analyzing one market at a time while holding conditions in all other markets constant — the source of the standard supply-and-demand diagram.\n\n**General equilibrium**: the analysis of all markets simultaneously, in which every price depends on every other; Walras's project, proved consistent by Arrow and Debreu in 1954.\n\n**Tâtonnement**: Walras's imagined \"groping\" process in which prices are called out and adjusted until all markets balance, with no trading permitted until they do.\n\n**Pareto efficiency**: a state in which no one can be made better off without making someone worse off; the mainstream's core efficiency criterion, and one that says nothing about fairness of distribution.\n\n**First welfare theorem**: the proposition that any competitive equilibrium is Pareto efficient — the formal version of the invisible-hand claim, valid only under stringent conditions.\n\n**Second welfare theorem**: the proposition that any efficient allocation can be achieved by competitive markets after a lump-sum redistribution of initial endowments.\n\n**Sonnenschein-Mantel-Debreu theorem**: the result that individual rationality places almost no restriction on the shape of aggregate market demand, undermining guarantees of a unique or stable equilibrium.\n\n**Reswitching**: the demonstration that one production technique can be the most profitable at both high and low interest rates with another preferred in between, which breaks the neoclassical link between the interest rate and the amount of capital used.\n\n**Solow residual**: the portion of measured growth in output per worker that cannot be explained by increases in capital or labor, conventionally attributed to technical change.\n\n**Creative destruction**: Schumpeter's term for the process by which innovation continuously destroys existing firms, products, and structures while building their replacements.\n\n**Credibility revolution**: the shift, from roughly 1990, toward research designs — natural experiments, instrumental variables, regression discontinuity — that can support causal claims rather than mere correlations.\n\n**Top five**: the five journals whose acceptance functions as the de facto tenure standard in elite US economics departments."}, {"order": 10, "file": "10_Development_Economics.md", "title": "Development Economics: The Field That Kept Changing Its Mind", "summary": "", "body": "# Development Economics: The Field That Kept Changing Its Mind\n\n## Bottom Line\n\nDevelopment economics is the one subfield in this survey where the schools' arguments were\nsettled, repeatedly, on populations of hundreds of millions of people who had no say in which\ndoctrine was ascendant when their country's five-year plan was written. That fact should\ndiscipline how its history is told. Between roughly 1943 and 1970 the field's ruling assumption\nwas that poor countries were poor because of coordinated market failures a private investor\ncould not solve alone, and that the remedy was a big push of state-directed investment; the\npolicies that followed — infant-industry protection, planned heavy industry, import substitution\n— produced real industrial capacity and real, recurring balance-of-payments crises. Between\nroughly 1980 and 1998 the ruling assumption inverted: poor countries were poor because their\nstates had distorted prices, and the remedy was stabilization, liberalization, and privatization\ndelivered through the conditionality of lending institutions, a program whose African record in\nparticular is the strongest available evidence that a correct-sounding doctrine imposed by\ncreditors on debtors is not the same thing as a development strategy. Since about 2000 the field\nhas retreated from grand theory in two opposite directions at once: upward, to Amartya Sen's\nargument that development should be measured as the expansion of what people are actually able\nto do rather than as income growth — an argument that captured the United Nations' flagship\nstatistic and thereby changed what \"development\" officially means — and downward, to the\nrandomized controlled trial, which delivered credible answers to narrow questions about\ndeworming and microcredit while conspicuously declining to answer the question of why some\nnations grow rich. The uncomfortable summary is that the field's methodological rigor has\nincreased in near-inverse proportion to the size of the questions it is willing to ask. And in\n2025 and 2026 the ground shifted underneath the entire enterprise: the United States dismantled\nits development agency, Britain, Germany, and others cut in the same window, and the applied\nside of the field lost both its principal funder and its principal client.\n\n## The Founding Problem: Coordination, and a Cold War\n\nDevelopment economics began as a distinct field in the 1940s and 1950s for reasons that were\nhalf intellectual and half geopolitical. The intellectual reason was that the standard price\ntheory of the day had almost nothing to say about a country with no capital market, an agrarian\nlabor surplus, and no industrial base. The geopolitical reason was decolonization: dozens of new\nstates were choosing an economic model in a world where the Soviet Union offered a visible and,\nin the 1950s, apparently successful alternative. Development advice was never a neutral technical\nservice; it was one of the instruments of the Cold War, and both blocs understood it that way.\n\nPaul Rosenstein-Rodan's 1943 article in the *Economic Journal* on the industrialization of\nEastern and South-Eastern Europe supplied the founding argument, later known as the big push.\nHis observation was a coordination failure: a single shoe factory in a poor region will fail,\nbecause its own workers cannot buy enough shoes to sustain it and no other industry exists whose\nworkers can. Build twenty factories simultaneously and each becomes the market for the others.\nSince no private investor will move first, the coordinating agent must be the state or an\nexternal lender. This is a genuine market-failure argument, expressible in the mainstream's own\nterms, and it retains defenders; it is also, in practice, an argument that can justify almost any\namount of state-directed investment, and it was used that way.\n\nW. Arthur Lewis supplied the field's most influential model in \"Economic Development with\nUnlimited Supplies of Labour\" (*The Manchester School*, 1954). Lewis — born in St. Lucia,\neducated at the London School of Economics, later the only Black laureate in the history of the\neconomics Nobel, which he received in 1979 jointly with Theodore Schultz for pioneering research\ninto economic development — described a poor economy as two sectors rather than one. A\ntraditional, largely agricultural sector holds labor whose marginal product is near zero; a\nmodern capitalist sector can hire from it at a roughly constant wage without bidding wages up,\nbecause the supply is effectively unlimited. Profits in the modern sector are reinvested,\nthe sector expands, labor transfers, and growth continues until the surplus is exhausted and\nwages begin to rise — the \"Lewis turning point,\" a term still used in analyses of Chinese\nlabor markets seventy years later.\n\nThe Lewis model's power is that it makes the central development question a question about\nstructural transformation rather than about efficiency at the margin. Its weakness is what\nhappened when it met the cities. The predicted absorption of rural labor into modern industry\noccurred far more slowly than the migration did, and the result across much of Latin America,\nSouth Asia, and Africa was not a two-sector economy converging on one but a new dualism between\nformal and informal urban employment — a critique developed extensively in the subsequent\nliterature and one Lewis himself did not anticipate. The model also treats \"surplus labor\" as an\nidentifiable quantity in ways later empirical work found difficult to pin down, which limited its\nusefulness for actual measurement.\n\n## The View from the Periphery: Prebisch, Singer, and Structuralism\n\nThe field's first genuinely non-Western school of thought — in origin, personnel, and grievance —\nformed around the United Nations Economic Commission for Latin America, established in 1948 and\nled from 1950 by the Argentine economist Raúl Prebisch. Its founding document, Prebisch's 1950\nreport on the economic development of Latin America and its principal problems, together with\nHans Singer's independently published argument of the same year, produced the claim that carries\nboth names.\n\nThe Prebisch-Singer hypothesis holds that the terms of trade between primary commodities and\nmanufactured goods decline over the long run: a ton of copper or a sack of coffee buys fewer\nmachine tools each decade. If true, a country specializing according to its comparative advantage\nin raw materials — precisely what Ricardian trade theory recommends, as the chapter on classical\nfoundations sets out — is specializing into relative impoverishment, and the gains from\ntechnical progress accrue to the industrial center rather than the commodity periphery. The\npolicy conclusion drawn across Latin America was import-substituting industrialization: tariffs,\nquotas, overvalued exchange rates favoring capital-goods imports, and state-owned enterprises to\nbuild a domestic manufacturing base behind the wall. This is List's argument, treated in the\nchapter on the national school, arriving in the Southern Hemisphere by a different road and with\na statistical apparatus attached.\n\nThe empirical status of the hypothesis is genuinely contested and worth stating precisely,\nbecause both its supporters and its critics routinely overclaim. The most careful long-run test —\nDavid Harvey and colleagues' study of four centuries of commodity price data, published in 2010 —\nfound a significant secular decline in relative prices for eleven of twenty-five commodities\nexamined, with no significant trend in most of the rest. That is meaningful support for a weaker\nversion of the thesis (a substantial share of commodities do lose ground to manufactures over\nvery long horizons) and clear refutation of the strong version (that this is a general law\ngoverning all primary exports). Later work using dynamic regime methods finds the decline\nconcentrated in particular periods rather than continuous. The policy inference is weaker still:\neven if commodity terms of trade decline, it does not follow that protected domestic\nmanufacturing is the best response, as against export diversification, sovereign wealth funds,\nor investment in human capital.\n\nWhat import substitution actually did once it held institutional power is the more useful\nquestion. Through the 1950s and 1960s the Latin American record was creditable on growth and\nindustrial output; Brazil and Mexico built genuine manufacturing sectors that had not existed\nbefore. The recurrent failure was on the external account: protected industries needed imported\ncapital goods, protection suppressed exports by taxing them implicitly through the exchange rate,\nand the resulting foreign-currency gap was bridged by borrowing. That borrowing is what made the\n1980s debt crisis possible, and the crisis is what handed the institutional levers to the\ncounter-revolution described in the chapter on monetarism and neoliberalism. Structuralism did\nnot lose an academic argument in 1982. It lost its creditors.\n\n## Dependency Theory, and What Happened When It Governed\n\nStructuralism's radical wing became dependency theory, which recast the terms-of-trade claim as a\nclaim about power. In the writing of André Gunder Frank, and in the more careful formulation of\nFernando Henrique Cardoso and Enzo Faletto's *Dependency and Development in Latin America*\n(1969), underdevelopment was not a stage that poor countries had yet to pass through but a\ncondition actively produced by their insertion into a world system: the periphery's surplus is\nextracted to the center, and local elites are junior partners in the arrangement rather than a\nfrustrated national bourgeoisie. The chapter on Marx and his critics traces the theory's Marxist\nlineage; the point here is what it did in office.\n\nCardoso became president of Brazil in 1995 and served until 2003. The policies of his\ngovernment — the Plano Real stabilization that finally broke Brazilian hyperinflation, a large\nprivatization program, and openness to foreign capital — were, by any reading, the orthodox\npackage his own earlier work had described as the mechanism of dependency. Cardoso's defense,\noffered repeatedly, was that his scholarship had never been the deterministic version of the\ntheory attributed to him, that dependency in his formulation always allowed for\n\"associated-dependent development,\" and that the practical question in 1994 was inflation running\nat multiple thousands of percent. His critics on the left, including the analysis in *New Left\nReview* of what it called Brazil's \"neo-dependency,\" argued that whatever the theoretical\nnuance, the government's actual program abandoned the class-alliance strategy the theory implied\nin favor of full-fledged neoliberalism.\n\nBoth readings can be right at once, and the case is worth dwelling on because it is the cleanest\nillustration in this survey of a general pattern. Doctrines that are coherent as critiques of an\nexisting order frequently have no operational content when their authors acquire the finance\nministry, because governing under a balance-of-payments constraint imposes a short list of\navailable actions that is largely independent of the governor's theory of history. That is not a\nrefutation of dependency theory as analysis. It is evidence that being right about how a system\ndistributes power does not by itself generate a program for a government inside that system.\n\n## Planning in the World's Largest Democracy\n\nIndia ran the largest and longest experiment in the field's founding doctrine, and its trajectory\nis the best available test case because both the strategy and its reversal are so well\ndocumented.\n\nThe strategy came from a statistician rather than an economist. Prasanta Chandra Mahalanobis, the\nfounder of the Indian Statistical Institute, supplied the framework for the Second Five-Year\nPlan (1956-61): an input-output model in which investment is directed first at heavy industry\nand capital goods — the machines that make machines — on the reasoning that a country able to\nproduce its own capital equipment can subsequently produce anything, while a country that imports\nits machines remains permanently dependent on export earnings it does not control. Public\ninvestment flowed to the steel plants at Bhilai, Rourkela, and Durgapur, and the statistical\napparatus provided the intellectual foundation for the industrial licensing system that became\nknown as the licence raj.\n\nThe strategy had a serious contemporaneous rival inside India, which is often forgotten. C. N.\nVakil and P. R. Brahmananda argued for a \"wage-goods\" model: prioritize consumer goods and\nlabor-intensive production, on the grounds that a poor economy's binding constraint is the supply\nof things workers actually consume, and that capital-deepening in heavy industry generates\npurchasing power without generating anything to buy, which is a recipe for inflation and food\nshortage. The subsequent record — foreign-exchange crises by 1957-58, chronic agricultural\nshortfall, employment growth lagging far behind output growth because the favored sectors were\ncapital-intensive — is closer to what the Vakil-Brahmananda critique predicted than to what the\nplan promised. The framework nonetheless governed Indian policy in broad outline until the\nbalance-of-payments crisis of 1991 forced the liberalization associated with Manmohan Singh.\n\nThe insider's reading of the licence raj is about who captured it. A system in which industrial\nexpansion requires a government permit creates an asset — the permit — whose value is set by\nscarcity and allocated by officials. The predictable result, and the documented one, was that\nincumbent industrial houses with access to Delhi were the principal beneficiaries of a policy\nregime designed in the name of national self-reliance and social equity. That is a public-choice\nobservation, and the chapter on public choice takes up the general argument; it is offered here\nbecause the Indian case is the one where the doctrine's defenders and its critics have the most\ndata to argue over and where both sides have real points. Indian industrial capability in 1991\nwas vastly greater than in 1947, and the machine-tool, pharmaceutical, and space capacities built\nunder planning underwrote much of the growth that followed liberalization. It is also true that\nIndian per-capita growth for three decades ran well below what East Asian economies achieved over\nthe same period with a different mix of state direction and export discipline.\n\n## The Counter-Revolution and Its African Record\n\nThe doctrinal reversal of 1980-1998 is treated in the chapter on monetarism, the Chicago School,\nand the Washington Consensus, and is not re-narrated here. What belongs in a history of\ndevelopment economics specifically is the mechanism and the record.\n\nThe mechanism was conditionality. The 1981 World Bank report on accelerated development in\nsub-Saharan Africa — universally known as the Berg Report after its lead author — reframed\nAfrican stagnation as a problem of domestic policy error rather than of external conditions:\novervalued exchange rates, taxed agriculture, bloated public sectors. Structural adjustment\nlending followed, and the doctrine acquired something no previous development school had\npossessed, which was direct leverage over the fiscal decisions of sovereign borrowers who had no\nalternative creditor.\n\nThe record is not uniform and honest assessment requires saying so. Some macroeconomic\ndistortions the program targeted were real and damaging; agricultural marketing boards paying\nfarmers a fraction of world prices were a genuine mechanism of rural impoverishment, and their\nreform helped. But the aggregate outcome for sub-Saharan Africa across the 1980s and 1990s was\ntwo decades of stagnant or falling per-capita income accompanied by cuts to health and education\nspending, and the counterfactual defense — that outcomes would have been worse without adjustment\n— is unfalsifiable in a way its proponents were not always careful to acknowledge. William\nEasterly, an economist who spent sixteen years at the World Bank before writing the field's most\ninfluential internal critique, argued in *The Elusive Quest for Growth* (2001) that the\nsuccession of confident development panaceas, his own institution's included, had a common flaw:\neach assumed that people respond to plans rather than to incentives, and each was adopted with a\ncertainty the evidence never supported. That critique cuts at the structuralists and the\nadjusters equally, which is why it has aged better than either.\n\n## Sen: Changing What \"Development\" Means\n\nAmartya Sen's contribution was to attack the field at the level of its objective function, and it\nis the most successful attack of its kind in modern economics.\n\nSen's early empirical work established the argument's credibility. *Poverty and Famines* (1981)\ndemonstrated, through case studies including the Bengal famine of 1943, that major famines have\noccurred without any significant decline in the total availability of food — what collapses is\nsome group's \"entitlement,\" its legal and economic ability to command food, through unemployment,\na collapse in the relative price of what it sells, or the failure of a rural wage. Famine, on\nthis account, is a distributional and political event, not a Malthusian one, and Sen's related\nobservation that no substantial famine has occurred in a functioning democracy with a free press\ngave the argument an institutional edge that traveled far beyond economics.\n\nThe capability approach generalizes the entitlement insight. Sen's argument is that neither\nincome nor utility is the right measure of how well a person's life is going: income is a means\nwhose value varies enormously with what a person can convert it into, and utility adapts, so that\nthe chronically deprived may report contentment. What should be assessed instead are\ncapabilities — the real freedoms a person has to achieve the things she has reason to value: to\nbe adequately nourished, to be educated, to appear in public without shame, to participate in\nthe life of the community. Sen received the Nobel in 1998 for his contributions to welfare\neconomics and social choice theory.\n\nThe institutional victory came in 1990, when the Pakistani economist Mahbub ul Haq, working with\nSen at the United Nations Development Programme, launched the first Human Development Report and\nthe Human Development Index — a composite of life expectancy, schooling, and income per head. Sen\nwas initially skeptical of collapsing his framework into a single crude number, and said so; ul\nHaq's argument, which prevailed, was that only a number as vulgar as GDP could compete with GDP.\nHe was right. The HDI is now the standard alternative ranking of countries, reported annually,\ncited in parliaments, and used to reclassify what counts as development success. That is an\nextraordinary result for a philosophical argument: not that it persuaded economists, many of whom\nremain unconvinced that capabilities can be operationalized rigorously, but that it captured the\nofficial statistic.\n\nThe standing critique is that the approach is more compelling as ethics than as economics. It\nspecifies no procedure for weighting capabilities against one another, no theory of how they are\nproduced, and no guidance on trade-offs under a budget constraint — precisely the questions a\nfinance ministry must answer. Sen has generally accepted this, arguing that the incompleteness is\ndeliberate and that a framework which forces the weighting to be decided through public reasoning\nrather than smuggled into a technical index is doing its job. Whether that is a virtue or an\nevasion is a live disagreement.\n\n## The Randomistas\n\nThe field's current methodological orthodoxy arrived from the opposite direction. Beginning in\nthe late 1990s, Abhijit Banerjee, Esther Duflo, Michael Kremer and their collaborators applied\nrandomized controlled trials — the design used to test pharmaceuticals — to development\ninterventions: randomize which schools get textbooks, which villages get deworming, which\nhouseholds get a microcredit offer, and measure the difference. The Abdul Latif Jameel Poverty\nAction Lab, founded at MIT in 2003, industrialized the approach, and the three shared the 2019\nNobel for their experimental approach to alleviating global poverty; Duflo became the second\nwoman and the youngest person to receive the prize.\n\nThe appeal is easy to understand after fifty years of confident, untested, and often disastrous\ngrand strategy. An RCT can establish, credibly, that a particular intervention in a particular\nplace raised school attendance by a particular amount. *Poor Economics* (2011) argued the\nprogrammatic version: abandon the search for a theory of development and accumulate a stock of\nwell-identified findings about specific problems.\n\nThe critique is not from cranks. Angus Deaton, who received the Nobel in 2015, argued in the\n*Journal of Economic Literature* in 2010 that randomization confers no automatic epistemic\nprivilege — that RCTs answer the question \"did this work here\" while policy requires \"will this\nwork there,\" and that the second question is not answered by the first. Deworming pills that\nimproved school attendance in Kenya may do nothing in a setting with a different disease burden,\ndifferent schools, and different households; the estimate is an average treatment effect for a\nspecific population, and heterogeneity means the average may describe no one. Deaton and Nancy\nCartwright developed the argument further in 2018, adding that without a theory of the mechanism\nthere is no basis for transporting a result at all. The deeper objection, made by several\ndevelopment economists, is one of selection bias in the field's attention: the interventions\namenable to randomization are small, and the determinants of long-run growth — trade regimes,\nindustrial policy, the rule of law, the exchange rate, the structure of the state — cannot be\nrandomized. A discipline that studies only what it can randomize will conclude, by construction,\nthat the things it can randomize are what matter. Defenders answer that accumulating replications\nacross many contexts is precisely how external validity is built, and that the alternative — a\nreturn to confident theorizing without evidence — has an appalling track record. Both sides have\nthe better of part of this argument.\n\n## 2025-2026: The Field Without Its Funder\n\nThe most consequential development in development economics in this decade is not\nintellectual. In 2025 the United States dismantled the US Agency for International Development,\nwith an announced reduction of its programs by roughly 83 percent, and the United Kingdom,\nGermany, Canada, and others announced aid reductions in the same window — the first instance on\nrecord of these major donors cutting official development assistance simultaneously for two\nconsecutive years.\n\nThe projected human cost is large and the estimates vary by method, which should be stated\nrather than smoothed over. A 2025 study in *The Lancet* analyzing data from 133 countries\nestimated that USAID funding had prevented some 91 million deaths between 2001 and 2021 and\nprojected that defunding at the announced scale could result in more than 14 million additional\ndeaths by 2030, including over 4.5 million children under five. A subsequent February 2026 study\nin *The Lancet Global Health*, examining humanitarian and development assistance more broadly and\nusing current rather than announced funding trends, projected at least 9.4 million additional\ndeaths by 2030. These are forecasting exercises with substantial modeling assumptions and wide\nuncertainty, and they have been contested; the range between them is itself informative about how\nmuch the answer depends on what one assumes about substitution by other funders and by recipient\ngovernments.\n\nFor the field as an intellectual enterprise, the consequences run in two directions. The applied\napparatus built over twenty-five years — the trial infrastructure, the evaluation units inside\ndonor agencies, the pipeline from a randomized result to a scaled program — was largely financed\nby the donors now retrenching, and it is contracting accordingly. At the same time, the\nretrenchment removes the material basis of the conditionality relationship that made Northern\ndevelopment economics authoritative in the first place. A field whose institutional power came\nfrom being the discipline attached to the money will find out over the next decade what it is\nwhen the money is smaller, and the intellectual initiative may pass to the places that have\nbeen building their own development doctrine anyway: Chinese state-capitalist practice, Indian\npolicy economics, and the Latin American and African research communities whose predecessors\nproduced structuralism the last time the North's model failed them.\n\n## Open Questions\n\nWhether the randomized-trial program can bridge to the growth questions it has so far avoided —\nthrough structured replication, mechanism-focused design, or integration with macro-level\nevidence — or whether it will remain a rigorous science of small interventions is unresolved and\nis the central methodological argument inside the field. Whether the Prebisch-Singer terms-of-\ntrade decline holds in an era of commodity supercycles driven by the energy transition, in which\nlithium, copper, and rare earths are inputs to the industrial center's most strategic products,\nis genuinely open and could invert the classic periphery-center bargaining position for some\ncommodity exporters and not others. Whether the capability approach can ever be operationalized\ninto something a finance ministry can optimize, or whether its incompleteness is permanent by\ndesign, remains contested between Sen's followers and his critics with no prospect of resolution.\nThe counterfactual at the heart of the structural-adjustment record — what African growth would\nhave been under alternative policies given the debt and commodity-price shocks of the period — is\nunfalsifiable in principle and will continue to be argued from priors. And the magnitude of the\nmortality effect of the 2025-26 aid retrenchment is an open empirical question whose answer will\nnot be knowable for years; the published projections should be treated as models with wide error\nbands, not as measurements.\n\n## Sources\n\n- Paul N. Rosenstein-Rodan, \"Problems of Industrialisation of Eastern and South-Eastern Europe,\" *Economic Journal* (1943) — primary text (Tier 1).\n- W. Arthur Lewis, \"Economic Development with Unlimited Supplies of Labour,\" *The Manchester School* 22 (1954): 139-191 — primary text (Tier 1).\n- Nobel Foundation, 1979 Prize in Economic Sciences (Lewis and Schultz), \"for their pioneering research into economic development research with particular consideration of the problems of developing countries,\" nobelprize.org (Tier 1, primary).\n- United Nations, \"W. Arthur Lewis: Pioneer of Development Economics,\" *UN Chronicle*, un.org (Tier 2, institutional).\n- University of Manchester, Department of Economics, Arthur Lewis biography and heritage materials, manchester.ac.uk (Tier 2, institutional).\n- Raúl Prebisch, *The Economic Development of Latin America and Its Principal Problems* (United Nations Economic Commission for Latin America, 1950), and Hans W. Singer, \"The Distribution of Gains between Investing and Borrowing Countries,\" *American Economic Review* (1950) — primary texts (Tier 1).\n- David I. Harvey, Neil M. Kellard, Jakob B. Madsen, and Mark E. Wohar, \"The Prebisch-Singer Hypothesis: Four Centuries of Evidence,\" *Review of Economics and Statistics* (2010) — peer-reviewed (Tier 2).\n- *Resources Policy*, \"Revisiting the Prebisch-Singer hypothesis of a secular decline in the terms of trade of primary commodities (1900-2016): A dynamic regime approach\" (2018) — peer-reviewed (Tier 2).\n- United States International Trade Commission, \"Prebisch-Singer Redux,\" Office of Economics working paper, usitc.gov (Tier 1, primary/institutional).\n- Fernando Henrique Cardoso and Enzo Faletto, *Dependency and Development in Latin America* (1969; English ed. 1979) — primary text (Tier 1).\n- Fundação FHC, biographical materials on Fernando Henrique Cardoso, fundacaofhc.org.br (Tier 6, subject-affiliated foundation — used only for career chronology, not for evaluation).\n- Geisa Maria Rocha, \"Neo-Dependency in Brazil,\" *New Left Review* 16 (July-August 2002) — Tier 5/6, explicitly left-of-center outlet, lean noted; used to represent the critique of Cardoso's presidency from the left.\n- Felipe Antunes de Oliveira, \"Lost and Found: Bourgeois Dependency Theory and the Forgotten Roots of Neodevelopmentalism,\" *Latin American Perspectives* (2022) — peer-reviewed, critical-theory lean noted (Tier 2/5).\n- Brown University Library, \"Brazil: Five Centuries of Change,\" Cardoso chapter, library.brown.edu (Tier 2, institutional/academic).\n- Government of India Planning Commission, Second Five-Year Plan (1956-61) — primary document (Tier 1).\n- Azim Premji University, \"Prasanta Chandra Mahalanobis,\" Indian Economists series, azimpremjiuniversity.edu.in (Tier 2, academic institutional).\n- *International Journal of Business and Social Research*, \"Development Planning & Policies under Mahalanobis Strategy: A Tale of India's Dilemma\" — peer-reviewed (Tier 2); source for the Vakil-Brahmananda wage-goods critique.\n- ThePrint, \"35 yrs of Mahalanobis model vs 35 yrs of Manmohan Singh,\" theprint.in (Tier 4, Indian news outlet).\n- World Bank, *Accelerated Development in Sub-Saharan Africa: An Agenda for Action* (the Berg Report, 1981) — primary document (Tier 1, institutional).\n- William Easterly, *The Elusive Quest for Growth: Economists' Adventures and Misadventures in the Tropics* (MIT Press, 2001) — primary text; author is a former World Bank economist, market-leaning within the mainstream, lean noted (Tier 1/5).\n- Amartya Sen, *Poverty and Famines: An Essay on Entitlement and Deprivation* (Oxford, 1981) and *Development as Freedom* (1999) — primary texts (Tier 1).\n- Nobel Foundation, 1998 Prize in Economic Sciences (Sen), nobelprize.org (Tier 1, primary).\n- United Nations Development Programme, *Human Development Report 1990* and the Human Development Report series, hdr.undp.org (Tier 1, primary/institutional).\n- UNDP Human Development Report Office, Mahbub ul Haq-Amartya Sen lecture materials on the origins of the HDI, hdr.undp.org (Tier 1/2).\n- Abhijit Banerjee and Esther Duflo, *Poor Economics* (2011) — primary text (Tier 1).\n- Nobel Foundation, 2019 Prize in Economic Sciences (Banerjee, Duflo, Kremer), \"for their experimental approach to alleviating global poverty,\" nobelprize.org (Tier 1, primary).\n- Angus Deaton, \"Instruments, Randomization, and Learning about Development,\" *Journal of Economic Literature* 48, no. 2 (June 2010): 424-455 — peer-reviewed (Tier 2).\n- Angus Deaton and Nancy Cartwright, \"Understanding and Misunderstanding Randomized Controlled Trials,\" *Social Science & Medicine* (2018) — peer-reviewed (Tier 2).\n- CEPR/VoxEU, \"What randomisation can and cannot do: The 2019 Nobel Prize,\" cepr.org (Tier 2, research-institution outlet).\n- *The Lancet*, \"Evaluating the impact of two decades of USAID interventions and projecting the effects of defunding on mortality up to 2030\" (2025), thelancet.com — peer-reviewed (Tier 2).\n- *The Lancet Global Health*, \"Impact of two decades of humanitarian and development assistance and the projected mortality consequences of current defunding to 2030\" (February 2026), thelancet.com — peer-reviewed (Tier 2).\n- CNN, \"One year on from dismantling of USAID, study projects that global aid cuts could lead to 9.4 million deaths by 2030,\" February 4, 2026, cnn.com (Tier 4).\n- *The Washington Post*, \"Global aid cuts could lead to 9.4 million deaths by 2030, Lancet study says,\" February 2, 2026, washingtonpost.com (Tier 4).\n- UCLA Fielding School of Public Health, research summary of the 2025 *Lancet* USAID mortality study, ph.ucla.edu (Tier 2, university institutional).\n\n## Glossary\n\n**Big push**: the argument that a poor economy must industrialize in many sectors at once, because each new industry supplies the customers for the others and no single private investor will move first.\n\n**Dual-sector model**: Lewis's framework in which a traditional agricultural sector holding surplus labor supplies workers to a modern capitalist sector at a constant wage until the surplus is exhausted.\n\n**Lewis turning point**: the moment when a developing economy's reserve of surplus rural labor runs out and industrial wages begin to rise.\n\n**Prebisch-Singer hypothesis**: the claim that the prices of primary commodities decline over the long run relative to manufactured goods, so that commodity exporters lose ground by specializing.\n\n**Import-substituting industrialization**: the strategy of building domestic manufacturing behind tariffs and quotas to replace imported goods, dominant in Latin America and South Asia from the 1950s.\n\n**Structuralism**: the Latin American school holding that underdevelopment stems from the structure of a country's economy and its position in world trade rather than from policy errors or factor scarcity.\n\n**Dependency theory**: the claim that poor countries are poor because of, not despite, their integration into the world economy, which transfers surplus from periphery to center.\n\n**Licence raj**: the Indian system, in force from the 1950s to the 1990s, requiring government permits for industrial investment, expansion, and product lines.\n\n**Structural adjustment**: lending conditioned on stabilization, liberalization, and privatization, the standard instrument of the World Bank and IMF from the early 1980s.\n\n**Entitlement (Sen)**: the set of goods a person can legally command through production, trade, or claim — the collapse of which, rather than an absolute shortage of food, causes most famines.\n\n**Capability approach**: Sen's proposal to evaluate well-being by the real freedoms people have to do and be what they value, rather than by income or reported satisfaction.\n\n**Human Development Index**: the UNDP's composite of life expectancy, schooling, and income per head, launched in 1990 as a deliberate rival to GDP per capita.\n\n**Randomized controlled trial (in development)**: an evaluation design that randomly assigns an intervention across individuals, schools, or villages to measure its causal effect.\n\n**External validity**: the question of whether a result established in one setting holds in another — the central methodological objection to relying on randomized trials for policy."}, {"order": 11, "file": "11_Feminist_And_Ecological_Economics.md", "title": "Feminist and Ecological Economics: The Argument About What Gets Counted", "summary": "", "body": "# Feminist and Ecological Economics: The Argument About What Gets Counted\n\n## Bottom Line\n\nEvery school in this survey disagrees with the others about what causes prosperity, and agrees\nwith them about how to know when you have it. Classical, Marxist, Keynesian, Austrian,\nmonetarist, ordoliberal, and neoclassical economists argue ferociously over the determinants of\nnational output and share, almost without discussion, a convention about what national output\nconsists of: things exchanged for money, plus a short list of imputations. Two traditions attack\nthat convention directly, from different sides, and they are grouped together here for that\nreason and not because they are allies. Feminist economics argues that the accounting boundary\nexcludes the unpaid work — overwhelmingly women's — without which no paid work would be possible;\nthe International Labour Organization's own estimate is that unpaid care work amounts to some\n16.4 billion hours every day, worth roughly nine percent of global GDP if valued at minimum wage.\nEcological economics argues that the same boundary treats the depletion of an irreplaceable\nresource base as income rather than as the liquidation of capital, and that an economy is a\nsubsystem of a finite biosphere rather than the other way round. Both traditions have won\nsignificant symbolic ground: the UN's accounting standards now provide for satellite accounts\ncovering household production, the Human Development Index sits beside GDP, the British Treasury\ncommissioned and published a review arguing that nature belongs on the national balance sheet,\nand a 2023 assessment finds six of nine planetary boundaries transgressed. Both have won far\nless operational ground. Central banks still target inflation, finance ministries still forecast\nGDP, and the mainstream's own answer to both critiques — put a price on it, whether the price of\ncarbon or the shadow price of household labor — has proved far more institutionally durable than\nthe demand to change the framework. The honest verdict as of 2026 is that these are the two\ntraditions with the strongest case that the discipline is measuring the wrong thing and the\nweakest record of getting anyone with a budget to act on it.\n\n## The Production Boundary Is a Decision, Not a Fact\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 360\" role=\"img\" aria-label=\"A diagram of the national-accounts production boundary. Inside the boundary: paid work, and an imputed rent for owner-occupied housing that no cash ever changes hands for. Outside: unpaid care and household work, estimated by the International Labour Organization at 16.4 billion hours every day, roughly nine percent of global GDP, and the depletion of natural capital, counted as income rather than as a drawdown.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" letter-spacing=\"2.5\">THE PRODUCTION BOUNDARY<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">what the accounts count, and what they decide not to<\/text>\n<rect x=\"40\" y=\"70\" width=\"290\" height=\"220\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1.5\"/>\n<text x=\"185\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\">INSIDE — counted as output<\/text>\n<rect x=\"62\" y=\"110\" width=\"246\" height=\"34\" rx=\"2\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"185\" y=\"132\" text-anchor=\"middle\" font-size=\"11\" class=\"t-inv\">All paid work and market output<\/text>\n<rect x=\"62\" y=\"156\" width=\"246\" height=\"46\" rx=\"2\" class=\"f-t3\" opacity=\".9\"/>\n<text x=\"185\" y=\"175\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\">Imputed rent on owner-occupied<\/text>\n<text x=\"185\" y=\"190\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-inv\">housing — no cash changes hands<\/text>\n<text x=\"185\" y=\"228\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">An imputation the accounts chose<\/text>\n<text x=\"185\" y=\"242\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">to make. It could be measured,<\/text>\n<text x=\"185\" y=\"256\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">so it was.<\/text>\n<line x1=\"350\" y1=\"70\" x2=\"350\" y2=\"300\" class=\"s-t2\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/>\n<text x=\"350\" y=\"316\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-weight=\"bold\">the boundary is a rule, not a fact<\/text>\n<rect x=\"370\" y=\"70\" width=\"290\" height=\"220\" rx=\"2\" fill=\"none\" style=\"stroke:var(--border)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/>\n<text x=\"515\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\">OUTSIDE — not counted<\/text>\n<rect x=\"392\" y=\"110\" width=\"246\" height=\"52\" rx=\"2\" fill=\"none\" class=\"s-t4\" stroke-width=\"2\"/>\n<text x=\"515\" y=\"130\" text-anchor=\"middle\" font-size=\"10.5\">Unpaid care and household work<\/text>\n<text x=\"515\" y=\"148\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" class=\"t-acc\">16.4bn hours a day · ~9% of GDP<\/text>\n<rect x=\"392\" y=\"174\" width=\"246\" height=\"52\" rx=\"2\" fill=\"none\" class=\"s-t5\" stroke-width=\"2\"/>\n<text x=\"515\" y=\"194\" text-anchor=\"middle\" font-size=\"10.5\">Depletion of natural capital<\/text>\n<text x=\"515\" y=\"212\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-acc\" font-weight=\"bold\">counted as income, not drawdown<\/text>\n<text x=\"515\" y=\"242\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">Equally measurable. Not measured.<\/text>\n<text x=\"515\" y=\"256\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">That asymmetry is the argument.<\/text>\n<text x=\"350\" y=\"344\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\" font-style=\"italic\">Both traditions attack the same line from opposite sides.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> The standard defence of the production boundary is that unpaid work cannot be measured — but the accounts already impute a rent for owner-occupied housing, where no cash changes hands either. Once one imputation is made and the other refused, the boundary stands revealed as a decision about what is worth counting, which is exactly what the feminist and ecological traditions dispute.<\/figcaption>\n<\/figure>\n\n\nNational income accounting is treated by non-economists as a form of measurement, like weighing\nsomething. It is closer to a legal code. The United Nations System of National Accounts, first\nissued in 1953 and revised in 1968, 1993, and 2008, contains an explicit \"production boundary\"\nspecifying which activities count as production. Goods produced for own consumption, such as\nsubsistence farming, are inside. Services produced within the household for the household's own\nuse — cooking, cleaning, childcare, elder care — are outside. Owner-occupied housing is inside,\nvia an imputed rent: the statistician invents a number for what homeowners would pay themselves\nin rent, and adds it to GDP, precisely so that a country of owners does not appear poorer than a\ncountry of tenants. That last inclusion matters for the argument, because it demolishes the most\ncommon defense of the exclusion. Household services are not excluded because imputation is\nimpossible. They are excluded because a choice was made about which imputations were worth\nmaking.\n\nMarilyn Waring made this the subject of a political argument in *If Women Counted* (1988).\nWaring, who had entered the New Zealand Parliament at twenty-three and chaired its public\nexpenditure committee, approached the accounts as a legislator who had watched budget decisions\nfollow the numbers. Her book worked through the UNSNA's rules and showed what they implied: a\nwoman in a subsistence economy who grows food is producing; when she carries water, cooks it, and\nfeeds her children she is not. A forest is worth nothing until it is felled. An oil spill raises\nGDP, through cleanup expenditure, while the sea it poisoned never appeared in the accounts at\nall. Waring's argument connected the accounting convention to policy directly: development\nprograms, tax design, and the valuation of a life in litigation all take their inputs from a\nsystem that scores the work most women do at zero.\n\nThe 1993 revision of the accounts responded, partially. It provided for satellite accounts —\nsupplementary sets of books that can measure household production and other excluded activity\nwithout disturbing the headline GDP figure. This is a genuine concession and an instructive one.\nThe critique was accepted as valid enough to warrant an official response and contained well\nenough that nothing consequential changed: satellite accounts are optional, compiled\nirregularly, and absent from every number a finance minister is judged on.\n\n## The Size of the Omission\n\nThe scale of the excluded activity is now reasonably well measured, largely because the\nfeminist-economics argument prompted the time-use surveys that measure it. The ILO's 2018 study,\ndrawing on time-use data from 64 countries covering roughly two-thirds of the world's\nworking-age population, found that 16.4 billion hours are spent in unpaid care work every day —\nthe equivalent of about two billion people working eight-hour days without pay — and that valuing\nthose hours at an hourly minimum wage would put the total at around nine percent of global GDP,\napproximately 11 trillion US dollars at 2011 purchasing-power parity. Women perform the large\nmajority of it; in the Asia-Pacific region the ILO reports women doing roughly four times as much\nunpaid care work as men.\n\nTwo things follow, and only one of them is usually noticed. The first is the accounting point:\na tenth of world output is invisible to the instrument that governs economic policy. The second\nis a distributional point about time. Because unpaid care work is time-consuming and unequally\nallocated, the labor-market outcomes that economics does measure — participation rates, hours,\nearnings, promotion — are substantially the downstream consequence of an allocation the\ndiscipline does not measure. The best-identified evidence for this comes from inside the\nmainstream: work by Henrik Kleven, Camille Landais, and Jakob Søgaard using Danish administrative\ndata found that women's earnings fall sharply relative to men's on the arrival of a first child\nand never recover, producing a long-run \"child penalty\" on the order of a fifth of earnings, in\none of the world's most gender-egalitarian labor markets and welfare states. Nancy Folbre had\nnamed the general phenomenon the \"care penalty\": the systematic economic disadvantage borne by\nanyone who devotes time to dependents, in a system that prices only what is sold.\n\n## Feminist Economics as a School\n\nFeminist economics is a school in the institutional sense the rest of this survey uses — it has\nfounders, an association, a journal, and a research program — and it is worth being precise about\nwhat it claims, because it is more often characterized than read.\n\nThe programmatic text is *Beyond Economic Man: Feminist Theory and Economics* (1993), edited by\nMarianne Ferber and Julie Nelson, with contributions including Folbre's. Its argument is not\nthat women reason differently from men. It is that the discipline's model of the human agent —\nautonomous, self-interested, with fixed preferences, entering relationships only through\nvoluntary exchange — is a partial description that happens to fit the historical situation of\nadult men in market employment, and fits badly the situation of anyone whose economic life is\nsubstantially constituted by dependency, obligation, and care that is not chosen at the margin.\nThe institutional apparatus followed quickly: the International Association for Feminist\nEconomics formed in 1992, and the journal *Feminist Economics*, founded by Diana Strassmann on\nthe association's behalf, published its first issue in 1995. Folbre's *The Invisible Heart*\n(2001) supplied the school's best-known framing — that the invisible hand of competitive markets\ndepends on an invisible heart of obligation and reciprocity that markets do not produce and can\nerode.\n\nThe mainstream had already produced an answer, and it must be taken seriously. Gary Becker's\nhousehold economics, developed at Chicago from the 1960s and set out at length in *A Treatise on\nthe Family* (1981), brought unpaid work inside the standard framework by treating the household\nas a small firm producing \"commodities\" from time and market goods, with specialization by\ncomparative advantage explaining the division of labor between spouses. Becker received the Nobel\nin 1992. This is a genuine intellectual achievement — it made household labor analyzable at all —\nand the feminist critique of it is correspondingly specific: Becker's household maximizes a\nsingle joint utility function under an altruistic head, which assumes away the bargaining,\nconflict, and unequal exit options that determine who actually does the work and who controls the\nincome. Later bargaining models of the household, developed substantially by economists working\nin and adjacent to the feminist tradition and now standard in labor and development economics,\nwere a direct response, and they are one of the clearest cases in this survey of a heterodox\ncritique winning on the merits and being absorbed into the mainstream's toolkit without the\ntradition that produced it gaining any corresponding institutional standing.\n\nCui bono from the production boundary as it stands? Not any identifiable conspirator; the\naccounts were built in the 1940s and 1950s to answer wartime and postwar planning questions about\nmarketed output, and the exclusion was a practical convention before it was anything else. But\nthe beneficiaries of its persistence are identifiable. A state that does not count care work does\nnot have to fund it, and can treat the transfer of care from public provision to unpaid household\nlabor — the standard fiscal consolidation move on health, elder care, and childcare — as a\nsaving with no offsetting cost, because the cost lands entirely outside the accounts. That is\nnot a rhetorical point. It is the single most consequential practical implication of the\nfeminist-economics argument, and it applies to every austerity program discussed in the chapters\non monetarism and on ordoliberalism.\n\n## The Thermodynamic Objection\n\nEcological economics begins from a claim about physics rather than about justice, and its\nfounding figure was a mathematical economist of unimpeachable technical standing who concluded\nthat his own discipline had made a category error.\n\nNicholas Georgescu-Roegen's *The Entropy Law and the Economic Process* (Harvard University Press,\n1971) argued that the standard model of the economy — a circular flow between households and\nfirms, in which value circulates indefinitely — omits the direction of time. Economic activity\ntakes low-entropy energy and materials and converts them irreversibly into high-entropy waste.\nRecycling can slow this but cannot reverse it, because recycling itself requires energy. On this\naccount, the economy is not a self-contained circular flow but a linear throughput running\nthrough a finite system, and the relevant scarcity is not the neoclassical scarcity of\nalternatives but an absolute one.\n\nHis student Herman Daly turned the physics into a policy proposal: the steady-state economy, in\nwhich the throughput of materials and energy is held constant by design at a level the biosphere\ncan sustain, while qualitative improvement continues. Daly spent six years as a senior economist\nat the World Bank's environment department, which gave him an unusual perspective on why the\nargument does not land; his account of that period is one of the more useful documents on the\ninstitutional limits of internal critique. The tradition acquired its apparatus in 1989, when the\nInternational Society for Ecological Economics was founded and the journal *Ecological Economics*\nbegan publication under Robert Costanza, whose 1997 paper in *Nature* estimating the annual value\nof the world's ecosystem services at an average of around 33 trillion dollars — against a global\nGNP at the time of roughly 18 trillion — became the field's most cited and most criticized\nresult. The criticism, some of it from within ecological economics, is that valuing the entire\nbiosphere in dollars concedes the framework the tradition exists to reject, and that a number\nwhich exceeds world output is not a price anyone could pay and therefore is not a price.\n\n## Two Rival Answers to the Same Problem\n\nThe distinction between *environmental* economics and *ecological* economics is the most\nimportant thing to understand about this argument and the most commonly missed. Environmental\neconomics is a mainstream subfield: it accepts the standard framework and treats pollution as an\nexternality, a cost imposed on third parties and absent from the price, to be corrected by a tax\nor a tradable permit. Ecological economics rejects the framing, holding that a biosphere is not\nan externality to the economy but its precondition, and that no price can be attached to a\nthreshold effect that ends the system generating the prices.\n\nThe clash became concrete over climate change. William Nordhaus built the integrated assessment\nmodels — the DICE family — that couple a simple climate model to a growth model in order to\ncompute an optimal carbon price, and received the Nobel in 2018 for integrating climate change\ninto long-run macroeconomic analysis. This is the mainstream's most serious engagement with the\necological critique, and it produced a striking result: Nordhaus's own optimal policy paths imply\nglobal warming of roughly 3°C by 2100 and more thereafter — far above the target governments have\nformally adopted — because in the model the discounted cost of faster abatement exceeds the\ndiscounted damages avoided.\n\nThe dispute over that result has two layers. The first is the discount rate, and it is\nessentially an ethical disagreement conducted in technical notation. The 2006 Stern Review,\ncommissioned by the UK Treasury, used a consumption discount rate of about 1.4 percent on the\nargument that the welfare of future generations should not be downweighted merely because it is\nfuture; Nordhaus argued for a rate closer to market returns, in the region of 4 percent, on the\nargument that climate investment must be compared against the other investments the same capital\ncould fund. The gap between those two numbers accounts for most of the gap between \"act\ndrastically now\" and \"act gradually,\" which means the most consequential parameter in climate\neconomics is one that economics has no method for determining.\n\nThe second layer is the damage function, and here the criticism is more damaging. Steve Keen's\n2021 paper in *Globalizations* — the source of the widely quoted phrase about the \"appallingly\nbad\" neoclassical economics of climate change — argues that the damage estimates fed into these\nmodels derive substantially from assumptions about how much of GDP occurs indoors or in\nclimate-insensitive sectors, and that the smooth quadratic damage function used cannot represent\ntipping points or non-marginal disruption at all. Keen is a heterodox economist with a\nlong-standing hostility to the mainstream and his rhetoric is unrestrained; the substance of the\ntipping-point objection, however, is shared by economists well inside the mainstream, including\nthe Grantham Research Institute's assessment at the time of Nordhaus's Nobel that the prize had\ngone to a model that underestimates climate risk, and Martin Weitzman's argument that when the\nprobability distribution of catastrophic outcomes has a fat tail, expected-value cost-benefit\nanalysis of the Nordhaus type simply breaks down. The strongest defense of Nordhaus is that he\nwas the first economist to take the problem seriously enough to model it at all, that his\nsuccessive model versions raised the estimated damages as the science tightened, and that a\ntransparent model whose assumptions can be attacked is more useful than a rhetorical position\nthat cannot be.\n\n## Beyond GDP: The Policy Record\n\nThe two traditions converge on a practical demand — change the number governments steer by — and\nthe record of that demand is a case study in symbolic victory.\n\nThe scientific case hardened considerably. The planetary-boundaries framework developed at the\nStockholm Resilience Centre received its first complete quantification in a 2023 *Science\nAdvances* paper led by Katherine Richardson, with twenty-nine authors from eight countries,\nconcluding that six of the nine boundaries — climate change, biosphere integrity, land-system\nchange, freshwater change, biogeochemical flows, and novel entities — have been transgressed,\nplacing the Earth outside what the authors describe as a safe operating space.\n\nThe institutional case advanced further than critics usually acknowledge. The Stiglitz-Sen-\nFitoussi commission, convened by the French government, reported in 2009 that GDP is a poor\nmeasure of well-being and recommended a dashboard of indicators. The UK Treasury commissioned Sir\nPartha Dasgupta's review of the economics of biodiversity, published in 2021, which argued from\ninside the mainstream's own framework that nature is an asset, that economies are embedded in the\nbiosphere rather than external to it, and that countries should de-emphasize GDP in favor of a\nmeasure of inclusive wealth that carries natural capital on the books. That a finance ministry\ncommissioned and published such a document is not nothing. New Zealand's 2019 \"wellbeing budget\"\nrequired spending bids to be justified against wellbeing objectives rather than growth alone.\nAmsterdam adopted Kate Raworth's doughnut framework — a social floor no one should fall below,\nan ecological ceiling no economy should exceed, published in *Doughnut Economics* (2017) — as\nthe organizing frame for its circular-economy strategy in April 2020, and other cities followed.\n\nWhat none of this changed is the machinery. Fiscal rules are still written in terms of debt and\ndeficit ratios to GDP; central bank mandates are still specified over inflation and, in some\ncases, employment; sovereign credit ratings still key off GDP growth; and no major economy has\nadopted a headline alternative that carries statutory consequences. The critique from the left is\nthat this was predictable: the *Jacobin* assessment of doughnut economics argued that a framework\nwhich specifies a target without specifying who holds the power to hit it, or which class\ninterests must be defeated to do so, is a description of a desirable outcome rather than a\nstrategy. The critique from the mainstream is that the beyond-GDP proposals have not produced a\nmeasure with GDP's two decisive properties — international comparability and high-frequency\navailability — and that a quarterly number available six weeks after the period ends will beat a\nbetter annual number every time. Both critiques are substantially correct, and together they\nexplain the record.\n\n## The Strongest Case Against Both Traditions\n\nNeither tradition should be presented without its best opposition. Against feminist economics,\nthe serious objection is not that the omitted work does not matter but that the proposed remedy\nis worse than the disease: imputing a value to household labor requires choosing a wage — minimum\nwage, market replacement cost, or the forgone earnings of the person doing it — and the three\nmethods give wildly different totals, so a GDP including household production would be less\ncomparable across countries and more manipulable than the current figure. The mainstream position\nis that the right response is better satellite accounts and time-use data, which is exactly what\nthe tradition's advocacy produced, rather than redefinition of the headline. Against ecological\neconomics, the serious objection is the empirical record on decoupling: a substantial number of\nwealthy economies have reduced territorial and, in some cases, consumption-based emissions while\nGDP grew, which is precisely what steady-state and degrowth arguments predicted could not happen\nat scale; the counter is that the observed decoupling is too slow relative to the remaining\ncarbon budget and is partly the accounting artifact of offshoring heavy industry, which is a\nstrong reply on the pace and a weaker one on the principle. And against both, the political\nobjection stands: neither tradition has assembled a governing coalition, and a school that cannot\nname the constituency whose interest its program serves has not finished its analysis. That is a\ndemanding standard, but it is the standard the chapters on monetarism and on ordoliberalism apply\nto schools that did take power, and it should be applied evenhandedly.\n\n## Open Questions\n\nWhether the 2008 revision's satellite-account architecture will ever be upgraded into something\nwith statutory force — a household-production figure published alongside GDP on the same release\nschedule — is unresolved and depends on statistical-agency budgets that are being cut in most\nadvanced economies rather than expanded. Whether the \"child penalty\" findings that now command\nmainstream assent will translate into policy design that redistributes care time rather than\nmerely compensating for its consequences is open, and the natural experiments (Nordic paternity\nquotas, in particular) are still producing mixed results. Whether integrated assessment models\ncan be reformed to represent tipping points and fat-tailed risk, or whether the cost-benefit\nframework is structurally incapable of handling non-marginal risks, is the central live dispute\nin climate economics and has no consensus answer. Whether observed decoupling of emissions from\noutput in wealthy economies can be extended fast enough and broadly enough to make the\nsteady-state argument unnecessary, or whether the current pace vindicates it, is an empirical\nquestion whose answer will be visible in the data of the 2030s rather than argued to a conclusion\nnow. And whether the Dasgupta Review's inclusive-wealth framing — which accepts the mainstream's\ncapital-and-return apparatus and applies it to nature — represents the ecological tradition's\nvictory or its absorption is a question the tradition is arguing with itself about, with the same\nstructure as the argument over Costanza's dollar valuation thirty years ago.\n\n## Sources\n\n- United Nations et al., *System of National Accounts* (1953, 1968, 1993, 2008 editions), unstats.un.org — primary standard-setting documents (Tier 1).\n- Marilyn Waring, *If Women Counted: A New Feminist Economics* (1988) — primary text (Tier 1).\n- *Feminist Economics*, \"Twenty-Five Years of Counting for Nothing: Waring's Critique of National Accounts,\" 23, no. 2 (2017) — peer-reviewed (Tier 2).\n- *Review of Income and Wealth*, review essay on Waring's *If Women Counted* (1992), roiw.org — peer-reviewed (Tier 2).\n- International Labour Organization, *Care Work and Care Jobs for the Future of Decent Work* (2018) and associated ILOSTAT materials on measuring unpaid domestic and care work, ilo.org (Tier 1, primary/institutional).\n- International Labour Organization, \"Women do 4 times more unpaid care work than men in Asia and the Pacific,\" ilo.org (Tier 1, institutional).\n- Henrik Kleven, Camille Landais, and Jakob Egholt Søgaard, \"Children and Gender Inequality: Evidence from Denmark,\" *American Economic Journal: Applied Economics* (2019) — peer-reviewed (Tier 2).\n- Marianne A. Ferber and Julie A. Nelson, eds., *Beyond Economic Man: Feminist Theory and Economics* (University of Chicago Press, 1993) — primary text (Tier 1).\n- Nancy Folbre, *The Invisible Heart: Economics and Family Values* (The New Press, 2001) — primary text (Tier 1).\n- International Association for Feminist Economics, association history and founding materials, iaffe.org (Tier 1/6, subject's own institutional record — used for chronology only).\n- *Feminist Economics* (journal), founding and publication history, taylorfrancis.com (Tier 2).\n- Gary S. Becker, *A Treatise on the Family* (Harvard University Press, 1981); Nobel Foundation, 1992 Prize in Economic Sciences (Becker), nobelprize.org — primary texts (Tier 1).\n- Nicholas Georgescu-Roegen, *The Entropy Law and the Economic Process* (Harvard University Press, 1971) — primary text (Tier 1).\n- Herman E. Daly, *Steady-State Economics* (1977) and subsequent writings — primary texts (Tier 1).\n- *Iberian Journal of the History of Economic Thought*, \"The Role of Energy and Entropy in Economic Thought: From Georgescu-Roegen to Daly\" — peer-reviewed (Tier 2).\n- International Society for Ecological Economics, founding and publication history, isecoeco.org (Tier 1/6, subject's own institutional record — chronology only).\n- Robert Costanza et al., \"The value of the world's ecosystem services and natural capital,\" *Nature* (1997) — peer-reviewed (Tier 2).\n- William D. Nordhaus, DICE model documentation and successive versions; Nobel Foundation, 2018 Prize in Economic Sciences (Nordhaus and Romer), nobelprize.org — primary (Tier 1).\n- Nicholas Stern, *The Economics of Climate Change: The Stern Review* (HM Treasury, 2006) — primary/institutional (Tier 1).\n- National Bureau of Economic Research, \"The Choice of Discount Rate for Climate Change Policy Evaluation,\" Working Paper 18301, nber.org — working paper (Tier 2).\n- Boston University Global Development Policy Center / Economics in Context Initiative, \"Debating Climate Economics: The Stern Review vs. Its Critics,\" bu.edu — academic institutional (Tier 2).\n- Steve Keen, \"The appallingly bad neoclassical economics of climate change,\" *Globalizations* 18, no. 7 (2021) — peer-reviewed, author is an avowedly heterodox critic of the mainstream, lean noted (Tier 2/5).\n- Grantham Research Institute on Climate Change and the Environment, LSE, \"A Nobel Prize for the creator of an economic model that underestimates the risks of climate change,\" lse.ac.uk (Tier 2/5, climate-policy research institute, lean noted).\n- American Enterprise Institute, \"The Climate Left Attacks Nobel Laureate William D. Nordhaus,\" aei.org (Tier 5/6, free-market think tank, lean noted — used to represent the defense of Nordhaus).\n- Katherine Richardson et al., \"Earth beyond six of nine planetary boundaries,\" *Science Advances* (September 2023) — peer-reviewed (Tier 2); Stockholm Resilience Centre and Potsdam Institute summaries, stockholmresilience.org and pik-potsdam.de (Tier 2).\n- Partha Dasgupta, *The Economics of Biodiversity: The Dasgupta Review* (HM Treasury, 2021), gov.uk — primary/institutional (Tier 1).\n- Joseph Stiglitz, Amartya Sen, and Jean-Paul Fitoussi, *Report by the Commission on the Measurement of Economic Performance and Social Progress* (2009) — primary/institutional (Tier 1).\n- Kate Raworth, *Doughnut Economics: Seven Ways to Think Like a 21st-Century Economist* (2017), and \"Introducing the Amsterdam City Doughnut\" (April 2020), kateraworth.com — primary text and author's own account (Tier 1/6).\n- *Time*, \"Amsterdam Is Embracing a New Economic Theory to Help Save the Environment,\" time.com (Tier 4).\n- *Jacobin*, \"Doughnut Economics Has a Hole at Its Core,\" September 2021, jacobin.com (Tier 6, explicitly socialist outlet, lean noted — used to represent the critique from the left).\n- New Zealand Treasury, Wellbeing Budget 2019 and Living Standards Framework documentation, treasury.govt.nz (Tier 1, primary/institutional).\n\n## Glossary\n\n**Production boundary**: the rule in national accounting specifying which activities count as economic production; unpaid household services fall outside it, while owner-occupied housing is included by imputation.\n\n**Satellite account**: a supplementary set of national accounts measuring activity excluded from headline GDP, such as household production, provided for in the 1993 revision of the UN standard.\n\n**Unpaid care work**: cooking, cleaning, childcare, and elder care performed without payment, estimated by the ILO at 16.4 billion hours a day worldwide and worth around 9 percent of global GDP at minimum wage.\n\n**Care penalty**: Folbre's term for the systematic economic disadvantage borne by people who spend time caring for dependents in an economy that prices only paid work.\n\n**Child penalty**: the persistent fall in a mother's earnings relative to a father's following the birth of a first child, measured at roughly a fifth of earnings in Danish administrative data.\n\n**Entropy (in economics)**: the thermodynamic principle, applied by Georgescu-Roegen, that economic activity irreversibly converts usable low-entropy energy and matter into unusable waste.\n\n**Steady-state economy**: Daly's proposal for an economy with a constant throughput of energy and materials, held at a level the biosphere can sustain, with qualitative development continuing.\n\n**Environmental economics**: the mainstream subfield treating pollution as an externality to be corrected by taxes or tradable permits — distinct from ecological economics, which rejects the framing.\n\n**Integrated assessment model**: a model coupling a simplified climate system to an economic growth model in order to compute an optimal emissions path; Nordhaus's DICE is the best known.\n\n**Discount rate (in climate policy)**: the rate at which future costs and benefits are downweighted relative to present ones — the parameter that most determines how aggressive an optimal climate policy appears.\n\n**Damage function**: the equation in an integrated assessment model translating a given amount of warming into lost output; criticized for being smooth and therefore unable to represent tipping points.\n\n**Planetary boundaries**: nine quantified limits on Earth-system processes within which humanity can operate safely; six were assessed as transgressed in 2023.\n\n**Doughnut economics**: Raworth's framing of a safe and just space between a social floor of human needs and an ecological ceiling of planetary boundaries.\n\n**Decoupling**: growth in output without a corresponding growth in resource use or emissions — the empirical question on which the growth-versus-limits argument largely turns."}, {"order": 12, "file": "12_Public_Choice.md", "title": "Public Choice: Politics Without Romance, and the Politics of Saying So", "summary": "", "body": "# Public Choice: Politics Without Romance, and the Politics of Saying So\n\n## Bottom Line\n\nPublic choice made one move, and it was a good one. Every school treated in the surrounding\nchapters models market participants as self-interested and, at the decisive moment, switches\nmodels when it turns to government: the state appears as a corrective agency staffed by people\nwho want the public good. James Buchanan and Gordon Tullock refused the switch. If a person is\nself-interested when buying a car, they argued, that person is self-interested when voting,\nlobbying, drafting a regulation, or running a bureau — and the analysis of politics should use\nthe same behavioral assumption economics uses everywhere else. Buchanan called this \"politics\nwithout romance,\" and the research program it generated produced results that are now common\nproperty well beyond the school: rational ignorance among voters, the systematic advantage of\nconcentrated interests over diffuse ones, budget-maximizing bureaucracies, rent-seeking as a real\nsocial cost, and regulatory capture. Buchanan received the Nobel in 1986. Where the school\nbecomes contestable is the step beyond diagnosis. Because ordinary politics is captured, the\nVirginia program concluded, reform must occur at the level of constitutional rules — binding\nconstraints on what future majorities may do — and it is at this point that a symmetry the theory\ndemands quietly fails: the officials and legislators are self-interested, but the rule-writers,\nand the econ
