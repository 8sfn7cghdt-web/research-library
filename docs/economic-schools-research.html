our, \"Economist Paul Krugman on Germany's 'Whips and Scourges,'\" https://www.pbs.org/newshour/economy/paul-krugman-on-germanys-whips-and-scourges [Tier 4]\n- hanswernersinn.de, \"Euro Crisis\" topic page, https://www.hanswernersinn.de/en/topics/EuroCrisis [Tier 6, ordoliberal-sympathetic economist's own site]\n- AEI/Pittsburgh archive, \"German macro: how it's different and why that matters\" (Feld contribution), https://aei.pitt.edu/75469/1/pub_6497_german_macro_how_it_s_different_and_why_that_matters.pdf [Tier 5, think-tank-hosted scholarly]\n- Wiley Modern Law Review, Cole, \"Ordoliberalism: What We Know and What We Think We Know,\" https://onlinelibrary.wiley.com/doi/full/10.1111/1468-2230.12806 [Tier 2, peer-reviewed legal scholarship]\n- Project Gutenberg, Thorstein Veblen, *The Theory of the Leisure Class* (1899, full text), https://www.gutenberg.org/ebooks/833 [Tier 1, primary source]\n- Brocku.ca Mead Project archive, Veblen, *The Theory of the Leisure Class*, Chapter 4, \"Conspicuous Consumption,\" https://brocku.ca/MeadProject/Veblen/Veblen_1899/Veblen_1899_04.html [Tier 1, primary source]\n- Britannica Money, \"John R. Commons,\" https://www.britannica.com/money/John-R-Commons [Tier 4]\n- New World Encyclopedia, \"John R. Commons,\" https://www.newworldencyclopedia.org/entry/John_R._Commons [Tier 5]\n- Encyclopedia.com, \"Institutionalism,\" https://www.encyclopedia.com/social-sciences-and-law/sociology-and-social-reform/sociology-general-terms-and-concepts/institutionalism [Tier 4]\n- World Economics Association, Economic Thought journal, Hermann, \"The Decline of the 'Original Institutional Economics' in the Post-War Period,\" https://www.worldeconomicsassociation.org/files/journals/economicthought/WEA-ET-7-1-Hermann.pdf [Tier 2, peer-reviewed]\n- Masten (ed.) excerpts of Ronald Coase, \"The Nature of the Firm\" (1937), https://masonlec.org/site/rte_uploads/files/Masten_Coase_Nature%20of%20the%20Firm%20-excerpt.pdf [Tier 1, primary source excerpt]\n- The Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel 1991, press release, https://www.nobelprize.org/prizes/economic-sciences/1991/press-release/ [Tier 2, institutional/primary]\n- WashU, \"Douglass North speaks out on 2009 Nobel Prize in economics,\" https://source.washu.edu/2009/10/douglass-north-speaks-out-on-2009-nobel-prize-in-economics/ [Tier 4, university news]\n- Chicago Booth, \"Ronald Coase\" faculty/Nobel laureate profile, https://www.chicagobooth.edu/faculty/nobel-laureates/ronald-coase [Tier 2, institutional]\n\n## Cross-References\n\nThe Bundesbank's inflation-averse institutional culture and the Chicago School's monetarist\nquantity-theory revival share a preoccupation with price stability but arrive at it from different\nintellectual roots and different institutional histories; see the Monetarism, Chicago School, and\nNeoliberalism chapter for the Friedman side of that comparison.\nThe Freiburg School's rejection of both laissez-faire and central planning has an interesting\nstructural parallel in Friedrich List's National School's rejection of Smithian free trade on\ndevelopmental grounds, even though the two traditions end up recommending nearly opposite trade\npolicies; see the List and National School chapter.\nNew Institutional Economics' property-rights account of long-run growth divergence is a direct\ncounterpoint to the Marxist account of the same divergence through class formation and surplus\nextraction; see the Marx and Critique chapter.\nThe Eurozone austerity debate's Keynesian critics draw on the same demand-management logic examined\nat length in the Keynesianism chapter, applied to a monetary-union context Keynes himself never had\nto theorize."}, {"order": 8, "file": "08_Contemporary_Contenders.md", "title": "Contemporary Contenders", "summary": "", "body": "# Contemporary Contenders\n\n## Bottom Line\n\nNone of the three challengers gathered here has displaced the standing schools mapped in the surrounding chapters; each has instead carved out a bounded, contested claim on a piece of the policy machine. Modern Monetary Theory won a loud hearing inside the Democratic Party between 2019 and 2021, supplied the intellectual cover for the size of the pandemic relief bills, and then lost the argument in the court that actually matters to policymakers — the 2021-2023 inflation surge did what MMT's critics said high-pressure fiscal policy risked doing, and the theory's political champions have gone quiet on the label even where the underlying spending appetite persists. Behavioral economics never tried to replace a macro school in the first place; it embedded itself as a micro-level corrective — a permanent government unit in London, a smaller and more precarious one in Washington, and a citation on every syllabus — while leaving the debates about money, cycles, and the state's proper size to the schools that came before it. The industrial-policy revival is the most consequential of the three and the least resolved: Washington, Brussels, and Beijing are all now spending real money on List's core wager, that a state can pick and nurture strategic industries faster than the market would on its own, and the mid-2026 data show that wager paying off unevenly — American fabs are up and running years after the money was appropriated, but a shortage of trained workers is now the binding constraint on the whole program, Europe's chip act has drawn a formal auditor's rebuke for chasing a market-share target with no realistic path to it, and China's equipment self-sufficiency numbers are real but still short of the independence Beijing has set as its goal.\n\n## Modern Monetary Theory: Chartalist Roots and the Kelton Argument\n\nModern Monetary Theory did not begin with Stephanie Kelton, and its intellectual lineage is older and stranger than its recent media profile suggests. Its foundational premise — that money is not a commodity discovered by markets but a creature of the state — comes from the German economist Georg Friedrich Knapp, whose 1905 book *The State Theory of Money* argued that a currency's value derives from a government's willingness to accept it in payment of taxes, not from any intrinsic commodity backing. That \"chartalist\" claim (from the Latin *charta*, a token or record) sat mostly dormant in economics for decades. It was revived and given a policy edge by Abba Lerner, a New Deal-era economist whose doctrine of \"functional finance\" argued in the 1940s that a government issuing its own fiat currency should set taxation and spending levels according to their effect on employment and inflation, not according to any target for balancing the budget — because such a government, unlike a household or a firm, can never run out of the money it prints. Twentieth-century post-Keynesians, notably Hyman Minsky on financial instability and Wynne Godley on sectoral balances, added the macro-accounting scaffolding, and it was economist Warren Mosler, followed by academics including Randall Wray, Bill Mitchell, and Kelton, who assembled these pieces into the school now called Modern Monetary Theory starting in the 1990s (Levy Economics Institute working paper on the evolution of functional finance and MMT, levyinstitute.org; Wikipedia's own sourcing trail for chartalism traces to the same primary literature, though Wikipedia is not itself cited here).\n\nKelton's 2020 book *The Deficit Myth* is the version of MMT that reached a mass audience, and its core claims are narrower and more falsifiable than critics sometimes credit. First: a currency-issuing sovereign government — one that borrows only in a currency it alone can create, as the United States, Japan, and the United Kingdom do — cannot be forced into involuntary default, because it can always create the money to meet a nominal obligation; this is a claim about default risk, not about consequences, and MMT economists are explicit that it does not rule out inflation or currency depreciation as costs of doing so. Second, and following from the first: the real constraint on government spending is not \"can we afford it\" in a financing sense but whether the economy has the real resources — labor, materials, productive capacity — to absorb the spending without triggering inflation; once real resources are fully employed, additional spending is inflationary regardless of how it is financed. Third, taxes do not \"fund\" federal spending in a currency-issuing sovereign, because the government must create the money before it can tax or borrow it back; instead, taxes perform two other functions — creating demand for the currency (because citizens need dollars to pay tax obligations, which gives an otherwise unbacked fiat currency its value, the Knapp/chartalist claim) and draining spending power from the economy to make room for public spending without overheating demand.\n\n## The Mainstream Rebuttal, at Full Strength\n\nThe mainstream case against MMT is not a straw man dismissal, and it comes from economists across the ideological spectrum, including from the left flank of the mainstream that shares MMT's discomfort with austerity. Paul Krugman, a Keynesian and no deficit hawk, has engaged MMT proponents directly and repeatedly over several years, and his objection is technical rather than moral: he argues MMT's proponents blur the distinction between the government's ability to avoid default (which he does not dispute for a currency issuer) and the question of whether large deficits raise interest rates or crowd out other activity, a question he says standard IS-LM macro already answers adequately without MMT's reformulation; he has called specific MMT claims about deficits and the monetary base \"obviously indefensible\" when pushed to their strong form, while agreeing with a weaker version — that deficit spending is not inherently dangerous at the current scale — that overlaps with ordinary Keynesianism (Bloomberg Opinion, \"The Case Against Both Paul Krugman and MMT,\" 2019; Krugman's own blog exchanges with Kelton, aggregated at stephaniekelton.com/paul-krugman-asked-me-about-modern-monetary-theory). Larry Summers, the Democratic Party's most prominent center-left deficit hawk, went further and personalized the critique, calling MMT \"voodoo economics\" and \"grotesque,\" and arguing it takes a defensible observation — that currency-issuing governments have more fiscal space than household-budget analogies suggest — and extends it to claim, in his reading, that deficits essentially do not matter as long as a central bank can manage inflation with taxes after the fact; Summers has pointed to hyperinflation episodes in Latin American economies that attempted variants of monetized deficit spending as cautionary evidence, and Jason Furman, another Democratic-aligned economist, argued MMT had \"not come up with a clear and obviously workable idea for how to stem inflation\" once it takes hold (Yahoo Finance/Bloomberg reporting on Summers's March 2019 remarks; the Week, \"Larry Summers slams the left's Modern Monetary Theory as 'voodoo economics'\"). The shared thread in both critiques, despite Krugman and Summers occupying different points on the Democratic economic spectrum, is that MMT's proponents underspecify the political mechanism by which Congress would actually withdraw fiscal stimulus once inflation appeared — raising taxes and cutting spending are difficult acts for any government, and MMT's critics argue the theory quietly assumes a fiscal-policy nimbleness that no democracy has reliably demonstrated. The libertarian and Austrian-adjacent critique, represented for instance in the Cato Institute's 2019 *Cato Journal* treatment, adds a further layer: it argues MMT's own internal logic, if taken seriously, licenses essentially unlimited spending constrained only by an inflation gauge that is itself lagging and politically contestable, which in practice removes any meaningful fiscal discipline at all.\n\nThe empirical test MMT's critics had been waiting for arrived in 2021 through 2023. The United States ran the largest peacetime fiscal deficits relative to GDP in its history through pandemic relief and the American Rescue Plan, financed in an environment of near-zero interest rates and heavy Federal Reserve asset purchases — conditions MMT proponents had argued made large deficits safe. Inflation then rose to a four-decade high, peaking above 9 percent on the headline CPI in mid-2022, and the Federal Reserve responded with the fastest rate-hiking cycle in decades. MMT economists, including Kelton, argued after the fact that the 2021-2022 inflation was driven primarily by pandemic-era supply shocks and energy-price shocks rather than by the scale of fiscal spending per se, a position with real support among mainstream economists studying the episode's causes; but the political optics were set regardless — a large deficit-financed stimulus was followed by the worst inflation in forty years, and that sequence, whatever its precise causal decomposition, is the reason MMT's public standing is measurably weaker in 2026 than it was in 2020.\n\n## MMT's Actual Political Traction, Precisely Stated\n\nIt is easy to overstate how far MMT ever penetrated actual policymaking, and precision matters here because this is exactly the kind of claim that goes stale fast. Kelton's most direct institutional political role was as a senior economic adviser to Senator Bernie Sanders during his 2016 presidential campaign and as an informal adviser feeding ideas into the 2020 Biden campaign's economic team; Representative Alexandria Ocasio-Cortez was for several years the most visible elected official associating herself with MMT-adjacent arguments, including dismissing the CBO's deficit scoring during 2021 fights over the Build Back Better bill (Sanders Senate press office archive, sanders.senate.gov). No piece of enacted federal legislation has ever been officially labeled or defended in congressional debate as an MMT bill; the American Rescue Plan and the CHIPS/IRA spending discussed below were defended by the Biden administration and congressional Democrats using conventional Keynesian and public-investment arguments, not MMT's chartalist framing, even though commentators on the right (for instance the Heritage Foundation, in a piece titled \"Bidenomics, Also Known As MMT\") argued the scale of spending amounted to MMT in practice regardless of the label used. As of Kelton's own public output in 2024, she was still arguing publicly that a \"paradigm shift\" away from deficit-hawk orthodoxy was underway (Jacobin interview, January 2024, \"Stephanie Kelton Thinks the Conventional Wisdom Is Changing\"), but no comparably prominent elected Democrat has picked up the MMT banner by name since the 2021-2023 inflation episode, and the party's 2024-2026 fiscal messaging has generally reverted to more conventional pay-for framing rather than chartalist argument. Kelton's own institutional position as of the most recent record available is professor of economics and public policy at Stony Brook University, a post she has held since 2017, and she additionally served as interim dean of Stony Brook's School of Communication and Journalism from September 2025 through the 2025-26 academic year, handing the school to a permanent dean, Karin Gwinn Wilkins, at the start of the following year — an academic and administrative role throughout, not a fiscal-policy post (Stony Brook University faculty and presidential-office biographical pages; Stony Brook University news announcement of the incoming dean). The honest current-state summary is that MMT is a genuine minority position within the economics profession, with a real academic home (Stony Brook, University of Missouri-Kansas City, the Levy Economics Institute) and a real but now-diminished political footprint that peaked in 2019-2021 and has not recovered the same prominence since; it functions today more as a standing critique cited in debates over deficit scoring than as an active governing program anyone in power is currently implementing under that name.\n\n## Behavioral Economics: The Empirical Challenge to Rational-Actor Foundations\n\nWhere MMT contests a macro-policy question, behavioral economics contests a foundational assumption running underneath nearly every school treated in the surrounding chapters — classical, Marxist, Austrian, monetarist, and Keynesian theory alike generally model economic agents as rational optimizers with stable, consistent preferences, even where they disagree sharply about what follows from that assumption at the level of markets, class, or the business cycle. Daniel Kahneman and Amos Tversky's prospect theory, published in 1979 and cited explicitly by the Nobel committee when it awarded Kahneman the 2002 Nobel Memorial Prize in Economic Sciences (Tversky had died in 1996 and was ineligible, though the committee acknowledged his co-authorship in its citation), supplied the empirical break. Prospect theory showed, through repeated experiment, that people do not evaluate outcomes against an absolute wealth level the way expected-utility theory assumes; instead they evaluate gains and losses relative to a reference point, typically the status quo, and they weight losses roughly twice as heavily as equivalent gains — a finding usually summarized as loss aversion. The theory further showed that people misjudge probabilities in systematic, predictable ways — overweighting small probabilities and underweighting large ones — rather than processing them correctly as a rational-actor model would require (Nobel Prize committee's 2002 advanced scientific background document, nobelprize.org). The empirical challenge this posed to the discipline was not a claim that markets never clear or that supply and demand curves are fictions; it was a claim that the micro-foundational assumption of stable, rational, wealth-maximizing preferences — the assumption every school treated in these pages, from Smith's self-interested individual through the Austrian praxeological actor to the rational-expectations agent of the Chicago School, leans on to some degree — is empirically false in specific, reproducible, and economically consequential ways.\n\nRichard Thaler took the theory from a description of choice under uncertainty toward a program for redesigning policy and institutions to work with human biases rather than against them, culminating in *Nudge* (2008, with Cass Sunstein) and his own 2017 Nobel Memorial Prize, awarded for what the Nobel committee described as demonstrating how the traits Kahneman and Tversky identified — limited rationality, social preferences, and lack of self-control — systematically affect individual decisions and market outcomes. Thaler's \"nudge\" concept argues that because people's choices are sensitive to how options are presented — the default enrollment setting on a retirement plan, the order items appear on a menu, the wording of a reminder letter — a government or institution can improve outcomes by redesigning the \"choice architecture\" around a decision without banning any option or changing the underlying incentives, an approach Thaler and Sunstein branded \"libertarian paternalism.\"\n\n## Behavioral Economics' Real, Bounded Policy Footprint\n\nThe clearest institutional legacy of this line of research is the UK's Behavioural Insights Team, founded inside the Cabinet Office in 2010 under David Cameron's government and popularly known as the \"Nudge Unit.\" It was spun out into a partly independent company in 2014, owned in equal thirds by the Cabinet Office, the innovation charity Nesta, and its own employees; Nesta bought out the other two stakes for £15.4 million in December 2021, so the unit is now wholly owned by an innovation charity rather than partly by the government that created it. As of the most recent reporting available it remains an active commercial and policy-advisory operation with government contracts rather than a defunct experiment; UK government coverage in 2026 documents it continuing work on vaccination-uptake campaigns and behavioral analysis of online conduct in partnership with other governments, funded through contractual arrangements including Cabinet Office and Department of Health and Social Care work (Institute for Government explainer on the \"Nudge Unit,\" instituteforgovernment.org.uk; UK press coverage dated June 2026 on BIT's continuing government contract work). The United States built an equivalent, smaller body — the Social and Behavioral Sciences Team, created by a 2015 Obama executive order and known informally as the US \"nudge unit,\" which was later folded into the General Services Administration as the Office of Evaluation Sciences (OES). The most rigorous independent audit of what these units actually achieve — Stefano DellaVigna and Elizabeth Linos's study of the complete trial portfolios of both OES and the UK's Behavioural Insights Team, 165 trials testing 349 interventions across more than 24 million people — found an average improvement of roughly 8.1 percent on the policy metrics being tested, which in absolute terms means moving a take-up rate from about 17.2 percent to about 18.6 percent. The individual trials cover things like diversifying police-department applicant pools, raising engagement with free primary-care services, and reducing antipsychotic overprescribing — a real but incremental effect size consistent with how behavioral economists themselves characterize nudges: capable of moving outcomes by single-digit percentages at very low cost, not capable of substituting for larger structural policy. As of the most recent verifiable record (OES's own GSA site remained active with current job postings through 2026), the office continues to exist, though no confirmation could be found of its funding or staffing level following the broader restructuring of GSA's technology and innovation offices under the second Trump administration, which eliminated the adjacent 18F unit in March 2025; readers should treat OES's precise current staffing as an open question rather than settled fact. The OECD's Observatory of Public Sector Innovation has tracked the broader diffusion of this model, reporting the number of dedicated behavioral-insights units in governments worldwide grew more than twentyfold from a handful in the early 2010s, with the OECD's own compiled directory cataloguing dozens of national and subnational units by the mid-2020s (OECD OPSI, \"Mapping the global behavioural insights community,\" oecd-opsi.org).\n\nThe honest scope of behavioral economics' influence is that it has never attempted, and has not achieved, a takeover of macroeconomic policymaking comparable to Keynesianism's capture of fiscal policy after 1945 or monetarism's capture of central banking after the 1970s. It operates one level down, inside program design and regulatory default-setting, and it coexists with — rather than displaces — the standing macro schools; a Treasury or central bank can be thoroughly monetarist or New Keynesian in its macro framework while its welfare agency runs a behavioral-science unit optimizing enrollment forms. Critics inside economics, including some sympathetic to the underlying psychology, have also pointed to a replication problem within the nudge literature itself: a large 2022 meta-analysis in *Proceedings of the National Academy of Sciences* found that published nudge effect sizes shrink substantially once publication bias is corrected for, though BIT's own commissioned response argued the underlying effects remain real and economically meaningful even after correction (BIT press release, \"Analysis Finds Nudge Interventions Results are Real & Meaningful,\" bi.team) — a live, ongoing methodological dispute rather than a settled one.\n\n## The Industrial-Policy Revival: List's Wager, Tested in Real Time\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">China&#x27;s semiconductor equipment self-sufficiency<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">20<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">40<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">60<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">80<\/text><rect x=\"136.3\" y=\"203.2\" width=\"56.0\" height=\"46.8\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"164.3\" y=\"197.2\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">16%<\/text><text x=\"164.3\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 164.3 268.0)\">2024 actual<\/text><rect x=\"345.0\" y=\"147.6\" width=\"56.0\" height=\"102.4\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"373.0\" y=\"141.6\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">35%<\/text><text x=\"373.0\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 373.0 268.0)\">Jan 2026 actu…<\/text><rect x=\"553.7\" y=\"16.0\" width=\"56.0\" height=\"234.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"581.7\" y=\"10.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">80%<\/text><text x=\"581.7\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 581.7 268.0)\">2030 target<\/text><\/svg><figcaption>Real and fast-rising, but still well short of the target Beijing set for itself. <span class=\"credit\">Source: Wedbush; Electronics Weekly and TechWireAsia reporting, January 2026.<\/span><\/figcaption><\/figure>\n\n\n\nThe return of large-scale state-directed industrial policy in the United States, the European Union, and China is the most consequential of the three contenders in this chapter because, unlike MMT's mostly rhetorical political traction or behavioral economics' micro-level footprint, it involves hundreds of billions of dollars of actual public money already committed and, in the American and European cases, already partly spent. Friedrich List's nineteenth-century case for infant-industry protection — that a state should shelter and subsidize strategic industries during their vulnerable early phase, because a purely free-trade regime will lock a rising economy into permanent dependence on more advanced rivals — is treated at length in an earlier chapter; this section stays deliberately narrow, tracking only the current policy record against List's original wager and the standard efficiency-loss and crony-capture critique of that wager, not the intellectual history.\n\nThe US CHIPS and Science Act of 2022 committed roughly $52.7 billion in direct semiconductor incentives plus a 25 percent investment tax credit. The Commerce Department's CHIPS Program Office had committed more than $30 billion in direct funding across nineteen companies and forty projects by early 2025, and a final round in April 2026 — $1.6 billion to Texas Instruments, $1.2 billion to SK Hynix, $800 million to GlobalFoundries — brought the total allocated to roughly $38.7 billion of the $39 billion pot across twenty-three recipients, of which about $11 billion had actually been disbursed against verified construction milestones. Three major CHIPS-funded logic fabs were reported in volume production as of May 2026 and roughly twelve more under active construction with staggered production start dates running from late 2026 through 2029 (Congressional Research Service report R49031, \"Semiconductor Fabrication Facilities Funded by the CHIPS Act,\" updated July 2026, congress.gov). That is a genuine, measurable List-style outcome — fabs that would very plausibly not have been built on US soil on this timeline without the subsidy, given that the same firms were simultaneously expanding capacity in Taiwan, South Korea, and elsewhere at lower cost. But the program's own binding constraint by mid-2026 was not capital, it was labor: the Semiconductor Industry Association and Oxford Economics project the industry needs roughly 115,000 new US workers by 2030 and that as many as 67,000 of those positions may go unfilled absent a faster training pipeline, while overall US semiconductor manufacturing employment actually fell from a peak near 401,000 in 2023 to about 368,400 by March 2026 even as fab construction proceeded — a List-style subsidy running into a workforce bottleneck the subsidy itself did not fix (Bloomberg, \"US Semiconductor Labor Shortage Threatens Billions in Chip Factory Investments,\" July 7, 2026; Semiconductor Industry Association workforce blueprint, semiconductors.org). The second Trump administration also restructured the CHIPS Act's implementation in a way List himself would likely have recognized as a more direct instrument than a subsidy: in August 2025 the federal government converted roughly $8.9 billion of Intel's unpaid CHIPS grants and Secure Enclave funding into a direct equity stake of just under 10 percent in the company, taking on the profile less of a subsidizing state and more of a shareholding one, and dropping labor-agreement and stock-buyback conditions that had been attached to the original awards (CNBC, August 19, 2025; Intel Newsroom press release on the agreement). Democratic senators, including Elizabeth Warren, criticized the equity conversion as an unusual and risky departure from the program's original design (Senate Banking Committee minority correspondence, banking.senate.gov) — a live partisan dispute over whether the List-style instrument should be a subsidy, a loan, or outright state ownership.\n\nThe Inflation Reduction Act's clean-energy manufacturing provisions produced a comparably real but now-truncated build-out. Since the IRA's August 2022 enactment, companies announced 380 clean-technology manufacturing facilities, nearly half operational by March 2025, and quarterly clean-manufacturing investment nearly tripled from about $2.5 billion in the third quarter of 2022 to roughly $14 billion in the first quarter of 2025 (Rhodium Group Clean Investment Monitor, \"The State of US Clean Energy Supply Chains in 2025,\" rhg.com). That build-out was then substantially curtailed by the One Big Beautiful Bill Act, signed July 4, 2025, which did not repeal the IRA's manufacturing incentives outright but did accelerate the phase-out of electric-vehicle and residential energy-efficiency credits before the end of 2025 and tightened the construction-start deadlines for wind and solar tax credits, while preserving more favorable treatment for dispatchable technologies such as nuclear and geothermal (Sidley Austin client alerts, May and July 2025; Novogradac summary of the final OBBBA energy provisions). Project activity has continued into 2026 at a reduced pace — for instance roughly $3 billion in new clean-manufacturing and generation projects announced in May 2026 alone, per the nonpartisan tracker E2 — but the policy environment for the IRA's List-style manufacturing bet is now considerably less certain than it was at enactment, an important qualifier for any claim that treats the IRA as a stable, ongoing program (E2 Clean Economy Works Tracker, e2.org, data through March 2026).\n\nThe European Union's response, the European Chips Act (in force since 2023, with a \"Chips Act 2.0\" under active discussion by 2026), aimed to double the EU's share of global semiconductor production to 20 percent by 2030. The Commission has cleared a run of first-of-a-kind state-aid decisions for individual chip facilities — seven of them accounting for more than €31.5 billion in combined public and private investment, a tally since grown past €32 billion across thirteen decisions — plus a separate Important Project of Common European Interest carrying more than €21 billion more, real money comparable in scale to a meaningful fraction of the US program. The Commission's own statutory review of the Regulation is not due until September 2026, but the EU's independent auditors did not wait for it. In Special Report 12/2025, published in April 2025, the European Court of Auditors found the 20-percent target \"very unlikely\" to be met — hitting it would require roughly quadrupling European capacity by 2030, while the Commission's own July 2024 forecast had the EU share of the global value chain creeping only from 9.8 percent in 2022 to 11.7 percent by 2030 — and the auditor in charge, Annemie Turtelboom, said the strategy needed a \"reality check.\" Independent analysts have been equally blunt about the design flaws: Bruegel, the Brussels-based think tank (a Tier 5 source, with a generally pro-market-integration institutional lean typical of EU-focused economic think tanks), has argued the EU should abandon the 20-percent self-sufficiency target altogether in favor of a narrower \"indispensability\" strategy focused on specific chokepoints such as lithography equipment, where Europe already holds real leverage through ASML; the Munich-based ifo Institute's EconPol commentary argued the Act risks becoming a subsidy race for \"national champions\" rather than a coherent continental strategy; and Interface-EU's analysis concluded the Chips Act amounts to \"a collection of ideas and initiatives\" rather than a strategy with a credible mechanism for generating the domestic demand — sufficient European hyperscalers, defense procurement, and downstream industry — needed to absorb the output of any new fabs it subsidizes (Bruegel, \"Revamping Europe's chips strategy: indispensability, not self-sufficiency\"; ifo Institute EconPol Opinion, February 13, 2026; Interface-EU, \"The Missing Strategy in Europe's Chip Ambitions\"). That is close to the textbook version of the standard critique of List-style policy: picking a market-share target is easier than building the demand-side and human-capital conditions that make the target achievable, and Europe's own auditors have said so in an official audit report, not merely outside critics.\n\nChina represents the most state-directed of the three efforts and, on the narrow metric of import substitution, the one showing the clearest recent movement, though from a lower base and still short of its own targets. Domestic semiconductor equipment self-sufficiency reportedly reached roughly 35 percent by the turn of 2026 — the starting point is less firm than the endpoint, with 2024 estimates running anywhere from the mid-teens to the mid-twenties depending on which tracker and which equipment categories are counted, so the rise is real but its steepness should be held loosely — a gain state media and industry trackers attribute to more than $150 billion in cumulative state subsidies channeled through vehicles including the \"Big Fund,\" alongside SMIC's continued production of 7-nanometer-class chips despite US export controls on the most advanced lithography equipment (Wedbush investor research note, January 21, 2026, citing industry tracking data). Beijing has paired subsidy with compulsion: as of 2026 the government has mandated that chipmakers use at least 50 percent domestically produced equipment when adding new manufacturing capacity, an explicit industrial-policy lever well beyond anything under discussion in Washington or Brussels, with a stated national target of 80 percent semiconductor self-sufficiency by 2030 (Electronics Weekly, March 2026; TechWireAsia reporting on China's wafer self-sufficiency targets, May 2026). Critics both inside and outside China's own policy establishment have flagged the classic List-critique risk running alongside these gains — that mandated localization and subsidy at this scale routinely produces overcapacity, mismatched investment in lower-value mature-node chips rather than the cutting edge, and rent-seeking by connected firms, a pattern outside analysts have compared to earlier state-led pushes in Japanese and South Korean industrial policy that also produced both durable national champions and considerable waste (commentary along these lines from American Greatness, a Tier 6 opinion outlet with a China-hawk lean, should be read as a partisan framing of an otherwise real and widely shared efficiency concern that also appears in the IMF's more measured May 2026 blog assessment that industrial policy \"remains hard to implement effectively\" even as governments increasingly turn to it in response to overlapping economic and security crises).\n\nRead together, the three theaters as of mid-2026 offer a genuinely mixed verdict on List's central claim rather than a clean vindication or refutation. All three governments have shown that a state can, in fact, use subsidy, procurement, equity stakes, and outright mandate to accelerate the build-out of a strategic industry faster than an unassisted market would have — American fabs, European chip investment, and Chinese equipment self-sufficiency are all measurably higher than they would likely be absent these programs. But List's own theory assumed the protection would be temporary and would end once the infant industry matured into a genuine competitor; none of the three current programs has yet reached that test, and the specific failure modes showing up in the 2026 data — an American labor bottleneck the subsidy did not anticipate, a European program its own evaluators say lacks a coherent demand-side strategy, and a Chinese effort still trailing its own stated targets while running the classic overcapacity risk — are close to a checklist of the standard economist's case against industrial policy: that governments are better at directing capital toward a chosen sector than at solving the harder, slower-moving constraints (skilled labor, downstream demand, genuine competitiveness beyond the subsidy) that actually determine whether the sector becomes self-sustaining.\n\n## Open Questions\n\nWhether the 2021-2023 inflation surge permanently discredited MMT's political prospects or merely paused them pending the next recession, when large deficit-financed stimulus may again look attractive to policymakers regardless of the theoretical label attached to it, is unresolved; Kelton and other MMT economists continue to argue the inflation was a supply-shock event that does not bear on their core claims, and no consensus verdict exists in the profession. The precise current staffing and funding level of the US Office of Evaluation Sciences following the Trump administration's broader restructuring of GSA's innovation offices (which eliminated the adjacent 18F unit in March 2025) could not be confirmed as of this writing and should be checked against current GSA sources before being cited as an ongoing-scale claim. Whether the labor-supply bottleneck constraining CHIPS Act fabs will ease as training pipelines mature through the rest of the decade, or whether it represents a structural ceiling on how much reshoring the US semiconductor program can actually deliver by its original targets, remains genuinely open and is the single most consequential unresolved fact for assessing the American industrial-policy bet. Whether the EU will act on its own evaluators' recommendation to abandon the 20-percent market-share target in a \"Chips Act 2.0\" — under active discussion as of 2026 but not yet enacted — or double down on the current design is unresolved. And whether China's equipment self-sufficiency gains, achieved substantially through subsidy and mandate rather than market competitiveness, will translate into globally competitive exportable technology or will instead calcify into a protected domestic sector reliant on continued state support, is a genuinely contested question among China-watchers with no settled answer in the current data.\n\n## Sources\n\n- Stephanie Kelton, *The Deficit Myth: Modern Monetary Theory and the Birth of the People's Economy* (2020) — primary text for MMT's core claims.\n- Levy Economics Institute of Bard College, working paper on the evolution of functional finance and its relation to MMT, levyinstitute.org/pubs/wp_900.pdf (Tier 2, scholarly/institutional).\n- Bloomberg Opinion, \"The Case Against Both Paul Krugman and MMT,\" March 22, 2019, bloomberg.com (Tier 4).\n- Stephanie Kelton, \"Paul Krugman Asked Me About Modern Monetary Theory. Here Are 4 Answers,\" stephaniekelton.com (Tier 6, subject's own response — used only to represent her side of the exchange, not as neutral evidence).\n- Yahoo Finance/Bloomberg News, \"Summers Slams MMT as Fallacious as Economics Battle Heats Up,\" March 5, 2019 (Tier 3/4).\n- The Week, \"Larry Summers slams the left's Modern Monetary Theory as 'voodoo economics,'\" 2019 (Tier 4).\n- Cato Institute, *Cato Journal*, \"Modern Monetary Theory: A Critique,\" Fall 2019, cato.org (Tier 5, libertarian/free-market lean, noted).\n- The Heritage Foundation, \"Bidenomics, Also Known As MMT,\" heritage.org (Tier 6, opinion/partisan, conservative lean, noted — used only to source the claim that critics associated Biden-era spending with MMT, not as an empirical authority).\n- Sanders Senate press office archive, \"Bernie Sanders, AOC Slam Conservative Dems Over Build Back Better Deficit Demands,\" sanders.senate.gov (Tier 1, primary).\n- Jacobin, \"Stephanie Kelton Thinks the Conventional Wisdom Is Changing,\" January 2024, jacobin.com (Tier 6, left-leaning outlet, noted).\n- Stony Brook University Office of the President and faculty directory, biographical pages on Stephanie Kelton, stonybrook.edu (Tier 1, primary/institutional).\n- Nobel Prize committee, \"Advanced information on the Prize in Economic Sciences 2002,\" nobelprize.org (Tier 1, primary).\n- Nobel Prize committee, 2017 Prize in Economic Sciences citation for Richard Thaler, nobelprize.org (Tier 1, primary).\n- Institute for Government, \"'Nudge Unit,'\" instituteforgovernment.org.uk (Tier 5, institutional/nonpartisan think tank).\n- UK press coverage of Behavioural Insights Team's continuing government contract work, June 2026 (Tier 4/6, aggregated).\n- Behavioural Insights Team, \"Analysis Finds Nudge Interventions Results are Real & Meaningful,\" bi.team (Tier 6, subject's own response to critique, noted).\n- OECD Observatory of Public Sector Innovation, \"Mapping the global behavioural insights community,\" oecd-opsi.org (Tier 2, institutional).\n- US General Services Administration, Office of Evaluation Sciences, oes.gsa.gov (Tier 1, primary/institutional).\n- Stefano DellaVigna and Elizabeth Linos, \"RCTs to Scale: Comprehensive Evidence from Two Nudge Units,\" NBER Working Paper 27594 (Tier 1, primary academic).\n- Congressional Research Service, \"Semiconductor Fabrication Facilities Funded by the CHIPS Act: Project Status and Considerations for Congress,\" Report R49031, updated July 14, 2026, congress.gov (Tier 1, primary).\n- CNBC, \"Trump administration reportedly weighs 10% stake in Intel via CHIPS Act grants, making government top shareholder,\" August 19, 2025, cnbc.com (Tier 4).\n- Intel Newsroom, \"Intel and Trump Administration Reach Historic Agreement to Accelerate American Technology and Manufacturing Leadership,\" newsroom.intel.com (Tier 1, primary/corporate).\n- US Senate Committee on Banking, Housing, and Urban Affairs (Minority), correspondence to Commerce Department on the Intel-CHIPS deal, banking.senate.gov (Tier 1, primary).\n- Bloomberg, \"US Semiconductor Labor Shortage Threatens Billions in Chip Factory Investments,\" July 7, 2026, bloomberg.com (Tier 4).\n- Semiconductor Industry Association, \"Chipping Away: Assessing and Addressing the Labor Market Gap Facing the U.S. Semiconductor Industry\" and 2026 Workforce Policy Blueprint, semiconductors.org (Tier 2, industry-institutional, noted lean).\n- Rhodium Group, Clean Investment Monitor, \"The State of US Clean Energy Supply Chains in 2025,\" rhg.com (Tier 5, analytical/energy-transition lean, noted).\n- Sidley Austin, client insights on the One Big Beautiful Bill Act's energy provisions, May and July 2025, sidley.com (Tier 2, legal-institutional).\n- Novogradac, \"The Final One Big Beautiful Bill Act is Bad News for Solar, Wind, Home Energy Efficiency, Other Clean Energy Tax Credits,\" novoco.com (Tier 5, clean-energy-industry lean, noted).\n- E2 (Environmental Entrepreneurs), Clean Economy Works Tracker, e2.org (Tier 5, clean-energy-advocacy lean, noted).\n- European Court of Auditors, Special Report 12/2025, \"The EU's strategy for microchips,\" April 2025, eca.europa.eu (Tier 1, primary/audit).\n- European Commission, state-aid decisions on first-of-a-kind semiconductor facilities and the evaluation and review report on the European Chips Act, COM(2026) 504 final, eur-lex.europa.eu (Tier 1, primary).\n- Bruegel, \"Revamping Europe's chips strategy: indispensability, not self-sufficiency,\" bruegel.org (Tier 5, EU-integration-institutional lean, noted).\n- ifo Institute EconPol, \"Rethinking the EU Chips Act: Europe Should Strengthen Its Strategic Assets Instead of Subsidizing National Champions,\" February 13, 2026, ifo.de (Tier 5, German ordoliberal-adjacent lean, noted).\n- Interface-EU, \"The Missing Strategy in Europe's Chip Ambitions,\" interface-eu.org (Tier 5, analytical, noted).\n- Wedbush Securities investor research note, \"China Reaches 35% Semiconductor Equipment Self-Sufficiency Amid Advanced Lithography Breakthroughs,\" January 21, 2026 (Tier 5, sell-side analyst, noted).\n- Electronics Weekly, \"China plans for 80% semiconductor self-sufficiency,\" March 2026, electronicsweekly.com (Tier 4).\n- TechWireAsia, \"China Semiconductor Self-Sufficiency and the 70% Wafer Question,\" May 2026, techwireasia.com (Tier 4).\n- International Monetary Fund, \"Industrial Policy Is Adapting to Crises, but Remains Hard to Implement Effectively,\" May 28, 2026, imf.org (Tier 1, primary/institutional)."}, {"order": 9, "file": "09_The_Neoclassical_Mainstream.md", "title": "The Neoclassical Mainstream: The School That Does Not Call Itself One", "summary": "", "body": "# The Neoclassical Mainstream: The School That Does Not Call Itself One\n\n## Bottom Line\n\nEvery other tradition mapped in these pages defines itself against a center of gravity that\nrarely names itself. Ask a Marxist, an Austrian, a post-Keynesian, or an ecological economist\nwhat they oppose and you get the same answer in different vocabularies — \"the mainstream,\"\n\"neoclassical economics,\" \"the orthodoxy.\" Ask a professor at a large American economics\ndepartment what school she belongs to and she will most likely say none: she does applied\nmicroeconomics, or labor, or public finance. That asymmetry is the single most important\npolitical fact about the discipline. A tradition that has stopped experiencing itself as a\ntradition has converted a contestable set of theoretical commitments — that behavior is usefully\nmodeled as constrained optimization, that equilibrium is the right organizing concept, that\nclaims should be expressed mathematically and tested statistically — into something closer to\nthe definition of competence. The conversion happened in identifiable stages: Marshall gave the\nmarginalist insight a workable diagrammatic apparatus in 1890; Walras and his Lausanne\nsuccessors gave it a whole-economy system; Samuelson gave it a common mathematical language\nafter 1947 and, through a textbook that sold millions of copies, gave it the undergraduate\ncurriculum; Arrow and Debreu gave it, in 1954, a formal proof that a competitive economy has an\nequilibrium and that the equilibrium is efficient. What is less often said is that the same\nresearch program produced, from inside itself, the results that most damage its strongest\nclaims — the Sonnenschein-Mantel-Debreu theorem showed that individual rationality places\nalmost no restriction on how a whole market behaves, and Samuelson himself conceded in 1966 that\nthe aggregate capital concept underlying textbook production functions is not generally\ncoherent. Neither result changed the teaching or the practice much, which tells you that the\nmainstream's authority does not rest primarily on its theorems. It rests on institutions: five\njournals, a hiring market, a referee network, and a professional norm of technique that\nfunctions, whatever anyone intends, as a filter on who is allowed to say something about the\neconomy and be heard.\n\n## Two Foundings: Marshall's Cambridge and Walras's Lausanne\n\nThe chapter on classical foundations ends with the marginal revolution of 1871-1874 splitting\nthe classical inheritance three ways — Jevons in England, Menger in Vienna, Walras in Lausanne —\nand hands the Austrian branch to its own chapter. What happened to the other two branches is the\nsubject here, and they did not develop as one thing. Two quite different projects grew out of\nmarginal utility, and the tension between them still organizes the discipline.\n\nAlfred Marshall, who held the chair of political economy at Cambridge from 1885 to 1908, built\nthe practical branch. His *Principles of Economics* (1890) took the marginalist apparatus and\nmade it usable by an intelligent official or businessman: supply and demand as two blades of a\nscissors, neither of which alone cuts; elasticity as a measurable property of a demand curve;\nconsumer surplus as a way of putting a number on the gain from a transaction; the short run and\nthe long run as distinct analytical periods. Marshall's decisive methodological move was\n*ceteris paribus* — hold everything else constant, examine one market at a time. It is a\nconcession, and Marshall knew it: the world's markets are all connected, and freezing the rest\nof them is a fiction adopted for tractability. But it is the fiction that made economics\nteachable and applicable, and the partial-equilibrium diagram remains, more than a century\nlater, the single most-used tool in policy economics. Marshall was also, by temperament, a\ncautious empiricist who buried his mathematics in appendices and warned against letting the\nformalism run ahead of the facts — an instruction his successors comprehensively ignored.\n\nLéon Walras, at Lausanne, built the ambitious branch. His *Elements of Pure Economics*\n(1874/1877) asked the question Marshall set aside: can all markets clear at once? Walras wrote\ndown a system of equations in which every household's demands and every firm's supplies depend\non all prices simultaneously, and argued that a set of prices exists at which every market\nbalances. His account of how such prices might be found — *tâtonnement*, a groping process in\nwhich an auctioneer calls out prices and no trade occurs until the whole system balances — is\ntransparently not a description of any real market, and Walras did not claim it was. It was a\nthought experiment about whether decentralized self-interest is even logically capable of\nproducing coherence. Vilfredo Pareto, who succeeded Walras at Lausanne, took the next step by\nstripping out the need to measure utility cardinally and supplying the efficiency criterion that\nstill bears his name: an allocation is efficient if no one can be made better off without making\nsomeone worse off. That definition is doing enormous political work, and it is worth saying so\nplainly. Pareto efficiency is silent on distribution. A society in which one person holds\neverything and everyone else starves can be Pareto efficient, because moving anything to the\nstarving requires making the holder worse off. Building welfare economics on this criterion was\na choice, and it built a discipline whose default professional vocabulary is far more articulate\nabout the size of the pie than about its division.\n\n## Samuelson: The Language, and the Textbook\n\nThe mathematization of Anglo-American economics after 1945 is a story with one man at its\ncenter, and his influence ran through two very different books.\n\nPaul Samuelson's *Foundations of Economic Analysis* (1947), developed from his doctoral work at\nHarvard, made a claim that now sounds banal and was then radical: that the apparently disparate\npropositions of economic theory — consumer demand, firm behavior, international trade,\npublic finance — are all instances of the same mathematics, the maximization of an objective\nfunction subject to constraints, plus the requirement that equilibria be stable. If that is\ntrue, then a single technical apparatus generates the whole subject, and a person who has not\nmastered the apparatus cannot contribute to it. This is the moment at which economics acquired\nits characteristic barrier to entry. When the Royal Swedish Academy awarded Samuelson the second\neconomics Nobel in 1970, the citation was explicit about what it was rewarding — the development\nof static and dynamic economic theory and the raising of the level of analysis in economic\nscience — and the Academy's supporting statement said that Samuelson had done more than any\ncontemporary economist to raise the level of scientific analysis in economic theory. The prize\nwas, in effect, for the successful installation of a method.\n\nThe second book did the political work. *Economics: An Introductory Analysis*, first published\nin 1948, went through nineteen editions across six decades, was translated into some forty-one\nlanguages, and sold in the millions — by any measure the most influential economics textbook\never written. Its opening chapters trained generations of students to see the economy as a set\nof curves that cross, and its middle chapters — the \"neoclassical synthesis\" discussed at length\nin the chapter on Keynesianism — taught them that Keynesian demand management handles the\naggregate while neoclassical price theory handles everything else. Whatever one thinks of the\nsynthesis intellectually, its institutional effect was decisive: it made peace between the two\ndominant postwar bodies of theory in a form that could be examined in a first-year course. A\nschool that owns the introductory textbook does not need to win arguments with rival schools. It\ndefines what a student must know before the argument can begin.\n\nCui bono is worth asking here without cynicism. The formalization was not a plot; Samuelson's\nown politics were center-left and he spent decades arguing for active fiscal policy against\nopponents who used the same mathematics. But the beneficiaries of a technique-defined\ndiscipline are structurally identifiable. They are the departments that can teach the technique;\nthe students with the mathematical preparation to acquire it, who are disproportionately drawn\nfrom well-resourced schooling; and, at the policy level, any interest whose preferred\narrangement can be defended in the vocabulary of efficiency rather than of distribution. The\ntraditions that lost standing in the same decades — institutionalism, treated in the chapter on\nordoliberalism and institutionalism, and the historical and descriptive approaches — lost it in\nsubstantial part because they had no comparable apparatus, not because their questions had been\nanswered.\n\n## 1954: The Proof\n\nThe high theoretical achievement of the tradition arrived in the July 1954 issue of\n*Econometrica*, where Kenneth Arrow and Gérard Debreu published \"Existence of an Equilibrium\nfor a Competitive Economy\" (Vol. 22, pp. 265-290). Lionel McKenzie published a closely related\nexistence result in the same journal and year, and the standard attribution has always slightly\nunderweighted him. Using fixed-point methods borrowed from topology, Arrow and Debreu proved\nthat under stated conditions — convex preferences, convex production sets, complete markets,\nprice-taking behavior — a set of prices exists that clears every market at once. Walras's\neighty-year-old conjecture became a theorem.\n\nTwo further results, formalized in the same period, gave the theorem its political charge. The\nfirst fundamental theorem of welfare economics states that any competitive equilibrium is Pareto\nefficient. The second states that, given convexity, any Pareto-efficient allocation can be\nreached as a competitive equilibrium after suitable lump-sum redistribution of initial\nendowments. Together they are the most consequential pair of propositions in modern economics.\nThe first is often read in public argument as a mathematical vindication of Adam Smith's\ninvisible hand — the market, left alone, does not merely muddle through but hits an optimum. The\nsecond is read, less often, as the license for a technocratic social democracy: redistribute\nendowments however justice requires, then let markets run, and you can have both equity and\nefficiency without administrative allocation. Both readings are overreadings, and the people who\nproved the theorems knew it better than their popularizers. Arrow spent much of his later career\non precisely the conditions under which the theorems fail — asymmetric information, missing\nmarkets, moral hazard in medical care — and his 1963 paper on the economics of medical care is\none of the foundational documents of market-failure analysis. Debreu, by contrast, treated the\nenterprise as pure mathematics and was scrupulous about not drawing policy conclusions from it\nat all. Arrow shared the 1972 Nobel with John Hicks; Debreu received his in 1983.\n\nThe honest way to state what 1954 established is this. It showed that the idea of a\nself-coordinating economy is not incoherent — that a decentralized system of self-interested\nagents can, in principle, produce a consistent set of prices, which is a real intellectual\nachievement and was not obvious. It did not show that any actual economy reaches such a state,\nthat the state is unique, that the system tends toward it over time, or that the assumptions\nrequired hold anywhere. Those were exactly the questions the next twenty years of research took\nup, and the answers were not favorable.\n\n## The Results the Program Produced Against Itself\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 330\" role=\"img\" aria-label=\"Two results the neoclassical program produced against its own strongest claims. The Arrow-Debreu proof of 1954 established that a competitive equilibrium exists. The Sonnenschein-Mantel-Debreu results of 1972 to 1974 showed that individual rationality places almost no constraint on aggregate demand, so equilibrium need not be unique or stable. Samuelson conceded in 1966 that reswitching is possible and the capital parables cannot be universally valid. Neither result changed what is taught or modelled.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"13\" letter-spacing=\"2.5\">THE RESULTS IT PRODUCED AGAINST ITSELF<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">conceded on the logic, unchanged in the practice<\/text>\n<rect x=\"46\" y=\"70\" width=\"180\" height=\"66\" rx=\"2\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"136\" y=\"94\" text-anchor=\"middle\" font-size=\"11\" class=\"t-inv\" font-weight=\"bold\">1954 · Arrow-Debreu<\/text>\n<text x=\"136\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">a competitive equilibrium<\/text>\n<text x=\"136\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">exists<\/text>\n<path d=\"M232,103 L268,103\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<polygon points=\"264,97 278,103 264,109\" class=\"f-t2\"/>\n<rect x=\"284\" y=\"70\" width=\"196\" height=\"66\" rx=\"2\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<text x=\"382\" y=\"92\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">1972-74 · Sonnenschein,<\/text>\n<text x=\"382\" y=\"106\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">Mantel, Debreu<\/text>\n<text x=\"382\" y=\"123\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">but it need not be unique or stable<\/text>\n<path d=\"M490,103 L526,103\" class=\"s-t3\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\"/>\n<polygon points=\"522,97 536,103 522,109\" class=\"f-t3\"/>\n<rect x=\"542\" y=\"70\" width=\"122\" height=\"66\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1.5\"/>\n<text x=\"603\" y=\"96\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Taught<\/text>\n<text x=\"603\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">unchanged<\/text>\n<text x=\"603\" y=\"128\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">representative agent<\/text>\n<rect x=\"46\" y=\"176\" width=\"180\" height=\"66\" rx=\"2\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"136\" y=\"200\" text-anchor=\"middle\" font-size=\"11\" class=\"t-inv\" font-weight=\"bold\">Capital parables<\/text>\n<text x=\"136\" y=\"216\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">one aggregate capital,<\/text>\n<text x=\"136\" y=\"229\" text-anchor=\"middle\" font-size=\"9\" class=\"t-inv\">one interest rate<\/text>\n<path d=\"M232,209 L268,209\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<polygon points=\"264,203 278,209 264,215\" class=\"f-t2\"/>\n<rect x=\"284\" y=\"176\" width=\"196\" height=\"66\" rx=\"2\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<text x=\"382\" y=\"198\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" class=\"t-acc\">1966 · Samuelson<\/text>\n<text x=\"382\" y=\"214\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">concedes reswitching is possible<\/text>\n<text x=\"382\" y=\"228\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">and the parables are not general<\/text>\n<path d=\"M490,209 L526,209\" class=\"s-t3\" stroke-width=\"2.5\" stroke-dasharray=\"4 3\"/>\n<polygon points=\"522,203 536,209 522,215\" class=\"f-t3\"/>\n<rect x=\"542\" y=\"176\" width=\"122\" height=\"66\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1.5\"/>\n<text x=\"603\" y=\"202\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Taught<\/text>\n<text x=\"603\" y=\"218\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">unchanged<\/text>\n<text x=\"603\" y=\"234\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">aggregate production fn<\/text>\n<line x1=\"46\" y1=\"266\" x2=\"664\" y2=\"266\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"290\" text-anchor=\"middle\" font-size=\"10\" class=\"t-muted\" font-style=\"italic\">The tradition generated both refutations itself, conceded both, and carried on.<\/text>\n<text x=\"350\" y=\"310\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">Which suggests its authority never rested on the theorems in the first place.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 6.<\/strong> The mainstream's most damaging results are its own. It proved equilibrium exists, then proved that individual rationality barely constrains it; Samuelson conceded the capital critique outright in 1966. Neither concession altered the representative agent or the aggregate production function, which is the clearest evidence that the tradition's authority is institutional rather than deductive.<\/figcaption>\n<\/figure>\n\n\nBetween 1972 and 1974, Hugo Sonnenschein, Rolf Mantel, and Debreu himself established a result\nwhose implications the profession has never fully digested. The Sonnenschein-Mantel-Debreu\ntheorem — nicknamed, aptly, the \"anything goes\" theorem — shows that the aggregate excess demand\nfunction of an economy inherits almost nothing from the rationality of the individuals composing\nit. Beyond a few technical properties (continuity, homogeneity, and Walras's law), aggregate\ndemand can take essentially any shape you like, even when every single consumer is a textbook\noptimizer. The mechanism is wealth effects: a price change makes some people richer and some\npoorer, and the resulting demand shifts can go in any direction.\n\nThe consequences are severe for the strongest form of the general-equilibrium program.\nEquilibrium may not be unique — there may be many, with no criterion internal to the theory for\nchoosing among them. Stability is not guaranteed: nothing ensures that an economy displaced from\nequilibrium returns to it. And the practice of modeling a whole economy as a single\n\"representative agent,\" which became standard in macroeconomics precisely because aggregation is\notherwise intractable, is not licensed by microeconomic theory; it is an assumption imposed\nbecause the alternative is unmanageable. A tradition that grounds its authority on\nmicro-foundations has a theorem, produced by its own leading figures, showing that\nmicro-foundations do not determine macro behavior. The response was not refutation but\nredirection: the profession largely moved on to models with enough additional structure to\nrestore determinacy, and the theorem survives as a graduate-course footnote.\n\nThe Cambridge capital controversy is the other internally generated wound, and the more\ninstructive one for anyone interested in how disciplines actually settle disputes. Beginning\nwith Joan Robinson's 1953 challenge and sharpened by Piero Sraffa's *Production of Commodities\nby Means of Commodities* (1960), economists at Cambridge, England, attacked the aggregate\nproduction function — the workhorse device that treats \"capital\" as a single quantity K earning\na return equal to its marginal product. Their point was that capital goods are heterogeneous\n(a lathe is not a truck), so aggregating them requires valuing them, which requires knowing the\ninterest rate, which is what the production function was supposed to explain. The\nCambridge, Massachusetts side, led by Samuelson and Robert Solow, defended the aggregate. The\nargument came to a head in a 1966 *Quarterly Journal of Economics* symposium in which\nPasinetti, Garegnani, and others produced counterexamples demonstrating \"reswitching\" — a\ntechnique that is most profitable at high interest rates and again at low ones, with a different\ntechnique in between, which destroys any monotonic relation between the interest rate and\ncapital intensity. Samuelson's response, \"A Summing Up\" (*QJE* 80(4), 1966, pp. 568-583),\nconceded the logic outright: reswitching is a genuine possibility, and the neoclassical\n\"parables\" about capital cannot be universally valid.\n\nThat is a concession by the discipline's most authoritative theorist that a central textbook\nconstruct is not generally sound. What followed is the point. As Avi Cohen and Geoffrey Harcourt\ndocumented in their retrospective for the *Journal of Economic Perspectives* (2003), the\ncontroversy simply faded from the mainstream's memory: the aggregate production function\nremained standard in growth theory, macroeconomics, and empirical work, and graduate students\nstopped being taught that the question had been raised at all. The English Cantabrigians won on\nlogic and lost on institutions. Anyone trying to understand how the mainstream maintains its\nposition should study that outcome closely — it is the clearest available demonstration that\nbeing right, in this discipline as in others, is not sufficient and is sometimes not even\nparticularly relevant.\n\n## Growth, and the Absorption of Schumpeter\n\nThe mainstream's most durable empirical contribution came from Solow, and it began as an\nembarrassment. His 1956 model of growth, and especially his 1957 paper decomposing American\noutput per worker-hour between 1909 and 1949, found that only a small fraction of the increase\ncould be attributed to more capital per worker; roughly seven-eighths was left over, attributable\nto \"technical change\" — a residual that the model measured but did not explain. The Solow\nresidual is the single most important number in modern growth economics precisely because it is\na confession: the theory could account for the accumulation of things and not for the source of\nprosperity. Solow received the Nobel in 1987 for the theory of economic growth.\n\nFilling that residual took thirty years and required the mainstream to reach outside itself,\nto a figure it had spent decades not knowing what to do with. Joseph Schumpeter is the most\nimportant economist of the twentieth century who belongs to no school in this survey. Trained in\nVienna in Böhm-Bawerk's seminar but never an Austrian in the Misesian sense; a theorist of\ncapitalist dynamism who thought capitalism was doomed; a serving finance minister of Austria and\na failed banker before he was a Harvard professor; a man who presided over the Econometric\nSociety while doubting that the economy's most important processes could be captured by\nequilibrium mathematics at all. His *Theory of Economic Development* (1911) put the\nentrepreneur, not the price mechanism, at the center of the story, and his *Capitalism,\nSocialism and Democracy* (1942) supplied the phrase everyone knows — creative destruction, \"the\nprocess of industrial mutation\" that continuously destroys the old economic structure while\ncreating a new one. His accompanying prediction was that capitalism would not fail but succeed\nitself into extinction, as bureaucratized corporate research routinized innovation and an\nalienated intellectual class eroded the bourgeois values sustaining it; that forecast has aged\ninto an interesting half-truth rather than a vindication.\n\nSchumpeter's ideas were unusable by the mainstream for as long as they remained literary. They\nbecame usable when Paul Romer's work on endogenous technological change in 1990 made the\nproduction of ideas an economic decision inside the model, and when Philippe Aghion and Peter\nHowitt's \"A Model of Growth Through Creative Destruction\" (*Econometrica* 60, 1992, pp.\n323-351) formalized the specific Schumpeterian mechanism: quality-improving innovations that\ndisplace incumbents, with the prospect of one's own future displacement feeding back on the\nincentive to innovate now. Romer received the Nobel in 2018. Aghion and Howitt received it in\nOctober 2025, jointly with the economic historian Joel Mokyr, the prize awarded \"for having\nexplained innovation-driven economic growth,\" with the Aghion-Howitt half cited \"for the theory\nof sustained growth through creative destruction.\"\n\nThat 2025 award is a good place to see the mainstream's characteristic strength and its\ncharacteristic move in the same gesture. The strength is real: a metaphor that had floated in\nessayistic prose for fifty years was turned into a model with testable implications about entry,\nincumbency, competition, and the design of innovation policy, and Mokyr's share of the prize\nbrought historical evidence on why sustained growth began where it did into the same\nconversation. The move is the tradition's standard one: an outside idea is admitted once it has\nbeen reformulated in the internal language, and the parts that resist reformulation —\nSchumpeter's insistence that capitalism is a process in historical time that never sits at an\nequilibrium, and his sociological account of the system's own political decay — are left at the\ndoor. The mainstream did not lose the argument with Schumpeter. It annexed the tractable half.\n\n## The Empirical Turn, and What It Changed\n\nAnyone describing the contemporary mainstream purely in terms of general equilibrium and\noptimizing agents is describing the discipline of about 1985. The most important change in\neconomics over the last thirty-five years is methodological rather than doctrinal, and it has\nmade the tradition considerably harder to caricature.\n\nThe \"credibility revolution,\" named in Joshua Angrist and Jörn-Steffen Pischke's 2010 survey in\nthe *Journal of Economic Perspectives*, moved the discipline's center of gravity from theory to\nresearch design. The organizing question became not \"what does the model predict\" but \"what\nvariation in the data allows a causal claim to be identified\" — natural experiments, differences\nin differences, instrumental variables, regression discontinuity. Angrist, Azoulay, Ellison,\nHill, and Lu documented the shift quantitatively in the *American Economic Review* Papers and\nProceedings (2017): the empirical share of published work rose across every field, including\nfields that had been strongholds of theory, and empirical papers reached and then surpassed\ntheoretical papers in citations. The 2021 Nobel to David Card, Angrist, and Guido Imbens\nformalized the change at the highest level of professional recognition.\n\nThis matters for the argument between schools in a way critics of the mainstream often miss.\nMuch of the best-known empirical work of this era overturned conclusions the older price theory\nhad treated as settled — most famously Card and Alan Krueger's 1994 finding that a New Jersey\nminimum-wage increase did not reduce fast-food employment as the textbook competitive model\npredicted, a result that took decades of contested replication and now sits inside mainstream\nlabor economics rather than outside it. A tradition capable of that reversal is not a closed\nideological system. The strongest version of the case for the mainstream is precisely this: its\ncurrent working practice is more empirical, more agnostic, and more willing to be surprised by\ndata than any rival tradition in this survey, several of which continue to derive conclusions\nfrom first principles and treat disconfirming evidence as a problem of interpretation.\n\nThe counter-case is that the empirical turn changed the discipline's methods without changing\nits horizon. Well-identified causal estimates are, almost by construction, estimates of the\neffect of a marginal intervention within an existing institutional structure — the effect of a\ncash transfer, a school voucher, a wage floor. Questions about the structure itself — whether\nthe wage relation is exploitative, whether growth is ecologically bounded, whether the money\nsupply is endogenous, whether property rights are prior to the state — are not the sort of thing\na regression discontinuity can address, and they are correspondingly less likely to be asked.\nPaul Romer, from inside the tradition and shortly before his Nobel, made a related charge about\nits theoretical wing: his 2015 *American Economic Review* paper on \"mathiness\" argued that\neconomists were using mathematical formalism to give contested claims a scientific veneer while\nleaving deliberate slippage between the words and the symbols, and his 2016 lecture \"The Trouble\nwith Macroeconomics\" argued that macroeconomic theory had deteriorated to the point where much\nof it no longer qualified as scientific research. When the discipline's own laureates say this\nin its flagship journal, dismissing the critique as heterodox sour grapes is not available.\n\n## The Machinery: How the Mainstream Actually Reproduces Itself\n\nThe insider's question is not what the mainstream believes but how it enforces belonging, and\nthe answer is unusually well documented because economists have studied their own profession\nwith the same tools they use on labor markets.\n\nJames Heckman — a Nobel laureate and by no stretch a heterodox partisan — and Sidharth Moktan\npublished \"Publishing and Promotion in Economics: The Tyranny of the Top Five\" in the *Journal\nof Economic Literature* (58(2), 2020, pp. 419-470). Examining the job histories of tenure-track\neconomists hired by the top 35 US departments, they found that publication in five journals —\nthe *American Economic Review*, *Econometrica*, the *Journal of Political Economy*, the\n*Quarterly Journal of Economics*, and the *Review of Economic Studies* — exerts a dominant\ninfluence on tenure outcomes, that young economists' behavior is organized around obtaining\nthose publications, and that the screen is unreliable on its own terms, since a substantial share\nof influential work appears elsewhere. Their conclusion is that reliance on the top five\n\"incentivizes careerism over creativity.\"\n\nConsider what a five-journal bottleneck means structurally. Editors and referees at those\njournals are drawn overwhelmingly from a small set of departments. A paper challenging the\nfoundational commitments of the tradition must persuade referees who have built careers on those\ncommitments, in a venue whose acceptance rates are in the single digits, and must do so in the\ntradition's own technical idiom or be desk-rejected as unrigorous. No conspiracy is required for\nthis to function as an ideological filter; ordinary peer review, plus a tenure clock, plus a\nscarce publication slot, produces the filtering automatically. The demographic result is a\nprofession that has remained strikingly narrow. The Committee on the Status of Women in the\nEconomics Profession, which has surveyed roughly 250 US departments annually since 1972, reported\nin 2024 that women's share of assistant professorships in PhD-granting departments had reached a\nnew high of 33.7 percent — measured against a 1972 baseline of 8.8 percent of assistant\nprofessors and 2.4 percent of full professors, that is genuine progress; measured against the\nshare of the population, or against the composition of comparably selective fields, it is a\ntradition still reproducing itself from a narrow base, with women's representation falling\nfurther at each successive rank.\n\nCui bono, then. The primary beneficiary of the arrangement is the profession itself: a\ncredentialing monopoly over a domain of public argument, exercised through central banks,\nfinance ministries, international financial institutions, expert testimony, and regulatory\nreview, is an extraordinarily valuable asset and it is defended as such. The secondary\nbeneficiaries are the interests whose preferred policies are most easily expressed in the\ntradition's terms — anything defensible as an efficiency gain arrives pre-legitimated, while\nanything requiring a distributional or ethical premise must import that premise from outside the\nmodel and is marked, in the discipline's own idiom, as \"normative.\" That asymmetry is not a\nconsequence of any economist's politics. It is built into a welfare criterion, chosen at\nLausanne in the 1890s, that can rank states of the world only when nobody is made worse off.\n\n## Open Questions\n\nWhether the mainstream is best described as a school with doctrinal commitments or as a method\nthat is genuinely open to any conclusion is contested by serious people on both sides, and the\nanswer may differ by subfield: applied microeconomics in 2026 looks far more like an empirical\nscience with no fixed politics than macroeconomics does, and any single verdict on \"the\nmainstream\" that does not distinguish between them is likely to be wrong about one of them.\nWhether the empirical turn will eventually force a theoretical reckoning — the accumulated stock\nof well-identified findings that fit awkwardly with optimizing models is now large, and no\nsuccessor framework has emerged to organize them — is open; the historical precedent of the\ncapital controversy suggests the discipline is capable of absorbing an unresolved anomaly\nindefinitely rather than resolving it. Whether the top-five bottleneck documented by Heckman and\nMoktan is loosening under the pressure of working papers
