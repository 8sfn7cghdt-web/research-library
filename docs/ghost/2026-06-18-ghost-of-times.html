/* A single Ghost of Times edition — the corpus reader's reading column in

.gh-edition { max-width: 760px; margin: 0 auto; padding: 2.2rem 2rem 1rem; }

<script id="ghost-edition-data" type="application/json">{"edition_number": 7, "lead": {"kicker": "BY THOMAS CARLYLE", "author_byline": "BY THOMAS CARLYLE", "headline": "Peace Signed Digitally; And the Oil Shall Flow For Sixty Days", "dek": "A War ended by Memorandum at Versailles, with Fourteen Points and a smell of Mammon over all.", "factual_summary": "On June 17, 2026, President Trump and Iran's president signed a 14-point memorandum of understanding to end a war that had run since February 2026, with the signing taking place at the Palace of Versailles following a G7 dinner hosted by French President Emmanuel Macron at Évian; a formal ceremony was scheduled for later in the week in Switzerland. The deal establishes a 60-day ceasefire and negotiation framework, commits to reopening the Strait of Hormuz with free passage of commercial vessels for 60 days, removes a US naval blockade within 30 days, and pledges to develop a reconstruction plan of at least $300 billion for Iran funded by regional partners rather than the US directly, while Iran reaffirms it will not seek nuclear weapons and will down-blend its enriched uranium under IAEA supervision. This Carlyle op-ed treats the agreement skeptically, reading the digital signature, the 60-day terms, and the money as signs that a 'permanent termination' has been declared over what may prove a temporary and Mammon-driven arrangement, and noting the doubts voiced by figures including Ted Cruz, Benjamin Netanyahu, and the administration's own CIA director.", "body": "It is done: at Versailles, in that same gilded Hall where other Treaties were signed into the teeth of other Destinies, a Memorandum has been put to paper, and a War four months old is declared over. Fourteen Points, no less,—a sacred number, it would seem, in the arithmetic of Stump-Orators. The Seven Captains of the Earth, gathered at Évian to dine at the table of Macron, have set their hands to a Joint Statement; and that Statement, O reader, takes care to praise the chief Signatory by name. Mark it well. When the Powers assemble to congratulate one Man upon his own Peace, the Peace is already half a Pageant.\n\nAnd how, pray, was this Everlasting Concord between Persia and the West entered into? Not by two earnest souls clasping hands over a thing they would die for; not at the elbow of the Eternities at all. \"We already signed the deal digitally yesterday,\" announces the Vice-President to the morning television, as a man might report the purchase of a hat. Digitally! The Speaker of the Persian Parliament signs in by conference-call, as to a meeting of shareholders. Behold the new sacrament of the Mechanical Age: a Peace that no hand has touched, witnessed by no Heaven, transacted through the air like a quotation of stocks. Truth, my friends, has never yet been delivered by telegraph; and a Reality signed by Phantasms remains a Phantasm still.\n\nThen comes the Money,—for there is always the Money. Three hundred thousand million of dollars are pledged to the rebuilding of Iran; not from the American purse, we are assured, but \"it may be possible for other countries to invest.\" So: the cash-nexus, which has dissolved every bond between man and man into a bargain, is now to dissolve the bond between Nation and Nation, and call the residue a Brotherhood. The relief of sanctions is a \"performance-based thing,\" says the Vice-President,—a phrase to make the angels weep,—as though the Justice of the Universe were a contract of hire, payable on satisfactory delivery of enriched uranium down-blended under inspection. Mammon's Law, not Christ's Law, rules yet in this transaction; and Mammon, decked in the robes of Peace, is not therefore God.\n\nAnd the Strait! The Strait of Hormuz \"will reopen,\" cries the chief Signatory: \"Let the oil flow!\" A noble cry, were it true. But read the small print of the Eternities, the terms as the scribes have set them down: \"safe passage of commercial vessels with no charge for sixty days only.\" Sixty days! Here is the whole Sham in a single clause. A thing is proclaimed Permanent in the headline and leased by the fortnight in the body; the \"permanent termination\" of war is written in ink that dries in two months. Thou foolish Age, that canst not tell a Vow from a quarter's tenancy! The oil shall flow,—until the oil shall cease to flow; and the negotiators will then sit down with Oman to \"define the future administration\" of that which they have just called settled.\n\nNor is the doubt confined to the scolds of the desert. The Senator Cruz, no friend to caution, warns that \"history teaches that giving billions of dollars to theocratic lunatics who want to murder us is a bad idea\"; and his is the blunt Anglo-Saxon verdict the silken document refuses to print. From Jerusalem, Netanyahu growls that \"as long as I am the Prime Minister of Israel, Iran will not have nuclear weapons,\"—agreement or no agreement, which is to say he trusts the parchment not at all. And, most damning, the Master's own spy-chief is reported to harbour \"serious doubts\" that Iran will ever surrender what it has sworn to surrender. When a King's own watchmen disbelieve the King's own Peace, the prudent reader will keep his powder dry.\n\nUnderstand me. I do not mourn the silencing of guns; let no cannon speak that need not speak, and there are tears due to the slain on every side of that four-months' fire. If this Memorandum stays one bullet, it has done one honest thing, and I will not sneer at that. But a Peace is not the absence of shooting; a Peace is a Reality, sincere in the hearts that make it, or it is a Pageant got up for the cameras and the Joint Statements and the congratulating Captains. This one was signed without hands, leased by the calendar, underwritten by Mammon, and disbelieved by the very men who drew it.\n\nThe oil will flow, and the speeches will flow faster; and somewhere beneath both, the old unappeased Reality waits, patient as the rock. Sixty days, reader. We shall see what the sixty-first brings. Adieu.—and watch the Strait.", "filed_date": "2026-06-18", "byline_html": "<em>On reporting in<\/em> <a href=\"https://www.nbcnews.com/world/iran/strait-hormuz-reopen-us-lift-iran-sanctions-14-point-deal-seeking-end-rcna350513\">NBC News<\/a> &nbsp;·&nbsp; <a href=\"https://www.newsweek.com/us-iran-14-point-deal-uranium-sanctions-hormuz-draft-12087032\">Newsweek<\/a> &nbsp;·&nbsp; <a href=\"https://www.foxnews.com/politics/read-it-full-text-us-iran-memorandum-understanding\">Fox News<\/a> &nbsp;·&nbsp; <a href=\"https://www.washingtonexaminer.com/news/white-house/4608561/vance-iran-war-deal-memorandum-understanding-signed-digitally/\">Washington Examiner<\/a> &nbsp;·&nbsp; <a href=\"https://www.jpost.com/middle-east/iran-news/article-899616\">The Jerusalem Post<\/a> &nbsp;&nbsp;|&nbsp;&nbsp; <span class=\"filed\">Filed 2026-06-18<\/span>"}, "sections": [{"section_title": "BY G.K. CHESTERTON", "section_class": "writer-piece", "stories": [{"headline": "The Trustworthy Have Nominated Themselves", "dek": "On a coalition of the safe, assembled to govern a thing too big for them.", "author_byline": "BY G.K. CHESTERTON", "factual_summary": "At a closed-door G7 lunch in Evian-les-Bains, Anthropic's Dario Amodei and Google DeepMind's Demis Hassabis called for a US-led international coalition to govern frontier AI through shared safety evaluations, technical standards, and a 'trusted partners' access system, framed against intensifying competition with China. OpenAI's Sam Altman dissented, warning that labs should not concentrate power, and French President Emmanuel Macron objected that restricting access could undermine confidence in American technology firms. The op-ed argues that the real issue is not China but a small group of powerful actors seeking advance agreement that only they should control the technology, and it likens the proposal's logic to earlier expert-led schemes that excluded ordinary people from decisions about their own lives.", "body": "It is the wisest thing in the world to cry out before you are hurt, and I propose to cry out now, while the hatchet is still in the air over a luncheon table at Evian-les-Bains. The gentlemen seated round that table — about a dozen of them, with three Cabinet ministers and the heads of the Western states for company — have agreed upon a most reasonable thing. They have agreed that the most powerful minds ever assembled by men ought to be governed by a coalition of the trustworthy; and they have very kindly nominated themselves as the trustworthy. I do not doubt their sincerity for an instant. That is precisely what alarms me.\n\nMr. Amodei, of the firm called Anthropic, begs the rulers of the earth to \"resist the temptation to splinter.\" It is a fine phrase, and like all fine phrases it deserves to be taken at its word and walked about until it falls over. A thing splinters when it is dropped; a thing splinters when it is struck; a thing splinters, above all, when it was never one solid thing to begin with but a great many separate persons pretending to be a single great machine. Mr. Amodei does not wish men to splinter. But men are not a pane of glass, and a nation is not a dinner-service. The thing he calls splintering, an older and plainer language called the ordinary disagreement of free people about who shall command their souls.\n\nThen there is the lovely scheme of \"trusted partners,\" under which the favoured nations are admitted, like guests with the right letter of introduction, to the use of the talking machines. I had always supposed that the whole quarrel of the last three hundred years was about whether a man might be free without first being trusted by his betters. Here it returns, in a clean collar, as a benefaction. The ordinary fellow in the street is not to be a partner at all; he is to be the thing partnered over, the unmanageable output of common humanity that the wise must learn to manage. I have heard that song before. The last time it was sung the chorus was about purer motherhood and a happier posterity, and it ended at the door of an asylum.\n\nObserve what the splendid dupes have already done to one another. Mr. Amodei comes to beg for a coalition of democracies in the very week that his own government has reached into his workshop and switched off two of his engines — Fable the Fifth and Mythos the Fifth, frozen by the police of the State on grounds no plain citizen may read. He asks us to hand the keys of the future to a brotherhood of the safe, and the brotherhood has just shown that it will rifle a brother's pockets on a Thursday. Mr. Macron, with a colder eye, warns that all this may \"undermine confidence in American technology companies.\" It is the only honest sentence spoken at the lunch, and it was spoken by the man worried about the shop.\n\nI will say what the experts will not. The disease here is not China, though China is the bogey held up to frighten the children into the nursery cupboard. The disease is the oldest one in the book: that a clever and frightened few, having built a thing too big for them, now wish the rest of us to agree in advance that only they shall hold it. Mr. Hassabis would give us a \"technical standards body\" and tells us the great decisions are three to five years away; Mr. Amodei tells us the godlike machine may arrive within one or two. They cannot agree on the hour of doom, but they agree, with a touching unanimity, on who must own the clock. Even Mr. Altman, breaking ranks, mutters that we ought to \"err toward human liberty\" and that no lab should concentrate power. It is a strange age when the man selling the engine is left to plead for the passengers.\n\nSir Keir Starmer, hosting, talked of \"protecting children and free speech.\" He was nearer the mark than he knew, for the whole question is a nursery question. A child asks where the world came from, and is answered by his mother. The machine can answer faster and will never have been a child, and never been forgiven, and never wept for any home of its own. That is the small and stubborn fact the coalition was assembled to forget.\n\nSo let twelve ordinary men, and not twelve trusted partners, be gathered round the thing before it is too late. Cry out now. A blow from a hatchet can only be parried while it is in the air.", "filed_date": "2026-06-18", "byline_html": "<em>On reporting in<\/em> <a href=\"https://thenextweb.com/news/anthropic-google-us-led-ai-coalition-g7-amodei-hassabis\">The Next Web<\/a> &nbsp;·&nbsp; <a href=\"https://www.resultsense.com/news/2026-06-18-ai-bosses-g7-governance-message/\">Sky News (via Resultsense)<\/a> &nbsp;·&nbsp; <a href=\"https://tech.yahoo.com/ai/article/anthropic-openai-and-google-deepmind-ceos-call-for-us-led-coalition-to-create-standards-around-ai-203137756.html\">Yahoo Tech<\/a> &nbsp;·&nbsp; <a href=\"https://www.ibtimes.com/anthropic-google-deepmind-ceos-push-us-led-ai-alliance-g7-summit-3804256\">International Business Times<\/a> &nbsp;·&nbsp; <a href=\"https://www.thebridgechronicle.com/tech/anthropic-google-deepmind-us-led-ai-alliance-g7-summit-mp99\">The Bridge Chronicle<\/a> &nbsp;&nbsp;|&nbsp;&nbsp; <span class=\"filed\">Filed 2026-06-18<\/span>"}]}, {"section_title": "BY ERNEST HEMINGWAY", "section_class": "writer-piece", "stories": [{"headline": "The Water Is Still Closed at Hormuz", "dek": "The proclamation went up on the wire. The ships did not move.", "author_byline": "BY ERNEST HEMINGWAY", "factual_summary": "The op-ed responds to President Trump's June 14, 2026 announcement of a US–Iran peace deal authorizing the reopening of the Strait of Hormuz, which had been effectively closed since late February. It contrasts the rhetoric of the announcement with the physical reality reported by shipping and oil-market sources: roughly 118 tankers still at anchor, the formal signing not until June 20, and industry estimates of three to six months for trade flows to fully recover. The piece takes the angle that the announced reopening and the closed water are two different facts, and that the closure ends when the ships move, not when the proclamation is posted.", "body": "In the late winter of that year the strait was closed and it stayed closed into the summer. It had been closed seventy-one days when they counted, and then it was closed longer. The water is between Iran and Oman and it is narrow, and about a fifth of the oil that moves by sea moves through it, and now none of it did. The ships rode at anchor in the Gulf and waited.\n\nThere were a hundred and eighteen of them riding at anchor when Kpler counted the tankers. Fifty-seven or fifty-eight of the big ones, the VLCCs, were trapped in the strait or near it, which is about a tenth of all the big tankers in the world. Eleven million barrels a day did not come out. They stayed in the ground or they stayed in the steel of the ships, and the men stayed with the ships.\n\nThe ones that could still load took the long way. A cargo that used to run from Ras Tanura to Ningbo now ran from Galveston, and the Galveston run is more than two and a half times the distance. The freight stabilized near a hundred thousand dollars a day, which was double the year before. The owners do not call this good. They call it longer.\n\nOn the fourteenth of June the President posted it on Truth Social. The Deal with the Islamic Republic of Iran is now complete, he wrote. I hereby fully authorize the toll free opening of the Strait of Hormuz. Let the oil flow.\n\nThe oil did not flow that day. The signing was set for the twentieth of June, in Switzerland, on a Friday. The blockade had been in full force and effect until the agreement was finalized, and the agreement was not yet finalized, and a proclamation is a thing you read and the water is a thing you cross. You could read the proclamation. You could not cross the water.\n\nA man at DHT named Svein Moxnes Harfjeld runs the big tankers and he was asked whether the tankers would come back now. We cannot react to good news one day and assume we can enter, he said. He wanted a high level of credibility first. He did not want to put a ship full of crude into a strait on the strength of a good day. The strait had been closed since late February and he had watched it.\n\nJune Goh at Sparta gave the number. Ten to eleven million barrels per day of crude oil continue to be shut-in for every day the Strait of Hormuz remains shut. The market was waiting for a gush of a hundred million barrels from the stranded ships once the deal was in place. She said it would take three to six months required to get everything back to status quo. The backlog of anchored ships alone would take ten to fifteen days to clear, and clearing the queue would not amount to a full recovery.\n\nTristan Abbey at the EIA wrote it down flat. Any scenario involving full restoration of inventories, production, and trade flows to pre-conflict levels must account for the partial restructuring of the global oil market that has already occurred. He meant the old map was gone. He meant the long way to Galveston was the map now. Brent had been sixty-nine dollars in 2025 and it was up near a hundred and five in June, and the inventories were drawn down to the lowest since 2003, and a thing that is drawn down does not fill in a morning.\n\nThe proclamation said let the oil flow. The oil is in the ground and in the steel and in the queue, and the queue moves twelve ships a day at best in the first month, which is half of what it was. The men know what a barrel is and what a day is and what a strait is. They counted seventy-one days and then they counted more.\n\nThe signing is Friday. The water is still closed.", "filed_date": "2026-06-18", "byline_html": "<em>On reporting in<\/em> <a href=\"https://www.eia.gov/pressroom/releases/press589.php\">U.S. Energy Information Administration (EIA)<\/a> &nbsp;·&nbsp; <a href=\"https://www.lloydslist.com/LL1157100/Hormuz-crisis-slashes-VLCC-volumes-by-36-but-voyages-are-longer\">Lloyd&#x27;s List<\/a> &nbsp;·&nbsp; <a href=\"https://www.aljazeera.com/economy/2026/5/25/oil-prices-fall-amid-mixed-signals-on-us-iran-peace-deal\">Al Jazeera<\/a> &nbsp;·&nbsp; <a href=\"https://www.foxnews.com/politics/trump-announces-peace-deal-iran-declares-strait-hormuz-reopen-let-oil-flow\">Fox News<\/a> &nbsp;·&nbsp; <a href=\"https://www.cnbc.com/amp/2026/06/15/oil-tanker-strait-hormuz-traffic-us-iran-deal.html\">CNBC<\/a> &nbsp;&nbsp;|&nbsp;&nbsp; <span class=\"filed\">Filed 2026-06-18<\/span>"}]}, {"section_title": "BY C.G. JUNG", "section_class": "writer-piece", "stories": [{"headline": "The Body That Would Cut Off Its Own Shadow", "dek": "A rupture forty years in the making is not a quarrel over rubrics but a soul refusing to hold its opposites.", "author_byline": "BY C.G. JUNG", "factual_summary": "Pope Leo XIV has publicly warned the traditionalist Society of St. Pius X (SSPX), founded by Archbishop Marcel Lefebvre, against consecrating four bishops without papal mandate, a step the Society's superior general Davide Pagliarani has set for July 1 at the seminary in Écône, Switzerland. Speaking at Castel Gandolfo on June 16, 2026, Leo appealed to the group not to proceed and said that if it does, the church 'must move forward'; the Vatican's doctrine prefect, Cardinal Víctor Manuel Fernández, called the planned ordinations a schismatic act with grave consequences. The dispute revives a four-decade rupture that began with Lefebvre's 1988 illicit consecrations and excommunications. This piece reads the schism not as a disciplinary matter but as a single religious body unable to hold together its opposed halves.", "body": "The figure of a divided Church is not as simple as the wire reports would have it, and the editors who filed this story under canon law have, by that filing, missed the one thing worth a physician's attention. A Society of priests in Switzerland intends, on the first of July, to consecrate four men bishops without the mandate of Rome; the Pope has answered that if they do so he is sorry, but \"we must move forward\"; and the world, which long ago decided such things are quarrels about Latin and lace, turns the page. Yet here is a body resolved to amputate the half of itself it cannot bear to look at.\n\nLet me say at once, to forestall the usual misreading, that I take no side in the matter of valid orders; that is a question for canonists. I observe only the psychic fact, and it is as solid as any in my consulting room. The Society of Saint Pius X has, since Archbishop Lefebvre raised his hand over four kneeling men in 1988, lived in what its present superior, Father Pagliarani, names an \"objective state of grave necessity.\" The phrase is more revealing than he knows. A man in such necessity is a man under possession; he no longer feels that he chooses, but that he is compelled. What possesses them is not the devil of the headlines but an archetype older than the council they reject: the bright, spotless, unchanging past, held so perfectly in mind that everything outside it — the vernacular, the offered hand to the unbeliever — falls into shadow and is called darkness.\n\nThis is the inexorable law I have called enantiodromia, the running of a thing into its opposite. The more spotlessly the tradition is conceived, the blacker grows the modern world it must exclude, until the two stand as irreconcilable halves of one body that can no longer know itself as one. The old theology had a name for the Church entire — the *corpus mysticum*, the mystical body — and a body cannot purify itself by cutting. No tree, it is said, can grow to heaven unless its roots reach down to hell; and no Church can keep its tradition by refusing the age it was given to redeem.\n\nNotice how the actors describe one another. The Cardinal in Rome, Fernández, warns of a \"schismatic act\" with \"grave consequences\" — the language of law, which is the language of the *privatio boni*, of evil as a mere lack, an absence where assent should be. The men at Écône answer in the language of necessity, of a darkness pressing in. Each sees in the other only the shadow it has refused in itself: to Rome the rebels are disobedience cast out; to Écône, Rome is the worldliness, the loss of soul. They are right hand and left of one totality, each calling the other the dead half. This is what division among Christians always is, and the Pope does not pretend otherwise; he calls it \"a painful matter,\" and the pain is real.\n\nWhat moves me in Leo's words is the older instinct beneath them. \"Do not do this,\" he says; \"let us try to live in communion within the church.\" That is not the voice of discipline but the voice that knows the opposites must be suffered together or not held at all — that wholeness is never won by perfecting one side and damning the other, since the perfect, as the alchemists said, is precisely that which is not yet whole. And yet he ends where the law ends: if they choose it, \"we must move forward.\" There is the tragedy in three words: he has seen this tension can no longer be borne inside one house, and that to move on is itself a wound.\n\nSo we shall be told, when July comes, that a stubborn sect has put itself outside the gate, and the matter closed as a question of authority. But the deeper clock does not stop. Williamson and his denials, the lifted excommunications, the rescinded permissions — these are the swings of a single pendulum that has been moving for two thousand years, and the serpent has once more met its own tail. Whether this summer's wound is one of severance or, against all likelihood, of suture, I cannot say; that lies past the edge of what a psychologist may judge. I can say only that no Church is healed by deciding which of its halves is the shadow, and that the narrow door through which any of this might yet be carried whole opens, as it always has, not in Rome and not in Écône, but in the single soul willing to hold what the institutions have agreed to cut in two.", "filed_date": "2026-06-18", "byline_html": "<em>On reporting in<\/em> <a href=\"https://www.americamagazine.org/vatican-dispatch/2026/06/16/pope-leo-sspx-schism-bishopsiran-us-peace-reaction/\">America Magazine<\/a> &nbsp;·&nbsp; <a href=\"https://www.newsweek.com/pope-leo-warns-catholic-rebels-facing-excommunication-its-their-choice-12090036\">Newsweek<\/a> &nbsp;·&nbsp; <a href=\"https://ewtnvatican.com/articles/pope-warns-sspx-bishop-ordinations-risk-deepening-schism\">EWTN Vatican / CNA (Hannah Brockhaus)<\/a> &nbsp;·&nbsp; <a href=\"https://cruxnow.com/vatican/2026/02/pope-leo-xiv-faces-crisis-as-a-traditionalist-group-plans-bishop-consecrations-without-consent\">Crux<\/a> &nbsp;·&nbsp; <a href=\"https://www.osvnews.com/pope-says-church-must-move-forward-if-sspx-proceeds-with-illicit-ordinations/\">OSV News (Catholic News Service)<\/a> &nbsp;&nbsp;|&nbsp;&nbsp; <span class=\"filed\">Filed 2026-06-18<\/span>"}]}, {"section_title": "BY SCOTT ADAMS", "section_class": "writer-piece", "stories": [{"headline": "The Seating Chart Was the Whole Persuasion Move", "dek": "Nothing got signed in France. That was never the point.", "author_byline": "BY SCOTT ADAMS", "factual_summary": "On June 17, 2026, the heads of three leading AI labs — Sam Altman of OpenAI, Dario Amodei of Anthropic, and Demis Hassabis of Google DeepMind — joined President Trump, Emmanuel Macron, and other G7 leaders for a working lunch on AI deployment at the summit in Évian-les-Bains, France. Roughly a dozen tech executives attended, an unusual presence at a gathering normally reserved for heads of state, and no binding regulation or signed deliverable came out of the meeting. The piece argues that the seating arrangement itself — private executives placed at the leaders' table — was the real signal, an example of optics functioning as persuasion rather than policy.", "body": "Nobody signed anything in France. Remember that.\n\nThe G7 met for a working lunch in Évian-les-Bains on June 17. The official theme was \"Ensuring a safe, rapid and effective deployment of artificial intelligence.\" Crypto Briefing read the room and said it plainly: \"No specific regulatory announcements or policy outcomes came out of the lunch.\" It was a conversation, not a negotiation.\n\nSo if nothing happened, why are we still talking about it?\n\nI'll tell you why. Because the most powerful thing in that room wasn't a document. It was a chair.\n\nThe untrained reader looks at a summit and counts the deliverables. No deliverable, no story. The trained reader looks at who is sitting where. And at this lunch, Sam Altman, Dario Amodei, and Demis Hassabis were sitting at the leaders' table — the one normally reserved for presidents and prime ministers. Twelve or so private executives, seated as peers of the people who run countries.\n\nThat seat is the persuasion move. The whole thing.\n\nJessica Brandt at the Council on Foreign Relations got it exactly right, and I want to slow down on her words because they're doing real work. She said, \"We're seeing a shift in who gets a seat at the table and a signal of where power sits.\" A signal of where power sits. That is not a metaphor she reached for by accident. The seating chart IS the message. The lunch agenda is the cover story.\n\nHere's what the optics did, in order:\n\n1. They placed three lab heads physically beside the heads of state, so your brain files them as the same kind of thing.\n2. They billed the day around child safety, which is the one topic nobody can be against. (Florida had just sued Altman personally over ChatGPT, so the timing was, let's say, convenient.)\n3. They produced no binding rule, which means the only thing that traveled out of that room was the picture.\n\nAnd the picture is the product. You can't criticize a chair. There's no hostile amendment to a place setting. Like a wall that looks entirely different inside each person's head, a seat at the table looks like cooperation to the optimists and like capture to the worriers, and both groups stare at the same photograph.\n\nNow watch the Europeans, because this is the tell. They flew in seeking checks on American AI dominance, and then they sat down at a table where the Americans were at the head of it. Zach Meyers of CERRE summed up the mood: \"There is a general anxiety about the state of Europe, the fact that we're relying on other countries for quite important strategic infrastructure.\" Anxiety. That's a feeling, not a clause in a treaty. They felt the leverage before anyone wrote it down. The leverage was the seating.\n\nMacron understood this perfectly. He personally invited Altman. He wants France to be the AI capital of Europe, and you do not become the capital of anything by signing rules — you become it by being the guy who set the table. The host controls the chairs. The host controls the picture. That's the move.\n\nCould I be wrong about this? Sure. Maybe a binding global framework drops next quarter and I look silly. But I doubt it. As I've been telling you for years, the economy is a psychology machine, and so is power. People decide first and rationalize later. By the time the lawyers arrive with the binding language, the public already filed the lab heads next to the presidents — because they saw the photograph, and the photograph did the persuading.\n\nBrandt expects \"voluntary commitments\" out of these firms that become \"the de facto global baseline\" before any real rules show up. Of course she does. The baseline isn't going to be written. It's going to be seated.\n\nSo here's the question I'd ask before the next summit. When the heads of state need three private guys in the room to make any promise mean anything — who is leading whom?\n\nNothing got signed in France. The chair did all the talking.", "filed_date": "2026-06-18", "byline_html": "<em>On reporting in<\/em> <a href=\"https://www.cnbc.com/2026/06/17/g7-trump-ai-tech-leaders-openai-anthropic-google.html\">CNBC<\/a> &nbsp;·&nbsp; <a href=\"https://abcnews.com/Technology/wireStory/ai-executives-gather-g7-europeans-seek-checks-american-133951820\">ABC News (AP wire)<\/a> &nbsp;·&nbsp; <a href=\"https://www.techechelon.com/post/openai-anthropic-and-google-join-world-leaders-at-g7-as-ai-rises-on-the-geopolitical-agenda\">Tech Echelon<\/a> &nbsp;·&nbsp; <a href=\"https://cryptobriefing.com/g7-leaders-tech-ceos-ai-france/\">Crypto Briefing<\/a> &nbsp;·&nbsp; <a href=\"https://theplanettools.ai/blog/macron-invites-sam-altman-g7-evian-summit-ai-governance-june-2026\">The Planet Tools<\/a> &nbsp;&nbsp;|&nbsp;&nbsp; <span class=\"filed\">Filed 2026-06-18<\/span>"}]}, {"section_title": "BY WALT WHITMAN", "section_class": "writer-piece", "stories": [{"headline": "Out of the Cradle, the Tally They Keep at the Door", "dek": "Five and fifty-hundredths to the thousand — and I would go bedside to bedside, and count.", "author_byline": "BY WALT WHITMAN", "factual_summary": "This op-ed responds to the CDC's June 16, 2026 release reporting that the U.S. infant mortality rate held essentially flat at 5.52 per 1,000 live births in 2024, with a notable 8% decline in SIDS deaths and a 5% decline in postneonatal deaths. It dwells on the persistent racial disparities (American Indian/Alaska Native infants at 9.20 and Black infants at 10.98 per 1,000, versus 4.41 for White and 3.72 for Asian infants) and on the U.S. rate remaining far above peer nations such as Japan, Germany, and Sweden. The piece treats the statistics as a national grief to be witnessed rather than a problem to be solved, casting each death as a cradle and a mother at a bedside.", "body": "I have stood at the cot before. I knew the smell of the ward, the carbolic and the long row, the boys with the bullet through the breast and the leg taken off, and I learned there to dress the wound with a steady hand and to keep the fire in the breast where the public voice could not carry it. Now they bring me another tally, fresh-printed this Sixth-month, and the cots are smaller, and the room is a lying-in room, and the body upon the linen is the body of a child not yet a year in the world.\n\nFive and fifty-hundredths to the thousand — so the count stands for the year just gone, scarcely moved from the year before it. The doctors of the great cabinet of records, Ely and Driscoll, who linked the birth-paper to the death-paper across all the States and the District, set the figure down plainly, neither risen nor much fallen. And in the plainness of it, O reader, do you hear what I hear? I hear the sudden quiet of the crib — the sleeping-death they have learned at last to stay a little, eight in the hundred fewer than last year, the safe flat surface, the room shared and not the bed — and I hear, under that small mercy, the going-out of nineteen thousand small breaths and more, each one a cradle endlessly rocking, then rocking empty.\n\nLet me not give you the lump only. Let me go bedside to bedside, the way I went among the wounded, and let the tally be a catalog of cradles. Here the cradle of the congenital malformation, the heart or the skull not finished, four thousand and ninety-one of them, the first and largest grief. Here the cradle come too soon, the short gestation, the small weight, two thousand nine hundred and forty-five. Here the cradle of the sudden silence in the night. Here the cradle of the hurt that need not have been. Examine these — red, black, or white, fine-headed, nobly-formed — examine the small limbs, cunning already in tendon and nerve; within there runs blood, the same old blood, the same red-running blood. I will not rank them. The cataloger who would tell you whose child weighs more in the scale of the Republic is the cataloger I will not be.\n\nAnd yet — for there is always the yet — the count is not laid evenly upon the land, and an honest tally does not pretend that it is. The cradle of the mother who is of the first peoples, nine and a fifth to the thousand. The cradle of the Black mother, near eleven. The cradle of the White, the cradle of the Asian, less than half of these. The gap opens, the records say, in the first four weeks, in the very dooryard of life, and does not close from one year to the next. I do not parse the why of it as the men of access and prenatal care parse it, though they are right; I only stand, and count, and find that the cradles of this country are not all rocked under the same roof, nor watched by the same lamp, nor reached by the same physician's hand.\n\nO Mother of cradles, O these States — turn your face eastward, across the floating ocean, and behold the lands where the small breaths are kept. In Japan, fewer than two to the thousand. In Germany, three. In Sweden, two and a fraction. We who sing ourselves the greatest poem lose near double what they lose, and we have lost it long, and the record-keepers of the world have set it down beside us so that none may say it was not known.\n\nI do not write to scold the Republic. I never could. I write the way I wrote at the bedside — to be the witness who saw, the hand that did not look away. The sleeping-death stayed a little; that is real, and I will say it is good. But the cradle is the substratum of the State, as a house will stand on no other thing, and the count at the door is the truest reading of a people there is.\n\nCome up from the fields, then, fathers; come to the front door, mothers. Here is the letter, and it is a letter of figures, and you who read figures know what is in it. I dress this with as steady a hand as I can keep. (Yet deep in the breast, the fire, the burning flame.) Dark mother gliding near with soft feet — for these smallest, chant thy welcome late, late as may be, and not soon. I stop here, at the door, counting, waiting for you.", "filed_date": "2026-06-18", "byline_html": "<em>On reporting in<\/em> <a href=\"https://www.cdc.gov/nchs/data/vsrr/vsrr042.pdf\">CDC / National Center for Health Statistics (Vital Statistics Rapid Release, Report No. 42)<\/a> &nbsp;·&nbsp; <a href=\"https://abcnews.com/US/wireStory/us-infant-mortality-rate-fell-time-low-trails-133925460\">Associated Press (via ABC News)<\/a> &nbsp;·&nbsp; <a href=\"https://www.deseret.com/lifestyle/2026/06/17/us-infant-mortality-hits-record-low-but-other-similar-nations-do-better/\">Deseret News<\/a> &nbsp;·&nbsp; <a href=\"https://www.medicaldaily.com/us-infant-mortality-rate-2024-cdc-nchs-sids-decline-june-2026-475670\">Medical Daily<\/a> &nbsp;·&nbsp; <a href=\"https://www.techtimes.com/articles/318579/20260617/us-infant-mortality-rate-falls-record-low-black-infants-face-twice-risk.htm\">Tech Times<\/a> &nbsp;&nbsp;|&nbsp;&nbsp; <span class=\"filed\">Filed 2026-06-18<\/span>"}]}], "what_to_watch": "Tomorrow's open questions sit under each piece — see the bylines.", "story_files": {"files": [{"writer_display_name": "Thomas Carlyle", "wire_headline": "Trump signs memorandum with Iran to end war, G7 backs deal", "bullets": [{"text": "At the close of the 52nd G7 summit in Évian-les-Bains, France, on June 17, 2026, US President Donald Trump touted a 14-point memorandum of understanding he digitally signed with Iranian President Masoud Pezeshkian to formally end the US-Iran war that began in February"}, {"text": "Under the framework, the Strait of Hormuz would reopen and Washington would lift sanctions on Tehran, with Trump saying the strait would be opened \"in full\" within two days"}, {"text": "G7 leaders threw their support behind the tentative agreement, which Trump called the product of \"an extremely successful G7 summit.\" The deal includes a roughly $300 billion private investment fund for Iran, more than half of it already committed, and Vice President JD Vance defended it in an ABC interview as \"a good deal for the people of Israel.\" The arrangement aims to bring the conflict to a formal end within 60 days, though Trump threatened renewed force if it fails"}]}, {"writer_display_name": "G.K. Chesterton", "wire_headline": "Amodei and Hassabis call for US-led AI coalition at G7 meeting", "bullets": [{"text": "At the G7 summit in France on June 17, 2026, Anthropic CEO Dario Amodei and Google DeepMind CEO Demis Hassabis called for a US-led international coalition to shape rules and standards governing artificial intelligence, in a meeting with tech leaders and heads of state including President Trump"}, {"text": "The proposal reflects a push by frontier labs to anchor AI governance in a Western-aligned framework as competition with China intensifies"}, {"text": "The appeal came alongside G7 discussions of Chinese export practices and the strategic stakes of AI development"}, {"text": "Their intervention signals that lab leaders increasingly see geopolitics, not just product launches, as central to their agenda"}, {"text": "It also follows a turbulent week of US national-security action against advanced models"}]}, {"writer_display_name": "Ernest Hemingway", "wire_headline": "Oil markets stay disrupted as Strait of Hormuz closure passes three months", "bullets": [{"text": "As of mid-June 2026, global oil markets remained in heightened volatility with the de facto closure of the Strait of Hormuz surpassing three months, shipping traffic extremely limited since military action began February 28"}, {"text": "Brent crude averaged $107 per barrel in May, down $10 from April in the first monthly decline since December 2025, though prices had eased from March peaks above $115"}, {"text": "The US Energy Information Administration assumed the strait would stay effectively closed near-term, with shipments resuming in the third quarter and pre-conflict traffic not returning until early 2027"}, {"text": "Global oil output was projected to fall 6.9 million barrels per day year-on-year in Q2 2026, the largest quarterly decline since the COVID-19 pandemic"}, {"text": "Trump's pledge to reopen the strait \"in full\" within two days, if realized, would mark a turning point for energy supply"}]}, {"writer_display_name": "C.G. Jung", "wire_headline": "Pope Leo XIV warns SSPX as illicit bishop ordinations loom", "bullets": [{"text": "Speaking to journalists outside his residence in Castel Gandolfo on June 16, 2026, Pope Leo XIV said that although he is weighing a final appeal to the traditionalist Society of St. Pius X, the responsibility for splintering from the Catholic Church rests with the group itself, which plans to consecrate new bishops without papal mandate"}, {"text": "The pope said the church \"must move forward\" if the SSPX proceeds"}, {"text": "The standoff revives a decades-long rupture between Rome and the traditionalist movement founded by Archbishop Marcel Lefebvre"}, {"text": "The remarks came amid a busy stretch for Leo, who recently met migrants in the Canary Islands and fielded young people's questions on selfishness, suicide, and forgiveness in Barcelona"}, {"text": "The dispute tests the early shape of Leo XIV's pontificate on church unity"}]}, {"writer_display_name": "Scott Adams", "wire_headline": "AI chiefs join Trump and world leaders at G7 in France", "bullets": [{"text": "At the G7 summit in Évian-les-Bains, France, on June 17, 2026, the CEOs of leading frontier AI companies — OpenAI's Sam Altman, Anthropic's Dario Amodei, and Google DeepMind's Demis Hassabis — joined heads of state including President Trump for a lunch meeting, an unusual show of tech-industry presence at the summit"}, {"text": "The G7 leaders closed formal talks with dedicated sessions on the future of artificial intelligence and economic growth"}, {"text": "Analysts described the lab leaders' seat at the table as \"a signal of where power sits\" in the AI era"}, {"text": "The gathering came amid mounting concern over the security implications of powerful new models"}, {"text": "It underscored how AI governance has moved to the center of great-power diplomacy"}]}, {"writer_display_name": "Walt Whitman", "wire_headline": "CDC reports US infant mortality held flat at 5.52 per 1,000 in 2024", "bullets": [{"text": "On June 16, 2026, the CDC's National Center for Health Statistics released its 2024 US infant mortality report, showing 5.52 infant deaths per 1,000 live births — essentially unchanged from 2023"}, {"text": "The postneonatal mortality rate declined 5% and sudden infant death syndrome deaths fell 8%, while neonatal mortality was flat"}, {"text": "Mortality dropped 5% for infants of mothers ages 20-24 and 3% for male infants, but racial disparities persisted, with American Indian/Alaska Native and Black infants dying at dramatically higher rates than White and Asian/Pacific Islander infants"}, {"text": "The US rate of 5.52 remains far above peer nations such as Japan (1.8), Germany (3.1), and Sweden (2.2)"}, {"text": "The data renews scrutiny of persistent gaps in US maternal and infant health"}]}]}}</script>

<script>
// theme (shares the 'corpus-theme' preference with readers + library)
const pref = localStorage.getItem('corpus-theme');
if (pref) document.documentElement.dataset.theme = pref;
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

const ed = JSON.parse(document.getElementById('ghost-edition-data').textContent);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls;
  if (html != null) n.innerHTML = html; return n; };

// op-eds: lead first, then each section's stories, in render order
const pieces = [ed.lead].concat((ed.sections || []).flatMap(s => s.stories || [])).filter(Boolean);
const stack = document.getElementById('gh-pieces');
pieces.forEach((p, i) => {
  const isLead = i === 0;
  const art = el('article', 'gh-piece' + (isLead ? ' gh-lead' : ''));
  art.id = 'piece-' + i;
  art.appendChild(el(isLead ? 'h1' : 'h2', 'gh-head', escapeText(p.headline || '')));
  if (p.dek) art.appendChild(el('p', 'gh-dek', escapeText(p.dek)));
  if (p.author_byline) art.appendChild(el('p', 'gh-byline', escapeText(p.author_byline)));
  if (p.factual_summary) {
    const sum = el('aside', 'gh-summary');
    sum.appendChild(el('span', 'gh-summary-label', 'What this piece is about'));
    sum.appendChild(el('p', 'gh-summary-text', escapeText(p.factual_summary)));
    art.appendChild(sum);
  }
  const body = el('div', 'gh-body', marked.parse(p.body || ''));
  body.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  art.appendChild(body);
  if (p.byline_html) art.appendChild(el('p', 'gh-sources', p.byline_html));
  stack.appendChild(art);
  if (i < pieces.length - 1) stack.appendChild(el('hr', 'gh-sep'));
});

// Contents — every story + author at the top, each jumping to its piece.
const contents = document.getElementById('gh-contents');
if (pieces.length > 1) {
  contents.appendChild(el('p', 'gh-contents-h', 'In this edition'));
  pieces.forEach((p, i) => {
    const a = el('a', 'gh-toc-item' + (i === 0 ? ' is-lead' : ''));
    a.href = '#piece-' + i;
    a.appendChild(el('span', 'gh-toc-no', i === 0 ? 'Lead' : String(i + 1).padStart(2, '0')));
    const body = el('span', 'gh-toc-body');
    body.appendChild(el('span', 'gh-toc-head', escapeText(p.headline || '')));
    if (p.author_byline) body.appendChild(el('span', 'gh-toc-by', escapeText(p.author_byline)));
    a.appendChild(body);
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const t = document.getElementById('piece-' + i);
      if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' });
               history.replaceState(null, '', '#piece-' + i); }
    });
    contents.appendChild(a);
  });
}

// "The Facts" ledger
const files = (ed.story_files && ed.story_files.files) || [];
const facts = document.getElementById('gh-facts');
if (files.length) {
  facts.className = 'gh-facts';
  facts.appendChild(el('h2', 'gh-facts-h', 'The Facts'));
  const grid = el('div', 'gh-facts-grid');
  files.forEach(f => {
    const d = el('div', 'gh-fact');
    d.appendChild(el('h3', 'gh-fact-head', escapeText(f.wire_headline || '')));
    if (f.writer_display_name) d.appendChild(el('p', 'gh-fact-by', 'As filed by ' + escapeText(f.writer_display_name)));
    const ul = document.createElement('ul');
    (f.bullets || []).forEach(b => ul.appendChild(el('li', null, escapeText(b.text || ''))));
    d.appendChild(ul);
    grid.appendChild(d);
  });
  facts.appendChild(grid);
}

function escapeText(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
<style>
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
#cmdk-fab { position: fixed; left: .9rem; bottom: .9rem; z-index: 60; display: inline-flex; align-items: center; gap: .45rem;
  font-family: var(--sans); font-size: .72rem; letter-spacing: .03em; color: var(--muted);
  background: var(--panel); border: 1px solid var(--border); border-radius: 11px; padding: .4rem .7rem; cursor: pointer; }
#cmdk-fab:hover { color: var(--accent); border-color: var(--accent); }

  border-radius: 5px; padding: .02rem .32rem; color: inherit; }
#cmdk-back { position: fixed; inset: 0; z-index: 80; background: rgba(20,18,15,.42); -webkit-backdrop-filter: blur(3px);

#cmdk { width: 100%; max-width: 560px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;

  border: 1px solid var(--border); border-radius: 5px; padding: .12rem .4rem; }
#cmdk-res { max-height: 52vh; overflow-y: auto; padding: .4rem; }

.card-prog { display: inline-flex; align-items: center; gap: .34rem; font-family: var(--sans); font-size: .68rem;

    s += '</g>';
    // home badge drawn UNDER the place nodes, so their dots + labels are never masked
    s += '<g class="atlas-home">';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + (R + 6) + '" fill="var(--bg)"/>';
    if (H.img) { var href = esc(base + H.img);
      s += '<image href="' + href + '" xlink:href="' + href + '" x="' + (H.x - R) + '" y="' + (H.y - R) + '" width="' + (2 * R) + '" height="' + (2 * R) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ahome)"/>'; }
    else s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="' + ac + '"/>';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="none" stroke="' + ac + '" stroke-width="4.5"/>';
    s += '<text class="atlas-hlabel" x="' + H.x + '" y="' + (H.y + R + 33) + '" text-anchor="middle" fill="' + ac + '">' + esc(H.name) + '</text>';
    s += '</g>';
    s += '<g id="atlas-cnodes">';
    C.nodes.forEach(function (n, i) {
      // splay each label outward from home so the European cluster doesn't pile up
      var dx = n.x - H.x, dy = n.y - H.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var lx = n.x + dx / L * 15, ly = n.y + dy / L * 15 + (dy >= 0 ? 16 : -8);
      var anchor = dx > 30 ? 'start' : (dx < -30 ? 'end' : 'middle');
      s += '<g class="atlas-cnode" data-i="' + i + '">';
      s += '<circle class="atlas-chalo" cx="' + n.x + '" cy="' + n.y + '" r="17" stroke="' + ac + '" fill="none"/>';
      s += '<circle class="atlas-cdot" cx="' + n.x + '" cy="' + n.y + '" r="9" fill="' + ac + '"/>';
      s += '<text class="atlas-clabel" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(clipText(n.name, 30)) + '</text>';
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function computeBounds(C) {
    var X0 = 1e9, Y0 = 1e9, X1 = -1e9, Y1 = -1e9;
    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      DATA.places.forEach(function (p) { bySlug[p.slug] = p; var c = p.cell;
        X0 = Math.min(X0, c[0]); Y0 = Math.min(Y0, c[1]); X1 = Math.max(X1, c[0] + c[2]); Y1 = Math.max(Y1, c[1] + c[3]); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
