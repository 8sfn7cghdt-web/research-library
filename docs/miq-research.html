ive Inc. 5000 listing (examined later, in the going-concern check on the Pathlabs and Dentsu relationships). The separate brand is deliberate: it lets MiQ serve indie agencies without those agencies feeling they have handed their book to a competitor.\n\n### The strategic rationale is the ~$25B of US digital spend run by independent agencies\n\nMiQ's stated rationale: \"more than $25 billion in U.S. digital ad spend is managed by independent agencies, with a meaningful portion outsourced to managed-service providers\" — a \"rapidly growing segment of the addressable market\" [3]. The $25B figure is MiQ's own market-sizing in the acquisition release; it should be read as a vendor estimate, not an independently audited number.\n\n**So what:** Pathlabs gives MiQ a *second* go-to-market chassis, aimed at customers its direct-sales and holdco motions never reach. It is also the part of MiQ most cleanly aligned with the \"independent alternative\" story — Pathlabs exists to make indie agencies competitive *against* the holdcos. This is the clean side of MiQ's identity. The messier side comes next.\n\n---\n\n## 3. Holdco Integrations: The Dentsu \"Intelligence Partner\" Deal and the Channel-Conflict Problem\n\n**Answer first: MiQ's headline holdco win is Dentsu — which in June 2025 became, by MiQ's claim, the first advertising holding company to put Sigma \"at the strategic centre\" of its media practice and to name MiQ its official \"Intelligence Partner.\" This is simultaneously MiQ's biggest enterprise validation and the sharpest contradiction of its independent-alternative pitch.**\n\n### Dentsu is, per MiQ's claim, the first holdco to put Sigma at the strategic center of its media practice\n\nOn **June 12, 2025**, Dentsu and MiQ announced a strategic partnership in which Dentsu is \"the first holding company to integrate MiQ Sigma … at the strategic centre of the media practice,\" naming MiQ its official **Intelligence Partner** for the \"Algorithmic Era\" [5][6]. Dentsu Global President Clive Record framed it around algorithmic gatekeeping: \"Algorithms now shape how billions of people discover content, products, and brands — becoming the new gatekeepers\" [6]. The \"industry-first\" claim is the parties' own; MediaPost noted the coverage offered no independent verification of the first-mover claim, no clarity on whether the deal is exclusive, and no financial or performance detail [6].\n\n### The Dentsu deal appears non-exclusive, and MiQ retains relationships with multiple holdcos\n\nMediaPost's analysis explicitly flags that MiQ \"claims to be an independent programmatic technology firm while simultaneously maintaining partnerships with multiple major holding companies (Dentsu, Havas, Publicis, WPP),\" and that the Dentsu release \"does not clarify whether [the] deal is exclusive, suggesting MiQ retains independence despite deepening integration\" [6]. MiQ's long-running boilerplate has named **GroupM** (WPP's media arm) and **IPG** alongside Dentsu as clients across releases from 2021 through 2025 [13]. The non-exclusivity is what makes the model viable — MiQ can sell to Dentsu *and* its rivals.\n\n### The tension, stated plainly\n\nMiQ's go-to-market rests on a contradiction it must actively manage:\n\n- **To indie agencies and direct brands**, MiQ is the *independent alternative* — agnostic, conflict-free, not owned by a holdco, not steering spend toward captive inventory. The Pathlabs unit, the Adsmovil \"largest *independent* programmatic offering in LatAm\" framing [11], and Hundal's positioning as an alternative to \"holding-company-owned solutions\" [2] all sell this.\n- **To holdcos**, MiQ is a *vendor and partner* — the specialist intelligence layer Dentsu plugs into the center of its media practice [5].\n\nBoth cannot be the whole truth, and MiQ does not pretend otherwise. It manages the conflict three ways:\n\n### MiQ manages holdco channel conflict via non-exclusivity, agnosticism, and brand separation\n\nMiQ keeps holdco relationships non-exclusive (selling Sigma to Dentsu does not foreclose GroupM or IPG) [6][13]; it leans on its DSP-, data-, and publisher-agnostic architecture to argue it has no captive inventory to push, unlike a holdco trading desk [1][7]; and it ring-fences its agency-facing arm under a separate brand (Pathlabs as an independent business unit) so indie-agency clients are not buying from a unit that also serves holdcos [3][8]. This is a synthesis of MiQ's disclosed structures into a coherent conflict-management strategy, not one MiQ has articulated as such in a single source.\n\n**So what for a holdco buyer:** Dentsu's bet is that an agnostic external \"intelligence partner\" beats building the same AI-and-data layer in-house — a buy-not-build judgment. **So what for an indie buyer:** the same MiQ that powers Dentsu is the one selling you independence. The credibility of that independence claim rests entirely on the non-exclusivity and the agnosticism holding up over time.\n\n---\n\n## 4. Direct-Brand Relationships: A Marketing Roster, Read Skeptically\n\n**Answer first: MiQ markets a blue-chip direct-brand roster — Marriott, Dell, Mercedes, Microsoft, plus CPG names like P&G, Unilever, Pepsi and J&J — but these are vendor claims from MiQ's own boilerplate, and the most recent 2026 boilerplate has quietly dropped the named list entirely.** Treat the roster as directional, not confirmed-current.\n\n### MiQ's marketing names Marriott, Dell, Mercedes, Microsoft, GroupM, Dentsu and IPG as clients\n\nMiQ's standard \"About MiQ\" boilerplate, appearing in near-identical form across press releases from 2021 through 2025, states that \"the world's leading brands and media agencies such as Marriott, Dell, Mercedes, Microsoft, GroupM, Dentsu and IPG\" work with MiQ [13]. This is MiQ self-description. Named-client lists from vendor marketing are *claims*, not audited engagements; there is no independent confirmation that any of Marriott, Dell, or Mercedes is a *current* MiQ account. The GroupM/Dentsu/IPG names are corroborated as relationships by the independent Dentsu deal [5][6] and the MEP-market context, but the brand names are uncorroborated.\n\n### MiQ's June 2026 boilerplate has dropped the named-client list\n\nThe \"About MiQ\" boilerplate in MiQ's June 11, 2026 Sigma-expansion release reads simply: \"MiQ is a global programmatic services and technology partner that works with advertisers and agencies to enhance their campaign performance. Founded in 2010 in London, UK, MiQ operates in more than 33 offices worldwide\" — with **no named clients** [12]. The March 2026 Adsmovil release similarly carries no client list [11]. This is a notable signal: the disappearance of the Marriott/Dell/Mercedes list from 2026 boilerplate means those names should *not* be asserted as current accounts on the strength of MiQ's marketing. It may reflect nothing more than a boilerplate refresh, or it may reflect churn — either way, the older list is stale.\n\n### The CPG vertical names\n\nThe frequently cited CPG names — P&G, Unilever, Pepsi, and J&J — cannot be independently corroborated as current named MiQ accounts. They surface in MiQ-adjacent and historical marketing contexts, and MiQ clearly *targets* large CPG advertisers (see §5), but asserting them as live clients would be unsourced. What *is* sourced: MiQ built CPG-specific products (Consumer Link, MiQ Commerce) explicitly to win this category [9][14].\n\n**So what:** for due diligence, the only safe statement is that MiQ *markets to and builds for* blue-chip brands and large CPG advertisers. The specific named roster is a vendor claim that 2026 boilerplate no longer even repeats.\n\n---\n\n## 5. Verticalized Solutions: How MiQ Packages the Managed Service by Category\n\n**Answer first: MiQ productizes its managed service into named verticals — CPG sales-uplift, commerce, political, auto, travel, finance — each wrapping the same trader-plus-Sigma core in category-specific data and measurement.** The most developed and best-sourced of these is CPG/commerce.\n\n### MiQ Commerce delivers CPG sales-uplift built on a NielsenIQ data agreement\n\nOn **September 10, 2024**, MiQ Canada launched **MiQ Commerce**, described as a first-to-market solution letting CPG brands attribute in-store sales to brand marketing, built on a data agreement with **NielsenIQ (NIQ)**. It integrates NIQ's \"Precision Areas\" modelled retail-sales data — down to Forward Sortation Area (postal-code-area) level — covering ~90% of Canadian CPG sales, with MiQ's shopper insights and omnichannel programmatic [9][14]. NIQ's Lana Busignani and MiQ Canada CRO Jason Furlano are quoted; the release cites ~CA$2.8B in annual CPG digital ad spend as the target pool [14]. The launch is well-dated (Sept 2024); MiQ Commerce's *current* operating status rests on the launch release plus Sigma's data-partner roster (below) — no 2026-dated re-confirmation of MiQ Commerce specifically was located.\n\n### Sigma's data-partner roster includes the retail-measurement spine for CPG verticalization\n\nMiQ Sigma's June 2025 launch integration roster names **The Trade Desk, Google DV360, AWS, Samba, Experian, Databricks, Numerator, Celtra, and Circana** [1]. NielsenIQ does *not* appear in the Sigma integration roster — it is a MiQ Commerce / MiQ Canada data partner (see above). Numerator and Circana are confirmed. Earlier, MiQ launched **Consumer Link** (2023), a shopper-intelligence product reaching ~90% of US households for CPG planning/activation/measurement. The specific Numerator/Circana integration names come from secondary coverage of the Sigma launch [1] rather than a primary integration contract. The integrations are real product claims, but their depth (\"core integrations\") is MiQ's characterization.\n\n### MiQ runs named industry verticals including political, auto, travel and finance\n\nMiQ maintains dedicated vertical practices, most visibly **political campaign advertising** (a standalone US offering leveraging its Advanced TV data footprint and programmatic traders), plus retail and additional category solutions. The *political* and *CPG/commerce* verticals are confirmed from sources; the auto, travel, and finance verticals are consistent with MiQ's \"advanced media solutions tailored to unique outcomes\" framing, but no dedicated dated pages for each were located, so they remain partially uncorroborated.\n\n**So what:** verticalization is how MiQ raises its price and its defensibility. A generic managed service is a commodity; \"CPG sales-uplift proven against NielsenIQ point-of-sale data\" is a differentiated, measurable product. The depth of the data partnerships (NIQ, Numerator, Circana) is the real asset. The vertical labels are packaging.\n\n---\n\n## 6. The Self-Serve-vs-Managed Spectrum: Where Sigma Moves MiQ\n\n**Answer first: Sigma does not move MiQ toward self-serve — it deepens the managed-service model by making MiQ's traders faster and more data-rich, while leaving the client outside the software.** The \"platform\" branding implies a march toward self-serve; the actual mechanics point the other way.\n\nThe build-vs-buy-vs-partner spectrum for any advertiser runs: **in-house self-serve** (own team, own DSP seat) → **hybrid** (own strategy, outsource execution) → **fully managed** (outsource the lot). MiQ plays across the whole *outsourcing* side: its in-housing offering ranges \"from fully managed services to consultation for scaling operations,\" meeting clients \"at any stage of the in-housing journey\" [7].\n\n### Sigma deepens managed service rather than shifting MiQ to self-serve\n\nAcross all 2025–2026 Sigma communications, MiQ describes Sigma as a tool its traders operate (twice the optimizations, faster cross-DSP activation) and never announces a self-serve client tier; the AdExchanger Cannes 2025 framing — AI that supercharges \"the people behind the screens\" rather than replacing them — captures the direction [1][10][12]. This is an analytical read of MiQ's consistent silence on self-serve plus its explicit human-in-the-loop framing; a self-serve Sigma tier is a plausible future move (especially for agency clients who want a seat) and would change the picture.\n\n**The strategic stakes:** managed service is high-touch, high-stickiness, and lower-margin than SaaS. A PE owner (Bridgepoint) optimizing for an exit multiple would rather MiQ look like a platform than a services shop. Sigma is the asset that *lets MiQ tell a platform story to investors* while *still delivering as a services business to clients*. Whether that story survives contact with agentic AI — which threatens to automate the very trader labor MiQ sells — is the central forward question (taken up later, in the chapters on the forces shaping MiQ and in the outlook).\n\n---\n\n## 7. Synthesis: The Relationship Architecture as a Single System\n\nPull the four relationships together and a single system emerges. MiQ sells the *same* core competence — trader-operated, Sigma-powered, agnostic programmatic execution — through four doors, each with conflict-management built in:\n\n| Relationship | What MiQ sells | Vehicle | Conflict managed by |\n|---|---|---|---|\n| **Direct brands** | Managed campaigns + verticalized measurement | MiQ traders + Sigma | Agnostic stack; no captive inventory |\n| **Independent agencies** | White-label execution behind the agency's brand | Pathlabs (MEP, separate brand) | Brand separation; agency keeps the client |\n| **Holdcos** | \"Intelligence Partner\" — Sigma at the center of the media practice | MiQ Sigma integration | Non-exclusivity (Dentsu ≠ exclusive) |\n| **Verticals (CPG/commerce, political, auto, travel, finance)** | Category-proven outcomes | Data partnerships (NIQ, Numerator, Circana) | Differentiated, measurable products |\n\nThe whole system rests on one load-bearing promise: **agnosticism**. Because MiQ owns no DSP and no inventory it must clear, it can tell an indie agency \"we're the independent alternative to the holdcos\" *and* tell Dentsu \"plug us into the center of your practice\" — the same agnostic engine serving both, without (in MiQ's telling) a conflict. Let that agnosticism fray — an exclusive holdco deal, a captive-inventory acquisition, a self-serve product that pits MiQ against its own agency clients — and the segmented architecture loses its load-bearing wall.\n\n---\n\n## Open Questions\n\n1. **Is the Dentsu deal exclusive, and has any other holdco signed a comparable Sigma-at-the-center deal since June 2025?** Exclusivity would blow up the non-exclusivity premise; a second holdco would validate the model. MediaPost flagged the exclusivity question as unanswered [6].\n2. **Does Pathlabs still operate as an independent, separately branded business unit in 2026?** Confirmed at acquisition (July 2024) [3]; no 2026 re-confirmation located.\n3. **Are Marriott, Dell, Mercedes, Microsoft — and the CPG names P&G, Unilever, Pepsi, J&J — actually current MiQ accounts?** All are vendor claims or brief-supplied; the 2026 boilerplate dropped the named list [12][13]. None independently corroborated as current.\n4. **Will MiQ launch a self-serve Sigma tier for agencies/holdcos, and how would that affect channel conflict with Pathlabs and direct clients?** No such tier announced through June 2026; agentic AI pressure makes it plausible.\n5. **How deep are the NIQ / Numerator / Circana integrations, and are MiQ Commerce / Consumer Link still live and expanding in 2026?** Launches well-dated (2023–2024); no 2026 re-confirmation of the commerce products specifically.\n6. **What share of MiQ's ~$600M+ revenue comes from each door (direct / indie-agency / holdco / vertical)?** Not disclosed; critical for assessing concentration and the durability of each relationship.\n7. **What are the actual auto, travel, and finance vertical offerings?** Consistent with MiQ's positioning, but not separately sourced here.\n\n---\n\n## Sources\n\n1. *MiQ Sigma Breaks the Fragmentation Cycle: The First AI Platform That Unifies the Programmatic Ecosystem.* BusinessWire / MiQ, June 4, 2025. https://www.businesswire.com/news/home/20250604957858/en/ and https://www.wearemiq.com/resources/news/miq-sigma-breaks-the-fragmentation-cycle — Tier 1 (press release: MiQ's own claims). Sigma launch, 700T signals, 300+ feeds, partner roster (TTD, DV360, AWS, Samba, Experian, Databricks, Numerator, Circana), trading agent on OpenAI/Gemini/Claude. Accessed 2026-06-20.\n2. Marketecture, *MiQ — A global programmatic media partner doing $600M+ in revenue* (Gurman Hundal interview, recorded May 2023). https://news.marketecture.tv/p/miq-gurman-hundal — Tier 5 (trade/analytical). MiQ as independent alternative to holdco-owned solutions; managed service for agencies needing programmatic expertise; $600M+ revenue, ~2,500 advertisers. (Scale figures date to mid-2023.) Accessed 2026-06-20.\n3. *MiQ to Acquire Pathlabs, Expanding Programmatic Excellence to Independent Agencies.* MiQ / BusinessWire, July 29, 2024. https://www.wearemiq.com/us/resources/news/miq-to-acquire-pathlabs-expanding-programmatic-excellence-to-independent-agencies — Tier 1 (press release). Pathlabs (founded 2021, Missoula MT, ~100 staff); MEP definition; ~$25B indie-agency spend; independent business unit; execs Neer, Madorsky, Lapointe. Accessed 2026-06-20.\n4. *MiQ named to Official YouTube Activation Partners Program.* MiQ / BusinessWire, October 6, 2025. https://www.wearemiq.com/us/resources/news/miq-named-to-official-youtube-activation-partner-program — Tier 1 (press release). Bespoke programmatic services framing; current 2025 boilerplate. Accessed 2026-06-20.\n5. *Dentsu Selects MiQ Sigma to Help Power Next Gen Media Operations.* Dentsu / MiQ, June 12, 2025. https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations and https://www.wearemiq.com/resources/news/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — Tier 1 (joint press release). First-holdco / strategic-centre / Intelligence Partner claims; Sigma trading agent on OpenAI/Gemini/Claude; quotes Clive Record, James Miesner. Accessed 2026-06-20.\n6. *Dentsu Goes All-In With MiQ, Claims Industry-First Integration.* MediaPost / MediaDailyNews, June 12, 2025. https://www.mediapost.com/publications/article/406608/ — Tier 4–5 (trade reporting). Independent framing of the holdco/independent tension; notes deal not stated exclusive; lists Dentsu/Havas/Publicis/WPP relationships; flags lack of verification of \"industry-first.\" Accessed 2026-06-20.\n7. MiQ solutions pages — *In-Housing Programmatic*, *Experienced Programmatic Traders*, *Your Programmatic Media Partner.* https://www.wearemiq.com/solutions/in-housing , https://www.wearemiq.com/us/experienced-programmatic-traders , https://www.wearemiq.com/ — Tier 1 (vendor self-description). Managed service / extension-of-team model; Sigma used internally not shipped to clients; agnostic stack; in-housing spectrum from fully managed to consultation. Accessed 2026-06-20.\n8. *White-Label Media Execution Partner for Independent Agencies* and *MiQ Acquires Pathlabs.* Pathlabs, 2024–2025. https://www.pathlabs.com/mep-for-indies , https://www.pathlabs.com/blog/miq-acquires-pathlabs — Tier 1 (vendor). White-label/pass-through MEP mechanics; agency keeps client + strategy; margin protection. Accessed 2026-06-20.\n9. *MiQ and NielsenIQ partner on data solution to prove media ROI.* Media in Canada, Sept 10, 2024. https://mediaincanada.com/2024/09/10/miq-and-nielsoniq-partner-on-data-solution-to-prove-media-roi/ — Tier 5 (trade). Independent confirmation of MiQ Commerce / NIQ CPG sales-uplift launch. Accessed 2026-06-20.\n10. *How MiQ is Redefining Programmatic Advertising, with Tom Richards, SVP Global Product* (Cannes 2025). AdExchanger content studio, June 23, 2025. https://www.adexchanger.com/content-studio/how-miq-is-redefining-programmatic-advertising-with-tom-richards-svp-global-product-cannes-2025/ — Tier 5 (sponsored content — noted). Sigma as conversational AI agent; human-in-the-loop \"without replacing the people behind the screens.\" Accessed 2026-06-20.\n11. *MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering in Latin America.* MiQ / BusinessWire, March 25, 2026. https://www.wearemiq.com/resources/news/miq-acquires-adsmovil — Tier 1 (press release). \"Largest independent\" LatAm framing; 150+ staff, 12 markets; managed-service teams on the ground; 2026 boilerplate (no named clients). Accessed 2026-06-20.\n12. *MiQ Sigma Expands with New Data, Capabilities and Ways to Activate.* MiQ / BusinessWire, June 11, 2026. https://www.businesswire.com/news/home/20260611682662/en/ and https://www.financialcontent.com/article/bizwire-2026-6-11-miq-sigma-expands-with-new-data-capabilities-and-ways-to-activate — Tier 1 (press release). Freshest going-concern source: 40,000+ campaigns / 2,300+ advertisers; $2.22-per-$1 ROI; Sigma live across all regions; 2026 boilerplate with NO named-client list. Accessed 2026-06-20.\n13. MiQ \"About MiQ\" boilerplate (2021–2025 press releases, aggregated). E.g., BusinessWire releases 2021–2022 and 2025 Sigma release [1]; client list \"Marriott, Dell, Mercedes, Microsoft, GroupM, Dentsu and IPG.\" — Tier 1 (vendor self-description / claim). Named-client roster is a vendor claim; corroborated only for GroupM/Dentsu/IPG as relationships via [5][6]. Accessed 2026-06-20.\n14. *MiQ Canada launches new sales uplift solution for CPG advertisers through data agreement with NielsenIQ.* NielsenIQ / MiQ, Sept 10, 2024. https://nielseniq.com/global/en/news-center/2024/miq-canada-launches-new-sales-uplift-solution-for-cpg-advertisers-through-data-agreement-with-nielseniq/ — Tier 1 (partner press release). MiQ Commerce; Precision Areas / FSA; ~90% Canadian CPG sales coverage; ~CA$2.8B CPG digital spend; quotes Busignani (NIQ), Furlano (MiQ). Accessed 2026-06-20."}, {"order": 6, "file": "06_Market_Structure_And_Competition.md", "title": "Market Structure and Competition: Where MiQ Sits in a Consolidating Independent-Specialist Market", "summary": "", "body": "# Market Structure and Competition\n\n## Bottom Line\n\nMiQ is neither a DSP nor an agency. It is a managed-service layer that sits on top of other people's DSPs (DSP = demand-side platform, the software an advertiser uses to buy ads programmatically), wraps them in proprietary data, analytics, and now an AI workflow product (Sigma), and sells the combination as outcomes rather than seats. That hybrid — \"managed service plus agnostic technology\" — is a real and defensible niche, worth ~$600M+ in revenue and ~1,900 people as of 2026. It scaled because it solves a problem the pure platforms create: fragmentation, and the operational burden of running campaigns across many DSPs, SSPs (SSP = supply-side platform, the publisher-side counterpart), and walled gardens. But MiQ's signature pitch — \"the independent, agnostic alternative\" — is the *same* thesis The Trade Desk rode to a $100B+ valuation, then watched collapse roughly 68% in 2025 as Amazon, Google, and the walled gardens pulled the center of gravity toward first-party data and owned-and-operated inventory. MiQ's weakest competitive link is precisely there. For a large share of what it does, MiQ is a **reseller of the same underlying DSPs** (The Trade Desk, Amazon DSP, DV360) that are themselves under siege, and its \"independence\" is a marketing frame that mostly benefits MiQ and the agencies that want a neutral-sounding intermediary — not the advertiser, who can increasingly buy the walled gardens directly at lower fees. MiQ's genuine differentiation is narrower and more durable than the independence story implies: its TV Intelligence data footprint (a 90M-household / 6.4-trillion-signal CTV panel), its managed-service execution muscle, and an emerging agency-tooling play (Pathlabs for independents, the Dentsu Sigma deal for a holdco). The next four years are a race to convert \"agnostic middleman\" into \"indispensable intelligence and execution layer\" — before the DSPs it resells and the walled gardens it routes around make the middle disappear.\n\n---\n\n## 1. The positioning thesis, stated plainly\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 432\" role=\"img\" aria-label=\"A cross-section of the programmatic stack. At the top, advertiser and agency budget flows downward. It passes through a thin bright MiQ layer that keeps a roughly 9 to 11 percent spread as managed-service margin, propped from the side by three rented-data pillars: Samba ACR, Titan OS, and Experian. Below MiQ sit three demand-side platforms it does not own — The Trade Desk, Google DV360, and Amazon DSP — and beneath them the base layer of CTV, SSP, and open-web inventory. The argument is that MiQ captures a margin in the middle on infrastructure and data it rents rather than owns.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" class=\"t-serif\" style=\"font-size:15px;font-weight:700\">The Spread &#8212; what MiQ keeps, and what it rents to keep it<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px\">Advertiser budget flows down; MiQ skims a managed-service margin on a stack it does not own<\/text>\n<rect x=\"120\" y=\"62\" width=\"460\" height=\"40\" rx=\"2\" class=\"f-t3\" cv-grow-up style=\"--d:.05s\"/>\n<text x=\"350\" y=\"87\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:12.5px;font-weight:700\">Advertiser &amp; agency budget<\/text>\n<path d=\"M350 104 L350 132\" class=\"s-t3 cv-draw\" pathLength=\"1\" style=\"stroke-width:2.5\" marker-end=\"url(#md)\"/>\n<polygon points=\"350,140 343,128 357,128\" class=\"f-t3\"/>\n<rect x=\"60\" y=\"150\" width=\"580\" height=\"52\" rx=\"2\" class=\"f-t2\" cv-grow-right style=\"--d:.18s\"/>\n<text x=\"350\" y=\"173\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:13.5px;font-weight:700\">MiQ &#183; managed service + Sigma<\/text>\n<text x=\"350\" y=\"191\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:10.5px\">keeps the spread &#8212; a services margin (~9&#8211;11%), not a 40%+ software margin<\/text>\n<g class=\"cv-fade\" style=\"--d:.5s\">\n<rect x=\"60\" y=\"150\" width=\"172\" height=\"52\" fill=\"none\" class=\"s-t2\" style=\"stroke-width:1\"/>\n<rect x=\"468\" y=\"150\" width=\"172\" height=\"52\" fill=\"none\" class=\"s-t2\" style=\"stroke-width:1\"/>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.6s\">\n<text x=\"350\" y=\"226\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9.5px;letter-spacing:.06em\">&#8212;&#8212;&#8201; RENTED PROPS &#8212; MiQ owns almost none of this &#8201;&#8212;&#8212;<\/text>\n<rect x=\"92\" y=\"238\" width=\"150\" height=\"30\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t2)\"/>\n<text x=\"167\" y=\"252\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Samba TV<\/text>\n<text x=\"167\" y=\"263\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">ACR signal<\/text>\n<rect x=\"275\" y=\"238\" width=\"150\" height=\"30\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t2)\"/>\n<text x=\"350\" y=\"252\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Titan OS<\/text>\n<text x=\"350\" y=\"263\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">EU OS-level data<\/text>\n<rect x=\"458\" y=\"238\" width=\"150\" height=\"30\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t2)\"/>\n<text x=\"533\" y=\"252\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Experian<\/text>\n<text x=\"533\" y=\"263\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">identity graph<\/text>\n<\/g>\n<path d=\"M350 202 L350 296\" class=\"s-t1\" style=\"stroke-width:2.5\" marker-end=\"url(#md)\"/>\n<g class=\"cv-rise\" style=\"--d:.72s\">\n<rect x=\"92\" y=\"300\" width=\"150\" height=\"40\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"167\" y=\"325\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:11px;font-weight:700\">The Trade Desk<\/text>\n<rect x=\"275\" y=\"300\" width=\"150\" height=\"40\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"350\" y=\"325\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:11px;font-weight:700\">Google DV360<\/text>\n<rect x=\"458\" y=\"300\" width=\"150\" height=\"40\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"533\" y=\"325\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:11px;font-weight:700\">Amazon DSP<\/text>\n<\/g>\n<text x=\"350\" y=\"356\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9.5px\">demand-side platforms MiQ buys through but does not own<\/text>\n<rect x=\"120\" y=\"372\" width=\"460\" height=\"34\" rx=\"2\" class=\"f-t4\" cv-grow-right style=\"--d:.85s\"/>\n<text x=\"350\" y=\"394\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:11.5px;font-weight:700\">CTV &#183; SSP &#183; open-web inventory<\/text>\n<defs><marker id=\"md\" markerWidth=\"9\" markerHeight=\"9\" refX=\"4.5\" refY=\"7\" orient=\"auto\"><path d=\"M0 0 L4.5 7 L9 0\" style=\"fill:var(--t1)\"/><\/marker><\/defs>\n<text x=\"350\" y=\"424\" text-anchor=\"middle\" class=\"t-muted t-serif\" style=\"font-size:10px;font-style:italic\">A moat of aggregation and neutrality &#8212; durable at scale, but on leased land.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> MiQ&#8217;s business is the thin bright band in the middle: it captures a managed-service margin on advertiser money flowing to inventory, but every layer it stands on &#8212; the DSPs below, the data pillars beside &#8212; belongs to someone else. The corpus&#8217;s central tension drawn as a cross-section: a spread kept on rented land.<\/figcaption>\n<\/figure>\n\n\nThe category label conceals more than it reveals, so start with what MiQ actually is.\n\nMiQ calls itself \"your programmatic media partner\" and a \"programmatic services and technology partner\" [1]. Decoded, that means MiQ takes an advertiser's (or, very often, an agency's) brief and *runs the programmatic campaign for them* — choosing and operating the buying platforms, layering on MiQ's own data and audience models, optimizing in-flight, and reporting outcomes. It is a **managed service**: humans (MiQ calls them \"talented traders,\" \"data and tech experts,\" \"client success specialists\") plus proprietary software do the work, and the client buys the result [1].\n\nThis is structurally different from the pure platforms:\n\n- A **pure DSP** (The Trade Desk, Amazon DSP, Google DV360) sells *software access* — a self-serve seat the buyer logs into. The DSP's revenue is a take rate on media spend that flows through the platform. The Trade Desk disclosed $13.4 billion of gross platform spend in 2025 at a 21.6% take rate [2].\n- An **agency / holdco trading desk** (historically Xaxis at GroupM, Epsilon at Publicis) sells *agency labor and proprietary tech* to the holdco's own clients, and earns margin on the media and on services like supply-path optimization [3][6].\n- **MiQ sits in the overlap.** It has its own technology (Sigma), like a platform; it runs campaigns as a service, like a trading desk; but it is *independent of any single holdco and agnostic across DSPs* — it will run your campaign on The Trade Desk, on Amazon DSP, on DV360, on whatever performs. Gurman Hundal, MiQ's co-founder, has described the model as ad trading, data science, and support sold \"often to other agencies\" in need of programmatic expertise — i.e., MiQ is frequently a *vendor to* the very agencies that are nominally its peers [4].\n\nThe one-sentence positioning thesis MiQ wants you to hold: *\"We are the independent, technology-agnostic specialist that unifies a fragmented programmatic ecosystem and delivers outcomes — without the conflicts of interest of a walled garden or the lock-in of a single DSP.\"* MiQ's own language for Sigma is \"award-winning AI-powered technology that unifies the entire media ecosystem,\" built on a \"truly partner agnostic approach\" [1].\n\nWhat follows takes that thesis seriously, maps it against every adjacent competitor set, and names where it is strong — and where it is a frame that mostly serves MiQ.\n\n---\n\n## 2. The market map: four bands MiQ competes against\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 320\" role=\"img\" aria-label=\"A pressure diagram. In the center sits MiQ, described as a managed-service aggregator in the contestable open-internet middle. A large arrow presses in from the left labeled The Trade Desk, a scaled independent DSP that lost about 68 percent of its value in 2025 but remains the giant moving toward the advertiser. A large arrow presses in from the right labeled Amazon plus the walled gardens, which hold first-party data and let advertisers buy direct. Below are the four bands MiQ competes against: pure DSPs, holdco trading desks such as Xaxis and Epsilon, fellow independents such as Goodway and Tinuiti, and the curation and supply-path-optimization trend eroding the middle. The argument is that MiQ's niche is real but compressed from both sides.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" class=\"t-serif\" style=\"font-size:15px;font-weight:700\">The squeeze &#8212; a real niche, compressed from both sides<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px\">MiQ&#8217;s &#8220;independent, agnostic&#8221; middle is pressed by the DSP it resells and the gardens it routes around<\/text>\n<g class=\"cv-grow-right\" style=\"--d:.15s\">\n<path d=\"M30 110 L150 110 L150 96 L196 130 L150 164 L150 150 L30 150 Z\" class=\"f-t1\"/>\n<text x=\"92\" y=\"126\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:11px;font-weight:700\">The Trade Desk<\/text>\n<text x=\"92\" y=\"140\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:8px\">&#8722;68% in 2025, still the giant<\/text>\n<\/g>\n<g style=\"--d:.15s\" class=\"cv-grow-right\">\n<path d=\"M670 110 L550 110 L550 96 L504 130 L550 164 L550 150 L670 150 Z\" class=\"f-t1\"/>\n<text x=\"610\" y=\"126\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:11px;font-weight:700\">Amazon + gardens<\/text>\n<text x=\"610\" y=\"140\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:8px\">first-party data, buy direct<\/text>\n<\/g>\n<rect x=\"214\" y=\"92\" width=\"272\" height=\"76\" rx=\"2\" class=\"f-t2\" cv-grow-up style=\"--d:.4s\"/>\n<text x=\"350\" y=\"120\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:13px;font-weight:700\">MiQ<\/text>\n<text x=\"350\" y=\"138\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:9.5px\">managed-service aggregator in the<\/text>\n<text x=\"350\" y=\"151\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:9.5px\">contestable open-internet middle<\/text>\n<text x=\"350\" y=\"200\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9.5px;letter-spacing:.06em\">&#8212;&#8201; AND four bands it competes with inside that middle &#8201;&#8212;<\/text>\n<g class=\"cv-rise\" style=\"--d:.55s\">\n<rect x=\"34\" y=\"216\" width=\"150\" height=\"58\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t1)\"/>\n<text x=\"109\" y=\"236\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Pure DSPs<\/text>\n<text x=\"109\" y=\"251\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">TTD &#183; DV360<\/text>\n<text x=\"109\" y=\"263\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">Amazon<\/text>\n<rect x=\"196\" y=\"216\" width=\"150\" height=\"58\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t1)\"/>\n<text x=\"271\" y=\"236\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Holdco desks<\/text>\n<text x=\"271\" y=\"251\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">Xaxis &#183; Epsilon<\/text>\n<text x=\"271\" y=\"263\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">same niche, captive<\/text>\n<rect x=\"358\" y=\"216\" width=\"150\" height=\"58\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t2)\"/>\n<text x=\"433\" y=\"236\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Independents<\/text>\n<text x=\"433\" y=\"251\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">Goodway &#183; Tinuiti<\/text>\n<text x=\"433\" y=\"263\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:8.5px\">consolidation race<\/text>\n<rect x=\"520\" y=\"216\" width=\"146\" height=\"58\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t3)\"/>\n<text x=\"593\" y=\"236\" text-anchor=\"middle\" style=\"font-size:10px;font-weight:700\">Curation + SPO<\/text>\n<text x=\"593\" y=\"251\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">supply-path cuts<\/text>\n<text x=\"593\" y=\"263\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">eroding the middle<\/text>\n<\/g>\n<text x=\"350\" y=\"300\" text-anchor=\"middle\" class=\"t-muted t-serif\" style=\"font-size:10px;font-style:italic\">Its independence is governance, not technology &#8212; the same thesis that cost TTD two-thirds of its value.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> MiQ occupies a genuine niche &#8212; the neutral, agnostic aggregator of the open-internet middle &#8212; but the geometry shows the problem: it is pressed inward by the scaled DSP it resells on one flank and the first-party-data gardens it routes around on the other, while curation and supply-path optimization thin the middle itself.<\/figcaption>\n<\/figure>\n\n\nThink of the buy-side programmatic landscape as four bands, ordered roughly by how much technology they own versus how much service they sell.\n\n**Band A — Pure DSPs / platforms (own the tech, sell software access).**\nThe Trade Desk, Amazon DSP, Google DV360, plus Yahoo DSP and others. These are the rails MiQ runs on. The Trade Desk is the independent reference point: ~$18B market cap after its 2025 collapse, down from a peak that had been multiples higher [5]. Amazon DSP and DV360 are arms of walled gardens with their own first-party data and owned inventory.\n\n**Band B — Holdco trading desks (own some tech, sell agency service to captive clients).**\nXaxis (GroupM), Epsilon (Publicis), Amnet/dentsu's programmatic arm, Hearts & Science / Omnicom's Omni-driven buying, Accuen historically. These are *captive* — they serve their holding company's clients. Their competitive problem is that the holdco's own clients increasingly question the margin and conflict embedded in a captive desk, and holdcos have moved toward principal-based buying and supply-path optimization to reclaim value [3][6].\n\n**Band C — Independent specialists (the band MiQ is in).**\nMiQ, Goodway Group, Tinuiti, Adlucent, Jellyfish/Brainlabs-style independents, plus a long tail of regional and point-solution shops. These sell programmatic (and often broader performance) expertise as a service, independent of any holdco, agnostic across platforms. Tinuiti calls itself the largest independent full-funnel marketing agency in the U.S. with ~$4B in digital media under management [7]. Goodway is a programmatic-first independent that has been aggressively rationalizing its supply path [7].\n\n**Band D — Walled gardens selling direct (own the data, the inventory, AND increasingly the buying tool).**\nAmazon, Google, Meta, and CTV owners (Netflix's ad tier via partners, Roku, Disney) selling self-serve or managed access to their own inventory with their own first-party data. This band is the gravitational threat to all of A, B, and C, because it lets an advertiser bypass the independent middle entirely.\n\nMiQ's strategic bet is that Bands A through D fragment the market into so many platforms, identities, and data feeds that someone has to *unify and operate* across them — and that an independent, agnostic specialist is the natural unifier. The bet is fragile for one reason: Band D is trying to make the unifier unnecessary for the highest-value spend.\n\n---\n\n## 3. MiQ vs. the pure DSPs (Band A): partner, reseller, and would-be peer all at once\n\nThis is the most important and most uncomfortable comparison, because MiQ's relationship to the DSPs is three things at once: *partner*, *reseller*, and *aspiring substitute*.\n\n### 3.1 MiQ resells the DSPs it claims to transcend\n\nMiQ's \"agnostic\" execution means that when MiQ runs a campaign, the actual bidding very often happens *inside* The Trade Desk, Amazon DSP, or DV360. MiQ's Sigma \"generative AI personas\" component is explicitly described as interpreting an advertiser brief and identifying audience segments \"for activation across DSPs\" [8] — i.e., the DSPs remain the activation layer; Sigma is a workflow and intelligence wrapper on top. For a meaningful share of MiQ's book, the underlying buying engine is someone else's platform, and MiQ's value-add is the data, the optimization, the people, and the reporting layered around it.\n\nThis is the structural fact the \"independent alternative\" frame is built to soften: **on the plumbing, MiQ is often a value-added reseller of the same DSPs everyone else resells.** Its differentiation has to come from the layer it owns, not the layer it rents.\n\n### 3.2 The Trade Desk's 2025 collapse is a warning written in MiQ's own language\n\nThe Trade Desk built a ~$100B+ company on exactly MiQ's thesis: the *independent, objective* buying platform for the open internet, neutral against the walled gardens. In 2025 that thesis cracked in public. TTD stock fell roughly 68% over 2025, ending around an $18B market cap [5]. Q4 2025 revenue grew 14% YoY to $847 million (19% ex-political), with Q1 2026 guidance of just 10% — down from 26% growth in 2024 [2]. The causes matter for MiQ because they attack the *category*, not just the company:\n\n- **Amazon went on offense.** Amazon offered advertisers free DSP testing and even offered to fund comparative tests against rival platforms — covering competitors' inventory, tech, and measurement costs — to pull spend onto Amazon DSP [5]. Amazon's ad revenue hit $13.9B in Q1 2025, up 18% YoY [5][9]. Amazon also struck an inventory partnership with Netflix and a deal with Roku, widening the owned/operated inventory an advertiser can reach without an independent DSP [5].\n- **Holdcos began steering away.** Publicis told clients it no longer recommends The Trade Desk as the default, citing walled-garden pressure [6].\n- **The objectivity premium compressed.** AdExchanger's James Hercher framed it directly: investors are \"reconsidering the thesis of objective indie ad tech,\" because the walled gardens offer low-fee DSPs that funnel budgets to their own inventory and aggressively claim last-touch attribution credit, raising \"a higher burden\" for the independents to justify their value [2].\n\nEvery one of those forces applies to MiQ. If the *publicly traded, scaled, technology-owning* embodiment of the independence thesis lost two-thirds of its value in a year, the privately held, PE-owned, partly-reselling embodiment cannot assume the frame is safe. MiQ's defense is that it is *not* a pure DSP — it is service-led and multi-DSP, so it can route spend to Amazon DSP when Amazon is winning. That is a real hedge, and TTD does not have it. But it is also an admission: MiQ's independence is agnostic-by-routing, not independent-by-substitution. When the walled gardens win, MiQ's job is to help clients spend *into* the walled gardens — a thinner, more commoditizable role than owning the demand path.\n\n### 3.3 Where MiQ is genuinely differentiated vs. the DSPs\n\nTwo places, and they are narrower than the marketing:\n\n1. **TV Intelligence / the CTV data footprint.** MiQ operates a deterministic TV data footprint it describes as 90 million households across five major markets, drawing on 6.4 trillion video-consumption signals from 11 partners, with claimed reach to 500M+ global CTV households when combined with consumer/behavioral/purchase data [10]. This is an *asset MiQ assembled*, not a DSP feature it resells — and it is the most defensible thing in its portfolio (explored in detail in the chapters on MiQ's CTV capabilities and its TV Intelligence stack; here it matters as the differentiation that survives the reseller critique).\n2. **Managed-service execution at scale.** MiQ runs campaigns for ~2,500 advertisers and frequently *for other agencies* [4]. The labor, the trading craft, and the accumulated playbooks are a moat against a self-serve advertiser, even if they are not a moat against another managed-service independent.\n\nSigma — the AI workflow product (Sigma Intelligence for behavioral \"modes,\" a Claude/Gemini/ChatGPT-built Trading Agent, and generative-AI audience personas) — is the attempt to turn that service muscle into productized technology so MiQ looks more like Band A and less like Band C [8]. Whether Sigma is a durable platform or a thin wrapper on commodity LLMs and other people's DSPs is the central open question about MiQ's 2029 position (Section 9).\n\n---\n\n## 4. MiQ vs. the holdco trading desks (Band B): the same niche, minus the captivity\n\nThe holdco trading desks — Xaxis (GroupM), Epsilon (Publicis) — are MiQ's closest *functional* analogues: managed programmatic buying plus proprietary tech and data. One thing sets MiQ apart — captivity and conflict.\n\n- **Xaxis / GroupM.** Xaxis pioneered the holdco trading-desk model: a centralized programmatic buying unit serving GroupM's clients, with proprietary tech and data. GroupM has leaned into supply-path optimization (SPO = cutting redundant intermediaries out of the bid path so more of the advertiser's money reaches working media); GroupM reported its SPO program lifted approved-partner investment 75% month-over-month and improved video/display performance ~15% [3]. The structural weakness: Xaxis is captive to GroupM, and the historical \"trading desk takes undisclosed margin on its own holdco's clients\" model has been under client and transparency pressure for a decade.\n- **Epsilon / Publicis.** Epsilon brings first-party identity (CORE ID, person-first identity) and has extended into retail media infrastructure [6]. It is a data-and-identity powerhouse, but again captive to Publicis's orbit and oriented around Publicis's identity stack.\n\nMiQ's competitive claim against Band B is clean: *it offers the trading-desk capability without belonging to one holding company*, so a brand wary of a captive desk's conflicts — or an agency that lacks its own desk — can use MiQ as a neutral execution partner. The Dentsu deal is both the proof point and the paradox (Section 7): a holding company chose to put an *independent's* technology \"at the strategic center\" of its media practice rather than build or mandate its own [11][12]. That is a vote for the independent-specialist model over the captive-desk model — *and* a vote that makes MiQ partly captive to a holdco's roadmap.\n\nMiQ shares one weakness with Band B: both are intermediaries earning a margin on someone else's media, and both face the same disintermediation pressure from Band D. MiQ is less conflicted than a captive desk. It is not less *disintermediable*.\n\n---\n\n## 5. MiQ vs. fellow independent specialists (Band C): a consolidation race\n\nThis is the band where MiQ both competes and shops. The dynamic is consolidation, and MiQ is positioning to be a consolidator rather than a target.\n\n### 5.1 The field\n\n- **Goodway Group** — programmatic-first independent, known for proprietary tooling and an aggressive supply-path discipline (cut its SSP count from ~20 at end-2024 to single digits) [7]. A direct philosophical competitor: independent, programmatic-specialist, tech-enabled service.\n- **Tinuiti** — the largest U.S. independent full-funnel agency, ~$4B media under management, strong in marketplace/commerce (Amazon, Walmart) [7]. Competes with MiQ for the \"independent alternative to the holdcos\" mandate, though weighted toward retail media and search/social where MiQ is weaker.\n- **A long tail of point solutions**, especially in the U.S. — contextual vendors, CTV specialists, regional programmatic shops. MiQ's own leadership has named this tail as ripe for roll-up: \"there's potential for consolidation as there's a lot of point solutions, especially in the U.S.\" [13].\n\n### 5.2 MiQ as consolidator\n\nUnder Bridgepoint's ownership (acquired ~2024 for ~$900M, a 6.1x return for prior owner ECI Partners) [13][14], MiQ has shifted from historically organic growth to inorganic M&A, targeting contextual, CTV, U.S. point solutions, and geographic expansion into continental Europe and APAC [13]. The roll-up to date:\n\n- **Pathlabs** (announced July 2024) — a Media Execution Partner (MEP) that provides end-to-end programmatic execution to *independent agencies*; ~100 people, Missoula, Montana, founded 2021 [15]. Strategically this is MiQ buying a channel into the independent-agency long tail — a B2B2B move to become the execution back-end for agencies too small to run their own desk.\n- **Adsmovil (LatAm)** (announced March 25, 2026) — Adsmovil's Latin American business, 150+ employees across 12 markets, claimed to create \"the largest independent programmatic offering\" in the region with access to 400M+ unique IDs across mobile, retail media, CTV, video, YouTube, and DOOH [16][17].\n- **Grasp** — sometimes named as part of MiQ's roll-up, but a Grasp acquisition could not be independently confirmed as of mid-2026 and remains unverified (see Open Questions).\n\nThe pattern is a deliberate \"independent consolidator\" play: use PE capital to absorb the point-solution tail, add geography (LatAm, Europe, APAC) and capabilities (CTV intelligence, retail media, contextual), and emerge as the scaled independent that survives when smaller specialists cannot afford the data, identity, and AI investment the next phase demands. The \"largest independent\" claim recurs across announcements [16][17] for a reason: *scale among independents* is the defensible version of the independence thesis — being the one independent big enough to matter when the walled gardens consolidate everyone else's demand.\n\n### 5.3 The fragility within Band C\n\nConsolidating independents does not solve the Band D problem. It just makes MiQ the largest example of a category under pressure. If advertisers move their highest-value spend to Amazon, Google, and Meta direct, being the biggest independent specialist means being the biggest player in a shrinking-relevance band. Scale helps MiQ afford the CTV data and AI that *might* keep it relevant. It does not, by itself, change the gravitational pull toward first-party-data walled gardens.\n\n---\n\n## 6. The competitive battlegrounds: curation and SPO\n\nTwo technical battlegrounds will decide how much margin sits in the independent middle: curation and supply-path optimization. Both cut both ways for MiQ.\n\n### 6.1 Curation (packaging inventory + data into ready-to-buy deals)\n\nCuration is the strategic packaging of enriched audience data and premium inventory into a single, performance-ready deal — typically a private marketplace or Deal ID — assembled by a \"curator\" on an SSP-based platform [18][19]. The power shift is real and against the DSP layer: historically the DSP's algorithm was the curator of the open exchange; now SSPs and independent curators bundle first-party data with premium supply and capture that value themselves. More than 66% of open-exchange spend — over $100B annually — now flows through curated PMPs, per industry estimates [19].\n\nFor MiQ this is *opportunity and threat*. Opportunity: MiQ's data assets (TV signals, 400M+ LatAm IDs) are exactly the kind of data that can be curated into deals, letting MiQ monetize data over supply rather than only as an execution service. Threat: curation lets SSPs and data owners disintermediate the buy-side service layer — if a curated Deal ID already bundles the data and the inventory, the advertiser needs less of the managed-service optimization MiQ sells. Curation can make MiQ's data more valuable and its execution labor less necessary in the same move. *(Curation figures are from industry and vendor sources — Equativ, Experian, Playwire — and carry a vendor-interest lean; treat the $100B / 66% figures as directional, not audited.)*\n\n### 6.2 Supply-path optimization (cutting redundant middlemen in the bid path)\n\nSPO is the buy-side discipline of reducing the number of intermediaries between advertiser and publisher to cut fees and improve quality. GroupM/Xaxis ran a high-profile SPO program with claimed 75% MoM lift to approved partners [3]; Goodway cut its SSP count from ~20 to single digits [7]. The Trade Desk's OpenPath pushed direct publisher connections, and notably OpenPath \"removes the agency's supply-path-optimization layer\" — i.e., a service that trading desks charge margin on — positioning it \"at cost\" and directly threatening that revenue line [6].\n\nThe implication for MiQ is pointed: **SPO is a movement to remove redundant intermediaries, and an independent managed-service layer is, to a skeptic, exactly such an intermediary.** MiQ's counter is that it is a *value-adding* intermediary (data, intelligence, execution craft), not a *toll-taking* one — but that is precisely the distinction every disintermediated middleman claims. MiQ has to keep proving the value-add exceeds the fee, in a market that is hunting for fees to cut.\n\n---\n\n## 7. The agency-and-client model: three go-to-market bets\n\nMiQ's competitive position is as much about *who it sells to* as *what it sells*. It runs three distinct go-to-market motions, and each hedges the others.\n\n1. **Direct managed service to advertisers** — the classic MiQ: run the campaign, deliver outcomes, ~2,500 advertisers [4]. Competes with holdco desks and other independents.\n2. **B2B2B to independent agencies via Pathlabs (the MEP play)** — become the programmatic execution back-end for agencies too small to run their own desk [15]. This is a *channel* strategy: instead of competing with the long tail of independent agencies, MiQ powers them, and aggregates their spend. It is the most defensible of the three because it embeds MiQ in agencies' operations.\n3. **Technology-licensing to holdcos via Sigma (the Dentsu deal)** — Dentsu named MiQ its \"Intelligence Partner\" and integrated Sigma \"at the strategic center\" of its media practice, the first holdco to do so [11][12]. Sigma is pitched as processing 300+ data feeds spanning 700 trillion consumer digital signals and interoperating with ChatGPT, Claude, and Gemini [11]. MiQ already works with Havas, Publicis, and WPP in some capacity, and the Dentsu deal was not disclosed as exclusive [11].\n\nThe Dentsu deal is genuinely significant *and* genuinely double-edged. Significant: a holding company choosing an independent's technology over building its own is a strong endorsement that the unify-the-fragmentation problem is real and that MiQ's tech is a credible answer [11][12]. Double-edged: (a) it makes MiQ partly dependent on a single holdco's roadmap and procurement; (b) it invites the question of whether MiQ is becoming a *technology vendor* (valued on software multiples and platform durability) versus a *service business* (valued on labor margin) — and Sigma must be a real platform for that re-rating to hold; (c) holdcos are notoriously willing to build or switch, so \"Intelligence Partner\" today can be \"former vendor\" in three years.\n\nOne caveat matters here: the Dentsu–MiQ Sigma integration and the \"Intelligence Partner\" status are **present-tense status claims** sourced to June 2025 announcements [11][12]. As of this writing I have not found a 2026 source confirming the integration is live, expanded, or renewed. Treat it as confirmed-as-of-mid-2025, and flag any reliance on it as a current fact (Open Questions).\n\n---\n\n## 8. The commercial model and PE ownership\n\nBridgepoint's private-equity ownership now shapes how MiQ competes. That is a structural fact about the company, not background color.\n\n- **Ownership & valuation.** Bridgepoint acquired MiQ (from ECI Partners) for ~$900M, delivering ECI a 6.1x return on its 2017 investment [13][14]. Co-founder Gurman Hundal moved to executive chairman, with leadership retained post-deal [13].\n- **Scale.** MiQ is ~$600M+ revenue and ~1,900 employees as of 2026 (a third-party headcount estimate put it at 1,909 as of April 30, 2026) [4][20]. (Note the data-vintage spread: a May 2023 Marketecture profile cited ~1,200 people / 30 cities / ~2,500 advertisers and $600M+ revenue [4]; the ~1,900 figure is 2026 — the company roughly grew/rolled-up its headcount in the interim, partly via acquisitions like Adsmovil's 150+ and Pathlabs' ~100.)\n- **What PE ownership does to competitive strategy.** PE backing funds the roll-up (Section 5) and pushes toward an exit on a 3–5 year horizon. That has two competitive consequences: (1) MiQ is incentivized to assemble a scaled, differentiated, \"largest-independent\" story that supports a premium exit multiple — which favors the CTV-data and Sigma-platform narratives over the commoditizable reseller reality; (2) the exit clock pressures MiQ to *productize* (Sigma) so it can be valued on software multiples rather than services multiples. The risk is that PE-driven roll-ups can buy revenue faster than they integrate it, and a federation of acquired point solutions is not the same as a unified platform — the \"unify the fragmentation\" pitch is harder to deliver internally when you yourself are a stack of acquisitions.\n\n---\n\n## 9. The sharply critical read: the weakest link, and who the \"independent\" frame really serves\n\nTwo questions are worth answering plainly: what is the weakest link in MiQ's \"independent + agnostic\" positioning, and who actually benefits from the framing. Here it is, unsoftened.\n\n**The weakest link: \"independent and agnostic\" describes MiQ's *governance*, not its *technology*. On the technology that actually moves money — the bidding engine — MiQ is frequently a reseller of the same DSPs (The Trade Desk, Amazon DSP, DV360) that are themselves the contested layer.** Sigma sits *on top of* those DSPs and activates *across* them [8]; it does not replace them. So when an advertiser asks, \"what do I get from MiQ that I can't get by buying the DSP directly?\", the honest answer is: data (the CTV footprint, the LatAm IDs), people (managed-service trading craft), and a workflow layer (Sigma) — *not* a fundamentally different or cheaper path to inventory. Two of those three, people and workflow, are exactly what the market's two strongest forces are attacking: SPO is hunting intermediary fees [3][6], and the walled gardens are offering low-fee direct DSPs with first-party data that make the independent middle optional for the highest-value spend [2][5]. The frame is most fragile precisely where the spend is most valuable.\n\n**Who benefits from the frame:**\n\n1. **MiQ itself**, most obviously — \"independent and agnostic\" justifies a managed-service margin on top of media the advertiser could in principle buy directly, and it is a re-rating story for a PE exit.\n2. **Agencies without their own desk** — they can resell MiQ's neutrality to *their* clients as conflict-free buying, while outsourcing the execution risk.\n3. **The holdcos, situationally** — Dentsu gets to tell clients it has best-in-class \"Intelligence\" without the cost and risk of building it, while keeping the relationship and the client [11][12].\n\n**Who is *not* obviously served by the frame: the advertiser with strong first-party data and the scale to buy walled gardens directly.** For that advertiser, \"independent and agnostic\" is a reason to pay an extra layer to route spend that increasingly wants to go to Amazon, Google, and Meta anyway. The independence thesis is strongest for advertisers who are *data-poor and fragmentation-exposed* — mid-market brands, agencies serving many small clients, categories without a natural walled-garden home. It is weakest for exactly the large, first-party-data-rich advertisers the walled gardens court hardest. The Trade Desk's collapse is the market pricing that asymmetry in public. MiQ's privately held version of the same thesis is exposed to the same asymmetry, just without a daily stock quote to mark it.\n\n**The strongest case MiQ would offer back** (presented in its own terms): *Independence is not about owning the bidder; it's about being the one party in the chain with no incentive to steer the advertiser toward owned inventory. When every walled garden is grading its own homework on attribution, a genuinely agnostic partner that can route to Amazon when Amazon wins and to the open internet when it wins is more valuable, not less — and the CTV data footprint is a real, owned asset that no DSP reseller relationship can replicate.* That is a coherent and partly correct defense. It is also, almost word for word, the defense The Trade Desk gave before 2025. The one difference MiQ can point to: unlike TTD, it is not betting the company on the *open internet specifically* — it is agnostic enough to ride the walled gardens' rise. The question for 2029 is whether \"we help you spend into the walled gardens efficiently\" is a business with durable margin, or a commoditizing service the walled gardens' own managed offerings will undercut.\n\n---\n\n## 10. Where this leaves MiQ competitively through 2029\n\nA market-map read of MiQ's position:\n\n- **Defensible:** the CTV/TV-Intelligence data footprint (owned asset, hard to replicate) [10]; the Pathlabs channel into independent agencies (embedded, sticky) [15]; the scale-among-independents consolidation story funded by Bridgepoint [13][16].\n- **Contested:** Sigma as a durable platform vs. a wrapper on commodity LLMs and other people's DSPs [8][11]; the holdco-licensing model (Dentsu) as recurring revenue vs. a switchable vendor relationship [11][12].\n- **Fragile:** the core \"independent + agnostic\" frame wherever it competes for first-party-data-rich advertisers against low-fee walled-garden DSPs [2][5][6]; the reseller economics on commoditizable execution as SPO and curation hunt intermediary margin [3][6][19].\n\nThe strategic imperative is legible: **convert \"agnostic middleman\" into \"indispensable intelligence and execution layer\" before the DSPs MiQ resells and the walled gardens it routes around make the middle disappear.** MiQ holds two cards for that conversion: the CTV data asset, which it *owns*, and Sigma-as-platform, which it must *prove*. The roll-up buys time and scale to play those cards. The independence frame buys positioning. Neither, by itself, answers the question the Trade Desk's 2025 collapse posed to the entire independent band: *what, exactly, does the independent middle do that the advertiser cannot increasingly do for itself — and is it worth the fee?*\n\n---\n\n## Open Questions\n\n1. **Grasp acquisition — unconfirmed.** \"Grasp\" is sometimes listed among MiQ's roll-up (alongside Adsmovil and Pathlabs), but a MiQ–Grasp acquisition could not be independently verified as of mid-2026; it needs primary or wire confirmation before being asserted as a completed deal.\n2. **Is the Dentsu Sigma integration live and expanding as of 2026?** The \"Intelligence Partner\" status and \"at the strategic center\" integration are sourced to June 2025 announcements [11][12]; no 2026 confirmation found. Present-tense reliance on it should be flagged until refreshed.\n3. **What share of MiQ's media spend is genuinely differentiated vs. plain DSP reselling?** No public disclosure breaks MiQ revenue into (a) data/intelligence-led, (b) managed-service execution, (c) pass-through DSP reselling. This split is the crux of the reseller critique and is currently unknowable from public sources.\n4. **MiQ's exact current revenue and margin.** Figures range from ~$465M (2021) [13] to \"$600M+\" (cited 2023 and still used) [4]; a precise 2025/2026 figure and the services-vs-platform margin mix are not public (MiQ is private).\n5. **Does Sigma have defensible IP, or is it an orchestration layer over commodity LLMs (Claude/Gemini/ChatGPT) and third-party DSPs?** [8][11] The answer determines whether MiQ re-rates as a platform or stays a services business at exit.\n6. **How exclusive is the holdco relationship set?** MiQ reportedly works with Dentsu, Havas, Publicis, and WPP [11]; the degree of exclusivity, depth, and revenue concentration across them is undisclosed and material to competitive risk.\n7. **Does scaling the independent band actually defend against Band D,** or does it just make MiQ the largest player in a band losing relevance to first-party-data walled gardens? This is the load-bearing strategic uncertainty for the 2029 forecast.\n\n---\n\n## Sources\n\n1. MiQ, \"Your Programmatic Media Partner\" (company homepage / self-description), wearemiq.com, accessed 2026-06-20. *Tier 1 (company self-description — claims, not independent fact). Used for MiQ's own positioning language: \"agnostic,\" \"managed service,\" Sigma description.* https://www.wearemiq.com/\n2. Hercher, James, \"The Trade Desk Faces Headwinds As Investors Reconsider The Thesis Of Objective Indie Ad Tech,\" AdExchanger, 2026-02-26, accessed 2026-06-20. *Tier 5 (specialized trade analysis). TTD Q4 2025 figures ($847M, 14%/19% growth, 10% Q1'26 guide, $13.4B gross spend, 21.6% take rate), the \"objective indie ad tech\" reconsideration thesis, walled-garden/last-touch critique.* https://www.adexchanger.com/marketers/the-trade-desk-faces-headwinds-as-investors-reconsider-the-thesis-of-objective-indie-ad-tech/\n3. GroupM / Branding in Asia & Campaign Asia, GroupM SPO program coverage (Xaxis supply-path optimization, +75% MoM to approved partners, +15% video/display performance), accessed 2026-06-20. *Tier 5 (trade press) reporting on a company program. Used for holdco SPO dynamics.* https://www.brandinginasia.com/groupm-launches-supply-path-optimization-initiative-in-asia-pacific-region/\n4. Marketecture, \"MiQ — Gurman Hundal\" profile/interview, news.marketecture.tv (interview May 2023; figures cited through 2026), accessed 2026-06-20. *Tier 5 (specialized trade). MiQ as $600M+ revenue, managed-service/agnostic model, \"often other agencies\" as clients, ~2,500 advertisers, ~1,200 people / 30 cities (2023 vintage — flagged).* https://news.marketecture.tv/p/miq-gurman-hundal\n5. MediaPost / Globe and Mail / Yahoo Finance / Motley Fool coverage of The Trade Desk's 2025 stock collapse (~68% decline, ~$18B market cap, Amazon free-DSP-testing and funded comparative tests, Amazon–Netflix and Amazon–Roku inventory deals), accessed 2026-06-20. *Tier 3–5 (wire/major-outlet + trade financial commentary). Used for the TTD collapse magnitude and Amazon's offensive moves.* https://www.mediapost.com/publications/article/408044/amazon-accelerates-dsp-trade-desk-stock-crumbles.html ; https://www.theglobeandmail.com/investing/markets/stocks/AMZN/pressreleases/36952192/why-the-trade-desk-stock-collapsed-68-in-2025/\n6. The B2B Stack / trade coverage, \"Publicis Publicly Dumps Trade Desk\" (Publicis no longer recommending TTD; OpenPath removing the agency SPO margin layer; walled-garden pressure), accessed 2026-06-20. *Tier 5 (trade analysis). Used for holdco-steering-away dynamics and the SPO/OpenPath margin threat.* https://www.theb2bstack.com/p/publicis-publicly-dumps-tradedesk\n7. AdExchanger / Adweek / Tinuiti & Goodway coverage (Tinuiti ~$4B media under management, \"largest independent full-funnel\"; Goodway SSP rationalization from ~20 to single digits), accessed 2026-06-20. *Tier 5 (trade press + company profiles). Used for the independent-specialist field map.* https://www.adexchanger.com/platforms/a-rundown-on-pretty-much-every-ad-tech-deal-of-2025/\n8. Gerber, Joanna, \"MiQ Aims To Unify Fragmented Data Landscape With New AI-Powered Ad Platform,\" AdExchanger, 2025-06-09, accessed 2026-06-20. *Tier 5 (specialized trade). Sigma's three components (Sigma Intelligence, Trading Agent on Claude/Gemini/ChatGPT, generative-AI personas), and the key fact that personas activate \"across DSPs\" — i.e., DSPs remain the activation layer.* https://www.adexchanger.com/technology/miq-aims-to-unify-fragmented-data-landscape-with-new-ai-powered-ad-platform/\n9. AInvest, \"The Trade Desk vs. Amazon: Can Neutral Ad Tech Survive the Walled Garden Siege?\" (Amazon ad revenue $13.9B Q1 2025, +18% YoY; walled-garden conflict-of-interest framing), accessed 2026-06-20. *Tier 5/6 (investment commentary — note promotional/analytical lean). Used for Amazon ad-revenue scale and the walled-garden critique, corroborated against [5].* https://www.ainvest.com/news/trade-desk-amazon-neutral-ad-tech-survive-walled-garden-siege-2506/\n10. MiQ, \"MiQ Solidifies Leadership in Advanced TV Advertising…\" and Advanced TV solution pages (90M-household / 6.4-trillion-signal CTV panel across 5 markets, 11 partners; 6T+ signals/month; 500M+ global CTV households reach), wearemiq.com, accessed 2026-06-20. *Tier 1 (company self-description — claims). Used for the TV-Intelligence data footprint; magnitude is MiQ's own claim and should be read as such.* https://www.wearemiq.com/media-solutions/advanced-tv\n11. MediaPost, \"Dentsu Goes All-In With MiQ, Claims Industry-First Integration,\" 2025-06-12, accessed 2026-06-20. *Tier 5 (trade press) reporting on a partnership announcement. Dentsu names MiQ \"Intelligence Partner,\" Sigma \"at the strategic center,\" 300+ data feeds / 700T signals, interoperates with ChatGPT/Claude/Gemini, not disclosed exclusive, MiQ also works with Havas/Publicis/WPP.* https://www.mediapost.com/publications/article/406608/dentsu-goes-all-in-with-miq-claims-industry-first.html\n12. Dentsu, \"Dentsu Selects MiQ Sigma To Help Power Next Gen Media Operations\" (press release), dentsu.com, 2025-06, accessed 2026-06-20. *Tier 1 (press release — claim, not independent proof). Used only for what the parties announced; paired with [11] for independent reporting.* https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations\n13. Digiday, \"MiQ mulls M&A moves with new PE-backers\" (Bridgepoint ~$900M acquisition, 6.1x return to ECI, 2021 revenue ~$465M / $45.4M profit, Hundal to executive chairman, roll-up targets: contextual/CTV/US point solutions/Europe/APAC), accessed 2026-06-20. *Tier 5 (specialized trade). Used for ownership, valuation, and M&A strategy.* https://digiday.com/media/miq-mulls-ma-moves-with-new-pe-backers/\n14. Bridgepoint / PrivSource, Bridgepoint acquisition of MiQ from ECI Partners (deal confirmation, ~$900M / ~$1B valuation), accessed 2026-06-20. *Tier 1/5 (PE firm release + deal database). Used to corroborate ownership change in [13].* https://www.privsource.com/acquisitions/deal/bridgepoint-acquires-miq-from-eci-partners-plSqEY\n15. MiQ / Progress Partners, \"MiQ to acquire Pathlabs\" (announced July 2024; MEP for independent agencies; ~100 people; Missoula, MT; founded 2021), accessed 2026-06-20. *Tier 1 (company/advisor announcement — claim). Used for the Pathlabs MEP channel strategy.* https://www.wearemiq.com/resources/news/miq-to-acquire-pathlabs-expanding-programmatic-excellence-to-independent-agencies\n16. MiQ, \"MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering In Latin America\" (2026-03-25; 150+ employees, 12 LatAm markets, 400M+ unique IDs, mobile/retail media/CTV/video/YouTube/DOOH), accessed 2026-06-20. *Tier 1 (press release — claim, incl. the \"largest independent\" self-characterization). Used for the LatAm roll-up; \"largest independent\" is MiQ's claim.* https://www.wearemiq.com/resources/news/miq-acquires-adsmovil\n17. Business Wire, \"MiQ Acquires Adsmovil…\" (2026-03-25, wire distribution of the announcement), accessed 2026-06-20. *Tier 3 distribution of a Tier-1 press release — corroborates date and figures in [16], not independent verification of the \"largest\" claim.* https://www.businesswire.com/news/home/20260325615344/en/MiQ-Acquires-Adsmovil-Creating-Largest-Independent-Programmatic-Offering-In-Latin-America\n18. Equativ, \"A 2026 Guide to Programmatic Curation & Curated Marketplaces\"; Experian Marketing Services, \"What's curation in AdTech?\" (curation defined as packaging enriched data + premium inventory into PMP/Deal IDs; SSP/curator value capture), accessed 2026-06-20. *Tier 5 (vendor/analytical — note vendor interest in promoting curation). Used for the curation mechanism and the DSP→SSP value shift.* https://www.equativ.com/blog/2026-programmatic-curation-guide\n19. AdExchanger, \"Publishers Fear They Missed Their Chance To Cash In On Curation,\" plus Experian/Playwire curation data (66%+ of open-exchange spend / $100B+ via curated PMPs; CPM 2–3x open market; ~half of curated deals carry no extra fee), accessed 2026-06-20. *Tier 5 (trade + vendor). Curation market-size figures are directional and vendor-sourced — flagged in text; AdExchanger piece used for the publisher-side ambivalence.* https://www.adexchanger.com/publishers/publishers-fear-they-missed-their-chance-to-cash-in-on-curation/\n20. Tracxn, \"MiQ — 2026 Company Profile\" (third-party headcount estimate ~1,909 as of 2026-04-30; 6-continent presence), accessed 2026-06-20. *Tier 7-adjacent (data-aggregator estimate, not audited). Used only for an approximate current headcount, corroborated directionally against MiQ's own \"+specialists\" language in [1]; not load-bearing.* https://tracxn.com/d/companies/miq/__0VrOs0uxLkQOmrlXseS3BFwOn_NFpsWMVxjlpkTQbXI"}, {"order": 7, "file": "07_Commercial_Model_Ownership_And_Margins.md", "title": "Commercial Model, Ownership, and Margins", "summary": "", "body": "# Commercial Model, Ownership, and Margins\n\n> **Decode-as-you-go.** *Take rate* = the cut a media partner keeps out of the advertising money that flows through it. *Managed service* = MiQ's people run the campaign for the client, versus the client licensing software and running it themselves (*self-serve*). *SaaS* = software-as-a-service: recurring software-license revenue, which carries much higher gross margins than people-heavy service revenue. *PE* = private equity. *EBITDA* = earnings before interest, tax, depreciation and amortisation — the rough cash-profit proxy PE firms underwrite to. *MOIC / money multiple* = how many times an investor got its money back. *IRR* = the annualised return rate. *LBO* = leveraged buyout, a deal part-funded with debt. *Gross billings / media billings* = the total ad money passing through MiQ; *net revenue* = what MiQ actually books as its own turnover after the media is paid for.\n\n---\n\n## Bottom Line\n\nMiQ is a **profitable, PE-owned, services-led programmatic business that the public record sizes at roughly $465M of group revenue in 2021 (the last hard, third-party-disclosed figure) with EBITDA of about $40M–$50M** — a roughly 9%–11% EBITDA margin. That is exactly what a labor-intensive managed-service model produces, and far below the 40%+ margins of a pure software (SaaS) platform like The Trade Desk. Third-party trackers and founder statements now put group revenue \"north of $600M\" (Hundal, May 2023), with trackers estimating $500M–$1B — but **none of these recent figures is audited or independently verified, so treat every post-2021 revenue number as an estimate.** The frequently-cited \"~$64.7M FY2022\" figure is a **single UK legal entity** (MIQ Digital Limited, company no. 07321732), not the group. It is real but partial, and reconciling it against the ~$465M+ group number is the single most important number-discipline point here: they measure different things — one subsidiary's net revenue versus consolidated group revenue, which is itself net of media. **Bridgepoint Group holds the majority stake** since September 2022, in a deal valuing MiQ at \"up to $1 billion,\" debt-supported by Pemberton; the prior backer **ECI Partners exited at a 6.1x money multiple and 47% IRR** (co-investor Pantheon reports 5.9x / 49% on its slice). On the standard PE clock, a 2022 buyout implies an **exit or recapitalisation window of roughly 2026–2028** — MiQ is now squarely in it. The whole equity story rests on one bet: that **Sigma (a $100M+-plus AI-platform investment) shifts MiQ from selling labor toward selling software**, lifting margins toward platform economics before the next owner buys in. As of mid-2026 that shift is announced and partially live (Dentsu integration), but **Sigma is not yet a separately-priced SaaS line in any disclosed figure — the margin transition is a thesis, not yet a result.**\n\n---\n\n## 1. How MiQ Actually Makes Money: The Revenue Model\n\n**Answer first:** MiQ is paid primarily as a **managed-service media partner — it takes a fee on top of the advertising money it spends on a client's behalf, plus a data/tech charge, and sometimes a performance margin.** It is *not*, today, primarily a software-licensing (SaaS) business. Sigma is meant to change that mix, but as of mid-2026 no disclosed, separately-priced Sigma license line appears in any public revenue figure. Everything that follows about margin and the equity story flows from one structural fact: MiQ's economics are services economics, and services economics cap margins well below software.\n\n### 1.1 The fee structure MiQ describes\n\nIn a 2023 interview, MiQ leadership described **two fee models** running side by side [1]:\n\n- A **fixed-fee model**: MiQ charges for its services and data *on top of* the media it buys for the client.\n- A **performance / CPM model**: MiQ sells on a cost-per-thousand-impressions basis against agreed performance goals, and keeps a margin when it beats them.\n\nMiQ has been explicit — and somewhat defensive — that this is **not media arbitrage**: in the same interview the company rebutted the suggestion that it secretly marks up media and pockets the spread, insisting the client sees the media cost and pays a transparent fee on top [1]. This tells you where the take rate sits: MiQ's *own* revenue is the **fee layer**, not the gross media billings. A client who runs $10M of media through MiQ does not generate $10M of MiQ revenue; MiQ books its fee on top (and/or its performance margin). This is why MiQ's net revenue is a fraction of the ad money it touches — and why group revenue figures and \"gross billings\" figures must never be confused (see Section 3).\n\n> **Confidence:** medium-high on the *structure* (the two-model description is on the record from MiQ leadership, Tier 5 trade press). **Low** on any specific take-rate percentage — MiQ does not disclose its blended fee, and I found no audited figure for it.\n\n### 1.2 What a managed-service take rate looks like in this market\n\nMiQ does not publish its take rate. As an **order-of-magnitude benchmark only**, industry guidance puts managed-service/agency fees in the **~10%–15%-of-media-spend** range, and DSP platform fees (e.g., The Trade Desk's default) around **15%–20%** [2]. These are **generic market benchmarks, not MiQ figures** — cite them only as the rough envelope MiQ's blended fee plausibly sits inside, not as a measured MiQ number.\n\nSanity-check this against MiQ's own disclosed economics. If 2021 group revenue was ~$465M [3] and that revenue is the *fee layer* on top of media, then the **gross media billings flowing through MiQ are some multiple of $465M** — MiQ likely intermediates several billion dollars of media to net ~$465M of revenue. The exact multiple is unknown because the blended take rate is undisclosed; a ~10%–15% fee would imply roughly $3B–$4.6B of gross billings, but **this is an inference, explicitly flagged, not a sourced figure.**\n\n> **Confidence:** the 10%–20% market benchmark is medium (Tie
