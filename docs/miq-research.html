gent's actions; the agent operates within predefined constraints and parameters rather than with open-ended autonomy.\n\nThe field's own analysts insist on one distinction. **AI-powered advertising automates execution *within* a single platform** — Meta Advantage+, Google Performance Max, a DSP's bidding algorithm — and has existed for years. **Agentic advertising automates strategy *and* execution *across* platforms.** By that strict definition, several industry analysts argued in early 2026 that *no fully agentic cross-platform advertising solution yet exists in market*: everything live is partial, bounded, and human-supervised [16]. Read every MiQ claim below against that backdrop.\n\n**Claim 12.1 — established (definitional).** Agentic advertising, as the term is used in the 2025–2026 ad-tech trade press, denotes autonomous AI agents that plan and execute media-buying tasks *across* platforms toward a stated goal, distinct from intra-platform AI automation (Advantage+, Performance Max) which predates it. *Stakes: standard. Single-source: no — corroborated across eMarketer, TensorOps field guide, and trade coverage [15][16].*\n\n---\n\n## 2. The MiQ Sigma Trading Agent: What It Actually Is\n\nMiQ Sigma launched June 4, 2025 as an **orchestration layer above the DSPs MiQ already buys through** — The Trade Desk, Google DV360, Amazon — not as a DSP itself (this is established in corpus doc 02). Inside Sigma sit a unified data spine, a generative-AI persona builder, a **Planning Agent** (added by June 2026), and the **Trading Agent** — the agentic execution layer that is the subject of this document.\n\n**What the Trading Agent is, on consistent sourcing:** a conversational interface that lets a MiQ trader make optimization changes *across multiple DSPs at once* through natural-language prompts, instead of logging into each platform separately. MiQ states it is **trained on three things**: (1) the reasoning ability of three leading LLMs — Claude (Anthropic), Gemini (Google), ChatGPT (OpenAI); (2) monthly data from **~6,000 programmatic campaigns**; and (3) **15 years of MiQ trading data plus \"rich, tacit trader knowledge\"** [1][2][6]. The multi-model design is deliberate. Rather than bet on one foundation model, the agent draws on all three.\n\n**Claim 12.2 — established (vendor-stated architecture).** The MiQ Sigma Trading Agent is a natural-language conversational layer that executes optimizations across multiple DSPs, trained on the reasoning of three LLMs (Claude, Gemini, ChatGPT), monthly data from ~6,000 programmatic campaigns, and 15 years of MiQ trading data / tacit trader knowledge. *Stakes: load-bearing. Single-source: no — the three-LLM + 6,000-campaign + tacit-knowledge formulation appears in MiQ's June 2026 release and is independently restated by PPC Land and B&T [2][6][3]; treat as vendor claim cross-referenced, not independently audited.*\n\n**The genuinely differentiated asset.** The LLMs are *not* the moat — any competitor can license Claude, Gemini, or ChatGPT. The differentiator is the **proprietary 15-year trading corpus and the ~6,000-campaign monthly flow the models are conditioned on.** A competitor cannot trivially replicate this, because it is MiQ's accumulated buying history, not a purchasable model. It is also narrow. It captures *how MiQ has traded* — valuable for conditioning an execution agent, but not a platform, an identity graph, or an inventory pool.\n\n**The role of humans.** MiQ is explicit that the Trading Agent **augments traders rather than replacing them.** A MiQ sales lead framed it: \"Our people are still at the forefront. The tech is a tool. The expertise is what drives the outcomes.\" Sigma is positioned as a **managed-service partner, not a self-service platform** [3], and the year-two framing deliberately keeps \"rich, tacit trader knowledge\" in the loop [2]. That is both an honest description of the current capability *and* a tell about the strategic tension in Section 7: the human-in-the-loop framing protects the managed-service margin that pure agentic automation would threaten.\n\n---\n\n## 3. The Headline Speed Claim: 6 Hours → 30 Seconds (Self-Reported)\n\nThe single most-quoted MiQ agentic metric is that **generating a global audience profile/persona** — what \"used to take around 6 hours\" — **\"now takes just 30 seconds\"** via Sigma's Gen AI Personas feature [3][7]. *(An earlier draft framed this as cross-DSP/SSP audience activation; the source ties it specifically to audience-profile generation — see the verification note above.)*\n\nThe claim needs four precise flags:\n\n- It is **self-reported by MiQ.** In the B&T trade write-up, the \"what used to take six hours now takes 30 seconds\" line is **attributed to Vishal Shah, MiQ's Head of Products and Analytics** (verified directly against the source), describing **generating data-driven audience profiles/personas via Sigma's Gen AI Personas feature** — not an independently measured benchmark, and not cross-DSP activation [3].\n- It carries **no disclosed methodology**: no definition of the baseline 6-hour task, no sample, no control, no auditor.\n- It is **single-source** in substance (MiQ). The figure appears across multiple trade outlets, but those outlets restate MiQ's number rather than measure it.\n- Adjacent MiQ performance claims carry the same caveat: a **132% conversion-rate lift** and **57% cost-per-action reduction** from \"early testing,\" and **$2.22 in value per $1 spent** versus standard programmatic — all self-reported, no disclosed methodology (established in corpus doc 02) [2].\n\n**Claim 12.3 — contested (self-reported metric).** MiQ states that generating a global audience profile/persona via Sigma's Gen AI Personas feature dropped from ~6 hours to ~30 seconds. This is a self-reported, single-source vendor claim **attributed to Vishal Shah, Head of Products and Analytics** (verified against the source), with no disclosed methodology, sample, or independent verification, and should not be treated as established fact. **Verification note:** an earlier draft mis-attributed the line to a sales lead and mis-framed it as cross-DSP/SSP audience activation; both were corrected against the primary source. *Stakes: load-bearing. Single-source: yes (MiQ).*\n\nThe honest read: a ~6hr→30s collapse for a *narrow, repetitive task* — generating a data-driven audience profile/persona that traditionally meant hours of manual research — is **directionally plausible.** Compressing manual research-and-setup work is exactly what these LLM-driven agents are good at, and Yahoo, The Trade Desk, and Butler/Till report similar order-of-magnitude setup-time reductions on adjacent tasks (Butler/Till's AgenticOS test claimed an **87% setup-time reduction** [9]). What is *not* established is that the speed translates into better outcomes, or that the \"30 seconds\" is a like-for-like measurement rather than a best-case demo. Setup speed is cheap to claim and easy to demo. **Incremental performance** is the metric that matters, and the one MiQ has not independently substantiated.\n\n---\n\n## 4. The PubMatic AgenticOS Integration (Live, Q1 2026)\n\nThe most concrete evidence that MiQ's agentic bet is more than a slide is its participation in **PubMatic AgenticOS.**\n\n**What AgenticOS is.** PubMatic launched AgenticOS on **January 5, 2026** (announced at/around CES 2026), describing it as the industry's first operating system built for **agent-to-agent advertising** [4][8][13]. PubMatic describes three layers: an NVIDIA-accelerated infrastructure layer processing tens of millions of auctions per second; an application layer of coordinated agents (planning, forecasting, pacing, yield management, troubleshooting, measurement); and a transaction layer connecting to PubMatic's Activate buying platform [8]. It interprets advertiser intent through **two protocols, AdCP and MCP**, with natural-language campaign guidance delivered via Anthropic's **Claude** [8].\n\n**MiQ's role.** MiQ is named as an **early participant testing agent-led workflows**, alongside WPP Media (via its Open Intelligence framework), Butler/Till, Wpromote, Brkthru, Foxtel Media, and others, with in-market deployments running **throughout Q1 2026** [4][8][9]. Its specific integration **connects the MiQ Sigma Trading Agent to AgenticOS so the agent reaches more PubMatic inventory and audience packages** — extending MiQ's buy-side agent onto a major SSP's supply-side agentic surface. Goulding's framing: \"By integrating MiQ Sigma with PubMatic's AgenticOS, we'll show how ecosystems… will define the next era of programmatic buying\" [8].\n\n**Human-in-the-loop, as PubMatic frames it.** Advertisers define objectives and constraints in their preferred LLM interface; PubMatic's agents then execute *within predefined parameters,* with humans retaining strategy, creative, and measurement [8]. This is bounded autonomy, not open-ended agents spending freely.\n\n**Claim 12.4 — established (going-concern, dated).** As of January 2026, MiQ is a named early participant in PubMatic AgenticOS (launched January 5, 2026), integrating the MiQ Sigma Trading Agent with PubMatic's supply-side agentic OS to test agent-led workflows on live campaigns through Q1 2026. *Stakes: load-bearing. Single-source: no — corroborated by PubMatic's release, PPC Land, MediaPost, and MiQ's own materials [4][8][13][2]. Status confirmed within the research window; flag that \"through Q1 2026\" is a stated test window, and post-Q1-2026 production status is not independently confirmed as of 2026-06-20.*\n\n**Claim 12.5 — established (going-concern, dated).** PubMatic launched the **Agentic AI Acceleration Program** alongside AgenticOS (January 2026), a limited-capacity initiative to move advertisers/agencies/publishers from early testing to live agentic workflows \"within weeks\" during Q1 2026. *Stakes: standard. Single-source: yes effectively (PubMatic), framed as a vendor program. [8]*\n\n---\n\n## 5. The Wider Agentic Footprint: Yahoo DSP and Magnite\n\nMiQ is not betting on one SSP. It has positioned the Trading Agent as a **buyer agent that plugs into multiple independent supply-side and DSP agentic surfaces at once** — arguably the most strategically coherent part of its play.\n\n**Yahoo DSP (January 2026).** At CES 2026 Yahoo DSP embedded \"Agentic AI\" as an intelligence layer across planning, activation, optimization, and measurement, with agents that learn, diagnose, recommend, and — **with user approval** — execute changes [12][14]. Yahoo's **\"Yours, Mine, and Ours\" framework** lets advertisers bring their own AI models, use Yahoo's native agents, or connect both via **MCP or APIs** [14]. **MiQ is named among Yahoo DSP's early integration partners** [2][7], so MiQ's Trading Agent can connect *into* Yahoo's open, MCP-based agentic surface. Yahoo's own DSP product lead, Adam Roodman, put the shift bluntly: agentic AI moves DSP competition \"away from the UI and towards performance\" [reported in VideoWeek, Feb 2026]. Taken seriously, that thesis *erodes the value of a desk whose differentiation has partly been UI fluency across platforms.*\n\n**Magnite buyer agent (April 2026).** On April 27, 2026, Magnite announced its first proprietary **buyer agent**, entering early tests with **Kepler and MiQ using Disney Advertising inventory** [5]. This is a different shape: rather than MiQ's agent calling into an SSP's OS, Magnite is building an agent on the *sell side* to transact with buy-side agents — and MiQ is a launch test partner. (Note: the Magnite coverage does not explicitly name \"MiQ Sigma\" or \"AdCP\" — it names MiQ as a buyer-agent test partner; treat the Sigma-specific linkage as inferred from MiQ's broader agentic posture, not stated [5].)\n\n**Claim 12.6 — established (going-concern, dated).** As of January 2026 MiQ is an early integration partner of Yahoo DSP's embedded agentic AI (which connects external agents via MCP/APIs under Yahoo's \"Yours, Mine, and Ours\" framework), and as of April 27, 2026 MiQ is a buyer-agent test partner in Magnite's first proprietary buyer agent using Disney inventory. *Stakes: load-bearing. Single-source: partially — Yahoo partnership via MiQ/PPC Land [2][7]; Magnite test via PPC Land [5]. Each is single-trade-source for the MiQ-specific linkage; flag accordingly.*\n\n**Why this multi-surface posture matters.** MiQ is positioning to be **one of the few buy-side players testing agentic buying across multiple independent SSP/DSP surfaces at once** (PubMatic, Yahoo, Magnite). If agent-to-agent buying fragments across competing supply-side OSes, a neutral buyer that connects to all of them has real value. If instead one supply-side OS, or one DSP's agents, wins and internalizes the buy-side relationship, MiQ's connector position weakens. That is the strategic crux of Section 7.\n\n---\n\n## 6. The Protocol Layer: AdCP, MCP, and Who Controls the Pipes\n\nAgentic advertising only scales if buy-side and sell-side agents can talk. That is the protocol layer, and it is contested.\n\n- **MCP** (Anthropic-originated) is the generic model-to-tools standard; it is the substrate.\n- **AdCP** is the advertising-specific standard built on MCP, launched **October 15, 2025** by a **supply-led coalition** — Yahoo, PubMatic, Scope3, Optable, Swivel, Triton Digital — with modules for Signals Activation, Media Buy, and Creative [10][11]. Governance sits with a neutral working group (later AgenticAdvertising.org); the coalition reports **100+ companies joined** within months and claims the **first agent-to-agent media buy on October 16, 2025** [11]. The spec and a reference implementation are public on GitHub [11].\n\n**The critical framing: whoever controls the protocol controls the toll booth.** The Digiday standards debate (January 26, 2026) is the most important skeptical source here, and it features MiQ directly. Critics warn that AdCP and rival protocols may **\"shift — rather than dismantle — existing power dynamics.\"** MINT's Louisa Wong: \"AdCP standardizes agent communication, but someone still needs to standardize the *processes* those agents execute\" — and \"the ecosystem isn't ready for the level of transparency this actually requires.\" Ozone's Craig Tuck names **decreasing transparency and control** as the biggest risk and warns against treating agentic buying as \"set and forget.\" IAB Tech Lab's Anthony Katsur warns that multiple competing protocol groups breed \"confusion, wasted engineering effort, and inconsistent implementations that never fully scale\" [9-standards].\n\n**MiQ's own admission, on the record.** In that same Digiday piece, **John Goulding said MiQ's live tests of protocol-enabled direct media buys are \"in the five-figure territory\"** — exploring whether standardization unlocks direct buys that were previously \"too operationally clunky\" [9-standards]. This is the single most important calibration in the document. MiQ's *announced* plan to \"start scaling agentic ad buying\" in 2026 sits on top of *current* live spend that, by its own strategy chief's account, runs in the tens of thousands of dollars. **The capability is real and live; the scale is nascent.**\n\n**Claim 12.7 — established (load-bearing calibration, dated).** As of late January 2026, MiQ's Global Chief Strategy Officer John Goulding characterized MiQ's live agentic/protocol-enabled direct-media-buy tests as \"in the five-figure territory\" — i.e., nascent — even as MiQ publicly states a 2026 plan to \"start scaling agentic ad buying.\" The scaling is therefore announced-not-shipped. *Stakes: load-bearing. Single-source: yes (Goulding via Digiday, Jan 26 2026). [9-standards]*\n\n**Claim 12.8 — established (dated, contextual).** AdCP launched October 15, 2025 as a supply-led open standard built on MCP, with 100+ companies joining within months; PubMatic (a co-founder) embeds AdCP and MCP in AgenticOS, the surface MiQ's Trading Agent integrates with. *Stakes: standard. Single-source: no — multiple trade outlets and the AdCP project [10][11].*\n\nA structural observation MiQ's marketing elides: **the protocol and the dominant supply-side OS were authored by PubMatic and Yahoo — MiQ's *partners,* who are also positioned to be its agentic *landlords.*** MiQ is building its agent to run on standards and an OS it does not control. That is fine while the relationship is collaborative. It becomes a dependency the moment the supply side decides to disintermediate the desk.\n\n---\n\n## 7. Competitive Positioning: Moat or Defensive Necessity?\n\nThis is the analytical core. The brief asks the sharp question directly: a managed-service trading desk has the most to lose if agents commoditize trading — so is MiQ's Trading Agent a real moat or a defensive necessity?\n\n**The structural exposure.** Even with Sigma, MiQ's economics remain a **managed service**: traders operating *other companies'* DSPs for a margin (established in corpus doc 02, doc 07). The act the Trading Agent automates — cross-platform optimization — is **exactly the labor MiQ has sold for fifteen years.** If agents make that labor near-free and self-service, the managed-service margin is the thing most directly at risk. So the Trading Agent is, first and most honestly, a **defensive necessity.** MiQ has to build the agent that automates its own core service before someone else's agent does it for free, or the desk's value proposition erodes. The human-in-the-loop framing (\"our people are still at the forefront\") is partly genuine and partly a **margin-protective narrative** — it keeps the trader, and the markup, in the loop.\n\n**Where there is a genuine, if narrow, moat.** Two assets are not trivially replicable:\n1. **The 15-year proprietary trading corpus + ~6,000-campaign monthly flow** conditioning the agent. Competitors can license the same LLMs; they cannot license MiQ's trading history.\n2. **The neutral, multi-surface orchestration position.** MiQ buys across The Trade Desk, DV360, Amazon, and now connects its agent into PubMatic, Yahoo, and Magnite's agentic surfaces. A buyer agent that is *not* owned by any one DSP or SSP can, in principle, optimize across all of them — the one thing a walled-garden or single-DSP agent structurally cannot do.\n\n**Now position against each rival:**\n\n| Competitor | Agentic instrument (as of mid-2026) | Position vs. MiQ | Status flag |\n|---|---|---|---|\n| **PubMatic AgenticOS** | Supply-side OS; co-author of AdCP; agents for planning→measurement; Claude/MCP/AdCP native | MiQ's *partner and landlord*. PubMatic owns the supply-side surface MiQ's agent plugs into. Risk: PubMatic could court buyers directly. | Live, Q1 2026 [8] |\n| **Yahoo DSP agents** | Native buy-side agents embedded in the DSP; \"Yours, Mine, Ours\" (BYO model via MCP) | Both partner and rival. MiQ integrates *into* Yahoo; but Yahoo's agents could serve advertisers directly, disintermediating the desk. Roodman: competition moves \"to performance, not UI.\" | Live, Jan 2026 [12][14] |\n| **The Trade Desk (Koa Agents)** | Agents inside the dominant independent DSP; Stagwell first holdco adopter (Apr 2026) | TTD is a DSP MiQ *buys through.* If TTD's agents serve agencies directly, MiQ's reseller layer is squeezed. But TTD's agents (as of mid-2026) speed *setup,* not autonomous buying — same bounded state as MiQ. | Alpha/early, Apr 2026 [TTD/Digiday] |\n| **Walled gardens (Google PMax, Meta Advantage+, Amazon)** | Intra-platform AI automation; ~25% (Meta) / ~12% (Google) of ad revenue | Largely *outside* MiQ's agentic reach. They optimize *within* walls; a Meta agent can't see Google. MiQ's cross-platform neutrality is the counter-positioning — but the gardens hold the budget. | Live, ongoing [15][16] |\n\n**Claim 12.9 — inference (load-bearing analytical).** MiQ's Trading Agent is best read as a defensive necessity with a narrow embedded moat: defensive because it automates the very managed-service labor MiQ sells (and which agents threaten to commoditize), moated only insofar as (a) the conditioning corpus is proprietary and (b) MiQ's cross-DSP/SSP orchestration is structurally neutral in a way single-platform agents are not. *Stakes: load-bearing. Single-source: n/a (inference synthesized from doc 02/07 economics + competitive sourcing [2][8][12][16]).*\n\n**The decisive uncertainty.** Whether MiQ wins depends on **where the agent-to-agent relationship settles.** If buy-side and sell-side agents transact through *open* protocols (AdCP/MCP) across *many* surfaces, a neutral cross-platform buyer is valuable and MiQ is well-placed. If instead the supply side (PubMatic) or a dominant DSP (TTD, Yahoo) captures the buy-side agent relationship and routes around the desk, MiQ becomes a commoditized connector. Joining *all* the major agentic surfaces rather than betting on one is MiQ's rational response to that uncertainty. But a hedge is not a winning hand.\n\n---\n\n## 8. Separating Capability from Marketing Claim\n\nA disciplined ledger, because the brief demands it.\n\n**What is genuinely real and live (as of mid-2026):**\n- The Trading Agent exists, runs in production, and is conditioned on a proprietary trading corpus — the differentiated asset [2].\n- MiQ is a *named, dated* early participant in PubMatic AgenticOS, Yahoo DSP agents, and Magnite's buyer agent [4][5][8][12].\n- The protocol layer (AdCP/MCP) is real, launched, and adopted by 100+ companies [10][11].\n- The direction of travel — plan→activate→measure as an agentic workflow — is consistent across MiQ and every major rival [2][8][12].\n\n**What is marketing or unverified:**\n- The **6hr→30s** speed claim (audience-persona generation via Gen AI Personas, per Vishal Shah, Head of Products and Analytics): self-reported, single-source, no methodology [3].\n- The **132% conversion lift / 57% CPA reduction / $2.22-per-$1** outcome claims: self-reported, \"early testing,\" no control [2].\n- \"Industry's first AI platform that unifies the programmatic ecosystem\": marketing framing; PubMatic claims a parallel \"first\" for the agentic OS [8].\n- The 2026 **\"start scaling agentic ad buying\"** plan: forward-looking, and undercut by Goulding's own \"five-figure territory\" admission [2][9-standards].\n\n**What is announced-not-shipped:**\n- MiQ scaling agentic ad buying *in 2026* — stated intent, nascent execution [2][9-standards].\n- PubMatic/Yahoo/Magnite \"through Q1 2026\" deployments — test windows whose post-window production status is not independently confirmed as of 2026-06-20.\n\n**Claim 12.10 — contested (load-bearing honesty).** The genuine, verifiable substance of MiQ's agentic bet is the *existence* of the Trading Agent, its proprietary conditioning corpus, and dated multi-surface integration partnerships; every *quantified performance and speed claim* is self-reported and unverified, and the \"scaling in 2026\" plan is announced-not-shipped by the strategy chief's own account. *Stakes: load-bearing. Single-source: no — synthesis of [2][3][9-standards].*\n\n---\n\n## 9. Risks and Regulatory Shadow\n\n**Transparency and control.** The strongest external critique (Digiday, Jan 2026): agentic buying can *decrease* transparency. Agents transacting machine-to-machine inside protocols obscure where money goes, in an industry already plagued by opaque supply chains [9-standards]. For a managed-service desk whose margin is partly the spread between what the client pays and what the media costs, *more* agentic automation could expose *or* further obscure that spread, depending on who controls the agent. MiQ has not publicly addressed the transparency question for its own agent.\n\n**Signal loss.** The agentic layer sits atop a data spine MiQ describes as 600+ feeds / 2.5PB daily (doc 02). The same privacy and signal-loss pressures bearing on all of programmatic (cookie deprecation aftermath, identity fragmentation — see corpus identity docs) bear on the *quality of the audiences the Trading Agent activates.* A faster agent activating a degrading signal is not an unambiguous win.\n\n**Protocol governance and dependency.** MiQ's agent runs on standards (AdCP/MCP) and a supply-side OS (PubMatic's) it does not control. Governance disputes, protocol fragmentation (Katsur's warning), or a partner's strategic shift toward disintermediation are live risks to the connector position [9-standards][10].\n\n**Verification of agent actions.** The adjacent agentic-advertising-protocols corpus (doc 09 there) flags a problem the trade is only beginning to address: *how do you verify what an autonomous agent actually bought, and measure it?* MiQ's \"Total Measurement\" claim (doc 02) is the company's answer, but agent-action auditing across third-party surfaces remains genuinely unsettled in 2026.\n\n**Claim 12.11 — established (contextual, dated).** As of early 2026, industry critics (Digiday, Jan 26 2026) identify decreased transparency/control, premature transparency demands, and protocol fragmentation as the principal risks of agentic buying — risks MiQ's public agentic materials do not directly address. *Stakes: standard. Single-source: no — multiple named critics in one piece [9-standards], consistent with IAB framing.*\n\n---\n\n## 10. Synthesis for the Corpus\n\nMiQ entered the agentic era **early, neutrally positioned, and well-marketed** — and with structurally the most to lose. Its Trading Agent is a competent, production, conversational execution agent whose one durable asset is the proprietary trading corpus it is conditioned on, wrapped in a multi-surface orchestration strategy (PubMatic, Yahoo, Magnite) that is the correct hedge for an uncertain agent-to-agent future. The agent is, first, a **defensive necessity** — MiQ automating its own core service before the market commoditizes it — with a **narrow but real moat** inside it.\n\nThe honest going-concern caveats are large. The marquee speed and performance numbers are self-reported and unverified. The \"scaling agentic ad buying in 2026\" plan is announced-not-shipped, sitting atop live tests Goulding himself sizes in the \"five-figure territory.\" And MiQ's agent depends on protocols and a supply-side OS authored by partners who could become disintermediators. Through 2029, MiQ's agentic bet is **positionally sound and quantitatively unproven** — a credible seat at the table whose payoff depends on the open, cross-platform version of agent-to-agent advertising winning over the single-platform version. The market has not yet resolved that question.\n\n---\n\n## Open Questions\n\n1. **Is the 6hr→30s claim like-for-like?** No methodology has been disclosed. What was the 6-hour baseline task, and is the 30-second figure a measured median or a best-case demo?\n2. **What is MiQ's agentic spend actually doing by H2 2026?** Goulding sized live tests at \"five-figure territory\" in Jan 2026. Has the \"scaling in 2026\" plan materialized into meaningful spend, and is there *independent* outcome data (not self-reported lifts)?\n3. **Does PubMatic/Yahoo/Magnite court MiQ's clients directly?** The partner-or-landlord ambiguity is unresolved. Do the supply-side OSes build buy-side agent relationships that disintermediate the desk?\n4. **Which protocol wins, and who governs it?** AdCP vs. competing/IAB efforts (AAMP), and whether MiQ's connector value survives fragmentation or consolidation.\n5. **How is an autonomous agent's buying audited and measured across third-party surfaces?** Unsolved as of 2026; MiQ's \"Total Measurement\" is asserted, not externally validated.\n6. **Does agentic automation widen or compress MiQ's managed-service margin?** Faster traders (doing \"twice as many optimizations\") could lift performance and justify the fee, or accelerate the commoditization of the trading function itself.\n7. **Post-Q1-2026 production status** of the PubMatic, Yahoo, and Magnite integrations — all sourced as test windows; none independently confirmed as scaled production as of 2026-06-20.\n\n---\n\n## Sources\n\n1. MiQ, \"MiQ Sigma\" product page and launch coverage (Trading Agent; three LLMs — Claude, Gemini, ChatGPT; natural-language multi-DSP optimization). https://www.wearemiq.com/us/sigma — Accessed 2026-06-20. *Tier 1 (vendor materials — claims, not independently verified fact).*\n2. MiQ, \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate,\" Business Wire, June 11, 2026. https://www.businesswire.com/news/home/20260611682662/en/MiQ-Sigma-Expands-with-New-Data-Capabilities-and-Ways-to-Activate — Accessed 2026-06-20. *Tier 1 (vendor release — claims). One-year update: Trading Agent trained on three LLMs + monthly data from 6,000 programmatic campaigns + tacit trader knowledge; Planning Agent; Total Measurement; $2.22/$1; PubMatic AgenticOS + Yahoo DSP early-partner statements.*\n3. \"MiQ Sigma: The Brain Behind Programmatic's Next Evolution,\" B&T (Australia), 2026. https://www.bandt.com.au/miq-sigma/ — Accessed 2026-06-20. *Tier 5 (trade). Source of the \"six hours → 30 seconds\" line, attributed to **Vishal Shah, MiQ Head of Products and Analytics**, describing audience-profile/persona generation via Gen AI Personas (verified against source); \"our people are still at the forefront\" managed-service framing.*\n4. \"PubMatic launches agentic advertising OS with live campaigns running,\" PPC Land, January 2026. https://ppc.land/pubmatic-launches-agentic-advertising-os-with-live-campaigns-running/ — Accessed 2026-06-20. *Tier 5 (trade). AgenticOS architecture; AdCP+MCP; early participants incl. MiQ, WPP Media, Butler/Till; Claude; predefined-parameters / human-in-the-loop framing; Agentic AI Acceleration Program; Jan 5 2026 launch; Q1 2026 deployment.*\n5. \"Magnite expands AI buyer agent and SpringServe mediation with Disney and MiQ,\" PPC Land, April 27, 2026. https://ppc.land/magnite-expands-ai-buyer-agent-and-springserve-mediation-with-disney-and-miq/ — Accessed 2026-06-20. *Tier 5 (trade). Magnite's first proprietary buyer agent; early tests with Kepler and MiQ using Disney Advertising inventory. Does not name \"MiQ Sigma\" or \"AdCP\" specifically.*\n6. \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" PPC Land, June 2026. https://ppc.land/miq-upgrades-sigma-a-year-in-planning-agent-and-2-5pb-of-daily-data/ — Accessed 2026-06-20. *Tier 5 (trade). Trading Agent (real-time decisioning) vs Planning Agent (upstream); \"twice as many optimizations\"; PubMatic AgenticOS, Yahoo DSP, Magnite SpringServe January 2026 integrations; human retains strategic direction.*\n7. MiQ, \"MiQ Sigma breaks the fragmentation cycle,\" wearemiq.com news. https://www.wearemiq.com/resources/news/miq-sigma-breaks-the-fragmentation-cycle — Accessed 2026-06-20. *Tier 1 (vendor). Restates 6hr→30s and the January 2026 PubMatic/Yahoo integrations.*\n8. PubMatic, \"PubMatic Launches AgenticOS, the Operating System for Agent-to-Agent Advertising,\" Business Wire / pubmaticinc.gcs-web.com, January 5, 2026. https://www.businesswire.com/news/home/20260105060287/en/ — Accessed 2026-06-20. *Tier 1 (vendor release — claims). Three-layer architecture; AdCP+MCP; Claude; early participants incl. MiQ (Goulding quote); WPP Media, Butler/Till; Agentic AI Acceleration Program; predefined-parameters human-in-the-loop.*\n9. \"Inside the debate over agentic advertising and standards,\" Digiday, January 26, 2026. https://digiday.com/media-buying/inside-the-debate-over-agentic-advertising-and-standards/ — Accessed 2026-06-20. *Tier 4–5 (trade, analytical). CRITICAL framing: Goulding's \"five-figure territory\" admission; transparency/control risks (Wong/MINT, Tuck/Ozone); protocol-fragmentation warning (Katsur/IAB Tech Lab). Cited above as [9-standards].*\n   (Note: Butler/Till 87% setup-time-reduction figure cited above is from PubMatic's AgenticOS materials [4][8], vendor-stated.)\n10. \"Industry Coalition Launches Ad Context Protocol (AdCP),\" Samba TV press release / MediaPost coverage, October 15–16, 2025. https://www.samba.tv/press-releases/industry-coalition-launches-ad-context-protocol-adcp-open-standard-for-agentic-advertising-infrastructure — Accessed 2026-06-20. *Tier 1/Tier 5. AdCP launch (Yahoo, PubMatic, Scope3, Optable, Swivel, Triton Digital); built on MCP; Signals/Media Buy/Creative modules.*\n11. \"Yahoo, PubMatic, Others Form Coalition To Launch Agentic Ad Protocol,\" MediaPost, Oct 16, 2025; AdCP project, adcontextprotocol.org and github.com/adcontextprotocol/adcp. — Accessed 2026-06-20. *Tier 1 (spec) / Tier 5 (trade). 100+ companies joined; first agent-to-agent media buy Oct 16 2025; public spec + reference implementation; neutral working-group governance.*\n12. \"Yahoo DSP embeds AI agents that actually run campaigns today,\" PPC Land, January 2026. https://ppc.land/yahoo-dsp-embeds-ai-agents-that-actually-run-campaigns-today/ — Accessed 2026-06-20. *Tier 5 (trade). Yahoo DSP agentic AI across plan/activate/optimize/measure; with-user-approval execution; MiQ among early integration partners.*\n13. \"CES 2026: PubMatic launches AgenticOS for autonomous ad campaign execution,\" NewscastStudio, January 6, 2026. https://www.newscaststudio.com/2026/01/06/ces-2026-pubmatic-launches-agenticos-for-autonomous-ad-campaign-execution/ — Accessed 2026-06-20. *Tier 5 (trade). Independent corroboration of AgenticOS launch and CES timing.*\n14. Yahoo Inc., \"Yahoo DSP Advances Its Buying Platform With New Agentic AI Capabilities,\" yahooinc.com press, January 2026. https://www.yahooinc.com/press/yahoo-dsp-advances-its-buying-platform-with-new-agentic-ai-capabilities — Accessed 2026-06-20. *Tier 1 (vendor release — claims). \"Yours, Mine, and Ours\" BYO-model framework; MCP/API connectivity; agent areas (insights, traffic, optimization, improvement, measurement).*\n15. eMarketer, \"FAQ on AI media buying: Platform tools, agency strategy, and how to win in 2026.\" https://www.emarketer.com/content/faq-on-ai-media-buying--platform-tools--agency-strategy--how-win-2026 — Accessed 2026-06-20. *Tier 5 (analytical). Walled-garden intra-platform automation vs cross-platform agentic distinction; IAB 2026 Outlook adoption data.*\n16. TensorOps AdTech Lab, \"Agentic AI in Advertising: A 2026 Field Guide.\" https://tensorops.ai/labs/research/agentic-ai-advertising-2026-field-guide — Accessed 2026-06-20. *Tier 5 (analytical, vendor-adjacent — note lean). Deflationary definition: intra-platform automation ≠ agentic; \"no fully agentic cross-platform solution exists\" framing; walled-garden visibility limits.*\n17. The Trade Desk Koa Agents coverage: \"Stagwell plans to pilot The Trade Desk's new agentic capabilities,\" The Current; \"Inside The Trade Desk's Claude-powered campaign agent,\" Digiday (Apr 2026). — Accessed 2026-06-20. *Tier 4–5 (trade). Koa Agents alpha; Stagwell first holdco adopter (Apr 2026); agents speed setup, do NOT yet make autonomous buys — bounded-autonomy state comparable to MiQ.*"}, {"order": 13, "file": "13_Gap_TitanOS_Going_Concern.md", "title": "Is the Door Still Open? Titan OS as a Going Concern and the State of MiQ's Only EU-OS Data Deal", "summary": "", "body": "# Is the Door Still Open? Titan OS as a Going Concern and the State of MiQ's Only EU-OS Data Deal\n\n## Bottom Line\n\nTitan OS is not only still a going concern — on the evidence through mid-2026, it is one of the fastest-rising independent smart-TV operating systems in Europe. The single-point-of-failure risk the corpus flagged has, if anything, *receded* since the November 2025 MiQ announcement. In the seven months after the deal, Titan OS raised a €50M ($58M) Series A led by Highland Europe (Dec 2025), won Philips's entire 2026 television lineup away from Google TV (announced Mar 2026), and was named by Omdia as one of three emerging OSes forecast to take ~28-30% of the European TV-OS market by 2030. The company remains independent, Barcelona-based, and founder-led (Jacinto Roca). In 2026 it is raising again — not being acquired or wound down.\n\nThe partnership with MiQ is still live, still framed in the same language, and still on track: as of the most recent restatements, MiQ is described as \"the first to license Titan OS log-level data\" and \"the only managed service partner with direct access to Titan OS data across Europe,\" with Sigma integration timed for Q1 2026. The footprint figure has *grown* — the Nov 2025 deal cited \"over 20 million connected TVs\" (Titan OS + Samba TV combined for MiQ); Titan OS's own 2026 reach is now stated as \"over 30 million streaming households across Europe.\"\n\nOne real qualification remains — a scoping point, not a contradiction. MiQ's exclusivity is narrower than a naive reading of \"EU-OS data door\" implies. It covers *log-level / OS-level data licensed to a managed-service provider*. It does **not** lock up Titan OS's ad *inventory* or its *first-party audience segments*, which Titan now sells programmatically through Equativ (home-screen video, May 2026), monetises across TiVo OS via its own Titan Ads arm (Oct 2025), and is opening to multiple buying routes. MiQ's moat is the privileged *data* relationship, not sole commercial access to the surface. Wherever docs 04, 08, and 09 lean on this asset, that distinction should be explicit.\n\n---\n\n## Why This Gap Mattered\n\nAcross docs 04 (ATV / TV Intelligence), 08 (geographic & M&A expansion), and 09 (regulatory / data moat), and on the gap list, the corpus treats the MiQ–Titan OS partnership as a load-bearing, currently-live asset. It is MiQ's *only* claimed OS-level data door in Europe. The CTV-OS layer is volatile — Vizio was absorbed by Walmart, Tubi sits inside Fox, and OEMs have a documented habit of pulling ACR/OS data in-house — so a partnership announced once in November 2025 and never re-confirmed would be a classic stale single-point-of-failure. The task: pull the most recent primary and trade sources to confirm (a) Titan OS still exists independently, (b) the MiQ relationship is still operative and not superseded, and (c) the footprint figure still holds — and to document any rename, expansion, narrowing, or quiet drop.\n\nThe answer on all three counts is favourable to the corpus, with one scoping correction below.\n\n---\n\n## Key Claims\n\n### Claim 13.1 — Titan OS is alive, independent, and growing as of mid-2026\n\n**Type:** established\n**Stakes:** load-bearing\n**Single source:** no\n\nTitan OS remains an independent, Barcelona-based, founder-led company. In **December 2025 — after the MiQ announcement** — it raised a €50 million (~$58 million) Series A led by Highland Europe, with Mangrove Capital Partners participating, bringing total funding to roughly $70 million [1][2][3]. The company reports ~200 staff across Barcelona, Amsterdam, and Taipei, says it grew revenue \"10x in two years,\" and was founded in 2023 by Jacinto Roca (founder of Wuaki.tv, later sold to Rakuten) [1]. Far from being acquired or wound down, Titan OS is *raising again in 2026* and expanding into Europe and LATAM [1][3]. This directly answers the \"going concern\" question. The company is not a stranded asset — it is a venture in an up-round.\n\n### Claim 13.2 — Titan OS won Philips's entire 2026 lineup from Google TV, sharply increasing its data and inventory scale\n\n**Type:** established\n**Stakes:** load-bearing\n**Single source:** yes (the \"all 2026 models\" specificity rests primarily on PPC Land; the underlying Philips/TP Vision relationship is widely corroborated)\n\nIn **March 2026**, after roughly two years of testing on select models, Philips (via TP Vision) was reported to be dropping Google TV from its entire 2026 television lineup and switching to Titan OS across all models [4]. The reported commercial logic — Philips receives a larger share of ad revenue under Titan OS than under Google TV, and gains more control over user experience and viewer data — matches the revenue-share thesis Omdia identifies as the structural driver of the independent-OS rise [4][6]. For MiQ this is *strengthening*, not threatening. Moving from a portion of the Philips line to the whole line materially increases the first-party viewing-signal and home-screen-inventory base that flows, via the data deal, into TV Intelligence and Sigma.\n\n### Claim 13.3 — The MiQ–Titan OS partnership is still live, still exclusively-framed, and on schedule\n\n**Type:** established\n**Stakes:** load-bearing\n**Single source:** yes (the exclusivity framing originates with the joint announcement and MiQ's own newsroom; no independent source contradicts it, but none independently *audits* the exclusivity either)\n\nThe partnership, announced **18 November 2025**, is restated in identical terms across MiQ's newsroom (US, UK, and French-language pages) and trade coverage, with no sign of rename, narrowing, or withdrawal [5][7][8]. MiQ is described as \"the first to license Titan OS log-level data\" and \"the only managed service partner with direct access to Titan OS data across Europe\" [5][7]. Integration of Titan OS-level intelligence into Sigma is timed for **Q1 2026** [5]. As of mid-2026, no source announces a supersession, a competing managed-service data license, or a pullback. The relationship appears operative and proceeding as announced. (Caveat: this is corporate self-description — Tier 1 for *what is claimed*, not independently verified as to whether the Sigma integration has technically shipped.)\n\n### Claim 13.4 — The footprint figure holds and has grown; \"20M+ CTV\" is conservative as of 2026\n\n**Type:** established\n**Stakes:** standard\n**Single source:** no\n\nThe Nov 2025 deal cited access to signals from \"over 20 million connected TVs in Europe\" — explicitly a *combined* MiQ figure spanning its long-standing Samba TV partnership **plus** the new Titan OS data, not Titan OS alone [5][7]. Separately, Titan OS's own 2026 reach is stated as \"over 30 million streaming households across Europe\" [4][9], against ~4 million monthly active users on its directly-operated base and 18 million MAU cited in late-2025 funding coverage [1][9]. These figures are not in conflict — they measure different things: MiQ's combined signal pool, Titan's own device/household reach, and Titan's directly-operated MAU. The load-bearing \"20M+ CTV\" claim in docs 04/08/09 is current and, if anything, understated relative to Titan's 2026 trajectory. To avoid conflating MiQ's combined pool with Titan's standalone reach, the corpus should footnote *which* number it is citing.\n\n### Claim 13.5 — MiQ's exclusivity is real but layer-scoped: data, not inventory\n\n**Type:** contested (scoping)\n**Stakes:** load-bearing\n**Single source:** no\n\nThis is the one correction the gap surfaces. MiQ's exclusivity is consistently framed as *managed-service access to log-level / OS-level data* [5][7]. It is **not** exclusive access to Titan OS's advertising surface or audience segments:\n\n- In **May 2026**, Equativ and Titan OS launched \"industry-first\" programmatic CTV **home-screen video ads** across Europe and LATAM, letting advertisers buy home-screen inventory programmatically through Equativ's Maestro curation platform and combine it with \"Titan OS' first-party audience data\" [10][11].\n- In **October 2025** (a month *before* the MiQ deal), Titan's own **Titan Ads** arm was named the strategic monetisation / exclusive sales partner for **TiVo OS** inventory across selected European markets, creating a single buying route across both independent OSes [12][13].\n- Titan also runs FAST/home-screen ad businesses with Sony Europe and others [1].\n\nSo the surface is being opened to *multiple* buyers and SSPs, while what MiQ holds is the *log-level data feed to a managed-service buyer*. This is a meaningfully different — and more defensible — claim than \"MiQ controls the only door into Titan OS.\" Docs leaning on \"exclusive EU-OS data door\" should say \"exclusive *managed-service log-level data* access,\" which is what the sources actually support.\n\n### Claim 13.6 — No rival has moved to run the EU independent-OS aggregation itself; the structural tailwind favours the asset\n\n**Type:** established\n**Stakes:** standard\n**Single source:** no\n\nOmdia (April 2026) projects the three emerging independent OSes — VIDAA, Titan OS, and TiVo — to rise from a combined ~21% of the European TV-OS market in 2025 to ~28% by 2030, while Google TV falls from ~32% to ~26% [6][14]. None of these three existed in the European market in 2022. The driver Omdia names — OEM-friendly revenue share, cheaper Linux-based architecture, and *manufacturer control over viewer data* — is the same force that makes Titan OS willing to license data out rather than hoard it, which is favourable to MiQ's model [6]. There is no evidence in the source set that LG/webOS, a measurement currency, or a holdco has moved to internalise this aggregation in a way that disintermediates MiQ. The in-housing risk the corpus rightly worried about is real *in principle* for the OS layer generally, but the specific independent-OS economics currently push the other way: these OSes monetise by *selling* data and inventory access, not withholding it.\n\n---\n\n## Narrative: What Changed Between November 2025 and June 2026\n\nWhen the corpus was built, the worry was structurally sound. A young European OS venture, one announcement, no follow-up, in the most consolidation-prone layer of the CTV stack — that is exactly the profile of an asset that quietly evaporates. The opposite happened.\n\n**The company got stronger, not weaker.** The Highland Europe-led Series A in December 2025 is the clearest possible signal that a sophisticated growth-equity investor underwrote Titan OS as a going concern *after* seeing the MiQ deal and the competitive field. Two weeks of due diligence on a smart-TV OS does not end in a $58M cheque to a company about to be folded or pulled in-house. The Philips full-line win in March 2026 then converted Titan from one of several OEM relationships into the default OS of a major European TV brand — the kind of distribution lock-in that makes an OS hard to dislodge and its data more valuable.\n\n**The partnership did not mutate.** Across MiQ's own multilingual newsroom and independent trade write-ups (The Media Leader, Advanced Television), the language is stable: first to license log-level data, only managed-service partner with direct access, Q1 2026 Sigma integration. No \"expanded,\" \"renamed,\" \"wound down,\" or \"replaced by\" event appears in the record. The most that can be said against it is the absence of an explicit 2026 \"the integration has shipped and here are results\" press item — normal for a Q1 integration that would surface in case studies, not necessarily in a fresh release.\n\n**The exclusivity is narrower than the shorthand.** The genuine analytical finding here is the layer distinction. Titan OS is doing what every independent OS does to survive — opening its inventory to as many programmatic buyers and SSPs as possible (Equativ for home-screen video; its own Titan Ads arm monetising both Titan and TiVo inventory). A corpus reader who took \"MiQ's exclusive EU-OS data door\" to mean \"no other buyer can touch Titan OS\" would be wrong, and the Equativ and TiVo deals would look like contradictions. They are not contradictions; they are a different layer. MiQ's privileged position is the *log-level data license to a managed service* — the deepest and most analytically useful cut, not the only commercial relationship Titan has. That is a stronger, more credible moat to claim, but only if claimed precisely.\n\n**The macro picture supports the bet.** Omdia's forecast is the independent-validation layer the corpus wanted. A neutral analyst house projecting the independent OSes to take share through 2030, for reasons (OEM data control, revenue share) that *reinforce* rather than undermine the data-licensing model, is about as good as forward-looking confirmation gets for this asset. The risk is not zero — any single OEM can renegotiate, any OS can be acquired, and a measurement currency (e.g., a JIC or an ACR aggregator) could one day try to become the standard data layer. But as of June 2026, no such move is visible, and the trend line runs toward Titan OS, not away from it.\n\n---\n\n## Open Questions\n\n1. **Has the Q1 2026 Sigma integration technically shipped, with results?** The integration was *timed* for Q1 2026; no source in this pass confirms it went live on schedule or reports campaign outcomes. A 2026 MiQ case study or Sigma product note would close this.\n2. **What is the contractual term and renewal structure of the MiQ data license?** \"First\" and \"only\" managed-service partner could be a time-boxed exclusivity, a category exclusivity, or perpetual. The sources don't disclose duration — material to the moat's durability.\n3. **Does MiQ's exclusivity extend to the post-Philips-full-line data, or was it scoped to the footprint as of Nov 2025?** The Philips win materially enlarged Titan's data; whether MiQ's license automatically captures the enlarged pool is unstated.\n4. **How does the Equativ first-party-audience-data relationship interact with MiQ's \"only managed-service partner\" claim?** Equativ advertisers can use \"Titan OS first-party audience data\" — segments, not log-level. Confirming these are genuinely different data products (segment vs. log-level) would harden Claim 13.5.\n5. **Is there a 2026 restatement of the \"6.4 trillion signal\" / panel figure specific to TV Intelligence (vs. Sigma's 700T)?** The corpus's 6.4T figure was not re-encountered in this pass; worth a dedicated check against doc 04's source.\n\n---\n\n## Sources\n\n1. Ingrid Lunden, \"Titan OS raises $58 million from Highland Europe for its smart TV OS,\" **TechCrunch**, 2025-12-02. https://techcrunch.com/2025/12/02/titan-os-raises-58-million-from-highland-europe-for-its-smart-tv-os/ — Tier 5 (specialized tech press). Series A details, founder, headcount, footprint, 2026 fundraising intent. Accessed 2026-06-20.\n2. \"Titan secures $58M to expand TVOS in Europe, LATAM,\" **StreamTV Insider**, 2025-12. https://www.streamtvinsider.com/technology/titan-secures-58m-funds-expand-tvos-europe-latam — Tier 5 (specialized CTV trade). Corroborates funding, lead investor, OEM list (Philips/AOC/JVC/Sony/Vestel), 18M MAU. Accessed 2026-06-20.\n3. \"Titan OS raises $58 million from Highland Europe,\" **Yahoo Finance** (wire syndication). https://finance.yahoo.com/news/titan-os-raises-58-million-153000952.html — Tier 3-5 (syndicated). Funding corroboration. Accessed 2026-06-20.\n4. \"Philips drops Google TV for Titan OS on all 2026 models — what it means for CTV ads,\" **PPC Land**, 2026-03-23. https://ppc.land/philips-drops-google-tv-for-titan-os-on-all-2026-models-what-it-means-for-ctv-ads/ — Tier 5 (ad-tech trade). Philips full-line switch, \"over 30 million streaming households,\" Titan Ads, revenue-share rationale. Accessed 2026-06-20.\n5. MiQ, \"MiQ Builds Unparalleled TV Intelligence in Europe Through Deal With Titan OS,\" **wearemiq.com newsroom**, 2025-11-18. https://www.wearemiq.com/resources/news/miq-builds-unparalleled-tv-intelligence-in-europe-through-deal-with-titan-os — Tier 1 (primary corporate statement — claim, not independent fact). Exclusivity language, 20M CTV combined (Samba + Titan), Q1 2026 Sigma timing, 700T signals, executive quotes (Alfie Atkinson, Jacinto Roca). Accessed 2026-06-20.\n6. \"Google TV to Lose European Market Share to VIDAA, Titan OS and TiVo, Suggests Omdia Data,\" **VideoWeek**, 2026-04-22. https://videoweek.com/2026/04/22/google-tv-to-lose-european-market-share-to-vidaa-titan-os-and-tivo-suggests-omdia-data/ — Tier 5 (specialized trade, reporting Tier 2 Omdia data). Market-share forecast: emerging OSes 21%→28%, Google TV 32%→26% by 2030; revenue-share/data-control drivers. Accessed 2026-06-20.\n7. \"MiQ boosts media planning capabilities with Titan OS data,\" **The Media Leader (UK)**, 2025-11. https://uk.themedialeader.com/miq-boosts-media-planning-capabilities-with-titan-os-data/ — Tier 5 (independent media trade). Independent restatement of the deal terms and exclusivity framing. Accessed 2026-06-20.\n8. \"MiQ partners with Titan OS,\" **Advanced Television**, 2025-11-18. https://www.advanced-television.com/2025/11/18/miq-partners-with-titan-os/ — Tier 5 (European CTV trade). Independent coverage confirming the announcement. Accessed 2026-06-20.\n9. \"Philips drops Google TV…\" / Titan reach figures (4M MAU; 30M streaming households via Titan Ads partners incl. Virgin), **PPC Land** and search-corroborated trade summaries, 2026. — Tier 5. Distinguishes directly-operated MAU from broader ad-reach household figure. Accessed 2026-06-20.\n10. \"Equativ and Titan OS Launch Industry-First Programmatic CTV Home Screen Video Ads,\" **Equativ press / National Law Review syndication**, 2026-05. https://www.equativ.com/press/equativ-and-titan-os-launch-industry-first-programmatic-ctv-home-screen-video-ads — Tier 1 (corporate claim). Home-screen video programmatic via Maestro; \"Titan OS first-party audience data.\" Evidence that inventory access is multi-buyer. Accessed 2026-06-20.\n11. \"Equativ and Titan OS open CTV home screen ads to programmatic buying,\" **Broadband TV News**, 2026-05-27. https://www.broadbandtvnews.com/2026/05/27/equativ-and-titan-os-open-ctv-home-screen-ads-to-programmatic-buying/ — Tier 5 (European CTV trade). Independent corroboration of the Equativ–Titan launch. Accessed 2026-06-20.\n12. \"Titan Ads to monetise TiVo OS in Europe under new CTV ad pact,\" **Broadband TV News**, 2025-10-14. https://www.broadbandtvnews.com/2025/10/14/titan-ads-to-monetise-tivo-os-in-europe-under-new-ctv-ad-pact/ — Tier 5. Titan Ads as TiVo OS monetisation/exclusive sales partner in selected EU markets; single buying route across both OSes. Accessed 2026-06-20.\n13. \"TiVo OS, Titan partner to streamline CTV ad buying,\" **Advanced Television**, 2025-10-14. https://www.advanced-television.com/2025/10/14/tivo-os-titan-partner-to-streamline-ctv-ad-buying/ — Tier 5. Corroborates the Titan–TiVo monetisation pact (announced at MIPCOM). Accessed 2026-06-20.\n14. Omdia (via **Broadband TV News**), \"Emerging TV OS platforms to take 30% share in Europe by 2030, says Omdia,\" 2026-04-23. https://www.broadbandtvnews.com/2026/04/23/emerging-tv-os-platforms-to-take-30-share-in-europe-by-2030-says-omdia/ — Tier 5 reporting Tier 2 (Omdia analyst forecast). Independent macro validation of the independent-OS trajectory. Accessed 2026-06-20. (Omdia primary release at omdia.tech.informa.com returned 403 on direct fetch; cited via trade reporting.)\n\n---\n\n*Note on tiers and verification:* The two load-bearing pillars of this gap — that Titan OS is a going concern and that the MiQ relationship is intact — rest on a healthy mix: independent Tier-5 trade press and a Tier-5 tech-press funding report (TechCrunch) for the company's survival and growth, and Tier-1 corporate statements (cross-checked against independent Tier-5 restatements) for the partnership terms. The exclusivity claim is corporate-origin and should be cited as MiQ's *characterisation*; the scoping correction in Claim 13.5 is grounded in independently-reported, separately-sourced Equativ and TiVo deals. The Omdia forecast (Tier 2 analyst, accessed via Tier-5 reporting after the primary URL blocked direct fetch) is the strongest forward-looking external validation."}, {"order": 14, "file": "14_Gap_Samba_ACR_Going_Concern.md", "title": "Gap Close — The Samba TV Dependency: ACR Backbone, Going Concern, and the Disintermediation Clock", "summary": "", "body": "# Gap Close — The Samba TV Dependency: ACR Backbone, Going Concern, and the Disintermediation Clock\n\n## Bottom Line\n\nThe corpus's single most load-bearing unverified assumption — that MiQ's US ACR foundation still rests on a live Samba TV relationship — holds up. But the *shape* of the risk has to be rewritten. Three things are now confirmable on dated 2025–2026 sources. First, **the partnership is still live and still feeding Sigma**: MiQ's own March 2026 launch of Sigma in India names \"its partnership with Samba TV\" in the present tense as the source of \"advanced cross-screen television insights\" [1], and Samba remained in the Sigma integration roster at the June 2025 platform launch [2]. Second, **Samba TV is a going concern in robust health, not a distressed asset**: in December 2025 it secured a venture-debt facility of up to $60M from Horizon Technology Finance, and independent reporting (Axios) put the company at profitable with revenue growing 20–30% year over year [3][4][5]. Third — and this reframes the moat thesis — **the disintermediation the corpus feared is not a future scenario; it is Samba's stated, capitalized strategy.** The Dec 2025 raise is explicitly earmarked to scale Samba \"as a unified, cross-platform measurement partner to global DSPs, SSPs and major platforms like TikTok and Snap\" [3][4], and Samba already sells its data *directly* into The Trade Desk's Planner (exclusively, since 2019) and Yahoo's DSP [6][7]. The correction to the corpus: the \"Samba US handover\" was a **one-time 2023 event already consummated** (Samba exited managed-media sales and gave that book to MiQ), not an ongoing exclusivity that protects MiQ — and Samba's *data* has never been exclusive to MiQ. MiQ's ACR door is still open on workable terms through the forecast window. But Samba is at once MiQ's supplier and an increasingly direct competitor for the same buyers, and that has been true the whole time.\n\n---\n\n## What the corpus assumed, and what needed checking\n\nDocs 03, 04, and 09 anchor MiQ's CTV/ATV pitch on Samba TV's ACR. Doc 04 calls it \"the single most important entry in the stack\" and \"the highest-stakes renewal risk in the document\" [doc 04 §3.1]. Doc 09 names the Samba agreement \"the single most load-bearing unknown for the moat thesis — flagged as single-source/stale,\" resting entirely on the **January 13, 2023** press release with \"renewal/termination status not independently confirmable as of June 2026\" [doc 09]. The corpus also worried, in the abstract, that Samba \"could in principle build or partner around MiQ's activation layer\" and \"run aggregation itself\" [doc 04 §6, doc 09].\n\nThe gap brief asked four concrete questions. This document answers each:\n\n1. **Is the Samba–MiQ relationship still live in 2026?** Yes — re-cited by MiQ in March 2026.\n2. **Is Samba a going concern?** Yes — profitable, growing, freshly capitalized as of Dec 2025.\n3. **Was the \"US handover\" one-time or ongoing?** One-time, consummated in 2023; it is not an ongoing exclusivity moat.\n4. **Has Samba moved to a direct-to-buyer / direct-to-DSP model that disintermediates MiQ?** Yes — it predates the MiQ deal and is now Samba's explicitly funded growth strategy.\n\n---\n\n## Key Claims\n\n### Claim 14.1 — The Samba–MiQ partnership is still live and feeding Sigma as of March 2026\n\n**Statement:** As of March 13, 2026, MiQ publicly described \"its partnership with Samba TV\" in the present tense as adding \"advanced cross-screen television insights, enabling unified planning, activation and measurement,\" in coverage of MiQ's launch of the Sigma platform in India [1]. Samba was also listed in the Sigma integration ecosystem at the platform's June 2025 launch [2].\n\n**Type:** established\n**Stakes:** load-bearing\n**Single source:** false (March 2026 India trade coverage [1] + June 2025 Sigma launch press release [2], with the underlying Jan 2023 agreement [doc 04 ref 5])\n\n**Evidence:** MiQ co-founder/global CEO Gurman Hundal and India CCO Varun Mohan announced the India Sigma launch; the trade write-up names exactly one external data partner — Samba TV — in present-tense partnership language [1]. This is the dated 2026 re-citation the corpus said it lacked. It discloses no contract duration, renewal date, or exclusivity terms — those remain private — but it closes the \"is it even still alive?\" question. The relationship is live.\n\n**Caveat:** Trade-press repetition of a partnership is weaker than a dated renewal filing. MiQ continuing to *market* the relationship is strong evidence the data still flows; it is not proof the commercial terms are unchanged since 2023.\n\n---\n\n### Claim 14.2 — Samba TV is a healthy going concern, not a distressed or failing supplier\n\n**Statement:** In December 2025 Samba TV secured a growth-capital facility of up to $60M from Horizon Technology Finance ($30M initial close, $30M accordion); independent reporting characterized Samba as **profitable with revenue growing 20–30% year over year**, and CEO Ashwin Navin said the company chose debt over equity because it was \"less dilutive\" and a \"cheaper source of capital\" [3][4][5].\n\n**Type:** established\n**Stakes:** load-bearing\n**Single source:** false (Samba/Horizon/GlobeNewswire press release [3]; Axios independent reporting [4]; TV News Check [5])\n\n**Evidence:** The profitability and 20–30% growth figures come from Axios's December 8, 2025 reporting on the raise [4], independent of the company's own press release [3]. The \"chose debt because less dilutive / cheaper\" rationale is itself a health signal: distressed firms rarely have the option of *non-dilutive* venture debt, and lenders like Horizon underwrite to cash-flow visibility. This retires the gap brief's premise that Samba \"has had layoffs and strategy shifts\" threatening it as a going concern. The documented 15–20% layoff/reorg event was **2019**, not recent [8], and Samba abandoned its IPO/SPAC path in **May 2022** [9] — but from a position it has since grown out of, not collapsed into.\n\n**Caveat:** \"Profitable, 20–30% growth\" is sourced to reporting citing the company; Samba is private and files no audited public financials, so the figures are not independently auditable. Treat as strong directional evidence of health, not as a verified income statement.\n\n---\n\n### Claim 14.3 — The \"Samba US handover\" was a one-time 2023 event, already consummated — not an ongoing exclusivity that protects MiQ\n\n**Statement:** The \"handover\" the corpus references is the **January 2023 transfer of Samba's US managed-media-sales business to MiQ**, executed when Samba exited managed media to focus exclusively on data and measurement [doc 04 ref 5]. This was a one-time asset/book transfer, completed in Q1 2023. It is not a renewable exclusivity arrangement and confers no ongoing exclusive claim on Samba's *data*.\n\n**Type:** established (re-reading of the 2023 record against the corpus's own framing)\n**Stakes:** load-bearing\n**Single source:** false (Jan 2023 press release [doc 04 ref 5]; Deadline [doc 04 ref 13]; AdExchanger [doc 04 ref 14])\n\n**Evidence:** The 2023 deal had two distinct legs that the corpus sometimes blurs: (a) a **multi-year data/ACR supply agreement** (Samba feeds MiQ household-level ACR; renewable, terms private), and (b) a **one-time business swap** (Samba handed MiQ its US managed-media-sales operation and stopped selling managed media itself). Leg (b) is done. Samba left that business for good — but what it gave MiQ was a *book of business*, not a data monopoly. Doc 03 lists \"the Samba US managed-media handover (2023)\" among MiQ's \"specifically exclusive data deals,\" which over-reads it: what was exclusive was that Samba stopped *competing in managed media*, not that Samba's ACR became MiQ-only. The data has never been exclusive (see Claim 14.4).\n\n**Implication for the corpus:** doc 03's framing of the handover as a \"privileged ACR-data relationship\" should be softened to \"a privileged managed-media position plus a non-exclusive ACR data feed.\" The privilege is real but narrower than stated.\n\n---\n\n### Claim 14.4 — Samba's ACR data is, and always has been, sold directly to buyers and rival platforms — the disintermediation the corpus feared is Samba's actual business model\n\n**Statement:** Samba sells its TV data and measurement **directly into multiple DSPs and platforms**, bypassing any managed-service intermediary: its commercial-exposure data has been *exclusively available in The Trade Desk's Planner* since 2019 [6]; it powers a self-service Advanced TV solution inside the Yahoo DSP (Australia/UK/Canada) [7]; and the December 2025 capital raise is explicitly to scale Samba \"as a unified, cross-platform measurement partner to global DSPs, SSPs and major platforms like TikTok and Snap\" [3][4].\n\n**Type:** established\n**Stakes:** load-bearing\n**Single source:** false (TTD–Samba release [6]; Yahoo–Samba release [7]; Dec 2025 raise [3][4])\n\n**Evidence:** The TTD Planner integration (announced May 2019, covering 80M US households across 46,000+ advertisers) lets advertisers plan on Samba data *inside the DSP itself* [6] — structurally a direct-to-buyer channel that needs no MiQ. The Yahoo DSP integration is described as \"self-service\" Advanced TV [7]. The Dec 2025 raise names DSPs, SSPs, TikTok, and Snap as the partner set Samba is scaling toward [3][4]. Samba's June 2025 Acxiom/Interpublic 40-market expansion plugs Samba audiences directly into Acxiom's Interact platform for IPG agencies [10] — again, MiQ-independent.\n\n**The reframing this forces:** the corpus treats Samba-as-competitor as a *latent future risk* (\"could in principle run aggregation itself\"). It is not latent. Samba has been a direct-to-DSP data and measurement vendor since 2019 — before the MiQ managed-media deal. The 2023 deal did not make Samba MiQ's captive supplier; it made MiQ the buyer of a managed-media book that Samba no longer wanted, *while Samba kept selling its data to everyone, including through the DSPs MiQ itself trades on.* The genuine risk is not \"Samba might disintermediate MiQ someday.\" It is \"Samba's data is a commodity input any TTD/Yahoo buyer can also reach directly, so MiQ's edge has always been integration-and-service, not privileged access to Samba.\" This sharpens, rather than contradicts, doc 04's and doc 09's \"rented, not owned\" verdict.\n\n---\n\n### Claim 14.5 — Samba's underlying ACR signal source looks durable through the forecast window, but Samba (not MiQ) carries the OEM-consolidation exposure\n\n**Statement:** Samba's ACR is integrated at the chipset level across roughly 24 top smart-TV brands sold in 100+ countries, on a 100% opt-in basis, sourcing from tens of millions of opted-in sets (named manufacturers include Sony, Sharp, TCL, Philips, Toshiba) [11][12]. Samba is actively reinvesting (Semasio acquisition Oct 2024; agentic-AI roadmap; Dec 2025 capital) to defend and grow this footprint [3][13].\n\n**Type:** established\n**Stakes:** standard\n**Single source:** false (Samba press kit / business pages [11]; AdExchanger Semasio coverage [13]; Dec 2025 raise [3])\n\n**Evidence:** Samba's manufacturer-agnostic, multi-OEM integration is the structural answer to the corpus's worry (doc 04 [10][11]) that Samsung/LG/Roku pulling ACR in-house leaves independents with \"less than half\" coverage. Samba's pitch is precisely that it aggregates *across* manufacturers that lack their own ad-data business (Sony, Sharp, TCL, Philips, Toshiba) — the brands that have *not* built walled-garden ACR. The OEM-consolidation risk is real, but it lands on **Samba's** data-coverage completeness, not directly on MiQ; MiQ inherits whatever footprint Samba can hold. The Oct 2024 Semasio acquisition (contextual targeting, ~$20M revenue) [13] and the agentic-AI roadmap show Samba investing to stay ahead of that erosion.\n\n**Caveat:** Manufacturer counts and \"tens of millions of opted-in sets\" come from Samba's own marketing materials [11] (Tier 1 for what Samba claims, not independently audited). The directional point — multi-OEM, opt-in, manufacturer-agnostic — is corroborated across trade coverage.\n\n---\n\n## Synthesis: rewriting the Samba risk for the forecast\n\nThe corpus framed Samba as a **stale, single-source, possibly-lapsed dependency whose renewal clock was the top measurement risk.** The evidence revises that on three axes:\n\n1. **Liveness:** confirmed live and Sigma-fed as of March 2026 [1]. The \"is it still alive?\" question is closed.\n2. **Supplier health:** Samba is *stronger* than the corpus feared — profitable, growing 20–30%, freshly capitalized [3][4]. A healthy supplier means continuity of supply. It also means a rival well-funded to compete.\n3. **Nature of the risk:** the real threat was mis-specified. It is **not** \"Samba might fail and take MiQ's ACR with it\" (Samba is healthy), and **not** \"the contract might lapse\" (it is being actively marketed in 2026). It is that **Samba's data was never MiQ-exclusive, and Samba is a capitalized, profitable, direct-to-DSP competitor for the same measurement dollars** — selling into TTD, Yahoo, and soon TikTok/Snap [3][6][7]. MiQ's defensible moat is therefore exactly what docs 04/09 already concluded — integration, neutrality, managed-service craft — and *not* any privileged hold on Samba. This gap close strengthens the corpus's own \"integration-and-neutrality moat on rented land\" thesis while removing the false comfort of an \"exclusive ACR relationship.\"\n\n**Net for 2029:** MiQ's ACR door is open on workable terms through the window. The supplier is solvent and committed to the data business. But the door is a *public* one — every TTD/Yahoo buyer walks through a version of it — and the supplier standing in it is, by its own funded strategy, building to sell the same intelligence straight to MiQ's clients. Replace the renewal-cliff framing with a **margin-compression-and-commoditization** one. The danger is not losing Samba. It is that Samba's value becomes a buy-it-yourself commodity inside the DSPs, thinning the resale-and-integration premium MiQ lives on.\n\n---\n\n## Open Questions\n\n1. **Contract specifics remain private.** No 2025–2026 source discloses the duration, renewal date, exclusivity scope, or pricing of the MiQ–Samba *data* agreement. Liveness is confirmed; commercial terms are not. This is now a *terms* unknown, not an *existence* unknown.\n2. **Does MiQ get any preferential ACR access, or buy on the same sheet as any TTD/Yahoo buyer?** The handover gave MiQ a managed-media book, but no source confirms MiQ enjoys data terms better than Samba's other DSP/agency channels. If not, MiQ's \"privileged relationship\" is mostly historical.\n3. **TikTok/Snap and the SSP push:** how far has Samba's stated DSP/SSP/social measurement expansion actually progressed since the Dec 2025 raise? Named as strategy [3][4]; execution status post-Dec-2025 unverified.\n4. **OEM coverage trajectory:** as Samsung/LG/Roku/Vizio-Walmart deepen in-house ACR, what share of US households can Samba's multi-OEM (Sony/TCL/Philips/etc.) footprint still reach by 2029? This caps the ceiling of MiQ's inherited TV-Intelligence scale.\n5. **Did MiQ ever re-paper or expand the deal?** No public renewal or expansion announcement surfaced; the 2023 agreement appears to be the operative one, marketed forward.\n\n---\n\n## Figures / primary texts not yet consulted\n\n- **The Samba–MiQ data agreement itself** (the contract) — private; not public.\n- **Samba TV audited financials / cap table** — private company; profitability sourced to reporting, not filings.\n- **Horizon Technology Finance loan covenants / 10-Q disclosure** — Horizon is a public BDC (Nasdaq: HRZN); its filings may disclose the Samba facility's size, draw status, and terms in more detail than the press release. Not pulled here.\n- **MiQ India Sigma primary release** (vs. the trade write-up [1]) — the original MiQ release may name additional Sigma data partners.\n- **Axios full text** [4] — fetched via search snippet only (direct fetch 403'd); profitability/growth figures should be confirmed against the full article if access is available.\n\n---\n\n## Sources\n\n1. Indian Television Dot Com, \"MiQ launches AI platform Sigma in India to transform multi-screen marketing,\" indiantelevision.com, **13 March 2026** (accessed 2026-06-20). **Tier 5** (industry trade). Present-tense re-citation of the MiQ–Samba partnership feeding Sigma; launch by Gurman Hundal and Varun Mohan. *The dated 2026 confirmation the corpus said it lacked.*\n2. MiQ / BusinessWire / Bridgepoint, \"MiQ Sigma Breaks the Fragmentation Cycle,\" wearemiq.com / businesswire.com, **4 June 2025** (accessed 2026-06-20). **Tier 1** (press release — evidence of what MiQ claims). Samba listed in the Sigma integration ecosystem at launch.\n3. Samba TV / Horizon Technology Finance / GlobeNewswire, \"Samba TV Secures Up to $60 Million Growth Capital Facility from Horizon Technology Finance,\" globenewswire.com / samba.tv, **8 December 2025** (accessed 2026-06-20). **Tier 1** (press release). $30M initial close + $30M accordion; capital to scale Samba \"as a unified, cross-platform measurement partner to global DSPs, SSPs and major platforms like TikTok and Snap,\" agentic-AI roadmap, M&A; CEO Ashwin Navin quote. Does not mention MiQ.\n4. Axios, \"Exclusive: Samba TV raises up to $60M venture debt,\" axios.com, **8 December 2025** (accessed 2026-06-20 via search snippet; direct fetch returned 403). **Tier 4** (major outlet). Independent reporting: Samba profitable, revenue growing 20–30% YoY; debt chosen as \"less dilutive\" / \"cheaper source of capital.\"\n5. TV News Check, \"Samba TV Adds Up To $60M In Venture Debt,\" tvnewscheck.com, **8 December 2025** (accessed 2026-06-20). **Tier 5** (TV/ad trade). Corroborates the facility structure and use of proceeds.\n6. The Trade Desk / Samba TV, \"The Trade Desk Partners With Samba TV To Unify Digital Media and TV Strategy For The World's Largest Advertisers,\" samba.tv, **2 May 2019** (accessed 2026-06-20). **Tier 1** (press release). Samba commercial-exposure data \"exclusively available on The Trade Desk's Planner tool\"; 80M US households; 46,000+ advertisers. *Evidence Samba sells direct-to-DSP, predating the MiQ deal.*\n7. Samba TV / Yahoo, \"Yahoo Partners with Samba TV for Advanced TV Solution… UK, Canada and Australia\" and \"…Australia's first self-service Advanced TV solution,\" samba.tv / yahooinc.com (accessed 2026-06-20). **Tier 1** (press release). Self-service Samba-data Advanced TV inside the Yahoo DSP — a direct-to-buyer channel independent of MiQ.\n8. AdExchanger, \"Samba Lays Off 15-20% Of Staff, Reorgs To Focus Solely On Data And Audience Products,\" adexchanger.com, **2019** (accessed 2026-06-20). **Tier 5** (ad-tech trade). The layoff/reorg event predates the MiQ deal by years; not evidence of recent distress.\n9. PitchBook / company profile, \"Samba TV cancelled IPO transaction 13 May 2022\" (accessed 2026-06-20 via search). **Tier 5** (financial-data provider). Samba pursued then shelved a public-listing path in 2022; remains private.\n10. Samba TV / Acxiom, \"Samba TV and Acxiom Announce Massive 40-market Global Expansion,\" samba.tv / GlobeNewswire (via FinancialContent), **11 June 2025** (accessed 2026-06-20). **Tier 1** (press release). Samba audiences into Acxiom's Interact platform for Interpublic agencies across 40 markets; 1B+ profiles, 1,000+ customers, 50 countries. MiQ-independent direct channel.\n11. Samba TV, Press Kit / Business pages, samba.tv/business, samba.tv/business/press-kit (accessed 2026-06-20). **Tier 1** (company materials — evidence of what Samba claims). Chipset-level ACR across ~24 top smart-TV brands in 100+ countries; 100% opt-in; named OEMs (Sony, Sharp, TCL, Philips, Toshiba).\n12. AdExchanger, \"A MiQ-Drop Moment For Samba Ad Sales,\" adexchanger.com, **17 January 2023** (accessed 2026-06-20). **Tier 5.** Samba's multi-source, manufacturer-agnostic, first-party ACR; MiQ taking managed service from Q1 2023 (corroborates the one-time nature of the handover).\n13. AdExchanger / GlobeNewswire, \"Samba TV Acquires Semasio To Beef Up Its Contextual CTV Targeting,\" adexchanger.com / globenewswire.com, **31 October 2024** (accessed 2026-06-20). **Tier 5 / Tier 1.** Semasio acquisition (~$20M revenue, ~$80M raised historically) — evidence of Samba reinvesting and growing, not retrenching."}, {"order": 15, "file": "15_Gap_MFA_Supply_Path_Transparency_Debate.md", "title": "The MFA and Supply-Path-Transparency Debate: Is MiQ's Neutrality an Asset or a Liability?", "summary": "", "body": "# The MFA and Supply-Path-Transparency Debate: Is MiQ's Neutrality an Asset or a Liability?\n\n> **Decode-as-you-go.** *MFA* = \"made-for-advertising\" (and the newer, narrower \"made-for-arbitrage\") — websites engineered to maximize ad impressions rather than to serve readers, typically over-stuffed with ad slots and fed by paid traffic. *Working media* = the share of an advertiser's dollar that actually buys a real, viewable impression in front of a human, as opposed to fees and waste skimmed along the way. *Log-level data (LLD)* = the raw, impression-by-impression record of where an ad ran, what was paid, and what fees were taken — the receipt, not the summary. *Take rate* = the cut a platform or partner keeps out of the money flowing through it. *SPO* = supply-path optimization, deliberately shortening and curating the route from buyer to publisher. *Curation* = packaging vetted inventory into a deal a buyer can activate, increasingly the SSP-side answer to fragmentation and MFA. *Verification* = third-party measurement of fraud/IVT, viewability, and brand safety (DoubleVerify, IAS, HUMAN). *IVT* = invalid traffic (bots and fraud). *PMP* = private marketplace, an invite-only programmatic deal between a buyer and named publishers.\n\n---\n\n## Bottom Line\n\nSupply-path optimization and curation are usually mapped as forces eroding the programmatic middle. Less often engaged is the controversy that gives those forces their moral and board-level urgency: the **made-for-advertising (MFA) and supply-path-transparency debate.** The ANA's December 2023 *Programmatic Media Supply Chain Transparency Study* found that roughly **15% of programmatic spend and 21% of impressions** were flowing to MFA sites, that the average campaign was scattered across **44,000 websites**, and that all of this delivered only about **36 cents of working media per dollar**. Since then, \"where did my impression actually run, and how much of my spend reached real media\" has become a question advertisers put to their partners directly. Adalytics-style exposés (the Forbes `www3` subdomain, the January 2024 \"made-for-arbitrage\" report naming Google DV360, Amazon DSP, and dozens of SSPs and verification firms), the still-unsettled fight over how even to *define* MFA, and The Trade Desk's 2025 acquisition of Sincera (and its public MFA exclusion lists) have turned supply-path quality into a competitive battleground. A managed-service desk that buys across seven DSPs and 2,000-plus PMP deals on clients' behalf is structurally exposed on two fronts: **(1)** does neutral, multi-DSP aggregation expose clients to *more* low-quality supply than a single curated path; and **(2)** can MiQ prove log-level transparency and take-rate clarity when it sits as an *extra managed-service layer* above the DSPs?\n\nThe honest finding is **mixed, and tilts modestly in MiQ's favor on the evidence available — but the structural vulnerability is real.** On the asset side: MiQ acted *early and publicly* against MFA, co-publishing a July 2023 case study with the SSP OpenX in which MiQ contributed its *own* curated MFA blocklist, which — paired with Jounce Media's list — lifted excluded domains by **37%** (~1,600 domains in a single day) [1][2]; MiQ holds **TAG \"Certified Against Fraud,\" IAB Gold Standard, and JICWEBS/DTSG** brand-safety certifications [3][4]; MiQ positions PMP curation, direct-to-publisher buying, and dashboard-level \"exact app and content genre\" reporting as f
