non-zero.** The closest survivor archetype is the independent that **re-platformed into software** — Centro's pivot into **Basis Technologies** (rebranded 2022) is the cleanest example of a media-services independent becoming a durable software/automation platform rather than dying as a desk [16]. This is the narrow path MiQ is betting on with Sigma. It exists, but it is the exception, and it requires actually shipping software people license — not a \"platform\" only MiQ's own traders touch, which remains an unresolved tension over whether Sigma is a licensable product or an internal tool.\n\n### The base rate for MiQ's *specific* path (independent desk → licensed data-and-software layer) is low but non-zero, and the precedent that defines it is re-platforming, not relationship-defense\n\nHistory offers one reasonably clear survival archetype for a media-services independent facing commoditization — re-platforming into licensed software (Centro → Basis Technologies) [16] — and several failure archetypes (the gutted holdco desks [3][4][5], the bankrupt independent DSP [9]). MiQ's odds turn on which archetype Sigma actually becomes. Centro/Basis is one illustrative precedent, not a statistical base rate; \"low but non-zero\" is a qualitative judgment, explicitly not a quantified probability (that question is taken up in the outlook).\n\n---\n\n## 8. So what — the load-bearing takeaway\n\nThe counter-tradition is not a \"headwind.\" It is a **falsifiable structural thesis** with a decade of precedent, and the honest move is to state it at full strength and then answer only the parts MiQ can actually answer.\n\n1. **MiQ defeats the *transparency* strand** by being disclosed/agnostic by birth (6.1).\n2. **MiQ defeats the *in-housing* strand** by owning proprietary TV data (6.2) and selling to the can't-in-house segment (6.3).\n3. **MiQ has *not yet* defeated the *agentic-commoditization* strand** (6.4), because its core monetized skill is still the human trading labor that agentic buying is built to commoditize — as MiQ's own analysis concedes.\n4. **The decisive variable is the revenue-mix conversion**: MiQ survives if and only if value migrates from commoditizable labor to durable data-and-software *before* its own AI makes the labor free. The Dentsu deal is the leading positive tell; the absence of holdco #2/#3 and the opaque labor-vs-software revenue split are the leading negative tells.\n\nMiQ's 2029 outcome is therefore best modeled not as \"in-housing high vs. low\" but as a **race condition**: does the data-and-software layer harden into something licensed-even-when-in-housed faster than agentic buying commoditizes the trading layer? \"Xaxis with an LLM\" is the downside, the scenario in which it does not. The Centro→Basis re-platforming is the narrow upside, the one in which it does. The race is already running.\n\n---\n\n## Open Questions\n\n1. **What is MiQ's actual revenue split** between commoditizable managed-service labor and durable data/software licensing? This single undisclosed number determines which historical archetype MiQ is — and the counter-tradition cannot be fully scored without it.\n2. **Does Sigma get *licensed* to clients (the Basis path) or stay an internal trader tool (the desk path)?** It appears internal-only as of mid-2026; a self-serve Sigma tier would materially change the base-rate assessment.\n3. **Is there a holdco #2 and #3 after Dentsu?** The \"Intelligence Partner\" layer thesis is a single data point until it repeats. The next holdco signing is the decisive tell.\n4. **What is the empirical in-housing reversal rate** — how many brands that in-housed have since *re-outsourced* to specialists, and is that share rising? The IAB \"tried-then-outsourced\" figures (13% in 2018, 16% in 2020) hint at a re-outsourcing eddy [12][13] that, if growing, is a direct MiQ tailwind no one has yet quantified.\n5. **Does agentic buying actually disintermediate, or re-intermediate?** The IAB Agentic RTB Framework and the platforms' agents [11] could equally *create* a new orchestration-across-agents layer that a specialist like MiQ is positioned to own — the inverse of the disintermediation thesis. Unresolved.\n\n---\n\n## Sources\n\n1. ANA / K2 Intelligence, \"ANA Independent Study Finds Rebates and Other Non-Transparent Practices to be Pervasive in U.S. Media Ad-Buying Ecosystem,\" June 7, 2016. https://www.ana.net/content/show/id/pr-2016-rebates-other — Tier 1/2 (commissioned independent study; primary press release for the findings). Corroborated via Marketing Dive and The Drum below. The rebate/non-transparency findings and study dates. Accessed 2026-06-20.\n2. CNBC, \"Procter & Gamble chief marketer slams 'crappy media supply chain,'\" Jan. 31, 2017; The Drum, \"P&G to review all agency contracts in 2017,\" Jan. 30, 2017; Marketing Week (Ritson), 2017. https://www.cnbc.com/2017/01/31/procter-gamble-chief-marketer-slams-crappy-media-supply-chain.html — Tier 3/4 (wire + major outlet) for the Pritchard speech; \"murky at best and fraudulent at worst,\" the 25% figure, the contract-review pledge. Accessed 2026-06-20.\n3. MarTech (Barry Levine), \"WFA survey finds agency trading desks facing challenges from independent models,\" Jan. 30, 2017. https://martech.org/wfa-agency-trading-desks-transparency-independent-models/ — Tier 5 (trade press reporting a WFA membership survey; survey = Tier 5 method). The 90% reset, 51% legacy-desk, 46% independent, >20% in-house/hybrid, and 9%/62% principal-trading-comfort figures. Accessed 2026-06-20.\n4. Marketing Magazine (Canada) / Sean Hargrave, \"Publicis ditches the agency trading desk,\" Feb. 2015. https://marketingmag.ca/tech/publicis-ditches-the-agency-trading-desk-138032/ — Tier 4/5. VivaKi dissolution (Feb 2015), ~120 traders reassigned, Laura Desmond quote. Accessed 2026-06-20.\n5. Digiday (Zach Rodgers interview), \"A History of Ad Tech Chapter 3: The Holdcos Strike Back.\" https://digiday.com/media-buying/a-history-of-ad-tech-chapter-3-the-holdcos-strike-back/ — Tier 5 (specialist trade press; expert oral history). Identity and nature of Xaxis/Accuen/Cadreon/Amnet/Affiperf/VivaKi; \"ad networks that sat inside the agency\"; the black-box margin and rebranding dynamics. Accessed 2026-06-20.\n6. Campaign / The Drum, \"Nine in ten advertisers review programmatic contracts for transparency\" / \"90% of marketers are reviewing programmatic ad contracts,\" Jan. 2017. https://www.thedrum.com/news/2017/01/30/90-marketers-are-reviewing-programmatic-ad-contracts-quest-greater-transparency — Tier 4/5. Corroborates the WFA 90% figure independently of [3]. Accessed 2026-06-20.\n7. Campaign / The Drum, \"Sir Martin is partially correct, in-house programmatic trend is short-lived,\" Nov. 12, 2018. https://www.thedrum.com/news/2018/11/12/sir-martin-partially-correct-house-programmatic-trend-short-lived-ctrl-shift-ceo — Tier 5/6 (reports Sorrell's position; used as position-evidence). Sorrell's \"short-lived\" characterization of in-housing while at WPP/owning Xaxis. Accessed 2026-06-20.\n8. Digiday, \"S4 Capital's Martin Sorrell: 'Direct-to-consumer is a symptom of the disease,'\" and \"All that ails WPP.\" https://digiday.com/marketing/former-wpp-ceo-martin-sorrell-approach-purely-digital/ — Tier 5 (position-evidence). Post-WPP disintermediation/reduce-the-layers rhetoric; used to correct the Sorrell attribution. Accessed 2026-06-20.\n9. Marketing Dive, \"MediaMath's bankruptcy demonstrates difficulties of DSP model,\" and AdExchanger, \"MediaMath To File For Bankruptcy,\" July 2023. https://www.marketingdive.com/news/mediamath-files-bankruptcy-dsp-programmatic/686006/ — Tier 4/5. June 30, 2023 Chapter 11; $600M+ raised; once >$1B valuation; $100M+ owed; ~300+ jobs; 5,000+ customers. The independent-intermediary failure precedent. Accessed 2026-06-20.\n10. The Trade Desk press room + AdExchanger + The Current, on Kokai (launched June 2023) and Koa Adaptive Trading Modes, 2023–2025. https://www.thetradedesk.com/press-room/the-trade-desk-launches-kokai-a-new-media-buying-platform-that-brings-the-full-power-of-ai-to-digital-marketing — Tier 1 (vendor, as claim) + Tier 5 (AdExchanger reporting). Kokai/Koa self-serve AI framing, ~2/3–3/4 spend migration by mid-2025, \"control + automation\" positioning. ROAS figures are vendor claims. Accessed 2026-06-20.\n11. PPC.land + AdTechRadar + Amazon Ads, on Amazon \"Ads Agent\" (Nov. 11, 2025, unBoxed), Google \"Ads Advisor\" (Nov. 12, 2025), IAB Tech Lab Agentic RTB Framework (Nov. 13, 2025). https://ppc.land/amazon-launches-ai-agent-for-automated-campaign-management/ — Tier 1 (vendor announcements, as claims) + Tier 5 (trade reporting). The agentic-self-serve disintermediation framing. Accessed 2026-06-20.\n12. AdExchanger, \"IAB: Agencies Fall Into Specialist Roles As More Brands Bring Programmatic In-House\" (IAB Data Center of Excellence white paper, May 2018). https://www.adexchanger.com/agencies/iab-agencies-fall-into-specialist-roles-as-more-brands-bring-programmatic-in-house/ — Tier 5 reporting on a Tier 2/5 IAB study. 65% in-house (18% full / 47% partial / 13% abandoned); specialist-repositioning framing. Accessed 2026-06-20.\n13. Chief Marketer / IAB + Accenture Interactive, \"IAB Report: 69 Percent of Brands Have Taken Programmatic Advertising In-House,\" Aug. 2020. https://chiefmarketer.com/iab-report-69-percent-of-brands-have-taken-programmatic-advertising-in-house/ — Tier 5 on an IAB/Accenture study. 69% in-house; 48% partial; 16% tried-then-outsourced; 18-month timeline. Accessed 2026-06-20.\n14. WARC + IAB Europe \"Attitudes to Programmatic Advertising\" (Nov. 2024) + IAB State of Data 2024, on the hybrid plateau. https://www.warc.com/newsandopinion/opinion/programmatic-in-housing-hybrid-models-let-advertisers-take-control/2745 — Tier 5. Hybrid-as-dominant-mode; ~25% fully in-house; recruitment/skills as binding constraint. Accessed 2026-06-20.\n14a. IAB Europe \"Attitudes to Programmatic Advertising Report,\" Nov. 2024 (as summarized in trade coverage). https://iabeurope.eu/wp-content/uploads/IAB-Europe-Attitudes-to-Programmatic-Advertising-Report-Nov-2024.pdf — Tier 5 (industry survey). ~42% considering in-housing within 12 months; ~51% hybrid (+4pts YoY). LEAST corroborated figures in this doc; flagged as directional. Accessed 2026-06-20.\n15. AdExchanger (as [12]) + IAB white papers — Tier 5. The \"specialists survive by bringing different value than media buying\" framing and the recurring 18-month / talent-constraint findings. Accessed 2026-06-20.\n16. Basis Technologies (formerly Centro) corporate + trade coverage of the 2022 rebrand. https://www.gourmetads.com/programmatic/basis-by-centro/ — Tier 5/6 (trade/vendor descriptive). Centro → Basis Technologies re-platforming from media-services independent into software/automation platform; the survival archetype. Accessed 2026-06-20."}, {"order": 18, "file": "18_Gap_Xandr_DSP_Going_Concern.md", "title": "Going-Concern: The Xandr Sunset and MiQ's '7 TV Buying Platforms", "summary": "", "body": "# The Xandr Sunset: A Named Buying Rail Goes Dark, and a Canadian \"Exclusive Door\" Built on It\n\n## Bottom Line\n\nOne of the rails MiQ names to prove it can buy anywhere is about to go dark. Doc 03 presents MiQ's DSP-agnostic CTV pitch as buying across \"7 top TV buying platforms,\" and names two of them as concrete proof of agnostic reach: YouTube via Google's DV360, and Warner-Media inventory via **Microsoft's Xandr**. It also presents the **Bell DSP** in Canada as a \"genuinely scarce, exclusive door\" — the rare bit of CTV supply no competing independent can replicate on a shared DSP. This gap closes a load-bearing going-concern contradiction the corpus itself flagged, and the answer is worse than the flag suggested.\n\nMicrosoft confirmed on **May 14, 2025** that it is shutting its buy-side DSP — **Microsoft Invest, the platform formerly called Xandr and AppNexus before that — effective February 28, 2026** [1][2][3]. As of the corpus's June 2026 knowledge state, that rail is **dead**: a named \"7 platforms\" component MiQ still cites on its live product pages no longer exists as a buy-side DSP. Microsoft kept the *sell-side* (Monetize SSP and Curate), killed the *buy-side*, and is steering demand into a single AI-assisted \"Microsoft Advertising Platform\" rather than to a successor DSP [2][4].\n\nThe deeper finding cuts further: **Bell DSP is itself Xandr-powered.** Bell Media's platform launched in 2021 as \"SAM DSP, powered by Xandr's buying platform, Xandr Invest\" [5][6]. So the one CTV door doc 03 calls genuinely exclusive sits on the very buy-side engine Microsoft is switching off — a far sharper risk than doc 03's milder \"re-verify the exclusivity\" caveat. The verdict: the \"7 TV buying platforms\" framing is **stale and must be marked**; \"Warner via Xandr\" is **dead as a live route** and should be recast as historical; the Bell-in-Canada story requires explicit re-grounding on whatever stack Bell migrates to, which is **not yet disclosed** in available 2026 sources. None of this collapses doc 03's *aggregation-moat* thesis — if anything it strengthens the underlying argument that MiQ's edge is workflow and data layering, not exclusive pipes — but it does shrink the headline platform count and removes the corpus's single cleanest example of \"an exclusive door.\"\n\n---\n\n## Key Claims\n\n### Claim 18.1 — Microsoft is shutting its buy-side DSP (Microsoft Invest, formerly Xandr), effective February 28, 2026\n\n**Type:** established\n\n**Statement:** On May 14, 2025, Microsoft Advertising announced it would close its demand-side platform — Microsoft Invest, the buy-side product that descends directly from Xandr (and from AppNexus before AT&T's ownership) — with the platform ceasing to operate on February 28, 2026.\n\n**Evidence:** Digiday reported the closure on May 14, 2025, citing a Microsoft Advertising blog post and confirming the February 28, 2026 effective date and pending layoffs [2]. AdExchanger covered the same announcement and framed it as the end of \"the one-time AppNexus DSP business\" — Invest \"formerly Xandr, and formerly AppNexus before that\" [1]. Microsoft Advertising corporate VP **Kya Sainsbury-Carter** announced the move in a blog post, stating the company would be \"exclusively focusing our buy-side advertising technology investments on the Microsoft Advertising Platform\" from 2026 [2][3]. Multiple trade outlets independently corroborate both the announcement date and the Feb 28, 2026 effective date [3][4][7].\n\n**Stakes:** load-bearing — this is the fact that determines whether a named \"7 platforms\" rail is live or dead.\n\n**Single source:** No. Confirmed across Digiday [2], AdExchanger [1], bestmediainfo [3], and Media in Canada [4].\n\n**Citation:** AdExchanger, \"Microsoft Is Shutting Down Invest, The One-Time AppNexus DSP Business,\" adexchanger.com, May 14 2025 [1]; Digiday, \"Microsoft Advertising is closing the Xandr DSP, layoffs pending,\" digiday.com, May 14 2025 [2]. Tier 5 (specialized ad-tech trade press).\n\n**Source tier:** 5\n\n---\n\n### Claim 18.2 — Microsoft kept the sell-side (Monetize SSP, Curate) and killed only the buy-side, steering demand to an AI-assisted \"Microsoft Advertising Platform\" rather than a successor DSP\n\n**Type:** established\n\n**Statement:** The shutdown is buy-side only. Microsoft retains and continues to invest in its supply-side platform (Microsoft Monetize) and its curation product (Microsoft Curate); it is consolidating buy-side activity into a single AI-powered self-serve tool, the Microsoft Advertising Platform, and has not migrated Invest's demand to a third-party DSP.\n\n**Evidence:** Microsoft's own framing, quoted in trade coverage, distinguishes the deprecated buy side from the retained sell side: \"Curate and Monetize still exist and are being invested in. It is just the buy side that we deprecated\" [7]. Digiday reports Microsoft pointing buyers to \"Microsoft Curate for curated, programmatic deals, and Microsoft Monetize, our intelligent monetization platform,\" alongside \"a single AI-powered buying platform\" [2]. Microsoft's stated rationale: \"Our commitment to more private and personalized advertising experiences for a conversational and agentic world is not achievable with the industry's current DSP model\" [2]. Microsoft described replacing Invest with a Copilot-powered, chatbot-style ad-buying interface rather than steering buyers to a named competitor DSP [2][4].\n\n**Stakes:** standard — clarifies that the demand did not simply move to another rail MiQ could re-list.\n\n**Single source:** No. Corroborated across Digiday [2], bestmediainfo [7], and Media in Canada [4].\n\n**Citation:** Digiday, May 14 2025 [2]; bestmediainfo, \"What Microsoft's Xandr Invest shutdown says about the future of traditional DSPs,\" bestmediainfo.com, 2026 [7]. Tier 5.\n\n**Source tier:** 5\n\n---\n\n### Claim 18.3 — Bell DSP is built on Xandr Invest — the same buy-side engine being switched off\n\n**Type:** established\n\n**Statement:** The Canadian \"Bell DSP\" that doc 03 presents as MiQ's exclusive data door is itself powered by Xandr's buy-side platform. Bell Media's product launched in 2021 as \"SAM DSP, powered by Xandr's buying platform, Xandr Invest,\" with Bell also using Xandr's SSP (Monetize) as a preferred sell-side for its private marketplaces.\n\n**Evidence:** Bell and Xandr announced a strategic alliance on April 28, 2021 to \"deliver a proprietary omni-channel demand-side platform (DSP) for advertisers… branded SAM DSP and powered by Xandr's buying platform, Xandr Invest\" [5][6]. The platform went live in November 2021 [8]. Bell Media's materials confirm the DSP is \"powered by advanced advertising technology company Xandr,\" and that Bell leverages \"Xandr's sell-side platform (SSP), Xandr Monetize, as a preferred SSP for Bell Private Marketplaces\" [5]. Because Bell DSP's buy side IS Xandr Invest, the February 28, 2026 Invest shutdown reaches straight into the engine of the door doc 03 calls exclusive — a dependency doc 03 never surfaced.\n\n**Stakes:** load-bearing — recasts the corpus's single cleanest \"exclusive door\" example as resting on a sunset platform.\n\n**Single source:** No. Bell Media press release / Newswire [5][6] plus Media in Canada trade coverage [8].\n\n**Citation:** Bell Media, \"Bell and Xandr Join Forces to Create Canada's First Self-Serve Advertising Platform for TV and Digital,\" bellmedia.ca / Newswire, Apr 28 2021 [5][6]; Media in Canada, \"Bell's DSP goes live,\" mediaincanada.com, Nov 2 2021 [8]. Tier 1 (vendor) / Tier 4-5 (trade).\n\n**Source tier:** 4\n\n---\n\n### Claim 18.4 — MiQ's live product pages still cite \"Warner Media via Xandr,\" making the stale claim demonstrably present in the June 2026 knowledge state\n\n**Type:** established\n\n**Statement:** As of the corpus's June 2026 access date, MiQ's public Connected TV product page still names \"Warner Media through Xandr\" as a working example of its agnostic multi-DSP reach — a present-tense claim that describes a buy-side route that closes (or has just closed) on February 28, 2026.\n\n**Evidence:** Doc 03 records MiQ's CTV page citing YouTube via DV360 \"or Warner Media through Xandr\" as proof of agnostic access [doc 03, §\"agnostic\"]. Search retrieval of MiQ's live CTV page (wearemiq.com/us/media-solutions/connected-tv) in June 2026 still surfaces the identical \"YouTube via DV360, or Warner Media through Xandr\" framing [9]. This confirms the going-concern problem is not hypothetical: the corpus is quoting a vendor page that itself has not been updated to reflect the Invest sunset.\n\n**Stakes:** load-bearing — establishes that the stale claim is real and on MiQ's own site, not an artifact of the corpus.\n\n**Single source:** Yes — the live-page confirmation rests on the wearemiq.com product page itself [9]; treated as Tier 1 evidence of *what MiQ claims*, not of whether the route is operationally live.\n\n**Citation:** MiQ, \"Connected TV | MiQ US,\" wearemiq.com/us/media-solutions/connected-tv, accessed via search 2026-06-20 [9]. Tier 1 (vendor product page; evidence of MiQ's claim, not of operational reality).\n\n**Source tier:** 1\n\n---\n\n### Claim 18.5 — Microsoft's exit is read across the trade press as buy-side consolidation toward The Trade Desk, DV360, and Amazon DSP\n\n**Type:** contested\n\n**Statement:** Trade-press analysis frames the Invest shutdown as accelerating consolidation of programmatic demand around a few dominant DSPs — The Trade Desk, Google's DV360, and Amazon DSP — and as a structural signal that mid-share independent DSPs face thinning margins.\n\n**Evidence:** Digiday's ad-tech briefing on the closure (May 16, 2025) frames it as evidence that \"the industry doesn't need another DSP generating ever-thinner margins\" and as part of a consolidation-plus-AI narrative [10]. bestmediainfo names \"The Trade Desk, DV360, and Amazon DSP\" as the consolidation points the buy side concentrates around as traditional DSPs face disruption [7]. **Contested / not asserted as fact:** one AI-tool blog summary claimed Amazon DSP was Microsoft's \"named preferred migration partner\" — this could not be corroborated in any Tier 3-5 source and is **not** treated as established; Microsoft's own steering was to its first-party Microsoft Advertising Platform, not to a named third-party DSP [2][4]. The directional consolidation read is well-supported; the specific \"where Invest's spend went\" is not cleanly documented.\n\n**Stakes:** standard — supports doc 06's consolidation thesis without changing doc 03's mechanics.\n\n**Single source:** No for the consolidation framing (Digiday [10] + bestmediainfo [7]); the \"Amazon preferred partner\" sub-claim is single-source, low-tier, and explicitly rejected.\n\n**Citation:** Digiday, \"Ad Tech Briefing: Microsoft's DSP closure signals ad tech consolidation…,\" digiday.com, May 16 2025 [10]; bestmediainfo, 2026 [7]. Tier 5.\n\n**Source tier:** 5\n\n---\n\n### Claim 18.6 — Post-Xandr, MiQ's defensible live count is \"6 named rails plus whatever Bell migrates to,\" and the aggregation moat survives intact\n\n**Type:** inference\n\n**Statement:** With the Xandr/Invest buy side removed, MiQ's \"7 top TV buying platforms\" should be restated as roughly six live rails (e.g. The Trade Desk, DV360, Amazon DSP, Yahoo DSP, and other seats) plus a Canada path that must be re-grounded on Bell's post-Xandr stack; the count change does not undermine doc 03's core thesis, because that thesis already insisted the moat lives in aggregation, data layering and trading craft — not in any single pipe.\n\n**Evidence:** This is a reasoned inference, not a sourced count — MiQ does not publicly enumerate all seven named platforms with dates, so the exact post-sunset roster is undisclosed. What is documented: MiQ's political arm works with Yahoo DSP [9-adjacent trade], and MiQ's general pitch is seats across TTD / DV360 / Amazon DSP [doc 03 §Layer 2]. Doc 03 itself states the differentiation \"lives in the layering, not the pipes\" and that \"most of the underlying CTV supply MiQ buys is the same supply any competent independent can buy through the same DSPs\" [doc 03 Bottom Line]. Losing one of seven interchangeable buy-side rails therefore trims the headline number but leaves the aggregation logic — one team, one taxonomy, one frequency view, one measurement spine across many DSPs — fully intact. The genuinely scarce assets doc 03 names (Titan OS signal, Samba ACR, Bell first-party *data*) are data deals, not DSP rails; only the Bell one is mechanically entangled with Xandr, and even there the scarce asset is Bell's first-party TV data, which Bell can in principle re-platform onto another buy-side stack.\n\n**Stakes:** load-bearing — this is the corrected going-concern verdict the gap was opened to produce.\n\n**Single source:** Yes (inference; rests on doc 03's own framing plus the sourced shutdown facts above).\n\n**Citation:** Inference grounded in Claims 18.1–18.4 above and doc 03's stated aggregation thesis. No external citation for the precise count.\n\n**Source tier:** n/a (inference)\n\n---\n\n## Narrative\n\n### What doc 03 claimed, and why it is now load-bearing-wrong\n\nDoc 03's CTV chapter rests on a single structural claim: MiQ is DSP-agnostic, buying across \"7 top TV buying platforms,\" and so reaching \"inventory no single DSP can.\" To make the abstraction concrete, the chapter names examples. YouTube, it says, is reachable only through Google's DV360; certain Warner-Media inventory only through Microsoft's Xandr; premium Canadian streaming only through the Bell DSP. A single-DSP buyer \"structurally cannot touch both. MiQ can.\"\n\nTwo of those three named rails are now compromised. The Xandr one is dead. The Bell one runs on the dead one's engine. Only DV360 is unambiguously still live. That is why this is a going-concern problem and not a footnote: the corpus's cleanest, most quotable illustrations of \"agnostic reach\" point at a buy-side platform that ceases to exist on February 28, 2026.\n\nTo its credit, doc 03 flagged the Xandr risk itself — a \"live risk flag\" on the Warner-via-Xandr line, an \"At risk — verify\" cell in its rails table, and both the Xandr and Bell questions in its Open Questions. This gap answers those questions with dated sources rather than a flag. The answers: the risk has resolved against the claim, and the Bell dependency runs deeper than doc 03 realized.\n\n### The shutdown, precisely\n\nOn May 14, 2025 — in a blog post by corporate VP Kya Sainsbury-Carter — Microsoft Advertising announced it would shut its buy-side DSP, branded **Microsoft Invest**, effective **February 28, 2026** [1][2][3]. Invest descends directly from Xandr, which Microsoft bought from AT&T in 2021 (reported at roughly $1B), and from AppNexus before that [1]. AdExchanger's headline captured the lineage with a shrug — the DSP \"formerly Xandr, and formerly AppNexus before that, will just be formerly\" [1].\n\nThe shutdown is surgical. Microsoft kept its **sell-side**: Monetize (its SSP) and Curate (its curation/deals product) \"still exist and are being invested in. It is just the buy side that we deprecated,\" in Microsoft's own words [7]. So a publisher's Xandr-Monetize plumbing persists; a buyer's Xandr-Invest seat does not. Microsoft did not hand Invest's demand to a competitor. It pointed buyers at a single, AI-assisted, self-serve \"Microsoft Advertising Platform\" — a Copilot-flavored, chatbot-style buying interface — arguing that \"the industry's current DSP model\" cannot deliver \"a conversational and agentic world\" [2][4]. This dovetails with doc 12's agentic-advertising thesis: one of the largest platform owners is openly betting that the rule-based DSP is the wrong substrate for the AI era.\n\n### The Bell trap doc 03 missed\n\nHere is the finding that turns a flag into a structural correction. Doc 03 treats the Bell DSP as the corpus's rare example of a *genuinely* exclusive door — supply no competing independent can replicate, because the data is Bell's and the access runs through Bell's own platform. That is half right. The data is indeed Bell's first-party TV data, and it is scarce. But the *platform* — \"Bell DSP\" — is not Bell-built technology. Bell and Xandr announced in April 2021 that Bell's DSP, originally branded \"SAM DSP,\" would be \"powered by Xandr's buying platform, **Xandr Invest**\" [5][6]. It went live that November [8]. Bell also adopted Xandr's SSP, Monetize, as a preferred sell-side [5].\n\nSo the exclusive door MiQ leans on in Canada is cut into the wall of the building Microsoft is demolishing. When Invest shuts on February 28, 2026, the buy-side engine beneath Bell DSP is precisely the thing switching off. What Bell does next — re-platform its first-party data onto another buy-side stack (Trade Desk, Amazon DSP, a bespoke build) or migrate to Microsoft's new AI platform — is **not disclosed** in any 2026 source retrievable here. That is the single most important open question this gap surfaces, and doc 03 should state it plainly rather than leave it as a mild \"re-verify the 2023 launch.\"\n\nA scope note worth keeping honest: doc 03's Bell figures (the 2023 MiQ-Bell TV buying solution, \"300+ channels and apps,\" \"92% of Canadians watching ad-supported streaming,\" \"30M+ device connections\") describe MiQ's *data and inventory access* via Bell — a 2023 MiQ-Bell commercial arrangement layered on top of the 2021 Bell-Xandr platform. The data deal and the platform plumbing are different things. The data can in principle survive a platform migration; the specific \"available exclusively through the Bell DSP\" access path cannot survive unchanged if \"the Bell DSP\" itself has to be rebuilt.\n\n### Does the aggregation moat hold?\n\nYes — and the irony is that the Xandr news *supports* doc 03's deeper argument even as it kills two of its examples. Doc 03's real thesis was never \"MiQ has exclusive pipes.\" It was the opposite: \"most of the underlying CTV supply MiQ buys is the same supply any competent independent can buy through the same DSPs… The edge is not exclusive pipes. It is the agnostic aggregation across pipes.\" On that framing, losing one of seven roughly-interchangeable buy-side rails is a headline-number problem, not a moat problem. The aggregation craft — one team, one taxonomy, one frequency cap, one measurement spine spanning whatever DSPs are live this quarter — is exactly the capability that *absorbs* a rail going dark. An agnostic aggregator is, almost by definition, the entity least hurt when one DSP closes: it reroutes.\n\nWhat genuinely thins is the corpus's evidence base for \"an exclusive door.\" After this correction, the cleanly-exclusive assets doc 03 can still point to are data deals, not DSP rails: Titan OS operating-system signal (re-verified separately in doc 13), Samba ACR (doc 14), and Bell's first-party TV *data* (entangled with the Xandr platform, per above). Two of those three carry going-concern caveats in their own gap docs. So the honest restatement is this: MiQ's moat is aggregation + data-layering + trading craft, with a *handful* of scarce data deals on top, at least one of which (Bell) now needs re-platforming. That is a defensible position, if a less glittering one — and it is the one doc 03 actually argued for.\n\n### The required edits to doc 03\n\n1. **Mark the \"7 top TV buying platforms\" framing as stale.** Restate as \"~6 live named rails (TTD, DV360, Amazon DSP, Yahoo DSP, and additional seats) plus a Canada path being re-platformed,\" and note that MiQ's own product pages had not been updated as of June 2026.\n2. **Recast \"Warner via Xandr\" as historical, not live.** The route closes Feb 28, 2026; flag the line \"historically illustrative — the underlying buy-side DSP (Microsoft Invest, formerly Xandr) shut on 2026-02-28.\"\n3. **Upgrade the Bell caveat from \"re-verify\" to \"depends on a sunset platform.\"** State explicitly that Bell DSP was Xandr-Invest-powered and that the post-Feb-2026 stack is undisclosed.\n4. **Preserve the aggregation-moat thesis** but remove Xandr and (pending Bell re-platforming confirmation) Bell from the \"exclusive door\" column; keep them, where data survives, only as data-access claims.\n\n---\n\n## Open Questions\n\n1. **What does Bell migrate its DSP to after Feb 28, 2026?** No 2026 source retrievable here discloses Bell's replacement buy-side stack. Does Bell rebuild on The Trade Desk, Amazon DSP, a bespoke platform, or Microsoft's new AI platform — and does MiQ's exclusive access to Bell first-party TV data survive the migration intact?\n2. **Has MiQ updated its product pages post-sunset?** As of June 2026 the wearemiq.com CTV page still cited \"Warner Media through Xandr.\" When (if) MiQ refreshes, what replaces the Xandr example — and does the platform count drop publicly to six?\n3. **Where did Invest's actual demand go?** The consolidation read (TTD/DV360/Amazon) is directional; no Tier 3-5 source cleanly documents Invest's spend migration, and the \"Amazon preferred partner\" claim is uncorroborated AI-content-farm material that should not be cited.\n4. **Is Warner-Media inventory reachable for MiQ on a surviving rail?** Warner streaming supply did not vanish with Xandr; it is presumably buyable via other DSPs and via Microsoft Curate. Confirming the new path would let doc 03 keep a live Warner example instead of a dead one.\n\n---\n\n## Sources\n\n1. AdExchanger, \"Microsoft Is Shutting Down Invest, The One-Time AppNexus DSP Business,\" adexchanger.com, May 14 2025. https://www.adexchanger.com/online-advertising/microsoft-invest-formerly-xandr-dsp-and-formerly-appnexus-before-that-will-just-be-formerly/ (accessed 2026-06-20). Tier 5 (specialized ad-tech trade press). — Lineage (AppNexus→Xandr→Invest), ~$1B AT&T acquisition, announcement.\n2. Digiday, \"Microsoft Advertising is closing the Xandr DSP, layoffs pending,\" digiday.com, May 14 2025. https://digiday.com/media-buying/microsoft-advertising-is-closing-the-xandr-dsp/ (accessed 2026-06-20). Tier 5. — Feb 28 2026 effective date; buy-side-only; steering to Microsoft Advertising Platform / Curate / Monetize; the \"current DSP model… not achievable\" quote; layoffs.\n3. bestmediainfo, \"Microsoft Advertising to shut down Xandr DSP, shifts focus to AI-driven ad solutions,\" bestmediainfo.com, 2025. https://bestmediainfo.com/mediainfo/mediainfo-digital/microsoft-advertising-to-shut-down-xandr-dsp-shifts-focus-to-ai-driven-ad-solutions-9070068 (accessed 2026-06-20). Tier 5. — Kya Sainsbury-Carter named; \"exclusively focusing… on the Microsoft Advertising Platform\" from 2026.\n4. Media in Canada, \"Microsoft shuts down its DSP, shifts focus to own AI-powered ad platform,\" mediaincanada.com, May 23 2025. https://mediaincanada.com/2025/05/23/microsoft-dsp-ai/ (accessed 2026-06-20). Tier 4-5 (Canadian trade). — Feb 28 2026 date; AI/Copilot pivot; Canadian-market framing.\n5. Bell Media, \"Bell and Xandr Join Forces to Create Canada's First Self-Serve Advertising Platform for TV and Digital,\" bellmedia.ca, Apr 28 2021. https://www.bellmedia.ca/the-lede/press/bell-and-xandr-join-forces-to-create-canadas-first-self-serve-advertising-platform-for-tv-and-digital/ (accessed 2026-06-20). Tier 1 (vendor press release — evidence of what Bell/Xandr claim). — \"SAM DSP, powered by Xandr Invest\"; Monetize as preferred SSP.\n6. Newswire / BusinessWire, \"Bell and Xandr Join Forces…,\" newswire.ca / businesswire.com, Apr 28 2021. https://www.newswire.ca/news-releases/bell-and-xandr-join-forces-to-create-canada-s-first-self-serve-advertising-platform-for-tv-and-digital-852374051.html (accessed 2026-06-20). Tier 1/3. — Corroborates the SAM DSP / Xandr Invest dependency.\n7. bestmediainfo, \"What Microsoft's Xandr Invest shutdown says about the future of traditional DSPs,\" bestmediainfo.com, 2026. https://bestmediainfo.com/mediainfo/mediainfo-digital/what-microsofts-xandr-invest-shutdown-says-about-the-future-of-traditional-dsps-11261312 (accessed 2026-06-20). Tier 5. — Buy-side-only confirmation; \"Curate and Monetize still exist\" quote; TTD/DV360/Amazon consolidation framing; Nick Seckold \"not part of the AI future\" quote.\n8. Media in Canada, \"Bell's DSP goes live,\" mediaincanada.com, Nov 2 2021. https://mediaincanada.com/2021/11/02/bells-dsp-goes-live/ (accessed 2026-06-20). Tier 4-5. — Bell DSP go-live date; Xandr-powered.\n9. MiQ, \"Connected TV | MiQ US,\" wearemiq.com/us/media-solutions/connected-tv (accessed via search 2026-06-20). Tier 1 (vendor product page — evidence of MiQ's claim, not operational reality). — Still cites \"YouTube via DV360, or Warner Media through Xandr\" in June 2026.\n10. Digiday, \"Ad Tech Briefing: Microsoft's DSP closure signals ad tech consolidation, as well as the AI arms race,\" digiday.com, May 16 2025. https://digiday.com/media-buying/ad-tech-briefing-microsofts-dsp-closure-signals-ad-tech-consolidation-as-well-as-the-ai-arms-race/ (accessed 2026-06-20). Tier 5. — \"the industry doesn't need another DSP generating ever-thinner margins\"; consolidation thesis.\n\n---\n\n*Sourcing note: This gap rests on Tier 5 specialized ad-tech trade press (Digiday, AdExchanger, bestmediainfo, Media in Canada) corroborating a Microsoft corporate announcement (Tier 1 for what Microsoft claims). Microsoft's own shutdown blog post is the underlying primary document; it was not fetched in original here and is listed below as a primary text not yet consulted. The \"Amazon DSP as preferred migration partner\" claim surfaced only in an AI-tool blog (getuntitled.ai) and is explicitly NOT used as a fact, per the cardinal no-fabrication / no-AI-content rule. Bell's post-sunset migration stack is undisclosed in available 2026 sources and is flagged as the central open question rather than asserted.*"}, {"order": 19, "file": "19_Gap_Pathlabs_Dentsu_Going_Concern.md", "title": "The Pathlabs MEP Bet and the Dentsu Anchor", "summary": "", "body": "# The Pathlabs MEP Bet and the Dentsu Anchor\n\n## Bottom Line\n\nThe case that MiQ's commercial validation is stronger than its technical validation rests on two external proof points. A look at the dated record as of mid-2026 splits them apart: one is stronger than the headline claim, the other weaker. **Pathlabs is unambiguously a live, growing MiQ-owned brand.** An April 27, 2026 Pathlabs post confirms William Lapointe is still CEO, the Media Execution Partner (MEP) model is still the core product, and the unit has posted 188% growth, landing on the Inc. 5000 for two consecutive years, with retrospective scale figures of 50+ agency clients and $200M+ in annual media spend [1][2][3]. That pillar holds, and is best read not as \"confirmed only at 2024 acquisition\" but as a confirmed 2026 going concern. **The Dentsu anchor does not hold at the strength its press coverage implies.** The only substantive coverage is still the June 12, 2025 announcement. The most recent independent quote on actual usage — Dentsu's James Banks, June 9, 2025 — said Dentsu \"isn't using Sigma yet.\" And MiQ's own June 11, 2026 one-year Sigma update, the freshest dated source, **drops Dentsu and the Large Media Model entirely**, leading instead with platform-integration partners (PubMatic, Yahoo, Magnite) and self-reported aggregate metrics [4][5][6][7]. No 2026-dated source confirms a scaled Dentsu production deployment, names a deploying agency (Carat/iProspect/dentsu X/Amplifi), or reports an LMM result. The deal is explicitly non-exclusive, matched by MiQ's pre-existing relationships with Havas, Publicis, and WPP [5]. Net: MiQ's strongest piece of *external* commercial validation is, on the dated record, still an announcement — not a deployment.\n\n---\n\n## 1. Pathlabs — Verdict: CONFIRMED (and stronger than the headline suggests)\n\n**Answer first: Pathlabs is a live, independently branded, growing MiQ-owned MEP as of April 2026. William Lapointe is still CEO. The indie-agency MEP product has not been renamed, folded, or sunset, and there is dated evidence of scaled adoption — not just an announcement.**\n\nThe independent-business-unit structure was clearest at the July 2024 acquisition; the open question was whether Pathlabs still operated under its own brand in 2026. The 2026-dated primary sources below settle it.\n\n### Pathlabs operates as a live, MiQ-owned brand in 2026 with William Lapointe still CEO\n\nA Pathlabs newsroom post dated **April 27, 2026** announces that \"Pathlabs CEO William Lapointe has been named a finalist for the 2026 Digiday Future Leader Awards,\" confirming both that Lapointe remains in the chief-executive seat and that the company is operating and self-promoting under its own brand nearly two years post-acquisition [1]. The same post states: \"In 2024, global programmatic leader MiQ acquired Pathlabs, a milestone that validated what the team had been building all along\" — confirming the ownership relationship persists and is framed positively by Pathlabs itself [1]. The live Pathlabs homepage carries a \"© 2026 Pathlabs\" footer, still leads with \"Explore MEP,\" and still describes the company as \"an end-to-end media execution partner built for agencies\" [2]. The site's wordmark file is named \"Pathlabs_MiQ_Wordmark,\" indicating co-branding rather than a sunset of the Pathlabs identity [2].\n\n### The MEP product is intact and there is dated evidence of scaled adoption, not just announcement\n\nThe open question was whether Pathlabs is demonstrably cross-selling or still operating as a ring-fenced unit. On adoption, the April 2026 post supplies retrospective scale figures: by around the 2024 acquisition the company \"had grown to over 100 employees, supported more than 50 agency clients, and managed upward of $200 million in annual media spend\" [1]. The Pathlabs newsroom additionally lists \"188% Growth Lands Pathlabs on Inc. 5000 for Two Consecutive Years,\" a third-party-list placement that is a recognized (if self-promoted) growth signal, plus references to operations \"in India\" and continued workplace awards [3]. The MEP product — \"a framework that embeds the team, tools, and operational support directly into how agencies work\" — is described in the present tense as the operational core, not a legacy offering [1][2]. The 50-client / $200M / 188% figures originate in Pathlabs' own content [1][3] and are vendor self-reporting: they evidence a live, scaling brand, but the dollar and client counts are unaudited and pre-date the acquisition rather than measuring post-acquisition cross-sell. What is *not* found in any dated source is a hard figure for Sigma cross-sell penetration into the Pathlabs book — i.e., how much of that $200M now runs on MiQ's stack. That integration question remains genuinely open; \"the brand is alive and growing\" is confirmed, \"the synergy is realized\" is not.\n\n### Going-concern read on Pathlabs\n\nEarlier caution on Pathlabs was warranted, but the question is now **resolved in the affirmative**: the standalone brand is intact, the CEO is unchanged, the MEP product is the live core, and dated evidence shows a growing — not stalling — unit. If anything, Pathlabs is the *stronger* of the two commercial-validation pillars: it is an owned asset MiQ controls and can report on, and it shows organic momentum. The residual caveat is synergy, not survival. MiQ has not publicly quantified how much Sigma/CTV stack the Pathlabs agency book actually consumes, so \"Pathlabs validates the indie-agency MEP thesis\" is confirmed while \"Pathlabs validates the Sigma cross-sell thesis\" is not yet evidenced.\n\n---\n\n## 2. Dentsu — Verdict: UNCONFIRMED AT SCALE (weaker than the coverage implies)\n\n**Answer first: as of June 2026, the only substantive public evidence of the Dentsu–Sigma relationship is the June 12, 2025 announcement and the \"live experiments underway\" language in it. No 2026-dated source confirms a scaled production deployment, names a deploying Dentsu agency, or reports a Large Media Model result. The most recent independent quote on actual usage — June 9, 2025 — has Dentsu's own digital head saying Dentsu \"isn't using Sigma yet.\" MiQ's freshest dated communication, the June 11, 2026 one-year Sigma update, omits Dentsu and the LMM entirely.**\n\nThis is the load-bearing finding. Dentsu is routinely presented as MiQ's single strongest piece of *external* commercial validation — the strongest external validation being commercial, not technical. The right way to read it is the hedge, not the headline: \"deployed across all managed campaigns\" is best treated as a stated intent in mid-2025, not a verified production state. The accurate description as of June 2026 follows.\n\n### The Dentsu–Sigma deal is documented only at announcement (June 2025); no 2026-dated production status exists\n\nThe June 12, 2025 dentsu.com release and MiQ's mirror position Dentsu as MiQ's official \"Intelligence Partner\" and \"the first holding company to integrate MiQ Sigma… at the strategic centre of the media practice,\" with \"live experiments underway across global markets\" testing \"scalability and effectiveness\" [4][5]. MediaPost's June 12, 2025 coverage (\"Dentsu Goes All-In With MiQ, Claims Industry-First Integration\") reports the deal but states the companies \"did not indicate whether the deal is exclusive,\" and notes MiQ already works with Havas, Publicis, and WPP [5]. Every dated source describing the relationship's *substance* traces to this June 2025 window. No later substantive update on production status, named agencies, LMM outcomes, or market-by-market rollout has surfaced — only re-syndications of the original announcement [4][5][8]. The announcement itself is well-corroborated; the *absence* of a 2026 follow-up is the finding, consistent across MiQ, Dentsu, and trade press.\n\n### MiQ's own June 11, 2026 one-year Sigma update drops Dentsu and the Large Media Model\n\nThe freshest dated MiQ communication is the **June 11, 2026** \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate\" release and its trade coverage (PPC Land, citybiz) [6][7]. This is exactly where a maturing flagship holdco deployment would be showcased. Instead, the one-year update leads with self-reported aggregate metrics — \"more than 2,300 advertisers,\" \"over 40,000 campaigns,\" \"$2.22 in value for every $1 spent\" — and with *platform-integration* partners: the Sigma Trading Agent operating inside PubMatic's AgenticOS, Yahoo DSP, and Magnite's SpringServe [6][7]. **Dentsu is not mentioned. The Large Media Model is not mentioned. No named holdco deployment is mentioned** [6][7]. A year after being billed as MiQ's strongest external validation, Dentsu is absent from MiQ's own anniversary milestone. This absence is confirmed across the BusinessWire release [6] and independent PPC Land coverage [7].\n\n### The \"not using Sigma yet\" signal predates the deal by three days and has no dated rebuttal\n\nJames Banks (head of digital, Dentsu's Amplifi Global) was quoted via AdExchanger saying Dentsu \"isn't using Sigma yet.\" The AdExchanger piece is dated **June 9, 2025** — the Sigma *launch* coverage — and the quote reads, \"Although Dentsu isn't using Sigma yet, Banks said he believes the platform has the potential to improve outcomes for its client base\" [9]. The Dentsu *partnership* was then announced **June 12, 2025**, three days later [4][5]. So MiQ's strongest external-validation deal was announced in the same week that Dentsu's own digital lead publicly stated Dentsu was not yet a user — and no later dated source rebuts that \"not yet.\" The framing that Dentsu put Sigma \"at the strategic centre\" of its media practice is a direct quotation of the announcement's language [4], not an independent verification of production use. The Banks quote is a primary on-record statement from a named Dentsu executive, not an anonymous claim, and it is internally consistent with the absence noted above.\n\n### The Dentsu relationship is non-exclusive and matched by rival-holdco relationships\n\nThe MediaPost coverage states the parties \"did not indicate whether the deal is exclusive\" and notes MiQ \"already works with Havas, Publicis, and WPP\" [5]. MiQ continues to recruit \"Head of Agency Partnerships (WPP, Publicis)\" roles into 2025–2026, confirming active, ongoing non-Dentsu holdco relationships [10]. The Dentsu deal is therefore not exclusive: Dentsu is one of several holdco relationships, distinguished by the \"Intelligence Partner\" branding and the LMM proof-of-concept rather than by exclusivity. No evidence surfaced of a *rival* holdco signing an equivalent \"Sigma at the strategic centre\" arrangement — so Dentsu's announcement remains the most prominent holdco framing, even as its production reality is unconfirmed.\n\n### Going-concern read on Dentsu\n\nThe Dentsu pillar is the most overstated current-tense claim about MiQ. Nothing here refutes that a deal exists — it plainly does, and Dentsu's name on a press release is itself a real external signal. But the load-bearing thesis is specifically that **commercial validation is stronger than technical validation**, and Dentsu is the keystone of the \"commercial\" side. On the dated June 2026 record:\n\n- There is **no confirmed scaled production deployment** of Sigma at Dentsu.\n- There is **no named deploying agency** (Carat/iProspect/dentsu X/Amplifi).\n- There is **no reported LMM outcome**; the LMM is last described as a \"proof of concept\" / \"live experiments\" in June 2025 and is absent from the June 2026 update.\n- The most recent on-record usage statement (June 9, 2025) is \"not using Sigma yet,\" with no dated rebuttal.\n- MiQ's own one-year milestone omits Dentsu, leading instead with platform integrations and self-reported aggregate metrics.\n\nThe honest characterization is **the hedge, not the headline**: a mid-2025 stated intent and an active test program, with no public evidence of scaled production use a year on. \"First holdco to put Sigma at the strategic centre\" is a quotation of the announcement, and announcements are evidence of *what was claimed*, not of *what is operating*.\n\n---\n\n## 3. What the Split Verdict Means\n\nIf either pillar had stalled, downgraded, or been restructured, the \"commercial validation is stronger than technical validation\" thesis would weaken. The split verdict refines rather than collapses that thesis:\n\n1. **Pathlabs strengthens the thesis — but for the indie-agency side, not the Sigma side.** Pathlabs is a confirmed, growing, owned going concern. It validates that MiQ can buy and operate a distribution channel into the indie long tail. It does *not*, on present evidence, validate that the Sigma platform is being adopted at scale through that channel.\n\n2. **Dentsu weakens the *external*-validation leg specifically.** The strongest claim to outside-the-building validation of *Sigma itself* is, on the dated record, an unscaled announcement — contradicted in the same week by the customer's own digital head, and unmentioned in MiQ's latest update. The \"commercial > technical\" framing should be qualified. MiQ's commercial validation is strongest where MiQ *owns the asset* (Pathlabs, the 2,300-advertiser self-reported base) and weakest exactly where it would matter most for the thesis: *independent* third-party adoption of the platform at a marquee holdco.\n\n3. **The sharpest reading of the whole picture.** Pathlabs is confirmed live and growing as of April 2026 — Lapointe still CEO, Inc. 5000 two years running — while the extent of Sigma cross-sell through it stays open. Dentsu is best described not in the current tense (\"put Sigma at the strategic centre / deployed across managed campaigns\") but as announced in June 2025 as a strategic partnership and LMM proof-of-concept, with no public evidence of scaled production deployment as of June 2026, absent from MiQ's June 2026 one-year update, and with the customer's own digital head having said \"not using Sigma yet\" three days before the announcement. The cleanest summary, then: MiQ's commercial validation is strongest in the assets it owns; its strongest *independent* validation, Dentsu, remains an announcement, not a verified deployment, as of June 2026.\n\n---\n\n## Open Questions\n\n1. **Has Dentsu deployed Sigma in production anywhere by mid-2026, and at what scale?** No dated evidence located. A single named campaign or agency would change the verdict materially.\n2. **Is the Large Media Model still active?** Last described as a June 2025 proof-of-concept; absent from the June 2026 update. Quietly dropped vs. merely not-yet-reported is unresolved.\n3. **How much of Pathlabs' ~$200M annual media spend now runs on MiQ's Sigma/CTV stack?** The Pathlabs-as-going-concern question is answered; the Pathlabs-as-Sigma-cross-sell question is not.\n4. **Did any rival holdco sign an equivalent \"Sigma at the strategic centre\" deal?** None found; Dentsu remains the most prominent holdco framing despite its unconfirmed production state.\n5. **Will MiQ's next earnings-adjacent or anniversary communication re-introduce Dentsu?** Its omission from the June 2026 update is the single most telling datapoint; a reappearance (or continued silence) at the next milestone would resolve the trajectory.\n\n---\n\n## Sources\n\n1. Pathlabs, \"Pathlabs CEO William Lapointe Named Finalist for 2026 Digiday Future Leader Awards,\" 2026-04-27. https://www.pathlabs.com/blog/2026-digiday-future-leader-awards — Tier 1 (company content; treat self-reported scale figures as claims). Confirms Lapointe CEO 2026, MiQ ownership, MEP core, retrospective 50+ clients / $200M+ spend. Accessed 2026-06-20.\n2. Pathlabs homepage, \"© 2026 Pathlabs.\" https://www.pathlabs.com/ — Tier 1 (vendor). Live brand 2026, \"Explore MEP,\" \"Pathlabs_MiQ_Wordmark\" co-branding. Accessed 2026-06-20.\n3. Pathlabs Newsroom. https://www.pathlabs.com/news — Tier 1/6 (company content). \"188% Growth Lands Pathlabs on Inc. 5000 for Two Consecutive Years,\" India operations, ongoing awards; CEO Lapointe in present tense. Accessed 2026-06-20.\n4. Dentsu, \"Dentsu Selects MiQ Sigma To Help Power Next Gen Media Operations,\" news release, 2025-06-12. https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — Tier 1 (corporate release; claim, not fact). \"Intelligence Partner,\" \"first holding company to integrate… at the strategic centre,\" LMM proof-of-concept, \"live experiments underway.\" Accessed 2026-06-20.\n5. MediaPost (MediaDailyNews), \"Dentsu Goes All-In With MiQ, Claims Industry-First Integration,\" 2025-06-12. https://www.mediapost.com/publications/article/406608/dentsu-goes-all-in-with-miq-claims-industry-first.html — Tier 4 (trade/major outlet). Companies \"did not indicate whether the deal is exclusive\"; MiQ already works with Havas, Publicis, WPP; quote from Dentsu's Clive Record; no operational-deployment evidence. Accessed 2026-06-20.\n6. MiQ / BusinessWire, \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate,\" 2026-06-11. https://www.businesswire.com/news/home/20260611682662/en/MiQ-Sigma-Expands-with-New-Data-Capabilities-and-Ways-to-Activate — Tier 1 (company release). One-year update: 2,300+ advertisers, 40,000+ campaigns, $2.22/$1; PubMatic/Yahoo/Magnite integrations; **no Dentsu, no LMM**. Accessed 2026-06-20.\n7. PPC Land, \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" 2026-06-11. https://ppc.land/miq-upgrades-sigma-a-year-in-planning-agent-and-2-5pb-of-daily-data/ — Tier 5 (specialized trade press). Independent confirmation that the one-year update centers on platform integrations and aggregate metrics; Dentsu/LMM/Pathlabs not mentioned. Accessed 2026-06-20.\n8. citybiz, \"MiQ Expands Sigma Platform With New AI Planning and Measurement Tools,\" 2026-06. https://www.citybiz.co/article/859065/miq-expands-sigma-platform-with-new-ai-planning-and-measurement-tools/ — Tier 5 (trade). Syndicated one-year-update coverage; rollout markets US/CA/UK/AU + select international through 2026. Accessed 2026-06-20.\n9. AdExchanger, \"MiQ Aims To Unify Fragmented Data Landscape With New AI-Powered Ad Platform,\" 2025-06-09. https://www.adexchanger.com/technology/miq-aims-to-unify-fragmented-data-landscape-with-new-ai-powered-ad-platform/ — Tier 5 (specialized ad-tech trade press). Sigma launch coverage; James Banks (Dentsu/Amplifi Global): \"Although Dentsu isn't using Sigma yet…\"; dated three days before the partnership announcement. Accessed 2026-06-20.\n10. MiQ / Built In, \"Head of Agency Partnerships (WPP, Publicis) — MiQ Digital,\" 2025–2026 job posting. https://builtin.com/job/head-agency-partnerships-wpp-publicis/4627918 — Tier 1 (company posting). Evidence of active, ongoing non-Dentsu holdco relationships (WPP, Publicis), corroborating non-exclusivity. Accessed 2026-06-20."}, {"order": 20, "file": "20_Gap_TradeDesk_Dependency_Channel_Conflict.md", "title": "The Rail Is the Rival: Mapping MiQ's Bilateral Dependency on The Trade Desk", "summary": "", "body": "# 20 — The Rail Is the Rival: Mapping MiQ's Bilateral Dependency on The Trade Desk\n\n## Bottom Line\n\nMiQ's single most concentrated supplier risk hides in plain sight, named across five documents but never mapped: **The Trade Desk is at once MiQ's primary buying rail and its primary competitor.** A large but undisclosed share of MiQ's managed-service spend runs *through* TTD's platform; the bidding that actually moves MiQ's clients' money very often happens inside Kokai, TTD's own software. That same platform is, by Jeff Green's explicit February 2026 framing, on a roadmap to \"increase the number of advertisers where we have direct relationships\" [1]. And every marquee 2024-2026 TTD product — Kokai's AI decisioning, Koa agents, OpenPath's supply-path disintermediation, the Ventura TV OS — moves TTD *toward the advertiser* and *toward the OS-and-data layer* that MiQ claims as its own differentiated value. On paper this looks lethal: your largest supplier is building the exact capabilities that would let it bypass you.\n\nThe honest read is more bounded, and it cuts both ways. **The disintermediation vectors are real but mostly aimed elsewhere.** TTD's go-to-market reorganization targets the *holdco trading desks* and the largest brands' agencies, not independent specialists serving mid-market and other agencies. OpenPath removes the *SSP/supply-side* layer and the holdco SPO margin, not the buy-side managed service. Ventura competes with Roku and Amazon's *device OS*, not with MiQ's TV Intelligence data panel. Koa agents, as of mid-2026, speed campaign *setup*, not autonomous buying. And the steelman for MiQ is genuinely strong and structurally grounded: **TTD's platform carries real minimum-spend floors and operational complexity that make it uneconomic to service mid-market brands and small agencies directly — which is exactly why TTD runs a Certified Service Partner reseller program at all** [2]. TTD needs aggregators to reach demand it cannot profitably touch.\n\nThe decisive complication is the 2025 stock collapse and the 2026 agency revolt. TTD fell ~68% in 2025 and guided Q1 2026 to just 10% growth — down from 26% in 2024 [3][1]. A growth-pressured TTD, with three of the five largest holdcos (Publicis, WPP, Dentsu) in open conflict over fees and OpenPath in early 2026 [4][5], faces structural pressure to *push more direct* and *defend take rate* — both of which squeeze intermediaries on margin and access over time. **But here is the load-bearing nuance MiQ should be grateful for: MiQ is notably NOT a TTD Certified Service Partner** [2]. Its relationship is that of a large independent buyer/agency that routes spend across TTD, DV360, and Amazon DSP by performance, not a contractual reseller locked to TTD's rails. That agnosticism is MiQ's single best protection: when TTD squeezes or when Amazon wins, MiQ can re-route. The verdict through 2029: **the supplier-is-also-rival dynamic is survivable but margin-eroding, and survivability depends entirely on MiQ's multi-DSP optionality and its owned TV data holding — not on the TTD relationship itself, which is the part most exposed to repricing.**\n\n---\n\n## 1. The Dependency, Quantified As Far As the Record Allows\n\n### Claim 20.1 — MiQ runs a material but publicly undisclosed share of managed-service spend through The Trade Desk; no figure is verifiable from public sources\n\nMiQ describes itself as \"agnostic\" and multi-DSP — it will run a campaign \"on The Trade Desk, on Amazon DSP, on DV360, on whatever performs\" [doc 06; 6]. The bidding for a meaningful share of MiQ's book happens *inside* one of those three DSPs; MiQ's Sigma layer interprets briefs and identifies segments \"for activation across DSPs,\" with the DSP remaining the activation engine [doc 06]. TTD is repeatedly named as MiQ's reference DSP and the rail it most associates itself with publicly: MiQ publishes TTD-hosted case studies on CTV success and SPO methodology, uses TTD's TV Quality Index and Volume Control API, and built an SPO solution showcased *on TTD's own resource site* [7][8].\n\n**But the specific share — what fraction of MiQ's managed-service media spend flows through TTD vs. DV360 vs. Amazon DSP — appears nowhere in the public record.** MiQ is privately held (Bridgepoint-owned) and publishes no breakdown; TTD does not disclose client-level concentration; no trade outlet has reported a figure. This is the same gap doc 06 flags as an open question (\"No public disclosure breaks MiQ revenue into data-led, execution, and pass-through DSP reselling\"). I searched primary filings, trade press, and both companies' materials and found no number. **Anyone citing a specific MiQ-through-TTD percentage is citing something that does not exist.**\n\n- **Type:** established (the dependency exists and is material; the *magnitude* is explicitly unknowable)\n- **Stakes:** load-bearing\n- **Single-source:** no (multiple corroborating sources for the qualitative dependency; the magnitude is confirmed-absent across all of them)\n\n### Claim 20.2 — MiQ is NOT a named Trade Desk \"Certified Service Partner\"; its relationship is that of a large independent buyer/agency, which is a protection, not a weakness\n\nTTD operates a formal **Certified Service Partner** program for resellers and managed-service shops that extend its platform to brands and agencies \"of all sizes,\" explicitly to reach the mid-market and SMB demand TTD cannot service directly [2]. As of mid-2026 the named certified partners are **Goodway Group, Mogl (formerly Ventura Growth), and MINT Square GmbH** (an EMEA reseller) — **MiQ is not on the list** [2].\n\nThis matters more than it first appears. A Certified Service Partner is, by construction, *tied* to TTD's rails — its business is reselling TTD. MiQ's public posture is the opposite: DSP-agnostic by design, free to route spend to whichever DSP performs. So MiQ's relationship with TTD is the looser, more defensible one — a high-volume buyer/agency that *uses* TTD heavily but is not contractually its reseller. **The missing certification is, paradoxically, MiQ's protection:** it is not locked in, and it can re-route under repricing pressure. This is the structural difference between MiQ and the 2013-era holdco desks, and it is the hinge of the whole survivability question.\n\n- **Type:** established\n- **Stakes:** load-bearing\n- **Single-source:** yes (the certified-partner roster is from TTD's own partner page [2]; the interpretive claim that non-certification is a *protection* is my inference, flagged as such)\n\n### Claim 20.3 — TTD's scale and minimum-spend floors structurally require resellers/aggregators to reach mid-market demand — the steelman for MiQ's seat at the table\n\nTTD is \"generally better suited to mid-market and enterprise brands or agencies due to its complexity and typical minimum spend expectations\"; smaller organizations \"often work through an agency, a reseller partner, or choose a more lightweight DSP\" [9; Tier 5, vendor-comparison lean]. TTD launched its Certified Service Partner program *precisely* to \"expand self-service access\" for small and mid-market businesses that \"may find the platform too advanced and costly\" [2][9]. Jeff Green's own framing confirms the top-heaviness: TTD serves \"most of the world's largest advertisers,\" \"the vast majority of the S&P 500 are clients,\" and its 2026 go-to-market upgrade is about deepening relationships with \"the world's largest advertisers and agencies\" [1].\n\nThe implication is the steelman MiQ would offer: **a platform optimized for the S&P 500 and routed through joint business plans with the biggest holdcos cannot economically run a $40K mid-market CTV campaign for a regional brand, or service the long tail of independent agencies that lack programmatic staff.** That is the demand MiQ aggregates. TTD *needs* the aggregator layer to monetize the mid-market it cannot touch — and MiQ, with ~2,500 advertisers and a book that is \"often other agencies\" [doc 06], sits squarely in that layer.\n\n- **Type:** established\n- **Stakes:** load-bearing\n- **Single-source:** no (TTD's own remarks [1] + partner program [2] + trade comparison [9])\n\n---\n\n## 2. The Channel Conflict, Mapped Vector by Vector\n\nTTD's product roadmap moves it toward the advertiser and toward the OS/data layer on four fronts. The corpus names all four but never lines them up against MiQ's claimed value. Here they are, each scored for how *directly* it disintermediates MiQ.\n\n### Claim 20.4 — TTD's 2026 go-to-market reorganization is an explicit direct-to-advertiser push — but aimed at holdcos and the largest brands, not independent mid-market specialists\n\nIn the Q4 2025 call (Feb 25, 2026), Jeff Green said TTD \"reorganized our go-to-market model around a brand-first, more integrated coverage approach,\" with unified teams owning \"both business development and spend activation,\" and — critically — \"**we increased the number of advertisers where we have direct relationships, and we eliminated overlapping coverage between advertiser and agency teams**\" [1]. Joint business plans (JBPs) now account for \"well over half of our business,\" with the JBP pipeline \"more than doubled\" [1]. This is, unambiguously, TTD building direct lines to advertisers.\n\n**But read the object of the sentence.** The direct relationships TTD is building are with \"the biggest brands in the world\"; the JBPs are \"for our largest advertisers and their agencies.\" This is a move against the *holdco agency layer* on TTD's largest accounts — the same accounts where Publicis, WPP, and Dentsu went into open conflict with TTD in early 2026 (Section 3). It is not a move to service the mid-market brand or the independent agency MiQ aggregates. The disintermediation vector is real, but pointed at a different intermediary than MiQ.\n\n- **Type:** established (the go-to-market change is a primary-source quote; the *targeting* interpretation is supported by the same text but is partly inference)\n- **Stakes:** load-bearing\n- **Single-source:** yes (TTD prepared remarks [1] — primary, but a single document)\n\n### Claim 20.5 — OpenPath disintermediates the SSP/supply-side and the holdco SPO margin, not the buy-side managed service — an indirect threat to MiQ, not a direct one\n\nOpenPath (launched 2022) creates direct DSP-to-publisher connections, \"removing several layers of intermediary from the supply chain\" [10]. Its disintermediation pressure runs primarily *supply-side*: it squeezes SSPs by letting publishers access TTD demand directly [11], and it \"removes the agency's supply-path-optimisation layer\" — an SPO service \"agency trading desks charge for and earn margin on\" — by positioning the path \"at cost\" [5][12]. TTD frames it as buyer-pulled: VP Will Doherty says \"many of our buyers [primarily media agencies] have been pushing us to do this\" [12].\n\nFor MiQ the threat is **indirect and partial.** MiQ's own SPO offering — its PMP-based supply curation, sold as a value-add — overlaps with what OpenPath commoditizes. If OpenPath makes \"clean,\" low-fee supply paths a platform default, the margin MiQ can charge for SPO craft compresses. But OpenPath does not touch MiQ's core managed-service execution, its data, or its audience work; it attacks one service line, not the business. And notably, MiQ *publishes its SPO methodology on TTD's own site* [8] — positioning its SPO as complementary to TTD's plumbing, not in opposition to it (today).\n\n- **Type:** established\n- **Stakes:** standard\n- **Single-source:** no ([5][10][11][12])\n\n### Claim 20.6 — Ventura (TTD's CTV operating system) moves TTD into the OS/signal layer MiQ claims, but competes with Roku/Amazon device OSes, not directly with MiQ's TV Intelligence data panel\n\nVentura, announced November 2024 and expanded to a \"Ventura Ecosystem\" in February 2026, is TTD's content-agnostic smart-TV operating system [13][14]. Its pitch is *neutrality*: unlike Google, Amazon, and Roku — which run content, streaming, and ad platforms simultaneously — TTD \"do not have our own content service\" and so can offer \"better signal for both advertisers and publishers\" about where ad dollars land [13]. First collaborators include V (formerly VIDAA), Nexxen, DirecTV, and TCL [13][14]; CEO Jeff Green has denied it is competitive with Roku, calling Roku an ad partner [14].\n\nThe relevance to MiQ is structural, not head-to-head. Ventura moves TTD *into the OS and TV-signal layer* — the same territory where MiQ stakes its differentiation (TV Intelligence, the 90M-household / 6.4-trillion-signal panel, the Titan OS and Samba ACR partnerships). If TTD owns the device OS, it owns a first-party CTV signal source MiQ today *rents* from Samba, Titan, and others (doc 09, doc 14). **The conflict is not \"Ventura competes with MiQ's panel\" — it is \"Ventura gives TTD an owned TV-data asset MiQ has to license.\"** That widens, over time, the very supplier-power gap doc 09 identifies as MiQ's real moat risk. But Ventura is early — \"in user testing,\" \"playing the long game,\" significant OEM switching costs [13] — so the threat is a 2027-2029 question, not a 2026 one.\n\n- **Type:** established (Ventura's existence and positioning); inference (the MiQ-signal-layer implication)\n- **Stakes:** load-bearing\n- **Single-source:** no ([13][14])\n\n### Claim 20.7 — Kokai and Koa agents move decisioning into TTD's platform, threatening to commoditize the trading craft MiQ sells as labor — but as of mid-2026 they speed setup, not autonomous buying\n\n\"Almost 100% of our clients are running through Kokai,\" TTD's AI-fueled buying platform, which Green says \"enhanced and upgraded nearly every part\" of campaign valuation — identity, impression valuation, performance prediction, clearing price, SPO, creative [1]. Koa agents (alpha, April 2026; first holdco adopter Stagwell) let buyers \"describe campaign goals to AI agents that then execute and optimize\" [15][16]. Green's strategic framing is pointed: TTD will \"accrete the most value to companies that already have deep customer trust [and] scaled, refined and objective datasets… not by companies with limited data hoping an AI framework becomes their business model\" [1] — a thinly veiled shot at exactly the agentic-wrapper positioning MiQ's Trading Agent occupies (doc 12).\n\nThis is the deepest long-run conflict, because **TTD's AI directly commoditizes the trading craft MiQ sells as managed-service labor.** If Kokai + Koa make a brand's in-house team as effective as MiQ's traders, MiQ's execution value erodes. But the corpus already maps this (doc 12, doc 17): as of mid-2026 Koa agents \"speed *setup*, not autonomous buying\" [doc 12; 16] — the same bounded-autonomy state as MiQ's own agent — so the commoditization is a trajectory, not a present fact. MiQ's defense is its 15-year proprietary trading corpus and multi-DSP orchestration position. The question doc 17 poses remains the binding one: *can MiQ convert from \"the desk you outsource trading to\" into \"the layer you license even after you in-house,\" before its own AI makes trading free?*\n\n- **Type:** established\n- **Stakes:** load-bearing\n- **Single-source:** no ([1][15][16]; corroborated by docs 12, 17)\n\n---\n\n## 3. The 2025 Collapse and 2026 Pressure: Does a Weakened TTD Push More Direct?\n\n### Claim 20.8 — TTD's 2025 collapse and slowing growth create structural pressure to push direct and defend take rate, squeezing intermediaries — but TTD has not announced reseller-specific repricing\n\nThe numbers, from TTD's own Q4 2025 report (Feb 25, 2026): full-year 2025 revenue $2.9B, +18% YoY; Q4 $847M, +14% (+19% ex-political); **Q1 2026 guidance of \"at least $678 million representing 10% year-over-year growth\"** — a sharp deceleration from 26% in 2024; gross spend ~$13.4B; adjusted EBITDA ~47% of revenue [1]. The stock fell roughly 68% across 2025 [3]. The proximate causes (doc 06): Amazon on offense with free DSP testing and funded comparative tests; holdcos steering away; the walled gardens pulling spend toward first-party data and O&O.\n\n**The directional logic on intermediaries:** a growth-pressured platform that must defend a ~20% take rate has two levers. It can push *direct* to capture more of the value chain (which TTD is explicitly doing via the go-to-market reorganization, Claim 20.4), and it can protect *take rate* against the \"margin must compress\" narrative Green spent the call rebutting [1]. Both lean against intermediaries over time: more direct relationships mean fewer dollars need an aggregator; a defended take rate means less room for a reseller to mark up on top. **However, I found no evidence TTD has announced or implemented reseller-specific repricing, access restrictions, or de-prioritization** as of mid-2026 — the pressure is structural and directional, not yet a discrete action. (See Claim 20.9 on the absence of a documented restriction history.)\n\n- **Type:** established (the financials, primary [1]; the collapse, [3]); inference (the directional pressure on intermediaries)\n- **Stakes:** load-bearing\n- **Single-source:** no ([1] primary + [3])\n\n### Claim 20.9 — The 2026 holdco revolt (Publicis, WPP, Dentsu) shows TTD's willingness to risk intermediary relationships — but the friction is over fees/transparency, and it can cut toward MiQ as easily as against it\n\nIn February-March 2026, the relationship between TTD and the largest agency holdcos fractured publicly. **AdWeek reported WPP and Dentsu stepped back from OpenPath in February 2026; Publicis announced in March 2026 it could \"no longer recommend The Trade Desk,\" citing a FirmDecisions audit that found TTD \"had applied its DSP fee to additional charges and billed clients for tools they were enrolled in without clear authorisation\" (TTD disputed the findings)** [4][5]. Three of the five largest holdcos were thereby in conflict with TTD [4]. The shared thread is *transparency and fees* [4].\n\nTwo implications for MiQ, pointing opposite directions. **Against MiQ:** the episode proves TTD will accept friction with its biggest intermediary partners when it judges the economics worth it — so a future squeeze on smaller intermediaries, independents like MiQ included, is not off the table. **For MiQ:** if holdcos redirect spend away from TTD, much of it flows to DV360 [5], and MiQ, being multi-DSP, can ride that re-routing rather than sit trapped on a contested rail. An independent agnostic aggregator is *less* exposed to a single-platform fee fight than a holdco that publicly bet on one DSP. On balance, the holdco revolt vindicates MiQ's agnostic posture more than it threatens it.\n\n- **Type:** established (the fallout is reported across [4][5]); inference (the for/against-MiQ reading)\n- **Stakes:** load-bearing\n- **Single-source:** no ([4][5])\n\n### Claim 20.10 — No documented history of TTD restricting, repricing, or de-prioritizing managed-service intermediaries was found; MiQ has no disclosed contractual or volume protection\n\nI searched specifically for prior instances of TTD restricting reseller access, repricing managed-service partners, or de-prioritizing intermediaries, and for any disclosed MiQ contractual or volume protection against such moves. **I found none of either.** TTD's relationship with intermediaries is governed by its self-serve platform terms and, for certified resellers, the partner program [2]; MiQ's specific contract terms with TTD are not public. The honest state: *no public evidence* that MiQ holds any structural protection, and *no public evidence* that TTD has historically weaponized access against managed-service buyers. The risk is therefore live and un-mitigated-on-the-record. MiQ's only demonstrated protection is the *option to leave* (multi-DSP routing), not a contractual *right to stay* on favorable terms.\n\n- **Type:** inference (an absence-of-evidence finding, honestly bounded)\n- **Stakes:** load-bearing\n- **Single-source:** no (a confirmed absence across all consulted sources)\n\n---\n\n## 4. The Steelman for MiQ, Stated in Its Own Terms\n\nPer steelman discipline, here is the strongest version of MiQ's position, in the language MiQ would use:\n\n> *We are not a TTD reseller. We are a DSP-agnostic media partner that happens to use TTD heavily today because it performs — and we will route to Amazon DSP the day Amazon wins a test, as their own clients increasingly do (Claim 20.7 in doc 06; [17]). That agnosticism is the whole point: when the single-platform thesis cracked in 2025, the desks and holdcos that bet the company on one rail got hurt; we did not, because we never did. TTD's roadmap — going direct, OpenPath, Ventura, Koa — is aimed at the holdcos and the S&P 500, and at the SSPs. It is not aimed at the mid-market brands and independent agencies we aggregate, because TTD's own minimum-spend floors and complexity make that demand uneconomic for them to service directly — which is precisely why they run a reseller program at all. And our genuinely owned asset, the TV Intelligence data footprint, is something no DSP relationship can replicate or repossess. The middle does not disappear; it specializes. We intend to be the layer that survives.*\n\nThis defense is coherent and *partly correct*. The agnosticism is real (Claim 20.2 confirms MiQ is structurally a buyer, not a locked reseller); the mid-market-aggregation logic is sound (Claim 20.3); the owned-TV-data point is the one asset TTD cannot reprice away (doc 09). Its weakness, also honest: every disintermediated middleman has claimed to be the *value-adding* layer that survives, and \"we route into whoever wins\" is a thinner, more commoditizable role than owning the demand path (doc 06). The owned-TV-data claim is itself partly rented (doc 09, doc 14): MiQ's panel leans on Samba and Titan, and Ventura threatens to give TTD a *first-party* TV-signal source MiQ must license. The steelman holds — but on a narrower base than its confidence implies.\n\n---\n\n## 5. Verdict Through 2029\n\n**Is the \"single-largest-supplier-is-also-largest-rival\" dynamic survivable? Yes — but survivability is entirely a function of MiQ's optionality and its owned data, not of the TTD relationship, which is the most exposed part of the thesis.**\n\nThe mapped conflict resolves into a clear hierarchy of risk:\n\n1. **Most dangerous, slowest-moving: Kokai/Koa commoditizing the trading craft** (Claim 20.7). This is the through-2029 question that actually decides MiQ's fate, and it is the same question docs 12 and 17 raise. TTD's AI is explicitly designed to accrete value to data-and-trust-rich platforms and away from \"agentic wrappers\" [1] — MiQ's category. MiQ's answer must be the conversion from outsourced-trading to licensed-data-and-software layer.\n2. **Most structural, widening: Ventura giving TTD owned TV signal** (Claim 20.6) — turns MiQ's rented-data weakness (doc 09) into a competitive gap, on a 2027-2029 horizon.\n3. **Real but indirect: OpenPath/SPO margin compression** (Claim 20.5) — erodes one MiQ service line, not the business.\n4. **Real but mis-aimed: the direct-to-advertiser go-to-market push** (Claim 20.4) — targets holdcos and the S&P 500, not MiQ's mid-market book, for now.\n5. **The protection: multi-DSP agnosticism + non-reseller status** (Claims 20.2, 20.9) — MiQ's only demonstrated defense is the option to re-route, and the 2026 holdco revolt vindicated exactly that posture.\n\nA weakened, growth-pressured TTD is, on net, **more likely to push direct and defend take rate** (Claims 20.8, 20.9) — bot
