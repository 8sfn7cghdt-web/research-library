samba-tv-sells-media-business-miq-ratings/ — Accessed 2026-06-20. *Tier 4. Confirms MiQ acquired Samba TV's media-sales business historically.*\n13. MiQ, \"MiQ Builds Unparalleled TV Intelligence in Europe Through Deal With Titan OS,\" MiQ news, Nov 18, 2025. https://www.wearemiq.com/resources/news/miq-builds-unparalleled-tv-intelligence-in-europe-through-deal-with-titan-os — Accessed 2026-06-20. *Tier 1 (vendor release). First to license Titan OS log-level data; live Q1 2026; into Sigma.*\n14. \"MiQ partners with Titan OS,\" Advanced Television, Nov 18, 2025. https://www.advanced-television.com/2025/11/18/miq-partners-with-titan-os/ — Accessed 2026-06-20. *Tier 5 trade press. Independent corroboration of the Titan OS deal and Q1 2026 go-live.*\n15. MiQ, \"MiQ announces data partnership with Lifesight,\" MiQ news, Aug 12, 2025; and Mediaweek/Mi3 coverage. https://www.wearemiq.com/us/resources/news/miq-announces-data-partnership-with-lifesight — Accessed 2026-06-20. *Tier 1 + Tier 5. Location/footfall data (25M+ AU devices), incrementality/MMM into Sigma.*\n16. \"MiQ and Lifesight join forces to enhance Sigma platform with location-based data,\" Mi3 (Australia), Aug 13, 2025. https://www.mi-3.com.au/13-08-2025/miq-and-lifesight-join-forces-enhance-sigma-platform-location-based-data — Accessed 2026-06-20. *Tier 5. Independent corroboration of Lifesight incrementality integration.*\n17. \"India-Built AI Engine MiQ Sigma…,\" MediaNews4u; and Krishnakumar Govindarajan interview, MediaBrief, 2025. https://www.medianews4u.com/india-built-ai-engine-miq-sigma-revolutionizes-media-buying-with-real-time-ai-powered-trading/ — Accessed 2026-06-20. *Tier 5. Bengaluru CoE build; India rollout.*\n18. \"Inside MiQ's Plan To Build Sigma Into Australia's Go-To Advanced TV Engine With OzTAM, Lifesight & Creatalytics,\" B&T (Australia), 2025. https://www.bandt.com.au/inside-miqs-plan-to-build-sigma-into-australias-go-to-advanced-tv-engine/ — Accessed 2026-06-20. *Tier 5. ANZ ATV build-out and additional Sigma data partners.*"}, {"order": 3, "file": "03_CTV_Capabilities_And_Activation.md", "title": "MiQ CTV Capabilities and Activation", "summary": "", "body": "# CTV Capabilities and Activation — The Buying Side of MiQ's Connected TV Business\n\n## Bottom Line\n\nMiQ's Connected TV pitch rests on one structural claim: it is **DSP-agnostic**. (CTV here means ads served to internet-connected televisions — smart TVs, streaming sticks, consoles — rather than traditional broadcast.) A brand buying through a single demand-side platform (DSP — the software that buys programmatic ad inventory) is fenced into that platform's supply. MiQ instead buys across \"**7 top TV buying platforms**,\" reaching inventory no single DSP can: YouTube via Google's DV360, Warner-Media inventory via Microsoft's Xandr, Bell's premium Canadian streaming via the Bell DSP [1][2][3]. On that supply it layers automatic-content-recognition (ACR — software that fingerprints what is actually on the TV screen) data, a curated library of **2,000+ direct-to-publisher private-marketplace (PMP) deals**, and an AI activation layer (Sigma) that, as of June 2026, runs across **16 open-web and walled-garden environments** and has powered **40,000+ campaigns for 2,300+ advertisers** since its June-2025 launch [4][5].\n\nOn *execution* metrics the activation story is genuinely strong: MiQ documents 94% less cross-publisher audience overlap and 200–400% better cost-per-unique-household than peers on The Trade Desk [6]. On *breadth*, it is now an official YouTube Activation Partner (Oct 2025) and the only managed-service provider with Titan-OS operating-system-level signal in Europe (Nov 2025) [7][8]. But here is the caveat that runs throughout: **most of the underlying CTV supply MiQ buys is the same supply any competent independent can buy through the same DSPs.** The edge is not exclusive pipes. It is the agnostic *aggregation* across pipes, the ACR/identity data layered on top, the managed-service trading craft, and a handful of genuinely scarce data deals (Bell, Titan OS, Samba). Whether that bundle is a durable moat or a thinning premium over a commoditizing DSP layer is the central question for 2029.\n\n---\n\n## 1. The Core Mechanic — DSP-Agnosticism as the Whole Game\n\n**So what:** If you remember one thing about how MiQ buys CTV, remember this — it does not own a DSP and it is not loyal to one. That single design choice is the source of nearly every capability claim below, and the first thing to interrogate.\n\nA normal CTV buyer picks a DSP — The Trade Desk, Amazon DSP, Google's DV360 — and lives inside it. Each DSP carries its own supply relationships, its own walled-garden access, its own gaps. MiQ's stated model is to plug into **\"agnostic DSP partnerships across 7 top TV buying platforms,\"** claiming \"the broadest access to CTV supply\" without being locked to one buyer [1][2]. Two examples MiQ names make the logic concrete: **YouTube is reachable only via Google's DV360**, and certain **Warner-Media inventory only via Microsoft's Xandr**. A single-DSP buyer structurally cannot touch both. MiQ can [3].\n\nThis is the spine of the whole CTV offering. Targeting, omnichannel reach, frequency management, the \"total video\" thesis (Section 6) — all derive from one premise: MiQ sits *above* the DSP layer and arbitrages across it rather than within it.\n\n**The critical read.** DSP-agnosticism is real but it is not unique. Any independent agency, trading desk, or sophisticated brand can hold seats on multiple DSPs and buy YouTube on DV360 and Warner on Xandr. What MiQ sells is not access nobody else has. It is the *operational consolidation* of multi-DSP buying — one team, one taxonomy, one frequency view, one measurement spine — plus the data and trading craft layered on top. The differentiation lives in the layering, not the pipes. Every \"broadest access\" claim is best read as a claim about aggregation and workflow, not exclusive inventory, except where a specifically exclusive data deal is named (Bell DSP, Titan OS, the Samba US managed-media handover).\n\n> **Exhibit 1 — The agnostic stack (schematic).**\n> Layer 4 — Activation & craft: MiQ Sigma (AI) + the Lab (trading UI) + managed-service traders\n> Layer 3 — Data overlay: ACR (Samba, others) + identity (Experian Digital Graph) + PMP curation\n> Layer 2 — DSPs (the \"7 platforms\"): The Trade Desk · DV360 · Amazon DSP · Xandr/Microsoft · Bell DSP · others\n> Layer 1 — Supply: CTV apps, FAST channels, YouTube, premium streamers, linear-addressable\n> *The moat MiQ argues for lives in Layers 3–4. Layers 1–2 are largely shared with every other independent.*\n\n---\n\n## 2. Inventory Access — What MiQ Can Actually Buy, and Through Which Door\n\n**So what:** The named, datable inventory doors are the heart of the matter — each is a present-tense status claim that can go stale via a DSP shutdown, a deal lapse, or a rename, so each is sourced to a recent date below.\n\n**YouTube via DV360.** MiQ reaches YouTube — the single largest CTV-app destination — through Google's DV360, and in **October 2025** joined Google's official **YouTube Activation Partners** program, a vetted tier granting early feature access and priority support [7]. MiQ claims \"13 years of deep YouTube specialism\" and treats YouTube as a first-class node in its total-video plan, not a separate buy [7][9]. A partnership with **Pixability** handles brand suitability: its BrandShield technology scores channels and videos against GARM standards, the 4A's Brand Safety Floor, and IAB taxonomy, and MiQ has folded BrandShield into its managed-service YouTube offering on DV360 [10].\n\n**Warner-Media via Xandr — with a live risk flag.** MiQ cites Warner-Media inventory through Xandr as a canonical example of agnostic reach [3]. **One caveat matters here:** Microsoft announced it would shut down the Xandr/Microsoft *Invest* DSP on **February 28, 2026** [11]. The Warner-via-Xandr example may therefore describe a route that has narrowed or migrated — MiQ's product pages still cite it, but the underlying DSP's buy-side is winding down. This is exactly the kind of present-tense inventory claim that silently goes stale. Treat \"Warner via Xandr\" as historically illustrative, not confirmed-live-today.\n\n**Bell DSP (Canada) — a genuinely scarce, exclusive door.** In **March 2023** MiQ launched a Canadian TV buying solution powered by **Bell** first-party TV data, available **exclusively through the Bell DSP** [2][12]. It consolidated CTV inventory from major Canadian publishers, FAST (free ad-supported streaming TV) channels, and **300+ channels and apps**, reaching a claimed **92% of Canadians watching ad-supported streaming** and drawing on **30M+ Canada-wide device connections** via Bell Audience Manager [12]. Here is one of the few doors no other independent can replicate on a shared DSP — the exclusivity is the point. *(Recency caveat: the founding announcement is 2023; MiQ's Canadian materials describe the relationship as ongoing, but the freshest dated confirmation predates the recent past, so its current exclusivity status is harder to confirm.)*\n\n**Titan OS (Europe) — newest exclusive signal door.** In **November 2025**, MiQ became \"the only managed-service provider with access to Titan OS' operating-system-level intelligence,\" extending its European footprint to **20M+ connected TVs**; Titan-OS signal was slated to integrate into Sigma in **Q1 2026** [8]. (Titan OS is primarily a *measurement/intelligence* asset — covered in depth in the chapter on TV intelligence and measurement — but it also shapes which European CTV audiences MiQ can *activate* against, so it belongs here as a supply-and-signal door.)\n\n**PMP and direct supply.** Beyond the DSP doors, MiQ has curated **2,000+ direct-to-publisher PMP deals** organized by IAB category, price point, and brand suitability, aiming at **100% direct-only supply** (no resellers or intermediaries) [13]. This curated layer is how MiQ controls quality and fraud (Section 5), and it is a real differentiator over a brand buying open-exchange CTV blind.\n\n> **Exhibit 2 — Inventory doors and their going-concern status (as of mid-2026).**\n> | Door | What it unlocks | Newest dated confirmation | Status flag |\n> |---|---|---|---|\n> | DV360 → YouTube | YouTube CTV + video | Oct 2025 (YT Activation Partner) | Live, strengthening |\n> | Xandr → Warner Media | Warner streaming inventory | Cited on product pages; Xandr Invest DSP set to close Feb 28 2026 [11] | **At risk** |\n> | Bell DSP (CA) | Exclusive Bell first-party TV data, 300+ CA apps | Mar 2023 launch; described ongoing | Older confirmation — status unclear |\n> | Titan OS (EU) | OS-level signal, 20M+ EU CTVs | Nov 2025 | Live; Sigma integration Q1 2026 |\n> | The Trade Desk | Broad CTV supply, TVQI | May 2024 case data; ongoing | Live |\n> | 2,000+ PMP deals | Direct-only curated CTV supply | Aug 2023 (count); ongoing | Live |\n\n---\n\n## 3. Targeting — Content/Genre, First-Party, Third-Party, and ACR Overlay\n\n**So what:** MiQ's targeting pitch is that CTV does not have to be the blunt, demographic-only buy it was on linear — you can target by *what is on the screen*, by *who is in the household*, and by *what they did afterward*, all in one campaign.\n\n**Content and genre targeting** runs through MiQ's trading platform, **the Lab** (Section 4), which lets traders \"set up your campaign based on specific content or genre targeting\" with \"a comprehensive view of every path to supply\" [13][14]. This is contextual CTV buying — aligning ads to programming type rather than (or alongside) audience identity. It matters in a signal-loss world where deterministic audience data is thinning.\n\n**First- and third-party audience targeting.** MiQ brings \"the data and insights you would expect from any programmatic campaign to CTV\" — brand first-party data, third-party segments, and its own modeled audiences [13]. The **Experian Digital Graph** strengthens the identity resolution underneath, associating IP addresses with universal IDs at a claimed **70% match rate** for cross-device resolution [15]. That is the connective tissue that makes household-level CTV targeting and retargeting work.\n\n**The ACR overlay** is the layer MiQ leans on hardest as differentiation. It layers Advanced-TV data via \"multiple automatic content-recognition (ACR) TV viewership data integrations,\" provider-agnostic by design, so campaigns build around *what audiences are watching, when, and how* [1][13]. The anchor relationship is **Samba TV**. In **January 2023**, Samba and MiQ struck a multi-year commercial deal: Samba handed its **US managed-media-sales business to MiQ** and became MiQ's household-level ACR data and measurement supplier, with ACR data spanning **more than 20 smart-TV brands** [16][17]. (The ACR *measurement* mechanics — incrementality, over/under-exposure — belong to the chapter on TV intelligence and measurement; here ACR matters as a *targeting input* that lets MiQ build and suppress audiences on the buy side.)\n\n**The honest line on targeting differentiation:** content/genre and first/third-party CTV targeting are table stakes — every serious CTV buyer offers them. MiQ's distinctive claim is the *combination* of provider-agnostic ACR across markets plus its identity spine, run through one trading workflow. That is a real integration advantage. But it is an advantage of assembly, and several of the assembled parts (Samba ACR, Experian graph) are licensed, not owned — a durability question taken up later, in the chapter on regulation and the data moat.\n\n---\n\n## 4. The Lab — MiQ's Trading Platform\n\n**So what:** \"The Lab\" is the human-facing trading cockpit where MiQ's craft actually happens — and it is increasingly the front-end on top of which the Sigma AI and its trading agent operate.\n\nMiQ describes **the Lab** as its \"advanced trading platform,\" where traders \"quickly and easily set up campaigns based on specific content or genre targeting\" and see \"a comprehensive view of every path to supply for maximum efficiency optimization\" [13][14]. In practice the Lab is the multi-DSP control surface that makes agnosticism operationally tractable. Without a unifying trading layer, buying across seven DSPs would be seven separate, un-deduplicated workflows.\n\nThe Lab sits beneath the larger **Sigma** platform (detailed in the chapter on the Sigma platform and its AI), MiQ's AI-powered ad-tech layer launched in **June 2025**. Sigma's **Trading Agent** — trained on 15 years of MiQ trading data and underpinned by three leading LLMs (Claude, Gemini, ChatGPT) — lets traders make multi-DSP decisions through natural-language commands, compressing cross-DSP activation work [4][18]. The **June 2026** Sigma expansion added a **Planning Agent** that turns conversational prompts into full media plans across audience, channel, and tactics, and MiQ reported traders \"making twice as many optimizations as before\" with the combined architecture [4][5]. Sigma now activates across **16 open-web and walled-garden environments** including Google and YouTube, processes **2.5 petabytes of daily data** from **600+ feeds**, and claims **$2.22 return per $1 spent** versus standard programmatic [4][5].\n\n**Critical note:** Sigma's headline performance numbers ($2.22:1 return, the conversion/CPA lifts cited in the chapter on the Sigma platform) are vendor-reported and not independently audited; they belong in the activation story but should be read as MiQ's own claims pending third-party verification.\n\n---\n\n## 5. Brand Safety, Quality, and Fraud Controls\n\n**So what:** CTV's dirty secret is that \"premium TV\" inventory routinely turns out to be misdeclared apps, made-for-advertising channels, and outright fraud. MiQ's quality story is built around *curation and direct supply* as the primary defense, with platform quality indices on top.\n\nMiQ's first line is **supply curation**: a \"refined list of SSPs and publishers\" vetted on performance, reputation, and trust, with an explicit \"we simply won't work with anyone who has a history of ad fraud, reselling or intermediaries,\" and a push to **100% direct-only supply** [13]. The **2,000+ PMP deals** are the vehicle — direct-to-publisher relationships categorized for brand suitability and positioned as \"100% brand-safe\" [13]. (Treat \"100% brand-safe\" as a marketing absolute, not a verifiable guarantee.)\n\nOn The Trade Desk specifically, MiQ uses the **TV Quality Index (TVQI)** — TTD's score combining content quality, publisher transparency, and advertiser relevance — to assess CTV investments [6][19]. MiQ's own case data (May 2024) on its top-10 publishers showed **CPMs 26–51% lower than US averages** while holding quality, and **two-thirds of CTV impressions reaching heavy streamers** per ACR data [6].\n\n**Transparency** comes through app- and content-genre-level reporting in MiQ's Intelligence Hub — impression breakdowns by exact app and genre, view-through rates by inventory [13]. On **YouTube**, **Pixability's BrandShield** enforces brand suitability, scoring against GARM, the 4A's floor, and IAB taxonomy [10].\n\n**The critical read:** MiQ's quality controls are credible and above-average for an independent — direct PMP curation genuinely reduces the fraud and misdeclaration risk that plagues open-exchange CTV. But the headline TVQI and overlap statistics come from MiQ-authored materials on TTD's own site, and \"100% brand-safe / 100% direct\" are aspirational absolutes. The defensible claim is \"materially cleaner supply than open-exchange buying\" — not \"fraud-proof.\"\n\n---\n\n## 6. Omnichannel / Total Video — Where CTV Sits at the Center in 2026\n\n**So what:** As of 2026, MiQ no longer frames CTV as a channel — it frames CTV as the *gravitational center* of a single \"total video\" plan that absorbs linear, CTV, YouTube, and digital video into one buy-once / measure-once / optimize-once motion.\n\nMiQ's stated posture (May 2026): \"**connected TV is no longer an experimental, siloed channel — it has become the foundation of modern video planning**\" [20]. The omnichannel claim is concrete: \"plan, activate and measure in an integrated way across **linear TV, CTV and digital**\" via an \"omnichannel, omniplatform approach,\" with Sigma connecting YouTube into the total-video plan so a buyer can \"buy once, measure once, and optimize holistically\" [1][9][20].\n\nMiQ offers two case proofs. A total-video buy across **CTV, YouTube, and OLV (online video)** reached **2.97M unique users** with better efficiency than linear alone [20]. And the **Subway** case used ACR to segment linear-exposed from unexposed households and target the unexposed on CTV, delivering **+11.5% incremental reach** [21]. (Both are MiQ-reported case outcomes; the Subway case is examined further in the chapter on TV intelligence and measurement.)\n\n**Why this framing matters competitively.** \"Total video\" is MiQ's answer to the commoditization threat. If CTV inventory access is increasingly a commodity (Section 1's caveat), the durable value moves to *orchestration across all video at once* — exactly the layer a single-DSP or single-walled-garden buyer cannot occupy. The agnostic model is the prerequisite: you can only orchestrate linear + CTV + YouTube + digital as one plan if you are not trapped inside one DSP. This is the most strategically coherent part of MiQ's CTV story.\n\n---\n\n## 7. CTV Retargeting and Cross-Device Activation\n\n**So what:** Retargeting is the bridge that turns CTV from a top-funnel reach buy into a performance channel — MiQ uses TV-viewing signals to follow households onto their phones, tablets, and laptops.\n\nMiQ's **TV Retargeting** product takes viewership data about what plays on the big screen and connects it \"to other devices in the household\" sharing the same IP address. That unlocks three moves: extended reach to households *not* exposed to a linear campaign; follow-up messaging on second screens to those who *did* see an ad or show; and competitive-conquest targeting against rivals' TV audiences [22][23]. Mechanically, MiQ gathers viewership via \"multiple TV data partnerships for the best scale and representation,\" then activates on connected devices on the same IP, relying on smart-TV and device environments (Amazon Fire TV, Google Chromecast, etc.) [22].\n\nThe **identity spine** that makes this work is the Experian Digital Graph (70% IP-to-UID match rate) [15], plus the ACR signal from Samba and others. MiQ's own framing: \"retarget and measure users who have viewed Connected TV content, via Advanced-TV techniques,\" activating in real time on digital [13].\n\n**Critical note:** IP-based household retargeting is increasingly contested ground — IP addresses are a privacy-sensitive, signal-loss-exposed identifier, and the durability of IP-household graphs through 2029 is a live regulatory risk (taken up later, in the chapter on regulation and the data moat). MiQ's 70% match rate is also a vendor-reported figure for a specific Experian integration, not an industry-audited benchmark.\n\n---\n\n## 8. Agentic Activation — The Frontier on the Buy Side\n\n**So what:** The newest activation capability is the Sigma **Trading Agent** operating not just inside MiQ but *inside other companies' agentic platforms* — a sign MiQ wants to be infrastructure, not just a buyer.\n\nPer MiQ's Chief Strategy Officer John Goulding, \"**in 2026, we're excited to start scaling agentic ad buying through MiQ Sigma's trading agent**\" [18]. The agent is positioned as live infrastructure: **PubMatic's AgenticOS** (launched Jan 2026) runs MiQ Sigma's Trading Agent inside it on live campaigns; **Yahoo DSP** embedded agentic capabilities with MiQ among early integration partners; and **Magnite's SpringServe** named MiQ's agent among participants [4][18][24]. The agent compresses multi-DSP activation decisions into natural-language commands across the agnostic stack — the buy-side payoff of Section 1's architecture.\n\n**The critical read:** This is the genuine frontier of MiQ's CTV activation story, and also the least proven. \"Live infrastructure inside AgenticOS through Q1 2026\" is a recent, datable claim, but agentic ad-buying at scale is early, vendor-narrated, and unaudited. The agentic bet is examined in full later, in the chapter on the agentic advertising frontier. Here it belongs as the leading edge of how CTV gets *bought* at MiQ in 2026: promising, real enough to be running, not yet proven to beat skilled human trading at scale.\n\n---\n\n## 9. How Differentiated Is MiQ's CTV Access, Really?\n\n**So what:** This is the question worth asking bluntly. The answer: MiQ's CTV *inventory access* is mostly shared; its *aggregation, data overlay, and craft* are where any real edge lives — and that edge is under pressure.\n\n**What is genuinely scarce:**\n- The **Bell DSP** exclusive Canadian data door (2023; current status harder to confirm).\n- The **Titan OS** \"only managed-service provider\" OS-level signal in Europe (Nov 2025).\n- The **Samba US managed-media handover** (2023), which gave MiQ a privileged ACR-data relationship.\n- The **operational consolidation** of multi-DSP buying into one deduplicated, frequency-managed, total-video workflow — documented in the TTD overlap and cost-per-household data [6].\n\n**What is not scarce (the commoditization pressure):**\n- The DSPs themselves — TTD, DV360, Amazon DSP — are open to every competent independent and many brands in-house.\n- Most CTV supply is the same supply on those shared DSPs.\n- The independent-CTV-buyer value proposition is under structural pressure: Amazon DSP is gaining CTV share with lower fees, The Trade Desk's growth is decelerating (Q4 2025 ~14%, Q1 2026 guidance ~10%), and CTV-first DSPs (Pontiac, Viant) are competing on lower take rates and simpler buying [25][26]. As the DSP layer commoditizes and the walled gardens (Amazon, YouTube/Google) pull CTV spend inward, the premium an agnostic aggregator can charge is the open question.\n\n**The synthesis:** MiQ's CTV buying edge is real but *thin and assembled* — shared pipes welded to licensed data and human/AI craft, not control of scarce inventory. Its durability through 2029 turns on three things: keeping the few exclusive data doors, the total-video orchestration layer staying valuable as DSPs commoditize, and the agentic and Sigma bets compounding the craft advantage faster than the DSPs' own AI can copy it. The pipes are everyone's. The question is whether the layering stays worth paying for.\n\n---\n\n## Open Questions\n\n1. **Is the Warner-via-Xandr inventory route still live?** Microsoft set the Xandr Invest DSP to close Feb 28, 2026; MiQ's product pages still cite it. Has the route migrated, narrowed, or closed?\n2. **What is the current status of the Bell DSP exclusivity?** The freshest dated confirmation is the March 2023 launch. Is the exclusive arrangement still in force in 2026?\n3. **How much CTV volume does MiQ actually run through each of the \"7 DSPs\"?** The \"7 top platforms\" is named but the mix is undisclosed — is the agnosticism balanced, or is most spend on one or two DSPs (likely TTD/DV360)?\n4. **Are the headline activation stats independently verifiable?** The 94%-less-overlap, 200–400% cost-per-household, $2.22:1, and 70% match-rate figures are all vendor/partner-authored. None has independent audit.\n5. **What does MiQ actually charge for CTV activation, and how does its take rate compare** to buying direct on a DSP? The commercial spread that justifies the managed-service premium is undisclosed here (taken up later, in the chapters on the client relationship and the commercial model).\n6. **How replicable is the total-video orchestration** by DSP-native tools (TTD's own cross-channel planning, Amazon's, Google's) as those platforms build out AI planning agents of their own?\n7. **Does the Sigma Trading Agent measurably beat skilled human trading** on CTV outcomes, or is \"twice as many optimizations\" activity rather than results?\n\n---\n\n## Sources\n\n1. MiQ, \"Advanced TV Advertising,\" wearemiq.com/media-solutions/advanced-tv (accessed 2026-06-20). Tier 1 (vendor product page). \"Agnostic DSP partnerships across 7 top TV buying platforms\"; 6.4T signals / 90M households framing.\n2. MiQ / Bell Media, \"Brands can now tap into MiQ's extensive connected TV capabilities… on Bell DSP,\" wearemiq.com press release & bellmedia.ca (2023). Tier 1/Tier 3. The Bell DSP exclusive Canadian data door.\n3. MiQ, \"Connected TV,\" wearemiq.com/us/media-solutions/connected-tv (accessed 2026-06-20). Tier 1. YouTube via DV360 and Warner Media via Xandr as agnostic-access examples; the Lab; omnichannel.\n4. MiQ / BusinessWire, \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate,\" 2026-06-11, businesswire.com/news/home/20260611682662. Tier 1 (press release). 40,000+ campaigns / 2,300+ advertisers; 16 environments; 2.5PB/day; Planning Agent; $2.22:1.\n5. PPC Land, \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" ppc.land (June 2026). Tier 5 (ad-tech trade press). Corroborates Sigma June-2026 activation expansion; 600+ feeds; Titan-OS in signal pool.\n6. The Trade Desk, \"4 ways MiQ defines Connected TV success,\" thetradedesk.com, 2024-05-23. Tier 1 partner-authored (MiQ data on TTD site — note conflict of interest). 94% less overlap; 200–400% cost-per-household; CPM 26–51% below US avg; TVQI; ⅔ heavy-streamer reach.\n7. MiQ, \"MiQ named to official YouTube Activation Partners Program,\" wearemiq.com/us/resources/news, 2025-10-06. Tier 1. YouTube Activation Partner; 13 yrs YouTube specialism; 700T signals; Hundal & Chughtai quotes.\n8. Titan OS & MiQ, \"Titan OS and MiQ Partner…,\" advanced-television.com 2025-11-18 + MiQ release. Tier 3/Tier 1. Only managed-service provider with Titan OS OS-level signal; 20M+ EU CTVs; Sigma integration Q1 2026.\n9. MiQ, \"How a total video mindset can help marketers win at YouTube activation,\" wearemiq.com/resources/blog (accessed 2026-06-20). Tier 1. Total-video framing; buy once / measure once / optimize holistically.\n10. MiQ, \"How we're enhancing YouTube performance on DV360 with… Pixability,\" wearemiq.com/resources/news (accessed 2026-06-20). Tier 1. BrandShield; GARM / 4A's floor / IAB taxonomy; David George & Moe Chughtai quotes.\n11. Web search synthesis citing Microsoft's announced shutdown of the Xandr/Microsoft Invest DSP on 2026-02-28 (accessed 2026-06-20). Tier 3/5. Going-concern risk flag on the Warner-via-Xandr route.\n12. Media in Canada, \"MiQ partners with Bell on new TV buying solution,\" mediaincanada.com 2023-03-07; CARD Online 2023-07-19. Tier 4/5 (Canada trade). 300+ apps; 92% AVOD reach; 30M+ device connections; Bell Audience Manager.\n13. MiQ, \"Content transparency and fraud: do you know where your CTV ads are really running,\" wearemiq.com/us/resources/blog, 2023-08-15. Tier 1. 2,000+ PMP deals; 100% direct-only goal; \"100% brand-safe\"; app/genre-level transparency; SSP vetting.\n14. MiQ blog, \"Exploring TV and programmatic trading strategies,\" blog.wearemiq.com/tv-and-programmatic-trading (accessed 2026-06-20). Tier 1. The Lab as advanced trading platform; content/genre setup; path-to-supply view.\n15. Experian, \"Experian's Digital Graph strengthened MiQ's Identity Spine,\" experian.com/blogs/marketing-forward (accessed 2026-06-20). Tier 1 partner-authored. 70% IP-to-UID match rate; cross-device resolution.\n16. Samba TV & MiQ, \"Samba TV and MiQ Reach Multi-year Commercial Agreement,\" samba.tv/press-releases, Jan 2023. Tier 1. US managed-media handover; multi-year ACR data deal.\n17. AdExchanger, \"A MiQ-Drop Moment For Samba Ad Sales,\" adexchanger.com 2023-01-17. Tier 5 (ad-tech trade). Independent coverage of the Samba/MiQ deal; Samba ACR data spanning more than 20 smart-TV brands.\n18. INMA, \"Advertising enters the agentic era as AI agents begin buying and selling media,\" inma.org (2026). Tier 5. Goulding \"scaling agentic ad buying in 2026\"; Trading Agent trained on 15 yrs data + 3 LLMs.\n19. The Trade Desk, \"TV Quality Index (TVQI)\" methodology (referenced via [6]). Tier 1. Content quality / publisher transparency / advertiser relevance scoring.\n20. Media in Canada, \"MiQ puts CTV at the centre of total video strategy,\" mediaincanada.com 2026-05-04 (accessed 2026-06-20; body did not render on fetch — headline/standfirst captured via search). Tier 4/5. CTV as foundation of video planning; 2.97M-unique total-video case. **The 2.97M figure rests on this source alone.**\n21. MiQ, \"How we helped Subway drive +11.5% incremental reach with Advanced TV,\" wearemiq.com/case-study (accessed 2026-06-20). Tier 1 (vendor case study). Linear-exposed vs. unexposed segmentation; +11.5% incremental reach.\n22. MiQ, \"TV Retargeting Advertising Solutions,\" wearemiq.com/media-solutions/tv-retargeting (accessed 2026-06-20). Tier 1. Cross-device retargeting mechanics; same-IP household activation; competitive conquest.\n23. MiQ, \"Advanced TV — make the leap from good to great,\" wearemiq.com/blog (accessed 2026-06-20). Tier 1. Retarget-and-measure CTV viewers via Advanced-TV techniques.\n24. PubMatic, \"PubMatic Launches AgenticOS…,\" pubmatic.com/news, Jan 2026. Tier 1. AgenticOS with MiQ Sigma Trading Agent running live campaigns.\n25. AdExchanger, \"Why Amazon Is Gaining Ground In CTV And The Trade Desk Is Losing Its Lead,\" adexchanger.com (2025/2026). Tier 5. Amazon CTV share gains; TTD deceleration — commoditization pressure.\n26. Web search synthesis on CTV-first DSPs (Pontiac, Viant), TTD ~14% Q4-2025 / ~10% Q1-2026 guidance, ~20% take rate (accessed 2026-06-20). Tier 5/3. DSP fee pressure and the commoditization thesis."}, {"order": 4, "file": "04_ATV_TV_Intelligence_And_Measurement.md", "title": "MiQ ATV — TV Intelligence and the Measurement Stack", "summary": "", "body": "# MiQ ATV: TV Intelligence and the Measurement Stack\n\n> **ATV (Advanced TV)** = the umbrella for data-driven TV advertising spanning **CTV** (connected TV — streaming delivered to an internet-connected television), **addressable linear** (traditional broadcast/cable made targetable household-by-household), and the **measurement** layer that ties them together. These pages treat the *data and measurement* side of MiQ's ATV business — the buying/activation side is covered separately, in the chapter on CTV capabilities and activation.\n\n---\n\n## Bottom Line\n\nMiQ's Advanced TV pitch rests on one asset it markets relentlessly: **\"the world's largest and most diverse TV data footprint\" — 6.4 trillion video-consumption signals from 11 partners across a panel of ~90 million households in five major markets** [1][2][3]. From that footprint it builds **TV Intelligence**, positioned as \"the industry's only complete view of audience, campaign and competitor intelligence across linear, streaming and YouTube\" [1][2]. The measurement story is real and commercially live. TV Intelligence launched across the US, UK, Canada and Australia in April 2024 [3][4]; a multi-year Samba TV ACR agreement (Jan 2023) and the Nov 2025 Titan OS deal feed it fresh signal [5][6]; and client-reported case studies (IKEA +4% incremental reach and £200k saved; Subway +11.5% incremental reach) demonstrate the core use case — extending linear-TV campaigns into CTV against under-exposed audiences [7][8].\n\nBut the moat is **rented, not owned**. MiQ generates almost none of this signal. Samba TV owns the ACR (automatic content recognition — software that fingerprints what is on screen), Titan OS owns the smart-TV operating-system data, the regional currencies own the panel, and Lifesight owns the location/MMM (marketing-mix-modelling) layer [5][6][9]. Every one is a contract that can be renegotiated, made exclusive, or pulled in-house — and the market is moving exactly that way. Samsung, LG and Roku have already brought their ACR data **in-house** to power their own ad businesses, leaving independents to stitch together partial, manufacturer-by-manufacturer coverage that \"can result in less than half of the TV sets in a household being measured\" by any single provider [10][11]. MiQ's durable advantage is therefore **not the data itself but the integration** — fusing 11 rented feeds into a single deterministic view inside Sigma — and that advantage holds only as long as MiQ keeps paying for, and re-signing, the underlying licences. **Through 2029, the measurement business is a strong but structurally fragile aggregator play: defensible while MiQ stays the most convenient one-stop integrator, exposed the day a major data owner decides aggregation is a business it would rather run itself.**\n\n---\n\n## 1. What TV Intelligence Actually Is\n\n**So what:** TV Intelligence is the analytics product MiQ sells as the front door to its Advanced TV business. For a buyer, it answers three questions in one place — *who is my TV audience, how is my campaign performing across screens, and what are my competitors doing* — across linear, streaming and YouTube. That \"one place\" claim is the entire value proposition. The alternative is buying three or four point solutions and reconciling them by hand.\n\nMiQ describes TV Intelligence as **\"the industry's only complete view of audience, campaign and competitor intelligence across linear, streaming and YouTube\"** and \"the only platform of its kind\" that \"looks holistically at TV, streaming and YouTube\" [1][2]. Founder and Global CEO Gurman Hundal framed the Australia launch as \"the only global analytics platform that gives marketers a complete view of their investment across streaming, linear, and YouTube,\" positioning it against \"the TV industry's biggest challenge of fragmentation across audience viewing, data, and measurement\" [4].\n\nThe product decomposes into three intelligence types:\n\n- **Audience intelligence** — understand the existing TV audience and find net-new, under-exposed viewers (the input to incremental-reach planning).\n- **Campaign intelligence** — measure delivery and outcomes across linear, CTV and YouTube in one frame, including reach and frequency (how many unique people saw an ad and how often) and incremental reach.\n- **Competitor intelligence** — see competitors' TV/streaming presence, a differentiator most pure measurement vendors do not offer.\n\nThe claim to interrogate is the word **\"only.\"** It is a marketing superlative, not an independently audited fact. \"Complete view ... across linear, streaming and YouTube\" is a real capability claim, but \"only\" and \"complete\" are the two words a competitor — VideoAmp, Samba TV's own measurement arm, iSpot, Comscore, Nielsen ONE — would dispute. Treat the *capability* as established and the *superlative* as MiQ's positioning, not ground truth.\n\n---\n\n## 2. The Data Footprint — The Headline Numbers, Dated and Sourced\n\n**So what:** Every MiQ ATV pitch leads with the same four numbers. They are the foundation of the moat claim, so they deserve exact provenance and a freshness check — these are partnership-dependent figures and the costliest to get wrong.\n\n| Figure | Claim | Source & date | Freshness note |\n|---|---|---|---|\n| **6.4 trillion** | video-consumption signals processed | wearemiq.com TV Intelligence / Advanced TV pages [1][2]; first stated at the April 2024 launch [3][4] | Still on the live site as of Jun 2026 [1][2]; underlying Sigma data spine has since grown to **2.5 petabytes/day from 600+ feeds** (Jun 2026) [12], so 6.4T may understate current scale |\n| **90 million** | households / TV sets in the panel | \"over 90 million TV sets worldwide\" [3][4]; live site [1][2] | Deterministic footprint claim; tied to partner licences (Samba, Titan OS, currencies) |\n| **11** | distinct data partners | April 2024 launch [3][4]; live site [2] | Partner *count* is the most fragile figure — it moves every time a deal is signed or lapses (Titan OS added Nov 2025 [6]) |\n| **5** | major markets | \"panel of 90 million households across five major markets\" [1][2] | TV Intelligence is *productized* in only **4** (US/UK/Canada/Australia) as of the 2024 launch [3][4] — the 5th market is in the panel but not the product |\n| **500 million** | global CTV households reachable | Australia launch coverage [4] | Reach (addressable) figure, distinct from the 90M measurement panel |\n| **69%+** | audience overlap across top streaming apps | Australia launch coverage [4] | Cited to justify the cross-app dedup value of the panel |\n\n**The data sources behind the footprint** are three, explicitly named by MiQ: **automatic content recognition (ACR)** — software that identifies on-screen content by fingerprinting the video; **set-top-box (STB)** data — tuning data from cable/satellite boxes; and **regional TV currencies** — the official audience-measurement panels used to transact TV in each market [3][4]. The footprint spans **CTV, linear TV and YouTube** [3][4].\n\n**Critical read.** Note the gap between the *panel* (90M households, five markets) and the *product* (TV Intelligence, four markets at launch). The \"five major markets\" framing makes the footprint sound more globally productized than the shipping software is. And the headline 6.4T-signal figure has not visibly refreshed on the live ATV pages even as the broader Sigma platform doubled to 2.5 PB/day [12] — a sign the ATV-specific marketing numbers may lag the actual data spine, in either direction. Quantify with the dated figure; flag that it is a marketing constant, not an audited meter.\n\n---\n\n## 3. The Rented-Signal Stack, Partner by Partner\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 386\" role=\"img\" aria-label=\"A two-column ledger contrasting what MiQ owns against what it rents. The left, shorter column lists what MiQ owns outright: the Identity Spine, Sigma's AI and 15-year trading corpus, and the trader and client relationships. The right, longer column lists rented signal and the partner that actually owns each: household ACR data owned by Samba TV, European OS-level data by Titan OS, the cross-device identity graph by Experian, durable IDs by The Trade Desk and LiveRamp, TV panels by the measurement currencies, and inventory by the DSPs. A footer notes that the marketed figure of 700 trillion signals counts what MiQ touches, not what it owns.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" class=\"t-serif\" style=\"font-size:15px;font-weight:700\">Owns vs. Rents &#8212; the anatomy of a &#8220;data moat&#8221;<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px\">The footprint MiQ markets is mostly leased; the asymmetry is the whole risk<\/text>\n<rect x=\"30\" y=\"62\" width=\"300\" height=\"290\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t2);stroke-width:1.5\" cv-grow-up style=\"--d:.05s\"/>\n<rect x=\"30\" y=\"62\" width=\"300\" height=\"32\" rx=\"2\" class=\"f-t2\"/>\n<text x=\"180\" y=\"84\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:12.5px;font-weight:700\">What MiQ OWNS<\/text>\n<g class=\"cv-rise\" style=\"--d:.2s\">\n<text x=\"48\" y=\"124\" style=\"font-size:11.5px;font-weight:700\">The Identity Spine<\/text>\n<text x=\"48\" y=\"139\" class=\"t-muted\" style=\"font-size:9.5px\">MiQ&#8217;s own cross-channel ID stitching layer<\/text>\n<line x1=\"48\" y1=\"150\" x2=\"312\" y2=\"150\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"48\" y=\"172\" style=\"font-size:11.5px;font-weight:700\">Sigma&#8217;s AI + 15-yr trading corpus<\/text>\n<text x=\"48\" y=\"187\" class=\"t-muted\" style=\"font-size:9.5px\">the proprietary data its Trading Agent learns from<\/text>\n<line x1=\"48\" y1=\"198\" x2=\"312\" y2=\"198\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"48\" y=\"220\" style=\"font-size:11.5px;font-weight:700\">Trader &amp; client relationships<\/text>\n<text x=\"48\" y=\"235\" class=\"t-muted\" style=\"font-size:9.5px\">the managed-service craft and book of business<\/text>\n<line x1=\"48\" y1=\"246\" x2=\"312\" y2=\"246\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"48\" y=\"268\" style=\"font-size:11.5px;font-weight:700\">Owned platforms (regional)<\/text>\n<text x=\"48\" y=\"283\" class=\"t-muted\" style=\"font-size:9.5px\">Adsmovil Personas, Linki retail-media (LatAm)<\/text>\n<\/g>\n<text x=\"180\" y=\"330\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:10px;font-style:italic\">defensible &#8212; but a narrow base<\/text>\n<rect x=\"370\" y=\"62\" width=\"300\" height=\"290\" rx=\"2\" class=\"f-panel\" style=\"stroke:var(--t1);stroke-width:1.5\" cv-grow-up style=\"--d:.1s\"/>\n<rect x=\"370\" y=\"62\" width=\"300\" height=\"32\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"520\" y=\"84\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:12.5px;font-weight:700\">What MiQ RENTS &#8212; and from whom<\/text>\n<g class=\"cv-rise\" style=\"--d:.28s\">\n<text x=\"386\" y=\"118\" style=\"font-size:10.5px\"><tspan style=\"font-weight:700\">Household ACR signal (US)<\/tspan><\/text>\n<text x=\"654\" y=\"118\" text-anchor=\"end\" class=\"t-acc\" style=\"font-size:10px;font-weight:700\">Samba TV<\/text>\n<line x1=\"386\" y1=\"128\" x2=\"654\" y2=\"128\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"386\" y=\"148\" style=\"font-size:10.5px;font-weight:700\">European OS-level data<\/text>\n<text x=\"654\" y=\"148\" text-anchor=\"end\" class=\"t-acc\" style=\"font-size:10px;font-weight:700\">Titan OS<\/text>\n<line x1=\"386\" y1=\"158\" x2=\"654\" y2=\"158\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"386\" y=\"178\" style=\"font-size:10.5px;font-weight:700\">Cross-device identity graph<\/text>\n<text x=\"654\" y=\"178\" text-anchor=\"end\" class=\"t-acc\" style=\"font-size:10px;font-weight:700\">Experian<\/text>\n<line x1=\"386\" y1=\"188\" x2=\"654\" y2=\"188\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"386\" y=\"208\" style=\"font-size:10.5px;font-weight:700\">Durable IDs<\/text>\n<text x=\"654\" y=\"208\" text-anchor=\"end\" class=\"t-acc\" style=\"font-size:10px;font-weight:700\">Trade Desk, LiveRamp<\/text>\n<line x1=\"386\" y1=\"218\" x2=\"654\" y2=\"218\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"386\" y=\"238\" style=\"font-size:10.5px;font-weight:700\">TV panels &amp; currencies<\/text>\n<text x=\"654\" y=\"238\" text-anchor=\"end\" class=\"t-acc\" style=\"font-size:10px;font-weight:700\">Nielsen, VideoAmp&#8230;<\/text>\n<line x1=\"386\" y1=\"248\" x2=\"654\" y2=\"248\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"386\" y=\"268\" style=\"font-size:10.5px;font-weight:700\">Inventory / the bid engine<\/text>\n<text x=\"654\" y=\"268\" text-anchor=\"end\" class=\"t-acc\" style=\"font-size:10px;font-weight:700\">the DSPs<\/text>\n<\/g>\n<text x=\"520\" y=\"330\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10px;font-style:italic\">several of these suppliers are also rivals<\/text>\n<text x=\"350\" y=\"374\" text-anchor=\"middle\" class=\"t-muted t-serif\" style=\"font-size:10px;font-style:italic\">&#8220;700 trillion signals&#8221; counts what MiQ <tspan style=\"font-weight:700\">touches<\/tspan>, not what it owns.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The ledger that decides MiQ&#8217;s durability: a short column of owned assets against a long column of rented ones, each with the partner who actually holds it. The &#8220;world&#8217;s largest TV data footprint&#8221; is real, but MiQ is its lessee &#8212; and Samba, Experian, and Titan OS can each re-price, or disintermediate, or compete.<\/figcaption>\n<\/figure>\n\n\n**So what:** MiQ owns the *aggregation* and the *modelling*; it largely does not own the *signal*. Below is the live partner stack, each entry given with its most recent dated confirmation. This is the section where the measurement moat is won or lost.\n\n### 3.1 Samba TV — the ACR backbone (Jan 2023, multi-year)\n\nSamba TV and MiQ reached a **multi-year commercial agreement announced 13 January 2023** [5][13]. The deal augmented MiQ's CTV data footprint with **Samba TV's 28 million U.S. devices**, taking MiQ's total to **over 60 million devices nationwide** [5][13]. It was also a *business swap*: Samba TV **transitioned its U.S. managed-media-services business to MiQ** and exited managed media sales to focus exclusively on data and measurement. As of Q1 2023, MiQ handled all managed-service opportunities using Samba's TV data [5][13][14]. Samba's ACR is \"multi-source, TV-manufacturer-agnostic, first-party\" [14].\n\n**Critical read.** This is the single most important entry in the stack — Samba TV is the ACR backbone of MiQ's US TV intelligence — and it is a *contract*, described only as \"multi-year\" with no public duration [5][13]. If it lapses or goes exclusive elsewhere, the US ACR foundation moves. The deal is now ~3.5 years old; a \"multi-year\" agreement signed Jan 2023 could plausibly sit at or near a renewal window within the 2026–2027 forecast period. **This is the highest-stakes renewal risk in the whole measurement stack.**\n\n### 3.2 Titan OS — the European OS-level layer (Nov 2025; Sigma integration Q1 2026)\n\nAnnounced **18 November 2025**, the Titan OS partnership gives MiQ OS-level signals from **over 20 million CTVs across continental Europe**, capturing \"viewing and behavioural signals from TV session start to end\" [6]. Titan OS-level intelligence is slated to integrate into **Sigma in Q1 2026** [6], and the Jun 2026 Sigma upgrade confirms Titan OS now contributes \"smart TV viewership data\" to the expanded data spine [12] — i.e., the integration appears to have shipped on schedule. MiQ claims to be **\"the only managed-service provider with access to Titan OS-level intelligence\"** [6] and gains \"premium access to brand-new home-screen video inventory across Europe\" plus cross-linear/streaming frequency capping [6].\n\n**Critical read.** Titan OS is the European answer to the smart-TV-OS data MiQ lacks elsewhere — and OS-level data is *more* durable than third-party ACR, because it comes from the operating system itself rather than image-matching. The \"only managed-service provider\" exclusivity is a genuine moat *if* it holds. But it is one partner, covering one region (continental Europe), newly integrated (Q1 2026), and unproven at scale. 20M CTVs is meaningful but small against the ~500M global CTV household reach MiQ claims [4].\n\n### 3.3 Lifesight — incrementality, MMM and location (Aug 2025, JAPAC)\n\nAnnounced **12 August 2025**, the Lifesight partnership ingests location-based people-and-movement data into Sigma and adds **marketing-mix modelling (MMM), incrementality testing and causal attribution** [9][15]. Lifesight brings **\"300 million monthly consented devices across the region\"** of SDK-sourced location data [9][15]. The stated enablement is \"outcome-based measurement across every major channel, including CTV,\" spanning display, CTV, YouTube, social and DOOH [9].\n\n**Critical read — the scope caveat that matters most.** The Lifesight deal is **JAPAC-scoped** (Japan-Asia-Pacific, with Australia explicitly named) [9][15], *not* global. So MiQ's marquee incrementality/MMM/attribution upgrade is, at least at announcement, a regional capability. Any claim that MiQ runs a unified global incrementality engine via Lifesight is unsupported — it is a JAPAC engine. This is a clean example of the broader pattern: the measurement stack is assembled region-by-region from different owners, and \"global\" in the marketing is an aggregate of regional deals, not a single worldwide system.\n\n### 3.4 NielsenIQ — CPG sales-uplift (Sep 2024, Canada-first)\n\nMiQ Canada launched a **sales-uplift solution for CPG advertisers via a data agreement with NielsenIQ**, announced **10 September 2024** [16][17]. It integrates NIQ's \"Precision Areas\" modelled retail-sales data with MiQ's shopper insights to attribute in-store sales to media activations [16][17]. This is more commerce-media than TV-measurement, but it is part of the same outcome-measurement spine and shows the same pattern — a regional (Canada-first) data licence powering an attribution claim.\n\n### 3.5 The currencies and the regional STB feeds\n\nMiQ explicitly names **regional TV currencies** as a third data source [3][4]. These are the official market panels (e.g., the bodies that transact linear TV in each country). MiQ licenses access; it does not own them. STB feeds are similarly third-party. The 11-partner count [2] is the sum of ACR providers, OS providers, currencies and STB feeds across markets — a roster, not a proprietary asset.\n\n**Synthesis of the stack.** Of the named measurement inputs — Samba (ACR), Titan OS (OS-level), Lifesight (MMM/incrementality/location), NielsenIQ (retail sales), regional currencies, STB feeds — **MiQ owns none of the underlying signal.** It owns the integration layer (Sigma), the deterministic stitching, the modelling, and the managed-service delivery. That is a real business. It is also a *services-and-integration* moat, not a *data-ownership* moat, and the two have very different durability profiles (see §6).\n\n---\n\n## 4. Incrementality and Reach/Frequency — The Core Use Case\n\n**So what:** Strip away the platform language and MiQ's ATV product does one thing exceptionally well and sells it hard: **extend a linear-TV campaign into CTV/digital against the audiences linear under-reached, and prove the added reach was incremental** (incremental reach = the additional unique audience a campaign delivers beyond what would have happened anyway). This is the use case every case study demonstrates.\n\nThe mechanism is consistent across campaigns:\n1. Use **ACR data** to segment households into **\"light\"** vs **\"heavy\"** linear-TV exposure.\n2. Build a media plan that over-indexes CTV/YouTube delivery against the **light/under-exposed** households and cord-cutters.\n3. Measure the **incremental reach** and **frequency rebalancing** the CTV layer added on top of linear.\n\n### Case study: Subway (+11.5% incremental reach) — client/vendor-reported\n\nMiQ reports it **extended Subway's linear-TV reach by +11.5%** by serving \"light\" TV viewers across CTV, producing a **+3.4% increase in message frequency** among under-exposed viewers and reaching **46% of the audience exclusively through CTV** [8]. Method: ACR segmentation of exposed vs unexposed households, frequency balancing toward light viewers/cord-cutters, and re-engagement using historical device-ID data from Subway location visits [8].\n\n### Case study: IKEA (+4% incremental reach, £200k saved) — client/vendor-reported\n\nMiQ reports IKEA achieved **+4% incremental reach across audiences not exposed to linear TV** and **£200,000 in cost savings**, via ACR light/heavy segmentation and a custom plan across linear, CTV and YouTube (AVOD), with MiQ combining its data with YouTube's [7]. The campaign was run with **dentsu** as media-planning partner, and dentsu account director Rob Powell is quoted endorsing the \"holistic TV strategy\" [7]. An independent-ish corroboration exists: the IKEA case is also published as an **IAB UK case study** [18], which raises it slightly above pure self-report — though IAB UK case studies are member-submitted, not independently audited.\n\n**Critical read — present every metric as client/vendor-reported.** All these numbers originate in MiQ marketing materials (the IKEA figures are attributed to dentsu/MiQ; the IAB UK page is a member submission). They are **not independently verified outcomes.** They are *plausible and internally consistent* — +4% to +11.5% incremental reach is exactly the order of magnitude this technique produces — but a downstream reader should treat them as \"MiQ/client-reported case-study results,\" never as audited performance. The technique is real. The specific lift numbers are marketing.\n\n---\n\n## 5. How the Measurement Plugs Into Sigma\n\n**So what:** The ATV measurement layer is not a standalone product line. It is increasingly a feature set inside **Sigma**, MiQ's AI platform (launched 4 June 2025) [19]. The Sigma context matters because it is where MiQ's data partnerships converge and where the \"integration moat\" actually lives.\n\nSigma unites **\"more than 300 diverse data feeds, spanning 700 trillion consumer signals\"** across what people watch on TV, browse on the web and buy in stores [9][19]. By the **June 2026** one-year upgrade, that had grown to **2.5 petabytes of daily data from 600+ feeds** — roughly double the launch volume — with Titan OS smart-TV viewership data, Circana retail data and Evertune (AI-search-visibility) added to the spine [12]. Sigma is \"built on top of the three largest global LLMs,\" with an AI agent that turns the signal into media decisions in seconds [19]; the Jun 2026 upgrade added a **Planning Agent** that converts a single prompt into a full media plan [12]. Sigma's integration ecosystem includes **The Trade Desk, Google DV360, Amazon Web Services, Samba, Experian, Databricks, Numerator, Celtra and Circana** [19].\n\nFor the ATV measurement story specifically, two moves are consequential: **Titan OS intelligence integrating into Sigma in Q1 2026** [6][12], and **Lifesight's MMM/incrementality/location data ingesting into Sigma** (JAPAC, Aug 2025) [9]. The direction of travel is clear. The rented TV signals are being funneled into the AI platform so the platform, not the individual partnership, becomes the thing the client buys. MiQ also reports Sigma campaigns delivered **\"$2.22 in value for every $1 spent\" across 40,000+ campaigns from 2,300+ advertisers** [12] — again, MiQ-reported.\n\n**Critical read.** Routing measurement through Sigma is strategically smart: it makes the *platform* sticky even as individual data deals churn underneath. But it also means the measurement product inherits Sigma's dependencies — if Samba or Titan OS data stops flowing into Sigma, the platform's \"complete view\" develops holes the client will see. The integration moat and the rented-data fragility are two sides of the same architecture.\n\n---\n\n## 6. How Durable Is a Measurement Moat Built on Rented Data?\n\n**So what:** This is the central question for the whole measurement business. The honest answer: **the moat is real but conditional, and the conditions are deteriorating market-wide.**\n\n### The structural threat: ACR is going behind walled gardens\n\nThe independent-measurement model MiQ depends on is being squeezed at its source. Per AdExchanger reporting, **Samsung, LG and Roku have brought their ACR data in-house**, keeping it exclusive to their own direct advertiser customers rather than licensing it broadly [10]. VIZIO (via Inscape), the last major broad licensor, **has limited which ad-tech companies can access targeting data** [10]. As CIMM's Jane Clarke put it: *\"If you're a measurement company, it's becoming a walled garden\"* [10]. The coverage consequence, per Sequent Partners, is stark: these limitations *\"can result in less than half of the TV sets in a household being measured\"* by any single ACR provider [10][11]. Nielsen has separately argued that **\"big data from smart TVs isn't enough to measure audiences\"** on its own — ACR lacks the people-level truth panels provide and depends on manufacturer image-matching that drops data across homes, devices and demographics [11].\n\n### What this means for MiQ specifically\n\n1. **The signal owners are becoming competitors.** Samba TV — MiQ's own ACR backbone — runs its own data-and-measurement business; indeed, the 2023 deal *gave* Samba the room to focus on exactly that by offloading managed media to MiQ [5][14]. The OEMs (Samsung Ads, LG Ad Solutions, Roku) sell their ACR-powered measurement directly. Every one of MiQ's suppliers has an incentive to disintermediate the aggregator.\n2. **Diversification is the defense — and MiQ is running it.** The 11-partner, multi-source design is precisely the hedge against any one source going dark: lose one ACR feed and the deterministic footprint degrades rather than collapses. Titan OS (OS-level, more durable than third-party ACR) and the currency relationships diversify away from pure smart-TV ACR. For a walled-garden world, this is a genuinely sensible architecture.\n3. **But aggregation is a thin moat against a determined owner.** If Samba, Titan OS, or a currency body decides aggregation is a business it wants, MiQ's integration advantage is replicable. MiQ's defense is *convenience and neutrality* — it is the agnostic one-stop integrator no single data owner can be, because each owner holds only its own data. That neutrality is MiQ's most durable asset, more than any single feed.\n\n### The honest verdict\n\nMiQ's measurement moat is **an integration-and-neutrality moat sitting on top of rented signal.** It is defensible as long as (a) MiQ keeps re-signing the underlying licences on workable terms, (b) no single owner achieves enough coverage to make the aggregator redundant, and (c) MiQ stays the most convenient neutral fuser of fragmented signal. All three conditions are plausible through 2029 — but the Samba renewal clock (§3.1), the OEM walled-garden trend [10], and the region-by-region (not global) nature of the stack (§3.3) are the three things that could erode it. **Strong, fragile, and dependent on continuous re-contracting — not a durable data-ownership moat.**\n\n---\n\n## 7. Market Context — Why the Measurement Bet Is Well-Timed Regardless\n\n**So what:** Even granting the moat's fragility, MiQ is selling into a rising tide. The demand side validates the strategic bet.\n\nThe IAB forecasts US CTV ad spend to grow **13.8% in 2026**, the second-fastest-growing digital channel after social video (+14.6%) [20][21]. US digital video ad spend is projected to **surpass $80 billion in 2026** (+11% YoY, ~20% faster than the total ad market) and to account for **more than 60% of total TV/video ad spend for the first time** [21][22]. CTV ad spend is independently projected to reach roughly **$46.89 billion by 2028**, surpassing traditional TV [23]. And the industry has converged on **incrementality as the new accountability standard** — the shift from \"this person saw my ad and bought\" to \"this person bought *because* they saw my ad\" [24]. That is exactly the use case MiQ's ATV measurement product is built around (§4).\n\nMiQ's market-facing credentials are current: it has been named to **AdExchanger's Programmatic Power Players every year since 2020** [25], and was **named to YouTube's official Activation Partners Program on 6 October 2025** [26][27] — confirmation that its YouTube-measurement leg (one-third of the \"linear/streaming/YouTube\" triad) has platform-level standing.\n\n**Critical read.** The macro is a genuine tailwind: fragmentation is worsening, CTV spend is climbing double-digits, and incrementality is becoming table stakes — all of which raise demand for exactly what TV Intelligence sells. The risk is not demand. It is *supply* (the rented-signal fragility of §6) and *competition* — VideoAmp, iSpot, Comscore, Nielsen ONE, and the OEMs' own measurement, all chasing the same currency-reform money.\n\n---\n\n## Open Questions\n\n1. **When does the Samba TV agreement renew, and on what terms?** It is the ACR backbone of US TV Intelligence, signed Jan 2023 as \"multi-year\" with no public duration [5][13]. A renewal failure or exclusivity shift is the single largest measurement risk; the timing is unknown.\n2. **Is the 6.4T-signal / 90M-household / 11-partner footprint current as of mid-2026?** These figures date to the April 2024 launch [3][4] and remain on the live site [1][2], but Sigma's spine has doubled since [12]. Are the ATV-specific marketing numbers stale, conservative, or simply un-refreshed?\n3. **Which is the un-productized 5th market?** The panel spans \"five major markets\" but TV Intelligence shipped in four (US/UK/Canada/Australia) [3][4]. What is the fifth, and is it productized yet?\n4. **How much of the incrementality/MMM capability is global vs. JAPAC-only?** The marquee Lifesight MMM/incrementality/attribution deal is JAPAC-scoped [9][15]. Does MiQ have an equivalent owned or licensed incrementality engine in the US/UK/Europe, or is \"global incrementality\" an aggregate of regional point solutions?\n5. **What is MiQ's measurement methodology under independent audit?** Are the incremental-reach figures (IKEA, Subway) MRC-accredited or third-party-verified, or solely MiQ/client-reported? No evidence of independent accreditation was found.\n6. **Did the Titan OS Sigma integration ship fully and at the claimed 20M-CTV scale?** Q1 2026 was the target [6]; the Jun 2026 upgrade confirms Titan OS data is in the spine [12], but the realized scale and coverage are unconfirmed.\n7. **How exposed is the footprint to ACR walled-gardening through 2029?** As Samsung/LG/Roku restrict ACR licensing [10], how much of MiQ's claimed coverage degrades, and how fast can Titan-OS-style OS-level and currency relationships backfill it?\n\n---\n\n## Sources\n\n1. MiQ, \"TV Intelligence in Advertising,\" wearemiq.com/tv-intelligence/ (accessed 2026-06-20). **Tier 1** (corporate self-description). Source of \"only complete view of audience, campaign and competitor intelligence across linear, streaming and YouTube\" and the 6.4T / 90M figures on the live site.\n2. MiQ, \"Advanced TV Advertising,\" wearemiq.com/media-solutions/advanced-tv (accessed 2026-06-20). **Tier 1.** \"6.4 trillion video consumption signals from 11 different partners,\" \"panel of 90M households across five major markets,\" \"60+ AI models,\" \"agnostic DSP partnerships across 7 top TV buying platforms.\"\n3. MiQ, \"MiQ solidifies leadership in Advanced TV advertising with global expansion of TV Intelligence solution in critical markets,\" wearemiq.com (press release, April 2024; accessed 2026-06-20). **Tier 1** (press release — claim of fact, not proof). Source of the 90M / 6.4T / 11-partner / ACR+STB+currency footprint and the US/UK/Canada/Australia launch.\n4. MiQ via Mediaweek AU / Mi3, \"MiQ expands TV Intelligence solution to Australia,\" mediaweek.com.au / mi-3.com.au, 12 April 2024 (accessed 2026-06-20). **Tier 4–5** (trade press). Independent corroboration of the 90M TV sets, 6+ trillion monthly signals, 11 partnerships, 500M CTV households reachable, 69%+ streaming overlap, and Hundal's \"only global analytics platform\" quote.\n5. Samba TV / GlobeNewswire, \"Samba TV and MiQ Reach Multi-year Commercial Agreement,\" globenewswire.com / samba.tv, 13 January 2023 (accessed 2026-06-20). **Tier 1** (press release). 28M US devices, 60M total devices, Samba's exit from managed media sales, MiQ takes managed-media-services business.\n6. MiQ, \"MiQ Builds Unparalleled TV Intelligence in Europe Through Deal With Titan OS,\" wearemiq.com (press release), 18 November 2025 (accessed 2026-06-20). **Tier 1.** 20M+ CTVs across continental Europe, OS-level session-start-to-end signals, Sigma integration Q1 2026, \"only managed-service provider with access to Titan OS-level intelligence.\"\n7. MiQ / dentsu, \"Advanced TV delivers effective and measurable incrementality for IKEA,\" wearemiq.com/case-study (accessed 2026-06-20). **Tier 1** (vendor case study — client-reported). +4% incremental reach, £200k saved, ACR light/heavy segmentation, dentsu as planning partner.\n8. MiQ, \"How we helped Subway drive +11.5% incremental reach with Advanced TV,\" wearemiq.com/case-study (accessed 2026-06-20). **Tier 1** (vendor case study — client-reported). +11.5% incremental reach, +3.4% frequency, 46% reached exclusively via CTV, ACR exposed/unexposed segmentation.\n9. MiQ, \"MiQ announces data partnership with Lifesight to ingest its data into MiQ Sigma platform,\" wearemiq.com (press release), 12 August 2025 (accessed 2026-06-20). **Tier 1.** Lifesight MMM/incrementality/attribution, 300M monthly consented devices, JAPAC scope, 700T-signal / 300-feed Sigma framing.\n10. AdExchanger, \"The Rise Of The Walled Gardens Around ACR Tech In Smart TVs,\" adexchanger.com (accessed 2026-06-20). **Tier 5** (specialist trade press). Samsung/LG/Roku ACR brought in-house; VIZIO/Inscape limits; CIMM \"becoming a walled garden\" quote; Sequent \"less than half of the TV sets in a household\" measured.\n11. Nielsen, \"Big data from smart TVs isn't enough to measure audiences,\" nielsen.com/insights, 2022 (accessed 2026-06-20). **Tier 5** (vendor analysis — note Nielsen is an interested competitor in measurement). ACR coverage/representativeness limitations, image-matching data loss. Editorial-interest caveat: Nielsen sells panel-based measurement, so it has a stake in arguing ACR alone is insufficient — but the technical limitations it cites are corroborated by [10].\n12. PPC Land, \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" ppc.land, 11 June 2026 (accessed 2026-06-20). **Tier 5** (trade/specialist). 2.5 PB/day, 600+ feeds, Planning Agent, Titan OS/Circana/Evertune additions, $2.22-per-$1 across 40,000+ campaigns / 2,300+ advertisers.\n13. Deadline, \"Samba TV Offloads Media Sales Assets To UK-Based Programmatic Firm MiQ,\" deadline.com, January 2023 (accessed 2026-06-20). **Tier 4** (major outlet). Independent corroboration of the Samba→MiQ managed-media transfer and Samba's pivot to data/measurement.\n14. AdExchanger, \"A MiQ-Drop Moment For Samba Ad Sales,\" adexchanger.com, 17 January 2023 (accessed 2026-06-20). **Tier 5.** Samba's multi-source, manufacturer-agnostic, first-party ACR; MiQ handling managed service from Q1 2023.\n15. Mi3 / ITBrief / AdNews, \"MiQ and Lifesight partner on location data for Sigma Platform,\" mi-3.com.au / itbrief.asia / adnews.com.au, 13 August 2025 (accessed 2026-06-20). **Tier 4–5** (trade press). Independent corroboration of the JAPAC scope, 300M consented devices, MMM/incrementality integration.\n16. NielsenIQ, \"MiQ Canada launches new sales uplift solution for CPG advertisers through data agreement with NielsenIQ,\" nielseniq.com / newswire.ca (press release), 10 September 2024 (accessed 2026-06-20). **Tier 1.** NIQ Precision Areas modelled retail-sales data, in-store sales attribution, Canada-first.\n17. Media in Canada, \"MiQ and NielsenIQ partner on data solution to prove media ROI,\" mediaincanada.com, 10 September 2024 (accessed 2026-06-20). **Tier 4–5.** Independent corroboration of the NIQ CPG sales-uplift deal.\n18. IAB UK, \"Using MiQ's Advanced TV solution to deliver effective & measurable incrementality for IKEA,\" iabuk.com/case-studies (accessed 2026-06-20; page returned 403 on direct fetch but indexed and summarized in search). **Tier 5** (industry-body case study — member-submitted, not independently audited). Slightly elevates the IKEA case above pure self-report.\n19. MiQ / BusinessWire / Bridgepoint, \"MiQ Sigma Breaks the Fragmentation Cycle,\" businesswire.com / bridgepointgroup.com (press release), 4 June 2025 (accessed 2026-06-20). **Tier 1.** Sigma launch, 300+ feeds / 700T signals, three-LLM architecture, integration roster (TTD, DV360, AWS, Samba, Experian, Databricks, Numerator, Celtra, Circana).\n20. MediaPost / Television News Daily, \"IAB 2026 Ad Spend Forecast: CTV +13.8%, Social +14.6%,\" mediapost.com (accessed 2026-06-20). **Tier 5.** IAB 2026 channel forecast.\n21. IAB, \"U.S. Digital Video Ad Spend to Surpass $80B in 2026,\" iab.com/news (accessed 2026-06-20). **Tier 2–3** (industry standards body / primary forecast). $80B+ digital video, +11% YoY, 60%+ of TV/video spend.\n22. StreamTV Insider, \"IAB forecasts 13.8% US CTV ad spend growth in 2026,\" streamtvinsider.com (accessed 2026-06-20). **Tier 5** (specialist trade). Independent reporting of the IAB CTV forecast.\n23. MNTN Research, \"CTV Ad Spend Will Grow to $46.89 Billion by 2028,\" research.mountain.com (accessed 2026-06-20). **Tier 5** (vendor research — note MNTN is a CTV ad-platform, interested party). CTV-surpasses-linear projection.\n24. Grocery Dive / Measured, \"Why incrementality is the new currency for retail media,\" grocerydive.com / measured.com (accessed 2026-06-20). **Tier 5.** Incrementality as the emerging accountability standard.\n25. MiQ, \"AdExchanger Programmatic Power Players\" (cited on wearemiq.com Advanced TV materials; accessed 2026-06-20). **Tier 1/5.** Recognition every year since 2020. (AdExchanger Power Players is a paid-application industry list — recognition, not an independent ranking.)\n26. MiQ / BusinessWire, \"MiQ Named to Official YouTube Activation Partners Program,\" businesswire.com, 6 October 2025 (accessed 2026-06-20). **Tier 1.** YouTube Activation Partner designation — going-concern confirmation of the YouTube measurement leg.\n27. PPC Land, \"YouTube launches specialized activation partners program,\" ppc.land (accessed 2026-06-20). **Tier 5.** Independent corroboration of the YouTube partner program and MiQ's inclusion."}, {"order": 5, "file": "05_Agency_And_Client_Relationships.md", "title": "How MiQ Sells and Delivers: The Agency & Client Relationship Architecture", "summary": "", "body": "# 05 — How MiQ Sells and Delivers: The Agency & Client Relationship Architecture\n\n## Bottom Line\n\n**MiQ does not sell software. It sells outcomes, and it delivers them with its own people sitting between the client and the machine.** That single fact explains almost everything else about how the company goes to market. The core motion is **managed service** — MiQ's traders run the campaign *for* the client, as an extension of the client's team, rather than handing over a self-serve seat and walking away. Its flagship Sigma platform, despite being marketed as \"the first AI platform that unifies the programmatic ecosystem,\" is not shipped to clients to operate; it is the tool MiQ's own traders wield on the client's behalf [1][2][7].\n\nThat managed-service core fans out into four distinct customer relationships, each with a different commercial logic. **(1) Direct brands** — MiQ's marketing names Marriott, Dell, Mercedes, Microsoft and a roster of CPG (consumer packaged goods) advertisers, though MiQ's most recent 2026 boilerplate has quietly dropped the named-client list, and these names must be read as vendor claims rather than confirmed current accounts [4][13]. **(2) Independent agencies**, served through the **Pathlabs** acquisition (announced July 2024; a white-label Media Execution Partner that runs campaigns behind the agency's brand, kept as an independent business unit) — MiQ's bet on the ~$25B of US digital spend flowing through midsize indies [3][8]. **(3) Holding companies** (advertising holdcos like WPP, Publicis, Omnicom, IPG, Dentsu that own dozens of agencies) — where MiQ in June 2025 landed **Dentsu as the first holdco to put Sigma \"at the strategic centre\" of its media practice**, naming MiQ its official \"Intelligence Partner\" [5][6]. **(4) Verticalized solutions** — CPG sales-uplift built on NielsenIQ and Numerator/Circana data, plus political, auto, travel and finance practices [9][14].\n\n**MiQ's go-to-market rests on a tension: it must be two contradictory things at once — the independent alternative to the holdcos, and a vendor *to* the holdcos.** It sells itself to indie agencies and direct brands precisely as the antidote to holdco lock-in and conflict — yet its most prominent recent deal is an arm's-length embrace of Dentsu, and its boilerplate has long listed GroupM and IPG as clients. MiQ manages this channel conflict two ways: it keeps relationships *agnostic and non-exclusive* (the Dentsu deal is not described as exclusive), and it walls off its agency-facing arm (Pathlabs) as a separately branded unit. Through 2029 the live question is whether Sigma pulls MiQ *up* the value chain into a defensible platform-and-data business, or whether agentic AI commoditizes the managed-service labor that is MiQ's actual product.\n\n---\n\n## 1. The Managed-Service Core: MiQ's Traders Are the Product\n\n**Answer first: hire MiQ, and what you buy is a team of programmatic traders who run the campaign for you — not a login.** This is the foundational distinction in MiQ's model, and getting it wrong is the most common error in describing the company.\n\nThe industry term of art is **managed service**: MiQ's own traders, data scientists, and ad-operations staff plan, execute, optimize, and report on the campaign, acting as an extension of the client's in-house team. The contrast is **self-serve**, where the client licenses software and runs it with their own people. MiQ markets exactly the first: its \"team of agile programmatic experts can provide end-to-end campaign management or become an extension of an in-house team,\" with traders who \"convert insights into omnichannel media activations\" and client-service and ad-ops teams providing \"around-the-clock support\" before, during, and after campaigns [7].\n\n### Managed service, not self-serve, is MiQ's core delivery model\n\nMiQ's primary go-to-market motion is managed service: its own traders operate campaigns on behalf of clients, who do not typically operate MiQ's software themselves. Co-founder and CEO Gurman Hundal described the business in a Marketecture interview as offering \"ad trading, data science, and other support to clients — often other agencies — in need of programmatic expertise,\" a managed-service approach that lets agencies and advertisers access specialized capabilities without building in-house teams [2]. MiQ's own solutions pages confirm the model: end-to-end campaign management with traders as an extension of the client team [7]. This is the spine of every other relationship in MiQ's model.\n\n### The Sigma twist — a platform clients mostly don't touch\n\nHere is the subtlety that trips up most observers. In June 2025 MiQ launched **Sigma**, marketing it as \"the first AI platform that unifies the programmatic ecosystem\" — 300+ data feeds, 700 trillion consumer signals, DSP-agnostic, with an AI-powered trading agent built on OpenAI, Gemini, and Claude LLMs [1][5]. The word \"platform\" implies self-serve. In practice Sigma is an *internal* tool. By MiQ's own account, Sigma \"is not shipped off for clients to run themselves, but rather used internally to make every dollar work harder,\" with the *outputs* shared with clients [7]. Traders using Sigma reportedly make \"twice as many optimizations as before,\" and MiQ claims Sigma campaigns returned **$2.22 in value for every $1 spent** versus standard programmatic setups [1][12].\n\n### Sigma is a trader-operated platform, not (primarily) a self-serve product\n\nAs of June 2026, MiQ positions Sigma as the engine its own traders operate on behalf of clients — a managed-service tool — rather than a self-serve seat licensed to advertisers. None of MiQ's 2025–2026 Sigma announcements describe a self-serve client offering; the consistent framing is \"managed campaigns\" and traders \"making optimizations\" [1][5][12]. The AdExchanger Cannes 2025 framing is telling: Sigma \"blends human expertise with AI to supercharge performance — without replacing the people behind the screens\" [10]. The explicit \"not shipped to clients\" characterization rests heavily on MiQ's own solutions-page language [7]; the absence of any announced self-serve offering across multiple 2025–2026 releases corroborates it, though a future self-serve Sigma tier would change this materially.\n\n**So what for a buyer:** engage MiQ and you buy labor plus a data-and-AI advantage you cannot replicate by licensing the software — because you cannot license the software. The moat is the trader-plus-Sigma bundle, not Sigma alone. That is good for stickiness and bad for the SaaS-style margins a PE owner would prize — a tension taken up later, in the chapter on the commercial model and margins.\n\n---\n\n## 2. The Agency-Extension / MEP Model: Pathlabs and the Indie Bet\n\n**Answer first: MiQ's clearest single move on the agency side was buying Pathlabs in 2024 to own the \"Media Execution Partner\" relationship with midsize independent agencies — a ~$25B US spend pool that the holdcos and the big DSPs underserve.**\n\nA **Media Execution Partner (MEP)** runs paid-media campaigns *behind the scenes* for an agency that keeps the client relationship and the strategy. The agency's client never sees the MEP. The model is white-label and pass-through: the agency protects its margin and skips hiring a programmatic team, while the MEP handles everything from planning through reporting.\n\n### MiQ acquired Pathlabs in 2024 to serve midsize independent agencies as a white-label MEP\n\nOn **July 29, 2024**, MiQ announced plans to acquire Pathlabs, a Media Execution Partner founded in 2021, headquartered in Missoula, Montana, with a ~100-person team that provides end-to-end digital media execution to independent agencies [3][8]. Pathlabs operates white-label: \"agencies keep the client relationship and stay in control of strategy while Pathlabs handles media execution behind the scenes,\" fitting in as a pass-through cost that helps agencies \"protect margins, reduce hiring pressure, and scale media\" [8]. Deal terms were not disclosed [3].\n\n### Pathlabs is run as an independent, separately branded business unit\n\nFollowing the close, Pathlabs \"retains its brand identity and operates as an independent business unit under MiQ's ownership,\" led by CEO William Lapointe [3]. The cited release names Charlie Neer and Erin Madorsky as MiQ's US co-CEOs but does not state Lapointe's reporting line. An April 27, 2026 Pathlabs source confirms Lapointe is still CEO, the MEP model is still core, and MiQ ownership is intact, with Pathlabs reporting 188% growth and a second consecut
