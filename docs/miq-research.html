<script id="corpus-data" type="application/json">{"slug": "miq-research", "title": "On Leased Land", "subtitle": "MiQ, the independent programmatic trading desk, and its CTV/ATV bet", "author": "", "generated": "2026-06-20", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of MiQ", "summary": "MiQ is a $600M, 1,900-person media company that doesn't own the software it buys ads with — it stands between advertisers and that software, selling results instead of a login, and its whole future turns on whether it can outrun the AI now automating the human work it sells.", "body": "# Six Easy Pieces of MiQ\n\n*A London trading desk that grew into a global TV-data company — now racing to sell itself before the clock runs out.*\n\n## The company that buys ads without owning the tools\n\nHere is the strange thing about MiQ. It spends a fortune on advertising technology and owns almost none of the technology it uses. When a brand like Marriott or Dell wants its ads in front of the right people — on websites, in apps, on streaming TV — it needs software to do the bidding. That software is expensive and hard to build, and MiQ doesn't build it. It pays to *use* other companies' software, wraps its own data and human experts around it, and sells the brand an outcome — more sales, cheaper — rather than a tool.\n\nThat one choice explains everything else. MiQ started in London in 2010 as a \"trading desk\" — a small team that runs ad campaigns on a client's behalf, the way a personal shopper spends your money for you, except what they buy is attention, not anything you keep. Fifteen years later it's a roughly **$600 million, 1,900-person** business on three continents, but underneath it's still that trading desk: skilled people sitting between the advertiser and the machinery, taking a cut of the spending that flows through. Everything smart and everything fragile about MiQ comes from being that middleman.\n\n## Why a busy person should care who the middleman is\n\nFollow the money. Of every dollar a big advertiser spends, only part buys an ad a real human sees; the rest gets skimmed by the chain of middlemen in between. The whole modern ad industry is a fight over who gets to sit in that chain and take a cut, and MiQ is one of those sitters. When it works well, the advertiser's dollar goes further; when the chain gets too crowded and greedy, brands pull the work back in-house and cut the middlemen out.\n\nThere's a bigger stake, too, about jobs and AI. MiQ's product is human skill — traders who know how to aim a campaign — and that is exactly the work today's AI is learning to do. So MiQ is a live test of a question larger than one company: when a machine learns the expert labor you sell, do you climb up to become a software company in time, or get commoditized — reduced to a cheap service anyone can undercut? MiQ's whole future turns on which way that goes.\n\n## The handful of players you need to keep straight\n\nFive things, and you can hold the rest of the story straight.\n\n**Programmatic advertising** — the automated, auction-based buying of ad space. Software places bids on individual ad slots in the split second before a page loads, instead of a salesperson negotiating each one. This is the water MiQ swims in.\n\n**A DSP (demand-side platform)** — the software an advertiser uses to place those bids; think of it as the buying terminal. The big ones are **The Trade Desk** (the largest independent one), **Google's DV360**, and **Amazon's**. The key fact: MiQ *doesn't own a DSP.* It buys through everyone else's — which, as we'll see, is its whole edge.\n\n**Managed service** — MiQ's way of working: its own staff plan and run your campaigns for you and take a fee on the spend. The opposite is *self-serve*, where you license the software and press the buttons yourself.\n\n**CTV and ATV (Connected TV and Advanced TV)** — ads on internet-connected televisions (smart TVs, streaming sticks, consoles) rather than old-fashioned broadcast. This is where TV money is flooding, and it's MiQ's strongest card. To aim those ads you need to know what people are watching — which comes from **ACR (automatic content recognition)**, a feature in many smart TVs that fingerprints what's on the screen.\n\n**Sigma** — MiQ's AI platform, launched June 2025. Picture it as one master control panel above all the separate buying terminals (the DSPs). Sigma is *not* itself a DSP and places no bids of its own; it drives the terminals that do, tying MiQ's data, targeting, and an AI \"Trading Agent\" into one place. It's the bet that MiQ can become a technology company, not just a service.\n\nTwo owners round out the cast: founders **Gurman Hundal and Lee Puri**, who still run the place; and **Bridgepoint**, the private-equity firm — an investor that buys companies, improves them, and sells them on for profit — that took majority control in 2022. One more name to plant: **Dentsu**, a giant Japanese advertising group that owns dozens of ad agencies. MiQ already works with it as a partner, and it is exactly the kind of firm that might one day buy MiQ outright.\n\n## How a single ad dollar actually moves\n\nWalk one dollar through MiQ and the business becomes clear. A brand hands MiQ a goal: reach TV viewers who *haven't* already seen our broadcast ad, and prove it drove more sales. To find those people, MiQ leans on its most-marketed asset — what it calls the **world's largest TV data footprint**: some **6.4 trillion** signals about what households are watching, from about **90 million homes**. From that, it works out which viewers the brand misses on regular TV, so it can catch them on streaming instead.\n\nNow MiQ has to *buy* those streaming ad slots. It doesn't own the buying terminal, so it reaches into whichever DSP has the right ad slots available — The Trade Desk for some, Google's for YouTube, Amazon's for others — and bids. Buying through all of them, it assembles reach no single terminal could alone. The skill isn't owning a pipe; it's being *agnostic* — tied to no provider, free to buy wherever the best ad is. Sigma is where the trader works, reaching down into each terminal at once; the DSPs still place the actual bids, but Sigma — increasingly with an AI assistant — decides where to reach and later stitches together the proof.\n\nMiQ keeps a slice of the dollar as its fee. Because real people do much of the work, this is a *services* business, not a software one: its profit margin runs around **9–11%** — nowhere near the 40%-plus a pure software company like The Trade Desk enjoys. That gap is the whole reason Sigma exists: shift the work from people to software, and the margins climb.\n\nBut here's the catch under everything. MiQ **owns almost none of the underlying data.** The TV-watching signals are *rented* — the ACR belongs to a company called Samba TV, the European smart-TV data to one called Titan OS. MiQ's genius is fusing those rented feeds into one clean picture; its edge is aggregation and neutrality, not ownership. It's built a fortress — but on rented land, and the landlords can change the terms whenever they like.\n\n## The bull case and the bear case, both at full strength\n\nSmart people split cleanly on MiQ, and both readings are honest.\n\n**The bull** says MiQ has quietly built something scarce. Its neutrality is a genuine *moat* — a hard-to-copy advantage that keeps rivals out — because the ad-buying giants each own a DSP and quietly steer spend toward it, while MiQ, owning none, buys across every terminal on the merits. Its TV data footprint is real and hard to reassemble. And Sigma, trained on fifteen years of trading history, could turn that human craft into software that runs itself — lifting margins and *re-rating* the company, meaning investors would value it far more highly, the way they pay a premium for software firms. Here, AI is MiQ's *rescue*.\n\n**The bear** says the opposite: AI is MiQ's *executioner.* If autonomous buying agents get good enough, the skilled human trading MiQ sells becomes a commodity — anyone's machine can do it, and MiQ's fee gets competed away. Worse, MiQ doesn't own its data. Any landlord could raise the rent, sell the same signal to MiQ's rivals (Samba already sells to The Trade Desk), or get bought and cut MiQ off. Here the fortress on rented land gets repriced, and the middleman is squeezed from both sides at once.\n\nWhere does the evidence lean? Toward survival, but not comfort. MiQ is profitable, scaled, and — crucially — was *born* transparent and independent, which shields it from the two upheavals that gutted its rivals: the secret-markup mess (rivals caught quietly padding the price of ads and pocketing the difference) and the wave of brands buying in-house (advertisers running the work themselves and firing the middlemen). The one threat it has no clean answer to is the commoditization of its human skill. And one honest flag: nearly every impressive Sigma number comes from MiQ itself, with no outside auditor — claims, not proof, and the single biggest unknown in the picture.\n\n## Where it's heading — and the one clock that decides it\n\nThe most likely outcome is not that MiQ collapses. It's that MiQ gets *sold* — and the real question is what kind of sale. The reason is a clock. Private-equity firms don't hold forever; they buy, improve, and sell on, usually inside four to seven years. That puts MiQ, bought in 2022, in a **2026–2028 window** where something has to happen. The obvious escape hatch — going public on the stock market — has been slammed shut by the broader ad-tech slump. So the pressure points at a sale.\n\nThree plausible futures, in honest proportion:\n\n- **A strategic sale (the most likely single outcome).** A larger buyer — an ad-holding company like Dentsu, or a data or streaming player that wants MiQ's TV footprint — buys it outright. MiQ's independence ends; the brand may live on inside someone bigger.\n- **Staying independent a while longer.** Bridgepoint sells to *another* investor or refinances, and MiQ keeps operating as \"the largest independent\" — surviving, but with its margins slowly bled by bigger players. Nearly as likely as an outright sale.\n- **The two tails.** A grim one, where AI commoditizes the trading work faster than Sigma can save the company, and MiQ erodes or sells in distress. And a bright one — the least likely — where Sigma genuinely becomes a software business and investors re-rate MiQ into something far more valuable.\n\nWatch for one thing: a sign that MiQ is being shopped — a banker hired, a \"reviewing its options\" report, the Dentsu partnership deepening from a handshake into ownership. And watch for the number that would flip the whole story: a real, disclosed line of *software* revenue from Sigma. As of now, none exists. Whether it ever appears is, in the end, the difference between a company that got absorbed and a company that grew up."}, {"order": 1, "file": "01_Origins_And_Strategic_Arc.md", "title": "Origins and Strategic Arc: How MiQ Became a Global Programmatic Media Partner", "summary": "", "body": "# Origins and Strategic Arc: How MiQ Became a Global Programmatic Media Partner\n\n## Bottom Line\n\nMiQ is a fifteen-year-old, founder-led, private-equity-owned independent programmatic media partner — \"programmatic\" meaning automated, auction-based ad buying, and \"media partner\" meaning it sits between advertisers and the ad-buying software rather than owning media itself. Gurman Hundal and Lee Puri founded it in London in July 2010 (as Media iQ Digital) on a single insight: the booming programmatic ad economy lacked a layer that turned data into actionable buying intelligence. They bootstrapped a managed trading desk — a team that buys programmatic ads on clients' behalf — into a global business, took one minority private-equity round from ECI Partners in 2017 (a deal that returned ECI a reported 6.1x at exit), then sold majority control to Bridgepoint Group in 2022. Through both rounds the founders stayed owner-operators. The company today reports roughly 1,900 staff across North America, Europe and APAC, with most revenue from the United States. Its defining move is the 2025 pivot from a managed-service trading desk to an AI platform, **Sigma**, built on a multi-decade trading data set and wired into an Advanced TV (ATV) / Connected TV (CTV) stack; a holding-company anchor deal with Dentsu followed in June 2025. Four decisions mark the genuine forks in the road — the 2017 choice to sell minority rather than majority, the US-first internationalization, the bet on platformization over pure services, and the Bridgepoint-funded M&A roll-up (Grasp, Pathlabs, Adsmovil). At each one, MiQ could plausibly have become a different, smaller, or acquired company.\n\n---\n\n## 1. The Founding Insight: Data-Driven Intelligence in a Booming-but-Blind Market (2010)\n\n**So what:** MiQ was founded to sell the one thing the early programmatic market could not yet produce for itself — decision-grade intelligence from fragmented ad data. That insight, not a piece of technology, is the company's origin DNA. It explains why, fifteen years later, the flagship product is an *intelligence* platform, not a buying tool.\n\nMIQ DIGITAL LIMITED was incorporated at Companies House (England & Wales, no. 07321732) on **21 July 2010** [1]. Two earlier names precede the present one: the entity was registered as **MEDIA IQ TRADING LTD** for two months (21 July – 21 September 2010), then as **MEDIA IQ DIGITAL LTD** from 21 September 2010 until **14 May 2018**, when it adopted the present **MIQ DIGITAL LIMITED** name [1]. So the \"MiQ\" brand most people use post-dates the founding by roughly eight years; for those first eight years the company traded as \"Media iQ.\" Its registered office is in central London (Charlotte Building, 17 Gresse Street, W1T 1QL as of the latest filings), and its classified activity is the catch-all SIC code 82990, \"other business support service activities\" [1].\n\nThe founders are **Gurman Hundal** and **Lee Puri**, both ad-network operators from London's display-advertising scene of the 2000s. Hundal began at the pan-European ad network Adlink Internet Media, where (per MiQ's own corporate biography) he launched the performance division roughly six months in, then set up an online ad network, A&NY Media, for the publisher group Associated Northcliffe Media [2]. Puri's pre-MiQ career ran in parallel: senior roles building new divisions inside UK ad networks — VC Media in the early 2000s, a performance network within Adlink Internet Media in 2003, and in 2007 the launch of the **Unanimis** performance network, whose success played a role in that company's 2009 sale to France Telecom [2]. These biographical specifics come largely from MiQ-authored and profile sources.\n\nThe founding thesis, in MiQ's telling, was that the ad-tech economy was thriving but lacked **data-driven insight** — a way to convert the exhaust of programmatic auctions into intelligence advertisers could act on [2]. This matters for the strategic arc. MiQ did not start as a demand-side platform (DSP — the software advertisers use to buy ads programmatically), and never tried to. It started as the analytical and trading layer that sits *on top of* third-party DSPs. That agnostic \"we operate the plumbing, we don't own it\" posture is the through-line from 2010 to Sigma in 2025.\n\n> **Key Claim 1.1** — MIQ Digital Limited was incorporated on 21 July 2010 and traded as \"Media iQ Digital\" until adopting the \"MiQ Digital\" name on 14 May 2018, per the Companies House primary record [1].\n\n> **Key Claim 1.2** — MiQ was founded by Gurman Hundal and Lee Puri, both veterans of 2000s London display-ad networks (Adlink, A&NY Media, Unanimis), on the thesis that the programmatic market lacked a data-driven intelligence layer [2].\n\n---\n\n## 2. The Bootstrapped Trading-Desk Years (2010–2016)\n\n**So what:** For its first six-plus years MiQ grew without institutional equity, funding expansion from its own managed-service margin. That bootstrapped period is why the founders entered their first PE round already owning the business outright — and why they could negotiate to stay owner-operators rather than be replaced.\n\nFrom 2010 to 2016 MiQ operated as what the industry calls an **independent trading desk** — a managed-service team that plans and executes programmatic campaigns on clients' behalf across third-party DSPs, layering on proprietary data and analytics. Revenue came from managed-service fees and the margin on media bought. The corporate record matches organic, unsponsored growth: the persons-with-significant-control (PSC) filings show Hundal and Puri *each* holding between 25% and 50% of shares and voting rights as late as 6 April 2016, with no institutional PSC recorded before mid-2017 [3]. As of early 2016, in other words, the two founders still controlled the company between them.\n\nBy 2015–2017 the business that ECI and GP Bullhound would later back was no longer a UK-only shop. MiQ's own and investor accounts describe a company that had begun internationalizing — most consequentially into the United States, which would become its largest market. The advisory relationship that led to the first institutional round began in **2015**, when GP Bullhound (a tech-focused merchant bank and growth investor) started working with the business ahead of the 2017 transaction [4].\n\n> **Key Claim 2.1** — As of 6 April 2016, founders Hundal and Puri each held between 25% and 50% of MiQ's shares and voting rights, with no institutional person-with-significant-control recorded — consistent with a bootstrapped, founder-owned company entering its first PE round, per the Companies House PSC record [3].\n\n---\n\n## 3. ECI's 2017 Minority Round — and the Control Nuance (2017)\n\n**So what:** The 2017 round is usually called a \"minority investment,\" and that framing is correct on the *cash-and-headlines* level — but the corporate record shows the holding vehicle that ECI and GP Bullhound used took **75%-or-more** control of the operating company. This is the first genuine inflection point. MiQ ceded formal control of the operating entity to an investor vehicle in 2017, five years earlier than the \"Bridgepoint took majority in 2022\" narrative implies. Reconciling the two takes care, and the discrepancy is itself a finding.\n\nThe public story: **ECI Partners**, a UK growth-focused private-equity firm, made a **minority investment** in MiQ in **2017**, alongside **GP Bullhound's** growth funds [4][5]. ECI's managing partner Tom Wrenn led the relationship [5]. The capital backed MiQ's \"hyper growth\" phase, above all its US expansion [4].\n\nThe corporate record tells a sharper story. MiQ's PSC filings show that on **15 July 2017** both founders *ceased* to be persons with significant control, and a single corporate entity — **Insight Bidco Limited** (Companies House no. 10859114) — became the active PSC, recorded as holding \"ownership of shares — 75% or more\" and \"ownership of voting rights — 75% or more,\" plus the right to appoint and remove directors [3]. \"Bidco\" (bid company) is the standard private-equity acquisition-vehicle naming convention. So while the *economic* deal may have left the founders with substantial equity (consistent with \"minority investment\" describing ECI's own stake or the cash injected), *control* of the operating company passed to the investor-controlled holding structure in mid-2017.\n\nThe reading most consistent with all sources: the \"minority\" label describes the equity ECI/GP Bullhound took as growth investors backing a founder-led team, while the Bidco structure is the standard topco/bidco holding architecture through which PE deals are held — and through which the *later* Bridgepoint majority deal also runs (Insight Bidco remains the PSC of the operating company as of the latest filing) [3]. For the history, the practical point holds either way: the founders kept running the company, but formal control sat in an investor vehicle from 2017 onward. The precise economic split remains an open question — the percentages ECI vs. founders held in 2017 are not in the public filings consulted here.\n\nThe exit settles any doubt about the round's success. When ECI sold to Bridgepoint in 2022, it announced a **6.1x return** on the 2017 investment [5]; a separate investor disclosure framed the same exit as a **5.9x multiple of invested capital (MOIC)** with a **49% IRR**, on the back of roughly **27% organic revenue growth** and a **31% EBITDA CAGR** across the ~five-year hold [6]. GP Bullhound's growth fund (Fund III) likewise reported an approximately 6x return [4]. The modest gap between \"6.1x\" (ECI's headline) and \"5.9x\" (a secondary investor disclosure) is the ordinary difference between gross and net-of-fees multiples; both are sourced, and both stand here rather than being reconciled away.\n\n> **Key Claim 3.1** — ECI Partners made a minority investment in MiQ in 2017 alongside GP Bullhound's growth funds; ECI led via managing partner Tom Wrenn [4][5].\n\n> **Key Claim 3.2** — On 15 July 2017 both founders ceased to be persons-with-significant-control and Insight Bidco Limited (no. 10859114) became the operating company's PSC at the \"75% or more\" shares-and-voting threshold — meaning formal control of the operating entity passed to an investor-controlled holding vehicle in 2017, not 2022 [3]. Reconciliation with the \"minority\" framing is partly inference.\n\n> **Key Claim 3.3** — At the 2022 exit, ECI reported a 6.1x return on its 2017 investment; a secondary investor disclosure framed it as 5.9x MOIC / 49% IRR on ~27% organic revenue growth and a 31% EBITDA CAGR over the ~five-year hold. The 6.1x is from ECI's own release [5]; the 5.9x/49% IRR figures come from a single secondary investor disclosure [6].\n\n---\n\n## 4. Bridgepoint Takes Majority, with Pemberton Debt (2022)\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 300\" role=\"img\" aria-label=\"A timeline from 2010 to 2029 of MiQ's ownership and key milestones. Markers above the axis: founded July 2010; ECI and GP Bullhound minority round in 2017 with Insight Bidco taking 75 percent plus control; Bridgepoint majority buyout in September 2022 with Pemberton debt at around one billion dollars; Pathlabs acquired 2024; Sigma launched and Dentsu deal 2025; Adsmovil LatAm and Rocket Lab acquired 2026. Three ownership bands run below the axis: founder-owned and bootstrapped from 2010 to 2017, ECI minority from 2017 to 2022, and Bridgepoint majority from 2022 onward, with a highlighted 2026 to 2028 exit window at the end where the forecast turns.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" class=\"t-serif\" style=\"font-size:15px;font-weight:700\">The fifteen-year clock &#8212; founding to the exit window<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px\">A debt-funded 2022 buyout starts a countdown the 2029 forecast turns on<\/text>\n<line x1=\"40\" y1=\"150\" x2=\"660\" y2=\"150\" class=\"ln\" style=\"stroke-width:1.5\"/>\n<g class=\"cv-fade\" style=\"--d:.1s\">\n<line x1=\"40\" y1=\"146\" x2=\"40\" y2=\"154\" class=\"ln\" style=\"stroke-width:1.5\"/>\n<text x=\"40\" y=\"170\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:9px\">2010<\/text>\n<line x1=\"268\" y1=\"146\" x2=\"268\" y2=\"154\" class=\"ln\" style=\"stroke-width:1.5\"/>\n<text x=\"268\" y=\"170\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:9px\">2017<\/text>\n<line x1=\"431\" y1=\"146\" x2=\"431\" y2=\"154\" class=\"ln\" style=\"stroke-width:1.5\"/>\n<text x=\"431\" y=\"170\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:9px\">2022<\/text>\n<line x1=\"660\" y1=\"146\" x2=\"660\" y2=\"154\" class=\"ln\" style=\"stroke-width:1.5\"/>\n<text x=\"660\" y=\"170\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:9px\">2029<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.2s\">\n<circle cx=\"40\" cy=\"150\" r=\"5\" class=\"f-t3\"/>\n<line x1=\"40\" y1=\"150\" x2=\"40\" y2=\"92\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"46\" y=\"88\" class=\"t-serif\" style=\"font-size:10px;font-weight:700\">Founded (Jul 2010)<\/text>\n<text x=\"46\" y=\"100\" class=\"t-muted\" style=\"font-size:8.5px\">as Media iQ Digital, London<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.3s\">\n<circle cx=\"268\" cy=\"150\" r=\"5\" class=\"f-t4\"/>\n<line x1=\"268\" y1=\"150\" x2=\"268\" y2=\"112\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"262\" y=\"108\" text-anchor=\"end\" class=\"t-serif\" style=\"font-size:10px;font-weight:700\">ECI / GP Bullhound (2017)<\/text>\n<text x=\"262\" y=\"120\" text-anchor=\"end\" class=\"t-muted\" style=\"font-size:8.5px\">minority; Insight Bidco 75%+<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.4s\">\n<circle cx=\"431\" cy=\"150\" r=\"6\" class=\"f-t1\"/>\n<line x1=\"431\" y1=\"150\" x2=\"431\" y2=\"74\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"431\" y=\"70\" text-anchor=\"middle\" class=\"t-serif\" style=\"font-size:10.5px;font-weight:700\">Bridgepoint majority (Sep 2022)<\/text>\n<text x=\"431\" y=\"82\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">~$1B, Pemberton debt &#183; ECI exits 6.1&#215;<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.5s\">\n<circle cx=\"497\" cy=\"150\" r=\"4\" class=\"f-t2\"/>\n<line x1=\"497\" y1=\"150\" x2=\"497\" y2=\"206\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"497\" y=\"220\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">Pathlabs &#8217;24<\/text>\n<circle cx=\"529\" cy=\"150\" r=\"4\" class=\"f-t2\"/>\n<line x1=\"529\" y1=\"150\" x2=\"529\" y2=\"230\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"529\" y=\"244\" text-anchor=\"middle\" style=\"font-size:8.5px;font-weight:700\">Sigma + Dentsu &#8217;25<\/text>\n<circle cx=\"562\" cy=\"150\" r=\"4\" class=\"f-t2\"/>\n<line x1=\"562\" y1=\"150\" x2=\"562\" y2=\"206\" class=\"ln-soft\" style=\"stroke-width:1\"/>\n<text x=\"566\" y=\"220\" class=\"t-muted\" style=\"font-size:8.5px\">Adsmovil &#8217;26<\/text>\n<\/g>\n<g class=\"cv-grow-right\" style=\"--d:.6s\">\n<rect x=\"595\" y=\"259\" width=\"65\" height=\"24\" rx=\"2\" class=\"f-t2\"/>\n<text x=\"627\" y=\"275\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:9px;font-weight:700\">EXIT 26&#8211;28<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.7s\">\n<rect x=\"40\" y=\"184\" width=\"228\" height=\"14\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"154\" y=\"194\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:8.5px;font-weight:700\">founder-owned, bootstrapped<\/text>\n<rect x=\"268\" y=\"184\" width=\"163\" height=\"14\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"349\" y=\"194\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:8.5px;font-weight:700\">ECI minority<\/text>\n<rect x=\"431\" y=\"184\" width=\"229\" height=\"14\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"545\" y=\"194\" text-anchor=\"middle\" class=\"t-inv\" style=\"font-size:8.5px;font-weight:700\">Bridgepoint majority<\/text>\n<\/g>\n<text x=\"350\" y=\"294\" text-anchor=\"middle\" class=\"t-muted t-serif\" style=\"font-size:10px;font-style:italic\">Everything after 2022 reads twice: as strategy, and as packaging for a sale.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> The roll-up and the platform pivot are not free-standing moves &#8212; they sit inside a private-equity clock. A four-to-six-year hold from the September 2022 buyout lands MiQ in a 2026&#8211;2028 transaction window, which is exactly where the forecast finds its pivot.<\/figcaption>\n<\/figure>\n\n\n**So what:** The 2022 Bridgepoint deal is the capital event that funded everything since — the platform build and the M&A roll-up. It also re-confirmed the owner-operator model: the founders and management stayed, and Bridgepoint bought *into* a going concern rather than installing new leadership.\n\nOn **13 September 2022**, MiQ announced that **Bridgepoint Group** — a London-listed pan-European private-markets manager — had agreed to acquire a **majority stake**, buying out ECI and GP Bullhound and partnering with the existing management team for the \"next phase\" of growth [7][8]. Trade and deal-tracking coverage put the valuation at **up to ~$1 billion** [8][9]. On Bridgepoint's side the transaction was led by Director Charles Welham and Partner/CIO Xavier Robert, named in MiQ's announcement [7]. The acquisition debt came from **Pemberton Asset Management**, which publicly confirmed it supported Bridgepoint's acquisition of MiQ [10]. Bridgepoint holds the asset through its private-equity (middle-market) strategy [11].\n\nTwo going-concern facts anchor the present ownership picture. First, the Companies House PSC register still records **Insight Bidco Limited** as the controlling PSC of the operating company at the \"75% or more\" threshold — the holding structure through which the Bridgepoint ownership runs [3]. Second, MiQ's most recent statutory accounts at Companies House are made up to **31 December 2024**, the next accounts are not due until **30 September 2026**, and the company status is **Active** [1]. By the most recent public record, MiQ is a live, filing, going concern.\n\nAt the 2022 announcement the founders' public roles were Hundal as co-founder (then Global Executive Chairman) and Puri as co-founder, both continuing to lead [7]. MiQ's *current* leaders page lists Hundal as **Global CEO** again — the roles have evolved since 2022, taken up in the leadership section below.\n\n> **Key Claim 4.1** — On 13 September 2022 Bridgepoint Group acquired a majority stake in MiQ, buying out ECI and GP Bullhound, with the existing management team staying on; trade and deal coverage valued the deal at up to ~$1 billion [7][8]. The ~$1B valuation is reported by trade and deal-tracking sources, not officially disclosed [8][9].\n\n> **Key Claim 4.2** — Pemberton Asset Management provided debt financing for Bridgepoint's acquisition of MiQ [10].\n\n> **Key Claim 4.3** — As of the latest Companies House record, MiQ Digital Limited is Active, its controlling PSC is Insight Bidco Limited (75%+), and its most recent accounts are made up to 31 December 2024 (next due 30 September 2026) — confirming Bridgepoint-era ownership remains in place [1][3].\n\n---\n\n## 5. Internationalization: A US-First Independent (2015–present)\n\n**So what:** MiQ is a London-founded company whose center of gravity moved to the United States. The US-first expansion is the single biggest reason the 2017–2022 returns were so large, and it shapes everything downstream — leadership (US Co-CEOs), the Sigma rollout sequence (US/Canada/UK/Australia first), and the M&A targets (Pathlabs in Montana, Adsmovil's LatAm/Hispanic footprint).\n\nBy the 2022 exit, the **majority of group revenue came from the US** — ECI's exit materials describe more than two-thirds of group revenue deriving from US operations [5][7]. MiQ's own descriptions place operations across **North America, Europe and APAC**. Scale today, per third-party company-data aggregators, runs to about **~1,900 employees** (one aggregator cites 1,909 as of April 2026) across roughly two dozen offices on multiple continents [12]. Headcount and revenue figures from data aggregators vary widely, as the caution below notes.\n\nThe common \"~$500M+ / ~1,900-person\" framing needs one caution. The **headcount (~1,900)** is corroborated by aggregator data [12] and is plausible. The **revenue** figure is not cleanly sourced — aggregators show estimates ranging from ~$225M to \"$500M–$1B,\" far too wide to assert a point figure [12]. MiQ is private and does not publish group revenue in press releases; the UK statutory accounts (Companies House, FY2024) cover only the UK entity, not the global group. The \"~$500M+\" figure is therefore best treated as a *reported range*, not an established figure.\n\n> **Key Claim 5.1** — By the 2022 Bridgepoint transaction, the majority of MiQ's group revenue (described as more than two-thirds) came from US operations, making the US its largest market [5][7].\n\n> **Key Claim 5.2** — MiQ today operates across North America, Europe and APAC with on the order of ~1,900 employees (one aggregator: 1,909 as of April 2026) [12]. Group revenue is not reliably sourced, and the \"~$500M+\" figure should be treated as an unverified reported range.\n\n---\n\n## 6. Leadership Evolution: Owner-Operators Who Kept Re-Drawing the Org (2010–2026)\n\n**So what:** The headline is continuity — both founders are still in the company fifteen years and two PE rounds later — but the *configuration* has churned. The founders have moved between Chairman, CEO and growth-officer roles more than once, and a US co-CEO structure now runs the largest market. Any present-tense title is a going-concern claim and must be dated.\n\nThe dated record shows at least two distinct top-team configurations:\n\n- **February 2022 config:** Hundal moved from Global CEO to a newly created **Global Executive Chairman** role (strategy and culture); **Sean Reardon** was promoted to Global CEO while retaining US CEO; Simon Tray continued as Global CFO; Paul Silver was promoted to Global President, Product and Strategy [13].\n- **Current config (per MiQ's live leaders page, accessed June 2026):** **Gurman Hundal — Global Chief Executive Officer and co-founder**; **Lee Puri — Global Chief Growth Officer and co-founder**; **Richard Dunmall — Global President**; **Paul Silver — Global President, Corporate Development**; **Charlie Neer** and **Erin Madorsky — US Co-Chief Executive Officers**; **Kris Love — Chief Financial Officer**; **John Goulding — Global Chief Strategy Officer**; plus a wider C-suite [14].\n\nThe two snapshots do not fully reconcile: Sean Reardon, Global CEO in 2022, is absent from the current leaders list, and Hundal is Global CEO again. The honest reading: MiQ has re-drawn its global top team at least once since 2022, the founders have circulated among the most senior roles, and the present titles are those on the live page. That page is the best-available, most-recent source, but a corporate \"our leaders\" page is self-published and can lag real changes. The Reardon transition remains unexplained in public sources.\n\nThe **US Co-CEO** structure is independently dated. MiQ announced the elevation of **Charlie Neer** (previously US Chief Commercial Officer) and **Erin Madorsky** (previously US Chief Strategy Officer) to **US Co-CEOs in July 2024**, citing US growth momentum — Neer taking revenue/trading/service models, Madorsky taking product, marketing, sales strategy and partnerships [15].\n\n> **Key Claim 6.1** — Both founders remain in MiQ's senior leadership fifteen years on: as of the live leaders page (accessed June 2026) Hundal is Global CEO & co-founder and Puri is Global Chief Growth Officer & co-founder [14]. The leaders page is self-published and may lag real changes.\n\n> **Key Claim 6.2** — In February 2022 MiQ ran a different top-team configuration (Hundal as Global Executive Chairman; Sean Reardon as Global CEO), indicating the global leadership has been re-drawn at least once since the Bridgepoint deal [13]. The subsequent Reardon transition is unexplained in public sources.\n\n> **Key Claim 6.3** — In July 2024 MiQ elevated Charlie Neer and Erin Madorsky to US Co-CEOs; Richard Dunmall holds the Global President role on the current leaders page [15][14].\n\n---\n\n## 7. The Strategic Pivot: From Managed Trading Desk to AI Platform — Sigma (2025)\n\n**So what:** This is the defining bet of the Bridgepoint era, and the answer to \"what is MiQ becoming.\" For fifteen years MiQ sold *people who trade* (a managed service). In 2025 it repackaged the same intelligence as *software clients (and other holdcos) can operate*, productizing its accumulated trading data into an AI platform. If it works, MiQ converts from a services business (linear-headcount economics) toward a platform business (software-margin, multi-tenant economics). That is the thesis a PE owner pays a ~$1B valuation to fund.\n\nOn **4 June 2025**, MiQ launched **Sigma**, positioned as an AI platform that \"unifies the programmatic ecosystem\" — sitting across multiple DSPs and data sources rather than being one buying tool [16][17]. The marketed scale is large. Sigma is described as trained on a connected data set processing **more than 700 trillion consumer signals** across viewing, browsing and buying, drawing on **300+ data feeds** and integrating with named partners including The Trade Desk, Google DV360, Amazon Web Services, Samba (TV), Experian, Databricks, Numerator, Celtra and Circana [16][17]. At launch Sigma was made available in the US, Canada, the UK, Australia and select international markets, with global rollout planned through 2025 [16].\n\nAt the center of Sigma is an **agentic trading agent** — software that takes natural-language briefs and acts across multiple DSPs, automating analysis traders once did by hand. MiQ describes the agent as built on three leading large language models — **OpenAI, Google Gemini and Anthropic's Claude** — and trained on **~15 years of MiQ's programmatic trading history** [16][18]. The \"15 years\" figure is itself the strategic point. The trading-desk years (2010–2025) are the proprietary training corpus that makes the platform defensible. The bootstrapped service business became the moat for the platform business.\n\n> **Key Claim 7.1** — On 4 June 2025 MiQ launched Sigma, an AI platform marketed as unifying the programmatic ecosystem across multiple DSPs, processing 700+ trillion consumer signals from 300+ data feeds; available at launch in the US, Canada, UK, Australia and select markets [16][17]. The scale figures are MiQ's own marketed claims, not independently audited.\n\n> **Key Claim 7.2** — Sigma includes an agentic trading agent built on three LLMs (OpenAI, Gemini, Claude) and trained on ~15 years of MiQ's programmatic trading data [16][18].\n\n---\n\n## 8. The CTV/ATV Stack: TV Intelligence, the 90M-Household Panel, and Partnerships\n\n**So what:** Advanced TV / Connected TV is MiQ's sharpest competitive wedge. CTV (ads in streaming TV apps on internet-connected sets) and ATV (data-driven TV buying across linear and streaming) are where ad dollars are migrating and where measurement is hardest — exactly the \"turn fragmented data into intelligence\" problem MiQ was founded to solve, now at TV scale. MiQ does not own TV inventory; it assembles a data-and-measurement layer across many partners, consistent with its agnostic model.\n\nMiQ markets **TV Intelligence** as a cross-channel TV analytics solution built on a multi-source data footprint. It cites **6.4 trillion video-consumption signals from 11 data partners** and a **panel of ~90 million households across five major markets**, combining automatic-content-recognition (ACR), set-top-box data and regional TV currencies across CTV, linear and YouTube, with reach framed as 500M+ global CTV households [19][20]. The stack is assembled through partnerships rather than ownership:\n\n- **Samba TV** — a multi-year commercial agreement under which Samba TV transitioned its US managed-media-services business to MiQ, bolstering MiQ's ATV data and measurement (incremental-reach, over/under-exposure) [21].\n- **Titan OS** — a European deal bringing OS-level (smart-TV operating-system) viewing intelligence; MiQ has said Titan OS data would be integrated into Sigma in Q1 2026 [22].\n- **Lifesight** — a data partnership feeding consent-based location/commerce data and measurement (marketing-mix modelling, incrementality testing, causal attribution) into Sigma, framed for the JAPAC region [23].\n\nThese partnerships are present-tense status claims, dated 2024–2026 in the sources; the Titan OS \"integrated into Sigma in Q1 2026\" is forward-looking from the source's vantage and should be treated as planned, not confirmed-live.\n\n> **Key Claim 8.1** — MiQ's TV Intelligence is marketed as drawing on 6.4 trillion video-consumption signals from 11 partners and a ~90M-household panel across five markets (ACR + set-top-box + TV currencies, spanning CTV/linear/YouTube) [19][20]. The scale figures are vendor claims, not audited.\n\n> **Key Claim 8.2** — MiQ's ATV stack is assembled via partnerships: a multi-year Samba TV agreement (under which Samba TV moved its US managed-media business to MiQ), a Titan OS European OS-level data deal (planned Sigma integration Q1 2026), and a Lifesight data/measurement partnership feeding Sigma [21][22][23]. The Titan-into-Sigma integration is forward-looking and planned, not yet confirmed live.\n\n---\n\n## 9. The M&A Roll-Up: Grasp, Pathlabs, Adsmovil (2023–2026)\n\n**So what:** Bridgepoint's capital turned MiQ from an organic grower into an acquirer. The three deals are not random. Each plugs a specific gap — *governance/data-quality* (Grasp), *the independent/mid-size agency channel* (Pathlabs), and *Latin America/Hispanic reach* (Adsmovil). Together they widen MiQ from \"managed trading desk for big brands and holdcos\" toward \"full-stack independent partner for clients of all sizes and regions\" — exactly the consolidation play a PE owner runs before an eventual exit.\n\n- **Grasp (November 2023).** MiQ acquired the French media-governance and data-quality martech company **Grasp**, described as MiQ's third significant investment, adding a preventive SaaS suite addressing digital-ad data-quality and governance problems [24].\n- **Pathlabs (announced July 2024).** MiQ agreed to acquire **Pathlabs**, a **Media Execution Partner (MEP)** founded in 2021 and based in Missoula, Montana, with a ~100-person team that runs end-to-end paid-media execution as an extension of *independent and mid-size agencies* [25][26]. Pathlabs was set to remain an independent business unit under MiQ, extending MiQ's managed-service reach below the holding-company tier into the independent-agency channel [25][26].\n- **Adsmovil — Latin America (announced March 2026).** MiQ agreed to acquire the **Latin America business of Adsmovil**, spanning 12 LatAm markets, to build what the parties call the region's largest independent programmatic offering; Adsmovil brings first-party data, the **Linki** retail-media platform and the **Personas** audience product, 150+ regional staff, and a combined 400M+ unique IDs. Eric Tourtel becomes LatAm CEO and founder Alberto \"Banano\" Pardo becomes Chairman of MiQ LatAm; Adsmovil's US business stays separate [27]. *(Note: this deal is dated March 2026 — recent — and is a signed agreement; treat completion/integration as in-progress.)*\n\n> **Key Claim 9.1** — In November 2023 MiQ acquired French media-governance/data-quality martech company Grasp, described as MiQ's third significant investment [24].\n\n> **Key Claim 9.2** — In July 2024 MiQ announced the acquisition of Pathlabs, a Missoula, Montana–based Media Execution Partner (~100 staff, founded 2021) serving independent/mid-size agencies, to remain an independent business unit under MiQ [25][26].\n\n> **Key Claim 9.3** — In March 2026 MiQ agreed to acquire Adsmovil's Latin America business (12 markets, Linki retail-media and Personas data products, 150+ staff, 400M+ combined unique IDs), positioned as the region's largest independent programmatic offering [27]. The agreement is signed; integration is in progress.\n\n---\n\n## 10. The Dentsu Anchor Deal: A Holdco Bets on Sigma (2025)\n\n**So what:** When a global advertising holding company chooses to run an independent's platform at the \"strategic centre\" of its media practice, that is the strongest external validation of the Sigma pivot — and a structural shift in the holdco-vs-independent relationship, where the holdco buys the independent's intelligence rather than building its own.\n\nOn **12 June 2025**, MiQ and **Dentsu** (one of the global advertising holding companies) announced that Dentsu selected **MiQ Sigma** to help power its \"Next Gen\" media operations, with MiQ positioned as Dentsu's intelligence partner and Dentsu described as the first holding company to integrate Sigma at the strategic center of its media practice [28][29]. Coverage describes live experiments across global markets at announcement [28]. Announced in mid-2025, the partnership's durability is unproven — early-stage holdco partnerships can expand or quietly lapse.\n\n> **Key Claim 10.1** — On 12 June 2025 Dentsu selected MiQ Sigma to power its Next Gen media operations, described as the first holding company to integrate Sigma at the strategic centre of its media practice [28][29]. This is a recent partnership whose durability is unproven.\n\n---\n\n## 11. Genuine Inflection Points — Where MiQ Could Have Gone Differently\n\n**So what:** MiQ's trajectory was not inevitable. Four decisions, each with a live alternative at the time, made it what it is.\n\n1. **2017 — minority round vs. full sale.** MiQ took growth capital from ECI/GP Bullhound and kept the founders running the business, rather than selling outright to a trade buyer or a larger ad-tech player. A full 2017 exit would likely have folded MiQ into a strategic acquirer and ended the independent story. The control nuance — Insight Bidco taking 75%+ — shows how close the line between \"growth round\" and \"control sale\" actually ran.\n\n2. **US-first internationalization.** Pouring expansion into the US rather than staying a UK/EU independent produced the two-thirds-US revenue base and the outsized 6.1x return [5][7]. A Europe-centric MiQ would have been a smaller, lower-multiple business.\n\n3. **Platformization over pure services (Sigma).** Productizing 15 years of trading data into an AI platform, rather than remaining a higher-touch managed service, is a bet that software margins and holdco platform deals beat services scaling. It is unproven — the alternative, staying a premium managed-service independent, was and is viable.\n\n4. **The Bridgepoint-funded roll-up.** Deploying acquisition capital into Grasp/Pathlabs/Adsmovil, rather than returning it or growing purely organically, is a consolidation play that widens the addressable market but adds integration risk. A purely organic MiQ would be cleaner — but smaller, and less defensible against consolidating rivals.\n\n> **Key Claim 11.1** — MiQ's independence is the product of a contingent 2017 choice to take minority growth capital (with the founders staying operators) rather than sell outright; a full 2017 exit was a live alternative. This is an inference grounded in the sourced deal record [3][4][5].\n\n---\n\n## Open Questions\n\n1. **Group revenue.** What is MiQ's actual consolidated group revenue? Aggregators range from ~$225M to \"$500M–$1B\" [12]; the commonly cited \"~$500M+\" is unverified. UK statutory accounts (FY2024) cover only the UK entity, not the global group.\n2. **2017 equity split.** What percentages did ECI/GP Bullhound vs. the founders hold after the 2017 round? The \"minority\" label and the Insight Bidco 75%+ PSC record need reconciling at the economic level.\n3. **Sean Reardon transition.** Reardon was Global CEO in Feb 2022 but is absent from the current leaders page, with Hundal again Global CEO. When and why did this change?\n4. **Bridgepoint stake size and fund.** The exact majority percentage Bridgepoint holds and the specific fund vehicle are not in the consulted sources; the ~$1B valuation is trade-reported, not officially disclosed.\n5. **Sigma/CTV scale figures.** The 700T signals, 300+ feeds, 6.4T TV signals and 90M-household panel are MiQ's marketed claims; none are independently audited.\n6. **Adsmovil/Pathlabs deal terms and completion status.** Prices undisclosed; integration status unconfirmed as of mid-2026.\n7. **\"1,900 people / 22 offices.\"** Headcount magnitude is corroborated by an aggregator [12]; the precise office count and current figure vary by source.\n\n---\n\n## Sources\n\n1. Companies House (UK), \"MIQ DIGITAL LIMITED\" company overview, no. 07321732 — incorporation 21 July 2010; previous names MEDIA IQ TRADING LTD and MEDIA IQ DIGITAL LTD (to 14 May 2018); status Active; last accounts to 31 Dec 2024. https://find-and-update.company-information.service.gov.uk/company/07321732 — accessed 2026-06-20. **(Tier 1, primary)**\n2. MiQ corporate / profile sources on founder backgrounds (MiQ \"our leaders\" and biographical profiles; founder career details re: Adlink, A&NY Media, VC Media, Unanimis). https://www.wearemiq.com/about/our-leaders — accessed 2026-06-20. **(Tier 1 for self-description / Tier 5 profile; founder-biography details largely single-source.)**\n3. Companies House (UK), \"MIQ DIGITAL LIMITED — persons with significant control,\" no. 07321732 — founders each 25–50% to 15 July 2017; Insight Bidco Limited (no. 10859114) active PSC at 75%+ from 15 July 2017. https://find-and-update.company-information.service.gov.uk/company/07321732/persons-with-significant-control — accessed 2026-06-20. **(Tier 1, primary)**\n4. GP Bullhound, \"Turning data into marketing intelligence\" (MiQ/Media iQ case study) — advisory relationship from 2015; invested 2017 alongside ECI; ~6x in Fund III; exit to Bridgepoint Sept 2022. https://www.gpbullhound.com/articles/mediaiq/ — accessed 2026-06-20. **(Tier 1 investor disclosure / Tier 5)**\n5. ECI Partners, \"ECI announces realisation of MiQ for 6.1x return,\" 13 Sept 2022 — 2017 minority investment; 6.1x; Tom Wrenn; >two-thirds US revenue; founder quote. https://www.ecipartners.com/news-and-insights/news/2022/eci-announces-sale-exit-of-miq-6x — accessed 2026-06-20. **(Tier 1, investor primary)**\n6. Secondary investor disclosure (limited-partner/fund case-study materials) framing the ECI exit as 5.9x MOIC / 49% IRR with ~27% organic revenue growth and 31% EBITDA CAGR over the hold (e.g., Pantheon International case study). https://www.pantheon-international.com/our-portfolio/case-studies/miq/ — accessed 2026-06-20. **(Tier 1 investor disclosure; single-source for the 5.9x/49% IRR specifics)**\n7. MiQ, \"MiQ announces partnership with private equity firm Bridgepoint to continue long-term growth strategy,\" 13 Sept 2022 — majority stake; existing management stays; Welham/Robert; >two-thirds US revenue. https://www.wearemiq.com/resources/news/miq-announces-partnership-with-private-equity-firm-bridgepoint-to-continue-long-term-growth-strategy — accessed 2026-06-20. **(Tier 1 company release — claim-of-the-entity)**\n8. Bridgepoint, \"MiQ Announces Partnership with Bridgepoint\" press release, 2022. https://www.bridgepointgroup.com/about-us/news-and-insights/press-releases/2022/miq-announces-partnership-with-bridgepoint — accessed 2026-06-20 (page returned a challenge/validation gate on fetch; corroborated by [7]). **(Tier 1 company release)**\n9. Daily Research News Online, \"New Investor Bridgepoint Takes Majority Stake in MiQ,\" 2022 — valuation up to ~$1B; majority stake; ECI/GP Bullhound exit. https://www.mrweb.com/drno/news33875.htm — accessed 2026-06-20. **(Tier 5, trade press)**\n10. Pemberton Asset Management, \"Pemberton Supports Bridgepoint's Acquisition of Programmatic Media Company MiQ,\" 2022. https://pembertonam.com/news/pemberton-supports-bridgepoints-acquisition-of-programmatic-media-company-miq/ — accessed 2026-06-20. **(Tier 1 financier release)**\n11. Bridgepoint Group, MiQ portfolio page (private-equity middle-market / technology). https://www.bridgepointgroup.com/investment-strategies/private-equity/portfolio/middle-market/technology/miq — accessed 2026-06-20 (page returned empty/gated on fetch; portfolio placement corroborated by [7][9]). **(Tier 1 company page)**\n12. Third-party company-data aggregators (Owler, Craft, Growjo, PitchBook, CB Insights) — headcount ~1,900 (one cites 1,909 as of Apr 2026); revenue estimates ranging ~$225M to \"$500M–$1B.\" https://growjo.com/company/MiQ ; https://craft.co/miq — accessed 2026-06-20. **(Tier 5/7 aggregators — magnitude only, not precise figures)**\n13. MiQ, \"MiQ evolves its leadership…\" 24 Feb 2022 — Hundal to Global Executive Chairman; Sean Reardon to Global CEO (retaining US CEO); Tray Global CFO; Silver Global President, Product & Strategy. https://www.wearemiq.com/resources/news/miq-evolves-its-leadership-to-continue-in-its-mission-of-being-the-worlds-leading-programmatic-media-partner — accessed 2026-06-20. **(Tier 1 company release)**\n14. MiQ, \"Our leaders\" page — current titles: Hundal (Global CEO & co-founder), Puri (Global Chief Growth Officer & co-founder), Dunmall (Global President), Silver (Global President Corporate Development), Neer & Madorsky (US Co-CEOs), Love (CFO), Goulding (Global CSO), et al. https://www.wearemiq.com/about/our-leaders — accessed 2026-06-20. **(Tier 1 self-published — going-concern, may lag)**\n15. MiQ / Businesswire, \"MiQ Elevates Charlie Neer & Erin Madorsky to Co-CEO Roles Amidst U.S. Growth,\" 18 July 2024. https://www.businesswire.com/news/home/20240718408039/en/ — accessed 2026-06-20. **(Tier 1 company release via wire)**\n16. MiQ / Businesswire, \"MiQ Sigma Breaks the Fragmentation Cycle: The First AI Platform That Unifies the Programmatic Ecosystem,\" 4 June 2025 — 700T+ signals, 300+ feeds, partner list, agentic trading agent on OpenAI/Gemini/Claude, ~15 yrs trading data, US/CA/UK/AU availability. https://www.businesswire.com/news/home/20250604957858/en/ — accessed 2026-06-20. **(Tier 1 company release via wire — marketed claims)**\n17. MiQ, \"MiQ Sigma breaks the fragmentation cycle.\" https://www.wearemiq.com/resources/news/miq-sigma-breaks-the-fragmentation-cycle — accessed 2026-06-20. **(Tier 1 company release)**\n18. MediaPost, \"Dentsu Goes All-In With MiQ, Claims Industry-First Integration,\" 12 June 2025 — trading agent on OpenAI/Gemini/Claude, trained on 15 years of MiQ trading history. https://www.mediapost.com/publications/article/406608/ — accessed 2026-06-20. **(Tier 5, trade press)**\n19. MiQ, \"TV Intelligence\" / \"Advanced TV\" solution pages — 6.4T video signals from 11 partners; ~90M-household panel across five markets; ACR/STB/TV currencies; 500M+ CTV households. https://www.wearemiq.com/tv-intelligence/ — accessed 2026-06-20. **(Tier 1 self-published — marketed claims)**\n20. MiQ, \"MiQ solidifies leadership in Advanced TV advertising with global expansion of TV Intelligence.\" https://www.wearemiq.com/us/resources/news/miq-solidifies-leadership-in-advanced-tv-advertising-with-global-expansion-of-tv-intelligence-solution-in-critical-markets — accessed 2026-06-20. **(Tier 1 company release)**\n21. Samba TV / MiQ, \"Samba TV and MiQ Reach Multi-year Commercial Agreement\" (Samba TV transitions US managed-media business to MiQ; incremental-reach measurement). https://www.samba.tv/press-releases/samba-tv-and-miq-reach-multi-year-commercial-agreement — accessed 2026-06-20. **(Tier 1 company release)**\n22. MiQ, \"MiQ Builds Unparalleled TV Intelligence in Europe Through Deal With Titan OS\" (OS-level data; planned Sigma integration Q1 2026). https://www.wearemiq.com/resources/news/miq-builds-unparalleled-tv-intelligence-in-europe-through-deal-with-titan-os — accessed 2026-06-20. **(Tier 1 company release — integration forward-looking)**\n23. MiQ, \"MiQ announces data partnership with Lifesight to ingest its data into MiQ Sigma platform\" (consent-based location/commerce data; MMM, incrementality, causal attribution; JAPAC). https://www.wearemiq.com/us/resources/news/miq-announces-data-partnership-with-lifesight — accessed 2026-06-20. **(Tier 1 company release)**\n24. MiQ / Businesswire, \"MiQ Acquires French Media Governance MarTech Company Grasp,\" 6 Nov 2023 (third significant investment). https://www.businesswire.com/news/home/20231106887533/en/ — accessed 2026-06-20. **(Tier 1 company release via wire)**\n25. MiQ / Businesswire, \"MiQ to Acquire Pathlabs, Expanding Programmatic Excellence to Independent Agencies,\" 29 July 2024 (Missoula MT; ~100 staff; founded 2021; MEP model; independent business unit). https://www.businesswire.com/news/home/20240729060141/en/ — accessed 2026-06-20. **(Tier 1 company release via wire)**\n26. Pathlabs, \"MiQ to Acquire Pathlabs…\" (company description, MEP model, agency-extension). https://www.pathlabs.com/blog/miq-acquires-pathlabs — accessed 2026-06-20. **(Tier 1 company release)**\n27. MiQ / Businesswire, \"MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering In Latin America,\" 25 March 2026 (12 markets; Linki, Personas; 150+ staff; 400M+ unique IDs; Tourtel LatAm CEO; Pardo Chairman MiQ LatAm). https://www.wearemiq.com/resources/news/miq-acquires-adsmovil — accessed 2026-06-20. **(Tier 1 company release)**\n28. MiQ / dentsu, \"dentsu selects MiQ Sigma to help power Next Gen media operations,\" 12 June 2025 (first holdco to integrate Sigma at strategic centre; intelligence partner; live experiments). https://www.wearemiq.com/resources/news/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — accessed 2026-06-20. **(Tier 1 company release)**\n29. dentsu, \"Dentsu Selects MiQ Sigma To Help Power Next Gen Media Operations.\" https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — accessed 2026-06-20. **(Tier 1 company release)**"}, {"order": 2, "file": "02_Sigma_Platform_And_AI.md", "title": "MiQ Sigma: The Platform and the AI", "summary": "", "body": "# MiQ Sigma: The Platform and the AI\n\n## Bottom Line\n\nMiQ Sigma, launched June 4, 2025, is not a demand-side platform (DSP — the buy-side software an advertiser uses to bid on ad impressions). It is an orchestration layer that sits *above* the DSPs MiQ already buys through — The Trade Desk, Google DV360, Amazon. Around a buying motion MiQ has run as a managed service for fifteen years, it wraps a unified data spine, a generative-AI persona builder, and a conversational \"Trading Agent.\" The honest one-line description: a managed-service trading desk, re-platformed, with a large-language-model (LLM) front end and a genuinely large data back end. That is less than the \"industry's first AI platform that unifies the programmatic ecosystem\" marketing implies, and more than a chatbot bolted onto an old product.\n\nThe substance worth taking seriously is the data layer (a claimed 700 trillion consumer signals across 300+ feeds at launch, expanding to ~600 feeds and 2.5 petabytes of daily processing one year later) and the agentic execution layer (a Trading Agent trained on MiQ's own 15 years of trading data and the reasoning of three leading LLMs — Anthropic's Claude, Google's Gemini, and OpenAI's ChatGPT). The headline performance numbers — a 132% conversion-rate lift and a 57% reduction in cost-per-action — are **self-reported, single-source vendor claims from \"early testing,\" with no disclosed methodology, sample size, or control, and should not be treated as established fact.** MiQ says it invested $100M+ to build Sigma and spends $25M+ a year on data partnerships; those figures are also self-reported.\n\nThe strongest external validation is commercial, not technical. On June 12, 2025, Dentsu, a global holding company, announced it would deploy Sigma's Trading Agent across all its managed client campaigns — though a Dentsu executive separately told AdExchanger the holdco was \"not using Sigma yet\" at launch. Treat \"deployed across all managed campaigns\" as a stated intent in mid-2025, not a verified production state. As of the June 11, 2026 one-year update, MiQ reports 2,300+ active advertisers and 40,000+ campaigns on Sigma — the most concrete going-concern evidence that the platform is live and used, again self-reported.\n\n---\n\n## What Sigma Actually Is\n\nStart with what it is *not*. Sigma is not a DSP. A DSP (demand-side platform) is the software an advertiser or its agency logs into to bid, in real time, on individual ad impressions across the open web and connected TV — The Trade Desk and Google's Display & Video 360 (DV360) are the two largest independent and walled-garden examples respectively. MiQ does not own one. It never has. Its business is to *operate* DSPs on behalf of clients — a \"managed service\" — using its own data and traders to get better outcomes than the client would running the DSP itself [1][2].\n\nSigma is the productized, AI-assisted version of that operation. MiQ describes it as \"a single-point-of-entry for programmatic advertising where you can harness intelligence, discover audiences, and then use agentic AI to execute multi-platform media buys in a matter of seconds\" — the words of John Goulding, MiQ's chief strategy officer, who frames it as orchestrating *across* DSPs rather than forcing a choice between them [1]. The name is the tell: sigma (Σ), the mathematical summation symbol, \"the sum of all parts\" [1].\n\nArchitecturally, MiQ's launch materials describe three user-facing components [1][3]:\n\n1. **Sigma Intelligence** — the data and insight layer. A visualization and analysis surface that connects what MiQ calls a consumer's three \"modes\": watching (TV), browsing (web), and buying (in-store and retail). This is where the 700-trillion-signal data spine surfaces to a human planner.\n\n2. **The Trading Agent** — the agentic execution layer. A conversational interface (\"natural language prompts\") that lets a trader make changes across multiple DSPs at once, rather than logging into each platform separately. MiQ says it is trained on the company's own 15 years of trading data plus the reasoning ability of three leading LLMs [3][4].\n\n3. **Generative-AI Personas** (later \"Gen-AI Omnichannel Audiences\") — the audience-building layer. A natural-language tool that turns a brief such as \"potential SUV buyers interested in cricket\" into a detailed audience persona with demographic, viewing, browsing, and purchase signals, which the planner can then assemble into audience \"baskets\" and activate through their DSP of choice [5].\n\n**How this differs from a pure DSP versus a holdco trading desk.** A pure DSP (The Trade Desk) sells you software and walks away — you bring the strategy, the data, and the labor. A holding-company trading desk (the in-house programmatic arm of a WPP, Publicis, or Omnicom) runs buying centrally for the holdco's agency clients, historically with opaque margin and the conflict of being owned by the same group that sells the media plan. MiQ's pitch: it is *independent* of any holdco and any single DSP (\"partner-agnostic\"), and Sigma adds a software-and-AI layer the in-house desks lack [1][6]. Structural advantage, or better marketing for the same managed-service economics? That is the central question taken up below.\n\n---\n\n## The Data Layer: Genuinely Large, Self-Described\n\nThe most defensible part of the Sigma story is the data spine, because its scale is hard to fake and several feeds are independently corroborated by partner announcements.\n\nAt launch (June 2025), MiQ claimed Sigma unifies **300+ diverse data feeds spanning 700 trillion consumer signals** across TV, web, and in-store purchasing, representing **1.7 billion global audience profiles** [1][3][7]. MiQ further said it invests **$25M+ annually in data partnerships** and put **$100M+** into building the platform overall [8]. All of these are self-reported figures with no external audit.\n\nOne year later, the June 11, 2026 update revised the numbers upward: Sigma now ingests data from **600+ feeds** and processes **2.5 petabytes of data daily** [9][10]. The signal-count headline (700 trillion) stayed constant in the marketing even as feeds doubled. That suggests \"700 trillion\" is a fixed marketing figure rather than a continuously measured metric — a reason for caution about treating it as precise.\n\nThe data feeds are not vaporware. Several are confirmed by dated, independent partner announcements over the past year:\n\n- **Samba TV** — a long-standing automatic-content-recognition (ACR) TV-viewership data partnership; MiQ has also acquired Samba TV's media-sales business historically [11][12]. ACR is the technology that identifies, frame by frame, what is playing on a smart TV.\n- **Titan OS** — announced November 18, 2025, going live Q1 2026: MiQ became \"the first to license Titan OS log-level data\" and \"the only managed-service partner with direct access to Titan OS data across Europe,\" adding operating-system-level smart-TV viewership signals [13][14]. This exclusivity is layer-scoped to *managed-service access to the log-level/OS-level data*, not to Titan's ad inventory or audience segments, which Titan sells separately via Equativ and its own Titan Ads arm (discussed later, in the chapter on the Titan OS partnership).\n- **Lifesight** — announced August 12, 2025: integrates location and footfall data from 25M+ mobile devices (in the Australian rollout) plus marketing-mix-modeling and incrementality-testing capability, connecting TV exposure to in-store visits [15][16].\n- **Circana** and **Numerator** — retail-purchase and consumer-panel data [1][9].\n- **Experian** — identity and demographic data [1].\n- **Databricks** — the underlying data-and-AI infrastructure (a \"lakehouse\" platform), reaffirmed as a live architectural partner in the June 2026 update [1][9].\n- **Celtra** — creative-automation and dynamic-creative technology [1].\n- **Evertune** — AI-search-visibility tracking, added by the June 2026 update [9].\n\nThe DSP/walled-garden integrations — **The Trade Desk, Google DV360, Amazon, and AWS** — are the activation endpoints: where Sigma sends the buy once a human or the Trading Agent has decided it [1][3]. The June 2026 update claims activation across \"16 open web and walled-garden environments\" [9].\n\n**A note on what is current:** every integration above is asserted by MiQ (or by the partner) as live. The Titan OS, Lifesight, and June-2026 Databricks/Circana confirmations are dated within the last 12 months and corroborated by partner-side announcements, so they are the best-evidenced as still operating. The original 2025 integration list (Trade Desk, DV360, Amazon, Experian, Celtra, Numerator) rests primarily on MiQ's own launch release and trade coverage of it. There is no independent confirmation that the Celtra or Experian integrations remain live as of mid-2026; they are best read as launch-dated rather than freshly re-confirmed.\n\n---\n\n## The AI Architecture: Three LLMs, an Agent, and an Unverified \"60 Models\"\n\nHere the marketing and the verifiable record diverge, and it matters.\n\n**What is consistently sourced:** Sigma is \"built on top of\" or \"embedded with\" the **three largest global LLMs — Claude (Anthropic), Gemini (Google), and ChatGPT (OpenAI)** [1][3][7]. This is a multi-model approach: rather than betting on one foundation model, the Trading Agent draws on the reasoning of all three. The June 2026 detail is more specific: the Trading Agent is trained on \"the reasoning ability of three leading LLMs, monthly data from 6,000 programmatic campaigns, and rich, tacit trader knowledge\" [5], and elsewhere on \"15 years of MiQ trading data\" [4][7]. That is the genuinely differentiated asset — not the LLMs, which any competitor can license, but the proprietary trading corpus they are conditioned on.\n\n**What cannot be confirmed:** a circulating claim of \"60+ AI models\" does not appear in any primary source — not the MiQ launch release, not AdExchanger, Advanced Television, AdNews, Marketing-Interactive, the Business Wire releases, or the June 2026 update. The consistent claim across all sources is \"three LLMs\" plus unspecified \"AI models\" used across planning, audience development, and activation. The \"60+ AI models\" figure is best treated as unverified and possibly conflated with a different number (e.g., the 300+ data feeds, or the 300+ -person Bengaluru engineering team). Absent a primary MiQ source, it does not belong in the record as fact.\n\nThe agentic layer expanded over the year. At launch there was one agent: the Trading Agent. By June 2026, MiQ had added a **Planning Agent** that turns a single conversational prompt into a full media plan — audience, channel, and tactical recommendations — \"in minutes,\" plus a **Total Measurement** capability for cross-channel incrementality and journey optimization [5][9][10]. The direction of travel runs from a single execution agent toward an end-to-end agentic workflow (plan → activate → measure) — the same arc every major ad-tech platform is pursuing in 2025–2026.\n\n**Where Sigma was built.** Sigma was developed at MiQ's Bengaluru Centre of Excellence (CoE), which MiQ describes as one of the world's largest programmatic CoEs with a 300+ -person innovation team [7][17]. The fact is real and relevant: the engineering center of gravity for MiQ's AI sits in India, not London or New York.\n\n---\n\n## The Performance Claims: Treat as Vendor Marketing\n\nMiQ's two headline numbers are repeated verbatim across nearly every piece of coverage, which is itself a signal that they originate from a single press release rather than independent measurement:\n\n- **132% increase in conversion rate**\n- **57% reduction in cost-per-action (CPA)**\n\nBoth are attributed to \"early testing\" [1][3][7][8]. **These are single-source, self-reported vendor claims.** No available source discloses the sample size, the number of campaigns or advertisers tested, the baseline the lift is measured against, whether there was a holdout control group, the verticals tested, the time window, or who measured it. A \"132% conversion lift\" with no control group is the weakest possible form of performance evidence. It is consistent with selection effects (Sigma tested on campaigns already trending up), with cherry-picking (the best of many tests reported), and with definitional games (lift over what baseline?).\n\nThe June 2026 update added a third self-reported metric: Sigma delivers **\"$2.22 in value for every $1 spent\"** versus standard programmatic setups [9][10]. Same caveats apply — no methodology, no auditor, no control disclosed.\n\n**The rule here is simple:** read these as *what MiQ claims*, never as *what is true*. They stand as evidence of MiQ's positioning and confidence, not as established performance facts. A buyer evaluating Sigma should ask MiQ for the underlying test design before crediting any of these numbers.\n\n---\n\n## The Rollout: Real Availability, Staged\n\nThe geographic rollout is one of the better-corroborated parts of the story because partner and regional announcements track it.\n\nAt launch (June 4, 2025), MiQ said Sigma was \"available immediately\" in the **United States, Canada, the United Kingdom, Australia, and select international markets,** with global rollout planned through 2025 [1][3]. Australia and New Zealand got specific early attention: MiQ ANZ managing director Fiona Roberts as a named spokesperson, and the Lifesight (Aug 2025) and OzTAM-related ATV build-out concentrated there [8][15][18]. India received a dedicated rollout and local press [5][17]. Europe's TV-intelligence depth arrived later, via the Titan OS deal (live Q1 2026) [13][14]. The June 2026 update reaffirmed availability in the US, Canada, UK, and Australia with continued global expansion [9].\n\nThe rollout sequence — US/CA/UK/AU first, then market-by-market data deepening — is consistent across sources and corroborated by the regional partner deals, so it stands on firmer evidentiary ground than the performance claims do.\n\n---\n\n## The Hard Question: Architectural Advance or Repackaged Managed Service?\n\nIs Sigma a genuine architectural advance, or a managed-service trading desk with an LLM front end? The honest answer is: it is meaningfully both, and the marketing overstates the first while obscuring the second.\n\n**The case that it is a real advance:**\n- The data spine is genuinely large and multi-modal (TV + web + retail), and several feeds (Titan OS log-level, Samba ACR, Lifesight footfall) are differentiated assets a generic DSP user cannot easily assemble.\n- The multi-LLM agentic layer conditioned on 15 years of proprietary trading data is a real moat — the trading corpus, not the LLMs, is the differentiator.\n- MiQ describes Sigma as a \"full rebuild,\" not a feature bolt-on: \"This isn't just another feature set built onto an existing product,\" per Roberts [8]. The $100M+ self-reported build cost is consistent with a re-platforming.\n- Commercial pull from Dentsu (June 2025) and 2,300+ advertisers (June 2026) suggests the market is treating it as more than a rebrand [2][9].\n\n**The case that it is a repackaging:**\n- MiQ's *economics* are unchanged. It is still a managed service — humans (traders) operating other companies' DSPs for a margin. Sigma makes those humans faster; it does not replace the managed-service model or its margin structure. The \"Trading Agent\" augments traders rather than removing them; even the year-two framing keeps \"rich, tacit trader knowledge\" in the loop [5].\n- \"Unifies the programmatic ecosystem\" is the same orchestration value proposition that curation platforms, supply-path-optimization tools, and other holdco desks all claim. \"First AI platform that unifies the ecosystem\" is a marketing superlative, not a verifiable technical first.\n- The three LLMs are licensed, not built. The \"AI\" a non-specialist imagines — a model MiQ trained — is largely a natural-language interface to commodity foundation models plus retrieval over MiQ's data. Valuable, but not a proprietary AI breakthrough.\n- The performance numbers that would prove a genuine outcome advantage are exactly the numbers MiQ has not substantiated.\n\n**Synthesis.** Sigma is best understood as MiQ moving up the value stack — from a services business toward a software-and-data business — using LLMs as the interface that makes the transition legible to clients and, critically, to its private-equity owner, Bridgepoint, which benefits from a higher-multiple \"platform\" story over a \"trading desk\" story. The architecture is real. The data is real. The agentic interface is real and improving. The \"industry-first unifying AI platform\" framing is marketing. And the outcome claims that would settle whether any of it actually buys better performance remain unverified vendor assertions.\n\n---\n\n## Open Questions\n\n1. **The \"60+ AI models\" claim.** Does it exist in a primary MiQ source, and if so what are the 60 models (proprietary? fine-tuned? classical ML alongside the three LLMs)? It cannot be sourced and may be a conflation.\n2. **What substantiates the 132% / 57% / $2.22 metrics?** Sample size, control design, verticals, measurement party. Without these the numbers are unusable as evidence.\n3. **How much of Sigma's \"AI\" is proprietary versus a thin orchestration over licensed LLMs plus retrieval?** The 15-years-of-trading-data conditioning is the claimed moat — is there a technical paper, patent, or third-party assessment confirming it?\n4. **Is the Dentsu deal in production?** The June 2025 release says \"across all managed client campaigns\"; an AdExchanger source said Dentsu was \"not using Sigma yet.\" What is the real 2026 state of that deployment, and is it exclusive?\n5. **Which 2025 launch integrations remain live in mid-2026?** Celtra, Experian, Numerator were launch-listed but not re-confirmed in the available June 2026 materials.\n6. **Margin impact.** Does Sigma actually change MiQ's take rate / gross margin, or just throughput per trader? This is the question Bridgepoint cares about and the one with the least public data.\n7. **Does the multi-LLM design create cost or latency problems at scale**, and how does MiQ arbitrate between Claude, Gemini, and ChatGPT for a given decision?\n\n---\n\n## Sources\n\n1. Sapna Maheshwari / AdExchanger staff, \"MiQ Aims To Unify Fragmented Data Landscape With New AI-Powered Ad Platform,\" AdExchanger, June 2025. https://www.adexchanger.com/technology/miq-aims-to-unify-fragmented-data-landscape-with-new-ai-powered-ad-platform/ — Accessed 2026-06-20. *Tier 5 (specialized ad-tech trade press). Best independent framing of Sigma vs. DSPs; notes Dentsu \"not using Sigma yet.\"*\n2. Dentsu, \"Dentsu Selects MiQ Sigma To Help Power Next Gen Media Operations,\" dentsu.com news release, June 12, 2025. https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — Accessed 2026-06-20. *Tier 1 (corporate release; claim, not fact). Confirms holdco commercial commitment; \"Large Media Model\" PoC; trading agent across managed campaigns.*\n3. MiQ, \"MiQ Sigma breaks the fragmentation cycle,\" MiQ news / Business Wire, June 4, 2025. https://www.wearemiq.com/resources/news/miq-sigma-breaks-the-fragmentation-cycle and https://www.businesswire.com/news/home/20250604957858/en/ — Accessed 2026-06-20. *Tier 1 (vendor launch release — treat all metrics as claims). Primary source for 700T signals, 300+ feeds, 1.7B profiles, three LLMs, integration list, 132%/57%, rollout markets.*\n4. MiQ via search synthesis of launch coverage (three LLMs; Trading Agent trained on 15 years of MiQ trading data). *Tier 1 vendor claim, cross-referenced across [1][3][7].*\n5. \"MiQ launches AI platform Sigma…\" / Sigma Planning Agent detail (trading agent trained on three LLMs + monthly data from 6,000 programmatic campaigns + tacit trader knowledge), Indian Television / MiQ coverage, 2025–2026. https://indiantelevision.com/mam/miq-launches-ai-platform-sigma-to-simplify-fragmented-media-planning/ — Accessed 2026-06-20. *Tier 4–5. Persona example and agent-training detail.*\n6. Fiona Roberts / AdNews, \"MiQ goes AI-powered advertising with Sigma,\" AdNews (Australia), June 5, 2025. https://www.adnews.com.au/news/miq-goes-ai-powered-advertising-with-sigma — Accessed 2026-06-20. *Tier 5 trade press. \"Partner-agnostic, people-powered, tech-enabled\" positioning; Hundal \"culmination of 15 years\" quote; ANZ focus.*\n7. \"Introducing MiQ Sigma: built at MiQ's Bengaluru Centre of Excellence,\" AgencyReporter / Business Upturn / 36Kr coverage, June 2025. https://eu.36kr.com/en/p/3354450228458115 — Accessed 2026-06-20. *Tier 5. Bengaluru CoE (300+ team), 9 integrations, 132%/57%, three LLMs.*\n8. \"MiQ unveils $100m Sigma platform to fix programmatic's fragmentation problem,\" Marketing-Interactive, June 2025. https://www.marketing-interactive.com/miq-sigma-ai-meets-ambition-in-programmatic-next-chapter — Accessed 2026-06-20. *Tier 5. Source for $100M+ build investment and $25M+/yr data spend (vendor-stated); \"full rebuild\" framing.*\n9. MiQ, \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate,\" Business Wire, June 11, 2026. https://www.businesswire.com/news/home/20260611682662/en/ — Accessed 2026-06-20. *Tier 1 (vendor release — claims). One-year going-concern update: 2.5PB/day, 600+ feeds, Planning Agent, Total Measurement, 2,300+ advertisers, 40,000+ campaigns, $2.22/$1, 16 environments, Evertune/Circana/TitanOS/Databricks live.*\n10. \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" PPC Land, June 2026. https://ppc.land/miq-upgrades-sigma-a-year-in-planning-agent-and-2-5pb-of-daily-data/ — Accessed 2026-06-20. *Tier 5. Independent trade coverage of the June 2026 update; corroborates adoption and data figures.*\n11. Samba TV, \"Samba TV and MiQ Reach Multi-year Commercial Agreement,\" samba.tv press releases. https://www.samba.tv/press-releases/samba-tv-and-miq-reach-multi-year-commercial-agreement — Accessed 2026-06-20. *Tier 1 (partner release). Confirms Samba TV ACR data relationship.*\n12. \"Samba TV Sells Media Sales Business to UK's MiQ,\" TheWrap. https://www.thewrap.com/
