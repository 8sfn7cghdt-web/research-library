h margin-eroding for any intermediary over time. But MiQ is the *least*-exposed kind of intermediary to that pressure, because it is not contractually tied to TTD's rails (Claim 20.2) and can ride the Amazon/DV360 re-routing the squeeze itself accelerates. The dynamic is survivable. It is not painless: it erodes MiQ's margin and forces the data-and-software-layer conversion on a clock. **The supplier-is-rival problem does not kill MiQ. The thing that could — AI commoditizing the trading MiQ sells as labor — runs through TTD's platform but is not, fundamentally, a *supplier-dependency* problem. It is a category problem (doc 17). TTD is merely its most powerful instrument.**\n\n---\n\n## Open Questions\n\n1. **What is MiQ's actual TTD-vs-DV360-vs-Amazon spend split, and is it concentrating or diversifying?** Unknowable from public sources (Claim 20.1); the single most valuable undisclosed number in the whole thesis. A future MiQ PE-exit prospectus or a TTD client-concentration disclosure would settle it.\n2. **Does MiQ hold any volume-based pricing or access protection in its TTD relationship?** No public evidence either way (Claim 20.10). Contract terms are private.\n3. **Will TTD ever extend or restrict its Certified Service Partner economics in a way that reaches independents like MiQ?** The program today (Goodway, Mogl, MINT Square) is mid-market-reseller-focused; whether TTD formalizes — or fences off — large independents is unresolved.\n4. **How fast does Ventura accumulate owned TV signal, and does TTD begin selling that signal as a data product that competes with MiQ's TV Intelligence?** The 2027-2029 swing factor on the data-moat question.\n5. **Does TTD's Koa agentic roadmap cross from setup-acceleration into autonomous buying before MiQ completes its data-layer conversion?** The decisive race (shared with docs 12, 17).\n\n---\n\n## Sources\n\n1. The Trade Desk, \"Prepared Remarks of Fourth Quarter 2025 Earnings Call,\" February 25, 2026 (Jeff Green, CEO; Tahnil Davis, Interim CFO). *Tier 1 (primary — company earnings call transcript). FY2025 revenue $2.9B/+18%, Q4 $847M/+14% (+19% ex-political), Q1 2026 guide ≥$678M/+10%, ~$13.4B spend, ~47% EBITDA margin; the go-to-market reorganization quote (\"increased the number of advertisers where we have direct relationships\"), JBPs >half of business; Kokai ~100% adoption; agentic-AI framing against \"agentic wrappers\"; objectivity/no-O&O thesis; the appliance-manufacturer CTV test (70% more households, 30% lower cost, 6x performance vs. Amazon DSP).* Retrieved and text-extracted directly. https://s205.q4cdn.com/467402606/files/doc_earnings/2025/q4/transcript/The-Trade-Desk-Fourth-Quarter-2025-Conference-Call-Prepared-Remarks.pdf — accessed 2026-06-20.\n2. The Trade Desk, \"Certified Service Partners,\" thetradedesk.com partner page. *Tier 1 (company self-description). Named certified partners — Goodway Group, Mogl (formerly Ventura Growth), MINT Square GmbH; program purpose to extend the platform to brands/agencies \"of all sizes\" incl. mid-market/SMB. Used to establish that MiQ is NOT a named certified partner and that TTD runs a reseller program because it cannot service mid-market directly.* https://www.thetradedesk.com/our-partners/certified-service-partners — accessed 2026-06-20.\n3. Coverage of The Trade Desk's 2025 stock collapse (~68% decline; Amazon free-DSP-testing and funded comparative tests; walled-garden pressure), MediaPost / Globe and Mail / investment commentary. *Tier 3-5 (wire/major-outlet + trade financial commentary). TTD ~68% 2025 decline; corroborated against doc 06's source set.* https://www.theglobeandmail.com/investing/markets/stocks/AMZN/pressreleases/36952192/why-the-trade-desk-stock-collapsed-68-in-2025/ — accessed 2026-06-20.\n4. Tradehouse Media, \"What The Trade Desk / Publicis fallout means for publishers,\" 2026. *Tier 5 (specialized trade analysis). Publicis (March 2026) \"can no longer recommend\" TTD after FirmDecisions audit (fee-on-fee, unauthorized tool billing; TTD disputed); WPP and Dentsu stepped back from OpenPath (Feb 2026, per AdWeek); three of five largest holdcos in conflict; spend redirect benefits DV360.* https://tradehouse.media/resources/insights/what-the-trade-desk-publicis-fallout-means-for-publishers/ — accessed 2026-06-20.\n5. The B2B Stack, \"Publicis Publicly Dumps Trade Desk,\" 2026; and corroborating trade coverage. *Tier 5 (trade analysis). OpenPath \"removes the agency's supply-path-optimisation layer\" (a margin line for trading desks), positioned \"at cost\"; \"TTD wants to disintermediate the holdcos\"; Publicis no longer recommending TTD.* https://www.theb2bstack.com/p/publicis-publicly-dumps-tradedesk — accessed 2026-06-20.\n6. Marketecture, \"MiQ — Gurman Hundal\" profile/interview, news.marketecture.tv. *Tier 5 (specialized trade). MiQ as managed-service/agnostic, multi-DSP, \"often other agencies\" as clients, ~2,500 advertisers. (As cited in doc 06.)* https://news.marketecture.tv/p/miq-gurman-hundal — accessed 2026-06-20.\n7. The Trade Desk resource desk, \"4 ways MiQ defines Connected TV success.\" *Tier 1/5 (TTD-hosted partner case study — promotional lean). MiQ runs CTV on TTD; uses TTD's TV Quality Index. Evidence of the depth of MiQ's reliance on TTD as its CTV rail, in TTD's own framing.* https://www.thetradedesk.com/us/resource-desk/4-ways-miq-defines-connected-tv-success — accessed 2026-06-20.\n8. The Trade Desk resource desk, \"MiQ creates SPO solution… / The method MiQ uses to drive better outcomes.\" *Tier 1/5 (TTD-hosted, promotional). MiQ's SPO solution uses TTD's Volume Control API, PMPs reducing seller overlap; MiQ's SPO positioned as complementary to TTD plumbing.* https://www.thetradedesk.com/us/resource-desk/the-method-miq-uses-to-drive-better-outcomes-without-requiring-manual-optimization — accessed 2026-06-20.\n9. DSP comparison / buyer-guide coverage (Improvado, MediaPlanningTool, SalesHive, et al.). *Tier 5 (vendor-comparison content — note SEO/affiliate lean; used only for directional market structure). DV360 ~47% / Amazon DSP ~20% / TTD ~19% usage share; TTD fees ~15-20%; TTD suited to mid-market/enterprise with minimum-spend floors; smaller orgs work \"through an agency, a reseller partner.\"* https://improvado.io/blog/dv360-vs-the-trade-desk — accessed 2026-06-20.\n10. Digiday, \"A year on, The Trade Desk's Open Path is moving toward its goals, but challenges persist.\" *Tier 5 (trade). OpenPath (2022) creates direct DSP-to-publisher connections, removing intermediary links.* https://digiday.com/media/a-year-on-the-trade-desks-open-path-is-moving-toward-its-goals-but-challenges-persist/ — accessed 2026-06-20.\n11. AdExchanger, \"Is The Trade Desk Encroaching On SSP Turf With OpenPath?\" *Tier 5 (specialized trade). OpenPath's disintermediation pressure runs supply-side (SSPs), with holdco SPO budget-steering as the disintermediation TTD itself fears.* https://www.adexchanger.com/publishers/is-the-trade-desk-encroaching-on-ssp-turf-with-openpath/ — accessed 2026-06-20.\n12. Digiday, \"The Trade Desk's supply-path-optimization efforts portend potential disruption ahead.\" *Tier 5 (trade). VP Will Doherty: OpenPath \"buyer-pushed\"; removes a chain link; SSP and holdco-SPO dynamics.* https://digiday.com/media/the-trade-desks-supply-path-optimization-efforts-portend-potential-disruption-ahead/ — accessed 2026-06-20.\n13. AdExchanger, \"Inside The Trade Desk's Pitch For Ventura TV OS.\" *Tier 5 (specialized trade). Ventura = TTD content-agnostic smart-TV OS (Nov 2024); neutrality pitch (no O&O content); collaborators V/VIDAA, Nexxen, DirecTV, TCL; \"in user testing,\" long game, OEM switching costs. Used for the OS/signal-layer move into MiQ's TV territory.* https://www.adexchanger.com/tv/inside-the-trade-desks-pitch-for-ventura-tv-os/ — accessed 2026-06-20.\n14. Axios, \"The Trade Desk is building a smart TV operating system called Ventura,\" Nov 20, 2024; Media Play News / Business Wire on the Feb 2026 \"Ventura Ecosystem\" (V and Nexxen as first collaborators). *Tier 4-5 (major outlet + trade + company release). Ventura launch date and ecosystem expansion; Green denies Roku competition.* https://www.axios.com/2024/11/20/the-trade-desk-smart-tv-operating-system-ventura — accessed 2026-06-20.\n15. AdTech Radar, \"The Trade Desk Leans Into Agentic AI with Koa Agents,\" Apr 21, 2026; Digiday, \"Inside The Trade Desk's Claude-powered campaign agent.\" *Tier 5 (trade). Koa agents let buyers describe goals to AI that executes/optimizes; alpha via Stagwell; Open Agentic Kit / Claude interoperability.* https://adtechradar.com/2026/04/21/the-trade-desk-koa-agents-agentic-media-buying/ — accessed 2026-06-20.\n16. The Current, \"Stagwell plans to pilot The Trade Desk's new agentic capabilities.\" *Tier 5 (TTD-owned trade outlet — note ownership lean). Stagwell first holdco adopter; Koa agents speed setup, not yet autonomous buying. (Corroborates doc 12.)* https://www.thecurrent.com/ai-stagwell-pilot-the-trade-desk-agentic-capabilities-koa-agents — accessed 2026-06-20.\n17. Digiday, \"The Trade Desk remains the dominant DSP but its advertisers are starting to shop around.\" *Tier 5 (trade). TTD clients diversifying toward Amazon DSP, retail media, direct buys and \"other DSPs\"; qualitative, no quantified migration. Supports MiQ's \"we re-route to whoever wins\" steelman.* https://digiday.com/media-buying/the-trade-desk-remains-the-dominant-dsp-but-its-advertisers-are-starting-to-shop-around/ — accessed 2026-06-20."}, {"order": 21, "file": "24_Gap_Independent_Peer_Set_Competitive_Teardown.md", "title": "The Independent Peer Set: A Competitive Teardown of MiQ's 'Largest Independent' Claim", "summary": "", "body": "# The Independent Peer Set: A Competitive Teardown of MiQ's \"Largest Independent\" Claim\n\n## Bottom Line\n\nMost accounts of MiQ lean on a phrase they never test: \"the largest independent.\" It is asserted in acquisition press releases (Adsmovil), repeated as a category truth, and framed almost entirely against the platforms MiQ buys *through* — The Trade Desk and Amazon — while the independents MiQ buys *against* go unnamed. These pages build the missing wall. Profiled against its actual peer set, MiQ's \"largest independent\" claim survives only on a narrow, self-drawn definition: **largest independent *programmatic-specialist managed-service* shop**, agnostic across DSPs, not owned by a holdco. On that narrow turf the claim is defensible — MiQ's ~$600M+ revenue and ~1,900 people exceed Goodway Group (~$160M est.), Croud (~$170M), Crossmedia (~$170M), and roughly match the programmatic-specialist core of Tinuiti (~1,200 people, $3–4B media under management). But the definition is category-gerrymandered. Broaden \"independent\" by one notch in any direction and a bigger animal appears: Tinuiti by media-under-management and full-funnel scale; Basis Technologies as the independent that *owns its DSP* rather than reselling others'; Mediaocean (Innovid + Flashtalking, $200B+ in annualized media spend) as the independent ad-tech infrastructure layer; Stagwell ($2.9B revenue, a public \"challenger network\") building The Media Machine, a 20-agent agentic media OS that does natively what MiQ's Sigma Trading Agent does as a wrapper. **The single most dangerous independent to MiQ's specific thesis — TV-data + agentic + agency-tooling — is Stagwell**, because it is the only independent assembling all three legs at greater scale with public-market capital and its own owned-and-operated data (the Harris Poll, SmartAssets). The AI-native challengers (Scope3's agentic platform, Koah's \"AdSense for AI\") attack a layer below MiQ — the protocol and the inventory surface — and threaten to commoditize the orchestration Sigma sells. On the consolidation question: the independent middle is consolidating in **both** directions at once. MiQ is a credible acquirer of the point-solution tail (Pathlabs, Adsmovil), but at ~$600M revenue inside a 3–5 year Bridgepoint exit clock, MiQ is also a plausible *target* — for a Stagwell-style network, a larger PE platform, or a holdco wanting an instant agnostic-CTV-data layer — well before it becomes the consolidator the press releases imply. \"Largest independent\" is true the way \"largest independent bookstore on this block\" is true: accurate, bounded, and quietly doing the work of making a contestable position sound settled.\n\n---\n\n## 1. Why this matters: the claim that gets asserted but never built\n\nThe standard market-structure read of MiQ does something subtle and worth naming. It maps MiQ against four \"bands\" — pure DSPs (Band A), holdco trading desks (Band B), independent specialists (Band C), and walled gardens (Band D) — and then spends roughly 90% of its competitive analysis on Bands A and D: The Trade Desk's 2025 collapse, Amazon's offensive, the walled-garden gravitational pull. Band C, the band MiQ actually *lives in*, gets a single passage naming three competitors — Goodway, Tinuiti, \"a long tail of point solutions\" — in two sentences each, with no scale comparison, no AI/agentic posture, no ownership map, and no adjudication of whether MiQ is in fact the largest of them.\n\nThe \"largest independent\" label is usually flagged honestly as a vendor claim — but flagging a claim as unaudited is not the same as stress-testing it. The phrase recurs as connective tissue: MiQ is the consolidator, the survivor, the scaled independent that outlasts the tail. That is a *competitive* thesis, and a competitive thesis can only be evaluated against the competitors. What follows supplies them.\n\nThe approach: profile the direct independent rivals and the adjacent challengers on five axes — **scale** (revenue/headcount where knowable), **model** (managed service vs. SaaS vs. agency), **AI/agentic posture**, **CTV/data assets**, and **ownership** (who is PE-backed and racing the same clock) — then answer three questions the usual framing poses implicitly and never resolves:\n\n1. Is MiQ plausibly \"the largest independent programmatic specialist,\" or is the claim true only on a gerrymandered definition?\n2. Who is the single most dangerous independent competitor to MiQ's specific thesis?\n3. Is the independent middle consolidating *toward* MiQ (it is the acquirer), or is MiQ a target in someone else's roll-up before the Bridgepoint exit?\n\nA note on the numbers. Almost every revenue and headcount figure for a *private* peer in this space comes from data-aggregators (Growjo, LeadIQ, PitchBook, ZoomInfo, Tracxn, getLatka) that estimate from signals rather than audited filings. These are estimates and are treated as directional throughout — never load-bearing, always tagged \"est.\" Public-company figures (Stagwell) come from earnings releases. The \"largest\" verdict rests on the *structure* of the comparison, which is robust to the estimate error bars, not on any single private revenue point.\n\n---\n\n## 2. The peer set, profiled\n\nThe right way to read MiQ's competition is not one list but four concentric rings, ordered by how directly each ring contests MiQ's specific thesis.\n\n### 2.1 Ring 1 — Direct independent programmatic specialists (MiQ's true peers)\n\nThese are the companies that sell what MiQ sells: programmatic execution as a managed service, independent of any holdco, agnostic across DSPs.\n\n**Goodway Group.** The closest philosophical competitor — independent, programmatic-first, tech-enabled service, supply-path-disciplined. Goodway has cut its SSP count from ~20 to single digits. On scale, Goodway is materially smaller than MiQ: data-aggregator estimates cluster around **~$160M revenue** with **250–500 employees** (LeadIQ's $35M figure looks like a net-revenue or partial estimate and is an outlier; the $100–500M band and the ~$160M point estimate are more consistent across Owler/Growjo) [1]. Critically, Goodway is **independently owned and operated** — not PE-controlled — which makes it a slower consolidator but also a non-target on a fixed clock. On AI/agentic posture, Goodway is further along than its size suggests: it markets a \"Connected Commerce OS\" powered by \"GOES\" and agentic AI, with its audience/identity layer powered by Optable (identity, signals, agentic workflows) [1]. Goodway's bet is commerce/retail-media-led; MiQ's is TV-data-led. They compete for the same \"independent alternative to the holdco desk\" mandate but aim at different budgets.\n\n**Tinuiti.** Tinuiti is often described as \"the largest U.S. independent full-funnel agency, ~$4B media under management\" — yet that description rarely reckons with what it implies for MiQ's \"largest\" claim. Tinuiti's own positioning is \"the largest independent performance marketing firm across Streaming TV and the Triopoly of Google, Meta, Amazon, with more than **$3 billion in digital media under management and over 1,200 employees**\" [2]. (The $3B and $4B figures both appear in Tinuiti materials of different vintages; treat $3–4B as the range.) Tinuiti is **PE-backed** — New Mountain Capital invested in 2020; a Mountaingate Capital relationship is also referenced — and has appeared on the Inc. 5000 ten times [2]. Its weight is in search/social/commerce and streaming TV, where MiQ is thinner; MiQ's weight is in programmatic display/video/CTV-data, where Tinuiti is thinner. But on the headline metric so often invoked — *media under management* — Tinuiti is in MiQ's class or above it, and it claims the \"largest independent\" crown for a *different* (overlapping) category. Two companies both calling themselves \"the largest independent\" is the tell that the category is being drawn to fit.\n\n**Croud and Crossmedia.** Two mid-scale independents at roughly **$170M revenue each** (data-aggregator estimates) [3]. Croud is a global performance agency (SEO, paid search/social, programmatic, analytics, creative) with a distributed \"Croud Network\" model; Crossmedia is an independent, minority-owned NYC media-services agency. Both are smaller than MiQ and broader-funnel; neither contests MiQ's programmatic-specialist core directly, but both sit in the \"independent alternative\" consideration set for mid-market brands. They matter mostly as roll-up texture: the kind of independent that either gets acquired or gets squeezed as AI capital intensity rises.\n\n**The point-solution tail.** Contextual vendors, regional programmatic shops, CTV specialists. MiQ leadership has named this tail as ripe for consolidation. This is the band MiQ *shops in* rather than competes with — the supply of acquisition targets, not rivals.\n\n### 2.2 Ring 2 — Independents that own more of the stack than MiQ\n\nHere the \"largest independent\" claim starts to wobble, because these independents own infrastructure MiQ rents.\n\n**Basis Technologies (formerly Centro).** This is the most pointed comparison the standard read omits entirely. Basis is an **independent** ad-tech company that **owns its own DSP** (Basis DSP, No. 1 in G2's DSP category by user satisfaction since 2017) plus a full campaign-management suite spanning programmatic, publisher-direct, CTV, search, and social. Its 2025 revenue is estimated at **~$155M ARR**, with a most-recent disclosed valuation around **$466M** [4]. Basis is the independent that resolves the exact vulnerability widely identified as MiQ's weakest link — on the plumbing, MiQ is often a value-added reseller of the same DSPs everyone else resells. Basis does not resell The Trade Desk; it *is* the DSP. It is smaller than MiQ in revenue but stronger in owned-technology durability, and it competes for the same independent-buyer mandate with a structurally less disintermediable position. If the question is \"which independent is least exposed to walled-garden disintermediation,\" Basis has a better answer than MiQ.\n\n**Mediaocean (Innovid + Flashtalking).** Mediaocean completed its acquisition of Innovid in February 2025, combining it with Flashtalking (acquired 2021 for a reported ~$500M) to form what it calls \"the premier global independent, omnichannel ad tech platform\" — ad serving, creative, measurement, optimization across CTV, digital, social, and linear [5]. Mediaocean's software powers **$200B+ in annualized media spend** and ~$70B in US TV advertising [5]. This is independence at infrastructure scale — an order of magnitude beyond MiQ on spend-touched, though a different business (workflow/serving software, not managed buying). Mediaocean is the proof that \"largest independent\" depends entirely on the noun you attach: largest independent *managed-service programmatic specialist* (a case for MiQ) is a very different claim from largest independent *ad-tech platform* (Mediaocean) or largest independent *full-funnel agency* (Tinuiti).\n\n### 2.3 Ring 3 — The challenger networks: independents at holdco scale\n\n**Stagwell.** The most important name the standard read never mentions. Stagwell is a publicly traded (NASDAQ: STGW) self-described \"global challenger network\" with **full-year 2025 revenue of $2,909M (net revenue $2.43B, +6%)** [6] — roughly five times MiQ's revenue, and explicitly positioned as the *independent* alternative to the legacy holdcos. Stagwell is not a holdco in the Band-B \"captive trading desk\" sense usually dismissed; it brands itself as the AI-native challenger to WPP/Omnicom/Publicis. And it is building, in public, the exact stack MiQ is assembling:\n\n- **Agentic media-buying.** In June 2026 Stagwell launched **The Media Machine**, \"a full lifecycle agentic media operating system\" with **20+ intelligent agents** that plan, buy, optimize, and report across every major platform (Google GMP, Meta, Microsoft/LinkedIn, TikTok, The Trade Desk), humans at every decision gate — built by Stagwell's GALE with Assembly and the Stagwell Media Platform [7]. This is the direct analogue of MiQ's Sigma \"Trading Agent\" — but built across the whole media lifecycle, not bolted onto a DSP.\n- **First-mover on TTD's agentic rails.** In April 2026 Stagwell became the **first global network to adopt The Trade Desk's Koa Agents** [8], the same TTD-agentic layer MiQ depends on. Stagwell sits *ahead of MiQ* on the very platform MiQ resells.\n- **The Stagwell Media Platform (SMP)**, launched 2025 under CEO Matt Adams, is a centralized media/tech/data arm targeting **$80–100M in AI-led efficiencies** and a long-term **$5B revenue** goal [6][9].\n- **Owned data.** Stagwell owns The Harris Poll and a research/data stack (SmartAssets, content studios) — first-party data assets MiQ has to *assemble from partners* (its 90M-household panel draws on 11 partners).\n\nStagwell's one structural difference from MiQ — it owns creative and PR networks, not just media — is a feature, not a bug, for the \"indispensable layer\" thesis: it can sell agentic media *inside* a full-service relationship MiQ cannot match. (One nuance worth flagging for balance: Stagwell's agentic agents, per its global CEO, \"won't execute buys autonomously\" and still require trader judgement [10] — the same human-in-the-loop posture MiQ takes, so neither has a fully autonomous edge yet.)\n\n**Brandtech Group (Jellyfish + Brainlabs-adjacent).** Brandtech acquired Jellyfish in 2023 to form a **$1B+ revenue, 7,000+ employee** AI-first digital marketing group; Jellyfish alone is ~2,300 people and in March 2025 launched an AI-driven media in-housing platform claiming 65% faster campaign launch [11]. Brainlabs is a separate **1,000+-person** independent media agency, AI-forward, acquiring (Exverus Media, July 2025) [11]. Both are larger-or-comparable independents whose AI-in-housing pitch competes directly with the value MiQ sells — and Jellyfish's \"in-housing\" platform is, pointedly, a tool to help advertisers *not need* a managed-service intermediary like MiQ (part of the broader in-housing counter-tradition discussed elsewhere).\n\n### 2.4 Ring 4 — AI-native challengers attacking the layer beneath MiQ\n\nThese do not compete with MiQ for managed-service budgets today. They threaten to commoditize the layer MiQ's Sigma sells.\n\n**Scope3.** Founded by Brian O'Kelley (inventor of the ad exchange, AppNexus → AT&T for $1.6B), Scope3 has pivoted from carbon-measurement into an **\"agentic advertising platform\"** where brand-agents and seller-agents autonomously negotiate and execute media buys, letting ad-tech firms, agencies, curators, and publishers \"create agentic media products\" by replacing legacy infrastructure [12]. Scope3 raised ~$25M in late 2024 on top of earlier rounds (it hit a $100M valuation in 2023), backed by GV (Google Ventures), Craft, Venrock, Room40 [12]. The threat to MiQ is conceptual: if agentic buying becomes a *protocol* (brand-agent ↔ seller-agent) running on open infrastructure, the orchestration-and-optimization layer Sigma sells gets disintermediated by the protocol — exactly the dynamic that the agentic-advertising shift and MiQ's Trade Desk dependency both circle. O'Kelley building it is a credibility signal MiQ cannot wave away.\n\n**Koah.** A San Francisco startup that raised **$5M seed (Sept 2025) then $20.5M Series A (Feb 2026, Theory Ventures)**, ~$26M total, building \"AdSense for AI\" — an SDK that drops native ads directly inside AI chat/search apps [13]. Koah does not compete with MiQ now. It is evidence of where the *inventory surface* is migrating: if attention moves into AI-native apps with their own ad layers, the open-web/CTV programmatic surface MiQ optimizes becomes one shrinking pool among several, and the next \"fragmentation to unify\" may be one MiQ has no panel for.\n\n**The Trade Desk's own Koa Agents / Kokai.** Not an independent, but the decisive agentic fact: TTD made agentic capabilities (Koa Agents, Kokai Adaptive Trading Modes) available to select agencies in late 2025 and broadly in early 2026 [8][14]. MiQ's Sigma Trading Agent runs *on top of* TTD; TTD now ships its own agent natively. This is the channel-conflict risk arriving in the agentic layer: the platform MiQ wraps is building the wrapper.\n\n---\n\n## 3. Adjudication 1 — Is \"largest independent programmatic specialist\" true, or gerrymandered?\n\n**Verdict: true only on a narrow, self-drawn definition; gerrymandered the moment you relax any single qualifier.**\n\nLay the qualifiers out explicitly. MiQ's defensible claim is: *largest* / *independent* (not holdco-owned) / *programmatic* (not full-funnel) / *specialist* (managed service across DSPs) / *media partner* (not pure agency, not pure SaaS). Each qualifier is doing exclusionary work:\n\n| Relax this qualifier… | …and a bigger independent appears |\n|---|---|\n| \"managed-service specialist\" → \"ad-tech platform\" | **Mediaocean** ($200B+ annualized spend touched) |\n| \"programmatic\" → \"full-funnel performance\" | **Tinuiti** ($3–4B media under management; also claims \"largest independent\") |\n| \"specialist shop\" → \"challenger network\" | **Stagwell** ($2.9B revenue, ~5× MiQ) |\n| \"reseller of DSPs\" → \"owns a DSP\" | **Basis** (smaller, but owns the rails MiQ rents) |\n| \"media-only\" → \"AI-first digital group\" | **Brandtech/Jellyfish** ($1B+, 7,000+ people) |\n\nOn the *exact* turf MiQ draws — independent, agnostic, programmatic-specialist, managed-service, TV-data-led — MiQ at ~$600M and ~1,900 people genuinely is the largest clean example. Goodway, Croud, and Crossmedia are all materially smaller; the rest are either bigger by being something else (platform, full-funnel agency, challenger network) or smaller-but-more-defensible (Basis owns its DSP). So the claim is not *false*. It is **category-gerrymandered**: each adjective narrows the field until MiQ is alone at the top, and the narrowing is exactly what makes a contestable position sound settled. The tell is external corroboration: the \"largest independent\" phrasing is sourced overwhelmingly to MiQ's own press releases, and at least one direct peer (Tinuiti) claims the same crown for an overlapping category [2]. A claim that two rivals both make, and that only the claimant's PR attests, is a positioning artifact, not an audited fact.\n\nThe honest restatement: **MiQ is plausibly the largest independent *DSP-agnostic managed-service programmatic shop with an owned CTV-data footprint*.** That is a real and defensible niche. It is also a sentence with five load-bearing adjectives, and all five should be carried every time the claim is invoked — not collapsed to \"largest independent,\" which is true only by quietly importing the qualifiers.\n\n---\n\n## 4. Adjudication 2 — The single most dangerous independent: Stagwell\n\n**Verdict: Stagwell, because it is the only independent assembling all three legs of MiQ's specific thesis — TV-data + agentic + agency-tooling — at greater scale, with public capital and its own owned data.**\n\nMiQ's 2029 thesis is a three-legged stool: (1) an owned CTV/TV-data asset, (2) an agentic/AI workflow layer (Sigma), (3) an agency-and-holdco tooling channel (Pathlabs MEP, the Dentsu Sigma deal). Rank the independents on whether they threaten *all three legs simultaneously*:\n\n- **Goodway** threatens leg 3 (agentic agency tooling) and a bit of leg 1 (commerce data), but is sub-scale and commerce-led, not TV-led. Not the most dangerous.\n- **Basis** threatens the *premise* of MiQ's reseller economics (it owns a DSP) but is smaller and has no comparable TV-data or holco-licensing play. Dangerous to the margin story, not the whole thesis.\n- **Tinuiti** threatens the \"largest independent\" label and the streaming-TV budget, but is search/social/commerce-weighted and does not license a Sigma-style platform to holdcos. Dangerous to positioning, not to the platform thesis.\n- **Scope3** threatens leg 2 (agentic) at the protocol level — the most *conceptually* dangerous, but pre-scale and infrastructure-layer, not yet a managed-service competitor.\n- **Stagwell** threatens **all three at once.** Leg 1: it owns The Harris Poll and a first-party data/research stack — owned data, where MiQ rents from 11 partners. Leg 2: The Media Machine is a 20-agent, full-lifecycle agentic media OS [7], and Stagwell is the *first* network on TTD's Koa Agents [8] — ahead of MiQ on MiQ's own rails. Leg 3: the Stagwell Media Platform is precisely an agency-tooling/centralized-trading layer, sold inside full-service relationships MiQ cannot offer, targeting a $5B revenue trajectory [6][9].\n\nThe reason Stagwell is *more* dangerous than the walled gardens that usually dominate the discussion: Amazon and TTD compete with MiQ on the *plumbing* (the DSP), where MiQ can route around them by being agnostic. Stagwell competes with MiQ on the *whole value proposition* — independent, agnostic, agentic, data-led, sold to brands and agencies — at five times the scale and with a public balance sheet to fund the AI capex that will separate survivors from the tail. If the independent middle's defining 2026–2029 contest is \"who builds the indispensable agentic-media layer for brands that don't want a walled garden and don't want a legacy holdco,\" Stagwell is running that exact race, louder and bigger, and got onto the agentic rails first.\n\nThe caveat that keeps this from being a rout: Stagwell carries creative/PR overhead and holdco-style complexity MiQ doesn't, its agents are explicitly *not* autonomous yet [10], and MiQ's pure-play agnosticism and B2B2B Pathlabs channel into *independent* agencies is a flank Stagwell (itself a network) is structurally awkward to attack. MiQ can sell to the long tail of independent agencies precisely *because* it is not a competing network. That is the one place MiQ's thesis is safer than Stagwell's.\n\n---\n\n## 5. Adjudication 3 — Consolidating toward MiQ, or is MiQ a target?\n\n**Verdict: both, simultaneously — and the usual \"MiQ as consolidator\" frame understates the symmetric risk that MiQ is acquired before the Bridgepoint exit window closes.**\n\nThe 2025–2026 M&A record shows the independent middle consolidating hard in every direction: Mediaocean bought Innovid; The Trade Desk bought Sincera; Publicis bought Lotame; Experian bought Audigent; Omnicom merged with IPG to form the largest holdco by revenue (retiring FCB, MullenLowe, DDB; ~4,000 jobs cut; $750M targeted savings) [15][16]. Nearly **80% of the top 80 digital media agencies have taken PE or VC money** [15]. The structural driver is AI capital intensity: eMarketer reports **60% of US senior marketing leaders cut agency spend in 2025** citing AI, and **82% of ANA members now run in-house agencies** [16] — both of which raise the table stakes for staying independent and viable.\n\nIn that environment, the \"MiQ as independent consolidator\" story (Pathlabs, Adsmovil, the named ambition to roll up the US point-solution tail) is real but only half the picture. The symmetric facts:\n\n1. **MiQ is the right size to be bought, not just to buy.** At ~$600M revenue / ~1,900 people, MiQ is a *tuck-in or platform acquisition* for a larger acquirer — small enough to swallow, large enough to matter. Bridgepoint paid ~$900M in ~2024; a strategic or a bigger PE platform could pay a premium for an instant agnostic-CTV-data-plus-agentic layer.\n2. **PE ownership is a clock, and clocks force exits.** Bridgepoint's 3–5 year horizon means MiQ *must* transact by roughly 2027–2029 — IPO, secondary sale to another sponsor, or strategic acquisition. The roll-up is partly *dressing for that exit* (assemble the \"largest independent\" story to justify the multiple), which is exactly the incentive the ownership structure creates. A roll-up built to be sold is, by construction, also a target.\n3. **The natural buyers are the very names in this teardown.** A Stagwell wanting MiQ's owned CTV panel and Pathlabs channel; a holdco (Dentsu already has Sigma \"at the strategic center,\" which is both a partnership and a pre-acquisition courtship pattern); a Mediaocean/Basis-style platform wanting managed-service distribution; or a larger PE platform assembling an agentic-media roll-up. The Dentsu relationship in particular is the classic \"license-then-buy\" on-ramp.\n\nSo the consolidator framing — MiQ as the buyer racing the clock — should be paired with its mirror: **MiQ is also the consolidated, and the same exit clock that funds its acquisitions makes it acquirable.** The most likely 2029 outcome is not \"MiQ rolls up the independent band.\" It is \"MiQ is sold — to a sponsor, a network, or a platform — at a multiple that depends on whether Sigma re-rated it as a platform or whether it exits as a scaled-but-commoditizing services business.\" Whether MiQ is acquirer or target by 2029 turns on the same variable everything else here turns on: did the owned CTV-data asset and the agentic Sigma layer become durable IP, or did the walled gardens and the agentic-protocol layer (Stagwell, Scope3, TTD's own Koa) make the independent middleman optional first.\n\n---\n\n## 6. What this changes about the competitive read\n\nThree corrections this teardown forces:\n\n1. **\"Largest independent\" must always carry its five adjectives.** Used bare, it imports a category-gerrymander. Used precisely — \"largest independent DSP-agnostic managed-service programmatic shop with an owned CTV-data footprint\" — it is defensible and should be stated that way every time.\n2. **The competitive threat list is incomplete without Stagwell.** Any account that maps MiQ against The Trade Desk and Amazon (platforms it buys *through*) but omits Stagwell, Basis, Mediaocean, Tinuiti, and Brandtech (independents it buys *against*) has profiled the suppliers and skipped the rivals. Stagwell specifically belongs in every discussion of MiQ's agentic and data thesis.\n3. **The consolidation arrow points both ways.** \"MiQ as consolidator\" and \"MiQ as target\" are not alternatives; they are the same PE-clock fact seen from two ends. The 2029 outlook should price a meaningful probability that MiQ *exits via acquisition* — quite possibly to one of the independents profiled here.\n\n---\n\n## Open Questions\n\n1. **MiQ vs. Stagwell head-to-head on agentic autonomy.** Both run human-in-the-loop agents today [7][10]. Which crosses to genuinely autonomous buying first? Unresolved.\n2. **Private-peer revenue precision.** Goodway (~$160M), Croud/Crossmedia (~$170M), Basis (~$155M), Tinuiti ($3–4B MUM) are all data-aggregator estimates. Audited figures are not public. The *structure* of the comparison is robust; the exact ordering among the sub-$200M peers is not.\n3. **Is Tinuiti or MiQ \"the larger independent\"?** Depends entirely on metric: MiQ leads on revenue-as-a-programmatic-specialist; Tinuiti leads on media-under-management and headcount-comparable full-funnel scale. Both claim \"largest independent.\" No neutral arbiter resolves it.\n4. **Does Stagwell actually want MiQ — or compete it to death?** A Stagwell acquisition of MiQ would fold the cleanest agnostic-CTV-data asset into a challenger network. Whether Stagwell builds (The Media Machine) or buys is the live strategic fork. No public signal either way.\n5. **Where does the inventory surface go?** If attention migrates into AI-native apps (Koah's thesis) [13], MiQ's CTV/open-web panel optimizes a shrinking pool. AI-native ad surfaces as a *demand-side* threat to MiQ's addressable market remain underexamined.\n6. **Brainlabs/Brandtech in-housing as anti-MiQ.** Jellyfish's AI in-housing platform [11] is explicitly built to reduce reliance on managed-service intermediaries — the same in-housing counter-tradition seen elsewhere, but from a *competitor* rather than a brand. Not yet mapped.\n\n---\n\n## Sources\n\n1. Goodway Group — data-aggregator profiles (LeadIQ, Owler, Growjo, PitchBook, ZoomInfo) and company site, accessed 2026-06-20. *Revenue ~$160M est. (range $100–500M; $35M LeadIQ figure treated as outlier), 250–500 employees est.; independently owned; \"Connected Commerce OS\" / GOES / agentic AI; identity via Optable. Estimates directional, not audited.* https://growjo.com/company/Goodway_Group ; https://goodwaygroup.com/\n2. Tinuiti — company \"About\"/news pages and PRNewswire, accessed 2026-06-20. *\"Largest independent performance marketing firm across Streaming TV and the Triopoly,\" $3B+ (also cited $4B) media under management, 1,200+ employees, Inc. 5000 ×10; New Mountain Capital (2020) / Mountaingate Capital PE backing. \"Largest independent\" is Tinuiti's own claim — used here as evidence two rivals claim the same crown.* https://tinuiti.com/about/ ; https://www.prnewswire.com/news-releases/tinuiti-announces-investment-from-new-mountain-capital-to-accelerate-next-phase-of-growth-301183922.html\n3. Croud and Crossmedia — data-aggregator profiles (Growjo/ZoomInfo/PitchBook), accessed 2026-06-20. *Croud ~$170.4M est., global performance agency; Crossmedia ~$170.0M est., independent minority-owned NYC media-services agency. Directional only.* https://www.zoominfo.com/c/croud-inc-ltd/356587147 ; https://www.crunchbase.com/organization/crossmedia\n4. Basis Technologies (formerly Centro) — getLatka, TrustRadius, ZoomInfo, company site, accessed 2026-06-20. *~$155.4M ARR (2025 est.), ~$466.3M most-recent disclosed valuation; owns Basis DSP (No. 1 in G2 DSP category since 2017) + campaign-management suite across programmatic/publisher-direct/CTV/search/social; rebranded from Centro 2022. The independent that owns its DSP rather than reselling.* https://getlatka.com/companies/basis.com ; https://basis.com/technology/dsp/channels/programmatic\n5. Mediaocean — company/Innovid releases and AdExchanger, accessed 2026-06-20. *Completed Innovid acquisition Feb 2025; Flashtalking acquired 2021 (~$500M reported, ~$100–150M revenue); software powers $200B+ annualized media spend, ~$70B US TV; \"premier global independent omnichannel ad tech platform.\"* https://www.innovid.com/about-us/news/mediaocean-completes-acquisition-of-innovid ; https://www.adexchanger.com/ad-ex
