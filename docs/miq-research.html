r 5 generic guidance). The implied billings figure is an **inference** built on an unverified take-rate assumption — treat it as illustrative arithmetic, not fact.\n\n### 1.3 Is there any SaaS / licensing revenue from Sigma?\n\n**Answer: not in any disclosed figure, yet.** Sigma launched 4 June 2025 [4] and represents, per MiQ, a **\"$100 million-plus investment\" in AI-powered programmatic infrastructure, with over $25M spent annually just on data partnerships** [5]. But the public reporting on Sigma says nothing about whether it is sold as SaaS, as a license, or simply as the engine behind the same managed-service relationship [5]. The most important client deployment — **Dentsu selecting Sigma as its \"Intelligence Partner\" (June 2025)** [6] — is described as an integration into Dentsu's media practice, not a per-seat software license with a published price.\n\nThis is the crux of the equity story (Section 6): the *whole point* of Sigma is to move revenue from \"we sell you our traders' time\" toward \"we license you our platform.\" As of mid-2026 that is an **announced strategy with early deployment, not a reported revenue line.** Anyone who tells you Sigma is \"already\" a high-margin SaaS business is ahead of the disclosed facts.\n\n> **Confidence:** high that the *investment* figures ($100M+, $25M/yr data) are on the record (MiQ statements via Tier 5). High that **no separately-priced SaaS revenue line is disclosed.** This is a deliberate, flagged absence of evidence.\n\n---\n\n## 2. The Profit Picture: Margins and What They Tell You\n\n**Answer first:** MiQ's last hard profit figure is **EBITDA of ~$40M–$50M on ~$465M of 2021 revenue — a roughly 9%–11% EBITDA margin.** That is a healthy, real, cash-generative services business — and it is *structurally* a services margin, a fraction of what a software platform earns. The entire Sigma thesis is an attempt to move this number up.\n\n### 2.1 The one hard margin data point\n\nThe cleanest profit disclosure in the public record comes from the **2022 sale process**, reported by the PE trade publication *Unquote*: **MiQ had revenues of ~$465M in 2021, annual EBITDA in the range of $40M–$50M, and 37% organic growth in 2021** [3]. That EBITDA range against that revenue gives a **blended EBITDA margin of about 9%–11%.**\n\nFor comparison, an earlier Companies House filing reported **2020 group turnover of $337.6M and after-tax profit of $15.9M** [7] — an after-tax margin near 5%, consistent (after tax, interest, and the LBO's debt service) with the ~9%–11% EBITDA margin reported a year later.\n\n> **Confidence:** medium-high. The $465M / $40M–$50M EBITDA figures are Tier 5 PE trade reporting of a private deal (*Unquote*), single-sourced for the EBITDA range. The 2020 turnover/profit is Tier 1 (Companies House filing as reported).\n\n### 2.2 Why a 9%–11% margin is the whole story\n\nThis margin is **diagnostic of the business model.** Pure ad-tech software platforms run far richer:\n\n- **The Trade Desk**, the bellwether independent DSP, has historically reported **adjusted-EBITDA margins around 40%+** — software economics, because the marginal cost of running one more campaign through its platform is near zero.\n- MiQ's ~9%–11% is **managed-service economics**: every incremental campaign needs trader time, data-science time, and account-management time. Revenue scales with headcount, so margin is capped.\n\nThis is not a criticism — it is the *definition* of the model MiQ chose. It also explains why MiQ's ~1,900 employees (April 2026) [8] matter to the financial story: in a managed-service business, **people are the cost of goods.** The only way to break the headcount-equals-revenue link is to **productize** — which is exactly what Sigma is for (Section 6).\n\n> **Confidence:** medium on the directional TTD comparison (the 40%+ figure is well-established for TTD from its public filings; cited here as a model contrast, not a precise like-for-like). High on the structural point that managed service caps margins below software.\n\n### 2.3 Growth as the offset to thin margins\n\nThin margins are tolerable to a PE owner if growth is fast, because the value is created on the *multiple of a growing EBITDA*, not on margin expansion alone. And MiQ's growth has been genuinely strong:\n\n- **37% organic revenue growth in 2021** [3].\n- Over the **2017–2022 ECI hold: ~27% organic revenue CAGR and ~31% EBITDA CAGR** (Pantheon, a co-investor) [9].\n- North America went from a growth bet to **over 80% of group revenue by the 2022 exit** [9] — the US expansion is the single biggest driver of the value created.\n\nSo the financial profile is: **modest margin, high growth, services-heavy.** A PE firm buys that profile expecting to (a) keep growing the top line and (b) re-rate the margin by productizing. Sigma is bet (b).\n\n> **Confidence:** high. The growth CAGRs are disclosed by a co-investor (Pantheon, Tier 1-adjacent LP disclosure) and corroborate the ECI/Unquote figures.\n\n---\n\n## 3. The Scale Question: Reconciling the Revenue Figures (Read This Carefully)\n\n**Answer first:** There is no single audited \"MiQ revenue\" number in the public domain, and the figures floating around — **$64.7M, $337.6M, $465M, $600M+, $500M–$1B** — are *not contradictory*; they measure **different things** (one legal entity vs. the whole group; different years; audited vs. estimated). Anyone who quotes one of them as \"MiQ's revenue\" without saying *which entity, which year, and audited-or-estimated* is misleading you. Here is the reconciliation.\n\n### 3.1 The numbers, laid out\n\n| Figure | What it actually is | Basis | Tier / confidence |\n|---|---|---|---|\n| **~$64.7M (FY2022)** | **One UK legal entity** (commonly cited from company-data aggregators for MIQ Digital Limited, no. 07321732), not the group | Aggregator restatement of a single-entity filing | Tier 5 aggregator; **partial — single entity only** |\n| **>£54M turnover** (entity, recent) | The same UK entity, \"Large\" company threshold, FY2024 accounts filed Sept 2025 | Companies House classification | Tier 1 (filing), but **single entity** |\n| **$337.6M (2020)** | **Group** consolidated turnover | Companies House group accounts, as reported | Tier 1, audited |\n| **$465M (2021)** | **Group** revenue, stated in the 2022 sale process | *Unquote* PE trade reporting | Tier 5; single-source on this exact figure |\n| **\"$600M+\" (May 2023)** | **Group**, founder's verbal statement | Hundal interview | Tier 6 self-report — directional only |\n| **$500M–$1B (current)** | **Group**, third-party tracker estimates | PitchBook / CB Insights / Tracxn / Growjo | Tier 5 estimates, **method unknown** |\n| **\"up to $1B\" (2022)** | **Enterprise valuation** at the Bridgepoint deal — *not revenue* | Deal reporting | Tier 4/5; a valuation, not a revenue figure |\n\n### 3.2 Why the ~$64.7M and the ~$465M+ figures both exist and are both \"true\"\n\nHere is the reconciliation, and it is straightforward once you separate three axes:\n\n1. **Entity vs. group.** MiQ is not one company; it is a **group of legal entities** in every market it operates (UK, US, India, LatAm, APAC, etc.), consolidated under a parent. The UK filings show that ultimate parent structure running through **Insight BidCo Limited**, the Bridgepoint acquisition vehicle, as 100% shareholder of the operating entity [10]. **MIQ Digital Limited (no. 07321732) is the UK trading entity** — and **less than 20% of group revenue came from the UK** even in 2021 [3], with North America over 80% by 2022 [9]. So a single UK-entity turnover of ~$64.7M / £54M+ is entirely consistent with a *group* revenue several multiples larger: **the US entities, not the UK one, carry most of the revenue.** The ~$64.7M is a real number for a real entity. It simply is not the group.\n\n2. **Audited vs. estimated.** The $337.6M (2020) and the UK entity figures are **filed, audited** numbers (Tier 1). The $465M (2021), $600M+ (2023), and $500M–$1B (current) are **trade-reported or estimated** (Tiers 5–6). The audited floor lags; the estimates lead but are softer.\n\n3. **Net revenue vs. gross billings vs. valuation.** MiQ's *revenue* is its fee layer (Section 1) — already net of the media it buys. The \"$500M–$1B\" range is a *revenue* estimate; the \"up to $1B\" from 2022 is an **enterprise valuation** (what the company is worth, not what it earns). Conflating the valuation with revenue is a common error in tracker write-ups.\n\n**The honest synthesis:** the best-supported *group revenue* anchor is **~$465M for 2021 (Tier 5 deal reporting), growing from an audited $337.6M in 2020 (Tier 1)**; the founder's \"$600M+\" (2023) and trackers' \"$500M–$1B\" (current) are **plausible, directionally-up, but unverified** — consistent with continued ~20%–30% growth off the 2021 base, but not audited. The \"~$64.7M\" is a **single UK entity** and should never be presented as the group number.\n\n> **Confidence:** high on the *reconciliation logic* (entity-vs-group, audited-vs-estimated, revenue-vs-valuation are documented). Medium on the precise current group revenue — **there is no audited group figure in the public domain for 2023–2025**, and I flag that gap explicitly.\n\n### 3.3 What I could NOT verify\n\nI did **not** directly read the full filed group accounts for FY2023 or FY2024. The Companies House overview confirms audit-exempt subsidiary accounts to 31 Dec 2024 were filed 11 Sept 2025, with consolidated parent accounts alongside [10][11] — but I did not extract the consolidated revenue line from the PDF. The current group revenue therefore rests on **estimates and a 2023 founder statement**, not a 2024 audited figure. This is the largest single open item in the financial picture, flagged accordingly.\n\n---\n\n## 4. Ownership: Bridgepoint, the Cap Table, and the Debt\n\n**Answer first:** **Bridgepoint Group holds the controlling majority stake** in MiQ, acquired in **September 2022** in a deal valuing MiQ at **\"up to $1 billion,\"** financed in part with **private debt from Pemberton.** The **founders (Hundal, Puri) retained equity and operating roles** through the transaction. This is a classic mid-market PE buyout: majority control to the sponsor, meaningful rollover for management, leverage on the balance sheet.\n\n### 4.1 The 2022 Bridgepoint buyout\n\nOn **13 September 2022**, Bridgepoint announced the acquisition of a **majority stake** in MiQ from **ECI Partners** (and co-investors including Pantheon/PIN and GP Bullhound), in a transaction reported to value MiQ at **\"up to $1 billion\"** [12][13]. At the deal, MiQ employed \"over 1,000 people in 22 offices\" and **Gurman Hundal moved to Global Executive Chairman** while remaining central; the founders rolled equity rather than cashing fully out [12].\n\n- **Sponsor:** Bridgepoint Group plc, a London-listed mid-market PE firm; MiQ sits in its private-equity / middle-market technology portfolio [14].\n- **Stake:** **majority** (exact percentage undisclosed; ECI \"declined to comment on the size of the stake sold\") [3][12].\n- **100% shareholder of the UK operating entity:** **Insight BidCo Limited**, the Bridgepoint acquisition vehicle [10].\n\n> **Confidence:** high that Bridgepoint holds the majority (multiple Tier 4/5 sources + Companies House parent structure). Medium on \"up to $1 billion\" (deal-press figure, never officially confirmed as the precise price); cited as the reported valuation envelope, not a confirmed transaction value.\n\n### 4.2 The debt: Pemberton\n\nBridgepoint's buyout was **debt-supported by Pemberton Asset Management**, drawing on Pemberton's **Mid-Market Debt and Strategic Credit strategies**; the financing completed **22 November 2022** [15]. Pemberton had **already backed MiQ via a senior-loan recapitalisation for ECI in early 2021** [15] — so MiQ has carried acquisition/recap debt on its balance sheet since at least 2021. The **facility size and structure are undisclosed** (standard for private credit).\n\nThis matters for the margin story: **debt service eats into the thin services margin.** A ~9%–11% EBITDA margin with an LBO's leverage on top is why the after-tax profit was only ~$15.9M on $337.6M in 2020 [7] — interest and tax compress an already-modest operating margin. It also raises the stakes on the Sigma bet: a leveraged business needs EBITDA to grow to de-lever and to clear the next owner's underwriting.\n\n> **Confidence:** high that Pemberton provided the debt and the 2021 recap (Pemberton's own announcement, Tier 1 for \"what Pemberton states\"). Low on the *quantum* — undisclosed.\n\n### 4.3 The prior owner: ECI Partners (2017–2022)\n\n**ECI Partners** made a **minority, all-equity investment in MiQ in 2017** (via its ECI 10 fund) and **exited to Bridgepoint in September 2022** — about a **five-year hold** [3][16]. The exit is the headline precedent for the next one (Section 5):\n\n- **ECI realised a 6.1x money multiple and a 47% IRR** [16][17].\n- Co-investor **Pantheon (PIN) reports 5.9x MOIC and 49% IRR** on its slice, with **27% organic revenue CAGR and 31% EBITDA CAGR** over the hold, and a **296% valuation uplift versus 12 months prior** to exit [9].\n- Crucially, **client-direct customers grew from 0% at entry to 15% of revenue at exit** [9] — evidence that the business diversified beyond pure agency intermediation during the hold, which supports a higher exit multiple.\n\n> **Confidence:** high. The 6.1x / 47% (ECI) and 5.9x / 49% (Pantheon) figures are disclosed by the investors themselves (Tier 1 for investor returns; Tier 5 trade corroboration via *Unquote*). The two multiples differ slightly because they are *different investors' slices* of the same deal — not a contradiction.\n\n---\n\n## 5. The PE Exit Clock: When Does Bridgepoint Sell?\n\n**Answer first:** Bridgepoint bought in September 2022. On the standard mid-market PE holding period of **~4–6 years**, the **exit or recapitalisation window is roughly 2026–2028** — meaning **MiQ is, as of mid-2026, entering the front edge of its sale window.** The likely exit routes are a **secondary buyout (sale to a larger PE firm), a strategic sale (to a holdco, a larger ad-tech platform, or a data company), or — less likely for a services-led business — an IPO.**\n\n### 5.1 The arithmetic of the clock\n\nPE funds are finite-life vehicles; sponsors typically hold a platform asset **4–6 years** before returning capital to their LPs. Bridgepoint's entry was **September 2022** [12]. That implies:\n\n- **Earliest realistic exit:** ~2026 (4-year hold).\n- **Base-case window:** **2026–2028**.\n- **Late case:** ~2028–2029 if Bridgepoint extends to let the Sigma thesis mature (or moves the asset into a continuation vehicle).\n\nThe 2026–2028 window falls **squarely inside the 2029 horizon this account looks out to** — so the ownership question is not academic background; it is a live event likely to occur inside that period, and it shapes everything from M&A appetite to how aggressively MiQ pushes the Sigma narrative (a productized, higher-margin story sells for a higher multiple).\n\n> **Confidence:** high on the *mechanism* (4–6 year holds are the PE norm; the 2022 entry is firm). The specific window is an **inference from the holding-period base rate**, explicitly flagged — not a disclosed sale timeline.\n\n### 5.2 The ECI precedent sets the ambition\n\nECI's **6.1x / 47% IRR** is the bar in the room. Bridgepoint underwrote MiQ in 2022 at a valuation up to ~$1B [12] on the back of ECI's growth story. To clear its own return hurdle (PE funds typically target ~2.5x–3x+ on a platform), Bridgepoint needs MiQ's **enterprise value to roughly double-to-triple** over its hold. With a thin services margin, that re-rating comes from **(a) continued top-line growth, (b) EBITDA-margin expansion via Sigma, and (c) multiple expansion if MiQ can credibly reposition from \"trading desk\" to \"AI platform.\"** All three are why the Sigma productization (Section 6) is the linchpin of the equity story.\n\n> **Confidence:** medium. The ECI precedent and PE return-hurdle norms are well-established; the specific re-rating Bridgepoint needs is a reasoned inference, flagged.\n\n### 5.3 A caution on aggregator \"exit\" data\n\nSome company-data trackers surface a 2026 **\"Rocket Lab\"** entry in MiQ's deal history. This is **not** an aggregator data error or an Adsmovil/space-company conflation. \"Rocket Lab\" is a **genuine, separate MiQ acquisition** — an ad-tech mobile **App Growth Hub** led by CEO Juan Echavarria Coll, announced **April 7, 2026** (corroborated by BusinessWire, wearemiq.com, Latham & Watkins, and Progress Partners); the trackers merely mis-dated/mislabeled it. The conclusion is unchanged: there is **no credible evidence that Bridgepoint has exited MiQ as of June 2026** — Bridgepoint's portfolio still lists MiQ [14]. Nothing here **asserts that a Bridgepoint exit has occurred**; the 2026–2028 exit window is a forward base-rate inference.\n\n> **Confidence:** high that **no verified Bridgepoint exit has occurred** as of mid-2026; the contrary tracker entry is treated as a data artifact, not evidence.\n\n---\n\n## 6. The Equity Story: Why Sigma Is the Margin Bet\n\n**Answer first:** The reason a PE owner cares about Sigma is **margin arithmetic.** MiQ today earns ~9%–11% EBITDA margins because it sells labor. A software platform earns 40%+ because it sells code. **Sigma is the attempt to move MiQ's revenue mix from labor toward software — and the multiple the next buyer pays depends heavily on how far that shift has gone.** This is the single most important strategic-financial linkage in the whole MiQ story.\n\n### 6.1 The managed-service margin ceiling\n\nIn managed service, **revenue is a function of headcount.** To do more campaigns you hire more traders. That is why MiQ has ~1,900 employees [8] and a single-digit-to-low-double-digit EBITDA margin [3]. There is a ceiling: you cannot out-grow your labor cost without changing the model. A PE owner who only ever had managed service would be buying a good services business at a services multiple (typically a high-single-digit to low-teens EBITDA multiple) — fine, but not a home run.\n\n### 6.2 What productization does to the math\n\nIf MiQ can get clients — and especially holdcos like Dentsu — to **license Sigma** and run their own activation through MiQ's platform rather than buying MiQ's traders' time, then incremental revenue arrives at **software gross margins**, the headcount-equals-revenue link breaks, and MiQ can be repositioned as a **platform** rather than a desk. Platforms trade at **revenue multiples** (often 5x–10x+ revenue for high-growth ad-tech software) rather than EBITDA multiples on a thin-margin service. The re-rating from \"services company\" to \"platform\" is where the outsized PE return would come from — in effect, **multiple arbitrage funded by a product investment.**\n\nThis is why MiQ has put **$100M-plus into Sigma and spends $25M+/year on data partnerships** [5]: the spend is not just product development, it is **equity-story construction** ahead of a 2026–2028 exit.\n\n> **Confidence:** high on the strategic logic (this is textbook PE value-creation and matches MiQ's own framing). The specific multiple ranges are **illustrative market norms**, flagged, not MiQ-specific.\n\n### 6.3 The honest caveat: thesis, not yet result\n\nAs of mid-2026 the productization is **early.** Sigma launched June 2025 [4]; the marquee Dentsu deal is an **integration/partnership** [6], not a disclosed per-seat license at scale; and **no public figure breaks out \"Sigma SaaS revenue\" as a line item** [5]. The margin transition is therefore a **forward thesis the next owner will underwrite — not a margin already on the books.** A skeptic's version: MiQ may remain, at exit, a *services business with an AI front-end*, sold at a services-plus multiple rather than a true platform multiple. The gap between the platform none of these deal values is public. For a PE-backed platform of MiQ's size, bolt-ons of this scale are typically funded from **operating cash flow plus sponsor equity plus incremental debt** (the existing Pemberton facility can usually be upsized for accretive add-ons). I found **no disclosure of the specific funding split for any individual MiQ acquisition** — so the \"how it's funded\" answer is **structural (the standard PE buy-and-build toolkit), not deal-specific.**\n\n> **Confidence:** high on the buy-and-build *mandate* (Hundal on the record). High that deal values/funding are **undisclosed.** The funding-split description is an **inference from the standard PE structure**, explicitly flagged — not a sourced MiQ financing fact.\n\n### 7.3 Why the roll-up reinforces the exit story\n\nEach accretive bolt-on does two things for the equity case: it **adds EBITDA** (raising the absolute number the exit multiple is applied to) and it **adds the \"platform/scale\" narrative** (\"largest independent in LatAm,\" etc.) that supports multiple expansion. The Adsmovil timing — **March 2026, at the front edge of the 2026–2028 exit window** — is consistent with **dressing the asset for sale**: build visible scale and a clean \"largest independent\" story just before going to market. (This is an interpretation of the timing, flagged as such, not a stated MiQ intent.)\n\n> **Confidence:** medium. The accretion logic is sound; the \"dressing for sale\" reading of the Adsmovil timing is an **interpretation**, flagged.\n\n---\n\n## 8. Present-Tense Status Checks\n\nEach item below is a *present-tense factual claim* about something operating or owned **as of mid-2026**, with the most recent confirming source. Where that confirmation is older, I say so.\n\n- **Bridgepoint holds the MiQ majority stake** — confirmed live via Bridgepoint's current portfolio listing [14] and the Companies House parent structure (Insight BidCo) [10]. *Most recent confirmation: 2026 portfolio page / 20 6.1x/47% IRR, all-equity 2017 minority entry. **Single-source on the EBITDA range.** Accessed 2026-06-20.\n4. MiQ / BusinessWire, \"MiQ Sigma Breaks the Fragmentation Cycle,\" 4 June 2025. https://www.businesswire.com/news/home/20250604957858/en/ — Tier 1 (company release; evidence of *what MiQ claims*). *Contribution:* Sigma launch date and scope. Accessed 2026-06-20.\n5. Marketing-Interactive, \"MiQ unveils $100m Sigma platform…,\" 5 June 2025. https://www.marketing-interactive.com/miq-sigma-ai-meets-ambition-in-programmatic-next-chapter — Tier 5 trade press. *Contribution:* the $100M+ Sigma investment, $25M+/yr data spend, and the **absence** of any disclosed SaaS/licensing pricing model. Accessed 2026-06-20.\n6. MiQ / Dentsu, \"Dentsu Selects MiQ Sigma to Help Power Next Gen Media Operations,\" June 2025. https://www.wearemiq.com/resources/news/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations and https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — Tier 1 (company releases). *Contribution:* Dentsu as first holdco to put Sigma at the center; live integration status. Accessed 2026-06-20.\n7. MiQ Companies House group accounts (2020), as reported via Marketecture/Digiday. https://news.marketecture.tv/p/miq-gurman-hundal — *Contribution:* audited 2020 group turnover $337.6M and after-tax profit $15.9M; Hundal's May 2023 \"$600M+\" verbal statement (Tier 6 self-report). Accessed 2026-06-20.\n8. Growjo / tracker data, employee count ~1,909 as of 30 April 2026. https://growjo.com/company/MiQ — Tier 5 tracker estimate. *Contribution:* current headcount (estimate, not company-audited). Accessed 2026-06-20.\n9. Pantheon International (PIN), MiQ case study. https://www.pantheon-international.com/our-portfolio/case-studies/miq/ — Tier 1 (investor's own disclosure). *Contribution:* 5.9x MOIC / 49% IRR (PIN slice); 27% organic revenue CAGR & 31% EBITDA CAGR over the 2017–22 hold; NA >80% of revenue at exit; client-direct 0%→15%; 296% valuation uplift vs. 12 months prior. Accessed 2026-06-20.\n10. Companies House (UK), MIQ DIGITAL LIMITED (no. 07321732) — overview & persons-with-significant-control. https://find-and-update.company-information.service.gov.uk/company/07321732 — Tier 1 primary filing. *Contribution:* entity status, SIC 82990, registered office, Insight BidCo Limited as 100% shareholder (Bridgepoint vehicle); \"Large\" company, turnover >£54M (single entity). Accessed 2026-06-20.\n11. Companies House (UK), MIQ DIGITAL LIMITED filing history. https://find-and-update.company-information.service.gov.uk/company/07321732/filing-history — Tier 1. *Contribution:* FY2024 audit-exempt subsidiary accounts + consolidated parent accounts filed 11 Sept 2025; FY2023 filed Sept 2024; FY2022 filed Nov 2023. *(Consolidated revenue line not extracted — open question 1.)* Accessed 2026-06-20.\n12. Daily Research News Online / MrWeb, \"New Investor Bridgepoint Takes Majority Stake in MiQ,\" 13 Sept 2022. https://www.mrweb.com/drno/news33875.htm — Tier 4/5 trade press. *Contribution:* majority stake to Bridgepoint, \"up to $1B\" valuation, Hundal to Executive Chairman, founders rolled equity, ECI/GP Bullhound exit, >1,000 staff / 22 offices at deal. Accessed 2026-06-20.\n13. PE Hub, \"Bridgepoint buys digital marketing specialist MiQ from ECI Partners,\" 13 Sept 2022. https://www.pehub.com/bridgepoint-buys-digital-marketing-specialist-miq-from-eci-partners/ — Tier 5 PE trade press (paywalled). *Contribution:* corroborates Bridgepoint acquisition, ECI 6.1x, deal date. Accessed 2026-06-20.\n14. Bridgepoint Group, MiQ portfolio listing. https://www.bridgepointgroup.com/investment-strategies/private-equity/portfolio/middle-market/technology/miq — Tier 1 (sponsor's own current portfolio page). *Contribution:* confirms MiQ remains a current Bridgepoint portfolio company (going-concern check on ownership). Accessed 2026-06-20.\n15. Pemberton Asset Management, \"Pemberton Supports Bridgepoint's Acquisition of Programmatic Media Company MiQ,\" completed 22 Nov 2022. https://pembertonam.com/en-us/news/pemberton-supports-bridgepoints-acquisition-of-programmatic-media-company-miq/ — Tier 1 (lender's own release). *Contribution:* debt financing via Mid-Market Debt + Strategic Credit; prior early-2021 senior-loan recap for ECI; facility size undisclosed. Accessed 2026-06-20.\n16. ECI Partners, \"ECI announces realisation of MiQ for 6.1x return,\" Sept 2022. https://www.ecipartners.com/news-and-insights/news/2022/eci-announces-sale-exit-of-miq-6x — Tier 1 (investor's own disclosure). *Contribution:* 6.1x return, 2017 minority entry, US >two-thirds of group revenue, ~5-year hold. Accessed 2026-06-20.\n17. ECI Partners, \"ECI completes 7 exits generating average 4.2x return and c.60% IRR in 2022.\" https://www.ecipartners.com/news-and-insights/news/2023/eci-completes-7-exits-generating-average-4-2x-return-and-c-60-irr-in-2022 — Tier 1. *Contribution:* corroborates the MiQ 6.1x within ECI's 2022 exit cohort; 47% IRR via Unquote. Accessed 2026-06-20.\n18. Digiday, \"'Going to become a strategic acquirer of companies': PE-backed MiQ gets on the acquisition trail,\" 17 Nov 2022. https://digiday.com/marketing/going-to-become-a-strategic-acquirer-of-companies-pe-backed-miq-gets-on-the-acquisiton-trail/ — Tier 4/5 trade press. *Contribution:* Hundal's \"strategic acquirer\" mandate; ~$900M valuation on organic growth (Nov 2022); AirGrid acquisition; buy-and-build framing. Accessed 2026-06-20."}, {"order": 8, "file": "08_Geographic_And_MA_Expansion.md", "title": "Geographic and M&A Expansion: MiQ's Regional Roll-Up", "summary": "", "body": "# 08 — Geographic and M&A Expansion: MiQ's Regional Roll-Up\n\n## Bottom Line\n\nMiQ is buying its way to a region-by-region \"largest independent\" claim while the independent-specialist middle gets squeezed between The Trade Desk and Amazon. Four moves define the strategy: **AirGrid** (UK, Nov 2022 — its first-ever deal, cookieless publisher data); **Grasp** (France, Nov 2023 — its first SaaS product, media governance); **Pathlabs** (US, July 2024 — a Media Execution Partner (MEP) that plugs MiQ into the long tail of independent agencies); and the **Adsmovil Latin America business** (signed March 25, 2026 — 150+ staff across 12 LatAm markets, the Adsmovil Personas data platform and the Linki retail-media network, marketed as \"the largest independent programmatic offering in Latin America\"). On top sits the **Titan OS** data partnership (Europe, signed Nov 18, 2025 — operating-system-level intelligence across 20M+ connected TVs, a commercial deal not an acquisition) and an organic APAC/India build-out anchored by a ~413-person Bengaluru Centre of Excellence that actually engineered Sigma. The logic is coherent: each deal adds either a region MiQ lacked (LatAm), a customer segment it could not reach (independent agencies via Pathlabs), or a capability it did not own (governance SaaS, cookieless data, OS-level CTV signal). But \"largest independent in region X\" is a **vendor claim**, not an audited market-share fact, and two risks shadow the program. The first is integration drag: each target runs as a separately-branded \"independent business unit,\" which preserves culture but defers synergy. The second is durability. In LatAm and Europe the differentiating data sits on platforms (Adsmovil Personas, Titan OS) MiQ now owns or licenses, but across CTV much of the signal still belongs to partners who can re-price or re-platform. The roll-up buys position. Whether it buys a moat is the open question.\n\n---\n\n## 1. The Roll-Up Logic: Why MiQ Is Buying\n\n**So what:** MiQ's M&A is not opportunistic. It is a deliberate consolidation play, timed to a moment when the independent-specialist tier is being hollowed out — and each deal answers a specific gap (geography, segment, or capability) rather than chasing scale for its own sake.\n\nThe programmatic market is bifurcating around two gravitational centers. Amazon, riding an integrated retail-plus-ads model, has priced its DSP aggressively — reportedly below 2% in some configurations — against traditional DSP take rates of roughly 12–15%, compressing margins across the middle of the market [12]. The Trade Desk, the largest independent DSP, posted nearly $3 billion in 2025 revenue but disappointed on Q1 guidance and drew fee scrutiny from both Omnicom and Publicis agency audits [12][13]. In that squeeze, sub-scale specialists face a stark choice: get acquired, get niche, or get out.\n\nMiQ's answer is to become the consolidator, not the consolidated. Its model — a managed-service layer of on-the-ground trading and analytics teams atop a DSP-agnostic technology platform (Sigma) — is exactly the kind of business that thrives on regional density and proprietary data. Roll-up acquisitions deliver both. The pattern across the deal history holds:\n\n- **A region MiQ lacked** → Adsmovil (Latin America, including a first true Brazil entry) [3][4].\n- **A customer segment MiQ could not economically reach** → Pathlabs (the long tail of midsize US independent agencies, an estimated $25B+ annual digital-spend pool) [1][2].\n- **A capability MiQ did not own** → AirGrid (cookieless publisher data, 2022) [10], Grasp (media-governance SaaS, 2023 — MiQ's first SaaS product) [11].\n- **A data/inventory edge MiQ rents rather than buys** → Titan OS (OS-level European CTV signal, a partnership not an acquisition) [8][9].\n\nMiQ has made four acquisitions since 2022 (AirGrid, Grasp, Pathlabs, Adsmovil LatAm) plus major data partnerships (Titan OS), each closing a geographic, segment, or capability gap, and explicitly markets the outcomes as creating \"the largest independent\" offering in a given region or segment [1][3][8][10][11]. The strategic coherence is clear from the deal record; the \"largest\" superlative is MiQ's own framing and is not independently audited.\n\n---\n\n## 2. Pathlabs — The Independent-Agency MEP Play (US, July 2024)\n\n**So what:** Pathlabs gave MiQ a side door into the one large US customer pool its enterprise sales motion could not serve profitably — midsize independent agencies — by buying a purpose-built \"agency extension\" instead of trying to sell to them directly.\n\n**The deal.** On July 29, 2024, MiQ announced an agreement to acquire **Pathlabs**, a Media Execution Partner headquartered in Missoula, Montana, founded in 2021, with a roughly 100-person team [1][2]. Terms were not disclosed [1]. Progress Partners advised Pathlabs, and Fenwick provided its legal representation [16][17]. Pathlabs kept its brand and runs as a separately-run \"MiQ company\" / independent business unit [2].\n\n**What an MEP is.** A Media Execution Partner is a white-label, behind-the-scenes operator. It works as an extension of an agency's own team, running paid-media campaigns end-to-end — planning, activation across channels, optimization, and reporting — under the agency's brand, so the agency can offer programmatic, CTV, search, and social execution without building the in-house desk [1][2]. MEP is to agencies what managed service is to brands: the labor and platform expertise are rented, the client relationship stays with the agency.\n\n**The strategic rationale.** MiQ's enterprise managed-service motion is built for large brands and holding companies; selling and servicing one campaign at a time does not pay for the fragmented tier of midsize independent agencies. Pathlabs already had that motion and that book. MiQ framed the opportunity around a US independent-agency segment handling **$25B+ in annual digital ad spend**, a meaningful portion of it outsourced to managed-service providers [1][2]. Pathlabs supplies the channel and the relationships; MiQ supplies agnostic platform access (now Sigma), CTV and analytics depth, and capital. It is a distribution acquisition as much as a capability one.\n\nMiQ cited \"more than $25 billion in digital ad spend handled by independent agencies in the U.S. today,\" a meaningful portion outsourced to managed-service providers, as the addressable opportunity [1][2]. This is MiQ's framing of the market; the figure traces to MiQ's own announcement and is repeated by trade press rather than independently derived.\n\n**Integration status.** As of mid-2026, Pathlabs still operates under its own brand and publishes its own content (e.g., a 2025 independent-agency growth guide) [14] — a sign the unit remains live ~two years post-announcement. The \"independent business unit\" structure preserves Pathlabs' culture and client trust, but it also makes cross-sell into MiQ's stack and margin synergy gradual rather than immediate — a recurring feature of MiQ's roll-up (see Section 7).\n\n---\n\n## 3. Adsmovil Latin America — The Region MiQ Lacked (Signed March 25, 2026)\n\n**So what:** The Adsmovil LatAm deal is the boldest move in the program. It turns LatAm into a managed-service region overnight, hands MiQ a first-party data platform (Adsmovil Personas) and a retail-media network (Linki) the region's holdco desks lack, and gives MiQ a true Brazil entry. It is also where the \"largest independent\" marketing claim runs most aggressive and least independently verified.\n\n**The deal.** On **March 25, 2026** (announced from New York), MiQ signed an agreement to acquire the **Latin America business of Adsmovil**, a mobile-first LatAm digital advertising and data company founded and led by Alberto \"Banano\" Pardo [3][4][6]. The transaction **excludes Adsmovil's US operations**, which continue separately under Pardo, Miami-based [6]. Terms were not disclosed [4].\n\n**Scale and footprint.** The combined entity spans **12 Latin American markets** — Mexico, Brazil, Colombia, Argentina, Chile, Costa Rica, Ecuador, El Salvador, Guatemala, Peru, Puerto Rico, and Uruguay — with **150+ employees** across the region [3][6]. For MiQ this is a genuine **Brazil entry**, the region's largest single ad market [4].\n\n**The assets that matter.** Two platforms come with the deal and are the strategic core:\n- **Adsmovil Personas** — a first-party audience-data platform for segmentation, reportedly giving advertisers access to ~400 million unique IDs across the region post-integration [6].\n- **Linki** — a multi-channel **retail-media** platform described as one of the region's largest and most diverse, combining retail-media networks with TV, video, YouTube, and out-of-home audience solutions [6]. Retail media is the fastest-growing adjacency in this space (taken up later, in the chapter on retail and commerce media); Linki gives MiQ a built LatAm retail-media rail, not a from-scratch build.\n\n**Sigma in LatAm.** MiQ said it will formally **launch Sigma in Latin America in May 2026**, integrating Adsmovil Personas and Linki data into Sigma's signal layer [3][6]. That is the integration mechanism: the acquisition's proprietary data is the payload, Sigma the activation surface.\n\nThe \"largest independent programmatic offering in Latin America\" language is MiQ and Adsmovil's own assertion; PPC Land explicitly notes the companies \"describe\" the combined entity that way and that the claim is presented \"rather than third-party verification\" [3]. Multiple outlets repeat the superlative [4][5][6], but the repetition is of the parties' framing, not of an independent market-share measurement. It is best read as a vendor positioning claim, corroborated as to existence and intent but not as to objective market rank.\n\nMiQ stated Sigma will formally launch in Latin America in May 2026, integrating Adsmovil Personas and Linki data [3][6]. As of mid-2026 this date falls at or just past the announced window; the launch is a MiQ commitment, and its completion and scope as of today are not independently confirmed here.\n\n**Why it matters strategically.** Adsmovil converts LatAm from a market MiQ served thinly, if at all, into a managed-service region with owned data and a retail-media network the global holdco desks have not replicated locally. The on-the-ground teams (150+) are what make \"managed service\" credible across twelve distinct markets. The durability question is sharper here than the marketing suggests: MiQ now *owns* Personas and Linki, unlike its CTV signal partnerships, and that is the stronger moat — but \"largest independent\" in a fast-consolidating region is a label that one competitor acquisition could erase.\n\n---\n\n## 4. Grasp — The First SaaS, Media Governance (France, Nov 2023)\n\n**So what:** Grasp was MiQ's first software product, not a service, and a bet on \"media governance\" — catching campaign-setup errors and compliance failures before launch — pitched as a margin and trust play across MiQ's wider book.\n\n**The deal.** On **November 7, 2023**, MiQ acquired **Grasp**, a French media-governance and data-quality SaaS company, described as a profitable, multi-million-dollar business with **8,000+ users globally** [11]. It was MiQ's **third acquisition** (after AirGrid and one prior) and, per CEO Gurman Hundal, \"the first SaaS platform\" added to MiQ's offering [11]. Terms undisclosed [11]. Grasp continues as an independent business unit, keeping its brand [11].\n\n**What Grasp does.** Grasp's SaaS suite enforces governance frameworks and catches non-compliance and manual setup errors *before* campaigns launch [11]. MiQ cited an industry problem of roughly **$45,000 in overspend per $1 million of media budget** and a claim that \"80% of marketing data is broken or lost\" to manual processes [11]. Named clients included **L'Oréal, PepsiCo, Havas Media Group, and WPP** [11].\n\n**Strategic angle.** Grasp is the efficiency-and-control layer of the roll-up. Where Pathlabs adds distribution and Adsmovil adds region-plus-data, Grasp adds a productized governance capability MiQ can cross-sell and embed — plus a recurring-revenue SaaS line distinct from the managed-service model. Its blue-chip client list (including WPP and Havas, i.e., holdco buyers) also gives MiQ a wedge into governance budgets it had never touched.\n\nThe $45,000/$1M overspend and \"80% broken data\" figures are MiQ's cited industry framing, not independently verified.\n\n---\n\n## 5. AirGrid — The Cookieless Data Foundation (UK, Nov 2022)\n\n**So what:** AirGrid was MiQ's first-ever acquisition, and it set the template: buy a capability MiQ lacked — privacy-first, identifier-free publisher data — to harden the data moat ahead of cookie deprecation, then keep it running as its own unit.\n\nOn **November 3, 2022**, MiQ acquired UK-based **AirGrid**, a privacy-first audience platform that segments publisher audiences using on-device (\"edge\") machine learning without cookies or identifiers, so user data never leaves the device [10]. AirGrid brought first-party data access from five UK publishers across 750+ domains, with MiQ planning to extend it to the US and Canada in H2 2023 [10]. It was MiQ's **first acquisition**, and it set the \"buy the missing capability, run it as a unit\" pattern that Grasp, Pathlabs, and Adsmovil all follow [10].\n\nThe present-tense status of AirGrid as a distinct unit in 2026 is not separately confirmed here.\n\n---\n\n## 6. Titan OS — Europe's CTV Signal, Rented Not Bought (Partnership, Nov 18, 2025)\n\n**So what:** Titan OS is a partnership, not an acquisition, and that distinction is the strategic tell. MiQ secured an exclusive-among-MSPs data edge in European CTV without buying the platform — which buys reach fast but leaves the underlying signal on someone else's balance sheet.\n\n**The deal.** On **November 18, 2025**, MiQ and **Titan OS** — an independent European Connected TV operating system — announced a strategic data/inventory partnership making MiQ \"the only managed service provider with access to Titan OS' operating-system-level intelligence,\" expanding MiQ's European TV data footprint to **20M+ connected TVs** [8][9]. Titan OS captures viewing and behavioral signals across the full TV session, from power-on to power-off, at the OS level [8]. That OS-level intelligence was slated to integrate into **Sigma in Q1 2026** [8][9].\n\n**The corporate-strategy angle.** Elsewhere, in the chapter on TV intelligence and measurement, Titan OS appears for what it adds to *measurement*. The corporate-development read is different: Titan OS is the one major European CTV data edge in MiQ's portfolio that MiQ does **not own**. Set against Adsmovil Personas/Linki (acquired, owned) or AirGrid (acquired, owned), Titan OS is **licensed exclusivity** — strong while the contract holds, and \"only MSP with access\" is a real near-term differentiator, but the durability rests on a renewable commercial agreement rather than equity. Titan OS itself keeps signing parallel deals (Equativ, ShowHeroes retail-media, exclusive UK ad sales for Tubi's AVOD) [8] — proof it is an active, independent counterparty with its own commercial agenda, and exactly why MiQ's edge here is contractual, not structural.\n\nThe acquisition-versus-partnership distinction matters for assessing how durable MiQ's European CTV edge is: on November 18, 2025 MiQ announced a strategic partnership — not an acquisition — with Titan OS, making it the only managed-service provider with OS-level access across 20M+ European connected TVs, integrating into Sigma in Q1 2026 [8][9].\n\n---\n\n## 7. APAC and India — The Organic Build (No Acquisition)\n\n**So what:** Unlike the Americas and Europe, MiQ's Asia presence was grown, not bought — and the most strategically important Asian asset is not a market but the Bengaluru engineering centre that actually built Sigma.\n\nMiQ operates globally from roughly **18 offices** across North America, Europe, and APAC [15]. The APAC leadership picture changed in early 2026: MiQ **parted ways with APAC CEO Jason Scott in February 2026** (reported by Mumbrella and Daily Research News), shifting to **individual local-market leadership** (e.g. ANZ managing director Fiona Roberts) rather than a single Singapore-hub APAC CEO. In India, **MiQ Digital India Private Limited** runs MiQ's **Bengaluru Centre of Excellence**, specializing in engineering, analysis, and data science; headcount is loosely corroborated at **~300+** (one source cites ~413, but third-party sources point to a ~300+ CoE team, so the figure is best treated as approximate) [15]. The CoE is no back office: MiQ states Sigma itself was **built at the Bengaluru CoE** [17].\n\n**Strategic read.** APAC/India is where the roll-up logic *inverts*: instead of buying capability, MiQ concentrates its engineering and data-science capability in India and exports it globally as Sigma. For the M&A thesis this cuts two ways. First, the cost structure behind MiQ's \"platform\" margin story leans materially on the India engineering base. Second, any future APAC market expansion is more likely to resemble the organic Singapore/Bengaluru build than an Adsmovil-style acquisition — no APAC acquisition comparable to Adsmovil or Pathlabs is on the record as of mid-2026.\n\nThe CoE's existence is corroborated by third-party profiles; the \"Sigma built here\" attribution traces to MiQ's own announcements and should be read as company framing.\n\n---\n\n## 8. Integration Risk and the \"Largest Independent\" Label: A Critical Read\n\n**So what:** The roll-up has two structural weaknesses. Synergy is deliberately deferred — every target runs as a standalone brand — and the headline \"largest independent\" claims are marketing labels, not durable competitive facts. An executive evaluating MiQ should discount both.\n\n**Integration drag is designed in.** AirGrid, Grasp, and Pathlabs all run as separately-branded \"independent business units\" [2][10][11]; Adsmovil's LatAm teams integrate via Sigma, yet the targets keep their on-the-ground identity. The choice is defensible — it preserves client trust, founder talent, and local credibility, all critical in a managed-service business — but it means the *synergy* that justifies a roll-up (shared platform, cross-sell, margin pooling) arrives slowly, realized mainly through the **Sigma integration layer** rather than through merged org charts. The mechanism is the same in every deal: pour the target's proprietary data into Sigma (Personas/Linki by May 2026; Titan OS by Q1 2026), then sell the unified surface. If Sigma integration slips, the synergy thesis slips with it. That concentrates execution risk on a single platform — one that itself only launched June 2025.\n\n**\"Largest independent\" is a vendor claim in every instance.** The superlatives — \"largest independent programmatic offering in Latin America,\" \"largest independent programmatic media company\" — originate with MiQ and Adsmovil and are repeated, not verified, by trade press [3][4][5]. PPC Land flags this explicitly [3]. No published, methodologically-disclosed market-share measurement establishes the rank. The label is real as *positioning*, and may well be directionally true given 150+ staff across 12 markets, but a decision-maker should treat it as marketing, not as an audited moat. Two structural fragilities apply:\n\n1. **One competitor move can contest it.** \"Largest independent in region X\" can be erased by a single rival acquisition or one holdco re-entry. The very consolidation dynamic that creates MiQ's opportunity also threatens the durability of any \"largest\" claim.\n2. **\"Independent\" is the load-bearing word.** MiQ is itself majority-owned by **Bridgepoint** (PE) and runs on an exit clock (discussed in the chapter on its commercial model, ownership, and margins). Its \"independence\" is from the holdcos and walled gardens, not from financial-sponsor ownership. The \"largest *independent*\" framing positions MiQ as the alternative to Omnicom/Publicis/WPP desks and to Amazon/TTD/Google — a genuine market position, but one defined more by what MiQ is *not* than by a durable structural advantage.\n\nEach acquired entity runs as a separately-branded independent unit [2][10][11], and the stated integration mechanism in every recent deal is data integration into Sigma (Adsmovil → Sigma LatAm May 2026; Titan OS → Sigma Q1 2026) [3][6][8]. That synergy therefore depends on Sigma execution rather than organizational merger follows directly from the deal structures.\n\n---\n\n## 9. The Deal Ledger (Summary Exhibit)\n\n| Date | Target / Partner | Type | Region | Scale | What it adds |\n|---|---|---|---|---|---|\n| Nov 3, 2022 | AirGrid | Acquisition (1st) | UK | 5 publishers / 750+ domains | Cookieless, edge/on-device publisher data [10] |\n| Nov 7, 2023 | Grasp | Acquisition (3rd) | France | 8,000+ users | First SaaS; media-governance / data-quality [11] |\n| Jul 29, 2024 | Pathlabs | Acquisition | US | ~100 staff | MEP channel into independent agencies ($25B+ TAM) [1][2] |\n| Nov 18, 2025 | Titan OS | Partnership | Europe | 20M+ CTVs | OS-level CTV signal, exclusive-among-MSPs (licensed) [8][9] |\n| Mar 25, 2026 | Adsmovil (LatAm) | Acquisition | LatAm (12 mkts) | 150+ staff | Region entry + Personas data + Linki retail media [3][6] |\n| Organic | MiQ Digital India / Singapore | Build | APAC/India | ~413 (India) | Bengaluru CoE that built Sigma [15][17] |\n\n*Note: an AirGrid-to-Grasp deal-count of \"third acquisition\" implies one acquisition between AirGrid (2022) and Grasp (2023) that does not separately surface in the available record.*\n\n---\n\n## Open Questions\n\n1. **What did MiQ pay?** Every deal (AirGrid, Grasp, Pathlabs, Adsmovil) is \"terms undisclosed.\" Without deal values, the roll-up's capital intensity and the Bridgepoint funding mechanics cannot be quantified.\n2. **What is the \"second\" acquisition?** Grasp is called MiQ's \"third\" acquisition (after AirGrid, its \"first\"); the second target is not identified in the available sources.\n3. **Did Sigma actually launch in LatAm in May 2026, and at what scope?** The May 2026 date falls at or just past the present; up-to-date confirmation is needed.\n4. **Is the \"largest independent in LatAm\" claim survivable?** Has any competitor (holdco desk, regional independent, Amazon/TTD LatAm push) contested or eroded the rank since March 2026?\n5. **Has the Titan OS exclusivity held?** Titan OS is signing many parallel partnerships; is MiQ's \"only MSP with access\" status still accurate as of mid-2026, and on what renewal terms?\n6. **Entity-name discrepancy:** some references cite \"MiQ Digital Commercial Private Limited\"; sources confirm \"MiQ Digital India Private Limited.\" Which is the operative legal entity?\n7. **What is the integration scorecard?** Are Pathlabs, Grasp, and AirGrid demonstrably cross-selling into MiQ's stack, or still operating as ring-fenced units two-plus years on?\n8. **Adsmovil US carve-out:** does the retained Adsmovil US business (under Banano Pardo) create channel conflict or a future re-acquisition path?\n\n---\n\n## Sources\n\n1. MediaPost (Tobi Elkin), \"MiQ Acquires Pathlabs, Firm That Offers Programmatic Capabilities,\" 2024-07-30. https://www.mediapost.com/publications/article/398090/ — Tier 4 (trade/major outlet). Pathlabs deal facts, $25B TAM.\n2. MiQ / BusinessWire, \"MiQ to Acquire Pathlabs, Expanding Programmatic Excellence to Independent Agencies,\" 2024-07-29. https://www.businesswire.com/news/home/20240729060141/en/ — Tier 1 (company release; treat superlatives as claims). Pathlabs MEP model, independent-unit structure.\n3. PPC Land, \"MiQ buys Adsmovil's LatAm arm to dominate independent programmatic,\" 2026 (Mar). https://ppc.land/miq-buys-adsmovils-latam-arm-to-dominate-independent-programmatic/ — Tier 4 (specialist trade). 12 markets named, 400M IDs, \"largest independent\" flagged as vendor claim, Banano Pardo / US carve-out.\n4. MiQ / BusinessWire, \"MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering In Latin America,\" 2026-03-25. https://www.businesswire.com/news/home/20260325615344/en/ — Tier 1 (company release). Deal date, 150+ staff, Personas/Linki, Sigma LatAm, Brazil entry.\n5. Roastbrief US, \"MiQ enters Brazil and becomes the largest independent programmatic media company in Latin America,\" 2026. https://roastbrief.us/miq-enters-brazil-... — Tier 5 (LatAm specialist press). Corroborates Brazil entry, repeats superlative.\n6. MiQ corporate news, \"MiQ Acquires Adsmovil...,\" 2026. https://www.wearemiq.com/resources/news/miq-acquires-adsmovil — Tier 1 (company). 12 markets, Personas, Linki, May 2026 Sigma LatAm.\n8. MiQ / Advanced Television, \"MiQ partners with Titan OS,\" 2025-11-18. https://www.advanced-television.com/2025/11/18/miq-partners-with-titan-os/ — Tier 5 (CTV trade). Partnership (not acquisition), 20M+ CTVs, only-MSP, Q1 2026 Sigma integration.\n9. The Media Leader, \"MiQ boosts media planning capabilities with Titan OS data,\" 2025. https://uk.themedialeader.com/miq-boosts-media-planning-capabilities-with-titan-os-data/ — Tier 5 (UK media trade). Corroborates Titan OS data partnership and scope.\n10. MiQ, \"MiQ Acquires AirGrid, the Privacy-First Audience Platform for Publishers,\" 2022-11-03. https://www.wearemiq.com/resources/news/miq-acquires-airgrid... — Tier 1 (company). First acquisition, edge/cookieless, 5 publishers/750+ domains.\n11. ExchangeWire, \"MiQ Acquires French Media Governance Martech Company Grasp,\" 2023-11-07. https://www.exchangewire.com/blog/2023/11/07/miq-acquires-french-media-governance-martech-company-grasp/ — Tier 5 (adtech trade). Grasp facts, 8,000 users, L'Oréal/PepsiCo/Havas/WPP, \"first SaaS,\" \"third acquisition,\" $45K/$1M overspend (MiQ framing).\n12. PPC Land, \"Margin wars reshape programmatic as Amazon undercuts The Trade Desk,\" 2025. https://ppc.land/margin-wars-reshape-programmatic-as-amazon-undercuts-the-trade-desk/ — Tier 4 (specialist trade). Market-structure context: Amazon <2% vs 12–15% DSP take rates.\n13. AdExchanger, \"Omnicom Allegedly Pivoted A Chunk Of Its Q3 Spend From The Trade Desk To Amazon,\" 2025. https://www.adexchanger.com/platforms/omnicom-allegedly-pivoted... — Tier 5 (adtech trade). TTD scrutiny / holdco audits context.\n14. Pathlabs, \"Independent Agencies, Infinite Potential: Your 2025 Media Execution Guide,\" 2025. https://www.pathlabs.com/content/2025-independent-agency-growth — Tier 6/1 (company content). Evidence Pathlabs operates as a live brand in 2025.\n15. Marketing-Interactive / EMIS / company profiles, \"MiQ Singapore SEA office; MiQ Digital India,\" 2023–2025. https://www.marketing-interactive.com/miq-opens-new-sea-head-office-in-singapore — Tier 4/5. APAC structure (Jason Scott, Singapore), India ~413 staff, Bengaluru CoE, ~18 offices.\n16. Progress Partners, \"Progress Partners advises Pathlabs on its acquisition by MiQ,\" 2024. https://progresspartners.com/transactions/... — Tier 5 (advisor). Confirms advisor role, deal.\n17. The Tribune / BusinessWire, \"Introducing MiQ Sigma: Built at MiQ's Bengaluru Centre of Excellence,\" 2025-06-04. https://www.tribuneindia.com/news/business/introducing-miq-sigma... — Tier 4/1. Sigma built at Bengaluru CoE; 700T signals; June 2025 launch.\n\n*Source-tier note: company releases (Tier 1) are authoritative for what MiQ claims and the existence/terms of deals, but every \"largest independent\" superlative is treated as a vendor positioning claim, not an audited market fact, per the source hierarchy's press-release caution.*"}, {"order": 9, "file": "09_Regulatory_Privacy_And_Data_Moat.md", "title": "Regulatory, Privacy, and the Durability of MiQ's Data Moat", "summary": "", "body": "# Regulatory, Privacy, and the Durability of MiQ's Data Moat\n\n## Bottom Line\n\n**MiQ's privacy-regulatory exposure is, paradoxically, lower than it was three years ago — and its real risk is not the regulator but its own suppliers.** The single most consequential event for an independent like MiQ in this period disconfirmed the whole premise. On 17 October 2025 Google formally retired most of its Privacy Sandbox APIs and released itself from UK Competition and Markets Authority oversight — the culmination of a reversal that began in July 2024, when it abandoned third-party-cookie deprecation in Chrome entirely (the third-party cookie = the cross-site tracking identifier browsers had spent six years preparing to kill). The cookie apocalypse MiQ built a \"Cookieless Toolkit\" against never arrived on schedule, which buys its existing signal supply more life. But the underlying signal-loss trend is real, and it continues through other doors: Apple's IDFA (its mobile ad identifier), Safari/Firefox blocking, a 20-plus-state US privacy patchwork as of 2026, an upheld EU GDPR ruling against the IAB's consent framework (May 2025), and a \"mini-resurgence\" of US Video Privacy Protection Act litigation that specifically constrains the CTV/ACR data MiQ resells.\n\n**The verdict the reader needs: MiQ's \"data moat\" is better described as an aggregation-and-orchestration moat, and that distinction is the whole risk.** The \"700 trillion signals\" headline counts signals MiQ *touches*, not signals MiQ *owns*. The ACR (automatic content recognition) panel comes from Samba TV under a commercial agreement; the European OS-level TV data comes from Titan OS (deal signed November 2025); the cross-device identity graph is licensed from Experian; the durable IDs it activates on (UID2, RampID) are governed by The Trade Desk and LiveRamp; the CTV inventory rides DSPs MiQ does not own. MiQ's defensible asset is the **Identity Spine** — the stitching layer that fuses 60-plus cookieless feeds and 25 ID solutions into addressable cohorts — plus the trader relationships, the cross-channel measurement, and Sigma's AI orchestration. That layer is real and hard to replicate at MiQ's scale. But it sits on rented land. The strategic question through 2029 is whether MiQ's orchestration value compounds faster than its largest suppliers (Samba, Experian, the DSPs) and largest channels (the walled gardens, retail-media networks) can raise rents or disintermediate the middle. **Concentration risk is the sharpest version of this: a handful of partners supply a disproportionate share of the signal, and several are positioned to become competitors.**\n\n---\n\n## 1. The Regulatory Backdrop Reversed: Cookie Deprecation Did Not Happen On Schedule\n\n**So what:** The defining privacy event of MiQ's planning horizon was a *non-event* — cookie deprecation that never came. An independent that had sold \"cookieless\" readiness as its differentiator now competes in a market where the deadline justifying that readiness evaporated. Good for near-term signal supply; ambiguous for the differentiation story.\n\n### 1.1 The six-year build-up and the 2024–2025 collapse\n\nIn January 2020, under the \"Privacy Sandbox\" banner, Google announced it would phase out third-party cookies in Chrome, backed by a suite of replacement APIs (Topics, Protected Audience/PAAPI, Attribution Reporting) meant to deliver interest-based advertising without cross-site identifiers [1]. The industry spent roughly six years preparing. Then the trajectory reversed in stages:\n\n- **July 2024:** Google dropped its plan to deprecate third-party cookies outright, proposing instead a user-choice prompt in Chrome [2][8].\n- **April 2025:** Google abandoned even the standalone choice prompt, stating it would \"maintain our current approach to offering users third-party cookie choice in Chrome\" via existing settings — meaning third-party cookies remain on by default [2][8].\n- **17 October 2025:** Google formally retired most Privacy Sandbox APIs — Topics, Protected Audience, Attribution Reporting (Chrome and Android), Private Aggregation, IP Protection, On-Device Personalization, Protected App Signals, Related Website Sets, SelectURL, SDK Runtime — and the UK's Competition and Markets Authority released Google from the Privacy Sandbox commitments it had accepted in 2022 [3][4]. Google cited low adoption and ecosystem feedback [4].\n\nAs of this writing (June 2026), **third-party cookies remain active in Chrome with no announced removal timeline** [3][4]. An IAB study cited in trade coverage reported that 88% of digital-advertising professionals experienced \"major confusion\" over Google's shifting stance [2] — read that as evidence of industry sentiment, not a precise measurement.\n\n### 1.2 Why this is good news, then a problem, for MiQ\n\nThe immediate effect is supportive. Chrome is roughly two-thirds of the global browser market, and a large share of MiQ's activatable audience signal flows through cookie-based identifiers that, on the 2024 timeline, were supposed to be gone. They are not gone. MiQ's own disclosure that \"more than half of its US campaign activations are non-cookie reliant\" [9] cuts both ways: it is a genuine readiness claim, and it admits that *up to half still depend on the identifiers Google just spared.*\n\nThe deeper problem is strategic positioning. MiQ marketed cookieless readiness — CookielessIQ (launched July 2022) [10], the Cookieless Toolkit, the Identity Spine — partly as a reason to pick an independent that had \"done the work.\" When the deadline vanished, that differentiation softened. The honest framing for 2026–2029: signal loss is a *gradual erosion*, not a *cliff*, and erosion rewards incumbents with diversified supply over specialists betting on a single discontinuity. MiQ sits on the right side of that line. But the urgency that made \"cookieless\" a sales hook is muted.\n\n> **A status that goes stale fast.** Privacy Sandbox is the textbook example of a fact with a short shelf life. The picture here is current as of 17 October 2025 (retirement) and June 2026 (cookies still present). Any claim that \"Google is deprecating cookies\" or \"Privacy Sandbox is the future\" is, as of mid-2026, *false* — and that reversal is itself recent enough to reverse again.\n\n---\n\n## 2. Privacy-Regime Fragmentation: The Patchwork Is the Risk, Not Any Single Law\n\n**So what:** No single privacy law threatens MiQ's existence. The cumulative compliance drag of an incoherent global patchwork — 20-plus US state laws, GDPR/ePrivacy in Europe, divergent regimes across MiQ's six-continent footprint — is a structural cost, and a moat *for* the large players who can absorb it. MiQ is large enough to absorb it. Many of its independent competitors are not. That is quietly pro-MiQ.\n\n### 2.1 The United States: a 20-plus-state patchwork, no federal floor\n\nAs of 2026 there is still **no comprehensive US federal privacy law.** Instead, comprehensive consumer-privacy statutes have been enacted in roughly 20 states beyond the early movers, with eight becoming effective in 2025 (Delaware, Iowa, Maryland, Minnesota, Nebraska, New Hampshire, New Jersey, Tennessee) and three more on 1 January 2026 (Indiana, Kentucky, Rhode Island) [5]. California's updated CCPA regulations (CCPA = California Consumer Privacy Act, the state law that lets residents opt out of the \"sale\" and \"sharing\" of their data) took effect 1 January 2026, adding mandatory privacy risk assessments for high-risk processing [5].\n\nFor an ad-tech intermediary, three features matter: (a) universal opt-out signals (Global Privacy Control) that buyers must honor; (b) \"sale/share\" definitions broad enough to capture programmatic data flows; and (c) sensitive-data and minors' rules that vary by state. The compliance burden is *per-state configuration*, not a single switch — precisely the kind of cost that favors scale. MiQ's ~1,900-person, multi-region operation can staff legal and engineering against it; a 50-person independent trading desk struggles.\n\nFederal enforcement adds a second layer. In January 2024 the FTC brought actions against data brokers Mobilewalla and Gravy Analytics over precise-location data collected without consent [11]; in early 2025 the DOJ finalized a rule restricting cross-border bulk transfer of sensitive personal data, reaching even anonymized or pseudonymized data [11]. Neither targets MiQ directly, but both tighten the rules of the road for the location and identity data that flows through programmatic.\n\n### 2.2 Europe: GDPR, ePrivacy, and the consent-framework ruling\n\nIn Europe the binding constraints are the GDPR (the EU's General Data Protection Regulation, the comprehensive privacy law requiring a lawful basis — usually consent — to process personal data) and the ePrivacy regime governing cookies and device access.\n\nThe most directly relevant 2025 development for programmatic: on **14 May 2025 the Brussels Market Court upheld** (while procedurally annulling and replacing) the Belgian DPA's findings that the IAB Europe **Transparency & Consent Framework** (TCF) breached the GDPR — confirming that the **TC String** (the code encoding a user's consent choices in real-time bidding) is *personal data*, that IAB Europe is a *joint controller* for its own processing of those strings, and reimposing a €250,000 fine [6]. IAB Europe released TCF v2.3 in April 2025, with a compliance deadline of 28 February 2026 for participants [6].\n\nThis matters to MiQ because the TCF is the consent plumbing that legitimizes most European real-time bidding. The ruling does not end RTB. But it confirms that the consent infrastructure the whole open-programmatic market relies on is legally contested — and that scholarly and regulatory critics consider RTB *prima facie* difficult to reconcile with GDPR consent and transparency requirements [12]. The UK ICO has issued repeated guidance flagging profiling, data-combining, and \"invisible processing\" in RTB as high-risk [12].\n\n### 2.3 The fragmentation verdict\n\nAcross MiQ's footprint (UK, EU, US, Canada, LATAM via Adsmovil, APAC/India), the net effect is not a single existential threat but a rising, irreducible compliance cost — a moat that favors scale. So the risk to MiQ is *less regulatory and more competitive*: regulation that big walled gardens and large independents can absorb, but small independents cannot, accelerates consolidation — a market dynamic taken up in the chapter on market structure and competition. For MiQ specifically, fragmentation is closer to tailwind than threat, provided it stays on the right side of the scale line.\n\n---\n\n## 3. The CTV Signal Environment: Rich But Identity-Fragmented, and Newly Litigated\n\n**So what:** Connected TV (CTV = streaming/internet-delivered television) is where MiQ has concentrated its differentiation — the most signal-*rich* and most identity-*fragmented* environment in advertising. There are no cookies on a TV. Identity gets reconstructed from device graphs, ACR, IP-plus-geo, and clean rooms — and a 1988 video-privacy statute has come back to constrain exactly the data MiQ depends on.\n\n### 3.1 No cookies, so identity is rebuilt from other signals\n\nWith no third-party cookie, the open CTV ecosystem reconstructs household and person identity from automatic content recognition (ACR = software in smart TVs that identifies what is on screen frame-by-frame), set-top-box logs, IP address plus geo, device graphs from onboarders (Experian, LiveRamp), and publisher-side authenticated IDs. AdExchanger puts it bluntly: CTV data is \"massively fragmented,\" stitched back together through identity graphs, clean rooms, and onboarders [13][7]. ID5's 2025 State of Digital Identity report found 67% of respondents using alternative IDs, 51% using clean rooms, and identity graphs gaining ground, with 84% testing or using cross-device approaches [7]. The fragmentation, in other words, is being solved by *rented* stitching layers — the heart of the moat question (Section 5).\n\n### 3.2 The VPPA: a 1988 law reshaping CTV data flows\n\nThe single most underappreciated CTV-specific regulatory risk is the **Video Privacy Protection Act (VPPA)** — a 1988 US statute, passed after a judge's video-rental history was leaked, that bars video providers from disclosing viewership tied to personally identifiable information without consent [14]. It has seen a \"mini-resurgence\" of litigation: Hulu (2015), VIZIO (2018 settlement), and HBO (2022 class action over sharing identifiable viewing history with Facebook) [14].\n\nFor MiQ's world, the operational consequence is specific and severe: publishers **cannot place both a user identifier and show-level content in the same programmatic bid request** [14]. As NBCUniversal's Ryan McConville puts it, \"you just can't have identity data next to show-level data\" [14]. The law forces a choice — aggregate reporting (show performance, no IDs) or granular device-level data (impressions, no content) — and pushes the entire CTV measurement market toward ACR cohorts and clean rooms rather than deterministic person-to-show matching [14]. MiQ's TV Intelligence and ACR-based measurement are *built on this constraint*, which is a competence. But the same constraint caps how granular and how deterministic that measurement can legally become, and the litigation exposure sits primarily with MiQ's data suppliers (Samba TV, publishers) rather than with MiQ.\n\n### 3.3 The mobile parallel: IDFA and signal loss outside the browser\n\nOn mobile, Apple's App Tracking Transparency (2021) made the IDFA (Identifier for Advertisers, Apple's per-device mobile ad ID) opt-in, collapsing its availability — a signal loss that has already happened and is not reversing. CTV apps on Apple platforms, and the broader mobile-to-CTV identity bridge, inherit the constraint. Unlike the cookie reprieve, the IDFA contraction is durable. It is one reason the \"signal loss is gradual but real\" framing holds even with cookies spared.\n\n---\n\n## 4. MiQ's Response: The Identity Spine, Experian, Clean Rooms, and First-Party Activation\n\n**So what:** MiQ's privacy-resilience strategy is a portfolio, not a bet — a multi-ID stitching layer (Identity Spine), a licensed cross-device graph (Experian), clean-room activation of advertiser first-party data, and contextual/authenticated fallbacks. The portfolio is genuinely sophisticated. The question Section 5 forces is simpler: what inside it does MiQ actually own?\n\n### 4.1 The Identity Spine\n\nMiQ's central privacy-resilience asset is the **Identity Spine**: a multi-ID audience graph that connects 60-plus cookieless data feeds and 25 ID solutions, fused with first-party data, into privacy-compliant addressable cohorts [9][15]. MiQ states this lets more than half of US activations run cookie-free without sacrificing results [9]. The Spine is the orchestration layer — the thing that decides, per impression, which identifier to resolve against: HEM, UID2, partner cookie, contextual signal.\n\n### 4.2 The Experian Digital Graph integration\n\nIn May 2025 MiQ integrated **Experian's Digital Graph** into the Identity Spine, licensing hashed emails (HEM = a hashed/anonymized email used as a privacy-safer identifier), UID2s, and third-party partner cookies [16]. Reported uplifts: **+64% reach** using universal IDs, **+51% seed-audience reach**, a **70% match rate** associating IP addresses with universal IDs, and **6.5 devices** added per matched IP [16]. MiQ's Georgiana Haig: \"Experian's Graph has bolstered our already comprehensive, multi-ID Identity Spine with incredible data on cross-device ownership and cross-channel behavior\" [16].\n\nRead carefully, this is the moat thesis in one sentence. The +64% lift came from **licensing another company's graph.** The capability is real; the *ownership* sits with Experian. That is the disintermediation question, made concrete (Section 5).\n\n### 4.3 Clean rooms and first-party-data activation\n\nMiQ activates advertiser first-party data (first-party data = data a company collects directly from its own customers) in **clean rooms** (a clean room = a privacy-safe environment where two parties match data without either exposing raw user records) [9]. Experian's identity resolution runs inside AWS Clean Rooms, the infrastructure layer MiQ and its clients use to match without exposing raw records [17]. Clean rooms are the privacy-compliant venue for the first-party-data activation the whole industry is pivoting toward as third-party signal erodes. And again, MiQ is an *operator within* the infrastructure (AWS, Experian, advertiser-owned data), not its owner.\n\n### 4.4 The \"700 trillion signals\" framing, decoded\n\nMiQ's Sigma platform (launched June 2025) is marketed as transforming **700 trillion consumer signals** across 300-plus data feeds — what people watch on TV, browse on the web, and buy in stores — into media decisions [a][b]. The number is a *scale-of-throughput* claim, not an ownership claim. Decoded honestly: MiQ ingests, fuses, and acts on 700T signals; it originates a small fraction of them. The TV signals come from Samba, Titan OS, and currencies; the purchase signals from Numerator, Circana, NielsenIQ; the web signals from cookie/ID partners and Experian. Read the 700T figure as evidence of MiQ's *aggregation reach* — which is the asset — not as a proprietary data lake.\n\n---\n\n## 5. The Central Question: How Durable Is a Moat Built on Rented Signal?\n\n**So what — the verdict the reader came for:** MiQ's advantage is an **aggregation-and-orchestration layer**, not an owned-data asset. That layer is genuinely defensible at MiQ's scale and integration depth, but two threats sit structurally beneath it: *suppliers raising rents*, and *suppliers or channels disintermediating the middle*. The honest 2029 read is \"durable but rented\" — strong enough to compound for several years, not strong enough to be a true data monopoly.\n\n### 5.1 Inventory the signal: almost none of it is owned\n\nWalk the stack MiQ markets and ask \"who owns the underlying signal?\":\n\n| Signal layer | What it is | Who owns/controls it | MiQ's role |\n|---|---|---|---|\n| ACR TV panel | Frame-level smart-TV viewing, ~90M TV sets, 6T+ signals/mo [18] | **Samba TV** (commercial agreement, Jan 2023) [19] | Licenses, fuses, activates |\n| European OS-level TV | Viewing/behavioral signals from Titan OS smart TVs, 20M+ CTVs [20] | **Titan OS** (deal Nov 2025; Sigma integration Q1 2026) [20] | \"Only managed-service provider with access\" [20] — but access, not ownership |\n| Cross-device identity graph | HEM/UID2/cookie graph, +64% reach lift [16] | **Experian** (licensed May 2025) [16] | Integrates into Identity Spine |\n| Durable IDs | UID2, RampID, EUID, ID5 [21] | **The Trade Desk, LiveRamp, ID5** [21] | Resolves against; does not govern |\n| Purchase/commerce data | CPG and retail purchase signals | **Numerator, Circana, NielsenIQ** [a] | Licenses |\n| CTV inventory & bidding | The actual ad opportunities | **DSPs (TTD, DV360, Amazon), publishers** | Buys through; \"DSP-agnostic\" |\n| Clean-room infrastructure | Match environment | **AWS, Snowflake; advertiser first-party data** | Operates within |\n| **Identity Spine + Sigma** | **The stitching, decisioning, measurement, trader expertise** | **MiQ** | **Owns** |\n\nThe pattern is unambiguous. The bottom row is the moat. Everything above it is rented, licensed, or accessed. MiQ's defensible asset is the *orchestration* — the Identity Spine's per-impression resolution logic, the cross-channel measurement, Sigma's AI, the human trading relationships — not the signal itself.\n\n### 5.2 Concentration risk: a few partners, several also rivals\n\nThe rented-signal model would be tolerable if supply were diffuse. It is concentrated, and several suppliers are positioned to become competitors:\n\n- **Samba TV** is, on current evidence, the backbone of MiQ's US ACR footprint [18][19]. A single multi-year commercial agreement (signed January 2023; renewal/termination status not independently confirmable as of June 2026) sits under a large share of MiQ's headline TV-intelligence scale. Samba also sells its data and measurement to others — MiQ's competitors among them — and could in principle build or partner around MiQ's activation layer.\n- **Experian** owns the graph driving MiQ's cookieless reach gains [16] and offers identity resolution directly to brands and inside AWS Clean Rooms [17]. In short, Experian can reach MiQ's customers without MiQ.\n- **The Trade Desk / LiveRamp** govern the durable IDs (UID2, RampID) MiQ activates on [21]. TTD is at once MiQ's largest activation channel *and* its largest competitor, controlling both the identifier standard and the DSP. This is the sharpest single dependency: the platform MiQ rides is also the platform best able to disintermediate it, via self-serve and its own managed offerings.\n- **Titan OS** owns the European OS-level signal; MiQ's exclusivity (\"only managed-service provider with access\") is a contractual arrangement dated November 2025, not an owned asset [20]. Contractual exclusivity can be renegotiated, widened to others, or ended.\n\nThe concentration verdict: MiQ's most important inputs come from a short list of partners, and the three most important — Samba, Experian, TTD/LiveRamp — each have a plausible path to raising MiQ's costs or competing with it directly.\n\n### 5.3 The disintermediation scenario: the strongest bear case, and the rebuttal\n\n**The bear case:** MiQ is a middleware aggregator in a market where the layers above and below it are integrating. The DSPs (TTD, Amazon) are building identity and measurement; the data owners (Experian, Samba) are building activation and clean-room access; the walled gardens and retail-media networks keep their richest signal inside their own walls entirely. Aggregation layers get squeezed when their suppliers and channels integrate around them. If UID2/RampID become universal, the Identity Spine's stitching value commoditizes; if Experian and Samba sell activation directly, MiQ's resale margin compresses.\n\n**The bull rebuttal:** Aggregation is *itself* the scarce competence in a fragmented market. No single supplier covers TV plus web plus commerce plus identity across six continents; MiQ's value is precisely that it fuses sources no one owner can. Disintermediation would require a supplier to replicate not one feed but the whole multi-source, cross-channel, DSP-agnostic, measured stack — plus the sticky, human, managed-service trader relationships. Suppliers are specialists by design: Samba does ACR, Experian does identity. Becoming a full media partner means abandoning the neutrality that makes them sellable to everyone. As sources multiply, the Identity Spine's value rises rather than falls — more rented feeds make the *stitcher* more valuable, not less.\n\n**The synthesized verdict:** Both are partly right, and which dominates turns on *how much of the decisioning and measurement MiQ owns* by 2029 versus how much stays pure pass-through. The more Sigma's AI, the incrementality measurement, and the trader workflow become the product — and the less MiQ resells someone else's graph — the more durable the moat. MiQ's bet (Sigma as an owned AI orchestration platform, not a managed reseller) is exactly the right one for moat durability; whether it executes is the open question. \"An aggregation/orchestration moat on rented land\" is the accurate frame: real, defensible for now, and permanently one supplier renegotiation — or one DSP self-serve push — away from compression.\n\n---\n\n## 6. Risk-Rated Summary Through 2029\n\n| Risk | Direction (as of Jun 2026) | Severity to MiQ | Note |\n|---|---|---|---|\n| Third-party cookie deprecation | **Reversed/paused** | Low near-term | Sandbox retired Oct 2025; cookies persist; erosion continues elsewhere |\n| US state-law patchwork | Worsening (20+ states) | Low-moderate | Compliance cost; favors scale → net mild tailwind |\n| GDPR/TCF enforcement on RTB | Active (May 2025 ruling upheld) | Moderate | Threatens open-RTB consent plumbing MiQ rides in EU |\n| VPPA / CTV litigation | Resurgent | Moderate | Caps deterministic CTV data; exposure mostly on suppliers |\n| IDFA / mobile signal loss | Durable, alr
