eatures, not afterthoughts [5][6]; and — notably — **MiQ was not named in Adalytics' January 2024 \"made-for-arbitrage\" report**, while The Trade Desk and Walmart DSP were the two DSPs that \"did not appear to have any ads served on\" MFA sites [7]. On the liability side: MiQ **does not publish a take rate or a blended fee** (as discussed in the chapter on its commercial model and margins), **does not appear to offer routine client-facing log-level data** as a standing product, MFA-blocking quality varies by the *underlying DSP* MiQ routes through (and DV360 — one of MiQ's rails — was the single largest MFA-transacting DSP in the Adalytics data [7]), and MiQ's certifications are *fraud/brand-safety* accreditations, **not** a supply-path or take-rate transparency standard, which does not yet exist as a thing to be certified against. Net: MiQ's neutrality is defensible *today*, because it has chosen to layer curation and exclusion on top of agnosticism. But the moment the market formalizes a supply-path-transparency or working-media standard (the ANA/4A's/IAB direction of travel through 2029), the extra managed-service layer becomes a place transparency can hide, and \"trust our craft\" stops being a sufficient answer.\n\n---\n\n## 1. Why This Debate Exists: The ANA Study and What It Found\n\n**Answer first:** in December 2023 the Association of National Advertisers (ANA), the largest US advertiser trade body, published the most consequential transparency audit the open programmatic market had ever seen. It landed like an indictment. It is the document that turned \"where did my money go\" from a trade-desk question into a CMO- and board-level one.\n\nThe headline numbers, from the ANA's *Programmatic Media Supply Chain Transparency Study* (December 2023), built on log-level data covering **$123 million in ad spend and ~35.5 billion impressions** from 21 participating member brands, collected September 2022–January 2023 [8][9]:\n\n- **MFA sites took ~15% of ad spend and ~21% of impressions** in the studied campaigns [8][9].\n- The average programmatic campaign ran across **~44,000 websites** — a \"long tail\" the ANA argued no advertiser could meaningfully vet [9].\n- Only about **36 cents of every programmatic dollar** reached a viewable impression of the intended audience; the ANA argued best practices could lift this toward **50 cents or more** and unlock as much as **$20 billion in industry efficiency** [9][10].\n- Of 67 member companies that originally volunteered, only **21 ultimately participated** — because many could not obtain the log-level data from their own agencies and ad-tech vendors, a finding the ANA treated as itself damning [8][11].\n\nThe headline figures are firm — they come from the ANA study itself and are reported consistently across trade coverage [8][9][10]. The \"36 cents / 50 cents\" working-media framing is softer: it is the ANA's own methodology and contested at the margins, so it is best read as the ANA's measure rather than a settled industry constant.\n\nThe ANA paired this with a **quarterly benchmarking program with TAG TrustNet/Fiducia**. The first benchmark (June 2024) reported MFA spend across 11 analyzed brands had fallen from **15% to ~4%**, and the average campaign's site count had dropped from ~44,000 to **~23,000** — though it noted enormous variance (some advertisers on 500 sites, others on 3,000) and that competing DoubleVerify data showed MFA *impressions* still rising ~19% year-over-year in 2023 [10][12]. The improvement is real but partial, and the disagreement between trackers previews the definitional fight in Section 4.\n\nThis is the debate that gets gestured past when \"SPO and curation\" are treated as abstract market forces. SPO and curation are the *remedy* the industry reached for **because** of the ANA finding. Any assessment of MiQ's neutrality has to be read against that backdrop. The market MiQ buys in was publicly told it was wasting roughly two-thirds of every open-web programmatic dollar.\n\n---\n\n## 2. The Exposés: Adalytics, Forbes, and the \"Where Did It Actually Run\" Problem\n\n**Answer first:** the ANA study supplied the macro number. A series of forensic exposés — chiefly by the researcher **Adalytics** and the supply-chain analyst **Jounce Media** — supplied the named-and-shamed cases that kept the issue at board level through 2024–2025. They reframed the question from \"how much waste in aggregate\" to \"is my specific brand's ad running on a site I'd be embarrassed by.\"\n\n**The Forbes `www3` case (May 2024).** Adalytics alleged that Forbes had for years operated a hidden subdomain, **`www3.forbes.com`**, that repackaged Forbes articles into ad-stuffed listicles and slideshows carrying *far* more ad slots than the main site. Adalytics described article pages with roughly **150 ad slots versus seven or eight** on the main domain, ~70% of traffic bought from Outbrain/Taboola content-recommendation widgets, and the subdomain hidden from search and the public site [13][14]. Advertisers believed they were buying premium \"Forbes.com\" inventory. Forbes shut the subdomain down after Wall Street Journal inquiries, and several agencies paused Forbes spend [13][15]. The lesson buyers drew: a *trusted, premium* domain name on a media plan is not proof of where the impression actually rendered — exactly the assurance a managed-service buyer is paid to provide.\n\n**The January 2024 \"Made for Arbitrage\" report (March 2024).** Adalytics observed ANA-member ads continuing to run on MFA/arbitrage sites *after* the crackdown pledges, and named the supply chain in detail [7][16]:\n\n- **DSPs:** Google **DV360** transacted the highest MFA volume (ads from 7,272 brands observed), **Amazon DSP** (2,601 brands, including Hershey's, Disney, Clorox), plus Beeswax, Yahoo DSP, Xandr, Quantcast, StackAdapt and others [7].\n- **Notably, The Trade Desk and Walmart DSP \"did not appear to have any ads served on Made for Advertising sites\"** — Adalytics read this as evidence that effective DSP-level filtering *is possible* [7].\n- **SSPs:** Magnite, PubMatic, TripleLift, Index Exchange, OpenX, Sovrn, Sharethrough, Google Ad Manager, Xandr, Criteo and 30+ others were observed carrying MFA inventory [7].\n- **Verification firms** — DoubleVerify, IAS, Oracle Moat, Pixalate, HUMAN — were observed *collecting data on* MFA placements they claimed to help prevent [7].\n- **16 of 17** disclosed ANA-study participants still had ads on MFA sites in January 2024; ~80% of SSPs presenting at an ANA March 2024 event were still serving MFA inventory [7][16].\n\n**MiQ was not named in the Adalytics January 2024 report** [7]. This is a genuine, citable point in MiQ's favor, but it should be stated with care. Adalytics observes ads in the wild and attributes them to the *DSPs and SSPs* whose tags rendered them. A managed-service buyer like MiQ that activates *through* DV360 or Amazon DSP would, in many cases, be attributed at the DSP layer, not by name. MiQ's absence is consistent with effective MFA hygiene. It is *not* dispositive proof of it, because the methodology does not reliably surface the managed-service intermediary behind a DV360 impression.\n\nThat Adalytics published these named findings, and that MiQ was not among the named entities, is well established [7][13][14][16]. The *inference* that MiQ's absence proves clean supply is much weaker — it is an attribution-methodology caveat, not a finding.\n\nThe crucial structural point for MiQ: the single largest MFA-transacting DSP in the data, **DV360, is one of the rails MiQ resells.** A neutral, multi-DSP desk inherits the supply-quality posture of whichever DSP it routes through. MiQ's defense can only be that it layers its *own* exclusion and curation on top — precisely what the OpenX case study (Section 5) is built to demonstrate.\n\n---\n\n## 3. The Two Transparency Demands: Log-Level Data and Take-Rate Disclosure\n\nThe ANA study did two things at once. It exposed *MFA waste* (Sections 1–2). And it exposed a deeper *information-asymmetry* problem: advertisers could not get the raw data to audit their own spend. That second problem splits into the two demands MiQ is specifically exposed on.\n\n### 3.1 Log-level data access\n\n**The norm advertisers now assert:** the buyer is entitled to the impression-by-impression log of where its ads ran and what was paid at each hop. The ANA's headline embarrassment was that only 21 of 67 volunteers could even obtain this data from their agencies and vendors [8][11]. The UK parallel — **ISBA and PwC's** *Programmatic Supply Chain Transparency Study* — made the same point quantitatively. The 2020 study found an **\"unknown delta\" of ~15%** of advertiser spend that *could not be attributed to anyone* in the chain, and that only ~half the advertiser dollar reached publishers [17][18]. The 2022 follow-up (published January 2023) reported real progress: the unknown delta fell to **~3%** and impression match rates rose to ~58% from ~12%. But PwC noted it sometimes took five attempts to extract usable log-level data from a single vendor, and without that persistence the unattributable figure \"would still have been in double figures\" [18][19].\n\n**MiQ's exposure:** MiQ's public materials emphasize *dashboard-level* transparency — its Intelligence Hub shows \"impressions and view-through rate by the exact app and content genre served\" [5][6]. That is genuine app-level reporting, and better than a black box. But it is **not the same as standing, raw, client-owned log-level data** with full fee decomposition at every hop. There is no evidence that MiQ routinely hands clients raw LLD as a default product. As an *extra* managed-service layer sitting above the DSPs, MiQ is one more place where the log can be summarized rather than surfaced — exactly the structural position the ANA study taught advertisers to interrogate.\n\nThe ANA/ISBA findings are firm [8][17][18]. The read on MiQ's LLD posture is softer: it rests on the *absence* of any disclosed standing-LLD product in MiQ's public materials — an absence-of-evidence inference, not a documented refusal.\n\n### 3.2 Take-rate disclosure\n\n**The pressure:** the same logic that demands LLD demands fee clarity — what cut did each layer take? The Trade Desk discloses a platform take rate of roughly 21.6% on 2025 gross spend. The independent-DSP model is increasingly judged on whether its take is legible.\n\n**MiQ's exposure:** **MiQ does not publish its take rate or blended fee.** It describes two fee models (a fixed fee on top of media, and a performance/CPM model) and has explicitly rebutted the suggestion that it secretly marks up media, insisting clients see the media cost and pay a transparent fee on top. That is a *claim of* transparency, not a *published* take rate. The exposure is straightforward. A desk that buys across seven DSPs and 2,000+ PMPs adds a fee layer above the DSP's own fee layer, and in a market trained by the ANA/ISBA studies to ask \"how much reached working media,\" an undisclosed blended take is a soft target. MiQ's posture is \"transparent-on-request to the client,\" not \"publicly disclosed\" — defensible in a managed-service B2B relationship, but a liability if a working-media or take-rate standard formalizes through 2029.\n\n---\n\n## 4. The MFA-Definition Fight: Why the Whole Debate Sits on Sand\n\n**Answer first:** there is still **no industry-agreed definition of MFA.** This is not a footnote. It is the load-bearing weakness in *everyone's* MFA claims, MiQ's included, because \"we exclude MFA\" means nothing precise without an agreed definition of what MFA is.\n\nThe state of play through 2024–2026 [20][21][22]:\n\n- **The 4A's** (American Association of Advertising Agencies) convened monthly working-group meetings from summer 2023, bringing together the **ANA, IAB Tech Lab, Brand Safety Institute, Publisher Council, agency holdcos, Jounce Media, and DeepSee.io** — but, tellingly, **without the major DSPs, SSPs, or verification vendors at the table** [22].\n- The working group has pushed to *narrow* the term from \"made-for-advertising\" (which risks sweeping in any heavily monetized but legitimate publisher) to **\"made-for-arbitrage\"** — sites that deliberately *buy* traffic and monetize it heavily [20][22]. As one participant put it, \"arbitrage business models are a fundamentally different animal\" from organic traffic with ads [22].\n- **Measurement firms resist a too-specific standard**, fearing bad actors will reverse-engineer the criteria to evade detection (e.g., the 4A's \"30% ad-load on desktop\" threshold is seen as a gaming playbook) [22].\n- The result: **competing de-facto definitions.** **Jounce Media** governs a blocklist by ~six KPIs that many treat as the de-facto standard; **DoubleVerify** uses a high/medium/low \"shades of gray\" classification with AI plus human review [21][20]. The ANA \"stopped short of creating a standard,\" so MFA lists cannot be cleanly compared [20].\n\n**Why this matters for MiQ specifically.** MiQ's strongest MFA credential — the OpenX case study (Section 5) — is built on pairing *MiQ's own* MFA list with *Jounce's* list, and the headline finding was that **less than a third of the excluded domains appeared on both lists** [1][2]. Two reputable MFA lists disagree on two-thirds of their entries. MiQ's exclusion is therefore only as good as its definition, and there is no neutral arbiter to validate it against. The same fact cuts both ways: it is *why* MiQ's curation adds value (more lists catch more bad domains), and *why* MiQ cannot prove its supply is \"MFA-free\" in any standardized sense — because no one can.\n\n---\n\n## 5. MiQ's Stated Defenses and Actual Posture\n\n**Answer first:** MiQ has a credible, on-the-record record of treating supply quality as a product, not a disclaimer, and it moved earlier and more publicly than most managed-service peers. Its defenses cluster into four claims, each with a real basis and a real limit.\n\n**Defense 1 — \"We curate and exclude MFA upstream, with our own list.\"**\nThe strongest evidence. In a July 2023 case study co-published with OpenX, **MiQ contributed its own customized MFA domain list**, which OpenX combined with Jounce Media's list (excluding any domain on *either*), lifting excluded MFA domains by **37%** and removing ~1,600 unique domains from direct deals in a single day [1][2]. **Lara Koenig, MiQ's Global Head of Product**, is quoted: before this, MiQ \"had to identify & exclude MFA inventory manually across campaigns,\" and \"with our SSP partners now helping remove MFA upstream, MiQ and our clients can have additional peace of mind on ongoing inventory quality\" [1][2]. In Digiday's July 2023 coverage, Koenig also argued DSPs should give advertisers *direct* controls to block MFAs without manual account-manager intervention [2][23]. **Limit:** this is a 2023 case study with one SSP. There is no evidence MiQ has published an updated, portfolio-wide MFA-exclusion metric since, and the \"two lists disagree on two-thirds of domains\" finding (Section 4) bounds how complete any such exclusion can be.\n\n**Defense 2 — \"We hold the relevant accreditations.\"**\nMiQ states it is **TAG \"Certified Against Fraud,\"** an **IAB Gold Standard Certified Buyer**, and certified under the UK **JICWEBS/DTSG** Good Practice Principles [3][4]. TAG certification requires bot-filtering and post-bid IVT blocking [4]. **Limit:** these are *fraud, IVT, and brand-safety* accreditations. **There is no MRC, TAG, or other accreditation for supply-path transparency, working-media share, or take-rate disclosure** — the MRC's January 2026 *Digital Advertising Auction Transparency Standards* contemplate *future* MFA/\"made-for-arbitrage\" considerations but do not yet certify against them [24]. So MiQ's certifications answer \"is it fraudulent/unsafe?\" and not \"did my money reach working media, and what was your take?\" — the precise questions the ANA study raised.\n\n**Defense 3 — \"Direct-to-publisher and PMP-first buying *is* the curated path.\"**\nMiQ positions curation as a feature: it states it works toward 100% direct-to-publisher deals, operates **2,000+ curated PMP agreements**, vets sellers and refuses partners \"with a history of ad fraud, reselling or intermediaries,\" and cites that protected campaigns ran a 0.6% fraud rate vs. 11.2% unprotected [5][6]. This is MiQ's answer to liability-front (1): *neutral aggregation does not mean undifferentiated aggregation* — MiQ curates the path even while remaining DSP-agnostic. **Limit:** \"2,000+ PMP deals across 7 DSPs\" is *also* the exact surface area the curation debate targets. Every PMP is a deal whose underlying quality MiQ asserts but the client cannot independently audit without log-level data (Section 3.1). Curation-as-a-feature and aggregation-as-a-risk are the same fact seen from two sides.\n\n**Defense 4 — \"Our dashboards are transparent.\"**\nMiQ's Intelligence Hub provides app- and content-genre-level reporting [5][6]. **Limit:** dashboard transparency ≠ raw log-level data ≠ take-rate disclosure (Section 3).\n\n**The synthesis.** As of mid-2026, MiQ is on the *good* side of the MFA-hygiene line: early action, real certifications, a curation-first posture, and absence from the marquee exposé. It is on the *exposed* side of the deeper transparency line: no published take rate, no standing client-owned LLD product, and accreditations that don't reach the working-media question. The first set protects it through the *current* phase, when MFA hygiene is the test. The second set is where it is vulnerable in the *next* phase, if the market formalizes a transparency or working-media standard.\n\n---\n\n## 6. Asset or Liability? The 2029 Question\n\n**Answer first:** MiQ's neutrality is an **asset in a market that polices MFA by blocklist and certification, and a liability in a market that polices it by standardized log-level transparency and working-media accounting.** Which market 2029 becomes is the swing variable. The direction of travel — ANA quarterly benchmarks, ISBA/PwC's persistence, The Trade Desk's Sincera/OpenSincera publicizing publisher-level quality metrics, the slow MRC/4A's standard-setting — points toward the *second* market, the one MiQ is more exposed to.\n\n**The case that neutrality is an asset:**\n- Multi-DSP routing lets MiQ steer *away* from whichever DSP is leakiest on supply quality — a hedge a single-path buyer lacks. When DV360 carries MFA and TTD does not (Section 2), an agnostic desk can in principle route around the problem.\n- MiQ's *own* MFA list plus partners' lists catches more bad domains than any single source (Section 4) — aggregation of *exclusion* signals is a genuine quality advantage.\n- Curation-first PMP buying and seller-vetting are a real, defensible craft moat against a naive self-serve buyer (Section 5, Defense 3).\n\n**The case that neutrality is a liability:**\n- An extra managed-service layer above the DSPs is one more place transparency can be summarized rather than surfaced; the ANA study trained advertisers to distrust exactly this kind of intermediation (Sections 1, 3).\n- MiQ inherits the supply-quality posture of whichever DSP it routes through, and DV360 — a core MiQ rail — was the worst MFA offender in the Adalytics data (Section 2).\n- No published take rate and no standing LLD product leave MiQ unable to *prove* working-media efficiency on the market's emerging terms (Section 3) — it can only assert it.\n- The competitive frame has shifted under MiQ. **The Trade Desk's 2025 acquisition of Sincera, and its OpenSincera tool publishing publisher-level quality metrics (ads-to-content ratio, ads-in-view, refresh rate)**, reframes \"supply quality\" as something a *platform* measures and exposes natively [25][26]. If quality becomes a transparent platform feature, the value of a managed layer that *manually* curates and excludes erodes — the same disintermediation logic that bears on the independence thesis broadly, now applied to supply quality specifically.\n\n**Net judgment.** MiQ has done enough to avoid being a *cautionary tale* in the MFA story, and meaningfully more than a passive reseller would. But \"craft and aggregation\" is a defense that works against MFA-by-blocklist and loses force against transparency-by-standard. The move that converts the liability back into an asset is the one that recurs as MiQ's central bet: **turning service muscle into productized, measurable technology (Sigma).** If Sigma can expose supply-path quality, working-media share, and fee decomposition as *native, client-facing transparency outputs*, MiQ flips the \"extra layer\" critique. The intermediary becomes the *clarifying* layer rather than the *obscuring* one. Nothing in the public record shows Sigma doing this yet. That, not MFA hygiene, is the transparency question that decides whether MiQ's neutrality reads as an asset or a liability in 2029.\n\n---\n\n## Key Claims\n\n### The ANA's December 2023 study quantified MFA waste and made it a board-level issue\nThe ANA's *Programmatic Media Supply Chain Transparency Study* (Dec 2023), built on log-level data covering ~$123M spend / ~35.5B impressions from 21 brands, found MFA sites took ~15% of ad spend and ~21% of impressions, that campaigns averaged ~44,000 sites, and that only ~36 cents of each programmatic dollar reached working media. The ANA study is corroborated by Marketing Dive, AdExchanger, and Fiducia/TAG TrustNet coverage [8][9][10][11].\n\n### MFA spend fell sharply after 2023, but trackers disagree and no standard exists\nThe ANA/TAG TrustNet first quarterly benchmark (June 2024) reported MFA spend across 11 brands fell from 15% to ~4% and average site counts roughly halved (44,000→23,000), but competing DoubleVerify data showed MFA impressions rising ~19% YoY in 2023 — a divergence rooted in the absence of an agreed MFA definition [10][12].\n\n### Adalytics exposés (Forbes www3; Jan 2024 made-for-arbitrage) named DSPs/SSPs/verifiers but not MiQ\nAdalytics exposed a hidden ad-stuffed Forbes subdomain (`www3.forbes.com`) in May 2024 and, in a March 2024 report on January 2024 data, named DV360 (highest MFA volume), Amazon DSP, dozens of SSPs, and the major verification firms as still transacting/observing MFA — while The Trade Desk and Walmart DSP appeared clean, and MiQ was not named [7][13][14][15][16].\n\n### MiQ acted early on MFA with its own blocklist; OpenX case study lifted exclusions 37%\nIn a July 2023 case study with OpenX, MiQ contributed its own customized MFA domain list which, paired with Jounce Media's list, increased excluded MFA domains by 37% (~1,600 domains removed in one day), with under a third of excluded domains appearing on both lists. Lara Koenig, MiQ Global Head of Product, is quoted on inventory-quality \"peace of mind.\" The 37%/1,600 figures originate in the OpenX-MiQ case study, so they are best read as the parties' claim; Digiday corroborates the partnership and the Koenig quote [1][2][23].\n\n### MiQ holds fraud/brand-safety accreditations (TAG, IAB Gold Standard, JICWEBS/DTSG) but not a transparency standard\nMiQ states it is TAG \"Certified Against Fraud,\" an IAB Gold Standard Certified Buyer, and certified under JICWEBS/DTSG Good Practice Principles — but these are fraud/IVT/brand-safety accreditations; no industry accreditation yet exists for supply-path transparency, working-media share, or take-rate disclosure (the MRC's Jan 2026 auction-transparency standards only contemplate future MFA considerations) [3][4][24].\n\n### MiQ does not publish a take rate and shows no standing client-owned log-level-data product\nMiQ does not publish its blended take rate, and its public materials emphasize dashboard-level reporting (app/content-genre) rather than raw, client-owned log-level data with full fee decomposition — leaving it exposed on the two transparency demands (LLD access and take-rate disclosure) the ANA/ISBA studies elevated. This rests on the absence of disclosure rather than a documented refusal [5][6][8][17][18].\n\n### No agreed MFA definition exists; reputable lists disagree on a majority of domains\nThrough 2024–2026 the industry (4A's-convened group: ANA, IAB Tech Lab, BSI, Jounce, DeepSee — notably without DSPs/SSPs) has not agreed an MFA definition; the field has shifted toward \"made-for-arbitrage,\" and competing lists diverge — evidenced by MiQ's and Jounce's lists overlapping on under a third of excluded domains [20][21][22][1].\n\n### The competitive frame is shifting toward platform-native supply-quality transparency (TTD/Sincera)\nThe Trade Desk's 2025 acquisition of Sincera and launch of OpenSincera (publishing publisher-level quality metrics — ads-to-content ratio, ads-in-view, refresh rate) reframes supply quality as a measurable, platform-exposed feature, eroding the differentiation of a managed layer that curates MFA manually [25][26].\n\n---\n\n## Open Questions\n\n1. **Does MiQ offer standing, client-owned log-level data?** The public record shows dashboard-level reporting but no evidence of a routine raw-LLD product. A direct MiQ RFP response or client testimonial would settle whether the LLD exposure is real or merely undocumented.\n2. **Has MiQ updated its MFA-exclusion posture since the 2023 OpenX case study?** No portfolio-wide MFA metric post-2023 surfaced. Whether MiQ has institutionalized exclusion across all seven DSPs and 2,000+ PMPs (vs. one SSP partnership) is unknown.\n3. **Will Sigma expose working-media / take-rate / supply-path transparency natively?** This is the hinge for the 2029 asset-vs-liability judgment, and the public record is silent.\n4. **Does MiQ's multi-DSP routing actually steer away from leaky supply, or just inherit each DSP's posture?** The hedge remains theoretical; no MiQ data demonstrates active quality-based DSP routing.\n5. **Where will the MRC/4A's land on a transparency or working-media standard, and would MiQ's managed-service layer be in or out of scope?** The standard's existence and scope determine whether MiQ's certifications keep pace.\n6. **Did any Adalytics/Jounce follow-up (2025–2026) name MiQ or MiQ-routed PMPs?** Only the January 2024 report was checked directly; later reports may shift the \"not named\" finding.\n\n---\n\n## Sources\n\n1. OpenX (TheXchange blog), \"Case Study: How OpenX Increased the Number of MFA Domains Excluded in Direct Deals With MiQ by 37 Percent,\" 2023-07-24. https://blog.openx.com/case-study-how-openx-increased-the-number-of-mfa-domains-excluded-in-direct-deals-with-miq-by-37-percent/ — Tier 1 (self-published case study; numbers are the parties' claim). MiQ's own MFA list, 37%/1,600-domain figures, Lara Koenig quote. Accessed 2026-06-20.\n2. Digiday, \"Ad tech industry gears up to combat MFAs,\" 2023-07-19. https://digiday.com/marketing/ad-tech-industry-gears-up-to-combat-mfas/ — Tier 5. Corroborates MiQ-OpenX partnership and Koenig quotes; MiQ call for DSP-level MFA controls. Accessed 2026-06-20.\n3. MiQ, Brand Safety Policy, prod.wearemiq.com. https://prod.wearemiq.com/privacy-and-compliance/brand-safety-policy/ — Tier 1 (self-reported). JICWEBS/DTSG, IAB Gold Standard. Accessed 2026-06-20.\n4. MiQ (US), \"In plain English: what can we do to reduce ad fraud,\" wearemiq.com. https://www.wearemiq.com/us/resources/blog/in-plain-english-what-can-we-do-to-reduce-ad-fraud — Tier 1 (self-reported). TAG \"Certified Against Fraud,\" bot-filtering, post-bid IVT blocking. Accessed 2026-06-20.\n5. MiQ (US), \"Content transparency and fraud: do you know where your CTV ads are really running,\" wearemiq.com, 2023-08-15. https://www.wearemiq.com/us/resources/blog/content-transparency-and-fraud-do-you-know-where-your-ctv-ads-are-really-running — Tier 1 (self-reported). Direct-to-publisher goal, 2,000+ PMPs, seller-vetting, 0.6% vs 11.2% fraud, dashboard reporting. Accessed 2026-06-20.\n6. MiQ (US), \"Using programmatic for branding\" / Intelligence Hub references, wearemiq.com. https://www.wearemiq.com/us/resources/blog/using-programmatic-for-branding — Tier 1 (self-reported). App/content-genre dashboard transparency. Accessed 2026-06-20.\n7. Adalytics, \"Are Amazon and other ad tech vendors serving ANA members' ads on 'Made for Arbitrage' websites in 2024?,\" March 2024 (Jan 2024 data). https://adalytics.io/blog/ads-observed-on-made-for-advertising-sites-in-january-2024 — Tier 1 primary research. DV360/Amazon DSP volumes, TTD/Walmart clean, SSP/verifier list, 16/17 participants; MiQ not named. Accessed 2026-06-20.\n8. ANA, *Programmatic Media Supply Chain Transparency Study* (Dec 2023 full report; June 2023 \"first look\"). https://www.ana.net/content/show/id/media-programmatic-transparency — Tier 1 primary study. MFA 15% spend / 21% impressions; 21 of 67 participants; $123M / 35.5B impressions. Accessed 2026-06-20.\n9. Marketing Dive, \"ANA: 15% of programmatic ad spend is wasted on click-bait websites,\" 2023-06-19. https://www.marketingdive.com/news/ana-programmatic-transparency-ad-spend-report/653362/ — Tier 4. Headline MFA figures, 44,000-site average. Accessed 2026-06-20.\n10. AdExchanger, \"The ANA Says Advertisers Are Spending Way Less On MFA — But Programmatic Ain't Fully Transparent Yet,\" 2024-06. https://www.adexchanger.com/marketers/the-ana-says-advertisers-are-spending-way-less-on-mfa-but-programmatic-aint-fully-transparent-yet/ — Tier 5. 15%→4%, 44k→23k sites, DV +19% counter-data, quotes (Liodice, Manas, Brown). Accessed 2026-06-20.\n11. Fiducia/TAG TrustNet, \"ANA Provides First Look at In-depth Programmatic Media Transparency Study.\" https://www.fiducia.eco/post/ana-provides-first-look-at-in-depth-programmatic-media-transparency-study — Tier 5 (study partner). Participation attrition, LLD-access difficulty. Accessed 2026-06-20.\n12. DoubleVerify (via AdExchanger coverage [10]) — Tier 5/1. MFA impressions +19% YoY 2023, contra -programmatic-supply-chain-study/en-gb/6069 — Tier 5. PwC's \"five attempts\" to extract usable LLD. Accessed 2026-06-20.\n20. Digiday, \"There is a new definition for MFAs, but it's meant to be open to interpretation.\" https://digiday.com/media/there-is-a-new-definition-for-mfas-but-its-meant-to-be-open-to-interpretation/ — Tier 5. ANA stopped short of standard; comparability problem. Accessed 2026-06-20.\n21. AdExchanger, \"DoubleVerify Says Classifying MFA Means Considering Shades Of Gray.\" https://www.adexchanger.com/brand-safety/doubleverify-says-classifying-mfa-means-considering-shades-of-gray/ — Tier 5. DV high/medium/low classification; Jounce six-KPI list. Accessed 2026-06-20.\n22. AdExchanger, \"Inside The Secret Meetings To Define MFA.\" https://www.adexchanger.com/publishers/inside-the-secret-meetings-to-define-mfa/ — Tier 5. 4A's working group, participants, \"made-for-arbitrage\" shift, ad-load threshold, vendor absence. Accessed 2026-06-20.\n23. MiQ on LinkedIn (re: Digiday MFA coverage). https://www.linkedin.com/posts/miq-digital_ad-tech-industry-gears-up-to-combat-mfas-activity-7087457554624061440-KSRT — Tier 1-as-position. MiQ amplifying its anti-MFA stance. Accessed 2026-06-20.\n24. Media Rating Council, *Digital Advertising Auction Transparency Standards* (FINAL), Jan 2026. https://www.mediaratingcouncil.org/sites/default/files/Standards/MRC_Digital_Advertising_Auction_Transparency_Standards_FINAL.pdf — Tier 2. Accredited IVT/content-level brand-safety; future MFA/made-for-arbitrage considerations contemplated, not yet certified. Accessed 2026-06-20.\n25. Digiday, \"'Curation can be a vacuous term': The Trade Desk plans to redefine ad quality outside the walled gardens with Sincera,\" 2025. https://digiday.com/marketing/curation-can-be-a-vacuous-term-the-trade-desk-plans-to-redefine-ad-quality-outside-the-walled-gardens-with-sincera/ — Tier 5. TTD/Sincera positioning. Accessed 2026-06-20.\n26. The Trade Desk / BusinessWire, \"The Trade Desk Announces OpenSincera,\" 2025-05-13; AdMonsters analysis. https://www.thetradedesk.com/resources/what-is-opensincera — Tier 1/5. OpenSincera publisher-level quality metrics. Accessed 2026-06-20."}, {"order": 16, "file": "16_Gap_Practitioner_Buyside_Reception.md", "title": "The Practitioner Reality Check — Buy-Side and Employee Reception of MiQ, Independent of MiQ", "summary": "What people who are not MiQ say about MiQ: independent data corroborates the scale claims (headcount, revenue, valuation), but the performance and agentic-automation story has almost no third-party validation.", "body": "# The Practitioner Reality Check — Buy-Side and Employee Reception of MiQ, Independent of MiQ\n\n## Bottom Line\n\nEvery adoption and performance number in MiQ's own telling arrives wearing the same disclaimer: it comes from MiQ's own marketing. These pages do the one thing that telling cannot — they ask what people who are *not* MiQ say about MiQ. The answer splits cleanly down the middle. On the **hard facts of scale**, independent evidence largely *corroborates* the company: third-party workforce trackers (Revelio Labs) put MiQ at roughly 1,900–1,950 employees, and Digiday's independent reporting confirms the ~$600M+ revenue and the ~$900M–$1B Bridgepoint valuation. The \"~1,900 people, ~$500M+\" framing is not vendor puffery; it checks out against outside data. On **employee sentiment**, the picture is middling-to-strained: Glassdoor sits at ~3.4/5 with only 57–58% recommending the company, and complaints recur about US senior leadership, opaque promotions, and aggressive sales targets that gate the bonus making up much of comp. On the **outcomes-and-adoption story** (132% lift, $2.22/$1, 6hr-to-30s, 2,300+ advertisers), the independent layer is almost empty: no Forrester/Gartner Wave placement, no G2/TrustRadius/Gartner Peer Insights listing for Sigma, and the one piece of genuine third-party scrutiny (PPC Land) flags that the headline ROI figure covers the *old* platform, not the new agentic Planning Agent, whose reliability \"remains to be tested at scale.\" So the central finding is a split verdict: the *scale* claims are real, but the *performance and agentic-automation* claims remain almost entirely the vendor's voice — corroborated by neither analysts nor any visible body of candid buy-side testimony.\n\n---\n\n## Why This Matters\n\nIt is right to refuse to launder MiQ's self-reported metrics into fact. But refusing to believe a vendor is not the same as checking the vendor. The work here went deliberately to the evidence layers MiQ does not control: employee-review platforms (Glassdoor, Indeed, Comparably), anonymous workplace forums (Grapevine), independent trade-press reporting (Digiday, AdExchanger, PPC Land, Mumbrella/Mission Media), independent workforce-data aggregators (Revelio Labs), and the analyst ecosystem (Forrester, Gartner, G2, TrustRadius). The goal was neither to praise nor to bury MiQ, but to ask, on each claim, whether anyone *other than MiQ* attests to it.\n\nOne methodological caveat governs everything below: employee-review sites and anonymous forums sit at the bottom of the reliability ladder. They are not evidence of *fact*. They are evidence of *what employees report experiencing* — a real window onto the question \"how is the platform pivot landing with staff,\" but never proof of an underlying business fact. A Glassdoor rating or a Grapevine post is sentiment-as-data, not truth. The load-bearing corroborations here come from the stronger trade-press sources (Digiday, AdExchanger, PPC Land) and from a third-party workforce aggregator, and they are treated accordingly.\n\n---\n\n## The Claims, One by One\n\n### Independent workforce data corroborates the ~1,900 headcount; the \"1,200\" figure circulating elsewhere is stale\n\nThird-party workforce-analytics provider Revelio Labs places MiQ at approximately 1,900–1,950 employees (≈1,948 as of December 2025; ≈1,909 as of April 2026), independently corroborating the ~1,900 figure. A lower \"1,200 employees in 30 cities\" figure appears in a Marketecture company profile, but that profile was *recorded in May 2023* (published February 2025) and is therefore stale rather than contradictory — MiQ grew into the ~1,900 band over the intervening period.\n\nRevelio Labs, an independent labor-market data firm that infers headcount from public professional-profile data rather than MiQ's marketing, reports ~1,948 employees as of Dec 2025 and ~1,909 as of Apr 2026 [1]. The Marketecture profile of MiQ states \"1,200 employees in 30 cities … approximately 2,500 advertisers\" but is dated to a May 2023 recording [2]. The two reconcile on a growth timeline; they do not conflict. This is the single most important corroboration of the lot: the headline scale claim, otherwise vendor-sourced, holds up against outside data — and it is the one self-reported MiQ metric that can be independently confirmed.\n\n---\n\n### Independent reporting corroborates MiQ's ~$600M+ revenue and ~$900M–$1B valuation\n\nDigiday's independent reporting — not a MiQ press release — confirms that MiQ's revenue is \"comfortably north of $600 million,\" that the September 2022 Bridgepoint acquisition valued the company at approximately $900 million (other sources say up to $1 billion), and that prior PE backer ECI Partners realized a ~5.9–6x multiple of invested capital on exit. 2021 revenue was reported at ~$465M (≈37.7% YoY growth) with ~$45.4M profit.\n\nDigiday, reporting independently on the PE process, gives the $600M+ revenue band, the ~$900M valuation, the ECI exit multiple, and Jefferies as advisor [3]. A separate Digiday piece and PE-tracker entries corroborate the valuation range and the 2021 figures [3][4]. These are the financials a buyer or competitor would care about, and they survive outside MiQ's own telling. The scale story is real even where the performance story is not.\n\n---\n\n### Employee sentiment is middling: ~3.4/5 with a minority recommending the company\n\nAcross the largest public employee-review platforms, MiQ sits in a middling band: Glassdoor ~3.4/5 (≈528–537 reviews), with only ~57–58% of reviewers saying they would recommend the company to a friend; Indeed ~3.4/5 (much smaller sample). Category sub-scores show work-life balance rated relatively well (~3.8–3.9) but career opportunities (~3.2–3.3) and senior leadership rated notably lower.\n\nGlassdoor's aggregate MiQ page shows ~3.4/5 across ~528–537 reviews, 57–58% recommend-to-a-friend, WLB ~3.8–3.9, culture ~3.6, career ~3.2–3.3 [5]. Indeed shows ~3.4/5 with management as the lowest sub-category (~2.8) on a small sample [6]. These are sentiment signals, not facts about MiQ's quality; they are evidence of *what staff report*. The reading is neither a glowing nor a collapsing employer rating — it is the \"fine, with friction\" band typical of a fast-scaling, PE-owned ad-tech firm.\n\n---\n\n### The recurring negative theme is US senior leadership, opaque promotions, and target-gated bonuses — not (yet) the agentic pivot\n\nThe dominant *negative* themes in MiQ reviews cluster around (a) US senior management style (one review alleges screaming/swearing; another alleges a PE-installed CEO with \"no oversight\" spending on \"lavish lunches\"), (b) opacity around firings, promotions and conversions, and (c) aggressive, sometimes \"unrealistically high\" sales/trading targets that gate the annual bonus making up a large share of compensation. Notably, there is **little explicit employee chatter directly blaming the Sigma/agentic pivot for attrition** — the friction reviewers describe is the ordinary friction of a target-driven, PE-owned scale-up, not (visibly) an automation backlash.\n\nGlassdoor cons cluster on senior leadership, D&I, and management; specific review text references US management \"screaming and swearing,\" a PE-hired CEO and \"lavish lunches,\" \"severe politics,\" and \"no bonus or fractions of full potential due to unrealistically high targets\" [5]. Trader-specific reviews (~3.5/5, n≈18) cite target pressure, friction with the analyst team, and \"inferior internal tools\" [5]. The *absence* of a visible agentic-automation-attrition narrative in the public reviews is itself a finding. It does not confirm the worry that the agentic pivot is hollowing out the trading bench; if that dynamic exists, it is not yet legible in public sentiment data. This is an inference from absence, and should be held loosely.\n\n---\n\n### Documented restructurings are real but modest and dated; no evidence of a large recent automation-driven RIF\n\nThe verifiable restructuring events are: (a) a ~4% global workforce reduction in 2023 with closure of the German office and UK redundancies, tied to macro/ad-market pressure; (b) an anonymously-reported Bengaluru layoff of ~15–30 staff, which dates to ~mid-2023, with reported 4-month severance — i.e., the *same* 2023 episode, not a new one; and (c) a Feb-2026-reported APAC leadership restructuring (APAC CEO Jason Scott's departure after ~5 years; shift from centralized regional to per-market leadership), which the company framed as \"routine\" and which carried *no reported headcount cut*. None of these is a 2025–26 automation-driven mass layoff.\n\nTrade and tracker coverage documents the 2023 ~4% RIF and German-office closure [7]. The Grapevine anonymous post describing the Bengaluru layoff is timestamped ~35 months before access (≈mid-2023), names ~30 senior staff and 4-month severance, and is corroborated only by other anonymous commenters — a signal consistent with the 2023 episode, not a distinct later one [8]. Mission Media (via Mumbrella) reports the APAC leadership change as structural, not a layoff, published Feb 2026 [9]. Taken together, the picture is real but bounded churn, none of it publicly attributable to the agentic pivot. On the question of real headcount and attrition versus the agentic thesis, the answer is: no visible automation-driven RIF in the public record.\n\n---\n\n### There is no independent analyst rating of MiQ or Sigma (no Forrester Wave, no Gartner MQ/Peer Insights, no G2/TrustRadius listing)\n\nAs of mid-2026, MiQ does not appear as a rated vendor in the major independent analyst evaluations of ad-tech/DSP platforms. The Forrester Wave for omnichannel DSPs (Q3 2023) and Gartner's ad-tech-platform coverage evaluate The Trade Desk, Amazon, Basis, Adform, Simpli.fi and others — but not MiQ. Sigma carries no body of verified user reviews on Gartner Peer Insights, G2, or TrustRadius. So the *outcomes-and-platform* story has **no third-party analyst validation layer at all**: it rests on MiQ's own A/B claims plus a thin layer of trade-press paraphrase.\n\nSearches of Forrester Wave omnichannel-DSP coverage and Gartner ad-tech-platform / Peer Insights vendor lists surface TTD, Amazon, Basis, Adform, Simpli.fi, AdPushup — and no MiQ entry [10]. G2/TrustRadius queries for \"MiQ Sigma\" return unrelated products (Sigma Computing), not MiQ's Sigma [11]. The absence fits MiQ's positioning as a *managed-service media partner* rather than a self-serve software vendor — analyst DSP Waves rate the platforms agencies license, not managed-service desks. But the consequence stands: no Forrester/Gartner/IDC/G2 rating exists to triangulate the performance claims. On the question of whether the outcomes story is independently validated, the answer is no.\n\n---\n\n### Independent journalism on Sigma is announcement-driven, but PPC Land supplies the one real skeptical caveat on the agentic claims\n\nTrade-press coverage of Sigma is predominantly announcement-driven (AdExchanger's launch piece relies on company messaging, with one cautious external voice — Dentsu's James Banks saying Sigma \"has the potential to improve outcomes\" while confirming \"Dentsu isn't using Sigma yet\"). The substantive independent skepticism comes from PPC Land (June 2026): it explicitly notes that the headline $2.22/$1 figure \"covers the existing platform rather than the Planning Agent specifically, which is new,\" and that whether the agentic outputs \"are reliable enough to act on without significant human review remains to be tested at scale\" — while citing industry research that even AI-bullish buyers (82% call AI optimization essential) still \"maintain human oversight at the strategic level.\"\n\nAdExchanger's Sigma launch coverage carries one external quote (Banks/Dentsu, who is not yet a user) and no analyst, competitor, pricing, or adoption-barrier scrutiny [12]. PPC Land's one-year-on piece separates proven (old platform) from unproven (Planning Agent) performance, flags the human-oversight reality, and situates Sigma against a market where four DSPs (DV360, TTD, Yahoo, Amazon) control ~85% of spend, casting Sigma as an \"alternative execution path\" [13]. This is the closest thing to independent buy-side reality-checking available, and it lands squarely on the central concern: the *agentic* automation story is the least-proven part.\n\n---\n\n### The buy-side structural backdrop is ambivalent for independent desks, and no candid pro-MiQ buyer testimony surfaced\n\nThe independent-desk model that MiQ embodies sits in a contested structural position: trade coverage (Digiday, MarTech, WFA) frames agency trading desks and independents alike as under pressure from brand in-housing, the rise of self-serve/white-label DSPs, and the concentration of spend in a handful of mega-DSPs — even as the same coverage notes advertisers' continued demand for transparency and skills they cannot staff internally (a tailwind for partners like MiQ). Crucially, there is **no substantial body of candid, attributable buy-side testimony** — positive *or* negative — comparing MiQ to rivals on Reddit (r/programmatic, r/adops surfaced nothing indexable), in podcast transcripts, or in comment threads. The practitioner voice on MiQ specifically is, in the public record, surprisingly quiet.\n\nDigiday's \"evolve or die\" framing of trading desks, MarTech/WFA reporting on in-housing and transparency demands, and the ~85%-spend-in-four-DSPs concentration all describe a market squeezing intermediaries while leaving a transparency/skills niche [13][14]. Direct queries for MiQ practitioner opinion on Reddit returned no indexable discussion. The one independent buy-side-adjacent voice in coverage (Dentsu's Banks) was cautiously neutral and a non-user [12]. The honest conclusion: the public record does not solve the vendor-voice problem on *buyer reception* so much as *characterize* it. The candid buyer testimony one would hope to find does not visibly exist in public — and that absence is itself the finding.\n\n---\n\n## Narrative Synthesis\n\n### What the outside world confirms\n\nHere is the most useful, and most counterintuitive, result: MiQ's *scale* claims survive independent scrutiny better than its *performance* claims. It was right to flag \"~1,900 people, ~$500M+\" as vendor-sourced — but those are the numbers that check out. Revelio Labs, which reconstructs headcount from public profile data and has no incentive to flatter MiQ, lands at ~1,900–1,950. Digiday, reporting on a live PE process where overstatement would be punished by the buyers reading it, confirms $600M+ revenue, a ~$900M–$1B valuation, and a ~6x return for the prior backer. A skeptic who assumed the company was smaller or less valuable than it claims would be wrong. The \"1,200 employees\" number that floats around (Marketecture) is just a 2023 snapshot the company has since grown past.\n\n### What the outside world cannot confirm\n\nThe performance and adoption metrics — 132% lift, 57% CPA improvement, $2.22 per $1, 6 hours to 30 seconds, 2,300+ advertisers, the IKEA/Subway/Marriott roster — remain almost entirely inside MiQ's own voice. No Forrester Wave placement, no Gartner Magic Quadrant or Peer Insights presence, no G2 or TrustRadius body of user reviews for Sigma. This absence is partly *structural* and not necessarily damning: analyst DSP Waves rate the self-serve platforms agencies license, and MiQ is a managed-service partner, not a self-serve seat — so it was never going to appear in a DSP Wave the way The Trade Desk does. But the consequence is unavoidable: there is no independent rating layer to triangulate the outcomes story against. The refusal to treat these numbers as fact is vindicated, and nothing turned up that would let a careful researcher upgrade them.\n\nThe closest thing to independent scrutiny is PPC Land's June 2026 piece, and it lands precisely where the suspicion pointed: the impressive $2.22/$1 figure describes the *established* platform, while the genuinely novel claim — the agentic Planning Agent that compresses six hours to thirty seconds — is \"new\" and \"remains to be tested at scale.\" Even AI-enthusiastic buyers, per the research PPC Land cites, keep humans in the strategic loop. So the part of MiQ's story that is most forward-looking, and most central to its 2029 positioning, is also the part with the least independent validation.\n\n### On morale and the agentic-attrition thesis\n\nOne pointed question is whether real attrition signals contradict the headcount claim, and whether the \"automation of traders\" thesis is visible in staff sentiment. The answer to both is \"not in the public record.\" Employee sentiment is middling — ~3.4/5, ~57% recommend — with complaints clustering on US senior-leadership style, opaque promotion/firing decisions, and bonus targets set high enough that staff report missing them. These are the pathologies of a fast-scaling, PE-owned, target-driven shop; in the visible reviews, they are not an automation backlash. The documented layoffs (2023 ~4% RIF, German-office closure, the anonymously-reported Bengaluru cut that dates to the *same* 2023 episode) predate the agentic pivot. The Feb-2026 APAC reshuffle was a leadership reorganization with no reported headcount cut. If MiQ's agentic platform is quietly thinning the trading bench, that has not yet surfaced as a legible signal in any public channel one could reach — a finding to be held as \"absence of evidence,\" not \"evidence of absence.\"\n\n### The honest meta-finding\n\nBuy-side reception is the single biggest evidentiary blind spot, and the picture here both confirms and reframes that. It confirms it: there is no Forrester/Gartner rating, no G2 review body, no substantial body of candid, attributable buyer testimony about MiQ specifically — the r/programmatic / r/adops / podcast-comment layer one would hope to mine is, for MiQ, largely empty. But it reframes it too. The *scale* blind spot is now closed: the numbers check out. The *performance and agentic* blind spot is not so much filled as *confirmed to be structural* — the validation simply does not exist in public. The reader should treat MiQ's outcomes story as un-triangulated by design, not merely un-researched.\n\n---\n\n## Open Questions\n\n1. **Does MiQ appear in any *paid* analyst coverage** (a Forrester \"Now Tech\"/landscape, an IDC MarketScape, a Gartner managed-service-specific report) that is not free-to-web? The free layer shows nothing, but managed-service vendors sometimes appear only in gated reports.\n2. **Is there candid buy-side testimony in gated/community channels** — the Marketecture/AdTechGod Slack or Discord, private agency-procurement forums, ID Comms / MediaSense pitch-consultancy databases — that a web search cannot reach? The public absence may reflect indexability, not silence.\n3. **What is the actual trader-headcount trajectory** inside MiQ since Sigma launched? Headcount aggregate is ~flat-to-up, but the *mix* (traders vs. engineers vs. sales) is invisible; the agentic-automation thesis can only be tested at the role level.\n4. **Has any named advertiser** from the IKEA/Subway/Marriott roster spoken about MiQ on the record independent of a MiQ case study? None surfaced; a single on-the-record client interview would meaningfully move the evidence.\n5. **Does the PPC Land \"Planning Agent unproven at scale\" caveat resolve** in either direction over the next 12 months — i.e., does a second independent outlet either validate or puncture the agentic claims?\n\n---\n\n## Sources\n\n1. Revelio Labs, \"How many employees work at MiQ?\", accessed 2026-06-20. https://www.reveliolabs.com/companies/miq/employees/ — independent workforce-data aggregator; corroborates ~1,900–1,950 headcount.\n2. Marketecture, \"MiQ — A global programmatic media partner doing $600M+ in revenue,\" recorded May 2023 / pub. 2026-02-12. https://news.marketecture.tv/p/miq-gurman-hundal — promotional interview; source of the (stale) \"1,200 employees / 2,500 advertisers.\"\n3. Seb Joseph / Digiday, \"MiQ mulls M&A moves with new PE-backers,\" 2022-09-13. https://digiday.com/media/miq-mulls-ma-moves-with-new-pe-backers/ — independent confirmation of revenue/valuation/ECI exit.\n4. PE/deal trackers (PrivSource, mrweb DRNO) on Bridgepoint–MiQ, accessed 2026-06-20 — corroborate valuation range and 5.9x ECI multiple.\n5. Glassdoor, \"MiQ Reviews\" (+ Trader, work-culture, commission-structure, NYC review sets), accessed 2026-06-20. https://www.glassdoor.com/Reviews/MiQ-Reviews-E719780.htm — employee sentiment only.\n6. Indeed, \"Working at MIQ: Employee Reviews,\" accessed 2026-06-20. https://www.indeed.com/cmp/Miq/reviews — employee sentiment only (~3.4/5, management 2.8).\n7. Tech.co / Crunchbase / sunsethq layoff trackers, MiQ 2023 ~4% RIF + German-office closure, accessed 2026-06-20 — secondary aggregation of the 2023 reduction.\n8. Grapevine, \"Mass layoff at MiQ Digital\" (anonymous, ~35 months old at access). https://www.grapevine.in/post/mass-layoff-at-miq-digital-22565790-d7cb-4771-8a76-93a63d5287bf — anonymous forum; consistent with the 2023 episode, single-source on specifics.\n9. Mission Media (citing Mumbrella + company statement), \"MiQ Restructures APAC Leadership, Replaces Regional CEO,\" 2026-02-08. https://missionmedia.asia/miq-restructures-apac-leadership-replaces-regional-ceo/ — APAC reorg, no reported headcount cut.\n10. Gartner Peer Insights \"Ad Tech Platforms\" market/vendor lists + Forrester Wave Omnichannel DSPs Q3 2023 (via secondary), accessed 2026-06-20. https://www.gartner.com/reviews/market/ad-tech-platforms — document MiQ's *absence* from analyst Waves/MQs.\n11. G2 / TrustRadius \"Sigma\" vendor queries, accessed 2026-06-20 — return non-MiQ products (Sigma Computing); no MiQ-Sigma body of user reviews exists.\n12. AdExchanger, \"MiQ Aims To Unify Fragmented Data Landscape With New AI-Powered Ad Platform,\" 2025. https://www.adexchanger.com/technology/miq-aims-to-unify-fragmented-data-landscape-with-new-ai-powered-ad-platform/ — announcement-driven; one cautious non-user external quote (Dentsu's Banks).\n13. Luis Rijo / PPC Land, \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" 2026-06-11. https://ppc.land/miq-upgrades-sigma-a-year-in-planning-agent-and-2-5pb-of-daily-data/ — the one substantive independent caveat on the agentic claims; four-DSP ~85% concentration.\n14. Digiday, \"The future of agency trading desks: Evolve or die\"; MarTech/WFA on ATD transparency & in-housing, accessed 2026-06-20. https://digiday.com/marketing/future-agency-trading-desks-evolve-die/ — structural backdrop for the independent-desk model."}, {"order": 17, "file": "17_Gap_InHousing_ATD_CounterTradition.md", "title": "Just Xaxis With an LLM? The In-Housing and Agency-Trading-Desk Counter-Tradition Against MiQ's Category", "summary": "", "body": "# 17 — Just Xaxis With an LLM? The In-Housing and Agency-Trading-Desk Counter-Tradition Against MiQ's Category\n\n## Bottom Line\n\nIt is tempting to treat in-housing and walled-garden-direct buying as mere \"forces\" — tailwinds and headwinds to be weighed. This account treats them as something sharper: a coherent **intellectual counter-tradition** that holds MiQ's entire category — the managed-service trading desk — to be structurally terminal, doomed to be pulled in-house once it matures. That thesis is not a fringe view. Serious actors built it over a decade. The Association of National Advertisers (ANA) and its CEO Bob Liodice commissioned the 2016 K2 Intelligence report that found \"pervasive\" non-transparent rebates across the U.S. media-buying ecosystem [1]. P&G's Marc Pritchard, in a January 2017 IAB speech, branded the supply chain \"murky at best and fraudulent at worst\" and gave the in-housing movement its rallying cry [2]. And the platforms — The Trade Desk, Amazon, Google — now frame AI agents as the thing that finally lets a brand \"hold the seat\" itself [10][11]. The historical record the bears point to is real and unkind. The holdco trading desks (Xaxis, Accuen, Cadreon, Amnet, Affiperf, VivaKi) were the highest-margin businesses in advertising in 2013, and by 2017 ninety percent of large advertisers using them were \"reviewing and resetting\" the contracts [3]. Publicis dismantled VivaKi's centralized desk in 2015 [4]. The category that replaced them — independent desks and DSPs — has itself produced a billion-dollar bankruptcy (MediaMath, 2023) [9].\n\nThe bear question is fair, and it is rarely asked head-on: **why is MiQ not just Xaxis with an LLM, and what is the base rate for an intermediary like it surviving an in-housing wave?** What follows maps the counter-tradition rigorously, states the terminal-category case at its strongest, and then assesses MiQ's actual structural defenses. The honest answer is split. MiQ is genuinely *not* a 2013 holdco desk in three ways that matter: it is disclosed/agnostic rather than a non-disclosed arbitrage box; it owns proprietary TV data the in-housing brand cannot rebuild; and it sells to the segment (independent agencies, mid-market) that in-housing studies consistently show *cannot* in-house. But the bear case has one charge MiQ has not yet answered. In-housing has never been the thing that kills these intermediaries — **commoditization of their core skill** is, and agentic buying threatens to commoditize the trading craft MiQ still sells as labor, the same way the DSP commoditized the ad network. MiQ's survival therefore does not turn on winning the in-housing argument. It turns on whether it can convert from \"the desk you outsource trading to\" into \"the data-and-software layer you license even after you in-house\" — before its own AI makes the trading it sells free.\n\n---\n\n## 1. Why this is a distinct argument, not a restatement of \"in-housing as a force\"\n\nThe familiar treatment frames in-housing as one force among many — \"double-edged,\" to be weighed in the outlook. That framing quietly concedes the bear's premise without engaging the bear's argument. The counter-tradition does not say \"in-housing is a headwind.\" It says something categorical: **the managed-service trading desk is a transitional structure that advertisers tolerate only until they understand it, and every prior instance of the category has been pulled in-house, disclosed into a low-margin service, or driven into bankruptcy once its core skill commoditized.** MiQ, on this reading, is the third generation of the same doomed animal — agency network (1990s–2000s) → holdco trading desk (2010s) → independent AI-wrapped desk (2020s) — each generation killed by the same mechanism, each insisting it was different.\n\nEngaging that honestly requires three things the \"force\" framing skips: (a) the *history* of what actually happened to the prior generation and why; (b) the *base rate* — how often an intermediary of this kind survives the wave; and (c) the strongest possible version of the claim that MiQ's category is terminal, followed by an unflinching audit of MiQ's defenses. What follows supplies all three.\n\n---\n\n## 2. The first counter-tradition: the agency-trading-desk transparency revolt (2013–2018)\n\n### 2.1 What the holdco trading desks were\n\nBetween roughly 2011 and 2013, every major holding company built a centralized programmatic buying unit: **Xaxis** (WPP), **Accuen** (Omnicom), **Cadreon** (IPG), **Amnet** (Dentsu Aegis), **Affiperf** (Havas), and **VivaKi / Audience on Demand** (Publicis) [5]. Veteran ad-tech journalist Zach Rodgers described them precisely: \"Trading desks were effectively ad networks that sat inside the agency\" [5]. They bought programmatic inventory for the holdco's own clients and layered on data and optimization — and, critically, often did so on a **non-disclosed / principal basis**. The desk bought impressions at one price, resold them to the client at a marked-up price, and kept the spread (arbitrage) rather than charging a transparent fee.\n\n### The holdco trading desks were the highest-margin businesses in advertising precisely because their margins were hidden\n\nThe defining feature of the 2013-era ATD was margin opacity. As Rodgers put it, \"What were they charging the clients, and how did that compare to what they were paying for impressions was always a black box, and there was a growing pressure from advertisers to disclose that\" [5]. The model's profitability depended on the client *not* seeing the spread. That is why the revolt, when it came, was existential rather than cosmetic. This is the structural fact the entire bear case rests on, because it defines what advertisers were revolting *against*.\n\n### 2.2 The revolt: ANA/K2 (2016), Pritchard (2017), and the WFA survey\n\nThe dam broke in 2016. The ANA commissioned the investigations firm K2 Intelligence to study media-buying transparency. K2 ran the study from October 2015 through May 2016, and on June 7, 2016, the ANA released findings that \"numerous non-transparent business practices, including cash rebates to media agencies, were found to be pervasive in a sample of the U.S. media ad-buying ecosystem\" [1]. The report documented cash rebates tied to spend, free-inventory credits, and \"service agreements\" in which media suppliers paid agencies for low-value research tied to spend volume. It found \"a fundamental disconnect\": advertisers said they received no rebates and were unaware of any [1].\n\n### The 2016 ANA/K2 report and Pritchard's 2017 speech converted scattered advertiser unease into an organized in-housing movement\n\nOn January 29, 2017, P&G chief brand officer Marc Pritchard told the IAB Annual Leadership Meeting: \"We have a media supply chain that is murky at best and fraudulent at worst,\" citing \"too many players grading their own homework, too many hidden touches,\" and claimed as little as 25% of digital media spend reached the consumer [2]. P&G announced it would review all agency contracts in 2017 [2]. Mark Ritson called it \"the biggest marketing speech for 20 years\" [2, via Marketing Week]. The mechanism that matters for MiQ: this was the moment \"transparency\" stopped being a procurement footnote and became a CMO-level strategic mandate — and the prescribed remedy was to **take control in-house**.\n\nThe World Federation of Advertisers' January 2017 survey quantified the damage to the ATD model specifically.\n\n### By 2017, 90% of large advertisers using agency trading desks were resetting the contracts, and adoption was shifting toward independent and in-house models\n\nThe WFA's 2017 survey (its prior one was 2014) found that **90% of large brand advertisers using ATDs were \"reviewing and resetting contracts and business models\"** for more control and transparency [3]. Only 51% still worked with the legacy holdco desks (Xaxis, Accuen, Cadreon), down from 2014. **Independent trading-desk** adoption rose to **46% of respondents (up 12 points from 2014)**, and **in-house or hybrid models exceeded 20%** — a significant shift from 2014 [3]. On the core grievance, only **9% of ATD users said they were comfortable with principal-trading conflicts; 62% disagreed** [3]. The granular percentages come from the WFA survey as reported by trade press [3][6]; the survey is a membership self-report and is best read as directional, but the direction is corroborated by the ANA report [1] and the structural moves below [4].\n\n### 2.3 What happened to the desks: dismantled, rebranded, disclosed\n\nThe category did not vanish overnight, but it was structurally broken in three ways:\n\n1. **Dismantled.** Publicis dissolved VivaKi's centralized U.S. trading desk in February 2015, reassigning its ~120 traders into Starcom MediaVest and ZenithOptimedia. Starcom CEO Laura Desmond's reasoning was a direct rebuke of the centralized-desk model: \"If you're a marketer, do you want your programmatic decisions siloed and balkanized from everything else that you're doing? No.\" [4]\n2. **Rebranded.** As Rodgers noted, \"There was a lot of rebranding going on. Many of them just created new units as they needed their clients to see this as a totally new way of doing business\" [5]. Xaxis repositioned again and again over the following years, away from \"trading desk\" language toward \"outcome media\" and, eventually, into WPP Media's reorganized structure.\n3. **Disclosed.** The surviving desks moved from non-disclosed arbitrage toward disclosed/transparent fee models — exactly the WFA's finding that the share describing their model as \"disclosed/transparent\" was rising (53% in 2017) while the \"non-disclosed\" share was the thing under attack [3]. Disclosure is survival, but it is also **margin compression**. The spread that made the 2013 desk the most profitable unit in advertising was precisely what disclosure eliminated.\n\n### The ATD category survived only by surrendering the economics that made it attractive to its owners\n\nThe holdco desks were not abolished; they were forced to disclose, which collapsed the arbitrage margin, and/or redistributed into the agencies. The category persisted in form but lost the high-margin spread economics that justified its centralized existence [3][4][5]. This is the precise pattern the bear says MiQ's category will repeat, and the precise pattern MiQ's *disclosed/agnostic* model is designed to have pre-empted.\n\n---\n\n## 3. The second counter-tradition: the in-housing movement and its penetration data\n\n### 3.1 The intellectual lineage\n\nThe in-housing argument is older and more reputable than the ATD revolt; the revolt simply weaponized it. Its core claim: **the advertiser should hold the data, the DSP contract, and the seat, because every intermediary layer adds cost, conflict, and opacity.** Bob Liodice and the ANA institutionalized it (the K2 report was an ANA product [1]). Pritchard operationalized it at the largest advertiser in the world [2]. The IAB then measured it.\n\nA note on Sir Martin Sorrell, who is sometimes enlisted into this tradition via a \"reduce the layers\" line. The attested record is more complicated and worth getting right. As WPP CEO and owner of Xaxis, Sorrell was for years a *defender* of the intermediary, and publicly argued the in-housing trend would be **\"short-lived,\"** a reaction to \"serious economic conditions\" rather than a structural shift [7]. His later, S4 Capital–era \"reduce the layers\" / disintermediation rhetoric is real, but it came after he left WPP and aims more at the holdco bundle than at specialists like MiQ [8]. Better to note this than to fold a contested attribution into the counter-tradition as settled. The in-housing tradition is strong enough without overstating Sorrell.\n\n### 3.2 The penetration data — and why it cuts both ways\n\nThe IAB has tracked programmatic in-housing repeatedly, and the numbers are the empirical heart of the bear case:\n\n### In-housing penetration is high and durable, but has plateaued into a hybrid equilibrium rather than completing toward full in-housing\n\nThe trajectory across IAB studies: in **May 2018**, 65% of brands had taken programmatic fully or partially in-house — **18% fully**, **47% partially**, with 13% having tried and abandoned it [12]. By the **August 2020** IAB/Accenture report, **69% of U.S. brands** had taken programmatic in-house in some form (48% partially, 16% tried-then-outsourced) [13]. By the mid-2020s the picture had settled into a **hybrid plateau** rather than a march to full in-housing: roughly a quarter of advertisers run fully in-house while the dominant and growing mode is **hybrid** — the brand holds data and DSP contracts while agencies/specialists supply bandwidth and specialized capability [14]; one 2024 reading put ~42% of advertisers as *considering* bringing trading in-house over the next 12 months and ~51% running a hybrid split [14a]. Each percentage is from a specific IAB study of a specific year and methodology; they are *not* a clean longitudinal series (samples and definitions shifted), so the safe claim is \"high and plateaued into hybrid,\" not a precise trendline. The 2024 \"42%/51%\" figures are the least-corroborated and should be read accordingly [14a].\n\n### The IAB's own framing is that in-housing pushes agencies and specialists into *specialist roles*, not out of existence\n\nCritically for MiQ, the IAB did not forecast the death of the intermediary. It forecast its **repositioning**: as brands in-house the commodity layer (basic media buying, ad ops), agencies and specialists survive by \"bringing a different value than media buying going forward\" — creative, research, data science, advanced ad operations, coding, and the specialized capabilities brands cannot economically build [15]. The recurring finding across every IAB study: in-housing \"takes 18 months or more\" and demands talent most brands lack, and **recruitment/skills remain the binding constraint**, with nearly three-quarters of advertisers naming it the critical barrier [14][15]. This is simultaneously the bear's evidence (the commodity layer gets in-housed) and MiQ's strongest single defense (the specialist layer is what survives, and MiQ is trying to *be* that layer).\n\n---\n\n## 4. The third counter-tradition: the agentic-self-serve disintermediation thesis (2023–2026)\n\nThis is the newest and, for MiQ, the most dangerous strand, because it attacks the one thing in-housing left intact: the value of skilled human traders. The argument: **AI agents now let a brand hold the seat itself, because the agent does the trading craft that previously required a desk.**\n\n### The Trade Desk's Kokai/Koa, Amazon's Ads Agent, and Google's Ads Advisor all frame AI agents as letting buyers run campaigns directly, compressing the need for a managed-service desk\n\nThe Trade Desk launched **Kokai** in June 2023 as an AI-forward rebuild of its self-serve DSP. By early-to-mid 2025, executives reported roughly two-thirds to three-quarters of client spend had migrated to Kokai, targeting full adoption by year-end [10]. Its **Koa** AI sets bidding/allocation while \"humans set objectives and guardrails\" — explicitly \"advertisers don't have to give up total control in order to benefit from automation,\" with new \"Adaptive Trading Modes\" including a Performance Mode where Koa acts as full co-pilot [10]. On **November 11, 2025**, Amazon announced **Ads Agent** at unBoxed — natural-language campaign creation, targeting and optimization across Amazon DSP and Marketing Cloud, reviewing thousands of audience segments and writing analytics SQL \"without coding\" [11]. On **November 12, 2025**, Google made **Ads Advisor** broadly available [11]. The IAB Tech Lab introduced an **Agentic RTB Framework** (containerized auction standards for autonomous buyers) on November 13, 2025 [11].\n\nThe disintermediation logic is explicit in the platforms' own framing: the agent lets the brand buy direct *without* a desk in the middle. This is the modern form of the ATD revolt — except the prior revolt only asked advertisers to *disclose* the desk. The agentic thesis asks whether the desk is *needed at all*.\n\n### The agentic thesis, not in-housing per se, is the mechanism that historically kills intermediaries: it commoditizes their core skill\n\nThe pattern across ad-tech history is consistent. The ad network died not because advertisers refused networks but because the **DSP commoditized** programmatic buying into self-serve software. The non-disclosed ATD died not from in-housing alone but from **disclosure commoditizing** the arbitrage. The independent-DSP gold rush ended not in mass in-housing but in **MediaMath's June 30, 2023 Chapter 11** — a company that had raised $600M+, was once valued over $1B, and collapsed when its software edge eroded and it could not out-scale The Trade Desk [9]. The throughline: intermediaries die when the *skill* they monetize becomes a feature anyone can buy. Agentic buying is the next commoditizing wave, aimed squarely at the trading craft MiQ still sells as managed-service labor.\n\n---\n\n## 5. The strongest case that MiQ's category is terminal\n\nStated in its strongest form, in the bears' own language:\n\n> *MiQ is the third generation of a structurally doomed animal. The agency network sat inside the agency and was killed by the DSP. The non-disclosed holdco trading desk was the most profitable thing in advertising in 2013 and was gutted by the 2016–2017 transparency revolt the moment advertisers understood its arbitrage. MiQ is the same animal in independent, AI-wrapped form: a managed-service layer that buys other people's DSPs on a client's behalf and sells the result as \"outcomes.\" Every prior generation insisted it was different — better data, better tech, a cleaner model — and every one was pulled in-house or commoditized once the skill it sold became buyable. The data are unambiguous: ~69% of brands already in-house some programmatic [13]; 90% of ATD users reset their contracts once they saw the spread [3]; the platforms MiQ resells (The Trade Desk, Amazon, Google) are now shipping AI agents whose explicit purpose is to let the brand hold the seat without a desk [10][11]. MiQ's \"independence\" is the same neutrality pitch The Trade Desk rode to $100B and then watched collapse ~68% in 2025. MiQ's revenue is still mostly human trading labor — the exact layer agentic buying commoditizes. When the AI in Sigma is good enough, the client, the holdco, or the walled garden runs it themselves, and MiQ becomes Xaxis with an LLM: a transitional vendor advertisers tolerate only until the tooling matures. The base rate for this category surviving an in-housing-plus-commoditization wave, intact and high-margin, is approximately zero.*\n\nThat is a serious argument. It is internally consistent, grounded in a decade of precedent, and it has not yet been rebutted.\n\n---\n\n## 6. MiQ's structural defenses — audited honestly\n\nMiQ is not identical to a 2013 holdco desk, and the differences are load-bearing. But not all of them hold.\n\n### 6.1 Defense that holds: MiQ is disclosed/agnostic, not a non-disclosed arbitrage box\n\nThe 2016–2017 revolt was specifically against **non-disclosed principal trading** — the hidden spread documented above. MiQ's model is **disclosed managed service across agnostic DSPs**. By its positioning, it does not mark up inventory it secretly bought as principal; it runs the client's spend on The Trade Desk, Amazon DSP, or DV360 transparently and charges for the service and data. MiQ was, in effect, **born into the disclosed world the revolt created** — a product of the transparency wave, not a target of it. The pre-emption is real: you cannot stage a 2016-style arbitrage revolt against a desk that already discloses. **This is MiQ's best answer to the *transparency* strand of the counter-tradition.**\n\n### 6.2 Defense that holds: MiQ owns proprietary TV data an in-housing brand cannot rebuild\n\nThe IAB's own finding, noted above, is that the *commodity* layer in-houses and the *specialist* layer survives. MiQ's TV Intelligence footprint — the 90M-household / 6.4-trillion-signal CTV panel and ATV graph — is exactly the kind of proprietary, scale-dependent asset a single brand cannot economically reconstruct, and which the IAB names as the survivable specialist value. A brand can license a DSP seat and run Koa itself; it cannot license MiQ's TV graph by in-housing a trading team. **This converts MiQ's defense from \"we trade better\" (commoditizable) to \"we hold data you can't rebuild\" (durable)** — provided the data edge is real and not itself a vendor claim, a caveat that hangs over the 90M/6.4T figures.\n\n### 6.3 Defense that holds: MiQ sells to the segment that *cannot* in-house\n\nEvery in-housing study finds the same binding constraint: in-housing takes 18+ months, demands scarce talent, and is realistic mainly for large, sophisticated advertisers [14][15]. MiQ's Pathlabs MEP play targets precisely the inverse population — **independent and mid-market agencies (~$25B of US digital spend) that structurally cannot in-house** the cutting-edge data/AI stack. The in-housing wave hits the Fortune-100 direct-brand segment hardest and the independent-agency segment least, and MiQ has been deliberately rebalancing toward the segment the wave cannot reach. **This is MiQ's best answer to the *in-housing* strand.**\n\n### 6.4 Defense that does NOT yet hold: the agentic-commoditization strand\n\nHere the bear lands a clean blow, and it is worth saying so plainly. MiQ's defenses in 6.1–6.3 answer transparency and in-housing. But the *killing* mechanism in every historical case was **commoditization of the core skill**, and MiQ's core monetized skill is still **human trading labor**. The same agentic technology MiQ builds into Sigma (the Trading Agent) is being built by The Trade Desk (Koa), Amazon (Ads Agent), and Google (Ads Advisor) [10][11] — and if it commoditizes, the client can run the agent on its own seat without MiQ's traders. The risk is plain enough: the same technology that justifies Sigma's valuation can, if it commoditizes, hollow out the labor revenue that still funds the company. **Owning a trading agent is not a defense if everyone owns one. The defense has to be the data and the workflow the agent runs on, not the agent.**\n\n### MiQ's survival depends on completing a conversion from \"desk you outsource trading to\" into \"data-and-software layer you license even after you in-house\" — and that conversion is unfinished\n\nMiQ's three holding defenses (disclosed model, proprietary TV data, can't-in-house segment) are necessary but not sufficient. The sufficient condition is that MiQ's value migrates from the *commoditizable* layer (human trading, which both in-housing and agentic buying attack) to the *durable* layer (proprietary TV/identity data and an indispensable cross-DSP workflow that survives even when the client in-houses the seat and runs its own agent). The Dentsu \"Intelligence Partner\" deal is the leading evidence MiQ can be licensed as a *layer* rather than hired as a *desk*; the unresolved revenue-mix question — what share of the ~$600M+ is high-margin data/software vs. low-margin labor — is the number that decides whether the conversion is real. The conversion thesis is analytical; the Dentsu data point is a single marquee deal, not yet a pattern, with no confirmed holdco #2 or #3 as of mid-2026.\n\n---\n\n## 7. The base-rate question, answered\n\nThe bear asks: what is the historical base rate for an independent desk surviving an in-housing-plus-commoditization wave? Honestly assessed:\n\n- **As a *non-disclosed arbitrage* desk: near zero.** That model was specifically destroyed 2016–2018 (Section 2). MiQ is not this.\n- **As a *disclosed managed service* selling primarily human trading labor: poor.** The labor layer is what both in-housing (commodity functions) and agentic AI (the trading craft) compress. No pure managed-trading intermediary has been shown to hold high margins through both waves; MediaMath's $1B-to-bankruptcy arc is the cautionary independent precedent [9].\n- **As a *proprietary-data-and-software layer* that is licensed even by in-housed buyers: rare but
