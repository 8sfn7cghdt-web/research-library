ce-2508/\n10. Digiday, \"As holdcos sour on The Trade Desk, Stagwell goes all in,\" accessed 2026-06-20. *Stagwell agents \"won't execute buys autonomously\" (Matt Adams), accelerate setup; working with Google on Gemini/DV360; betting on TTD/open-web. Used for the human-in-the-loop nuance and competitive positioning.* https://digiday.com/media-buying/as-holdcos-sour-on-the-trade-desk-stagwell-goes-all-in/\n11. Brandtech/Jellyfish and Brainlabs — Marketing Dive, MediaPost, Tracxn, accessed 2026-06-20. *Brandtech acquired Jellyfish 2023 → $1B+ revenue, 7,000+ employees; Jellyfish ~2,300 people, AI in-housing platform (claims 65% faster launch, Mar 2025); Brainlabs 1,000+ people, acquired Exverus Media July 2025. In-housing platform competes with managed-service intermediaries.* https://www.marketingdive.com/news/brandtech-acquires-jellyfish-1b-digital-marketing-agency/652063/ ; https://www.mediapost.com/publications/article/404581/brandtechs-jellyfish-unveils-ai-platform-for-in-h.html\n12. Scope3 — Digiday and Marketing Brew, accessed 2026-06-20. *Brian O'Kelley (AppNexus → AT&T $1.6B) \"agentic advertising platform\"; brand-agents/seller-agents autonomously negotiate buys; lets partners build agentic media products; ~$25M raised late 2024, $100M valuation 2023; backers GV/Craft/Venrock/Room40. Threatens the orchestration layer Sigma sells.* https://digiday.com/media-buying/scope3-aims-to-upend-ad-tech-with-an-agentic-platform-for-effective-responsible-advertising/ ; https://www.marketingbrew.com/stories/2025/03/13/scope3-to-take-on-brand-safety-companies-with-new-ai-tech\n13. Koah — SiliconANGLE, Adweek, StartupHub, accessed 2026-06-20. *\"AdSense for AI\"; $5M seed (Sept 2025, Forerunner) + $20.5M Series A (Feb 2026, Theory Ventures), ~$26M total; SDK serves native ads inside AI chat/search apps. Evidence of inventory-surface migration into AI-native apps.* https://siliconangle.com/2026/02/24/koah-raises-20-5m-scale-adsense-ai-across-apps/ ; https://www.adweek.com/media/koah-adsense-for-chatgpt-series-a/\n14. The Trade Desk — Koa Agents / Kokai agentic coverage (AdTech Radar, Digiday), accessed 2026-06-20. *Koa Agents + Kokai Adaptive Trading Modes (agentic AI) to select agencies late 2025, broad early 2026; Claude-powered campaign agent. TTD ships its own agent natively — channel-conflict risk for Sigma's wrapper role.* https://adtechradar.com/2026/04/21/the-trade-desk-koa-agents-agentic-media-buying/ ; https://digiday.com/media-buying/inside-the-trade-desks-claude-powered-campaign-agent/\n15. AdExchanger (\"A Rundown Of (Pretty Much) Every Ad Tech Deal Of 2025\") and FE International agency-M&A outlook, accessed 2026-06-20. *2025–2026 deals: Mediaocean/Innovid, TTD/Sincera, Publicis/Lotame, Experian/Audigent; ~80% of top-80 digital media agencies have taken PE/VC. Used for the consolidation map.* https://www.adexchanger.com/platforms/a-rundown-on-pretty-much-every-ad-tech-deal-of-2025/ ; https://www.feinternational.com/blog/agency-marketing-ma-consolidation-ai-exit-opportunities\n16. eMarketer, \"FAQ on ad agencies: Consolidation, AI disruption, and what's changing in 2026,\" accessed 2026-06-20. *Omnicom–IPG merger (largest holdco; FCB/MullenLowe/DDB retired; ~4,000 jobs; $750M savings); 60% of US senior marketers cut agency spend in 2025 citing AI; 82% of ANA members run in-house agencies; Big Six US ad-spend share fell to 29.6% (Q1 2024) from 44.6% (2019). Used for the AI-capital-intensity / in-housing drivers behind consolidation.* https://www.emarketer.com/content/faq-on-ad-agencies--consolidation--ai-disruption--what-s-changing-2026"}, {"order": 22, "file": "Future_Trajectory.md", "title": "MiQ: Future Trajectory", "summary": "", "body": "# MiQ: Future Trajectory\n\n## Bottom Line\n\nThe question for MiQ through 2029 is not whether the programmatic squeeze ends in collapse — it most likely does not — but by which exit MODALITY MiQ leaves its independence. The strongest driver is the Bridgepoint clock: a September 2022 debt-funded buyout, financed by Pemberton, that puts the asset in a 2026-2028 forced-transaction window with the ad-tech IPO door shut behind The Trade Desk's roughly 68% derating. The modal terminal state is a **strategic sale** that ends MiQ's independence (35-43%) — to a holdco via the Dentsu license-then-buy on-ramp, to a challenger network, or to an SSP/curation/data player that wants the owned ~90M-household CTV/ATV footprint and the 15-year Sigma corpus. Co-modal and nearly as likely: **persisting as an independent** going concern (24-32%) through a secondary buyout, continuation fund, or recap — exits that preserve the standalone trajectory while margins bleed slowly under SPO and TTD pressure. The bear tail — the one threat MiQ does not defeat, **erosion or distress** from agentic commoditization of trader labor plus a supplier seam break — runs 15-22%, capped below the MediaMath outcome because MiQ is profitable and scaled. The **software re-rating** bull case, in which Sigma becomes a real margin story before agentic AI makes the human layer redundant, is the least likely terminal state at 10-16%; even where it works, it most plausibly lifts the exit multiple rather than guaranteeing enduring independence. The honest read is two co-modal outcomes whose overlapping ranges are themselves the signal: the result turns on exit modality, the highest-information event to watch from Q4 2026 onward.\n\n## Method\n\nThis is a probabilistic forecast through 2029, weighting each estimate by how well it survives the evidence rather than by simple averaging. There is no useful market signal: MiQ is private, no liquid MiQ-specific market exists, and the only adjacent markets are thin, resolved TTD-earnings contracts. The forecast therefore rests on reference-class base rates and structured decomposition, not market prices.\n\nIt is anchored on a handful of base rates: the liquidity-event distribution for mid-market independent ad-tech intermediaries since roughly 2015 (absorption ~45-55%, independence-persistence ~30-40%, failure ~12-20%); the PE sponsor exit-route distribution for a services-led asset at a 4-7 year hold (trade/strategic sale modal ~45-55%, secondary buyout/continuation ~25-30%, IPO ~10-15%); the success rate of services firms attempting a \"become-a-software-company\" margin re-rating (~2 in 10); and the disorderly-failure rate within a disruption wave (~12-14%, raised for correlated failure factors and the leveraged clock, lowered for MiQ's profitability and owned TV data). The markets checked — Polymarket and Manifold — returned only resolved, thinly traded TTD and Amazon contracts, so the formal market signal is effectively null. The horizon throughout is through 2029, tracking Bridgepoint's 2026-2028/29 exit window.\n\nThe decisive analytical move is a distinction about routing. A secondary buyout, continuation fund, or recap PRESERVES standalone independence, so it belongs in \"Persisting Independent,\" not in the acquisition bucket. Honoring that distinction cuts the strategic-sale slice to 35-43% — an estimate that runs to the low-40s once non-sale exits double-counted as sales are stripped out — and sets persistence at 24-32%. The surviving disagreement is over WHICH outcome leads — strategic sale versus persisting independent — not over whether the squeeze ends in collapse. One reading makes the PE clock dominant and treats most survival as routing through a transaction, pushing the sale higher; the other holds that a thin-IPO market makes sponsors REACH for continuation vehicles (a competitive non-event), and that in-housing's hybrid plateau protects trader labor longer than the extinction narrative dates it, keeping standalone-persistence co-modal. Both readings hold up, so the gap stays as overlapping ranges rather than collapsing into false precision. A secondary tension — whether agentic commoditization is fast or slow — keeps the Erosion floor deliberately wide at 15-22%.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios — through 2029<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Strategic Sale / Absorptio…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"356.9\" y=\"8\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"404.1\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">35–43%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Persisting Independent — R…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"302.8\" y=\"44\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"350.1\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">24–32%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Erosion / Distress — Agent…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"258.6\" y=\"80\" width=\"34.4\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"301.0\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">15–22%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Software Re-Rating — Sigma…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"234.1\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"271.6\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">10–16%<\/text><\/svg><figcaption> <span class=\"credit\">Source: Forecast scenarios, 2026-06-20.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario 1: Strategic Sale / Absorption — Bridgepoint exits MiQ to a strategic, ending independence\n\n**Probability: 35-43%.** This is the modal terminal state, though deliberately set below 50%.\n\n**Description.** Bridgepoint's September 2022 debt-funded buyout puts MiQ in a 2026-2028 forced-transaction window. With the post-TTD-derating IPO door shut, the rational route is a strategic trade sale: to a holdco via the Dentsu license-then-buy on-ramp, to a challenger network of the Stagwell archetype, or to an SSP, curation, or data player that wants the owned ~90M-household CTV/ATV footprint and the 15-year Sigma corpus. Independence ends; the brand may persist as a unit; trader labor is partly rationalized; and the Sigma re-rate narrative reads, in part, as exit dressing. This bucket is the strategic-sale slice ONLY — sponsor-to-sponsor secondaries and continuation vehicles, which preserve the standalone trajectory, are booked in \"Persisting Independent.\"\n\n**How this number was derived.** Decomposition. P(Bridgepoint pursues exit by 2029 | 2022 debt-funded buyout, ECI already realized 6.1x) ≈ 0.82, multiplied by P(route is a STRATEGIC sale in-window, NOT IPO and NOT a secondary/continuation preserving standalone | thin IPO market, secondaries 25-30% of exits) ≈ 0.50, giving ≈ 0.41, trimmed to 35-43% for slippage past 2029. A higher 42-52% reading does not hold: it double-counted secondaries and continuations as \"sales,\" and once that mass is re-routed the sale-specific slice settles around 30-45%, centering on ≈ 0.41. It is modal but below 50% precisely because the non-sale exits sit in the next bucket.\n\n**Drivers.** The Bridgepoint PE clock — the September 2022 debt-funded buyout opening a 2026-2028 window, with the ECI minority already exited at 6.1x, confirming the asset trades. A shut ad-tech IPO window after the 2025 TTD ~68% derating, pushing exit toward a trade sale. An owned, separable 90M-household CTV/ATV footprint plus the 15-year Sigma data corpus as the scarce acquirable asset. The Dentsu license-then-buy path as a natural acquirer on-ramp. And the M&A roll-up — Pathlabs, Adsmovil — reading as build-to-sell packaging.\n\n**Conditions.** Bridgepoint pursues a liquidity event by 2029 (~0.80-0.85); the realized route is a strategic sale, not an IPO, secondary, or continuation; and a strategic buyer values the footprint enough to absorb it rather than leave it standalone.\n\n**Signals to watch.** A banker mandate, dataroom, or \"exploring strategic options\" report on MiQ (Digiday, Axios, FT) from Q4 2026 onward is the highest-information signal. Watch Dentsu deepening from license to equity or option; founder or CEO equity-rollover and retention language; a messaging shift from \"largest independent\" to platform-asset value; and a comparable PE-held intermediary selling to a strategic in 2026-2027, resetting the comp.\n\n**Time horizon.** Through 2029, with the exit window concentrated in 2026-2028.\n\n### Scenario 2: Persisting Independent — Recap, Secondary Buyout, or Continuation; Aggregator Survives, Margins Bleed\n\n**Probability: 24-32%.** Co-modal with the sale.\n\n**Description.** MiQ remains an independent going concern through 2029 via a liquidity event that is NOT a strategic sale — a secondary buyout, continuation fund, or recap — or Bridgepoint simply holds past 2029. It keeps operating as \"the largest independent programmatic partner\": the neutral harmonizer holdcos both fear and need, the can't-in-house partner for mid-market and indie agencies (Pathlabs MEP), and the owner of the 90M-household CTV/ATV footprint. Margins stay services-shaped (~9-15%) and erode slowly under SPO, curation, and TTD pressure; Sigma is a real efficiency layer but NOT a disclosed software-margin business. Survival-as-independent and margin-bleed are one world here — counterparties cooperate because TTD keeps MiQ as re-routable non-Certified spend, and suppliers keep selling to a scaled, non-exclusive buyer.\n\n**How this number was derived.** Base rate plus exit-route decomposition. Of roughly 8-10 squeezed independents, about 3-4 stayed durable past their inflection, giving a ~35% persistence base rate; this is conditioned by P(Bridgepoint LETS it stay independent | survives) ≈ 0.6 given a seven-year-held debt-funded buyout, plus the secondary/continuation share (~0.80 exit × ~0.30 non-sale-route ≈ 0.24 of mass) that an \"Acquired\" framing wrongly absorbs. This lands at 24-32%. A higher 38-46% reading does not hold: it over-weights smooth continuity and never multiplies by the conditional that the clock lets MiQ stay independent, centering the reconciled estimate at ≈ 0.27. It is co-modal with the sale, and the disagreement over which one leads is itself signal on how contingent the outcome is.\n\n**Drivers.** This scenario defeats the transparency strand (the model is disclosed-by-birth) and the in-housing strand — in-housing has plateaued at roughly 25% full and ~51% hybrid, skills bind about three-quarters of advertisers, and the mid-market can't in-house. Multi-DSP optionality matters: MiQ is NOT a TTD Certified Service Partner and is free to re-route. Suppliers' dominant strategy is to keep selling to a scaled, non-exclusive buyer. Secondary buyouts and continuation funds are a rising share of PE exits in a thin-IPO market. And the CTV/ATV linear-migration tailwind keeps demand growing.\n\n**Conditions.** Bridgepoint's event is a secondary, continuation, or recap, OR it holds past 2029; agentic commoditization stays slower and more partial than 2029 allows; and no core supplier seam breaks and no large mid-market account defects at scale.\n\n**Signals to watch.** Bridgepoint announcing a secondary sale to another sponsor or a continuation vehicle is this scenario's marker. Watch headcount holding around 1,900 or growing through 2027 (Revelio) with no sale process; no disclosed SaaS revenue line emerging (persistence WITHOUT software transformation); Pathlabs MEP and Adsmovil continuing to post growth with mid-market retention holding; and hybrid in-housing staying dominant versus full in-housing breaking out in IAB and IPA data.\n\n**Time horizon.** Through 2029, with the persistence read extending beyond.\n\n### Scenario 3: Erosion / Distress — Agentic Commoditization + Supplier Seam Break → Margin Collapse or Distressed Sale\n\n**Probability: 15-22%.** The bear tail — the ONE threat MiQ does not defeat.\n\n**Description.** Agentic AI commoditizes managed-service trader labor FASTER than Sigma converts MiQ into a defensible software or data layer, AND/OR a discrete supplier seam breaks — Samba, Titan, or Experian acquired by a rival, or Samsung, LG, or Roku pulling ACR in-house — repricing the rented moat. Single-platform agents (TTD's, Amazon's, Yahoo's) plus SPO and curation collapse the contestable middle; the performance claims have no independent validation; and Pemberton leverage on a ~9-11% margin amplifies any compression. The PE clock sharpens the scenario, converting a shopped-but-unsold process into a distressed mark — the MediaMath path, though more likely a haircut sale than a zero, given MiQ's profitability and scale.\n\n**How this number was derived.** Reference-class plus correlated-conjunction. Of roughly 7-10 desk and intermediary lineages, about 1-2 ended in distress or failure (MediaMath $1B→0, Sizmek), giving a ~12-20% base rate. The chained factors — agentic erosion, Sigma non-conversion, and tip-to-distress — are POSITIVELY correlated (one weak-software root cause), so a naive 0.55³ ≈ 0.17 UNDERSTATES the joint tail, and the floor is nudged up. A standalone 20-30% supplier-shock estimate does not hold: its ~7%/year hazard was unanchored, and Xandr was a re-routable rail rather than a fatal data defection — so that risk belongs here as a contributor, not as its own outcome. The scenario is capped below ~22% because MiQ is profitable and scaled, unlike MediaMath, making distress more likely a haircut sale than a zero, centering the estimate at ≈ 0.18.\n\n**Drivers.** Agentic commoditization of trader labor — the bear strand that holds up, where Sigma is itself the threat to the labor funding most revenue. Rented data plus acute supplier concentration — Samba, Experian, and Titan also sell the same signal to everyone, including rivals. No independent Forrester, Gartner, or G2 validation of the performance or agentic claims. Pemberton debt on a thin-margin base, which converts compression into distress. And a shopped-but-unsold process converting forced-exit pressure into a distressed mark, with failure factors positively correlated.\n\n**Conditions.** Agentic erosion bites before Sigma books a defensible software line; a supplier seam breaks via acquisition-by-rival or ACR in-housing (rarer than gradual compression); and margin compresses toward or below debt-service, or a sale process fails into a soft market.\n\n**Signals to watch.** A named supplier (Samba, Titan, Experian) acquired by TTD, Amazon, or a walled garden, OR Samsung, LG, or Roku restricting third-party ACR at scale. The Sigma Trading Agent staying \"announced-not-shipped\" past 2027. Trader-org layoffs framed as \"AI efficiency\" but NOT offset by software revenue, with visible margin compression. A covenant breach, refinancing, or down-round/distressed-secondary mark on the Pemberton debt. And a leaked failed sale process (\"shopped, no buyer\").\n\n**Time horizon.** Through 2029, acute in 2027-2029 for the agentic leg.\n\n### Scenario 4: Software Re-Rating — Sigma Becomes a Real Margin Story (bull)\n\n**Probability: 10-16%.** The least common terminal state for a services intermediary.\n\n**Description.** The equity story works: Sigma moves MiQ materially from labor toward software and data margins BEFORE agentic AI makes the human layer redundant. A disclosed or de-facto platform-revenue mix emerges; the Trading Agent scales agentic buying across the book on the 15-year proprietary corpus and the neutral cross-platform position (the one moat single-platform agents lack); margins climb off the ~9-11% floor toward the high-teens or twenties; and MiQ re-rates as a platform. Even where it works, it most plausibly raises the EXIT multiple rather than securing enduring independence.\n\n**How this number was derived.** Decomposition — and the one point where every independent reading converges, landing 8-18% by separate routes, itself strong corroboration. P(Sigma converts to a disclosed/validated software-margin line by 2029 | announced-not-shipped, NO Forrester/Gartner/G2) ≈ 0.30-0.35, multiplied by P(it durably re-rates MiQ rather than merely lifting the exit multiple | even success often cashes out as a higher acquisition price) ≈ 0.45, giving ≈ 0.14, set at 10-16%. Only the top is trimmed, because every Sigma metric traces to a single vendor-voiced source and PPC Land flags the $2.22/$1 figure as covering the OLD platform, centering the estimate at ≈ 0.13.\n\n**Drivers.** Sigma is real and live (June 2025): roughly 600 feeds, 2.5PB/day, an agentic Trading Agent on 15 years of proprietary data. The proprietary data corpus plus the neutral cross-platform position is a moat single-platform agents lack. The PE incentive is aligned — the equity story REQUIRES the labor-to-software shift before exit. And commerce/retail-media (~15.6% of ad revenue) plus the TV-data footprint feed Sigma differentiated inputs.\n\n**Conditions.** Sigma ships a disclosed, independently-validated software or data line by 2029; conversion outruns agentic commoditization of MiQ's own labor; and the re-rate survives the TTD/Amazon squeeze AND PE doesn't simply sell pre-re-rate.\n\n**Signals to watch.** A DISCLOSED Sigma software or platform revenue line or ARR (none exists as of June 2026) is the single clearest tell. Watch for first independent validation — a Forrester Wave, Gartner MQ, G2, or candid named buy-side testimony (absent today); group margin climbing out of the ~10% band toward the high-teens; the Trading Agent moving from \"announced/~6,000 campaigns\" to verified at-scale autonomous buying, externally benchmarked; and a marquee deal where a holdco runs ON Sigma as software, not as MiQ-managed service (Dentsu).\n\n**Time horizon.** Through 2029.\n\n## Base Rates\n\nSix reference cases anchor the four scenarios; together they are the spine of the whole forecast.\n\n**Mid-market independent ad-tech/programmatic intermediaries reaching a liquidity event since ~2015** — MediaMath, Xandr buy-side, Sizmek, DataXu, Basis/Centro, Amobee, Quantcast, Cadent, Adform, and the holdco desks. Of roughly 8-10 clean comparables, about 4-5 were absorbed or cleanly acquired, 3-4 stayed independent five-plus years, and 1-2 failed — implying absorption ~45-55%, independence-persistence ~30-40%, failure ~12-20%. This is the spine of all four scenarios. Weak comparables that inflate the survival rate are excluded — TTD is a public scaled DSP; Criteo and Cardlytics are public venture-graduated firms, not PE-clock-bound private services roll-ups.\n\n**PE sponsor exit-route distribution for a services-led asset at a 4-7 year hold** — trade/strategic sale modal ~45-55%, secondary buyout/continuation fund ~25-30% (rising in the thin-IPO 2022-2026 market), IPO ~10-15%. Bridgepoint's September 2022 buyout puts MiQ in a 2026-2028/29 window, making SOME exit near-certain (~0.80-0.85; the ECI minority already exited 6.1x / 47% IRR). The critical routing rule: ONLY a strategic sale ends standalone independence; secondary, continuation, and recap exits preserve it and belong in \"Persisting Independent\" — conflating them over-states the acquisition discontinuity.\n\n**Services/agency-led firms attempting a \"become-a-software-company\" margin re-rating** — holdco desks, MediaMath's pivot, Criteo, S4/Media.Monks. Roughly 2 in 10 achieved durable software economics, and it took longer than one PE hold — a ~20% success base rate. This is the floor under \"Software Re-Rating\" as the least likely terminal state.\n\n**Intermediary disintermediation / in-housing** — in-housing plateaued into a hybrid equilibrium (~25% full, ~51% hybrid), with recruitment and skills the binding constraint for about three-quarters of advertisers; intermediaries REPOSITION as specialists rather than vanish, so roughly two-thirds or more persist in some form. This grounds \"Persisting Independent\" and shows the smooth agentic-extinction narrative is over-dated — but most persistence routes through a sale, so the genuinely standalone slice is narrower than the raw base rate.\n\n**Intermediary-generation disorderly-failure rate within a disruption wave** — of about 7 named desk lineages (Xaxis, Accuen, Cadreon, Amnet, Affiperf, VivaKi, MediaMath), roughly 1 hit outright bankruptcy (MediaMath, $1B→0, 2023), a ~12-14% base rate; adjusted up for positively-correlated failure factors and the Pemberton-leveraged PE clock, down for MiQ's profitability and owned TV data that MediaMath lacked. This anchors \"Erosion/Distress.\"\n\n**Aggregator-on-rented-data moats when suppliers vertically integrate** — the integration layer typically SURVIVES (it re-routes around any single feed) but as a margin-compressed commodity; supplier defection requires the rarer acquisition-by-rival trigger. This is why a supplier shock is folded into \"Erosion/Distress\" as a contributor, NOT a standalone terminal scenario — the standalone 20-30% version of that risk does not survive scrutiny. Realized rail mortality corroborates the mechanism: Microsoft Invest / Xandr buy-side was confirmed dead Feb 28 2026, proving a counterparty can die on a date — but a re-routable buying RAIL under multi-DSP optionality is a margin event, not a fatal one, a different mechanism from a unique DATA-supplier defection.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n|---|---|---|---|---|\n| Polymarket | Will Trade Desk (TTD) beat quarterly earnings? (non-GAAP EPS, 02-25-2026) | Resolved YES; not live | ~$7,864 (thin) | 2026-06-20 |\n| Polymarket | Will Trade Desk (TTD) beat quarterly earnings? (non-GAAP EPS, 05-07-2026) | Resolved NO; not live | ~$2,400 (thin) | 2026-06-20 |\n| Polymarket | Will The Trade Desk (TTD) be the worst-performing company in the Nasdaq 100 during December 2025? | Resolved NO; not live | ~$2,336 (thin) | 2026-06-20 |\n| Manifold | Will Amazon Prime Video repeal their Prime-with-ads tier in 2024? | Resolved NO; not live | 227 MANA (negligible) | 2026-06-20 |\n\nNo market signal bears directly on MiQ. MiQ is private, and as of mid-2026 the question is simply absent from liquid markets: every adjacent contract is resolved, thinly traded, and points at The Trade Desk or Amazon rather than at MiQ's exit modality or Sigma's monetization. The one indirect read is ambivalent — TTD beat its February 2026 EPS bar, missed its May 2026 one, and avoided being December 2025's single worst Nasdaq-100 name, mildly inconsistent with a clean \"TTD in free-fall\" story but doing nothing to reopen the shut ad-tech IPO window. Because no market prices MiQ's terminal state, the forecast rests entirely on the reference-class base rates and the decomposition above, not on market consensus. If a liquid market on a MiQ liquidity event ever appears, it would immediately become the highest-weight input and should replace this snapshot.\n\n## What Would Change My Forecast\n\n1. **Bridgepoint exit MODALITY** — a strategic trade sale (→ Strategic Sale), versus a secondary buyout / continuation / recap (→ Persisting Independent), versus an IPO filing (→ Software Re-Rating), versus shopped-but-unsold (→ Erosion/Distress). This is the single highest-information event; watch for banker mandates, a dataroom, or \"strategic options\" reporting from Q4 2026 onward.\n2. **A disclosed Sigma SaaS / licensed-data revenue line** with real dollars and margin (none exists as of June 2026) — the clearest tell separating a bleeding aggregator from a platform re-rating; its absence through 2027 hardens the modal pair.\n3. **First INDEPENDENT validation of Sigma's performance/agentic claims** — a Forrester Wave, Gartner MQ, G2, or candid named buy-side testimony, all absent today; arrival re-rates probability toward the durable and re-rating scenarios.\n4. **A core supplier (Samba, Titan OS, Experian) ACQUIRED by TTD/Amazon/a walled garden, OR Samsung/LG/Roku pulling ACR fully in-house at scale** — this fires Erosion/Distress; gradual price compression alone does NOT, because suppliers keep selling.\n5. **TTD/Amazon/DV360 shipping mid-market self-serve agentic buying at scale before MiQ books a disclosed software line, OR a vendor shipping autonomous no-human-gate production buying** — shifts weight to Erosion/Distress.\n6. **A distress signal** — a Pemberton covenant breach or refinancing stress, a down-round mark, or >15% trading-staff layoffs not offset by software revenue — raises Erosion/Distress and lowers the odds of a clean exit.\n7. **A strategic/holdco buyer publicly naming MiQ or its TV-data footprint** (especially Dentsu deepening from license to equity) — concentrates probability on Strategic Sale.\n\n## Open Questions\n\n- **Which outcome actually leads?** The forecast leaves Strategic Sale (35-43%) and Persisting Independent (24-32%) co-modal with overlapping ranges by design. The open question: does the PE clock dominate (most survival routes through a transaction), or does a thin-IPO market make sponsors reach for continuation vehicles as a competitive non-event? This is genuine contingency, not measurement error.\n- **How fast does agentic commoditization bite?** Reasonable readings split on whether agentic erosion of trader labor is fast or slow, which is why the Erosion floor stays wide at 15-22%. The pace — and whether Sigma's own automation is the cure or the accelerant of the disease — is the key unknown under the bear tail.\n- **Can Sigma's metrics survive independent scrutiny?** Every Sigma performance figure traces to MiQ's own vendor-voiced disclosures, with no Forrester/Gartner/G2 validation; the $2.22/$1 ROI claim reportedly covers the OLD platform. Whether the agentic Trading Agent is real at scale or merely \"announced-not-shipped\" is unresolved, and it gates the entire bull case.\n- **Does a Sigma re-rate buy independence or just a higher exit price?** Even in the bull case, it is more plausible that a successful re-rate lifts the acquisition multiple than that it secures enduring standalone life. The terminal form of a successful Sigma is itself open.\n- **How much does the Pemberton leverage actually constrain Bridgepoint?** The debt amplifies any margin compression into distress, but the precise covenant structure and headroom are not disclosed, leaving the distress-versus-haircut-sale boundary fuzzy.\n\n## Sources\n\nThe reference cases and present-tense anchors most load-bearing here are:\n\n- ECI Partners, \"ECI announces realisation of MiQ for 6.1x return,\" 13 Sept 2022 — 2017 minority entry, 6.1x return, ~5-year hold (anchors the PE clock and exit-route base rate). https://www.ecipartners.com\n- MiQ, \"MiQ announces partnership with private equity firm Bridgepoint,\" 13 Sept 2022, and Bridgepoint / PrivSource deal records — majority stake, ~$900M-$1B valuation, buy-and-build mandate.\n- Pemberton Asset Management, \"Pemberton Supports Bridgepoint's Acquisition of MiQ,\" completed 22 Nov 2022 — confirms the acquisition debt financing that leverages the margin base. https://www.pembertonam.com\n- Marketing Dive / AdExchanger, on MediaMath Chapter 11, July 2023 — the $1B→0 failure case anchoring the Erosion/Distress base rate. https://www.marketingdive.com/news/mediamath-files-bankruptcy-dsp-programmatic/686006/\n- Globe and Mail / Marketecture (Gurman Hundal profile) coverage of TTD's ~68% 2025 decline, ~$18B market cap, and Amazon's funded comparative DSP tests — the shut-IPO-window driver.\n- MiQ / Business Wire, \"MiQ Sigma Breaks the Fragmentation Cycle,\" 4 June 2025 — Sigma launch facts: 300+ feeds, 700T signals, three-LLM agentic Trading Agent on 15 years of proprietary data. https://www.businesswire.com/news/home/20250604957858/en/\n- MiQ / Business Wire, \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate,\" 11 June 2026, and PPC Land, \"MiQ upgrades Sigma a year in,\" 11 June 2026 — the present-state update (2.5PB/day, 600+ feeds, 40,000+ campaigns, 2,300+ advertisers, $2.22/$1 covering the OLD platform). https://ppc.land/miq-upgrades-sigma-a-year-in-planning-agent-and-2-5pb-of-daily-data/\n- Dentsu / MiQ, \"Dentsu Selects MiQ Sigma to Help Power Next Gen Media Operations,\" 12 June 2025 — the holdco license-then-buy on-ramp. https://www.dentsu.com/news-releases/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations\n- Digiday, \"Microsoft Advertising is closing the Xandr DSP,\" 14 May 2025, and follow-on coverage confirming the Feb 28 2026 shutdown — realized rail mortality versus fatal data defection.\n- WARC / IAB Europe \"Attitudes to Programmatic Advertising\" (Nov 2024); AdExchanger / IAB on agencies falling into specialist roles; Chief Marketer / IAB-Accenture on in-housing — the in-housing hybrid-plateau base rate. https://www.warc.com/newsandopinion/opinion/programmatic-in-housing-hybrid-models-let-advertisers-take-control/2745\n- PPC.land + AdTechRadar + Amazon Ads on Amazon Ads Agent, Google Ads Advisor, and the IAB Tech Lab Agentic RTB Framework (Nov 2025) — the agentic-commoditization driver. https://ppc.land/amazon-launches-ai-agent-for-automated-campaign-management/\n- Prediction markets (checked 2026-06-20): Polymarket TTD non-GAAP EPS markets (https://polymarket.com/event/ttd-quarterly-earnings-nongaap-eps-02-25-2026-0pt58 ; https://polymarket.com/event/ttd-quarterly-earnings-nongaap-eps-05-07-2026-0pt32 ; https://polymarket.com/event/nasdaq-100-worst-performance-december) and Manifold (https://manifold.markets) — all resolved, thin, and only indirectly related; no MiQ-specific market exists."}], "glossary": [{"term": "ACR", "aliases": ["Automatic Content Recognition", "automatic content recognition", "ACR data", "ACR panel"], "def": "A feature built into many smart TVs that identifies what's on screen by sampling and fingerprinting the video, so a company can tell what a household is watching and use that to target or measure ads."}, {"term": "AdCP", "aliases": ["Ad Context Protocol"], "def": "An open technical standard for advertising, built on top of MCP, that lets an automated buying agent and an automated selling agent exchange details like audiences, inventory, and deal terms in a shared machine-readable language."}, {"term": "addressable linear", "aliases": ["addressable TV"], "def": "Traditional broadcast or cable television that has been made targetable household-by-household, rather than showing the same ad to every viewer of a channel."}, {"term": "agentic advertising", "aliases": ["agentic AI", "agentic buying", "agent-to-agent advertising"], "def": "The use of autonomous AI software agents that can plan and carry out multi-step media-buying tasks - setting up, running, and adjusting an ad campaign - with little step-by-step human input, and in the most advanced form, agents on the buyer's and seller's sides negotiating and transacting directly with each other."}, {"term": "AVOD", "aliases": ["ad-supported streaming", "ad-supported video on demand"], "def": "Streaming video that is free or low-cost to watch because it is paid for by advertising, as opposed to a subscription with no ads."}, {"term": "clean room", "aliases": ["clean rooms", "AWS Clean Rooms"], "def": "A privacy-protected computing environment where two companies can match their separate customer data sets against each other to measure results, without either side seeing the other's raw, individually identifiable records."}, {"term": "commerce media", "aliases": ["retail media", "retail media network", "RMN", "RMNs"], "def": "Advertising sold using a company's own shopper or transaction data; the largest slice of it is retail media, where a retailer sells ads on its own site, app, or in its stores using data about what customers actually buy."}, {"term": "curation", "aliases": ["curated marketplace", "curated deals"], "def": "The practice of a supply-side company packaging enriched audience data together with pre-vetted, high-quality ad inventory into a single ready-to-buy deal, so an advertiser gets a shortcut to a trustworthy slice of the market instead of buying blind on the open exchange."}, {"term": "DSP", "aliases": ["demand-side platform", "demand-side platforms"], "def": "Software that an advertiser or its agency logs into to bid, in real time, on individual ad slots across websites, apps, and streaming TV - the buyer's-side counterpart to a publisher's ad-selling software."}, {"term": "EBITDA", "aliases": ["EBITDA margin"], "def": "Earnings before interest, tax, depreciation, and amortization - a rough measure of a company's underlying cash profit that private-equity investors commonly use to judge how healthy a business is, independent of how it's financed or taxed."}, {"term": "FAST channel", "aliases": ["FAST channels", "FAST"], "def": "A free, ad-supported streaming TV channel that plays a set lineup of programming like a traditional broadcast channel, rather than letting the viewer pick what to watch on demand."}, {"term": "GDPR", "aliases": ["General Data Protection Regulation"], "def": "The European Union's comprehensive privacy law, which generally requires a company to have a valid legal basis - usually the person's consent - before it can collect or use someone's personal data."}, {"term": "hashed email", "aliases": ["HEM", "hashed emails"], "def": "A person's email address that has been run through a scrambling function so it can be matched against other scrambled copies of the same address without ever exposing the actual email in plain text - used as a privacy-safer way to recognize the same person across different services."}, {"term": "identity graph", "aliases": ["identity resolution", "cross-device identity graph", "device graph"], "def": "A database that links together the various devices, browsers, and identifiers belonging to the same real person or household, so an advertiser can recognize and target that person consistently across a phone, a laptop, and a smart TV."}, {"term": "IDFA", "aliases": ["Identifier for Advertisers"], "def": "A unique code Apple assigns to each iPhone or iPad that advertisers historically used to track a person's activity across different apps for targeting and measurement, now available only if the user explicitly opts in."}, {"term": "in-housing", "aliases": ["programmatic in-housing"], "def": "A brand's move to bring media-buying work that used to be outsourced to an agency or trading desk inside the company itself, running its own team and holding its own advertising-platform accounts directly."}, {"term": "invalid traffic", "aliases": ["IVT"], "def": "Ad impressions, clicks, or views generated by bots, fraud schemes, or other non-human or illegitimate activity rather than real people, which advertisers pay for but get no genuine value from."}, {"term": "IPO", "aliases": ["initial public offering"], "def": "The process by which a private company sells shares to the public for the first time and becomes listed on a stock exchange - one of the ways a private-equity owner can cash out of an investment."}, {"term": "LBO", "aliases": ["leveraged buyout"], "def": "An acquisition of a company that is financed substantially with borrowed money, with the target company's own future cash flow expected to pay down that debt over time."}, {"term": "log-level data", "aliases": ["LLD", "raw log-level data"], "def": "The raw, impression-by-impression record of exactly where each individual ad ran, what was paid, and what fees were taken at each step along the way - the detailed receipt behind a campaign, as opposed to a rolled-up summary report."}, {"term": "made-for-advertising", "aliases": ["MFA", "made-for-arbitrage"], "def": "Websites built primarily to cram in as many ad slots as possible and attract cheap, often purchased traffic, rather than to serve readers with genuine content - inventory that looks legitimate in a media plan but delivers little real audience attention."}, {"term": "managed service", "aliases": ["managed-service model", "managed trading desk"], "def": "A way of buying advertising in which the vendor's own staff plan, run, and optimize a client's ad campaigns on the client's behalf - as opposed to self-serve, where the client licenses software and operates it with its own people."}, {"term": "MCP", "aliases": ["Model Context Protocol"], "def": "An open technical standard, originally created by Anthropic, that lets AI models connect to outside tools, data, and services in a consistent way - a general-purpose connector that other more specific standards, like advertising's AdCP, are built on top of."}, {"term": "MEP", "aliases": ["Media Execution Partner"], "def": "A company that runs an advertising agency's paid-media campaigns behind the scenes, under the agency's own brand, so the agency can offer programmatic or CTV advertising to its clients without building an in-house buying team."}, {"term": "MOIC", "aliases": ["money multiple", "multiple of invested capital"], "def": "A measure of investment return showing how many times over an investor got its original money back - a MOIC of 6x means six dollars returned for every dollar invested."}, {"term": "OpenPath", "aliases": [], "def": "The Trade Desk's initiative to connect its ad-buying platform directly to publishers, cutting out extra layers of intermediaries in the supply chain between advertiser and publisher."}, {"term": "PMP", "aliases": ["private marketplace", "private marketplace deal", "PMP deals"], "def": "An invitation-only ad-buying arrangement between a specific advertiser and a specific set of named publishers, as opposed to the wide-open public ad exchange where anyone can bid."}, {"term": "principal-based buying", "aliases": ["principal trading", "non-disclosed", "arbitrage"], "def": "A way of buying ad inventory where the buyer purchases impressions at one price and resells them to its client at a marked-up price without disclosing the difference, pocketing the spread - the opaque practice a wave of transparency reforms in the late 2010s pushed the industry away from."}, {"term": "programmatic", "aliases": ["programmatic advertising"], "def": "The automated, auction-based buying and selling of digital ad space, where software places bids on individual ad impressions in real time rather than a human negotiating each placement."}, {"term": "SPO", "aliases": ["supply-path optimization", "supply path optimisation"], "def": "The practice of deliberately shortening and simplifying the chain of middlemen between an advertiser and a publisher, cutting out redundant resellers so more of the ad budget reaches actual working media instead of being skimmed off as fees."}, {"term": "SSP", "aliases": ["supply-side platform", "supply-side platforms"], "def": "Software that publishers use to offer their ad space for sale into the automated bidding marketplace - the seller's-side counterpart to an advertiser's demand-side platform."}, {"term": "STB data", "aliases": ["set-top-box data"], "def": "Viewing data collected from cable or satellite boxes that records what channel or program a household's television is tuned to, used as one input for measuring TV audiences."}, {"term": "supply-path-transparency", "aliases": ["working media", "working-media share"], "def": "The share of an advertiser's ad dollar that actually buys a real, viewable ad impression seen by a person, after fees and waste are stripped out along the buying chain - and the broader push to make that chain and its costs visible to the advertiser."}, {"term": "take rate", "aliases": ["blended take rate", "platform fee", "blended fee"], "def": "The cut of the advertising money passing through a platform or media partner that the company keeps for itself as its own revenue."}, {"term": "TCF", "aliases": ["Transparency & Consent Framework", "TC String"], "def": "A technical system, run by the European trade group IAB Europe, that records and passes along a website visitor's consent choices about data use so that advertising partners in the bidding chain can see what the person has agreed to."}, {"term": "TVQI", "aliases": ["TV Quality Index"], "def": "A scoring system built by The Trade Desk that rates connected-TV ad inventory on factors like content quality, how transparent the publisher is, and relevance to the advertiser, used to help buyers judge which streaming inventory is worth paying a premium for."}, {"term": "UID2", "aliases": ["Unified ID 2.0", "RampID", "EUID"], "def": "An industry-standard identifier, built from a hashed email or phone number, that lets advertisers recognize and target the same person across different websites and apps without relying on browser cookies - one of several competing 'durable ID' systems, alongside LiveRamp's RampID and the EU-specific EUID, meant to work even as cookies disappear."}, {"term": "VPPA", "aliases": ["Video Privacy Protection Act"], "def": "A 1988 US federal law, originally passed after a newspaper published a Supreme Court nominee's video-rental history, that bars video providers from disclosing what someone watched together with information that could identify them, without consent - now a live legal risk for streaming and connected-TV data practices."}, {"term": "walled garden", "aliases": ["walled gardens"], "def": "A large platform such as Amazon, Google, or Meta that keeps its audience data, ad inventory, and buying tools locked inside its own closed ecosystem, so advertisers and outside data companies can't fully see or independently verify what happens there."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  var sceneTpl = document.getElementById('reader-scene-template');
  if (sceneTpl && h1 && sceneTpl.content && sceneTpl.content.firstElementChild) {
    well.insertAdjacentElement('afterend', sceneTpl.content.firstElementChild.cloneNode(true));
  }
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
const menuBtn = document.getElementById('menu-btn');
menuBtn.onclick = () => document.body.classList.toggle('menu-open');
function closeMenu() { document.body.classList.remove('menu-open'); }

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}
function chunkText(t) {
  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);
  return out;
}
function pickVoice() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  const name = sel && sel.value;
  const vs = synth.getVoices();
  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';
    tip.textContent = 'Tip: download Enhanced or Premium voices in your OS accessibility settings for much richer audio.';
    document.body.appendChild(tip); setTimeout(() => tip.remove(), 8000);
  }
}
function speakChunk() {
  if (!listening) return;
  if (lidx >= lchunks.length) {
    if (sleepMode === 'chapter') { stopListen(); return; }
    if (listenAuto && listenIdx < docs.length - 1) {
      listenIdx++; autoNext = true; show(listenIdx); autoNext = false;
      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();
    } else stopListen();
    return;
  }
  const u = new SpeechSynthesisUtterance(lchunks[lidx]);
  u.rate = listenRate; const vo = pickVoice(); if (vo) u.voice = vo;
  u.onend = () => { if (listening && !paused) { lidx++; speakChunk(); } };
  u.onerror = () => { if (listening && !paused) { lidx++; speakChunk(); } };
  synth.speak(u);
}
function startListen() {
  if (!synth) return;
  synth.cancel(); listening = true; paused = false; listenIdx = current;
  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.add('on');
  speakChunk();
}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  if (lbar) lbar.classList.remove('show');
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.remove('on');
}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }
function setSleep(sec) {
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  sleepMode = sec === 1 ? 'chapter' : 'none';
  if (sec > 1) sleepTimer = setTimeout(stopListen, sec * 1000);
}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);
  lbar.querySelector('#lb-toggle').onclick = togglePause;
  lbar.querySelector('#lb-stop').onclick = stopListen;
  lbar.querySelector('#lb-rate').onchange = function () { listenRate = +this.value; };
  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };
  populateVoices();
  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });
};
window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command
// palette jumps that land on a chapter of the corpus already open (no reload).
window.addEventListener('hashchange', () => {
  const h = location.hash.match(/^#ch-(\d+)$/);
  if (h && +h[1] !== current) show(+h[1]);
});

// Related reading at the foot of the column — corpus-level, from the inlined
// library manifest's precomputed similarity graph (no fetch). Deferred to
// DOMContentLoaded because the shell (which carries #library-manifest) is
// injected into the page AFTER this script.
function renderRelated() {
  const relEl = document.getElementById('related');
  const mEl = document.getElementById('library-manifest');
  if (!relEl || !mEl) return;
  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }
  const me = LIB.find(x => x.slug === corpus.slug);
  const rel = (me && me.related) || [];
  if (!rel.length) return;
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'
        + '<span class="related-cat">' + esc(r.category || '') + '</span>'
        + '<span class="related-t">' + esc(r.title) + '</span></a>').join('')
    + '</div>';
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {
  var bar = document.getElementById('reader-progress'); if (!bar) return;
  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }
  document.addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '620px', normal: '700px', wide: '820px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {
    contentEl.style.setProperty('--reader-fs', SIZES[fs]);
    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';
    document.body.appendChild(panel);
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var v = b.getAttribute('data-v');
      if (b.parentNode.id === 'tp-size') { fs = v; localStorage.setItem('reader-fs', v); }
      else { meas = v; localStorage.setItem('reader-measure', v); }
      applyType(); mark();
    });
  }
  btn.onclick = function (e) {
    e.stopPropagation();
    if (!panel) build();
    if (panel.classList.toggle('open')) {
      mark();
      var r = btn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      var top = r.top - panel.offsetHeight - 8;
      panel.style.top = (top < 8 ? r.bottom + 8 : top) + 'px';
    }
  };
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
})();

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;
      b.setAttribute('data-term', m.term); b.setAttribute('data-def', m.def);
      b.setAttribute('aria-label', m.term + ': ' + m.def);
      node.parentNode.insertBefore(b, after);
      used[m.term] = 1; break;                                    // one chip per text node
    }
  });
}

(function setupGlossary() {
  if (!GLOSS.length) return;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var pop = document.createElement('div'); pop.id = 'gloss-pop'; pop.setAttribute('role', 'tooltip');
  document.body.appendChild(pop);
  var hoverCap = !(window.matchMedia && window.matchMedia('(hover: none)').matches);
  var openFor = null, cEl = document.getElementById('content');
  function open(btn) {
    pop.innerHTML = '<div class="gp-term"></div><div class="gp-def"></div>';
    pop.querySelector('.gp-term').textContent = btn.getAttribute('data-term');
    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');
    pop.classList.add('open');
    var r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    var left = Math.max(8, Math.min(r.left + r.width / 2 - pw / 2, window.innerWidth - pw - 8));
    var top = r.top - ph - 8; if (top < 8) top = r.bottom + 8;
    pop.style.left = left + 'px'; pop.style.top = top + 'px'; openFor = btn;
  }
  function close() { pop.classList.remove('open'); openFor = null; }
  if (hoverCap) {
    cEl.addEventListener('pointerover', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b) open(b); });
    cEl.addEventListener('pointerout', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b && openFor === b) close(); });
    cEl.addEventListener('focusin', function (e) { var b = e.target.closest && e.target.closest('.gloss'); if (b) open(b); });
    cEl.addEventListener('focusout', function () { close(); });
  }
  cEl.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.gloss'); if (!b) return;
    e.preventDefault(); if (openFor === b) close(); else open(b);
  });
  document.addEventListener('click', function (e) {
    if (openFor && !(e.target.closest && (e.target.closest('.gloss') || e.target.closest('#gloss-pop')))) close();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.addEventListener('scroll', function () { if (openFor) close(); }, { passive: true });

  var tbtn = document.getElementById('terms-btn'); if (!tbtn) return;
  tbtn.hidden = false; var panel = null;
  tbtn.addEventListener('click', function () {
    if (!panel) {
      panel = document.createElement('div'); panel.id = 'gloss-panel';
      var sorted = GLOSS.slice().sort(function (a, b) { return a.term.localeCompare(b.term); });
      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';
      sorted.forEach(function (e) { h += '<dt>' + esc(e.term) + '</dt><dd>' + esc(e.def) + '</dd>'; });
      panel.innerHTML = h + '</dl>'; document.body.appendChild(panel);
    }
    var opened = panel.classList.toggle('open');
    if (opened) {
      var r = tbtn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();
</script>
