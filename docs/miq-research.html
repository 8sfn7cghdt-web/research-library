eady happened | Low-moderate | Not reversing; priced in |\n| **Supplier rent / disintermediation** | **Structural, ongoing** | **High** | **The real moat risk: rented signal, concentrated suppliers, supplier-as-rival** |\n\nThe ranking is the point. The risk the headlines fixate on — cookies — is the *lowest* near-term threat. The supplier relationships nobody headlines are the *highest*.\n\n---\n\n## Open Questions\n\n1. **Is the Samba TV agreement still in force, and on what terms?** The public record confirms a multi-year deal signed January 2023 [19] but no independently verifiable renewal, exclusivity, or termination status as of June 2026. This is the single most load-bearing unknown for the moat thesis.\n2. **What share of MiQ's activatable audience still depends on third-party cookies?** MiQ says \"more than half\" of US activations are cookie-free [9], which implies up to half are not. The exact dependency, and its trend line, are undisclosed.\n3. **Does MiQ own any proprietary first-party signal at meaningful scale,** or is the entire Identity Spine built from licensed/partner feeds? The public evidence points entirely to licensed inputs; an owned-data exception, if any, is undisclosed.\n4. **How exclusive and how durable is the Titan OS \"only managed-service provider\" arrangement** [20], and what happens at contract renewal?\n5. **What is MiQ's direct GDPR/TCF liability exposure** as a joint or independent controller in European RTB after the May 2025 ruling? MiQ's controller/processor posture is not public.\n6. **Could Experian, Samba, or TTD/LiveRamp credibly disintermediate MiQ's activation layer** before 2029, and is any of them already piloting a competing managed offering?\n7. **Does the cookie reprieve durably reduce MiQ's \"cookieless\" differentiation,** or does gradual erosion preserve enough urgency to keep it a sales advantage?\n\n---\n\n## Sources\n\n1. Kevel, \"Google's Privacy Sandbox: The Winding Road to a Cookie-Less Future.\" https://www.kevel.com/blog/googles-privacy-sandbox-the-winding-road-to-a-cookie-less-future — Tier 5 (vendor analytical; used for timeline framing only). Accessed 2026-06-20.\n2. eMarketer, \"Google backs off third-party cookie ban amid regulatory pressure,\" 2025. https://www.emarketer.com/content/google-backs-off-third-party-cookie-ban-amid-regulatory-pressure — Tier 5 (analytical). Accessed 2026-06-20.\n3. AdExchanger, \"Google Pulls The Plug On Topics, PAAPI And Other Major Privacy Sandbox APIs (As The CMA Says 'Cheerio'),\" Oct 2025. https://www.adexchanger.com/privacy/google-pulls-the-plug-on-topics-paapi-and-other-major-privacy-sandbox-apis-as-the-cma-says-cheerio/ — Tier 4/5 (specialist trade press). Accessed 2026-06-20.\n4. Search Engine Land, \"Google officially shuts down Privacy Sandbox,\" Oct 2025. https://searchengineland.com/google-officially-shuts-down-privacy-sandbox-463561 — Tier 5 (trade press). Corroborates [3] on the 17 Oct 2025 date and retired APIs. Accessed 2026-06-20.\n5. BDO, \"CCPA Updates & New State Privacy Laws for 2026,\" and O'Melveny \"2026 Data Security and Privacy Compliance Checklist.\" https://www.bdo.com/insights/advisory/2026-is-a-pivotal-year-for-privacy ; https://www.omm.com/insights/alerts-publications/2026-data-security-and-privacy-compliance-checklist... — Tier 5 (professional-services/law-firm advisory; authoritative on legal status). Accessed 2026-06-20.\n6. DLA Piper Privacy Matters, \"EU: Brussels Court of Appeal rules on IAB Europe and the TC String,\" Jun 2025; IAB Europe FAQ on APD decision (May 2025). https://privacymatters.dlapiper.com/2025/06/eu-brussels-court-of-appeal-rules-on-iab-europe-and-the-tc-string-implications-for-gdpr-compliance/ — Tier 2/5 (law-firm analysis of a primary court ruling). Accessed 2026-06-20.\n7. ID5, \"2025 State of Digital Identity Report\" (via BusinessWire), Sep 2025. https://www.businesswire.com/news/home/20250929910958/en/ — Tier 5 (vendor report; figures are self-reported survey). Accessed 2026-06-20.\n8. Didomi, \"Google Chrome is keeping third-party cookies after all,\" Apr 2025. https://www.didomi.io/blog/google-chrome-third-party-cookies-april-2025 — Tier 5 (vendor analytical). Corroborates [2]. Accessed 2026-06-20.\n9. MiQ, \"Multi-Solution Approach for Cookieless Measurement\" / Identity Spine materials. https://www.wearemiq.com/blog/cookieless-measurement/ — Tier 1 (company self-description; claims, not independent verification). Accessed 2026-06-20.\n10. BusinessWire, \"MiQ Launches CookielessIQ,\" 20 Jul 2022. https://www.businesswire.com/news/home/20220720005202/en/ — Tier 1 (press release; evidence of launch claim). Accessed 2026-06-20.\n11. CPO Magazine / LEXR / Aditude on RTB GDPR risk and FTC/DOJ data-broker enforcement (Mobilewalla, Gravy Analytics; DOJ bulk-data rule). https://www.cpomagazine.com/data-privacy/adtech-industry-hit-with-privacy-complaints-over-real-time-bidding-systems/ — Tier 5 (analytical, summarizing primary enforcement actions). Accessed 2026-06-20.\n12. Veale & Borgesius / Cambridge German Law Journal, \"Adtech and Real-Time Bidding under European Data Protection Law\"; UK ICO RTB guidance. https://www.cambridge.org/core/journals/german-law-journal/article/adtech-and-realtime-bidding-under-european-data-protection-law/ — Tier 2 (peer-reviewed scholarship) + Tier 1 (ICO guidance). Accessed 2026-06-20.\n13. AdExchanger, \"CTV Data Is Massively Fragmented: Here Are Three Ways The Industry Is Stitching It Back Together.\" https://www.adexchanger.com/digital-tv/ctv-data-is-massively-fragmented-here-are-three-ways-the-industry-is-stitching-it-back-together/ — Tier 4/5 (specialist trade press). Accessed 2026-06-20.\n14. AdExchanger, \"The Blockbuster-Era Law Behind Connected TV's Transparency Problem\" (VPPA). https://www.adexchanger.com/digital-tv/the-blockbuster-era-law-behind-connected-tvs-transparency-problem/ — Tier 4/5 (trade press, quoting named industry execs and citing primary cases). Accessed 2026-06-20.\n15. Medium / MiQ Tech and Analytics, \"Programmatic without cookies? It's possible thanks to data-backed Identity Spines,\" Asim Abinash. https://medium.com/miq-tech-and-analytics/... — Tier 1/6 (company-authored; evidence of MiQ's stated approach). Accessed 2026-06-20.\n16. Experian Marketing Forward, \"How MiQ strengthened its Identity Spine with Experian's Digital Graph,\" 20 May 2025. https://www.experian.com/blogs/marketing-forward/how-miq-strengthed-identity-spine-with-experian-digital-graph/ — Tier 1 (partner-published; +64%/+51%/70%/6.5-device figures are MiQ/Experian self-reported, flagged). Accessed 2026-06-20.\n17. Experian, \"Experian identity resolution and AWS Clean Rooms.\" https://www.experian.com/blogs/marketing-forward/experians-identity-resolution-solution-now-available-in-aws-clean-rooms/ — Tier 1 (vendor; evidence of clean-room availability). Accessed 2026-06-20.\n18. MiQ, \"MiQ solidifies leadership in Advanced TV…\" / TV Intelligence (90M TV sets, 6T+ signals/mo, 11 partners, Apr 2024). https://www.wearemiq.com/us/resources/news/miq-solidifies-leadership-in-advanced-tv-advertising... — Tier 1 (company; scale figures self-reported). Accessed 2026-06-20.\n19. Samba TV, \"Samba TV and MiQ Reach Multi-year Commercial Agreement,\" 13 Jan 2023 (28M US devices; 60M combined; 43M households). https://www.samba.tv/press-releases/samba-tv-and-miq-reach-multi-year-commercial-agreement — Tier 1 (press release; evidence of the deal, not current status). Accessed 2026-06-20.\n20. Advanced Television / MiQ, \"MiQ partners with Titan OS,\" 18 Nov 2025 (20M+ CTVs; \"only managed-service provider with access\"; Sigma integration Q1 2026). https://www.advanced-television.com/2025/11/18/miq-partners-with-titan-os/ ; https://www.wearemiq.com/resources/news/miq-builds-unparalleled-tv-intelligence-in-europe-through-deal-with-titan-os — Tier 1/4 (press + trade confirmation). Accessed 2026-06-20.\n21. The Trade Desk / LiveRamp documentation and AdExchanger, \"LiveRamp And The Trade Desk Launch An EU-Specific ID,\" on UID2/RampID/EUID/ID5 support. https://www.adexchanger.com/online-advertising/liveramp-and-the-trade-desk-launch-an-eu-specific-id... — Tier 1/4 (vendor docs + trade press). Accessed 2026-06-20.\n\n**Sigma platform \"700 trillion signals\" framing:**\n- a. BusinessWire, \"MiQ Sigma Breaks the Fragmentation Cycle,\" 4 Jun 2025 (700T signals, 300+ feeds, three largest LLMs). https://www.businesswire.com/news/home/20250604957858/en/ — Tier 1 (press release; throughput claim, not ownership). Accessed 2026-06-20.\n- b. MiQ, \"MiQ Sigma breaks the fragmentation cycle.\" https://www.wearemiq.com/resources/news/miq-sigma-breaks-the-fragmentation-cycle — Tier 1 (company). Accessed 2026-06-20."}, {"order": 10, "file": "10_Drivers_And_Forces.md", "title": "Drivers and Forces Shaping MiQ Through 2029", "summary": "", "body": "# Drivers and Forces Shaping MiQ Through 2029\n\n## Bottom Line\n\nEight forces will decide whether MiQ compounds into a durable AI-media platform or gets squeezed into a commoditized service shop by 2029. Two **lead**, and both are already moving hard: (1) the linear-to-CTV budget migration, which favors MiQ's TV-data and Advanced-TV stack, and (2) the agentic automation of media buying, which is at once MiQ's biggest bet (Sigma, the Trading and Planning Agents) and the single largest threat to the managed-service labor model that still generates most of its ~$600M+ revenue. Three are **structural tailwinds**: signal loss (cookie/IDFA erosion), which raises the relative value of TV and first-party/clean-room data; the rise of retail/commerce media as an adjacent budget pool MiQ is buying its way into (Adsmovil); and holdco disruption — the Omnicom–IPG merger and WPP Media's reorganization — which both opens the door (the Dentsu \"Intelligence Partner\" deal) and threatens it (in-housing, consolidation of buying power). Two are **double-edged or adverse**: the Bridgepoint PE ownership clock, which manufactures a margin-and-exit story pushing toward both productization and short-termism; and the gravitational pull of Amazon and the walled gardens, which can be either the rails MiQ rides (16 environments in Sigma) or the platforms that disintermediate it. The roll-up race among independent specialists **lags** — a consequence of the others, not an independent driver, though it sets the clock on who survives to 2029. The through-line that matters: MiQ is racing to convert a human-trading services business into a software-and-data platform *before* the same AI that powers Sigma makes the human layer it sells redundant — and before a holdco, a walled garden, or a better-capitalized rival gets there first.\n\n---\n\n## How to Read This Document\n\nEach driver below comes in five parts: **(a) the force and its direction**; **(b) the MECHANISM** — how it concretely translates into change for MiQ's revenue, cost, or competitive position; **(c) the EVIDENCE it is operating now**; **(d) COUNTER-FORCES** pushing the other way; and **(e) a STRENGTH and LEAD/LAG tag**. Strength is a rough qualitative magnitude (weak / moderate / strong / decisive) plus direction (tailwind / headwind / double-edged) for MiQ specifically. \"Leading\" means the force is causal and early in its arc; \"lagging\" means it reacts to the others. Quantities are sourced where data exists and marked *[estimate]* where they are not.\n\n---\n\n## Driver 1 — The Linear-to-CTV Budget Migration\n\n**Direction: strong structural TAILWIND. Leading.**\n\n### Mechanism\n\nCTV ad dollars are growing while linear shrinks, and the dollars do not move cleanly. They fragment across dozens of streamers, FAST channels, and YouTube, each with its own inventory, identity, and measurement. That fragmentation is the *demand* for what MiQ sells: a cross-platform planning, buying, and measurement layer (TV Intelligence + Sigma) that sits above any single streamer. Every dollar that leaves a linear upfront for programmatic/biddable CTV *can* flow through an independent intermediary like MiQ; every dollar that stays in linear largely cannot. The migration thus does two things at once: it expands MiQ's addressable market and sharpens the value of its differentiating asset, a neutral cross-channel TV data graph. [Claim 10.1, 10.2]\n\n### Evidence it is operating\n\n- eMarketer forecasts US CTV ad spend at roughly **$37.95B in 2026**, growing ~14% YoY, while national + local linear TV falls ~2.4% to ~$27.9B. [Claim 10.1]\n- 2026 is the crossover year: US **CTV upfront spend (~$17.73B) exceeds primetime linear upfront (~$16.98B)** for the first time — streaming wins the most-watched daypart. [Claim 10.2]\n- Combined US TV + CTV ad spend approaches **$100B in 2027, with CTV accounting for essentially all the growth** and linear falling a further ~4%. [Claim 10.3]\n- IAB data cited by eMarketer: marketers reallocated **~36% of linear TV budget to CTV in 2025** — a direct measure of the migration in flight. [Claim 10.4]\n- MiQ has built directly against this: its **TV Intelligence** asset spans a **90M-household panel and 6.4 trillion video-consumption signals from 11 partners** across linear, streaming and YouTube — the cross-channel graph the fragmentation creates demand for. [Claim 10.5]\n\n### Counter-forces\n\n- **The migration is mostly captured upstream.** A large share of CTV growth accrues to the streamers' own ad platforms (Netflix, Amazon, Disney, YouTube) and to The Trade Desk, not to managed-service intermediaries. CTV being \"less of a walled garden\" is a trade-press hope, not a settled structure.\n- **Premium CTV inventory is bid-thin and relationship-gated.** The Trade Desk captures a disproportionate share of premium CTV/open-internet inventory; MiQ competes for access, not just for the audience layer.\n- **Measurement fragmentation cuts both ways.** It creates MiQ's opportunity, but it also lets every streamer claim its own first-party measurement is enough, eroding the need for a neutral overlay.\n\n### Strength & lead/lag\n\n**Strong tailwind, leading.** This is the most reliable, best-quantified force in the set, and the one MiQ's strategy is most explicitly built around. It leads because the spend curve is early in its arc (linear still > 1/3 of TV dollars) and the fragmentation that creates MiQ's value is intensifying, not resolving.\n\n---\n\n## Driver 2 — Agentic Automation of Media Buying\n\n**Direction: DOUBLE-EDGED and decisive — the central bet and the central threat. Leading.**\n\n### Mechanism\n\nThis is the load-bearing driver of the whole forecast, because for MiQ it cuts in two directions at once.\n\n**As opportunity:** AI agents that turn natural-language prompts into media plans and live optimizations let MiQ (a) run more campaigns per trader (productivity), (b) sell software/platform access rather than only labor (margin and multiple expansion), and (c) embed itself in other companies' workflows as the \"intelligence layer\" (the Dentsu and PubMatic deals). The mechanism is *operating leverage*: if one trader using the Trading Agent makes ~2x the optimizations, the same revenue carries less labor cost — exactly the margin story a PE owner needs (see Driver 5). [Claim 10.7, 10.8]\n\n**As existential threat:** MiQ's historical business is *managed service* — humans trading on clients' behalf. If agentic buying gets good enough and cheap enough, the value of a human trading desk collapses, and the client (or a holdco, or a walled garden) can run the agent itself. So MiQ is racing to become the *vendor of the agent* before the agent makes the *seller of human trading* obsolete. The same technology that justifies Sigma's valuation can, if it commoditizes, hollow out the labor revenue that still funds the company. [Claim 10.6]\n\n### Evidence it is operating\n\n- **MiQ Sigma launched June 2025**; by the June 2026 update it processes **2.5 petabytes of daily data from 600+ feeds** (double the 300+ at launch) and activates across **16 open-web and walled-garden environments** including Google and YouTube. [Claim 10.6, 10.7]\n- The **Trading Agent** is trained on 15 years of MiQ trading data and three LLMs (Claude, Gemini, OpenAI); MiQ reports traders making **~2x the optimizations** and a **new Planning Agent** (prompt → full media plan) added June 2026. [Claim 10.7, 10.8]\n- Adoption claims: **2,300+ advertisers, 40,000 campaigns, and a reported \"$2.22 value per $1 spent\"** vs. standard programmatic (vendor-reported figure — treat as a claim, not verified outcome). [Claim 10.8]\n- Third-party embed: **PubMatic launched \"AgenticOS\" with MiQ Sigma's Trading Agent deployed, live in Q1 2026** — evidence MiQ is selling the agent into others' stacks, not just using it internally. [Claim 10.9]\n- Standards motion: MiQ is a **launch member of the Ad Context Protocol (AdCP)** and began testing it in early 2026 — positioning for an agent-to-agent buying world. [Claim 10.10]\n\n### Counter-forces\n\n- **Commoditization risk is symmetric.** The Trade Desk (Kokai), Amazon, Google, and every holdco are building the same agentic layer. If buying agents become table stakes, MiQ's edge narrows to its *data* (TV graph) rather than its *agent*.\n- **\"Value per dollar\" is self-reported.** The performance claims are MiQ marketing, not independently audited. They should not be treated as established outcomes.\n- **The human-relationship moat persists in managed service.** Mid-market and independent agencies (the Pathlabs base) still want a human partner. Full automation may lag the hype by years, which *delays* the threat — but also delays the margin payoff.\n\n### Strength & lead/lag\n\n**Decisive, double-edged, leading.** No other force has both this much upside and this much downside for MiQ. It is the hinge of every scenario: the bull case is \"MiQ becomes an AI-media platform\"; the bear case is \"agentic buying commoditizes MiQ's labor faster than its software scales.\"\n\n---\n\n## Driver 3 — Signal Loss (Cookie / IDFA Erosion)\n\n**Direction: moderate-to-strong TAILWIND for the TV-data thesis. Leading but slow.**\n\n### Mechanism\n\nAs third-party identifiers degrade, the *relative* value of durable, consented, or environment-native signal rises: first-party data, clean-room collaboration, and CTV signal (IP, device ID, ACR, hashed-email tokens) that never depended on cookies. MiQ's differentiation is a cross-channel TV data graph plus clean-room and identity partnerships — assets that *appreciate* as the open-web cookie depreciates. The mechanism is substitution: budgets and data-strategy attention migrate toward the channels and methods that survive signal loss. CTV is the marquee survivor. [Claim 10.11, 10.12, 10.13]\n\n### Evidence it is operating\n\n- **Google reversed automatic third-party-cookie deprecation in Chrome on April 22, 2025** — cookies are not being killed on a schedule, but a \"user choice\" prompt still threatens a high opt-out / signal-loss rate. The deprecation is *slower*, not cancelled. [Claim 10.11]\n- **CTV never relied on cookies**; trade-press consensus is that CTV targeting persists via IP, device ID, probabilistic IDs, ACR, and email-based tokens (UID2) — structurally insulated from the open-web identity shock. [Claim 10.12]\n- Demand-side response: **>50% of US marketers increased first-party-data investment in 2024**, and clean-room adoption is rising as the privacy-safe matching layer. [Claim 10.13]\n- MiQ's stack is built for this: **TV Intelligence's ACR/STB-based graph and clean-room/identity partnerships** are cookie-independent by construction. [Claim 10.5]\n\n### Counter-forces\n\n- **Google's reversal blunted the urgency.** With cookies surviving in Chrome, the \"burning platform\" that would have force-marched budgets to cookieless channels is weaker than the 2021–2023 narrative assumed. This is the key downgrade vs. earlier forecasts.\n- **Walled gardens are the bigger beneficiaries of signal loss**, not independents — Amazon, Google, and Meta hold the largest first-party graphs. Signal loss can *concentrate* advantage with the platforms MiQ must ride.\n- **CTV identity is itself fragmenting** (competing IDs, no universal graph), so \"cookieless = MiQ wins\" is too clean. MiQ must keep buying and partnering to maintain a usable graph.\n\n### Strength & lead/lag\n\n**Moderate tailwind, leading but slow.** Direction is right and durable, but the Google reversal materially reduced magnitude and timing pressure. This is best weighted as a steady structural tilt, not a step-change.\n\n---\n\n## Driver 4 — Consolidation Among Independent Specialists / the Roll-Up Race\n\n**Direction: HEADWIND on competitive intensity, double-edged on MiQ's own M&A. Lagging/reactive.**\n\n### Mechanism\n\nAs AI raises the capital and data scale needed to compete, sub-scale independents get acquired, partner, or fade. This consolidation is mostly a *consequence* of Drivers 1–3 (the scale economics of CTV data and agentic platforms), which is why it lags. For MiQ it is double-edged. MiQ is itself a *consolidator* (Grasp, Adsmovil, Pathlabs, AirGrid), using M&A to add markets (LatAm), channels (commerce, DOOH), and client segments (independent agencies via the MEP model) faster than it could build them. But the same logic puts MiQ in a race against other roll-ups, and could make it a target on Bridgepoint's exit (Driver 5). The mechanism is scale-or-die: data, identity, and AI all carry fixed-cost economics that reward the largest independent and punish the rest. [Claim 10.14, 10.15, 10.16]\n\n### Evidence it is operating\n\n- **MiQ to acquire Pathlabs** (Missoula-based Media Execution Partner founded 2021) — a Media-Execution-Partner play to reach independent agencies that don't want to in-house programmatic. [Claim 10.14]\n- **MiQ signed to acquire Adsmovil's LatAm business (announced March 25, 2026)** — forming \"the region's largest independent programmatic solution,\" adding mobile, commerce, and DOOH across 12 markets with first-party data. [Claim 10.15]\n- Prior tuck-ins (**Grasp, AirGrid, Samba-related data deals**) extended data and identity capability; the pattern is a deliberate independent roll-up. [Claim 10.16]\n- The competitive backdrop is consolidating at the top too: **Omnicom–IPG merged**, and **GroupM rebranded to WPP Media** — fewer, larger buyers reshaping the field MiQ sells into. [Claim 10.17, 10.18]\n\n### Counter-forces\n\n- **Integration risk.** Roll-ups often destroy value through botched integration; three-plus acquisitions in a short window strain a single operating model and culture.\n- **Independents can also federate without merging** (partnerships, AdCP interoperability), easing the pressure to consolidate ownership.\n- **Being the consolidator invites being consolidated.** A successful roll-up makes MiQ a cleaner, larger asset to sell — the exit logic (Driver 5) can flip MiQ from acquirer to acquired.\n\n### Strength & lead/lag\n\n**Moderate, double-edged, lagging.** Important for *who survives to 2029* and for MiQ's market position, but it is downstream of the technology and budget forces. Treat as a clock on the field's structure rather than an independent cause.\n\n---\n\n## Driver 5 — The PE Ownership Clock (Bridgepoint)\n\n**Direction: DOUBLE-EDGED — manufactures both discipline and short-termism. Leading on corporate behavior.**\n\n### Mechanism\n\n**Bridgepoint took a majority stake in MiQ in September 2022, in a deal valued at up to ~$1B**, buying out ECI Partners and GP Bullhound. PE ownership runs on a hold-then-exit clock (typically ~4–6 years), and that clock shapes MiQ's behavior. It must (a) build a *margin story* — hence the productization push (Sigma, agentic automation) that converts a labor business into higher-margin software/data; (b) build a *growth story* — hence the M&A roll-up that adds revenue and TAM quickly; and (c) prepare a *sellable narrative* for a 2026–2028 exit window (secondary buyout, strategic sale to a holdco or platform, or — less likely for a services-heavy firm — IPO). The clock is why the agentic-margin and roll-up drivers are being pushed *now* rather than left to grow organically. [Claim 10.19, 10.20]\n\n### Evidence it is operating\n\n- **Bridgepoint acquired MiQ from ECI Partners in September 2022**, valued up to ~$1B; the prior owners realized strong returns (ECI ~6.1x; a reported ~5.9x MOIC / ~49% IRR on the combined exit) — establishing the high base that the next owner must beat. [Claim 10.19]\n- At acquisition, MiQ had ~1,000 staff in 22 offices; it now reports **~1,909 employees (April 2026) and $600M+ revenue** — the growth-during-hold a PE thesis requires. [Claim 10.20, 10.21]\n- The post-2022 sequence — **Sigma (productization), the agentic margin story, and three-plus acquisitions** — is exactly the value-creation playbook a sponsor runs ahead of an exit. [Claim 10.6, 10.14, 10.15]\n- At acquisition MiQ explicitly signaled it would **\"mull M&A moves with new PE backers\"** — the roll-up was part of the sponsor thesis from day one. [Claim 10.16]\n\n### Counter-forces\n\n- **Short-termism risk.** Exit pressure can starve long-horizon platform investment, or push a sale before Sigma's platform thesis is proven, capping the outcome.\n- **A soft ad-tech M&A/IPO market** could extend the hold (secondary buyout or continuation vehicle) — changing the clock, not removing it.\n- **The margin story depends on Driver 2 paying off.** If agentic automation commoditizes faster than MiQ's software scales, the \"high-margin platform\" narrative the exit needs may never materialize, and MiQ exits as a services firm at a services multiple.\n\n### Strength & lead/lag\n\n**Strong on corporate behavior, double-edged, leading.** The PE clock is the single best explanation for the *timing and aggression* of MiQ's strategy. 2026–2028 is best treated as a live exit window, with exit pathways modeled explicitly.\n\n---\n\n## Driver 6 — Holdco In-Housing vs. Outsourcing of Programmatic\n\n**Direction: DOUBLE-EDGED — the Dentsu deal vs. the in-housing threat. Leading.**\n\n### Mechanism\n\nHolding companies are doing two opposite things at once: (a) distributing programmatic capability into their operating agencies and clients (in-housing), which *removes* the need for an external trading partner, and (b) under cost and AI pressure, *outsourcing* the hard, scale-intensive parts (data, identity, agentic tooling) to specialists. MiQ's bet is to be the specialist holdcos *outsource the intelligence layer to* rather than the trading desk they replace — captured in the Dentsu deal, which makes MiQ Dentsu's \"Intelligence Partner\" and embeds Sigma at the strategic center of Dentsu's media practice. The mechanism is a make-vs-buy decision at every holdco. If AI makes building cheap, holdcos in-house and MiQ loses; if AI makes the *best* tooling a moving target only a focused specialist can keep current, holdcos buy and MiQ wins the layer. [Claim 10.22, 10.23]\n\n### Evidence it is operating\n\n- **Dentsu named MiQ its official \"Intelligence Partner\" (June 12, 2025)** — the *first holding company to integrate MiQ Sigma at the strategic center* of its media practice; trade press framed it as Dentsu going \"all-in.\" [Claim 10.22]\n- Counter-evidence (in-housing): **~51% of US brands have partially moved programmatic buying in-house** — a measured, mainstream shift away from full outsourcing. [Claim 10.23]\n- Holdco disruption is live: **Omnicom–IPG merged with a ~$1.5B synergy target (~$1B from labor) and ~8,200 roles cut in 2025**, and **GroupM became WPP Media** — holdcos are restructuring precisely the buying-and-trading functions MiQ competes with and sells into. [Claim 10.17, 10.18, 10.24]\n\n### Counter-forces\n\n- **In-housing has a ceiling.** Many brands and most independent agencies lack the scale to run cutting-edge data/AI in-house — the explicit thesis behind MiQ's Pathlabs MEP play (serve the agencies that *can't* build it).\n- **One marquee deal is not a model.** The Dentsu relationship is real but singular. Whether other holdcos follow — or build their own — is unproven, and holdcos are also MiQ's competitors.\n- **Holdco consolidation concentrates buyer power**, which can pressure MiQ's pricing even where it wins the relationship.\n\n### Strength & lead/lag\n\n**Strong, double-edged, leading.** This is where MiQ's go-to-market thesis is most directly tested. The Dentsu deal is the leading positive signal; the in-housing data and holdco cost-cutting are the leading negative signals. Holdco #2 and #3 are the decisive tell to track.\n\n---\n\n## Driver 7 — Retail / Commerce Media as an Adjacent Budget Pool\n\n**Direction: moderate TAILWIND MiQ is buying into. Leading.**\n\n### Mechanism\n\nRetail/commerce media is the fastest-growing major ad channel, and its first-party purchase data is increasingly extended *into CTV* — turning streaming into a measurable lower-funnel channel. This matters to MiQ two ways: (a) commerce data is a high-value, signal-loss-resistant input to the TV graph, closing the loop from exposure to purchase (incrementality/outcomes), and (b) retail-media-on-CTV is a new budget pool MiQ can intermediate. MiQ is buying its way in (Adsmovil brings commerce + DOOH + first-party data) and integrating commerce signals into Sigma (Circana). The mechanism is data-and-budget convergence: commerce + CTV is where outcome-based TV buying gets proven, and that is exactly MiQ's pitch. [Claim 10.25, 10.26]\n\n### Evidence it is operating\n\n- US **retail media ad spend ~$58.8B (2025) → ~$69–71B (2026)** per eMarketer — among the largest and fastest-growing channels. [Claim 10.25]\n- **Retail-media spend on CTV grew ~45.5% YoY in 2025**; in 2026 retailers are extending first-party commerce data into CTV environments. [Claim 10.26]\n- MiQ's moves: **Adsmovil adds commerce + DOOH + first-party data in LatAm**, and **Sigma integrates commerce signals (Circana)** alongside TV (TitanOS) and search (Evertune). [Claim 10.15, 10.7]\n\n### Counter-forces\n\n- **~90% of retail media is concentrated in Amazon + Walmart**, both of which keep their data and inventory largely closed. The budget pool is real, but the *data* sits mostly inside walled gardens MiQ cannot freely access (overlaps with Driver 8).\n- **Retailers may build or buy their own** CTV/commerce activation rather than route through an independent.\n- **Commerce-on-CTV is early.** The measurement plumbing (clean rooms, closed-loop attribution) is immature, so the budget is promised more than delivered.\n\n### Strength & lead/lag\n\n**Moderate tailwind, leading.** Genuinely additive to MiQ's TAM and to its outcome/incrementality story, but heavily gated by walled-garden concentration. Treat as upside option value, not a core load-bearing assumption.\n\n---\n\n## Driver 8 — Walled-Garden and Amazon Gravitational Pull\n\n**Direction: HEADWIND with a partial offset — rails or disintermediation. Leading.**\n\n### Mechanism\n\nAmazon, Google/YouTube, Meta, and the major streamers concentrate the most valuable inventory, the largest first-party identity graphs, and increasingly the buying tools (Amazon DSP, TTD-as-quasi-platform). For MiQ this is the central structural risk: the more advertising runs *inside* closed platforms with native targeting, measurement, and now agentic buying, the less room is left for an independent intermediary. The offset is access-as-rails. If MiQ can activate *across* those environments (Sigma's 16 environments incl. Google/YouTube) and add a neutral cross-walled-garden intelligence and measurement layer the platforms won't build for each other, MiQ rides the gardens instead of being crushed by them. The mechanism is a tug-of-war between platform self-sufficiency (disintermediation) and the advertiser's need for a neutral cross-platform layer (MiQ's reason to exist). [Claim 10.27, 10.28]\n\n### Evidence it is operating\n\n- **Amazon generates $60B+ in annual ad revenue and ~77% of US retail media**; **Amazon DSP is the fastest-growing top-five DSP (~24% YoY, ~14% share)** — gravitational pull is intensifying, not stabilizing. [Claim 10.27, 10.28]\n- **The Trade Desk holds ~19% DSP share and a disproportionate share of premium CTV/open-internet** — the dominant *independent* rail MiQ both uses and competes against. [Claim 10.28]\n- MiQ's offset is explicit: **Sigma activates across 16 open-web and walled-garden environments including Google and YouTube** — the cross-garden layer is the product. [Claim 10.7]\n\n### Counter-forces\n\n- **Antitrust and interoperability pressure** on Google/Amazon could *open* walled gardens and create more room for a neutral intermediary (regulatory wildcard).\n- **Advertisers distrust marking-their-own-homework** inside walled gardens, sustaining demand for a neutral measurement/intelligence overlay — exactly MiQ's pitch.\n- **Walled gardens build their own agents** (Amazon, Google), which can disintermediate the cross-garden layer if interoperability standards (AdCP) fail to take hold.\n\n### Strength & lead/lag\n\n**Strong headwind with a real offset, leading.** This is the ceiling on the independent-intermediary model. Whether it reads as headwind or tailwind for MiQ depends almost entirely on Driver 2's interoperability outcome (AdCP, multi-DSP agents). Driver 2 and Driver 8 are best treated as coupled.\n\n---\n\n## Leading vs. Lagging — Summary\n\n| # | Driver | Direction for MiQ | Strength | Lead/Lag | Coupled with |\n|---|--------|-------------------|----------|----------|--------------|\n| 1 | CTV budget migration | Tailwind | Strong | **Leading** | 3, 7 |\n| 2 | Agentic automation | Double-edged | **Decisive** | **Leading** | 5, 6, 8 |\n| 3 | Signal loss | Tailwind (slowed) | Moderate | Leading (slow) | 1, 7 |\n| 4 | Specialist consolidation | Double-edged | Moderate | **Lagging** | 5 |\n| 5 | PE ownership clock | Double-edged | Strong | Leading (behavior) | 2, 4 |\n| 6 | Holdco in-house vs. outsource | Double-edged | Strong | Leading | 2, 8 |\n| 7 | Retail/commerce media | Tailwind | Moderate | Leading | 1, 8 |\n| 8 | Walled-garden / Amazon pull | Headwind + offset | Strong | Leading | 2, 7 |\n\n**The three couplings that decide the outcome:**\n\n1. **Driver 2 × Driver 5** — Does agentic automation deliver the margin expansion the PE clock demands *before* it commoditizes the labor revenue? This is the bull/bear hinge.\n2. **Driver 2 × Driver 8** — Does interoperability (AdCP, multi-DSP agents) let MiQ ride the walled gardens, or do the gardens' own agents disintermediate the cross-platform layer?\n3. **Driver 6 × Driver 4** — Does MiQ become the holdcos' outsourced intelligence layer (the Dentsu model scales), or does holdco consolidation plus in-housing squeeze independents into roll-up targets?\n\nThe single most important uncertainty: **whether MiQ's transition from a human-trading services business to a software-and-data platform completes before AI erodes the services revenue that funds it.** Every scenario should resolve that race one way or the other.\n\n---\n\n## Open Questions\n\n1. **What is MiQ's actual revenue *mix* between managed-service labor and software/data?** The $600M+ top line is reported, but the share that is high-margin platform vs. low-margin services is the number that determines the exit multiple — and it is not public.\n2. **Are Sigma's performance claims ($2.22/$1, 2x optimizations, 2,300+ advertisers) independently verifiable?** All are vendor-reported, and should be treated as claims, not outcomes.\n3. **Will holdco #2 and #3 follow Dentsu**, or was the Dentsu \"Intelligence Partner\" deal a one-off? This is the decisive tell on Driver 6.\n4. **What is Bridgepoint's exit timeline and preferred path** (secondary buyout, strategic sale, IPO), and does a soft ad-tech market extend the hold past 2028?\n5. **How deep is the Samba/Lifesight relationship now?** Public confirmation of the *current* status (vs. historical) of these partnerships in the TV-Intelligence stack is thin — flagged as a going-concern gap.\n6. **Does AdCP achieve real adoption,** or does walled-garden agent fragmentation block the interoperability MiQ's cross-platform thesis depends on?\n7. **What share of the 2026–2027 CTV growth actually reaches independent intermediaries** vs. accruing to streamer ad platforms and The Trade Desk? The migration is real; MiQ's *capture rate* is the open question.\n\n---\n\n## Sources\n\n1. EMARKETER, \"US TV and Connected TV (CTV) Ad Spending, 2023–2027\" and \"Combined CTV and linear TV ad spend will near $100 billion in 2027,\" 2026. https://www.emarketer.com/content/combined-ctv-linear-tv-ad-spend-will-near-100-billion-2027 — Tier 5 (analytical forecaster; survey/modeled method). CTV/linear spend magnitudes and crossover. Accessed 2026-06-20.\n2. EMARKETER, \"Marketers shift TV ad spending as time with CTV grows while linear declines\" / \"CTV is fueling the US TV ad industry,\" 2026. https://www.emarketer.com/content/marketers-shift-tv-ad-spending-time-with-ctv-grows-while-linear-declines — Tier 5. Migration mechanism + IAB 36% reallocation figure. Accessed 2026-06-20.\n3. PPC Land, \"MiQ upgrades Sigma a year in: Planning Agent and 2.5PB of daily data,\" June 2026. https://ppc.land/miq-upgrades-sigma-a-year-in-planning-agent-and-2-5pb-of-daily-data/ — Tier 5 (ad-tech trade press). Sigma data volume, feeds, 16 environments, Trading/Planning Agent, adoption claims. Accessed 2026-06-20.\n4. Bridgepoint / Yahoo Finance / Business Wire, \"MiQ Sigma Breaks the Fragmentation Cycle,\" June 2025. https://www.businesswire.com/news/home/20250604957858/en/ — Tier 1 (company/press release — treat as MiQ's claims). Sigma launch, 300+ feeds, 700T signals, LLM stack. Accessed 2026-06-20.\n5. INMA, \"Advertising enters the agentic era as AI agents begin buying and selling media,\" 2026. https://www.inma.org/blogs/... — Tier 5. Context on agentic buying; PubMatic AgenticOS deployment of MiQ Sigma. Accessed 2026-06-20.\n6. MiQ, \"Excited to be a launch member of Ad Context Protocol (AdCP),\" 2026. https://www.wearemiq.com/us/resources/blog/launch-member-of-ad-context-protocol-adcp — Tier 1 (company). AdCP launch membership + early-2026 testing. Accessed 2026-06-20.\n7. Tealium / Experian / Seresa, on Google's April 22, 2025 cookie-deprecation reversal, 2025. https://seresa.io/blog/data-loss/google-saved-the-cookie-what-the-april-2025-reversal-actually-means — Tier 5/6 (vendor analysis; corroborated across multiple). Chrome cookie reversal + residual signal-loss risk. Accessed 2026-06-20.\n8. AdExchanger, \"Why CTV is Positioned to Thrive as Third-Party Cookies Fade Away\" / \"CTV Is Immune To Cookie Deprecation,\" 2025–2026. https://www.adexchanger.com/on-tv-and-video/why-ctv-is-positioned-to-thrive-as-third-party-cookies-fade-away/ — Tier 5 (specialist trade). CTV cookie-independence; identity methods (IP/device/ACR/UID2). Accessed 2026-06-20.\n9. Experian, \"Cookie deprecation: What marketers need to know,\" 2025. https://www.experian.com/blogs/marketing-forward/cookie-deprecation/ — Tier 5 (vendor; data-provider lean). >50% first-party-data investment increase; clean-room adoption. Accessed 2026-06-20.\n10. mrweb.com (Daily Research News) / PrivSource / Pantheon International, on Bridgepoint's Sept 2022 MiQ acquisition, 2022. https://www.mrweb.com/drno/news33875.htm and https://www.pantheon-international.com/our-portfolio/case-studies/miq/ — Tier 5 (trade + investor disclosure). Up-to-$1B valuation, ECI/PIN exit returns (6.1x; 5.9x MOIC / 49% IRR). Accessed 2026-06-20.\n11. Marketecture, \"MiQ — A global programmatic media partner doing $600M+ in revenue,\" 2025–2026. https://news.marketecture.tv/p/miq-gurman-hundal — Tier 5 (ad-tech trade interview). Revenue scale; business model (serving other agencies). Accessed 2026-06-20.\n12. MiQ / Pathlabs, \"MiQ to acquire Pathlabs, expanding programmatic excellence to independent agencies,\" 2025. https://www.pathlabs.com/blog/miq-acquires-pathlabs — Tier 1 (company). Pathlabs MEP acquisition, independent-agency thesis. Accessed 2026-06-20.\n13. MiQ, \"MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering In Latin America,\" March 25 2026. https://www.wearemiq.com/resources/news/miq-acquires-adsmovil — Tier 1 (company). Adsmovil LatAm deal: 12 markets, commerce/DOOH/first-party data. Accessed 2026-06-20.\n14. Digiday, \"MiQ mulls M&A moves with new PE-backers,\" 2022. https://digiday.com/media/miq-mulls-ma-moves-with-new-pe-backers/ — Tier 5 (ad-tech trade). M&A roll-up as part of the Bridgepoint thesis from acquisition. Accessed 2026-06-20.\n15. MediaPost, \"Dentsu Goes All-In With MiQ, Claims Industry-First Integration,\" June 12 2025; and MiQ, \"dentsu selects MiQ Sigma to help power Next Gen media operations.\" https://www.mediapost.com/publications/article/406608/ and https://www.wearemiq.com/resources/news/dentsu-selects-miq-sigma-to-help-power-next-gen-media-operations — Tier 5 / Tier 1. Dentsu \"Intelligence Partner\" deal; first holdco to embed Sigma. Accessed 2026-06-20.\n16. The Version2 / Basis, \"In-Housing Programmatic Advertising 2025,\" 2025. https://www.theversion2.com/in-housing-programmatic-advertising-2025/ — Tier 5/6 (vendor/educational). ~51% of US brands partially in-housed programmatic. Accessed 2026-06-20.\n17. mmm-online / Marketing Dive / Storyboard18, on Omnicom–IPG merger, synergies, and 2025 headcount cuts, 2025. https://www.mmm-online.com/news/omnicom-and-ipg-jointly-cut-headcount-by-8200-in-2025/ and https://www.marketingdive.com/news/omnicom-plans-to-reduce-labor-costs-by-1b-following-ipg-acquisition/812547/ — Tier 4/5. Omnicom–IPG merger, ~$1.5B synergy / ~$1B labor target, ~8,200 cuts. Accessed 2026-06-20.\n18. Marketing Dive, \"GroupM becomes WPP Media as holding company prepares for future,\" 2025. https://www.marketingdive.com/news/groupm-becomes-wpp-media-as-holding-company-prepares-for-future/749462/ — Tier 4. GroupM → WPP Media rebrand. Accessed 2026-06-20.\n19. EMARKETER, retail media spend forecast and CTV retail-media growth, 2026. https://www.emarketer.com/content/advertisers-adjust-their-budgets-capitalize-on-retail-media — Tier 5. Retail media ~$58.8B (2025) → ~$69–71B (2026); retail-media-on-CTV +45.5% YoY. Accessed 2026-06-20.\n20. Adtelligent / Osmos, \"Retail Media Market Outlook 2026,\" 2026. https://adtelligent.com/blog/retail-media-market-outlook/ — Tier 5/6 (vendor). ~90% retail media concentration in Amazon+Walmart; Amazon ~77% / $60B+; Amazon DSP ~14% share / ~24% YoY; TTD ~19%. Accessed 2026-06-20 (corroborate concentration figures against eMarketer/IAB where possible).\n21. MiQ AU / Mediaweek, \"MiQ expands TV Intelligence solution to Australia,\" 2024–2026. https://www.wearemiq.com/resources/news/miq-solidifies-leadership-in-advanced-tv-advertising-with-global-expansion-of-tv-intelligence-solution-in-critical-markets and https://www.mediaweek.com.au/miq-expands-tv-intelligence-solution-to-australia/ — Tier 1 / Tier 5. 90M-household panel, 6.4T signals, 11 partners, ACR/STB; Titan OS integration into Sigma Q1 2026. Accessed 2026-06-20.\n\n**Sourcing note:** Several MiQ capability and performance figures (Sigma's $2.22/$1, 2x optimizations, 90M households / 6.4T signals, 500M+ CTV households) originate in MiQ's own communications (Tier 1 as *claims*, not independently verified outcomes). Retail-media concentration percentages come from vendor/trade analyses (Tier 5–6) and should be triangulated against eMarketer/IAB primary forecasts before being treated as established. The cookie-deprecation reversal and CTV/linear spend figures are the best-corroborated facts in this document."}, {"order": 11, "file": "11_Retail_And_Commerce_Media.md", "title": "Retail & Commerce Media: Orchestrating the Fastest-Growing Ad Segment From Outside the Shelf", "summary": "", "body": "# Retail & Commerce Media\n\n## Bottom Line\n\nCommerce media — advertising tied to verified shopper and purchase data, of which retailer-owned \"retail media\" is the largest slice — is the fastest-growing line in global advertising: on the order of 15-16% of total ad revenue in 2025, and forecast to keep compounding through 2028 [1][2]. MiQ has built a credible commerce business on that wave. **MiQ Commerce** (closed-loop, in-store sales attribution, launched in Canada in 2024) and **Consumer Link** (a \"shopper intelligence data spine\" for CPG marketers, launched in the US in 2023) both feed its **Sigma** AI platform, and it now holds a genuine owned retail-media asset — **Linki**, the multi-channel retail media platform acquired with **Adsmovil's** Latin America business in March 2026 [3][4][5][6]. The strategic logic is real: MiQ's identity-and-measurement model extends naturally into commerce, and commerce closes the loop on the CTV story it has bet the company on — shoppable, measurable TV.\n\nThe central tension, though, should be stated plainly: **MiQ is not a retailer and owns almost no first-party shopper data.** Its commerce offering is an *orchestration layer* assembled from other parties' data — NielsenIQ for modelled retail sales, Circana and Numerator for purchase panels, Ibotta for deterministic receipt data — the same dependency that defines MiQ across its whole business. And the retail-media market it sells into is the most concentrated in advertising: Amazon (~80% US share) and Walmart Connect together took ~84% of US retail media spend in 2025 and ~89% of the *incremental* dollar in 2026, each running a closed-loop walled garden MiQ cannot replicate [7][8]. So MiQ's honest position is the *anti-walled-garden* one: the neutral cross-network harmonizer connecting \"the basket to the wallet\" across 200+ fragmented retail media networks no single retailer can see past [9]. That is a defensible niche — but a measurement-and-orchestration niche dependent on others' data, not a data-ownership moat. And several of its named data partnerships (Ibotta dates to 2021) need fresh confirmation that they remain live today.\n\n---\n\n## 1. The Market MiQ Is Selling Into: Commerce Media as the Fastest-Growing Segment\n\n### Commerce media is ~15-16% of global ad revenue in 2025 and the fastest-growing major segment\n\nDecode first. **Retail media** = advertising sold by a retailer on its own properties (site, app, stores) using its shopper/purchase data. **Commerce media** = the broader category — any company that facilitates transactions and holds first-party customer data, selling ad inventory and outcomes; that includes travel, financial-services and rideshare networks, not just retailers [1]. Retail media is the dominant sub-segment of commerce media.\n\nThe forecasts behind the \"fastest-growing segment\" framing come from GroupM/WPP and eMarketer, not from MiQ marketing. WPP Media (the rebranded GroupM), in its December 2025 *This Year, Next Year* forecast, put the **commerce** category at **15.6% of total global ad revenue in 2025, reaching ~$178.2 billion**, with retail media specifically at roughly $176.9bn / ~15.9% of advertising — surpassing total TV revenue (including streaming) for the first time [2]. eMarketer's parallel read had retail media spend up ~17.6% year-over-year in 2025 and rising toward a quarter of all digital ad spend by 2028; it projects **US retail media at ~$71.1bn in 2026** and US retail media spend up ~88.5% from 2024 to 2028 to ~$97.9bn [1][8]. The entire strategic rationale for MiQ entering commerce rests on this growth being real.\n\n### The retail-media market is extraordinarily concentrated, and the concentration is intensifying\n\nThis is the fact that most constrains MiQ. Per eMarketer (2025-2026), **Amazon Ads holds ~79.7% of the US retail media market in 2025; Walmart Connect is a distant second at ~8.0%**; combined, the two take **>84% of US retail media spend in 2025**, rising to **~89% of the *incremental* spend in 2026** [7][8]. Essentially every other retail media network eMarketer tracks is forecast to stay flat or decline through 2027 [8]. The competitive frontier, per industry analysis, is now \"ecosystem control\" — Amazon and Walmart building monetization layers (ads, data, AI services, subscriptions) on top of their commerce flywheels [7]. This is the wall MiQ is on the wrong side of.\n\n### The strategic opening MiQ exploits: retail-media fragmentation outside the duopoly\n\nMiQ's own framing (US blog, Nov 2025): there are \"more than 25 distinct retail media networks in the UK and over 200 globally, each operating as its own walled garden,\" producing an incomplete view of the shopper [9]. The opening is real. Below Amazon/Walmart sits a long tail of sub-scale RMNs (Target Roundel ~1.5% US share, then a fragmenting field) that individually cannot offer cross-network reach or a unified shopper view, and that eMarketer expects to be \"squeezed\" [8][9]. MiQ positions itself as the neutral layer that harmonizes across them — connecting \"the basket to the wallet,\" unifying granular purchase data with total category spend and share of wallet [9]. This is MiQ's actual competitive thesis in commerce. The fragmentation facts are independently sourced, but the *efficacy* of MiQ's answer is not yet proven — a claim of position, not outcome.\n\n---\n\n## 2. MiQ's Commerce Stack: What It Actually Sells\n\n### Consumer Link: a CPG \"shopper intelligence data spine\" (US, launched May 2023)\n\nMiQ launched **Consumer Link** on **8 May 2023**, billed as the \"largest consumer data footprint for CPG marketers\" [3][10]. It is a shopper-intelligence spine built from permissioned purchase, media-consumption, identity, device and first-party data, combined at launch with \"nearly 100 additional data feeds\" through MiQ's platform, and pitched as reaching **90% of US households across the open and closed web** [3]. It exposes three capabilities: **Shopper TV Intelligence** (TV-viewing habits of a brand's or a competitor's shoppers, for CTV planning), **Shopper Intelligence** (granular customer understanding for personalization), and **Merchant Intelligence** (store-level performance for e-commerce and in-store activation) [3][10]. Quote, Erin Madorsky (then US Chief Strategy Officer): \"Shopper data has become increasingly complex – fragmented across platforms… finding [shoppers] is increasingly dependent on smart, strategic combinations of screens, data, and creative\" [3].\n\nOne caveat on currency. The launch is May 2023. MiQ marketing pages for Consumer Link remain live (`marketing.wearemiq.com/miqs-consumer-link`), and the November 2025 US commerce blog and June 2026 Sigma materials describe the same shopper-intelligence proposition, so the *capability* appears current. But there is no 2025-2026 dated press release re-asserting \"Consumer Link\" by name as a distinct, in-market product, and the \"90% of US households\" figure traces to the 2023 launch. The brand name is best read as live-but-confirmed-only-to-the-2023-launch-plus-ongoing-marketing-pages; the underlying capability is reflected in current Sigma materials.\n\n### MiQ Commerce: closed-loop, in-store sales attribution (Canada, launched Sept 2024, via NielsenIQ)\n\n**MiQ Commerce** launched in **Canada in 2024** (announced 10 Sept 2024) as a sales-uplift solution letting CPG brands attribute *in-store* sales to brand-marketing activations — i.e., **closed-loop measurement**: tying ad exposure to actual purchase [4][5][11]. The mechanism is a **data agreement with NielsenIQ**: MiQ Commerce integrates **NIQ's Precision Areas modelled retail sales data** (available down to the Forward Sortation Area — the Canadian postal-district level) with MiQ's shopper insights and omnichannel programmatic execution, so advertisers can read post-campaign sales lift within targeted geographies [4][5][11]. Quotes: Jason Furlano (CRO, MiQ Canada): the NIQ collaboration \"[enables] brands and advertisers to measure how their advertising investments are driving in-store sales\"; Lana Busignani (NIQ): a \"significant step toward enhancing MiQ's AdTech solutions\" [4][5]. NIQ cited CA$2.8bn in annual Canadian CPG digital ad spend as the addressable context [5].\n\nNote the **modelled, not deterministic** character. NIQ Precision Areas is *modelled* retail sales data at a geographic level (FSA), so MiQ Commerce in Canada delivers **geo-level modelled sales-lift**, not person-level deterministic purchase matching. This is sales uplift measured by region — closer to a marketing-mix/geo-lift method than to the basket-level closed loop a retailer's own loyalty data provides, a meaningful distinction the marketing language (\"attribute in-store sales\") can blur. The NIQ partnership is the most recently and firmly dated of MiQ's commerce data relationships (Sept 2024), and Circana/NIQ remain named in 2025-2026 Sigma materials [6][12].\n\n### The data web: NielsenIQ, Circana, Numerator, Ibotta — assembled, not owned\n\nMiQ's commerce capability is, by design, a federation of third-party data:\n\n- **NielsenIQ (NIQ)** — modelled retail sales data (Precision Areas), the spine of MiQ Commerce Canada; confirmed Sept 2024 [4][5].\n- **Circana** (formerly IRI) — named as an integrated data partner in MiQ Sigma's ecosystem in both the June 2025 launch and the June 2026 expansion [6][12][13]. Circana supplies syndicated CPG point-of-sale and panel data.\n- **Numerator** — named as a Sigma data-ecosystem integration partner in the June 2025 Sigma launch coverage [12][13]. Numerator supplies receipt-based purchase-panel data. There is no standalone MiQ-Numerator partnership press release; the relationship is attested only as a named integration within Sigma.\n- **Ibotta** — deterministic, receipt-verified shopping data; MiQ-Ibotta partnership announced **22 July 2021**, citing Ibotta's then 40M registered users and 2.5bn+ annual product purchases, used to build Shopper Audiences addressable without cookies/MAIDs via MiQ's contextual lookalike tech [14].\n\nOne relationship deserves a flag. The Ibotta partnership is dated **July 2021**, and no 2024-2026 source re-confirms it is still live. Ibotta's own commercial posture has since shifted — see its September 2025 strategic partnership with *Circana* for sales-lift measurement [15] — and its broader business has reorganized around the Ibotta Performance Network. The MiQ-Ibotta relationship is best presented as announced in 2021, with current status unconfirmed. Likewise, **Numerator** as a MiQ partner is attested only as a Sigma integration name and should not be over-stated. The existence of each named relationship at its announcement is well attested; what is uncertain is whether each remains current — and the data web is, in effect, the whole product.\n\n### Sigma is the activation/measurement layer the commerce data feeds into\n\nMiQ's commerce data does not stand alone; **Sigma**, MiQ's AI platform, ingests it (launched June 2025, built at MiQ's Bengaluru Centre of Excellence, reportedly a ~$100m investment) [12][16]. At the June 2025 launch, Sigma was described as unifying **300+ data feeds and 700 trillion consumer signals** across what people watch, browse and buy, integrated with The Trade Desk, Google DV360, AWS, Samba, Experian, Databricks, **Numerator, Circana**, Celtra and others, with an AI agent built on embeddings over Claude, Gemini and ChatGPT [12][13]. By the **June 2026 Sigma expansion**, the platform was described as **600+ feeds and 2.5 petabytes** of data, naming **Circana, TitanOS, Evertune, Databricks**, and introducing **Sigma Total Measurement** (\"optimise the full consumer journey to drive long-term sales growth, not just short-term media KPIs\"), with MiQ citing $2.22 of value per $1 spent vs. standard programmatic in A/B tests [6][17].\n\nTwo cautions. First, the **signal/feed figures changed presentation** between June 2025 (300+ feeds / 700T signals) and June 2026 (600+ feeds / 2.5PB) — different units, not directly comparable, possibly a re-baselined marketing metric rather than 2x growth; each belongs to its own dated source. Second, the June 2026 expansion coverage **did not name Numerator, Ibotta or NielsenIQ** — only Circana persists in the most recent list.\n\n### The CTV connection: shoppable, measurable TV is the point\n\nCommerce is not a side bet; it closes the loop on MiQ's core CTV/ATV thesis. MiQ Commerce explicitly provides **cross-channel attribution across CTV, OLV, YouTube, Display and Social**, linking upper-funnel brand media (especially TV) to lower-funnel in-store sales [11][18]. Its \"everything is shoppable\" positioning pairs shoppable CTV ad units with location-based features to drive store visits, and cites that a meaningful share of US buyers plan to increase shoppable-CTV investment [18][19]. The logic: CTV's measurement weakness has always been the open loop between a streaming impression and a purchase; commerce data — sales lift, store visitation — is what closes it. Shopper TV Intelligence, profiling the TV habits of a brand's actual shoppers, is the join between the two stories [3][9]. This is why commerce matters to MiQ strategically, not just as a revenue line. The *measurement rigor* is the contested part (see §4).\n\n---\n\n## 3. Linki and the Adsmovil Deal: MiQ's First Owned Retail-Media Asset\n\n### MiQ acquired Adsmovil's LatAm business (announced 25 March 2026), bringing the Linki retail-media platform\n\nOn **25 March 2026** MiQ announced the acquisition of **Adsmovil's Latin America business**, billed as creating the \"largest independent programmatic offering in Latin America,\" covering **12 markets** (Mexico, Brazil, Colombia, Argentina, Chile, Costa Rica, Ecuador, El Salvador, Guatemala, Peru, Puerto Rico, Uruguay) and **150+ employees** [20][21]. The deal brings two assets into MiQ: **Adsmovil Personas** (an audience/data product) and **Linki**, described as Adsmovil's **multi-channel / omnichannel retail media platform** that lets brands activate campaigns across commerce environments [20][21]. Financial terms were not disclosed. Crucially, the deal **excludes Adsmovil's US business**, which remains standalone under founder Alberto \"Banano\" Pardo (who becomes MiQ LatAm Chairman) [20][21]. Quotes: Gurman Hundal (MiQ co-founder/CEO) framed it as building \"the most complete… programmatic offering\"; Eric Tourtel (MiQ LatAm CEO) claimed regional independent leadership [20][21].\n\n### Linki + Sigma LatAm launched May 2026\n\nIn **May 2026** MiQ formally launched **Sigma in LatAm**, integrating Adsmovil Personas data and **Linki** into the platform [20][22]. This is the most concrete sense in which MiQ now *operates* a retail-media platform rather than merely orchestrating across others': Linki is an owned, multi-channel retail media activation surface, regionally scoped to LatAm. But the public detail on Linki is thin. What retailer relationships it carries, whether it owns first-party shopper data or (more likely) sits as an activation/connection layer across retailers' inventory, and its scale — none of that is yet established. Linki is best read as a live, owned MiQ retail-media platform in LatAm as of May 2026, with its data-ownership depth unconfirmed: the launch is firm, the substance under-specified, resting largely on MiQ's own announcement and trade echoes of it.\n\n### Linki does not change the core dependency thesis — it relocates it\n\nEven granting Linki as an owned asset, the critical read is this: a LatAm retail-media platform acquired via roll-up does not, on the evidence available, give MiQ proprietary first-party shopper data at the scale of an Amazon or a Walmart. Retail-media platforms of Linki's type typically broker access to *retailers'* environments and data. So Linki is best understood as **deepening MiQ's activation footprint and regional independence, not as resolving the \"owns no first-party data\" critique** — unless future disclosure shows otherwise. This reading is an inference, grounded in the absence of any disclosed first-party-data asset and the general structure of multi-channel RMN platforms.\n\n---\n\n## 4. The Critical Question: Can an Orchestration Layer Win in Commerce?\n\n### MiQ owns essentially no first-party shopper data; its commerce moat is measurement + neutrality, not data ownership\n\nThis is the analytical crux. Across every commerce capability above, the *data* originates elsewhere: NIQ (modelled sales), Circana/Numerator (panels), Ibotta (receipts), retailers (via Linki and 200+ RMNs). MiQ contributes identity resolution, cross-network harmonization, programmatic activation, and measurement/attribution — an **orchestration layer**. This is the same structural position MiQ occupies in its core programmatic business: agnostic intelligence on top of others' inventory and data. In commerce, that position is *more* exposed, because the most valuable asset in retail media is precisely the thing MiQ lacks — proprietary, deterministic, first-party purchase data tied to identity. That MiQ owns no first-party shopper data of consequence is plain — no source claims it does; all data is attributed to partners — while the strategic consequence is a matter of judgment.\n\n### Against retailer-owned networks (Amazon, Walmart Connect), MiQ cannot compete head-on — and isn't trying to\n\nAmazon and Walmart win on closed-loop determinism: they see the impression *and* the purchase inside one logged-in environment, and they take ~84-89% of US retail-media dollars [7][8]. MiQ has no equivalent and no path to one. Its strategy is therefore **complementary, not competitive** — be the neutral layer that operates *across* the long tail of 200+ RMNs and *connects* retail media to CTV/open-web brand media, doing the cross-network measurement no single retailer will do because each is incentivized to keep its garden walled [7][9]. The risk: this confines MiQ to the *non-duopoly* slice of a market whose incremental growth the duopoly is capturing [8]. The opportunity: CPG advertisers genuinely need someone neutral to harmonize a fragmenting field, and retailers' walled gardens create demand for exactly that.\n\n### Against pure-play commerce-media specialists, MiQ's edge is the CTV/omnichannel join, not commerce depth\n\nVersus specialists (Criteo, the retail-media tech stacks, clean-room/measurement vendors, and the syndicated-data owners themselves), MiQ is not the deepest commerce-data player. Its differentiated claim is the **omnichannel join**: it already runs CTV/ATV, YouTube, display and social at scale, so it can attach commerce outcomes to brand media across screens in one place — the shoppable/measurable-TV story (§2.5). That is a real, if narrower, edge. MiQ competes on *connecting commerce to everything else*, not on owning commerce. That read is an inference, grounded in the stack MiQ demonstrably operates.\n\n### Signal loss / privacy is a double-edged regulatory force\n\nThe deprecation of third-party cookies and MAIDs, and tightening privacy regimes, *raise* the value of deterministic first-party purchase data — which advantages the retailers who own it (Amazon/Walmart) and the syndicated panels (NIQ/Circana/Numerator/Ibotta) over an orchestration layer. MiQ's countermeasures show up in its own materials: contextual lookalike modelling (used in the 2021 Ibotta tie-up to reach Shopper Audiences on Safari/Firefox/iOS without cookies or MAIDs) and identity resolution inside Sigma [14][12]. Net: signal loss is a tailwind for *first-party-data owners* and a structural headwind for *data-borrowers* like MiQ, partially offset by MiQ's modelling/identity tooling. That read is an inference, grounded in the cookie/MAID deprecation context and MiQ's stated methods.\n\n---\n\n## 5. Commercial Model & Ownership Context\n\n### Bridgepoint PE ownership frames the commerce push as a margin-and-roll-up story\n\n**Bridgepoint** acquired a majority stake in MiQ from **ECI Partners** on **13 Sept 2022**, in a deal valuing MiQ at up to ~$1bn; ECI had backed MiQ since 2017 and reportedly realized a ~6.1x return [23][24]. Under PE ownership MiQ has run an explicit roll-up — Grasp, Samba, AirGrid, **Pathlabs** (announced July 2024), and now **Adsmovil/Linki** (2026) — each adding capability or geography [20][25]. Commerce fits the thesis. It is the fastest-growing, highest-attach adjacency to MiQ's core, and a managed-service/measurement business with software leverage (Sigma) supports the margin profile a PE owner underwrites toward an exit.\n\n### Pathlabs (Media Execution Partner) is the go-to-market channel, including for commerce\n\nMiQ announced the acquisition of **Pathlabs** (a Missoula, MT \"Media Execution Partner,\" founded 2021, ~100 people) on **29 July 2024**, to extend MiQ's programmatic execution to mid-size *independent agencies*; Pathlabs retains its brand and runs as a standalone unit [25]. The connection to commerce: Pathlabs widens the distribution funnel through which MiQ's commerce capabilities (Consumer Link, MiQ Commerce, Sigma) reach independent agencies and their CPG clients — a managed-service route to market for the commerce stack. The commerce-distribution link is an inference; the deal facts are not.\n\n---\n\n## Open Questions\n\n1. **Is the MiQ-Ibotta partnership (2021) still live?** No 2024-2026 confirmation found; Ibotta's posture has shifted (Circana tie-up, Sept 2025). This is the most important open question about whether the data web remains current.\n2. **What exactly is MiQ's relationship with Numerator?** Attested only as a Sigma integration name (June 2025); is there a contracted data partnership, and does it persist in the June 2026 Sigma (which named only Circana)?\n3. **Is \"Consumer Link\" still marketed as a distinct product, or has it been subsumed into Sigma?** The 2023 brand and \"90% of US households\" figure need a 2025-2026 re-confirmation.\n4. **Has MiQ Commerce launched in the US (and elsewhere) beyond Canada?** US commerce *capability* is described (blog, product pages), but there is no dated US *launch* announcement equivalent to the Sept 2024 Canada launch.\n5. **What is Linki, substantively?** Retailer relationships, whether it owns any first-party shopper data, its scale and whether MiQ intends to extend it beyond LatAm — all unconfirmed.\n6. **What revenue does commerce actually contribute to MiQ?** No disclosed commerce-segment revenue; the ~$500M+/1,900-person company-level figures were not independently confirmable.\n7. **Is MiQ Commerce measurement deterministic or modelled?** Canada is geo-level *modelled* (NIQ Precision Areas / FSA). How much of MiQ's \"closed-loop\" is true person-level closure vs. geo-lift modelling?\n8. **Does the June 2026 Sigma re-baseline (600+ feeds / 2.5PB vs. 300+ / 700T signals) reflect real growth or a metric change?**\n\n---\n\n## Sources\n\n1. eMarketer, \"FAQ on commerce media: How to capitalize on growth beyond retail,\" 2025. https://www.emarketer.com/content/faq-on-commerce-media-how-capitalize-on-growth-beyond-retail — Tier 5 (analytical/forecast). Definitions (commerce vs. retail media); US retail media ~$71.1bn 2026; Amazon/Walmart ~89% of incremental 2026. Accessed 2026-06-20.\n2. WPP Media / GroupM, *This Year, Next Year* (December 2025 forecast), as reported by Marketing Brew, \"Total global ad revenue grew to $1.14 trillion in 2025: WPP Media,\" 2025-12-09. https://www.marketingbrew.com/stories/2025/12/09/total-global-ad-revenue-grew-nearly-9-in-2025-wpp-media — Tier 5 reporting a Tier-1/2 forecast. Commerce 15.6% / ~$178.2bn of 2025 global ad revenue; retail media ~$176.9bn / ~15.9%. Accessed 2026-06-20.\n3. MiQ, \"MiQ Launches Consumer Link, Largest Consumer Data Footprint for CPG Marketers,\" 2023-05-08 (BusinessWire + MiQ newsroom). https://www.businesswire.com/news/home/20230508005222/en/ and https://www.wearemiq.com/resources/news/miq-launches-consumer-link-cpg-marketing — Tier 1 (company press release; treat claims as MiQ's). Consumer Link launch, 90% US households, three intelligence capabilities, Madorsky quote. Accessed 2026-06-20.\n4. MiQ Canada, \"MiQ Canada launches new sales uplift solution for CPG advertisers through data agreement with NielsenIQ,\" 2024-09-10. https://www.wearemiq.com/ca/resources/news/miq-commerce-cpg-sales-uplift-data-solution-announcement-niq — Tier 1 (company). MiQ Commerce Canada launch; NIQ Precision Areas; in-store attribution; Furlano quote. Accessed 2026-06-20.\n5. NielsenIQ, \"MiQ Canada launches new sales uplift solution… through data agreement with NielsenIQ,\" 2024-09-10. https://nielseniq.com/global/en/news-center/2024/miq-canada-launches-new-sales-uplift-solution-for-cpg-advertisers-through-data-agreement-with-nielseniq/ — Tier 1 (partner company). Precision Areas / FSA-level modelled sales; CA$2.8bn context; Busignani quote. Accessed 2026-06-20.\n6. MiQ, \"MiQ Sigma Expands with New Data, Capabilities and Ways to Activate,\" 2026-06-11 (BusinessWire); as reported by Mediabrief, \"MiQ expands Sigma AI platform…,\" 2026-06-12. https://www.businesswire.com/news/home/20260611682662/en/ and https://mediabrief.com/miq-expands-sigma-ai-platform/ — Tier 1 release / Tier 5 trade. Sigma Total Measurement; 600+ feeds / 2.5PB; Circana/TitanOS/Evertune/Databricks; $2.22-per-$1 claim; Goulding quote. Accessed 2026-06-20.\n7. PYMNTS, \"Amazon and Walmart See Intent as 2026's Dominant Monetization Layer,\" 2025. https://www.pymnts.com/news/retail/2025/amazon-and-walmart-see-intent-as-2026s-dominant-monetization-layer/ — Tier 5. Ecosystem-control framing; duopoly dominance. Accessed 2026-06-20.\n8. eMarketer, \"FAQ on retail media networks: How marketers should allocate budgets in 2026\" and \"2025 trend: Mounting pressure will squeeze the long tail of retail media networks,\" 2025. https://www.emarketer.com/content/faq-on-retail-media-networks-how-marketers-should-allocate-budgets-2026 — Tier 5 (forecast). Amazon ~79.7% / Walmart ~8.0% / Target ~1.5%; >84% 2025, ~89% incremental 2026; long-tail squeeze. Accessed 2026-06-20.\n9. MiQ US, \"From retailer silos to a single shopper view: The new commerce opportunity,\" 2025-11-10. https://www.wearemiq.com/us/resources/blog/the-new-commerce-opportunity — Tier 1 (company blog; position/marketing). 200+ global RMNs / walled gardens; \"basket to the wallet\"; 700T signals; orchestration framing. Accessed 2026-06-20.\n10. MiQ, Consumer Link product page. https://marketing.wearemiq.com/miqs-consumer-link — Tier 1 (company). Consumer Link data spine (170+ feeds variant), three intelligence pillars. Accessed 2026-06-20.\n11. MiQ Canada, \"Measure what matters: Linking brand exposure to in-store sales with MiQ Commerce\" / MiQ Commerce CA product page. https://www.wearemiq.com/ca/commerce and https://www.wearemiq.com/ca/resources/blog/linking-brand-exposure-to-in-store-sales — Tier 1 (company). Cross-channel attribution across CTV/OLV/YouTube/Display/Social; sales-lift to in-store. Accessed 2026-06-20.\n12. MiQ, \"MiQ Sigma Breaks the Fragmentation Cycle…,\" 2025-06-04 (BusinessWire). https://www.businesswire.com/news/home/20250604957858/en/ — Tier 1 (company). Sigma launch; 300+ feeds / 700T signals; integration partners incl. Numerator, Circana; LLM embeddings. Accessed 2026-06-20.\n13. eu.36kr / KMWorld / CIOL trade coverage of MiQ Sigma launch, June 2025 (e.g., https://www.kmworld.com/Articles/News/News/MiQ-Sigma-unifies-the-programmatic-ecosystem-of-advertising-data-170376.aspx) — Tier 5. Confirms Sigma partner roster (The Trade Desk, DV360, AWS, Samba, Experian, Databricks, Numerator, Celtra, Circana). Accessed 2026-06-20.\n14. MiQ & Ibotta, \"MiQ and Ibotta Announce Partnership to Advance Programmatic Advertising for CPG Industry,\" 2021-07-22 (BusinessWire). https://www.businesswire.com/news/home/20210722005194/en/ — Tier 1 (company; DATED 2021 — status-current UNCONFIRMED). Ibotta deterministic data (40M users / 2.5bn+ purchases); contextual lookalike reach without cookies/MAIDs. Accessed 2026-06-20.\n15. Circana, \"Circana and Ibotta Announce Strategic Partnership to Bring Sales Lift Measurement to Digital Promotions,\" 2025-09-30. https://www.circana.com/post/circana-and-ibotta-announce-strategic-partnership… — Tier 1 (company). Evidence Ibotta's measurement posture shifted toward Circana by Sept 2025 (relevant to whether the MiQ-Ibotta relationship remains live). Accessed 2026-06-20.\n16. Marketing-Interactive, \"MiQ unveils $100m Sigma platform to fix programmatic's fragmentation problem,\" 2025. https://www.marketing-interactive.com/miq-sigma-ai-meets-ambition-in-programmatic-next-chapter — Tier 5. ~$100m Sigma investment; Bengaluru CoE. Accessed 2026-06-20.\n17. citybiz / Mediabrief, \"MiQ Expands Sigma Platform With New AI Planning and Measurement Tools,\" 2026-06. https://www.citybiz.co/article/859065/ — Tier 5. Sigma Total Measurement; $2.22-per-$1; 600+ feeds / 2.5PB. Accessed 2026-06-20.\n18. MiQ, \"Everything is shoppable | Shoppable ads and CTV.\" https://www.wearemiq.com/resources/blog/everything-is-shoppable — Tier 1 (company). Shoppable CTV units, location-based store-drive features. Accessed 2026-06-20.\n19. ALM Corp, \"Shoppable CTV in 2026: Why E-commerce Brands Need Streaming Ads That Convert,\" 2026. https://almcorp.com/blog/shoppable-ctv-ecommerce-streaming-ads-2026/ — Tier 6/7 (vendor blog; use only as directional context on shoppable-CTV buyer intent). Accessed 2026-06-20.\n20. MiQ, \"MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering In Latin America,\" 2026-03-25 (MiQ newsroom + BusinessWire). https://www.wearemiq.com/resources/news/miq-acquires-adsmovil and https://www.businesswire.com/news/home/20260325615344/en/ — Tier 1 (company). Adsmovil LatAm acquisition; 12 markets; 150+ staff; Adsmovil Personas; Linki; Sigma LatAm May 2026; US business excluded; Hundal/Pardo/Tourtel quotes. Accessed 2026-06-20.\n21. ppc.land, \"MiQ buys Adsmovil's LatAm arm to dominate independent programmatic,\" 2026 and Portada, \"MiQ Buys Adsmovil in Latin America: 7 Things to Know,\" 2026 — Tier 5 trade. Independent corroboration of deal scope, Linki, market list. Accessed 2026-06-20.\n22. MiQ / trade coverage of Sigma LatAm launch (May 2026), via Adsmovil announcement materials. — Tier 1/5. Sigma LatAm + Linki integration timing. Accessed 2026-06-20.\n23. Bridgepoint, \"MiQ Announces Partnership with Bridgepoint,\" 2022-09-13. https://www.bridgepointgroup.com/about-us/news-and-insights/press-releases/2022/miq-announces-partnership-with-bridgepoint — Tier 1 (owner). Bridgepoint majority stake; ECI exit. Accessed 2026-06-20.\n24. PE Hub / mrweb Daily Research News, \"Bridgepoint buys digital marketing specialist MiQ from ECI Partners,\" 2022. https://www.pehub.com/bridgepoint-buys-digital-marketing-specialist-miq-from-eci-partners/ — Tier 5. ~$1bn valuation; ECI ~6.1x return; 2017 ECI entry. Accessed 2026-06-20.\n25. MiQ, \"MiQ to acquire Pathlabs, expanding programmatic excellence to independent agencies,\" 2024-07-29 (MiQ + Pathlabs + BusinessWire). https://www.wearemiq.com/us/resources/news/miq-to-acquire-pathlabs-expanding-programmatic-excellence-to-independent-agencies — Tier 1 (company). Pathlabs MEP acquisition; Missoula; ~100 staff; standalone brand; prior Grasp/Samba/AirGrid deals. Accessed 2026-06-20."}, {"order": 12, "file": "12_Agentic_Advertising.md", "title": "MiQ and the Agentic Advertising Frontier", "summary": "", "body": "# MiQ and the Agentic Advertising Frontier\n\n## Bottom Line\n\nMiQ has placed a credible, early, and well-marketed bet on **agentic advertising** — autonomous AI agents that plan and execute media-buying tasks toward a goal with limited human input. Its instrument is the **MiQ Sigma Trading Agent**, a conversational execution layer trained on the reasoning of three leading large language models (Anthropic's Claude, Google's Gemini, OpenAI's ChatGPT), monthly data from ~6,000 programmatic campaigns, and 15 years of tacit trader knowledge. MiQ's most-quoted speed claim is that what \"used to take six hours now takes 30 seconds\" — a figure that is **self-reported, single-source, with no disclosed methodology**. *(Verification correction: the line is attributed to **Vishal Shah, MiQ's Head of Products and Analytics** — not, as an earlier draft stated, a sales lead — and in the source it describes **generating global audience profiles/personas via Sigma's Gen AI Personas feature**, not cross-DSP/SSP audience activation. The narrower, accurate framing is used throughout below.)* In January 2026 MiQ joined **PubMatic's AgenticOS** as an early participant testing agent-led workflows, connecting the Trading Agent to more supply-side inventory; it is separately an early integration partner of **Yahoo DSP's** embedded agents and a buyer-agent test partner of **Magnite** (with Disney inventory). Global Chief Strategy Officer **John Goulding** has stated MiQ's plan to \"start scaling agentic ad buying\" through the Trading Agent in 2026 — a **forward-looking, announced-not-shipped** intention, and Goulding himself has conceded MiQ's live agent-to-agent media-buy tests are still \"in the five-figure territory.\"\n\nThe sharp question is whether MiQ's Trading Agent is a **moat or a defensive necessity**. The honest answer: **mostly the latter, with one genuinely defensible asset inside it.** A managed-service trading desk has structurally the most to lose if agents commoditize the act of trading — precisely the function MiQ has sold for fifteen years. Anyone can license the LLMs in the Trading Agent; the differentiator is the proprietary 15-year trading corpus the models are conditioned on, plus MiQ's multi-DSP/multi-SSP orchestration position. Against PubMatic (which owns the supply-side OS and co-authored the protocol), Yahoo DSP (agents embedded natively in the buying platform), and The Trade Desk (Koa agents inside the dominant independent DSP), MiQ is a **buyer that orchestrates across other people's pipes** — an advantageous neutral position if cross-platform agentic buying becomes the norm, an exposed middleman position if the DSPs and SSPs internalize the agent and route around the desk. The walled gardens (Google, Meta, Amazon) automate *within* their walls and sit largely outside MiQ's agentic reach. **Net: MiQ is correctly positioned for the open-web agentic transition, its core agent asset is real but narrow, and almost every quantified claim in this story is a vendor assertion that has not been independently verified.**\n\n---\n\n## 1. What \"Agentic Advertising\" Means, Decoded\n\nIn 2026 the vocabulary does a lot of marketing work, so start by deflating it.\n\n- **Agentic AI** = autonomous AI agents that *plan and execute multi-step tasks toward a goal with limited human input.* In advertising, that means an agent that takes a stated objective (\"drive incremental conversions for this brand at this CPA\") and then sets up, activates, paces, optimizes, and reports a campaign — rather than a human doing each click.\n- **Agent-to-agent advertising** = software agents on the **buy side** (the advertiser/agency/trading desk) and the **sell side** (the publisher/SSP) negotiating and transacting *directly with each other,* machine-to-machine, instead of through a human-operated UI and an RTB auction alone.\n- **MCP (Model Context Protocol)** = an open standard, originated by Anthropic, for connecting AI models to external tools and data sources. It is the generic \"USB-C for AI tools\" layer.\n- **AdCP (Ad Context Protocol)** = an advertising-specific open standard, built *on top of* MCP, for expressing advertising intent to agents — letting a buy-side agent and a sell-side agent exchange context (audiences, inventory, creative, deals) in a shared language. Launched October 15, 2025 by a supply-led coalition (Yahoo, PubMatic, Scope3, Optable, Swivel, Triton Digital) [10][11].\n- **Human-in-the-loop** = a human approves or bounds the a
