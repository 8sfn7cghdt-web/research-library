anuary 31, 2026).\n- In Q4 FY26, Walmart reported **global advertising +37% including VIZIO**, with **Walmart Connect U.S. at +41%** within that — i.e., the U.S. retail-media core grew faster than the blended global line that quarter.\n- Earlier in the year, in **Q1 FY26 (quarter ended ~April 2025), global advertising grew ~50% YoY and Walmart Connect U.S. grew 31%** — the VIZIO integration was already lifting the blended number above the domestic core.\n- Walmart's prior-year ad sales (FY25) were roughly **$3.4 billion**, framing the steepness of the FY26 jump.\n\n### 2.4 Why it matters disproportionately: the margin\n\nAdvertising and membership fees — both high-margin — **together accounted for roughly one-third of Walmart's operating income in Q4 FY26**. VIZIO-facilitated digital advertising has been estimated to carry margins near **70%**. The strategic point is not that ads are a big revenue line — at $6.4B they are <2% of Walmart's ~$680B+ in annual revenue. It is that they are a **profit line.** CFO John David Rainey told analysts Walmart still has \"long ways to go here to get in the neighborhood of some of the best-in-class competitors\" — management's own framing that the runway, not the current scale, is the story.\n\n### 2.5 What it monetizes today\n\nWalmart Connect now sells across the funnel:\n- **Search and sponsored products** (on-site, the original RMN bread-and-butter)\n- **On-site and off-site display**\n- **In-store** — ~170,000+ digital screens, self-checkout screens, TV walls\n- **CTV / streaming** — via VIZIO inventory, Connect Select, and (pending) Vibe\n- The whole thing is increasingly self-serve via Walmart's **Ad Center**, with VIZIO inventory appearing in Ad Center's display beta in 2026.\n\n### 2.6 The sibling: Sam's Club MAP\n\nWalmart's warehouse-club arm runs its own RMN: the **Sam's Club Member Access Platform (MAP)**, rebranded as MAP in **June 2022**, which ties omnichannel ad campaigns to actual member purchases in-app and in-club, drawing on decades of first-party member data. MAP is a second, distinct flywheel inside the same company. It matters here because it widens the universe of Walmart-owned advertising surfaces Vibe's self-serve logic could eventually touch.\n\n---\n\n## 3. VIZIO — The Screen and the Signal\n\n### 3.1 The deal, dated\n\n- **Agreement announced: February 20, 2024**, at **$11.50/share in cash, ~$2.3 billion fully-diluted equity value**.\n- **Closed: December 3, 2024.** VIZIO became a wholly-owned subsidiary; its Class A stock was delisted from the NYSE the same day.\n- Until Vibe, this was **Walmart's largest acquisition since VIZIO** — the deal Vibe is now repeatedly benchmarked against.\n\n### 3.2 What VIZIO brings, decoded\n\n**VIZIO is a smart-TV maker, but Walmart bought it for the software, not the hardware.** Three assets:\n\n1. **SmartCast — the operating system (OS).** SmartCast is VIZIO's smart-TV operating system: the software layer that runs the TV's home screen, app launcher, and free ad-supported streaming channels. Owning the OS means owning the **glass and the customer relationship** — not just selling the TV but controlling what's on it and who sees which ads. As of the deal, SmartCast had **over 19 million active accounts (18M+ at agreement, 19.1M reported for Q3 2024), growing ~400% since 2018**, streaming **5.8 billion hours in Q3 2024**.\n\n2. **ACR data — automatic content recognition.** ACR is the technology built into the smart TV that **identifies what is on the screen** — which show, ad, or streaming app is playing — by sampling the picture and audio and matching it against a reference database. For an advertiser, ACR answers two priceless questions: *what is this household watching* (for targeting) and *did this household see my ad* (for measurement and frequency capping). Fused with Walmart's purchase data, that raw signal lets Walmart say \"this household saw the ad on its VIZIO TV and then bought the product at Walmart\".\n\n3. **An established CTV ad business.** At the time of the deal, VIZIO's **Platform+ segment** (its advertising and data business) **accounted for a majority of the company's gross profit** and carried **over 500 direct advertiser relationships, including many of the Fortune 500**. Walmart did not buy a startup; it bought a working ad network with the screen attached.\n\n### 3.3 VIZIO's reach (as of 2026)\n\nAs of the Walmart/VIZIO joint strategy presentation **March 24, 2026**, VIZIO reached **~92 million households**, and the VIZIO operating system covered roughly **25–30% of U.S. households**; Walmart Connect itself touches **150 million weekly U.S. customers**. Walmart also rolled out a **unified login across VIZIO and onn. (Walmart's house-brand) TVs** to track how streaming engagement maps to retail purchases.\n\n### 3.4 VIZIO's first year inside Walmart\n\nIn its first year as a Walmart subsidiary, **VIZIO delivered triple-digit advertising-revenue growth in Q4 FY26** (the quarter ended January 31, 2026), per the February 19, 2026 earnings commentary — though from a comparatively small base. This is the number that makes the blended \"global advertising +46%\" line outrun the domestic Walmart Connect U.S. figure. VIZIO is the accelerant.\n\n### 3.5 The structural caveat\n\nWalmart and VIZIO were stated to **operate separately for the foreseeable future**, with founder William Wang continuing as VIZIO CEO reporting to Walmart U.S. leadership. VIZIO's ad business sits **outside** the retail-media environment where sellers compete for on-site visibility. So the \"$6.4B global advertising\" figure blends two different businesses — retail media and CTV media — a nuance any margin analysis must respect.\n\n---\n\n## 4. The Pipes — Magnite, Yahoo DSP, Google DV360, Connect Select\n\nWalmart wants its first-party data **buyable wherever advertisers already operate**, not only inside its own walled garden. That requires programmatic plumbing. Decode the acronyms first:\n\n- **DSP — demand-side platform:** the software an advertiser (or its agency) uses to *buy* digital ad impressions programmatically across many publishers.\n- **SSP — supply-side platform:** the software a publisher (the seller of inventory, e.g., VIZIO) uses to *sell* its impressions and connect to many DSPs.\n\n### 4.1 Connect Select (launched April 27, 2026)\n\n**Connect Select is a curated programmatic CTV marketplace inside the Walmart DSP** — a \"deal layer\" that bundles premium streaming inventory with Walmart's first-party retail data and closed-loop measurement. Its partners:\n- **SSP partners: Magnite, PubMatic, FreeWheel, Index Exchange**\n- **Publisher partners: VIZIO, Paramount, Warner Bros. Discovery**\n- It targets **mid-sized and smaller advertisers**, reducing the complexity that \"historically concentrated CTV's advantages among brands with dedicated programmatic teams and substantial media budgets.\" It integrates with campaign-management tools **Pacvue and Skai**.\n- A reported performance proof point: Walmart CTV campaigns delivered **a median of 44% new-to-brand buyers in FY26**, verified against actual Walmart purchase data.\n\n### 4.2 Walmart data in Yahoo DSP, routed via Magnite (May 28, 2026)\n\nOn **May 28, 2026**, Walmart Connect made its **first-party audiences and closed-loop measurement available inside Yahoo DSP**, routed through **Magnite's supply-side technology**, covering **VIZIO CTV inventory** — initially as a **\"closed proof-of-concept,\"** with Yahoo as the launch DSP and wider availability planned. Magnite's role is supply-side decisioning that reduces signal loss and improves audience match rates; the model is designed to extend to **multiple DSPs** through the same Walmart-controlled data-enablement layer. Named executives: **Adam Roodman (GM, Yahoo DSP)** and **Sean Buckley (President of Revenue and Market Strategy, Magnite)**.\n\n### 4.3 Google DV360 in the mix\n\n**Google Display & Video 360 (DV360)** — Google's enterprise DSP — is named alongside Yahoo DSP and Magnite in Walmart's June 2026 description of its \"growing media ecosystem,\" indicating Walmart is pursuing a **multi-DSP** data-distribution strategy rather than betting on a single buying platform.\n\n### 4.4 The pattern: open the data, keep the loop\n\nThe through-line across Connect Select, Yahoo DSP, and DV360 is consistent: **Walmart keeps ownership of the data and the measurement, but lets advertisers activate it through whatever DSP they already use.** This is the opposite of a pure walled garden — a \"data-everywhere, measurement-at-home\" posture. It has a precedent. **Best Buy named Magnite its exclusive SSP/curation partner in September 2025** using a structurally similar retail-data-into-programmatic-CTV model, signaling an industry pattern, not a Walmart one-off.\n\n---\n\n## 5. The Gap Vibe Fills (Exhibit B: The Long Tail)\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 560\" role=\"img\" aria-label=\"A five-station closed loop showing how Walmart's acquisition of Vibe completes a circuit from a small advertiser to a measured store sale. An SMB advertiser enters through the gold-highlighted Vibe self-serve console, which buys a CTV impression on a VIZIO screen, which Walmart's shopper data ties to a measured store sale, which sharpens the targeting data, which feeds back to the console. The center reads: closing the loop, from a fifty-dollar TV ad to a measured sale.\">\n<defs>\n<marker id=\"wvh-arrow\" viewBox=\"0 0 12 12\" refX=\"8\" refY=\"6\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1 L10 6 L1 11 Z\" class=\"f-t5\"/><\/marker>\n<\/defs>\n<text x=\"350\" y=\"34\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:19px;font-weight:700\">The Spark That Closes the Loop<\/text>\n<text x=\"350\" y=\"56\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:12px\">Walmart had built four layers of an ad machine; Vibe is the fifth that lets a small advertiser in &#8212; and closes the circuit<\/text>\n<circle cx=\"350\" cy=\"300\" r=\"160\" fill=\"none\" class=\"ln-soft\" stroke-width=\"1.5\" stroke-dasharray=\"3 5\"/>\n<g class=\"cv-spin\">\n<circle cx=\"350\" cy=\"300\" r=\"70\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--accent)\"/>\n<text x=\"350\" y=\"288\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:12.5px;font-weight:700\">THE CLOSED<\/text>\n<text x=\"350\" y=\"304\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:12.5px;font-weight:700\">LOOP<\/text>\n<text x=\"350\" y=\"322\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">$50 ad &#8594; measured sale<\/text>\n<\/g>\n<line x1=\"408\" y1=\"190\" x2=\"448\" y2=\"232\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvh-arrow)\"/>\n<line x1=\"478\" y1=\"360\" x2=\"430\" y2=\"406\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvh-arrow)\"/>\n<line x1=\"318\" y1=\"446\" x2=\"262\" y2=\"446\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvh-arrow)\"/>\n<line x1=\"222\" y1=\"406\" x2=\"196\" y2=\"360\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvh-arrow)\"/>\n<line x1=\"210\" y1=\"232\" x2=\"250\" y2=\"190\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvh-arrow)\"/>\n<g class=\"cv-rise\" style=\"--d:.05s\">\n<rect x=\"278\" y=\"120\" width=\"144\" height=\"58\" rx=\"4\" class=\"f-panel s-t1\" stroke-width=\"1.5\"/>\n<text x=\"350\" y=\"142\" text-anchor=\"middle\" style=\"fill:var(--t1);font-size:12px;font-weight:700\">SHOPPER DATA<\/text>\n<text x=\"350\" y=\"158\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">Walmart Connect &#183; 280M weekly<\/text>\n<text x=\"350\" y=\"170\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">$6.4B FY26 &#183; +46%<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.18s\">\n<rect x=\"430\" y=\"206\" width=\"150\" height=\"58\" rx=\"4\" class=\"f-panel\" stroke-width=\"2\" style=\"stroke:var(--accent)\"/>\n<rect x=\"430\" y=\"206\" width=\"150\" height=\"14\" rx=\"4\" style=\"fill:var(--accent)\"/>\n<text x=\"505\" y=\"216\" text-anchor=\"middle\" style=\"font-size:8px;font-weight:700;fill:var(--bg)\">NEW &#183; the missing piece<\/text>\n<text x=\"505\" y=\"238\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:12px;font-weight:700\">VIBE CONSOLE<\/text>\n<text x=\"505\" y=\"252\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">self-serve, $50/day<\/text>\n<text x=\"505\" y=\"262\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">reported ~$1.4B<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.31s\">\n<rect x=\"372\" y=\"404\" width=\"144\" height=\"58\" rx=\"4\" class=\"f-panel s-t4\" stroke-width=\"1.5\"/>\n<text x=\"444\" y=\"426\" text-anchor=\"middle\" style=\"fill:var(--t4);font-size:12px;font-weight:700\">CTV IMPRESSION<\/text>\n<text x=\"444\" y=\"442\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">VIZIO screen + ACR<\/text>\n<text x=\"444\" y=\"454\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">~$2.3B &#183; Dec 2024<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.44s\">\n<rect x=\"184\" y=\"404\" width=\"144\" height=\"58\" rx=\"4\" class=\"f-panel s-t2\" stroke-width=\"1.5\"/>\n<text x=\"256\" y=\"426\" text-anchor=\"middle\" style=\"fill:var(--t2);font-size:12px;font-weight:700\">MEASURED SALE<\/text>\n<text x=\"256\" y=\"442\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">closed-loop to a purchase<\/text>\n<text x=\"256\" y=\"454\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">the proof CTV lacked<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.57s\">\n<rect x=\"120\" y=\"206\" width=\"150\" height=\"58\" rx=\"4\" class=\"f-panel s-t5\" stroke-width=\"1.5\"/>\n<text x=\"195\" y=\"228\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:12px;font-weight:700\">SMB ADVERTISER<\/text>\n<text x=\"195\" y=\"244\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">+ Marketplace sellers<\/text>\n<text x=\"195\" y=\"256\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">the long tail<\/text>\n<\/g>\n<text x=\"350\" y=\"520\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px;font-style:italic\">Own the data, the screen, and the front door, and a single retailer runs the whole circuit &#8212; the disintermediation thesis.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> Walmart did not buy Vibe to enter connected TV &#8212; it had the data and the screen already. It bought the one layer that lets a $50-a-day advertiser <em>in<\/em>, closing a loop from a streaming-TV impression to a measured store sale that neither retail media nor CTV could close alone.<\/figcaption>\n<\/figure>\n\n\nLayers 1–4 are formidable, and they all share one limitation: **they assume the buyer is sophisticated.** Connect Select lives inside Walmart DSP and integrates with Pacvue/Skai — tools used by brands with programmatic teams. The Yahoo/Magnite/DV360 routes serve agencies and enterprise advertisers. Even the \"curated, simplified\" Connect Select is, per Walmart's own framing, aimed at \"mid-sized and smaller advertisers\" — meaning brands that still have *someone* who can operate a DSP.\n\nThe segment none of these reach is the **true long tail**: the SMB and the Walmart third-party marketplace seller with a budget of a few hundred to a few thousand dollars, no agency, no programmatic team, and no intention of learning a DSP. This is the segment Vibe was built for.\n\n### 5.1 What Vibe is, decoded\n\n**Vibe.co is a self-serve CTV advertising platform** — the buyer logs in, uploads a video, sets a budget (the category's hallmark is low minimums, often cited around the $500 floor that \"democratized\" the space), picks an audience, and launches a streaming-TV campaign in minutes, \"the way they run paid social: measurable, fast to launch, and optimized for better outcomes\" (CEO Arthur Querou). Per the acquisition announcement, Vibe brings **self-serve campaign activation, direct supply-partner integrations, proprietary ad technology, and performance-driven optimization**, with **more than 10,000 advertisers** and AI-driven targeting, optimization, and measurement.\n\n### 5.2 The strategic fit, in Walmart's words\n\nPer the June 23, 2026 announcement, the combination is \"expected to support broader adoption of CTV ad media among advertisers across Walmart Connect and the broader connected TV ecosystem, particularly among SMB and mid-market advertisers, **including Walmart's third-party marketplace sellers**\". **Ryan Mayward, GM and SVP of Walmart Connect U.S.**, framed it: \"Walmart Connect is focused on making commerce media more accessible, more measurable and easier to activate for advertisers of all sizes\".\n\nThe marketplace-seller angle is the underappreciated one. Walmart Marketplace has **roughly 160,000–200,000 active third-party sellers** (one widely-cited figure: 160,000+ active sellers, up ~40% YoY) — a captive, on-platform population of advertisers who already sell on Walmart, already want to move product, and have zero ability to buy national TV. Vibe lets a marketplace seller put a streaming-TV ad behind a listing as easily as boosting a social post. And Walmart closes the loop, because it sees the resulting sale.\n\n### 5.3 Why Walmart couldn't reach them before\n\nThe structural reason is the **sales motion.** Retail media and CTV have historically been sold through **managed service** (Walmart's team runs the campaign) or **agencies** (the brand's agency runs it). Both are economically viable only above a spend threshold — a salesperson cannot profitably hand-hold a $500 advertiser. The long tail is reachable *only* through self-serve software, where the marginal cost of an additional advertiser approaches zero. Walmart had the data, the screen, the supply, and the pipes — but **not the self-serve front door.** That is the precise, single thing Vibe supplies. The market context underlines the opportunity: only ~25% of CTV campaigns currently carry lower-funnel (performance) objectives, and SMB performance budgets for streaming remain, in Querou's phrase, \"small potatoes compared to search and social\" — the long-tail TAM is largely unconverted.\n\n---\n\n## 6. The Flywheel, Assembled (Exhibit C)\n\nNow the full loop, with each arrow grounded:\n\n1. **More shoppers → more data.** ~150 million weekly U.S. customers across stores + e-commerce, plus ~92 million VIZIO households, generate first-party purchase and viewing data.\n2. **More data → better, provable ads.** Walmart fuses purchase data with VIZIO's ACR viewing signal to target ads and, critically, to **close the loop** — proving an ad exposure led to a sale, in-store or online. Proof point: median 44% new-to-brand buyers on CTV campaigns.\n3. **Better ads → more ad dollars.** Provable outcomes pull spend: $6.4B global advertising in FY26, +46%; VIZIO triple-digit; the #2 U.S. retail media network.\n4. **Ad dollars → profit → lower prices.** Advertising's ~70%-margin economics, with ads + membership = ~⅓ of Q4 operating income, throw off profit Walmart can reinvest to hold prices down.\n5. **Lower prices → more shoppers.** Back to step 1.\n\n**Where Vibe enters the loop:** Vibe **widens the mouth of step 3.** By converting the long tail of SMBs and marketplace sellers into paying CTV advertisers, it adds a large new class of ad dollars that the managed-service/agency motion left on the table. And because those advertisers buy VIZIO and partner inventory measured by Walmart's loop, every new Vibe advertiser also **thickens the data in step 2.** Vibe expands demand and data at once. Walmart and VIZIO leadership have begun calling this the **\"brand flywheel\"** explicitly — Nyma Quidwai (Walmart): \"It's a brand flywheel that allows you to connect media, engagement and commerce\".\n\n---\n\n## 7. The Furner Context\n\nThis is the **first sizable acquisition under Walmart's new CEO.** **John Furner became President and CEO of Walmart Inc. on February 1, 2026**, succeeding **Doug McMillon, who retired January 31, 2026**; the transition was announced **November 14, 2025**. Furner — a Walmart lifer who started as an hourly associate in 1993 and ran Sam's Club U.S. and then Walmart U.S. (since 2019) — inherits the ad machine McMillon's team assembled. The Vibe deal, announced June 23, 2026, less than five months into his tenure, signals continuity: the high-margin advertising flywheel is a Furner-era priority, not a McMillon-era artifact left to coast. One tell that this is a business-unit bolt-on rather than a CEO-headline deal: Furner is **not** quoted in the Vibe announcement itself, which is led by Walmart Connect's Ryan Mayward.\n\n---\n\n## 8. Competitive Frame — The Amazon Yardstick (Exhibit D)\n\nEvery figure in this machine is, ultimately, a measurement against Amazon:\n\n| Metric (most recent) | Amazon | Walmart |\n|---|---|---|\n| U.S. retail-media ad revenue, 2025 | $60.6B (retail media); >$68B all-in advertising | $6.4B global advertising (FY26) |\n| U.S. retail-media market share, 2025 | ~79.7% | ~8.0% (distant #2) |\n| Combined share (Amazon + Walmart) | — | >84% of U.S. retail-media budgets |\n\nAmazon is roughly **10x Walmart's ad revenue** and commands ~80% of U.S. retail-media share to Walmart's ~8%. Walmart's entire VIZIO-plus-Magnite-plus-Vibe build is an attempt to do what Amazon already does — own the screen (Fire TV / Prime Video for Amazon; VIZIO/onn. for Walmart), own the self-serve buying surface (Amazon's sponsored ads + DSP), and close the commerce loop — but from a base one-tenth the size. Vibe is Walmart's answer to the part of Amazon's machine that quietly converts hundreds of thousands of small Amazon sellers into self-serve advertisers. The competitive read: **Walmart is buying, in one move, the SMB self-serve capability that took Amazon a decade to build by hand.**\n\n---\n\n## Open Questions\n\n1. **What is Vibe's actual revenue run-rate and take-rate?** A ~$100M run rate and ~$410M Sept-2025 valuation have been cited; the deal announcement and trade coverage state \"more than 10,000 advertisers\" but do **not** confirm revenue, run-rate, or take-rate. At ~$1.4B for a company of this size, the multiple is the crux of the price-fairness question — and it remains unconfirmed in the public record. (Taken up in the chapters on Vibe the company and on the transaction itself.)\n2. **Does Connect Select cannibalize Vibe, or vice versa?** Both target \"smaller/mid-sized advertisers.\" The line between Connect Select (inside Walmart DSP, integrates Pacvue/Skai) and Vibe (true self-serve, no DSP literacy required) is a segmentation question Walmart has not publicly drawn. Channel conflict is plausible.\n3. **Will VIZIO and Walmart Connect stay separate?** Walmart said \"separate for the foreseeable future\" (Dec 2024). With Vibe routing SMB demand toward VIZIO inventory and a unified VIZIO/onn. login already live, the operational firewall may be eroding faster than the public posture admits.\n4. **How much of the \"$6.4B global advertising / +46%\" is VIZIO vs. the retail-media core?** Walmart blends two different businesses in one line. Without a VIZIO-only disclosure, the true growth rate of the core RMN (reported at +41% U.S. in Q4) versus the VIZIO accelerant (triple-digit, small base) cannot be cleanly separated. This matters for any margin or trajectory model.\n5. **Antitrust exposure.** The deal is subject to HSR (Hart-Scott-Rodino) review. Whether the FTC scrutinizes the *combination* of Walmart's purchase data + VIZIO ACR data + an SMB self-serve funnel (a privacy/data-concentration angle, not just market share) is open. (Taken up in the chapter on risks and the bear case.)\n\n---\n\n## Sources\n\n**Tier 1 — Primary (Walmart / VIZIO / Vibe corporate, SEC):**\n\n1. Walmart, \"Walmart to Acquire Vibe.co to Ex
