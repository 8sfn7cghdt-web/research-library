Up Record Q4 Sales... advertising,\" 2026-02. https://variety.com/2026/digital/news/amazon-q4-2025-earnings-capex-advertising-sales-1236653797/ — Tier 4/5 (major trade). Accessed 2026-06-26. [Q4 2025 ad revenue $21.32B, +23%; total Q4 revenue $213.4B; Prime Video 315M+ monthly viewers, ads in 16 countries; earnings 2026-02-05.]\n20. Amazon Ads / MNTN guide, \"Prime Video Advertising in 2026\" & Amazon Sponsored TV/DSP specs. https://mountain.com/blog/prime-video-advertising/ and https://advertising.amazon.com/solutions/products/amazon-dsp — Tier 1 (Amazon product docs) + Tier 5 (MNTN trade). Accessed 2026-06-26. [Sponsored TV = no-minimum self-serve; DSP streaming TV ~$10K self-serve / ~$50K managed minimums; unBoxed 2025 rollout Nov 11 2025.]\n21. Vibe.co pricing, \"TV Ad Rates Simulator\" / homepage. https://www.vibe.co/pricing and https://www.vibe.co/ — Tier 1 (company product page — claims). Accessed 2026-06-26. [Starts at $500 / $50/day; 500+ channels; campaigns live in minutes; Vibe Studio AI creative.]\n22. eMarketer / BusinessWire, \"Amazon Ads and Roku Announce Partnership Creating the Largest Authenticated CTV Footprint,\" 2025-06-15. https://www.businesswire.com/news/home/20250615384366/en/ and https://www.emarketer.com/content/amazon-roku-partner-up-offer-more--and-cheaper--ctv-inventory — Tier 1 (release) + Tier 5 (analysis). Accessed 2026-06-26. [~80M households / >80% of US CTV households (Comscore); Amazon DSP exclusive; shared identity; Q4 2025 availability; +40% unique reach, −30% repeat exposure in tests.]\n23. Adweek, \"Amazon's Ad Revenue Was $56 Billion Last Year,\" 2025. https://www.adweek.com/commerce/amazons-ad-revenue-was-56-billion-last-year/ — Tier 5 (trade; reporting Amazon's 2024 10-K figure). Accessed 2026-06-26 (headline read via search; body 403). [Establishes ~$56.2B = Amazon's 2024 full-year ad revenue — the figure the brief's \"2025\" premise actually refers to.]\n24. Marketplace Pulse / Statista, \"Amazon Advertising Services Sales 2020–2026\" and \"Walmart's Advertising Revenue Is Outpacing Amazon's.\" https://www.marketplacepulse.com/articles/walmarts-advertising-revenue-is-outpacing-amazons and https://www.marketplacepulse.com/stats/amazon-advertising-services-sales — Tier 5 (data analysis on Amazon reported results). Accessed 2026-06-26. [Amazon ad revenue ~$68.6B (2025), +22%; Walmart $6.4B (+46%); gap 15x→11x in four years; penetration 8% vs 4% of GMV.]\n25. AdExchanger / Beet.TV, \"Roku And Amazon's New Deal Will Target 80% Of US CTV-Watching Households\" / \"Rokus Jeff Katz: Amazon Partnership Reaches '80% of U.S. CTV Footprint',\" 2025-06 / 2025-12. https://www.adexchanger.com/tv/roku-and-amazons-new-deal-will-target-80-of-us-ctv-watching-households/ and https://www.beet.tv/2025/12/rokus-jeff-katz-amazon-partnership-reaches-80-of-us-ctv-footprint.html — Tier 5/6 (trade + exec interview). Accessed 2026-06-26. [>80% footprint reaffirmed live as of Dec 2025 — going-concern confirmation.]\n26. eMarketer, \"Amazon and Roku partner up to offer more (and cheaper) CTV inventory,\" 2025-06. https://www.emarketer.com/content/amazon-roku-partner-up-offer-more--and-cheaper--ctv-inventory — Tier 5 (research). Accessed 2026-06-26. [Cheaper/more inventory framing; corroborates Q4-2025 availability.]\n27. AdLib, \"10 Best Self-Serve CTV Advertising Platforms in 2026,\" 2026. https://getadlib.com/blog/best-self-serve-ctv-advertising-platforms/ — Tier 6 (vendor-adjacent listicle; corroborating pricing only). Accessed 2026-06-26. [Vibe $50/day starting; campaigns live in <5 min — corroborates [21], not used for any non-pricing claim.]\n28. Yahoo Finance / TVREV, \"The Trade Desk powers Walmart's DSP\" and \"The Trade Desk's TV OS push (Ventura),\" 2026. https://www.tvrev.com/news/the-trade-desks-tv-os-push — Tier 5 (trade analysis). Accessed 2026-06-26. [Walmart DSP powered by The Trade Desk; TTD building competing Ventura TV OS — the frenemy dependency.]\n29. VideoWeek / AdExchanger, \"The Trade Desk's Ventura OS Makes an Ecosystem Pivot\" / \"Inside The Trade Desk's Pitch For Ventura TV OS,\" 2026-02. https://videoweek.com/2026/02/25/the-trade-desks-ventura-os-makes-an-ecosystem-pivot/ — Tier 5 (trade). Accessed 2026-06-26. [Ventura as TTD's own CTV OS; competitive to owned-OS retail-media model.]"}, {"order": 6, "file": "06_Competitive_Market_Map.md", "title": "The Competitive & Market-Structure Map: Who Plays Where, and Who Keeps the Spread", "summary": "", "body": "# The Competitive & Market-Structure Map: Who Plays Where, and Who Keeps the Spread\n\n## Bottom Line\n\nWalmart did not buy a company. It bought a **front door**. Vibe.co is a self-serve connected-TV (CTV — streaming-TV delivered over the internet to a smart TV) ad platform that lets a small business launch a streaming-TV campaign in minutes for as little as **$50/day** (a ~$500 starter budget), paying only for media at **$15–$25 CPM** (CPM = cost per thousand impressions) with no platform fee [1][2]. That product is the one thing Walmart's $6.4B-a-year (FY2026, +46% YoY) advertising machine still lacked: a true long-tail onramp [3][4]. The acquisition closes a stack — **the data** (Walmart's ~280M weekly shoppers and closed-loop purchase measurement), **the screen and the ACR signal** (VIZIO SmartCast, acquired for $2.3B in Dec 2024, ~19M+ active accounts plus Inscape automatic-content-recognition data from 24M+ opted-in TVs), and now **the self-serve buying front-end** (Vibe) [1][5][6][7]. Owning all three layers is how Walmart attacks the central question of this market: *who keeps the spread* — the margin between what an advertiser pays and what the publisher receives. In a typical open-programmatic CTV path (brand → agency → DSP → exchange/SSP → publisher), each hop skims ~10–15% and the publisher keeps under ~40–60% of the original dollar [8][9]. Own the OS, the data, and the buying tool, and Walmart can collapse those hops and capture more of the chain — classic **supply-path optimization (SPO)** and partial **disintermediation** (cutting out the middle layers). But the map is unforgiving. In **Field A (self-serve CTV)**, Vibe is one of at least seven credible onramps, and its headline differentiators — low minimum, fast launch, direct deals — are matchable; the durable edge has to come from Walmart's data and measurement, not from Vibe's UI. In **Field B (retail media networks — retailers selling ads against their own shopper data)**, the structure is brutally concentrated: eMarketer puts **Amazon at ~79.7% of US retail-media spend in 2025 and Walmart second at ~8.0%**, with Amazon's ad business (~$56B in 2025) roughly **9× Walmart Connect's** [10][11]. The deal is a credible move to widen Walmart's funnel and defend the #2 slot, not a path to overtaking Amazon — whose own June 2025 Roku partnership (~80M households, ~80%+ of US CTV homes) and dropped DSP minimums show it fortifying the exact SMB-CTV ground Walmart is buying into [12][13].\n\n---\n\n## 1. The Frame: Two Overlapping Fields, One Margin Question\n\nThis deal lives where two markets converged in 2024–2026, and the competitive map has to hold both in view at once.\n\n**Field A — Self-serve CTV platforms for SMBs and performance buyers.** These tools let a non-expert run a streaming-TV ad the way they run a Facebook or Google ad: pick an audience, set a budget, upload (or generate) a video, go live the same day. The category exists because CTV ad-buying used to demand an agency, an insertion order, and a five-figure minimum. A wave of $500-minimum self-serve tools — Vibe, Roku Ads Manager, MNTN, tvScientific, and the self-serve tiers of Amazon DSP and Hulu/Disney — broke that gate open. Vibe is the company Walmart bought. The competitive question is whether Vibe is *differentiated* or merely *one of many*.\n\n**Field B — Retail media networks (RMNs).** These are retailers monetizing their first-party shopper data — what people actually buy — by selling ads, both **on-site** (sponsored products on walmart.com or amazon.com) and increasingly **off-site** (the retailer's data activated on the open web, social, and CTV). Walmart Connect, Amazon Ads, Target Roundel, Instacart, and Kroger Precision Marketing make up the field. The Vibe deal is a Field-B player (Walmart) buying a Field-A asset (Vibe) to push its first-party data off-site into self-serve CTV.\n\n**The connective tissue is the margin question.** Whoever owns more of the value chain — the operating system, the data, the demand-side buying tool, the supply — keeps more of the spread. What follows maps both fields on the metrics that decide who wins, then traces the value chain to show *exactly where Walmart's three-layer stack captures margin the open-programmatic path leaks away*.\n\n---\n\n## 2. Field A: The Self-Serve CTV Platform Landscape\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 540\" role=\"img\" aria-label=\"A two-by-two field of self-serve connected-TV ad platforms. The horizontal axis is the entry minimum, from a low daily floor on the left to enterprise-grade on the right; the vertical axis is inventory position, from renting supply at the bottom to owning the screen or operating system at the top. Amazon DSP sits top-right as a large dot that both dropped its minimum and owns Prime Video and Fire TV. Roku Ads Manager and Hulu and Disney self-serve sit high on the inventory axis at a five-hundred-dollar minimum because they own premium screens. The Trade Desk sits bottom-right as enterprise-grade renting open-internet supply. MNTN and tvScientific cluster bottom-left as low-cost performance buyers that rent inventory. Vibe is the large gold dot at a fifty-dollar-a-day minimum and mid inventory, with a faint gold arrow lifting it upward after Walmart's acquisition adds VIZIO's owned screen and Walmart's data.\">\n<defs>\n<marker id=\"wvf-arrow\" viewBox=\"0 0 12 12\" refX=\"9\" refY=\"6\" markerWidth=\"9\" markerHeight=\"9\" orient=\"auto-start-reverse\"><path d=\"M1 1 L10 6 L1 11 Z\" style=\"fill:var(--accent)\"/><\/marker>\n<\/defs>\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:18px;font-weight:700\">The Self-Serve CTV Field<\/text>\n<text x=\"350\" y=\"50\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:11.5px\">Low minimums are now table stakes &#8212; the durable edge is what you own beneath the console<\/text>\n<rect x=\"120\" y=\"78\" width=\"500\" height=\"360\" fill=\"none\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"370\" y1=\"78\" x2=\"370\" y2=\"438\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 5\"/>\n<line x1=\"120\" y1=\"258\" x2=\"620\" y2=\"258\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 5\"/>\n<text x=\"370\" y=\"462\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:700\">ENTRY MINIMUM<\/text>\n<text x=\"130\" y=\"462\" text-anchor=\"start\" class=\"t-muted t-mono\" style=\"font-size:9px\">low &#183; $50/day<\/text>\n<text x=\"610\" y=\"462\" text-anchor=\"end\" class=\"t-muted t-mono\" style=\"font-size:9px\">enterprise / agency<\/text>\n<text x=\"104\" y=\"262\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:700\" transform=\"rotate(-90 104 262)\">INVENTORY POSITION<\/text>\n<text x=\"113\" y=\"92\" text-anchor=\"end\" class=\"t-muted\" style=\"font-size:9px\" transform=\"rotate(-90 113 92)\">owns the screen / OS<\/text>\n<text x=\"113\" y=\"430\" text-anchor=\"end\" class=\"t-muted\" style=\"font-size:9px\" transform=\"rotate(-90 113 430)\">rents inventory<\/text>\n<text x=\"200\" y=\"100\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px;font-style:italic\">low cost &#183; owns supply<\/text>\n<text x=\"540\" y=\"100\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px;font-style:italic\">premium &#183; owns supply<\/text>\n<text x=\"200\" y=\"424\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px;font-style:italic\">cheap onramp &#183; rents<\/text>\n<text x=\"540\" y=\"424\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px;font-style:italic\">enterprise &#183; rents<\/text>\n<g class=\"cv-fade\" style=\"--d:.05s\">\n<line x1=\"190\" y1=\"318\" x2=\"234\" y2=\"270\" style=\"stroke:var(--accent)\" stroke-width=\"1.6\" stroke-dasharray=\"4 4\" marker-end=\"url(#wvf-arrow)\" class=\"cv-draw\" pathLength=\"1\"/>\n<circle cx=\"190\" cy=\"318\" r=\"22\" class=\"f-panel\" stroke-width=\"2.5\" style=\"stroke:var(--accent)\"/>\n<circle cx=\"190\" cy=\"318\" r=\"9\" style=\"fill:var(--accent)\"/>\n<text x=\"190\" y=\"358\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:12.5px;font-weight:700\">Vibe.co<\/text>\n<text x=\"190\" y=\"372\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:8.5px\">$50/day &#183; $15&#8211;25 CPM<\/text>\n<text x=\"190\" y=\"384\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">100% direct deals, owns no screen<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.18s\">\n<circle cx=\"248\" cy=\"252\" r=\"6.5\" style=\"fill:var(--muted)\"/>\n<text x=\"262\" y=\"246\" text-anchor=\"start\" class=\"t-acc\" style=\"font-size:9px;font-weight:700\">post-Walmart<\/text>\n<text x=\"262\" y=\"258\" text-anchor=\"start\" class=\"t-muted\" style=\"font-size:8px\">+ VIZIO screen + Walmart data<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.31s\">\n<circle cx=\"568\" cy=\"150\" r=\"26\" style=\"fill:var(--t5);opacity:0.16\"/>\n<circle cx=\"568\" cy=\"150\" r=\"11\" style=\"fill:var(--t5)\"/>\n<text x=\"568\" y=\"124\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:12px;font-weight:700\">Amazon DSP<\/text>\n<text x=\"568\" y=\"180\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">dropped its minimum<\/text>\n<text x=\"568\" y=\"192\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">Prime Video + Fire TV<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.40s\">\n<circle cx=\"438\" cy=\"138\" r=\"9\" style=\"fill:var(--t4)\"/>\n<text x=\"438\" y=\"118\" text-anchor=\"middle\" style=\"fill:var(--t4);font-size:11px;font-weight:700\">Roku Ads Mgr<\/text>\n<text x=\"438\" y=\"160\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:8.5px\">$500 min<\/text>\n<text x=\"438\" y=\"172\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">owns the OS / home screen<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.49s\">\n<circle cx=\"468\" cy=\"210\" r=\"8.5\" style=\"fill:var(--t5)\"/>\n<text x=\"468\" y=\"192\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:11px;font-weight:700\">Hulu / Disney<\/text>\n<text x=\"468\" y=\"232\" text-anchor=\"middle\" class=\"t-muted t-mono\" style=\"font-size:8.5px\">$500 min<\/text>\n<text x=\"468\" y=\"244\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">owns premium streaming<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.58s\">\n<circle cx=\"576\" cy=\"356\" r=\"9\" style=\"fill:var(--t5)\"/>\n<text x=\"576\" y=\"336\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:11px;font-weight:700\">The Trade Desk<\/text>\n<text x=\"576\" y=\"378\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">enterprise &#183; ~20% take<\/text>\n<text x=\"576\" y=\"390\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">rents open-internet supply<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.67s\">\n<circle cx=\"270\" cy=\"356\" r=\"8.5\" style=\"fill:var(--t5)\"/>\n<text x=\"270\" y=\"338\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:11px;font-weight:700\">MNTN<\/text>\n<text x=\"270\" y=\"378\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">performance dCPM &#183; ~96% SMB<\/text>\n<text x=\"270\" y=\"390\" text-anchor=\"middle\" style=\"fill:var(--t3);font-size:8px\">public comp: ~2&#215; sales, &#8211;65% vs IPO<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.76s\">\n<circle cx=\"320\" cy=\"304\" r=\"8.5\" style=\"fill:var(--t5)\"/>\n<text x=\"332\" y=\"300\" text-anchor=\"start\" style=\"fill:var(--t5);font-size:11px;font-weight:700\">tvScientific<\/text>\n<text x=\"332\" y=\"313\" text-anchor=\"start\" class=\"t-muted\" style=\"font-size:8.5px\">performance &#183; rents inventory<\/text>\n<text x=\"332\" y=\"324\" text-anchor=\"start\" class=\"t-muted\" style=\"font-size:8px\">Pinterest-owned, Feb 2026<\/text>\n<\/g>\n<text x=\"350\" y=\"498\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px;font-style:italic\">The console is commoditized; what separates the gold dot is the screen and the data it is about to inherit.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> A $50-a-day floor and a same-day launch no longer distinguish anyone &#8212; rivals already cluster at the cheap-onramp corner. Vibe&#8217;s lasting advantage is not its console but the lift Walmart gives it: an owned VIZIO screen and shopper data that raise it up the inventory axis no commoditized dashboard can reach.<\/figcaption>\n<\/figure>\n\n\n### 2.1 The comparison exhibit\n\nFour variables decide this category: **minimum spend** (how low a buyer can start), **inventory access** (whose streaming apps you reach, and through what kind of deal), **targeting & measurement** (how good the audience and outcome data are), and **pricing model** (CPM media-only vs. a performance/managed cut). Exhibit 2.1 is the field's best public reconstruction as of mid-2026. Read the per-row notes: minimums move, and several figures are third-party guides rather than published platform rate cards.\n\n**Exhibit 2.1 — Self-serve CTV platforms compared (mid-2026)**\n\n| Platform | Entry minimum | Inventory model | Targeting / measurement | Pricing model | Reported CPM band | Owner / status |\n| --- | --- | --- | --- | --- | --- | --- |\n| **Vibe.co** | **$50/day (~$500 start)**; only minimum is $50/day [2] | 500+ streaming apps & channels via **100% direct publisher deals** (own network; no open exchange) [2] | First-party CRM, lookalikes, intent, ZIP/DMA geo, retargeting; conversion/attribution built in [2] | **Media-only; no platform/seat fee** — pay only for impressions [2] | **$15–$25** [2] | **Being acquired by Walmart** (announced 6/23/26; close by end FY27) [1] |\n| **Roku Ads Manager** | ~$500 typical start (Roku publishes **no official minimum**) [14] | Roku's owned inventory + The Roku Channel; OneView DSP for extension; Amazon-authenticated reach via 6/2025 deal [12][14] | Roku ACR + first-party account data; shoppable/onsite-action formats | CPM, dynamic | **~$25–$35** (guides; some cite $20–$60) [14] | Roku, Inc. (live) [14] |\n| **MNTN (Performance TV)** | No public hard minimum; positioned for growth brands, not micro-SMB | Programmatic CTV across premium apps (not owned inventory); PubMatic supply deal | ROAS/goal-based optimization, automated; \"performance TV\" framing | **dCPM** — MNTN keeps a % of media as its fee | CPM \"caution below ~$20–$25\" [15] | MNTN, Inc. (publicly traded as of 2026 10-K) [15] |\n| **tvScientific** | **~$5,000/month** [16] | Programmatic CTV, performance-built; broad app access | Outcome/measurement-first, \"as simple as paid search\" | Performance/managed, media + fee | not separately published | tvScientific (live; **acquired by Pinterest** — closed Feb 2026, now \"tvScientific by Pinterest\") [16] |\n| **Amazon DSP (self-serve)** | **No Amazon-imposed minimum** since unBoxed 2025 (practical ~$10–15K/mo to optimize) [17] | Vast: Prime Video, Fire TV, Twitch, IMDb + 3rd-party; **Disney+/Hulu/ESPN** via 6/2025 integration; **Roku** via 6/2025 deal [12][17][18] | Amazon shopper data + ACR/authenticated identity; closed-loop to Amazon purchase | ~1–2% fee on 3rd-party media; ~0% on owned/O&O [19] | varies by supply | Amazon (live; managed service still ~$50K/mo min) [17] |\n| **Hulu / Disney self-serve (Hulu Ad Manager)** | **~$500** [18] | Hulu + some Disney properties (Disney+, ESPN) | Disney first-party + clean-room; limited to Disney supply | CPM | premium (Disney-grade) | Disney (live) [18] |\n| **The Trade Desk (Kokai)** | Enterprise/agency-grade; **not a true SMB self-serve onramp** (no $500 door) | Largest independent open-internet demand across CTV/SSPs; OpenPath direct paths | Best-in-class audience + UID2 identity + Kokai AI; measurement via partners | ~20% of gross spend (effective) [20] | CTV CPMs market-rate | The Trade Desk (live; Ventura OS launched 2025) [20][21] |\n\n*Sources: platform docs and dated trade guides as cited; CPM bands marked are third-party estimates, not published rate cards, except where the platform states \"media-only.\"*\n\n### 2.2 What the exhibit says — and what it hides\n\nThree readings matter.\n\n**First, the \"$500 democratization\" tier is now crowded.** A buyer with a few hundred dollars has at least four real doors: Vibe ($50/day), Roku Ads Manager (~$500), Hulu Ad Manager (~$500), and — since unBoxed 2025 — Amazon DSP self-serve with no Amazon minimum at all [12][14][17][18]. The very feature that made Vibe remarkable in 2022–2024 — *a TV ad for the price of a social ad* — is, by 2026, the **table stakes** of the category, not a moat. MNTN and tvScientific sit deliberately *upmarket* of this tier ($5,000/mo for tvScientific), chasing growth brands and performance marketers rather than the micro-SMB long tail [15][16].\n\n**Second, the inventory model is where Vibe is genuinely distinct — and genuinely constrained.** Vibe runs **100% direct publisher deals across its own network of 500+ apps**, with no open exchange and placement-level reporting [2]. That is a real differentiator on *transparency and supply quality* (the SPO logic, applied at the platform level — see §4), and it is the asset Walmart most wants. But it is also a **ceiling**: Vibe reaches its own network, not the whole open internet. The Trade Desk, by contrast, buys essentially all open-internet CTV supply; Amazon DSP now reaches ~80M households (~80%+ of US CTV homes) through the Roku tie-up alone [12][20]. Vibe trades breadth for control. Walmart's job post-close is to fuse Vibe's controlled supply with VIZIO's owned inventory and Connect Select's curated SSP marketplace (Magnite, PubMatic, FreeWheel, Index — launched April 2026), widening reach without losing the directness [22].\n\n**Third, pricing splits the field in two.** Vibe and Hulu Ad Manager are **media-only/CPM** — the buyer pays for impressions and the platform's economics sit elsewhere (Vibe charges no platform fee at all, which raises the obvious question of where its margin *is* — almost certainly an undisclosed spread inside the CPM on its direct deals, the very thing Walmart will now own) [2]. MNTN and tvScientific are **performance/managed** — they keep an explicit cut (MNTN's \"dCPM\") and sell outcomes, not impressions [15]. The Trade Desk is **enterprise take-rate** (~20% of gross spend) and barely plays the SMB self-serve game at all [20]. **Here is the single most important competitive fact about Vibe's differentiation: its \"no platform fee\" pitch is a customer-acquisition wedge, not a sustainable economic model on its own — it works only if the platform captures margin in the media spread or, post-acquisition, monetizes the data and measurement Walmart brings.**\n\n### 2.3 The critical read on Vibe's differentiation\n\nBe blunt about it. Vibe's defensible differentiators reduce to three, and only one is durable:\n\n- **Speed/UX (\"Meta for TV\"):** real, loved by users, but *replicable*. Roku, Amazon, and Hulu all ship same-session self-serve flows now. Not a moat.\n- **Direct-deal supply + placement transparency:** genuinely better than open-exchange buying, and a real reason performance marketers chose Vibe — but bounded by Vibe's own network reach, and matchable by any platform willing to do direct deals.\n- **The thing Vibe did *not* have, and Walmart does:** first-party purchase data on ~280M weekly shoppers and **closed-loop measurement** to in-store and online sales [1][3]. *This* is the durable edge — and precisely why the asset is worth far more to Walmart than to a standalone Vibe. The acquisition logic is not \"Vibe's tech is unbeatable\"; it is \"Vibe's onramp + Walmart's data > either alone.\"\n\nThe honest competitive verdict: **Vibe's product is good but not uniquely defensible; the deal's value lives in the data layer Walmart bolts on, not in Vibe's standalone moat.** A skeptic should weigh $1.4B for a ~$100M run-rate company (a ~14× revenue multiple) against the fact that the buying-tool layer is the most commoditized part of the stack [23].\n\n---\n\n## 3. Field B: The Retail Media Network Landscape\n\n### 3.1 The concentration exhibit\n\nRetail media is the fastest-growing major ad category, and one of the most concentrated. eMarketer's H2 2025 forecast puts US retail-media ad spend on a path toward ~$71B in 2026, with Amazon and Walmart capturing ~89% of *incremental* dollars that year — a near-duopoly at the top [11][24].\n\n**Exhibit 3.1 — US retail media networks compared (2025, latest reported)**\n\n| Network | US ad revenue (latest) | US RMN share (2025, eMarketer) | First-party data scale | Off-site / CTV reach | Going-concern note (dated) |\n| --- | --- | --- | --- | --- | --- |\n| **Amazon Ads** | **~$56B (2025, global ad services est.)** [10] | **~79.7%** [10] | ~200M+ Prime members; full purchase + browsing graph | Deepest: Prime Video, Fire TV, Twitch, IMDb O&O + DSP + **Roku (80M HH, 6/2025)** + **Disney/Hulu/ESPN (6/2025)** [12][18] | Dominant & fortifying; dropped DSP self-serve minimum unBoxed 2025 [17] |\n| **Walmart Connect** | **~$6.4B (FY2026 global advertising, +46% YoY)**; Connect US grew ~41% in Q4 FY26 [3][4] | **~8.0%** [10] | ~280M weekly shoppers; 10,900+ stores, 19 countries; in-store + online basket data [1] | Building fast: **VIZIO SmartCast** O&O CTV + **Connect Select** curated DSP marketplace (4/2026) + Yahoo DSP (5/2026) + DV360/YouTube (6/2026) + **Vibe self-serve (pending)** [1][22][25] |\n| **Target (Roundel)** | ~$163M Q1 2025 (+25.4% YoY); ~$1.5B+ annual scale | **~1.5%** [10] | Target Circle loyalty + purchase data | Off-site via Roundel Media Studio; **Precision Plus** AI offsite tool (2025) across Google/Meta/Pinterest [26][27] | Live; offsite-focused expansion [27] |\n| **Instacart (Carrot Ads)** | **>$1B TTM ad revenue (Q3 2025); ~$1.45B projected 2025** [28] | (in remaining ~10%) | Grocery basket + intent across 240+ retail partners | **Carrot Ads** white-label + off-platform (YouTube, TikTok, Pinterest, **The Trade Desk**) [28] | Live; aggressively omnichannel [28] |\n| **Kroger Precision Marketing (84.51°)** | Part of Kroger's ~$1.5B FY2025 \"alternative profit\" operating profit | (in remaining ~10%) | 84.51° science on ~60M households' loyalty data | Off-site programmatic incl. **CTV** (Roku, Paramount, Samsung); managed-service expansion; **Google/YouTube** partnership (2025) [29][30] | Live; CTV ambitions explicit [29][30] |\n| **Costco** | Newer/smaller RMN; building out | (sub-1%) | Membership purchase data (high-value, lower-frequency) | Early-stage off-site; partners with third parties | Live but nascent; not a near-term CTV factor |\n\n*Shares are eMarketer 2025 US retail-media estimates [10]. Revenue figures mix global (Amazon, Walmart) and US/segment reporting — read each cell's basis. Amazon's ~$56B is an estimate of total ad services, not strictly \"retail media.\"*\n\n### 3.2 What the concentration map means for the deal\n\n**Amazon is ~9× Walmart, and the gap is structural — no single acquisition closes it.** Amazon's ~$56B ad business dwarfs Walmart Connect's ~$6.4B, and Amazon holds ~80% of US retail-media share to Walmart's ~8% [10]. No $1.4B deal changes that ratio. So the deal's strategic purpose is **not** \"catch Amazon\" — it is \"defend and extend the #2 position by owning a funnel layer Amazon is also building.\" Amazon dropped its DSP self-serve minimum and locked up Roku's authenticated reach in 2025; Walmart's Vibe buy is the symmetric counter-move on the SMB-CTV front [12][17].\n\n**The off-site/CTV race is the real contest.** On-site retail media (sponsored products) is mature and Amazon-dominated. Growth and differentiation now live off-site, where eMarketer projects **42.1% growth in 2025** vs. 15.3% on-site [27]. CTV is the marquee off-site surface, and the one where Walmart's VIZIO ownership buys it something Target, Kroger, and Instacart lack: **an owned operating system and ACR data**, not just a data-licensing relationship. Kroger and Target reach CTV by *renting* it (Roku, Paramount, Samsung, DV360); Walmart increasingly *owns* its screen [29].\n\n**Walmart's edge over the rest of Field B — not Amazon — is the full stack.** Target's Roundel, Kroger's 84.51°, and Instacart's Carrot Ads are formidable data businesses, but they are data-and-demand layers that must plug into someone else's screens and someone else's buying tools. Walmart now holds data (Connect) + screen/OS (VIZIO) + supply marketplace (Connect Select) + self-serve front-end (Vibe). That vertical integration is the differentiator within Field B — and the source of the margin-capture thesis in §4.\n\n---\n\n## 4. The Value Chain: Where the Margin Sits, and How Walmart Captures More of It\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 470\" role=\"img\" aria-label=\"Two stacked horizontal value-chains comparing where a dollar of ad spend goes. In the open programmatic chain, a brand's dollar passes through an agency and DSP, then an SSP or exchange, before reaching the publisher; transaction fees skim about twenty-four percent (shown in red), leaving roughly seventy-six cents for the publisher (shown in green). In Walmart's collapsed chain on VIZIO-owned inventory, the brand's dollar flows through Walmart's combined data, DSP, and Connect Select layer straight to the Walmart-owned VIZIO screen, where Walmart is itself the publisher; the seventy-six cents that would have leaked to a third-party publisher stays in-house, captured in gold and blue. A footnote notes the play only works on the owned slice; elsewhere Walmart remains a toll-paying buyer.\">\n<defs>\n<marker id=\"wvs-arrow\" viewBox=\"0 0 12 12\" refX=\"8\" refY=\"6\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M1 1 L10 6 L1 11 Z\" class=\"f-t5\"/><\/marker>\n<\/defs>\n<text x=\"350\" y=\"32\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:19px;font-weight:700\">Who Keeps the Spread<\/text>\n<text x=\"350\" y=\"54\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:12px\">In the open chain every hop skims margin; owning the OS, the data, and the front door lets one retailer keep it<\/text>\n<text x=\"36\" y=\"86\" class=\"t-muted\" style=\"font-size:10px;font-weight:700;letter-spacing:.06em\">THE OPEN PROGRAMMATIC CHAIN<\/text>\n<text x=\"36\" y=\"100\" class=\"t-muted\" style=\"font-size:9px\">ANA Programmatic Transparency Benchmark 2025 &#183; a buyer&#8217;s dollar through third-party supply<\/text>\n<g class=\"cv-rise\" style=\"--d:.05s\">\n<rect x=\"36\" y=\"112\" width=\"118\" height=\"58\" rx=\"4\" class=\"f-panel s-t5\" stroke-width=\"1.5\"/>\n<text x=\"95\" y=\"136\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:11.5px;font-weight:700\">BRAND<\/text>\n<text x=\"95\" y=\"152\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:13px;font-weight:700\">$1.00<\/text>\n<text x=\"95\" y=\"164\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">spend enters<\/text>\n<\/g>\n<line x1=\"156\" y1=\"141\" x2=\"188\" y2=\"141\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvs-arrow)\"/>\n<g class=\"cv-rise\" style=\"--d:.16s\">\n<rect x=\"190\" y=\"112\" width=\"118\" height=\"58\" rx=\"4\" class=\"f-panel s-t3\" stroke-width=\"1.5\"/>\n<text x=\"249\" y=\"132\" text-anchor=\"middle\" style=\"fill:var(--t3);font-size:11px;font-weight:700\">AGENCY / DSP<\/text>\ x=\"111\" y=\"198\" text-anchor=\"middle\" style=\"font-size:9.5px;font-weight:700;fill:var(--bg)\">~24&#162; leaks to fees<\/text>\n<text x=\"425\" y=\"198\" text-anchor=\"middle\" style=\"font-size:9.5px;font-weight:700;fill:var(--bg)\">~76&#162; reaches the publisher<\/text>\n<text x=\"36\" y=\"232\" class=\"t-muted\" style=\"font-size:8.5px\">Ref: CTV median TrueCPM $23.92 vs $7.48 web/mobile &#183; The Trade Desk effective take ~20% of gross &#183; Amazon DSP ~1&#8211;2% on 3P media, ~0% on owned supply<\/text>\n<line x1=\"36\" y1=\"250\" x2=\"664\" y2=\"250\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 5\"/>\n<text x=\"36\" y=\"276\" class=\"t-acc\" style=\"font-size:10px;font-weight:700;letter-spacing:.06em\">WALMART&#8217;S COLLAPSED CHAIN &#8212; ON VIZIO-OWNED INVENTORY<\/text>\n<text x=\"36\" y=\"290\" class=\"t-muted\" style=\"font-size:9px\">Walmart is the data, the DSP, and the publisher &#183; the spread that would leak stays in-house<\/text>\n<g class=\"cv-rise\" style=\"--d:.55s\">\n<rect x=\"36\" y=\"302\" width=\"118\" height=\"58\" rx=\"4\" class=\"f-panel s-t5\" stroke-width=\"1.5\"/>\n<text x=\"95\" y=\"326\" text-anchor=\"middle\" style=\"fill:var(--t5);font-size:11.5px;font-weight:700\">BRAND<\/text>\n<text x=\"95\" y=\"342\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:13px;font-weight:700\">$1.00<\/text>\n<text x=\"95\" y=\"354\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">spend enters<\/text>\n<\/g>\n<line x1=\"156\" y1=\"331\" x2=\"188\" y2=\"331\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvs-arrow)\"/>\n<g class=\"cv-rise\" style=\"--d:.66s\">\n<rect x=\"190\" y=\"302\" width=\"200\" height=\"58\" rx=\"4\" class=\"f-panel s-t1\" stroke-width=\"1.5\"/>\n<rect x=\"190\" y=\"302\" width=\"200\" height=\"14\" rx=\"4\" style=\"fill:var(--t1)\"/>\n<text x=\"290\" y=\"312\" text-anchor=\"middle\" style=\"font-size:8px;font-weight:700;fill:var(--bg)\">ONE OWNER &#183; NO TOLL<\/text>\n<text x=\"290\" y=\"334\" text-anchor=\"middle\" style=\"fill:var(--t1);font-size:11px;font-weight:700\">WALMART STACK<\/text>\n<text x=\"290\" y=\"350\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">data + DSP + Connect Select<\/text>\n<\/g>\n<line x1=\"392\" y1=\"331\" x2=\"424\" y2=\"331\" class=\"ln\" stroke-width=\"2\" marker-end=\"url(#wvs-arrow)\"/>\n<g class=\"cv-rise\" style=\"--d:.77s\">\n<rect x=\"426\" y=\"302\" width=\"238\" height=\"58\" rx=\"4\" class=\"f-panel\" stroke-width=\"2\" style=\"stroke:var(--accent)\"/>\n<rect x=\"426\" y=\"302\" width=\"238\" height=\"14\" rx=\"4\" style=\"fill:var(--accent)\"/>\n<text x=\"545\" y=\"312\" text-anchor=\"middle\" style=\"font-size:8px;font-weight:700;fill:var(--bg)\">WALMART IS THE PUBLISHER<\/text>\n<text x=\"545\" y=\"334\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:11.5px;font-weight:700\">VIZIO-OWNED SCREEN<\/text>\n<text x=\"545\" y=\"350\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:8.5px\">the ~76&#162; stays in-house<\/text>\n<\/g>\n<rect x=\"36\" y=\"374\" width=\"628\" height=\"20\" rx=\"3\" fill=\"none\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"36\" y=\"374\" width=\"628\" height=\"20\" rx=\"3\" class=\"cv-grow-right\" style=\"--d:.9s;fill:var(--accent);opacity:.9\"/>\n<text x=\"350\" y=\"388\" text-anchor=\"middle\" style=\"font-size:9.5px;font-weight:700;fill:var(--bg)\">~100&#162; of the dollar stays inside Walmart &#8212; the spread is captured, not leaked<\/text>\n<text x=\"350\" y=\"420\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px;font-style:italic\">&#8226; The capture holds only on the VIZIO-owned slice; off it, Walmart is still a toll-paying buyer like everyone else.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> In the open programmatic chain each hop skims its cut, so barely three-quarters of a brand&#8217;s dollar ever reaches the publisher; by owning the OS, the data, and the front door, Walmart collapses the chain and keeps the spread &#8212; but only on its own VIZIO inventory, where it is the publisher. Everywhere else it remains a buyer paying the same tolls.<\/figcaption>\n<\/figure>\n\n\n### 4.1 The open-programmatic CTV value chain\n\nTrace a single dollar of CTV ad spend through the standard open-programmatic path, and the answer to \"who keeps the spread\" falls out.\n\n**Exhibit 4.1 — The CTV value chain and where margin leaks**\n\n```\nBRAND/ADVERTISER  →  AGENCY  →  DSP  →  AD EXCHANGE/SSP  →  PUBLISHER/INVENTORY OWNER\n   (the budget)     (~service   (~10–20%   (~10–15% take    (receives what's left:\n                     fee)       take rate)  + data/curation)  often <40–60% of dollar)\n```\n\nEvery hop is a place margin sits. The ANA Programmatic Transparency Benchmark — the only impression-level, log-data-grounded public dataset — found transaction costs (DSP fee + DSP data + SSP fee) consumed **~23.8–26.1% of programmatic spend in 2025**, with the **publisher/seller receiving ~76%** in Q3 2025 (up from ~75%), and CTV's median TrueCPM running **$23.92** vs. **$7.48** for web/mobile [8][31]. Two transparent anchors frame the range: **The Trade Desk's effective take is ~20% of gross spend** ($2.4B revenue on ~$12B spend, 2024); **Amazon DSP's is ~1–2% on third-party media and near-0% on its owned supply** — because Amazon captures its margin *upstream* as publisher and retailer, running the DSP at near-cost [19][20][31].\n\n### 4.2 Supply-path optimization and disintermediation — decoded\n\n**Supply-path optimization (SPO)** means choosing the *shortest, cleanest route* from advertiser to publisher — cutting redundant intermediaries that each skim a cut, shrinking the number of hops a bid travels. **Disintermediation** is the stronger version: removing a middle layer entirely (e.g., a DSP buying direct from a publisher, bypassing the SSP). Both shrink the spread intermediaries keep and either return it to the publisher or capture it for whoever runs the optimized path. DSPs were found to bid roughly **2× more into direct paths than into resold ones** — a ~50% monetization gap that rewards directness [9].\n\n### 4.3 How Walmart's three-layer stack captures the chain\n\nNow the thesis. Walmart's acquisitions assemble the three scarce layers that let it *collapse* the open-programmatic chain for its own inventory and data:\n\n1. **Own the OS and the screen (VIZIO SmartCast).** When the impression runs on a VIZIO TV, Walmart is the publisher/inventory owner *and* the OS. It pays no publisher; it *is* the publisher. The ~60–76% of the dollar that normally leaks to a third-party publisher stays in-house. VIZIO's Inscape ACR data (24M+ opted-in TVs, ~79M viewers) makes the inventory addressable and measurable without buying third-party data [6][7].\n\n2. **Own the data (Walmart Connect).** Walmart supplies the audience (who to target, based on real purchases) *and* the measurement (did the ad drive a sale). In the open chain, audience data is a DSP data fee (rising to ~2.7–3.6% of spend in 2025) and measurement is a separate vendor [31]. Walmart provides both from its own first-party graph — capturing the data-fee margin and the closed-loop measurement value competitors must rent.\n\n3. **Own the front-end (Vibe).** In the open chain, the self-serve buying tool is the DSP's ~10–20% take rate. By owning Vibe, Walmart owns the buying interface for the long tail — and the spread inside it (recall that Vibe's \"no platform fee\" model implies the margin sits in the media spread on its direct deals) [2]. Vibe's **100% direct publisher deals** are themselves an SPO move at the platform level: no open exchange, no reseller hops [2].\n\n**The net:** for a campaign that buys VIZIO inventory, targets with Walmart data, measures by Walmart, and buys through Vibe, Walmart can collapse brand → DSP → SSP → publisher into something close to **brand → Walmart-stack → Walmart-owned screen**. That is the disintermediation play. It is also why the deal reads best as Walmart buying the *one missing layer* — the long-tail front-end — to complete a chain it had been assembling since the VIZIO deal and the Connect Select / Magnite / Yahoo / DV360 partnerships of 2026 [22][25].\n\n### 4.4 The honest limits of the capture thesis\n\nThree caveats keep this from being a clean win:\n\n- **Walmart still rents most of the screen.** VIZIO is ~19M+ accounts — meaningful, but a *minority* of US CTV households (Amazon/Roku reach ~80M). For the vast majority of CTV impressions, Walmart remains a *buyer* paying DSP/SSP/publisher tolls — which is exactly why it kept the Magnite, Yahoo DSP, and DV360 partnerships and built Connect Select [1][22][25]. The full-stack margin capture applies only to the VIZIO-owned slice; everywhere else, Walmart is one more advertiser in the open chain.\n- **Vibe's reach ceiling.** Vibe's direct-deal network (500+ apps) is narrower than the open internet; pushing Walmart's full demand through it would throttle reach unless fused with the broader Connect Select supply.\n- **The take-rate it captures is the take-rate regulators and clients scrutinize.** Owning every layer invites the conflict-of-interest critique Amazon already faces (retailer + publisher + ad platform + measurement, all in one house) and the antitrust attention a ~$700B retailer holding VIZIO ACR data attracts — taken up later, in the chapter on risks and the bear case.\n\n---\n\n## 5. Synthesis: Who Keeps the Spread, and What the Deal Changes\n\nThe competitive map yields a clear strategic read.\n\n**In Field A**, the self-serve CTV onramp is a *commoditizing* layer. Low minimums, fast launch, and self-serve UIs are table stakes now, shared by Vibe, Roku, Hulu, and Amazon. Vibe's real asset is its direct-deal supply network and its performance-marketer brand — but neither holds against incumbents with deeper pockets and bigger reach. The margin is migrating to whoever pairs the onramp with proprietary data and closed-loop measurement. Standalone, Vibe was a strong but vulnerable challenger. Inside Walmart, it becomes the distribution arm for an unmatched data asset.\n\n**In Field B**, the structure is a fortified duopoly. Amazon (~80% share, ~$56B) is uncatchable on scale; Walmart (~8%, ~$6.4B) is the clear and growing #2; Target, Instacart, and Kroger fight for the remaining ~10% without an owned screen. Walmart's differentiator *within Field B* is its vertical stack — data + OS + supply + (now) self-serve front-end — which no other non-Amazon RMN possesses.\n\n**On the margin question** — who keeps the spread — the answer the deal is engineered to change is: *Walmart, on its own inventory and data.* By owning the OS (VIZIO), the data (Connect), and the front-end (Vibe), Walmart can capture publisher-side, data-side, and buy-side margin the open-programmatic chain leaks to a dozen intermediaries — but **only on the VIZIO-owned, Walmart-data slice**. Everywhere else, Walmart stays a toll-paying buyer in a chain Amazon and The Trade Desk dominate. The deal is a smart, defensive, funnel-widening move that hardens the #2 position and plants Walmart firmly in the SMB-CTV land Amazon is also racing to own. It is not, on this evidence, a path to dethroning Amazon. Any reading that frames it that way mistakes a new front door for a new house.\n\n---\n\n## Open Questions\n\n1. **What is Vibe's actual take/margin?** \"No platform fee\" implies an undisclosed spread inside the CPM on its direct deals. The economics of the captured margin — and whether Walmart preserves, raises, or zeroes it — are not public. This is load-bearing for the margin-capture thesis and currently inferred.\n2. **How much of Walmart's demand will route through Vibe vs. Connect Select / third-party DSPs?** The reach-vs-control tradeoff (§2.2, §4.4) will determine whether Vibe becomes the dominant Walmart onramp or a niche SMB tool beside the curated DSP marketplace.\n3. **What share of Walmart CTV impressions are VIZIO-owned vs. rented?** The full-stack margin capture applies only to owned inventory; the owned-vs-rented split is the single biggest determinant of how much spread Walmart actually keeps, and it is not disclosed.\n4. **Does Amazon's ~1–2% DSP fee + Roku/Disney reach set a price floor Walmart can't match on rented inventory?** If Amazon runs its DSP at near-cost on far larger reach, Walmart's self-serve economics outside VIZIO may be squeezed.\n5. **Will regulators treat the full-stack (retailer + OS + ACR + DSP + measurement) as an antitrust/privacy concern?** The HSR review of the Vibe deal and any scrutiny of VIZIO ACR data are unresolved (taken up later, in the chapter on risks and the bear case).\n6. **Where do MNTN and tvScientific land?** Both sit upmarket of the $500 tier; whether the Walmart-Vibe combination squeezes them, or leaves the performance/managed mid-market to them, is open.\n\n---\n\n## Sources\n\n1. Walmart, \"Walmart to Acquire Vibe.co to Expand Access to Connected TV Advertising,\" corporate.walmart.com, 2026-06-23. https://corporate.walmart.com/news/2026/06/23/walmart-to-acquire-vibe-co-to-expand-access-to-connected-tv-advertising — Tier 1 (primary, company PR; treat claims as Walmart's own). Deal price (reported $1.4B), structure, close by end FY27, HSR, executive quotes (Ryan Mayward, Arthur Querou), Vibe 10,000+ advertisers, Walmart 280M weekly customers / 10,900+ stores / 19 countries / FY26 $713B revenue, VIZIO + Magnite/Yahoo DSP/DV360 partnerships retained. Accessed 2026-06-26.\n2. Vibe.co pricing & product docs and dated 2026 platform guides (vibe.co/pricing; vibe.co blog), via web search 2026-06-26. — Tier 5 (platform self-description). $50/day (~$500 start) only minimum; no platform/subscription/seat fee; $15–$25 CPM; 500+ direct-deal apps; placement-level reporting; first-party CRM/lookalike/geo targeting. Accessed 2026-06-26.\n3. Walmart FY2026 Q4 earnings / Form 8-K (SEC EDGAR) and trade coverage, 2026. — Tier 1/4. Walmart global advertising ~$6.4B FY26 (+46% YoY); Walmart Connect US +41% in Q4 FY26; ad+membership ~1/3 of operating income. Accessed 2026-06-26.\n4. \"Walmart's Advertising Business Reaches $6.4 Billion,\" ALM Corp / Marketplace Pulse / GroceryDoppio summaries of FY26 results, 2026. — Tier 5. Corroborates $6.4B / +46% and 6× sales-growth multiple. Accessed 2026-06-26.\n5. Walmart, \"Walmart Completes Acquisition of VIZIO,\" corporate.walmart.com, 2024-12-03; TechCrunch/Variety/Deadline coverage. — Tier 1/4. $2.3B close ($11.50/share), SmartCast OS, ~19M+ active accounts (~400% growth since 2018), ACR data rationale. Accessed 2026-06-26.\n6. AdExchanger, \"Vizio Reorgs Around Its Data Biz With The Full Integration Of Inscape\"; Inscape/VIZIO Platform+ pages. — Tier 5/1. Inscape ACR integrated with VIZIO Ads + SmartCast. Accessed 2026-06-26.\n7. StreamTV Insider / Inscape, \"Currency-grade data from 24M+ opted-in TVs / ~79M viewers\"; Digiday \"WTF is ACR.\" — Tier 5. VIZIO/Inscape ACR scale (also \"18M+ ACR-enabled TVs\" historical figure). Accessed 2026-06-26.\n8. ANA Programmatic Transparency Benchmark (2025 quarterly editions), via Fiducia/ANA. — Tier 2/5 (self-published, interested party; best available impression-level data). Transaction costs ~23.8–26.1% of programmatic spend 2025; seller share ~76% Q3 2025; CTV median TrueCPM $23.92 vs $7.48 web/mobile. Accessed 2026-06-26.\n9. HUMAN Security / monetizemore / aidigital SPO analyses, 2025. — Tier 5. Each open-chain hop ~10–15%; publisher often <40% of bid; DSPs bid ~2× into direct vs resold paths (~50% monetization gap). Accessed 2026-06-26.\n10. eMarketer, \"Retail Media Ad Spending Forecast and Trends H2 2025\" and 2026 RMN FAQ. — Tier 5 (specialist forecaster; estimates). Amazon ~79.7% US retail-media share 2025; Walmart ~8.0%; Target ~1.5%; Amazon Ads ~$56B 2025 (est.). Accessed 2026-06-26.\n11. eMarketer via SCBA report PDF and Fugo/crispidea summaries. — Tier 5. US retail media ~$71B (2026 path); Amazon+Walmart ~89% of incremental 2026 dollars. Accessed 2026-06-26.\n12. Amazon Ads / Roku & BusinessWire, \"Amazon Ads and Roku Announce Partnership Creating the Largest Authenticated CTV Footprint,\" 2025-06-16. — Tier 1/3. ~80M US CTV households / ~80%+ of US CTV homes (Comscore); shared ad ID; full availability Q4 2025; +40% unique reach in tests. Accessed 2026-06-26.\n13. BroadbandTVNews / ppc.land coverage of Amazon–Roku deal, 2025-06. — Tier 4/5. Corroborates footprint and authenticated-identity claims. Accessed 2026-06-26.\n14. Roku Ads Manager docs + improvado/MNTN/muvi 2026 guides. — Tier 5/1. Roku publishes no official minimum (~$500 typical start); CPM ~$25–$35 (some guides $20–$60); CPM dynamic. Accessed 2026-06-26.\n15. MNTN docs + MNTN 10-K (stocktitan) + eMarketer PubMatic-MNTN coverage. — Tier 1/5. Self-serve \"few clicks,\" dCPM model (MNTN keeps % of media), CPM caution below ~$20–25; publicly traded (56.8M Class A / 17.1M Class B shares, 2/2026). Accessed 2026-06-26.\n16. tvScientific docs + Vibe comparison blogs, 2025–2026; Pinterest Newsroom (Dec 11, 2025 / Apr 27, 2026) on the tvScientific acquisition. — Tier 5 (Vibe-authored comparisons are competitor-sourced; read with lean) + Tier 1 (Pinterest primary for the acquisition). ~$5,000/mo typical minimum; performance-built; \"as simple as paid search.\" Pinterest *acquired* tvScientific — announced Dec 11, 2025, closed Feb 2026, terms undisclosed, now branded \"tvScientific by Pinterest\"; resolved to an acquisition, **not** a partnership (full sourcing in the chapter on comparable deals). Accessed 2026-06-26.\n17. marketplaceadpros / amzdudes Amazon DSP 2026 guides; unBoxed 2025 coverage. — Tier 5. No Amazon-imposed self-serve DSP minimum since unBoxed 2025 (practical ~$10–15K/mo); managed service ~$50K/mo; ~1–2% 3rd-party fee / ~0% O&O. Accessed 2026-06-26.\n18. Amazon Ads / Disney Advertising, \"Disney Advertising and Amazon Ads announce strategic integration,\" 2025-06; Deadline coverage; Hulu Ad Manager
