an inflection point: How to win with a full-stack approach\" (and related RGM/trade-promotion insights), 2025. RMN spend \"not fully incremental\" for most CPG advertisers — drawn from existing pools; little visibility between sales teams (trade terms) and marketing teams (RMN spend); leading firms integrating RMN + promotions budgets. Tier 5 (consultancy). https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights/commerce-media-at-an-inflection-point-how-to-win-with-a-full-stack-approach — accessed 2026-06-26 (direct fetch timed out; thesis corroborated via McKinsey RGM/trade-promotion companion pieces and search excerpts). *(Single-source-ish on the specific phrasing; corroborated in substance by ANA [1] and IAB [3].)*\n13. Public Label Agency (McAlenney, M.), \"Retail Media: The New Tax on CPG Brands?,\" 2025-02-20 (citing Forbes / CustomerThink). \"If all you're doing is shifting trade dollars into digital ads, you're just funding retailer margin, not brand growth\"; RMN as \"$80B tollbooth\"/\"tax\"; brands must tie RMN to total commerce results, not merely shift trade dollars. Tier 6 (agency opinion — evidence of the \"tax on suppliers\" position in its own voice; not a fact source). https://blog.publiclabelagency.com/public-label/retail-media-the-new-tax-on-cpg-brands — accessed 2026-06-26.\n14. Digiday, \"Retail media's mid-2025 reality: Why advertisers are going all in on full-funnel,\" 2025. Counter-framing: \"shifted vs. incremental\" binary dissolving as brands unify brand/performance budgets; \"not seeing dollars being pulled out of existing brand-building campaigns just yet\"; some brands raising total budgets to add retail media. Tier 5 (trade). https://digiday.com/marketing/retail-medias-mid-2025-reality-why-advertisers-are-going-all-in-on-full-funnel/ — accessed 2026-06-26.\n15. Digiday, \"ROAS vs. incrementality: Scrutiny around ad spend grows in booming retail media space,\" 2025-01-27. Matt Voda (OptiMine): \"would that sale have happened regardless of the ad?\"; Ashley Karim-Kincey (Dagger): retailers \"always take 100% attribution for sales\"; Jeffrey Bustos (Merkle): \"retailers are grading their own homework\"; retail media ~25% of total media ad spend by 2028; 200+ RMNs. Tier 5 (trade, named practitioner voices). https://digiday.com/marketing/roas-vs-incrementality-scrutiny-around-ad-spend-grows-in-booming-retail-media-space/ — accessed 2026-06-26.\n16. Dataslayer / Winning With Walmart / ANA, \"Incrementality becomes the primary KPI for retail media,\" 2024–2025. 71% of advertisers consider incrementality the most important retail-media KPI (ANA, Jan 2024); incremental ROAS commonly runs ~30–60% below last-click ROAS (a 6x dashboard ≈ 2.4x true lift). Tier 5/6 (vendor/practitioner benchmark — the 30–60% range is a circulating industry estimate, NOT an audited constant; flagged as the skeptics' claimed magnitude). https://www.dataslayer.ai/blog/incrementality-becomes-the-primary-kpi-for-retail-media-advertisers ; https://winningwithwalmart.com/how-incrementality-measurement-changes-what-your-walmart-investment-is-actually-worth/ — accessed 2026-06-26.\n17. eMarketer / Skai / Mars United / Circana, retail-media 2026 outlook and consolidation coverage. Amazon+Walmart ~89% of incremental U.S. retail-media dollars (2026); 200+ RMNs consolidating toward \"~10 that matter\"; sub-scale retailers must partner/license/retreat; brands work with ~6 RMNs (projected 11 by 2026). Tier 5 (research/trade). https://skai.io/blog/retail-media-in-2026-predictions-from-industry-leaders/ ; https://www.marsunited.com/assessing-the-retail-media-landscape-for-2026/ ; https://www.circana.com/insights-hub/retail-media-strategy-trends-insights-and-whats-next — accessed 2026-06-26.\n18. FoodNavigator-USA, \"Is the retail media network gold rush over?,\" 2026-05-04 (Greg Dolan, Keen Decision Systems). \"Wild West... to 200 RMNs... to consolidation\"; 26.1% of retail marketers pulling spend from RMNs to fund other channels (21.7% from TV, 17.4% from digital audio); \"for smaller or specialized RMNs, survival will hinge on relevance and measurable outcomes\"; maturation-not-collapse framing. Tier 5 (trade). https://www.foodnavigator-usa.com/Article/2026/05/04/is-the-retail-media-network-gold-rush-over/ — accessed 2026-06-26.\n19. AdExchanger, \"Walmart Buys Vibe.co To Woo SMBs To Streaming,\" 2026-06. \"Lots of CTV vendors competing for SMB clients these days, including MNTN, streamr.ai, Universal Ads, Vibe.co and Roku\" — crowded self-serve CTV field. Tier 5 (specialist ad-tech trade). https://www.adexchanger.com/tv/walmart-buys-vibe-co-to-woo-smbs-to-streaming/ — accessed 2026-06-26.\n20. AdExchanger, \"CTV, Retail And Measurement Will Spur Ad Tech M&A This Year,\" 2026. \"Intense competition for connected TV ad dollars is causing a cascade of consolidation\"; ad-tech M&A centering on retail media, CTV, and measurement gaps. Tier 5 (trade). https://www.adexchanger.com/online-advertising/ctv-retail-and-measurement-will-spur-ad-tech-ma-this-year/ — accessed 2026-06-26.\n21. Pinterest, Inc., Form 8-K / press release, \"Pinterest Closes tvScientific Acquisition, Raises Q1 2026 Outlook,\" 2026-02-17 (via Globe and Mail / SEC EDGAR). tvScientific acquisition closed 2026-02-17; integrated into Pinterest reporting; Q1 2026 revenue guidance $958–978M reflecting partial-quarter tvScientific contribution. Tier 1 (company filing — for what Pinterest reports). https://www.sec.gov/Archives/edgar/data/0001506293/000119312526086731/d22903dex991.htm ; https://www.theglobeandmail.com/investing/markets/stocks/PINS/pressreleases/302248/pinterest-closes-tvscientific-acquisition-raises-q1-2026-outlook/ — accessed 2026-06-26.\n22. StockAnalysis.com, \"MNTN, Inc. (MNTN) Market Cap & Statistics,\" mid-June 2026 (via corpus doc 07). MNTN ~2x sales, down ~65% from May 2025 IPO — the only public pure-play self-serve CTV comp. Tier 1/3 (market data). https://stockanalysis.com/stocks/mntn/statistics/ — accessed 2026-06-26.\n\n---\n\n*This is the bear case on the retail-media category, distinct from the bear case on the deal. The strongest skeptic evidence is the buy side's own admission against interest — the ANA's ~10%-incremental finding and Bain's 6%-trust figure — credible precisely because it comes from the advertisers being asked to pay. Every retailer-side counter-argument is given its due; the net verdict is that the secular tailwind is real but softer, more concentrated, and more measurement-contingent than the bull case assumes, and that Walmart sits on the right side of the consolidation it describes.*"}, {"order": 11, "file": "Future_Trajectory.md", "title": "Walmart's Acquisition of Vibe.co: Future Trajectory", "summary": "", "body": "# Walmart's Acquisition of Vibe.co: Future Trajectory\n\n## Bottom Line\n\nThe single most likely path, at 38–46%, is the boring one. The deal clears its only disclosed condition (HSR review) around January 2027, Vibe's self-serve buying tool is absorbed into Walmart Connect as the SMB and marketplace-seller onramp, the standalone \"Vibe\" brand fades over the four-year founder-retention window, and Walmart Connect compounds off a high base toward the low-to-mid-teens of billions by 2029 — narrowing the Amazon gap on rate (roughly 15x toward 11x and then single digits) without ever flipping it, because closing a ~9–10x ratio off a decelerating base is near-arithmetically excluded. Three drivers dominate: the deal's low close friction (a friendly, cash, sub-$2B HSR-only tuck-in with no horizontal overlap); Walmart's data-plus-VIZIO-ACR closed loop applied to a genuinely incremental SMB long tail; and Amazon's entrenched scale and capex firepower as a hard ceiling on any overtake. The live disagreement is not whether the deal closes — every line of reasoning concurs it clears at ~88% — but whether the strategic payoff converts. A 24–32% \"Catch-Up Stalls\" branch holds that the closed-loop \"measurement moat\" stays asserted-not-accredited and fails to earn its ~12.6x-run-rate price as channel conflict and SMB churn bite; a capped 10–16% \"Breakout\" requires the corpus's weakest pillar (trusted, accredited measurement) to become its strongest. A 12–18% branch sees Vibe deliberately preserved as a semi-standalone unit, and an 8–14% tail covers a deal that slips, stalls, or breaks — driven not by valuation but by the FTC's standing interest in VIZIO viewing data colliding with a stacked shopper-data-plus-ACR-plus-ad-onramp combination. There is no prediction market on the deal, the brand, Connect's share, or SMB CTV; the only live, related signal is an Amazon-capex ladder (>$200B priced ~0.76), which cuts mildly against fast gap-closure. The forecast therefore rests on reference-class reasoning and decomposition, not on market prices.\n\n## Method\n\nThis forecast fuses three competing points of view into a single weighted distribution rather than a simple average, weighing each scenario by how well it survives scrutiny. A prediction-market sweep run on 2026-06-26 found no market anywhere on the deal, on Vibe, on Walmart Connect, on Walmart-versus-Amazon ad share, or on SMB CTV — the directly relevant market is absent. The only live, related instrument is a Polymarket ladder on Amazon's 2026 capital expenditure (the >$200B strike priced around 0.755). It speaks to Amazon's reinvestment intensity, and so cuts mildly against any thesis of fast gap-closure. With no market to anchor on, the call rests on two engines. Reference classes supply the base rates — for friendly sub-$2B HSR-only US tech tuck-ins, for a #2 trying to overtake an entrenched network-effects #1, for the fate of an acquired self-serve ad \"front door,\" and for the shape of the retail-media and SMB-CTV market. Decomposition multiplies conditional probabilities for close, integration outcome, and gap trajectory. The horizon is the deal's announced close (~end of FY2027, i.e. ~January 2027), extended through 2029 for integration, brand fate, and the Walmart-versus-Amazon gap ratio.\n\nThe reasoning rests on the corpus's grounded priors: the close base rate (all three corpus comparables cleared — Pinterest/tvScientific, Magnite/streamr.ai, and Walmart/VIZIO even after a 2024 FTC second request); the no-overtake base rate (Walmart ~$6.4B and +46% in FY26 against Amazon's ~$56–68.6B and ~75–80% US retail-media share); the acquired-onramp base rate (~60–70% absorb-and-rebrand, ~25–35% semi-standalone, ~5–10% stall); and the measurement-trust and valuation priors (Bain's ~6% of advertisers fully trusting retailer-graded metrics, ANA's ~10% of RMN funding called incremental, and MNTN — the only public self-serve-CTV pure-play — trading ~2x sales against the ~12.6x run-rate Walmart reportedly paid).\n\nThe lines of reasoning diverge, productively, on one axis. The live split is **Stall versus Breakout** within the post-close, no-overtake outcome: does Walmart's closed-loop measurement moat earn its premium? The driver-decomposition and contrarian cases weight the moat *failing* to convert heavily (24–32% / 20–30%), citing the asserted-not-accredited status, the ~6% trust ceiling, the rented-supply conflict with rivals (Paramount Skydance owning Paramount+/Tubi, Fox acquiring Roku), and SMB churn. The base-rate view implicitly disagrees, treating integration as smooth and under-weighting the Stall. The disagreement cannot be resolved cleanly, because the deciding evidence — MRC accreditation of the closed loop, or a published third-party SMB-CTV incrementality study — does not yet exist. Rather than split the difference, this forecast weights by surviving grounding: the bear pillars are concretely sourced, so the Stall carries a wide 24–32% range beside a deliberately capped Breakout. A second, secondary disagreement: whether a Vibe unit persisting past FY28 reflects deliberate strategy or integration friction — told apart only by whether advertiser counts rise or churn.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios — through 2029<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Absorbed Front Door, Gap N…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"371.6\" y=\"8\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"418.9\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">38–46%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Catch-Up Stalls: Moat Unac…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"302.8\" y=\"44\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"350.1\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">24–32%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Standalone Onramp Persists<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"243.9\" y=\"80\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"281.4\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">12–18%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Breakout: The Closed Loop …<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"234.1\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"271.6\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">10–16%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Deal Slips, Stalls, or Bre…<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"152\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"261.7\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">8–14%<\/text><\/svg><\/figure>\n\n\n\n### Scenario 1: Absorbed Front Door, Gap Narrows on Rate Not Level (modal)\n\n**Probability: 38–46%.**\n\n**Description.** This is the path of least resistance, and the modal outcome. The deal clears HSR around January 2027. Vibe's interface and DSP fold into Walmart Connect as the self-serve onramp for SMBs and marketplace sellers; the standalone \"Vibe\" brand fades across the four-year retention window and the founders exit near the cliff. Walmart Connect compounds off a high base — roughly $6.4B and +46% in FY26 — toward the low-to-mid-teens of billions by 2029. The Amazon gap narrows on *rate* (15x to 11x and toward single digits), but Amazon stays more than five times larger in absolute dollars and the clear US #1 (~$56–68.6B, ~75–80% share). The durable edge is not Vibe's commoditized buying UI but Walmart's shopper data plus the VIZIO ACR closed loop, applied to a genuinely incremental SMB long tail with no trade pool to recycle — and even that closed-loop measurement remains asserted, not accredited.\n\n**How this number was derived.** Decomposition, with all three lines of reasoning converging (a geometric mean of odds across the modal estimates lands near 0.44). Start with P(close by ~Jan 2027) ≈ 0.88 — a friendly, definitive, sub-$2B, HSR-only US tech tuck-in with no horizontal overlap, and all three corpus comparables cleared (Pinterest/tvScientific, Magnite/streamr.ai, and Walmart/VIZIO even after a 2024 second request). Multiply by P(absorbed/rebranded into Walmart Connect rather than kept durably standalone | close) ≈ 0.70 — the acqui-hire-with-retention-not-earnout base rate, founders exiting at the four-year / ~$180M cliff, and the VIZIO/OneView fold-in precedent. Multiply by P(Walmart stays clear #2, gap narrows but no overtake | absorbed) ≈ 0.87 — closing a ~9–10x ratio off a decelerating base is near-arithmetically excluded, so a live 15x-to-11x narrows but does not flip. 0.88 × 0.70 × 0.87 ≈ 0.535, trimmed to 38–46% for integration-execution and channel-conflict drag.\n\n**Drivers.** The single HSR-only condition, cash structure, and absence of FY27 guidance impact keep close friction low (VIZIO was second-requested in 2024 yet still closed). The Walmart Connect flywheel — shopper data plus VIZIO ACR feeding closed-loop-measurable ads at roughly 70% margin — compounds. Retention-as-stay rather than earnout means founder exit at the cliff favors absorption, matching the VIZIO/OneView pattern. And Amazon caps any overtake through ~9–10x absolute scale, its Amazon-Roku >80% household reach, and its capex firepower (Polymarket pricing 2026 capex above $200B at ~0.76).\n\n**Conditions.** The deal closes on HSR-only terms with no blocking ACR/shopper-data action; Walmart prioritizes its data and measurement edge over preserving Vibe's standalone identity; and channel conflict over rival-owned supply (Paramount+/Tubi under PSKY, Roku under Fox) stays manageable, in part because Vibe also buys the same rented supply Amazon buys.\n\n**Signals to watch.** HSR clearance or close announcement by ~January 2027; \"Vibe\" rebranded under Walmart Connect self-serve by FY28 with the standalone DSP retired into Walmart's pipes; Walmart Connect quarterly ad growth holding at ~25%+ (high-30s%+ would confirm the high end); founder (Querou/Tetzlaff) departure around the retention window; and eMarketer US retail-media share showing Walmart climbing toward low double digits while Amazon holds ~75%+.\n\n**Time horizon.** Close by ~January 2027; integration, brand fate, and the gap ratio become visible across FY27–FY29.\n\n*What would move mass off this scenario:* an FTC second request on ACR/viewing data (toward the deal-stress tail); a public commitment to keep Vibe standalone past the retention window (toward Standalone); Connect growth decelerating below ~15–20% YoY for two or more quarters (toward Stall); or the Walmart-versus-Amazon ad ratio compressing below ~8x by 2028 (validating faster narrowing and lifting Breakout).\n\n### Scenario 2: Catch-Up Stalls — Moat Unaccredited, Channel Conflict and SMB Churn Bite\n\n**Probability: 24–32%.**\n\n**Description.** The deal closes but the strategic payoff underdelivers — and this is the part of the consensus most likely to be wrong. The closed-loop \"measurement moat\" stays asserted, not accredited, and fails to convert into pricing power at the scale a ~12.6x-run-rate price requires (Bain's ~6% advertiser trust; ANA's ~10% incremental). SMBs are advertising's highest-churn segment. Vibe owns no inventory and rides direct deals with platforms now owned by ad-selling Walmart rivals (Paramount+/Tubi under PSKY, Roku under Fox), so supply tightens or re-prices around the H1-2027 integration windows. Walmart Connect keeps growing but decelerates toward the cut sector CAGR (24.1% to 17.2%); the Amazon gap holds flat or widens on level; and the deal reads as an overpriced strategic option. Vibe may linger as a semi-standalone unit purely on integration friction, and the self-serve SMB-CTV shakeout (MNTN down ~65%, trading ~2x sales) reaches Walmart's slice.\n\n**How this number was derived.** Decomposition plus a comp anchor — and it captures the surviving disagreement between the base-rate view (which under-weighted this) and the driver-decomposition and contrarian cases (which independently elevated it). Treat the three grounded bear pillars (channel-supply repricing, the SMB-churn ceiling, and the measurement-trust ceiling) as each an independent ~40–55% drag conditional on close; then P(≥2 of 3 bite hard enough to cap growth below trend | close ≈ 0.88) ≈ 1 − P(none or one) ≈ 0.30. Comp anchor: MNTN, the only public self-serve-CTV pure-play, trades ~2x sales, down ~65%, against the ~12.6x paid — a ~6x gap that closes only if Walmart's data makes the loop more trusted than a category at ~6% trust. Cross-checked against the sector-deceleration base rate (CAGR 24.1% to 17.2%; a 200-to-~10 RMN shakeout), which independently makes a stall a high-base-rate outcome. Lands at 24–32%.\n\n**Drivers.** The measurement moat is unaccredited — the least-trusted RMN asset, at ~6% full trust (Bain), with the \"grades own homework\" critique attached. RMN dollars are largely reallocated rather than incremental (ANA ~10%; IAB 2023: 52% from digital / 36% from traditional), with the SMB long tail the partial exception. Rented-supply fragility matters because Vibe owns no inventory and its key sources fall to Walmart rivals post-PSKY and Fox-Roku. And SMB is the highest-churn segment, capping net retention, against sector deceleration and a self-serve-CTV shakeout (MNTN −65%, ~2x sales versus 12.6x paid).\n\n**Conditions.** The closed loop remains unaccredited and not independently verified through 2028–29; rival-owned platforms restrict or re-price supply to Vibe after the PSKY and Fox-Roku closings; and marketplace-seller demand does not scale fast enough to offset SMB churn.\n\n**Signals to watch.** MRC or independent accreditation of Walmart's closed loop — or its absence — by 2028; Paramount+/Tubi or Roku supply terms (rate cards, access) to Vibe changing post-close; Walmart Connect growth decelerating toward the high-teens/low-20s% while Vibe remains a distinct unit past FY28 (a stall tell); and Bain/ANA-style trust surveys, plus any Walmart impairment, writedown, or muted Vibe-contribution language.\n\n**Time horizon.** Visible FY27–FY29; the supply-repricing risk peaks around the PSKY and Fox-Roku integration windows in H1 2027.\n\n*What would move mass off this scenario:* MRC accreditation of the closed loop, or a published third-party SMB-CTV incrementality study, falsifies the bear thesis and shifts mass to Breakout/modal; a public supply-restriction action by a rival-owned streamer against Vibe raises this scenario; two consecutive Connect quarters below ~20% growth makes it modal; and Walmart breaking out Vibe/self-serve revenue at >50% growth with retained advertisers falsifies it.\n\n### Scenario 3: Standalone Onramp Persists\n\n**Probability: 12–18%.**\n\n**Description.** The deal closes, but Walmart keeps Vibe as a named, semi-autonomous self-serve unit — its own DSP, 5,000+ brands, $50/day minimum, and the November-2025 \"Certified Supply\" direct-deal motion — bolted onto Walmart Connect's data rather than dissolved into it. This is the minority leg of the acquired-onramp reference class, where a parent preserves a working SMB funnel to avoid disrupting a high-churn long tail and to keep founder momentum. Walmart still gains the onramp and still trails Amazon as the clear #2; the only difference from the modal is that Vibe's brand and operating identity survive through 2029. It is distinct from the Stall: here the unit persists by deliberate strategy *and performs*, not because integration broke.\n\n**How this number was derived.** Same close base rate, alternate integration branch. P(close) ≈ 0.88 × P(Vibe run as a semi-standalone brand/unit through the window by design | close) ≈ 0.18–0.25 (the minority leg of the acqui-hire reference class — about 25–35% semi-standalone in the onramp base rate, trimmed because much of the \"distinct unit past FY28\" mass is captured as a stall-tell in Scenario 2, not a success) × ~0.88 (still no Amazon overtake). 0.88 × 0.21 × 0.88 ≈ 0.16, so 12–18%. It is carried at a trimmed weight relative to the base-rate view's 20–28% because scrutiny reassigned much of the \"standalone\" mass to the Stall scenario, where a persisting unit is a friction signal rather than a strategy.\n\n**Drivers.** Vibe's own DSP plus the \"Certified Supply\" direct-deal motion is costly to dissolve into Walmart Connect's managed/rented-supply stack; SMB self-serve is high-churn, so rebranding mid-flight risks losing the long tail Walmart paid for; and the founder retention package can sustain a distinct unit through the four-year stay.\n\n**Conditions.** Close completes; Walmart judges the SMB funnel too fragile to rebrand and the unit performs; and channel conflict does not force a restructuring.\n\n**Signals to watch.** Walmart explicitly retaining \"Vibe\" branding and a separate SMB onboarding flow with its own published roadmap; the Vibe DSP / Certified Supply continuing to operate independently post-close; and Vibe headcount and roadmap kept distinct *while advertiser counts rise* (the test that distinguishes strategy from stall).\n\n**Time horizon.** Visible 2027–2029, as the post-close brand and structure decisions land.\n\n*What would move mass off this scenario:* a Walmart commitment to Vibe as a durable, externally marketed standalone brand with rising advertiser counts confirms it; a fast rebrand announcement refutes it and pushes mass to the modal; and Vibe kept distinct but with stalled growth or churning advertisers reclassifies it as the Stall.\n\n### Scenario 4: Breakout — The Closed Loop Actually Converts\n\n**Probability: 10–16%.**\n\n**Description.** The least-trusted asset becomes the decisive one, and the bull thesis holds. Walmart accredits or operationally proves \"TV-ad-to-measured-sale\" across the VIZIO-owned screen; marketplace-seller demand (a seller base growing ~50%) plus genuinely incremental SMB dollars (no trade pool to recycle, so the ANA incrementality critique partly *inverts* in Walmart's favor) compound; and the CTV/RMN consolidation wave (200 to ~10, now reaching self-serve onramps) hands surviving scaled players pricing power. Vibe becomes the category-defining \"Google Ads of streaming\" under Walmart's data; Walmart Connect compounds toward the high-teens/low-$20B by 2029 and the Amazon gap narrows hard on rate (11x toward ~6x) — but Amazon still leads. The upside is long-tail dominance plus a credibly accredited closed loop, not dethroning Amazon.\n\n\n**How this number was derived.** Decomposition conditioned on the moat converting. P(deal closes integrated) ≈ 0.62 (0.88 close × 0.70 integration) × P(closed loop accredited or demonstrably converts within horizon | integrated) ≈ 0.25–0.30 (the corpus's weakest pillar — the least-trusted, hardest asset, against a ~6% trust baseline, 2–3-year accreditation timelines, and a strong skeptic tradition) × P(conversion to outsized SMB-CTV share gains by 2029 | converts) ≈ 0.65. 0.62 × 0.28 × 0.65 ≈ 0.11, so 10–16%. It is deliberately bounded below both the modal and the Stall because it requires the corpus's weakest pillar to become its strongest; the one factor scrutiny could not dismiss is the incrementality inversion (SMB dollars are genuinely new), which holds the floor.\n\n**Drivers.** Closed-loop measurement converting from asserted to accredited — the mechanism unique to Walmart (VIZIO ACR plus checkout). An incremental SMB long-tail TAM with no recyclable trade pool, so Walmart's dollar is genuinely additive. Marketplace-seller demand (~50% growth) as a captive, data-rich advertiser base. And vertical integration (OS plus data plus front-end) enabling supply-path optimization and disintermediation on the owned slice, with consolidation culling rivals into survivor pricing power.\n\n**Conditions.** A third-party-accredited (e.g. MRC) or unambiguously demonstrated closed-loop standard Walmart can market; marketplace-seller self-serve adoption scaling materially through the Vibe onramp; and the VIZIO ACR footprint expanding rather than fenced by privacy action, with channel conflict not choking reach.\n\n**Signals to watch.** MRC or independent accreditation, or major-advertiser endorsement, of Walmart's closed loop; Walmart Connect growth re-accelerating above ~40% rather than decelerating; Walmart US retail-media share crossing into low double digits ahead of trend; audited (not self-reported) ROAS/lift case studies replacing Vibe's unaudited metrics (250% ROAS / 20% lift); and a major SMB-CTV rival exiting or being acquired, consolidating share toward Walmart.\n\n**Time horizon.** Conversion evidence is plausible in FY28–FY29, with full share impact by end-2029.\n\n*What would move mass off this scenario:* a credible third-party accreditation of the closed loop is the single trigger that promotes it; continued reliance on unaudited self-reported metrics keeps it capped; and an ACR privacy ruling shrinking the VIZIO data footprint collapses it toward the deal-stress/stall outcome.\n\n### Scenario 5: Deal Slips, Stalls, or Breaks (regulatory / diligence / walk)\n\n**Probability: 8–14%.**\n\n**Description.** The transaction does not close cleanly on announced terms by ~January 2027. The live mechanism is regulatory. The FTC settled with VIZIO over viewing data in 2017 and second-requested the VIZIO acquisition in 2024, so a Walmart stack combining VIZIO ACR plus shopper data plus an SMB ad onramp is a plausible second-request target on data-concentration and privacy grounds — stretching review past FY2027, forcing data-use remedies, or (least likely) abandonment. The secondary path is non-regulatory: a material-adverse change in Vibe's unaudited, self-reported metrics surfacing in diligence, or a price/structure renegotiation given the ~12.6x-run-rate, ~3.4x-in-9-months markup. In this scenario Vibe stays standalone or is re-shopped, and broader SMB-CTV consolidation continues around other acquirers.\n\n**How this number was derived.** Reference-class complement plus a corpus-specific adjustment. The base failure / don't-close-cleanly rate for friendly sub-$2B HSR-only US strategic tuck-ins is ~5–8% (all three corpus comps cleared; roughly 1 in 10 generic deals fail to close cleanly on schedule). Adjust *up* +3 to +6 points for two corpus hazards: (i) the explicit FTC VIZIO-data precedent (2017 settlement plus 2024 second request), raising second-request odds above the generic base but *not* to blocking, since Vibe adds no horizontal overlap; and (ii) the diligence/MAC risk that every Vibe performance metric is company-self-reported and unaudited against a ~12.6x price. The disjoint paths combine to 8–14%; the cash, $180M retention-heavy structure argues for completion at the low end.\n\n**Drivers.** FTC ACR/viewing-data scrutiny precedent on VIZIO (2017 settlement, 2024 second request); the data-concentration narrative of VIZIO ACR plus shopper data plus an SMB ad onramp under one roof; unaudited, self-reported Vibe metrics (~$100M run-rate) as a diligence/MAC and valuation-justification risk; and the aggressive multiple (~12.6x run-rate versus MNTN's ~2x), which creates renegotiation risk if metrics fail diligence.\n\n**Conditions.** Either the regulator treats the data-stack combination as the relevant theory of harm and second-requests or imposes remedies, or Vibe's unaudited metrics materially impair the thesis or price in diligence, prompting renegotiation or a walk.\n\n**Signals to watch.** Any HSR second request (versus early termination or clearance), especially one citing ACR/viewing data; FTC/DOJ public statements on connected-TV viewing data in 2026–2027; reports of price or structure renegotiation, or an extension of the outside date past January 2027; and audited Vibe financials diverging from the ~$100M run-rate self-report, or any break-fee/termination disclosure.\n\n**Time horizon.** The decision is visible by ~mid-2027, with regulatory signals running through 2026 to the ~January 2027 outside date.\n\n*What would move mass off this scenario:* HSR early termination or clearance with no second request drops it sharply toward its floor; a second request specifically citing ACR/viewing data raises it materially; and confirmation that audited financials match the self-reports lowers the diligence-walk leg.\n\n## Base Rates\n\n**Deal close.** Friendly, definitive, sub-$2B US strategic tech tuck-ins with HSR as the only disclosed condition and no horizontal overlap in the acquired product's core market close in roughly 9 of 10 cases — an ~88% base for a clean close by ~end-FY2027. All three corpus comparables cleared: Pinterest/tvScientific (Feb 2026), Magnite/streamr.ai (absorbed), and Walmart/VIZIO, which drew a 2024 FTC second request yet still closed in December 2024 (scrutiny slowed it but did not block it). All three lines of reasoning concurred, and even the contrarian case explicitly declined to contest close. *Suggests:* a high prior on completion, concentrating most probability mass in the four post-close scenarios.\n\n**No overtake of Amazon.** A #2 closing a ~9–10x ad-revenue gap (Walmart ~$6.4B, +46% in FY26 versus Amazon ~$56–68.6B; Amazon ~75–80% US retail-media share versus Walmart ~8%) to pass an entrenched network-effects #1 within ~3 years has effectively no precedent in digital ad markets — under 5%. The live trajectory (gap from 15x to 11x over four years, off a decelerating RMN base) supports narrowing, not a flip; the \"15x to 11x\" framing flatters a shrinking-growth base. *Suggests:* ~85–90% of post-close mass is \"Walmart remains clear #2, gap narrows\" — the spine of every post-close scenario.\n\n**Acquired self-serve ad-onramp \"front door\" fate.** The modal three-year outcome for a venture-backed self-serve ad tool bought by a retail or platform giant is absorption-plus-rebrand into the parent's ad suite (here Walmart Connect), with founders exiting near the retention cliff (a four-year stay tied to ~$180M — a stay-bonus, not an earnout; the VIZIO/OneView fold-in precedent). *Suggests:* ~60–70% absorb/rebrand (Scenario 1), ~25–35% semi-standalone through the window (Scenario 3, some of which manifests as a stall rather than a success), and ~5–10% stall/written-down.\n\n**Retail-media / SMB-CTV market shape.** Consolidation continues — a 200-to-~10 RMN shakeout now reaching self-serve CTV onramps (Pinterest/tvScientific Dec 2025; Magnite/streamr.ai Sept 2025; Fox/Roku Jun 2026; Paramount/WBD) — on a decelerating curve (CAGR cut from 24.1% to 17.2%); buy-and-build favors scaled survivors. The SMB long-tail dollar is genuinely incremental (no trade pool to recycle), but closed-loop measurement stays asserted-not-accredited (~6% of advertisers fully trust retailer metrics, Bain; ~10% of RMN funding incremental, ANA 2024; IAB 2023: 52% reallocated from digital, 36% from traditional). *Suggests:* a tailwind for scaled acquirers, but a stall is itself a high-base-rate outcome (Scenario 2), and the incrementality picture splits bull from bear.\n\n**Measurement-trust / valuation.** Only ~6% of advertisers fully trust retailer-graded metrics (Bain); Walmart's closed loop is asserted, not accredited, so the \"moat\" converts slowly, if at all, into durable pricing power within the window. Valuation comp: the only public self-serve-CTV pure-play, MNTN, trades ~2x sales and is down ~65%; Walmart reportedly paid ~12.6x run-rate (~$1.4B on ~$100M unaudited run-rate, a ~3.4x markup in 9 months) — a ~6x premium that only the strategic-option framing justifies. *Suggests:* this base rate splits the bull and bear cases — the moat is real on incrementality, weak on trust — and is the reason Breakout is capped while Stall runs wide.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n|---|---|---|---|---|\n| Polymarket | Amazon 2026 capex above $200B? | ~0.755 (Yes) | Active multi-strike ladder; per-strike volume not captured | 2026-06-26 |\n| Polymarket | Amazon 2026 capex strike ladder (>$170B / >$180B / >$190B / >$200B / >$210B / >$220B) | 0.95 / 0.88 / 0.83 / 0.755 / 0.64 / 0.555 (Yes) | Active; per-strike volume not captured | 2026-06-26 |\n| Polymarket | Will Walmart (WMT) beat quarterly earnings? (May 21, 2026, EPS $0.66) | ~0.99 then resolved (closed) | ~$2,173 (May 2026); ~$25,058 (Feb 2026); ~$21,741 (Nov 2025) | 2026-06-26 |\n| Polymarket | What will Walmart say during their next earnings call? (term-mention markets) | Resolved (closed) | ~$48,055 total | 2026-06-26 |\n| Manifold | Will a cell-cultured meat product be easily purchasable at my local Walmart by end of 2028? | ~8.3% (Yes) | Negligible (play-money) | 2026-06-26 |\n| Metaculus | Revenues reported Apr–Jun 2026 for these companies (multi-company total-revenue question) | No segment-level price applicable | Community forecasters; not money-weighted | 2026-06-26 |\n\nThe directly relevant market is absent: a sweep on 2026-06-26 across Polymarket, Manifold, and Metaculus found no instrument on the Walmart–Vibe deal closing, on the survival of the Vibe brand, on Walmart Connect's ad revenue or US retail-media share, or on SMB-CTV outcomes. Every market above is *related* at best. Only the Polymarket Amazon-capex ladder carries real signal. With the >$200B strike priced ~0.755 and the ladder implying continued heavy reinvestment, the market is effectively pricing Amazon to keep spending at a level that defends its scale advantage. That cuts *against* any thesis of fast gap-closure and corroborates the no-overtake base rate underpinning every post-close scenario, while mildly capping the Breakout ceiling. The Walmart earnings-beat and earnings-call term markets are resolved/closed and carry no forward information about the deal; the Manifold cell-cultured-meat and Metaculus total-revenue questions are unrelated to advertising. Because no money-weighted market prices the actual question, the scenario probabilities here rest on reference classes and decomposition, not on a market-implied number — and should be read as analytical estimates, not as a crowd consensus.\n\n## What Would Change My Forecast\n\n1. **HSR outcome.** Early termination or clearance with no second request pushes mass into Scenarios 1–4 and collapses the deal-stress scenario toward its floor; a second request — especially one citing the VIZIO-ACR-plus-shopper-data combination — sharply raises \"Deal Slips, Stalls, or Breaks.\"\n2. **Walmart Connect ad-revenue growth, FY27–FY29.** Sustained high-30s%+ confirms the modal; two consecutive quarters below ~20% makes \"Catch-Up Stalls\" the modal scenario.\n3. **Independent accreditation of the closed loop.** MRC accreditation of Walmart's VIZIO-ACR \"TV-ad-to-sale\" loop, or a published third-party SMB-CTV incrementality study, is the single trigger that promotes \"Breakout\" and falsifies the moat-skeptic \"Stall\" thesis; continued reliance on unaudited self-reported metrics (250% ROAS / 20% lift) keeps Breakout capped.\n4. **Vibe operating structure by FY28.** Full absorption into Walmart Connect self-serve confirms the modal/Breakout integration thesis; persistence as a distinct unit with *rising* advertiser counts confirms \"Standalone Persists\"; persistence with churn or stalled growth confirms \"Stall.\"\n5. **Rival-owned-supply behavior post-PSKY and Fox-Roku (H1 2027).** Public supply restriction or repricing against Vibe by Paramount+/Tubi/Roku raises the \"Stall\" scenario.\n6. **Walmart-versus-Amazon ad-revenue ratio.** Compression below ~8x by 2028 validates faster-than-trend gap-narrowing and lifts \"Breakout\"; an Amazon ad-growth or capex pullback (Polymarket capex strikes resolving NO) raises the ceiling on gap-closure.\n7. **Audited Vibe financials versus the ~$100M run-rate self-report.** A material downward divergence raises the diligence-walk leg of \"Deal Slips\" and the metrics-soft risk in \"Stall.\"\n8. **Founder trajectory.** Querou/Tetzlaff departing at or after the ~4-year retention cliff, or Vibe's standalone DSP being retired into Walmart's pipes, corroborates the absorption modal; long tenure with a distinct roadmap corroborates \"Standalone Persists.\"\n\n## Open Questions\n\n- **Does the measurement moat convert?** The Stall-versus-Breakout split turns entirely on whether Walmart's closed loop earns independent accreditation and trusted pricing power. The deciding evidence — MRC accreditation or a third-party SMB-CTV incrementality study — does not yet exist. So the question stays genuinely open, preserved as the wide Stall range beside a capped Breakout rather than resolved.\n- **Strategy or friction?** If a named \"Vibe\" unit survives past FY28, does that reflect deliberate strategy (Scenario 3) or integration friction (Scenario 2)? The two are told apart only by whether advertiser counts rise or churn — a distinction that will not be legible until FY28–FY29.\n- **What are the real terms?** Walmart's June 23 release states \"terms not disclosed.\" The ~$1.4B / $1.2B-cash / ~$180M-retention structure and the ~12.6x multiple come from WSJ and Reuters reporting; an audited Walmart 10-Q/10-K/8-K footnote could revise the valuation premium that anchors the Stall and Breakout cases.\n- **Will the FTC treat the data stack as a theory of harm?** The VIZIO precedent (2017 settlement, 2024 second request) makes a data-concentration review plausible but not probable, given no horizontal overlap. How the agency frames ACR-plus-shopper-data concentration is the swing factor for the deal-stress tail.\n- **How incremental is the SMB long tail, really?** The bull case rests on the inversion that SMB dollars are genuinely new (no trade pool to recycle). The magnitude of that incrementality — versus SMB churn eroding it — is unmeasured and decisive for both Breakout and Stall.\n\n## Sources\n\nForecast inputs are drawn from the corpus's grounded source set (full annotations in `Sources.md`) and a 2026-06-26 prediction-market sweep.\n\n**Deal and company primary sources.**\n- Walmart Corporate, \"Walmart to Acquire Vibe.co to Expand Access to Connected TV Advertising,\" 2026-06-23. https://corporate.walmart.com/news/2026/06/23/walmart-to-acquire-vibe-co-to-expand-access-to-connected-tv-advertising\n- Vibe.co, \"Walmart to Acquire Vibe.co,\" company blog, 2026-06-23. https://www.vibe.co/blog/whats-new/walmart-agrees-to-acquire-vibe\n- Walmart Corporate, \"Walmart Completes Acquisition of VIZIO,\" 2024-12-03. https://corporate.walmart.com/news/2024/12/03/walmart-completes-acquisition-of-vizio\n- Vibe.co / GlobeNewswire, \"Vibe.co Raises $50M Series B…,\" 2025-09-30. https://www.globenewswire.com/news-release/2025/09/30/3158376/0/en/Vibe-co-Raises-50M-Series-B-to-Bring-AI-Powered-Hyper-Targeted-Advertising-to-TV.html\n- Walmart Corporate, \"Walmart Releases Q4 FY26 Earnings,\" 2026-02-19; \"Walmart Releases Q1 FY27 Earnings,\" 2026-05-21.\n\n**Deal terms and valuation (reported, not filed).**\n- TV Tech, \"Walmart to Pay $1.4 Billion to Acquire Ad Tech Firm Vibe.co\" (citing WSJ). https://www.tvtechnology.com/business/mergers-acquisitions/walmart-to-pay-usd1-4-billion-to-acquire-ad-tech-firm-vibe-co\n- The Next Web, \"Walmart buys Vibe.co for $1.4bn to chase Amazon in ads,\" 2026-06. https://thenextweb.com/news/walmart-vibe-co-deal-amazon-ads\n- Yahoo Finance (WSJ-sourced), \"Walmart Expands Advertising Business with Vibe.co Acquisition,\" 2026-06. https://finance.yahoo.com/media-advertising/articles/walmart-expands-advertising-business-vibe-034007117.html\n- Reuters (via corroboration), \"Walmart to acquire Vibe.co for about $1.4 billion in cash,\" 2026-06.\n- StockAnalysis.com, MNTN statistics (~2.1x P/S, down ~65%), accessed mid-June 2026.\n\n**Strategic and competitive context.**\n- Fortune, \"Walmart's $1.4 billion Vibe.co deal is a direct shot at Amazon's booming ad business,\" 2026-06-25. https://fortune.com/2026/06/25/walmart-connect-vibe-co-amazon-ad-business-streaming/\n- Marketing Dive, \"Walmart raked in $6.4B from ads last year.\" https://www.marketingdive.com/news/walmart-raked-in-64b-from-ads-last-year-execs-see-plenty-runway-ahead/812669/\n- eMarketer, \"Retail Media Ad Spending Forecast and Trends H2 2025\" (CAGR 24.1%→17.2%; Amazon ~$60.6B; share data). https://www.emarketer.com/content/retail-media-ad-spending-forecast-trends-h2-2025\n- Amazon Ads & Roku, BusinessWire, \"Largest Authenticated CTV Footprint,\" 2025-06-16 (~80M households, >80% US CTV reach).\n\n**Comparable deals and the consolidation wave.**\n- Pinterest Newsroom, \"Pinterest to Acquire tvScientific\" (Dec 11 2025) / \"Pinterest Closes tvScientific Acquisition\" (Feb 17 2026). https://newsroom.pinterest.com/news/pinterest-tvscientific/\n- Magnite / GlobeNewswire, \"Magnite Acquires streamr.ai\" (Sept 9 2025). https://www.globenewswire.com/news-release/2025/09/09/3146907/0/en/Magnite-Acquires-streamr-ai\n- Fox Business, \"Fox Corporation announces $22B acquisition of Roku,\" 2026-06-15. https://www.foxbusiness.com/markets/fox-corporation-announces-22b-acquisition-roku-landmark-streaming-live-tv-deal\n- PRNewswire / Paramount Skydance, \"Paramount Launches All-Cash Tender Offer to Acquire Warner Bros. Discovery,\" 2025-12-08. https://www.prnewswire.com/news-releases/paramount-launches-all-cash-tender-offer-to-acquire-warner-bros-discovery-for-30-per-share-302635412.html\n- AdExchanger, \"A Rundown Of (Pretty Much) Every Ad Tech Deal Of 2025.\" https://www.adexchanger.com/platforms/a-rundown-on-pretty-much-every-ad-tech-deal-of-2025/\n\n**Measurement-trust, incrementality, and the skeptic tradition.**\n- Bain & Company, \"No More Easy Money on the Side: Retail Media Enters the Performance Era,\" 2023-12-13 (~6% fully trust retailer metrics). https://www.bain.com/insights/no-more-easy-money-on-the-side-retail-media-enters-the-performance-era/\n- ANA, \"Retail Media Networks: Optimism Tempered with Caution,\" July 2024 (~10% incremental; ~36% reallocated). https://www.marketingdive.com/news/retail-media-marketing-concerns-study-ana/641587/\n- IAB / BWG Strategy, \"Retail Media 2023\" (52% reallocated from digital, 36% from traditional). https://www.iab.com/news/iab-and-mrc-releases-retail-media-measurement-guidelines/\n- IAB & MRC, \"Retail Media Measurement Guidelines,\" final 2024-01-29. https://www.iab.com/wp-content/uploads/2024/01/IAB-MRC-Retail-Media-Measurement-Guidelines-Explainer-January-2024.pdf\n- Digiday, \"Walmart-Vizio's CTV measurement faces incrementality hurdle.\" https://digiday.com/marketing/walmart-vizios-ctv-measurement-faces-incrementality-hurdle/\n- AdExchanger, \"MNTN's SMB CTV Ad Business Is Growing Like Gangbusters\" (Q3 2025).\n\n**Regulatory precedent.**\n- FTC, \"VIZIO to Pay $2.2 Million…,\" 2017-02-06 (corroborated by WilmerHale, Davis Wright Tremaine, Kelley Drye analyses).\n- Bloomberg Law / Axios / TechCrunch + Walmart Corporate, 2024 (VIZIO HSR second request; withdraw/refile March 2024; close Dec 3 2024).\n\n**Vibe operating detail.**\n- AdExchanger, \"Vibe.co Secures $22.5 Million In Series A Funding…,\" 2024-02 (Vibe runs its own DSP). https://www.adexchanger.com/tv/vibe-co-secures-22-5-million-in-series-a-funding-to-help-smbs-try-ctv/\n- AdExchanger, \"Why CTV Startup Vibe Is Dropping Resellers In Favor Of Certified Supply,\" 2025-11. https://www.adexchanger.com/tv/why-ctv-startup-vibe-is-dropping-resellers-in-favor-of-certified-supply/\n\n**Prediction-market sweep (2026-06-26).**\n- Polymarket, Amazon 2026 capex strike ladder. https://gamma-api.polymarket.com/public-search?q=Amazon\n- Polymarket, Walmart earnings-beat and earnings-call term markets (resolved/closed). https://gamma-api.polymarket.com/public-search?q=Walmart\n- Manifold, \"Will a cell cultured meat product be easily purchasable at my local Walmart by the end of 2028?\" https://manifold.markets\n- Metaculus, \"Revenues reported Apr–Jun 2026 for these companies.\" https://www.metaculus.com/questions/43021/"}], "glossary": [{"term": "8-K", "aliases": ["10-Q", "10-K"], "def": "Official financial reports a public company must file with U.S. regulators — an 8-K discloses a major event quickly, while 10-Qs and 10-Ks are the regular quarterly and annual reports, and any of them could eventually confirm deal terms a company has not otherwise disclosed."}, {"term": "ACR", "aliases": ["automatic content recognition"], "def": "A feature built into many smart TVs that identifies what is on screen by repeatedly sampling the picture and matching it to a reference database, so the TV maker knows what a household watched and can use that for ad targeting and measurement."}, {"term": "ANA", "aliases": ["Association of National Advertisers"], "def": "The main U.S. trade group representing brands and advertisers — the companies that pay for ads, as opposed to the companies that sell ad space."}, {"term": "ARR", "aliases": ["annualized run-rate", "annual recurring revenue", "run-rate", "run rate"], "def": "A way of estimating a company's yearly revenue by taking a recent short period (like a month or quarter) and multiplying it out to a full year, which can overstate actual trailing revenue if that recent period was unusually strong."}, {"term": "AVOD", "aliases": ["advertising-based video on demand"], "def": "Streaming video that is free or reduced-cost to watch because it carries ads, as opposed to a pure subscription service with no commercials."}, {"term": "CFIUS", "aliases": ["Committee on Foreign Investment in the United States"], "def": "A U.S. government body that reviews foreign companies buying American businesses for national-security concerns; it does not apply when the buyer is American and the target is foreign, as in this deal."}, {"term": "clean room", "aliases": ["data clean room"], "def": "A secure system that lets two companies match up their separate customer data to measure things like ad performance, without either side seeing the other's raw underlying data."}, {"term": "closed-loop measurement", "aliases": ["closed loop", "closed-loop attribution"], "def": "Tying a specific ad a person saw to a specific purchase that person later made, using the seller's own sales records, so a company can claim a proven link between an ad and a sale rather than just an estimate."}, {"term": "CPM", "aliases": ["cost per thousand impressions", "cost per mille"], "def": "The price an advertiser pays for every one thousand times its ad is shown, the standard unit for pricing ad inventory."}, {"term": "Deal ID", "aliases": ["Deal IDs"], "def": "A pre-arranged, identified ticket that lets a buyer purchase a specific chunk of ad inventory from a specific seller, instead of bidding blind in an anonymous open marketplace."}, {"term": "disintermediation", "aliases": [], "def": "Cutting out a middleman in a supply chain entirely — for example, a buyer purchasing directly from a publisher instead of going through a broker who takes a cut."}, {"term": "DSP", "aliases": ["demand-side platform"], "def": "Software that advertisers use to buy ad space automatically across many different websites, apps, or streaming services through real-time auctions, rather than negotiating each placement by hand."}, {"term": "FAST", "aliases": ["free ad-supported streaming TV"], "def": "Streaming TV channels that work like old-fashioned broadcast television — free to watch, funded entirely by ads, with a fixed programming schedule rather than watch-anytime shows."}, {"term": "full-funnel", "aliases": ["marketing funnel"], "def": "Covering an advertiser's entire customer journey — from a shopper's first hearing about a product all the way through to the actual purchase — inside one platform with one measurement system, instead of splitting brand-awareness ads and sales-focused ads across separate tools."}, {"term": "HSR", "aliases": ["Hart-Scott-Rodino", "Hart-Scott-Rodino Antitrust Improvements Act"], "def": "The U.S. law requiring companies to notify antitrust regulators before completing a merger or acquisition above a certain size and wait out a review period before the deal can close."}, {"term": "IAB", "aliases": ["Interactive Advertising Bureau"], "def": "A trade organization that sets technical and measurement standards for the digital advertising industry."}, {"term": "incrementality", "aliases": ["incremental"], "def": "Whether an ad actually caused a sale that would not otherwise have happened, as opposed to simply appearing before a purchase the customer was going to make anyway."}, {"term": "last-click attribution", "aliases": ["last-click"], "def": "A way of crediting a sale entirely to the very last ad a shopper interacted with before buying, even though earlier ads or factors may have actually driven the decision — a method critics say overstates how much any single ad really worked."}, {"term": "linear TV", "aliases": ["linear"], "def": "Traditional broadcast and cable television, watched live on a fixed channel schedule, as distinct from streaming services watched on demand over the internet."}, {"term": "MAC", "aliases": ["material adverse change"], "def": "A contract clause that lets a buyer walk away from or renegotiate a deal if something seriously damaging to the target company turns up before the sale closes."}, {"term": "MRC", "aliases": ["Media Rating Council"], "def": "An industry body that formally certifies, or accredits, that an advertising measurement method meets agreed standards — a stamp of independent approval that a company's own self-reported numbers do not carry."}, {"term": "programmatic", "aliases": ["programmatic advertising"], "def": "Buying and selling ad space through automated, real-time software auctions rather than through a salesperson negotiating each placement directly."}, {"term": "retail media network", "aliases": ["RMN", "retail media", "commerce media"], "def": "A retailer's own advertising business, where it sells ad space — on its website, in its app, in stores, or increasingly on streaming TV — targeted and measured using the shopping data it collects from its own customers."}, {"term": "ROAS", "aliases": ["return on ad spend"], "def": "How much revenue an ad campaign generated for every dollar spent on it, usually expressed as a multiple or percentage — for example, 250% ROAS means $2.50 in sales for every $1 spent."}, {"term": "signal loss", "aliases": [], "def": "The industry-wide erosion of the tracking tools advertisers used to follow shoppers across websites and apps, driven by privacy rules, browser changes, and phone-operating-system changes that make it harder to link an ad to a person."}, {"term": "SPO", "aliases": ["supply-path optimization"], "def": "The practice of routing an ad purchase through the shortest, most direct path from advertiser to publisher, cutting out redundant middlemen who would otherwise each take a cut of the spend."}, {"term": "SSP", "aliases": ["supply-side platform"], "def": "Software that publishers and app owners use to sell their ad space automatically to many potential buyers at once, the seller-side counterpart to a DSP."}, {"term": "TAM", "aliases": ["total addressable market"], "def": "The total revenue a company could theoretically capture if it won every possible customer in a given market, used as a measure of how big an opportunity really is."}, {"term": "third-party cookies", "aliases": ["cookie deprecation", "third-party cookie"], "def": "Small tracking files placed by outside companies (not the website you're visiting) that let advertisers follow a person's browsing across many unrelated sites — long the backbone of cross-site ad targeting, and a technology browsers have moved to restrict."}, {"term": "trade spend", "aliases": ["trade dollars", "co-op dollars", "cooperative marketing dollars"], "def": "Money a brand pays a retailer for things like shelf placement, promotions, and discounts, historically treated as a cost of doing business rather than as advertising — a pool of money some critics say retail media networks are now relabeling as ad spend."}, {"term": "walled garden", "aliases": [], "def": "A closed advertising or data ecosystem that keeps its audience, data, or buying tools locked inside its own platform, making it hard for outside advertisers, tools, or competitors to get in or see how it works."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {
  let h = document.getElementById('kbd-help');
  if (!h) {
    h = document.createElement('div'); h.id = 'kbd-help';
    h.innerHTML = '<div class="kh"><h3>Keyboard</h3><dl>'
      + '<dt>⌘K</dt><dd>command palette</dd>'

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}

  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);

}

  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';

}
function speakChunk() {

      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();

}
function startListen() {
  if (!synth) return;

  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();

}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();

}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }

}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);

  lbar.querySelector('#lb-stop').onclick = stopListen;

  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };

  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });

window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command

window.addEventListener('hashchange', () => {

// Related reading at the foot of the column — corpus-level, from the inlined

function renderRelated() {

  const mEl = document.getElementById('library-manifest');

  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }

  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {

  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '620px', normal: '700px', wide: '820px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {

    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;

  document.body.appendChild(pop);

  var openFor = null, cEl = document.getElementById('content');

    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');

  });

      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';

      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();

.card-prog { display: inline-flex; align-items: center; gap: .34rem; font-family: var(--mono); font-size: .64rem;
