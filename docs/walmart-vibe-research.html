<script id="corpus-data" type="application/json">{"slug": "walmart-vibe-research", "title": "The Missing Front Door", "subtitle": "Walmart's $1.4B acquisition of Vibe.co — completing a retail-media + connected-TV ad stack, and the long catch-up to Amazon", "author": "", "generated": "2026-06-26", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of the Walmart–Vibe.co Deal", "summary": "In June 2026 Walmart agreed to buy Vibe.co, a tool that lets a corner store run a streaming-TV ad for fifty dollars a day — the one missing piece that lets Walmart prove a TV ad drove a real, measured sale, and chase Amazon's ten-times-bigger ad business.", "body": "# Six Easy Pieces of the Walmart–Vibe.co Deal\n*How the world's largest retailer bought a fifty-dollar-a-day TV-ad button, and why*\n\n## The button that puts a corner store on television\n\nA florist can put an ad on television now. Not on a local cable slot at 2 a.m. — on real streaming TV, on the same screens showing prestige dramas, for about fifty dollars a day, launched from a laptop by clicking a few buttons and typing in a budget, with no agency and no sales rep in the middle. The tool that does this is called **Vibe.co**. On June 23, 2026, Walmart agreed to buy it, for a price the *Wall Street Journal* reported at about **$1.4 billion** — though Walmart itself will only say \"terms not disclosed,\" a gap worth remembering.\n\nHere is the one idea. Walmart did not buy Vibe to get *into* television advertising; it already was in. It bought the single missing part of a machine it had spent two years and billions assembling. That machine has three parts: the **data** (a record of what its shoppers actually buy), the **screen** (it owns a smart-TV brand, VIZIO), and now the **buying tool** (Vibe, the fifty-dollar button). Bolt the three together and Walmart can do the one thing television advertising never could — draw a straight line from *\"this person saw this ad\"* to *\"this person bought this box of cereal.\"* That line is the whole prize.\n\n## Why a cereal ad's price tag should interest you\n\nFor a century, TV advertising was a leap of faith. You paid a fortune, your ad ran, sales maybe moved — but you could never *prove* the ad did it. Walmart's pitch is that it can now prove it, because it owns both the screen the ad played on and the checkout where the sale rang up.\n\nTwo groups of people care a great deal. The first is every small business that was locked out of television by its price and its gatekeepers. A local mattress store or a Walmart-marketplace seller can now spend $500 the way it spends money on Google — small, measured, turned off if it fails. That huge crowd of small advertisers — many tiny buyers instead of a few giant ones, what the trade calls the *long tail* — is a bigger and steadier prize than the handful of national brands everyone fought over before.\n\nThe second is Amazon. Amazon built this exact business first and runs it about **ten times larger** — roughly a **$68.6 billion** ad business in 2025 against Walmart's **~$6.4 billion**, holding some 80% of all money spent on retailer advertising in America. The honest word for what Walmart is doing is *catch-up*. Whether it ever closes that gap is the question the rest of this turns on.\n\n## The players you need to hold in your head\n\nSix names carry the whole story.\n\n- **Retail media** — a retailer's own advertising business. It sells ad space, on its site and increasingly on TV, aimed and scored using the shopping data it collects on its own customers. Amazon invented the modern version in 2012; every retailer copied it.\n- **Walmart Connect** — Walmart's retail-media business, the arm that sells the ads. About $6.4 billion in the year ending January 2026, growing fast, and the clear #2 in America behind Amazon.\n- **CTV** — *connected TV*, meaning streaming television watched over the internet on a smart TV, as opposed to old broadcast and cable. This is where viewers went, and where the ad money is following.\n- **VIZIO** — the smart-TV brand Walmart bought in December 2024 for about $2.3 billion. It matters because its televisions have **ACR** — *automatic content recognition*, a feature that lets the TV see what is on its own screen — so Walmart knows what a household watched.\n- **Vibe.co** — the company at the center of this. A French-founded startup (Arthur Querou and Franck Tetzlaff, not the \"Stan Coignard\" some coverage names) whose product is a dashboard the advertiser runs entirely by itself — no salesperson, no phone call: pick an audience, set a budget, upload a video, go live the same day. Like the screen where you set up a Google or Facebook ad, but for streaming television.\n- **Closed-loop measurement** — the payoff. Tying a specific ad a person saw to a specific purchase that same person later made, using the retailer's own sales records. This is the thing the whole stack exists to deliver.\n\n## Following one fifty-dollar ad through the machine\n\nWatch a single dollar move, and the strategy becomes plain.\n\nA small business opens the Vibe console and sets a budget — say $50 a day. It picks who to reach and uploads a short video. Within minutes the ad is live, playing between shows on hundreds of streaming apps. So far, nothing special: several rivals — Roku, Hulu, MNTN — offer a button much like this. The console is not the moat.\n\nThe moat is what happens *around* the ad. When that ad plays on a VIZIO television, the TV's ACR feature registers that this household saw it. Later, that same household buys the advertised product — in a Walmart store or on Walmart.com — and the purchase is recorded at checkout. Walmart now holds both ends of the string: the viewing and the buying. It can hand the florist a report saying *your ad reached these homes, and this many of them bought.* No open streaming service can do that, because none of them owns the checkout.\n\nThere is a second dollar worth following — the ad dollar itself. In the normal way of buying streaming ads, the money passes through a chain of middlemen before it reaches the screen. Think of a concert ticket bought through a reseller, who bought it from a broker, who bought it from the venue: each hand it passes through takes a cut, so the company that actually shows the ad keeps well under half of what the advertiser paid. That gap between what the advertiser pays and what each middleman passes on is called the *spread*. When the ad runs on Walmart's own VIZIO screens, Walmart *is* that whole chain and the screen at the end of it, so it pockets the spread instead of handing it off. Owning the data, the screen, and the buying tool is how Walmart both proves the sale and keeps the spread.\n\n## The fight: a real moat, or an expensive story?\n\nSmart people who have read the same facts disagree sharply, and the disagreement is not about whether the deal closes — nearly everyone thinks it will. It is about whether the strategy pays off.\n\n**The bulls** say Walmart bought the right thing at the right moment. The small-business dollar is *genuinely new* money: a corner store has no marketing-budget shell games to hide, so when it spends $500 on a TV ad, that is real new money the ad brought in — sales that would not have happened otherwise, what the industry calls *incrementality* — not budget quietly shuffled over from somewhere else. Walmart's closed loop is hard to copy because almost no one owns both a TV brand and a checkout. In a consolidating market, owning a scaled front door is exactly where you want to be.\n\n**The bears** answer that the moat is *asserted, not proven*. Every dazzling number Vibe cites — \"250% return,\" \"20% sales lift\" — is self-reported and unaudited, and in the broader industry only about **6%** of advertisers say they fully trust a retailer's grading of its own ads. Retailers, the critics note, \"grade their own homework.\" Walmart reportedly paid about **12.6 times** what Vibe earns in a year — roughly $12.60 for every $1 of yearly sales — when the only comparable public company sells for about 2 times its yearly sales. Paying six times the going rate like that is called a *premium*, and here it rides on a promise no independent referee has yet certified. Worse, Vibe owns none of the TV it advertises on; it rents that space from streamers like Paramount+ and Tubi, now being swallowed by media giants that compete with Walmart for ad dollars and could squeeze the supply.\n\nBut the bears' strongest number does *not* prove the measurement is wrong. Low trust today means only that no neutral outsider has checked Walmart's math yet — not that the math is bad. That unchecked gap is exactly what an independent certification (below) would close.\n\nSo the honest reading sits between them. The measurement edge is real on the incrementality point — the new money is genuinely new — and weak on the trust point, because no outsider has yet confirmed the sales numbers. The $1.4 billion is best understood as a *strategic bet* on becoming a stronger #2 — not a price you could defend from Vibe's own economics alone.\n\n## Where it's heading, and the one thing to watch\n\nNobody can know how this pays off, because the deciding evidence does not yet exist. But the shape of the futures is clear enough to sketch.\n\nThe most likely path — call it a bit better than a coin flip against any single rival — is the *boring* one. The deal clears its antitrust review around January 2027, Vibe is folded into Walmart Connect, the \"Vibe\" name fades as its founders serve out their four-year stay, and Walmart keeps closing the gap on Amazon *by rate but never by level* — narrowing from ten-times-behind toward single digits, yet never passing a rival that is entrenched and still outspending everyone. A meaningful chance sits in a gloomier branch, where the measurement moat never earns independent trust, small advertisers churn away, and the rented TV supply gets squeezed — so the pricey bet quietly underperforms. A smaller chance is the breakout, where the closed loop *does* win real, certified trust and Vibe becomes the \"Google Ads of streaming.\" And a slim tail is regulatory: U.S. antitrust officials once fined VIZIO over its viewing data and could balk at one company holding the screen, the shopper data, and the ad tool all at once.\n\nThe single signal a normal reader can watch cuts through all of it: whether an independent referee — a neutral industry body that audits ad measurement, the kind of outside umpire brands trust, such as the Media Rating Council — ever certifies Walmart's TV-ad-to-sale claim. If that stamp arrives, the bulls were right. If, years on, Walmart is still grading its own homework, the bears were. Everything else is noise around that one question: can a company that owns both the television and the till convince the rest of the world to believe the number it writes down?"}, {"order": 1, "file": "01_Origins_Retail_Media_CTV_Convergence.md", "title": "Origins — How Retail Media and Self-Serve CTV Collided to Make Walmart–Vibe Logical", "summary": "", "body": "# Origins: How Retail Media and Self-Serve CTV Collided\n\n> **Decode-on-first-use key (this document):**\n> **CTV** = connected TV — streaming-TV ads delivered over internet-connected televisions (smart TVs, dongles, game consoles), as opposed to broadcast/cable \"linear\" TV.\n> **Retail media network (RMN)** = a retailer selling advertising inventory against its own first-party (logged-in, opted-in) shopper data — the retailer becomes a media owner.\n> **AVOD** = advertising-based video on demand (paid-content streaming with ads, e.g., Hulu, Netflix's ad tier).\n> **FAST** = free ad-supported streaming TV (linear-style free channels delivered over the internet, e.g., Tubi, Pluto, The Roku Channel).\n> **SMB** = small and mid-sized business.\n> **DSP** = demand-side platform — software advertisers use to buy ads programmatically (automated auctions).\n> **SSP** = supply-side platform — the mirror image, used by publishers to sell inventory.\n> **ACR** = automatic content recognition — software in a smart TV that identifies what is on screen frame-by-frame, generating a viewing-history dataset.\n> **Closed-loop measurement** = tying an ad exposure to a verified purchase using the retailer's own transaction data.\n\n---\n\n## Bottom Line\n\nThe Walmart–Vibe deal was no bolt from the blue. It was the predictable collision of two of advertising's fastest-moving currents over roughly 2012–2026. **Retail media** — retailers monetizing their first-party shopper data as an ad channel — grew from Amazon's 2012 search-ads experiment into a **~$62B+ U.S. business in 2025, forecast to reach ~$129.9B by 2028** (eMarketer); Amazon alone cleared **~$56B in 2024 ad revenue** as the template everyone copied. In parallel, **connected TV** unbundled from linear. U.S. CTV ad spend hit **$23.6B in 2024 (+16%, IAB)** and ~$33.4B in 2025 (eMarketer's broader measure), and is forecast to overtake traditional TV around 2028 — while linear TV's share of viewing time fell from **72.2% (2020) to ~56.5% (2024)**. The decisive 2024–25 development was **self-serve democratization**: Roku Ads Manager, Disney/Hulu's self-service tool, MNTN, tvScientific and Vibe pushed the entry minimum for a national TV campaign down to **~$500**, opening TV to the long tail of SMBs that once needed an agency and a six-figure budget. The two currents collided on a shared problem — CTV historically could not prove a TV impression drove a store purchase — which retail media's **closed-loop measurement** solves natively. Walmart, sitting on 150M+ weekly shoppers' purchase data plus VIZIO's ACR viewing data (acquired Dec 2024 for $2.3B), had the data to close the loop but lacked the self-serve front door for small advertisers. Vibe is that front door. The present feels inevitable in hindsight, but it was not: Google's 2025 reversal of cookie deprecation removed part of the original \"signal-loss\" rationale, and CTV's measurement and incrementality questions remain genuinely unsettled.\n\n---\n\n## 1. The Template: Amazon Proved a Retailer Could Be a Media Company\n\n**So what:** Before any of this was a \"category,\" Amazon proved the economic insight the entire Walmart–Vibe logic rests on — that a retailer's purchase data is the most valuable targeting and measurement asset in advertising, and that selling access to it is a higher-margin business than selling products.\n\nAmazon launched what is generally credited as the first modern retail media network in **2012**, beginning with sponsored product search ads against its own first-party shopper data [1]. The mechanism is a flywheel: shoppers generate purchase and intent data; that data makes ads more targetable and measurable; better-performing ads attract more advertiser spend; that spend subsidizes lower prices and faster logistics; cheaper, faster delivery attracts more shoppers. The advertising leg grew enormous. Amazon reported **~$56B in advertising revenue in 2024, up 18% year-over-year** [2], and eMarketer projected Amazon's U.S. retail media ad revenue alone would pass **$60.6B in 2025 and climb to ~$69.7B in 2026** [3]. In Q4 2025 Amazon reported **$17.3B in advertising services revenue**, up from $14.7B a year earlier [2].\n\nThree features of the Amazon template matter for understanding why Walmart eventually needed Vibe:\n\n1. **Margin.** Advertising is dramatically higher-margin than retail. Selling data-targeted impressions against traffic you already own looks closer to a software business than a grocery business — which is why retail media became the most-watched profit pool in retail.\n2. **Full-funnel expansion.** Amazon did not stay in search. It pushed up the funnel into brand and video — Prime Video (which turned on ads in early 2024), Twitch, live sports, IMDb, Amazon Music — pairing commerce data with premium video inventory [3]. That is the exact move Walmart is now making with VIZIO and Vibe.\n3. **Self-serve scale.** Amazon's advertiser base is enormous and long-tailed precisely because much of it is self-serve: a third-party seller can launch a sponsored-products campaign with a credit card and no agency. That long-tail monetization of its own marketplace sellers is the part of the template Walmart had only partly replicated — and the gap Vibe fills.\n\n**The honest caveat:** Amazon's advantage is endemic — its ads sit next to a purchase that happens *on Amazon*. Walmart's bet is the harder version of the problem: extend closed-loop commerce measurement *off-property*, onto the television screen, where the purchase may happen later in a physical store.\n\n---\n\n## 2. The Tailwind: Signal Loss Made First-Party Data Valuable — But the Story Got Complicated\n\n**So what:** For most of 2020–2024, the bull case for retail media leaned hard on one argument — that the open web's tracking infrastructure was dying, so retailers' logged-in, consented first-party data would become the scarce, durable targeting asset. That tailwind was real, but it weakened in 2025, and any honest origins story has to flag it.\n\nThe original thesis ran like this. Digital advertising had been built on **third-party cookies** (small files that let advertisers track users across unrelated websites) and adjacent identifiers (mobile ad IDs, IP-based signals, device fingerprints). Apple's 2021 App Tracking Transparency change and Google's announced plan to deprecate third-party cookies in Chrome threatened to strip out the connective tissue of cross-site targeting and measurement — collectively, \"**signal loss.**\" Retail media networks pitched their first-party data, built on tens of millions of logged-in, opted-in shopper relationships, as the answer [4][8].\n\n**But the cookie did not die.** Google delayed deprecation repeatedly through 2024, then on **April 22, 2025, reversed course** — Chrome would keep allowing third-party cookies unless users manually disable them [4]. That drained part of the urgency from the retail-media pitch: as one Digiday analysis put it, the \"answer to cookie deprecation\" selling point became \"less certain\" once Google put off the decision [4].\n\nTwo nuances keep the tailwind alive, and any honest account should hold both:\n- **Signal loss is broader than cookies.** Industry analysts argue the cookie is \"a red herring\" against the wider erosion of IP-address, location, fingerprinting and mobile-SDK signals, much of it driven by regulation and browser/OS privacy changes rather than Google's one decision [4]. Walmart's logged-in purchase data stays durable whatever the cookie's fate.\n- **Google then sunset the replacement.** In a further twist, reporting indicates Google deprecated its remaining Privacy Sandbox APIs (its proposed cookie-replacement toolkit) in **October 2025** [4]. Note: the dramatic downstream figures circulating for that change (e.g., \"85% attribution inaccuracy,\" \"42–67% reduction in advertiser spend\") trace to a single analytical blog and are not independently corroborated — treat as a claimed projection, not an established fact.\n\n**Net:** signal loss genuinely accelerated retail media's rise, but it is no longer the clean, one-way tailwind the 2021–2023 pitch decks implied. The more durable driver is simpler and hangs on no browser decision at all: **a retailer's first-party purchase data is the only dataset that can deterministically connect an ad to a sale.** Cookies or no cookies, that holds — and it is the real engine under both retail media and the Walmart–Vibe deal.\n\n---\n\n## 3. The Unbundling: Linear TV Broke Into Streaming, and Streaming Filled With Ads\n\n**So what:** The supply side of the story is the collapse of linear TV and the rise of ad-supported streaming, which created a vast new pool of premium video inventory that — unlike old linear TV — is addressable, programmatic, and increasingly measurable. Without this unbundling there is no CTV for Walmart to buy into.\n\nThe viewing shift is unambiguous. Linear TV's share of the time U.S. viewers spent watching video on a TV screen fell from **72.2% in 2020 to a forecast ~56.5% by the end of 2024** [5]. By **February 2025, streaming accounted for 43.7% of total U.S. TV viewing time, surpassing broadcast (22.5%) and cable (24.4%) combined for the first time** (Nielsen, via Scale Marketing) [5]. Cord-cutting drove it: roughly **21.5M subscribers cut the cord between 2020 and 2024**, with another ~4.8M projected for 2025 [5].\n\nThe money followed the eyeballs, with a lag:\n- **Linear TV ad spend** is projected to fall ~13% to **~$51B in 2025**, continuing a secular decline [5].\n- **CTV ad spend** rose to **$23.6B in 2024, up 16% (IAB)**, reaching ~$26.6B in 2025 on IAB's advertiser-reported basis [6]. eMarketer's broader ecosystem measure puts 2025 U.S. CTV at **$33.35B**, growing double-digits to **$46.89B by 2028** — the year eMarketer projects CTV will **surpass traditional TV ad spend for the first time** (~$46.9B CTV vs ~$45.1B linear) [6].\n\nCrucially, the new streaming inventory is overwhelmingly **ad-supported**. The 2022–2024 pivot — Netflix and Disney+ launching ad tiers, the explosion of FAST services — flipped streaming from a subscription-only world into an ad-rich one:\n- As of Q1 2024, **38% of U.S. premium VOD subscriptions were ad-supported, up from 31% in Q2 2023** [5].\n- **FAST** (free ad-supported streaming TV — linear-style free channels over the internet) now reaches **more than one-third of the U.S. population**, with monthly viewership up ~12% year-over-year [5].\n- By **Q2 2025, ad-supported content captured 73.6% of total TV viewing time**, up from the prior quarter, while non-ad-supported viewing fell to 26.4% [5].\n\n**Why this matters for Walmart–Vibe:** the unbundling converted television. Once you bought it in advance through an agency, in 30-second blocks, against age/gender demographics. Now it is a digital, biddable, data-targetable channel. That is the precondition for everything downstream. A retailer's shopper data is useless against a 1990s broadcast buy; against a programmatic CTV impression it is decisive.\n\n---\n\n## 4. The Democratization: Self-Serve Pushed TV's Entry Price From Six Figures to ~$500\n\n**So what:** This is the proximate origin of the deal. Between roughly 2019 and 2026, a wave of self-serve buying tools collapsed the cost and complexity of running a national TV campaign — from agency relationships and six-figure insertion orders down to a credit card and a ~$500 minimum — opening television to millions of SMBs for the first time. Vibe leads that wave; Walmart bought the onramp.\n\nHistorically, TV advertising was gated. Buying it required an agency, manually negotiated insertion orders, and budgets that priced out small businesses. Self-serve dashboards dismantled that gate, borrowing the Meta/Google playbook of letting an advertiser launch a campaign with no minimum relationship. The key entrants and milestones:\n\n| Platform | What it is | Entry point | Notable scale / date |\n|---|---|---|---|\n| **Disney / Hulu Ad Manager** | Disney's self-service tool for SMBs and small agencies | **$500 minimum** | Launched (Hulu) 2021; grew ~9x to **75,000+ businesses** signed up; expanding to Disney+/ESPN+ [7] |\n| **Roku Ads Manager** | Roku's self-serve performance platform | **$500 minimum** | Launched **Sept 2024**; scales buys across Roku + 100 ad-supported streamers; Shopify shoppable-ad integration [9] |\n| **MNTN (Performance TV)** | Performance/direct-response CTV platform; \"digital-style\" targeting + measurement | Self-serve, SMB-focused | **IPO'd on NYSE May 22, 2025** at $16/share (+27% day one); base **~96% SMBs**, many advertising on TV for the first time; Q3 2025 revenue ~$70M (+31% YoY) [10] |\n| **tvScientific** | Performance CTV for direct-response/performance marketers | Self-serve | Performance-CTV cohort alongside MNTN [10] |\n| **Vibe.co** | Self-serve CTV for performance/ecommerce/SMB marketers | Low-minimum self-serve | Founded **Aug 2021**, launched Sept 2022; **5,000–10,000+ advertisers**; **$100M revenue run rate in <2 years**; **$50M Series B at $410M valuation, Sept 2025** [11][12] |\n\nA few specifics worth holding:\n\n- **The $500 number is real and load-bearing.** Both Disney/Hulu's self-service tool and Roku Ads Manager publish a **$500 minimum** to launch a campaign [7][9]. That is the figure that turns \"national TV\" from an agency product into an SMB product. (Some resellers market sub-$500 access, but the platform minimums anchor at ~$500.)\n- **MNTN's IPO is the category's proof point.** A self-serve CTV platform whose customer base is ~96% SMBs went public on the NYSE in May 2025 and grew its client count ~89% YoY in Q1 2025 — direct evidence that SMB demand for self-serve TV is large and investable [10]. MNTN itself estimated a **$60B–$120B serviceable market** for performance CTV [10].\n- **Vibe's trajectory is the specific reason it was acquirable.** Reaching a **$100M revenue run rate in under two years** put Vibe among the fastest software companies to that milestone, and a **$50M Series B led by Hedosophia at a $410M valuation in September 2025** [11][12] crowned it the category's venture-backed leader — nine months before Walmart's offer. (Note a source discrepancy: Vibe's own Series B materials cite \"5,000+ brands\" as of Sept 2025; Walmart's June 23, 2026 acquisition release cites \"10,000+ advertisers\" — consistent with continued growth, but the figures come from the companies themselves and should be read as company-reported [11][13].)\n\n**Why this matters for Walmart:** Walmart Connect had the data and the inventory but no polished, low-friction, self-serve front door for the long tail of small advertisers — including the hundreds of thousands of third-party sellers on Walmart Marketplace, the exact analogue to Amazon's self-serve seller base. Building that front door from scratch is hard and slow; the talent is scarce; the product takes years to mature. Vibe is a finished, scaled, AI-driven version of exactly that.\n\n---\n\n## 5. The Collision Point: CTV's Measurement Problem Met Retail Media's Closed Loop\n\n**So what:** Retail media and self-serve CTV did not merely grow in parallel — they solved each other's defining weakness. CTV could not prove a TV impression drove a purchase. Retail media's defining asset is first-party transaction data that can. The Walmart–Vibe deal productizes that fit.\n\n**CTV's measurement gap.** For most of its history, CTV advertising could report *exposure* — impressions, reach, completion rates, view-through conversions, modeled return-on-ad-spend (ROAS) — but not *incrementality*: whether the ad caused a sale that would not otherwise have happened [14]. No clean link ran from a TV impression to a store purchase. That is the single biggest reason TV budgets historically went to brand-building rather than performance, and why CFOs scrutinizing CTV spend in 2025–2026 increasingly demanded incrementality, not impressions [14]. As of 2026, only ~15% of advertisers said they strongly trusted their retail-media measurement — evidence the problem is real and unfinished [14].\n\n**Retail media's closed loop.** Closed-loop attribution connects an ad exposure to a *verified purchase event* using the retailer's own first-party transaction data, replacing the modeled assumptions that plague open-web measurement [14]. A retailer that knows both who saw the ad and who bought the product can compute lift deterministically. Walmart, with purchase data from **150M+ weekly customers** [1] and VIZIO's ACR viewing data, holds both halves.\n\n**The proof points are early but live.** At the 2026 NewFronts, Walmart surfaced CTV closed-loop measurement claiming a median 44% viewing rate on successful campaigns, and that 65% of surveyed Walmart customers said CTV ads helped them discover new products; a CPG case study run through Walmart Connect's \"Scintilla\" measurement product (April 2026) reported a 2.97% sales lift and a 72% win-back rate [14]. **Source caveat:** these are Walmart-reported, vendor-favorable figures — reliable as a record of *what Walmart claims*, not independent proof — and Digiday separately reported that Walmart-VIZIO's CTV measurement still \"faces an incrementality hurdle\" [14]. The capability is real and improving; its independent validation is not yet settled.\n\n**This is the hinge of the whole story.** Self-serve CTV gave small advertisers a cheap door into television. Retail media gave them the one thing TV never had: a deterministic answer to \"did it work?\" Put the two together — a $500 self-serve buy that returns a closed-loop sales number from the retailer's own data — and you have a product that did not exist before, one an SMB can actually justify. Walmart had the closed loop; Vibe had the door.\n\n---\n\n## 6. The Buyer's Position: Walmart Had Assembled Everything Except the Front Door\n\n**So what:** By mid-2026 Walmart had spent two years and billions building a CTV ad flywheel — Walmart Connect (the data), VIZIO (the screen and ACR data), and a web of DSP/SSP partnerships (the pipes). Vibe was the one missing piece: a finished front door for small advertisers. The acquisition completes a stack; it does not start one.\n\nThe pieces Walmart had already assembled, dated:\n\n- **Walmart Connect (the data + sales engine).** Walmart renamed its media business from \"Walmart Media Group\" to **Walmart Connect on January 28, 2021**, signaling its ambition to become a top-tier U.S. ad business [16]. In **FY2026 (ended ~Jan 2026), Walmart Connect generated $6.4B in advertising revenue, up 46% year-over-year** [15] — several times faster than Walmart's core retail sales. In Q4 FY2026, advertising and membership income together made up ~one-third of operating profit [15]. The data underneath: first-party shopper data from **150M+ weekly customers** [1].\n- **VIZIO (the screen + ACR data).** Walmart **completed its $2.3B acquisition of VIZIO on December 3, 2024** ($11.50/share) [17], bringing in VIZIO's **SmartCast** smart-TV operating system, ~**18M active SmartCast accounts** (of ~23M opted-in devices), and — critically — VIZIO's **ACR (automatic content recognition)** data: software that fingerprints what is on the TV screen multiple times per second, generating a granular viewing-history dataset for targeting and measurement [17][18]. This is the screen Walmart now owns, and the viewing signal that completes its purchase data.\n- **The programmatic pipes (DSP/SSP partnerships).** Through 2026 Walmart Connect pushed its first-party data off-property. In **late April 2026 it launched \"Connect Select,\"** a curated CTV marketplace inside the Walmart DSP with supply from **Magnite, PubMatic, FreeWheel and Index Exchange (SSPs)** and inventory from **VIZIO, Paramount, and Warner Bros. Discovery** [19]. On **May 28, 2026, it made its first-party audiences available inside Yahoo DSP, routed through Magnite's supply-side technology against VIZIO CTV inventory** [19]. In 2025, offsite display through Walmart Connect delivered a median 52% new-to-brand customers [19].\n\nWhat was missing was the **self-serve onramp** — the simple, AI-assisted dashboard that lets a small business or a Walmart Marketplace seller launch a streaming-TV campaign itself, against Walmart's data and VIZIO's screens, for a few hundred dollars. Walmart's existing tools served enterprise advertisers and agencies through DSPs; they did not serve the long tail the way Amazon's self-serve seller tools or Roku's Ads Manager do. **Vibe is that onramp, pre-built and pre-scaled.** Hence \"buy, not build\": on **June 23, 2026** Walmart announced it would acquire Vibe.co — reported at **$1.4B** (WSJ), structured per trade reporting as roughly **$1.2B cash plus ~$180M in founder/executive retention** — with the deal expected to close by end of FY2027, subject to HSR (Hart-Scott-Rodino) antitrust waiting-period clearance [13][20][21]. Founders **Arthur Querou (CEO)** and **Franck Tetzlaff (CTO)** and the Vibe team are expected to join Walmart Connect [13].\n\n**The inevitability — and where it wasn't.** In hindsight the deal looks overdetermined: Walmart had the data, the screen, and the pipes; it was structurally short exactly one thing; Vibe was the scaled version of that thing; Amazon had already proven the model worth tens of billions. But it was not inevitable. Walmart could have built its own onramp — slower, but cheaper than $1.4B. The cookie reversal weakened the original first-party-data urgency. CTV's incrementality question remains open. And $1.4B for a company at a ~$100M run rate is a rich multiple that only makes sense if the *strategic* fit — closing the SMB front door on a flywheel Walmart already owns — is worth more than the standalone business. That gap between strategic and standalone value is the live question the chapters that follow examine.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The convergence that made Walmart–Vibe logical, 2012–2026<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">2012<\/div><div class=\"tlbody\">Amazon launches search ads — the retail-media template<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">Jan 2021<\/div><div class=\"tlbody\">Walmart Media Group rebrands to Walmart Connect<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">Summer 2021<\/div><div class=\"tlbody\">Vibe.co founded (Querou &amp; Tetzlaff)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">Dec 2024<\/div><div class=\"tlbody\">Walmart closes VIZIO (~$2.3B) — the screen + ACR signal<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">2024–25<\/div><div class=\"tlbody\">Self-serve CTV minimums fall to ~$500 (Roku, Hulu, MNTN)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">Apr 2026<\/div><div class=\"tlbody\">Walmart launches Connect Select (curated CTV marketplace)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">Jun 23 2026<\/div><div class=\"tlbody\">Walmart announces Vibe.co acquisition (reported ~$1.4B)<\/div><\/div><\/div><figcaption>Two arcs — retail media (Amazon&#x27;s flywheel, Walmart Connect) and self-serve CTV (falling minimums) — meeting at the deal. <span class=\"credit\">Source: Walmart, eMarketer, IAB (2024–2026).<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## Open Questions\n\n1. **How durable is the first-party-data tailwind now that the cookie survived?** Google's April 2025 reversal undercut the original \"answer to cookie deprecation\" pitch. Does retail media's growth re-rate downward (eMarketer already cut its retail-media CAGR forecast from 24.1% to 17.2%), or does the broader signal-loss/regulatory trend keep first-party data scarce regardless?\n\n2. **Is CTV's incrementality problem actually solved, or just claimed?** Walmart's closed-loop figures are vendor-reported and Digiday flags an \"incrementality hurdle.\" Independent, audited proof that CTV closed-loop measurement reliably isolates causal sales lift does not yet exist in the public record.\n\n3. **Was ~$500 truly the floor that unlocked the SMB long tail, or a marketing number?** Platform minimums anchor at $500, but effective economics (creative costs, minimum viable reach) may set a higher real floor. How many of these SMB advertisers retain past their first campaign?\n\n4. **Does Walmart's stack actually replicate Amazon's flywheel off-property?** Amazon's measurement closes on-platform; Walmart's closes partly in physical stores via loyalty/payment data. Is off-property, in-store closed-loop measurement as deterministic as the pitch implies?\n\n5. **How big is the genuinely incremental SMB CTV TAM?** MNTN cited $60B–$120B serviceable; that range is wide and self-estimated. What is the realistic 2029 SMB-CTV pool that Walmart–Vibe is competing for?\n\n---\n\n## Sources\n\n1. MetaRouter, \"The History of Retail Media Networks\" — Amazon launched first retail media network in 2012; Walmart Connect 150M+ weekly customers. Tier 5 (specialist explainer). https://www.metarouter.io/post/the-history-of-retail-media-networks — accessed 2026-06-26. *(Amazon-2012 origin corroborated across multiple secondary sources; 150M weekly-customer figure is Walmart-reported.)*\n2. eMarketer / Statista / Amazon results coverage — Amazon ~$56B 2024 ad revenue (+18%); Q4 2025 advertising services $17.3B vs $14.7B prior year. Tier 1 (company results) via Tier 5 reporting. https://www.statista.com/statistics/259814/amazons-worldwide-advertising-revenue-development/ ; https://www.fool.com/investing/2025/07/28/amazon-is-quietly-building-a-massive-advertising-b/ — accessed 2026-06-26.\n3. eMarketer, \"Amazon's retail media ad revenues will pass $60 billion in 2025\" — $60.6B 2025, ~$69.7B 2026 forecast; full-funnel (Prime Video, Twitch, IMDb, Music). Tier 1-2 market sizing. https://www.emarketer.com/content/amazon-retail-media-ad-revenues-will-pass-60-billion-2025 — accessed 2026-06-26.\n4. Digiday, \"The winners and losers of Google's third-party cookie reversal\"; Seresa.io, \"Google Saved the Cookie\" (Apr 2025 reversal); ExchangeWire (delay). Cookie reversal Apr 22, 2025; signal-loss-is-broader-than-cookies framing; Privacy Sandbox API sunset Oct 2025. Tier 4-5 (reversal date is Tier 3-4 fact; downstream % figures are single-source Tier 5/6, flagged). https://digiday.com/marketing/the-winners-and-losers-of-googles-third-party-cookie-reversal/ ; https://seresa.io/blog/data-loss/google-saved-the-cookie-what-the-april-2025-reversal-actually-means — accessed 2026-06-26.\n5. Scale Marketing, \"2025 Media Trends\" (Nielsen data via); Advanced Television (linear ad-spend decline); KORTX CTV stats. Linear share 72.2%→56.5% (2020→2024); streaming 43.7% of viewing Feb 2025; cord-cutting 21.5M (2020–24); linear ad spend ~$51B 2025 (−13%); AVOD 38% of VOD subs Q1 2024; FAST 1-in-3 Americans; ad-supported 73.6% of viewing Q2 2025. Tier 5 reporting of Tier 1-2 (Nielsen/eMarketer) data. https://www.scale-marketing.com/blog/2025-media-trends-the-changing-world-of-watching/ — accessed 2026-06-26.\n6. IAB, \"CTV Rebounds to Double-Digit Growth in 2024\" (PRNewswire); eMarketer CTV forecasts. CTV $23.6B 2024 (+16%, IAB), ~$26.6B 2025 (IAB); eMarketer $33.35B 2025 → $46.89B 2028; CTV surpasses linear ~2028. Tier 1-2 (IAB primary report; eMarketer forecast). https://www.iab.com/news/ctv-rebounds-to-double-digit-growth-in-2024/ ; https://www.emarketer.com/content/digital-video-ad-spend-thrives-despite-advertising-headwinds — accessed 2026-06-26.\n7. Disney Advertising Press / AdExchanger / Online Optimism — Hulu/Disney self-service $500 minimum; grew ~9x to 75,000+ businesses; expanding to Disney+/ESPN+. Tier 1 (Disney press) + Tier 5 (AdExchanger). https://press.disneyadvertising.com/disney-s-self-service-business-opens-the-door-to-small-medium-sized-agencies- ; https://www.adexchanger.com/programmatic/disney-uses-self-service-to-attract-new-buyers-with-a-focus-on-local/ — accessed 2026-06-26.\n8. eMarketer, \"Retail Media Ad Spending Forecast and Trends H2 2025\" / \"More than $10 billion incremental\" — U.S. retail media >$62B 2025 (+$10B YoY); $69.33B 2026; $129.93B by 2028 (~quarter of total media); CAGR revised 24.1%→17.2% (2024–28). Tier 1-2 market sizing. https://www.emarketer.com/content/retail-media-ad-spending-forecast-trends-h2-2025 ; https://www.emarketer.com/content/10-billion-incremental-ad-spending-will-flow-us-retail-media-2025 — accessed 2026-06-26.\n9. Roku Advertising, \"Introducing Roku Ads Manager\"; AdTechRadar (Sept 20, 2024 launch). $500 minimum; self-serve; scales across Roku + 100 ad-supported streamers; Shopify shoppable ads; SMB/mid-market focus. Tier 1 (Roku) + Tier 5. https://advertising.roku.com/learn/resources/introducing-roku-ads-manager-a-self-service-performance-solution-for-growth-marketers ; https://adtechradar.com/2024/09/20/roku-launches-self-serve-ads-manager-targets-growth-marketers/ — accessed 2026-06-26.\n10. eMarketer, \"MNTN goes public\" + AdExchanger — MNTN NYSE IPO May 22, 2025 at $16 (+27% day 1); ~96% SMB base; client count +89% YoY Q1 2025; Q3 2025 revenue ~$70M (+31%); $60B–$120B serviceable-market estimate; tvScientific in same performance-CTV cohort. Tier 1 (IPO/financials) + Tier 5 reporting. https://www.emarketer.com/content/mntn-goes-public--highlighting-rising-ctv-demand-smbs ; https://www.adexchanger.com/tv/mntns-smb-ctv-ad-business-is-growing-like-gangbusters/ — accessed 2026-06-26.\n11. GlobeNewswire / VideoWeek / Built In NYC — Vibe.co founded Aug 2021, launched Sept 2022; $50M Series B led by Hedosophia, Sept 30, 2025; $410M valuation; $100M revenue run rate in <2 years; 5,000+ brands (company-reported). Tier 1 (funding announcement) + Tier 5. https://videoweek.com/2025/09/30/vibe-reaches-410-million-valuation-with-50-million-series-b-funding/ ; https://www.builtinnyc.com/articles/vibeco-raises-50m-series-b-20251001 — accessed 2026-06-26.\n12. Yahoo Finance, \"Vibe.co Raises $50M Series B\" — corroborates Series B, valuation, run-rate, AI-targeting positioning. Tier 1 press release distribution + Tier 4 host. https://finance.yahoo.com/news/vibe-co-raises-50m-series-100000178.html — accessed 2026-06-26.\n13. Walmart Corporate, \"Walmart to Acquire Vibe.co to Expand Access to Connected TV Advertising,\" June 23, 2026 — PRIMARY. Self-serve CTV for SMB/mid-market; 10,000+ advertisers; founders Arthur Querou (CEO) & Franck Tetzlaff (CTO); team joins Walmart Connect; close by end FY27; no FY27 sales/operating-income guidance impact; Ryan Mayward (GM/SVP Walmart Connect U.S.) quote. Tier 1 (company release — claims, not independent proof; deal value NOT disclosed here). https://corporate.walmart.com/news/2026/06/23/walmart-to-acquire-vibe-co-to-expand-access-to-connected-tv-advertising — accessed 2026-06-26.\n14. Digiday, \"Walmart-Vizio's CTV measurement faces incrementality hurdle\"; eMarketer, \"Pairing retail media and CTV\"; Osmos.ai (closed-loop definition); Walmart Connect Scintilla case study. CTV measurement gap (exposure vs incrementality); closed-loop definition; only ~15% strongly trust retail-media measurement (2026); NewFronts 2026 / Scintilla April 2026 figures (Walmart-reported). Tier 4-5; vendor figures flagged. https://digiday.com/marketing/walmart-vizios-ctv-measurement-faces-incrementality-hurdle/ ; https://www.emarketer.com/content/pairing-retail-media-ctv-means-more-data-close-loop-measurement — accessed 2026-06-26.\n15. Marketing Dive, \"Walmart raked in $6.4B from ads last year\"; SwotPal / ALM Corp — Walmart Connect $6.4B FY26 ad revenue (+46% YoY); VIZIO triple-digit ad-sales growth; ads+membership ~1/3 of Q4 FY26 operating profit. Tier 1 (Walmart-reported financials) via Tier 4-5. https://www.marketingdive.com/news/walmart-raked-in-64b-from-ads-last-year-execs-see-plenty-runway-ahead/812669/ — accessed 2026-06-26.\n16. Walmart Corporate, \"Walmart Announces Expanded Vision and New Name for its Media Business,\" Jan 28, 2021 (PRIMARY); Marketing Brew. Walmart Media Group → Walmart Connect rebrand; three-pillar strategy (owned properties, in-store screens, first-party data offsite). Tier 1 + Tier 5. https://corporate.walmart.com/news/2021/01/28/walmart-announces-expanded-vision-and-new-name-for-its-media-business — accessed 2026-06-26.\n17. Walmart Corporate, \"Walmart Completes Acquisition of VIZIO,\" Dec 3, 2024 (PRIMARY); TechCrunch; Variety. $2.3B / $11.50/share completed Dec 3 2024; SmartCast OS; CTV ad-business rationale. Tier 1 + Tier 4-5. https://corporate.walmart.com/news/2024/12/03/walmart-completes-acquisition-of-vizio ; https://techcrunch.com/2024/12/03/walmart-completes-23b-acquisition-of-vizio-to-help-grow-its-ad-business/ — accessed 2026-06-26.\n18. Kepler / Digiday / Digilant — VIZIO ~18M active SmartCast accounts (of ~23M opted-in devices); ACR (automatic content recognition) fingerprints on-screen pixels several times/second for targeting + measurement. Tier 5 (specialist). https://www.keplergrp.com/blog/walmart-s-acquisition-of-vizio-a-revolution-for-the-retail-giant ; https://digilant.com/blog/walmarts-vizio-acquisition-and-navigating-the-acr-data-evolution/ — accessed 2026-06-26.\n19. eMarketer, \"Walmart Connect expands offsite retail media beyond its own DSP\"; PPC.land (Connect Select); Marketing Dive (Yahoo/Magnite). Connect Select launched late Apr 2026 (Magnite, PubMatic, FreeWheel, Index Exchange SSPs; VIZIO/Paramount/WBD inventory); Yahoo DSP integration May 28 2026 via Magnite supply-side; 52% median new-to-brand offsite display 2025. Tier 1-2 + Tier 5. https://www.emarketer.com/content/walmart-connect-expands-offsite-retail-media-beyond-its-own-dsp ; https://www.marketingdive.com/news/walmart-connect-expands-offsite-advertising-ambitions-with-yahoo-magnite/821575/ — accessed 2026-06-26.\n20. TV Tech, \"Walmart to Pay $1.4 Billion to Acquire Ad Tech Firm Vibe.co\" (citing WSJ) — $1.4B deal value (WSJ-sourced); close by end FY27; founders join Walmart Connect. Tier 4-5 reporting of Tier 4 (WSJ) primary reporting. https://www.tvtechnology.com/business/mergers-acquisitions/walmart-to-pay-usd1-4-billion-to-acquire-ad-tech-firm-vibe-co — accessed 2026-06-26.\n21. Yahoo Finance / invidis / Boston 25 / AI Weekly — $1.4B total; ~$1.2B cash + ~$180M executive retention post-close; HSR Antitrust Improvements Act waiting-period condition; targets SMB/mid-market; closed-loop commerce-driven video ambition. Tier 4-5; deal-structure split is trade-reported (not in Walmart's own release). https://uk.finance.yahoo.com/news/walmart-acquire-vibe-co-expand-130000914.html ; https://invidis.com/news/2026/06/ctv-walmart-acquires-vibe-co-for-usd-1-4-billion/ — accessed 2026-06-26."}, {"order": 2, "file": "02_Vibe_The_Company.md", "title": "Vibe.co — The Company Walmart Bought", "summary": "", "body": "# Vibe.co — The Company Walmart Bought\n\n## Bottom Line\n\n**Vibe.co is a self-serve connected-TV (CTV — internet-streamed television) advertising platform that lets small and mid-sized businesses launch a streaming-TV ad campaign in minutes, the way they already buy Facebook or Google ads.** Two repeat French ad-tech founders built it — **Arthur Querou** (CEO) and **Franck Tetzlaff** (CTO). They established the company in **summer 2021**, raised a **~$7–7.5M seed in 2022** (Elaia-led) and launched the product that year, then a **$22.5M Series A in February 2024** (Singular-led), then a **$50M / €42M Series B in late September 2025** (Hedosophia-led) at a **$410M post-money valuation**. By the Series B, Vibe self-reported a **~$100M annualized revenue run-rate reached in under two years**, **5,000+ brands** (10,000+ performance marketers), and reach across **120M+ U.S. households via 500+ apps and channels**. On **June 23, 2026**, Walmart agreed to buy it. Press reports (WSJ, The Information) put the price at **~$1.4B including a ~$180M executive-retention component** — roughly **3.4× the nine-month-old Series B valuation** and **~12.6× the ~$100M run-rate**.\n\n**One caveat runs through this whole account: nearly every performance number Vibe cites — \"250% ROAS,\" \"20% sales lift,\" \"4× better than traditional TV,\" the per-client ROAS figures — is company- or customer-self-reported and not independently audited.** The funding amounts, investors, valuation, founder identities, and deal existence are well-corroborated across multiple independent outlets and primary filings. The marketing metrics are not. Two points worth flagging up front: (1) the co-founder is **Franck Tetzlaff** — no source attests a founder named \"Stan Coignard\"; and (2) the headline entry minimum is consistently reported as **\"$50/day,\" not a \"$500 minimum\"** — the $500 figure could not be confirmed.\n\n---\n\n## 1. Who built it — the founders and their pedigree\n\n### Claim 1.1 — Vibe was co-founded by Arthur Querou (CEO) and Franck Tetzlaff (CTO)\n\nVibe's two co-founders are **Arthur Querou**, Co-Founder and CEO, and **Franck Tetzlaff**, Co-Founder and CTO [1][2][3]. Walmart's own acquisition announcement confirms this, naming both and stating both are expected to join Walmart Connect after close [1]. Across the Walmart release, Maddyness, EU-Startups, Demand Gen Report, Digiday, AdExchanger and TVREV, the only two named founders are Querou and Tetzlaff.\n\n### Claim 1.2 — Both founders are repeat French ad-tech entrepreneurs; their immediately prior venture (KMTX) was sold to Seedtag in June 2022\n\nThe two are described in the French startup press as \"deux Frenchies\" — repeat entrepreneurs on their fourth-plus venture [4][5].\n\n- **Franck Tetzlaff:** a co-founder of **Doctolib** (the French healthcare-booking unicorn) and former **CTO of Frichti** (a French food-delivery startup) [4]. ContactOut and Crunchbase-type profiles also list MakeMeReach, KMTX and Kobojo in his history [6].\n- **Arthur Querou:** founded **Appinest** and **MotionLead**, and served as **Chief Mobile Officer of Adikteev** (a French ad-tech firm) [4][7].\n- **Together**, before Vibe, they built **KMTX**, a semantic-targeting ad-tech specialist, which was **sold to Seedtag in June 2022** [4][5].\n\nThe Pulse 2.0 founder interview also describes Querou as a **Y Combinator alumnus** mentored by Sam Altman, with \"four successful exits\" [7] — but the YC/exits framing is **self-reported in an interview**. Treat it as the founder's characterization, not an audited record.\n\n### Claim 1.3 — Vibe is a deliberately dual French/NYC company: U.S. go-to-market, Europe-based engineering\n\nCoverage describes Vibe as **New York-based** (HQ at **131 Varick Street, New York, NY**) and, in the same breath, as a **French/Paris-rooted** company [8][9]. Maddyness spells out the split: the **technical team is primarily Europe-based**, while **sales, operations and marketing are U.S.-based** [4]. The Series A coverage calls Vibe \"**NYC- and Paris, France-based**\" [10]. This dual identity is strategically central — a French engineering cost base funding an aggressive U.S. SMB land-grab.\n\n---\n\n## 2. The product thesis — \"the Google Ads of streaming\"\n\n### Claim 2.1 — Vibe's positioning is \"the Google Ads of streaming\" / run TV \"like paid social\"\n\nFrom the Series A (Feb 2024) through the Walmart deal, Vibe describes itself the same way: **\"the Google Ads of streaming TV\"** [10][11] — or, equivalently, \"Meta for TV ads.\" Querou's framing in the Walmart release is that Vibe lets marketers \"**run streaming TV the way they run paid social: measurable, fast to launch**\" [1]. The thesis is **democratization** — bring the simple, self-serve, performance-measured ad-buying of Google and Meta to CTV, for advertisers that \"national TV has long priced out\" [12].\n\n### Claim 2.2 — The self-serve flow: launch a streaming-TV ad \"within minutes,\" budgets \"as low as $50/day\"\n\nPer CEO Arthur Querou, a user can **register, configure strategy, select channels and audiences, drag-and-drop creative, and go live \"within minutes,\"** with **\"budget options starting as low as $50 per day\"** [13]. The Series A coverage likewise describes deploying video ads \"within minutes\" across major U.S. streaming networks [10].\n\n> **A note on the entry minimum:** Sources consistently cite **$50/day** as the entry budget and \"**within minutes**\" as the launch time. No source states a \"$500 minimum\"; that occasionally-cited figure is unverified and may conflate a different threshold — a minimum first deposit, a per-campaign floor, or an older number. The $50/day figure itself rests mainly on Querou interviews [13].\n\n### Claim 2.3 — The platform bundles creative, targeting, media-buying and measurement, increasingly AI-driven\n\nIn one self-serve interface, Vibe unifies **ad-creative generation, audience targeting, media buying, and AI-powered campaign optimization** [9]. The named product components (company-described) include:\n\n- **Vibe Studio** — an AI-powered video/creative editor; a \"Creative Generator\" that takes business info and produces a voiceover and direct-response-style creative [7][13].\n- **Vibe IQ2 (\"IQ 2\")** — a machine-learning bidding engine \"designed to predict outcomes for each impression,\" enabling purchase of both affordable and premium inventory [7][13].\n- **Vibe AI Assistant** — strategy recommendations [7].\n- **Vibe Connect** — direct publisher access [7].\n\n### Claim 2.4 — AI-generated creative is a stated growth vector (~10% of ads in 2025, targeted ~30% by 2026)\n\nVibe self-reported that **~10% of ads running on the platform are AI-generated as of the Series B (late 2025)**, and **projects that ~30% of platform ads will be AI-generated in 2026** [14]. Series B capital is earmarked partly for \"**generative and agentic AI capabilities for media buying and creative production**\" [9]. *Status: company projection, not an audited outcome.*\n\n---\n\n## 3. How the plumbing actually works — inventory, DSP, SSP, supply\n\nThis is the part worth decoding carefully, because it determines how much margin Vibe actually controls. The acronyms first. **DSP = demand-side platform** (the system advertisers buy ad impressions through). **SSP = supply-side platform** (the system publishers sell their ad inventory through). **CTV = connected TV** (TV shows and movies streamed over the internet, where these ads run).\n\n### Claim 3.1 — Vibe operates its OWN DSP, integrated with major SSPs and most major streaming platforms (initially excluding Netflix, Hulu, YouTube)\n\nThis is the single most important plumbing fact, and it is well-sourced. Per AdExchanger, the ad-tech trade publication, **Vibe runs its own DSP**, one that \"**has direct integrations with most of the major streaming platforms other than Netflix, Hulu and YouTube**\" and is \"**integrated with nearly every large SSP**\" [15]. So Vibe is **not merely a reseller skin on a third-party DSP** — it owns the demand-side buying technology. On the supply side, it historically pulled from **both SSPs and direct publisher deals** [11][15].\n\n### Claim 3.2 — In November 2025 Vibe shifted from open-market reselling to \"Certified Supply\" (direct integrations + opt-in Deal-ID whitelist)\n\nIn **November 2025**, Vibe launched **\"Certified Supply,\"** moving away from open-market resellers and restricting buyable inventory to **direct publisher integrations and Deal IDs from an opt-in whitelist of publishers/supply partners** [16]. *(A \"Deal ID\" is a pre-negotiated private-marketplace ticket that lets a buyer transact specific, identified inventory rather than anonymous open-exchange impressions.)*\n\nThe trigger, per the company, was a test: an ad fired in Vibe's New York office generated **\"closer to 500\" bid requests instead of the expected 1–5** — evidence of massive inventory duplication, chains of CTV resellers all offering the same impression [16]. Vibe also cited a fraud signal: a prospect claiming to buy **ESPN inventory at $3 CPMs** when genuine premium content runs **~$25–$60 CPM** [16]. CTO Franck Tetzlaff put it plainly: \"**when it's too open, it starts being an issue**\" [16]. **Philo** (a streaming-cable provider) is named as a certified direct-integration supply partner [16].\n\n> **Why this matters for the Walmart thesis:** Certified Supply is exactly the kind of clean, transparent, direct-to-publisher pipe a retail-media buyer — and an antitrust reviewer — wants. It also means Vibe's value lies partly in **owned demand-side tech plus curated supply relationships**, not just a front-end. *Certified Supply dates to November 2025 [16]; whether it remains the default model under Walmart is an open question.*\n\n### Claim 3.3 — Vibe integrates third-party measurement (AppsFlyer, Adjust) but is distancing itself from data brokers\n\nFor lower-funnel (conversion) measurement, Vibe maintains integrations with the **mobile-attribution platforms AppsFlyer and Adjust** [15]. The company says it is \"**distancing itself from data brokers**\" over data-granularity concerns, moving toward first-party data and direct publisher supply [15]. *These measurement integrations were last confirmed in early 2024; whether they persist post-acquisition is unconfirmed.*\n\n### Claim 3.4 — Reach: 120M+ U.S. households across 500+ apps and channels\n\nVibe self-reports reach across **120M+ U.S. households** and **500+ apps and channels** [3][14]. *Company-claimed reach figure; consistent across the Series B materials but not independently audited.*\n\n---\n\n## 4. The performance metrics — what is claimed vs. what is verified\n\n**This is where care matters most. Every metric below is company- or customer-self-reported. None is independently audited, and none should be taken as established fact.**\n\n### Claim 4.1 — Headline performance claims: \"250% ROAS\" and \"20% sales lift\" (COMPANY-CLAIMED)\n\nThe Series B announcement materials carry headline claims of an **average ~250% ROAS** (return on ad spend — revenue generated per dollar of ad spend; 250% = $2.50 back per $1 spent, often written \"2.5× ROAS\") and a **~20% sales lift** [17][14]. Vibe's own blog frames this as a \"**2.5× average ROAS**\" and \"**4× better performance than traditional TV**\" [14]. **These are platform-wide marketing averages reported by the company, with no disclosed methodology, control group, or third-party validation.** *They originate in Vibe's own materials, echoed by outlets repeating the release.*\n\n### Claim 4.2 — Per-client ROAS testimonials are dramatic and cherry-picked (CUSTOMER-CLAIMED)\n\nIn the Pulse 2.0 interview, Querou cited individual customer results: **Meshki \"2,976% ROAS in one week\"** plus 266% via retargeting; **ONEHOPE \"13× ROAS in one month\"**; **Sijo Home \"17% higher average order value\"**; an unnamed DTC brand with an **\"11% lift in sales\"**; and optimization \"**reducing cost per conversion from $80 to as low as $15–$20**\" [7]. **These are customer testimonials the company selected — the upper tail, not the average. Never present them as typical or verified.**\n\n### Claim 4.3 — Named clients lend credibility but not audited performance\n\nNamed advertisers across coverage include **Blink Fitness, Scopely, Lawboss, Hyundai, John Deere** (Series A era) [15] and DTC/e-commerce brands like Meshki, ONEHOPE, Sijo [7]. Recognizable clients are corroborating evidence that the platform is in real use. They are **not** evidence of the performance figures.\n\n---\n\n## 5. The funding arc — seed → Series A → Series B\n\n### Claim 5.1 — Seed: ~$7–7.5M in 2022, led by Elaia Partners\n\nVibe raised a **seed round of ~$7M (reported as $7.5M elsewhere) in 2022**, led by **Elaia Partners**, and launched its self-serve platform that year [11][18]. *Slight figure variance ($7M vs. $7.5M) across sources — flagged.*\n\n### Claim 5.2 — Series A: $22.5M, February 2024, led by Singular\n\nVibe raised a **$22.5M Series A**, announced **late February / March 2024**, **led by Singular** (the Paris VC founded 2020 by Raffi Kamber and Jérémy Uzan), with participation from **Elaia Partners, Motier Ventures, Sequoia's Scout Fund**, and ad-tech angels (Benjamin Antier, Cyril Vermeulen, Laurent Asscher, Alain Roubach, Very Group) [4][10][18]. At the time, Vibe reported **2,000+ U.S. clients** since its 2022 launch and **\"eight-figure\" / \"tens of millions\" 2023 revenue** [10][15]. The stated target market: **~1 million SMBs with a combined ~$60B in ad budgets** [4].\n\n### Claim 5.3 — Series B: $50M / €42M, late September 2025, led by Hedosophia, at a $410M valuation\n\nVibe raised a **$50M (€42M / ~€42.6M) Series B**, announced **~September 30 / October 1, 2025**, **led by Hedosophia** (an early backer of Spotify, Uber and Airbnb), at a **$410M post-money valuation** [3][9][17]. Participating: **Singular, Elaia, QuantumLight** (Revolut CEO Nik Storonsky's fund), and **Illusian** (Supercell CEO Ilkka Paananen's vehicle) [3][17]. Strategic angels: **Carolyn Everson** (board member of The Walt Disney Company and Coca-Cola), with **Nirav Tolia** (Nextdoor CEO; Hedosophia non-executive chairman) joining the board [3][17].\n\n### Claim 5.4 — Total funding ~$79.5M; profitability targeted by end of 2025\n\nAggregating the rounds, Vibe had raised **~$79.5M total** by the Series B (≈$7M seed + $22.5M Series A + $50M Series B) [8]. Vibe stated it **expected to be profitable by the end of 2025** [14]. *Profitability is a forward statement by the company, not an audited result.*\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: Vibe&#x27;s valuation tripled in nine months<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">500<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">1,000<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">1,500<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">2,000<\/text><rect x=\"188.5\" y=\"202.0\" width=\"56.0\" height=\"48.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"216.5\" y=\"196.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">410M<\/text><text x=\"216.5\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 216.5 268.0)\">Series B post…<\/text><rect x=\"501.5\" y=\"86.2\" width=\"56.0\" height=\"163.8\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"529.5\" y=\"80.2\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">1,400M<\/text><text x=\"529.5\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 529.5 268.0)\">Reported acqu…<\/text><\/svg><figcaption>Series B post-money (Sept 2025) vs. Walmart&#x27;s reported acquisition price (June 2026) — a ~3.4× markup, and ~12.6× the self-reported ~$100M run-rate. <span class=\"credit\">Source: Vibe/Hedosophia Series B; WSJ/Reuters deal reporting (price is press-reported, not Walmart-confirmed).<\/span><\/figcaption><\/figure>\n\n\n\n### Claim 5.5 — Reported revenue: ~$100M run-rate (company) vs. lower trailing actuals (aggregators)\n\nVibe self-reports a **\"$100M revenue run-rate reached in under two years\"** and claims to rank among the \"**top-ten fastest-growing software companies to reach $100M ARR**\" [14][9]. **Two cautions:** (1) a **\"run-rate\"** annualizes a recent period and is not the same as **trailing-twelve-month revenue**; (2) third-party aggregators report materially lower *actual* revenue — GetLatka, for one, lists **~$33.3M revenue with ~142 staff** [19] (an aggregator figure, directional only). The gap between a ~$100M *run-rate* and a ~$33M *trailing* figure is exactly the distinction that matters for the 12.6× multiple in the deal section. **Flag the run-rate as company-defined.**\n\n---\n\n## 6. The exit — Walmart's acquisition (June 23, 2026)\n\n*(Covered in depth in the chapter on the transaction; summarized here for the company's arc.)*\n\n### Claim 6.1 — Walmart agreed to acquire Vibe.co on June 23, 2026; terms officially undisclosed, press-reported at ~$1.4B\n\nWalmart announced on **June 23, 2026** an agreement to acquire Vibe.co [1]. **Walmart did not disclose terms** [1]. The **~$1.4B price is attributed to reporting by the Wall Street Journal and The Information**, with **The Information reporting it includes a ~$180M executive-retention payment** [12]. The deal requires **Hart-Scott-Rodino (HSR) antitrust clearance** and is **expected to close by the end of Walmart's fiscal year 2027** [1].\n\n\n### Claim 6.2 — The price implies ~3.4× the Series B valuation and ~12.6× the run-rate\n\nThe **$1.4B price is ~3.4×** the **$410M** Series B valuation set just **~9 months earlier** (Sept 2025) and roughly **~12.6× the ~$100M run-rate** [12]. The Next Web / WSJ framing sets this against public CTV peer **MNTN trading near ~1× expected revenue** [12] — Walmart paid a strategic premium far above the public comp. *The multiple math depends on the company-defined run-rate; if trailing revenue is nearer $33M, the effective multiple is far higher — a key bear-case input.*\n\n### Claim 6.3 — At acquisition, Walmart describes Vibe as serving 10,000+ SME/mid-market advertisers; the team folds into Walmart Connect\n\nWalmart's release describes Vibe as serving \"**more than 10,000 advertisers** (e-commerce brands, growth-stage businesses, SMBs)\" and says the **broader Vibe team is expected to join Walmart Connect** post-close, both founders included [1][12]. *Note the customer-count drift: 5,000+ brands at Series B (Sept 2025) → 10,000+ advertisers at acquisition (June 2026). The two numbers may count different things (\"brands\" vs. \"advertisers\" vs. \"performance marketers\" — Vibe also cited \"10,000+ performance marketers\" in 2025 [7]). Treat the count as approximate and definition-dependent.*\n\n---\n\n## Open Questions\n\n1. **What is Vibe's actual trailing revenue vs. its ~$100M \"run-rate\"?** The ~3× gap between the company run-rate and aggregator trailing figures (~$33M) is unresolved and load-bearing for the deal multiple. No audited figure is public (private company).\n2. **Is the entry minimum $50/day, $500, or something else?** Sources support $50/day; the occasionally-cited \"$500 minimum\" is unconfirmed. A current screenshot of Vibe's sign-up flow would settle it.\n3. **Does \"Certified Supply\" survive under Walmart, and does Walmart route Vibe demand through Magnite/its own supply?** The Nov 2025 supply model is the most acquisition-relevant plumbing detail and most likely to change.\n4. **What exactly does the ~$180M \"executive-retention\" component cover, and how is the remaining ~$1.22B split (cash vs. equity, founders vs. investors)?** Press reports the total and the retention slice but not the full waterfall.\n5. **What are the real, methodology-disclosed performance numbers?** Every ROAS/lift figure is company/customer self-reported with no control group. Independent measurement (e.g., a third-party incrementality study) does not appear in the public record.\n6. **Which specific SSPs and publishers does Vibe integrate?** AdExchanger reports \"nearly every large SSP\" and \"most major streaming platforms except Netflix/Hulu/YouTube,\" but Vibe declines to name partners.\n7. **Founding date precision:** company \"established summer 2021,\" product \"launched 2022,\" seed \"2022.\" Which date Walmart/Vibe will cite as the founding year is a minor but recurring inconsistency.\n\n---\n\n## Sources\n\n1. Walmart Corporate, \"Walmart to Acquire Vibe.co to Expand Access to Connected TV Advertising,\" corporate.walmart.com, 2026-06-23. https://corporate.walmart.com/news/2026/06/23/walmart-to-acquire-vibe-co-to-expand-access-to-connected-tv-advertising — *Tier 1 (primary, the acquirer's own release; treat performance/biz claims as company statements). Accessed 2026-06-26.*\n2. The Org, \"Arthur Querou — Co-Founder & CEO at Vibe.co\" / \"Franck Tetzlaff — Co-Founder / CTO.\" theorg.com. — *Tier 7 (aggregated org chart); used only to corroborate titles already in Tier 1. Accessed 2026-06-26.*\n3. EU-Startups, \"French AdTech startup Vibe.co raises €42 million…,\" 2025-09. https://www.eu-startups.com/2025/09/french-adtech-startup-vibe-co-raises-e42-million… — *Tier 5 (startup trade press). Accessed 2026-06-26 (via search snippet; page 403'd on direct fetch).*\n4. Maddyness, \"Vibe, adtech lancée par l'ancien CTO de Doctolib et Frichti, lève 22,5 millions de dollars,\" 2024-02-29. https://www.maddyness.com/2024/02/29/vibe-adtech-lancee-par-lancien-cto-de-doctolib-et-frichti-leve-225-millions-de-dollars/ — *Tier 5 (French tech press); primary for founder backgrounds + dual NYC/EU structure + summer-2021 founding. Accessed 2026-06-26.*\n5. Maddyness, \"Vibe, l'adtech de deux Frenchies…boucle une série B de 50 millions de dollars,\" 2025-10-01. https://www.maddyness.com/2025/10/01/… — *Tier 5 (French tech press). Accessed 2026-06-26.*\n6. ContactOut / Crunchbase-type profiles for Franck Tetzlaff (lists Doctolib/MakeMeReach/KMTX/Kobojo). — *Tier 7 (data aggregator); directional only, not for substantive claims. Accessed 2026-06-26.*\n7. Pulse 2.0, \"Vibe.co: Interview With Co-Founder & CEO Arthur Querou…,\" pulse2.com. https://pulse2.com/vibe-co-profile-arthur-querou-interview/ — *Tier 5/6 (founder interview); ALL metrics here are founder/company self-reported. Accessed 2026-06-26.*\n8. PitchBook / search aggregation, Vibe.co company profile (HQ 131 Varick St, NY; ~$79.5M total raised). — *Tier 5/7 (cap-table aggregator). Accessed 2026-06-26.*\n9. Built In NYC, \"Vibe.co Secures $50M to Scale Its AI-Powered Ad Platform,\" 2025-10-01. https://www.builtinnyc.com/articles/vibeco-raises-50m-series-b-20251001 — *Tier 5 (regional tech trade); \"New York-based.\" Accessed 2026-06-26.*\n10. VideoWeek, \"Vibe Raises $22.5 Million to Power Mission to Become Google Ads for Streaming TV,\" 2024-02-29. https://videoweek.com/2024/02/29/vibe-raises-22-5-million… — *Tier 5 (CTV trade press); Series A facts + \"Google Ads of streaming\" + 2022 launch + $7M seed. Accessed 2026-06-26.*\n11. FINSMES / Silicon Valley Journals / StartupHub, Vibe.co Series A coverage (Feb–Mar 2024). https://www.finsmes.com/2024/03/vibe-co-raises-22-5m-in-series-a-funding.html — *Tier 5 (funding trade press). Accessed 2026-06-26.*\n12. The Next Web, \"Walmart buys Vibe.co for $1.4bn to chase Amazon in ads,\" 2026-06. https://thenextweb.com/news/walmart-vibe-co-deal-amazon-ads — *Tier 4/5 (tech press relaying WSJ + The Information); source of the $1.4B / $180M retention / 12.6× multiple figures. Accessed 2026-06-26.*\n13. TVREV, \"Vibe.co's Arthur Querou On Why SMB Self-Serve Is The Next Big Thing,\" tvrev.com. https://www.tvrev.com/news/meet-vibe-ceo-arthur-querou — *Tier 5 (TV/ad trade); product mechanics + $50/day + \"within minutes,\" all founder-attributed. Accessed 2026-06-26.*\n14. Vibe.co Blog, \"Vibe.co Raises $50M Series B, Hits $410M Valuation, $100M ARR in Under 2 Years.\" https://www.vibe.co/blog/whats-new/vibe-co-raises-50m-series-b-hits-410m-valuation-100m-arr-in-under-2-years — *Tier 1 for \"what the company claims\" only (company self-report); 2.5× ROAS, 4× vs traditional TV, 120M households/500+ channels, AI-creative %. Accessed 2026-06-26.*\n15. AdExchanger, \"Vibe.co Secures $22.5 Million In Series A Funding To Help SMBs Try CTV,\" 2024-02. https://www.adexchanger.com/tv/vibe-co-secures-22-5-million-in-series-a-funding-to-help-smbs-try-ctv/ — *Tier 5 (authoritative ad-tech trade); the DSP/SSP plumbing detail + named clients + AppsFlyer/Adjust. Accessed 2026-06-26.*\n16. AdExchanger, \"Why CTV Startup Vibe Is Dropping Resellers In Favor Of 'Certified Supply,'\" 2025-11. https://www.adexchanger.com/tv/why-ctv-startup-vibe-is-dropping-resellers-in-favor-of-certified-supply/ — *Tier 5 (ad-tech trade); Certified Supply, 500-bid-request test, ESPN $3 CPM fraud signal, Philo, Tetzlaff quote. Accessed 2026-06-26.*\n17. GlobeNewswire / Advanced Television / Demand Gen Report, Vibe.co Series B press coverage, 2025-09-30. https://www.demandgenreport.com/industry-news/news-brief/vibe-co-raises-50m-to-bring-ai-powered-advertising-to-ctv/50563/ — *Tier 5 (trade press relaying the company release); Series B cap table + 250% ROAS / 20% lift headline metrics. Accessed 2026-06-26.*\n18. Elaia Partners press release (PDF), \"Vibe.co raises $22.5M to become go-to Streaming TV Ad Platform for SMBs,\" 2024-03. https://www.elaia.com/wp-content/uploads/2024/03/Fundraise-PR-US.pdf — *Tier 1 (investor primary; treat as the firm's statement); confirms Elaia seed lead + Series A participation. Accessed 2026-06-26 (cited from search; not directly fetched).*\n19. GetLatka, \"How Vibe.co hit $33.3M revenue with a 142 person team,\" getlatka.com. https://getlatka.com/companies/vibe.co — *Tier 7 (self-serve SaaS-metrics aggregator); directional only; used solely to flag the run-rate-vs-trailing gap. Accessed 2026-06-26.*\n\n---\n\n*Every Vibe performance metric in these pages is company- or customer-self-reported, and flagged as such. The funding amounts, investors, valuations, founder identities and the deal itself are corroborated across multiple independent sources and primary releases.*"}, {"order": 3, "file": "03_Walmart_Ad_Flywheel.md", "title": "Walmart's Ad Flywheel — Walmart Connect, VIZIO, Magnite, and Where Vibe Fits", "summary": "", "body": "# Walmart's Ad Flywheel: Where Vibe Fits\n\n## Bottom Line\n\nWalmart did not buy Vibe.co (announced June 23, 2026, for ~$1.4B) to enter connected TV. It has been in CTV since it closed the ~$2.3B VIZIO acquisition on December 3, 2024. It bought Vibe to plug the **one hole in an otherwise built advertising machine: a self-serve onramp for the millions of small and mid-sized businesses (SMBs) and third-party marketplace sellers who cannot, and will not, buy TV through an agency or a managed-service desk.** Walmart's ad business — branded **Walmart Connect** (the retail media network that sells ads to brands against Walmart's shopper data; renamed from Walmart Media Group on January 28, 2021) — booked roughly **$6.4 billion in global advertising revenue in fiscal year 2026 (the year ended January 31, 2026), up 46% year over year**, making it the #2 retail media network in the United States behind Amazon. The flywheel is now nearly complete. More shoppers generate more first-party purchase data; that data makes ads better-targeted and, crucially, **closed-loop measurable** (Walmart can prove an ad drove a sale); provable ads pull more ad dollars at ~70%-margin economics; those high-margin dollars subsidize lower retail prices; lower prices pull more shoppers. VIZIO (the SmartCast smart-TV operating system, ~19 million-plus active accounts, automatic content recognition data) supplied the **screen and the measurement signal**; Magnite, Yahoo DSP, and Google DV360 supplied the **programmatic pipes**; Connect Select (launched April 2026) curated the **premium CTV supply**; and Vibe now supplies the **self-serve buying interface for the long tail.** What follows maps that machine, dates every live component, and shows precisely where Vibe slots in. Vibe is the first sizable deal under new CEO John Furner (who succeeded Doug McMillon on February 1, 2026) — less a bet on CTV than the closing of a loop Walmart has been welding shut since 2019.\n\n---\n\n## 1. The Machine in One Page (Exhibit A)\n\nBefore the parts, the whole. Walmart's advertising apparatus, as of June 2026, has five layers:\n\n| Layer | Asset | What it is (decoded) | Acquired / launched | Current status |\n|---|---|---|---|---|\n| **Demand brand** | Walmart Connect | The retail media network — sells ads to brands against Walmart shopper data | Renamed from Walmart Media Group, Jan 28, 2021 | Live; $6.4B global FY26 |\n| **The screen** | VIZIO / SmartCast | Smart-TV operating system + ACR data + CTV ad inventory | Closed Dec 3, 2024 (~$2.3B) | Live as wholly-owned subsidiary |\n| **Premium supply** | Connect Select | Curated CTV marketplace inside Walmart DSP | Launched Apr 27, 2026 | Live |\n| **The pipes** | Magnite (SSP), Yahoo DSP, Google DV360 | Programmatic plumbing — supply-side and demand-side platforms | Magnite/Yahoo live by May 28, 2026 | Live (Yahoo in \"closed proof-of-concept\") |\n| **Self-serve onramp** | **Vibe.co** | Self-serve CTV buying for SMBs / marketplace sellers | Announced Jun 23, 2026; close by end FY27 | Pending close (HSR review) |\n\nThe thesis here: layers 1–4 were already in place by spring 2026. Vibe is layer 5 — and layer 5 is where the **long tail of advertisers** lives, the segment Walmart's managed-service and agency-routed sales motion could not reach.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Walmart&#x27;s advertising flywheel<\/div><div class=\"viz-flow\"><span class=\"flowstep cv-fade\" style=\"--d:0.00s\">More shoppers (~150M+ weekly)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.08s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.16s\">More first-party purchase data<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.24s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.32s\">Better-targeted, closed-loop-measurable ads<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.40s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.48s\">More ad dollars at ~70% margin<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.56s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.64s\">Profit subsidizes lower retail prices<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.72s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.80s\">More shoppers<\/span><\/div><figcaption>Each turn feeds the next; ~70%-margin ad dollars subsidize lower prices, which pull more shoppers and more data. Vibe widens the entry by adding the long-tail advertiser. <span class=\"credit\">Source: Walmart Connect FY26 disclosures; eMarketer.<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## 2. Walmart Connect — The Engine Block\n\n### 2.1 What it is, decoded\n\n**Walmart Connect is a retail media network (RMN).** A retail media network is a retailer's advertising business: the retailer sells ad placements — search results, banners, in-store screens, off-site display, and now CTV — to brands, then targets and measures those ads using its own first-party shopper data (what people actually bought). The pitch to a brand is unique. Not \"people like this saw your ad,\" but \"people who saw your ad then bought your product at Walmart.\" That measurement loop is the whole game.\n\n### 2.2 Origins: from Walmart Media Group to Walmart Connect (Jan 28, 2021)\n\nOn **January 28, 2021**, Walmart announced an expanded vision and a new name for its media business, renaming **Walmart Media Group → Walmart Connect**, with the stated ambition to \"become one of the top ten advertising platforms in the U.S.\". At the rebrand, Walmart cited **150 million weekly U.S. customers**, **nearly 170,000 in-store digital screens across 4,500+ stores**, a planned demand-side platform (DSP) launch for the 2021 holiday season, and a partnership with **The Trade Desk** to build programmatic buying on Walmart's first-party data. Then-Chief Customer Officer Janey Whiteside and Trade Desk CEO Jeff Green were named.\n\nThe rebrand was neither Walmart's first ad-tech move nor its last acquisition. Walmart had already bought ad-tech assets **Polymorph Labs (2019)** and **Thunder (2021)**, then VIZIO (2024), and now Vibe (2026) — a five-year through-line of buying the plumbing it did not want to build.\n\n### 2.3 Scale and growth (FY26, the year ended Jan 31, 2026)\n\nThe numbers — every figure dated to Walmart's fiscal year, which ends January 31:\n\n- **Global advertising revenue: ~$6.4 billion in FY26, up 46% year over year**. This \"global advertising\" line **includes VIZIO.**\n- **Walmart Connect U.S. (the domestic RMN specifically): +41% in Q4 FY26** (the quarter ended J
