 2024 *Behavioral and Brain Sciences* target-article exchange (\"Is core knowledge a natural subdivision of infant cognition?\") shows active skepticism about whether Spelke's core systems are a genuinely \"natural\" carving of infant cognition — whether the processes grouped as \"core\" share coherent biological/mechanical bases while those excluded do not [12]. The article drew on the order of two-dozen commentaries [12]. So the right characterization is this: domain-specificity *substantially eroded* Piaget's domain-general logic, and core knowledge is now the dominant frame — but the precise taxonomy of core systems remains an open scientific argument, and nativism's victory over constructivism in infancy is not total.\n\n---\n\n## 4. Infancy-competence research: earlier than Piaget allowed\n\nThe most damaging empirical wave for the *ages* attached to Piaget's stages came from clever non-verbal, looking-time methods that let infants \"show\" knowledge they could not yet act on or report.\n\n### 4.1 Object permanence months early — Baillargeon\n\nPiaget had timed object permanence — the understanding that an object continues to exist when out of sight — to roughly 8–9 months, late in the sensorimotor period, inferring it from whether infants manually searched for a hidden object. **Renée Baillargeon** showed the problem lay in the manual-search requirement, not the concept. Using the **violation-of-expectation (VOE)** paradigm — infants look longer at events that violate their expectations — she ran the \"drawbridge\" studies, in which a screen rotated like a drawbridge through a 180° arc [13]. After a box was placed behind the screen, infants saw either a *possible* event (screen stops where the box should block it) or an *impossible* event (screen rotates fully through the space the hidden box occupies).\n\nIn Baillargeon (1987), 4.5-month-olds — and the faster-habituating 3.5-month-olds — looked reliably longer at the impossible event, which she interpreted as evidence that the infants represented the *continued existence* of the now-hidden box and registered the physical impossibility of the screen passing through it [13]. Her conclusion was that \"infants have already acquired the concept of object permanence by 3½ months of age,\" directly contradicting Piaget's 8–9-month timetable [13]. Full citation: Baillargeon, R. (1987), *Developmental Psychology* 23(5), 655–664 [13]; the paradigm traces to Baillargeon, Spelke & Wasserman (1985).\n\nThe methodological lesson generalizes. Piaget's *motor* index of knowledge — reaching, searching — under-credited infants because action lags representation. Replace the motor index with a perceptual one (looking) and the competence appears far earlier. (A live caveat the field acknowledges: VOE results show that infants *detect a violation*; whether that licenses attributing the full adult *concept* of a persisting object is itself debated — a recent conceptual overview of the paradigm, Margoni, Surian & Baillargeon 2024 in *Psychological Review*, revisits exactly this inferential gap [14].)\n\n### 4.2 Proto-arithmetic in 5-month-olds — Wynn\n\n**Karen Wynn**'s \"Addition and subtraction by human infants\" (*Nature*, 1992) reported that 5-month-olds compute the outcomes of simple operations on small object sets [15]. In the 1+1 condition an infant watched one doll placed behind a screen, then a second doll added behind it; when the screen dropped to reveal an *impossible* outcome (one doll, or three), infants looked longer than at the *possible* outcome of two [15]. Wynn argued this showed infants possess genuine numerical expectations [15]. The result, like Baillargeon's, drew fire — critics argued infants might track object *features* or *contours* rather than number — and Wynn and McCrink (2004) answered by showing 9-month-olds can add and subtract over sets larger than the object-tracking limit [15]. The number-conservation Piaget timed to ~6–7 years rests atop a numerical competence present in the first year.\n\n**The honest scope.** Infancy-competence research devastated Piaget's *ages* and his *motor-based assessment*, and it supports an early-emerging, partly innate scaffolding that Piaget's blank-slate-constructivism did not predict. It did *not* show that nothing develops. The gap between an infant's looking-time \"expectation\" and a preschooler's deployable, verbalizable concept is real, and it is itself a developmental story. The critiques shifted *when* and *how much is built vs. given*. They did not abolish development.\n\n---\n\n## 5. Task-demand critiques: Piaget under-estimated young children\n\nA parallel attack came from the \"Edinburgh school\" around **Margaret Donaldson** and others, who argued that Piaget's classic tasks were *unfair*: they embedded social and linguistic demands that led children to give \"wrong\" answers for reasons having nothing to do with the concept being probed. The recurring finding: make the task make *human sense* to the child, and the supposed incompetence shrinks or vanishes.\n\n### 5.1 Conservation and \"Naughty Teddy\" — McGarrigle & Donaldson (1974)\n\nIn the standard conservation-of-number task, an adult lays out two equal rows of counters, the child agrees they are equal, the adult then *deliberately* spreads one row out, and asks *the same question again*. Most pre-7-year-olds now say the spread-out row \"has more.\" Piaget read this as the absence of the conservation concept. **McGarrigle & Donaldson** (\"Conservation accidents,\" *Cognition*, 1974) hypothesized that the child reads the adult's *repeated, deliberate* manipulation-plus-re-question as a pragmatic signal that the *answer is supposed to change* [16].\n\nSo they had the transformation performed *accidentally*, by a mischievous glove puppet — \"Naughty Teddy\" — who \"messes up\" one row, after which the child is asked again. The shift was dramatic. In the accidental condition far more children conserved than in the deliberate-adult condition (the widely reported figures are roughly **50 of ~80 children conserving when the change was accidental versus ~13 when it was intentional**, i.e. about 62% vs. 16%) [16]. The conclusion: children younger than 7 *can* conserve. Piaget's task had been measuring their sensitivity to adult conversational implicature, not their grasp of quantity invariance [16].\n\n**The replication picture — and the counter-critique.** Here the discipline of being critical *in both directions* matters most. Light, Buckingham & Robins (*British Journal of Educational Psychology*, 1979) ran a partial replication: overall conservation rates were lower than McGarrigle & Donaldson's, but the *higher success in the accidental condition was confirmed* [17]. The interpretation, though, drew a challenge. Later work (e.g., Moore & Frye, \"The effect of the experimenter's intention on the child's understanding of conservation,\" *Cognition*, 1986) argued the accidental-transformation advantage may itself be partly an *artifact* — when the change is incidental, children may simply attend less to the transformation and default to \"still the same,\" so the \"improvement\" need not reflect competence the standard task missed [18]. The fair summary: the Naughty-Teddy effect is real and replicable, and it establishes that *task pragmatics inflate apparent conservation failure*; but the strong claim that it *fully* explains away conservation development is contested, and the magnitude of the genuine competence revealed is debated.\n\n### 5.2 Egocentrism and perspective-taking — Borke and Hughes (1975)\n\nPiaget & Inhelder's **three-mountains task** (1956) asked children to choose the photograph showing how a doll, seated at a different position, would see a mountain scene. Children under ~7 tended to pick the photo of *their own* view, which Piaget took as evidence of perceptual egocentrism.\n\nTwo 1975 studies showed the limiting factor was the task, not the child:\n\n- **Helene Borke** simplified the materials and instructions and used scenes children could relate to. With the original mountains, 3-year-olds chose correctly only ~42% of the time and 4-year-olds ~67%; with friendlier displays, accuracy jumped to ~80% for 3-year-olds and ~93% for 4-year-olds [19]. The conclusion: complex, unfamiliar task requirements drove the original errors, not an inherent egocentric limit [19].\n- **Martin Hughes**'s **policeman-doll task** placed the child in a concrete hide-the-boy-from-the-policeman game. Children as young as ~3.5 years reliably took another's visual perspective — hiding the doll from one or even two policemen — showing perspective-taking far earlier than the three-mountains task implied [19].\n\n**What this line establishes.** Across conservation and egocentrism, the task-demand critiques converge on one robust conclusion: **Piaget systematically under-estimated young children by over-taxing them** with linguistically and socially confusing tasks. This is now textbook. It does not show the *competence* is adult-complete at 3 — performance still improves with age, and \"friendlier task\" gains are partial — but it decisively relocates a large share of Piaget's documented \"failures\" from the child's mind to the experimenter's design.\n\n---\n\n## 6. The clinical method and the replication record\n\n### 6.1 Methodological critiques of the méthode clinique\n\nPiaget's signature method — the *méthode clinique*, a flexible, semi-structured interview in which the experimenter follows the child's answers with improvised probes — is at once his great methodological innovation and a standing target. The recurring complaints [20]:\n\n- **Subjectivity and experimenter bias.** Because the interviewer improvises and interprets, results are \"interpreted as the researcher sees fit,\" leaving the method open to confirmation bias [20].\n- **Leading questions.** Piaget himself confessed the danger: \"it is so hard not to talk too much when questioning a child… it is so hard not to be suggestive\" [20].\n- **Tiny, non-representative samples — including his own children.** Much of the early sensorimotor theory rests on close observation of his three children (Jacqueline, Lucienne, Laurent); the broader Geneva samples were small and drawn from educated, high-SES families, with race, exact n, and socioeconomic detail often unreported [20]. Generalization to the population — let alone cross-culturally — is shaky on its face.\n- **Dependence on the interviewer's skill.** A clinical-method result is hostage to the rapport and competence of the particular interviewer [20].\n\nThe method's defenders note its compensating strength: it captures the *reasoning behind* a child's answer, not just the answer, and it yields hypotheses that more rigid methods miss. But the upshot for *evidential weight* is clear. Piaget's specific quantitative claims — which age, what proportion — carry low confidence, even where his qualitative observations of *kinds* of reasoning have held up.\n\n### 6.2 The split decision on replication\n\nThe replication record is where the strong and weak Piaget part company most sharply [21, 22]:\n\n- **The sequence survives.** Cross-cultural and longitudinal work broadly confirms that children pass through the stages *in the order Piaget specified* — the ordinal sequence (and the within-stage substage order) \"found support in a great majority of studies\" [22]. Conservation tasks themselves show the order of difficulty Piaget predicted: number before weight before volume [21]. This is the durable core.\n- **The synchrony / *structures d'ensemble* claim fails.** The strong structural prediction — that abilities sharing a logical form emerge *together* because they express one underlying structure — did not survive. As Winstanley (2022) summarizes the evidence base, \"cognitive behaviours indicative of the cognitive structures characteristic of a particular stage of development will emerge at different ages and progress at different rates\" [22]. Horizontal *décalage* (the same operation mastered at different ages for different contents) is pervasive — so pervasive that neo-Piagetians and Winstanley alike treat it not as noise but as *central* to how development actually works [22]. The whole-cloth logical structure is the casualty.\n- **The ages are soft and culturally variable.** Cross-cultural Piagetian research finds the *sequence* roughly universal but the *ages of attainment* highly variable with schooling, culture, and task familiarity. Sedentary vs. nomadic groups, schooled vs. unschooled, differ markedly, especially on concrete- and formal-operational tasks [21, 23].\n- **Formal operations are not universal.** The endpoint claim took the heaviest damage. A large share of adolescents and adults in Western societies do *not* reason formal-operationally except in restricted domains and conditions; commonly cited estimates put it near *45% of American adults* (higher, ~55%, in selected college samples) reaching formal operations, and Dasen's cross-cultural work found only about a third of adolescents in some non-Western settings showing formal-operational reasoning, and only in culturally relevant domains [23]. Piaget himself partly retreated in 1972, arguing that all adults *have the capacity* for formal operations but display it only \"under favorable circumstances\" and in their area of expertise [23] — a significant softening of the universal-endpoint thesis.\n\nThe clean way to state the verdict: **Piaget's ordinal sequence is robust; his structural synchrony is false; his ages are soft; his terminus, formal operations, is not universal.**\n\n---\n\n## 7. The balance sheet: what failed, what survived\n\nBeing decisive *and* fair means writing both columns.\n\n**What did not survive:**\n\n- The strong **logico-mathematical structuralism** — groupings, the INRC group, the lattice/group models as the literal form of children's thought.\n- The **structures d'ensemble** synchrony hypothesis (abilities of a stage emerging together).\n- The **specific ages** as universal milestones.\n- **Formal operations as a universal human endpoint.**\n- The claim that infancy is a near-blank slate from which all structure is constructed via sensorimotor action — early competence and core systems push hard against this.\n- Much of the *quantitative* evidential value of the clinical-method studies, given the method's biases and samples.\n\n**What survived (and is now mainstream, often un-attributed):**\n\n- **Constructivism** — knowledge is actively built by the learner through interaction, neither passively received (empiricism) nor innately pre-given in full (nativism). This is \"presupposed in almost all recent work on learning and development\" [24].\n- The insight that development involves **genuine qualitative reorganization**, not merely the accumulation of more facts or associations [24]. Even Carey's discontinuity-and-bootstrapping account is a descendant of this idea.\n- The **ordinal developmental sequence** and the signature phenomena (object permanence, conservation, perspective-taking) as real, replicable milestones — even with revised ages.\n- The **child-centered, qualitative method** of taking children's *reasoning* (including their systematic errors) seriously as a window on cognition [24].\n- The **agenda-setting** role: nearly every modern program — neo-Piagetian capacity theories, core knowledge, theory-theory, conceptual-change research — defines itself partly *in relation to* Piaget, adopting his questions even while rejecting his answers. Carey's transposition of the history-of-science/childhood parallel is the most direct inheritance [11].\n\nThe neo-Piagetian and information-processing reframing is the model the field actually adopted: keep the stage-like, qualitative, constructive picture, re-ground the engine in working-memory capacity and domain-specific learning, and treat décalage as a feature, not a bug.\n\n---\n\n## 8. The higher-altitude legacy: genetic epistemology as philosophy of science\n\nBeneath the developmental psychology sits Piaget's bolder claim: that genetic epistemology is a *philosophy of knowledge*, and specifically a naturalized theory of how scientific knowledge grows. Here the reception belongs to philosophers more than psychologists, and it is genuinely unsettled.\n\n**Richard Kitchener**'s *Piaget's Theory of Knowledge: Genetic Epistemology and Scientific Reason* (Yale University Press, 1986) is the standard philosophical treatment [25]. Kitchener reads genetic epistemology as a serious attempt at *naturalized epistemology* — grounding the theory of knowledge in the empirical facts of how knowledge actually develops — that, in his framing, \"approaches the naturalist ideal prescribed by Quine's 'naturalized epistemology'\" [25]. The central philosophical move explicates Piaget's notion of *scientific progress* through the theory of **equilibration**: science, like the child, advances by successive re-equilibrations toward more stable, more powerful structures [25]. Kitchener takes Piaget's project as a coherent if ambitious naturalistic philosophy of science, worth engagement rather than dismissal.\n\n**Jonathan Tsou** sharpened the comparison that most interests philosophers of science: **Piaget vs. Kuhn**. In \"Genetic Epistemology and Piaget's Philosophy of Science: Piaget vs. Kuhn on Scientific Progress\" (*Theory & Psychology*, 2006, 16(2): 203–224), Tsou argues that Piaget's equilibration-based, *progressive* picture of scientific change \"highlights weaknesses in Kuhn's 'discontinuous' picture of scientific change,\" touching scientific continuity, scientific realism, and scientific rationality [26]. Where Kuhn's paradigms are incommensurable and revolutions are discontinuous ruptures, Piaget's psychogenesis-history parallel suggests an underlying *continuity and directionality* — a *progress from* prior structures rather than a mere shift between incomparable ones. Tsou's verdict: genetic epistemology supplies resources Kuhn lacks for explaining why science *progresses* and not merely *changes* [26].\n\n**Jeremy Burman**'s reply, \"Piaget No 'Remedy' for Kuhn, But the Two Should Be Read Together\" (*Theory & Psychology*, 2007, 17(5): 721–732), pushes back on treating Piaget as a *fix* for Kuhn [27]. Burman argues the Tsou reading \"overlooks crucial aspects\" — the early shared history between the two thinkers, the *biological* foundation of Piaget's method, and the intended future extension of Piaget's program — and offers \"friendly amendments\" toward a synthetic vision [27]. His distilled formulation is that both Piaget's and Kuhn's epistemological constructivisms are best characterized as evolutionary-developmental *\"progress from,\"* rather than vitalist-teleological *\"progress toward\"* [27]. The two should be read *together*, not one as the remedy for the other.\n\n**The state of the philosophical reception.** Genetic epistemology is no longer a live program in mainstream analytic epistemology. Naturalized epistemology took its own, largely Quinean and cognitive-science, path, and few philosophers today *do* genetic epistemology. But as a historically important model of naturalized, developmental, constructivist, *progress-oriented* epistemology, it retains real interest, and the Piaget-vs-Kuhn debate (Kitchener → Tsou → Burman) keeps it alive at exactly the question philosophers of science most care about: *is scientific change progress, and if so, in what sense?* This is the most durable form of Piaget's grandest ambition — not as accepted doctrine, but as a standing interlocutor.\n\n---\n\n## Open Questions\n\n1. **How much \"concept\" do looking-time methods license?** VOE studies show infants *detect violations*; the inference from a longer look to possession of the full adult concept (of object, of number) is contested and is being actively re-examined (Margoni, Surian & Baillargeon, 2024). How this resolves bears directly on how badly Piaget under-dated competence.\n2. **Is the core-knowledge taxonomy \"natural\"?** The 2024 BBS exchange shows the domain-specific carving of infant cognition into objects/number/agents/etc. is not settled. If core systems are not biologically coherent kinds, the displacement of Piaget's domain-general view is less clean than the textbook story.\n3. **Does the Naughty-Teddy effect reveal competence or merely reduce attention?** The Moore & Frye (1986) line suggests the accidental-transformation advantage may partly be an artifact of reduced attention to the transformation, not recovered conservation competence. The genuine magnitude of under-estimation remains debated.\n4. **What replaces equilibration as the mechanism of qualitative change?** Neo-Piagetians offer capacity growth; Carey offers Quinian bootstrapping; dynamic-systems theorists offer self-organization. No single mechanism has consensus, and \"qualitative change\" risks being a redescription rather than an explanation.\n5. **Is there any defensible sense in which psychogenesis illuminates the history of science?** Carey keeps the parallel; most developmentalists treat it as heuristic at best. Whether the parallelism is a real explanatory bridge (Piaget/Kitchener/Tsou) or a suggestive analogy (Burman's \"read together\") is unresolved.\n6. **How much of cross-cultural age variation is competence vs. schooling/task-familiarity?** The formal-operations data could mean the stage is non-universal *or* that the tasks are culturally loaded — the same task-demand logic that rescued young children could rescue \"non-formal\" adults.\n\n---\n\n## Sources\n\n1. Vygotsky, L. S. (1934/1986). *Thinking and Speech*, Chapter 2: \"The Problem of Speech and Thinking in Piaget's Theory.\" Marxists Internet Archive transcription. https://www.marxists.org/archive/vygotsky/works/words/ch02.htm (accessed 2026-06-13). **Tier 1** (primary text in translation). — Vygotsky's 1934 critique of Piaget on egocentric speech; the social→egocentric→inner sequence; the obstacle experiments.\n2. de Veer, R. van der (2018). \"The final chapter of Vygotsky's *Thinking and Speech*: A reader's guide.\" *Journal of the History of the Behavioral Sciences.* Wiley. https://onlinelibrary.wiley.com/doi/10.1002/jhbs.21893 (accessed 2026-06-13). **Tier 2** (peer-reviewed scholarship). — Scholarly contextualization of Vygotsky's critique and the inner-speech argument. *(Cited from search-result summary; abstract-level only.)*\n3. Piaget, J. (1962). \"Comments on Vygotsky's critical remarks concerning *The Language and Thought of the Child* and *Judgment and Reasoning in the Child*.\" Cambridge, MA: MIT Press. Marxists Internet Archive transcription. https://www.marxists.org/archive/vygotsky/works/comment/piaget.htm (accessed 2026-06-13). **Tier 1** (primary text). — Piaget's late, partial reply: concessions on autism/egocentrism and on egocentric→inner speech (\"complete agreement\"), counter-claims of misunderstanding, definition of cognitive egocentrism.\n4. Multiple secondary syntheses on the modern Piaget–Vygotsky verdict, incl. SimplyPsychology, \"Vygotsky vs. Piaget: A Paradigm Shift\" (https://www.simplypsychology.org/piaget-vs-vygotsky.html) and education-focused syntheses. **Tier 5** (educational secondary syntheses; note these are tertiary teaching sources). — Used only for the *field-level characterization* that the two are now treated as complementary; the underlying primary texts [1, 3] carry the factual weight. (accessed 2026-06-13).\n5. Demetriou, A., et al. / overview entries on \"Neo-Piagetian theories of cognitive development.\" Includes Pascual-Leone's M-space, Case's recycling four-stage model, and the information-processing reframing. https://en.wikipedia.org/wiki/Neo-Piagetian_theories_of_cognitive_development (navigation only) and Arab Psychology / academic.edu overviews. **Tier 5** (encyclopedic/secondary; used for orientation; primary papers [6, 7] preferred for specifics). (accessed 2026-06-13).\n6. Pascual-Leone, J. (1970). \"A mathematical model for the transition rule in Piaget's developmental stages.\" *Acta Psychologica* 32: 301–345; and Pascual-Leone, validation of the mental-capacity (M-space) construct. ScienceDirect record: https://www.sciencedirect.com/science/article/abs/pii/0022096572900513 (accessed 2026-06-13). **Tier 2** (primary peer-reviewed). — Origin of the M-space / mental-power construct and its quantitative validation. *(Cited at abstract/record level; full text not read.)*\n7. Halford, G. S., Wilson, W. H., & Phillips, S. (1998). \"Processing capacity defined by relational complexity: Implications for comparative, developmental, and cognitive psychology.\" *Behavioral and Brain Sciences* 21(6): 803–831. https://www.cambridge.org/core/journals/behavioral-and-brain-sciences/article/processing-capacity-defined-by-relational-complexity-... (accessed 2026-06-13). **Tier 2** (primary peer-reviewed target article). — Relational-complexity theory; the ~quaternary-relation soft limit; capacity-based account of task difficulty.\n8. Fischer, K. W. (1980) and overviews of dynamic skill theory; Jean Piaget Society remembrance of Kurt Fischer (https://piaget.org/remembering-kurt-fischer/) and Lectica (https://lectica.org/about/fischer). **Tier 5/2 mixed** (society memorial + summary of the primary skill-theory program). — Four skill levels; Fischer as the neo-Piagetian who retained Piaget's action-based epistemology; décalage as step-by-step skill-building. (accessed 2026-06-13).\n9. Spelke, E. S. (2007). \"Core knowledge.\" *Developmental Science* 10(1): 89–96. https://onlinelibrary.wiley.com/doi/10.1111/j.1467-7687.2007.00569.x ; and Spelke & Kinzler, \"Core systems in human cognition.\" **Tier 2** (primary peer-reviewed). — The core-systems framework: object, number, agent, place/geometry, social; domain-specific, innate, encapsulated. (accessed 2026-06-13).\n10. Hespos, S. & co. \"Core Knowledge\" summary (Northwestern), and von Hofsten & Spelke (1985). https://cpb-us-e1.wpmucdn.com/sites.northwestern.edu/dist/1/558/files/2016/07/HesposCoreKnowledge-tj0tcw.pdf (accessed 2026-06-13). **Tier 2** (peer-reviewed/scholarly summary). — Properties and domain-specificity of core systems; the agent system's distinct (non-object-mechanical) principles.\n11. Carey, S. (2009). *The Origin of Concepts.* Oxford University Press. Précis: Carey (2011), https://www.harvardlds.org/wp-content/uploads/2018/05/Carey.-2011.-Precis-of-the-origin-of-concepts.pdf (accessed 2026-06-13). **Tier 2** (university-press monograph + author précis). — Core cognition vs. intuitive theories (\"theory theory\"); developmental discontinuities; Quinian bootstrapping; the explicit history-of-science/childhood conceptual-change parallel inherited from Piaget.\n12. Kaicher, C. M., Conti, J. J., Dedhe, A. M., Aulet, L. S., & Cantlon, J. F. (2024). \"Is core knowledge a natural subdivision of infant cognition?\" *Behavioral and Brain Sciences* 47: e133. https://doi.org/10.1017/S0140525X23003229 (accessed 2026-06-13). **Tier 2** (peer-reviewed commentary in BBS target-article format). — Active skepticism that Spelke's core systems are a biologically/mechanically coherent \"natural\" subdivision; shows the displacement of Piaget's domain-general view is itself contested.\n13. Baillargeon, R. (1987). \"Object permanence in 3½- and 4½-month-old infants.\" *Developmental Psychology* 23(5): 655–664. Full text: https://labs.psychology.illinois.edu/ICL/articles.old/baillargeon1987.pdf.pdf (accessed 2026-06-13). **Tier 1/2** (primary research paper, read directly). — Drawbridge VOE study; 4.5-month-olds and fast-habituating 3.5-month-olds look longer at the impossible event; conclusion that object permanence is present by ~3.5 months, contra Piaget's 8–9-month timetable. Original paradigm: Baillargeon, Spelke & Wasserman (1985).\n14. Margoni, F., Surian, L., & Baillargeon, R. (2024). \"The violation-of-expectation paradigm: A conceptual overview.\" *Psychological Review* 131(3): 716–748. https://infantcognition.web.illinois.edu/wp-content/uploads/2024/04/... (accessed 2026-06-13). **Tier 2** (peer-reviewed review). — Conceptual overview of VOE; the inference from looking-time to concept-possession and its limits. *(Referenced for the caveat; not read in full.)*\n15. Wynn, K. (1992). \"Addition and subtraction by human infants.\" *Nature* 358: 749–750. https://www.nature.com/articles/358749a0 ; PubMed https://pubmed.ncbi.nlm.nih.gov/1508269/ ; and Wynn & McCrink (2004) follow-up. **Tier 1/2** (primary research paper). — 5-month-olds compute 1+1 and 2−1 outcomes via VOE; the object-tracking critique and the 2004 large-set reply. (accessed 2026-06-13). *(Cited at abstract/record level.)*\n16. McGarrigle, J., & Donaldson, M. (1974). \"Conservation accidents.\" *Cognition* 3(4): 341–350. https://www.sciencedirect.com/science/article/abs/pii/0010027774900031 (accessed 2026-06-13). **Tier 1/2** (primary research paper). — The \"Naughty Teddy\" study; accidental vs. intentional transformation; ~62% vs. ~16% conservation; task-pragmatics interpretation. *(Cited at abstract/record level; figures triangulated across multiple secondary summaries.)*\n17. Light, P., Buckingham, N., & Robins, A. H. (1979). \"The conservation task as an interactional setting.\" *British Journal of Educational Psychology* 49(3): 304–310. https://bpspsychub.onlinelibrary.wiley.com/doi/abs/10.1111/j.2044-8279.1979.tb02430.x (accessed 2026-06-13). **Tier 2** (peer-reviewed partial replication). — Confirmed the higher success rate in the accidental condition (though lower overall rates than M&D); supports the task-demand reading while complicating the magnitude. *(Cited at abstract level.)*\n18. Moore, C., & Frye, D. (1986). \"The effect of the experimenter's intention on the child's understanding of conservation.\" *Cognition* 22(3): 283–298. https://www.sciencedirect.com/science/article/abs/pii/0010027786900181 (accessed 2026-06-13). **Tier 2** (peer-reviewed). — Argues the accidental-transformation advantage may be partly an attentional artifact; evidence that the strong task-demand interpretation of conservation is itself contested.\n19. Borke, H. (1975). \"Piaget's mountains revisited: Changes in the egocentric landscape.\" *Developmental Psychology* 11(2): 240–243; and Hughes, M. (1975), policeman-doll task (reported in Donaldson, *Children's Minds*, 1978). Summaries: psychlotron.org.uk egocentrism tests PDF (http://psychlotron.org.uk/newResources/cogdev/A2_AQB_cogDev_egocentrismTests.pdf) and StudySmarter. **Tier 1/2 (Borke primary) + Tier 5 (Hughes via secondary)**. — Friendlier perspective-taking tasks show 3–4-year-olds far less \"egocentric\" than the three-mountains task implied; accuracy ~80–93% with relatable displays; policeman-doll success by ~3.5 years. (accessed 2026-06-13).\n20. Critical reviews of Piaget's clinical method (subjectivity, leading questions, own-children/small-sample, interviewer-dependence), incl. \"Piaget's Cognitive Developmental Theory: Critical Review\" (scispace PDF) and method overviews; Piaget's own admission (\"it is so hard not to be suggestive\"). **Tier 2/5 mixed** (peer-reviewed critical reviews + teaching summaries). — Documented methodological weaknesses bearing on the evidential weight of Piaget's quantitative claims. (accessed 2026-06-13).\n21. Dasen, P. R. (2022). \"Culture and cognitive development.\" *Journal of Cross-Cultural Psychology*; and the cross-cultural Piagetian summary literature (Dasen 1972; Greenfield). https://journals.sagepub.com/doi/full/10.1177/00220221221092409 (accessed 2026-06-13). **Tier 2** (peer-reviewed). — Sequence roughly universal; ages and especially formal operations highly culturally variable (e.g., ~1/3 of adolescents in some non-Western settings, only in culturally relevant domains).\n22. Winstanley, M. A. (2022). \"Stages in theory and experiment: Fuzzy-structuralism and Piagetian stages.\" *Integrative Psychological & Behavioral Science* 57(1): 151–173. https://pmc.ncbi.nlm.nih.gov/articles/PMC9832071/ (accessed 2026-06-13). **Tier 2** (peer-reviewed; read directly). — Verdict that qualitative aspects (stage sequence, substage order, structural properties) \"found support in a great majority of studies\" while quantitative aspects (rate, age) vary; the synchrony/*structures d'ensemble* claim largely fails; décalage is integral to development, not noise.\n23. Cross-cultural and adult formal-operations literature: simplypsychology summary of formal-operational research (https://www.simplypsychology.org/formal-operational.html), citing the ~45% (general adults) / ~55% (college) figures and Dasen (1972); Piaget's 1972 revision (capacity vs. performance, \"favorable circumstances\"). **Tier 5 summary citing Tier 2 primaries**; the underlying Dasen and Piaget (1972) sources are Tier 1–2. (accessed 2026-06-13).\n24. Barrouillet, P. (2015). \"Theories of cognitive development: From Piaget to today.\" *Developmental Review* 38: 1–12. https://www.sciencedirect.com/science/article/abs/pii/S0273229715000325 ; and the companion \"Theories of development: In dialog with Jean Piaget.\" **Tier 2** (peer-reviewed synthesis). — The balanced-legacy framing: constructivism and qualitative change as enduring, \"presupposed in almost all recent work,\" with the strong structural theory superseded.\n25. Kitchener, R. F. (1986). *Piaget's Theory of Knowledge: Genetic Epistemology and Scientific Reason.* New Haven: Yale University Press. JSTOR: https://www.jstor.org/stable/j.ctt1xp3sbd (accessed 2026-06-13). **Tier 2** (university-press monograph). — Genetic epistemology as naturalized epistemology (approaching the Quinean ideal); equilibration as the mechanism of scientific progress; the standard philosophical treatment. *(Cited via record + secondary summaries; not read in full.)*\n26. Tsou, J. Y. (2006). \"Genetic epistemology and Piaget's philosophy of science: Piaget vs. Kuhn on scientific progress.\" *Theory & Psychology* 16(2): 203–224. https://journals.sagepub.com/doi/10.1177/0959354306062536 (accessed 2026-06-13; full text 403-blocked, cited via SAGE record + ResearchGate/PhilPapers summaries). **Tier 2** (peer-reviewed). — Piaget's equilibration-based *progressive* view highlights weaknesses in Kuhn's *discontinuous* picture (continuity, realism, rationality); genetic epistemology as resources for explaining scientific *progress*.\n27. Burman, J. T. (2007). \"Piaget no 'remedy' for Kuhn, but the two should be read together.\" *Theory & Psychology* 17(5): 721–732. https://journals.sagepub.com/doi/10.1177/0959354307079306 (accessed 2026-06-13; cited via SAGE record + search summary). **Tier 2** (peer-reviewed reply to Tsou). — Rejects Piaget-as-remedy-for-Kuhn; both are evolutionary-developmental \"progress from,\" not teleological \"progress toward\"; the two should be read together."}, {"order": 7, "file": "Future_Trajectory.md", "title": "Jean Piaget: Future Trajectory", "summary": "", "body": "# Jean Piaget: Future Trajectory\n\n## Bottom Line\n\nThe most likely future for Piaget is the one that has already half-arrived: he remains a **founding ancestor whom everyone cites and almost no one follows**. Through 2035 the developmental empirics he discovered will keep living *inside* other programs — neo-Piagetian capacity theory, core-knowledge nativism, dynamic-systems and conceptual-change research — usually without his name attached, while genetic epistemology as a distinct, card-carrying research program stays dormant. The biographical-revisionist strand of Piaget studies (the Vidal line that recovered the religious, Bergsonian, Christian-socialist young Piaget) is settled and will keep producing careful scholarship, helped by the near-complete digitization of his corpus at Geneva. The genuine swing factor — the thing that could move Piaget from \"curated classic\" to \"live again\" — is whether three converging movements in the wider science (the Extended Evolutionary Synthesis and agential biology; 4E/enactive cognition; predictive-processing accounts that rhyme with assimilation–accommodation and equilibration) decide to claim him as a precursor. That is plausible but not yet probable. The one experiment that would actually *test* his grandest claim — letting historians of science and developmental psychologists characterize the two \"parallel\" series independently and checking for a match — remains, four decades after the García synthesis, unattempted, and probably will stay that way.\n\n## Method\n\nThis forecast is built on the preceding findings rather than on external prediction markets (there are none for academic-legacy questions). Its anchor points are: the settled state of the biographical scholarship (the religion chapter); the \"right about the destination, wrong about the route\" verdict on the developmental theory (the critiques-and-reception chapter); the unresolved, still-debated standing of genetic epistemology as a philosophy of science (the genetic-epistemology chapter); the near-consensus that the formal logic and the phenocopy biology are dead while constructivism survives (the chapter on structuralism, logic, and biology); and the contested, minority claim that 21st-century agential biology is partially vindicating Piaget's organizational intuition. The base rate that disciplines the whole exercise is the career of *foundational-but-superseded* theorists — Freud, Skinner, the early Chomsky, Marx — who almost always persist as canonical reference points and agenda-setters, while a full *program-level revival* of a superseded system is rare. That base rate pins the most weight on continuity and assigns the revival scenarios real but minority probability.\n\n---\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios for the genetic-epistemology program &amp; Piaget studies, through ~2035<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">A · Curated canon (continu…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"405.9\" y=\"8\" width=\"73.7\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"487.6\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">45–60%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">B · Partial revival via ne…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"307.8\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"364.9\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">25–35%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">C · Fade to intellectual h…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"258.6\" y=\"80\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"315.8\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">15–25%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">D · The parallelism is act…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"209.6\" y=\"116\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"266.6\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">5–15%<\/text><\/svg><figcaption>Probability bands are calibrated editorial estimates, not model outputs. Bands overlap because the scenarios are not mutually exclusive at the margins. <span class=\"credit\">Source: Jean Piaget: Future Trajectory, 2026-06-13.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario A — The curated canon (continuity)\n\n**Probability:** 45–60% (the modal future)\n\n**Description.** Piaget stays exactly where he is: the indispensable founding reference of developmental psychology and the figure every new program defines itself against, while none of the live programs *is* Piagetian in the strong sense. The empirical phenomena he discovered — object permanence, conservation, perspective-taking, the qualitative reorganization of thought — remain textbook milestones with revised ages. The explanatory machinery (the *structures d'ensemble*, the groupings and the INRC group, the universal formal-operational endpoint) stays superseded. Genetic epistemology is taught as intellectual history, not practiced. Piaget-studies proper continues as a healthy specialist scholarship (the *Cambridge Companion* tradition, the Fondation Jean Piaget and the Geneva archive, the Jean Piaget Society and its journal), with the Vidal-anchored religious-biographical reading as settled consensus.\n\n**Drivers:** the base rate for superseded-but-foundational theorists; the institutional durability of the Geneva archive and the Jean Piaget Society; the fact that constructivism and qualitative-change are now *presupposed* across the field, which keeps Piaget cited even as it makes him optional; the pedagogical inertia of the four stages.\n\n**Conditions:** no large external movement claims Piaget as a precursor; no decisive new empirical or philosophical result reopens the program.\n\n**Signals to watch:** continued steady citation with declining *primary* engagement; new editions/translations framed as historical recovery rather than live theory; Piaget appearing mainly in literature-review \"ancestor\" paragraphs.\n\n**Time horizon:** already underway; dominant throughout the decade absent a shock.\n\n### Scenario B — Partial revival via new biology, 4E cognition, and predictive processing\n\n**Probability:** 25–35%\n\n**Description.** Piaget is re-read as a prescient precursor by movements that have independently arrived at his intuitions. Three are converging. (1) **Agential / developmental evolutionary biology** — the Extended Evolutionary Synthesis, niche construction, developmental plasticity, the updated Baldwin effect — which Denis Walsh has already argued \"now supports Piaget's organisational evolution concept,\" turning his organism-as-active-agent view from a conceptual impossibility into a live empirical question. (2) **4E / enactive cognition** (embodied, embedded, enactive, extended), whose action-first, organism–environment-coupling picture is close kin to Piaget's \"knowing is acting on the world.\" (3) **Predictive processing / active inference**, whose core loop — prediction, prediction-error, model-update — is a strikingly exact restatement of assimilation, disequilibrium, and accommodation/equilibration. In this future Piaget becomes a *named ancestor* of these programs, his equilibration recognized as an early free-energy-style self-regulation story, and a modest but real *program-level* revival follows that reunites development, evolution, and epistemology.\n\n**Drivers:** the structural rhyme between equilibration and predictive-processing/active-inference; the EES's need for historical legitimacy; the enactivist appetite for non-representational, action-based forebears; the digitized corpus making rediscovery cheap.\n\n**Conditions:** at least one of the three movements explicitly and influentially adopts Piaget (a flagship paper, a major synthesis, a well-cited \"Piaget was right about X\" argument); the adoption survives the obvious objection that the resemblance is loose analogy.\n\n**Signals to watch:** predictive-processing or active-inference papers citing Piaget's equilibration as a precursor (not just in passing); EES/agential-biology work building on Walsh's \"Piaget's Paradox\"; enactivist monographs reclaiming the sensorimotor/constructivist Piaget; new \"neo-Piagetian\" framings inside computational cognitive science.\n\n**Time horizon:** early signals are already visible; a recognizable revival, if it comes, lands in the back half of the decade.\n\n### Scenario C — Fade to intellectual history\n\n**Probability:** 15–25%\n\n**Description.** Piaget continues to recede. The empirics survive but the *name* drops out as core-knowledge nativism, Bayesian/computational developmental science, and dynamic-systems accounts mature into self-sufficient paradigms that no longer need a Piagetian framing. Genetic epistemology becomes a closed chapter in the history of the philosophy of science; the Piaget-vs-Kuhn debate is remembered but not extended. Piaget-studies narrows to a small dedicated archival community. He becomes, in effect, the Wundt of developmental psychology — historically indispensable, practically unread.\n\n**Drivers:** the maturation of rival paradigms into independence; the generational turnover away from theorists trained on Piaget; the field's empirical, computational, neuroscientific drift away from grand developmental theory of any kind.\n\n**Conditions:** none of Scenario B's movements adopt him; computational/nativist programs consolidate without needing a constructivist ancestor.\n\n**Signals to watch:** falling primary citations even in developmental textbooks; the four-stage scaffold dropped from introductory teaching in favor of domain-specific accounts; no new translations or scholarly editions.\n\n**Time horizon:** a slow drift, most visible by the end of the decade.\n\n### Scenario D — The parallelism is actually put to the test (wildcard)\n\n**Probability:** 5–15%\n\n**Description.** Someone finally runs the decisive experiment that has never been done: historians of science with no Piagetian stake characterize the conceptual sequence of some scientific domain *independently*, developmental psychologists with no historical stake characterize the child's sequence *independently*, and the two are checked for the claimed isomorphism. Whatever the result, it would be the first genuine test of genetic epistemology's boldest claim — and would either resurrect the program (a clean match) or close it (a clear mismatch). Low probability, very high information value.\n\n**Drivers:** the methodological maturity of computational history-of-science and large-scale developmental datasets; a researcher motivated to settle the circularity objection.\n\n**Conditions:** a team with credibility in *both* fields, and a domain where both series are tractable.\n\n**Signals to watch:** any pre-registered or computational attempt to characterize a history-of-science conceptual sequence and a psychogenetic sequence independently and compare them.\n\n**Time horizon:** could happen any time; more likely late, if at all.\n\n---\n\n## The religion strand: a sub-forecast\n\nThe religious-biographical reading of Piaget — that genetic epistemology grew, at the level of vocabulary and structure, out of an adolescent attempt to reconcile science and faith — is **settled scholarship and will hold**, because it rests on directly readable primary texts (*Recherche*; the 1928 *immanence/transcendence* essay) now freely available through the Geneva archives, not only on interpretation. Expect: continued steady scholarly interest; possible new work on the *direction of fit* (did the religion generate the equilibrium vocabulary, or did an already-biological vocabulary get applied to the religious problem and then to psychology?), which remains genuinely open; and a real, if modest, chance of the **first full English translation of *Recherche*** within the decade — a plausible, legacy-defining event given the digitization and the durable interest in Piaget's origins. The one thing unlikely to happen is a swing back to Piaget's *own* late self-presentation as a pure naturalist; Vidal's correction is now the baseline.\n\n## Base Rates\n\nThe reference class is *foundational theorists whose specific systems were superseded*. Freud: the metapsychology is dead in scientific psychology, yet \"Freudian\" remains a permanent cultural and clinical reference. Skinner: radical behaviorism collapsed, the experimental analysis of behavior persists in niches, the name is iconic. Early Chomsky: the specific transformational machinery was repeatedly revised, the cognitive-revolution agenda endures. Marx: the predictions failed, the analytic vocabulary is permanent. The pattern is consistent — *continuity as canonical reference (Scenario A) is the overwhelming base-rate outcome; full program revival is rare (tilts against B); total disappearance is also rare for a true founder (tilts against C)*. This is exactly why A carries the most weight, B and C split the remainder, and D sits in the tail.\n\n## Prediction Market Snapshot\n\nNo liquid prediction markets exist on academic-legacy questions of this kind (Polymarket, Kalshi, Metaculus carry nothing on \"will genetic epistemology revive\"). The forecast therefore rests entirely on base rates and the driver analysis above, and its probabilities should be read as calibrated editorial estimates rather than market-disciplined ones.\n\n## What Would Change My Forecast\n\n1. **A flagship predictive-processing or active-inference paper explicitly building on Piagetian equilibration** — would move weight from A to B.\n2. **An influential EES/agential-biology result operationalizing Piaget's organizational evolutionism** (beyond Walsh's conceptual argument) — would strengthen B and partially rehabilitate the one part of the biological grounding now judged dead.\n3. **Any serious attempt at the independent-series test of the parallelism** — would activate Scenario D regardless of outcome.\n4. **A full English translation or major new critical edition of *Recherche*** — would durably strengthen the religion strand and Piaget-studies generally.\n5. **Introductory developmental textbooks dropping the four-stage scaffold** in favor of domain-specific/core-knowledge framing — would be the clearest signal of drift toward C.\n6. **A second neo-Piagetian wave inside computational cognitive science** (capacity/relational-complexity ideas re-emerging in deep-learning-adjacent developmental modeling) — would push toward B.\n\n## Open Questions\n\n1. Will any of the three converging movements (EES, 4E, predictive processing) actually *name* Piaget rather than re-deriving his intuitions unattributed — and does it matter for the program's survival whether they do?\n2. Is the resemblance between equilibration and predictive-processing deep (shared mechanism) or merely structural (shared shape)? The answer determines whether Scenario B is a genuine revival or another loose analogy of the kind that sank the Bourbaki parallel.\n3. Does the religion-strand's *direction-of-fit* question ever get resolved, or does it remain permanently underdetermined by the documents?\n\n## Sources\n\nThe forward-looking judgments here rest principally on:\n\n1. Walsh, Denis M. \"Piaget's Paradox: Adaptation, Evolution, and Agency.\" *Human Development* 67(5–6):273–287 (2023). — The agential-biology rehabilitation thesis underpinning Scenario B.\n2. Tsou (2006) and Burman (2007), *Theory & Psychology*. — The live Piaget-vs-Kuhn debate that keeps genetic epistemology philosophically active.\n3. Barrouillet, P. \"Theories of cognitive development: From Piaget to today.\" *Developmental Review* 38:1–12 (2015). — The \"constructivism and qualitative change endure, the strong structural theory is superseded\" framing anchoring Scenario A.\n4. Carey, S. *The Origin of Concepts* (2009). — Evidence that the history-of-science/childhood parallel survives *inside* a non-Piagetian program, relevant to both A and D.\n5. Vidal, F. *Piaget Before Piaget* (Harvard, 1994), and the digitized primary corpus (Fondation Jean Piaget; UNIGE Piaget archive). — The settled biographical scholarship underpinning the religion sub-forecast."}], "glossary": [{"term": "A-not-B error", "aliases": ["stage IV error"], "def": "A famous mistake babies make around eight to twelve months old: after watching a toy get hidden in a new spot, they still reach for the old hiding place, suggesting the object's existence is still tied to their own past action rather than to where it actually is."}, {"term": "accommodation", "aliases": [], "def": "The mental adjustment that happens when the world does not fit the patterns a mind already has, forcing those patterns to change or split to match the new information."}, {"term": "adaptation", "aliases": [], "def": "The ongoing balancing act between taking in new experience on one's own terms and adjusting one's mental patterns to fit reality, which together let a mind (or organism) function well in its environment."}, {"term": "assimilation", "aliases": [], "def": "The mental act of absorbing something new by fitting it into patterns of thought or action a person already has, the way a baby who knows how to grasp will apply that same grasping pattern to any new object."}, {"term": "Bourbaki mother-structures", "aliases": ["mother-structures", "structures-mères"], "def": "Three basic organizing patterns — group-like, order-like, and shape/space-like structures — that a mid-20th-century circle of mathematicians proposed as the deep foundation of all mathematics, which Piaget controversially claimed could also be found in simple form in how children's minds organize logic, sequence, and space."}, {"term": "circular reaction", "aliases": ["primary circular reaction", "secondary circular reaction", "tertiary circular reaction"], "def": "An infant's habit of repeating an action just because the result was interesting, starting with actions centered on the infant's own body, then extending to objects in the world, and finally to deliberately varying the action to see what happens."}, {"term": "class-inclusion", "aliases": [], "def": "The logical understanding that a smaller category is always contained within, and so can never outnumber, the larger category it belongs to — for example, knowing there must be at least as many wooden beads as brown ones if all the brown beads are wooden."}, {"term": "clinical method", "aliases": ["méthode clinique", "clinical-critical method", "méthode clinique-critique"], "def": "A flexible, conversational style of questioning children that follows their reasoning wherever it leads, probing their justifications with follow-up questions and counter-suggestions rather than scoring fixed right-or-wrong answers on a standard test."}, {"term": "concrete operational stage", "aliases": ["concrete operations"], "def": "The stage of childhood thinking, roughly ages seven to eleven, in which children gain the ability to reason logically and reverse mental operations, but only about real or easily imaginable things rather than pure hypotheticals."}, {"term": "conservation", "aliases": ["conservation of number", "conservation of liquid", "conservation of mass"], "def": "The understanding that a quantity of something stays the same even when its shape or arrangement changes, as long as nothing has been added or taken away — for instance, knowing that water poured into a taller, thinner glass is still the same amount."}, {"term": "constructivism", "aliases": ["genetic structuralism", "constructivist structuralism"], "def": "The view that knowledge is neither copied directly from the world nor built into the mind from birth, but is actively built up over time through a person's own actions and interactions with their environment."}, {"term": "core knowledge", "aliases": ["core systems", "core cognition"], "def": "A theory holding that infants are born with a handful of specialized, largely automatic mental systems — for tracking objects, rough quantities, and living agents, among others — rather than a single general-purpose logic that develops from scratch."}, {"term": "décalage", "aliases": ["horizontal décalage", "vertical décalage"], "def": "Piaget's term for the puzzling time-lag by which supposedly related mental abilities do not actually appear at the same time — for example, children grasp that the amount of a substance stays constant years before they grasp the same idea for volume."}, {"term": "disequilibrium", "aliases": ["déséquilibre"], "def": "A felt gap or contradiction that arises when a person's current way of thinking cannot handle a new experience, creating an inner tension the mind is driven to resolve."}, {"term": "egocentrism", "aliases": [], "def": "In Piaget's technical sense, not selfishness but a young child's inability to recognize that other people might see, know, or feel something different from what the child itself sees, knows, or feels."}, {"term": "equilibration", "aliases": ["équilibration majorante"], "def": "The self-driven process by which a mind resolves the friction between what it expects and what it encounters, building a more powerful and stable way of thinking as a result — Piaget's proposed engine of all mental growth."}, {"term": "formal operational stage", "aliases": ["formal operations"], "def": "The final stage in Piaget's scheme, beginning around age eleven or twelve, marked by the ability to reason about hypothetical possibilities, form and test systematic hypotheses, and think about thinking itself, rather than being limited to concrete, real-world situations."}, {"term": "functional invariants", "aliases": ["organization and adaptation"], "def": "The two basic mental processes Piaget believed operate the same way at every age and stage of life: organizing knowledge into coordinated wholes, and adapting that knowledge to fit the world."}, {"term": "genetic epistemology", "aliases": [], "def": "Piaget's larger theory of how knowledge itself grows and develops, using both the study of children's minds and the history of science as parallel windows onto the same underlying process — not, despite the name, anything to do with genes or heredity."}, {"term": "genetic fallacy", "aliases": [], "def": "The logical error of confusing an explanation of how a belief came to be held with a justification for why that belief is true."}, {"term": "groupement", "aliases": ["grouping"], "def": "Piaget's term for the loosely logical mental structure he believed underlies a school-age child's reasoning about categories and order, resembling but not fully matching the strict mathematical structures called groups and lattices."}, {"term": "immanence", "aliases": ["immanentism", "immanentist theology"], "def": "In the theological sense used here, the idea that the divine or sacred is found within the natural, developing process of life and reason itself, rather than existing as a separate, external, supernatural authority."}, {"term": "INRC group", "aliases": ["INRC"], "def": "A four-part mathematical structure Piaget proposed as the summit of adolescent reasoning, in which a thinker can coordinate four related transformations of an idea (its identity, its opposite, its reciprocal, and the reciprocal's opposite) all at once — a capacity he saw as the hallmark of truly mature, scientific-style thought."}, {"term": "intra-inter-trans triad", "aliases": ["intra-object phase", "inter-object phase", "trans-object phase"], "def": "A three-step pattern Piaget and a collaborator proposed for how understanding deepens in both children and the history of science: first studying things one at a time, then discovering how they relate to and transform into one another, and finally organizing those relationships into one unified system."}, {"term": "logic of meanings", "aliases": ["logique des significations"], "def": "A different, looser kind of logic Piaget proposed late in his life, based on meaningful connections between ideas rather than strict rules about which statements can be logically derived from others — an attempt to fix flaws in his earlier, more rigid logical models."}, {"term": "nativism", "aliases": ["apriorism"], "def": "The view, opposed by Piaget, that the basic mental structures needed for knowledge are already built into the mind at birth and simply mature or switch on over time, rather than being built up through experience."}, {"term": "object permanence", "aliases": [], "def": "The understanding that an object continues to exist even when it can no longer be seen, heard, or touched — something Piaget believed infants have to construct gradually rather than being born with."}, {"term": "operation", "aliases": [], "def": "In Piaget's vocabulary, a mental action that a person can carry out purely in their head and then mentally reverse or undo, distinguishing genuinely logical thought from mere physical action or simple representation."}, {"term": "parallelism thesis", "aliases": ["psychogenesis-history of science parallelism"], "def": "Piaget's boldest and most disputed claim: that the way a child's understanding of a concept develops follows the same underlying pattern as the way that same concept developed historically across the whole of science."}, {"term": "phenocopy", "aliases": [], "def": "A biological theory Piaget proposed late in his career suggesting that a trait an organism first develops in response to its environment can later become genetically inherited through the organism's own regulatory activity — a middle path between standard evolution and discredited Lamarckism that most biologists judge does not actually exist."}, {"term": "preoperational stage", "aliases": ["preoperational"], "def": "The stage of early childhood, roughly ages two to seven, in which children can use symbols like words and pretend play but cannot yet perform logical mental operations such as mentally reversing an action."}, {"term": "psychogenesis", "aliases": [], "def": "The development of knowledge and mental structures within a single growing individual, as opposed to their development across the history of science."}, {"term": "recapitulationism", "aliases": ["ontogeny recapitulates phylogeny"], "def": "A once-popular and now discredited nineteenth-century idea that an individual's development literally replays, in compressed form, the evolutionary history of its species — a doctrine Piaget spent years working to distance his own theory from."}, {"term": "reciprocity", "aliases": [], "def": "A form of logical reversibility in which one mentally undoes a change not by canceling it outright but by applying a matching, complementary change in the opposite direction — for instance, recognizing that if A is longer than B, then B is shorter than A."}, {"term": "reflective abstraction", "aliases": ["abstraction réfléchissante"], "def": "A special kind of learning, in Piaget's theory, that comes not from observing properties of objects but from noticing patterns in one's own actions and mental operations — the process by which basic knowledge, such as the concept of number, is thought to be built up rather than simply observed."}, {"term": "reversibility", "aliases": [], "def": "The mental ability to run an action backward in one's head and recognize that doing so returns things to how they started, which Piaget considered the single most important marker of mature thought."}, {"term": "scheme", "aliases": ["schème", "schéma"], "def": "A repeatable, reusable pattern of action or thought, such as a baby's grasping pattern or an older child's counting pattern, that can be applied across many different situations."}, {"term": "seriation", "aliases": [], "def": "The ability to arrange a set of items in systematic order, such as lining up sticks from shortest to longest, while holding in mind that each item is both larger than the one before it and smaller than the one after it."}, {"term": "structuralism", "aliases": ["structuralist"], "def": "A broad intellectual approach, influential across several fields in the twentieth century, that explains things by the systems of relationships and transformations that organize them rather than by their individual parts in isolation; Piaget's own version insisted that such structures are actively built over time rather than fixed and unchanging."}, {"term": "structure d'ensemble", "aliases": ["structures d'ensemble", "structured whole"], "def": "Piaget's claim that all the mental abilities belonging to a given stage of development click into place together as a single unified system, rather than arriving separately — the theory's most ambitious claim, and the one that held up worst against later evidence."}, {"term": "tertium quid", "aliases": [], "def": "A Latin phrase meaning \"a third thing,\" used here for Piaget's constructivism as an alternative that rejects both of the two standard explanations of where knowledge comes from — the world simply impressing itself on the mind, or the mind being pre-loaded with knowledge from birth."}, {"term": "three-mountains task", "aliases": [], "def": "A classic experiment in which a child views a model of three mountains and is asked to identify what someone sitting on the opposite side would see, used by Piaget to test whether young children can mentally step outside their own point of view."}, {"term": "transcendence", "aliases": ["transcendent"], "def": "In the theological sense used here, the idea that God or the sacred exists as a separate, supernatural power outside and above the natural world, imposing authority on it from without."}, {"term": "transformed Kant", "aliases": ["neo-Kantianism", "genetic Kantianism"], "def": "A description of Piaget's philosophical position as a modified version of the philosopher Immanuel Kant's ideas: Piaget agreed that the mind brings its own organizing categories (like space, time, and causality) to experience, but argued those categories are gradually built up through development rather than fixed in the mind from the start."}, {"term": "violation-of-expectation paradigm", "aliases": ["VOE"], "def": "A research technique for studying what babies understand before they can talk or reach reliably: infants are shown events that are either physically possible or impossible, and researchers infer what the infants expect by measuring how much longer they stare at the impossible ones."}, {"term": "zone of proximal development", "aliases": ["ZPD"], "def": "A concept from the psychologist Lev Vygotsky describing the gap between what a child can do alone and what the same child can do with help from a more skilled partner, treated as the sweet spot where learning happens."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);

function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);

}

// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)

    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }

    }

  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {

      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
