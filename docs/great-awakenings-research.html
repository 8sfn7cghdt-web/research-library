\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"78\" y=\"154\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Democratization<\/text>\n<text x=\"78\" y=\"169\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">Hatch<\/text>\n<text x=\"316\" y=\"158\" font-size=\"13\" class=\"t-muted\">&#8594;<\/text>\n<rect x=\"338\" y=\"136\" width=\"314\" height=\"42\" rx=\"2\" class=\"f-panel s-t4\" stroke-width=\"1\"/>\n<rect x=\"338\" y=\"136\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"354\" y=\"153\" font-size=\"10\" class=\"t-serif\" font-weight=\"bold\">Market revolution + style +<\/text>\n<text x=\"354\" y=\"166\" font-size=\"10\" class=\"t-serif\" font-weight=\"bold\">institutionalization<\/text>\n<text x=\"354\" y=\"176\" font-size=\"8\" class=\"t-muted\">Claim 4.16<\/text>\n<\/g>\n<g class=\"cv-grow-right\" style=\"--d:.2s\">\n<text x=\"16\" y=\"205\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">CONTINUITY<\/text>\n<text x=\"16\" y=\"215\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">OR<\/text>\n<text x=\"16\" y=\"225\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">RUPTURE?<\/text>\n<rect x=\"62\" y=\"194\" width=\"224\" height=\"42\" rx=\"2\" class=\"f-panel s-t3\" stroke-width=\"1\"/>\n<rect x=\"62\" y=\"194\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"78\" y=\"211\" font-size=\"10\" class=\"t-serif\" font-weight=\"bold\">Calvinist Edwards vs<\/text>\n<text x=\"78\" y=\"224\" font-size=\"10\" class=\"t-serif\" font-weight=\"bold\">Arminian Finney<\/text>\n<text x=\"316\" y=\"216\" font-size=\"13\" class=\"t-muted\">&#8594;<\/text>\n<rect x=\"338\" y=\"194\" width=\"314\" height=\"42\" rx=\"2\" class=\"f-panel s-t4\" stroke-width=\"1\"/>\n<rect x=\"338\" y=\"194\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"354\" y=\"212\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">A gradient through the New Divinity<\/text>\n<text x=\"354\" y=\"227\" font-size=\"8\" class=\"t-muted\">Claim 4.17<\/text>\n<\/g>\n<g class=\"cv-grow-right\" style=\"--d:.28s\">\n<text x=\"16\" y=\"263\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">THE<\/text>\n<text x=\"16\" y=\"273\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">REVOLUTION?<\/text>\n<rect x=\"62\" y=\"252\" width=\"224\" height=\"42\" rx=\"2\" class=\"f-panel s-t3\" stroke-width=\"1\"/>\n<rect x=\"62\" y=\"252\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"78\" y=\"269\" font-size=\"10\" class=\"t-serif\" font-weight=\"bold\">Evangelical Calvinism<\/text>\n<text x=\"78\" y=\"282\" font-size=\"10\" class=\"t-serif\" font-weight=\"bold\">caused it<\/text>\n<text x=\"78\" y=\"291\" font-size=\"8\" class=\"t-muted\" font-style=\"italic\">Heimert<\/text>\n<text x=\"316\" y=\"274\" font-size=\"13\" class=\"t-muted\">&#8594;<\/text>\n<rect x=\"338\" y=\"252\" width=\"314\" height=\"42\" rx=\"2\" class=\"f-panel s-t4\" stroke-width=\"1\"/>\n<rect x=\"338\" y=\"252\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"354\" y=\"270\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">One tributary, not the cause<\/text>\n<text x=\"354\" y=\"285\" font-size=\"8\" class=\"t-muted\">Claim 4.19<\/text>\n<\/g>\n<g class=\"cv-grow-right\" style=\"--d:.36s\">\n<text x=\"16\" y=\"327\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">RACE<\/text>\n<rect x=\"62\" y=\"310\" width=\"224\" height=\"42\" rx=\"2\" class=\"f-panel s-t3\" stroke-width=\"1\"/>\n<rect x=\"62\" y=\"310\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"78\" y=\"328\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Liberation OR slavery?<\/text>\n<text x=\"78\" y=\"343\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">the either/or<\/text>\n<text x=\"316\" y=\"332\" font-size=\"13\" class=\"t-muted\">&#8594;<\/text>\n<rect x=\"338\" y=\"310\" width=\"314\" height=\"42\" rx=\"2\" class=\"f-panel s-t4\" stroke-width=\"1\"/>\n<rect x=\"338\" y=\"310\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"354\" y=\"328\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Both, documented<\/text>\n<text x=\"354\" y=\"343\" font-size=\"8\" class=\"t-muted\">Claims 4.20&#8211;4.21<\/text>\n<\/g>\n<g class=\"cv-grow-right\" style=\"--d:.44s\">\n<text x=\"16\" y=\"385\" font-size=\"7.5\" font-weight=\"bold\" letter-spacing=\"0.3\">GENDER<\/text>\n<rect x=\"62\" y=\"368\" width=\"224\" height=\"42\" rx=\"2\" class=\"f-panel s-t3\" stroke-width=\"1\"/>\n<rect x=\"62\" y=\"368\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"78\" y=\"386\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Feminization as decline<\/text>\n<text x=\"78\" y=\"401\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">the declension thesis<\/text>\n<text x=\"316\" y=\"390\" font-size=\"13\" class=\"t-muted\">&#8594;<\/text>\n<rect x=\"338\" y=\"368\" width=\"314\" height=\"42\" rx=\"2\" class=\"f-panel s-t4\" stroke-width=\"1\"/>\n<rect x=\"338\" y=\"368\" width=\"4.5\" height=\"42\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"354\" y=\"386\" font-size=\"11\" class=\"t-serif\" font-weight=\"bold\">Women were always the majority<\/text>\n<text x=\"354\" y=\"401\" font-size=\"8\" class=\"t-muted\">Claim 4.22<\/text>\n<\/g>\n<line x1=\"48\" y1=\"424\" x2=\"652\" y2=\"424\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"350\" y=\"442\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">The bold thesis (slate) and the chastened verdict (field green) &#8212; six times the both/and, not fence-sitting.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> Across all six historiographical debates the strong claim proves only half-true and the mature verdict is a layered <em>both/and<\/em> &#8212; revivals were real yet the label was built, democratization mattered yet so did market and institution, race meant liberation <em>and<\/em> slavery at once. This is the field&#8217;s recurring lesson, the disciplined refusal of the either/or rather than mere fence-sitting (Claim 4.23).<\/figcaption>\n<\/figure>\n\n\nRead together, the six debates are not six separate controversies but variations on a single methodological problem that has defined the field since 1982: **how much coherence the evidence licenses us to impose.** Butler's intervention was, at bottom, a warning against imposing more unity than the sources support — a \"Great Awakening\" tidier than the patchy revivals, a single revolutionary cause tidier than the tangle of mentalities, a national \"democratization\" tidier than the regional and denominational welter, a clean Edwards-to-Finney rupture tidier than the New Divinity gradient, a single verdict on race tidier than the doubleness, a \"feminization\" decline tidier than the constant female majority. In every debate, the same corrective has done its work: the field has moved *away from* the grand unified thesis and *toward* a more granular, qualified, multi-causal, regionally and denominationally specific picture.\n\nThree observations follow from seeing the debates as one.\n\nFirst, **the recurring villain is the declension-and-awakening narrative** — the inherited Protestant template (decline → revival → decline) that structured the older scholarship and that Butler (on the social plane), the Hatch-critics (on the institutional plane), the continuity camp (on the theological plane), and Braude (on the gender plane) have each independently attacked. The field's maturation has substantially consisted of dismantling that template wherever it appears.\n\nSecond, **the corrective has a cost the field is now reckoning with.** Granularity can become an excuse for refusing to generalize at all — a \"nothing-but-local-variation\" minimalism that abandons the synthetic ambition that made the Awakenings worth studying in the first place. The defenders (Kidd's \"long Great Awakening,\" Noll's transatlantic evangelicalism) represent a counter-correction: a chastened return to synthesis that grants Butler's point about the *label* while insisting that real, connected, productive things happened and deserve a unified account. The live frontier of the field is the negotiation between these two impulses — the skeptical-granular and the synthetic-chastened.\n\nThird, **the debates resolve in the same direction methodologically.** In each case the strong thesis (interpretive fiction; democratization; rupture; Heimert's causal claim; a single racial or gender verdict) turns out to be *half right* — pointing at something real while overstating it — and the mature position is a layered both/and rather than a victory for one camp. This is not fence-sitting; it is what the evidence actually supports. An account that forced each debate to a single winner would be falsifying the state of the field, which is precisely a state of productive, evidence-disciplined disagreement.\n\n---\n\n## Open Questions\n\nThese are the points where the evidence does not yet settle the matter, and where future work should concentrate.\n\n1. **Can the \"did it exist?\" debate be moved from interpretation toward measurement?** Lambert's \"invention\" thesis is partly an empirical claim about the timing and density of awakening-rhetoric in eighteenth-century print. Systematic computational analysis of the colonial newspaper and pamphlet record could in principle test whether contemporaries perceived a connected movement in the 1740s (as Lambert says) or only later — turning an interpretive dispute partly factual [7][51].\n\n2. **How much *institutional* power did the laity actually gain?** The popularization-vs-democratization critique hinges on a checkable institutional question — lay control of property, governance, clerical appointment, discipline — that has been argued more than measured across denominations and regions. A systematic comparative study of polity and lay power c. 1780–1840 could adjudicate Hatch vs. his critics [24][25].\n\n3. **Is Heimert's connection causal or merely correlative?** No one has fully solved the methodological problem Morgan raised: how to demonstrate, rather than illustrate, that evangelical mentalities *caused* (rather than accompanied or amplified) revolutionary mobilization [31][32]. The question may be intrinsically underdetermined by the evidence.\n\n4. **What exactly was the mechanism of Southern accommodation?** Heyrman's \"the South changed Evangelicalism\" is a powerful thesis, but the precise sequence and causes by which radical itinerant evangelicalism became proslavery and patriarchal — how fast, in which denominations, with how much internal resistance — remains partly open [39].\n\n5. **How temporary, and how consequential, was the female-preaching opening?** Brekus recovered the women preachers of 1740–1845; the question of why the space closed, how much real authority it represented at its height, and what its later erasure cost the historiography is still being worked out [49].\n\n6. **Does the transatlantic frame dissolve or merely contextualize the American story?** If the revivals are one front of a transatlantic movement, how much explanatory weight should specifically American conditions (disestablishment, frontier, the market revolution) still carry? Carwardine's Britain-vs-America contrast suggests American conditions were decisive *for the form* revivalism took, but the balance between transatlantic commonality and American specificity is unsettled [29].\n\n---\n\n## Sources\n\n**Tier 2 — Scholarly monographs and journal articles (the primary literature of the debate):**\n\n1. Jon Butler, \"Enthusiasm Described and Decried: The Great Awakening as Interpretative Fiction,\" *Journal of American History* 69, no. 2 (September 1982): 305–325. The foundational skeptical intervention. Accessed via Oxford Academic abstract and historiographical surveys, 2026-06-19. https://academic.oup.co on the reciprocal-conversion, Black-preacher, and African-resonance arguments. Accessed 2026-06-19. https://uncpress.org/9780807846810/come-shouting-to-zion/ ; http://jsr.fsu.edu/sens.htm\n39. Christine Leigh Heyrman, *Southern Cross: The Beginnings of the Bible Belt* (Knopf, 1997; Bancroft Prize 1998); review records on the \"South changed Evangelicalism more than Evangelicalism changed the South\" thesis and the accommodation to patriarchy/slavery. Accessed 2026-06-19. https://www.amazon.com/Southern-Cross-Beginnings-Bible-Belt/dp/080784716X\n40. American Religious Experience (WVU) review of *Southern Cross* (Bunn) corroborating the accommodation argument and the abandonment of radical features. Tier 5 academic review. Accessed 2026-06-19. http://are.as.wvu.edu/bunn.htm\n41. \"Reconsidering George Whitefield at 300,\" *Commonplace* (Kyle Roberts), citing Thomas Kidd and Jessica Parr on Whitefield's Georgia slavery advocacy, Bethesda Orphan House, paternalist theology, and the postmortem appropriation by both proslavery and antislavery evangelicals. See source 14. Accessed 2026-06-19. https://commonplace.online/article/reconsidering-george-whitefield-at-300/\n42. Mark A. Noll, *The Civil War as a Theological Crisis* (University of North Carolina Press, 2006); UNC Press, H-Net (Wallace), and review records on the proslavery literalist exegesis vs. antislavery \"broader sweep\" argument and the unresolved hermeneutical crisis. Accessed 2026-06-19. https://uncpress.org/9781469621814/the-civil-war-as-a-theological-crisis/\n43. Barbara Welter, \"The Cult of True Womanhood: 1820–1860,\" *American Quarterly* 18, no. 2 (1966): 151–174; full text (HKU) and Semantic Scholar record. Tier 2. Accessed 2026-06-19. https://english.hku.hk/staff/kjohnson/PDF/WelterBarbaraCULTWOMANHOODinAQ1966.pdf\n44. Barbara Welter, \"The Feminization of American Religion, 1800–1860\" (in *Clio's Consciousness Raised*, 1974) — the feminization thesis and the \"sisterhood\"/organizational-experience argument. Wellcome Collection and NYRB (Willie Lee Rose) records. Accessed 2026-06-19. https://wellcomecollection.org/works/atgxjxn2 ; https://www.nybooks.com/articles/1977/09/15/the-emergence-of-american-women/\n45. Ann Douglas, *The Feminization of American Culture* (Knopf, 1977); Goodreads/Scribd records on the disenfranchised-women-and-clergy alliance and the critical, declension-tinged framing. Accessed 2026-06-19. https://www.goodreads.com/en/book/show/109333\n46. *Signs: Journal of Women in Culture and Society* review of Douglas, *The Feminization of American Culture*. Tier 2 journal review. Accessed 2026-06-19. https://www.journals.uchicago.edu/doi/10.1086/493667\n47. Ann Braude, \"Women's History Is American Religious History\" (in *Retelling U.S. Religious History*, ed. Thomas Tweed, University of California Press, 1997) — the critique of the declension framing and the \"women have always been the majority\" inversion. Accessed via taylorfrancis chapter record and American-Religion.org retrospective. Tier 2 essay. Accessed 2026-06-19. https://www.taylorfrancis.com/chapters/mono/10.4324/9780203426999-14/ann-braude-david-hackett\n48. \"Women's History Is Still American Religious History,\" *American Religion* journal retrospective on Braude's essay. Tier 5 scholarly journal. Accessed 2026-06-19. https://www.american-religion.org/retelling/womenshistory\n49. Catherine A. Brekus, *Strangers and Pilgrims: Female Preaching in America, 1740–1845* (University of North Carolina Press, 1998); UNC Press, H-Net (Ford), and *Journal of Southern Religion* (Savage) records on the ~123 women preachers and the \"too radical / too conservative\" double-erasure argument. Accessed 2026-06-19. https://uncpress.org/9780807847459/strangers-and-pilgrims/ ; https://networks.h-net.org/node/950/reviews/1060/ford-brekus-strangers-and-pilgrims-female-preaching-america-1740-1845\n50. *Journal of Southern Religion* review of Brekus (Carletta Savage) corroborating the argument. Accessed 2026-06-19. https://jsr.fsu.edu/brekus.htm\n51. Lisa Smith, *The First Great Awakening in Colonial American Newspapers: A Shifting Story* (Lexington, 2012); Project MUSE review — example of the digital/print-quantitative turn bearing on the Lambert \"invention\" question. Accessed 2026-06-19. https://muse.jhu.edu/article/579846\n\n**Sourcing note.** The claims here are overwhelmingly about *what historians have argued*, for which the appropriate primary sources are the monographs and journal articles themselves. Where the monograph was not read in full, the claim rests on Tier 2 review literature (journal reviews, H-Net, the Goff historiographical survey) or on authoritative Tier 5 scholarly summaries (the *Junto* and *Way of Improvement* academic blogs, *Commonplace*), each flagged above. No proslavery primary polemic is reproduced; the proslavery argument is described and cited through the scholarship (Noll, Heyrman). Several pivotal contemporary reviews (Morgan 1967; Mead 1968) are cited through Goff's survey rather than read in the original and are noted as such."}, {"order": 5, "file": "05_Adjacent_And_Comparative.md", "title": "Adjacent and Comparative Context: The American Awakenings from Outside", "summary": "", "body": "# Adjacent and Comparative Context — The American Awakenings from Outside\n\n## Bottom Line\n\nThe American Great Awakenings look most distinctive from inside a national frame and least distinctive from outside it. Seen through four comparative lenses, the focal topic dissolves and re-forms. Place the colonial revival of the 1730s–40s in its *transatlantic* setting — beside the Welsh revival, the Scottish \"Cambuslang Wark\" of 1742, the English Evangelical Revival of the Wesleys and George Whitefield, and the continental Pietism of Halle and the Moravians under Zinzendorf — and the \"American\" Awakening becomes one provincial front of a single Protestant convulsion, knit together by print, letters, and itinerant preachers, as W. R. Ward and Susan O'Brien argued. Place the two canonical Awakenings beside the *later* American ones — the businessmen's Prayer Meeting Revival of 1857–58, the contested \"Third\" (Social Gospel) awakening, and Robert Fogel's even more contested \"Fourth\" — and the very habit of numbering awakenings comes into question: the skeptics (Jon Butler, Frank Lambert) argue that historians, not eighteenth-century New Englanders, manufactured \"the Great Awakening\" as a category. Place American revivalism beside *global Pentecostalism*, its largest long-run descendant at roughly 600+ million adherents, and the Awakenings look less like a closed chapter of early-American history than like the headwaters of the fastest-growing religious movement on earth. And place the United States beside *secularizing Europe*, and the Awakenings become Exhibit A for the religious-economy or \"supply-side\" model of Roger Finke and Rodney Stark — competitive, deregulated, sect-driven vitality — even as critics insist the American exception is now closing. The comparative view does not merely add context; it changes what the focal topic *is*. None of these four lenses is settled. Each is a live scholarly argument, and the most honest conclusion is that \"the Great Awakening\" is best understood as a contested interpretive convention sitting atop a real but messier history of transatlantic revival.\n\n---\n\n## Why the Comparative View Matters Here\n\nA historian working only inside the United States can tell a coherent story: a colonial revival peaks around Whitefield's 1739–41 itinerancy, subsides, and returns transformed in the camp meetings and \"new measures\" of c. 1790–1840. The story is true as far as it goes. But it hides at least four things that only become visible from outside.\n\nFirst, it hides that the men and women who lived through the 1740s did not experience an *American* event. They read Scottish revival magazines, corresponded with Welsh and English brethren, and understood themselves as participants in one work of God spanning the Atlantic. The national frame is an anachronism imposed by later historiography.\n\nSecond, it hides that \"awakening\" is a periodizing *choice*, not a natural unit of time. Ask why there is a First and a Second but the 1857–58 revival and the Social Gospel era get only contested numbers, and the apparent solidity of the category begins to wobble.\n\nThird, it hides scale. Measured by long-run descendants, the most consequential thing the Awakenings did was to establish revival as a reproducible technology of conversion — one that, by way of nineteenth-century holiness movements and the 1906 Azusa Street revival, seeded a global Pentecostal-Charismatic movement now numbering in the hundreds of millions.\n\nFourth, it hides the comparative puzzle that makes American religion theoretically interesting: why a modernizing, wealthy, schooled society stayed so much more religious than its European peers for so long. The Awakenings are the historical engine the leading explanation — the religious-economy model — puts at the center.\n\nWhat follows treats each comparison as an analytical tool, not a list of similarities. Where the comparison cuts against the focal topic, it says so.\n\n---\n\n## I. The Transatlantic Evangelical Revival: The Awakening Without a Nation\n\n### The thesis: one Atlantic awakening, many provincial fronts\n\nThe most important reorientation in the historiography of the eighteenth-century revivals is the move from a national to a transatlantic frame. Its boldest statement is W. R. Ward's *The Protestant Evangelical Awakening* (Cambridge University Press, 1992), which reconstructs the revival not as an Anglo-American colonial episode but as a pan-European Protestant movement with deep roots in Central and Eastern Europe — Silesia, Salzburg, Bohemia, the Habsburg lands — long before Northampton or Cambuslang [1]. On Ward's account, the famous shipboard meeting between John Wesley and a group of Moravian Brethren on the 1735 voyage to Georgia was no chance collision of two religious cultures but a nearly inevitable contact between currents already flowing toward one another [1].\n\nThe implication is radical for the American story. *Pietism* — the seventeenth- and eighteenth-century movement of \"heart religion\" within Lutheran and Reformed Protestantism that stressed personal conversion, devotional warmth, small-group discipline (the *collegia pietatis*), and practical holiness over confessional scholasticism — is, on this reading, not a parallel to the American Awakening but one of its taproots. The Halle institutions founded by August Hermann Francke (orphanage, schools, publishing house, missions) and the renewed *Unitas Fratrum* (the Moravian Church) gathered at Herrnhut under Count Nikolaus Ludwig von Zinzendorf supplied models, personnel, and a theology of the new birth that flowed westward into the British and colonial revivals [1][2].\n\n### Susan O'Brien and the revival's nervous system\n\nIf Ward supplied the deep geography, Susan O'Brien supplied the connective tissue. Her 1986 *American Historical Review* article, \"A Transatlantic Community of Saints: The Great Awakening and the First Evangelical Network, 1735–1755,\" showed that participants on three shores — the American colonies, England, and Scotland — perceived the revivals of the late 1730s and 1740s as parts of a single God-inspired phenomenon, and that this perception was *manufactured by communication* [3]. A network of correspondence, revival magazines (notably the *Christian History* publications in Boston and Glasgow), reprinted conversion narratives, and a transatlantic book trade let a revival in one province be read as confirmation of a revival in another. Whitefield was the network's most mobile node; the letters and the press were its wiring [3].\n\nThis is the turn that makes a reader sit up. The unity of \"the Great Awakening\" is, on O'Brien's evidence, partly an artifact of an eighteenth-century *media* system — the same insight the skeptics (below) will push further. The revival was real, but its felt simultaneity and singleness owed much to print culture. Whitefield's mastery of publicity and the open-air crowd, the American Awakening's most famous feature, is here no American innovation but the colonial expression of an Atlantic-wide communications revolution in religion.\n\n### What the national frame hides: four nodes\n\n**The Welsh revival.** Welsh Methodism predates and partly seeds the English movement. Howell Harris began itinerant exhorting in 1735, and Daniel Rowland's preaching at Llangeitho drew large gatherings; the Welsh \"Calvinistic Methodist\" stream developed its own associations and emotional intensity, feeding into Whitefield's Calvinistic wing [2]. From the American vantage, the lesson is plain: the revival had multiple near-simultaneous ignition points, not a single colonial spark.\n\n**The Scottish \"Cambuslang Wark\" (1742).** In the parish of Cambuslang near Glasgow, under the ministry of William McCulloch and catalyzed by Whitefield's preaching in the summer of 1742, an intense revival (\"wark\" is Scots for \"work\") gathered crowds reported in the tens of thousands around the traditional Scottish \"communion season\" — a multi-day sacramental gathering that already carried a built-in liturgical structure for mass open-air religion [4]. Cambuslang matters comparatively because it shows the revival fusing with an *existing* indigenous form: the Scottish holy fair. The American camp meeting of the Second Awakening (Cane Ridge, 1801) would later look strikingly like a descendant of the Scots-Irish communion season carried to the frontier — a transatlantic inheritance, not a frontier invention.\n\n**The English Evangelical Revival and the Wesleys.** *Methodism* — the movement of disciplined \"method,\" small-group \"classes,\" field preaching, and Arminian (free-will) evangelism organized by John and Charles Wesley — was decisively shaped by Pietist contact. John Wesley met the Moravian Peter Böhler in February 1738; on 24 May 1738, at a meeting in Aldersgate Street, London, hearing Luther's preface to Romans read aloud, Wesley recorded that he \"felt [his] heart strangely warmed\" and gained assurance of salvation [5]. The Moravian \"class\" model shaped Methodist organization; field preaching followed Whitefield's example in 1739 [5]. American Methodism — which would become, with the Baptists, the great numerical winner of the Second Great Awakening — is thus a downstream tributary of a German-Pietist/English-Methodist confluence, not a native growth.\n\n**German Pietism and the Moravians.** Francke's Halle and Zinzendorf's Herrnhut were the continental engines. The Moravians carried \"heart religion\" into the Atlantic world directly — to Georgia, to Pennsylvania (Bethlehem), and into the spiritual formation of the Wesleys [1][2]. Mark Noll, in *The Rise of Evangelicalism* (the inaugural 2003 volume of the Bebbington–Noll *History of Evangelicalism* series), gives the standard synthesis: a \"multinational narrative\" of evangelical origins from the 1730s to the 1790s in which Edwards, Whitefield, and the Wesleys are co-protagonists of one transatlantic story, with continental and (later) African and Australasian connections [6].\n\n### The unifying definition: Bebbington's quadrilateral\n\nWhat makes it legitimate to treat Welsh, Scottish, English, German, and American revivals as one movement rather than five? The most influential answer is David Bebbington's definition of evangelicalism, advanced in *Evangelicalism in Modern Britain* (1989) and now near-canonical: a \"quadrilateral of priorities\" — **conversionism** (the necessity of the new birth), **biblicism** (supreme regard for Scripture), **crucicentrism** (the centrality of Christ's atoning death), and **activism** (faith expressed in evangelism and reform) [7]. Bebbington dates the emergence of this configuration to the 1730s — precisely the revival decade — which is why the transatlantic Awakening and \"the rise of evangelicalism\" are, for this school, the same event seen twice [6][7].\n\nThe contest here is worth noting too. The \"Bebbington thesis\" that evangelicalism was *new* in the 1730s, rather than continuous with Puritan piety, is itself debated, with critics arguing for deeper continuity with seventeenth-century Reformed devotion. The transatlantic frame is powerful but not uncontested; it relocates the argument from \"American or not\" to \"novel or continuous.\"\n\n### What the comparison illuminates\n\nThe transatlantic lens converts the American Awakening from a *thing that happened in America* into *America's chapter of a book written across the Protestant Atlantic*. Three specific reframings follow. The camp meeting's roots run to the Scots communion season, not only to frontier conditions. Whitefield's \"media genius\" is the colonial face of an Atlantic communications revolution that O'Brien mapped. And the theology of the new birth that Edwards anatomized in *Religious Affections* shares a genealogy with Francke's Halle and Zinzendorf's Herrnhut. The national frame is not wrong, but it is provincial in the literal sense: it mistakes a province for the whole.\n\n---\n\n## II. Later American Awakenings: When Does the Numbering Stop?\n\nThe second comparison turns inward and forward. If the colonial revival is the \"First\" and the c. 1790–1840 revival the \"Second,\" what are the *later* American revivals — and does the practice of numbering them illuminate or mislead?\n\n### The Prayer Meeting Revival of 1857–58\n\nIn the autumn of 1857, against the backdrop of a financial panic, a lay missionary named Jeremiah Lanphier began a noon prayer meeting for businessmen at the North Dutch Church on Fulton Street in Manhattan. Within months the noon prayer meeting had spread to other cities and was drawing large daily crowds; contemporaries called it the \"Businessmen's Revival,\" the \"Layman's Prayer Revival,\" or the \"Prayer Meeting Revival\" [8]. It was distinctively *urban, lay-led, interdenominational, and undramatic* — organized around prayer rather than fiery preaching — which is exactly why it complicates the model. Kathryn Teresa Long's *The Revival of 1857–58: Interpreting an American Religious Awakening* (Oxford University Press, 1998) is the standard scholarly treatment; her central move is to study how the revival was *interpreted and constructed* — by an emerging religious press, by businessmen, by a culture managing the anxieties of market capitalism — rather than to take \"awakening\" as a given natural kind [8a]. The continuity with O'Brien's transatlantic media insight is direct: again, the press helps make the awakening one thing.\n\nThe 1857–58 revival is sometimes folded into the Second Awakening's long tail and sometimes promoted to the head of a \"Third.\" Where one draws the line is a historiographical decision, not a fact about the past.\n\n### The contested \"Third\": the Social Gospel awakening\n\nThe label \"Third Great Awakening\" most often attaches to the religious activism of the late nineteenth and early twentieth centuries — the era of urban revivalism (Dwight L. Moody), the holiness movement, and above all the *Social Gospel*, the movement (Walter Rauschenbusch its best-known voice, *Christianity and the Social Crisis*, 1907) that applied Christian ethics to industrial capitalism's casualties: poverty, inequality, child labor, slum conditions, demanding social as well as individual salvation [9]. The \"Third Great Awakening\" framing derives substantially from William G. McLoughlin's influential *Revivals, Awakenings, and Reform* (University of Chicago Press, 1978), which read American history as a sequence of awakenings on roughly 80-to-100-year cycles, each a period of \"cultural revitalization\" born in a crisis of belief and issuing in social reform [10].\n\nBut the \"Third\" label is genuinely disputed. Many historians treat the Social Gospel as a movement rather than an \"awakening,\" doubt its unity as a singular revival comparable to the First or Second, and note that the term competes with other nominations for the \"Third\" slot (including the 1857–58 revival itself and various twentieth-century moments) [9][10]. The proliferation of candidates for \"Third\" is itself evidence that the numbering scheme is doing interpretive work the evidence does not compel.\n\n### The even more contested \"Fourth\": Fogel's thesis\n\nThe Nobel laureate economic historian Robert William Fogel pushed the cyclical model furthest in *The Fourth Great Awakening and the Future of Egalitarianism* (University of Chicago Press, 2000). Borrowing McLoughlin's periodization, Fogel argued that American history is structured by recurring religious awakenings, each linked to a phase of technological and economic change and each generating a wave of egalitarian reform; he located a \"Fourth Great Awakening\" beginning around the 1960s, expressed in the rise of modern evangelicalism and a politics increasingly concerned with *spiritual* rather than purely material equity — \"spiritual resources\" such as purpose, self-esteem, discipline, and a sense of vocation [11]. Fogel's argument is bold and synthetic, marshaling a wide range of economic and demographic data; it is also among the most criticized applications of the awakening model, charged with imposing a tidy cyclical schema on heterogeneous phenomena and with reading present-day evangelical politics back through a frame built for the eighteenth century [11].\n\nA scholarly note on provenance: the cyclical-awakening framework McLoughlin and Fogel use descends in part from the anthropologist Anthony F. C. Wallace's concept of the \"revitalization movement\" — a culturally patterned process by which a society under stress reorganizes its worldview [10]. The model thus arrives in American religious history already carrying a strong theoretical commitment: that awakenings are *functional responses to crisis*. That commitment is exactly what the skeptics dispute.\n\n### The skeptical view: historians manufacture awakenings\n\nThe most important contribution of this second comparison is to surface a position that threatens the whole enterprise. Jon Butler's 1982 *Journal of American History* article, \"Enthusiasm Described and Decried: The Great Awakening as Interpretive Fiction,\" argued that \"the Great Awakening\" — even the *First* — is largely a retrospective construction, an \"interpretive fiction\" that exaggerated the extent of the colonial revivals, imposed a false coherence on scattered local events, and overstated their political and social consequences; Butler urged historians to drop the term [12]. Frank Lambert's *Inventing the \"Great Awakening\"* (Princeton University Press, 1999) split the difference: the Awakening was both real and constructed — a genuine series of revivals *and* \"an early American culture war\" waged in the press, in which a \"rather ordinary occurrence in an obscure corner of colonial America\" was talked into national significance by promoters and critics [13]. Lambert's account dovetails with O'Brien's: the awakening was, in substantial part, made by media.\n\nPut the cases in a row — 1740s, 1857–58, Social Gospel, Fogel's 1960s — and the pattern is unmistakable. *The further from the canonical First and Second we get, the more contested the numbering becomes, and the more visible the historian's hand.* If the \"Third\" and \"Fourth\" are scholarly constructs, the skeptic asks, on what principled grounds are the \"First\" and \"Second\" not? This is the destabilizing payoff of the comparison: it generalizes Butler's suspicion. The honest position is not that awakenings are fictions but that \"awakening\" is a *periodizing convention* — useful for organizing real revivals, dangerous when mistaken for a natural unit of historical time. Treating \"the Great Awakening\" as a contested category rather than a settled fact is the disciplined response.\n\n### What the comparison illuminates\n\nRead against its successors, the canonical First and Second Awakenings are revealed as the *securely numbered* end of a spectrum whose far end (Fogel's Fourth) almost everyone agrees is a construct. The comparison does not prove the First Awakening was a fiction. It proves that the difference between \"real awakening\" and \"historiographical artifact\" is one of degree, that the press has been a co-author of every American awakening since the eighteenth century, and that the cyclical model carries a theoretical payload (crisis → revitalization → reform) that should be argued for, not assumed.\n\n---\n\n## III. Revivalism Elsewhere: Global Pentecostalism as the Awakenings' Largest Descendant\n\nThe third comparison asks: of everything the Awakenings set in motion, what grew largest? The answer is not in the United States at all.\n\n### The lineage\n\nThe Second Great Awakening's revival technologies — the protracted meeting, the anxious bench, the expectation of immediate experiential conversion, lay and itinerant agency — passed through the nineteenth-century *holiness movement* (a Methodist-rooted pursuit of a \"second blessing\" of sanctification) into the early-twentieth-century Pentecostal movement, whose conventional point of ignition is the Azusa Street revival in Los Angeles beginning in 1906, led by the Black preacher William J. Seymour [14]. *Pentecostalism* — Christianity centered on a post-conversion baptism in the Holy Spirit evidenced by spiritual gifts such as speaking in tongues, prophecy, and healing — is, in form, a direct descendant of American revivalism: the same emphasis on crisis conversion and immediate experience, intensified [14]. The genealogy runs Awakenings → holiness → Azusa → global Pentecostalism.\n\n### The scale\n\nThis descendant dwarfs its ancestor. The Center for the Study of Global Christianity at Gordon-Conwell estimated roughly **644 million** Christians in the broad Pentecostal/Charismatic (\"Spirit-Empowered\") movement as of 2020 — about a quarter of all Christians worldwide [15]. Other syntheses citing Pew Research Center data put the global figure near **600 million**, split between classical Pentecostals and charismatics within other denominations, and describe Pentecostalism as among the fastest-growing religious movements on earth, with its center of gravity in the Global South — sub-Saharan Africa, Latin America, and parts of Asia [16]. (These totals are estimates with real definitional uncertainty — \"Pentecostal,\" \"Charismatic,\" and \"Independent\" are contested boundaries, and some advocacy sources inflate the numbers — so the figures should be read as orders of magnitude, not precise counts [16].)\n\n### What the comparison illuminates — and where it strains\n\nThe comparison reframes the Awakenings from a *terminus* (a closed early-American chapter) into *headwaters* (the origin of a still-expanding global movement). The most consequential American export of the nineteenth century may not be a product or a political form but a *technology of conversion* — revival — now indigenized across the Global South.\n\nBut the analytical discipline cuts both ways, and the strain is worth stating. Global Pentecostalism is not simply American revivalism scaled up. It has been thoroughly indigenized, fused with local cultures, and is in many places led entirely by non-Western actors with their own theological and cultural agendas; reading it as a mere \"descendant\" of the American Awakenings risks a diffusionist, America-centric distortion. The honest claim is *genealogical* (the form and many of the methods trace back through Azusa to the revival tradition) without being *proprietary* (the movement is not American and is not controlled from America). The comparison illuminates origins; it must not be allowed to annex the present.\n\n---\n\n## IV. The Secularization Counter-Case: Why the Awakenings Embarrass a Theory\n\nThe fourth comparison is the most theoretically loaded. It sets the religious United States beside secularizing Europe and asks what the difference proves.\n\n### The theory the Awakenings embarrass\n\nThe *secularization thesis* — for much of the twentieth century the default sociological account — held that modernization (industrialization, urbanization, science, rising education, institutional differentiation) systematically erodes religion's social significance; modern societies were expected to grow steadily less religious [17]. Europe seemed to confirm it. The United States — modern, wealthy, schooled, and conspicuously religious — was the standing embarrassment, the great counterexample. And the Awakenings are why the United States is religious: the revival tradition produced the evangelical center of gravity, the denominational pluralism, and the voluntary, participatory form of American religion. The Awakenings are, in the comparative sociology of religion, the historical *cause* of the leading anomaly.\n\n### The leading explanation: the religious-economy / supply-side model\n\nThe most influential attempt to explain the American anomaly is the *religious-economy* or *supply-side* model, stated for American history in Roger Finke and Rodney Stark's *The Churching of America, 1776–1990* (Rutgers University Press, 1992; updated edition *1776–2005*, 2005) [18]. Its core moves:\n\n- **Religion as a competitive market.** Churches are \"firms\" competing for adherents; the relevant explanatory variable is the *supply* side — the energy, organization, and appeal of religious entrepreneurs — not the \"demand\" for religion, which is assumed roughly constant [18].\n- **Deregulation breeds vitality.** Where the state establishes and subsidizes a church (most of Europe), the established firm grows lazy and overall participation falls; where the state stays out and many firms compete (the United States after disestablishment), participation rises. Pluralism is the *cause* of vitality, not its solvent [18].\n- **The church–sect cycle and \"winners and losers.\"** High-tension \"upstart sects\" (Methodists and Baptists in the Second Awakening; later Pentecostals) win adherents precisely because they demand much and reduce free-riding; as they prosper they accommodate to the surrounding culture, lose tension, and decline, while new sects rise to take their place. The book's striking empirical claim is that the \"mainline\" denominations were the long-run *losers* and the upstarts the *winners* of the American religious market [18].\n\nFor this model the Awakenings are the supply-side mechanism in action: a deregulated, competitive, sect-driven religious economy *manufacturing* the vitality that secularization theory said modernity should have dissolved. Finke and Stark turn the American exception from an embarrassment into a prediction.\n\n### The critics\n\nThe supply-side model is contested at the root. Critics in the sociology of religion — Steve Bruce foremost among the secularization theory's defenders — argue that the empirical heart of the model, the claimed positive association between religious *pluralism* and religious *participation*, frequently dissolves under scrutiny: that pluralism more often correlates with *decline* than with vitality, that deregulation does not reliably produce vitality, and that several celebrated positive findings were statistical artifacts of how diversity was measured [19]. On this view, modernization-driven secularization remains the better general account, and the United States was a *lagging* case, not a refuting one.\n\nThe decisive recent move came from David Voas and Mark Chaves in \"Is the United States a Counterexample to the Secularization Thesis?\" (*American Journal of Sociology*, 2016). Focusing on *trends* rather than *levels*, they argued that American religiosity has in fact been declining for decades, and — crucially — that the decline is being produced by the *same generational mechanism* observed across the secularizing West: each successive birth cohort is less religious than the one before [20]. If they are right, the United States is no longer a counterexample at all; it is simply a few decades behind Europe on the same road, and the religious-economy model's central explanandum — durable American exceptionalism — is evaporating in real time. (The rise of the religiously unaffiliated \"nones\" in U.S. survey data over the past quarter-century is the visible surface of this trend.)\n\n### What the comparison illuminates\n\nThe secularization lens does something none of the others does: it makes the Awakenings *theoretically dangerous*. They are simultaneously the leading evidence *against* the secularization thesis (they built the religious America that embarrassed it) and, via Finke and Stark, the mechanism a rival theory uses to *explain it away*. And the Voas–Chaves turn adds a temporal sting: the very exception the Awakenings created may be closing, which would mean the religious-economy model explained a *transient* condition rather than a permanent one. The reader who entered thinking \"the Awakenings made America permanently religious\" should leave holding three live possibilities at once: (a) they made America durably exceptional (Finke–Stark); (b) they made America religious for a while, but modernization is now winning anyway (Voas–Chaves, Bruce); (c) the dispute itself is unsettled, and the next generation of data will adjudicate it.\n\n---\n\n## V. Cross-Cutting Patterns Visible Only From Outside\n\nReading the four comparisons together surfaces patterns invisible from inside any one of them.\n\n**Print and media are co-authors of every awakening.** O'Brien's transatlantic correspondence network, Lambert's \"culture war in the press,\" Long's religious-press construction of 1857–58 — the same finding recurs across two centuries. Whatever else an \"awakening\" is, it is partly a *media event*, made to feel singular and simultaneous by the communications technology of its day. This is the strongest cross-cutting result of the four comparisons, and it directly supports treating \"awakening\" as a contested category.\n\n**Indigenous liturgical forms shape revival as much as theology does.** The Scottish communion season structured Cambuslang and, transplanted, the American camp meeting; the Methodist class meeting (itself Moravian-derived) structured discipleship on both sides of the Atlantic. Revival is not pure spontaneous emotion; it flows into and is shaped by pre-existing institutional channels.\n\n**The \"winners\" are usually the high-tension upstarts.** Methodists and Baptists in the Second Awakening, Pentecostals in the twentieth century, the Global South churches today — the religious-economy model's church–sect dynamic recurs across the comparative field. The movements that demand the most, paradoxically, often grow the fastest.\n\n**Every awakening's numbering is a claim, not a measurement.** From Butler's skepticism about the First to the near-universal treatment of Fogel's Fourth as a construct, the comparative series shows that \"awakening\" is an interpretive convention historians apply with increasing freedom the further they get from the canonical core. The category is useful and real-referring, but it is not a natural kind.\n\n---\n\n## Open Questions\n\n1. **Is the Bebbington thesis right that evangelicalism was genuinely new in the 1730s,** or is the transatlantic \"Awakening\" better read as the visible crest of a continuous Reformed-Puritan-Pietist devotional tradition? The transatlantic frame relocates but does not resolve the novelty-vs-continuity debate.\n\n2. **How much of the felt unity of \"the Great Awakening\" is an artifact of the eighteenth-century media system** rather than of shared religious experience? O'Brien and Lambert push hard in the \"media-made\" direction; a full accounting of how much *real* coordinated experience underlay the print-amplified perception is still contested.\n\n3. **Will the Voas–Chaves generational decline thesis hold,** or will it prove a phase rather than a trend — and if the United States is secularizing on the European pattern, does that retroactively weaken the religious-economy explanation of American exceptionalism, or merely bound its time horizon? This is a live empirical question that the next two decades of cohort data will substantially settle.\n\n4. **Is global Pentecostalism best understood as a descendant of the American Awakenings at all,** or has the indigenization been so thorough that the genealogical link is now of historical interest only, with little explanatory purchase on the movement's present dynamics? The line between \"origin\" and \"ownership\" is doing heavy lifting here.\n\n5. **Does the cyclical-awakening model (Wallace → McLoughlin → Fogel) have any predictive content,** or is it a retrospective pattern imposed on heterogeneous data — and if the latter, does that verdict reach back to undermine the \"First\" and \"Second\" as well, as Butler's logic implies?\n\n6. **Where exactly should the 1857–58 revival be filed** — as the long tail of the Second Awakening, the head of a \"Third,\" or a discrete event resistant to the numbering scheme entirely? The filing decision is a microcosm of the whole periodization problem.\n\n---\n\n## Sources\n\n1. Ward, W. R. *The Protestant Evangelical Awakening.* Cambridge: Cambridge University Press, 1992. — Tier 2 (university-press monograph). The foundational pan-European/transatlantic reframing; deep roots of the revival in Central/Eastern European Pietism; the Wesley–Moravian shipboard contact as near-inevitable. Publisher/bibliographic detail accessed via Cambridge University Press listings and reviews, 2026-06-19. https://www.cambridge.org/ (book listing).\n\n2. Noll, Mark A.; and the broader transatlantic literature on Welsh (H
