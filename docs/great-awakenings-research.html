s admitting 1,699 members 1798–1800; Samuel Hopkins's autumn-1799 report of revival \"in more than 100 towns … under the preachers of Edwardean divinity.\" https://www.9marks.org/article/forgotten-real-revivals-of-the-second-great-awakening/ — *Tier 6 (confessional/devotional history; the Hopkins quotation and the membership figures should be confirmed against the New Divinity correspondence; flagged single-source for the exact numbers). Accessed 2026-06-19.*\n23. \"Asahel Nettleton: The Forgotten Evangelist\" (Christian Communicators Worldwide) and the Nettleton entry citing Bennet Tyler, Douglas Sweeney, and Charles Hambrick-Stowe; Nettleton's deliberate method, Edwardsian theology, opposition to the anxious bench as \"a denial of original sin and total depravity,\" New Lebanon 1827, and his eclipse as Finney's measures prevailed. https://www.ccwtoday.org/2025/06/asahel-nettleton-the-forgotten-evangelist/ — *Tier 5/6 (scholar-informed evangelical history; underlying scholarship Sweeney & Hambrick-Stowe is Tier 2). Accessed 2026-06-19.*\n24. \"New Lebanon Conference\" (July 1827); organizers Lyman Beecher and Nathan Beman; week-long standoff; Beecher's \"fight you every inch of the way\" warning preserved as tradition. https://en.wikipedia.org/wiki/New_Lebanon_Conference (navigation; the Beecher warning is from Beecher's Autobiography and is flagged as tradition/contested wording). — *Tier 1 underlying (Beecher Autobiography) but verbatim unverified; flagged. Accessed 2026-06-19.*\n25. Whitney R. Cross, *The Burned-over District: The Social and Intellectual History of Enthusiastic Religion in Western New York, 1800–1850* (Cornell University Press, 1950). https://www.cornellpress.cornell.edu/book/9780801492327/the-burned-over-district/ ; https://archive.org/details/burnedoverdistri0000cros — *Tier 2 (foundational university-press monograph). The \"psychic highway,\" Yankee migration, and the district as incubator of new religions. Accessed 2026-06-19.*\n26. \"Charles Grandison Finney: Father of American Revivalism,\" Christian History Institute / *Christianity Today*; the new measures (anxious bench, protracted meetings, naming sinners, women praying in public), Rochester 1830–31 (~100 sermons, shopkeepers closing). https://christianhistoryinstitute.org/magazine/article/charles-grandison-finney/ — *Tier 5 (scholarly popular history). Accessed 2026-06-19.*\n27. Christian History Institute, Finney biography (1821 conversion, abandonment of law, licensed 1823, work from 1824; \"will not, not a cannot\"; Oberlin 1835, professor then president to 1875; perfectionism with Asa Mahan; abolition/Underground Railroad). As in [26]. — *Tier 5. Accessed 2026-06-19.*\n28. Charles G. Finney, *Lectures on Revivals of Religion* (1835), Lecture I, \"What a Revival of Religion Is\" (text: Habakkuk 3:2). Christian Classics Ethereal Library full text. https://ccel.org/ccel/finney/revivals.iii.i.html — *Tier 1 (primary text). \"A revival is not a miracle … a purely philosophical result of the right use of the constituted means\"; the crop analogy; the rejection of revival as \"thunder, or a storm of hail.\" Accessed 2026-06-19.*\n29. Nathaniel W. Taylor, *Concio ad Clerum: A Sermon Delivered in the Chapel of Yale College, September 10, 1828*. Full text, gospeltruth.net. https://www.gospeltruth.net/concio.htm — *Tier 1 (primary text). Depravity \"by nature\" as occasion not cause; sin as \"man's own act … a free choice of some object rather than God\"; rejection of God as \"author of sin\"; \"sin before the first sin\" absurdity. Accessed 2026-06-19.*\n30. Jason A. Nicholls, \"'Certainty' with 'Power to the Contrary': Nathaniel William Taylor (1786–1858) on the Will\" (Marquette University dissertation); Revival Theology Resources on natural ability vs. moral inability; Taylor \"reversed the elder Edwards … contending for a natural power of free choice.\" https://epublications.marquette.edu/dissertations_mu/1566/ — *Tier 2 (doctoral dissertation) + Tier 6 (revivaltheology.net, used only for the standard terminological gloss). Accessed 2026-06-19.*\n31. Finke & Stark, *Churching of America* (denominational market shares 1776 vs. 1850; Congregationalists 20.4%→4%; Methodists 2.5%→34.2%; Baptists ~20.5% in 1850; Methodists later overtaken by Baptists in the 20th c.). As in [4]; figures also reported via Kevin M. Watson citing Finke & Stark p. 56. https://kevinmwatson.com/2009/06/17/the-explosive-growth-of-methodism-from-1776-to-1850/ — *Tier 2 underlying data (Finke & Stark), reported via a scholar's blog; the percentages are flagged as resting on Finke & Stark's contested reconstruction. Accessed 2026-06-19.*\n32. Kevin M. Watson (Methodist historian), \"The Explosive Growth of Methodism from 1776 to 1850,\" citing Finke & Stark, *Churching of America*, p. 56 (13,302 Methodist congregations and 2.6M members by 1850; \"1 in 40 … 1 in 3\"). https://kevinmwatson.com/2009/06/17/the-explosive-growth-of-methodism-from-1776-to-1850/ — *Tier 5 (scholar's blog reporting Tier 2 data). Accessed 2026-06-19.*\n33. Nathan O. Hatch, *The Democratization of American Christianity* (Yale University Press, 1989); the populist, anti-elite, anti-\"priestcraft,\" anti-Calvinist character of Methodism, the Baptists, the Christian movement, the black church, and Mormonism; \"did more to Christianize American society than anything before or since.\" https://books.google.com/books/about/The_Democratization_of_American_Christia.html?id=vxccUKe2KUoC ; summary at https://www.booksataglance.com/book-summaries/democratization-american-christianity-nathan-o-hatch/ — *Tier 2 (Bancroft-Prize-winning university-press monograph). The democratization thesis. Accessed 2026-06-19.*\n34. \"The Benevolent Empire,\" American Yawp / Lumen Learning, US History; American Board of Commissioners for Foreign Missions (1812), American Bible Society (1816), American Sunday School Union (1824), American Tract Society (1825); reform societies 1815–1861; middle-class and female composition. http://www.americanyawp.com/text/10-religion-and-reform/ ; https://courses.lumenlearning.com/suny-ushistory1ay/chapter/the-benevolent-empire/ — *Tier 5 (peer-authored open educational text). Accessed 2026-06-19.*\n35. Methodist (1844) and Baptist (1845, Southern Baptist Convention) sectional schisms over slavery; AUSS, \"Methodists, Baptists, and Slavery.\" https://www.andrews.edu/library/car/cardigital/Periodicals/AUSS/1986-1/1986-1-03.pdf — *Tier 2 (peer-reviewed journal). Accessed 2026-06-19.*\n36. \"Richard Allen (bishop)\" and the African Methodist Episcopal Church; AME organized as an independent denomination in 1816 with Allen as first bishop (Bethel founded 1794). https://www.britannica.com/biography/Richard-Allen — *Tier 2 (expert reference). Accessed 2026-06-19.*\n37. Paul E. Johnson, *A Shopkeeper's Millennium: Society and Revivals in Rochester, New York, 1815–1837* (Hill and Wang, 1978); the market-revolution / \"social control\" reading of Finney's Rochester revival; revival as \"a key step in the legitimation of free labor,\" explicitly *not* a \"capitalist plot\"; employers and journeymen no longer sharing a household. https://us.macmillan.com/books/9780809016358/ashopkeepersmillennium/ — *Tier 2 (landmark university-affiliated social-history monograph). Johnson's social-control/market thesis. Accessed 2026-06-19.*\n38. Richard Carwardine, *Transatlantic Revivalism: Popular Evangelicalism in Britain and America, 1790–1865* (1978) and *Evangelicals and Politics in Antebellum America* (1993); the transatlantic frame and the periodization of \"most aggressive conversion techniques\" 1790s–1840s. https://www.amazon.com/Transatlantic-Revivalism-h-t-Evangelicalism-Evangelical/dp/1842273736 — *Tier 2 (university-press monographs). Accessed 2026-06-19.*\n39. Mark A. Noll, *America's God: From Jonathan Edwards to Abraham Lincoln* (Oxford University Press, 2002); the evangelical–republican–commonsense synthesis, Edwards as \"the last of the Puritans and the first of the evangelicals,\" Asbury and Methodism. https://global.oup.com/ushe/product/americas-god-9780195182996 — *Tier 2 (university-press monograph). Accessed 2026-06-19.*"}, {"order": 3, "file": "03_Living_Legacy_And_Present_Landscape.md", "title": "The Living Legacy and Present-Day Landscape", "summary": "", "body": "# The Living Legacy and Present-Day Landscape\n\n## Bottom Line\n\nThe Awakenings are not over. They left behind a religious order that still functions, and the first task of a \"present-state\" chapter on a historical topic is to name the institutions, traditions, and habits of religious imagination that remain in operation. The single most consequential legacy is structural: the Awakenings made American Christianity *evangelical* at its center of gravity — conversionist, biblicist, activist, and crucicentric, to use the historian David Bebbington's four-part definition — and *revivalist* in form, so that the periodic, emotionally intense \"outpouring\" became a normal and repeatable American religious event rather than an aberration. That form runs in an unbroken institutional line from the camp meeting through Dwight L. Moody, Billy Sunday, and Billy Graham's crusades, into Pentecostalism (born at the Azusa Street Mission in 1906) and the mid-century charismatic movement, and surfaced again, on cue, in the February 2023 Asbury University \"outpouring.\" The Awakenings also remade the denominational map — the Methodist and Baptist ascendancy of 1776–1850 still echoes in the fact that the Southern Baptist Convention remains the largest Protestant body in the United States (about 12.7 million members in 2024, though in its eighteenth straight year of decline) — and they seeded, directly out of the Second Awakening's \"Burned-over District,\" a set of wholly new religious movements that are now global: the Latter-day Saints (17.5 million members worldwide in 2024), the Seventh-day Adventists (23.7 million), the Stone-Campbell Restorationist churches, and the Holiness movement. The Awakenings birthed the independent Black church (the African Methodist Episcopal Church under Richard Allen, 1816) and converted the enslaved into a distinctively African-American Christianity. And revivalist religion's entanglement with reform and, later, with the Religious Right means the Awakenings remain a live force in American politics. Present-tense status claims here are dated to recent (2023–2025) denominational reports and Pew Research Center data, because the one thing a legacy chapter must not do is describe a living institution as it *was*.\n\n---\n\n## I. The Governing Claim: An Evangelical, Revivalist Christianity\n\n### The Bebbington Quadrilateral, defined\n\nTo say the Awakenings made American Christianity \"evangelical at its center of gravity\" requires a definition of evangelicalism that is not merely a slur or a voting bloc. The standard scholarly definition is David Bebbington's. In *Evangelicalism in Modern Britain: A History from the 1730s to the 1980s* (1989), Bebbington identified evangelicalism as a \"quadrilateral of priorities\" — four marks that, taken together, distinguish the movement [1]. They are:\n\n- **Conversionism** — the belief that lives must be *changed*; that there is a decisive turn, a \"new birth,\" and that nominal, inherited, or merely sacramental Christianity is insufficient.\n- **Biblicism** — a particular and high regard for the Bible as the locus of religious authority.\n- **Activism** — the conviction that the gospel must be *expressed in effort*, in evangelism and (often) in moral and social reform.\n- **Crucicentrism** — a doctrinal stress on the atoning sacrifice of Christ on the cross as the heart of the faith.\n\nThe \"quadrilateral\" is now the default working definition of evangelicalism in the historiography and is used as such by, among others, the National Association of Evangelicals [1]. It is worth registering that Bebbington's scheme is itself contested — critics (\"Beyond Bebbington\" is a small cottage industry) argue it is too thin, too behavioral, or insufficiently doctrinal — but it remains the reference point against which the contest is staged, and it is the definition used here [1].\n\nThe chronological framing in Bebbington's own subtitle is the load-bearing point here: he dates the movement \"from the 1730s.\" That is the decade of the colonial revival — Edwards's Northampton, Whitefield's itinerancy. Bebbington's thesis is, in effect, that the Awakenings are where Anglo-American evangelicalism *as a recognizable movement* begins. The present-day evangelical center of gravity in American religion is the long downstream of that beginning.\n\n### Revivalism as a recurring, institutionalized form\n\nThe second governing claim is about *form*. The Awakenings did not merely add converts; they normalized a particular technology of conversion — the revival, the protracted meeting, the public, emotionally heightened, mass invitation to the new birth — and made it a repeatable institution. The Encyclopædia Britannica's standard account of \"revivalism\" traces precisely this: from the colonial Great Awakening through the camp meetings of the frontier Second Awakening, through Charles Finney's \"new measures,\" and into the urban mass campaigns of Moody, Reuben Torrey, Billy Sunday, and Billy Graham [2]. The crucial historical fact is that revivalism *outlived its theological origins*. It began inside a broadly Calvinist framework (a revival was a \"surprising work of God,\" not something men could manufacture) and migrated, via Finney, into a quasi-technological assumption that the right \"means,\" rightly applied, would *produce* revival. By the twentieth century it was a professionalized industry with its own techniques, finance, music, and personnel — and it remains so. When the chapel service at Asbury University did not end in February 2023, the vocabulary, expectations, and institutional machinery that interpreted the event as a \"revival\" or \"outpouring\" were a direct inheritance of this two-century-old form.\n\n---\n\n## II. The Denominational Landscape the Awakenings Reshaped\n\n### The Methodist–Baptist ascendancy\n\nThe single most dramatic structural change the Awakenings produced was the rise of the Methodists and Baptists from the margins of colonial religion to numerical dominance. The sociologists Roger Finke and Rodney Stark, in *The Churching of America, 1776–2005: Winners and Losers in Our Religious Economy*, quantify it: in 1776, Methodists were roughly 2.5% of religious adherents in the colonies; by 1850 they were 34.2% — the largest single body — with the Baptists second at 20.5% [3]. The \"losers\" in this account were the colonial establishments: Congregationalists, Episcopalians, and Presbyterians, who entered the period dominant and exited it eclipsed [3].\n\nFinke and Stark explain the shift with a deliberately economic model: religious disestablishment created a competitive \"free market,\" and the Methodists and Baptists were the \"upstart sects\" best adapted to it — democratic in polity, reliant on lay and circuit-riding preachers, emotionally accessible, and morally demanding [3]. Their model is contested (it is a \"supply-side\" theory of religion that critics find reductive), and it overlaps with but is distinct from Nathan Hatch's \"democratization\" thesis, treated below and at length in the chapter on the historiographical debates. But the *fact* of the Methodist–Baptist ascendancy is not in dispute, and it is the demographic skeleton of American Protestantism to this day.\n\n### The present scale: the Southern Baptist Convention\n\nThe clearest living monument to the Baptist ascendancy is the Southern Baptist Convention, which remains the largest Protestant denomination in the United States. According to the 2024 Annual Church Profile, compiled and released by Lifeway Research in April 2025, the SBC reported **12,722,266 members** — a decline of 259,824 (about 2%) from 2023, and the convention's **eighteenth consecutive year of membership decline** [4][5]. At this level, the SBC is smaller than it has been since 1974; its membership peaked at roughly 16.3 million in 2006 [4][6].\n\nThe decline is, however, not the whole 2024 picture, and the countervailing data matter. The same report records **250,643 baptisms** in 2024 — a more than 10% jump over 2023 and the highest figure since 2017 — and average weekly worship attendance of about **4.3 million**, the third straight year of attendance growth [4][5]. The convention reported 46,876 churches [4]. So the SBC is simultaneously a denomination losing members on its rolls and one seeing rising attendance and baptisms — a pattern consistent with rolls being cleaned of long-inactive members while active participation firms up. (A note on the number: a widely circulated secondary figure of 12,982,090 for 2024 appears in some commentary [6]; the 12,722,266 figure comes from Lifeway Research's own detailed reporting of the Annual Church Profile [4][5] and is the one used here, with the discrepancy flagged.)\n\n### The present scale: the United Methodist Church and the 2022–2024 schism\n\nThe Methodist side of the ascendancy has just undergone the most consequential American denominational rupture since the Civil War. The United Methodist Church — itself the product of a 1968 merger, and the institutional heir of the Methodism that grew explosively after the Awakenings — split over the status of LGBTQ+ people.\n\nThe mechanism was a disaffiliation provision (Paragraph 2553 of the *Book of Discipline*) that allowed congregations to leave with their property under defined terms through the end of 2023. According to the Lewis Center for Church Leadership's final report (January 16, 2024), **7,631 churches** were approved by annual conferences for disaffiliation by December 31, 2023 — about **25% of UMC congregations**, representing roughly **24% of U.S. membership** [7]. The departures were geographically concentrated: about 50% in the Southeastern Jurisdiction and 21% in the South Central Jurisdiction [7]. Christianity Today, tallying the same window, reported 7,659 churches lost over the four-year period [8].\n\nThe conservative exit had an institutional destination: the **Global Methodist Church**, launched in May 2022, which by August 2025 reported overseeing more than 4,600 congregations worldwide [9 — note]. Then, at the postponed 2024 General Conference (April–May 2024), the remaining UMC voted by large margins to remove the bans on the ordination of \"self-avowed practicing\" LGBTQ+ clergy and on clergy officiating same-sex marriages, and to strike the 1972 language declaring \"the practice of homosexuality … incompatible with Christian teaching\" — reversing decades of policy, with the changes effective January 1, 2025 [10][11]. The legislation included conscience protections: no congregation can be compelled to receive an LGBTQ+ pastor, and no clergy can be compelled to officiate a same-sex wedding [10][11].\n\nAs of the most recent figures, the UMC reports approximately **11.3 million members worldwide** (GCFA, as of November 2025), of which about **5,424,043 are in the United States** across roughly 29,746 active U.S. churches; the international (largely African) membership is now about 4.56 million [12]. The U.S. total has fallen below the international, a milestone in the denomination's globalization. These figures are the post-disaffiliation denomination, and they are recent — but note the granular U.S. statistics underlying them lag (the detailed regional data are 2022, with later data still being compiled) [12].\n\n### The wider Protestant map\n\nBeyond the two flagship denominations, the Awakenings' legacy is a fractured, competitive, voluntarist Protestant landscape. Pew Research Center's 2023–24 Religious Landscape Study (released February 26, 2025; over 35,000 respondents) provides the most recent national map [13][14]. It finds the United States **62% Christian** (40% Protestant, 19% Catholic, 3% other Christian), **29% religiously unaffiliated**, and 7% other religions [13]. Within Protestantism, **evangelical Protestants are 23% of all U.S. adults** — down from 26% in 2007 but still the largest Protestant tradition — while **mainline Protestants** have fallen to 11% (from 18% in 2007) and **historically Black Protestants** to 5% (from 7%) [13][14]. The decisive recent finding is that the long Christian decline appears to have *slowed or leveled off*: the Christian share has been relatively stable since about 2019, and the \"nones\" have plateaued, at least temporarily [13][14]. Evangelicalism has thus become a *larger share of a shrinking Protestantism* even as it shrinks slightly in absolute population terms — the mainline decline being steeper [14]. That is the living arithmetic of the Awakenings: the revivalist, conversionist style they pioneered has proved more demographically durable than the formal, established style they displaced.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The U.S. religious landscape, 2023–24<\/div><div class=\"viz-donutwrap\"><svg viewBox=\"0 0 220 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"cv-spin\"><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t1\" stroke-width=\"42\" stroke-dasharray=\"184.65 267.74\" stroke-dashoffset=\"-0.00\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t2\" stroke-width=\"42\" stroke-dasharray=\"87.71 364.68\" stroke-dashoffset=\"-184.65\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t3\" stroke-width=\"42\" stroke-dasharray=\"13.85 438.54\" stroke-dashoffset=\"-272.36\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t4\" stroke-width=\"42\" stroke-dasharray=\"133.87 318.52\" stroke-dashoffset=\"-286.21\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t5\" stroke-width=\"42\" stroke-dasharray=\"32.31 420.08\" stroke-dashoffset=\"-420.08\" transform=\"rotate(-90 110 110)\"/><\/g><\/svg><div class=\"viz-legend viz-legend-col\"><span><i style=\"background:var(--t1)\"><\/i>Protestant <b>41%<\/b><\/span><span><i style=\"background:var(--t2)\"><\/i>Catholic <b>19%<\/b><\/span><span><i style=\"background:var(--t3)\"><\/i>Other Christian <b>3%<\/b><\/span><span><i style=\"background:var(--t4)\"><\/i>Religiously unaffiliated <b>30%<\/b><\/span><span><i style=\"background:var(--t5)\"><\/i>Other religions <b>7%<\/b><\/span><\/div><\/div><figcaption>The order the Awakenings built, two centuries on: still majority-Christian and overwhelmingly Protestant-and-Catholic, with a large unaffiliated minority whose growth has recently leveled off. <span class=\"credit\">Source: Pew Research Center, 2023–24 Religious Landscape Study (released Feb 26, 2025).<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## III. Revivalism as a Recurring American Form: The Long Line\n\n### From the camp meeting to the urban crusade\n\nThe clearest way to see the Awakenings as a *living* legacy is to trace revivalism's institutional descent. The frontier camp meeting (Cane Ridge, 1801, and its successors) and Finney's professionalized urban revivals of the 1820s–30s established the template. After the Civil War, **Dwight L. Moody** (1837–1899) industrialized it. Moody's British tour of 1873–75 launched a new transatlantic surge, and his crusades pioneered techniques that became permanent fixtures of mass evangelism: the pre-campaign house-to-house canvass, an ecumenical enlistment of all local cooperating churches, business-community financing, the rental of a large central hall, the featured gospel soloist (Ira Sankey), and the \"inquiry room\" for converts [2][15]. Moody made revivalism a *system*.\n\n**Billy Sunday** (1862–1935), a former professional baseball player, carried the urban-crusade form into the early twentieth century with a theatrical, athletic preaching style and large temporary \"tabernacles.\" And **Billy Graham** (1918–2018) became the form's twentieth-century identity: his 1949 Los Angeles crusade is conventionally treated as the mid-century rebirth of mass revivalism, and Graham exploited the surrounding \"parachurch\" network — radio, film, magazines, follow-up organizations — more effectively than any predecessor, taking the crusade global [15][16]. Graham's death in 2018 closed the era of the singular national revivalist, but the institutional form he perfected did not die with him.\n\n### Pentecostalism and the Azusa Street revival (1906)\n\nThe most globally consequential branch of the revival tradition is **Pentecostalism** — the movement, rooted in the Holiness wing of revivalist Christianity, that adds to conversionist evangelicalism a \"baptism in the Holy Spirit\" evidenced by the *charismata*, especially speaking in tongues (glossolalia), healing, and prophecy. Its symbolic founding event is the **Azusa Street Revival** in Los Angeles, led by the African-American Holiness preacher **William J. Seymour**, which began on April 9, 1906, and continued for roughly a decade [17]. Seymour had absorbed the doctrine of a \"third blessing\" Spirit-baptism from Charles Fox Parham's Bible school in Houston; the Los Angeles outpouring became the catalytic event from which a worldwide movement and a missionary diaspora radiated [17]. Azusa Street is also historically notable for its interracial character — Black and white worshippers together, against the segregationist norms of 1906 — although that interracialism did not survive the movement's institutionalization, which fractured along racial lines [17].\n\nThe present scale is enormous and is the strongest case that the revival tradition is a *global* going concern. Drawing on the Center for the Study of Global Christianity and related estimates, there are on the order of **644 million** Pentecostal Christians worldwide in the mid-2020s — roughly 8% of the global population and about a quarter of all Christians — with some broader Pentecostal/Charismatic counts exceeding 660 million [18]. In the United States, the Assemblies of God — the largest classical Pentecostal denomination — is a conspicuous *outlier* against the general Protestant decline, reporting growth and roughly 13,000 U.S. congregations, with much of the growth driven by Hispanic membership [19 — note]. The revival form the Awakenings normalized has, in Pentecostalism, become the fastest-growing stream of world Christianity.\n\n### The charismatic movement (1960s–70s)\n\nIf Pentecostalism took the revival's pneumatology *out* of the established churches, the **charismatic movement** (also \"neo-Pentecostalism\") brought it *back in*. Beginning around 1960 — the conventional marker is Episcopal priest **Dennis Bennett**'s announcement to his Van Nuys, California, parish on April 3, 1960, that he had received Spirit-baptism and spoken in tongues — the charismatic renewal spread Pentecostal practice into the mainline Protestant denominations and, from 1967, into the Roman Catholic Church [20]. The Hartford Institute's account notes that within roughly a decade the renewal had touched all the major Protestant families, reaching tens of millions [20]. This is a crucial datum for the legacy argument: the revivalist-charismatic impulse proved capable of colonizing even the most hierarchical and sacramental churches — Episcopal and Catholic — that the original Awakenings had bypassed or opposed.\n\n### The 2023 Asbury \"outpouring\"\n\nThe most recent eruption of the form, and the one demanding the most careful sourcing, is the **2023 Asbury University revival** in Wilmore, Kentucky. The chronology, per the university's own account and contemporaneous reporting: a routine Wednesday chapel service in Hughes Auditorium on **February 8, 2023**, did not end; spontaneous, student-led worship and prayer continued more or less continuously for about **16 days**, with a culminating student service on February 23 [21][22]. The event spread to nearby buildings (including Asbury Theological Seminary's chapels) and drew, by widely cited estimates, tens of thousands of visitors — figures in the range of 15,000 per day at the peak, and a cumulative 50,000–70,000 visitors to the small town of Wilmore over the period, from more than 200 academic institutions and multiple countries [21][22].\n\nThe careful point for a scholarly chapter is interpretive, and the sources themselves model the caution. Christianity Today's principal historical treatment, by the revival historian **Michael McClymond** of Saint Louis University, deliberately situated Asbury *within* the long revival tradition — invoking Jonathan Edwards's dictum that \"no one can judge a revival secondhand\" and his criteria of discerning a work \"by its fruit\" — and noted features that distinguished it from the celebrity-driven crusade model: the leaders' insistence that \"the only celebrity is Jesus,\" its avoidance of culture-war positioning, and its emphasis on \"ordinary means of grace\" [23]. Other observers were more skeptical; the very fact that the event was contested in real time (authentic revival or mass emotion? sui generis or media artifact?) is itself part of the legacy — the *category* of \"revival,\" with all its evaluative apparatus, descends straight from Edwards's eighteenth-century attempt to distinguish a true \"surprising work of God\" from enthusiasm. Asbury 2023 is best read not as a freak event but as the revival form doing exactly what it has done, on cue, for nearly three centuries — and being argued about in exactly the inherited terms.\n\n---\n\n## IV. The New Religious Movements Born of the Second Awakening's Ferment\n\nThe Second Great Awakening's most distinctive byproduct was not the strengthening of existing churches but the *generation of entirely new ones*. The \"Burned-over District\" of western New York — so named (the phrase is contemporary, popularized by Whitney Cross's classic study) because it had been so repeatedly \"burned over\" by the fires of revival that there was, supposedly, no unconverted fuel left — was the seedbed [24]. Nathan Hatch's *The Democratization of American Christianity* treats several of these movements together precisely because they share a common matrix: the early-republic explosion of popular, anti-elite, charismatic religious entrepreneurship [25].\n\n### Mormonism / the Latter-day Saints\n\nThe paradigmatic case is **Mormonism**. **Joseph Smith**'s family had moved into the Burned-over District (the Palmyra area) by about 1817, into a landscape \"repeatedly swept by religious revivals\" [24]. Smith's foundational \"First Vision\" account (set in 1820) is framed as a response to precisely this revival competition — the boy asking *which* of the contending churches to join. Smith organized the Church of Christ (later The Church of Jesus Christ of Latter-day Saints) in western New York in 1830 [24]. The going-concern scale is global: at the end of 2024 the LDS Church reported a worldwide membership of **17,509,781** across 31,676 congregations, and the church reported passing 17.5 million in its April 2025 statistical report [26]. Whatever one's theological judgment, Mormonism is the largest and most successful new religion to emerge from the Second Awakening's ferment, and it is unambiguously a living institution.\n\n### Adventism and the Millerites / Seventh-day Adventists\n\nA second new tradition came out of the **Millerite** movement — the followers of the Baptist lay preacher **William Miller**, whose biblical calculations led him to predict the Second Advent of Christ for 1843–44. The failure of the prediction (the \"**Great Disappointment**\" of October 22, 1844) did not end the movement; out of its remnant, figures including **Ellen G. White**, James White, and Joseph Bates organized **Seventh-day Adventism** in the following years, formally constituting the denomination in 1863 [27]. The present scale is again global and growing: as of December 31, 2024, the Seventh-day Adventist Church reported worldwide membership of **23,684,237**, a net gain of about 899,000 over 2023, with the engine of growth firmly in the Global South (sub-Saharan Africa, South Asia, Papua New Guinea) [27]. A failed apocalyptic prediction in upstate New York thus became, by way of the Awakening's repeatable mechanism of mobilization, one of the larger Protestant bodies on earth.\n\n### The Restorationist Stone-Campbell movement\n\nA third, more diffuse but very large, inheritance is the **Restoration Movement** (the **Stone-Campbell movement**), which sought to bypass denominational division by \"restoring\" a primitive, New Testament Christianity. Its origins run directly through the Awakening: **Barton W. Stone** was a Presbyterian minister moved by the great **Cane Ridge** revival of 1801 (the camp meeting estimated at some 20,000 attendees), and his \"Christians\" merged on January 1, 1832, with the \"Disciples\" of **Thomas and Alexander Campbell** [28]. The combined movement grew from roughly 25,000 members in 1832 to nearly 200,000 by 1861 [28]. It has since fractured into three principal streams — the **Christian Church (Disciples of Christ)**, the **Churches of Christ**, and the **Christian Churches/Churches of Christ** — whose combined adherents are estimated at roughly several million, though the liberal Disciples of Christ stream in particular has suffered steep late-twentieth-century decline [28 — note]. The Restorationist *idea* — that one can leap behind the whole history of the church to an unmediated New Testament Christianity — is itself a characteristic Awakening-era democratic-religious move, and it persists in much of American nondenominational and \"Bible church\" Christianity.\n\n### The Holiness movement\n\nA fourth offshoot is the **Holiness movement**, which radicalized the Wesleyan-Methodist doctrine of sanctification. Where Methodism taught that believers could, after conversion, be \"entirely sanctified\" in a second work of grace, the Holiness movement (emerging in the 1830s in the U.S. and Canada, intensifying after mid-century) insisted on this \"second blessing\" as a definite, expected, life-transforming experience of \"entire sanctification\" or Christian perfection [29]. It produced its own denominations — most prominently the **Church of the Nazarene** (organized 1908), the **Wesleyan Church**, the **Free Methodist Church**, the **Church of God (Anderson, Indiana)**, and the **Salvation Army** — and, crucially, it was the *direct theological parent of Pentecostalism*, whose \"baptism in the Spirit\" was a development of the Holiness \"second blessing\" [29]. The Holiness movement is the connective tissue linking the Awakening's revivalism to the twentieth century's largest revival movement; Asbury University itself stands in this Wesleyan-Holiness lineage.\n\n---\n\n## V. The Black Church Traditions\n\n### The conversion of the enslaved\n\nThe Awakenings are the historical origin of African-American Christianity. The eighteenth-century revivals, and far more so the Second Awakening's Baptist and Methodist surge, drew enslaved and free Black people into evangelical Christianity in large numbers. The Baptists, in particular, won the most Black converts, because congregational autonomy and lay preaching offered the greatest scope for Black self-expression and leadership [30]. Enslaved converts did not simply receive the masters' religion; they *transformed* it — blending West and Central African religious sensibilities with biblical materials (the Exodus, in particular, became central) into a distinctive Afro-Christianity that offered both consolation and an implicit critique of slavery [30]. The standard scholarly account is Albert J. Raboteau's *Slave Religion: The \"Invisible Institution\" in the Antebellum South* (1978), whose titular concept — the clandestine, unsupervised Black Christianity practiced beyond the master's sight — names the matrix from which the independent Black church would grow [30].\n\n### The rise of the AME Church under Richard Allen\n\nThe institutional turning point was the founding of an *independent* Black denomination. **Richard Allen**, a formerly enslaved man and licensed Methodist preacher, led a withdrawal from St. George's Methodist Episcopal Church in Philadelphia after Black worshippers were subjected to segregated seating, establishing Bethel (\"Mother Bethel\") African Methodist Episcopal Church in 1794 [31]. In 1816, Bethel joined with other Black congregations from Baltimore, New Jersey, and Pennsylvania to form the **African Methodist Episcopal (AME) Church** — the first fully independent Black denomination in the United States — with Allen elected its first bishop [31]. The AME Church remains a going concern: it reports on the order of 7,000 congregations and an estimated 2.5–3.5 million members [31 — note].\n\n### The present-day Black church\n\nThe wider Black church tradition that the Awakenings seeded is a major and distinct component of American religion. Pew's 2023–24 study counts the **historically Black Protestant** tradition at about **5% of U.S. adults** [13]. The largest single body is the **National Baptist Convention, U.S.A., Inc.** (organized 1895), the largest Black church in the country, with a claimed membership on the order of 7.5 million; taken together, the three major predominantly African-American Baptist conventions claim a combined membership in the range of 13 million [32 — note]. These bodies, alongside the AME, AME Zion, and Christian Methodist Episcopal churches, are the living institutional descendants of the \"invisible institution\" and the independent-church movement that the Awakenings made possible. (These self-reported denominational membership figures should be treated as institutional claims rather than independently audited counts; Pew's population-survey figure is the more methodologically conservative number.)\n\n---\n\n## VI. The Political-Cultural Legacy: Reform and the Religious Right\n\n### The reform impulse\n\nThe activist mark of evangelicalism (the \"A\" in Bebbington's quadrilateral) translated, in the nineteenth century, into a vast revival-driven reform enterprise. The \"benevolent empire\" of voluntary societies — for temperance, Sunday schools, Bible and tract distribution, prison reform, women's moral organization, and, most consequentially, abolition — drew its energy and many of its personnel directly from the revivals; Finney himself made revival and reform (including antislavery) continuous [25]. This is the historiographically contested ground between the \"social control\" reading (revival-reform as middle-class discipline imposed on the disorderly) and the \"democratization\" reading (revival as genuine popular empowerment) — a debate mapped fully in the chapter on the historiographical debates. For present purposes the point is that the entanglement of revivalist religion with American reform movements is a permanent feature of the political landscape the Awakenings created.\n\n### The Religious Right and the contested origin story\n\nIn the late twentieth century, the activist impulse re-entered politics on the right, in the movement conventionally called the **Religious Right** (or Christian Right). Its present-day form — the political mobilization of conservative, predominantly white evangelicals — is the most visible contemporary expression of the Awakenings' legacy, and it is the subject of an active and contested scholarship that a doctoral-register chapter must engage by name.\n\nThe historian **Randall Balmer** advances what he calls a debunking of \"the abortion myth.\" The conventional story holds that evangelicals mobilized politically in reaction to *Roe v. Wade* (1973). Balmer argues this is false: in the immediate aftermath of *Roe*, many leading evangelicals, including Southern Baptist figures, were muted or even approving, and the actual catalyst for the movement's organization was the federal government's threat (via the IRS) to the tax-exempt status of segregated Christian schools such as Bob Jones University. On Balmer's account — developed in *Bad Faith: Race and the Rise of the Religious Right* — abortion was adopted *later*, as a more \"high-minded\" rallying cause than the defense of segregation, a sequence Balmer says the movement's own architect Paul Weyrich effectively conceded [33]. Balmer's thesis is itself contested by other evangelical historians, who argue it overstates a single mechanism; the dispute is live and belongs in the debates chapter, but Balmer's intervention is a major recent reframing of how the Awakenings' activist legacy became Republican-aligned.\n\nA second major recent intervention is **Kristin Kobes Du Mez**'s *Jesus and John Wayne: How White Evangelicals Corrupted a Faith and Fractured a Nation* (2020), which argues that white evangelical support for Donald Trump represents not a betrayal but a *fulfillment* of a long-cultivated evangelical culture of militant, patriarchal masculinity — a seventy-five-year arc in which a \"rugged warrior\" ideal, not doctrine narrowly construed, became the binding identity [34]. Du Mez's book, a surprise bestseller, reframes contemporary evangelicalism as a cultural and gendered formation as much as a theological one. Together with the work of **Mark Noll** (the intellectual history of evangelicalism), **Grant Wacker** (Pentecostalism and Graham), and **Molly Worthen** (the \"crisis of authority\" in modern American evangelicalism), these scholars constitute the present-day historiographical conversation about what the Awakenings ultimately wrought — and their disagreements are themselves part of the living legacy, since the *meaning* of American evangelicalism remains genuinely unsettled.\n\n---\n\n## VII. The Historiographical Frame: \"The Great Awakening\" as a Contested Category\n\nA present-state chapter must register that even the *name* of its subject is contested — and that this contest is itself a living scholarly enterprise. The phrase \"the Great Awakening\" was not used by the eighteenth-century participants in its modern sense; it was substantially a nineteenth- and twentieth-century retrospective construction. Jon Butler's influential 1982 argument that \"the Great Awakening\" is an \"interpretive fiction\" — that historians invented a unified \"event\" out of scattered, regionally distinct revivals — is the sharpest version of the skeptical case, and it remains a fixture of the syllabus (it is taken up in full in the chapter on the historiographical debates). For the legacy chapter, the relevant point is that the *interpretive category* through which Americans understand their own religious history is one of the Awakenings' downstream products: the recurring American expectation of, and argument about, \"revival\" and \"awakening\" — whether the 1857–58 businessmen's revival, the 1906 Azusa outpouring, the Graham crusades, or Asbury 2023 counts as the \"next great awakening\" — is a habit of religious self-interpretation that the original events bequeathed. The category is part of the legacy.\n\nNathan Hatch's *The Democratization of American Christianity* (1989) is the indispensable bridge between the history and the present landscape, because it explains *why* the legacy took the populist, anti-elite, entrepreneurial shape it did. Hatch argues that in the early republic, common people seized religious initiative from educated elites, and he treats five mass movements together — the Christian/Restorationist movement, the Methodists, the Baptists, the Black churches, and the Mormons — as a single democratizing wave [25]. The \"dialectic of decentralization and charisma,\" Hatch argues, became the enduring source of American evangelicalism's strength [25]. That is, in one sentence, the thesis that the present landscape — a competitive, decentralized, charismatic, entrepreneurial, revivalist Protestantism, perpetually generating new movements — is the *direct structural inheritance* of the Awakenings. Every present-tense datum in this chapter is, on Hatch's reading, that dialectic still running.\n\n---\n\n## Open Questions\n\n1. **Is the leveling-off of Christian decline durable or a pause?** Pew's 2023–24 finding that the Christian share has stabilized since ~2019 and the \"nones\" have plateaued is recent and striking, but Pew itself frames the plateau as possibly temporary [13][14]. Whether the evangelical/revivalist core has reached a stable floor or is in a longer secular decline is the single most consequential open question for the legacy's future, and it is taken up in the outlook.\n\n2. **What is the precise current size of the Stone-Campbell streams and the Black Baptist conventions?** Several figures here (the ~7 million combined Restorationist estimate; the National Baptist conventions' ~13 million combined claim; the AME's 2.5–3.5 million) rest on self-reported denominational claims of varying recency and audit quality. A rigorous present-state count would reconcile these against Pew/ARDA survey-based estimates, which tend to be lower.\n\n3. **How should the post-disaffiliation UMC and the new Global Methodist Church be sized going forward?** The UMC's detailed U.S. statistics lag (2022 granular data) even as headline membership figures are updated to 2025; the GMC's congregation count comes substantially from its own reporting. A clean year-end 2025/2026 audited count for both bodies is not yet available.\n\n4. **Does Pentecostalism's global scale belong to \"the American Awakenings' legacy,\" and how much?** The 644-million global Pentecostal figure is a legacy claim only insofar as Azusa Street (1906) is treated as the movement's headwater; some scholarship emphasizes polygenesis (multiple independent origins worldwide). The attribution is defensible but not uncontested.\n\n5. **Is the Religious Right best understood as a *religious* legacy of the Awakenings or as a *political* formation that recruited evangelical identity?** The Balmer (\"racism/segregation, not abortion\") and Du Mez (\"militant masculinity, not doctrine\") theses both, in different ways, locate the binding force of contemporary political evangelicalism *outside* the classic Bebbington quadrilateral — which raises the question of how much of the \"evangelical\" political bloc is actually carrying the Awakenings' theological DNA versus a cultural identity wearing its name.\n\n6. **How is \"revival\" being redefined in a digital age?** Asbury 2023 spread by social media even as its own interpreters (McClymond) stressed its *anti*-digital, embodied character. Whether the next \"great awakening,\" if there is one, is even legible in the inherited, place-bound, embodied category is an open interpretive question.\n\n---\n\n## Sources\n\n1. The Gospel Coalition / Bebbington scholarship summaries; David W. Bebbington, *Evangelicalism in Modern Britain: A History from the 1730s to the 1980s* (1989), as described in \"David Bebbington on Evangelical Preaching in North America,\" The Gospel Coalition (Evangelical History blog), accessed 2026-06-19, https://www.thegospelcoalition.org/blogs/evangelical-history/david-bebbington-evangelical-preaching-north-america/ — Tier 2 (the monograph) / Tier 5 (the summarizing blog). Defines the conversionism–biblicism–activism–crucicentrism quadrilateral and notes the NAE's use of it. *Note: the primary monograph was not read in the original — see primary texts not consulted.*\n\n2. \"Revivalism | Definition, History, & Facts,\" Encyclopædia Britannica, accessed 2026-06-19, https://www.britannica.com/topic/revivalism-Christianity — Tier 2 (expert-authored reference). T m's death 2018.\n\n17. \"William Seymour and Azusa Street Revival,\" The Association of Religion Data Archives (ARDA) timeline, and Assemblies of God / Christian History Institute accounts, accessed 2026-06-19, https://www.thearda.com/us-religion/history/timelines/entry?etype=1&eid=211 — Tier 2/5. Source of: April 9, 1906 start; Seymour; Parham's Houston school; interracial character; missionary diaspora.\n\n18. \"Status of Global Christianity, 2025,\" Center for the Study of Global Christianity, Gordon-Conwell Theological Seminary, January 2025, https://www.gordonconwell.edu/center-for-global-christianity/research/global-pentecostalism/ — Tier 2 (the standard global-Christianity statistical body). Source of ~644 million Pentecostals (~8% of world population, ~26% of Christians); broader Pentecostal/Charismatic counts >660M.\n\n19. \"The Assemblies of God in 2024,\" Ryan Burge (Graphs About Religion), and Christianity Today, \"Assemblies of God Growing with Pentecostal Persistence,\" 2021, accessed 2026-06-19 — Tier 5 (a religion-statistics analyst; CT reporting). Source of the AG as a growth outlier (~13,000 U.S. congregations; Hispanic-driven growth). *AG's own 2024 totals are self-reported denominational counts; flagged.*\n\n20. \"Charismatic Movement,\" Hartford Institute for Religion Research, https://hirr.hartfordinternational.edu/articles/4201/, and Episcopal Church glossary, accessed 2026-06-19 — Tier 2/5. Source of: Dennis Bennett (April 3, 1960, Van Nuys); spread into mainline Protestant families and Roman Catholic Church (1967); tens of millions reached.\n\n21. \"The Outpouring Story of Revival,\" Asbury University, https://www.asbury.edu/about/revival-history/outpouring/ — Tier 1 (the institution's own account; primary for what Asbury claims happened, with self-interest caveat). Source of: February 8, 2023 start in Hughes Auditorium; ~16 days; culminating Feb 23 student service; spread to seminary chapels; visitor estimates.\n\n22. \"2023 Asbury revival,
