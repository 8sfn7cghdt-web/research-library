s's *Some Thoughts* (1742): https://www.encyclopedia.com/people/.../charles-chauncy (accessed 2026-06-19). **Tier 1 primary text (scan located; argument summarized from Tier 2/5); the Old Light manifesto against enthusiasm.**\n23. New Lights / Old Lights definitions — EBSCO \"First Great Awakening\" research starter, https://www.ebsco.com/research-starters/history/first-great-awakening (accessed 2026-06-19). **Tier 5 (reference; orientation for the Congregational party labels).**\n24. Charles Chauncy, biography and theological trajectory — Britannica, https://www.britannica.com/biography/Charles-Chauncy-American-clergyman-1705-1787 ; First Church Boston history, http://www.firstchurchbostonhistory.org/charleschauncy.html (accessed 2026-06-19). **Tier 2/5 reference; Boston First Church ~60 years; rejection of total depravity; move toward Unitarianism/universalism.**\n25. Chauncy's later universalism and liberal theology — Encyclopedia.com, https://www.encyclopedia.com/people/philosophy-and-religion/protestant-christianity-biographies/charles-chauncy (accessed 2026-06-19). **Tier 5 reference (a single main source for the private-universalism point; treat with caution).**\n26. \"James Davenport (clergyman),\" overview of 1742 Hartford arraignment (\"enthusiastical impressions\"), 1743 New London bonfire — https://en.wikipedia.org/wiki/James_Davenport_(clergyman) (used to locate facts; cross-checked with [27]) (accessed 2026-06-19). **Reference (orientation); facts cross-checked.**\n27. \"A Pants-Free Preacher Starts a Bonfire of the Vanities in New London,\" New England Historical Society, https://newenglandhistoricalsociety.com/a-pants-free-preacher-starts-a-bonfire-of-the-vanities-in-new-london/ ; Peter S. Onuf et al. via The Historian, \"James Davenport's Post-Bonfire Ministry, 1743–1757,\" https://www.tandfonline.com/doi/abs/10.1111/j.1540-6563.1996.tb00984.x (accessed 2026-06-19). **Tier 5 (popular history) + Tier 2 (peer-reviewed article on Davenport's later career); the March 1743 bonfire, the breeches episode, the 1744 retractions.**\n28. Jonathan Edwards, *The Distinguishing Marks of a Work of the Spirit of God* (1741) — primary text referenced via Christian History Institute and edwardsstudies.com summaries, https://christianhistoryinstitute.org/study/module/edwards (accessed 2026-06-19). **Tier 1 primary (referenced via Tier 5 commentary); bodily phenomena neither prove nor disprove a true work.**\n29. Jonathan Edwards, *A Treatise Concerning Religious Affections* (1746) — primary text via summaries, https://en.wikipedia.org/wiki/Religious_Affections and https://edwardsstudies.com/2016/03/23/book-review-brief-the-religious-affections/ (accessed 2026-06-19). **Tier 1 primary (referenced via Tier 5 commentary); \"holy affections\" criterion; 1742–43 sermon origin.**\n30. Old Side / New Side schism (1741), Synod of New York (1745), Adopting Act (1729), 1758 reunion — Orthodox Presbyterian Church, \"Old Side versus New Side, 1741,\" https://www.opc.org/nh.html?article_id=46 ; This Day in Presbyterian History, https://thisday.pcahistory.org/2013/05/may-27-old-sidenew-side-split-1741-1758/ (accessed 2026-06-19). **Tier 5/6 (confessional church histories; used for institutional/datable facts, which are non-controversial and corroborated across sources); the three issues (education, itinerancy, subscription).**\n31. Alan Heimert, *Religion and the American Mind: From the Great Awakening to the Revolution* (Harvard University Press, 1966) — Cambridge Core review listing, https://www.cambridge.org/core/journals/historical-journal/article/abs/... ; \"Revivals and Revolution: Historiographic Turns since Alan Heimert's *Religion and the American Mind*,\" *Church History* (Cambridge), https://www.cambridge.org/core/journals/church-history/article/abs/revivals-and-revolution-historiographic-turns-since-alan-heimerts-religion-and-the-american-mind/A40FCB40662F3E2E1D2329BDE715A75A (accessed 2026-06-19). **Tier 2 monograph + Tier 2 review essay; the Calvinism-as-engine-of-Revolution thesis; inversion of Parrington; initial hostile reception then influence.**\n32. Edmund S. Morgan's 1967 *William and Mary Quarterly* review of Heimert, and the contested reception of the Heimert thesis — referenced via [31] historiographic essay and review listings, https://academic.oup.com/jah/article-abstract/54/1/108/739327 (accessed 2026-06-19). **Tier 2 (review literature referenced, not read in full); Heimert's thesis as contested, not established.**\n33. Butler's four specific objections (chronological, geographical, social, terminological) — reconstructed from \"The First Great, or not so Great, Awakening,\" HJ International Graduate School, https://www.jus.hji.edu/2022/01/10/the-first-great-or-not-so-great-awakening-and-what-it-means-for-today/ and [2] (accessed 2026-06-19). **Tier 5 (graduate-school essay summarizing Butler; used because Butler's full text is paywalled — best confirmed against the original).**\n34. Thomas S. Kidd, *The Great Awakening: The Roots of Evangelical Christianity in Colonial America* (Yale University Press, 2007) — publisher/edition, https://www.amazon.com/Great-Awakening-Evangelical-Christianity-Colonial/dp/0300118872 ; Cambridge *Church History* review, https://www.cambridge.org/core/services/aop-cambridge-core/content/view/3819A1606180EB55206F705D18B98458/ (accessed 2026-06-19). **Tier 2 monograph + Tier 2 review; the \"long First Great Awakening\" defense; revival as birth of evangelicalism.**\n35. Kidd's epilogue argument (\"there was, indeed, a First Great Awakening, but it was a long Great Awakening and produced … evangelicalism\") and spiritual-equality/democratic-style claims — University of Chicago *Journal of Religion* review, https://www.journals.uchicago.edu/doi/10.1086/654860 ; MUSE review, https://muse.jhu.edu/article/419649/summary (accessed 2026-06-19). **Tier 2 reviews of Kidd; the defender's resolution of the invention debate.**\n\n---\n\n*Sourcing note (a word on honesty):* Several Tier 1 primary texts (the Yale *Works of Jonathan Edwards*, Whitefield's *Journals*, Chauncy's *Seasonable Thoughts*, Franklin's *Autobiography*) and Tier 2 monographs (Butler 1982, Lambert 1999, Kidd 2007, Heimert 1966, Marsden 2003, Stout 1991, Morgan 1963, Bonomi 1986) were identified and their arguments reconstructed from publisher pages, peer-reviewed reviews, and scholarly summaries, but were **not read in their original critical editions**. Where the argument of a paywalled primary source (notably Butler's \"interpretative fiction\" essay) is load-bearing, that is noted in the relevant Sources entry. No citation, statistic, or quotation here is invented; figures attributed to contemporaries (e.g., Franklin's 30,000) are presented as *their* estimates with modern caveats, not as audited facts."}, {"order": 2, "file": "02_Modern_Arc.md", "title": "The Modern Arc — The Interval and the Second Great Awakening", "summary": "", "body": "# The Modern Arc — The Interval and the Second Great Awakening\n\n## Bottom Line\n\nBetween the colonial revival of George Whitefield's 1739–41 itinerancy and the antebellum settlement of American Protestantism lies a half-century that the textbook narrative compresses into a single arrow — \"First Awakening to Second Awakening\" — and that the scholarship has spent seventy years complicating. The interval was not a flat trough of irreligion punctuated by two bursts of \"Awakening.\" It was a continuous, regionally uneven churning in which the *legal* order of American religion was overturned (disestablishment, the move from a tax-supported establishment to a voluntary, competitive religious market), the *theological* order was renegotiated (a long drift from Calvinist sovereignty toward human agency, free will, and the \"power to the contrary\"), and the *institutional* order was inverted (the colonial establishments — Congregational and Anglican — were overtaken and then dwarfed by the populist, mobile, low-barrier Methodists and Baptists). The thing we call the \"Second Great Awakening\" is best read not as a single event but as at least three loosely contemporaneous and quite distinct phenomena: the trans-Appalachian camp meeting (McGready's Logan County revivals of 1797–1800, the Cane Ridge communion of August 1801 under Barton Stone, the bodily \"exercises\"); New England's gentler, orderly revivals led by Edwards's heirs (Timothy Dwight at Yale, Asahel Nettleton, Lyman Beecher), which resembled Edwards more than Finney and which *predated* Cane Ridge; and the urban-commercial revivalism of upstate New York's \"Burned-over District,\" where Charles Grandison Finney's \"new measures\" and his redefinition of revival as the predictable \"result of the right use of constituted means\" rather than \"a miracle\" crystallized the new order. The half-century's deepest legacy is the institutional one — by 1850 Methodists and Baptists together held a majority of American church members, and the Congregationalists who had led in 1776 had collapsed to a rump — and the historiographical debate over *why* (Hatch's democratization, Paul Johnson's social-control/market-revolution reading, the older \"frontier\" and \"social control\" theses, Boles's Calvinist-continuity counter-case) remains live and unsettled.\n\n---\n\n## I. The Problem of the Interval (1740s–1790s): Did the Fire Go Out?\n\nThe conventional periodization gives the \"First Great Awakening\" a clean death \"sometime during the 1740s\" and then resurrects revival fifty years later as the \"Second Great Awakening,\" beginning \"in the 1790s … in New England\" [1]. This tidy obituary-and-resurrection is exactly the kind of narrative tidiness the modern scholarship distrusts. To treat the interval as a religious vacuum is to mistake the absence of a *named* trans-colonial event for the absence of revival activity — and to import, uncritically, the very category (\"the Great Awakening\") whose coherence the historiography has called into question.\n\n**The invention critique.** Jon Butler's now-canonical intervention argued that the unified \"Great Awakening\" of the textbooks is largely a retrospective construction — an \"interpretive fiction\" of later historians who stitched scattered, regionally distinct, denominationally various revivals into a single national \"event\" they never were at the time [2]. Butler's *Awash in a Sea of Faith* (1990) pressed the point that American religious history had been distorted by a Puritan-Evangelical lens that overweighted \"Awakenings\" and underweighted the slow, institutional \"Christianization\" of the population across the whole eighteenth and nineteenth centuries — including, crucially, the supposedly dead interval [2]. If the *First* Awakening's unity is an artifact of hindsight, then the \"interval\" between two Awakenings is partly an artifact of the same hindsight: it looks empty only because we have agreed to call the bursts on either side \"Awakenings\" and the middle \"the lull.\"\n\n**What actually continued.** Revival activity did not cease in 1745. Localized awakenings recurred through the 1750s, 1760s, and 1770s — in the Separate Baptist expansion through the southern backcountry, in Presbyterian and Baptist growth in Virginia, in scattered New England parish revivals. The Separate and Baptist movements that fed the later explosion were *gathering force* during the so-called lull, not waiting in suspended animation. The continuity case is strongest in the South, where John Boles's *The Great Revival, 1787–1805* (1972) reframed the frontier awakening as the maturation of a Reformed sacramental and revival tradition with deep colonial roots, not a sudden eruption (see §IV.a) [3].\n\n**The Revolution as a genuine disruption.** That said, the interval's middle decades — roughly 1775–1790 — were a real low point for institutional religion, for reasons that had little to do with any waxing or waning of \"revival\" as such and everything to do with the war. Church life was physically disrupted; clergy were scattered; the Church of England in America was devastated by the loyalty crisis of its clergy (below, §II). Finke and Stark, working backward from membership records, estimate the national rate of religious *adherence* (formal church membership or affiliation) at roughly **17 percent in 1776** — \"fewer than one in five Americans\" were active church members — with about 3,200 congregations and an estimated 242,000 members [4]. That figure is contested (the estimate of who counts as \"active\" is doing heavy lifting, and critics such as Mark David Hall argue it understates the religiosity of a population that *attended* far more than it *joined* under the demanding membership standards of the established churches) [5]. But however one reads the number, the founding-era population was, by the standard of what came after, lightly churched — and the half-century that followed would more than double the adherence rate.\n\n**The upshot.** The interval is best understood not as a fire that went out and relit, but as the period in which the *conditions* for a different kind of revival were assembled: a war that broke the old establishments, a constitutional and state-level settlement that disestablished them, a theological renegotiation already underway in Edwards's New England heirs, and a frontier filling with unchurched settlers whom the mobile sects were uniquely equipped to reach.\n\n> **Term of art — \"revival\" and \"awakening.\"** Here *revival* denotes a concentrated, often communal intensification of conversion activity within existing congregations or gatherings; *awakening* is the larger, historian-applied label for a cluster of revivals treated as an epoch. The distinction matters: revivals were continuous and local; \"the Awakening\" is the contested aggregate.\n\n---\n\n## II. The American Revolution's Religious Effects and the Coming of Disestablishment\n\n### The collapse of the Anglican establishment\n\nThe Revolution's most immediate religious casualty was the Church of England in America. Anglican clergy had sworn oaths of allegiance to George III, and the war forced an excruciating choice. A meticulous accounting finds that only about **27 percent of Anglican ministers in the colonies supported the Revolution** — most of those in Virginia — while north of Pennsylvania, of fifty-five Anglican clergy, only three supported it [6]. More than half the Anglican priests in America relinquished their pulpits during the war; with taxes uncollected and church property forfeited, the establishment was, in the historians' phrase, \"on life support\" [6]. The post-war reorganization of these congregations into the independent Protestant Episcopal Church (1789) was a reconstruction from near-collapse, not a continuation. The largest pre-war establishment had been gutted precisely at the moment the religious landscape was opening to competition.\n\n### From establishment to the voluntary principle\n\nHere lies the single most consequential structural change of the whole arc — more consequential, arguably, than any revival. The colonies had inherited the European assumption that a polity required an *established* church: a single denomination supported by compulsory taxation and granted legal privileges (the Congregational establishment in most of New England, the Anglican establishment in the South). The Revolution and its aftermath dismantled this. In its place came the **voluntary principle**: the doctrine, soon the lived reality, that churches must be supported by the freely given contributions of their adherents and must compete for those adherents in an open market with no state favor.\n\n> **Term of art — disestablishment / the voluntary principle.** *Disestablishment* is the legal severing of the tie between the state and a privileged church: the end of compulsory religious taxation and of legal preference for one denomination. *The voluntary principle* (or \"voluntaryism\") is the resulting order in which religious bodies live entirely on voluntary support and compete for members. Together they constitute the move from a *coerced, monopolistic* religious order to a *voluntary, competitive* one.\n\nThe chronology of disestablishment ran in stages across roughly half a century:\n\n- **Virginia, 1786.** Thomas Jefferson's *Bill for Establishing Religious Freedom*, drafted in 1777 and shepherded through the General Assembly by James Madison, disestablished the Church of England in Virginia and guaranteed religious liberty to all faiths. It capped a ten-year struggle and became the intellectual template for the religion clauses of the First Amendment (ratified 1791) [7]. The Virginia statute is the hinge document: the largest southern establishment was dissolved by deliberate legislative act, not by collapse alone.\n\n- **The federal settlement, 1791.** The First Amendment forbade Congress to establish a religion — but it bound only the *federal* government, leaving the states free to retain their establishments. Disestablishment at the *state* level therefore proceeded on its own timetable.\n\n- **Connecticut, 1818.** A Republican landslide produced a constitutional convention whose new constitution disestablished the Congregational church, placing \"all sects\" on a footing of voluntary support [8].\n\n- **Massachusetts, 1833.** The last state establishment fell when Massachusetts voters approved (by roughly 3-to-1) the removal of Article III from the state constitution, ending tax support for Congregationalism and affirming the equality of \"all religious sects and denominations\" [9]. John Witte and Justin Latterell call Massachusetts \"the last American establishment,\" dissolved only in 1833 [10].\n\n**Why this is the master-variable.** The Finke–Stark \"religious economy\" model reads the entire subsequent history through this change: once the state stopped propping up a monopoly church, religion became a *market*, and in markets the energetic, low-cost, customer-responsive \"upstart sects\" win while the comfortable, subsidized, high-barrier establishments lose [11]. One need not adopt the rational-choice economics to grant the descriptive point: the denominations that grew fastest after disestablishment (Methodists, Baptists) were exactly the ones structurally built for a competitive, voluntary market, and the ones that declined (Congregationalists, Episcopalians) were the former establishments. Whatever else the Second Great Awakening was, it was the first great test of the American voluntary religious market — and the establishments lost it.\n\n### The \"infidel\" scare and the supposed nadir of the 1790s\n\nInto this disrupted, disestablishing landscape came the perception — vivid in the sources, harder to quantify in fact — of a religious *nadir* in the 1790s: a high tide of Enlightenment rationalism, deism, and outright \"infidelity,\" especially among the educated young. Lyman Beecher, recalling his Yale undergraduate years in the 1790s, described the college as a hotbed of skepticism and immorality where students openly embraced Enlightenment ideas and (in the standard anecdote) called one another by the names of Voltaire, Rousseau, and other *philosophes* [12]. Timothy Dwight assumed Yale's presidency in 1795 precisely to do battle with this \"infidelity\" [12, 13].\n\nHow real was the nadir? The perception was real and consequential — it framed how the New England revivalists understood their own work, as a counter-reformation against rationalism. But it should be read with care: the \"1790s nadir\" is partly a trope, retailed by the very revivalists who then claimed credit for reversing it, and partly a genuine reflection of the post-war institutional low and the cultural prestige of Paine's *The Age of Reason* (1794–95) and French revolutionary deism. The most defensible synthesis: the 1790s were a *low ebb of institutional religion's cultural confidence*, not a literal absence of vital religion (revivals were already breaking out in Connecticut by 1797–98, below), and the \"nadir\" narrative was as much a mobilizing self-description as a demographic fact.\n\n---\n\n## III. \"Not a Single Thing\": The Second Great Awakening as Plural\n\nThe decisive interpretive move of modern scholarship is to *stop treating the Second Great Awakening as one phenomenon.* The events lumped under the label differ in geography, social setting, denominational mix, emotional register, theology, and method. A frontier camp meeting in Logan County and a parlor-quiet conversion at Yale and a businessman's protracted meeting in Rochester are not three instances of one thing; they are three different religious cultures that happened to overlap in time. The convention of the JMU historiographical literature — and of Curtis Johnson's quantitative work — is to insist that the \"Awakening\" dissolves, on close inspection, into formalist vs. anti-formalist, Calvinist vs. Arminian, Old School vs. Oberlin, rural vs. urban, North vs. South [14]. What follows maps the three principal theatres.\n\n---\n\n## IV. Theatre One — The Trans-Appalachian Frontier and the Camp Meeting\n\n### (a) McGready and the Logan County revivals, 1797–1800\n\nThe frontier revival's prehistory runs through **James McGready**, a Presbyterian minister of fierce, hell-fire preaching who took charge of three small Logan County, Kentucky congregations — Red River, Muddy River, and Gasper River — in 1796 [15]. McGready bound his people to a \"covenant\" of concerted prayer for revival. By 1797 men of his congregations were spending days in the woods under \"conviction,\" and at the **sacramental meeting at Red River in June 1800**, the gathering — modeled on the four-day Scottish communion season (\"Holy Fair\") — broke into sustained emotional intensity, with attendees camping on the grounds rather than dispersing [15, 16]. This spontaneous encampment is conventionally taken as the birth of the **camp meeting** as an institution. McGready and his colleagues immediately organized another at **Gasper River in late July 1800**, where a crowd estimated at several thousand came from up to a hundred miles away, wagons and all [15].\n\n> **Term of art — camp meeting.** A *camp meeting* is a multi-day outdoor religious gathering at which attendees camp on the grounds, with continuous preaching (often by ministers of several denominations), prayer, and communion. It grew out of the Presbyterian \"sacramental season\" / Scottish communion tradition but was adopted and standardized above all by the Methodists, for whom it became a signature frontier instrument.\n\nThe continuity John Boles stresses (*The Great Revival, 1787–1805*) is theological as well as liturgical: McGready and his fellow frontier Presbyterians were Calvinists who \"submerged the fine distinctives\" of their Calvinism in the heat of revival to preserve their role as revivalists, and the Calvinism of Presbyterians and Baptists alike was \"mitigated\" in the frontier awakening [3, 17]. Boles reads the frontier revival as the maturation of a Reformed sacramental tradition with colonial roots — a continuity claim that cuts against any reading of Cane Ridge as a *sui generis* eruption [3].\n\n### (b) Cane Ridge, August 1801, and Barton Stone\n\nThe frontier awakening's emblematic event was the **Cane Ridge communion**, held **6–12 August 1801** at the Cane Ridge Meeting House in Bourbon County, Kentucky, near Paris, under the Presbyterian minister **Barton W. Stone**, who had visited McGready's Logan County meetings and returned determined to hold his own [18, 19]. It was a sacramental meeting on the Scottish model — Friday and Saturday preaching, Sunday communion — that swelled into the largest and most famous camp meeting of the era [18, 19]. Roughly **eighteen Presbyterian ministers** participated alongside numerous Methodist and Baptist clergy, preaching simultaneously from stumps and wagons across the grounds [19].\n\n**The crowd estimate and its uncertainty.** Contemporary estimates put attendance between **10,000 and 20,000** (some sources stretch to 25,000) — a staggering figure given that Kentucky's *entire recorded population* in 1800 was only about a quarter-million, so that even the low estimate represents nearly one in twenty-five Kentuckians [18, 19]. The figure is necessarily soft: there was no systematic counting, the *Encyclopedia of the Stone–Campbell Movement* notes that logistical constraints suggest no more than ~10,000 at any single moment (with up to 20,000 across the week), and Stone himself disclaimed precision, writing that a full description \"would fill a large volume, and then the half would not be told\" [19]. Paul Conkin's careful reconstruction, *Cane Ridge: America's Pentecost* (1990), is the standard scholarly treatment of both the event and the estimate problem [19].\n\n**The bodily \"exercises.\"** What made Cane Ridge notorious — and divided observers then and historians since — were the involuntary **bodily exercises**. In his *Autobiography* Stone catalogued them: the *falling* exercise (worshippers dropping \"as men slain in battle,\" some lying motionless for hours); the *jerks* (the head or whole body snapping back and forth so violently that, in one repeated description, women's loosened hair would \"crack like a carriage-whip\"); and the *dancing*, *running*, *barking*, *laughing*, and *singing* exercises [18, 19]. Estimates of \"the slain\" who fell ran from one to three thousand; communicants from 800 to 3,000; conversions in the same range — all soft numbers from participants without systematic counting [19]. The exercises are the sharpest marker distinguishing the frontier theatre from the New England one: nothing of the kind characterized Dwight's Yale or Nettleton's Connecticut.\n\n### (c) The aftermath: schism, the Restoration impulse, and the mobile denominations\n\nCane Ridge fractured frontier Presbyterianism. Stone and several colleagues, uneasy with Calvinist orthodoxy and with the revival's tension against confessional discipline, withdrew from the Synod of Kentucky and formed the short-lived **Springfield Presbytery (1803)** — which they then dramatically dissolved on **28 June 1804** with the *Last Will and Testament of the Springfield Presbytery*, a tract willing \"that this body die, be dissolved, and sink into union with the Body of Christ at large,\" renouncing all sectarian names in favor of \"Christian\" alone and the Bible as sole standard [20]. This is conventionally dated as a founding moment of the **Restoration Movement** (the Stone–Campbell tradition that would produce the Disciples of Christ and Churches of Christ) — one of the new religious bodies the era generated. (The fuller story of the new movements — Restorationism, Mormonism, Adventism, the Black churches — is taken up later, in the chapter on the living legacy; here it suffices to note that the frontier theatre's most distinctive institutional issue was a *new denomination born of schism*.)\n\nBut the frontier theatre's largest institutional beneficiaries were not the Presbyterians who had pioneered it; they were the **Methodists and Baptists**, who adopted the camp meeting and out-competed everyone for the unchurched frontier. The Methodist instrument was the **circuit rider** — an itinerant preacher who covered a vast circuit on horseback, served by a tier of **local exhorters and class leaders** below the ordained ministry. **Francis Asbury**, the founding bishop of American Methodism (consecrated 1784), set the pace: he is reported to have traveled some 270,000 miles and preached 16,000 sermons over his career [21]. **Peter Cartwright**, the era's most famous circuit rider, became a licensed exhorter at seventeen and left an *Autobiography* that became a classic of frontier literature — recounting swollen-river crossings, fistfights with rowdies, and the rough democracy of frontier Methodism [21]. The system's genius was structural: one mounted preacher could serve dozens of communities, and the low barrier to entry (an exhorter or local preacher needed conviction and a circuit, not a Yale degree) let the denomination scale at the speed of settlement. This is the mechanism behind the numbers in §VI.\n\n---\n\n## V. Theatre Two — New England's Orderly Revivals: Edwards's Heirs, Not Finney's Forerunners\n\nThe most important corrective the scholarship insists upon — and the one most often lost in the popular conflation of \"the Second Great Awakening\" with camp meetings — is that **New England had its own, quite different revival, and that it began *before* Cane Ridge and resembled Jonathan Edwards far more than it resembled Finney.**\n\n### Chronology: New England moved first\n\nBy the late 1790s the Edwardsian (\"New Divinity\" / Hopkinsian) ministers of Connecticut were already seeing a wave of parish revivals. Thirty Congregational churches in northwest Connecticut admitted some **1,699 new members between 1798 and the end of 1800** — *before* both Cane Ridge (1801) and Dwight's Yale revival (1802) [22]. By the autumn of 1799 Samuel Hopkins could rejoice that \"a remarkable revival of religion has lately taken place in New England and part of New York State … in more than 100 towns mostly if not wholly under the preachers of Edwardean divinity\" [22]. The New England revival, in other words, was not a transplanted echo of the frontier; it had its own indigenous origin in the Edwardsian tradition, and it ran ahead of the camp-meeting theatre.\n\n### Character: orderly, intellectual, decorous\n\n**Timothy Dwight** — grandson of Jonathan Edwards — became president of Yale in 1795 and waged a deliberate campaign against the deism and \"infidelity\" he found among the students [12, 13]. The **Yale revival of 1802** was its fruit: roughly a third of the student body (the college then numbered about 230) professed conversion [13]. But it bore no resemblance to Cane Ridge. There were no jerks, no falling, no barking; the revival was sober, argued, intellectual — conversion by persuasion and conviction, not by bodily paroxysm. Dwight's instrument was the reasoned sermon and the personal cultivation of doubting young men.\n\n**Asahel Nettleton** (1783–1844) was the New England theatre's purest revivalist. Converted in 1801–02 after intensive reading of Edwards, ordained in 1811, Nettleton spent the 1810s and 1820s as an itinerant evangelist through Connecticut and New England whose method was the opposite of Finney's improvisation: he would move into a community for weeks or months, study its spiritual condition, work *through and with* the settled pastor, refuse invitations he judged insincere, and studiously avoid emotional excess and self-promotion [23]. His revivals were famous for producing durable conversions \"with few apostasies,\" in Bennet Tyler's accounting [23]. Nettleton's whole theory of revival was Edwardsian: revival is a *surprising work of God*, to be sought by prayer and faithful preaching and received with order, not engineered by technique.\n\n**Lyman Beecher** (1775–1863) — Yale-trained under Dwight, the era's great organizer — bridged the New England revival into the institutional and reform projects of the benevolent empire (below). Beecher is the figure who most sharply registers the *collision* between the two theatres when Finney's methods came east.\n\n### The confrontation: New Lebanon, 1827\n\nThe clash between the orderly New England tradition and Finney's \"new measures\" came to a head at the **New Lebanon Conference (New Lebanon, New York, July 1827)**, convened — chiefly by Lyman Beecher and Nathan Beman — to examine, and hopefully to restrain, the new measures spreading from Finney's western New York revivals [24]. Nettleton and Beecher came as the champions of order; they regarded the new measures (the anxious bench, praying for individuals by name, women praying in mixed assemblies, the \"hasty\" admission of converts) as theological errors — a practical denial of original sin and divine sovereignty — and as fanaticism [23, 24]. The week-long meeting \"essentially ended in a standoff\": it clarified the differences without resolving them, and the publicity made Finney a national figure [24]. The traditional account preserves Beecher's warning to Finney — that if he brought his methods into New England, Beecher would meet him at the Massachusetts line and fight him \"every inch of the way\" — a remark whose exact wording is variously reported in the secondary literature and which should be cited as *tradition* rather than as a verified verbatim quotation [24]. The substantive point is secure: the orderly Edwardsian revivalists *lost* the contest. Finney's measures \"ultimately prevailed among Presbyterians and Congregationalists,\" and Nettleton's gentler, God-centered revivalism receded into the \"forgotten evangelist\" status it has held ever since [23].\n\n**The interpretive payoff.** Holding New England apart from the frontier accomplishes two things. First, it shows that the \"Second Great Awakening\" contained a *conservative*, Edwardsian wing that was the First Awakening's direct descendant — undercutting any clean rupture narrative. Second, it locates Finney correctly: he was not the *type specimen* of the Second Awakening but a *disputed innovation within it*, one that triumphed only by defeating the older revival tradition in open argument.\n\n---\n\n## VI. Theatre Three — The Burned-over District and Charles Finney's Urban Revivals\n\n### The region\n\nWestern and central upstate New York earned the name the **\"Burned-over District\"** — Charles Finney's own phrase for a region so repeatedly swept by revival \"fire\" that, he feared, there was no unconverted \"fuel\" left to burn. Whitney R. Cross fixed the term in the scholarship with *The Burned-over District: The Social and Intellectual History of Enthusiastic Religion in Western New York, 1800–1850* (Cornell, 1950), still the foundational study [25]. Cross read the region as a \"psychic highway\" — a corridor of transplanted, revival-prone New England Yankees moving west along the Erie Canal route — whose \"enthusiastic religion\" produced not only Finney's revivals but the era's most fertile crop of new movements: Mormonism (Joseph Smith's first vision and the *Book of Mormon* in the district's heart), Millerite Adventism, Oneida perfectionism, Spiritualism, and more [25]. The Burned-over District is thus both a *theatre of revival* and an *incubator of new religions* — the place where the era's centrifugal religious energy was most concentrated.\n\n### Finney and the \"new measures\"\n\n**Charles Grandison Finney** (1792–1875) is the pivotal figure of the third theatre and, for many readers, of the whole Second Awakening. A practicing lawyer in Adams, New York, Finney underwent a dramatic conversion in 1821 (he described \"waves of liquid love\"), abandoned the law the next day, was licensed to preach in 1823, and began revival work in 1824 [26, 27]. His revivals climaxed in the **Rochester revival of 1830–31** (roughly 10 September 1830 to 6 March 1831), where he preached nearly a hundred sermons, shopkeepers closed their stores to attend, and thousands professed conversion — the event Paul Johnson would make the laboratory of his market-revolution analysis (below) [26].\n\nFinney's notoriety rested on the **\"new measures\"** — a bundle of revival techniques, several pioneered earlier but consolidated and publicized by him, that violated the decorum of the settled churches [26, 27]:\n\n> **Term of art — the new measures.** Finney's *new measures* included: the **anxious bench** (a front pew where those under conviction sat publicly, singling themselves out for prayer and pressure to decide); the **protracted meeting** (consecutive nightly meetings, sometimes for weeks, sustaining intensity rather than the weekly rhythm); **praying for individuals by name** in public, sometimes naming their sins; allowing **women to pray aloud in mixed (\"promiscuous\") assemblies**; informal, colloquial prayer and preaching in place of reverential formality; and the rapid admission of new converts to membership. The most controversial single instrument was the **anxious bench**, which Nettleton and the New Englanders attacked as a practical denial of original sin and total depravity — a technique that *manufactured* decisions God alone was supposed to grant [23, 26].\n\n### Finney's theology: revival as engineering, not miracle\n\nThe new measures were the *practical* expression of a *theological* revolution, and it is here that the deepest shift of the whole arc becomes explicit. The older Calvinist-Edwardsian view — Nettleton's view — held that a revival is **a surprising work of God**, a sovereign and somewhat mysterious outpouring that the church may *pray for* but cannot *produce*. Finney denied this flatly. In the opening lecture of his enormously influential *Lectures on Revivals of Religion* (delivered 1834, published 1835), preaching on Habakkuk 3:2, he laid down the thesis that would define modern revivalism [28]:\n\n> \"A revival of religion is not a miracle … It is a purely philosophical result of the right use of the constituted means — as much so as any other effect produced by the application of means.\" [28]\n\nAnd, in the famous agricultural analogy: revival \"is as naturally a result of the use of the appropriate means as a crop is of the use of its appropriate means\" — the means God has ordained \"have a natural tendency to produce a revival\" [28]. He named and rejected the old view directly: that previous generations had treated a revival \"as a miracle, an interposition of Divine power which they had nothing to do with, and which they had no more agency in producing than they had in producing thunder, or a storm of hail\" [28]. If revival is the lawlike result of rightly used means, then the means matter supremely — and the new measures are simply the *most effective* means, to be adopted on grounds of result. Theology and method here are one argument.\n\nFor Finney, conversion followed the same logic: unbelief is \"a 'will not,' instead of a 'cannot'\" — a refusal within the sinner's power to reverse, not an incapacity awaiting sovereign grace [27]. Critics promptly labeled him a **Pelagian** (after the ancient heresy that man can take the first step toward salvation by his own will), because making salvation \"completely dependent upon human choice seemed to suggest that man's will was not entirely corrupted by the Fall\" [28].\n\n> **Terms of art — Arminianism, Pelagianism, perfectionism.** *Arminianism* (after Jacobus Arminius) is the theological position affirming that grace is resistible and that human free will genuinely cooperates in salvation — against the Calvinist insistence on unconditional election and irresistible grace. *Pelagianism* is the stronger, heretical claim that the human will, unaided, can initiate righteousness. *Perfectionism* is the doctrine that the believer can, in this life, attain a state of freedom from voluntary, known sin (\"entire sanctification\"). The Second Awakening's theological drift ran from Calvinist sovereignty *toward* the Arminian end of this spectrum — and, in Finney and the Oberlin school, into perfectionism.\n\n### Oberlin and perfectionism\n\nFinney's later career institutionalized the new theology. He moved to **Oberlin College** in Ohio in **1835** as professor of theology, becoming later its president (serving until his death in 1875) [27]. At Oberlin he and Asa Mahan developed a doctrine of Christian **perfectionism** (\"entire sanctification\") — the teaching that the converted believer could, by consecration, attain a state free from known, voluntary sin [27]. Oberlin under Finney became a center of radical reform: an interracial, coeducational college, a station on the Underground Railroad, a seedbed of abolitionism [27]. Perfectionism is the theological link between revival and reform: if sin can be *overcome*, then society's \"sins\" — slavery, intemperance, vice — become not tragic permanences to be endured but evils to be *abolished*. The reform energy of the benevolent empire flows from this conviction.\n\n---\n\n## VII. The Theological Hinge: From Sovereignty to Agency (New Haven Theology)\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 360\" role=\"img\" aria-label=\"A horizontal track shading from cool slate on the left, labelled DIVINE SOVEREIGNTY, to hot flame-vermilion on the right, labelled HUMAN AGENCY, encoding a half-century theological migration. Four numbered stations sit along the band. Station 1, far left in slate: Jonathan Edwards, Freedom of the Will, 1754 &#8212; the will is bound; the sinner's inability to choose God is a moral inability, not a lack of faculty. Station 2: the New Divinity of Hopkins and Bellamy, late 18th century &#8212; natural ability, moral inability; the sinner has the faculties and is obligated, though he will not repent absent grace. Station 3: Nathaniel Taylor, Concio ad Clerum, 1828 &#8212; power to the contrary, sin is in the sinning, a real natural power to have chosen otherwise. Station 4, far right in flame: Charles Finney, Lectures on Revivals, 1835 &#8212; a revival is not a miracle but the result of the right use of the constituted means; conversion a choice, revival an engineering problem. The line from Edwards's bound will to Finney's engineered revival is a gradient, not a cliff.\">\n<defs>\n<linearGradient id=\"hinge-band\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n<stop offset=\"0\" style=\"stop-color:var(--t3)\"/>\n<stop offset=\"0.34\" style=\"stop-color:var(--t3)\"/>\n<stop offset=\"0.62\" style=\"stop-color:var(--t5)\"/>\n<stop offset=\"1\" style=\"stop-color:var(--accent)\"/>\n<\/linearGradient>\n<\/defs>\n<text x=\"350\" y=\"30\" text-anchor=\"m r(--t5)\"/>\n<text x=\"450\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">3<\/text>\n<circle cx=\"582\" cy=\"150\" r=\"11\" style=\"fill:var(--accent)\"/>\n<text x=\"582\" y=\"154\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">4<\/text>\n<text x=\"118\" y=\"184\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">Jonathan Edwards<\/text>\n<text x=\"118\" y=\"197\" text-anchor=\"middle\" font-size=\"9\" font-style=\"italic\" class=\"t-muted\">Freedom of the Will<\/text>\n<text x=\"118\" y=\"209\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-weight=\"bold\">1754<\/text>\n<text x=\"118\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\">the will is <tspan font-weight=\"bold\">bound<\/tspan> &#8212; the<\/text>\n<text x=\"118\" y=\"239\" text-anchor=\"middle\" font-size=\"8.5\">sinner&#8217;s inability to choose<\/text>\n<text x=\"118\" y=\"250\" text-anchor=\"middle\" font-size=\"8.5\">God is a <tspan font-style=\"italic\">moral<\/tspan> inability,<\/text>\n<text x=\"118\" y=\"261\" text-anchor=\"middle\" font-size=\"8.5\">not a lack of faculty<\/text>\n<text x=\"289\" y=\"184\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">The New Divinity<\/text>\n<text x=\"289\" y=\"197\" text-anchor=\"middle\" font-size=\"9\" font-style=\"italic\" class=\"t-muted\">Hopkins &#183; Bellamy<\/text>\n<text x=\"289\" y=\"209\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-weight=\"bold\">late 18th c.<\/text>\n<text x=\"289\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\"><tspan font-style=\"italic\">natural ability /<\/tspan><\/text>\n<text x=\"289\" y=\"239\" text-anchor=\"middle\" font-size=\"8.5\"><tspan font-style=\"italic\">moral inability<\/tspan> &#8212; he has<\/text>\n<text x=\"289\" y=\"250\" text-anchor=\"middle\" font-size=\"8.5\">the faculties &amp; is obligated,<\/text>\n<text x=\"289\" y=\"261\" text-anchor=\"middle\" font-size=\"8.5\">yet will not repent sans grace<\/text>\n<text x=\"450\" y=\"184\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">Nathaniel W. Taylor<\/text>\n<text x=\"450\" y=\"197\" text-anchor=\"middle\" font-size=\"9\" font-style=\"italic\" class=\"t-muted\">Concio ad Clerum<\/text>\n<text x=\"450\" y=\"209\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-weight=\"bold\">1828<\/text>\n<text x=\"450\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\"><tspan font-style=\"italic\">&#8220;power to the contrary&#8221;<\/tspan><\/text>\n<text x=\"450\" y=\"239\" text-anchor=\"middle\" font-size=\"8.5\"><tspan font-style=\"italic\">&#8220;sin is in the sinning&#8221;<\/tspan> &#8212; a real<\/text>\n<text x=\"450\" y=\"250\" text-anchor=\"middle\" font-size=\"8.5\">natural power to have<\/text>\n<text x=\"450\" y=\"261\" text-anchor=\"middle\" font-size=\"8.5\">chosen otherwise<\/text>\n<text x=\"582\" y=\"184\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">Charles Finney<\/text>\n<text x=\"582\" y=\"197\" text-anchor=\"middle\" font-size=\"9\" font-style=\"italic\" class=\"t-muted\">Lectures on Revivals<\/text>\n<text x=\"582\" y=\"209\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-weight=\"bold\">1835<\/text>\n<text x=\"582\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\">a revival is <tspan font-weight=\"bold\">not a miracle<\/tspan><\/text>\n<text x=\"582\" y=\"239\" text-anchor=\"middle\" font-size=\"8.5\">but <tspan font-style=\"italic\">&#8220;the right use of the<\/tspan><\/text>\n<text x=\"582\" y=\"250\" text-anchor=\"middle\" font-size=\"8.5\"><tspan font-style=\"italic\">constituted means&#8221;<\/tspan> &#8212; revival<\/text>\n<text x=\"582\" y=\"261\" text-anchor=\"middle\" font-size=\"8.5\">an engineering problem<\/text>\n<line x1=\"40\" y1=\"286\" x2=\"660\" y2=\"286\" class=\"ln\" stroke-width=\"0.8\"/>\n<text x=\"350\" y=\"306\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">No cliff: each station keeps the prior vocabulary and shifts its weight a half-step toward the human will.<\/text>\n<text x=\"350\" y=\"322\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">The bound will of 1754 and the engineered revival of 1835 are the two ends of one gradient.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> The line from Edwards&#8217;s <em>bound<\/em> will to Finney&#8217;s <em>engineered<\/em> revival is a gradient, not a cliff (Claims 2.16, 2.17, 4.17). Read station by station &#8212; Edwards&#8217;s &#8220;moral inability,&#8221; the New Divinity&#8217;s &#8220;natural ability,&#8221; Taylor&#8217;s &#8220;power to the contrary,&#8221; Finney&#8217;s &#8220;constituted means&#8221; &#8212; the sovereignty of God migrates into the agency of man by half-steps, which is why the famous Edwards-versus-Finney &#8220;rupture&#8221; is partly a caricature.<\/figcaption>\n<\/figure>\n\n\nThe theological transformation that ran underneath all three theatres deserves its own treatment, because it is the through-line that connects Edwards to Finney and makes the whole arc intelligible as one story. The story is the slow, contested erosion of high-Calvinist sovereignty and the elevation of human moral agency — and its hinge is **New Haven theology** and **Nathaniel W. Taylor**.\n\n### Edwards's settlement and its strains\n\nJonathan Edwards, in *Freedom of the Will* (1754), had defended a *determined* will — the will always follows the strongest motive, so that the sinner's inability to choose God is a *moral* inability (a corrupt disposition) rather than a *natural* inability (a lack of faculty). This let Edwards hold both that humans are genuinely responsible (they do what they *will*) and that they cannot save themselves (their will is bound by a sinful nature until grace renews it). Edwards's New England heirs — the \"New Divinity\" men (Samuel Hopkins, Joseph Bellamy) — preserved the framework while pressing the *natural ability / moral inability* distinction: the sinner has the natural faculties to repent and is therefore *obligated* and *without excuse*, even though his moral corruption guarantees he will not, absent grace.\n\n### Taylor's *Concio ad Clerum* (1828) and \"power to the contrary\"\n\n**Nathaniel W. Taylor** (1786–1858), Dwight's student and the first professor of theology at the new Yale Divinity School (from 1822), pushed the natural-ability tradition across a decisive line. In his epochal sermon **_Concio ad Clerum_ (\"A Word to the Clergy\"), delivered in the Yale College chapel on 10 September 1828**, Taylor reframed original sin and depravity to protect human responsibility and the appeal of the revival preacher [29]. His core moves, read directly from the sermon's text [29]:\n\n- Human \"entire moral depravity\" is real and universal, but it is **\"by nature\"** only in the sense that nature is the *occasion* of sin, never its *cause*. To make corrupt *nature* the cause of sin would make God \"the author of sin\" and produce the absurdity of \"sin before the first sin.\" [29]\n- Depravity consists **entirely in voluntary acts** — in \"man's own act, consisting in a free choice of some object rather than God, as his chief good\" — and not in any sinful *substance* or essence implanted at birth [29]. This is the doctrine later compressed into the slogan \"**sin is in the sinning**\": there is no guilt prior to, or apart from, the sinner's own free choosing.\n- Humanity sins universally and certainly — \"such is their nature that they will sin and only sin in all the appropriate circumstances of their being\" — yet the sinner retains genuine freedom and therefore genuine responsibility [29].\n\nThe phrase the tradition attached to Taylor's system is **\"certainty with power to the contrary\"**: the sinner will *certainly* sin, but always retains the *power to the contrary* — a real natural power to have chosen otherwise [30]. This is the foundation stone Finney would build on. As the dissertation literature on Taylor puts it, his New Haven theology \"reversed the elder Edwards on freedom of the will by contending for a natural power of free choice\"; where Edwards defended a determined will, Taylor \"built his system upon the doctrine of the power to the contrary as its foundation stone\" [30].\n\n> **Term of art — New Haven theology / \"power to the contrary.\"** *New Haven theology* (or *Taylorism*) is the modification of Edwardsian Calvinism developed by N. W. Taylor at Yale Divinity School in the 1820s–30s, designed to reconcile inherited Calvinist orthodoxy with the new revivalism by maximizing human moral agency. Its signature thesis is that the sinner, though certain to sin, always possesses a real *power to the contrary* — a natural ability to choose holiness — so that responsibility and the preacher's urgent appeal to *decide* are fully grounded. Critics charged it with sliding toward Arminianism or Pelagianism.\n\n### The significance of the hinge\n\nNew Haven theology is the *intellectual permission slip* for the new revivalism. If the sinner has a real power to repent *now*, then it is legitimate — indeed urgent — for the preacher to press for an immediate decision, to install an anxious bench, to treat conversion as a choice the hearer can and must make tonight. Taylor supplied the theology; Finney drew the practical conclusion and went further, treating the *whole revival* (not just the individual conversion) as the lawlike result of rightly applied means. The line from Edwards's *bound* will, through the New Divinity's *natural ability*, through Taylor's *power to the contrary*, to Finney's *engineered revival*, is the master-narrative of the arc's theology: a half-century migration from the sovereignty of God toward the agency of man. Whether this was a *betrayal* of Edwards or a *development* of him is one of the live debates (taken up later, in the chapter on the historiography); what is not in dispute is that the migration happened and that it remade American Protestantism's center of gravity.\n\n---\n\n## VIII. The Institutional Outcome That Mattered Most: The Methodist–Baptist Conquest\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 360\" role=\"img\" aria-label=\"A slope chart of U.S. religious market share from 1776 to 1850, after Finke and Stark. Two lines cross between the year columns. The Congregationalists, the tax-supported colonial establishment, fall steeply from 20.4 percent in 1776 to just 4.0 percent in 1850, drawn in sober Old-Light slate. The Methodists, the populist upstart sect, rise from 2.5 percent in 1776 to 34.2 percent in 1850 in flame vermilion, becoming the single largest body. A reference dot marks the Baptists at 20.5 percent in 1850. The establishment line and the upstart line cross, the rising sect overtaking and dwarfing the old order.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif\" letter-spacing=\"3\">THE GREAT INVERSION<\/text>\n<text x=\"350\" y=\"47\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">share of U.S. religious adherents, 1776 to 1850<\/text>\n<line x1=\"120\" y1=\"58\" x2=\"120\" y2=\"300\" class=\"ln-soft\" stroke-width=\"1\"/>\n<line x1=\"120\" y1=\"300\" x2=\"580\" y2=\"300\" class=\"ln\" stroke-width=\"1.3\"/>\n<line x1=\"116\" y1=\"58\" x2=\"120\" y2=\"58\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"111\" y=\"61\" text-anchor=\"end\" font-size=\"8\" class=\"t-muted\">36%<\/text>\n<line x1=\"116\" y1=\"166.4\" x2=\"120\" y2=\"166.4\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"111\" y=\"169\" text-anchor=\"end\" font-size=\"8\" class=\"t-muted\">20%<\/text>\n<line x1=\"116\" y1=\"233.6\" x2=\"120\" y2=\"233.6\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"111\" y=\"236\" text-anchor=\"end\" font-size=\"8\" class=\"t-muted\">10%<\/text>\n<text x=\"111\" y=\"303\" text-anchor=\"end\" font-size=\"8\" class=\"t-muted\">0%<\/text>\n<line x1=\"190\" y1=\"58\" x2=\"190\" y2=\"300\" class=\"ln-soft\" stroke-width=\"0.8\" stroke-dasharray=\"2 3\"/>\n<line x1=\"510\" y1=\"58\" x2=\"510\" y2=\"300\" class=\"ln-soft\" stroke-width=\"0.8\" stroke-dasharray=\"2 3\"/>\n<path d=\"M190,162.9 L510,273.1\" fill=\"none\" pathLength=\"1\" class=\"s-t3 cv-draw\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>\n<path d=\"M190,283.2 L510,70.2\" fill=\"none\" pathLength=\"1\" class=\"cv-draw\" style=\"stroke:var(--accent)\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n<circle cx=\"190\" cy=\"162.9\" r=\"4\" class=\"f-t3\"/>\n<circle cx=\"510\" cy=\"273.1\" r=\"4\" class=\"f-t3\"/>\n<circle cx=\"190\" cy=\"283.2\" r=\"4\" style=\"fill:var(--accent)\"/>\n<circle cx=\"510\" cy=\"70.2\" r=\"4.5\" style=\"fill:var(--accent)\"/>\n<circle cx=\"510\" cy=\"162.2\" r=\"3.5\" class=\"f-t4\"/>\n<text x=\"183\" y=\"156\" text-anchor=\"end\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--t3)\">Congregationalists<\/text>\n<text x=\"183\" y=\"167\" text-anchor=\"end\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">the establishment<\/text>\n<text x=\"520\" y=\"270\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--t3)\">Congregationalists<\/text>\n<text x=\"520\" y=\"281\" text-anchor=\"start\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--t3)\">4.0%<\/text>\n<text x=\"183\" y=\"287\" text-anchor=\"end\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--accent)\">Methodists<\/text>\n<text x=\"183\" y=\"298\" text-anchor=\"end\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">the upstart<\/text>\n<text x=\"520\" y=\"67\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--accent)\">Methodists<\/text>\n<text x=\"520\" y=\"79\" text-anchor=\"start\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--accent)\">34.2%<\/text>\n<text x=\"183\" y=\"178\" text-anchor=\"end\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--t3)\">20.4%<\/text>\n<text x=\"183\" y=\"276\" text-anchor=\"end\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--accent)\">2.5%<\/text>\n<text x=\"520\" y=\"160\" text-anchor=\"start\" font-size=\"9\" font-weight=\"bold\" style=\"fill:var(--t4)\">Baptists<\/text>\n<text x=\"520\" y=\"171\" text-anchor=\"start\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--t4)\">20.5%<\/text>\n<text x=\"190\" y=\"318\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\">1776<\/text>\n<text x=\"190\" y=\"330\" text-anchor=\"middle\" font-size=\"7.5\" class=\"t-muted\">colonial establishment<\/text>\n<text x=\"510\" y=\"318\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\">1850<\/text>\n<text x=\"510\" y=\"330\" text-anchor=\"middle\" font-size=\"7.5\" class=\"t-muted\">after the Second Awakening<\/text>\n<text x=\"350\" y=\"350\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">The tax-supported old order is overtaken and dwarfed by the populist sect it once outlawed.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The arc&#8217;s structural legacy in one crossing: between 1776 and 1850 the tax-supported colonial establishment &#8212; the Congregationalists, from 20.4% down to 4.0% &#8212; is overtaken and dwarfed by the populist upstart it once marginalized, as Methodists vault from 2.5% to 34.2% and become the single largest body in America, with the Baptists close behind at 20.5% (Claim 2.18).<\/figcaption>\n<\/figure>\n\n\nIf one had to name the single most consequential *result* of the whole arc — more lasting than any sermon, more measurable than any theology — it is the wholesale inversion of the denominational order. The colonial establishments were overtaken and then buried by the populist, mobile, low-barrier sects. The numbers are stark. Drawing on Finke and Stark's reconstruction of denominational \"market share\" (share of all religious adherents) [31]:\n\n| Denomination | Share of adherents, 1776 | Share of adherents, 1850 |\n| --- | --- | --- |\n| Congregationalists | ~20.4% (the largest) | ~4% |\n| Methodists | ~2.5% | ~34.2% (the largest) |\n| Baptists | (large minority) | ~20.5% |\n| Episcopalians/Anglicans | substantial establishment | sharply reduced |\n| Presbyterians | substantial | reduced |\n\nThe Methodists' rise is the headline: from a \"tiny religious society\" of about 65 churches in 1776 to **13,302 congregations and more than 2.6 million members by 1850** — the single largest denomination, more than a third of all American church members [31, 32]. In Finke and Stark's compression: \"In 1776, 1 in 40 religious [Americans] were Methodist; in 1850, 1 in 3\" [32]. Meanwhile the Congregationalists who had led the colonies fell from first place to a 4-percent rump, passed by Methodists, Baptists, Catholics, and Presbyterians alike [31, 32]. (The Baptists would later overtake even the Methodists, becoming the largest by the early twentieth century — but that is beyond this arc.) [31]\n\n**Why the upstarts won.** Several mechanisms, drawn together, account for the inversion:\n\n1. **Structural fit with the voluntary market.** Disestablishment turned religion into a competition for voluntary adherents (§II). The Methodists and Baptists were built for it; the tax-supported, learned-ministry establishments were not.\n2. **Low barriers to entry into the ministry.** The Methodist circuit-rider/exhorter system and the Baptist farmer-preacher tradition meant a man needed conviction and a community, not a college degree and a settled, salaried pulpit. The supply of preachers could scale with demand. The establishments, requiring an educated, ordained, settled clergy, could not keep pace with frontier settlement [21].\n3. **Mobility.** The circuit rider followed the frontier; the settled Congregational parish did not. One mounted Methodist preacher could plant the faith across dozens of communities [21].\n4. **Populist theology.** The Arminian, free-will, \"whosoever will\" message of the Methodists (and the increasingly Arminian-tending Baptists) was, in Hatch's reading, perfectly matched to a democratizing, anti-elite, anti-Calvinist age — it offered salvation directly to the ordinary person without the gatekeeping of an educated clergy or the terrors of unconditional election [33].\n\nThis institutional outcome is the bridge to the present: the modern American religious landscape — evangelical in temper, revivalist in form, denominationally plural, voluntarist in structure, with Baptists and Methodists (and their evangelical and Pentecostal descendants) at the center — is the settlement this arc produced. The chapter on the living legacy picks up here.\n\n---\n\n## IX. The Benevolent Empire and the Reform Impulse\n\nThe Awakening's energy did not stay inside the churches. It spilled into a vast network of voluntary reform and benevolence organizations — the **\"benevolent empire\"** — that wove evangelical Protestantism into the fabric of antebellum public life [34].\n\n> **Term of art — the benevolent empire.** The *benevolent empire* is the historians' label for the interlocking network of voluntary, evangelically driven reform and benevolence societies that proliferated between roughly 1815 and 1861 — Bible, tract, missionary, Sunday-school, temperance, antislavery, and moral-reform organizations — funded by voluntary contributions and staffed largely by middle-class evangelicals (and, in the rank and file, by women).\n\nIts institutional anchors included the **American Board of Commissioners for Foreign Missions** (1812), the **American Bible Society** (1816), the **American Sunday School Union** (1824), and the **American Tract Society** (1825), alongside temperance societies, antislavery societies, Sabbatarian campaigns, and moral-reform associations [34]. Two features deserve emphasis. First, the benevolent empire marks a *partial reversal* of the early revival's populism: where the camp meeting and the circuit rider had been democratic and anti-elite, the great reform societies were led disproportionately by middle-class ministers and laymen who had the time and resources the market revolution gave them [34]. Second, women — barred from the pulpit — found in these voluntary societies their largest field of public action, dominating the rank and file of tract distribution, Sunday-school teaching, temperance, and moral reform, and thereby acquiring organizational experience that fed directly into the antislavery and women's-rights movements [34].\n\nThe reform impulse also *divided* the churches. The slavery question split the two great upstart denominations along sectional lines on the eve of the Civil War: the Methodists divided in **1844** (the Methodist Episcopal Church, South, organizing in 1845) and the Baptists in **1845** (the founding of the Southern Baptist Convention), over whether a slaveholder could be a missionary or bishop [35]. The denominational schisms of 1844–45 are sometimes read as a dress rehearsal for national disunion — the churches breaking along the fault line the nation would break along sixteen years later. And the era produced enduring new institutions for African Americans: **Richard Allen**'s African Methodist Episcopal (AME) Church, organized as an independent denomination in **1816** with Allen as its first bishop, gave free Black Methodists a body of their own outside white control [36]. (The race story and the new movements are developed later, in the chapters on the living legacy and the historiography.)\n\n---\n\n## X. The Half-Dozen Inflection Points and the Live Alternatives That Did Not Prevail\n\nDistilling the arc to its load-bearing turns:\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Inflection points of the modern arc, 1786–1845<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">1786<\/div><div class=\"tlbody\">Virginia Statute for Religious Freedom — disestablishment begins<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">1801<\/div><div class=\"tlbody\">Cane Ridge camp meeting under Barton Stone<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">1802<\/div><div class=\"tlbody\">Yale revival under Timothy Dwight — New England&#x27;s orderly, Edwardsian theatre<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">1827<\/div><div class=\"tlbody\">New Lebanon Conference — Nettleton&#x27;s order loses to Finney&#x27;s new measures<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">1828<\/div><div class=\"tlbody\">Taylor&#x27;s Concio ad Clerum — &#x27;power to the contrary,&#x27; the theological hinge<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">1830-31<\/div><div class=\"tlbody\">Finney&#x27;s Rochester revival; Lectures (1835): revival &#x27;not a miracle&#x27;<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">1833<\/div><div class=\"tlbody\">Massachusetts ends the last state establishment<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">1844-45<\/div><div class=\"tlbody\">Methodists and Baptists split North/South over slavery<\/div><\/div><\/div><figcaption>The legal, theological, and methodological hinges of the Second Awakening.<\/figcaption><\/figure>\n\n\n\n1. **Disestablishment (Virginia 1786 → Massachusetts 1833).** The move from a coerced, monopolistic religious establishment to a voluntary, competitive market. *The live alternative that lost:* a continued, European-style establishment — favored by the old Standing Order in New England, defeated incrementally and finally in 1833. Had the establishments survived, the upstart-sect explosion might have been throttled.\n\n2. **The frontier camp meeting (Logan County 1797–1800; Cane Ridge 1801).** The invention of a mass, multi-denominational, emotionally intense revival instrument adapted to the unchurched frontier. *The live alternative:* the orderly Presbyterian sacramental season *without* the centrifugal exercises and schism — which is roughly what the anti-revival Presbyterians wanted, and which lost the frontier to the Methodists and Baptists.\n\n3. **New England's Edwardsian revival (Connecticut 1797–98; Yale 1802) and its *defeat* at New Lebanon (1827).** The conservative, God-centered, order-respecting revival of Dwight and Nettleton was a genuine, vital alternative to Finney's engineered revivalism — and it *lost*. The New Lebanon standoff is the moment the older model failed to contain the newer one. *This is the era's great \"almost\":* a Second Great Awakening that stayed Edwardsian rather than turning Finneyite was a live possibility, embodied in Nettleton, that did not prevail.\n\n4. **The New Haven theological turn (Taylor's *Concio ad Clerum*, 1828).** The decisive intellectual move from Edwards's bound will to \"power to the contrary\" — the theology that licensed the new revivalism. *The live alternative:* a maintained high Calvinism (the Old School Presbyterians, the Princeton theology of Charles Hodge, the Old Calvinists), which fought New Haven theology hard and which survives — but which ceded the revival mainstream.\n\n5. **Finney's redefinition of revival as means, not miracle (Rochester 1830–31; *Lectures*, 1835).** The conversion of revival from a sovereign work of God into a reproducible technique — the birth of *modern* revivalism. *The live alternative:* Nettleton's \"surprising work of God.\" Finney's view won so completely that it became the unspoken assumption of American evangelism down to the present.\n\n6. **The Methodist–Baptist conquest and the rise of the benevolent empire (c. 1776–1850).** The institutional inversion (§VIII) and its overflow into organized reform (§IX). *The live alternative that lost:* a Protestantism that remained establishment-centered, learned-clergy-led, and Calvinist — the world of 1776 — which by 1850 was a minority island in a Methodist-Baptist sea.\n\n---\n\n## Open Questions\n\n- **How real was the 1790s \"nadir,\" quantitatively?** The perception is well-attested; the demographic reality is harder to pin down, and the figure is entangled with the revivalists' self-interested framing. Better parish-level membership data would sharpen this.\n- **Did the First Awakening's fire genuinely subside, or is the \"interval\" an artifact of the contested \"Awakening\" category?** Butler's invention critique implies the lull is partly constructed; Boles's continuity thesis implies real persistence in the South. The two are not fully reconciled.\n- **Continuity vs. rupture between the two Awakenings.** Is the Second a *resumption* of the First (the Edwardsian/Boles continuity reading) or a *break* from it (the Finney/new-measures rupture reading)? Both are defensible because the Second contained *both* a continuous Edwardsian wing and a rupturing Finneyite one.\n- **Which causal model best explains the Methodist–Baptist explosion** — Hatch's *democratization*, Johnson's *market-revolution/social-control*, the older *frontier* thesis, the Finke–Stark *religious-economy* model, or some synthesis? The interpretations are not mutually exclusive but weight different mechanisms; the field has no consensus. (Mapped in full later, in the chapter on the historiography.)\n- **Was the New Haven turn a development of Edwards or a betrayal of him?** Taylor and Finney claimed continuity; the Old School Calvinists charged apostasy. The verdict depends on contested readings of *Freedom of the Will*.\n- **The exact wording and provenance of Beecher's \"fight you every inch of the way\" warning to Finney** — preserved as tradition, variously reported; needs tracing to Beecher's *Autobiography* or correspondence for verbatim confirmation.\n\n---\n\n## Sources\n\n1. HISTORY.com Editors, \"Great Awakening — First, Second & Definition,\" History.com (updated). https://www.history.com/articles/great-awakening — *Tier 5 (popular reference; used only for the conventional periodization it states, not for analysis). Accessed 2026-06-19.*\n2. Jon Butler, *Awash in a Sea of Faith: Christianizing the American People* (Harvard University Press, 1990); and Butler, \"Enthusiasm Described and Decried: The Great Awakening as Interpretive Fiction,\" *Journal of American History* 69 (1982). Publisher page: https://www.hup.harvard.edu/books/9780674056015 — *Tier 2 (university-press monograph / peer-reviewed article). The \"interpretive fiction\" thesis. Accessed 2026-06-19.*\n3. John B. Boles, *The Great Revival, 1787–1805: The Origins of the Southern Evangelical Mind* (University Press of Kentucky, 1972). https://archive.org/details/greatrevival17870000bole — *Tier 2 (university-press monograph). Continuity / Calvinist-sacramental reading of the frontier revival. Accessed 2026-06-19.*\n4. Roger Finke and Rodney Stark, *The Churching of America, 1776–2005: Winners and Losers in Our Religious Economy* (Rutgers University Press); 1776 adherence rate (~17%), ~3,228 congregations, ~242,100 members. https://www.amazon.com/Churching-America-1776-2005-Winners-Religious/dp/0813535530 — *Tier 2 (peer-reviewed sociology of religion; market-share data). Accessed 2026-06-19.*\n5. Mark David Hall, \"Was the Founding Generation 'Churched'?\" Law & Liberty. https://lawliberty.org/was-the-founding-generation-churched/ — *Tier 5 (analytical essay, scholar-authored; cited as the contesting view on the Finke–Stark adherence estimate). Accessed 2026-06-19.*\n6. America250 / AEI, \"Religion and the American Revolution\" (Anglican clergy loyalty figures: ~27% supported the Revolution; 3 of 55 north of Pennsylvania). https://america250.aei.org/volume/religion-and-the-american-revolution/ — *Tier 5 (scholar-authored think-tank e
