gregations at year-end 2024. *LDS membership counts are self-reported and use a broad definition; flagged.*\n\n27. \"Adventists grow worldwide to 23.6 million members,\" EUD News / Seventh-day Adventist Statistical Report 2024, https://www.adventistresearch.info/wp-content/uploads/ACRep2024.pdf, accessed 2026-06-19 — Tier 3 (denominational statistical reporting; primary). Source of: 23,684,237 members as of 2024-12-31; +899,042 over 2023; Global-South-driven growth. Millerite/Great Disappointment (Oct 22, 1844) and 1863 founding via Britannica/EBSCO — Tier 2.\n\n28. \"Restoration Movement\" timeline, The Association of Religion Data Archives (ARDA), https://www.thearda.com/us-religion/history/timelines/entry?etype=3&eid=32, and \"An Overview of the Restoration Movement,\" Word & Work, accessed 2026-06-19 — Tier 2/5. Source of: Stone, Cane Ridge (1801), 1832 Stone-Campbell union; 25,000 (1832) → ~200,000 (1861); three modern streams; Disciples of Christ decline. *Combined ~7M figure is an estimate spanning audited and self-reported counts; flagged.*\n\n29. \"Holiness movement | Description, History, Churches, Beliefs, & Facts,\" Encyclopædia Britannica, https://www.britannica.com/event/Holiness-movement, accessed 2026-06-19 — Tier 2. Source of: Wesleyan \"entire sanctification\"/second-blessing doctrine; 1830s U.S./Canada origin; Church of the Nazarene (1908), Wesleyan, Free Methodist, Salvation Army; Holiness as parent of Pentecostalism.\n\n30. Albert J. Raboteau, *Slave Religion: The \"Invisible Institution\" in the Antebellum South* (Oxford, 1978; updated 2004), as discussed in Encyclopedia.com and \"A Battle That Shaped Black Evangelicals,\" Christianity Today, 2025-05, https://www.christianitytoday.com/2025/05/early-black-evangelicals-great-awakening/ — Tier 2 (the monograph) / Tier 4-5 (CT). Source of: Baptist primacy in Black conversion; Afro-Christian synthesis; the \"invisible institution.\" *Note: Raboteau's monograph not read in original.*\n\n31. \"Founding of the African Methodist Episcopal Church,\" EBSCO Research Starters, and \"Mother Bethel AME Church,\" BlackPast.org, and AME Church \"Our History,\" accessed 2026-06-19, https://blackpast.org/african-american-history/mother-bethel-african-methodist-episcopal-ame-church-1794/ — Tier 2/5. Source of: Allen; St. George's walkout; Mother Bethel (1794); AME formation (1816); Allen first bishop. *Current AME membership (~2.5–3.5M, ~7,000 congregations) is a denominational self-estimate; flagged.*\n\n32. \"National Baptist Convention of the United States of America, Inc.,\" Encyclopædia Britannica, and \"Historically African American Denominations,\" Faith Communities Today, accessed 2026-06-19, https://www.britannica.com/topic/National-Baptist-Convention-of-the-United-States-of-America-Inc — Tier 2/5. Source of: NBC USA as largest Black church (~7.5M claimed); ~13M combined across the three major Black Baptist conventions. *Self-reported denominational claims; Pew's 5% historically-Black-Protestant population figure [13] is the more conservative number.*\n\n33. Randall Balmer, *Bad Faith: Race and the Rise of the Religious Right* (2021), as discussed in \"Randall Balmer on why racism, not abortion, birthed the religious right,\" Religion News Service, 2021-09-22, https://religionnews.com/2021/09/22/randall-balmer-on-why-racism-not-abortion-birthed-the-religious-right/, and Center for American Progress — Tier 4/5 (RNS reporting on Balmer's Tier-2 scholarship). Source of the \"abortion myth\" / IRS-and-segregation origin thesis and the Weyrich concession. *Contested thesis; the contestation is taken up in the chapter on the historiographical debates. Balmer's monograph not read in original.*\n\n34. Kristin Kobes Du Mez, *Jesus and John Wayne: How White Evangelicals Corrupted a Faith and Fractured a Nation* (Liveright/Norton, 2020), publisher and Wikipedia descriptions, https://wwnorton.com/books/9781631499050, accessed 2026-06-19 — Tier 2 (the monograph) / Tier 5 (descriptions). Source of the \"militant masculinity as evangelical binding identity / Trump as fulfillment not betrayal\" thesis. *Monograph not read in original; thesis is contested.*"}, {"order": 4, "file": "04_Live_Debates_And_Dynamics.md", "title": "Live Debates and Dynamics: The Historiography of the Great Awakenings", "summary": "", "body": "# Live Debates and Dynamics: The Historiography of the Great Awakenings\n\n## Bottom Line\n\nFor a historical subject, the \"live debates\" are not arguments in the streets but the fault lines still open in the scholarly literature — and on the Great Awakenings those fault lines are unusually deep, because the central object of study is itself contested. Six arguments organize the field, and they nest. The most radical is **whether the First Great Awakening existed at all**: Jon Butler's 1982 charge that it is an \"interpretive fiction,\" and Frank Lambert's argument that it was an *invention* — though Lambert relocates the inventing from nineteenth-century historians to the eighteenth-century revivalists themselves. Against both stand defenders — Thomas Kidd, Harry Stout, Mark Noll — who grant that the *unified label* is a construction while insisting that real, transatlantic, consequential revivals occurred and produced something durable (evangelicalism). The decisive move in this debate is to separate two claims that the polemics tend to fuse: *that the revivals happened* (essentially undisputed) and *that they formed a single coherent \"event\"* (genuinely disputed). On the Second Awakening, the field has cycled through three readings of causation — an older **social-control** thesis (revivals as elite management of disorder), Nathan Hatch's **democratization** thesis (ordinary people seizing religious authority), and the **market-revolution** reading exemplified by Paul Johnson's *A Shopkeeper's Millennium* — with a more recent counter-thread (Curtis Johnson, John Wigger, Amanda Porterfield, the institutional-history critics) insisting on institutionalization, denominational variety, the persistence of the state, and regional difference against any single national \"democratization\" story. Three further debates — **continuity vs. rupture** between the two Awakenings (orderly Calvinist Edwards vs. emotional Arminian Finney, against a continuity reading that calls the contrast a caricature), the **Awakening and the Revolution** (Alan Heimert's bold causal thesis and the decades of pushback and partial rehabilitation), and **race** and **gender** (the revivals as both an opening to Black Christianity and a faith reconciled to slavery; the predominance of women among converts and the \"feminization\" thesis and its critics) — round out the map. Where the evidence leans, this document argues, is toward a chastened middle: the revivals were real and the unified \"event\" was constructed; democratization names something true but overstates lay institutional power and flattens regional and denominational difference; Edwards and Finney are less opposites than the textbook contrast implies; Heimert was wrong in his strong causal form but pointed at a real connection later scholars recovered; and on race and gender the revivals were genuinely double-edged, which is the finding, not a failure to reach one.\n\n---\n\n## A Note on Method and Register\n\nThis account aims to map each debate at full strength, stating the strongest version of every camp in its own language before assessing it. That care matters here more than usual, because the historiography of the Awakenings is a field where the strongest scholars disagree not at the margins but at the foundations, and where it is easy to caricature a position one does not hold. Each section below names the camps, states the strongest version of each in the vocabulary its best advocates use, identifies the key evidence each side cites, distinguishes factual disagreements (resolvable in principle by evidence) from interpretive ones (not so resolvable), notes what would settle the question, and only then renders an assessment of where the weight of evidence lies.\n\nA word on sourcing. The primary sources for this account are the monographs and journal articles in which the debate is actually conducted, supplemented by review literature and authoritative reference works (Oxford Bibliographies, the *Cambridge*/Oxford handbook apparatus) that map the field. Where a claim about a historian's argument rests on a review or a historiographical survey rather than on the monograph read in full, that is noted; where a primary text (Edwards, Finney, Whitefield) is invoked, it is invoked as it is read in the secondary literature unless otherwise noted. Claims about who is *currently* living and active, holds which chair, and has most recently weighed in are factual claims about the present and are sourced and dated accordingly.\n\nA terminological caution runs through everything. \"The Great Awakening\" is a contested term; these pages use it because the field does, but never as a settled descriptor of a unified event. Where precision is needed, \"the colonial revivals of the 1730s–40s\" and \"the revivals of c. 1790–1840\" are the neutral descriptors, and \"the (so-called) First/Second Great Awakening\" marks the contested usage.\n\n---\n\n## Debate 1 — Did the First Great Awakening Exist?\n\nThis is the debate that makes the framing of these pages necessary: treating \"the Great Awakening\" as a contested historiographical category rather than a settled fact is a direct consequence of the literature mapped here.\n\n### 1A. The slim historiography and Butler's intervention\n\nBefore 1982 the Great Awakening had, in Jon Butler's own phrase, a \"slim, peculiar historiography\" — no comprehensive general history since Joseph Tracy's *The Great Awakening* (1842), the book that gave the phenomenon its enduring name [1][2]. The interpretive tradition that did exist ran from Vernon Parrington (1927), who read the revivals as a Calvinist rear-guard against rising Arminian rationalism; through Wesley Gewehr (1930) and the Progressive John C. Miller (1933), who treated revivalism as the first inter-colonial mass movement and a vehicle of class protest; to Perry Miller (1950s), who made the Awakening central to \"Americanization,\" and Alan Heimert (1966), who linked evangelical Calvinism to the Revolution [3]. Across this tradition the existence of a coherent \"Great Awakening\" was assumed, not argued.\n\nJon Butler detonated that assumption in \"Enthusiasm Described and Decried: The Great Awakening as Interpretative Fiction,\" published in the *Journal of American History* in September 1982 [1][4]. The article is now generally regarded as the single most influential piece in the field's historiography precisely because it forced nearly every later historian to address its charges [2]. Butler's case, stated at its strongest in his own terms, runs roughly as follows:\n\n- **The revivals were geographically patchy and chronologically diffuse.** They \"swept through only some of the colonies, leaving some relatively untouched,\" over a protracted span running from the late seventeenth century to the late eighteenth — not a single dated event with a clear beginning and end [3].\n- **Contemporaries did not use the term.** Eighteenth-century participants never called what they experienced \"the Great Awakening\"; the unifying label is a later imposition [3]. (This is a *factual* claim, and it is essentially conceded across the field — even Butler's critics agree the capital-letter term is retrospective.)\n- **The unifying label distorts the evidence.** The phrase \"does serious injustice to the minutiae that it orders\" — it imposes false coherence on disparate local revivals that lacked sufficient cohesion to merit a single classification [3].\n- **The consequences have been overstated.** Revivalism's effects on the Revolution have been \"vastly overstated\"; the itinerants \"failed to challenge clerical hegemony\" and \"were not a source of radicalism\"; Edwards's real influence was not felt \"until nearly a century after his death\" [3].\n- **The fiction has a date and an author.** In Butler's original framing, the \"Great Awakening\" as a unified construct was the creation of nineteenth-century interpreters, with Tracy in 1842 as the key fabricator [3].\n\nButler later folded this argument into his synthesis *Awash in a Sea of Faith: Christianizing the American People* (Harvard, 1990), a prize-winning reframing of early American religion that downplayed Puritan and revival \"declension-and-awakening\" narratives in favor of a long, uneven process of Christianization and the persistence of folk magic and the occult [5]. (Butler, now Howard R. Lamar Emeritus Professor at Yale and a research professor at the University of Minnesota, was still publicly reflecting on *Awash* as recently as August 2025, which is worth noting because it means the dean of the skeptical position remains an active voice, not merely a historical one [5][6].)\n\n### 1B. What the tradition Butler attacked had built\n\nTo understand why Butler's article landed with such force, one must see the interpretive edifice it was demolishing — because the camps in this debate are in large part defined by their relation to that prior tradition, and the defenders are not simply restoring it. The pre-1982 tradition had developed several incompatible accounts of *what the Awakening meant*, all of which presupposed *that* it existed:\n\n- **Vernon L. Parrington (*Main Currents in American Thought*, 1927)** read the revivals as a Calvinist rear-guard action — the last stand of an inherited Puritan orthodoxy against the rising tide of Arminian rationalism and \"social leveling.\" For Parrington, the forward-looking force in colonial America was the *anti*-revivalist liberal rationalism that the Awakening resisted; Edwards was a brilliant anachronism defending a doomed system [3]. This framing — Enlightenment progressive, evangelicalism reactionary — would become the target Heimert later inverted.\n- **Wesley M. Gewehr (*The Great Awakening in Virginia*, 1930)** moved the story out of New England and treated the revival as \"the key to understanding the social, political and ecclesiastical changes\" of the era and as the first genuinely *inter-colonial* event, with Whitefield as the connecting thread [3]. Gewehr planted the seed of the \"first national event\" claim that Butler would attack as anachronistic.\n- **The Progressive reading (John C. Miller, 1933)** cast revivalism as \"the first mass protest movement,\" a religious expression of class conflict and economic disruption (the Land Bank controversy) — an early version of the social-control / class arguments that would dominate Second Awakening scholarship [3].\n- **Perry Miller (essays of the 1950s)** made the Awakening pivotal to \"Americanization,\" a \"watershed\" that marked a permanent break from medieval, authoritarian Puritanism. For Perry Miller it was Edwards — not the rationalists — who supplied the intellectual framework for individual agency and a distinctively American consciousness, a reading that prepared the ground for Heimert (his student) [3].\n- **Richard L. Bushman (*From Puritan to Yankee*, 1967)** integrated social and community history with demographic data, arguing that rapid economic expansion produced a \"social disequilibrium\" that revivalism both intensified and assuaged, easing the wrenching transition \"from Puritan to Yankee\" — an interpretation that anticipated the anxiety-and-order strand of later debate while grounding it in granular Connecticut evidence [3].\n\nThe point of rehearsing this lineage is that Butler's \"interpretive fiction\" charge was not merely a quibble about a label; it was an attack on the *load-bearing function* the \"Great Awakening\" had performed in every one of these accounts. If there was no coherent event, then Parrington's rear-guard, Gewehr's first national movement, Perry Miller's watershed, Heimert's revolutionary tributary, and Bushman's equilibrium-restorer all lose their object. This is why the article \"forced nearly all later historians to address the charges made within its pages\" [2] — it threatened to pull the keystone out of a century of interpretation.\n\n### 1C. Lambert's \"invention\" — a friendly amendment that relocates the crime\n\nFrank Lambert's *Inventing the \"Great Awakening\"* (Princeton, 1999) is often grouped with Butler as a second \"denial,\" but this misreads it. Lambert *accepts* that \"the Great Awakening\" is a construction — but he disputes Butler on *who built it and when*. For Lambert, the invention was not the work of nineteenth-century historians like Tracy; it was the work of the eighteenth-century revivalists themselves [7][8].\n\nIn Lambert's terms:\n\n- The evangelicals — Whitefield above all — were \"skillful and enthusiastic religious promoters\" who used \"commercial strategies and newly popular print media\" to construct a revival, reporting dramatic meetings in one place to spark gatherings in another [8].\n- The very *idea* of an intercolonial, transatlantic \"great and general awakening\" was \"integral to the rhetoric of the revivals\" and was extensively promoted in pro-revival books and periodicals as the events were happening — not a century later [7][8].\n- The \"Great Awakening\" was therefore a contemporaneous construction, the product of \"a sustained, intensive struggle over meaning that may be termed an early American culture war,\" fought largely in print [3]. Joseph Conforti and others have endorsed Lambert's relocation of the invention to the revival period itself while still accepting Butler's underlying point that the unified story served interested parties [9].\n\nThe crucial nuance: Lambert's thesis is *less* skeptical than Butler's about whether the participants experienced something they took to be a single transatlantic work of God. Lambert's revivalists *believed in* the Awakening and worked to make others believe in it; the \"invention\" is the rhetorical-commercial construction of a shared narrative, not a historian's later fabrication of an event that no one at the time perceived. This is why Lambert sits, awkwardly, between the skeptics and the defenders.\n\n### 1D. The defenders: Kidd, Stout, Noll — and the \"long Great Awakening\"\n\nThe constructive response came most fully from **Thomas S. Kidd**, *The Great Awakening: The Roots of Evangelical Christianity in Colonial America* (Yale, 2007), explicitly framed in its introduction as an answer to Butler and Lambert [10][11]. Kidd's position, at its strongest:\n\n- **Grant the construction, keep the substance.** Kidd does not deny that \"the Great Awakening\" is a problematic, partly constructed label; he recognizes \"problems with calling this period 'the' Great Awakening\" [9]. What he denies is the inference from \"the label is constructed\" to \"nothing coherent happened.\" \"Massive and important, inter-colonial and long-lasting changes\" did occur [9].\n- **It was \"great\" because it produced evangelicalism.** Kidd's signature claim is that the revivals can be called \"great\" not because they were a single tidy event but because they \"produced the evangelical movement\" — a transatlantic, experiential, conversion-centered Protestantism that would dominate American religion thereafter [11].\n- **The \"long Great Awakening.\"** Kidd reframes the phenomenon as a \"long Great Awakening,\" a transatlantic process running from Solomon Stoddard through the Revolutionary era, with the nineteenth-century Second Awakening as an *extension* of the first rather than a separate event [10][12]. This dissolves Butler's \"it was patchy and diffuse\" objection by embracing the diffuseness and redescribing it as duration and reach.\n- **A better taxonomy.** Kidd replaces the old Old Light / New Light binary with a tripartite scheme — anti-revivalists, moderate evangelicals, radical evangelicals — that captures the heterogeneity Butler said the unified label erased, while still treating the revivals as a connected phenomenon [3][11].\n\n**Harry S. Stout** supplied the communications-history backbone for the defenders. His *The Divine Dramatist: George Whitefield and the Rise of Modern Evangelicalism* (1991) argued that Whitefield's theatrically trained, media-savvy itinerancy created a genuinely new, intercolonial form of mass religious communication — \"Anglo-America's first religious celebrity\" — that knit distant revivals into a perceived common movement [13][14]. Stout's earlier *The New England Soul* (1986) made the parallel case for the power of the spoken sermon. The force of Stout's work for this debate is that it supplies a *mechanism* for coherence: if the revivals felt like one movement, it is because a real communications revolution — itinerancy plus print — made them legible as one to contemporaries.\n\n**Mark A. Noll**, in *The Rise of Evangelicalism: The Age of Edwards, Whitefield and the Wesleys* (2003), placed the colonial revivals within a transatlantic English-speaking evangelical awakening of the 1730s–90s, organized around David Bebbington's \"quadrilateral\" definition of evangelicalism — conversionism, activism, biblicism, crucicentrism [15][16]. Noll's contribution to the existence debate is comparative: the colonial revivals were not an isolated American oddity to be deconstructed but the American front of a coherent, multinational evangelical movement whose connections (Edwards reading Whitefield, Whitefield corresponding with the Wesleys, Scottish and Welsh revivals feeding the same print networks) are documented and dense [15].\n\n### 1E. What is actually at stake — and where the evidence leans\n\nThe single most important analytical move in this debate is to refuse the polemical framing that fuses two distinct claims:\n\n1. **Did the revivals happen?** — Essentially undisputed. No serious historian denies that Northampton convulsed in 1734–35, that Whitefield drew enormous crowds in 1739–41, that the Tennents itinerated, that conversions and church growth and bitter controversy followed. Butler does not deny the revivals; he denies their *unity and consequence* [3][9].\n2. **Did they form a single coherent \"event\" called \"the Great Awakening\"?** — Genuinely disputed. Here the skeptics (Butler), the relocators (Lambert), and the defenders (Kidd, Stout, Noll) actually disagree.\n\nMost of the apparent ferocity of the debate dissolves once these are separated, and a near-consensus emerges on the factual layer: contemporaries did not use the term, and the unified capital-letter \"Great Awakening\" is to some degree a construction. The live disagreement is *interpretive*: whether the construction tracks a real coherence (defenders) or imposes a false one (Butler), and *when and by whom* the construction was made (Lambert vs. the older Tracy attribution).\n\n**Assessment.** The weight of recent evidence leans toward the chastened defenders. Three considerations:\n\n- **Lambert's documentation cuts against Butler's strong form.** If the idea of a transatlantic awakening was already circulating in pro-revival print *in the 1740s* — which Lambert demonstrates — then the unified narrative is not merely a nineteenth-century retrojection; contemporaries themselves perceived and promoted connectedness. That damages Butler's \"it only became one event in 1842\" claim even as it concedes his \"it was constructed\" claim [7][8].\n- **Stout and Noll supply the mechanism the skeptics lack.** Butler's \"patchy and diffuse\" objection has real force against a naive \"one event\" model, but Stout's communications revolution and Noll's transatlantic networks explain *how* diffuse local revivals could be, and could be perceived as, a connected movement [13][15].\n- **The productivity test favors the defenders.** Kidd's reframing — \"great\" because it *produced* evangelicalism — shifts the burden from \"was it a single event?\" (where the skeptics win) to \"did it produce a coherent and durable thing?\" (where the defenders win, because evangelicalism is observably real and traceable to these revivals) [11].\n\nThe honest verdict is a both/and that neither pole likes: the *unified label* is a construction, and the *phenomenon it labels* is real and consequential. Butler permanently raised the bar of evidence; the field cleared it by abandoning the naive \"single event\" model and defending a \"connected, transatlantic, productive movement\" model instead. The remaining genuine dispute is over *how* connected — a matter of degree, not of existence.\n\n---\n\n## Debate 2 — What Drove the Second Awakening?\n\nIf the First Awakening debate is about *whether the thing existed*, the Second Awakening debate is about *why the thing happened*. Here the revivals' occurrence is undisputed; the contest is over causation, and the field has cycled through three dominant readings plus a recent counter-thread.\n\n### 2A. The social-control thesis (the older consensus)\n\nThe first sustained interpretation read the revivals — and especially the reform movements and the \"benevolent empire\" of voluntary societies they spawned — as instruments of **social control**: elites managing the disorder and anxiety thrown up by a society in rapid transformation.\n\nAt its strongest: in a period of disestablishment, frontier expansion, and the loosening of inherited hierarchies, religious and social elites faced a population they could no longer command by deference or law. Revivalism and its associated reforms (temperance, Sabbatarianism, moral societies) became a mechanism for re-imposing order — disciplining \"the public's eating, drinking and sexual habits\" — through internalized self-control rather than external coercion [17]. Charles I. Foster's *An Errand of Mercy: The Evangelical United Front, 1790–1837* (1960) and Charles C. Cole's work on Northern clergy supplied the institutional substance; Whitney Cross's classic *The Burned-over District* (1950) anchored the upstate-New York case study; Timothy Smith connected the impulse to a postmillennial drive to build God's kingdom on earth [17][18]. The thesis had a quasi-Marxian and a Durkheimian wing — revivalism as class instrument and revivalism as solidarity-restoration after social rupture.\n\nThe strongest evidence: the demonstrable elite leadership of the great benevolent societies, the timing of reform offensives against precisely the behaviors that threatened bourgeois order, and the concentration of revival enthusiasm in regions (like Cross's \"burned-over district\") undergoing acute social and economic dislocation [17].\n\nThe weakness, which Hatch and others would exploit: the thesis is condescending to the converts, treating ordinary believers as objects managed from above rather than agents pursuing their own ends, and it struggles to explain the *anti-elite*, populist, schismatic energy that the revivals so obviously also carried.\n\nA distinct and more sophisticated cousin of social control deserves separate billing, because it reframed the question in a way the later literature absorbed. **Donald G. Mathews**, in \"The Second Great Awakening as an Organizing Process, 1780–1830: An Hypothesis\" (*American Quarterly*, 1969), argued that the Awakening is better conceived not as a \"revival\" or a series of emotional episodes at all but as an **organizing process** — a vast exercise in voluntary institution-building that gave dispersed, mobile, socially dislocated populations (especially on the expanding frontier) the churches, associations, disciplines, and identities they needed to cohere into communities [17a]. Mathews's hypothesis is neither elite-management (social control) nor lay-insurgency (democratization) in any simple sense; it foregrounds the *organizational work* the revivals performed, and in doing so it anticipates both Johnson's institutional attention and the later post-Hatch turn toward institutionalization and denominational consolidation. Its strength is that it explains the most conspicuous *output* of the Second Awakening — not feelings but institutions: tens of thousands of new congregations, the great voluntary societies, the denominational machinery — better than either of the more famous theses. Its limitation is that \"organizing process\" is a description more than a cause; it tells us *what* the Awakening did without fully telling us *why* it took the revivalist form it did.\n\n### 2B. The market-revolution reading: Paul Johnson's *A Shopkeeper's Millennium*\n\nPaul E. Johnson's *A Shopkeeper's Millennium: Society and Revivals in Rochester, New York, 1815–1837* (1978) is the most influential and tightly argued descendant of the social-control tradition, refined and partly transformed by the \"market revolution\" framework [19][20]. In Johnson's terms:\n\n- Rochester's revival under Finney (1830–31) was not the response of anxious mobile individualists seeking meaning. It was a **class** phenomenon: \"a way for a dominant class of manufacturing proprietors to restore order to a community full of unpoliced and politically restive workingmen\" [19].\n- The proximate driver was the **market revolution** — the dissolution of the old household-based master-journeyman relationship as masters became employers and workers became wage labor, severing the paternal bonds that had once disciplined the workforce [19][20].\n- Evangelical religion gave the new manufacturing middle class a language of \"moral accounting\" and self-discipline that could be exported to the workforce: a sober, industrious, temperate workman was a converted workman. Revival was middle-class self-fashioning that doubled as labor discipline [19].\n- The downstream effect was enormous: the revivals made the United States \"the most militantly Protestant nation on earth\" and fed the great Northern reform movements, including abolition and temperance [19].\n\nJohnson's evidence is the granular social history of one industrializing city — church membership records cross-tabulated against occupation, residence, and economic role — which gives the thesis an empirical density the older social-control writers lacked [19][20]. This is its strength and the source of its persuasiveness. Its contested edge is the inference from *Rochester* to *the nation*, and the reduction of religious experience to class function, which the democratization camp would resist.\n\n### 2C. Hatch's democratization thesis (the displacing interpretation)\n\nNathan O. Hatch's *The Democratization of American Christianity* (Yale, 1989) reframed the whole question and, for a generation, displaced social-control as the field's center of gravity [21][22]. In Hatch's own terms:\n\n- The half-century after the Revolution witnessed a **crisis of religious authority** in which \"common people became powerful actors on the religious scene\" [21]. The revolutionary \"passion for equality\" spilled into religion, and ordinary, unschooled people seized the authority to preach, interpret Scripture, sing, and publish for themselves.\n- This was a populist, **anti-elite** revolt against \"tradition, clerical hierarchy, and formality.\" It pushed \"fiery communicators to national prominence in the place of a clerical elite,\" empowering laymen and splitting churches [22].\n- Hatch examined five insurgent movements — the Christian Connection, the Methodists, the Baptists, the Black churches, and the Mormons — to show how each \"offered compelling visions of individual potential and collective aspiration to the unschooled and unsophisticated\" [21].\n- The result was a religious style — entrepreneurial, market-driven, lay-led, suspicious of educated clergy — that became \"a scriptural foundation for nineteenth-century American individualism\" and that still marks American Christianity [21][22].\n\nThe decisive reversal: where social-control read revival as elites managing the masses *from above*, Hatch read it as the masses seizing religious power *from below*. The same revivals, inverted. Hatch's evidence is the explosive growth of the most populist and least respectable denominations (Methodists and Baptists overtaking the colonial-establishment churches), the flood of lay preaching, the new vernacular hymnody and cheap religious print, and the leveling theological innovations (free will, immediate conversion, the priesthood of all believers in radical form) [21]. John H. Wigger's *Taking Heaven by Storm: Methodism and the Rise of Popular Christianity in America* (1998) extended Hatch's argument into a deep study of Methodist growth — from fewer than 1,000 members in 1770 to over 250,000 by 1820 — explaining it through Methodism's openness to dreams, visions, lay exhorters, and its circumvention of \"conventional assumptions about education, social standing, gender, and race\" [23].\n\n### 2D. The counter-thread: institutionalization, the state, region, and \"popularization not democratization\"\n\nThe most important *current* development in this debate is the sustained critique of Hatch that has accumulated since the 2000s. This is where the live argument now sits. At full strength, the critics make several distinct moves:\n\n- **Popularization is not democratization.** The sharpest objection (developed by, among others, the historians surveyed in the *Junto*'s \"After Democratization?\" assessment) is that Hatch **conflates** two different things: \"popularization\" — leaders appealing to popular tastes — and \"democratization\" — an actual expansion of institutional and political power for the laity. The former is clearly visible after the Revolution; the latter is \"much more questionable\" [24][25]. Methodism, the paradigm case, was in fact governed by a highly *centralized, episcopal, authoritarian* connectional structure under Asbury — hardly a democracy. The appeal was popular; the power was not lay.\n- **The state did not vanish.** A second move targets the assumption of a \"free market of religion\" after disestablishment. State governments continued to shape religious competition through incorporation laws, test oaths, tax assessments, and property regimes; the \"voluntary marketplace\" was a legal construction, not a state of nature [24][25]. This is an explicit call to shift the field's attention from *cultural* to *institutional and legal* factors.\n- **Anxiety, not confidence.** Amanda Porterfield's *Conceived in Doubt: Religion and Politics in the New American Nation* (2012) repositions early national evangelicals as people *exploiting* chronic political and spiritual uncertainty, not striding confidently into a democratic marketplace — a reading that re-imports the anxiety the social-control thesis had emphasized, but relocates its agency [24].\n- **Region and consolidation.** Curtis D. Johnson, in *Islands of Holiness: Rural Religion in Upstate New York, 1790–1860* (1989) and *Redeeming America: Evangelicals and the Road to Civil War* (1993), insists on internal diversity and on a trajectory of *consolidation*, not just insurgency: churches evolved \"from embattled congregations of the saved — 'islands of holiness' — to ideologically conservative, organizationally unified, integrated parts of society,\" and the field needs a typology (formalist vs. antiformalist, evangelical vs. non-evangelical, Arminian vs. Calvinist) rather than a single national \"democratization\" arc [26]. The unit of analysis matters: a single national story flattens enormous regional difference.\n- **Whose democratization?** A pointed objection notes that \"democratization\" sits awkwardly across movements with radically different polities — Freewill Baptists (congregational), Methodists (episcopal), Mormons (hierarchical-prophetic) — and that the theme strains to unify them [24].\n\n### 2E. Distinguishing the disagreements, and where the evidence leans\n\nIt is important to see what *kind* of disagreement each pair represents:\n\n- Social-control vs. Hatch is partly a **factual** dispute (did lay people actually gain institutional power, or were they managed?) and partly an **interpretive/values** dispute (whose agency do we foreground?). The factual core — Methodist polity was centralized — is checkable, and it favors the critics on the narrow point of *institutional* power.\n- Johnson (market revolution) vs. Hatch is largely a dispute about the **right level of analysis**: Johnson's class-and-economy mechanism and Hatch's culture-and-authority mechanism are not strictly incompatible. One can hold that the market revolution created the social conditions *and* that ordinary people exercised real cultural agency within them.\n\n**Assessment.** The weight of evidence supports a layered synthesis rather than any single thesis:\n\n- **Hatch named something real and permanent** — the populist, anti-elite, lay-energized *style* of American religion, and the displacement of the colonial establishment churches by the Methodists and Baptists, is not in dispute and is his enduring contribution [21][23]. Placing populist religion \"at the center of the Second Great Awakening\" was, as even critics concede, \"categorically correct and long overdue\" [22].\n- **But the critics have the better of the narrow institutional argument.** Hatch's \"democratization\" overstates lay *institutional* power (Methodist centralization is the decisive counterexample), and the field's current movement — toward institutional/legal history, the persistence of the state, denominational consolidation, and regional specificity — is a genuine correction, not a footnote [24][25][26]. The honest term is closer to *popularization* than *democratization* for the institutional layer, while *democratization* survives as a description of the cultural-rhetorical layer.\n- **Johnson's market-revolution mechanism remains the best account of the *social conditions*** of revival in the industrializing North, with the standing caveat against over-generalizing one city to the nation, and against reducing belief to class function [19][20].\n\nThe field has not so much resolved this debate as *layered* it: market revolution supplies the structural conditions, democratization the cultural style, and institutionalization/region the necessary correction against treating the style as the whole story.\n\n---\n\n## Debate 3 — Continuity vs. Rupture Between the Two Awakenings\n\nA debate that runs underneath the other two: are the First and Second Awakenings two phases of one thing, or two different things?\n\n### 3A. The \"difference in kind\" reading\n\nThe textbook contrast is stark and has real textual warrant. On one side stands **Jonathan Edwards**: the Northampton revival as controlled, orderly, intellectually formidable, theologically rigorous, and thoroughly **Calvinist** — divine sovereignty, the bondage of the will, conversion as a work of God that no human technique can manufacture. On the other stands **Charles Grandison Finney**: the revivals of the 1820s–30s as emotional, populist, technique-driven, and effectively **Arminian** — the \"new measures\" (the anxious bench, protracted meetings, public prayer for named sinners, the immediate demand for decision) and Finney's insistence that a revival is \"not a miracle\" but the predictable result of the right means rightly used [27][28].\n\nAt its strongest, the difference-in-kind reading holds that the theology *changed at the root*. Edwards's revival presupposed that the sinner could do nothing; Finney's presupposed that the sinner was \"morally responsible to respond to the Gospel when convicted by the Spirit\" and that the evangelist's job was to remove every obstacle to that response [27]. With Finney, in the words of the critical literature, \"the preoccupation with theology exemplified by Jonathan Edwards began to yield to a more one-sided concern with religious experience; revivalism increasingly purveyed a simple religion of the heart\" [27]. The intervening theological development — Timothy Dwight, then Nathaniel W. Taylor's New Haven theology, softening Calvinist necessitarianism toward human ability — provides the bridge by which Calvinism mutated into something Finney could push the rest of the way [27]. The strongest evidence is the texts themselves: Edwards's *Religious Affections* and *A Faithful Narrative* read very differently from Finney's *Lectures on Revivals of Religion* (1835), which are frankly a manual of technique.\n\n### 3B. The continuity reading\n\nThe continuity camp argues that the difference-in-kind contrast is a caricature that flatters neither figure and that obscures a real Edwardsian lineage running straight through the Second Awakening. At its strongest:\n\n- **Edwardsianism persisted as a living tradition.** The \"New Divinity\" / Edwardsian Calvinists (Samuel Hopkins, Joseph Bellamy, and their successors) carried Edwards's theology of revival forward; the gentler New England revivals under Dwight, Asahel Nettleton, and Lyman Beecher were self-consciously Edwardsian and *orderly*, and they were a major strand of the Second Awakening, not a footnote to Finney. The \"emotional Arminian Finney\" stands for only one wing of a varied movement.\n- **Kidd's \"long Great Awakening\" dissolves the boundary.** If, as Kidd argues, the nineteenth-century revivals were \"really an extension of the first,\" then the two-Awakenings periodization is itself partly an artifact, and the search for a sharp rupture is misframed [12].\n- **The caricature flattens both figures.** Edwards was no opponent of strong affections — *Religious Affections* defends them as the heart of true religion; and Finney remained, by the standards of later revivalism, theologically serious and Calvinist-adjacent on more points than the cartoon allows. The contrast exaggerates Edwards's coolness and Finney's shallowness.\n- **Transatlantic continuity.** Carwardine's comparative work situates both Awakenings within a single, continuous transatlantic revival tradition (1790–1865), in which the techniques and the theology evolve gradually rather than breaking at a clean seam [29].\n\n### 3C. The confessional stakes — and why the \"rupture\" reading is partly an artifact\n\nIt is worth naming a feature of this debate that the textbook contrast obscures: much of the *sharpest* \"difference in kind\" rhetoric originates not in academic history but in confessional polemic. The most vivid formulations of \"orderly Calvinist Edwards vs. degenerate Arminian Finney\" come from the Reformed and Old-School Presbyterian tradition, for which Finney's denial of original sin's penal imputation, his \"moral government\" theology, and above all his \"a revival is not a miracle but the result of the right use of means\" represent a *fall* from Reformation orthodoxy — Finney as \"the tallest marker in the shift from Reformation orthodoxy\" [27]. This is a real and defensible theological judgment; but as *historiography* it has a tendency to read the period through the lens of a doctrinal declension narrative (orthodox height → revivalist decline) that mirrors, on the theological plane, exactly the kind of declension framing that Butler attacked on the social plane and Braude attacked on the gender plane (see Debates 1 and 6). The historian's task is to register the genuine theological shift without inheriting the polemic's verdict that it was simply a degeneration.\n\nThe mediating intellectual history matters here and is often skipped. The road from Edwards to Finney runs through the **New Divinity** (Samuel Hopkins, Joseph Bellamy, Nathanael Emmons), who were Edwards's self-conscious disciples and who *intensified* rather than abandoned his Calvinism, while also reformulating the doctrine of the will in ways (the \"natural ability / moral inability\" distinction) that later theologians could press toward human responsibility. Timothy Dwight at Yale and then **Nathaniel W. Taylor's New Haven theology** (the *Concio ad Clerum* of 1828, with its formula that sin is \"in the sinning\" and its insistence on real human \"power to the contrary\") carried that reformulation further, supplying the theological vocabulary in which Finney's practical Arminianism could seem a legitimate development of, rather than a betrayal of, the New England tradition [27]. Seen through this lineage, the Edwards-to-Finney passage is not a cliff but a gradient — each step a plausible response to the previous one, none a clean break. That gradient is the strongest single piece of evidence for the continuity reading, and it is *intellectual-historical* evidence, not merely the institutional fact of persistence.\n\n### 3D. Assessment\n\nThis debate is mostly **interpretive** — it turns on how much weight to give theological discontinuity vs. institutional and experiential continuity — though it has a factual core that is checkable: did Edwardsian revivalism in fact persist into the Second Awakening? It did; the New England revivals under Nettleton and Beecher, and the New Divinity tradition, are well documented. That fact tells against the strong rupture reading.\n\nThe weight of evidence favors a **qualified continuity**: there is a real and significant theological shift from Edwards's Calvinism to Finney's revivalist Arminianism, and the \"new measures\" mark a genuine methodological innovation in the manufacture of revival — so the rupture camp is not wrong about the *direction* of change. But the change was gradual, mediated (Dwight, Taylor), and partial; an Edwardsian, orderly, Calvinist revivalism persisted alongside Finney throughout the Second Awakening; and the textbook \"orderly Calvinist Edwards vs. emotional Arminian Finney\" binary caricatures both men and erases the moderate middle. The honest picture is a spectrum with Edwards and Finney near its ends and most of the actual Second Awakening living between them.\n\n---\n\n## Debate 4 — The Awakenings and the Revolution\n\nThis is the debate with the clearest single protagonist and the most dramatic reception history: a bold thesis, a withering rejection, and a partial rehabilitation.\n\n### 4A. Heimert's thesis\n\nAlan Heimert's *Religion and the American Mind: From the Great Awakening to the Revolution* (Harvard, 1966) is a 668-page argument that the intellectual origins of the American Revolution lie not in Enlightenment rationalism but in evangelical Calvinism [30][31]. In Heimert's terms:\n\n- It **inverted Parrington.** Where the dominant view (Parrington and his heirs) held that Americans rebelled as they shook off Calvinist dogma and emerged into Enlightenment universalism, Heimert argued the opposite: the \"liberals\" (the anti-revivalist, rationalist clergy) were in fact the *conservatives*, defenders of hierarchy and order, while the evangelical, New Light, Edwardsian Calvinists supplied the radical, egalitarian, mobilizing energy that made revolution thinkable [31].\n- The Awakening generated **two opposed mentalities** — evangelical and rationalist — and it was the evangelical one, with its language of the new birth, the sovereignty of God against earthly powers, and the spiritual equality of the converted, that fed revolutionary radicalism. In the strong form: \"without the Great Awakening Revolution would have been improbable\" [31].\n- The method was **hermeneutic** — close reading of sermons and tracts to recover the underlying mentalities, rather than tracing explicit political causation.\n\n### 4B. The pushback\n\nThe reception was brutal and is itself a famous episode in the field. At full strength, the critics:\n\n- **Edmund S. Morgan** (in the *William and Mary Quarterly*, 1967) questioned whether Heimert had actually *demonstrated* the causal link between the religious and political movements — the connection was asserted and illustrated, not proven [32].\n- **Sidney E. Mead** (\"Through and Beyond the Lines,\" *Journal of Religion*, 1968) attacked the *method*, arguing Heimert misread his sources and overstated evangelicalism's revolutionary impact; the famous detail is that Mead even misquoted Heimert, mistaking Heimert's \"Republican heavenly cities\" for Carl Becker's \"heavenly City\" — a slip that became emblematic of how hard the book was to read accurately [33].\n- **Bernard Bailyn**, whose *Ideological Origins of the American Revolution* (1967) was reshaping the field at exactly this moment, located the Revolution's intellectual origins in a *secular* republican / commonwealth ideology — radical Whig political thought, not evangelical religion [31][32]. Bailyn's framework, not Heimert's, became the dominant account.\n\nThe book was, in the standard summary, \"initially vilified and discounted for its method and arguments\" [31].\n\n### 4C. The rehabilitation\n\nThe striking later development is that Heimert's reputation recovered. As Philip Goff argues in \"Revivals and Revolution: Historiographic Turns since Alan Heimert's *Religion and the American Mind*\" (*Church History*), \"two social/intellectual movements seemingly at cross-purposes — Protestant evangelicalism and the new cultural history — rescued Heimert's work from scathing yet well-placed criticisms\" [31]. The rehabilitators worked not by reviving Heimert's strong causal claim but by recovering the *connection* in subtler forms:\n\n- **Nathan Hatch**, *The Sacred Cause of Liberty* (1977), traced the **millennial rhetoric** by which New England clergy fused religious and republican hope — a real link between evangelical eschatology and revolutionary ideology [31].\n- **Harry Stout**, *The New England Soul* (1986), analyzed the **communicative power of preaching** — the sermon as the central mass medium that shaped a revolutionary mentality [31].\n- **Mark Noll** and others explored specific denominational (e.g., Presbyterian) connections between revival religion and revolutionary politics [31].\n- **Patricia Bonomi**, *Under the Cope of Heaven: Religion, Society, and Politics in Colonial America* (1986), came down \"on the side of Heimert\" (against Bailyn) on the linkage between evangelical religion and the Revolution, though \"more subtly\" — arguing that the Awakening's challenge to established authority pervaded British North America and helped prepare the ground for political resistance [34].\n\n### 4D. Assessment\n\nThe factual question — *did* evangelical religion causally produce the Revolution? — is genuinely hard to settle, because counterfactual causal claims about mentalities resist proof; this is partly why Morgan's \"you asserted but did not demonstrate\" critique landed. The interpretive question — *is there a real connection between revival religion and revolutionary thought?* — has a clearer answer.\n\nThe weight of evidence: **Heimert's strong causal thesis is not sustainable** in the form he gave it (Morgan and Mead were right that the demonstration outran the evidence, and Bailyn's secular republican ideology better accounts for the explicit political argument of 1776). **But Heimert was pointing at something real** that the next generation recovered: the millennial and egalitarian rhetoric of evangelical religion *did* feed into and amplify revolutionary mobilization, even if it did not, by itself, cause the Revolution. The mature consensus is neither Heimert's \"religion caused it\" nor the old \"Enlightenment caused it and religion was incidental,\" but a both/and in which evangelical religion is one genuine tributary of the revolutionary stream — recovered through the study of rhetoric, millennialism, and preaching rather than through Heimert's direct ideological causation [31].\n\n---\n\n## Debate 5 — Race: An Opening to Black Christianity and a Faith Compatible with Slavery\n\nThis debate must be handled at full strength on both sides, because the historical record is genuinely double-edged. The point is not to choose between \"the revivals liberated\" and \"the revivals enslaved\" but to hold both, because both are documented.\n\n### 5A. The revivals as an opening to Black Christianity\n\nAt its strongest: the evangelical revivals were the principal vehicle by which large numbers of enslaved and free Black Americans became Christian, and the form of Christianity they adopted — experiential, conversion-centered, emotionally expressive — proved adaptable into a distinctive and ultimately liberating Black church tradition.\n\n- **Albert J. Raboteau's *Slave Religion: The \"Invisible Institution\" in the Antebellum South* (1978)** is the foundational study [35][36]. Raboteau traced the transformation of African religious sensibilities into evangelical Christianity, argued that \"roots, remembrances, and fragments of the African past survived the terror of slavery\" to ground a distinctive African American Christianity, and reconstructed the day-to-day religious life of enslaved communities — including the clandestine \"invisible institution\" of unsupervised worship — from slave narratives, missionary reports, folklore, and observers' accounts [35][36]. The revival's emphasis on a direct, unmediated experience of conversion, open to the unlettered and the unfree, made it accessible in a way the catechetical Anglican establishment had not been. (Raboteau, Henry W. Putnam Professor of Religion Emeritus at Princeton and a founding figure of African American religious history, died in September 2021; *Slave Religion* remains the field's touchstone [37].)\n- **Sylvia R. Frey and Betty Wood, *Come Shouting to Zion: African American Protestantism in the American South and British Caribbean to 1830* (1998)**, charted the conversion process as \"a complex reciprocal movement involving black and white Christians,\" emphasizing the role of Black preachers and the distinctive ritual patterns and moral community — especially among Black women — that emerged. New World Africans were drawn to evangelical, experiential Protestantism in part because its rituals \"resonated with longer-standing African religious practices\" [38].\n- **Kidd's argument that the revivalists \"led the way... in recognizing the full humanity of African slaves\"** belongs here: the radical-evangelical wing took the spiritual equality of all souls seriously enough to evangelize, baptize, and (in some cases) license Black preachers and license Black exhortation, planting the seed of an autonomous Black Christianity [11][12]. Hatch's inclusion of \"the Black churches\" among his five democratizing movements makes the same point from the populist angle [21].\n\n### 5B. The faith compatible with slavery\n\nWith equal force: the very same evangelical Christianity was, across most of its Southern history, fully reconciled to slavery — preached *by* slaveholders, defended *from* Scripture, and reshaped *to accommodate* the slave society in which it grew dominant.\n\n- **Christine Leigh Heyrman's *Southern Cross: The Beginnings of the Bible Belt* (1997, Bancroft Prize)** is the central text [39][40]. Its thesis is a deliberate inversion: \"the South changed Evangelicalism more than Evangelicalism changed the South\" [39]. The early itinerants had affronted Southern whites by their opposition to slaveholding, their disregard for masculine and generational hierarchy, their encouragement of women's public church roles, and their \"spiritual intimacy with blacks.\" Evangelicals achieved Southern dominance over roughly a century by *deliberately abandoning* those radical features — accommodating themselves to patriarchy, martial honor, and slavery — \"giving up much of what made them radical\" [39][40]. On this reading, the faith's compatibility with slavery was not an accident or a betrayal but the price and mechanism of its Southern triumph.\n- **George Whitefield himself embodies the contradiction.** As Thomas Kidd and Jessica Parr document, Whitefield first criticized Charleston slaveholders for failing to catechize the enslaved, then \"aggressively advocated for the removal of a ban on slaveholding in Georgia\" and introduced slave labor at his Bethesda Orphan House before Georgia legalized slavery in 1751 — reconciling evangelicalism with slavery through a paternalist theology that cast plantation labor as \"another means of advancing the gospel\" [41]. After his death, \"both proslavery and antislavery evangelicals invoked his memory,\" which is itself the deepest point: the revival tradition was malleable enough to underwrite both positions [41].\n- **The biblical-defense problem.** Mark A. Noll's *The Civil War as a Theological Crisis* (2006) shows why the proslavery side had the *easier* exegetical case, which is the uncomfortable core of the racial debate handled at full strength. Both sides agreed the Bible was authoritative; but \"those who argued most literally from certain passages of scripture were most likely to advocate for the slavery side,\" because the Old Testament plainly permitted and regulated slavery and the New Testament did not explicitly condemn it, whereas abolitionists had to argue from \"a broader sweep of scripture, the Golden Rule, and other less specific parts\" [42]. The result was a genuine theological crisis that the churches could not resolve by exegesis — they split, and then the nation went to war [42]. (The proslavery position is described and cited through the scholarship — Noll, Heyrman — rather than reproduced from primary proslavery polemic; the historical fact under discussion is the *structure of the argument*, not its content as anyone's belief.)\n\n### 5C. Distinguishing the disagreement, and assessment\n\nThe crucial point: this is **not primarily a factual dispute between two camps of historians**. Raboteau, Frey/Wood, Kidd, Heyrman, and Noll do not contradent one another on the facts; their findings are complementary. The \"debate\" is really about *emphasis and framing* — whether to foreground the liberating opening (Raboteau, the Black-church tradition) or the accommodation to slavery (Heyrman, Noll) — and about how to hold a tradition that was demonstrably both.\n\nThe weight of evidence supports holding both at full strength rather than choosing:\n\n- It is **established** that evangelical revivalism was the principal vehicle of Black Christianization and the seedbed of an autonomous, ultimately liberating Black church tradition (Raboteau, Frey/Wood) [35][38].\n- It is equally **established** that Southern white evangelicalism accommodated itself thoroughly to slavery and patriarchy, that it furnished a biblically literal proslavery argument that abolitionists could not easily defeat on exegetical grounds, and that the same revival faith underwrote both proslavery and antislavery positions (Heyrman, Noll) [39][42].\n\nThe honest historiographical finding is the doubleness itself: the revivals were a real opening to Black religious agency *and* a faith that the slave society remade in its own image. An account that resolved this into a single verdict would be falsifying the record. The most fruitful current work (Frey/Wood, the later Black-church historiography) traces how Black Christians took a faith handed to them partly as an instrument of control and made it into an instrument of survival, community, and eventually liberation — which is neither side of the binary but the historical reality that contains both.\n\n---\n\n## Debate 6 — Gender: The Predominance of Women and the \"Feminization\" Thesis\n\nThe final debate concerns the most demographically conspicuous fact about the revivals — that women predominated among converts and church members — and the interpretive framework that fact generated.\n\n### 6A. The feminization thesis\n\nAt its strongest: from the early nineteenth century, American Protestantism underwent a \"feminization\" — women came to predominate numerically in the churches, and the religious culture itself softened toward sentiment, domesticity, nurture, and the affective virtues coded as feminine.\n\n- **Barbara Welter** supplied both halves. Her \"The Cult of True Womanhood: 1820–1860\" (*American Quarterly*, 1966) defined the antebellum feminine ideal — piety, purity, submissiveness, domesticity — with *piety* as its foundation, binding women to the churches [43][44]. Her essay \"The Feminization of American Religion, 1800–1860\" argued that as religion lost public and intellectual authority it became more emotional, domestic, and female-coded; women gained \"organizational experience\" and a \"sisterhood\" essential to any later women's movement [44].\n- **Ann Douglas's *The Feminization of American Culture* (1977)** gave the thesis its most influential and most polemical form [45][46]. Douglas described an \"alliance, beginning in 1820, of disenfranchised women and Protestant clergy, both increasingly relegated to the edges of society,\" who together \"promulgate[d] an ideal of the gentle and the nurturing.\" Crucially, Douglas's account is **critical, even mournful**: she argued that this sentimental alliance \"merely tried to soften the edges of an aggressive, patriarchal, and capitalist culture\" and *failed* to produce an ideology that could actually challenge it — feminization as a loss of intellectual rigor (the displacement of muscular Calvinism by sentimental religion) rather than a triumph [45][46].\n\nThe evidence for the underlying demographic fact is strong and not seriously disputed: women did predominate among converts and members across the revivals of both Awakenings. The dispute is over what the predominance *means*.\n\n### 6B. The critiques\n\nThe feminization thesis drew sustained criticism, and this is where the live argument sits. At full strength, the critics:\n\n- **The declension framing is wrong.** Ann Braude's landmark essay \"Women's History Is American Religious History\" (1997) attacked the deep structure that makes \"feminization\" legible as a *decline*. The standard narrative — religion \"declined in the colonial period, was feminized in Victorian America, and gave way to a secular order in the twentieth century\" — only reads feminization as loss if one treats male participation as the norm and female predominance as deviation [47][48]. Braude's inversion: women have been the *majority* of participants throughout American religious history, so women's predominance is not a Victorian symptom of decline but the normal demographic baseline of American religion — and including women \"fundamentally changes the narrative being told\" [47][48]. On this view \"feminization\" misnames a constant as a change.\n- **Douglas condescends to sentimental women.** Feminist scholars charged that Douglas's account devalued women's religious and literary culture by accepting the very hierarchy (rigorous male theology > sentimental female religion) that it described — reading women's domestic religion as weakness rather than as a sphere of real agency and power.\n- **Women preachers break the domestic frame.** Catherine A. Brekus's *Strangers and Pilgrims: Female Preaching in America, 1740–1845* (1998) recovered roughly 123 women who *preached* during the two Awakenings — a fact incompatible with a simple \"women confined to domestic piety\" picture [49][50]. Brekus argues these women have been written out of history because they were \"too radical\" for later domestic-minded evangelicals and \"too conservative\" (too biblically orthodox, too uninterested in legal-political equality) for liberal feminists — a double erasure that distorts the gender history of the revivals [49][50]. Their existence shows the revivals opened a real, if contested and later-closed, space for female religious authority, not merely for sentimental piety.\n\n### 6C. Distinguishing the disagreement, and assessment\n\nThe layers must be separated:\n\n- **The demographic fact** (women predominated among converts/members) is **established** and not in dispute.\n- **The \"feminization of religious culture\" claim** (the culture itself became sentimental/domestic/affective) is **interpretive** and contested — partly true, partly an artifact of comparing antebellum sentimental religion to an idealized earlier \"masculine\" Calvinism.\n- **The \"feminization as decline\" framing** is the most contested layer, and Braude's critique substantially undermines it: if women were always the majority, then reading their predominance as a Victorian *fall* embeds a male-normative assumption [47].\n\nThe weight of evidence: Welter and Douglas correctly identified a real and important phenomenon — women's centrality to the revivals and to nineteenth-century religious culture, and a genuine softening of the dominant religious tone toward sentiment. But the *framing* needs the critics' correction on two points. First, Braude is right that \"feminization\" can smuggle in a declension narrative that treats female predominance as deviation from a male norm, when it was closer to the baseline [47]. Second, Brekus is right that the domestic-sentimental frame omits the women who exercised real public religious authority as preachers and exhorters, which the revivals genuinely (if temporarily) enabled [49]. The mature position keeps the demographic and cultural insight while discarding the declension framing and adding back the female agency — preaching, exhorting, organizing — that the original sentimental-feminization picture left out. As Braude put it, women's history is not a sidebar to American religious history; it *is* American religious history, and the revivals are the clearest case [47][48].\n\n---\n\n## Cross-Cutting Dynamics: What Is Moving in the Field Now\n\nBeyond the six set-piece debates, several dynamics are actively reshaping the scholarship and bear noting as live motion rather than settled structure:\n\n1. **From cultural to institutional/legal history.** The clearest current movement, visible in the post-Hatch critique, is a shift from the cultural-history mode that dominated the 1980s–90s (mentalities, rhetoric, popular religion) toward institutional, legal, and economic history — disestablishment as a *legal* process, denominational property and incorporation, the persistent role of the state, the political economy of the \"religious marketplace\" [24][25]. The question is changing from \"what did ordinary believers feel and seize?\" to \"what institutions and laws structured the field they acted in?\"\n\n2. **The transatlantic / Atlantic-world turn.** Noll, Carwardine, and the Bebbington-Noll evangelical-history series have consolidated the view that the American revivals are unintelligible in isolation — they are one front of a transatlantic English-speaking evangelical movement, with the comparison to Britain (where, Carwardine shows, structural conditions *prevented* the American-style flowering of revivalism) doing real analytical work [15][29]. This both supports the defenders against Butler (the connections were real) and complicates any purely American causal story.\n\n3. **The dissolution of the two-Awakenings periodization.** Kidd's \"long Great Awakening\" and the continuity readings are eroding the sharp First/Second boundary, pushing toward a model of recurring, connected revival across a long evangelical century [12].\n\n4. **Race and gender as central, not supplementary.** The trajectory across the last half-century has been the steady movement of race (Raboteau → Frey/Wood → the Black-church historiography) and gender (Welter → Douglas → Braude → Brekus) from the periphery of the field to its center — Braude's \"women's history *is* American religious history\" being the programmatic statement of that move [47]. This is less a debate now than a consolidated reorientation, though its implications for the older causal debates (social control, democratization, Heimert) are still being worked out.\n\n5. **Digital and quantitative methods.** Newer work (e.g., Lisa Smith's study of the Awakening in colonial newspapers) brings systematic, sometimes quantitative analysis of the print record to bear on exactly the question Lambert raised — how the revivals were constructed in and through print — which may eventually move parts of the \"did it exist?\" debate from the interpretive column toward the factual one by measuring, rather than asserting, the density and timing of the \"awakening\" narrative in contemporary media [51].\n\n---\n\n## Synthesis: The Shape of the Field\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 452\" role=\"img\" aria-label=\"A two-column ledger of six historiographical debates about the Great Awakenings. Each row pairs a bold thesis (slate-indigo card, the critical pole) on the left against where the evidence actually lands (field-green card, a both/and) on the right, with a short debate label at the far left. Row one: did the First Awakening exist? Bold: an interpretive fiction, per Butler. Lands: real revivals but a constructed label. Row two: what drove the Second? Bold: democratization, per Hatch. Lands: market revolution plus style plus institutionalization. Row three: continuity or rupture? Bold: Calvinist Edwards versus Arminian Finney. Lands: a gradient through the New Divinity. Row four: religion and the Revolution? Bold: evangelical Calvinism caused it, per Heimert. Lands: one tributary, not the cause. Row five: race. Bold: liberation or slavery? Lands: both, documented. Row six: gender. Bold: feminization as decline. Lands: women were always the majority. Across all six the strong claim proves half-true and the mature verdict is a layered both/and.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif\" letter-spacing=\"2.5\">EVERY STRONG THESIS IS HALF RIGHT<\/text>\n<text x=\"350\" y=\"43\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">the six debates and the chastened both/and<\/text>\n<text x=\"174\" y=\"6
