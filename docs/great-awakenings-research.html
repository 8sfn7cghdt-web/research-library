 surviving disagreement, carried *inside* the decline scenarios rather than averaged.\n\n**Mass awakenings per century.** Roughly 2 first-order American Awakenings, plus disputed 3rd and 4th labels, across ~280 years works out to about one trend-breaking revival per 70-140 years; only ~2 of the ~7 noticed episodes since 1800 moved national adherence at scale, and the disputed status of the later ones shows that contemporaries rarely recognize an awakening in real time. This anchors the Surge/Discontinuity tail low, at ~6-12%.\n\n**Market proxies (thin, play-money sanity checks only).** Manifold's \"Christian affiliation increases over 5 yrs\" sits at 27% YES and \"Christian share below 60% by end-2026\" at 19% YES (pulled 2026-06-20, 55-96 bettors). Both lean toward slow-decline-or-leveling, bounding both the large upside (a revival surge must sit below 27%) and an imminent collapse. No liquid market exists on the exact generational question or on historiography, so the forecast falls to base rates; related Metaculus questions had inaccessible prices.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n|---|---|---|---|---|\n| Manifold | Will Christian affiliation in the United States increase over five years? (Gallup 2026-2031 avg > 2021-2025 avg of ~66%) | 27% YES (0.272) | ~M$15,090 vol; M$6,000 liquidity; 96 bettors (play-money) | 2026-06-20 |\n| Manifold | Will the percentage of U.S. adults identifying as Christian drop below 60% by the end of 2026? (Pew baseline 64% in 2020) | 19% YES (0.193) | ~M$5,029 vol; M$1,000 liquidity; 55 bettors (play-money) | 2026-06-20 |\n| Metaculus | What percent of the global population will identify as atheist/agnostic in 2050? (Question ID 1552; global scope, not US/Awakenings-specific) | Not retrieved — price inaccessible; question confirmed to exist | Play-money; forecaster count not retrievable | 2026-06-20 |\n| Metaculus | Will \"No Religion\" become the majority/largest response in Australia's 2026 census? (Question ID 12298; foreign secularization proxy) | Not retrieved — price inaccessible; question confirmed to exist | Play-money; forecaster count not retrievable | 2026-06-20 |\n| Manifold | Will Americans' confidence in organized religion decline in 2024, according to Gallup? (single-year trust proxy, now STALE) | 7% YES (0.074) | ~M$733 (very thin, play-money) | 2026-06-20 |\n\nThe market signal is thin, consistent with the forecast's center of mass rather than decisive on its own. The two live Manifold proxies — a 27% chance that Christian affiliation *increases* over five years and a 19% chance the Christian share falls below 60% by end-2026 — together describe a market that expects slow decline or leveling, not a cliff and not a rebound. That bounds the scenarios from both sides. The Surge/Discontinuity tail must sit below 27%, since a curve-bending surge is a strict subset of \"affiliation increases,\" and it does at 6-12%. The 19% holds the imminent-collapse reading in check, which kept the steeper-slide scenario from being priced too aggressively in the near term. The 27% explicitly caps the Stabilization branch, since a durable plateau is a weaker claim than rising affiliation yet still sits in the upper tail of the not-falling mass. No market prices the *exact* generational question this forecast addresses, and none prices the historiography at all; the closest Metaculus questions are foreign-scope or global secularization proxies whose prices were inaccessible. The markets are therefore sanity checks, not anchors, and the forecast rests primarily on the base rates above.\n\n## What Would Change My Forecast\n\n1. **The decisive arbiter — cohort tracking, 2028-2034.** If GSS/Pew tracking shows the 18-29 Christian share *rising* toward older cohorts across two consecutive surveys (or any within-cohort re-religionizing), the contrarian's intact-gradient premise is falsified and weight moves from Resumed Slide to Managed Decline / Stabilization. If the youngest cohort instead enters *below* the prior cohort's entry level, Voas-Chaves erosion is confirmed and weight moves to Resumed Slide.\n2. **Aggregate Christian-share readings.** Pew/PRRI/Gallup leveling near 55-62% confirms the modal; a sustained sub-58% then sub-50% reading before 2035, or two waves of renewed greater-than-0.7-point-per-year decline, shifts weight to Resumed Slide; a durable two-cohort plateau above ~60% shifts it to Stabilization.\n3. **Carrier-mix data.** A rising non-denominational plus Pentecostal/charismatic share of US Protestants confirms the form persisting via new carriers (modal). Two-plus consecutive survey waves of *falling* non-denom/charismatic share, or a year-over-year decline in new-church-plant counts (e.g. ARDA or denominational plant registries), is the strongest single refutation of the form-survival thesis the top two scenarios share.\n4. **A data-confirmed national revival.** A multi-year national participation increase traceable to a specific revival movement — sustained rising baptisms and attendance, not a viral moment — or an outpouring an order of magnitude beyond Asbury 2023 that is contemporaneously named a \"Fifth Great Awakening\" activates the Surge tail. SBC baptisms ticking up amid membership decline is the early watch.\n5. **The historiography arbiter.** A widely cited computational-history study settling the \"did the Great Awakening exist as a unified event\" question, two editions of a dominant survey text abandoning the both/and, or a landmark monograph dislodging the synthesis would confirm the synthesis-erosion half of Resumed Slide. A decade of scholarship only *deepening* the both/and confirms the extension reading in the modal.\n6. **Demographic discontinuity.** A large, sustained high-religiosity immigration regime reseeding US Pentecostalism and Catholicism moves weight to Stabilization; evidence that immigrant religiosity assimilates *down* to native secular rates within a generation moves it to Resumed Slide.\n7. **A communications/epistemic regime change.** AI-mediated religious meaning-making reaching mass scale and displacing the print-and-itinerancy mechanism that has carried revival since 1740 activates the discontinuity half of the tail and would force a greater-than-5-point non-linear move in a single survey wave.\n8. **A new liquid market.** The emergence of a liquid prediction market on the exact generational US-revivalism trajectory, or on Awakenings historiography, would replace the base-rate-led estimate with a genuine market anchor and warrant a full re-derivation.\n\n## Open Questions\n\n- **Is the 2019 leveling a floor or a pause?** This is the single unresolved disagreement that organizes the whole forecast. Only the next two cohort waves (~2028-2034) will settle it; until then the honest representation is the gap between Managed Decline (40-50%) and Resumed Slide (25-35%), not a midpoint.\n- **Does immigrant religiosity persist or assimilate down?** Whether Global-South-origin Pentecostal and Catholic populations retain their religiosity across a US-raised generation, or converge toward native secular rates, is the swing variable between Stabilization and Resumed Slide — and the evidence on it is thinner than on the native-cohort trend.\n- **Will the scholarly synthesis extend or overturn?** The both/and is the current weight of evidence, but the base rate for mature syntheses in this subfield surviving 20 years is genuinely contested (~0.75 extension vs. ~24% overturn). A computational-history settlement of \"did the Great Awakening exist as a unified event\" could move this either way.\n- **Can a networked outpouring ever convert attention into institution?** Asbury 2023 produced reach without durable membership growth. Whether the digital/livestream mechanism can cross from viral moment to sustained institution-building is the hinge of the Surge sub-case, and it is, as yet, untested at scale.\n- **What would an AI-mediated medium shift do to revival?** The print-and-itinerancy mechanism has carried revival since 1740. A genuine shift in how religious meaning is transmitted is the least-modelable element in the whole forecast, and the reason the discontinuity tail is held open rather than zeroed.\n\n## Sources\n\nThis forecast is built on the drivers and base rates established earlier in this account; the load-bearing sources come from the annotated source list and the prediction-market sweep of 2026-06-20.\n\n- David Voas & Mark Chaves, \"Is the United States a Counterexample to the Secularization Thesis?\" *American Journal of Sociology* 121, no. 5 (2016): 1517-1556 — the between-cohort secularization mechanism placing the US on the Western curve.\n- Roger Finke & Rodney Stark, *The Churching of America, 1776-2005: Winners and Losers in Our Religious Economy* (Rutgers University Press, 1992/2005) — the religious-economy / church-sect model and the denominational-share data.\n- Nathan O. Hatch, *The Democratization of American Christianity* (Yale University Press, 1989) — the democratization driver keeping the marketplace movement-generating.\n- William G. McLoughlin, *Revivals, Awakenings, and Reform* (University of Chicago Press, 1978) — the five-awakenings cyclical/revitalization model behind the Surge tail's reference class.\n- Robert William Fogel, *The Fourth Great Awakening and the Future of Egalitarianism* (University of Chicago Press, 2000) — the awakening-cycle / techno-economic frame a surge would vindicate.\n- Center for the Study of Global Christianity (Gordon-Conwell), \"Status of Global Christianity, 2025\" — ~644M in the broad Pentecostal/charismatic movement.\n- Pew Research Center, \"Decline of Christianity in the U.S. Has Slowed, May Have Leveled Off,\" 2025-02-26 — the post-2019 leveling and the evangelical 26%→23% trend.\n- Pew Research Center, \"2023-24 Religious Landscape Study: Executive Summary,\" 2025-02-26 — US 62% Christian, 29% unaffiliated, evangelical 23%.\n- Lifeway Research, \"Southern Baptists' Membership Decline Continues Amid Other Areas of Growth,\" 2025-04-30 — SBC at 12,722,266 members (18th year of decline) with 250,643 baptisms.\n- Asbury University, \"The Outpouring Story of Revival,\" and Religion News Service (28 Feb 2023) — the 2023 networked outpouring as the still-operating revival mechanism.\n- Frank Lambert, *Inventing the \"Great Awakening\"* (Princeton University Press, 1999); Jon Butler, \"Enthusiasm Described and Decried\" (*JAH*, 1982) and *Awash in a Sea of Faith* (Harvard, 1990) — the \"construction\" / social-control readings that gain standing in the synthesis-erosion case.\n- Thomas S. Kidd, *The Great Awakening: The Roots of Evangelical Christianity in Colonial America* (Yale University Press, 2007) — the leading defense of the both/and category whose persistence the modal assumes.\n- Steve Bruce, *God Is Dead: Secularization in the West* (2002) — the secularization counter-case against the religious-economy floor.\n- Manifold, \"Will Christian Affiliation in the United States Increase Over Five Years?\" — 27% YES, pulled 2026-06-20. <https://manifold.markets/TheUserU2/will-christian-affiliation-in-the-u>\n- Manifold, \"Will the percentage of U.S. adults identifying as Christian in the U.S. drop below 60% by the end of 2026?\" — 19% YES, pulled 2026-06-20. <https://manifold.markets/Dauur/will-the-percentage-of-us-adults-id>\n- Manifold, \"Will Americans' confidence in organized religion decline in 2024, according to Gallup?\" — 7% YES (stale, single-year proxy), pulled 2026-06-20. <https://manifold.markets/cash/will-americans-confidence-in-organi>\n- Metaculus, \"Percent of World Atheist/Agnostic in 2050\" (ID 1552) — price not retrieved (inaccessible). <https://www.metaculus.com/questions/1552/percent-of-world-athiestagnostic-in-2050/>\n- Metaculus, \"Australia 'No Religion' majority 2026 census\" (ID 12298) — price not retrieved (inaccessible). <https://www.metaculus.com/questions/12298/australia-no-religion-majority-2026-census/>"}], "glossary": [{"term": "Adopting Act of 1729", "aliases": [], "def": "A Presbyterian church rule requiring ministers to affirm the Westminster Confession of faith, whose exact terms of subscription became one of the flashpoints between pro-revival and anti-revival Presbyterians."}, {"term": "AME Church", "aliases": ["African Methodist Episcopal Church", "African Methodist Episcopal"], "def": "The first fully independent Black Christian denomination in the United States, formed in 1816 after Black worshippers walked out of a segregated Philadelphia congregation."}, {"term": "Arminianism", "aliases": ["Arminian"], "def": "The theological position, named after the Dutch theologian Jacobus Arminius, that God's grace can be resisted and that a person's own free choice genuinely plays a role in whether they are saved, in contrast to the Calvinist view that God alone determines who is saved."}, {"term": "Awash in a Sea of Faith", "aliases": [], "def": "A prize-winning 1990 book by the historian Jon Butler arguing that American religious history has been distorted by too much focus on dramatic 'Awakenings' and too little on the slow, steady spread of Christianity across the population."}, {"term": "Bebbington quadrilateral", "aliases": ["Bebbington's quadrilateral", "the quadrilateral"], "def": "A four-part definition of evangelical Christianity proposed by historian David Bebbington: a belief that lives must be dramatically changed through conversion, a high regard for the Bible as the ultimate authority, an emphasis on active evangelism and reform, and a focus on Christ's death on the cross as the center of the faith."}, {"term": "benevolent empire", "aliases": [], "def": "A nickname historians use for the sprawling network of nineteenth-century volunteer religious charities and reform organizations (Bible societies, Sunday schools, temperance and antislavery groups) that grew directly out of the revivals and shaped American public life."}, {"term": "Burned-over District", "aliases": ["burned-over district"], "def": "A nickname for a stretch of upstate New York so repeatedly swept by revivalist fervor in the early 1800s that, in the phrase's own logic, there was supposedly no unconverted population left to burn; it also became the birthplace of several new American religious movements."}, {"term": "Calvinism", "aliases": ["Calvinist", "Calvinist soteriology"], "def": "A branch of Protestant theology holding that human beings are so damaged by sin that they cannot save themselves, and that God alone, by his own sovereign choice, decides who will be saved."}, {"term": "camp meeting", "aliases": ["camp meetings"], "def": "A multi-day outdoor religious gathering where attendees camped on-site through continuous preaching, prayer, and communion services, often led by ministers from several denominations at once."}, {"term": "church-sect cycle", "aliases": ["church-sect process"], "def": "A pattern in the sociology of religion in which a demanding, high-commitment religious group grows rapidly, gradually softens its demands and becomes comfortable as it succeeds, and then loses members to a newer, stricter group that repeats the same cycle."}, {"term": "conversion narrative", "aliases": [], "def": "A personal, often formulaic account a person gave of their own religious conversion, describing their sinfulness, spiritual crisis, and eventual assurance of salvation, which many churches required before granting full membership."}, {"term": "declension", "aliases": [], "def": "The perceived decline of a community's religious devotion and moral seriousness compared to an earlier, more pious founding generation, a fear that recurs throughout early American religious history and was often preached about in sermons called jeremiads."}, {"term": "disestablishment", "aliases": ["the voluntary principle", "voluntaryism"], "def": "The legal process of ending a government-supported, tax-funded official church and the special legal privileges that came with it, replacing it with a system in which all religious groups must survive on voluntary donations and compete for members."}, {"term": "Enthusiasm", "aliases": ["enthusiasm"], "def": "An eighteenth-century term of criticism (not a compliment) for claiming direct, unmediated inspiration from God — visions, physical fits, prophetic certainty — bypassing the Bible and reasoned argument, which critics used to attack the revival's excesses."}, {"term": "evangelicalism", "aliases": ["evangelical"], "def": "A strand of Protestant Christianity, dating from the 1730s revivals, that stresses a personal, transformative conversion experience, the Bible's supreme authority, active evangelism and reform, and the centrality of Christ's death on the cross."}, {"term": "feminization thesis", "aliases": ["feminization of American religion", "feminization"], "def": "A historical argument that nineteenth-century American Protestantism became more emotional, domestic, and female-dominated as it lost intellectual and public authority, a claim later criticized for treating women's long-standing majority presence in churches as if it were a decline."}, {"term": "Great Disappointment", "aliases": [], "def": "The failure of a widely followed prediction that Christ would return to earth on October 22, 1844, after which the disappointed movement's remnants regrouped and eventually formed the Seventh-day Adventist Church."}, {"term": "Half-Way Covenant", "aliases": [], "def": "A 1662 New England church policy that let baptized adults who had not had a full conversion experience have their own children baptized, while still denying those adults full church membership and voting rights."}, {"term": "interpretive fiction", "aliases": ["interpretative fiction"], "def": "Historian Jon Butler's influential 1982 charge that 'the Great Awakening' as a single, unified, continent-wide event never actually happened at the time and was instead stitched together after the fact by later historians out of scattered, disconnected local revivals."}, {"term": "invisible institution", "aliases": [], "def": "A term for the secret, unsupervised religious gatherings enslaved Black Americans held out of sight of their enslavers, which historians treat as the seedbed of a distinct African American Christian tradition."}, {"term": "itinerancy", "aliases": ["itinerant"], "def": "The practice of traveling preachers moving from town to town and preaching to any crowd that gathered, often without invitation from the local minister, which bypassed and undercut the settled authority of resident clergy."}, {"term": "jeremiad", "aliases": [], "def": "A sermon form, common in early New England, that lamented the community's moral and spiritual decline from the piety of its founders and called listeners to repent and return to their original religious devotion."}, {"term": "Log College", "aliases": [], "def": "A small, informally run school founded around 1727 in Pennsylvania to train revival-minded Presbyterian ministers at a time when the expected path required a European or Harvard/Yale education; it is considered a forerunner of Princeton."}, {"term": "market-revolution reading", "aliases": ["market revolution"], "def": "A historical argument that the sweeping shift from a barter, household-based economy to a cash, wage-labor economy in the early 1800s was the underlying cause of revivalist fervor, whether by unsettling ordinary people or by giving the new business class a religious tool to instill discipline in workers."}, {"term": "morphology of conversion", "aliases": [], "def": "A term describing the expected step-by-step sequence — conviction of sin, despair, faith, and eventual assurance — that Puritan ministers believed a genuine religious conversion typically passed through, used as a rough checklist for judging whether someone's experience was real."}, {"term": "New Birth", "aliases": ["new birth"], "def": "The central revivalist teaching that true Christian faith requires a definite, felt, life-changing spiritual rebirth, not just church membership, family upbringing, or intellectual agreement with doctrine."}, {"term": "New Divinity", "aliases": ["New Divinity men"], "def": "A group of theologians who saw themselves as carrying forward Jonathan Edwards's Calvinist theology after his death, while subtly reworking his ideas about free will in ways that later thinkers used to justify a more human-centered approach to revival."}, {"term": "New Haven theology", "aliases": ["Taylorism", "power to the contrary"], "def": "A reworking of Calvinist theology developed at Yale in the 1820s that held people are certain to sin but always retain a real 'power to the contrary' — a genuine ability to choose otherwise — which gave revival preachers theological grounds to urge listeners to decide for God immediately."}, {"term": "New Lights", "aliases": ["Old Lights"], "def": "The opposing camps that split New England's Congregational churches over the revivals: New Lights supported the revival as a genuine work of God, while Old Lights were traditionalist critics who saw it as disorderly emotional excess."}, {"term": "new measures", "aliases": ["the anxious bench", "anxious bench"], "def": "A bundle of revival techniques associated with preacher Charles Finney, most controversially the 'anxious bench' — a front pew where people under spiritual distress sat in public to be prayed over and pressured toward an immediate decision to convert."}, {"term": "Old Side", "aliases": ["New Side"], "def": "The two factions that split the Presbyterian Church over the revivals: New Side ministers supported revivalism and looser ministerial-training standards, while Old Side ministers opposed both and required a traditional European or Ivy League education for clergy."}, {"term": "Pelagianism", "aliases": ["Pelagian"], "def": "An ancient teaching, treated as heretical by most Christian traditions, that human beings can take the first step toward their own salvation by willpower alone, without needing God's grace to begin the process."}, {"term": "Pentecostalism", "aliases": ["Pentecostal"], "def": "A global branch of Christianity, dating to a 1906 Los Angeles revival, that emphasizes a post-conversion 'baptism in the Holy Spirit' evidenced by supernatural gifts such as speaking in unknown languages, healing, and prophecy."}, {"term": "perfectionism", "aliases": ["entire sanctification"], "def": "The teaching that a converted Christian can, in this life, reach a state of being fully free from deliberate, known sin through total devotion to God, a doctrine that fed directly into nineteenth-century reform movements aimed at abolishing social evils like slavery."}, {"term": "Pietism", "aliases": [], "def": "A European Protestant renewal movement, originating in Germany in the late 1600s, that emphasized heartfelt, personal religious experience and practical Christian living over strict doctrinal correctness, and that fed directly into the American revivals through the Moravians and early Methodism."}, {"term": "popularization", "aliases": ["popularization vs. democratization"], "def": "A distinction drawn by critics of the 'democratization' thesis, separating religious leaders' appeal to ordinary popular tastes (popularization, which clearly happened) from a genuine transfer of institutional power to ordinary church members (democratization, which they argue was much more limited)."}, {"term": "predestination", "aliases": [], "def": "The Calvinist doctrine that God has, from eternity, already and unchangeably chosen which individuals will be saved, independent of anything those individuals do."}, {"term": "religious economy model", "aliases": ["religious-economy model", "supply-side model"], "def": "A theory, borrowed from economics, holding that religion works like a competitive marketplace: where government does not prop up one official church, competing religious groups must work harder to attract members, which raises overall religious participation, while a subsidized monopoly church grows complacent and loses adherents."}, {"term": "Religious Right", "aliases": ["Christian Right"], "def": "The late-twentieth-century political movement mobilizing conservative, mostly white evangelical Christians around issues such as abortion and, according to some historians, initially around defending racially segregated Christian schools."}, {"term": "Restoration Movement", "aliases": ["Stone-Campbell movement", "Restorationist"], "def": "A religious movement, born out of the frontier revivals, that sought to bypass denominational division entirely by 'restoring' what it considered a pure, original New Testament form of Christianity, eventually producing several present-day church traditions."}, {"term": "secularization thesis", "aliases": [], "def": "A long-standing sociological theory holding that as societies modernize — through industrialization, science, and rising education — religion inevitably loses its social importance and grip on the population."}, {"term": "Springfield Presbytery", "aliases": [], "def": "A short-lived Presbyterian body formed in 1803 by revival-minded ministers uneasy with strict Calvinist doctrine, which its own founders dramatically dissolved the following year in favor of a non-denominational 'Christian' identity, a founding moment of the Restoration Movement."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  var sceneData = document.getElementById('reader-scenes-data');
  var sceneHtmls = [];
  if (sceneData) {
    try { sceneHtmls = JSON.parse(sceneData.textContent || '[]') || []; } catch (e) { sceneHtmls = []; }
  }
  if (sceneHtmls.length && h1) {
    var sceneTpl = document.createElement('template');
    sceneTpl.innerHTML = sceneHtmls[current % sceneHtmls.length] || '';
    if (sceneTpl.content && sceneTpl.content.firstElementChild) {
      well.insertAdjacentElement('afterend', sceneTpl.content.firstElementChild.cloneNode(true));
    }
  }
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {
  let h = document.getElementById('kbd-help');
  if (!h) {
    h = document.createElement('div'); h.id = 'kbd-help';
    h.innerHTML = '<div class="kh"><h3>Keyboard</h3><dl>'
      + '<dt>⌘K</dt><dd>command palette</dd>'
      + '<dt>← / k</dt><dd>previous chapter</dd>'
      + '<dt>→ / j</dt><dd>next chapter</dd>'
      + '<dt>g g</dt><dd>first chapter</dd>'
      + '<dt>g e</dt><dd>last chapter</dd>'
      + '<dt>Z</dt><dd>focus mode</dd>'
      + '<dt>?</dt><dd>this help</dd></dl></div>';
    h.addEventListener('click', (ev) => { if (ev.target === h) toggleHelp(); });
    document.body.appendChild(h);
  }
  h.classList.toggle('open');
}

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
const menuBtn = document.getElementById('menu-btn');
menuBtn.onclick = () => document.body.classList.toggle('menu-open');
function closeMenu() { document.body.classList.remove('menu-open'); }

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}
function chunkText(t) {
  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);
  return out;
}
function pickVoice() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  const name = sel && sel.value;
  const vs = synth.getVoices();
  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');

// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text

    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
