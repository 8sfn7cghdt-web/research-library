#pager { max-width: 700px; width: 100%; margin: 0 auto; padding: 1.1rem 2rem 3rem;
  display: flex; align-items: center; justify-content: space-between; font-family: var(--sans);
  border-top: 1px solid var(--border); }
#pager button { background: none; border: 0; border-radius: 0; padding: .2rem 0;
  font-family: var(--sans); font-size: .68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .12em; color: var(--accent); cursor: pointer; max-width: 40%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s var(--ease), transform .16s var(--ease); }
#pager button:hover:not(:disabled) { color: var(--text); }
#prev:hover:not(:disabled) { transform: translateX(-3px); }
#next:hover:not(:disabled) { transform: translateX(3px); }
#pager button:disabled { opacity: .35; cursor: default; }
#pager-label { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--muted); }

  body.menu-open #sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  #menu-btn { display: block; }
  #main { margin-left: 0; }
  #content { padding-top: 3.6rem; }

/* a deep-linked passage flashes briefly when the reader scrolls to it */
@keyframes passageFlash { 0% { background: var(--mark); } 100% { background: transparent; } }
.passage-flash { animation: passageFlash 2.2s ease; border-radius: 4px; box-decoration-break: clone; }
/* related reading at the foot of the reading column */

.related-h { font-family: var(--display); font-weight: 600; font-size: 1.08rem; margin: 0 0 .9rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

  position: relative;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease),
              border-color .16s var(--ease), outline-color .16s var(--ease); }
.related-card:hover, .related-card:focus-visible { border-color: var(--text);

  letter-spacing: .14em; color: var(--accent); margin: 0 0 .3rem; }

@media (min-width: 861px) {

  align-items: center; justify-content: center; }

<script id="corpus-data" type="application/json">{"slug": "great-awakenings-research", "title": "The Recurring Fire", "subtitle": "The First and Second Great Awakenings, and the revival form they left America", "author": "", "generated": "2026-06-20", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of the Great Awakenings", "summary": "Twice in its formative years America was swept by waves of Protestant revival named 'Great Awakenings' — and the key is to hold two truths at once: the revivals were real, yet the tidy single 'event' was half-built afterward. Together they made American Christianity evangelical at heart and revivalist in form, right down to livestreamed revivals today.", "body": "# Six Easy Pieces of the Great Awakenings\n\n*How two waves of religious revival made American Christianity what it is — and why the honest account holds the fire and the neat name in the same hand.*\n\n## The name, and the fire behind it\n\nTwice in its early history, America caught fire with religion. First in the 1730s and 1740s — call this the First Great Awakening — and again from roughly 1790 to 1840, the Second Great Awakening. Wave after wave of revival swept the colonies and then the young republic — crowds weeping, strangers converting, preachers drawing thousands into open fields. (These were Protestant revivals: Protestants are the branch of Christianity that broke from the Roman Catholic Church in the 1500s, and in early America they were far and away the largest group.) Historians named each wave a \"Great Awakening,\" capital letters and all.\n\nHere is the one idea to carry: the revivals were real, but the tidy single \"event\" was partly built after the fact. Something powerful did happen — you can count the converts and the split churches. What is contested is whether all that scattered local fervor was ever one coherent, continent-wide *thing*, or whether that unity was stitched together later — first by the revivalists' own advertising, then by historians who liked a clean story. The careful modern reading holds both truths at once: the fire was genuine, and the neat capital-letter name is not quite to be trusted. Out of that fire came the enduring result — American Christianity turned **evangelical** at its core (staking everything on a personal conversion you feel happen, a moment you can point to) and **revivalist** in form (treating a mass wave of conversions as a normal event you can hold again, not a once-in-a-lifetime freak).\n\n## Why a two-century-old revival still runs your neighbor's church\n\nThis is not antiquarian: the settlement these revivals reached is the one American religion still lives inside. When a megachurch (a single church with thousands in the seats on a Sunday) ends its service with an altar call (the preacher asking anyone ready to convert to come forward, right then, in front of everyone); when a stadium crusade fills (a mass revival rally booked into a sports arena); when students at a small Kentucky college pray for two weeks straight and the video goes viral — as happened at Asbury University in February 2023 — you are watching the same machinery those revivals built, still running. How a felt conversion became something a preacher could produce on schedule is the real story — the next pieces take it apart. For now, just notice it is still turning.\n\nThe revivals flipped the pecking order of American churches. Back then several colonies had an official church funded by everyone's taxes, whether you attended or not — and those tax-funded establishments were overtaken and then dwarfed by scrappy, mobile newcomers, the Methodists and Baptists. They birthed the independent Black church and converted the enslaved into a distinct African American Christianity. They even spun off whole new religions in one revival-soaked stretch of upstate New York — the Latter-day Saints (the Mormons) and Seventh-day Adventists, now tens of millions strong. And their largest descendant, Pentecostalism — Christians who believe that after you convert, God's Spirit can flood you in a dramatic, felt way, showing up as speaking in tongues, healing, and ecstatic worship — numbers on the order of 600 million people worldwide. Why does American faith look nothing like Europe's — noisier, more competitive, more prone to sudden mass enthusiasm? The answer starts here.\n\n## A short cast you can hold in your head\n\nYou need only a few players and ideas.\n\n**Jonathan Edwards** — a brilliant, austere New England minister who wrote the template. His *Faithful Narrative* (1737) was a sober, clinical account of conversions in his town that taught readers across the Atlantic what a \"revival\" even looked like.\n\n**George Whitefield** — the travelling superstar, who supplied the spectacle and the marketing: advance newspaper ads, serialized journals, one town's awakening reported to spark the next.\n\n**Charles Finney** — the Second Awakening's engineer, who said out loud what most preachers left unsaid: a revival \"is not a miracle\" but the \"philosophical result of the right use of means.\" In plain words — you can make one happen with the right techniques.\n\nThree ideas hold the rest together. The **New Birth**: the teaching that real faith requires a definite conversion you can feel happen — a datable inner turning point — not just going to church or being raised in it. **Calvinism**: the older view that God alone, by his own choice, decides who is saved, leaving humans no lever to pull — you cannot choose your way in; you can only wait and hope. And **disestablishment**: the legal end of that tax-funded official church, which turned religion into an open, competitive market where every group had to win its members or fold.\n\nHold on to Calvinism in particular — God alone picks, humans have no lever. What follows is the story of that one assumption cracking.\n\n## How a \"surprising work of God\" became a technique you could produce\n\n entually, be engineered. Now watch the theology shift underneath, because that is what makes the staging possible. The colonial revival still lived inside Calvinism: revival was \"a surprising work of God,\" something you prayed for and received, not something you made. Then, over the next century, that assumption cracked. Old view: you cannot choose to be saved — God alone picks, and you just wait and hope. New view, worked out by theologians at Yale and pushed further by preachers: your own decision helps decide it. Your will has, in their phrase, a real \"power to the contrary\" — a genuine ability to choose the other way. And that single shift changes everything: if your choice matters, then a preacher pressing you to choose *right now* isn't cheating — it's the whole game. Finney finished the thought: stop waiting for a miracle, use the right methods, and revival will reliably come. To prove it he built the \"anxious bench\" — a front bench (a *pew*, the long wooden seat in a church) where people agonizing over whether they were saved sat in full view of the crowd, to be prayed over and pushed to decide on the spot.\n\nTwo engines carried all this everywhere: print and **itinerancy** (travelling preachers who rode into any town and preached to whoever gathered, ignoring the local minister's turf). Whitefield fused them, advertising his own tour in the newspapers so a revival read as one connected national wave — which is why the sense of one sweeping \"Awakening\" was, in part, a feat of publicity before it was a work of God. And the methods worked: by 1850 the Congregationalists (the established Puritan-descended churches of New England, the biggest group at the founding) had collapsed to a remnant, out-hustled by the technique-wielding Methodists and Baptists.\n\n## The fight: did the \"Great Awakening\" even happen?\n\nSmart historians genuinely disagree — all the way down to whether the thing exists. On one side, the skeptics. Jon Butler called the First Great Awakening an \"interpretive fiction\" — a single continent-wide event that never happened as such, assembled afterward out of scattered local revivals. Frank Lambert agreed it was \"invented,\" but moved the inventing earlier, to the revivalists' own promotional machine. On the other side, the defenders — Thomas Kidd, Harry Stout, Mark Noll — grant that the tidy *label* is a construction, yet insist real, transatlantic, consequential revivals occurred and forged something durable: evangelicalism itself.\n\nThe way through is to split two claims the argument tends to fuse. *That the revivals happened* — nobody disputes. *That they formed one coherent \"event\"* — genuinely disputed. Separate them and the fight softens into a both/and: the revivals were real, and the unified event was partly constructed. The same shape settles every sub-question. Were the revivals a gift to Black Christianity or a faith the slave South remade to fit slavery? Both, at once. This layered answer is not a scholar's failure to decide. It is the finding.\n\n## Where it's heading: managed decline, and a form that won't die\n\nLook out a generation and one number frames everything: American Christian affiliation sits near 62%, but among adults under 30 it is closer to 45%. That gap matters because people don't usually drop their faith as they get older. Instead, each new generation starts out less religious than the one before, so the total slides as older, more-religious people pass away and younger, less-religious age groups replace them. (Scholars call this secularization working *between* generations, not within them.) Against that math stands a puzzle: since about 2019, the long Christian decline has slowed, maybe even leveled off. Nobody yet knows whether that pause is a genuine floor or a breath before the slide resumes.\n\nSo the honest forecast holds several futures open rather than faking one. The most likely path is **managed decline in which the revivalist form survives** — the total share drifts slowly down, but the high-intensity, revival-descended kinds of church (Pentecostal; charismatic — Christians who seek those same dramatic gifts of the Spirit but stay inside other denominations; and non-denominational — independent churches under no larger governing body) outlast the fading **mainline**, the older, calmer, established Protestant denominations like mainstream Methodists, Presbyterians, and Episcopalians. Less likely but live: a **resumed, steeper slide** if the pause was only a pause, or a **genuine floor** if the committed core reproduces itself and religious immigrants top it up. And a thin tail: a real \"Fifth Awakening,\" or a shift in how meaning gets transmitted at all.\n\nThe one signal to watch is simple: whether each new young-adult group enters *below* the last. If it does, the slide wins; if it stops, the floor does. Either way, the form itself — the produced, portable, expected wave of conversions that Edwards described and Whitefield sold — has outlasted every group that carried it for nearly three centuries. It is the most durable American religious invention there is, and it is not done yet."}, {"order": 1, "file": "01_Origins_And_Deep_History.md", "title": "Origins & Deep History — The First Great Awakening", "summary": "", "body": "# Origins & Deep History — The First Great Awakening\n\n## Bottom Line\n\nThe colonial revivals gathered under the name \"the Great Awakening\" — Jonathan Edwards's Northampton awakening of 1734–35, George Whitefield's electrifying itinerancy of 1739–41, and the Presbyterian and Congregational ferment that followed — were real, consequential, and far less unified than that singular, capitalized name implies. The most serious modern scholarship does not deny that revivals happened. It disputes whether they were *one* coherent, intercolonial event with a single character and a single set of effects. Jon Butler's 1982 essay called \"the Great Awakening\" an \"interpretative fiction\"; Frank Lambert's 1999 argument held that the event was \"invented\" — first by its own eighteenth-century evangelical promoters working through a new transatlantic print market, and only later canonized by historians. Together they made the category itself the central problem of the field. Defenders such as Thomas Kidd, Harry Stout, and (in a different register) Alan Heimert reply that something genuinely new was forged in these years: a transatlantic, experiential, print-saturated evangelical Protestantism organized around the \"New Birth,\" whose by-products included a culture of itinerancy that openly challenged settled ministerial authority and split both the Congregational and Presbyterian churches. This account reconstructs how that revival came into being — its colonial preconditions, its European pietist matrix, its key actors and texts — and argues the invention debate dialectically. The revisionists are right that \"the Great Awakening\" is a constructed, retrospectively tidied category. The defenders are right that the construction sits on top of an unmistakable wave of religious activity and a durable new religious form. The honest historiographical position holds both in view: the revival *and* its naming are objects of study.\n\n---\n\n## 1. A Note on the Master Category: Why \"the Great Awakening\" Is Itself in Question\n\nBefore narrating origins, a methodological warning is in order that ordinary textbook accounts suppress. \"The Great Awakening\" is not a name the participants used. It is a retrospective coinage, and the coherence it asserts — a single, datable, intercolonial spiritual event sweeping British North America in the 1730s and 1740s — is precisely what the strongest modern scholarship contests. As Butler observed at the outset of his landmark 1982 essay, the supposed turning point of colonial religious history possessed a \"slim, peculiar historiography,\" with no comprehensive scholarly general history between Joseph Tracy's *The Great Awakening* of 1842 and the late twentieth century [1][2].\n\nThis is not a pedantic quibble. It governs how every claim below should be read. When these pages say \"the revival spread,\" they mean a set of regionally and chronologically uneven episodes that contemporaries, promoters, and later historians knit into a narrative of a single Work. The narrative is part of the history, not merely a frame around it. The dialectical method — state each position at its strongest, raise the gravest objections, give the responses, then weigh — applies with special force here, and Section 9 returns to it as the analytical climax. For now, read \"the Great Awakening\" throughout as a term in scare-quotes, even where the quotes are dropped for readability.\n\n---\n\n## 2. The Colonial Religious Landscape on the Eve of Revival\n\n### 2.1 The New England establishment and the Puritan inheritance\n\nThe New England into which revival came was a society of established, tax-supported Congregational churches descended from the non-separating Puritanism of the Great Migration. Its founding ideal — most influentially reconstructed by Perry Miller as an \"errand into the wilderness\" — was a *gathered church of visible saints*: a membership restricted, in principle, to those who could give a credible account of a genuine experience of saving grace [3][4]. Edmund Morgan's *Visible Saints: The History of a Puritan Idea* (1963) argued, against the older view, that the requirement of a conversion relation for full membership was not imported wholesale from England or Holland but crystallized among the non-separating Puritans of Massachusetts Bay in the 1630s [4]. This experiential gatekeeping is the deep background of everything the revival later did. The revivalists did not invent the demand for a felt conversion. They radicalized and democratized a demand already central to the New England churches.\n\n### 2.2 The Half-Way Covenant and the anxiety of declension\n\nBy the second and third generations, that experiential standard generated a demographic crisis. The founders' children and grandchildren often could not, or would not, testify to the requisite conversion experience — yet they wished to have their own children baptized. The **Half-Way Covenant**, adopted by a New England synod in 1662, was the institutional response: it let baptized but unconverted adults who \"owned the covenant\" (publicly affirmed Christian doctrine and led upright lives) present their children for baptism, while denying them the Lord's Supper and a vote in church affairs [5][6]. Many later historians read this compromise as a symptom — and, in the Puritan self-understanding, a cause — of **declension**: the perceived spiritual decline of New England from its founding fervor, lamented in the distinctive sermon form of the **jeremiad**. Miller's account of the jeremiads of the 1660s–70s stressed how effectively they constructed the very \"errand\" they claimed New England was betraying [3].\n\nA historiographical correction bears directly on the revival's origins. The thesis of straight-line \"declension\" — secularization advancing irreversibly from a pious founding — has been substantially revised. Patricia Bonomi's *Under the Cope of Heaven* (1986) argued that colonial religious life was considerably more vital and widespread across the eighteenth century than the declension narrative allowed, in the middle and southern colonies as well as New England [7]. If Bonomi is right, \"declension anxiety\" is better understood as a *rhetorical and theological construct internal to the clergy's self-criticism* than as a measurable collapse of religiosity — which in turn means the revival was not a rescue from spiritual emptiness but an intensification within an already-active religious culture.\n\n### 2.3 Solomon Stoddard, the \"converting ordinance,\" and Northampton\n\nThe most consequential local prologue to the revival ran through one congregation: Northampton, Massachusetts, in the Connecticut River Valley, pastored from 1672 by Jonathan Edwards's maternal grandfather, **Solomon Stoddard**. Stoddard pushed the logic of the Half-Way settlement further than most New England clergy would go, arguing that the Lord's Supper was itself a \"converting ordinance\" — a means of grace that even the unconverted should be admitted to in hope of their conversion — and effectively opening communion to the whole community [5][6]. \"Stoddardism\" loosened the gathered-church ideal in the name of bringing more souls within reach of grace. Stoddard also presided over several local \"harvests\" of conversions before his death in 1729. Edwards inherited both Stoddard's pulpit and a parish primed by Stoddard's revivalist expectations — and would, decades later, break with Stoddardism over communion, a rupture that cost Edwards his Northampton pulpit in 1750. The point for origins: the Northampton revival of 1734–35 did not erupt from nowhere; it occurred in a congregation that had been theologically and practically rehearsed for revival for two generations.\n\n### 2.4 The Middle Colonies: a more plural, less established field\n\nThe Middle Colonies — New York, New Jersey, Pennsylvania — present a sharply different starting point, and the contrast matters for the invention debate. There was no single establishment; the region was religiously plural (Dutch Reformed, Presbyterian, Quaker, German Lutheran and Reformed, Anglican). Revival here grew not from a Congregational establishment in crisis but from Dutch Reformed pietism (Theodorus Frelinghuysen's preaching in the Raritan Valley in the 1720s) and from a self-consciously evangelical wing of colonial Presbyterianism centered on the Tennent family and the Log College (Section 5). That the \"Great Awakening\" must somehow integrate New England Congregationalism, Middle Colony Presbyterianism, and (later) Southern Baptist and Anglican-evangelical revival into one event is exactly the kind of forced synthesis the revisionists distrust.\n\n---\n\n## 3. The Transatlantic Matrix: Pietism, Halle, the Moravians, and Early Methodism\n\nThe American revivals were not autochthonous. They were the western front of a broad, decades-long upheaval in Protestant religious life that historians increasingly treat as a single transatlantic phenomenon. The most important revisionist on this point is W. R. Ward, whose work made a strong case for dating the evangelical movement back to the late seventeenth century and rooting it in Continental **Pietism** rather than in the 1730s English-speaking revivals [8].\n\n### 3.1 Continental Pietism: Spener, Francke, and Halle\n\nGerman Lutheran Pietism emerged from the work of **Philipp Jakob Spener** (1635–1705), whose *Pia Desideria* (1675) called for a renewal of heartfelt, experiential, practical Christianity against what Pietists saw as a cold \"dead orthodoxy\" of doctrinal correctness without living faith [8]. **August Hermann Francke** (1663–1727), professor at the University of Halle, institutionalized the movement, building orphanages, schools, a printing operation, and charitable foundations — the \"Halle Foundations\" — that became an engine for an explicitly missionary, world-spanning piety [8]. Pietism supplied the affective grammar that the Anglo-American revival would later speak: the priority of the new birth over external observance, the conventicle or small group of the earnest, and the suspicion of merely formal religion.\n\n### 3.2 The Moravians and Zinzendorf\n\nFrancke's influence ran directly to **Count Nikolaus Ludwig von Zinzendorf** (1700–1760), the Halle-educated nobleman who in the 1720s sheltered refugees from the old Bohemian *Unitas Fratrum* on his estate, founding the **Herrnhut** community and giving rise to the renewed **Moravian Church** [8]. The Moravians carried an intense, Christ-centered, emotionally vivid piety across the Atlantic, planting settlements in Georgia and Pennsylvania (Bethlehem and Nazareth). Their importance for *Anglo*-American revival is partly direct and partly catalytic: it was Moravians who confronted John Wesley with his own lack of assurance.\n\n### 3.3 Early Methodist stirrings: the Wesleys and Whitefield\n\nThe young Anglican clergymen who became the revival's English-speaking figureheads were shaped by this Continental current. **John Wesley** (1703–91) encountered Moravians during a storm at sea en route to Georgia in the 1730s and, after returning to England, dated his decisive evangelical conversion to a Moravian-influenced meeting in Aldersgate Street in 1738, where he felt his heart \"strangely warmed\" [8][9]. **George Whitefield** (1714–70), Wesley's younger Oxford associate in the \"Holy Club,\" underwent his own new birth and became the most mobile and theatrically gifted of the early Methodists — and, crucially for America, a Calvinist where Wesley was an Arminian (Section 6 defines these terms). The \"Methodist stirrings\" of the late 1730s in England and the colonial American revivals are thus not parallel accidents but branches of one tree whose roots run back through Herrnhut to Halle.\n\nThe upshot for origins is decisive and underappreciated in popular accounts: if one accepts Ward's framing, \"the First Great Awakening\" is the American chapter of a *trans-Atlantic, multi-decade, multi-lingual* evangelical awakening, which makes the tight \"1739–41, British North America\" packaging look even more like a later editorial convenience.\n\n---\n\n## 4. Jonathan Edwards and the Northampton Revival of 1734–35\n\n### 4.1 The local awakening\n\nIn the winter of 1734–35, an intense season of conversions broke out in Edwards's Northampton congregation and spread through neighboring towns of the Connecticut Valley. Edwards, who had assumed sole charge of the pulpit after Stoddard's death in 1729, attributed the awakening to a \"surprising work of God\" — emphatically not to his own contrivance — though his preaching on justification by faith alone had immediately preceded it [10][11]. George Marsden's *Jonathan Edwards: A Life* (2003), the modern standard biography, situates this Valley revival within Edwards's lifelong project of defending an experiential Calvinism against the encroachment of rationalist religion [12]. The Northampton awakening is conventionally treated as the chronological seed of the larger revival, but note the gap it must bridge: it occurred in 1734–35, four to five years before Whitefield's itinerancy. To make these into one event requires a narrative bridge — a bridge that Edwards himself helped build by *publishing*.\n\n### 4.2 \"A Faithful Narrative\" and the manufacture of a model\n\nEdwards's account of the Northampton awakening, *A Faithful Narrative of the Surprising Work of God in the Conversion of Many Hundred Souls in Northampton*, is the single most important text for the revival's *self-construction*. Written in 1736 (as a long letter to the Boston minister Benjamin Colman, then expanded), it was published in London in 1737 under the editorial hand of Isaac Watts and John Guyse, with Boston printings following; it was quickly translated into German and Dutch [10][11]. In the Yale critical edition, it appears in *The Works of Jonathan Edwards*, Vol. 4, *The Great Awakening* (ed. C. C. Goen, 1972), the volume that gathers Edwards's revival writings with extensive editorial apparatus [11][13].\n\nTwo things about *A Faithful Narrative* are crucial here:\n\n1. **As theology and observation:** it offers a careful, almost clinical anatomy of the conversion process — the stages of conviction, distress, and (sometimes) joyful assurance — and is the document in which Edwards begins to formalize the \"morphology of conversion\" he inherited from the Puritan tradition (Section 6) and to worry about how to distinguish genuine from spurious experiences.\n2. **As media artifact:** by giving the Northampton events a portable, replicable narrative shape — a script for what a \"surprising work of God\" looks like — *A Faithful Narrative* furnished the template that revival promoters across the Atlantic world would use to recognize, report, and *expect* further revivals. This is precisely the point Frank Lambert seizes on: Edwards in the 1730s helped popularize the very notion of a \"general,\" intercolonial and transatlantic resurgence of religion [2][14]. The model preceded, and helped produce, the movement.\n\nThis double character — a primary source that is simultaneously evidence of revival and an instrument of revival's construction — is the methodological heart of the invention debate.\n\n### 4.3 \"Sinners in the Hands of an Angry God\" — and a caution\n\nEdwards is, in popular memory, the man of *Sinners in the Hands of an Angry God*, preached at Enfield, Connecticut, on July 8, 1741 [12]. The sermon is real, the date is well attested, and it belongs to the later, Whitefield-era phase of the revival, not to the 1734–35 Northampton awakening. But the doctoral caution is this: the sermon's fame badly distorts Edwards. His revival writings are overwhelmingly concerned not with terror but with the *analysis and authentication* of religious experience — with telling true affections from false (Section 8). To read the revival through the Enfield sermon alone is to read it through its single most atypical and most anthologized page.\n\n---\n\n## 5. The Tennents, the Log College, and Presbyterian Revivalism\n\nIn the Middle Colonies the revival's institutional carrier was an evangelical faction within colonial Presbyterianism built by the **Tennent** family. **William Tennent Sr.** (1673–1746), an Irish-born minister, founded around 1727 a school at Neshaminy, Pennsylvania, derisively nicknamed the **\"Log College,\"** to train revival-minded ministers when European or Harvard/Yale credentials were the expected path [15][16]. The Log College trained, among others, Tennent's own sons, and is often treated as a forerunner of the College of New Jersey (later Princeton), founded in 1746 by New Side Presbyterians.\n\nHis eldest son, **Gilbert Tennent** (1703–64), became the revival's most aggressive Presbyterian voice. In March 1740 at Nottingham, Pennsylvania, Gilbert Tennent preached **\"The Danger of an Unconverted Ministry,\"** a scorching sermon comparing anti-revival (\"Old Side\") clergy to the Pharisees and insisting that an *unconverted* minister could not be trusted to lead others to the new birth [15][16]. Benjamin Franklin printed and distributed the sermon, multiplying its reach [16]. The argument was incendiary because it authorized congregants to judge — and abandon — their own settled ministers on the basis of the minister's supposed spiritual state. It is one of the purest expressions of the revival's solvent effect on inherited authority (Section 7), and it was a proximate cause of the Presbyterian schism (Section 8.3).\n\n---\n\n## 6. The Theology of the New Birth\n\nThe revival's organizing theological idea was the **New Birth** — the necessity of a definite, experiential, supernatural regeneration of the individual soul. Several terms of art must be defined precisely, because the controversies of the 1740s turned on them.\n\n### 6.1 Conversion, regeneration, and the New Birth\n\n- **Regeneration / the New Birth:** the doctrine, grounded in John 3 (\"Ye must be born again\"), that saving faith requires a real, God-wrought transformation of the heart — not merely intellectual assent, moral improvement, or church membership. The revivalists made this experiential rebirth the indispensable mark of a true Christian and pressed it on the nominally churched.\n- **Conversion:** the experiential process by which a person passes from a state of nature to a state of grace. In the Puritan tradition this was not a single instantaneous event but an extended, patterned experience.\n\n### 6.2 The morphology of conversion\n\nEdmund Morgan's term **\"morphology of conversion\"** names the intricate, expected sequence of stages — knowledge of the law, conviction of sin, humiliation, faith, spiritual combat, and a true (if imperfect) assurance — through which Puritan divines believed the elect typically passed [4]. The morphology functioned both as pastoral map and as a diagnostic checklist against which prospective church members measured their own experience in a \"conversion narrative.\" The revival did two things to it at once: it made the morphology vividly *public and mass* (thousands now scrutinizing themselves against the pattern in a compressed period), and it exposed how unreliable the pattern was as a test, since \"false\" conversions could counterfeit every external stage — a problem Edwards spent the rest of his career on (Section 8).\n\n### 6.3 Calvinist soteriology and predestination\n\nThe mainstream revivalists were **Calvinists**. Calvinism here means the soteriology — the doctrine of salvation — descended from the Reformed tradition and codified for English-speakers in the Westminster Confession: total depravity (fallen humanity cannot save itself), unconditional election (God sovereignly chooses whom to save), and the conviction that regeneration is wholly God's work, not the sinner's achievement. **Predestination** is the doctrine that God has eternally elected those who will be saved. This raises an obvious tension the revival had to live with: if salvation is God's sovereign gift to the elect, why preach urgently for conversion at all? The revivalist answer was that preaching is the ordained *means* by which God awakens the elect; the new birth is sovereignly given, but it is given *through* the heard word. The terror and the urgency are, on this view, instruments of grace, not bargaining with the sinner's free will.\n\n### 6.4 Arminianism (and \"enthusiasm\")\n\n- **Arminianism:** named for the Dutch theologian Jacobus Arminius, the doctrine that human beings retain a genuine, if grace-assisted, capacity to accept or reject salvation — that the will is not wholly determined and the individual has some real say in his own salvation. To the Calvinist revivalists, \"Arminianism\" was the great theological enemy: a creeping, rationalizing softening of human depravity and divine sovereignty, which they saw spreading among liberal Boston clergy. (John Wesley was an Arminian; Whitefield and Edwards were Calvinists — the basis of a real but largely cordial rift within the broader evangelical movement.) Edwards's late masterwork *Freedom of the Will* (1754) is the most rigorous Calvinist assault on the Arminian conception of free will, arguing that the will is always necessitated by the strongest motive and that the Arminian notion of a self-determining will is incoherent [9][12].\n- **Enthusiasm:** in the eighteenth-century vocabulary this was a *pejorative*, not a compliment. It named the claim to direct, immediate inspiration or revelation from the Holy Spirit — visions, impulses, bodily agitations, prophetic certainties — bypassing Scripture and reason. \"Enthusiasm\" is the charge the revival's critics leveled at its excesses (Section 8), and it is the danger Edwards himself came to fear within the awakening he defended.\n\n---\n\n## 7. George Whitefield: The Itinerant as Transatlantic Media Phenomenon\n\nIf Edwards supplied the revival's theology and its founding narrative, **George Whitefield** supplied its body — a mobile, spectacular, market-savvy presence that turned scattered local awakenings into something that *looked* like a single moving event.\n\n### 7.1 The 1739–41 itinerancy\n\nWhitefield's grand American preaching tour, beginning in late 1739, carried him through the colonies from Georgia to New England, drawing enormous outdoor crowds and, in the autumn of 1740, igniting the New England phase of the revival [17][18]. He preached in the open air, across denominational lines, to anyone who would gather — a deliberate refusal of the parish boundaries that ordinarily contained a minister. This is **itinerancy**: the practice of traveling preachers ministering across, and often without the invitation of, established parish lines. Itinerancy is the single most socially disruptive practice of the revival (Section 7.3), and Whitefield was its master.\n\n### 7.2 The \"Divine Dramatist\" and the print machine\n\nHarry Stout's *The Divine Dramatist: George Whitefield and the Rise of Modern Evangelicalism* (1991) reads Whitefield through his early fascination with the theater: he was a performer who converted the sermon into dramatic spectacle, deploying voice, gesture, and tears to move mass audiences [17]. Frank Lambert's *\"Pedlar in Divinity\": George Whitefield and the Transatlantic Revivals, 1737–1770* (1994) shifts the emphasis from the spoken to the *printed* word, showing how Whitefield and his associates organized, advertised, and funded the revivals using the techniques of the emerging consumer marketplace — advance publicity, newspaper coverage, serialized journals, coordinated reporting of one town's awakening to spark the next [14][19]. On Lambert's account, Whitefield was the first religious figure to deploy commercial advertising at scale, a forerunner of the methods of Moody, Sunday, and Graham, and the press did the essential work of *creating an intercolonial evangelical identity* — knitting \"diverse men and women together in a common culture\" who would otherwise never have known themselves to be participants in one Work [14][19].\n\n### 7.3 The Franklin experiment and the question of numbers\n\nThe audience figures attached to Whitefield are spectacular and should be handled with care. The most famous estimate comes from **Benjamin Franklin**, who admired Whitefield, became his friend, and printed his sermons. Franklin, skeptical of newspaper crowd claims, ran an informal acoustic experiment when Whitefield preached from the Philadelphia courthouse in 1739: he walked backward down Market Street until the voice became unintelligible, computed the area of a semicircle of that radius, and estimated that Whitefield could be heard by upward of thirty thousand people — reconciling himself to the printed reports he had previously doubted [20][21]. Lambert and Stout cite crowds in the tens of thousands in London, Philadelphia, and Boston [14][17]. *Doctoral caveat:* modern acoustic reconstructions suggest a maximum audible crowd of roughly 20,000 under realistic conditions and up to ~50,000 only under ideal ones [20], and the contemporary figures often originated in the very promotional press whose reliability is at issue. The numbers are best read as *evidence of the revival's self-presentation* as a mass transatlantic phenomenon — which is itself the historically important fact — rather than as audited attendance.\n\n### 7.4 The social solvent\n\nItinerancy, as practiced by Whitefield and intensified by his imitators, carried a structural challenge to the settled order. A traveling preacher who drew a town's congregants away from their own minister, preached in fields rather than the meetinghouse, and (in Gilbert Tennent's formulation) invited people to judge their pastor's spiritual state, was implicitly teaching that spiritual authority flowed from the new birth and gifts of the Spirit rather than from ordination, education, and parish appointment. The next section traces what happened when that teaching collided with the establishment.\n\n---\n\n## 8. The Explosion: Old Lights vs. New Lights, Old Side vs. New Side\n\nThe revival split the colonial churches. Two parallel but distinct controversies must be kept separate, because they are often conflated.\n\n### 8.1 The Congregational quarrel: New Lights and Old Lights\n\nIn New England Congregationalism, **New Lights** were supporters of the revival, who affirmed the awakening as a genuine outpouring of the Spirit and prized experiential conversion; **Old Lights** were its critics, traditionalist clergy who recoiled from itinerancy, emotional excess, lay exhorting, and the questioning of settled ministers, and who diagnosed much of the revival as \"enthusiasm\" and disorder [22][23]. (A third, \"Old Calvinist\" middle existed, doctrinally orthodox but wary of revival disorder.)\n\n### 8.2 Charles Chauncy's rationalist critique\n\nThe intellectual leader of the Old Light opposition was **Charles Chauncy** (1705–87), minister of Boston's First Church for nearly sixty years. His *Seasonable Thoughts on the State of Religion in New England* (1743) was the most systematic anti-revival treatise of the era — a five-part assault on \"enthusiasm,\" portraying the awakening as runaway emotionalism, spiritual pride, censoriousness, delusion, and social disorder, and defending an ordered, rational, scripturally regulated religion against the claim of immediate inspiration [22][24]. *Seasonable Thoughts* was a direct rejoinder to Edwards's pro-revival *Some Thoughts Concerning the Present Revival of Religion in New England* (1742) [22][24]. Chauncy's later trajectory matters for the long arc: his confidence in human reason and his recoil from Calvinist terror carried him toward a liberal theology — he came to reject total depravity and even, privately, to embrace universal salvation — making him a recognized ancestor of New England Unitarianism [24][25]. The revival, in other words, helped polarize colonial Protestantism into an experiential-evangelical wing and a rationalist-liberal wing whose descendants are still recognizable.\n\n### 8.3 James Davenport and the radical excess\n\nThe Old Light critique was not invented from nothing; the revival produced genuine extravagances, and **James Davenport** (1716–57) was their lightning rod. An itinerant of ferocious zeal, Davenport claimed direct spiritual discernment of who was saved and who damned, denounced settled ministers by name as unconverted, and led emotional, tumultuous meetings. In 1742 he was arraigned in Connecticut and judged to be acting under \"enthusiastical impressions and impulses\" that had disturbed his rational faculties, and he was effectively expelled [26][27]. In March 1743 at New London, he presided over a notorious **book-and-clothing bonfire**, urging followers to burn religious books and luxury items — and, in the episode that crystallized his discredit, his own breeches — before a woman returned them and told him he had gone too far [26][27]. Davenport later publicly recanted his excesses (his 1744 *Confession and Retractions*). For the Old Lights, Davenport *was* the revival's true face; for the moderate New Lights, he was a scandal to be disowned — which is exactly why Edwards devoted so much effort to drawing the line between true and false religion.\n\n### 8.4 Edwards as the moderate arbiter\n\nEdwards's revival writings after 1741 are best read as an attempt to *save* the awakening from both its enemies and its friends. In *The Distinguishing Marks of a Work of the Spirit of God* (1741) he argued that the emotional and bodily phenomena critics seized on — faintings, cries, agitations — were in themselves *neither proof nor disproof* of a true work of the Spirit; the test lay elsewhere [9][28]. In *A Treatise Concerning Religious Affections* (1746), grown from sermons of 1742–43, he developed the mature criterion: true religion consists in \"holy affections\" whose genuineness is shown not by their intensity or accompanying bodily effects but by their *inner spiritual quality and their fruit in a changed life* [9][29]. Edwards thus simultaneously defended the revival against Chauncy's blanket charge of enthusiasm *and* armed the moderates against Davenport's excess. That a single thinker had to do both is itself evidence that \"the revival\" was internally contested from the inside, not a unified movement.\n\n### 8.5 The Presbyterian schism: Old Side and New Side\n\nIn the Presbyterian Church the parallel split had its own vocabulary and its own institutional break. **New Side** Presbyterians were the pro-revival party (the Tennents and their allies, products and defenders of the Log College); **Old Side** Presbyterians were the anti-revival party centered in the Synod of Philadelphia. Their quarrel fused three issues: (1) ministerial education — whether colonial training at the Log College sufficed, against the Synod's 1738 requirement of European or Harvard/Yale credentials; (2) itinerancy — whether revivalists could preach in others' parishes without invitation; and (3) the meaning of subscription to the Westminster Confession under the **Adopting Act of 1729** [15][30]. Gilbert Tennent's 1740 \"Unconverted Ministry\" sermon brought the conflict to a head, and in **1741** the Synod of Philadelphia split; the New Side formed the **Synod of New York** in 1745. The two reunited in **1758** on terms that substantially vindicated the New Side revival method while reaffirming examination of candidates' education and \"experimental religion\" [30]. The College of New Jersey (Princeton), founded 1746, was the New Side's enduring institutional monument.\n\n---\n\n## 9. The Crux: Was There a \"Great Awakening\" at All? The Invention Debate\n\nWe now reach the analytical center of this account. The category must be engaged head-on and dialectically. Here is the debate at full strength.\n\n### 9.1 The traditional synthesis (the thesis under attack)\n\nThe inherited picture, descending from **Joseph Tracy's** *The Great Awakening: A History of the Revival of Religion in the Time of Edwards and Whitefield* (1842) — the book that effectively *named* the event and created the framework — holds that a single, great, intercolonial revival swept British North America roughly 1739–45, transformed colonial religion, and left deep marks on American culture [1][2]. The most ambitious twentieth-century version was **Alan Heimert's** *Religion and the American Mind: From the Great Awakening to the Revolution* (1966), which argued, against Vernon Parrington's older Enlightenment-centered story, that it was evangelical **Calvinism** — not liberal rationalism — that supplied the populist, quasi-democratic, nationalist energy behind the American Revolution; on Heimert's reading, \"without the Great Awakening the Revolution would have been improbable\" [31][32]. Heimert thus staked the maximal claim: not only was the Awakening real and coherent, it was the seedbed of the Revolution.\n\n### 9.2 The revisionist demolition: Butler's \"interpretative fiction\"\n\nIn 1982 **Jon Butler** detonated the synthesis. In *\"Enthusiasm Described and Decried: The Great Awakening as Interpretative Fiction\"* (*Journal of American History* 69, no. 2: 305–325), Butler argued that \"the Great Awakening\" is a label that \"distorts the extent, nature, and cohesion of the revivals\" and should be abandoned or radically qualified [1][33]. His specific charges:\n\n1. **Chronological incoherence:** revivals occurred at different times in different places — New England's largely faded by 1745, while Virginia's evangelical surge did not begin until the 1750s. There was no single synchronous event [33].\n2. **Geographical limitation:** revival did not touch large swaths of the colonies and had only minor effect in places like Pennsylvania; it was regional, not continental [33].\n3. **Overstated social effects:** social hierarchies persisted; in Butler's phrase, \"tumult should not be confused with democracy.\" The revival did not democratize colonial society in the way the synthesis claimed [33].\n4. **Anachronistic naming:** eighteenth-century contemporaries did not use the term \"the Great Awakening\"; it was a retrospective construct, canonized by Tracy a century later, that imposed a false unity on dispersed episodes [1][33].\n\nButler's essay is widely regarded as the most influential single piece in the field precisely because it forced every subsequent historian to *defend* the category rather than assume it [1][2].\n\n### 9.3 Lambert's relocation of the \"invention\"\n\n**Frank Lambert's** *Inventing the \"Great Awakening\"* (1999) accepted the revisionist premise — that the Awakening is a construct — but moved the act of invention earlier and made it more interesting. Where one might read Butler as implying nineteenth-century historians invented the event, Lambert argued the invention happened *in real time, during 1735–45*, performed by the revival's own promoters [2][14]. Skilled evangelical entrepreneurs — Edwards with *A Faithful Narrative*, Whitefield and his publicists with their journals and newspaper network — used the new transatlantic print market to *report* revivals in a way that *produced* the perception (and then the reality) of a single, general, intercolonial and transatlantic outpouring. The \"Great Awakening\" was, on Lambert's account, a discursive and commercial achievement before it was a historiographical one: contemporaries constructed it through \"a sustained, intensive struggle over meaning,\" and historians merely inherited and renamed their construction [2][14]. This is the sharpest possible version of the invention thesis, because it does not deny that revivals occurred — it explains how disparate revivals were *assembled into an event* by the same print machinery (Section 7.2) already traced above.\n\n### 9.4 The defense: Kidd, Stout, and the reality behind the construction\n\nThe defenders do not refute the revisionists so much as *absorb and contain* them. **Thomas Kidd's** *The Great Awakening: The Roots of Evangelical Christianity in Colonial America* (2007) concedes the conceptual problems with the singular label and the chronological untidiness, yet insists that something real and durable was produced: a new variation of Protestant Christianity — **evangelicalism** — defined by the priority of the new birth, the work of the Spirit in revival, and a radical notion of the spiritual equality of all believers [34][35]. Kidd's resolution is to speak of a \"long First Great Awakening\" (roughly 1740s into the 1770s and beyond), trading the false unity of a single short event for the genuine unity of a *movement and a religious form* that the revivals generated [34][35]. **Harry Stout's** work on Whitefield and on the New England pulpit similarly treats the revival as the birththroes of modern evangelicalism and of a new mode of mass religious communication [17]. On this view, the invention thesis is correct about the *name* and the *false synchrony* but wrong if it implies there was no coherent object at all: the coherent object is not an event but evangelicalism.\n\n### 9.5 Assessment: where the weight of evidence lies\n\nWeighing these positions:\n\n- The revisionists win decisively on the **factual specifics**. The chronology genuinely is uneven; the term genuinely is retrospective; the synchrony genuinely was manufactured in part by promoters and print; the most expansive social and political claims (Heimert's Revolution thesis especially) genuinely outrun the evidence and remain contested rather than established [31][32][33]. A historian today cannot responsibly write of \"the Great Awakening\" as a self-evident, datable, continent-wide event.\n- The defenders win on the **deeper object**. The fact that the *name* and the *unity* were constructed does not make the underlying phenomena unreal — Lambert's own argument *requires* real revivals to report and real audiences to assemble. And the durable product, evangelical Protestantism organized around the new birth and capable of transatlantic, print-mediated mobilization, is not a fiction; it is one of the most consequential developments in the religious history of the Anglophone world, and it plainly originates in these decades [14][34][35].\n- Therefore the strongest position is *both/and*, and it is more than a compromise: the construction and the revival are the same story told from two angles. The revival was real; \"the Great Awakening\" — the singular, capitalized, intercolonial event — is a representation of it, produced partly by the participants themselves through the very print machinery that makes the period historically distinctive. The honest move, which Kidd and Lambert in different ways both make, is to stop asking \"was the Great Awakening real?\" and start asking \"how was a dispersed wave of revival turned into *an event*, by whom, with what tools, and to what effect?\" That reframing — treating the naming as part of the history — is the field's most durable gain from the invention debate, and it is the position adopted here.\n\n---\n\n## 10. Synthesis: How the First Great Awakening Came Into Being\n\nPulling the threads together, the revival's origins are best understood as the convergence of four currents:\n\n1. **A pre-loaded establishment.** New England Congregationalism had built experiential conversion into its foundations (the gathered church of visible saints, the morphology of conversion), then strained that ideal through generational change (the Half-Way Covenant, the declension jeremiad, Stoddard's converting-ordinance experiments) — leaving a religious culture rehearsed for, and anxious about, revival.\n2. **A transatlantic pietist matrix.** Continental Pietism (Spener, Francke, Halle), the Moravians (Zinzendorf, Herrnhut), and early Methodism (the Wesleys, Whitefield) supplied the affective theology of the new birth and bound the American revivals into a multi-decade, multi-lingual evangelical awakening of which they were the western front.\n3. **Catalytic actors and texts.** Edwards's Northampton awakening of 1734–35 and *A Faithful Narrative* (1737) supplied a portable model of revival; Whitefield's 1739–41 itinerancy supplied the mobile, theatrical, print-amplified body that made revival look continental; the Tennents and the Log College supplied a militant Presbyterian carrier in the Middle Colonies.\n4. **A new print market.** Newspapers, journals, and pamphlets — Edwards's *Narrative*, Whitefield's serialized journals, Tennent's printed sermon, the coordinated reporting of one town's awakening to spark the next — did the work of *assembling* dispersed revivals into a perceived single event and a shared evangelical identity. This is the origin not only of the revival but of \"the Great Awakening\" as a category.\n\nWhat the revival left behind in its earliest shape: a culture of itinerancy that challenged the parish-bounded, ordination-and-education basis of clerical authority; lay exhorters and ordinary converts claiming the right to testify and judge; a hardened polarity between an experiential-evangelical wing and a rationalist-liberal wing (Edwards vs. Chauncy) whose descendants run respectively toward evangelicalism and Unitarianism; institutional schisms in both Congregationalism (Old/New Lights) and Presbyterianism (Old/New Side, 1741–58); new colleges (Princeton 1746, later Dartmouth and Brown); and a contested historiographical inheritance in which the very name of the event encodes an interpretive argument.\n\n---\n\n## Open Questions\n\n1. **How far down the social scale did the new birth actually reach, and did it reorder authority or merely rhetoric?** Butler's \"tumult should not be confused with democracy\" remains a live challenge; the social-historical evidence on whether itinerancy and lay exhorting durably leveled clerical authority (vs. producing temporary disorder that the establishment reabsorbed) is contested.\n2. **Is the Heimert thesis — revival as seedbed of the Revolution — defensible, qualified, or dead?** This is the load-bearing claim for the political-cultural arguments taken up later; the literature ranges from Heimert's strong causal claim to outright skepticism, with most current scholars somewhere in a qualified middle.\n3. **How tightly should the American revivals be welded to the Continental pietist story (Ward's framing)?** If the \"First Great Awakening\" is genuinely the western chapter of a single transatlantic, multi-decade awakening, the conventional 1739–45 American framing is even more of a construct than the invention debate already suggests — a question the later comparative chapter, which views the American awakenings from outside, takes up directly.\n4. **Race and gender as origins, not afterthoughts.** Whitefield's interest in enslaved people's souls (and his later advocacy for legalizing slavery in Georgia), the spiritual-equality language that drew women and the enslaved into the revival, and the gendered dynamics of conversion narrative deserve treatment as constitutive of the revival's earliest shape, not as a coda.\n5. **What did contemporaries actually call it, and when did \"Great Awakening\" stabilize?** Tracing the precise lexical history (the gap between 1740s \"the late religious commotions\" / \"the revival of religion\" and Tracy's 1842 \"Great Awakening\") would put empirical teeth on the invention thesis.\n\n---\n\n## Sources\n\n1. Jon Butler, \"Enthusiasm Described and Decried: The Great Awakening as Interpretative Fiction,\" *Journal of American History* 69, no. 2 (Sept. 1982): 305–325, DOI 10.2307/1893821 — abstract/metadata via Oxford Academic, https://academic.oup.com/jah/article-abstract/69/2/305/835716 (accessed 2026-06-19). **Tier 2 (peer-reviewed scholarship); the foundational revisionist essay.** Full text behind paywall; argument reconstructed from secondary summaries [2][33].\n2. \"Interpretations of the Great Awakening from Parrington to Kidd: A Historiographical Analysis,\" The Free Soil Review, 2017-08-22, https://thefsreview.wordpress.com/2017/08/22/interpretations-of-the-great-awakening-from-parrington-to-kidd-a-historiographical-analysis/ (accessed 2026-06-19). **Tier 5/6 (specialized blog); used for historiographical orientation only**, cross-checked against Tier 2 where possible; Tracy (1842/1845), Heimert (1966), Butler (1982), Lambert (1999), Kidd (2007).\n3. Perry Miller, *Errand into the Wilderness* (Harvard University Press, 1956) — referenced via historiographical summaries on
