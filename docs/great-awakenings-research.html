s://www.thegospelcoalition.org/themelios/review/the-rise-of-evangelicalism-the-age-of-edwards-whitefield-and-the-wesleys/\n\n7. Bebbington, David W. *Evangelicalism in Modern Britain: A History from the 1730s to the 1980s.* London: Unwin Hyman, 1989. — Tier 2 (monograph). The \"quadrilateral\" definition — conversionism, biblicism, crucicentrism, activism — dating evangelicalism's emergence to the 1730s. Definition and dating confirmed via multiple scholarly summaries accessed 2026-06-19.\n\n8. The Prayer Meeting / Businessmen's Revival of 1857–58 (Lanphier; Fulton Street/North Dutch Church; lay-led, interdenominational, urban). — Tier 5 reference summaries accessed 2026-06-19 (christianhistoryinstitute.org and others). Used for basic facts; participation figures in popular sources (e.g., \"1 million converts\") are contested and flagged as such.\n\n8a. Long, Kathryn Teresa. *The Revival of 1857–58: Interpreting an American Religious Awakening.* New York: Oxford University Press, 1998. — Tier 2 (monograph). The standard scholarly treatment; emphasizes the *construction/interpretation* of the revival via the religious press. Cited from scholarly references; **not consulted directly**.\n\n9. Rauschenbusch, Walter. *Christianity and the Social Crisis.* 1907; and the Social Gospel as the contested \"Third Great Awakening.\" — Tier 2/Tier 5. Britannica (expert-authored) on Rauschenbusch and the Social Gospel; scholarly debate over the \"Third\" label. Accessed 2026-06-19. https://www.britannica.com/biography/Walter-Rauschenbusch\n\n10. McLoughlin, William G. *Revivals, Awakenings, and Reform: An Essay on Religion and Social Change in America, 1607–1977.* Chicago: University of Chicago Press, 1978. — Tier 2 (monograph). The five-awakenings cyclical model (80–100-year cycles; \"cultural revitalization\"), drawing on Anthony F. C. Wallace's \"revitalization movement\" concept. Publisher and review summaries accessed 2026-06-19. https://press.uchicago.edu/ucp/books/book/chicago/R/bo33937066.html\n\n11. Fogel, Robert William. *The Fourth Great Awakening and the Future of Egalitarianism.* Chicago: University of Chicago Press, 2000. — Tier 2 (monograph by a Nobel laureate economic historian). Cyclical awakenings linked to techno-economic change and egalitarian reform; the \"Fourth\" from c. 1960s; spiritual-equity thesis. Among the most criticized applications of the model. Publisher/review summaries accessed 2026-06-19. https://press.uchicago.edu/ucp/books/book/chicago/F/bo3619006.html\n\n12. Butler, Jon. \"Enthusiasm Described and Decried: The Great Awakening as Interpretive Fiction.\" *The Journal of American History* 69, no. 2 (September 1982): 305–325. — Tier 2 (peer-reviewed). The \"interpretive fiction\" thesis; the First Awakening as substantially a retrospective construction. Oxford Academic abstract accessed 2026-06-19. https://academic.oup.com/jah/article-abstract/69/2/305/835716\n\n13. Lambert, Frank. *Inventing the \"Great Awakening.\"* Princeton: Princeton University Press, 1999. — Tier 2 (monograph). The \"both real and constructed\" position; the Awakening as \"an early American culture war\" waged in the press. Publisher summary and reviews accessed 2026-06-19. https://press.princeton.edu/books/paperback/9780691086910/inventing-the-great-awakening\n\n14. Azusa Street revival (1906, William J. Seymour); holiness movement as the bridge from Second-Awakening revivalism to Pentecostalism; Pentecostal definition (Spirit baptism, tongues, gifts). — Tier 5/reference (Britannica, Pentecostalism overview) accessed 2026-06-19. https://www.britannica.com/topic/Pentecostalism\n\n15. Center for the Study of Global Christianity, Gordon-Conwell Theological Seminary. \"Global Pentecostalism\" research project. — Tier 2/institutional. ~644 million in the broad \"Spirit-Empowered\" movement as of 2020 (~26% of all Christians). Accessed 2026-06-19. https://www.gordonconwell.edu/center-for-global-christianity/research/global-pentecostalism/\n\n16. Pew Research Center data on global Pentecostal/Charismatic numbers (~600 million; classical + charismatic split; Global South concentration; rapid growth). — Tier 2 (Pew) as relayed via secondary syntheses; figures treated as estimates with definitional uncertainty. Accessed 2026-06-19. (Underlying Pew studies cited but not all read in original.)\n\n17. The secularization thesis (modernization → declining religious significance) — Tier 2 sociology-of-religion literature, surveyed via review articles (e.g., Stolz, \"Secularization theories in the twenty-first century\") accessed 2026-06-19. https://joergstolz.github.io/assets/2020_Secularization.pdf\n\n18. Finke, Roger, and Rodney Stark. *The Churching of America, 1776–1990: Winners and Losers in Our Religious Economy.* New Brunswick, NJ: Rutgers University Press, 1992 (updated edn. *1776–2005*, 2005). — Tier 2 (monograph). The supply-side/religious-economy model; pluralism → vitality; church–sect cycle; mainline as \"losers,\" upstarts as \"winners.\" Publisher and scholarly summaries accessed 2026-06-19. https://www.rutgersuniversitypress.org/the-churching-of-america-1776-2005/9780813535531\n\n19. Bruce, Steve, and other critics of the religious-economy model — Tier 2. The contention that pluralism more often correlates with decline than vitality, that deregulation does not reliably produce vitality, and that key positive findings were statistical artifacts. Interview and review summaries accessed 2026-06-19. https://www.modernreformation.org/resources/interviews/the-decline-of-religion-q-a-with-steve-bruce (Primary scholarly works by Bruce, e.g., *God Is Dead: Secularization in the West*, 2002, cited but not consulted directly.)\n\n20. Voas, David, and Mark Chaves. \"Is the United States a Counterexample to the Secularization Thesis?\" *American Journal of Sociology* 121, no. 5 (2016): 1517–1556. — Tier 2 (peer-reviewed; 2017 SSSR Distinguished Article award). U.S. religiosity declining for decades via the same generational/cohort mechanism as the secularizing West; the U.S. \"no longer a counterexample.\" Abstract and author copy accessed 2026-06-19. https://www.journals.uchicago.edu/doi/abs/10.1086/684202 ; https://discovery.ucl.ac.uk/1476386/1/Voas_684202.pdf\n\n---\n\n*Note on tiers and limits:* This comparative account rests primarily on Tier 2 scholarly monographs and peer-reviewed articles (Ward, O'Brien, Noll, Bebbington, McLoughlin, Fogel, Butler, Lambert, Finke & Stark, Voas & Chaves), with Tier 5 reference summaries used only for orientation and non-load-bearing detail. Several monographs were identified and characterized from authoritative publisher pages, peer-reviewed abstracts, and review literature rather than read cover-to-cover; where a specific interpretive claim rests on a work not consulted in the original, that limitation is noted. Quantitative figures for revival crowds and conversions (Cambuslang, 1857–58) and for global Pentecostal adherents are estimates carrying real uncertainty and are presented as orders of magnitude, not precise counts."}, {"order": 6, "file": "06_Drivers_And_Forces.md", "title": "Drivers & Forces — The Mechanisms Behind the Awakenings and Their Trajectory", "summary": "", "body": "# Drivers & Forces\n\n## Bottom Line\n\nThe \"Great Awakening\" is most defensibly read not as a single religious event but as the visible output of several distinct mechanisms operating on a colonial and then a national population — and once we name those mechanisms individually, the apparent unity of \"the Awakening\" partly dissolves into the machinery that produced it. Six drivers do the explanatory work. (1) **Print culture and itinerancy**: George Whitefield manufactured the *sense* of a single connected revival through advance newspaper publicity, serialized journals, and a touring body in motion — the revival was, in Frank Lambert's and Harry Stout's reading, partly a communications artifact before it was a theological one. (2) **Disestablishment and the voluntary principle**: the post-Revolutionary shift from tax-supported establishments to a competitive \"religious free market\" supplied, on Finke and Stark's religious-economy account, the structural incentive for aggressive church-planting — though European data give the mechanism serious critics. (3) **Democratization and anti-elitism**: Nathan Hatch's mechanism, in which uneducated, charismatic preachers seized religious authority from a learned clergy in a Jeffersonian culture primed to reject all credentialed authority, fueling the Methodist and Baptist surge. (4) **The market revolution and social dislocation**: economic transformation as the soil of revival, read by Paul Johnson as middle-class *social control* and by Charles Sellers as a culture-wide trauma — with Daniel Walker Howe's \"communications revolution\" counter-reading rejecting the framework's premise. (5) **Demographic and frontier expansion**: a mobile, dispersed, under-churched population met by the camp meeting and the Methodist circuit system as a *scalable distribution technology* — connectionalism as the mechanism that let one itinerating ministry cover a continent. (6) **Transatlantic communication networks**: the letters, reprints, and personal ties that synchronized the American Awakening, the English Revival, and the Scottish Cambuslang Wark into what participants experienced as one God-inspired phenomenon. Of these, the print/communications driver and the democratization driver are the *leading* forces — they generate the form revival takes and have proved most portable across centuries (Whitefield → Moody → Graham → Asbury 2023, livestreamed). Disestablishment and the market revolution are increasingly *lagging* as explanations: the establishments are two centuries gone, and the religious-economy mechanism is empirically contested. For the next phase of the topic's trajectory, the driver most likely to dominate is the descendant of driver (1): the migration of itinerant, populist, charismatic revival from print to broadcast to the network — the form Whitefield invented, running now on infrastructure he could not have imagined.\n\n---\n\n## Orientation: Drivers, Not Causes\n\nA note on method before the drivers, because the topic is contested at its root.\n\nThese pages do not ask \"what *caused* the Great Awakening,\" because the prior question — whether there was a single thing called \"the Great Awakening\" to be caused — is itself unsettled. Jon Butler argued in *Awash in a Sea of Faith* (1990) that \"the Great Awakening\" is an **\"interpretive fiction\"** — a unifying label retrofitted by nineteenth- and twentieth-century historians onto a scatter of local, uneven, and discontinuous revivals that contemporaries did not experience as one event [1]. Frank Lambert, in *Inventing the \"Great Awakening\"* (1999), partly split the difference: the revivals were real, but their participants and promoters — Whitefield above all — *constructed* their unity in print, narrating scattered awakenings into a single connected \"work of God\" as they happened [2].\n\nThat historiographical fact disciplines the analysis. If \"the Awakening\" is partly a *construction*, then the mechanisms that did the constructing — print, itinerancy, communication networks — are not background to the event; they are partly constitutive *of* it. So this account treats drivers as **mechanisms producing observable change in revivalist religion**, each stated precisely enough to carry forward into the outlook: the mechanism (how the force translates into change), the evidence it operated, its rough strength, and the counter-forces pushing the other way. Where a driver explains *the appearance of unity* rather than a unified underlying event, that is noted, because it changes what the driver predicts going forward.\n\nTwo caveats run throughout. First, these drivers are not independent — print *enabled* democratization, disestablishment *amplified* the market mechanism, the frontier *demanded* the circuit system. Where they interact, the interaction is named. Second, \"rough strength\" is an analytic estimate, not a measured coefficient; the historiography supports ordinal claims (\"print culture was a primary, not secondary, driver\") far better than cardinal ones.\n\nA third orienting point concerns the *kinds* of driver. The six named here are largely *material and social* — print, markets, demography, institutions. But the dominant lens of these pages is intellectual-history/theological, and there is a prior driver the material six presuppose: the **theological engine of revival itself** — the doctrine of the New Birth and the theology of religious affection that gave the revivals their content and their reproducibility. A communications mechanism can carry *any* message; it carried *this* one because the message had a specific psychological structure built to produce conversions. So the theological driver comes first, briefly, as the thing the other six transmit, organize, and scale — before turning to the six that determine its *form and reach*.\n\n---\n\n## Driver 0 — The Theology of the New Birth: The Engine the Others Carry\n\n### The mechanism\n\nStrip away print, markets, and circuits, and a revival still requires a *thing being revived* — a religious experience structured to recur, spread, and demand action. The First and Second Great Awakenings shared a theological core: the **New Birth**, the doctrine that saving faith is not assent to propositions or inherited church membership but a *radical experiential conversion* — a felt, datable transformation of the affections wrought by the Holy Spirit. The mechanism is that this doctrine is *intrinsically revivalist*: it makes the individual conversion experience, not the sacrament or the catechism, the unit of true religion, and a religion whose unit is a repeatable experience can be *propagated* in a way a religion of inherited status cannot.\n\nJonathan Edwards (1703–1758) supplied the era's most rigorous theology of this experience. In *A Treatise Concerning Religious Affections* (1746), Edwards argued that \"true religion, in great part, consists in holy affections\" — that genuine conversion shows itself in transformed *affections* (the will-and-emotion, not bare intellect), while carefully distinguishing genuine gracious affections from the counterfeit \"enthusiasm\" the revivals also produced. *A Faithful Narrative of the Surprising Work of God* (London 1737) was Edwards's clinical case-study of the 1734–35 Northampton conversions — a *protocol* for recognizing and reproducing revival. The mechanism, then, is a doctrine that (a) locates true religion in a reproducible inner event, (b) supplies criteria for recognizing it, and (c) thereby makes revival a *method*, not merely an accident of grace.\n\n### The Arminian turn as a sub-driver\n\nThe theology did not stay fixed, and its *drift* is itself a driver. Edwards was a strict Calvinist: regeneration is God's sovereign, unconditional act on a passive, determined will. But a religion that *preaches for conversions* is under constant pressure to tell the unconverted they *can* turn — and over three generations the New England theology bent from Edwards's determinism toward **free will**. By the Second Great Awakening, **Nathaniel W. Taylor** (1786–1858), Dwight Professor at Yale, built the **\"New Haven theology\"** on the doctrine of the \"power to the contrary\" — the sinner's genuine *ability* to choose — which the Reformed tradition regarded as a move toward **Arminianism** (the doctrine that grace is resistible and salvation conditional on human response). Critics judged Taylor's system \"in many respects the exact antipodes of Edwards',\" even as Taylor claimed Edwards's mantle [27]. The mechanism here: **a theology that makes conversion humanly choosable is a more powerful revival engine than one that makes it a sovereign lottery** — it licenses the direct, urgent, will-targeting appeal that Charles Finney would systematize into the \"new measures.\" The Arminian turn is thus a theological *driver* of the Second Awakening's distinctive aggressiveness, not merely a doctrinal footnote.\n\n### Evidence, strength, counter-forces\n\nThe evidence is the texts themselves (Edwards's *Affections* and *Faithful Narrative*; Taylor's *Concio ad Clerum*, 1828) and the documented trajectory from Edwardsian Calvinism through the \"New Divinity\" to New Haven theology [27]. **Strength: foundational but enabling rather than leading** — the theology supplies the *content* the other drivers transmit, so it is causally prior but not what distinguishes one revival's reach from another's. **Counter-force:** the same Arminian turn that energized revival also dissolved the doctrinal distinctiveness of the revived churches, contributing to the theological liberalism and eventual modernist–fundamentalist split that fractured the tradition. The engine that made revival reproducible also made it doctrinally unstable. (The theology is developed at length elsewhere; here it is established only as the substrate the material drivers act upon.)\n\n---\n\n## Driver 1 — Print Culture and Itinerancy: Whitefield as Media Innovator\n\n### The mechanism\n\nA revival is, in the first instance, a *local* event: a particular congregation, a particular preacher, a particular week of unusual religious intensity. The question is how a scatter of such local events comes to be *experienced* — by participants, by readers, by later historians — as a single connected \"awakening\" spanning colonies that had little else in common. The mechanism is **a communications system that narrated local revivals into a shared, ongoing, trans-local story in close to real time, and a touring preacher whose physical movement supplied that story with a single recurring protagonist.**\n\nConcretely, the mechanism has three coupled parts, all pioneered or perfected by George Whitefield (1714–1770):\n\n1. **Advance publicity.** Before Whitefield arrived in a town, news of him arrived first — planted in newspapers by his own agents. Frank Lambert documents that Whitefield hired the merchant William Seward as a publicist ahead of his first American tour, and that Whitefield \"deployed advance publicity teams to advertise his coming presentations,\" a technique later copied by Dwight L. Moody, Billy Sunday, and Billy Graham [3]. The effect: a crowd was *primed* and gathered before the preacher set foot in the town, so the local event arrived pre-framed as part of a larger phenomenon.\n\n2. **Serialized journals.** Whitefield published his *Journals* in installments as the tours unfolded. Susan O'Brien and others identify these as \"an essential part of his public relations campaign,\" letting him \"assert considerable influence over his public image and to counter criticism\" [4]. The serialization is the key: readers in Boston could follow Whitefield's progress through the Middle Colonies the way one follows a serial, so that revivals separated in space were re-sequenced into a single ongoing narrative in time.\n\n3. **Newspaper amplification.** Beyond his own publicity, Whitefield's meetings were *covered* — crowd sizes, conversions, controversies reprinted from town to town. Lambert's central argument in *\"Pedlar in Divinity\"* (1994) is that Whitefield solved a merchant's problem with a merchant's tools: facing \"an ever-expanding audience of anonymous strangers, most of whom he would never see face-to-face,\" he \"exploited popular print, especially newspapers,\" borrowing the new commercial advertising methods of the eighteenth-century consumer economy to market salvation [3][5].\n\nThe synthesis: **print plus itinerancy manufactured the sense of a single connected awakening.** The itinerant body in motion gave the story a protagonist; the print network gave it a readership that experienced scattered local revivals as chapters of one work. This is why Harry Stout calls Whitefield \"Anglo-America's first religious celebrity\" and locates the key to his success not in doctrine but in *theatricality* and *media* — Whitefield's youthful interest in the stage informed a preaching style built for spectacle, and he \"skillfully deployed print — newspapers, sermons, pamphlets, and his published *Journals* — to generate publicity for his ministry before, during, and after his tours\" [6][7].\n\n### The evidence it operated\n\n- **The publicist hire and the advance-team pattern.** Lambert's documentation of Seward and of advance publicity is concrete and primary-source-grounded (Whitefield's own correspondence and the newspapers themselves) [3].\n- **The serialized *Journals* themselves** are a primary artifact; their installment structure and self-justifying function are not inferred but read off the texts [4][7].\n- **The historiographical convergence.** Three independent major scholars — Stout (*The Divine Dramatist*, 1991), Lambert (*\"Pedlar in Divinity\"*, 1994), and the \"invention\" historians (Butler, Lambert again, 1999) — arrive at the print-and-itinerancy mechanism from different starting points. That convergence is strong evidence the mechanism is real and not an artifact of one scholar's lens [1][2][3][6].\n- **The \"construction of unity\" claim.** The Commonplace reconsideration of Whitefield concludes that \"the Great Awakening's apparent unity was partly a product of deliberate communication strategy rather than spontaneous religious fervor\" [7]. This is the mechanism stated as a finding.\n\n### Rough strength\n\n**Primary and leading.** Within the First Great Awakening this is arguably *the* driver that distinguishes the 1739–41 transcolonial event from the ordinary local revivals that preceded it (Edwards's Northampton revival of 1734–35 was real but local; what made 1739–41 feel continental was Whitefield's touring body plus the print network). Its strength is amplified by being *generative of the others*: print enabled democratization (cheap pamphlets bypassed the learned clergy) and synchronized the transatlantic network (Driver 6 runs on the same infrastructure). Its portability across centuries — the same mechanism recognizable in Moody, Sunday, Graham, and the livestreamed Asbury 2023 outpouring — is the single best evidence that it is *leading* rather than incidental.\n\n### The mechanism, perfected: Finney's \"new measures\"\n\nThe print-and-itinerancy mechanism reached its self-conscious systematization a century after Whitefield, in Charles Grandison Finney's \"new measures\" of the 1820s–30s — and the connection is worth drawing because it shows the driver maturing from intuition into method. Where Whitefield *improvised* a media machine, Finney *codified* a revival technology: the protracted meeting (consecutive nightly services sustaining emotional momentum), the \"anxious bench\" (a front pew where the convicted sat under public pressure to decide), public prayer for named individuals, and the deliberate engineering of a \"fever heat\" of expectation. In *Lectures on Revivals of Religion* (1835), Finney made the underlying claim explicit and shocking to the Calvinist ear: a revival \"is not a miracle… It is a purely philosophical [i.e., scientific] result of the right use of the constituted means.\" This is Driver 0's Arminian turn (conversion as humanly choosable), Driver 1's media instinct (revival as producible by technique), and Driver 3's populism (the measures bypassed the settled, learned ministry) fused into a single operational doctrine. The forecast implication is large: once revival is theorized as a *reproducible technology* rather than an *unpredictable visitation*, it becomes portable across media and generations — which is exactly what the subsequent history shows.\n\n### Counter-forces\n\n- **The theological objection.** Critics in Whitefield's own day — the \"Old Lights,\" Charles Chauncy foremost — held that the print-and-spectacle mechanism produced *enthusiasm* (in the period's pejorative sense: ungrounded emotional excess), not genuine conversion. Chauncy's *Seasonable Thoughts on the State of Religion in New-England* (1743) was a book-length print rebuttal — itself proof that the controversy scaled on the same infrastructure as the revival. This is a counter-force to the *legitimacy* of the mechanism, not its *operation*: even hostile contemporaries conceded the machinery worked; they disputed what it produced. (The Edwards–Chauncy exchange is the era's defining print war over whether the revival's \"affections\" were gracious or merely animal, and Edwards's *Distinguishing Marks* and *Religious Affections* are in part his answer to it.)\n- **Substance vs. publicity.** A serious historiographical caution: foregrounding the media mechanism risks reducing a genuine religious movement to marketing. Stout and Lambert are both careful here — Whitefield \"preached against the excesses and luxuries of the spreading consumer society\" even as \"he drew heavily on the new commercialism\" [3]. The mechanism explains the *form and reach* of the revival, not the *sincerity of conversions*, which lies outside what any communications mechanism can adjudicate.\n- **Print's double edge.** The same press that amplified Whitefield amplified his critics. Chauncy's *Seasonable Thoughts on the State of Religion in New-England* (1743) is itself a print artifact. Print is a medium, not a partisan; it scaled the controversy as much as the revival.\n\n---\n\n## Driver 2 — Disestablishment and the Voluntary Principle: The Religious Free Market\n\n### The mechanism\n\nBefore the Revolution, several colonies had **established churches** — tax-supported, legally privileged denominations (Congregationalism in most of New England, the Church of England in the South). After the Revolution, establishment was dismantled: Virginia's *Statute for Religious Freedom* (drafted by Jefferson, enacted 16 January 1786) ended Anglican establishment there [8]; the First Amendment (1791) barred a *federal* establishment; and the states disestablished one by one, with **Massachusetts the last, in 1833** [9]. The result was a religious landscape with no state-backed monopolist — what the sociologists Roger Finke and Rodney Stark call a **\"religious economy\"** and a \"free market\" in faith [10].\n\nThe mechanism, on the Finke–Stark **religious-economy (or \"supply-side\") model**, is borrowed wholesale from economics: **competition raises participation.** A state-supported monopoly church has no incentive to exert itself — its clergy are paid regardless of how many souls they win, so they grow \"lazy\" and lose organizational vigor. Remove the subsidy and the legal privilege, and churches must *compete* for adherents in an open market. Competition rewards energetic recruitment, emotionally compelling worship, and demanding commitment (which signals seriousness and screens out free-riders). The aggressive, market-disciplined \"upstart sects\" — Methodists and Baptists — therefore out-recruit the complacent former establishments [10][11].\n\nFinke and Stark formalize this as a **\"church-sect process\":** any successful church, as it accumulates members and respectability, tends to soften its demands and lose its vigor, opening a market niche for a stricter \"sect\" that then repeats the cycle. The mechanism is thus self-renewing — it predicts perpetual churn, not a one-time transition [10].\n\n### The evidence it operated\n\nThe quantitative core is striking and is the single most-cited evidence for the model. Using denominational shares of total religious adherents (a measure that exposes *relative* decline masked by absolute growth), Finke and Stark report [11][12]:\n\n| Denomination | Share of adherents, 1776 | Share of adherents, 1850 |\n|---|---|---|\n| Congregationalists (formerly established, New England) | 20.4% | 4.0% |\n| Episcopalians (formerly established, South) | 15.7% | 3.5% |\n| Presbyterians | 19.0% | 11.6% |\n| Baptists (upstart) | 16.9% | 20.5% |\n| **Methodists (upstart)** | **2.5%** | **34.2%** |\n\nThe pattern is exactly what the mechanism predicts: the two *formerly established* churches collapse in relative terms (Congregationalists from 20.4% to 4.0%; Episcopalians from 15.7% to 3.5%), while the two market-disciplined upstarts surge — Methodists from a rounding error (2.5%) to the largest denomination in the country (34.2%) [11]. Finke and Stark also report the headline overall figure: church *adherence* rose from fewer than 1 in 5 Americans in 1776 to roughly 6 in 10 by the late twentieth century — i.e., the \"free market\" *grew the whole market*, not just reshuffled it [10].\n\n### Rough strength\n\n**Structurally real, mechanistically contested — and lagging as a present-day driver.** That the formerly established churches lost relative ground while the upstarts surged is not in serious dispute; the *correlation* with disestablishment is robust. What is contested is whether *competition itself* is the mechanism (Driver 2) or whether the upstarts won for reasons better captured by Drivers 3 and 5 (populist appeal, scalable distribution) that would have operated with or without disestablishment. As a force shaping the *next* phase of American religion, disestablishment is largely *spent*: the establishments are two centuries gone, and there is no new disestablishment to come. What remains live is the *voluntary principle* it bequeathed — American religion is constitutively non-coerced and competitive — but that is now ambient background, not an active driver pushing change.\n\n### Counter-forces\n\nThis is the most empirically contested driver of the six, and honesty requires giving the critics full strength:\n\n- **The European counter-evidence.** The model's central prediction — that religious *pluralism* (many competing suppliers) raises *participation* — fails badly in Europe, where highly pluralistic countries are often *less* religiously active than monopoly ones, and where the most religiously vital societies are not the most competitive. **Steve Bruce** argues that \"diversity, far from making religion more popular, undermines it,\" marshaling evidence \"from a wide variety of western societies\" against the claim that competition promotes religion [13].\n- **The pluralism–participation review.** **Mark Chaves and Philip Gorski**, reviewing the entire empirical literature on pluralism and participation, conclude that \"the empirical evidence does not support the claim that religious pluralism is positively associated with religious participation in any general sense\" [14]. This is close to a decisive blow to the model's signature prediction *as a law*, even if the American case fits.\n- **The tautology objection.** Critics charge the model with circularity: it defines \"vigor\" partly by growth, then explains growth by vigor. The American nineteenth-century fit may be a *single confirming case* read as if it were a general law.\n- **The interaction problem.** Even where the American data fit, disestablishment is confounded with the frontier (Driver 5) and democratization (Driver 3). The Methodist surge may reflect a superior *distribution technology* (the circuit system) more than a *competitive incentive*. The model has trouble isolating its own mechanism from these.\n\nThe judicious assessment: disestablishment created the *arena* (a non-coerced, competitive religious field), which is real and consequential. Whether *competition per se* is the causal engine is doubtful as a general law and merely plausible as an American special case.\n\n---\n\n## Driver 3 — Democratization and Anti-Elitism: The Populist Seizure of Authority\n\n### The mechanism\n\nNathan Hatch's *The Democratization of American Christianity* (1989) supplies what is, for the Second Great Awakening, the most influential single mechanism in the literature. The mechanism is **a transfer of religious authority from a learned, credentialed, ordained clergy to uneducated, charismatic, self-authorizing preachers, occurring inside a broader post-1800 Jeffersonian culture that was primed to reject *all* forms of inherited and credentialed authority.**\n\nHatch's claim is that in the early republic, \"American Christianity was democratized and common people became powerful actors on the religious scene\" [15]. Five movements rode this wave — Methodists, Baptists, Mormons, the Restorationist \"Christians\" (Stone–Campbell), and the African-American churches — and despite sharp doctrinal differences they shared \"a pervasive populism that rejected authority by creed or clergy, carried a generally negative view towards education and church history, and spread their message through itinerancy, revivalism, the printing press, and a common-sense approach to theology\" [15].\n\nThe mechanism's force comes from its *fit with the political moment*. After 1800, in \"a radical Jeffersonian culture,\" Americans \"were ready to reject established authority of all kinds — not only in religion but also in medicine and law\" [15]. Religious anti-elitism was one expression of a general democratic revolt against gentility and credentials. The mechanism thus *converts political egalitarianism into religious recruitment*: a preacher who needed no Latin, no Harvard or Yale degree, no episcopal ordination — only a conversion experience and the ability to move a crowd — could be raised up from the ranks, which meant the supply of preachers could expand as fast as the population, and the *cultural distance* between preacher and hearer collapsed. Charismatic exemplars — Hatch names the eccentric itinerant Lorenzo Dow, Joseph Smith, and Francis Asbury — \"offered compelling visions of individual potential and collective aspiration to the unschooled and unsophisticated\" [15].\n\n### The evidence it operated\n\n- **The denominational data again, read differently.** The same Methodist/Baptist surge that Driver 2 attributes to competition, Driver 3 attributes to populist appeal: the upstarts won because they *spoke the people's language* and *drew preachers from the people*, while the Congregationalist and Presbyterian establishments insisted on an educated ministry that could not scale. The 2.5% → 34.2% Methodist rise [11] is consistent with both mechanisms; Hatch's distinctive evidence is *qualitative* — the rhetoric, hymnody, and self-presentation of the upstart movements, which are saturated with anti-elitism and common-sense epistemology.\n- **The five-movement convergence.** That five doctrinally incompatible movements (a high-church-adjacent Methodism, a congregational Baptist polity, a new-revelation Mormonism, a creed-rejecting Restorationism, and the Black church) *all* exhibit the same populist signature is strong evidence the driver is cultural and structural, not denominational [15].\n- **The leadership type.** The recurrence of the *uncredentialed charismatic* as the movement-builder — Dow, Cartwright, Smith, the circuit riders — is a pattern, not an anecdote.\n\n### Rough strength\n\n**Primary and leading — arguably the dominant single driver of the Second Great Awakening, and the most portable.** Hatch's thesis has become close to the field's default frame for the period, displacing the older \"social control\" reading as the *primary* mechanism. Its strength lies in explaining not just *that* the upstarts grew but *why the form of American religion took the shape it did* — anti-credential, experiential, entrepreneurial, suspicious of theological expertise. Crucially for the forecast, this driver is the most *durable*: American religion's populist, anti-elite, charismatic, common-sense character is recognizable straight through to twentieth-century Pentecostalism and twenty-first-century non-denominational and online ministry. The form Hatch describes did not end in 1840; it became the template.\n\n### Counter-forces\n\n- **Re-institutionalization.** The democratizing movements did not stay democratic. Methodism, the great populist engine, professionalized, built seminaries, and acquired a respectable middle-class membership within two generations — the \"church-sect process\" of Driver 2 running in reverse on the very movements Driver 3 explains. The counter-force is the gravitational pull of *institution*: charismatic anti-elitism is unstable and tends to re-credentialize.\n- **The persistence of the learned tradition.** Hatch's frame can under-weight the genuinely intellectual revivalism that persisted — Edwards's heirs, the New Haven theology of Nathaniel W. Taylor, Princeton orthodoxy. Not all of the Second Awakening was anti-elite; some of it was a learned clergy's project (Dwight, Beecher, Nettleton in New England).\n- **The democratization-vs.-authoritarianism paradox.** Critics note that several \"democratized\" movements (Mormonism, some Methodism under Asbury's centralized control) were internally *authoritarian*. The populism was in the *access* to authority, not always in its *exercise* — Asbury's genius, Wigger notes, was to yield enough initiative to lay preachers to satisfy demands for local power \"without compromising the essential element of central control\" [16]. So \"democratization\" names the recruitment mechanism more cleanly than the governance reality.\n\n---\n\n## Driver 4 — The Market Revolution and Social Dislocation\n\n### The mechanism\n\nThis driver reads revival as a *response to economic transformation* — and it splits into two rival mechanisms that share a premise and disagree sharply on the causal story.\n\nThe shared premise: between roughly 1815 and 1846 the American economy underwent a **\"market revolution\"** (Charles Sellers's term) — the spread of cash markets, wage labor, transportation (canals, then railroads), and commercial agriculture into what had been a subsistence and barter economy, dissolving older household and community structures and exposing ordinary people to the anxieties, mobility, and dislocation of a competitive commercial order [17]. The claim is that this dislocation was the *soil* of the Second Great Awakening: where the market disrupted, revival followed.\n\nThe two mechanisms:\n\n**(4a) Revival as social control (Paul Johnson).** In *A Shopkeeper's Millennium* (1978), Paul E. Johnson studies Rochester, New York — a boomtown remade by the Erie Canal — and Charles Finney's revival there in the winter of 1830–31. Johnson's mechanism: the new master-class of shopkeepers and manufacturers had *lost* the old paternalistic control over a workforce that no longer lived in their households, and could not \"reform or coercively control the behavior of the flood of lower-class workers\" pouring into the city. Finney's revival solved their problem. After it, \"the upper and middle classes used their economic power and sway over social mobility to enforce norms like temperance on the upwardly mobile lower classes\" [18]. Revival, on this reading, is a *mechanism of class discipline*: it internalized in workers the self-control (sobriety, industry, punctuality) that the new factory order required and that external coercion could no longer supply. The mechanism is functional — religion does the disciplinary work the market needs done.\n\n**(4b) Revival as cultural trauma and resolution (Charles Sellers).** Sellers's *The Market Revolution* (1991) reads the religious upheaval more darkly and more broadly, as the culture *metabolizing* a wrenching transformation. He frames it as a contest between an **\"antinomian\"** democratic culture (emphasizing grace, free of works-righteousness, rooted in older rural and quasi-animist folk religion) and an **\"arminian\"** middle-class bourgeois culture (emphasizing self-improvement, works, and the disciplined \"self-made man\" suited to capitalism) [17][19]. Revival is where this contest was fought out in religious idiom. The mechanism is cultural-dialectical: market capitalism generated an antinomian backlash and an arminian rationalization, and the Awakening is the religious *form of the struggle* between them.\n\n### The historiographical contest behind this driver\n\nDriver 4 cannot be stated cleanly without the historiographical contest it sits inside, because \"what drove the Second Great Awakening\" is one of the more fought-over questions in American religious history, and the answers track three successive scholarly generations.\n\n- **The \"organizing process\" reading (Donald Mathews, 1969).** Mathews's influential article \"The Second Great Awakening as an Organizing Process, 1780–1830: An Hypothesis\" (*American Quarterly*) reframed the Awakening not as a wave of emotion but as a *social-organizational* phenomenon: revival was the mechanism by which a fluid, dispersing, post-Revolutionary population *organized itself* into communities, disciplines, and institutions [28]. This is a driver in its own right — revival as community-formation under conditions of social fluidity — and it is the hinge between the social-control and democratization readings.\n- **The social-control thread (roughly 1960s–1980s).** Scholarship of this period — Johnson's *Shopkeeper's Millennium* its finest exemplar — read revival as a means to *assert social control* amid disruptive economic change: the propertied classes deploying religion to discipline a workforce they could no longer control paternalistically [18][28].\n- **The democratization thread (peaking 1980s–1990s).** Hatch's *Democratization* (Driver 3) inverted the reading: revival was not control *imposed from above* but authority *seized from below* — \"a democratic means to resist traditional sources of authority\" [15][28]. This thread is now the field's default, displacing social control as the *primary* frame.\n\nThe drivers here map onto that contest: Driver 4a is the social-control thread, Driver 3 is the democratization thread, and Mathews's organizing-process hypothesis is the connective tissue. It is worth noting that the *historiography itself has a trajectory* — from social control, through organizing process, to democratization — and that the current frontier (the \"invention\" thesis, Drivers 1 and 6) is pushing toward *communication and construction* as the master category.\n\n### The evidence it operated\n\n- **The geographic correlation.** The Second Awakening's intensity clustered in regions of rapid market transformation — the Erie Canal corridor, the \"Burned-over District\" of upstate New York — which is the empirical anchor for both mechanisms [18]. Johnson's Rochester case is a fine-grained, archive-based demonstration of the correlation in one city.\n- **The temperance-and-discipline link.** Johnson's documentation that revival was followed by middle-class enforcement of temperance and labor discipline is concrete and sourced to local records [18].\n- **The class composition of revival.** Wigger's finding that Methodism's core was \"the middling people on the make — skilled artisans, shopkeepers, small planters, petty merchants\" [16] fits the market-revolution frame: revival appealed to those *climbing* in the new economy, for whom disciplined self-improvement was both spiritually and economically functional.\n\n### Rough strength\n\n**Real but increasingly *lagging* as an explanation, and the most fragile of the six.** The geographic correlation is solid; the *mechanism* is the problem. The \"social control\" reading (4a) is now widely regarded as too functionalist and too cynical — it struggles to explain why the *controlled* embraced revival so fervently, and it can read religion as mere epiphenomenon of class interest, which the participants' own testimony resists. Sellers's grander synthesis (4b) is even more contested. As a driver feeding the forecast, the market-revolution mechanism is dated to a specific economic transition (1815–46) that does not recur in the same form, so its predictive reach into the next phase is limited.\n\n### Counter-forces\n\n- **Daniel Walker Howe's frontal rejection.** Howe, in *What Hath God Wrought* (2007), declines to use \"market revolution\" at all and rejects Sellers on three counts: (i) **timing** — any market transformation came *earlier*, in the eighteenth century, not the nineteenth; (ii) **valence** — far from being a trauma inflicted on resistant farmers, \"most American family farmers welcomed the chance to buy and sell in larger markets,\" and living standards rose (Howe notes mattress prices falling from roughly $50 to $5); (iii) **root cause** — the genuinely transformative force was not markets but a **\"communications revolution\"** (the telegraph, the expanding postal system, cheaper printing, the growth of publishing) [20]. Howe's counter-reading matters enormously here, because it relocates the engine of the era *back to Driver 1's family* — communications, not commerce — which is one reason these pages treat the print/communications driver as more durable than the market driver.\n- **The \"discovers what it presupposes\" critique.** Daniel Feller's barb — \"a monograph that presupposes a market revolution will certainly discover one\" [17] — captures the methodological worry that the framework manufactures its own confirmation.\n- **The participants' agency.** The strongest counter to social control is that revival converts were *agents*, not dupes; they sought, shaped, and sustained the revivals, which a top-down disciplinary mechanism cannot fully accommodate. Hatch's democratization driver (3) is in part a corrective to this flaw in driver 4.\n\n---\n\n## Driver 5 — Demographic and Frontier Expansion: The Circuit System as Distribution Technology\n\n### The mechanism\n\nThis driver is the most concretely mechanical of the six, and it pairs a *demand* condition with a *supply* technology.\n\n**The demand condition:** the early-republic population was exploding, mobile, and dispersing westward faster than any settled, parish-based church could follow. The frontier population was **under-churched** — not irreligious, but *unserved*, beyond the reach of a clergy that required formal theological training and a settled pulpit. As one account of the period puts it, \"most church denominations had been unable to keep up with hardy frontiersmen due to a lack of men with formal theological training and the hardships of pioneer travel and settlement\" [21]. The parish model — a fixed minister serving a fixed congregation — does not scale to a population that is moving and scattered.\n\n**The supply technology:** two innovations solved the distribution problem.\n\n1. **The camp meeting** aggregated a dispersed population *periodically*. Cane Ridge, Kentucky, in August 1801 is the paradigm: Barton W. Stone's congregation hosted a gathering that drew an estimated 10,000–20,000 people — nearly 10% of Kentucky's entire population at the time — with eighteen Presbyterian preachers plus an unknown number of Baptists and Methodists preaching simultaneously from stumps, wagons, and a large tent [21][22]. The camp meeting is a *batch* technology: it concentrates a scattered population into one place for a few days of saturation preaching, then disperses them as carriers of the revival.\n\n2. **The Methodist circuit system (connectionalism)** solved the *continuous* coverage problem and is the more important mechanism. Rather than station one minister in one place, Methodism deployed **circuit riders** — itinerant preachers who rode a fixed loop of preaching points, returning to each on a schedule — supported by a dense lay infrastructure of class meetings, local (lay) preachers, love feasts, quarterly meetings, and camp meetings [16]. John Wigger calls this an \"efficient system of itinerant and local preachers\" sustaining a movement that combined \"a strong, centralized framework\" with \"remarkable scope for local flexibility\" [16]. The circuit system is, in modern terms, a **scalable distribution network**: a small number of mobile preachers, multiplied by a large lay infrastructure, covering a continent's worth of dispersed settlement at a cost the parish model could never match. Francis Asbury's organizational genius, Wigger argues, was to grant lay men and women enough local initiative \"to satisfy most demands for local power, without compromising the essential element of central control\" [16] — a federated structure that scaled both ways at once.\n\n### The evidence it operated\n\n- **The Methodist growth curve is the single most dramatic statistic in this account.** American Methodism rose from fewer than 1,000 members in 1770 to over 250,000 by 1820 — a roughly 250-fold expansion in fifty years [16] — and to 34.2% of all American religious adherents by 1850 [11]. No mechanism but a *scalable distribution technology* plausibly produces that curve against a backdrop of a dispersing frontier population. The circuit system is the technology; the growth curve is the output.\n- **Cane Ridge as proof-of-concept.** The 10,000–20,000 figure, ~10% of Kentucky's population, demonstrates that the camp-meeting batch technology could aggregate an otherwise unreachable population at scale [21][22].\n- **The denominational selection effect.** The churches that grew on the frontier were precisely the ones with scalable ministries (Methodists' circuits, Baptists' self-supporting farmer-preachers); the ones that required an educated, settled clergy (Congregationalists, Episcopalians) did *not* follow the frontier and lost relative ground [11]. The fit between *distribution technology* and *growth* is tight.\n\n### Rough strength\n\n**Primary for the Second Great Awakening's geographic reach — and the cleanest mechanism of the six.** This driver has the rare virtue of a *named technology with measurable output*: the circuit system in, the 250-fold growth curve out. Its strength is highest precisely where the others are weakest — it explains *the West*, the dispersed and mobile population that print alone could not reach and that the market revolution had barely touched. It also interlocks with Driver 3: the circuit system *required* uncredentialed preachers (there were not enough educated clergy to ride the circuits), so the distribution technology and the democratization of ministry were the same fact seen from two angles.\n\n### Counter-forces\n\n- **The closing frontier.** This driver is *intrinsically tied to a moving frontier*. As settlement filled in and the frontier closed (by ~1890, on Frederick Jackson Turner's reckoning), the demand condition that the circuit system answered weakened, and Methodism itself shifted from itinerant circuits to settled, professionalized congregations — the very re-institutionalization noted under Driver 3. The driver is therefore *self-limiting*: it consumes the condition that gives it force.\n- **Disorder and the respectability problem.** The camp meeting's emotional excesses (the \"exercises\" — falling, jerking, barking at Cane Ridge) generated a counter-force *within* the revival tradition: a drive toward order and respectability that, over time, tamed the very enthusiasm that filled the meetings. The batch technology was powerful but socially costly, and the cost eventually constrained its use.\n- **Substitutes.** As communications improved (Howe's telegraph and postal expansion, Driver 1's heirs), the *physical* aggregation the camp meeting provided became less necessary — information could reach the dispersed population without gathering their bodies. The distribution problem the circuit system solved was partly dissolved by better communications, which is why this driver fades as Driver 1's descendants rise.\n\n---\n\n## Driver 6 — Transatlantic Communication Networks\n\n### The mechanism\n\nThe First Great Awakening was never only American. It was the American front of a broader **Atlantic evangelical revival** that included the English Evangelical Revival (the Wesleys, Whitefield), the Scottish revivals (the Cambuslang \"Wark\" of 1742), Welsh revivals, and continental German Pietism and Moravianism. The mechanism of this driver is **a communications network — letters, reprinted accounts, shared periodicals, and personal transatlantic travel — that synchronized geographically separate revivals into a single experienced phenomenon**, so that a convert in Boston, Glasgow, and London could understand themselves as participating in one God-inspired \"work.\"\n\nSusan O'Brien's research is the foundation. Her studies — \"A Study of the First Evangelical Magazines, 1740–1748\" (1976), her 1978 thesis on \"Transatlantic Communications and Influence during the Great Awakening,\" and \"A Transatlantic Community of Saints: The Great Awakening and the First Evangelical Network, 1735–1755\" (1986) — document the \"vibrant publishing and book distribution networks which enabled the Evangelical Revival to have a truly international impact\" [23]. The mechanism has three parts:\n\n1. **Correspondence networks.** Evangelical leaders maintained dense letter-writing circuits across the ocean, exchanging reports of local revivals. These letters were not private; they were *circulated and printed*, so a revival in New Jersey could be known and celebrated in Edinburgh within weeks.\n2. **Reprinting and shared periodicals.** Accounts crossed the Atlantic and were reprinted — the first *evangelical magazines* of 1740–48 (O'Brien's subject) functioned as a shared organ knitting the dispersed revival into one readership. Jonathan Edwards's *A Faithful Narrative of the Surprising Work of God* (the Northampton revival account) was published in *London* first (1737) and circulated back; the American revival reached Americans partly *through* the transatlantic loop.\n3. **Personal mobility.** Whitefield himself was the human embodiment of the network, \"criss-crossing the Atlantic\" on repeated tours [23], physically carrying the revival between its nodes and ensuring the same protagonist appeared in the story on both sides of the ocean.\n\nThe synthesis, in O'Brien's words: the events \"historians have analyzed separately as the American Great Awakening, the English Evangelical Revival, and the Scottish Cambuslang Wark were perceived by many participants as parts of a single God-inspired phenomenon\" [23]. This is Driver 1's mechanism (print constructing unity) operating at *ocean scale*.\n\n### The evidence it operated\n\n- **The magazines and the correspondence are primary artifacts**, documented and catalogued by O'Brien — not inferred but extant [23].\n- **Edwards's *Faithful Narrative* publication history** (London 1737, before wide American circulation) is concrete evidence the loop ran transatlantic-first.\n- **The German Pietist reception of Edwards** — documented in recent *Church History* scholarship on the Pietist translation of Edwards — shows the network extended even beyond the Anglophone world [24].\n- **Whitefield's documented crossings** (thirteen Atlantic voyages over his career) physically instantiate the network [23].\n\n### Rough strength\n\n**Strong for the First Great Awakening specifically; the mechanism that makes \"the Awakening\" transatlantic rather than merely colonial.** Its strength is that it explains the *scale of the perceived unity* — without the transatlantic network, the colonial revivals would have been a regional American story; with it, they were experienced as the local edge of a providential global movement, which is a large part of what gave them their force and their self-understanding. It is essentially Driver 1 generalized to the ocean, and shares Driver 1's portability: the descendant of this driver — the global, networked synchronization of revival — is, if anything, *stronger* today than in 1740.\n\n### Counter-forces\n\n- **Attenuation by distance and time.** Letters and reprints crossed the ocean in weeks or months, not seconds; the synchronization was real but *lagged*. The network could create a sense of simultaneity that was partly retrospective.\n- **The \"interpretive fiction\" caution, again.** This driver is precisely the one most vulnerable to Butler's critique: if the transatlantic unity was *constructed* by the network rather than reflecting an underlying coordinated event, then the network manufactured a perception as much as it transmitted a reality [1]. (This is a feature, not a bug, for a driver that *explains the appearance of unity* — but it must be stated honestly.)\n- **National divergence.** Over the following century the American and British evangelical trajectories diverged sharply (American disestablishment vs. British establishment; American frontier revivalism vs. British urban evangelicalism), so the network synchronized an *origin* far more than an *ongoing* identity. Richard Carwardine's *Transatlantic Revivalism* (1978) documents that the connection persisted into 1790–1865 but in increasingly nationally inflected forms [25].\n\n---\n\n## Interactions: How the Drivers Couple\n\nThe drivers are not a list of independent variables; they form a coupled system, and naming the couplings is what lets us reason about them.\n\n- **Print (1) is the substrate for democratization (3) and the transatlantic network (6).** Cheap pamphlets and newspapers let uncredentialed preachers bypass the learned clergy's monopoly on theological discourse, and let local revivals be narrated into trans-local (and trans-Atlantic) movements. Print is the *enabling layer* under three other drivers.\n- **Disestablishment (2) sets the arena in which democratization (3) and the market mechanism (4) play out.** Remove the establishment, and the field is open both to populist upstarts (3) and to whatever functional work revival does for the market order (4).\n- **The frontier (5) and democratization (3) are nearly the same fact.** The circuit system *required* uncredentialed preachers because there were not enough educated clergy to ride it; the scalable distribution technology and the populist seizure of ministry are two descriptions of one phenomenon.\n- **Howe's communications revolution (counter to 4) collapses driver 4 back toward driver 1.** If the engine of the antebellum transformation was communications rather than commerce, then the market-revolution driver loses ground to the print/communications family — which is the single most important interaction for the forecast, because it concentrates explanatory weight on the most *durable* and *portable* mechanism.\n\nThe picture that emerges: **the communications family of drivers (print, itinerancy, transatlantic and later networked synchronization) is the load-bearing core**, with democratization riding on it, the frontier supplying a specific historical demand it served, and disestablishment and the market revolution supplying time-bound structural conditions that have largely lapsed.\n\n---\n\n## Two Cross-Cutting Modifiers: Race and Gender\n\nThe six drivers describe *how* revival spread; two further forces shaped *whom* it reached and *what it became*, and they cut across every driver above. They are modifiers rather than independent engines, but any forecast should carry them.\n\n- **Race.** The same democratization mechanism (Driver 3) that drew uneducated white preachers from the ranks also opened a path for Black religious leadership: Hatch counts the African-American church among his five democratizing movements [15]. Revival's experiential, anti-credential structure (Driver 0's New Birth; Driver 3's populism) was unusually accessible across the color line, and the camp meeting's emotional, oral, participatory form (Driver 5) resonated with traditions enslaved Africans carried. The result was both the founding of independent Black churches (Richard Allen and the AME, 1816) and the conversion of large numbers of enslaved people — even as the *same* revival tradition split bitterly over slavery, with Methodists and Baptists fracturing into Northern and Southern bodies by the 1840s. Race is thus a modifier that the drivers *amplified in both directions*: revival was a vector of both Black religious autonomy and proslavery Christianity.\n- **Gender and the \"feminization\" of religion.** Women were the numerical majority of converts and the connective tissue of the revival's lay infrastructure (the class meetings, prayer circles, and benevolent societies that Driver 5's connectionalism depended on). The Second Great Awakening is closely tied to what historians call the \"feminization\" of antebellum Protestantism and to the launch of women into public reform roles (temperance, abolition, eventually suffrage). This modifies Driver 3: the \"democratization\" of religious authority extended, unevenly and contestedly, to women's voices — Finney's public prayer by women was among the \"new measures\" his critics found most scandalous.\n\nNeither race nor gender is a *driver* in the strict mechanism-and-strength sense used here, but both are essential to forecasting *which populations* the revival tradition's descendants reach and *which fractures* recur.\n\n---\n\n## Comparative Strength: A Summary at a Glance\n\n| # | Driver | Mechanism (one line) | Rough strength | Leading / lagging | Key counter-force |\n|---|---|---|---|---|---|\n| 0 | Theology of the New Birth | Conversion as reproducible inner event makes revival a *method* | Foundational / enabling | Enabling (carried by 1, 3) | Arminian turn dissolves doctrinal distinctiveness |\n| 1 | Print culture + itinerancy | Advance publicity + serialized journals + a touring protagonist construct a single connected \"awakening\" | **Primary** | **Leading** (most portable) | Print scales critics too; substance-vs-publicity caution |\n| 2 | Disestablishment / voluntary principle | Competition in a religious \"free market\" raises participation (Finke–Stark) | Real but mechanistically contested | **Lagging** (establishments long gone; mechanism likely refuted as a law) | European data (Bruce; Chaves–Gorski) |\n| 3 | Democratization / anti-elitism | Uncredentialed charismatic preachers seize authority in a Jeffersonian culture | **Primary** | **Leading** (durable, → non-denom/online) | Re-institutionalization; internal authoritarianism |\n| 4 | Market revolution / dislocation | Economic upheaval as soil of revival (social control / cultural trauma) | Real but fragile | **Lagging** (bound to 1815–46; Howe's counter-reading) | Howe's \"communications revolution\"; participant agency |\n| 5 | Demographic / frontier expansion | Circuit system + camp meeting as scalable distribution to a dispersed, under-churched population | **Primary** for reach | **Lagging** (frontier closed; self-limiting) | Closing frontier; communications substitutes |\n| 6 | Transatlantic networks | Letters + reprints + travel synchronize separate revivals into one experienced phenomenon | Strong for First Awakening | Merged upward into 1 (descendant is **leading**) | Attenuation; national divergence; \"invention\" caution |\n\nThe table is ordinal, not cardinal, and the rankings are defended in each driver's section above. The single most important pattern: **the communications family (0's content + 1's form + 6's reach) is the load-bearing, durable, portable core; the structural drivers (2, 4, 5) are time-bound conditions that have largely lapsed.**\n\n---\n\n## Leading vs. Lagging: Which Drivers Dominate the Next Phase\n\nThe question that remains is which of these mechanisms will dominate the next phase of the trajectory — meaning both (a) the trajectory of American revivalist religion and its cultural progeny, and (b) the trajectory of the historiography. The drivers sort cleanly.\n\n**Leading drivers (likely to dominate the next phase):**\n\n1. **The communications/print driver (1), in its networked descendant.** This is the strongest forecast claim made here. The mechanism Whitefield invented — advance publicity, serialized self-narration, media amplification, a charismatic itinerant protagonist — is precisely the mechanism that has reproduced itself across every subsequent American revival: Moody's organized urban campaigns, Sunday's publicity machine, Graham's radio-and-TV crusades, and the Asbury University outpouring of February 2023, which spread globally not by foot but by social-media livestream, drawing an estimated 50,000–70,000 visitors to a small Kentucky town over sixteen days, with people traveling from as far as Russia and Japan because they had *seen it on the network* [26]. The form is constant; only the medium upgrades (pulpit → newspaper → radio → television → social network). Whatever American revivalism does next, it will do it on this mechanism. **This is the driver most likely to dominate.**\n\n2. **The democratization driver (3), in its non-denominational and online forms.** The anti-elite, anti-credential, experiential, entrepreneurial character Hatch identified is, if anything, intensifying — the fastest-growing sectors of American Christianity (non-denominational evangelicalism, Pentecostalism, independent network churches) are its direct descendants, and the de-institutionalization of religious authority continues. This driver is *leading* and durable.\n\n**Lagging drivers (reactive, spent, or contested):**\n\n3. **Disestablishment (2)** is structurally *complete* — there are no establishments left to dismantle, so the driver has no new work to do; what survives is the ambient voluntary principle, which is background, not a force pushing change. And its signature *mechanism* (pluralism raises participation) is empirically contested to the point of likely refutation as a general law [13][14], so even as an explanatory tool it is fading.\n\n4. **The market revolution (4)** is tied to a specific, non-recurring economic transition (1815–46) and is the most contested driver in the literature, with Howe's communications-revolution counter-reading relocating its causal weight back to the communications family [20]. As a forecast driver it is largely *spent*.\n\n5. **The frontier driver (5)** is *self-limiting and largely exhausted*: the frontier it required closed over a century ago, and its technology (the circuit, the camp meeting) has either professionalized or been substituted by communications. Its descendant — the search for scalable distribution to under-served populations — survives, but now runs on Driver 1's network infrastructure rather than on horseback.\n\n6. **The transatlantic network (6)** is, in its origin form, *historical* (the eighteenth-century letter-and-reprint network is gone), but its *descendant* — global, instantaneous, networked synchronization of revival — is a leading driver folded into (1). The mechanism did not die; it merged upward into the communications core and got far stronger.\n\n**For the historiography specifically:** the trajectory of the *scholarship* is also driven by these mechanisms reflexively. The \"invention\" thesis (Butler, Lambert) — which holds that the Awakening's unity was partly constructed by the communications drivers — is itself ascendant, precisely because Drivers 1 and 6 have been so well documented. The likely direction of the historiography is *further away from* treating \"the Great Awakening\" as a unified event and *toward* treating it as the output of specifiable communication, distribution, and authority mechanisms — i.e., toward the frame this very document adopts.\n\n---\n\n## Open Questions\n\n1. **Can the religious-economy mechanism (Driver 2) be salvaged for the American case once the European counter-evidence (Bruce; Chaves & Gorski) is conceded?** Is there a defensible \"American special case\" version of the competition-raises-participation claim, or does the model collapse entirely, with the Methodist/Baptist surge fully re-attributable to Drivers 3 and 5?\n\n2. **How much of the First Great Awakening's \"unity\" survives the deflation of Driver 1?** If Whitefield's print machine *manufactured* the sense of a single connected awakening, is there an underlying coordinated religious movement left once we subtract the publicity — or is \"the First Great Awakening\" essentially a media artifact, as the strong reading of Butler/Lambert implies?\n\n3. **Did social control (4a) or democratization (3) win the historiographical contest, or is the apparent victory of Hatch a pendulum swing due to reverse?** The field moved from Johnson's social control to Hatch's democratization as the default frame; is a synthesis (or a market-revolution revival via Sellers) plausible in the next generation?\n\n4. **What is the precise causal weight of the circuit system (5) versus populist appeal (3) in the Methodist surge?** These are entangled in the sources; a counterfactual (a populist movement *without* a scalable distribution technology, or vice versa) would isolate them, but the historical record offers no clean one.\n\n5. **Does Howe's \"communications revolution\" reframing (counter to 4) generalize?** If the antebellum transformation was driven by communications rather than commerce, does that retroactively strengthen the case that the *entire* revival tradition — First and Second Awakenings alike — is best understood as a communications phenomenon, collapsing several of these drivers into one?\n\n6. **For the forecast: does the migration of revival onto digital networks change its *kind*, not just its *medium*?** Asbury 2023 spread by livestream — but a networked revival may be structurally different from a Whitefieldian one (algorithmic rather than editorial amplification; instantaneous rather than lagged; global-from-the-start rather than colonial-then-transatlantic). Is the \"same mechanism, upgraded medium\" claim too smooth?\n\n---\n\n## Sources\n\n1. Jon Butler, *Awash in a Sea of Faith: Christianizing the American People* (Harvard University Press, 1990; cited via Harvard University Press page and the historiographical summaries of Butler's \"interpretive fiction\" thesis). https://www.hup.harvard.edu/books/9780674056015 — Accessed 2026-06-19. **Tier 2** (university-press monograph; here accessed via publisher page + secondary summaries — the \"interpretive fiction\" claim is Butler's, widely attested). *Source of the \"interpretive fiction\" framing for the Great Awakening.*\n\n2. Frank Lambert, *Inventing the \"Great Awakening\"* (Princeton University Press, 1999; cited via *The Christian Century* review). https://www.christiancentury.org/reviews/2011-06/inventing-great-awakening-frank-lambert — Accessed 2026-06-19. **Tier 2/5** (university-press monograph reviewed in a Tier 5/6 religious magazine; used for Lambert's \"split the difference\" position). *The revivals were real but their unity was constructed in print.*\n\n3. Frank Lambert, *\"Pedlar in Divinity\": George Whitefield and the Transatlantic Revivals, 1737–1770* (Princeton University Press, 1994; description and argument via Princeton University Press and Google Books). https://press.princeton.edu/books/paperback/9780691096162/pedlar-in-divinity — Accessed 2026-06-19. **Tier 2** (university-press monograph). *Whitefield as commercial-marketing innovator; advance publicity teams; newspapers to reach anonymous mass audience.*\n\n4. Susan O'Brien et al. on Whitefield's serialized *Journals* as public-relations instrument (via the Commonplace reconsideration article and O'Brien's documented scholarship). https://commonplace.online/article/reconsidering-george-whitefield-at-300/ — Accessed 2026-06-19. **Tier 5** (*Commonplace: The Journal of Early American Life*, an edited scholarly-adjacent journal) reporting **Tier 2** findings. *Journals as PR; image control and counter-criticism.*\n\n5. Princeton University Press, author page / book description for Frank Lambert, *\"Pedlar in Divinity.\"* https://press.princeton.edu/our-authors/lambert-frank — Accessed 2026-06-19. **Tier 1** (publisher description — used only for the book's own self-description of its thesis, c ew York, 1815–1837* (Hill & Wang / Farrar, Straus and Giroux, 1978; rev. ed.). https://us.macmillan.com/books/9780809016358/ashopkeepersmillennium/ — Accessed 2026-06-19. **Tier 2** (peer-reviewed social history monograph). *Finney's Rochester revival 1830–31; revival as middle-class social control; post-revival enforcement of temperance/labor discipline.*\n\n19. Comprehensive-review / SHEAR Panorama discussions of Sellers's antinomian–arminian framework and its reception. https://thepanorama.shear.org/2020/02/10/does-history-rhyme/ — Accessed 2026-06-19. **Tier 5** (scholarly-society blog, SHEAR — Society for Historians of the Early American Republic). *Reception and critique of Sellers's religious-cultural argument.*\n\n20. Daniel Walker Howe, *What Hath God Wrought: The Transformation of America, 1815–1848* (Oxford University Press, 2007), and the Howe–Sellers debate. https://www.historynewsnetwork.org/article/daniel-walker-howe-charles-sellers-c-vann-woodward — Accessed 2026-06-19. **Tier 2** (Pulitzer-winning university-press synthesis) reported via **Tier 5** debate page. *Rejects \"market revolution\"; timing/valence/root-cause objections; \"communications revolution\" (telegraph, post, printing) as the true engine; farmers welcomed markets; mattress prices $50→$5.*\n\n21. Cane Ridge Revival, frontier under-churching and 1801 camp-meeting context (Christian History Institute and Encyclopedia of the Stone-Campbell Movement summaries). https://christianhistoryinstitute.org/magazine/article/revival-at-cane-ridge — Accessed 2026-06-19. **Tier 5** (popular religious-history magazine, Christian History Institute — used for narrative context; crowd figures corroborated below). *Frontier under-churched; clergy could not keep up; McGready and Stone; Cane Ridge August 1801.*\n\n22. Cane Ridge crowd estimates and population fraction (multiple corroborating accounts; figure traced to the *Encyclopedia of the Stone-Campbell Movement*). https://explorekyhistory.ky.gov/items/show/428 and https://www.whas11.com/article/news/local/cane-ridge-kentucky-revival-meeting-house-christianity-religion/417-556d9436-ee45-42a4-8470-7ac81ed7ec84 — Accessed 2026-06-19. **Tier 4/5** (state-history project + local news outlet, corroborating a Tier 2 reference-work figure). *10,000–20,000 attendees; ~10% of Kentucky's population; logistical caution that ≤10,000 present at once.*\n\n23. Susan O'Brien, \"A Transatlantic Community of Saints: The Great Awakening and the First Evangelical Network, 1735–1755\" (*American Historical Review*, 1986), and related O'Brien scholarship on evangelical magazines 1740–48 and transatlantic communications. https://discovery.researcher.life/article/a-transatlantic-community-of-saints-the-great-awakening-and-the-first-evangelical-network-1735-1755/e8d6b27bffe63fc2bd77cc2ca32512a9 — Accessed 2026-06-19. **Tier 2** (peer-reviewed *AHR* article; here accessed via abstract/indexing service, not full text). *Correspondence + reprint + periodical network; revivals \"perceived by many participants as parts of a single God-inspired phenomenon\"; Whitefield criss-crossing the Atlantic.*\n\n24. \"Faithful Translations: New Discoveries on the German Pietist Reception of Jonathan Edwards,\" *Church History* (Cambridge Core). https://www.cambridge.org/core/journals/church-history/article/abs/faithful-translations-new-discoveries-on-the-german-pietist-reception-of-jonathan-edwards/B359B4FF2F147FE8E90DA98C0446F587 — Accessed 2026-06-19. **Tier 2** (peer-reviewed journal; accessed via abstract). *Network extended to continental Pietism; Edwards translated/received in German Pietist circles.*\n\n25. Richard Carwardine, *Transatlantic Revivalism: Popular Evangelicalism in Britain and America, 1790–1865* (orig. Greenwood, 1978; rpt. Paternoster). https://www.amazon.com/Transatlantic-Revivalism-h-t-Evangelicalism-Evangelical/dp/1842273736 — Accessed 2026-06-19. **Tier 2** (scholarly monograph; cited via publisher/retailer listing for its thesis). *Transatlantic revival connection persisted 1790–1865 in nationally inflected forms.*\n\n26. 2023 Asbury revival / \"Outpouring\": duration, venue, and attendance. Asbury University official account (https://www.asbury.edu/about/revival-history/outpouring/) and Religion News Service reporting (https://religionnews.com/2023/02/28/asburys-revival-is-over-what-happens-now-rupp-arena-nick-hall/) — Accessed 2026-06-19. **Tier 1** (university's own account, for what it claims) + **Tier 5** (Religion News Service, specialist religion press, for independent corroboration). *16-day outpouring beginning 8 Feb 2023 in Hughes Auditorium; ~50,000–70,000 participants (the university's own estimate); visitors from Russia/Japan; spread via social-media livestream — present-day evidence that Driver 1's mechanism still operates.*\n\n27. Douglas A. Sweeney, *Nathaniel Taylor, New Haven Theology, and the Legacy of Jonathan Edwards* (Oxford University Press, Religion in America Series, 2003), reviewed and summarized via DTS Voice and Gale Academic. https://voice.dts.edu/review/douglas-a-sweeney-nathaniel-taylor-new-haven-theology-and-the/ — Accessed 2026-06-19. **Tier 2** (university-press monograph, accessed via scholarly review). *Edwards's Calvinist determinism → Taylor's New Haven theology of the \"power to the contrary\"; the Arminianizing turn that energized Second-Awakening revivalism; Taylor's system as \"antipodes of Edwards'\" while claiming his legacy.* Underlying primary texts (Edwards, *Religious Affections* 1746 and *A Faithful Narrative* 1737; Taylor, *Concio ad Clerum* 1828) referenced here.\n\n28. Donald G. Mathews, \"The Second Great Awakening as an Organizing Process, 1780–1830: An Hypothesis,\" *American Quarterly* 21, no. 1 (1969), and the three-thread historiography (social control → organizing process → democratization) as synthesized in graduate historiographical literature. **Tier 2** (peer-reviewed *AHR*/*American Quarterly* article) for Mathews; **Tier 5** for the three-thread historiographical framing. *Revival as social-organizational community-formation; the connective hypothesis between the social-control and democratization readings.*"}, {"order": 7, "file": "07_Primary_Sources.md", "title": "Primary Sources / Canonical Texts", "summary": "", "body": "# Primary Sources / Canonical Texts\n\n## Bottom Line\n\nThese pages are the ground floor. Where the other chapters report that \"Edwards argued X\" or \"Finney did Y,\" this is where a reader checks the text itself. Read directly, the canonical sources resist the legends that have grown around them. Edwards's *Faithful Narrative* (1737) is not a chronicle of mass hysteria but a sober, almost clinical anatomy of conversion that became the template for an entire genre. \"Sinners in the Hands of an Angry God\" (1741), the one Edwards text most Americans have met, is unrepresentative both of Edwards and of the revival, and — crucially — it does not end in terror but in an open offer of mercy. Edwards's two great discernment works, *The Distinguishing Marks* (1741) and *Religious Affections* (1746), are not defenses of \"enthusiasm\" but careful instruments for telling true revival from false, aimed against the radical revivalists and the rationalist critics at once; their central, easily-missed claim is that bodily effects, tears, and outcries are *no sign either way*. Whitefield's *Journals* and his \"Marks of the New Birth\" present a religion of inward regeneration over outward form. Chauncy's *Seasonable Thoughts* (1743) is the most formidable contemporary case against the revival, resting on a sharp division between the \"passions\" and the \"understanding.\" The Second-Awakening texts — Barton Stone on the Cane Ridge \"exercises,\" Nathaniel Taylor's *Concio ad Clerum* (1828) relocating sin from inherited nature to free act, Finney's *Lectures on Revivals* (1835) declaring revival \"not a miracle\" but the \"philosophical result\" of means, the Methodist *Disc
