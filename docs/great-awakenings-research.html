ipline*, and Richard Allen's conversion narrative — together show how the eighteenth-century revival of the *surprising work of God* became a nineteenth-century revival that human beings could deliberately produce. Throughout, the texts say less about a single coherent \"Great Awakening\" than the tradition's tidy summaries imply, which is exactly why the category itself is contested.\n\n---\n\n## A Note on Editions\n\nWherever Edwards is concerned these pages cite **The Works of Jonathan Edwards** (New Haven: Yale University Press, 1957– ), the critical edition, and note the volume. *A Treatise Concerning Religious Affections* is Volume 2, edited by John E. Smith (1959). *A Faithful Narrative*, *The Distinguishing Marks*, and *Some Thoughts Concerning the Present Revival* are gathered in Volume 4, **The Great Awakening**, edited by C. C. Goen (1972). The sermons, including \"Sinners in the Hands of an Angry God,\" appear across the sermon volumes (notably Volume 22, *Sermons and Discourses 1739–1742*, ed. Harry S. Stout and Nathan O. Hatch with Kyle P. Farley, 2003). The entire corpus is freely available digitally through the Jonathan Edwards Center at Yale (`edwards.yale.edu`); at the time of writing the Center's site is the standard scholarly portal, though its TLS certificate was expired when consulted on 2026-06-19, so the texts here are checked against the print Yale apparatus and independent transcriptions. For Whitefield, the standard modern text is *George Whitefield's Journals* (London: Banner of Truth, 1960), built on William Wale's 1905 edition with the previously unpublished journal added. For Chauncy, Stone, Taylor, Finney, the Methodist *Discipline*, and Allen, the citations here are to the first or standard editions and reliable digital transcriptions (Evans Early American Imprints; *Documenting the American South*; the Christian Classics Ethereal Library), noting where a quotation could be verified against a continuous text and where only against an excerpt.\n\nA word on the contested category. \"The Great Awakening\" is a retrospective label; participants spoke of \"the late work of God,\" \"the revival,\" or \"the awakening\" in their towns. Edwards himself never used the capitalized proper noun. Reading these texts directly is the best corrective to the impression — created by anthologies and survey courses — that they describe a single, unified, self-aware national event. They describe local works, transatlantic correspondence, and bitter disputes about what was happening.\n\n---\n\n## 1. Jonathan Edwards, *A Faithful Narrative of the Surprising Work of God* (1737)\n\n**Citation.** Jonathan Edwards, *A Faithful Narrative of the Surprising Work of God in the Conversion of Many Hundred Souls in Northampton, and the Neighbouring Towns and Villages* (London: John Oswald, 1737); critical edition in *The Works of Jonathan Edwards*, vol. 4, *The Great Awakening*, ed. C. C. Goen (New Haven: Yale University Press, 1972). Originally a 1736 letter to the Boston minister Benjamin Colman.\n\n**Context.** The text grew out of the Northampton revival of 1734–35, a local surge of conversions in Edwards's western-Massachusetts parish that he reported in a long letter to Colman, who arranged its publication. Goen's editorial introduction reconstructs the \"haphazard way\" the work reached print — abridged in Boston, then expanded in London under the sponsorship of Isaac Watts and John Guyse, then reprinted and translated into German within a year. It circulated across the Atlantic before the revivals of the 1740s, and so functioned less as a report on the Awakening than as one of its *causes*: it told ministers and laity in Britain, New England, and the German lands what a \"surprising work\" looked like, and thereby helped produce more of them.\n\n**A direct reading.** The *Faithful Narrative* is structured as social and psychological observation, not exhortation. Edwards opens with a demographic and moral profile of Northampton — its size, its \"license\" and \"frolicking\" youth, the deaths that sobered the town — and then describes the work's spread through 1734–35: first among the young, then through \"all sorts,\" with conversions in \"the space of half a year\" running, by his estimate, into the hundreds. The book's analytic heart is its account of the *order* of conversion. Edwards lays out a recognizable sequence — awakening and a sense of one's \"miserable condition\"; legal conviction and \"humiliation\" under the law; sometimes a period of \"distress\" and despair; then a discovery of the \"excellency of Christ\" and the \"sweetness\" of divine things; then a settled, joyful disposition. This is the Puritan \"morphology of conversion\" rendered as careful field notes.\n\nTwo case studies anchor the work: **Abigail Hutchinson**, a young woman who fell ill and died in a state of religious joy, and **Phebe Bartlet**, a child of four whose conversion Edwards reports in detail — her private prayer, her terror at the thought of hell, her settled comfort afterward. Edwards is plainly aware these will strain belief; he insists on the soundness of his witnesses and the ordinariness of the children involved.\n\n**What it actually says vs. what tradition says it says.** Two corrections matter. First, the *Faithful Narrative* is markedly *restrained*. There are no camp-meeting scenes, no mass faintings as the dominant note; Edwards repeatedly qualifies, distinguishes counterfeits from the genuine, and even reports the revival's *decline* and the suicide of his own uncle Joseph Hawley as the \"spirit\" withdrew — a detail later revivalists preferred to forget. The book that founded the genre of the revival narrative is far soberer than the genre it founded. Second, scholars have long debated whether Edwards's tidy \"stages\" describe the converts' experience or *impose a template* on it. Perry Miller (1949) read Edwards as an artist working in the only medium available to him; later critics note that the morphology Edwards \"observes\" is also the morphology his Puritan readers expected, so the *Narrative* may partly construct the very regularity it claims to find. Edwards's own later work — the *Religious Affections* — quietly complicates the schema by insisting there is no fixed order the Spirit must follow.\n\n**Significance.** This is the template. Whitefield carried it; Wesley read it; the nineteenth-century revival memoir descends from it. When these pages speak of a \"morphology of conversion\" or of revival as a describable, even predictable process, the *Faithful Narrative* is the source. It also seeds the central tension of the whole tradition: is a \"surprising work of God\" something that happens *to* a community, or something whose stages, once known, can be cultivated? Edwards thought the former; Finney, a century later, would bet on the latter.\n\n---\n\n## 2. Jonathan Edwards, \"Sinners in the Hands of an Angry God\" (1741)\n\n**Citation.** Jonathan Edwards, \"Sinners in the Hands of an Angry God. A Sermon Preached at Enfield, July 8th, 1741\" (Boston: S. Kneeland and T. Green, 1741); critical text in *The Works of Jonathan Edwards*, vol. 22, *Sermons and Discourses 1739–1742*, ed. Harry S. Stout et al. (New Haven: Yale University Press, 2003). Text: Deuteronomy 32:35, \"Their foot shall slide in due time.\"\n\n**Context.** Edwards delivered the sermon at Enfield, Connecticut, on July 8, 1741, during the height of the regional revival. Reportedly it produced such an outcry of distress that he could not finish over the noise. Edwards had preached the same sermon earlier at his own Northampton church to little visible effect; the famous response belonged to Enfield, a town said to be spiritually complacent while its neighbors were \"awakened.\" The sermon is an \"imprecatory\" or awakening sermon, a recognized eighteenth-century type meant to break through false security.\n\n**A direct reading.** The Doctrine is stark: \"There is nothing that keeps wicked men at any one moment out of hell, but the mere pleasure of God.\" The body of the sermon presses that pleasure as the sinner's only support. The wicked are already condemned; God's wrath is presently \"bent,\" and only sovereign forbearance suspends the sentence. The two most-quoted images: the **bow** — \"The bow of God's wrath is bent, and the arrow made ready on the string, and justice bends the arrow at your heart, and strains the bow\" — and the **spider** — \"The God that holds you over the pit of hell, much as one holds a spider, or some loathsome insect over the fire, abhors you, and is dreadfully provoked.\" The rhetorical strategy is sustained pressure: image after image of suspension over the abyss, designed to dissolve the listener's sense of safety.\n\n**What it actually says vs. what tradition says it says.** The decisive correction concerns the ending. In popular memory and in the way the sermon is excerpted, it is unbroken terror. **It is not.** The Doctrine occupies the long middle; the Application turns. Edwards swings from threat to invitation: \"And now you have an extraordinary opportunity, a day wherein Christ has thrown the door of mercy wide open, and stands in the door calling and crying with a loud voice to poor sinners.\" He points to the present revival as a harvest — \"many are daily coming from the east, west, north and south\" to Christ — and urges his hearers to \"fly out of Sodom.\" The terror is *instrumental*: a means to drive sinners to a mercy that is genuinely on offer. To quote only the spider is to amputate the sermon's own logic.\n\nThe deeper correction is about representativeness. As the historian Sydney Ahlstrom observed, Edwards became \"best known throughout America as a hell-fire revivalist\" on the strength of this single sermon, though in his own day he was known for sermons on \"the excellency of Christ,\" divine beauty, and love. The sermon owes its modern fame less to the eighteenth century than to its later career: it was credited with conversions during the Second Awakening (one Dartmouth man dated his 1815 conversion to reading it), then recoiled from by liberal Protestants — Lyman Beecher's wife Roxana called its God a \"slander on my Heavenly Father,\" and Harry Emerson Fosdick dismissed its theology of judgment — and finally fossilized as the obligatory Edwards selection in American-literature anthologies (it is the standard Edwards entry in the Norton). The anthology turned an atypical awakening sermon into \"the\" Puritan mind, caricaturing both Edwards (a metaphysician of beauty and love) and the revival (which the *Faithful Narrative* shows as something gentler and stranger than fire-and-brimstone).\n\n**Significance.** This is the most consequential *misreading* in the whole story. A reader who knows only \"Sinners\" will mis-describe Edwards's theology, the tone of the revival, and the relation between fear and grace in awakening preaching. The text is load-bearing precisely because so much popular understanding rests on a distortion of it.\n\n---\n\n## 3. Jonathan Edwards, *The Distinguishing Marks of a Work of the Spirit of God* (1741) and *A Treatise Concerning Religious Affections* (1746)\n\n**Citations.** *The Distinguishing Marks of a Work of the Spirit of God, Applied to that Uncommon Operation that has Lately Appeared on the Minds of Many of the People in New-England* — a discourse delivered at the Yale commencement, New Haven, September 10, 1741, and published \"with great enlargements\" (Boston, 1741); critical text in *Works*, vol. 4, *The Great Awakening*, ed. Goen. *A Treatise Concerning Religious Affections* (Boston: S. Kneeland, 1746); critical edition, *Works*, vol. 2, ed. John E. Smith (1959). The connecting text between them is *Some Thoughts Concerning the Present Revival of Religion in New England* (1742), also in vol. 4 — the work Chauncy answered.\n\n**Context.** By 1741 the revival had produced its own excesses: itinerants invading settled parishes, lay exhorters, ecstatic \"bodily effects,\" and radicals like James Davenport who denounced unconverted ministers and, in 1743, burned books and fine clothes. Edwards wrote to *defend* the revival as a genuine work of God while *disciplining* it — to claim the middle ground against two enemies at once: the radical \"enthusiasts\" who took every fit and impulse for the Spirit, and the rationalist critics (Chauncy chief among them) who took the fits as proof the whole thing was delusion. *The Distinguishing Marks* is the first, occasional attempt; *Religious Affections*, five years later and after the revival had ebbed, is the mature, systematic one.\n\n**A direct reading — *The Distinguishing Marks*.** The text is **1 John 4:1**, \"Believe not every spirit, but try the spirits whether they are of God\" — not 1 Corinthians, a common slip. Edwards proceeds in three movements. First, a list of **negative signs** — things that are *no evidence either way* that a work is or is not from the Spirit. These include: that the work is unusual or extraordinary; that it produces **bodily effects** — tears, trembling, groans, loud outcries, faintings, loss of bodily strength; that it occasions great \"noise\" about religion; that people have powerful impressions on their imaginations; that it spreads by example; that subjects fall into imprudences and irregularities; that errors and even delusions get mixed in; that some converts later fall away into scandal or heresy; and that ministers preach the terrors of the law. Edwards's repeated point: none of these, for or against, settles anything, because Scripture nowhere makes them a test. Of bodily effects he reasons that a true and overwhelming sense of eternal things might naturally overcome a \"feeble frame\" — if the Queen of Sheba fainted at Solomon's glory, why not at Christ's? Second, the **positive distinguishing marks**, drawn from 1 John 4: a true work (1) raises the esteem of the historical Jesus as Son of God and Savior; (2) operates *against* Satan's kingdom and worldly lust; (3) raises regard for Scripture; (4) leads to truth, convincing of sin and judgment; (5) produces *love* to God and neighbor. Third, the **application** to New England: judged by John's marks and not by the spurious tests, the present work is, in its main substance, of God — and its critics are in spiritual danger.\n\n**A direct reading — *Religious Affections*.** The *Affections* refines all of this into a treatise. The text is 1 Peter 1:8. The thesis: \"True religion, in great part, consists in holy affections\" — where \"affections\" are not fleeting emotions but the vigorous inclinations of the will, the soul's settled bent. Part One argues that genuine religion *is* affectional: a religion of mere notions, without the heart engaged, is dead. Part Two — the part most relevant to discernment — lists **twelve signs that are *no certain* signs**, things that prove a religious affection *neither* gracious *nor* false. Among them: that affections are very great or intense; that they have great *bodily* effects; that they come with fluent, fervent religious talk; that they arise without the person's own contrivance; that they come with scripture texts springing to mind; that they include the *appearance* of love; that many kinds of affection accompany one another; that comforts follow in a certain order after conviction; that they dispose to much external worship and praise; that they bring confident *assurance*; that they are convincing to other godly people. Part Three then gives **twelve positive signs** of truly gracious affections — they arise from the Spirit's supernatural influence; their object is the *excellency* of divine things in themselves, not self-interest; they are founded on the moral beauty of holiness; they flow from spiritual understanding; they bring deep conviction; they produce **evangelical humility**; they change the nature; they bear the temper of Christ (the \"lamb-like, dove-like spirit\"); they soften the heart; they have a beautiful symmetry and proportion; they increase spiritual appetite; and — the **twelfth and weightiest**, to which Edwards devotes the most space — they issue in **Christian practice**. \"Christian practice is the chief of all the signs of grace.\" The fruit in a life of holy obedience is the surest evidence the experience was real.\n\n**What they actually say vs. what tradition says they say.** The persistent misreading runs in both directions. Defenders of revival have sometimes read Edwards as endorsing the ecstasies — as if the faintings and outcries were the proof. They are not: Edwards twice insists they are *no sign*. Critics have sometimes read him as a sentimentalist of \"feeling.\" He is not: the *Affections* subordinates every inward experience to its fruit in practice and its ground in the loveliness of God. The single most important takeaway here is the **symmetry of the \"no certain signs.\"** Bodily effects do not prove a work false (against Chauncy) *and* do not prove it true (against the enthusiasts). Edwards built a discernment apparatus precisely to dethrone the question everyone else was fighting about — \"did people fall down and cry out?\" — and replace it with harder questions about the object, the humility, and the practice of the affected soul.\n\n**Significance.** These are the most sophisticated theological texts the revival produced and the permanent reference point for every later debate about how to tell true revival from false. When these pages distinguish Edwards's position from both the radicals and the Old Lights, *The Distinguishing Marks* and the *Affections* are the warrant. They also explain why Edwards could simultaneously defend the revival and, in his own Northampton, eventually discipline it — and be dismissed by his congregation in 1750.\n\n---\n\n## 4. George Whitefield, *Journals* and the Sermon \"The Marks of the New Birth\"\n\n**Citations.** *George Whitefield's Journals* (London: Banner of Truth, 1960), incorporating the 1905 William Wale edition plus a previously unpublished journal; the journals were first issued serially 1738–1741, several volumes printed in America by Benjamin Franklin (first volumes May and August 1740). George Whitefield, \"The Marks of the New Birth,\" in *Sermons on Important Subjects* (numerous eighteenth- and nineteenth-century editions); text, John 3:3 / the new-birth discourse (some printings give Matthew 18:3, \"Except ye be converted, and become as little children\").\n\n**Context.** Whitefield (1714–1770), the Anglican itinerant who crossed the Atlantic thirteen times, was the revival's transatlantic engine and its first mass-media celebrity. His *Journals* are self-published travel-and-revival diaries; his sermons, printed by Franklin among others, circulated as the era's best-sellers. Where Edwards theorized the revival, Whitefield *performed* it.\n\n**A direct reading — the *Journals*.** The *Journals* are episodic and self-promoting, recording crowds, conversions, and Whitefield's own spiritual states. The recurring scene is open-air, or \"field,\" preaching to immense multitudes. The most-quoted image comes from Kingswood, near Bristol, in February 1739, preaching to colliers (coal miners): the first sign of the sermon's effect, he writes, was \"the white gutters made by their tears, which plentifully fell down their black cheeks, as they came out of their coal pits.\" He records preaching at Moorfields and Kennington Common to crowds he reckons in the tens of thousands, \"melted down on every side,\" his own heart \"full of love.\" The *Journals*' theological keynote is the necessity of the New Birth and the inadequacy of mere outward religion.\n\n**A direct reading — \"The Marks of the New Birth.\"** The sermon's argument: salvation requires \"such a great and almighty change\" — a real, inward regeneration wrought by the Holy Spirit — and not denominational membership, infant baptism, or moral respectability. Whitefield warns that \"thousands, and ten thousands, who hope to go to this blessed place after death, are not now in the way to it while they live,\" because they rest on a \"rotten foundation\": baptism, churchgoing, the \"negatively good\" life of the \"honest moral man\" who \"receives the sacrament once or twice a year.\" Such a person may have \"a Christ in their heads\" but \"no Christ in their hearts.\" The genuine marks of the new birth are inward and practical: a sense of one's own spiritual poverty (\"poor, miserable, blind, and naked\"); a childlike submission of understanding, will, and affections to the word and Spirit; humility; guilelessness; and a loosening from worldly ambition.\n\n**What it actually says vs. what tradition says it says.** Two cautions. First, the famous epigram \"the world is my parish\" is **John Wesley's, not Whitefield's** — Wesley wrote \"I look upon all the world as my parish\" in June 1739; it is routinely misattributed to Whitefield. Second, the line \"Field-preaching is my plan; in this I am carried as on eagles' wings,\" widely quoted as Whitefield's, expresses his settled practice but is hard to pin to a specific dated journal entry or letter; it should be cited as characteristic rather than as a verified quotation. The substantive point that *is* secure: Whitefield's message was not primarily emotional frenzy but the doctrine of the new birth — regeneration as the dividing line between nominal and real Christianity. The crowds and tears were the *effect*; the theology of inward conversion was the *content*.\n\n**Significance.** Whitefield universalized the *Faithful Narrative*'s morphology and made the \"new birth\" the shibboleth of the awakened. His itinerancy across colonial and denominational lines — preaching to anyone, anywhere, indifferent to parish boundaries — is the practical root of the inter-denominational, voluntary, market-like shape of American evangelicalism, and the immediate provocation for the Old Light backlash documented next.\n\n---\n\n## 5. Charles Chauncy, *Seasonable Thoughts on the State of Religion in New England* (1743)\n\n**Citation.** Charles Chauncy, *Seasonable Thoughts on the State of Religion in New England, A Treatise in Five Parts* (Boston: Rogers and Fowle, 1743). Companion text: Chauncy, *Enthusiasm Described and Caution'd Against* (Boston, 1742), the sermon that preceded the treatise.\n\n**Context.** Chauncy (1705–1787), minister of Boston's First Church and a leader of the \"Old Light\" opposition, wrote *Seasonable Thoughts* as the deliberate counter to Edwards's *Some Thoughts Concerning the Present Revival* (1742). It is the fullest contemporary case *against* the awakening as a work of God, and the headwater of the rationalist, eventually Unitarian, strain in New England Congregationalism. (The two Chauncy texts are distinct and often conflated: the 1742 *Enthusiasm Described* is the short sermon; the 1743 *Seasonable Thoughts* is the five-part treatise. Both are cited here, kept separate.)\n\n**A direct reading.** Chauncy's master distinction is between the **understanding** (reason, judgment) and the **passions** (affections, the imagination). True religion, for Chauncy, must work *through* the understanding: \"unless the reasonable nature is suitably wrought upon, the understanding enlightened, the judgment convinced, the will persuaded, and the mind entirely changed, it will avail but to little purpose; though the passions should be set all in a blaze.\" Religion that bypasses reason to inflame the passions \"leads directly to Enthusiasm\" — by which Chauncy means, in his 1742 sermon's definition, \"an imaginary, not a real inspiration\": the enthusiast \"mistakes the workings of his own passions for divine communications.\" Against the revival he levels concrete charges: the disorder of **itinerants** intruding on settled parishes; **lay exhorters** and untrained people (including women and children) presuming to preach and judge; the practice of pronouncing on others' spiritual states and damning \"unconverted\" ministers; **terror preaching** that works on fear rather than reason; and the bodily commotions — outcries, faintings, \"visions\" — taken as marks of grace. Crucially, Chauncy denies that good effects prove a good cause: it is \"not evident\" to him that people \"generally\" have, after the revival, \"a better Understanding of Religion, a better Government of their Passions, a more Christian Love to their Neighbour.\"\n\n**What it actually says vs. what tradition says it says.** Chauncy is often dismissed as a cold rationalist who simply hated revival. The text is more careful. He grants that there may have been genuine conversions; his target is the *enthusiasm*, the *disorder*, and the *epistemology* — the claim that intensity of feeling is self-validating. His deepest argument anticipates Edwards's own move in the *Affections*: that bodily effects and strong emotion prove nothing about the work's source. The difference is that where Edwards concluded \"no sign either way\" and then defended the revival's substance, Chauncy concluded that since the passions are unreliable and the disorder is manifest, the burden of proof falls on the revivalists — and they have not met it. Read side by side, Edwards and Chauncy are not as far apart on the *premises* (both distrust raw emotion as evidence) as on the *verdict*.\n\n**Significance.** *Seasonable Thoughts* is the most formidable primary source for the case against the First Awakening and the origin point of the \"Old Light\"/liberal lineage that ran toward Unitarianism. On the historiographical question of whether the Awakening was a coherent or a salutary event, Chauncy is the contemporary who said *no* — and said it with arguments, not merely distaste. His division of understanding from passion frames a debate that runs straight through to Finney and beyond.\n\n---\n\n## 6. Barton W. Stone, *Biography / Autobiography* — A Firsthand Cane Ridge Account (1801)\n\n**Citation.** Barton Warren Stone, *The Biography of Eld. Barton Warren Stone, Written by Himself: with Additions and Reflections by Elder John Rogers* (Cincinnati: J. A. & U. P. James, 1847). The chapter on the \"religious exercises\" gives Stone's firsthand testimony to the Cane Ridge revival (Bourbon County, Kentucky, August 1801).\n\n**Context.** Stone (1772–1844), a Presbyterian-turned-Restorationist minister, helped organize the Cane Ridge \"communion season\" of August 1801 — the largest and most famous camp meeting of the Second Great Awakening, drawing crowds contemporaries estimated at 10,000–20,000 or more. His memoir, completed late in life and published with additions by John Rogers, is the principal eyewitness account by an organizer.\n\n**A direct reading.** Stone classifies the \"bodily exercises\" into discrete types: \"the falling exercise — the jerks — the dancing exercise — the barking exercise — the laughing and singing exercise.\" On the **falling exercise**: a person, often with \"a piercing scream,\" would fall and lie as if dead, then revive declaring love to Christ and urging others to repent. On the **jerks** — his most detailed description: \"Sometimes the subject of the jerks would be affected in some one member of the body, and sometimes in the whole system. When the head alone was affected, it would be jerked backward and forward, or from side to side, so quickly that the features of the face could not be distinguished.\" He notes that subjects \"could not account for it,\" that some told him these \"were among the happiest seasons of their lives,\" and — strikingly — that of the thousands he saw, he did not \"remember that any one ... ever sustained an injury in body.\" His overall judgment is cautious but affirmative: amid \"many eccentricities, and much fanaticism,\" \"the good effects were seen and acknowledged in every neighborhood,\" and for a time the work \"silenced contention, and promoted unity\" among the sects.\n\n**What it actually says vs. what tradition says it says.** Cane Ridge is remembered as pandemonium, and the exercises were indeed wild. But Stone, like Edwards before him, distinguishes the *phenomena* from the *work*. He neither denies the extravagance nor grants that it discredits the conversions; he treats the bodily exercises as real but theologically inconclusive — closer to Edwards's \"no sign either way\" than the legend of frontier hysteria suggests. The careful taxonomy itself is evidence of an observer trying to *discern*, not merely enthuse. It is worth noting Stone's account is retrospective (written decades later) and apologetic in purpose, which is a real limit on it as evidence of exactly what occurred in 1801.\n\n**Significance.** Cane Ridge is the iconic scene of the Second Awakening and the birthplace of the camp meeting as an institution; Stone's narrative is the primary witness to it here. It also marks the theological hinge from which Stone's Restorationist movement (later merging into the Stone-Campbell tradition) sprang, and it shows the discernment problem of 1741 — what do the bodies mean? — reappearing on the Kentucky frontier sixty years on.\n\n---\n\n## 7. Nathaniel W. Taylor, *Concio ad Clerum* (1828)\n\n**Citation.** Nathaniel William Taylor, *Concio ad Clerum: A Sermon Delivered in the Chapel of Yale College, September 10, 1828* (New Haven: Hezekiah Howe, 1828). Text: Ephesians 2:3, \"And were by nature the children of wrath, even as others.\"\n\n**Context.** Taylor (1786–1858), first professor of theology at Yale Divinity School, was the architect of the \"New Haven theology.\" *Concio ad Clerum* (\"a word to the clergy,\" the title of the Yale commencement sermon) is its manifesto. It is the theological pivot of the Second Awakening: the point at which the Edwardsean tradition is bent toward a doctrine of free human agency that makes Finney's revivalism intellectually possible.\n\n**A direct reading.** Taylor takes the orthodox text — humans are \"by nature children of wrath\" — and reinterprets \"by nature.\" He denies that human depravity is an inherited *substance* or a sinful *nature* created in the soul prior to and apart from choice: \"moral depravity does not consist in any essential attribute or property of the soul — not in any thing created in man by his Maker.\" Depravity is rather \"man's own act, consisting in a free choice of some object rather than God, as his chief good.\" \"By nature\" therefore means that human beings will, *certainly but freely*, sin in all the circumstances of their existence — as a bad tree, in his analogy, certainly bears bad fruit, yet each sin is a voluntary act. The decisive qualification is the **\"power to the contrary\"**: a moral agent, to be a moral agent, must have the *power* to do otherwise; \"certainty with power to the contrary.\" Taylor also argues, controversially, that God may not be able to prevent all sin in a system of genuinely free agents without destroying their moral agency. Throughout, he claims continuity with Calvin, Edwards, and Westminster — insisting they too located sin in voluntary action and denied that God creates sinful natures.\n\n**What it actually says vs. what tradition says it says.** Taylor is caricatured by his Old School Calvinist critics (and sometimes by later historians) as having simply abandoned original sin for Pelagianism. The text is subtler. He does *not* deny universal sinfulness or its certainty; he relocates it from inherited *nature* to free *act*, keeping the certainty while inserting the \"power to the contrary.\" Whether this is a faithful development of Edwards (as Taylor claimed, appealing to Edwards's own voluntarism and his treatise on the will) or a decisive break from him (as the Princeton theologians charged) is itself one of the era's live theological disputes — and the text genuinely supports the *ambiguity*: Taylor uses Edwardsean materials to reach a markedly un-Edwardsean conclusion about inability. The honest reading is that he both extends and overturns Edwards, depending on which Edwardsean thread one follows.\n\n**Significance.** *Concio ad Clerum* is the theological license for the Second Awakening's activism. If sin is a free act each person has the power *not* to commit, then conversion is something the sinner can be *summoned* to do now — which is exactly the premise Finney builds on. The drift from Edwards's sovereign \"surprising work\" toward Taylor's free agent is the intellectual spine connecting the two Awakenings, and the reason the second feels so different from the first.\n\n---\n\n## 8. Charles G. Finney, *Lectures on Revivals of Religion* (1835)\n\n**Citation.** Charles Grandison Finney, *Lectures on Revivals of Religion* (New York: Leavitt, Lord & Co., 1835); standard modern critical edition ed. William G. McLoughlin (Cambridge, MA: Harvard University Press / Belknap, 1960). The lectures were first delivered and transcribed in Rochester/New York and printed in the *New York Evangelist*. Opening text: Habakkuk 3:2, \"O Lord, revive thy work.\"\n\n**Context.** Finney (1792–1875), the lawyer-turned-evangelist of the \"Burned-over District\" of upstate New York, was the dominant revivalist of the Second Awakening and the theorist of its methods. The *Lectures* systematize his practice into a how-to manual, the most influential book on revival technique ever written in America.\n\n**A direct reading.** The famous keynote of Lecture One: a revival of religion \"is not a miracle, or dependent on a miracle, in any sense. It is a purely philosophical [i.e., scientific] result of the right use of the constituted means.\" Finney defines a miracle as a suspension of natural law; a revival, he insists, suspends nothing — \"all the laws of matter and mind remain in force.\" He presses the **agricultural analogy**: \"a revival is as naturally a result of the use of the appropriate means as a crop is of its appropriate means.\" And he goes further — the connection between means and revival is *more* reliable than in farming, because \"the most useful and important things are most easily and certainly obtained by the use of the appropriate means.\" The right means are the **\"new measures\"**: protracted meetings, the **\"anxious seat\"** or anxious bench (a front pew where the convicted come to be prayed over and decide), the \"anxious meeting,\" colloquial and direct preaching, praying for individuals by name, and — most controversial — encouraging **women to pray aloud in mixed (\"promiscuous\") assemblies**. Underneath the technique is Taylor-style theology: conversion is a *rational choice* the sinner has the power to make, and belief is the sinner's own act.\n\n**What it actually says vs. what tradition says it says.** Finney is often read as having reduced revival to pure human engineering, draining out the divine. The text is more careful than the slogan. He does say the means *produce* the result; but he frames the means as God's appointed instruments and insists revival still requires the Spirit's blessing on them. Still — and this is the substantive correction in the *other* direction — Finney really did mean what the slogan says: he polemicizes directly against the older view (Edwards's, in effect) that revival is a \"sovereign\" and unpredictable visitation to be waited and prayed for. The whole rhetorical force of Lecture One is to *deny* that revival must be a \"surprising work of God\" and to assert that the church has sinfully sat waiting when it could have *acted*. So the popular reading is not a misreading of Finney's intent so much as a flattening of his hedges. The real distance to measure is between Finney and Edwards: the *Faithful Narrative* describes something that happened *to* Northampton; the *Lectures* tell you how to *make* it happen anywhere.\n\n**Significance.** This is the most important single text for the \"continuity vs. rupture\" question. Finney converts revival from event into technology, and in doing so creates the template for modern mass evangelism — Moody, Sunday, Graham, and the megachurch all descend from the *Lectures*' premise. It is also Exhibit A for the \"social control\" and \"market revolution\" readings of the Second Awakening, and for Nathan Hatch's \"democratization\" thesis: a religion any motivated agent can produce, market, and join.\n\n---\n\n## 9. The Methodist Sources: The *Doctrines and Discipline* (1784) and the Frontier Journals (Asbury; Cartwright)\n\n**Citations.** *The Doctrines and Discipline of the Methodist Episcopal Church in America* (Philadelphia, 1785; product of the \"Christmas Conference,\" Baltimore, December 1784). *The Journal and Letters of Francis Asbury*, ed. Elmer T. Clark et al., 3 vols. (Nashville: Abingdon, 1958). *Autobiography of Peter Cartwright, the Backwoods Preacher*, ed. W. P. Strickland (New York: Carlton & Porter, 1856).\n\n**Context.** Methodism was the great institutional winner of the Second Awakening, growing from a tiny society in 1784 to the largest American denomination by mid-century, carried by an itinerant ministry of circuit riders under Francis Asbury (1745–1816). The *Discipline* is the church's founding rulebook; Asbury's *Journal* and Cartwright's *Autobiography* are the frontier ministry's primary self-witness.\n\n**A direct reading — the *Discipline*.** The 1784 *Discipline* organizes the new church: the General Rules, the class-meeting system (small bands for mutual examination), the itinerant connection, and standards of conduct. Its most-cited provision is its original **antislavery rule**: under Thomas Coke's influence the Christmas Conference required that Methodists buy, sell, or hold no slaves, framing slavery as an \"abomination\" to be rooted out, on pain of expulsion. But this rule did *not* stay in force. Within six months, at the Baltimore Conference of 1785 (with Asbury presiding after Coke's departure for England), the rule was suspended under pressure from southern members. The *Discipline* read in isolation overstates early Methodism's antislavery resolve; the rule on the page in 1784 was a dead letter in practice almost immediately, and the church would later split north and south over the question (1844).\n\n**A direct reading — the journals.** Asbury's *Journal* records the relentless, ascetic itineracy of the frontier bishop — thousands of miles on horseback annually, sleeping rough, preaching daily. Cartwright's *Autobiography* is the vivid, combative memoir of a circuit rider in Kentucky, Tennessee, Indiana, and Illinois. Cartwright gives one of the best firsthand descriptions of the **jerks**: a \"convulsive jerking all over, which they could not by any possibility avoid,\" and \"the more they resisted the more they jerked\"; of fashionable women so seized that \"their long loose hair would crack almost as loud as a wagoner's whip.\" His signature anecdote: a drunken man who \"cursed the jerks, and all religion,\" then was himself seized, tried to drink whiskey to stop them, \"jerked at such a rate he could not get the bottle to his mouth,\" and at last \"fetched a very violent jerk, snapped his neck, fell, and soon expired.\" Cartwright's verdict on the camp-meeting exercises, despite the wildfire and excess, is that they did vast good and were preferable to \"dead\" formalism.\n\n**What they actually say vs. what tradition says they say.** Two corrections. First, on slavery: the popular memory of \"the antislavery Methodist founders\" is true of the 1784 text and false of the institution within a year — the rule on the page outlived its force almost at once. Second, on the exercises: Cartwright, like Stone and Edwards, is not a credulous enthusiast. He records the jerks with relish but also with skepticism about excess, and his polemical anecdotes (the cursing drunkard) are partly *moral tales* designed to vindicate the work against scoffers — they should be read as testimony shaped by purpose, not neutral reportage.\n\n**Significance.** The Methodist sources show *how* the Second Awakening was institutionalized and made to last where Cane Ridge's ecstasies could not. The class meeting, the circuit, and the *Discipline* are the machinery that converted revival fervor into the most durable denominational structure in nineteenth-century America. They also stage, in the slavery rule's quick reversal, the era's central moral failure — and they anchor the claims here about Methodist growth, frontier revivalism, and the social shape of the awakening.\n\n---\n\n## 10. Richard Allen, *The Life, Experience, and Gospel Labours* (1833) — A Black Conversion Narrative\n\n**Citation.** Richard Allen, *The Life, Experience, and Gospel Labours of the Rt. Rev. Richard Allen ... To Which is Annexed the Rise and Progress of the African Methodist Episcopal Church* (Philadelphia: Martin & Boden, 1833); standard transcription, *Documenting the American South* (University of North Carolina). Contextualized by Albert J. Raboteau, *Slave Religion: The \"Invisible Institution\" in the Antebellum South* (New York: Oxford University Press, 1978).\n\n**Context.** Allen (1760–1831) was born enslaved near Philadelphia, was converted under Methodist preaching, bought his freedom, and became the founder and first bishop of the African Methodist Episcopal (AME) Church — the first independent Black denomination in the United States. His autobiography is among the earliest Black conversion narratives in print and a primary source for the racial story of the Awakenings.\n\n**A direct reading.** Allen's conversion narrative follows the awakening morphology but in the idiom of the enslaved. He describes a season of conviction and dread — \"One night I thought hell would be my portion\" — and then the moment of release, in language soaked in the Exodus and the prison-deliverance of Acts: \"I cried unto Him who delighteth to hear the prayers of a poor sinner; and all of a sudden my dungeon shook, my chains flew off, and glory to God, I cried. My soul was filled.\" The autobiography's pivotal public scene is the walkout from **St. George's Methodist Church** in Philadelphia: kneeling at prayer in the segregated gallery, Allen and others were physically pulled up — \"I saw one of the trustees ... having hold of the Rev. Absalom Jones, pulling him up off of his knees, and saying, 'You must get up — you must not kneel here.'\" When the prayer ended, \"we all went out of the church in a body, and they were no more plagued with us.\" Out of that humiliation came the independent Black church and, eventually, the AME. On *why* Methodism reached Black people, Allen is explicit: \"the plain and simple gospel suits best for any people, for the unlearned can understand, and the learned are sure to understand\" — the extempore, accessible, experiential preaching of Methodism over formal liturgy.\n\n**What it actually says vs. what tradition says it says.** Allen's narrative corrects a one-sided memory in two ways. It shows that the revival's evangelical egalitarianism — the new birth available to all, the plain gospel for the \"unlearned\" — genuinely drew Black converts and gave them a theology of liberation (the \"dungeon shook, chains flew off\" is not incidental imagery for a man born enslaved). *And* it shows that white revival institutions practiced and enforced racial subordination even at the altar, which is why Black Methodists had to leave to worship freely. Raboteau's *Slave Religion* supplies the larger frame Allen's single narrative cannot: that enslaved Christianity was often an \"invisible institution,\" with its own brush-arbor meetings, spirituals, and readings of Scripture (Exodus above all) that diverged sharply from the slaveholders' \"obey your masters\" gospel. (One scope note: the dating of the St. George's walkout is contested among historians — traditionally 1787, but argued by some for 1792–93 near the new church's groundbreaking; Allen's own memoir, written decades later, is not precise on the year.)\n\n**Significance.** This is the primary witness here that the Awakenings' story is not only white and not only triumphal. The same revivalism that produced Finney's perfectionist reformism and the camp meeting also produced the independent Black church — born, by Allen's own testimony, from being dragged off one's knees during prayer. On race, the rise of Black Christianity, and the gap between the revival's universal gospel and its segregated practice, Allen's narrative (read alongside Raboteau) is where the claim is grounded.\n\n---\n\n## Cross-Cutting Observations\n\nReading the texts together, rather than as isolated set pieces, surfaces patterns the survey summaries miss:\n\n**The discernment problem is the through-line.** From Edwards's *Distinguishing Marks* (1741) to Stone at Cane Ridge (1801) to Cartwright on the jerks (1856), the central recurring question is not \"did the revival happen?\" but \"what do the *bodies* mean?\" — and the most thoughtful witnesses on every side (Edwards, Chauncy, Stone) converge on the same answer: the bodily phenomena are *no certain sign* either way. The legend of the Awakenings as pure emotional contagion is largely a failure to read the participants' own caution.\n\n**The arc bends from \"surprising work\" to \"produced result.\"** The single most important movement across the two Awakenings is theological and is legible directly in the texts: Edwards's *sovereign* God who *surprises* Northampton (1737) becomes Taylor's *free agent* who has the \"power to the contrary\" (1828) becomes Finney's revival that is \"not a miracle\" but the \"philosophical result\" of means (1835). Continuity or rupture? The texts support *both* readings, which is why the historiographical debate is live: the *language* of revival is continuous; the *theology of agency* underneath it is transformed.\n\n**Misreading is patterned, not random.** The three most-misread texts — \"Sinners\" (terror without the mercy), the *Affections* (feeling without the practice), Finney's *Lectures* (engineering without the Spirit) — are each misread by *amputation*: the tradition keeps the vivid half and drops the qualifying half. Restoring the dropped half is most of what these pages do.\n\n**\"The Great Awakening\" is nowhere in the sources as a unified self-aware event.** Edwards wrote of \"the late surprising work\"; the camp-meeting men wrote of \"the great revival\"; Chauncy wrote of \"the present state of religion.\" The capitalized, unified, national \"Great Awakening\" is a later historian's construction — which is precisely the contested-category point these pages are built around, and which the primary texts, read directly, support.\n\n---\n\n## Open Questions\n\n1. **The Whitefield *Journals*' reliability as self-witness.** Whitefield curated and revised his journals for publication and self-promotion; how much do the crowd estimates and conversion counts reflect events versus marketing? A closer textual study against independent witnesses (Franklin, Nathan Cole's famous account) would sharpen this.\n\n2. **Was Taylor extending Edwards or breaking from him?** The *Concio ad Clerum* claims Edwardsean descent while reaching a conclusion Edwards's Old School heirs called heretical. Adjudicating this requires close reading of Taylor against Edwards's *Freedom of the Will* (1754), not consulted directly here.\n\n3. **The exact text of \"The Marks of the New Birth.\"** Printings disagree on the governing scripture (John 3 vs. Matthew 18:3); the sermon also circulated in multiple versions. A critical comparison of editions would settle which text Whitefield actually preached.\n\n4. **The dating of the St. George's walkout.** Allen's memoir (1833) is decades after the event; the traditional 1787 date and the revisionist 1792–93 date both have defenders. The discrepancy bears on the relation between Black-church independence and the broader 1790s revival.\n\n5. **How far do Cartwright's and Stone's retrospective memoirs distort 1801?** Both were written long after Cane Ridge and with apologetic aims. Contemporaneous 1801 sources (newspaper accounts, the Presbyterian records) would test how much the famous \"exercises\" owe to later legend.\n\n6. **The slave conversion sources beyond Allen.** Raboteau documents an \"invisible institution\" largely *oral* — spirituals, brush-arbor preaching, remembered conversions in the WPA ex-slave narratives. The primary base for enslaved religion is fragmentary and mediated; how representative is the literate, free, northern Allen of the enslaved southern majority?\n\n---\n\n## Sources\n\n**Tier 1 — Primary texts (the works themselves, in critical or standard editions):**\n\n1. Jonathan Edwards, *A Faithful Narrative of the Surprising Work of God* (1737), in *The Works of Jonathan Edwards*, vol. 4, *The Great Awakening*, ed. C. C. Goen (Yale University Press, 1972). Jonathan Edwards Center, Yale — `edwards.yale.edu/research/major-works/faithful-narrative` (accessed 2026-06-19; site TLS certificate expired at access). — *The template revival narrative; conversion morphology; Hutchinson and Bartlet case studies.*\n\n2. Jonathan Edwards, \"Sinners in the Hands of an Angry God\" (1741), in *Works*, vol. 22, *Sermons and Discourses 1739–1742*, ed. H. S. Stout et al. (Yale, 2003); text at Blue Letter Bible, `blueletterbible.org/Comm/edwards_jonathan/Sermons/Sinners.cfm` (accessed 2026-06-19). — *Verified the Deut. 32:35 text, the Doctrine, the spider and bow images, and the mercy-offer ending.*\n\n3. Jonathan Edwards, *The Distinguishing Marks of a Work of the Spirit of God* (1741), in *Works*, vol. 4; text at Bible Bulletin Board, `biblebb.com/files/edwards/je-marksofhs.htm` (accessed 2026-06-19). — *1 John 4:1 text; the negative signs / positive marks structure.*\n\n4. Jonathan Edwards, *A Treatise Concerning Religious Affections* (1746), *Works*, vol. 2, ed. John E. Smith (Yale, 1959). Edition confirmed via Yale University Press / Amazon and the Jonathan Edwards Center. — *The \"no certain signs\" / twelve positive signs structure; Christian practice as chief sign.*\n\n5. George Whitefield, *George Whitefield's Journals* (Banner of Truth, 1960, after Wale 1905); Quinta Press digital edition, `quintapress.com`. Kingswood \"white gutters made by their tears\" and field-preaching scenes. — *Field preaching; new-birth keynote.*\n\n6. George Whitefield, \"The Marks of the New Birth,\" text via CBN, `secure.cbn.com/spirituallife/.../Whitefield_MarksOfNewBirth.aspx` (accessed 2026-06-19). — *Regeneration vs. nominal Christianity; marks of the new birth.*\n\n7. Charles Chauncy, *Seasonable Thoughts on the State of Religion in New England* (Boston, 1743); Internet Archive `archive.org/details/seasonablethough00chau`; companion sermon *Enthusiasm Described and Caution'd Against* (1742), Evans/Univ. of Michigan `quod.lib.umich.edu`. — *Understanding vs. passions; the Old Light case; \"good effects\" do not prove the cause.*\n\n8. Barton W. Stone, *The Biography of Eld. Barton Warren Stone, Written by Himself*, with additions by John Rogers (Cincinnati, 1847); excerpt and analysis, \"History of the Jerks\" project, University of Richmond, `blog.richmond.edu/jerkshistory` (accessed 2026-06-19). — *Firsthand Cane Ridge; the six \"exercises\"; cautious affirmative verdict.*\n\n9. Nathaniel W. Taylor, *Concio ad Clerum* (New Haven, 1828); text at Gospel Truth, `gospeltruth.net/concio.htm` (accessed 2026-06-19). — *Ephesians 2:3; depravity as free act not inherited nature; \"power to the contrary.\"*\n\n10. Charles G. Finney, *Lectures on Revivals of Religion* (1835); critical ed. W. G. McLoughlin (Harvard/Belknap, 1960); text at Christian Classics Ethereal Library, `ccel.org/ccel/finney/revivals` (accessed 2026-06-19). — *Habakkuk 3:2; revival \"not a miracle\"; the agricultural analogy; the new measures.*\n\n11. *The Doctrines and Discipline of the Methodist Episcopal Church* (1784/85); 1784 Christmas Conference antislavery rule and its 1785 suspension, via UMC.org and scholarly accounts. Francis Asbury, *Journal and Letters*, ed. Clark (Abingdon, 1958); Peter Cartwright, *Autobiography of Peter Cartwright* (1856), National Humanities Center transcription and University of Richmond \"Jerks\" excerpt. — *Class meeting / circuit / Discipline; the antislavery rule and its reversal; Cartwright on the jerks.*\n\n12. Richard Allen, *The Life, Experience, and Gospel Labours of the Rt. Rev. Richard Allen* (Philadelphia, 1833); *Documenting the American South*, `docsouth.unc.edu/neh/allen/allen.html` (accessed 2026-06-19); National Humanities Center PDF. — *Black conversion narrative; \"my dungeon shook, my chains flew off\"; the St. George's walkout; plain gospel for \"the unlearned.\"*\n\n**Tier 2 — Scholarly apparatus and critical editions (commentary alongside the primary reading):**\n\n13. C. C. Goen, editorial introduction to *The Great Awakening* (*Works*, vol. 4, Yale, 1972). — *Publication history of the* Faithful Narrative*; the revival's print circulation.*\n\n14. John E. Smith, editorial introduction to *Religious Affections* (*Works*, vol. 2, Yale, 1959). — *The* Affections *as Edwards's mature discernment treatise.*\n\n15. Perry Miller, *Jonathan Edwards* (William Sloane, 1949). — *Edwards as artist; the morphology-as-construction reading.*\n\n16. Sydney E. Ahlstrom, *A Religious History of the American People* (Yale, 1972), and the cited 1961 observation that Edwards became \"best known ... as a hell-fire revivalist.\" — *On the misreading of \"Sinners.\"*\n\n17. Albert J. Raboteau, *Slave Religion: The \"Invisible Institution\" in the Antebellum South* (Oxford University Press, 1978). — *The frame for enslaved Christianity that Allen's single narrative cannot supply.*\n\n18. William G. McLoughlin, ed., introduction to Finney's *Lectures on Revivals of Religion* (Harvard/Belknap, 1960). — *Finney's \"not a miracle\" thesis in its theological setting.*\n\n*A note on sourcing: every factual reading above rests on the Tier 1 primary texts; the Tier 2 works are cited only as commentary alongside them. Several of the primary texts were checked against reliable digital transcriptions rather than against the print critical edition page by page, as noted in the relevant entries. The Jonathan Edwards Center site (`edwards.yale.edu`) is the standard scholarly portal but presented an expired TLS certificate when accessed on 2026-06-19 — a caveat on the digital availability, not on the texts themselves.*"}, {"order": 8, "file": "Future_Trajectory.md", "title": "The First and Second Great Awakenings in America: Future Trajectory", "summary": "", "body": "# The First and Second Great Awakenings in America: Future Trajectory\n\n## Bottom Line\n\nThe most likely future is a managed decline: the revivalist *form* survives even as the aggregate numbers slowly erode. On this 40-50% modal path, Christian affiliation drifts from roughly 62% toward the high-to-mid 50s% by ~2045, evangelicalism slips from ~23% toward the high-teens or low-20s%, and the post-2019 leveling becomes a gentle grind rather than a cliff or a hard floor. One question organizes everything else: is that 2019 leveling a genuine *floor* or only a *pause*? It cannot yet be resolved, so the forecast preserves it as the gap between two scenarios rather than averaging it away. The second-likeliest outcome, at 25-35%, is a resumed, steeper slide driven by mechanical cohort replacement — high-share elders dying and being replaced by a ~45%-Christian young cohort — and it carries an elevated risk that the scholarly \"both/and\" synthesis of the Awakenings is partly demoted as living evangelicalism shrinks. A genuine US-exception stabilization, in which a sticky high-commitment core renewed by Global-South immigration holds Christian affiliation in the high-50s/low-60s%, runs at 18-28%. A discontinuity tail sits at 6-12%: a demographically consequential \"Fifth Great Awakening,\" or a communications/epistemic regime change that breaks the print-and-itinerancy mechanism carrying revival since 1740. Three drivers run through all four scenarios — cohort-replacement secularization (which produces decline, but slowly), the communications-plus-democratization cluster that keeps revival portable and now networked, and the Finke-Stark church-sect dynamic that lets high-tension sects outlast the accommodating mainline. That last one is why, in every scenario, the surviving Christian core is a revivalist one.\n\n## Method\n\nThis forecast fuses three independently cross-examined points of view — a base-rate-first view, a driver-dominant view, and a contrarian view — weighted by which derivations best survived adversarial cross-examination rather than averaged into a false midpoint. The base-rate-first and driver-dominant views independently arrived at the *same* ~45-55% modal, reconstructing at ~0.57 and ~0.51, with a geometric-mean-of-odds of the two midpoints near 0.50. The contrarian's intact-between-cohort-gradient derivation is the sharpest single argument on the table: the US 18-29 Christian share (~45%) sits far below the ~62% aggregate, and Western secularization works between cohorts rather than within them. It survived intact and transferred roughly 5-7 points out of the modal and into the steeper-slide scenario.\n\nA small set of strong reference cases anchors the forecast: the near-uniform record of cohort-driven Protestant secularization across peer nations, the ~280-year survival of the revival *form* across every host tradition, the historical rarity of within-cohort re-religionizing, and the roughly once-per-70-to-140-year frequency of trend-breaking mass awakenings. A sweep of prediction markets in mid-2026 found no liquid market on the exact generational question or on Awakenings historiography, so the forecast falls back to base rates. The available proxies are thin, play-money Manifold markets — a 27% \"Christian affiliation increases over five years\" and a 19% \"Christian share below 60% by end-2026\" — plus two relevant Metaculus questions that exist but could not be priced because the platform's data was inaccessible. The horizon is a generation, through ~2045, with the decisive cohort evidence readable by roughly 2028-2034.\n\nThe three views split on one central question: is the post-2019 leveling a floor or a pause? The base-rate-first and driver-dominant views read it as a real deceleration that holds, supporting the modal and the stabilization branch. The contrarian's strongest case — the intact 45%-vs-62% gradient plus Voas-Chaves between-not-within-cohort secularization — argues it is a pause that resumes into a steeper slide. Both survived cross-examination and point in opposite directions on the same data. Rather than split the difference, the forecast widens the decline band and divides it into two scenarios, Managed Decline at 40-50% versus Resumed Slide at 25-35%. The gap between them expresses how contingent the next two cohort waves (~2028-2034) make the outcome. A second live disagreement rides on the scholarship: will the \"chastened both/and\" synthesis be extended (~0.75) or overturned (~24%)? That one is carried *inside* the decline scenarios rather than resolved.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios — a generation, through ~2045<\/div><svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"156\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"172\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Managed Decline, Revivalis…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"381.4\" y=\"8\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"438.5\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">40–50%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Resumed Accelerated Slide …<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"307.8\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"364.9\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">25–35%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Genuine Stabilization / Re…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"273.4\" y=\"80\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"330.5\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">18–28%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Revival Surge / Discontinu…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"214.5\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"251.9\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">6–12%<\/text><\/svg><figcaption> <span class=\"credit\">Source: Scenario forecast.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario 1: Managed Decline, Revivalist Form Survives (modal)\n\n**Probability: 40-50%.**\n\nThis is the consensus modal path. The aggregate Christian share drifts slowly from roughly 62% toward the high-to-mid 50s% by ~2045, and evangelicals from about 23% toward the high-teens or low-20s%; the post-2019 leveling becomes a gentle grind rather than a cliff or a hard floor. Revival *as form*, though, survives robustly. Livestreamed outpourings in the Asbury-2023 mold, along with high-tension Pentecostal, charismatic, and non-denominational carriers, hold up best, while the mainline and the Southern Baptist Convention slide — the SBC nonetheless remaining the largest body. The center of gravity migrates toward non-denominational, charismatic, and Global-South-tied expression. The historiography follows: the chastened both/and synthesis is *extended and complicated* — made more global, more attentive to Black and gendered experience, more computational — rather than overturned. The Awakenings remain canonical as the origin point of a still-functioning revivalist order.\n\n**How this number was derived.** The two derivations that best survived cross-examination converge here. The base-rate-first path multiplies decline-not-collapse (~0.8, since 6 of 6 peer nations declined for more than 25 years once decline began) by form-survives (~0.95, since 0 of the major US families vanish in a generation) by paradigm-extends (~0.75), giving ~0.57. The driver-dominant path multiplies durable-drivers-persist (~0.85) by both/and-as-standard (~0.75) by leveling-holds (~0.8), giving ~0.51. The geometric-mean-of-odds of the two midpoints is ~0.50. This is then *lowered* to a 40-50% band, down from the initial 45-55%, because the contrarian's intact-cohort-gradient derivation (45% young vs. 62% old; change happening between cohorts, not within them) survived intact and transfers roughly 5-7 points into the steeper-slide scenario. The Manifold proxies (27% / 19%) sanity-check the band: both are consistent with slow, not cliff, decline.\n\n**Drivers.** Cohort-replacement secularization (Voas-Chaves) produces decline, but slowly. The communications family plus democratization keeps revival portable and networked — new-birth-as-method, the Asbury livestream, and Hatch's populist seizure of religious authority. The Finke-Stark church-sect cycle lets high-tension sects outlast the accommodating mainline, so the surviving core is revivalist by construction. Institutional inertia in the large traditions matters too — the SBC still counts 12.7M members despite 18 years of decline — as does the historical pattern of denominational inversion without tradition-death. Mature-subfield consensus is itself sticky: the both/and is already the weight of the evidence, and syntheses rarely flip in a single generation.\n\n**Conditions.** This path requires four things to hold. The post-2019 leveling stays a deceleration — not a hard floor, not a resumed steep slide. Non-denominational and charismatic planting supply does not collapse, so the form keeps finding new carriers. No demographic discontinuity reverses cohort decline and no curve-bending Fifth Awakening intervenes. And historiography stays in mature-synthesis mode, with no field-defining re-unifier or dissolver winning wide adoption.\n\n**Signals to watch.** Pew/PRRI/Gallup affiliation readings from 2027-2035 drifting slowly near 55-62% would confirm it; a cliff or a rebound would break it. Watch for the non-denominational plus Pentecostal/charismatic share rising while the mainline accelerates downward (form surviving via new carriers); the recurrence of Asbury-type livestreamed outpourings (the networked mechanism still firing); continued \"connected transatlantic movement\" both/and framing in citations and syllabi; and the SBC declining slowly but surviving as the largest body, baptisms ticking up even amid membership decline.\n\n**Time horizon.** Generational, through ~2045; the slope and the carrier-mix should be readable by roughly 2032-2035.\n\n### Scenario 2: Resumed Accelerated Slide and Synthesis Erosion\n\n**Probability: 25-35%.**\n\nHere the strongest version of the contrarian case fuses with base-rate-first's accelerated case: the post-2019 plateau proves a pause, not an equilibrium. Cohort replacement runs mechanically — high-share elders die and the ~45%-Christian young replace them — and the aggregate share resumes its decline toward the low-to-mid 50s% and plausibly into the 40s% by ~2045, with \"nones\" becoming a plurality and evangelicalism falling below 20% of adults. Revivalism survives as *form*, but as a shrinking subculture rather than the cultural center; the Religious-Right base ages out. The historiography is exposed too. This scenario carries an elevated risk of synthesis *erosion*: as living evangelicalism contracts, or as the computational and global/non-elite turns mature, the both/and is partially demoted, and skeptical \"construction\" or social-control readings (Butler, Lambert) along with the comparative/global lens gain standing.\n\n**How this number was derived.** Three derivations fed the number, weighted by survival. The contrarian decomposition takes P(gradient intact, no within-cohort re-religionizing) ~0.80 times P(intact gradient lowers the aggregate over a generation) ~0.85 = 0.68, self-discounted by its author to 40-50%. The base-rate-first view held the *same* outcome at only 15-22% — via P(accelerated decline ~0.45) times P(historiographic demotion given that ~0.4) ~0.18 — but cross-examination showed this required *both* halves to fire at once. The religion-only slide is higher-probability and more decision-relevant, so it is lifted above 22%. The outside view backs the move: 6 of 6 peer nations continued declining and roughly 0 of 6 produced a durable high plateau. The floor-versus-pause question is the central live disagreement, the between-cohort mechanism is the sharpest derivation on the table, and there is *no splitting the difference*. The band is set at 25-35% — above 22% (the conjunction understated the religion-only case) but below the contrarian's 40-50% (the real 2019-25 deceleration and the genuine uncertainty about whether the scholarship overturns cap it). The geometric mean lands near 0.28.\n\n**Drivers.** Cohort-replacement (between-cohort, not within-cohort) secularization running toward completion (Voas-Chaves, 5.14), since within-cohort re-religionizing is rare; the erosion of religious socialization as each cohort raises a less-religious next; the aging and contraction of the white-evangelical Religious-Right bloc, its backlash repelling the young; paradigm-turnover through computational/digital re-periodization and a global/non-elite decentering of the Edwards-Whitefield-Finney canon; and the closing of the \"American exception\" relative to the secular Anglosphere.\n\n**Conditions.** The 2019+ leveling must reverse by ~2030, with the 18-29 Christian share *not* recovering toward older cohorts. No compensating high-religiosity immigration or fertility offset arrives. And on the scholarship side, a computational or global turn must *overturn* rather than absorb the both/and.\n\n**Signals to watch.** The decisive confirmation would be GSS/Pew cohort tracking showing the youngest adult cohort entering *below* the prior cohort's entry level; conversely, any within-cohort re-religionizing — a cohort more Christian at 35 than it was at 25 — would refute it. Watch for the Christian share sustained sub-58% and then sub-50% before 2035, \"nones\" crossing ~35-40%, the evangelical share dropping below 20% of adults, the white-evangelical electorate aging, a computational study settling whether the Great Awakening existed as a unified event, two textbook editions dropping the both/and, and Australia's 2026 census \"No Religion\" result.\n\n**Time horizon.** Generational, through ~2045; the leveling-versus-floor question resolves around 2028-2034.\n\n### Scenario 3: Genuine Stabilization / Religious-Economy Floor\n\n**Probability: 18-28%.**\n\nThis is the \"US exception persists\" branch: the post-2019 leveling proves a genuine committed floor. Cohort decline stalls because the remaining religious population is a sticky, high-commitment, higher-fertility core — the marginal Christians have already exited — renewed by Global-South-origin immigration and convert retention, possibly with a small young-male uptick. Christian affiliation stabilizes in the high-50s/low-60s% through 2045, and the evangelical/Pentecostal share holds roughly flat as the mainline absorbs the losses. The Finke-Stark religious-economy mechanism — pluralism, upstart sects winning — keeps the revivalist core resilient. The historiography swings with it: this revalidates the Awakenings-as-anti-secularization / supply-side reading, the field leans back toward Finke-Stark framing, and the US becomes the standing counter-example again.\n\n**How this number was derived.** The estimate converges across base-rate-first (Leveling at 20-28%) and contrarian (Stabilization at 25-35%), bounded by the markets. A plateau is a strictly *weaker* claim than Manifold's \"affiliation increases\" (27% YES), so durable stabilization sits somewhat above the slide-implied mass while the 27% (and its ~73% not-rising complement) caps it. The outside view — roughly 0 of 6 peer nations produced a durable 25-year high plateau — holds this below the modal. Both views landed near or just above 27%, adjusted down for the generational horizon. The band is set at 18-28%, marginally below those estimates, because the contrarian's *own* strongest derivation, the intact between-cohort gradient, argues *against* a within-cohort floor; that puts its 25-35% in tension with its own modal and earns it lower weight. The geometric-mean-of-odds (~0.24, ~0.30) ~0.27, trimmed for that tension.\n\n**Drivers.** The selection effect — marginal Christians are already gone, leaving a high-commitment, self-reproducing core; differential fertility and stronger intergenerational retention among committed evangelicals and Pentecostals; religious-economy/supply-side vitality, with pluralism and high-tension sects out-recruiting (Finke-Stark); Global-South-origin immigration (Pentecostal/charismatic) reseeding US revivalism; and the democratization driver (Hatch) keeping the marketplace movement-generating.\n\n**Conditions.** The 2019+ leveling must be a real committed floor rather than a pause. Immigration must import religiously observant populations that do *not* assimilate down to native secular rates within a generation. And youth disaffiliation must not accelerate beyond the current trend, with within-cohort religiosity holding.\n\n**Signals to watch.** The decisive evidence would be two consecutive Pew/GSS readings that are flat-or-up among the youngest adult cohort, replicated across 2028-2038. Also watch for the \"nones\" share staying plateaued at ~28-31% rather than resuming growth, retention rates of children raised evangelical/Pentecostal rising rather than slipping, Pentecostal and immigrant-church growth offsetting mainline decline in aggregate, and a syllabus resurgence of Finke-Stark supply-side framing relative to Voas-Chaves cohort framing.\n\n**Time horizon.** Generational, through ~2045; the cohort evidence should be decisive by ~2030-2034.\n\n### Scenario 4: Revival Surge / Discontinuity Tail (Fifth Awakening or regime change)\n\n**Probability: 6-12%.**\n\nThis is a residual tail combining the upside and structural-break cases. The primary sub-case is a genuine, demographically consequential resurgence — not an Asbury-style attention episode but a movement that measurably raises participation and halts or reverses aggregate decline by ~2045, most plausibly Spirit-driven (Pentecostal/charismatic), networked and digital, possibly immigrant-led, and contemporaneously named a \"Fifth Great Awakening.\" The symmetric structural sub-case is a communications/epistemic regime change — AI-mediated meaning-making, or the collapse of the institutional church form — that breaks the print-and-itinerancy mechanism carrying revival since 1740 and produces a faster-than-secularization discontinuity. Either way, an event the field must scramble to interpret disrupts the both/and consensus; a surge would vindicate the \"awakening-cycle\" frameworks (McLoughlin, Fogel).\n\n**How this number was derived.** This is a reference-class frequency adjusted by the markets and discounted for discontinuity. Noticed revival episodes have arrived roughly once a generation for ~280 years (camp meeting → 1857-58 → Moody → Sunday → Graham → charismatic renewal → Asbury 2023), making *some* noticed episode near-certain — but only ~2 of the ~7 since 1800 measurably moved national adherence, so ~2/7 ~0.28 per opening, discounted hard for the secularizing backdrop. The driver-dominant view priced the symmetric structural-break union (mass-revival ~3-5% plus rupture ~3-5%) at ~5-10%. Market discipline applies: a curve-bending surge is a strict *subset* of \"affiliation increases,\" so it must sit below Manifold's 27%, and the Polymarket Jesus-return novelty (~2%) bounds the supernatural extreme. Base-rate-first (6-12%) and driver-dominant (5-10%) converge; the geometric mean is ~0.08. The band holds at 6-12%, heeding the long-peace caution against zeroing out a real recurrence class. It survived cross-examination intact.\n\n**Drivers.** The new-birth-as-method plus communications plus democratization cluster, making revival a repeatable and now-networked (potentially AI-amplified) method; global Pentecostal vitality (~600-644M) feeding back into the US via immigration and media; the Finke-Stark church-sect cycle producing an unusually large high-tension upstart at scale; and cultural-crisis catalysts — revival follows dislocation — together with the possibility of a genuine medium shift in how religious meaning is transmitted.\n\n**Conditions.** Either an Asbury-type episode that, unlike 2023, converts attention into *sustained* membership and institution-building, or a communications/epistemic rupture large enough to break the trend; a galvanizing cultural crisis or catalyst; and network amplification reaching a self-sustaining threshold.\n\n\n**Signals to watch.** A revival followed by *sustained* multi-year attendance and baptism increases in national data, not a viral moment — SBC and Pentecostal baptisms rising durably; real-time naming of a \"new awakening\" that survives more than one news cycle; an outpouring an order of magnitude beyond Asbury 2023 in reach, duration, and spread; AI-mediated religious practice or meaning-making reaching mass scale (a genuine medium shift); and youth-cohort religiosity inflecting upward, or any single survey wave with a greater-than-5-point non-linear swing.\n\n**Time horizon.** Generational, through ~2045; a true surge would show sustained data divergence within ~3-5 years of onset, while a rupture is unscheduled.\n\n## Base Rates\n\n**Western Protestant secularization.** Of roughly six major peer nations — the UK, Canada, Australia, the Netherlands, Scandinavia, and New Zealand — that entered cohort-driven decline, about 6 of 6 continued declining for more than 25 years once it began; Voas & Chaves (2016) place the US on the same curve. A durable 25-year high plateau is rare (~0 of 6). This anchors continued slow decline above 0.8 for the affiliation half and makes durable stabilization the low-probability branch. It is the most-cited evidence across all three views, and it is why the decline cluster holds the majority of the probability mass.\n\n**Cohort-replacement is between-cohort, not within-cohort.** The dominant Western secularization mechanism works by generational succession; within-cohort re-religionizing — a cohort getting *more* religious as it ages — is historically rare. The US 18-29 Christian share (~45%) sits well below the ~62% aggregate, an intact gradient that feeds through as elders die. This was the contrarian's load-bearing derivation; it survived cross-examination, and it is why Resumed Slide now sits above the base-rate-first view's original 15-22%.\n\n**Revivalist form survival across hosts (~280 years).** The deliberately produced outpouring has outlived its Calvinist origins and every successive carrier (Edwardsian → Methodist/Baptist → Moody/Sunday/Graham → Pentecostal → Asbury 2023). Zero of the large US denominational families vanished in a single generation — SBC 12.7M, Pentecostal ~644M, LDS 17.5M, SDA 23.7M all persist or grow. This anchors form-persistence at roughly 0.85-0.95, the reason every scenario keeps the revival *form* alive even where the aggregate share falls.\n\n**Denominational inversion without tradition-death.** Congregationalists fell from ~20.4% to ~4% of adherents between 1776 and 1850 while Methodists rose to ~34.2% — the dominant carrier was displaced within a few generations *without* the revival tradition dying. This grounds the carrier-migration thesis (toward non-denom/charismatic/Global-South) in the modal scenario.\n\n**Paradigm-turnover (preserved as historiography uncertainty).** Two readings stand unreconciled. The base-rate-first and driver-dominant view holds the \"chastened both/and\" as the weight of the evidence; mature syntheses overturn in ~25 years at roughly 1-in-4-or-5, so extension is the mode (~0.75). The contrarian view counters that reigning \"mature synthesis\" positions in early-American and religious history recentered *more often* than they persisted over ~20-year windows (~3 of 5, ~60%), discounted by P(overturn given a turn) ~0.4 to ~24% overturn. The gap is genuine
