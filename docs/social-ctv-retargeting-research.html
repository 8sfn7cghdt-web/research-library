confidence attribution [2].\n- **Probabilistic resolution** *infers* a link from circumstantial signals: shared home IP, devices seen together, postal co-location. Confidence is lower and banded — the same source cites \"0.4–0.7\" depending on signal strength — with use-case thresholds (suppression at 0.6+, brand targeting 0.7+, attribution 0.85+) [2]. (These specific confidence figures come from a single specialist explainer, GSDSI — Tier 5, treat as illustrative of how the industry reasons about confidence bands, not as a universal standard.)\n\nOn top of these sits the **household-resolution layer**, which answers *who lives together* using postal anchors, home-IP co-occurrence, and device co-location [2]. This is the layer that \"unlocks CTV attribution: living-room impression tied to kitchen-table mobile search\" [2]. When LiveRamp resolves individual IDs up to a household, \"only one household RampID is returned\" [8] — the many-to-one collapse that is both the point of household identity and its peril.\n\n**Exhibit B — the identity bridge, end to end:**\n\n```\n[SOCIAL PLATFORM]                    [IDENTITY GRAPH]                 [CTV / STREAMING]\n logged-in user                      deterministic +                  household screen\n engages with brand                  probabilistic match\n        |                                    |                                |\n   HEM (login email) ──────────────►  person-based ID  ◄──────────── CTV ID (ACR / SDK)\n   MAID (their phone) ─────────────►  (e.g. RampID)    ◄──────────── IP + geo (household)\n        |                                    |                                |\n        |                          household roll-up (1 ID)                   |\n        |                                    ▼                                |\n        └──────────────►  MATCH inside a DATA CLEAN ROOM  ◄──────────────────┘\n                         (neither side sees the other's raw user records)\n                                             |\n                                             ▼\n                          targetable household CTV impression\n                          + exposure log for measurement\n```\n\nThe most consequential feature of this diagram is the asymmetry at its two ends: the left end is an *individual* (a login), the right end is a *household* (a screen), and the graph's job is to bridge a gap it can never fully close. Section 6 returns to what that costs.\n\n---\n\n## 5. The Data Clean Room — the Load-Bearing Mechanism\n\nIf the identity graph is the wiring, the **data clean room** is the room the wiring runs through. A data clean room is a neutral, privacy-safe environment where two parties match and analyze their data *without either party seeing the other's raw, user-level records* [9]. The canonical use case is exactly the social-to-CTV pattern: \"Brand A loads its customer list, publisher B loads its exposure logs, and the clean room computes the overlap, the reach, the incremental conversions — then returns only aggregated numbers\" [9]. Substitute \"social platform\" for Brand A and \"streamer\" for publisher B, and you have the mechanism that makes the whole category legally tractable.\n\nIt is load-bearing for three reasons. First, **legal**: a social platform will not — and often, contractually and by regulation, *cannot* — hand raw user identities to Amazon or a streamer. The clean room lets LinkedIn's \"segment definitions activate against Amazon's hashed identity graph\" without LinkedIn \"selling raw data to Amazon\" [1]. Second, **commercial**: it lets each side keep its proprietary data while still transacting on the overlap — the streamer's audience value and the social platform's signal value both survive the match. Third, **technical**: it is where the graph's deterministic and probabilistic matching actually executes on two real datasets.\n\nThe vendor landscape and its recent consolidation are a going-concern story in their own right. The major venues are the cloud platforms' native clean rooms — **AWS Clean Rooms**, **Snowflake**, Google Cloud — plus identity-led vendors. **LiveRamp acquired Habu in 2024**, and **WPP/GroupM acquired InfoSum in 2025** [9] — two of the best-known independent clean-room startups swallowed, thinning the field of \"truly neutral options\" [9]. AdExchanger's 2025 read is that the standalone clean-room *category* effectively dissolved into infrastructure: clean rooms \"didn't disappear — they became invisible infrastructure,\" absorbed into \"platform interoperability,\" \"data collaboration,\" and retail-media plumbing, with the cloud platforms and walled gardens capturing \"most of the actual revenue gains\" [10]. The IAB Tech Lab has moved to standardize the matching step itself. Its early **Open Private Join and Activation (OPJA)** specification described how two parties match and then activate a matched audience using privacy-enhancing technologies (PETs), but OPJA was deprecated on 25 October 2024 and superseded by the **PAIR (Publisher Advertiser Identity Reconciliation)** protocol, now the designated IAB standard for private match-and-activate via PETs [11] — the closest thing to a neutral technical primary for how the match is supposed to work.\n\n**Going-concern status confirmations (present-tense claims, each dated):**\n\n- **AWS Clean Rooms / Amazon Marketing Cloud (AMC)**: AMC is Amazon's clean-room analytics environment built on AWS Clean Rooms; Amazon **expanded AMC access to all sponsored-ads advertisers, at no cost, announced September 2025** [12][13] — a material lowering of the cost barrier that had confined clean rooms to large advertisers [9]. Confirmed live as of the September 2025 announcement [13].\n- **LiveRamp Clean Room**: marketed as cloud-native across AWS, Azure, GCP, Snowflake, and Databricks with person- and household-level activation [9]. Confirmed live in 2025 vendor documentation [9].\n- **LinkedIn CTV Ads via Amazon DSP**: **launched May 7, 2026**, activating LinkedIn's first-party professional signals (job title, industry, seniority, 1B+ members) on streaming inventory via Microsoft Monetize, matched against Amazon's identity graph [1]. Confirmed live by Amazon's own newsroom as of that date [1]; The Trade Desk was named LinkedIn's *first* programmatic CTV DSP partner earlier in 2026, Amazon the second [1].\n\n---\n\n## 6. The Critical Fault Lines\n\nA McKinsey brief earns its keep at the joints. Three of them bear the load and all three are cracked.\n\n### 6a. Household-vs-Individual Mismatch\n\nThis is the original sin of CTV identity. The social platform targets an *individual* — a logged-in professional, a specific Pinterest saver. The CTV ID it lands on is a *household* [2]. When the ad serves, \"multiple people in a home may see ads intended for one person, limiting precision compared to individual-level digital targeting\" [14]. A LinkedIn ad meant for a VP of Procurement reaches whoever is on the living-room couch. The mismatch runs in reverse for measurement too: a household exposure gets attributed to an individual's later conversion via a \"deterministic MAID/HEM crosswalk\" [2], and every error in that crosswalk becomes an error in the reported result. No amount of graph sophistication removes this. It is inherent in using a household screen to reach an individual — and it is why CTV is honestly an upper-funnel, household-reach medium wearing performance-marketing clothes.\n\n### 6b. Match-Rate Decay and Leakage\n\nMatch rates are where vendor decks and operating reality diverge. The ranges, sourced:\n\n- **Authenticated publisher ↔ CRM**: high, because both sides hold rich PII; brands are \"used to match rates of 60–80% with Google or Meta\" precisely because those platforms have a near-complete PII view [15].\n- **Blind CRM ↔ publisher overlap** in a neutral clean room: commonly \"around 50%,\" with a wider \"20% to 40%\" range cited depending on data quality and overlap [15].\n- **Unauthenticated CTV via IP**: LiveRamp's own GM cites **40–70%** (\"mid to high range\") for matching unauthenticated CTV viewers, achieved by \"using the IP as a replacement for a hashed email\" [4].\n\nTwo dynamics erode these numbers over time. **Decay**: retargeting audiences have a short half-life — \"browse intent has a short half-life, cart intent can be hours or days, and lapsed-customer cohorts move weekly\" [14] — and MAID churn means graphs need *weekly* refresh; \"quarterly refresh underperforms\" [2]. **Leakage and lag**: every onboarding hop \"add[s] lag, data loss, and sometimes a lower match rate\" [14], and clean-room misconfiguration \"can create new [problems]\" including \"leakage risk, unauthorized sharing, governance gaps\" [14]. A quieter concern is **match-rate inflation**: vendors boost low rates with a third-party \"identity bridge\" to create a \"three-way match\" [15], and tools like InfoSum/Acxiom's \"Match Multiplier\" report \"a 40% incremental lift in matching\" — but even that source concedes the figure \"could be lower or higher depending on the data sets\" and that rates remain \"pretty low and sometimes inaccurate\" [16]. A higher *reported* match rate leaning on a third-party graph is partly a projection, not purely a direct overlap — a distinction the buyer rarely sees.\n\n### 6c. The Non-Click Problem and Measurement Circularity\n\n**CTV has no click.** A viewer sees an ad on the television, then — maybe — converts later on a phone, a laptop, or in a store. Last-touch/last-click attribution \"collapse[s] immediately\" because \"viewers don't click, browse, or convert in-session\" [17]. The industry fills the gap with three patches, each carrying a catch:\n\n- **View-through attribution** credits a conversion to a household that was *exposed* (not clicked) within a window. It is directional at best; the guidance itself warns that \"if view-through conversions rise but lift is flat,\" the window is too loose and the credit is spurious [17]. View-through is the mechanism most prone to over-crediting.\n- **Incrementality testing** is the cleanest method: split audiences into an exposed *test* group and a withheld *control* group and attribute the difference to the campaign [17]. It measures *causal* lift rather than correlational credit — but it requires holdouts (forgone reach), scale, and clean execution.\n- **Marketing-mix modeling (MMM)** regresses outcomes on spend across channels while controlling for trend and seasonality, needing no test/control split [17]. It captures CTV's diffuse, upper-funnel effect but is coarse, slow, and cannot resolve individual exposures.\n\nThe structural problem underneath all three is **circularity**. In a walled-garden or self-attributed setting, \"every platform grades its own homework,\" so \"a single conversion might be claimed by two or three platforms at once\" [18]. CTV data sits in \"publisher-specific silos, each with proprietary methodology — Netflix measures one way, Hulu another\" — and \"when attribution models from different platforms conflict, there is no neutral arbiter\" [18]. The circularity bites hardest exactly where social-to-CTV lives: the same walled garden (Amazon, LinkedIn-via-Amazon) can supply the audience, serve the impression, *and* measure the outcome inside its own clean room — a closed loop in which the seller substantially marks its own homework. Incrementality is the discipline that breaks the loop, which is why sophisticated buyers treat view-through as directional and validate everything against a holdout [17][18].\n\n---\n\n## 7. The Retargeting Flow, End to End\n\nNow put the pieces in motion. Here is the practical path by which a social engager becomes a targetable household CTV impression — the exhibit-worthy walkthrough.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: how a phone engager becomes a household TV impression<\/div><div class=\"viz-flow\"><span class=\"flowstep cv-fade\" style=\"--d:0.00s\">Signal capture (logged-in engagement → HEM / MAID)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.08s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.16s\">Audience definition (e.g. &#x27;VP+, software&#x27;)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.24s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.32s\">Identity-graph resolution → household (IP bridge)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.40s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.48s\">Clean-room match vs. streamer audience (~50%)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.56s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.64s\">DSP activation (Amazon DSP / Trade Desk)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.72s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.80s\">CTV impression to the household<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.88s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.96s\">Exposure logged (ACR / streaming logs)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:1.04s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:1.12s\">Measured by incrementality — no click<\/span><\/div><figcaption>The social-to-CTV retargeting bridge. The largest match/precision losses sit at resolution and the clean-room match (~50% blind, 40–70% unauthenticated); the measurement break sits at the end, where there is no click. <span class=\"credit\">Source: Synthesized from Claims 2.14–2.19.<\/span><\/figcaption><\/figure>\n\n\n\n1. **Signal capture.** A user, logged into LinkedIn / Pinterest / Reddit, engages with a brand's content, or lands on the brand's site via social where \"a retargeting pixel captures the user's data\" [19]. The platform now holds a first-party signal keyed to that authenticated user (HEM spine, possibly a MAID).\n2. **Audience definition.** The brand or platform defines the retargeting audience — e.g. \"engaged with the campaign,\" or a LinkedIn segment of \"VP+, software industry\" [1]. On the social side this is deterministic and rich.\n3. **Onboarding / resolution.** The audience is resolved through the identity graph: HEM/MAID → person-based ID → household roll-up, with IP as the CTV-side bridge [4][5][8]. This is the step that \"add[s] lag, data loss, and sometimes a lower match rate\" [14].\n4. **Clean-room match.** Inside a clean room (AWS/AMC, Snowflake, LiveRamp), the social audience is matched against the streamer's authenticated audience and/or the DSP's identity graph. LinkedIn's \"segment definitions activate against Amazon's hashed identity graph\" without raw-data transfer [1]. Only matched, aggregated audiences and, later, aggregated results leave the room [9].\n5. **Activation.** The matched household audience is pushed to a DSP (Amazon DSP, The Trade Desk) and served as a CTV impression against streaming inventory when a matched household opens an ad-supported app [1][19]. The user who engaged on a *phone* is now reached on the *television* — as a household.\n6. **Exposure logging + measurement.** ACR and streaming logs record the household exposure [6][7]. The conversion — which happens with **no click**, elsewhere and later — is tied back through the household crosswalk and evaluated via view-through (directional), incrementality (causal), or MMM (aggregate) [17].\n\n**Where the match rates and leakage are, in the flow:** the biggest drop-offs come at **step 3** (onboarding/resolution loss) and **step 4** (the overlap match itself — ~50% blind, 40–70% unauthenticated CTV) [4][14][15]. The biggest *precision* loss is the household roll-up in step 3 that persists through activation in step 5 (Section 6a). The biggest *measurement* distortion sits at step 6, where the non-click problem and self-attribution circularity live (Section 6c). A brief that reported only step 5's reach would be hiding the losses at 3, 4, and 6.\n\n---\n\n## Open Questions\n\n1. **How much of a \"match rate\" is direct overlap versus third-party projection?** Vendors blend direct matches with identity-bridge \"multipliers\" [16]. The buyer sees one number; the composition — and thus the reliability — is opaque. No neutral standard forces disclosure of the split.\n2. **Does PAIR (and clean-room standardization generally) actually deliver interoperability, or does it entrench the cloud incumbents?** IAB Tech Lab's private match-and-activate standard is real (PAIR, having succeeded the deprecated OPJA in late 2024) [11], but AdExchanger argues the economics flow to AWS/Snowflake/walled gardens regardless [10]. Standardization of the *interface* may coexist with concentration of the *value*.\n3. **What is the real, independently measured incremental lift of social-to-CTV retargeting?** Almost all published lift figures originate with an interested party (the platform, the DSP, or a measurement vendor it selected). A clean, third-party, holdout-based read across multiple platforms is largely absent from the public record as of mid-2026.\n4. **How stable is the ACR installed base as a measurement census?** ACR-on-by-default across six brands [6] is a present-tense fact vulnerable to regulation (privacy suits, opt-out mandates) and manufacturer policy. If opt-out rates rise materially, the census thins.\n5. **Does household-level targeting survive privacy regulation intact?** The IP-as-household-key mechanic [4] is central and also legally exposed; a ruling that treats household IP as personal data under a stricter regime would strike at the plumbing's foundation.\n6. **Where exactly does the individual→household imprecision cap performance-marketing claims?** The industry sells CTV retargeting as performance media, but the household mismatch [2][14] arguably ceilings it as reach media. The honest performance ceiling is under-quantified.\n\n---\n\n## Sources\n\n1. Amazon Ads, \"LinkedIn CTV Ads are now available through Amazon DSP,\" Amazon Ads Newsroom, 2026-05-07. https://advertising.amazon.com/library/news/linkedin-ctv-ads-amazon-dsp — *Tier 1 (primary, vendor newsroom). Primary evidence for the launch, date, and mechanic (\"segment definitions activate against Amazon's hashed identity graph,\" \"not selling raw data\"). Vendor source; treat product-benefit language as claim, not proof.* Corroborated by Marketing Dive and eMarketer (Tier 4/5). Accessed 2026-06-30.\n2. GSDSI, \"Identity Graphs 101: MAID to HEM, CTV IDs, and Household Resolution.\" https://www.gsdsi.com/resources/identity-graphs-101-maid-to-hem-ctv-ids-and-household-resolution — *Tier 5 (specialist explainer, lean: vendor/education). Best single decode of the four signals, deterministic vs. probabilistic confidence bands, household resolution, and the match-rate-decay/individual-mismatch limits. Confidence figures (0.95+, 0.4–0.7) are illustrative, single-source.* Accessed 2026-06-30.\n3. LiveRamp, \"The Trouble with Hashed Emails (HEMs).\" https://liveramp.com/blog/the-trouble-with-hashed-emails-hems — *Tier 5/6 (vendor blog with commercial interest in a HEM alternative). Position-evidence for HEM reversibility, fragility, and the 44%-higher-RampID-match claim. Read the RampID advocacy as marketing; the reversibility mechanism is corroborated by the broader security literature.* Accessed 2026-06-30.\n4. AdExchanger, \"How LiveRamp Connects The Many Dots Of Identity On TV\" (interview, Allison Metcalfe, GM LiveRamp TV). https://www.adexchanger.com/digital-tv/how-liveramp-connects-the-many-dots-of-identity-on-tv/ — *Tier 5 (analytical trade press). Source for \"IP as a replacement for hashed email, CTV ID as a replacement for the cookie,\" the 40–70% unauthenticated match rate, and the networks-resist-sharing business obstacle.* Accessed 2026-06-30.\n5. LiveRamp, \"Platform Guide to Connected TV Targeting and Measurement,\" LiveRamp Docs. https://docs.liveramp.com/connect/en/platform-guide-to-connected-tv-targeting-and-measurement.html — *Tier 1/5 (vendor technical documentation). Primary for the IP-only-for-CTV-matching rule, IPv4-over-IPv6 guidance, HEM truth-set, and 2–3 week graph lead time.* Accessed 2026-06-30.\n6. Wikipedia-adjacent + smarttvs.org / versus.com aggregated ACR explainers (used only for the mechanic, not for a contested fact). https://en.wikipedia.org/wiki/Automatic_content_recognition ; https://smarttvs.org/disable-acr-tracking-smart-tv/ — *Tier 5/7 (explainers). Used for the Shazam-style fingerprinting mechanic, 15–60s cadence, HDMI capture, and the six-brands-on-by-default claim. The sampling cadences and default-on status should be corroborated against manufacturer docs; treat cadence figures as approximate.* Cadence corroborated in part by Samsung [7]. Accessed 2026-06-30.\n7. Samsung, \"Samsung Smart TV Automatic Content Recognition (ACR) Feature,\" Samsung Support. https://www.samsung.com/us/support/answer/ANS10010616/ — *Tier 1 (manufacturer primary). Samsung's own definition of ACR: \"signatures,\" viewing history, Personalized Service ID + IP, opt-out, \"does not record or watch content.\" The best primary anchor for what ACR is.* Accessed 2026-06-30.\n8. LiveRamp, \"Identity and Identifier Terms and Concepts\" / RampID documentation. https://docs.liveramp.com/connect/en/identity-and-identifier-terms-and-concepts.html — *Tier 1/5 (vendor technical docs). Source for RampID as person/household pseudonymous ID, partner-specific tokenization, longitudinal graph, and \"only one household RampID is returned\" on roll-up.* Accessed 2026-06-30.\n9. eMarketer, \"FAQ on data clean rooms,\" and LiveRamp \"Top Data Clean Room Use Cases\" + AdMonsters/DigitalApplied clean-room guides. https://www.emarketer.com/content/faq-on-data-clean-rooms-how-retail-media-driving-adoption-marketers-demand-proof ; https://liveramp.com/blog/top-data-clean-room-use-cases-for-modern-marketers — *Tier 5 (analytical / vendor). Source for the canonical clean-room use case (Brand A list ↔ Publisher B exposure logs ↔ aggregated overlap), LiveRamp/Habu 2024 and WPP/InfoSum 2025 acquisitions, cloud-native venues, and thinning of neutral options.* Accessed 2026-06-30.\n10. AdExchanger, \"Why 2025 Marked The End Of The Data Clean Room Era.\" https://www.adexchanger.com/measurement/why-2025-marked-the-end-of-the-data-clean-room-era/ — *Tier 5 (analytical trade press). Argument that clean rooms became \"invisible infrastructure\" absorbed into cloud platforms and retail media, with incumbents capturing the revenue. Framing/opinion; cite as analysis.* Accessed 2026-06-30.\n11. IAB Tech Lab, PAIR (Publisher Advertiser Identity Reconciliation) — the private match-and-activate standard that superseded Open Private Join and Activation (OPJA, deprecated 25 Oct 2024); Seller-Defined Audiences / Curated Audiences specifications; ID-Less Solutions Guidance v1.0 (Nov 2024). https://iabtechlab.com/wp-content/uploads/2024/11/ID-Less-Solutions-Guidance-Version-1.0-PUBLIC-COMMENT.pdf — *Tier 1 (standards body primary). Source for PAIR/OPJA as a clean-room matching/activation standard using PETs, SDA/Curated Audiences for CTV/OTT addressability, and the framing of signal loss as the driving problem.* Accessed 2026-06-30.\n12. AWS, \"Plan your advertising campaigns with Amazon Marketing Cloud on AWS Clean Rooms, now generally available,\" AWS Blog. https://aws.amazon.com/blogs/aws/plan-your-advertising-campaigns-with-amazon-marketing-cloud-on-aws-clean-rooms-now-generally-available/ — *Tier 1 (vendor primary). Confirms AMC is built on AWS Clean Rooms and its match/create-audience/activate flow.* Accessed 2026-06-30.\n13. Amazon Ads, \"Sponsored ads advertisers can now access Amazon Marketing Cloud\" / \"Expanding AMC eligibility,\" Amazon Ads Newsroom, Sept 2025. https://advertising.amazon.com/library/news/amc-for-sponsored-ads — *Tier 1 (vendor primary). Confirms the Sept 2025 free-AMC-for-sponsored-ads expansion — the going-concern status and cost-barrier removal.* Accessed 2026-06-30.\n14. Taboola / StackMatix / AI Digital CTV-retargeting and challenges guides. https://www.taboola.com/marketing-hub/ctv-performance-campaigns-challenges/ ; https://www.stackmatix.com/blog/ctv-targeting-capabilities-2026 — *Tier 5 (vendor/analytical explainers). Source for onboarding lag/data-loss, audience decay half-lives, household-vs-individual precision loss, and clean-room misconfiguration/leakage risk. Vendor lean; used for well-established operational limitations.* Accessed 2026-06-30.\n15. Digiday + growthjockey/decentriq clean-room match-rate discussions. https://digiday.com/marketing/multiplier-effect-lower-match-rates-in-data-clean-rooms-are-being-given-a-much-needed-boost/ — *Tier 5 (analytical trade press / vendor). Source for ~50% average and 20–40% ranges on blind clean-room matches, 60–80% Google/Meta benchmark, and the three-way-match / identity-bridge boost mechanic.* Accessed 2026-06-30.\n16. Digiday, \"'Multiplier effect': Lower match rates in data clean rooms are being given a much-needed boost.\" https://digiday.com/marketing/multiplier-effect-lower-match-rates-in-data-clean-rooms-are-being-given-a-much-needed-boost/ — *Tier 5 (analytical trade press). Source for InfoSum/Acxiom Match Multiplier \"40% incremental lift,\" and the explicit caveat that figures \"could be lower or higher\" and rates remain \"pretty low and sometimes inaccurate\" — the match-rate-inflation critique.* Accessed 2026-06-30.\n17. Prescient AI / fusepoint / tvScientific / Simulmedia CTV incrementality-and-measurement guides. https://prescientai.com/blog/leading-tools-for-measuring-incremental-lift-from-ctv-ads ; https://fusepointinsights.com/blog/ctv-measurement-incrementality-brand-lift-roi/ — *Tier 5 (vendor/analytical explainers). Source for the non-click problem, MTA/MMM/incrementality/view-through methods, \"treat view-through as directional,\" and the test/control lift design. Vendor lean (incrementality vendors); cite as method-explanation.* Accessed 2026-06-30.\n18. eMarketer + AI Digital + VideoWeek walled-garden measurement critiques. https://www.emarketer.com/content/inside-walled-gardens-long-standing-challenge-of-ad-measurement-attribution ; https://www.aidigital.com/blog/alternatives-to-walled-garden ; https://videoweek.com/2026/05/20/tv-companies-need-to-stop-seeing-measurement-as-a-box-ticking-exercise-to-compete-with-walled-gardens/ — *Tier 5 (analytical). Source for \"grading their own homework,\" a single conversion claimed by 2–3 platforms, publisher-specific silos, and \"no neutral arbiter\" — the measurement-circularity critique.* Accessed 2026-06-30.\n19. tvScientific, \"CTV Retargeting: A Guide for Performance Marketers.\" https://www.tvscientific.com/insight/retargeting-on-ctv — *Tier 5 (vendor explainer, direct commercial interest as a CTV performance platform). Source for the web/social-to-TV and TV-to-web retargeting flows, retargeting pixel → household identifier match, and cross-device identity-graph tie. Vendor lean; used for the flow mechanic, not for performance claims.* Accessed 2026-06-30."}, {"order": 3, "file": "03_LinkedIn_B2B_to_CTV.md", "title": "LinkedIn's Social-to-CTV Play — B2B Audiences on the Big Screen", "summary": "", "body": "# LinkedIn's Social-to-CTV Play — B2B Audiences on the Big Screen\n\n## Bottom Line\n\nLinkedIn is the clearest case of a demand-side social platform extending its first-party audience onto Connected TV — and it got there by selling not inventory but *identity*. Its CTV Ads product went generally available across the US and Canada in spring 2026, layering LinkedIn's professional graph (job title, industry, seniority, drawn from a member base LinkedIn states exceeds one billion) onto streaming inventory from Paramount, NBCUniversal, Roku, and Samsung. A premium tier, **CTV Select**, runs curated Paramount+ and NBCUniversal inventory for managed accounts. The strategic pivot came in 2026, when LinkedIn opened the plumbing to third-party demand: The Trade Desk (March 18, 2026) became its first programmatic CTV DSP partner, and Amazon DSP followed on May 7, 2026, timed to Amazon's TV upfront. Under the hood, every one of these deals flows through **Microsoft Monetize** — the SSP Microsoft inherited from Xandr, which lost its captive demand when Microsoft shut its Invest DSP on February 28, 2026. That makes the LinkedIn-data-on-CTV program as much a survival bet for Monetize as a growth play for LinkedIn.\n\nThe thesis is genuinely distinctive. B2B's long sales cycles, seven-figure account values, and hard-to-reach titles make declared, first-party professional identity more valuable than the household demographics CTV was built on. The case studies LinkedIn cites are strong — Salesforce reported 4x the on-target impressions of linear TV and 70%+ unique reach; ServiceNow reported a 19% awareness lift and 45% lift in lead submissions — though every headline figure traces to LinkedIn's own marketing and should be read as vendor-attested, not independently audited. The load-bearing skepticism is structural: a CTV impression resolves to a *household*, while LinkedIn targeting is an *individual professional*, so \"reach the CFO on their smart TV\" is partly a probabilistic, brand-halo story rather than a deterministic one-to-one hit. Notably, LinkedIn's own documentation says the DSP program relies on member declarations routed as PMP deal IDs — *not* IP-based household graphs — which sharpens the mismatch question rather than resolving it. Add B2B's measurement difficulty (no clicks, buying-committee attribution) and a live competitive threat — Amazon's own B2B ad ambitions — and the honest read is this: LinkedIn credibly extends onto the big screen and owns a defensible data asset, but the incremental-value claim rests on brand lift and reach metrics that are real but vendor-framed. The household-vs-individual gap is the thing most likely to bound how far this goes.\n\n---\n\n## 1. What LinkedIn Actually Shipped — the Product\n\n### The answer, first\n\nIf you are a B2B marketer asking \"can I now buy streaming TV against LinkedIn's professional targeting?\" — the answer as of mid-2026 is **yes, in the US and Canada, through several routes**: directly in LinkedIn Campaign Manager, or programmatically via The Trade Desk, Amazon DSP, or Microsoft Advertising. A premium curated tier (CTV Select) exists for managed accounts. This is a live, generally-available product, not a pilot.\n\n### From beta to general availability\n\nLinkedIn entered CTV ad buying with a beta test in 2025 — what AdExchanger called \"its first beta test into the CTV ad buying space\" [1]. Those ad formats reached **general availability across the US and Canada** in spring 2026; AdExchanger, writing in 2026, put GA at \"a few weeks ago\" relative to publication and noted expanded reach into Paramount and new VAST-tag integrations [1]. LinkedIn's own help documentation confirms the product is \"currently limited to the United States and Canada, with English-language audience targeting\" [2].\n\n*(Going-concern note: GA in US/Canada is confirmed by LinkedIn's own product help page accessed June 2026 [2] and corroborated by AdExchanger's 2026 reporting [1]. This is a present-tense status claim with recent Tier 1 + Tier 5 support.)*\n\n**What the product is.** LinkedIn describes CTV Ads as a way to \"reach your audience on a large-screen experience\" using first-party professional data, delivered through streaming content on Smart TVs, streaming devices, and gaming consoles [2]. Campaigns run under the **Brand Awareness objective with Maximum Delivery bidding**; advertisers can build custom block lists, allow lists, or exclude IAB categories for brand safety [2]. That objective constraint is itself telling — the product is architected for upper-funnel brand building, not click-driven performance, a point that matters for the skepticism section.\n\n### Publisher partners\n\nLinkedIn distributes through what it calls the **LinkedIn Audience Network** for CTV, plus named premium publishers. Reporting and product pages identify **Paramount, Paramount+, NBCUniversal, Samsung Ads, and Roku** as distribution partners [1][2]. Marketing Dive's coverage of the Amazon route additionally lists Netflix, Tubi, and Comcast as inventory reachable in the broader Amazon DSP streaming environment (that is Amazon's supply, not necessarily LinkedIn-Select supply) [3].\n\n### CTV Select — the premium tier\n\n**CTV Select** is LinkedIn's curated, higher-priced solution. Per LinkedIn's help documentation, it is an \"exclusive partnership option [that] allows advertisers to work directly with either NBCUniversal or Paramount\" [2]. AdExchanger describes it as curated premium inventory carrying \"higher upfront pricing\" and featuring \"higher-quality shows from Paramount+ and NBCUniversal, among other publishing partners\" [1].\n\nOne access constraint matters for the going-concern read: LinkedIn states that **\"CTV Select is currently only available to LinkedIn managed accounts with a dedicated representative\"** [2]. It is not a self-serve product. That gates it to larger, agency-supported or enterprise advertisers, and it tells you LinkedIn is positioning CTV Select as a white-glove, upfront-style buy rather than a long-tail programmatic one.\n\n*(Going-concern note: CTV Select's live status, its Paramount/NBCUniversal inventory, and its managed-account-only access are all sourced to LinkedIn's own help page accessed June 2026 [2] and corroborated by AdExchanger [1]. Present-tense; recent.)*\n\n### Table: the product at a glance\n\n| Attribute | Status (as of mid-2026) | Source |\n| --- | --- | --- |\n| CTV Ads general availability | Live, US + Canada, English-only | LinkedIn Help [2]; AdExchanger [1] |\n| Objective / bidding | Brand Awareness / Maximum Delivery | LinkedIn Help [2] |\n| Named publishers | Paramount, Paramount+, NBCUniversal, Samsung Ads, Roku | LinkedIn Help [2]; AdExchanger [1] |\n| CTV Select | Live; curated Paramount+/NBCU; managed accounts only | LinkedIn Help [2] |\n| DSP routes | The Trade Desk, Amazon DSP, Microsoft Advertising | TTD [4]; Amazon Ads [5]; ppc.land [6] |\n| SSP (all routes) | Microsoft Monetize | ppc.land [6][7]; Amazon Ads [5] |\n\n---\n\n## 2. Decoding the Jargon (plain-English glossary)\n\nBecause the register is a McKinsey brief, here is the decoder ring before the analysis leans on these terms.\n\n- **CTV (Connected TV):** ads served inside streaming video on an internet-connected television — Paramount+, Peacock, Roku, Samsung TV Plus, etc. The screen is a TV; the delivery is digital.\n- **DSP (Demand-Side Platform):** the software an advertiser or agency uses to buy ad inventory programmatically. The Trade Desk and Amazon DSP are DSPs. Think of it as the \"buy button.\"\n- **SSP (Supply-Side Platform):** the software a publisher uses to sell its inventory. **Microsoft Monetize** is the SSP here. Think of it as the \"sell button.\" Every LinkedIn-CTV deal, regardless of which DSP presses buy, passes through this one sell-side pipe.\n- **PMP / Deal ID (Private Marketplace deal):** a pre-negotiated, invitation-only programmatic deal encoded as a numeric \"Deal ID.\" LinkedIn packages its audience + CTV inventory into a Deal ID that a buyer's DSP is entitled to bid on. It is how curated data gets activated without exposing the underlying member records.\n- **ABM (Account-Based Marketing):** the B2B discipline of targeting a defined list of high-value *accounts* (companies) — and the buying committee within them — rather than a broad demographic. LinkedIn's company/industry facets are the native language of ABM.\n- **Firmographics:** company-level attributes (industry, company size, revenue) — the B2B analogue of consumer demographics.\n- **Full-funnel:** running awareness (top), consideration (mid), and conversion (bottom) campaigns in one coordinated buy — Amazon's framing for why a marketer would want LinkedIn CTV inside Amazon DSP.\n\n---\n\n## 3. The Amazon DSP Partnership (May 2026) — the Headline Event\n\n### What was announced\n\nOn **May 7, 2026**, Amazon Ads and LinkedIn announced that advertisers can reach professional audiences with LinkedIn's CTV Ads through **Amazon DSP** [5]. Amazon's own newsroom is the primary source: the solution \"brings LinkedIn's first-party audience signals from more than one billion members — including job title, industry, and seniority — to streaming TV inventory through Microsoft Monetize,\" available via **deal-based buying** to **U.S.-based advertisers** [5].\n\n*(Going-concern note: This is the load-bearing partnership claim for this section. Source: Amazon Ads newsroom, dated May 7, 2026 [5] — Tier 1 for what Amazon claims — corroborated by Marketing Dive [3], Campaign US [8], ChannelX, and eMarketer [9]. Present-tense, well within window.)*\n\n### The one-buy pitch\n\nThe commercial hook is consolidation — one campaign instead of two. Per Amazon Ads, advertisers can \"activate LinkedIn Ads audiences on CTV alongside Amazon audiences within the same campaign, without fragmenting their media buy\" [5]. For a marketer already running full-funnel campaigns on Amazon DSP across streaming TV, display, online video, and audio, LinkedIn targeting becomes a new layer inside an existing workflow rather than a separate silo [5][9]. (One caveat worth flagging: Marketing Dive's read was more cautious, noting the coverage \"doesn't explicitly claim users can merge LinkedIn and Amazon audiences in a single interface\" [3] — so treat \"one buy\" as Amazon's framing of workflow consolidation, not a verified claim of literal audience-set merging.)\n\n### The executives on record\n\n- **David Roter**, LinkedIn's senior director / head of global agencies and video solutions: *\"B2B marketers want to reach decision-makers where they're spending time — and streaming TV is an essential part of that mix.\"* [5][3]\n- **Chris Conetta**, an Amazon Ads director: *\"Advertisers are building full-funnel strategies on Amazon DSP, and they want more ways to reach the audiences that matter most.\"* [5]\n\n### The timing tell\n\nThe announcement landed days before Amazon's **third annual TV upfront** (May 11, 2026, at New York's Beacon Theatre) [8]. Amazon's ad business is the strategic context: it generated **$17.2 billion in ad revenue in Q1 [2026], up 22% year over year** [10]. That figure explains why Amazon is aggressively adding differentiated demand — like LinkedIn's B2B data — to its DSP ahead of the upfront selling season.\n\n*(Note: the $17.2B / +22% figure appears in MediaPost's upfront coverage attributed to Amazon's earnings [10]; it is a company-reported financial figure. Treat as Amazon-reported, Tier 1-adjacent; a 10-Q/earnings-release confirmation was referenced but not read directly — flagged as a gap-fill seed.)*\n\n### Where Amazon DSP sits in the partner sequence\n\nAmazon DSP is the **second** programmatic DSP partner. **The Trade Desk was first**, announced **March 18, 2026**, and explicitly described by The Trade Desk as LinkedIn's \"first demand-side platform partner for connected-TV ads\" [4]. A third route — **Microsoft Advertising itself** — was added around **May 14, 2026**, giving a native Microsoft path without reviving the shuttered Invest DSP [6]. So as of mid-2026, three DSPs activate LinkedIn CTV deals: **The Trade Desk, Amazon DSP, and Microsoft Advertising** [6].\n\n---\n\n## 4. The Mechanics — How Professional Identity Reaches a Television\n\nThis section separates the marketing story from the plumbing. The clearest primary-adjacent account comes from ppc.land's reporting on LinkedIn's own Help Center documentation and the Microsoft Monetize integration [6][7].\n\n### The three-way architecture\n\nThe arrangement is described as precisely interdependent: **\"LinkedIn supplies the audience signals, Microsoft Monetize supplies the CTV inventory, and Amazon DSP is the buy-side platform that executes the transaction. None of the three components is interchangeable\"** — with one correction from the multi-DSP follow-up: the *DSP* is interchangeable (TTD, Amazon, or Microsoft), but **\"every CTV campaign that combines LinkedIn audiences with streaming inventory under this program flows through Microsoft Monetize on the supply side. The DSP is interchangeable. The SSP is not\"** [6][7].\n\n### The data-fusion flow\n\nPer ppc.land's read of LinkedIn's documentation [6]:\n\n1. LinkedIn builds audience segments from **\"approved professional facets based on members' setting preferences\"** — job title, industry, seniority, function, and company category.\n2. LinkedIn creates **private marketplace (PMP) deals in Microsoft Curate**, encoding the LinkedIn audience together with CTV inventory.\n3. The deal is routed to the buyer's DSP account as a **Deal ID**.\n4. The buyer activates the Deal ID in their DSP; **buyers never access individual member data**.\n\n**Operational requirements** reported for external-DSP routes [6]:\n- **Deal ID generation:** up to five business days.\n- **Minimum spend:** **$50,000 over 30 days** (external DSP routes).\n- **Minimum audience:** **one million members**.\n- **Buyer setup:** provide DSP Seat Name and Seat ID to LinkedIn representatives.\n- **Geography:** US-only for the DSP pathways; the Campaign Manager direct route additionally includes Canada.\n\n*(Single-source flag: the $50,000/30-day minimum, the 1-million-member audience floor, and the five-business-day Deal ID timeline come from a single Tier-5 trade source, ppc.land [6], reading LinkedIn's Help Center. I did not independently reach a LinkedIn page stating these exact numbers. Flagged as single-source and a verification target.)*\n\n### The Microsoft ad-stack heritage — why Monetize matters\n\nMicrosoft acquired **Xandr from AT&T in June 2022**, inheriting both a DSP (Microsoft Invest) and an SSP (Microsoft Monetize) [7]. Microsoft **shut down Invest, its buy-side platform, on February 28, 2026**, citing a pivot toward AI-driven advertising — which left Monetize \"without captive demand\" [7].\n\nThis reframes the whole program. ppc.land calls it **\"Microsoft Monetize's survival bet\"**: the SSP lost its natural demand source, and the LinkedIn-data-on-CTV integration is its attempt to build independent value on **an exclusive asset — LinkedIn's professional data — that no competing SSP can replicate** [7]. Because LinkedIn is a Microsoft property and the data routes through Microsoft Curate/Monetize, no rival SSP can offer the same deal. That is the moat, and it is a corporate-ownership moat as much as a technical one.\n\n*(Going-concern note: the Invest shutdown on Feb 28, 2026 is a present-tense structural fact underpinning the entire mechanism. Sourced to ppc.land [7], Tier 5. This is load-bearing for the \"survival bet\" thesis and should be corroborated against a Microsoft statement — flagged; the Microsoft primary announcement was referenced but not read directly.)*\n\n### The critical mechanical fact: no household graph\n\nHere is the mechanically decisive point, and it cuts against the naïve reading of the product. Per ppc.land [6], the targeting **\"relies on first-party member declarations (job title, industry, seniority, function, company category) rather than IP-based household graphs or third-party cookies.\"** In other words, LinkedIn does *not* claim to deterministically resolve an individual professional to a specific TV in a specific household via an identity graph. It packages declared professional segments and lets them find CTV inventory through the PMP. How exactly a *declared individual segment* maps onto *household-delivered CTV impressions* is precisely the gap the documentation does not close — see Section 6.\n\n---\n\n## 5. The Strategic Thesis — Why B2B on CTV Is a Distinctive Fit\n\n### The answer, first\n\nB2B is a *better-than-average* fit for professional-data-powered CTV — but for reasons that are mostly about brand-building and reach efficiency, not deterministic one-to-one targeting. The distinctive fit rests on three real structural features of B2B, and one genuinely differentiated data asset.\n\n### The three structural features\n\n1. **Long sales cycles.** Enterprise software and services sell over months, to a committee, not in a single click. AdExchanger frames the core insight plainly: *\"the decisions in B2B are taken by a buying group\"* [1] — the demand-side playbook (Demandbase's 2026 CTV-for-B2B guidance) notes the challenge of \"selling enterprise software to a seven-person buying committee across a six-month sales cycle\" [11]. Upper-funnel brand presence over a long cycle is exactly what TV is good at.\n\n2. **High-value accounts.** When a single closed account is worth six or seven figures, the economics tolerate a premium, low-efficiency-loss channel. Wasting impressions on out-of-market households is expensive at consumer CPMs; against a $250k deal it is rounding error. That is why B2B can afford CTV's premium pricing and imperfect targeting.\n\n3. **Hard-to-reach titles.** CFOs, CISOs, VPs of Engineering are precisely the people who are unreachable by broad demo buys and increasingly ad-light in their digital lives. LinkedIn's pitch is that these titles are *identifiable* in its graph in a way they are not on a generic CTV buy.\n\n### The data asset\n\nThe differentiator is **first-party, declared, verified-at-the-identity-level** professional data. ppc.land contrasts LinkedIn against the B2B-data field: versus **ZoomInfo** (third-party firmographic data) and **Bombora** (contextual/intent inference), LinkedIn's advantage is that its signal is *declared by the member and verified at the identity level* — structurally more reliable for B2B, though geographically limited to the US for now [7]. Members tell LinkedIn their job title and employer; competitors infer it.\n\n### The viewing-behavior tailwind\n\nLinkedIn's audience-fit argument leans on a **Magna Media Trials** study it cites: **\"98% of LinkedIn users watch CTV in a given week, compared to 83% who watch linear TV\"** [1]. If professionals have already left linear for streaming, the only way to reach them on a TV screen is CTV — which is the whole point. *(This figure is LinkedIn-cited from a Magna study; treat as vendor-selected evidence, directionally credible.)*\n\n### The performance case studies (vendor-attested)\n\nLinkedIn markets several case studies. They are strong but they are LinkedIn's own numbers — report them as **vendor-attested, not independently audited**:\n\n- **Salesforce:** LinkedIn's CTV ads reached **4x as many on-target impressions vs. linear TV**; **over 70% unique reach** (audiences not reached by linear campaigns), as measured by **iSpot**; and **11x more cost-effective** at reaching key audiences than linear [1][12]. The iSpot measurement is a partial third-party check on the *reach/uniqueness* claim.\n- **ServiceNow:** **19% lift in awareness** among audiences at large companies and a **45% improvement in lead submission rates**, with brand lift measured via **Kantar** [1][13].\n- **LinkedIn-wide efficacy claim (eMarketer, citing LinkedIn research):** CTV ads **\"2.2 times more effective than other CTV platforms and 4.3 times more effective than linear TV\"** [9].\n\n*(Single-source / stakes flag: every performance figure above originates in LinkedIn marketing or a LinkedIn-commissioned measurement study. The iSpot and Kantar involvement adds partial independence on reach and brand lift respectively, but none of these are independent, adversarial audits. Marked load-bearing-for-the-thesis-but-vendor-sourced.)*\n\n---\n\n## 6. Limits and Skepticism — the Load-Bearing Section\n\nA McKinsey brief earns its fee here. The product is real. The question is where the value story is solid and where it is a halo.\n\n### 6.1 The household-vs-individual mismatch\n\nThis is the central structural tension. **A CTV impression is delivered to a household** — a shared living-room screen — **while LinkedIn targeting is an individual professional.** LinkedIn's own documentation, as reported, says the DSP program uses *member declarations*, not *IP-based household graphs* [6]. So the honest mechanical picture is:\n\n- LinkedIn knows individual X is a CISO at Company Y (declared, verified).\n- CTV inventory is addressable at the **household/device** level, typically via IP.\n- The bridge between \"CISO individual\" and \"the TV in the CISO's home\" is where the deterministic story frays.\n\nBroader B2B-CTV commentary makes the same point independently of LinkedIn: \"Most CTV platforms were designed for consumer brands, with targeting and measurement built around household demos and mass reach,\" which \"doesn't work when selling enterprise software to a seven-person buying committee\" [11]; \"household-level targeting remains the norm for most inventory\" [11]. The practical implication: reaching a decision-maker on their smart TV is, to a meaningful degree, **probabilistic** (this household statistically over-indexes on the target professional segment) rather than **deterministic** (this exact CFO is watching now). That is not fatal — over-indexed reach is still valuable, and buying-committee members share households — but it means \"reach the CFO on their smart TV\" is *partly* a brand-halo framing.\n\n*(Note the honest tension in the sourcing: LinkedIn says it does *not* use household graphs, which one might read as *avoiding* the mismatch. But avoiding an IP-graph does not resolve the mismatch — it means the individual→household bridge is handled by the PMP's audience modeling and the publisher's delivery, which is *less* transparent, not more. This is the sharpest open question in the section.)*\n\n### 6.2 B2B measurement difficulty\n\nCTV is a **no-click channel**, and B2B conversion is a committee decision over months. Industry commentary is blunt: the CTV adoption gap \"is not in the channel itself but in how brands measure it,\" with a large share of the CTV-share-vs-CTV-spend mismatch being \"the residue of judging a non-click channel with click-based attribution\" [11]. For B2B specifically, \"the attribution problem\" is primary \"since standard click-based tracking doesn't work,\" making account-level and buying-group-level measurement tools essential [11]. LinkedIn's answer is brand-lift studies (Kantar) and reach measurement (iSpot) — which is the *right* answer methodologically, but it also means the ROI case is built on **lift and reach**, not on **attributable pipeline**. Buyers who demand last-click pipeline attribution will structurally undervalue this — and buyers who accept brand-lift proxies are, in effect, taking the vendor's methodology on faith.\n\n### 6.3 Is \"reach the CFO on their TV\" incremental value or a halo?\n\nThe steelman for incremental value: Salesforce's **70%+ unique reach** (iSpot-measured) [12] is the single most persuasive datapoint — if 70% of CTV-reached targets were *not* reachable via linear, the channel is additive, not duplicative. The **11x cost-efficiency vs. linear** [12] and **98% CTV / 83% linear** viewing split [1] reinforce that professionals have migrated and CTV is where they now are.\n\nThe skeptic's rebuttal: unique *reach* is not the same as unique *impact*. Reaching a household that over-indexes on your target segment builds brand familiarity — a halo — but the leap from \"the CFO's household saw the ad\" to \"the CFO chose us\" is exactly the attributable-pipeline gap Section 6.2 describes. The 45% lead-submission lift (ServiceNow) [13] is the closest thing to a hard outcome, but it is vendor-attested and does not isolate CTV from the rest of the media mix. **Honest read: the reach and efficiency claims are real; the causal-value claim is a brand-lift argument dressed in precision-targeting language.**\n\n### 6.4 The competitive threat — Amazon's own B2B ambitions\n\nThe partnership that made the headlines also plants a competitor inside the tent. Marketing Dive notes Amazon's B2B aspirations are \"implicit rather than explicit,\" with the LinkedIn integration being \"one of several CTV partnerships\" (Netflix, Samsung, Tubi, Comcast) [3]. But the strategic reading writes itself. Amazon has enormous first-party *purchase* and *business-buyer* data (Amazon Business), a booming ad engine ($17.2B in Q1, +22% [10]), and every incentive to build native B2B targeting that does not pay a data toll to a Microsoft property. Marketing Dive frames the deal as a \"step up for both platforms\" but also notes it \"reflects Amazon's strategic ambition to expand its B2B advertising capabilities and compete more directly with LinkedIn\" [10]. Today LinkedIn is Amazon's supplier of B2B identity; the medium-term risk is that Amazon decides it would rather own that layer.\n\n*(This is an inference about competitive trajectory, not a sourced statement of Amazon's roadmap. Marked as inference. No Amazon primary source states an intent to displace LinkedIn.)*\n\n### 6.5 The concentration/going-concern risk in the plumbing\n\nBecause **every** deal flows through Microsoft Monetize [7], the program depends on a single SSP — one that just lost its captive demand and is, in ppc.land's framing, making a \"survival bet\" [7]. If Monetize falters commercially, or Microsoft reorganizes its ad stack again (as it did by killing Invest in Feb 2026 [7]), the program's supply-side pipe is exposed. The exclusivity that is the moat is also the concentration risk.\n\n### 6.6 What is genuinely under-specified\n\nPer ppc.land, LinkedIn's announcements do **not** clarify: which targeting attributes beyond job title/industry/seniority are available; how measurement and pricing work in detail; minimum deal sizes for all routes; and — critically — **whether true ABM (named-account-list) targeting is supported** on the DSP routes [6][7]. For a product sold on its B2B precision, the silence on named-account ABM is a notable gap. Company *category* is confirmed as a facet [6]; a target-account *list* is not confirmed.\n\n---\n\n## 7. Where This Leaves LinkedIn Through the Forecast Horizon\n\nLinkedIn is the strongest social-to-CTV extension case precisely because it is not really extending *inventory*. It is licensing *identity* into other people's inventory, across three DSPs, secured by corporate ownership of both the data (LinkedIn) and the supply pipe (Microsoft Monetize). That is a more durable model than a social platform trying to stand up its own streaming supply. The B2B fit is real, the data asset is genuinely differentiated (declared vs. inferred), and the reach/efficiency case is corroborated at least partially by third-party measurement (iSpot, Kantar).\n\nThe bounding constraints are equally real: the individual-to-household bridge is probabilistic and under-disclosed; measurement rests on lift not pipeline; ABM's most literal form (named-account lists) is unconfirmed on the DSP routes; and the same exclusivity that protects LinkedIn concentrates all risk on one SSP making a survival bet — while the DSP partner that gave it scale (Amazon) has every reason to eventually build a rival B2B data layer of its own. LinkedIn credibly reaches the big screen. Whether it reaches *the CFO* — or merely the CFO's household, with a story about it — is the question the vendor numbers cannot fully close.\n\n---\n\n## Open Questions\n\n1. **Does the DSP program support named-account (list-based) ABM,** or only industry/company-category/title facets? LinkedIn's documentation confirms company *category* but not a target-account *list* on the DSP routes [6].\n2. **How, precisely, does a declared individual professional segment map to household-delivered CTV impressions** when LinkedIn explicitly says it does *not* use IP-based household graphs [6]? What is the modeling that bridges individual→household, and what is its accuracy?\n3. **Are the $50k/30-day minimum, 1M-member audience floor, and 5-business-day Deal ID timeline** current and applicable across all DSP routes, or ppc.land-specific readings of one documentation snapshot? (Single-source [6].)\n4. **What is the independent (non-LinkedIn-commissioned) evidence** for the Salesforce/ServiceNow performance figures? iSpot and Kantar add partial independence; is there any fully third-party audit?\n5. **Will Amazon build native B2B business-buyer targeting** (via Amazon Business data) that competes with — or eventually displaces — the LinkedIn supply relationship?\n6. **Is CTV Select still managed-account-only,** or is LinkedIn moving it toward self-serve? (Confirmed managed-only as of the June 2026 help page [2].)\n7. **Non-US roadmap:** DSP routes are US-only; direct Campaign Manager adds Canada. When, if ever, does professional-data CTV targeting reach EMEA/APAC, given data-protection constraints on professional data?\n8. **How exposed is the program to a Microsoft ad-stack reorganization,** given Monetize is the sole supply pipe and Microsoft just killed Invest in Feb 2026 [7]?\n\n---\n\n## Sources\n\n1. Ryan Barwick / AdExchanger, \"LinkedIn's CTV Ads Are Helping B2B Advertisers Find Audiences Where They Live,\" 2026. https://www.adexchanger.com/marketers/linkedins-ctv-ads-are-helping-b2b-advertisers-find-audiences-where-they-live/ — Tier 5 trade (ad-tech specialist, industry-close lean). Accessed 2026-06-30. Contribution: GA in US/Canada, CTV Select pricing/inventory, Salesforce/ServiceNow figures, buying-group thesis, Magna 98%/83% figure.\n2. LinkedIn Marketing Solutions Help, \"CTV Ads\" (answer a5966603), accessed 2026-06-30. https://www.linkedin.com/help/lms/answer/a5966603 — Tier 1 (product owner's own documentation; Tier 1 for what LinkedIn claims about its product). Contribution: US/Canada + English-only scope, publishers, CTV Select managed-account-only access, Brand Awareness objective, DSP activation.\n3. Sara Karlovitch / Marketing Dive, \"Amazon, LinkedIn help advertisers reach professionals via CTV ads,\" 2026. https://www.marketingdive.com/news/amazon-linkedin-help-advertisers-reach-professionals-via-ctv-ads/819372/ — Tier 5 trade. Accessed 2026-06-30. Contribution: Roter quote, Monetize as SSP, Amazon's implicit B2B ambition, broader Amazon streaming supply (Netflix/Tubi/Comcast), cautious read on \"one buy.\"\n4. The Trade Desk press room, \"LinkedIn Partners With the Trade Desk for CTV Ads,\" 2026-03-18. https://www.thetradedesk.com/press-room/linkedin-partners-with-the-trade-desk-for-ctv-ads — Tier 1 (party to the deal; Tier 1 for what TTD claims). Accessed 2026-06-30. Contribution: TTD as LinkedIn's *first* CTV DSP partner, dated Mar 18 2026; 1B+ professionals.\n5. Amazon Ads newsroom, \"LinkedIn CTV Ads are now available through Amazon DSP,\" 2026-05-07. https://advertising.amazon.com/library/news/linkedin-ctv-ads-amazon-dsp — Tier 1 (party to the deal; Tier 1 for what Amazon claims). Accessed 2026-06-30. Contribution: May 7 announcement, 1B+ members, job title/industry/seniority, Microsoft Monetize, US-only, deal-based buying, one-campaign activation, Conetta + Roter quotes.\n6. ppc.land, \"Microsoft Monetize fuses LinkedIn profile data into CTV via three DSPs,\" 2026. https://ppc.land/microsoft-monetize-fuses-linkedin-profile-data-into-ctv-via-three-dsps/ — Tier 5 trade (ad-tech specialist). Accessed 2026-06-30. Contribution: three-DSP list incl. Microsoft Advertising (~May 14), PMP/Deal ID/Microsoft Curate mechanics, $50k/30-day + 1M-member minimums, 5-day Deal ID, \"no household graph,\" Monetize-as-sole-SSP. *Single source for the operational minimums.*\n7. ppc.land, \"Microsoft Monetize's survival bet: LinkedIn data on Amazon DSP CTV,\" 2026. https://ppc.land/microsoft-monetizes-survival-bet-linkedin-data-on-amazon-dsp-ctv/ — Tier 5 trade. Accessed 2026-06-30. Contribution: Xandr acquisition (Jun 2022), Invest shutdown (Feb 28 2026), \"survival bet\" framing, ZoomInfo/Bombora competitive contrast, three-way interdependence.\n8. Campaign US, \"Amazon Ads and LinkedIn partner to expand B2B reach for 2026 upfront,\" 2026 (403 on direct fetch; details via search-index summary + corroboration). https://www.campaignlive.com/article/amazon-ads-linkedin-partner-expand-b2b-reach-2026-upfront/1957254 — Tier 5 trade. Accessed 2026-06-30. Contribution: upfront timing (May 11, Beacon Theatre), Roter quote corroboration.\n9. eMarketer, \"LinkedIn and Amazon Ads give B2B marketers a new path into CTV,\" 2026. https://www.emarketer.com/content/linkedin-amazon-ads-give-b2b-marketers-new-path-ctv — Tier 5 analytical (industry research). Accessed 2026-06-30. Contribution: \"monetize professional audience beyond its own platform\" framing; \"2.2x vs. other CTV / 4.3x vs. linear\" efficacy claim (LinkedIn research).\n10. MediaPost, \"Amazon, LinkedIn Team For B2B Inventory Ahead Of Upfront,\" 2026-05-08. https://www.mediapost.com/publications/article/414919/ — Tier 5 trade. Accessed 2026-06-30. Contribution: Amazon Q1 ad revenue $17.2B / +22% YoY; Amazon's B2B competitive-ambition framing.\n11. Demandbase, \"Understanding CTV in B2B advertising: A strategic playbook for 2026,\" 2026. https://www.demandbase.com/blog/ctv-b2b-advertising/ — Tier 5/6 (vendor blog; ABM-platform lean — cited as position/industry-commentary evidence on the household-mismatch and measurement problems, not as neutral fact). Accessed 2026-06-30. Contribution: buying-committee framing, household-demo mismatch, no-click attribution problem.\n12. iSpot.tv case study, \"Salesforce Achieves Over 70% Unique Reach With LinkedIn's CTV Ads, Measured by iSpot,\" 2026. https://www.ispot.tv/hub/resources/case-studies/salesforce-achieves-over-70-unique-reach-with-linkedins-ctv-ads-measured-by-ispot/ — Tier 1 for measurement vendor's attested result / Tier 5-6 as marketing. Accessed 2026-06-30. Contribution: 70%+ unique reach, 4x on-target vs. linear, 11x cost-efficiency (iSpot-measured but LinkedIn-published). Vendor-attested.\n13. LinkedIn Business / Kantar case study, \"ServiceNow achieves both brand and demand with LinkedIn CTV (Kantar),\" 2026. https://business.linkedin.com/marketing-solutions/case-studies/servicenow-kantar-ctv — Tier 6 as marketing (LinkedIn's own case study; Kantar-measured brand lift). Accessed 2026-06-30. Contribution: 19% awareness lift, 45% lead-submission improvement. Vendor-attested."}, {"order": 4, "file": "04_Pinterest_tvScientific.md", "title": "Pinterest's Big-Screen Bet: tvScientific and the Intent-to-Household Match", "summary": "", "body": "# Pinterest's Big-Screen Bet: tvScientific and the Intent-to-Household Match\n\n## Bottom Line\n\nPinterest bought its way onto the television set. In December 2025 it agreed to acquire tvScientific, a performance-CTV advertising platform; the deal closed on 17 February 2026, and by 27 April 2026 the combined product — rebranded **tvScientific by Pinterest** — was in market with **CTV Audiences**, which for the first time lets advertisers reach Pinterest's high-intent first-party audiences *off* Pinterest, on the living-room screen. The logic is clean. Pinterest has spent three years repositioning itself from an upper-funnel discovery board into a lower-funnel performance channel — its AI suite, Performance+, is the flagship of that pivot — but it lacked an off-platform video surface where it could carry its intent signal and still measure a sale. tvScientific is the missing surface: a cost-per-outcome (CPO) engine that uses deterministic IDs to tie a TV exposure to a business result across roughly 95% of ad-supported streaming. The pitch is that Pinterest's signal is *forward-looking* — what people are planning to buy, not what they already did — and that enriching tvScientific's optimization with it lifts results.\n\nThe catch is that every performance number attached to the launch is vendor-reported, and several trace to tvScientific's own CEO: a **+27% lift in outcomes per $100 spent**, **+65% in purchases**, and an LG case study of **+73% unique households** and **+24% net-new-customer lift**. None is independently audited. The deeper question skeptics raise is structural. Pinterest's intent lives at the individual, in-app level, but CTV targeting resolves to a *household* — an IP address shared by everyone under the roof — so the precision that makes Pinterest's signal valuable may partly wash out in the match. The attribution model that produces the lift figures, which credits any device in the household after one TV exposure, is in one analyst's word \"blunt.\" Pinterest has bought a real beachhead at the intersection of mobile performance and CTV, where few exist. Whether the intent signal survives the trip to the household is the thing to watch, and public data cannot yet answer it.\n\n---\n\n## 1. The Strategic Frame: Why Pinterest Needed a Television\n\n**Answer first:** Pinterest is no longer trying to be the place you *discover* a sofa; it is trying to be the place a sofa *gets sold*. That repositioning — from upper-funnel inspiration to lower-funnel performance — is the whole reason the tvScientific deal exists. A performance channel has to do two things: target on intent and prove a sale. Pinterest could do both *on* its own app. It could do neither *off* it. CTV was the largest, fastest-growing off-platform surface it could plausibly carry its signal onto — so it bought a way in.\n\nFor most of its life, advertisers filed Pinterest under \"discovery\" or \"inspiration\" — a place users go to plan a kitchen remodel or a wedding, weeks or months before a purchase. That planning behavior is commercially valuable, but it is not where the last-click, return-on-ad-spend (ROAS) budgets live. Under CEO Bill Ready, formerly of Google and PayPal, Pinterest has spent several years moving down the funnel toward measurable outcomes. The centerpiece is **Performance+**, its AI- and automation-powered performance-advertising suite — Pinterest's analogue to Meta's Advantage+ or Google's Performance Max, where the advertiser hands the machine a goal and a budget and the system automates targeting, bidding, and creative optimization toward a conversion. AdExchanger reported that Performance+ had delivered roughly **20% efficiency gains** for advertisers [4].\n\nA performance pivot bounded by your own app runs into a wall: scale, and where attention actually is. People plan on many screens and increasingly watch on the biggest one. Ready's framing at the acquisition was that \"people plan and shop across multiple screens and advertisers need performance solutions that reflect that reality\" — and that \"for the first time, Pinterest advertisers will be able to evaluate TV with the clarity they expect from their performance channels\" [1][2]. In plain terms: Pinterest wanted to sell television the way it sells search and social — on outcomes, not on reach.\n\nTwo structural forces make this a logical move rather than an opportunistic one. First, **signal loss**: Apple's App Tracking Transparency and the long decline of third-party cookies have made first-party, logged-in, intent-rich data the scarce asset in digital advertising, and Pinterest sits on a distinctive pile of it — declared, forward-looking commercial intent. Second, the **retail-media template**: retailers like Amazon and Walmart proved that a platform with first-party purchase-intent data can extend that data as an *audience network* onto inventory it does not own, and capture margin doing it. AdExchanger framed the tvScientific deal as Pinterest building \"something akin to Google AdSense or Meta's Audience Network but for CTV\" [4]. Pinterest is running the retail-media play with intent data instead of purchase data, and CTV as the extension surface.\n\n> **Key Claim 4.1 — Pinterest is repositioning from upper-funnel discovery to lower-funnel performance, and CTV extension is a direct consequence.**\n> *Type: established. Stakes: load-bearing. Single-source: no.*\n> Pinterest's multi-year strategy under Bill Ready has moved it toward measurable, lower-funnel outcomes, anchored by its AI performance suite Performance+; the tvScientific acquisition extends that performance model to off-platform CTV inventory. Framed by Pinterest's own statements [1][2] and corroborated by trade analysis [4][8][11].\n\n> **Key Claim 4.2 — Performance+ is Pinterest's AI/automation performance-ad suite and is the integration target for tvScientific's CTV engine.**\n> *Type: established. Stakes: standard. Single-source: no.*\n> Both Pinterest's and tvScientific's announcements state tvScientific's outcome-based CTV platform integrates \"directly into Pinterest's performance products, including Pinterest Performance+\" [1][2]; AdExchanger reports Performance+ delivered ~20% efficiency gains for advertisers [4].\n\n---\n\n## 2. The Acquisition: Timeline, Price, and What Was Actually Bought\n\n**Answer first:** Announced 11 December 2025, closed 17 February 2026, rebranded to *tvScientific by Pinterest*. Pinterest never disclosed the price; the consensus trade estimate is **$300–350 million** (against ~$100M of tvScientific revenue, ~3–3.5× revenue), and one secondary financial outlet reported a figure of **$465.1 million** that does *not* appear in Pinterest's own SEC filing and should be treated as unconfirmed.\n\n### 2.1 The timeline\n\n- **11 December 2025** — Pinterest announces a definitive agreement to acquire tvScientific [1][2][4]. The deal is disclosed as subject to regulatory review; because that review triggers at the Hart-Scott-Rodino / FTC reporting threshold of **$126.4 million**, the price sits at or above that floor [4].\n- **17 February 2026** — Pinterest closes the acquisition and folds tvScientific into its consolidated financial reporting [5][6][7].\n- **~April 2026** — the combined product is rebranded **tvScientific by Pinterest**; tvScientific CEO Jason Fairchild is described as \"CEO of tvScientific by Pinterest\" [3].\n- **27 April 2026** — the CTV Audiences product launches (see §3) [3][9][10][12].\n\nAt announcement, Pinterest said tvScientific would initially \"continue to operate independently under its own branding\" [1] — a plan the later rebrand modifies, folding the name under Pinterest's while keeping \"tvScientific\" as the product marque.\n\n### 2.2 The price — and a discrepancy to flag\n\nPinterest did **not** disclose deal terms in its own filings; it stated only that the transaction is not expected to have \"a material impact on its financial results\" [1], and its closing 8-K discloses no purchase price [6][7]. Into that vacuum, two numbers have appeared:\n\n- **$300–350 million** — the consensus estimate reported by Digiday from anonymous sources, against tvScientific revenue of ~$100M annually (~$50M net), implying a ~3.0–3.5× EV/revenue multiple that RockWater benchmarks as roughly \"fair market price\" versus comparable ad-tech deals (e.g., Mediaocean/Innovid at ~3.2×) [8][11][13].\n- **$465.1 million** — a figure attributed to Pinterest's tvScientific acquisition by the secondary financial outlet TipRanks [5]. **This figure does not appear in Pinterest's SEC 8-K** [6][7], and I could not corroborate it against a primary filing. It should be treated as unconfirmed and possibly erroneous.\n\nThe honest read: the *directionally reliable* number is \"$300–350M, ~3–3.5× revenue,\" and even that is a trade estimate, not disclosure. The $465.1M figure is flagged and set aside pending a primary source.\n\n> **Key Claim 4.3 — Pinterest agreed to acquire tvScientific on 11 Dec 2025 and closed the deal on 17 Feb 2026.**\n> *Type: established. Stakes: load-bearing. Single-source: no.*\n> Announcement dated 11 December 2025 [1][2][4]; close dated 17 February 2026 in Pinterest's 8-K and press coverage [5][6][7].\n\n> **Key Claim 4.4 — The deal price was undisclosed by Pinterest; trade consensus is $300–350M (~3–3.5× revenue); a $465.1M figure is reported by one secondary outlet but is not in Pinterest's SEC filing.**\n> *Type: contested. Stakes: standard. Single-source: no (each figure is single-sourced, but the discrepancy is corroborated across sources).*\n> $300–350M and ~$100M revenue: Digiday and RockWater [8][11][13]. $465.1M: TipRanks [5], uncorroborated by primary filing [6][7]. Disclosure floor of $126.4M inferred from HSR/FTC reporting threshold [4].\n\n> **Key Claim 4.5 — Following the close, Pinterest raised its Q1 2026 guidance to $958–978M revenue and $163–183M Adjusted EBITDA, reflecting a partial-quarter tvScientific contribution.**\n> *Type: established. Stakes: standard. Single-source: no.*\n> Pinterest 8-K / press release, quoted across StockTitan, Globe and Mail, TipRanks [5][6][7]. Pinterest attributes the update to \"the expected partial-quarter contribution from tvScientific\" but discloses no standalone tvScientific revenue figure.\n\n### 2.3 What tvScientific actually is\n\nDecoded plainly, tvScientific is a **self-serve, cost-per-outcome (CPO) CTV ad platform**. Three mechanics matter:\n\n1. **Cost-per-outcome pricing.** Most TV buying charges on impressions (CPM); tvScientific charges against a client-approved business outcome — you optimize toward, and are measured on, a conversion, not a view [4]. That is what makes it \"performance\" CTV rather than \"brand\" CTV.\n2. **Deterministic ID / attribution.** tvScientific describes itself as using \"deterministic ID technology\" and \"1:1 matching\" to connect an ad *exposure* on a TV to a downstream *conversion* on the web [1][11]. Deterministic, as opposed to probabilistic, means the match rests on a known, exact identifier rather than a statistical inference — though as §5 discusses, on CTV that identifier is typically the household IP, not the individual.\n3. **Reach and automation.** The platform claims to reach roughly **95% of ad-supported video-on-demand (AVOD) audiences** and runs AI-powered media buying and optimization; it already integrated with affiliate platforms like Rakuten and Impact, and served SMB and mid-market advertisers at lower minimums than the large DSPs [1][4].\n\n> **Key Claim 4.6 — tvScientific is a self-serve, cost-per-outcome CTV performance platform using deterministic ID matching, claiming ~95% AVOD reach.**\n> *Type: established. Stakes: load-bearing. Single-source: no (but reach and match claims are company-stated).*\n> tvScientific and Pinterest announcements [1][2]; AdExchanger technical framing (CPO, algorithmic optimization, Rakuten/Impact integrations) [4]. The 95% AVOD-reach and deterministic-match claims are vendor-stated and not independently audited — flagged.\n\n---\n\n## 3. The Product: CTV Audiences (launched 27 April 2026)\n\n**Answer first:** CTV Audiences is the payload of the whole acquisition. It lets an advertiser take a Pinterest first-party audience — built from what people search, save, and shop *on* Pinterest — and activate it as a targeting layer on premium CTV inventory that Pinterest does not own, with tvScientific's AI doing the optimization and attribution. It is, in category terms, **audience extension**: taking a walled garden's proprietary audience and spending it on someone else's screen.\n\nOn 27 April 2026, tvScientific by Pinterest announced that \"advertisers can now reach Pinterest's exclusive high-intent audiences off of Pinterest and on connected TV for the first time\" [3]. Coverage called it the first major milestone since the February close [3][9]. The mechanics as stated:\n\n- **The signal.** Pinterest contributes its \"commercial intent signals,\" derived from search, saves, and shopping behavior across its base (Digiday cites ~600 million monthly active users; eMarketer and the launch cite **80+ billion monthly searches**) [9][10][12]. The pitch is that the signal is *forward-looking*: in Fairchild's framing, \"Pinterest's signals are unique because they reflect what people are planning, not just what they've already done\" [3].\n- **The extension.** Those audiences are activated across premium CTV inventory via tvScientific's platform; Pinterest's Chief Business Officer Lee Brown framed it as reaching people \"at every stage of the shopping journey, from discovery to buying, both on and off Pinterest\" [3].\n- **The optimization.** tvScientific's \"AI-powered optimization technology\" runs the buy and the measurement, so the advertiser gets the attribution and outcome reporting Pinterest's other performance channels provide [3].\n- **The integration.** CTV becomes buyable inside Pinterest's performance stack, with the tvScientific engine wired into Performance+ [1][3].\n\nDigiday's gloss is the clearest: this is Pinterest's first effort to let marketers deploy its audience \"on third-party CTV properties,\" combining **deterministic** (known-ID) targeting with **probabilistic** (modeled) approaches [9]. In other words, a classic audience-extension network — the retail-media move, run on intent data.\n\n> **Key Claim 4.7 — On 27 April 2026, tvScientific by Pinterest launched CTV Audiences, letting advertisers reach Pinterest first-party high-intent audiences OFF Pinterest on CTV for the first time. [GOING-CONCERN]**\n> *Type: established. Stakes: load-bearing. Single-source: no.*\n> Pinterest newsroom launch [3], corroborated same-day by VideoWeek, Digiday, eMarketer, MediaPost [9][10][12]. Confirmed live as of the 27 April 2026 launch; most recent confirmation is that launch date. Present-tense \"currently in market\" rests on that launch and its multi-outlet coverage; no later contradicting source found through the research window.\n\n> **Key Claim 4.8 — CTV Audiences is an audience-extension model: a walled-garden first-party audience activated on third-party CTV inventory Pinterest does not own.**\n> *Type: established. Stakes: standard. Single-source: no.*\n> Digiday characterizes it as deploying Pinterest's users \"on third-party CTV properties,\" combining deterministic and probabilistic targeting [9]; AdExchanger's \"audience network for CTV\" framing supports the category read [4].\n\n---\n\n## 4. \"CTV-Scientific\": The Targeting Angle and the Lift Figures\n\n**Answer first:** The mechanism is simple to state: take tvScientific's outcome-based optimization engine and *enrich* it with Pinterest's high-intent purchase signals, so the machine points TV dollars at households more likely to actually buy. The claimed payoff comes in four vendor-reported numbers. Every one is attributed to Pinterest/tvScientific, several to the tvScientific CEO directly, and none is independently verified. Treat them as marketing evidence of the direction of effect, not as audited measurement.\n\nThe value proposition addresses TV's oldest weakness — you couldn't prove it drove a sale the way search and social could — by bolting Pinterest's intent onto tvScientific's measurement. The reported results:\n\n| Figure | Claim | Attribution | Status |\n|---|---|---|---|\n| **+27%** | Increase in outcomes driven per $100 in spend, when tvScientific AI is enriched with Pinterest high-intent signals | Pinterest/tvScientific; Digiday attributes the 27% to tvScientific CEO Jason Fairchild | Vendor-reported, unverified |\n| **+65%** | Increase in purchases (same enrichment) | Pinterest/tvScientific announcement | Vendor-reported, unverified |\n| **+73%** | Increase in unique households reached — LG case study, \"expanded its existing audience approach\" with Pinterest audiences | Pinterest/tvScientific (named LG case) | Vendor-reported, single case, unverified |\n| **+24%** | Lift in net-new customers, from that additional reach — LG case | Pinterest/tvScientific (named LG case) | Vendor-reported, single case, unverified |\n\nThe aggregate figures (+27%, +65%) are framed as averages from early testing \"when tvScientific AI is enriched with Pinterest's high-intent signals\" [3][9][10][12]. The LG figures (+73% unique households, +24% net-new customers) are a single named case study in which LG \"expanded its existing audience approach\"
