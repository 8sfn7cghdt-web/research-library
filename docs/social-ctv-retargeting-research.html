on; Meta has a content app on TV but no announced ad product; Reddit is deliberately walling its garden; and TikTok's TV app is dead. Meanwhile the streamers themselves — Disney, NBCUniversal, Netflix, Roku, Walmart-Vizio — now sell their *own* first-party audiences, and the big ad-buying groups have bought their own identity tools. That leaves the social platform's data-licensing fee as the thinnest, most exposed link in the chain [Claim 11.10, 12.3]. Through 2029 the most likely outcome is a **split verdict**: LinkedIn builds a durable niche, the rest get disintermediated.\n\n## How to Read\n\nThe five-minute version is this Bottom Line and the three synthesis sections below. The longer version runs in order: how the category was forced into being, the plumbing that makes it work, a platform-by-platform read (LinkedIn, Pinterest, Reddit and TikTok, Meta), then the market structure, the legal exposure, and the outlook — with the claims-and-sources layer underneath for anyone who wants the record. Stop after the Forecast and you have the decision-grade version.\n\n## Origins (Brief)\n\nTwo forces built this category, and both are about *signal loss*, not about television. The first was the collapse of the mobile-tracking model social advertising ran on. For a decade the loop was simple: a user scrolled a phone app, the app matched that behavior to the same person's activity in other apps through the device's mobile ad identifier (the MAID — the IDFA on iPhones, the GAID on Android), and served a precisely retargeted ad. ATT broke the iPhone half of that loop in 2021. The long-threatened death of the third-party browser cookie promised to break the rest. Google ultimately abandoned cookie deprecation in 2024–25, but the lesson had already landed: a platform's *own* logged-in, first-party data was now the crown asset [Claim 1.5, 1.6].\n\nThe second force was a proven playbook. Retail-media networks — led by Amazon, forecast past $60 billion in ad revenue in 2025, and duct reached general availability across the US and Canada in spring 2026; it layers professional signals — title, industry, seniority — from more than a billion members onto premium inventory from Paramount and NBCUniversal; and, decisively, it opened to demand through independent buying platforms, first The Trade Desk and then Amazon's DSP on 7 May 2026 [Claim 3.1, 3.3]. It sells *identity, not inventory*, and verified professional identity is the one segment a streamer cannot reconstruct. **Pinterest** bought the capability outright, closing its acquisition of the performance-CTV platform tvScientific on 17 February 2026 and launching off-platform \"CTV Audiences\" inside its Performance+ automation suite. The logic is clean; the reported lift figures — a claimed +27% in outcomes per dollar, +65% in purchases — are entirely vendor-reported and unaudited [Claim 4.3, 4.9]. **Meta** has made only a *content* move so far: Instagram for TV, streaming Reels to the living room, launched in test on Fire TV in December 2025 with no announced ad product — though trade reporting says Meta has quietly met with streaming-supply vendors about pushing its ad demand into third-party CTV [Claim 6.1, 6.5]. **Reddit** is doing the opposite of extension, hoarding its first-party data and monetizing on-platform. And **TikTok** is the outlier that retreated: its TV app was pulled under the US ban law and shut down globally in June 2025 [Claim 7.11, 7.10].\n\nTwo structural facts sit on top of all this and shape everything downstream. First, the connective tissue is consolidating around two independent demand-side platforms — Amazon's DSP (growing ~24% year-over-year to $17.2 billion in Q1 2026) and The Trade Desk — that social platforms *rent* precisely because they lack their own CTV inventory [Claim 7.4]. Second, and more threatening, the supply side has become a *competing seller of audiences*. Disney, NBCUniversal (with an identity graph of ~150 million person-level IDs), Netflix, ty moat converts into a durable, if niche, CTV business while the other four platforms' extension plays compress into thin data-licensing fees as streamers and ad-buying groups route around them. This is the outside view. The retail-media precedent says that of roughly five first-party-data holders who extend off-platform, about one builds a durable independent business and four license their data into someone else's margin [base rate; Claim 1.11]. The corpus's verified read: streamers can already rebuild every social segment *except* verified professional identity [Claim 11.10].\n\nThe two nearest alternatives pull in opposite directions. **Near-total disintermediation** (~22–32%) is the bear case in which even LinkedIn compresses: its reliance on private-marketplace deal IDs rather than a true household graph caps its programmatic scale, and a streamer or Amazon eventually ships business-buyer targeting that erodes even the professional moat. **Durable multi-platform** (~16–24%) is the bull case in which Pinterest's *owned* rail — a closed acquisition is real supply-side control the others merely rent — plus a maturing Meta demand pipe let the category stick for two or three players. Two lower-probability but high-consequence tails round it out. **Meta front-runs** (~12–18%): Meta actually ships CTV ads, inside Instagram-for-TV inventory or as a named \"Audience Network for CTV,\" and reshapes the field. **Regulatory rupture** (~9–15%): the legal attack on the plumbing itself lands. That last tail is not hypothetical. The Video Privacy Protection Act question reached the Supreme Court in *Salazar v. Paramount* (cert granted January 2026), California extracted a record $2.75 million CTV-tracking settlement from Disney, and Texas sued five TV makers over ACR [Claim 10.4, 10.8, 10.9].\n\nThe drivers to watch are concrete and mostly public. The single strongest update would be LinkedIn disclosing real, independently-measured CTV revenue — the pivot between the base ca platforms — LinkedIn, Pinterest, Reddit, TikTok, Meta — have stopped treating Connected TV (CTV; internet-delivered streaming television watched on a smart TV or a device like Roku or Fire TV) as someone else's channel and started treating it as an extension of their own audiences.** As a coherent strategy the category did not exist before roughly 2024. Two forces built it. The first was a *signal-loss shock*. Apple's App Tracking Transparency (ATT), enforced from April 2021, let iPhone users switch off the mobile ad identifier (IDFA — the Identifier for Advertisers, the device-level ID that let social apps track and retarget users across other apps) that social advertising depended on; roughly three-quarters of users opted out, and Meta alone told investors the change would cost about $10 billion of 2022 revenue [1][2][3]. Third-party browser cookies were supposed to vanish too, degrading the other pillar of cross-site targeting — though Google repeatedly delayed and ultimately abandoned that deprecation in 2024–2025 [4][5]. The second force was a *proven playbook*. Retail-media networks — led by Amazon (forecast to clear $60 billion in ad revenue in 2025) and Walmart Connect — showed that a platform's own first-party audience data could be extended onto other media, including CTV, as a very-high-margin business [6][7].\n\nThe throughline is **audience extension as the strategic answer to signal loss and a mobile-engagement plateau.** Social platforms hold durable, logged-in, first-party audience data: a job title on LinkedIn, a purchase intent on Pinterest, an interest graph on Reddit or TikTok. Viewing, meanwhile, has migrated to CTV — streaming passed the combined broadcast-plus-cable audience for the first time in May 2025 [8] — yet the social platforms owned almost none of that inventory. The 2024–2026 wave of moves resolves that mismatch. LinkedIn launched CTV Ads (April 2024) and struck DSP deals with The Trade Desk (March 2026) and Amazon (May 2026); Pinterest agreed to buy the CTV performance firm tvScientific (December 2025); Meta shipped an Instagram/Reels TV app (December 2025); TikTok pushed its own smart-TV app [9][10][11][12][13]. **Bottom line: first-party audience data, not ad inventory, is now the scarce asset — and the social platforms are monetizing that asset on the biggest screen in the house.**\n\n---\n\n## 1. The Origin Question: Why a \"Social-to-CTV\" Category At All?\n\n**Answer first: because the social platforms' core targeting engine broke on mobile at the same moment their audiences' attention moved to the television — and audience extension was the only way to sell the audience they still had into the inventory the audience now watched.**\n\nFor roughly a decade (2012–2021), the social advertising business rested on a simple loop. A user scrolled a mobile app — Facebook, Instagram, Pinterest, TikTok. The app watched the behavior, matched it to the same user's activity in *other* apps via the device's mobile ad identifier, and served — then *retargeted* — precisely aimed ads. \"Retargeting\" means showing an ad to someone who has already signaled interest: visited a site, viewed a product, engaged with content. The whole apparatus depended on one shared, cross-app identifier. On Apple devices that identifier was the IDFA; on Android it was the GAID / Android Advertising ID (together, the **MAID** — mobile advertising ID) [1][14].\n\nThen two things happened in sequence. The identifier was taken away (Section 2). And the audience's eyes moved to a screen the social platforms did not own (Section 4). \"Social-to-CTV retargeting\" is the name for the bridge the platforms are now building between the audience they still know — their logged-in first-party users — and the inventory that audience now consumes: streaming television. In one line, it is **the export of a social platform's identity graph onto the big screen.**\n\nWhy \"retargeting\" specifically, and not merely \"advertising\"? Because the distinctive claim is not \"we have TV inventory\" — they mostly own none — but \"we can tell a streaming publisher's ad server *which* households contain the exact people you already reach on our app.\" A LinkedIn campaign can specify job title, seniority, and industry against a Paramount or Roku stream [9][15]. A Pinterest campaign can carry shopping-intent signals from Pins and boards into a CTV buy [10]. That is audience *extension* — the same audience, a new screen — and it works as cross-screen retargeting.\n\n---\n\n## 2. The Signal-Loss Shock: ATT and the Death of the Easy Identifier\n\n**Answer first: Apple's April 2021 privacy change removed the identifier social platforms used to target and measure on mobile; opt-out ran to roughly 75%, Meta alone quantified a ~$10 billion 2022 hit, and the industry-wide loss of durable device-level signal is the proximate cause that pushed social platforms toward first-party-data strategies like CTV extension.**\n\n### 2.1 What ATT actually did\n\nIn April 2021, with iOS 14.5, Apple made **App Tracking Transparency (ATT)** mandatory. Any app that wanted to track a user across *other* companies' apps and websites — the essence of cross-app advertising — had to first show a system prompt asking permission [1][14]. If the user declined, and the default framing nudged toward declining, the app lost access to that device's IDFA and, with it, the ability to stitch the user's behavior across the wider mobile ecosystem.\n\nThe IDFA was the join key. Without it, a social platform could still see what a user did *inside its own app*, but it largely lost the ability to retarget that user based on off-app behavior, to build lookalike audiences from off-app conversions, and to *measure* whether an ad drove a downstream purchase in another app. Targeting, prospecting, and measurement degraded at once.\n\n### 2.2 The magnitude\n\n- **Opt-out rate:** Global opt-in to tracking settled at roughly 15–25%, meaning **the substantial majority of users opted out**; for social companies specifically, opt-out ran even higher — commonly cited around 75% [1][16][3].\n- **Meta's own guidance:** In February 2022, Meta's CFO told investors the iOS changes would represent a headwind \"on the order of $10 billion\" for 2022 — the largest single quantified corporate impact of the policy [2][3].\n- **Third-party estimates across the sector:** A Lotame study estimated 2022 revenue losses of roughly **$12.8 billion for Meta, $2.2 billion for YouTube, $546 million for Snap, and $323 million for Twitter** [17]. (Lotame is a data-management vendor with a commercial interest in signal loss; treat the specific figures as an interested estimate, but the *rank order and scale* — social platforms hit hardest — is corroborated by the companies' own disclosures.)\n- **Pricing and revenue impact studies:** Apple-commissioned and independent analyses found ad prices on Apple devices fell materially post-ATT (one figure: ~23% decline in average impression price), and academic work found trackable traffic commanded 14–97% price premiums over untrackable traffic across 19 countries — a direct measure of how much the lost identifier was worth [16][18].\n\n### 2.3 Why ATT specifically pushed toward CTV\n\nThe strategic logic is clean. Signal loss made *first-party, logged-in, deterministic data* the most valuable asset a platform could own — the one form of identity that neither Apple nor a cookie deprecation can revoke. LinkedIn always knew your job title. Pinterest always knew what you saved. Reddit always knew your communities. That data became the crown jewel. The question was where else to monetize it. CTV — logged-in, growing, and starved for good targeting data of its own — was the obvious answer. **The \"so what\": ATT turned first-party audience data from a nice-to-have into the core asset, and CTV is the highest-value place to rent that asset out.**\n\n---\n\n## 3. The Cookie Sub-Plot: A Second Signal-Loss Scare That Fizzled\n\n**Answer first: the parallel threat — the death of the third-party browser cookie — was real enough to accelerate first-party-data strategy, but Google repeatedly delayed and ultimately abandoned Chrome cookie deprecation in 2024–2025, so the *cookie* half of the signal-loss story ended in anticlimax even as its strategic effect (a rush to own first-party data) persisted.**\n\nThe **third-party cookie** is a small file that lets a company track a user across *websites* it does not own — the browser analogue of the MAID. In January 2020, Google announced that Chrome would follow Safari and Firefox in blocking third-party cookies, replacing them with a set of privacy-preserving APIs called the **Privacy Sandbox** [4][5]. The intended removal date slid from 2022 to 2023 to 2024 to 2025.\n\nThen Google reversed course, twice. In **July 2024** it abandoned forced deprecation, saying it would let users choose instead [5]. In **April 2025** it dropped even the choice prompt. By **October 2025** it had retired the core Privacy Sandbox APIs — Topics, Protected Audience, Attribution Reporting — for Chrome and Android [4][5]. Third-party cookies remain in Chrome today with no removal timeline.\n\nThe relevance to social-to-CTV is twofold. First, from 2020 to 2024 the *threat* of cookie loss reinforced everything ATT had already taught: build on first-party data, because borrowed identifiers are politically fragile. Second, the cookie's survival did **not** reverse the strategy — because CTV never ran on cookies to begin with. CTV identity is built on logged-in accounts, hashed emails, and IP-plus-device signals, not browser cookies. The platforms that had already pivoted to first-party audience extension had nothing to unwind. **The \"so what\": the cookie scare helped set the direction; its anticlimax did not change it, because the destination — CTV — was a post-cookie environment from the start.**\n\n---\n\n## 4. The Walled-Garden Gap: Why CTV Grew Up *Outside* Social\n\n**Answer first: CTV inventory scaled inside a different set of walled gardens — Roku, Amazon Fire TV, Samsung, and the streamers (Netflix, Disney, Paramount, NBCUniversal) — none of which the social platforms owned, so as viewing migrated to streaming, the social platforms found themselves with rich audiences and zero native big-screen supply. That structural gap is the market the 2024–2026 moves are built to close.**\n\n### 4.1 The scale of the migration\n\nCTV is where the audience went. As of December 2025, streaming captured a record **47.5% of all U.S. TV viewing time**, per Nielsen [8]. The pivotal milestone came in **May 2025**, when streaming's share of total TV viewing (44.8%) exceeded the *combined* share of broadcast (20.1%) and cable (24.1%, together 44.2%) for the first time in history [8]. Since Nielsen's Gauge report began in May 2021, streaming usage rose 71% while broadcast fell 21% and cable 39% [8].\n\nThe money followed. U.S. CTV ad spend reached roughly **$33.35 billion in 2025**, and eMarketer forecast in December 2025 that it would grow ~14.5% to about **$37.95 billion in 2026** [19][20]. Projections have CTV surpassing traditional TV ad spend around 2028 (~$46.9 billion) and approaching **$51 billion by 2029** [19].\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the prize — US CTV ad spend, 2025–2029<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"288.0\" x2=\"686\" y2=\"288.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"292.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"220.0\" x2=\"686\" y2=\"220.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"224.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">15<\/text><line x1=\"60\" y1=\"152.0\" x2=\"686\" y2=\"152.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"156.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">30<\/text><line x1=\"60\" y1=\"84.0\" x2=\"686\" y2=\"84.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"88.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">45<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">60<\/text><rect x=\"110.2\" y=\"136.8\" width=\"56.0\" height=\"151.2\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"138.2\" y=\"130.8\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">33.35B<\/text><text x=\"138.2\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2025<\/text><rect x=\"266.8\" y=\"116.0\" width=\"56.0\" height=\"172.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"294.8\" y=\"110.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">37.95B<\/text><text x=\"294.8\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2026<\/text><rect x=\"423.2\" y=\"75.4\" width=\"56.0\" height=\"212.6\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"451.2\" y=\"69.4\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">46.9B<\/text><text x=\"451.2\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2028<\/text><rect x=\"579.8\" y=\"56.8\" width=\"56.0\" height=\"231.2\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.15s\"/><text x=\"607.8\" y=\"50.8\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">51B<\/text><text x=\"607.8\" y=\"306.0\" font-size=\"12.5\" text-anchor=\"middle\">2029<\/text><\/svg><figcaption>The budget migration that forces every social platform toward the big screen: CTV ad spend is set to pass traditional TV around 2028. <span class=\"credit\">Source: eMarketer, Dec 2025 (Claim 1.9).<\/span><\/figcaption><\/figure>\n\n\n\n### 4.2 Who owns the CTV gardens — and who doesn't\n\nThe critical structural fact: **the social platforms owned almost none of it.** CTV inventory and identity concentrated in a distinct set of gatekeepers:\n\n- **Device/OS platforms:** Roku, Amazon Fire TV, Samsung (Tizen), LG (webOS), Google TV — these control the home screen, the ad-serving layer, and automatic content recognition (ACR) data from the panel itself.\n- **Streaming publishers:** Netflix, Disney+/Hulu, Paramount, NBCUniversal/Peacock, Warner Bros. Discovery, plus free ad-supported (FAST) services like Tubi, Pluto TV, and The Roku Channel.\n\nNone of these is Meta, LinkedIn, Pinterest, Reddit, or TikTok. A user who spent the evening watching a Roku stream was, from the social platform's perspective, invisible — a known daytime mobile user who vanished into someone else's garden at night. The social platforms had the *audience data* and none of the *big-screen supply*; the CTV gatekeepers had the *supply* and comparatively thin *audience data*. **The \"so what\": the entire social-to-CTV category is an arbitrage of that asymmetry — social platforms selling their data into other companies' screens.**\n\n### 4.3 Why social platforms had no native big-screen presence\n\nSocial products were built for the phone: short sessions, thumb-scrolling, personalized feeds, mobile-native creative. The living-room, lean-back, 10-foot experience was a different product, and Facebook, Instagram, Pinterest, and Reddit never built it. TikTok and Instagram had \"dabbled\" in long-form and CTV apps for years without traction [12][13]. The result was a decade-long absence from the one screen quietly becoming the most valuable in the house.\n\n---\n\n## 5. The Retail-Media Template: The Playbook the Social Platforms Copied\n\n**Answer first: Amazon and Walmart proved that a platform's first-party audience data could be packaged and extended onto other media — including CTV — as a business with 60%+ margins that captures 100% of the ad revenue; that proof-of-concept gave the social platforms both the strategic template and the investor permission to build the same thing on top of *their* first-party data.**\n\n### 5.1 What retail media proved\n\nA **retail-media network (RMN)** is an advertising business a retailer builds on its own shopper data — search ads on the retailer's site, plus off-site extension of that shopper data into display, video, and CTV. The economics are extraordinary. Retailers running RMNs are estimated to **capture ~100% of the ad revenue at 60%+ profit margins**, because the underlying asset — first-party purchase data — is already paid for [7]. Amazon's retail-media ad revenue was forecast to surpass **$60 billion in 2025**, and Amazon accounted for roughly **75% of U.S. retail-media spend in 2024** [6][7]. The U.S. retail-media market is projected to reach ~$105 billion by 2027 [6].\n\nThe template has three moves, and every social platform is now running the same three:\n1. **Own a logged-in first-party audience** (shoppers → social users).\n2. **Package that audience as targeting data** rather than selling only your own inventory.\n3. **Extend it onto premium media you don't own** — display, online video, and especially CTV.\n\n### 5.2 The CTV proof point: Walmart + Vizio\n\nWalmart made the template concrete for CTV. After acquiring the smart-TV maker **Vizio**, Walmart Connect combined first-party shopper data with CTV inventory and reported ~33% ad-revenue growth in a recent quarter, driven substantially by connected TV [6][21]. The social platforms are copying that exact structure, with one difference: Walmart *bought* the TV hardware (Vizio) and its ACR panel, while the social platforms mostly *rent* CTV inventory via DSP partnerships and, in Pinterest's case, buy a performance *layer* (tvScientific) rather than a TV maker.\n\n### 5.3 Why the template transferred\n\nThe retail-media proof did three things for the social platforms. It **de-risked the strategy**: the model demonstrably worked at scale. It **reframed the asset**: the product is the *audience data*, not the inventory — exactly the pivot ATT forced. And it **gave investors a comp**. When Pinterest's CEO Bill Ready framed the tvScientific deal around cross-screen performance, or when LinkedIn packaged professional data for CTV, the market already knew the shape of the business from Amazon and Walmart [6][10]. **The \"so what\": retail media turned \"extend your first-party data onto CTV\" from a novel idea into a proven, high-margin category — and the social platforms are the next cohort to run it.**\n\n---\n\n## 6. The 2024–2026 Wave: How the Category Was Built, Move by Move\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 300\" role=\"img\" aria-label=\"A horizontal timeline of how the social-to-CTV category was built between 2021 and 2026. A precursor shock in muted grey — Apple's App Tracking Transparency enforced in April 2021 — sits far left. Then a run of amber 'up onto the screen' milestones: LinkedIn launches CTV Ads in April 2024, Meta ships Instagram for TV and Pinterest agrees to buy tvScientific in December 2025, Pinterest closes that acquisition in February 2026, tvScientific by Pinterest launches CTV Audiences in April 2026, and LinkedIn CTV Ads go live on Amazon DSP in May 2026. A single coral node marks the lone retreat: TikTok's TV app shut down globally in June 2025.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THE 24-MONTH WAVE<\/text>\n<text x=\"350\" y=\"49\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">from a signal-loss shock to a live competitive field — and the one platform that walked back<\/text>\n<line x1=\"40\" y1=\"150\" x2=\"668\" y2=\"150\" fill=\"none\" class=\"ln cv-draw\" stroke-width=\"2.5\" pathLength=\"1\"/>\n<polygon points=\"662,144 676,150 662,156\" class=\"f-panel\" style=\"stroke:var(--border)\" stroke-width=\"1\"/>\n<text x=\"60\" y=\"270\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">2021 · precursor<\/text>\n<text x=\"620\" y=\"270\" text-anchor=\"end\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">2026 · live field →<\/text>\n<g class=\"cv-fade\">\n<line x1=\"70\" y1=\"150\" x2=\"70\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"70\" cy=\"150\" r=\"7\" class=\"f-bg\" stroke-width=\"2.5\" style=\"stroke:var(--muted)\"/>\n<text x=\"70\" y=\"106\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--muted)\">APR 2021<\/text>\n<text x=\"70\" y=\"92\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">ATT enforced<\/text>\n<text x=\"70\" y=\"130\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">signal shock<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"animation-delay:.12s\">\n<line x1=\"216\" y1=\"150\" x2=\"216\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"216\" cy=\"150\" r=\"8\" class=\"f-t1\"/>\n<text x=\"216\" y=\"200\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--t1)\">APR 2024<\/text>\n<text x=\"216\" y=\"214\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-acc\">LinkedIn CTV Ads<\/text>\n<text x=\"216\" y=\"227\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">the category begins<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"animation-delay:.24s\">\n<line x1=\"336\" y1=\"150\" x2=\"336\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"336\" cy=\"150\" r=\"8\" class=\"f-t5\"/>\n<text x=\"336\" y=\"106\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--t5)\">JUN 2025<\/text>\n<text x=\"336\" y=\"92\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--t5)\">TikTok TV shut down<\/text>\n<text x=\"336\" y=\"130\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">the lone retreat<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"animation-delay:.36s\">\n<line x1=\"440\" y1=\"150\" x2=\"440\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"440\" cy=\"150\" r=\"8\" class=\"f-t1\"/>\n<text x=\"440\" y=\"200\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--t1)\">DEC 2025<\/text>\n<text x=\"440\" y=\"214\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-acc\">Instagram for TV<\/text>\n<text x=\"440\" y=\"227\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">+ Pinterest to buy tvScientific<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"animation-delay:.48s\">\n<line x1=\"478\" y1=\"150\" x2=\"478\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"478\" cy=\"150\" r=\"8\" class=\"f-t1\"/>\n<text x=\"478\" y=\"106\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--t1)\">FEB 2026<\/text>\n<text x=\"478\" y=\"92\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-acc\">tvScientific closes<\/text>\n<text x=\"478\" y=\"130\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">deal completed<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"animation-delay:.60s\">\n<line x1=\"600\" y1=\"150\" x2=\"600\" y2=\"182\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"600\" cy=\"150\" r=\"8\" class=\"f-t1\"/>\n<text x=\"600\" y=\"200\" text-anchor=\"middle\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--t1)\">APR 2026<\/text>\n<text x=\"600\" y=\"214\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-acc\">CTV Audiences<\/text>\n<text x=\"600\" y=\"227\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">tvScientific by Pinterest<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"animation-delay:.72s\">\n<line x1=\"648\" y1=\"150\" x2=\"648\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"648\" cy=\"150\" r=\"8\" class=\"f-t1\"/>\n<text x=\"648\" y=\"106\" text-anchor=\"end\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--t1)\">MAY 2026<\/text>\n<text x=\"648\" y=\"92\" text-anchor=\"end\" font-size=\"9.5\" font-weight=\"bold\" class=\"t-acc\">LinkedIn on Amazon DSP<\/text>\n<text x=\"648\" y=\"130\" text-anchor=\"end\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">CTV Ads go live<\/text>\n<\/g>\n<text x=\"350\" y=\"288\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">a field that did not exist in early 2024 was live and contested by mid-2026 — every move amber but one<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The social-to-CTV category was built in roughly twenty-four months: from a standing start after Apple's ATT signal-loss shock, LinkedIn opened the field in April 2024 and by May 2026 it was a live, contested market — Meta, Pinterest, and tvScientific all pushing <em>up onto the screen<\/em>, with TikTok's shuttered TV app the lone retreat in the run.<\/figcaption>\n<\/figure>\n\n\n**Answer first: in roughly 24 months the category went from nonexistent to a live competitive field — LinkedIn led (product launch April 2024, DSP deals through 2026), Pinterest bought its way in (tvScientific, Dec 2025), Meta built a viewing app (Reels/Instagram TV, Dec 2025), while TikTok's earlier smart-TV app was pulled under the U.S. ban law and shut down (June 2025), leaving it the outlier. Each is a variation on the same audience-extension thesis, differentiated by whether the platform rents, buys, or builds — or, in TikTok's case, has retreated from — its CTV presence.**\n\nThis section is the inflection-point spine of the history: the moment the abstract strategic pressure of Sections 2–5 crystallized into named, dated, sourced moves. **Going-concern note:** each item below is a present-tense status claim entered as a discrete Key Claim (Section 9) with a dated source; several are very recent and could shift via a product rename, a deal falling through in regulatory review, or a pivot.\n\n### 6.1 LinkedIn — the first mover and the deepest player\n\nLinkedIn's strategy is the purest expression of the thesis. Its first-party asset — **professional identity** (job title, seniority, industry, company) across **1 billion+ members** — is uniquely valuable for B2B and has no substitute anywhere in the CTV ecosystem [9][15].\n\n- **April 2024 — CTV Ads launch.** At its \"B2Believe\" event in New York, LinkedIn unveiled **LinkedIn CTV Ads** plus **LinkedIn Premiere** (a managed offering built first with **NBCUniversal**) and Live Event Ads. Through Campaign Manager, advertisers could launch a CTV campaign and scale it across a publisher network including **Paramount, Roku, and Samsung Ads** [22][15]. This is the category's founding product move.\n- **Mid-2025 — publisher and tooling expansion.** LinkedIn added **Paramount** inventory to its **CTV Select** offering (formerly \"LinkedIn Premiere\"), added VAST video-tag capability powered by **Innovid**, and enabled its first CTV **API** use via **Sprinklr** [15]. (VAST — Video Ad Serving Template — is the standard that lets a marketer reuse existing video creative in a CTV buy.)\n- **March 2026 — The Trade Desk DSP deal.** LinkedIn named **The Trade Desk** its **first programmatic CTV DSP partner**, letting advertisers buy LinkedIn CTV programmatically against professional audiences; rollout targeted the **second half of 2026**, U.S.-first, initially in test with a small group of brands [11][23].\n- **May 7, 2026 — Amazon DSP deal.** Amazon Ads and LinkedIn announced LinkedIn CTV Ads available through **Amazon DSP** — the second DSP partner — routing LinkedIn's first-party signals to streaming inventory via **Microsoft Monetize** (the supply-side platform of LinkedIn's parent Microsoft, and an Amazon DSP preferred partner). U.S. only at launch [9][24].\n\nThe mechanical elegance: LinkedIn does not own a single stream. It sells *the professional identity graph* into Paramount/Roku/Samsung/NBCU inventory, activated through Amazon and The Trade Desk. A pure data-extension play.\n\n### 6.2 Pinterest — buying the performance engine (tvScientific)\n\nPinterest's asset is **shopping and planning intent** across ~600 million monthly users — Pins, boards, searches [10]. Rather than build a CTV capability or merely partner, Pinterest bought one.\n\n- **December 11, 2025 — agreement to acquire tvScientific.** Pinterest announced a definitive agreement to acquire **tvScientific**, a CTV *performance* advertising platform offering cost-per-outcome pricing, automated buying, AI optimization, and deterministic cross-screen attribution. Terms were undisclosed; the deal's regulatory review implies a value at or above the FTC's ~$126.4 million reporting threshold; Pinterest said it expects no material financial impact [10][25].\n- **Close and integration.** Expected to close in the **first half of 2026** (reporting indicates a February 2026 close), after which tvScientific integrates into Pinterest's performance suite — including **Pinterest Performance+** — and continues under its own branding [10][26]. CEO Bill Ready framed it around multi-screen shopping: \"People plan and shop across multiple screens and advertisers need performance solutions that reflect that reality\" [10].\n\nThe distinction from LinkedIn: Pinterest is buying a *measurement-and-buying engine* to turn CTV into a lower-funnel performance channel married to its intent data — closer to the retail-media performance template than to LinkedIn's B2B-reach template.\n\n### 6.3 Meta — building the viewing app (Instagram/Reels TV)\n\nMeta is the outlier. It is large enough to try to *build native big-screen viewing* rather than only export data. Its asset is scale — Reels reached a **~$50 billion annual run rate** (vs. YouTube ads at ~$41 billion), per Zuckerberg's October 2025 comments — but it lacked a TV app to capture living-room attention [13][27].\n\n- **December 2025 — Instagram for TV pilot.** Instagram launched a pilot **Instagram/Reels TV app** on Amazon **Fire TV**, U.S.-only, personalized to the content and creators a user follows [13][27].\n- **February 24, 2026 — Google TV expansion.** Meta brought the Instagram Reels TV app to **Google TV** in the U.S. [28].\n\nMeta's play is strategically different: it is trying to *own* CTV viewing, and therefore the inventory, not merely rent it. Whether short-form vertical Reels translate to the lean-back big screen remains an open question (Section 8).\n\n### 6.4 TikTok — the long-running, low-traction smart-TV app\n\nTikTok has pursued CTV the longest and with the least clear payoff. It launched **TikTok TV** apps starting 2020–2021 across **Fire TV, Google/Android TV, Samsung, and LG** [12][29]. Reporting consistently notes that the earlier app \"failed to gain traction,\" and that both TikTok and Instagram had \"dabbled\" in CTV without a breakout [12]. Then the U.S. ban law caught up with it: in January–February 2025 Amazon, Google, Samsung, LG, and Vizio pulled the TikTok TV app from their platforms, and the app was reported to shut down on 15 June 2025 — so, unlike the mobile app (which returned in February 2025 after the U.S. divestiture JV closed in January 2026), TikTok's *present-tense* smart-TV presence is unconfirmed as of mid-2026. U.S. regulatory and ownership uncertainty over the app itself sits atop any CTV ambition.\n\n### 6.5 Reddit — the credible next entrant, not yet a mover\n\nReddit's asset is the **interest-and-community graph** — what people are genuinely into, expressed in communities. As of this research window, the public record shows Reddit expanding its ad business and first-party-data positioning but **no confirmed native CTV product or CTV-DSP deal** comparable to LinkedIn's or Pinterest's. It is best characterized as a *credible but unproven* future entrant rather than a current participant — flagged here to avoid asserting a status the record does not support (see Open Questions).\n\n### 6.6 The shape of the field\n\n| Platform | First-party asset | CTV strategy | Approach | Key dated proof point |\n|---|---|---|---|---|\n| LinkedIn | Professional identity (1B+ members) | Rent inventory, sell data | Partner + DSP deals | CTV Ads launch Apr 2024; Amazon DSP May 7 2026 |\n| Pinterest | Shopping/planning intent (~600M) | Buy a performance engine | Acquisition | tvScientific agreement Dec 11 2025 |\n| Meta | Scale (Reels ~$50B run rate) | Build viewing app / own inventory | Owned app | Instagram TV pilot Dec 2025; Google TV Feb 24 2026 |\n| TikTok | Interest graph (mass scale) | Own viewing app | Owned app (low traction) | TikTok TV apps 2020–2021; pulled by OS platforms early 2025 under the U.S. ban law, CTV status unconfirmed mid-2026 |\n| Reddit | Community/interest graph | Not yet a defined CTV product | TBD | No confirmed CTV product in window |\n\n---\n\n## 7. The Throughline: Audience Extension as the Answer to Signal Loss and the Mobile Plateau\n\n**Answer first: read as one arc, every move above is the same sentence — \"our first-party audience is more durable than our targeting used to be, and more valuable off-platform than the incremental mobile impression we can no longer sell as well, so we will extend it onto the screen where attention now lives.\"**\n\nThe causal chain that produced the category:\n\n1. **Attention moved to CTV** (streaming passed broadcast+cable, May 2025) while social engagement matured — the incremental mobile impression became harder to grow and harder to target [8].\n2. **ATT (2021) broke mobile targeting/measurement** by removing the cross-app identifier; ~75% opt-out; Meta's ~$10B guidance made the damage undeniable [1][2][3].\n3. **The cookie threat (2020–2024)** reinforced the lesson even though it fizzled — build on first-party data, not borrowed identifiers [4][5].\n4. **Retail media proved the escape route:** package first-party data, extend it onto other media (incl. CTV), earn 60%+ margins — Amazon >$60B, Walmart+Vizio [6][7][21].\n5. **The social platforms ran the same play** on their own first-party graphs, 2024–2026 — LinkedIn (professional identity), Pinterest (intent), Meta (scale), TikTok (interest) [9][10][13][12].\n\nThe inflection point — the moment \"social-to-CTV retargeting\" became a *category* rather than a set of one-off experiments — is best dated to the **April 2024 LinkedIn CTV Ads launch**. The **December 2025 Pinterest–tvScientific deal** turned it into a competitive land-grab; the **May 2026 LinkedIn–Amazon DSP deal** turned it from a managed-service novelty into programmatic infrastructure.\n\n**The \"so what\" for an advertiser or investor:** the durable winners will be the platforms whose first-party data is both hardest to replicate elsewhere and most useful for CTV targeting. On that test, LinkedIn's professional graph is the strongest moat — no one else has it. Pinterest's purchase intent is the most performance-ready. Meta's scale is the biggest but least differentiated. TikTok's and Reddit's positions remain the least proven on the big screen.\n\n---\n\n## 8. Open Questions\n\n1. **Does audience extension actually retarget, or just reach?** The platforms claim CTV lets them *retarget* their audiences; critics note CTV matching is probabilistic/household-level, not the deterministic 1:1 the mobile IDFA once offered. How close does hashed-email / IP-plus-device matching get to true retargeting fidelity? (Technical workstream.)\n2. **Rent vs. build vs. buy — which wins?** LinkedIn rents inventory and sells data; Pinterest bought a performance engine; Meta is building a viewing app. Which structure captures the most durable margin? Retail media suggests owning the panel (Walmart/Vizio) matters — does that favor Meta's owned-app path long term?\n3. **Will Meta's owned-app bet actually capture living-room viewing,** or will vertical short-form Reels fail to translate to the 10-foot lean-back experience the way TikTok's earlier CTV app did? [12][13]\n4. **Reddit's actual status.** Does Reddit have (or will it launch) a native CTV product or CTV-DSP partnership? The record in this window does not confirm one; this is a live gap.\n5. **Regulatory exposure of the identity plumbing.** Social-to-CTV extension relies on matching first-party data (often hashed emails) into third-party inventory — precisely the data-sharing states and the EU scrutinize. How exposed is the category to a future privacy regime, given ATT/cookies were only the first wave?\n6. **TikTok ownership overhang.** How does the unresolved U.S. status of TikTok itself constrain any TikTok CTV ambition?\n7. **Does the cookie's survival matter?** With third-party cookies alive after all, is the urgency behind first-party-data/CTV strategy reduced — or is CTV migration self-sustaining regardless? (Section 3 argues the latter; worth testing.)\n8. **Margin capture along the chain.** With DSPs (Amazon, The Trade Desk), SSPs (Microsoft Monetize), and publishers (Paramount, Roku) all in the LinkedIn value chain, who actually captures the spread — and how much is left for the social platform whose data started it? (Commercial workstream.)\n\n---\n\n## 9. Key Claims\n\n> Stakes tags: **load-bearing** (the corpus's arc depends on it), **standard**, **minor**. `single_source` flagged honestly. Present-tense status claims carry the most recent dated confirmation found.\n\n**Claim 1.1 — ATT enforcement date.** *Established. Standard. Not single-source.* Apple made App Tracking Transparency mandatory with iOS 14.5 in **April 2021**, requiring apps to request permission before tracking users across other apps/sites. Evidence: multiple independent explainers plus Apple's own documentation [1][14][16].\n\n**Claim 1.2 — ATT opt-out magnitude.** *Established. Load-bearing. Not single-source.* The majority of users opted out of tracking under ATT (global opt-in ~15–25%; social-platform opt-out commonly cited ~75%), sharply degrading cross-app mobile targeting and measurement. Evidence: converging vendor and academic estimates [1][16][3]. *Caveat: exact opt-in figures vary by source and methodology.*\n\n**Claim 1.3 — Meta's quantified ATT hit.** *Established. Load-bearing. Not single-source.* Meta's CFO guided investors in February 2022 that iOS/ATT changes would represent a headwind \"on the order of **$10 billion**\" in 2022. Evidence: CNBC and MacRumors reporting of Meta's earnings guidance [2][3].\n\n**Claim 1.4 — Sector-wide ATT revenue estimates.** *Contested/inference. Standard. Single-source (Lotame).* A Lotame study estimated 2022 losses of ~$12.8B (Meta), ~$2.2B (YouTube), ~$546M (Snap), ~$323M (Twitter). Evidence: Lotame via CDP Institute [17]. *Flagged single-source and vendor-interested; rank order corroborated by companies' own disclosures, specific dollar figures are an interested estimate.*\n\n**Claim 1.5 — Cookie deprecation announced 2020.** *Established. Standard. Not single-source.* Google announced in January 2020 that Chrome would block third-party cookies and replace them with the Privacy Sandbox. Evidence: multiple privacy-industry explainers [4][5].\n\n**Claim 1.6 — Cookie deprecation abandoned 2024–2025.** *Established. Load-bearing. Not single-source.* Google abandoned forced third-party-cookie deprecation in July 2024, dropped even the choice prompt in April 2025, and retired core Privacy Sandbox APIs by October 2025; third-party cookies remain in Chrome with no removal timeline. Evidence: AdExchanger, digitalcommerce360, Usercentrics [4][5]. **Going-concern (present-tense):** as of the research window third-party cookies remain live in Chrome.\n\n**Claim 1.7 — Streaming passed broadcast+cable (May 2025).** *Established. Load-bearing. Not single-source.* Per Nielsen, streaming's share of U.S. TV viewing (44.8%) exceeded combined broadcast (20.1%) + cable (24.1% = 44.2%) for the first time in May 2025. Evidence: Nielsen Gauge (primary), corroborated by Variety, Deadline, Hollywood Reporter [8].\n\n**Claim 1.8 — Streaming share reached 47.5% (Dec 2025).** *Established. Standard. Not single-source.* Streaming captured a record 47.5% of U.S. TV viewing time in December 2025 (Nielsen). Evidence: eMarketer citing Nielsen [19][8].\n\n**Claim 1.9 — U.S. CTV ad spend scale.** *Established. Load-bearing. Not single-source.* U.S. CTV ad spend was ~$33.35B in 2025 and forecast (eMarketer, Dec 2025) to grow ~14.5% to ~$37.95B in 2026, tracking toward ~$46.9B by 2028 and ~$51B by 2029. Evidence: eMarketer/adwave/MNTN [19][20]. *Forecast years are projections.*\n\n**Claim 1.10 — Amazon retail-media scale.** *Established. Load-bearing. Not single-source.* Amazon's retail-media ad revenue was forecast to surpass **$60 billion in 2025** and Amazon held ~75% of U.S. retail-media spend in 2024. Evidence: retail-media industry analyses [6][7]. **Going-concern:** present-tense scale claim; 2025 figure is a forecast within the window.\n\n**Claim 1.11 — RMN margin economics.** *Established/inference. Load-bearing. Not single-source.* Retail-media networks are estimated to let retailers capture ~100% of ad revenue at 60%+ margins, establishing the high-margin first-party-data-extension template social platforms copied. Evidence: retail-media guides [7]. *Margin figures are industry estimates, directionally corroborated across sources.*\n\n**Claim 1.12 — Walmart Connect + Vizio CTV growth.** *Established. Standard. Not single-source.* Walmart Connect combined first-party shopper data with CTV (post-Vizio acquisition) and reported ~33% ad-revenue growth in a recent quarter, driven substantially by CTV. Evidence: retail-media/invidis reporting [6][21]. **Going-concern:** present-tense operating status of Walmart Connect + Vizio integration.\n\n**Claim 1.13 — LinkedIn CTV Ads launch (Apr 2024).** *Established. Load-bearing. Not single-source.* LinkedIn launched **CTV Ads** plus **LinkedIn Premiere** (with NBCUniversal) in **April 2024**, scalable across a publisher network including **Paramount, Roku, and Samsung Ads** via Campaign Manager. Evidence: Marketing Brew, Next TV, LinkedIn newsroom [22][15]. **Going-concern:** founding product-status claim.\n\n**Claim 1.14 — LinkedIn's first-party professional asset.** *Established. Standard. Not single-source.* LinkedIn's CTV pitch rests on first-party professional signals (job title, industry, seniority) across **1 billion+ members**. Evidence: Amazon Ads newsroom, Marketing Dive [9][24].\n\n**Claim 1.15 — LinkedIn × The Trade Desk (first DSP, Mar 2026).** *Established. Load-bearing. Not single-source.* LinkedIn named **The Trade Desk** its **first programmatic CTV DSP partner** (announced March 2026; rollout targeted H2 2026, U.S.-first, initially in test). Evidence: The Trade Desk press room, secondary reporting [11][23]. **Going-concern:** present-tense partnership/rollout status; rollout was forward-dated at announcement.\n\n**Claim 1.16 — LinkedIn × Amazon DSP (second DSP, May 7 2026).** *Established. Load-bearing. Not single-source.* On **May 7, 2026**, Amazon Ads and LinkedIn announced LinkedIn CTV Ads available through **Amazon DSP** (second DSP partner), routing LinkedIn signals to streaming inventory via **Microsoft Monetize**; U.S. only at launch. Evidence: Amazon Ads newsroom (primary), Marketing Dive, eMarketer [9][24]. **Going-concern:** most-recent, present-tense deal status.\n\n**Claim 1.17 — Pinterest–tvScientific agreement (Dec 11 2025).** *Established. Load-bearing. Not single-source.* Pinterest announced (**December 11, 2025**) a definitive agreement to acquire CTV performance platform **tvScientific**; terms undisclosed; regulatory review implies value ≥ ~$126.4M FTC threshold; expected close H1 2026 (reported Feb 2026); integrates into Pinterest Performance+. Evidence: Pinterest newsroom (primary), AdExchanger, Marketing Dive [10][25][26]. **Going-concern:** present-tense deal/close status; verify close completed.\n\n**Claim 1.18 — Pinterest's intent asset and scale.** *Established. Standard. Not single-source.* Pinterest's CTV rationale rests on intent-rich signals (Pins, boards) across ~600 million users. Evidence: Pinterest newsroom, secondary reporting [10]. *User-count figures vary by report/date.*\n\n**Claim 1.19 — Meta Instagram/Reels TV app (Dec 2025).** *Established. Load-bearing. Not single-source.* Meta launched a pilot **Instagram/Reels TV app** on Amazon **Fire TV** (U.S.) in **December 2025**, expanding to **Google TV** on **February 24, 2026**. Evidence: Variety, Hollywood Reporter, Axios, Social Media Today [13][27][28]. **Going-concern:** present-tense product status.\n\n**Claim 1.20 — Reels run-rate scale.** *Established. Minor. Not single-source.* Zuckerberg told analysts (October 2025) Reels had reached a ~$50 billion annual run rate vs. YouTube ads ~$41 billion. Evidence: eMarketer/Variety reporting of Meta remarks [13][27]. *Company-stated figure.*\n\n**Claim 1.21 — TikTok CTV apps exist but lack traction.** *Established/contested. Standard. Not single-source.* TikTok launched TikTok TV apps 2020–2021 across Fire TV, Google/Android TV, Samsung, LG; reporting characterizes the earlier CTV app as having \"failed to gain traction.\" Evidence: Social Media Today, Next TV, eMarketer [12][29]. **Going-concern:** present-tense app existence; \"traction\" is a characterization, not a metric.\n\n**Claim 1.22 — Reddit is not (yet) a confirmed social-to-CTV participant.** *Inference. Standard. Not single-source (absence-of-evidence).* The research window shows no confirmed native Reddit CTV product or CTV-DSP deal comparable to LinkedIn/Pinterest; Reddit is characterized as a credible-but-unproven future entrant, not a current mover. Evidence: absence in CTV-strategy coverage that names peers [30]. *Flagged as an absence claim to avoid asserting an unsupported status; revisit in gap-fill.*\n\n**Claim 1.23 — The category's founding inflection is dateable.** *Inference. Load-bearing. Not single-source.* \"Social-to-CTV retargeting\" cohered as a category with LinkedIn's April 2024 CTV Ads launch, became a competitive land-grab with the December 2025 Pinterest–tvScientific deal, and became programmatic infrastructure with the May 2026 LinkedIn–Amazon DSP deal. Evidence: synthesis of dated moves [22][10][9]. *Inference/framing claim built on established underlying facts.*\n\n**Claim 1.24 — Signal loss is the proximate cause.** *Inference. Load-bearing. Not single-source.* The category is best explained as audience extension in response to signal loss (ATT/cookies) plus a mobile-engagement plateau, using the retail-media template. Evidence: causal synthesis of Claims 1.1–1.12 [1][2][6][8]. *Interpretive throughline, not a single sourced fact.*\n\n---\n\n## Sources\n\n1. Usercentrics, \"Apple App Tracking Transparency: What you need to know,\" knowledge hub (accessed 2026-06-30). Tier 5 (privacy-tech vendor; note commercial lean). https://usercentrics.com/knowledge-hub/apples-app-tracking-transparency-att/ — ATT mechanics, iOS 14.5 April 2021 enforcement, opt-out framing.\n2. CNBC, \"Facebook says Apple iOS privacy change will result in $10 billion revenue hit this year,\" 2022-02-02 (accessed 2026-06-30). Tier 3–4. https://www.cnbc.com/2022/02/02/facebook-says-apple-ios-privacy-change-will-cost-10-billion-this-year.html — Meta's ~$10B 2022 guidance.\n3. MacRumors, \"Apple's Privacy Measures to Cost Facebook $10 Billion in 2022,\" 2022-02-03 (accessed 2026-06-30). Tier 5 (tech press). https://www.macrumors.com/2022/02/03/facebook-10-billion-in-2022-apple-measures/ — corroborates Meta guidance; ~75% opt-out framing.\n4. AdExchanger, \"Google Pulls The Plug On Topics, PAAPI And Other Major Privacy Sandbox APIs,\" 2025 (accessed 2026-06-30). Tier 5 (ad-tech trade; note industry proximity). https://www.adexchanger.com/privacy/google-pulls-the-plug-on-topics-paapi-and-other-major-privacy-sandbox-apis-as-the-cma-says-cheerio/ — Privacy Sandbox API retirement, Oct 2025.\n5. Digital Commerce 360 / Usercentrics, \"Google ends its third-party cookies deprecation plans for Chrome,\" 2024-07-24 (accessed 2026-06-30). Tier 5. https://www.digitalcommerce360.com/2024/07/24/third-party-cookies-deprecation-google-chrome/ — 2020 announcement, July 2024 reversal, April 2025 second reversal.\n6. Invidis / flipflow retail-media analyses, \"Retail Media: Walmart Challenges Tech Giants\" (Jan 2026) and 2026 RMN budget guides (accessed 2026-06-30). Tier 5 (industry analysis; note lean). https://invidis.com/news/2026/01/retail-media-walmart-challenges-tech-giants/ — Amazon >$60B, ~75% share, Walmart Connect + Vizio, market size.\n7. Marketing LTB / retail-exec / osmos retail-media stats compilations (accessed 2026-06-30). Tier 5 (industry, estimates). https://theretailexec.com/retail-operations/retail-media-networks/ — 100%-capture / 60%+ margin economics (industry estimate).\n8. Nielsen, \"Streaming Reaches Historic TV Milestone... For First Time,\" news center, June 2025 (accessed 2026-06-30). Tier 1–2 (measurement primary). https://www.nielsen.com/news-center/2025/streaming-reaches-historic-tv-milestone-eclipses-combined-broadcast-and-cable-viewing-for-first-time/ — May 2025 44.8% vs 44.2%; Dec 2025 47.5%; Gauge trend. Corroborated by Variety, Deadline, Hollywood Reporter.\n9. Amazon Ads, \"LinkedIn CTV Ads are now available through Amazon DSP,\" newsroom, 2026-05-07 (accessed 2026-06-30). Tier 1 (company primary; corroborate claims independently). https://advertising.amazon.com/library/news/linkedin-ctv-ads-amazon-dsp — May 7 2026 deal, Microsoft Monetize, 1B+ members, U.S.-only.\n10. Pinterest, \"Pinterest to Acquire tvScientific, Expanding Performance Advertising to Connected TV,\" newsroom, 2025-12-11 (accessed 2026-06-30). Tier 1 (company primary). https://newsroom.pinterest.com/news/pinterest-tvscientific/ — Dec 11 2025 agreement, tvScientific product, H1 2026 close, Performance+ integration, Ready quote.\n11. The Trade Desk, \"LinkedIn Partners With the Trade Desk for CTV Ads,\" press room, March 2026 (accessed 2026-06-30). Tier 1 (company primary). https://www.thetradedesk.com/press-room/linkedin-partners-with-the-trade-desk-for-ctv-ads — first DSP partner, H2 2026 rollout, test phase.\n12. Social Media Today / Next TV / eMarketer, TikTok & Instagram CTV coverage (accessed 2026-06-30). Tier 4–5. https://www.socialmediatoday.com/news/tiktok-brings-its-connected-tv-app-to-more-users-in-the-us/610465/ ; https://www.emarketer.com/content/instagram-tiktok-ctv-play-could-reap-ad-benefits-face-format-hurdles — TikTok TV rollout, \"failed to gain traction,\" format hurdles.\n13. Variety / Hollywood Reporter / Axios, \"Instagram for TV\" launch coverage, Dec 2025 (accessed 2026-06-30). Tier 4–5. https://variety.com/2025/digital/news/instagram-for-tv-reels-videos-1236609143/ — Dec 2025 Fire TV pilot; Reels ~$50B run rate (Zuckerberg, Oct 2025).\n14. AppsFlyer, \"App Tracking Transparency (ATT)\" glossary (accessed 2026-06-30). Tier 5 (measurement vendor). https://www.appsflyer.com/glossary/app-tracking-transparency/ — IDFA/MAID mechanics, permission-prompt flow.\n15. StreamTV Insider / AdExchanger / thedesk.net, LinkedIn CTV Select / Paramount / Innovid / Sprinklr coverage, 2025 (accessed 2026-06-30; StreamTV Insider returned 403 on direct fetch — details drawn from AdExchanger and thedesk.net). Tier 4–5. https://www.adexchanger.com/tv/linkedin-is-all-business-with-ctv/ ; https://thedesk.net/2025/06/linkedin-ctv-ads-partnership-paramount-innovid/ — CTV Select (formerly Premiere), Paramount inventory, VAST via Innovid, first CTV API via Sprinklr.\n16. FTC / Apple ATT economic-impact materials and Apple's April 2022 \"Mobile Advertising and the Impact of ATT\" doc (accessed 2026-06-30). Tier 1–2 (primary/Apple-commissioned — note Apple interest). https://www.apple.com/privacy/docs/Mobile_Advertising_and_the_Impact_of_Apples_App_Tracking_Transparency_Policy_April_2022.pdf — price effects (~23% impression-price decline), opt-in ranges.\n17. Lotame study via CDP Institute, \"Apple ATT Will Cost Meta $12.8 Billion in Revenue in 2022\" (accessed 2026-06-30). Tier 5 (vendor study; flagged single-source and interested). https://www.cdpinstitute.org/news/apple-att-will-cost-meta-12-8-billion-in-2022-lotame-study/ — sector loss estimates ($12.8B Meta, $2.2B YouTube, $546M Snap, $323M Twitter).\n18. Skiera et al., \"Economic Impact of Opt-in versus Opt-out Requirements...\" (FTC-hosted PDF) (accessed 2026-06-30). Tier 2 (academic). https://www.ftc.gov/system/files/ftc_gov/pdf/3-Skiera-Economic-Impact-of-Opt-in-versus-Opt-out-Requirements-for-Personal-Data-Usage.pdf — 14–97% trackable-traffic price premium across 19 countries.\n19. eMarketer / adwave / MNTN, U.S. CTV ad-spend forecasts (Dec 2025 update) (accessed 2026-06-30). Tier 5 (forecast analysts). https://www.emarketer.com/content/measurement-maturity--curation-s-center-stage--ai-optimization--ctv-trends-2026 ; https://research.mountain.com/trends/ctv-ad-spend-will-grow-to-46-89-billion-by-2028/ — $33.35B (2025), ~$37.95B / +14.5% (2026), ~$46.9B (2028), ~$51B (2029); 47.5% Dec 2025 streaming share.\n20. Statista, \"CTV ad spend in the U.S. 2025–2029\" (accessed 2026-06-30). Tier 5 (data aggregator). https://www.statista.com/statistics/1048897/connected-tv-ad-spend-usa/ — corroborates spend trajectory.\n21. AInvest / invidis, \"Walmart+'s Streaming Strategy\" and Walmart Connect + Vizio CTV growth (accessed 2026-06-30). Tier 5. https://www.ainvest.com/news/walmart-streaming-strategy-win-retail-media-synergy-2509/ — ~33% Walmart Connect growth, CTV-driven, post-Vizio.\n22. Marketing Brew / Next TV / LinkedIn newsroom, \"LinkedIn debuts CTV ads...\" April 2024 (accessed 2026-06-30). Tier 1 (LinkedIn newsroom) + Tier 4–5. https://www.marketingbrew.com/stories/2024/04/03/linkedin-ctv-ads-marketing-summit ; https://news.linkedin.com/2024/April/LinkedIn_CTV_and_live_ads — April 2024 launch, NBCUniversal Premiere, Paramount/Roku/Samsung network.\n23. The Keyword / secondary reporting on LinkedIn–Trade Desk CTV (accessed 2026-06-30). Tier 5. https://www.thekeyword.co/news/linkedin-ctv-trade-desk-b2b-advertising — H2 2026 rollout, U.S.-first, test phase.\n24. Marketing Dive / eMarketer, \"Amazon, LinkedIn help advertisers reach professionals via CTV ads,\" May 2026 (accessed 2026-06-30). Tier 5. https://www.marketingdive.com/news/amazon-linkedin-help-advertisers-reach-professionals-via-ctv-ads/819372/ — May 7 2026 deal detail, Microsoft Monetize, job title/industry/seniority.\n25. AdExchanger, \"Pinterest Acquires CTV Startup tvScientific,\" Dec 2025 (accessed 2026-06-30). Tier 5. https://www.adexchanger.com/tv/pinterest-acquires-ctv-startup-tvscientific-didnt-ctv-that-coming/ — deal analysis, FTC threshold inference.\n26. Marketing Dive, \"Pinterest expands into CTV advertising with tvScientific acquisition,\" Dec 2025 (accessed 2026-06-30). Tier 5. https://www.marketingdive.com/news/pinterest-expands-into-ctv-advertising-tvscientific-acquisition/807749/ — close timing, integration.\n27. eMarketer, \"Instagram brings Reels to TV, chasing new ad growth on the big screen,\" Dec 2025 (accessed 2026-06-30). Tier 5. https://www.emarketer.com/content/instagram-brings-reels-tv-chasing-new-ad-growth-on-big-screen — Reels run-rate, big-screen ad rationale.\n28. Social Media Today, \"Instagram's connected TV app comes to US Google TV devices,\" Feb 2026 (accessed 2026-06-30). Tier 5. https://www.socialmediatoday.com/news/instagrams-connected-tv-app-comes-to-us-google-tv-devices/813165/ — Feb 24 2026 Google TV expansion.\n29. Next TV, \"TikTok Makes Further U.S. Connected TV Push...Android TV, Google TV, Samsung and LG OS\" (accessed 2026-06-30). Tier 4–5. https://www.nexttv.com/news/tiktok-makes-further-us-connected-tv-push-with-app-support-on-smart-tvs-powered-by-android-tv-google-tv-samsung-and-lg-os — TikTok TV platform support.\n30. Basis / AI Digital / Aarki CTV-landscape 2026 guides (accessed 2026-06-30). Tier 5 (used only as absence-of-evidence for Reddit; note lean). https://basis.com/blog/6-things-to-know-about-the-streaming-tv-landscape-in-2026 — CTV strategy coverage naming social peers without a Reddit CTV product.\n\n---\n\n*Compiled 2026-06-30. History pillar. Register: McKinsey brief — answer-first, acronyms decoded inline, sourced quantification. Present-tense product/deal/entity statuses are entered as discrete going-concern Key Claims with the most recent dated confirmation found; the LinkedIn–Amazon DSP deal (May 7 2026) is the most recent load-bearing status. Company newsrooms (Pinterest, Amazon Ads, The Trade Desk, LinkedIn) are cited as Tier 1 for what the entity claims, not as proof the claim is true; independent corroboration attached where available. Vendor/forecast figures (Lotame, eMarketer, RMN margins) flagged for lean and interest.*"}, {"order": 2, "file": "02_Plumbing_Identity_Mechanics.md", "title": "The Plumbing — Identity and Retargeting Mechanics of Social-to-CTV", "summary": "", "body": "# The Plumbing — Identity and Retargeting Mechanics of Social-to-CTV\n\n## Bottom Line\n\nSocial-to-CTV retargeting takes a social platform's **first-party signal** — the record of who logged in and engaged, built from an authenticated email — and turns it into a **household** that can be served an ad on a television screen. Four identifiers do the bridging: the **hashed email (HEM)**, a one-way scramble of a login or purchase email; the **mobile advertising ID (MAID)** — Apple's IDFA or Google's GAID, one per device; the **IP address plus geo**; and the **CTV ID**, a household-scoped identifier derived from smart-TV **automatic content recognition (ACR)** or a streaming app's software kit. An **identity graph** — LiveRamp's is the reference example — stitches these together, resolving many signals to one person and then to one household. The single most important fact in this section is a mismatch: the social platform knows an *individual* (a logged-in professional, a Pinterest saver), but the CTV ID identifies a *household* — the television, not the viewer. Everything downstream inherits that imprecision.\n\nThe load-bearing mechanism is the **data clean room** — a neutral, privacy-safe environment (AWS Clean Rooms, Snowflake, LiveRamp, the former Habu and InfoSum) where a social platform and a streamer or retailer match audiences and exposure-to-conversion data without either side seeing the other's raw user-level records. Clean rooms are what make LinkedIn–Amazon and Pinterest–tvScientific style deals legally and technically possible; by 2025 the standalone-vendor version had largely been absorbed into the cloud platforms themselves. Match rates are the perennial soft spot: authenticated publisher-to-CRM matches can run high, but blind CRM-to-publisher overlaps commonly land around 50% and unauthenticated CTV matching via IP runs roughly 40–70%. Measurement is the other soft spot. CTV has **no click**, so last-touch attribution collapses, and the industry patches the gap with incrementality tests, marketing-mix modeling (MMM), and view-through — each of which introduces its own circularity. Read this section as the McKinsey exhibit that shows *how* the bridge carries weight, and exactly where the joints are weakest.\n\n---\n\n## 1. The Problem the Plumbing Solves\n\nStart with the motivation, not the mechanics. A social platform's core asset is its **first-party data**: information a company collects directly from its own users through a logged-in relationship. On LinkedIn that is job title, industry, and seniority across a stated 1 billion-plus members [1]. On Pinterest it is saved pins and declared shopping intent. On Reddit it is subreddit engagement. This data is deterministic and rich *inside the platform's own app*. The problem is that the living-room television is **not** the platform's app. To place an ad in front of the same person while they watch ad-supported streaming, the platform must carry its in-app signal across an air gap into an environment it does not own — the streaming publisher's inventory, brokered through a demand-side platform (DSP), the software advertisers use to buy ad impressions programmatically.\n\nTwo forms of **signal loss** made this bridge necessary rather than optional. Apple's App Tracking Transparency (ATT), rolled out from 2021, forced apps to ask permission before accessing the IDFA; opt-in was low, and the supply of usable iOS mobile IDs \"declined materially\" as a result [2]. In parallel, the third-party cookie — the cross-site tracking pixel that once glued a browsing history together — has been in retreat across browsers. Both losses pushed social platforms toward *authenticated, first-party* identity spines (the logged-in email) and toward *household* signals (IP, CTV ID) that survive where the mobile ID and the cookie do not. The plumbing below is the workaround the industry built once its old identifiers stopped working.\n\n---\n\n## 2. The Four Bridging Signals — Decoded\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 396\" role=\"img\" aria-label=\"A diagram of the social-to-CTV handoff: a phone on the left holding an individual first-party signal (hashed email and mobile ad ID) is resolved through an identity graph to a household, matched in a clean room at roughly fifty percent, then served as an impression to a television on the right. Coral drips below mark the losses: match-rate leakage and the no-click measurement break.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">THE LIVING-ROOM HANDOFF<\/text>\n<text x=\"350\" y=\"49\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">one phone signal, resolved to a household on the big screen — and what leaks between<\/text>\n<rect x=\"40\" y=\"150\" width=\"88\" height=\"150\" rx=\"12\" class=\"f-bg\" stroke-width=\"2\" style=\"stroke:var(--t2)\"/>\n<rect x=\"52\" y=\"168\" width=\"64\" height=\"104\" rx=\"3\" class=\"f-t2\" opacity=\".16\"/>\n<text x=\"84\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-acc\" font-weight=\"bold\">INDIVIDUAL<\/text>\n<text x=\"84\" y=\"212\" text-anchor=\"middle\" font-size=\"11\" class=\"t-mono\" style=\"fill:var(--t2)\">HEM<\/text>\n<text x=\"84\" y=\"232\" text-anchor=\"middle\" font-size=\"11\" class=\"t-mono\" style=\"fill:var(--t2)\">MAID<\/text>\n<text x=\"84\" y=\"316\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">logged-in<\/text>\n<text x=\"84\" y=\"328\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">engagement<\/text>\n<path d=\"M134,225 L214,225\" fill=\"none\" class=\"s-t2 cv-draw\" stroke-width=\"10\" pathLength=\"1\" opacity=\".9\"/>\n<polygon points=\"210,217 226,225 210,233\" class=\"f-t2\"/>\n<circle cx=\"286\" cy=\"225\" r=\"52\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<text x=\"286\" y=\"205\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\">identity graph<\/text>\n<text x=\"286\" y=\"222\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">HEM · MAID · IP<\/text>\n<text x=\"286\" y=\"238\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\">→ one person<\/text>\n<text x=\"286\" y=\"255\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-acc\" font-weight=\"bold\">→ household<\/text>\n<path d=\"M342,225 L400,225\" fill=\"none\" class=\"s-t3 cv-draw\" stroke-width=\"8\" pathLength=\"1\" opacity=\".9\"/>\n<polygon points=\"396,217 412,225 396,233\" class=\"f-t3\"/>\n<rect x=\"414\" y=\"196\" width=\"74\" height=\"58\" rx=\"5\" class=\"f-bg\" stroke-width=\"1.5\" style=\"stroke:var(--t3)\"/>\n<text x=\"451\" y=\"219\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--t3)\">clean<\/text>\n<text x=\"451\" y=\"233\" text-anchor=\"middle\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--t3)\">room<\/text>\n<text x=\"451\" y=\"248\" text-anchor=\"middle\" font-size=\"9\" class=\"t-mono\" style=\"fill:var(--t5)\">~50%<\/text>\n<path d=\"M492,225 L536,225\" fill=\"none\" class=\"s-t1 cv-draw\" stroke-width=\"6\" pathLength=\"1\"/>\n<polygon points=\"532,218 546,225 532,232\" class=\"f-t1\"/>\n<rect x=\"548\" y=\"150\" width=\"120\" height=\"86\" rx=\"7\" class=\"f-t1\" opacity=\".9\"/>\n<rect x=\"561\" y=\"163\" width=\"94\" height=\"60\" rx=\"3\" class=\"f-bg\" opacity=\".22\"/>\n<rect x=\"596\" y=\"236\" width=\"24\" height=\"16\" class=\"f-t1\" opacity=\".9\"/>\n<rect x=\"576\" y=\"252\" width=\"64\" height=\"6\" rx=\"3\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"608\" y=\"140\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-acc\" font-weight=\"bold\">HOUSEHOLD<\/text>\n<text x=\"608\" y=\"198\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">CTV<\/text>\n<text x=\"608\" y=\"214\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"bold\" class=\"t-inv\">impression<\/text>\n<line x1=\"40\" y1=\"330\" x2=\"668\" y2=\"330\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"60\" y=\"350\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">where it leaks ↓<\/text>\n<circle cx=\"286\" cy=\"349\" r=\"4\" class=\"f-t5 cv-fade\"/>\n<text x=\"300\" y=\"353\" font-size=\"9.5\" style=\"fill:var(--t5)\">resolution loss — an individual becomes a household<\/text>\n<circle cx=\"286\" cy=\"368\" r=\"4\" class=\"f-t5 cv-fade\" style=\"--d:.12s\"/>\n<text x=\"300\" y=\"372\" font-size=\"9.5\" style=\"fill:var(--t5)\">match loss — ~50% blind, 40–70% via IP<\/text>\n<circle cx=\"286\" cy=\"387\" r=\"4\" class=\"f-t5 cv-fade\" style=\"--d:.24s\"/>\n<text x=\"300\" y=\"391\" font-size=\"9.5\" style=\"fill:var(--t5)\">no click — measured by incrementality, not a tap<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> The whole category in one motion: a platform knows an <em>individual<\/em> on a phone, but a television is a <em>household<\/em>, so every social-to-CTV buy is a resolution-and-match that leaks at three seams — the individual-to-household roll-up, the ~50% clean-room match, and the click that never comes.<\/figcaption>\n<\/figure>\n\n\nThe identity bridge is assembled from four raw materials. Each is an \"atomic unit\" of identity with distinct properties [2].\n\n### 2a. Hashed Email (HEM) — the authenticated spine\n\nA **hashed email (HEM)** is a one-way cryptographic scramble of an email address that a user handed over at login or purchase [2]. Run an email through a hash function (SHA-256, SHA-1, or the older MD5) and you get a fixed string that looks nothing like the original. The same email always produces the same hash, so two parties who each hash the same address can match on the result without either transmitting the plaintext email. This is why HEM is the natural spine for social platforms: a logged-in relationship *is* an email relationship, and the HEM travels across channels wherever the same authentication recurs [2].\n\nHEM carries two structural weaknesses that matter for this report. First, it is **reversible in practice**: LiveRamp — an identity vendor with a commercial interest in a HEM alternative, so read this as position-evidence — states that \"many firms are now offering services that can reverse email hashing to correctly guess consumers' email addresses,\" and that hashed lists \"can be, and are, easily repurposed and rehashed\" [3]. A hash is not encryption. It protects the email in transit far less than the word \"hashed\" implies. Second, HEM is **fragile to match on**: it requires exact syntax, does not persist when a user changes email, and cannot natively match against a name, a postal address, or a device ID [3]. A single person also holds multiple emails, so HEM alone fragments one human into several identities.\n\n### 2b. MAID (IDFA / GAID) — the per-device ID\n\nA **mobile advertising ID (MAID)** is a resettable identifier assigned to a mobile device: **IDFA** (Identifier for Advertisers) on Apple iOS, **GAID** (Google Advertising ID) on Android [2]. It is per-device, not per-person — \"one consumer may have several\" across their phone, tablet, and other devices [2]. The MAID was for years the workhorse of mobile retargeting, but ATT gutted the iOS supply, and graphs now \"compensate via HEM bridges and household probabilistic links\" [2]. For social-to-CTV, the MAID's residual value is as a *crosswalk*: it links a person's mobile behavior to the household so that a TV impression can later be tied back to a mobile action.\n\n### 2c. IP Address + Geo — the household proxy\n\nThe **IP address** is the network address of a household's internet connection, and it is the quiet workhorse of CTV identity. Because every device in a home typically shares one public IP, the IP is a *de facto household key*. LiveRamp's framing is blunt: \"We're using the IP as a replacement for a hashed email, and the CTV ID as a replacement for the cookie\" [4]. In LiveRamp's CTV matching, IP is used **only** to match a CTV device ID to a person-based ID and is then discarded; it \"cannot be included as identifiers for other matching types,\" and the guidance recommends sending **IPv4** because IPv6 addresses in most cases will not match [5]. Geo (derived from IP or device location) adds a coarse targeting and validation layer. The IP's virtue — it works without login — is also its flaw: it is shared, dynamic, and household-scoped, which is the root of the individual-vs-household problem in Section 6.\n\n### 2d. CTV ID — the household on the screen\n\nThe **CTV ID** is a household-scoped identifier for a specific television or streaming environment [2]. It comes from one of two places: **ACR** (Section 3), which fingerprints what is on the screen, or a **streaming SDK** — the software development kit a streaming app embeds, which reports a device/app identifier. The decisive property, stated plainly by the identity-graph literature: the CTV ID \"represents the TV, not the viewer\" [2]. It answers *which household and which screen*, never *which person in the room*. Connecting it to a person requires the household-resolution layer to crosswalk it against a MAID or HEM [2].\n\n\n**Exhibit A — the four signals at a glance:**\n\n| Signal | What it identifies | Source | Persistence | Key weakness |\n| --- | --- | --- | --- | --- |\n| **HEM** | An individual (their login email) | Login / purchase | Medium — breaks on email change | Reversible; exact-match only [3] |\n| **MAID** (IDFA/GAID) | A single device | Mobile OS | Low — resettable; ATT-suppressed on iOS | Per-device not per-person; supply decline [2] |\n| **IP + geo** | A household connection | Network | Low–medium — dynamic | Shared, household-scoped [4][5] |\n| **CTV ID** | A television / household | ACR or streaming SDK | Medium | The TV, not the viewer [2] |\n\n---\n\n## 3. ACR — Automatic Content Recognition\n\n**Automatic content recognition (ACR)** is software built into most smart TVs that fingerprints what is on the screen and reports it. The mechanic is Shazam for pictures: every few seconds the TV grabs a compressed sample of the displayed frame, sends it to a recognition server, and the server matches it against a database of shows, ads, and movies — logging what was watched and when [6]. Because it reads the screen output, ACR can identify content arriving over HDMI too — a game console, a cable box — not only the TV's own apps [6].\n\nThe cadence and scale are concrete. Reported sampling rates run from roughly one snapshot every 15 seconds (LG) to every 60 seconds (Samsung), with capacity to identify on the order of thousands of frames per hour [6]. Samsung's own description is the useful primary anchor: it calls ACR \"an optional feature\" that generates \"signatures\" capturing \"Smart TV viewing history, such as programs viewed and the amount of time spent watching them,\" along with a Personalized Service ID and the IP address; it states ACR is on by default with an opt-out, and that Samsung \"does not record or watch any of the content displayed\" — it matches signatures, not screenshots [7].\n\nACR plays two roles in the social-to-CTV chain. In **targeting**, ACR-derived viewing history feeds the CTV ID and the household's content profile, enabling exposure-based and content-based audiences. In **measurement**, ACR is the census-level sensor that records whether a given household was actually exposed to a linear or streaming ad — the raw material for reach, frequency, and cross-screen attribution. All six major TV brands (Samsung, LG, Vizio, Sony, TCL, Amazon) ship ACR active by default [6]. This is a present-tense, going-concern claim about the installed base as of the 2026 sources reviewed, and it is exactly the kind of status that can shift with a regulatory action or a manufacturer policy change.\n\n---\n\n## 4. The Identity Graph — Stitching Signals into a Household\n\nAn **identity graph** is the database and matching logic that resolves the four scattered signals into a single, persistent, pseudonymous identifier for a person, then rolls persons up into a household. LiveRamp's **RampID** is the reference implementation: it resolves \"fragmented consumer touchpoints to a single person or household-based pseudonymous identifier,\" maintained in a longitudinal graph so the same person is recognized over time [8]. Critically, RampID is *tokenized and partner-specific* — two companies referencing the same human see **different** RampID encodings, which is what keeps the token itself from becoming a universal tracking key [8], the flaw LiveRamp attributes to raw HEM.\n\nTwo resolution methods run inside the graph, and the distinction governs everything about accuracy [2]:\n\n- **Deterministic resolution** links identifiers that are *known* to belong to the same person, typically via shared authentication (the same login email across two apps). Confidence is high — the specialist literature cites \"typically 0.95+\" — and it is the standard for regulated activation and high-
