 by adding Pinterest audiences [3][12].\n\n**The critical caveat, stated plainly.** Digiday flags that the +27% figure is attributed to tvScientific CEO Jason Fairchild \"without independent verification\" [9]. These are exactly the kind of numbers a vendor produces to launch a product: no methodology, no control-group disclosure, no third-party audit, no confidence interval. The direction — adding intent data helps — is entirely plausible; the *magnitude* is a marketing claim. A McKinsey-grade read files all four under \"vendor-reported, indicative, unaudited\" and keeps them out of a business case until a controlled incrementality test exists.\n\n> **Key Claim 4.9 — Pinterest/tvScientific report a +27% lift in outcomes per $100 and +65% in purchases when tvScientific's AI is enriched with Pinterest high-intent signals. VENDOR-REPORTED.**\n> *Type: contested (as to magnitude). Stakes: standard. Single-source: yes (originates with the vendor; Digiday attributes the 27% to the tvScientific CEO).*\n> Reported by Pinterest [3] and across VideoWeek/Digiday/eMarketer/MediaPost [9][10][12]; Digiday explicitly notes the 27% is attributed to CEO Jason Fairchild without independent verification [9]. Flagged as vendor-reported and unaudited.\n\n> **Key Claim 4.10 — In a named LG case study, adding Pinterest audiences drove +73% unique households reached and +24% net-new-customer lift. VENDOR-REPORTED, SINGLE CASE.**\n> *Type: contested (as to generalizability). Stakes: standard. Single-source: yes (vendor, single case).*\n> Pinterest/tvScientific launch materials, reported by VideoWeek and MediaPost [3][12]. One named advertiser, no disclosed methodology or control; flagged as vendor-reported and non-generalizable.\n\n---\n\n## 5. Skepticism: Does the Intent Signal Survive the Household Match?\n\n**Answer first:** This is the load-bearing risk in the whole thesis. Pinterest's intent is *individual* — it knows what *you* searched and saved while logged in on your phone. CTV targeting resolves to a *household* — an IP address shared by everyone under the roof. If the precise, person-level signal that makes Pinterest valuable gets averaged across the household in the match, the \"high-intent\" premium partly evaporates, and the attribution model that produces the lift figures inherits the same coarseness. Named analysts raised exactly this before the product even launched.\n\nThree distinct skeptical strands appear in the primary coverage:\n\n**(1) The individual-to-household resolution problem.** Pinterest's signal is generated at the level of a logged-in individual on a mobile device. CTV is generally targeted and measured at the household IP level — the whole point of the big screen is that it's shared. Ad-tech analyst Trey Titone (Ad Tech Explained) named the concrete failure mode: IP-based household targeting creates \"coarse targeting issues,\" such as serving \"a daughter's dress ads during a father's football game\" [14]. If the intent belongs to one person but the impression lands on the household, the match is lossy by construction.\n\n**(2) The \"blunt\" attribution model.** The lift figures depend on an attribution model that credits a conversion from *any device in the household* after a *single* TV exposure. Titone calls this model \"blunt\" and \"semi-contentious\" — it flatters the platform's credit-claiming by maximizing attributable conversions, while raising validity questions about whether the TV ad truly caused the sale [14]. Because that same model generates the +27% and +65% numbers, skepticism about the model is skepticism about the numbers.\n\n**(3) Reach and inventory ceilings.** Tatari CEO Philip Inghelbrecht cautioned that \"advertisers will ultimately judge this acquisition on reach and outcomes,\" and that without full inventory access beyond programmatic channels, \"brands may still find themselves capped in scale and cost efficiency\" [8]. tvScientific's claimed ~95% AVOD reach is programmatic reach; the most premium, most effective CTV inventory — some live sports, some premium AVOD and subscription tiers — is not always available programmatically, which can cap both scale and the very intent-precision the pitch depends on.\n\nA fourth, softer risk sits upstream of all of these: **the health of the signal itself.** AdExchanger flagged that proliferating AI-generated content on Pinterest may be \"alienating its core user base.\" The intent signal is only as good as genuine, engaged user behavior, so degradation on-platform would degrade the off-platform product too [4].\n\nNone of this says the play won't work. It says the mechanism has a specific, identifiable point of failure — the individual→household match — and that the public evidence so far, vendor figures, is precisely the evidence that cannot resolve whether the failure is happening. What would resolve it is a controlled incrementality study run by someone other than the vendor. As of the research window, none is public.\n\n> **Key Claim 4.11 — Named analysts raised, at launch, that Pinterest's individual-level intent may not fully survive resolution to a household CTV ID, and that the attribution model producing the lift figures is \"blunt.\"**\n> *Type: contested. Stakes: load-bearing. Single-source: no.*\n> Trey Titone / Ad Tech Explained on IP-household \"coarse targeting\" and \"blunt\"/\"semi-contentious\" attribution [14]; Tatari CEO Philip Inghelbrecht on reach/inventory ceilings [8]; AdExchanger on signal-health risk from AI content [4]. These are analyst positions (Tier 5/6), cited as position-evidence, not as proof the failure occurs.\n\n---\n\n## 6. Competitive Position: Where tvScientific by Pinterest Sits\n\n**Answer first:** tvScientific by Pinterest is a **performance-CTV challenger**, not a mega-DSP. Its peer set is MNTN and Vibe — outcome-first platforms serving SMB and mid-market advertisers who care about attribution over awareness — sitting *beneath* The Trade Desk and Google's DV360, which own the large, agency-led, brand-and-reach buys. Pinterest's differentiator inside that challenger tier is its proprietary intent data; its handicap is that it does not own CTV inventory and must match into someone else's.\n\nDigiday and RockWater place tvScientific in an explicit cohort with **MNTN** and **Vibe** — performance-focused CTV firms built to make TV measurable and outcome-driven for smaller advertisers, distinct from **The Trade Desk** and **DV360**, which dominate large-scale agency buys [8][9][11]. Within that cohort, Pinterest's edge is the one asset the others don't have: a large, first-party, forward-looking intent graph. Consultant Mike Brooks framed the acquisition's value as buying \"one of the very few beachheads at the intersection of performance, especially mobile performance, and CTV\" [8]. Scarcity is the point.\n\nTwo comparisons sharpen the position:\n\n- **Versus retail media (Amazon/Walmart).** The nearest strategic analogue is retail media's audience extension. But retailers extend *purchase* data — what you bought; Pinterest extends *intent* data — what you're planning to buy. Intent is earlier in the funnel and arguably richer for discovery-driven categories like home, fashion, beauty, and DIY. It is also softer evidence of a real buyer than a completed transaction, which is part of why the household-match question matters more for Pinterest than for Amazon.\n- **Versus building it.** Pinterest reportedly evaluated multiple ad-tech acquisitions in 2025 — AdExchanger references \"five potential ad tech acquisitions\" — before landing on tvScientific [4]. Buying a working CPO engine with existing supply relationships and an AVOD footprint was faster than building demand-and-supply plumbing from scratch: the classic build-vs-buy calculus in a category restructuring monthly.\n\n> **Key Claim 4.12 — tvScientific by Pinterest competes in the performance-CTV challenger tier (peers: MNTN, Vibe), below the large brand-DSPs (The Trade Desk, DV360); its differentiator is proprietary first-party intent data, its handicap is not owning inventory.**\n> *Type: established. Stakes: standard. Single-source: no.*\n> Digiday and RockWater place tvScientific in the MNTN/Vibe cohort distinct from TTD/DV360 [8][9][11]; Mike Brooks on the \"beachhead\" scarcity [8]; AdExchanger on the audience-network-for-CTV positioning and the five-acquisition search [4].\n\n---\n\n## 7. Disambiguation: This Is NOT the Old \"Pinterest TV\"\n\n**Answer first — this matters enough to state twice.** The topic phrase \"Pinterest TV\" is dangerously ambiguous. There are two entirely different things, roughly five years apart, and conflating them corrupts the analysis:\n\n- **TODAY (the subject of this document):** *tvScientific by Pinterest* / **CTV Audiences** — an **advertising** product (launched April 2026) that lets brands buy CTV ad inventory targeted with Pinterest's intent data. It is about *reaching* audiences on other companies' streaming apps.\n- **OLD (a different animal):** the original **Pinterest TV** — a creator-facing **live-shopping / shoppable-video** feature launched **8 November 2021**, a QVC-style slate of live, original, shoppable creator shows (e.g., \"Tom Tries\" with Olympic diver Tom Daley, \"Christian On\" with designer Christian Siriano, \"Buy This\" with comedian Robyn Schall), produced in a virtual studio [15][16][17].\n\nThe old Pinterest TV was **content Pinterest made for its own users**; the new play is an **ad-buying tool for reaching users on other screens**. They share three letters and nothing else.\n\n**A necessary honesty note on the old feature's status.** The brief describes the old Pinterest TV as \"largely wound down,\" and that is the common understanding — the daily live-shopping-show format did not sustain as a headline product. But I could **not** find a clean, dated announcement that Pinterest TV was formally discontinued. The public trail shows *evolution* instead: coverage of live-shopping shows through ~2022–2023, a shift toward streaming-TV content partnerships (a Tastemade streaming show; a Roku original series, \"Bring My Pinterest to Life,\" reported debuting March 2026), and a still-live Pinterest Help article on watching Pinterest TV [15][17][and Pinterest newsroom items]. The accurate framing, then: the *original daily live-shopping-show format* is no longer a headline product and appears largely wound down, while \"Pinterest TV\" as a content and creator effort morphed into streaming partnerships. It was **not** cleanly shut down on a datable day, and I flag that I could not source a formal discontinuation. This does not change the disambiguation — today's advertising CTV play is unrelated to yesterday's live-shopping content — but it is more honest than asserting a clean sunset I could not verify.\n\n> **Key Claim 4.13 — The current tvScientific-powered CTV advertising play is a distinct thing from the old \"Pinterest TV\" live-shopping creator feature launched 8 Nov 2021.**\n> *Type: established. Stakes: load-bearing (disambiguation). Single-source: no.*\n> Old Pinterest TV launch and format: TechCrunch, Social Media Today, Variety, Pinterest newsroom [15][16][17]. New play: §§2–4 sources [1][3]. The two are unrelated products sharing a name.\n\n> **Key Claim 4.14 — The original daily live-shopping-show format of \"Pinterest TV\" appears largely wound down/evolved into streaming partnerships, but no formal dated discontinuation could be sourced.**\n> *Type: contested. Stakes: minor. Single-source: no (absence of a discontinuation source is itself the finding).*\n> Coverage shows the format evolving into streaming content (Tastemade show; Roku \"Bring My Pinterest to Life,\" reported March 2026) rather than a clean shutdown [15][17]; a Pinterest Help article on Pinterest TV remained live. I could not source a formal discontinuation date — flagged honestly.\n\n---\n\n## 8. The Read\n\nStrip the launch language down and the play is coherent and correctly aimed. Pinterest has a genuinely differentiated asset — declared, forward-looking commercial intent from a logged-in base — and the one thing that asset lacked was a large off-platform surface where Pinterest could both *use* it and *measure* it. CTV is that surface, and tvScientific is a real, working, outcome-based engine for buying it, with existing supply relationships and an AVOD footprint that would have taken years to build. Buying \"one of the very few beachheads\" at the mobile-performance/CTV intersection is a defensible use of ~$300–350M. The retail-media template says audience extension can be a real business; running it on intent instead of purchase data is a legitimate variant.\n\nThe unresolved question sits entirely at the seam: **does an individual-level intent signal survive resolution to a household CTV impression, and does the outcome hold up under attribution that isn't the vendor's own?** Every public performance number so far is vendor-reported, and the sharpest of them traces to the tvScientific CEO. The named skeptics — Titone on coarse household targeting and \"blunt\" attribution, Inghelbrecht on reach and inventory ceilings — are not dismissing the play; they are pointing at precisely the mechanism where the value could leak. Until an independent incrementality study exists, the correct posture is plain: **strong strategic logic, unproven magnitude.** The beachhead is real. Whether the intent premium survives the trip to the living-room IP address is the thing to watch through 2026–2027 — and public data cannot yet tell us.\n\n---\n\n## Open Questions\n\n1. **What did Pinterest actually pay?** The $300–350M consensus and the $465.1M TipRanks figure disagree, and Pinterest's own filings disclose no price. A future 10-K/10-Q purchase-accounting note (goodwill, intangibles, total consideration) should settle it — worth pulling once filed.\n2. **Is there any independent (non-vendor) measurement of the lift?** All +27%/+65%/+73%/+24% figures are vendor-reported. Has any agency, MMM/incrementality vendor, or third party validated the intent-enrichment lift?\n3. **How exactly does the individual→household match work?** What identity graph/clean-room mechanism resolves a logged-in Pinterest individual to a CTV household, deterministic vs. probabilistic split, and what is the match/coverage rate? Not disclosed.\n4. **What is the real inventory footprint?** The \"95% of AVOD\" claim is vendor-stated; what premium inventory (live sports, top SVOD ad tiers) is actually addressable, and where are the caps Inghelbrecht warned about?\n5. **What is the precise current status of the OLD Pinterest TV?** No formal discontinuation could be sourced. Is the live-shopping-show format fully retired, and what is the relationship (if any) between the streaming-content efforts (Tastemade, Roku series) and the tvScientific ad play?\n6. **International rollout.** Pinterest said the U.S. is first before global expansion — what is the timeline and which markets, given intent-data and identity-match regimes differ abroad?\n7. **How does tvScientific by Pinterest interact with the rest of the open CTV ecosystem** (The Trade Desk, Amazon DSP, clean rooms) — is it a closed audience-extension silo or does it plug into third-party DSPs?\n\n---\n\n## Sources\n\n1. Pinterest Newsroom, \"Pinterest to Acquire tvScientific, Expanding Performance Advertising to Connected TV,\" 11 Dec 2025. https://newsroom.pinterest.com/news/pinterest-tvscientific/ — *Tier 1 (company primary). Announcement, deal rationale, Ready quotes, integration into Performance+, close timeline. Accessed 30 Jun 2026.*\n2. tvScientific, \"Pinterest to Acquire tvScientific\" (press release), 11 Dec 2025. https://www.tvscientific.com/press/press-releases/pinterest-to-acquire-tvscientific-tvscientific — *Tier 1 (company primary). tvScientific self-description, CPO, 95% AVOD reach, deterministic ID, Fairchild quote. Accessed 30 Jun 2026.*\n3. Pinterest Newsroom, \"Introducing tvScientific by Pinterest,\" ~27 Apr 2026. https://newsroom.pinterest.com/news/tvscientific-by-pinterest/ — *Tier 1 (company primary). Rebrand, CTV Audiences launch, all lift figures, Lee Brown and Fairchild quotes. Accessed 30 Jun 2026.*\n4. AdExchanger, \"Pinterest Acquires CTV Startup tvScientific (Didn't CTV That Coming),\" 11 Dec 2025. https://www.adexchanger.com/tv/pinterest-acquires-ctv-startup-tvscientific-didnt-ctv-that-coming/ — *Tier 5 (specialized ad-tech trade). CPO/algorithmic mechanics, Performance+ ~20% efficiency, \"AdSense/Audience Network for CTV\" framing, five-acquisition search, AI-content signal risk. Accessed 30 Jun 2026.*\n5. TipRanks, \"Pinterest Closes tvScientific Acquisition, Raises Q1 2026 Outlook,\" Feb 2026. https://www.tipranks.com/news/company-announcements/pinterest-closes-tvscientific-acquisition-raises-q1-2026-outlook — *Tier 5 (secondary financial). Close date 17 Feb 2026, Q1 guidance; source of the unconfirmed $465.1M figure (not in SEC filing). Accessed 30 Jun 2026.*\n6. StockTitan, \"Pinterest updates Q1 2026 outlook after tvScientific deal — Form 8-K,\" Feb 2026. https://www.stocktitan.net/sec-filings/PINS/8-k-pinterest-inc-reports-material-event-c16fadc9dcc4.html — *Tier 1/3 (SEC 8-K summary). Close date, Q1 revenue $958–978M, Adj. EBITDA $163–183M; no purchase price disclosed. Accessed 30 Jun 2026.*\n7. The Globe and Mail (markets wire), \"Pinterest Closes tvScientific Acquisition, Raises Q1 2026 Outlook,\" Feb 2026. https://www.theglobeandmail.com/investing/markets/stocks/PINS/pressreleases/302248/ — *Tier 3 (wire/press-release carrier). Corroborates close date and guidance; no price. Accessed 30 Jun 2026.*\n8. Digiday, \"Why Pinterest wants to buy tvScientific, and what it signals for the CTV ads business,\" 16 Dec 2025. https://digiday.com/media-buying/why-pinterest-wants-to-buy-tvscientific-and-what-it-signals-for-the-ctv-ads-business/ — *Tier 5 (specialized trade). $300–350M estimate, ~$100M/$50M revenue, MNTN/Vibe cohort, Mike Brooks \"beachhead\" quote, Tatari CEO Inghelbrecht skepticism. Accessed 30 Jun 2026.*\n9. Digiday, \"Pinterest debuts audience extension offering on CTV,\" 27 Apr 2026. https://digiday.com/media-buying/pinterest-debuts-audience-extension-offering-on-ctv/ — *Tier 5 (specialized trade). Audience-extension framing, ~600M MAU, deterministic+probabilistic match, +27% attributed to Fairchild \"without independent verification,\" competitive map. Accessed 30 Jun 2026.*\n10. eMarketer, \"Pinterest and tvScientific bring high-intent audiences to CTV devices,\" 27 Apr 2026. https://www.emarketer.com/content/pinterest-tvscientific-bring-high-intent-audiences-ctv-devices — *Tier 5 (analytical/industry research). Mechanics, lift figures, 80B+ monthly searches, 22.6M US social buyers 2026, CTV vs linear spend. Accessed 30 Jun 2026.*\n11. RockWater, \"Pinterest Buys tvScientific at Rumored $300M Valuation,\" 19 Dec 2025. https://wearerockwater.com/pinterest-buys-tvscientific/ — *Tier 5 (media/ad-tech advisory analysis). $300–350M, ~3–3.5× revenue benchmark vs Innovid, 1:1 matching, retail-media/audience-bundling parallel. Accessed 30 Jun 2026.*\n12. VideoWeek, \"Pinterest Launches CTV Audiences Following tvScientific Acquisition,\" 27 Apr 2026. https://videoweek.com/2026/04/27/pinterest-launches-ctv-audiences-following-tvscientific-acquisition/ — *Tier 5 (specialized trade). Rebrand, launch mechanics, lift figures, Fairchild 80B-searches quote, LG case, performance-vs-brand positioning. Accessed 30 Jun 2026.*\n13. MediaPost, \"Pinterest Brings Audience Data To CTV Through tvScientific,\" 27 Apr 2026. https://www.mediapost.com/publications/article/414613/ — *Tier 5 (specialized trade). LG case (+73% households, +24% new customers), +27%/+65% enrichment figures, LG platform named. Accessed 30 Jun 2026 (via search summary; direct fetch 403'd).*\n14. Trey Titone, \"Why Pinterest Bought tvScientific,\" Ad Tech Explained, 12 Dec 2025. https://www.adtechexplained.com/p/why-pinterest-bought-tvscientific — *Tier 5/6 (named-expert analytical newsletter). IP-household \"coarse targeting\" example, \"blunt\"/\"semi-contentious\" attribution critique, intent-across-devices challenge. Cited as position-evidence. Accessed 30 Jun 2026.*\n15. TechCrunch, \"Pinterest gets into live shopping with launch of Pinterest TV,\" 1 Nov 2021. https://techcrunch.com/2021/11/01/pinterest-gets-into-live-shopping-with-launch-of-pinterest-tv/ — *Tier 5 (tech trade). OLD Pinterest TV: live shoppable creator shows, launch context. Disambiguation. Accessed 30 Jun 2026.*\n16. Pinterest Newsroom, \"Introducing Pinterest TV, a fresh dose of live, original and shoppable creator shows,\" Nov 2021. https://newsroom.pinterest.com/news/introducing-pinterest-tv/ — *Tier 1 (company primary). OLD Pinterest TV format, show slate, 8 Nov 2021 start, virtual studio. Disambiguation. Accessed 30 Jun 2026.*\n17. Variety, \"Pinterest TV: Site Launches Live, Shoppable QVC-Style Episodes to Drive Ecommerce Sales,\" 1 Nov 2021. https://variety.com/2021/digital/news/pinterest-tv-live-shopping-episodes-1235101892/ — *Tier 5 (entertainment trade). OLD Pinterest TV as QVC-style live shopping. Disambiguation. Accessed 30 Jun 2026.*"}, {"order": 5, "file": "05_Reddit_TikTok.md", "title": "Reddit & TikTok — Two Postures at the Edge of the Big Screen", "summary": "", "body": "# Reddit & TikTok — Two Postures at the Edge of the Big Screen\n\n## Bottom Line\n\nOf the five social platforms in this corpus, Reddit and TikTok are the two *least* engaged in the social-to-CTV retargeting bridge — and understanding why teaches more than pretending otherwise. **Neither runs a genuine social-audience-to-CTV extension play today.** Reddit is doing the opposite of audience extension. It is building a *walled garden*: hoarding first-party conversational and interest data, building its own measurement stack (Dual Attribution, beta May 2026), running privacy-preserving deals (Anonym) that keep data from ever leaving, and shopping for ad-tech acquisitions — all so it can monetize its data *on Reddit*, not lease audiences to a DSP for streaming. Its much-cited \"interactive ad format\" — the Paramount *Running Man* \"Dodge the Drones\" game, staged late 2025 via its KarmaLab creative arm — is an **on-platform, in-feed** unit that lives in the Reddit mobile and desktop feed. Not a CTV format. Not off-platform inventory. The Digiday piece that grouped \"Amazon, Disney and Reddit\" as expanding interactive formats put three companies in one trend paragraph; it did not describe a Reddit CTV product. Reddit's ad business is booming ($625M ad revenue in Q1 2026, +74% YoY; 126.8M daily uniques), but the growth is search-led on-platform intent, not big-screen reach.\n\nTikTok's posture is the mirror image, but it arrives at the same place. It *had* a CTV app, launched 2021 on Fire TV, and it is *gone* — pulled from US smart TVs in early 2025 as ByteDance complied with the US divest-or-ban law, then discontinued globally on June 15, 2025. TikTok leadership (Marisa Hammonds, May 2026) says a TV app is \"not on the roadmap right now.\" The live thesis for TikTok on the big screen is not a TikTok-owned app but **\"vertical video as the entry point into CTV\"** — short clips as a top-of-funnel discovery lever that streamers (Netflix, Disney+, Tubi, Peacock) embed to route viewers into long-form, and that brands repurpose as creative (the Rollo case: TikTok-style social video reformatted for Roku via Spaceback). That is a creative-and-discovery pattern, not a retargeting bridge that carries a TikTok social engager to a specific household CTV impression. And whatever TikTok might build in US CTV sits under a fresh ownership overhang: the US business closed into an Oracle/Silver Lake/MGX-led joint venture on January 22, 2026 (ByteDance <20%), with a new algorithm to be retrained under US jurisdiction — an environment that favors continuity of the core mobile ad machine over speculative new-surface bets. **Read both clear-eyed: Reddit is a walled garden that won't extend, and TikTok is a mobile giant whose big-screen story is other people's screens.**\n\n---\n\n## Why This Chapter Exists: Sorting Real Bridges From Adjacent Noise\n\nThe corpus thesis is a specific, testable mechanic: a demand-side social platform takes a *known user* who engaged on its mobile or social surface, resolves that user to a household or device, and serves that same audience a targeted impression on Connected TV inventory it does not own — audience extension, in the retail-media mold. LinkedIn (Amazon DSP deal, CTV Select) and Pinterest (tvScientific acquisition) are doing versions of this. Reddit and TikTok get their own chapter because both are *frequently name-checked* in the same breath as that trend — and neither is actually running it. A McKinsey-style read has to separate the signal (\"this platform extends audiences to CTV\") from three adjacent things that get mistaken for it:\n\n1. **Richer on-platform video / interactive formats** (Reddit's in-feed interactive ads) — better ad products, same surface.\n2. **A big-screen *app* for organic content** (TikTok's dead TV app; Instagram's live Reels-on-TV app) — a content-distribution surface, not necessarily an audience-extension ad product.\n3. **\"Repurpose your vertical creative for CTV\"** (Rollo/Spaceback; Uproxx's \"TikTok-ready shows\") — a creative-and-format pattern any brand can run through Roku or a DSP, with no involvement from TikTok's audience graph at all.\n\nGetting this distinction right is the whole value of the chapter. The temptation — visible across 2026 trade coverage — is to see \"social platform + big screen\" and file it under the bridge. It usually isn't.\n\n---\n\n## Part I — Reddit: The Walled Garden That Won't Lease Its Audience\n\n### Claim 1.1 — Reddit's advertising business is large, fast-growing, and overwhelmingly on-platform\n\nReddit reported Q1 2026 (quarter ended March 31, 2026) total revenue of **$663 million, up 69% YoY**, of which **advertising revenue was $625 million, up 74% YoY** — roughly 94% of the total. Net income was **$204 million** (diluted EPS $1.01), and daily active uniques (DAUq, Reddit's term for logged-in-or-out daily users) reached **126.8 million, up 17% YoY**, with weekly active uniques of 493.1 million. Global ARPU was $5.23; US ARPU $9.63 versus international $2.02 [1][2]. *Type: established.* This is a serious, profitable, scaling ad business — but the scale is **first-party-audience-on-Reddit**, not distribution-of-Reddit-audiences-elsewhere. Every dollar of that $625M is inventory Reddit owns.\n\n### Claim 1.2 — Reddit's ad growth is driven by on-platform search and intent, not off-platform reach\n\nReddit attributes its ad acceleration to on-platform mechanics: AI-powered **Reddit Max** campaigns (reported ~17% lower costs and ~25%+ more conversions on average), **search-led** traffic (weekly search-led users up ~30% YoY), **Dynamic Product Ads** targeting high-intent shopping discussions, and a 75% YoY increase in active advertiser count [1][3]. *Type: established.* The story Reddit tells investors is simple: we sit on uniquely high-intent, interest-declared conversation, and we are getting better at turning that into performance advertising *inside Reddit*. Nowhere in the Q1 2026 disclosure or its earnings coverage do CTV, connected TV, off-platform inventory, or audience extension appear [1][3] — a meaningful *absence* for a corpus about exactly that.\n\n### Claim 1.3 — Reddit's \"interactive ad format\" is an on-platform in-feed unit, not a CTV product\n\nIn late 2025, Reddit unveiled an **Interactive Ads** format, piloted by **Paramount** to promote the film *The Running Man* (Glen Powell; theatrical release Nov 14, 2025). Reddit's in-house creative strategy arm **KarmaLab**, with production house **Hi From the Future**, turned the film's chase premise into a playable in-feed game, \"**Dodge the Drones**,\" letting users participate directly *within the Reddit feed* [4][5]. *Type: established.* This is the single most-cited \"Reddit big-screen\" data point in the trade press — and it is not a big-screen product at all. It is a mobile and desktop in-feed interactive unit. Andy Schneider, head of scale and innovation at KarmaLab, framed the roadmap as bespoke builds for premier advertisers that Reddit will later \"productize and make programmatically available\" [5][6] — productizing *on-platform* interactive formats, not extending audiences to CTV.\n\n### Claim 1.4 — The Digiday \"Amazon, Disney and Reddit\" framing is a trend grouping, not a Reddit CTV partnership\n\nA Digiday piece (2026) grouped **Amazon, Disney, and Reddit** as companies \"expanding interactive ad formats\" amid a \"CTV arms race\" [6]. Read carefully, the article credits Amazon (location-based interactive video ads) and Disney (Pause+, Virtual Concession Stand) with *CTV* formats, and credits Reddit with its *in-feed Running Man* interactive unit — explicitly noting Reddit had staged only that one initiative and had no broader CTV rollout timeline [6]. *Type: established.* **The brief's phrasing that \"Amazon, Disney and Reddit [are] expanding interactive ad formats\" is accurate, but it does not mean Reddit is building CTV formats.** Reddit is in the paragraph because it, too, is building interactive ads — for its own feed. This is the corpus's cleanest example of the \"adjacent noise\" trap: one trend headline masking three different surfaces.\n\n### Claim 1.5 — Reddit is building a walled garden and actively acquiring ad tech to keep first-party data in\n\nThrough 2026 Reddit has signaled it is \"in buying mode\" for ad-tech acquisitions, explicitly to reduce reliance on external solutions and **build more of its own walled garden** around its first-party data [7]. It released **Dual Attribution** into beta on **May 20, 2026** — a first-party measurement tool inside Reddit Ads Manager that sits alongside third-party mobile-measurement partners and Apple's SKAdNetwork [8]. It partnered with **Anonym** (the privacy-tech firm) so advertisers in data-restrictive verticals can measure lift and attribution *without their first-party data ever leaving their own systems*, and without advertiser data entering Reddit's [7]. *Type: established.* Every one of these moves points *inward*: own the measurement, own the data, let no audience or signal leak out. This is the strategic antithesis of audience extension, whose entire business model is *leasing* your audience to be activated on someone else's inventory.\n\n### Claim 1.6 — Reddit's data-licensing revenue is AI-training licensing (Google, OpenAI), not ad audience extension\n\nReddit's \"Other revenue\" — **$39 million in Q1 2026, up 15% YoY** — is data licensing, and the confirmed deals are **AI-training** content licenses: Google (announced Feb 2024, reported ~$60M/year) and OpenAI (reported ~$70M/year) [1][9][10]. *Type: established.* This matters because the brief flags a possible \"Amazon data deal.\" I found **no evidence of a Reddit–Amazon advertising data partnership** in which Reddit audiences are made activatable in Amazon DSP for CTV. Reddit's material data deals are for AI model training, and its 2025 push has been to seek *deeper product integration* with Google (driving traffic and contributions) rather than to syndicate audiences to ad platforms [11]. *Flagged:* if an Amazon–Reddit ad relationship exists, this research did not surface it; the corpus should treat \"Reddit–Amazon data deal for CTV\" as **unconfirmed**, and likely a conflation of (a) the AI-training licenses and (b) the Digiday trend grouping that happened to name Amazon and Reddit in the same CTV-formats story.\n\n### The Reddit read, plain\n\nReddit is one of the strongest *on-platform* advertising stories in the sector right now — high-intent conversational data, exploding revenue, a maturing self-serve and AI-optimization stack. But on the specific question this corpus asks — *does Reddit extend its social audiences onto CTV inventory?* — the answer is **no, and by design**. Reddit's strategy is to deepen and wall its own garden, not to become an audience source for streaming. The most a skeptic can grant is a *long-dated option*: Reddit's declared interest-and-topic signals are, in principle, valuable extension fuel, and its stated pattern (\"build bespoke, then productize, then make programmatic\") could one day include off-platform or CTV activation. But today there is no product, no DSP integration, no partnership doing it. Reddit's own actions — acquiring ad tech, building first-party measurement, striking no-data-leaves privacy deals — cut *against* it becoming an extension play.\n\n---\n\n## Part II — TikTok: The Mobile Giant Whose Big-Screen Story Is Other People's Screens\n\n### Claim 2.1 — TikTok launched a CTV app in 2021 and it is now dead\n\nTikTok debuted a **TikTok TV app in 2021**, with Amazon Fire TV as its first partner, later expanding to Samsung, LG, Vizio, Google TV, and Apple TV [12][13]. Industry consensus is the app \"failed to gain traction — likely due to poor formatting and an uninspiring user interface\": a bare-bones port of the vertical mobile feed onto a horizontal widescreen [13][14]. *Type: established.* The core UX problem was structural. TikTok's magic is thumb-driven vertical scroll and hyper-personalization, and neither translates to a lean-back, remote-driven, often-communal living-room screen [14][15].\n\n### Claim 2.2 — The TikTok TV app was removed from US smart TVs in early 2025 for ban-law compliance, then shut down globally June 15, 2025\n\nPer Axios reporting (Feb 8, 2025), streaming-TV firms — Samsung, LG, Vizio, Amazon Fire TV, Google TV, Apple TV — **removed the TikTok US TV app from their smart-TV app stores in early 2025**, joining Google and Apple in complying with the US divest-or-ban law [16]. TikTok then notified users (mid-May 2025) that the TV service would be **discontinued globally on June 15, 2025** [13][17]. *Type: established, with a nuance.* The *US* removal was driven substantially by ban-law compliance (PAFACA), not purely by poor traction; the *global* shutdown was framed by TikTok as a pullback toward its core mobile experience [17][18]. **The corpus should state both causes.** The app's weak product-market fit is real, but the US disappearance was regulatory, and collapsing the two into \"TikTok tried CTV and users rejected it\" overstates the case. Both are true. For the US story, the regulatory cause is load-bearing.\n\n### Claim 2.3 — As of 2026, a TikTok CTV/TV app is explicitly \"not on the roadmap\"\n\nMarisa Hammonds, TikTok's Global Head of Creator Marketing & Community, stated (reported May 2026) that a TV app is \"**not on the roadmap right now. Never say never**\" [15][19]. *Type: established (executive statement).* This is the single most direct present-tense signal on TikTok's CTV ambitions, and it is a *step-back*. Where Instagram launched a dedicated Reels CTV app in December 2025 and is treating TV as a multi-year growth journey, TikTok is *not* building a TV app — the two are described as \"headed in opposite directions\" on TV [15][19]. But note the \"never say never\": renewed *interest* in the big screen amid a mobile-engagement plateau (Claim 2.5) is real, even as a *product* stays off the roadmap.\n\n### Claim 2.4 — The live \"TikTok on CTV\" thesis is vertical-video-as-funnel-entry, run by streamers and brands — not by TikTok\n\nThe thesis with actual momentum is: **\"vertical video isn't replacing CTV, it's becoming the entry point into it\"** [20][21]. Streamers are embedding short vertical feeds as top-of-funnel *discovery* surfaces that route viewers into long-form. **Disney+ launched \"Verts\"** (short clips from its library) to US subscribers in **March 2026**; **Netflix** began testing a vertical short-form feed in 2025 (co-CEO Greg Peters, Jan 2026, said Netflix is shifting its mobile experience toward vertical and short-form); **Peacock** and **Tubi** run swipeable vertical clip feeds [20][22]. *Type: established.* The mechanic is a menu, not the main course: a user starts on a short highlight, moves to a curated clip set, and lands on full-length content [21]. **Crucially, TikTok is the aesthetic inspiration and the behavior-shaper here, not the operator.** Streaming platforms are building the vertical-video-to-CTV funnel *inside their own apps*, borrowing the TikTok and Reels grammar. TikTok's audience graph is not in the loop.\n\n### Claim 2.5 — The renewed big-screen interest is driven by a mobile-engagement plateau, but manifests off TikTok\n\nTrade analysis (eMarketer, 2026) frames both Instagram's and TikTok's CTV interest as a search \"for new growth areas amid signs of plateauing engagement on mobile,\" pointing to Meta DAU growth decelerating (6% YoY Q1 2025 vs. 7% Q1 2024) and YouTube Shorts' 200B+ daily views as the model to chase [14][23]. TikTok's own mobile signals are mixed in 2026 (some reports show declining views YoY even as engagement-rate metrics rose) [24]. *Type: contested/mixed — engagement-metric methodology varies by source, flag single-vendor figures.* The plateau logic is sound, but it is exactly what makes the *absence* of a TikTok CTV product notable: TikTok feels the same growth pressure Instagram does, yet — for reasons that include the US ownership overhang (Claim 2.6) — it has chosen *not* to build the big-screen surface. The pressure is real. The response is restraint.\n\n### Claim 2.6 — The US divestiture is no longer an \"overhang\" — it closed into an Oracle-led JV on Jan 22, 2026 — and that constrains any US CTV ad build-out\n\nThe US \"splitting its app from the global business\" is no longer prospective. On **January 22, 2026**, ByteDance closed a deal transferring control of TikTok's US operations to **\"TikTok USDS Joint Venture LLC,\"** owned ~50% by new investors (**Oracle, Silver Lake, MGX at ~15% each**), ~30% by affiliates of existing ByteDance investors, and **<20% retained by ByteDance** — to satisfy PAFACA's sub-20% foreign-ownership requirement [25][26][27]. **Oracle** is the designated security partner, auditing compliance, securing US user data, and **retraining a new US recommendation algorithm** independent of ByteDance; **Adam Presser** is CEO of the new entity; ByteDance loses access to US user data and control of the US algorithm [26][27]. *Type: established.* This is a settled corporate fact as of mid-2026, but it is *early in execution* — a newly separated entity, a re-trained algorithm, tighter ad policies, heightened regulatory scrutiny. *Strategic read:* a business in the first year of a forced ownership split, re-platforming its recommendation engine under a new security regime, is structurally biased toward protecting the *core mobile ad machine* (US ad revenue estimated at **~$14–17B for 2026** [28]) over speculative new-surface bets like CTV audience extension. The overhang did not vanish with the deal. It changed shape — from \"will it be banned?\" to \"can the JV execute continuity while re-platforming?\"\n\n### Claim 2.7 — Brands run \"TikTok-style\" creative into CTV via third-party tooling, with no TikTok involvement\n\nThe Rollo case is the clearest evidence of how \"TikTok → TV\" actually happens in-market: **Rollo** (a shipping-label brand) took its **existing social and vertical creative** and reformatted it for CTV using **Spaceback** (via its Launchpad UI) and **Roku Ads Manager**, adding interactive overlays — reaching ~700,000 households at reported sub-$0.01/day per unique household and ~$182 average order value [29]. Separately, publisher **Uproxx** pitched advertisers \"TikTok-ready shows\" at its 2026 NewFront — CTV originals designed to translate to TikTok-style short clips (claiming 160M+ monthly viewers, half on TV screens) [30][31]. *Type: established.* **Both are \"repurpose the vertical grammar,\" not \"extend the TikTok audience.\"** Rollo used Roku's household graph and Spaceback's creative tooling; Uproxx used its own inventory and creator content. TikTok the company — its audience, its identity graph, its DSP relationships — is absent from both. This is exactly the distinction the brief demands: TikTok-*style* creative on CTV is common; a TikTok-*audience* bridge to CTV does not exist.\n\n### The TikTok read, plain\n\nTikTok is a top-tier US ad platform (~$14–17B US ad revenue projected for 2026) whose big-screen presence is, at this moment, *nil*: a dead app, an explicit \"not on the roadmap,\" a US business in the first year of a forced ownership restructuring. The \"TikTok on CTV\" story that has momentum is not TikTok's — it is (a) streamers borrowing vertical-feed grammar as a discovery lever, and (b) brands repurposing TikTok-style creative through Roku, Spaceback, and DSPs. Neither carries a TikTok social engager to a household CTV impression. A genuine TikTok social→CTV retargeting bridge would require TikTok to (i) build or license CTV supply, (ii) resolve its mobile users to households, and (iii) activate them off-platform. It is doing none of the three, in a regulatory environment that discourages starting. The realistic 2029 path for TikTok is *continued mobile dominance plus creative influence on how CTV ads look and how streamers design discovery* — not a retargeting bridge.\n\n---\n\n## Part III — Comparative Read: Two Ways to Not Be a Bridge\n\n| Dimension | Reddit | TikTok |\n|---|---|---|\n| Core ad business (2026) | ~$625M ad rev/qtr, +74% YoY; on-platform [1] | ~$14–17B US ad rev (est. 2026) [28] |\n| Big-screen app today | None (never had one) | Dead (2021→shut down Jun 15, 2025) [13][17] |\n| Stated CTV posture | Silent; building walled garden [7][8] | \"Not on the roadmap right now\" [15][19] |\n| The \"CTV\" thing they're cited for | In-feed interactive ads (Running Man) [4][5] | Vertical-video-as-funnel + repurposed creative [20][29] |\n| Who actually operates that thing | Reddit, on its own feed | Streamers + brands + Spaceback/Roku — not TikTok |\n| Direction of data strategy | Inward (hoard, wall, own measurement) | Inward (protect core mobile machine under JV) |\n| Regulatory overhang | None material | Fresh Oracle-led JV; algo re-train; <20% ByteDance [25][26] |\n| Genuine social→CTV bridge? | **No — by design** | **No — not built; discouraged by structure** |\n| Long-dated option | Interest/topic signals *could* fuel extension | Creative/behavioral influence on CTV, not audience bridge |\n\nThe instructive contrast: **Reddit won't extend because its whole strategy is to keep everything in; TikTok isn't extending because its biggest bet right now is not breaking the core business during a forced restructuring.** Same non-bridge outcome, opposite reasons. Both get mis-filed under the corpus thesis because \"social platform + big screen\" is a seductive headline — but on the specific mechanic (known social user → resolved household → off-platform CTV impression), both score near zero today.\n\n---\n\n## Open Questions\n\n1. **Is there any real Reddit–Amazon advertising relationship?** This research found only AI-training data licenses (Google, OpenAI) and a *trend grouping* (Amazon/Disney/Reddit interactive formats). If a Reddit-audiences-in-Amazon-DSP arrangement exists, it needs a primary source; the corpus should not assert one. *(Gap-fill candidate.)*\n2. **Would Reddit ever syndicate interest/topic audiences off-platform?** Reddit's \"build bespoke → productize → make programmatic\" pattern *could* one day include CTV or off-platform activation. Is there any executive statement or product signal pointing that way, or is the walled-garden posture firm?\n3. **What does the TikTok USDS JV's ad roadmap actually prioritize?** Does the new entity's product roadmap mention CTV, big-screen, or audience extension at all — or is it pure continuity + algorithm re-training? A primary source (JV statements, Adam Presser interviews) would sharpen the constraint claim.\n4. **Does TikTok's re-trained US algorithm change ad targeting/identity capabilities** in ways that matter for any future extension play (e.g., degraded personalization, new data walls)?\n5. **How durable is the \"vertical-video-as-funnel-entry\" pattern?** AdExchanger has questioned whether streamer vertical feeds are \"worth it.\" If streamers pull back, the main \"TikTok-adjacent CTV\" story loses momentum — worth tracking for the forecast.\n6. **Reddit's ad-tech acquisition(s):** which company/companies, and do any of them have CTV or DSP-activation capabilities that would *contradict* the walled-garden read?\n7. **TikTok's own vertical-clip discovery inside its app on mobile vs. any future TV surface** — does the \"never say never\" leave a realistic 2027–2029 window for a second TV-app attempt under US ownership?\n\n---\n\n## Sources\n\n1. Reddit, Inc. — Form 8-K / Q1 2026 shareholder letter exhibit (quarter ended Mar 31, 2026), SEC EDGAR. Filed 2026. https://www.sec.gov/Archives/edgar/data/0001713445/000171344526000067/exhibit992q126.htm — *Tier 1 (primary; SEC filing). Accessed 2026-06-30 (direct fetch 403; figures corroborated via [2][3]).* Contribution: primary financials — total/ad/other revenue, net income, DAUq, ARPU.\n2. ALM Corp, \"Reddit Q1 2026 Results: Revenue Reaches $663 Million, Ad Revenue Rises 74%…,\" 2026. https://almcorp.com/blog/reddit-q1-2026-results-ad-revenue-search-growth/ — *Tier 5 (trade/analytical; note vendor blog). Accessed 2026-06-30.* Contribution: itemized Q1 2026 figures (revenue $663M, ad $625M/+74%, other $39M/+15%, net income $204M, DAUq 126.8M, ARPU splits); confirms no CTV/off-platform mention.\n3. Eric Seufert, \"Reddit Q1 2026 earnings: 74% ad revenue growth, 75% growth in advertiser count,\" Mobile Dev Memo, 2026. https://mobiledevmemo.com/reddit-q1-2026-earnings-74-ad-revenue-growth-75-growth-in-advertiser-count/ — *Tier 5 (specialist analyst; much behind paywall). Accessed 2026-06-30.* Contribution: ad growth attribution to advertiser count + product launches; confirms no CTV mention in visible text.\n4. Adweek, \"EXCLUSIVE: Reddit Unveils Interactive Ad Format, Piloted by Paramount,\" 2025. https://www.adweek.com/media/reddit-interactive-ad-format-paramount-running-man-game/ — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: the Running Man / Dodge the Drones in-feed format is on-platform, not CTV; KarmaLab + Hi From the Future; Paramount pilot.\n5. (KarmaLab detail via [4] and [6]) — Andy Schneider, head of scale and innovation, Reddit KarmaLab, quoted on \"build bespoke → productize → programmatic.\" *Tier 5 position/statement.* Contribution: Reddit's stated interactive-ads roadmap is on-platform productization.\n6. Digiday, \"Dedicated interactive and localized ad formats are the new focus in the CTV arms race,\" 2026. https://digiday.com/media-buying/dedicated-interactive-and-localized-ad-formats-are-the-new-focus-in-ctv-arms-race/ — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: the \"Amazon, Disney and Reddit\" grouping; establishes Amazon/Disney have CTV formats while Reddit's cited unit is in-feed; no Reddit CTV rollout timeline.\n7. ppc.land / Portada coverage, \"Reddit and Anonym's data deal: no first-party data leaves, ever\" and \"Reddit Seeks to Acquire Adtech to Monetize First-Party Data,\" 2026. https://ppc.land/reddit-and-anonyms-data-deal-no-first-party-data-leaves-ever/ — *Tier 5/6 (trade; treat acquisition-intent as reported claim). Accessed 2026-06-30.* Contribution: walled-garden strategy — Anonym privacy deal (no data leaves), ad-tech acquisition posture.\n8. MediaPost, \"Reddit Expands First-Party Measurement,\" 2026-05-20. https://www.mediapost.com/publications/article/415202/reddit-expands-first-party-measurement.html — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: Dual Attribution beta (May 20, 2026); confirms inward measurement focus, no CTV/off-platform mention; Tesia Sommer quote.\n9. CBS News, \"Google strikes $60 million deal with Reddit, allowing search giant to train AI models on human posts,\" 2024. https://www.cbsnews.com/news/google-reddit-60-million-deal-ai-training/ — *Tier 4 (major outlet). Accessed 2026-06-30.* Contribution: Reddit's data licensing is AI-training (Google ~$60M/yr, Feb 2024), not ad audience extension.\n10. Columbia Journalism Review, \"Reddit Is Winning the AI Game,\" 2025. https://www.cjr.org/analysis/reddit-winning-ai-licensing-deals-openai-google-gemini-answers-rsl.php — *Tier 5 (analytical). Accessed 2026-06-30.* Contribution: OpenAI license (~$70M/yr); Reddit's AI-licensing posture context.\n11. Bloomberg, \"Reddit Seeks to Strike Next AI Content Pact With Google, OpenAI,\" 2025-09-17. https://www.bloomberg.com/news/articles/2025-09-17/reddit-seeks-to-strike-next-ai-content-pact-with-google-openai — *Tier 3/4 (Bloomberg news). Accessed 2026-06-30 (headline/summary).* Contribution: Reddit pursuing *deeper product integration* with Google, not audience syndication to ad platforms.\n12. TikTok Newsroom / smart-TV launch history (2021 Fire TV debut), via Axios [16] and trade recaps. *Tier 1 (product history) via Tier 4.* Contribution: TikTok TV app launched 2021, Fire TV first.\n13. Tech-ish, \"TikTok TV app to Shut Down on June 15, 2025,\" 2025-05-16. https://tech-ish.com/2025/05/16/tiktok-tv-app-to-shut-down-on-june-15-2025/ — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: global discontinuation date (Jun 15, 2025); 2021 launch; poor-traction framing.\n14. eMarketer, \"Instagram's and TikTok's CTV play could reap ad benefits, face format hurdles,\" 2026. https://www.emarketer.com/content/instagram-tiktok-ctv-play-could-reap-ad-benefits-face-format-hurdles — *Tier 5 (trade/analytical). Accessed 2026-06-30.* Contribution: TikTok's prior CTV app \"failed to gain traction\"; format hurdles; mobile-engagement plateau (Meta DAU 6% vs 7%); YouTube Shorts 200B+ daily views.\n15. Mike Shields, \"When it Comes to TV, Instagram and TikTok Are Headed in Opposite Directions,\" 2026. https://mikeshields.substack.com/p/when-it-comes-to-tv-instagram-and — *Tier 5/6 (named-analyst Substack; disclosed expertise). Accessed 2026-06-30.* Contribution: Hammonds \"not on the roadmap\" quote; opposite-directions framing; format/communal-vs-personal mismatch.\n16. Axios (Sara Fischer), \"Scoop: TikTok quietly disappears from smart TVs,\" 2025-02-08. https://www.axios.com/2025/02/08/tiktok-smart-tvs-app-stores-ban — *Tier 4 (major outlet). Accessed 2026-06-30 (403 on direct fetch; summarized via search result and author's X post).* Contribution: US smart-TV removal early 2025 as ban-law compliance (Samsung/LG/Vizio/Amazon/Google/Apple).\n17. Distractify / Techish, \"Why Was TikTok TV Discontinued?\" 2025. https://www.distractify.com/p/why-was-tiktok-tv-discontinued — *Tier 5/6 (trade/consumer). Accessed 2026-06-30.* Contribution: global shutdown framed as pullback to core mobile experience.\n18. Sony Canada support notice, \"TikTok ending on televisions,\" 2025. https://www.sony.ca/en/electronics/support/... — *Tier 1 (device-maker notice). Accessed 2026-06-30.* Contribution: corroborates global TV-service end.\n19. influencermarketinghub / quasa recaps of Instagram (Reels CTV app, Dec 2025) vs TikTok, 2025–2026. https://influencermarketinghub.com/why-instagram-and-tiktok-are-bringing-short-form-video-to-your-tv/ — *Tier 5/6 (trade). Accessed 2026-06-30.* Contribution: Instagram Reels CTV app (Dec 2025); Tessa Lyons \"multi-year journey\" — the contrast case.\n20. eMarketer, \"Vertical video's evolution from mobile content format to CTV discovery lever,\" 2026. https://www.emarketer.com/content/vertical-video-s-evolution-mobile-content-format-ctv-discovery-lever — *Tier 5 (trade/analytical). Accessed 2026-06-30.* Contribution: vertical-as-discovery thesis; Disney+ \"Verts\" (Mar 2026); Netflix vertical test + Greg Peters (Jan 2026); Peacock/Tubi feeds; \"menu not main course.\"\n21. Paramount Ads Manager / gizmott / Over The Top Marketing recaps, 2026, carrying the \"vertical video isn't replacing CTV, it's becoming the entry point into it\" formulation. https://adsmanager.paramount.com/insights/ctv-advertising-news-trends — *Tier 5/6 (trade/vendor). Accessed 2026-06-30.* Contribution: the funnel-entry quote and short→clip→long-form discovery mechanic.\n22. AdExchanger, \"Streaming Platforms Are Embracing Vertical Video. But At This Point, Is It Worth It?\" 2026. https://www.adexchanger.com/ctv-roundup/streaming-platforms-are-embracing-vertical-video-but-at-this-point-is-it-worth-it/ — *Tier 5 (trade/analytical). Accessed 2026-06-30 (headline/summary).* Contribution: skeptical counter-view on streamer vertical feeds — supports Open Question 5.\n23. eMarketer chart, \"Social Video Surpasses CTV\" / \"CTV vs. Social Video\" 2026 spend comparisons. https://www.thekeyword.co/news/us-digital-video-ad-spend-2026 — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: scale context for social video vs CTV ad spend in 2026.\n24. Digital Information World, \"2026 Social Media Benchmark: TikTok Engagement…,\" 2026-03. https://www.digitalinformationworld.com/2026/03/2026-social-media-benchmark-tiktok.html — *Tier 6/7 (aggregator; single-vendor benchmark — treat as directional only). Accessed 2026-06-30.* Contribution: mixed TikTok mobile signals (views down YoY, engagement-rate up) — flagged as contested.\n25. Variety, \"TikTok U.S. Joint Venture Deal Set to Close in January With Investors Including Oracle, Silver Lake, Abu Dhabi's MGX,\" 2025. https://variety.com/2025/digital/news/tiktok-us-joint-venture-deal-close-date-oracle-silver-lake-1236612315/ — *Tier 4/5 (major trade). Accessed 2026-06-30 (redirect noted).* Contribution: JV structure and investor list.\n26. ContentGrip, \"TikTok's US sale update: Oracle and investors take control,\" 2026. https://www.contentgrip.com/tiktok-us-deal-oracle/ — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: closing date Jan 22, 2026; ownership (<20% ByteDance; Oracle/Silver Lake/MGX ~15% each); Adam Presser CEO; Oracle security partner; US algorithm re-train; ByteDance walled off from US data.\n27. Bloomberg, \"What the TikTok Deal Means for the App's Future in the US,\" 2026-01-23. https://www.bloomberg.com/news/articles/2026-01-23/tiktok-s-us-venture-deal-ownership-structure-valuation-algorithm-s-future — *Tier 3/4 (Bloomberg news). Accessed 2026-06-30 (headline/summary).* Contribution: ownership structure, algorithm future, valuation framing; PAFACA compliance.\n28. eMarketer / WARC / GroupM TikTok US ad revenue forecasts (2026: ~$14.03B–$17B US; ~$33.1B global). https://www.emarketer.com/chart/c/355694/ — *Tier 5 (trade forecasts; ranges vary by vendor/methodology). Accessed 2026-06-30.* Contribution: scale of TikTok's US ad business — the machine the JV is protecting.\n29. Demand Gen Report, \"From TikTok to TV Screens: Rollo's CTV Advertising Breakthrough,\" 2026. https://www.demandgenreport.com/case-studies/from-tiktok-to-tv-screens-rollos-ctv-advertising-breakthrough/49888 — *Tier 5/6 (trade case study; vendor-favorable). Accessed 2026-06-30.* Contribution: brand repurposes vertical social creative for CTV via Spaceback + Roku Ads Manager; ~700K households, sub-$0.01/day/household, ~$182 AOV; TikTok not operationally involved.\n30. Adweek, \"Uproxx Makes Play for TV Ad Spend With TikTok-Ready Shows,\" 2026. https://www.adweek.com/convergent-tv/uproxx-makes-play-for-tv-ad-spend-with-tiktok-ready-shows/ — *Tier 5 (trade). Accessed 2026-06-30.* Contribution: publisher (not TikTok) pitching TikTok-style CTV shows; 160M+ monthly viewers, half on TV.\n31. AdExchanger, \"Uproxx Takes Aim At CTV With The Launch Of A New TV Unit,\" 2026. https://www.adexchanger.com/tv/uproxx-takes-aim-at-ctv-with-the-launch-of-a-new-tv-unit/ — *Tier 5 (trade). Accessed 2026-06-30 (headline/summary).* Contribution: corroborates Uproxx CTV unit as publisher-led, TikTok-style-creative, not a TikTok bridge.\n\n*Sourcing note:* Reddit and TikTok primary channels (SEC exhibit [1], device-maker notices [18]) anchor the going-concern facts; the divestiture is triangulated across Variety/Bloomberg/ContentGrip [25][26][27]. Trade sources (Tier 5) carry the product-and-format narrative and are flagged where single-vendor or vendor-favorable (esp. [24] engagement benchmark and [29] case study). Direct fetches to SEC EDGAR [1] and Axios [16] returned 403; their facts are corroborated through secondary reporting and are flagged as such. No Wikipedia, no AI-generated content, no press release cited as proof of its own claim."}, {"order": 6, "file": "06_Meta_Instagram_TV.md", "title": "Meta / 'Instagram TV' — The CTV Question", "summary": "", "body": "# Meta / \"Instagram TV\" — The CTV Question\n\n## Bottom Line\n\n**Does Meta have a social-to-CTV play? Not yet as an *advertising* business — but it has just planted both feet in the living room, and it is quietly assembling the pieces of one.** What exists today is a *content and engagement* move, not an ad product: **Instagram for TV**, a lean-back app that streams Reels to the big screen. It launched into test on **Amazon Fire TV on December 16, 2025**, then expanded to **Google TV (February 24, 2026)** and **Samsung smart TVs (June 2026)** — the three largest US connected-TV (CTV) platforms — while staying **US-only** as of this writing. That is Meta chasing Reels' watch-time against YouTube and TikTok on the one screen it never owned. It is not selling a TV ad. Separately and unannounced, trade reporting (Digiday, April 2026) says Meta has since early 2025 held **exploratory meetings with supply-side platforms (SSPs) — Magnite and Comcast's FreeWheel — plus TV manufacturers and publishers** to work out how to push its ad *demand* into third-party streaming inventory. The shape analysts expect is **\"Audience Network for CTV\"**: not Meta building or buying TV supply, but Meta extending its **Advantage+** performance engine and audience signals into *other people's* streaming inventory via SSPs — the same off-platform demand-extension pattern LinkedIn ran onto Amazon's DSP and Pinterest ran through tvScientific.\n\nThe strategic logic cuts hard both ways. **For:** Meta owns the largest social graph and the best-converting self-serve performance-ad machine on earth (~**$196B in 2025 ad revenue**; Reels alone at a **$50B annual run-rate** as of Q3 2025); it faces the same signal-loss pressure everyone else does; and CTV budgets are migrating (US CTV ad spend ~**$33.4B in 2025**, on track to pass linear TV by 2028). **Against:** Meta's entire model is *owned-and-operated, self-serve, individually-targeted, closed*; CTV is *third-party, household-scoped, and outside its walls*; Meta has never bought third-party media at scale by choice, and its one attempt to own video supply (LiveRail, 2014) was written down for fraud and bad inventory; CTV CPMs of ~$20–$40 sit awkwardly against Meta's ~$6–$9 auction; and any move onto the big screen invites both channel-conflict and antitrust questions. **Analyst read: a Meta-to-CTV *ad* product is probable within the forecast window (call it more-likely-than-not by 2028), but it will look like a demand pipe, not a TV network** — Advantage+ audiences activated against third-party CTV supply through SSPs and clean rooms, with Reels-on-TV as owned inventory it can layer in later, *not* a $10B acquisition of a CTV DSP. The single most load-bearing caveat in this document: **every claim about the ad product is inference from anonymously-sourced trade reporting. Meta has announced nothing.** Instagram for TV, by contrast, is confirmed, live, and expanding — and is the tell.\n\n---\n\n## Why This Question Is Live Now\n\nFor most of the CTV era, the standard industry map had a Meta-shaped hole in it. Roku, Amazon, Samsung, LG, Vizio, and the streamers own the glass; The Trade Desk and Amazon's DSP move the money; retail-media networks (Amazon, Walmart) supply the outcome data. Meta was simply *not in the room* — not because it couldn't be, but because its business didn't need to be. Meta prints money selling ads against inventory it owns (Facebook, Instagram, Messenger, WhatsApp), to advertisers who self-serve through a closed auction, aimed at individuals it can identify. CTV mirrors every one of those traits in reverse: someone else's inventory, bought through intermediaries, delivered to a household rather than a person. The two models did not obviously meet.\n\nThree things changed the calculus at once, and all three landed inside the last twelve months:\n\n1. **Meta walked onto the screen with a *content* app.** Instagram for TV is the first time Meta has native software running in the living room — a beachhead whether or not it was designed as one.\n2. **The ad budgets kept moving.** US CTV ad spend crossed roughly **$33.4B in 2025** and is forecast to overtake linear TV by 2028. For the company on track to be the largest ad seller in the industry, an addressable pool that size — growing double digits, with performance-buying still immature — is not one a demand engine ignores forever.\n3. **The peer template hardened.** LinkedIn extended its professional graph onto Amazon's DSP; Pinterest bought tvScientific to turn high-intent pins into outcome-based CTV; Reddit and TikTok pushed their own off-platform CTV demand. \"Social-to-CTV retargeting\" stopped being a thesis and became a category with working examples. Which raises the obvious question — *where is the biggest social platform of them all?* That is the one this document answers.\n\nSo this workstream asks and answers four things: **(a)** what Meta has actually shipped; **(b)** why it historically had no CTV ad play; **(c)** the disambiguation that trips up half the coverage — new Reels-on-TV vs. the dead IGTV; and **(d)** the forward analysis Calvin explicitly wants: what a real Meta social-graph-to-streaming retargeting solution would look like, and how probable it is.\n\n---\n\n## (a) What Actually Exists: Instagram for TV — an Engagement Move, Not an Ad Product\n\n### The product, decoded\n\n**Instagram for TV** is a dedicated television app that plays Instagram **Reels** — Meta's short-form vertical-video format — on the big screen: a lean-back, auto-playing, sound-on experience organized into interest-based \"channels\" (music, sports, travel, comedy, trending). It answers a simple gap: people watch YouTube and increasingly TikTok on their TVs, but had no way to watch Instagram there. You sign in with your Instagram account, add up to **five accounts per device** so household members keep separate recommendation feeds, and — notably — you can create a TV-only account not linked to your phone profile. [1][2]\n\nMeta's own framing is pure engagement, not monetization. In the announcement, the company said it had \"heard from people that watching reels together is more fun, and this test is designed to learn which features make that experience work best on TV.\" [1] Instagram head **Adam Mosseri** had signaled the move was overdue: in October 2025 he said \"TV is an increasingly important surface, it's been very important for YouTube... it's been very important for TikTok.\" [2] That is the whole thesis in one line: *Reels' watch-time rivals already live on the TV, and Instagram didn't.*\n\n### Going-concern status: confirmed live and expanding, US-only\n\nThis is a present-tense product, so it gets logged as discrete factual claims with dated confirmations (see Key Claims 1–4). The timeline as of this writing:\n\n| Date | Milestone | Source tier |\n| --- | --- | --- |\n| **Dec 16, 2025** | Launch into test on **Amazon Fire TV** (Fire TV Stick HD, 4K Plus, 4K Max 1st/2nd Gen; Fire TV 2/4-Series, Omni QLED), **US only** | Tier 1 Meta [1]; Tier 3–4 [2][7] |\n| **Feb 24, 2026** | Expansion to **Google TV** devices, still US only | Tier 4 [2]; Tier 5 [8] |\n| **Jun 2026** | Expansion to **Samsung smart TVs** (2020 models and newer); reaches the three largest US CTV platforms | Tier 4/5 [9][10] |\n\nAs of June 2026, Meta describes the app as available in the **US only**, promising expansion to \"more countries and devices in the future\" but naming no date. [1][9] So the correct present-tense statement is narrow, and must stay narrow: *Instagram for TV is live, in test, on Fire TV / Google TV / Samsung, in the US only.* Read it as \"Instagram launched a global TV streaming service\" and you have overstated a six-month-old pilot.\n\n### The tell: it is quietly growing into more than Reels\n\nTwo 2026 developments matter for the forward analysis, because they turn a Reels player into something closer to owned CTV *supply*:\n\n- **Episodic series.** Instagram launched an episodic-series feature on mobile (creators group Reels into sequential \"seasons\" with dedicated profile hubs) on **June 2, 2026**, and is exploring bringing longer-form/episodic content to the TV app. [10]\n- **A horizontal-video hub and \"Live on TV.\"** Meta is testing a landscape-video hub and live-streaming on the TV app — both explicit moves toward the sustained, lean-back sessions that CTV *advertising* is priced against, rather than thumb-flick Reels. [10]\n\nTrade coverage has started calling this \"Instagram wants to be your next streaming service.\" [10] That is trade hyperbole. But the direction is real, and it is the direction that would eventually hand Meta **owned big-screen inventory** to sell against. Hold that thought for section (d).\n\n### The critical qualifier: no CTV ad product has been announced\n\n**Instagram for TV carries no announced advertising as of this writing.** Meta's launch materials say nothing about ads or monetization on the app [1], and no first-party coverage identifies an in-app ad load. That fits how Meta launches consumer surfaces — build the audience first, monetize later. It is the Reels playbook exactly: Reels shipped in 2020, monetization followed. So the honest statement is this: **the app is an engagement/content move; any ad product is future and unannounced.** Do not let the two blur.\n\n---\n\n## (b) Why Meta Historically Had *No* CTV Ad Play\n\nTo forecast what Meta *will* do, be precise about why it *didn't*. This was never inertia. It is a coherent business model that CTV cuts against on three axes.\n\n### 1. Owned-and-operated vs. third-party\n\nMeta's ad business is almost entirely **owned-and-operated (O&O)**: it sells inventory *on its own apps*. In 2025 Meta booked roughly **$196B in advertising revenue** [3] — the overwhelming majority of it against Facebook, Instagram, Messenger, and WhatsApp surfaces it controls end to end. It sets the auction, owns the user relationship, measures the outcome, and keeps ~100% of the media dollar rather than a rep's cut. CTV inventory is, by definition, **third-party**: it belongs to Roku, Samsung, Disney, Paramount, Netflix, YouTube. To sell CTV ads, Meta would have to buy or broker *someone else's* supply — a lower-margin, lower-control business than the one that made it a trillion-dollar company. For a decade, Meta has shown it prefers to own the pipe.\n\n### 2. Individual targeting vs. household scope\n\nMeta's superpower is **person-level identity and conversion**. It knows *you* — logged-in, cross-device, tied to a real identity and a rich behavioral graph — and its Advantage+ machine optimizes toward *your* individual conversion. CTV's native unit is the **household**: a shared screen, often no login, addressed via IP address, ACR (automatic content recognition — the TV \"listening\" to what's on screen), and probabilistic device graphs. The precision that makes Meta's auction convert degrades the moment the impression becomes a living-room co-viewing event rather than a phone in one person's hand. Meta's model doesn't just *not need* the household frame — it is partly *built against* it.\n\n### 3. Self-serve, closed, performance vs. managed, open, brand\n\nMeta's demand is millions of self-serve advertisers — heavily small and mid-sized businesses (SMBs) — running direct-response campaigns through a closed, automated interface. CTV, historically, has been a **brand** medium sold through **managed service**, insertion orders, and upfront commitments, priced at premium CPMs (~$20–$40) far above Meta's ~$6–$9 auction range. [4] The buyer, the buying motion, the creative (a :30 spot vs. a vertical Reel), the KPI (reach/awareness vs. installs/purchases) — all of it was foreign to Meta's machine. There was no clean way to plug a performance-SMB firehose into a brand-CPM medium.\n\n### 4. The scar tissue: LiveRail (2014)\n\nMeta *did* try to own video supply once. It acquired video SSP **LiveRail in July 2014** to power video ads across the Facebook Audience Network and beyond, serving clients like Hulu and MLB. [5] It was a debacle: the business was **written down** amid fraud and poor supply quality, LiveRail's ad server was sunset, its CEO and ~40 staff departed, and Meta retreated from owned video ad-tech infrastructure. [5] That episode is the single best explanation for why any Meta CTV move today is expected to be **partnership-led, not build-or-buy-the-supply**. Meta has direct, expensive experience of what goes wrong when it tries to own third-party video inventory.\n\n### The make-vs-buy tension in one line\n\nTogether, these four forces explain a real strategic knot: **Meta's demand is enormous and would love CTV's audiences, but Meta's entire operating model is tuned for a world where it owns the inventory and targets the individual — and CTV is neither.** Every path to closing that gap (build supply, buy a DSP, broker third-party inventory) violates at least one of the things that made Meta Meta. That tension, not lack of ambition, is why the CTV ad play didn't exist. It is also why, when it comes, it will take the *least* model-violating shape available — precisely the \"Audience Network for CTV\" analysts are pointing at.\n\n---\n\n## (c) Disambiguation: \"Instagram TV\" ≠ IGTV\n\nThis trips up a lot of coverage, so state it flatly.\n\n**The new thing (2025–2026): Instagram for TV / \"Reels TV.\"** A *TV app* that brings *short-form Reels* (Meta's phone-native vertical video) *to* the living-room screen. Launched Dec 2025 on Fire TV; a consumption surface for existing Reels content; alive and expanding today. [1][2]\n\n**The dead thing (2018–2022): IGTV.** A *standalone mobile app* (and in-feed format) for *long-form vertical video*, launched June 2018 as Instagram's would-be **YouTube competitor** — the exact opposite direction of travel. It failed: at peak, only ~7 million of Instagram's 1B+ users had downloaded the standalone app. Instagram folded the branding into \"Instagram Video\" in October 2021, **discontinued the standalone IGTV app in February 2022**, and ended the associated in-stream \"IGTV ads\" as it pivoted everything to Reels. [6]\n\nThe two are almost inversely related:\n\n| | IGTV (dead) | Instagram for TV (live) |\n| --- | --- | --- |\n| **Years** | 2018–2022 | Dec 2025– |\n| **Surface** | Standalone *mobile* app | *Television* app (Fire TV/Google TV/Samsung) |\n| **Content** | Long-form *vertical* video | Short-form *Reels* (+ testing horizontal/episodic) |\n| **Strategic goal** | Beat YouTube at long-form on *mobile* | Bring Reels to the *big screen* vs. YouTube/TikTok |\n| **Ads** | Had \"IGTV ads\" (ended 2022) | **No announced ads** |\n| **Fate** | Killed | In-market, expanding |\n\nThe lesson Meta appears to have drawn from IGTV — cited explicitly in current coverage — is to build on *existing* content and behavior (Reels people already make and watch) rather than demand a new creator format nobody wanted. [10] That lesson is why Instagram for TV is a Reels player, not \"IGTV for the TV.\"\n\n---\n\n## (d) The Forward Analysis: What a Real Meta-to-CTV Retargeting Solution Would Look Like\n\nThis is the heart of the workstream, and the part Calvin explicitly asked for. **Everything below the confirmed groundwork is inference, and is labeled as such.** The confirmed groundwork itself rests on anonymously-sourced trade reporting; treat it as strong signal, not settled fact.\n\n### What is actually confirmed vs. inferred\n\n**Confirmed (Tier 5 trade, anonymous sourcing, but multiple outlets):** Meta has, **since early 2025**, held exploratory meetings with **SSPs Magnite and Comcast-owned FreeWheel**, plus **TV manufacturers and publishers**, to assess how to access CTV inventory at scale and push its ad demand into third-party streaming environments. Nothing has been officially unveiled; Meta declined to comment; sources stress no formal roadmap commitment exists. [11][12][13] This is the load-bearing reporting behind the whole forward analysis, and it is **single-thesis, anonymously sourced** — flagged accordingly.\n\n**Inferred (analyst synthesis):** the *shape* those meetings imply. Three named industry voices in the reporting frame it consistently: an \"Audience Network for the living room\" model; Max Willens of eMarketer noting Meta \"have gotten a massive amount of buy-in\" for demand extension; a consultant noting \"real power in large owned-and-operated media and ads businesses extending.\" [11][12]\n\n### The three doors Meta could walk through\n\nA Meta-to-CTV solution is really a make-vs-buy-vs-broker decision. Three doors, with the analyst read on each.\n\n#### Door 1 — Broker third-party supply: \"Audience Network for CTV\" (most likely)\n\nThis is where the confirmed groundwork points. **Meta extends its ad *demand* — Advantage+ campaigns and its person-level audience signals — into third-party CTV inventory accessed via SSPs (Magnite, FreeWheel) and TV OEMs, without owning the supply.** [11][12][13] Mechanically, it is a direct descendant of the **Meta Audience Network (FAN)**, the in-app network Meta built in 2014 to run its demand against third-party *mobile* app inventory. [5][14] Swap \"third-party mobile apps\" for \"third-party CTV inventory\" and you have the model. In the ideal version, a Meta advertiser extends an existing Advantage+ campaign onto CTV **through the same self-serve interface they already use** — no upfront, no minimum, no insertion order. [12]\n\nThis is the LinkedIn-and-Pinterest pattern at Meta scale: **audience extension off-platform onto CTV supply.** It violates Meta's model the *least* — Meta keeps the demand relationship, the targeting, and the interface; it just rents the glass. It also fits Meta's post-2025 posture: after cutting ~10% of its workforce (~8,000 roles), a \"plug-and-play\" demand pipe is cheaper to stand up than owned infrastructure. [13]\n\n**The hard problem, and it is real:** the **CPM mismatch**. CTV inventory clears at ~$20–$40; Meta's auction lives at ~$6–$9. [4] The open analyst question (Brainlabs, June 2026) is *whether Meta's performance algorithm will naturally find a conversion signal on inventory priced 3–5x its comfort zone, or whether Meta will have to \"steer\" spend to make CTV clear* — exactly the kind of managed intervention Meta's whole self-serve philosophy resists. [4] Then the identity bridge: matching Meta's person-level graph to household CTV impressions requires **clean rooms** (privacy-safe data-matching environments — AWS, Snowflake) and probabilistic graphs, degrading the precision that makes Meta convert. This door is the most probable *and* the least solved on economics.\n\n#### Door 2 — Build owned CTV supply: Reels TV as Meta's own inventory (slow-burn, complementary)\n\nThe second door is the one **Instagram for TV is quietly building**. If the TV app grows lean-back sessions, horizontal video, episodic series, and live — all now in testing [10] — Meta ends up with **owned-and-operated big-screen inventory it fully controls**, sidestepping the third-party/margin problem entirely. This is the most *on-brand* option: Meta prefers to own the pipe (section b), and O&O CTV supply would let it apply person-level targeting to logged-in TV viewers (recall the 5-account login) rather than anonymous households — a genuinely differentiated position no other CTV player can match at Meta's identity depth.\n\nBut it is **slow**. Reels-on-TV watch-time is a rounding error against YouTube's TV footprint today, and building a lean-back audience large enough to matter to a $196B ad business takes years. The realistic read: **Door 2 is a complement, not a substitute.** Meta almost certainly does both — broker third-party supply for scale *now* (Door 1) and grow owned Reels-TV inventory as premium, fully-targetable supply *over time*. The owned inventory becomes the highest-value slice of a broader CTV demand product — the sliver Meta can price and target like nobody else.\n\n#### Door 3 — Buy a CTV / performance-CTV platform (least likely)\n\nMeta *could* acquire a CTV DSP or a performance-CTV specialist (an MNTN-like outcome-CTV platform, or a supply-path player) to buy its way in. **This is the least likely door**, for reasons that are almost overdetermined:\n\n- **History:** the last time Meta bought third-party video ad-tech (LiveRail), it wrote it down for fraud. [5] That scar is explicitly cited as *why* the current approach is partnership-led. [11]\n- **Philosophy:** Meta has essentially *never* bought third-party media supply at scale by choice; its instinct is build-and-own, not buy-the-middleman.\n- **Antitrust:** in 2026, a Meta acquisition of a CTV ad-tech platform would draw immediate scrutiny, given the DOJ/FTC posture toward ad-tech consolidation and Meta's existing antitrust exposure. A demand-extension partnership is far less legally provocative than a supply acquisition.\n\nNever say never on a company this cash-rich. But the base rate and the incentives both point away from a big buy.\n\n### Would Meta open Advantage+ audiences to third-party CTV via clean rooms?\n\nYes — and this is likely the *connective mechanism* under Door 1, not a fourth door. The privacy-safe way to let Meta's person-level audiences target third-party CTV impressions is **data clean rooms**: Meta's signals and the publisher/OEM's inventory meet in a neutral environment (AWS Clean Rooms, Snowflake, Habu-style) where matching happens without either side handing over raw user data. That is how a \"Meta engager\" becomes a \"household CTV impression\" without Meta exporting its graph or the publisher exporting its viewers. Expect clean-room matching to be the plumbing beneath any Advantage+-to-CTV extension — the same architecture LinkedIn and Amazon use for their DSP tie-up. (Detailed mechanics live in workstream 2; here it is enough to say clean rooms are the probable identity bridge.)\n\n### The strategic case, scored\n\n**FOR a Meta CTV ad play:**\n- **Largest social graph on earth** — 3.58B daily active people (Dec 2025) [3] — the richest targeting substrate in advertising.\n- **Best-in-class performance engine** — Advantage+/AI ad tools past a $60B run-rate; the self-serve machine SMBs already live in. Reels alone at a **$50B run-rate** (Q3 2025), now larger than YouTube's ~$46B total ad revenue. [15]\n- **Signal-loss pressure** — the same ATT/cookie erosion pushing every social platform off-platform pushes Meta too; CTV's logged-in, first-party-rich environment is attractive.\n- **Budget migration** — US CTV ~$33.4B (2025), passing linear by 2028; the largest ad seller cannot cede a pool that size to YouTube/Amazon/Trade Desk forever.\n- **A working peer template** — LinkedIn→Amazon DSP, Pinterest→tvScientific prove social-to-CTV extension is viable; Meta has more demand than all of them combined.\n\n**AGAINST:**\n- **Channel conflict** — Meta's pitch is \"you don't need TV budgets, come to us\"; selling CTV undercuts its own performance story and competes with the O&O inventory it wants advertisers spending on.\n- **Measurement** — household CTV impressions don't map cleanly to Meta's pe
