d 2026-06-30. *Tier 5 — law-firm summary of 2026 CCPA regs (sensitive data, minors).*\n21. Texas Office of the Attorney General, \"Attorney General Paxton Sues Five Major TV Companies … for Spying on Texans,\" press release, Dec. 16, 2025. https://www.texasattorneygeneral.gov/news/releases/attorney-general-paxton-sues-five-major-tv-companies-including-some-ties-ccp-spying-texans. Accessed 2026-06-30. *Tier 1 — primary enforcement announcement (cited for the fact and terms of the suits and TROs).*\n22. IAPP, \"Automated content recognition technology takes privacy enforcement spotlight.\" https://iapp.org/news/a/automated-content-recognition-technology-takes-privacy-enforcement-spotlight. Accessed 2026-06-30. *Tier 5 — independent analysis of the Texas ACR suits and the DTPA enforcement pathway.*\n23. Federal Trade Commission, \"VIZIO to Pay $2.2 Million to FTC, State of New Jersey to Settle Charges It Collected Viewing Histories on 11 Million Smart Televisions without Users' Consent,\" press release, Feb. 6, 2017. https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey-settle-charges-it-collected-viewing-histories-11-million. Accessed 2026-06-30. *Tier 1 — primary regulatory settlement announcement.*\n24. Traverse Legal, \"CIPA & Meta Pixel Threat Letter & Litigation Update.\" https://www.traverselegal.com/blog/cipa-meta-pixel-threa-letter-litigation-update/. Accessed 2026-06-30. *Tier 5 — law-firm update; CIPA $5,000-per-violation, pen-register theory, SB 690. Plaintiff-adjacent framing noted.*\n25. Bloomberg Law, \"Meta's Health Privacy Trial Loss Spotlights Power of Wiretapping.\" https://news.bloomberglaw.com/litigation/metas-health-privacy-trial-loss-spotlights-power-of-wiretapping. Accessed 2026-06-30. *Tier 4 — legal-news reporting on the CIPA wiretap theory.*\n26. CompliancePoint, \"Jury Rules Meta Violated California Privacy Law by Collecting Health Data\" (Frasco v. Flo Health, N.D. Cal. jury verdict, Aug. 1, 2025). https://www.compliancepoint.com/privacy/jury-rules-meta-violated-california-privacy-law-by-collecting-health-data/. Accessed 2026-06-30. *Tier 5 — analysis of the Flo/Meta CIPA verdict; corroborated by Bloomberg Law [25].*\n27. Privacy World, \"California Federal Court Urges California Legislature to Clean Up 'Total Mess' of State Wiretap Act, Dismisses Claim for Website Tracking\" (Doe v. Eating Recovery Center, N.D. Cal., Oct. 2025). https://www.privacyworld.blog/2025/12/california-federal-court-urges-california-legislature-to-clean-up-total-mess-of-state-wiretap-act-dismisses-claim-for-website-tracking/. Accessed 2026-06-30. *Tier 5 — law-firm analysis of the narrowing CIPA ruling.*\n28. Duane Morris, \"California Federal Court Narrows CIPA 'In-Transit' Liability …,\" Oct. 21, 2025. https://blogs.duanemorris.com/classactiondefense/2025/10/21/california-federal-court-narrows-cipa-in-transit-liability-for-common-website-advertising-technology-and-urges-legislature-to-modernize-privacy-law/. Accessed 2026-06-30. *Tier 5 — law-firm analysis corroborating the narrowing trend.*\n29. Holland & Knight, \"Court Denies Class Certification in Meta Pixel Case: Key Takeaways for Defense,\" Apr. 2026. https://www.hklaw.com/en/insights/publications/2026/04/court-denies-class-certification-in-meta-pixel-case. Accessed 2026-06-30. *Tier 5 — law-firm analysis of the April 2026 class-cert denial.*"}, {"order": 11, "file": "11_Gap_Streamer_Disintermediation.md", "title": "The Supply Side Learns to Sell the Audience — When Streamers Become the Targeting Layer", "summary": "", "body": "# The Supply Side Learns to Sell the Audience\n\n## Bottom Line\n\nThe social-to-CTV thesis rests on one unstated assumption: that the streamers and smart-TV operating systems who own the living-room impression will stay *inventory* — pipes to be rented — while the demand-side social platforms supply the *targeting*. Test that assumption and it cracks. Every major streamer and TV-OS operator now runs its own first-party audience business, sold as branded, dated, going-concern products: **Disney Select** (roughly 1,800 first-party segments built on the Disney Audience Graph, activated through the Disney Real-Time Ad Exchange), **NBCUniversal's One Platform and NBCU ID** (about 150 million person-level identifiers), **Netflix's own ad server and native interest segments** (its Microsoft dependency severed in 2025, its own conversion API shipped in early 2026), **Roku Data Cloud** (built on 100M+ streaming households and ACR-plus-account signals), and the ACR-data arms of **Samsung Ads, LG Ad Solutions, and Walmart-owned Vizio**. Amazon is the extreme case — DSP rail, retail-media data seller, and streamer-with-first-party-audience all at once. The supply side is not merely inventory. It is, increasingly, a competing *seller* of audience.\n\nThat reframes the corpus's central risk. The question is not whether streamers *can* sell targeting — they do, today, at scale — but whether the specific segments the social platforms license are ones a streamer can *approximate from its own data*. Here the answer splits cleanly, and it vindicates the corpus's earlier instinct. **Viewing plus registration plus commerce data reconstructs demographic, behavioral, content-affinity, and household segments extremely well** — exactly the terrain Pinterest's interest signal, Reddit's community affinity, and TikTok's engagement signal occupy. It reconstructs **verified professional identity — job title, seniority, employer, function — essentially not at all**, because no one declares their VP-of-Procurement status to a television. LinkedIn's moat is real and structural. The other four social entrants sell a signal the supply side can counterfeit from its own logs.\n\nOn the 2029 horizon the streamers' audience businesses are, for the substitutable segments, **ahead of** the social entrants. They have been productized and sold since 2021 (Disney Select), 2020 (NBCU One Platform), and 2025 (Netflix's ad-server independence, Roku Data Cloud), whereas Meta has no product, Reddit and TikTok have no owned screen, and only Pinterest and LinkedIn have shipped. The inversion scenario is therefore not exotic. It is the base case for four of the five social platforms: as streamer first-party targeting matures and match-rate decay erodes the imported social signal, the streamer's own segment becomes the default and the social data fee shrinks from must-have to nice-to-have. The exception that proves the rule is LinkedIn — and that exception is narrow enough to matter.\n\n---\n\n## 1. The Frame: Inventory That Learned to Sell Targeting\n\nThe earlier chapters of this corpus build a clean two-sided picture. On the demand side sit five walled-garden social platforms with closed first-party audiences. On the supply side sits fragmented CTV inventory — streamers, TV operating systems, FAST channels — bought through neutral demand-side platforms. The social platform supplies *identity and intent*; the streamer supplies *the impression*; a DSP bridges them; the social platform collects a data-licensing fee that the market-structure chapter identifies as \"the thinnest and least defensible link\" in the chain.\n\nThe unexamined premise is that the supply side *stays* supply. It does not. Over the same decade in which signal loss pushed social platforms off-platform, the largest streamers and TV-OS operators built the exact asset the social platforms are now trying to rent them: a first-party audience graph, packaged into segments, sold to advertisers. Same reason, same pressure — Apple's App Tracking Transparency and cookie deprecation devalued third-party data industry-wide, and the parties who owned logged-in, authenticated relationships with viewers found those relationships were suddenly the scarce asset. The retailers moved first (the retail-media template of Chapter 1 and 7). The streamers moved in parallel.\n\nSo the \"walled garden meets open CTV\" framing understates the collision. This is not gardens renting pipes. It is **gardens renting pipes from a landlord who is himself building a garden** — and who, for a large class of audience segments, can furnish the tenant's crown jewels from his own cupboard. The rest of this essay names each landlord's product, dates it, and asks the only question that matters for durability: of the signal the social platform is selling, how much can the streamer already reproduce in-house?\n\nA note on what this essay is *not* re-litigating. It does not re-propose the DSP-rail concentration risk — the danger that LinkedIn's entire CTV path runs through Microsoft Monetize into two DSPs — which the LinkedIn chapter covers. Nor does it re-run the retail-media template as such. The fresh object here is narrow and specific: **the streamer and the TV-OS operator as a competing audience *seller*, not as inventory supply.** Where the retail-media chapter asks \"what happens when a retailer's purchase data enters CTV,\" this one asks \"what happens when the CTV platform sells its own targeting and no longer needs the retailer's data — or the social platform's — at all.\"\n\n---\n\n## 2. Disney: The Audience Graph Is Still the Product\n\nDisney is the most mature streamer-as-audience-seller, and the branded product names the corpus references remain live in 2026. The **Disney Audience Graph** is the underlying identity and modeling asset; **Disney Select** is the packaged, buyable segment layer sitting on top of it; and the **Disney Real-Time Ad Exchange (DRAX)** is the programmatic engine that activates those segments in a biddable environment across Disney+, Hulu, and ESPN.\n\nThe scale is not trivial. Disney's own fact sheet describes Disney Select as offering **roughly 1,800 audience segments built from more than 100,000 audience attributes**, spanning buyer behavior, household characteristics, and psychographics [1]. Read that as vendor-attested rather than audited — Disney's own marketing material — but the load-bearing fact is the *existence and productization* of an 1,800-segment first-party catalog, and independent trade coverage of Disney's ad-tech showcases corroborates it [2][3]. Disney has publicly stated a goal to **automate more than half of its ad-sales business within five years**, and reports that DRAX drove a **70% lift in campaigns leveraging Disney Select segments** in its first year, running thousands of programmatic video campaigns [2]. The direction of travel is unmistakable. Disney is moving from selling pods to selling *audiences*, and it markets its first-party data as a currency to every advertiser.\n\nTwo 2025–2026 developments sharpen the disintermediation point. First, in **June 2025 Disney integrated DRAX with Amazon DSP**, connecting its real-time exchange to Amazon's demand across Disney+, ESPN, and Hulu; the integration explicitly lets advertisers \"match Disney's audience data with browsing, streaming, and purchase insights from Amazon Ads\" via a tie between Amazon Publisher Cloud and **Disney Compass**, Disney's proprietary data platform [4]. Second, Disney supports **DRAX Direct**, where advertisers match their own first-party data against the Disney Audience Graph through identity spines including The Trade Desk's UID2 and Google's PAIR, and it integrates directly with 30-plus DSPs [2][3].\n\nDoes Disney approximate the firmographic or intent segments a social platform would license? Partially, and revealingly. Disney can sell content-affinity and behavioral segments (\"sports viewers,\" \"family entertainment households\"), demographic and household segments, and — through its clean room and the Amazon integration — segments *enriched with third-party purchase and browsing data*. That covers much of what Pinterest's interest signal or Reddit's affinity signal offers. What Disney's Audience Graph cannot manufacture from viewing data is *verified professional identity* — it has no idea which of its 164 million monthly ad-supported viewers is a \"VP of Engineering at a 500-person SaaS firm.\" On the substitutable segments Disney competes directly with the social data fee; on LinkedIn's segment it does not compete at all. That split recurs across every player below.\n\n---\n\n## 3. NBCUniversal: One Platform and the 150-Million-ID Graph\n\nNBCUniversal built its first-party audience business earlier than most, under a stable brand. **One Platform**, launched in 2020, is NBCU's cross-portfolio ad platform; **NBCU ID** is the identity spine beneath it. Trade reporting on NBCU's ONE21 showcase and later coverage describe NBCU ID as a unified data platform combining first-party audiences from NBCU's entertainment brands, OTT properties, Peacock, and even Universal Parks — wielding roughly **150 million person-level identifiers and 50 million household identifiers** that marketers can match against their own data [5]. The **NBCU Audience Insights Hub**, a clean room launched atop One Platform, lets marketers run privacy-safe queries across NBCU's linear and digital audience data [5].\n\nNBCU keeps investing in plain sight. Ahead of CES 2026 (announced December 17, 2025) it launched a **Performance Insights Hub** — a proprietary intelligence layer integrating first- and third-party data through standardized schemas with partners including LiveRamp, VideoAmp, and Kochava — alongside Peacock ad formats such as **Arrival Ads** and programmatic pause ads [6]. This is Disney's playbook under a different brand: an owned identity graph, a clean room to match advertiser data against it, a programmatic engine to sell it, and a steady cadence of upfront and CES announcements to keep the product current.\n\nFor the disintermediation question, NBCU's 150-million person-level graph is the salient asset. Person-level identity — not merely household — is exactly what social platforms claim as their edge, and NBCU's is built from logged-in Peacock accounts, registration data, and linear-plus-streaming viewing. It can match an advertiser's CRM list against 150 million people and deliver against them on premium NBCU inventory, no social data fee required. Where it stops is, again, declared professional attributes and forward-looking commercial intent of the Pinterest kind. NBCU knows what you watched. It does not know your job title or the kitchen remodel you are planning three months out. On the segments it *can* build, NBCU is a fully productized rival to the social entrants' data licensing; on the two hardest-to-substitute signals it is not.\n\n---\n\n## 4. Netflix: From Renting Microsoft's Stack to Selling Its Own Audience\n\nNetflix is the newest and fastest-moving convert, and its 2025–2026 buildout is the clearest single illustration of a streamer walking *off* dependency and *into* selling its own audience. Three moves matter.\n\nFirst, **Netflix severed its Microsoft ad-serving dependency**. Its ad business launched in late 2022 on a Microsoft sales-and-tech tie-up; in **April 2025 Netflix launched its own proprietary Netflix Ads Suite in the United States**, and completed the global rollout across all of its ad-supported markets by mid-2025 [7][8]. Owning the ad server is the precondition for owning the audience relationship — you cannot sell your own first-party segments through someone else's serving stack on someone else's terms.\n\nSecond, **Netflix now sells native first-party targeting**. In July 2025 it launched advanced targeting in EMEA including mood-based audience segmentation, postal-code-level geographic precision, and **more than 100 interest segments across 17 categories**, drawn from its own streaming-behavior data [8]. This is Netflix packaging viewing behavior into buyable audiences — the streamer-as-seller move in its purest form.\n\nThird — and this is where the dual-role tension bites — **Netflix opened programmatically to Amazon DSP in September 2025** and layered in third-party audience data. Netflix inventory became available through Amazon DSP across eleven markets, and Amazon Audiences (built from Amazon's shopping, streaming, and browsing signals) roll into Netflix campaigns for US Amazon-DSP buyers in Q2 2026; a parallel Yahoo DSP partnership (from October 2025) supplies deterministic Yahoo interest and purchase segments [9][10]. Netflix also shipped its **own conversion API in early 2026**, a server-to-server outcome-measurement pipe that reported benchmark outperformance across finance, ed-tech, and retail verticals [9].\n\nThe revealing pattern: Netflix builds its own interest segments *and* imports Amazon's and Yahoo's. It is at once a first-party audience seller and a buyer of third-party audience data. That tells you the honest limit of viewing data — Netflix's own 100-plus interest segments are not yet rich enough to satisfy performance advertisers, so it rents shopping and intent signal from Amazon and Yahoo to fill the gap. A social platform reading this should note both halves. Netflix *is* building a rival first-party segment business (the threat), but it still needs external commerce and intent data to make it perform (the opening). The question for 2029 is which curve wins: Netflix's own segment richness climbing, or its need for imported intent data persisting.\n\n---\n\n## 5. Roku: The Dual Role Made Explicit\n\nRoku is the cleanest case of the corpus's dual-role problem, because it is *both* the supply partner social platforms and DSPs rent *and* a first-party audience seller — and it has taken a deliberate, publicly stated position on which it wants to be.\n\nThe scale is now larger than the corpus's 80-million figure. In **April 2026 Roku announced it had surpassed 100 million streaming households worldwide** [11] (the 80M+ figure the market-structure chapter cites reflects the US authenticated footprint that Amazon markets; the global household count is now nine figures). Roku's **Amazon Ads partnership, announced June 2025, created a combined footprint covering over 80% of US connected-TV households** [12]. This is the supply-partner half of the dual role, the one the corpus already treats as a rail.\n\nThe audience-seller half is **Roku Data Cloud**, launched January 6, 2025, evolving Roku's earlier clean room into a collaboration suite [13][14]. It is built on ACR-derived viewing signals plus opt-in first-party data from OS-level customer sign-ups and purchases, and it produces behavioral reach segments (the canonical example Roku gives is \"heavy sports viewers\"). Advertisers bring their own CRM or mobile-ad-ID data and map it against Roku's 90-million-plus household graph inside the clean room, then activate against Roku inventory [13][14].\n\nHere is the strategically decisive fact, and it cuts *against* the naive disintermediation story. Roku has explicitly said it does **not** want to be a data business. A Roku executive stated plainly, \"We don't want to be selling data for CPMs,\" and Roku Data Cloud routes *exclusively through partners* — agency analytics (Omnicom's Omni, PMG's Alli), measurement firms (Innovid, iSpot), and DSPs (Yahoo, with advertiser-specific integrations) — rather than selling segments directly [13][14]. Roku casts itself as a *media* business that lets partners access its intelligence to buy its inventory, not as a segment seller competing with the LiveRamps and social platforms of the world.\n\nThis matters enormously for the inversion thesis. Roku *could* disintermediate the social data fee. It has the households, the ACR signal, the account data, and the clean room to do it. It has *chosen not to*, preferring to monetize inventory rather than data. That choice is contingent and reversible; Roku also runs a self-serve Ads Manager and works through The Trade Desk and Unity, and its DSP posture has ambitions. But as of mid-2026 Roku is a partial, self-limiting rival — a landlord who has built the garden and decided, for now, to keep leasing pipes rather than sell flowers. Let that posture shift, and Roku becomes one of the most dangerous disintermediators in the market on scale alone.\n\n---\n\n## 6. The TV-OS Layer: Samsung, LG, and Walmart's Vizio\n\nBelow the streamers sits the operating-system layer — the smart-TV OEMs whose ACR technology sees *everything* on the glass, regardless of which app or input delivered it. This is a different and in some ways stronger data position than any single streamer's, because ACR captures cross-app, cross-input viewing that no individual streamer can see.\n\n**Samsung Ads** sells **600-plus ready-to-buy first-party audience segments**, powered by Samsung's TV and mobile data, including linear viewing captured via ACR and app-level insights; its **Data+** offering is a data-as-a-service product for planning, activation, and measurement, and it augments its own graph through partnerships (for example with Experian) [15]. Samsung packages ACR viewing into segments built on genres, networks, and competitive-ad exposure and sells them directly to advertisers [15][16].\n\n**LG Ad Solutions** runs proprietary ACR data from LG webOS TVs across 30-plus countries, offering deterministic, ACR-informed household segments built on viewing habits, interests, and demographics; LG's ACR captures linear channels, streaming apps, and gaming across all inputs, and it powers CTV campaigns in over 40 countries [17]. LG's positioning is nearly identical to Samsung's: proprietary glass-level ACR data, packaged into deterministic audience segments, sold to advertisers and enhanced by data partnerships [17].\n\n**Vizio** is the case Walmart's ownership transforms. Vizio's ACR arm, **Inscape**, captures on-screen content from **25 million-plus opted-in smart TVs** across every input; Vizio has roughly 19 million active SmartCast accounts [18][19]. Walmart's **$2.3 billion acquisition** of Vizio — the retail analogue of Pinterest buying tvScientific — fused Inscape's ACR viewing data with Walmart's verified retail purchase data [18][19]. Now Vizio Ads can target viewers by **verified Walmart purchase history** and measure whether a TV exposure drove an actual in-store or online sale — closed-loop, exposure-to-SKU attribution modeled directly on Amazon's playbook, now expanding onto Walmart's Onn-branded SmartCast TVs [18][19].\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: the competing sellers — streamer / TV-OS household footprints<\/div><svg viewBox=\"0 0 700 138\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"518.8\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75<\/text><line x1=\"630.0\" y1=\"8\" x2=\"630.0\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"630.0\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100<\/text><text x=\"175\" y=\"24\" font-size=\"13\" text-anchor=\"end\">Roku (global households)<\/text><rect x=\"185\" y=\"8\" width=\"445.0\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\"/><text x=\"638.0\" y=\"24\" font-size=\"12.5\" class=\"t-muted\">100M<\/text><text x=\"175\" y=\"58\" font-size=\"13\" text-anchor=\"end\">NBCU ID (household identif…<\/text><rect x=\"185\" y=\"42\" width=\"222.5\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.05s\"/><text x=\"415.5\" y=\"58\" font-size=\"12.5\" class=\"t-muted\">50M<\/text><text x=\"175\" y=\"92\" font-size=\"13\" text-anchor=\"end\">Vizio SmartCast (active ac…<\/text><rect x=\"185\" y=\"76\" width=\"84.5\" height=\"22\" rx=\"3\" class=\"f-t1 cv-grow-right\" style=\"--d:0.10s\"/><text x=\"277.6\" y=\"92\" font-size=\"12.5\" class=\"t-muted\">19M<\/text><\/svg><figcaption>The supply side is now an audience seller in its own right. These are household-scale first-party graphs a social platform must match against — and mostly loses to, except on verified professional identity. <span class=\"credit\">Source: NBCU ID (Claim 11.3), Roku (11.6), Walmart-Vizio SmartCast (11.8).<\/span><\/figcaption><\/figure>\n\n\n\nThe Walmart-Vizio combination is the single most complete disintermediator of a social platform's value proposition at the OS layer, because it pairs the two data types the social platforms *cannot* both hold: cross-app viewing (from ACR) and verified purchase (from the largest US retailer). A social platform's intent signal is a *proxy* for a purchase; Walmart-Vizio holds the purchase itself and the viewing behavior around it. For any advertiser chasing measurable sales lift, the Walmart-Vizio segment is not a substitute for the social signal — it is *superior* to it, on the one metric that closes the loop. The only thing it lacks, again, is declared professional identity and the specific forward-intent of a Pinterest saver who has not yet transacted anywhere.\n\nA caveat on the OEM ACR position: it is powerful on *behavioral* and *content* segments and, in Vizio's case, on *purchase*, but ACR sees households and screens, not verified individuals. It is the strongest substitute for engagement-and-affinity social signal and the weakest substitute for declared-individual professional signal — the same fault line as everywhere else.\n\n---\n\n## 7. Amazon: The Fully-Integrated Disintermediator\n\nAmazon is not one role in this market; it is all of them at once, which makes it the theoretical endpoint of the disintermediation thesis. In a single company Amazon is: the **DSP rail** social platforms rent (Chapter 7's Amazon DSP, ~14% DSP share and the fastest-growing top-five platform); the **retail-media data seller** (Chapter 1's template, $56.7 billion in projected 2026 US retail-media spend, roughly ten times second-place Walmart); *and* a **streamer with its own first-party audience** (Prime Video's hundreds of millions of ad-supported viewers, Fire TV's device graph) [20][21].\n\nAmazon's pitch stacks three assets no rival holds together: unmatched purchase data, the dominant retail-media network, and a streaming service at massive scale. Its first-party audience segments are built from what users searched, purchased, streamed, and browsed across the entire Amazon ecosystem, and in 2026 Amazon is unifying its buying experience across the Ads Console and DSP so advertisers move seamlessly across Twitch, Fire TV, Prime Video, and Echo [20][21]. The full-funnel loop — streaming ads build awareness, sponsored products convert, closed-loop purchase data connects the two — is the exact loop every other player is trying to assemble from parts, and Amazon owns all the parts natively.\n\nThis is why Amazon is the extreme case for the inversion scenario. When LinkedIn plugs into Amazon DSP (May 2026) or Netflix opens to Amazon DSP (September 2025) or Disney integrates DRAX with Amazon DSP (June 2025), Amazon is not a neutral rail — it is a competitor sitting inside the transaction, watching the flow, and holding its own superior first-party purchase graph. The market-structure chapter already flags that Amazon \"sells its own audiences\" and that its neutrality is a convenient framing. The disintermediation lens sharpens it: Amazon is the party best positioned to observe which social segments perform, replicate the substitutable ones from its own purchase and streaming data, and let the social data fee wither. Its own B2B ambitions (Amazon Business data) are the one place it directly menaces even LinkedIn's protected segment — which is precisely why the LinkedIn chapter names Amazon's implicit B2B aspiration as LinkedIn's medium-term threat. Amazon is the disintermediator against whom LinkedIn's declared-identity moat is *most* tested, because Amazon is the only player with a plausible independent path to business-buyer identity.\n\n---\n\n## 8. Which Social Segments Are Genuinely Non-Substitutable\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 452\" role=\"img\" aria-label=\"A matrix of five social-platform signal types and whether streamers and TV-OS operators can rebuild them. Demographic, behavioral, and purchase-intent signals are all substitutable — the streamers can rebuild them (coral). Verified purchase is held even better by streamers and retailers (teal). Only verified professional identity is non-substitutable — held by LinkedIn alone (amber, glowing). Muted chips name the rebuilders: Disney, NBCU, Roku, Samsung/LG, Walmart-Vizio.\">\n<defs>\n<filter id=\"glow-amber\" x=\"-40%\" y=\"-40%\" width=\"180%\" height=\"180%\">\n<feGaussianBlur stdDeviation=\"4\" result=\"b\"/>\n<feMerge><feMergeNode in=\"b\"/><feMergeNode in=\"SourceGraphic\"/><\/feMerge>\n<\/filter>\n<\/defs>\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"3\">WHAT THE STREAMERS CAN REBUILD<\/text>\n<text x=\"350\" y=\"49\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">every social signal has a streamer substitute — except one<\/text>\n<text x=\"34\" y=\"82\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">SOCIAL SIGNAL TYPE<\/text>\n<text x=\"666\" y=\"82\" text-anchor=\"end\" font-size=\"9\" class=\"t-mono t-muted\" letter-spacing=\"1\">CAN STREAMERS REBUILD IT?<\/text>\n<line x1=\"34\" y1=\"90\" x2=\"666\" y2=\"90\" class=\"ln\" stroke-width=\"1\"/>\n<g class=\"cv-rise\">\n<rect x=\"34\" y=\"98\" width=\"632\" height=\"52\ "/>\n<text x=\"621\" y=\"200\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-muted\">Samsung/LG<\/text>\n<\/g>\n<g class=\"cv-rise\">\n<rect x=\"34\" y=\"214\" width=\"632\" height=\"52\" rx=\"6\" class=\"f-t5\" opacity=\".1\"/>\n<rect x=\"34\" y=\"214\" width=\"4\" height=\"52\" class=\"f-t5\"/>\n<text x=\"52\" y=\"237\" font-size=\"12\" font-weight=\"bold\">Purchase-intent <tspan class=\"t-muted\" font-weight=\"normal\" font-size=\"9.5\">(a proxy)<\/tspan><\/text>\n<text x=\"52\" y=\"254\" font-size=\"9.5\" class=\"t-muted\">retailer &amp; streamer data <tspan style=\"fill:var(--t4)\">approximate real purchase<\/tspan><\/text>\n<text x=\"500\" y=\"238\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"bold\" style=\"fill:var(--t5)\">MOSTLY ✓<\/text>\n<text x=\"500\" y=\"255\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\">approximated<\/text>\n<rect x=\"588\" y=\"228\" width=\"66\" height=\"15\" rx=\"7\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--t4)\"/>\n<text x=\"621\" y=\"239\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono\" style=\"fill:var(--t4)\">Walmart-Vizio<\/text>\n<\/g>\n<g class=\"cv-rise\">\n<rect x=\"34\" y=\"272\" width=\"632\" height=\"52\" rx=\"6\" class=\"f-t4\" opacity=\".12\"/>\n<rect x=\"34\" y=\"272\" width=\"4\" height=\"52\" class=\"f-t4\"/>\n<text x=\"52\" y=\"295\" font-size=\"12\" font-weight=\"bold\">Verified purchase <tspan class=\"t-muted\" font-weight=\"normal\" font-size=\"9.5\">(closed loop)<\/tspan><\/text>\n<text x=\"52\" y=\"312\" font-size=\"9.5\" class=\"t-muted\">real transactions — <tspan style=\"fill:var(--t4)\">social loses here too<\/tspan><\/text>\n<text x=\"500\" y=\"290\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" style=\"fill:var(--t4)\">STREAMERS<\/text>\n<text x=\"500\" y=\"305\" text-anchor=\"middle\" font-size=\"11.5\" font-weight=\"bold\" style=\"fill:var(--t4)\">HOLD IT BETTER<\/text>\n<rect x=\"588\" y=\"286\" width=\"66\" height=\"15\" rx=\"7\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--t4)\"/>\n<text x=\"621\" y=\"297\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono\" style=\"fill:var(--t4)\">Walmart-Vizio<\/text>\n<\/g>\n<g class=\"cv-grow-right\">\n<rect x=\"34\" y=\"330\" width=\"632\" height=\"60\" rx=\"6\" class=\"f-t1\" opacity=\".16\" filter=\"url(#glow-amber)\"/>\n<rect x=\"34\" y=\"330\" width=\"632\" height=\"60\" rx=\"6\" class=\"s-t1\" fill=\"none\" stroke-width=\"1.5\"/>\n<rect x=\"34\" y=\"330\" width=\"4\" height=\"60\" class=\"f-t1\"/>\n<text x=\"52\" y=\"352\" font-size=\"12\" font-weight=\"bold\" class=\"t-acc\">Verified professional identity<\/text>\n<text x=\"52\" y=\"369\" font-size=\"9.5\" class=\"t-muted\">job title · seniority · company<\/text>\n<text x=\"52\" y=\"384\" font-size=\"9\" font-style=\"italic\" style=\"fill:var(--t1)\">only LinkedIn holds it — no viewing graph reconstructs it<\/text>\n<text x=\"500\" y=\"356\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\" class=\"t-acc\" filter=\"url(#glow-amber)\">NON-SUBSTITUTABLE ✦<\/text>\n<text x=\"500\" y=\"374\" text-anchor=\"middle\" font-size=\"8.5\" style=\"fill:var(--t1)\">the one exception<\/text>\n<rect x=\"588\" y=\"362\" width=\"66\" height=\"16\" rx=\"7\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"621\" y=\"374\" text-anchor=\"middle\" font-size=\"8\" class=\"t-mono t-inv\" font-weight=\"bold\">LinkedIn only<\/text>\n<\/g>\n<line x1=\"34\" y1=\"404\" x2=\"666\" y2=\"404\" class=\"ln-soft\" stroke-width=\"1\"/>\n<text x=\"34\" y=\"424\" font-size=\"9.5\" class=\"t-muted\">The rebuilders' own graphs — Disney Select ~1,800 segments · NBCU ID ~150M IDs · Roku 100M+ households ·<\/text>\n<text x=\"34\" y=\"438\" font-size=\"9.5\" class=\"t-muted\">Samsung 600+ segments · Walmart-Vizio purchase data — reconstruct <tspan style=\"fill:var(--t5)\">every social segment<\/tspan> <tspan style=\"fill:var(--t1)\" font-weight=\"bold\">except verified professional identity<\/tspan>.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> The streamers' own audience businesses can reconstruct all but one of the social platforms' signals — demographic, behavioral, purchase-intent, even verified purchase, which the retailers and TV-OS operators hold <em>better<\/em> than social — and the sole exception, verified professional identity, is exactly why LinkedIn is the only durable case for social's irreplaceability.<\/figcaption>\n<\/figure>\n\n\nThe corpus already argues LinkedIn is the safest social entrant because its signal is non-substitutable. Having mapped what every streamer and OS can actually build, this essay can test that claim rather than assert it. The test is simple: for each social platform's core signal, can a streamer or OS approximate it from viewing plus registration plus commerce data?\n\n**LinkedIn — verified professional identity (job title, seniority, employer, function, industry).** Non-substitutable. This is the clean result. No streamer's ACR, no OS's viewing graph, and no registration database holds declared professional attributes, because viewers do not tell their television they are a VP of Procurement. Amazon Business is the *only* plausible independent path to business-buyer identity, and even it is inferential (who buys office supplies) rather than declared (who holds the title). The corpus's instinct is correct and the mapping confirms it: LinkedIn's segment is the one thing the supply side genuinely cannot counterfeit. Its vulnerability lies elsewhere — in the household-vs-individual delivery gap and the Microsoft Monetize rail concentration — not in disintermediation by a streamer's own data.\n\n**Pinterest — forward-looking commercial intent (the Taste Graph, saves, planning-stage searches).** Partially substitutable, and the substitute is arriving. Content-affinity and behavioral segments a streamer builds from viewing overlap heavily with Pinterest's interest taxonomy, and Walmart-Vizio's purchase data plus Amazon's shopping signal reconstruct *transacted* intent better than Pinterest reconstructs *pre-transaction* planning. Pinterest's genuine edge is the *pre-purchase planning window* — the saver assembling a kitchen remodel who has bought nothing yet, anywhere. A streamer sees that person watch home-improvement content; it does not see the plan. That window is a real but narrow moat, and it is why Pinterest wisely bought the outcome engine (tvScientific) rather than lean on the intent signal alone — it moved to own the measurement precisely because the raw intent signal is the most substitutable of the \"safe\" ones.\n\n**Reddit — community and interest affinity (subreddit-level signal).** Highly substitutable. Interest and content affinity is exactly what ACR viewing data and streamer interest segments reproduce best. A streamer that knows you watch true-crime documentaries, esports, and cooking content can build an affinity segment that overlaps substantially with the matching subreddit communities. Reddit's distinctiveness is granular *niche* community affinity and the pseudonymous-discussion context, but for the broad affinity segments advertisers actually buy, a streamer's viewing-derived interest segment is a close substitute — and it comes with the impression attached. This is why the corpus ranks Reddit's CTV path as a thin-margin data-licensing story at best, and the disintermediation analysis confirms it: Reddit's signal is the easiest to counterfeit from the supply side.\n\n**TikTok — engagement and interest signal.** Substitutable, and TikTok's other problems (format mismatch, no owned screen, going-concern overhang) make the point moot. The engagement signal is the least identity-anchored of the five and the most reproducible from viewing behavior.\n\n**Meta — behavioral depth and deterministic cross-device identity.** The most interesting case. Meta's *identity-match* capability (deterministic, logged-in, cross-device) genuinely exceeds any streamer's, and its behavioral-depth signal is hard to fully reproduce. But the *segments an advertiser buys* from Meta — demographic, interest, behavioral — are substantially reconstructable from a streamer's viewing-plus-registration graph, even if Meta's underlying identity resolution is superior. Meta's edge is in the *matching*, not the *segment*. A streamer can approximate the segment while never matching Meta's identity precision. Since Meta has no CTV product at all, this stays theoretical — but it means that even if Meta ships, the substitutable-segment problem applies to four of the five social entrants, with LinkedIn the lone clean exception.\n\nThe pattern is exact, and it should reorder how the market reads its own scorecard: **the more a social platform's signal is declared-and-verified-individual (LinkedIn), the safer it is; the more it is inferred-interest-or-behavior (Reddit, TikTok, much of Pinterest and Meta), the more the supply side can already sell a substitute.** Non-substitutability — not reach, not even measurement — is the true axis of durability, and only LinkedIn sits unambiguously on the safe end of it.\n\n---\n\n## 9. Ahead or Behind: Scoring the Two Sides on the 2029 Horizon\n\nAre the streamers' audience businesses ahead of or behind the social entrants on the same 2029 horizon? For the substitutable segments — which is to say, for four of the five social platforms' core signals — the streamers are **ahead**, and by years.\n\nConsider productization dates. Disney Select has sold first-party segments since 2021 and been biddable through DRAX since 2022; NBCU's One Platform launched in 2020, and its 150-million-ID graph and clean room have been in-market for years; Roku Data Cloud shipped January 2025; Netflix owned its ad server by April 2025 and sold native interest segments by July 2025; Samsung, LG, and Vizio have sold ACR segments for years, with Walmart-Vizio's purchase-enriched version live post-acquisition. Against that, the social side shows Meta with *no product*, only exploratory SSP meetings; Reddit and TikTok with *no owned screen and no productized CTV audience extension*; Pinterest live only since its February 2026 tvScientific close; and LinkedIn generally available only since spring 2026. On the substitutable segments, the supply side holds a three-to-six-year productization head start.\n\nThe comparison inverts only for LinkedIn's non-substitutable segment, where the streamers are not \"behind\" so much as *absent* — they cannot build the product at all, so LinkedIn's late arrival still beats a rival that does not exist. This is the whole ballgame for the durability thesis. LinkedIn is the only social entrant whose lateness does not matter, because on its specific segment there is no supply-side competitor to be late against.\n\nTwo forces will move this over the horizon. First, **streamer segment richness is climbing** — Netflix going from zero to 100-plus interest segments in a year, Disney to 1,800, Walmart-Vizio adding purchase closure — which steadily shrinks the set of segments for which a social platform's data adds anything. Second, **match-rate decay erodes the imported social signal** from the demand side at the same time: the very MAID and cookie weakening that pushed social platforms off-platform also degrades the match between a social audience and a CTV household, so the imported segment gets *worse* while the streamer's owned segment gets *better*. These two curves cross. When they do — earlier for Reddit and TikTok, later and only partially for Pinterest and Meta, essentially never for LinkedIn's core segment — the streamer's own audience becomes the default, and the social data fee becomes optional.\n\n---\n\n## 10. The Inversion Scenario\n\nState the inversion plainly. The corpus's default framing is that social platforms supply targeting and rent the streamers' pipes. The inversion is the scenario in which **the supply side captures the targeting layer** and social-to-CTV data licensing shrinks to a niche. It is not a tail risk. For most of the social platforms it is the base case. It occurs under the following conditions, most of which are already partly present:\n\n1. **Streamer first-party segment richness reaches \"good enough.\"** When a streamer's own demographic, behavioral, content, and (via retail partnership) purchase segments satisfy the advertiser's targeting need, the marginal value of importing a social segment falls toward zero. Disney at 1,800 segments, NBCU at 150 million IDs, and Walmart-Vizio at purchase-closed attribution are already at or near \"good enough\" for the substitutable segments today.\n\n2. **Match-rate decay makes the imported signal worse than the owned one.** As MAID and cookie identifiers weaken, the social audience matches into fewer CTV households at lower confidence, while the streamer's owned, authenticated, logged-in graph does not decay. Past a crossover point the streamer's native segment is simply *more accurate* than the imported social one, not merely cheaper.\n\n3. **The streamer prefers to keep its own margin.** Every dollar of social data fee is a dollar the streamer could keep by selling its own segment. Disney, NBCU, Netflix, and the OEMs all have direct commercial incentive to substitute; only Roku has publicly declined the data-seller role, and reversibly.\n\n4. **Amazon (and Walmart-Vizio) close the loop the social signal only proxies.** Where the advertiser's goal is measurable sales, the integrated purchase-plus-viewing players offer a *superior* product, not a substitute, collapsing the social intent signal from must-have to nice-to-have on the one metric that matters most.\n\nUnder these conditions the \"social platforms rent the pipes\" framing does not just weaken — it *inverts*. The supply side becomes the demand-targeting layer too, and social-to-CTV data licensing survives only in the pockets where the streamer genuinely cannot build the segment. There is exactly one durable pocket — **LinkedIn's verified professional identity** — and possibly a thin Pinterest pre-transaction-planning sliver. For Reddit, TikTok, and most of Meta's and Pinterest's undifferentiated segments, the inversion is the expected 2029 outcome. Read the whole corpus through this lens and the honest verdict is that \"social-to-CTV retargeting\" endures as a *category* only to the extent the social platform holds a signal the landlord cannot grow himself — and only LinkedIn unambiguously does. Everyone else is renting pipes from a competitor learning to sell what they came to license.\n\n---\n\n## Open Questions\n\n1. **Does Roku's \"we don't sell data for CPMs\" posture hold, or flip?** Roku has the households, ACR, account data, and clean room to be a top-tier disintermediator, and has explicitly declined the role. If competitive pressure or its DSP ambitions flip that posture, Roku becomes one of the most dangerous supply-side audience sellers overnight. This is a live, reversible strategic choice, not a structural constraint.\n\n2. **How rich do Netflix's own segments get before its need for imported Amazon/Yahoo intent data fades?** Netflix today both sells native interest segments and imports third-party audiences — the clearest single signal of viewing data's current limits. Which curve wins by 2029 determines whether Netflix disintermediates the social fee or remains a data importer itself.\n\n3. **Can Amazon Business give Amazon an independent path to business-buyer identity that menaces even LinkedIn?** LinkedIn's moat rests on declared professional identity being non-substitutable. Amazon Business purchase data is the only plausible inferential route to business-buyer targeting at scale. Whether inference can approximate declaration well enough to matter is the single question on which LinkedIn's durability turns.\n\n4. **What is the actual crossover date at which streamer segment accuracy exceeds a match-rate-decayed imported social segment?** The inversion thesis rests on two curves crossing. No public data times the crossover; it likely differs by segment type and platform, and quantifying it would convert the qualitative inversion story into a datable forecast.\n\n5. **Do Samsung, LG, and Vizio move from selling ACR *segments* to selling *identity-resolved individual* audiences?** The OEM ACR layer is powerful on households and behavior but weak on verified individuals. If the OEMs bolt on identity resolution (as Walmart-Vizio does via retail data), they close more of the gap to social's individual-level claim.\n\n6. **Does any streamer attempt a genuine B2B professional segment**, whether through registration data, partnership, or modeling — the one move that would directly attack LinkedIn's protected position? To date none has, which is itself evidence of how hard the segment is to build from the supply side.\n\n---\n\n## Sources\n\n1. Disney Advertising Press, \"Fact Sheet: Disney Select Drives Massive Marketplace Adoption and Results.\" https://press.disneyadvertising.com/fact-sheet-disney-select-drives-massive-marketplace-adoption-and-results- — *Tier 1 (company primary). Disney Select ~1,800 audience segments built from 100,000+ attributes; +70% lift in campaigns using Disney Select; buyer behavior, household characteristics, psychographics. Vendor-attested — read the segment-catalog existence as load-bearing, the performance figures as self-reported. Fact-sheet segment/attribute figures corroborated in [2][3].*\n2. AdExchanger, \"Inside Disney's Plan To Automate Half Its Ad Business Within Five Years.\" https://www.adexchanger.com/strategy/inside-disneys-plan-to-automate-half-its-ad-business-within-five-years/ — *Tier 5 (specialized trade). DRAX biddable-transaction growth, automation goal, DRAX Direct with UID2/PAIR, 30+ DSP integrations, Disney Select as buyable currency.*\n3. Marketing Dive / AdExchanger showcase coverage, \"Disney unveils programmatic platform\" and DRAX evolution reporting. https://www.marketi 600+ ready-to-buy first-party segments; Data+ data-as-a-service; ACR linear + app-level; Experian partnership. Vendor source — segment count self-reported.*\n16. AdExchanger, \"Samsung Makes Audience Buying On AVOD Easier With Predictive Planning Tool.\" https://www.adexchanger.com/digital-tv/samsung-makes-audience-buying-on-avod-easier-with-predictive-planning-tool/ — *Tier 5 (trade). Independent confirmation of Samsung Ads' ACR-derived audience-buying and planning products.*\n17. LG Ad Solutions, technology and solutions pages; AI Digital smart-TV guide. https://lgads.tv/technology/ ; https://lgads.tv/solutions/ ; https://www.aidigital.com/blog/smart-tv-advertising — *Tier 1/5 (company primary + analytical). Proprietary webOS ACR across 30+ countries, deterministic ACR-informed household segments, campaigns in 40+ countries, glass-level all-input capture. Vendor/analytical — read scope claims as reported.*\n18. AdExchanger, \"Walmart Buys Smart TV Manufacturer Vizio, A Valuable Ads Data Asset\" and \"Vizio's Profitability Could Be A Boon For Walmart's Ads Business.\" https://www.adexchanger.com/tv/walmart-buys-smart-tv-manufacturer-vizio-a-valuable-ads-data-asset/ — *Tier 5 (specialized trade). Walmart $2.3B Vizio acquisition; Inscape ACR from 25M+ opted-in TVs across all inputs; ~19M active SmartCast accounts; fusion of viewing + Walmart purchase data; Onn SmartCast expansion.*\n19. Digilant / Kepler / TheMeasure analyses of Walmart–Vizio–Inscape, 2025–2026. https://digilant.com/blog/walmarts-vizio-acquisition-and-navigating-the-acr-data-evolution/ ; https://www.themeasure.net/how-inscape-and-walmart-are-powering-full-funnel-tv-measurement/ — *Tier 5 (analytical/vendor). Target-by-Walmart-purchase-history + closed-loop exposure-to-sale attribution; Inscape scale; retail-media analogue to Amazon's model. Vendor-adjacent analysis — note commercial lean.*\n20. eMarketer, \"FAQ on Amazon advertising: Retail media dominance, Prime Video scale, and agentic ad tools.\" https://www.emarketer.com/content/faq-on-amazon-advertising--retail-media-dominance--prime-video-scale--agentic-ad-tools — *Tier 5 (analytical). Amazon $56.71B projected 2026 US retail-media spend vs Walmart $5.99B; Prime Video scale; three-asset stack (purchase data + RMN + streaming); unified Ads Console/DSP buying across Twitch/Fire TV/Echo; agentic tools.*\n21. Amazon Ads product pages + Skai/Tinuiti/MNTN Amazon-streaming coverage, 2026. https://advertising.amazon.com/solutions/products/amazon-dsp ; https://skai.io/blog/amazon-ads-streaming-tv-for-retail-media-marketers/ ; https://mountain.com/blog/prime-video-advertising/ — *Tier 1/5 (company primary + trade). Amazon DSP first-party audiences from search/purchase/stream/browse; custom-audience upload, lookalikes, new-to-brand exclusion; full-funnel awareness→conversion→closed-loop loop. Vendor/trade — capability evidence.*"}, {"order": 12, "file": "12_Gap_Buy_Side_Advertiser_Demand.md", "title": "Does the Buyer Want This? The Demand-Side Case for Social Audiences on the Big Screen", "summary": "", "body": "# Does the Buyer Want This? The Demand-Side Case for Social Audiences on the Big Screen\n\n## Bottom Line\n\nEverything else in this corpus is written from the seller's chair: how the bridge from a social platform's audience to a streaming impression is built, who owns each layer of pipe, and what margin each layer keeps. This essay sits in the other chair. It asks the question the plumbing never answers. When a marketer sits down to plan 2026 streaming spend, does she actually want to *buy LinkedIn's, or Pinterest's, or Meta's audience on Connected TV* — and is she funding it as a recurring line, or poking at it with a test budget?\n\nThe honest answer: demand is real for **CTV**, thin and mostly unproven for **social-platform audiences *on* CTV as a distinct product**, and — for the largest buyers of all, the agency holding companies — structurally *discouraged* by their own 2025–26 strategy. The distinction matters enormously, and the seller-side framing hides it. Buyers are pouring money into streaming: roughly seven in ten CTV advertisers plan to raise spend by an average of 17% in 2026, and about **36% of the advertisers increasing CTV budgets are moving that money *out of social*** [1][2]. But that is CTV as a **substitute** for saturated social feeds, not CTV as a **destination for a social platform's licensed segment**. When trade analysts say marketers are \"unifying social and CTV,\" the survey data underneath shows they mean *coordinating creative across the two channels* — 78% run both, 55% reuse the same core creative resized — not activating a Meta or Pinterest audience against a streaming impression [3][4]. The single most-cited 2026 buy-side story about social and CTV is that CTV is where marketers flee *because* social has hit a performance ceiling — the opposite of the social-to-CTV thesis [4].\n\nAbove the individual advertiser sits the buyer who moves the most money, and here the structural case against renting a social platform's audience is at its sharpest. In the eighteen months to mid-2026, all three of the largest agency holding companies bought their way into *owning an identity spine of their own*: Omnicom absorbed IPG's **Acxiom** (merger closed November 2025, ~$26.5B combined revenue, now the largest holdco) [5][6]; Publicis agreed to buy **LiveRamp for $2.2 billion** (announced May 18, 2026), stacking it on the Epsilon and Lotame assets it already held [7]; and WPP folded **InfoSum** into GroupM to run a federated \"Open Intelligence\" data layer [8]. Publicis's CEO put the logic in one line — *\"Identity is the qualifier for AI. If you don't have the identity, you just don't win\"* — and the strategy he described is explicitly to *own* the data and identity layer rather than rent it from platforms [7]. A holdco that has spent billions to own its graph is a natural **competitor** to the social-data fee, not a natural buyer of it. The same holdcos have been actively stripping tolls out of the supply chain: Dentsu and WPP quietly **exited The Trade Desk's OpenPath** in early 2026 over undisclosed fees and a loss of control over where ads run [9], and the ANA's landmark log-level study found only about **36 cents of every programmatic dollar reaches working media** — a number that makes any *additional* data-licensing layer a hard sell to a CFO [10].\n\nSo the demand-side verdict, platform by platform, inverts the corpus's ranking in one important way. LinkedIn has the *clearest* genuine pull, because its verified professional signal has almost no substitute a buyer can assemble cheaply elsewhere — the B2B intent alternatives (Bombora, ZoomInfo, Demandbase) are account-level and famously *hard to activate as individual CTV audiences* [11][12]. Pinterest's pull is real but narrow, tied to lower-funnel commerce buyers who will judge it against retailer data and the streamer's own shopper graphs. For Meta, Reddit, and TikTok, the buyer-side pull for their *audience specifically on CTV* is, as of mid-2026, largely a vendor-narrated aspiration: buyers want CTV, and they want Meta's *tools*, but little independent evidence shows them funding \"Meta's audience on someone else's streaming inventory\" as a line item. The substitution each social segment quietly loses to — the buyer's own CRM in a clean room, the retailer's purchase data, the streamer's authenticated first-party graph, or simply *more direct CTV* — is named at the end. This is the missing half of the brief. The supply is exhaustively described; the demand, tested here, is mostly still a promise.\n\n---\n\n## 1. The Category Error the Seller-Side Framing Hides\n\nBefore asking whether buyers want the thing, be precise about *what* thing — because the trade-press shorthand conflates three different purchases:\n\n1. **Buying more CTV** (a marketer shifts budget into streaming inventory, targeted however).\n2. **Coordinating social and CTV** (running the same campaign, often the same creative, across a social feed and a streaming screen).\n3. **Activating a social platform's first-party audience *on* CTV inventory** (the actual subject of this corpus — LinkedIn's professional graph or Pinterest's Taste Graph rented into a streaming impression through a DSP and a clean room).\n\nOnly the third is \"social-to-CTV retargeting\" as this corpus defines it. The demand evidence for the first two is overwhelming and well-documented; the demand evidence for the third is scarce, and much of what exists comes from the platforms selling it. The seller-side framing lets the robust demand for (1) and (2) stand in for demand for (3). Untangling them is the whole job of this essay.\n\nThe clearest illustration is the phrase every 2026 CTV deck uses — that marketers are \"unifying social and CTV.\" eMarketer's own survey data behind that phrase describes purchase (2), not (3): **78.4% of marketers run both social and CTV ads**, and the operational challenge they report is *creative* — **55.2% keep the same core creative and make only slight format/length modifications** across the two channels, with the guidance centered on \"producing creative in modular formats\" [3]. There is no meaningful discussion, in that survey, of activating a social platform's audience segment against streaming inventory. \"Unify,\" to the buyer, means \"make one video work in two places,\" not \"carry my Pinterest audience onto Peacock\" [3].\n\n---\n\n## 2. The Demand That Is Real: CTV as a Substitute for Social\n\nThe buy-side appetite for CTV in 2026 is genuine, funded, and recurring — and it is worth stating plainly, because it is the reservoir the social-to-CTV thesis hopes to tap.\n\nThe most useful non-vendor read comes from the **Premion / Advertiser Perceptions 2026 CTV/OTT Advertiser Survey**, buy-side by construction (it surveys advertisers, not a social platform's own clients). It found **roughly 70% of CTV advertisers plan to increase CTV/OTT spend by an average of 17% in 2026**, and — critically for our question — that only about **25% of that increase comes from net-new budget**, with the rest *reallocated from other channels, including linear TV, digital display, paid search, and social media* [1]. The two top-cited *reasons* buyers give for spending more are \"the ability to reach highly engaged, opt-in audiences\" (44%) and \"combining TV's branding power with digital precision\" (40%) [1]. Note what is *not* on that list: \"to activate a social platform's audience.\" Buyers want engaged streaming audiences and digital-grade precision. They are agnostic about whose data supplies it.\n\nThe direction of the money is the tell. Per the IAB, among advertisers increasing CTV spend, **about 36% are pulling that budget *from social*** and 32% from paid search [2][4]. eMarketer's framing is blunter still: its widely-cited 2026 piece is titled *\"CTV becomes the new performance engine as marketers hit the ceiling on social,\"* and its argument is that as brands \"reach saturation across social and search, CTV has emerged as the next major growth driver… CTV is where incremental reach now lives\" [4]. The drivers it names — rising social CPMs, algorithmic volatility, audience fatigue, and brand-safety scares — are reasons to *leave* social, not reasons to *carry social's audience elsewhere* [4].\n\nHere is the demand-side paradox at the heart of the category. The very force that created social-to-CTV — signal loss pushing platforms to monetize their audiences off-platform (established earlier in this corpus) — coincides with a buyer stampede that treats CTV as an *alternative to* social, not an *extension of* it. The seller says \"buy my audience on the big screen\"; the buyer, increasingly, says \"I'm moving my social budget to the big screen precisely to get *away* from the diminishing returns of your feed.\" The two can both be true, but they are not the same demand, and the second is far larger and better-evidenced than the first.\n\n---\n\n## 3. The Holding Companies: Natural Competitors, Not Natural Buyers\n\nThe largest buyers of media are the agency holding companies, and their 2025–26 strategic posture is the single most important — and most overlooked — fact on the demand side. For the biggest accounts, a social platform hoping to sell its audience as a recurring CTV line is pitching directly into the teeth of a holdco strategy built to make that purchase unnecessary.\n\n### 3.1 Everyone bought their own graph\n\nIn eighteen months, the top three holdcos each acquired an identity/data asset designed to be *their* spine across every channel, CTV included:\n\n- **Omnicom + Acxiom (via IPG).** Omnicom's ~$13B acquisition of Interpublic **closed November 26, 2025**, creating the largest holding company by revenue (~$26.5B pro-forma) and putting IPG's **Acxiom** data business — and its RealID identity resolution, marketed as unifying ~2.6 billion verified global IDs — at the center of Omnicom's growth story, folded into the Omni platform to power \"paid, owned, earned and commerce channels… in a privacy-first world\" [5][6][13]. Omnicom has since built a multi-platform clean room on the Acxiom identity infrastructure and struck AI-creative-plus-audience deals directly with Netflix and NBCUniversal that route *Acxiom* audiences onto premium CTV — not a social platform's [13].\n- **Publicis + LiveRamp.** On **May 18, 2026** Publicis agreed to acquire **LiveRamp for $2.2 billion**, stacking the industry's leading identity-connectivity layer (RampID) atop the Epsilon graph it bought in 2019 for $4.4B and the Lotame assets it added later [7]. CEO Arthur Sadoun framed it as owning the intelligence layer outright: *\"Identity is the qualifier for AI. If you don't have the identity, you just don't win with AI,\"* and — pointedly — *\"a commercial partnership won't let either company build products… that neither could build alone\"* [7]. The strategy is explicitly to let clients \"generate new, exclusive and proprietary data\" and thread *their own* CRM across publishers, retailers, and CTV via RampID — the definition of preferring an owned graph over a rented one [7].\n- **WPP / GroupM + InfoSum.** WPP acquired the **InfoSum** data-collaboration platform in 2025 and made it part of GroupM, running a federated \"Open Intelligence\" layer inside WPP Open that lets clients train models on their first-party data alongside network signals \"without moving or exposing raw customer information\" [8].\n\nThe pattern is unambiguous. Each holdco spent hundreds of millions to billions to *own* the identity and data layer. Having done so, its structural preference — the one it will steer clients toward, because it earns on its own data and controls the measurement — is to activate the *client's* CRM, or the *holdco's* graph, against CTV inventory. Renting a social platform's segment on top of that means, from the holdco's seat, paying a fee to a competitor for a capability it just bought. This is the strongest *structural* reason a natural buyer would decline social-to-CTV, and it is entirely absent from the seller-side chapters.\n\n### 3.2 The caveat that keeps this from being decisive\n\nThe steelman for the platforms is that owning a graph does not make it *good enough* for every job. The Digiday reporting on Omnicom's Acxiom absorption is notably skeptical that a third-party data broker qualifies as a proprietary first-party spine — one source dryly noting \"a data broker can be considered first-party data *if* you squint,\" and others questioning whether the merged entity even has a clear integration plan [14]. If holdco graphs underperform on a specific, non-substitutable signal — say, verified job title — the holdco will still rent that signal. That is exactly the crack LinkedIn fits through (Section 5). But the *default* has flipped: the 2023–2024 holdco posture of \"we need to license identity from wherever we can get it\" has become \"we own identity; prove to us why we should rent yours.\" The burden of proof now sits on the social platform.\n\n### 3.3 The holdcos are also stripping tolls, not adding them\n\nIn the same period, the same buyers are actively *removing* intermediary fees from the supply chain — behavior directly hostile to a new data-licensing layer. In early 2026 **Dentsu and WPP quietly exited The Trade Desk's OpenPath**, per an Adweek exclusive, citing undisclosed fees and a loss of transparency over where ads actually ran [9]. Whatever the merits of TTD's defense (it says OpenPath is offered \"at cost\"), the *revealed preference* is what matters: the largest buyers will walk away from a supply-path product they perceive as an opaque toll. A social platform's audience fee — an *added* layer, buried in a CPM, on top of the 40–60% tech tax this corpus documents elsewhere — is precisely the kind of cost that same posture resists.\n\n---\n\n## 4. The CFO / Procurement Test: The Honest ROI Case\n\nPush past the media planner to the person who signs off on the budget, and the case for social-to-CTV gets harder, for three reasons that a procurement officer will raise unprompted.\n\n**First, the working-media problem.** The ANA's landmark log-level transparency study — the most authoritative buyer-side accounting of where programmatic money goes — found that of a dollar of programmatic spend, roughly **36 cents reaches working media** in a typical setup, rising to perhaps 50 cents with best practices (direct data-access contracts, supply-path discipline) [10]. Every additional intermediary layer — and a social-data fee riding on a DSP riding on an SSP is several layers — pushes that number the wrong way. A CFO who has read the ANA study is primed to ask of any new layer: *does this earn its cut, or is it another toll between me and the impression?*\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Exhibit: why the social-data fee is a hard sell — the programmatic dollar<\/div><div class=\"viz-donutwrap\"><svg viewBox=\"0 0 220 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><g class=\"cv-spin\"><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t1\" stroke-width=\"42\" stroke-dasharray=\"162.86 289.53\" stroke-dashoffset=\"-0.00\" transform=\"rotate(-90 110 110)\"/><circle cx=\"110\" cy=\"110\" r=\"72\" fill=\"none\" class=\"s-t2\" stroke-width=\"42\" stroke-dasharray=\"289.53 162.86\" stroke-dashoffset=\"-162.86\" transform=\"rotate(-90 110 110)\"/><\/g><\/svg><div class=\"viz-legend viz-legend-col\"><span><i style=\"background:var(--t1)\"><\/i>Working media (reaches the impression) <b>36%<\/b><\/span><span><i style=\"background:var(--t2)\"><\/i>Ad-tech chain (DSP + data + SSP + fees) <b>64%<\/b><\/span><\/div><\/div><figcaption>The ANA&#x27;s log-level study found only ~36¢ of a typical programmatic dollar reaches working media (up to ~50¢ with best practices). A social-data fee riding on a DSP riding on an SSP adds yet another layer to the ~64¢ already lost to the chain. <span class=\"credit\">Source: ANA Programmatic Media Supply Chain Transparency Study (Claim 12.6).<\/span><\/figcaption><\/figure>\n\n\n\n**Second, the household-not-individual imprecision.** As the LinkedIn and mechanics chapters establish, the social platform targets an *individual* (a declared professional, a specific saver), but the CTV impression lands on a *household* screen. For the buyer, this means the premium she pays for individual-level social precision partially dissipates at delivery into household-level reach. The honest ROI question is whether the *incremental* precision that survives the household resolution is worth the *incremental* fee over a cheaper household-level buy she could make with the streamer's own audience segment. For most performance buyers, that math is unproven — and the only lift numbers that say it works are, as this corpus flags repeatedly, the platforms' own.\n\n**Third, the measurement circularity.** The buyer cannot easily prove the social-to-CTV buy worked without leaning on the seller's measurement — often the same walled garden supplying the audience, serving the impression, and grading the outcome inside its own clean room. Sophisticated buyers know this and demand holdout-based incrementality; but a rigorous incrementality program is itself expensive and slow, which pushes social-to-CTV back toward the *test-budget* column rather than the *funded-line* column. The champion inside the buyer org is usually the brand or upper-funnel lead who values reach and can accept brand-lift proxies; the resister is the performance/CFO axis that wants attributable pipeline and sees an unproven premium. Which one wins determines whether the buy recurs.\n\nThe upshot: for a buyer whose success metric is last-click or closed-won pipeline, social-to-CTV structurally *undervalues* — she has cheaper, more provable ways to spend. For a buyer whose metric is qualified reach against a hard-to-find audience, it can pencil. That second buyer exists in meaningful numbers in exactly one place: B2B.\n\n---\n\n## 5. The Substitution Set: What Each Social Segment Actually Loses To\n\nThe sharpest demand-side test is not \"is there appetite in the abstract\" but \"when this specific segment enters the buyer's consideration set, what does it get chosen *over* — and what gets chosen over *it*?\" Here is the rival set, platform by platform.\n\n### 5.1 LinkedIn — the one with genuine, hard-to-substitute pull\n\nLinkedIn is the exception that proves the demand exists *where the signal is truly non-substitutable*. A B2B buyer who wants to reach \"VP of Procurement at 500+-person SaaS firms\" on streaming has a thin substitution set:\n\n- **The B2B intent alternatives can't easily activate on CTV.** Bombora (a consent-based co-op of 5,000+ sites), ZoomInfo (a 500M-contact database), and Demandbase are built for *account-level* prospecting and ABM, and — per multiple 2026 buy-side comparisons — they \"struggle to activate into Meta, Google, and CTV channels because ad platforms target individuals, not companies,\" and they \"don't natively push intent audiences into… CTV platforms\" [11][12]. The buyer can buy the *list* from ZoomInfo, but turning it into an addressable CTV audience is manual and lossy. LinkedIn's declared, individual-level, verified professional graph is precisely the thing those tools are not.\n- **The streamer's own graph is demographic, not firmographic.** Netflix's or NBCU's authenticated audience graph can find \"affluent households\" but cannot reconstruct \"the CISO,\" as this corpus's structure chapter argues.\n- **The buyer's own CRM is the real rival** — an ABM target-account list matched into a clean room and activated on CTV. This is the substitution LinkedIn most has to beat, and it is why LinkedIn's unconfirmed support for named-account (list-based) ABM on its DSP routes is such a live question: if the buyer can just load her *own* account list into a streamer clean room, she may not need LinkedIn's segment at all.\n\nNet: LinkedIn wins its niche because the alternatives are either non-activatable (Bombora/ZoomInfo), too coarse (streamer demos), or dependent on the buyer having a good enough first-party account list (own CRM). That is a real, defensible pocket of demand — narrow, premium, B2B — and it is the one social-to-CTV purchase this corpus can most confidently call *wanted*.\n\n### 5.2 Pinterest — real but bounded, loses to retailer and shopper data\n\nPinterest's commercial-intent audience appeals to a lower-funnel, DTC/retail buyer. But that same buyer's consideration set is crowded with cheaper, closer-to-the-transaction rivals:\n\n- **Retail-media purchase data** (Walmart Connect, Amazon) — which closes the loop deterministically and, per this corpus's retail-media parallel, commands premium CPMs precisely *because* purchase data beats intent data.\n- **The streamer's own shopper graphs** — Disney/Walmart-style clean-room matches that put the retailer's purchase data directly onto streaming without a Pinterest intermediary.\n- **The buyer's own site/CRM audience** in a clean room.\n\nPinterest's counter is that it *owns* the outcome engine (tvScientific) and can therefore prove and price the buy itself — a genuine advantage the seller-side chapters rightly emphasize. On the demand side, though, the buyer still asks: is Pinterest's *intent* signal worth a premium over the retailer's *purchase* signal for a conversion goal? For many performance buyers, no — which caps Pinterest's pull to buyers who value its distinctive discovery/planning-stage taste signal specifically, a real but limited cohort.\n\n### 5.3 Meta — buyers want the *tools*, not (yet) the *audience-on-CTV product*\n\nMeta's demand story is the most vendor-narrated of all, because there is no product to buy — only reported intent to build \"audience extension\" onto streaming inventory [15]. What buyers demonstrably want from Meta is its *optimization and automation*, not a licensed segment on someone else's screen: eMarketer's Willens attributes Meta's rise to \"a massive amount of buy-in from their huge base of advertisers\" for its *automated ad tools* [15]. That buy-in is for Meta's machine, on Meta's surfaces. Whether it transfers to \"Meta's audience, on Peacock, through a DSP\" is untested, and the substitution set is brutal: the same performance buyer already gets Meta's optimization *inside* Meta, and gets incremental CTV reach by buying more streaming direct. Meta-audience-on-CTV has to prove it beats \"just run more Meta\" *and* \"just buy more CTV.\" Until the product ships and independent buyers fund it, its demand is a forecast, not a fact.\n\n### 5.4 Reddit — rich signal, no buyer-side pull for it *on CTV*\n\nReddit's ad business is booming on its own surface, but there is no evidence of buyer demand for *Reddit's audience on CTV* because there is no product and no owned screen. A buyer who wants Reddit's community/interest signal buys it *on Reddit*. On CTV, that signal loses to contextual streaming buys and the buyer's own interest segments. Reddit's plausible demand-side path is licensing data into a DSP — the thin-margin position — and even that has no visible buyer pull today.\n\n### 5.5 TikTok — reach without a fundable CTV product, under a going-concern cloud\n\nTikTok has mass reach, but the buyer-side pull for its *audience on CTV* is foreclosed by a failed CTV app, a vertical-vs-horizontal format mismatch, and — decisively for a *recurring* line — the US-ownership overhang that makes any multi-year commitment fragile. A media planner cannot responsibly fund a recurring 2026 line item against a product that doesn't work on a platform whose US future is unresolved. TikTok's reach is real; the fundable, recurring buyer demand for it *on CTV* is not.\n\n---\n\n## 6. Test Budget or Funded Line? The Honest Ledger\n\nPulling the threads together, here is the demand-side status of the actual social-to-CTV purchase — not CTV in general, not social-and-CTV creative coordination, but *a social platform's audience activated on streaming inventory* — as of mid-2026:\n\n| Platform | Buyer-side demand for its audience *on CTV* | What it loses to in the buyer's plan | Funded line or test budget? |\n| --- | --- | --- | --- |\n| **LinkedIn** | Genuine, premium, narrow (B2B) | Buyer's own ABM list in a clean room; else little | Funded line for a real B2B cohort; the clearest case |\n| **Pinterest** | Real but bounded (lower-funnel commerce) | Retailer purchase data; streamer shopper graphs | Emerging line for commerce buyers; test for most |\n| **Meta** | Vendor-narrated; product not shipped | \"Just run more Meta\"; \"just buy more CTV\" | Not yet a line — a 2027+ maybe |\n| **Reddit** | No visible pull for audience-on-CTV | Contextual CTV; buyer's own interest segments | Not a line |\n| **TikTok** | Foreclosed by product + going-concern | N/A (no workable product) | Not a line |\n\nTwo structural facts sit above the whole table. First, the largest buyers — the holdcos — have spent 2025–26 building reasons *not* to rent a social platform's audience, having bought Acxiom, LiveRamp, and InfoSum to own identity themselves, and having walked out of supply-path tolls like OpenPath [5][7][8][9]. Second, the surging buy-side demand for CTV is substantially demand to *escape* social's diminishing returns, not to carry social's audience onto the big screen [2][4]. Both cut against the seller-side thesis.\n\nThe corpus's own concessions were right, and this essay assembles the evidence behind them. For four of the five platforms, social-to-CTV is a signal-loss-era workaround dressed as a growth channel — and on the demand side specifically, it is a channel the biggest buyers are structurally disinclined to fund and the broad market is largely bypassing in favor of buying CTV *instead of* social. The exception, LinkedIn, is genuine precisely because it sells a signal no substitute can cheaply replace, to a buyer (B2B) whose economics tolerate a premium, imperfect, reach-based buy. Where the signal is substitutable, the demand evaporates into the buyer's own graph, the retailer's data, or the streamer's front door.\n\nThe seller built a beautiful bridge. This essay's finding is that, for most of the platforms crossing it, the traffic on the buyer's side is lighter than the pipe was built to carry.\n\n---\n\n## Open Questions\n\n1. **Is there any non-vendor, buyer-attested incrementality result** for a social-platform audience *on CTV* — a holdout study run by an advertiser or holdco, not the platform? None surfaced in this research; the category badly needs one.\n2. **How much of LinkedIn's CTV demand is truly incremental** versus budget the same B2B buyers would have spent on LinkedIn's own feed or on an ABM-list-in-a-clean-room buy? The substitution against the buyer's *own* account list is the untested pivot.\n3. **Will holdco-owned graphs (Acxiom RealID, RampID, InfoSum) prove good enough** to displace social segments for most jobs, leaving social platforms only the truly non-substitutable slivers (verified profession)? The Digiday skepticism about Acxiom [14] suggests the answer is not yet settled.\n4. **Do the 2026 upfront/NewFront commitments contain any line item** specifically for social-audience-on-CTV, or only for CTV inventory and social-CTV creative bundles? Upfront deal terms are not public at that granularity; this remains a documented gap.\n5. **If Meta ships an audience-extension-to-CTV product, will independent buyers fund it** over \"more Meta\" and \"more direct CTV,\" or will it be a test budget indefinitely? This is the largest swing factor and is currently unknowable.\n6. **What is the buyer's realized working-media rate** on a social-to-CTV buy specifically, given the stacked layers and the ANA's 36-cent baseline [10]? No public figure exists; it is the missing number on the demand side just as the platform's take-rate is the missing number on the supply side.\n\n---\n\n## Sources\n\n1. Premion / Advertiser Perceptions, \"2026 CTV/OTT Advertiser Survey,\" 2026. https://premion.com/2026-ctv-ott-advertiser-survey/ ; https://premion.com/news/new-survey-reveals-that-more-than-70-of-ctv-advertisers-will-increase-spending-by-an-average-of-17-in-2026/ — *Tier 5 (advertiser-perceptions survey commissioned by a CTV seller; but buy-side in construction — surveys advertisers, not a social platform's own clients). ~70% plan to raise CTV spend ~17% in 2026; ~25% of the increase is net-new budget, rest reallocated from linear/display/search/social; top reasons \"reach engaged, opt-in audiences\" (44%) and \"combine TV branding + digital precision\" (40%). Premion is a CTV supplier — note lean; used here for buyer motivation, not for a social-platform claim.* Accessed 2026-06-30.\n2. Interactive Advertising Bureau (IAB), 2026 CTV outlook and budget-reallocatio
