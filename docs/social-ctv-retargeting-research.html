n data, as reported by eMarketer and StreamTV Insider, 2026. https://www.streamtvinsider.com/advertising/iab-forecasts-138-us-ctv-ad-spend-growth-2026 — *Tier 5 reporting on Tier 5 industry-body data. ~36% of advertisers increasing CTV spend reallocate from social; ~32% from paid search; IAB CTV growth forecast ~13.8% 2026. Industry-body source; the reallocation-from-social figure is the load-bearing demand-direction datapoint.* Accessed 2026-06-30.\n3. eMarketer, \"Marketers rush to unify social, CTV strategies,\" 2026. https://www.emarketer.com/content/marketers-rush-unify-social-ctv-strategies — *Tier 5 (analytical). \"Unify\" = creative/planning coordination, NOT social-audience activation on CTV: 78.4% run both social and CTV; 55.2% reuse core creative with format/length tweaks; no first-party-audience-on-CTV activation discussed. Load-bearing for the category-error argument.* Accessed 2026-06-30.\n4. eMarketer, \"CTV becomes the new performance engine as marketers hit the ceiling on social,\" 2026. https://www.emarketer.com/content/ctv-becomes-new-performance-engine-marketers-hit-ceiling-social — *Tier 5 (analytical). Argues marketers substitute CTV FOR saturated social (rising CPMs, algorithmic volatility, audience fatigue, brand-safety), not activate social data on CTV. The single sharpest buy-side counter to the social-to-CTV thesis. Corroborated on budget-shift direction by IAB [2].* Accessed 2026-06-30.\n5. Omnicom Group, IPG merger close, as reported by Digiday, The Drum, Creative Salon, and Omnicom primary filings, Nov 2025. https://www.sec.gov/Archives/edgar/data/0000029989/000121390025104221/ea026311901ex99-1_omnicom.htm ; https://www.thedrum.com/news/analysts-omnicom-s-ipg-takeover-caps-off-year-of-reckoning-for-holding-companies — *Tier 1 (SEC filing) + Tier 5 reporting. Merger closed Nov 26, 2025; ~$26.5B pro-forma combined revenue; now largest holdco; Acxiom folded into Omni platform as the data spine. Merger close is a going-concern fact — verified via SEC 8-K + multiple trade reports.* Accessed 2026-06-30.\n6. bestmediainfo, \"Why Omnicom–Publicis fell apart but Omnicom–IPG closed and put Omnicom on top,\" 2025. https://bestmediainfo.com/mediainfo/advertising/why-omnicompublicis-fell-apart-but-omnicomipg-closed-and-put-omnicom-on-top-10815797 — *Tier 5 (trade). Confirms close (Nov 2025), top-of-table revenue rank, Acxiom folded into Omni for \"deeper audience insight, smarter targeting.\" Corroborates [5].* Accessed 2026-06-30.\n7. Digiday, \"'Identity is the qualifier for AI': Publicis' $2.2 billion LiveRamp deal…,\" 2026. https://digiday.com/media-buying/identity-is-the-qualifier-for-ai-publicis-2-2-billion-liveramp-deal-is-a-bet-that-whoever-controls-the-data-owns-the-ai-era/ — *Tier 5 (analytical trade). Publicis to acquire LiveRamp for $2.2B (announced May 18, 2026; 29.8% premium; LiveRamp 2025 rev $813M); Sadoun quotes on owning identity (\"Identity is the qualifier for AI\"; \"a commercial partnership won't let either company build products… neither could build alone\"); stacks on Epsilon (2019, $4.4B) + Lotame. Load-bearing for the holdco-owns-its-own-graph thesis. Deal not yet closed (expected year-end 2026) — flagged.* Accessed 2026-06-30.\n8. WPP / GroupM, InfoSum acquisition and \"Open Intelligence\" strategy, as reported by AdExchanger, Marketing Dive, LBBOnline, CDP Institute, 2025. https://www.adexchanger.com/online-advertising/wpp-acquires-data-clean-room-startup-infosum/ ; https://www.marketingdive.com/news/wpp-legacy-id-solutions-infosum-acquisition/744511/ — *Tier 5 (trade). WPP acquired InfoSum (2025), folded into GroupM; federated \"Open Intelligence\" layer in WPP Open lets clients train on first-party data without exposing raw records. Third leg of the holdco-owns-identity pattern.* Accessed 2026-06-30.\n9. Adweek, \"EXCLUSIVE: Dentsu and WPP Quietly Exited The Trade Desk's OpenPath Over Hidden Fees and Transparency,\" 2026. https://www.adweek.com/media/exclusive-dentsu-wpp-exit-the-trade-desks-open-path/ ; corroborated by Campaign US https://www.campaignlive.com/article/tldr-trade-desk-fallout-dentsu-wpp-publicis/1952252 — *Tier 5 (trade; Adweek exclusive). Dentsu and WPP exited OpenPath (early 2026) over undisclosed fees and loss of transparency on where ads run; overlap with agency trading-desk functions (SPO, curation). TTD says OpenPath is \"at cost.\" Evidence of holdco revealed-preference to strip supply-path tolls.* Accessed 2026-06-30.\n10. ANA (Association of National Advertisers), \"Programmatic Media Supply Chain Transparency Study,\" Dec 2023; follow-up 2024–25, as reported by AdExchanger. https://www.ana.net/miccontent/show/id/rr-2023-12-ana-programmatic-media-supply-chain-transparency-study ; https://www.adexchanger.com/marketers/the-ana-says-advertisers-are-spending-way-less-on-mfa-but-programmatic-aint-fully-transparent-yet/ — *Tier 2/5 (industry-body primary study; log-level data on $123M spend / 35.5B impressions). ~36 cents of the programmatic dollar reaches working media; ~50 cents achievable with best practices (direct data-access contracts, supply-path discipline); only 21 of 67 advertisers could obtain log-level data. Load-bearing for the CFO working-media argument.* Accessed 2026-06-30.\n11. getuntitled.ai, \"10 Best Buyer Intent Data Providers in 2026,\" 2026. https://getuntitled.ai/blog/10-best-buyer-intent-data-providers/ — *Tier 6 (vendor-comparison blog; ABM-tooling lean — cited as industry-position evidence, not neutral fact). States legacy intent providers (Bombora, ZoomInfo, Demandbase) \"struggle to activate into Meta, Google, and CTV channels because ad platforms target individuals, not companies.\" Used as evidence of the B2B-substitution difficulty; the underlying mechanism (account-level vs individual-level) is corroborated by this corpus's LinkedIn chapter.* Accessed 2026-06-30.\n12. 6sense / ZoomInfo / Demandbase comparison pages, 2026. https://6sense.com/blog/top-demandbase-alternatives/ ; https://pipeline.zoominfo.com/sales/demandbase-alternatives — *Tier 6 (vendor blogs; each has commercial lean — cited as position evidence). ZoomInfo (500M contacts) \"doesn't natively push intent audiences into paid media channels like Meta, Google, or CTV\"; Bombora is anonymous/account-level and hard to action. Corroborates [11] on the non-activatability of B2B intent data on CTV.* Accessed 2026-06-30.\n13. AdExchanger + Investing.com, Omnicom multi-platform clean room on Acxiom identity; Omnicom Media–NBCUniversal CTV solution; Omnicom–Netflix AI-creative deal, 2026. https://www.adexchanger.com/tv/omnicom-can-now-measure-ad-frequency-across-multiple-ctv-platforms/ ; https://www.investing.com/news/company-news/omnicom-media-nbcuniversal-develop-ctv-ad-solution-93CH-4761223 — *Tier 5 (trade). Omnicom built a multi-platform clean room on Acxiom identity (Snowflake ad-frequency measurement); Acxiom audiences activated on Netflix/NBCU CTV directly — i.e., the holdco routes its OWN graph onto CTV, not a social platform's. Evidence the holdco is a competitor to the social-data fee.* Accessed 2026-06-30.\n14. Digiday, \"The Acxiom data dilemma behind Omnicom's market-making IPG acquisition,\" 2025. https://digiday.com/media-buying/the-acxiom-data-dilemma-behind-omnicoms-market-making-ipg-acquisition/ — *Tier 5 (analytical trade). Skeptical read: questions whether Acxiom (a data broker) is genuinely first-party (\"can be considered first-party data if you squint\"), whether integration is planned, whether the acquisition is asset-liquidation. Cited as the counter-caveat that holdco graphs may not be good enough for every job — the crack LinkedIn fits through.* Accessed 2026-06-30.\n15. Digiday, \"Meta eyes CTV expansion to fuel its next wave of ad growth,\" 2026, incl. Max Willens (eMarketer) commentary. https://digiday.com/future-of-tv/meta-eyes-ctv-expansion-to-fuel-its-next-wave-of-ad-growth/ — *Tier 5 (trade; uses anonymous sources for Meta's plans). Meta's likely end-state described as \"audience extension\" for CTV; Willens attributes Meta's ad-tool rise to \"a massive amount of buy-in from their huge base of advertisers\" — buy-in for Meta's automation ON Meta's surfaces, not for a shipped audience-on-CTV product. Meta plans are reported intent, not confirmed product — flagged.* Accessed 2026-06-30."}, {"order": 13, "file": "13_Gap_International_ExUS_GDPR_DMA.md", "title": "The Ocean the Bridge Does Not Cross — Why Social-to-CTV Is a North American Story", "summary": "", "body": "# The Ocean the Bridge Does Not Cross — Why Social-to-CTV Is a North American Story\n\n## Bottom Line\n\nRead against the rest of this study, one fact has been hiding in plain sight: **the social-to-CTV bridge, as a live commercial reality, does not exist outside North America as of mid-2026.** Every product named here ships in the United States, sometimes Canada, and nowhere else. LinkedIn's CTV Ads are, in LinkedIn's own words, \"currently limited to the United States and Canada, with English-language audience targeting\" [1]. tvScientific by Pinterest is a US platform sold against \"the $72B US television advertising market\" with no announced international footprint [2]. Instagram for TV, six months after launch, was still \"available now in the US\" only, with international rollout promised but unshipped [3]. There is no LinkedIn-in-Germany, no Pinterest-CTV-in-Britain, no Meta-social-graph-onto-EU-streaming product to describe. The scope limit the reader has been feeling is real, and this essay's first job is to say so out loud: **what precedes it is a US/Canada study wearing a global title.**\n\nThe second job is to explain why the ocean is hard to cross. The answer is not distance or language but law. The bridge's core plumbing collides head-on with three EU instruments the rest of this study never mentions. Under the **General Data Protection Regulation (GDPR)**, an IP address is established personal data (the Court of Justice settled this in *Breyer*, C-582/14, in 2016), which strikes directly at the IP-as-household-key resolution the plumbing depends on [4][5]. Under the **ePrivacy Directive**, reading or writing anything on a user's device — the smart TV included — requires *prior opt-in consent*, the mirror image of the US opt-out regime under which all six TV brands ship automatic content recognition (ACR) on by default [6][7]. And under the **Digital Markets Act (DMA)**, the very companies whose integrated advantage this study credits — Alphabet/YouTube, Meta, Microsoft/LinkedIn, Amazon — are *designated gatekeepers* forbidden from combining personal data across their services without freely given consent, which is exactly the cross-surface data-joining the bridge runs on [8][9]. The Commission has already fined Meta €200 million for getting that consent wrong [10].\n\nThe third job is the sharpest. **Scored for Europe rather than the United States, the scorecard inverts at the top.** LinkedIn ranks first in the US precisely because its moat is targeting on professional data — job title, seniority, employer. Under GDPR there is *no B2B carve-out*: professional data is personal data, full stop [11]. And LinkedIn/Microsoft carry a live, expensive EU record on exactly this point — a **€310 million fine from the Irish Data Protection Commission in October 2024** for behavioural analysis and targeted advertising with no valid lawful basis [12][13]. The single most defensible bridge in the US is arguably the *least* portable to Europe. The honest 2029 read: the bridge stays North American for the forecast horizon. A narrow, consent-gated, contextual version may reach the UK first — post-Brexit divergence has loosened, not tightened, the UK regime. Any EU version arrives late, thin, and built differently: reach-and-context, not the household-level behavioural retargeting the US template assumes. This is the study's largest unstated boundary, and here it becomes an argued, bounded claim.\n\n---\n\n## 1. The Scope Boundary, Stated Plainly\n\nA strategic brief owes its reader the edges of its own map. This one has a hard edge that the preceding chapters cross without marking: geography.\n\nGo product by product. **LinkedIn CTV Ads** reached general availability in spring 2026 — across the United States and Canada, English-language targeting only, on LinkedIn's own documentation [1]. The programmatic rails that extend it (The Trade Desk from March 2026, Amazon DSP from May 2026) are **US-only**; Canada rides only on the direct Campaign Manager route [1][12-corpus]. **tvScientific by Pinterest** — the acquisition that gave Pinterest an owned outcome engine — is a US platform. Its own materials frame the opportunity as \"80%+ of the $72B US television advertising market,\" and no primary source names an international launch date or market [2]. **Instagram for TV** launched on Fire TV in December 2025 and, by Meta's own account, remained \"available now in the US\" through at least June 2026, expanding across US device ecosystems (Google TV in February, Samsung in June) while staying inside one country [3]. **Reddit** and **TikTok** have no shipped CTV audience-extension product in *any* geography, so the question of their international footprint is moot until one exists.\n\nThe connective tissue is US-centred too. Amazon DSP and The Trade Desk both operate in Europe, but the *social-data-onto-CTV* deals riding them — LinkedIn's segments activating against Amazon's identity graph — are scoped to the US in the launch announcements [12-corpus]. No social platform's first-party audience is being extended onto European or Asian streaming inventory through any of the mechanisms this study documents. The clean-room venues (AWS Clean Rooms, Snowflake) run globally, but a venue is not a product. An empty room in Frankfurt is still empty.\n\nSo the finding, stated without hedging: **as of mid-2026 the social-to-CTV bridge is a United States phenomenon with a Canadian annex. There is no live deployment elsewhere.** Everything the reader has absorbed about \"which platforms credibly extend onto the big screen\" is, silently, a claim about the American big screen. The rest of this essay treats that boundary not as an embarrassment to hide but as a finding to explain and a forecast to bound.\n\nOne caution on the negative claim itself. Absence of evidence is not proof of absence — it is possible a small pilot runs somewhere unannounced. But the pattern is consistent and independently sourced across five platforms: every one that has shipped, shipped in the US first and explicitly said so. The burden of proof sits with anyone claiming a live ex-US bridge exists, and as of the sources reviewed, no one does.\n\n---\n\n## 2. Why Europe Is the Market That Matters for the Gap\n\nThe scope boundary would be trivial if the excluded territory were trivial. It is not. **Europe is the second-largest CTV advertising market on earth**, and this study's forecast horizon is 2029 — long enough that a US-only reading of \"credible extension\" is a materially incomplete answer to the question the study set itself.\n\nThe numbers, dated and sourced. European CTV ad spend was tracking toward roughly **€14 billion in 2025** on IAB Europe's framing, with one market-research house projecting the region from about **$18.5 billion in 2025 toward $65 billion by 2031** at a ~23% compound growth rate [14]. (The two figures use different scopes and methods — treat the second as an interested market-sizing estimate, not a settled fact; the direction, not the decimal, is what matters.) Connected TV had become the leading device for ad-supported viewing in Europe, reaching on the order of **46% of ad views** in the region by 2025 [14]. The UK leads advertiser commitment — some 77% of UK marketers planning to raise CTV budgets — and Germany showed roughly 21% year-over-year CTV-usage growth [14]. This is not a rounding error against the US. It is the other half of the developed CTV world, and the bridge does not reach it.\n\nThat is what makes the silence expensive. A brief that ranks LinkedIn, Pinterest, and Meta on \"credible extension through 2029\" while quietly scoring only the US market is answering an easier question than the one on the cover. The moment you admit Europe into the frame, the ranking logic changes — because the thing that makes a platform strong in the US (owned professional data, integrated cross-surface graphs, ACR-fed household resolution) is frequently the exact thing EU law constrains hardest.\n\n---\n\n## 3. The Plumbing Meets the Law — Layer by Layer\n\nThe technical chapter of this study built the bridge from four signals — hashed email, mobile advertising ID, IP-plus-geo, and a CTV ID — stitched in an identity graph, matched in a clean room, activated onto household screens carrying ACR. Every one of those joints, load-bearing in the US, meets a specific EU legal mechanism that changes its behaviour or removes it. Take them in order.\n\n### 3a. IP-as-household-key meets *Breyer* and GDPR\n\nThe plumbing's quiet workhorse is the IP address used as a de facto household key — LiveRamp's blunt formulation, quoted earlier in this study, is \"we're using the IP as a replacement for a hashed email.\" In the US that is a technical choice with few legal consequences. In the EU it runs into settled case law.\n\nIn **October 2016 the Court of Justice of the European Union decided *Patrick Breyer v Bundesrepublik Deutschland* (Case C-582/14)**, holding that a dynamic IP address registered by an online service is **personal data** in the hands of that service *where the service has legal means reasonably likely to be used to identify the person* — for instance by combining it with information an internet-access provider holds [4][5]. The reasoning is expansive: data is personal if *someone in the reachable chain* can associate it with an individual, not only if the holder can do so alone [4]. Under the GDPR that followed, the operational upshot is direct: an IP address is presumptively personal data, and processing it — including using it to resolve a household for ad targeting — requires a lawful basis, purpose limitation, transparency, and data-subject rights [5]. The IP-as-household-key mechanic does not become illegal, but it stops being *free*. It becomes a regulated processing operation whose lawful basis is contestable, precisely the sort of basis the Irish DPC has already rejected once for behavioural ad targeting (Section 4).\n\nThis is where the study's own Open Question — \"does household-level targeting survive privacy regulation intact?\" — gets its European answer. In the US the IP-as-household mechanic sits in a permissive opt-out world. In the EU it sits atop personal data by binding CJEU authority, and its lawful basis is the same \"legitimate interest\" claim regulators have been dismantling.\n\n### 3b. ACR meets the ePrivacy Directive — opt-in, not opt-out\n\nThe study reports, correctly for the US, that all six major TV brands ship ACR active by default with an opt-out. That framing is jurisdiction-specific and does not travel.\n\nThe **ePrivacy Directive (2002/58/EC), Article 5(3)**, requires that storing information on, or gaining access to information already stored in, a user's *terminal equipment* is permitted only with the user's prior consent (with narrow necessity exceptions) [6]. The European Data Protection Board's **Guidelines 2/2023**, finalised in 2024, confirm the Article's technical scope reaches well beyond browser cookies to the full range of tracking technologies — and expressly names **connected TVs** among the terminal-equipment examples [6]. ACR reads and reports what is on the screen from the device itself; on the EDPB's reading that is squarely within Article 5(3). The consequence is the mirror image of the US regime: **in the EU, ACR-style viewing-data collection presumptively requires prior opt-IN consent, not a default-on setting with an opt-out.** Independent research has documented that behaviour already differs at the border — in the United Kingdom, for example, some third-party streaming services were reportedly not tracked via ACR, a divergence observers attribute in part to stricter European data-protection norms [7].\n\nThe US direction of travel is, notably, *toward* the European posture rather than away from it. Samsung became the first TV maker to settle a US state action over ACR — the Texas Attorney General matter, settled February 2026 — agreeing to stop collecting viewing data from Texas residents without explicit consent and to rewrite consent screens to be \"clear and conspicuous\" [7]. Kentucky's HB692, passed March 2026, requires *opt-in* consent for ACR on TVs sold in the state — the first US state law to demand what EU law has required since 2002 [7]. The census-grade ACR sensor the study treats as a going concern is, in the EU, a consent-gated feature by default and, even in the US, now migrating toward opt-in under litigation and statute. A measurement layer that thins under opt-in is a materially weaker foundation for the bridge abroad.\n\n*(Inference flag: the mapping of Article 5(3) onto ACR specifically rests on the EDPB's connected-TV example and legal analysis, not on a regulator decision fining a named TV maker under ePrivacy for ACR. Treat \"ACR requires opt-in in the EU\" as well-founded legal reading, not adjudicated fact.)*\n\n### 3c. Clean-room matching meets the consent-vs-legitimate-interest problem\n\nThe study calls the data clean room the load-bearing mechanism — the neutral room where a social platform and a streamer match audiences without either seeing the other's raw records. The room's neutrality is a real privacy improvement, but neutrality is not a lawful basis. Under GDPR, *matching two parties' personal data* is processing that still needs a basis, and for cross-party marketing the realistic bases are consent or legitimate interest.\n\nThe US template leans on legitimate interest. The EU trend is to reject it for behavioural advertising. The Irish DPC's LinkedIn decision (Section 4) found legitimate interest *overridden* by data-subject rights for exactly this purpose [12][13], and the EDPB has repeatedly narrowed legitimate interest as a basis for tracking-based advertising. So a clean-room match that is unremarkable in a US legitimate-interest world becomes, in the EU, a processing operation whose basis is contested at best and requires explicit consent at worst — consent that is genuinely freely given, informed, and specific, which the DPC and the Commission have both found the incumbents failing to obtain [10][12]. The room can be built in Frankfurt. Filling it lawfully is the hard part.\n\n### 3d. Cross-surface extension meets the DMA gatekeeper regime\n\nThe study's most confident structural claims — YouTube's \"integrated bridge,\" Meta's Advantage+-onto-CTV plan, Amazon as the connective tissue — all assume a freedom to *join data across surfaces* that the DMA specifically curtails for the largest players.\n\nOn **6 September 2023 the European Commission designated six gatekeepers under the DMA: Alphabet, Amazon, Apple, ByteDance, Meta, and Microsoft**, covering 22 (later 23+) core platform services [8]. The designations reach straight into this study's cast: **YouTube, Google Ads, and Google Search under Alphabet; Facebook, Instagram, and Meta Ads under Meta; Amazon Marketplace and Amazon Ads under Amazon; TikTok under ByteDance; and — decisively for the scorecard — LinkedIn under Microsoft** [8]. **DMA Article 5(2)** forbids a gatekeeper from combining personal data across its core platform services, or cross-using it in other services, or combining it with third-party-sourced data, **unless the end user has been offered a specific choice and given consent** [9]. That prohibition is a description, almost word for word, of what social-to-CTV audience extension *is*: taking first-party data from one surface (the social app) and joining it to identity and inventory on another (streaming) to target a household.\n\nThis is not theoretical. On **23 April 2025 the Commission fined Meta €200 million** for its \"pay-or-consent\" model, holding that Meta had not obtained *freely given* consent for combining personal data across services under Article 5(2) — because a binary \"consent to tracking or pay a fee\" choice is not free consent [10]. The Commission has separately pursued Google/Alphabet in ad-tech (a €2.95 billion decision in September 2025 on ad-tech practices) [9]. The pattern is unambiguous: **the exact data-joining freedom the US bridge assumes is, for these designated gatekeepers, the specific thing the DMA gates behind consent the Commission keeps finding invalid.** YouTube's integrated bridge and Meta's cross-surface plan do not become impossible in the EU — but they become consent-dependent in a regime that has repeatedly ruled the incumbents' consent mechanisms non-compliant, which is a very different strategic proposition from the frictionless US default.\n\n*(Scope note: LinkedIn *the platform* is a designated core platform service; the Commission's Article 5(2) enforcement to date has centred on Meta. That LinkedIn's future CTV data-joining would face Article 5(2) scrutiny is inference from its gatekeeper-service status, not an existing LinkedIn DMA decision. Flagged as inference.)*\n\n---\n\n## 4. LinkedIn — The US Strength That Is the EU Liability\n\nThe scorecard's number-one ranking rests on a single sentence of logic: LinkedIn's verified professional attributes cannot be reconstructed from viewing data, so its signal is non-substitutable, so it holds the strongest moat. Every word of that is true — in the United States. Move the frame to Europe and the same moat becomes the deepest liability in the study, for two compounding reasons.\n\n**First, GDPR has no B2B carve-out.** Several US state privacy laws exempt (or long exempted) business-to-business and employee data; GDPR never did [11]. Professional data — name, work email, job title, seniority, employer — is personal data with no special exemption for the professional context [11]. LinkedIn's entire targeting proposition *is* processing professional personal data for behavioural advertising, which is precisely the activity GDPR polices most tightly and grants no B2B relief from. The attribute that makes LinkedIn unique in the US market makes it maximally exposed in the EU one.\n\n**Second, LinkedIn/Microsoft carry a live, dated, expensive EU record on exactly this activity.** On **22 October 2024 (announced 24 October) the Irish Data Protection Commission issued a final decision fining LinkedIn Ireland €310 million** for processing member data for behavioural analysis and targeted advertising, and — critically — found that LinkedIn had **no valid lawful basis on any of the three grounds it tried** [12][13]. The DPC held that LinkedIn's *consent* was not freely given, sufficiently informed, specific, or unambiguous; that *contractual necessity* did not cover behavioural analysis and targeted advertising; and that *legitimate interest* was overridden by the fundamental rights and freedoms of data subjects [12][13]. The Deputy Commissioner's language was blunt: processing personal data without an appropriate legal basis \"is a clear and serious violation of a data subject's fundamental right to data protection\" [12]. The decision cleared the GDPR cooperation mechanism (Article 60) with no objection from other authorities, and included an order to bring processing into compliance; LinkedIn filed a statutory appeal and secured leave for judicial review in the Irish High Court in December 2024 [13].\n\nPut the two together. The one platform this study ranks as the most credible extender onto CTV is the one platform that has *already been told by an EU regulator that its core targeting activity had no lawful basis*, on the very data type (professional attributes) that constitutes its moat — and it is a DMA gatekeeper service to boot. A CTV extension is not a new legal question for LinkedIn in Europe; it is the same question it just lost, projected onto a bigger screen. **Scored for the EU, LinkedIn does not rank first. It ranks among the most legally encumbered, because the thing it is best at is the thing the EU most restricts.** The US scorecard's #1 is, outside the US, closer to a cautionary case.\n\n*(Honesty note: the €310 million fine is under appeal and judicial review as of the sources reviewed; it is a final DPC decision, not a settled outcome after all appeals. And it addresses on-platform behavioural ads, not a CTV product that does not yet exist in the EU. The inference that a LinkedIn EU CTV product would face the same barrier is well-grounded but remains inference, not adjudicated fact. Both flags matter.)*\n\n---\n\n## 5. Re-Scoring the Bridge for Ex-US\n\nHold the study's six scoring dimensions fixed and change only the jurisdiction from the US to the EU. The re-ranking is not cosmetic; the ordering at the top inverts, and the reasons are legal, not commercial.\n\n**LinkedIn** falls from first toward the back of the credible-extension pack. Its moat (professional-data targeting) is GDPR's least-forgiving object, it is a DMA gatekeeper service, and it carries a €310 million adverse decision on the exact activity [11][12][8]. In the EU, LinkedIn's strength is inverted into its principal risk.\n\n**Meta** and **YouTube/Alphabet** keep their scale and identity-graph advantages but acquire heavy DMA drag the US frame ignores. Article 5(2) gates the cross-surface data-joining both plans assume, and the Commission has already fined Meta €200 million for a non-compliant consent mechanism [9][10]. Their EU ceiling sits below their US ceiling — not because the graphs are worse but because using them across surfaces now requires consent the regulator keeps invalidating.\n\n**Pinterest/tvScientific** is differently exposed. It is *not* a designated gatekeeper, which spares it the DMA drag — a genuine relative advantage in the EU frame. But it has no EU product, no announced EU timeline, and it inherits the same ACR-opt-in and IP-as-personal-data constraints on the household resolution its outcome engine depends on [6][4]. Its intent data is commercial rather than professional, so it avoids LinkedIn's specific professional-data problem, but it still needs a lawful basis for cross-party matching in a regime narrowing legitimate interest [12]. Pinterest may be the *least* legally encumbered of the front-runners abroad precisely because it is the one non-gatekeeper — a point the US scorecard cannot see.\n\n**Reddit** and **TikTok** change least, because they have nothing shipped to constrain — though TikTok, as a designated gatekeeper (ByteDance), would face the same Article 5(2) consent gate on any cross-surface extension it eventually attempted [8].\n\nThe re-scored headline: **the US ranking is not a global ranking. In the EU frame the gatekeeper status that signals dominance becomes a regulatory handicap, professional data flips from moat to liability, and the one clear structural advantage — being small enough not to be a gatekeeper — belongs to Pinterest, the platform the US scorecard ranks second precisely for being reach-limited.** The dimensions that predict US success (owned data, integrated surfaces, scale) partially anti-correlate with EU portability. That inversion is the finding.\n\n---\n\n## 6. The UK, the Adequacy Line, and the Rest of the World\n\nEurope is not one regime, and the most likely first ex-US beachhead is the one that has been quietly diverging *toward* permissiveness: the United Kingdom.\n\nPost-Brexit, the UK runs **UK GDPR** alongside the **Privacy and Electronic Communications Regulations (PECR)**, enforced by the Information Commissioner's Office [15]. The **Data (Use and Access) Act 2025**, which received Royal Assent on 19 June 2025 and whose data-protection provisions began commencing in early 2026, *loosened* parts of the regime — most relevantly, it amended PECR Regulation 6 to create new consent exemptions for low-risk analytics and functionality storage, so that some tracking that would need a consent banner under the EU ePrivacy reading may be placed in the UK without one [15]. PECR still reaches \"apps on smartphones, tablets, smart TVs or other devices,\" so ACR-style device access is still in scope; but the direction of UK travel is toward lighter-touch, not heavier [15]. Crucially, the European Commission **renewed the UK's data-protection adequacy decision on 19 December 2025 (to 27 December 2031)**, signalling that the divergence, so far, has not broken the UK's standing as a jurisdiction the EU trusts [15]. The strategic implication: if any social-to-CTV bridge crosses the Atlantic first, the **UK is the probable first landing** — English-language (matching LinkedIn's stated constraint), large CTV market (the region's most bullish advertisers), and a lighter storage-and-access regime than the EU-27.\n\nElsewhere the picture is thinner, and mostly a question of whether the *seed conditions* exist rather than whether the bridge does. The **retail-media/clean-room template that seeded the US bridge does exist in Europe** — Tesco (Nectar360/Clubcard), Carrefour (Carrefour Links, and the Carrefour–Publicis \"Unlimitail\" alliance), and Ahold Delhaize run sophisticated first-party retail-media networks, several with InfoSum clean-room integrations and growing CTV capability, and European retail-media spend was growing ~22% a year toward a projected €31 billion by 2028 [16]. So the *template* is present; what is absent is the *social-platform extension of it onto CTV*, the specific thing this study is about. **Germany**'s CTV market is large but still ~30% direct/70% programmatic (versus near-100% programmatic in the US), a structural difference that slows the programmatic-clean-room plumbing the bridge assumes [14]. **India** and **LATAM** are covered in this study's sibling markets as fast-growing CTV regions, but neither hosts a live social-to-CTV audience-extension product as of the sources here. **Canada** — the study's footnote — is the one genuine ex-US deployment, and only via LinkedIn's direct Campaign Manager route, English-language, riding US-built plumbing [1]. The honest global map: **one live bridge, in the US; a thin annex in Canada; a probable first-crossing to the UK; and everywhere else, template-present but bridge-absent.**\n\n---\n\n## 7. The 2029 Read — When, If Ever, Does the Bridge Go Global\n\nAnswer first: **through the 2029 forecast horizon, the social-to-CTV bridge remains predominantly North American.** A UK crossing is plausible and probably first; a genuine EU-27 deployment is likely late, narrow, and built differently from the US template — and may not arrive in force by 2029 at all. The reasoning follows the three legal gates above.\n\nThe **UK** is the near-term opening. It shares LinkedIn's English-language constraint, hosts the region's most CTV-committed advertisers, and has diverged toward a lighter storage-and-access regime under the 2025 Act while keeping EU adequacy [14][15]. If LinkedIn, Pinterest, or Meta extends any product beyond North America before 2029, the base rate says the UK goes first. Even there, the professional-data and consent questions do not vanish — UK GDPR still applies — but the ePrivacy friction is lower and the political-regulatory climate more accommodating.\n\nThe **EU-27** is the hard case, and the gates compound rather than add. A compliant EU social-to-CTV product would need, simultaneously: a valid lawful basis for behavioural cross-party matching in a regime that has rejected legitimate interest for exactly this (the DPC LinkedIn decision) [12]; genuine opt-in consent for ACR-style device access under ePrivacy, which thins the household-resolution census [6]; and, for every gatekeeper actor, freely-given DMA Article 5(2) consent for the cross-surface data-joining, of a kind the Commission has repeatedly found the incumbents failing to obtain [9][10]. Each gate independently lowers match rates, reach, and precision; stacked, they push the achievable EU product toward **reach-and-context** (consented, aggregate, contextual streaming placement) and away from the **household-level behavioural retargeting** the US template sells. The likeliest EU form of \"social-to-CTV\" by 2029 is not the US bridge ported — it is a consent-gated, contextual, lower-precision cousin that shares a name and little else.\n\nTwo wildcards could move the date. A **Meta or Alphabet DMA settlement** that produces a durable, Commission-blessed consent flow would unlock cross-surface joining for the gatekeepers and could pull an EU bridge forward — but the trajectory so far (fines, appeals, \"pay-or-consent\" rejected) points the other way [10]. And the **US regime drifting toward opt-in** (Texas/Samsung, Kentucky HB692) would narrow the transatlantic gap not by loosening the EU but by tightening the US — which would erode the US bridge's own foundations rather than help it travel [7]. Neither wildcard argues for a confident global bridge by 2029.\n\nSo the bounded claim that replaces the study's silent assumption: **the social-to-CTV bridge is, and through 2029 will most likely remain, a North American product. Its most defensible US instance — LinkedIn's professional-data targeting — is its least portable abroad, because GDPR treats professional data as fully protected personal data, LinkedIn is a DMA gatekeeper service, and it already lost a €310 million ruling on the underlying activity. The bridge's next stop is the UK, not the Continent; and the EU version, when it comes, will be a consent-gated, contextual cousin rather than the household-retargeting engine the US template describes.** The study's global title, honestly read, names a North American thing — and now the reader knows exactly why, and exactly what would have to change for it to become the global thing the title promises.\n\n---\n\n## Open Questions\n\n1. **Does LinkedIn's €310 million fine survive appeal, and does the outcome bear on a hypothetical EU CTV product?** The decision is under judicial review in the Irish High Court [13]. A reversal or narrowing would change the EU LinkedIn calculus; an affirmation hardens the professional-data barrier. Either way, the fine addresses on-platform behavioural ads, and the read-across to an unbuilt CTV product remains inference.\n\n2. **Will a gatekeeper land a durable DMA-compliant consent flow?** The Commission has rejected Meta's \"pay-or-consent\" [10]. If some future consent mechanism satisfies Article 5(2) and survives, cross-surface joining reopens for the gatekeepers and an EU bridge accelerates. No such blessed flow exists as of the sources reviewed.\n\n3. **How does the EU actually treat ACR under ePrivacy in an enforcement action, not just guidance?** The opt-in reading rests on EDPB Guidelines 2/2023 and the connected-TV example [6], not on a decided case fining a TV maker for ACR under Article 5(3). A concrete EU ACR enforcement action would convert inference into precedent.\n\n4. **Does the UK's lighter 2025 regime actually pull a bridge across first — and does that risk its EU adequacy?** The Data (Use and Access) Act loosened storage-and-access rules while adequacy was renewed to 2031 [15]. Whether that combination is stable, or whether further UK divergence jeopardises adequacy (and thus EU data flows), is unresolved.\n\n5. **Where is the independent evidence on ex-US product footprints?** The negative finding rests on the absence of any announced ex-US launch across five platforms. A single unannounced EU or APAC pilot would not overturn the pattern but would sharpen it; no such pilot surfaced in the sources here.\n\n6. **Does the European retail-media clean-room base (Tesco, Carrefour, Ahold) eventually seed a *social*-to-CTV bridge, as US retail media did?** The template is present [16]; the social extension is not. Whether Europe's retail-media maturity becomes the on-ramp for social platforms, or whether the legal gates keep the two apart, is the key ex-US structural question for 2027–2029.\n\n---\n\n## Sources\n\n1. LinkedIn Marketing Solutions Help, \"CTV Ads,\" accessed 2026-06-30. https://www.linkedin.com/help/lms/answer/a5966603 — *Tier 1 (product owner's own documentation). Primary evidence that CTV Ads is \"currently limited to the United States and Canada, with English-language audience targeting.\" The load-bearing footprint fact for the scope boundary.*\n2. Pinterest Newsroom / tvScientific materials, \"Pinterest to Acquire tvScientific,\" Dec 11 2025, and tvScientific platform pages, accessed 2026-06-30. https://newsroom.pinterest.com/news/pinterest-tvscientific/ ; https://www.tvscientific.com/tvscientific-platform — *Tier 1 (company primary) + vendor. Frames the opportunity as the \"$72B US television advertising market,\" 95% AVOD reach; no announced international launch/market. Used for the US-only footprint and absence of an intl timeline (a negative finding).*\n3. Meta / About Instagram + Amazon, \"Introducing Instagram for TV,\" Dec 2025, and coverage of the Google TV (Feb 2026) and Samsung (Jun 2026) US expansions. https://about.fb.com/news/2025/12/instagram-for-tv/ ; https://www.aboutamazon.com/news/devices/fire-tv-amazon-instagram-for-tv ; https://deadline.com/2026/06/instagram-samsung-smart-tvs-amazon-fire-google-tv-1236964059/ — *Tier 1/4 (company primary + trade). Instagram for TV \"available now in the US\"; expansion across US device ecosystems while staying single-country; intl rollout promised, unshipped as of Jun 2026.*\n4. CJEU, *Patrick Breyer v Bundesrepublik Deutschland*, Case C-582/14, judgment 19 Oct 2016, as summarised by GDPRhub and multiple law-firm analyses. https://gdprhub.eu/index.php?title=CJEU_-_C-582/14_-_Breyer ; https://www.insideprivacy.com/international/cjeu-confirms-dynamic-ip-addresses-to-be-personal-data/ — *Tier 1 (judgment) via Tier 2/5 summaries. Dynamic IP is personal data where the holder has legal means reasonably likely to identify the person, incl. via combination with ISP-held data. The foundation for treating IP-as-household-key as regulated personal-data processing in the EU.*\n5. GDPR (Regulation (EU) 2016/679), personal-data definition and lawful-basis framework, as applied to IP in law-firm analyses of *Breyer*. https://www.simmons-simmons.com/publications/ck0bhjevuo5ft0b855wjitcow/09-european-court-of-justice-dynamic-ip-addresses-may-be-considered-personal-data — *Tier 1 (regulation) via Tier 5 analysis. Lawful basis / purpose limitation / rights attach once IP is personal data. Used for the \"not illegal but no longer free\" reading.*\n6. ePrivacy Directive 2002/58/EC, Article 5(3), and EDPB Guidelines 2/2023 on the technical scope of Art. 5(3) (finalised 2024), which name connected TVs as terminal equipment. https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32002L0058 ; https://www.edpb.europa.eu/system/files/2024-10/edpb_guidelines_202302_technical_scope_art_53_eprivacydirective_v2_en_0.pdf — *Tier 1 (directive + EU regulator guidance). Prior opt-in consent to store/access info on terminal equipment incl. connected TVs; the mirror image of the US opt-out ACR default. The ACR-opt-in reading is guidance-grounded inference, flagged in text.*\n7. Consumer Reports and ACR-privacy coverage on EU/UK divergence and US movement toward opt-in (Samsung/Texas AG settlement Feb 2026; Kentucky HB692 Mar 2026). https://www.consumerreports.org/electronics/privacy/how-to-turn-off-smart-tv-snooping-features-a4840102036/ — *Tier 4/5 (major consumer outlet + trade). UK non-tracking of some services attributed to stricter EU norms; Samsung Texas settlement; Kentucky opt-in ACR law. Used for the US-is-drifting-toward-EU point.*\n8. European Commission, \"Commission designates six gatekeepers under the Digital Markets Act,\" 6 Sep 2023, and the DMA gatekeepers portal listing core platform services. https://digital-markets-act.ec.europa.eu/commission-designates-six-gatekeepers-under-digital-markets-act-2023-09-06_en ; https://digital-markets-act.ec.europa.eu/gatekeepers-portal_en — *Tier 1 (EU regulator primary). Alphabet (YouTube, Google Ads, Search…), Amazon (Marketplace, Ads), Meta (Facebook, Instagram, Meta Ads), ByteDance (TikTok), Microsoft (LinkedIn) designated. The fact that LinkedIn/YouTube/Meta Ads/Amazon Ads/TikTok are gatekeeper services — decisive for the re-score.*\n9. DMA (Regulation (EU) 2022/1925) Article 5(2) prohibition on cross-service data combination without consent; Commission ad-tech decision against Google (€2.95bn, Sep 2025). https://www.eu-digital-markets-act.com/Digital_Markets_Act_Article_5.html ; https://en.wikipedia.org/wiki/Digital_Markets_Act (cited only for navigation to primary) — *Tier 1 (regulation) + Tier 5 analysis. Art. 5(2) gates the exact cross-surface data-joining the bridge assumes. Wikipedia used only to locate primary; substantive claims sourced to the regulation text and Commission actions.*\n10. European Commission DMA non-compliance decision fining Meta €200 million, 23 Apr 2025, for a \"pay-or-consent\" model that did not secure freely given Art. 5(2) consent, as reported by Taylor Wessing / Hunton / Noerr. https://www.taylorwessing.com/en/insights-and-events/insights/2025/04/meta-fined-200-million-euro-by-eu-under-digital-markets-act ; https://www.hunton.com/privacy-and-information-security-law/european-commission-fines-apple-and-meta-for-non-compliance-with-the-dma — *Tier 1 (Commission decision) via Tier 5 law-firm reporting. The concrete proof that the data-joining freedom the US bridge assumes is gated and actively enforced in the EU.*\n11. Analyses confirming GDPR has no B2B/employee carve-out and that professional data (job title, work email, seniority) is personal data. https://www.troutman.com/insights/lessons-from-the-gdpr-on-the-sunset-of-the-ccpas-personnel-and-b2b-exemptions.html ; https://gdprlocal.com/b2b-gdpr/ — *Tier 5 (law-firm / specialist analysis of the GDPR text). The load-bearing legal basis for \"LinkedIn's professional-data moat is its EU liability.\" Analysis-of-primary; the underlying rule is the GDPR personal-data definition.*\n12. Irish Data Protection Commission, press release, \"Irish Data Protection Commission fines LinkedIn Ireland €310 million,\" 24 Oct 2024 (final decision 22 Oct 2024). https://www.dataprotection.ie/en/news-media/press-releases/irish-data-protection-commission-fines-linkedin-ireland-eu310-million — *Tier 1 (regulator primary). €310m fine; no valid lawful basis on consent, contractual necessity, or legitimate interest for behavioural analysis + targeted advertising; order to bring processing into compliance; Deputy Commissioner quote. The single most important EU fact for the LinkedIn re-score.*\n13. IAPP / Goodwin / Pinsent Masons coverage of the DPC LinkedIn decision, the Article 60 cooperation clearance, and LinkedIn's statutory appeal + High Court judicial-review leave (Dec 2024). https://iapp.org/news/a/irish-dpc-details-legitimate-interest-prong-of-its-linkedin-enforcement-action ; https://www.goodwinlaw.com/en/insights/publications/2024/11/insights-finance-dpc-irish-data-protection-commission-fines-linkedin — *Tier 5 (specialist/law-firm). Procedural detail: Art. 60 clearance without objection, appeal filed 18 Nov 2024, judicial-review leave 16 Dec 2024. Used to flag the decision is under appeal (honesty caveat).*\n14. IAB Europe CTV hub, TVREV, and market-research sizing for European CTV (~€14bn 2025 on IAB Europe framing; ~$18.5bn 2025 → ~$65bn 2031 market-research projection; ~46% of EU ad views; UK 77% budget intent; Germany ~30/70 direct/programmatic). https://iabeurope.eu/knowledge-hub-categories/connected-tv-ctv/ ; https://www.tvrev.com/news/connected-tv-ctv-investment-across-europe-is-booming-but-growth-is-not-automatic — *Tier 5 (industry body + trade + market-research). Europe as the second-largest CTV market; German programmatic-share structural difference. Market-sizing figures are interested estimates — direction over decimal.*\n15. ICO PECR guidance; the Data (Use and Access) Act 2025 (Royal Assent 19 Jun 2025; data-protection provisions commencing early 2026; PECR Reg 6 analytics/functionality exemptions); EU renewal of UK adequacy 19 Dec 2025 to 27 Dec 2031. https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/guidance-on-the-use-of-storage-and-access-technologies/ ; https://www.addleshawgoddard.com/en/insights/insights-briefings/2025/data-protection/data-use-and-access-act-2025-top-7-changes/ — *Tier 1 (ICO + statute) via Tier 5 law-firm summary. UK divergence toward lighter storage-and-access rules; PECR still reaches smart TVs; adequacy renewed. Basis for \"UK is the probable first crossing.\"*\n16. eMarketer, Skai, Retail Media Age, and Kevel/IAB Europe coverage of European retail-media networks (Tesco/Nectar360, Carrefour Links/Unlimitail, Ahold Delhaize), InfoSum clean-room integrations, growing CTV capability, ~22% growth toward ~€31bn by 2028. https://www.emarketer.com/content/faq-on-data-clean-rooms-how-retail-media-driving-adoption-marketers-demand-proof ; https://retailmediaage.co.uk/retail-media-networks/a-guide-to-the-uks-leading-retail-media-networks-and-what-sets-them-apart/ — *Tier 5 (analytical / trade). The retail-media/clean-room template exists in Europe; the social-platform extension of it onto CTV does not yet. Used for the \"template-present, bridge-absent\" finding.*"}, {"order": 14, "file": "Future_Trajectory.md", "title": "Social-to-CTV Retargeting: Future Trajectory", "summary": "", "body": "# Social-to-CTV Retargeting: Future Trajectory\n\n## Bottom Line\n\nThe most likely path through 2029 is a split verdict, carrying roughly 36–46% of the probability mass. LinkedIn's non-substitutable verified-professional identity survives as a durable, monetizable CTV business. The other four extension plays — behavioral, demographic, and intent segments off Pinterest, Reddit, TikTok, and any Meta pipe — get slowly reconstructed and underpriced by streamers, TV-OS operators, and holdco identity spines, ending the decade as a thinning workaround rather than a franchise. The force pushing that way is structural: streamers and holding companies can rebuild demographic and behavioral segments themselves, but not a declared job title, and the buy side won't pay a social-data toll on top of the 40–60% tech tax. The competing story — near-total disintermediation, in which even LinkedIn compresses to a thin licensing fee — holds 22–32%, gated on whether a streamer or Amazon ships verified-employment or self-serve B2B CRM/ABM-list onboarding before LinkedIn deepens its integration. A durable multi-platform category, where the extension sticks for two or three players (LinkedIn plus owned-rail Pinterest, and perhaps a Meta pipe), sits at 16–24%. A Meta front-running event — a shipped, owned Reels-TV ad surface or a scaled Audience-Network-for-CTV that reshapes the category — carries 12–18%, though the far more common \"Meta ships something\" outcome mostly reinforces the workaround shape instead. A regulatory rupture that breaks the household-IP plumbing wholesale — driven by the Salazar v. Paramount VPPA case now at the Supreme Court — holds the 9–15% tail, anchored to the roughly one-in-four rate at which \"existential\" ad-tech privacy shocks actually become structural resets rather than absorbed compliance costs.\n\n## Method\n\nNo liquid prediction market covers any leg of this question. A sweep on 2026-06-30 found only settled or wound-down TikTok markets (acquisition, ban), none of which price the durability of the social-to-CTV bridge, a Meta CTV ad product, LinkedIn CTV revenue, or streamer-versus-social audience share. The forecast therefore rests on reference classes and Fermi decomposition, weighted by surviving grounding rather than averaged.\n\nThree base rates anchor the distribution. The retail-media analog (docs 01, 07) says that of roughly five first-party-data holders extending off-platform, about one built a durable independent business (Amazon, >$60–70B) and four licensed their data into other companies' margins — a ~1/5 durable rate per platform. A moat-durability rate says a non-substitutable declared-identity advantage survives three-plus years of well-capitalized substitution about 55–75% of the time in ad tech. And an ad-tech regulatory-rupture rate says that of the \"existential\" privacy threats of the last decade — GDPR, CCPA, cookie deprecation, ATT — roughly one in four (ATT) delivered a true structural rupture while the rest were absorbed as compliance cost.\n\nThe council consulted the corpus's own verified 2029 base case (claims 7.7 and 11.1), the retail-media precedent, the holdco identity-spine moves (Publicis–LiveRamp, Omnicom–Acxiom, WPP–InfoSum), the Meta-CTV reporting, and the VPPA/state-privacy litigation record. The horizon is through 2029, with the corpus framing inversion as an end-of-2029 drift-completing state, not a discontinuous jump.\n\nOne hinge stayed live. Does LinkedIn's non-substitutable professional-identity *data* moat convert into a *monetizable* durable CTV revenue line, or stay a thin niche that the PMP-deal-ID delivery flaw and streamer ABM/CRM onboarding compress toward a licensing fee? The driver and base-rate members held LinkedIn durable-and-material (~0.60–0.80); the contrarian held it real at the data layer but unproven at programmatic scale (~0.55–0.65). That disagreement is preserved as the ~10-point shared band between the Bifurcation (36–46) and Full-Inversion (22–32) scenarios — a band, not a point. A smaller prior sits under the regulatory tail: does industry \"re-plumb around\" a Salazar shock (driver, low) or does ATT-precedent say it sometimes lands (contrarian/discontinuity, higher)? The 9–15 width carries that spread. Cross-examination defeated three moves: the driver's clean P(moat)=0.80 and the contrarian's mirror LinkedIn-immaterial read (a >$500M bar was ruled arbitrary — they collapse into the same band, not a third mode); the discontinuity member's fast-step Inversion Cascade timing (reallocation lags capability); and the discontinuity 0.45 Meta-reshape number (it conflated an owned Reels-TV land-grab with a demand network), lowered to ~0.22–0.25. A geometric-mean-of-odds check is consistent with the scenario centers (~41 / 26 / 20 / 15 / 11).\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios — through 2029<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Bifurcation / Split Verdic…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"361.8\" y=\"8\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"418.9\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">36–46%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Near-Total Disintermediati…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"293.0\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"350.1\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">22–32%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Durable Multi-Platform Cat…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"263.6\" y=\"80\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"310.8\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">16–24%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Meta Front-Runs — a shippe…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"243.9\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"281.4\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">12–18%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Regulatory Rupture — VPPA/…<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"229.2\" y=\"152\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"266.6\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">9–15%<\/text><\/svg><figcaption> <span class=\"credit\">Source: the-forecaster — Predictive Council.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario 1: Bifurcation / Split Verdict — LinkedIn durable, the other four a workaround being disintermediated\n\n**Probability: 36–46%.** The modal outcome. By 2029, the category has split cleanly. LinkedIn CTV Ads survives as a durable, material business built on the one asset streamers and holdcos cannot reconstruct — verified, declared professional identity (title, industry, seniority) drawn from more than a billion members. The other four extension plays — Pinterest's intent audiences, Reddit and TikTok's behavioral segments, and any Meta audience pipe — remain real products, but they carry substitutable data that streamers and holding companies rebuild and underprice, so they finish the decade as a thinning workaround rather than a franchise.\n\n**How this number was derived.** Reference-class plus decomposition, modal. The retail-media analog (doc 07) puts roughly 1/5 of first-party-data holders on the durable side, which maps onto the corpus's 2029 base case of one durable platform (LinkedIn) and four workarounds. Three of four council members landed here independently (base-rate 36–46, driver 38–47, and even the contrarian's second scenario at 30–38). The decomposition is P(LinkedIn durable-and-material) × P(the four stay substitutable | non-rupture): the driver's 0.80 × 0.88 ≈ 0.72 sets the upper bound, and the base-rate member's thinned 0.60 × 0.88 ≈ 0.53 the lower. Cross-examination defeated both the pure-0.80 read (the PMP-deal-ID delivery flaw is real) and the pure-immaterial read (a durable B2B niche need not post more than $500M to count). Center ~41%.\n\n**Drivers.** The non-substitutability of LinkedIn's declared professional identity contrasts sharply with the full substitutability of demo, behavioral, and intent segments (claim 11.1). Streamers and TV-OS operators already sell competing first-party audience segments, years ahead (doc 11). Holdco identity spines — Publicis–LiveRamp ($2.2B), Omnicom–Acxiom, WPP–InfoSum — compete directly with the social-data fee (doc 12). That social-data licensing cut is the thinnest, most match-rate-exposed link in the 40–60% tech tax (doc 07). And roughly 36% of 2026 CTV budget increases are substitution *out* of social, not carriage of social audiences onto CTV (claim 12.1).\n\n**Conditions.** LinkedIn CTV Ads sustains general availability and adds DSP and measurement depth without a professional-identity substitute emerging; streamers and holdcos keep reconstructing substitutable segments and underpricing licensed social data; no streamer ships self-serve B2B CRM/ABM-list onboarding that substitutes for LinkedIn's segment; and no regulatory event guts the household-IP, pixel, and clean-room plumbing wholesale.\n\n**Signals to watch.** LinkedIn CTV Ads adding a third-or-more DSP, or a genuine household-graph product (not declaration or PMP-deal-ID delivery), by 2027; a streamer launching self-serve B2B CRM/ABM-list onboarding, which would break the moat; Pinterest or tvScientific reporting *audited* (non-vendor) incrementality — or conversely going quiet; and streamer clean-room deals routing advertiser CRM or retailer data directly, around the social-data layer.\n\n**Time horizon:** through 2029.\n\n### Scenario 2: Near-Total Disintermediation / Full Inversion — even LinkedIn compresses to a thin licensing fee\n\n**Probability: 22–32%.** The inversion overtakes everyone. The four substitutable platforms are disintermediated as expected, and LinkedIn's moat also fails to convert into a standalone programmatic business: it ships PMP deal IDs rather than a household graph, non-deterministic delivery caps its scale, and a streamer or Amazon fields verified-employment or ABM-list targeting that lets buyers reach named accounts without a LinkedIn segment. LinkedIn ends the decade as a thin data-licensing fee inside someone else's margin — possibly folded into Microsoft Advertising as a feature.\n\n**How this number was derived.** Base-rate high-end plus decomposition, widened. The corpus 2029 inversion base case for the four substitutable platforms (P≈0.90) is multiplied by P(inversion *also* overtakes LinkedIn's moat by 2029). The driver's read: 0.90 × 0.29 ≈ 0.26; the base-rate member's Scenario 3 landed ~20; the contrarian's modal Reversion-to-Owner survived at 30–40, but only on the narrower PMP-deal-ID + CRM/ABM-substitution flaw, after conceding the data moat is real. Cross-examination defeated the contrarian's >$500M falsification bar (arbitrary) and the discontinuity fast-step timing (reallocation lags capability; the corpus frames inversion as an end-2029 drift-completing state). The moat survives three-plus years ~55–65% → fails ~0.35–0.45 × shows-by-2029 ~0.5–0.7. Center ~26%.\n\n**Drivers.** Holdco-spine ownership makes the social-data fee a payment to a direct competitor (doc 12); the buy side is already stripping supply-path tolls (Dentsu and WPP exited OpenPath). A streamer shipping self-serve B2B ABM/CRM-list onboarding would let buyers target named accounts without a LinkedIn segment. LinkedIn ships PMP deal IDs, not a household graph, so non-deterministic delivery caps programmatic scale (doc 12). YouTube as integrated owner — 13.5% of US TV viewing, its own identity, DV360, and measurement — sets a ceiling the renters trail (doc 09). And match-rate decay (a ~50% blind floor, doc 02) compounds with Amazon's B2B ambitions and its fastest-growing DSP (claim 7.4).\n\n**Conditions.** Streamers and holdcos out-execute on identity faster than LinkedIn deepens its B2B integration; a streamer or Amazon ships verified-employment/firmographic or ABM-list targeting at scale; LinkedIn CTV fails to deepen beyond declaration/PMP-deal-ID targeting; and no regulatory or structural event re-privileges first-party social data.\n\n**Signals to watch.** Amazon or a streamer launching native B2B professional-targeting or self-serve ABM-list onboarding; LinkedIn CTV Ads plateauing, repositioned as pure data-licensing, or folded into Microsoft Advertising as a feature; no social platform (LinkedIn included) breaking out a material CTV audience-extension revenue line by 2028; and independent incrementality studies showing social-audience CTV underperforming streamer segments.\n\n**Time horizon:** through 2029.\n\n### Scenario 3: Durable Multi-Platform Category — extension sticks for 2–3 players (LinkedIn + owned-rail Pinterest, ± a Meta pipe)\n\n**Probability: 16–24%.** The extension proves durable for more than just LinkedIn. Pinterest, which *owns* rather than rents its CTV rail after closing the tvScientific acquisition and wiring it into Performance+, holds a genuine second durable slot on the strength of supply-side control and a commerce-intent signal streamers do not natively carry. A weakly independent Meta demand pipe may add a third. The category ends the decade as a real multi-seller market for social-audience CTV, not a one-platform exception.\n\n**How this number was derived.** Reference-class deviation — this needs roughly 2–3 of 5 durable, above the ~1/5 base rate. Decompose P(at least one second survivor joins LinkedIn): P(Pinterest owned-rail durable | tvScientific closed Feb 2026, wired into Performance+) ≈ 0.38 — raised from 0.35 because a *closed* acquisition is real supply-side control the other three merely rent, but capped because every lift figure is vendor-reported and intent resolves to a shared household (doc 04); plus a weakly independent Meta-pipe path. That gives ≈ 1 − (0.62 × 0.65) ≈ 0.60 that at least one joins, gated by good-enough plumbing ~0.31 → ~0.185. Members bracket 15–28. Cross-examination *rejected* crediting a Meta *reshape* here (Reels-TV ad-load is unbuilt). Center ~20%.\n\n**Drivers.** Pinterest owning (not renting) the CTV rail plus a Performance+ closed loop is supply-side control the other three lack (docs 04, 07). First-party data is a scarce, ATT/cookie-durable crown asset, with a retail-media 60%+ off-site margin precedent (doc 01). Clean-room plumbing (AMC, Snowflake, LiveRamp) is maturing enough to make intent/performance extension fundable (doc 02). CTV ad-spend growth (~$33B in 2025 → ~$51B in 2029, claim 1.9) leaves room for multiple audience sellers. And a Meta demand pipe (Advantage+, the Magnite/FreeWheel meetings) could mature toward an Audience-Network-for-CTV franchise (doc 06).\n\n**Conditions.** Independent (non-vendor) lift validates the Pinterest/performance-CTV magnitude; match rates and attribution improve rather than decay; streamer disintermediation stalls, or advertisers prefer neutral cross-streamer reach; and Meta ships a demand product, not just an Instagram-for-TV content surface.\n\n**Signals to watch.** Audited/third-party-verified Pinterest or tvScientific incrementality by 2027–2028; a second platform beyond LinkedIn disclosing durable off-platform CTV revenue; match-rate improvement announcements from clean-room vendors; and a Meta CTV *demand* announcement (not the Reels-content Instagram-for-TV).\n\n**Time horizon:** through 2029.\n\n### Scenario 4: Meta Front-Runs — a shipped Meta CTV product (owned Reels-TV land-grab and/or demand network) reshapes the category\n\n**Probability: 12–18%.** Meta ships a CTV ad product that actually reshapes the category — either monetizing an owned Reels-TV surface as a land-grab, or fielding a scaled Audience-Network-for-CTV demand pipe — and its scale (3.58B Family DAP, a >$50B Reels run-rate, Advantage+ audiences) makes whatever it ships category-defining rather than a me-too pipe.\n\n**How this number was derived.** Decomposition; no market (swept 2026-06-30). P(Meta ships *any* CTV ad product by 2029) ≈ 0.60–0.65 — analysts read it as \"more-likely-than-not by ~2028\" (doc 06), discounted for zero announced product and Meta's LiveRail/owned-inventory DNA; the second path is the fast Instagram-for-TV OS rollout (Fire TV Dec 2025 → Google TV Feb 2026 → Samsung Jun 2026, in ~6 months). Multiply by P(reshapes vs. me-too pipe | ships). Cross-examination *defeated* the discontinuity member's 0.45 (it conflated an owned Reels-TV land-grab with a demand network; the Reels-TV ad-load is unbuilt, and a Magnite/FreeWheel pipe is by construction the workaround shape), yielding a consensus reshape ~0.22–0.25 × ~0.62 ≈ 0.14. The ships-something mass mostly *reinforces* Bifurcation. Center ~15%.\n\n**Drivers.** Instagram-for-TV crossed all three big US CTV OSes in about six months — a distribution land-grab, not a slow burn (doc 06). Meta's core competency is monetizing *owned* impressions in a closed self-serve auction, reproducible on Reels-TV (>$50B Reels run-rate, claim 6.10). The scale of Advantage+ audiences plus 3.58B Family DAP would make any Meta pipe category-defining (claim 6.10). And SSP meetings (Magnite, FreeWheel) have been reported since early 2025 for a secondary demand pipe (claim 6.5).\n\n**Conditions.** Meta ships an actual CTV ad product (owned Reels-TV ad-load and/or Audience Network for CTV) before 2030; the owned surface accumulates real watch-time *or* the demand pipe reaches material, category-shifting spend rather than a contained test; and no antitrust, channel-conflict, or DMA block lands on an owned-CTV ad surface at scale (doc 13).\n\n**Signals to watch.** An ads announcement *inside* Instagram for TV (owned inventory) — currently none; a named Meta \"Audience Network for CTV\" via Magnite or FreeWheel; Reels-TV watch-time disclosures rivaling YouTube or TikTok on connected screens; and Meta CTV referenced in an earnings call as a revenue initiative, not exploration.\n\n**Time horizon:** through 2029; ship/no-ship decisive by 2028.\n\n### Scenario 5: Regulatory Rupture — VPPA/state-privacy/DMA breaks the household-IP plumbing itself\n\n**Probability: 9–15%.** A privacy shock — most plausibly a pro-plaintiff VPPA outcome from Salazar v. Paramount, or a state-AG wave treating IP-as-household-key and ACR matching as opt-out-by-default — collapses match rates below commercial viability and resets the shared identity substrate the entire bridge stands on, not just one platform's plumbing.\n\n**How this number was derived.** Reference-class plus decomposition. Of the \"existential\"-framed ad-tech privacy shocks of the last decade (GDPR, CCPA, cookie deprecation, ATT), about 1 of 4 was a true structural rupture (ATT) → a ~25% base; the rest were absorbed as compliance cost. In-window: SCOTUS granted cert in Salazar v. Paramount (Jan 2026), so a ruling is near-certain (~0.9) × P(pro-plaintiff enough to chill the plumbing) ~0.35 × P(category reset, not survivable friction | adverse) ~0.40–0.45 ≈ 0.13–0.14. The council spread ran from the driver at 8–13 (industry re-plumbed around ATT and cookies) to the contrarian/discontinuity at 12–23 (ATT *is* the rupture that landed). Cross-examination left this leg unmoved; held near the ATT floor. Center ~11%.\n\n**Drivers.** The Salazar v. Paramount VPPA \"consumer\" circuit split is at SCOTUS, cert granted Jan 2026, with $2,500-per-violation exposure (doc 10). Twenty states now treat IP-as-household-key as personal information and clean-room match as opt-outable sharing (doc 10). California's record $2.75M Disney settlement chained CTV recognition to household opt-out (doc 10). And a Texas ACR suit against five TV makers (Dec 2025) plus DMA gatekeeper bars on cross-surface data combination (doc 13) widen the front.\n\n**Conditions.** A pro-plaintiff VPPA outcome *or* a state-AG wave making IP/ACR matching opt-out-by-default at scale; enforcement (not just statute) that collapses match rates below commercial viability; impairment that hits the shared substrate, not just one platform's plumbing; and no federal privacy pre-emption that rescues or standardizes the plumbing.\n\n**Signals to watch.** The Salazar v. Paramount SCOTUS ruling and its \"consumer\" definition (expected 2026–2027); new state ACR/CTV opt-out mandates or settlements beyond the Disney $2.75M; DMA enforcement against gatekeepers (Alphabet, Meta, Amazon, Microsoft/LinkedIn) on cross-surface data; and match-rate degradation reported by clean-room vendors (LiveRamp, AWS AMC).\n\n**Time horizon:** through 2029; the decisive signal is the Salazar ruling window, 2026–2027.\n\n## Base Rates\n\n**Retail-media off-site data-extension precedent (docs 01, 07).** Of roughly five first-party-data holders extending off-platform, about one (Amazon, >$60–70B) built a durable independent business and about four licensed data into others' margins — a ~1/5 (~20%) durable rate per platform. This yields *one* durable slot but does not certify *which*; assigning it to LinkedIn imports rather than tests the corpus premise (a correction from the contrarian, partly conceded). Suggests the modal Bifurcation shape and caps how many platforms can be durable at once.\n\n**Corpus verified 2029 base case (claims 7.7, 11.1).** Streamer and TV-OS graphs reconstruct demographic, behavioral, and intent segments but *not* verified professional identity — so inversion is the outside-view default for four of five platforms, with LinkedIn excepted. Anchors the modal Bifurcation.\n\n**Moat-durability base rate.** A non-substitutable declared-identity advantage (a LinkedIn job title) survives three-plus years of well-capitalized substitution ~55–75% of the time in ad tech (lower once the PMP-deal-ID/CRM-substitution flaw is folded in). LinkedIn-durable is favored but not certain, which caps the over-LinkedIn Full-Inversion leg at ~0.27–0.30.\n\n**Ad-tech regulatory-rupture rate.** Of the \"existential\"-framed ad-tech privacy threats of the last decade (GDPR, CCPA, cookie deprecation, ATT), about 1 in 4 delivered a true structural rupture (ATT); the rest were absorbed as compliance cost. Anchors the ~9–15% regulatory tail near that floor.\n\n**Meta channel-extension ship rate.** Analysts read Meta as \"more-likely-than-not by ~2028\" (doc 06) with zero announced product, so P(ships *some* CTV ad product) ~0.60–0.65, but P(*reshapes* the category | ships) ~0.22–0.25 (Reels-TV ad-load unbuilt; a demand pipe is by construction the workaround shape). Category-reshaping Meta outcome ~0.14–0.15; the ~0.60 ships-something mass mostly *reinforces* the workaround/Bifurcation shape.\n\n**Buy-side revealed preference (claim 12.1, doc 12).** Roughly 36% of 2026 CTV budget *increases* are reallocated *out* of social (escape-from-social, not carriage-of-social), and all three holdcos bought their own identity spine (Omnicom–Acxiom, Publicis–LiveRamp $2.2B, WPP–InfoSum) and exited supply-path tolls. Indicates structural buyer hostility to an added social-data fee.\n\n**Integrated-owner ceiling (doc 09).** YouTube already runs the fully integrated version — identity + DV360 + YouTube Select CTV + its own measurement — at 13.5% of US TV viewing, the ceiling the rented-rail model structurally trails. Caps durable magnitude for renters, LinkedIn included.\n\n**Ex-US absence (claim 13.1).** Zero social-to-CTV bridges operate outside North America as of mid-2026 (GDPR/ePrivacy/DMA gate the crossing), so the category's geographic base is narrow and any US-specific shock has no ex-US business to cushion it.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n|---|---|---|---|---|\n| Polymarket | [Who will acquire TikTok?](https://polymarket.com/event/who-will-acquire-tiktok-559) | All named outcomes <1% Yes | ~$1M (thin) | 2026-06-30 |\n| Polymarket | [TikTok banned in the US before May 2025?](https://polymarket.com/event/tiktok-banned-in-the-us-before-may-2025) | Resolved / not live | $119.7M lifetime | 2026-06-30 |\n\nNo liquid market covers any leg of this forecast. A sweep on 2026-06-30 surfaced only these two TikTok markets — both touch the category's edges, neither prices its outcome. \"Who will acquire TikTok?\" has effectively wound down since the Jan 22, 2026 US JV (Oracle/Silver Lake/MGX) closed, and its named-party prices sit below 1%; the ban market resolved historically. Neither speaks to LinkedIn CTV revenue durability, a Meta CTV ad product, streamer-versus-social audience share, or a VPPA outcome — the four questions that would actually move this distribution. The scenarios therefore rest entirely on reference classes and decomposition, and the single strongest available external update would be a liquid market opening on any one of those legs. Until one does, treat the ranges as council-derived, not market-priced.\n\n## What Would Change My Forecast\n\n1. **A liquid prediction market opening on any leg** — a Meta CTV ad product, LinkedIn CTV revenue, or streamer-versus-social audience share. None exists today (swept 2026-06-30); a market would be the single strongest external update to the whole distribution.\n2. **LinkedIn discloses material, independently-measured CTV revenue** proving a standalone business rather than a feature. This is the pivot between Bifurcation and Near-Total Disintermediation — a disclosure lifts Bifurcation/Durable Multi-Platform; a flat, declining, or discontinued-standalone disclosure lifts Full Inversion.\n3. **A streamer or holdco ships a verified-professional/firmographic CTV graph OR self-serve B2B CRM/ABM-list onboarding.** This is the one event that pulls LinkedIn *into* the disintermediated set and shifts mass from Bifurcation to Full Inversion.\n4. **Meta ships ads *inside* Instagram for TV (owned inventory) OR announces a named \"Audience Network for CTV.\"** The biggest fork for Scenario 4 — a scaled ship raises it sharply; a content-only reaffirmation (Meta caps CTV as a minor add-on through 2027) collapses the reshape leg back into the workaround shape.\n5. **The Salazar v. Paramount SCOTUS ruling (2026–2027) and the pace of state ACR/IP-as-household-key enforcement.** A broad pro-plaintiff \"consumer\" holding inflates the Regulatory Rupture tail; a narrow or defense-favorable holding, or a federal pre-emption statute standardizing/shielding clean-room and IP matching, collapses it.\n6. **Pinterest/tvScientific lift figures replaced by *audited* third-party incrementality** (versus today's fully vendor-reported numbers). Validates or refutes the owned-rail durability underpinning Durable Multi-Platform; a write-down or de-emphasis of tvScientific drops it toward Bifurcation.\n7. **A first live social-to-CTV product *outside* North America** (the UK is the likely first crossing, doc 13). Would signal the category is broadening rather than a US-first artifact, lifting the durable scenarios.\n\n## Open Questions\n\n- Does LinkedIn's non-substitutable professional-identity data moat convert into a *monetizable* durable CTV revenue line, or does the PMP-deal-ID delivery flaw and streamer ABM/CRM onboarding compress it toward a thin licensing fee? This is the live hinge between the top two scenarios and the largest single source of variance.\n- Is the >$500M-or-it-doesn't-count materiality bar the wrong frame entirely? The council ruled it arbitrary; a durable B2B niche may matter strategically without ever posting a headline revenue number.\n- Will any streamer or Amazon actually ship self-serve B2B ABM/CRM-list onboarding at scale, or does the buying-committee/household-mismatch problem keep LinkedIn's segment structurally distinct?\n- Does Meta's owned Reels-TV surface ever carry an ad load, or does it stay a content/engagement play while any monetization comes only through a third-party demand pipe (the workaround shape)?\n- If Salazar goes pro-plaintiff, does the industry \"re-plumb around\" it as it did ATT and cookies, or is this the one that resets the shared IP/household substrate for everyone at once?\n- Does the category ever cross out of North America, or do GDPR/ePrivacy/DMA keep it a US-first artifact with no ex-US business to cushion a US-specific shock?\n\n## Sources\n\n- **Corpus documents 01–13 and Key_Claims.md** — the grounded findings this forecast decomposes, especially claims 1.9, 6.5, 6.10, 7.4, 11.1, 12.1, and 13.1; the 2029 base case (7.7, 11.1); market structure (doc 07); streamer disintermediation (doc 11); buy-
