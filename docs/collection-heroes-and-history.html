/* ── animated reveal on scroll (corpus-visuals) ──────────────────────────────
   Figures and their marks start hidden ONLY after the page JS adds .reveal-armed
   (it skips this under prefers-reduced-motion), so with no-JS or reduced motion
   everything is fully visible by default — motion is purely additive. When a
   figure scrolls into view the observer adds .is-revealed and CSS does the rest.
   The cv-* classes are a shared reveal vocabulary used by BOTH the build-time viz
   charts and hand-authored corpus-fig figures; the per-mark `--d` var staggers
   them. transform-box:fill-box anchors each SVG mark's scale to its own geometry. */
figure.viz, figure.corpus-fig { --cv-ease: cubic-bezier(.25,.1,.25,1); }
.reveal-armed.viz, .reveal-armed.corpus-fig { opacity: 0; transform: translateY(6px);
  transition: opacity .35s var(--cv-ease), transform .35s var(--cv-ease); will-change: opacity, transform; }
.reveal-armed.is-revealed { opacity: 1; transform: none; }

<script id="corpus-data" type="application/json">{"slug": "collection-heroes-and-history", "title": "Heroes & History", "subtitle": "Carlyle's lifelong wager that history is the biography of great men — traced across his three monuments. The Calvinist formation of the prophet, his theory of r", "author": "", "generated": "", "documents": [{"order": 0, "file": "collection-heroes-and-history-0.md", "title": "Thomas Carlyle and His Scottish Calvinist Influences: An Overview", "summary": "The Calvinist Without a Creed", "body": "*From [The Calvinist Without a Creed](carlyle-research.html#ch-0) — chapter 1*\n\n# Thomas Carlyle and His Scottish Calvinist Influences: An Overview\n\n## Bottom Line\n\nThomas Carlyle (1795-1881) is best understood not as a Romantic individualist, a transplanted German idealist, or a Victorian crank, but as **a Scottish Calvinism that has lost its confession and kept its grammar.** Formed in the Burgher Seceder Presbyterianism of the Annandale village of Ecclefechan, in a stonemason's household ruled by the catechism and the family Bible, Carlyle lost the dogmatic content of that faith in his early twenties — and then spent fifty-five years writing books whose every structural element (the prophetic cadence, the providential reading of history, the polemic against Sham, the hero as locus of the divine, the Gospel of Work, the \"Everlasting No / Yea\" conversion arc, the doctrine of Natural Supernaturalism) is a recognizable transposition of a Reformed doctrine or posture into post-confessional idiom. The German turn (Goethe, Fichte, Novalis) did not replace the substrate; it gave Carlyle a non-creedal vocabulary in which to keep saying it.\n\nThis frame makes the whole arc legible. It explains why the early humane Carlyle of *Sartor Resartus* (1833-34), *The French Revolution* (1837), and *Past and Present* (1843) and the late vicious Carlyle of the *Occasional Discourse on the Negro Question* (1849) and *Latter-Day Pamphlets* (1850) are continuous rather than discontinuous: they are one machine, run on the same substrate, under different historical pressures. The same Reformed instinct that produces the moral seriousness of the Gospel of Work in *Past and Present* produces the racial authoritarianism of the *Negro Question* when its Christian-humane checks are dropped. Insulating the early from the late is not an act of charity to Carlyle; it is a refusal to read him.\n\nIn 2026 Carlyle is more contested than at any time since the 1930s — partly because he is again *useful*. A reactionary right anchored by Curtis Yarvin (writing as \"Mencius Moldbug\" from 2008) has named him a master, and the Yarvin reading has reached high enough into U.S. politics through J. D. Vance to make Carlyle's name newsworthy in a way it had not been for sixty years. A scholarly recovery, anchored in the Duke-Edinburgh *Collected Letters* (completed 2023) and the Strouse Edition of the *Writings* (completing September 2026), has built the substrate reading (Jessop, 1997; Vanden Bossche, 1991; Sorensen, Kinser, Morrow) into the most generative interpretive frame currently available. These two motions are happening at different latitudes — the scholarly motion is slow and internal, the political motion is fast and external — and they will probably continue to coexist through the forecast horizon. The modal forecast for Carlyle through 2035 is **Quiet Recovery under Politically Toxic Conditions** (~45%): editorial completion enables the next monograph wave, the substrate frame gains ground in *Carlyle Studies Annual* and at NAVSA, undergraduate teaching remains pinched by the *Occasional Discourse* problem, and the Yarvin-Vance overhang keeps the public reception charged.\n\n## In Brief\n\n- **Origins:** Carlyle was raised in the Burgher Seceder congregation of Ecclefechan under the stonemason patriarch James Carlyle and the pious Margaret Aitken. Educated at Annan Academy and the University of Edinburgh (matriculated November 1809, age 13), trained for the Burgher Seceder ministry, he lost the dogma sometime between 1817 and 1822 in a slow attritional crisis that *Sartor Resartus* would later compress into the famous \"Everlasting No / Centre of Indifference / Everlasting Yea\" conversion sequence. The actual psychological resolution happened gradually through the Hoddam Hill year (1825-26). The Calvinist substrate carried forward intact.\n\n- **Modern arc:** Marriage to Jane Welsh in October 1826. Productive isolation at Craigenputtock (1828-34), where the foundational essays (\"Signs of the Times,\" 1829; \"Characteristics,\" 1831) and *Sartor Resartus* (1833-34) were written. Move to London (5 Cheyne Row, Chelsea) in 1834. *The French Revolution* (1837) established the prose style; the lectures (1837-40) and *On Heroes* (1841) established the public sage. *Past and Present* (1843) launched the British anti-industrial tradition. The dark turn from *Negro Question* (1849) and *Latter-Day Pamphlets* (1850) broke many of his friendships (most importantly with Mill) and inaugurated the long late phase: *Cromwell* (1845), the thirteen-year *Frederick* labor (1858-65), Jane's death in 1866, the *Reminiscences*, *Shooting Niagara* (1867), the Eyre defense, the late honors. Death February 5, 1881.\n\n- **Today:** Carlyle Studies in 2026 is small, well-defined, and internationally distributed. Two completed editorial projects — the *Collected Letters* (50 vols., 1970-2023, with the open-access *Carlyle Letters Online* now hosted at Western Carolina University) and the Strouse Edition of the *Writings* (UC Press, completing September 2026 with *Latter-Day Pamphlets I-II*) — anchor the field. *Carlyle Studies Annual*, edited by David R. Sorensen and Brent E. Kinser, is the journal of record. The scholarly community is perhaps a dozen scholars whose primary research identity is Carlyle (Sorensen, Kinser, Jessop, Vanden Bossche, Morrow, Ulrich, others). Undergraduate teaching has shrunk to anthology
