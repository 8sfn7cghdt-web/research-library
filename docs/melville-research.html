of Hawthorne's letters and for the \"May 1851\" dating discrepancy).\n\n[20] Library of America. \"Herman Melville and Nathaniel Hawthorne first meet 160 years ago.\" Reader's Almanac blog, 11 August 2010 (quoting Duyckinck to his wife via Leyda, *The Melville Log*, and Sophia Hawthorne to her mother). https://blog.loa.org/2010/08/herman-melville-and-nathaniel-hawthorne.html (accessed 2026-10-24). Tier 5.\n\n[21] Melville, Herman. *Moby-Dick; or, The Whale* (1851). Project Gutenberg eBook 2701. https://www.gutenberg.org/cache/epub/2701/pg2701.txt (accessed 2026-10-24). Tier 1 (chapters 36, 47, 113 and Stubb's soliloquy).\n\n[22] Billson correspondence: Gilder Lehrman Institute record of Melville to James Billson, 20 December 1885, via Adam Matthew Digital (https://www.americanhistory.amdigital.co.uk/Documents/Details/Herman-Melville-to-James-Billson-thanking-him-a-two-volumes-of-the-poet-James-Thomson/GLC05260; described in search summary only, page body not displayed); and Christie's, \"The Herman Melville Collection of William S. Reese,\" lot description of Melville to James Billson, 7 April 1888, citing Horth, *Correspondence*, 511-512. https://onlineonly.christies.com.cn/s/herman-melville-collection-william-s-reese/james-billson-658/158056 (accessed 2026-10-24). Tier 5 (dealer description; the 1885 item second-hand).\n\n[23] Ohio State University Press. *The Centenary Edition of the Works of Nathaniel Hawthorne*, catalogue listing of vol. XXI, *The English Notebooks, 1853-1856*, and vol. XXII, *The English Notebooks, 1856-1860*. https://ohiostatepress.org/books/BookPages/HawthorneCentenary.htm (accessed 2026-10-24). Tier 2 (publisher listing; volumes not consulted).\n\n[24] Melville, Herman. Letter to Evert A. Duyckinck, 3 March 1849 (on Emerson), as transcribed in Murray, Jay Innis, \"Herman Melville's Opinion of Ralph Waldo Emerson,\" *Talking Big*, 28 September 2022. https://thevisionarycompany.net/2022/09/28/herman-melvilles-opinion-of-ralph-waldo-emerson/ (accessed 2026-10-24). Tier 6 (blog transcription; verify against Horth, *Correspondence*).\n\n[25] Kring, Walter D. *Herman Melville's Religious Journey*. Raleigh, N.C.: Pentland Press, 1997. Known only from library-catalogue and review-summary descriptions surfaced in search (e.g., https://catalog.lib.kyushu-u.ac.jp/ja/recordID/1001439202; accessed 2026-10-24). Tier 2 (book not read; claims about All Souls membership are second-hand and unverified here)."}, {"order": 8, "file": "08_The_Doctrine_Of_Providence_Melvilles_Inheritance.md", "title": "Providence as a Doctrine, and What Melville Inherited of It", "summary": "", "body": "# Providence as a Doctrine, and What Melville Inherited of It\n\n> ## Bottom Line\n>\n> \"Providence\" names a specific claim, not a mood: that God not only made the world but continually upholds and governs every event in it, down to the sparrow's fall, for ends he has chosen. The Reformed tradition into which Melville was baptized pressed that claim harder than any other Western church, and by insisting that nothing happens \"by chance\" it made the problem of evil unavoidable, which the Enlightenment's theodicies then tried and largely failed to solve. What Melville demonstrably used is narrower than what he shares: the evidence is strongest for the Calvinist vocabulary of depravity and foreordination (his own 1850 words), the whaleman's chapel and its piety (he sat in the pew), Bayle's skeptical *Dictionary* (he bought it in 1849), and the language of Fate and Providence that runs through the novel's own text. For Edwards, Channing, Leibniz, Pope and Voltaire the record shows common ground, not reading.\n\n## What the Word Means, and Why It Is Harder Than It Looks\n\nProvidence, from the Latin *providentia*, \"foresight,\" is the doctrine that God exercises continuing, purposive governance over the world he created. Three claims are bundled in it, and the later quarrels are quarrels over which of the three to loosen. The first is the claim of scope: God's governance extends to everything, not merely to the large patterns of history or the regular operations of nature. The second is the claim of purpose: that governance aims at ends, and the ends are good. The third is the claim of efficacy: what God intends happens. Loosen the first and you have deism, a God who winds the clock and leaves. Loosen the second and you have fate, a governance that is real but indifferent or hostile, which is precisely the possibility Ahab entertains and Ishmael declines to settle. Loosen the third and you have a God who hopes, persuades and sometimes fails, a position the antebellum churches mostly found unthinkable and the twentieth-century process theologians found congenial.\n\nThe doctrine is therefore a trap as well as a comfort. Its comfort is stated with unmatched economy in the Heidelberg Catechism, which asks what is meant by providence and answers that it is God's \"almighty and everywhere present power\" by which \"he upholds and governs\" heaven, earth and all creatures, so that \"herbs and grass, rain and drought\" and \"all things come, not by chance, but be his fatherly hand\" [1]. The trap is the same sentence read from the other side. If drought, sickness and poverty come by a fatherly hand, then the father's hand is on the drowning sailor as surely as on the fruitful year, and the theologian has to say why. Everything in this chapter is a history of attempts to hold the comfort while escaping the trap. The question that governs the whole inquiry about Melville, whether *Moby-Dick* affirms, denies or merely stages providence, cannot be posed responsibly until the doctrine's own structure is clear, because Melville's characters repeatedly take its vocabulary (Fate, Providence, foreordination, free will, necessity) and bend it. A reader who does not know what the doctrine claimed cannot see what the bending costs.\n\nA word on method. The doctrines below are presented from primary texts fetched in the course of this research: Calvin's *Institutes* in the Beveridge translation hosted by the Christian Classics Ethereal Library, the Westminster Confession and Heidelberg Catechism as posted by Reformed bodies and CCEL, the Canons of Dort as published by the Christian Reformed Church, Aquinas in the Dominican Fathers' translation, Pope and Voltaire from Project Gutenberg, and Emerson and Lincoln from Wikisource and Yale's Avalon Project. Where I could not read a primary text (this applies to Edwards's treatise and Channing's sermon) I say so and rely on identified secondary descriptions or on general scholarly knowledge, labeled as such. Quotations are short and verbatim from what was actually retrieved.\n\n## The Patristic and Scholastic Core: Augustine and Aquinas\n\nAugustine did not write a treatise on providence as such, but the structure Western Christians inherited comes from him, and one sentence in his *Enchiridion* does the work of a thesis: God \"judged it better to bring good out of evil, than not to permit any evil to exist\" [2]. The sentence concedes what the pagans and the Manichees had charged, that evil is real and in the world, and then claims that its presence falls within a governance that turns it to good. This is the doctrine of *permission* (God permits evil, he does not author it), and it is the first of the tools the tradition would use to keep the second claim, goodness, intact against the third, efficacy. It has a price. A God who permits what he could prevent has chosen the evil for the sake of a good that the sufferer may never see, and every later theodicy is a refinement of that bargain. Augustine also supplied the anti-Manichean point that evil has no independent being, being a privation of good. That mattered later because Manichean dualism, the doctrine of a co-eternal evil principle, remained the standard heresy-name for any suspicion that the world's maker is not simply good, and Melville's critics reach for it constantly (see the discussion of Bayle below).\n\nAquinas gives the doctrine its scholastic precision. In the *Summa Theologiae*, First Part, question 22, he argues that \"it is necessary to attribute providence to God,\" because \"the type of the order of things towards their end should pre-exist in the divine mind,\" and that \"all things, inasmuch as they participate in existence, must likewise be subject to divine providence\" [3]. His crucial refinement is that divine providence does not abolish secondary causes: according to the same question, \"divine providence imposes necessity upon some things; not upon all, as some formerly believed\" [3]. A contingent event (the fall of a dice, the choice of a free agent) can be genuinely contingent in the order of secondary causes while falling within God's foreknowing plan. The same fetched page of the *Summa* states that the \"causality of God, Who is the first agent, extends to all being\" and that human providence is \"included under the providence of God, as a particular under a universal cause\" [3]. The Thomist solution to the trap is therefore a distinction of levels: the creature acts freely and contingently; God wills that it do so. Critics from Calvin's day to Ahab's have found the distinction either profound or evasive, and the dispute is the oldest in this chapter. By my own reading, no one has refuted the distinction on logical grounds, and the felt objection to it is existential: the sailor in the water is unconsoled by being told that his drowning was contingent at the level of secondary causes.\n\n## Calvin: Providence Without Fortune\n\nJohn Calvin takes the doctrine out of the schools and makes it the pivot of Christian life. In Book One of the *Institutes* three consecutive chapters concern it (the CCEL edition files them under the numbers iii.xvii to iii.xix, which sometimes confuses citation). The sixteenth, titled in the Beveridge translation \"The World, Created by God, Still Cherished and Protected by Him,\" is the doctrine's charter [4]. Its polemic is against two enemies, the Epicureans and the pagan believers in fortune. \"Fortune and Chance are heathen terms,\" Calvin writes, and he says that \"carnal sense\" will attribute prosperous and adverse occurrences alike to fortune [4]. The positive thesis is that God \"holds the helms and overrules all events\" [4]. The sentence in which Calvin names the distinction later theologians would call \"general\" versus \"special\" providence is worth reading closely. He rejects the view, which he says its proponents \"call universal,\" that God sustains the general order of nature while leaving particular events to run themselves; he demands instead \"a special providence sustaining, cherishing, superintending, all the things which he has made\" [4]. The terminology is easy to confuse. In the Reformed tradition \"general providence\" came to mean God's governance of the whole creation, and \"special providence\" his particular care of particular events and, above all, of the elect; but Calvin's own polemical point in the sixteenth chapter is that the \"universal\" providence of his opponents (a mere upholding of the system) is inadequate and the *special* one (a guiding of every particular) is the true doctrine. A careful reader of nineteenth-century sermons must keep both usages in view, since a preacher who says \"a special providence\" may mean either Calvin's thoroughgoing governance or the later sense of a particular intervention in answer to prayer.\n\nThe seventeenth chapter, \"Use to Be Made of the Doctrine of Providence,\" makes explicit that the doctrine is to be lived, not merely believed: the Christian will \"ascribe entirely to God\" whatever turns out prosperous, and in adversity will take the posture of Job, \"The Lord gave, and the Lord has taken away; blessed be the name of the Lord\" [5]. Calvin also insists that the doctrine does not excuse wrongdoing: God's secret decree is not the rule of duty, and in the chapter's own words, if God \"did not will it, we could not do it,\" but that does not make us obedient when we sin [5]. The eighteenth chapter, \"The Instrumentality of the Wicked Employed by God, While He Continues Free from Every Taint,\" is where the trap is confronted directly. Calvin affirms that \"God holds the helm, and makes all their efforts contribute to the execution of his Judgments,\" while the wicked \"are not excusable as if they were obeying his precept, which of set purpose they violate according to their lust\" [6]. This is Aquinas's two-level scheme rendered in an harsher key. God wills the event; the sinner wills the sin; the sin is the sinner's alone.\n\nTwo consequences of Calvin's treatment matter for Melville. First, Calvin made providence *asymmetric in tone*. In the Heidelberg Catechism, whose second answer about providence asks what advantage there is in knowing it, the benefit named is \"that we may be patient in adversity; thankful in prosperity; and that in all things which may hereafter befall us, we place our firm trust in our faithful God and Father\" [1]. The doctrine's pastoral purpose is trust. A reader who feels only its menace has inverted it, and the reversal is exactly what Ahab performs (the sibling chapters on Ahab and on Ishmael take this up). Second, Calvin's God of the particular is, for any given sufferer, impossible to distinguish from the God of malice, unless the sufferer already trusts him. T. Walter Herbert, in a much-cited 1969 article in *PMLA*, argues that Melville drew on precisely this vulnerability: that Calvin used the biblical King Ahab as his example of the reprobate, \"those predestinately damned,\" stressing the king's victimization by Satan and his madness as signs of reprobation, and that Melville fused this with an anti-Calvinist tradition caricaturing Calvin's God as a brutal monster [7]. I could read only the abstract and reference list, so I treat Herbert's thesis as a serious, published interpretation, not as an established fact; I note that the abstract itself says Herbert cites a contemporary anti-Calvinist polemic (R. S. Foster's *Objections to Calvinism*, 1849) as an example of the caricature without claiming Melville read it [7].\n\n## The Confessions: Westminster, Heidelberg, Dort\n\nCalvin's thought was codified in confessions, and it is the confessions, not the *Institutes*, that most Americans in Melville's world would have met, whether in catechism class or in the reaction against it. The Westminster Confession, produced by the Westminster Assembly in the 1640s for the English and Scottish churches and the standard of American Presbyterians, opens its treatment of the decrees with the sentence that God \"from all eternity, did … freely, and unchangeably ordain whatsoever comes to pass\" (chapter 3, section 1) [8]. The page I fetched did not state the assembly's date; the 1640s dating is general scholarly knowledge. It is the strongest statement of foreordination in the standards, and the confession immediately hedges it with what is called compatibilism: the rest of the section adds that God is not the author of sin and that liberty and the contingency of second causes are not taken away. Section 3 states the doctrine most Americans found hardest, that \"by the decree of God, for the manifestation of his glory, some men and angels are predestinated unto everlasting life,\" and section 7 adds that the rest of mankind God was pleased \"to pass by; and to ordain them to dishonor and wrath for their sin\" [8]. Chapter 5, \"Of Providence,\" states the corresponding doctrine of governance in words that make the Epicurean reading impossible: God \"doth uphold, direct, dispose, and govern all creatures, actions, and things\" (5.1) [8]. Section 4 adds that \"the almighty power, unsearchable wisdom, and infinite goodness of God so far manifest themselves in his providence\" that it extends even to the first fall and to all other sins of angels and men [8], and section 5 observes that \"the most wise, righteous, and gracious God doth oftentimes leave, for a season, his own children to manifold temptations\" [8]. The phrase \"unsearchable wisdom\" is the confession's own concession that the ends of providence are not available to its subjects, a concession Ahab refuses and Ishmael, in some moods, accepts.\n\nThe Heidelberg Catechism (1563) is the church's tenderer face, and it is the standard of the Dutch Reformed churches, including the Albany congregation in which Melville's mother, Maria Gansevoort, was raised and and, according to reference works that surfaced in search (not independently verified here), Melville was baptized at home by a minister of the South Reformed Dutch Church. Maria's Calvinism is attested by Elizabeth Hardwick's essay in the *New York Review of Books*, which draws mainly on Hershel Parker's biography and says that Maria's Dutch Reformed Calvinism, with the family's losses, helped shape Melville's sense of life's ambiguity and chaos [9]; her husband Allan's father's Unitarianism and Allan's own religious leanings, mentioned in a standard encyclopedic account, were not confirmed by any Tier 1 or 2 source I could fetch, and I therefore treat the \"Calvinist mother, Unitarian father\" shorthand as widely repeated but, in the specifics of Allan's belief, not independently verified here. What is not in doubt is the content of the Catechism's providence answers quoted above: Question 27 defines providence as God's upholding hand (nothing \"by chance\"), and Question 28 draws the lesson of patience in adversity and thankfulness in prosperity [1]. Anyone raised on that catechism learned the doctrine as a child's comfort first and as a philosopher's puzzle only later. This is why the Calvinist elements in Melville's work read, in the best criticism, as a childhood idiom he could neither believe nor shed, a point Hawthorne would put with some force in 1856.\n\nThe Synod of Dort (1618-19) is the fixed point of Reformed orthodoxy and the origin of the popular \"Five Points.\" It met at Dordrecht in the Netherlands as a national synod of the Dutch Reformed churches with foreign delegates, to settle the dispute with Arminius's followers, who had issued their five-article Remonstrance in 1610; the Canons respond to those five articles, and, because the third and fourth points are combined, they appear under four heads: divine election and reprobation; Christ's death and human redemption through it; human corruption and conversion; and the perseverance of the saints, each with a positive exposition and a \"Rejection of Errors\" [10]. The acronym TULIP (total depravity, unconditional election, limited atonement, irresistible grace, perseverance of the saints) is a later English-language mnemonic, not a Dort formula, a point worth stating because the antebellum disputes were often conducted in its terms without anyone knowing its provenance; the claim that it is later is general historical knowledge and I did not source it from a fetched page. On election the Canons say that the fact \"that some receive from God the gift of faith within time, and that others do not, stems from his eternal decree\" (I.6), and that God chose a definite number in Christ out of fallen humanity \"to demonstrate his mercy, to the praise of the riches of God's glorious grace\" (I.7) [10]. For Melville the relevance is that Dort is the Dutch Reformed church's own foundational text. Whatever he absorbed in the Albany pews and at his mother's knee was Dort-flavored Calvinism, severe on depravity and election, warm on assurance.\n\n## Edwards and the New England Theology\n\nJonathan Edwards (1703-58) is the great American intellect of the doctrine, and his *Freedom of the Will* (1754) is its most rigorous defense. I was unable to retrieve the body text of the treatise; what I could verify is its structure as shown on CCEL: Part I defines terms, and Part II examines \"that wherein Arminians place the essence of the liberty of all moral agents\" [11]. The argument, which I give here from general scholarly knowledge and not from the retrieved page, is that the will is always determined by the strongest motive, that there is no liberty of indifference of the kind the Arminians require, and that the real distinction is between *natural* necessity and inability (which excuse) and *moral* necessity and inability (which do not, because they consist in the heart's own disposition). The result is a compatibilism more rigorous than the Westminster divines' sketch: a person is free when she does what she wills, and she wills what her character determines, and her character was set by God. Its consequences for moral responsibility were the scandal of the age.\n\nWhat matters for this inquiry is not Edwards's reasoning but its afterlife. The \"New England theology\" that grew from Edwards through Samuel Hopkins, Nathanael Emmons and later Nathaniel William Taylor was a continuing effort to hold the Edwardsian line while softening its apparent fatalism, and by the 1830s and 1840s the debate between \"Old School\" and \"New School\" Presbyterians and Congregationalists over free will and ability was the central theological contest of Protestant America. I mention this as the historical background that framed the preaching Melville would have heard; the identification of the particular schools is general scholarly knowledge (I did not fetch a source for it), and I did not find any evidence that Melville read Edwards. The honest statement is that Melville's America was Edwards's America, in which the question \"is the will free?\" was the question a sermon on Jonah, like Father Mapple's, would be expected to answer, and that Moby-Dick's Chapter 47 on the Mat-Maker, where \"the straight warp of necessity\" meets \"free will still free to ply her shuttle between given threads\" [12], is a restatement in a weaver's metaphor of the compatibilist structure Edwards defended. Whether Melville knew Edwards is not the point; whether he knew the structure is, and the structure was in the air.\n\n## The Unitarian Revolt: Channing and the Moral Argument\n\nThe reaction against Edwardsian Calvinism is the single most important fact about the New England religious world of Melville's youth. William Ellery Channing's sermon \"Unitarian Christianity,\" delivered at the ordination of Jared Sparks in Baltimore on May 5, 1819, is conventionally the manifesto. I could not retrieve the sermon's text; the search surfaced only secondary descriptions, which agree that the sermon rejected the Trinity, held a high view of human goodness, subjected theological ideas to reason's scrutiny, and set Unitarianism against Calvinist predestination and depravity, with a later piece, \"The Moral Argument against Calvinism\" (1820), extending the critique [13]. Channing's central move is philosophical and I can state it from general knowledge: if God's moral character is the standard by which we call anything good, then a doctrine that makes God the foreordainer of damnation is not a mystery to be believed but a slander to be refused. This is the \"moral argument,\" and its force is that it turns providence's own premise (God is good) against the Calvinist reading of providence's own scope. The Unitarians kept providence and rejected predestination: God governs benevolently for the improvement of souls, and human freedom is real because moral perfection requires it.\n\nThe Unitarian departure matters to Melville's biography because his father, Allan, belonged to the liberal religious world of Boston and New York, and the family shuttled between Dutch Reformed and Unitarian churches during Melville's youth. I could find only encyclopedic statements of this (Tier 5 or below), and none of the Tier 1 or 2 sources I could fetch confirmed the details, so the family's Unitarian strand is carried here as probable, not established. It is a further and distinct point, and a solid one, that the ordinary educated New Englander of Melville's decade had to choose between a providence of rigorous foreordination and a providence of moral improvement, and that Melville's work shows suspicion of both. The Unitarian God of benevolent order reappears in the novel as the comfortable optimist Ishmael cannot quite trust; the Calvinist God of the decree reappears as the force Ahab hates.\n\n## Emerson: Providence Naturalized\n\nEmerson, the Unitarian pastor who left the pulpit, did not so much reject providence as turn it into a law of nature and mind, and in doing so he supplied the intellectual climate in which a Melville could take the vocabulary seriously and refuse its consolations. A correction to the brief is in order here. Emerson's \"Compensation\" belongs to the *Essays* of 1841, later renamed the First Series, and not to the Second Series of 1844; the Project Gutenberg text I fetched confirmed that \"Compensation\" appears in the First Series, and the essay titled \"Fate\" belongs to *The Conduct of Life* (1860), which I confirmed from the Wikisource text of that volume [14][15]. The Second Series (1844) contains, among others, \"Experience,\" which I did fetch.\n\n\"Compensation\" is the essay in which Emerson's doctrine is most cleanly stated. It sets itself against the preacher's version of providence, in which, as Emerson reports, the sermon \"assumed, that judgment is not executed in this world; that the wicked are successful; that the good are miserable,\" and in its place puts an immanent law: \"That soul, which within us is a sentiment, outside of us is a law,\" and \"The dice of God are always loaded\" [14]. The word \"Providence\" appears in the essay twice in the Wikisource text I read, once when \"a man dogmatize[s] in a mixed company on Providence and the divine laws\" and is \"answered by a silence,\" and once in a quotation from Augustine about \"an unwearied Providence\" sprinkling \"certain penal blindnesses upon such as have unbridled desires\" [14]. The point of both is that providence, in Emerson, is not a supervising person but the structure of moral consequence: every act carries its price within itself. This is a providence without a hand, and for Emerson's readers it dissolved the trap by dissolving the God who set it.\n\n\"Experience\" (1844) is the necessary corrective, since it records what happened to this confidence when Emerson's son Waldo died in 1842. The essay's best-known sentence is this: \"The only thing grief has taught me, is to know how shallow it is\" [16]. It asks, \"Where do we find ourselves?\" and answers that we are in a series whose ends we cannot see [16]. The word \"Providence\" never appears in the essay; the text I read substitutes \"the great Fortune,\" which Emerson says he worships with wonder [16]. I take this as the pivot from the consoling doctrine of \"Compensation\" to the harder acceptance of \"Fate,\" which Emerson published in 1860. There the essayist writes that \"the way of Providence is a little rude,\" that \"Fate is unpenetrated causes,\" and that \"Life is freedom, — life in the direct ratio of its amount,\" and ends by proposing, \"Let us build altars to the Beautiful Necessity\" [17]. Emerson's trajectory is therefore a move from a moral-law providence, through a grief-struck experience of opacity, to a fated universe that is still, by his lights, beautiful. This is the trajectory Melville's reader expects of an American of that generation, and it is a trajectory Melville himself did not follow, because he could not call necessity beautiful. Whether Melville was reacting to Emerson directly is a matter for the sibling chapter on the career; here I note only that the two were contemporaries working with the same inherited terms, and that the one thing the record establishes for Melville and Emerson is that they met the same questions with different temperaments. (That Melville heard Emerson lecture in 1849 is, I believe, in the standard biographies; I did not retrieve a source for it, and do not rely on it.)\n\n## The Quaker Strand and the Whaleman's Chapel\n\nThe whaling world into which Melville stepped in December 1840 had its own providential culture, and it was not Presbyterian. Nantucket, whose captains and mates crew the *Pequod*, was settled in the seventeenth century by English colonists and became, by the early eighteenth, a substantial Quaker community; an encyclopedia entry on Mary Coffyn Starbuck confirms that several Quaker missionaries arrived between 1698 and 1704, and that by 1710 the island had a substantial Quaker presence [18]. I did not find a primary source (such as Alexander Starbuck's *History of Nantucket*) that I could fetch on how Quaker belief shaped the whaling trade itself, so the claim that Nantucket whaling was suffused with Quaker providence is one I carry as plausible background and as something the novel itself asserts, not as a documented historical finding of this research.\n\nThe Quaker view of providence is distinct from the Reformed and is best described by contrast: where the Calvinist reads the hand of God in every event as a sign of a decree, the Quaker emphasis on the Inner Light locates the divine in direct, individual guidance, and on the whole avoids elaborate doctrines of decree. This is general knowledge, not a fetched source. The novel's treatment is concrete. Bildad, the pious part-owner of the *Pequod* (a Nantucket Quaker, by my reading of the novel's earlier chapters, which I did not re-fetch), tells the departing crew in Chapter 22, \"God bless ye, and have ye in His holy keeping, men,\" and warns them, \"Don't whale it too much a' Lord's days, men; but don't miss a fair chance either, that's rejecting Heaven's good gifts\" [12]. The second sentence is a precise comic compression of mercantile providentialism: a fair chance at a whale is a gift of Heaven, so refusing it on the Sabbath is a sin. In Chapter 20 Charity, Bildad's sister, is called \"this excellent hearted Quakeress,\" and Bildad has Charity place \"a small choice copy of Watts\" in each seaman's berth [12]. The Quaker strand in the novel is therefore comedic and loving by turns, and it never gets a theodicy; it gets a ledger.\n\nThe other piece of whaleman's piety is the chapel itself. The New Bedford Port Society for the Moral Improvement of Seamen was organized in 1830, built its Seamen's Bethel as a nondenominational church dedicated in 1832, and Melville, arriving in late December 1840, attended its services before sailing on January 3, 1841; the National Park Service marks the pew he sat in [19]. The cenotaphs, memorial tablets for whalemen lost or buried at sea, were placed by families with no grave to visit, and their inscriptions record drowning, falls from aloft, shark bites and disease [19]. The prow-shaped pulpit of the novel is Melville's invention; the NPS page records that the pulpit was not prow-shaped when he visited and that the prow-shaped mock-up dates only to 1961 [19]. In Chapter 7, Ishmael reads the tablets and reflects, \"Faith, like a jackal, feeds among the tombs\" [12]. That sentence is the most compact statement in the novel of the psychology of providence: faith as a scavenger on mortality, which is neither a refutation of faith nor a flattering account of it. By my own reading, the line is deliberately two-edged, since a jackal that feeds among tombs is both parasitic and a legitimate member of an ecology of grief.\n\nThe identity of the model for Father Mapple is, by consensus of the reference works that surfaced in search, the Boston Seamen's Bethel preacher Edward Thompson Taylor (pastor from 1829 until his death in 1871), with the New Bedford minister Enoch Mudge a plausible second influence from Melville's 1840 stay; the sources agree that Taylor is the usual primary model and hedge on Mudge, and I read these in search summaries, not in full, so the attribution should be treated as defensible but not demonstrated [20]. What the text itself establishes is more than enough for present purposes. In Chapter 9, \"The Sermon,\" Mapple takes Jonah as his text and preaches, in Ishmael's report, \"Woe to him who seeks to please rather than to appal!\" and \"Delight is to him, who acknowledges no law or lord, but the Lord his God\"; he praises one \"not clamorous for pardon, but grateful for punishment,\" and counsels, \"Sin not; but if you do, take heed to repent of it like Jonah\" [12]. The sermon's closing note (\"God has laid but one hand upon you; both his hands press upon me\") belongs to the preacher's turn to the faithful servant's lonely burden [12]. The point to register here is doctrinal: Mapple's God commands, punishes and delights; he is a sovereign, to be obeyed, and the sermon contains no hint of the Catechism's \"fatherly\" tenderness or the Unitarian's benevolent order. It is a Calvinist-sounding sermon in a nondenominational chapel, and it is placed before the voyage as a doctrine to be tested by the voyage. The later chapters of the novel do the testing, and the sibling chapters on the close reading and on the rival theologies of Ahab and Ishmael follow that test.\n\n## Antebellum Providential Rhetoric\n\nAmerican public language in Melville's decades was saturated with providence, and it is a distinct inheritance from the theological one, because it applies the doctrine to nations. The classic instance is John L. O'Sullivan's 1845 editorial \"Annexation,\" in the *United States Magazine and Democratic Review* (vol. 17, July-August 1845, pp. 5-10), which spoke of \"our manifest destiny to overspread the continent allotted by Providence for the free development of our yearly multiplying millions\" [21]. The Teaching American History edition I read adds that the editorial was unsigned and that some scholars attribute it to another writer; the attribution to O'Sullivan is conventional but not certain [21]. The doctrinal move is a nationalization of special providence: God's particular guidance, which Calvin thought discernible only to faith in the course of a believer's life, becomes a public warrant for territorial expansion. Whig providentialism ran along similar lines with different content: the emphasis fell on internal improvement, Protestant moral reform and gradual progress as God's plan, and it was in these years that the language of a \"chosen\" or \"redeemer\" nation took the form that Melville's later work would answer. I have not retrieved a source for Whig providential rhetoric specifically, and offer it as a characterization from general knowledge. Whether Melville himself wrote in this register in his early books, *White-Jacket* above all, is a matter I could not verify in this research (my search returned only general descriptions of that novel), and I leave it to the chapter on his career.\n\nAt the other end of the period stands the most searching providential text in American public life, Lincoln's Second Inaugural, delivered Saturday, March 4, 1865. Lincoln wrote there that \"the Almighty has His own purposes,\" that both sides \"read the same Bible\" and prayed to the same God, and ended the reflection by affirming that \"the judgments of the Lord are true and righteous altogether\" [22]. The address is a sophisticated, Calvinist-shaped answer to the national war: it asserts providence (God governs), denies that either party can claim it (both read the same Bible), and refuses to explain the cost (the Almighty's purposes are his own), while holding to the goodness of the judgments. It is, in the terms of this chapter, a refusal of \"special providence\" as a warrant and an affirmation of \"general providence\" as a mystery, which makes it the nearest American public text to the Westminster Confession's \"unsearchable wisdom.\" It is also, chronologically, the work of a man who lived through the war that Melville would answer in *Battle-Pieces* (1866). Whether Melville read the address, I do not know; I mention it as the high-water mark of the discourse his work stands against.\n\n## The Theodicy Debate: Leibniz, Bayle, Pope, Voltaire\n\nThe Enlightenment answer to the trap was to take the problem of evil, which the confessions treated as a matter of mystery and trust, and to try to solve it by argument. The term \"theodicy\" is Leibniz's, from the title of his 1710 *Theodicy: Essays on the Goodness of God, the Freedom of Man and the Origin of Evil*; the edition I could open is E. M. Huggard's translation of the Gerhardt text, with an editor's introduction by Austin Farrer, which states Leibniz's thesis in the compressed form that God, among all possible creatures, \"chooses the best and creates it\" [23]. I did not locate the exact phrase \"best of all possible worlds\" in the portion I could read, and I therefore cite only what I read. The argument is that a perfectly good, wise and powerful God, choosing among infinitely many possible worlds, would necessarily choose the best, so that this world, whatever its evils, is the best that is compossibly available: the evils are the price of the greatest sum of goods and of a lawful order.\n\nThe tradition's own best skeptic stands behind the Leibnizian project: Pierre Bayle (1647-1706), whose *Historical and Critical Dictionary* (1697, with later editions) argued, in articles such as the one on the Manichees, that reason could not reconcile an all-good, all-powerful God with the world's evils, and that the Manichean hypothesis of two principles fit the phenomena better than orthodoxy did. Bayle's own conclusion was fideist: so much the worse for reason. The detail that matters for Melville is documentary. According to Melville's Marginalia Online, a lost four-volume folio set of Bayle's *Dictionary* (the 1710 London edition) is recorded as owned by Melville, whom a letter to Evert Duyckinck of April 1849 mentions buying it [24]. Millicent Bell's 1951 *PMLA* article \"Pierre Bayle and *Moby-Dick*\" (66.5, pp. 626-648) reports that Melville wrote to Duyckinck, \"I bought a set of Bayle's Dictionary the other day,\" and argues, from textual parallels, that its effects on the novel were pervasive; the fetched page was an extract with footnotes, so I could verify the purchase and the thesis but not the strength of the parallels [25]. Bell's footnotes note that Bayle's chapter on the Manichees stages a debate between Zoroaster and Melissus, and that Melville's reworking of a Bayle passage turns a hypothetical into a claim that certain ancient thinkers actually rejected whale stories [25]. Scholars who have followed Bell disagree about how much Bayle explains; Thomas Vargish's 1966 *PMLA* article \"Gnostic *Mythos* in *Moby-Dick*\" argues that critics lump Zoroastrianism, Manichaeism, Hindu myth and Gnosticism together without discrimination, and proposes that Melville used Gnostic material more specifically than recognized and kept it distinct from Zoroaster [26]. The two papers together warn against the lazy assumption that \"Manichean\" is a single, settled influence.\n\nAlexander Pope's *Essay on Man* (1733-34) is the most widely read English-language theodicy of the eighteenth century, and its famous aim is stated at the end of the opening address, \"But vindicate the ways of God to man,\" with its famous conclusion to the first epistle, \"One truth is clear, whatever is, is right\" [27]. The Gutenberg text confirms that the second line concludes the first epistle and that a similar line recurs in the fourth. Pope's argument is a poetic version of Leibniz's: apparent evil is partial view of a harmonious whole. Voltaire's *Candide* (1759) is the satirical reply, prompted by the Lisbon earthquake of 1755. In the 1918 Boni and Liveright translation I fetched, the Baron's castle is said to be the most magnificent \"in this best of all possible worlds\" (chapter 1), and in chapter 5, \"Tempest, Shipwreck, Earthquake, and what became of Doctor Pangloss, Candide, and James the Anabaptist,\" Pangloss asks, \"What can be the sufficient reason of this phenomenon?\" [28]. The satire works because Pangloss answers every catastrophe in the language of sufficient reason, and the reader watches the formula fail against the facts. The Lisbon earthquake is the Enlightenment's version of the drowned whaleman on the chapel wall.\n\nThe theodicy debate provides the framework in which every later argument about providence in Moby-Dick takes place, because it fixes the options: (1) the world is best and its evils instrumental (Leibniz, Pope); (2) the evils defeat the claim of a good governor, and the world is either indifferent or ruled by a malign or divided power (Bayle's suspended Manichaeism, Candide's disenchantment); (3) the question is beyond reason and answered by trust (Calvin, Bayle's fideism, Job). Melville's novel does not choose a position among these; it dramatizes them in characters. By my own reading, the most precise way of putting the question the book poses is whether Ishmael's tentative, partly ironic trust (option 3) is a form of knowledge or a form of consolation, and whether Ahab's rage (option 2 enacted) is an insight or a pathology. That is the interpretive crux that the scholarship surveyed in the sibling chapters contests.\n\n## The Providential Language of the Novel Itself\n\nBefore sorting the inheritance, it is worth recording, in the novel's own text, the passages that show Melville working with the doctrine's vocabulary, because these are the most secure evidence of use. In Chapter 1, \"Loomings,\" Ishmael says of his decision to go whaling that it \"formed part of the grand programme of Providence that was drawn up a long time ago,\" and describes \"the Fates\" who \"put me down for this shabby part of a whaling voyage,\" and \"this invisible police officer of the Fates, who has the constant surveillance of me\" [12]. The joke is Reformed to the bone: the decree, in a mock-solemn register, includes the narrator's lowly place in it. The passage uses \"Providence\" and \"Fates\" in the same breath, the Christian and the pagan term, which is the lexical hinge of the whole book. Calvin's declaration that \"Fortune and Chance are heathen terms\" [4] stands behind the effect, since Ishmael is quietly doing precisely what Calvin forbade, treating the two vocabularies as interchangeable. In Chapter 17, \"Heaven have mercy on us all—Presbyterians and Pagans alike\" [12] is Ishmael's first named shot at denominational pride, and Chapter 36, where Ahab declares, \"Who's over me? Truth hath no confines,\" and \"That inscrutable thing is chiefly what I hate,\" and then, \"If man will strike, strike through the mask!\" [12], turns the discussion of providence into a defiance of a governor who hides behind appearances. In Chapter 47, the Mat-Maker, Ishmael describes \"the straight warp of necessity, not to be swerved from its ultimate course,\" with \"free will still free to ply her shuttle between given threads\" [12], which is the Thomist-Edwardsian structure of divine necessity and creaturely freedom in a handicraft image, and, at the close, in Chapter 132, Ahab's question, \"Is it I, God, or who, that lifts this arm?\" and in Chapter 135, \"Fool! I am the Fates' lieutenant; I act under orders\" [12]. The last of these is the doctrine of providence in its most dangerous form, the reprobate who claims his act is decreed and therefore not his, which is the very evasion Calvin ruled out in his eighteenth chapter when he insisted that the wicked \"are not excusable as if they were obeying his precept\" [6]. These close-reading points belong to the sibling chapters; I record them here because they show that Ahab's last claim is a misuse of the doctrine's own distinction between decree and responsibility, and that the doctrine is thus available to the reader as a measuring instrument.\n\n## What Melville Demonstrably Used, and What He Merely Shares\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 536\" role=\"img\" aria-label=\"Four tablets, stacked like the memorial marbles of the Whaleman's Chapel, sort Melville's inheritance of the doctrine of providence by grade of evidence. Documented use: Calvinist vocabulary named in Hawthorne and His Mosses, August 1850; Bayle's Dictionary bought in 1849; the Seamen's Bethel attended in December 1840; the November 1851 letter to Hawthorne. Strong textual evidence: the Providence and Fate idiom, the Mat-Maker, the Jonah sermon, Herbert's Calvin thesis. Plausible background: Heidelberg and Dort, Westminster, the Unitarian, Quaker and Father Taylor strands. Merely shared: Augustine, Aquinas, Edwards, Channing, Leibniz, Pope, Voltaire and Emerson, a problem rather than a bibliography.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif\" letter-spacing=\"2\">WHAT HE HANDLED, WHAT HE ONLY SHARED<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">the inheritance of providence, sorted by grade of evidence (ch. 08)<\/text>\n<rect x=\"16\" y=\"66\" width=\"668\" height=\"116\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"16\" y=\"66\" width=\"190\" height=\"116\" rx=\"2\" fill=\"none\" class=\"s-t1\" stroke-width=\"2\"/>\n<text x=\"111\" y=\"94\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-serif\" letter-spacing=\"1\" font-weight=\"bold\">DOCUMENTED USE<\/text>\n<text x=\"111\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">Melville's own word, a<\/text>\n<text x=\"111\" y=\"122\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">receipt, or attendance<\/text>\n<circle cx=\"81\" cy=\"164\" r=\"5\" class=\"f-t1\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"101\" cy=\"164\" r=\"5\" class=\"f-t1\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"121\" cy=\"164\" r=\"5\" class= roke:var(--muted)\"/>\n<circle cx=\"121\" cy=\"262\" r=\"5\" class=\"f-t3\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"141\" cy=\"262\" r=\"5\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<rect x=\"222\" y=\"208\" width=\"198\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t3)\"/>\n<text x=\"321\" y=\"223\" text-anchor=\"middle\" font-size=\"9.5\">Providence / Fate idiom in the text<\/text>\n<rect x=\"428\" y=\"208\" width=\"182\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t3)\"/>\n<text x=\"519\" y=\"223\" text-anchor=\"middle\" font-size=\"9.5\">Mat-Maker compatibilism (ch. 47)<\/text>\n<rect x=\"222\" y=\"238\" width=\"182\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t3)\"/>\n<text x=\"313\" y=\"253\" text-anchor=\"middle\" font-size=\"9.5\">Jonah sermon's Reformed severity<\/text>\n<rect x=\"412\" y=\"238\" width=\"218\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t3)\"/>\n<text x=\"521\" y=\"253\" text-anchor=\"middle\" font-size=\"9.5\">Herbert: Calvin's King Ahab (contested)<\/text>\n<rect x=\"16\" y=\"290\" width=\"668\" height=\"116\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"16\" y=\"290\" width=\"190\" height=\"116\" rx=\"2\" fill=\"none\" class=\"s-t2\" stroke-width=\"2\"/>\n<text x=\"111\" y=\"318\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-serif\" letter-spacing=\"1\" font-weight=\"bold\">PLAUSIBLE BACKGROUND<\/text>\n<text x=\"111\" y=\"334\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">in the air, within<\/text>\n<text x=\"111\" y=\"346\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">biographical reach<\/text>\n<circle cx=\"81\" cy=\"388\" r=\"5\" class=\"f-t2\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"101\" cy=\"388\" r=\"5\" class=\"f-t2\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"121\" cy=\"388\" r=\"5\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"141\" cy=\"388\" r=\"5\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<rect x=\"222\" y=\"306\" width=\"274\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t2)\"/>\n<text x=\"359\" y=\"321\" text-anchor=\"middle\" font-size=\"9.5\">Heidelberg Catechism, Dort (Dutch Reformed mother)<\/text>\n<rect x=\"504\" y=\"306\" width=\"131\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t2)\"/>\n<text x=\"570\" y=\"321\" text-anchor=\"middle\" font-size=\"9.5\">Westminster Confession<\/text>\n<rect x=\"222\" y=\"336\" width=\"182\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t2)\"/>\n<text x=\"313\" y=\"351\" text-anchor=\"middle\" font-size=\"9.5\">Unitarian strand (father's side)<\/text>\n<rect x=\"412\" y=\"336\" width=\"141\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t2)\"/>\n<text x=\"483\" y=\"351\" text-anchor=\"middle\" font-size=\"9.5\">Quaker / Nantucket piety<\/text>\n<rect x=\"222\" y=\"366\" width=\"136\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t2)\"/>\n<text x=\"290\" y=\"381\" text-anchor=\"middle\" font-size=\"9.5\">Father Taylor as Mapple<\/text>\n<rect x=\"16\" y=\"416\" width=\"668\" height=\"88\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<rect x=\"16\" y=\"416\" width=\"190\" height=\"88\" rx=\"2\" fill=\"none\" class=\"s-t5\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n<text x=\"111\" y=\"444\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-serif\" letter-spacing=\"1\" font-weight=\"bold\">MERELY SHARES<\/text>\n<text x=\"111\" y=\"460\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">a parallel, no evidence of<\/text>\n<text x=\"111\" y=\"472\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">contact<\/text>\n<circle cx=\"81\" cy=\"486\" r=\"5\" class=\"f-t5\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"101\" cy=\"486\" r=\"5\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"121\" cy=\"486\" r=\"5\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<circle cx=\"141\" cy=\"486\" r=\"5\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--muted)\"/>\n<rect x=\"222\" y=\"432\" width=\"64\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"254\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Augustine<\/text>\n<rect x=\"294\" y=\"432\" width=\"54\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"321\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Aquinas<\/text>\n<rect x=\"356\" y=\"432\" width=\"54\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"383\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Edwards<\/text>\n<rect x=\"418\" y=\"432\" width=\"59\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"448\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Channing<\/text>\n<rect x=\"485\" y=\"432\" width=\"54\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"512\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Leibniz<\/text>\n<rect x=\"547\" y=\"432\" width=\"39\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"566\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Pope<\/text>\n<rect x=\"593\" y=\"432\" width=\"59\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"623\" y=\"447\" text-anchor=\"middle\" font-size=\"9.5\">Voltaire<\/text>\n<rect x=\"222\" y=\"462\" width=\"208\" height=\"22\" rx=\"2\" class=\"f-bg\" stroke-width=\"1.2\" style=\"stroke:var(--t5)\" stroke-dasharray=\"5 4\"/>\n<text x=\"326\" y=\"477\" text-anchor=\"middle\" font-size=\"9.5\">Emerson (overlap, influence unproven)<\/text>\n<text x=\"350\" y=\"520\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">What Melville handled is a vocabulary, a skeptic's dictionary, a chapel and an idiom; what he shares with the theologians is a problem, not a bibliography.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 1.<\/strong> Melville&#8217;s inheritance of providence is a short shelf of documented things and a long wall of parallels. The first tablet holds what he named, bought, attended or wrote; the last holds the great theologians of providence, with no evidence that he read, quoted or owned them. A critic who says a passage &#8220;is&#8221; Calvinist, Leibnizian or Emersonian should be tested against this grade, and only the Calvinist reading sits high on it.<\/figcaption>\n<\/figure>\n\n\nThe distinction the brief asks for can be drawn with reasonable honesty by sorting the inheritance into four grades of evidence: documented use (a statement by Melville or a surviving record of ownership or attendance), strong textual evidence (language in the work that tracks the source closely), plausible background (the source was in the air and Melville's biography put him within reach), and mere sharing (a parallel with no evidence of contact).\n\n**Documented use.** First, the Calvinist vocabulary of depravity: in \"Hawthorne and His Mosses\" (*The Literary World*, August 17 and 24, 1850) Melville wrote that Hawthorne's \"power of blackness\" derives its force \"from its appeals to that Calvinistic sense of Innate Depravity and Original Sin\" [29]. The text I read was an ibiblio transcription of the essay; textual scholarship, noted in a Harvard Houghton Library summary and by editors of the Northwestern-Newberry edition, warns that the standard anthology version follows a manuscript state before Melville's own edits, so the exact wording should be checked against the printing before it is quoted formally. The essential point survives: Melville himself named Calvinism as a cultural force and as a source of artistic power, in the very season he was revising the whaling book. Second, the Bayle purchase: the 1849 letter to Duyckinck and the catalog entry in Melville's Marginalia Online place a four-volume Bayle in Melville's possession in the months before he wrote *Moby-Dick* [24][25]. Third, the whaleman's chapel: Melville attended the Seamen's Bethel in New Bedford in late December 1840, a fact the National Park Service records [19], and Chapters 7 to 9 render a version of it. Fourth, the exchange with Hawthorne: the November 1851 letter, in a transcription that reproduces it as a complete letter though without naming its edition, includes the lines \"Whence come you, Hawthorne? By what right do you drink from my flagon of life?\" and \"I have written a wicked book, and feel spotless as the lamb\" [30]; and Hawthorne's English Notebooks entry of November 20, 1856 (reproduced, with the usual caveat that I did not read the notebook itself, on a blog that credits Charles Olson) says that Melville \"began to reason of Providence and futurity,\" that he \"pretty much made up his mind to be annihilated,\" and that \"he can neither believe, nor be comfortable in his unbelief\" [31]. The 1856 entry is not about *Moby-Dick*, but it is the best contemporary witness to the state of Melville's mind regarding providence five years after the book, and it confirms that Providence and futurity, in Hawthorne's own phrase, were what Melville argued about.\n\n**Strong textual evidence.** The novel's own use of \"Providence,\" \"Fate\" and \"Fates\" in the narration and in Ahab's mouth, the compatibilist structure of the Mat-Maker, the Jonah sermon with its Reformed severity, and the Bildad passages parodying commercial piety are all in the text [12]. That these tracks the doctrine is the strongest kind of evidence available, since it is the work itself, even if it does not prove which specific source Melville used. T. Walter Herbert's argument that Melville used Calvin's treatment of King Ahab as a reprobate, and a popular anti-Calvinist tradition that depicted Calvin's God as a brute, belongs here, as strong but contested; the abstract says so, the article was unavailable to me beyond its abstract and references, and the thesis remains a serious published interpretation, not a settled one [7]. A thesis surfaced in search (a Harvard document by an author I could not identify, whose full text I could not retrieve) quotes the critic Werge as cautioning that Melville does not become a Calvinist but \"reluctantly acknowledges and sympathizes with\" Calvinist emphases; I report that as a second-hand characterization of a position in the scholarship, not as a verified quotation [32].\n\n**Plausible background.** The Dutch Reformed catechetical inheritance (Heidelberg, Dort) is plausible on biographical grounds, because Melville was baptized by a minister of the South Reformed Dutch Church and raised by a mother steeped in that church's Calvinism, as Hardwick's essay summarizing Parker records [9]; but the documentary record for what he read, memorized or heard in church is thin, and I have found no passage in which Melville names the Heidelberg Catechism or Dort. The same holds for the Westminster Confession. The Unitarian strand is also plausible on biographical grounds. The Quaker and Nantucket strand is plausible, but my research found no primary source on how Melville learned about Nantucket piety, and the novel's Quaker portraits, I suspect, owe as much to what he heard from Nantucket whalemen and to his own observation as to any reading. The Father Taylor connection is a defensible attribution and nothing more [20].\n\n**Merely shares.** For Augustine, Aquinas, Edwards, Channing, Leibniz, Pope and Voltaire I found no evidence that Melville read them, quoted them, or owned them; the Marginalia site's search page lists neither Pope, Voltaire, Milton nor Calvin among the items I could confirm in my reading of it, and that absence is weak evidence (the site's catalog is incomplete and the search page is not a full index) [24]. They stand in this chapter as the shape of the problem he inherited. Melville's relation to them is the relation of a writer to a debate rather than to a library: he is not borrowing Leibniz's argument but working in a culture whose public language had been formed by it. The same is true of Emerson. The two overlapped in the same period and used the same terms, and the evidence of influence in either direction, which the sibling chapters weigh, is not established by this research. The Manichean and Gnostic motifs that some critics see in the novel illustrate the problem well: Bell's Bayle thesis and Vargish's Gnostic thesis are rival accounts of where such motifs come from, and both authors say that their argument does not exclude other sources [25][26].\n\nThe sorted result is this. What Melville demonstrably handled was the vocabulary of Calvinism (which he named in print), a skeptical dictionary that assembled the standard arguments against providence (which he bought), the lived piety of the whaleman's chapel (which he attended), and the idiom of Fate and Providence (which he wrote into the text). What he shares with the great theologians and philosophers of providence is a problem, not a bibliography. The practical conclusion for interpretation is a methodological caution: when a critic says that a passage in *Moby-Dick* \"is\" Calvinist, Manichean, Leibnizian or Emersonian, the claim should be tested against this table of evidence. A Calvinist reading is the best documented. A Bayle-inflected skeptical reading is next. The rest are parallels, interesting and sometimes illuminating, but parallels.\n\n## Open Questions\n\nThe first open question is the content of Melville's religious education in the Albany and New York years. The thin record (a baptism, a Dutch Reformed mother, a father of looser leanings) permits many stories, and no source I could read describes which catechisms the boy learned. A second is whether the Whig and Democratic providential rhetoric of the 1840s is a target of the early books, as some critics argue, or only a background; I did not find the sources to settle it. A third is Melville's relation to Emerson, where the contemporaneous documentary record deserves a dedicated study that this chapter does not attempt. A fourth is the cause of the apparent shift between Hawthorne's 1856 notebook and Melville's own poetry of the 1860s and 1870s; one may suspect that the answer lies in the personal losses and the war, but that is inference. A fifth is whether Edwards's compatibilism reached Melville through any identifiable channel, a question on which the present research found nothing. A last, methodological question: how much weight a Marginalia-based argument from silence can bear, since many of Melville's books are lost, and the absence of a book from the catalog is not evidence that he did not read it.\n\n## Sources\n\n1. Heidelberg Catechism, Questions 27 and 28 (English text, \"Method of Instruction in the Christian Religion as the Same is Taught in the Reformed Churches and Schools\"), Christian Classics Ethereal Library. https://www.ccel.org/creeds/heidelberg-cat.html. Accessed 2026-10-24. (Tier 1; no date stated on the page; the 1563 date is general knowledge.)\n2. Augustine, *The Enchiridion on Faith, Hope and Love* (translator not named on the page), New Advent. https://www.newadvent.org/fathers/1302.htm. Accessed 2026-10-24. (Tier 1; I read the first 100,000 characters only; the quoted line is from ch. 27.)\n3. Thomas Aquinas, *Summa Theologiae*, I, q. 22, arts. 1, 2, 4, trans. Fathers of the English Dominican Province (2nd rev. ed., 1920), online ed. Kevin Knight. https://www.newadvent.org/summa/1022.htm and https://www.ccel.org/ccel/aquinas/summa.FP_Q22_A2.html. Accessed 2026-10-24. (Tier 1.)\n4. John Calvin, *Institutes of the Christian Religion*, Book I, ch. 16, \"The World, Created by God, Still Cherished and Protected by Him,\" trans. Henry Beveridge, CCEL (filed as iii.xvii). https://www.ccel.org/ccel/calvin/institutes.iii.xvii.html. Accessed 2026-10-24. (Tier 1.)\n5. Calvin, *Institutes* I.17, \"Use to Be Made of the Doctrine of Providence,\" CCEL (filed as iii.xviii). https://www.ccel.org/ccel/calvin/institutes.iii.xviii.html. Accessed 2026-10-24. (Tier 1.)\n6. Calvin, *Institutes* I.18, \"The Instrumentality of the Wicked Employed by God, While He Continues Free from Every Taint,\" CCEL (filed as iii.xix). https://www.ccel.org/ccel/calvin/institutes.iii.xix.html. Accessed 2026-10-24. (Tier 1.)\n7. T. Walter Herbert Jr., \"Calvinism and Cosmic Evil in *Moby-Dick*,\" *PMLA* 84, no. 6 (October 1969): 1613-1619, DOI 10.2307/1261508; abstract and references read only. https://www.cambridge.org/core/journals/pmla/article/calvinism-and-cosmic-evil-in-mobydick/37A1411E0C19F82320F25771BC757462. Accessed 2026-10-24. (Tier 2.)\n8. Westminster Confession of Faith, chapters 3 and 5, Orthodox Presbyterian Church online text. https://www.opc.org/wcf.html. Accessed 2026-10-24. (Tier 1; the page does not state a date.)\n9. Elizabeth Hardwick, \"Melville in Love,\" *The New York Review of Books*, June 15, 2000 (drawing chiefly on Hershel Parker's biography). https://www.nybooks.com/articles/2000/06/15/melville-in-love/. Accessed 2026-10-24. (Tier 4/5.) See also Hershel Parker, *Herman Melville: A Biography*, 2 vols. (Johns Hopkins University Press, 1996, 2002),
