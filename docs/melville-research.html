ttps://berkshirehistory.org/events/month/2019-08/ and rural intelligence, \"Local Boy Makes Good,\" https://www.ruralintelligence.com/local-boy-makes-good-celebrating-herman-melvilles-200th/ (accessed 2026-10-24). Tier 1 and 5.\n33. Twelfth International Melville Conference, as announced in Leviathan, https://muse.jhu.edu/article/750711 (surfaced via search) (accessed 2026-10-24). Tier 2.\n34. \"Baltimore's role in reviving Melville,\" *Baltimore Sun*, 28 July 2019. https://www.pressreader.com/usa/baltimore-sun-sunday/20190728/281801400565830 (accessed 2026-10-24; headline only). Tier 4.\n35. WAMC, \"Pittsfield read-a-thon celebrates 175 years of Moby-Dick,\" 16 July 2026. https://www.wamc.org/news/2026-07-16/pittsfield-read-a-thon-celebrates-175-years-of-moby-dick (accessed 2026-10-24). Tier 4 (regional public radio)."}, {"order": 6, "file": "06_Critique_And_The_Strongest_Objections.md", "title": "The Case Against “Melville’s Argument About Providence”: Six Objections and a Verdict", "summary": "", "body": "# The Case Against “Melville’s Argument About Providence”: Six Objections and a Verdict\n\n## Bottom Line\n\n> Moby-Dick does not argue about providence the way a treatise does, and the strongest objections show why. The word is rare, mostly ironic or in the mouths of minor figures; the work that the word would do is spread over fate, chance, necessity, malice and the sublime; and the narrator who might have stated a position keeps dissolving into the drama. What survives the objections is narrower and, I think, firmer: the novel stages a sustained, formally controlled *inquiry* into whether the cosmos is governed by a meaning one could name, tests four or five rival answers against the same events, and refuses to certify any of them. \"Melville argues for a view of providence\" is weakly supported. \"Melville builds a machine that makes the question unavoidable and unanswerable\" is strongly supported. The distance between those two sentences is the whole dispute.\n\n## What Is Being Objected To\n\nThe thesis under attack runs something like this. Melville inherited a Calvinist doctrine of providence from his Dutch Reformed mother's side and a Unitarian, genteel counter-theology from his father's side; he absorbed Emerson's optimism and Carlyle's thunder; he met Hawthorne and was bruised into depth; and in 1851 he wrote a novel whose plot, characters and set-piece chapters constitute an extended argument about whether God governs the world, and whether, if God does, the governor is just. Ahab is the rebel who reads malice in the sublime; Mapple is the orthodox preacher who reads obedience; Ishmael is the skeptical pluralist who watches and weaves.\n\nEach link in that chain can be pulled. This chapter pulls them in sequence, staging each objection at something close to its full strength before saying where the evidence leans. The objections are, in order: that \"providence\" is the wrong word for what the book is about; that no one in the book speaks for the author; that a novel of this kind cannot argue; that the book contradicts itself where it comes closest to stating a view; that the biographical supports for a theological reading are weak or tendentious; and that the book as we have it is a layered artifact whose \"position\" may be an accident of composition. The comparative section then asks whether Melville's handling of providence is distinctive among his peers. The chapter closes with three imagined readers (believer, skeptic, formalist) and a verdict.\n\nA word on method. The novel is quoted below only from the public-domain text (Project Gutenberg's edition) and only in short fragments [1]. Where a claim about scholarship rests on a monograph I did not re-read, I say so, and the Sources section tags it. The brief that commissioned this chapter attributed one argument about \"try-works revisions\" to Bercovitch; I could find no support for that attribution and do not repeat it as fact (see Open Questions).\n\n## Objection One: Providence Is the Wrong Category\n\n### The lexical evidence\n\nBegin with the cheapest test: count the word. In the Gutenberg text of the novel the capitalised word \"Providence\" appears exactly three times, and every appearance is compromised [1]. (\"Fates\" appears six times, a count that makes the contrast, if not a proof, at least a datum.) In the opening chapter Ishmael speculates that his decision to go whaling \"formed part of the grand programme of Providence that was drawn up a long time ago,\" and then, in the same breath, renders that programme as a theatre bill in which his voyage sits between a contested presidential election and a battle in Afghanistan, the Fates acting as \"stage managers\" [1]. This is not a profession of doctrine. It is a joke on the idea that a cosmic plan has any interest in a bit part. Later, in the chapter in which Ishmael is the second man in Stubb's boat, he reasons that his \"free will had received a mortal wound\" because another man's mistake might kill \"innocent me,\" and concludes that \"here was a sort of interregnum in Providence; for its even-handed equity never could have so gross an injustice\" [1]. The reasoning is explicitly provisional: the sentence goes on to say that \"still further pondering\" showed him the situation in another light. And when the word is used by Bunger, the ship's surgeon on the *Samuel Enderby*, it becomes a pure farce: whale digestive organs are \"so inscrutably constructed by Divine Providence\" that the whale cannot digest an arm, so what you take for malice is \"only his awkwardness\" [1]. Providence, in the one place it is invoked as a natural theology, is used to explain away exactly the evidence Ahab reads as malice, and it is delivered by a comedian.\n\nIf one wanted an argument by absence, here it is: the novel's most famous metaphysical vocabulary is not providential at all. Ahab says \"Fate is the handspike\"; he is \"the Fates' lieutenant\"; the scene is \"immutably decreed\" [1]. Ishmael and Ahab invoke the \"Fates\" twice as often as \"Providence\" (six occurrences against three in the Gutenberg text). The Pequod is \"predestinated\" in its narrator's approving or ironic usage more than once. The language is classical (Fates, Parcae, Moirai) and scriptural-fatalist (decreed, ordained), not the specific Reformed vocabulary of *providentia*, concursus and governance, of which Melville, raised in the Dutch Reformed church, would have known the formularies.\n\n### Fate, chance, nature, sublime: the four rival categories\n\nThe strongest version of the objection is therefore not lexical but analytical. Providence in the classical Christian sense (Calvin's, Augustine's, Aquinas's) has three necessary components: a governor who is personal and good, a plan that is comprehensive, and a relation between that plan and creaturely action such that both are real (what the tradition calls concurrence). Remove any component and you do not have a doctrine of providence; you have something else. Moby-Dick keeps showing us something else.\n\n*Fate.* Fate is plan without governor, or with a governor who is not good. Ahab's \"This whole act's immutably decreed. 'Twas rehearsed by thee and me a billion years before this ocean rolled\" is a statement of fatalism, not providence: there is no benevolence, no reasoned economy of salvation, only a script [1]. Fate in this register is closer to Greek *ananke* or to Shakespearean tragedy than to the Westminster Confession. The Fedallah prophecies (the hearse, the hemp, the two ships) work the way the witches' prophecies work in *Macbeth*: they are fulfilled to the letter in ways that destroy the hearer's understanding, which is a technique of fate and not an instrument of grace [1].\n\n*Chance.* Chance is event without plan. The novel has an astonishing quantity of it: the lines that fray, the whale's flukes that arrive at an angle, the shark-bitten lines, Pip's abandonment (the ship rescued him \"by the merest chance\"), and the Epilogue's survivor, who tells us twice that his survival was accident (\"It so chanced\") before attributing it to the Fates [1]. Anyone who counts events in the book will find that, in the ordinary physical sense, much of what happens would happen whatever anyone believed.\n\n*Nature.* Nature is order without purpose. The whale chapters, the cetology, the natural history of the sperm whale's head and the spermaceti, are a long meditation on a beautifully ordered creature whose order has no moral content. Ishmael admires the whale's engineering and does not infer a designer's kindness from it; Bunger's farcical \"Divine Providence\" is the parody of just that inference [1]. This is a quarrel with natural theology, whose mid-nineteenth-century exemplar was Paley, and the quarrel is carried on by example rather than argument.\n\n*The sublime.* The sublime is magnitude without moral relation. \"The Whiteness of the Whale\" asks whether that colour, \"by its indefiniteness,\" \"shadows forth the heartless voids and immensities of the universe, and thus stabs us from behind with the thought of annihilation\" [1]. The operative faculty is not intellect but dread; the question is not whether the world is governed but whether it is, to us, readable at all. If the chapter on whiteness is the metaphysical centre of the book, as many readers hold, then the central question is arguably hermeneutic (is there any text here?) rather than providential (who is the author of the text?).\n\nOn this analysis Ahab's complaint is not \"God governs unjustly\" but \"something behind the mask has an intention toward me, and I cannot read it.\" His own words support the hesitation. \"Sometimes I think there's naught beyond,\" he says of the whale as wall; \"be the white whale agent, or be the white whale principal, I will wreak that hate upon him\" [1]. That is an uncertainty about *agency*, not about justice. To call it a debate about providence is to impose a theological frame where Ahab himself says he does not know whether there is anyone there.\n\n### Where the objection loses force\n\nThe category objection is strong against the careless claim that the novel \"is about\" providence. It is weaker against the claim that providence is the question the novel's several categories are *competing to answer*. Three considerations press here.\n\nFirst, the categories are not alternatives in the text; they are drawn into the same sentences and scenes. In the Mat-Maker chapter Ishmael lists necessity, free will and chance as \"nowise incompatible\" [1]; in the Quarter-deck Ahab moves within a few lines from \"naught beyond\" to \"unknown but still reasoning thing\" to \"inscrutable malice,\" that is, from nothing, to an agent, to a malicious agent, all in one speech [1]. The sliding is the argument: the novel shows the mind sliding from natural contingency to agency to theology, and the slide is exactly the move providence-doctrine makes and critics of the doctrine accuse it of making illicitly.\n\nSecond, the vocabulary question cuts both ways. Melville's century used \"Providence\" as the polite name for what in Calvinist divinity is \"decree,\" and the book keeps the underlying structure (a pre-given order that includes particular outcomes) while changing the name. \"Predestinated\" and \"ordained\" are Reformed terms of art. The absence of the word in the hot speeches does not show an absence of the doctrine; it may show that the doctrine is being tested in an older and rawer register, where \"the Fates\" give a pagan face to a Reformed fear. Scholars who read the novel through Calvinism (the best known is T. Walter Herbert, Jr., whose 1969 *PMLA* article argues that Melville drew on an anti-Calvinist tradition in which Calvin's God was portrayed as a brutal monster, and that Calvin's treatment of King Ahab as a reprobate shapes Captain Ahab) are reading exactly this translation [9]. Herbert's own conclusion deserves notice: he holds that Melville's theological material is extensive and sophisticated yet subordinate to the novel's central themes [9]. A reader hostile to the thesis may take that as concession; a reader sympathetic may take it as the correct weighting.\n\nThird, there is the passage that most directly joins the categories. Pip, abandoned in the sea and rescued \"by the merest chance,\" goes mad and \"saw God's foot upon the treadle of the loom, and spoke it; and therefore his shipmates called him mad. So man's insanity is heaven's sense\" [1]. Here the book states, in about two lines, a proposition about providence: to see the governing hand is to be mad by the world's measure, and the madness may be the only sanity heaven has. It then qualifies the proposition by calling the seer \"indifferent as his God\" (\"weal or woe, feels then uncompromised, indifferent as his God\") [1]. The sentence fuses providence (God's foot on the treadle), chance (the \"merest chance\" that opens it), and the sublime (the indifference), and it does so while placing the insight in a character who is, by the narrator's own account, an \"idiot.\" No better single specimen of the book's technique exists, and none makes the \"wrong category\" objection easier to state or harder to sustain.\n\nMy assessment: \"providence\" is the right *question* and the wrong *label*. The best name for the book's concern is something like \"whether and how events are governed by meaning,\" of which providence, fate, chance and the sublime are the rival answers. Other chapters in this volume that use \"providence\" as shorthand are defensible so long as the shorthand is held loosely.\n\n## Objection Two: No One Speaks for the Author\n\n### The three-voice problem\n\nThe second objection concerns who is saying what. The novel's views on providence are voiced by Mapple (pulpit orthodoxy), by Ahab (rebellion and fatalism), by Starbuck (pious dread), by Stubb (jolly fatalism), by Pip (inspired madness), by Fedallah (prophecy), by Queequeg (pagan equanimity, the coffin), by the \"Epilogue\" Ishmael (wry survivor), and by Ishmael-at-large, a narrator who on one page is the voice of 1851 and on another is an omniscient dramatist narrating Ahab's private soliloquies he could not have heard. The objection says: the number of voices is so large, and their warrants so unequal, that any statement of \"the novel's view\" is a construction by the critic rather than a report.\n\nThe narrator problem is acute and has two layers. First, Ishmael is not stable. He opens as a self-ironizing, almost clubbable first-person; he converts in the middle into something closer to a stage manager; and by the end he is a disembodied intelligence for whom \"the drama's done.\" The famous soliloquies of Ahab, the \"Sunset\" speech and the long address in the \"Symphony,\" are staged as private. Ishmael cannot have heard them. The text half-acknowledges this: the whole book says \"Ahab thought\" in places where no Ishmael-witness stands [1]. A critic who treats Ishmael as the author's proxy is therefore reading a proxy that does not behave as a proxy. Second, even taking Ishmael at face value, he is a persona whose positions are performances. His chapter on his own whaling-voyage-as-providential-programme is explicitly comic; his pagan conversions (the Congregationalist who prays with Queequeg's idol) are offered as a case of religious pluralism that stops short of sincerity; his cetological motto, \"I try all things; I achieve what I can,\" claims only effort, not knowledge [1]. Whether Ishmael ever *means* what he says about providence is, in the words of one reference work's summary of Brian Yothers's contribution to the *Critical Insights* volume on the novel, a standing question: \"When is Ishmael (and beyond him, Melville himself) in earnest?\" [16]\n\n### Mapple and irony\n\nThe Mapple sermon is the place where the problem is worst, because the sermon looks like a statement of Melville's theology and yet is deployed ironically in context. On its face the sermon is orthodoxy: Jonah's disobedience, the whale as God's instrument, the \"sure delight\" on \"the starboard hand of every woe,\" the closing benediction, \"O Father!—chiefly known to me by Thy rod\" [1]. It is also, by the logic of what follows, the book's parable of the voyage's own outcome: a captain's disobedience against a hunt that is ordained, a ship that sails ahead of its master. The sermon is delivered from a pulpit \"ever this earth's foremost part,\" shaped like a ship's prow, in the whalemen's chapel at New Bedford, where the marble tablets commemorate men lost at sea and \"Faith, like a jackal, feeds among the tombs\" [1].\n\nThere are four ways to read the sermon, and the evidence does not choose among them decisively.\n\n*Sincere orthodoxy, then refusal.* Mapple speaks the truth Ahab will not hear; Ahab is Jonah without repentance. Melville stands with Mapple, and the book enacts the doctrine's vindication. This reading requires that the Pequod's destruction function as providential judgment, and it is hard to square with the Epilogue's apparatus of chance and with Ishmael's non-participation in judgment.\n\n*Sincere orthodoxy, then failure.* Mapple speaks the truth, but truth is not enough: it is a sermon for a world that does not have Ahabs in it. The sermon is sincere and inadequate. This preserves the sermon's dignity and the book's pathos.\n\n*Ironic orthodoxy.* The sermon is a performance by a man whose theology has been bought by the comfort of a pulpit; the structure of the chapel, with its painted storm and \"little isle of sunlight,\" is saccharine, and the jackal-faith line is a deadpan description of what such faith does. This is the reading associated with the hidden-satire school, discussed under the next heading.\n\n*Prolepsis without endorsement.* The sermon is simply a literary device announcing a theme (obedience versus rebellion) without endorsing either. This is the formalist reading, and it has the merit of fitting the observable facts: the sermon's themes return without verdict.\n\nWhat would count as evidence for one of these? Tone is the usual proxy, and the sermon's tone is, to my reading, genuinely moving: the preacher \"dropped and fell away from himself for a moment,\" then lifted his face \"with a heavenly enthusiasm\" [1]. That favours sincerity of delivery, though not necessarily the author's endorsement of content. Melville frames the sermon with a description of Mapple that is loving and a description of the setting that is faintly theatrical; the framing supports the second or fourth reading more than the first or third. This is an inference from the text, and I flag it as such: scholars genuinely disagree.\n\n### Ahab is not Melville; neither is Ishmael\n\nA neighbouring problem concerns Ahab. The early twentieth century, and the Melville Revival with it, tended to read Ahab as the author's own protest, with \"Ahab\" as the Titan of defiance. Later readers, from the 1940s on, increasingly insisted that Ahab is a figure of destructive monomania whose rhetoric is the very thing the book is diagnosing. The text supports both because Ahab's rhetoric is, by design, magnificent: \"Talk not to me of blasphemy, man; I'd strike the sun if it insulted me\" [1]. Yet the narrator calls him, in the same narrative, \"madly\" bent and treats his quest with a mixture of awe and warning, and the book's internal structure (the ship's company seduced into complicity; the Pequod as a commonwealth with its leader's death-wish) is a political critique as much as a metaphysical one. A third position holds that Ahab, Ishmael and Starbuck are three limbs of a divided author. That is a coherent critical decision, but it relocates the question rather than answering it: if the author is divided three ways, the \"author's position\" is the shape of the division.\n\nMy assessment: the narrator-versus-author problem does not defeat the thesis, but it requires that the thesis be stated as a claim about the *structure of the work* (what it makes available to think) and not about a position the author holds. The book is a better witness to what Melville could imagine than to what Melville believed.\n\n## Objection Three: A Novel Cannot Argue\n\n### The generic objection\n\nThe third objection concerns genre. Arguments, on this view, are conducted in discourse that can be assessed for validity (treatises, sermons, dialogues); fiction does not argue but displays. Moby-Dick is more extreme than most novels: it is \"encyclopedic\" (a mixture of cetology, extracts, sermon, play-script, soliloquy, natural history, whaling lore, and tragedy), and it is dramatic in a specifically Shakespearean mode. An argument that is voiced in dramatic characters is a set of characters' arguments; it is not the author's.\n\nThe structural facts are not in dispute. The novel opens with \"Etymology\" and \"Extracts,\" a pseudo-scholarly apparatus whose entries on whales, assembled by a \"sub-sub-librarian,\" include scriptural, classical and nautical citations. It contains chapters in dramatic form with stage directions (the midnight forecastle chapter is set out as a script); it includes soliloquies; its closing chapter announces \"The drama's done\" [1]. The relevant critical tradition runs from Matthiessen's *American Renaissance* (1941), which read Melville's Shakespeare as the discovery that made the book possible, through Charles Olson's *Call Me Ishmael* (1947), which makes Shakespeare's tragic conception, and *King Lear* above all, the key to the book's growth in composition; I cite both from the public record and did not re-read them for this chapter [Sources, \"recalled from the public record\"].\n\n### What the dramatic mode does to argument\n\nThe Shakespearean mode has three consequences for the thesis.\n\nFirst, it disperses authority. In a play the author is nowhere and everywhere; the audience infers an attitude from the pattern of what happens, not from any speech. A critic who says \"Melville argues X\" in a Shakespearean context faces the familiar old problem with Shakespeare himself: the question of what Shakespeare \"thought\" about providence (compare *Lear*'s \"As flies to wanton boys are we to the gods; they kill us for their sport\" against Edgar's \"the gods are just\") is notoriously unresolved precisely because both are spoken by characters in a play. The comparison is useful: Melville read Shakespeare closely in 1850–51 (his marked set of Shakespeare is documented in the Melville's Marginalia project), and what he took from the plays was, on the dominant account, a licence to put unorthodox metaphysics in the mouth of a tragic hero without owning it [recalled from public record; the Marginalia site was located but not mined for this chapter].\n\nSecond, it makes pattern rather than assertion the carrier of meaning. Tragic form asserts through consequence. Ahab's speeches may be wrong; Ahab's destruction is the form's verdict. But what is the verdict *on*? On the quest, or on the cosmos that makes the quest tragic? Because the form cannot say, the book supports both the reading in which Ahab is punished for hubris (a providential reading) and the reading in which he is crushed by an indifferent universe (an anti-providential reading). The *Macbeth*-like prophecies sharpen this: Fedallah's predictions come true, which looks like providential ordering, but they come true as a trap, which looks like malign ordering [1]. Pattern is ambiguous in a way assertion would not be.\n\nThird, it makes the interpretation of the whole depend on whether one believes drama can make a point at all. That is the real crux. A formalist says drama presents a world and invites the audience to feel the force of competing interpretations; the book is an experiment, not a thesis. A theological critic says that tragic form is itself a cosmology, since the structure of tragedy (hubris, nemesis, anagnorisis) presupposes a moral order, and Melville's choice of that form is a choice about the world. I find the second position stronger than its opponents allow but weaker than its defenders do. Tragic form presupposes meaning; it does not presuppose benevolence. Greek tragedy runs on a moral order that is not kind. The book could be tragic and anti-providential in the Christian sense without contradiction.\n\n### The encyclopedic mode\n\nThe encyclopedic aspect adds a distinct objection. The cetology chapters and their digressions seem, on a certain reading, to *dissolve* argument: any proposition about the whale is followed by another that qualifies it, and the book's own ethos is that complete knowledge of the whale is impossible (the cetology presents itself as necessarily unfinished, a point I paraphrase without quotation because I did not retrieve the exact words). If the book's governing epistemology is that totalizing system is impossible, then to attribute to it a systematic doctrine of providence is a category mistake. A critic could add that the mode resembles a genre Northrop Frye (*Anatomy of Criticism*, 1957) called the anatomy or Menippean satire, in which ideas are displayed in the persons of their holders and the form mocks the pretence to system; I recall this from Frye and flag it as recalled. If Moby-Dick is an anatomy, then what looks like theology is a catalogue of theologies, and the author's \"view\" is the catalogue's satirical shape.\n\nMy assessment: the generic objection establishes that the book does not argue *in propria persona*, and that is a real result. It does not establish that the book does not argue *at all*. A work may argue by constructing a situation in which every available answer to a question is tested to destruction. What the book does is exactly this: it puts rival providential theories (Mapple's, Ahab's, Stubb's, Pip's, the Mat-Maker's synthesis) through a single sequence of events and watches which survive. That is closer to what philosophers call a thought-experiment than to an essay, and the genre of thought-experiment has a long history of being counted as argument. The legitimate form of the thesis is therefore: Melville *tests* theories of providence, and the testing is open to inspection.\n\n## Objection Four: The Text Contradicts Itself\n\n### The Mat-Maker\n\nThe fourth objection is the most damaging because it concerns the text's own best attempt at a synthesis. \"The Mat-Maker\" gives us Ishmael at a loom, \"the Loom of Time,\" where \"the fixed threads of the warp\" are necessity, his shuttle is free will, and Queequeg's \"impulsive, indifferent sword,\" which drives each yarn home, is chance [1]. Ishmael concludes: \"chance, free will, and necessity—nowise incompatible—all interweavingly working together. The straight warp of necessity, not to be swerved from its ultimate course... free will still free to ply her shuttle between given threads; and chance, though restrained in its play within the right lines of necessity, and sideways in its motions directed by free will, though thus prescribed to by both, chance by turns rules either, and has the last featuring blow at events\" [1].\n\nRead slowly, this is a compatibilist model with a twist, and the twist sinks it. Necessity is the fixed frame; free will works within it; chance is the third term that \"by turns rules either.\" But if chance can rule necessity, necessity is not necessity; if chance is \"restrained\" by necessity, chance is not chance. Chance is given \"the last featuring blow at events,\" the final say on outcomes, which is the opposite of the doctrine of providence, on which the last word belongs to the plan. And the image is not neutral: the sword that does the shaping is held by a man \"idly looking off upon the water,\" \"carelessly and unthinkingly\" driving the yarns home. A cosmos governed by an indifferent sword is a long way from the loom of a weaver-God. Whether Ishmael sees this is unclear: he calls the three \"nowise incompatible,\" and then, in the next paragraph, a cry from the masthead makes \"the ball of free will\" drop from his hand [1]. The theory is broken off by an event, the first whale of the voyage, and the chapter never returns to it.\n\nHow should that interruption be read? Three ways. (i) Dramatically: speculation yields to action, as it always does in Ishmael's book. (ii) Ironically: the \"synthesis\" is a gloss for a man who has not yet suffered, an undergraduate's reconciliation of the incompatible, and the cry of \"There she blows\" begins the suffering that will dissolve it. (iii) Structurally: the chapter is one of many places where the book offers a theory and then does not test it; the theory is simply left. My own reading favours (ii) with (iii) as a constraint, but I flag this as inference. What the passage rules out is the claim that the book offers the Mat-Maker synthesis as its settled view: the text breaks the thought in the act of expressing it.\n\nThere is a deeper structural difficulty. The loom-image is not Ishmael's alone. Pip \"saw God's foot upon the treadle of the loom,\" the same image, but now the weaver is God and the seer is mad [1]. The same figure presents compatibilism as a sailor's reverie, and providence as an idiot's vision. The book gives us the image twice, and the two uses are not consistent with one another. One may read the repetition as a unifying symbol (the loom is the book's metaphor for providence, tested from two angles). One may also read it as the book showing that the image can carry any theology one cares to load onto it, which is a quiet argument against all of them.\n\n### Ahab against himself\n\nAhab contradicts himself on the same question with magnificent rhetorical energy. In the Quarter-deck he claims to strike through the mask at an agency behind it, and in the same breath he is unsure that anything lies behind. In the \"Symphony\" he asks, \"Is Ahab, Ahab? Is it I, God, or who, that lifts this arm?\" and goes on to reason that if the sun is \"an errand-boy in heaven,\" then \"God does that beating, does that thinking, does that living, and not I\"; \"we are turned round and round in this world, like yonder windlass, and Fate is the handspike\" [1]. This is the strongest argument in the book for determinism, delivered by the character whose entire project is an assertion of will. It leaves us with the possibility that Ahab's hunt is both free (he chooses it, repeatedly, against Starbuck's pleas and his own better \"natural\" feelings) and unfree (he is the Fates' lieutenant). Ahab's solution is not to reconcile them but to act: \"This whole act's immutably decreed... I act under orders\" [1]. A cynic would say he uses the doctrine of the decree as an excuse; a theologian would say this is just what the Reformed tradition meant by the bondage of the will in sinners; a formalist would say the passages are characterization.\n\n### The Epilogue and the Rachel\n\nThe Epilogue is the place where the book most nearly speaks its own conclusion, and it contradicts itself in a single paragraph. The Job epigraph, \"AND I ONLY AM ESCAPED ALONE TO TELL THEE,\" frames the survivor as the messenger who comes to report disaster, which is a providential figure: in Job the messengers are permitted to escape so that the news can be carried. Then the text says \"It so chanced, that after the Parsee's disappearance, I was he whom the Fates ordained to take the place of Ahab's bowsman\" [1]. One sentence, two causes: chance and the Fates. The narrator then rides the vortex \"like another Ixion,\" a figure condemned to turn on a wheel; Queequeg's coffin, made for a dead man, shoots up as a buoy; the sharks are \"unharming,\" \"as if with padlocks on their mouths\"; the \"savage sea-hawks sailed with sheathed beaks\" [1]. The language is that of restraint: something withholds the sharks and the hawks. Then, \"On the second day, a sail drew near, nearer, and picked me up at last. It was the devious-cruising Rachel, that in her retracing search after her missing children, only found another orphan\" [1].\n\nThe Rachel is the critical test, and the evidence is not decisive. The ship is \"devious-cruising\": her course is erratic, which is the language of chance. She is searching for her own lost children (Captain Gardiner's son, in the earlier chapter where Ahab refused help), which is the language of retribution or of irony: the ship Ahab would not help finds the only survivor of Ahab's ship. She \"only found another orphan\" and does not find what she sought. The Rachel allusion (Jeremiah's Rachel weeping for her children, and Matthew's application of that text to the slaughter of the innocents) adds a scriptural charge. So three readings are available.\n\n*Providential rescue.* The survivor is saved; the coffin made for a death carries him; the sharks are restrained; the Rachel arrives. This is a pattern of preservation, a miniature of the doctrine's promise: the elect remnant, \"escaped alone to tell.\" Ishmael as Jonah, spared; or as the Job-messenger, kept alive for testimony.\n\n*Mere chance.* \"It so chanced.\" A random body at the edge of a vortex is buoyed by a random coffin and picked up by a random ship. The \"restraint\" of the sharks is the narrator's poetic projection; the Rachel's presence is coincidence with a literary echo. The providential language (\"Fates ordained\") is Ishmael's habitual idiom, which he has mocked since chapter one.\n\n*Ironic providence.* If there is a governing intelligence, its mercy is a mockery: it preserves the one man who did nothing and destroys all the rest, and the survivor is rescued by the very ship whose request Ahab denied. The book's sense of cosmic joke (\"the whole universe a vast practical joke,\" as the chapter on the Hyena has it [1]) allows this.\n\nWhat decides among them? The text itself, in a single paragraph, supplies the vocabulary of all three. A formalist would conclude that the ambiguity is deliberate; a believer, that the providential pattern is stronger than the disclaimers; a skeptic, that the disclaimers, which are explicit (\"It so chanced\"), outweigh the pattern, which is only imagery. The balance of evidence, in my reading, favours the formalist: the density of overdetermined language in the Epilogue, with each of the three sets of terms deployed side by side, is a feature of the text and it would be perverse to resolve it by fiat. But it must be added that what the Epilogue does *not* contain is any statement of purpose for Ishmael's survival beyond testimony. He is saved to tell, and the telling is the book. The argument that the book *is* the providential purpose, that Ishmael was preserved in order that the story be told, has the structure of a literary-theological reading that cannot be refuted from the text and also cannot be established from it.\n\n## Objection Five: Biographical Overreading\n\n### Thompson and the hidden satire\n\nThe fifth objection concerns the biographical support. The thesis I have been testing rests partly on the picture of Melville as a man troubled by providence: his Dutch Reformed upbringing, his father's bankruptcy and early death, the family's reliance on providential language to explain disaster, his years at sea, his friendship with Hawthorne. The picture is plausible and, in outline, well documented. It has also been over-pressed.\n\nThe most famous overpressing is Lawrance Thompson's *Melville's Quarrel with God* (Princeton University Press, 1952). Publisher and library descriptions present it as a radical reinterpretation in which Thompson argues that Melville consistently satirised Christian doctrine while disguising his view of God's cruelty; the book's case is that Melville's narratives, from *Typee* through *Billy Budd*, carry a hidden, sinister, consistent intent [11]. The thesis is that Melville's apparent ambivalence is a mask: a covert theology of divine malice disguised from a genteel readership, with narrators and characters as ciphers. The argument has an obvious attraction for a reader who wants Melville's view of providence to be definite, and it has the distinction of being at least a thesis.\n\nThe objection to Thompson is methodological, and the criticism that has surrounded his book since publication, as far as I recall it from the public record, is that his method is unfalsifiable: any passage that seems orthodox is read as satire; any passage that seems heterodox is read as the author's mask slipping. A hypothesis that can accommodate any evidence is hard to count as supported by evidence. A second problem is that Thompson relied on a picture of Melville's biography, in which his family's Calvinism was a hated oppressor, that later biographers, Hershel Parker in particular in his two-volume *Herman Melville: A Biography* (Johns Hopkins University Press, 1996 and 2002), complicated by recovering far more documentary detail and a more textured family story [13]. I did not re-read Thompson's book in this session and rely on publisher and library descriptions for its thesis; its reception is recalled from the public record.\n\n### Herbert and the family papers\n\nT. Walter Herbert, Jr. offers a more careful route. His *PMLA* article of 1969 and his *Moby-Dick and Calvinism: A World Dismantled* (Rutgers University Press, 1977, xii + 186 pages per a library record) read the novel against the Calvinist formularies and the family papers, a procedure that a *Partisan Review* notice of 1977 described as treating the novel as an expression of Melville's spiritual struggle [9][10]. Herbert's argument in the article is bounded: Melville *used* Calvinist ideas, especially the treatment of King Ahab as a reprobate and the anti-Calvinist tradition of God as monster, to give Captain Ahab's quarrel its density, and the theological material, though sophisticated, is *subordinate* to the book's central themes [9]. The objection to the book-length version, which I recall but have not re-verified, is the standard objection to source-study: the discovery that a motif has a Calvinist ancestry does not show that the novel is *about* Calvinism, nor that Melville was personally engaged with the doctrine in 1851 rather than drawing on a cultural reservoir.\n\n### What the contemporary evidence shows, and does not\n\nSome biographical evidence is good. The two Hawthorne documents quoted below are the best-attested primary materials on Melville's religious condition, and they cut two ways.\n\nIn his review essay \"Hawthorne and His Mosses\" (*The Literary World*, 17 and 24 August 1850), Melville wrote that Hawthorne's \"great power of blackness in him derives its force from its appeals to that Calvinistic sense of Innate Depravity and Original Sin\" [3]. That sentence is a statement about Hawthorne, and a statement that has probably been read, by critics eager for Melville's autobiography, as a statement about Melville. It is also written under a pseudonym (\"a Virginian spending July in Vermont\") and in a mock-rhapsodic mode that is itself elaborately performed [3]. It shows that Melville in 1850 was thinking of Calvinist depravity as the engine of the most powerful American fiction he knew; it does not show that he held the doctrine.\n\nA letter of June 1851 reports that the book is \"broiled\" in \"hell-fire,\" and Melville's letter to Hawthorne of 17 November 1851 contains the line \"I have written a wicked book, and feel spotless as the lamb\"; I found both phrases confirmed in secondary descriptions of the letters, though I did not retrieve the full text of the letters, and I could not settle from my searches which letter holds which phrase, so I give no dates beyond the year and the month for the first (a museum exhibit label dates the \"hell-fire\" letter to 1850, but Melville and Hawthorne did not meet until August 1850, which makes 1851 the likelier year) [17]. If the letters are authentic and the phrases are quoted correctly (they are widely quoted and I have no reason to doubt them), they show Melville regarding his book as dangerous and himself as untroubled by its danger. That is a statement about the book's *effect on pious readers*, not about a theology.\n\nThe strongest evidence of Melville's own condition is Hawthorne's. In November 1856, after Melville visited him in Liverpool, Hawthorne's notebook, in the version his widow Sophia edited for publication in 1870, says that Melville \"as he always does, began to reason of Providence and futurity, and of everything else that lies beyond human ken\" [2]. The unexpurgated entry, as quoted in a secondary source from the Centenary Edition of the *English Notebooks* (which I did not read in full), contains the better-known sentences: Melville \"pretty much made up his mind to be annihilated,\" and \"He can neither believe, nor be comfortable in his unbelief\" [4]. A reference-work article on Melville likewise quotes the 1856 entry's remark that \"if he were a religious man, he would be one of the most truly religious and reverential\" [Wikipedia, used only to locate the entry; not cited as a source]. Two things are notable. The phrase \"reason of Providence\" is, in Sophia Hawthorne's bowdlerised version, the thing she judged safe to print, and it survives where the rest of the passage does not. And \"as he always does\" is a datum about habit: by 1856, Providence was a standing topic of Melville's conversation, five years after the novel.\n\nIs this decisive for the thesis? It supports two modest claims: that the question of providence was a lifelong preoccupation of Melville's and not an episode of 1851, and that the answer remained unsettled, \"wandering to and fro\" in the entry's phrase as quoted [4]. The cautious reading that Hawthorne supplies is that Melville could neither assent nor deny. It does not support the claim that the novel *argues* a position; if anything it supports the contrary, that the author of the novel lacked a position and that the novel is the work of a man in the middle of the question.\n\n### Overreading, summarised\n\nThe biographical objection, then, has bite against Thompson's hidden-satire reading, bite against any reading that identifies Ahab's speeches with the author's convictions, and some bite against source-study that treats influence as commitment. It has less bite against the claim that Melville was *preoccupied* with providence and unsettled about it, which is the one thing the good biographical evidence (the 1856 entry, the letters, the marginalia) supports. Biography can establish the preoccupation but not the answer.\n\n## Objection Six: Two Melvilles, or the Layered Book\n\n### The composition hypothesis\n\nThe sixth objection says the book we have is not one book. On the \"two-Melvilles\" or revision hypothesis, Moby-Dick began as a straightforward whaling narrative, perhaps closer to the earlier sea books, and was transformed during composition, in 1850 and 1851, by Melville's reading of Shakespeare, his encounter with Hawthorne's work and then with Hawthorne himself, and his own deepening mood. What looks like a unified argument about providence is the sediment of different stages.\n\nThe history of this hypothesis is long and I give it as recalled from the public record, with partial verification. Leon Howard (a 1940 essay and a 1951 biography) treated Hawthorne as the catalyst that pulled Melville out of the autobiographical manner; Howard P. Vincent's *The Trying-Out of Moby-Dick* (1949) studied the sources of the book's parts and their order; Charles Olson's *Call Me Ishmael* (1947) argued that Shakespeare's tragic mode entered the book in a late phase, with Ahab's tragic stature a product of that stage; and Harrison Hayford, in work on the composition, argued that the close Ishmael–Queequeg friendship was added late, during the final stages of writing, under the influence of Melville's friendship with Hawthorne [12; I saw this summarised in a student paper that I could not retrieve in full and a search summary of a 1975 essay by James Barbour in *American Literature*, \"The Composition of *Moby-Dick*,\" which proposes a three-phase model (an early whaling narrative, then cetological and adventure chapters, then a revision shaped by Shakespeare and Hawthorne) as a refinement of the older two-books-spliced-together theory]. Hershel Parker's biography, with the Norton Critical Edition he co-edited with Hayford (revised 2001), carries the argument forward on archival evidence; reviewers of volume 1 singled out his treatment of \"the intellectual and physical circumstances under which Melville wrote *Moby-Dick*\" and his account of the friendship with Hawthorne as the strongest part of the work [13]. Melville's review of Hawthorne's *Mosses* is dated August 1850, so it falls squarely in the putative period of transformation, and a scholar who calls it a \"virtual preface\" to the novel (a reference-work article attributes that characterisation to Walter Bezanson) is taking the layering seriously.\n\n### What follows for providence\n\nIf the book is layered, the hypothesis has three implications for the providence thesis, and they pull in different directions.\n\nFirst, it threatens the idea of a unified argument. If the providential material (the Mapple sermon, the Fate-speeches, the Whiteness chapter, Pip's vision) belongs to different stages, then the book's \"position\" is a palimpsest, and critics who find a coherent argument are reading coherence into accretion. The lumpy joins that some readers notice (the cetology chapters that read as if from a different book; Ishmael's disappearance from the narration) are consistent with this.\n\nSecond, and more constructively, it supports a developmental thesis: Melville's thinking on providence was changing *as he wrote*, so that the argument is not a position held and then dramatised but a position discovered in the writing. The book's formal restlessness is then the trace of an unsettled mind. This is congenial to the reading of the 1856 notebook entry (a man who cannot settle) and to the genre reading (an anatomy that tests rather than asserts).\n\nThird, it complicates the narrator problem: if Ishmael's early chapters were written in a sunnier mode and the tragic chapters added later, the tonal and theological gap between the opening Ishmael and the closing Ishmael is a seam, and the effort to read Ishmael as one mind is misplaced.\n\n### Limits of the hypothesis\n\nThe layered-book hypothesis is a hypothesis. The evidence is circumstantial: the dated letters, the chronology of Melville's reading, internal inconsistencies, and the lost manuscript. The manuscript of the novel does not survive in a form that would settle the matter, as far as I know, and the contention that a first version existed that was substantially different is inferential. Scholars working on the composition disagree about how much was added and when. I treat Hayford's and Parker's reconstructions as well-argued but not demonstrated, and Olson's and Vincent's as influential but dated. A caution: a layered composition does not entail an incoherent result. Many great books are layered; the question is whether the final form, whatever its history, coheres, and that is a question about the text, not the manuscript.\n\nThe commissioning brief also credited Bercovitch with an argument about revisions in the try-works chapter. I did not find any support for this attribution. The Try-Works chapter itself does have a distinctive structure that invites a \"late insertion\" hypothesis (the chapter turns from a description of the rendering furnace to a sermon-like warning, \"Look not too long in the face of the fire, O man! Never dream with thy hand on the helm!\"), but I can say only that such a hypothesis is plausible, not that a named scholar has established it [1].\n\n## Comparison: Providence in Melville's Peers\n\nThe comparative method cuts against one objection and for another. If Melville's treatment of providence were the same as his peers', the claim of distinctiveness would fall; if it were wholly unlike, the claim of intelligibility would. The answer is that the family resemblances are close, and the differences specific.\n\n### Hawthorne\n\nHawthorne is the nearest case, and Melville knew him. In *The Scarlet Letter* (1850) the word \"Providence\" is used repeatedly in the voices of the Puritan community, and almost always with the novelist's irony at work. The Boston elders \"dealt with\" Dimmesdale \"on the sin of rejecting the aid which Providence so manifestly held out,\" the aid being Chillingworth's medical care, which is the instrument of Dimmesdale's torment; and \"the hand of Providence\" is supposed by his friends to have sent the physician \"for the purpose... of restoring the young minister to health\" [7]. The novel shows its characters interpreting events providentially, and shows the interpretations as wrong or self-serving, while leaving open whether a true providence works beneath. Hawthorne's distinctive method is the multiple interpretation of a single event, with the narrator refusing to adjudicate. The scarlet letter's appearance in the sky, in the chapter where Dimmesdale sees a meteor shaped like an \"A,\" is read by the town as a providential sign for the governor and by Dimmesdale as a sign for himself, and the narrator observes that in those days every meteoric appearance was apt to be interpreted \"as so many revelations from a supernatural source,\" and that the light may have shown \"so little definiteness, that another's guilt might have seen another symbol in it\" [7].\n\nThe comparison supports the formalist reading of Melville. Hawthorne's novel shows that the mode of the age's best fiction was not to assert a view of providence but to stage the *practice* of reading events providentially, with attention to its psychology and politics. If that is the shared mode, then Melville's \"argument\" is a version of Hawthorne's: dramatised interpretation. What is distinctive in Melville is the scale (a cosmic arena rather than a Puritan village) and the fact that the narrator is himself a participant in the interpretive anxiety, not a detached ironist. It is also the case that Melville read this as Hawthorne's gift: the \"power of blackness\" in the Mosses review is the thing he sought to emulate [3].\n\n### Emerson\n\nEmerson is the intellectual antagonist. In \"Compensation\" (1841) he complains of a sermon preached on the Last Judgment, in which the preacher assumed \"that judgment is not executed in this world; that the wicked are successful; that the good are miserable,\" and answers that justice is done here and now through the structure of things [6]. That is a naturalised providence: moral order immanent in nature, with no need of an interventionist God. It is the optimistic counterpart of what Melville's book denies or holds in suspense. The Pequod's fate is not compensation; the innocent drown with the guilty; Pip's mind is destroyed; the cosmos does not balance its books.\n\nEmerson's later essay \"Fate\" (in *The Conduct of Life*, 1860) is the more revealing comparison, because it postdates Melville's book and shows the Emersonian answer under pressure. There Emerson writes that \"Fate, then, is a name for facts not yet passed under the fire of thought; for causes which are impenetrated,\" that \"Intellect annuls Fate. So far as a man thinks, he is free,\" and that \"Providence has a wild, rough, incalculable road to its end\"; he concludes, \"Let us build altars to the Beautiful Necessity\" [5]. Compare Ishmael's warp: \"This warp seemed necessity\" [1]. Emerson accepts the necessity and converts it, by the act of thought, into freedom and beauty. Ishmael accepts it and is then interrupted. Ahab accepts it and is destroyed by hating it. The three responses (assimilation, suspension, defiance) form a map. It is notable, and I think it is not often remarked, that the Emerson of 1860 sounds more like the Ishmael of 1851 than the Emerson of 1841 does; I offer this as my own observation, resting on the dates of the texts.\n\n### Poe\n\nPoe is the case I can discuss least securely and flag as such. His relevant works (*The Narrative of Arthur Gordon Pym*, 1838, a sea-novel that ends in a white, veiled, unresolved apparition; \"The Imp of the Perverse,\" 1845, on the impulse to act against one's interest; *Eureka*, 1848, a cosmological prose-poem) were all in print before *Moby-Dick*, and I recall them from the public record without re-reading. The parallel with Melville is the white terror at the edge of the known world and the perverse self-destructive drive; the contrast is Poe's tendency to resolve the unanswerable into a closed aesthetic system (the cosmology of *Eureka*) where Melville leaves it open. If the comparison holds, it shows that the metaphysical white-out was a recognisable American mode and that Melville's distinctiveness lies in setting it among a social world (a ship's company) rather than in an isolated consciousness.\n\n### Dostoevsky\n\nDostoevsky's Ivan Karamazov is the instructive later case. Ivan's argument, in the chapter \"Rebellion,\" rejects the harmony that God's providence promises if it is purchased by the suffering of children: \"It's not God that I don't accept, Alyosha, only I most respectfully return Him the ticket\" [8]. Ahab and Ivan share a structure: the rebel who does not deny a God but refuses to ratify the governance. But the differences are telling. Ivan's argument is stated, in a discursive voice, in a novel that surrounds it with the elder Zosima's answer (the \"Pro and Contra\" structure is explicit); the debate is staged as a debate, between characters who are reasoners, and the novel's last movement (the Zosima chapters, the Alyosha ending) offers a Christian counter-vision whose force is, for most readers, undeniable even if not decisive. Moby-Dick has no Zosima. Mapple, the nearest counterpart, is a pulpit voice that does not meet Ahab in argument. Dostoevsky's novel, we might say, argues in a way that Melville's does not: it sets reasoners against one another and gives the reader the full dialectic. That comparison favours the objection that Melville does not argue, and it sharpens the point: where an author wants to argue, the form is dialogic and the positions are voiced by articulate opponents. Melville's book stages a drama in which only one party speaks metaphysics and the other is a whale. A caveat: Dostoevsky also resists easy attribution (Bakhtin made the classic case that his novels are polyphonic, with no authorial voice privileged), so the comparison does not make Dostoevsky a simple arguer either.\n\n### Conrad\n\nConrad, writing in a post-Darwinian world, drops the divine governor altogether and keeps the pattern-seeking human. A Johns Hopkins (Project Muse) article describes Conrad's letter of 20 December 1897 to R. B. Cunninghame Graham, whose centrepiece is a knitting machine, as a deliberate deflation of Graham's romantic optimism and a picture of a universe indifferent to human fate [14]. I did not retrieve the letter's wording and do not quote it. The knitting machine is the loom of Melville's Mat-Maker with the weaver subtracted: a mechanism that produces patterns without intention. It makes visible what Ishmael's loom has in suspension, the possibility that the cloth is woven by something that does not know it is weaving. *Heart of Darkness* and *Lord Jim* (I recall their general treatment of fate and the \"destructive element\" but did not re-read them) place the same kind of question on a ship, among men whose captains and codes fail. Conrad is the strongest evidence that Melville's providential problem was exportable to a more secular age without loss of force; he is also evidence of what Melville *did not* do, which is to settle on the indifferent-mechanism answer.\n\n### What the comparison shows\n\nFour lessons. (1) Providence, as the topic of serious fiction, is a mid- to late-nineteenth-century shared preoccupation, so the thesis that Melville was engaged with it is overdetermined by his context. (2) The characteristic treatment is not assertion but dramatised interpretation (Hawthorne), conversion of necessity into value (Emerson), dialectical staging (Dostoevsky) or mechanism (Conrad). (3) Melville's version is the one in which the interpretive question is put at greatest scale and left most open, and in which the principal rebel, rather than being answered, is destroyed. (4) The \"argument\" label fits Dostoevsky and Emerson better than it fits Melville and Hawthorne; \"inquiry\" fits all four.\n\n## Three Readers\n\n### The believer\n\nA believing reader (and there are many, including clerical readers of the novel) would say: the book is a great Christian tragedy in the Reformed key. Mapple's sermon states the truth, Ahab is the Jonah who will not repent, and the sea swallows him. Starbuck's piety and Queequeg's coffin and the *Rachel* complete a pattern of judgment and mercy. The \"Whiteness\" chapter is the dread of an unveiled God, the *tremendum*. Ishmael survives because the witness must survive; Job's messenger is preserved by the Lord. Melville's anguish is the anguish of a believer who cannot make the doctrine feel kind, which is, the believer notes, exactly the experience of the Psalmists and of Job. The skeptical passages are part of the lament, not a rejection of its addressee.\n\nThe believer's strongest evidence is the form of the plot (the pride-and-fall structure), the Epilogue's Job epigraph, the framing of Mapple's sermon, and Hawthorne's remark that a Melville who was a religious man \"would be one of the most truly religious\" [Hawthorne 1856, via reference work; not cited as a source]. The believer's weakness is the Epilogue's \"It so chanced,\" the Bunger parody, the Pip passage's \"indifferent as his God,\" and the fact that Mapple's God, to the extent he appears in the voyage, seems not to act on the ship at all. A theodicy requires a defence of God's justice; the book offers a defence only in the sermon and nowhere ratifies it.\n\n### The skeptic\n\nA skeptical reader would say: the book is a demonstration that providence is a projection. Every providential reading in the book is a character's reading, motivated by fear, vengeance, comfort or madness; the events are chance acting on a ship. Ahab sees malice because he lost a leg; Starbuck sees judgment because he is pious; Stubb sees a joke because he is cheerful; Pip sees God's foot on the treadle because he is out of his mind. The whiteness chapter says the cosmos is a blank onto which men paint their meanings. The Mat-Maker's synthesis gives chance \"the last featuring blow.\" The Epilogue's survivor lives because a coffin floated. Melville's genius was to show that a whole theology can be erected on a whale.\n\nThe skeptic's strongest evidence is the sheer number of competing interpretations with no adjudicator, the explicit chance-language, the whale's unmotivated animality (Starbuck's \"dumb brute... blindest instinct\"), and the whiteness chapter's talk of \"heartless voids\" [1]. The skeptic's weakness is the book's seriousness about the question: a book that merely debunked providence would not take Ahab so seriously, and the form of tragedy presupposes some meaning in the catastrophe. A more sophisticated difficulty: the skeptic's reading must treat the Fedallah prophecies, which are literally fulfilled, as either coincidence or narrator's engineering, and the latter is consistent with the book's treatment of fiction as arranged but undermines the claim that the cosmos is unarranged.\n\n### The literary formalist\n\nA formalist would say: both are looking in the wrong place. The book is a structure in which every available explanation of events is introduced, applied, and shown to fail to cover the facts. It is not an argument for or against providence but an investigation of the *forms of explanation* (the sermon, the soliloquy, the prophecy, the cetology, the myth) and their relation to the thing explained. The whale, as the text says, resists every classification; the doubloon, nailed to the mast, gets one reading from each passer-by; the book, as a whole, is the doubloon. The formalist cites the chapter on the Doubloon (where Ahab, Starbuck, Stubb, Flask, the Manxman, Queequeg and Pip each read the coin in turn, each in his own idiom, and Pip closes with a conjugation of looking, \"I look, you look, he looks\" [1]) as the book's own diagram of its method: one object, many readings, no arbiter.\n\nThe formalist's strength is that this reading fits the largest amount of the text, including the chapters (cetology, Doubloon, Whiteness) that the theological readings strain to absorb. The formalist's weakness is that it risks emptiness: if the book is only about interpretation, then it is an elaborate way of saying nothing, and the reader's sense that something is at stake, that the *Pequod*'s sinking matters, is unexplained. The strongest formalist, then, must concede that the book's forms of explanation are tested against *something* that does not yield, namely the whale and the sea, and that is a thesis (a minimal realism about a world that exceeds interpretation) and not a neutral observation.\n\n## The Verdict\n\nThe weights below are mine, set out with the grounds, and meant to be disputed.\n\n**The claim that Moby-Dick contains an explicit, stated doctrine of providence that Melville endorses.** Weak support. The word is rare and mostly ironic; no narrator speaks reliably for the author; the Mat-Maker synthesis breaks off and contradicts itself; the Epilogue assigns its one escape to both chance and the Fates in a single sentence. Thompson's strong version (a hidden satiric doctrine of divine malice) has the weakest support of all: the method is unfalsifiable and the biographical premise has been complicated by later documentary work.\n\n**The claim that the novel is organised around the question of providence, broadly construed (whether and how events are governed by meaning).** Strong support. The question recurs in every register (comic, tragic, sermonic, prophetic, speculative); the plot is built around a prophesied catastrophe and a hunt that is both willed and \"decreed\"; the best contemporary biographical evidence (Hawthorne's 1856 notes, the letters) shows the topic was a standing preoccupation. This is the claim on which believer, skeptic and formalist can agree, and it is the claim the research thesis should be stated as.\n\n**The claim that the novel stages a *test* of rival providential theories (Mapple's, Ahab's, Stubb's, Pip's, the Mat-Maker's) and refuses to certify any.** Strong-to-moderate support. It fits the Doubloon, the Epilogue's overdetermined vocabulary, the loom image's double use, and the genre comparison with Hawthorne. Its weakness is that it is partly a claim about what the book *withholds*, which is difficult to prove positively; and the layering hypothesis suggests some of the withholding may be an artefact of composition.\n\n**The claim that the novel leans to the skeptical side (providence unproven or illusory).** Moderate support. The chance-language, the indifference of nature, the parody of natural theology, the whiteness chapter, and the fate of the innocent point this way. Against it: the tragic form, the fulfilment of Fedallah's prophecies, the Job epigraph, and the sincerity of Mapple's delivery.\n\n**The claim that the novel leans to the orthodox side (providence vindicated in judgment).** Weak-to-moderate support. The pride-and-fall structure and the Jonah typology fit; but a vindication would need the book to ratify the sermon, and it does not.\n\n**The claim that the novel leans to a malign-providence reading (a cosmos governed by a cruel intelligence).** Weak support as a claim about the book; moderate support as a claim about Ahab's *perception*, which the book renders with immense force while declining to confirm.\n\n**The claim that Ishmael speaks for Melville.** Weak. Ishmael is a mobile persona whose seriousness varies; the book exploits the gap.\n\n**The claim that the book is a layered artefact whose position is an accident of composition.** Moderate support for the layering itself (several scholars working from letters and internal evidence agree that the book grew substantially after it was begun), weak support for the inference that this makes the final form incoherent.\n\nIf I had to compress the verdict into one sentence for the larger thesis: Melville does not *argue about* providence; he *builds an instrument* for examining it, and the instrument's readings come out differently depending on who looks, which is the argument's only conclusion. Whoever wants the book to settle the question has misread its form; whoever says it has nothing to say about the question has misread its subject.\n\n## Open Questions\n\nSeveral matters I could not settle with the sources reachable in this session. First, the exact scholarly pedigree of the layered-composition hypothesis: I cite Howard, Vincent, Olson, Hayford and Parker from the public record and from partial search summaries (a 1975 *American Literature* essay by James Barbour and a student paper that summarises Hayford), and the claims about their positions should be checked against the works themselves. Second, whether any named scholar, Bercovitch or otherwise, has argued that the Try-Works chapter is a late revision; the commissioning brief implied it, and I could not confirm it. Third, the exact dating of Melville's \"wicked book\" letter relative to the June 1851 \"hell-fire\" letter; I confirmed both phrases secondarily and the editorial dating should be taken from the Northwestern-Newberry *Correspondence*. Fourth, the unexpurgated text of Hawthorne's 1856 entry in the Centenary Edition; I verified the bowdlerised 1870 version directly and the fuller text only through a secondary quotation. Fifth, the relation between the Melville Society's recent work and the positions sketched here: recent scholarship (the last twenty years' Melville criticism on religion, secularism and the \"post-secular\") is thinly represented in this chapter, because the web tools available returned few scholarly pages, and a dedicated pass on it is warranted. Sixth, the Poe and Conrad comparisons rest largely on recall and one secondary article, and deserve primary re-reading. Seventh, a genuine unsolved question: what kind of evidence, short of a lost manuscript, could distinguish the \"book as inquiry\" reading from the \"book as unsettled accretion\" reading? It is not obvious that any could.\n\n## Sources\n\nPrimary texts (Tier 1) and scholarship (Tier 2) are listed first. All web items accessed 2026-10-24. Items marked \"recalled\" are cited from the public record and were not re-read or re-fetched in the preparation of this chapter.\n\n1. Herman Melville, *Moby-Dick; or, The Whale* (1851), Project Gutenberg eBook #2701. https://www.gutenberg.org/cache/epub/2701/pg2701.txt (full text read; all quotations in this chapter from this text; chapters cited include \"Loomings,\" \"The Sermon,\" \"The Quarter-Deck,\" \"The Whiteness of the Whale,\" \"The Hyena,\" \"The Mat-Maker,\" \"The Try-Works,\" \"The Doubloon,\" \"The Pequod Meets the Rachel,\" \"The Symphony,\" and the Epilogue). Tier 1.\n2. Nathaniel Hawthorne, *Passages from the English Notebooks* (ed. Sophia Hawthorne, 1870), Project Gutenberg eBook #7878; entry beginning \"November 30th.\" https://www.gutenberg.org/ebooks/7878 (verified directly). Tier 1.\n3. Herman Melville, \"Hawthorne and His Mosses,\" *The Literary World*, 17 and 24 August 1850 (pseudonym \"a Virginian spending July in Vermont\"). Wikisource transcription, https://en.wikisource.org/wiki/Hawthorne_and_His_
