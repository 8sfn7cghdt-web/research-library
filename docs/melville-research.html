ww.encyclopedia.com/women/dictionaries-thesauruses-pictures-and-press-releases/starbuck-mary-coffyn-164445-1717. Accessed 2026-10-24. (Tier 5.)\n19. National Park Service, New Bedford Whaling National Historical Park, \"Seamen's Bethel\" (page last updated September 27, 2024). https://www.nps.gov/nebe/planyourvisit/bethel.htm. Accessed 2026-10-24. (Tier 1/2, institutional.)\n20. Reference-work accounts of Father Taylor and the Seamen's Bethel as models for Father Mapple, including a Walt Whitman Archive encyclopedia entry (https://whitmanarchive.org/item/encyclopedia_entry218) and a Wikipedia summary used only as a pointer to those sources (not cited for any claim); surfaced in search, not read in full. Accessed 2026-10-24. (Tier 5; flagged.)\n21. John L. O'Sullivan (attribution conventional), \"Annexation,\" *United States Magazine and Democratic Review* 17, no. 85 (July-August 1845): 5-10, ed. David Tucker, Teaching American History. https://teachingamericanhistory.org/document/annexation/. Accessed 2026-10-24. (Tier 1.)\n22. Abraham Lincoln, Second Inaugural Address, March 4, 1865, Yale Law School Avalon Project. https://avalon.law.yale.edu/19th_century/lincoln2.asp. Accessed 2026-10-24. (Tier 1.)\n23. G. W. Leibniz, *Theodicy*, trans. E. M. Huggard, ed. Austin Farrer, Project Gutenberg ebook 17147 (first 100,000 characters read). https://www.gutenberg.org/files/17147/17147-h/17147-h.htm. Accessed 2026-10-24. (Tier 1.)\n24. *Melville's Marginalia Online*, Boise State University (catalog of books Melville owned, borrowed or consulted; entry for Bayle's *Dictionary*, 1710 London ed., lost). https://www.melvillesmarginalia.org/Search.aspx. Accessed 2026-10-24. (Tier 2.)\n25. Millicent Bell, \"Pierre Bayle and *Moby Dick*,\" *PMLA* 66, no. 5 (September 1951): 626-648, DOI 10.2307/459528 (extract and footnotes read). https://www.cambridge.org/core/journals/pmla/article/pierre-bayle-and-moby-dick/854551646D1285D3FC4F0CC8496A63CB. Accessed 2026-10-24. (Tier 2.)\n26. Thomas Vargish, \"Gnostic *Mythos* in *Moby-Dick*,\" *PMLA* 81, no. 3 (June 1966): 272-277, DOI 10.2307/460812 (abstract only). https://www.cambridge.org/core/journals/pmla/article/gnostic-mythos-in-mobydick/614D9E3E7AB7FA1DDE02F0D6C8AFE09B. Accessed 2026-10-24. (Tier 2.)\n27. Alexander Pope, *An Essay on Man* (1733-34), Project Gutenberg ebook 2428 (first 100,000 characters read). https://www.gutenberg.org/files/2428/2428-h/2428-h.htm. Accessed 2026-10-24. (Tier 1.)\n28. Voltaire, *Candide* (1759), trans. in the Boni and Liveright (Modern Library) edition of 1918, Project Gutenberg ebook 19942 (first 100,000 characters read). https://www.gutenberg.org/files/19942/19942-h/19942-h.htm. Accessed 2026-10-24. (Tier 1.)\n29. Herman Melville, \"Hawthorne and His Mosses,\" *The Literary World*, August 17 and 24, 1850 (ibiblio transcription; wording to be checked against the printing). https://ibiblio.org/eldritch/nh/hahm.html. Accessed 2026-10-24. (Tier 1, transcription.)\n30. Herman Melville to Nathaniel Hawthorne, November 1851, Biblioklept transcription (edition not named). https://biblioklept.org/2014/09/09/letter-to-nathaniel-hawthorne-november-1851-herman-melville/. Accessed 2026-10-24. (Tier 6 as a host; text to be verified against Northwestern-Newberry or Cohen.)\n31. Nathaniel Hawthorne, English Notebooks, entry of November 20, 1856, as reproduced on Biblioklept (credits Charles Olson, *Call Me Ishmael*). https://biblioklept.org/2012/06/08/nathaniel-hawthorne-on-herman-melville-he-can-neither-believe-nor-be-comfortable-in-his-unbelief/. Accessed 2026-10-24. (Tier 6 as a host; secondary reproduction of a Tier 1 text.)\n32. Harvard DASH document (2017; author not identified in my retrieval; full text not retrieved, 429 error) as surfaced in search, reporting Werge's position. https://dash.harvard.edu/handle/1/37736772. Accessed 2026-10-24. (Tier 5/6; flagged.)"}, {"order": 9, "file": "09_Providence_In_Recent_Scholarship_And_Afterlives.md", "title": "Providence in Recent Scholarship and Afterlives of Moby-Dick", "summary": "", "body": "# Providence in Recent Scholarship and Afterlives of Moby-Dick\n\n## Bottom Line\n\n> Since about 2005 the argument over providence in *Moby-Dick* has not been settled so much as translated. The old question, whether Melville believed in a governing God, now appears as a question about indifferent nature, about the histories of slavery and empire that the Pequod carries, and about whether obsessive human will can be checked by anything. The institutional life around the book is vigorous: a society and journal in their third decade, a quarter-century-old reading marathon, operas, films and seminars that still teach the book as a contest among fate, chance and free will. The recent scholarship is harder to survey than the culture, because most of it is paywalled; what I could verify is reported below, and what I could not is marked.\n\n## What can and cannot be known from the open web\n\nA chapter on recent scholarship has a particular difficulty, and it is better to state it at the outset. The scholarly literature on Melville since 2005 lives mostly in *Leviathan*, in university-press monographs, and in journals such as *American Literary History* and *ESQ*. Project MUSE, which hosts *Leviathan*, returned a verification challenge rather than article text when I tried to open individual articles, and its journal page shows no open access [1]. Catalogue records, publisher pages and search-engine abstracts therefore carry much of the weight below.\n\nThe discipline this imposes is simple. Where I fetched a page and read it, I say what it states. Where I know a work only through a catalogue entry or a search summary of an abstract, I say so, and I attribute the argument to the source that reported it instead of presenting it as my own reading of the book. I have not tried to write a survey of the field in the sense a specialist would. I have tried to show what the field looks like from the places a general reader can reach, and to mark the gaps.\n\n## The institutional frame: a society, a journal, a bicentennial\n\nThe Melville Society publishes *Leviathan: A Journal of Melville Studies* through Johns Hopkins University Press. Project MUSE's journal page lists volumes from 1999 forward and gives volume 28, number 2 (June 2026) as the most recent issue [1]. The Society's own page says the journal appears three times a year, that volume 27, number 3 (October 2025) was a special issue on queer Melvilleana, and that membership dues cover only about half the publication costs, with the Henry Murray Endowment, begun in 1990, providing small stipends for the editorial staff [2]. Those two pages are as close to an institutional census as the open web allows, and they establish one present-tense fact with some confidence: as of autumn 2026 there is a functioning scholarly society and a peer-reviewed journal devoted to a single author, and the journal's most recent special issue, whatever its merits, was not about providence. That is itself informative. The field's attention has moved across themes of identity, ecology and empire more than across the theological questions that dominated mid-century Melville criticism.\n\nThe bicentennial of Melville's birth, in 2019, concentrated this activity. A search summary of a Johns Hopkins University Press interview with the journal's editors, Samuel Otter and Brian Yothers, reports that *Leviathan* gave four issues over a year to a \"Melville at 200\" series, mixing scholarship, colour reproductions of artistic responses, and personal essays, and that 2019 was also the centenary of the \"Melville Revival\" [3]. The same summary reports that a March 2020 issue carried keynotes and reports from the twelfth International Melville Society Conference, held in New York in June 2019 [3]. I could not open the press page itself, which returned a 403 error, so the details rest on the search summary and should be checked against the issues. A caution follows from that: I found no 2019 book-length study that reframed providence in the novel, and I will not invent one. The bicentennial's most visible monograph on the novel, discussed below, is a natural history.\n\n## Gnostic and theological readings: an old argument that keeps reappearing\n\nThe Gnostic reading is much older than the period this chapter covers, and it is worth saying so plainly. Thomas Vargish's 1966 *PMLA* article, \"Gnostic Mythos in *Moby-Dick*,\" argued that Melville drew on Gnostic myths and doctrines more precisely and consistently than earlier critics had noticed, and that some passages are hard to understand without them; Vargish took care to say that Gnosticism was not the only source of the book and that he did not mean to diminish Zoroaster, Milton or Hindu myth [4]. Gnosticism matters to the question of providence because the Gnostic picture inverts it. In the classical Gnostic myths the visible cosmos is the work of a lesser or malign maker, so that the order one observes is evidence against, not for, a good governing God. If Vargish is right even in part, then the white whale may be read as the face of that false order, and Ahab's rebellion acquires a theological dignity it lacks on a plainer reading.\n\nRecent work revives this line in new settings. Federico Bellini's 2016 chapter, \"The Gnostic Dark Side of Nature in Herman Melville and Cormac McCarthy,\" published in R. J. Schneider's collection *Dark Nature: Anti-Pastoral Essays in American Literature and Culture* (Lexington Books), reads the novel as presenting nature as a thin surface over an abyss of indifferent forces, and describes Melville's response as an ironic devotion without faith [5]. A 2019 Texas State master's thesis by Christi Hudgins pairs Gnosticism in *Moby-Dick* with *Blood Meridian*; I saw only its title and catalogue entry, not its abstract, so I cannot say what it argues [6]. These are modest sources. The point I draw from them is limited: Gnostic readings persist at the edges of the field, and in the ecological register they have found a new use. The Gnostic \"alien\" cosmos and the ecocritic's indifferent nature are close cousins.\n\nWhether the Gnostic reading is correct is contested, and the contest is old. Against it stands the readier explanation that Melville took his imagery of malign order from Calvinist and Romantic sources more than from any Gnostic text; I cannot adjudicate that here, and the chapter on Melville's sources is the place where it is argued. A Harvard undergraduate thesis from 2017 on Ishmael's Calvinism, which I could identify by title but not read, shows the rival reading still being taught: that the \"unfailing comfort\" of predestination is a theme the text's own repeated vocabulary invites [7]. Student theses are weak evidence for the state of a field, and I cite this one only as a sign of what is being taught.\n\nAs for the \"post-secular\" and \"political-theological\" readings that one might expect to find, I must report an honest negative. Searches for a post-secular or Schmittian political-theology reading of *Moby-Dick* turned up no work I could verify. The nearest items were a 2016 bulletin paper by Yui Kasane, listed as \"A Fragment of the Never-Ending: A Political Reading of Moby-Dick,\" whose page I could not reach, and a Rutgers seminar description that frames the book around nationalism, cosmopolitanism and political nihilism [8]. It would be easy to write a confident paragraph about a post-secular turn in Melville studies. The evidence I can reach does not support one, and I do not think it should be asserted.\n\n## The whale as providence or indifference: ecocriticism and animal studies\n\nThe best-documented recent development is ecological. Richard J. King's *Ahab's Rolling Sea: A Natural History of Moby-Dick* (University of Chicago Press, 2019) reads the novel against what Melville and his contemporaries knew of the ocean around 1851, compares Ahab's and Ishmael's views of the sea with present anxieties about its health, and argues that Ishmael shows what we would now call environmentalist tendencies, though stewardship would have been foreign to Melville [9]. The Association for the Study of Literature and Environment posted the book on 10 November 2019 and reported on 21 November 2019 that *Science* (reviewed by Christopher Kemp) and *The American Scholar* (reviewed by William Howarth) had published admiring reviews [9][10]. The ASLE posts are an association's notices, so they establish the book's existence and reception more than its quality.\n\nThe ecological turn bears on providence in a specific way. In the older theological argument the question was whether the whale is a sign of a purpose. In the ecological argument the whale is a body, hunted, rendered and, in the long view, driven toward scarcity, and the question becomes whether human readers have the right to read it as a sign at all. A 2025 article by Chak-kwan Ng in *Ecozon@* treats *Moby-Dick* as the foundational \"classical whale sublime,\" shaped, in her account, by nineteenth-century capitalist conditions and the limits of Melville's whale knowledge, and contrasts it with the relational whale writing of Doreen Cunningham's *Soundings* and Rebecca Giggs's *Fathoms* [11]. A search summary also lists a 2026 *Ecozon@* essay by Véronique Bergen on *Écume*, a 2023 novel that revisits *Moby-Dick* in an Anthropocene frame, and a 2014 *Journal of Ecocriticism* article by Iris Ralph on the novel as a \"cetacean text\" [12]. I read none of these beyond their abstracts or summaries, and I rely on them only to show the direction of travel.\n\nThere is an honest counter-argument, and it should be stated at full strength. A reader might say that the ecocritical whale simply replaces the old providential symbol with a new one: where Ahab saw malice and Mapple saw judgment, the critic sees ecological catastrophe foretold. If so, the whale remains a sign and the interpretive habit that Melville dramatizes in Ahab, reading the world as a message addressed to oneself, survives under a green banner. Melville seems alert to this danger. The chapter on the whale's whiteness, which I discuss in the chapter on the novel's metaphysics, offers every reading of the whale's color and lets none of them stand. By my own reading, the ecological turn is strongest when it takes that lesson seriously and weakest when it assigns the whale a moral. That is an inference, not a finding of the cited works.\n\n## Race, slavery, empire and the Pacific: fate under a different description\n\nA second family of readings reframes \"fate\" as history. The Pequod's crew is a Pacific and Atlantic labor force, and scholars have asked what it means that the ship's fate is bound to bodies the novel treats as colonized, enslaved or expendable. Sterling Stuckey's *African Culture and Melville's Art* (Oxford University Press, dated 2008 in some records and 2009 in others) argues, according to reviews and the publisher's description reported in my search, that both *Moby-Dick* and \"Benito Cereno\" turn on an African cultural axis, and it reads Pip in relation to African American street festivals Melville knew in Albany [13]. I could not open the MUSE copy of a review, so this rests on library and publisher records and on a search summary.\n\nOn the Pacific side, Geoffrey Sanborn's *Whipscars and Tattoos: The Last of the Mohicans, Moby-Dick, and the Maori* (Oxford University Press, 2011) is described in library and bookseller records as arguing that Cooper and Melville both drew on accounts of the Maori, and that Melville drew on the life of Te Pehi Kupe in shaping Queequeg [14]. Paul Lyons's *American Pacificism: Oceania in the U.S.*, listed on his University of Hawai'i faculty page with an uncertain date (2006 in one record, 2016 for a later imprint in another), is reported in a review to read Queequeg as a figure through which Melville imagines Anglo-American and Oceanian lives bound together in larger historical and economic structures, with the monkey-rope as the image of that binding [15]. A Cambridge history chapter, as reported in my search, says Pacific Islanders were already a visible presence in American maritime centers and made up as much as 20 percent of the U.S. whaling fleet [15]. Hester Blum's *The View from the Masthead* (University of North Carolina Press, 2008) treats sailors as readers and writers rather than as figures of crude labor, and the Commonplace review reports that it reads the novel's \"Etymology\" and \"Extracts\" as a whaler's commonplace book [16].\n\nOn \"The Town-Ho's Story,\" a search summary attributes to a scholar named Hoberek (I could not confirm the first name) a 2023 article in *American Literary History* that reads the chapter through realistic representations of insurrection and argues that Steelkilt's mutiny shows democracy resting on control of space and information more than on constitutional procedure [17]. I could not read the article, and the summary does not say whether it treats slavery, so I report only what the summary reports.\n\nHow does this reframe providence? In the older argument the providence at stake was the cosmos's. In these readings, the providence at stake is the historical order that distributes risk, and the question of whether the whale is a sign yields to a harder question: who pays when a captain reads the world as a sign. Pip's madness, on this approach, is not only a metaphysical vision but a testimony about what a captain's cosmic quarrel costs those with no say in it. I find that persuasive as a reading of the text, but it is a reading, and I mark it as my own inference. What the cited works establish is that these questions are now central to the field. I cannot say, from the sources I reached, how many scholars hold that the novel's providence question has been \"replaced\" by these questions, and the more cautious claim is that they have been joined.\n\n## Reading the book in public: marathon, Big Read, guide, seminar\n\nThe most striking present-tense fact about the book's afterlife is a crowd. The New Bedford Whaling Museum holds an annual nonstop reading of the whole novel. The Melville Society's news page says the museum has held the event since 1997, in mid-winter, marking the anniversary of Melville's 1841 departure from New Bedford and Fairhaven aboard the whaleship *Acushnet*, and that the thirtieth reading ran from 2 to 4 January 2026 [18]. WBUR reported on 1 January 2026 that the reading is about 25 hours long, begins on 3 January at noon, is live-streamed, and expected upward of 240 readers, with more than 2,400 attendees over the 2025 free weekend [19]. A search summary reports a higher 2026 total of 3,193 visitors for the weekend, citing the museum's president, but I did not fetch that report, so I use WBUR's figure for 2025 and treat the 2026 total as unverified [19]. What the event shows is not that the audience shares Mapple's faith. It shows that a congregation gathers each winter to hear the book aloud, in a city whose chapel the novel made famous.\n\nThe digital counterpart was the Moby-Dick Big Read of 2012, an online audio project co-curated by the writer Philip Hoare and Angela Cockayne, hosted by Plymouth University. Search summaries of press materials report that it ran 135 chapters over 135 days, each read by a different person and paired with commissioned art, with Tilda Swinton reading the first chapter and Simon Callow reading a launch event on 16 September 2012 [20]. These details rest on organizers' materials and secondary summaries.\n\nNathaniel Philbrick's *Why Read Moby-Dick?* (Viking, 2011) is the best-known popular case for the book. *Publishers Weekly* reviewed it on 15 August 2011, calling it approachable and passionate, \"less lit-crit and more readers' guide,\" and noting that it connects the novel to multiculturalism, homoeroticism and transcendental experience of nature [21]. Providence is not among the themes the review lists. That fits the pattern: the book's public advocates argue for its relevance through character, democracy and nature more than through its quarrel with God.\n\nIn the classroom the quarrel survives. A Rutgers seminar scheduled for fall 2026 (358:442, instructor listed as Iannini) describes a close reading of the novel organized around \"fate, chance, and free will,\" nationalism and cosmopolitanism, and the competition among literature, science and religion as explanations of the universe, and applies them to political nihilism, economic exploitation and ecological crisis [8]. A single course description is a thin basis for a claim about teaching generally. As an instance it is useful, because its framing nearly restates the providence question as a syllabus.\n\n## Pulpit and press: Mapple's sermon after the century of doubt\n\nMapple's sermon is the novel's most direct statement of providence, since it tells a congregation that disobedience to a governing God ends in the whale's belly and that obedience ends in deliverance. How the sermon is read has long divided religious and secular critics. D. Bruce Lockerbie's 1963 essay \"The Greatest Sermon in Fiction,\" in *Christianity Today*, surveys the divide: Lawrance Thompson, in *Melville's Quarrel with God*, reads the sermon as equivocal and undercutting Christian doctrine; Lewis Mumford treats it mainly as New England oratory; and critics including Howard Vincent, W. H. Auden and Randall Stewart see it as essential to the book's meaning, with Jonah offering a standard against which Ahab's sin can be measured, a view Lockerbie shares [22]. The essay predates the period of this chapter, but it shows that religious periodicals were reading the sermon as a doctrinal text long before the recent scholarship.\n\nThe tradition continues. Shalom Carmy, a philosopher at Yeshiva University and editor emeritus of *Tradition*, published \"Observe His Prayer\" in *First Things* in the August/September 2017 issue. He questions Mapple's account of Jonah as a model of repentance, noting that Jonah's prayer in the second chapter of the biblical book contains no confession, remorse or pledge to go to Nineveh, and that the Jonah who finally goes is compliant more than truly obedient and resents God's mercy [23]. Carmy grants that Mapple's emphasis on action over feeling suits a whaling congregation, but judges that measured against the Psalms, Mapple's repentance falls short. Notice what this does to the providence question. Carmy does not accuse Mapple of misdescribing God's governance; he accuses him of misreading the human response to it. That is a theologian's disagreement with a theologian, conducted inside the sermon's own premises, and it shows the sermon still working as a text that preachers and lay theologians argue with. I found no sermon series or theological monograph from the period that I could verify and describe, and I do not claim that Mapple and Ahab are widely used in current preaching; the evidence I reached shows only that they are cited in religious journalism and taught in literature seminars.\n\n## The screen, the stage and the opera: providence by adaptation\n\nAdaptations compress and, in compressing, take sides. John Huston's 1956 *Moby Dick*, with Gregory Peck as Ahab and Orson Welles as Mapple, was scripted by Ray Bradbury with Huston; a 2018 essay in the *Hillsdale Collegian* (a student newspaper, so a weak source for anything but an outline) reports that Bradbury admitted he had never finished the novel and that he later fictionalized the production in *Green Shadows, White Whale* (1992) [24]. The essay says nothing about providence, and I cannot say how the film handles it without having studied the film directly, which I have not. Welles's own *Moby Dick—Rehearsed*, a play within a play in which a Shakespearean company rehearsing *King Lear* is diverted to stage Melville's novel on a bare stage, ran at the Duke of York's Theatre in London from 16 June to 9 July 1955, according to search summaries that draw on theatre-history sites, which are secondary sources of uneven quality [25]. A play that stages Ahab as a Lear-like tragic hero tilts the novel toward the tragedy of will.\n\nThe most recent major stage adaptation I could verify is Jake Heggie's opera *Moby-Dick*, with a libretto by Gene Scheer, which the Dallas Opera premiered on 30 April 2010 at the Winspear Opera House, with Ben Heppner as Ahab, Morgan Smith as Starbuck, Jonathan Lemalu as Queequeg, Talise Trevigne as Pip and Stephen Costello as Greenhorn, the opera's name for Ishmael; it ran to 16 May 2010 [26]. KERA's account, by Jerome Weeks, reports Olin Chism's judgment that the libretto was faithful to Melville's plot and tone and that the production was widely praised [26]. An opera gives Pip a soprano or tenor line and makes Ahab's will audible, so it shifts the emphasis from argument to feeling. I do not have enough to say how it renders providence, and I would be inventing if I claimed more.\n\nRon Howard's *In the Heart of the Sea* (Warner Bros., December 2015) is not an adaptation of the novel but of Nathaniel Philbrick's history of the whaleship *Essex*, whose sinking by a whale in 1820 Melville knew and used. The Numbers lists a $100 million budget and a worldwide gross of about $94.3 million, of which $25.0 million was domestic [27]. The commercial result is relevant here in one limited way: the film suggests that the historical Essex story, with its survivors, hunger and cannibalism, does not carry the metaphysical argument by itself. The novel does something the history does not, which is to turn an accident into a theological problem. I treat that as inference.\n\n## The newest metaphors: monomania and machines\n\nThe most recent afterlife is the use of Ahab as a figure for runaway systems. A March 2026 Substack essay by a writer identified only as \"mtraven\" reads Ahab as a human-technology hybrid whose ivory leg and bond with the ship make him a kind of cyborg, likens his obsessive drive to fears of misaligned artificial intelligence, and sets Ishmael's openness against Ahab's fixity as a way out of fate's machinery [28]. This is an informal source, low in the evidentiary hierarchy, and I cite it only as evidence that the analogy is being made in public, not as a scholarly argument. The pairing has an obvious logic: Ahab states a single goal and subordinates every other value to it, which is the structure of the alignment worry. It also has an obvious limit. Ahab's goal is vengeance, which is a passion, whereas the machine's goal in the alignment story is arbitrary. A reader who insists on the difference may find that the analogy illuminates the form of Ahab's will but not its content, and that, in turn, is a reminder of why the novel keeps being read as an argument about providence: the question of whether anything outside the will can check it. That last sentence is my reading.\n\n## Editions and the shape of the text\n\nReaders now meet the novel in many editions, and a reader's edition shapes which book they meet. The Norton Critical Edition, third edition, edited by Hershel Parker, is built on the Hayford-Parker text of 1967 with biographical footnotes, and includes illustrations and, according to retailer listings, forty-four reviews and interpretations spanning three centuries; listings give a U.S. date of December 2017 and a U.K. date of September 2018, so the date is uncertain [29]. Retailer listings are weak evidence for a present-tense claim about what is in print, and I could not confirm the edition's current availability on a publisher page. I did not examine Everyman's Library, Penguin or other current editions, and I cannot report on them.\n\n## What changed, and what did not\n\nTaking the verified material together, three claims survive scrutiny. First, the providence question has not disappeared but has migrated: it appears as the Gnostic alien cosmos, as the indifference of nature, and as the historical order that spends bodies in pursuit of a captain's quarrel. Second, the institutional world around the book is healthy, with a society, a journal, a thirty-year marathon and recurring adaptations; but its most recent journal special issue and most recent monograph that I could verify were about queer Melvilleana and natural history, not about God. Third, the public relation to the book is not hostile to its theology but largely indifferent to it: the advocates, the adapters and the marathon crowd praise its democracy, its sea and its madness, and leave the sermon to preachers and professors.\n\nAgainst this account stands a strong objection. My sampling was small and drawn from what the open web exposes, and a specialist with access to the journals could easily show that theological readings of the novel remain active in ways I could not see. I accept the objection. The claim I defend is not that providence has ceased to matter to Melville scholars, but that the open record shows the question being restated in other vocabularies, and that anyone who wants to measure it should read the last five years of *Leviathan* and *ESQ* directly.\n\n## Open Questions\n\nIs there a post-secular or political-theological reading of *Moby-Dick* in the peer-reviewed literature that of the kind one would expect? I found none I could verify, and a specialist search of the MLA International Bibliography would settle it. What does the 2025 *Leviathan* essay on the novel's \"animal apocalypse,\" which a search summary reported but I could not open, argue, and who wrote it? How do the Huston film and the Heggie opera render the sermon and the question of fate, and does either soften Mapple's confidence? Are Mapple and Ahab still used in current preaching, or only in literary seminars? Which of the current editions, Everyman's Library, Penguin Classics, Norton Critical, remain in print, and what apparatus do they give on providence? And does the AI analogy do any work beyond the rhetorical?\n\n## Sources\n\n[1] Project MUSE, \"Leviathan: A Journal of Melville Studies,\" About this Journal. Johns Hopkins University Press. https://muse.jhu.edu/journal/601 (Tier 2; accessed 2026-10-24). Lists volumes from 1999 and volume 28, numbers 1 and 2 (March and June 2026).\n\n[2] The Melville Society, \"Leviathan: A Journal of Melville Studies.\" https://melvillesociety.org/leviathan (Tier 2; accessed 2026-10-24). Frequency, volume 27.3 (October 2025), funding.\n\n[3] Johns Hopkins University Press newsroom, \"Leviathan Celebrates Melville 200.\" https://press.jhu.edu/newsroom/leviathan-celebrates-melville-200 (returned HTTP 403 on fetch; content known only from a search-engine summary; accessed 2026-10-24). Tier 2/5.\n\n[4] Vargish, Thomas. \"Gnostic Mythos in Moby-Dick.\" *PMLA* 81, no. 3 (June 1966): 272-277. https://www.cambridge.org/core/journals/pmla/article/gnostic-mythos-in-mobydick/614D9E3E7AB7FA1DDE02F0D6C8AFE09B (abstract page; accessed 2026-10-24). Tier 2.\n\n[5] Bellini, Federico. \"The Gnostic Dark Side of Nature in Herman Melville and Cormac McCarthy: Carrying the Fire out of Arcadia.\" In *Dark Nature: Anti-Pastoral Essays in American Literature and Culture*, ed. R. J. Schneider. Lanham, MD: Lexington Books, 2016, pp. 61-74. https://publicatt.unicatt.it/handle/10807/94497 (repository record; accessed 2026-10-24). Tier 2.\n\n[6] Hudgins, Christi. \"The Poisoned Well: Gnosticism in Moby-Dick and Blood Meridian.\" Master's thesis, Texas State University, 2019. https://digital.library.txst.edu/items/e041135c-8bc4-4997-a694-be6b0b97177c/full (title and catalogue entry only; abstract not read; accessed 2026-10-24). Tier 2 (thesis).\n\n[7] \"'That Unfailing Comfort Is, It's All Predestinated': Ishmael's Calvinist...\" Harvard DASH, 2017 (undergraduate thesis; PDF unreadable on fetch; title only). https://dash.harvard.edu/bitstream/handle/1/37736772/KENT-DOCUMENT-2017.pdf (accessed 2026-10- -dick-marathon (accessed 2026-10-24). Tier 4. The 2026 attendance figure of 3,193 appears only in a search summary of a museum-attributed report and is unverified.\n\n[20] Moby-Dick Big Read, 2012: Watershed listing https://www.watershed.co.uk/studio/node/1086; Open Culture, September 2012, https://www.openculture.com/2012/09/the_moby_dick_big_read_celebrities_and_everyday_folk_read_a_chapter_a_day_from_the_great_american_novel.html; project site https://www.mobydickbigread.com/events (known via search summaries; accessed 2026-10-24). Tier 5.\n\n[21] \"Why Read Moby-Dick?\" (review), *Publishers Weekly*, 15 August 2011. https://www.publishersweekly.com/9780670022991 (accessed 2026-10-24). Tier 5.\n\n[22] Lockerbie, D. Bruce. \"The Greatest Sermon in Fiction.\" *Christianity Today*, 8 November 1963. https://christianitytoday.com/?p=62409 (accessed 2026-10-24). Tier 6 (religious periodical); pre-period, used for the history of the debate.\n\n[23] Carmy, Shalom. \"Observe His Prayer.\" *First Things*, August/September 2017. https://firstthings.com/observe-his-prayer/ (accessed 2026-10-24). Tier 6 (First Things is a religious-conservative journal of opinion).\n\n[24] Rowan, Nic. \"Conserving the Classics: John Huston's Moby Dick.\" *The Hillsdale Collegian*, 29 November 2018 (updated 12 July 2022). https://hillsdalecollegian.com/?p=47911 (accessed 2026-10-24). Tier 6 (student newspaper).\n\n[25] On *Moby Dick—Rehearsed* (London, 1955): theatre-history pages surfaced by search, including https://wellesnet.com/moby-dick-rehearsed-still-inspires-theater-troupes/ and https://lostmediawiki.com/Moby_Dick—Rehearsed_(lost_Orson_Welles_footage_of_play_performance;_1955) (not fetched; dates and cast from search summary; accessed 2026-10-24). Tier 5/7, weak.\n\n[26] Weeks, Jerome. \"Dallas Opera's Moby-Dick debuts spectacularly.\" KERA Art&Seek, 1 May 2010. https://artandseek.org/2010/05/01/dallas-operas-moby-dick-debuts-spectacularly/ (accessed 2026-10-24). Tier 4/5 (public-radio arts coverage).\n\n[27] The Numbers, \"In the Heart of the Sea (2015).\" https://www.the-numbers.com/movie/In-the-Heart-of-the-Sea (accessed 2026-10-24). Tier 5 (box-office aggregator).\n\n[28] mtraven, \"Ahab as Cyborg,\" Substack, 19 March 2026. https://mtraven23.substack.com/p/ahab-as-cyborg (accessed 2026-10-24). Tier 7 (informal; cited as evidence of a circulating metaphor, not for any fact about the novel).\n\n[29] *Moby-Dick: A Norton Critical Edition*, 3rd ed., ed. Hershel Parker (W. W. Norton), ISBN 9780393285000. Retailer listings, e.g. https://www.harvard.com/book/9780393285000 and https://wwnorton.co.uk/books/9780393288582-moby-dick (publication dates differ: December 2017 U.S., September 2018 U.K.; accessed 2026-10-24). Tier 5, weak for current availability."}, {"order": 10, "file": "Future_Trajectory.md", "title": "The Inquiry That Refuses to Close", "summary": "", "body": "# The Inquiry That Refuses to Close\n\n## Bottom Line\n\n> By 2050 Melville is most likely still first rank and the argument about providence is still unsettled, but it will be asked in other words. The modal outcome, which I call Translated Canon, sits at 42–56%: Moby-Dick keeps its place as the lead candidate for the great American novel, the old question of whether Melville believed in a governing God is asked about indifferent nature, slavery and empire, and unchecked will, and no reading wins. The serious threat is not a verdict against the book but a thinning of the people who read it. Hollowed Canon, where the rank stays and the readership and scholarly field drain beneath it, is the runner-up at 18–28%. Providence Returns as the organizing frame is 8–15%, Demoted Classic 7–14%, and Evidence Settles It 3–7%. The modal case is about a coin flip. Treat the whole set as wide.\n\nThe thing to take from the number is its shape. The easy call is that a canonical author simply persists, and the counted record does support persistence for an author with an edition, a society and a journal. The measured series on belief and on the humanities pipeline point the other way, and I refuse to let the first erase the second. That tension is why the runner-up is as large as it is.\n\n## Method\n\nThe question has two layers that ordinary forecasts blur: where Melville's standing sits, and how his providence argument is read. I cut the space on both at once. The first cut asks whether Melville stays first rank. The second asks whether the reading base under that rank (students, scholars, general readers) stays intact. The third asks what frame providence occupies if it survives: peripheral, central, or settled by new evidence. Each outcome falls in exactly one cell, and each cell gets a name and a range.\n\nNo prediction market exists. I searched Polymarket, Kalshi, Manifold, Metaculus and Good Judgment on 2026-10-24 for Melville, Moby-Dick, canon standing, the great American novel, humanities degrees, and belief in God, and found nothing. A web search cannot enumerate platform catalogues, so the honest wording is \"not found,\" not \"does not exist.\" Every number therefore comes from a counted reference class or a multiplied decomposition, and the derivation under each scenario lets a reader rebuild it.\n\nThe weight went where the grounding held. Three separate decompositions of the hollowing risk, built from different factors, land at 17%, 20% and 27%; that agreement is the strongest piece of evidence in the forecast, and it sets the range for Hollowed Canon. I set aside a broad tally of authors who were canonical in 1950 and are still canonical now. It looks like a base rate and is not: it is assembled from survivors, and several entries (Kafka, Dickinson, Fitzgerald) were not yet fully canonical in 1950. What I kept is narrower and more honest, and it appears under Base Rates. Where well-grounded readings still diverge, I widened the range instead of splitting the difference. The horizon is generational, so wide ranges are the right shape. This is a forecast of what will happen, not of what would be good for the field.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">How Melville&#x27;s providence argument is read, and where his standing sits, by 2050<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Translated Canon<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"391.2\" y=\"8\" width=\"68.7\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"468.0\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">42–56%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Hollowed Canon<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"273.4\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"330.5\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">18–28%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Providence Returns<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"80\" width=\"34.4\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"266.6\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">8–15%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Demoted Classic<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"219.4\" y=\"116\" width=\"34.4\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"261.7\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">7–14%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Evidence Settles It<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"199.7\" y=\"152\" width=\"19.6\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"227.4\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">3–7%<\/text><\/svg><figcaption>Midpoints sum to about 99%; the remainder is unmodeled shock. The modal scenario is roughly a coin flip. <span class=\"credit\">Source: Scenario probabilities, this forecast.<\/span><\/figcaption><\/figure>\n\n\n\n### Translated Canon\n\n**42–56%. The modal case.**\n\nMelville keeps first-rank standing. Moby-Dick stays the lead candidate for the great American novel in surveys and anthologies, taught in college surveys and sustained, at reduced but functioning scale, by the Melville Society, *Leviathan*, and the finished Northwestern-Newberry edition. Providence survives, but translated. The question of whether Melville believed in a governing God is asked as a question about indifferent nature, about the histories of slavery and empire that the *Pequod* carries, and about whether obsessive will, including machine will, can be checked by anything. The Calvinist and theodicy reading persists as a historicist specialty, not as the public frame. No consensus forms. The book stays what the chapter on the strongest objections found it to be: a formally controlled inquiry that makes the question unavoidable and refuses to certify an answer.\n\n*Derivation.* A decomposition. P(Melville keeps first-rank standing to 2050) is about 0.89. The anchor is a count: authors with an edition, a society and a journal that lost core status inside 25 years number 0 of 4 (Melville, Twain, Dickinson, Whitman), a Laplace estimate of about 17% for a fall; I shade that toward the 5–10% that the decompositions give for outright demotion, because the tiny sample counts partial slippage that Hollowed Canon already carries. Multiply by P(reading base and field are not hollowed, given that standing holds) of about 0.75, which follows from the 17–27% hollowing estimates below, and the product is about 0.67 intact standing. Subtract Providence Returns (about 0.12) and Evidence Settles It (about 0.05), and the remainder is about 0.50. I keep the range at 42–56% because the lower independent decompositions (38–50%) and the higher (48–60%) both survive, and because the factors are positively correlated, which argues against tightening.\n\n*Drivers.* Institutional lock-in: the Society, *Leviathan* (volume 28, number 2 appeared in June 2026), the edition completed in 2017 after 15 volumes, and the 2019 bicentennial. The book's habit of absorbing new questions without being displaced: there have been five interpretive regimes since 1851, with gaps of 68, 31, 35 and 20 years, and the book outlived each. Metaphor availability: Ahab as the figure of obsession and unchecked will, the whale as an emblem of indifferent nature. A living afterlife: Jake Heggie's opera at the Met in March 2025, and a Paris stage version in early 2026. And a question the evidence cannot close: the letters and Hawthorne's 1856 notebook leave belief undecidable.\n\n*Signals to watch.* Moby-Dick's rank among assigned fiction at the next Open Syllabus release, around 2030. Whether a third or more of new Melville scholarship in 2026–2030 foregrounds ecology, empire or AI instead of theology. Whether *Leviathan* keeps its three-issue-a-year rhythm at current length. Two flat years in the humanities degree share.\n\n*Time horizon.* Distinguishable from the alternatives by about 2035; confirmed or broken by 2050.\n\n*The challenge to it.* The strongest objection is that this describes an equilibrium of institutions and offers no evidence about readers. That is fair, and it is why the band tops out at 56%.\n\n### Hollowed Canon\n\n**18–28%. The live second.**\n\nMelville keeps nominal rank, but the pipeline that sustains it contracts. Humanities and English departments shrink again, fewer people read the book whole, and summaries, adaptations, excerpts and AI interlocutors replace first reading. The Melville Society and the journal persist at a fraction of current size. Moby-Dick is still cited as the great novel; the providence debate migrates to public and machine-mediated commentary and thins as scholarship. Ahab and the white whale circulate as meme more than as a read text.\n\n*Derivation.* A decomposition, run three independent ways. First: P(sustained fall in unmediated long-form reading among the college-educated by 2040) of 0.55, times P(department shrinkage cuts the Melville pipeline by a third or more, given the fall) of 0.45, times P(AI mediation is the dominant mode, given both) of 0.7, gives 17%. Second: P(the humanities pipeline contracts further) of 0.60, times P(the contraction reaches readership and scholarly capacity, not just enrollment) of 0.45, gives 27%. Third: P(contraction at or beyond the 2000–24 rate) of 0.45, times P(it erodes Melville's instruction base) of 0.45, gives 20%. The centre is about 22%. I hold the range at 18–28% because the audiobook counter-signal is real and because forecasts of reading's death have a poor record.\n\n*Drivers.* Humanities degrees stood at 164,847 in 2024, 30.4% below the 2012 peak, and the humanities share of degrees in 2025 was 8.1%, the lowest since 1987. The English share of bachelor's degrees fell from 7.6% (1971) to about 2.8% (2021) in one IPEDS-based series, and from 4.5% (2000–01) to 1.7% (2023–24) in another; the sources disagree on levels and agree on direction. Moby-Dick was already absent from the three high school titles that reached 20% of courses in a 2010 teacher survey, so the high school pipeline was never carrying it. Summary, audiobook and AI-tutor substitution add to it, as does funding pressure on university presses and the NEH.\n\n*Signals to watch.* Humanities share of bachelor's degrees below 6% by 2032. The MLA job list below half its 2019 level. A swing of more than 30% in Society membership or *Leviathan* subscriptions in five years. Two straight years of rising adult leisure reading would lower this scenario.\n\n*Time horizon.* Visible in enrollment and syllabus data by about 2032; settled by 2040–2050.\n\n*The challenge to it.* Degree share is a poor proxy for Melville's standing, which also rests on trade reading and adaptation. I found a single Goodreads snapshot (roughly 606,000–620,000 ratings at about 3.56–3.57) with no trend, so the reader side is thinly evidenced.\n\n### Providence Returns\n\n**8–15%.**\n\nStanding holds, and a post-secular, political-theological or AI-eschatological turn makes divine governance, fate and purpose the live public question again. Moby-Dick is read as its central American text, and scholarship swings back toward Calvinist, Hawthorne-notebook and doctrinal readings with new energy. Providence stops being period background and becomes the organizing frame, in scholarship, in public reading, or both.\n\n*Derivation.* A decomposition cross-checked against a count. P(intact standing) of about 0.67, times P(a shift reorients readers to providence as the frame, given intact standing) of about 0.18, gives about 12%. The count: about 2 religion-tied realignments that reshaped how Melville was read in about 100 years (the mid-century theological readings, and the 1970s–80s Puritan turn) is 0.02 a year, so about 38% for any such shift in 24 years, times about 0.3 that providence becomes the central frame rather than a strand, gives about 11%. Pew's plateau, with the Christian share stable around 60–62% since about 2020, lifts this above the 4% that a three-factor chain would give. Gallup's drop in belief in God, from 87% to 81%, pulls it down.\n\n*Drivers.* Anxiety about AI as ungoverned will, and about climate as indifferent or ordered nature. Renewed religious seeking among the unaffiliated, if the plateau holds (nones rose from 16% in 2007 to 29% in 2023–24 but have been flat since about 2020). Post-secular and political-theology scholarship. And Ahab's monomania as the metaphor that drags readers back to the cosmic quarrel.\n\n*Signals to watch.* Two successive Pew or Gallup waves with belief or affiliation stable or rising. A *Leviathan* special issue or major monograph by a leading scholar centered on providence or theodicy before 2030. Providence language in public AI-risk argument that cites Ahab.\n\n*Time horizon.* A turn would show first in scholarship, about 2035–2040; public reading follows by 2050.\n\n*The challenge to it.* The conversion factor, 0.18, is judgment, not a counted rate. A tighter reading of the secularization trend would put this nearer 4%; a looser reading of the post-secular literature would put it near 18%.\n\n### Demoted Classic\n\n**7–14%.**\n\nMelville falls from the first rank. A diversified canon, shorter assigned works and the slow loss of whaling and biblical literacy leave Moby-Dick a respected but optional classic, still in anthologies, no longer the book a literate American is expected to have read. Or the book is displaced as the American-novel anchor by *Beloved*, *Invisible Man*, *Huckleberry Finn* or a non-Anglophone work, or as the leading providence text by another author. Providence becomes a footnote to an author who has slipped.\n\n*Derivation.* A reference class plus a decomposition, with the range straddling two anchors that disagree. The count: of 8 US authors who were top-tier in 1900–1920 (Longfellow, Whittier, Lowell, Holmes, Bryant, Cooper, Howells, Harte), 7 had fallen from the core by 1976, about 88% over about 75 years, but all lacked an edition, a society and a journal. Authors with those supports lost core status in 0 of 4 cases in 25 years, a Laplace rate of about 17%. The decompositions give 5–10%: P(severe pipeline contraction) of 0.60 times P(it displaces Melville specifically) of 0.15 is 9%, and apex-slot displacement runs about 3 in 25 per generation, lowered to 5–9% because Moby-Dick has held the slot since about 1950. I take 7–14%. These are hand tallies, not a census.\n\n*Drivers.* Canon expansion crowding survey syllabi. A teaching shift toward shorter works. Whaling and biblical literacy collapse increasing the reader's distance. Other authors absorbing the providence theme.\n\n*Signals to watch.* Moby-Dick outside the top 10 assigned fiction, or outside the top 50 in college syllabi, at the next Open Syllabus release. Loss of a Melville seat in standard survey anthologies. A decade of great-American-novel polls placing another title first.\n\n*Time horizon.* Early evidence by about 2035 in syllabus data; confirmed by 2045–2050.\n\n*The challenge to it.* The strongest counter is that Melville has already survived the 1960s–90s canon-opening, which is exactly the realignment that displaced his rivals. That is why this sits below Hollowed Canon.\n\n### Evidence Settles It\n\n**3–7%.**\n\nA find or archival reframing changes what Melville is believed to have thought about providence: new letters or journals, the lost Bayle volume or marginalia, the lost *Isle of the Cross* manuscript, or a datable-layer result on how Moby-Dick was composed. The result is decisive enough that a working consensus forms where none has existed, in whichever direction the evidence points. Standing is not at issue here; the reading is.\n\n*Derivation.* A decomposition from a hand count. Canon-reshaping Melville finds since 1920 number one clear case (the *Billy Budd* manuscript, found in 1919–20) and one partial (52 added letters in the 1993 correspondence volume), so 0.01–0.019 a year. Over 24 years that is 0.23–0.45 expected finds, and P(at least one) of 21–36%. Multiply by P(it bears decisively on belief, given a find) of 0.2–0.3 for 4–11%, then by P(it settles a consensus rather than adding another camp) of about 0.6, for about 3–7%. Digital recovery of erased annotations raises the find rate modestly; most attics are already searched.\n\n*Drivers.* Digital imaging of erased annotations in Melville's books, with the Milton results of 2015 as the precedent. Estate, auction and attic provenance surfacing unlocated volumes. Editorial projects of the Society.\n\n*Signals to watch.* Announcement of a Melville-owned volume or manuscript bearing on belief. New letters or journal entries from the family circle.\n\n*Time horizon.* The hazard is roughly flat to 2050; any single year carries about 0.2–0.3%.\n\n*The challenge to it.* n is 1 to 2. A single further find in either direction would move the rate by half.\n\n## Base Rates\n\nThe reference classes are hand tallies from standard literary history, small in n and built partly from survivors; I report them as counts, and none is a census. Authors with an edition, a society and a journal that lost core status within 25 years: 0 of 4 (Melville, Twain, Dickinson, Whitman), a Laplace rate of about 17%. US authors top-tier in 1900–1920 that had left the core by 1976: 7 of 8, about 88% over about 75 years, with none having institutional lock-in. Interpretive regimes in Melville scholarship: five (1851, 1919, about 1950, about 1985, about 2005) with gaps of 68, 31, 35 and 20 years, so roughly one more turnover by 2050. Religion-tied realignments that reshaped how Melville was read: about 2 in about 100 years. Canon-reshaping finds: one clear and one partial since 1920.\n\nThe measured series come with their own warnings.\n\n| Indicator | Reading | Caveat |\n| --- | --- | --- |\n| Gallup, belief in God | 87% (2013–17) to 81% (2022) | Another secondary summary reports 90% (2001) to 74% (2023); wording changes make levels non-comparable, direction is down |\n| Pew, religiously unaffiliated | 16% (2007) to 29% (2023–24); Christians 78% to 62% | Both series flat since about 2020 |\n| Humanities degrees | 164,847 in 2024, 30.4% below the 2012 peak; share 8.1% in 2025 | Secondary analyses of the same series give a share of 10.9% (2015) to 8.5% (2024) |\n| English share of bachelor's | 7.6% (1971) to about 2.8% (2021) | Another analysis gives 4.5% (2000–01) to 1.7% (2023–24); sources disagree on levels, agree on direction |\n| Northwestern-Newberry edition | 15 volumes, 1968–2017, finished | Retires edition-funding risk |\n| Metropolitan Opera, Heggie *Moby-Dick* | March 2025 (Dallas premiere 2010) | Evidence of afterlife, not of readership |\n| Goodreads | roughly 606,000–620,000 ratings, about 3.56–3.57 | Single snapshot, no trend |\n\n## Prediction Market Snapshot\n\nNo liquid prediction market exists on this question, and I did not infer a price from any other. I searched Polymarket, Kalshi, Manifold, Metaculus and Good Judgment on 2026-10-24 for Melville, Moby-Dick, canon standing, the great American novel, humanities degrees, and belief in God, and found none. The search could not enumerate platform catalogues, so \"not found\" is the strict claim. The forecast therefore rests on reference classes and decompositions, and no unexplained divergence from a market needs defending.\n\n## What Would Change My Forecast\n\nAn Open Syllabus snapshot near 2030 placing Moby-Dick outside the top 10 assigned fiction would raise Demoted Classic toward 12–16%, and outside the top 50 in college syllabi toward 15–20%. A humanities share of US bachelor's degrees below 6% by 2032, or the MLA job list below half its 2019 level, would raise Hollowed Canon to 32–38%; two consecutive flat years would move 4–6 points from Hollowed Canon to Translated Canon. A fall of more than 30% in Melville Society membership or *Leviathan* subscriptions within five years would add 8–10 points to Hollowed Canon, and two straight years of rising adult leisure reading would lower it toward 14%.\n\nOn the interpretive side, two successive Pew or Gallup waves showing belief or affiliation stable or rising would add 4–5 points to Providence Returns, and a *Leviathan* special issue or major monograph by a leading scholar centered explicitly on providence or theodicy before 2030 would add 3–5. The announcement of a newly found Melville-owned volume or manuscript bearing on belief would lift Evidence Settles It to about 20% for the following decade. A prediction market on canon standing opening with real volume would re-anchor the split between Translated Canon and Hollowed Canon.\n\n## Open Questions\n\nI could not retrieve Moby-Dick's current Open Syllabus rank, so the most direct measure of classroom standing is missing. The Pew 2023–24 figures come from press summaries, not the study tables. Gallup's levels change with question wording, and I could not confirm the survey year for the 81% figure from primary text. Humanities and English degree shares come from secondary analyses that disagree on levels, so the extrapolated decline could be overstated if the trend plateaus, as Pew's did. Recent Melville scholarship sits mostly behind paywalls, so the claim that the field's attention has moved from theology to ecology and empire is read off catalogue and institutional evidence, not a full survey. Gallup and Pew measure US belief, while Melville's readership is global and the Anglophone and translation worlds may behave differently. Several decomposition factors (0.75, 0.18, 0.6) are judgments anchored to trends, not measured rates. Last, the question grades at 2050, and no single observation settles it earlier; I name proxies, not a resolution date.\n\n## Sources\n\n- Pew Research Center, Religious Landscape Study 2023–24, via NPR, 26 February 2025, npr.org/2025/02/26/nx-s1-5298180/christianity-declines-among-u-s-adults-while-religiously-unaffiliated-grows-study-says, and OPB, opb.org/article/2025/02/26/pew-religious-landscape-study-christianity/ — Christians 78% to 62%, nones 16% to 29%.\n- Pew Research Center, 2015 chapter on importance of religion and religious beliefs, pewresearch.org/religion/2015/11/03/chapter-1-importance-of-religion-and-religious-beliefs/, and VOA summary, learningenglish.voanews.com/amp/us-less-relgious-than-in-2007/3037099.html — belief in God or universal spirit, 92% (2007) to 89% (2014).\n- Gallup belief-in-God reports, syndicated at cbs12.com (belief 87% to 81%) and in secondary summaries at wfla.com and mediaite.com (90% in 2001 to 74% in 2023).\n- American Academy of Arts and Sciences, Humanities Indicators, degrees in the humanities, amacad.org/humanities-indicators/higher-education/degrees-humanities — 164,847 in 2024, 30.4% below 2012 peak.\n- Inside Higher Ed on ADE English degree counts, insidehighered.com/node/55877 — about 20% fall 2012–2016, 42,868 in 2016.\n- James G. Martin Center, \"Are English Departments Really Dying?\", 2023, jamesgmartin.center/2023/05/are-english-departments-really-dying/; College Transitions, \"Losing Ground: A Decade of Decline in Humanities Degrees,\" collegetransitions.com.\n- Thomas B. Fordham Institute, national survey of literary study in grades 9–11, fordhaminstitute.org — Moby-Dick absent from titles reaching 20% of courses.\n- Metropolitan Opera, *Moby-Dick*, March 2025, metopera.org; Paris stage run, jds.fr.\n- Boise State University, Melville's Marginalia Online and publications on recovered erased annotations (Olsen-Smith and colleagues), experts.boisestate.edu.\n- Project MUSE and Melville Society pages for *Leviathan*, volume 28, number 2 (June 2026).\n- Goodreads, Moby-Dick listings, goodreads.com/shelf/show/moby, accessed October 2026.\n- Open Culture and WNYC on Open Syllabus Project data, openculture.com, wnyc.org — used as indicator context only; current rank not retrieved.\n- The chapters on reception, the strongest objections, and recent scholarship and afterlives."}], "glossary": [{"term": "providence", "aliases": ["divine providence"], "def": "The belief that God actively governs events and steers history and individual lives toward a purpose."}, {"term": "Calvinism", "aliases": ["Calvinist", "Calvinistic"], "def": "The strict Protestant tradition, drawn from John Calvin, teaching that God has foreordained everything and that human beings are born deeply sinful."}, {"term": "theodicy", "aliases": ["theodicies"], "def": "The attempt to square belief in a good, all-powerful God with the existence of evil and suffering."}, {"term": "predestination", "aliases": ["foreordained", "foreordination"], "def": "The doctrine that God has already decided, before birth, who will be saved and who will be damned."}, {"term": "free will", "aliases": ["freedom of the will"], "def": "The idea that people can genuinely choose their actions rather than having them fixed in advance."}, {"term": "compatibilism", "aliases": ["compatibilist"], "def": "The view that events can be fixed in advance and people can still be acting freely, so fate and choice are not opposites."}, {"term": "determinism", "aliases": ["deterministic"], "def": "The view that every event is the necessary result of earlier causes, leaving no room for things to go otherwise."}, {"term": "Original Sin", "aliases": ["innate depravity"], "def": "The Christian teaching that all humans inherit a sinful nature from Adam's first disobedience."}, {"term": "Dutch Reformed Church", "aliases": ["Dutch Reformed"], "def": "The Calvinist Protestant church of the Dutch settlers in New York, in which Melville's mother was raised and in which he was baptized."}, {"term": "Heidelberg Catechism", "aliases": [], "def": "A 1563 question-and-answer statement of Reformed Protestant belief, the doctrinal standard of the Dutch Reformed churches."}, {"term": "Westminster Confession", "aliases": ["Westminster Confession of Faith"], "def": "The 1640s statement of Calvinist doctrine written for English and Scottish Protestants, which treats providence at length."}, {"term": "Unitarian", "aliases": ["Unitarianism", "Unitarians"], "def": "A liberal Christian outlook that rejects the Trinity and original sin and stresses human goodness and reason."}, {"term": "Augustine", "aliases": ["St. Augustine", "Saint Augustine"], "def": "The fifth-century church father who shaped Western teaching on sin, grace and providence, including the claim that evil is a lack of good rather than a thing in itself."}, {"term": "agnostic", "aliases": ["agnosticism"], "def": "Someone who holds that the existence of God or any ultimate purpose cannot be known either way."}, {"term": "Gnostic", "aliases": ["Gnosticism"], "def": "Of the ancient conviction that the visible world was made by a lesser or hostile power, with the true God hidden beyond it."}, {"term": "Manichean", "aliases": ["Manichaean", "Manichaeism"], "def": "Of a worldview that splits the cosmos into a good principle and an evil one locked in permanent conflict."}, {"term": "Pierre Bayle", "aliases": ["Bayle", "Bayle's Dictionary"], "def": "A seventeenth-century French skeptic whose Dictionary pressed the case that belief in a good, all-powerful God cannot be squared with evil; Melville owned a copy."}, {"term": "sublime", "aliases": [], "def": "An aesthetic category for awe mixed with terror, the feeling of facing something vast and overwhelming."}, {"term": "Book of Job", "aliases": ["Job"], "def": "The Old Testament book in which a blameless man loses everything and demands that God explain why; its closing messenger-who-alone-escaped line ends Moby-Dick."}, {"term": "Jonah", "aliases": [], "def": "The Old Testament prophet who ran from God's command, was swallowed by a great fish, and was delivered; the subject of Father Mapple's sermon."}, {"term": "Prometheus", "aliases": ["Promethean"], "def": "The Greek Titan who stole fire for humanity and was punished by having a vulture eat his liver forever; a figure for defiant thought that torments itself."}, {"term": "cetology", "aliases": [], "def": "The scientific study of whales, and the name of the novel's long chapters that classify them."}, {"term": "monomania", "aliases": ["monomaniac", "monomaniacal"], "def": "An obsession with a single idea, to the point of madness."}, {"term": "doubloon", "aliases": [], "def": "A gold coin Ahab nails to the mast as a prize; in one chapter each crew member reads it and sees a different message."}, {"term": "Pequod", "aliases": [], "def": "The whaling ship Ahab commands, named for a Native American people, which is destroyed at the end of the novel."}, {"term": "Fedallah", "aliases": [], "def": "The mysterious harpooneer on Ahab's private crew whose prophecies of Ahab's death shadow the final chase."}, {"term": "Rachel", "aliases": [], "def": "The whaling ship that rescues Ishmael at the end, still searching for its captain's missing son."}, {"term": "Mat-Maker", "aliases": ["Mat-Maker chapter", "weaving a mat"], "def": "The chapter in which Ishmael likens life to a loom, with necessity setting the threads, free will throwing the shuttle, and chance striking the blows."}, {"term": "gam", "aliases": ["gams"], "def": "In whaling, a social meeting at sea between two ships, where crews swap news and visits."}, {"term": "drumhead court", "aliases": [], "def": "A hasty trial held on the spot, as on the ship in Billy Budd, with little chance for defense."}, {"term": "ananke", "aliases": [], "def": "The Greek word for necessity, an impersonal fate that even the gods obey."}, {"term": "Leviathan", "aliases": [], "def": "The biblical sea monster, and also the title of the Melville Society's scholarly journal."}, {"term": "Melville Society", "aliases": [], "def": "The scholarly society devoted to Melville, which publishes the journal Leviathan and runs the field's conferences."}, {"term": "Northwestern-Newberry", "aliases": ["Northwestern-Newberry edition"], "def": "The standard scholarly edition of Melville's works, published jointly by Northwestern University Press and the Newberry Library."}, {"term": "Melville Revival", "aliases": [], "def": "The 1920s rediscovery of Melville after decades of neglect, when critics first made Moby-Dick a classic."}, {"term": "PMLA", "aliases": [], "def": "Publications of the Modern Language Association, a leading American journal of literary scholarship."}, {"term": "Evert Duyckinck", "aliases": ["Duyckinck"], "def": "A New York literary editor and Melville's close friend, who lent him books and reviewed his work."}, {"term": "Hawthorne's notebook", "aliases": [], "def": "Nathaniel Hawthorne's private journal, which records his 1856 meeting with Melville and the remark that Melville could neither believe nor be comfortable in his unbelief."}, {"term": "Billy Budd", "aliases": [], "def": "Melville's last, unfinished story, about an innocent sailor hanged under naval law after he kills his accuser."}, {"term": "Clarel", "aliases": [], "def": "Melville's very long 1876 poem about a young seeker on a pilgrimage through the Holy Land, full of arguments over faith and doubt."}, {"term": "Pierre", "aliases": [], "def": "Melville's 1852 novel, a dark, tangled story about a young man ruined by his own idealism."}, {"term": "Mardi", "aliases": [], "def": "Melville's 1849 allegorical sea voyage, the book where he first turned from adventure writing to philosophy."}, {"term": "The Confidence-Man", "aliases": [], "def": "Melville's 1857 satirical novel set on a Mississippi steamboat, about a trickster who tests his passengers' trust."}, {"term": "Typee", "aliases": [], "def": "Melville's 1846 first book, a South Seas adventure narrative that made his early reputation."}, {"term": "Quaker", "aliases": ["Quakers", "Quakerism"], "def": "A member of the Society of Friends, a plain Protestant sect strong among Nantucket whalers."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  var sceneData = document.getElementById('reader-scenes-data');
  var sceneHtmls = [];
  if (sceneData) {
    try { sceneHtmls = JSON.parse(sceneData.textContent || '[]') || []; } catch (e) { sceneHtmls = []; }
  }
  if (sceneHtmls.length && h1) {
    var sceneTpl = document.createElement('template');
    sceneTpl.innerHTML = sceneHtmls[current % sceneHtmls.length] || '';
    if (sceneTpl.content && sceneTpl.content.firstElementChild) {
      well.insertAdjacentElement('afterend', sceneTpl.content.firstElementChild.cloneNode(true));
    }
  }
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();

function toggleHelp() {

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);

});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
