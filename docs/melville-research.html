ed\" font-style=\"italic\">\"the fixed threads . . . not to be swerved\"<\/text>\n<line x1=\"456\" y1=\"147\" x2=\"466\" y2=\"147\" class=\"s-t3\" stroke-width=\"3\"/>\n<text x=\"470\" y=\"150\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"bold\" letter-spacing=\"1\">FILLING: FREE WILL<\/text>\n<text x=\"470\" y=\"164\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">\"with my own hand I ply my own shuttle\"<\/text>\n<line x1=\"456\" y1=\"205\" x2=\"466\" y2=\"205\" class=\"s-t4\" stroke-width=\"3\"/>\n<text x=\"470\" y=\"208\" text-anchor=\"start\" font-size=\"10.5\" font-weight=\"bold\" letter-spacing=\"1\">SWORD: CHANCE<\/text>\n<text x=\"470\" y=\"222\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">\"has the last featuring blow at events\"<\/text>\n<text x=\"470\" y=\"230\" text-anchor=\"start\" font-size=\"9\" class=\"t-acc\" font-style=\"italic\">Tashtego's cry: \"the ball of free will dropped\"<\/text>\n<text x=\"350\" y=\"272\" text-anchor=\"middle\" font-size=\"11\" class=\"t-serif\" letter-spacing=\"1.5\">WHO WORKS THE LOOM? THE BOOK GIVES THREE ANSWERS<\/text>\n<rect x=\"22\" y=\"286\" width=\"210\" height=\"112\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--t3)\"/>\n<text x=\"127\" y=\"306\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">ch. 47, The Mat-Maker<\/text>\n<text x=\"127\" y=\"328\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-serif\" font-weight=\"bold\" letter-spacing=\"1\">NO OPERATOR<\/text>\n<line x1=\"62\" y1=\"336\" x2=\"192\" y2=\"336\" class=\"s-t3\" stroke-width=\"2\"/>\n<text x=\"127\" y=\"356\" text-anchor=\"middle\" font-size=\"8.6\">\"the Loom of Time\": the weavers are<\/text>\n<text x=\"127\" y=\"369\" text-anchor=\"middle\" font-size=\"8.6\">shuttle and sword, no hand above<\/text>\n<rect x=\"248\" y=\"286\" width=\"210\" height=\"112\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--t2)\"/>\n<text x=\"353\" y=\"306\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">The Gilder<\/text>\n<text x=\"353\" y=\"328\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-serif\" font-weight=\"bold\" letter-spacing=\"1\">NO TERMINUS<\/text>\n<line x1=\"288\" y1=\"336\" x2=\"418\" y2=\"336\" class=\"s-t2\" stroke-width=\"2\"/>\n<text x=\"353\" y=\"356\" text-anchor=\"middle\" font-size=\"8.6\">\"mingled, mingling threads\"; belief<\/text>\n<text x=\"353\" y=\"369\" text-anchor=\"middle\" font-size=\"8.6\">and doubt recur, \"Ifs eternally\"<\/text>\n<rect x=\"474\" y=\"286\" width=\"210\" height=\"112\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--t4)\"/>\n<text x=\"579\" y=\"306\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">The Castaway<\/text>\n<text x=\"579\" y=\"328\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-serif\" font-weight=\"bold\" letter-spacing=\"1\">GOD, AND INDIFFERENT<\/text>\n<line x1=\"514\" y1=\"336\" x2=\"644\" y2=\"336\" class=\"s-t4\" stroke-width=\"2\"/>\n<text x=\"579\" y=\"356\" text-anchor=\"middle\" font-size=\"8.6\">Pip \"saw God's foot upon the treadle\";<\/text>\n<text x=\"579\" y=\"369\" text-anchor=\"middle\" font-size=\"8.6\">his shipmates called him mad<\/text>\n<text x=\"350\" y=\"422\" text-anchor=\"middle\" font-size=\"11\" class=\"t-serif\" letter-spacing=\"1.5\">THE LAST BLOW LANDS IN THE EPILOGUE<\/text>\n<rect x=\"60\" y=\"436\" width=\"250\" height=\"38\" rx=\"2\" class=\"f-t4\" opacity=\".9\"/>\n<text x=\"185\" y=\"459\" text-anchor=\"middle\" font-size=\"12\" class=\"t-inv\" font-style=\"italic\">\"It so chanced . . .\"<\/text>\n<rect x=\"390\" y=\"436\" width=\"250\" height=\"38\" rx=\"2\" class=\"f-t1\" opacity=\".9\"/>\n<text x=\"515\" y=\"459\" text-anchor=\"middle\" font-size=\"12\" class=\"t-inv\" font-style=\"italic\">\". . . the Fates ordained\"<\/text>\n<path d=\"M310,455 L390,455\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<text x=\"350\" y=\"450\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\">one clause<\/text>\n<text x=\"350\" y=\"494\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">Survival is both accident and ordination; the coffin's \"cunning spring\" is the last featuring blow.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> Ishmael&#8217;s weave puts the last word with neither God nor the will but with the unintended: the sword of chance drives home &#8220;the last featuring blow.&#8221; The loom has no operator in chapter 47, an endless circle in &#8220;The Gilder,&#8221; and an indifferent God in &#8220;The Castaway,&#8221; and the Epilogue folds <em>chance<\/em> and <em>fate<\/em> into one clause. The book supplies a model of how necessity, will and accident coexist and then withholds the weaver.<\/figcaption>\n<\/figure>\n\n\nThe book's most explicit statement about the structure of events is in Chapter 47, and it is explicit precisely because it is a single extended figure and not a thesis. Ishmael and Queequeg are weaving a sword-mat for an additional lashing to their boat on a \"cloudy, sultry afternoon,\" in a stillness so complete that \"it seemed as if this were the Loom of Time, and I myself were a shuttle mechanically weaving and weaving away at the Fates.\" The warp is \"necessity\": \"There lay the fixed threads of the warp subject to but one single, ever returning, unchanging vibration.\" Ishmael plies the filling with his hand, \"and here, thought I, with my own hand I ply my own shuttle and weave my own destiny into these unalterable threads.\" Queequeg's sword, \"impulsive, indifferent,\" driving home the yarns at random strength and angle, is \"chance—aye, chance, free will, and necessity—nowise incompatible—all interweavingly working together.\" The summary: \"The straight warp of necessity, not to be swerved from its ultimate course ...; free will still free to ply her shuttle between given threads; and chance, though restrained in its play within the right lines of necessity, and sideways in its motions directed by free will, though thus prescribed to by both, chance by turns rules either, and has the last featuring blow at events\" [1].\n\nSeveral things should be said about this passage. First, it is a compatibilist model, and more precisely a three-layered one: a fixed framework, a space of choice within it, and a contingent element that shapes the final pattern. It is not the Calvinist model, in which God's decree is the whole of the weaving, and it is not the Epicurean one, in which chance is a swerve of atoms. It most resembles a mild Stoic or Leibnizian picture, with a necessary order within which agents move and events occur, but with an irreducible role for accident. Second, the model has a notable asymmetry: chance has \"the last featuring blow.\" Whatever the warp fixes and the shuttle chooses, the final aspect of the fabric depends on the slant of an indifferent stroke. In this figure the last word belongs neither to God nor to the will but to the unintended. Third, the one agent who might stand for providence in the picture, the weaver of the whole, is absent. Ishmael is the shuttle, Queequeg the sword, and the loom has no operator; \"the Loom of Time\" is a loom with no hand but the weavers' own. If the picture is allegorical of providence, it is allegorical of a providence without a Providence.\n\nFourth, and most important, the passage undercuts itself in the very next paragraph. The extended metaphor is interrupted by Tashtego's cry from the masthead: \"I started at a sound so strange, long drawn, and musically wild and unearthly, that the ball of free will dropped from my hand\" [1]. The image of free will is quite literally dropped, and the narrator, who has just been elaborating a theory of the compatibility of freedom and necessity, is jolted out of it by an event he did not control. The cry is then described: \"you would have thought him some prophet or seer beholding the shadows of Fate, and by those wild cries announcing their coming\" [1]. The chapter thus moves from the claim that free will and necessity are compatible to a demonstration in which an external event overrides the will's occupation and Fate is invoked in the same voice. Immediately Ahab appears among the \"five dusky phantoms that seemed fresh formed out of air.\" The sequence is the best single example of the book's technique: a philosophical position stated with confidence, and then a dramatic event that tests it and does not obviously vindicate it.\n\nFifth, the passage should be read alongside the other loom passages. In \"The Gilder,\" the narrator, reflecting on calm days that tempt men to forget the sea's remorseless fang, concludes that \"the mingled, mingling threads of life are woven by warp and woof: calms crossed by storms, a storm for every calm,\" and that the course of belief is a circle, \"infancy's unconscious spell, boyhood's thoughtless faith, adolescence' doubt (the common doom), then scepticism, then disbelief, resting at last in manhood's pondering repose of If,\" after which \"we trace the round again; and are infants, boys, and men, and Ifs eternally\" [1]. Here the loom image has lost its confidence about necessity. The threads are \"mingled, mingling,\" and the result is a cycle of belief and doubt with no terminus. In \"The Castaway,\" the abandoned Pip, driven mad by his hours alone on the sea, \"saw God's foot upon the treadle of the loom, and spoke it; and therefore his shipmates called him mad\" [1]. The loom reappears with a weaver, God, whose foot works the treadle, and the vision is available only to someone whom the world classes as insane. The narrator adds, as a sentence that interprets and does not argue, \"So man's insanity is heaven's sense; and wandering from all mortal reason, man comes at last to that celestial thought, which, to reason, is absurd and frantic; and weal or woe, feels then uncompromised, indifferent as his God\" [1]. Pip's God is not benevolent in any way the Mapplean tradition would recognize: he is \"indifferent.\" The loom in Pip's vision has an operator, and the operator is not a Father. And at the end of Fast-Fish and Loose-Fish and the other chapters below, we will see the loom's threads turned into legal principles. The three loom passages together form the book's most consistent figure for order, and they disagree with each other about whether it has a weaver and what temper he has.\n\nWhere, finally, does Ishmael's chapter-47 position stand in the book's overall argument? Two interpretive options are available and neither can be excluded. One is that the Mat-Maker states the narrator's considered view, a sophisticated compatibilism that governs how he narrates the rest: events have a fixed shape, the characters act freely within it, and accident provides the final strokes. The other is that it states one of the narrator's moods, a reverie \"in the Loom of Time\" produced by \"so strange a dreaminess\" and, as the chapter itself says, by an \"incantation of reverie\" in the air. The chapter's own frame supports the second reading; the reverie is introduced as a trance, and it is broken by the whale-cry. A third point favours the first: the later narrator uses the same model without irony, as in the remark that \"the innermost necessities in our being\" drive the crew. By my own reading the passage is both: a considered position that the narrator holds in his reflective moods and that the narrative then tests with events. The tests are not obviously passed, and I take the most defensible description to be that the Mat-Maker offers the book's best account of how necessity, will and accident could coexist, while the plot of the voyage shows how rarely an agent can tell, at the moment of action, which of the three is moving him.\n\n## The Hyena, the Fountain and the Tail: The Joker, the Mist and the Back Parts\n\nImmediately after the Mat-Maker, the book tests whether any of its metaphysics can survive contact with danger. \"The Hyena\" opens with the narrator's report of a state of mind: \"There are certain queer times and occasions in this strange mixed affair we call life when a man takes this whole universe for a vast practical joke, though the wit thereof he but dimly discerns, and more than suspects that the joke is at nobody's expense but his own.\" In this mood a man \"bolts down all events, all creeds, and beliefs, and persuasions, all hard things visible and invisible,\" and even death seems \"only sly, good-natured hits, and jolly punches in the side bestowed by the unseen and unaccountable old joker\" [1]. The mood arrives \"only in some time of extreme tribulation,\" and the narrator, having just been dumped from a boat in a squall, adopts it as \"genial, desperado philosophy\" and goes below to write his will. Three features matter here. The cosmos has an author, the \"unseen and unaccountable old joker,\" but the author is a trickster, not a father, and not clearly malicious. The mood is described as an effect of fear rather than a conclusion of argument: the universe-as-joke is what the mind adopts when terror requires it. And the narrator treats it, with a half-smile, as the only sensible response to a voyage under Ahab. It is the closest Ishmael comes to Stubb, and the book is aware of the closeness, because Stubb, the professional laugher, is the character he consults.\n\n\"The Fountain\" and \"The Tail\" supply, in the guise of natural history, the book's most careful statement of theological agnosticism. The chapter on the whale's spout argues, comically and at length, that no one can tell whether the spout is water or mist, and concludes with Ishmael's own hypothesis that it is mist, \"engendered by his incommunicable contemplations,\" glorified by a rainbow \"as if Heaven itself had put its seal upon his thoughts.\" Then comes the passage that scholars quote most often when they want Ishmael's own creed: \"And so, through all the thick mists of the dim doubts in my mind, divine intuitions now and then shoot, enkindling my fog with a heavenly ray. And for this I thank God; for all have doubts; many deny; but doubts or denials, few along with them, have intuitions. Doubts of all things earthly, and intuitions of some things heavenly; this combination makes neither believer nor infidel, but makes a man who regards them both with equal eye\" [1]. This is the single most direct statement of position in the book. It asserts intuitions \"of some things heavenly,\" it thanks God for them, and it refuses the names of both believer and infidel. A providentialist reading takes the thanksgiving at face value; a skeptical reading notes that the intuitions have no content stated and that the verb \"regards\" is evenhanded. Either way, the passage fixes the narrator's characteristic stance as one of suspended judgment with a pull toward the heavenly.\n\n\"The Tail\" closes in the same register with a text taken from Exodus. After confessing that he cannot fully describe even the whale's tail, Ishmael adds: \"Dissect him how I may, then, I but go skin deep; I know him not, and never will. But if I know not even the tail of this whale, how understand his head? much more, how comprehend his face, when face he has none? Thou shalt see my back parts, my tail, he seems to say, but my face shall not be seen\" [1]. The last clause echoes the divine reply to Moses in Exodus 33, in which God allows Moses to see his back but not his face. The whale thus becomes a figure for the hidden God of the Reformed tradition, the Deus absconditus whose works can be seen and whose face cannot. In the Calvinist idiom Melville knew, this is a doctrine of divine inscrutability, and it is, by my own reading, the most faithful statement of that doctrine in the book. It is also a statement that cuts either way: a hidden God can be a good God whose purposes are beyond us or a God who has no face because there is nobody behind the mask. Ahab's \"naught beyond\" and Ishmael's \"face he has none\" are two verdicts on the same silence.\n\n## The Gams: Providence as Gossip\n\nThe ship-to-ship meetings, called gams in whaling usage, act as a series of external tests on the Pequod's fate, and each tells the story of its own providence in a different mode. They are the book's chorus, and, though they are rarely read together for the problem of providence, they should be.\n\n\"The Town-Ho's Story\" is told by Ishmael to a table of Spanish gentlemen in Lima, a frame that announces it as an after-dinner performance. It is the story of the mate Radney, the mutineer Steelkilt and the whale that kills the mate when Steelkilt is his bowsman. The telling is full of providential language. In \"the fore-ordaining soul of Steelkilt\" the mate is already \"stark and stretched as a corpse,\" but a fool saves him from the deed: \"Yet complete revenge he had, and without being the avenger. For by a mysterious fatality, Heaven itself seemed to step in to take out of his hands into its own the damning thing he would have done.\" Then the whale appears: \"Gentlemen, a strange fatality pervades the whole career of these events, as if verily mapped out before the world itself was charted\" [1]. This is the most explicit assertion in the book that the events were pre-arranged and that Heaven acts in retribution. But three qualifications must be entered. The teller is the narrator, and the story is a dinner-table piece told to young Spaniards who interrupt it to call for the chicha, a frame that marks it as performance and invites some discount. The language is hedged with \"seemed\" and \"as if.\" And the providence on display, in which the whale kills the abusive mate, is a providence of poetic justice that the main plot refuses to provide: Ahab's victims are not villains, and the Pequod's destruction punishes nobody in particular. The Town-Ho's Story is therefore a model of providence that the novel presents and does not adopt for itself. It shows how a teller shapes events into a moral pattern, and by doing so it throws that habit into relief.\n\nThe Jeroboam's story offers a different test. Its prophet, \"Gabriel,\" a former Shaker who announces himself as the archangel, had warned the crew against attacking the White Whale, whom he took to be \"the Shaker God incarnated\"; the mate Macey attacked anyway and, in Captain Mayhew's telling, was killed, with Gabriel hurling prophecies from the masthead. The narrator is blunt that Gabriel is a deluded fanatic with a \"measureless power of deceiving and bedevilling so many others,\" and also, as it turned out, right. To Ahab he cries \"Beware of the horrible tail\" and \"beware of the blasphemer's end,\" and when the letter for the dead Macey is passed across, Gabriel contrives to have it land at Ahab's feet with the words \"thou art soon going that way\" [1]. The same chapter observes that most letters carried by whalers \"never reach their mark,\" since delivery \"depends upon the mere chance of encountering them in the four oceans,\" so that the one letter that does arrive, to a dead man, arrives by what the narrator's own sentence calls chance and the crew will take for a sign. This is the book's mechanism for prophecy: the madman prophesies, the event matches, and no one can say whether the match is knowledge, coincidence or the pressure of belief on a frightened crew. Gabriel's warnings fit Macey, are ignored by Ahab, and are fulfilled only if the ending is read as their fulfilment. The Shaker seer is another version of Elijah, and he serves the same function: a figure who lets the book refuse to settle whether warnings have a source.\n\nThe conversation aboard the Samuel Enderby is the book's most disarming moment on the subject. The British captain Boomer, who lost an arm to Moby Dick, jokes with the ship's surgeon, Dr. Bunger, who \"very gravely and mathematically bowing\" announces that \"the digestive organs of the whale are so inscrutably constructed by Divine Providence, that it is quite impossible for him to completely digest even a man's arm,\" and concludes that \"what you take for the White Whale's malice is only his awkwardness\" [1]. The phrase \"Divine Providence\" appears here as an explicit invocation in the mouth of a comic physician, and what it explains is a mechanical fact about whale digestion that serves to deny Ahab's thesis of malice: the whale means no harm; he simply cannot swallow what he bites. This is the book's most sustained naturalistic deflation of Ahab's metaphysics, and it uses the language of providence to do it. The whale's behaviour is the product of an inscrutable but benign design, hence there is no malice to hate. The joke cuts two ways, because it makes providence trivial. The only function Providence is shown to perform in the entire voyage, in a passage specifically devoted to it, is to prevent whales from digesting limbs. And Boomer, a man who has met the same whale and lost the same limb, does not wish to renew the encounter, whereas Ahab, who has lost the same, does. The same fact, handled by two men, yields two cosmologies.\n\n\"The Monkey-Rope,\" earlier in the voyage, is the one place where the narrator invokes providence as a principle that the facts appear to violate. Tethered to Queequeg by a rope that will drag him down if Queequeg sinks, Ishmael thinks of his \"free will\" as having \"received a mortal wound,\" and infers: \"Therefore, I saw that here was a sort of interregnum in Providence; for its even-handed equity never could have so gross an injustice\" [1]. The reasoning is explicit: providence is by definition just (\"even-handed equity\"), so an unjust entanglement implies a gap in its governance, an \"interregnum.\" Then he generalizes: his situation is \"the precise situation of every mortal that breathes,\" because \"if your banker breaks, you snap; if your apothecary by mistake sends you poison in your pills, you die\" [1]. The step from the instance to the rule dissolves the exemption. If everyone is tied to everyone, the \"interregnum\" is the normal condition of life, and providence is either perpetually suspended or not what the sentence supposed. The footnote adds, with deadpan, that the arrangement was introduced on the Pequod by Stubb. In four sentences the book states the argument from evil against providence, in a joking idiom, and ties it to human interdependence rather than to a cosmic malice, which is a distinctly un-Ahabian version of the problem.\n\nLater gams change the key. The Rachel, with her captain Gardiner searching for a missing boat that holds his son, appears in \"The Pequod Meets the Rachel\" and ends in Ahab's refusal and the narrator's closing sentence: \"She was Rachel, weeping for her children, because they were not\" [1]. The quotation is Jeremiah 31:15, which Matthew applies to the slaughter of the innocents. The Rachel is the book's one pure image of unconsoled suffering that does not ask for explanation. She is also the ship that will rescue Ishmael, so that the grieving mother reappears, in the Epilogue, as the instrument of survival. The Delight, \"most miserably misnamed,\" shows its burial: the captain's words \"may the resurrection and the life\" are cut off by Ahab's order to brace forward, and the splash of the corpse \"sprinkled her hull with their ghostly baptism\" [1]. The dead man's committal is interrupted, and Ahab sails away from the sacrament toward the coffin hanging at his stern. A voice in the Pequod's wake cries that they fly the burial only to \"show us your coffin.\" Each gam thus offers an image of providence's absence, a lost boy, an interrupted resurrection, with the one exception that the Rachel who weeps is also the Rachel who saves.\n\n## Fast-Fish and Loose-Fish: Law as the Human Form of Fate\n\nThe chapter on Fast-Fish and Loose-Fish is usually read for its political satire, but it contains a theory of order that belongs in this inquiry. It begins with the technical law of whale ownership: a fish fastened to a boat is \"fast,\" belonging to its captors; one that is not is \"loose,\" belonging to whoever takes it. The narrator then expands the principle until it covers everything. \"What are the sinews and souls of Russian serfs and Republican slaves but Fast-Fish, whereof possession is the whole of the law?\" And at the end, the infinite extension: \"What are the Rights of Man and the Liberties of the World but Loose-Fish? What all men's minds and opinions but Loose-Fish? What is the principle of religious belief in them but a Loose-Fish? ... What is the great globe itself but a Loose-Fish? And what are you, reader, but a Loose-Fish and a Fast-Fish, too?\" [1].\n\nThe relevance to providence is the following. Where a providentialist sees a moral order established by God, this chapter sees only possession and its ratification by power: order is what the strong hold, and the law codifies the holding. Religious belief itself is a Loose-Fish, something that belongs to whoever strikes it first. The point is not a doctrine about God but a doctrine about the sources of order: they are human, adventitious and political. In Ishmael's account the moral cosmos, if there is one, is made by harpooners. Coupled with the rest of the book this yields an interesting result. Ahab claims to strike through the mask to a principal; Ishmael's legal satire suggests that what looks like the principal is often only possession, and that the force of \"law,\" natural, divine or civil, is the force of the grip. That is a kind of anti-providence that does not require a malicious God: a world without a governor, arranged by whoever holds the line.\n\n## The Try-Works and the Doubloon: Two Lessons in Reading Signs\n\n\"The Try-Works\" is the book's most direct warning about the cost of Ahab's theology, and it is spoken in Ishmael's own voice. On a night watch he stands at the helm of the Pequod as the try-works burn blubber on deck, and he falls into a half-sleep in which the ship seems \"rushing from all havens astern\"; he wakes with his back to the compass, \"fronting the ship's stern,\" and just saves her from capsizing. The moral he draws is the book's fullest statement of a counter-position to Ahab: \"Look not too long in the face of the fire, O man! Never dream with thy hand on the helm! Turn not thy back to the compass; accept the first hint of the hitching tiller; believe not the artificial fire, when its redness makes all things look ghastly. To-morrow, in the natural sun, the skies will be bright\" [1]. What follows is the praise of sorrow: \"the truest of all men was the Man of Sorrows, and the truest of all books is Solomon's, and Ecclesiastes is the fine hammered steel of woe.\" And then the limit: \"There is a wisdom that is woe; but there is a woe that is madness. And there is a Catskill eagle in some souls that can alike dive down into the blackest gorges, and soar out of them again and become invisible in the sunny spaces\" [1]. Providence appears here by implication only. The \"natural sun\" of tomorrow is a symbol of a world that outlasts the fire's distortion, and the eagle that can soar out of the gorge is a figure for a soul that preserves hope after woe. The chapter asserts, against Ahab, that the dark view of the world is true only in part, and that the true account includes the sun. It is Ishmael at his most consoling and his most Ecclesiastical, and it is notable that the consolation depends on a natural fact, tomorrow's sun, rather than a theological one.\n\n\"The Doubloon\" is the book's treatise on hermeneutics, and it shows the question of providence as a question of reading. The coin nailed to the mast, stamped with three Andean peaks, a flame, a tower, a crowing cock and the zodiac, is looked at in turn by Ahab, Starbuck, Stubb, Flask, the Manxman, Queequeg, Fedallah and Pip, and each sees a different message. Ahab: \"There's something ever egotistical in mountain-tops and towers ... the firm tower, that is Ahab; the volcano, that is Ahab; ... all are Ahab; and this round gold is but the image of the rounder globe, which, like a magician's glass, to each and every man in turn but mirrors back his own mysterious self. Great pains, small gains for those who ask the world to solve them; it cannot solve itself\" [1]. Starbuck sees the Trinity and a \"sun of Righteousness\" that \"still shines a beacon and a hope.\" Stubb reads the zodiac as a comic almanac of a man's life (\"Pisces, or the Fishes, we sleep\"), and Flask sees sixteen dollars, nine hundred and sixty cigars. The old Manxman reads an omen of the lion; Queequeg takes the coin for an old button; Fedallah bows to the sun. Pip first conjugates a verb: \"I look, you look, he looks; we look, ye look, they look.\" Stubb, who has watched them all, supplies the verdict on the exercise: \"All sorts of men in one kind of world, you see\" [1]. The chapter's last voice, which the transcription does not label but which is evidently Pip's (the speaker's father cut a pine \"in old Tolland county,\" and Pip is the book's Tolland boy), ends with a mad, startling line: \"God goes 'mong the worlds blackberrying\" [1]. It is an image of a divine presence that is casual, wandering and not particularly concerned with any one berry.\n\nThe chapter opens with the claim that holds the whole structure up: \"And some certain significance lurks in all things, else all things are little worth, and the round world itself but an empty cipher, except to sell by the cartload, as they do hills about Boston, to fill up some morass in the Milky Way\" [1]. This is the book's one unironic metaphysical axiom, and what is striking is that it is a claim about value rather than about God: if things have no significance, they are worth little. The chapter then demonstrates that significance, whatever its status, is received by each reader through the reader's own preoccupations. Ahab's theory, that the world is a mirror, is an uncomfortable counterpart to his own theory of the mask, since if the world \"mirrors back\" the viewer, the \"reasoning thing\" behind the mask may be Ahab himself. The chapter does not say that this is so; it says that Ahab says so, and that his reading is one among eight. Pip's conjugation, a verb with no object, is the one that unsettles, because the readers have been shown as readers, and Pip points to the grammar: everyone looks, and the looking is the datum.\n\nThe doubloon bears directly on the question of whether the book itself endorses a providential order. If everyone reads the sign differently, a providential interpretation of the voyage is as available, and as unproven, as the others, and the book's own title for a providential reading would be Starbuck's. The notable asymmetry is that Starbuck's reading is the gentlest and the least self-regarding, and the book has him leave it with the words \"I will quit it, lest Truth shake me falsely,\" as if his piety were a defence against the truth rather than a discovery of it [1].\n\n## Queequeg in His Coffin: The Will and the Wood\n\nThe long chapter on Queequeg's illness is the book's most gentle treatment of fate and the freest of rhetoric about it. Queequeg, fevered, asks for a coffin in the form of a Nantucket canoe, tries it for fit, rallies, and explains that he has remembered \"a little duty ashore\" and will not die yet. Asked whether life or death is a matter of his own will, \"He answered, certainly. In a word, it was Queequeg's conceit, that if a man made up his mind to live, mere sickness could not kill him: nothing but a whale, or a gale, or some violent, ungovernable, unintelligent destroyer of that sort\" [1]. This is a small, precise philosophy of the will's limits. The will governs what lies within the self (sickness, which is a matter of resolve), and is defeated by what is external, \"violent, ungovernable, unintelligent\" and above all unintelligent. The last adjective is the point. Queequeg's list of what can kill a resolute man contains nothing with a mind. His cosmos has accidents but no antagonist, and it is the exact opposite of Ahab's, in which the whale is \"an inscrutable malice\" and the destroyer is intelligent.\n\nThe chapter also contains the coffin's own providential irony. The coffin, built in case of death, becomes Queequeg's sea-chest, and its lid is carved with the tattooed hieroglyphs of a \"complete theory of the heavens and the earth,\" which not even Queequeg can read, \"destined in the end to moulder away with the living parchment whereon they were inscribed, and so be unsolved to the last\" [1]. This is what prompts Ahab's exclamation, \"Oh, devilish tantalization of the gods!\" The book thus supplies an image of revelation lost: a divine or cosmic text inscribed on a living body that no reader, including its bearer, can decipher. The chapter is a miniature of the problem of providence as a problem of legibility. There is a meaning, perhaps, but it is on a skin that will rot.\n\nThe coffin returns in \"The Life-Buoy,\" when the buoy lost overboard leaves the stern unprovided, and Queequeg \"hinted a hint concerning his coffin.\" Starbuck's cry, \"A life-buoy of a coffin!\", and the carpenter's reluctant fitting out of the box with thirty life-lines, are comic and ominous at once. In \"The Deck,\" Ahab addresses the carpenter in the mockery that has become habitual (\"Thou art as unprincipled as the gods, and as much of a jack-of-all-trades\"), and then, alone, speaks one of the most revealing sentences in the book on the question of meaning: \"Here now's the very dreaded symbol of grim death, by a mere hap, made the expressive sign of the help and hope of most endangered life. A life-buoy of a coffin! Does it go further? Can it be that in some spiritual sense the coffin is, after all, but an immortality-preserver! I'll think of that. But no. So far gone am I in the dark side of earth, that its other side, the theoretic bright one, seems but uncertain twilight to me\" [1]. The phrase \"by a mere hap\" is Ahab's reading of the event's cause, chance. But the passage then asks whether chance might cover a meaning, and Ahab declines the hope not because the evidence forbids it but because he is too far gone in darkness to credit it. This is as close as Ahab comes to a moment of metaphysical openness, and the book confirms it by making the coffin literally the thing that saves Ishmael. Whether the irony is providential, a hap that meant, or merely ironic, a hap that happened to mean, is exactly the question the passage poses and the Epilogue answers by narrating the event without interpreting it.\n\n## The Parsee's Prophecies: Equivocal Oracles\n\nFedallah, the \"muffled mystery\" who is, in the narrator's phrase, \"linked with Ahab's peculiar fortunes\" by an \"unaccountable tie,\" is the book's pagan oracle, and his prophecies supply its hardest material for any strong theory of foreordination. In \"The Whale Watch,\" in the dark beside a dead whale, he repeats to Ahab his earlier predictions: that before Ahab can die on this voyage \"two hearses must verily be seen by thee on the sea; the first not made by mortal hands; and the visible wood of the last one must be grown in America\"; that \"Hemp only can kill thee\"; and that he himself will \"still go before thee thy pilot\" [1]. Ahab takes the predictions as pledges of survival: \"Immortal on land and on sea!\" The three-day chase then fulfils each prophecy in a form its hearer had not imagined. Fedallah's body appears lashed to the whale, and Ahab says: \"this, this then is the hearse that thou didst promise.\" The Pequod itself, built of American wood, is \"the second hearse,\" and Ahab's cry as it sinks is \"its wood could only be American!\" And the hemp that kills him is the whale-line that catches his neck, \"voicelessly as Turkish mutes bowstring their victim\" [1].\n\nTwo competing readings of the oracle are available, and both are supported by the text. On one, the prophecies are genuine foreknowledge, riddling in the manner of Delphi or Macbeth's witches (Melville's debt to Shakespeare is a standard point), and their fulfilment shows a destined course in which Ahab's every defiance is already written. On the other, the prophecies are so loosely worded that almost any ending would fit: a hearse that is not made by mortal hands could be a whale, a ship of American wood could be the Pequod, and hemp could be a rope in any form; the fulfilment is the reader's retrofit, the same activity the Doubloon chapter mocks. The text does not decide. What it does is dramatize the psychology of prophecy: the hearer hears survival in what turns out to be doom, interprets the oracle by his wishes, and discovers at the end that he was \"Befooled, befooled!\" Ahab's last cry, as Moby Dick bears down upon the ship, is that the oracle's second term is true to the letter, and the effect of the sequence is not to prove a fate but to show how a man conscripts a prophecy into the service of his own will, with the oracle itself indifferent to the use.\n\nThe chase also makes Ahab the book's explicit voice for a fatalism that the narrator himself uses only in qualified form. On the second day, when Starbuck begs him to desist, Ahab answers with the speech the criticism most often cites: \"Ahab is for ever Ahab, man. This whole act's immutably decreed. 'Twas rehearsed by thee and me a billion years before this ocean rolled. Fool! I am the Fates' lieutenant; I act under orders. Look thou, underling! that thou obeyest mine\" [1]. This is the strongest assertion of predestination in the book, and it contains its own contradiction: the \"Fates' lieutenant\" who acts \"under orders\" immediately issues orders of his own, and demands obedience from Starbuck on the ground that he, Ahab, outranks him in the chain of fate. A lieutenant is a deputy with delegated authority, and Ahab's self-description is an extraordinary combination of submission and command. In the same chapter, minutes later and in a soliloquy, he mutters about omens: \"Oh! how valiantly I seek to drive out of others' hearts what's clinched so fast in mine!\" [1]. He had told Starbuck and Stubb that omens are nothing (\"Omen? omen?—the dictionary! If the gods think to speak outright to man, they will honorably speak outright; not shake their heads, and give an old wives' darkling hint\"), which is Ahab's cleanest demand about providence: that if the gods govern, they must say so. The demand is the demand of every theodicy that has asked why a good God hides.\n\n## Defiance Rehearsed: The Quadrant, the Candles, the Needle, the Musket\n\nBetween the oracle and the chase the book arranges a sequence of tests of Ahab's stance, in each of which natural events present themselves as signs and Ahab reads them as challenges. In \"The Quadrant\" he smashes the instrument that tells him his latitude, cursing it as a \"foolish toy\" that can say \"where I am\" but not \"where I shall be\"; a \"fatalistic despair that seemed meant for himself\" passes over the Parsee's face, and Stubb, overhearing Ahab say that \"some one thrusts these cards into these old hands of mine; swears that I must play them, and no others,\" answers: \"live in the game, and die in it!\" [1]. The card-game image is the book's oddest metaphor for fate: the hand is dealt, the player is not free to choose his cards, but he is free to play them boldly.\n\nIn \"The Candles,\" the typhoon brings corposant fire to the masts, and Ahab's address to it is the book's most explicit theological confrontation. The flames are, for Starbuck, \"God's burning finger,\" for Stubb a promise of sperm-oil, for Ahab a spirit he once worshipped: \"I now know thee, thou clear spirit, and I now know that thy right worship is defiance. To neither love nor reverence wilt thou be kind; and e'en for hate thou canst but kill; and all are killed.\" And then the claim on which the passage turns: \"In the midst of the personified impersonal, a personality stands here\" and, a little later, \"There is some unsuffusing thing beyond thee, thou clear spirit, to whom all thy eternity is but time, all thy creativeness mechanical\" [1]. Ahab's position here is not atheism. He acknowledges a power, \"thy speechless, placeless power,\" and denies it authority; he distinguishes between power and the ground of value, and places the ground beyond the power. This is a gnostic move, distinguishing a creator-fire from a higher principle, and it makes his stance more complex than the scorn of Starbuck allows. Starbuck's reply is the Mapplean one: \"God, God is against thee, old man; forbear!\" The scene gives the two readings their purest confrontation, and the narrator's decision is again a refusal: the flame on the harpoon is blown out by Ahab's breath, \"thus I blow out the last fear,\" and the sign is dispatched by the man to whom it was addressed.\n\n\"The Needle\" follows. The thunder reverses the compasses; Ahab re-magnetizes a sail-needle with the hammer and a lance-rod, and proclaims himself \"lord of the level loadstone.\" The narrator observes that \"their fear of Ahab was greater than their fear of Fate\" and that the scene displays \"Ahab in all his fatal pride\" [1]. The conjunction of \"fear of Fate\" with \"fatal pride\" is notable: the nautical omen has become \"Fate,\" and Ahab's act is a trick that suspends the omen by a counter-demonstration. And \"The Musket\" gives Starbuck his version of the dilemma, tempted to shoot the sleeping captain with the loaded musket that Ahab had once pointed at him. His reasoning is the most subtle in the book on the relation of divine and human agency: \"Is heaven a murderer when its lightning strikes a would-be murderer in his bed, tindering sheets and skin together?—And would I be a murderer, then, if—\" [1]. He places the musket against the cabin door, and then, \"Starbuck seemed wrestling with an angel,\" he puts it back. The case against intervention, that heaven itself kills aggressors, is stated in the form of a question and refused. Starbuck's piety, which has hoped for God to \"wedge aside\" Ahab's purpose, here has to decide whether to be the wedge, and he cannot. The result is the clearest example in the book of providence as an alibi: the thought that heaven might do it is the thought that tempts a man to do it himself.\n\n## The Symphony: \"Is It I, God, or Who, That Lifts This Arm?\"\n\nAfter the Rachel, the Delight and the hawk that snatches Ahab's hat, the book gives its most luminous chapter, \"The Symphony,\" a day of blue calm in which the air and sea seem as bride and groom and Ahab, \"untottering,\" lifts \"his splintered helmet of a brow to the fair girl's forehead of heaven.\" The cosmos at this moment is hospitable: the \"step-mother world, so long cruel—forbidding—now threw affectionate arms round his stubborn neck.\" Ahab weeps, and \"nor did all the Pacific contain such wealth as that one wee drop.\" He confides to Starbuck the desolation of his forty years and his marriage, and Starbuck urges him to turn for Nantucket. What follows is the book's pivotal speech on agency:\n\n\"What is it, what nameless, inscrutable, unearthly thing is it; what cozening, hidden lord and master, and cruel, remorseless emperor commands me; that against all natural lovings and longings, I so keep pushing, and crowding, and jamming myself on all the time; recklessly making me ready to do what in my own proper, natural heart, I durst not so much as dare? Is Ahab, Ahab? Is it I, God, or who, that lifts this arm? But if the great sun move not of himself; but is as an errand-boy in heaven; nor one single star can revolve, but by some invisible power; how then can this one small heart beat; this one small brain think thoughts; unless God does that beating, does that thinking, does that living, and not I. By heaven, man, we are turned round and round in this world, like yonder windlass, and Fate is the handspike\" [1].\n\nThis is the book's strongest statement of providence as total causal determination, and it is argued from the cosmos to the man: if nothing in the heavens moves of itself, then nothing in the heart does. It is an argument that the Calvinist tradition would recognize, and Walter Herbert's Moby-Dick and Calvinism (1977), as I know it only from catalogue descriptions and secondhand report, presents the novel as the dramatization of a culture's rejection of such a worldview [5]. But note the turn. The argument ends not in submission but in a catalogue of what Ahab sees around him: the \"smiling sky and this unsounded sea,\" the albacore chasing the flying fish (\"who put it into him to chase and fang that flying-fish?\"), and the question, \"Where do murderers go, man! Who's to doom, when the judge himself is dragged to the bar?\" [1]. The question is the theological problem of responsibility under determinism, raised and left. A cosmos where God does the thinking cannot fault the thinker, and a God who is judged by the same logic cannot judge. And then Ahab drifts into reverie, \"a mild, mild wind,\" haymakers sleeping on the slopes of the Andes, \"Aye, and rust amid greenness; as last year's scythes flung down.\" The chapter's last gesture is that Starbuck has \"stolen away,\" and Ahab, crossing the deck, finds Fedallah's reflected eyes in the water.\n\nBy my own reading this is the center of the book's argument about providence, for three reasons. First, it is the point at which the book's most determined agent articulates, in sincere distress and not in defiance, the thought that he may not be the author of his deeds, and the thought sits beside an equally sincere description of a gentle cosmos. The two are not reconciled. Second, it shows that Ahab's fatalism is not a stable conviction but an interrogative in which \"Fate is the handspike\" is one clause among several. Third, it shows the narrator's discipline: Ishmael, who is not present, supplies the scene with a gorgeous natural setting and Ahab's tear and then lets the most deterministic speech in the book rest on a question mark. The hero is given the thesis of determinism, and the structure shows that he does not hold it firmly.\n\n## The Three-Day Chase: Fate Enacted, Fate Withheld\n\nThe chase can be read as the enactment of the doctrines that the book's characters have been proposing, and it is notable that the narrator's own language of fate becomes most dense here and least committed. On the first day the whale stoves Ahab's boat, and Ahab, helped to his feet, shouts \"The eternal sap runs up in Ahab's bones again!\" [1]. At the climax, as the whale rushes at the ship, the narrator describes it \"strangely vibrating his predestinating head,\" a phrase that gathers the whole argument into a single adjective [1]. In the narrator's mouth the adjective is both a metaphor and a theology: the whale is made to do the predestinating. Retribution, \"swift vengeance, eternal malice\" are said to be \"in his whole aspect,\" in the narrator's own words as he narrates the whale's last charge [1]. That is as close as the narrator ever comes to endorsing Ahab's reading of the whale as malicious, and it is worth emphasizing that the verb is \"were in his whole aspect,\" a description of what the whale looked like to the men on the bow.\n\nThe second day brings the Parsee's disappearance and Ahab's fatalism speech. The third day brings Ahab's most revealing exchange with himself on the wind: \"And by the eternal Poles! these same Trades that so directly blow my good ship on; these Trades, or something like them—something so unchangeable, and full as strong, blow my keeled soul along!\" [1]. The metaphor is of a steady impersonal wind, not a person. He then says that \"Ahab never thinks; he only feels, feels, feels; that's tingling enough for mortal man! to think's audacity. God only has that right and privilege,\" and later that he is \"chasing\" the whale's \"wake\" while the whale, he realizes, \"he's chasing me now; not I, him—that's bad\" [1]. Starbuck, who sees from the deck, says it plainly: \"See! Moby Dick seeks thee not. It is thou, thou, that madly seekest him!\" [1]. On the evidence of the third day the whale does not hunt the ship until Ahab has driven his harpoon into it, and then bears down on the ship rather than the boat. The narrator hedges the whale's motives as carefully as any of the chapter's hedged sentences (\"some latent deceitfulness and malice in him,\" \"seemingly seeing in it the source of all his persecutions; bethinking it—it may be—a larger and nobler foe\"), the language of a witness who reports what it looked like and declines to say what it was [1]. The destruction of the Pequod is thus left ambiguous between two readings. It can be the culmination of a malicious purpose, as Ahab and some of the narration say, or the reaction of an animal that had been harpooned three times and sees the black hull as the source of its pain, as Starbuck's and the surgeon's more naturalistic accounts would have it. A third reading, the Gilder's and the Mat-Maker's, is that both are true: the whale acts from its own nature, Ahab from his, and necessity is the warp on which the encounter was strung.\n\nThe ending is in some respects a Mapplean vindication and in others its refutation. Ahab dies bound to the whale, and the sinking ship drags to her doom \"a living part of heaven,\" the sky-hawk caught between Tashtego's hammer and the mast, \"which, like Satan, would not sink to hell till she had dragged a living part of heaven along with her, and helmeted herself with it\" [1]. The simile makes the ship Satanic and the hawk heavenly. Then the final sentence of the narration proper is \"the great shroud of the sea rolled on as it rolled five thousand years ago\" [1], which restores the cosmos to indifferent continuity. Nothing in the aftermath indicates that anything cosmic has been decided. The sea does not register the outcome, and the simile of the heavenly bird in the satanic ship is the narrator's own sense of cosmic stakes, not the world's.\n\n## The Epilogue: One Alone, and the Fates\n\nThe book's last section is headed by a Job epigraph, \"AND I ONLY AM ESCAPED ALONE TO TELL THEE.\" The line is spoken, in the King James text, by each of the messengers who bring Job news of his calamities in the first chapter; in the verse that opens the series, the Sabean raid at Job 1:15, it ends the report: \"and I only am escaped alone to tell thee\" [15]. The phrase is repeated in the speeches of the messengers that follow, a refrain of the single survivor who carries the news of disaster to the one who must hear it. The epigraph, then, makes Ishmael a messenger of the type that appears in the opening of the Book of Job, the prologue in which God and Satan arrange Job's trial, and it supplies the narrator with a role: witness to a catastrophe whose cause is arranged somewhere else.\n\nThe Epilogue's language of explanation is terse and dual. \"Because one did survive the wreck\" is the first reason, a statement of fact. Then: \"It so chanced that after the Parsee's disappearance, I was he whom the Fates ordained to take the place of Ahab's bowsman, when that bowsman assumed the vacant post; the same, who, when on the last day the three men were tossed from out the rocking boat, was dropped astern\" [1]. The verbs \"so chanced\" and \"the Fates ordained\" appear in the same clause. The surviving is both accident and ordination. The narration then gives the physical sequence of rescue, drawn toward the vortex, revolving \"like another Ixion,\" the black bubble at the axis bursting, the coffin buoy shooting up \"liberated by reason of its cunning spring.\" The coffin, built for Queequeg and made into a life-buoy for the ship, saves the one man who was not on the quarter-deck when the oracle was sworn. The sharks glide \"as if with padlocks on their mouths,\" the sea-hawks sail \"with sheathed beaks,\" a pair of pacified predators the narrator offers without comment. The final sentence is: \"It was the devious-cruising Rachel, that in her retracing search after her missing children, only found another orphan\" [1].\n\nThere are at least three readings of this ending, and they correspond to the three positions the book has been holding. The first, the redemptive reading, takes the Rachel and the coffin as the signature of a providence that saves one man through love: Queequeg's coffin, the grieving mother, the tamed sharks. A 1952 divinity-school thesis in the Concordia Seminary repository reads the rescue by the Rachel, through Jeremiah 31:15, as Christian brotherly love answering Melville's problem [16], and some popular guides likewise put it that Queequeg's love saves his friend; I note these as representative of the reading and not as authority, since the first is a student thesis I have seen only in summary. The second, the ironic or deflationary reading, notes that the Rachel is \"devious-cruising,\" that she \"only found another orphan,\" that the survivor is a remnant and not a victor, and that the coffin is the sign of a death turned into a life-buoy by a carpenter's cobbling, not by a divine design. The third, which I find the most consistent with the rest of the book, takes the Epilogue as an enactment of what the Job epigraph proposes: the survivor is the witness, with a function but without an explanation. In the Book of Job the messengers report; God answers from the whirlwind only afterward and only to Job. Moby-Dick supplies the messenger and withholds the whirlwind. That is the sense in which the book is a Joban work: it reproduces the form of the problem of suffering, the catastrophe and the messenger, but declines to reproduce the divine reply. Ahab's wish that the gods \"speak outright\" is thereby the book's deepest demand and its deliberate non-fulfilment.\n\nThe Epilogue also has a notable internal tension with the Mat-Maker. Ishmael's loom made chance the final blow: \"chance by turns rules either, and has the last featuring blow at events.\" The last blow in the book is the sudden rising of the coffin, a \"cunning spring\" that works without any person intending it. If the loom-figure governs the book's last scene, then the survivor's survival is the product of chance acting within the fixed warp of the sinking. The Epilogue's \"Fates ordained\" can be heard as Ishmael's retrospective gloss on what was, by his own earlier account, the last featuring blow of chance. The two chapters are thus consistent in a way that is easy to miss, and they are consistent in leaving unanswered whether the stroke was blind.\n\n## Putting the Pieces Together: What Is Asserted, What Is Hinted, Where the Text Contradicts Itself\n\nThe evidence can be sorted by the voice that speaks and the force with which it speaks. The summary below lists the positions in compact form; the paragraphs after it say what to make of them.\n\n| Position | Who voices it | How firmly |\n|---|---|---|\n| Providence as pursuit and rescue; God is everywhere, repents and delivers (Mapple, ch. 9) | Mapple, a respected preacher | Asserted by a character, not enacted by the plot |\n| Providence as a stage-managed programme; free choice a \"delusion\" (ch. 1) | Ishmael | Asserted comically, retracted in tone |\n| Hidden malicious or absent principal behind the mask (ch. 36) | Ahab | Asserted with a self-undermining \"naught beyond\" |\n| Internal necessity: \"the innermost necessities in our being\" (ch. 36) | Narrator in his own voice | Asserted without irony |\n| Whiteness as the visible void; invisible spheres \"formed in fright\" (ch. 42) | Ishmael | Offered as questions |\n| Natural order as \"secret intelligence from the Deity\" (ch. 44) | Narrator | Parenthetical aside |\n| Necessity, free will and chance interwoven, chance last (ch. 47) | Ishmael | Offered as reverie, then interrupted |\n| Universe as a practical joke (ch. 49); \"it's all predestinated\" (ch. 39) | Ishmael in a mood; Stubb | Stated as a mood or a dodge |\n| \"Neither believer nor infidel\"; intuitions of heavenly things (ch. 85) | Ishmael | The closest thing to a personal creed |\n| God's back parts, not his face (ch. 86) | Ishmael | Allusive, close to a doctrine of the hidden God |\n| \"Heaven itself seemed to step in\" (ch. 54) | Ishmael as raconteur | Hedged by \"seemed\" and by the dinner-table frame |\n| \"An interregnum in Providence\" (ch. 72) | Ishmael | Argued, then generalized away |\n| God's foot upon the treadle (ch. 93) | Narrator on Pip | Reported as a vision of the \"mad\" |\n| \"Fate is the handspike\" (ch. 132); \"the Fates' lieutenant\" (ch. 134) | Ahab | Asserted passionately, contradicted at once |\n| \"The Fates ordained\" / \"so chanced\" (Epilogue) | Ishmael | Asserted twice in one clause |\n\nSeveral conclusions follow. The first is that the book asserts without hedging exactly three things. It asserts that significance is the condition of value (\"some certain significance lurks in all things\"); that \"innermost necessities\" drive human action; and that Ahab acts as he does. Everything else is voiced by a character, offered as a question or a mood, or hedged with \"seemed\" and \"as if.\" The second is that the hints cluster in one direction: toward a hidden, indifferent or inscrutable power rather than a benevolent one. The \"indifferent as his God\" of Pip, the \"back parts\" of the whale, the \"unseen and unaccountable old joker,\" and the \"heartless voids\" are all variants of an unknown that does not clearly care, and the Mapplean God of pursuit and rescue is the one position that the plot never enacts. But the hints also leave room for the opposite: the rainbow over the spout, the sun of Righteousness Starbuck reads, the \"divine intuitions\" that shoot \"enkindling my fog,\" and the Rachel's rescue are all consistent with a benign order that is simply not demonstrable.\n\nThe third conclusion, and the one the question demands, concerns contradiction. The text contradicts itself in at least five distinct ways, and I distinguish them because only some are genuine. The first is a contradiction of voice: characters assert incompatible doctrines, which is not a contradiction of the book's own position, since the book has none. The second is the contradiction within a single speech, as in Ahab's \"naught beyond\" against \"some unknown but still reasoning thing,\" or his \"Fates' lieutenant\" who gives orders; these are contradictions of a character and part of his portrait. The third is the contradiction between a stated theory and the event that follows, as when the ball of free will drops in the middle of the loom; these are the book's characteristic ironies. The fourth is the contradiction between the narrator's confident philosophizing and his confessed limits: he tells us that the question of what the whale was to the crew is something \"to dive deeper than Ishmael can go,\" while elsewhere describing in detail what the whale was. And the fifth, the only one that I think is a possible flaw in craft rather than design, is the narrator's scope: Ishmael narrates scenes he could not have witnessed, and in doing so attributes inner states to Ahab, Starbuck and Stubb that make the same events readable as free or as fated depending on whether one takes the soliloquies as the narrator's invention. The book never explains this, and a reader can take it as a license (a retrospective narrator reconstructing from \"the innermost necessities\") or as an inconsistency. I regard it as the former, but the evidence does not force that.\n\n## Where the Scholarship Divides, and What the Text Allows\n\nThe interpretive literature maps onto the structure just described, and the text allows more of it than its advocates admit. The Thompson line, set out in the 1952 Melville's Quarrel with God, holds that Melville concealed a conviction of God's \"cruelty and malice\" behind satire of Christian doctrine, and reads the works from Typee to Billy Budd as carrying that hidden critique [4]. The text supports Thompson on the existence of the \"inscrutable malice\" hypothesis and on the book's frequent mockery of orthodox consolation, and it cannot support him on the claim that this hypothesis is Melville's own, since the one character who holds it dies of it and the narrator who survives it does not repeat it. Thompson's biographical method, which reads a character's speech as the author's cipher, is exactly what the narrator-author distinction forbids, though his sense that the book is hostile to naive providentialism is not easily dismissed.\n\nAt the other pole stand the Christian-moral readings: Lockerbie's 1963 argument that the novel is Christian, with Mapple's sermon as the key and Ahab as the figure of conscience quenched [8], and the earlier tradition of Vincent, Auden and Stewart that he reports [8]. They have the sermon's prominence and the book's Biblical saturation on their side, and the Epilogue's Rachel. They have against them the fact that the book never shows a providential rescue that is not also explicable as chance, and that the Mapplean pattern of sin, punishment, repentance and restoration is enacted by no one. Holstein's 1985 argument that the sermon itself inverts Jonah and conveys an anti-biblical outlook [6], and Carmy's 2017 argument that Mapple misreads Jonah [7], bear on a related question that I would put more cautiously: whether the sermon is orthodox. Carmy's reading is a reading of Jonah and not of Melville, and it shows that a sophisticated reader can find the sermon theologically thin without attributing the thinness to authorial design. Holstein's thesis is stronger and, from the abstract, rests on the claim that the sermon and its setting \"posit a paganism\"; I cannot test it without the article, and the text gives it partial support in the way the sermon's God is exercised only through a whale and a storm.\n\nThe biographical readings are a third line. Hawthorne's notebook entry for November 20, 1856, recording a walk with Melville among the sand-hills at Southport, near Liverpool, says that Melville \"began to reason of Providence and futurity,\" had \"pretty much made up his mind to be annihilated,\" and \"can neither believe, nor be comfortable in his unbelief\" [2]. The entry reaches me through a blog post quoting Charles Olson's Call Me Ishmael, not through an edition of the notebooks, and so it is a secondhand witness to a firsthand diary, (the abridged edition of the notebooks on Project Gutenberg prints a different date, November 30, for the entry containing the Providence sentence, and I have not been able to settle the dating from an edition), but it is the most-cited contemporary characterization of Melville's religious position and it is consistent with the narrator's stance in \"The Fountain.\" Melville had himself praised, in \"Hawthorne and His Mosses\" (1850), a \"power of blackness\" in Hawthorne that he traced to a Calvinistic sense of innate depravity and original sin [18], so the Calvinist vocabulary was one he used of others before he used it, indirectly, of himself. Melville's own letter to Hawthorne of November 1851, in a transcription I have seen online, says \"I have written a wicked book, and feel spotless as the lamb\" [3]. The phrase is a boast and a confession in the same breath, and it is again compatible with a book that stages what it does not assert.\n\nTwo recent critics are best understood as refining rather than choosing. Andrew Delbanco's 2005 Melville: His World and Work, published by Knopf, is a widely read recent study of the life and work [9], and Robert Milder's Exiled Royalties (Oxford University Press, 2006), as its catalogue description reports, treats Melville's spiritual, psychological and vocational life as the lens and takes as its central theme the effort to live with dignity without settled belief, with a title essay that starts from Ishmael's description of Ahab [10]. I have not read either closely for this chapter and cite them for their framing, which agrees with the approach here: the novel dramatizes a mind that cannot settle, not a creed. Hershel Parker's two-volume biography, whose first volume (1996) ends with the publication of Moby-Dick, is the indispensable factual base, though a review I consulted says it offers little on the creative process of the book itself [11]. F. O. Matthiessen's American Renaissance (1941) established the book's place in the American canon [17]; the foundational claim about its tragic and Shakespearean character is familiar but I did not verify the passage and do not rest anything on it.\n\nWhere, then, does the evidence lean? Against any reading that locates a single doctrine in the book, and in favor of one that describes its form. Moby-Dick is built so that each of the doctrines of governance, the Mapplean, the Ahabian, the Stoic loom, the jocular, the agnostic, is voiced by the character or mood most able to make it persuasive, and each is brought to a test that it neither passes nor flatly fails. The narrator's own cumulative position, if it can be extracted, is the one in \"The Fountain\" and \"The Try-Works\": intuitions of the heavenly under a fog of doubt, a Solomonic acceptance of woe as a form of wisdom, a conviction that there is a woe that is madness, and a settled refusal to rest in either belief or its negation. That position is not a providence. It is an attitude toward the possibility of providence, and it is the attitude of a man who has survived.\n\nThe author's own view is another matter, and the text does not decide it. What the text allows is a narrower, defensible claim: that Melville wrote a book whose structure makes the question of cosmic order its engine and denies the reader a verdict, and that this denial is deliberate, as the repeated pairing of assertion and interruption (the Mat-Maker's dropped ball, the Symphony's question mark, the Epilogue's \"so chanced\" and \"Fates ordained\") shows. By my own reading it is the book's most important formal fact. It is also the reason the scholarship has not converged, since each critic can find the position he seeks by attending to one voice, and cannot keep it by attending to all of them.\n\nThe standing of the book's scholarship is worth recording briefly in the present tense, since the debate is alive. The Melville Society's journal, Leviathan, is published by Johns Hopkins University Press and Project MUSE lists recent issues in Volume 28 (2026); the March 2026 number carries \"Oceanic Melville,\" an Extracts section of keynotes, reports and photographs from the society's fourteenth international conference at Avery Point, Groton, Connecticut, in June 2025 [14][19]. The standard teaching text, the Norton Critical Edition, is in its third edition under Hershel Parker's editorship [12], and the scholarly text, the Northwestern-Newberry edition, is available in a 2001 reissue [13]. The debate about providence is a living one in that sense: the editions that fix the words, and the society and journal that carry the argument, remain active.\n\n## Open Questions\n\nWhether the narrator's reconstruction of scenes he could not have witnessed is a deliberate device meant to frame the whole as Ishmael's imaginative recovery, or a lapse the author never reconciled, is not settled by the text, and a close study of Melville's drafts and of the surviving evidence of revision would be needed to say. A related question is whether the book's chapters on providence were written in the order in which they appear; the long-debated hypothesis that the novel was substantially expanded and altered after a first version, which I have not checked against primary evidence, would bear on whether the Mat-Maker's compatibilism or Ahab's fatalism was the earlier conception.\n\nIt is also uncertain how much weight to give Ishmael's retrospective voice when it uses the language of fate. If \"the Fates ordained\" in the Epilogue is spoken by a survivor who has just been rescued by a coffin, the phrase is a thanksgiving; if it is spoken by a narrator who has meditated for the length of the book on the loom's last featuring blow, it is a deliberate echo of chance. The text supports both, and what would adjudicate between them, a signal of tone in the Epilogue's one clause, does not exist in the transcription.\n\nFinally, I have not been able to examine the strongest full-length statements of the competing positions directly. Thompson's and Herbert's books, Milder's and Delbanco's studies, Parker's biography and the relevant critical articles were consulted only through catalogue records, publisher descriptions and reviews. A fuller treatment would have to read them whole, and in particular would have to test Herbert's claim, which I know only secondhand, that the novel stages the dismantling of the Calvinist world picture, against the text's own repeated reaffirmation of the hidden God in \"The Tail.\"\n\n## Sources\n\n[1] Melville, Herman. Moby Dick; Or, The Whale. Project Gutenberg eBook no. 2701 (plain-text transcription of the 1851 American text; read in full for the chapters discussed). https://www.gutenberg.org/ebooks/2701 and https://www.gutenberg.org/cache/epub/2701/pg2701.txt. Accessed 2026-10-24. Tier 1.\n\n[2] Hawthorne, Nathaniel. English Notebooks entry, November 20, 1856, on Melville; quoted in \"Nathaniel Hawthorne on Herman Melville: 'He can neither believe, nor be comfortable in his unbelief,'\" Biblioklept, 8 June 2012, which says it found the passage in Charles Olson, Call Me Ishmael. https://biblioklept.org/2012/06/08/nathaniel-hawthorne-on-herman-melville-he-can-neither-believe-nor-be-comfortable-in-his-unbelief/. Accessed 2026-10-24. Tier 1 content via a Tier 6 blog transcription; unchecked against an edition of the notebooks.\n\n[3] Melville, Herman. Letter to Nathaniel Hawthorne, November 1851 (transcription titled as such on Biblioklept, posted 9 September 2014; the transcription itself carries no date line). https://biblioklept.org/2014/09/09/letter-to-nathaniel-hawthorne-november-1851-herman-melville/. Accessed 2026-10-24. Tier 1 content via a Tier 6 transcription; should be checked against the Northwestern-Newberry Correspondence volume.\n\n[4] Thompson, Lawrance. Melville's Quarrel with God. Princeton: Princeton University Press, 1952; reissued in the Princeton Legacy Library, 19 April 2016. Publisher's description. https://press.princeton.edu/isbn/9780691650357. Accessed 2026-10-24. Tier 2 (publisher page; book not read).\n\n[5] Herbert, T. Walter, Jr. Moby-Dick and Calvinism: A World Dismantled. New Brunswick, N.J.: Rutgers University Press, 1977. Library catalogue records (e.g., https://bemis.marmot.org/Record/.b13073254); the characterization of its thesis rests on a catalogue-level summary and a secondhand report. Accessed 2026-10-24. Tier 2 (book not read).\n\n[6] Holstein, Jay A. \"Melville's Inversion of Jonah in Moby-Dick.\" The Iliff Review 42, no. 1 (Winter 1985): 13-20. Abstract via University of Iowa repository. https://iro.uiowa.edu/esploro/outputs/journalArticle/Melvilles-inversion-of-Jonah-in-Moby-Dick/9983913593702771. Accessed 2026-10-24. Tier 2 (abstract only).\n\n[7] Carmy, Shalom. \"Observe His Prayer.\" First Things, August/September 2017. https://firstthings.com/?p=12231. Accessed 2026-10-24. Tier 5/6 (essay by a Yeshiva University scholar in a religious-conservative magazine; read as a reading of Jonah, not as evidence of Melville's belief).\n\n[8] Lockerbie, D. Bruce. \"The Greatest Sermon in Fiction.\" Christianity Today, 8 November 1963. https://christianitytoday.com/?p=62409. Accessed 2026-10-24. Tier 6 (evangelical magazine; used as a report of the positions of Thompson, Mumford, Vincent, Auden and Stewart, whose works
