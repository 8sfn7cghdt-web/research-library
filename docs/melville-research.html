#pager { max-width: 700px; width: 100%; margin: 0 auto; padding: 1.1rem 2rem 3rem;
  display: flex; align-items: center; justify-content: space-between; font-family: var(--sans);
  border-top: 1px solid var(--border); }
#pager button { background: none; border: 0; border-radius: 0; padding: .2rem 0;
  font-family: var(--sans); font-size: .68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: .12em; color: var(--accent); cursor: pointer; max-width: 40%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: color .15s var(--ease), transform .16s var(--ease); }
#pager button:hover:not(:disabled) { color: var(--text); }
#prev:hover:not(:disabled) { transform: translateX(-3px); }
#next:hover:not(:disabled) { transform: translateX(3px); }
#pager button:disabled { opacity: .35; cursor: default; }
#pager-label { font-family: var(--mono); font-size: .68rem; font-weight: 500; text-transform: uppercase;
  letter-spacing: .06em; font-variant-numeric: tabular-nums; color: var(--muted); }

  body.menu-open #sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  #menu-btn { display: block; }
  #main { margin-left: 0; }
  #content { padding-top: 3.6rem; }

/* a deep-linked passage flashes briefly when the reader scrolls to it */
@keyframes passageFlash { 0% { background: var(--mark); } 100% { background: transparent; } }
.passage-flash { animation: passageFlash 2.2s ease; border-radius: 4px; box-decoration-break: clone; }
/* related reading at the foot of the reading column */

.related-h { font-family: var(--display); font-weight: 600; font-size: 1.08rem; margin: 0 0 .9rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }

  position: relative;
  transition: transform .16s var(--ease), box-shadow .16s var(--ease),
              border-color .16s var(--ease), outline-color .16s var(--ease); }
.related-card:hover, .related-card:focus-visible { border-color: var(--text);

  letter-spacing: .14em; color: var(--accent); margin: 0 0 .3rem; }

@media (min-width: 861px) {

  align-items: center; justify-content: center; }

<script id="corpus-data" type="application/json">{"slug": "melville-research", "title": "The Sea Does Not Say", "subtitle": "Melville, Moby-Dick, and the unanswered argument about providence", "author": "", "generated": "2026-10-24", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of Moby-Dick and Providence", "summary": "Moby-Dick keeps asking one question and never answers it: is anyone running the world, and if so, are they good? Melville built a whaling novel into an instrument for putting that question to every reader.", "body": "# Six Easy Pieces of Moby-Dick and Providence\n\n*A plain-language way into a very big book.*\n\n## Is anyone steering?\n\nImagine a ship captain who has lost a leg to a whale. He decides the whale is not just an animal. He decides it is the face of something behind the world, something that planned his loss and means him harm. He spends the whole book chasing it, and the ship goes down.\n\nThat is the plot of *Moby-Dick*, published in 1851 by Herman Melville. Underneath the plot sits a question the book keeps asking and never answers: is anything governing events, and if so, is it good? The old word for that governing is *providence*, the belief that God steers what happens, and does so on purpose. Melville did not write an essay for or against it. He wrote a book that puts the question to the reader and then refuses to hand over the answer.\n\n## Why anyone should care\n\nIf providence is real, then your suffering means something and your life is going somewhere. If it is not, then things just happen, and any meaning has to come from you. Most people have felt both pulls, usually in the same week. Melville's readers have too, which is much of why the book has lasted.\n\nThe argument has also had a long human cost. Melville's own friend Nathaniel Hawthorne wrote in his journal in 1856 that Melville \"can neither believe, nor be comfortable in his unbelief.\" That sentence is the whole story of his life in one line. He could not say yes to the doctrine, and he could not settle into saying no.\n\n## The people and the words you need\n\nFour people carry the book's argument.\n\n**Ahab** is the captain. He believes a hidden, perhaps malicious power stands behind the world, and he thinks the only dignified response is to strike back at it, even if the striking was fated in advance.\n\n**Ishmael** is the narrator and, in the end, the only survivor. He tries on one belief after another, a bit like a man testing coats. The closing page quotes the Book of Job: the one messenger who escapes a disaster alone to tell about it.\n\n**Father Mapple** is a preacher in an early chapter. His sermon on the prophet Jonah says God pursues his runaways and rescues them. It is the most orthodox providence in the book.\n\n**Starbuck, Stubb and Pip** round out the crew. Starbuck is pious, Stubb jokes about fate, and Pip, a cabin boy driven mad by terror, glimpses a God who seems indifferent.\n\nTwo terms also matter. *Calvinism* is the strict Protestant tradition Melville grew up near, through his mother's Dutch Reformed church in Albany. It teaches that God has foreordained everything and that human beings are deeply flawed. And *theodicy* is the effort to square a good, all-powerful God with the existence of evil. Melville inherited that problem and never solved it.\n\n## How the book makes the argument\n\nThe novel does not state a doctrine. It stages a trial and calls in several witnesses.\n\nMapple preaches that God hunts down his fugitives and saves them. A few chapters later Ahab announces that the whale is a mask, and that behind the mask there may be nothing at all, or something cruel. Stubb laughs the universe off as a joke. In a chapter about weaving a mat, Ishmael pictures life as a loom: necessity sets the threads, free will throws the shuttle, and chance strikes the blows. Then the chapter breaks off, unfinished, and nothing says which of the three wins.\n\nAt the end, the *Pequod* sinks and Ishmael floats up alone. The book explains his survival in one sentence that gives two causes: it \"so chanced,\" and also \"the Fates ordained.\" The narrator does not choose. A careful reader notices the form of the book is the real argument: a claim, then an interruption, then another claim, with no verdict handed down.\n\n## The fight\n\nScholars have fought for a century over what Melville himself thought.\n\nOne side says he was quarreling with God. On that reading Ahab is partly Melville, and the book is a long act of defiance against a deity he believed was real and unjust. A second side says Melville was working out the Calvinist inheritance he grew up with and could not shake. A third says he was an honest agnostic who simply refused to pretend either way. A fourth says the question is about power and empire as much as heaven: the *Pequod*'s crew is a floating world of slavery, labor and conquest, and \"fate\" is partly what the powerful call their choices.\n\nHere is the strongest objection to all of them. A novel is not a treatise, and no character reliably speaks for the author. The word \"providence\" itself appears in the book only a few times, mostly with irony. Melville's own letters show a man whose moods changed from week to week. So \"Melville argues for a view of providence\" is weakly supported. What the evidence does support is narrower and, I think, more interesting: Melville built an instrument that makes the question impossible to avoid and impossible to answer.\n\n## Where it is heading\n\nThe book is not going anywhere. By 2050 *Moby-Dick* is most likely still near the top of the list of great American novels. The Melville Society, its journal, a finished scholarly edition and a 2025 Metropolitan Opera production all say the field is healthy today.\n\nWhat changes is the wording of the question. Fewer readers will ask whether Melville believed in God. More will ask what the whale means if nature is indifferent, who pays for a captain's obsession, and whether a single stubborn will can be stopped. The more worrying risk is thinner readership: fewer students taking the humanities, and fewer people with the patience for a very long book. That outcome is roughly one chance in four.\n\nWatch two things: whether schools keep assigning the novel, and whether new Melville evidence turns up. The book's own answer will stay what it has always been, which is that the sea does not say."}, {"order": 1, "file": "01_Origins_And_Intellectual_Lineage.md", "title": "The Inheritance and the Break: Where Melville's View of Providence Came From", "summary": "", "body": "# The Inheritance and the Break: Where Melville's View of Providence Came From\n\n> ## Bottom Line\n> Melville grew up between two churches, a strict Dutch Reformed Calvinism on his mother's side and a looser, Unitarian-leaning faith on his father's, and then lost the father and the money in the same few years. The documented evidence says he never shed the Calvinist grammar of election, depravity and a hidden sovereign God, but he refused its comfort. Three encounters pushed him from inheritance to argument: the whaleship, where providence had to be read off real storms and a real wrecked ship; his 1849 reading of Shakespeare, Milton and Bayle; and the summer of 1850, when Hawthorne's \"blackness\" gave him a living model of a writer who kept the Calvinist darkness without the Calvinist creed. Scholars still disagree about whether the result is a quarrel with God (Thompson), a dismantling of Calvinism from inside (Herbert), or something more open than either.\n\n## What the Question Is, and Why Origins Matter\n\nAny account of Melville's view of providence has to start by deciding what kind of thing an \"origin\" is. By providence I mean, in the sense the novel itself uses the word, the claim that events are governed by a purposive intelligence: in the Reformed tradition, a God who has foreordained everything and who governs even sparrows. Melville's characters keep testing this claim against experience. Ishmael, in the opening chapter, says his decision to go whaling \"formed part of the grand programme of Providence that was drawn up a long time ago\" [1]. He says it with a joke, and the joke is the whole problem: is a providence that lists a man's voyage as a \"shabby part\" among the stage-managed Fates [1] a piece of comic self-excuse, a theological position, or both?\n\nThe scholarship on Melville's sources has run on three rival models, and it helps to name them before turning to evidence. The first, associated with Lawrance Thompson's *Melville's Quarrel with God* (Princeton, 1952), holds that Melville held a settled conviction about the \"cruelty and malice\" of God and wrapped it in satire of Christian doctrine, using literary deceptions that would mislead orthodox readers while mocking them [2]. The second, associated with T. Walter Herbert Jr., holds that Melville drew on the real doctrinal and anti-doctrinal literature of Calvinism and used it to dramatise a world in which cosmic evil and revolt against the ultimate become possible [3]. The third, which I will argue the evidence supports best, treats Melville as a writer who inherited a vocabulary and tested it against experience, with the tests coming out differently in different books and different moods. Thompson's thesis is the boldest, and for that reason the easiest to put under pressure: a settled conviction sits uneasily with letters in which the same man says in June that \"Truth is the silliest thing under the sun\" (the context is the world's treatment of anyone who tries to live by it, not a theory of truth) and in November that \"truth is ever incoherent\" [4][5].\n\nA methodological warning belongs here. Most of what is claimed about Melville's religious formation rests on a thin documentary base. Biographers have noted, as one reviewer of Andrew Delbanco's *Melville: His World and Work* (Knopf, 2005) observed, how few of the biographer's usual primary materials survive for a writer of such stature [6]. Marginalia help: Melville's Marginalia Online, the digital edition directed by Steven Olsen-Smith, Peter Norberg and Dennis Marnon and partly funded by the National Endowment for the Humanities, reports, following an NEH feature, that Melville owned an estimated thousand volumes over his lifetime and that the whereabouts of only about 285 are known [7]. Everything below should be read with that scarcity in mind. Where I say a book \"shaped\" him, I mean that the evidence shows he read it and that the novel echoes it, not that I can prove cause.\n\n## Two Churches in One Household\n\nThe best-attested facts about Melville's religious start are also the most contested in interpretation. He was baptised at home, about three weeks after his birth in 1819, by a minister of the Dutch Reformed Church, the church of his mother, Maria Gansevoort [8][9]. A New York City records-office account of his life says the same thing in plainer terms: his mother \"had him baptized in the Calvinist Dutch Reformed church she attended\" [9]. The Gansevoorts were an old Albany family of Dutch descent, and Maria's father was reportedly counted the richest man in Albany [10]. The article that reports this is a general-audience biography rather than scholarship, so I would not lean on the detail, but it matches the long-standing biographical picture.\n\nThe father's side is harder to pin down. The accounts I could reach describe the Melvill family as drifting from rigorous Calvinism toward Unitarianism. A Wikipedia summary, which I use only as a pointer to the biographers it names, reports that Allan Melvill \"subscribed to\" his own father's Unitarianism and that Maria had been raised in the stricter Dutch Reformed version of Calvinism, citing the 1996 biography by Hershel Parker and the 1996 life by Laurie Robertson-Lorant, along with Newton Arvin's 1950 study, which calls Calvinism the most decisive early influence [8]. I have not been able to read these books and I flag the point as relayed. A scholarly article titled \"Herman Melville's Religious Journey\" by a scholar named Kring, which I could see only through a search summary and not directly, reportedly argues that Unitarian associations never eased a Calvinist guilt that Melville spent a lifetime trying to escape [11]. I treat that as suggestive rather than established.\n\nSo the plain statement, supported by more than one secondary source, is that Melville grew up with two inherited religious dispositions in one house. What is defensible but contested is how much each mattered. The scholarly record I could reach is split. Arvin's weighting of Calvinism as \"most decisive\" reflects a mid-century consensus [8]. Herbert's book, *Moby-Dick and Calvinism: A World Dismantled* (Rutgers, 1977), works from Melville's family papers and the classic Calvinist texts to argue that the novel dramatises a spiritual struggle in a culture turning away from Calvinist theology [3][12]. A critic of Thompson, writing in PMLA, observed that earlier scholars such as Yvor Winters had linked Melville's allegorical habit of mind to Calvinism and that William Braswell stressed \"the sturdy faith of Melville's family\" as a source of characteristic habits of mind, without describing the Calvinism in which he was reared [13]. That last complaint is worth underlining. The category \"Calvinism\" is often used in Melville criticism as a mood rather than as a set of doctrines, and the Dutch Reformed variety of Calvinism that Melville actually breathed in Albany differs in emphasis from the New England Puritan variety that Hawthorne inherited and that Melville tends to be read through.\n\n### The bankruptcy, the death, and what the sources can bear\n\nThe family's finances collapsed in stages. After the birth of the last of his siblings in 1830, the Gansevoorts withdrew support; Allan \"quickly went bankrupt,\" and moved the family to Albany to try the fur trade [9]. By 1830 he owed over $20,000 to the Melvill and Gansevoort families, according to the Wikipedia summary of the biographers [8]. In December 1831 he fell ill with a fever after riding in an open carriage in a winter storm and he died on January 28, 1832 [9]. A popular biography says his money worries \"drove him mad\" shortly before his death [10], a claim another general account softens to an apparent mental breakdown [14]. Neither is a scholarly source, so the mental-collapse detail is best held as probable, not settled. Herman left the Albany Academy in the fall of 1831, probably for financial reasons [8][9].\n\nWhat does this have to do with providence? A reader might expect a straight line: the ruined father, the deprived boy, the God who ruins. The sources do not support a straight line, and the temptation should be resisted. One piece of Melville's own writing does look back on the collapse. In *Redburn* (1849) the narrator recalls the happier days \"before my father became a bankrupt, and died, and we removed from the city\" [15]. But *Redburn* is a novel, its narrator is a fictional boy, and the novel was written in the same year Melville was rereading Shakespeare and buying Bayle. Using it as direct testimony would be circular. My own inference is more modest: the family disaster gave Melville an early, concrete experience of a world in which prosperity and standing could vanish through no visible fault of the child, and in which respectable religion offered an account of why. That is a precondition for caring about providence, not a cause of any particular view of it.\n\n### What the sermon culture supplied\n\nMelville's chapter on Father Mapple's sermon shows what the Calvinist pulpit tradition gave him as a writer, whatever his own belief. Mapple's address on Jonah turns on a hard paradox: \"if we obey God, we must disobey ourselves,\" and the sermon calls the preacher \"to preach the Truth to the face of Falsehood\" [16]. The sermon's second lesson, Jonah's task \"to preach the Truth to the face of Falsehood,\" is followed by the phrase \"Woe to him whom this world charms from Gospel duty!\" and the answering line \"Delight is to him\" who stands by God against the world [16]. These are not parodies. They are a recognisable pulpit register: a text, an application, a woe, and a reward. Herbert reads this sermon as presenting orthodox Calvinist teaching on Jonah and then reads Ahab's revolt as a revolt against that orthodoxy's God, drawing on an anti-Calvinist tradition that depicted Calvin's God as a monster, and on Calvin's own treatment of King Ahab as a reprobate predestined to damnation [3]. By my reading, Herbert has the strongest account of why the novel's Ahab is named as he is. But Herbert's article is, on his own showing, an argument about how theological material is used within the novel's themes, not a claim about Melville's private belief [3]. That distinction matters: a writer can know a theology thoroughly and use it without holding it.\n\n## The Sea as Second School\n\nOn January 3, 1841, Melville sailed from Fairhaven, Massachusetts, as a green hand on the whaleship *Acushnet*, according to the biographical account that Wikipedia relays from Parker [8]. The ship reached the Marquesas in 1842; Melville deserted there, and the experience became *Typee*, published in London in February 1846 and in New York in March of that year [8]. He was discharged in Boston in October 1844 [16b]. These dates are well attested across sources, with small discrepancies about days (some give January 1 or 3 for the departure) [16b].\n\nThe sea did two kinds of work on his religion. First, it exposed him to what Christian civilisation actually did in the Pacific. *Typee* speaks of missionaries \"sent on a heavenly errand\" who passed some islands by, notes that Protestant missions \"appear to have despaired\" of the Marquesas, and, in the text's own words, suggests that \"were civilization itself to be estimated by some of its results\" the unconverted world might look better [17]. The preface admits that passages \"bear rather hard upon a reverend order of men,\" and the introduction says the original manuscript carried severe passages on missionary methods that were cut from American editions [17]. This is early, documented evidence of a Melville willing to judge institutional Christianity by its fruits. It is not yet a view about providence, since a missionary critic can be perfectly orthodox about God. But it shows the habit of testing doctrine against reported conduct that later grows into the novel's larger tests.\n\nSecond, the sea gave him the Essex. In 1820 the whaleship *Essex* of Nantucket was sunk by a sperm whale, and the first mate, Owen Chase, published a narrative of the disaster in 1821. According to a popular account built on Heffernan's *Stove by a Whale* (Wesleyan University Press, 1981), Melville met Chase's teenage son, William Henry Chase, at a gam in the Pacific and borrowed the narrative from his sea chest, and Melville later wrote of the \"surprising effect\" of reading the story near the latitude of the wreck [18]. I could not read the book or the Melville note directly, so the quotation and the encounter should be treated as relayed. What I can verify from the novel is that Melville names the Essex and Owen Chace (his spelling) in Chapter 45, says he has \"seen Owen Chace, who was chief mate of the Essex,\" and describes the whale as \"Dashing his forehead against her hull\" so that he \"stove her in\" [19]. Heffernan's volume reportedly reproduces, in an appendix, Melville's markings in his own copy of the narrative [18].\n\nWhy does the Essex matter for providence? Because it presented, as fact and in a sailor's voice, an event that both orthodox and sceptical readers could read opposite ways: a whale appeared to single out a ship and its crew, and men survived at sea by horrors. The novel's later argument about whether the whale's act is malice, instinct or accident depends on a prior, real event that no one in 1851 could settle. I flag that as inference. It is a reading of why the episode was useful to him, not a documented statement of intent.\n\n## The Books: What He Read and What the Marginalia Show\n\n### Shakespeare, after 1849\n\nThe most reliable evidence of reading is the set of books Melville annotated. His seven-volume *Dramatic Works of William Shakspeare* (Boston: Hilliard, Gray, 1837), now at Harvard's Houghton Library, has no autograph or acquisition date, but a letter to Evert Duyckinck of February 24, 1849 describes an \"edition in glorious great type,\" and the Marginalia Online note suggests this may be the same set, with the link \"not beyond question\" [20]. A \"$6\" pencilled on the title page of volume 2 may be the price of a used set, though the note does not confirm it, and it allows that Melville, who wrote of \"chancing to fall in with\" the edition, may not have owned this very copy; the notes on the rear flyleaves of volume 7, drawn from other printed sources, date to 1849–1851 [20]. Scholars who have used digital text analysis count thirty-one plays marked and 681 passages with attributable marginalia [21]. An essay titled \"At the Axis of Reality,\" which I could place only through a search summary and could not attribute or date with confidence, is reported as a recent treatment [21]. Charles Olson's 1938 essay \"Lear and *Moby-Dick*\" and Julian Markels's 1993 book on the path from *King Lear* to *Moby-Dick* are listed in the Marginalia Online note as studies drawing on this very set [20]. I did not read either.\n\nIn the Hawthorne review (below) Melville names the \"dark characters of Hamlet, Timon, Lear, and Iago\" as the vehicle through which Shakespeare speaks \"deep truths,\" and he calls Shakespeare among \"masters of the great Art of Telling the Truth,\" doing so \"covertly, and by snatches\" [22]. That is Melville's own description of Shakespeare, and it matters for the providence question because it states a theory of how a writer can say forbidden things: through a dark character's mouth, not the author's. Thompson's thesis about Melville hiding his quarrel behind satire relies on exactly this kind of theory, and Melville states it explicitly in 1850 [2][22]. The inference is tempting but the limits are clear: a theory of covert truth-telling shows that Melville valued the technique, not that he used it to conceal one fixed conviction.\n\n### Milton\n\nMelville's two-volume 1836 *Poetical Works of John Milton* is at Princeton, with checkmarks, underscores and Xs throughout *Paradise Lost* and other poems; the Boise State and Marginalia Online scholars date his markings to at least three occasions, 1849, 1860 and 1868, and have recovered erased annotations [23][24]. An article in *Leviathan* in 2015 by Peter Norberg, Steven Olsen-Smith and Dennis Marnon reports the recovery of erased annotations [24]. The literary essayist William Giraldi, writing in the *Los Angeles Review of Books* in 2013, argues that Ahab is modelled on Milton's Satan, a figure of \"fatal pride\" [25]. In the novel Ahab calls the three peaks on the doubloon \"proud as Lucifer\" and says each is himself, which is an Ahabian self-image, not a direct claim of Miltonic descent. I treat Giraldi as a Tier 5 critical voice, not as evidence of Melville's own statement. The firmer point is that the volumes record a reading in 1849, the year before Melville's most intense work on the whale, and that Ahab's Luciferian self-image is available to a reader as a Miltonic echo. Whether Milton gave Melville a model of rebellion against providence, or merely a style for it, remains argued.\n\n### Bayle\n\nMelville bought a set of Pierre Bayle's *Dictionnaire historique et critique* in early 1849 and told Duyckinck, in a letter quoted by Millicent Bell, that he had \"bought a set of Bayle's Dictionary the other day\" and planned a summer of reading [26]. Bell's 1951 PMLA article, \"Pierre Bayle and *Moby Dick*\" (vol. 66, no. 5, pp. 626–648), argues that Bayle's influence on the novel was extensive and \"pervasive\" [26]. She traces parallels in the whale lore, in Bayle's chapters on the Manichees (a debate in which Zoroaster and Melissus argue about the origin of evil) and on Pyrrho the sceptic, and she reads Melville's \"Descartian vortices\" as images of a Godless, mechanical universe [26]. I could only see the first page and footnotes, so I report her claims, not my verification of them. A cautionary point: Bell reads a slip in Melville's handling of a Bayle passage as proof of borrowing [26]. That is an argument from textual accident, plausible but not conclusive.\n\nBayle matters to providence for a reason that is independent of Bell's parallels. Bayle's entry on the Manichees is the great early-modern statement of the problem of evil as an argument for dualism and against a single good, all-governing God, and reading it in the same months as Shakespeare's tragedies is consistent with what the novel does. This is background knowledge about Bayle rather than a point I sourced in this research, and I give it as inference. The thing to carry forward is Bell's finding that scholars have connected Melville's reading of the sceptical theodicist to the novel's questions about evil [26], and my own caution that I could not verify the strongest parallels.\n\n### The Bible\n\nMelville's New Testament and Psalms, an American Bible Society edition of 1844 given to him in 1846 by an aunt, carries marginalia studied by Brian Yothers in *Leviathan* (2008) and in Marginalia Online (2011) [27][28]. James Duban, in the Melville Society's journal, identifies the source of its long unattributed inside-cover inscriptions as the writings of Thomas Carlyle, according to the search summary I reached; I did not read the article [27]. That is the only documentary link between Melville and Carlyle that I found, and it is itself relayed.\n\nThe novel's own use of Solomon is easy to confirm. In \"The Try-Works,\" Ishmael cites Solomon (\"the man that wandereth out of the way of understanding shall remain... in the congregation of the dead\"), writes \"There is a wisdom that is woe; but there is a woe that is madness,\" calls Ecclesiastes \"the fine hammered steel of woe,\" and warns, \"Look not too long in the face of the fire, O man!\" [29]. I did not reach any source on Melville's own marking of Job or Ecclesiastes, and I do not claim that the wisdom books were more important to him than the Pauline or Psalmic texts he did mark. What can be said is that the novel treats Ecclesiastes as the book of wisdom that sees through providence's comforts without quite denying God, a position between the sermon's confidence and Ahab's rage.\n\n### Carlyle, Edwards, Channing, Pascal: the thin places\n\nSeveral figures that the standard story places in Melville's lineage are, in the sources I could reach, thinly documented, and honesty requires saying so. Carlyle's *Sartor Resartus* is described by Victorian-studies sources as a thematic and formal influence on *Moby-Dick*, one reviewer noting an echo of Carlyle's \"cosmic mischief\" [30], but those are general-audience claims and none cites Melville's own words. The Duban inscription finding above is the only documentary link [27]. Jonathan Edwards and New England theology are routinely invoked in discussions of Melville's Calvinism; I found no source tying Melville to *Freedom of the Will* or *Original Sin* by name, and one undated scholarly letter that mentions Edwards in this context could not be attributed [31]. Channing, the Unitarian leader, and the Unitarian milieu of Melville's father's family appear in the biographical frame but I found no source for a specific encounter with his writings. Pascal appears in none of the Marginalia Online holdings visible on its front page, which lists Hawthorne, Shakespeare, Beale, the New Testament and others but no Pascal, Bayle, Carlyle, Milton or Emerson there [32]. The omission could be accidental, since I saw only a rotating feature, and the site separately hosts the Milton work. I therefore make no claim about Pascal.\n\n## 1849–1851: Emerson, Hawthorne, and the Turn\n\n### Emerson, March 1849\n\nOn March 3, 1849, Melville wrote to Duyckinck about having heard Emerson lecture. He had expected \"transcendentalisms, myths and oracular gibberish\" and wrote that he was \"very agreeably disappointed in Mr Emerson,\" while also saying he saw \"a gaping flaw,\" an insinuation that Emerson might have offered useful suggestions had he lived when the world was made; and he wrote, \"I love all men who dive\" [33]. I could only reach a secondary website that excerpts the letter and does not cite an edition, so I treat the wording as likely but unverified against the Northwestern-Newberry text [33]. Even so, the point of the quoted objection is clear and fits what the rest of his career shows: Melville admired the transcendentalist's seriousness and objected to the optimism that treats the universe as a thing a clever man could improve on, or understand from outside. The context is the Unitarian-Transcendentalist line of optimism, running from the liberal churches of his father's family through Emerson, which held that the cosmos is benevolent and that human nature is good enough to apprehend it. Melville's response, in the form I can document, is partial respect and a pointed refusal.\n\n### The Hawthorne review, August 1850\n\nThe decisive documentary moment is Melville's essay \"Hawthorne and His Mosses,\" published in the *Literary World* on August 17 and 24, 1850, after he and Hawthorne met at Pittsfield, Massachusetts [8][34]. Marginalia Online records that Melville bought his copy of *Mosses from an Old Manse* in Pittsfield on July 18, 1850, a gift from his aunt Mary, that he marked many passages, quoted nine in the review, and annotated several other stories [35]. In the review he says Hawthorne's dark side is \"shrouded in a blackness, ten times black,\" and he links that darkness to \"that Calvinistic sense of Innate Depravity and Original Sin\" [22]. The linkage is Melville's own, in print, in 1850. It shows that he understood Hawthorne's darkness, and by implication his own interest in it, in explicitly Calvinist terms. The review also contains the argument, quoted above, that Shakespeare's dark characters speak \"deep truths,\" and the nationalist plea to \"prize and cherish\" American writers [22].\n\nIt is important to say what the review does not do. It does not say Melville held the doctrines. It says the sense of depravity belongs to any deeply thinking person, which a reader can take as a claim that Calvinism's psychology is more universal than its theology [34]. This is a defensible reading, supported by the Encyclopedia.com entry's summary that Melville argues no deeply thinking person is wholly free of such feelings [34]. The point has consequences for the Thompson/Herbert debate. If Calvinist depravity is, for Melville in 1850, a psychological truth about serious minds, then the Calvinist inheritance can survive as a description of human nature while the Calvinist God of foreordination is separately questioned. The two can come apart, and the novel's tensions between Mapple and Ahab, and between Ishmael's moods, track that separation.\n\n### The letters of 1851\n\nDuring and after the composition of *Moby-Dick* Melville wrote to Hawthorne in a register that mixes metaphysics, joking and urgency. In a letter dated [April 16?] 1851, he wrote, \"We incline to think that God cannot explain His own secrets,\" and, \"Take God out of the dictionary, and you would have Him in the street\" [36]. The same letter speaks of the \"Problem of the Universe\" in the manner of a Freemason's secret [36]. In a letter of June 1851 he wrote that the reason \"the mass of men fear God, and at bottom dislike Him\" is that \"they rather distrust His heart,\" and complained \"Dollars damn me\" while he worked on the \"Whale\" \"while it is driving through the press,\" and also wrote, \"Truth is the silliest thing under the sun\" [4]. On June 29, 1851 he told Hawthorne the book's \"secret motto\" was \"Ego non baptiso te in nomine\" and added, \"but make out the rest yourself,\" and said it was being \"broiled\" in \"hell-fire\" [37]. And in a letter of November 1851, answering Hawthorne's praise, he wrote \"I have written a wicked book, and feel spotless as the lamb,\" told Hawthorne their hearts beat in each other's ribs \"and both in God's,\" and said \"truth is ever incoherent\" [5].\n\nThese letters are the best primary evidence for Melville's own stance, and they resist the single-thesis readings. Taken as a set they show a writer who states, within months, that God cannot explain His secrets (a position consistent with an unknowable sovereign, which is compatible with Calvinism), that truth is silly or incoherent (a more sceptical claim), that his book is \"wicked\" yet that he feels \"spotless\" (a moral inversion in which wickedness and innocence coexist), and that his heart beats in God's. Thompson reads the \"wicked book\" and the baptism-reversal motto as confessions of an anti-theistic design [2]. A sceptic of Thompson can reply that the motto is playful, that the same letter speaks warmly of God and of the Godhead \"broken up like the bread at the Supper,\" and that a man who truly held a settled belief in God's malice would not likely write, in the same letter, that his friend's heart beat in his ribs and his in his friend's, \"and both in God's\" [5]. My reading is that both are present in the letters, and that the evidence for a settled conviction in either direction is weak. The documentary Melville is unstable.\n\nHawthorne's own later diagnosis fits this instability. In his journal for November 20, 1856, after meeting Melville in England, Hawthorne wrote that he \"can neither believe, nor be comfortable in his unbelief\" [38]. That is a friend's description, written five years after the novel, and it should be weighed as testimony, not proof. But it comes from the one reader who understood Melville's darkness well enough to be addressed by it, and it matches the letters.\n\n## What He Inherited and What He Broke From\n\nPulling this together requires a distinction between a grammar and a doctrine. From the Reformed side of his household, and from the sermon culture it fed, Melville inherited a grammar: a sovereign God whose purposes are hidden, a humanity marked by depravity, an election and a reprobation that no effort can alter, a Bible whose stories (Jonah, Ahab, Job) act as moral allegory, and a habit of reading events as signs. The documentary evidence for this inheritance is strong: the Dutch Reformed baptism [8][9], the Mapple sermon [16], the 1850 review that explicitly names the \"Calvinistic sense\" [22], and Herbert's textual demonstration of the Calvinist Ahab [3]. This grammar is what makes the problem of providence a problem for the novel at all. A secular reader would not feel Ahab's question as an obligation.\n\nFrom the father's Unitarian side, and from the Emersonian atmosphere of the 1840s, he inherited something else: an optimistic anthropology, the suspicion that the universe is benevolent and that goodness is accessible to reason. I can document his response to Emerson [33] but not to Channing, and the claim that Unitarianism was an inheritance rather than a milieu rests on the secondary biographers [8]. The point to retain is the structure. Melville was positioned between a tradition that saw the cosmos as ruled by a dark and hidden God and a tradition that saw it as ruled by a bland one, and neither could be accepted.\n\nWhat he broke with is also visible. He broke with comfort: the Calvinist assurance that the elect will know themselves, and the Unitarian assurance that providence is kind. His letters mock the second explicitly (the Emerson objection) and strain against the first (the \"wicked book\"). He broke with the tradition's reading of experience: where the pulpit turned a shipwreck into a text, he put the Essex into a chapter titled \"The Affidavit\" and let the reader decide whether the whale was God's instrument, a monster or an animal [19]. And he broke with the sermon's resolution. Mapple preaches a Jonah who is saved by obedience; the novel puts Ishmael, not Ahab or Mapple, at the centre of its survival, and gives him a view of the Fates that is comic and uncommitted from the start [1]. Whether this is a rejection of providence, an agnostic suspension of judgment, or a revision of what providence means is the question the later chapters take up.\n\nA final challenge is owed to my own synthesis. The \"grammar versus doctrine\" distinction is attractive because it reconciles Thompson and Herbert, and attractive syntheses are suspect. A critic could say that I have rescued the evidence by making Melville's position unfalsifiable: any darkness shows the grammar, any lightness shows the doubt. The answer is that the evidence does constrain the claim in one direction. If Melville had settled into either Thompson's malicious God or Emerson's benign one, the letters of 1851 would not show him writing of a \"wicked book\" in the same breath as the Godhead \"broken up like the bread at the Supper,\" nor writing in the same year that truth is both \"silly\" and \"incoherent\" [4][5]. The best-supported statement is that his inheritance supplied the questions and the vocabulary, that the 1849–51 encounters gave him the courage to ask them in public, and that the answers vary by book.\n\n## Open Questions\n\nSeveral points that matter here cannot be settled with the sources I reached. Which Dutch Reformed congregation and minister shaped Melville in Albany, and how Calvinist in doctrine that preaching actually was, remains to be established from Parker, Robertson-Lorant and the church records themselves; I have only a relay of their conclusions [8]. Whether Allan Melvill's religious leanings were Unitarian in any strong sense, or merely liberal, is likewise unsettled. Whether Melville read Edwards, Channing or Pascal directly is undocumented in what I found, and I make no claim in either direction. The strongest Bayle claims, including Bell's Manichaean parallels, need checking against the full article and against Melville's own set of Bayle, whose annotations, if any survive, I did not locate. The chronology of the Milton markings (1849, 1860, 1868) needs reading against the novel's composition to say which of the marks, if any, precede the writing of Ahab [23][25]. Finally, the exact wording of the June 1851 letter, and the passage quoted from the March 1849 Emerson letter, should be checked against the Northwestern-Newberry *Correspondence* before any of the quotations in this chapter are treated as final [33].\n\n## Sources\n\n[1] Melville, Herman. *Moby-Dick; or, The Whale*, Chapter 1, \"Loomings\" (1851). Project Gutenberg #2701. https://www.gutenberg.org/cache/epub/2701/pg2701.txt. Accessed 2026-10-24. Tier 1.\n\n[2] Thompson, Lawrance. *Melville's Quarrel with God*. Princeton University Press, 1952 (Princeton Legacy Library reissue, 2016). Publisher page, https://press.princeton.edu/isbn/9780691650357. Accessed 2026-10-24. Tier 2 (publisher summary of thesis; I did not read the book).\n\n[3] Herbert, T. Walter, Jr. \"Calvinism and Cosmic Evil in *Moby-Dick*.\" *PMLA* 84.6 (October 1969): 1613–1619. Abstract at https://www.cambridge.org/core/journals/pmla/article/calvinism-and-cosmic-evil-in-mobydick/37A1411E0C19F82320F25771BC757462. Accessed 2026-10-24. Tier 2 (abstract only; full text paywalled).\n\n[4] Melville to Nathaniel Hawthorne, June [1?] 1851. Text at melville.org, https://www.melville.org/letter3.htm. Accessed 2026-10-24. Tier 1 (web transcription; edition not named).\n\n[5] Melville to Nathaniel Hawthorne, November [17?] 1 Accessed 2026-10-24. Tier 2 (extract and footnotes only).\n\n[27] Yothers, Brian. Essay on Melville's marginalia in his New Testament and Psalms, *Leviathan* (2008); and \"Introduction to Melville's Marginalia in The New Testament and The Book of Psalms,\" *Melville's Marginalia Online* (2011). Duban's article on Carlyle inscriptions as reported in the same search results. https://works.bepress.com/brian_yothers/2. Accessed 2026-10-24. Tier 2, relayed; Duban not read.\n\n[28] Melville's Marginalia Online, holdings page (New Testament and Psalms, American Bible Society, 1844). https://melvillesmarginalia.org/. Accessed 2026-10-24. Tier 2.\n\n[29] Melville, *Moby-Dick*, Chapter 96, \"The Try-Works.\" Project Gutenberg #2701 (URL as [1]). Accessed 2026-10-24. Tier 1.\n\n[30] Victorian Web, Carlyle pages, https://victorianweb.org/victorian/authors/carlyle/carlyle2.html (quoting David Bromwich on \"cosmic mischief\"), and a University of Montana master's thesis, https://scholarworks.umt.edu/etd/694, as reported in search results. Accessed 2026-10-24. Tier 5, relayed.\n\n[31] Undated scholarly letter on Edwards and Melville; not identifiable. Surfaced in a search for \"Melville Jonathan Edwards\"; no author or venue confirmed. Tier 7 as used; not relied on.\n\n[32] Melville's Marginalia Online home page, https://melvillesmarginalia.org/. Accessed 2026-10-24. Tier 2.\n\n[33] Melville to Evert Duyckinck, March 3, 1849 (on Emerson). Excerpted at https://thevisionarycompany.net/2022/09/28/herman-melvilles-opinion-of-ralph-waldo-emerson/. Accessed 2026-10-24. Tier 6 (blog excerpt; edition not cited; verify against the Northwestern-Newberry *Correspondence*, ed. Lynn Horth).\n\n[34] \"Hawthorne and His Mosses.\" Encyclopedia.com. https://encyclopedia.com/arts/culture-magazines/hawthorne-and-his-mosses. Accessed 2026-10-24. Tier 4–5 (encyclopedia entry).\n\n[35] Melville's Marginalia Online, note on Hawthorne's *Mosses from an Old Manse* (Wiley and Putnam, 1846), Houghton Library. https://melvillesmarginalia.org/Note.aspx?id=16. Accessed 2026-10-24. Tier 2.\n\n[36] Melville to Nathaniel Hawthorne, [April 16?] 1851. https://www.melville.org/letter2.htm. Accessed 2026-10-24. Tier 1 (web transcription).\n\n[37] Melville to Nathaniel Hawthorne, June 29, 1851. https://www.melville.org/letter5.htm. Accessed 2026-10-24. Tier 1 (web transcription).\n\n[38] Hawthorne, Nathaniel. Journal entry for November 20, 1856 (*English Notebooks*), quoted in Charles Olson, *Call Me Ishmael*, via Biblioklept, https://biblioklept.org/2012/06/08/nathaniel-hawthorne-on-herman-melville-he-can-neither-believe-nor-be-comfortable-in-his-unbelief/. Accessed 2026-10-24. Tier 1 (via Tier 6 relay)."}, {"order": 2, "file": "02_Providence_In_Moby_Dick.md", "title": "Providence in Moby-Dick: A Close Reading", "summary": "", "body": "# Providence in Moby-Dick: A Close Reading\n\n> ## Bottom Line\n>\n> Moby-Dick never states a doctrine of providence; it stages a trial of four of them. Mapple preaches a governing God who pursues his fugitive; Ahab asserts a hidden, malicious principal behind the visible mask; Stubb and, in some moods, Ishmael entertain a joke-universe or a loom of necessity, free will and chance; and the Epilogue leaves one witness alive by a chain of events the narrator calls both fated and devious. Ishmael's own pronouncements contradict one another, and he usually signals the contradiction himself, which is the strongest evidence that the book is built to dramatize the problem rather than solve it. The one thing the text asserts without hedging is that the question of order is the question: \"some certain significance lurks in all things, else all things are little worth.\" Whether the significance is benign, malign or merely projected is left deliberately unsettled, and the scholarship that insists on one verdict (Melville the blasphemer, Melville the Christian moralist) has to quarrel with the novel's own design.\n\n## What Is Being Read, and How\n\nA close reading of providence in Moby-Dick has to begin by saying what the word covers, because the novel uses it rarely and the scholarship uses it constantly. In the theological tradition Melville inherited, providence names God's continuing governance of creation: not only that he made the world but that he sustains it and directs events, including the fall of a sparrow and the course of nations, toward ends he has fixed. Predestination, the sharper Calvinist doctrine, narrows the claim to the eternal decree by which God has already determined who will be saved; foreordination is the older and more general word for the same pre-arrangement of events. Fate, in the pagan and Stoic register Melville also borrows, names a necessity that binds gods as well as men. Theodicy, the final term the chapter needs, is the attempt to justify God's governance in the face of evil. These four vocabularies, Christian, Calvinist, classical and skeptical, are not interchangeable, and one of the novel's most important habits is to slide between them mid-sentence. A character who says \"Heaven\" in one clause and \"the Fates\" in the next is not confused; he is exposing how little the two words differ when what is at issue is whether anyone is steering.\n\nThe text that follows is the Project Gutenberg transcription of the novel (the American 1851 text in its familiar form) [1]. I quote it only in short passages that I have read in that transcription, and I paraphrase everywhere else. Scholarly editions differ on small points of wording and punctuation, and the Northwestern-Newberry edition, still the standard scholarly text and reissued by Northwestern University Press in 2001 with a foreword by Hershel Parker, should be consulted for any argument that turns on a comma [13]. The Norton Critical Edition, in its third edition under Parker's editorship, remains the usual classroom text and carries a century and a half of reviews and interpretations [12]. Neither fact affects the passages discussed here.\n\nA second preliminary concerns voice. The book has a first-person narrator, Ishmael, who is at once a participant in the voyage and the author of a retrospective narrative that includes scenes he could not have witnessed: Ahab alone in his cabin, Starbuck at the mainmast, Stubb soliloquizing at the fore-top, the Parsee's conversations in the dark. The book flags this half-openly, but it never explains it. For the study of providence the consequence is large. When a speech is delivered in dramatic form with stage directions, it belongs to a character; when the narrator reasons in his own voice, it belongs to Ishmael, whose opinions the book also treats ironically; and a third register, an overarching authorial intelligence that arranges both, is inferred rather than heard. The distinction between narrator and author cannot be abolished and cannot be fully drawn, and the best of the scholarship, as I argue below, is the work that respects that. My own practice in this chapter is to attribute every assertion to the voice that makes it, and to ask only afterward what the arrangement suggests.\n\nA third preliminary is the trap of the single quotation. Because the novel contains almost every position, any thesis about Melville's providence can be supported by an apt line, and the history of the criticism is partly the history of selective quotation. I therefore proceed by chapter and by position, and I look for the places where one speaker's assertion is undercut by the narrative's own events, since that is where the text, rather than the critic, is doing the arguing.\n\n## The Frame Before the Voyage: \"The Grand Programme of Providence\"\n\nThe first mention of providence in the book is comic, and it is also the most carefully ambiguous. In the opening chapter Ishmael asks himself why he, a merchant sailor, should now go whaling, and answers that \"the invisible police officer of the Fates\" can answer that better than he can, and that \"my going on this whaling voyage, formed part of the grand programme of Providence that was drawn up a long time ago.\" He then imagines the playbill, in which his voyage sits between a contested presidential election and a battle in Afghanistan, \"a brief interlude and solo between more extensive performances\" [1]. Two features of the passage deserve notice. First, Providence and the Fates are used as synonyms: one invisible police officer, stage managers who assign parts. The divine governance on offer is theatrical and bureaucratic rather than paternal. Second, Ishmael adds, with evident self-awareness, that he can see \"a little into the springs and motives\" that induced him to sail, motives \"cunningly presented to me under various disguises,\" and that these cajoled him \"into the delusion that it was a choice resulting from my own unbiased freewill and discriminating judgment\" [1]. In a single paragraph, then, the novel states both the determinist and the compatibilist options: a programme drawn up in advance, and a felt freedom that is a managed illusion, in which the felt motives are nonetheless real motives. That the motives are real, and that the great white phantom \"like a snow hill in the air\" floats among them, is what keeps the passage from being a simple fatalism. The programme works through Ishmael's temperament.\n\nWhether the passage is serious is a real question. The tone is mock-grand, the comparison with the Afghan war and the election is bathetic, and the narrator regularly deflates his own metaphysics. By my own reading the tone does not cancel the claim; it protects it. A narrator who announces a theory of providence with a straight face would invite the very refutation the book goes on to supply; one who announces it as a theatrical joke can keep it available without being committed to it. This is the book's characteristic move, and it recurs in nearly every treatment of fate below. Ishmael will assert, retreat into comedy, and then return to the assertion in a different key.\n\nThe next two pre-voyage episodes lay down the emotional ground of the argument. In the Whalemen's Chapel, the marble tablets for the lost, \"black-bordered marbles which cover no ashes,\" seem to Ishmael to display \"deadly voids and unbidden infidelities in the lines that seem to gnaw upon all Faith\"; and then in the same chapter, \"Faith, like a jackal, feeds among the tombs, and even from these dead doubts she gathers her most vital hope\" [1]. The pattern is already set: doubt is not dispelled but metabolized into hope, with no loss of the doubt. Ishmael's own reaction, \"Yes, Ishmael, the same fate may be thine. But somehow I grew merry again,\" ends in the most confident and least orthodox affirmation of the early chapters, that \"my body is but the lees of my better being\" and that \"Jove himself cannot\" stave his soul [1]. The consolation is a Platonic or Transcendentalist one (the soul is untouchable) and it uses the name of a pagan god. It is not providence in the Christian sense, since it promises no governance and no care, only invulnerability. It is the first instance of a recurring Ishmaelean compromise: a spiritual optimism that makes no claim about who runs the world.\n\nIn \"The Lee Shore\" the novel offers the other pole. Bulkington, who stands at the Pequod's helm, is made an emblem of the thought that \"in landlessness alone resides highest truth, shoreless, indefinite as God,\" and that \"better is it to perish in that howling infinite, than be ingloriously dashed upon the lee, even if that were safety\" [1]. Here God is not a governor but a condition: shoreless, indefinite, a sea rather than a king. Safety and truth are opposed, the port is the ship's \"direst jeopardy,\" and the wildest winds \"conspire to cast her on the treacherous, slavish shore\" [1]. The chapter, only a few lines long, is the nearest the book comes to a creed, and it is a creed of anti-providence: the highest truth is found by those who refuse the harbor. It anticipates Ahab, and it reads at once as heroic and as a warning, which is how the book treats Ahab.\n\n\"The Counterpane,\" earlier still, is rarely read for providence, but it belongs here. The waking Ishmael recalls a childhood nightmare in which \"a supernatural hand seemed placed in mine,\" and compares the sensation, \"take away the awful fear,\" to waking in Queequeg's arm [1]. The book thus begins its inquiry into whether the universe is hostile, hospitable or blank with an inverted relation between a feared hand and a loved one. The terrifying invisible hand and the tattooed pagan arm differ only by the fear, which is to say by the interpretation. I would not push the point beyond that, but it is the first appearance of a theme the novel will pursue through the Squeeze of the Hand and the Pip chapters: that what meets us in the dark can be taken as malice, care or nothing, and that the difference lies partly in the one who is touched. And the stranger Elijah, who accosts Ishmael and Queequeg on the wharf, supplies the first language of foreordination in the plot. \"What's signed, is signed; and what's to be, will be; and then again, perhaps it won't be, after all. Anyhow, it's all fixed and arranged a'ready\" [1]. The sentence contradicts itself within its own breath, and it models the book's later oscillation. It is spoken by a seer-fool whose predictions the story half confirms and whose self-cancelling logic the story also half endorses.\n\n## Father Mapple: Providence Preached\n\nThe sermon is the one fully orthodox account of divine governance in the book, and it is delivered by a character whom the narrator describes with unmixed respect. Mapple's text is \"And God had prepared a great fish to swallow up Jonah,\" and his reading is carefully built around obedience. The \"two-stranded lesson\" has a part for the sinful hearers and a part for the preacher as \"a pilot of the living God.\" The first strand is Jonah's wilful disobedience and its punishment, its repentance and its deliverance; the second is the duty to preach hard truths, to \"preach the Truth to the face of Falsehood\" [1]. On this reading providence is pursuit. Jonah flees \"world-wide from God,\" seeking a country \"where God does not reign, but only the Captains of this earth,\" and Mapple's answer is flat and thunderous: \"But God is everywhere; Tarshish he never reached\" [1]. The sea that will not bear the \"wicked burden,\" the lot that falls on Jonah, the \"oily calmness\" that follows his casting into the sea, and the whale that arrives \"with open mouth cleaving the seas after him\" are all presented as the machinery of a governance that does not miss. Even the whale is God's instrument, something Mapple establishes by quoting the verse and by narrating the sea's rebellion as moral. When the prophet prays \"out of the belly of hell,\" Mapple says, \"God heard the engulphed, repenting prophet\" [1].\n\nTwo features of the sermon bear on the argument about providence. The first is what Mapple leaves out. He tells the story of Jonah's flight, the storm, the whale, the prayer and the second command, and he stops where Jonah \"did the Almighty's bidding\" by preaching to Nineveh. The book of Jonah has a fourth chapter, in which Nineveh repents, God spares it, Jonah is angry, and God reproves him with the parable of the gourd and the question about the great city and its cattle. Mapple does not speak of it, though he himself calls the book \"four chapters—four yarns.\" The sermon's moral emphasis, obedience at any cost and the willingness to be true \"even though to be false were salvation,\" is a moral reading of Jonah's fugitive episode and not of the book's last and most enigmatic movement, the divine mercy that scandalizes the prophet. Shalom Carmy's 2017 essay in First Things makes a version of this complaint from within a Jewish and philosophical framework: he argues that Mapple's Jonah is a model of repentance only if one ignores that Jonah's prayer in the fish is a psalm of thanksgiving with no confession in it, and that \"compliance is not the same thing as obedience\" in a prophet who goes on to resent God's mercy to Nineveh [7]. Carmy's judgment is that Mapple's ideal, though right for his whaling audience, falls short of the fuller biblical picture; he does not claim that Melville intended the lapse. That qualification matters, because Carmy's essay is a reading of the sermon as theology, not as evidence of Melville's belief.\n\nThe second feature is the sermon's close, which moves from providence as pursuit to providence as the ground of a joyful defiance of the world. \"Delight is to him ... who acknowledges no law or lord, but the Lord his God, and is only a patriot to heaven\" [1]. The language is an assertion of conscience against \"the proud gods and commodores of this earth,\" and it ends in a prayer, \"chiefly known to me by Thy rod—mortal or immortal, here I die,\" which concludes: \"I leave eternity to Thee; for what is man that he should live out the lifetime of his God?\" [1]. It is hard to miss that the sermon's last gesture is an act of intellectual abdication in the face of divine inscrutability, a theological move Calvinism had long made and which the book will later test. The stance has a curious resemblance to the stance of Ahab, who also acknowledges no law or lord but his own, and the formal likeness has been noticed in the scholarship from both directions.\n\nHow have scholars taken the sermon? The range of readings is itself a map of the larger debate. Lawrance Thompson, whose 1952 Melville's Quarrel with God argued that Melville concealed a conviction of God's \"cruelty and malice\" behind satire of Christian doctrine and traced that hidden intent through the major works from Typee to Billy Budd [4], read the sermon, according to a 1963 summary in Christianity Today, as an exercise in deceptive equivocation and a sneer at Christian doctrine. The same piece, by D. Bruce Lockerbie, records the opposite tradition: Howard Vincent took the sermon as the vehicle of the novel's central theme, W. H. Auden as an essential clue to the whole book, and Randall Stewart as a measuring stick for Ahab's sin, while Lewis Mumford admired it as a fine piece of oratory; Lockerbie himself argued that Moby-Dick is a Christian novel in which Jonah's tormented conscience, repentance and restoration are set against Ahab's quenched conscience and doom [8]. A third reading, in a 1985 article in The Iliff Review, Jay Holstein's \"Melville's Inversion of Jonah in Moby-Dick,\" argues that the sermon conveys a teaching Melville considered wicked, using Jonah as the vehicle for a fundamentally anti-biblical outlook, a paganism in which humans are at the mercy of forces either hostile or indifferent to them [6]. I have read only the published abstract of Holstein's article and Lockerbie's and Carmy's essays, not Thompson's book, so I treat these as reports of positions, not as independent verification of their evidence.\n\nThe evidence of the text leans, I think, against both extremes. Against Thompson's equivocation thesis stands the manner of the narration: nothing in the chapter's narrative frame undercuts Mapple, who is introduced with deep respect, who preaches during a storm, and whose mastery of the pulpit is the pulpit-as-ship's-prow. Against a straightforwardly Christian reading stands the fact that the novel's own action never confirms the sermon's picture. No character in the novel is overtaken by a Mapplean providence in the way Jonah is. Ahab is swallowed, in a sense, but there is no repentance, and the whale does not deliver. The sermon is not refuted; it is simply not enacted. The reader holds in one hand a perfectly coherent account of providence as pursuit and rescue, and in the other a narrative that behaves as if that account might be true of some other voyage. I take this as the most defensible description: Mapple's sermon is the book's orthodox hypothesis, left standing and left unproven.\n\n## The Mast-Head and the Quarter-Deck: Ahab's Theology of the Mask\n\nBefore Ahab speaks, the novel has Ishmael warn the owners of Nantucket against \"any lad with lean brow and hollow eye; given to unseasonable meditativeness,\" the \"sunken-eyed young Platonist\" who stands the mast-head with \"the problem of the universe revolving in me\" and loses his identity in the sea, which he takes for \"the visible image of that deep, blue, bottomless soul, pervading mankind and nature\" [1]. The Mast-Head chapter ends by warning the pantheist: \"Heed it well, ye Pantheists!\" The warning is double-edged. The dreamer sees the sea as the embodiment of one divine soul, and the narrator, who confesses that he himself \"kept but sorry guard,\" tells him that if he moves a hand an inch \"your identity comes back in horror. Over Descartian vortices you hover\" [1]. This is Ishmael's characteristic position on the Transcendentalist alternative to providence. The cosmos might be a single divine soul, a benign ocean of order; but the comfort is purchased at the price of the self, and it ends in a fall. A reader who knows Emerson will hear the reproach. A reader who does not will hear a sailor's joke. The chapter lets both stand.\n\nThe Quarter-Deck is the book's first great statement of a rival metaphysics. Ahab holds up a gold doubloon, nails it to the mast, and tells the crew what they have shipped for. Starbuck objects that vengeance on \"a dumb brute ... that simply smote thee from blindest instinct\" is \"blasphemous\" (the chapter's own word), and Ahab's reply is the passage on which a large part of the criticism of the book's theology depends:\n\n\"All visible objects, man, are but as pasteboard masks. But in each event—in the living act, the undoubted deed—there, some unknown but still reasoning thing puts forth the mouldings of its features from behind the unreasoning mask. If man will strike, strike through the mask! ... To me, the white whale is that wall, shoved near to me. Sometimes I think there's naught beyond. But 'tis enough\" [1].\n\nThree things are packed into this speech, and they should be separated. The first is a claim about the structure of events: events are the visible faces of an invisible, intelligent agent. This is a metaphysics of hidden governance, an inverted providence, in which the governor exists and is reasoning, but is not shown to be good. The second is a claim about the quality of that agent: Ahab sees \"an inscrutable malice sinewing\" the whale's outrageous strength, and \"that inscrutable thing is chiefly what I hate.\" The third, in the very same breath, is a confession of doubt that undermines the first: \"Sometimes I think there's naught beyond.\" And he adds the line that has made the speech a touchstone: \"be the white whale agent, or be the white whale principal, I will wreak that hate upon him\" [1]. The distinction between agent and principal is the distinction between a creature acting on God's orders and God himself, and Ahab explicitly declines to settle it. The whole hunt is thus launched on a disjunction (hidden malicious governor, or no governor at all) that the hunter holds not as a conviction but as a stance. By my own reading the passage is the book's most precise statement of the problem of theodicy inverted: where the theologian asks how a good providence permits evil, Ahab asks, since there is evil, whether it has a face, and decides to act as though it does because the alternative, that the injury was meaningless, is intolerable.\n\nThe speech continues with a boast that is also a theological claim: \"I'd strike the sun if it insulted me. For could the sun do that, then could I do the other; since there is ever a sort of fair play herein, jealousy presiding over all creations. But not my master, man, is even that fair play. Who's over me? Truth hath no confines\" [1]. Ahab is a rebel who cannot find the throne to rebel against; he postulates a cosmos of rival powers governed by \"jealousy,\" a pagan balance, and then denies that even this balance rules him. The question \"Who's over me?\" is not rhetorical in the ordinary way. It is the question of providence asked as a challenge, and the book will let the Doubloon, the Candles and the Symphony each give it a different, incomplete answer.\n\nThe narrator's reflection immediately after the oath scene is, I think, one of the most important and least discussed passages for the question at hand. As Starbuck murmurs \"God keep me!\" and the vote to hunt the whale is carried, the narrator addresses the warnings that come too late: \"Ah, ye admonitions and warnings! why stay ye not when ye come? But rather are ye predictions than warnings, ye shadows! Yet not so much predictions from without, as verifications of the foregoing things within. For with little external to constrain us, the innermost necessities in our being, these still drive us on\" [1]. That is a compatibilist or psychologized determinism, and it is not Ahab's. The necessity that drives the Pequod is real, but it is internal: the \"innermost necessities\" of character. Providence in the sense of external governance is replaced by the claim that events fulfil the dispositions of the agents, and omens merely disclose what is already within. This is a sophisticated middle position between the Calvinist decree and the Epicurean accident, and it is delivered in the narrator's own voice, not any character's. It will be the most consistent thing the narrator says about necessity, and it is worth holding against the grander language of the Fates that characters use later.\n\nTwo soliloquies follow that show the crew's different relations to the same question. Ahab alone in \"Sunset\" refers to the prophecy that he would lose a leg, and answers it with a challenge: \"The prophecy was that I should be dismembered; and—Aye! I lost this leg. I now prophesy that I will dismember my dismemberer. Now, then, be the prophet and the fulfiller one. That's more than ye, ye great gods, ever were\" [1]. The boast turns on the idea of a prophet who is also the agent of what he foretells, something no divine prophet in the tradition can be, since the prophet there only announces what God does. Ahab's version of destiny is self-fulfilling prophecy, willed, and he claims that makes him greater than the gods. In the same speech he describes his purpose as laid \"with iron rails, whereon my soul is grooved to run,\" a rail-road metaphor for fixed purpose that a few chapters later becomes his own account of his compulsion [1]. A will that insists it is free describes itself in the vocabulary of a track.\n\nStarbuck's soliloquy in \"Dusk\" gives the opposite pole of the same dilemma. \"Will I, nill I, the ineffable thing has tied me to him; tows me with a cable I have no knife to cut,\" he says; \"Horrible old man! Who's over him, he cries;—aye, he would be a democrat to all above; look, how he lords it over all below!\" And then his one hope, a Mapplean one: \"His heaven-insulting purpose, God may wedge aside\" [1]. Starbuck believes in providence and expects it to intervene. Stubb, in \"First Night-Watch,\" has the other cheap solution: \"a laugh's the wisest, easiest answer to all that's queer; and come what will, one comfort's always left—that unfailing comfort is, it's all predestinated\" [1]. Stubb's predestination is a joke that licenses anything. Three crewmen, then, have three relations to the same Ahabian facts: Starbuck hopes that God will intervene, Stubb relaxes because nothing can be done, and Ahab claims to be the instrument and the equal of the powers. The book does not choose among them. It records, instead, what each does when the whale comes.\n\n## Moby Dick and \"The Whiteness of the Whale\": The Meaning of the Void\n\nThe two chapters that frame the whale's significance are the most explicit philosophical argument in the book, and they must be read together. In \"Moby Dick,\" the narrator reports what the whale meant to Ahab, whose monomania grew out of a \"sudden, passionate, corporal animosity\" and then, through months of delirium in a strait-jacket, \"interfused\" his wounded body and gashed soul. Ahab's rage, the narrator says, passed from a particular injury into a generalized one: \"all that most maddens and torments; all that stirs up the lees of things; all truth with malice in it ... all evil, to crazy Ahab, were visibly personified, and made practically assailable in Moby Dick\" [1]. Providence, in other words, is inverted into a target: the evil that theodicy must explain Ahab proposes to kill. The same chapter says that the crew, who share the hatred, were \"specially picked and packed by some infernal fatality to help him,\" and that how they came to feel the White Whale \"as much their insufferable foe as his\" is \"to dive deeper than Ishmael can go\" [1]. The book here gives an explicit statement that something like fate, \"infernal fatality,\" assembled the company, and an equally explicit confession of ignorance about how.\n\n\"The Whiteness of the Whale\" extends the argument to Ishmael himself. He begins by conceding all the benign associations of white, from the white elephants of Pegu to the white throne of the Apocalypse where \"the Holy One that sitteth there white like wool,\" and then insists that \"there yet lurks an elusive something in the innermost idea of this hue, which strikes more of panic to the soul than that redness which affrights in blood\" [1]. He then offers a series of explanations, each tentative. The colt that shies at the smell of a buffalo robe proves, he says, \"the instinct of the knowledge of the demonism in the world,\" and from it Ishmael draws the generalization: \"Though in many of its aspects this visible world seems formed in love, the invisible spheres were formed in fright\" [1]. The sentence is a theodicy in miniature and a counter-theodicy. The visible world is lovely, which is the argument from design; the invisible world, from which the visible is derived, is terrible, which reverses it. And then the chapter reaches its famous speculation, in a series of questions rather than statements: whiteness \"shadows forth the heartless voids and immensities of the universe,\" it is \"a colourless, all-colour of atheism from which we shrink,\" and nature's colors are \"subtile deceits\" laid on from without, so that \"all deified Nature absolutely paints like the harlot, whose allurements cover nothing but the charnel-house within\"; the universe is a \"palsied\" leper, and \"the wretched infidel gazes himself blind at the monumental white shroud that wraps all the prospect around him\" [1].\n\nThree points about this chapter are essential. First, the argument proceeds by interrogation: \"Is it that ... Or is it, that ...\" The narrator never asserts the atheism he describes; he asks whether whiteness embodies it. Second, the chapter begins by saying that the whale's whiteness is the thing that \"above all things appalled me,\" and it ends by identifying the whale as \"the symbol\" of all that: \"And of all these things the Albino whale was the symbol. Wonder ye then at the fiery hunt?\" [1]. The syntax carries Ishmael over to Ahab's side of the argument without any statement that he agrees. Third, the chapter ties the book's two registers, the physical whale and the metaphysical symbol, in a way that makes the reader's question about providence inseparable from a question about interpretation: is the whale a sign of a void, a sign of a hidden malicious governor, a sign of a God whose face cannot be seen, or only a whale? The chapter that follows, \"Hark!\", plunges back into plot, and the question is not answered.\n\nHere there is a notable asymmetry that critics have long registered. The positive hypotheses about the whale's meaning all come from characters who are either mad (Ahab), deranged (Pip), or compromised (Ishmael, in whose voice the pessimism is attributed to a \"hypo\" he himself half confesses: \"thou surrenderest to a hypo, Ishmael,\" he imagines the reader saying). The negative hypothesis, that the whale means nothing, is voiced only by Ahab in the aside and by the narrator in his rare plain moods. The structure thus keeps the possibility of a malicious or empty cosmos alive without anyone being quite entitled to assert it.\n\n## The Chart: A Different Kind of Order\n\nIf the whiteness chapter proposes that the universe may be empty, \"The Chart\" presents a very different kind of order: the regular, calculable order of nature. Ahab bends over the sea-charts, tracing currents and \"threading a maze,\" and the narrator explains that the sperm whale's migrations are periodic, that the Maury charts of the National Observatory are, as a footnote says, \"in course of completion,\" and that \"the sperm whales, guided by some infallible instinct—say, rather, secret intelligence from the Deity—mostly swim in veins\" along lines of \"undeviating exactitude\" such that \"no ship ever sailed her course, by any chart, with one tithe of such marvellous precision\" [1]. The aside \"say, rather, secret intelligence from the Deity\" is the book's one explicit attribution of natural regularity to divine direction, and it appears in a passage devoted to explaining why Ahab's seemingly mad project is not absurdly hopeless. The providence on offer is the providence of natural history: the herds know where to go, and a man who knows their law can find them.\n\nThe irony is structural. The very order that makes Ahab's pursuit rational is the order that, if it governs the whale, also governs the hunter: a \"secret intelligence\" that steers the whale along its vein also steers him to the Season-on-the-Line. Ahab's plan relies on a providential regularity he elsewhere denies, and the chapter ends on a note that undoes the reassurance of the beginning, with the narrator's account of Ahab's nightly torments and the \"creature\" his thoughts have made in him: \"he whose intense thinking thus makes him a Prometheus; a vulture feeds upon that heart for ever; that vulture the very creature he creates\" [1]. The cosmos has a map, and the man who reads it best is the man the map destroys. And the same chapter has the reverse emphasis: the whale's \"individual recognition\" is not guaranteed, since \"it did not follow that were the Pequod to visit either of those spots ... she would infallibly encounter him there\" [1]. Order is general; the encounter is particular, and the particular is where chance enters. The chart is a map of probability, not a decree.\n\n## The Mat-Maker: Necessity, Free Will and Chance\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 512\" role=\"img\" aria-label=\"The Mat-Maker loom of Moby-Dick chapter 47 drawn as a weave: vertical warp threads are necessity, the horizontal shuttle path is free will, and a diagonal sword stroke is chance, which has the last featuring blow. Below, three loom passages differ on who works the loom: in chapter 47 no operator; in The Gilder the threads mingle in a circle of belief and doubt; in The Castaway Pip sees God's foot on the treadle, an indifferent God. At the bottom the Epilogue puts the phrases it so chanced and the Fates ordained in a single clause.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif\" letter-spacing=\"2\">THE LOOM OF TIME<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">Moby-Dick ch. 47, \"The Mat-Maker\": three forces, no weaver<\/text>\n<rect x=\"130\" y=\"56\" width=\"310\" height=\"190\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<line x1=\"150\" y1=\"66\" x2=\"150\" y2=\"236\" class=\"s-t1\" stroke-width=\"2.5\"/>\n<line x1=\"180\" y1=\"66\" x2=\"180\" y2=\"236\" class=\"s-t1\" stroke-width=\"2.5\"/
