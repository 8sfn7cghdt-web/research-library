s Hopkins University Press, via Project MUSE. https://muse.jhu.edu/journal/601. Accessed 2026-10-24. Tier 2. Article contents were not read.\n\n[15] The Holy Bible, King James Version, Job 1:15-17. https://www.kingjamesbible.me/Job-1-15. Accessed 2026-10-24. Tier 1.\n\n[16] Concordia Seminary (St. Louis) divinity thesis (1952) reading the Rachel through Jeremiah 31:15 as Christian brotherly love, in the school's repository, https://scholar.csl.edu/bdiv/367. Accessed 2026-10-24. Tier 6; seen only in a search summary and cited solely as an example of the redemptive reading of the Epilogue.\n\n[17] Matthiessen, F. O. American Renaissance: Art and Expression in the Age of Emerson and Whitman. New York: Oxford University Press, 1941. Publication facts only, via the reference summaries returned by a general search. Tier 5; book not consulted.\n\n[18] Melville, Herman. \"Hawthorne and His Mosses,\" The Literary World, 17 and 24 August 1850; the phrases on Hawthorne's \"power of blackness\" and the \"Calvinistic sense of Innate Depravity and Original Sin\" were checked against the epigraph on the Library of America's Hawthorne page, https://loa.org/?p=399. Accessed 2026-10-24. Tier 1 content, Tier 5 host.\n\n[19] The Melville Society, \"Leviathan: A Journal of Melville Studies.\" https://melvillesociety.org/leviathan. Accessed 2026-10-24. Tier 5. The society's own page lagged the MUSE listing and still highlighted issue 26.2 (June 2024)."}, {"order": 3, "file": "03_Ahab_And_Ishmael_Rival_Theologies.md", "title": "Two Theologies on One Deck: Ahab's Defiance, Ishmael's Pluralism, and the Question of What Moby-Dick Endorses", "summary": "", "body": "# Two Theologies on One Deck: Ahab's Defiance, Ishmael's Pluralism, and the Question of What Moby-Dick Endorses\n\n## Bottom Line\n\n> *Moby-Dick* gives voice to two incompatible answers to the question of providence. Ahab holds that something intelligent and malicious stands behind the visible world, and that dignity lies in striking at it even if the striking was \"decreed\". Ishmael holds that no single reading of the world can be proved, tries several, and survives by declining to be captured by any one. The novel does not endorse either. It lets Ahab's theology destroy everyone but the man who narrates it, then lets that narrator credit his own rescue to \"the Fates\", so that providence returns in the mouth of the skeptic at the moment he escapes. The defensible reading is that the book is an argument that refuses its own verdict, and that the refusal is itself Melville's position, which his friend Hawthorne described in terms that fit it exactly.\n\n## The Problem: A Novel That Argues Through Characters\n\nA reader who wants to know what Melville thought about providence meets a structural difficulty before any question of belief. *Moby-Dick* has no spokesman. Its narrator opens with a command (\"Call me Ishmael\"), disappears for long stretches into cetology and joking, lets a monomaniac captain dominate the middle of the book, and reappears at the end as an unexplained survivor. Every theological assertion in it arrives in a mouth: a drunk's, a prophet's, a Quaker's, a madman's, a pagan's. The critical history of the book is in large part a history of readers choosing a mouth and calling it Melville's.\n\nThe vocabulary needs fixing before the argument begins. *Providence* means the governance of the world by a purposive God; in Reformed (Calvinist) Christianity it extends to *foreordination* or *predestination*, the doctrine that God has decreed all events, including who will be saved and who damned, before they occur. The standing puzzle of that doctrine is the status of human *free will*: if the decree is complete, what is the agent's act? *Theodicy* is the effort to justify God's governance in the face of evil and suffering. *Pluralism*, as I use it of Ishmael, names the practice of holding several incompatible religious or interpretive frames in view without declaring one true. Two further terms from the history of heresy will do work later. *Manichaean* describes a cosmos divided between a good and an evil principle, and *Gnostic* describes the older conviction that the visible creator is a lesser or hostile power, with a higher unknown reality beyond him. Those categories are scholars' tools and Melville never uses them, but Ahab's speeches keep pressing against them.\n\nA second note of method. The full text of the novel is public domain and I worked from the Project Gutenberg edition [1]. The standard scholarly text is the Northwestern-Newberry edition, and the standard classroom text is now the third Norton Critical Edition, which is based on the Hayford-Parker revision and gathers criticism from 1851 onward [17]. The quotations below are short and taken from the Gutenberg text; where a reading depends on punctuation or a variant I say so. For the criticism, I could read abstracts, publisher descriptions, reviews and reposted essays, not every book in full, and I mark where that limits what I can claim.\n\n## Ahab's Theology: The Fixed Purpose\n\n### The quarter-deck as a creed\n\nAhab's creed is stated twice in the novel, once publicly and once to himself, and the two statements should be read against each other. The public one is the quarter-deck scene, where he nails the doubloon to the mast and recruits the crew to the hunt. Challenged by Starbuck, who protests that \"vengeance on a dumb brute\" is \"blasphemous\", Ahab answers with the novel's most compressed metaphysics [1]. \"All visible objects, man, are but as pasteboard masks.\" Behind each living act \"some unknown but still reasoning thing puts forth the mouldings of its features from behind the unreasoning mask.\" Then comes the injunction: \"If man will strike, strike through the mask!\" The white whale is \"that wall, shoved near to me.\"\n\nThree features of this speech define Ahab's theology. First, it is a theory of *immanent agency behind appearance*. The world is not neutral matter; it is a mask worn by a \"reasoning thing\". Second, the reasoner's character is malicious. Ahab sees in the whale \"outrageous strength, with an inscrutable malice sinewing it\", and says that \"That inscrutable thing is chiefly what I hate.\" Third, and most important for the dispute over providence, Ahab is deliberately agnostic about the structure of the agency. \"Be the white whale agent, or be the white whale principal, I will wreak that hate upon him.\" The whale may be a servant or the master; Ahab will strike either way. And he admits a doubt at the foundation: \"Sometimes I think there's naught beyond. But 'tis enough.\"\n\nThat admission has been undersold in popular accounts of Ahab as a man certain that God is evil. At the moment of his clearest statement he allows that there may be no one behind the mask, and he discovers that his hatred does not depend on the answer. His theology is thus less a doctrine than a *stance*: act as though the world has a face, because the alternative is unbearable. The point matters later, when I argue that the novel complicates the contrast between Ahab the dogmatist and Ishmael the doubter.\n\nThe line that gave the book its place in the history of blasphemy follows immediately. \"Talk not to me of blasphemy, man; I'd strike the sun if it insulted me.\" Ahab explains the logic in the next breath: \"For could the sun do that, then could I do the other; since there is ever a sort of fair play herein, jealousy presiding over all creations.\" Insult is the operative concept. Ahab's grievance is not that the cosmos is vast or indifferent but that it has *wronged him in particular*, and a wrong implies a wrongdoer who can be answered. Then he adds the sentence that puts the whole book's argument about authority in a nutshell: \"But not my master, man, is even that fair play. Who's over me? Truth hath no confines.\" Ahab recognizes no sovereign, not even a sovereign to whom appeal could be made.\n\n### The scene Melville has Ahab narrate to himself\n\nThe private statement comes in the short chapter called \"Sunset\", a stage-dramatic soliloquy placed immediately after the quarter-deck. Here the language shifts from argument to image, and the theology turns out to be a theology of *mechanism*. Ahab has found that \"my one cogged circle fits into all their various wheels, and they revolve.\" He is the match to their anthills of powder. And then: \"The path to my fixed purpose is laid with iron rails, whereon my soul is grooved to run.\" [1]\n\nThe phrase \"fixed purpose\" is the key to the whole character, and it needs reading closely because it carries two incompatible meanings that Ahab never reconciles. Read one way, a fixed purpose is a *willed resolve*, the thing a free agent holds against obstacles. Read another way, it is a *track*: iron rails, a groove, a path laid in advance on which the soul \"is grooved to run\". A man who has laid the rails himself is free in the strongest sense; a man who finds himself on them is a prisoner. Ahab speaks as both, in the same sentence, and the novel does not tell him which he is. Earlier in \"Sunset\" he had said, \"What I've dared, I've willed; and what I've willed, I'll do!\", and a few lines later claimed to be \"demoniac\", \"madness maddened\". Willed, and demoniac. Chosen, and possessed.\n\nThere is a third register in the soliloquy that readers often skip. Ahab says, \"Gifted with the high perception, I lack the low, enjoying power; damned, most subtly and most malignantly! damned in the midst of Paradise!\" [1] This is the language of a man who believes that he has been *singled out* for damnation, and it ties his hatred to something like a Calvinist structure, to which I return. The sun that \"lights not me\" is the sun that has been withheld from the reprobate. Ahab's grievance has the particular bitterness of someone who suspects that the decree was written against him by name.\n\n### The prophecy he means to defeat\n\n\"Sunset\" also contains the sentence in which Ahab states his answer to fate. \"The prophecy was that I should be dismembered; and—Aye! I lost this leg. I now prophesy that I will dismember my dismemberer. Now, then, be the prophet and the fulfiller one. That's more than ye, ye great gods, ever were.\" [1] The claim is extraordinary. Prophecy and fulfillment, which in any providential scheme are two things (God declares, events confirm), Ahab proposes to fuse in one act of will. He will be the prophet *and* the agent of what he prophesies, and in that way he will outdo \"the great gods\", who are credited with the one and not the other.\n\nThis is the first of many moments at which Ahab's defiance and his fatalism meet. To prophesy one's own act is to say that it is both free (it is my doing) and fated (it has been announced). The novel's later action, which reconstructs the prophecy of the Parsee, is built on the same hinge.\n\n## The Fates' Lieutenant: Defiance That Claims to Be Obedience\n\n### Fate as a rhetorical resource\n\nThe most important single Ahab statement for the question of providence comes late, in the second day's chase, when Starbuck begs him to desist. \"Ahab is for ever Ahab, man. This whole act's immutably decreed. 'Twas rehearsed by thee and me a billion years before this ocean rolled. Fool! I am the Fates' lieutenant; I act under orders.\" [1] A reader trained in Reformed theology will hear the vocabulary of the decrees. \"Immutably decreed\" and \"rehearsed ... a billion years before\" are the language of eternal counsel, translated into pagan figures. The Fates are the Moirai of Greek tradition rather than a Christian God, but the structure of the claim is the structure of predestinarian speech: the outcome is settled, the agents are enacting it, and complaint is a category mistake.\n\nWhat makes this passage dramatically odd is that Ahab, who has spent the voyage defying the powers, now claims to be their officer. The captain who would \"strike the sun\" says he acts \"under orders\". Three readings are available, and the novel supports each in part.\n\nOn the first reading, the speech is *manipulation*. Ahab is addressing his mate, whose pious conscience he has been working on since the quarter-deck, and fate is a rhetorical instrument. This reading has local support. In the same scene, immediately after he rallies the crew with omens, he mutters to himself: \"The things called omens! And yesterday I talked the same to Starbuck there, concerning my broken boat. Oh! how valiantly I seek to drive out of others' hearts what's clinched so fast in mine!\" [1] Ahab is aware that he uses fatalism on other men and aware that it grips him. The aside is the single best textual evidence that Ahab's fatalism is both strategy and fear.\n\nOn the second reading, the speech is *sincere*, and Ahab's earlier defiance and later fatalism are two sides of a stable doctrine. Under this reading, to hate the power behind the mask is perfectly compatible with believing that it governs, and indeed requires the belief; one does not strike at what is not there. The defiance is then the only freedom left to a subject of a sovereign he cannot overthrow, a gesture that does not alter the outcome but constitutes the agent's dignity in it. That is precisely what Ahab says at the St. Elmo's fire, as I show below.\n\nOn the third reading, the speech is *self-diagnosis*. An earlier moment in the second day's chase gives it a more disturbing coloring. The chapter called \"The Symphony\", the calmest scene in the book, sets Ahab beside Starbuck on a tranquil morning, and Ahab says what he has said nowhere else: \"What is it, what nameless, inscrutable, unearthly thing is it; what cozening, hidden lord and master, and cruel, remorseless emperor commands me; that against all natural lovings and longings, I so keep pushing, and crowding, and jamming myself on all the time; recklessly making me ready to do what in my own proper, natural heart, I durst not so much as dare? Is Ahab, Ahab? Is it I, God, or who, that lifts this arm?\" [1]\n\nI take this to be the most important passage in the argument about the novel's providence. Here Ahab asks the question that predestinarian theology exists to answer and fails to quiet: who is the author of my act? And the answer he reaches is not Calvin's. He continues, with a mounting argument that is almost an essay on occasionalism (the doctrine that God is the immediate cause of every event): \"if the great sun move not of himself; but is as an errand-boy in heaven; nor one single star can revolve, but by some invisible power; how then can this one small heart beat; this one small brain think thoughts; unless God does that beating, does that thinking, does that living, and not I. By heaven, man, we are turned round and round in this world, like yonder windlass, and Fate is the handspike.\" And then, with the coldness of a legal proposition: \"Where do murderers go, man! Who's to doom, when the judge himself is dragged to the bar?\" [1]\n\nThat final question is, in compressed form, the standard theological objection to double predestination. If God causes the thought and the act, and then condemns the actor, the judge is the murderer. Ahab is not here a defiant atheist or a Manichaean; he is an *extreme providentialist* who has drawn the consequence that moral blame lands on God. In that state, his defiance in the face of the decree is no longer paradoxical. It is the response of a man who believes that the sovereign has made him do the thing and will then punish him for it.\n\nThe text immediately turns the screw, because in the same breath Ahab says the weather is mild and the sky smiling and the air \"as if it blew from a far-away meadow\", and proposes that he and Starbuck both \"sleep at last on the field\". Within a few lines he is in tears, speaking of the wife and the boy he left on land, and then he drives himself back into the hunt. The speech is not a proof but a *symptom*: the logic of total providence is available to him, it moves him, and it does not stop him. This is, I think, what Melville is doing with Ahab's fatalism. He shows that a perfect predestinarian argument, even a persuasive one, does not produce either repentance or peace. It produces a man who goes on doing what he was going to do, now with a theory in which his doing is both everything and nothing.\n\n## The Candles: Defiant Theism at the Corposants\n\n### The scene\n\nThe chapter called \"The Candles\" holds the book's richest theological set piece. A typhoon strikes the *Pequod*; the lightning rods are in place; and the masts begin to burn with the pale fire sailors call corposants (the term is a corruption of the Portuguese *corpo santo*, \"holy body\", and the phenomenon is better known as St. Elmo's fire). Melville has Stubb cry, \"The corpusants have mercy on us all!\" and has the narrator observe that he had seldom heard a common oath \"when God's burning finger has been laid on the ship; when His 'Mene, Mene, Tekel Upharsin' has been woven into the shrouds and the cordage.\" [1] The reference is to the writing on the wall in the Book of Daniel, a sign of judgment on a king. The scene is thus set, by the narrator, as a *warning*, a literal theophany that the reader is invited to read as God's message to a doomed captain.\n\nAhab reads it otherwise. He seizes the lightning chain, plants his foot on the kneeling Parsee, and addresses the fire. \"Oh! thou clear spirit of clear fire, whom on these seas I as Persian once did worship, till in the sacramental act so burned by thee, that to this hour I bear the scar; I now know thee, thou clear spirit, and I now know that thy right worship is defiance.\" [1]\n\n### What the speech claims\n\nThe statement \"thy right worship is defiance\" is the nearest thing in the book to a systematic theology of Ahab's, and it has three parts worth separating.\n\n**The power is real and unconditional.** \"I own thy speechless, placeless power\", says Ahab, and says it again. He is no atheist in the scene; he acknowledges what he later calls \"unconditional, unintegral mastery\". The word \"unintegral\" is a coinage that suggests a rule not built into Ahab himself, one that holds over him from outside.\n\n**The power is not benevolent.** \"To neither love nor reverence wilt thou be kind; and e'en for hate thou canst but kill; and all are killed.\" The fire is not a father who punishes in love. It kills hatred and love alike. \"Come in thy lowest form of love, and I will kneel and kiss thee; but at thy highest, come as mere supernal power; and though thou launchest navies of full-freighted worlds, there's that in here that still remains indifferent.\" This is a sharp distinction: Ahab will kneel to love and refuses to kneel to power. A God who is merely omnipotent does not command worship; a God who is good does. The distinction is old in the theodicy tradition (Job's friends assume the converse), and Ahab states it with precision.\n\n**Personality exceeds the power.** \"In the midst of the personified impersonal, a personality stands here. Though but a point at best; whencesoe'er I came; wheresoe'er I go; yet while I earthly live, the queenly personality lives in me, and feels her royal rights.\" The phrase \"the personified impersonal\" is remarkable. It names the divine as something that *wears* a face (is \"personified\") but is in fact an impersonal force, and over against it Ahab asserts the dignity of the only real person in the transaction, himself. This is a theological position, and it is also a position about what a person is: not a product of the power but something that, whatever its origin, possesses rights against it.\n\nThe speech continues into a passage whose structure invites a Gnostic comparison. \"Light though thou be, thou leapest out of darkness; but I am darkness leaping out of light, leaping out of thee! ... thou art but my fiery father; my sweet mother, I know not. Oh, cruel! what hast thou done with her? There lies my puzzle; but thine is greater. Thou knowest not how came ye, hence callest thyself unbegotten; certainly knowest not thy beginning, hence callest thyself unbegun. I know that of me, which thou knowest not of thyself, oh, thou omnipotent. There is some unsuffusing thing beyond thee, thou clear spirit, to whom all thy eternity is but time, all thy creativeness mechanical.\" [1]\n\nI want to be careful here about what is established and what is inference. It is established that the speech contains the idea of a reality beyond the fiery father, a \"sweet mother\" Ahab has never known, and an \"unsuffusing thing\" that stands behind the creator and for which the creator's creativity is \"mechanical\". It is established that this structurally resembles Gnostic myth, in which the visible creator is derivative and ignorant of a higher source. Whether Melville *knew* Gnostic sources is a different matter that I cannot settle from what I have read; a defensible account is that he arrived at the pattern by way of Romantic and Miltonic materials without needing the ancient texts. What the speech adds, and what separates it from the quarter-deck, is that Ahab now offers a *positive hypothesis* about the beyond. On the quarter-deck he said \"Sometimes I think there's naught beyond\". At the corposants he says there is something beyond, and it is the real source of whatever Ahab is. That is a sharp change of position and arguably the book's one moment of cosmological speculation by Ahab, inflected by his sense of orphaned origin (\"my sweet mother, I know not\").\n\nA reader should also notice the immediate response of the narrative. The speech ends with \"Sudden, repeated flashes of lightning\", and the flames leap to thrice their height. Ahab's rhetoric of unbroken independence (\"Thou canst blind; but I can then grope. Thou canst consume; but I can then be ashes\") is staged beside the physical fact of the blinded eye and the aching skull. The universe answers, and the answer is more of the same fire. Whether that counts as refutation or as grim confirmation of Ahab's thesis is the question the scene leaves open.\n\n### The baptism in the devil's name\n\nAhab's theology has one more liturgical expression. In the chapter \"The Forge\", he has the harpooneers give him blood from their open veins to temper the barbed iron he has made for the whale, and he pronounces: \"Ego non baptizo te in nomine patris, sed in nomine diaboli!\" [1] The sentence is plain dog-Latin (it parodies the baptismal formula \"I baptize thee in the name of the Father\") and it is the source of the title of the most famous psychological essay on the book, Henry A. Murray's \"In Nomine Diaboli\" [5]. Murray's essay, first published in *The New England Quarterly* in 1951 and reprinted in the Melville Society's *Moby-Dick Centennial Essays* in 1953, argues, in the summary I could read, that Ahab embodies Satan and the Id, that the whale represents the Calvinist God and the Puritan conscience, and that Melville wrote a book of rebellion against that order; Murray also says explicitly that Ahab is \"no Prometheus\", since he wants no benefit for mankind [5]. I return to that distinction.\n\n## The Parsee's Prophecy: Providence as Riddle\n\n### The structure of the prophecy\n\nAhab's defiance is repeatedly tested, not by argument but by oracular riddle. The central device is the prophecy of Fedallah, the Parsee harpooneer who is smuggled aboard with the secret boat's crew. In the chapter \"The Whale Watch\", in the dead of night, Ahab tells him that he has \"dreamed it again\", the hearse. Fedallah answers, \"Of the hearses? Have I not said, old man, that neither hearse nor coffin can be thine?\" Ahab: \"And who are hearsed that die on the sea?\" And the Parsee spells out the conditions: \"ere thou couldst die on this voyage, two hearses must verily be seen by thee on the sea; the first not made by mortal hands; and the visible wood of the last one must be grown in America.\" And then the Parsee promises, \"Though it come to the last, I shall still go before thee thy pilot\", and adds: \"Hemp only can kill thee.\" [1]\n\nAhab's response is the clearest evidence of how he handles prophecy. \"I have here two pledges that I shall yet slay Moby Dick and survive it.\" And when told that only hemp can kill him: \"The gallows, ye mean.—I am immortal then, on land and on sea.\" He translates every riddle into a guarantee. The mind that insisted that the decree is \"immutably decreed\" is, at the same time, taking the oracle as a promise of its own invulnerability.\n\n### The fulfilment and its ambiguity\n\nThe fulfilment arrives on the third day. Ahab sees the Parsee's torn body lashed to the whale's back and cries, \"Befooled, befooled!... Aye, Parsee! I see thee again.—Aye, and thou goest before; and this, this then is the hearse that thou didst promise. But I hold thee to the last letter of thy word. Where is the second hearse?\" [1] The first hearse is the whale itself, \"not made by mortal hands\". The second is the ship, built of American wood, which the reader sees go down; it is a reasonable inference, which Ahab does not state in so many words. Then the whale line, hemp, catches him round the neck \"voicelessly as Turkish mutes bowstring their victim\", and he is \"shot out of the boat\". The prophecy's literal terms have been met. No gallows, but hemp; no coffin, but a whale and a ship.\n\nThe lesson depends on how one reads the gap between what Ahab heard and what was meant. An orthodox providentialist reading is available: the prophecy was true and Ahab, by interpreting it as a promise, walked into its fulfilment, which is the pattern of tragic irony in Greek and biblical narrative alike. That reading treats the novel as a vindication of fate. The competing reading notes that every prediction was *ambiguous* and the reader is never given the means to judge whether Fedallah's riddles were foresight or a skilful exploitation of Ahab's will to read them. The Parsee is an unreliable prophet: the text calls him \"a ghost-devil\" in Stubb's mouth, never tells us his origin with certainty, and has him vanish in the first day's chase. Prophecy in this novel is *always interpretive*. Ahab asks the Parsee, \"Was it not so?\" and then supplies the meaning.\n\nA further problem lies in the status of the prophecy as evidence for any providence at all. The riddle's literal fulfilment is, by the narrator's own account, strained: Ahab's hearse is a corpse and a shipwreck, and the hemp is a whale-line, so that to count them as fulfilments one has to accept a resolution that fits the words but not obviously the spirit. A skeptic can say that *any* disaster on a whaling voyage would satisfy some description of a hearse, a ship and a rope. A believer can say that the specificity of the three clauses is the sign. The book supplies both interpretations and ends before either can be tested.\n\n### Fedallah between devil, Zoroastrian and foil\n\nFedallah himself is a puzzle on which scholars divide. Murray reads him as a devil figure, and suggests that he may echo Goethe's Mephistopheles, though he finds him in the end superfluous to the book's argument [5]. The text itself gives Fedallah's religion more precisely: Ahab says he once worshipped fire \"as Persian\", the Parsee kneels at the corposants, and Stubb at the doubloon observes that Fedallah \"only makes a sign to the sign and bows himself; there is a sun on the coin—fire worshipper, depend upon it.\" [1] \"Parsee\" is the English term for a Zoroastrian of Indian descent, and in the novel the figure gathers around him the associations of an alien religion with a prophetic power.\n\nFor the comparative question, the interesting point is that Fedallah mirrors Ahab's theology from outside the Christian frame. Ahab at the corposants invokes \"thou clear spirit of clear fire\" and says he once worshipped it as a Persian. The Zoroastrian tradition is, in the standard account, dualist: a good principle and an evil principle in cosmic combat. That fits the Manichaean strain in Ahab's thought, though Melville nowhere says that Ahab is a Zoroastrian dualist, and the scholarly reading of the Persian reference as a hint of cosmic dualism is an interpretation that I flag as defensible and not established.\n\n## Ishmael's Theology: \"I Try All Things\"\n\n### The method as metaphysics\n\nAgainst Ahab's single-pointed cosmology, the narrator practices something harder to name. The most compact statement of his method comes in an unlikely place, the cetology chapter on the whale's head, where he describes his qualification for applying physiognomy and phrenology to a whale: \"I am but ill qualified for a pioneer\", he concedes, but \"I will do my endeavor. I try all things; I achieve what I can.\" [1] Taken as a theology, the sentence is a refusal of closure: one *tries* a physiognomy, a cetology, a creed, a cosmology, and achieves a result without staking everything on it. Elsewhere Ishmael applies the same attitude to the nature of the whale's whiteness, to the nature of worship, and to the nature of chance.\n\nThe most thoroughly theological passages of Ishmael's early narration are comic in tone. When Ishmael finds himself in the room of the idol-worshipping harpooneer Queequeg, the question arises whether he should join the cannibal's evening prayers to his little wooden idol, Yojo. His reasoning is a model of theological casuistry (the application of general principle to hard cases): \"I was a good Christian; born and bred in the bosom of the infallible Presbyterian Church. How then could I unite with this wild idolator in worshipping his piece of wood? But what is worship? thought I. Do you suppose now, Ishmael, that the magnanimous God of heaven and earth—pagans and all included—can possibly be jealous of an insignificant bit of black wood? Impossible! But what is worship?—to do the will of God—that is worship. And what is the will of God?—to do to my fellow man what I would have my fellow man to do to me—that is the will of God.\" The argument concludes: \"ergo, I must turn idolator.\" He kindles the shavings, offers burnt biscuit, and kisses the idol's nose. [1]\n\nThe passage has been read as straightforward liberal Christianity, as satire of liberal Christianity, and as both. The prose is deadpan: the syllogism is neat, the conclusion preposterous, and the reader cannot tell whether the preposterousness lies in the premise (that worship is just doing as you would be done by) or in the practice (kissing a god's nose). My own reading is that the humor is a form of philosophical seriousness. The golden rule really is invoked as the theological ground for tolerance, and the absurd conclusion shows that Ishmael is willing to follow his principle somewhere his Presbyterian upbringing did not go. The chapter on Queequeg's Ramadan reinforces the point: \"we good Presbyterian Christians should be charitable in these things, and not fancy ourselves so vastly superior to other mortals, pagans and what not, because of their half-crazy conceits on these subjects.\" And the paragraph ends with the most Ishmaelean of benedictions: \"Heaven have mercy on us all—Presbyterians and Pagans alike—for we are all somehow dreadfully cracked about the head, and sadly need mending.\" [1]\n\n### What kind of skepticism?\n\nIs Ishmael's skepticism a stable philosophy or an unstable mood? Three observations bear on that.\n\nFirst, his tolerance has a *pragmatic root*. His earliest decision about the idolator is not theological at all: \"better sleep with a sober cannibal than a drunken Christian.\" [1] The ethical test is conduct, not creed. The golden-rule casuistry that follows is a rationalization of an instinct that is prior to it.\n\nSecond, the skepticism is *not* indifferent. The \"whiteness of the whale\" chapter, in which Ishmael tries to say why the white whale terrifies him, is one of the book's most searching passages on whether a meaningful order lies behind appearance, and it concludes in dread, not complacency. I do not have room to reproduce it here; its significance for providence is that the narrator, no less than Ahab, is haunted by the possibility that the visible world is, in the chapter's own phrase, a \"palsied universe\" lying \"before us a leper\", with God perhaps absent behind the paint. (Sibling chapters on the whiteness of the whale treat this more fully; I rely only on the general point.)\n\nThird, and most pertinent, Ishmael is *implicated in Ahab's theology*. After the quarter-deck scene, he confesses: \"my oath had been welded with theirs; and stronger I shouted, and more did I hammer and clinch my oath, because of the dread in my soul. A wild, mystical, sympathetical feeling was in me; Ahab's quenchless feud seemed mine.\" [1] The narrator who tries all things tries Ahab's, and for a while is carried by it. His pluralism is therefore not the stance of a spectator who never fell in. He fell in, and the book's retrospective voice is the voice of someone who got out. That distinction gives his skepticism its moral weight, and it is part of why critics who prefer Ishmael to Ahab are not simply choosing the more comfortable character.\n\n### The Mat-Maker: chance, free will and necessity\n\nThe most explicit philosophical statement by Ishmael on the structure of providence comes in a scene that has no storm or whale in it. In \"The Mat-Maker\", Ishmael and Queequeg weave a sword-mat on a calm afternoon, and Ishmael reads the loom as an emblem. \"There lay the fixed threads of the warp subject to but one single, ever returning, unchanging vibration... This warp seemed necessity; and here, thought I, with my own hand I ply my own shuttle and weave my own destiny into these unalterable threads.\" Queequeg's sword, which strikes the woof \"slantingly, or crookedly, or strongly, or weakly, as the case might be\", is chance. \"Aye, chance, free will, and necessity—nowise incompatible—all interweavingly working together.\" Then comes the sentence that gives the model its shape: \"The straight warp of necessity, not to be swerved from its ultimate course ... free will still free to ply her shuttle between given threads; and chance, though restrained in its play within the right lines of necessity, and sideways in its motions directed by free will, though thus prescribed to by both, chance by turns rules either, and has the last featuring blow at events.\" [1]\n\nThis is a *compatibilist* model with a third term. Compatibilism, in the philosophy of freedom, is the view that determinism and free action can both be true. The Reformed tradition's own version holds that the decree is certain yet the agent acts as agent. Ishmael's loom keeps necessity as the fixed frame and gives will a limited play inside it, but then adds chance, and gives *chance* \"the last featuring blow\". That last clause tilts the model away from Calvin. On a strictly Calvinist loom the final stroke belongs to the decree. On Ishmael's, the shuttle (will) and the frame (necessity) are both subordinate to an indifferent \"sword\", which he identifies with Queequeg's easy, careless hand. Providence on this model is not absent, since the warp is there, but it does not rule the finished pattern.\n\nIt is worth noticing what the scene does next. A cry of \"There she blows!\" from Tashtego drops \"the ball of free will\" from Ishmael's hand. The metaphysics ends in a whale sighting; the model is interrupted by the thing it was meant to explain. This is typical of Ishmael: a theory is offered, held lightly, and then the world arrives and the theory is not tested but overtaken.\n\n### Bulkington and the \"landlessness\" of truth\n\nA small and often neglected piece of the Ishmael-side theology is the six-inch chapter on Bulkington, the tall mariner who appears briefly in New Bedford, then at the *Pequod*'s helm as she leaves port. Ishmael declares the chapter \"the stoneless grave of Bulkington\" and then gives the figure an extraordinary thought: \"all deep, earnest thinking is but the intrepid effort of the soul to keep the open independence of her sea; while the wildest winds of heaven and earth conspire to cast her on the treacherous, slavish shore.\" And: \"as in landlessness alone resides highest truth, shoreless, indefinite as God—so, better is it to perish in that howling infinite, than be ingloriously dashed upon the lee, even if that were safety!\" [1]\n\nAs a doctrine about truth and God, this sounds more like Ahab than like the genial Ishmael of the mat. The desire for \"landlessness\", the refusal of safe harbour, is a refusal of settled doctrine, and it is stated in a voice close to Ahab's rhetoric of the \"iron way\". I read Bulkington as the book's evidence that the line between the two theologies is not sharp. Both treat shore, comfort and fixed creed as a kind of death. They differ in what they do on the open sea: Ahab sets a course at a single object, and Ishmael remains alert to many. The novel never explains why Bulkington then disappears, which is, I think, the point. His epitaph is the book's unargued credo, and it is held by a man who never gets to prove it.\n\n### The limit on pluralism: the Try-Works\n\nIf Ishmael's refusal of closure were the book's resolution, the novel would be a manual of tolerance. It is not, because in \"The Try-Works\" the narrator describes the moment in which his own looseness nearly killed him. At the helm of the ship while the blubber was being boiled down in the fires at night, he fell asleep standing, turned himself around to face the stern, and almost put the vessel in danger. The chapter's conclusion is a warning: \"Give not thyself up, then, to fire, lest it invert thee, deaden thee\", and in the paragraph just before it Ishmael declares that \"the truest of all books is Solomon's, and Ecclesiastes is the fine hammered steel of woe.\" [1] Here the skeptic, who has been trying all things, finds a text that he declares true, and it is the book of the preacher who found everything vanity. The qualification for pluralism, then, is a darker fixed point: a conviction of the world's vanity, joined with a warning against any all-consuming passion. In short, the book of Ishmael's creed is the book of Ecclesiastes, not the book of tolerance.\n\n## The Mates: Four Theologies in Small Boats\n\nBetween the two great minds the novel places three officers whose beliefs are a spectrum of what ordinary men do with the question.\n\n### Starbuck: scruple without courage\n\nThe chief mate is introduced as \"a native of Nantucket, and a Quaker by descent\", \"uncommonly conscientious for a seaman, and endued with a deep natural reverence\", whose \"wild watery loneliness\" inclines him \"to superstition; but to that sort of superstition, which in some organizations seems rather to spring, somehow, from intelligence than from ignorance.\" [1] His line, \"I will have no man in my boat... who is not afraid of a whale\", expresses a practical ethic of fear as the beginning of competence. The narrator adds that \"in him courage was not a sentiment; but a thing simply useful to him.\" That detail is important. Starbuck's piety is not a creed of defiance, and his Quakerism has been \"variously and anomalously modified\" (the narrator's own phrase for the Nantucket Quaker) into a fighting variety. The historical facts of Nantucket Quakerism and whaling are real enough: the island was settled by Quakers and developed the largest whaling industry in the nation, a coincidence the narrator remarks on as \"Quakers with a vengeance\" [1]. I did not find a peer-reviewed treatment of Starbuck's Quakerism in my searches, and what I say about the Quaker setting comes from the novel itself.\n\nStarbuck's theological position is a plain pious one: \"God keep me!—keep us all!\" (the murmur that Ahab does not hear when he thinks he has won Starbuck's silent assent), and later, \"Oh, oh,—Impiety and blasphemy to hunt him more!\" [1] He is the character who says what a Christian theologian would say to Ahab, and he fails. His failure is the book's most direct treatment of the practical impotence of orthodox piety in front of a will like Ahab's. In \"The Musket\", Starbuck holds the loaded gun at the cabin door and asks himself \"Is heaven a murderer when its lightning strikes a would-be murderer in his bed?\", reaches for providence as a license, and cannot pull the trigger. He puts the question in providential terms, \"Great God, where art Thou?\", and gets no reply. [1] Starbuck's piety does not tell him what to do, because it has no theory of how providence uses human hands. The scene is a small demonstration of the book's central problem: if heaven strikes through human agents, what makes an act heaven's and not the agent's?\n\n### Stubb: jollity as predestinarianism\n\nThe second mate is a fatalist by temperament. In \"First Night-Watch\", alone at the fore-top mending a brace, he reasons his way to a creed: \"a laugh's the wisest, easiest answer to all that's queer; and come what will, one comfort's always left—that unfailing comfort is, it's all predestinated.\" [1] Stubb's predestination is the comic cousin of Ahab's. Both believe the course is set. Ahab responds with a fixed purpose; Stubb with a pipe and a laugh. The corposants scene gives Stubb a typical turn: he shifts from crying out for mercy to reading the flame as \"a sign of good luck\", since the masts are \"rooted in a hold that is going to be chock a' block with sperm-oil\" and will thus turn into \"three spermaceti candles\". [1] Stubb's providence is a providence that is on the side of profit and good cheer, and he will turn any portent into a promise. His doubloon reading, which marches through the zodiac as a comic account of a life in which every sign is a blow and the sun comes out \"alive and hearty\", ends with the conclusion \"jolly's the word for aye!\" [1]\n\nThe structural point is that Stubb's fatalism and Ahab's are *behaviourally opposite and doctrinally identical*. The novel uses Stubb to show that the doctrine of predestination in itself yields no particular attitude. The same belief that makes Ahab furious makes Stubb merry, and the chapter on the doubloon places the two side by side. To the question of what a belief in fate does to the believer, the novel's answer is that it depends on the believer.\n\n### Flask: pragmatism\n\nThe third mate is the book's deflationary materialist. When he reaches the doubloon he reads only its commercial value: \"It is worth sixteen dollars, that's true; and at two cents the cigar, that's nine hundred and sixty cigars.\" [1] Flask has no theory of providence because he has no occasion for one; for him the coin and the whale are goods to be got. Stubb's own comment on Flask's reading in the same chapter, that he cannot tell whether to call it \"wise or foolish\" (\"if it be really wise it has a foolish look to it; yet, if it be really foolish, then has it a sort of wiseish look to it\") points at something about Flask's position. The pragmatist's silence on providence may be the most honest position on the deck, or the most evasive. The novel does not say.\n\n### The doubloon as a controlled experiment\n\nThe chapter called \"The Doubloon\" is Melville's deliberate experiment in comparative theology. A single object, a gold Ecuadorian coin nailed to the mast, is read in turn by each person on the ship, and each reading discloses its reader. Ahab sees himself: \"this round gold is but the image of the rounder globe, which, like a magician's glass, to each and every man in turn but mirrors back his own mysterious self. Great pains, small gains for those who ask the world to solve them; it cannot solve itself.\" Starbuck sees a Christian emblem, \"a dark valley between three mighty, heaven-abiding peaks, that almost seem the Trinity\", and says that \"over all our gloom, the sun of Righteousness still shines a beacon and a hope\", before adding that \"the great sun is no fixture\" and leaving \"lest Truth shake me falsely.\" Stubb, as above, sees the zodiac as the life of man. Flask sees cigars. The Manxman sees an omen in the sign of the lion, \"the roaring and devouring lion\". Queequeg \"takes it for an old button off some king's trowsers.\" Fedallah \"bows himself\". [1]\n\nStubb's comment on the whole performance is the keynote: \"There's another rendering now; but still one text. All sorts of men in one kind of world, you see.\" [1] The doubloon is the nearest the book comes to a thesis about interpretation. It does not declare that the coin has no meaning. The narrator says at its opening that \"a certain significance lurks in all things, else all things are little worth, and the round world itself but an empty cipher\". But it shows that the meaning each reader takes is shaped by what each brought. Ahab's own remark, which I have already quoted, anticipates a modern hermeneutic suspicion, and Ahab himself is trapped in it, since the same logic applies to his reading of the whale. For a scholar who wants to attribute a doctrine to Melville, \"The Doubloon\" is the textual obstacle: it demonstrates that readings are projections, and Melville then offers no coin of his own.\n\n## Pip: Madness as Revelation\n\n### The castaway\n\nThe little black ship-keeper known as Pip (\"Pippin by nick-name\"), remembered from the night of the tambourine, is left floating in the open sea when Stubb's boat, in the heat of a chase, cuts the line and abandons him. The chapter \"The Castaway\" gives the book's most direct statement of a *third theology*, one that stands to Ahab's and Ishmael's as neither defiance nor tolerance but vision. The narrator tells us that the sea \"had jeeringly kept his finite body up, but drowned the infinite of his soul. Not drowned entirely, though. Rather carried down alive to wondrous depths, where strange shapes of the unwarped primal world glided to and fro before his passive eyes; and the miser-merman, Wisdom, revealed his hoarded heaps; and among the joyous, heartless, ever-juvenile eternities, Pip saw the multitudinous, God-omnipresent, coral insects, that out of the firmament of waters heaved the colossal orbs. He saw God's foot upon the treadle of the loom, and spoke it; and therefore his shipmates called him mad.\" Then the aphorism: \"So man's insanity is heaven's sense; and wandering from all mortal reason, man comes at last to that celestial thought, which, to reason, is absurd and frantic; and weal or woe, feels then uncompromised, indifferent as his God.\" [1]\n\nThe relevance for providence is exact. \"God's foot upon the treadle of the loom\" is the image of providence as total weaver: the Mat-Maker's loom has returned, and this time the machinery is God's own and requires no third term of chance. Pip sees it directly and is called mad for saying so. The narrator then closes the paragraph with a verdict that is easy to miss: the God of Pip's vision is \"indifferent\", and the man who sees him \"feels then uncompromised, indifferent as his God.\" Pip's revelation is of an *omnipresent, immanent, and indifferent* God, working through innumerable small agents (\"coral insects\") to build vast structures without regard to any of them. If the vision is true, it is the severest providentialism in the book, harsher than Calvin's, because it removes concern from the divine.\n\n### Pip at the doubloon and in the cabin\n\nPip's later appearances sharpen the effect. At the doubloon he recites a conjugation, \"I look, you look, he looks; we look, ye look, they look\", and Stubb thinks he has been studying Murray's Grammar. [1] The sequence is the book's quiet definition of intersubjectivity: everyone looks, and every look is the grammar of someone else's. The child then adds a fragment that points beyond the gold: \"God goes 'mong the worlds blackberrying.\" The image is one of casual, domestic divine activity, and utterly unconcerned. In the chapter called \"The Cabin\", Ahab, who has until now been unreachable by any human appeal, takes Pip by the hand and offers him a place in his own quarters; \"Thy hand!—Met! True art thou, lad, as the circumference to its centre. So: God for ever bless thee.\" [1] The only person to whom Ahab ever speaks tenderly in the last third of the book is the person who has seen the loom. Pip's refusal to leave and Ahab's insistence that he stay behind is the book's one moment when Ahab's fixed purpose \"keels up in him\", in his own words, and he recovers it by resolving to leave Pip behind.\n\nI take Pip to be the novel's most important evidence that Melville regards *neither* the pious nor the defiant nor the tolerant stance as the full account of what a human being might see. The knowledge Pip gets is not available by effort or by argument, comes in a catastrophe, and cannot be put to use. The book gives Ahab the world's most eloquent will and Ishmael the world's most agile mind and then, in a child who is \"mad\", the one vision that none of them can bear.\n\n## The Prophets at the Edge\n\n### Elijah\n\nBefore the *Pequod* sails, a ragged stranger accosts Ishmael and Queequeg on the New Bedford wharf. His name is Elijah, and his questions about the ship's captain are riddles: \"Ye hav'n't seen Old Thunder yet, have ye?\" \"Captain Ahab.\" [1] The biblical King Ahab's prophet-antagonist was Elijah, who foretold his death in disgrace, and Melville names this man with the usual economy. He is a prophet without credentials, a drunk or a madman whose words nobody trusts, and Ishmael's reaction is what the reader's will be: he dismisses him and then cannot stop thinking about him. Elijah is the first instance of a pattern that continues to the last page, in which prophecy is delivered, ridiculed, and later seen to have been in some sense true. The reader's difficulty is that the novel gives no way of deciding whether Elijah *knew* anything. He, like the Parsee, supplies materials that readers in retrospect fit into a design, and it is the retrospect, not the prophecy, that makes the design.\n\n### The Manxman\n\nThe old Manxman, one of the sepulchral minor sailors, is an even smaller instrument of the same effect. Early in the voyage, \"a grey Manxman insinuated\" that whoever should lay Ahab out tranquilly would \"find a birth-mark on him from crown to sole\", and \"the old sea-traditions, the immemorial credulities, popularly invested this old Manxman with preternatural powers of discernment.\" [1] At the doubloon he reads the horseshoe sign and the lion, and says \"Ship, old ship! my old head shakes to think of thee.\" The Manxman is, in the narrator's description, \"the old hearse-driver, he must have been, that is, before he took to the sea\" [1], an unmistakably funereal figure in a book where hearses are central. The effect of these minor omens, taken together, is to create an atmosphere of foreboding that no one has to believe. In a book about providence, the atmosphere does the work an argument cannot.\n\n### Queequeg's coffin\n\nOne further episode deserves its place in the theological ledger. When Queequeg takes ill and has the carpenter build a coffin, then recovers by an act of will, the coffin becomes first a sea-chest and finally the life-buoy that saves Ishmael. \"Queequeg in His Coffin\" is thus a quiet counter-prophecy to the Parsee's: the object that was to be a hearse for one man becomes the means of another's survival. The reading is not an invention of the critics, since the Epilogue states the mechanism plainly, as I show below.\n\n## Comparisons: Calvin, Job, Prometheus, Faust, Milton's Satan\n\n### The Calvinist frame\n\nThe most developed scholarly argument that Ahab's tragedy is shaped by Reformed theology is T. Walter Herbert's. In an article published in *PMLA* in October 1969, \"Calvinism and Cosmic Evil in *Moby-Dick*\", Herbert argued, according to the abstract I could read, that Father Mapple's Jonah sermon sets out Calvinist ideas that frame Ahab's rebellion as defiance of ultimate authority; that Melville shaped Ahab's view of the whale partly through an anti-Calvinist tradition that portrayed Calvin's God as a cruel monster; and that Calvin's reading of the Old Testament king Ahab as one predestined to damnation, marked by satanic victimization and madness, informs the captain's characterization. Herbert adds that Melville's use of theology, though extensive, remains subordinate to the novel's central themes [2]. He extended the argument to a book, *Moby-Dick and Calvinism: A World Dismantled* (Rutgers University Press, 1977), which a contemporary notice describes as using Melville's family papers and the classics of Calvinist belief to show how the novel dramatizes his spiritual struggle [3]. I could not access the book's text, so I rely for the larger argument on the article's abstract and the notice.\n\nThe strongest textual support for Herbert's line is a pattern the novel makes visible. Father Mapple's sermon, which comes in the early chapters, is no gentle homily. It insists on obedience to God and warns against the attempt to flee him, and near its close it reaches a passage that, read alongside Ahab, is startling: \"Delight is to him—a far, far upward, and inward delight—who against the proud gods and commodores of this earth, ever stands forth his own inexorable self. Delight is to him, who gives no quarter in the truth, and kills, burns, and destroys all sin though he pluck it out from under the robes of Senators and Judges.\" [1] The \"inexorable self\" standing against \"proud gods\" is the posture Ahab adopts against the real God, so that the language of the pulpit, in which it is a pious ideal, becomes in Ahab's mouth the grammar of rebellion. That is the kind of echo that supports a reading in which the novel works through Reformed material and turns it.\n\nWhat the Calvinist frame supplies is a structure for Ahab's two stances. Reformed theology teaches that God's decree is sovereign and that the reprobate are damned by that decree and are nevertheless responsible. The objection that this makes God the author of sin is the oldest objection to the doctrine. Ahab's question, \"Who's to doom, when the judge himself is dragged to the bar?\", is that objection, put into the mouth of a man who believes it. His feeling of being \"damned in the midst of Paradise\" has the coloring of a reprobate who has read the decree. His claim to be \"the Fates' lieutenant\" names the dilemma in a pagan idiom.\n\nThe frame has limits that a fair account must state. First, Herbert himself says the theology is subordinate. Second, Calvinism teaches that an elect person is free from the terror of the decree, which is not Ahab's case, nor Ishmael's. Third, the novel's own comparison is wider than any one Christian tradition: pagan Fates, Persian fire, Greek Prometheus, biblical Job. A reading that reduces the book to Calvinism cannot account for Ishmael's weaving of \"chance, free will, and necessity\", which is a different model; and a reading that denies any Calvinist structure cannot account for Mapple. What I find defensible is a double claim: Calvinist structures supply the *problem* (a total decree, with human responsibility) and the novel declines the Calvinist *answer*.\n\n### Thompson's quarrel and the argument that Melville concealed his meaning\n\nAn older and more aggressive reading is Lawrance Thompson's *Melville's Quarrel with God* (Princeton University Press, 1952). The publisher's description states that Thompson offers a radical reinterpretation, arguing that Melville, hiding his bleak view of God as cruel and malicious, consistently satirized Christian doctrine, using devices that could fool orthodox readers while mocking their beliefs [4]. On that account Ahab's hatred of the powers is Melville's own, camouflaged. The thesis has been criticized, in the standard historiography, for treating irony as a master key that unlocks every ambiguity in the author's favour; but I could not find, in my searches, a contemporary review I could cite, so I describe the later view as the one reflected in the general critical literature and do not attribute it to a named source.\n\nMy own assessment is that Thompson's reading is *possible but unfalsifiable*. If every orthodox sentence is camouflage, then no sentence can count against the thesis. The novel's text, on the other hand, gives Ahab's theology no narrative vindication: the whale does not repent, the Fates do not intervene, the ship sinks. If Melville's purpose were to endorse Ahab's quarrel, he supplied remarkably little reward for the quarreller.\n\n### Job\n\nThe Book of Job is the novel's other scriptural backbone, and the novel itself says so. Ishmael declares that \"the awful tauntings in Job might well appal me. Will he (the leviathan) make a covenant with thee? Behold the hope of him is vain!\" [1], an echo of the divine speech from the whirlwind that makes the leviathan the sign of a creation beyond human mastery. The epigraph to the Epilogue is Job's: \"And I only am escaped alone to tell thee.\" [1] The words are spoken by the messenger who brings Job news of one disaster after another, and they do two things to the narrative. They announce that the survivor is a witness to ruin, and they cast the whole story as an occasion for Job-like questions about justice.\n\nJob offers a different and in some ways *better* comparison for Ahab than Prometheus does. Job demands that God answer for his suffering, and is answered with a display of power that does not address the question. Ahab says what Job says, only without waiting for the whirlwind, and when the whirlwind comes in the form of the whale he stabs at it. The scholarly reading of the divine speech is itself divided; one common summary says that the argument turns on whether the whirlwind speech stresses God's unfathomable purposes (so that theodicy is impossible for finite humans) or gives Job a real answer [19]. A master's thesis on Northrop Frye's reading of the novel argues that Ahab is a Promethean figure whose challenge to the demonic categorization of Leviathan is bound up with Job's challenge [10], which is the type of claim I would regard as suggestive and not yet established. The structural fit, whatever its scholarly status, is clear: the novel puts the whale in the role of Leviathan, the complaint in Ahab's mouth, and the whirlwind in the typhoon of \"The Candles\". What it withholds is the voice that speaks from the storm.\n\n### Prometheus\n\nAhab is not unlike Prometheus, but the novel's own use of the figure is more interesting than a simple equation. In the chapter on Ahab's inner life, Ishmael writes that \"he whose intense thinking thus makes him a Prometheus; a vulture feeds upon that heart for ever; that vulture the very creature he creates.\" [1] The Prometheus here is *self-devouring*: the \"creature\" Ahab has created in himself (his monomania) is the vulture that eats him. And in \"The Forge\", Ahab speaks of \"that old Greek, Prometheus, who made men\" being a blacksmith who \"animated them with fire; for what's made in fire must properly belong to fire; and so hell's probable.\" [1] The blacksmith is \"Prometheus\", and Ahab turns the myth toward damnation: what fire makes belongs to fire.\n\nMurray's remark that Ahab is \"no Prometheus\" because he wants no benefit for mankind [5] is a sharp point and the right one to place against the novel's own Promethean language. Aeschylean Prometheus defies Zeus on behalf of humans; Ahab defies the powers on behalf of himself, and the crew he takes down with him are his instruments. The novel uses the Promethean vocabulary and withholds the Promethean justification, which seems to me deliberate.\n\n### Faust\n\nThe Faust comparison is the weakest in the literature, and I mark it as inference. Ahab's relation to Fedallah has Faustian features: a proud seeker with a compact, a dark companion who promises, a prophecy that the seeker interprets in his own favour, a ruin that fulfils the letter. Murray, as I noted, links Fedallah to Goethe's Mephistopheles and finds him superfluous [5]. I did not find a source that makes the Faust parallel central, and I cannot establish that Melville had Goethe's text in view when writing the Parsee. The parallel is typological, not genetic, and it is useful chiefly for what it shows by contrast: Faust is offered a contract he signs, whereas Ahab never signs anything with Fedallah; the pledges he claims are his own reading of riddles. Faust is damned or saved by the terms of a bargain. Ahab's fate is determined, if it is determined, by something the text never names.\n\n### Milton's Satan\n\nThe Miltonic comparison is the best supported by evidence outside the text. Princeton University Library holds a two-volume 1836 *Poetical Works of John Milton* that belonged to Melville, with checkmarks, underlinings, notes and Xs that mark his reading of *Paradise Lost*, and the Melville's Marginalia Online project has digitized it; according to one summary, the marginalia record his reading on at least three dated occasions, in 1849, 1860 and 1868 [9]. William Giraldi's 2013 essay in the *Los Angeles Review of Books* argues that as late as 1849 Melville had not yet conceived Ahab and was working on a coming-of-age story about Ishmael, and that rereading *Paradise Lost* in the course of composition changed the novel's mythic scope and made Ahab a Satanic figure, proud, solipsistic, seeing God as unworthy of his reign, yet winning the reader's sympathy [9]. That is a claim by a literary journalist, and the dating of the Milton rereading and its effect on the drafts should be checked against Parker's biography and the editorial scholarship, which I was not able to read. The pattern it describes is the one the standard accounts of the book's genesis give, including Olson's *Call Me Ishmael* (1947), whose thesis, as a publisher's summary has it, is that Melville wrote two versions of the novel with a first reading of *King Lear* between them, establishing him as an American Shakespeare [15]. I cannot, from these sources, say what precisely Olson says about Milton.\n\nThe textual evidence for the Satan comparison is better than the secondary accounts. The harpoon baptism \"in nomine diaboli\" is Ahab's own association of himself with the devil's party. And at the very end, when the *Pequod* sinks with Tashtego nailing the flag to the mast and a sky-hawk caught under his hammer, Ishmael's narration says that the ship \"like Satan, would not sink to hell till she had dragged a living part of heaven along with her, and helmeted herself with it.\" [1] The narrator compares the doomed ship, which is Ahab's world, to Satan, and the comparison is the last theological judgment in the book before the Epilogue. It is not a flattering one, and it is not condemnatory either; it echoes the Miltonic ambivalence that scholars have long noted, the sublime that coexists with the damned.\n\n## Does the Novel Endorse Either Theology?\n\nI put the question as a dialectic: the case for Ahab, the case for Ishmael, and the case that the novel endorses neither, with the evidence each side would cite.\n\n### The case that the novel endorses Ahab\n\nThe strongest argument for an Ahabian reading is aesthetic and psychological. Ahab gets the book's most powerful language. The quarter-deck, \"Sunset\", \"The Candles\", \"The Symphony\" and the last speech (\"from hell's heart I stab at thee; for hate's sake I spit my last breath at thee\" [1]) are the high points of the novel's prose, and they have the quality of conviction. Melville told Hawthorne, as far as I can establish from secondary accounts of the November 1851 letter, that he had written a \"wicked book\" and felt spotless as a lamb [8]; I could not verify the exact wording against the edited letter, and the report that it appears in the letter of 17 November 1851 comes from secondary web sources. If the line is read at face value, it suggests that Melville knew the book had a wickedness he was proud of, and the most natural locus of that wickedness is Ahab's blasphemy.\n\nMurray's reading is of this family. In the summary I could read, he argues that Melville, fundamentally good and reverent, wrote a book of rebellion against the Calvinist God and Puritan moral order, with Ahab as the Satanic rebel and the whale as the power he attacks; and that Melville, like Blake's \"true poet,\" belonged to \"the Devil's party\" (the phrase is Blake's, which Murray applies to Melville) [5]. Thompson's reading goes further, treating the whole book as an esoteric commentary on God's cruelty [4]. Milder's *Exiled Royalties* (Oxford University Press, 2006), as its publisher and catalog descriptions have it, makes a preoccupation with how to live nobly in spiritual exile, \"godlike in the perceptible absence of God\", a recurring concern of Melville's career, and takes its title essay from Ishmael's account of \"Ahab's larger, darker, deeper part\", read as Melville's projection of a part of himself [11]. If Milder is right, Ahab is not an object lesson but an exposure of the author.\n\nThese readings have real textual force. They also meet a counter-evidence problem. Ahab's theology is *tested* by the plot, and the plot goes against him: omens that he reads as promises come true in the cruelest sense; the crew he commands is destroyed; the whale lives. A book that endorsed his stance would be expected to give it either vindication or a martyr's death, and it gives neither. His death is a fall in a noose of his own line, an accident with the structure of a joke.\n\n### The case that the novel endorses Ishmael\n\nThe strongest argument for an Ishmaelean reading is structural. Ishmael survives. He narrates the book and chooses its digressions, its jokes, its lists and its tolerances, so that the form of the novel is his temperament. Brodtkorb's *Ishmael's White World* (Yale University Press, 1965) is the classic statement that Ishmael is the central figure, since he grasps that each observer gives the whale its meaning; a 1967 notice in *Review of Metaphysics* summarizes the book's method, says it treats Ishmael as the one who understands interpretation as constitutive, and finds the account of Ahab's allegorical reading weak under that framework, though it also finds Brodtkorb's relation of the concepts to the world thin [14]. On this reading the novel's wisdom is the capacity to hold many frames, to stay alive in them, and to leave. The Epilogue's tone, soft and dirgelike, confirms a quiet recovery: \"The unharming sharks, they glided by as if with padlocks on their mouths; the savage sea-hawks sailed with sheathed beaks.\" [1]\n\nThe Ishmaelean case is also supported by the narrative's own moral discrimination. The narrator tells us, in the aside that follows Ahab's quarter-deck triumph, that omens and warnings are in truth \"verifications of the foregoing things within\" (\"with little external to constrain us, the innermost necessities in our being, these still drive us on\") [1], which is the book's own diagnosis of Ahab: he is driven from inside, not by Fates.\n\nThe counter-evidence is also strong. The Epilogue is a *Job*-quotation, and what it announces is a messenger of disaster, not a sage. And the narrator who has tried all things was, as I showed, caught by Ahab's oath. A pluralist who can be swept into a monomaniacal crusade for a hundred chapters is a pluralist who has demonstrated the fragility of pluralism. Moreover, the Ecclesiastes passage and the \"whiteness of the whale\" chapter reveal that Ishmael's equanimity is stretched over dread, not peace.\n\n### The case that the novel endorses neither\n\nMy own reading, which I regard as defensible but contested, is that the novel endorses neither, and that its means of declining are specific enough to describe.\n\n**It tests each theology against the other and lets neither win.** Ahab's providentialism produces destruction but also yields the book's most profound intellectual questions (the \"judge dragged to the bar\"). Ishmael's tolerance produces survival but is exposed in the Try-Works and the quarter-deck oath as unstable.\n\n**It plants the opposite theology in each man's mouth at the crisis.** Ahab, the defiant man, declares himself \"the Fates' lieutenant\". Ishmael, the skeptic, writes in the Epilogue that \"the Fates ordained\" that he should take the place of the vanished bowsman: \"It so chanced that, after the Parsee's disappearance, I was he whom the Fates ordained to take the place of Ahab's bowsman.\" [1] The two phrases are the same word. The passage is a small masterpiece of irony or of belief, and which depends on how seriously one takes the narrator. If Ishmael means it, then the sceptic's survival is credited to providence; if he is speaking idiomatically, then Ahab's \"Fates' lieutenant\" may be idiom too, and the supposedly fixed doctrine dissolves into a figure of speech. Either way the opposition between the two men is less secure than it looked.\n\n**It stages its decisive objects as ambiguous.** The doubloon is read by all and means whatever each reader brings. The Parsee's prophecy is fulfilled to the letter and yet remains compatible with coincidence. The corposants are God's finger to the narrator and a fire to Ahab and a candle to Stubb. The coffin that was to be Queequeg's hearse becomes Ishmael's buoy: it is a sign of grace if one is inclined to believe and a convenient piece of wood if one is not. The Epilogue's last sentence supplies the pattern: the *Rachel*, \"that in her retracing search after her missing children, only found another orphan.\" [1] Both a rescue and a bereavement, with the name of a biblical mother who refuses consolation. The book ends where its doubloon began: the same event, two meanings.\n\n**The extra-textual evidence points the same way.** Hawthorne, who knew Melville as a friend, recorded in November 1856, when Melville visited him in Liverpool and Southport, that Melville \"as he always does, began to reason of Providence and futurity, and of everything else that lies beyond human ken\" (the wording is from the abridged published version of the English notebooks [6]). A longer entry, which I could reach only through a secondary web quotation attributing it to Hawthorne's notebook of 20 November 1856, says that Melville said he had \"pretty much made up his mind to be annihilated\" and that he could \"neither believe, nor be comfortable in his unbelief\" [6]. I treat that quotation as probable but not independently verified in the edition. If it is accurate, Hawthorne's testimony is the best contemporary evidence we have on Melville's own state: an unresolved man who kept returning to the question of providence. That fits a book that stages the question from two sides and leaves it open. Melville's 1850 essay on Hawthorne makes the cognate point from the other direction, praising in Hawthorne \"that Calvinistic sense of Innate Depravity and Original Sin, from whose visitations, in some shape or other, no deeply thinking mind is always and wholly free\" [7]. The wording I could confirm is the fragment about the Calvinistic sense; the rest of the sentence comes from a secondary source's rendering of the essay. The phrase \"no deeply thinking mind is always ... free\" frames Calvinism as a recurring visitation, not a creed to be held or discarded. That is exactly how the novel treats it: the decree is felt, in Ahab and Pip and Starbuck's moment with the musket, and also resisted, in the Mat-Maker, Stubb's jokes, and Flask's cigars.\n\n### Where the evidence leans\n\nIf I have to say where the weight falls, the form favours Ishmael and the intensity favours Ahab, and the truth-claims favour neither. The novel allows its skeptic to live and its prophet to die, but it never certifies the skeptic's creed, and it gives the prophet's creed a voice so large that the skeptic cannot answer it except by narrating it. A reader who goes away convinced that Melville believed in a malicious God has read the quarter-deck and the corposants and not the Epilogue; a reader convinced that Melville believed in tolerant pluralism has read the Queequeg chapters and not the Try-Works. The sound conclusion is the less satisfying one: Melville was staging an argument, he did not close it, and that is the argument's most accurate report.\n\nOne more consideration weighs against any hasty identification of the author with either mouth. Delbanco's *Melville: His World and Work* (Knopf, 2005), which I could access only through publisher and library descriptions and a note of a 2002 lecture, presents the spiritual preoccupations of the period before and after *Moby-Dick* as a central part of the life, and its author has described Melville as preoccupied with human cruelty and the human appetite for belief [12]. The pairing \"cruelty\" and \"appetite for belief\" captures the two theologies as human phenomena as well as metaphysical positions. Ahab is the appetite for belief in its most violent form; Ishmael is the appetite held in check. Reading them as attitudes toward belief, not as claims about God, may be the most generous way to see what the novel does with each.\n\n## What the Reception Adds\n\nA final note on how the dispute has gone. Matthiessen's *American Renaissance* (Oxford University Press, 1941) devoted chapters to Melville's debt to Shakespeare, his sense of tragedy and the structure of *Moby-Dick*, and helped fix the book as a tragedy centred on Ahab [16]. Olson's *Call Me Ishmael* (1947) treated the book as a Shakespearean drama of space and power [15]. Murray (1951) and Thompson (1952) made Ahab's quarrel with God the book's secret subject [4][5]. Brodtkorb (1965) reversed the emphasis, placing Ishmael at the centre [14]. Herbert (1969, 1977) restored a historical-theological frame and argued that the Calvinist materials were real but subordinate [2][3]. Parker's two-volume biography (Johns Hopkins University Press, 1996 and 2002) gave the career a documentary base [13], and Milder's later essays returned the question of spiritual exile to the centre [11]. The shape is a pendulum, and its swings track the critical moment as much as the book: the mid-century readers who reached for Satan and Shakespeare were also readers who lived through totalitarian wars and wanted a tragedy of will; later readers wanted voices and were drawn to the narrator. The study of the book is itself carried on today under the Melville Society, whose journal *Leviathan*, published by Johns Hopkins University Press, was publishing volume 28 (2026) in the listings I could check [18].\n\nThe pendulum's persistence is evidence for the thesis I have argued. If the book clearly endorsed one theology, the pendulum would have stopped.\n\n## Open Questions\n\nSeveral questions remain open on the evidence I could reach.\n\nWhether Melville read Gnostic or Manichaean sources, or arrived at the pattern of the \"unsuffusing thing beyond\" through Romantic and Miltonic channels, cannot be settled from the primary text and would need work in the library records and the correspondence.\n\nThe dating and extent of the Milton rereading, and its influence on the stages of composition, rest here on a literary essay and a summary of the marginalia; the documentary scholarship of the Northwestern-Newberry editors and Parker's biography should decide it.\n\nThe exact wording and source of Hawthorne's report on Melville's unbelief and of the \"wicked book\" line should be checked against the Centenary Edition of the English notebooks and the Northwestern-Newberry correspondence volume. I relied on secondary renderings for both.\n\nWhether the Epilogue's \"the Fates ordained\" is idiom or belief is a question about Ishmael's narrating voice that depends on a reading of the whole book's irony; I have argued that either reading destabilizes the Ahab-Ishmael contrast, but a stylistic study of the narrator's use of providential vocabulary elsewhere would be a better test than I could make.\n\nWhether Starbuck's Quakerism is doing theological work beyond local colour, beyond the explicit narrator's comments on \"fighting Quakers\", is a question I could not answer from peer-reviewed sources.\n\nFinally, the question the novel leaves in the reader's lap: whether a theology that cannot be tested against the world, and a skepticism that cannot be lived in without a darker fixed point, are the only two options the book can imagine. Pip's vision of an indifferent, omnipresent God suggests a third, and it is the one the book does not let anyone use.\n\n## Sources\n\n[1] Melville, Herman. *Moby-Dick; or, The Whale* (New York: Harper, 1851). Full text, Project Gutenberg, ebook no. 2701. https://www.gutenberg.org/ebooks/2701 (text file https://www.gutenberg.org/cache/epub/2701/pg2701.txt). Accessed 2026-10-24. Primary text; the scenes and speeches quoted are from the chapters \"The Chapel\" and \"The Sermon\" through the Epilogue. Gutenberg's edition is a transcription and not the Northwestern-Newberry critical text; no passage quoted depends on a disputed reading that I know of.\n\n[2] Herbert, T. Walter, Jr. \"Calvinism and Cosmic Evil in *Moby-Dick*.\" *PMLA* 84, no. 6 (October 1969): 1613-1619. DOI 10.2307/1261508. Abstract page, Cambridge University Press: https://www.cambridge.org/core/journals/pmla/article/calvinism-and-cosmic-evil-in-mobydick/37A1411E0C19F82320F25771BC757462. Accessed 2026-10-24. Abstract read; full article not read.\n\n[3] Herbert, T. Walter, Jr. *Moby-Dick and Calvinism: A World Dismantled* (New Brunswick, N.J.: Rutgers University Press, 1977). Catalog record, https://bemis.marmot.org/Record/.b13073254, and *Partisan Review* 44, no. 2 (1977) book notice, https://www.bu.edu/partisanreview/books/PR1977V44N2/HTML/files/assets/basic-html/page2.html. Accessed 2026-10-24 (via search summary of both pages). Book itself not read.\n\n[4] Thompson, Lawrance. *Melville's Quarrel with God* (Princeton: Princeton University Press, 1952; Princeton Legacy Library reissue 2016). Publisher page: https://press.princeton.edu/isbn/9780691650357. Accessed 2026-10-24. Publisher's description read; book not read. Thesis summarized from the publisher, not from independent review.\n\n[5] Murray, Henry A. \"In Nomine Diaboli.\" *The New England Quarterly* 24 (1951): 435-452; reprinted in *Moby-Dick Centennial Essays* (Dallas: Southern Methodist University Press, 1953), and in *Endeavors in Psychology* (New York: Harper & Row, 1981). Repost used for reading: https://www.thetedkarchive.com/library/henry-murray-in-nomine-diaboli (a reposting site of uncertain editorial standing; publication details taken from the page's own bibliographic note). Accessed 2026-10-24. I have attributed to Murray only what that page's text supports and have not treated the repost as a substitute for the journal version.\n\n[6] Hawthorne, Nathaniel. Notebook entries on Melville's November 1856 visit (Liverpool and Southport). (a) Abridged published version: *Passages from the English Notebooks* (1870), Project Gutenberg, https://www.gutenberg.org/ebooks/7877 and related volumes; the entry beginning \"A week ago last Monday, Herman Melville came to see me at the Consulate\" includes \"reason of Providence and futurity\", accessed 2026-10-24. (b) Fuller wording (\"pretty much made up his mind to be annihilated\"; \"neither believe, nor be comfortable in his unbelief\"): quoted from the notebook entry of 20 November 1856 in a blog post that says it took the passage from Charles Olson's *Call Me Ishmael*, https://biblioklept.org/2012/06/08/nathaniel-hawthorne-on-herman-melvill
