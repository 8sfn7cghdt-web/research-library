ific doctrine of providence; both treat him as a visionary. The sharpening of the question into *did he believe in a governing God and, if not, did he hate one* belongs to the generation that followed.\n\n## The Mid-Century Theologies: 1941 to 1952\n\nFour books of the 1940s and early 1950s define the modern argument. F. O. Matthiessen's *American Renaissance* (Oxford, 1941) read Melville, with Hawthorne, Emerson, Thoreau and Whitman, as a fully literary and democratic artist, and found in his Shakespearean borrowings the means to a tragic form; the reference account notes Matthiessen's attention to Shakespeare's influence and to Melville's link with Hawthorne [5]. By *tragic* he did not mean *nihilistic*: Ahab's fall is the fall of a magnificent will, and the novel's rhetorical and moral magnitude derives from the democratic setting of a pagan-Christian crew. Charles Olson's *Call Me Ishmael* (Reynal and Hitchcock, 1947) pushed the Shakespearean thesis, arguing that Melville's reading of *King Lear* reshaped the book, and is credited with an early form of the \"two *Moby-Dicks*\" theory, that the novel was substantially recast in composition; it also read the whaling of the Pacific as a figure of American space and conquest [7]. Olson's book, as I know it from these descriptions and not from a fresh reading, is not centrally theological, but it supplied the epigraph evidence for the providence debate, since it prints the passage from Hawthorne's journal discussed below [8].\n\nTwo works supplied the biblical and doctrinal evidence. Nathalia Wright's *Melville's Use of the Bible* (Duke University Press, 1949; some sources give 1948) is the classic inventory of Melville's scriptural imagery, character types, themes and style, in chapters on each; one secondary account says she found his engagement with scripture more mythological than theological [9]. Her book matters to the providence debate as a baseline: it shows how deeply Melville drew on the Bible, especially Job, Jonah, Ecclesiastes and the prophets, while leaving open whether he drew on it as a believer, a skeptic or an ironist. William Braswell's *Melville's Religious Thought* (Duke, 1943), listed in the standard bibliography of general criticism alongside Wright, Matthiessen, Olson and Thompson, shows how quickly religion had become the field's organizing topic [10]. Henry A. Murray's essay \"In Nomine Diaboli\" appears in the Bloom anthology alongside Olson's *Call Me Ishmael* [7]; I did not find a source verifying the date or the argument, and from my own background knowledge I recall Murray reading Ahab through a psychology of Manichean dualism, which is unverified here and should be checked. The point for this chapter is only that the psychological reading entered here, and that Murray's name is attached, through the Henry Murray Endowment (begun 1990), to the Melville Society's institutional life [11].\n\nThen came Lawrance Thompson's *Melville's Quarrel with God* (Princeton University Press, 1952). Princeton's description gives the argument precisely: Melville, hiding his agonized conviction of divine cruelty and malice, satirized Christian doctrine through \"literary deceptions\" that \"could simultaneously hoodwink and satirize the point of view\" of his orthodox readers [12]. A quotation circulating in the secondary literature has Thompson saying that \"Melville's entire artistic contrivance in Moby Dick is his own esoteric and cabalistic commentary on God\" [12]. The critical move is the key to the evidentiary base. Thompson's warrant is not what the text says but what it conceals; where the text seems orthodox, that is the mask. A contemporary reviewer in the *Psychoanalytic Quarterly* (C. P. Oberndorf, 1953, vol. 22, pp. 443-45) reviewed it; I could not read the review [12]. A later scholar objected that the method relies on \"insinuated\" meaning and is \"highly speculative and frequently misleading\" [12], though the snippet I saw did not name the objector. What can be said securely is that a later overview describes a few decades of work as having \"defined themselves against\" Thompson's formulation, citing Robert Milder's *Exiled Royalties* among its examples [13] (the overview also names an essay by Parker called \"Character of Vine,\" but I could not locate any such essay in the bibliographies I searched, and the sources I could consult do not establish what Parker argues there, so I do not rely on it); and that Milder places *Clarel* in a more secular, psychological register, finding its \"faith\" to be not in God or immortality but in aspiration [13].\n\n## The Schools and What They Rest On\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 450\" role=\"img\" aria-label=\"Matrix of six schools of reading Melville on providence against five bodies of evidence. Filled circle is the body the school chiefly rests on; open circle is a secondary or contested warrant. Believer: the career, with Ahab's speeches secondary. Quarreling theist: the hidden pattern, with Ahab and letters secondary. Agnostic: the career and the letters. Nihilist: the narrator's voice, Ahab secondary. Ironist: the narrator's voice, the career secondary. Mystic: the career, with narrator and letters secondary.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif\" letter-spacing=\"2\">SIX SCHOOLS, FIVE KINDS OF EVIDENCE<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">the quarrel follows the choice of evidence, not the depth of learning (ch. 05)<\/text>\n<rect x=\"244\" y=\"64\" width=\"80\" height=\"44\" rx=\"2\" class=\"f-t1\"/>\n<text x=\"284\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">Narrator's<\/text>\n<text x=\"284\" y=\"97\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">voice<\/text>\n<rect x=\"332\" y=\"64\" width=\"80\" height=\"44\" rx=\"2\" class=\"f-t2\"/>\n<text x=\"372\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">Ahab's<\/text>\n<text x=\"372\" y=\"97\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">speeches<\/text>\n<rect x=\"420\" y=\"64\" width=\"80\" height=\"44\" rx=\"2\" class=\"f-t3\"/>\n<text x=\"460\" y=\"91\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">The career<\/text>\n<rect x=\"508\" y=\"64\" width=\"80\" height=\"44\" rx=\"2\" class=\"f-t4\"/>\n<text x=\"548\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">Biography<\/text>\n<text x=\"548\" y=\"97\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">&amp; letters<\/text>\n<rect x=\"596\" y=\"64\" width=\"80\" height=\"44\" rx=\"2\" class=\"f-t5\"/>\n<text x=\"636\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">Hidden<\/text>\n<text x=\"636\" y=\"97\" text-anchor=\"middle\" font-size=\"10\" class=\"t-inv\" font-weight=\"bold\">pattern<\/text>\n<rect x=\"16\" y=\"120\" width=\"668\" height=\"40\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"30\" y=\"139\" text-anchor=\"start\" font-size=\"12\" class=\"t-serif\" font-weight=\"bold\">Believer<\/text>\n<text x=\"30\" y=\"153\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">Billy Budd, late poems<\/text>\n<circle cx=\"372\" cy=\"140\" r=\"8\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<circle cx=\"460\" cy=\"140\" r=\"10\" class=\"f-t3\"/>\n<rect x=\"16\" y=\"166\" width=\"668\" height=\"40\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"30\" y=\"185\" text-anchor=\"start\" font-size=\"12\" class=\"t-serif\" font-weight=\"bold\">Quarreling theist<\/text>\n<text x=\"30\" y=\"199\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">Thompson<\/text>\n<circle cx=\"372\" cy=\"186\" r=\"8\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<circle cx=\"548\" cy=\"186\" r=\"8\" fill=\"none\" class=\"s-t4\" stroke-width=\"2.5\"/>\n<circle cx=\"636\" cy=\"186\" r=\"10\" class=\"f-t5\"/>\n<rect x=\"16\" y=\"212\" width=\"668\" height=\"40\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"30\" y=\"231\" text-anchor=\"start\" font-size=\"12\" class=\"t-serif\" font-weight=\"bold\">Agnostic<\/text>\n<text x=\"30\" y=\"245\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">Milder<\/text>\n<circle cx=\"460\" cy=\"232\" r=\"10\" class=\"f-t3\"/>\n<circle cx=\"548\" cy=\"232\" r=\"10\" class=\"f-t4\"/>\n<rect x=\"16\" y=\"258\" width=\"668\" height=\"40\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\" stroke-dasharray=\"4 3\"/>\n<text x=\"30\" y=\"277\" text-anchor=\"start\" font-size=\"12\" class=\"t-serif\" font-weight=\"bold\">Nihilist<\/text>\n<text x=\"30\" y=\"291\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">a tendency, no named critic<\/text>\n<circle cx=\"284\" cy=\"278\" r=\"10\" class=\"f-t1\"/>\n<circle cx=\"372\" cy=\"278\" r=\"8\" fill=\"none\" class=\"s-t2\" stroke-width=\"2.5\"/>\n<rect x=\"16\" y=\"304\" width=\"668\" height=\"40\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"30\" y=\"323\" text-anchor=\"start\" font-size=\"12\" class=\"t-serif\" font-weight=\"bold\">Ironist<\/text>\n<text x=\"30\" y=\"337\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">largest in practice<\/text>\n<circle cx=\"284\" cy=\"324\" r=\"10\" class=\"f-t1\"/>\n<circle cx=\"460\" cy=\"324\" r=\"8\" fill=\"none\" class=\"s-t3\" stroke-width=\"2.5\"/>\n<rect x=\"16\" y=\"350\" width=\"668\" height=\"40\" rx=\"2\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"30\" y=\"369\" text-anchor=\"start\" font-size=\"12\" class=\"t-serif\" font-weight=\"bold\">Mystic<\/text>\n<text x=\"30\" y=\"383\" text-anchor=\"start\" font-size=\"9\" class=\"t-muted\" font-style=\"italic\">Weaver's mariner and mystic<\/text>\n<circle cx=\"284\" cy=\"370\" r=\"8\" fill=\"none\" class=\"s-t1\" stroke-width=\"2.5\"/>\n<circle cx=\"460\" cy=\"370\" r=\"10\" class=\"f-t3\"/>\n<circle cx=\"548\" cy=\"370\" r=\"8\" fill=\"none\" class=\"s-t4\" stroke-width=\"2.5\"/>\n<circle cx=\"250\" cy=\"404\" r=\"8\" class=\"f-t1\"/>\n<text x=\"266\" y=\"408\" text-anchor=\"start\" font-size=\"9.5\">chief warrant<\/text>\n<circle cx=\"360\" cy=\"404\" r=\"7\" fill=\"none\" class=\"s-t1\" stroke-width=\"2.5\"/>\n<text x=\"376\" y=\"408\" text-anchor=\"start\" font-size=\"9.5\">secondary or contested<\/text>\n<rect x=\"508\" y=\"397\" width=\"22\" height=\"14\" rx=\"2\" fill=\"none\" class=\"ln\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"/>\n<text x=\"538\" y=\"408\" text-anchor=\"start\" font-size=\"9.5\">tendency, unverified<\/text>\n<text x=\"350\" y=\"434\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">The grouping is the corpus author's scheme of convenience; no single scholar uses it.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> The six readings of Melville&#8217;s providence disagree less about what he believed than about which evidence to trust. The ironist and the nihilist stand on the narrator&#8217;s voice, the believer, agnostic and mystic on the career, the quarreling theist on a hidden pattern, and the agnostic alone leans equally on the letters. Because the warrants overlap, an ironist and an agnostic can read the same Hawthorne passage and reach different verdicts.<\/figcaption>\n<\/figure>\n\n\nReduced to their evidentiary bases, the interpretations of Melville on providence fall into six families. The reduction is mine, a scheme of convenience that no single scholar uses, and every scholar named below fits some schools better than others.\n\nThe **believer** reading holds that Melville remained within, or returned to, a recognizably Christian vision, with *Billy Budd* and the late poems as the evidence. Its warrant is the late career and the reading of Vere and Billy as a Christian pattern of sacrifice. The first Billy Budd critics, 1921-46, largely read the novella as Melville's \"testament of acceptance,\" as Hayford and Sealts put it in their introduction to the 1962 edition [14]. A believer reading is not naive; it requires that *Moby-Dick* be read as a book about the dangers of a pride that rejects providence. Its weakness is Hawthorne's testimony and the novel's own cold treatment of Ahab's critics.\n\nThe **quarreling theist** reading, whose archetype is Thompson, holds that Melville believed in God and hated what he believed in. Its warrant is the hidden-meaning method and the pattern of Job-like complaint. The strength of the position is that it explains why a man so obsessed with God's governance wrote with such fury; the weakness, noted above, is its dependence on interpretation by suspicion. It is also, in a way Thompson did not argue, the position closest to Hawthorne's report, which describes a man who \"can neither believe, nor be comfortable in his unbelief\" [15].\n\nThe **agnostic** reading, associated in recent scholarship with Robert Milder's work, holds that Melville was neither a believer nor a hater but a man who could not settle the question and made literature of the unsettlement [13][16]. Milder's *Exiled Royalties: Melville and the Life We Imagine* (Oxford University Press, 2006) treats his spiritual, psychological and vocational life as central, with chapters on agnostic spirituality in *Clarel* and a title essay from Ishmael's description of Ahab's inner depths as a figure of Melville's own sense of spiritual disinheritance [16]. The agnostic reading's warrant is the whole career and the letters; it has the advantage of agreeing with Hawthorne without needing a secret. Its weakness is that it can sound like a refusal to say.\n\nThe **nihilist** reading holds that the novel finally discloses a meaningless cosmos, and that Ahab's and Ishmael's competing interpretive acts are doomed. Its warrant is the doubloon chapter, the \"whiteness of the whale\" and the ending. I did not find a specific modern source for this school in my searches and treat it as a tendency, associated in the popular mind with existentialist readings of the mid-century, not as a documented school; a reader should treat any attribution of it to a named critic here as unverified. The ending, in which the crew dies and Ishmael alone survives, is evidence for and against: if the survivor is a figure of grace, providence reappears; if survival is accident, it does not.\n\nThe **ironist** reading holds that Melville's own stance is consistently ironic and that the novel stages positions, none of which it endorses. Its warrant is the narrator's rhetoric, tone and structure. This school is the largest in practice and the hardest to name, since most contemporary critics are ironists by method without being nihilists by conclusion. Its Billy Budd form, in which Vere's rationalization and the narrator's apparent deference to it are read as irony, emerged in the 1950s: Joseph Schiffman's 1950 reading cast Vere as an autocratic figure, Richard Harter Fogle asked the question as \"Billy Budd: Acceptance or Irony\" in 1958, Milton Stern's *The Fine Hammered Steel of Herman Melville* appeared in 1957, and Withim's \"Testament of Resistance\" followed in 1959 [14]. A third position denies that any single meaning can be extracted [14]. Hershel Parker's *Reading Billy Budd* (1990) takes a different tack, criticizing Weaver's editorial errors and arguing about the manuscript's state, which complicates the use of the novella as evidence for either acceptance or irony [5]; I did not read it for this chapter.\n\nThe **mystic** reading holds that Melville's religion was a mystical or visionary quest, outside creed. It descends from Weaver's \"mariner and mystic\" and from the Emersonian and Transcendentalist context, and its evidence is the visionary chapters, the Platonic strain, the \"mystic\" material in the *Mardi* years. It is the revival's frame and survives in some biographical writing. Its weakness is that \"mystic\" can name almost anything, and the Hawthorne journal's phrase \"too honest and courageous\" implies a man pressed toward a determinate belief, which is not a mystic's posture [15].\n\nThese schools do not exhaust the field. The warrants overlap: an ironist reads the same Hawthorne passage as an agnostic does, and a believer uses the same Job material as a quarreling theist. The most useful way to read the debate is to ask of each critic which of five bodies of evidence they privilege: the narrator's voice, Ahab's speeches, the career (especially *Billy Budd* and *Clarel*), the biography and letters, or the hidden pattern. The disagreements among scholars follow that choice more reliably than they follow any difference in learning.\n\n## The Hawthorne Friendship and the November 1856 Report\n\nNo single document has carried more interpretive weight than Hawthorne's journal entry for 20 November 1856, written after a walk with Melville near Liverpool and preserved in the *English Notebooks* (the Morgan Library catalogs the notebook, MA 586, as covering June 1856 to May 1857, which includes that date) [15][17]. Hawthorne records that Melville had \"pretty much made up his mind to be annihilated,\" yet did not rest in the view; that \"he can neither believe, nor be comfortable in his unbelief\"; that he was \"too honest and courageous not to try to do one or the other\"; and that \"if he were a religious man, he would be one of the most truly religious and reverential\" [15]. I quote these from a blog that cites the passage as printed in Olson's *Call Me Ishmael*, because the Morgan page was inaccessible; the passage is also reproduced in a McMaster University thesis that turned up in my search [15]. Hawthorne's testimony is Tier 1 evidence for what Hawthorne said Melville said and thought, and it is the nearest thing in the record to a contemporary statement of Melville's religious position. It is also, notably, secondhand, filtered through a friend who was temperamentally sympathetic and who may have read his own reticence into Melville's restlessness.\n\nThe passage is the evidentiary center of the agnostic school, which treats it as accurate and complete; the quarreling-theist school treats it as accurate but incomplete (the *annihilation* talk being the mask); the ironist treats it as one performance among several. It is also the strongest single check on the nihilist school, since a man who had decided that nothing mattered would not, on Hawthorne's account, be restless. Counter-argument: a restless nihilist is not a contradiction; the restlessness might simply be the unfinished business of a lost faith.\n\nThe wider friendship supplies two more pieces of evidence that I know from the standard biographies and have not re-fetched here. In August 1850 Melville published \"Hawthorne and His Mosses\" in the *Literary World*, praising Hawthorne's \"blackness\" and the vein of darkness behind the sunlit surface; and *Moby-Dick* is dedicated to Hawthorne \"in token of my admiration for his genius.\" In a letter of November 1851 Melville told Hawthorne he had written a \"wicked book.\" Whether the word is to be taken literally, as a confession of the novel's heterodoxy, or playfully, is one of the small cruxes of the debate: Thompson's school reads it literally, an ironist school as banter between friends. These claims rest on the printed correspondence (the Northwestern-Newberry *Correspondence*, ed. Lynn Horth, 1993; I did not consult it for this chapter) and should be checked against it before citation [18]. The 1856 meeting was one of the last times the two men saw each other, a detail repeated in secondary sources but not independently verified here [15].\n\n## The Calvinist Turn and the Cultural Critics, 1970s to the 1990s\n\nThe next decisive move was to relocate the quarrel from Melville's private psychology into a historical theology. T. Walter Herbert's *Moby-Dick and Calvinism: A World Dismantled* (Rutgers University Press, 1977, 186 pp.) is the principal vehicle [19]. I could confirm the book's existence, imprint and subject headings, and a 1980 *American Studies* letter in which Herbert said that he had put forward \"a directly contrary view\" to an allegorical interpretation and that two chapters present a view of the book's form, language and meaning that opposes allegorical reading [19]. What I could not retrieve is the book's argument in Herbert's own words; from my own background knowledge it reads Melville's Calvinist inheritance, the Dutch Reformed and Presbyterian world of his family, as the structure that the novel dismantles, and treats Ahab's quarrel as a version of the Calvinist problem of an inscrutable sovereign. That summary is not sourced here and should be confirmed. The significance for this chapter is methodological: Herbert's book contests Thompson's allegorical method while keeping theology central, shifting the warrant from hidden irony to the historical vocabulary Melville inherited.\n\nSacvan Bercovitch's work belongs in this line indirectly. His early books, *The Puritan Origins of the American Self* and *The American Jeremiad*, argued for scriptural typology and for a continuity from Puritan rhetoric to later national self-definition, and critics faulted him for overlooking the Puritans' spiritual and moral values [20]. A volume of essays on his work includes a chapter on cosmopolitanism and Zoroastrianism in *Moby-Dick* by Cyrus R. K. Patell [20], which shows that the Bercovitch school has engaged the novel, but I did not find Bercovitch's own reading of Ahab, and I do not here assert one. Ann Douglas's *The Feminization of American Culture* (1977) casts Melville as a casualty of a sentimentalized, liberal Protestant culture that was displacing the harder Calvinist inheritance; this is from my own knowledge of the book, which I could not source in these searches, and which I mark as an unread-here attribution. Her place in this chapter is to mark the Calvinism-versus-sentiment axis on which Melville's providence was read in the 1970s.\n\nTwo scholars of the 1990s and 2000s then reset the debate from different directions. Hershel Parker's two-volume *Herman Melville: A Biography* (Johns Hopkins University Press, 1996 and 2002) is the standard life [5], and the object of Parker's long argument that Melville's books must be read from the manuscript, their composition, and the life together; Parker's long scholarly quarrel with interpretation-by-secret-code makes him a natural opponent of Thompson's method, though I could not confirm a specific Parker essay aimed at Thompson. Andrew Delbanco's *Melville: His World and Work* (Knopf, 2005, 415 pp.) is a literary biography in which, according to the publisher's description, spiritual preoccupations build toward and beyond *Moby-Dick* [21]. In a 2002 lecture at Boston College's Boisi Center that previews the book, Delbanco argued that Melville was preoccupied with the human capacity for cruelty and the human appetite for belief [21]. That formulation is notable because it relocates providence from God to the believer: the question is less what God does than what people need. Milder's *Exiled Royalties* (2006), discussed above, stands with Delbanco's as the dominant mainstream interpretation of the 2000s, in which Melville's theology is not a doctrine to be recovered but a condition to be inhabited [16]. Wyn Kelley's *Melville's City* (1996) and *Herman Melville: An Introduction* (2008), and Samuel Otter's *Melville's Anatomies* (1999), represent the cultural-historical and body-centered strain; I know these from my own reading of the field and cite them as figures not researched directly here.\n\n## Race, Empire, Ecology, Queerness, and the Post-Secular\n\nSince the 1980s, much of the energy has moved away from the providence question narrowly conceived, and the current field is best described as one in which the theological question has been absorbed into others. Race and empire: the University of Kansas hosted a mini-symposium, \"Melville and Race,\" for the 2019 bicentennial [22], and a 2018 National Park Service lecture series in San Francisco tied *Moby-Dick* to the Fugitive Slave Act of 1850 and read the novel in the shadow of climate change [23]. Among the major book-length statements here are Carolyn Karcher's *Shadow Over the Promised Land* (1980) and Michael Rogin's *Subversive Genealogy* (1983), which I know from the field and have not read for this chapter; their relevance is that they read Ahab's will, and the ship as a figure of an American empire, without making God the issue. Ecological readings treat the whale and the sea as the novel's moral center and read Ahab's hubris as an environmental drama; I found no single source to anchor a statement of the best-known example and so say only that the strain exists in the programming described below. Queer readings, a tradition that includes Robert K. Martin's *Hero of the Heart* (1979), are currently prominent: *Leviathan* 27.3 (October 2025) is a special issue on queer Melvilleana [24]. I found no source for an identifiable \"post-secular\" school of *Moby-Dick* criticism; the term may be fairly applied to Delbanco and Milder's treatment of belief as a human need and condition, but that is my own classification, not a field label.\n\nWhat happens to providence in these approaches? It is displaced into other registers. In race-and-empire criticism it becomes the ideology of Manifest Destiny, a providential story about an American mission that the novel exposes as a rationalization for conquest; in this register Ahab's monomania is the mirror image of a providentialism that was already national. In the ecological register it becomes the question whether the cosmos has any moral order that human beings can violate. In the queer register it becomes largely a question of which relations the novel makes possible. These are my own glosses on the field's drift and not claims about particular books, and a reader should treat them as hypotheses. The risk the displacement carries is that the founding question, whether Melville thought the universe was governed, disappears under the weight of the new ones; the opportunity is that the older readings' unexamined premise, that \"God\" is the only name for providence, is dissolved.\n\n## The Field Today: Institutions and Dated Facts\n\nThe Melville Society, which I recall as founded in the 1940s (a date I did not source), is the field's learned society, and its present activities are documented on its own site. The Society's journal, *Leviathan: A Journal of Melville Studies*, is published by the Johns Hopkins University Press three times a year; its page lists issue 27.3 (October 2025) as the latest, a special issue on queer Melvilleana [24][25]. The Society's editorial-staff page names Jennifer Greiman as editor, Tom Nurmi as associate editor, Melissa Gnidek as book-review editor and Mary K. Bercaw Edwards as extracts editor; the only date on the page is a 2021 copyright footer, so these names may be dated, and a separate search summary of the Hopkins Press page also gave Greiman as editor, with Volume 27 (2025) [26][27]. Special issues have included Melville's late writings, digital analyses of his marginalia, artistic responses to *Moby-Dick*, and the completion of the Northwestern-Newberry edition; issue 25.3, \"Melville in Public,\" is reported to have won the Council of Editors of Learned Journals' \"Best Special Issue\" at the 2025 MLA convention (a claim from the Society's own publicity, not independently confirmed) [25][28]. The Society's International Melville Conference has met biennially since 1997; its page lists Volos (1997), Mystic (1999), Hofstra (2001), Lahaina (2003), New Bedford (2005, on Douglass and Melville), Szczecin (2007), Jerusalem (2009), Rome (2011, \"Empire - Democracy - Belief - Art\"), Washington (2013), Tokyo (2015), London (2017), New York (2019, \"Melville's Origins\"), Paris (2022, \"Melville's Energies\"), and Oceanic Melville at the University of Connecticut's Avery Point campus, 16-19 June 2025, which the page still listed as \"upcoming\" when I read it on 24 October 2026, a sign that the page lags events [29]. The Society's Cultural Project, working with the New Bedford Whaling Museum since 2000, runs an annual January *Moby-Dick* Marathon, and a 2025 National Endowment for the Humanities grant of $196,290 funded a teacher institute on *Moby-Dick* and whaling [28].\n\nThe standard scholarly text is the Northwestern-Newberry Edition of *The Writings of Herman Melville*, begun in 1965-68 under Harrison Hayford, with Hershel Parker and G. Thomas Tanselle as general editors, published by Northwestern University Press and the Newberry Library, which holds the editorial archive. Publisher and bookseller listings call the edition complete in fifteen volumes, with the last appearing in 2017 or in time for the bicentennial; volume numbering of the last books is reported inconsistently across the sources I found, so I give the count and the completion date with those reservations [30]. The Society's journal lists \"completion of the Northwestern-Newberry edition\" among its special-issue topics, which independently supports the claim of completion [25]. The Library of America marked the bicentennial with *Complete Poems* (an interview dated 23 September 2019), edited by Hershel Parker, whom the page names general editor of the final two volumes of the Northwestern-Newberry edition; it is the fourth and final volume of the Library's Melville edition, after *Typee, Omoo, Mardi* (1982), *Redburn, White-Jacket, Moby-Dick*, and the volume containing *Pierre*, *Israel Potter*, *The Piazza Tales*, *The Confidence-Man*, *Billy Budd* and uncollected prose [31].\n\nThe bicentennial itself, Melville's 200th birthday on 1 August 2019, was marked at several levels. In Pittsfield the Berkshire County Historical Society ran a day-long program at the Berkshire Athenaeum's Melville Memorial Room and at Arrowhead, Melville's farmhouse, including a Literary Landmark plaque dedication and a fundraising benefit for restoring the 1840 red barn, and screened the documentary *The Act of Reading* in the barn on 3 July with Melville's great-great-grandson Peter Whittemore attending [32]. The Twelfth International Melville Conference ran 17-20 June 2019 in New York and inaugurated the Society's Travel Grant Fund [33]. A Baltimore newspaper marked the city's role in the revival [34]. And the Pittsfield *Moby-Dick* read-a-thon at Arrowhead, founded in 2016 by Jana Laiz, was in its tenth year in 2026, running 30 July to 2 August of that year, according to a WAMC report dated 16 July 2026 [35]. The same report says Melville wrote the book at Arrowhead over eighteen months from 1850 and that he wrote \"the entire book\" at his desk there; the Berkshire composition of most of the novel is not in doubt, but the \"entire book\" claim is a local tradition that I could not check against the biographies, and it should be read as such [35].\n\n## Where the Evidence Leans\n\nOn the narrow historical question, what the early reviewers thought, the evidence is secure: the book was received as eccentric, learned, powerful and in places irreverent, and the providential question was not what the reviewers asked [1][2]. On the reception history, the revival's frames, mystic and prophet, are better documented than any of the later schools' claims about hidden irony [4][5][6]. On the central interpretive question, the weight of the recent scholarship favors a version of the agnostic reading: Hawthorne's report, the career's long unsettlement, and the post-Thompson distrust of hidden-meaning methods point the same way [13][15][16]. This is a judgment of weight, not of proof. The strongest case against it is that agnosticism is exactly what a reader would conclude if he had refused to take seriously a writer who said he was writing a \"wicked book\" and who built a whole fiction on a quarrel with the order of things, and the Thompson school's best reply is that the refusal to name a position is a position. The disagreement about *Billy Budd*, acceptance or irony, is a miniature of the whole: a short text, a contested manuscript, and a record that supports both readings, which is why it has not been resolved in seventy years [14]. By my own reading, the debate persists because it is partly a debate about what kind of evidence a literary text is: a man's belief expressed, a character's belief dramatized, or a puzzle left on purpose.\n\n## Open Questions\n\nWhether the \"quarrel with God\" thesis has any recoverable core once its method is rejected remains unsettled: one may accept that Melville raged at a governing God without accepting that he encoded the rage. Whether Hawthorne's 1856 report is representative of Melville in 1851, when he wrote the novel, or only of a man five years on and weary after the failure of *Pierre* and *The Confidence-Man* is not established; the report is evidence for 1856, and its extension backward is inference. Whether the displacement of providence into race, empire and ecology is a deepening or an evasion is a live methodological dispute. The completeness of the Northwestern-Newberry edition's volume count and its present status should be confirmed against the publisher's own catalog, and the Leviathan editorial roster should be confirmed against the current masthead. Finally, no reliable sources were found on a distinct \"post-secular\" or \"nihilist\" school, and a treatment of either would need primary scholarly sources.\n\n## Sources\n\n1. \"Check Out the Original 1851 Reviews of Moby-Dick,\" Literary Hub. https://lithub.com/check-out-the-original-1851-reviews-of-moby-dick/ (accessed 2026-10-24). Reprints excerpts of the *Morning Advertiser*, *Athenaeum*, *John Bull*, *Albion*, *Harper's*, *Literary Gazette* and *Democratic Review* notices. Tier 5 (reprints of Tier 1 documents).\n2. \"Melville's Moby Dick: Contemporary Reviews and Sales Figures,\" Old Salt Blog, excerpting the Melville Electronic Library. https://oldsaltblog.com/contemporary-reviews-and-sales-of-melvilles-moby-dick/ (accessed 2026-10-24). Tier 5-6; sales figures not verified against melville.org.\n3. Search-surfaced scholarly summary of Duyckinck's *Literary World* review, 15 and 22 November 1851, pp. 381-83 and 403-4; identity of the summarizing article not confirmed (accessed 2026-10-24). Tier 5; single-source.\n4. \"The Melville Revival,\" Grolier Club exhibition, *Billy Budd*. https://grolierclub.omeka.net/exhibits/show/billy-budd/melville-revival (accessed 2026-10-24). Tier 2.\n5. \"Melville Rediscovered,\" EBSCO Research Starters. https://www.ebsco.com/research-starters/literature-and-writing/melville-rediscovered-major-american-novelist (accessed 2026-10-24). Tier 5.\n6. \"This Week in Nation History: How We Helped Start the Melville Revival of the 1920s,\" *The Nation*. https://www.thenation.com/article/archive/week-nation-history-how-we-helped-start-melville-revival-1920s/tnamp/ (accessed 2026-10-24). Tier 4-5 (retrospective by an interested outlet).\n7. Charles Olson, *Call Me Ishmael* (Reynal and Hitchcock, 1947), as described in Williams College searchable sea-literature entry, https://sites.williams.edu/searchablesealit/o/olson-charles/, and Project MUSE listing of Bloom's 1986 Chelsea House anthology (Olson and Henry A. Murray, \"In Nomine Diaboli\") (accessed 2026-10-24). Tier 5; books not read.\n8. Biblioklept, \"Nathaniel Hawthorne on Herman Melville,\" 8 June 2012, citing
