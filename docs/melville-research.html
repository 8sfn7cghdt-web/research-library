via search summary. Tier 5 (unpublished thesis); cited only for the Promethean/Job reading it advances.\n\n[11] Milder, Robert. *Exiled Royalties: Melville and the Life We Imagine* (New York: Oxford University Press, 2006). Publisher and catalog descriptions: https://bookculture.com/book/9780195339109 and library records (e.g., https://english.washu.edu/node/13559), accessed 2026-10-24. Descriptions read; book not read.\n\n[12] Delbanco, Andrew. *Melville: His World and Work* (New York: Knopf, 2005). Catalog and publisher descriptions; a Boisi Center (Boston College) 2002 lecture note: https://www.bc.edu/content/bc-web/centers/boisi-center/events/archive/spring-2002/melville.html. Accessed 2026-10-24. Book not read.\n\n[13] Parker, Hershel. *Herman Melville: A Biography*, 2 vols. (Baltimore: Johns Hopkins University Press, 1996, 2002). Press author page: https://press.jhu.edu/books/authors/hershel-parker. Accessed 2026-10-24. Existence and imprint only; not read.\n\n[14] Brodtkorb, Paul, Jr. *Ishmael's White World: A Phenomenological Reading of \"Moby Dick\"* (New Haven: Yale University Press, 1965). Review notice, *Review of Metaphysics* (1967), indexed at https://philpapers.org/rec/EIWW. Accessed 2026-10-24. Review summary read; book not read.\n\n[15] Olson, Charles. *Call Me Ishmael* (New York: Reynal and Hitchcock, 1947). Johns Hopkins University Press page https://www.press.jhu.edu/books/title/1262/call-me-ishmael and a Cambridge University Press chapter listing, https://www.cambridge.org/core/books/critical-situation/some-men-ride-on-such-space-charles-olsons-call-me-ishmael-the-melville-revival-and-the-american-baroque/BDE82807C11622C3EA1989BCD40C2BDE. Accessed 2026-10-24. Descriptions only.\n\n[16] Matthiessen, F. O. *American Renaissance: Art and Expression in the Age of Emerson and Whitman* (New York: Oxford University Press, 1941). Topic coverage from a 1941 review noted in a search summary, e.g., https://www.vqronline.org/node/9861. Accessed 2026-10-24. Book not read.\n\n[17] Melville, Herman. *Moby-Dick*, A Norton Critical Edition, 3rd ed., ed. Hershel Parker (New York: W. W. Norton, 2017/2018). Publisher and retailer listings, e.g., https://www.harvard.com/book/9780393285000. Accessed 2026-10-24. Listings give December 2017 (US) and September 2018 (UK) dates; I treat the edition as current in print without having confirmed with the publisher.\n\n[18] *Leviathan: A Journal of Melville Studies* (Melville Society; Johns Hopkins University Press). https://press.jhu.edu/journals/leviathan-journal-melville-studies and https://melvillesociety.org/leviathan. Accessed 2026-10-24. Project MUSE lists volume 28 (2026), numbers 1 and 2.\n\n[19] \"The Book of Job: A Whirlwind of Confusion,\" My Jewish Learning, https://www.myjewishlearning.com/article/the-book-of-job-a-whirlwind-of-confusion/. Accessed 2026-10-24 via search summary. Tier 5; cited for the standard split in readings of the whirlwind speech."}, {"order": 4, "file": "04_Providence_Across_The_Career.md", "title": "Providence Across the Career: Melville Before and After Moby-Dick", "summary": "", "body": "# Providence Across the Career: Melville Before and After Moby-Dick\n\n> ## Bottom Line\n>\n> Melville did not lose his faith in one stroke, and he did not recover it at the end. The best-supported reading is that he kept one question open for forty years: whether a governing intelligence stands behind events, and whether it is good. He asked it in different registers. In the early books he asked it through the missionaries' claim to speak for Providence. In the middle years he asked it through fatalism, ambiguity, and fraud. In his last years he asked it in verse and in an unfinished sea story. Hawthorne's 1856 diary line, that Melville \"can neither believe, nor be comfortable in his unbelief,\" is the nearest thing to a contemporary diagnosis and the arc bears it out. The acceptance and irony readings of Billy Budd each hold a true piece of this, and the manuscript's unfinished state means neither can be proved.\n\n## Why the Career Matters for the Question\n\nA reader who meets Melville only through Moby-Dick is liable to treat the novel as a verdict. Either Ahab is the madman who defies a benign order, or Ahab is the one honest man in a universe that answers a human demand for meaning with silence. Both readings are available inside the book, and the chapters of this study that treat the novel itself weigh them. This chapter asks a different question: what happened to the argument before the novel and after it?\n\nThe question has real stakes because the two most familiar pictures of Melville's life pull in opposite directions. The first picture is of a Calvinist-haunted young sailor who gradually lost his belief, wrote a great blasphemous book in 1851, and sank into bitter silence. The second picture is of an old customs inspector who, after decades of storm, came to a quiet acceptance, which he expressed in Billy Budd and in the last lines of Clarel. The first is a story of loss; the second is a story of homecoming. A third picture, which I defend below, treats the career as a long refusal to resolve the matter, in which the tone changes more than the question.\n\nI should state at the outset what kind of evidence supports each stage. For the novels and poems, the evidence is the public-domain text, which I have read in fetched editions and quote only briefly. For the letters, I rely on transcriptions of the correspondence that circulate online and on secondary descriptions, and I flag where I could not reach the standard scholarly text. For the late years, I rely on a smaller body of secondary scholarship, much of it fetched only as abstracts or publisher descriptions. The honest result is a chapter whose textual claims are firm and whose biographical and interpretive claims are, in places, provisional.\n\n## The Early Books: Providence as a Missionary's Claim\n\nTypee (1846) and Omoo (1847) are not metaphysical books, but they establish the form that Melville's later argument about providence would take. Their target is not God. It is the human habit of speaking on God's behalf. The American Protestant press understood this at once. A doctoral study of the reception reports that the first hostile notice of Typee appeared in the New York Evangelist on 9 April 1846, that within five months the publishers Wiley and Putnam issued a revised edition that removed some thirty-six pages critical of the Protestant missionaries, and that scholars dispute how far the Evangelist review caused that expurgation, with the study itself pointing to pressures in the publisher's personal circle as well as to sales [20]. I did not reach a source I could confirm for the further reports that a Protestant Churchman notice condemned a \"light, sneering, irreligious spirit\" in Omoo or that Margaret Fuller urged Tribune readers to consult Melville before giving money to the missions; the reader should treat both as unverified.\n\nThe pattern is worth stating carefully because it is easy to overread. Melville in 1846 was not arguing against divine governance. He was arguing that those who claim to be its agents are often vain, commercial, and cruel, and that the people they set out to save often live better without them. That is a critique of a theology as it is practiced. It leaves open whether there is a Providence the missionaries misrepresent. This is a position a pious reader could share, and many reformers did.\n\nWhite-Jacket (1850) carries the argument into the world of the American navy, and here Melville's use of providential language becomes a form of irony that he would keep for the rest of his career. In the chapter on flogging, which I read in the Project Gutenberg text, he writes that \"we Americans are the peculiar, chosen people—the Israel of our time,\" and that \"the political Messiah had come,\" and he adds that \"God has predestinated, mankind expects, great things from our race\" [7]. The passage is sincere and radical in intention. It is a patriotic argument that a nation chosen for liberty cannot flog its sailors. It is also an instance of a habit that matters for this study: Melville borrows the vocabulary of election, predestination, and Providence and applies it to a historical project. He asks whether the vocabulary can bear the weight. In the same book a chapter on the man-of-war's library speaks of the books \"put into our hands by Providence,\" and elsewhere the captain of the top, Jack Chase, says that \"Fate is Fate,\" while the narrator calls the ship's captain \"a slave to Fate, though supreme Captain of a frigate\" [7]. The ship is a closed world in which an absolute authority governs by decree, and Melville cannot help noticing that the master of the decree is himself governed. The man-of-war is a model of foreordination in which the foreordainer is bound.\n\nOne should not claim too much for these early books. They contain the vocabulary and the social-political reflex, and they do not yet contain a theology of doubt. It is Mardi that does.\n\n## Mardi (1849): The Metaphysical Quest\n\nMardi, and a Voyage Thither (1849) begins as a South Seas adventure and turns, at roughly the point where the narrator Taji rescues the maiden Yillah, into a philosophical allegory. Taji pursues Yillah across an archipelago of allegorical islands, and a company of Mardian philosophers and kings debate politics, art, death, and God. The book was a commercial failure, and it is the first place where Melville let the metaphysics run free.\n\nThe providence question enters through Babbalanja, the philosopher who is half possessed by a daemon named Azzageddi. In one chapter, which I read in a fetched text, Babbalanja distinguishes fatalism from necessity. \"Necessity,\" he says, \"holds that all events are naturally linked, and inevitably follow each other, without providential interposition, though by the eternal letting of Providence\" [6]. The sentence is worth a pause, and its last clause matters. It states a position in which events are wholly determined and need no particular interposition, but it does not say that no one governs the determination: the speaker keeps Providence in the background as the original \"letting.\" A reading that finds here a determinism with no governor goes beyond the text; what the sentence shows is an effort to reconcile necessity with Providence by pushing Providence back to the start. Elsewhere in the book the king Media waves off the philosopher's reasoning and tells him to drop his metaphysics [6]. The book thus stages the dialectic that Moby-Dick will later internalize: the speculative mind pushes toward a cosmos in which Providence has withdrawn from particular events, and the practical mind pushes back.\n\nThe book does not, however, end in necessity. Near its close, the pilgrims reach Serenia, a land that scholars generally read as an idealized Christian community, where the teaching attributed to Alma is a doctrine of love. In the fetched text, the teaching is reported as \"The Master's great command is Love\" [6]. A separate vision, in which a guide shows the narrator the origins of souls, is summed up in a sentence that complicates the consolation: \"Great Love is sad; and heaven is Love\" [6]. Melville gives this language real beauty. Yet Taji does not stay. The final chapter, as I read it, has the pursuers and the pursued flying on \"over an endless sea\" [6]. The structure is the clearest early statement of the pattern that the rest of the career will repeat. A consolation is offered, it is described with sympathy, and the questing mind leaves it behind.\n\nI could not find a scholarly source that reads Babbalanja's necessitarianism as an explicit engagement with Calvin's doctrine of foreordination, and I do not make that claim as established. What is established is the text. A plausible inference, which I label as my own, is that a young man raised, as I understand the biographical record (which I did not fetch), in a Dutch Reformed milieu, would hear in \"necessity\" set beside \"the eternal letting of Providence\" an echo of, or a quarrel with, the Calvinist formula in which every event is governed by hidden counsel.\n\n## Redburn and White-Jacket: Providence as Social Fact\n\nBetween Mardi and Moby-Dick, Melville wrote Redburn and White-Jacket (both 1849-50). I read only White-Jacket closely, and my remarks on Redburn rest on the public record and not on a fetched text. Both books seem to me to give providence a social shape. Redburn's boy narrator meets a Liverpool where destitution is as arbitrary as weather. In White-Jacket, the man-of-war's hierarchy is a counterfeit of divine order, with the captain as a god whose caprice the sailors endure. The books raise the suspicion that what believers call providential order may be, in part, a projection of human hierarchy. This is one of the live questions in the scholarship on the later fiction. It becomes sharper in Benito Cereno, where the character who believes in Providence is the one who is blind.\n\n## The Hawthorne Years, 1850-51: Blackness and the \"No! in Thunder\"\n\nThe decisive biographical event for this question is the friendship with Nathaniel Hawthorne, which began in the Berkshires in August 1850. Melville's essay \"Hawthorne and His Mosses,\" published in the Literary World on 17 and 24 August 1850, is the first document of it. I read the essay in the Eldritch Press transcription. It praises Hawthorne for a \"blackness\" that \"furnishes the infinite obscure of his background,\" and it traces the force of the darker tales to \"that Calvinistic sense of Innate Depravity and Original Sin\" [4]. The essay thus tells us how Melville read Hawthorne's darkness. He read it as theological: the residue of Calvinism in a writer who no longer believed in Calvin's God. A caution belongs here. The standard Northwestern-Newberry text of the essay differs from the version Melville printed in 1850, so any quotation should be checked against the edition used [4]; the transcription I read is the older printed one.\n\nMelville's own copy of Mosses from an Old Manse, now at Harvard's Houghton Library, bears the marginalia he made while preparing the essay [24]. That detail matters because it shows the \"blackness\" reading was not a passing flourish but the result of a close, annotated reading.\n\nThe famous \"No! in thunder\" passage belongs to the correspondence rather than to the essay. The phrase does not appear in the essay transcription. It is in a letter dated [April 16?] 1851, which I checked against a web transcription of the letter: \"There is the grand truth about Nathaniel Hawthorne. He says No! in thunder; but the Devil himself cannot make him say yes\" [5]. The same letter says that \"all men who say yes, lie,\" and it is where Melville writes that God \"cannot explain His own secrets.\" The transcription does not name its edition and the dating carries a question mark, so wording and date should still be checked against the Northwestern-Newberry Correspondence; a claim that the letter was first printed in Julian Hawthorne's 1884 biography of his parents, which reached me only second-hand, I leave aside. What the passage argues, in the form that circulates, is that the great spirit is the one who says No to the universe, because \"all men who say yes, lie.\" That is a remarkable thing to say in a letter to a man one is courting as a friend. It makes refusal the sign of honesty, and it prefigures the Ahab of Moby-Dick, who says No to the universe at the cost of his ship.\n\nThe months in which the novel was finished and published produced the best-known statements of Melville's religious mood. In a letter of June 1851, written while Moby-Dick was at press or just out, he complained of the pressure of the market, writing \"Dollars damn me\" [2]. The same letter compares his development to a seed from the Egyptian pyramids that, after \"being three thousand years a seed and nothing but a seed,\" developed in English soil, \"grew to greenness, and then fell to mould,\" and says he had no development until he was twenty-five [2]. The comparison touches providence because it describes a belated vitality produced by chance, but the seed also falls to mould, so it is no tale of simple flourishing.\n\nThe letter that most invites theological reading is dated November 1851, after Moby-Dick was published. In the transcription I read, Melville writes: \"I have written a wicked book, and feel spotless as the lamb.\" He adds that \"Ineffable socialities are in me,\" and then something more extraordinary: \"your heart beat in my ribs and mine in yours, and both in God's.\" The Godhead, he says, \"is broken up like the bread at the Supper, and that we are the pieces\" [1]. Two remarks are in order.\n\nFirst, the \"wicked book\" line has been quoted so often as a confession that its context is easily lost. Melville is not repenting. He is claiming innocence. The feeling he describes is contentment without hope or despair, and the sentence in which he calls the book wicked is also the sentence in which he calls himself \"spotless.\" The tone is that of a man who has said an unsayable thing and discovered that he does not feel punished. This suits a reading in which the book's blasphemy was a deliberate act of honesty.\n\nSecond, the \"Godhead broken up like the bread\" passage is the most direct evidence that, in November 1851, Melville had not abandoned a sacramental imagination. The figure is of a God who exists, but as a fragmented presence distributed among human beings who find one another. This is not Christian orthodoxy, and it does not imply a governing providence. But it is also not atheism. It is a pantheist or immanentist idiom, and it will return, transformed, in Clarel. The scholars who read the November letter as a sign that Melville's despair was complete overlook the sentence about the Supper.\n\nThe Hawthorne friendship cooled soon after. Hawthorne's replies to Melville's letters are lost, which is one reason scholars have difficulty reconstructing what Hawthorne said about the book [5]. We have only Melville's side, which means that the debate about the Hawthorne exchange is conducted, in effect, with one speaker.\n\n## Pierre (1852): The Chronometer and the Failure of Absolutes\n\nPierre; or, The Ambiguities (1852) is the book in which Melville turned the question against the seeker. Pierre Glendinning tries to live by an absolute moral standard, the pure Christian ethic as he reads it, and the result is ruin for himself and everyone near him. The contemporary reception was hostile: one New York paper ran the headline \"Herman Melville Crazy,\" and the Boston Post is reported to have called it \"perhaps, the craziest fiction extant\" [19]. Critics still disagree whether it is a grand failure or merely a failure, and the debate about its place in Melville's development has not ended [19]. Hershel Parker, in the introduction to the 1995 Kraken edition illustrated by Maurice Sendak, argued that the Harper text had been enlarged by roughly 150 pages, including the satire on \"Young America in Literature,\" and that the restored shorter version deserves a hearing [19]. Parker's wider case, which I know only second-hand, is that the poor reception of Moby-Dick pushed Melville to revise; I could not confirm a co-author or the detail about contract terms that an earlier draft of this account attached to it. This is a claim about composition, and if correct it means that the book's darkness is partly the product of the market's response to the earlier book. It does not, by itself, tell us what Melville believed.\n\nThe book's most theologically specific episode is the pamphlet \"Chronometricals and Horologicals\" by the shadowy Plotinus Plinlimmon. Its distinction is between the chronometer, which keeps Greenwich time wherever it sails, and the horologe, which keeps local time. Plinlimmon says that the chronometric soul conforms everywhere to the truth of heaven, whereas the horological mind is attuned to local time, and that to live chronometrically in a horological world invites disaster [19]. The pamphlet has been read as the key to Pierre's failure and, in the scholarship I could reach, in at least two incompatible ways. A 1979 review in Partisan Review treats it as counsel against total self-sacrifice, adding that Pierre is fooled into awe by it but not Melville [19]. A University of Nebraska thesis from the 1960s treats it as as near a statement of Melville's own philosophy as can be formulated [19]. The disagreement matters here because the pamphlet is a statement about divine governance. If heaven's standard is absolute and earth's is local, then providence, in so far as it is a standard, has no purchase on earthly action. A providence that cannot be lived by is either irrelevant or cruel. My reading is that Melville does not endorse Plinlimmon, whose vagueness and expedient morality are shown to be as unhelpful as Pierre's absolutism, but I regard this as an interpretation, and a scholar who accepts the Nebraska reading will disagree.\n\n## The Magazine Years: Piazza Tales and Israel Potter\n\nThe years 1853 to 1856 yielded the short fiction collected in The Piazza Tales (1856) and the serial Israel Potter (1855). Two of the tales bear directly on the question of providence.\n\n\"Bartleby, the Scrivener\" is the tale in which the narrator's charity fails against a figure he cannot understand. The story ends with an exclamation, \"Ah, Bartleby! Ah, humanity!\" I did not fetch the tale, so I flag this as a recollection from the public record and not as a verified quotation. The relevance to providence is indirect: the story asks what obligation a decent man has toward a person who declines to take part in the world's order, and it ends without an answer.\n\n\"Benito Cereno\" is more explicit, and I read it in a fetched text. Captain Amasa Delano, the American sealer who boards the slave ship, is a cheerful, benevolent, utterly obtuse man. At one moment he reflects that he had momentarily shown \"an atheist doubt of the ever-watchful Providence above\" [8]. The reader who knows the story's secret, that the slaves have taken the ship and that Babo rules the Spanish captain, sees that Delano's trust in Providence is the very instrument of his blindness. His belief that heaven watches over him makes him incapable of seeing the danger. The tale ends with a dialogue in which Delano urges the broken Cereno to forget: \"But the past is passed; why moralize upon it?\" Delano calls the trade winds \"Warm friends, steadfast friends,\" and Cereno answers: \"With their steadfastness they but waft me to my tomb, Señor.\" Asked what has cast a shadow upon him, Cereno replies: \"The negro\" [8]. Cereno dies months later, having, three months after the court dismissed him, \"did, indeed, follow his leader,\" and Babo's head on its pole \"met, unabashed, the gaze of the whites\" [8].\n\nThis ending sets two conceptions of the natural order against each other. For Delano the winds and the sky are benevolent. For Cereno the same winds carry him to death. I read the tale as an anatomy of how an optimistic providentialism can serve as a form of moral blindness in a slaveholding order. That is a reading with respectable company, though I did not fetch the scholarly literature that would let me name its authors, and a defender of Delano's innocence, or of the tale as a study in perception rather than in theology, would resist the connection to providence. I note that the reading does not require that Melville disbelieved in God. It requires only that he saw how a belief in a watchful God could be mobilized to avoid seeing evil.\n\n## The Confidence-Man (1857): Providence as a Confidence Game\n\nThe Confidence-Man: His Masquerade, published on April Fool's Day 1857, carries the problem to its limit. The novel follows a succession of figures aboard a Mississippi steamboat, each of whom asks for money or trust and each of whom may be the same trickster in a different costume. The first chapter shows a mute in cream colors writing on a slate the words \"Charity thinketh no evil\" [9]. The book thus begins by quoting the New Testament as a bait.\n\nProvidence appears in the novel mainly as a word that confidence-men use. A Methodist minister tells a crowd that \"if, next to mistrusting Providence, there be aught that man should pray against, it is against mistrusting his fellow-man\" [9]. Another speaker refers to \"the providential way in which it was started\" in praising an asylum [9]. In each case the word serves to dissolve scruple. The book does not say that Providence is false. It shows that talk of Providence is the commonest solvent of caution, and it leaves the reader unable to tell whether anyone who uses the word believes it.\n\nThe last paragraph is the most famous in the novel. The cosmopolitan leads an old man away in the dark after the light expires, and the narrator closes with the sentence \"Something further may follow of this Masquerade\" [9]. The book ends with the light going out and the future left open. It is the closest Melville comes to saying that the cosmos is a performance whose author is hidden.\n\nA reader who comes to The Confidence-Man after Mardi and Pierre can see the stages of a method. Mardi offers a consolation and leaves it. Pierre tests an absolute and breaks it. The Confidence-Man dissolves the grounds on which any assertion could be tested, because the speaker of every assertion might be a fraud. If a Melville of 1857 believed in providence, he had no means left to say so that was not exposed to the suspicion that it was a con.\n\n## The 1856-57 Journey and Hawthorne's Diary\n\nIn October 1856, Melville sailed for Europe and the Levant, a journey funded in part by his father-in-law, Judge Lemuel Shaw, and intended, according to a research-starter summary, to ease a depression [21]. The trip lasted about five months and covered some fifteen thousand miles; it began with a visit to Hawthorne in Liverpool and included a three-day trip from Jerusalem to the Dead Sea [21]. This landscape, the barren shore of the Dead Sea, the monastery of Mar Saba, the contested holy places of Jerusalem, is the setting that Clarel would later use.\n\nThe documentary center of the visit is Hawthorne's English notebook for 20 November 1856. I read a transcription of the entry. It records that the two men sat in \"the sand hills amid which we were sitting\" and that \"Melville, as he always does, began to reason of Providence and futurity.\" Hawthorne then reports that Melville had \"pretty much made up his mind to be annihilated,\" adds that \"still he does not seem to rest in that anticipation,\" and delivers his judgment: Melville \"can neither believe, nor be comfortable in his unbelief\" [3]. In the same entry, as the page reports, Hawthorne says he is too honest and courageous not to try to do one or the other, and he says that if Melville were religious, he would be among the most truly reverent of men [3]. Hawthorne also called him a man of a very high and noble nature, and better worth immortality than most of us [3].\n\nThree points deserve emphasis. First, the entry is secondhand evidence of Melville's mind. It is Hawthorne's paraphrase of a conversation, filtered through Hawthorne's own temperament, and it describes a man on a single afternoon. Scholars have naturally treated it as the best contemporary witness to Melville's religious state, but it cannot be treated as his considered statement. Second, the topic of the conversation is exactly the one this study tracks: Providence and futurity. Melville, in 1856, was still reasoning about it, \"as he always does.\" The phrase suggests that Hawthorne had heard the subject raised more than once. Third, the formula \"neither believe nor be comfortable in his unbelief\" describes an unresolved condition, not a conclusion. It is incompatible with the \"loss of faith\" story, which implies that a state of unbelief was reached, and equally with a \"hardening\" story, in which unbelief is comfortable. It is, however, consistent with a late reconciliation, because someone who is uncomfortable in unbelief may later find a way out. The entry therefore sets the problem that the last thirty-five years of the career work out.\n\n## Battle-Pieces (1866): Providence in History\n\nThe Civil War turned the question from the private to the public. Battle-Pieces and Aspects of the War (1866) is a book of poems about the war, and I read it in the Project Gutenberg text. The question here is whether history shows a divine hand. The answer given in the poems varies with the poem.\n\nIn \"The Conflict of Convictions,\" the earlier of the two poems that matter most, the voices of Yea and Nay contend, and the poem declares that \"God his former mind retains,\" that \"He who rules is old—is old,\" and that \"God He keeps the middle way\" [10]. The lines present a God who is neither the ally of the North nor an instrument of simple judgment. The effect is to deny confident claims about what the war means. Elsewhere the book is more willing to assert providential meaning: \"So God appears in apt events\" is a line from the poem on the battle for the Mississippi, and \"But God is in Heaven, and Grant in the Town\" comes from the poem on the fall of Richmond, which adds \"And Right through might is Law\" [10]. The last, as the context shows, is a hard claim: that the outcome of force is the verdict of law. A reader can take it as acceptance of the northern victory as righteous or as a bitter observation about how righteousness is assigned after the fact.\n\nThe collection therefore does not give a single answer, and that is its answer. I read it as evidence for the hypothesis that Melville, after the war, was willing to use providential language as a mode of public speech, as one speaks of fate or fortune, without making the metaphysical commitment that the language ordinarily implies. A critic who thought the hopeful lines sincere would claim the book as evidence of a recovered faith in history's meaning. I think the unresolved lines weigh against that. The book was, after all, a commercial failure, and the same author was about to withdraw from the literary marketplace.\n\n## Clarel (1876): The Long Poem of Unresolved Doubt\n\nClarel, a verse pilgrimage of over eighteen thousand lines, was published in 1876 with a bequest from Melville's uncle Peter Gansevoort [21]. The poem follows a young divinity student, Clarel, who has come to the Holy Land to regain his lost faith, and the company of pilgrims he meets: the doubters, the believers, the cynics, and the lonely [21]. Among the members of the group is Mortmain, a figure who dies at Mar Saba, and Ungar, a soldier of fortune, who joins late [21]. The poem is organized in four parts, each of which, in the summary I read, ends in death [21]. It is written in rough iambic tetrameter, and it is often called the longest poem in American literature, a judgment I report from the public record and did not verify.\n\nThe poem deals with providence in a number of registers. It rehearses, through its characters, the main modern positions: the German higher criticism, the Darwinian challenge, the American optimism that Melville distrusts, and the various ritual and mystical traditions that the pilgrims meet on the way. No character speaks for Melville. This is the poem's central difficulty for any reader who wants a verdict.\n\nThe Epilogue is where interpretation concentrates. The poem's last section opens with the question \"If Luther's day expand to Darwin's year, / Shall that exclude the hope—foreclose the fear?\" [11]. It names the \"strife and old debate\" as \"Yea, ape and angel,\" and it addresses Clarel, urging him: \"Then keep thy heart, though yet but ill-resigned—,\" and closing with the suggestion that \"Even death may prove unreal at the last\" [11]. The lines are consoling, and they are conditional. The question is posed, not answered, and the consolation is offered to a man who is \"ill-resigned,\" that is, still unreconciled.\n\nThe critical response divides in the way the encyclopedic summaries describe. Some critics read the Epilogue as showing that Melville had made peace with the conflict between belief and disbelief toward the end of his life; others read it as confirmation that he never resolved the conflict and believed that it could not be resolved [21]. Stanley Brodwin, in a 1971 essay in PMLA, argues that Clarel is an \"anti-gospel\" with a pattern drawn from the gospels of Luke and Matthew, in which the hero is sent in search of an existentially authentic faith that Melville does not find. For Brodwin, Clarel reaches instead \"an awareness of the ontological ground of existence\" shaped by confrontation with death, and the Epilogue's affirmation of immortality is forced and unconvincing, overwhelmed by the despair of the poem [12]. I find Brodwin's reading persuasive on the point that the poem's weight falls on the side of doubt, and less persuasive in calling the affirmation \"forced.\" The Epilogue is hedged by an \"if,\" by \"ill-resigned,\" and by \"may prove,\" and these hedges are the work of a writer who was not forcing anything. They read to me as a deliberately modest hope, not as a counterfeit of a stronger one.\n\nOther scholarship is available that I did not read. A 2022 Kent State University Press book is listed under the title Melville's Clarel and the Intersympathy of Creeds, and an Oxford book titled Melville's Wisdom: Religion, Skepticism, and Literature in Nineteenth-Century America has a concluding chapter on the subject; I know both only from catalog entries and cannot report their arguments [22]. The state of my evidence here is thin, and the reader should treat the summary above as a sketch of the debate and not as an account of its best current statement.\n\n## The Late Years: Private Verse, Reading, and Marginalia\n\nAfter Clarel, Melville printed very little. He worked as a customs inspector in New York from 1866 and, after retiring in 1885, devoted himself to reading and to poetry. The late books John Marr and Other Sailors (1888) and Timoleon (1891) were privately printed in tiny editions, a fact I report from the public record and not from a fetched source.\n\nThe most useful evidence of his mind in these years is his reading. William Dillingham's Melville and His Circle: The Last Years (University of Georgia Press, 1996) argues, according to the publisher's blurb, that Melville found companionship in Buddhist philosophy, Schopenhauer, Balzac, and Matthew Arnold, and traces their connection to the late verse and prose by studying Melville's personal copies [17]. A trade review quoted on the same page questions Dillingham's stronger claim that Melville turned to these authors to find themes, since those themes already appear in his early work [17]. The reservation is sound and bears on this chapter's thesis. If the late themes were already present in Mardi and Pierre, then the late reading confirmed a problem more than it changed a mind.\n\nA 2022 poster presented at Boise State's undergraduate research showcase, by Brandon Hurst, Steven Olsen-Smith, Christopher Ohge, and Elisa Barney Smith, reports that Melville's marginalia in his seven volumes of Schopenhauer belong to his final months of dedicated reading, and compares them with the unfinished Billy Budd [18]. The summary I read does not report their findings about the content of the marks. It is therefore evidence that the marginalia exist and are being studied, and not evidence about what they show. I mention a caution of method: Schopenhauer's pessimism is a doctrine of a blind, striving will, with no providence at all, so a reader marking Schopenhauer in 1891 was reading an argument against the governing intelligence that Hawthorne's diary had linked him to in 1856. But marking a passage is not the same as agreeing with it, and the claim that Melville \"became\" a Schopenhauerian in his last months is not supported by anything I read.\n\n## Billy Budd: Acceptance or Irony\n\nBilly Budd, Sailor (An Inside Narrative) was left in manuscript at Melville's death in 1891. The manuscript, as the Grolier Club's exhibition notes, runs to 351 leaves, with remnants of three overlapping versions and eight stages of composition [15]. The first published text appeared in 1924 under Raymond Weaver's editorship; popular accounts say scholars have long regarded that text as flawed [15], and the standard foundation is the 1962 Hayford-Sealts genetic text [14][15]. The Northwestern-Newberry volume of 2017, which completes that edition, is a corrected and modified version of the 1962 genetic text, and Hershel Parker wrote its historical note [15]. A digital \"fluid text\" edition from the Melville Electronic Library followed in 2019 [15]. I read the 1924 Weaver text on Project Gutenberg for the quotations below, and I flag that its chapter numbering and some of its readings differ from the later editions [13]. The word choices I quote are short and I believe stable, but a scholar should check them against the Hayford-Sealts or Northwestern-Newberry text.\n\nThe story is well known. In the summer of 1797, during the aftermath of the naval mutinies, the handsome sailor Billy Budd, impressed from the merchant ship Rights-of-Man, is falsely accused of plotting mutiny by the master-at-arms, Claggart. Billy, who stutters under stress, strikes Claggart dead with one blow. Captain Vere convenes a drumhead court and, against the sympathies of the court, urges conviction. Billy is hanged at dawn.\n\nProvidence in the narrower sense is nearly absent from the vocabulary of the chapters I read closely, but the structure of the book is theological throughout. Vere's reaction to the death is the line that everyone remembers. He says to the surgeon: \"Struck dead by an angel of God. Yet the angel must hang!\" [13]. In the same scene he exclaims \"It is the divine judgment of Ananias!\" [13]. The two sentences hold the problem. Vere recognizes the act as, in some sense, providential: an innocent instrument has killed a liar. He also determines that the instrument must be destroyed. The tension between a providential reading and a legal one is the core of the book.\n\nIn the council scene, Vere argues from the law. \"We proceed under the law of the Mutiny Act,\" he says, and he describes the Act as resembling \"in spirit the thing from which it derives—War\" [13]. Vere voices the court's own scruples for it, asking in their name, \"in natural justice is nothing but the prisoner's overt act to be considered?\" and whether they can condemn \"a fellow-creature innocent before God.\" Then he draws the distinction between Nature and allegiance: \"It is Nature. But do these buttons that we wear attest that our allegiance is to Nature? No, to the King\" [13]. He speaks of \"our vowed responsibility\" and of how \"it would be martial law operating through us\" [13]. This is the speech that the debate turns on. It sets natural law, which Billy's innocence would satisfy, against the positive law that the king's officers have sworn to administer.\n\nThe scenes after the sentence are shaped by the chaplain's failure. The chaplain tries to bring Billy to a religious acceptance of his death, and Billy receives him politely without real engagement [13]. The chaplain kisses Billy's cheek, and the narrator reflects that \"a chaplain is the minister of the Prince of Peace serving in the host of the God of War—Mars\" [13]. The line is satiric and structural: the religion of peace is a servant of an institution of war. Billy's last words, \"God bless Captain Vere!\", are echoed by the crew [13]. The surgeon's remark that \"Euthanasia, Mr. Purser, is something like your will-power\" belongs to an episode in which the purser and the surgeon argue about why Billy's body did not move at the hanging, and the surgeon dismisses the purser's explanation as imaginative and metaphysical [13]. The narrator's own remark that \"The symmetry of form attainable in pure fiction cannot so readily be achieved in a narration\" signals a book that refuses to supply the symmetry that a providential plot would give [13]. The poem \"Billy in the Darbies,\" which closes the book, ends with the speaker drifting into sleep, and the manuscript carries the date \"April 19, 1891\" at its end [13].\n\n### The acceptance school\n\nThe first generation of critics read the book as a late reconciliation. In the account given in a reference entry by Richard A. Hocks, for roughly the first quarter-century after the 1924 publication critics such as E. L. Grant Watson, in an essay of 1933, read it as a \"testament of acceptance,\" a work free of the subversive edge of Melville's fiction of the 1840s and 1850s [14]. On this reading, Vere is a tragic but honorable figure who sacrifices an innocent man to preserve order, and Billy's blessing of Vere is the book's key. The old Melville has stopped fighting and affirms the necessity of law, even at terrible cost, and he sees something sacred in the victim who forgives.\n\nThe strongest argument for acceptance rests on Billy's last words and on the sacramental imagery, in which Billy becomes a Christ figure who accepts his death. It is reinforced by the late conciliatory tone of the Clarel Epilogue. Richard Harter Fogle, in 1958, called the novel a classical tragedy, a view that Hocks presents as a rebuttal to the ironists [14].\n\n### The irony school\n\nBy the 1950s, as Hocks records, critics influenced by narrative point of view and unreliable narration reread the book ironically; they rejected acceptance and portrayed Vere as a misguided dogmatist and a destructive legalist [14]. Phil Withim's 1959 essay supplied the label \"testament of resistance\" [14]. On this reading, the narrator's praise of Vere is a cover, and the book is an indictment of a system in which a good man is hanged for the sake of procedure. Hocks compares the quarrel between \"plain talkers\" and \"ironists\" to the controversy about Henry James's Turn of the Screw [14].\n\nThe strongest argument for irony is the chaplain's satire, the narrator's open failures of sympathy with Vere, and the way the book's own language repeatedly undercuts the official account. Billy's blessing may be sincere, but the sailors' echo of it, and the later folk-ballad that makes Billy a kind of saint, can be read as the way institutions turn a victim into a myth that serves them.\n\n### What the unfinished manuscript does to both\n\nThe textual situation complicates both camps. Hayford and Sealts, as Hocks reports, identified three composition phases centered on Billy, Claggart, and Vere, and described the manuscript as a \"semi-final draft\" [14]. If the book grew from a ballad about Billy to a story about Claggart to a study of Vere, then the figure on whom both schools' arguments turn was the last to arrive, and the final stage was not finished. A fixed, intended meaning of Vere's judgment may not exist. I did not read Parker's Reading Billy Budd (Northwestern University Press, 1990) and know its argument only at second hand: one product page says Parker regards the story as unfinished and not teachable as a coherent, finished work, and I treat that as a weak source for his view [15]. The point stands on the better evidence of the manuscript's description. Neither school can claim the book as a statement the author considered final.\n\nSeveral alternatives have been offered. A third camp holds that the work has no abstractable meaning, and some university reading lists summarize all three positions as each true in its own sense. A 2014 book by one Russell Weaver is said to argue that the novel does not ask readers to choose between the two testaments but challenges them to face the difficulty of decisions; I could not confirm this in the reference entry I read or anywhere else, and I set it aside. Barbara Johnson, in a passage that reached me only through a search summary, framed the dichotomy as part of the story itself, so that the task is to analyze what is at stake in the very opposition between literality and irony. If I read that correctly, the opposition between acceptance and irony is a feature the book generates and not a problem that a critic can solve from outside.\n\nMy own judgment is as follows. The acceptance reading is right that Melville did not write a polemic. The tragedy has a real moral weight on both sides, and the reader is asked to feel Vere's anguish. The irony reading is right that the narrator's authority is unstable and that the Mutiny Act is not given the last word. But neither reading explains the angel remark. The sentence \"Struck dead by an angel of God. Yet the angel must hang!\" asserts a providential order and in the same breath declares that human law will go against it. A book whose central line holds both claims at once is not accepting providence or ironizing it. It is staging the moment at which a providential reading of events and a legal-political necessity collide, and it leaves the collision unresolved. That is what Hawthorne observed in 1856, now in dramatic form.\n\n## The Arc Assessed: Loss, Hardening, or Reconciliation\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 536\" role=\"img\" aria-label=\"Two-panel timeline of Melville's providence argument. Upper panel, 1846 to 1891: Typee 1846 and Omoo 1847 aim at those who speak for God; Mardi 1849 offers a consolation and leaves it; Moby-Dick 1851; Pierre 1852 tests an absolute and breaks it; The Confidence-Man, April 1 1857; Battle-Pieces 1866; Clarel 1876, over eighteen thousand lines; John Marr 1888; death in 1891 with Billy Budd left in manuscript. Lower panel enlarges 1849 to 1852: early 1849 Bayle bought and Emerson heard; August 1850 Hawthorne and His Mosses; April 1851 the No in Thunder letter; June 1851 two letters; Moby-Dick; November 1851 I have written a wicked book letter; 1852 Pierre. A marker at 20 November 1856 records Hawthorne's notebook entry.\">\n<text x=\"350\" y=\"26\" text-anchor=\"middle\" font-size=\"14\" class=\"t-serif\" letter-spacing=\"2\">THE ARGUMENT ACROSS A CAREER<\/text>\n<text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">works above the line, testimony below · 1846 to 1891<\/text>\n<line x1=\"50\" y1=\"190\" x2=\"650\" y2=\"190\" class=\"ln\" stroke-width=\"2\"/>\n<line x1=\"103\" y1=\"186\" x2=\"103\" y2=\"194\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"103\" y=\"206\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1850<\/text>\n<line x1=\"237\" y1=\"186\" x2=\"237\" y2=\"194\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"237\" y=\"206\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1860<\/text>\n<line x1=\"370\" y1=\"186\" x2=\"370\" y2=\"194\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"370\" y=\"206\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1870<\/text>\n<line x1=\"503\" y1=\"186\" x2=\"503\" y2=\"194\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"503\" y=\"206\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1880<\/text>\n<line x1=\"637\" y1=\"186\" x2=\"637\" y2=\"194\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"637\" y=\"206\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1890<\/text>\n<line x1=\"50\" y1=\"190\" x2=\"50\" y2=\"158\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"50\" cy=\"190\" r=\"5\" class=\"f-t1\"/>\n<text x=\"50\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Typee 1846<\/text>\n<line x1=\"63\" y1=\"190\" x2=\"63\" y2=\"124\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"63\" cy=\"190\" r=\"5\" class=\"f-t1\"/>\n<text x=\"63\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Omoo 1847<\/text>\n<line x1=\"90\" y1=\"190\" x2=\"90\" y2=\"90\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"90\" cy=\"190\" r=\"5\" class=\"f-t3\"/>\n<text x=\"90\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Mardi 1849<\/text>\n<line x1=\"117\" y1=\"190\" x2=\"117\" y2=\"158\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"117\" cy=\"190\" r=\"5\" class=\"f-t4\"/>\n<text x=\"117\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Moby-Dick 1851<\/text>\n<line x1=\"130\" y1=\"190\" x2=\"130\" y2=\"124\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"130\" cy=\"190\" r=\"5\" class=\"f-t3\"/>\n<text x=\"130\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Pierre 1852<\/text>\n<line x1=\"197\" y1=\"190\" x2=\"197\" y2=\"90\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"197\" cy=\"190\" r=\"5\" class=\"f-t3\"/>\n<text x=\"197\" y=\"86\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Confidence-Man 1857<\/text>\n<line x1=\"317\" y1=\"190\" x2=\"317\" y2=\"124\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"317\" cy=\"190\" r=\"5\" class=\"f-t1\"/>\n<text x=\"317\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Battle-Pieces 1866<\/text>\n<line x1=\"450\" y1=\"190\" x2=\"450\" y2=\"158\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"450\" cy=\"190\" r=\"5\" class=\"f-t2\"/>\n<text x=\"450\" y=\"154\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Clarel 1876<\/text>\n<line x1=\"610\" y1=\"190\" x2=\"610\" y2=\"124\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"610\" cy=\"190\" r=\"5\" class=\"f-t2\"/>\n<text x=\"610\" y=\"120\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">John Marr 1888<\/text>\n<line x1=\"650\" y1=\"190\" x2=\"650\" y2=\"90\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"650\" cy=\"190\" r=\"5\" class=\"f-t5\"/>\n<text x=\"654\" y=\"86\" text-anchor=\"end\" font-size=\"10\" font-weight=\"bold\">d. 1891 / Billy Budd ms.<\/text>\n<text x=\"50\" y=\"62\" text-anchor=\"start\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">early books target those who speak for God<\/text>\n<rect x=\"50\" y=\"216\" width=\"44\" height=\"16\" class=\"f-t1\" opacity=\".85\"/>\n<rect x=\"94\" y=\"216\" width=\"109\" height=\"16\" class=\"f-t3\" opacity=\".85\"/>\n<rect x=\"203\" y=\"216\" width=\"447\" height=\"16\" class=\"f-t2\" opacity=\".85\"/>\n<text x=\"72\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-inv\">vanity<\/text>\n<text x=\"149\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-inv\">the method, 1849 to 1857<\/text>\n<text x=\"427\" y=\"228\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-inv\">after the silence: Battle-Pieces to Billy Budd<\/text>\n<line x1=\"195\" y1=\"232\" x2=\"195\" y2=\"256\" class=\"s-t4\" stroke-width=\"1.5\"/>\n<rect x=\"73\" y=\"256\" width=\"244\" height=\"30\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.2\" style=\"stroke:var(--t4)\"/>\n<text x=\"195\" y=\"269\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"bold\">20 Nov 1856, Hawthorne's notebook:<\/text>\n<text x=\"195\" y=\"281\" text-anchor=\"middle\" font-size=\"8.2\" class=\"t-muted\" font-style=\"italic\">he \"can neither believe, nor be comfortable in his unbelief\"<\/text>\n<line x1=\"90\" y1=\"198\" x2=\"50\" y2=\"304\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n<line x1=\"137\" y1=\"198\" x2=\"650\" y2=\"304\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n<rect x=\"30\" y=\"310\" width=\"640\" height=\"204\" rx=\"2\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<text x=\"350\" y=\"328\" text-anchor=\"middle\" font-size=\"11\" class=\"t-serif\" letter-spacing=\"1.5\">1849 TO 1852, ENLARGED: THE HAWTHORNE YEARS<\/text>\n<line x1=\"70\" y1=\"430\" x2=\"630\" y2=\"430\" class=\"ln\" stroke-width=\"2\"/>\n<line x1=\"70\" y1=\"426\" x2=\"70\" y2=\"434\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"70\" y=\"446\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1849<\/text>\n<line x1=\"230\" y1=\"426\" x2=\"230\" y2=\"434\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"230\" y=\"446\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1850<\/text>\n<line x1=\"390\" y1=\"426\" x2=\"390\" y2=\"434\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"390\" y=\"446\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1851<\/text>\n<line x1=\"550\" y1=\"426\" x2=\"550\" y2=\"434\" class=\"ln\" stroke-width=\"1.5\"/>\n<text x=\"550\" y=\"446\" text-anchor=\"middle\" font-size=\"9\" class=\"t-muted\">1852<\/text>\n<line x1=\"102\" y1=\"430\" x2=\"102\" y2=\"454\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"102\" cy=\"430\" r=\"5\" class=\"f-t2\"/>\n<text x=\"102\" y=\"464\" text-anchor=\"start\" font-size=\"9.5\">Bayle bought; Emerson heard (Mar)<\/text>\n<line x1=\"329\" y1=\"430\" x2=\"329\" y2=\"480\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"329\" cy=\"430\" r=\"5\" class=\"f-t1\"/>\n<text x=\"329\" y=\"490\" text-anchor=\"middle\" font-size=\"9.5\">\"Hawthorne and His Mosses\" (Aug)<\/text>\n<line x1=\"438\" y1=\"430\" x2=\"438\" y2=\"454\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"438\" cy=\"430\" r=\"5\" class=\"f-t4\"/>\n<text x=\"438\" y=\"464\" text-anchor=\"middle\" font-size=\"9.5\">\"No! in Thunder\" (Apr)<\/text>\n<line x1=\"467\" y1=\"430\" x2=\"467\" y2=\"480\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"467\" cy=\"430\" r=\"5\" class=\"f-t3\"/>\n<text x=\"467\" y=\"490\" text-anchor=\"middle\" font-size=\"9.5\">two letters (June)<\/text>\n<line x1=\"531\" y1=\"430\" x2=\"531\" y2=\"454\" class=\"ln-soft\" stroke-width=\"1\"/>\n<circle cx=\"531\" cy=\"430\" r=\"5\" class=\"f-t4\"/>\n<text x=\"531\" y=\"464\" text-anchor=\"middle\" font-size=\"9.5\">\"a wicked book\" (Nov)<\/text>\n<line x1=\"70\" y1=\"430\" x2=\"70\" y2=\"410\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"65\" y=\"425\" width=\"10\" height=\"10\" class=\"f-t3\"/>\n<text x=\"70\" y=\"406\" text-anchor=\"start\" font-size=\"10\" font-weight=\"bold\">Mardi 1849<\/text>\n<line x1=\"526\" y1=\"430\" x2=\"526\" y2=\"410\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"521\" y=\"425\" width=\"10\" height=\"10\" class=\"f-t4\"/>\n<text x=\"526\" y=\"406\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Moby-Dick 1851<\/text>\n<line x1=\"598\" y1=\"430\" x2=\"598\" y2=\"388\" class=\"ln-soft\" stroke-width=\"1\"/>\n<rect x=\"593\" y=\"425\" width=\"10\" height=\"10\" class=\"f-t3\"/>\n<text x=\"598\" y=\"384\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"bold\">Pierre 1852<\/text>\n<text x=\"350\" y=\"508\" text-anchor=\"middle\" font-size=\"9.5\" class=\"t-muted\" font-style=\"italic\">Seven documented months hold the whole of Melville's own voice on the question.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> The providence argument is not a slow loss of faith but a method, and nearly all of Melville&#8217;s direct testimony falls inside three years. The early books already mock those who speak for Providence; <em>Mardi<\/em>, <em>Pierre<\/em> and <em>The Confidence-Man<\/em> offer a consolation, test an absolute and dissolve the grounds; and after 1866 the question moves into verse, with <em>Clarel<\/em> (1876) and an unfinished <em>Billy Budd<\/em> left at his death in 1891. The enlarged panel shows the letters and the essay crowded around <em>Moby-Dick<\/em>, then silence.<\/figcaption>\n<\/figure>\n\n\nWith the stages laid out, the three readings can be tested.\n\nThe loss-of-faith thesis says that Melville began with a believing frame and gradually surrendered it. The evidence against it is that the early books already contain the critique of speaking for Providence, and that Mardi in 1849 already contains necessity, with Providence pushed back to an original \"letting,\" as a coherent philosophical position. If he lost a faith, he lost it before the books we have, and the 1856 diary entry shows him still reasoning about the question, not as someone who has finished with it. The thesis also implies a decisive event, and none is documented. Lawrance Thompson's Melville's Quarrel with God (1952) is the best-known statement of a strong version, in which Melville is a lifelong rebel against a God he believed in; I did not read the book and note the title only because it names the position. A reader who believes in a God who is cruel is not a person who has lost faith. That reading would still be a faith of a kind, and a defender of it would object to my framing. I think the evidence does not support it as the whole story, because the poems and letters contain too many consoling moments, but the \"Quarrel\" thesis explains the \"No! in thunder\" better than the loss-of-faith thesis does.\n\nThe hardening thesis says that the middle years, from Pierre to The Confidence-Man, saw his skepticism become a systematic distrust of every assertion, and that after 1857 he settled into this. The evidence for it is the Confidence-Man itself, in which every speaker of providential language is suspect, and the commercial failure and withdrawal that followed. The evidence against it is the very fact that he did not stay in the Confidence-Man's posture. He took the journey of 1856-57, he wrote Battle-Pieces, and above all he spent perhaps a decade on Clarel, a poem whose whole purpose is to give every position its voice. A hardened man does not write eighteen thousand lines to listen to the other side.\n\nThe late-reconciliation thesis says that in Clarel's Epilogue and in Billy Budd, Melville came to an acceptance of the order of things. The evidence for it is the Epilogue's consoling hedges and Billy's blessing of Vere. The evidence against it is that the Epilogue speaks to a man \"ill-resigned,\" that the strongest reading of the poem in Brodwin's essay finds the affirmation overwhelmed, and that Billy Budd is unfinished and contains an irony that the best scholars cannot remove [12][14][15].\n\nThe reading I favor, which I label as my own and as contested, is a fourth: that the arc is not a change of belief but a change of address. The question, whether there is a governing intelligence and whether it is good, stays constant. What changes is whom Melville is arguing with and how openly. In the early books he argues with missionaries. In Mardi and Moby-Dick he argues with the cosmos in the voice of philosopher and captain. In Pierre and the Confidence-Man he argues with himself and with the reader's trust. In Clarel he gives the argument to a company of voices and withholds his own. In Billy Budd he dramatizes the argument as a judicial decision in which the judge may be right and the victim may be an angel. Hawthorne's phrase, that he could neither believe nor be comfortable in his unbelief, describes each of these stages. It is the one stable fact about him, and he never found a way to put it down.\n\nA scholar would want to press several objections. The first is that the thesis is unfalsifiable: any text can be absorbed into \"unresolved.\" I accept this risk and answer that the thesis makes predictions. It predicts that at no point will Melville speak in his own voice with confident affirmation or denial. That matches what I read, but I have not read the full late poetry, and a single unmistakably affirmative or negative late text would damage it. The second objection is that the evidence from letters and the diary is thin and mediated. That is true, and it is why the thesis is held with medium confidence. The third is that Melville's irony makes sincere statement impossible to identify, so that the very consolations I cite as evidence of openness could be read as ironic. The reply is that the same objection could be made to any text, and that Hawthorne, who knew him, called him honest.\n\n## Open Questions\n\nThe first open question is textual. The \"No! in thunder\" letter is quoted here from a web transcription that dates it [April 16?] 1851 and names no edition. A check against the standard Northwestern-Newberry Correspondence would settle the wording and the dating.\n\nThe second concerns the late marginalia. The Schopenhauer volumes are being encoded and analyzed, but I have found no published account of what Melville marked and what he rejected. If the markings concentrate on the passages against providential teleology, that would shift the weight toward a hardening reading in the last months; if they concentrate on the consolations in Arnold, it would shift toward reconciliation. This evidence is not yet available to me.\n\nThe third is the status of Vere. The manuscript's three phases mean that the figure who carries the book's argument was the last to be written. Whether Melville would have revised him, as an editor of the Northwestern-Newberry text might ask, is unknowable, and it limits what can be built on the \"Mutiny Act\" speech.\n\nThe fourth is what I have not read. The major biographies and critical studies that every scholar of this question would consult, including Parker's two-volume biography, Delbanco's Melville: His World and Work, Robert Milder's work on the late career, Sacvan Bercovitch's essays, and Wyn Kelley's introductions, I know only by title or through catalog descriptions. The chapter is built on primary texts and a handful of fetched secondary sources, and a fuller treatment would test its claims against these.\n\n## Sources\n\n1. Herman Melville, letter to Nathaniel Hawthorne, November 1851 (transcription), Biblioklept, posted 9 Sept 2014. https://biblioklept.org/2014/09/09/letter-to-nathaniel-hawthorne-november-1851-herman-melville/ (accessed 2026-10-24). Tier 1 text via a blog transcription; standard text is the Northwestern-Newberry Correspondence, not consulted.\n2. Herman Melville, letter to Nathaniel Hawthorne, June 1851 (excerpt), Biblioklept, posted 25 July 2011. https://biblioklept.org/2011/07/25/i-am-like-one-of-those-seeds-taken-out-of-the-egyptian-pyramids-herman-melville-writes-to-nathaniel-hawthorne/ (accessed 2026-10-24); \"Dollars damn me\" line as quoted in \"Melville's Fever,\" New York Review of Books, 4 April 1996. https://www.nybooks.com/articles/1996/04/04/melvilles-fever/ (accessed via search summary 2026-10-24).\n3. Nathaniel Hawthorne, English Notebooks, entry of 20 November 1856, as transcribed by Biblioklept, 8 June 2012. https://biblioklept.org/2012/06/08/nathaniel-hawthorne-on-herman-melville-he-can-neither-believe-nor-be-comfortable-in-his-unbelief/ (accessed 2026-10-24). Tier 1 via blog transcription.\n4. Herman Melville, \"Hawthorne and His Mosses,\" Literary World, 17 and 24 August 1850, Eldritch Press transcription. https://ibiblio.org/eldritch/nh/hahm.html (accessed 2026-10-24). Tier 1.\n5. Melville to Hawthorne, [April 16?] 1851, web transcription at melville.org, https://www.melville.org/letter2.htm (accessed 2026-10-24). Tier 1 (transcription; edition not named; wording and date to be checked against the Northwestern-Newberry Correspondence).\n6. Herman Melville, Mardi: and a Voyage Thither (1849), Project Gutenberg #13720 and #13721, https://gutenberg.org/cache/epub/13721/pg13721-images.html; chapter text of the \"necessity\" passage at https://americanliterature.com/author/herman-melville/book/mardi-and-a-voyage-thither/volume-ii-chapter-xxxi (accessed 2026-10-24). Tier 1.\n7. Herman Melville, White-Jacket (1850), Project Gutenberg #10712. https://gutenberg.org/cache/epub/10712/pg10712-images.html (accessed 2026-10-24). Tier 1.\n8. Herman Melville, \"Benito Cereno,\" in The Piazza Tales (1856), Wikisource transcription. https://en.wikisource.org/wiki/The_Piazza_Tales/Benito_Cereno (accessed 2026-10-24). Tier 1.\n9. Herman Melville, The Confidence-Man: His Masquerade (1857), Project Gutenberg #21816. http://www.gutenberg.org/cache/epub/21816/pg21816.txt (accessed 2026-10-24). Tier 1.\n10. Herman Melville, Battle-Pieces and Aspects of the War (1866), Project Gutenberg #12384. https://gutenberg.org/cache/epub/12384/pg12384-images.html (accessed 2026-10-24); only the first 100,000 characters were read. Tier 1.\n11. Herman Melville, \"Epilogue,\" Clarel (1876). https://americanliterature.com/author/herman-melville/poem/epilogue-clarel (accessed 2026-10-24). Tier 1.\n12. Stanley Brodwin, \"Herman Melville's Clarel: An Existential Gospel,\" PMLA 86.3 (1971), 375-387, DOI 10.2307/461103; abstract via Cambridge Core. https://www.cambridge.org/core/journals/pmla/article/abs/herman-melvilles-clarel-an-existential-gospel/85B0817B9BD709D4A3B373EDA5EF252C (accessed 2026-10-24). Tier 2 (abstract only).\n13. Herman Melville, Billy Budd and Other Prose Pieces, ed. Raymond W. Weaver (London: Constable, 1924), Project Gutenberg #76513. https://gutenberg.org/cache/epub/76513/pg76513-images.html (accessed 2026-10-24). Tier 1; the 1924 text is superseded by Hayford-Sealts (1962).\n14. Richard A. Hocks, \"Billy Budd,\" entry in American History Through Literature 1870-1920, via Encyclopedia.com. https://www.encyclopedia.com/history/culture-magazines/billy-budd (accessed 2026-10-24). Tier 2 reference work; also reports Watson, Withim, Fogle, Hayford-Sealts, and Russell Weaver's argument.\n15. Grolier Club online exhibition on Billy Budd, \"Twenty-First Century.\" https://grolierclub.omeka.net/exhibits/show/billy-budd/twenty-first-century (accessed 2026-10-24). Tier 2/5. Manuscript description and editions (1962, 2017, 2019). A Walmart product page for the 2017 volume was surfaced by search and is used only for a weak report of Parker's view; the \"breadbox\" and Weaver-text-flaws accounts come from a popular essay, https://allvisibleobjects.substack.com/p/billy-budd-in-the-breadbox (Tier 6/7, flagged).\n16. Hershel Parker, Reading Billy Budd (Evanston: Northwestern University Press, 1990); publication data via HathiTrust and library catalog records. https://catalog.hathitrust.org/Record/002444897 (accessed 2026-10-24). Bibliographic only.\n17. William B. Dillingham, Melville and His Circle: The Last Years (Athens: University of Georgia Press, 1996), Publishers Weekly listing. https://publishersweekly.com/978-0-8203-1856-1 (accessed 2026-10-24). Tier 5 (publisher/trade description).\n18. Brandon Hurst, Steven Olsen-Smith, Christopher Ohge, and Elisa Barney Smith, poster on Melville's Schopenhauer marginalia, Boise State Undergraduate Research Showcase, 22 April 2022. https://experts.boisestate.edu/en/publications/knowledge-is-a-lamp-to-lighten-his-path-investigating-melvilles-m/ (accessed 2026-10-24). Tier 2 (abstract).\n19. On Pierre: Cambridge Critical Heritage series page, https://resolve.cambridge.org/core/books/herman-melville/pierre-1852/235C68E45ECB4B3401BFD58FD19E2DA8; The Marginalian, 21 Aug 2014, https://www.themarginalian.org/2014/08/21/maurice-sendak-pierre-herman-melville/; Partisan Review 46.3 (1979), https://www.bu.edu/partisanreview/books/PR1979V46N3/HTML/files/assets/basic-html/page121.html; PMLA, \"Absolutism in Melville's Pierre,\" https://resolve.cambridge.org/core/journals/pmla/article/absolutism-in-melvilles-pierre/958EB61D1542FE04CF80A934A12374D7; University of Nebraska-Lincoln thesis, https://digitalcommons.unl.edu/opentheses/58 (all reached through search summaries, accessed 2026-10-24). Tier 2/5; the composition claim is Parker's, as reported there.\n20. Doctoral study of the religious reception of Typee and Omoo, University of Tennessee. https://trace.tennessee.edu/utk_graddiss/9457 (accessed via search summary 2026-10-24). Tier 2.\n21. \"Clarel by Herman Melville,\" EBSCO Research Starters. https://www.ebsco.com/research-starters/literature-and-writing/clarel-herman-melville (accessed 2026-10-24). Tier 5.\n22. Catalog entries only: Melville's Wisdom: Religion, Skepticism, and Literature in Nineteenth-Century America (AAR Academy Series, Oxford University Press), https://academic.oup.com/book/42099/chapter/356103441; Melville's Clarel and the Intersympathy of Creeds (Kent State University Press, 2022), https://www.kentstateuniversitypress.com/?p=2148 (accessed 2026-10-24). Not read.\n23. Andrew Delbanco, Melville: His World and Work (New York: Knopf, 2005), publisher/retailer listings. https://nationalhumanitiescenter.org/?p=55081 (accessed 2026-10-24). Bibliographic only.\n24. Melville's Marginalia Online, note on Melville's copy of Mosses from an Old Manse (Houghton Library, Harvard). https://melvillesmarginalia.org/Note.aspx?id=16 (accessed 2026-10-24). Tier 2."}, {"order": 5, "file": "05_Reception_And_The_Scholarly_Debate.md", "title": "How Readers Have Argued Over Melville's Providence: Reception and the Scholarly Debate, 1851 to Today", "summary": "", "body": "# How Readers Have Argued Over Melville's Providence: Reception and the Scholarly Debate, 1851 to Today\n\n## Bottom Line\n\n> Melville's readers have never agreed on what he believed about providence, and the disagreement has a discernible history. The first reviewers judged him for irreverence or for obscurity; the 1920s revivalists made him a tragic prophet; mid-century critics split him into a hidden blasphemer (Thompson), a Manichean Ahab-watcher (Murray), and a Shakespearean tragedian (Matthiessen, Olson); and since the 1970s the field has largely defined itself against the \"quarrel with God\" thesis, preferring historical, Calvinist-inflected, agnostic or political readings. The evidentiary fault line runs between those who read the novel's doctrine off Ahab or off hidden ironies, and those who read it off the whole career, the letters, and Hawthorne's report of November 1856. The field is institutionally healthy: a Melville Society, a three-issues-a-year journal, a finished scholarly edition, and a bicentennial in 2019 that consolidated all of this.\n\n## Why Reception Is Part of the Argument\n\nA reader who asks what Melville \"argued\" about providence meets a problem peculiar to him: the answer has been decided, again and again, by the question the answering age wanted to ask. This chapter treats reception as evidence in its own right. Scholars sometimes call a reading's *evidentiary base* the kind of material from which it draws its warrant: the novel's narrator, its most striking character, the correspondence, the marginalia, a friend's report, or an authorial strategy of concealment that the text itself never confesses. Each major school in the debate rests on a different base, and the disagreements are often disagreements about which base is authoritative. A glossary of terms of art follows as they arise. *Providence* here means the doctrine that God governs the world, down to particulars, toward ends; *theodicy* means the attempt to justify that governance in the face of evil; *Calvinism* means the Reformed tradition, in the American Puritan and Presbyterian forms Melville knew through his Dutch Reformed upbringing, stressing divine sovereignty and predestination.\n\nThe chapter keeps three grades of claim apart. What is *established* is a matter of documents and dates: who reviewed the book, when, what they printed. What is *defensible* is an interpretation that its proponents argue well from evidence others also accept. What is *contested* is where scholars genuinely disagree and the evidence does not force a verdict. Where this chapter relies on catalog, publisher or secondary-summary evidence rather than the cited books themselves, it says so.\n\n## The First Reception, 1851 to 1852\n\n*Moby-Dick* appeared in London in October 1851, in three volumes under the title *The Whale*, and in New York in November. The British notices came first and ran the full range. The *Morning Advertiser* of 24 October praised \"High philosophy, liberal feeling, abstruse metaphysics popularly phrased, soaring speculation,\" and the *John Bull* of 25 October called the book a \"whole philosophy of life\" while objecting to \"occasional thrusts against revealed religion which add nothing to the interest of his story\" and to \"some heathenish, and worse than heathenish talk\" that was \"calculated to give even more serious offence\" [1]. The same day's *Athenaeum*, by Henry F. Chorley, called the book \"an ill-compounded mixture of romance and matter-of-fact\" and the author \"incorrigible,\" and dismissed the whole as \"Bedlam literature\" [1]. The *Literary Gazette* (6 December) found it \"wantonly eccentric; outrageously bombastic\" [1]. That the *Athenaeum* and the *John Bull* appeared on the same date and diverged so sharply is already instructive: two London weeklies read the same pages and found philosophy in one and offense in the other.\n\nThe scale of the religious complaint should not be overstated. In the notices I could read, the religious charge was specific and local. The *John Bull* reviewer objected to irreverent passages as an excrescence on a story he otherwise admired [1]. Nothing I found in the fetched reviews uses the word \"blasphemy\" of the book as a whole, and the often-repeated impression that the book was condemned as blasphemous in 1851 needs more care than the folk history gives it; a search of the available texts yielded the charge as irreverence, not as an indictment of the plot's theology. That it was *felt* as a religious offense is better documented in the American trade press. Evert Duyckinck, editor of the *Literary World* and Melville's one-time patron, reviewed the book in two parts in November 1851 (the citations given are 15 and 22 November 1851, pp. 381-83 and 403-4) and, as one scholar summarized, complained of Ishmael's remarks on Christianity and urged more respect for the public's religious feelings [2]. I could not retrieve the full text of Duyckinck's review, so the exact wording, including whether \"rhapsody\" is his or a later summarizer's, is not confirmed here; one summary describes him as admiring a vein of moralizing \"half essay, half rhapsody\" while faulting the digressions [3].\n\nThe American picture is mixed. *Harper's New Monthly Magazine* for December 1851, in a notice attributed to George Ripley, called the book \"a pregnant allegory, intended to illustrate the mystery of human life\" and praised \"the genius of the author for moral analysis\" as \"scarcely surpassed by his wizard power of description\" [1]. The reviewer's word *allegory* matters more than any adjective, because it inaugurates the allegorical reading that Thompson would push to its extreme a century later and that Herbert would then oppose. The New York *Albion* (22 November, William Young) was less kind, finding Ahab \"grievously spoiled, nay altogether ruined, by a vile overdaubing with a coat of book-learning and mysticism\" [1]. The *United States Magazine and Democratic Review* of January 1852 opened with \"Mr. Melville never writes naturally\" and spoke of \"insinuating licentiousness\" and immeasurable vanity [1]. A Southern outlet, the *Southern Quarterly Review* (Charleston, January 1852), singled out the Quakers, \"the wretchedest dolts and drivellers,\" a reminder that denominational touchiness colored the notices [2].\n\nTwo further facts frame the first reception. The first English edition lacked the epilogue, leaving British reviewers uncertain how Ishmael survived; this is a commonplace in the scholarship, and the search summary I read reports it without a primary citation, so I treat it as widely reported rather than independently confirmed here [4]. And sales were modest. The figures given on a blog quoting the Melville Electronic Library's earnings page put *Typee* at 16,320 copies, *Omoo* at 13,325 and *Moby-Dick* at 3,715; I could not verify these against the page itself, and sources I saw differ on the British numbers [2]. The robust conclusion is the comparative one: *Moby-Dick* sold far fewer copies than Melville's first two books.\n\nWhat did these reviewers think about providence? Mostly they did not frame the question that way. They asked whether the book was a novel, whether Ahab was credible, whether the cetology ruined the story, and whether the irreverence was offensive. The nearest thing to a doctrinal reading is Ripley's *allegory of the mystery of human life* and the *John Bull*'s *philosophy of life*. The providential question, as later critics would pose it, is an invention of the twentieth century. That is a finding in itself: the book's central theological reputation was made after its author's death.\n\n## Obscurity and the Revival, 1891 to 1929\n\nMelville died in 1891 and for roughly three decades his reputation rested on the South Sea books. The standard reconstruction, repeated in reference accounts, is that he was discovered, praised, forgotten, and rediscovered [5]. The turning point came with the 1919 centennial. Raymond Weaver, a young Columbia lecturer, wrote an essay for *The Nation* in August 1919 at the request of Carl Van Doren, its literary editor; Van Doren had himself praised Melville in the *Cambridge History of American Literature* (1917) [6][4]. Weaver's biography, *Herman Melville: Mariner and Mystic* (New York, George H. Doran, 1921), is generally treated as the first book-length life and the start of the revival [4][6]. (The Nation's retrospective calls it \"Man, Mariner and Mystic,\" but catalog records and the Grolier Club give the title as *Mariner and Mystic*, which is the form I use [4].) The Grolier Club's timeline adds that Weaver described Melville's later decades as a \"long and dark eclipse,\" that his bibliography omitted *Billy Budd*, and that the sixteen-volume Constable edition of 1922-24 first printed *Billy Budd, Foretopman* in 1924, in an edition limited to 750 copies and edited by Weaver, who called the text \"finished\" though Melville had discarded that title [4].\n\nThe phrase \"mariner and mystic\" signals the revival's theological idiom. Weaver's Melville was a seeker, a metaphysical adventurer, and *Moby-Dick* was his \"undoubted masterpiece\" [6]. The revival's English voice was D. H. Lawrence, whose *Studies in Classic American Literature* (1923) called *Moby-Dick* a masterpiece and made Melville a prophet of the death of the old, spiritualized white consciousness. I have not re-read Lawrence for this chapter and describe him only from the reference accounts [4][5]; his claim to a place here is that he read the whale as the great symbol of a cosmic, blood-conscious otherness and Ahab as the will that destroys itself in pursuing it, a reading that preserves providence as a *problem* but not as a doctrine. Lewis Mumford's *Herman Melville* (1929) belongs to the same wave, and the revival's breadth is attested by the eighteen pages the EBSCO account says he gave *Clarel* [5]. Frank Jewett Mather, Jr., published in 1919 what the same account calls the best essay then on Melville, and Van Wyck Brooks noted that the name was suddenly \"in everyone's mouth\" after Weaver's biography, doubting the interest would last [5]. John Freeman's *Herman Melville* (1926) was the first British biography, and E. M. Forster, in *Aspects of the Novel* (1927), discussed *Moby-Dick* and then *Billy Budd* as a \"song not without words\" [4]. By 1928 Weaver called *Billy Budd* Melville's \"last word\" on human destiny, and Van Doren, reviewing *Shorter Novels of Herman Melville* in *The Nation*, declared the revival complete [4][6].\n\nThe revival thus fixed two frames that the later debate inherited. The first, which Weaver supplied, is the \"mystic\" frame: Melville is a religious genius whose spiritual career can be narrated and that ends, in *Billy Budd*, in a last word. The second, which Lawrence supplied, is the \"prophet of modernity\" frame: Melville anticipates the dissolution of Western spiritual order. Neither frame treats Melville as a theologian engaged with a spec
