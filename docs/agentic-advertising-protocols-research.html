/www.mediapost.com/publications/article/413127/iab-tech-labs-katsur-clears-the-air-on-agentic.html — Tier 5 (specialist trade). Katsur: ARTF/Agentic Audiences/Buyer-Seller Agent SDKs as AAMP pillars; ARTF \"cuts latency by 90%\"; Agent Registry trust layer launches March 1; \"certain agentic tasks do not scale without high-performance execution infrastructure.\" Accessed 2026-06-19."}, {"order": 7, "file": "07_Commerce_Payments.md", "title": "The Adjacent Agentic-Commerce and Payment Layer (the 'Other Standards')", "summary": "", "body": "# The Adjacent Agentic-Commerce and Payment Layer (the \"Other Standards\")\n\n## Bottom Line\n\nThe payment and commerce protocols that sit *beside* the advertising stack are not at war the way the advertising standards are (AdCP vs. ARTF/AAMP). They have largely settled into a **layered division of labor**, and by mid-2026 the trade press has compressed that settlement into a slogan: **\"MCP for tool integration, A2A for agent communication, UCP + AP2 for e-commerce\"** [1]. Anthropic's **Model Context Protocol (MCP)** is the substrate. Google's **Agent2Agent (A2A)** protocol — donated to the Linux Foundation in June 2025 — is how agents talk to each other. Google's **Agent Payments Protocol (AP2)** answers one question: *\"did a real human authorize this exact charge?\"* OpenAI/Stripe's **Agentic Commerce Protocol (ACP)** and Google's newer **Universal Commerce Protocol (UCP)** describe how an agent assembles and submits a cart. Coinbase's **x402** is a stablecoin rail for machine-to-machine micropayments. The card networks (Mastercard Agent Pay, Visa Intelligent Commerce, Amex's ACE kit) did **not** ship rival protocols — they shipped *credentials and liability terms* that plug **into** AP2/ACP/UCP.\n\nThe reality on the ground is messier than the slogan. **AP2's core innovation is the Mandate trust model** — three chained, cryptographically-signed records (Intent → Cart → Payment) that prove who authorized what, within what limits, and give the payment network visibility that an *agent*, not a human, initiated the charge [2][3]. That model is real, specified, and open-source (AP2 reached v0.2.0 on 28 April 2026 [4]). **ACP's checkout, by contrast, stumbled in market.** OpenAI's \"Instant Checkout\" launched 29 September 2025 with Etsy live and \"a million Shopify merchants coming soon.\" But by March 2026 only ~30 Shopify merchants were actually transacting; Walmart had pulled its ~200,000 SKUs out of OpenAI's checkout to run its own \"Sparky\" agent inside ChatGPT and Gemini instead; and OpenAI publicly retreated from owning the transaction toward owning *discovery* [5][6]. That gap — a clean spec versus a thin live-merchant base — is the single most important thing to carry away here. **Much is announced; less is shipping.**\n\nFor advertising, and for CTV specifically, the payment layer matters because it is the **back half of \"shoppable.\"** When an agent, not a human, browses and buys, the ad's job changes from *capturing attention* to *getting selected by the agent* — brands now compete on \"data quality, protocol compliance, and catalog completeness\" rather than creative and placement [7]. The advertising-native bridge is **AdCP** (the ad-buying protocol discussed earlier) plus emerging **ad surfaces inside the agents themselves** — OpenAI's ChatGPT ad pilot and Google's \"Direct Offers\" in AI Mode [1][8]. **Shoppable CTV is where this is least built out.** As of 2026, on-TV purchase via the remote has shipped (Roku Action Ads + Shopify via Roku Pay since 2023; YouTube on-TV shopping), but these are *human*-completed checkouts; what does not yet exist is a TV-resident *agent* completing an AP2 Cart Mandate autonomously, and many shoppable units still fall back to a QR code or send-to-phone hand-off [9][10]. The rails exist; the agent-driven living-room buy has not yet been wired to them. The trust, liability, and brand-safety questions — who pays when an agent buys the wrong thing, whose chargeback it is, whether an ad-supported AI surface is serving an agent or a human — are live and only partially answered. The clearest answer so far is Amex's April 2026 pledge to cover errors by *registered* agents [11].\n\n---\n\n## 1. Why a Payment Layer Exists at All: the Problem Agents Broke\n\n**So what:** Every existing payment system silently assumes a human is clicking \"buy\" on a trusted screen. Autonomous agents break that assumption. The whole payment-and-commerce protocol scramble of 2025–26 is one thing: the industry rebuilding the missing trust layer.\n\nGoogle's AP2 announcement states the problem precisely: *\"While today's payment systems generally assume a human is directly clicking 'buy' on a trusted surface, the rise of autonomous agents and their ability to initiate a payment breaks this fundamental assumption\"* [2]. The blog frames the gap as three questions the old plumbing can no longer answer once a model is in the loop [2]:\n\n- **Authorization** — *\"Proving that a user gave an agent the specific authority to make a particular purchase.\"*\n- **Authenticity** — *\"Enabling a merchant to be sure that an agent's request accurately reflects the user's true intent.\"*\n- **Accountability** — *\"Determining accountability if a fraudulent or incorrect transaction occurs.\"*\n\nThese are not abstract problems. A card-not-present transaction relies on signals — IP address, device fingerprint, navigation path — that, in an agentic flow, *\"were generated by an agent, not a human, making it harder to establish the clear link between a customer and a purchase that issuers expect\"* [12]. So the entire commerce-and-payment protocol layer exists to manufacture a *new* trust signal — a cryptographically signed record of human authorization — to replace the implicit one a human-at-a-keyboard used to provide.\n\nThis is the connective tissue to the advertising side of the story. The advertising protocols (AdCP, ARTF) automate *how an ad gets discovered, negotiated, and bought by an agent*. The commerce/payment protocols automate *how the thing the ad was selling gets paid for by an agent*. In a fully shoppable, fully agentic future, one agent runs both legs: it sees the CTV ad, decides, and pays. That is why these \"other standards\" belong in the same story.\n\n---\n\n## 2. The Layer Cake: How the \"Other Standards\" Fit Together\n\n**So what:** The payment/commerce protocols are mostly *complementary layers*, not substitutes. Reading them as a single competitive cage match — the natural instinct after the advertising standards war — is the most common analytical error. The real contest is narrower: mostly Google vs. OpenAI over the *commerce/checkout* layer, with the card networks and Coinbase supplying rails underneath both.\n\nBy April 2026 the trade press had converged on an explicit stack [1]:\n\n| Layer | Job | Dominant standard(s) | Steward |\n|---|---|---|---|\n| **Tool/data integration** | Let a model call external tools, data, and APIs | **MCP** (Model Context Protocol) | Anthropic (open-sourced Nov 2024) |\n| **Agent-to-agent communication** | Let agents from different vendors discover and task each other | **A2A** (Agent2Agent) | Linux Foundation (donated by Google, June 2025) |\n| **Advertising transaction** | Let agents discover/negotiate/buy ad inventory | **AdCP** vs. **ARTF/AAMP** *(the standards war, discussed elsewhere)* | AdCP working group vs. IAB Tech Lab |\n| **Commerce / checkout** | Let an agent assemble a cart and submit an order to a merchant | **ACP** (OpenAI/Stripe), **UCP** (Google + retailers) | OpenAI+Stripe; Google+retail council |\n| **Payment authorization / trust** | Prove a human authorized this exact charge; carry liability | **AP2** (Mandates) | Google + payments coalition |\n| **Settlement rail** | Move the money | Card networks (Visa/Mastercard/Amex tokens), bank transfer, **x402** (stablecoin) | Card networks; x402 Foundation (Linux Foundation) |\n\nThe Adweek field guide's synthesis of the emerging consensus — *\"MCP for tool integration, A2A for agent communication, UCP + AP2 for e-commerce\"* [1] — is the cleanest statement of how the layer is settling. Two things stand out. First, the *advertising* transaction layer (AdCP/ARTF) is genuinely contested in a way the *commerce/payment* layers mostly are not. Second, even within commerce, the live fight is **OpenAI's ACP vs. Google's UCP** over who defines the merchant-checkout schema — with AP2 sitting *under both* as the payment-trust layer, and the card networks supplying credentials to *all* of them.\n\n**Decode of every acronym used above:**\n- **MCP** — Model Context Protocol; the open standard that lets an AI model connect to external tools and data without a custom integration per tool.\n- **A2A** — Agent2Agent; the protocol that lets agents built by different vendors discover and delegate tasks to each other.\n- **AdCP** — Ad Context Protocol; the agent-native advertising-transaction protocol built on MCP.\n- **ARTF / AAMP** — the IAB Tech Lab's rival agentic-advertising effort.\n- **ACP** — Agentic Commerce Protocol; OpenAI + Stripe's standard for an agent to check out at a merchant.\n- **UCP** — Universal Commerce Protocol; Google + retailers' standard for agents across discovery → purchase → post-purchase.\n- **AP2** — Agent Payments Protocol; Google's payment-authorization/trust layer (the Mandate model).\n- **x402** — an HTTP-native stablecoin payment standard for machine-to-machine payments.\n- **MoR** — Merchant of Record; the entity legally responsible for a transaction (and its chargebacks).\n\n---\n\n## 3. AP2: the Mandate Trust Model in Depth\n\n**So what:** AP2 is the most important \"other standard\" here because it *solves the trust problem* the whole layer exists for — and it does so with a mechanism, chained signed Mandates, that the rest of the stack (including the card networks) has chosen to plug into rather than replace.\n\n### 3.1 What was announced, and by whom\n\nGoogle announced AP2 on **16 September 2025** with **more than 60 partner organizations** [2][13]. The named launch roster in Google's own post includes Mastercard, PayPal, American Express, JCB, UnionPay International, Adyen, Worldpay, Coinbase, Salesforce, ServiceNow, Intuit, Okta, Revolut, Etsy, Shopify(-adjacent), Accenture, Deloitte, PwC, and crypto-infrastructure names (MetaMask, Lightspark, Mysten Labs, Eigen Labs, Crossmint, BVNK) [2]. An independent trade outlet, Digital Commerce 360, corroborated \"more than 60\" partners and independently named Mastercard, PayPal, American Express, Coinbase, Salesforce, Shopify, Cloudflare, and Etsy [13] — but did not independently confirm Adyen or Worldpay in its own reporting [13]. **Treat the full 60+ list as a vendor claim corroborated only in part.**\n\nAP2 is open-source. Google published the spec, docs, and reference implementations on a public GitHub repository (`goo.gle/ap2`) and committed to evolving it *\"in an open, collaborative process, including through standards bodies\"* [2]. The repository confirms a **v0.2.0 release dated 28 April 2026** — the spec is versioned and moving. That is itself worth a flag: the Mandate terminology has already shifted between the September 2025 announcement and the spec site (see §3.3) [4][14].\n\n### 3.2 The three-Mandate model (the canonical framing)\n\nAP2's core abstraction is the **Mandate** — *\"tamper-proof, cryptographically-signed digital contracts that serve as verifiable proof of a user's instructions … signed by verifiable credentials (VCs) and act as the foundational evidence for every transaction\"* [2]. The widely-cited three-Mandate chain runs as follows [2][3]:\n\n1. **Intent Mandate** — captures what the user *wants*: the natural-language request plus hard constraints (max price, item specifications, allowed merchants, an expiry/TTL, and a reference to the agent's identity). For delegated (\"human-not-present\") tasks it sets *\"price limits, timing, and other conditions\"* up front [2][3]. This is the rules-of-engagement record.\n2. **Cart Mandate** — captures what the agent *assembled*. After the agent presents a specific cart, the user's approval signs the Cart Mandate, creating *\"a secure, unchangeable record of the exact items and price, ensuring what you see is what you pay for\"* [2][3]. This binds the order to the intent.\n3. **Payment Mandate** — captures what is actually *charged*. It carries the authorized amount, the funding-instrument reference (card token, wallet address, bank token), and a hash linking back to the matched Intent and Cart. Per a technical explainer, *\"this is what Mastercard or Coinbase actually sees and authorizes\"* [3]. This is the record that travels to the payment network, giving the network explicit visibility that **an agent, not a human, initiated the transaction** — exactly the signal issuers need for risk-scoring and dispute handling.\n\nTogether, the chain forms *\"a non-repudiable audit trail of who authorized what, within what limits\"* [3] — and, per the spec, *\"a complete, verifiable audit trail for both human-present and human-not-present transactions\"* [14].\n\n### 3.3 A wrinkle worth flagging: the spec already renamed the Mandates\n\nThe September 2025 announcement and most explainers use **Intent / Cart / Payment**. But by mid-2026 the live spec site (`ap2-protocol.org`) describes the model in terms of a **Checkout Mandate** and a **Payment Mandate**, each with **Open** and **Closed** states — for example, a Payment Mandate (Open) that *\"captures the user's constraints on payment (e.g., budget, allowed instruments) for autonomous execution\"* and a Payment Mandate (Closed) that *\"captures the authorization for a specific transaction amount bound to a finalized checkout\"* [14]. The Payment Mandate is *\"shared with the Credential Provider, Networks and the Merchant Payment Processor\"* — the network-visibility design is written into the spec [14]. **The conceptual model (intent → cart/checkout → payment, with networks seeing the payment record) is stable; the exact noun-set is not.** Treat \"the three Mandates\" as the durable idea, and check the live spec for current naming.\n\n### 3.4 How AP2 relates to MCP and A2A\n\nAP2 is explicitly *\"an extension of the Agent2Agent (A2A) protocol and Model Context Protocol (MCP)\"* [2]. It is not a free-floating payment system; it rides the agent-communication and tool layers. AP2 also ships an **A2A x402 extension** for crypto/stablecoin payments, *\"developed in collaboration with Coinbase, Ethereum Foundation, MetaMask and other leading organizations\"* [2] — the formal bridge between AP2's Mandate trust model and the x402 stablecoin rail (§6).\n\nAP2 is **payment-rail-agnostic**: Google describes it as *\"a universal protocol, providing security and trust for a variety of payments\"* spanning credit/debit cards, real-time bank transfers, and *\"stablecoins and cryptocurrencies\"* [2]. The Mandate layer proves *who authorized what*; the rail underneath moves the money.\n\n---\n\n## 4. ACP: OpenAI + Stripe's Commerce Protocol — and Its Hard Landing\n\n**So what:** ACP is the most visible *commerce* (checkout) protocol because it powers buying inside ChatGPT. But its real-world adoption is the clearest case study in \"announced vs. shipping.\" The spec is clean and open. The live-merchant base, eighteen months in, is thin — and OpenAI is retreating from owning checkout.\n\n### 4.1 What it is and when it shipped\n\nThe **Agentic Commerce Protocol (ACP)** was announced on **29 September 2025**, *\"codeveloped by Stripe and OpenAI\"* [15][16]. It launched as the standard behind **\"Instant Checkout in ChatGPT,\"** which let US ChatGPT users buy from US Etsy sellers directly in chat, with *\"over a million Shopify merchants … coming soon\"* (Glossier, Vuori, Spanx, SKIMS named) [15][16]. ACP is **open source under Apache 2.0** and *\"community-designed,\"* maintained by OpenAI and Stripe as founding maintainers, and *\"currently in beta\"* [15][16][17].\n\nTechnically, ACP defines composable building blocks [15][17]:\n- **Agentic Checkout** — cart management, fulfillment options, payment processing.\n- **Product Feed / Cart APIs** — how an agent browses a merchant's catalog.\n- **Delegated Payment Spec / shared payment token** — the merchant *\"receives a checkout request and secure payment credential details from the AI agent\"* and can *\"accept or decline\"*; the payment provider relays credentials via a *\"secure token … programmatically controlled, permissioned, and logged\"* [15]. Crucially, the merchant stays in control of *\"what's sold, how their brand shows up, and how orders are fulfilled\"* [16] and remains the merchant of record.\n\nBy the **2026-04-17 spec snapshot**, ACP had added Orders, Authentication, a Seller-Backed Payment Handler, a discount extension, and — significantly — **MCP integration** [17]. ACP uses date-based versioning (YYYY-MM-DD) [17].\n\n### 4.2 The hard landing\n\nThe headline-vs-reality gap is stark. By **March 2026**, six months after debut [5][6]:\n- **Product selection in Instant Checkout was still limited** and *\"didn't always show up-to-date item information\"* [5].\n- **Merchant onboarding was an \"arduous process,\"** and *roughly **30 Shopify merchants*** were actually live via Instant Checkout — against the \"million coming soon\" announced [5].\n- **Walmart pulled out.** Walmart had made ~200,000 products buyable in ChatGPT, but *\"is pulling the plug on OpenAI's Instant Checkout feature after it failed to gain traction,\"* and is instead embedding its homegrown **Sparky** chatbot directly into ChatGPT *and* Google Gemini [5] — a major retailer choosing to run its own agent rather than cede checkout to OpenAI's protocol.\n- **OpenAI publicly pivoted.** OpenAI found the first version of Instant Checkout *\"did not offer the level of flexibility that it aspires to provide,\"* so it is *\"allowing merchants to use their own checkout experiences while focusing efforts on product discovery\"* [5][6].\n\nThat retreat — from *owning the transaction* to *owning discovery* — is the strategic hinge that makes the advertising connection real (§7). If the agent platform's value is steering *which* product the user discovers, then its monetization is **advertising**, not a checkout take-rate.\n\n*Note on conflicting dates:* some explainers cite an ACP \"October 2024\" origin or a \"16 February 2026\" launch [5]. The primary sources are unambiguous that the **protocol + Instant Checkout were announced 29 September 2025** [15][16]. The February 2026 date refers to a later Shopify-merchant rollout phase, and \"October 2024\" appears to be a downstream error. The correct date is **29 September 2025**.\n\n---\n\n## 5. UCP: Google's Commerce Protocol and the Real Commerce-Layer Fight\n\n**So what:** The genuine *commerce-layer* rivalry is not \"AP2 vs. ACP\" — those sit at different layers. It is **Google's UCP vs. OpenAI's ACP** over who owns the merchant-checkout schema. By mid-2026 the trade press calls UCP *\"by and far the most dominant commerce protocol\"* — a striking reversal of ACP's first-mover lead.\n\nThe **Universal Commerce Protocol (UCP)** was announced by Google on **11 January 2026** as *\"an open standard enabling AI agents to operate across the complete shopping experience — discovery, purchasing, and post-purchase support\"* [8]. It was co-developed with major retailers — **Shopify, Etsy, Wayfair, Target, and Walmart** — and endorsed by 20+ companies including Adyen, American Express, Best Buy, Flipkart, Macy's, Mastercard, Stripe, The Home Depot, Visa, and Zalando [8].\n\nUCP is positioned as *complementary*, not rival, to the trust/communication layers: it is *\"compatible with existing industry protocols like Agent2Agent (A2A), Agent Payments Protocol (AP2) and Model Context Protocol (MCP)\"* [8]. UCP describes the *commerce journey*; AP2 underwrites the *payment*; A2A/MCP carry the *communication*. The collision is specifically with **ACP**, the other commerce-journey schema.\n\nBy **April 2026**, per Adweek, **Amazon, Meta, Microsoft, Salesforce, and Stripe all joined the UCP Tech Council** — and the guide flatly states *\"Today, UCP is by and far the most dominant commerce protocol\"* [1]. Stripe appearing on both ACP-maintainer and UCP-council rosters is a tell: the rails providers are hedging across both commerce schemas. \"Most dominant\" is the explainer's framing, and momentum claims in a fast-moving standards race go stale fast — but the membership facts (who joined which council, and when) corroborate that UCP gained real coalition weight in its first quarter.\n\n**The CTV/retail-media relevance:** Walmart, Target, Best Buy, Home Depot, and Macy's are *retail-media-network operators* — the same companies building shoppable-CTV and commerce-media businesses. Their alignment behind UCP, alongside Walmart's simultaneous exit from OpenAI's checkout, suggests the *retail-and-commerce-media establishment* is consolidating around Google's commerce schema. That hints at where shoppable-CTV transactions eventually route.\n\n---\n\n## 6. x402: the Stablecoin Rail for Machine-Native Payments\n\n**So what:** x402 is not a commerce protocol — it is a *settlement rail* optimized for the one thing card networks handle poorly: tiny, instant, fully-automated machine-to-machine payments (pay-per-API-call, pay-per-inference, metered content). It matters here because AP2 and the broader stack explicitly designate it the **default stablecoin rail**, and it has been folded into the same neutral-governance pattern (Linux Foundation) as A2A.\n\n**x402** revives the dormant **HTTP 402 (\"Payment Required\")** status code as a working settlement layer. Coinbase released the x402 whitepaper on **6 May 2025** [18][19]. The flow is a four-step request/response cycle: the client calls a paywalled endpoint, the server returns **402** with payment terms, the client signs a stablecoin transfer authorization, and the client retries the request with the signed payload in a header [20]. It is *\"designed for machines, APIs and agents rather than humans — its entire purpose is to remove the need for human intervention in internet payments\"* [19]. No human ever touches it.\n\n- **Chains/assets:** most implementations use **USDC** (a regulated dollar stablecoin), commonly on **Base** (Coinbase's L2), with support across Solana and Ethereum; Solana reported driving *\"nearly 65% of x402 transaction volume\"* in 2026 [19][21].\n- **AP2 integration:** Google integrated x402 into AP2 as the **default stablecoin rail** via the A2A x402 extension [2][20].\n- **Governance:** On **2 April 2026**, the Linux Foundation launched the **x402 Foundation** at the MCP Dev Summit North America, with 20+ members — Adyen, AWS, American Express, Base, Circle, Cloudflare, Coinbase, Fiserv, Google, KakaoPay, Mastercard, Microsoft, Polygon Labs, PPRO, Shopify, Sierra, Solana Foundation, Stripe, thirdweb, and Visa [21][22]. This mirrors A2A's Google-to-Linux-Foundation handoff: contributing the standard to neutral governance to win cross-industry adoption.\n\n**Advertising relevance:** x402's natural first use is *metered, automated micropayments* — exactly the shape of programmatic ad-buying and pay-per-content/pay-per-inference flows. If agentic ad transactions ever settle in real time at the impression or outcome level (AdCP's \"transact on audience segments, engagement rates, or brand-lift outcomes\" vision — §7), x402-style rails are a plausible settlement layer. **This is forward-looking, not shipping.** There is no evidence yet of x402 settling ad buys at scale; flagged as inference.\n\n---\n\n## 7. How Advertising Plugs In: From Attention to Agent-Selection\n\n**So what:** When an agent, not a human, browses and buys, the economics of advertising invert. The ad's job stops being \"win the human's attention\" and starts being \"win the agent's selection.\" That reshapes what advertising *is* in three concrete, shipping-or-piloting ways: (a) ad-buying becomes agent-native (AdCP); (b) the agent surfaces themselves become ad inventory (ChatGPT ads, Google Direct Offers); (c) product data quality becomes the new \"creative.\"\n\n### 7.1 The inversion: agents as the audience\n\nIn agentic commerce, *\"brands compete for AI agent selection through data quality, protocol compliance, and catalog completeness\"* rather than design, advertising, and search ranking [7]. One commentator's distinction is sharp: *\"Traditional advertising influences human decisions, while [agent] ads would influence AI decisions that result in human purchases\"* [23]. Whoever owns the agent owns the choke point of discovery. That is why OpenAI's retreat from checkout *toward discovery* (§4.2) moves it *toward* the ad business, not away from monetization.\n\n### 7.2 The ad-buying bridge: AdCP\n\nThe advertising-native protocol discussed earlier, **AdCP** (Ad Context Protocol), is built on **MCP** and *\"other agent-to-agent (A2A) frameworks\"* [24]. It shares the *same substrate and communication layer* as the commerce/payment protocols. AdCP standardizes how agents *\"exchange structured data about audiences, inventory, and campaign objectives\"* and is pitched as *\"the OpenRTB for the AI era\"* [25]. The vision: an advertiser briefs an agent in plain language — *\"reach eco-conscious car buyers on connected TV in the U.S. this week\"* — and agents negotiate directly with publishers, transacting on *\"audience segments, engagement rates, or even brand-lift outcomes\"* rather than individual impressions [25]. AdCP launched **15 October 2025** with founding members Optable, PubMatic, Scope3, Swivel, Triton Digital, and Yahoo, and supporting members including LG Ads, Samba TV, and The Weather Company [24].\n\n**An important architectural gap:** as of 2026, AdCP **does not itself specify payment/settlement**. The Digiday explainer notes AdCP enables campaigns to *\"run inside a publisher's ad server or through private and curated marketplaces\"* but *\"leaves payment infrastructure unaddressed\"* [24]. That is the seam where the commerce/payment \"other standards\" connect: AdCP negotiates and buys the *ad*; AP2/x402-style layers could, in principle, settle it. **No evidence yet that AdCP buys settle over AP2 or x402** — flagged as inference / open question.\n\n### 7.3 The new inventory: ads inside the agents\n\nThe agent surfaces are themselves becoming ad inventory:\n- **OpenAI's ChatGPT ad pilot.** OpenAI rolled out an early **ChatGPT Ad Manager** interface for selected advertisers in **May 2026** [9]. Current inventory is limited to enterprise partnerships, with brands paying *\"for ad placement when they want their products featured when AI agents make shopping decisions\"* [23]. OpenAI has stated organic shopping results remain unsponsored [23] — a positioning claim worth watching as monetization pressure rises.\n- **Google \"Direct Offers\" in AI Mode.** Announced 11 January 2026, a Google Ads pilot letting retailers present exclusive discounts to high-intent shoppers in AI Mode, piloting with Petco, e.l.f. Cosmetics, Samsonite, Rugs USA, and Shopify merchants [8]. This is advertising natively fused with agentic discovery.\n\n### 7.4 The market size (for scale)\n\neMarketer (December 2025) projects **US e-commerce sales via AI platforms to exceed ~$20 billion in 2026** (≈$20.9B, nearly quadrupling 2025), rising to **$144 billion by 2029** [26][27]. Steep in growth terms, but still a small fraction of total e-commerce: the agentic-commerce-and-ads opportunity is real, fast-rising, and early. (eMarketer is a specialist research firm, and the figure is a projection, cited as such.)\n\n---\n\n## 8. The CTV Tie-In: Shoppable TV Is the Least-Wired Surface\n\n**So what:** Shoppable CTV is where the agentic-commerce rails *should* land — the living-room ad that becomes a purchase. Yet as of 2026 it is the **least connected** to the AP2/ACP/UCP stack. On-TV checkout itself is no longer purely a QR/send-to-phone hand-off — remote-controlled on-screen purchase has shipped (Roku Action Ads with Shopify via Roku Pay since 2023; YouTube on-TV shopping) — but those are *human*-completed checkouts; what does **not** yet exist is a TV-resident *agent* completing a signed AP2/ACP Mandate autonomously. The gap is the opportunity, and the forecast risk.\n\nAs for shoppable CTV itself: **shoppable CTV** (a.k.a. **T-commerce**) today means *\"connected TV advertising that makes it easier for viewers to take a buying action after seeing a streaming ad … through a QR code, a browseable product overlay, a send-to-phone prompt, or a product-feed-powered ad unit\"* [10]. The transaction still **typically completes on the phone** rather than the TV (though remote-based on-TV checkout via Roku Pay/Shopify and YouTube now exists) — and the behavioral data supports the phone bridge: per LG Ad Solutions, *71% of CTV viewers always have their phone nearby* and *62% are open to scanning a QR code to check out on mobile* [28].\n\nHere is the crux: **the agentic-commerce stack assumes an agent at the point of purchase, but the CTV purchase point is currently a human with a phone.** The \"agentic CTV buy\" that would close the loop — a household assistant that sees the shoppable ad, applies an Intent Mandate (\"buy running shoes under $150\"), assembles a Cart Mandate, and settles via a Payment Mandate — is **not yet a shipping product** anywhere. Industry forecasts gesture at *\"voice-activated shopping\"* and *\"AR overlays\"* becoming standard on Roku and Amazon shoppable units [10], and Amazon's Ads MCP and Prime Video integration is the most plausible near-term path: Amazon controls the device, the catalog, the agent, *and* the payment credential. But the present-tense status is plain. **Shoppable CTV is real; agentic-checkout CTV is announced and aspirational, not yet live.** This is the single biggest \"future, not present\" item in the whole account.\n\nThe retail-media alignment from §5 (Walmart, Target, Best Buy, Home Depot behind UCP) suggests *where* an eventual agentic-CTV transaction would route — through retailer commerce-media stacks plus Google's UCP schema. But that is a trajectory, not a shipped fact.\n\n---\n\n## 9. Trust, Liability, Identity, and Brand Safety\n\n**So what:** The hardest unsolved problem in agent-mediated buying is not the plumbing — it is *who is responsible when the agent gets it wrong.* The protocols supply *evidence* (signed Mandates, tokens); they do not by themselves resolve *liability.* The current answer is a patchwork: the merchant stays on the hook, the card networks are adding agent-aware credentials, and one issuer (Amex) has put a partial guarantee on the table.\n\n### 9.1 Liability: the merchant still holds the bag (mostly)\n\nAcross the proposed protocols *\"the merchant remains the [Merchant of Record]\"* and *\"still owns the fraud exposure\"* — agentic payments *\"do not remove the merchant's responsibility to manage fraud, absorb chargebacks, and handle regulatory consequences — they often increase it\"* [12]. If an agent misreads intent and orders the wrong item, *\"the merchant is likely to be held liable for the return and the chargeback\"* [12]. The chargeback-defense playbook breaks because the IP/device/navigation evidence was agent-generated, not human [12]. *(This characterization comes from a fintech analyst source [12]; treat the framing as informed analysis rather than primary fact, but the underlying logic — MoR liability is unchanged by an agent intermediary — is consistent across sources.)*\n\nA reported metric sometimes cited: disputes on agent-initiated transactions running *\"roughly 2.4x the rate of comparable human-initiated card-not-present transactions,\"* with a different mix (fewer pure-fraud, more \"did not authorize\" and \"not as described\"). But **this 2.4x figure does not actually appear in the cited Boboev post** [12]; it traces at most to a separate, unattributed analyst write-up. It is uncorroborated and should not be treated as established — noted here only to flag that an elevated agent-dispute rate is *claimed*, not measured.\n\n### 9.2 The card networks: credentials and a liability pledge, not rival protocols\n\nThe card networks did **not** ship competing protocols — they shipped *agent-aware credentials and liability terms* that plug into AP2/ACP/UCP:\n- **Mastercard Agent Pay** (announced **29 April 2025**) lets verified AI agents transact via **Agentic Tokens**, an extension of Mastercard Digital Enablement Service (MDES) that binds a tokenized card to a specific agent, merchant scope, and consent policy, so a model can check out *\"without ever holding the raw card number\"* [29].\n- **Visa Intelligent Commerce** issues scoped tokenized credentials to agents with issuer-side authentication for machine-initiated payments, plus **Intelligent Commerce Connect** — a single merchant integration that connects *\"both Visa Intelligent Commerce APIs and other networks' APIs\"* and integrates LLM platforms including Anthropic, OpenAI, and Microsoft [30].\n- **American Express ACE.** On **14 April 2026** Amex launched the **Agentic Commerce Experiences (ACE) Developer Kit** with an **industry-first purchase-protection pledge**: if a cardholder authorizes a *registered* agent and that agent sends Amex the *\"authenticated purchase intent,\"* Amex *\"will protect eligible customers from charges related to AI agent error\"* [11][31]. Initial partners: Adyen, Stripe, PayPal, Fiserv; merchants Delta, Expedia, Hilton [11][31]. This is the clearest market answer yet to \"who pays when the agent is wrong\" — but it is *conditional* (registered agents, authenticated intent) and *issuer-specific*.\n\nThe pattern holds. AP2 supplies the *trust evidence layer* (Mandates); the networks supply the *credential and liability layer* (scoped tokens plus protection terms) that consumes that evidence. They are complements, not competitors.\n\n### 9.3 Brand safety: agents as traffic, and agents as buyers\n\nTwo distinct brand-safety problems emerge. First, **agent traffic vs. human attention**: as agents do more browsing, advertisers must distinguish ad exposure delivered to a *bot acting for a human* from wasted or fraudulent bot traffic — the Brand Safety Institute frames \"agentic traffic\" as a new measurement and verification category [32]. Second, **architecture-level guardrails on the buying agent**: the stronger agentic-commerce platforms *\"enforce brand safety at the architecture level,\"* with configurable restrictions on what agents can say or offer, real-time QA, audit logs of every agent action, and confidence thresholds that defer to a human [7]. For CTV specifically, this folds back into the broader brand-safety question: an agent transacting on \"brand-lift outcomes\" (§7.2) raises the question of *what context the impression actually ran in* when no human verified it.\n\n### 9.4 Regulation and privacy\n\nThe regulatory picture is **early and under-corroborated**. Liability analysts argue agent-initiated card transactions fall within the existing dispute-and-chargeback regime (Regulation Z / TILA in the US) and that consumer recourse is *narrowed but not extinguished* by a properly scoped mandate [12]. **However**, a specific \"CFPB January 2026 advisory on autonomous-agent purchases\" cited in one analyst source could **not be independently verified** against CFPB's own published rules/advisories, and should be treated as uncorroborated — present-tense regulatory claims about a fast-moving area are exactly what goes stale or proves overstated. Two things *can* be said with confidence: (a) the existing card-dispute framework is the default backstop until agent-specific rules emerge; (b) the protocols' heavy emphasis on cryptographic mandates and audit trails (AP2's VCs, ACP's logged tokens) is, in part, a pre-emptive answer to anticipated consent/liability regulation. Privacy implications — an agent carrying a persistent, cross-merchant record of a user's purchasing intent — are real and largely unaddressed in the primary specs; that remains an open question.\n\n---\n\n## 10. Genuinely Interoperable Standards, or Competing Land-Grabs?\n\n**So what:** Both — but at different layers. The *trust and communication layers* (MCP, A2A, AP2, x402) are converging on genuine, neutrally-governed interoperability. The *commerce/checkout layer* is a real land-grab — **Google's UCP vs. OpenAI's ACP** — because whoever defines the merchant-checkout schema sits closest to the discovery and advertising money. The card networks are deliberately *not* fighting a protocol war; they are selling rails and liability into whoever wins.\n\nThe evidence for **convergence at the lower layers**:\n- A2A and x402 were both **donated to the Linux Foundation** (June 2025; April 2026) — a deliberate move to neutral governance to win cross-vendor trust [21][22].\n- AP2 is built as an **extension of A2A and MCP**, not a replacement [2], and is explicitly *payment-rail-agnostic* [2].\n- The card networks (Visa, Mastercard, Amex) and Stripe appear on *multiple* coalition rosters (AP2, UCP council, x402 Foundation, ACP) — the rails providers are integrating with *everyone* rather than backing one [1][21][29][30].\n- The mid-2026 trade consensus — *\"MCP for tool integration, A2A for agent communication, UCP + AP2 for e-commerce\"* [1] — is itself evidence that the layering has been broadly accepted.\n\nThe evidence for a **land-grab at the commerce layer**:\n- Google launched **UCP** (Jan 2026) directly into the space ACP had occupied since Sept 2025, recruited the major retailers and the rival platforms' rails, and by April 2026 had Amazon, Meta, Microsoft, Salesforce, and Stripe on its Tech Council [1][8].\n- OpenAI's ACP checkout **stumbled** (≈30 live Shopify merchants, Walmart exit) and OpenAI **retreated to discovery** [5][6] — that is, toward the *advertising* monetization layer, where it competes with Google head-on.\n- Walmart running **its own agent (Sparky)** inside *both* ChatGPT and Gemini [5] shows large retailers refusing to cede the checkout layer to any single platform's protocol — a fragmentation risk that could keep the commerce layer contested for years.\n\n**The honest bottom line on \"shipping vs. announced\":** the *specs* are real and open (AP2 v0.2.0; ACP date-versioned; x402 in production for crypto micropayments). The *trust/communication layer* is genuinely interoperable. The *commerce-checkout layer* is a live two-horse race with thin real-world merchant adoption so far. And the *CTV/shoppable* connection — the payoff these pages care about — is the least built of all: announced in vision, not shipping in product.\n\n---\n\n## Open Questions\n\n1. **Does AdCP settle over AP2/x402?** AdCP buys the ad but \"leaves payment infrastructure unaddressed\" [24]. Will the advertising and commerce/payment \"other standards\" actually interconnect at settlement, or stay parallel? No evidence of integration yet.\n2. **Who wins the commerce-checkout layer — UCP or ACP — and does it matter once retailers (Walmart/Sparky) run their own agents?** The fragmentation risk could leave *no* dominant checkout schema.\n3. **When, if ever, does an agent complete a CTV purchase end-to-end on the TV** rather than via QR/send-to-phone? Amazon (device + catalog + agent + credential) is the most plausible first mover — but no shipping product was found.\n4. **Is the \"2.4x dispute rate\" real?** Single-source and uncorroborated; needs a primary/network dataset.\n5. **Did the CFPB actually issue a 2026 agent-purchase advisory?** Could not be verified against CFPB's published record; the regulatory posture on agent-initiated transactions remains genuinely unsettled.\n6. **How will ad-supported agent surfaces disclose sponsorship** when the \"viewer\" is an agent? OpenAI says results are organic today [23] — does that survive monetization pressure, and what does \"disclosure to an agent\" even mean?\n7. **Privacy of the cross-merchant intent record.** An agent holding a persistent, signed record of a user's purchasing intent across merchants is a novel privacy surface the specs don't address.\n8. **Stablecoin settlement of ad/commerce at scale.** x402 is in production for crypto micropayments [19][21], but is it settling mainstream retail or ad transactions, or staying in the crypto/API-metering niche?\n\n---\n\n## Sources\n\n1. **Adweek**, \"A Guide to the New, Wide World of Agentic Advertising and Commerce Protocols,\" 2026 (accessed via search 2026-06-19; full text 403-blocked, summarized via search index). *Tier 5 — specialist trade explainer; the \"MCP/A2A/UCP+AP2\" consensus framing and UCP-dominance characterization are the outlet's synthesis, cited as such.* https://www.adweek.com/media/a-guide-to-the-new-wide-world-of-agentic-advertising-and-commerce-protocols/\n2. **Google Cloud Blog**, \"Announcing Agent Payments Protocol (AP2),\" 2025-09-16. *Tier 1 — primary vendor announcement/spec source; partner list and self-description are vendor claims, corroborated in part by [13].* https://cloud.google.com/blog/products/ai-machine-learning/announcing-agents-to-payments-ap2-protocol\n3. **Technical explainer (search-indexed; AP2 mandate definitions)**, 2025–26. *Tier 5 — explainer corroborating the Intel/Cart/Payment three-Mandate structure and the \"what Mastercard/Coinbase sees\" framing; used alongside [2][14].*\n4. **GitHub — google-agentic-commerce/AP2 repository**, v0.2.0 release 2026-04-28 (accessed 2026-06-19). *Tier 1 — primary repo; version/date.* https://github.com/google-agentic-commerce/AP2\n5. **CNBC**, \"OpenAI's first crack at online shopping stumbled. It's preparing for the next wave,\" 2026-03-20 (full text 403-blocked; summarized via search index el.html\n12. **Sam Boboev (Fintech Wrap Up / Finextra)**, \"Deep Dive: The hidden liability of agentic commerce,\" 2026. *Tier 5/6 — fintech analyst; MoR-liability logic, chargeback-evidence breakdown, the (single-source, uncorroborated) 2.4x dispute figure and the (unverified) CFPB-advisory claim — all flagged in-text.* https://www.finextra.com/blogposting/31251/deep-dive-the-hidden-liability-of-agentic-commerce\n13. **Digital Commerce 360**, \"Google launches payments protocol for AI commerce, names dozens of partners,\" 2025-09-19. *Tier 5 — independent trade outlet corroborating AP2 date, \"more than 60\" partners, and a partial partner list (notably did not name Adyen/Worldpay).* https://www.digitalcommerce360.com/2025/09/19/google-ai-payments-protocol-ap2/\n14. **ap2-protocol.org (AP2 spec site)**, 2026 (accessed via search index; direct fetch 403-blocked). *Tier 1 — primary spec; Checkout/Payment Mandate (Open/Closed) terminology, \"shared with the Credential Provider, Networks and the Merchant Payment Processor,\" VC audit-trail language.* https://ap2-protocol.org/\n15. **Stripe Blog/Newsroom**, \"Developing an open standard for agentic commerce\" / \"Stripe powers Instant Checkout in ChatGPT and releases Agentic Commerce Protocol,\" 2025-09-29. *Tier 1 — primary co-developer announcement; ACP date, Etsy/Shopify merchants, Apache 2.0, payment-delegation mechanics.* https://stripe.com/blog/developing-an-open-standard-for-agentic-commerce ; https://stripe.com/newsroom/news/stripe-openai-instant-checkout\n16. **OpenAI**, \"Buy it in ChatGPT: Instant Checkout and the Agentic Commerce Protocol,\" 2025-09-29 (full text 403-blocked; corroborated via [15] and search index). *Tier 1 — primary co-developer announcement.* https://openai.com/index/buy-it-in-chatgpt/\n17. **GitHub — agentic-commerce-protocol/agentic-commerce-protocol**, latest spec 2026-04-17, beta (accessed 2026-06-19). *Tier 1 — primary spec repo; maintainers (OpenAI+Stripe), components, date-versioning, MCP integration added.* https://github.com/agentic-commerce-protocol/agentic-commerce-protocol\n18. **Coinbase**, \"Introducing x402: a new standard for internet-native payments,\" 2025-05-06 (whitepaper). *Tier 1 — primary; x402 origin date and design.* https://www.coinbase.com/developer-platform/discover/launches/x402\n19. **The Block / BingX / Allium (search-indexed)**, 2025–26. *Tier 4/5 — x402 launch (May 6 2025), USDC/Base/Solana, \"hundreds of millions of transactions,\" machine-native design.* https://www.theblock.co/learn/391983/what-is-coinbases-x402-protocol\n20. **eco.com support / x402 explainers (search-indexed)**, 2025–26. *Tier 5/6 — four-step 402 flow; AP2-as-default-stablecoin-rail framing; cited as mechanism explanation, corroborated by [2].* https://eco.com/support/en/articles/12328618-x402-protocol-explained-how-ai-agents-pay-onchain\n21. **Linux Foundation press release**, \"Linux Foundation is Launching the x402 Foundation and Welcoming the Contribution of the x402 Protocol,\" 2026-04-02. *Tier 1 — primary; x402 Foundation launch date, full 20+ member list, Solana 65%-volume claim.* https://www.linuxfoundation.org/press/linux-foundation-is-launching-the-x402-foundation-and-welcoming-the-contribution-of-the-x402-protocol\n22. **Linux Foundation press release**, \"Linux Foundation Launches the Agent2Agent Protocol Project,\" 2025-06 / Google Developers Blog, \"Google Cloud donates A2A to Linux Foundation,\" 2025-06. *Tier 1 — primary; A2A donation, Agent Cards/Tasks/transport, 150+ orgs by 2026-04.* https://www.linuxfoundation.org/press/linux-foundation-launches-the-agent2agent-protocol-project-to-enable-secure-intelligent-communication-between-ai-agents\n23. **Marketing trade coverage (Ad Age / Yotpo / Ryze, search-indexed)**, 2026. *Tier 5/6 — \"agents as the audience,\" brands pay for placement, OpenAI's \"organic results\" positioning; cited as framing/position.* https://adage.com/technology/ai/aa-openai-ads-brands-agencies/\n24. **Digiday**, \"WTF is Ad Context Protocol (AdCP)?,\" 2025-10-15 (summarized via search index). *Tier 4/5 — AdCP built on MCP/A2A, \"leaves payment infrastructure unaddressed,\" founding/supporting members.* https://digiday.com/media-buying/wtf-ad-context-protocol/\n25. **AdExchanger**, \"The Ad Context Protocol Aims To Make Sense Of Agentic Ad Demand,\" 2025–26 (search-indexed). *Tier 5 — AdCP \"OpenRTB for the AI era,\" the plain-language CTV brief example, transact-on-outcomes vision.* https://www.adexchanger.com/marketers/the-ad-context-protocol-aims-to-make-sense-of-agentic-ad-demand/\n26. **eMarketer**, \"US Ecommerce Sales via AI Platforms Will Exceed $20 Billion in 2026, Top $144 Billion by 2029,\" 2025-12 (chart, login-gated; figure via search index). *Tier 5 — specialist research projection, cited as projection.* https://www.emarketer.com/chart/c/358389/\n27. **commercetools / multiple (search-indexed) citing eMarketer Dec 2025**, 2026. *Tier 5 — corroborates the $20.9B 2026 / quadrupling figure.* https://commercetools.com/blog/ai-trends-shaping-agentic-commerce\n28. **LG Ad Solutions data (via shoppable-CTV explainers)**, 2026. *Tier 5 — 71% phone-nearby, 62% QR-checkout-open; the second-screen behavior underpinning current shoppable-CTV.*\n29. **Mastercard Newsroom**, \"Mastercard unveils Agent Pay,\" 2025-04-29. *Tier 1 — primary announcement (claim); Agent Pay, Agentic Tokens on MDES.* https://www.mastercard.com/us/en/news-and-trends/press/2025/april/mastercard-unveils-agent-pay-pioneering-agentic-payments-technology-to-power-commerce-in-the-age-of-ai.html\n30. **Visa / TechInformed**, \"Visa opens one integration for AI agent payments\" (Visa Intelligent Commerce + Intelligent Commerce Connect), 2026. *Tier 4/5 — scoped tokenized credentials, LLM integrations (Anthropic/OpenAI/Microsoft), single-integration product.* https://techinformed.com/visa-opens-one-integration-for-ai-agent-payments/\n31. **Fortune** / **Digital Commerce 360**, \"American Express unveils tools for AI developers—and pledges to pay the price when agents go awry,\" 2026-04-14. *Tier 4/5 — independent corroboration of Amex ACE kit, purchase-protection pledge, partners (Adyen/Stripe/PayPal/Fiserv; Delta/Expedia/Hilton).* https://fortune.com/2026/04/14/american-express-ai-payments-developers-purchase-protection/\n32. **Brand Safety Institute**, \"When Bots are Us: What Agentic Traffic Means for Advertisers,\" 2026. *Tier 5 — industry body; agentic-traffic as a new brand-safety/measurement category.* https://www.brandsafetyinstitute.com/blog/agentic-traffic-advertisers"}, {"order": 8, "file": "08_Gap_TikTok_MCP.md", "title": "The Fourth Garden — TikTok's Ads MCP Server and the Move from Three Walled Gardens to Four", "summary": "", "body": "# The Fourth Garden — TikTok's Ads MCP Server and the Move from Three to Four Walled Gardens\n\n## Bottom Line\n\nIt is tempting to count the walled gardens shipping their own per-platform MCP servers at **three** — Google, Amazon, Meta. **As of mid-2026 the count is four.** On **May 13, 2026**, at **TikTok World '26** (its sixth annual ad-product summit, held May 12–13), TikTok announced an **official TikTok Ads MCP Server** plus a companion developer toolkit, **TikTok Ads Skills**. The announcement landed within roughly two weeks of Google (April 28) and Meta (April 29), and was reported by Digiday, PYMNTS, Adweek, Social Media Today, and TikTok's own newsroom [1][2][3][4][5][6]. The server is **write-capable**: third-party agents can create, launch, manage, optimize, and analyze campaigns (bids, budgets, targeting, creatives) without manual work in Ads Manager. That puts it on Amazon's and Meta's side of the read/write line, not Google's read-only side [1][2][6][7]. TikTok did **not** join AdCP or the IAB Tech Lab's AAMP/ARTF. Like the other gardens, it **adopted MCP directly and routed around both consortia** — TikTok is absent from every AdCP and AAMP/ARTF roster on record [8][9][10]. The **most important caveat, and the sharpest one here:** as of June 2026 TikTok's MCP is an **announcement, not a shipped self-serve product** — no public developer docs, no install guide, no tool spec, no confirmed GA date — so it is *less* live than Amazon's (open beta, Feb 2) or Meta's (open beta, Apr 29) [7][11]. TikTok also matters disproportionately to the **shoppable / agentic-commerce** story: it runs the largest U.S. social-commerce surface (TikTok Shop, **$15.82B** U.S. GMV in 2025, **+108%** YoY, 18.2% of social commerce) and is pushing into the living room via **TikTok Shop TV** — exactly the T-commerce / shoppable-CTV crossover taken up elsewhere in these pages [12][13]. The upshot: there are now **four** walled gardens building their own ramps, not three, and TikTok belongs in the camp table alongside Google, Amazon, and Meta.\n\n---\n\n## Why TikTok changes the count, not just the roster\n\nThe omission is not cosmetic. The \"three walled gardens\" framing — Google, Amazon, Meta, each shipping its own per-platform MCP server while sitting out the open consortia — is a named, load-bearing way of describing the market. A fourth garden announcing its own server, inside the same quarter, makes that framing undercount the field.\n\nTikTok is also, by some distance, the most commerce-relevant garden of the four. It runs the largest U.S. social-commerce surface, it is pushing shoppable video into the living room, and it is a large biddable ad platform increasingly adjacent to the TV screen. Leaving it out of the count is not a small rounding error; it omits the player where social commerce, shoppable video, agentic checkout, and CTV are converging fastest.\n\nSo the change is straightforward in shape — three becomes four, and TikTok earns a row in the camp table — but it is substantive, not clerical. What follows supplies the case.\n\n---\n\n## 1. The TikTok Ads MCP Server — what was announced, and when\n\n### 1.1 Date, venue, and the \"fourth garden in one quarter\" timing\n\nTikTok announced the **TikTok Ads MCP Server** on **May 13, 2026**, at **TikTok World '26**, the platform's sixth annual global ad-product summit (the event ran **May 12–13, 2026**; PYMNTS dates the summit to Tuesday May 12, Digiday and others date the MCP announcement to May 13) [1][2][5]. The announcement was made by **Jose Villalobos, TikTok's global head of product marketing for platform and core ads** [1][6].\n\nThe timing is the headline. Four official ad-platform MCP servers were announced or shipped inside a **single quarter** of 2026 [7][14]:\n\n| Garden | Official Ads MCP — date | Status at announcement |\n| --- | --- | --- |\n| Amazon Ads | **February 2, 2026** (IAB Annual Leadership Meeting) | Open beta, write-capable, live |\n| Google Ads | **April 28, 2026** (open-source `google-ads-mcp`) | Read-only, self-hosted, live |\n| Meta | **April 29, 2026** (`mcp.facebook.com/ads`) | Open beta, write-capable, live |\n| **TikTok** | **May 13, 2026** (TikTok World '26) | **Announcement; not yet GA** |\n\n(Google's *open-source* server dates to October 7, 2025 and Google Analytics's to July 22, 2025; the digitalapplied comparative piece dates the *current-generation* official Google Ads MCP surface to April 28, 2026 [14]. Both are correct — Google has shipped multiple MCP artifacts over time. For the four-garden frame, the point is that TikTok's May 13 announcement sits two-to-three weeks after the April Google/Meta launches, not that Google had nothing before.)\n\nThe \"fourth and last of the big-four\" framing is the consensus read: TikTok \"became the last of the big-four ad platforms to commit to an MCP layer, following Google, Meta, and Amazon\" [4][14].\n\n### 1.2 What it exposes — and that it is write-capable\n\nThe TikTok Ads MCP Server is described, in TikTok's own newsroom language, as \"a new interface that allows developers and advertisers to build AI agents and tools directly on top of the TikTok Ads ecosystem to help execute advertising campaign development and management without the need for manual intervention\" [6]. Villalobos's framing, via Digiday: it will \"effectively enable marketers to connect their own AI agents directly to the TikTok ads platform so their AI systems can plan, launch and optimize campaigns without manual intervention\" [1].\n\nMultiple outlets enumerate the same task surface: **campaign setup/creation, creative asset setup, bid adjustments, budget allocation/reallocation, audience targeting, performance optimization, and reporting/analysis** — \"create, manage, optimize, and analyze campaigns without requiring advertisers to manually operate through TikTok Ads Manager\" [1][2][4][6].\n\n**Read-only vs. write-capable:** the reporting is consistent that this is **write-capable** — agents *do* the work (set bids, shift budgets, adjust targeting, create assets, launch campaigns), not merely read dashboards [1][2][6][7][14]. That places TikTok with **Amazon (write)** and **Meta (read/write)**, and against **Google's deliberately read-only** server [14]. The distinction matters: a write-capable garden MCP lets an outside agent *transact inside the garden* — subject to the garden's guardrails — not just observe it.\n\n### 1.3 The companion toolkit — TikTok Ads Skills\n\nAlongside the MCP server, TikTok announced **TikTok Ads Skills**, described as \"a toolkit … of developer building blocks that allows developers to build their own AI tools on top of existing infrastructure to execute key advertiser workflows, such as **campaign creation, performance insights, creative analysis, audience discovery, and budget optimisation**\" [3][6]. The division of labor mirrors the broader pattern. The **MCP server** is the open protocol surface any MCP-compatible agent can connect to; **Ads Skills** is the developer SDK that builds bespoke agents and tools on top of TikTok's API. It is TikTok's closest equivalent to Meta's CLI (`@meta/ads-cli`) and Amazon's \"translation layer.\"\n\nAt the same event TikTok expanded its **Smart+** performance-automation suite (Auto Selection, Asset Manager, an AI Summary feature) and launched non-agentic ad products (TopReach, Search Hubs, Creator AI Search, Dreamina/Seedance video generation in Symphony, and the **TikTok GO** in-app travel-booking surface) [2][3][6]. Those are adjacent AI features, not the agent-access story. Only the MCP server and Ads Skills bear on the question here.\n\n### 1.4 Supported agent clients — corroborated but partially second-hand\n\nSeveral sources state the MCP server lets \"outside AI agents like **Claude and ChatGPT**\" connect directly to TikTok's ad platform [4][2], and the digitalapplied comparative piece frames the four-garden cohort the same way [14]. But the primary Digiday report's clause about clients describes Meta, not TikTok (\"Meta has launched an MCP server that lets advertisers manage their Meta ad accounts through Claude and ChatGPT\") [1]. Thekeyword's summary of Digiday notes that the article \"does not specify which AI agent clients … are supported by TikTok's MCP server\" [7]. The honest scope: MCP is client-agnostic by design, so any MCP-compatible client (Claude, ChatGPT in Connectors mode, etc.) can in principle connect, and the trade press names Claude and ChatGPT. A TikTok-published, definitive supported-client list was not available as of mid-2026, because there is no public developer documentation yet (see the status section below). Gemini's native-MCP support carries the same caveat as Google's own server (Gemini \"does not yet support MCP natively, although Google has promised to add it\"); no source claims TikTok-Gemini support specifically. Treat the client list as reported rather than confirmed.\n\n---\n\n## 2. Where TikTok sits relative to AdCP and AAMP/ARTF — it routed around both\n\nDid TikTok join either consortium, or adopt MCP directly and route around both? The answer is clean: **it routed around both.**\n\n- TikTok appears in **no AdCP / AgenticAdvertising.org roster** on record. Adweek/Yahoo's protocol field guide names the AdCP camp as \"Yahoo, PubMatic, and Optable\" under O'Kelley/Scope3, and the founding rosters do not include TikTok [8][9].\n- TikTok appears in **no IAB Tech Lab AAMP / ARTF participant list** on record. The same field guide names the AAMP/ARTF orbit as Microsoft, AWS, SAP, Salesforce, IBM (plus OpenRTB/Prebid integration); TikTok \"is not mentioned anywhere in the document\" [8][9][10].\n- Instead, TikTok did exactly what the other gardens did: it **adopted MCP directly and shipped its own per-platform server**, declining the open-ecosystem standards entirely [1][6][14].\n\nThis is the **strongest evidence yet for the central thesis** about the gardens — that MCP is the uncontested substrate while AdCP-vs-ARTF is a fight over the *non-walled-garden* ~$400B of programmatic spend. The fourth-largest agentic-ad garden made the same choice as the other three: MCP yes, consortium no. So the picture is now **four per-platform servers, zero garden participation in AdCP/ARTF.** The directional claim strengthens; only the count changes.\n\nOne caveat: \"TikTok did not join\" is, strictly, an **absence of evidence** (TikTok is not on the rosters) rather than a positive disavowal. But that is the same basis on which Google, Amazon, and Meta are classified as \"third force / route-around.\" None of them issued a formal \"we reject AdCP\" statement either; their classification rests on two facts — shipping their own MCP server, and non-appearance on consortium rosters. TikTok meets both tests identically.\n\n---\n\n## 3. Status as of mid-2026 — announced, not yet shipped\n\nThis is the most important qualifier, and it cuts *against* over-stating TikTok's position relative to the other three gardens.\n\nAs of **early-to-mid June 2026**, the TikTok Ads MCP Server is **an announcement, not a generally available product**. Multiple trackers report **no public developer documentation, no install guide, no official tool/endpoint spec, and no confirmed GA date** [7][11]. The \"launched\" verb in headlines \"reads as an announcement, not a shipped, self-serve product … TikTok told the market where it's going; it has not yet handed advertisers the keys\" [11].\n\nThat makes TikTok's MCP, as of this writing, **the least mature of the four**:\n\n- **Amazon** — open beta since Feb 2, 2026; any seller/agency with active Ads API credentials could connect at launch.\n- **Google** — open-source repo, self-hostable, read-only, live.\n- **Meta** — open beta since Apr 29, 2026; hosted endpoint `mcp.facebook.com/ads`, 29 tools, OAuth.\n- **TikTok** — **announced May 13, 2026; pre-release; no public docs/spec/GA date as of June 2026** [7][11].\n\n**A note on tense.** Wherever the gardens are described as having \"shipped\" or \"running\" their own MCP servers, TikTok should carry a status tag — **\"announced (pre-GA as of June 2026)\"** — so the four-garden frame does not falsely imply four *equally live* servers. The count is four; the maturity is three live plus one announced. Treat any present-tense \"TikTok's MCP is live/GA\" claim with caution until that changes.\n\n---\n\n## 4. The CTV / shoppable-commerce relevance — why TikTok belongs in the commerce story\n\nTikTok matters most for the **agentic-commerce / shoppable** story. It is the platform where social commerce, shoppable video, agentic checkout, and the living room are converging fastest.\n\n### 4.1 TikTok Shop — the largest U.S. social-commerce surface\n\nTikTok Shop reached **$15.82 billion in U.S. sales in 2025, up ~108% from 2024**, capturing **18.2% of total U.S. social commerce** [12]. Its core mechanic is exactly the frictionless purchase loop the commerce protocols are built around: **shoppable videos** (tag products in-feed; tap to view and buy in the same content) and an effective **one-tap, in-app checkout** (\"buyers discover, evaluate, and purchase products without switching apps or tabs\") [12]. TikTok Shop already runs an **AI agent inside Shop Chat** that drafts real-time replies to customer queries — an agent in the *commerce* loop, distinct from the *ads* MCP [12]. At TikTok World '26, TikTok expanded **GMV Max** (now factoring affiliate commissions, coupons, and fees into ROI) and shipped seller-trust tooling (TikTok Real) [3][13].\n\nThis sits directly on the commerce-protocol map taken up elsewhere in these pages: TikTok is a first-party agentic-checkout environment of enormous scale, parallel to — and competitive with — the OpenAI ACP / Google AP2 \"agent buys on your behalf\" model [8].\n\n### 4.2 The living-room / T-commerce crossover\n\nTikTok is also pushing the shoppable surface into the living room via **TikTok Shop TV**, which \"brings … TikTok directly to your living room, combining entertainment with e-commerce to make it easier to discover trending items and make purchases right from your TV\" [13]. That is precisely the **T-commerce / shoppable-CTV** pattern seen at Disney, NBCUniversal, Samsung, and Paramount — interactive, transactional features inside the TV experience so a viewer can buy \"without ever leaving the couch\" [13]. TikTok belongs in that company, even though it is easy to leave out of the usual shoppable-TV roster.\n\nOne important distinction: the *ads* MCP server and the *shopping/CTV* surfaces are **distinct products** announced at the same event. There is **no source linking the TikTok Ads MCP directly to TikTok Shop TV or to agentic checkout inside TikTok** as a single integrated agentic-CTV-commerce stack. The relevance is **adjacency and convergence** — same platform, same event, same agentic direction — not a documented unified pipe. TikTok strengthens the commerce story by *presence and scale*, not by a proven ads-MCP-to-shoppable-CTV bridge.\n\n---\n\n## 5. Where TikTok lands in the four-garden picture\n\n### 5.1 The camp table, with TikTok added\n\nIn the \"who's in which camp\" map of the walled gardens, TikTok takes its place alongside Google, Amazon, and Meta:\n\n| Player | AdCP / AAO | IAB Tech Lab / AAMP | Own per-platform MCP | Posture |\n| --- | --- | --- | --- | --- |\n| **TikTok** | — | — | **TikTok Ads MCP Server (announced May 13, 2026; pre-GA) + TikTok Ads Skills** [1][3][6] | **Walled garden / third force** |\n\n### 5.2 How the count reads now\n\nRead the walled gardens as four, not three: Google, Amazon, Meta, and — newest — TikTok, each building its own ramp off to the side of the open consortia. TikTok, like the other three, owns its O&O inventory end-to-end (and, uniquely, its Shop GMV) and captures the full margin on it. The tally across the field is now **four per-platform servers (three live, one announced), zero garden participation in AdCP or ARTF.** And TikTok belongs in the shoppable-TV / living-room company too, through TikTok Shop TV, with its write-capable ads MCP carried among the inward-agentifying gardens — tagged pre-GA.\n\n### 5.3 What NOT to overstate\n\n- Do **not** present TikTok's MCP as equally live with Amazon/Meta — it is **pre-GA (June 2026)**.\n- Do **not** treat a TikTok-specific supported-client list as established fact — Claude/ChatGPT are reported, but no TikTok-published spec exists yet.\n- Do **not** claim an integrated ads-MCP → shoppable-CTV → agentic-checkout pipe inside TikTok — that is convergence/adjacency, not a documented single stack.\n\n---\n\n## Open Questions\n\n1. **When does the TikTok Ads MCP reach beta/GA, and what is its actual tool surface?** No public docs/spec as of June 2026; the count is firm but the maturity and exact tool list are not. Re-verify quarterly.\n2. **Which agent clients does TikTok officially support?** Claude and ChatGPT are reported in trade press; a TikTok-published supported-client list (and any Gemini/Perplexity support) was not available.\n3. **Will TikTok wire the Ads MCP into TikTok Shop / Shop TV for an end-to-end agentic-commerce-on-CTV loop?** The pieces exist on one platform; an integrated stack is not yet documented.\n4. **Does TikTok's U.S. ownership/regulatory status (the Shop \"uncertainty finally over\" reporting) affect the MCP roadmap?** Worth watching, because it could change the maturity picture.\n5. **Are there *other* gardens (Microsoft/Xandr, Apple, Reddit, Pinterest, Snap, Spotify, Roku, Netflix) shipping their own ad MCPs that would push the count past four?** The four-garden frame is correct as of June 2026 but is itself a moving target, and the same scrutiny that surfaced TikTok should be re-run.\n\n---\n\n## Sources\n\n1. Antoinette Siu / Digiday, \"TikTok launches MCP server to let AI agents run campaigns,\" May 13, 2026. https://digiday.com/marketing/tiktok-launches-mcp-server-to-let-ai-agents-run-campaigns/ — accessed 2026-06-20. **Tier 5** (ad-trade press; primary near-source quoting Villalobos). Contribution: date, speaker, exact \"plan, launch and optimize … without manual intervention\" wording, Skills toolkit, big-four framing.\n2. PYMNTS, \"TikTok Unleashes AI Agents on Its Ad Platform,\" 2026. https://www.pymnts.com/news/social-commerce/2026/tiktok-unleashes-ai-agents-on-its-ad-platform/ — accessed 2026-06-20. **Tier 5** (commerce trade press). Contribution: summit date (May 12), capability list, write-access \"approved boundaries,\" adjacent product launches.\n3. mobilemarketingreads, \"TikTok introduces AI agent infrastructure and new ad formats at TikTok World 2026,\" 2026. https://www.mobilemarketingreads.com/tiktok-introduces-ai-agent-infrastructure-and-new-ad-formats-at-tiktok-world-2026/ — accessed 2026-06-20. **Tier 5** (trade). Contribution: TikTok Ads Skills detail (building blocks; create/insights/creative/audience/budget), create-manage-optimize-analyze framing.\n4. TechWyse, \"TikTok World 2026: New AI Ad Tools, Travel Booking & MCP,\" 2026. https://www.techwyse.com/news/platform-updates/tiktok-world-2026-new-ad-tools-ai-mcp-travel-booking — accessed 2026-06-20. **Tier 5** (trade). Contribution: May 13 date, Villalobos title, \"fourth platform following Google/Meta/Amazon,\" Skills, Shirley Marschall data-sovereignty rationale.\n5. The Keyword (thekeyword.co), \"TikTok Opens Its Ad Platform to Third-Party AI Agents,\" 2026. https://www.thekeyword.co/news/tiktok-ads-mcp-server-ai-agents — accessed 2026-06-20. **Tier 5** (trade; summarizes Digiday). Contribution: May 13 date, Villalobos, write access, explicit note that the source does NOT specify TikTok's client list (used to bound the client claim honestly).\n6. TikTok Newsroom (AU), \"TikTok World '26: Turning discovery into business growth …,\" 2026. https://newsroom.tiktok.com/tiktok-world-2026-au?lang=en-AU — accessed 2026-06-20. **Tier 1** (primary; the platform's own announcement). Contribution: official MCP-server description, TikTok Ads Skills wording, Smart+ Auto Selection/Asset Manager/Summary. (Press release — Tier 1 for *what TikTok claims*, paired with independent trade reporting for verification.)\n7. The Keyword (thekeyword.co) strict-read summary of Digiday, 2026 (same URL as [5]) — used specifically for the \"does not specify which AI agent clients\" boundary. **Tier 5.**\n8. Adweek / Yahoo Tech mirror, \"A Guide to the New, Wide World of Agentic Advertising and Commerce Protocols,\" 2026. https://tech.yahoo.com/ai/meta-ai/articles/guide-wide-world-agentic-advertising-100000253.html — accessed 2026-06-20. **Tier 5** (trade field guide). Contribution: AdCP roster (Yahoo/PubMatic/Optable, O'Kelley), AAMP/ARTF orbit (Microsoft/AWS/SAP/Salesforce/IBM), AP2/ACP framing, and the confirmed **absence** of TikTok from both camps.\n9. IAB Tech Lab, \"AAMP — Agentic Advertising Management Protocols,\" 2026. https://iabtechlab.com/standards/aamp-agentic-advertising-management-protocols/ — accessed 2026-06-20. **Tier 1/2** (standards body, primary). Contribution: AAMP houses ARTF/Agentic Ad Object/Agentic Audiences/Agentic Mobile — used to confirm what TikTok did NOT join.\n10. The Current, \"IAB Tech Lab … releases an agentic advertising framework / agentic roadmap, don't expect any love for AdCP,\" 2026. https://www.thecurrent.com/marketing-strategy-iab-tech-lab-adcp-agentic-advertising-framework-ai — accessed 2026-06-20. **Tier 5** (ad-trade analysis). Contribution: AAMP/ARTF participant context; corroborates no-TikTok in the standards orbit.\n11. GA-status trackers (Soku \"TikTok Ads MCP: The Complete Guide (2026)\" https://soku.ai/blog/tiktok-ads-mcp-guide ; digitalapplied; futurefactors), accessed 2026-06-20. **Tier 5–7** (specialist guides / SEO content — used ONLY for the \"no public docs/spec/GA date\" status, corroborated across multiple independent trackers; not used for any factual claim about capability). Lower-tier and corroboration-only.\n12. eMarketer / Influencer Marketing Factory / trade synthesis on TikTok Shop scale, 2026. TikTok Shop $15.82B U.S. 2025 (+108% YoY), 18.2% of social commerce; shoppable videos; one-tap checkout; Shop Chat AI agent. (Influencer Marketing Factory \"TikTok Shop: The Definitive Guide 2026\" https://theinfluencermarketingfactory.com/tiktok-shop-guide-2026/ ; eMarketer shoppable-media FAQ https://www.emarketer.com/content/faq-on-shoppable-media-how-marketers-should-activate-commerce-driven-content-2026 ) — accessed 2026-06-20. **Tier 5** (eMarketer authoritative on market sizing; IMF trade). Contribution: TikTok Shop GMV/share, shoppable-commerce mechanics.\n13. TikTok Shop TV / shoppable-CTV synthesis, 2026 (Starti \"Shoppable CTV for E-commerce 2026\" https://starti.ai/blog/shoppable-ctv-for-e-commerce-the-2026-pivot-toward-interactive-retail-ads/ ; TikTok Shop product page reference; GeekSeller TikTok World recap https://www.geekseller.com/blog/tiktok-expands-shopping-ai-and-advertising-tools-at-tiktok-world-2026/ ) — accessed 2026-06-20. **Tier 5** (trade) + **Tier 7** (TikTok Shop product page, used only for existence of \"TikTok Shop TV\" as a named surface). Contribution: T-commerce/living-room crossover, GMV Max expansion, TikTok Real.\n14. digitalapplied, \"Meta, Google, TikTok Ship Official Ads MCP Servers — 2026 Playbook,\" 2026. https://www.digitalapplied.com/blog/official-ads-mcp-servers-meta-google-tiktok-2026-playbook — accessed 2026-06-20. **Tier 5** (specialist ad-tech guide). Contribution: the dated comparative — Google Apr 28 / Meta Apr 29 / Amazon Feb / TikTok May 13 — and the read-only (Google) vs write (Meta/Amazon/TikTok) split."}, {"order": 9, "file": "09_Gap_Agent_Verification_Measurement.md", "title": "The Measurement Layer: How Verification Vendors Answer the Agentic Stack's Open Question", "summary": "", "body": "# The Measurement Layer: How Verification Vendors Answer the Agentic Stack's Open Question\n\n## Bottom Line\n\nThe agentic-advertising story keeps naming a hole and never looks inside it. The ad-tech analyst Amit Goel — \"Three protocols address execution. Zero address measurement\" — lets the line stand as a verdict. The Brand Safety Institute's abstract \"agentic traffic\" category gets borrowed without anyone asking who ships the product behind it. CTV verification is left implicit. HUMAN Security gets cited only for bidstream bloat. But by mid-2026 the measurement layer is no longer a gap on a roadmap. It is a shipping product category, with dated releases from the three incumbent verification vendors, and it answers the question the execution protocols (AdCP, ARTF/AAMP) explicitly punt on. **DoubleVerify** announced **DV AI Verification** with **Agent ID Measurement** on **November 4, 2025** — an industry-first that *measures* ad engagement by named AI agents (ChatGPT, Claude, Perplexity, OpenAI's Atlas, Perplexity's Comet) rather than only filtering them — and on **June 17, 2026** launched **DV Neura**, an AI engine that itself speaks Anthropic's Model Context Protocol. **Integral Ad Science** shipped **IAS Agent** (demoed at CES 2026, global Q1 2026) and reports AI/LLM traffic against the IAB's bot lists. **HUMAN Security** — better known as a bidstream-bloat footnote — was named a **Leader in the Forrester Wave for Bot and Agent Trust Management Software, Q2 2026**, and now frames its whole business as \"Agentic Trust.\" The move worth stating plainly is an inversion. Legacy verification *excluded* all bots as fraud; agentic verification must now *distinguish* a valid agent acting for a human — one an advertiser in agent-to-agent marketing may actively want to reach — from an invalid bot. That is not a faster auction. It is a redefinition of the measurement category itself, and the missing fourth pillar (alongside discovery, planning, execution) of the agentic ad stack.\n\n---\n\n## The Findings, in Brief\n\n### DoubleVerify shipped the first vendor product that *measures* (not just filters) AI agents\n\nOn November 4, 2025, DoubleVerify announced **DV AI Verification**, whose centerpiece, **Agent ID Measurement**, is described by the company as an \"industry-first\" product enabling advertisers to identify and measure ad engagement with AI-powered chatbots and agents — naming ChatGPT, Claude, Perplexity, OpenAI's Atlas, and Perplexity's Comet Assistant — to help maximize ROI.\n\nDoubleVerify's newsroom release (Nov 4, 2025) introduces DV AI Verification and describes Agent ID Measurement as letting advertisers \"see when AI scrapers or agents — including Perplexity's Comet and OpenAI's Atlas — are interacting with their ads, either directly… or indirectly, by ingesting some form of ad data\" [1]. The release breaks reporting into three analytics categories: **declared AI bots** (LLM crawlers recognized by the IAB), **evasive SIVT scrapers** (undeclared scrapers that alter credentials to bypass detection), and **automated and agentic AI browsing** (including Atlas and Comet Assistant sessions) [1][2]. CEO Mark Zagorski is quoted: \"From declared agents powered by platforms such as ChatGPT, Claude and Perplexity to undeclared, potentially malicious AI bots — advertisers are being challenged to navigate a digital ecosystem populated by a new generation of opportunities and threats\" [1]. The \"industry-first\" framing is the company's own; ExchangeWire's independent Nov 4, 2025 write-up corroborates the product, the named agents, and the three categories [2].\n\n---\n\n### The conceptual inversion: from excluding all bots to *distinguishing* valid agents from invalid ones\n\nDV AI Verification inverts the historical logic of verification. Legacy brand-safety/IVT tools were built to *exclude* all non-human traffic as fraud; the new service is designed to *include* ads served to valid AI agents — treated as proxies for the human consumers they act for, in an emerging agent-to-agent (A2A) marketing model — while still excluding invalid or malicious ones.\n\nMediaPost's Nov 4, 2025 report (Laurie Sullivan), headlined \"In An Industry First, DoubleVerify Will Validate Non-Human AI Agent Traffic,\" states the service is \"a recognition that advertisers may begin including ads served to valid AI agents representing human consumers as part of a shift to agent-to-agent marketing, or A2A,\" and that \"[u]nlike previous generations of brand-safety services used to exclude bots by filtering non-human traffic deemed advertising fraud,\" it is \"designed to exclude invalid agents, but include valid ones deemed a proxy for human consumers that the brand is seeking to reach\" [3]. This is the cleanest articulation in the trade press of the inversion. That this redefines the *measurement category* rather than DV's product alone is consistent with HUMAN's parallel reframing and IAS's IAB-bot-list posture: all three are converging on a valid-vs-invalid *agent* taxonomy rather than a human-vs-bot one.\n\n---\n\n### The scale: GIVT up ~86% in H2 2024, >2B ad requests/month, and agentic visitors *not yet* split out\n\nDoubleVerify data shows general invalid traffic (GIVT) jumped roughly 86% in the second half of 2024 and that monthly volumes passed 2 billion ad requests from such traffic for the first time — but as of late 2025 neither DoubleVerify nor IAS split out *agentic* visitors specifically; both count them inside the broader GIVT bucket.\n\nDigiday's \"When bots look like buyers: agentic traffic causing new publisher headaches\" (Jessica Davies, Nov 12, 2025) reports DV data showing GIVT \"nearly doubled year over year, jumping 86% in the second half of [2024], with monthly volumes passing 2 billion ad requests from this kind of traffic for the first time ever,\" driven by AI crawlers and scrapers [4]. Critically, the same piece states: \"For now, DoubleVerify and IAS don't split out agentic visitors; they count them within the general invalid traffic parameters\" [4]. IAS is quoted: \"IAS has a proven track record in detecting and blocking AI bots… We report these as General Invalid Traffic (GIVT), not fraud\" [4]. The piece also documents the revenue consequence: a mid-sized buyer halted spend on Salon after an IVT alert about agentic-traffic spikes [4] — the measurement-uncertainty-to-pulled-budget mechanism in one anecdote.\n\n---\n\n### IAS's agentic posture: IAB bot lists, GIVT vs. SIVT, and the IAS Agent\n\nIntegral Ad Science distinguishes legitimate/declared bots (including LLM bots tracked on the IAB's Bot User Agent List) — reported as benign General Invalid Traffic (GIVT) — from malicious Sophisticated Invalid Traffic (SIVT), and in late 2025/early 2026 layered an AI assistant, **IAS Agent**, on top of its verification stack: demoed at CES 2026, rolled out globally in Q1 2026 at no additional cost, built on \"explainable AI.\"\n\nIAS's own positioning and trade coverage describe the firm leveraging \"its list of known spiders and bots to identify benign General Invalid Traffic (GIVT),\" with ad-fraud bots classed as SIVT, \"malicious and designed to go undetected,\" and notes that \"[l]egitimate bots like search or large language model (LLM) 'bots' are tracked by the IAB in its 'Bot User Agent List'\" [5]. On the agent product: ITBrief (Dec 19, 2025)
