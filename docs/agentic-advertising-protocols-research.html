cal; note these are secondary aggregators — used only for the AI-penetration percentages, which trace to Publicis earnings). Accessed 2026-06-20. 86% Q1 2026 net revenue AI-powered; ~80% media revenues AI-powered (2025).\n16. MissionMedia (citing Publicis/TTD dispute), \"Publicis Rejects DSP Build, Doubles Down on AI,\" April 16, 2026 (announcement April 14, 2026). https://missionmedia.asia/publicis-trade-desk-dispute-ai-strategy-2026/ — Tier 5 (trade press, APAC). Accessed 2026-06-20. Sadoun \"no intention to build a competitive offer to The Trade Desk\" / \"not by building another platform\"; FirmDecisions audit allegations (TTD disputed).\n17. Adweek, \"Arthur Sadoun Says AI Shift Doesn't Need to be Ad Industry's 'Kodak Moment,'\" 2026. https://www.adweek.com/agencies/arthur-sadoun-says-ai-shift-doesnt-need-to-be-ad-industrys-kodak-moment/ — Tier 5 (trade press). Accessed 2026-06-20. Sadoun AI-strategy framing.\n18. Magnite, \"Introducing Magnite Orchestration: Powering the Future of Agentic Advertising,\" June 11, 2026 (company release via GlobeNewswire). https://www.globenewswire.com/news-release/2026/06/11/3310415/0/en/introducing-magnite-orchestration-powering-the-future-of-agentic-advertising.html — Tier 1 (company release). Accessed 2026-06-20. dentsu + DIRECTV testing; \"CTV home screens, audio, and other high-impact formats\"; dentsu.Audiences integration.\n19. Omnicom Group, \"Omnicom Completes Acquisition of Interpublic…\" (press release), November 26, 2025. https://www.prnewswire.com/news-releases/omnicom-completes-acquisition-of-interpublic-forming-the-worlds-leading-marketing-and-sales-company-built-for-intelligent-growth-in-the-next-era-302627141.html — Tier 1 (company release, for *what is claimed*). Accessed 2026-06-20. Close date Nov 26, 2025; \">$25B pro forma combined revenue\"; \"world's leading\"; Wren quote.\n20. Campaign Asia, \"Omnicom closes Interpublic acquisition for final purchase price of $9 billion,\" 2025. https://www.campaignasia.com/article/omnicom-closes-interpublic-acquisition-for-final-purchase-price-of-9-billion/506188 — Tier 5 (trade press). Accessed 2026-06-20. ~$9B final consideration at $71.50 close share price; EU clearance as final hurdle; ~$25B combined revenue.\n21. Deadline, \"Omnicom Closes Acquisition Of Interpublic In $13B Deal Creating World's Largest Advertising Firm,\" November 2025. https://deadline.com/2025/11/omnicom-acquiring-interpublic-13b-advertising-deal-1236198205/ — Tier 4 (major outlet, entertainment-trade). Accessed 2026-06-20. ~$13B deal; \"world's largest\"; prior Nos. 3 & 4; \">$25B pro forma revenue\"; Wren quote.\n22. PYMNTS / btimesonline / Ad Age (deal terms), December 2024. https://www.pymnts.com/cpi-posts/omnicom-and-interpublic-unite-in-13-25b-deal-big-tech-competition-heats-up/ — Tier 5 (analytical). Accessed 2026-06-20. $13.25B all-stock; 0.344 exchange ratio; ≈$35.58/share; 60.6/39.4 ownership split; $750M cost synergies; brands incl. McCann/Mediabrands.\n23. The Drum, \"Year in Review: How Omnicom's IPG takeover made a new 'big 5' (or should that be 2?),\" 2026. https://www.thedrum.com/news/year-in-review-how-omnicom-s-ipg-takeover-made-a-new-big-5-or-should-that-be-2 — Tier 5 (trade press). Accessed 2026-06-20. \"Big 5\"/\"Big 2\" framing; network retirements (FCB/MullenLowe/DDB); concentration at the top.\n24. eMarketer, \"FAQ on ad agencies: Consolidation, AI disruption, and what's changing in 2026,\" 2026. https://www.emarketer.com/content/faq-on-ad-agencies--consolidation--ai-disruption--what-s-changing-2026 — Tier 5 (analytical). Accessed 2026-06-20. 2026 holdco revenue ranking (Omnicom > Publicis ≈€14.5B > WPP ≈£13.55B); Big Five structure.\n25. The Interpublic Group portfolio (Mediabrands/UM/Initiative/Kinesso/Acxiom composition), per Mediabrands corporate description and merger coverage. (Used for IPG unit composition; cross-checked against deal coverage in [22].) — Tier 1/5 mix. Accessed 2026-06-20. IPG units now under Omnicom: Mediabrands (UM, Initiative), Kinesso, Acxiom, McCann, Weber Shandwick.\n26. MarTech, \"Omnicom's mega-merger doubles down on media — at creativity's expense,\" 2025. https://martech.org/omnicoms-mega-merger-doubles-down-on-media-at-creativitys-expense/ — Tier 5 (trade press). Accessed 2026-06-20. ~4,000 job cuts; reorganization; media-weighted combination.\n27. MediaPost, \"It's Official: GroupM Is Rebranded To WPP Media,\" May 29, 2025. https://www.mediapost.com/publications/article/406198/its-official-groupm-is-rebranded-to-wpp-media.html — Tier 5 (trade press). Accessed 2026-06-20. GroupM→WPP Media rebrand May 29, 2025; ~$60B annual media spend; ~40,000 staff.\n28. Variety, \"WPP Erases 'GroupM,' One of Madison Avenue's Most Influential Names,\" 2025. https://variety.com/2025/tv/news/wpp-media-groupm-rename-advertising-1236411920/ — Tier 4 (major outlet, entertainment-trade). Accessed 2026-06-20. Corroborates GroupM→WPP Media rebrand and scale.\n29. Omnicom Group Investor Relations, \"Omnicom and Interpublic Clear FTC Antitrust Review,\" June 23, 2025. https://investor.omnicomgroup.com/news/news-details/2025/Omnicom-and-Interpublic-Clear-FTC-Antitrust-Review/default.aspx — Tier 1 (company release). Accessed 2026-06-20. FTC clearance date; HSR early termination.\n30. FTC, \"FTC Alters Final Consent Order in Response to Public Comments, Preventing Coordination in Global Advertising Merger,\" September 2025. https://www.ftc.gov/news-events/news/press-releases/2025/09/ftc-alters-final-consent-order-response-public-comments-preventing-coordination-global-advertising — Tier 1 (primary, regulatory). Accessed 2026-06-20. Consent-order terms: no viewpoint-based steering except at advertiser's express individualized direction; order altered Sept 2025."}, {"order": 13, "file": "13_Gap_Roku_Fox_GoingConcern.md", "title": "Roku Is No Longer for Sale — It Is Sold: The Fox Acquisition and Roku's Agentic Posture", "summary": "", "body": "# Roku Is No Longer for Sale — It Is Sold\n\n## Bottom Line\n\nA question hung over Roku's ad platform: what happens to it under a sale? It now has an answer. Until mid-2026, the most CTV-central *seller* in this account — Roku, owner of the Roku Exchange, Ads Manager, Curate, and a 100-million-household identity graph — was a standalone going concern merely \"exploring strategic options including a full sale.\" Three days later it had a buyer. On **June 15, 2026, Fox Corporation announced a definitive agreement to acquire Roku** for **$160.00 per share** — **$96.00 cash plus 0.9693 Fox Class A shares** — an enterprise value of **approximately $22 billion**, unanimously approved by both boards and expected to close in the **first half of calendar 2027**, with Fox holders to own ~73% of the combined company and ~$400 million of run-rate cost synergies targeted [1][2][3][4]. The exploration is over. The buyer is named.\n\nThis changes everything downstream: Roku's agentic posture is no longer Roku's to set. The acquirer is a content owner — Fox, with Tubi, live sports, and news — and the deal's logic is explicitly an *advertising* logic: a combined ~$9B LTM ad business, Tubi and The Roku Channel as the two largest FAST services, Roku's authenticated first-party data paired with Fox demand [5][6][7]. So the deal sharpens the central tension of this account rather than merely updating it. Does Roku's relatively *neutral* marketplace — the Exchange routing to Amazon DSP, The Trade Desk, Yahoo, and DV360 — survive ownership by a content company, or tilt toward a Fox-favoring walled garden? Fox executives have pre-committed to keeping Roku \"an open, partner-friendly platform.\" The H1-2027 close is when that promise gets tested [6][7].\n\nA separate, dedicated treatment of the Fox–Roku deal — \"Buying the Living Room\" — verifies these terms directly against the Fox 8-K, the merger agreement, and the Form 425 call transcript on SEC EDGAR. These pages set the going-concern horizon and assess, briefly, what Fox ownership does to Roku's agentic stance. For the full deal anatomy, financing, and outlook, see that fuller account.\n\n---\n\n## What Changed, Precisely\n\nEarlier, the picture of Roku — its Exchange, Ads Manager, Curate, and identity assets — came with the qualifier of **a possible sale**: Roku was \"exploring strategic options including a full sale,\" per Reuters reporting (June 12, 2026), with no final decisions made. That was accurate as of mid-June 2026. Then the situation moved. The Reuters \"exploration\" wire of June 12 was the *rumor*; the **June 15 definitive agreement** is the *event*. The distinction matters. \"Exploring a sale\" and \"has signed a binding merger agreement at $160/share, unanimously approved by both boards\" are materially different states of the world, and a reader should not be left in the earlier one.\n\nThe factual baseline — the *product stack* — survives intact. Roku Exchange (June 2024), Ads Manager (September 2024), Roku Curate (April 2026, six retail-data partners), Q1 2026 ad revenue of **$613M up 27% YoY**, and the ~80M-household Amazon partnership all hold against Roku's own Q1 2026 8-K shareholder letter and contemporaneous trade reporting [8][9][10]. What changes is the *frame*. These are no longer the assets of an independent going concern. They are the assets Fox is buying — and the question of their fate is now a question about Fox's intentions, not an unknown acquirer's.\n\n---\n\n## The Deal in Detail\n\n### Fox signed a definitive agreement to acquire Roku\n\nOn June 15, 2026, Fox Corporation and Roku announced a **definitive merger agreement** under which Fox will acquire Roku for **$160.00 per share** — **$96.00 in cash and 0.9693 shares of Fox Class A common stock** per Roku share (the stock leg valued at $64.00 against a $66.03 reference price, the 10-day VWAP through June 10, 2026) — an **enterprise value of approximately $22 billion**. The transaction was **unanimously approved by both companies' boards** and is **expected to close in the first half of calendar 2027** [1][2][3][4]. The terms are corroborated across the Fox/Roku joint press release (PRNewswire 302800220), the Roku and Fox newsrooms, the Fox 8-K (SEC EDGAR, FY2026), and wire and major-outlet coverage (CNBC, Variety, Hollywood Reporter, CBS) [1][2][3][4][11].\n\nThe PRNewswire joint release states the per-share consideration, cash/stock split, exchange ratio, reference price, enterprise value, and unanimous board approval [1]. The Roku newsroom and Fox corporate newsroom carry identical terms [2][3]. The fuller Fox–Roku account verifies these against the Fox 8-K and the merger agreement's Exhibit 2.1 on SEC EDGAR.\n\n### Ownership split, synergies, and financing\n\nUpon closing, existing Fox shareholders are expected to own **~73%** of the combined company and Roku shareholders **~27%**; the deal targets **~$400 million of run-rate cost synergies**; Fox secured **$12.0 billion of committed bridge financing from Morgan Stanley Senior Funding, Inc.**, with pro forma net leverage of **~2.8x** (inclusive of 50% synergy credit) [1][5]. PRNewswire 302800220 states the 73/27 split, the ~$400M synergy figure, the $12B Morgan Stanley bridge, and ~2.8x pro forma leverage [1]; Marketing Dive corroborates [5].\n\n### The deal's rationale is explicitly an advertising rationale\n\nThe combined entity is being marketed as an *advertising* combination: ~**$9 billion in LTM advertising revenue** (~$6.5B Fox + ~$2.5B Roku), control of the **two largest FAST services** (Tubi and The Roku Channel), and Roku's **authenticated first-party data across 100M+ global streaming households** paired with Fox's premium live-sports and news demand — making the combined company the **third-largest US TV player by viewing share** (behind YouTube and Disney) [5][6][7][12]. Marketing Dive, Digiday, PPC Land, and the joint release all frame the deal around advertising [1][5][6][7].\n\nFox CEO Lachlan Murdoch: \"Roku really does have unique expertise in performance marketing, we can bring across our entire platform… advertising synergies or revenue upsides are very significant\" [5]. Executives describe an expected \"advertising flywheel between Fox's inventory, demand and engagement and Roku's first-party data, targeting, measurement and personalization capabilities\" [5]. Digiday quotes Murdoch calling Roku's homescreen \"beachfront property\" — premium ad space purchasable programmatically [7]. Marketing Dive and Digiday report the ~$9B combined LTM ad revenue and FAST-leadership framing [5][7].\n\n### Fox has pre-committed to keeping Roku \"open,\" but the commitment is untested and contested\n\nFox management has publicly committed to operating Roku as **\"an open, partner-friendly platform,\"** preserving its broad third-party catalog (Netflix, Paramount+, HBO Max, Disney+, Apple TV) and its third-party-DSP demand relationships (Amazon DSP, The Trade Desk, Yahoo, DV360) rather than converting it into a Fox-exclusive walled garden. Executives invoke Fox's prior operation of \"platforms that distribute competitor content\" (Sky, Star) and CFO Steve Tomsic's \"Switzerland of distribution\" framing. But analysts and trade reporters flag the structural tension. Roku's CTV-OS share (~44% per Comscore Q4 2025, per PPC Land) hands Fox unusual leverage over discovery and demand routing, and the neutrality pledges remain **untested commitments**, not contractual guarantees — with the H1-2027 close as the horizon at which they get pressure-tested [6][7][12]. The *commitment* is established; whether it *holds* is the open question, corroborated across Marketing Dive, PPC Land, and Digiday [5][6][7].\n\nMarketing Dive and Digiday both report Fox's \"open, partner-friendly platform\" commitment and its intent to maintain a \"broad, competitive catalog\" [5][7]. PPC Land surfaces the counter-pressure: Murdoch's \"beachfront property\" framing, the ~44% CTV-OS share, the Amazon-DSP/80M-household partnership, and the risk that \"inventory arbitrage and demand routing decisions now centralize\" under single ownership [6]. Forrester's Mike Proulx: \"Streaming is no longer just about quality content slates. It's about controlling the full stack\" [5]. eMarketer's Ross Benes notes the deal \"collapses the number of ad sellers where US advertisers can gather scaled audiences\" [7]. One transaction makes the neutral-vs-garden tension concrete.\n\n### The deal does not, by itself, change Roku's thin *explicit* agentic posture — but it changes who controls it\n\nNeither the announcement nor the deal materials show Roku (or Fox) shipping a **named buyer/seller agent or AdCP/agent-to-agent integration**. Roku's 2026 moves remain *AI-in-the-stack* — creative upscaling, identity/personalization, retail-data curation, performance-marketing tooling, an iSpot outcomes partnership — rather than an announced agentic-protocol play. What the deal changes is *governance*. The choice of whether to expose Roku Exchange/Curate/identity to a **neutral** buyer agent (AdCP) or keep agents inside a Fox-owned garden now sits with Fox, a content company with its own demand to favor [5][6][7] — exactly the walled-garden incentive that defines Amazon, Disney, and the other gardens.\n\nPPC Land notes \"no explicit mention of agentic advertising in the announcement,\" while highlighting Roku's \"performance marketing\" expertise as the asset Fox seeks to deploy \"across [the] entire platform\" [6]. The reading here — that ownership by a content company tilts the *latent* agentic-exposure decision toward the garden side of the central question — follows directly from the logic of these gardens: each has every incentive to expose its inventory through *its own* agents, not a neutral protocol. Read it as analysis, not a reported fact.\n\n---\n\n## What This Does to Roku Exchange / Ads Manager / Curate (Calibrated)\n\nThe honest answer to \"what does Fox ownership do to Roku's ad stack?\" is this: **the products persist into the close; their strategic direction afterward is a Fox decision, pledged neutral and structurally pulled toward the garden.** Three calibrated reads:\n\n**1. Near-term continuity is the base case.** Through the H1-2027 close, Roku Exchange and Ads Manager \"remain operational,\" and the stated intent is a \"broad, competitive catalog\" [6]. Deals of this size do not re-platform mid-regulatory-review. Integration risk and the neutrality pledges both argue for leaving the marketplace running as-is until close. The ~80M-household Amazon-DSP partnership and the 40%-YoY growth in third-party programmatic DSP spend [6][9] are revenue Fox has no near-term reason to disrupt.\n\n**2. The structural pull is toward favoring Fox demand.** Roku Curate — first-party data plus six retail partners' purchase signals — and Roku's authenticated identity graph are exactly the assets that grow more valuable when wired to a content owner's own inventory (Tubi, Fox Sports, Fox News). The \"advertising flywheel\" Fox describes [5] is, in plainer terms, a closed loop: Fox demand, Roku supply, Roku data, Roku homescreen. The garden logic predicts that an owner exposes such assets through *its own* controlled interface, not a neutral protocol. PPC Land's \"inventory arbitrage and demand routing decisions now centralize\" [6] is the same observation in market language.\n\n**3. Re-platforming the *agentic* posture is plausible but unannounced.** A standing question was whether a new owner could re-platform Roku's entire agentic posture. A content-owner acquirer has a coherent reason to do exactly that — route agentic demand toward Fox/Tubi inventory, and expose Roku's identity/Curate assets through a Fox-governed agent rather than a neutral AdCP endpoint. But **no sourced evidence of such a re-platform exists as of June 2026**. It is a forward risk consistent with the garden thesis, not a reported plan. Watch it through close.\n\n---\n\n## Open Questions\n\n1. **Does the neutrality pledge survive the close?** Fox's \"open, partner-friendly platform\" commitment is a public statement, not a contractual covenant. The H1-2027 close is the test horizon.\n2. **Does Fox route agentic demand through a Fox-governed agent, or expose Roku Exchange/Curate/identity to a neutral AdCP buyer agent?** No sourced answer as of June 2026; the garden thesis predicts the former.\n3. **What does regulatory review (HSR + limited international approvals, per Murdoch) do to the timeline and to any neutrality conditions?** Regulators may assess vertical integration (content + OS + ad stack) and could impose behavioral remedies that touch the very neutrality question above [6].\n4. **Does the Amazon-DSP/80M-household partnership and the third-party-DSP demand (Trade Desk, Yahoo, DV360) persist post-close, or get re-routed toward Fox-favoring supply paths?**\n5. **What happens to The Trade Desk's identity collaboration with Fox (UID2/OpenPath) once Fox owns a rival CTV-OS and SSP?** Trade-press flags \"relationship dynamics will shift post-close\" [6] without specifics.\n\n---\n\n## Sources\n\n1. PRNewswire (Fox/Roku joint release), \"Fox Corporation to Acquire Roku, Inc.\" (2026-06-15), release 302800220. https://www.prnewswire.com/news-releases/fox-corporation-to-acquire-roku-inc-302800220.html — Tier 1 (company-issued press release; read as the parties' claims, corroborated by filings/wires). Exact deal terms: $160.00/sh, $96 cash + 0.9693 Fox Class A, $66.03 reference, ~$22B EV, 73/27 split, ~$400M synergies, $12B Morgan Stanley bridge, ~2.8x leverage, unanimous board approval, H1-2027 close. Accessed 2026-06-20.\n2. Roku Newsroom, \"Fox Corporation to Acquire Roku, Inc.\" (2026-06). https://newsroom.roku.com/news/2026/06/fox-corporation-to-acquire-roku-inc-/ishjvytb-1781489389 — Tier 1 (company comms). Identical terms; Roku-side framing. Accessed 2026-06-20.\n3. Fox Corporation Newsroom, \"Fox Corporation to Acquire Roku, Inc.\" (2026). https://www.foxcorporation.com/news/corp-press-releases/2026/fox-corporation-to-acquire-roku-inc/ — Tier 1 (company comms). Fox-side framing; strategic rationale. Accessed 2026-06-20.\n4. Fox Corporation, Form 8-K (FY2026), Exhibit 99.1/99.2, SEC EDGAR (filer CIK 0001754301). https://www.sec.gov/Archives/edgar/data/0001754301/000119312526270285/d151410dex991.htm — Tier 1 (primary SEC filing). Terms triangulated via [1][2][3] and direct EDGAR verification (8-K + merger agreement Exhibit 2.1 + Form 425 call transcript). Accessed 2026-06-20.\n5. Marketing Dive, \"Fox acquires Roku for $22B to accelerate streaming advertising business\" (2026-06-15). https://www.marketingdive.com/news/fox-acquires-roku-for-22b-to-accelerate-streaming-advertising-business/822890/ — Tier 5 (specialist ad/marketing trade). ~$9B combined LTM ad revenue ($6.5B Fox + $2.5B Roku), two largest FAST services, \"advertising flywheel,\" third-largest US TV by viewing, Murdoch performance-marketing quote, \"open, partner-friendly platform,\" Forrester (Proulx) and analyst commentary. Accessed 2026-06-20.\n6. PPC Land, \"Fox buys Roku for $22bn — what it means for CTV advertising\" (2026-06). https://ppc.land/fox-buys-roku-for-22bn-what-it-means-for-ctv-advertising/ — Tier 5 (specialist programmatic trade). CTV-advertising implications: Exchange/Ads Manager operational pre-close, Curate passes to Fox, ~44% CTV-OS share (Comscore Q4 2025), Amazon-DSP/80M households, +40% YoY DSP spend, neutrality-vs-garden tension, \"no explicit agentic mention,\" HSR/regulatory, \"beachfront property.\" Accessed 2026-06-20.\n7. Digiday, \"Fox strikes revenue-doubling Roku deal\" (2026-06-15). https://digiday.com/future-of-tv/fox-strikes-revenue-doubling-roku-deal/ — Tier 5 (specialist media trade). Q1-2026 Roku ad rev $613M + sub rev, \"beachfront property\" homescreen quote, \"open, partner-friendly platform,\" eMarketer (Benes) \"collapses the number of ad sellers\" quote, agency consolidation framing. Accessed 2026-06-20.\n8. Roku, Inc., Form 8-K / Q1 FY2026 Shareholder Letter, Exhibit 99.1, SEC EDGAR (filer CIK 0001428439). https://www.sec.gov/Archives/edgar/data/0001428439/000162828026028851/a04fy2026q1exhibit991.htm — Tier 1 (primary SEC filing). Q1 2026 total revenue $1.25B (+22%), Platform $1.13B (+28%), Advertising $613M (+27%, 60.5% gross margin), Subscriptions $518.5M (+30%), net income $86M, Adj. EBITDA $148M; Advertising/Subscriptions disaggregated as reportable segments. Accessed 2026-06-20.\n9. PPC Land, \"Roku reports $1.25B Q1 2026 revenue as ad spend through DSPs jumps 40%\" (2026-04/05). https://ppc.land/roku-reports-1-25b-q1-2026-revenue-as-ad-spend-through-dsps-jumps-40/ — Tier 5 (specialist trade). +40% YoY third-party programmatic DSP spend; Ads Manager adoption. Accessed 2026-06-20.\n10. MediaPost, \"Roku Q1 Ad Spend Up 27% To $613M\" (2026-05-01). https://www.mediapost.com/publications/article/414752/roku-q1-ad-spend-up-27-to-613m.html — Tier 5 (specialist trade). Confirms $613M Q1 2026 ad revenue, +27% YoY. Accessed 2026-06-20.\n11. CNBC, \"Fox to buy streaming device maker Roku for $22 billion\" (2026-06-15). https://www.cnbc.com/2026/06/15/fox-to-buy-roku.html — Tier 4 (major business outlet; news side). Deal confirmation and terms (headline/terms corroborated via [1]). Accessed 2026-06-20.\n12. Variety, \"Fox Is Buying Roku in $22 Billion Deal\" (2026-06). https://variety.com/2026/tv/news/fox-acquiring-roku-1236781308/ — Tier 5 (entertainment trade, strong reputation). Deal confirmation, combined-company viewing-share positioning, first-party-data framing. Accessed 2026-06-20.\n\n---\n\n## Further Reading\n\nFor the full deal anatomy — financing structure, regulatory path, a four-scenario outlook, the OneView-DSP picture (OneView is being sunset; enterprise demand routes through third-party DSPs while Roku retains the SSP/Exchange, Ads Manager, homescreen, and ACR/first-party data), and the verified merger-agreement terms — see the dedicated treatment, **\"Buying the Living Room.\"** These pages mark the horizon and name the buyer; that one opens the books."}, {"order": 14, "file": "Future_Trajectory.md", "title": "Agentic Advertising Protocols: Future Trajectory", "summary": "", "body": "# Agentic Advertising Protocols: Future Trajectory\n\n## Bottom Line\n\nThe most likely outcome through 2029 is not a winner but a settlement. Anthropic's Model Context Protocol stays the uncontested substrate, and the two ad-buying standards built on it — the Ad Context Protocol's negotiation grammar and the IAB Tech Lab's ARTF/AAMP transport layer — end up stacked rather than fighting to the death, with AdCP most likely partly absorbed into IAB's SDKs (probability 36–44%). Running co-modal with that is a darker reading: the open-standards war is real, but it happens beneath two power centers — the four walled gardens enclosing their own inventory, and a foundation-model discovery layer (ChatGPT, Google AI Mode, Amazon Rufus) that monetizes selection upstream of any ad-buying protocol — so the open contest resolves over an ever-shrinking remainder (26–34%). One empirical hinge decides between these poles, and it is unobservable today: whether holding-company buyer-agent volume stays AdCP-native or migrates to bilateral garden and publisher pipes. Below those sits a real chance the whole fight turns out to be over a market that never scales — pilots stay pilots, rate-card resistance holds, and autonomous agent-to-agent buying never becomes dominant this decade (Agentic Plateau, 14–20%). Smaller still is the chance that agents genuinely and visibly compress the open-market DSP+SSP+curation stack (Material Disintermediation, 10–16%), plus a wildcard tail in which public law or a fracture in the MCP substrate itself becomes decisive (8–14%). The dominant drivers are the MCP substrate's neutrality and lock-in, the straddler firms that build to both consortia, walled-garden enclosure, and the gap between piloted and production volume. No liquid prediction market prices the exact question, so this forecast leans on reference classes and driver decomposition, not market anchoring.\n\n## Method\n\nThis forecast weighs several independent lines of reasoning — base rates, driver decomposition, actor incentives, and contrarian and discontinuity cases — weighing competing scenarios by how well each survives scrutiny rather than averaging them. No liquid market prices the exact question: Polymarket, Kalshi, and Metaculus were empty on 2026-06-20, and the Manifold proxies that exist are thin, play-money, and tangential. So base-rate plus decomposition grounding carries the weight, and the market snapshot below is color, not an anchor.\n\nThe base rates rest on four reference classes: roughly fifteen years of ad-tech standards contests (an N=8 class spanning OpenRTB, VAST/VPAID, Prebid, ads.txt/sellers.json, UID2, Privacy Sandbox, DFP/AdX, and OpenDirect); take-rate compression after structural rewirings (header bidding, supply-path optimization, ID resolution, ads.txt); the failure rate of hyped \"next-paradigm\" ad-tech pushes; and how rarely regulation decides a major ad-tech outcome within a four-year window. The horizon is through 2029, with most scenarios resolving on signals visible by 2027–2028.\n\nScrutiny did real work: it defeated three over-reaches rather than letting them stand. A high-40s/50s claim for the Layering scenario was trimmed to 36–44 once two flaws came into view — its three driver factors share a hidden volume-conditioning variable (inflating their product above the honest ~0.40), and the N=8 reference class emerged from already-at-scale markets whereas AdCP launched from, in INMA's phrase, \"zero dollars.\" The 33–42% Enclosure case held at 26–34 after its claim that holdcos would bypass the consortia via their own agents ran into a documented fact: Omnicom executes real buys on AdCP (\"diminish not eliminate,\" human-gated). And the 15–22% Disintermediation case was trimmed to 10–16 once it was clear that enclosure contains compression to the shrinking open market, capping the upside.\n\nWhere the lines of reasoning disagreed and stayed disagreeing, the Layering-versus-Enclosure weighting was kept co-modal, not split down the middle. The base-rate, driver, and actor-incentive reasoning keeps Layering modal (around 40–46) on the strength of the straddler lock — Brian O'Kelley sitting on both the AdCP side and the IAB board, with PubMatic, Yahoo, and WPP building to both — and the well-footed MCP substrate. The contrarian and discontinuity reasoning holds Enclosure co-modal (around 30–38), arguing that gardens plus a model-layer discovery chokepoint drain the open middle upstream of any ad-buying protocol. Neither was refuted; the hinge is empirical and not yet observable. A second, smaller split concerns the regulatory tail: the base-rate and actor-incentive reasoning floors it at 5–10%, the discontinuity reasoning holds 12–18%, and the wildcard band spans both rather than splitting the difference. Geometric mean of odds was used only as a sanity check.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios — through 2029<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Layered Coexistence on an …<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"361.8\" y=\"8\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"409.0\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">36–44%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Garden + Model-Layer Enclo…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"312.7\" y=\"44\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"359.9\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">26–34%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Agentic Plateau — pilots d…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"253.7\" y=\"80\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"291.2\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">14–20%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Material Disintermediation…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"234.1\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"271.6\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">10–16%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Regulatory / Substrate Sho…<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"224.3\" y=\"152\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"261.7\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">8–14%<\/text><\/svg><\/figure>\n\n\n\n### Scenario 1: Layered Coexistence on an MCP Substrate\n\n**Probability: 36–44%.** This is the modal outcome, co-equal with Enclosure but slightly ahead.\n\n**Description.** There is no knockout. MCP is the uncontested substrate — donated to the Linux Foundation's Agentic AI Foundation in December 2025, running at roughly 97 million monthly downloads, referenced by OpenAI and Apple alike — and the two ad-buying standards built on it learn to coexist as stacked layers rather than rivals. AdCP supplies the asynchronous negotiation grammar; ARTF and AAMP supply the synchronous, roughly-100ms transport. Both ride the OpenRTB network effects beneath them. The most probable mechanism is not displacement but absorption: rather than toppling OpenRTB or surviving fully independent, AdCP gets folded into the IAB Tech Lab's AAMP SDKs as negotiation grammar (the v3.0 release due July 2026 is the signal to watch). The governance war stays adversarial and noisy while the underlying stack quietly interoperates. Demand-side adoption feeds the layering: holding-company buyer agents like Omnicom's run on AdCP, so real client buys reinforce the layered architecture rather than routing around it. The four gardens route around both consortia via their own MCP servers, as gardens always do. The margin effect is real but modest — the DSP take loses a few points and SSP consolidation grinds on — but the spread is rerouted, not eliminated: it flows to large publishers, the biggest SSPs running agents, and a new buyer-agent class (holdcos plus Scope3). In CTV, AdCP automates curation and PMP on open supply while ARTF handles the biddable slice.\n\n**How this number was derived.** Reference-class anchored with a decomposition cross-check. The base rate for ad-tech standards contests resolving as layering or absorption is about 6 of 8 across the OpenRTB / VAST / Prebid / ads.txt / UID2 / Privacy Sandbox / AdX / OpenDirect class — roughly 75%. The driver decomposition runs P(MCP stays substrate) ≈ 0.88 × P(no winner-take-all | MCP) ≈ 0.66 × P(open keeps enough volume) ≈ 0.75 ≈ 0.44. Scrutiny cut the high end twice: the three factors share a hidden volume-conditioning variable (so the product was inflated above ~0.40), and the N=8 class emerged from at-scale markets whereas AdCP started from \"zero dollars.\" Scrutiny also blocked any move below ~30, on the strength of the substrate floor (MCP in ~95% of these markets, the LF donation, ~97M downloads) plus the straddler lock (O'Kelley on AdCP and the IAB board; PubMatic, Yahoo, and WPP building to both). The estimates banded ~42–44 (base-rate, driver, and actor-incentive reasoning) against ~30–32 (contrarian and discontinuity reasoning); the geometric mean of odds landed ~0.37. Banded to 36–44.\n\n**Drivers.** MCP-as-substrate lock-in (the M+N integration collapse, neutral LF governance, all four gardens adopting MCP directly); the layer-not-rival division of labor (AdCP for async negotiation, ARTF for sync ~100ms transport, both on MCP); the straddler lock, where O'Kelley, PubMatic, Yahoo, and WPP all build to both camps so a knockout serves no pivotal firm; the absorption path, where IAB folds AdCP grammar into the AAMP SDKs; and demand-side adoption feeding layering, with Omnicom executing real, human-gated client buys on AdCP.\n\n**Conditions.** This holds as long as MCP keeps its neutral governance and no major firm is forced to pick a side, while the gardens continue to route around without anyone being able to displace the open plumbing.\n\n**Signals to watch.** IAB AAMP v3.0 in July 2026 incorporating AdCP-style negotiation grammar would confirm absorption. AdCP membership growing past its June 2026 count of 102, with any DSP or holdco becoming a voting founder rather than a pilot-taker. The AdCP Curation Protocol (Q2 2026) shipping with named-streamer adoption versus stalling. Continued dual membership, with no major firm forced to choose. And an independent, non-IAB benchmark of ARTF's ~80% latency-reduction claim.\n\n**Time horizon.** Through 2029; absorption and coexistence signals should be visible by mid-2027.\n\n### Scenario 2: Garden + Model-Layer Enclosure\n\n**Probability: 26–34%.** Co-modal with Layering; the two were never collapsed into one.\n\n**Description.** The open-standards fight is real, but it happens beneath two power centers that capture the rents first. The first is the foundation-model and discovery layer: ChatGPT ads, Google's AI Mode, and Amazon's Rufus monetize selection upstream of any ad-buying protocol — the moment of choice moves inside the assistant, before a buying standard ever runs. The second is the walled gardens, which enclose their owned inventory behind per-platform MCP servers and block rival agents. Amazon's preliminary injunction against Perplexity's Comet agent (March 2026) is the template, reinforced by robots.txt crawler blocks and Amazon's March 4, 2026 agent-identification rule; Fox's $22B acquisition of Roku (expected to close in H1 2027) folds a once-neutral exchange under a content owner. Spend gravitates inward, the open ~$400B non-garden pie stops growing, and AdCP and ARTF resolve over an ever-smaller remainder — they win the standard but govern less of the money. CTV's cleanest expression of this is Amazon's fully in-garden loop: Fire TV plus Prime Video plus Rufus plus ACR plus checkout, with no neutral protocol needed at any step.\n\n**How this number was derived.** Decomposition. P(gardens keep enclosing and blocking through 2029) ≈ 0.80 — the four gardens have shipped their own MCP servers and not one has joined a consortium, Amazon won the Comet injunction in March 2026, and US refusal-to-deal doctrine is narrow post-Trinko. This is multiplied by P(enclosure plus model-layer capture is dominant | the open contest is subordinated) ≈ 0.40 (the base-rate and driver lines independently land near 0.40 against a still-persisting ~$400B open market), giving ≈ 0.32. Scrutiny defeated the higher 33–42% modal: its claim that holdcos bypass the consortia via their own agents was refuted by doc 12 (Omnicom buys on AdCP, \"diminish not eliminate\"), pulling that factor to ~0.45 and the scenario to ~0.30; and its \"gardens > 32% of CTV\" driver was corrected, since only three sellers clear 10% of US CTV (YouTube 11.9%, Amazon >10%, Disney 10.8% — and Disney is a streamer, not a walled garden), so enclosure runs through the model layer and holdco routing more than CTV owned-and-operated share. A brokerage-open-standard market proxy at ~37% supports the high-20s/low-30s. Banded 26–34, co-modal with Layering.\n\n**Drivers.** Concentration predicts gatekeeping (Amazon blocks and litigates, Google fuses ads into AI answers, Meta and TikTok ship write-capable inward servers); a model-layer discovery chokepoint upstream of any ad-buying protocol; four gardens on their own MCP servers with zero consortium participation; the Fox–Roku deal ($22B, close H1 2027) creating a content-owner CTV garden as spend gravity pulls budgets inward; and margin-from-opacity, where enclosure protects the very spread an open transparency standard would vaporize.\n\n**Conditions.** This dominates if the model-layer ad surfaces scale and the gardens hold their blocking posture, while the open standards keep winning a market that stops growing.\n\n**Signals to watch.** Whether OpenAI's \"answer independence\" firewall holds or breaks under monetization pressure. Whether the Comet injunction survives to final merits and gets replicated or cited. The share of discovery that starts inside Rufus, Gemini, or ChatGPT versus open CTV apps. Whether Fox keeps Roku \"open, partner-friendly\" after close or tilts it toward Fox/Tubi demand (H1 2027). And eMarketer's CTV concentration reads — top gardens' share rising versus more sellers clearing 10%.\n\n**Time horizon.** Through 2029; the enclosure trajectory should be readable by 2027–2028.\n\n### Scenario 3: Agentic Plateau\n\n**Probability: 14–20%.** The convergent estimate across four of the five lines of reasoning.\n\n**Description.** The standards war turns out to have been fought over a market that stays small. The pilot-to-production gap is vast: AdCP went from \"zero dollars\" to a handful of campaigns; the IAB agent registry held about 10 entries by March 2026; The Trade Desk's agents are, in its own words, \"not buying ads — at least not yet\"; AdCP keeps human approval architectural rather than procedural; Omnicom and WPP keep human sign-off (\"nothing's overnight\"). Ari Paparo's structural blockers hold: publishers won't put rate cards in a shared protocol, and premium CTV is relationship-priced in the upfronts. Agents stay genuinely useful for pre-buy workflow and narrow curated-PMP automation, but autonomous agent-to-agent buying at scale never becomes dominant this decade. Both AdCP and ARTF persist as niche tooling, and the incumbents — a DSP take around 20%, the largest SSPs — keep the spread, lightly AI-assisted. The vendor efficiency figures (40–50% supply-chain-cost cuts, 87% faster setup) prove real but stay bounded to curation.\n\n**How this number was derived.** Reference-class, adopted as the convergent estimate of four of the five lines of reasoning (driver 15–22, contrarian 14–20, actor-incentive 10–16, discontinuity 8–14; the base-rate line folds it into human-gated Layering). The class of hyped \"next-paradigm\" ad-tech pushes — programmatic-direct, automated-guaranteed, blockchain, identity currencies, prior universal-ID — shows about 2 of 8 plateauing as assistive or niche within 3–4 years, a ~25% raw stall rate. Discounted for the well-footed MCP substrate and the reality of human-gated Omnicom buys: 0.25 × ~0.65 ≈ 0.16. Scrutiny trimmed the top (real human-gated holdco buys lower full-stall odds) and noted both the overlap with human-gated Layering and the complementarity with Disintermediation's volume gate, so probability mass moves among them. A market cross-check — Zvi Mowshowitz's market on >5% agentic checkout and $5B AI ad spend by end-2026 sitting at ~27% (so ~73% missed) — supports near-term-disappointment mass compressing toward the mid-teens by 2029. Banded 14–20%.\n\n**Drivers.** Volume reality (a handful of campaigns against hundreds of billions of daily transactions); rate-card and price-taker resistance, with premium CTV relationship-priced via the upfronts (Paparo); human-in-the-loop by design (TTD's \"not yet,\" AdCP's architectural approval, Omnicom's \"nothing's overnight\"); unresolved trust, liability, and measurement gaps, with shoppable-CTV checkout still a QR-or-send-to-phone hand-off; and agentic-checkout stumbles (OpenAI's Instant Checkout retreat, Walmart's roughly one-third conversion).\n\n**Conditions.** This holds if production spend never crosses from \"campaigns\" to a material reported share, and the human-approval boundary stays put.\n\n**Signals to watch.** Whether AdCP/AAMP production spend crosses from \"campaigns\" to a reported material percentage of CTV or programmatic by 2027. An independent, non-vendor audit of the 40–50% / 87%-faster figures. TTD, Omnicom, or WPP moving the human-approval boundary toward true autonomy. And the AdCP Curation Protocol (Q2 2026) both shipping and getting streamer adoption versus stalling.\n\n**Time horizon.** Through 2029; plateau-versus-scale should be readable in 2027–2028.\n\n### Scenario 4: Material Disintermediation\n\n**Probability: 10–16%.** The contrarian-on-magnitude case, double-gated.\n\n\n**Description.** Here, agentic buying does not merely reroute the spread — it materially and visibly compresses the open-market DSP+SSP+curation stack by 2029. Seller-agent direct buys, agentic supply-path optimization, and a live take-rate price war (Amazon DSP's 0%/1% CTV fees, Universal Ads' zero fee, Azerion's Hawk at roughly an 80% cut) drag the blended open-market take toward the low teens for the contestable slice. The Trade Desk's ~20% take, flat since 2017, finally breaks. SSP consolidation accelerates past the sub-10 survivors. The accelerant is the holding-company buyer agent — Omnicom recapturing the DSP toll for clients. Crucially, this stays contained to the open market: the gardens' in-wall spread does not compress, so this compresses the remainder, not all spend.\n\n**How this number was derived.** Reference-class, double-gated, and converged across the contrarian, base-rate, driver, and discontinuity lines of reasoning. Take-rate compression after a \"who-touches-the-dollar\" rewiring shows up in about 4 of 5 shocks since 2012 (header bidding, SPO, ID-resolution, transparency, ads.txt), producing double-digit-point erosion within 3–4 years — but conditional (~0.80) on actually scaling. Gate 1: P(agentic open-market buying reaches material scale by 2029) ≈ 0.25 (\"piloted not production,\" TTD's \"not yet,\" Paparo). So 0.80 × 0.25 ≈ 0.20. Scrutiny added Gate 2: doc 12's \"diminish not eliminate / rerouted not removed\" (Claim 12.5) plus Paparo's \"re-concentrates to large publishers\" gives P(compress not reroute | scale) ≈ 0.55. So 0.80 × 0.25 × 0.55 ≈ 0.11. The same scrutiny defeated the higher 15–22%: enclosure contains compression to the shrinking open market, capping the upside. The band centers in the low teens; the Zvi proxy sits at ~27%. Banded 10–16%.\n\n**Drivers.** The live take-rate price war (Amazon DSP 0%/1% CTV fees, Universal Ads zero fee, Hawk ~80% cut); seller-agent \"true direct buys\" bypassing the exchange and DSP, with agentic SPO compounding SSP consolidation (20+ down to <10); holdco buyer agents (Omnicom #1 post-IPG, with Acxiom data) recapturing the ~20% toll for clients; margin-from-opacity erosion, since an open transparency standard is attractive to the buyers who keep the spread; and vendor-reported supply-chain-cost cuts (40–50%, 87% faster) if they survive an independent audit.\n\n**Conditions.** This fires only if agentic open-market buying reaches material scale and compression beats rerouting — both gates have to clear.\n\n**Signals to watch.** TTD's reported take rate breaking below ~18% (or Jeff Green abandoning the \"15–20%\" pledge), tied to agentic direct buying. A major streamer reporting CTV spend shifting to seller-agent direct buys away from DSP-mediated PMP. An independent audit confirming or refuting the 40–50% / 87%-faster figures. And curation fees visibly compressing rather than relocating.\n\n**Time horizon.** Earliest visible 2028; resolves 2029.\n\n### Scenario 5: Regulatory / Substrate Shock (wildcard)\n\n**Probability: 8–14%.** Two near-independent shock paths combined into one tail.\n\n**Description.** A discontinuity outside the market equilibrium becomes decisive by 2029 via one of two routes. The regulatory route redraws the board through public law: Judge Brinkema orders an AdX divestiture and the remedy reaches Google's agentic front door (Ads MCP, Ask Advisor, AP2); the FTC/DOJ February 2026 inquiry treats AdCP/AAMP's registry, dues, and voting classes as an exclusionary standard-setting gate; the RealPage decree makes shared algorithmic reliance on non-public data enforceable without an explicit agreement and points at agent-to-agent pricing; or the EU designates AI a \"virtual assistant\" core platform service, cracking the gardens' ad-agents. The substrate route turns on this forecast's most-likely-wrong premise — its near-certainty on MCP. A forked or competing agent-substrate gains ad-tech traction, the gardens' \"MCP directly\" servers turn out to be incompatible per-platform dialects, or the model layer subsumes the substrate so that \"whose model\" beats \"which MCP.\"\n\n**How this number was derived.** Two near-independent shock paths combined. The regulatory path (the surviving split runs 5–10% versus 12–18%) aggregates, from doc 11 §3: a Google remedy reaching agentic plays ~0.22, FTC/DOJ standard-setting guidance ~0.08, a RealPage-style agentic-pricing action ~0.07, an EU AI-as-CPS designation ~0.07 (the EU declined in April 2026), and an agent-blocking reversal ~0.06 — giving P(≥1) ≈ 0.45 × P(reshaping not marginal) ≈ 0.27 ≈ 0.12. Neither the floor (single-proceeding base plus the EU deferral) nor the ceiling (five proceedings plus a tight standard-setting fit lifting P(decisive | fires)) was refuted, so the band spans it. The substrate fault line (6–12%): a single-vendor (Anthropic) standard adopted by rivals is a governance fault line; the swept \"STOP investing in 2026\" market at ~48% measures one-year withdrawal, not multi-year fragmentation; the base rate for such a standard fragmenting within ~5 years is ~0.08–0.10. Two ~0.08–0.12 paths, de-duplicated against the other scenarios' triggers, land at 8–14%.\n\n**Drivers.** Five antitrust proceedings mid-flight at once (the Brinkema remedy, the FTC/DOJ February 2026 inquiry, the RealPage doctrine, the EU DMA AI-CPS question, the agent-blocking split); AdCP/AAMP registries, dues, and voting classes mapping onto standard-setting and algorithmic-coordination targets (the Allied Tube / Hydrolevel line of doctrine); structural-separation spillover from a Google AdX remedy reaching Ask Advisor, Ads MCP, or AP2; MCP authored by Anthropic but adopted by rivals, a governance asymmetry, with per-garden \"MCP directly\" interoperability asserted rather than proven; and a model-layer power center forming above the substrate, where \"whose model\" could dominate \"which MCP.\"\n\n**Conditions.** Either a forceful regulatory ruling lands and reaches the agentic surfaces, or the MCP substrate fractures — either is sufficient.\n\n**Signals to watch.** Whether Brinkema orders a structural AdX divestiture reaching agentic surfaces. The final FTC/DOJ competitor-collaboration guidance (after the May 21, 2026 comment close) naming standard-setting consortia, agent registries, or algorithmic pricing. The EU moving from \"assessing\" to designating AI a virtual-assistant CPS within the window. Documented MCP dialect incompatibilities across garden servers, or a major vendor forking or deprecating MCP. And Anthropic monetizing MCP/Claude discovery, or MCP download and registry growth stalling or splintering.\n\n**Time horizon.** Through 2029; antitrust rulings 2026–2027 with appeals running to the back of the horizon; substrate signals 2027–2029.\n\n## Base Rates\n\n**Ad-tech standards contests over ~15 years (N=8: OpenRTB, VAST/VPAID, Prebid, ads.txt/sellers.json, UID2, Privacy Sandbox, DFP/AdX, OpenDirect).** Roughly 6 of 8 resolved as layering or absorption — the open plumbing wins or is absorbed, and gardens route around — about 75%. This anchors the Layering modal, but it is discounted: every prior winner emerged from an already-at-scale market, whereas AdCP launched from \"zero dollars.\" Treat it as an upper bound, not a flat input.\n\n**Insurgent open standard surviving as a durable independent body against an entrenched standard-setting organization.** About 1 of 8 (only Prebid, which still coexists), roughly 12%. This is the floor, and it is why \"AdCP endures fully independent\" folds largely into Layering's absorption sub-path rather than standing as its own modal outcome.\n\n**Walled gardens routing around an open ad-tech standard.** About 8 of 8 (UID2, Privacy Sandbox, owned-and-operated), effectively 100% — near-certain, and therefore priced into every scenario rather than being distinguishing evidence for Enclosure. The live question is whether enclosure subordinates the open contest (~0.40), which this reference class does not settle.\n\n**Take-rate compression after a structural rewiring (header bidding, SPO, ID-resolution, ads.txt, trading-desk erosion).** About 4 of 5 produced double-digit-point erosion in the affected layer within 3–4 years — but conditional on scaling (~0.25 by 2029) and on compression beating rerouting (~0.55, given doc 12's \"rerouted not removed\" and Paparo's \"re-concentrates to large publishers\"). This is what double-gates Material Disintermediation.\n\n**Hyped \"next-paradigm\" ad-tech pushes (programmatic-direct, automated-guaranteed, blockchain, identity currencies, prior universal-ID).** About 2 of 8 plateaued as assistive or niche within 3–4 years, a ~25% raw stall rate, discounted for the well-footed MCP substrate and the real (human-gated) Omnicom buys. This anchors the Plateau.\n\n**Regulation as the decisive force in a major ad-tech outcome within ~4 years.** Low — the Google case has run since 2023 with appeals likely past 2029, and the EU declined AI-as-CPS in April 2026 (a multi-year Article 19 path) — but five proceedings run simultaneously and the AdCP/AAMP registry is a tight standard-setting and algorithmic-coordination fit, so the surviving range runs from 5–10% (single-proceeding base) to 12–18% (multi-proceeding plus doctrinal fit).\n\n**Single-vendor-authored open standard fragmenting or being supplanted within ~5 years of dominance (cf. browser/JS-engine and container-runtime forks).** A minority outcome, ~0.08–0.10. The Linux Foundation donation (December 2025) and ~97M monthly downloads push it down; the long-peace-illusion warning pushes it up. This caps the Substrate Fault Line at a tail.\n\n**CTV sell-side is diffuse, not garden-dominated.** Only three sellers are expected to clear 10% of US CTV in 2026 (YouTube 11.9%, Amazon >10%, Disney 10.8% — and Disney is a streamer, not a walled garden), so enclosure runs through model-layer discovery and holdco routing more than through raw CTV owned-and-operated share.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n|---|---|---|---|---|\n| [Manifold](https://manifold.markets/IsaacKing/major-ai-companies-like-openai-and) | Major AI companies (OpenAI, Anthropic) will stop investing in MCP in 2026 | 48% (0.48) | 15 holders; 34 trades (thin, play-money) | 2026-06-20 |\n| [Manifold](https://manifold.markets/jgyou/will-any-top20-us-or-canadian-broke) | Any top-20 US/Canadian brokerage publicly endorses an open investing-agent standard by end of 2027? | 37% (0.372) | ~M408; 4 traders (very thin) | 2026-06-20 |\n| [Manifold](https://manifold.markets/ZviMowshowitz/soai1-a-major-retailer-reports-5-of) | A major retailer reports >5% of online sales from agentic checkout as AI agent ad spend hits $5B | 27% (0.267) | ~M1,273; 19 traders (thin) | 2026-06-20 |\n| [Manifold](https://manifold.markets/AlistairRoche/will-openai-reference-anthropics-mo) | Will OpenAI reference Anthropic's MCP by end of 2025? | 96% (0.957) — RESOLVED YES | ~M7,053; 15 holders | 2026-06-20 |\n| [Manifold](https://manifold.markets/slug/apple-adds-mcp-support-before-june) | Apple adds MCP support before June 8, 2026? | 95% (0.952) — RESOLVED YES | 853 MANA | 2026-06-20 |\n| [Manifold](https://manifold.markets/bmorphism/will-claude-and-other-base-models-s) | Will Claude and other base models support MCP natively by 2026? | 86.5% (0.865) | ~M1.5; 2 traders (negligible) | 2026-06-20 |\n| [Manifold](https://manifold.markets/slug/how-many-mcp-servers-will-there-be) | How many MCP servers at EOY 2026? | Modal buckets ~20% each: 20k–30k 19.8%, 30k–40k 18.1%, 40k–60k 19.8%, 60k–80k 19.8%; >80k 13.0%; <10k 2.1% | 243 MANA; 3 bettors | 2026-06-20 |\n| [Manifold](https://manifold.markets/IsaacKing/will-flagship-llms-begin-integratin) | Will flagship LLMs begin integrating ads into responses before 2026? | 5% (0.051) | ~M2,245; 63 traders | 2026-06-20 |\n| [Manifold](https://manifold.markets/slug/will-apples-wwdc26-keynote-transcri) | Will Apple's WWDC26 Keynote transcript mention MCP? | 6.2% (0.062) | 736 MANA; 20 bettors | 2026-06-20 |\n| [Manifold](https://manifold.markets/Terminator2/will-a-top20-super-bowl-advertiser) | Will a top-20 Super Bowl LXI advertiser air a primarily AI-generated commercial (Feb 2027)? | 35% (0.352) | ~M70; 6 traders (very thin) | 2026-06-20 |\n\nNo liquid market prices the exact question. Polymarket, Kalshi, and Metaculus were empty for it on 2026-06-20, and the Manifold proxies above are all thin, play-money, and either decomposed inputs or merely related — color, not an anchor, with the base-rate and decomposition grounding carrying the weight. What the markets do say is consistent with the forecast. The substrate-floor premise that holds Layering up and floors Enclosure — MCP as durable, neutral plumbing — is corroborated by the resolved-YES MCP-reference markets (OpenAI 96%, Apple 95%), by native-support at 86.5%, and by the \"stop investing in MCP in 2026\" market sitting at only 48% despite measuring just a one-year withdrawal (the comment thread argues NO, citing the LF donation and ~97M downloads). The near-term disappointment that underwrites the Plateau scenario shows up directly: the Zvi >5%-agentic-checkout-and-$5B market sits at ~27%, implying ~73% odds the near-term scaling story misses. The brokerage open-standard proxy at 37% is a loose analog for an institution publicly endorsing an open agent standard, supporting Enclosure's high-20s/low-30s. And the \"LLMs integrate ads before 2026\" market at 5% mostly reflects timing, not direction — the direction (ads moving into model outputs) is exactly the model-layer chokepoint that drives Enclosure, now live via ChatGPT and Google AI Mode. In short, the markets gently support a durable substrate plus near-term scaling disappointment: the two-pole, pre-volume picture this forecast converged on.\n\n## What Would Change My Forecast\n\n1. **Absorption confirmed.** IAB Tech Lab absorbs AdCP-style negotiation grammar into the AAMP SDKs (watch v3.0, July 2026), or AdCP and AAMP converge on a shared schema — this consolidates Layering and collapses the \"war.\"\n2. **A garden breaks ranks.** A walled garden (Amazon, Google, Meta, TikTok, or post-close Fox-Roku) joins AdCP or AAMP, or exposes premium CTV rate cards to a neutral buyer agent at scale — this breaks the near-certain \"gardens route around\" premise and shifts weight from Enclosure toward Layering and Disintermediation.\n3. **The demand-side hinge resolves.** Whether holdco buyer-agent volume stays AdCP-native (feeds Layering) or migrates to bilateral garden/publisher pipes (feeds Enclosure) — the single demand-side hinge between the two co-modal poles.\n4. **Volume crosses from pilot to production.** Reported AdCP/AAMP transacted volume crossing from \"a handful of campaigns\" to a material reported share of CTV/programmatic spend (toward ~10% of non-garden programmatic) by 2027–28 — down-weights Plateau, up-weights Layering or Disintermediation.\n5. **The take rate breaks.** The Trade Desk's ~20% take rate (flat since 2017) breaking below ~18% attributable to agentic direct buying — fires Material Disintermediation; continued ~20% stability confirms \"rerouted not removed\" / Plateau.\n6. **The efficiency figures get audited.** An independent, non-vendor audit confirming or refuting the 40–50% supply-chain-cost / 87%-faster figures — load-bearing for whether Disintermediation is live or hype.\n7. **The model layer captures selection.** OpenAI's \"answer independence\" firewall breaking (ads influence selection), and/or ChatGPT/Gemini ad surfaces moving to GA as a top-5 surface — raises Garden + Model-Layer Enclosure.\n8. **The blocking template holds or fails.** Amazon v. Perplexity (Comet) surviving to final merits and being replicated/cited (raises Enclosure) versus reversed or narrowed (strengthens the open path).\n9. **A forceful regulatory ruling.** Brinkema ordering a structural AdX divestiture reaching Google's agentic plays, an enforcer treating an agent registry as an exclusionary standard-setting gate, RealPage logic applied to agent-to-agent pricing, or the EU designating AI a \"virtual assistant\" CPS — elevates the Regulatory wildcard from tail to driver.\n10. **The substrate fractures.** MCP losing neutral governance, being forked or deprecated by a major model vendor, or per-garden \"MCP directly\" servers proving to be incompatible dialects — fires the Substrate Fault Line; demonstrated cross-garden MCP portability collapses it toward zero.\n\n## Open Questions\n\n- **Does holdco buyer-agent volume stay AdCP-native or migrate to bilateral pipes?** This is the empirical hinge between the two co-modal poles, and it is not yet observable.\n- **Do the model-layer ad surfaces (ChatGPT, Google AI Mode, Rufus) scale to a top-5 surface, and does answer-independence survive monetization pressure?** This is the second unobservable that decides Layering versus Enclosure.\n- **Are the vendor efficiency claims (40–50% cost cut, 87% faster) real at production scale, or bounded to curation demos?** No independent, non-vendor audit exists in the public record; this is the single most important sourcing gap, flagged throughout the corpus.\n- **Will any premium streamer expose rate-card inventory to a neutral buyer agent at scale?** Paparo's rate-card resistance is the structural blocker that caps both scaling and compression; one named defection would refute the Plateau and reweight several scenarios.\n- **Is this forecast's near-certainty on MCP its most-likely-wrong premise?** Per-garden \"MCP directly\" interoperability is asserted, not proven; documented dialect incompatibilities would fire the Substrate Fault Line.\n- **Will any of the five live antitrust proceedings actually reach the agentic surfaces, or resolve narrowly on non-antitrust grounds?** The difference between the regulatory floor (5–10%) and ceiling (12–18%) turns on this.\n\n## Sources\n\nForecast-bearing sources, drawn from the corpus. Tier labels and access notes are carried from the corpus documents.\n\n1. INMA, \"Understanding the agentic advertising moment,\" 2026. https://www.inma.org/blogs/advertising-initiative/post.cf "Will Apple's WWDC26 Keynote transcript mention MCP or Model Context Protocol?\" https://manifold.markets/slug/will-apples-wwdc26-keynote-transcri — 6.2%; related.\n50. Manifold, \"Will a top-20 Super Bowl advertiser air a primarily AI-generated commercial during Super Bowl LXI (Feb 2027)?\" https://manifold.markets/Terminator2/will-a-top20-super-bowl-advertiser — 35%; very thin; creative-side, not buying standards.\n\n*Note on the no-market gap: Polymarket, Kalshi, and Metaculus were checked on 2026-06-20 and carried no liquid market on the exact question. The Manifold proxies above are thin and play-money, used only as a directional sanity check on the substrate-durability and near-term-scaling premises.*"}], "glossary": [{"term": "A2A", "aliases": ["Agent2Agent", "Agent-to-Agent"], "def": "An open standard, introduced by Google in 2025, that lets AI agents built by different companies discover each other, authenticate, and hand off tasks to one another, complementing MCP's agent-to-tool connections with agent-to-agent ones."}, {"term": "AAMP", "aliases": ["Agentic Advertising Management Protocols"], "def": "The umbrella name the IAB Tech Lab (the ad industry's standards body) gave to its collection of agentic-AI initiatives, including ARTF and a registry for identifying trustworthy AI agents."}, {"term": "ACP", "aliases": ["Agentic Commerce Protocol"], "def": "A standard built by OpenAI and Stripe that lets an AI agent complete a purchase on a merchant's behalf inside a chat interface, powering features like ChatGPT's Instant Checkout."}, {"term": "ACR", "aliases": ["Automatic Content Recognition", "automatic content recognition"], "def": "Software built into many smart TVs that identifies what is playing on screen by sampling the picture frame by frame, letting the TV maker or advertiser know what a household watched so ads can be targeted to it."}, {"term": "Ad exchange", "aliases": ["ad exchange"], "def": "A digital marketplace where advertisers' buying software and publishers' selling software meet to auction ad space in real time."}, {"term": "Ad-tech tax", "aliases": ["ad tech tax"], "def": "Industry shorthand for the cumulative fees and margins that intermediaries in the digital-advertising supply chain skim off before an ad dollar reaches the publisher, estimated at roughly a quarter of programmatic spend."}, {"term": "AdCOM", "aliases": ["Advertising Common Object Model"], "def": "A shared technical dictionary of standard terms (like 'device,' 'user,' or 'placement') that lets different advertising systems describe an ad opportunity the same way instead of each using its own incompatible format."}, {"term": "AdCP", "aliases": ["Ad Context Protocol"], "def": "An open standard, launched in October 2025 by a coalition of ad-tech and publishing companies, that lets AI agents representing advertisers and publishers negotiate and complete media buys in plain language, often outside the traditional split-second ad auction."}, {"term": "Agent Registry", "aliases": ["agent registry"], "def": "A directory maintained by a standards body that lists AI agents recognized as legitimate and trustworthy, so publishers and advertisers can tell a verified agent apart from an unrecognized or potentially malicious one."}, {"term": "AP2", "aliases": ["Agent Payments Protocol"], "def": "A payment-authorization standard from Google that lets an AI agent prove, through a chain of cryptographically signed digital records, exactly what a human authorized it to buy and for how much, so merchants and card networks can trust a purchase an agent made on someone's behalf."}, {"term": "ARTF", "aliases": ["Agentic RTB Framework", "Agentic Real-Time Framework"], "def": "A framework from the IAB Tech Lab that speeds up the traditional split-second ad auction by letting outside companies' bidding software run as small, sealed programs physically inside the auction host's own data center, cutting out the network delay of calling out to a separate company's servers."}, {"term": "authorization gap", "aliases": [], "def": "A term describing the situation where a brand's products can be found and bought by an AI shopping agent on one retail platform (because that platform allows outside agents in) but not on another platform (because it blocks them), regardless of what the shopper wants."}, {"term": "bid request / bid response", "aliases": ["bid request", "bid response"], "def": "The two-part message exchange at the heart of a real-time ad auction: a publisher's system describes an available ad slot and audience (the bid request), and an advertiser's system replies with an offer and an ad to show (the bid response), all within about a tenth of a second."}, {"term": "bidstream bloat", "aliases": ["bidstream"], "def": "The buildup of excessive, duplicate, or low-value bid requests flooding advertisers' buying systems, which wastes computing time and money without improving which ads actually get bought."}, {"term": "clean room", "aliases": ["data clean room"], "def": "A secure computing environment where two companies can let their data be matched or analyzed together for advertising purposes without either company actually seeing the other's raw underlying data."}, {"term": "colocation", "aliases": ["colocated"], "def": "Running one company's software directly on or alongside another company's own servers, inside the same data center, instead of having it communicate over the public internet, which eliminates network delay."}, {"term": "container", "aliases": ["containerized", "containerization"], "def": "A small, self-contained, portable package of software that can be dropped into and run inside someone else's computing environment, used here to let one company's ad-targeting logic run safely inside another company's data center."}, {"term": "CTV", "aliases": ["Connected TV", "connected TV"], "def": "Television watched through an internet-connected device or app rather than an old-fashioned antenna or cable box, such as a Roku, Amazon Fire TV, or a smart TV's built-in streaming apps."}, {"term": "curation", "aliases": ["curated"], "def": "The practice of a publisher or third-party specialist bundling multiple advertisers' inventory together with audience data and quality controls into a ready-to-buy package, rather than selling each ad slot individually in an open auction."}, {"term": "DSP", "aliases": ["demand-side platform"], "def": "The software an advertiser or its agency uses to find and bid on ad space across many publishers and websites at once, rather than negotiating with each one separately."}, {"term": "FAST", "aliases": ["free ad-supported streaming television", "FAST service"], "def": "A category of streaming TV channels, like Tubi or The Roku Channel, that are free to watch because they are funded entirely by advertising rather than a subscription fee."}, {"term": "gRPC", "aliases": [], "def": "A fast, efficient technical format for exchanging structured data between computer systems, chosen for real-time ad auctions because it is quicker to process than the more human-readable formats used elsewhere in the industry."}, {"term": "IAB Tech Lab", "aliases": ["IAB"], "def": "The digital-advertising industry's incumbent standards-setting organization, which has run the technical rules of programmatic advertising (including OpenRTB and VAST) for over a decade and is now building the ARTF/AAMP response to agentic AI."}, {"term": "impression", "aliases": [], "def": "One instance of a single ad being shown to a single person one time, the basic unit that gets bought and sold in digital advertising."}, {"term": "IVT", "aliases": ["invalid traffic", "GIVT", "general invalid traffic", "SIVT", "sophisticated invalid traffic"], "def": "Ad views or clicks generated by bots, scripts, or other non-human activity rather than a real person, which advertisers typically don't want to pay for; verification companies split it into obvious 'general' invalid traffic and harder-to-detect, deliberately disguised 'sophisticated' invalid traffic."}, {"term": "MCP", "aliases": ["Model Context Protocol"], "def": "An open technical standard, released by Anthropic in November 2024, that lets an AI model connect to outside tools, data, and services through one common method instead of a custom-built connection for every single tool, and which has become the shared foundation nearly every AI-agent standard in advertising is built on top of."}, {"term": "MFA", "aliases": ["made-for-advertising"], "def": "Low-quality websites or content built primarily to display as many ads as possible rather than to inform or entertain readers, considered a form of ad waste."}, {"term": "M×N integration problem", "aliases": ["M x N problem"], "def": "The costly situation where connecting every one of M systems to every one of N other systems requires a separate custom-built link for each pair, a problem MCP and earlier standards like OpenRTB were built to solve by giving everyone one shared connection method instead."}, {"term": "OpenRTB", "aliases": ["Open Real-Time Bidding"], "def": "The industry-standard technical specification, in use since 2010, that defines how publishers' selling software and advertisers' buying software exchange bid requests and responses during a real-time ad auction."}, {"term": "PMP", "aliases": ["private marketplace"], "def": "An invitation-only version of an ad auction where a publisher offers its premium ad space to a select group of pre-approved buyers, often bundled with the publisher's own audience data, rather than opening it to anyone in the general auction."}, {"term": "programmatic advertising", "aliases": ["programmatic"], "def": "The automated buying and selling of digital ad space by software, using auctions and pre-set rules, instead of people manually negotiating and placing individual ad orders."}, {"term": "programmatic guaranteed", "aliases": ["PG"], "def": "An automated deal in which an advertiser reserves a fixed amount of ad space at an agreed price in advance, combining the certainty of a traditional negotiated ad buy with the automated execution of programmatic technology."}, {"term": "RTB", "aliases": ["real-time bidding"], "def": "The dominant method of buying digital ads, in which each individual ad opportunity is auctioned off to the highest bidder in roughly the time it takes a webpage or video to load."}, {"term": "seller agent", "aliases": ["seller agents"], "def": "AI software, run on a publisher's behalf, that receives a plain-language request from a buyer's AI agent, checks it against the publisher's available ad inventory, and proposes or negotiates a deal — potentially without a traditional ad-buying platform in the middle."}, {"term": "Shoppable CTV", "aliases": ["shoppable television", "T-commerce"], "def": "Streaming TV ads that let a viewer take a direct buying action after seeing them, such as scanning a QR code, using a remote to add an item to a cart, or sending a product link to a phone."}, {"term": "Signal loss", "aliases": [], "def": "The industry-wide decline in the tracking data (like browser cookies or mobile device IDs) advertisers historically relied on to target and measure ads, driven by privacy restrictions from Apple, Google, and regulators."}, {"term": "SPO", "aliases": ["supply-path optimization"], "def": "The practice of an advertiser or its agency identifying and using the shortest, cheapest chain of intermediaries to buy a given piece of ad inventory, cutting out redundant or high-fee middlemen."}, {"term": "SSAI", "aliases": ["server-side ad insertion"], "def": "A technique, common in streaming TV, where the video ad is spliced directly into the video stream by the broadcaster's server before it reaches the viewer's device, rather than being fetched separately by the viewer's app — making it much harder to block."}, {"term": "SSP", "aliases": ["supply-side platform"], "def": "The software a publisher uses to offer its available ad space for sale to many potential advertisers or buying platforms at once."}, {"term": "VAST", "aliases": ["Video Ad Serving Template"], "def": "A standard technical template that tells a video player exactly which video ad to load, how long it should run, and where to send tracking data, allowing the same ad to play correctly across many different streaming apps and devices."}, {"term": "verifiable credential", "aliases": ["VC", "verifiable credentials"], "def": "A digital, cryptographically signed record that proves a specific fact (such as that a person authorized a purchase) in a way that can be checked and trusted by another party without needing to contact the original issuer directly."}, {"term": "walled garden", "aliases": [], "def": "A large platform, such as Google, Amazon, or Meta, that controls its own advertising demand, supply, audience data, and measurement end-to-end, making it difficult for outsiders to see inside or connect to it on equal terms."}, {"term": "x402", "aliases": [], "def": "A payment standard, built by Coinbase, that lets computer programs pay each other tiny amounts automatically and instantly using stablecoins (dollar-pegged cryptocurrency), designed for machine-to-machine transactions rather than human shoppers."}]}</script>
