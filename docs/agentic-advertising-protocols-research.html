advertising/ — Tier 5. MCP-as-substrate; layered protocols (AdCP/UCP/WebCP); Snyder \"margins come from nobody having the full picture.\" Accessed 2026-06-19.\n32. PPC Land, \"The Trade Desk's Q2 Kokai updates,\" 2026. https://ppc.land/the-trade-desks-q2-kokai-updates-ai-controls-ctv-pause-ads-deal-desk/ — Tier 5. TTD agentic posture / build-own. Accessed 2026-06-19.\n33. INMA, \"Understanding the agentic advertising moment,\" 2026. https://www.inma.org/blogs/advertising-initiative/post.cfm/understanding-the-agentic-advertising-moment — Tier 5 (publisher-trade association). \"Zero dollars currently transacting through AdCP\"; ~$400B non-garden programmatic; walled-garden concentration. Accessed 2026-06-19.\n34. PPC Land / Marketing Dive, AdCP adoption (PubMatic+Butler/Till Dec 2025 live campaign +40% impressions; Agent Registry ~10 entries by Mar 11 2026; Affinity joins Jun 9 2026). https://ppc.land/affinity-joins-adcp-to-put-oem-and-browser-inventory-into-agentic-ad-standards/ — Tier 5. NOTE: +40% impressions is a PubMatic-reported figure, not independently audited. Accessed 2026-06-19.\n35. Search Engine Land / Google blog, \"Google launches Ask Advisor across Ads, Analytics and Merchant Center,\" May 20, 2026; Ads Advisor timeline. https://searchengineland.com/google-launches-ask-advisor-across-ads-analytics-and-merchant-center-478114 — Tier 5 + Tier 1 (Google blog). Ads Advisor history; Ask Advisor launch. Accessed 2026-06-19.\n36. Google, \"Meet Ask Advisor, your new AI-powered collaborator,\" blog.google, May 2026. https://blog.google/products/ads-commerce/ask-advisor/ — Tier 1 (Google's own claim). Ask Advisor spans Ads/Analytics/Merchant; builds on Ads Advisor + Analytics Advisor; beta, English-only. Accessed 2026-06-19.\n37. INMA + AdExchanger walled-gardens analysis, 2026 (33 + https://www.adexchanger.com/data-driven-thinking/tactical-implications-walled-gardens/) — Tier 5. Gardens keep gardens closed; concentration/fragmentation risk; margins-from-opacity. Accessed 2026-06-19.\n38. AdExchanger, \"Publishers: Don't Fear Curation Fees, They're Just The Same Old Ad Tech Tax\" + Digiday curation transparency, 2026. https://www.adexchanger.com/programmatic/publishers-dont-fear-curation-fees-theyre-just-the-same-old-ad-tech-tax/ — Tier 5. ~half of curation deals carry extra fees; non-disclosed rev-share. Accessed 2026-06-19.\n39. AdExchanger, \"The Agentic Marketplace Is Here. Where Does That Leave DSPs and SSPs?,\" Apr 2, 2026. https://www.adexchanger.com/ai/the-agentic-marketplace-is-here-where-does-that-leave-dsps-and-ssps/ — Tier 5. Minvielle \"pay a DSP and SSP fee for something processed differently\"; CTV \"programmatic obsolete\"; Vermeulen \"there's a better way\"; survival where scale unmatched. Accessed 2026-06-19.\n40. Digiday, \"WTF is Ad Context Protocol (AdCP)?,\" 2025. https://digiday.com/media-buying/wtf-ad-context-protocol/ — Tier 5 (buy-side-leaning trade press). Seller-agent model bypassing DSPs; \"true direct buys\"; O'Kelley \"debut of header bidding\"; governance via forthcoming nonprofit. Accessed 2026-06-19."}, {"order": 6, "file": "06_CTV_Agentic.md", "title": "Agentic Advertising in CTV Specifically", "summary": "", "body": "# Agentic Advertising in CTV Specifically\n\n## Bottom Line\n\nPull the whole agentic-advertising story back to the living-room buy and three things come into focus.\n\n**First, CTV is the channel where agents *should* matter most and *can* deliver least — at the same time.** It carries the most money per impression, the heaviest curation and private-deal overhead, and the most walled-garden concentration. Those are exactly the conditions an agent-negotiation layer is built to attack. But CTV also runs disproportionately on direct and programmatic-guaranteed deals, where there is no auction for an agent to win, priced off rate cards sellers have every incentive to keep out of any shared protocol.\n\n**Second, the walled gardens are not waiting for the standards war to resolve. They are building their own agents inside their own gardens.** Amazon shipped an Ads MCP server in open beta (Feb 2, 2026); Disney launched a Disney Ads Agent at CES 2026 (Jan 8, 2026) on top of its DRAX biddable exchange; Magnite stood up a seller agent in SpringServe (Jan 6, 2026) and a full Orchestration coordination layer (June 11, 2026); PubMatic ran a fully agentic CTV campaign for Clubtails through AgenticOS (Dec 15, 2025); Netflix, Roku, and Samsung each layered AI across their ad stacks.\n\n**Third, the supply-chain math is the real story, and it cuts two ways.** Agentic curation pitches a 40–50% reduction in supply-chain cost (PubMatic's own AgenticOS figure) and 87% faster setup — a direct threat to the DSP's ~20% take rate (The Trade Desk's has sat at ~20% since 2017) and to redundant SSP hops. But the seller-agent model that \"bypasses the DSP\" mostly re-concentrates value in the largest publishers and the agent operators themselves — exactly as the skeptics (Ari Paparo) predict programmatic always has.\n\nThe honest read for a CTV buyer in mid-2026: agents are genuinely live in pre-buy workflow — planning, setup, creative, troubleshooting — and in narrow curated-PMP pilots. **Autonomous agent-to-agent CTV buying at scale is piloted, not production** — The Trade Desk itself says its agents are \"not buying ads — at least not yet.\" Agents are solving a real CTV pain at the edges: curation overhead, fragmentation, RFP latency. Meanwhile the hype is piling onto a channel that still books most of its premium inventory the old-fashioned way — salesperson to salesperson.\n\n---\n\n## 1. Why CTV Is Structurally Different — and Why That Changes How Agents Operate\n\nBefore naming who is doing what, answer one question: *why is CTV its own problem?* Five structural features set the living-room buy apart from the open web, and each one bends the agentic story.\n\n### 1.1 The money is concentrated, but the *sellers* are not\n\nUS connected-TV ad spend is projected at roughly **$37.7–38 billion in 2026**, up about 14% from ~$33.4 billion in 2025; in 2026 US CTV upfront ad spending (~$17.73 billion) is expected to exceed primetime linear-TV upfront spending (~$16.98 billion) for the first time [1][2]. The channel is now large enough to be worth automating, and prestigious enough that mistakes are expensive.\n\nHere is the counter-intuitive part for anyone who assumes \"walled garden\" means \"duopoly\": **CTV sell-side concentration is comparatively *low***.\n\nPer eMarketer, the CTV ad market is \"far more diffuse than the social network landscape\": only three companies are expected to clear 10% of US CTV ad sales in 2026 — **YouTube at 11.9%, Amazon surpassing 10%, and Disney (Hulu + Disney+) at 10.8%** [3]. For comparison, eMarketer notes Meta alone will still book over $10 billion *more* video ad spending ($48.77B) than all of CTV combined ($37.70B) in 2026 [3].\n\nWhat this means for agents: in social, an agent that can talk to Meta and Google reaches the overwhelming majority of supply. In CTV, an agent must negotiate with *dozens* of premium sellers — Disney, NBCUniversal/Peacock, Paramount, Warner Bros. Discovery/Max, Netflix, Roku, Samsung, Amazon, YouTube, Tubi, Fubo, DIRECTV, Spectrum Reach, and a long tail. **Sell-side fragmentation is exactly the pain an agent-negotiation layer claims to solve** — one buyer agent fanning a brief across many seller agents. That is why the protocol fight (AdCP vs. ARTF/AAMP) is being fought hardest on CTV ground.\n\n### 1.2 The deals are curated and private, not biddable and open\n\nOver 90% of US CTV ad spend in 2025 transacted through programmatic *pipes*, but the dominant deal *types* are programmatic guaranteed (PG), private marketplace (PMP), and programmatic direct — not the open exchange [4][5]. PG is the programmatic equivalent of a traditional direct buy: a fixed CPM and reserved volume agreed in advance. PMP is an invitation-only auction on premium, first-party-data-enriched inventory. The genuinely biddable, open-exchange share of premium CTV is thin.\n\nDecode for the non-specialist:\n- **Programmatic** = automated buying through software, not \"open auction.\" Most CTV is programmatic *and* direct.\n- **PG (programmatic guaranteed)** = reserved inventory at a fixed price, executed through a DSP — an automated handshake on a deal a salesperson negotiated.\n- **PMP (private marketplace)** = a curated, invitation-only deal; the publisher decides who's invited and at what floor.\n- **Curation** = a middle layer (often an SSP or a specialist) that packages inventory + audience data into a ready-to-buy deal ID, and charges a fee for it.\n\nWhat this means for agents: an agent built to win open auctions has nothing to do here — **for most premium CTV, there is no open auction to win**. The agentic opportunity in CTV is therefore *not* faster bidding. It is automating the *negotiation and curation* of PG and PMP deals that today eat weeks of email, RFPs, and deal-ID plumbing. That is why AdCP's forthcoming **Curation Protocol** (scheduled Q2 2026) and Media Buy Protocol target the deal-construction step, not the bid [6][7], and why Magnite's seller agent and PubMatic's AgenticOS pitch *deal automation*, not bid-stream speed.\n\n### 1.3 ACR data: TV's unique signal — and its unique privacy problem\n\nAutomatic content recognition (ACR) — software baked into smart TVs (Samsung, LG, Vizio, Roku devices) that fingerprints what is on screen frame-by-frame — is the signal that makes CTV distinct from the open web: it can tell an advertiser what a household actually watched across apps and even linear, enabling reach/frequency control and competitive conquesting that cookies never could on TV [8][9]. Samsung, as a hardware + software + content owner, describes itself as \"the only player that seamlessly connects hardware, software, streaming content, and person-level data at scale\" [8].\n\nWhat this means for agents: ACR is the richest *audience* input an agent could use to plan and optimize a CTV buy — and it is device-manufacturer-proprietary and privacy-sensitive. An agent never gets raw ACR. It gets *packaged segments* (Samsung's AI-enhanced suite, Disney Select, Roku's identity graph) through a controlled interface. So the agentic CTV story is gated by whoever owns the ACR/identity layer, and the platforms have every incentive to expose it through *their own* agents and clean rooms rather than a neutral protocol. ACR is one reason the walled gardens can keep agents on a leash.\n\n### 1.4 Identity and addressability: logged-in islands, no shared currency\n\nCTV addressability rests on a patchwork — device IDs, IP + household graphs, publisher logins, ACR, and data-clean-room matches — with no single shared identifier; identity resolution \"across streaming apps and platforms\" is improving but remains the central technical constraint, which is why platforms increasingly bolt on third-party signal partners (Netflix added Amazon Audiences and Yahoo ConnectID — reaching ~232M logged-in US users — in 2026) [10][11].\n\nWhat this means for agents: an agent reasoning about \"reach this audience across CTV\" must reconcile incompatible identity spaces. The protocol designs acknowledge this head-on — AdCP's **Trusted Match Protocol (TMP)** splits \"Context Match\" from \"Identity Match\" to keep identity resolution structurally separate from targeting [7]. In practice, identity fragmentation is one more reason the *walled garden's own agent* — which already resolves identity inside its garden — beats a neutral cross-publisher agent.\n\n### 1.5 The scarcity of true biddable supply changes the agent's job\n\nPut 1.1–1.4 together and the CTV agent's job is **not** the open-web agent's job. The open-web agent optimizes bids across abundant, cookie-addressable, auction-cleared impressions. The CTV agent **negotiates and curates scarce, premium, relationship-priced, identity-gated inventory**. Different verb — *negotiate*, not *bid* — and that is why the CTV-native agentic moves cluster around curation, deal construction, and planning rather than real-time bidding. It is also why the latency-cutting pitch of the IAB camp's ARTF (colocated RTB cutting round-trips from ~600–800ms to ~100ms, a claimed ~90% cut) [12][13] fits CTV's deal-heavy reality far less well than the high-QPS open web — a tension taken up again in §6.\n\n---\n\n## 2. The Centerpiece Exhibit — Who Keeps the Spread in CTV, Before vs. After Agents\n\nThe McKinsey question is blunt: \"who keeps the spread, and does the agent change it?\" Here is the CTV supply chain laid out as a fee stack, with the agentic pressure on each layer.\n\n### 2.1 The pre-agentic CTV fee stack (illustrative, sourced ranges)\n\nFor a representative biddable/PMP CTV dollar, the spread is split roughly like this (ranges, not a single deal):\n\n| Layer | What it does | Take (sourced range) | Source |\n|---|---|---|---|\n| **Advertiser / agency trading desk** | Strategy, planning, RFPs, deal setup | Agency fee on top of media | — |\n| **DSP (demand-side platform)** | Buys on the advertiser's behalf; bidding, targeting, measurement | **~20%** (The Trade Desk 20.3% in 2024; ~19–21% since 2017) | [14] |\n| **Curation / data layer** | Packages inventory + audience into a deal ID | Curation + data fees (variable) | [4][15] |\n| **SSP (supply-side platform)** | Represents the publisher's inventory; runs the auction/serving | Take rate; <10–15% or \"get cut\" | [15] |\n| **Publisher (the streamer)** | Owns the audience and the content | Residual | — |\n\nOne number anchors the exhibit: **The Trade Desk's take rate has held at roughly 20% of spend since 2017** (20.3% in 2024), and CEO Jeff Green has committed to \"15%–20% for as far as we can see into the future\" [14]. That ~20% DSP layer is the fattest, most defensible slice — and the most obvious target.\n\n### 2.2 What agents pressure, and what they don't\n\nThe agentic pitch in CTV is explicitly a *supply-chain-cost* pitch, not just a productivity pitch: PubMatic reports its early AgenticOS campaigns are \"reducing supply chain costs by 40–50%,\" delivering \"40% more impressions at 30% lower eCPMs, with campaign setup 87% faster\" [16]. (These are vendor-reported figures, not independently audited.)\n\nMapping the pressure layer by layer:\n\n- **DSP (~20%):** Most exposed *rhetorically*. The seller-agent model \"routes transactions through seller agents that bypass DSPs entirely\" [13], and rivals already undercut hard — **Amazon DSP charges 0% DSP fees on its own media and ~1% on an assortment of streaming publishers for PG deals; Comcast's Universal Ads charges no DSP fee; Azerion's Hawk is a \"light DSP\" pitching an ~80% cut to the typical DSP fee** [14]. Agents pour fuel on a take-rate war already underway.\n- **Curation / data:** Most *transformed*. Agentic deal construction collapses the manual RFP→deal-ID workflow that curation fees pay for. But it does not erase the fee — it relocates it to whoever runs the curation agent (an SSP like PubMatic/Magnite, or a Scope3-style buyer agent). The spread moves; it does not vanish.\n- **SSP:** Most *consolidated*. The independent SSP count fell from 20+ in 2018 to fewer than 10 with material scale by 2026; SSPs that can't prove a take rate below ~10–15% \"get cut\" [15]. SPO — supply-path optimization, routing each impression through the shortest, cheapest path — is, per PubMatic's own investor materials, \"the single biggest force on take rates this decade\" [15]. Agentic SPO is SPO with a reasoning layer.\n- **Agency trading desk:** Most *threatened in role, least in fee — for now*. If a buyer agent can turn a brief into a media plan and a campaign in minutes (Magnite Buyer Agent \"create media plans from simple RFPs\"; PubMatic \"87% faster\" setup) [16][17], the trading desk's setup labor is automated. Holding companies are answering by piloting the agents themselves (Stagwell, Publicis Media Exchange, dentsu, Kepler, MiQ — see §4) rather than being disintermediated by them.\n\n### 2.3 The honest after-picture\n\nThe \"after agents\" column is **not** \"the DSP and SSP disappear.\" It is this:\n1. The ~20% DSP layer comes under genuine, agent-accelerated pressure, but the largest DSP (The Trade Desk) is itself building agents (Koa Agents) to stay in the path rather than be bypassed.\n2. Curation/data fees move to the agent operator — and the agent operators are *the same SSPs* (PubMatic, Magnite) plus a new buyer-agent class (Scope3).\n3. The spread re-concentrates toward the largest publishers and the agent platforms — the Paparo critique (§7): \"value will accrue to very large publishers and cross-publisher ad networks, in much the same way it has with programmatic more generally\" [18].\n\nThe spread, in other words, gets squeezed and *rerouted*, not removed. That is the centerpiece finding.\n\n---\n\n## 3. The Walled Gardens, Module by Module — Dated Status as of June 2026\n\nDating matters most here. Every product below is a present-tense status claim with a dated source; where the most recent confirmation is older, the entry says so.\n\n### 3.1 Amazon — Ads MCP server + Ads Agent + Prime Video + DSP\n\nAmazon Ads launched its **Ads MCP Server in open beta on February 2, 2026**, announced by Paula Despins (VP, Ads Measurement). It is built on Anthropic's Model Context Protocol and \"acts as a translation layer that turns natural language prompts into structured API calls,\" letting a single integration connect agents or AI platforms — Claude, ChatGPT, and Gemini are explicitly named — to Amazon Ads API functions: creating/updating/deleting campaigns, performance and reporting queries, account settings, and billing/financial data. It is \"available globally in open beta to Amazon Ads partners with active API credentials\" [19].\n\nAmazon also introduced **Ads Agent** (at its unBoxed conference), \"a conversational experience that combines agentic AI capabilities with Amazon's first-party insights to help advertisers perform complex advertising workflows in the Amazon Ads console\" [19]. Note what the Feb 2, 2026 MCP announcement does **not** name: Prime Video, CTV, or the DSP. The MCP server is an *API access layer*, and Amazon's CTV inventory (Prime Video ads) is reached through Amazon DSP, a separate surface [19]. Hence a precise caveat — Amazon's MCP server is live and general, but its *CTV-specific* agentic exposure is implicit, via the API/DSP, not separately productized as of this announcement.\n\nAmazon's CTV gravity is central all the same: it is one of only three sellers expected to clear 10% of US CTV ad sales in 2026 [3]; it is Netflix's fifth major programmatic partner via Amazon DSP (§3.4); and its 0%/1% PG fee posture is the sharpest take-rate pressure in the market [14].\n\n### 3.2 Disney — Disney Ads Agent, DRAX, clean room, generative creative\n\nAt **CES 2026 (January 8, 2026)** Disney unveiled the **Disney Ads Agent**, a chatbot that reduces media-planning prep — searching inventory, identifying audiences, tracking campaigns, and turning a creative brief into a full plan with objectives and audience suggestions [20][21]. Disney also showed **generative-AI ad creation** (a brief + brand assets + product imagery generates :15/:30/:60 spots customizable by demographic) and a Brand Portal expanding Disney Compass measurement (which measured 100B+ impressions across thousands of campaigns last year) [21].\n\nDisney's automation backbone is **DRAX (Disney Real-Time Ad Exchange)**, its biddable/self-service platform. Its widely-cited early traction — **biddable transactions up 70% in DRAX's first year and 8,000+ video advertisers** — comes from Disney's **March 2022** automation showcase (the Next TV and AdExchanger sources are both dated 2022-03-02), not from CES 2026; these are not current-cycle figures [20][22]. Disney's automation goal, first stated in 2021 as automating \"over half its ad business within five years,\" has since been restated upward (reported as automating roughly **75% by 2027**). Disney Select first-party audiences are activatable programmatically via DRAX, backed by a clean-room solution announced **October 2021** (not 2025). The genuinely *new* CES-2026 announcements are the Disney Ads Agent and generative-AI ad creation described above — not these figures.\n\n### 3.3 Roku — Exchange, Ads Manager, Curate, identity — and the Fox acquisition\n\nRoku's ad/platform stack as of mid-2026: **Roku Exchange** (launched June 2024) connects buyers via Amazon DSP, The Trade Desk, Yahoo, FreeWheel, and Google DV360; **Ads Manager** (launched September 2024) is its self-serve platform with Shopify integration, shoppable formats, and AI-powered creative upscaling; and **Roku Curate** (launched April 2026) bundles Roku first-party data with purchase signals from six retail partners — Best Buy Ads, Criteo, Fandango, Fetch, Instacart, and Kroger Precision Marketing [23]. Roku's Q1 2026 ad revenue was $613M (up 27% YoY); Nielsen credits Roku devices with 21%+ of all US TV viewing; the Amazon partnership covers 80M US CTV households [23].\n\nRoku's ownership question resolved fast. On **June 12, 2026**, Bloomberg (subsequently confirmed by Reuters) reported Roku was exploring strategic options including a sale — ~$19.4B market cap, shares up ~20% on the news. Within days the exploration became a deal: on **June 15, 2026, Fox Corporation entered a definitive agreement to acquire Roku for roughly $22 billion** (~$160.00/share — $96 in cash plus 0.9693 Fox Class A shares), unanimously board-approved and expected to close in **H1 2027**, pending shareholder and regulatory (HSR) approval [23]. Roku's ad platform — Exchange, Ads Manager, Curate, and its identity graph — is therefore slated to become Fox-owned, which reshapes any agentic posture (a content owner acquiring a neutral CTV exchange and operating system; the Fox acquisition is taken up in full later, in the chapter on Roku's sale). Roku's *explicit* agentic-buying productization (a named buyer/seller agent) is comparatively thin in the sourced record; its 2026 moves are AI-in-the-stack — creative upscaling, identity/personalization, retail-data curation — rather than an announced agent-to-agent protocol play [23][24].\n\n### 3.4 Netflix — multi-DSP ad stack, CAPI, AI optimization\n\nNetflix runs a multi-DSP programmatic ad stack — **The Trade Desk, Google DV360, Microsoft, Yahoo DSP, and Amazon DSP** (Amazon added as its fifth major partner via a Sept 10, 2025 deal across 11+ markets) [10][11]. On **March 4, 2026** Netflix added three capabilities: **Amazon Audiences** (Q2 2026 US rollout, built on \"trillions of Amazon's proprietary shopping, streaming, and browsing signals\"); **Yahoo DSP deterministic signals** via Yahoo ConnectID (~232M logged-in US users); and **Netflix's own Conversion API (CAPI)** for server-to-server attribution, with early Tinuiti testing showing \"benchmark outperformance of more than 75%\" across finance, ed-tech, and retail [11]. Netflix 2025 ad revenue exceeded $1.5B; 2026 is projected near $3B; 325M paid memberships as of Q4 2025 [11].\n\nA note on Netflix's *agentic* posture: Netflix is wiring **AI optimization and identity/measurement** into its ad stack and exposing inventory through DSPs that are themselves agentifying. But the sourced record does not show Netflix shipping a *named buyer/seller agent or AdCP integration* of its own as of mid-2026. Its agentic exposure is *mediated by its DSP partners*, not native.\n\n### 3.5 Samsung Ads — \"Performance TV,\" AI across the suite, ACR\n\nAhead of **CES 2026** Samsung Ads announced that its **entire suite of ad solutions is now AI-powered**, and at IAB NewFronts 2026 it launched **\"Performance TV,\" a full-funnel performance platform** with shoppable innovation and a new commerce integration with Amazon; Samsung also partners with Snowflake to unify Samsung audience, linear, and CTV campaign data, and is making homescreen inventory programmatically available through DSPs (e.g., a Teads partnership for SEA/HK/Taiwan homescreen) [8][25][26]. Samsung's distinctive asset is ACR + device-level data (\"hardware, software, streaming content, and person-level data at scale\") [8].\n\nSamsung's agentic posture is \"AI across the suite\" plus shoppable/commerce — not, in the sourced record, a named agent-to-agent protocol. That fits the pattern: hardware-identity owners expose data through *their own* AI rather than a neutral protocol.\n\n### 3.6 The sell-side intermediaries — Magnite and PubMatic are the CTV agentic vanguard\n\nThis is where CTV-native agentic buying is furthest along, because the SSPs sit on the curation/PMP layer that agents most naturally attack.\n\n**Magnite** embedded a **seller agent into SpringServe** (its ad-server/SSP, which Jounce Media benchmarked at \"99% of US streaming supply,\" with clients including Disney, LG Ad Solutions, Paramount, Roku, Samsung, and Warner Bros. Discovery), announced **January 6, 2026**, after completing one of the first AdCP test buys in **December 2025** with **Scope3 as the buyer agent and MiQ on the buy side** [17][27]. MiQ's John Goulding: \"In December we set live one of the first AdCP buys working with Magnite's seller agent\" [17].\n\nMagnite expanded on **April 27, 2026** with its **first proprietary buyer agent** (testing with Kepler and MiQ on Disney inventory), seller-agent workflows with Publicis Media Exchange, and three AI-assisted SpringServe mediation features (anomaly detection, demand-path optimization, dynamic pricing); partners named include Disney Advertising, Spectrum Reach, Kepler, MiQ, and PMX [28].\n\nMagnite then launched **Magnite Orchestration on June 11, 2026** — a coordination layer letting buyers connect *their* buyer agents to Magnite's seller agent across \"the industry's largest pool of premium inventory.\" Publishers create custom inventory/audience packages with flexible pricing; buyers create media plans from simple RFPs, discover supply, generate creatives, and launch omnichannel campaigns \"across CTV home screens, audio, and other high-impact formats through a single workflow.\" Testing partners include **dentsu and DIRECTV Advertising** [29][30]. This is the single most CTV-specific, most recent agentic-infrastructure datapoint in this account.\n\n**PubMatic** runs **AgenticOS**, a full buy-side agent stack, and on **December 15, 2025** launched (with agency Butler/Till) a \"fully autonomous, end-to-end agentic advertising campaign\" for **Clubtails (Geloso Beverage Group) across CTV** — Butler/Till submitted a natural-language brief through Claude; PubMatic's agents interpreted it, built strategy, set up the campaign, and optimize delivery, using AdCP for standardized agent-to-system communication, on geo-targeted premium CTV with age-appropriate controls; full results were slated for Q1 2026 [31][32]. PubMatic also opened AgenticOS to independent agencies via an **Untapped Growth Collective partnership (March 2026)**, citing access to \"28 of the top 30 streamers\" and the same 40–50% supply-chain-cost / 87%-faster figures [16].\n\n### 3.7 The buy-side platform — The Trade Desk's deliberately bounded posture\n\nThe Trade Desk introduced **Koa Agents** (announced ~April 2026; closed beta as of March 2026), agentic tools that automate *pre-campaign* workflow — ingesting media plans, building campaigns, troubleshooting creative, generating recommendations — connecting to AI models including Claude via an interoperability layer called the **Open Agentic Kit** [33][34]. Crucially, **\"the agent is not buying ads — at least not yet\"**; CEO Jeff Green says \"autonomous bidding is not the near-term priority\" [34]. TTD's Q2 2026 Kokai release added AI optimization controls, CTV pause ads, PMP deal management (Deal Desk), supply-chain quality signals, and live-event buying [35]. Stagwell is publicly piloting TTD's agentic capabilities [36].\n\nThe strategic read: TTD — owner of the ~20% take rate the seller-agent camp wants to bypass — is building agents that keep it *in the path* (faster setup, better optimization) while explicitly *withholding* autonomous buying. It is the clearest case of an incumbent agentifying to defend its turf rather than cede the buy.\n\n### 3.8 The premium-video sell side adds linear — NBCUniversal/FreeWheel\n\n**NBCUniversal, agency RPA, FreeWheel, and Newton Research** announced (early January 2026) agentic AI buying spanning *linear and digital* premium video, with the first execution featuring a brand's Q1 2026 investment in **live football playoff games** — described as the first time AI agents automate live-sports inventory on linear television; the agents \"sideline the usual buying and selling platforms\" and operate \"separate from the OpenRTB spec\" [37][38]. This is the boundary case: agentic buying reaching the most premium, least-biddable inventory there is — live sports, where no open auction exists at all.\n\n---\n\n## 4. Shoppable / Agentic-Commerce CTV — Where Shopping Agents Meet the Screen\n\nHere the CTV buy meets the adjacent agentic-commerce/payment layer (taken up in its own chapter), and the two halves of a single loop come into view.\n\nShoppable CTV — interactive ad formats letting a viewer move from screen to cart — is being positioned in 2026 as \"a critical retail-media channel,\" with platforms named including Roku, Amazon (Prime Video), YouTube TV, Hulu, Peacock, Tubi, Samsung TV+, Netflix Ads, Disney+, and Paramount+ (note: Amazon shut its ad-supported free service Freevee in August 2025 and folded it into Prime Video); Pinterest is linking Pins to shoppable actions inside Roku's environment, having agreed to acquire tvScientific (announced December 11, 2025; expected to close H1 2026) [39][40]. Google has documented shoppable CTV in its retail playbook and is walking advertisers through shoppable CTV *and* agentic commerce together [41]. Samsung's \"Performance TV\" pairs shoppable innovation with an Amazon commerce integration [25].\n\nRetail media is flowing into CTV: eMarketer expects retail-media CTV ad spend to grow 45.5% in 2025, with one in five CTV ad dollars projected to go to retail media by 2027; US retail-media ad spend overall is forecast at $58.79B (2025) → $69.33B (2026), much of it to Amazon Ads and Walmart Connect [3][42]. Roku Curate (six retail-data partners) and Samsung-Amazon are the CTV expressions of this convergence [23][25].\n\nThe intersection that matters for *agents*: an AI shopping agent (the demand for a product) and a shoppable CTV ad (the supply of an in-content purchase moment) are two halves of the same loop. If agentic-commerce protocols (Google AP2's Intent/Cart/Payment Mandates; OpenAI's ACP) standardize how an agent transacts, the shoppable-CTV ad becomes a place an agent can *complete* a purchase, not just see one. As of mid-2026 this is **aspirational-to-piloted**. Shoppable formats and retail-data curation are live; *autonomous agent purchase from a CTV ad* is not a shipped, sourced production flow. (The detail on AP2/ACP comes later, in the chapter on the commerce and payment layer; the point here is that the CTV surface is being readied for it.) The loop is wired, not yet closed.\n\n---\n\n## 5. Live vs. Piloted vs. Aspirational — The Honest Maturity Map\n\nSo what can a CTV buyer actually do today? The honest answer sorts into three tiers.\n\n**LIVE / IN PRODUCTION (mid-2026):**\n- **Pre-buy workflow agents** inside walled gardens and platforms: Amazon Ads MCP server (open beta) and Ads Agent [19]; Disney Ads Agent + generative creative [20][21]; TTD Koa Agents (closed beta, *setup only*) [33][34]; Samsung AI-across-the-suite [8].\n- **Agentic curation / deal automation** on the sell side: PubMatic AgenticOS (Clubtails CTV campaign ran; opened to indie agencies) [16][31]; Magnite seller agent in SpringServe [17].\n- **AI optimization & measurement** in CTV ad stacks: Netflix CAPI + AI delivery [11]; Roku AI creative/identity; DRAX biddable automation [22].\n\n**PILOTED / IN TESTING:**\n- **Agent-to-agent CTV buys** via AdCP: Magnite ↔ Scope3/MiQ (Dec 2025) [17]; PubMatic ↔ Butler/Till (Dec 2025, results Q1 2026) [31]; Magnite buyer agent ↔ Kepler/MiQ on Disney (Apr 2026) [28]; Magnite Orchestration ↔ dentsu/DIRECTV (June 2026) [29].\n- **Agentic buying of premium *linear* + digital video**: NBCUniversal/RPA/FreeWheel/Newton on live sports (Q1 2026) [37].\n\n**ASPIRATIONAL (announced direction, not shipped at scale):**\n- **Autonomous agent media buying** (agent decides and *executes* the buy with minimal human approval): TTD explicitly *not yet* [34]; AdCP's architecture makes human approval \"architectural, not procedural\" [7] — i.e., a human stays in the loop by design.\n- **Autonomous purchase from a shoppable CTV ad via a commerce protocol**: surface is being readied; not a sourced production flow.\n- **A single neutral cross-publisher CTV buying agent** spanning all walled gardens: blocked by identity fragmentation, ACR ownership, and the standards war (§6).\n\n---\n\n## 6. How the Standards War Lands in CTV Specifically\n\nThe general standards fight (AdCP coalition vs. IAB Tech Lab's ARTF/AAMP) is covered in earlier chapters on the two camps and the standards war. Here is only what is *CTV-load-bearing* — and on CTV ground, the two frameworks are not fighting over the same inventory.\n\n**AdCP** (launched Oct 15, 2025 by Scope3, Yahoo, PubMatic, Swivel, Triton Digital, and Optable) is built on MCP and A2A and routes transactions through **seller agents** that can \"bypass DSPs entirely\"; its sub-protocols are Signals Activation, Media Buy, Creative, and a **Curation Protocol scheduled Q2 2026** — a roadmap aimed squarely at CTV's curation/PMP overhead [6][7][13]. Its CTV fit is *deal construction and curation*, the channel's actual pain.\n\n**IAB Tech Lab's ARTF** (Agentic RTB Framework; public comment opened late 2025) extends OpenRTB/AdCOM/VAST, colocates bidding logic in containers, and claims latency cuts from ~600–800ms to ~100ms (≈90%); ARTF sits under the **AAMP** (Agentic Advertising Management Protocols) umbrella alongside Agentic Audiences and Buyer/Seller Agent SDKs, with an Agent Registry \"trust layer\" launching March 1, 2026 [12][13][43]. CEO Anthony Katsur frames ARTF as the \"high-performance execution infrastructure\" that agentic tasks need to scale [43].\n\n**The CTV-specific verdict:** ARTF's latency pitch is built for *high-QPS open-web RTB*, where shaving milliseconds across billions of bids matters. CTV's premium inventory is dominated by PG/PMP/curated deals where the bottleneck is *negotiation*, not *bid latency*. So the AdCP camp's curation/deal-automation framing has found its first real CTV traction (Magnite, PubMatic), while ARTF's strongest claim bears most on the slice of CTV that *is* genuinely biddable. The two are not symmetric here: **AdCP attacks CTV's dominant deal type; ARTF optimizes CTV's minority deal type.** That asymmetry is the single most important CTV-specific consequence of the standards war.\n\n---\n\n## 7. Critical Voice — Is This Solving a CTV Pain, or Layering Hype on a Direct-Deal Channel?\n\nNow the skeptical read, steelmanned — the strongest version of the bear case.\n\nAri Paparo (founder/CEO, Marketecture Media) argues the agentic media-buying protocol does not address the *business* obstacles that block automation: \"I don't see publishers putting sensitive pricing data into an MCP server\"; \"Buyers don't want to be 'price takers,' and sellers don't want to reveal their rate cards\"; small media buys create overhead \"agents cannot overcome without widespread publisher adoption\"; and most sellers \"lack sufficient valuable data to deliver performance to buyers at scale.\" His conclusion: agents *reinforce* intermediary roles, with value accruing to \"very large publishers and cross-publisher ad networks, in much the same way it has with programmatic more generally.\" He notes he tried to build similar functionality at Google in 2010 and met \"hostility and indifference from both buyers and sellers\" [18].\n\nApplied to CTV specifically, the bear case is strong:\n- **The premium dollar is relationship-priced.** The upfronts — where most premium CTV money is still committed — are salesperson-to-CMO negotiations over scarce, prestige inventory. No streamer wants its rate card in a shared protocol where an agent can arbitrage it. The most valuable CTV inventory is the *least* likely to face a neutral buyer agent.\n- **The walled gardens are agentifying *inward*, not *outward*.** Amazon, Disney, Samsung, and Netflix are each building agents and AI that keep buyers *inside their garden* — inside their identity/ACR moat — not interoperating through a neutral protocol. That is a moat-deepening move dressed as openness.\n- **The seller-agent \"bypass the DSP\" pitch re-concentrates, it does not democratize.** As Paparo predicts, the agent operators that win are the largest SSPs (PubMatic, Magnite) and a new buyer-agent oligopoly (Scope3) — plus the largest publishers. The CTV long tail gets no more reachable.\n- **The biggest, most-hyped milestones are pilots with single brands.** Clubtails (one malt-beverage brand), one NBCU live-sports flight, a handful of named agency testers (dentsu, Kepler, MiQ, Butler/Till, Stagwell, PMX). These are real and dated — but they are *proofs of concept*, not channel-wide adoption.\n\n**The genuine pain agents *do* address in CTV:** the manual RFP→deal-ID→trafficking workflow for PG/PMP deals is real, slow, and expensive; sell-side fragmentation (no 10%+ concentration, dozens of premium sellers) is a real coordination cost; SPO across a consolidating SSP field is real margin. Agentic curation and planning attack exactly these — and the vendor-reported 40–50% supply-chain-cost and 87%-faster-setup figures, even if optimistic, point at a real inefficiency. The fair verdict: **agents are solving CTV's *operational* pain — curation overhead, setup latency, fragmentation coordination — today; they are not, and may never, given rate-card incentives and walled-garden moats, solve CTV's *structural* pain — relationship pricing, identity fragmentation, value concentration. The hype lives in conflating the two.**\n\n---\n\n## 8. What Agentic Buying Plausibly Does to the CTV Supply Chain — Synthesis\n\nPull §2–§7 together and the \"after agents\" picture, scoped to CTV, looks like this:\n\n1. **DSP take rate (~20%):** Squeezed but defended. The Trade Desk holds the path with Koa Agents while Amazon DSP (0%/1% CTV fees), Universal Ads (no DSP fee), and light DSPs (Hawk, ~80% cut) use agents to accelerate a price war already in motion [14][33].\n2. **Curation/data fees:** Relocated, not removed — to whoever runs the curation agent (PubMatic AgenticOS, Magnite Orchestration, Scope3) [16][29].\n3. **SSP take rate:** Compressed by agentic SPO; consolidation continues (sub-10 SSPs of scale; <10–15% take or \"get cut\") [15].\n4. **Agency trading desk:** Setup labor automated; survives by *operating* the agents (holdco pilots) rather than being bypassed [28][36].\n5. **Publishers (streamers):** Largest win most (Paparo) [18]; walled gardens deepen moats by exposing ACR/identity through their *own* agents (Amazon, Disney, Samsung, Netflix) [8][11][19][20].\n6. **Net spread:** Squeezed at the edges, rerouted toward platforms and the largest publishers — *not* eliminated. The intermediary stack thins and re-prices. It does not disappear.\n\n---\n\n## Open Questions\n\n1. **Will any walled garden expose premium CTV rate cards / inventory to a *neutral* buyer agent (AdCP), or will all of them keep agents inside their own gardens?** The Paparo prediction says no; the AdCP pilots say \"testing.\" Unresolved.\n2. **Does AdCP's Curation Protocol (Q2 2026) actually ship on time and get adopted by the streamers, or stall like prior open-protocol curation efforts?** Load-bearing for the whole CTV thesis.\n3. **When (if ever) does an agent move from *setup* to *autonomous buying* in CTV?** TTD says \"not yet\"; AdCP keeps humans \"architectural.\" What event flips this?\n4. **What happens to Roku's ad platform (Exchange/Ads Manager/Curate/identity) under a sale?** A new owner could re-platform its entire agentic posture [23].\n5. **Do the vendor-reported efficiency figures (40–50% supply-chain cost, 87% faster, \"outperformance >75%\") hold up under independent audit?** All are first-party as of mid-2026.\n6. **Does shoppable CTV + a commerce protocol (AP2/ACP) ever produce an autonomous agent purchase from a TV ad — and who clears the payment and owns the liability?** Surface readied, flow unshipped.\n7. **Will ARTF's latency framework find a CTV home given CTV's deal-heavy (not bid-heavy) reality, or does the standards war effectively cede CTV to the AdCP/curation framing?**\n\n---\n\n## Sources\n\n1. eMarketer, \"Digital Video Forecast and Trends Q2 2026\" / \"US CTV ad spend growth slows but remains strong\" (2026). https://www.emarketer.com/content/us-ctv-ad-spend-growth-slows-remains-strong — Tier 5 (analytical/specialist forecaster). US CTV ad spend ~$37.7–38B 2026, ~14% growth, $33.35B 2025. Accessed 2026-06-19.\n2. eMarketer, \"US TV and Connected TV Ad Spending Forecasts H2 2025\" (2025). https://www.emarketer.com/content/us-tv-connected-tv-ad-spending-forecasts-h2-2025 — Tier 5. CTV upfront ($17.73B) exceeds primetime linear upfront ($16.98B) in 2026. Accessed 2026-06-19.\n3. eMarketer, \"YouTube, rising prices, and the shifting balance of CTV in 2026\" (2026). https://www.emarketer.com/content/youtube--rising-prices--shifting-balance-of-ctv-2026 — Tier 5. CTV \"far more diffuse than social\"; only 3 sellers >10% (YouTube 11.9%, Amazon >10%, Disney 10.8%); Meta video $48.77B > all CTV $37.70B. Accessed 2026-06-19.\n4. AI Digital, \"CTV Media Buying: How Connected TV Ads W
