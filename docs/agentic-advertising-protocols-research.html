d formats,\" 2026. https://advertising.amazon.com/resources/whats-new/interactive-ads-expand-across-streaming-tv-into-prime-video — Tier 1 (Amazon's own claim). Shoppable carousels across Prime Video and 1P/3P living-room devices; add-to-Amazon-cart from TV. Accessed 2026-06-20.\n18. About Amazon, \"Amazon Rufus … gets smarter and more personal\" + eMarketer, \"A leaked Amazon pitch deck makes the case for Rufus ads\" + Amazon Customer Service, \"Automatic Content Recognition.\" https://www.aboutamazon.com/news/retail/amazon-rufus-ai-assistant-personalized-shopping-features ; https://www.emarketer.com/content/leaked-amazon-pitch-deck-makes-case-rufus-ads — Tier 1 (Amazon) + Tier 5 (eMarketer). Rufus 250–300M users (vendor-reported), 60% more likely to purchase (vendor-reported), \"virtual product expert\"/Rufus ads; Fire TV ACR. Accessed 2026-06-20.\n19. Digiday, \"Media Briefing: Brian O'Kelley's Scope3 promises an AI-powered ad tech reset — publishers aren't buying it yet,\" 2025–26. https://digiday.com/media/brian-okelleys-scope3-is-promising-an-ai-powered-ad-tech-reset-publishers-arent-buying-it-yet/ — Tier 5. O'Kelley disintermediation thesis (buy direct from media owners, eliminate middlemen). Accessed 2026-06-20.\n20. Brian O'Kelley, \"The Universal Ads API,\" bokonads.com (Substack), 2025–26. https://bokonads.com/p/the-universal-ads-api — Tier 6 (named author's own blog; position-evidence). \"Agentic advertising is too big, too important, and too obvious not to become the dominant paradigm.\" Accessed 2026-06-20. (Did NOT contain the \"indistinguishable/monetize through advertising\" quote — flagged.)\n21. Index Exchange, \"Innovators Unscripted: Scope3's Brian O'Kelley on Agentic AI,\" Jul 10, 2025. https://www.indexexchange.com/2025/07/10/innovators-unscripted-scope3/ — Tier 5/6 (interview; position-evidence). O'Kelley on agentic AI, sell-side decisioning, brand safety. Checked for the model-layer quote; not found verbatim. Accessed 2026-06-20.\n22. See the earlier chapters on the MCP substrate and the standards war for Anthropic's MCP as the shared substrate beneath AdCP and the IAB roadmap.\n23. The Digital Hall, \"Agentic Advertising: Winning AI-Driven Campaign Strategy for 2026\"; BeKnown, \"Agentic AI Advertising: What Humans Still Own\"; TensorOps, \"Agentic AI in Advertising: A 2026 Field Guide.\" https://thedigitalhall.com/agentic-advertising-ai-campaigns-2026/ — Tier 5/6 (agency/vendor thought-leadership — cited for the \"optimize for selection, not clicks\" FRAMING, not as fact). Accessed 2026-06-20.\n24. PPC Land, \"Amazon's new AI agent rules shake up sellers before March 4 deadline,\" Feb 2026; EcommerceBytes, \"Amazon Sellers Have 2 Weeks to Ensure Compliance.\" https://ppc.land/amazons-new-ai-agent-rules-shake-up-sellers-before-march-4-deadline/ — Tier 5. BSA update effective Mar 4 2026; AI agents must identify; SP-API vs. bot-like browsing; continued use = acceptance. Accessed 2026-06-20.\n25. The Drum, \"OpenAI is killing Instant Checkout. Don't dance on the grave of agentic shopping yet\"; Rye, \"OpenAI Scales Back ChatGPT Checkout.\" https://www.thedrum.com/opinion/kiri-masters-openai-is-killing-instant-checkout-but-don-t-dance-on-the-grave-of-agentic-shopping-just-yet — Tier 5/6 (opinion/analysis). OpenAI's pivot from owning checkout toward discovery. Accessed 2026-06-20."}, {"order": 11, "file": "11_Gap_Antitrust_Regulatory_Standards.md", "title": "The Missing Lens — Antitrust and Regulatory Exposure of the Agentic-Ad-Standards Layer", "summary": "", "body": "# The Missing Lens — Antitrust and Regulatory Exposure of the Agentic-Ad-Standards Layer\n\n## Bottom Line\n\nThese pages have read the agentic-ad-standards war almost entirely as private governance politics — \"who controls the standard controls the rents.\" That lens is correct and necessary. But it misses something that could matter more than any version number: **the same features that make AdCP and AAMP work as standards are the features antitrust law treats as red flags.** Both are consortia of horizontal competitors jointly setting a standard. AdCP runs a 501(c)(6) trade association with membership dues, four voting classes, and a discovery registry. Both camps operate **agent registries** that decide which agents are recognized. And the whole architecture invites buyer-agent-meets-seller-agent price formation.\n\nEach of these maps onto a live, dated US or EU proceeding. On **February 23, 2026** the FTC and DOJ opened an inquiry to replace the (withdrawn-December-2024) 2000 Antitrust Guidelines for Collaborations Among Competitors — comment deadline extended to **May 21, 2026** — and the named topics include standard-setting, trade associations, consortia, information exchange, and **algorithmic pricing** [1][2][3]. The **Google ad-tech remedies case** (DOJ seeking divestiture of the AdX exchange) reaches its early-2026 decision and casts a long shadow over Google's own agentic plays (Ads MCP server, Ask Advisor, AP2) and the broader \"every walled garden builds its own agent\" strategy [10][11][12][13]. The EU's **first DMA review (COM(2026)178, April 28, 2026)** declined to make AI a new Core Platform Service yet, but is actively assessing AI as a \"virtual assistant\" CPS and opened a specification proceeding against Google on third-party AI access [14][15][16]. The **RealPage consent decree (Nov 24, 2025)** established that competitors need not explicitly agree to coordinate prices for the conduct to draw enforcement — a precedent that points straight at agent-to-agent price formation [17][18][19]. And the **Amazon–Perplexity injunction (March 10, 2026)** is the first US test of whether a platform blocking a rival's shopping agent is lawful self-defense or anticompetitive refusal-to-deal [20][21]. Every one of these is mid-flight as of mid-2026. Nothing here is settled. The strongest honest claim is that the regulatory exposure of the agentic-ad layer is real, dated, and almost entirely un-litigated — which is itself the finding.\n\n---\n\n## So What — The McKinsey Answer First\n\nIf you are a CTV DSP, SSP, agency, or a member of either standards camp, the private-governance question (\"which toll booth wins?\") has a public-law twin you have not been pricing: **\"is the toll booth itself legal, and who gets to stand at it?\"** Three exposures matter most, in order of near-term bite:\n\n1. **Competitor-collaboration risk (US, now).** A 501(c)(6) of horizontal competitors that runs a standard, charges dues, certifies compliance, and gatekeeps an **agent registry** is precisely the fact pattern the FTC/DOJ are re-examining in 2026 [1][2][3]. The antitrust law of standard-setting bodies (SSOs) is well-developed — *Allied Tube*, *Hydrolevel*, the IEEE patent-policy saga — and it punishes registries and certifications that turn exclusionary or capture-prone. AdCP's membership is, as discussed in the chapter on the AdCP camp, \"supply-weighted and Scope3-influential\"; that is the governance observation. The legal observation is that supply-weighted control of a recognition gate is the textbook SSO antitrust concern.\n\n2. **Google-remedies spillover (US, early-to-mid 2026).** If Judge Brinkema orders divestiture of AdX, the structural logic does not stop at the exchange — it lands on Google's agentic front door (the open-source Ads API MCP server, Ask Advisor, AP2/UCP), because those plays *re-aggregate* exactly the buy-side/sell-side adjacency the case is about [10][11][12][13]. Cut the other way, the Search-case judge's reluctance to break up \"fast-evolving\" markets *because of* generative-AI competition (Mehta, 2025) is a double-edged sword the gardens will wield: \"don't structurally constrain us, AI is about to disrupt everything anyway\" [11].\n\n3. **Agentic price-formation and agent-blocking (US + EU, emerging).** When a buyer agent negotiates with a seller agent, two algorithmic intermediaries set the price — and RealPage just established that *shared algorithmic reliance on non-public competitive data* can draw a consent decree without any phone call between competitors [17][18][19]. Separately, Amazon blocking Perplexity's Comet (US injunction won March 10, 2026) and Italy's AGCM suspending Meta's WhatsApp clauses that excluded rival AI assistants (Dec 24, 2025) are the first two real-world tests of the **agent-blocking** question that the \"walled gardens build their own agent\" thesis raises but never adjudicates [20][21][22][23].\n\nThe single most useful reframing: **the standards-war analysis says transparency is the enemy of the spread. Antitrust law says opacity that protects the spread, when engineered jointly by competitors, can be the offense.** The private-governance lens and the antitrust lens are one fact pattern seen from two sides of the bench.\n\n---\n\n## 1. Competitor Collaboration — A Standard Run by Rivals\n\n### 1.1 Why this is a live US question in 2026\n\nThe 2000 *Antitrust Guidelines for Collaborations Among Competitors* were the agencies' rulebook for exactly this situation: horizontal competitors who jointly form a venture, set a standard, exchange information, or license collectively. The DOJ and FTC **withdrew** those guidelines in **December 2024** [1][3][4]. Then, on **February 23, 2026**, the two agencies jointly opened a public inquiry seeking input on what new guidance should replace them (Docket No. ATR-2026-0001; comments capped at 18 pages) [1][2][3]. The original deadline of April 24, 2026 was **extended to May 21, 2026** \"to give all stakeholders more time to provide fulsome input\" [1][2]. As of mid-2026 the inquiry is open and pre-decisional — no new guidance yet, only a question about what it should cover.\n\nWhat the agencies asked about is the part that matters here. Across the law-firm and trade summaries of the Feb 23 release, the enumerated topics include **joint ventures and strategic collaborations; joint licensing and IP arrangements; trade-association activities such as standard-setting and benchmarking; teaming agreements and consortia; labor-related collaborations; and information exchanges (including via third-party intermediaries and data aggregation)** — plus, explicitly, **algorithmic pricing** as a \"new technology and business model\" warranting guidance [4][5][6]. Wiley's antitrust group framed it bluntly as \"an opportunity for businesses and trade groups,\" noting that \"trade association activities such as standard-setting and benchmarking\" are precisely where comment \"could prove valuable,\" because industry-group collaborations have drawn \"significant enforcement attention in recent years\" [5].\n\nNow read that list against the agentic-ad layer. AdCP is a **consortium** (teaming/consortia). It is governed by a **501(c)(6) trade association**, AgenticAdvertising.org (trade-association activities, standard-setting). It runs a **discovery/agent registry** built on `adagents.json` files that decides which agents are recognized (a recognition/certification gate). Its members **share data and signals** across a Signals sub-protocol and a Trusted Match Protocol (information exchange / data aggregation). And the whole architecture is built so agents **negotiate price** (algorithmic pricing). The agentic-ad-standards layer is not adjacent to the 2026 inquiry's subject matter. It is a near-perfect instance of it.\n\n> **So what.** This does not mean AdCP or AAMP is unlawful. Standard-setting by competitors is overwhelmingly procompetitive and routine — the IAB Tech Lab has run OpenRTB, VAST, and AdCOM for years without antitrust trouble. It means the agentic layer has, in one year, assembled *every element* the agencies just flagged for fresh scrutiny, at the exact moment they are writing the new rulebook. The exposure is structural and timing-driven. Not a smoking gun.\n\n### 1.2 The doctrine the standards analysis did not name: SSO antitrust law\n\nThe standards-war analysis treats \"who controls the standard controls the rents\" as a political-economy claim. A body of antitrust law turns the same observation into a legal test. Three lines matter for an agentic standard:\n\n- **Capture of a standard-setting body is actionable.** In *Allied Tube & Conduit Corp. v. Indian Head* (1988) and *American Society of Mechanical Engineers v. Hydrolevel* (1982), the Supreme Court held that subverting an SSO's process to exclude a rival can violate the Sherman Act, and that an SSO can be liable for its agents' anticompetitive acts done with its apparent authority. The lesson for AdCP/AAMP: a registry or certification controlled by incumbents who use it to keep a rival agent \"unrecognized\" is the paradigmatic SSO antitrust harm. (These are foundational precedents in the public record through the cutoff; cited here as doctrine, not as a live 2026 proceeding.)\n- **Registries and certifications are the pressure point.** Two agent registries are already in play (AdCP's discovery registry; the IAB Tech Lab Agent Registry, 10 entries by March 11, 2026, including Amazon). An agent registry is a recognition gate: inclusion confers interoperability and trust, exclusion is a competitive disadvantage. The closer that gate sits to \"competitors deciding which competitors' agents get recognized,\" the closer it sits to *Allied Tube*.\n- **MFN-style terms among competitors get extra scrutiny.** The 2026 inquiry lists \"conditional dealing with competitors\" among arrangements needing guidance [4]. If a consortium's terms include most-favored-nation pricing or \"no-better-terms-elsewhere\" commitments — common in marketplace standards — those become a discrete exposure (taken up below in the discussion of agentic price formation and the MFN/Amex point).\n\n> **So what.** The governance critique (\"neutral is the design intent; supply-weighted is the membership fact\") is, in antitrust terms, the *prima facie* case and the *prima facie* defense stated together. The four-class voting structure and Apache-2.0 openness are exactly the kind of procedural safeguards an SSO points to when defending itself. Whether they hold depends on conduct — specifically, on how the registry and any certification \"Academy\" are actually run.\n\n---\n\n## 2. The Google Ad-Tech Remedies Case — Spillover onto the Agentic Plays\n\n### 2.1 Where the case stands\n\nJudge Leonie Brinkema (E.D. Va.) found in **April 2025** that Google held illegal monopolies in publisher ad servers (DFP) and ad exchanges (AdX) and had unlawfully tied the two [10][11][12]. In the remedies phase, the **DOJ sought structural relief — divestiture of AdX, open-sourcing DFP's final auction logic, and \"if necessary\" divestiture of DFP** — while Google offered behavioral fixes (contract tweaks, interoperability) [10][12][13]. Brinkema set a self-imposed March 31, 2026 deadline. As of early April 2026 it had passed without a published ruling, with a structural-vs-behavioral decision expected imminently and **mid-2026** cited by many observers as the realistic window before years of appeals [10][12]. The Capitol Forum's 2026 tech-policy predictions explicitly forecast that **Brinkema will order a breakup of Google's ad-tech monopoly** [13]; at the bench she also voiced concern about how quickly structural remedies could take effect versus behavioral ones, especially given a likely Google appeal [10][12]. The remedies ruling is the single most date-sensitive fact in this account and may have published between this writing and your reading.\n\n### 2.2 Why it spills onto the agent layer\n\nGoogle's agentic moves are documented earlier: **Ask Advisor / Ads Advisor**, an **open-source Ads API MCP server**, and **AP2** with the Universal Cart / payment-mandate trust model. The ad-tech case is, at root, about Google occupying both sides of a transaction it also runs the exchange for. Google's agentic plays reproduce that adjacency in a new layer: an agent that helps an advertiser plan and buy, sitting atop inventory and an exchange Google owns, with a Google payment rail (AP2) underneath. Three concrete spillovers follow:\n\n1. **A divestiture changes who owns the agent's downstream.** If AdX is divested, Google's Ads MCP server and Ask Advisor would be routing buyers toward an exchange Google no longer controls — blunting the self-preferencing concern, but also weakening the integrated agentic pitch.\n2. **Behavioral remedies could reach the agent directly.** Interoperability and anti-self-preferencing conditions written for the ad server/exchange would extend naturally to an agentic front door that performs the same steering function. A remedy that says \"DFP must treat rival exchanges neutrally\" implies \"Ask Advisor must not preferentially route to AdX.\"\n3. **The AI defense cuts both ways.** In the parallel Google *Search* case, Judge Mehta declined divestiture partly because generative-AI competition (OpenAI et al.) made the market look \"fast-evolving\" [11]. The gardens will press the same argument in ad tech: don't structurally constrain us, agents are about to reshuffle everything. The DOJ's counter is that AI plays are the *next* lever of the same dominance, not a disruptor of it — which is exactly why the agentic plays sit in the remedies conversation at all.\n\n> **So what.** The \"Path C — per-platform MCP (the walled gardens)\" scenario treats garden autonomy as a strategic fact. The Google case is the live test of whether that autonomy survives a structural remedy. If Brinkema breaks up AdX, \"the garden is the stack\" becomes \"the garden *was* the stack\" — and the agentic front door is the most defensible thing Google has left, or the next thing the DOJ comes for.\n\n---\n\n## 3. The EU DMA First Review — Are AI Agents New Gatekeepers?\n\n### 3.1 What the April 2026 review actually decided\n\nThe European Commission published its **first DMA review report, COM(2026)178, on April 28, 2026** [14][16]. On the central question — should AI become a Core Platform Service? — the Commission **declined to add generative AI as a new CPS at this time**, concluding \"the DMA will not be able to tackle every competition issue in the AI value chain\" and that the regulation \"remains fit for purpose and does not need substantial revision\" after only two years of active enforcement [14]. AI was nonetheless **\"the most prevalent theme\" of the consultation**. The Commission is **actively assessing whether AI services should be designated under the existing-but-unused \"virtual assistant\" CPS category**, and it opened a **specification proceeding against Google under Article 6(7)** on third-party AI provider access on Android [14][16]. The near-term DMA calendar runs to **cloud gatekeeper designations (Nov 2026)** and a **third cloud market investigation concluding May 2027**, with AI-agent designation a multi-year, market-investigation-gated question (Article 19) rather than a 2026 decision — the practical decision horizon for an AI-as-gateway designation stretches toward the back half of the decade [14][15]. A \"~2029\" horizon fits this: a market investigation plus designation plus compliance is a multi-year sequence.\n\n### 3.2 The two camps, in their strongest form\n\nThe EU debate has two well-articulated sides:\n\n- **Designate AI.** Researchers cited by TechPolicy.Press argue the current framework leaves \"any generative AI behemoths that do not provide any other core platform service\" un-designatable — so a dominant standalone AI provider escapes the DMA regardless of market power [15]. The fix is a new AI CPS, which would switch on Article 5(8)-style anti-bundling and the rest of the Article 5/6 obligations.\n- **Don't (the restraint camp, including ICLE).** Giuseppe Colangelo's ICLE white paper (**May 11, 2026**) argues AI agents are genuinely \"new intermediaries\" — \"full-fledged interfaces through which users access third-party goods, services, and content without leaving the conversational environment\" — but that *extending ex ante regulation to AI \"may unduly inhibit innovation,\"* that downstream AI markets show \"substantial dynamism,\" and that the DMA's self-preferencing logic \"does not fit easily with the profile of new AI entrants\" who are standalone, not vertically integrated [25]. ICLE (a market-oriented, law-and-economics shop) concludes the DMA's \"foundational premises\" are called into question and that \"a distinct competition-policy framework\" — not a stretched CPS category — is the right answer [25].\n\n### 3.3 Why this reaches AI-mediated ad transactions\n\nThe relevant Article 5/6 obligations — **MFN/anti-steering bans (Art. 5(3)), data-combination limits (Art. 5(2)), self-preferencing prohibitions (Art. 6(5)), and interoperability/data-access duties (Art. 6)** — are exactly the levers that would bite if an AI agent operated by a designated gatekeeper mediated ad buying. A gatekeeper's ad-buying agent that preferentially routed spend to the gatekeeper's own inventory is Article 6(5) self-preferencing. One that combined a user's cross-service data to target is Article 5(2). One that imposed \"no-cheaper-elsewhere\" terms on advertisers is the Article 5(3) MFN concern. The review's actual move — a **ban on combining personal data without consent for the training and grounding of AI models**, pursued through regulatory dialogue rather than new designation [14] — shows the Commission already pulling Article 6 data levers against AI without waiting for an AI CPS.\n\n> **So what.** The standards-war analysis frames the walled gardens as needing \"neither toll booth\" because they own their inventory end-to-end. The DMA is the one regime that can make a garden's own agent shoppable *against* rivals — but only if AI gets designated, and the Commission just chose to wait. The CTV-specific reading: the European gardens (and Google/Amazon/Meta as designated gatekeepers) get a multi-year runway before AI-agent self-preferencing in the ad path is squarely in-scope.\n\n---\n\n## 4. Agentic Price Formation — When Buyer and Seller Agents Set the Price\n\n### 4.1 The RealPage precedent\n\nOn **November 24, 2025** the DOJ entered a proposed consent decree with RealPage resolving allegations that its rental-pricing algorithm used competing landlords' non-public data to generate price recommendations [17][18][19]. The terms are the part that travels: RealPage may use only **historical data aged at least 12 months**, may **not use active/real-time lease data** to train its algorithm, and may **not model geographies narrower than a state**; the decree runs seven years with no fine or admission [17][18][19]. The doctrinal headline, as the fbtgibbons analysis put it: the decree \"established that firms need not explicitly agree to coordinate pricing\" — when software consumes \"nonpublic competitive data in runtime operations,\" synchronized pricing can emerge on its own and draw enforcement [22]. Goodwin's antitrust co-chair framed the emerging theory the same way: \"when competitors use the same algorithm, they are, in essence, delegating competitive decision-making to that algorithm,\" producing something that \"looks like collusive price setting\" even with \"no allegation that defendant one picked up the phone and called defendant two\" [24].\n\n### 4.2 Why agentic advertising is the next venue\n\nMap RealPage onto an agentic CTV buy. A seller agent (publisher-side) and a buyer agent (advertiser-side) negotiate price using signals — and AdCP ships a **Signals sub-protocol** and a **Trusted Match Protocol** designed to share exactly the kind of audience/inventory/performance data that, pooled across competitors, is the RealPage concern. If many publishers' seller agents draw on a **shared infrastructure operator** (Scope3-style), the \"same algorithm / centralized data\" pattern Goodwin describes appears on the supply side. If many advertisers' buyer agents do, it appears on the demand side. The fbtgibbons authors put the structural worry sharply: in agentic commerce \"the buyer is now an optimization layer, the seller is now an API endpoint, the market is now a routing decision\" controlled by platforms that own both the rails and the agents [22].\n\nThere is a second, consumer-protection face worth naming. fbtgibbons distinguishes **algorithmic coordination (the antitrust face)** from **surveillance pricing (the consumer-protection face)**, noting an agent \"positioned between consumer and merchant becomes, definitionally, a data-collection layer\" generating precisely the individualized signals (browsing, location) that regulators flag as surveillance-pricing triggers [22]. In shoppable/agentic CTV — where agents transact on a viewer's behalf — the buyer agent is exactly that data-collection layer.\n\n> **So what.** The deepest standards-politics insight here is Snyder's \"margins come from the fact that nobody has the full picture.\" Antitrust adds the mirror-image risk: when competitors' agents *do* share a picture — via a common signals protocol or a shared agent operator — that transparency can flip from procompetitive (better matching) to a coordination concern (aligned pricing). The very protocol features that compress the spread are the features RealPage scrutinized.\n\n---\n\n## 5. Agent-Blocking — Self-Preferencing or Lawful Self-Defense?\n\n### 5.1 The two live cases\n\nThe \"walled gardens build their own agent\" thesis raises but never resolves the obvious competition question: **what happens when a platform blocks a rival's agent?** Two 2025–2026 proceedings are now testing it.\n\n**Amazon v. Perplexity (US).** Perplexity launched its Comet agentic browser in July 2025, and it could shop on Amazon on a user's behalf. Amazon sent a **cease-and-desist on October 31, 2025**; Perplexity refused and published \"Bullying is not innovation\" [20][21]. Amazon built a technical block; Perplexity circumvented it within 24 hours by disguising Comet as Chrome; Amazon sued. On **March 10, 2026**, Judge Maxine Chesney (N.D. Cal.) granted Amazon a **preliminary injunction**, finding \"strong evidence\" that Comet accessed Amazon \"without authorization\" [20][21]. Perplexity's framing was explicitly competitive: it argued Amazon's real motive was advertising revenue, since \"AI agents don't have eyeballs to see the pervasive advertising Amazon bombards its users with\" [21] — i.e., agents threaten the ad-funded retail-media model. The case so far is litigated on **access/authorization (CFAA-style)** grounds, *not* antitrust. No US court has yet held that blocking a rival agent is anticompetitive refusal-to-deal or self-preferencing.\n\n**AGCM v. Meta (Italy/EU).** Italy's competition authority (AGCM) opened an Article 102 TFEU abuse-of-dominance probe in **July 2025** over WhatsApp Business terms (effective Oct 15, 2025 → Jan 15, 2026) that **excluded third-party AI assistants** — defined broadly as LLMs/generative-AI/general-purpose assistants whose AI function is their primary offering — from the WhatsApp Business API [22][23]. On **December 24, 2025** AGCM imposed **interim measures suspending** those clauses, treating contractual agent-exclusion as presumptive abuse of dominance [22][23]. AGCM **closed its case on June 8, 2026** after the **European Commission expanded its own EU-wide investigation** to cover Italy, referring the matter to Brussels [23]. This is the first regulator to treat **excluding a rival AI assistant as an antitrust offense** — a theory fbtgibbons notes \"has not yet been successfully pleaded under U.S. Sherman Act doctrine\" [22].\n\n### 5.2 The doctrine in tension\n\nThe agent-blocking question sits on a genuine doctrinal fault line:\n\n- **The refusal-to-deal / self-preferencing theory.** Under EU law (Art. 102) and the DMA's Art. 6(5)/6(7), a dominant platform that excludes or degrades a rival's agent while privileging its own commits the core abuse — and the AGCM and the Commission are running this theory directly. Under US law, refusal-to-deal is far narrower post-*Trinko* (2004), requiring something like the *Aspen Skiing* fact pattern (terminating a prior voluntary, profitable course of dealing).\n- **The self-defense theory.** A platform can argue it is protecting users, security, and its terms of service from unauthorized automated access — the ground on which Amazon actually won its injunction [20][21]. The CFAA/authorization framing lets a platform block an agent without ever reaching the antitrust merits.\n\n> **So what.** The transatlantic split is the headline. In the EU, blocking a rival agent is presumptively abusive and already enjoined (Meta/WhatsApp). In the US, blocking a rival agent is — so far — lawful self-defense over unauthorized access (Amazon/Perplexity), and the antitrust theory is untested. For CTV: a walled garden's right to wall its agentic door is, as of mid-2026, secure in the US and contested in the EU. That asymmetry, not any single ruling, is the durable finding.\n\n---\n\n## 6. How This Lands on the CTV Supply Chain\n\nPull the regulatory lens back to the spine of this study — the living-room buy:\n\n- **CTV DSPs/SSPs.** The margin analysis says ARTF preserves the spread and AdCP compresses it. Antitrust adds a third axis: if AdCP's seller-agent model concentrates price formation in a few shared seller-agent operators drawing on pooled signals, the *efficiency* story (compressed spread) and the *coordination* story (RealPage-style scrutiny) are the same architecture. CTV's heavy PMP/curation layer — negotiated, relationship-based, opaque — is where both the margin and the coordination questions cut sharpest.\n- **Agencies.** A holding company running buyer agents across many advertisers on shared infrastructure is the demand-side mirror of RealPage. The agency's defense is the standard one — independent decisions, public data, no shared non-public inputs — but the 2026 inquiry's interest in \"information exchanges via third-party intermediaries\" puts agency agent-stacks in frame [4][22].\n- **Walled gardens (the CTV-relevant ones: Amazon, Google, Netflix, Roku, Samsung).** The Amazon/Perplexity outcome secures, in the US, a garden's right to block external shopping/buying agents at its door — directly relevant to whether an open buyer agent can ever transact *into* Prime Video or a garden's CTV inventory. The DMA's eventual AI-as-virtual-assistant decision is the EU counterweight.\n- **The standards bodies themselves.** AdCP's 501(c)(6) and the IAB Tech Lab's Agent Registry are the entities most directly exposed to the 2026 competitor-collaboration inquiry and SSO doctrine. The \"rent-allocation machine\" is, in this lens, a regulated entity-in-waiting.\n\n> **So what (the close).** It is right that this is a war over who keeps the spread. The missing half is that the referee has not yet shown up — and when it does, the same features that decide the private war (registries, shared signals, MFN-style terms, garden agent-doors) are the features the public law scrutinizes. The caution about fast-moving facts that runs through these pages applies doubly here: every proceeding cited is mid-flight, several will resolve within months of this writing, and the law of agentic advertising is being written in dockets these chapters had not yet opened.\n\n\n---\n\n## Open Questions\n\n1. **Will the new FTC/DOJ competitor-collaboration guidance name standard-setting consortia or algorithmic pricing specifically?** The inquiry asks about both; the guidance — if it issues — could either bless well-governed SSOs or chill them. Unknowable until the agencies act post-May 21, 2026.\n2. **Did Brinkema order AdX divestiture, and if so, did the remedy reach Google's agentic plays?** The single most date-sensitive open question; may have resolved between writing and reading.\n3. **Will any enforcer actually treat an agent registry as an exclusionary SSO gate?** The doctrine fits (*Allied Tube*), but no enforcer has yet applied it to an *agent* registry. Pure speculation until a complaint exists.\n4. **Will the EU designate AI as a \"virtual assistant\" CPS, and on what horizon?** The Commission is assessing; the Article 19 market-investigation path implies a multi-year (toward 2027–2029) timeline, not a 2026 decision.\n5. **Will a US court ever reach the antitrust merits of agent-blocking, or will access/authorization (CFAA) law keep disposing of these cases first?** Amazon/Perplexity suggests the latter; a future plaintiff would need an *Aspen Skiing*-style prior-dealing fact pattern.\n6. **Does AdCP's Signals/Trusted Match data-sharing actually pool non-public competitive data across rivals in a way RealPage would scrutinize, or is it consented first-party matching?** The technical answer determines the legal exposure and is not resolvable from the public spec alone.\n7. **Could a \"surveillance pricing\" theory reach shoppable/agentic CTV, where the buyer agent is a data-collection layer on the viewer?** Flagged by fbtgibbons; no enforcement action yet targets agentic CTV specifically.\n\n---\n\n## Sources\n\n1. FTC, \"FTC and DOJ Extend Deadline for Public Comment on Guidance on Business Collaborations,\" April 2026. https://www.ftc.gov/news-events/news/press-releases/2026/04/ftc-doj-extend-deadline-public-comment-guidance-business-collaborations — **Tier 1** (primary agency release; page returns 403 to automated fetch, content corroborated via Tier 5 legal summaries). Extended deadline to May 21, 2026. Accessed 2026-06-20.\n2. DOJ Office of Public Affairs, \"DOJ and FTC Extend Deadline for Public Comment on Guidance on Business Collaborations,\" April 2026. https://www.justice.gov/opa/pr/doj-and-ftc-extend-deadline-public-comment-guidance-business-collaborations — **Tier 1** (primary; corroborated via legal press). Accessed 2026-06-20.\n3. DOJ Office of Public Affairs, \"Justice Department and Federal Trade Commission Seek Public Comment for Guidance on Business Collaborations,\" Feb rguments\" + \"Closing Arguments Are Done In The US v. Google Ad Tech Case.\" https://www.adexchanger.com/antitrust/the-doj-and-google-sharpen-their-remedy-proposals-as-the-two-sides-prepare-for-closing-arguments/ — **Tier 5** (specialist ad-tech trade). DOJ ask (AdX divestiture, DFP open-source/divestiture), Brinkema's structural-vs-behavioral concern. Accessed 2026-06-20.\n11. Max Morgan (Georgetown), \"Looking Ahead on US Antitrust Enforcement and Tech: Will 2026 Deliver More of the Same?,\" TechPolicy.Press, Jan 29, 2026. https://www.techpolicy.press/looking-ahead-on-us-antitrust-enforcement-and-tech-will-2026-deliver-more-of-the-same/ — **Tier 5** (tech-policy analysis). Early-2026 remedies decision as structural-separation test; AI-as-reason-against-divestiture (Mehta Search case); FTC two-commissioner / ~10% staff cut; Trump-administration continuity. Accessed 2026-06-20.\n12. Digiday, \"Google's ad tech antitrust remedy phase explained — and where the Judge might land\" / \"Google's ad tech empire faces its moment of truth.\" https://digiday.com/marketing/googles-ad-tech-antitrust-remedy-phase-explained-doj-wants-googles-offerings-and-where-the-judge-might-land/ — **Tier 5** (trade). DFP = ~90% of global publisher inventory; mid-2026 realistic ruling window; March 31 self-imposed deadline passed. Accessed 2026-06-20.\n13. The Capitol Forum, \"Capitol Forum's Tech Policy 2026 Predictions: Brinkema Will Break Up Google's Ad Tech Monopoly…\" https://thecapitolforum.com/capitol-forums-tech-policy-2026-predictions/ — **Tier 5** (specialist antitrust intelligence; subscription). Prediction of an ad-tech breakup; DOJ AdX divestiture + partial DFP divestiture + open-source ask. Accessed 2026-06-20.\n14. Megan Kirkwood, \"What the EU's First Digital Markets Act Review Actually Changes,\" TechPolicy.Press, Apr 30, 2026. https://www.techpolicy.press/what-the-eus-first-digital-markets-act-review-actually-changes/ — **Tier 5** (analysis of primary COM(2026)178). AI not a Accessed 2026-06-20.\n20. CNBC, \"Amazon wins court order to block Perplexity's AI shopping agent,\" Mar 10, 2026. https://www.cnbc.com/2026/03/10/amazon-wins-court-order-to-block-perplexitys-ai-shopping-agent.html — **Tier 4** (major outlet). Judge Chesney preliminary injunction; \"without authorization\"; Comet/Prime access. Accessed 2026-06-20.\n21. MediaPost / MediaDailyNews, \"Perplexity Battles Amazon Over Shopping Agent Ban\" / \"Judge Bans Perplexity Shopping Agent From Amazon.\" https://www.mediapost.com/publications/article/414043/ — **Tier 5** (trade). Oct 31, 2025 cease-and-desist; \"Bullying is not innovation\"; 24-hour circumvention via Chrome disguise; Perplexity's \"agents don't have eyeballs\" advertising argument. Accessed 2026-06-20.\n22. Nilesh Patel & Brad Keeton, \"Agentic Commerce, Price Control, and the New Antitrust Questions,\" FBT Gibbons LLP, May 12, 2026. https://fbtgibbons.com/agentic-commerce-price-control-and-the-new-antitrust-questions/ — **Tier 5/6** (law-firm blog; informed analysis, treat framing as position). RealPage doctrine; algorithmic-coordination vs. surveillance-pricing distinction; agent-as-data-collection-layer; Italy/Meta WhatsApp as agent-exclusion precedent; MFN/Amex vulnerability; \"buyer is an optimization layer.\" Accessed 2026-06-20.\n23. AGCM, \"Meta AI: the Italian Competition Authority orders Meta to suspend the terms excluding competing AI Chatbots from WhatsApp\" (Press Release A576, Dec 2025) + Kluwer Competition Law Blog, \"The Italian Competition Authority Imposes Interim Measures…\" https://en.agcm.it/en/media/press-releases/2025/12/A576 ; https://legalblogs.wolterskluwer.com/competition-blog/the-italian-competition-authority-imposes-interim-measures-in-its-abuse-of-dominance-case-against-meta-ai/ — **Tier 1** (AGCM release) + **Tier 5** (legal blog). Art. 102 probe (July 2025); interim measures Dec 24, 2025; case closed June 8, 2026 after EU expanded its investigation. Accessed 2026-06-20.\n24. Arman Oruc, \"Regulators Consider a New Theory on Algorithmic Coordination,\" Goodwin, Feb 2, 2026. https://www.goodwinlaw.com/en/insights/publications/2026/02/insights-technology-antc-regulators-consider-new-theory-algorithmic-coordination — **Tier 5** (law-firm). \"Same algorithm = delegating competitive decision-making\"; \"looks like collusive price setting\"; \"no allegation defendant one called defendant two\"; agentic AI's speed/opacity challenge. Accessed 2026-06-20.\n25. Giuseppe Colangelo, \"The DMA Meets the New Intermediaries: AI Agents and the Future of Gatekeeper Regulation,\" ICLE White Paper, May 11, 2026. https://laweconcenter.org/resources/the-dma-meets-the-new-intermediaries-ai-agents-and-the-future-of-gatekeeper-regulation/ — **Tier 5** (think tank; market-oriented law-and-economics lean noted). AI agents as \"new intermediaries\"; ex-ante regulation \"may unduly inhibit innovation\"; DMA premise mismatch with standalone AI; \"distinct competition-policy framework\" needed. Accessed 2026-06-20.\n26. *Ohio v. American Express Co.*, 585 U.S. ___ (2018). https://supreme.justia.com/cases/federal/us/585/16-1454/ — **Tier 1** (primary; SCOTUS opinion). Two-sided-market analysis; anti-steering provisions upheld; the doctrinal baseline the MFN-vulnerability argument [22] works against. Accessed 2026-06-20.\n27. *Allied Tube & Conduit Corp. v. Indian Head, Inc.*, 486 U.S. 492 (1988); *American Society of Mechanical Engineers v. Hydrolevel Corp.*, 456 U.S. 556 (1982). — **Tier 1** (primary; SCOTUS opinions, cited from the public record through cutoff). SSO-capture and apparent-authority liability doctrine; the legal frame for exclusionary registries/certifications. (Cited as established doctrine, not a fetched URL.)"}, {"order": 12, "file": "12_Gap_HoldingCompany_BuyerAgents.md", "title": "The Demand Side Wakes Up — Holding-Company Buyer Agents and the Omnicom-IPG Reordering", "summary": "", "body": "# The Demand Side Wakes Up — Holding-Company Buyer Agents and the Omnicom-IPG Reordering\n\n## Bottom Line\n\nMuch of the agentic-advertising story is told from the supply side — the seller agents, the SSPs, the curation layer, and the publishers who run them mapped in fine detail, with the demand side treated as a row of passive pilot-takers. The case for studying agentic standards from the seller's seat even spots the hole: the AdCP founding roster is \"demand-thin,\" and \"big agencies and the holding companies\" are absent at the founding layer. This chapter takes up the entities that were left out. The seller-agent thesis — \"bypass the DSP, negotiate agent-to-agent, compress the supply chain\" — empowers no publisher in a vacuum. It empowers whoever owns the *buyer* agent. And the entities with the budget, the client relationships, and the first-party data to own a buyer agent at scale are the agency holding companies.\n\nStart with the single most important datapoint. On its Q1 2026 earnings call (April 28-29, 2026), Omnicom — through CTO Paolo Yuvienco — disclosed that it had \"executed real media buys for several clients using our agent framework, doing agent-to-agent buying,\" built around the Ad Context Protocol (AdCP), to buy inventory directly from publishers and shorten the media supply chain. This is the closest thing in the entire space to an autonomous-ish buyer-agent buy, and the demand-side answer to the \"who keeps the spread\" question: a holding company trying to keep the spread *for its clients* by routing around the DSP/SSP toll itself. The buys are real, dated, and for actual clients. But: \"several clients,\" no publishers named, no CTV confirmed, human oversight still present. A proof-of-routine, not a proof-of-autonomy.\n\nWPP took the opposite posture six weeks later. On June 18, 2026 it launched a **Buyer Agent for Video** inside WPP Open, plus an Agentic Standards Initiative explicitly scoped to **linear TV, connected TV (CTV), and premium video** — the most CTV-forward holdco move in the record. But its bigger bet is **governance** (\"humans at the helm, agents in the loop\"): explicit human sign-off on financial commitments, and a coalition of streamers (Disney, Netflix, NBCUniversal, Paramount, Fox) plus standards bodies. Publicis took a third path. No disintermediation play, no competing DSP (CEO Arthur Sadoun: \"absolutely no intention to build a competitive offer to The Trade Desk\") — but the deepest data/AI war chest, roughly $12B spent over a decade on Sapient, Epsilon, and now LiveRamp and Lotame, feeding a CoreAI \"Power of One\" system that automates planning and execution from inside.\n\nThen the load-bearing fact. **Omnicom completed its acquisition of Interpublic Group (IPG) on November 26, 2025**, becoming the world's largest ad holding company by revenue (combined pro forma revenue in excess of $25 billion), overtaking WPP and Publicis. The older industry maps still list \"Omnicom\" and \"WPP Media\" side by side as co-equal IAB Programmatic Governance Council members, without noting that Omnicom now subsumes IPG, its media arm Mediabrands, the AI/data unit Kinesso, and the identity firm Acxiom — or that \"WPP Media\" is itself only the rebranded GroupM, a media subsidiary, not a peer holding company. That moves the demand-side concentration math materially. And the Acxiom data is the literal fuel Omnicom cites for its agentic buys.\n\n**What to take away: the buyer agent — not the seller agent — is where the demand-side power consolidates, and the three largest holdcos are now running three distinct strategies (Omnicom: disintermediate; WPP: govern, CTV-first; Publicis: data-and-AI, no platform). None is doing autonomous CTV buying at scale yet. And the roster math common in industry coverage is out of date: Omnicom is now #1 and has swallowed a co-equal it is still listed beside.**\n\n---\n\n## 1. Why This Matters — The Buyer Agent Is the Demand-Side Power Center\n\nThe standard supply-side account makes a structural argument but stops short of its own conclusion. Follow it the rest of the way.\n\nA **buyer agent** is the software an advertiser or agency runs to turn a campaign brief into a media plan and then into a transaction — the demand-side counterpart to the publisher's **seller agent**. In the AdCP design, the buyer agent calls `get_products` with a plain-language brief, reads the standardized proposals each seller agent returns, refines, and calls `create_media_buy` to transact. The whole \"bypass the DSP\" thesis rests on this: if a buyer agent can negotiate a package directly with a publisher's seller agent, the demand-side platform (DSP) — the software that today runs the auction and takes roughly a 20% cut — is no longer structurally necessary for that buy.\n\nHere is the inference the supply-side account leaves on the table. **Whoever owns the buyer agent captures the value the DSP used to extract.** The seller-agent camp (Scope3, PubMatic, Magnite) frames disintermediation as value flowing to publishers and the agent operator. But the buyer agent is the *other* end of every agent-to-agent handshake, and the parties best positioned to own one are not startups. They are the holding companies, which already:\n\n- control the client relationships and the budgets (the holdcos place hundreds of billions in media annually);\n- own first-party identity and data assets (Omnicom's Acxiom, Publicis's Epsilon/LiveRamp, WPP's data stack);\n- run the trading desks whose manual labor agents automate; and\n- have the most direct financial incentive to recapture the DSP/SSP \"toll\" *for their own P&L and their clients'*.\n\nThe usual \"who keeps the spread\" exhibit traces the spread to publishers, SSPs, and a \"Scope3-style\" new toll. It rarely asks the obvious demand-side version: *what if the agency keeps the spread?* That is precisely what Omnicom says it is now doing. And the open question of when (if ever) an agent moves from setup to autonomous buying gets its most concrete answer not from The Trade Desk, which says \"not yet,\" but from Omnicom, which says it has already executed real client buys agent-to-agent. The demand side is not a passive pilot-taker. It is building the thing.\n\n### The buyer agent, not the seller agent, is where demand-side value consolidates\nThe seller-agent \"bypass the DSP\" thesis most directly empowers whoever owns the *buyer* agent, and the entities best positioned to own a buyer agent at scale are the agency holding companies — they hold the budgets, client relationships, first-party data, and the trading desks agents automate. This is an interpretation grounded in the architecture and the holdco moves laid out in the sections that follow, not a single sourced fact.\n\n---\n\n## 2. Omnicom — The Disintermediation Play and the Real Agent-to-Agent Client Buys\n\nThis is the datapoint the supply-side account most needed and did not have.\n\n### 2.1 What Omnicom disclosed, and when\n\nOn Omnicom's **Q1 2026 earnings call (April 28, 2026; widely reported April 29, 2026)**, Chief Technology Officer **Paolo Yuvienco** said the company had moved from testing to live execution: *\"We've already tested the pipes and have been able to have money flow through to actually buy inventory available on certain publishers,\"* and *\"since then, we've executed real media buys for several clients using our agent framework, doing agent-to-agent buying, which is all in service to shortening the media supply chain\"* [1][2][3][4]. MediaPost's account is the most pointed: Omnicom has *\"routinized\"* agentic buys and called itself *\"first-to-market\"* with the AdCP protocol [3].\n\nChairman and CEO **John Wren** supplied the strategic frame. He called the ad-tech intermediary layer *\"a messy middle\"* between buyers and sellers, where intermediaries *\"take a toll, and that toll is paid for by clients and by the industry itself\"* [1][4]. Asked whether disintermediating that layer was the goal, Wren said: *\"There aren't too many major groups that are looking to have more direct relationships with the publishers. That is an objective, and it's something we're investing in as we sit here today\"* [2] — the line Digiday used for its headline, *\"'That is an objective': Omnicom tests AI agents to cut out the ad tech middlemen\"* [1].\n\n**Omnicom has executed real client media buys via an AdCP-based agent-to-agent framework.** On its Q1 2026 earnings call (April 28-29, 2026), Omnicom CTO Paolo Yuvienco stated the company has \"executed real media buys for several clients using our agent framework, doing agent-to-agent buying,\" built around the Ad Context Protocol (AdCP), to buy publisher inventory directly and shorten the media supply chain [1][2][3][4]. The earnings-call statement is a corporate disclosure, corroborated across four independent trade outlets; results were not independently audited.\n\n### 2.2 The canonical product name — \"Omni\"\n\nThe framework runs on **Omni**, Omnicom's existing operating system, described across the coverage as the holdco's *\"AI-enabled intelligent sales and marketing platform\"* (BestMediaInfo) and *\"the holdco's AI-enabled sales and marketing platform\"* (AdExchanger) [2][4]. The agentic capability is an Omni layer, not a separately branded product. The sourced record contains no \"ArtBot\" or \"Omnicom Agentic\" name; \"Omni\" is canonical, and the AdCP-based agent-to-agent capability sits inside it [2][3][4].\n\n**The Omnicom buyer-agent capability runs inside its \"Omni\" platform.** Omnicom's agent-to-agent buying framework is built on **Omni**, its existing AI-enabled sales and marketing operating system; the coverage names no separate branded product (no \"ArtBot\"), and \"Omni\" is the canonical name [2][3][4].\n\n### 2.3 Four Questions, Answered Precisely\n\nFour things are worth pinning down. Here is the honest state of each, with the caveat noted where the record goes silent:\n\n- **The date:** April 28, 2026 (Q1 2026 earnings call); reported April 29, 2026 [1][2][3][4].\n- **Which publishers:** **Not named.** Every account says inventory was bought on \"certain publishers\" / \"several clients,\" but no specific publisher is identified in the sourced record [1][2][3][4]. *This is a real gap — flagged.*\n- **Whether any are CTV:** **Not stated.** None of the four primary accounts mentions CTV, video, or streaming inventory specifically [1][2][3][4]. Omnicom's disclosure is channel-agnostic. So the honest CTV verdict is: *Omnicom's real agent-to-agent buys are not confirmed to be CTV.* (See §5 for what this means for CTV specifically.)\n- **Autonomous or human-confirmed:** **Ambiguous, leaning human-in-the-loop.** No account claims the agent decides and executes without human approval. Wren stressed *\"Nothing's overnight\"* and executives positioned agentic media as *\"an evolving capability rather than a fully mature system\"* (Storyboard18) [5]. The buys are *real and executed*, but the record does not establish full autonomy. The defensible reading: agents do the discovery, negotiation, and setup; humans still authorize.\n\n**Omnicom's agent buys name no publishers, are not confirmed CTV, and are not confirmed fully autonomous.** The available accounts of Omnicom's real client agent-to-agent buys identify no specific publishers, mention no CTV/video inventory, and do not establish that buys execute without human approval; executives framed it as an \"evolving capability\" and said \"nothing's overnight\" [1][2][3][4][5]. These omissions are the honest limits on the section's most important datapoint.\n\n### 2.4 The Acxiom connection — why the IPG deal is load-bearing here\n\nOmnicom's confidence rests on data it acquired through IPG. Wren tied the agentic push directly to **Acxiom**, the identity/data firm IPG had bought in 2018 and which came to Omnicom in the November 2025 merger: he praised Acxiom's *\"solid data\"* from *\"highly regulated industries, including finance and pharma,\"* where *\"the bar for accuracy and fidelity is high\"* — *\"their data is not as haphazard as consumer data can be\"* [4]. CTO Yuvienco added that *\"the ability for us to actually drive value from that data is greater now than it's ever been\"* and *\"exponentially more powerful for our clients\"* [3][4]. Wren also noted Omnicom *\"probably weren't ready for it in 2018, but we're certainly ready for it now\"* and that his *\"waiting paid off from an economic point of view\"* [4].\n\nThis is the hinge between the corporate reordering (§6) and the buyer-agent thesis: **the asset that makes Omnicom's buyer agent credible is the asset it acquired by swallowing the co-equal it is still often listed beside.** Tell the Omnicom agentic story without the IPG deal and you tell it wrong.\n\n### 2.5 Does it actually bypass the DSP — or just compress it?\n\nThe honest answer from the record: **diminish, not eliminate.** AdExchanger is careful — the agents work *within* the existing ecosystem; the goal is *\"shortening the media supply chain\"* and reducing intermediaries *\"generally,\"* not switching off specific DSPs and SSPs [4]. Digiday's framing matches: agentic buying is how Omnicom means to *\"reduce that dependency — not necessarily eliminating DSPs and SSPs from the equation entirely, but diminishing the role they play and, with it, the cut they take\"* [1]. AdExchanger lands on the live skeptical question: *\"The real test, though, will be whether advertisers actually see fewer tolls — not just new ones\"* [4]. That is the exact \"spread gets rerouted, not removed\" finding the supply-side analysis reaches, now confirmed from the demand side.\n\n**Omnicom aims to diminish, not eliminate, DSP/SSP take rates.** Omnicom's stated objective is to shorten the supply chain and reduce intermediaries' \"toll,\" \"diminishing the role they play and the cut they take\" rather than eliminating DSPs and SSPs entirely; the open question is whether clients see \"fewer tolls — not just new ones\" [1][4]. This is the demand-side mirror of the \"spread rerouted, not removed\" thesis that the CTV analysis reaches from the supply side.\n\n---\n\n## 3. WPP — The Governance Bet and the Most CTV-Forward Holdco Move\n\nIf Omnicom is the disintermediation play, WPP is the governance play — and, notably, the most explicitly CTV-scoped of the three.\n\n### 3.1 The Buyer Agent for Video and the Agentic Standards Initiative\n\nOn **June 18, 2026**, **WPP Media** (the rebranded GroupM — see §6.3) unveiled a prototype **Buyer Agent for Video** and an **Agentic Standards Initiative for Video Buying**, in collaboration with a coalition of premium media owners and standards bodies [6][7][8]. WPP's own announcement states the scope directly: *\"Our initial focus is linear TV, connected TV, and premium video — areas where high-value investment and complex transaction workflows make trust, governance, and interoperability essential\"* [7].\n\nThis is the most CTV-load-bearing holdco datapoint in the record. Omnicom's buys are channel-unspecified; Publicis's posture is data-platform-general; **WPP's buyer agent is purpose-built for TV and CTV first.** WPP calls the choice deliberate: video and CTV are the starting point *\"precisely because they represent the hardest version of the problem: the most complex governance, the largest transactions, the biggest budgets\"* [6].\n\n**WPP's Buyer Agent for Video is explicitly scoped to linear TV, CTV, and premium video.** On June 18, 2026, WPP Media unveiled a prototype Buyer Agent for Video and an Agentic Standards Initiative whose initial focus is \"linear TV, connected TV, and premium video\" — the most explicitly CTV-scoped holding-company buyer agent in the record [6][7][8]. The exact scope wording comes from WPP's own announcement [7], with the existence and date corroborated by MediaPost and Digiday [6][8].\n\n### 3.2 The architecture — the Agentic Activation Orchestration Layer\n\nWPP's buyer agent does not stand alone. It sits inside **WPP Open**, WPP's agentic marketing platform, and specifically within what WPP calls the **Agentic Activation Orchestration Layer** — described in its announcement as *\"the infrastructure inside WPP Open that coordinates how our people, agents, data, tools, approval controls, and partner systems interact\"* [7]. That coordination layer is WPP's structural answer to the governance problem, and the demand-side analogue to Magnite Orchestration on the supply side.\n\n### 3.3 The coalition — and why it signals governance, not disintermediation\n\nWPP did not announce a coalition of ad-tech vendors. It announced a coalition of **premium media owners and standards bodies**: **Disney Advertising, Netflix, NBCUniversal, Paramount, Fox Advertising, and Comcast Advertising with its FreeWheel ad-tech platform**, plus the **IAB Tech Lab** and **Prebid.org** [6][7][8]. The message, per Digiday, is that *\"multiple responsible parties are involved in the process\"* — a trust signal to skeptical marketers [6]. That roster inverts Omnicom's posture. Omnicom wants fewer parties between it and the publisher. WPP wants *more named, accountable* parties co-writing the rules.\n\n### 3.4 The governance posture — \"humans at the helm, agents in the loop\"\n\nWPP's framing is the title of Digiday's piece: **\"humans at the helm, agents in the loop\"** [6]. The substance behind the slogan: *\"High-impact financial or activation decisions require explicit controls, approval thresholds, and accountable human oversight\"* [7], and per Digiday, *\"financial commitments and campaign activation require explicit human sign-off,\"* with those thresholds set to shift as testing shows where agents outperform humans [6]. **Lauren Wetzel**, WPP's global president of data and technology solutions, supplied the thesis: *\"Automation for us isn't the goal, better decision making is the goal\"* [6]. WPP also emphasized *\"clear separation between probabilistic recommendations and deterministic execution\"* — i.e., the agent can recommend, but the act of spending is kept deterministic and human-gated [7].\n\n**WPP's bet is governance-first, with explicit human sign-off on spend.** WPP's Buyer Agent for Video keeps \"humans at the helm, agents in the loop\": high-impact financial and activation decisions require explicit human sign-off and approval thresholds, with a \"clear separation between probabilistic recommendations and deterministic execution\" [6][7]. This is the sharpest contrast with Omnicom's disintermediation framing; both nonetheless keep humans authorizing spend as of mid-2026.\n\n### 3.5 The protocol posture — a straddler\n\nA correction-relevant detail: WPP's initiative does **not** pick a single protocol. Its own announcement references the **IAB Tech Lab's Agentic Ad Management Protocols (AAMP)**, **Prebid's Sales Agent**, *and* **AdCP** [7]. WPP is hedging across both camps in the standards war, exactly as PubMatic and Yahoo do at the vendor layer. On timing, WPP says testing *\"has begun with the goal of moving from alpha and beta testing to a model capable of supporting large-scale TV and video investment over the next 6-9 months\"* [7], with results slated for early 2027 [6].\n\n**WPP's agentic standards effort straddles both camps in the standards war.** WPP's Agentic Standards Initiative references the IAB Tech Lab's AAMP, Prebid's Sales Agent, and AdCP together rather than committing to one protocol, making WPP a demand-side straddler in the AdCP-vs-IAB standards war [7]. It echoes, at the holding-company layer, the \"straddlers\" pattern seen among the vendors in the standards war.\n\n---\n\n## 4. Publicis — \"Power of One,\" $12B of Data, and No Disintermediation Play\n\nPublicis is the counter-example that proves the strategies diverge. It is building neither a disintermediation buyer agent nor a competing platform.\n\n### 4.1 The investment — decode the \"$12B\"\n\nThe widely cited \">$12B AI investment\" figure needs care. There is **no single 2026 AI announcement of $12B.** The number is the **cumulative, roughly decade-long data-and-AI transformation spend**: ~$3.7B for consulting/digital firm **Sapient** (2014), ~$3.9B for data company **Epsilon** (2019), plus later data/identity acquisitions [9][10]. On top of that sits the **CoreAI** program — a **€300 million, three-year** investment announced January 25, 2024 (€100M in 2024, split 50/50 between people and technology) to build an AI operating system across the group [11][12]. And in 2026 Publicis is extending the data stack again, agreeing to acquire **LiveRamp** for an enterprise value of **$2.2 billion** and the identity firm **Lotame** [13][14]. That matters because LiveRamp is the same firm that donated the User Context Protocol (UCP / Agentic Audiences) to the IAB Tech Lab: Publicis is buying its way into the identity-signal layer of the standards war.\n\n**Publicis's \"$12B\" is cumulative decade-long data/AI spend, not a single AI announcement; CoreAI is €300M.** The \">$12B\" Publicis AI/data figure is the cumulative cost of its decade-long transformation (~$3.7B Sapient 2014, ~$3.9B Epsilon 2019, plus later deals), distinct from CoreAI, a separate €300M three-year program announced January 2024; Publicis is now also acquiring LiveRamp ($2.2B) and Lotame [9][10][11][13][14]. The components are individually sourced; the figure is often quoted as a single number, which conflates them.\n\n### 4.2 \"Power of One\" vs. Omnicom's disintermediation\n\nPublicis's organizing model is **\"Power of One\"** — a unified, single-P&L organization giving clients *\"facilitated access to all its expertise in every market\"* across communication, media, data, and technology [11]. The strategic difference from Omnicom is sharp. Omnicom's play is *external*: shorten the supply chain, route around the DSP/SSP toll, get closer to the publisher. Publicis's play is *internal*: pool everything (2.3 billion consumer profiles, Epsilon data, Marcel's ~petabyte of assets, Sapient's transformation data) into CoreAI and *\"shift from content creation to predictive, outcome-based marketing\"* [11][15]. Omnicom attacks the intermediary stack; Publicis monetizes its own data gravity. By Q1 2026, Publicis reported that **86% of its net revenue was AI-powered** (up from a 2025 figure where ~80% of media revenues were AI-powered) — an internal-penetration metric, not a disintermediation metric [15].\n\n### 4.3 Does Publicis run an AdCP buyer agent? Not in the public record — and it explicitly rejects the platform play\n\nHere is the precise answer. **The public record does not show Publicis running its own AdCP buyer agent** as Omnicom does. Two things are clear instead:\n\n1. **Publicis Media Exchange (PMX)** — Publicis's media-trading arm, one of the largest media buyers in the world — appears only on the *seller-agent* side, as a named testing partner of **Magnite's** seller-agent workflows. That is PMX testing *another party's* seller agent, not running its own buyer agent — exactly the \"passive pilot-taker\" framing this account sets out to complicate. For Publicis the complication is muted: it is genuinely more of a pilot-taker than Omnicom.\n2. **Publicis explicitly rejects building a buy-side platform.** Amid an April 2026 dispute with **The Trade Desk** (a FirmDecisions audit Publicis commissioned alleged *\"hidden fees, improper fee applications, and unauthorized opt-ins\"* in TTD's handling of Publicis clients; TTD disputed the findings), CEO **Arthur Sadoun** said Publicis has *\"absolutely no intention to build a competitive offer to The Trade Desk\"* and that *\"our number one priority is to build products and services that can help our clients grow in this AI world, and it's not by building another platform\"* [16]. Sadoun has separately argued the AI shift need not be advertising's *\"Kodak moment\"* [17].\n\n**Publicis runs no public AdCP buyer agent and has explicitly rejected building a buy-side platform.** The public record shows no Publicis-operated AdCP buyer agent; its trading arm PMX appears as a tester of others' seller agents, and CEO Arthur Sadoun stated Publicis has \"absolutely no intention to build a competitive offer to The Trade Desk,\" prioritizing data/AI (CoreAI, Epsilon, LiveRamp) over platform ownership [16][17]. The buyer-agent point is an argument from absence — \"not in the public record as of mid-2026,\" not proof of non-existence; the platform rejection is directly sourced.\n\n**The three largest holdcos run three distinct agentic strategies.** As of mid-2026 the three largest holding companies pursue distinct strategies: Omnicom (disintermediate — real AdCP agent-to-agent client buys via Omni), WPP (govern, CTV-first — Buyer Agent for Video with human sign-off), and Publicis (data-and-AI, no platform — CoreAI/Power of One, no public buyer agent) [1][6][7][16]. The categorization is analytical; each component strategy is individually sourced.\n\n---\n\n## 5. The CTV Verdict — Does Any Holding-Company Buyer Agent Buy CTV Yet?\n\nThe CTV question deserves a direct answer. Here it is, sorted by maturity.\n\n**The honest finding: no holding-company buyer agent is doing autonomous CTV buying at scale as of mid-2026 — but WPP's pilot is explicitly CTV-scoped, and the supply-side pilots already pull holdco demand into CTV.**\n\n- **WPP — CTV by design, at pilot stage.** WPP's Buyer Agent for Video is the only holdco buyer agent explicitly built for linear TV, CTV, and premium video first [6][7][8]. But it is alpha/beta as of June 18, 2026, with a stated 6-9-month runway to \"large-scale TV and video investment\" and human sign-off on every spend [6][7]. CTV-scoped, not CTV-at-scale, not autonomous.\n- **Omnicom — real buys, CTV unconfirmed.** Omnicom's real client agent-to-agent buys are channel-unspecified; no source confirms CTV inventory [1][2][3][4]. Omnicom is furthest on *executing* agent buys and least specific on *whether any are CTV*.\n- **Publicis — no buyer agent, CTV via partners.** Publicis has no public buyer agent; its CTV agentic exposure is mediated through partners (PMX testing Magnite's seller agent) [16].\n- **The supply-side pull is already real.** The supply-side pilots route holdco *demand* into CTV through seller agents: **dentsu** and **DIRECTV Advertising** are testing **Magnite Orchestration** (June 11, 2026), whose buyer agent launches campaigns \"across CTV home screens, audio, and other high-impact formats\" [18]; **Kepler** and **MiQ** tested Magnite's buyer agent on **Disney** inventory (April 2026); **PMX** tested Magnite's seller-agent workflows. These are demand-side parties buying CTV through agents — but via *the SSP's* agent infrastructure, not a holdco-owned buyer agent.\n\nSo the demand side reaches CTV through agents today only by *borrowing the supply side's rails*. The holdco-owned buyer agent that negotiates CTV directly, at scale, autonomously, does not yet exist. WPP is building toward it CTV-first; Omnicom is executing it channel-agnostically; Publicis is sitting it out at the platform layer.\n\n**No holding-company buyer agent does autonomous CTV buying at scale yet; WPP is the CTV-first builder, and demand reaches CTV via supply-side rails.** As of mid-2026, no holdco-owned buyer agent buys CTV autonomously at scale; WPP's CTV-scoped agent is at pilot stage with human sign-off, Omnicom's real buys are CTV-unconfirmed, and demand-side parties (dentsu, Kepler, MiQ, PMX) reach CTV through SSP-operated agents (Magnite Orchestration, June 11, 2026) rather than their own [1][6][7][18]. It is a bounded negative alongside the pilot positives, and answers the CTV question from the demand side.\n\n---\n\n## 6. The Reordering — Omnicom Subsumed IPG, and the Standard Roster Is Out of Date\n\nThis is the load-bearing factual correction. Much industry coverage still treats \"Omnicom\" and \"WPP Media\" as separate, co-equal IAB Programmatic Governance Council members. That picture is now wrong twice over.\n\n### 6.1 The fact — completed November 26, 2025\n\n**Omnicom completed its acquisition of The Interpublic Group of Companies (IPG) on November 26, 2025** [19][20][21]. The deal was **announced in December 2024** as an **all-stock transaction valued at ~$13.25 billion**, with IPG shareholders receiving **0.344 Omnicom shares per IPG share** (≈$35.58/share at announcement) and Omnicom holders owning ~60.6% of the combined company [22]. By the close, the **final purchase price was reported at roughly $9 billion**, reflecting Omnicom's lower share price at completion [20]. *(A note on the numbers: the deal is best described as a ~$13.25B announced all-stock acquisition closing at ~$9B final consideration — not \"~$30B.\" The ~$25B+ figure that appears in coverage is combined pro forma revenue, and ~$30B-class numbers refer to combined market scale, not the purchase price.)*\n\nThe combination created the **world's largest marketing and sales company**, with **pro forma combined revenue in excess of $25 billion** [20][21][23]. On a like-for-like revenue basis it overtook the prior leaders: Omnicom's combined entity (~$17.3B+ standalone, $25B+ pro forma) now ranks ahead of Publicis (≈€14.5B) and WPP (≈£13.55B), making the old \"Big Six\" a \"Big Five\" (Omnicom, Publicis, WPP, Dentsu, Havas) — or, as The Drum put it, arguably a \"Big 2\" at the top [23][24].\n\n**Omnicom completed its IPG acquisition on Nov 26, 2025, becoming the world's largest ad holding company.** Omnicom completed its acquisition of Interpublic Group on November 26, 2025 (announced Dec 2024 at ~$13.25B all-stock, 0.344 exchange ratio; ~$9B final consideration at close), creating the world's largest marketing/sales company with pro forma combined revenue over $25 billion, overtaking WPP and Publicis [19][20][21][22][23]. The completion date and \"world's largest\" status are corroborated across wire and major-outlet coverage and the company's own filing; the precise purchase price varies by measurement (announced ~$13.25B vs. ~$9B final), which is itself worth stating.\n\n### 6.2 What Omnicom Now Subsumes — the Entities Still Listed Beside It\n\nThe merger folded IPG's entire portfolio into Omnicom. Most consequentially for an ad-tech/CTV corpus:\n\n- **IPG Mediabrands** — IPG's media-buying arm (the holding entity for **UM** and **Initiative**), now part of Omnicom's media operations [22][25].\n- **Kinesso** — IPG's data/AI/ad-tech unit, now Omnicom's [25].\n- **Acxiom** — the identity/data firm IPG acquired in 2018 — now the **data foundation Omnicom explicitly cites for its agentic buys** (§2.4) [4][22].\n- **Creative networks** — McCann, plus Weber Shandwick (PR), folded in; in the post-merger reorganization Omnicom retired several networks (FCB, MullenLowe, DDB) and consolidated to three global creative networks (McCann, BBDO, TBWA), with reporting of 4,000+ job cuts and ~$750M targeted annual cost savings [22][23][26].\n\nSo when an industry governance roster lists \"Omnicom\" and (separately) the broad \"Paramount, Omnicom, Dentsu, WPP, Hearst\" Governance-Council row, read the Omnicom line as it now stands: **it contains Mediabrands, Kinesso, and Acxiom** — the very data/identity/media-buying capabilities that make a holding-company buyer agent feasible. Demand-side concentration is materially higher than those rosters imply.\n\n**Omnicom now subsumes IPG Mediabrands, Kinesso, and Acxiom.** Through the IPG merger Omnicom absorbed IPG Mediabrands (media buying; parent of UM and Initiative), Kinesso (data/AI/ad-tech), and Acxiom (identity/data) — the latter explicitly named by Omnicom as the data foundation for its agentic buys [4][22][25]. This ties the reordering directly to the buyer-agent thesis: the acquired data assets are what make Omnicom's buyer agent credible.\n\n### 6.3 The naming trap — \"WPP Media\" is a media subsidiary, not a peer holdco\n\nA second, subtler correction. Industry rosters list \"WPP Media\" alongside \"Omnicom\" as if they were the same kind of entity. They are not. **\"WPP Media\" is the rebranded GroupM** — WPP's global media-buying arm — renamed on **May 29, 2025** (announced May 6, 2025), retiring the GroupM brand after two decades [27][28]. GroupM/WPP Media manages ~$60 billion in annual media spend and ~40,000 staff [27]. So the correct peer comparison is **Omnicom (holding company) ↔ WPP (holding company)**, with **Omnicom Media Group / Mediabrands ↔ WPP Media** as the media-arm comparison. Listing \"Omnicom\" beside \"WPP Media\" pits a holding company against a rival's *subsidiary*. Worse, it buries the real news: the holding-company peer, WPP, has now been overtaken in size by the entity it sits next to.\n\n**\"WPP Media\" is the rebranded GroupM (a media subsidiary), not a holding-company peer to Omnicom.** \"WPP Media\" is GroupM rebranded (renamed May 29, 2025; ~$60B annual media spend, ~40,000 staff), i.e., WPP's media-buying arm — so any side-by-side listing of \"Omnicom\" and \"WPP Media\" compares a holding company to a rival's subsidiary; the correct peers are Omnicom↔WPP and Mediabrands↔WPP Media [27][28]. A naming distinction that sharpens the picture of how the camps line up.\n\n### 6.4 The FTC Condition Worth Flagging\n\nOne regulatory detail carries weight for what comes next. The **FTC cleared the merger on June 23, 2025** under a consent order with an unusual provision: it bars Omnicom from steering ad dollars away from publishers based on their *\"political or ideological viewpoint,\"* except at the *\"express and individualized direction\"* of an advertiser client [29][30]. The FTC altered the final order in September 2025 in response to public comments [30]. This matters for the agentic thesis. A buyer agent that allocates spend across publishers operates inside a consent decree that constrains *viewpoint-based* allocation — a leash on the very disintermediation Omnicom is automating. The order's existence and terms are documented; its operational bite on agentic allocation is untested as of mid-2026.\n\n**The FTC cleared the merger (June 23, 2025) with a viewpoint-neutrality consent order.** The FTC granted clearance on June 23, 2025 under a consent order barring Omnicom from steering ad spend away from publishers based on political/ideological viewpoint except at an advertiser's express individualized direction (final order altered September 2025) [29][30]. It is a live constraint on automated cross-publisher allocation; the operational effect on agentic buying is untested.\n\n---\n\n## 7. So What — How This Rewires the \"Who Keeps the Spread\" Answer\n\nPull the preceding sections together and the demand side reframes the central finding.\n\nThe supply-side view concluded that agents *reroute* the spread toward publishers, the largest SSPs, and a new buyer-agent class, rather than eliminating it. The demand-side view sharpens \"the new buyer-agent class\": **the buyer agents that matter most belong to the holding companies, not the startups.** Omnicom is the proof. It is using an AdCP buyer agent to try to recapture the DSP/SSP toll *for itself and its clients*, with Acxiom data as the moat. That is the demand-side answer to \"who keeps the spread\": potentially the agency, if its buyer agent can negotiate directly and the publisher's seller agent will deal.\n\nBut three brakes, all dated:\n\n1. **It is pilots, not scale.** Omnicom: \"several clients,\" no publishers named, CTV unconfirmed (§2.3). WPP: alpha/beta, 6-9-month runway, human sign-off (§3.4). The volume caveat that governs the whole field — a standards fight ahead of meaningful volume — governs the demand side too.\n2. **Humans still authorize the spend.** Neither Omnicom nor WPP claims autonomous execution; WPP makes human sign-off architectural. The question of moving from setup to autonomous buying is *closer* to answered than it once seemed — Omnicom executes real buys agent-to-agent — but \"autonomous\" in the strict sense (agent decides and spends without human approval) is still not established for any holdco.\n3. **The strategies diverge, so there is no single demand-side bloc.** Omnicom disintermediates, WPP governs, Publicis abstains from the platform fight. The demand side is not one camp. It is three bets — itself a finding the binary \"AdCP vs. IAB\" frame misses.\n\nAnd the concentration math is now different. The largest demand-side buyer, Omnicom, has absorbed a former co-equal (IPG/Mediabrands) and the identity asset (Acxiom) that makes its buyer agent work. So if buyer-agent disintermediation does shift the spread to the demand side, it shifts it to a demand side more concentrated than the standard rosters show.\n\n---\n\n## Open Questions\n\n1. **Which publishers did Omnicom actually transact with agent-to-agent, and were any CTV?** The single biggest unknown in the most important datapoint. The record says \"certain publishers\" and names none; CTV is unconfirmed. A future earnings call or case study could close this.\n2. **How autonomous is \"real client buys,\" really?** Omnicom executes agent-to-agent buys, but the human-approval boundary is undisclosed. Where exactly does the human sign off — at strategy, at budget, at each transaction?\n3. **Does WPP's CTV-first buyer agent reach \"large-scale TV and video investment\" on its stated 6-9-month timeline (i.e., by ~Q1 2027), or stall like prior open-protocol efforts?** Load-bearing for whether any holdco buys CTV autonomously at scale.\n4. **Will Publicis stay out of the buyer-agent build, or does CoreAI quietly become a buyer agent under another name?** Sadoun rejects a *platform*; CoreAI already automates planning/execution. The line between \"AI system\" and \"buyer agent\" may be semantic.\n5. **Does the FTC viewpoint-neutrality consent order constrain Omnicom's agentic allocation in practice?** An automated cross-publisher buyer agent is exactly the kind of system the order addresses; the operational test has not happened.\n6. **Now that Omnicom subsumes Mediabrands/Kinesso/Acxiom, does demand-side concentration change AdCP's adoption dynamics?** A single buyer controlling more spend and better data could either accelerate AdCP (a whale adopts it) or blunt it (a whale large enough to dictate its own terms doesn't need a neutral standard).\n7. **Do dentsu and Havas — the smaller of the Big Five — build buyer agents, or do they ride SSP-operated agents (dentsu↔Magnite Orchestration) indefinitely?** The mid-tier holdco posture remains the open edge of the demand-side map.\n\n---\n\n## Sources\n\nTier key: 1 = primary (filings, earnings calls, company announcements — for *what is claimed*); 3 = wire; 4 = major outlet; 5 = analytical/trade press (note lean: trade press sits close to industry).\n\n1. Digiday, \"'That is an objective': Omnicom tests AI agents to cut out the ad tech middlemen,\" April 29, 2026. https://digiday.com/media-buying/that-is-an-objective-omnicom-tests-ai-agents-to-cut-out-the-ad-tech-middlemen/ — Tier 5 (trade press). Accessed 2026-06-20. Wren \"messy middle\"/\"toll\"/\"that is an objective\" quotes; \"diminish not eliminate\" framing.\n2. BestMediaInfo, \"Omnicom says it has executed real client media buys using agent-to-agent AI framework,\" April 29, 2026. https://bestmediainfo.com/interviews/interview-advertising/omnicom-says-it-has-executed-real-client-media-buys-using-agent-to-agent-ai-framework-11777018 — Tier 5 (trade press). Accessed 2026-06-20. Yuvienco quote; \"Omni\" platform; AdCP confirmed.\n3. MediaPost (MediaDailyNews), \"Omnicom Routinizes Agentic Buys, Compresses Media Supply Chain,\" April 29, 2026. https://www.mediapost.com/publications/article/414682/omnicom-routinizes-agentic-buys-compresses-media.html — Tier 5 (trade press). Accessed 2026-06-20. \"Routinizes\"; \"first-to-market\" with AdCP; \"tested the pipes\" quote; Acxiom data.\n4. AdExchanger, \"Omnicom Has An AI-Powered Plan To Cut Out Ad Tech Middlemen,\" April 28, 2026. https://www
