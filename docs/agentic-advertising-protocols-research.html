<script id="corpus-data" type="application/json">{"slug": "agentic-advertising-protocols-research", "title": "The Protocol War", "subtitle": "How AI agents are being wired into the ad buy — MCP, AdCP, the IAB's ARTF, and what agentic buying does to CTV", "author": "", "generated": "2026-06-20", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of Agentic Advertising", "summary": "AI programs are starting to buy and sell ads by talking to each other, and the whole scramble is a fight over the language they speak — built on one shared foundation (Anthropic's MCP), split between a coalition's negotiation grammar and the ad industry's own faster-auction upgrade, with premium streaming TV as the proving ground.", "body": "# Six Easy Pieces of Agentic Advertising\n\n*How AI agents are being wired into the buying and selling of ads — and why streaming TV is where it starts.*\n\n## The ad that buys itself\n\nEvery time a web page or a streaming show loads an ad, a tiny auction has already happened. In a fraction of a second, software decided which advertiser reaches you and what it pays. That system — **programmatic advertising**, the automated buying and selling of ad space — has run the internet's ad market for fifteen years.\n\nHere is the one idea. That machine automated the *auction* but never automated the *conversation around it* — the deal-making that still happens between companies by email and phone. Now a new kind of software is sold to close that gap: an **AI agent**, a program that takes a goal (\"spend this budget on the right streaming audiences\") and acts on it — reads a catalog, asks questions, strikes a deal, places the buy. For two such agents, one on each side, to talk, they need a shared language. The scramble happening right now is a fight over what that language should be — and it turns out to be not one language but a small *stack* of them, because buying an ad takes more than one kind of conversation: slow haggling over a premium deal is a different job from a split-second auction. So the rival standards you'll meet aren't head-to-head contestants doing the same job; they're different layers of one stack, each with its own would-be rule-maker. The fight is less \"who wins\" than \"which layer gets standardized, and who runs it.\"\n\n## Why a quarter of the money is the prize\n\nFollow the money and the stakes get concrete. Only about half of every dollar an advertiser spends actually reaches the publisher showing the ad. A large slice — one respected 2023 study put the murkiest, unexplained portion near a quarter of all spend — disappears into the middlemen and the hand-built plumbing between them. Nobody officially charges it; it's just the fees and friction of every company that touches the money on the way through. The trade nicknames that waste the **ad-tech tax**.\n\nAgents are pitched as a way to shrink it. If a buyer's agent negotiates straight with a seller's agent, some of those middlemen fees get squeezed. So this is a fight over who keeps that money — big publishers, the biggest middlemen, a new class of buying agents, or the tech giants who own the biggest audiences. It isn't abstract to you, either: these same agents decide which ad reaches you on your TV. When a program does the choosing, the game stops being \"grab the human\" and becomes \"get picked by the machine.\"\n\n## The cast: one foundation, two camps, four giants\n\nYou only need to hold a few names. **MCP** — the *Model Context Protocol* — is the foundation everything sits on. Anthropic released it in late 2024 as a single standard way for an AI model to plug into outside tools and data, instead of every connection being custom-built. Nobody fights over MCP; the fight is over what plugs into it.\n\nTwo rival ad standards plug in, and — the part most coverage gets wrong — **they do different jobs**:\n\n- **AdCP** — the *Ad Context Protocol* — is a **negotiation language**. Launched in late 2025 by a coalition of sell-side companies (the publishers and their allies who sell ad space), it lets a buyer's agent and a publisher's **seller agent** (the software standing in for the publisher) haggle a deal *outside* the split-second auction, over seconds or days — the way premium deals get done today.\n- **ARTF** — the *Agentic Real-Time Framework* — comes from the **IAB Tech Lab** (the Interactive Advertising Bureau's technical arm), the ad industry's long-standing standards body. It's a **speed upgrade to the existing auction**, not a replacement.\n\nAnd a third force ignores both camps: the **walled gardens** — Google, Amazon, Meta, and TikTok. Each is a single company that sells ads only inside its own platform, on its own site or app, using data it never lets outsiders see. Each is building its *own* MCP connector so agents can buy inside its garden on its terms — and nowhere else.\n\nThe proving ground for all of it is **CTV** — *Connected TV*, streaming video on internet-connected televisions. Its ad **inventory** — the ad slots a streaming service has to sell against its shows — is the priciest, most-walled, most hand-negotiated corner of digital advertising, worth roughly $29 billion a year in the US (about one in ten of the roughly $300 billion Americans spend on digital ads). Exactly the relationship-driven dealmaking an agent is built to take over.\n\n## How one agentic ad deal actually flows\n\nStart with a brand that wants to reach cooking-show viewers on a streaming service. Its **buyer agent** — running on the MCP foundation — has two routes, and they map exactly onto the two rival standards.\n\n**Route one, the negotiation layer (AdCP).** The buyer agent messages the publisher's **seller agent** directly: *what cooking-show ad slots do you have, for which audiences, at what price?* The seller agent answers from the rate card — its published price list — they settle terms, and the deal is struck: plain machine-readable back-and-forth, *outside* the real-time auction, routing *around* the buying and selling tools in the middle. That is what the sell-side coalition built, and why the middlemen are nervous.\n\n**Route two, the transport layer (ARTF).** The deal still runs through the familiar high-speed auction, but ARTF makes it faster. Instead of bids racing across the open internet between distant data centers, a bidder's logic ships as a sealed, sandboxed **container** — a self-contained bundle of code — that runs *right next to* the auction, inside the host's own data center. Less distance, less delay. The Tech Lab claims this can cut the round-trip by up to 80% — the designers' target, not an outside measurement; no independent party has benchmarked it yet.\n\nFor CTV the killer detail is data safety. A streaming service won't spray its show-by-show viewing data into an **open auction** — one where dozens of unknown bidders would all get a look at it on the way past. But it *can* let a buyer's logic run inside a sealed container next to that data, in a **clean room** — a locked space where two companies compute on shared data without either seeing the other's raw records. Collaboration without exposure. That, more than speed, is what sells agents to the living room.\n\n## The fight: does open win, or do the giants swallow it?\n\nSmart, informed people genuinely disagree about where this lands, and both readings are strong.\n\n**The open-standards case:** No single company can afford to blow up the shared language, because the most powerful players sit in *both* camps. The person leading the AdCP coalition also sits on the IAB Tech Lab's board; big firms like PubMatic and Yahoo build to both at once. When everyone straddles, nobody wants a knockout. On this reading the negotiation grammar gets *absorbed* into the industry body's toolkit, and the tolls get squeezed but not erased.\n\n**The enclosure case:** The real action happens *beneath* the open fight, at two choke points the standards can't touch. First, the walled gardens are enclosing their own inventory — buy inside Amazon or Google, on their pipes, and the neutral standard governs a shrinking remainder. Amazon has even sued to block a rival shopping agent from its site and won an early ruling — walls raised by law, not just code. Second, subtler: when you ask an AI assistant to shop, the *model itself* decides what surfaces, and whoever owns that model owns discovery — upstream of any ad-buying protocol.\n\nWhich reading is right? It turns on one thing nobody can see yet: whether the big agency buyers, once they spend real money through agents, keep doing it in the open standard — or quietly route through private deals with the gardens. The evidence cuts both ways: one giant agency, Omnicom, has run real client buys on the open AdCP grammar, even as the gardens' walls go up fast. And one caveat swallows both cases: **this is still a fight ahead of the money.** The dollars flowing through these standards are, so far, a trickle.\n\n## Where it's heading, and what to watch\n\nNo one can hand you a confident prediction here, but the plausible paths sort into a few shapes. The likeliest is **coexistence**: MCP stays the foundation, the negotiation grammar and the faster-auction layer stack together rather than fight to the death, and the governance battle settles into interlocking pieces. Close behind is **enclosure**: the open stack survives but governs an ever-smaller slice as the giants and the AI models capture the money upstream. The long shots are a quiet **plateau**, where the pilots never scale, and a **wildcard** — an antitrust ruling, or a crack in MCP itself, that resets the board.\n\nThree signals tell you which way it's tipping, no insider access required. Does the industry's standards body quietly *fold* the coalition's negotiation grammar into its own toolkit — the tell for coexistence? Does any walled garden ever open its premium streaming inventory to a *neutral* buying agent, not just its own — the tell for enclosure? And does anyone outside the vendors ever publish a real benchmark of that 80% speed claim?\n\nFor now, hold onto the shape of it. Agents are learning to buy and sell ads by talking to each other — on one shared foundation, in two different grammars, while four giants build private rooms off to the side. And the real prize isn't winning the auction. It's owning the language everyone else has to speak."}, {"order": 1, "file": "01_Origins.md", "title": "Origins — How Programmatic, CTV, and AI Agents Converged", "summary": "", "body": "# Origins — How Programmatic, CTV, and AI Agents Converged\n\n## Bottom Line\n\nFor fifteen years the advertising industry built a machine — programmatic real-time bidding — that automated the *buying of impressions* but never automated the *plumbing between the companies that buy and sell them*. Every demand-side platform (DSP, the advertiser's buying tool) reached every supply-side platform (SSP, the publisher's selling tool) through a hand-built integration. Every new data partner meant new custom code. The standards that made the auction itself work — OpenRTB (the bid-request/response protocol), AdCOM (the shared vocabulary of objects like \"device\" and \"placement\"), and VAST (the template that tells a video player how to fetch and render an ad) — solved the *transaction* but left the *connective tissue* expensive, slow, and brittle.\n\nBy the early 2020s three pressures had compounded that brittleness: bid-request bloat and latency in an auction measured in milliseconds, the migration of premium spend into curated private marketplaces (especially in Connected TV), and signal loss as cookies and mobile device IDs decayed. Connected TV (CTV — streaming video on internet-connected televisions) became the highest-value, most-walled, most-curated channel in digital advertising just as these pains peaked. That is why these pages lean on it.\n\nThen large language models arrived — and with them, in November 2024, Anthropic's **Model Context Protocol (MCP)**, a single open standard that lets an AI model call external tools and data instead of wiring each model-to-tool link by hand. MCP is the substrate. Through 2025 a standards cascade followed: Google's **Agent2Agent (A2A)** protocol (April 2025), Google's **Agent Payments Protocol (AP2)** (Sept 16, 2025), OpenAI and Stripe's **Agentic Commerce Protocol (ACP)** (Sept 29, 2025), the coalition-built **Ad Context Protocol (AdCP)** (Oct 15, 2025), and **IAB Tech Lab's Agentic RTB Framework (ARTF)** for public comment (Nov 13, 2025), later folded under the **AAMP** umbrella (named Feb 26, 2026).\n\nThe agentic moment is best understood not as a new idea but as the oldest one in this market — the same M×N integration problem programmatic never solved, now handed an AI-native cure and fought over by two rival camps.\n\n---\n\n## 1. The question this chapter answers\n\nHow did advertising arrive at the \"agentic\" moment — the point where AI agents are wired directly into the buying and selling of ads? The short answer: the pre-agentic programmatic stack automated the auction but left the connections between companies hand-built, latency-bound, and signal-starved. Agents are now sold as the cure for those leftover pains. What follows lays out the stack, the pains, the CTV scene, the arrival of AI into ad-ops, the MCP substrate, and the dated 2025 standards cascade — and flags the moments where it could have gone differently.\n\nA note on vocabulary, decoded once and used throughout:\n\n- **Programmatic advertising** — the automated buying and selling of ad space by software, rather than humans negotiating insertion orders.\n- **RTB (real-time bidding)** — the most common programmatic mechanism: each individual ad impression is auctioned in the ~100 milliseconds while a page or video loads.\n- **DSP (demand-side platform)** — the software an advertiser or agency uses to bid on impressions (e.g., The Trade Desk, Google DV360, Amazon DSP).\n- **SSP (supply-side platform)** — the software a publisher uses to offer its inventory to bidders (e.g., Magnite, PubMatic, Google Ad Manager's exchange).\n- **Ad exchange** — the marketplace where DSPs and SSPs meet; in practice the line between SSP and exchange has blurred.\n- **Impression** — one ad shown to one person one time; the atomic unit being bought.\n- **Inventory** — the ad slots a publisher has to sell.\n- **PMP (private marketplace)** — an invitation-only deal where a publisher offers select buyers premium inventory, often enriched with its own audience data, before or instead of the open auction.\n- **Curation** — packaging inventory from many publishers, layered with audience or quality data, into a buyable deal.\n- **CTV (Connected TV)** — streaming video delivered to an internet-connected television (Roku, Amazon Fire TV, smart TVs, and apps like Hulu, YouTube, Netflix, Disney+).\n- **Walled garden** — a platform that controls its own demand, supply, data, and measurement end-to-end, limiting outside visibility (Google, Amazon, Meta; in CTV, increasingly the large streamers).\n- **AI agent** — software built on a large language model that can take goal-directed actions — calling tools, querying data, making decisions — with limited human prompting.\n\n---\n\n## 2. The pre-agentic stack: what each standard does and why it mattered\n\nThree IAB Tech Lab standards built the programmatic machine. In plain language, each does one job: *run the auction* (OpenRTB), *speak a shared object vocabulary* (AdCOM), and *serve the video ad to the player* (VAST).\n\n### 2.1 OpenRTB — the auction protocol\n\nOpenRTB lets a publisher's system describe an impression coming up for sale and lets bidders respond with an offer — all in real time. Load a page or start a streaming video, and the SSP fires a **bid request** (a structured message: this ad slot, this device, this rough audience, this floor price) to many DSPs. Each DSP that wants it returns a **bid response** — a price and a creative. The highest bid wins, and its ad is served, typically inside ~100 milliseconds [1][6].\n\nThe \"RTB Project\" (originally the OpenRTB Consortium) gathered supply- and demand-side technology leaders in **November 2010** to build an open protocol for automated media trading [4]. OpenRTB Mobile 1.0 followed in early 2011; OpenRTB 2.0 unified display, video, and mobile that same year [4]. Version 2.5 (September 2017) added header-bidding support and new placement types; version 2.6 (April 2022) added explicit features for CTV buying, ad pods (multiple ads in a streaming break), and structured user-agent data [1]. OpenRTB's own framing: \"RTB allows for Addressable Advertising; the ability to serve ads to consumers directly based on their demographic, psychographic, or behavioral attributes\" [1].\n\nWhy it mattered: before OpenRTB, every buyer-seller connection was a custom negotiation. OpenRTB made the *transaction* interoperable — any compliant DSP could bid into any compliant SSP. It became the lingua franca of the open programmatic web. The agentic-era partisans now reach for the same analogy: AdCP's chief proponent calls his protocol \"the universal ads API\" and \"OpenRTB for agentic advertising\" [10][13].\n\n### 2.2 AdCOM — the shared object model\n\nAdCOM (Advertising Common Object Model) is the dictionary OpenRTB points to. OpenRTB carries the *commerce* of the auction — bids, deals, auction parameters. The *nouns* common across many specs (ad, placement, user, device, site, publisher) were factored out into AdCOM, a reusable, extensible vocabulary [2]. When an SSP builds a bid request, it includes AdCOM-aligned descriptors of the slot and its constraints, and the bidder reads one shared list instead of reverse-engineering each partner's idiosyncratic fields. The payoff: fewer integration errors and smaller bid requests, because everyone shared one model [2]. AdCOM arrived alongside the OpenRTB 3.0 effort (public comment opened September 2017; companion specs detailed November 2018) [2][15].\n\nWhy it mattered — and why it is the quiet hero of this story: AdCOM is the industry's first serious attempt to stop re-describing the same objects in every integration. That is exactly the impulse the agentic standards now inherit. AdCP ships a `brand.json` and `adagents.json`; IAB Tech Lab's agentic roadmap explicitly builds on \"OpenRTB, AdCOM, OpenDirect, VAST and the Deal API\" [16]. The common-object idea did not die. It got promoted.\n\n### 2.3 VAST — the video/CTV ad-serving template\n\nVAST (Video Ad Serving Template) is the XML template that tells a video player how to fetch, display, and track a video ad. The ad server hands the player a VAST document; the player reads it to learn which creative to load, how long it runs, where to send tracking pings, and what to do on click [3]. VAST first appeared in **2008** and has iterated through 4.x: VAST 4.0 (January 21, 2016) focused on delivering video ads across a wide range of devices; 4.1 (November 2018) added ad-verification and Open Measurement support; 4.2 (June 2019) added interactivity via SIMID; 4.3 followed (December 2022) [3][7].\n\nWhy it mattered for CTV specifically: streaming TV largely uses **server-side ad insertion (SSAI)**, where the ad is stitched into the video stream at the server rather than fetched by the client. The SSAI system calls the VAST endpoint, retrieves the creative and metadata, and stitches it into the stream for seamless, ad-block-resistant playback on a TV [3]. IAB Tech Lab issued a VAST CTV Addendum (2024) to harden the template for the living room [3]. VAST is why a Roku, a Fire TV, and a smart-TV app can all render the same programmatic video ad — the unglamorous plumbing beneath every CTV impression.\n\n> **Claim cluster takeaway.** OpenRTB runs the auction, AdCOM supplies the shared nouns, VAST renders the video ad. Together they made the *transaction and the creative* interoperable. None of them made the *integrations between companies* cheap. That gap is the seed of the agentic pitch.\n\n---\n\n## 3. The structural problems the stack left unsolved\n\nProgrammatic worked. It also accumulated four chronic pains — and agents now promise to relieve each one.\n\n### 3.1 The custom-integration tax\n\nEvery DSP↔SSP↔data connection is, in practice, hand-built and hand-maintained. OpenRTB standardized the *message format*, but onboarding a new partner, mapping its quirks, reconciling its deal IDs, and wiring in each data provider stayed bespoke engineering. The result is what the trade calls the \"ad tech tax\": every hop in the supply chain adds a fee or take-rate, and that leakage drains both publisher revenue and advertiser working media [9]. The Association of National Advertisers' Programmatic Media Supply Chain Transparency Study (December 2023) found that roughly **one-quarter of programmatic ad spend was effectively wasted** in the supply chain — on the order of $22B of ~$88B in open-web programmatic, split between made-for-advertising / low-quality media and ad-tech margin [9]. (The headline figure is the ANA's December 2023 study; the separate ANA/TAG TrustNet benchmark partnership launched later, in June 2024, and its December 2024 update reported some improvement.) Agentic standards are sold first as the end of bespoke plumbing — a \"common handshake layer\" so agents can transact \"without bespoke plumbing\" [12].\n\n### 3.2 Bid-request latency and bloat\n\nRTB is a millisecond business. DSPs collectively process on the order of tens of millions of bid requests per second, and an auction that runs too long simply loses the impression [9]. \"Bidstream bloat\" — too many duplicate or low-value bid requests flooding DSPs — drags down efficiency. A single publisher reachable through multiple exchanges generates duplicate auctions for the same impression, piling on latency and cost without raising the clearing price [9]. IAB Tech Lab puts a number on the prize. Its Agentic RTB Framework targets cutting bid-request/response round-trips from roughly **600–800 ms to about 100 ms — up to an 80% reduction** — by letting agents and real-time systems run inside the same data center rather than across networks [5][11].\n\n### 3.3 The rise of curation and PMP dealmaking — especially in CTV\n\nAs the open auction grew noisy, premium spend migrated into curated private deals. PMPs let buyers reach a publisher's premium inventory — often enriched with the publisher's first-party data — in a brand-safe, controlled environment before it hits the open market. In CTV this is now the dominant mode. Programmatic guaranteed (fixed-price, reserved deals) alone made up about **a quarter of CTV ad buys in 2024**. A frequently-quoted estimate puts curated private marketplaces at roughly **47% of CTV spend versus ~15% on the open exchange** — but that exact split traces to a low-tier aggregator (which itself attributes it to MediaPost/Pixalate/Comscore), so treat it as directional rather than established. Curation is, in one sense, the industry already routing around the open auction's failures by hand — exactly the workflow an agent could absorb.\n\n### 3.4 Signal loss\n\nThe targeting fuel of programmatic — third-party cookies on the web, the IDFA device ID on iPhones — decayed through the early 2020s. Apple's App Tracking Transparency (ATT, iOS 14.5, 2021) made the IDFA opt-in; opt-in rates have plateaued near **25%** and have not moved meaningfully since 2023. On the web, Google's cookie saga ended in a shrug. In **July 2024** Google cancelled the forced third-party-cookie phase-out, and in **April 2025** reaffirmed it would not ship a new opt-in prompt, leaving cookies on by default but increasingly restricted to a shrinking consented audience. The lost revenue is real: the UK Competition and Markets Authority's June 2025 report found per-impression publisher revenue roughly **30% lower** under Privacy Sandbox tools than under conventional cookies. Signal loss pushed value toward logged-in, first-party-data environments — which describes the walled gardens and, increasingly, CTV.\n\n> **Why agents, why now.** Each pain is an integration or coordination problem: too many bespoke links, too much wasted round-trip, too much manual deal-curation, too little portable signal. An AI agent that can read a brief, discover inventory, negotiate a deal, and execute across platforms is pitched as solving all four at once. Whether it delivers is the question taken up in the chapters that follow. The *demand* for it is explained here.\n\n---\n\n## 4. CTV: the highest-value, most-walled, most-curated channel\n\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">US CTV ad spend — the prize agents are competing for<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">10<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">20<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">30<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">40<\/text><rect x=\"188.5\" y=\"81.8\" width=\"56.0\" height=\"168.2\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"216.5\" y=\"75.8\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">28.75 $B<\/text><text x=\"216.5\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 216.5 268.0)\">2024<\/text><rect x=\"501.5\" y=\"28.0\" width=\"56.0\" height=\"222.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"529.5\" y=\"22.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">37.95 $B<\/text><text x=\"529.5\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 529.5 268.0)\">2026 (forecas…<\/text><\/svg><figcaption>CTV reached ~1 in 10 US digital ad dollars by 2024. <span class=\"credit\">Source: eMarketer (Mar 2024 &amp; Dec 2025 forecasts) — estimates, not audited.<\/span><\/figcaption><\/figure>\n\n\n\nCTV is the stage on which the agentic drama plays out. Set the scene first.\n\n**Scale.** US CTV ad spending reached roughly **$28.75 billion in 2024** (about 18.8% growth), per eMarketer's March 2024 forecast, with double-digit growth continuing into 2025; eMarketer's December 2025 forecast put 2026 US CTV ad spend at about **$37.95 billion (≈14.5% growth)**. By 2024 CTV claimed roughly **one in ten US digital ad dollars**. (Figures are eMarketer estimates; treat as forecast, not audited fact, and note the forecast date.)\n\n**Concentration / walled gardens.** CTV ad spend clusters in a handful of platforms — YouTube and Hulu were each near $3.39 billion in 2024; Amazon grew sharply after bringing ads to Prime Video in January 2024; Roku, Netflix, Disney+, and Max round out the field. Each streamer is its own walled garden with its own measurement, so following one viewer across services is hard: \"there is no measurement standardization across streaming platforms.\" eMarketer flags this fragmented buying process as a brake on CTV growth.\n\n**Curation-heavy.** Over **90% of US CTV *display* ad spend in 2025 transacted programmatically**, and even on the broader all-CTV base the programmatic share is high — reported in roughly the **75–84%** range — but heavily via private deals (PMP and programmatic guaranteed) rather than the open auction. Curation — packaging multi-publisher inventory with audience and brand-safety layers — is the defining CTV buying motion, and analysts named \"curation's center stage\" and \"AI optimization\" as headline CTV trends for 2026.\n\nPut it together. CTV is where the money is, where the gardens are highest-walled, where buying is most deal-and-curation-driven, and where signal loss pushed advertisers toward logged-in inventory. That makes it the perfect proving ground — and the perfect battleground — for agentic buying. And AdCP's launch roster is conspicuously CTV-weighted: Yahoo, PubMatic, Magnite, LG Ad Solutions, Samba TV, Triton Digital, The Weather Company, Kargo.\n\n---\n\n## 5. AI and \"agents\" enter media buying, 2024–2025\n\nBefore protocols came workflow adoption. Generative AI — the wave that defined 2024–2025 — produced creative assets and copy on request, but waited for a prompt each time. Uptake was already broad: an October 2024 Digiday survey found **61% of brand and agency marketers worldwide using AI for programmatic advertising** (a trade-press survey; treat as directional). The shift through 2025 was from *generative* (make me an asset) to *agentic* (achieve this goal) — goal-oriented systems told what to accomplish, left to figure out how, and to learn from the result.\n\nBy late 2025 the demonstrations turned concrete. On **October 16, 2025** — the day after AdCP's public launch — a live agent-to-agent media buy ran end to end: Scope3 on the buy side, Swivel as the seller-side ad server, LG Ads supplying real inventory. The agents handled the full workflow from brief through targeting, proposal, creative upload, and a real-money transaction, all over AdCP. Later demos took natural-language briefs through Claude, with PubMatic's agents interpreting and executing. The agentic pitch had moved from slideware to a working — if curated — transaction.\n\n---\n\n## 6. The substrate: Anthropic's Model Context Protocol (MCP), November 2024\n\nThe foundational move was not an ad-tech move at all. On **November 25, 2024**, Anthropic announced and open-sourced the **Model Context Protocol (MCP)** — \"a new standard for connecting AI assistants to the systems where data lives, including content repositories, business tools, and development environments.\"\n\n**The problem MCP solved.** Even capable models sat \"trapped behind information silos,\" where \"every new data source requires its own custom implementation\" — the model-to-tool version of the same M×N integration problem programmatic never escaped. MCP replaces N custom connectors with one protocol: an AI application (an **MCP client/host**) talks to any number of **MCP servers** that expose tools and data through one shared interface. At launch Anthropic shipped the spec plus SDKs for Python and TypeScript, local server support in the Claude desktop apps, and pre-built servers for Google Drive, Slack, GitHub, Git, Postgres, and Puppeteer.\n\n**Why it became the substrate.** MCP spread fast across the AI field — adopted by OpenAI, Google DeepMind, and developer-tool companies — and by late 2025 had reached massive scale. On **December 9, 2025** Anthropic donated MCP to the newly formed **Agentic AI Foundation (AAIF)**, a directed fund under the Linux Foundation. The AAIF was co-founded with Block and OpenAI and backed by Google, Microsoft, AWS, Cloudflare, and Bloomberg, with reported figures around **97 million monthly SDK downloads and 10,000+ active servers** (these scale figures are vendor/foundation-reported). The point that matters for advertising: AdCP is built *on* MCP, and the platform ad MCP servers (Amazon Ads, Google Ads, Meta) implement MCP directly. MCP is the layer everything else sits atop.\n\n> **Plain-language anchor.** MCP is to AI-agent-to-tool what OpenRTB was to buyer-to-seller: a single open standard that replaced a thicket of bespoke integrations with one shared handshake. That parallel is the through-line of this entire account.\n\n---\n\n## 7. The 2025 standards cascade — a dated timeline\n\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The agentic-advertising standards cascade, 2024–2026<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">Nov 2024<\/div><div class=\"tlbody\">Anthropic releases MCP — the substrate<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">Apr 2025<\/div><div class=\"tlbody\">Google A2A (agent-to-agent) protocol<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">Sep 16 2025<\/div><div class=\"tlbody\">Google AP2 (Agent Payments Protocol)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">Sep 29 2025<\/div><div class=\"tlbody\">OpenAI + Stripe ACP / ChatGPT Instant Checkout<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">Oct 15 2025<\/div><div class=\"tlbody\">AdCP launched (CTV-heavy supply coalition)<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">Nov 13 2025<\/div><div class=\"tlbody\">IAB Tech Lab ARTF v1.0 for public comment<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">Dec 9 2025<\/div><div class=\"tlbody\">MCP donated to the Linux Foundation<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">Feb 26 2026<\/div><div class=\"tlbody\">IAB names its agentic umbrella AAMP<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.56s\"><div class=\"tldate\">Jun 15 2026<\/div><div class=\"tlbody\">Fox agrees to acquire Roku (~$22B)<\/div><\/div><\/div><figcaption>Every dated protocol release that built the agentic-ad stack. <span class=\"credit\">Source: Vendor/standards-body announcements, corroborated in trade press.<\/span><\/figcaption><\/figure>\n\n\n\nWith the substrate in place, 2025 produced a rapid sequence of standards. Dates are corroborated across primary announcements and trade reporting; where a single source carries a claim it is flagged.\n\n| Date | Standard | Owner | One-line purpose |\n| --- | --- | --- | --- |\n| Nov 25, 2024 | **MCP** (Model Context Protocol) | Anthropic | One standard for AI models to call external tools/data [Anthropic] |\n| April 2025 | **A2A** (Agent2Agent) | Google → Linux Foundation | Lets agents from different vendors discover and delegate to each other [Google/LF] |\n| June 2025 | A2A donated to Linux Foundation | Google | Vendor-neutral governance for A2A [LF] |\n| Sept 16, 2025 | **AP2** (Agent Payments Protocol) | Google + 60+ partners | Cryptographically signed \"mandates\" let agents pay on a human's behalf [Google Cloud] |\n| Sept 29, 2025 | **ACP** (Agentic Commerce Protocol) | OpenAI + Stripe | Agent-ready checkout; powers ChatGPT Instant Checkout [Stripe/OpenAI] |\n| Oct 15, 2025 | **AdCP** (Ad Context Protocol) | Coalition (Yahoo, PubMatic, Scope3, Optable, Swivel, Triton) | Common agent language to discover, plan, buy, sell, measure media [AdCP coalition] |\n| Oct 16, 2025 | First live agentic media buy demo | Scope3/Swivel/LG Ads | Real-money A2A buy over AdCP [MediaPost] |\n| Nov 13, 2025 | **ARTF** v1.0 for public comment | IAB Tech Lab | Containerized architecture to cut RTB latency ~80%; agentic foundations [IAB Tech Lab] |\n| Dec 9, 2025 | MCP donated to AAIF / Linux Foundation | Anthropic | Vendor-neutral governance for the substrate [LF] |\n| Jan 6, 2026 | Agentic Roadmap | IAB Tech Lab | Plan to extend OpenRTB/AdCOM/VAST with MCP/A2A/gRPC [IAB Tech Lab] |\n| Feb 26, 2026 | **AAMP** name unveiled | IAB Tech Lab | Umbrella over ARTF + agentic protocols + agent registry [IAB Tech Lab / Beet.TV] |\n\n### 7.1 A2A — agents talking to agents (April 2025)\n\nGoogle announced **Agent2Agent (A2A)** in April 2025 as an open standard for agents built by different vendors to discover one another (via \"Agent Cards\"), authenticate, delegate tasks, and coordinate — over HTTP/JSON-RPC — regardless of framework or host. Google handed A2A to the Linux Foundation in June 2025; support grew past 150 organizations within a year. If MCP is agent-to-tool, A2A is agent-to-agent — the second leg of the substrate, and the one AdCP and ARTF both name as a transport.\n\n### 7.2 AP2 — agents that can pay (Sept 16, 2025)\n\nOn **September 16, 2025**, Google announced the **Agent Payments Protocol (AP2)**, built with 60+ payments and tech partners (Adyen, American Express, Coinbase, Etsy, Mastercard, PayPal, Worldpay, and more) to let agents move money on a user's behalf. Its core construct is the **Mandate** — a \"tamper-proof, cryptographically-signed digital contract\" backed by verifiable credentials, in two forms: an **Intent Mandate** (the user's initial authority) and a **Cart Mandate** (an unchangeable record of exact items and price). AP2 frames the three problems autonomous payment raises — **Authorization, Authenticity, Accountability** — and positions itself as an extension of A2A and MCP, payment-method-agnostic across cards, stablecoins, and real-time bank transfers.\n\n### 7.3 ACP — agentic commerce checkout (Sept 29, 2025)\n\nOn **September 29, 2025**, OpenAI and Stripe launched the **Agentic Commerce Protocol (ACP)** and ChatGPT's **Instant Checkout** — an open standard for commerce flows between buyers, AI agents, and businesses. US users could buy from US Etsy sellers in-chat, with Shopify merchants to follow. OpenAI charges merchants a reported 4% transaction fee on completed Instant Checkout purchases, atop standard payment processing (the fee figure is trade-reported). ACP and AP2 are the *commerce/payment* layer next to AdCP's *advertising* layer — the same agentic plumbing applied to the buy button rather than the ad slot.\n\n### 7.4 AdCP — the coalition standard for agentic advertising (Oct 15, 2025)\n\nOn **October 15, 2025**, a coalition launched the **Ad Context Protocol (AdCP)** — founding members Yahoo, PubMatic, Scope3, Optable, Swivel, and Triton Digital, with launch supporters including Magnite, LG Ad Solutions, Samba TV, MiQ, Kargo, The Weather Company, Butler/Till, Raptive, and Classify. AdCP is \"the open protocol that lets AI agents discover, plan, buy, sell, and measure media across every channel,\" built on MCP and A2A as transports and governed by the independent **AgenticAdvertising.org** under a principle of \"Embedded Human Judgment.\" Its specifications, per the AdCP docs, include the **Media Buy Protocol** (full campaign lifecycle — `get_products`, `create_media_buy`, etc.), **Creative Protocol** (format discovery and build), **Signals Protocol** (audience/targeting discovery and activation — `get_signals`, `activate_signal`), plus **Governance**, **Brand** (`brand.json`), and **Accounts** protocols, with a discovery layer using `.well-known/` files (`adagents.json`, `brand.json`) and a registry. (Module naming has shifted since launch — early launch coverage referenced \"Signals Activation,\" \"Media Buy,\" \"Creative,\" and a \"Curation Protocol coming Q2\"; the live docs as read show the set above.)\n\nThe figure behind AdCP is **Brian O'Kelley** — co-founder/CEO of Scope3, previously co-founder/CEO of AppNexus (sold to AT&T for $1.6B in 2018), widely credited as an inventor of the ad exchange and programmatic, and a Prebid co-creator. He calls AdCP \"the universal ads API\" for the open web. His provenance matters: the man who helped build the open-auction era is now building the protocol pitched to bury it.\n\n### 7.5 ARTF / AAMP — IAB Tech Lab's incumbent-standards answer (Nov 13, 2025 →)\n\nOn **November 13, 2025**, IAB Tech Lab released the **Agentic RTB Framework (ARTF) v1.0** for public comment (window through January 15, 2026). ARTF's distinctive move is a **containerized architecture**. Instead of agents calling across the network, agents and real-time systems run within the same virtual environment (data center, server, VM), targeting an up-to-80% latency reduction (roughly 600–800 ms round-trips down to ~100 ms) and applying agentic standards *through* OpenRTB, with support for MCP and A2A. CEO **Anthony Katsur**: \"By allowing agents and other real-time technologies to operate within the same virtual environment, we're creating a foundation for agentic workflows and near-instantaneous media trading.\"\n\nIAB Tech Lab then folded ARTF into a larger initiative. It published an **Agentic Roadmap on January 6, 2026** — explicitly building on \"OpenRTB, AdCOM, OpenDirect, VAST and the Deal API\" paired with \"Model Context Protocol, Agent2Agent and gRPC.\" On **February 26, 2026** it formally named the umbrella **AAMP (Agentic Advertising Management Protocols)**, with three pillars: Agentic Foundations (ARTF + guardrails), Agentic Protocols (buyer/seller agent hierarchies, seven protocol components each), and Trust & Transparency (an Agent Registry). IAB Tech Lab pitches AAMP as the comprehensive, standards-body alternative: \"Where AdCP provides nine core tasks built on Anthropic's Model Context Protocol, AAMP provides an entire three-tier agent hierarchy for both buyers and sellers, with seven specific protocol components each mapped to existing industry standards.\"\n\n### 7.6 The shape of the standards fight\n\nBy late 2025 two camps stood clear. **AdCP** builds *new* AI-native standards on MCP, governed by an independent coalition, and pitched as a clean \"common handshake.\" **IAB Tech Lab (ARTF/AAMP)** extends *existing* standards — deterministic, compliance-first, registry- and audit-driven — and pitched as not \"blowing up the current stack.\" Katsur's stated worry: \"the fastest and smartest way forward is to build on an existing shared foundation, not introduce multiple new standards that create fragmentation.\" Will the two converge or compete? As of mid-2026, unresolved — and that contested center is exactly what the chapters that follow examine.\n\n---\n\n## 8. The platform MCP servers — walled gardens open a side door\n\nWhile the AdCP/IAB fight played out, the largest advertising platforms quietly shipped their own MCP servers — letting agents drive their ad APIs in natural language. These are present-tense status claims as of mid-2026.\n\n- **Amazon Ads MCP Server** — launched in **open beta** (per Amazon's own announcement dated Feb 2, 2026; some trade coverage cited an earlier closed beta around Nov 13, 2025 — the date here follows the primary open-beta announcement). It is built on MCP, acts as \"a translation layer that turns natural language prompts into structured API calls,\" connecting AI clients (Claude, ChatGPT, Gemini per the announcement) to Amazon Ads API functionality; \"available globally in open beta to Amazon Ads partners with active API credentials.\"\n- **Google Ads / Google Analytics MCP** — Google released an MCP server for Google Analytics (reported July 22, 2025) and offers an official open-source MCP server for the Google Ads API providing read-only diagnostics/analytics via GAQL queries (trade-reported).\n- **Meta Ads AI Connectors** — Meta shipped an umbrella product (an MCP Server and a CLI wrapping the Marketing API behind one OAuth prompt), reported around April 29, 2026 (trade-reported and very recent).\n\nThe strategic read: the walled gardens are not tearing down their walls. They are installing *agent-readable doors*. Whether those doors route through a neutral protocol (AdCP/AAMP) or stay platform-specific is one of the central open questions here.\n\n---\n\n## 9. Contingent inflection points — where it could have gone differently\n\nHistory is not destiny. Several hinges could plausibly have sent the agentic moment elsewhere:\n\n1. **OpenRTB 3.0's stall (2017–2020).** IAB Tech Lab proposed a clean re-architecture — a layered model with AdCOM factored out and `ads.cert` cryptographic signing. But 3.0 broke backward compatibility and demanded rewriting underlying code, so the industry largely declined it and back-ported the wanted pieces into the 2.x line instead. Had 3.0 stuck, the stack entering the agentic era would have been cleaner and more authenticated — and the agentic standards would have had less brownfield to route around. The incumbents clearly absorbed the lesson: ARTF/AAMP are explicitly designed *not* to \"blow up the current stack.\"\n\n2. **The cookie that didn't die (July 2024 / April 2025).** Had Google fully deprecated third-party cookies as long promised, signal loss would have cut far deeper and the rush to logged-in, walled-garden and CTV inventory would have been more violent. Google's reversal softened the shock but left the ecosystem in limbo — enough signal decay to make first-party-rich CTV attractive, not enough to force a clean reset.\n\n3. **MCP as an open standard, not a moat (Nov 2024).** Anthropic could have kept MCP proprietary. By open-sourcing it — and ultimately donating it to a Linux Foundation entity in December 2025 — it turned MCP into neutral substrate that rivals (OpenAI, Google) and ad-tech coalitions could build on. Had MCP stayed closed, AdCP would have had no shared foundation, and the agentic-advertising story might have splintered across vendor-specific protocols from day one.\n\n4. **A coalition forming before the standards body moved (Oct vs. Nov 2025).** AdCP (Oct 15) launched roughly a month before ARTF's public comment (Nov 13). The coalition's first-mover demonstration — a live, real-money agentic buy on Oct 16 — set the narrative that agents *already* transact, and forced IAB Tech Lab into a fast-follow posture (roadmap Jan 6, AAMP name Feb 26). Had the standards body moved first, the default might have been incumbent-extended standards rather than a clean-sheet coalition protocol.\n\n5. **The provenance of the challenger.** AdCP's lead, Brian O'Kelley, is the same person who helped invent the ad exchange that programmatic was built on. That an inventor of the open-auction era is championing its agentic successor lent AdCP credibility a pure-startup effort would have lacked — a contingent personnel fact that shaped which standard got taken seriously.\n\n---\n\n## 10. Open Questions\n\n1. **Will the two camps converge or fork?** As of mid-2026, the compatibility-versus-competition relationship between AdCP and IAB Tech Lab's AAMP/ARTF was explicitly \"unclear\" in reporting. Convergence (AdCP modules mapping onto AAMP's hierarchy) and a lasting fork are both live.\n2. **Does agentic buying actually reduce the ad-tech tax, or just move it?** The pitch is disintermediation; the risk is that agents and protocol-layer toll-takers (registries, payment fees like ACP's reported 4%) rebuild the take-rate elsewhere.\n3. **Will CTV walled gardens route agents through neutral protocols or keep them platform-specific?** The platform MCP servers (Amazon, Google, Meta) open agent-readable doors, but on the platforms' own terms; whether AdCP/AAMP becomes the cross-garden lingua franca or stays an open-web phenomenon is undecided.\n4. **How durable is each platform MCP server?** Beta-stage products (Amazon Ads open beta; Meta connectors very recent) are exactly the kind of present-tense claim that goes stale via rename, sunset, or GA — requires re-confirmation.\n5. **Does signal loss re-accelerate?** Google's cookie limbo could shift again; a renewed deprecation would sharply increase the pull toward CTV and first-party environments and change the agentic value proposition.\n6. **Module naming drift in AdCP.** The launch-era module set (\"Signals Activation / Media Buy / Creative / Curation coming Q2\") differs from the live docs (Media Buy / Creative / Signals / Governance / Brand / Accounts). The evolution and current canonical set need a primary-spec read.\n\n---\n\n## Sources\n\n1. IAB Tech Lab, \"OpenRTB (Real-Time Bidding)\" standard page. https://iabtechlab.com/standards/openrtb/ — Accessed 2026-06-19. **Tier 1** (standards body / primary spec page). Plain-language purpose, version dates (2.5, 2.6), bid request/response model.\n2. IAB Tech Lab, \"AdCOM (Advertising Common Object Model)\" standard page. https://iabtechlab.com/standards/adcom-advertising-common-object-model/ — Accessed 2026-06-19. **Tier 1.** AdCOM's role, layered approach with OpenRTB, integration/bid-size benefits.\n3. IAB Tech Lab, \"Digital Video Ad Serving Template (VAST)\" standard page + version PDFs (VAST 4.0 Jan 21 2016; 4.2 June 2019; 4.3 Dec 2022; CTV Addendum 2024). https://iabtechlab.com/standards/vast/ — Accessed 2026-06-19. **Tier 1.** VAST purpose, version history, SSAI/CTV usage.\n4. OpenRTB Consortium / IAB Tech Lab, OpenRTB API Specification v2.5 (RTB Project history; project formed Nov 2010; OpenRTB 2.0 in 2011). https://www.iab.com/wp-content/uploads/2016/03/OpenRTB-API-Specification-Version-2-5-FINAL.pdf — Accessed 2026-06-19. **Tier 1.** Origin date and early version lineage.\n5. IAB Tech Lab, press release, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment,\" Nov 13, 2025. https://iabtechlab.com/press-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment/ — Accessed 2026-06-19. **Tier 1** (primary, but a release announcement — used for what IAB *states*, dates corroborated by [11]). ARTF date, containerized architecture, ~80% latency claim, Katsur quote, Jan 15 2026 comment deadline.\n6. Anthropic, \"Introducing the Model Context Protocol,\" Nov 25, 2024. https://www.anthropic.com/news/model-context-protocol — Accessed 2026-06-19. **Tier 1** (primary, vendor announcement — used for MCP's stated purpose/architecture/launch contents). MCP date, M×N problem, client/server model, SDKs and pre-built servers.\n7. Wurl / Integral Ad Science explainers on VAST versions and CTV SSAI (corroborating [3]). https://www.wurl.com/glossary/video-ad-serving-template-vast/ — Accessed 2026-06-19. **Tier 5** (vendor/trade explainer). Corroboration of VAST history and SSAI mechanics; not sole source for any fact.\n8. eMarketer, \"Guide to connected TV\" and \"CTV trends for 2026\" (US CTV ad-spend figures: ~$28.75B 2024; 2026 ~$37.95B Dec 2025 forecast; one-in-ten digital dollars; platform concentration; measurement fragmentation; curation/AI 2026 trends; the ~47%/~15% PMP-vs-open-exchange split is NOT from eMarketer — see the Claim 1.6 correction). https://www.emarketer.com/learningcenter/guides/guide-ctv/ ; https://www.emarketer.com/content/measurement-maturity--curation-s-center-stage--ai-optimization--ctv-trends-2026 — Accessed 2026-06-19. **Tier 5** (analyst forecasts; treat as estimates, note forecast date). All CTV scale/share figures.\n9. AdPushup / BidSwitch / HUMAN Security / ANA-TAG TrustNet syntheses on bidstream bloat, supply-path duplication, the ad-tech tax (~25% programmatic waste, 2024). https://blog.bidswitch.com/bidstream-bloat-the-what-why-and-the-way-out ; https://www.humansecurity.com/learn/blog/which-supply-paths-work-unlocking-the-hidden-map-of-programmatic-spend/ — Accessed 2026-06-19. **Tier 5** (trade/vendor analysis; the 25%-waste figure traces to the ANA Programmatic Media Supply Chain Transparency Study, Dec 2023 — ANA-authored, Tier 2-adjacent; the ANA/TAG TrustNet benchmark partnership came later, June 2024). Integration tax, latency/bloat mechanics.\n10. Scope3 company page + MediaPost, on Brian O'Kelley (AppNexus founder, $1.6B AT&T sale 2018, Prebid co-creator), AdCP as \"universal ads API,\" coalition members. https://scope3.com/company/ ; https://www.mediapost.com/publications/article/409937/the-first-agentic-media-buy-more-to-come.html — Accessed 2026-06-19. **Tier 5** (vendor + trade). O'Kelley provenance, AdCP framing, first-agentic-buy demo (Oct 16, 2025).\n11. MediaPost, \"IAB Tech Lab Releases First Framework For Agentic Ad Buying,\" Nov 14, 2025 (independent corroboration of ARTF Nov 13 release date and latency figures). https://www.mediapost.com/publications/article/410696/iab-tech-lab-releases-first-framework-for-agentic.html — Accessed 2026-06-19. **Tier 5** (trade). Date and latency corroboration for [5].\n12. Digiday, \"AdCP vs. IAB Tech Lab: Inside programmatic advertising's agentic AI standards showdown\"; The Current, \"IAB Tech Lab... releases an agentic advertising framework\"; Adweek guide to agentic protocols. https://digiday.com/media-buying/adcp-vs-iab-tech-lab-inside-programmatic-advertisings-agentic-ai-standards-showdown/ — Accessed 2026-06-19. **Tier 5** (trade analysis, note ad-tech-insider lean). Two-camp framing, Katsur fragmentation quote, compatibility-unclear.\n13. VideoWeek, \"Industry Coalition Ushers in Age of Agent-to-Agent Trading with Ad Context Protocol Launch,\" Oct 15, 2025; TVNewsCheck / Samba TV release coverage. https://videoweek.com/2025/10/15/industry-coalition-ushers-in-age-of-agent-to-agent-trading-with-ad-context-protocol-launch/ — Accessed 2026-06-19. **Tier 5** (trade; Samba release is a press release, used only for what the coalition claims). AdCP launch date, founding/launch members, \"OpenRTB for agentic advertising\" framing, Coghlan quote.\n14. Adcontextprotocol.org and docs.adcontextprotocol.org (official AdCP site/docs: definition, protocol modules — Media Buy / Creative / Signals / Governance / Brand / Accounts; MCP+A2A transport; AgenticAdvertising.org governance; \"Embedded Human Judgment\"). https://adcontextprotocol.org/ ; https://docs.adcontextprotocol.org/ — Accessed 2026-06-19. **Tier 1** (primary protocol docs — for what the spec says). Live module set and transports.\n15. The Drum / MarTech / MediaPost on OpenRTB 3.0 (public comment Sept 2017; companion specs Nov 2018) and BidSwitch, \"OpenRTB 3.0: What Is It, and Why Is (Almost) Nobody Using It?\" (low adoption, no backward compat, 2.x back-port). https://blog.bidswitch.com/openrtb-3.0-what-is-it-and-why-is-almost-nobody-using-it-yet — Accessed 2026-06-19. **Tier 5** (trade analysis) + **Tier 1** dates from IAB. OpenRTB 3.0 stall as contingent inflection.\n16. IAB Tech Lab, \"IAB Tech Lab Unveils Agentic Roadmap for Digital Advertising,\" Jan 6, 2026, + MarTech coverage; ppc.land, \"IAB Tech Lab names its agentic ad initiative AAMP,\" Feb 26, 2026 (AAMP three pillars, AdCP contrast, Beet.TV unveil). https://iabtechlab.com/press-releases/iab-tech-lab-unveils-agentic-roadmap-for-digital-advertising/ ; https://ppc.land/iab-tech-lab-names-its-agentic-ad-initiative-aamp-to-end-market-confusion/ — Accessed 2026-06-19. **Tier 1** (IAB release) + **Tier 5** (ppc.land trade). Roadmap date, standards-built-upon list, AAMP naming and structure.\n17. Google Cloud Blog, \"Announcing Agent Payments Protocol (AP2),\" Sept 16, 2025 + DigitalCommerce360 corroboration. https://cloud.google.com/blog/products/ai-machine-learning/announcing-agents-to-payments-ap2-protocol — Accessed 2026-06-19. **Tier 1** (primary, vendor announcement) + **Tier 4/5** corroboration. AP2 date, Mandates (Intent/Cart), 3 A's, 60+ partners, A2A/MCP extension, payment-agnostic.\n18. Stripe Newsroom + Stripe Blog + DigitalCommerce360, on ACP / ChatGPT Instant Checkout (Sept 29, 2025; Etsy/Shopify; 4% merchant fee). https://stripe.com/newsroom/news/stripe-openai-instant-checkout ; https://stripe.com/blog/developing-an-open-standard-for-agentic-commerce — Accessed 2026-06-19. **Tier 1** (primary, vendor) + **Tier 4** corroboration. ACP date, mechanics, fee (fee is trade-reported, flagged).\n19. Linux Foundation press + Google Cloud Blog + Galileo, on A2A (April 2025 launch; June 2025 LF donation; 150+ orgs; HTTP/JSON-RPC, Agent Cards). https://www.linuxfoundation.org/press/linux-foundation-launches-the-agent2agent-protocol-project-to-enable-secure-intelligent-communication-between-ai-agents — Accessed 2026-06-19. **Tier 1/2** (foundation primary) + **Tier 5**. A2A dates and mechanics.\n20. Model Context Protocol Blog + Linux Foundation press + GitHub Blog, on MCP joining AAIF/Linux Foundation (Dec 9, 2025; AAIF co-founders Anthropic/Block/OpenAI; ~97M monthly downloads, 10,000+ servers). https://blog.modelcontextprotocol.io/posts/2025-12-09-mcp-joins-agentic-ai-foundation/ ; https://www.linuxfoundation.org/press/linux-foundation-announces-the-formation-of-the-agentic-ai-foundation — Accessed 2026-06-19. **Tier 1/2** (primary/foundation). MCP donation date, governance, scale (scale figures vendor/foundation-reported, flagged).\n21. Amazon Ads, \"Introducing the Amazon Ads MCP Server\" (open beta; built on MCP; Claude/ChatGPT/Gemini clients; global open beta to partners with API credentials). https://advertising.amazon.com/library/news/amazon-ads-mcp-server-open-beta — Accessed 2026-06-19. **Tier 1** (primary vendor announcement — for what Amazon claims). Amazon Ads MCP status (date reconciliation flagged in §8).\n22. PPC Land / Synter / Scalemate / GitHub awesome-agentic-advertising, on platform MCP servers (Google Ads/Analytics MCP; Meta Ads AI Connectors ~April 29 2026; Amazon closed-beta date variant). https://ppc.land/meta-opens-its-ad-system-to-claude-and-chatgpt-with-new-ai-connectors/ — Accessed 2026-06-19. **Tier 5** (trade; some near content-aggregator quality — used only as directional corroboration, flagged). Platform MCP-server landscape.\n23. Adtelligent / Campaign Asia / Adweek / UK CMA-cited coverage, on signal loss (ATT iOS 14.5 2021; ~25% opt-in plateau; cookie cancellation July 2024 / reaffirmed April 2025; CMA June 2025 ~30% revenue gap under Privacy Sandbox). https://adtelligent.com/blog/ad-tech-insights/how-third-party-cookies-elimination-will-affect-programmatic-ecosystem/ — Accessed 2026-06-19. **Tier 5** (trade) with the CMA figure tracing to a **Tier 1/2** UK regulator report. Signal-loss section.\n24. Digiday (Oct 2024 survey, 61% of marketers using AI for programmatic) + TensorOps AdTech Lab field guide + agentic-AI trade explainers (generative-vs-agentic shift; Butler/Till + Claude + PubMatic demo). https://tensorops.ai/labs/research/agentic-ai-advertising-2026-field-guide — Accessed 2026-06-19. **Tier 5** (trade; survey is directional). AI-into-ad-ops section."}, {"order": 2, "file": "02_Protocol_Architecture.md", "title": "The MCP Substrate and the Anatomy of an Agentic Ad Transaction", "summary": "", "body": "# The MCP Substrate and the Anatomy of an Agentic Ad Transaction\n\n## Bottom Line\n\nThe agentic-advertising stack is not one protocol. It is a layer cake, and you cannot read the standards war correctly until you can name which layer each contender sits in.\n\nAt the bottom is **MCP (Model Context Protocol)**, Anthropic's open standard for connecting one AI agent to its tools and data — released November 25, 2024 and donated to a Linux Foundation directed fund, the Agentic AI Foundation, on December 9, 2025. Beside it sits **A2A (Agent2Agent)**, Google's standard for connecting agents *to each other*, donated to the Linux Foundation in June 2025. The two are complementary, not rivals: MCP is agent-to-tool, A2A is agent-to-agent.\n\nOn top of those substrates run the *ad-specific* standards — and here is the central architectural fact: **AdCP (Ad Context Protocol)** and **ARTF (Agentic RTB Framework)** are not fighting over the same layer. AdCP, launched October 15, 2025 by a supply-side coalition (Scope3, Yahoo, PubMatic, Optable, Swivel, Triton Digital) and built *on top of* MCP and A2A, is a **negotiation/conversation layer**: buyer agents talk to seller agents *outside* the real-time auction, asynchronously, over seconds to days, to transact custom packages, curation, and guaranteed deals. ARTF, released for public comment November 12–13, 2025 by IAB Tech Lab, is an **infrastructure/transport layer**: it makes the *existing* real-time-bidding (RTB) auction agent-and-latency-friendly by running third-party \"agent services\" as colocated containers inside the host's data center, cutting bid round-trips from a claimed 400–800 milliseconds (ms) to roughly 100 ms (about 80%).\n\nPayment is yet another layer. **AP2 (Agent Payments Protocol)**, Google's September 16, 2025 trust framework of cryptographically signed Intent/Cart/Payment \"Mandates,\" is explicitly an extension of A2A and MCP. **ACP (Agentic Commerce Protocol)**, maintained by OpenAI and Stripe (initial spec September 29, 2025), wires agent checkout and tokenized payment.\n\nFor Connected TV (CTV) — premium, curation-heavy, walled-garden, guaranteed-delivery inventory that \"never fit cleanly\" into RTB — the negotiation layer (AdCP) is the more natural fit. That is why CTV is shaping up as agentic advertising's first real proving ground. Draw the stack as five layers — substrate, agent-mesh, ad-negotiation *or* RTB-transport, payment, application — and everything that follows has a map.\n\n---\n\n## 1. Why a \"stack\" is the right mental model\n\nEvery confused take on the agentic-advertising standards war comes from treating MCP, A2A, AdCP, ARTF, AP2, and ACP as six competitors in one race. They are not. They are layers, and most of them depend on the ones below. The most useful thing a clean layering gives you is a way to say \"ARTF sits *here*, AdCP sits *there*, and that is why they solve different problems.\"\n\nThe layering, top to bottom:\n\n1. **Application / agent-experience layer** — the chat surface or autonomous workflow where a human (or another agent) expresses intent: \"buy me premium sports CTV in Q2 for males 25–45.\" This is ChatGPT, Claude, Gemini, an agency's planning agent, or a publisher's sales console.\n2. **Payment / settlement layer** — how money and authorization move once a deal is struck: **AP2** (Google) and **ACP** (OpenAI/Stripe).\n3. **Ad-specific layer (the contested layer)** — the standards built *for advertising*. This splits into two non-overlapping sub-layers:\n   - **Negotiation / conversation sub-layer** — **AdCP**: agents negotiate deals, curation, audiences, and creative *outside* the bidstream.\n   - **RTB transport / execution sub-layer** — **ARTF**: agents enrich and modify bids *inside* the real-time auction.\n4. **Agent-mesh layer** — how independent agents discover and talk to each other: **A2A**.\n5. **Substrate layer** — how a single agent reaches tools and data: **MCP**.\n\nThe two bottom layers (MCP, A2A) are general-purpose AI plumbing; advertising is one of thousands of domains using them. The ad-specific layer is where the industry's money and politics concentrate. Here is the genius, and the source of the confusion: AdCP is *built on* the substrate it shares with everyone else, while ARTF is built on the *legacy* ad substrate (OpenRTB). Same era. Different foundations.\n\n> **Figure-ready description — \"The Agentic Ad Stack\" (5-layer cake).**\n> Render as five stacked horizontal bands, bottom to top. Band 1 (substrate): **MCP** — \"one agent ↔ its tools/data.\" Band 2 (agent mesh): **A2A** — \"agent ↔ agent.\" Band 3, drawn as a *split band* to make the central thesis visual: left half **AdCP — negotiation layer (outside the auction)**, right half **ARTF — RTB transport layer (inside the auction)**; a vertical dashed divider labeled \"the auction boundary.\" Band 4 (payment): **AP2** and **ACP** side by side. Band 5 (application): \"human/agent intent — ChatGPT, Claude, Gemini, agency planner, publisher console.\" Annotate Band 3's left half \"asynchronous, seconds–days, custom/guaranteed/curated (CTV-native)\" and the right half \"synchronous, ~100 ms, commoditized impression auctions.\" Draw an upward arrow from MCP/A2A into AdCP labeled \"AdCP runs ON MCP + A2A\"; draw an upward arrow from a small \"OpenRTB/AdCOM/VAST\" block into ARTF labeled \"ARTF extends OpenRTB.\" This single exhibit carries the whole document.\n\n---\n\n## 2. What MCP actually is, in plain language\n\n### 2.1 The one-line version and the problem it solved\n\n**MCP (Model Context Protocol)** is an open standard for connecting an AI application to external systems — data sources, tools, and reusable workflows — through one common interface instead of a custom integration for every pairing [1][2]. Anthropic's own analogy: MCP is \"a USB-C port for AI applications\" — one standardized plug instead of a drawer of proprietary cables [1].\n\nThe problem it killed has a name: the **M×N integration problem**. With M AI applications and N data sources or tools, the pre-MCP world required up to M×N bespoke connectors — every app wired by hand to every tool [3]. MCP collapses that to M+N. Each app speaks MCP once, each tool exposes an MCP server once, and any app can use any tool. In advertising, \"N\" is the dozen-plus platforms a media team integrates with; AdCP's own founding narrative describes a team going from \"twelve platforms, twelve integrations\" to \"one protocol\" — the same M×N collapse, applied to ad tech [4].\n\nAnthropic open-sourced MCP on **November 25, 2024**, releasing specification version 2024-11-05, software development kits (SDKs) for Python and TypeScript, and pre-built reference servers for Google Drive, Slack, GitHub, Git, Postgres, and Puppeteer [3][5]. Adoption was fast. OpenAI adopted MCP by March 2025; Google, Microsoft, AWS, and thousands of enterprise teams followed through mid-2025 [3]. This breadth is precisely *why* advertising's agentic standards build on MCP rather than inventing a new substrate: it had already become the default before the ad industry needed one.\n\n### 2.2 The architecture: host, client, server\n\nMCP follows a **client-server architecture** with three named participants [2][6]:\n\n- **MCP Host** — the AI application that coordinates everything (e.g., Claude Desktop, Claude Code, Visual Studio Code, ChatGPT). The host manages the LLM and the conversation.\n- **MCP Client** — a connector component the host instantiates, *one per server*, that maintains a dedicated connection to a single server [6].\n- **MCP Server** — a program that exposes context and capabilities to clients. It can run **locally** (on the same machine, via the stdio transport) or **remotely** (on a vendor's platform, via HTTP) [6].\n\nConcretely: when VS Code connects to the Sentry MCP server, it spins up one client object for that connection; when it also connects to a local filesystem server, it spins up a second. One host, many clients, many servers [6]. In advertising terms, a media-buying agent (host) might run one client to a publisher's inventory server, another to a brand-safety verification server, and another to an identity/signals server — all at once, all over the same protocol.\n\n### 2.3 The two layers inside MCP: data and transport\n\nMCP itself decomposes into two layers [6]:\n\n- **Data layer** — the inner layer. It defines a **JSON-RPC 2.0**-based protocol: the message structure, the lifecycle (initialization, capability negotiation, termination), and the core primitives. JSON-RPC 2.0 is a lightweight, well-established remote-procedure-call format using plain JSON request/response objects with an `id` for correlation and a `method` for the operation [6].\n- **Transport layer** — the outer layer. It defines *how* those JSON-RPC messages actually move and how the connection is authenticated [6].\n\nMCP supports two transports [6]:\n\n- **Stdio (standard input/output)** — for local servers on the same machine; the host launches the server as a subprocess and pipes messages over stdin/stdout. No network, lowest overhead.\n- **Streamable HTTP** — for remote servers; uses HTTP POST for client-to-server messages with optional **Server-Sent Events (SSE)** for streaming. It supports standard HTTP authentication (bearer tokens, API keys, custom headers), and the spec recommends **OAuth** for obtaining tokens [6].\n\nThe clean separation matters. The same JSON-RPC message format works across both transports, so a server author writes the logic once and it runs either locally or remotely. MCP is described as a **stateful protocol** requiring lifecycle management, though a subset can be made stateless over Streamable HTTP [6].\n\n### 2.4 The primitives: tools, resources, prompts — and the client-side three\n\nThe heart of MCP is its **primitives** — the standardized things a server and client can offer each other. Three are server-side [2][6]:\n\n- **Tools** — executable functions an agent can *invoke to take an action* (run a query, call an API, write a file, in ad tech: `create_media_buy`). Each tool advertises a `name`, `title`, `description`, and a JSON-Schema `inputSchema` so the agent knows exactly how to call it [6].\n- **Resources** — read-only *data sources* that provide context (file contents, database records, API responses; in ad tech: a publisher's available product catalog or a brand's identity file). Resources return data; they do not execute side effects [2][6].\n- **Prompts** — reusable *templates and workflows* that structure interactions (system prompts, few-shot examples; in ad tech: a standardized campaign-brief template) [2][6].\n\nThe distinction between tools and resources is load-bearing for understanding agentic advertising. Discovery (asking \"what inventory do you have?\") is resource-like; execution (saying \"buy it\") is tool-like. AdCP's task vocabulary maps onto exactly this split.\n\nDiscovery is dynamic. Each primitive type has methods for listing (`tools/list`) and for retrieval or execution (`tools/call`, `resources/read`), and the protocol supports **notifications** (e.g., `notifications/tools/list_changed`) so a server can tell a client \"my available tools just changed\" without being polled [6]. This lets an agent walk up to an unfamiliar server and *discover* what it can do — the property that makes an open agent ecosystem possible.\n\nMCP also defines **client-side primitives**, which let a server reach back into the host [2][6]:\n\n- **Sampling** (`sampling/createMessage`) — a server can ask the *client's* LLM for a completion, so server authors get language-model power without bundling their own model [6].\n- **Elicitation** (`elicitation/create`) — a server can ask the *user* for more information or confirmation mid-task (critical for human-in-the-loop approval — e.g., \"confirm this $250K CTV buy\") [6].\n- **Logging** — a server can send log messages to the client for debugging/monitoring [6].\n\nThese client primitives are quietly important to advertising's governance story. Human approval (\"Jordan reviews… the agent can't skip this step; it's architectural, not procedural\" [4]) is exactly the confirmation MCP's elicitation primitive is built to carry.\n\n> **Figure-ready description — \"Inside MCP.\"** A boxed \"MCP Host (AI app)\" containing three \"MCP Client\" chips, each with a line to a server: Server A (local, stdio) \"Filesystem\"; Server B (local, stdio) \"Database\"; Server C (remote, Streamable HTTP/OAuth) \"Sentry / publisher inventory.\" Below, two columns: SERVER PRIMITIVES = Tools (act), Resources (read), Prompts (template); CLIENT PRIMITIVES = Sampling (use host LLM), Elicitation (ask the user), Logging. Footer band: \"Data layer = JSON-RPC 2.0 · Transport = stdio (local) or Streamable HTTP+SSE (remote).\"\n\n### 2.5 Why MCP became the default substrate — including for advertising\n\nThree properties explain MCP's gravitational pull, and each one is exactly what an agentic ad stack needs:\n\n1. **It solved M×N first and openly.** By the time advertising needed an agent substrate (late 2025), MCP was already the de facto standard across the AI industry, with cross-vendor support spanning Claude, ChatGPT, VS Code, Cursor, and more [1][3]. Building on it meant inheriting an ecosystem instead of bootstrapping one.\n2. **Dynamic discovery and typed tools.** The `*/list` and JSON-Schema pattern lets an agent discover and safely call tools it has never seen — the precondition for an open marketplace of publisher and brand agents [6].\n3. **Neutral governance.** Anthropic donated MCP to the **Agentic AI Foundation**, a directed fund under the **Linux Foundation**, on **December 9, 2025**; the foundation was co-founded by Anthropic, Block, and OpenAI with support from Google, Microsoft, AWS, Cloudflare, and Bloomberg [7]. A standard no longer owned by one vendor is far easier for a whole industry to adopt — the same vendor-neutrality logic that drove Google to donate A2A to the Linux Foundation [8][9]. MCP's governance is now Foundation-stewarded, so any \"Anthropic controls MCP\" framing in older sources is out of date as of December 9, 2025 [7].\n\n---\n\n## 3. A2A: connecting agents to each other (the complementary layer)\n\n### 3.1 What A2A is and why it is not an MCP rival\n\n**A2A (Agent2Agent)** is an open standard for \"seamless communication and collaboration between AI agents\" — a common language that lets agents built on different frameworks interoperate [10]. Google introduced it in **April 2025** and transferred the protocol, its specification, and SDKs to the **Linux Foundation** in **June 2025**, which stood up the Agent2Agent project for vendor-neutral governance [9][11].\n\nThe relationship to MCP is explicitly **complementary, not competitive** — and the A2A documentation states the division of labor in its own words [10]:\n\n> \"MCP is for agent-to-tool communication\" while \"A2A is for agent-to-agent communication.\" \"Use MCP to equip an individual agent with the specific tools it needs to do its job… Use A2A to let that specialized agent securely collaborate with other agents across different frameworks.\" [10]\n\nThe mnemonic from Google's own framing: *build* with a framework (e.g., ADK), *equip* with MCP (tools), *communicate* with A2A (other agents) [11]. MCP reaches *down*, to tools and data. A2A reaches *across*, to peer agents. They are orthogonal.\n\n### 3.2 A2A's core constructs\n\nA2A's primitives, per the spec and secondary technical coverage (the detailed `.proto`/schema definitions live in the protocol specification itself):\n\n- **Agent Card** — a machine-readable description an agent publishes so others can discover its identity, skills, and endpoints (the A2A analogue of \"here's what I can do\").\n- **Tasks** — the unit of work one agent asks another to perform, with a lifecycle/state.\n- **Messages** and **Artifacts** — the content exchanged and the outputs produced.\n- **Transport** — A2A is built on web standards (JSON-RPC, gRPC, and HTTP variants) [10].\n\nWhy this matters for advertising: an open marketplace where an *advertiser's* agent (one company) negotiates with a *publisher's* agent (a different company) is by definition agent-to-agent, across organizational and framework boundaries — the exact problem A2A exists to solve. That is why AdCP rides on *both* MCP and A2A, choosing the transport to fit the use case (more below).\n\n---\n\n## 4. The ad-specific layer, part one: AdCP as the negotiation/conversation layer\n\n### 4.1 What AdCP is and where it sits\n\n**AdCP (Ad Context Protocol)** is an open agentic-advertising standard that lets AI agents — built by advertisers, publishers, or intermediaries — transact using a common language, across the *full* campaign lifecycle (brief intake → discovery → creative → buy → activation → measurement) and across *every* transaction model (programmatic, direct deals, sponsorships, broadcast, out-of-home), not just programmatic exchange [4][12]. It was launched on **October 15, 2025** by a supply-side coalition; founding members were Optable, PubMatic, Scope3, Swivel, Triton Digital, and Yahoo, with launch participants including Magnite, Kargo, Samba TV, LG Ad Solutions, Raptive, The Weather Company, and others [12][13][14]. The organizing body is **AgenticAdvertising.org** [4]. Scope3 CEO Brian O'Kelley has been its most public champion, comparing AdCP's significance to header bidding [13].\n\nThe defining architectural fact: **AdCP operates as a protocol layer *above* real-time bidding, not within it** [15]. Where OpenRTB runs sub-100-ms impression auctions, AdCP is **asynchronous** — a response can take \"seconds or days,\" accommodating human-in-the-loop approvals while agents negotiate complex deal terms [16]. AdCP has been described as \"OpenRTB for the AI era,\" but the more precise statement is that it replaces, or precedes, the auction with a *conversation*: \"rather than publishers auctioning inventory to buyers in real-time, advertiser agents communicate their needs directly to publisher agents, which respond with relevant inventory and capabilities\" [12][16]. The auction becomes a dialogue.\n\n### 4.2 AdCP is built on MCP and A2A — and uses both transports\n\nAdCP does not reinvent the substrate; it rides on it. The protocol explicitly uses **two transports** for the *same* tasks and schemas [4]:\n\n> \"These agents communicate over two transport protocols: **MCP** (for AI assistants calling tools) and **A2A** (for agent-to-agent collaboration). Same tasks, same schemas, different transport.\" [4]\n\nThis is the cleanest illustration of the layering thesis there is. AdCP is an *ad-domain vocabulary* — the task names, the JSON schemas, the seller-agent model — layered on top of the *general substrate* (MCP for tool-calling, A2A for agent-to-agent). When a human assistant calls AdCP tools, it goes over MCP; when two autonomous agents transact, it goes over A2A. The payload is identical [4].\n\n### 4.3 The seller-agent model and the \"bypass-the-DSP\" implication\n\nAdCP does not assume one monolithic agent. It defines *specialized* agents [4]:\n\n- **Media-buying agents** discover inventory and execute campaigns.\n- **Creative agents** generate and adapt creative across formats.\n- **Signals agents** find and activate audiences.\n- **Governance agents** enforce brand safety and compliance.\n- **Orchestrators** coordinate workflow and manage human approvals.\n\nOn the sell side, publishers and platforms expose their capabilities as **AdCP agents** — machine-readable service endpoints — declared via discovery files: **`adagents.json`** for publishers (which tasks the seller supports) and **`brand.json`** for advertisers/operators (brand identity: colors, logos, tone, used by creative agents) [4][17]. A **seller agent** (also \"sales agent\") is the publisher-side agent that interprets a buyer's brief against its own inventory and negotiates the deal. Swivel's Seller Agent, for example, \"logs every conversational element with buyer agents, along with all objects created in the publisher's ad server\" [13].\n\nThe structural threat is explicit. If a buyer's agent can talk *directly* to a publisher's seller agent and transact a custom or guaranteed package, the role of the traditional intermediary changes. AdExchanger frames it carefully: agent-to-agent campaign planning is a \"direct\" campaign that may include \"custom components that aren't available programmatically, or offline inventory,\" and could \"remove some unnecessary intermediary layers\" rather than eliminate them entirely [18]. This \"bypass-the-DSP\" tension is taken up later, in the chapter on the standards war; here the point is purely architectural. *Because* AdCP lives outside the auction, it can route around the parts of the stack — the DSP/SSP bid path — that the auction requires. (The deeper margin and competitive analysis comes later, in the chapters on AdCP itself and on the standards war.)\n\n### 4.4 AdCP's sub-protocols (the task vocabulary)\n\nAdCP's initial release shipped protocols for **Audience Activation (Signals)**, **Curation**, and **Media Buy**, built on MCP [12][14]. The current documentation organizes functionality into domain areas, each a set of typed tasks [4][19]:\n\n- **Media Buy** — `get_products` (inventory discovery from a natural-language brief), `create_media_buy` (campaign execution), `get_media_buy_delivery` (delivery/performance tracking) [19].\n- **Creative** — `list_creative_formats` (format discovery), `build_creative` (asset generation), `sync_creatives` (distribution) [4].\n- **Signals / Audience Activation** — `get_signals` (data discovery), `sync_audiences` (audience synchronization), `activate_sig
