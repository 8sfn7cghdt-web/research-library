 reports IAS Agent will be \"demonstrated at CES\" and roll out globally in Q1 2026 \"at no additional charge,\" built against \"explainable AI\" with plain-language explanations users can \"hover over,\" quoting Chief Product Officer Srishti Gupta (\"a marketer's advertising compass\") and Publicis Media's Jeff Omoregie [6]. IAS's \"Signals of Safety\" post (Feb 25, 2026) frames brand integrity for an AI-driven world around MFA avoidance and \"verified human-created / AI-audited\" labeling rather than agent-traffic measurement per se [7] — i.e., IAS's emphasis to date is brand-safety/MFA and an assistant agent, **not** a DV-style declared-agent *measurement* product. That asymmetry is itself worth stating: of the three, DoubleVerify is furthest into measuring valid agent traffic as a countable impression.\n\n---\n\n### DV Neura: the verification vendor itself becomes an MCP-speaking agentic actor\n\nOn June 17, 2026, DoubleVerify launched **DV Neura**, a cognitive AI engine across its DV MAP platform organized around four pillars (Media Intelligence, Adaptive Performance, Open Connectivity, Agentic Execution), whose **Insight Agent** is available now via Anthropic's **Model Context Protocol** and Claude (with Google Gemini and Microsoft Copilot integrations expected) and whose **Activation Agent** — autonomous campaign execution within advertiser-defined guardrails — is expected in Q3 2026.\n\nDoubleVerify's investor-relations release and ppc.land's June 17, 2026 write-up describe DV Neura's four pillars and confirm \"[t]he DV Neura Insight Agent, available today via MCP and Anthropic Claude integration,\" with \"additional integrations with Google Gemini, Microsoft Copilot, and other leading AI assistants… expected to follow,\" and the Activation Agent (Q3 2026) executing \"approved campaign changes within advertiser-defined guardrails\" [8][9]. The release cites a \"nearly 300-fold increase in content classification output since the start of the year,\" over 500 million impressions monitored or blocked across AI-slop/low-quality generative environments since January 2026, and DV Scibids AI optimizing 25 billion impressions monthly [8][9]. This matters for the substrate thread running through these pages: the *verification* vendor is now a first-class MCP node, not just a passive filter — measurement is wiring into the same agentic plumbing the execution protocols use.\n\n---\n\n### HUMAN Security is an agentic actor, not a bidstream footnote: \"Agentic Trust\" and a Forrester Wave leadership\n\nHUMAN Security — elsewhere cited only for bidstream/supply-path analysis — has repositioned around \"Agentic Trust,\" shipped AgenticTrust and HUMAN Sightline, was named a Leader in the Forrester Wave for Bot and Agent Trust Management Software (Q2 2026), and published a 2026 benchmark (April 9, 2026) reporting that automated traffic now grows ~8x faster than human traffic, with agentic-AI traffic up 7,851% year-over-year and AI-driven traffic up 187% over 2025.\n\nHUMAN's newsroom announces it was \"Named a Leader in The Forrester Wave: Bot and Agent Trust Management Software, Q2 2026,\" receiving highest-possible scores across nine criteria including \"AI Agent Trust Management\" and \"Marketing Analytics Assurance,\" and describes itself as \"the global leader in Agentic Trust… the emerging discipline that informs and governs how humans, bots, and AI agents operate online\" [10]. The \"2026 State of AI Traffic & Cyberthreat Benchmark Report\" (released April 9, 2026) reports automated traffic growing \"8 times faster than human traffic,\" AI-driven traffic up 187% Jan–Dec 2025, agentic-AI traffic up 7,851% YoY, over one quadrillion digital interactions analyzed in 2025, and 95% of AI-driven automation concentrated in three verticals — \"retail & e-commerce, streaming & media, and travel & hospitality\" — the last of which puts CTV/streaming squarely in frame [11]. HUMAN frames the work as moving \"beyond bot mitigation toward a new trust layer that distinguishes beneficial AI agents from malicious activity\" [11] — the same inversion described above, from a security vendor's seat. The growth statistics are HUMAN's own, vendor-measured rather than independently audited; the Forrester Wave leadership is independently attributable to Forrester.\n\n---\n\n### The CTV angle: Netflix's verification guarantee runs through DV and IAS, and agent traffic is the open question on top of it\n\nNetflix's advertising measurement is underwritten by DoubleVerify and IAS — the partnership went live March 20, 2023 (viewability + invalid-traffic verification across Netflix's ad markets and devices, including CTV) and remains the verification backbone in 2026 — which means the agent-traffic measurement problem now lands directly on the same CTV guarantee infrastructure, even though no sourced 2026 announcement yet describes a Netflix-specific *agentic*-traffic guarantee.\n\nMarketing Dive (Chris Kelly, March 20, 2023) reports DoubleVerify making its measurement solutions available to all Netflix advertisers and IAS launching Viewability and Invalid Traffic verification, with DV providing \"fraud protection identifying invalid traffic from 'hijacked devices and bot manipulation'\" and viewability authentication, and DV claiming to be \"the only verification company that covers all of the top ad-supported CTV providers\" [12]. Netflix's own description-of-methodology page (2026) states the platform \"applies internal safeguards and checks to identify if logged in users are scripted or robotic,\" keeping IVT \"inherently low\" [13]. The synthesis worth drawing out: CTV-heavy brands narrow verification to a short list — HUMAN, DV, IAS (the same names on ARTF's CTV-heavy backer roster, where HUMAN Security sits) — and on premium logged-in CTV like Netflix, agent traffic is *structurally less* of a problem than on the open web (logged-in households, server-side ad insertion, low scriptable surface). But shoppable CTV and agent-mediated buying reopen it: an agent transacting on a \"brand-lift outcome\" still raises the question of *what context the impression ran in* when no human verified it. The missing dated Netflix *agentic*-guarantee announcement is worth flagging explicitly rather than inventing one.\n\n---\n\n### This *is* the answer to Goel's \"zero address measurement\" — with a caveat\n\nThe vendor layer directly answers Goel's charge that \"zero protocols address measurement\": the protocols (AdCP, ARTF/AAMP) do not, but the verification vendors do — measurement in the agentic era is arriving as a *vendor product category* layered on top of the execution protocols, not as a clause inside them. The caveat Goel's framing survives: closing the real-time *outcome*-optimization loop (an agent measuring its own results in-auction) is still nascent — DV Neura's autonomous Activation Agent is only \"expected Q3 2026.\"\n\nGoel's June 3, 2026 Substack argues \"[t]hree protocols address execution. Zero address measurement,\" and that 2026 ad-tech \"handles [discovery/planning/execution] well and installs a human at the [decision] step\" — assisted automation, not agency [14]. The vendor evidence shows measurement *is* being addressed — but outside the protocol specs, by DV/IAS/HUMAN, and as of mid-2026 still largely at the *insight/measurement* stage (DV Neura Insight Agent, available now) rather than the *autonomous-decision* stage (DV Neura Activation Agent, Q3 2026; IAS Agent recommends, human applies). So Goel is wrong that nobody addresses measurement and right that the closed real-time feedback loop genuine agency requires is not yet shipping. The honest synthesis: the measurement layer exists and is dated, but it sits *beside* the protocols, and the autonomous loop is months out, not done.\n\n---\n\n## Narrative\n\n### The hole the story keeps pointing at\n\nFour times the agentic-advertising story walks up to the same edge and stops. Amit Goel gets the last word on the IAB's ARTF: the framework \"solves the wrong problem,\" shaving milliseconds off a round trip while \"the unsolved problems are measurement, accountability, and identity.\" His phrase — \"Three protocols address execution. Zero address measurement\" — gets quoted as if it settles the matter. The map of agentic commerce reaches for the Brand Safety Institute's \"agentic traffic\" as a new measurement category but cites only the abstract idea. The detailed account of CTV's agents and identity stack leaves verification implicit, a thread for later. HUMAN Security — a company whose entire 2026 identity is agent trust — turns up purely as a source on bidstream bloat.\n\nThe trouble is not that any of this is wrong. It is that the story stops at the protocol layer and never looks at the vendor layer now shipping the answer. By mid-2026 the measurement problem has a product category, three named incumbents, and a string of dated releases. What follows documents that layer and states plainly the shift the rest of the account has been circling.\n\n### The inversion\n\nFor fifteen years, verification did one thing: it kept bots out. General Invalid Traffic (the crude, declared stuff — known crawlers, data-center IPs) and Sophisticated Invalid Traffic (the malicious, evasive stuff that launders fraud through real-looking impressions) were both, in the end, *excluded*. A bot was a bot. An impression served to a non-human was waste at best and fraud at worst. The advertiser paid for human eyeballs; the vendor's job was to certify the eyeballs were human.\n\nAgentic advertising breaks that logic. A shopping agent — Perplexity's Comet, OpenAI's Atlas, a Claude-driven assistant — browses for a human and engages an ad while running the human's errand. Is that impression waste? In an agent-to-agent (A2A) marketing world, the advertiser may *want* to reach that agent, because the agent is the new gatekeeper to the human's wallet. The bot is no longer the enemy. Sometimes the bot is the customer's proxy.\n\nDoubleVerify productized the inversion first. On November 4, 2025 it announced DV AI Verification, whose Agent ID Measurement is, in DV's own words, an industry-first: it does not just filter agents, it *measures* engagement by named ones. As MediaPost's Laurie Sullivan put it, \"[u]nlike previous generations of brand-safety services used to exclude bots by filtering non-human traffic deemed advertising fraud,\" the service is \"designed to exclude invalid agents, but include valid ones deemed a proxy for human consumers that the brand is seeking to reach.\" CEO Mark Zagorski's framing — \"declared agents powered by platforms such as ChatGPT, Claude and Perplexity\" on one side, \"undeclared, potentially malicious AI bots\" on the other — is the new taxonomy in a sentence. The axis is no longer human vs. bot. It is *declared/valid agent* vs. *undeclared/invalid bot*.\n\nThis is the redefinition worth stating outright — the concrete content behind the Brand Safety Institute's \"agentic traffic\" category that is usually cited only in the abstract. The vendors have made it real.\n\n### The scale, and why buyers get nervous\n\nThe redefinition is not academic. DoubleVerify's data, reported by Digiday in November 2025, shows general invalid traffic jumped about 86% in the second half of 2024, with monthly volumes passing two billion ad requests from such traffic for the first time — AI crawlers and scrapers the primary driver. Then comes the operational catch that makes this urgent rather than theoretical: as of late 2025, *neither DoubleVerify nor IAS split out agentic visitors*. They sit inside the GIVT bucket. IAS said as much: \"We report these as General Invalid Traffic (GIVT), not fraud.\"\n\nThat ambiguity has a price. Digiday documents a mid-sized buyer halting spend on Salon after an IVT alert flagged a spike in agentic traffic. The buyer could not tell valid agents from invalid ones, so it pulled the budget. This is the measurement problem's business edge. When you cannot separate the agent that is the customer's proxy from the bot that is fraud, you treat both as fraud, and the publisher loses real revenue on real, agent-mediated demand. The whole point of Agent ID Measurement is to give buyers a reason not to pull the budget — to let them *count* the valid agent rather than write it off.\n\n### Where IAS and HUMAN sit\n\nIAS's posture is adjacent but distinct. It separates legitimate bots — including LLM bots tracked on the IAB's Bot User Agent List — as benign GIVT from malicious SIVT, and in late 2025 layered IAS Agent on top: an \"explainable-AI\" assistant demoed at CES 2026 and rolled out globally in Q1 2026 at no extra cost, which the Chief Product Officer calls \"a marketer's advertising compass.\" But IAS's public emphasis through early 2026 — its \"Signals of Safety\" framing (Feb 25, 2026) — leans toward MFA avoidance and \"verified human-created / AI-audited\" content labeling, not a DoubleVerify-style declared-agent *measurement* product. Of the three, DV is furthest into treating a valid agent's engagement as a countable impression; IAS is furthest into an assistant that helps humans steer. The gap between \"measure the agent\" and \"an agent that helps you\" is worth holding onto.\n\nHUMAN Security is the biggest under-read of all. It usually surfaces only for supply-path and bidstream analysis. By 2026 HUMAN has rebuilt its identity around \"Agentic Trust,\" shipped AgenticTrust and Sightline, and earned a Leader spot in the Forrester Wave for Bot and Agent Trust Management Software, Q2 2026 — a category that did not exist a few years ago, with criteria like \"AI Agent Trust Management\" and \"Marketing Analytics Assurance.\" Its April 2026 benchmark reports automated traffic growing roughly eight times faster than human traffic, AI-driven traffic up 187% across 2025, and agentic-AI traffic up an eye-watering 7,851% year-over-year — vendor-measured figures, flagged as such, but directionally consistent with DV's GIVT surge. HUMAN's own framing is the inversion again, from a security seat: move \"beyond bot mitigation toward a new trust layer that distinguishes beneficial AI agents from malicious activity.\" And 95% of that AI automation, HUMAN says, concentrates in three verticals — retail & e-commerce, streaming & media, travel & hospitality — the second of which lands squarely on CTV.\n\n### The CTV bridge\n\nHere is where the CTV lean pays off. CTV-heavy advertisers narrow verification to a short roster — HUMAN, DoubleVerify, IAS — the same names on ARTF's CTV-weighted backer list (HUMAN Security is a named ARTF contributor). On premium, logged-in CTV, exposure to bad agent traffic runs lower than on the open web: households are authenticated, ads are server-side inserted, the scriptable surface is small. Netflix's own methodology leans on exactly this, calling its invalid-traffic risk \"inherently low.\"\n\nBut Netflix does not self-certify alone. Its advertising guarantee runs through DoubleVerify and IAS — a partnership live since March 20, 2023, covering viewability and invalid-traffic verification across its ad markets and devices, with DV claiming coverage of \"all of the top ad-supported CTV providers.\" That is the load-bearing connection: the agent-traffic measurement question now lands on the *same* infrastructure that underwrites CTV's media-quality guarantees. When shoppable CTV and agent-mediated buying put an agent between the viewer and the cart, and the campaign transacts on a \"brand-lift outcome,\" the earlier question returns with teeth — *what context did the impression actually run in, and was the engagement a human's or an agent's?* — and DV and IAS have to answer it inside the guarantee.\n\nHere is what the record does not show: no dated 2026 announcement describes a Netflix-specific *agentic*-traffic guarantee. The DV/IAS backbone is real and current; an agentic extension of it on Netflix is, as of mid-2026, an inference and an open question, not a shipped fact.\n\n### Answering Goel\n\nSo does the vendor layer answer Goel? Mostly yes, with one honest concession. Goel's \"zero protocols address measurement\" is true *about the protocols* — AdCP and ARTF/AAMP genuinely do not specify measurement (AdCP also leaves payment infrastructure unaddressed; the same holds for outcome measurement). But measurement is being addressed — outside the specs, by the verification vendors, as a product category bolted on top. DV Neura's June 17, 2026 launch makes the point structurally: the verification vendor is now itself an MCP-speaking agentic node, its Insight Agent reachable today via Anthropic's Claude, with Gemini and Copilot to follow. Measurement is being wired into the very substrate — MCP — the execution protocols ride.\n\nThe concession Goel keeps: the *closed real-time outcome loop* that genuine agency requires — an agent measuring its own results in-auction and adjusting on its own — is not yet shipping. DV Neura's Insight Agent (read-only, available now) tells a human what happened; its Activation Agent (autonomous changes within guardrails) is only \"expected Q3 2026.\" IAS Agent recommends; a human applies. So the fair verdict is narrower than either Goel's line or the vendors' marketing: **measurement in the agentic era exists, is dated, and lives in the vendor layer beside the protocols — but the autonomous feedback loop that would make it true agency rather than assisted automation is months away, not done.** That is the missing fourth pillar of the agentic stack — discovery, planning, execution, and now measurement — half-built, and visibly under construction.\n\n---\n\n## Open Questions\n\n1. **Will measurement migrate into the protocols, or stay a vendor layer?** As of mid-2026 measurement is a bolt-on (DV/IAS/HUMAN) on top of AdCP/ARTF. Does AAMP 3.0 or any IAB initiative pull real-time outcome measurement *into* the spec, or do the vendors permanently own it as a product category?\n2. **Does a shared \"valid agent\" standard emerge, or three proprietary taxonomies?** DV's Agent ID, IAS's IAB-bot-list approach, and HUMAN's AgenticTrust are converging on the same valid-vs-invalid-agent axis but with different definitions. Without a shared registry of \"declared, valid\" agents, the same agent could be counted by one vendor and excluded by another. (The IAB's Agent Registry is the obvious candidate to standardize this — does it?)\n3. **Is there a Netflix-specific agentic-traffic guarantee?** The DV/IAS backbone is real; an agentic extension on Netflix specifically is unconfirmed. Watch for a dated 2026/2027 announcement.\n4. **How are the vendor-measured growth figures audited?** DV's +86% GIVT, HUMAN's 7,851% agentic-traffic growth, the 187% AI-traffic figure are all vendor-origin. Is any independent body (MRC, an academic audit) verifying the magnitude, or only the methodology?\n5. **What happens to verification CPMs and the take-rate?** If advertisers now *pay to reach* valid agents (rather than only paying to exclude bots), does measurement become a new line item that adds to — or, by reducing waste, subtracts from — the \"ad-tech tax\"?\n6. **MRC accreditation in the agentic era.** Netflix's MRC status was \"under review\" in early 2026; how does an accreditation regime built for human impressions adapt to countable valid-agent impressions?\n\n---\n\n## Sources\n\n1. DoubleVerify, \"DoubleVerify Introduces DV AI Verification™ Offering to Identify and Manage Agent Interactions and Avoid AI Slop,\" newsroom / press release, Nov 4, 2025. https://doubleverify.com/company/newsroom/doubleverify-introduces-dv-ai-verification-offering-to-identify-and-manage-agent-interactions-and-avoid-ai-slop (accessed 2026-06-20). DV AI Verification, Agent ID Measurement (\"industry-first\"), three analytics categories, named agents (ChatGPT/Claude/Perplexity/Atlas/Comet), Zagorski quote, GA \"later this year / more in 2026,\" AI SlopStopper open web + social.\n2. ExchangeWire, \"DoubleVerify Introduces DV AI Verification™ to Identify & Manage Agent Interactions & Avoid AI Slop,\" Nov 4, 2025. https://www.exchangewire.com/blog/2025/11/04/doubleverify-introduces-dv-ai-verification-to-identify-manage-agent-interactions-avoid-ai-slop/ (accessed 2026-06-20). Independent corroboration of product, named agents, three categories; AI SlopStopper open web on 30+ buying platforms, social \"early 2026.\"\n3. Laurie Sullivan, \"In An Industry First, DoubleVerify Will Validate Non-Human AI Agent Traffic,\" MediaPost (MediaDailyNews), Nov 4, 2025. https://www.mediapost.com/publications/article/410408/in-an-industry-first-doubleverify-will-validate-n.html (accessed 2026-06-20). The cleanest articulation of the inversion: \"exclude invalid agents, but include valid ones deemed a proxy for human consumers\"; A2A framing; Zagorski on engagement coming from non-human sources.\n4. Jessica Davies, \"When bots look like buyers: agentic traffic causing new publisher headaches,\" Digiday, Nov 12, 2025. https://digiday.com/media/when-bots-look-like-buyers-agentic-traffic-causing-new-publisher-headaches/ (accessed 2026-06-20). GIVT +86% H2 2024, >2B ad requests/month first-ever; DV and IAS do NOT split out agentic visitors (count within GIVT); IAS \"GIVT, not fraud\" quote; Salon spend-halt anecdote.\n5. Integral Ad Science (Insider / trade synthesis), IAS fraud-detection and bot-classification posture: GIVT vs. SIVT, LLM bots tracked on the IAB \"Bot User Agent List.\" https://integralads.com/insider/update-ias-multi-tiered-approach-to-combatting-ad-fraud/ (accessed 2026-06-20). IAS's GIVT/SIVT taxonomy and IAB-list reliance.\n6. ITBrief Asia, \"Integral Ad Science unveils IAS Agent AI assistant,\" Dec 19, 2025. https://itbrief.asia/story/integral-ad-science-unveils-ias-agent-ai-assistant (accessed 2026-06-20). IAS Agent: CES demo, global Q1 2026 rollout at no charge, \"explainable AI,\" Srishti Gupta + Jeff Omoregie (Publicis Media) quotes.\n7. Integral Ad Science, \"Signals of Safety: Brand Integrity for the AI-Driven World,\" IAS Insider, Feb 25, 2026. https://integralads.com/insider/signals-of-safety-brand-integrity-for-the-ai-driven-world/ (accessed 2026-06-20). IAS's AI-era brand-safety emphasis: MFA avoidance, \"verified human-created / AI-audited\" labeling (56% consumer concern, 68% labeling stat) — note this is brand-safety framing, not declared-agent measurement.\n8. DoubleVerify, \"DoubleVerify Introduces DV Neura, the Dynamic AI Engine Powering the Future of Media Quality and Effectiveness,\" IR newsroom / press release, June 17, 2026. https://ir.doubleverify.com/news-events/press-releases/press-releases-details/2026/DoubleVerify-Introduces-DV-Neura-the-Dynamic-AI-Engine-Powering-the-Future-of-Media-Quality-and-Effectiveness/default.aspx (accessed 2026-06-20). DV Neura, DV MAP, Insight Agent (MCP + Anthropic Claude, now), Activation Agent (Q3 2026), nearly 300x classification, 500M+ AI-slop impressions blocked since Jan 2026, Scibids 25B/month, Zagorski quote.\n9. ppc.land, \"DoubleVerify launches DV Neura, its AI engine for agentic ad campaigns,\" June 17, 2026. https://ppc.land/doubleverify-launches-dv-neura-its-ai-engine-for-agentic-ad-campaigns/ (accessed 2026-06-20). Independent corroboration of DV Neura four pillars (Media Intelligence, Adaptive Performance, Open Connectivity, Agentic Execution), MCP/Claude availability, Gemini/Copilot expected, Q3 Activation Agent.\n10. HUMAN Security, \"HUMAN Named a Leader in The Forrester Wave™: Bot and Agent Trust Management Software, Q2 2026,\" newsroom, 2026. https://www.humansecurity.com/newsroom/forrester-wave-bot-agent-trust-management-software-q2-2026/ (accessed 2026-06-20). \"Agentic Trust\" framing; nine highest-possible-score criteria incl. AI Agent Trust Management and Marketing Analytics Assurance; Human Defense Platform / Sightline / AgenticTrust.\n11. HUMAN Security, \"2026 State of AI Traffic & Cyberthreat Benchmark Report Signals a New Internet Era: Automation Growth Now Outpaces Humans,\" newsroom, released April 9, 2026 (syndicated via Yahoo Finance). https://www.humansecurity.com/newsroom/2026-state-of-ai-traffic-cyberthreat-benchmark-report/ ; https://finance.yahoo.com/sectors/technology/articles/human-security-2026-state-ai-080000304.html (accessed 2026-06-20). **Vendor-measured statistics, not independently audited.** Automation 8x faster than human; AI-driven traffic +187% (2025); agentic-AI +7,851% YoY; >1 quadrillion interactions; 95% of AI automation in retail/e-commerce, streaming/media, travel; \"beyond bot mitigation toward a trust layer that distinguishes beneficial AI agents from malicious activity.\"\n12. Chris Kelly, \"Netflix fortifies advertising guarantees with help from DoubleVerify, IAS,\" Marketing Dive, March 20, 2023. https://www.marketingdive.com/news/netflix-doubleverify-ias-fraud-protection-ad-supported-tier/645411/ (accessed 2026-06-20). DV measurement available to all Netflix advertisers; IAS Viewability + IVT verification live; DV \"only verification company that covers all of the top ad-supported CTV providers\"; fraud protection on \"hijacked devices and bot manipulation.\" (Note: 2023 dating — the agentic interaction remains an open question, not a 2026 announcement.)\n13. Netflix Advertising, \"Netflix Description of Methodology,\" advertising.netflix.com, 2026. https://advertising.netflix.com/en-us/article/netflix-description-of-methodology (accessed 2026-06-20). **Platform self-description.** Internal safeguards identify scripted/robotic logged-in users; IVT risk \"inherently low.\"\n14. Amit Goel (ad-tech analyst), \"The Protocols Are Being Debated. The Agents Haven't Arrived Yet…,\" bidstream.amitgoel.me (Substack), June 3, 2026. https://bidstream.amitgoel.me/p/the-protocols-are-being-debated-the (accessed 2026-06-19). \"Three protocols address execution. Zero address measurement\"; assisted-automation vs. agency."}, {"order": 10, "file": "10_Gap_ModelLayer_Chokepoint_AgentBlocking.md", "title": "The Model-Layer Chokepoint and the Agent-Blocking Counter-Tradition", "summary": "", "body": "# The Model-Layer Chokepoint and the Agent-Blocking Counter-Tradition\n\n## Bottom Line\n\nThe spine of this account is open standards: AdCP vs. ARTF, MCP as neutral substrate, agents shopping freely *across* platforms. Two facts that spine only gestures at threaten it. These pages develop them.\n\n**First, the foundation-model layer may be the real power center, making the AdCP-vs-ARTF fight a sideshow.** The argument — attributed to Brian O'Kelley and which McKinsey states in its own institutional voice (June 16, 2026) — is that \"agents are the gatekeepers of consumer intent,\" so success \"is no longer just about securing data-driven impressions\" but \"about being surfaced, recommended, and selected by the systems shaping what consumers see and buy\" [1]. If the model inside the agent (Claude vs. ChatGPT vs. Gemini) decides which products surface, then whoever owns that model owns discovery — and the protocol question of *how* an ad gets bought is subordinate to the model question of *whether the brand gets selected at all*. This is not abstract. OpenAI began testing ads in ChatGPT's Free and Go tiers (announced January 16, 2026; rollout reported February 9), under an \"answer independence\" principle — ads do not influence answers, advertisers cannot pay to change what ChatGPT says, conversation content is not shared with advertisers [2][3]. Google went further, fusing ads *into* AI answers at Google Marketing Live 2026 (May 21): Direct Offers (piloted from January 11, 2026 at NRF), Conversational Discovery ads, and Highlighted Answers inside AI Mode, with ads already appearing in roughly a quarter of AI Mode results and AI Overviews touching a majority of searches [4][5][6]. The inversion rarely named: **win the agent's selection, not the human's attention.**\n\n**Second — and this is the genuine counter-tradition — the walled gardens are not only building inward-facing MCP servers. They are AFFIRMATIVELY BLOCKING rival agents by legal and technical means.** Amazon sent Perplexity a cease-and-desist on October 31, 2025, sued the same day, and won a preliminary injunction on March 9, 2026: Judge Maxine Chesney held that Comet \"accessed Amazon accounts with the Amazon user's permission, but without authorization by Amazon\" — establishing that **user consent and platform authorization are legally separate** [7][8][9]. Amazon also added ChatGPT-User and OAI-SearchBot (and ~50 AI user-agents in total) to its robots.txt and, via a Business Solutions Agreement update effective March 4, 2026, now requires AI agents to identify themselves [10][11][12]. The result is an **\"authorization gap\"**: a brand's Shopify listings can surface in ChatGPT while its Amazon listings cannot — a structural advantage that has nothing to do with which ad-buying protocol wins [13]. Walmart chose the mirror-image strategy, embedding its own Sparky agent *into* ChatGPT and Gemini via UCP rather than blocking them [13][14][15].\n\n**The debate that follows, stated plainly: is the agentic future *open* (any agent shops across any platform) or a *new gatekeeper war* (platforms legally and technically bar rival agents and route the buy through their own model and their own garden)?** The honest answer in mid-2026 is *both at once, by channel*. The open-standards stack (AdCP/ARTF/MCP) is real for the ~$400B non-garden programmatic market. But the gardens are routing around it — Amazon by blocking, Walmart by selectively inviting — and a model layer is forming above all of it. **For CTV the read is sharpest: Amazon Prime Video + Rufus is the in-garden path that needs no neutral protocol at all** — shoppable carousel ads, add-to-cart from the remote, ACR on Fire TV, and a discovery agent (Rufus) that resolves identity and intent inside the wall [16][17][18]. The conclusion: **the foundation-model layer is becoming its own power center, and the open-vs-gatekeeper question is now at least as important as AdCP-vs-ARTF.** One caveat carries the weight. The model-layer ad surfaces are *pilots* (ChatGPT ads testing; Google's Direct Offers a pilot), and the agentic buying volume remains small. This is a power center forming, not a power center arrived.\n\n---\n\n## 1. The Model-Layer Chokepoint Thesis — Stated at Full Strength\n\nThe conventional view treats MCP as a neutral substrate and the contest as AdCP vs. ARTF over the *transaction*. But the decisive contest may sit one layer up — *which foundation model sits inside the agent* — and matter more than either. This section makes that case at full strength.\n\n### 1.1 The thesis, in its strongest form\n\n**Claim 10.1.** Whoever owns the agent's foundation model owns the **discovery chokepoint**. The model decides which brands and products surface to a user (or to a downstream buyer agent), and discovery — not the bid mechanics — is where the consumer decision is actually made. McKinsey states the underlying shift in its own institutional voice: \"Success for a marketer is no longer just about securing data-driven impressions with brand-controlled creative. Increasingly, it is about being surfaced, recommended, and selected by the systems shaping what consumers see and buy,\" and frames the strategic question as understanding \"what business models they can pioneer in a world where agents are the gatekeepers of consumer intent\" [1].\n\nMcKinsey's \"The agentic advertising economy: From attention to action\" (June 16, 2026) draws on proprietary research, a survey of advertising decision-makers, and expert interviews; it reports that more than 50% of advertisers believe AI has reshaped discovery and consideration, and emphasizes \"the critical role of foundation models in the agentic era,\" with AI agents \"powered by foundation models\" controlling \"which brands and products consumers discover and ultimately select\" [1]. The thesis is an analytical position, not a settled fact; the supporting facts in §1.3–1.4 are established.\n\n### 1.2 The O'Kelley framing — attributed, with an honesty flag\n\nBrian O'Kelley (Scope3 CEO; AppNexus founder; AdCP's operational lead) is associated with the argument that \"AI and the media industry are soon going to be indistinguishable; the biggest AI players monetize through advertising.\" The implication: the foundation-model owners (OpenAI, Google, and Anthropic, which owns MCP itself) will be the dominant ad-sellers, not the protocol bodies.\n\nA note on attribution. This is not verifiable as a verbatim O'Kelley quote in the indexed trade-press or primary record as of mid-2026. His documented public arguments are about *disintermediation* (AI removing programmatic's middlemen so advertisers buy direct from media owners) and about agentic advertising becoming \"the dominant paradigm\" — \"too big, too important, and too obvious not to become the dominant paradigm\" [19][20][21]. The specific \"indistinguishable / monetize through advertising\" framing is *consistent with* his disintermediation thesis and with the McLuhan-flavored \"the medium is the advertising\" logic, but it is best read as an attributed paraphrase rather than a confirmed quote. The substantive thesis does not depend on the attribution. It stands on McKinsey's institutional statement [1] plus the dated ad-surface facts below.\n\n**Claim 10.2.** The structural logic holds regardless of attribution: the foundation-model owners are building advertising businesses on the very surface where agentic discovery happens. OpenAI is testing ads inside ChatGPT [2][3]; Google is fusing ads into Gemini/AI Mode answers [4][5][6]; Anthropic owns MCP, the substrate every camp builds on [22]. If the model is where discovery occurs, and the model owner monetizes that discovery through advertising, then the model owner — not the AdCP working group, not the IAB Tech Lab — sets the terms of the most valuable ad surface. This rests on the three dated facts in §1.3–1.4, each established; the synthesis into \"model layer is the chokepoint\" is an inference drawn from them.\n\n### 1.3 OpenAI's ChatGPT ad surface — the discovery layer monetizes\n\n**Claim 10.3.** OpenAI announced on **January 16, 2026** that it would begin testing advertisements for U.S. users on its **Free tier and the low-cost ChatGPT Go tier** (~$8/month), with the rollout reported on **February 9, 2026**; Plus, Pro, Business, Enterprise, and Education subscribers do not see ads under the stated policy [2][3]. The ads are governed by an **\"answer independence\"** principle: per OpenAI, ads \"won't influence the chatbot's answers,\" advertisers \"cannot pay to influence what ChatGPT actually says,\" and OpenAI \"will not provide advertisers with content from ChatGPT conversations\"; ads are \"clearly labeled and separated from organic responses,\" placed at the bottom of relevant responses and matched to the conversation's context rather than to keywords [2][3].\n\nThis comes from OpenAI's own \"Testing ads in ChatGPT\" announcement [2], corroborated by Axios (Feb 9, 2026) and MacRumors (Feb 9, 2026) [3]. One caveat: this is a *test* in *two tiers*, announced and rolled out within the last five months; \"testing\" should be read as a snapshot of February 2026, not a guarantee that ChatGPT ads are generally available or expanded beyond Free/Go.\n\n**So what for the chokepoint:** the answer-independence wall is precisely the seam where the model-layer-vs-protocol question lives. OpenAI monetizes the *surface around* the answer while swearing off monetizing the *answer itself*. But the answer is the discovery event. If the model selects products in the answer — as Google's Conversational Discovery ads explicitly do (§1.4) — the firewall between \"selection\" and \"advertising\" is exactly what is contested. For now, OpenAI keeps them separate. That is a policy, not a law of nature.\n\n### 1.4 Google's Gemini / AI Mode ad fusion — the firewall is thinner\n\n**Claim 10.4.** Google has moved further than OpenAI by fusing ads *into* AI-generated answers. At **Google Marketing Live 2026 (May 21, 2026)** it detailed: **Conversational Discovery ads** (Gemini generates a customized ad creative from a business whose product solves the user's question); **Highlighted Answers** (an advertiser can appear as a featured recommendation, \"only if the recommendation has high quality and is relevant\"); and the expansion of **Direct Offers** — piloted from **January 11, 2026** at NRF alongside the Universal Commerce Protocol — letting retailers surface discounts/coupons directly in AI Mode, with Gemini matching or bundling the most relevant offers [4][5][6]. As of the rollout, **ads appeared in ~25.5% of AI Mode results**, AI Mode had crossed ~75 million monthly active users, and **AI Overviews appeared in over 60% of searches** [4]. Pilot advertisers named for Direct Offers include Chewy, Gap, and L'Oréal [6].\n\nThis comes from Google's own \"New ad formats built with Gemini coming to Google Search,\" blog.google [5]; The Register's \"Google explains how it will infuse ads into AI answers\" (May 21, 2026) [4], which notes \"adoption isn't always voluntary\" since any AI-Overview search offers a path into AI Mode; and Search Engine Land on the Direct Offers expansion [6]. One caveat: Direct Offers is a *pilot*; the 25.5%-of-AI-Mode and 60%-of-searches figures are point-in-time (mid-2026) and will move.\n\n**So what for the chokepoint:** Google's Conversational Discovery ad *is the answer being monetized*. Where OpenAI walls the answer off, Google generates the recommendation creative inside the conversational flow. The model layer becomes the ad surface directly — the strongest single piece of evidence that the foundation-model owner, not the protocol body, controls the most valuable discovery real estate.\n\n### 1.5 The inversion: from attention to selection\n\n**Claim 10.5.** The strategic inversion rarely named is the shift from *winning human attention* to *winning the agent's selection*. The trade and consultancy framing is explicit: success is now \"about being surfaced, recommended, and selected by the systems shaping what consumers see and buy\" [1]; \"a shift from optimizing for clicks to optimizing for selection — ensuring your brand is chosen by AI systems, not just seen by users\"; \"winning means being understood — and trusted — by AI agents, not just ranking in search results\" [23]. The consumer-side half of this is familiar — when an agent buys, the ad's job \"changes from capturing attention to getting selected by the agent\" — usually framed as a commerce-protocol consequence (discussed earlier, in the chapter on agentic commerce and payments). The sharper claim here: **selection is decided at the model layer**, which makes the model owner the gatekeeper independent of any ad-buying protocol.\n\nThis draws on McKinsey's \"from attention to action\" [1] and on agentic-advertising strategy syntheses [23], the latter being vendor/agency thought-leadership cited for the framing, not as fact. One caveat: \"selection happens at the model layer\" is a thesis; in practice selection is co-determined by the model, the retrieved data (RAG over catalogs and reviews), and whatever protocol-mediated offers (Direct Offers, AdCP signals) are injected. The model-layer thesis is the strongest *single* factor, not the only one.\n\n### 1.6 Why this subordinates AdCP-vs-ARTF\n\nThere is an open question lurking in the standards war: if the model (Claude vs. ChatGPT vs. Gemini) sitting in the agent becomes the real chokepoint, the AdCP-vs-ARTF fight may be subordinate to a model-layer war the protocol debate only gestures at. The answer: **yes, with two qualifications.**\n\n1. **The model layer governs discovery; the protocol layer governs execution.** AdCP and ARTF standardize *how a buyer agent and a seller agent agree on and execute a media buy*. But if the consumer-facing discovery agent (ChatGPT, Gemini) has already decided which brand to surface, the downstream ad-buying protocol works a shortlist the model already wrote. The model sits upstream of both AdCP and ARTF.\n2. **But the layers are not mutually exclusive — they stack.** Just as AdCP and ARTF stack on MCP, the model layer stacks *above* the protocol layer. A fully agentic flow could run: Gemini selects a product (model layer) → injects a Direct Offer (Google's own ad layer) → and, for the *media* buy that put the brand in contention, a buyer agent negotiated placement via AdCP/ARTF (protocol layer) over MCP (substrate). The model-layer war does not cancel the protocol war. It sits on top of it and captures the most valuable slice.\n\n**The defensible answer: the foundation-model layer is becoming its own power center. It does not erase the AdCP-vs-ARTF contest, but it subordinates it — discovery (model-controlled) is upstream of execution (protocol-controlled), and the model owners monetize discovery through their own advertising. The governance war over open ad-buying standards is being fought beneath a model layer that may capture the rents before the protocol toll-booths ever collect.**\n\n---\n\n## 2. The Agent-Blocking Counter-Tradition — Walled Gardens Bar Rival Agents\n\nThis is the genuine counter-tradition to the open-standards spine. The usual framing casts walled gardens as building *inward-facing MCP servers* — an on-ramp for outside agents on the garden's terms. True, but incomplete. The gardens are also **affirmatively blocking rival agents**, by lawsuit and by robots.txt. That directly contradicts the open-agentic-ecosystem premise.\n\n### 2.1 Amazon v. Perplexity — the platform sues the agent\n\n**Claim 10.6.** Amazon sent Perplexity a **cease-and-desist on October 31, 2025** (attorney Moez Kaba, Hueston Hennigan), alleging Comet's automated purchases degraded the customer experience and forced Amazon to \"devote significant resources to track, investigate, and address Perplexity's misconduct\"; **Amazon filed a federal suit the same day** in the Northern District of California. Perplexity refused to comply and published a blog post titled **\"Bullying is not innovation,\"** casting itself as a startup resisting corporate intimidation [7][8][9]. The timeline is reported by CNBC, Search Engine Journal, CyberScoop, PYMNTS, and ALM Corp; the cease-and-desist date and \"Bullying is not innovation\" response are corroborated across outlets. Perplexity's own blog post speaks for its position, not for the facts of the dispute.\n\n**Claim 10.7.** On **March 9, 2026**, **U.S. District Judge Maxine M. Chesney** granted Amazon a **preliminary injunction**, ordering Perplexity to halt Comet from accessing Amazon's password-protected systems and to destroy any Amazon data collected through Comet. The load-bearing legal holding: **\"Comet accessed Amazon accounts with the Amazon user's permission, but without authorization by Amazon\"** — i.e., **user consent and platform authorization are legally distinct**, and a shopper handing credentials to an agent does not authorize that agent to operate on the platform's infrastructure. The court found Amazon likely to succeed on federal (CFAA) and California computer-fraud claims [7][8][9][13].\n\nThe injunction is reported by CNBC [7] and by Search Engine Journal and CyberScoop [8]; the verbatim \"with the Amazon user's permission, but without authorization by Amazon\" is quoted in the Winning With Walmart analysis [13] and is consistent with CNBC's \"user permission to an AI agent does not substitute for platform authorization\" [7]. One caveat: this is a *preliminary* injunction, not a final merits ruling; Perplexity asked the court to lift the ban [9]. The precedent is live but not yet settled law.\n\n**So what:** this is the single hardest fact against the open-agentic-ecosystem premise. An open ecosystem assumes any agent can shop anywhere on the user's behalf. Chesney's holding says otherwise: not without the platform's permission. The platform — not the user, not a neutral protocol — controls agent access.\n\n### 2.2 Amazon's robots.txt — the technical bar\n\n**Claim 10.8.** Amazon added **ChatGPT-User** (live-web fetch for user queries) and **OAI-SearchBot** (SearchGPT) to its robots.txt, on top of the already-blocked **GPTBot** (training); the change was first spotted by e-commerce analyst **Juozas Kaziukėnas** and independently confirmed by Modern Retail in the site code. By early 2026 Amazon's robots.txt was blocking **~50 AI-related user-agents**, including crawlers from Meta, Google, and Perplexity. The blocked OpenAI agents support an estimated **~50 million shopping-related queries per day** (per OpenAI's own economic-research working paper) [10][11][12]. This is reported by Modern Retail [10], eMarketer [11], and Tinuiti, which corroborates \"nearly 50 AI-related user agents, including all three primary OpenAI crawlers\" [12]. An important qualifier: **robots.txt is voluntary and not legally binding** — it can be ignored by determined bots [10][11]. It is a *signal* of Amazon's posture, not an enforcement mechanism; the lawsuit (§2.1) is the enforcement mechanism.\n\n**Claim 10.9.** Amazon also formalized the legal bar inside its seller terms: a **Business Solutions Agreement update effective March 4, 2026** introduced an Agent Policy requiring **all AI agents accessing Amazon Services to clearly identify themselves as automated systems**, drawing a line between permitted automation via official SP-API channels and prohibited \"bot-like behavior that mimics human browsing\"; continued use after March 4 constitutes acceptance [11][13][24]. This comes from PPC Land's \"Amazon's new AI agent rules shake up sellers before March 4 deadline\" [24] and from Winning With Walmart, which notes the BSA \"effective March 4, 2026\" requiring agents to identify [13]. The March 4, 2026 effective date is recent, so the exact wording may have evolved since.\n\n### 2.3 The \"authorization gap\" — the structural advantage\n\n**Claim 10.10.** The combined effect of the injunction, robots.txt, and the BSA is an **\"authorization gap\"**: a structural asymmetry in which a brand's **Shopify listings can surface in ChatGPT** (Shopify storefronts are agent-accessible and increasingly agentic-by-default) **while the same brand's Amazon listings cannot** — because Amazon blocks the crawlers and bars unauthorized agents [10][13]. The asymmetry is independent of which ad-buying protocol wins. It turns on whether the platform *permits* the agent at all. The default Shopify guidance in 2026 is to *allow* OAI-SearchBot and ChatGPT-User for AI-driven discovery; Amazon's default is to *block* them [10].\n\nThe \"gap\" is an analytical framing built on established facts. The term itself traces primarily to the Winning With Walmart analysis [13], a Walmart-ecosystem analyst blog with a disclosed pro-Walmart lens; the underlying facts (Amazon blocks, Shopify allows) are multiply sourced via Modern Retail and eMarketer [10][11][13]. One caveat on that lean: the \"authorization gap\" framing originates from a source advocating Walmart's strategy; the facts hold, but the favorable framing of Walmart's openness should be read with that interest in mind.\n\n### 2.4 Walmart's mirror strategy — invite, don't block\n\n**Claim 10.11.** Walmart chose the **opposite** strategy. Rather than block rival agents, it embedded its own **Sparky** agent *into* ChatGPT and Google Gemini. After testing OpenAI's Instant Checkout — which converted at \"roughly one-third\" of Walmart.com's rate, with incorrect-cart and missing-sales-tax problems — Walmart pulled its SKUs from OpenAI's native checkout and deployed Sparky as an authorized agent inside the AI platforms, with users authenticating to their Walmart account and purchases completing on Walmart's own infrastructure. The ChatGPT integration reached paid subscribers in **March 2026**, with free-tier rollout expected later in spring. Walmart's stated rationale: \"our customers want consistency across every touchpoint,\" and (CEO John Furner) \"The transition from traditional web or app search to agent-led commerce represents the next great evolution in retail. We aren't just watching the shift, we are driving it\" [13][14][15].\n\nThis is reported by CNBC's \"OpenAI's first try at agentic shopping stumbled\" (Mar 20, 2026) [14]; The Paypers and TechBuzz on Sparky-into-ChatGPT/Gemini [15]; Robert Hu on the timeline and the one-third conversion figure [14][15]; and the Furner quote via Winning With Walmart [13]. One caveat: Walmart's framing of this as \"openness\" is a corporate claim; functionally it is *controlled* openness. Walmart routes the transaction through its own stack (Sparky) and does not let any agent transact freely. Invite-the-agent-on-my-terms is the inverse of Amazon's bar-the-agent, but both retain platform control.\n\n### 2.5 The debate, mapped\n\n**Claim 10.12.** The debate — *is the agentic future open or a new gatekeeper war?* — resolves not to one answer but to **a spectrum of platform postures**, each retaining platform control by different means:\n\n| Posture | Platform | Mechanism | Toward open or gatekept | Source |\n|---|---|---|---|---|\n| **Block (litigate)** | Amazon | Lawsuit (Comet injunction) + robots.txt + BSA agent-ID rule | Gatekept — bars unauthorized agents | [7][8][10][13] |\n| **Invite on my terms** | Walmart | Own agent (Sparky) embedded in ChatGPT/Gemini via UCP; transaction stays on Walmart stack | Controlled-open — admits agents, keeps the buy | [13][14][15] |\n| **Open by default** | Shopify | Allow AI crawlers; agentic storefronts in ChatGPT by default; ACP hand-off | Open — surfaces in any agent | [10][13] |\n| **Discovery-only** | OpenAI/ChatGPT | Pivoted from owning checkout to owning discovery; hands off to merchants | Open-ish discovery, no owned checkout | [14][25] |\n| **In-garden discovery agent** | Amazon Rufus | Own discovery/comparison agent inside the wall; no neutral protocol needed | Gatekept — discovery and buy both in-garden | [12][16][17] |\n\nThe rows are each multiply sourced above. **The finding:** there is no single \"open\" or \"gatekept\" future. There is a *menu of platform strategies*. The largest, most concentrated platforms (Amazon) trend toward gatekeeping; the smaller, distribution-hungry ones (Shopify, and Walmart-as-Amazon-challenger) trend toward (controlled) openness. **Concentration predicts gatekeeping.** This is the genuine counter-tradition to the open-standards spine: open standards describe the *non-garden* market; the gardens write their own access rules.\n\n---\n\n## 3. The CTV Read — Amazon Prime Video + Rufus as the In-Garden Path That Needs No Protocol\n\nThe spine of this account is CTV. The agent-blocking counter-tradition has its sharpest CTV expression in Amazon, which owns the entire living-room stack — device (Fire TV), content (Prime Video), commerce (Amazon.com), discovery agent (Rufus), ad system (Amazon DSP/Ads), and identity (logged-in Prime + ACR). Inside that wall, **no neutral protocol is needed**. The model, the ad, the catalog, and the checkout are all Amazon's.\n\n### 3.1 The in-garden CTV loop\n\n**Claim 10.13.** Amazon has wired shoppable commerce directly into Prime Video CTV: interactive **shoppable carousel ads** let viewers browse and add products to their Amazon cart **directly from the streaming-TV experience using the Fire TV remote**, across Prime Video and first- and third-party Fire TV living-room devices [16][17]. **Rufus**, Amazon's AI shopping assistant, served **300+ million customers in 2025** (Amazon also cites 250M active in a separate framing) and behaves as a **discovery and comparison agent layered on search — not yet an end-to-end transaction agent** — with Amazon reporting Rufus users are **~60% more likely to complete a purchase** [12][18]. ACR on Fire TV (\"when enabled, Amazon uses ACR to understand which shows, movies, and advertisements you watch\") supplies the in-garden viewing signal [18].\n\nThis draws on Amazon Ads' \"Interactive ads expand across streaming TV into Prime Video\" [17]; GB News on Fire TV remote shoppable ads [16]; Tinuiti on Rufus-as-discovery-agent and the Perplexity/robots.txt posture [12]; and Amazon's \"Rufus gets smarter\" plus the leaked Rufus-ads pitch deck reported via eMarketer [18]. One caveat: the 60%-more-likely-to-purchase and the 250M/300M user figures are vendor-reported by Amazon and not independently audited.\n\n### 3.2 Why the garden needs no neutral protocol — the CTV synthesis\n\n**Claim 10.14.** For Amazon's owned CTV, the entire open-standards apparatus (AdCP negotiation, ARTF colocated RTB, even a neutral MCP server for outside agents) is **structurally unnecessary**, because every layer the protocols would mediate is internal to Amazon:\n\n- **Discovery** is Rufus (Amazon's model/agent), not a third-party agent shopping across platforms [12][18].\n- **The ad** is a shoppable Prime Video carousel served by Amazon Ads, with add-to-cart on Amazon [16][17].\n- **Identity** is the logged-in Prime household plus Fire TV ACR — resolved inside the wall, no neutral identity protocol required [18].\n- **The buy** completes on Amazon.com — no merchant hand-off, no ACP/UCP cart, no AP2 mandate to a foreign payment rail.\n- **Rival agents are barred** from the commerce layer (Comet injunction; robots.txt; BSA) [7][10][13].\n\nThis synthesis is built on the multiply-sourced claims above — §2.1–2.2 (blocking) and §3.1 (in-garden loop). **So what:** this is the CTV manifestation of the whole counter-tradition. The natural question — \"what does agentic buying do to CTV DSPs, SSPs, agencies, and margins?\" — has an Amazon answer for *its own* inventory: nothing, because there is no DSP/SSP/agency/protocol in the loop. The garden *is* the stack, the model is Amazon's, and the rival agent is barred. The open-standards fight (AdCP/ARTF) is a fight over the *non-Amazon, non-garden* CTV supply (Magnite, LG, Samba, the long tail, as the CTV chapter details). Amazon's living room is exempt by design.\n\n### 3.3 Contrast: the open-CTV path still needs the protocols\n\n**Claim 10.15.** The contrast sharpens the point. For **open CTV supply** (independent SSPs, the long-tail streamers), agentic buying *does* need neutral protocols — a buyer agent must negotiate across many seller agents (AdCP), and the transport must clear (ARTF/OpenRTB), because no single platform owns the loop (only three companies clear 10% of US CTV sales, vs. social's duopoly). The model-layer chokepoint applies here too — a consumer-facing agent (ChatGPT, Gemini) still decides which streaming offer or product to surface — but the *execution* genuinely requires the open stack. **The garden-vs-open split inside CTV mirrors the whole argument: the gardens route around the protocols; the open market depends on them.** This rests on the diffuseness of CTV supply and on the blocking dynamics set out in §2 above.\n\n---\n\n## 4. Synthesis — Two Power Centers Above the Protocol War\n\nMuch of this account has been a study of the protocol layer: AdCP vs. ARTF, MCP as substrate, who governs the standard. These pages add two power centers that sit *above* that layer and partly subsume it.\n\n**Power center one: the foundation-model layer (the chokepoint).** Discovery is decided inside the model (ChatGPT, Gemini, Claude). The model owners are building advertising businesses on that exact surface — OpenAI's ChatGPT ads, Google's Gemini/AI-Mode ad fusion. Whoever's model sits in the agent shapes which brands get selected, and monetizes the selection. This sits upstream of AdCP and ARTF, which mediate *execution* of a buy after discovery has already happened. The open question from the standards war resolves **yes**: the model layer is becoming its own power center, and the standards war is partly subordinate to it.\n\n**Power center two: the platform's agent-access regime (the counter-tradition).** Open standards assume agents shop across platforms. The largest platforms deny that assumption — Amazon by lawsuit and robots.txt, establishing that user consent ≠ platform authorization; Walmart by inviting only its own agent on its own terms. Concentration predicts gatekeeping. The open-standards stack is real, but it governs the *non-garden* market. The gardens write their own access rules, and the \"authorization gap\" is the result.\n\n**Where the two meet — and why CTV is the cleanest case.** Amazon's living room collapses both power centers into one wall: its model (Rufus) decides discovery, its ads are shoppable in-garden, its identity is resolved by Prime + ACR, its rivals are barred, and the buy never leaves Amazon. No neutral protocol touches it. That is the in-garden path that needs no protocol — the sharpest contradiction of the open-agentic-ecosystem premise this account is built around, and the reason the open-standards fight, however genuine, is being fought over the *remainder* of the market the gardens have not already enclosed.\n\n**The honest caveat that should temper all of this.** Every model-layer ad surface described here is a *pilot or test* under five months old: ChatGPT ads (testing, Free/Go only, Feb 2026); Google Direct Offers (pilot, Jan 2026); Conversational Discovery ads (GML 2026, May). The agent-blocking precedent (Comet injunction) is *preliminary*, not final. The agentic buying volume remains small (AdCP has gone from \"zero dollars\" to a handful of campaigns; in CTV the activity is \"piloted, not production\"). These are power centers *forming*, not arrived. The open-standards spine is not wrong; it is incomplete. The two power centers above it will likely decide whether \"open agentic advertising\" describes the whole market or only the part the gardens chose not to wall.\n\n---\n\n## 5. Open Questions\n\n1. **Will OpenAI's \"answer independence\" firewall hold?** Today OpenAI walls the answer off from advertising while Google fuses ads into the answer (Conversational Discovery ads). If discovery is the value, the commercial pressure on OpenAI to monetize the answer itself is enormous. Whether the firewall survives contact with the P&L decides whether the model layer becomes a *neutral* chokepoint or a *paid* one — the single biggest variable here. No source confirms OpenAI will hold or break it.\n\n2. **Is the verbatim O'Kelley \"indistinguishable\" quote real, and where?** It could not be verified in the available record. It may exist in a podcast (Marketecture Ep. 115; Index Exchange \"Innovators Unscripted\") or a Fast Company piece referenced but not retrieved. Pinning the primary source would let the thesis be attributed to its named author rather than to a paraphrase plus McKinsey.\n\n3. **Will the Comet injunction survive to a final merits ruling — and will it generalize?** It is preliminary, and Perplexity has moved to lift it. If it holds and is followed (CFAA + state computer-fraud as the bar against unauthorized agents), it becomes the legal spine of the gatekeeper future. If it is narrowed or reversed, the open-agent case strengthens. This is the most consequential live legal question in this whole area.\n\n4. **Does the authorization gap actually move share — and does it favor Shopify/Walmart or just protect Amazon?** The \"gap\" is a structural argument from a pro-Walmart source. No data yet shows brands *gaining* AI-surfacing share via Shopify or *losing* it on Amazon at scale. The gap is real in mechanism; its market effect is unquantified.\n\n5. **Does Anthropic monetize MCP discovery, or stay infrastructure-neutral?** Anthropic owns MCP, the substrate of every camp, and runs Claude, a discovery model — but unlike OpenAI and Google it had not, as of mid-2026, launched an in-product ad surface. Whether Anthropic stays a neutral substrate provider or becomes a third model-layer ad power is an open question that would reshape the entire chokepoint analysis.\n\n6. **What happens to open-CTV supply if the gardens pull discovery inward?** If consumers increasingly start product/show discovery inside Rufus/Gemini/ChatGPT rather than in open CTV apps, the open-CTV supply the AdCP/ARTF fight is *about* may shrink regardless of which protocol wins — the model layer drains the funnel before the protocol layer ever runs.\n\n7. **Do regulators treat agent-blocking as anticompetitive?** Amazon barring rival agents while running its own (Rufus) is the kind of self-preferencing antitrust authorities have pursued elsewhere. Whether the Comet posture draws regulatory scrutiny (FTC, EU DMA) is unmapped and could flip the open-vs-gatekeeper balance by law rather than by market.\n\n---\n\n## Sources\n\n1. McKinsey & Company, \"The agentic advertising economy: From attention to action,\" published ~June 16, 2026. https://www.mckinsey.com/industries/technology-media-and-telecommunications/our-insights/the-agentic-advertising-economy-from-attention-to-action — Tier 5 (global consultancy; disclosed methodology — proprietary research + advertiser survey + expert interviews). The \"attention → selection,\" \"agents are gatekeepers of consumer intent,\" and foundation-model-as-power-center thesis. Accessed 2026-06-20.\n2. OpenAI, \"Testing ads in ChatGPT,\" Jan 16, 2026. https://openai.com/index/testing-ads-in-chatgpt/ — Tier 1 (OpenAI's own claim about its own product; page returned 403 to automated fetch — content corroborated via [3]). Free/Go tiers, answer-independence, no conversation content to advertisers, labeled/separated ads. Accessed 2026-06-20.\n3. Axios, \"OpenAI brings ads to ChatGPT Go and Free tiers\" (Feb 9, 2026); MacRumors, \"ChatGPT Now Has Ads for Free and Go Tier Users\" (Feb 9, 2026); Gizbot, \"OpenAI Introduces Ads… Ads 'Won't Influence Answers.'\" https://www.axios.com/2026/02/09/chatgpt-ads-testing-go-free ; https://www.macrumors.com/2 ps://cyberscoop.com/amazon-perplexity-comet-browser-injunction/ — Tier 5 / Tier 4. CFAA + California computer-fraud basis; destroy-data order; password-protected systems. Accessed 2026-06-20.\n9. PYMNTS, \"Perplexity Asks Federal Court to Lift Amazon Shopping Agent Ban\"; ALM Corp and Winbuzzer timeline coverage. https://www.pymnts.com/legal/2026/perplexity-asks-federal-court-to-lift-amazon-shopping-agent-ban/ — Tier 5. C&D Oct 31 2025 (Moez Kaba/Hueston Hennigan), same-day suit, \"Bullying is not innovation,\" motion to lift. Accessed 2026-06-20.\n10. Modern Retail, \"Amazon quietly blocks more of OpenAI's ChatGPT web crawlers from accessing its site,\" 2026. https://www.modernretail.co/technology/amazon-quietly-blocks-more-of-openais-chatgpt-web-crawlers-from-accessing-its-site/ — Tier 5 (retail trade press). GPTBot/ChatGPT-User/OAI-SearchBot blocked; Juozas Kaziukėnas spotted it; ~50M daily queries (OpenAI working paper); robots.txt voluntary; Amazon ~40% of US e-commerce, ~$56B ad revenue; Auto Buy / Buy For Me. Accessed 2026-06-20.\n11. eMarketer, \"Amazon moves to shut out ChatGPT bots as agentic shopping pressure rises,\" 2026. https://www.emarketer.com/content/amazon-shuts-out-chatgpt-bots-agentic-shopping — Tier 5. Crawler blocks; Jassy's pro-agentic stance vs. defensive turf-protection; Walmart/Target partner contrast; Rufus/Buy For Me/Auto Buy; robots.txt voluntary. Accessed 2026-06-20.\n12. Tinuiti, \"Amazon Agentic Commerce: Rufus, COSMO, and What's Next,\" 2026. https://tinuiti.com/blog/amazon/amazon-agentic-commerce/ — Tier 5 (agency analyst). Rufus as discovery/comparison agent (not end-to-end); robots.txt blocks ~50 AI agents incl. all 3 OpenAI crawlers; COSMO knowledge graph; \"keep agentic behavior within its own walls\"; selective Google-AI-Mode citation. Accessed 2026-06-20.\n13. Winning With Walmart, \"The Authorization Gap: What Amazon's Perplexity Injunction Reveals About the Commerce Layer Walmart Is Building Differently,\" Mar 2026. https:/
