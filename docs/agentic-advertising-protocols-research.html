nal` (activation) [4].\n- **Governance** — `check_governance` (pre-execution validation), `get_plan_audit_logs` (audit trail) [4].\n- **Brand Protocol** — brand identity via `brand.json` and `get_brand_identity` [4].\n- **Accounts** — `sync_accounts`, `list_accounts` (commercial relationship setup) [4].\n- **Trusted Match Protocol (TMP)** — real-time package activation separating **Context Match** (content signals, no identity) from **Identity Match** (user eligibility via opaque tokens, no page context); the publisher joins both locally so \"buyers never see identity and content together\" [4].\n\n(One caveat: secondary coverage describes a **Curation Protocol** scheduled for Q2 2026 as a \"forthcoming\" module [15], so any present-tense \"Curation is live\" claim should be checked against a dated confirmation.)\n\nOne design feature matters most: discovery uses a *single natural-language brief* fanned out to many sellers. \"One brief. Three sellers. Same JSON structure back\" [19]. The buyer can then iterate via a `refine` mode that \"narrows the previous result set\" without starting over — an \"iterative conversation with the seller\" [19]. This is the negotiation layer made concrete. The buyer is *talking*, not *bidding*.\n\n---\n\n## 5. The ad-specific layer, part two: ARTF as the infrastructure/transport layer\n\n### 5.1 What ARTF is and where it sits\n\n**ARTF (Agentic RTB Framework, also rendered Agentic Real-Time Framework)** is a framework defined by **IAB Tech Lab** that specifies a **containerized execution model for real-time bidding** [20][21]. It was released as **v1.0 for public comment** around **November 12–13, 2025** [20][22]. Where AdCP sits *above* the auction, ARTF lives *inside* it: it lets host platforms run third-party \"agent services\" as **colocated containers** within their own infrastructure and modify the bidstream *during* the auction [20][23].\n\nARTF's stated purpose is to fix three structural limits of legacy programmatic [21]:\n\n1. **Latency** — bid requests traverse multiple external services over HTTP, producing \"end-to-end latencies in the range of hundreds of milliseconds per impression.\"\n2. **Complexity** — every vendor integration requires custom work, creating fragile ecosystems.\n3. **Data risk** — passing bid requests to many external endpoints increases data-leakage risk and complicates compliance.\n\nNote the overlap with MCP's M×N story (complexity). But ARTF's answer is *colocation*, not a new substrate. It keeps the existing programmatic plumbing and re-houses the participants inside the same data center.\n\n### 5.2 The three-element architecture: host, agent service, container\n\nARTF defines a three-part model [23]:\n\n- **Host platform** — the orchestrator: an SSP (supply-side platform), DSP (demand-side platform), exchange, or ad server. The host keeps central control, deciding which agents to invoke and which mutations to permit [23].\n- **Agent service** — a first- or third-party specialist function (identity resolution, fraud detection, deal activation, audience enrichment), packaged as a **container** [23].\n- **Container** — the standardized, isolated runtime that runs the agent service **co-located** with the host: \"same data center, server, or Kubernetes cluster\" [23].\n\nColocation is the whole trick. Instead of the host making sequential *external* HTTP calls out to vendor endpoints, each adding a network round-trip, the vendors' code runs *inside* the host's environment, so calls are local [23]. The host enforces **least-privilege data access** — each agent sees only the bid fields it needs — and *mediates and audits every mutation*, accepting or rejecting each one individually [23].\n\n### 5.3 The communication mechanism: gRPC, Protocol Buffers, and OpenRTB Patch\n\nARTF standardizes host-agent communication using **gRPC with Protocol Buffers** for \"high-performance, strongly typed communication,\" with authoritative `.proto` definitions published by IAB Tech Lab [23]. gRPC is a high-performance binary RPC framework; Protocol Buffers (\"protobuf\") is its compact, schema-typed serialization format. Both were chosen for speed inside the tight auction window, in deliberate contrast to MCP's human-readable JSON-RPC. The latency budgets are worlds apart: a ~100 ms auction versus a seconds-to-days negotiation.\n\nAgents return proposed bidstream changes as **OpenRTB Patch objects** — *minimal diffs* rather than full replacements — and each mutation carries an **intent** tag describing its purpose (identity resolution, fraud detection, deal activation, etc.) [23]. Crucially, **ARTF is designed to coexist with, not replace, OpenRTB**. OpenRTB remains the bid-object specification; ARTF only standardizes *how* services process and modify those objects inside the auction execution layer [23]. This is the precise sense in which ARTF *extends* the legacy ad substrate (OpenRTB/AdCOM/VAST) rather than building on the general AI substrate (MCP).\n\n### 5.4 The latency claim — stated and caveated\n\nThe headline number, repeated across IAB Tech Lab materials and supportive coverage: ARTF targets a reduction from \"typical ranges of 400–800 ms down to roughly **100 ms**,\" described as \"up to approximately **80%**\" improvement, by eliminating most external network hops [21][23][20]. The recovered time can be reinvested in richer real-time enrichment within the auction window [23].\n\nAn honest framing: this is a **vendor/standards-body design target, not an independently measured benchmark**. The figures originate with IAB Tech Lab and ARTF-supporting parties (Index Exchange, Chalice) [20][22], and the spec itself says \"up to approximately 80%… depending on implementation\" [21]. Treat \"80% / 400–800 ms → 100 ms\" as a *claimed* ceiling under favorable conditions, not a guaranteed result, and one worth re-checking against any independent measurement.\n\n> **Figure-ready description — \"Two layers, two clocks\" (AdCP vs ARTF side-by-side).**\n> Two columns. LEFT = **AdCP (negotiation layer)**: icon of two agents in conversation; \"ABOVE the auction\"; clock reads \"seconds → days (async)\"; transport \"MCP + A2A (JSON-RPC over stdio/HTTP)\"; built on \"the AI substrate\"; native to \"custom/guaranteed/curated deals — CTV-shaped\"; governance \"human-in-the-loop via elicitation/approval.\" RIGHT = **ARTF (transport layer)**: icon of containers stacked inside a data-center box; \"INSIDE the auction\"; clock reads \"~100 ms (sync)\"; transport \"gRPC + Protocol Buffers\"; built on \"OpenRTB/AdCOM/VAST\"; native to \"commoditized impression auctions at scale\"; governance \"host-mediated mutation audit.\" Center divider labeled \"the auction boundary.\" Caption: \"Not rivals for the same job — different layers of the same stack.\"\n\n### 5.5 The framing fight (architectural, not commercial)\n\nThe two camps frame each other in revealing ways — relevant here only as architectural positioning, since the politics belong to a later chapter. IAB Tech Lab CEO **Anthony Katsur** argued the industry did not need \"another industry trade group\" and that IAB Tech Lab already addresses some of what AdCP targets [22]. Adam Heimlich, articulating the ARTF case, characterizes AdCP as trying to \"standardize something that's unproven,\" while ARTF builds on the \"proven\" foundation of OpenRTB [22]. The AdCP camp's implicit rebuttal is structural: the most valuable, fastest-growing inventory — premium CTV, custom packages, guaranteed deals — was *never* a good fit for the impression auction, so making the auction faster (ARTF) does nothing for the part of the market AdCP targets. Both can be right, because they aim at different layers.\n\n---\n\n## 6. The payment / settlement layer: AP2 and ACP\n\nA media buy is not done when the deal is agreed. Money has to move, with authorization and accountability. Two standards, both extending the agent substrate, cover this.\n\n### 6.1 AP2 — Google's Agent Payments Protocol (the Mandate trust model)\n\n**AP2 (Agent Payments Protocol)** is an open protocol, announced by Google on **September 16, 2025** with 60+ payments and technology partners (Mastercard, American Express, PayPal, Adyen, Coinbase, Etsy, Salesforce, ServiceNow, JCB, UnionPay International, and others) [24][25]. Critically for the layering thesis, AP2 is explicitly built *on the substrate*: \"The protocol can be used as an extension of the Agent2Agent (A2A) protocol and Model Context Protocol (MCP)\" [24].\n\nAP2 solves the trust problem of \"an AI agent spent my money\" via cryptographically signed **Mandates** — tamper-proof digital contracts carried as **W3C Verifiable Credentials (VCs)** [24][25]:\n\n- **Intent Mandate** — captures the user's initial request (natural-language ask, hard constraints like max price/allowed merchants/expiry, and the agent's identity reference); establishes that the user delegated authority for *this kind* of purchase [24][25].\n- **Cart Mandate** — created after the agent presents options and the user approves; \"a secure, unchangeable record of the exact items and price, ensuring what you see is what you pay for\" [24].\n- **Payment Mandate** — \"securely links your payment method to the verified contents of the Cart Mandate\" [24].\n\nThe three Mandates answer three questions: authorization (did the user authorize this?), authenticity (does the request reflect true intent?), and accountability (who is liable if it goes wrong?) [24]. AP2 also treats stablecoin rails as first-class alongside cards and bank transfers [25].\n\n### 6.2 ACP — OpenAI and Stripe's Agentic Commerce Protocol\n\n**ACP (Agentic Commerce Protocol)** is an open standard for connecting buyers, their AI agents, and businesses to complete purchases; it is **maintained by OpenAI and Stripe** (initial spec **September 29, 2025**, in beta, with later releases in December 2025, January 2026, and April 2026) [26][27]. (Note on attribution: some secondary coverage lists Meta as a co-creator, but the protocol's own GitHub states it is \"currently maintained by OpenAI and Stripe\" — use the primary attribution [26][27].)\n\nACP's components [26][27]:\n\n- **Agentic Checkout API** — create, update, and complete checkout sessions (cart management, fulfillment, payment).\n- **Cart / Feed** — browse catalogs and manage carts (a product **feed** was added in the 2026-04-17 release) [26].\n- **Delegate Payment** — securely pass payment tokens between buyer, agent, and business via **payment handlers**; Stripe's implementation issues a **Shared Payment Token (SPT)** scoped to a specific merchant and cart total, letting an app like ChatGPT initiate payment *without* exposing the buyer's card credentials [27].\n- **Delegate Authentication** — OAuth 2.0.\n\nACP went live in **ChatGPT's Instant Checkout** in late September 2025 [27]. The April 2026 release notably added an **MCP** component, underscoring that even the commerce layer is converging on the same substrate [26].\n\n### 6.3 How payment plugs into advertising\n\nFor most agentic *media buying*, settlement is the AdCP `create_media_buy` step plus existing billing relationships (`sync_accounts`); AP2/ACP are not strictly required to buy ads. Their relevance to *this* corpus is the **shoppable / agentic-commerce CTV** frontier. When an agent both *buys the ad* and *completes the purchase the ad provoked* — an AI shopper buying the product it saw on a shoppable connected-TV ad — AP2/ACP are the rails that carry the second transaction. The advertising layer (AdCP) and the commerce layer (AP2/ACP) meet at the shoppable-TV surface, a junction the later chapters on agentic CTV and on the commerce-and-payment layer take up.\n\n---\n\n## 7. The anatomy of an end-to-end agentic ad transaction — a worked CTV example\n\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The agentic ad transaction, layer by layer<\/div><div class=\"viz-flow\"><span class=\"flowstep cv-fade\" style=\"--d:0.00s\">Discover inventory<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.08s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.16s\">Negotiate / curate (AdCP)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.24s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.32s\">Build or recognize creative<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.40s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.48s\">Execute media buy (ARTF / OpenRTB)<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.56s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.64s\">Activate audience<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.72s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.80s\">Settle payment (AP2 / ACP)<\/span><\/div><figcaption>Which standard plausibly handles each step: MCP substrate throughout; AdCP or ARTF for the ad-specific middle; AP2/ACP for settlement. <span class=\"credit\">Source: Author&#x27;s synthesis.<\/span><\/figcaption><\/figure>\n\n\n\nThis is the payoff: one CTV buy walked through the stack, naming the layer and standard that plausibly handles each step. The flow follows AdCP's own documented campaign-lifecycle narrative [4][19], grounded in the real Swivel/LG Ad Solutions and Swivel/Olyzon CTV transactions [14][28].\n\n**Scenario.** An outdoor-apparel brand wants premium sports CTV in Q2 2026, males 25–45 interested in outdoor recreation, $50K across CTV and display, with a CPA goal and human sign-off on anything over a threshold.\n\n**Step 0 — Intent (application layer).** A human planner tells the buyer agent in natural language what they want. *Layer: application; substrate: MCP (the agent reaches its tools).* This is the \"I want to find women interested in rock climbing in the UK\" style of prompt AdCP enables [18].\n\n**Step 1 — Discover inventory (negotiation layer).** The buyer agent issues an AdCP `get_products` task in *brief mode*, fanning the same natural-language brief out to multiple seller agents simultaneously. Each publisher's seller agent \"interprets it against their own inventory\" and returns a standardized response (pricing, forecasts, targeting options, creative requirements). *Standard: AdCP Media Buy; transport: A2A (agent-to-agent) or MCP (assistant-to-tool); NOT the RTB bidstream.* \"One brief. Three sellers. Same JSON structure back\" [19].\n\n**Step 2 — Negotiate / curate (negotiation layer).** The buyer iterates with `get_products` in *refine mode* — shifting budget toward CTV, dropping display, layering constraints — an \"iterative conversation with the seller\" that \"narrows the previous result set\" without restarting [19]. For CTV specifically, this is where custom packaging, content adjacency, sponsorships, and guaranteed delivery get negotiated — the things that \"never fit cleanly into campaign execution models built for RTB\" [28]. Publishers \"encode business rules such as pricing, prioritization and approval thresholds directly into seller agents,\" which then negotiate continuously as conditions change [28]. *Standard: AdCP (Curation / Media Buy); transport: A2A.* This is the step ARTF cannot do. It has no concept of a multi-turn deal conversation.\n\n**Step 3 — Build / recognize creative (negotiation layer + creative agent).** The buyer's creative agent calls `list_creative_formats` to learn the CTV format specs, pulls the brand's identity (colors, logo, tone) from `brand.json` via `get_brand_identity`, then `build_creative` generates the required formats and `sync_creatives` distributes them. *Standard: AdCP Creative; substrate: MCP (the creative agent may use MCP **sampling** to call an LLM, or generate video assets); brand data via `brand.json`* [4][19].\n\n**Step 4 — Govern / approve (cross-cutting).** Before execution, `check_governance` validates budget limits, brand safety, and targeting compliance; anything over threshold escalates to a human, who approves via the agent surface. *Standard: AdCP Governance; substrate: MCP **elicitation** (ask the user to confirm).* \"The agent can't skip this step; it's architectural, not procedural\" [4].\n\n**Step 5 — Execute the media buy (negotiation layer → execution).** One `create_media_buy` call executes the campaign across the selected seller(s) with flight dates, budget, creative assignments, and pricing; the seller \"either approves the buy or sends it through review\" [19]. *Standard: AdCP Media Buy.* For *guaranteed/curated* CTV, this is the terminal transaction — no auction. For inventory that ultimately *does* clear through an auction (biddable CTV), this is the handoff point where the deal becomes a programmatic line item — and *that* auction is where **ARTF** would operate, running colocated agent services (identity resolution, fraud, deal activation) to enrich each bid in ~100 ms [23]. **This is the single clearest place the two ad-layers compose rather than compete: AdCP negotiates the deal, and ARTF, if used, executes the impressions of the biddable portion.**\n\n**Step 6 — Activate the audience (negotiation layer + signals).** Audiences synchronize via `sync_audiences`; third-party signals are discovered with `get_signals` and turned on with `activate_signal`. For privacy-safe CTV matching, the **Trusted Match Protocol (TMP)** separates Context Match (content) from Identity Match (user eligibility via opaque tokens), joined locally by the publisher so buyers never see identity and content together [4]. *Standard: AdCP Signals + TMP.*\n\n**Step 7 — Settle payment (payment layer).** Standard media billing flows through the existing commercial relationship (`sync_accounts`). For the *shoppable-CTV* case — where the ad drives an in-experience purchase completed by an agent — settlement uses the payment layer: **AP2** (Intent → Cart → Payment Mandates as verifiable credentials) or **ACP** (Agentic Checkout + Delegate Payment via a Shared Payment Token) [24][27]. *Standard: AP2 / ACP; substrate: extends A2A + MCP.*\n\n**Step 8 — Measure / audit (negotiation layer).** `get_media_buy_delivery` aggregates impressions, clicks, spend, and completion rates from every seller into one response; conversions feed back via `log_event` and optimization via `provide_performance_feedback`; `get_plan_audit_logs` yields the full decision trail — \"who proposed what, who approved it, what conditions were attached, what actually ran\" [19]. *Standard: AdCP Media Buy + Governance.*\n\n**The first real instances.** This is not hypothetical. On **October 16, 2025**, the first agent-to-agent media buy executed real money against real LG Ad Solutions inventory, with AI agents handling creative, targeting, and approval under human oversight [14]. Swivel (seller agents) and Olyzon (buyer agents) then launched agent-to-agent **CTV** activation over AdCP — Olyzon's buyer agents turning strategy into structured briefs, Swivel's seller agents orchestrating activation of complex, high-value CTV inventory [28]. (These are early implementations as of late 2025 and early 2026; their live status is worth re-confirming.)\n\n> **Figure-ready description — \"One CTV buy through the stack\" (swimlane).**\n> A left-to-right swimlane with 9 columns (Steps 0–8) and 4 horizontal lanes (Application / Ad-negotiation [AdCP] / RTB-transport [ARTF] / Payment [AP2·ACP]) plus a thin bottom rail labeled \"Substrate: MCP + A2A.\" Plot each step's box in its lane with the task name: Step 0 Application \"intent prompt\"; Steps 1–3 in AdCP lane (`get_products` brief → refine → `build_creative`); Step 4 spanning Application↔AdCP \"`check_governance` + human approval (elicitation)\"; Step 5 AdCP `create_media_buy` with a dashed drop-down arrow into the ARTF lane labeled \"biddable portion only → colocated bid enrichment ~100 ms\"; Step 6 AdCP `activate_signal` + TMP; Step 7 in Payment lane \"AP2/ACP — shoppable only\" (greyed for non-shoppable); Step 8 AdCP `get_media_buy_delivery` + `get_plan_audit_logs`. The visual teaches the thesis: almost the entire CTV buy lives in the AdCP lane; ARTF appears only for the biddable slice; payment appears only when the ad is shoppable.\n\n---\n\n## 8. The architectural distinction it all turns on (stated cleanly)\n\nEverything above reduces to one contrast worth keeping in mind throughout:\n\n**AdCP = a NEGOTIATION / CONVERSATION layer native to agents.** Agents talk to seller agents *outside* the bidstream. It is asynchronous (seconds to days), built on the *AI* substrate (MCP + A2A), and native to deals that were never a good fit for the impression auction: custom packages, curation, sponsorships, guaranteed delivery — the shape of premium CTV [4][16][28]. It changes *who talks to whom, and how a deal is struck.*\n\n**ARTF = an INFRASTRUCTURE / TRANSPORT layer that makes existing RTB agent-and-latency-friendly.** Agents, as colocated containers, enrich and modify bids *inside* the auction. It is synchronous (~100 ms), built on the *legacy ad* substrate (OpenRTB/AdCOM/VAST), and native to commoditized impression auctions at scale [20][23]. It changes *how fast and how richly the existing auction runs.*\n\nThey solve different parts of the same problem. A buyer could plausibly use AdCP to *negotiate* a curated CTV deal and ARTF to *execute* the biddable impressions that deal contains. The \"war\" framing, taken up in a later chapter, is real as politics, and as a fight over which body controls the standard — but architecturally, the two are stacked, not opposed. The fault line between them is *the auction boundary*: AdCP lives above it, ARTF lives inside it. Draw that one line, and the whole landscape resolves into place.\n\n> **One-sentence test for any future claim:** *Is this about how a deal is negotiated (AdCP, above the auction) or how a bid is executed (ARTF, inside the auction)?* If you can answer that, you have placed the claim in the stack.\n\n---\n\n## Open Questions\n\n1. **Do AdCP and ARTF actually compose in production, or do real workflows pick one?** The architecture says they can stack (negotiate with AdCP, execute biddable impressions with ARTF), but no documented end-to-end implementation yet shows both in the *same* transaction.\n2. **Is the \"400–800 ms → ~100 ms / 80%\" latency claim independently reproducible?** It originates with IAB Tech Lab and ARTF supporters; no neutral benchmark was located. Load-bearing and currently single-camp-sourced.\n3. **How stateless can AdCP really be over MCP's Streamable HTTP for high-volume CTV curation?** MCP is stateful by default; AdCP's async, multi-turn negotiations imply session state — the scaling characteristics for thousands of concurrent CTV deals are not yet specified in the public documentation.\n4. **What is the exact A2A construct set AdCP relies on?** The A2A spec's detailed schemas (Agent Card, Task lifecycle, Artifacts) are involved, but AdCP's precise A2A binding deserves a close look at the primary specification.\n5. **Where does the platform-MCP-server layer (Google/Amazon/Meta/TikTok ad MCP servers) sit relative to AdCP/ARTF?** These are *vendor* MCP servers exposing a single platform's API — not an open cross-publisher standard. Are they a third path (walled-garden agentic access) that routes around *both* AdCP and ARTF?\n6. **Curation Protocol status.** Secondary sources put a dedicated AdCP Curation Protocol at \"Q2 2026, forthcoming.\" Its actual ship/live status needs a dated confirmation at publish.\n7. **AP2 vs. ACP convergence vs. fragmentation.** Both extend MCP/A2A; ACP added an MCP component in April 2026. Do they converge on one agent-payment standard or persist as a Google-camp vs. OpenAI-camp split?\n\n---\n\n## Sources\n\n1. Anthropic / Model Context Protocol, \"What is the Model Context Protocol (MCP)?\", modelcontextprotocol.io (Introduction). https://modelcontextprotocol.io/docs/getting-started/intro — accessed 2026-06-19. *Tier 1 (primary spec/docs). \"USB-C for AI\" analogy; definition; ecosystem support.*\n2. Model Context Protocol docs, \"Architecture overview\" (primitives summary). https://modelcontextprotocol.io/docs/learn/architecture — accessed 2026-06-19. *Tier 1. Server/client primitives definitions.*\n3. VentureBeat, \"Anthropic releases Model Context Protocol to standardize AI-data integration,\" Nov 2024; corroborated by Anthropic news and IBM \"What is MCP.\" https://venturebeat.com/data-infrastructure/anthropic-releases-model-context-protocol-to-standardize-ai-data-integration — accessed 2026-06-19. *Tier 4/5. Release date Nov 25 2024, spec 2024-11-05, SDKs, M×N problem, adoption timeline.*\n4. Ad Context Protocol, \"Introduction to the Protocol,\" docs.adcontextprotocol.org/docs/intro. https://docs.adcontextprotocol.org/docs/intro — accessed 2026-06-19. *Tier 1 (primary spec/docs). AdCP transports (MCP + A2A), agent types, adagents.json/brand.json, task vocabulary, TMP, governance-as-architecture, worked lifecycle.*\n5. Wikipedia \"Model Context Protocol\" (used only for navigation; underlying facts cite Anthropic/VentureBeat). https://en.wikipedia.org/wiki/Model_Context_Protocol — accessed 2026-06-19. *Tier 7 navigation only; not cited for substantive facts.*\n6. Model Context Protocol, \"Architecture overview\" (full data/transport/primitives + JSON-RPC example, protocol version 2025-06-18). https://modelcontextprotocol.io/docs/learn/architecture — accessed 2026-06-19. *Tier 1 (primary spec/docs). Host/client/server, data vs transport layer, stdio vs Streamable HTTP, tools/resources/prompts, sampling/elicitation/logging, lifecycle, notifications.*\n7. Anthropic, \"Donating the Model Context Protocol and establishing the Agentic AI Foundation,\" Dec 9, 2025. https://www.anthropic.com/news/donating-the-model-context-protocol-and-establishing-of-the-agentic-ai-foundation — accessed 2026-06-19. *Tier 1 (primary, but a company announcement — treated as claim of governance change). AAIF as Linux Foundation directed fund; donation date; co-founders Anthropic/Block/Open n14. VideoWeek, \"Industry Coalition Ushers in Age of Agent-to-Agent Trading with Ad Context Protocol Launch,\" Oct 15 2025; first-transaction date corroborated across coverage. https://videoweek.com/2025/10/15/industry-coalition-ushers-in-age-of-agent-to-agent-trading-with-ad-context-protocol-launch/ — accessed 2026-06-19. *Tier 5 (trade press). Launch Oct 15 2025; first agent-to-agent buy Oct 16 2025 on LG Ad Solutions inventory; initial protocols (Audience Activation, Curation, Media Buy).*\n15. MonetizeMore, \"Ad Context Protocol (AdCP): When AI Buys Your Ads.\" https://www.monetizemore.com/blog/ad-context-protocol-adcp/ — accessed 2026-06-19. *Tier 5 (vendor explainer; lean noted). \"OpenRTB for the AI era\"; four modules incl. forthcoming Curation Protocol (Q2 2026). Corroborate module list against AdCP docs [4].*\n16. eMarketer, \"New partnership seeks to evolve agent-to-agent media buying for CTV\"; plus AdCP intro [4]. https://www.emarketer.com/content/new-partnership-seeks-evolve-agent-to-agent-media-buying-ctv — accessed 2026-06-19. *Tier 5 (analytical trade). Async (seconds-to-days) vs sub-100ms RTB; agents negotiate complex deal terms with human-in-the-loop.*\n17. Ad Context Protocol docs, discovery files (`adagents.json`, `brand.json`, `get_brand_identity`). https://docs.adcontextprotocol.org/docs/intro — accessed 2026-06-19. *Tier 1 (primary docs). Discovery-file mechanics.*\n18. AdExchanger, \"The Ad Context Protocol Aims To Make Sense Of Agentic Ad Demand,\" Oct 15 2025. https://www.adexchanger.com/marketers/the-ad-context-protocol-aims-to-make-sense-of-agentic-ad-demand/ — accessed 2026-06-19. *Tier 5 (specialized trade press). Demand-side framing; natural-language briefs; \"direct\" campaigns; \"remove some unnecessary intermediary layers.\"*\n19. Ad Context Protocol docs, \"Media Buy\" + lifecycle walkthrough (`get_products` brief/refine, `create_media_buy`, `get_media_buy_delivery`, `list_creative_formats`, `build_creative`, `sync_creatives`, `check_governance`, `sync_audiences`, `get_signals`, `activate_signal`, `log_event`, `provide_performance_feedback`, `get_plan_audit_logs`). https://docs.adcontextprotocol.org/docs/media-buy/ + /docs/intro — accessed 2026-06-19. *Tier 1 (primary spec/docs). Task definitions and end-to-end flow; \"one brief, three sellers, same JSON back\"; refine mode.*\n20. PR Newswire / IAB Tech Lab, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment,\" Nov 2025. https://www.prnewswire.com/news-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment-302613712.html — accessed 2026-06-19. *Tier 1 (primary, press release — claim of release). v1.0 public comment; containerized colocated model; ~80% latency reduction claim; supporters (Index Exchange, Chalice).*\n21. ARTF Specs, \"ARTF home\" (artf.ai). https://artf.ai/ — accessed 2026-06-19. *Tier 1 (primary spec/docs). Definition; three problems (latency/complexity/data risk); OpenRTB Patch; \"up to ~80%, depending on implementation.\"*\n22. The Current, \"IAB Tech Lab, not a fan of AdCP, releases an agentic advertising framework,\" Nov 13 2025 (and AdExchanger ARTF piece same date). https://www.thecurrent.com/marketing-strategy-iab-tech-lab-adcp-agentic-advertising-framework-ai — accessed 2026-06-19. *Tier 5 (specialized trade press). Katsur criticism (\"another industry trade group\"); Heimlich \"standardize something unproven\" vs OpenRTB \"proven\"; containerization framing; article date.*\n23. ARTF Specs, \"Technical Specs\" (artf.ai/technical-specs). https://artf.ai/technical-specs — accessed 2026-06-19. *Tier 1 (primary spec/docs). Host/agent-service/container model; colocation; gRPC + Protocol Buffers; OpenRTB Patch minimal diffs + intent tags; least-privilege + host-mediated audit; \"coexist with, not replace, OpenRTB\"; 400–800ms → ~100ms.*\n24. Google Cloud, \"Announcing Agent Payments Protocol (AP2),\" Sept 16 2025. https://cloud.google.com/blog/products/ai-machine-learning/announcing-agents-to-payments-ap2-protocol — accessed 2026-06-19. *Tier 1 (primary, vendor announcement). AP2 as extension of A2A + MCP; Intent/Cart/Payment Mandates; W3C Verifiable Credentials; authorization/authenticity/accountability; 60+ partners.*\n25. AP2 search synthesis (Google Cloud blog + ap2-protocol.org). https://ap2-protocol.org/ — accessed 2026-06-19. *Tier 1/5. Announcement date; partner list (Mastercard, Amex, PayPal, Adyen, Coinbase, Etsy, JCB, UnionPay, Salesforce, ServiceNow); stablecoin rails first-class.*\n26. Agentic Commerce Protocol GitHub (agentic-commerce-protocol). https://github.com/agentic-commerce-protocol/agentic-commerce-protocol — accessed 2026-06-19. *Tier 1 (primary spec/repo). \"Maintained by OpenAI and Stripe\"; components (Agentic Checkout, Delegate Payment, Cart/Feed/Orders/Auth/MCP); release timeline incl. 2026-04-17 MCP addition; beta.*\n27. Stripe, \"Stripe powers Instant Checkout in ChatGPT and releases Agentic Commerce Protocol codeveloped with OpenAI\" + Stripe ACP docs. https://stripe.com/newsroom/news/stripe-openai-instant-checkout — accessed 2026-06-19. *Tier 1 (primary, vendor). ACP codeveloped OpenAI+Stripe; Shared Payment Token (SPT); delegate payment/auth (OAuth 2.0); live in ChatGPT Instant Checkout Sept 2025.*\n28. AdExchanger, \"Why CTV Is Becoming The First Real Test Of Agentic Advertising,\" Apr 13 2026; PR Newswire, \"Swivel and Olyzon Launch Agent-to-Agent CTV Activation via AdCP.\" https://www.adexchanger.com/on-tv-and-video/why-ctv-is-becoming-the-first-real-test-of-agentic-advertising/ — accessed 2026-06-19. *Tier 5 (trade) + Tier 1 (press release as claim). CTV \"never fit cleanly into RTB\"; seller agents encode business rules; Swivel (seller) + Olyzon (buyer) CTV activation over AdCP.*"}, {"order": 3, "file": "03_AdCP.md", "title": "The AdCP Camp — The Ad Context Protocol", "summary": "", "body": "# The AdCP Camp — The Ad Context Protocol\n\n## Bottom Line\n\nThe Ad Context Protocol (AdCP) is an open standard — built on Anthropic's Model Context Protocol (MCP) — that lets AI agents discover inventory, negotiate, buy media, build creative, activate audiences, and report performance across advertising platforms in one machine-readable language. Its consequential move is architectural. AdCP standardizes the *conversation that precedes a buy* and routes much of it through **seller agents** on the publisher's side, often **outside the real-time bidstream** that demand-side platforms (DSPs) and supply-side platforms (SSPs) were built to run.\n\nA supply-heavy coalition launched it on October 15, 2025 — Yahoo, PubMatic, Optable, Scope3, Swivel, and Triton Digital, each paying ~$10,000/year. It now claims 102+ member companies and reached version 3.1 on June 18, 2026, governed by a 501(c)(6) nonprofit (AgenticAdvertising.org) with four equally-weighted voting classes. The roster tilts conspicuously toward Connected TV (CTV) and premium publishing — Yahoo, PubMatic, Triton, LG Ad Solutions, Samba TV, Magnite — and curated/private-marketplace (PMP) CTV is its natural first proving ground, because that inventory already sells through negotiated, relationship-based deals rather than open auction.\n\nThe case against AdCP is twofold. IAB Tech Lab CEO Anthony Katsur calls it \"deeply flawed\" and \"resource-consuming\" and argues the industry does not need \"another industry trade group.\" A sharper charge — that AdCP \"went far in trying to standardize something that's unproven\" while ARTF extends the \"proven OpenRTB foundation\" — comes from ARTF's proponents rather than from Katsur himself. Separately, the seller-agent model risks swapping the DSP's transparent auction for a new, opaque negotiation black box. And beyond membership counts and demos, the adoption evidence remains thin.\n\n**What to take away: AdCP is real, fast-moving, and supply-side-led. It threatens the DSP not by out-bidding it but by moving the decision upstream of the auction. Its backers are the CTV and premium-publisher economy. And whether it complements or cannibalizes the existing programmatic stack is still genuinely unsettled.**\n\n---\n\n## 1. What AdCP Is — Answer First\n\nDigiday called AdCP \"the OpenRTB for the AI era\" [3] — a phrase that carries the whole argument, once you decode it. The project defines itself as **\"the open protocol that lets AI agents discover, plan, buy, sell, and measure media across every channel\"** as of June 2026 [1]. The GitHub repository puts it more tersely: an \"open standard for advertising automation over MCP and A2A protocols\" [2].\n\n**Decode the acronyms.** *OpenRTB* (Open Real-Time Bidding) is the IAB Tech Lab specification that, since 2010, has defined the common language for the millisecond auction at the heart of programmatic advertising — the bid request a publisher's SSP sends, the bid response an advertiser's DSP returns. *RTB* is real-time bidding itself. *DSP* (demand-side platform) is the buy-side software an advertiser or agency uses to bid; *SSP* (supply-side platform) is the sell-side software a publisher uses to offer inventory. *MCP* (Model Context Protocol) is the open standard Anthropic released in November 2024 for connecting AI models to external tools and data; it is the substrate AdCP is built on. *A2A* (Agent-to-Agent) is a parallel protocol for one autonomous agent to collaborate with another. *CTV* is Connected TV — streaming video on internet-connected televisions. *PMP* is a private marketplace — a negotiated, invitation-only programmatic deal, as opposed to the open auction.\n\nThe framing makes a precise claim. Just as OpenRTB standardized the *impression-by-impression auction*, AdCP aims to standardize the *conversation between agents* that decides what to buy, from whom, on what terms — a layer that, in AdCP's design, frequently sits **above and before** the auction rather than inside it [3][4].\n\nAdCP is an open standard that lets AI agents discover, plan, buy, sell, and measure media across channels, built to run over Anthropic's Model Context Protocol (MCP) and the Agent-to-Agent (A2A) protocol [1][2][3]. Its central function is to standardize the discovery-and-negotiation exchange that precedes a transaction; per the Media Buy documentation, this \"occurs outside real-time bidding systems through a structured, sequential workflow rather than through traditional DSPs or exchanges\" [4]. This is the protocol's most consequential design choice, though vendor interpretations differ on whether it *replaces* or *complements* the bidstream (see §5).\n\nThe spec paints the worked picture. An advertiser's buying agent calls a function named `get_products` with a plain-language brief: *\"Premium video inventory on sports and outdoor lifestyle publishers. Q2 flight, $50K budget. Adults 25-54, US and Canada\"* [4]. Each publisher's seller agent interprets that brief against its own inventory and returns standardized proposals — \"pricing, delivery forecasts, targeting options, and creative requirements — all side by side\" [4]. The buyer refines (\"Only guaranteed packages. Must include completion rate SLA above 80%\"), validates creative formats, and only then calls `create_media_buy` to transact [4]. The human buyer, as the documentation puts it, \"doesn't log into any dashboard — the protocol handles status updates,\" replacing \"four platform-specific workflows\" with one agent conversation [4].\n\n> **So what.** The unit of AdCP is not the impression and not the auction — it is the *negotiated package*, expressed in language an LLM can read and a publisher's agent can answer. That is why it threatens the DSP: the DSP's value is executing the auction; AdCP moves the consequential decision *upstream of the auction*.\n\n---\n\n## 2. The Launch Sub-Protocols — Audience Activation, Curation, Media Buy\n\n**At launch on October 15, 2025, AdCP shipped three sub-protocols: Audience Activation, Curation, and Media Buy** [5][6][7]. In plain language:\n\n- **Media Buy** — the transactional core. It lets a buyer's agent discover inventory (`get_products`), create and update a campaign (`create_media_buy`, `update_media_buy`), and pull delivery data (`get_media_buy_delivery`) across multiple sellers at once. MediaPost described it as enabling agents \"to execute and manage campaign line items across platforms\" and to support \"flexible transaction models beyond impression-based auctions\" [6][7]. This is where the seller-agent negotiation lives.\n\n- **Curation** — lets publishers and curators \"offer custom advertising products\" — assembled, packaged inventory rather than raw impressions [7]. *Curation* in ad tech means a third party (or the publisher) bundling inventory, data, and quality controls into a sellable package; it is the dominant way premium CTV and PMP inventory is sold. AdCP's curation sub-protocol gives that packaging a machine-readable expression so an agent can request and assemble it.\n\n- **Audience Activation (Signals)** — lets advertisers \"discover and activate audience segments directly from publishers\" [6], connecting third-party data providers to buyers without the custom one-to-one integrations the legacy stack requires. The current spec exposes this domain through the **Signals** protocol, with tasks `get_signals` and `activate_signal` [4][8].\n\n> **So what.** The three launch protocols map onto the three things a media buy actually needs — *who to reach* (Audience Activation), *what to buy* (Curation), and *how to transact* (Media Buy). Tellingly, two of the three (Curation, Audience Activation) are exactly the relationship-and-data-heavy functions where premium CTV and PMP deals already live — which is why CTV is AdCP's natural first ground (see §7).\n\nBy June 2026 the protocol had grown well past three. As of v3.1, the live documentation and GitHub describe a wider domain set — Media Buy, Creative, Signals, Accounts, Governance, Brand, Sponsored Intelligence, and \"Curation (coming soon)\" — plus supporting machinery: a Trusted Match Protocol, a discovery registry built on `adagents.json` files, Catalogs, and an Events/Performance feedback loop [2][8]. That jump — from three sub-protocols to roughly a dozen domains in eight months — is itself the headline fact about its viability. This is a spec under weekly construction, not a finished standard — and membership in the spec is not evidence of production adoption.\n\n---\n\n## 3. The Seller-Agent Model — Who Wins, Who Loses If DSPs Are Bypassed\n\n**This is the most consequential thing about AdCP, so take the answer first: AdCP's seller-agent model can route transactions directly between an advertiser's buying agent and a publisher's seller agent — bypassing the DSP and the open auction entirely. If that pattern scales, publishers and the foundation-model/agent layer gain; the independent DSP loses its choke-point; and a new, less-transparent negotiation layer replaces a transparent auction.**\n\n### How it works\nIn the legacy flow, an advertiser's DSP bids into an SSP's auction, impression by impression, in roughly 400–800 milliseconds. AdCP \"reverses the traditional flow,\" as MediaPost put it: \"advertiser agents communicate their needs directly to publisher agents,\" which respond with matching inventory and packages [6][7]. The consortium's own framing, per AdExchanger, is blunt — \"agentic transactions interact directly with sellers and their ad servers as true direct buys\" [9]. AdExchanger's James Hercher noted these \"agentic deals needn't be programmatic — they could include custom or offline inventory negotiated directly between agents,\" an \"alternative channel\" [9]. Scope3 co-founder Anne Coghlan put the premise plainly: \"agents need to be able to talk to each other, and they need to be able to interact\" — with human approval still required for large campaigns and creative [9].\n\nThe canonical example, repeated across coverage, is an advertiser agent prompting *\"I want to find women interested in rock climbing in the UK\"* (or \"ultramarathons on Yahoo\"), and a publisher agent answering with inventory and audience packages, with the buyer setting a performance constraint (e.g., an $80 CPA — cost-per-acquisition — ceiling) that the agents negotiate against [7][9].\n\n### Who wins if the bypass scales\n- **Premium publishers and CTV walled gardens.** They reclaim the direct-sales relationship and the data/format differentiation that the open auction commoditizes. The Equativ blog (Scope3-adjacent, vendor-lean noted) makes the case explicitly: platforms \"like Netflix and HBO Max can leverage proprietary data and unique formats without turning inventory into a commodity\" while still accessing demand from any agent-equipped buyer [10].\n- **SSPs and curators with seller agents.** PubMatic, Magnite, and curation players become the natural home for the seller agent — they already aggregate supply and now host the agent that negotiates it. This is why the founding coalition is supply-side-heavy (see §4).\n- **The foundation-model / orchestration layer.** Whoever owns the buying agent (an Anthropic- or OpenAI-class model, or a buy-side orchestrator) captures the planning decision that used to live in the DSP seat.\n\n### Who loses\n- **Independent DSPs.** Their structural value is running the auction and the optimization on top of it. If the consequential decision — which package, which publisher, what price — moves into an upstream agent conversation, the DSP is demoted to an execution utility or skipped altogether. The Trade Desk and other pure-play DSPs are the most exposed.\n- **The transparent auction itself.** RTB's signal virtue is auditability: a logged auction with a clearing price. A negotiated agent-to-agent package is, by construction, less inspectable — the seam the strongest critique pries at (see §8).\n\n> **The honest caveat.** \"Bypass the DSP\" is the *maximalist* reading of the seller-agent model, and the vendors disagree about it. Equativ argues AdCP is \"symbiotic with, not a replacement for\" the DSP — the agent secures a commitment (a digital insertion order), and \"the advertiser's existing DSP can execute the individual bids through traditional programmatic pipes or through direct insertion orders\" [10]. Scope3's Brian O'Kelley describes AdCP as the \"interface\" that traditional systems still execute upon [11]. So the design *enables* bypass; whether bypass actually happens at scale is a forecast, not a fact (taken up in the outlook).\n\nOne more design point softens the bypass picture: AdCP's governance principle of \"Embedded Human Judgment\" keeps humans in the loop on decisions with real consequences, and a governance agent escalates anything exceeding a set authority threshold (the docs use a $20K auto-approval example) [1][8][9].\n\n---\n\n## 4. The Founding Coalition — A Supply-Side, CTV-Heavy Roster\n\n**AdCP's six founding members — Yahoo, PubMatic, Optable, Scope3, Swivel, and Triton Digital — are overwhelmingly supply-side, and the broader launch roster leans hard into CTV, premium publishing, and audio.** This is not incidental: a standard that empowers seller agents was, predictably, launched by the sell side.\n\nThe founders each committed ~$10,000 annually, per AdExchanger [9]. Who they are tells you why the mix matters:\n\n- **Yahoo** — a large owned-and-operated publisher and DSP/SSP operator; brings premium display and video supply (and is a CTV/streaming demand player). A marquee, CTV-relevant name.\n- **PubMatic** — one of the largest independent SSPs, with a fast-growing CTV business and a curation product. Squarely the kind of supply aggregator the seller-agent model rewards.\n- **Triton Digital** — the dominant digital-audio ad infrastructure provider (streaming radio/podcast). Brings the audio/streaming supply side; relevant to the broader \"agentic streaming\" thesis.\n- **Optable** — a data-collaboration/clean-room and audience platform; central to the Audience Activation/Signals sub-protocol.\n- **Scope3** — Brian O'Kelley's company (he co-founded AppNexus); the spec's intellectual engine and the most visible AdCP advocate. Also a sustainability/carbon-measurement firm now positioning as agentic-advertising infrastructure.\n- **Swivel** — an agentic-advertising/AI infrastructure startup; a builder rather than a supply owner.\n\nThe launch and early-supporting roster deepens the CTV/premium tilt: **LG Ad Solutions** (smart-TV/CTV inventory and ACR data), **Samba TV** (CTV measurement and ACR — automatic content recognition, the technology that identifies what is on a TV screen), **Magnite** (the largest independent SSP, heavily CTV), **Kargo**, **Raptive**, **MiQ**, **Media.net**, **Nativo**, **Locala**, **The Weather Company**, **AccuWeather**, **Butler/Till** (agency), **Classify**, and others [5][6][7]. By June 2026 the project claimed **102+ member companies**, with later additions broadening into OEM/browser inventory (e.g., Affinity) [1][12].\n\n> **So what.** Count the CTV-relevant names: Yahoo, PubMatic, Triton (audio-CTV adjacent), LG Ad Solutions, Samba TV, Magnite. The roster is a who's-who of the premium-video and connected-screen supply economy — precisely the inventory sold through curation and PMPs, which is AdCP's natural first use case. The demand side (big agencies, The Trade Desk, the holding companies) is comparatively thin at the founding layer — a tell about who expects to gain. Trade coverage made the same point in describing AdCP as a \"supply-side consortium\" [6]. And the 102+ figure is the project's own count: membership is not the same as production deployment.\n\n---\n\n## 5. Governance — A Neutral Working Group, Not One Vendor's Standard\n\n**AdCP is governed by AgenticAdvertising.org, a nonprofit (pending/now-formed 501(c)(6) trade association) with four equally-weighted voting classes — brands, agencies, publishers, and technology providers — and an open contribution model under the Apache 2.0 license, explicitly designed so no single company controls it.** [1][2][12]\n\nThe governance design answers ad tech's original sin: standards captured by their largest beneficiary. At launch the coalition said it was \"actively forming a non-profit governing entity to ensure no single company controls the protocol's evolution,\" with representation across \"publishers, advertisers, agencies, and ad tech platforms\" and \"transparent decision-making processes\" [3]. By 2026 that entity is AgenticAdvertising.org, \"an independent nonprofit\" running \"an open Working Group that develops AdCP\" with \"four equally-weighted voting classes\" [12]. The GitHub IPR (intellectual-property-rights) policy requires contributors to agree to express patent grants under Apache 2.0 [2]. And the reference implementation is maintained by the **Prebid community**, with \"intentional separation between spec governance (AAO) and implementation development (Prebid)\" — a deliberate split of who-writes-the-rules from who-writes-the-code [2].\n\n> **So what.** The governance is genuinely more open than a single-vendor spec, and the four-class voting structure is a credible check. But the structural reality remains: the people who showed up to govern are the people who benefit (the supply side and the agent-builders). \"Neutral\" is the design intent; \"supply-weighted\" is the membership fact. Both are true.\n\n---\n\n## 6. The Roadmap — Creative, Performance, and a v4.0 Signing Floor\n\n**AdCP's roadmap, as of mid-2026, points toward deeper creative generation, expanded performance/attribution, and a v4.0 (targeted early 2027) that will make request-signing mandatory for any spend-committing operation.** [2][13]\n\nThe trajectory is visible in two places. First, the spec's own domain expansion already delivered a **Creative** protocol (`list_creative_formats`, `build_creative`, `sync_creatives`) that \"pulls brand guidelines automatically\" from a publishable `brand.json` and produces assets matched to each seller's specs from a single brief [8], plus an **Events/Performance** loop (`log_event`, `provide_performance_feedback`) that \"closes the optimization loop by reporting conversions and performance metrics back to sellers\" [8]. These are exactly the \"creative generation\" and \"performance attribution expansion\" items the roadmap was expected to carry into 2026 — and by v3.1 they are shipped or in progress, not aspirational [2][8].\n\nSecond, the formal roadmap sorts eleven protocol areas into \"Exploring / Accepted / In Progress / Shipped\" stages, with one explicitly dated future milestone: **v4.0 (target early 2027)**, \"the next breaking-changes accumulation window,\" whose floor requirement is mandatory request signing — \"Agents MUST sign spend-committing operations; sellers MUST verify\" [13]. That security hardening is the clearest signal that AdCP's authors expect real money to flow through it.\n\n> **So what.** The roadmap's direction — automated creative, closed-loop attribution, and cryptographic signing of spend — is the roadmap of something trying to become production payment infrastructure, not a demo. Whether it gets there is the open question; the *intent* is unambiguous.\n\n---\n\n## 7. The CTV Angle — Why Curated/PMP CTV Is AdCP's Natural First Ground\n\n**Curated and PMP-heavy CTV is AdCP's most natural first proving ground because that inventory is already sold the way AdCP works — through negotiated, relationship-based, packaged deals rather than open-auction impressions.** The protocol's design and CTV's market structure fit each other almost exactly.\n\nThe argument has three legs:\n\n1. **CTV is already a negotiation business, not an auction business.** A large share of premium CTV — the marquee streamers, the broadcaster apps — transacts through direct deals and PMPs, with floors, guarantees, and curated audience packages, precisely because publishers refuse to commoditize scarce premium video in an open auction. AdCP's seller-agent + Curation model is a machine-readable version of the deal CTV sellers already strike by email and insertion order [4][7][10].\n\n2. **CTV's value is data and format differentiation — which AdCP preserves.** The Equativ framing (vendor-lean noted) captures the appeal to streamers: Netflix- and HBO Max-class platforms can \"leverage proprietary data and unique formats without turning inventory into a commodity\" while still reaching any agent-equipped buyer [10]. ACR (automatic content recognition) data and identity signals — the heart of CTV addressability — are exactly the kind of audience signal the Audience Activation/Signals sub-protocol is built to activate [6][8]. The presence of ACR-native members (Samba TV, LG Ad Solutions) on the roster is the tell.\n\n3. **The roster is the CTV/premium economy.** As §4 showed, the people who launched AdCP — Yahoo, PubMatic, Triton, LG Ad Solutions, Samba TV, Magnite — are the connected-screen and premium-video supply economy. They built the protocol for the inventory they sell.\n\n> **So what.** AdCP does not have to win the open programmatic auction (OpenRTB's home turf) to matter. It can win where the auction never fully reached — curated, premium, relationship-sold CTV — and grow from there. That is also its strategic safety: it starts in the part of the market least defended by the incumbent OpenRTB/DSP stack.\n\n---\n\n## 8. The Strongest Case Against AdCP — Critical Voice\n\nAn account that only sells is propaganda. Here is the strongest case against AdCP, in the words of its most credible critic.\n\n**Critique 1 — \"Deeply flawed\" and \"resource-consuming\" (IAB Tech Lab).** Anthony Katsur — CEO of the standards body that owns OpenRTB, AdCOM, and VAST — has called AdCP \"deeply flawed\" and \"resource-consuming\" [14]. His structural argument: the industry does not need \"another industry trade group,\" the Tech Lab \"already addresses some of the issues AdCP is trying to tackle,\" and \"agentic execution is already part of how digital advertising operates today\" [14][15]. Most pointedly, the two camps' foundations are contrasted: IAB's own framework — ARTF, the Agentic RTB Framework, now under the AAMP umbrella (Agentic Advertising Management Protocols) — \"builds on the proven OpenRTB foundation,\" whereas AdCP \"went far in trying to standardize something that's unproven.\" That specific framing comes from ARTF's proponents rather than from Katsur directly [15]. The implicit charge is reinvention: AdCP rebuilds, in a new and untested layer, coordination that OpenRTB already does in production at trillions-of-requests scale. (The full ARTF/AAMP case is taken up later, in the chapter on the IAB Tech Lab camp; the standards-war politics in the chapter on the standards war.)\n\n**Critique 2 — Bypassing the bidstream trades a transparent auction for an opaque negotiation.** The very property that makes AdCP appealing to publishers — moving the decision out of the auction and into a seller-agent conversation — is what worries auction defenders. RTB's signal virtue is auditability: a logged auction with a clearing price you can inspect. An agent-to-agent negotiated package is, by construction, harder to audit. One anonymous DSP executive told The Current that agentic AI should be \"an additional layer that sits above programmatic execution,\" where strategy happens, while \"auctions continue to execute deterministically underneath\" — do not let the agents *replace* the transparent auction [16]. The risk is not that AdCP fails. It is that AdCP succeeds, and the price discovery and transparency of the open auction are quietly lost upstream.\n\n**Critique 3 — Seller agents may become new black boxes.** If the consequential decision — which package, what price — moves into a publisher-controlled seller agent, the buyer's visibility into *why* it got the price and inventory it got depends on the seller's agent: a new intermediary with its own incentives, sitting where the nominally neutral auction used to be. A protocol that promises to remove black boxes (custom integrations, opaque take-rates) could install a different one. AdCP's own answer is \"Embedded Human Judgment\" and, on the roadmap, mandatory signing [1][13] — but those are governance promises and future features, not deployed guarantees.\n\n**Critique 4 — The adoption evidence is thin.** This is the honest point about whether AdCP is yet a going concern. What is *firmly* established: a fast-growing membership list (102+), a maturing spec (v3.1), a real governance body, working demos. What is *not* established in the public record is production scale — dollar volume transacted through AdCP, the count of live seller agents handling real money, independent (non-member) confirmation of campaigns run end-to-end at scale. The Equativ blog concedes the protocol is \"currently in its early stages\" [10]. Trade coverage repeatedly notes its youth, and the pattern that, in Digiday's words, \"the history of ad tech is littered with well-intentioned standards that became dominated by a handful of powerful players\" [3]. Membership and version numbers measure *commitment and construction*, not *adoption*. Do not conflate the two.\n\n> **The fair synthesis.** AdCP's critics are not arguing it cannot work. They argue two things: that it re-litigates coordination OpenRTB already provides, on an unproven base; and that its core move — out of the auction, into the agent — risks trading transparency for convenience. Its defenders answer that the auction was never the right venue for premium, relationship-sold, curated CTV in the first place, and that a standardized agent layer beats the proprietary one each platform would otherwise build. Both are partly right. The unresolved question is empirical: does real money flow through AdCP at scale, and does it stay auditable when it does?\n\n---\n\n## 9. Current Status, Dated\n\nEvery present-tense status below is a discrete factual claim about the situation as of mid-2026 (Oct 2025 – Jun 2026). This space versions weekly.\n\n| Item | Status as of mid-2026 | Most recent dated confirmation | Flag |\n|---|---|---|---|\n| AdCP exists as a live open standard | Live | adcontextprotocol.org / GitHub, current (accessed Jun 19, 2026) [1][2] | — |\n| Current spec version | v3.1.0 | GitHub release dated Jun 18, 2026 [2] | One day before access — fresh |\n| Prior major version | v3.0 | AgenticAdvertising.org, ~Apr 23, 2026 [12] | — |\n| Next major version | v4.0 targeted early 2027 (mandatory signing) | Roadmap page [13] | A plan, not shipped |\n| Membership count | 102+ companies | Project site (accessed Jun 19, 2026) [1][12] | Project's own count |\n| Governing body | AgenticAdvertising.org, 501(c)(6) (pending→formed) | GitHub/site [2][12] | Status of nonprofit formation may be in transition |\n| Founding members | Yahoo, PubMatic, Optable, Scope3, Swivel, Triton Digital | MediaPost/AdExchanger, Oct 15, 2025 [5][9] | Founding fact, stable |\n| Reference implementation | Maintained by Prebid community | GitHub README [2] | — |\n| Rival framework status | IAB Tech Lab ARTF v1.0 (public comment Nov 13, 2025); AAMP umbrella named Feb 26, 2026 | AdExchanger/PRNewswire/PPC Land [17][18] | Live rivalry; see the chapter on the IAB Tech Lab camp |\n| Production adoption at scale | Not independently verified | — (absence) [3][10] | Load-bearing caveat |\n\nFor the record on the rival camp: IAB Tech Lab released ARTF v1.0 for public comment on Nov 13, 2025, and named its umbrella initiative AAMP (Agentic Advertising Management Protocols) on Feb 26, 2026, with the former User Context Protocol rebranded \"Agentic Audiences\" [17][18] — detailed later, in the chapter on the IAB Tech Lab camp.\n\n---\n\n## Open Questions\n\n1. **What dollar volume has actually transacted through AdCP?** Membership (102+) and version (v3.1) are confirmed; production scale is not. The single most important unverified number here.\n2. **Complement or cannibalize?** Does AdCP settle as a negotiation layer *above* DSP execution (the Equativ/O'Kelley \"interface\" reading), or does the seller-agent model genuinely route around DSPs at scale? This is the forecast hinge for the DSP business (taken up in the outlook).\n3. **Does the auction's transparency survive the move upstream?** If price discovery moves into seller agents, what auditability replaces the logged clearing price? AdCP's mandatory-signing roadmap (v4.0) is a partial answer; whether it suffices is open.\n4. **How CTV-real is the CTV thesis?** Are premium streamers (Netflix, Disney, etc.) actually deploying AdCP seller agents, or is the CTV affinity still mostly roster composition and vendor framing? (Taken up later, in the chapter on agentic advertising in CTV.)\n5. **Does AdCP converge or collide with IAB's AAMP/ARTF?** Both run over MCP/A2A; both claim coexistence in some statements and rivalry in others. Standards wars usually end in one winner, a split, or a merge — which is this? (Taken up later, in the chapters on the IAB Tech Lab camp and the standards war.)\n6. **Governance capture risk.** The four-class voting structure is designed to prevent single-vendor control, but the membership is supply-weighted and Scope3-influential. Does neutral governance survive contact with concentrated interest?\n\n---\n\n## Sources\n\n1. AdCP project site, \"Ad Context Protocol\" (adcontextprotocol.org), homepage definition, member count, \"Embedded Human Judgment\" governance. Accessed Jun 19, 2026. https://adcontextprotocol.org/ — *Tier 1 (primary, the project's own spec/site); treat self-description as claim.*\n2. GitHub, adcontextprotocol/adcp repository (README, version v3.1.0 dated Jun 18, 2026, Apache 2.0, governance, Prebid reference implementation, protocol domains). Accessed Jun 19, 2026. https://github.com/adcontextprotocol/adcp — *Tier 1 (primary; authoritative for the spec's own version/contents).*\n3. Digiday, \"WTF is Ad Context Protocol (AdCP)?\", Oct 15, 2025. https://digiday.com/media-buying/wtf-ad-context-protocol/ — *Tier 5 (specialized trade press); \"OpenRTB for the AI era,\" disintermediation, the standards-capture caution.*\n4. AdCP documentation, Media Buy protocol and docs (docs.adcontextprotocol.org), seller-agent negotiation workflow, `get_products`/`create_media_buy`, \"outside real-time bidding systems,\" \"true direct buys\" framing. Accessed Jun 19, 2026. https://docs.adcontextprotocol.org/ — *Tier 1 (primary spec).*\n5. MediaPost (Laurie Sullivan), \"Yahoo, PubMatic, Others Form Coalition To Launch Agentic Ad Protocol,\" Oct 16, 2025. https://www.mediapost.com/publications/article/409904/ — *Tier 5 trade press; founding members, three launch protocols.*\n6. MediaPost / MediaDailyNews, \"Supply-Side Consortium Unveils Agentic Ad Protocol, Invites Ad Industry To Join,\" Oct 2025. https://www.mediapost.com/publications/article/409904/ — *Tier 5; \"supply-side consortium\" framing, \"reverses the traditional flow.\"*\n7. Samba TV press release (member), \"Industry Coalition Launches Ad Context Protocol (AdCP),\" Oct 15, 2025. https://www.samba.tv/press-releases/industry-coalition-launches-ad-context-protocol-adcp-open-standard-for-agentic-advertising-infrastructure — *Tier 1 as a member claim (NOT proof); founding/launch roster, three sub-protocols, governance plan.*\n8. AdCP documentation, protocol domains overview (Media Buy, Creative, Signals, Accounts, Governance, Brand, Trusted Match, Discovery/Registry, Catalogs, Events/Performance), transport over MCP and A2A. Accessed Jun 19, 2026. https://docs.adcontextprotocol.org/ — *Tier 1 (primary spec).*\n9. AdExchanger (James Hercher), \"The Ad Context Protocol Aims To Make Sense Of Agentic Ad Demand,\" Oct 15, 2025. https://www.adexchanger.com/marketers/the-ad-context-protocol-aims-to-make-sense-of-agentic-ad-demand/ — *Tier 5 trade press; $10K fee, \"true direct buys,\" Anne Coghlan quote, direct/offline-inventory point.*\n10. Equativ blog, \"What Is Ad Context Protocol (AdCP) and How Is It Shaping Programmatic?\", ~Feb 2026. https://www.equativ.com/blog/ad-context-protocol-adcp-programmatic — *Tier 5/6 vendor blog (Scope3-adjacent — lean noted); \"symbiotic with, not replacement for\" DSP, Netflix/HBO Max framing, \"early stages.\" Position-evidence, not neutral fact.*\n11. The Current (Travis Clark), \"Agentic AI is the new advertising battleground. Does it have to be?\", Jan 28, 2026 (ed. Jun 19, 2026). https://www.thecurrent.com/marketing-strategy-adcp-agentic-ai-new-advertising-battleground-digital — *Tier 5 (The Trade Desk-owned outlet — lean noted); O'Kelley \"interface\" framing, \"solve for different problems.\"*\n12. AgenticAdvertising.org / search-surfaced governance and membership descriptions (nonprofit, four equally-weighted voting classes, open Working Group, 102+ members, AdCP 3.0 ~Apr 23, 2026). Accessed Jun 19, 2026. https://agenticadvertising.org/ — *Tier 1 (project's own governance description); claim-status.*\n13. AdCP documentation, Roadmap (Exploring/Accepted/In Progress/Shipped; v4.0 target early 2027 with mandatory request signing). Accessed Jun 19, 2026. https://docs.adcontextprotocol.org/docs/reference/roadmap — *Tier 1 (primary; a stated plan).*\n14. The Current / MediaPost (Katsur quotes), \"deeply flawed\" and \"resource-consuming\" characterization of AdCP. ~Nov 2025–Feb 2026. https://www.thecurrent.com/marketing-strategy-iab-tech-lab-adcp-agentic-advertising-framework-ai — *Tier 5; direct attribution to a named, interested party (IAB Tech Lab CEO).*\n15. The Current (Travis Clark), \"IAB Tech Lab, not a fan of AdCP, releases an agentic advertising framework,\" Nov 13, 2025. https://www.thecurrent.com/marketing-strategy-iab-tech-lab-adcp-agentic-advertising-framework-ai — *Tier 5; \"another industry trade group,\" \"proven OpenRTB foundation,\" \"unproven,\" containerization.*\n16. The Current (Travis Clark), AdCP-vs-ARTF coverage, Jan 28, 2026, anonymous DSP-executive quote (\"additional layer that sits above programmatic execution\"). https://www.thecurrent.com/marketing-strategy-adcp-agentic-ai-new-advertising-battleground-digital — *Tier 5; anonymous-exec quote = position-evidence.*\n17. AdExchanger (Joanna Gerber), \"The IAB Tech Lab Releases Its First Framework For Agentic Ad Buying Standards,\" Nov 13, 2025. https://www.adexchanger.com/platforms/the-iab-tech-lab-releases-its-first-framework-for-agentic-ad-buying-standards/ — *Tier 5; ARTF v1.0 public comment, containerization, Katsur quote on containerizing the architecture.*\n18. PPC Land, \"IAB Tech Lab names its agentic ad initiative AAMP to end market confusion,\" ~Feb 2026; PRNewswire, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment,\" Nov 13, 2025. https://ppc.land/iab-tech-lab-names-its-agentic-ad-initiative-aamp-to-end-market-confusion/ — *Tier 5 + Tier 1 press release; AAMP naming (Feb 26, 2026), three pillars, \"Agentic Audiences\" rebrand of User Context Protocol.*\n\n*Note on sourcing: AdCP is <12 months old and versioned weekly; the highest-tier sources here are the primary spec/GitHub/site (Tier 1, but self-descriptive — read as claims), corroborated by Tier 5 specialized trade press. No Tier 1–4 independent audit of production adoption exists in the public record as of mid-2026 — the single most important sourcing gap, flagged throughout.*"}, {"order": 4, "file": "04_ARTF_AAMP.md", "title": "The IAB Tech Lab Camp — ARTF and AAMP", "summary": "", "body": "# The IAB Tech Lab Camp — ARTF and AAMP\n\n## Bottom Line\n\nThe upstart **AdCP** (Ad Context Protocol) coalition proposed a deal *language* for AI agents. The IAB Tech Lab — the digital-advertising industry's incumbent standards body — answered by changing where the auction physically runs. Its flagship is the **Agentic Real-Time Framework (ARTF)**: a containerized execution model that lets a DSP, SSP, or data vendor ship its bidding logic as a sandboxed container that runs *inside the auction host's own data center* — \"colocation\" — instead of pinging a request across the public internet between separate clouds. The pitch is speed. The Tech Lab claims ARTF can cut bid request/response latency \"up to ~80%,\" a figure trade press rendered as \"600–800ms down to ~100ms.\" **That headline number is an IAB design target, not an independently measured result, and the Lab's own materials cite at least three mutually inconsistent figures** (the ~100ms round-trip headline; \"low to sub-millisecond\" container response in the technical blueprint; contributor Index Exchange's separate \"up to 95%\" / \"under 10ms\" claim) — partly because they measure different things, partly because no one outside the vendors has published a benchmark.\n\nARTF does **not** replace OpenRTB, AdCOM, or VAST — it extends them. Agents return changes as \"OpenRTB Patch\" deltas, the host decides which to apply, and the wire format leans on existing IAB taxonomies. That continuity is the whole strategic point: it keeps the bidstream, and the DSP→SSP→exchange supply chain, at the center of the agentic era rather than letting an agent-to-agent negotiation layer route around it. ARTF sits inside a broader umbrella the Lab named **AAMP (Agentic Advertising Management Protocols)** on **February 26, 2026** — three pillars (execution / protocols / trust) spanning ARTF, **Agentic Audiences** (the embeddings-based audience-signal schema LiveRamp donated as the \"User Context Protocol\" on Nov 3, 2025), an **Agent Registry** (launched March 1, 2026), and buyer/seller agent SDKs shipped in **AAMP 2.0 on April 29, 2026**. The strongest critiques do not deny that latency matters. They say ARTF *solves the wrong problem* — it optimizes execution speed while the unsolved problems are measurement, accountability, and identity — and that \"agentic\" is a misnomer: ARTF's containers *propose*, the incumbent host *decides*, which entrenches rather than disrupts the existing intermediary stack.\n\nFor CTV (Connected TV — internet-delivered television), the colocated clean-room angle is the real draw: a streaming seller wary of leaking show-level viewing data into the open bidstream can let a buyer's logic run *next to* that data inside a sealed container, with no external network egress — collaboration without exposure. Does that materially improve the CTV buy, or simply hard-wire the walled gardens' data advantage into the spec? That is the question these pages leave for the chapters on the standards war and on agentic advertising in CTV.\n\n---\n\n## 1. What ARTF Is — and the One Idea That Makes It Work\n\n**Answer first:** ARTF is a *deployment architecture* for real-time bidding, not a new bidding language. Its single load-bearing idea is **colocation**: run the other party's code inside your own data center instead of calling it over the network.\n\n### 1.1 Decode the acronyms\n\n- **ARTF** — Agentic Real-Time Framework. (Originally announced as the \"Agentic **RTB** Framework\"; the Tech Lab quietly broadened \"RTB\" to \"Real-Time\" as the scope grew beyond pure auction bidding. Both expansions appear in 2025–2026 materials and refer to the same spec.) [1][2][8]\n- **RTB** — Real-Time Bidding: the millisecond auction that decides which ad fills an ad slot the instant a page or stream loads.\n- **DSP / SSP** — Demand-Side Platform (buys on advertisers' behalf) and Supply-Side Platform (sells on publishers' behalf). Today they run in separate companies' separate data centers and talk over the internet.\n- **OpenRTB** — the IAB's dominant open auction protocol; the JSON message format DSPs and SSPs exchange. **AdCOM** — Ad Common Object Model, the shared data dictionary OpenRTB uses. **VAST** — Video Ad Serving Template, the XML standard for serving video/CTV ads.\n- **MCP** — Model Context Protocol, Anthropic's open standard (Nov 2024) for connecting LLM-based agents to tools and data; ARTF names it as a supported interface. **A2A** — Agent-to-Agent, Google's protocol for agents talking to each other; also named as supported. [1][8]\n\n### 1.2 Colocation in plain language — and why it speeds things up\n\nPicture today's auction. A viewer loads a streaming app, and the publisher's SSP sends a bid request. Before the auction can settle, that request often bounces to several outside services — an identity resolver, a fraud checker, a curation/deal layer, a data enricher — each living in a *different company's cloud*. Every hop is a round trip across the public internet: DNS lookup, TLS handshake, transit latency, queueing, a response back. Stack four or five of those and you have burned most of the ~100–300ms an auction gets before the player must show *something*. [3][6][9]\n\nARTF's move is to stop the bouncing. Instead of *calling out* to a vendor's cloud, the host platform lets the vendor package its logic as a **container** — a small, self-contained, portable software unit (think: the vendor's \"black box\" of identity-matching or fraud-scoring code) — and runs that container **on the host's own machines, in the same data center, sometimes the same physical server or virtual machine** as the auction itself. The conversation that used to cross the internet becomes a local function call between processes sitting inches apart. [1][3][6]\n\nWhy that is faster, in one sentence: **you remove the network from the critical path.** No internet transit. No repeated TLS handshakes. No cloud-egress hops. Contributor Index Exchange's chief architect Joshua Prismon framed the value proposition as: \"We want you to take your black box — the magic that you do really well — and express a series of changes\" — without each party rebuilding the other's infrastructure. [3][6] Index Exchange's own explainer puts it: participants \"run their logic locally — in the same data center as the auction — using secure, portable containers.\" [7]\n\nA secondary speedup comes from the wire format. ARTF specifies **gRPC with Protocol Buffers (protobuf)** for host↔container messaging rather than the JSON-over-HTTP that OpenRTB traditionally uses. The Tech Lab's own technical blueprint argues protobuf \"is considerably more space and time efficient than JSON,\" with built-in validation. [10][13]\n\n### 1.3 The mechanics: propose, decide, patch\n\nThe flow ARTF defines is deliberately asymmetric — and this asymmetry is the heart of both its appeal and its critique:\n\n1. An impression triggers a bid request inside the host (the SSP/exchange).\n2. The host makes a local API call to each applicable agent container, handing it the request. [7]\n3. Each container processes and returns a **proposed mutation** — expressed as an **OpenRTB Patch**: a collection of atomic \"mutations\" that reference paths within the OpenRTB object (add an audience segment, activate a deal ID, adjust a floor price, attach a signal), each tagged with a declared **intent** (e.g., \"identity resolution,\" \"fraud detection,\" \"deal activation,\" \"price adjustment\"). [7][10][13]\n4. **The host decides** which mutations to merge into the live bid request, applying its own policies and least-privilege data access. The container *cannot* unilaterally change the auction. [10][13]\n\nTwo design choices matter for later sections. First, **mutation paths use \"semantic references\" derived from OpenRTB concepts rather than explicit data-layout paths** — the spec expresses changes \"in terms of auction semantics rather than data layout,\" which is what lets ARTF claim to extend OpenRTB rather than fork it. [13][15] Second, the containers are **OCI-compliant** (the open container standard, i.e., Docker/Kubernetes-class), \"dropped in\" to host networks and orchestrated via Kubernetes, Docker Compose, or cloud services like Amazon ECS. [10][15]\n\n---\n\n## 2. The Latency Claim — Treated as Load-Bearing and Scrutinized\n\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">ARTF&#x27;s latency claim — an IAB design target, not a benchmark<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">200<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">400<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">600<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">800<\/text><rect x=\"188.5\" y=\"45.2\" width=\"56.0\" height=\"204.8\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"216.5\" y=\"39.2\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">700 ms<\/text><text x=\"216.5\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 216.5 268.0)\">Typical today…<\/text><rect x=\"501.5\" y=\"220.8\" width=\"56.0\" height=\"29.2\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"529.5\" y=\"214.8\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100 ms<\/text><text x=\"529.5\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 529.5 268.0)\">ARTF target<\/text><\/svg><figcaption>The &#x27;~80% / ~100ms&#x27; figure is single-camp-sourced; baselines are cited inconsistently (400–800ms). Plotted midpoint ~700ms. <span class=\"credit\">Source: IAB Tech Lab / artf.ai (design target; no published independent benchmark).<\/span><\/figcaption><\/figure>\n\n\n\n**Answer first:** The famous \"up to 80% / ~100ms\" number is an **IAB Tech Lab design target, attributed to the Tech Lab, with no published independent benchmark.** The figure is plausible *in principle* — removing network hops genuinely saves time — but it should be treated as a vendor/standards-body claim, because (a) no third party has measured it, (b) the Lab's own materials cite at least three different numbers that don't reconcile cleanly, and (c) the baseline \"before\" figure is itself reported inconsistently (400–600ms, 400–800ms, and 600–800ms all appear).\n\n### 2.1 What the primary sources actually say\n\nThe cleanest official statement is on the spec site, **artf.ai**: ARTF \"is designed to reduce bid request/response times by up to approximately 80%, from typical ranges of several hundred milliseconds to around 100 ms, depending on implementation.\" Its technical-specs page renders the same as \"from typical ranges of 400–800 ms down to roughly 100 ms, subject to implementation.\" [2][15] The hedges — \"designed to,\" \"up to approximately,\" \"subject to implementation\" — earn their keep: this is an engineering aspiration, not a measured outcome.\n\nThe **November 13, 2025 press release** is even more cautious: ARTF is \"designed to reduce the current time for bid requests and responses up to 80%\" — and crucially **contains no millisecond figures at all.** [1] CEO Anthony Katsur's quoted language is qualitative (\"near-instantaneous media trading,\" \"a fundamental step toward modernizing how systems interact in real time\"). [1]\n\n### 2.2 Where \"600–800ms → 100ms\" came from\n\nThe specific \"600–800ms → ~100ms\" framing is a **trade-press rendering**, most cleanly in MarTech's Nov 13, 2025 write-up, which states verbatim: \"ARTF can reduce bid request-response latency by up to 80%, cutting round-trip times from 600–800ms to approximately 100ms\" — and explicitly attributes it: \"**According to th
