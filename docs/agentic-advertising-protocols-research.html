e Tech Lab**, ARTF can reduce…\" [9] So even where the precise numbers appear, they are sourced to the IAB, not to a measurement.\n\n### 2.3 The baseline doesn't agree with itself\n\nThe \"before\" number is reported three different ways across reputable trade outlets, all in the same news cycle:\n\n- **AdExchanger** (Nov 2025): Katsur says \"typical ad serving response times are between **400 and 600 milliseconds**,\" and ARTF \"should cut down that response time\" — **no post-ARTF figure given.** [3]\n- **Digiday** (Nov 2025): \"from **400–600 milliseconds** to 'a fraction of that'\" — again, no precise endpoint. [6]\n- **MarTech / aggregations** (Nov 2025): \"**600–800ms** to approximately 100ms.\" [9]\n- **artf.ai technical specs**: \"**400–800 ms** down to roughly 100 ms.\" [15]\n\nA claim whose own baseline ranges from 400ms to 800ms depending on the outlet is a claim that has not been pinned to a measurement protocol.\n\n### 2.4 The vendor numbers don't agree with the IAB number either\n\nThe most striking inconsistency is internal to the camp:\n\n- **IAB headline:** ~80% reduction, end-to-end round trip to ~100ms. [2][9][15]\n- **Index Exchange** (ARTF co-author, SSP — disclose the conflict: it benefits as a host platform): \"up to **95%**\" reduction, with \"the entire container execution and decision cycle completing **in under 10 milliseconds**.\" [7]\n- **IAB Tech Lab's own technical blueprint** (\"Breaking Down the Walls,\" authored by IAB's Miguel Morales): \"low to **sub-millisecond** response times compatible with real-time bidding requirements.\" [10]\n\nThese are not small discrepancies — 100ms vs. 10ms vs. sub-1ms span two orders of magnitude. The likely reconciliation is that they **measure different things**: the ~100ms figure is an end-to-end *round trip* (request issued → enriched response back, including the host's own work), Index Exchange's \"<10ms\" is the *container execution + decision cycle* in isolation, and \"sub-millisecond\" is the *local function-call overhead* of the host↔container hop versus an internet round trip. That reading is charitable and probably correct — but it means the headline \"80% / 100ms\" and the \"95% / <10ms\" are not the same metric, and the spec publishes no single, defined, reproducible measurement. **No external party has benchmarked ARTF.**\n\n### 2.5 The honest verdict on the number\n\nDirectionally credible, specifically unverified. Remove network round trips and latency falls — that is basic distributed-systems physics, and edge- and colocated-compute analogues bear it out. But \"up to 80%\" is a ceiling, not a typical result (\"up to\" + \"subject to implementation\"); the realized gain depends entirely on how many network hops a given auction currently makes, and an auction already running mostly in-house saves little; and the precise figures are IAB/vendor claims awaiting independent confirmation. **It is best read as an IAB design target, not as an established performance result.**\n\n---\n\n## 3. How ARTF Extends — Rather Than Replaces — OpenRTB, AdCOM, VAST\n\n**Answer first:** ARTF deliberately layers *on top of* the IAB's existing standards. That continuity is its core strategic argument against AdCP: incumbents keep their investment, their wire formats, and their position in the chain.\n\n### 3.1 The extension, concretely\n\nThe spec is explicit that ARTF \"is designed to **coexist with, not replace, OpenRTB.**\" [15] Rather than inventing a new bid object, agents return **OpenRTB Patch** deltas against the existing OpenRTB request/response — additions, changes, deletions to specified portions, each tagged with an intent. [7][13] Mutation paths reference **AdCOM/OpenRTB semantic concepts**, so the changes speak the existing data dictionary. [13][15] More broadly, the Tech Lab says AAMP \"builds upon existing IAB standards including OpenDirect, Deals API, AdCOM, and OpenRTB taxonomies (Content, Audience, Privacy).\" [11] ARTF's own materials note applicability \"across various advertising channels including display, video, connected television, and digital out-of-home\" — the same surfaces VAST already serves, with VAST creatives unchanged underneath. [13]\n\n### 3.2 What continuity buys the incumbents\n\nThis is the standards-politics heart of the matter, stated plainly:\n\n- **No rip-and-replace.** A DSP or SSP that has spent a decade on OpenRTB integrations does not throw them away; ARTF wraps them. Adam Heimlich (CEO, Chalice, an ARTF contributor) contrasted this with AdCP's attempt to \"standardize something that's unproven,\" positioning ARTF as built on the \"proven\" programmatic ecosystem. [4]\n- **The bidstream stays central.** Because the unit of change is an *OpenRTB Patch to a bid request*, the agentic action happens *inside the auction*, not in a separate negotiation that could bypass it. The supply chain (and its take-rates) is preserved by construction.\n- **The Lab keeps the pen.** Extending its own standards keeps governance, versioning, and the GitHub repos under IAB Tech Lab control rather than ceding the field to an outside working group. (Taken up later, in the chapter on the standards war.)\n\nKatsur's framing of why this matters: \"The fastest and smartest way forward is to build on an existing shared foundation, not introduce multiple new standards that create fragmentation.\" [16]\n\n---\n\n## 4. The AAMP Umbrella — Organizing the Lab's Agentic Work\n\n**Answer first:** AAMP is the brand and governance container for *all* of the Tech Lab's agentic work. The Lab created it to stop the market from mistaking ARTF + Agentic Audiences for the *whole* program. It has three pillars.\n\n### 4.1 What AAMP is and why it was named\n\nOn **February 26, 2026**, IAB Tech Lab formally named its umbrella agentic initiative **AAMP — Agentic Advertising Management Protocols.** Katsur's stated reason was \"confusion in the market\": observers had been treating ARTF and the Agentic Audiences Framework \"as the sum total of the organization's agentic work,\" which \"is not accurate.\" [12][17] Hence the tagline: \"Standards for Agentic Advertising, powered by the same proven Standards that power the ecosystem today.\" [11]\n\n### 4.2 The three pillars\n\nPer the IAB Tech Lab standards page and the AAMP-naming coverage: [11][12]\n\n**Pillar 1 — Agentic Foundations (execution).** High-performance delivery infrastructure. This is where **ARTF** lives (\"how agent services can safely and deterministically operate inside advertising systems, including real-time bidding environments, cutting latency by 80%\"), alongside **Agentic Guardrails** (sandboxing, cryptographic verification, intent declarations — still in development as of the Feb 2026 naming). [11][12]\n\n**Pillar 2 — Agentic Protocols (management).** \"Schemas, tools, and reference implementations for integrating Agentic AI technology into buyer, seller, and adtech provider systems,\" covering discovery, negotiation, transaction. The Feb 2026 coverage enumerates seven protocol components, each mapping an agentic capability onto an existing IAB standard: [12]\n\n| Agentic component | Built on (existing IAB standard) |\n| --- | --- |\n| Agentic Audiences | User Context Protocol (donated by LiveRamp) |\n| Agentic Ad Objects | AdCOM |\n| Agentic Direct | OpenDirect |\n| Agentic Deals | Deals API |\n| Agentic Bid | OpenRTB |\n| Agentic Creative | (creative \"Readiness\") |\n| Agentic Mobile | CloudX |\n\n**Pillar 3 — Trust and Transparency.** The **Agent Registry** — \"neutral agent transparency and accountability,\" \"a trusted framework for agent identity, verification, and disclosure.\" [11][12]\n\n### 4.3 Agentic Audiences (née User Context Protocol / UCP)\n\n**Answer first:** Agentic Audiences is a schema for how agents exchange *audience signals* — and its distinctive bet is to do so as **embeddings** (numeric vectors) rather than text, to be fast enough for RTB.\n\n- **Provenance and date.** LiveRamp (the identity-resolution company) **donated** the **User Context Protocol (UCP)** to IAB Tech Lab on **November 3, 2025**; it was renamed **Agentic Audiences** and folded into AAMP. The repo moved to IAB Tech Lab's GitHub (last spec update Jan 28, 2026). [14][18][19]\n- **What it standardizes.** \"How intelligent agents in advertising exchange signals — identity, contextual, and reinforcement information\" representing \"a consumer's real-time intent and response to advertising.\" [18]\n- **The embeddings bet.** Rather than slow text-based exchanges, Agentic Audiences uses **embeddings**: \"compact, learned vector representations,\" **256–1,024 dimensions**, that compress many data points into a dense vector enabling \"sub-100ms response times required for real-time bidding.\" It defines \"shared embedding structures, dimensional alignment, and vector-space identity.\" [14][18][19]\n- **Governance.** A \"lightweight Commit Group\" governs development, integrating the Data Transparency Standard, Global Privacy Protocol, and the Transparency & Consent Framework. LiveRamp SVP Travis Clinger framed the donation around needing \"governance that evolves in lockstep with innovation.\" [18][19]\n- **As of AAMP 2.0** (April 2026), Agentic Audiences ships as a new **OpenRTB community extension** plus a **Prebid module** (merged into Prebid core) and an open-source \"scorer\" tool for processing embeddings and matching relevance. [20][22]\n\n---\n\n## 5. Timeline and Current Status (dated sources)\n\n**Answer first — as of June 19, 2026:** ARTF v1.0 is **finalized** (public comment closed Jan 15, 2026; \"final\" PDF posted March 2026), **v2.0 is underway**; AAMP reached **2.0 on April 29, 2026** with live buyer/seller SDKs; the Agent Registry is **live** (launched March 1, 2026).\n\n| Date | Event | Source |\n| --- | --- | --- |\n| **Nov 3, 2025** | LiveRamp donates User Context Protocol (UCP) → IAB Tech Lab; later renamed Agentic Audiences | [19] |\n| **Nov 13, 2025** | ARTF v1.0 released for public comment (originally \"Agentic RTB Framework\") | [1][8] |\n| **Dec 5, 2025** | Deals API v1.0 (a building block under AAMP) | [12] |\n| **Jan 15, 2026** | ARTF v1.0 public-comment period closes | [1][8][16] |\n| **Jan 28, 2026** | Agentic Audiences spec last updated; moved into the open-source agentic initiative on GitHub | [18] |\n| **Feb 18, 2026** | IAB Tech Lab ARTF standards page: spec \"was in Public Comment until January 15, 2026, and will be finalized soon\"; \"**Version 2.0 development is already underway**\" via the Agentic Working Group | [8] |\n| **Feb 26, 2026** | AAMP umbrella formally named (to end \"market confusion\"); three pillars and seven protocol components disclosed | [12][17] |\n| **Mar 1, 2026** | **Agent Registry launches** via the Tools Portal | [21][23] |\n| **~Mar 2026** | ARTF v1.0 **FINAL** spec PDF posted (iabtechlab.com/wp-content/uploads/2026/03/) | [primary PDF, see Sources] |\n| **Mar 11, 2026** | Agent Registry expands to 10 entries (adds Amazon, Burt Intelligence, Optable, Dstillery, HyperMindZ.ai); three-tier deployment classification | [21] |\n| **Apr 23, 2026** | AAMP standards page last-updated; \"AAMP 2.0 released with transaction-ready buyer and seller agent SDKs\" | [11] |\n| **Apr 29, 2026** | **AAMP 2.0** announced: Buyer Agent SDK 2.0, Seller Agent SDK 2.0, Agentic Audiences OpenRTB extension + Prebid module + open-source scorer; programmatic (not just direct) deals | [20][22] |\n| **Underway** | **AAMP 3.0** \"well underway… extends into more transaction and media types\"; ARTF **v2.0** in development | [8][20] |\n\n**Status caveats.** (i) ARTF's status is best described as \"v1.0 finalized, v2.0 in active development\" — present-tense claims about ARTF should be dated to early-to-mid 2026 and noted as fast-moving. (ii) The \"RTB\"→\"Real-Time\" rename means older sources call it the *Agentic RTB Framework* and newer ones the *Agentic Real-Time Framework*; same spec. (iii) AAMP version numbers turn over fast (1.0 → 2.0 in roughly two months; 3.0 already underway) — any \"current\" SDK capability claim is dated to April 2026 and may be superseded.\n\n### 5.1 Adoption signals (early, dated)\n\nAAMP 2.0 names production integrations with **Google Ad Manager, FreeWheel, PubMatic, Index Exchange, and Magnite** for the Seller Agent SDK — note that FreeWheel, Magnite, PubMatic, and Index Exchange are all heavily CTV-exposed sell-side platforms. [20] PMG announced integrating AAMP standards into its \"Alli\" operating system (per a May 2026 PRNewswire release — treat as the company's claim). [12] The Agent Registry's first 10 entries (March 2026) include Amazon, Optable, Dstillery, Burt Intelligence, HyperMindZ.ai. [21] These are early signals, not market share; adoption depth is an open question, taken up later in the chapter on the standards war.\n\n---\n\n## 6. The CTV Angle — What Colocated, Clean-Room RTB Means for the Living-Room Buy\n\n**Answer first:** For CTV the headline benefit is **not raw speed — it is the clean room.** ARTF's sealed, no-external-egress container lets a streaming seller expose the *value* of its viewing data (show-level, household-level) to a buyer's logic **without exposing the data itself.** That is genuinely useful where the data is the prize and the privacy/competitive risk of leaking it is high — which describes CTV exactly. The risk is that the same design bakes the walled gardens' data advantage into the standard.\n\n### 6.1 The mechanism, applied to CTV\n\nThe defining ARTF security property is that agent containers \"operate with **no external network access** — all network ingress and egress is prohibited except for service communications with the orchestrating entity.\" [10] Combine that with colocation and you get a clean-room-like cell: a buyer's identity-matching or optimization code runs *next to* the seller's sensitive data, computes a result — a match, a segment, a bid adjustment — and returns only that result. The raw data never leaves the seller's perimeter.\n\nWhy CTV is the natural first home for this:\n\n- **The data is uniquely sensitive and uniquely valuable.** Show-level and household-level viewing data is the CTV seller's crown jewel. Sellers have historically refused to pour it into the open bidstream for exactly the reasons (leakage, competitive copying, privacy exposure) the open bidstream is bad at containing. ARTF's containment model directly targets that reluctance. As Adweek and Digiday's coverage put it, CTV sellers \"wary of exposing show-level data in the open bidstream\" get \"a trusted environment where that data could be stored and used for advertising purposes, but without the same privacy or consumer data security risks.\" [6][24]\n- **The latency budget is real but the win is enrichment.** CTV auctions run within tight player-load windows; shaving network hops helps. But the more consequential effect is enabling enrichment (identity resolution, fraud/IVT checks, deal activation) that previously \"only existed in walled gardens\" (Heimlich's phrase) to happen safely in the open ecosystem too. [3][6]\n- **The backers are CTV-heavy.** ARTF's contributor/working-group roster includes **Netflix, Paramount, The Trade Desk, Yahoo, Amazon Ads, Magnite, PubMatic, OpenX, Index Exchange, Optable, HUMAN Security, WPP Media, Basis, Chalice** — a list weighted toward CTV supply and CTV-capable demand. [5][24] The presence of Netflix and Paramount (premium streaming sellers) signals the spec is being shaped with premium-video clean-room use cases in mind.\n\n### 6.2 The CTV critique (foreshadowing the standards war)\n\nThe same clean-room framing that helps premium sellers can entrench them. If the most valuable CTV data only ever moves *inside* a seller's colocated container, the seller controls the terms, the host \"decides which mutations to apply,\" and the buyer never gains independent access or portability of the signal. A skeptic would say ARTF doesn't *open* the walled garden — it gives the walled garden a standards-blessed way to *rent peeks inside* while keeping the wall up. Does colocated CTV RTB increase auction efficiency *for buyers*, or mostly increase sellers' ability to monetize closed data? That is the open empirical question, taken up later in the chapters on agentic advertising in CTV and on the standards war.\n\n---\n\n## 7. The Strongest Case Against ARTF\n\n**Answer first:** The best critiques do not deny that colocation cuts latency. They argue (a) ARTF *solves the wrong problem* — speed is not the binding constraint; measurement, accountability, and identity are; (b) \"agentic\" is **window dressing** — the containers propose, the incumbent host decides, so nothing is actually autonomous and incumbents stay in control; and (c) the standard is written by infrastructure vendors, entrenching the bidstream and the DSP/SSP supply chain it is supposed to modernize.\n\n### 7.1 \"Solving the wrong problem\" (Laforet, ExchangeWire)\n\nAlanna Laforet (ad-tech executive; CEO, Laforet Productions), writing in ExchangeWire on March 12, 2026, makes the sharpest \"wrong problem\" case. Her thesis: \"An industry obsessed with agent-to-agent infrastructure is skipping the harder question: for what should the agents actually be optimising?\" [25] She concedes the speed is real and *irrelevant* to the strategic failure: ARTF and AdCP \"are solving for speed, scale, and interoperability while largely sidestepping the question that actually keeps CMOs up at night\" — brand suitability and accountability. [25]\n\nOn accountability specifically: \"who is accountable when an agent makes a brand-damaging buy that was technically within spec? This question has no clean answer today — not from AdCP, not from ARTF.\" [25] And the historical rhyme: \"We did exactly this with programmatic. The promise was efficiency and precision. What we got was efficient delivery of the wrong ads… at enormous scale, followed by years of brand safety scandals.\" [25] (Note: Laforet's critique targets the *whole* agentic standards push; ARTF is faulted for what it *omits*, not for its engineering.)\n\n### 7.2 \"Agentic is window dressing; the host still decides\" (Goel)\n\nAmit Goel, an ad-tech analyst who reads the actual specs, argued (Substack, June 3, 2026 — treat as a named analyst's position, Tier 5/6) that the autonomy claim is overstated: \"The word *agentic* in the framework's name is defensible in the narrow sense that the containers are services with perception and action capabilities. It implies a level of goal-directed autonomy that the specification does not claim.\" [26] His structural point is the one that matters for incumbency: ARTF's containers \"are specialists that *propose*; the host platform *decides*.\" That asymmetry (documented in §1.3 from the spec itself) \"preserves incumbent control.\" [26] His broader frame — \"Three protocols address execution. Zero address measurement\" — names the gap ARTF's speed focus leaves open: without real-time outcome measurement, an agent has no closed feedback loop, so \"most of what adtech labels as agentic in 2026 handles [discovery/planning/execution] well and installs a human at the [decision] step\" — *assisted automation*, not agency. [26]\n\n### 7.3 \"Is latency even the bottleneck?\"\n\nThe implicit critique across both: programmatic's pain points in 2026 are **made-for-advertising (MFA) inventory, signal loss, measurement, brand safety, and supply-chain opacity** — not milliseconds. Shaving 400ms off a round trip does not make a bad impression good. An ARTF defender's rebuttal is fair, though: low latency is *necessary* — it unlocks in-auction enrichment and clean-room collaboration that were previously impossible in the open market — even if it is not *sufficient*. Both can be true, which is exactly why \"necessary ≠ sufficient\" (Goel's phrase) is the honest summary. [26]\n\n### 7.4 \"It entrenches the bidstream and the duopoly\"\n\nARTF's unit of work is an OpenRTB Patch *inside the auction*, and the existing SSP/exchange hosts that auction. So the architecture, by construction, keeps value flowing through the incumbent DSP→SSP→exchange chain rather than letting an agent route around it. Laforet notes the coalition is \"infrastructure-first,\" with \"the voices of brand marketers… largely advisory at best.\" [25] The counter-position (PubMatic, §8) is that ARTF and AdCP are complementary layers, not a duopoly play. Both deserve a hearing; the resolution belongs to the chapter on the standards war and to the outlook.\n\n---\n\n## 8. ARTF vs. AdCP, Architecturally (the distinction in one table)\n\n**Answer first:** They operate at **different layers** and — at least per the SSPs that sit on both bodies — are **complementary, not strictly rival.** AdCP is a *language for agents to negotiate*; ARTF is a *place for execution to happen fast and privately.* The \"war\" is real at the governance level (taken up in the chapter on the standards war), but the technical objects do not directly overlap.\n\n| Dimension | **AdCP** (Ad Context Protocol) | **ARTF** (Agentic Real-Time Framework) |\n| --- | --- | --- |\n| Layer | Application / negotiation — \"what should we buy and why\" | Transaction / execution — \"how do we execute this transaction quickly\" [28][30] |\n| Core idea | A shared *semantic language* for agent-to-agent conversations about media | A *containerized colocation* deployment model for in-auction logic |\n| Built on | MCP (Anthropic) as substrate | OpenRTB / AdCOM / VAST extended; gRPC + protobuf transport; MCP & A2A interfaces |\n| Time scale | Asynchronous; doesn't require millisecond decisions [30] | Synchronous, millisecond — designed for the RTB window |\n| Steward | AdCP working group (Scope3-led coalition) | IAB Tech Lab (under AAMP) |\n| Effect on supply chain | Could let agents negotiate around the DSP/SSP (seller-agent \"bypass\") | Keeps the bidstream and SSP/exchange host central by construction |\n| Autonomy | Negotiation can be agent-to-agent | Containers *propose*; host *decides* |\n\nPubMatic — an SSP on the boards of IAB, IAB Tech Lab, and Prebid.org *and* a founding AdCP member — explicitly reframes the debate: \"The real question is not whether one approach replaces the other, but how platforms and implementers navigate coexistence without fragmenting the market.\" [28] In its framing, AdCP provides \"shared semantic structure for intent and reasoning\" at the application layer; ARTF is \"where autonomous decisions are executed — where economic outcomes are realized inside governed environments\" at the transaction layer. [28] The Spyrosoft AdTech explainer puts it most crisply: \"AdCP handles the 'what should we buy and why' conversations between agents, while ARTF optimises the 'how do we execute this transaction quickly' mechanics.\" [30]\n\n**One caveat:** the \"complementary layers\" reading is advanced largely by SSPs (PubMatic, Index Exchange) that sit in *both* camps and benefit from coexistence. The IAB's own posture toward AdCP is colder (Katsur: the industry doesn't need \"another industry trade group\"; build on \"an existing shared foundation, not… multiple new standards that create fragmentation\") — that political conflict is the subject of the chapter on the standards war. [4][16][17]\n\n---\n\n## Open Questions\n\n1. **Has anyone independently benchmarked ARTF's latency?** No published third-party measurement exists as of June 2026. Until one does, \"up to 80% / ~100ms\" remains an IAB design target. What is the *typical* (not best-case) reduction, and for an auction already running mostly in-house?\n2. **Why do the IAB and its own contributors cite different numbers** (100ms vs. <10ms vs. sub-1ms)? The \"different metrics\" reconciliation is plausible but unconfirmed; the spec lacks a single defined, reproducible measurement.\n3. **Does colocation open the CTV walled garden or fortify it?** Does in-container clean-room collaboration increase auction efficiency *for buyers*, or mainly give premium CTV sellers a standards-blessed way to monetize closed data while keeping the wall?\n4. **What is real ARTF/AAMP adoption depth?** Named integrations and 10 Registry entries are early signals; how many *live, production* colocated deployments process real CTV bid volume?\n5. **Does the host-decides asymmetry survive v2.0?** ARTF v2.0 and AAMP 3.0 are \"underway.\" Does any future version grant containers more autonomy, or is \"propose, don't decide\" a permanent design principle (and incumbency guarantee)?\n6. **How do ARTF's containers and AdCP's negotiation actually compose** in one transaction? The \"complementary layers\" claim is asserted by interested SSPs; is there a worked end-to-end example where an AdCP-negotiated deal executes through an ARTF container?\n7. **Where does measurement live?** Goel's \"zero protocols address measurement\" — does AAMP 3.0 or any IAB initiative close the real-time outcome-measurement loop that genuine agentic optimization requires?\n8. **VAST/CTV creative specifics.** ARTF lists CTV as an applicable channel, but no source details CTV-specific creative handling (VAST, ad-pod construction, frequency) inside a colocated container. This is taken up in the chapter on agentic advertising in CTV.\n\n---\n\n## Sources\n\n**Tier 1 — Primary (IAB Tech Lab / spec / press releases, read as the entity's claims)**\n\n1. IAB Tech Lab, \"IAB Tech Lab Announces Agentic RTB Framework (ARTF) v1.0 for Public Comment,\" PRNewswire, Nov 13, 2025. https://www.prnewswire.com/news-releases/iab-tech-lab-announces-agentic-rtb-framework-artf-v1-0-for-public-comment-302613712.html (accessed 2026-06-19). *Press release — evidence of IAB's claims, including the \"up to 80%\" design target; not proof of measured performance.*\n2. ARTF Specs (artf.ai), \"The Agentic Standard for Programmatic Advertising,\" IAB Tech Lab. https://artf.ai/ (accessed 2026-06-19). *Official spec site; latency claim \"up to ~80%, several hundred ms → ~100 ms, depending on implementation.\"*\n8. IAB Tech Lab, \"ARTF (Agentic Real Time Framework)\" standards page. https://iabtechlab.com/standards/artf/ (last updated Feb 18, 2026; accessed 2026-06-19). *Going-concern: comment closed Jan 15 2026, \"finalized soon,\" v2.0 underway.*\n10. IAB Tech Lab (Miguel Morales, Director of Addressability & PETs), \"Breaking Down the Walls: IAB Tech Lab's Blueprint for Containerized Agent-Powered Advertising.\" https://iabtechlab.com/breaking-down-the-walls-iab-tech-labs-blueprint-for-containerized-agent-powered-advertising/ (accessed 2026-06-19). *OCI/gRPC/protobuf, no-egress security, \"low to sub-millisecond\" container response.*\n11. IAB Tech Lab, \"AAMP — Agentic Advertising Management Protocols\" standards page. https://iabtechlab.com/standards/aamp-agentic-advertising-management-protocols/ (last updated Apr 23, 2026; accessed 2026-06-19). *Three pillars; component list; AAMP 2.0 status; built on OpenDirect/Deals API/AdCOM/OpenRTB.*\n13. IAB Tech Lab, \"Agentic RTB Framework Version 1.0 for PUBLIC COMMENT\" (PDF). https://iabtechlab.com/wp-content/uploads/2025/11/Agentic-RTB-Framework-Version-1.0-for-PUBLIC-COMMENT-1.pdf (accessed 2026-06-19). *Primary spec — OpenRTB Patch, intents, semantic addressing, CTV/DOOH applicability.*\n15. ARTF Specs, \"Technical Specs.\" https://artf.ai/technical-specs (accessed 2026-06-19). *gRPC/protobuf, OpenRTB Patch, host-decides model, \"coexist with not replace OpenRTB,\" \"400–800 ms → ~100 ms, subject to implementation.\"*\n18. IAB Tech Lab, \"Agentic Audiences\" standards page. https://iabtechlab.com/standards/agentic-audiences/ (last updated Jan 28, 2026; accessed 2026-06-19). *Embeddings 256–1024 dims, sub-100ms; formerly UCP; LiveRamp donation; Commit Group governance.*\n20. IAB Tech Lab, \"AAMP 2.0 Release Brings Transaction-ready Buyer and Seller Agent SDKs.\" https://iabtechlab.com/aamp-2-0-release-brings-transaction-ready-buyer-and-seller-agent-sdks/ (accessed 2026-06-19). *Buyer/Seller SDK 2.0 capabilities, integrations (GAM, FreeWheel, PubMatic, Index Exchange, Magnite), Agentic Audiences OpenRTB ext + Prebid module, AAMP 3.0 underway.*\n23. IAB Tech Lab, \"Introducing the IAB Tech Lab Agent Registry.\" https://iabtechlab.com/introducing-the-iab-tech-lab-agent-registry/ (accessed 2026-06-19). *Registry launch, GPP-ID/TCF-GVL validation.*\n— IAB Tech Lab, \"Agentic Real Time Framework Version 1.0 FINAL\" (PDF, March 2026). https://iabtechlab.com/wp-content/uploads/2026/03/Agentic-Real-Time-Framework-Version-1.0-FINAL.pdf (accessed 2026-06-19). *Primary final spec.*\n— IAB Tech Lab GitHub: github.com/IABTechLab/agentic-realtime-framework and github.com/IABTechLab/agentic-audiences (accessed 2026-06-19). *Reference implementations / .proto definitions — not read line-by-line.*\n\n**Tier 5 — Specialized / trade press (note: industry-proximate)**\n\n3. AdExchanger, \"The IAB Tech Lab Releases Its First Framework For Agentic Ad Buying Standards,\" Nov 2025. https://www.adexchanger.com/platforms/the-iab-tech-lab-releases-its-first-framework-for-agentic-ad-buying-standards/ (accessed 2026-06-19). *Katsur \"400–600ms\" baseline; Prismon \"black box\" quote; no critique.*\n4. The Current (The Trade Desk's owned-media outlet — disclose ownership lean), \"IAB Tech Lab, not a fan of AdCP, releases an agentic advertising framework.\" https://www.thecurrent.com/marketing-strategy-iab-tech-lab-adcp-agentic-advertising-framework-ai (accessed 2026-06-19). *Katsur \"shiny penny… not blockchain\"; Heimlich \"standardize something unproven\"; 80% target; no CTV.*\n5. Adweek, \"IAB Launches Technical Standard for Faster, AI Agent-Friendly Ad Auctions.\" https://www.adweek.com/media/iab-tech-lab-ai-agentic-rtb-framework/ (accessed 2026-06-19; full text 403 on fetch, summarized via search excerpt). *CTV clean-room angle; backer list (Netflix, Paramount, Amazon, etc.).*\n6. Digiday, \"For the agentic-curious: WTF is the Agentic RTB Framework?\" Nov 2025. https://digiday.com/marketing/for-the-agentic-curious-wtf-is-the-agentic-rtb-framework/ (accessed 2026-06-19). *Plain-language container explainer; \"400–600ms → a fraction\"; Heimlich CTV-seller clean-room quote; backer list.*\n7. Index Exchange (Michael Richardson, VP Product), \"What Is the Agentic Real-Time Framework (ARTF)?\" indexexchange.com/index-explains. https://www.indexexchange.com/index-explains/what-is-agentic-real-time-framework-artf/ (accessed 2026-06-19). **Conflict: Index Exchange is an SSP and ARTF co-author/host beneficiary.** *Claims \"up to 95%\" / \"under 10ms\" — a vendor figure distinct from the IAB headline; \"run logic locally in the same data center.\"*\n9. MarTech, \"IAB Tech Lab unveils Agentic RTB Framework to boost real-time ad trading efficiency,\" Nov 13, 2025. https://martech.org/iab-tech-lab-unveils-agentic-rtb-framework-to-boost-real-time-ad-trading-efficiency/ (accessed 2026-06-19). *Source of \"600–800ms → ~100ms,\" explicitly attributed \"According to the Tech Lab.\"*\n12. PPC Land, \"IAB Tech Lab names its agentic ad initiative AAMP to end market confusion.\" https://ppc.land/iab-tech-lab-names-its-agentic-ad-initiative-aamp-to-end-market-confusion/ (accessed 2026-06-19). *Feb 26 2026 naming; seven protocol components; three pillars; Registry \"next week.\"*\n14. PPC Land, \"LiveRamp donates User Context Protocol to IAB Tech Lab for agentic advertising.\" https://ppc.land/liveramp-donates-user-context-protocol-to-iab-tech-lab-for-agentic-advertising/ (accessed 2026-06-19). *Embeddings, Commit Group, Clinger quote.*\n16. The Current, \"IAB Tech Lab announces an agentic roadmap, but don't expect any love for AdCP.\" https://www.thecurrent.com/data-privacy-iab-tech-lab-ai-agentic-roadmap-adcp (accessed 2026-06-19). *Katsur \"build on an existing shared foundation, not… multiple new standards that create fragmentation.\"*\n17. (same naming cycle as [12]) — PPC Land AAMP-naming coverage, three-pillar / component enumeration. (accessed 2026-06-19).\n19. CDP Institute / PPC Land, \"LiveRamp Donates User Context Protocol to IAB Tech Lab to Set Standards for Agentic AI.\" https://www.cdpinstitute.org/news/liveramp-donates-user-context-protocol-to-iab-tech-lab-to-set-standards-for-agentic-ai/ (accessed 2026-06-19). *Donation date Nov 3, 2025; 256–1024 dim embeddings, sub-100ms.*\n21. PPC Land, \"IAB Tech Lab's agent registry hits 10 with Amazon and new deployment types.\" https://ppc.land/iab-tech-labs-agent-registry-hits-10-with-amazon-and-new-deployment-types/ (accessed 2026-06-19). *Mar 1 launch; Mar 11 expansion to 10; three-tier deployment.*\n22. IAB New Zealand / LexisNexis, \"IAB Tech Lab Agentic Advertising Update: AAMP 2.0.\" https://www.iab.org.nz/news-resources/iab-tech-lab-agentic-advertising-update-aamp-2.0 (accessed 2026-06-19). *AAMP 2.0 release date Apr 29, 2026; version timeline 1.0→2.0→3.0.*\n24. (Adweek/Digiday CTV clean-room synthesis) — see [5][6]. CTV-seller \"show-level data\" containment framing.\n28. PubMatic, \"Moving Beyond AdCP vs ARTF: How Both Power Agentic Advertising.\" https://pubmatic.com/blog/moving-beyond-adcp-vs-artf-understanding-their-roles-in-agentic-advertising/ (accessed 2026-06-19). **Conflict: PubMatic sits in both camps.** *Application-layer vs transaction-layer framing; \"coexistence without fragmenting the market.\"*\n30. Spyrosoft AdTech, \"Agentic AI in AdTech: AdCP and the IAB's Agentic RTB Framework (ARTF).\" https://spyro-soft-adtech.com/agentic-ai-in-adtech-adcp-and-the-iabs-agentic-rtb-framework-artf/ (accessed 2026-06-19). *\"What to buy and why\" (AdCP) vs \"execute quickly\" (ARTF); gRPC vs HTTP.*\n\n**Tier 5/6 — Named-analyst commentary (position-evidence; disclosed expertise, personal venues)**\n\n25. Alanna Laforet (CEO, Laforet Productions), \"Ad Tech's Agentic Arms Race Is Solving the Wrong Problem,\" ExchangeWire, Mar 12, 2026. https://www.exchangewire.com/blog/2026/03/12/ad-techs-agentic-arms-race-is-solving-the-wrong-problem/ (accessed 2026-06-19). *Strongest \"wrong problem\"/accountability critique; cite as position, corroborated where factual.*\n26. Amit Goel (ad-tech analyst), \"The Protocols Are Being Debated. The Agents Haven't Arrived Yet…,\" bidstream.amitgoel.me (Substack), Jun 3, 2026. https://bidstream.amitgoel.me/p/the-protocols-are-being-debated-the (accessed 2026-06-19). *Named analyst, reads specs; \"agentic is defensible only narrowly,\" \"propose vs decide,\" \"zero protocols address measurement.\" Personal Substack — position-evidence, not fact.*\n\n**Tier 5 — additional context (not separately cited above):** IAB UK and IAB Canada explainers (403/secondary), AdTechRadar, Advertising Week, INMA, Monks summit coverage — used for cross-checking the timeline and component lists."}, {"order": 5, "file": "05_Standards_War.md", "title": "The Standards War — Governance, Politics, and Who Keeps the Spread", "summary": "", "body": "# The Standards War — Governance, Politics, and Who Keeps the Spread\n\n## Bottom Line\n\nThe \"protocol war\" between the **AdCP** coalition (Ad Context Protocol, governed by the new nonprofit **AgenticAdvertising.org**) and the **IAB Tech Lab** (whose agentic work is now bundled under **AAMP**, with **ARTF** at its core) is real as *politics* but overstated as *architecture*. On the technical merits, the two standards mostly operate at different layers. AdCP is an agent-to-agent **negotiation language**, built on Anthropic's **MCP** substrate; ARTF is a **transport/execution** optimization — containerized, colocated real-time bidding that extends OpenRTB/AdCOM/VAST. The most credible read — advanced by PubMatic, The Current, and independent analysts, and not seriously refuted by either camp's engineers — is that they are **complementary layers that can stack**, with MCP the common substrate beneath both. The real fight is not \"which protocol wins the bid\" but **who governs the standards layer**. Whoever controls the standard controls the rents: membership dues, certification, the agent registry, and the right to define a \"compliant\" transaction. That is why a former IAB CEO (Randall Rothenberg) now steers the insurgent body that the *current* IAB Tech Lab CEO (Anthony Katsur) calls \"deeply flawed.\"\n\nA third force complicates the binary entirely. The walled gardens are **shipping their own per-platform MCP servers** — Google (Ads Advisor / Analytics Advisor, now unified as **Ask Advisor**, plus an open-source Google Ads API MCP server), Amazon (Ads MCP server, open beta since February 2, 2026), and Meta (Ads AI Connectors, open beta since April 29, 2026). They are not waiting for an industry standard; they are using MCP as a moat-preserving on-ramp into their own gardens. For the open ecosystem, the stakes are largest in **CTV**, where curation/PMP dealmaking and walled-garden concentration mean an agent-negotiation layer (AdCP) threatens to compress the **DSP + SSP double-dip** that today taxes the living-room buy. One caveat is load-bearing for everything else: as of mid-2026, this is a **standards fight ahead of meaningful volume**. AdCP went from \"zero dollars transacting\" in early reporting to a handful of live campaigns (PubMatic/Butler+Till, December 2025) and ~10 registry entries by March 2026, against a market running hundreds of billions of ad transactions daily. The war is being fought over a market that does not yet exist at scale.\n\n**The defensible read: this resolves as *layering, not winner-take-all* — but the governance war over who stewards the layers is genuine, unresolved, and the place the rents will actually be decided.**\n\n---\n\n## 1. The Camps, Named — A Market Map\n\nBefore adjudicating war-vs-layering, name the players and where they sit. By the end of this section you should be able to say who is in which camp, who straddles, and what each body has at stake.\n\n### 1.1 The insurgent: AdCP / AgenticAdvertising.org\n\nThe **Ad Context Protocol (AdCP)** launched on **October 15, 2025** as an open standard letting AI agents talk to advertising platforms — and, as it matures, directly to each other — to plan, negotiate, and execute media buys across platforms without continual human intervention [1][2][6]. It is built **on top of Anthropic's Model Context Protocol (MCP)**, which it uses as its substrate for agent-to-agent communication and interoperability [2][6].\n\n**Founding members (the \"supply-side consortium\"):** PubMatic, Scope3, Swivel, Yahoo, Optable, and Triton Digital [1][2][6]. The launch cohort added a long tail of publishers and platforms: Samba TV, Kargo, Magnite, LG Ad Solutions, Raptive, The Weather Company, AccuWeather, Classify, Butler/Till, Newton Research, and others [1][2]. The roster is conspicuously **CTV- and supply-heavy** — Triton (audio/CTV), Samba TV and LG Ad Solutions (ACR/CTV), Magnite (the largest independent CTV SSP) — which is the tell for where AdCP expects to bite first.\n\nIn December 2025 the same group stood up a governance home: **AgenticAdvertising.org (AAO)**, a Delaware **501(c)(6) nonprofit trade organization** headquartered in New York [3][4]. It publishes AdCP and frames its mission around three pillars — **open standards, governance (\"humans stay in the decisions that matter\"), and education** [3]. The politically loaded part is its interim leadership: **Randall Rothenberg, the former CEO of the IAB itself, and Matthew Egol, formerly of Booz & Company/Strategy&** [3][4]. The bylaws envision a 40-director elected board across four member categories — brands, agencies, publishers, technology providers [3]. AdCP is run operationally by **Scope3 CEO Brian O'Kelley** [4][7], the AppNexus founder who effectively co-invented the modern SSP/ad-exchange — lending the insurgent camp deep programmatic credibility.\n\n### 1.2 The incumbent: IAB Tech Lab / AAMP / ARTF\n\nOn the other side sits the **IAB Tech Lab**, the standards body that already owns the plumbing of programmatic — **OpenRTB** (the transaction standard), **AdCOM** (the advertising common object model), **OpenDirect** (management), **VAST** (video/CTV delivery), and the Deals API [8][14]. Its CEO is **Anthony Katsur**.\n\nThe Tech Lab's response to the agentic moment is to **\"agentify\" its existing standards** rather than start fresh [14]. Its components:\n\n- **ARTF — the Agentic RTB Framework** (the IAB names it both \"Agentic RTB Framework\" and \"Agentic Real Time Framework\" across documents), released as **v1.0 for public comment on November 13, 2025**, with the comment period open until January 15, 2026 [9][11][13]. ARTF uses **containerized architecture**: instead of an SSP making a cross-internet API call to a vendor, the vendor's logic is packaged as a container and deployed **inside the SSP's own infrastructure** — same data center, same virtual machine, same Kubernetes cluster as the auction engine [11][13]. The headline claim (the IAB's own, not independently benchmarked): latency cut **\"up to 80%,\" from ~600–800ms round trips to roughly ~100ms** [11][13].\n- **Agentic Audiences** (formerly the **User Context Protocol, UCP**), v1.0 November 2025 — an open standard for how agents exchange identity, contextual, and reinforcement signals in a privacy-safe way [14][15]. Notably, the **UCP was donated to the Tech Lab by LiveRamp** [12], a detail that matters for governance: a single vendor seeded an \"open\" standard now housed inside the incumbent body.\n- **AAMP — the umbrella** (variously \"Agentic Advertising Management Protocols\" / \"Agentic Advertising and Marketing Protocol\"; the naming is itself unsettled), formally named **February 26, 2026** to \"end market confusion\" [10], built on three pillars (Foundations, Protocols, Trust) and including buyer/seller agent SDKs and an **agent registry** [14][15].\n\n**The Tech Lab's institutional weight is its Programmatic Governance Council — ~40 member companies including Paramount, The Trade Desk, Omnicom, Dentsu, WPP Media, Hearst, Amazon Ads, and Yahoo** [7][8]. This is the incumbent's standing army.\n\n### 1.3 The straddlers — who sits in both camps\n\nThe single most important fact for the \"is this really a war?\" question: **the most consequential players sit in both camps at once.**\n\n- **Brian O'Kelley** himself: he *helms AdCP* and is *an active board member of the IAB Tech Lab* [7]. The leader of the insurgency holds a seat on the incumbent's board.\n- **PubMatic**: a founding member of AdCP, and its leaders \"sit on the boards of the IAB, IAB Tech Lab, and Prebid.org\" [5]. PubMatic explicitly frames itself as the bridge \"ensuring coexistence works in production\" [5].\n- **Yahoo**: a founding member of AdCP [1][2] and a member of the IAB Tech Lab Programmatic Governance Council [7][8].\n- **Scope3**: O'Kelley's company drives AdCP, while O'Kelley also sits on LiveRamp's board [7] — LiveRamp being the donor of the IAB's UCP/Agentic Audiences standard [12].\n\nWhen the same companies and the same people occupy both tables, \"war\" is the wrong primitive. The contest looks less like two armies than like a **boardroom fight over governance and credit** among a small set of firms hedging across both venues.\n\n### 1.4 Exhibit: who's in which camp\n\n| Player | AdCP / AAO | IAB Tech Lab / AAMP | Own per-platform MCP | Posture |\n| --- | --- | --- | --- | --- |\n| Scope3 (O'Kelley) | Founder/lead [4][7] | O'Kelley on board [7] | — | **Straddler** — drives insurgency, sits on incumbent board |\n| PubMatic | Founding member [1][5] | Board seats (IAB/Tech Lab/Prebid) [5] | — | **Straddler / self-declared bridge** [5] |\n| Yahoo | Founding member [1][2] | Gov. Council member [7][8] | — | **Straddler** |\n| Triton Digital | Founding member [1][2] | — | — | AdCP (audio/CTV) |\n| Optable, Swivel | Founding members [1][2] | — | — | AdCP |\n| Samba TV, LG Ad Sol., Magnite, Kargo | Launch members [1][2] | (some IAB members) | — | AdCP-leaning (CTV/SSP supply) |\n| LiveRamp | — | Donated UCP/Agentic Audiences [12] | — | Incumbent-aligned (seeded a standard) |\n| Index Exchange | — | ARTF early adopter/tester [9][13] | — | Incumbent (containerized RTB) |\n| Chalice (Heimlich) | — | ARTF supporter [9][13] | — | Incumbent, vocal AdCP skeptic |\n| The Trade Desk | Absent from roster [Broadbrand, 16] | Gov. Council member [7][8] | **Koa Agents on its own MCP** [17] | **Build-my-own** incumbent |\n| Google | — | (member; pushes A2A) | **Google Ads API MCP server + Ask Advisor** [18][19][20] | **Walled garden / third force** |\n| Amazon Ads | — | Gov. Council member [7][8] | **Amazon Ads MCP server (open beta)** [21][22] | **Walled garden / third force** |\n| Meta | — | — | **Meta Ads AI Connectors (open beta)** [23][24] | **Walled garden / third force** |\n| Paramount, Omnicom, Dentsu, WPP, Hearst | — | Gov. Council members [7][8] | — | Incumbent-aligned (buy-side/publisher weight) |\n\nThe shape that falls out: a **supply-side / independent insurgency** (AdCP) against the **standards establishment plus the big buy-side and the largest DSP** (Tech Lab), with the **three walled gardens off to the side building their own ramps** — and a handful of pivotal firms refusing to pick a side.\n\n---\n\n## 2. The War Framing — Stated at Full Strength\n\nIt is only fair to stage both sides at full strength before adjudicating. So here is the strongest case that this **is** a war.\n\n### 2.1 The incumbent's attack: Katsur's \"deeply flawed\"\n\nIAB Tech Lab CEO **Anthony Katsur** has been unusually blunt for a standards executive. He has called AdCP **\"deeply flawed,\" \"resource consuming,\" and \"just another acronym\"** [The Current, 25]. He has argued the industry does **not need \"another 'trade group'\"** and that the Tech Lab **already addresses** the problems AdCP claims to solve [25][26]. His most quotable framing of the evolutionary thesis: **\"When you remodel the kitchen, you don't burn down the house\"** [ExchangeWire, 27]. On the hype, he has called agentic AI a **\"shiny penny\"** while conceding real value for narrow use cases: **\"When I think of agents, I think of superhumans. They're good at needle-in-the-haystack problems\"** [25]. And the deeper claim that makes AdCP look redundant: **\"Agentic execution is already part of how digital advertising operates today\"** [The Current, 28] — echoed by Crispin's Freddy Dabaghi: **\"Media's been doing AI for a while. It's called programmatic\"** [26].\n\nThe incumbent's structural argument, in its own voice, is **network effects**: \"In a space with significant scale and network effects, it is hard to cold-start new initiatives\" [ExchangeWire, 27]. OpenRTB carries the market. An agent layer that bypasses it is, in this telling, a solution chasing a problem the Tech Lab can patch in place.\n\n### 2.2 The skeptics' attack: \"unproven,\" \"the wrong problem\"\n\nARTF's vendor backers sharpen the knife. **Adam Heimlich (CEO, Chalice)** frames ARTF as built on a \"proven\" foundation while AdCP tries to standardize **\"something that's unproven\"** [The Current, 25]. The architectural critique from the ARTF side is that containerization \"eliminates server-to-server bottlenecks\" by running \"the same thing in one server\" [25] — i.e., ARTF solves a *real, measured* latency problem, whereas AdCP solves a *speculative* negotiation problem.\n\nA second skeptical line — the **\"arms race solving the wrong problem\"** critique — runs through ExchangeWire: building \"one higher-level interface to run it all\" risks becoming **\"the humanoid robot\"** — orchestration overhead — when **\"purpose-built 'appliances'\"** already do the core jobs [27]. **Joe Root (co-founder, Permutive)** warned that AdCP risks **distracting from the actual competitive fight against the walled gardens** [The Current, 28]. **Vlad Chubakov (Delve Deeper)** expressed doubt that agentic buying is ready for scale at all [28].\n\n### 2.3 The insurgent's attack: the standards body has a conflict of interest\n\nThe strongest war-framing from the *insurgent* side is not technical — it is about **rents and legitimacy.** An unnamed AAO backer put the thesis bluntly: **\"If OpenRTB isn't valuable [in the agentic era], why pay for a trade association whose only job is stewarding a protocol you may not use anymore?\"** [Digiday, 29]. That is a direct shot at the IAB Tech Lab's business model. The AAO frames itself as a **\"disruptor to the industry's traditional powerbrokers\"** [Digiday, 7][29]. The subtext: the incumbent will always favor extending the standards it already monetizes, because **its dues, certification, and stewardship revenue depend on OpenRTB remaining central.** Recruiting **Randall Rothenberg — the IAB's own former CEO — to lead the insurgency** [3][4] is the insurgent camp's way of saying the establishment itself can be split.\n\n### 2.4 The analyst's verdict: the war is real but *unspoken*\n\nIndependent analyst **Amit Goel** (Bidstream) reads the specifications directly and lands on the governance war as the true contest: **\"The governance question of who controls the standards layer for AI-mediated advertising is the question that determines which technical approach shapes the industry at scale\"** — and he notes it is being discussed dishonestly, \"as a technical debate rather than a standards war\" [30]. On this reading the war is real. The participants simply have incentives to call it something else.\n\n**Verdict on the war framing:** the politics are genuinely adversarial, the rhetoric (Katsur's \"deeply flawed\") is genuinely hostile, and the rents at stake are genuinely large. The war framing is *true at the governance layer.*\n\n---\n\n## 3. The Coexist Framing — Stated at Full Strength\n\nNow the opposing case: AdCP and ARTF are **complementary layers**, and the \"war\" is a category error.\n\n### 3.1 The layering thesis (PubMatic, in its own words)\n\nPubMatic — which sits in both camps and is therefore the most interested *and* most informed witness — published the canonical layering argument on **January 8, 2026**, titled *\"Moving Beyond AdCP vs ARTF.\"* Its frame is explicit [5]:\n\n- **AdCP is the application layer** — \"how autonomous agents express intent, constraints, permissions, and reasoning in a shared, structured way.\" It provides \"shared semantic structure for intent and reasoning.\"\n- **ARTF is the transaction layer** — \"how autonomous agents can operate safely and predictably inside real-time transaction environments.\" Critically, ARTF \"does not replace existing transaction standards; it extends them to support agentic behavior.\"\n- **They intersect at execution:** \"The application layer is where intelligence is expressed and orchestrated... The transaction layer is where autonomous decisions are executed... These layers intersect at execution time, even when they originate from different standard bodies\" [5].\n\nIn plain terms: **AdCP is the language two agents speak to agree on a deal; ARTF is the pipe the agreed deal runs through.** A buyer agent could negotiate a CTV PMP in AdCP's vocabulary and execute the resulting bids through an ARTF-containerized auction. No contradiction.\n\n### 3.2 The coalition's own coexist language\n\nEven AdCP's leaders describe it as sitting *above*, not *against*, execution [28]:\n\n- **Ashwin Navin (CEO, Samba TV):** AdCP sits **\"above RTB, making the ecosystem flatter, smarter and less labor-intensive.\"**\n- **Benjamin Masse (CPO, Triton Digital):** AdCP is an **\"expansion beyond the execution layer.\"**\n- **Brian O'Kelley (CEO, Scope3):** AdCP is **\"the interface\"** that traditional systems would execute on.\n- **June Cheung (Scope3, JAPAC):** AdCP and ARTF **\"solve for different problems.\"**\n\nThese are not the words of generals at war. They are the words of people describing different floors of the same building. MCP sits in the basement of both — AdCP is built on MCP by design [2][6], and the IAB roadmap itself \"integrates... with AI protocols like Model Context Protocol and Agent2Agent\" [26]. The substrate is **shared.**\n\n### 3.3 The substrate map (AdExchanger)\n\nAdExchanger's MCP explainer (March 9, 2026) makes the three-layer picture concrete [31]. MCP is \"plumbing for AI\" — the \"universal adapter\" (Criteo's Todd Parsons) or \"USB\" (Similarweb's Omri Shtayer) that connects models to external software. Industry-specific protocols then **build atop MCP**: AdCP for advertising workflows, UCP for commerce, WebCP for web actions [31]. On this map, AdCP vs ARTF is not a fork in the road. It is two specialized protocols layered over the same MCP substrate, addressing negotiation and transport respectively.\n\n### 3.4 The Current's question and Broadbrand's recommendation\n\nThe Current's headline asks the question directly — *\"Agentic AI is the new advertising battleground. Does it have to be?\"* [28] — and surfaces the coexist voices above. But the most operationally honest coexist position comes from **Broadbrand**, which, having called it a \"protocol war,\" still recommends not fighting it: **\"Treat ARTF and AdCP as interchangeable transport layers and build the decisioning, measurement and creative logic above them\"** [16]. Let performance data, not allegiance, decide spend allocation quarterly. This \"**protocol-agnostic orchestration**\" posture is also where The Trade Desk's behavior points [17][32] — build your own agent layer (Koa) on your own MCP, stay out of both consortia, and let neither standard lock you in.\n\n**Verdict on the coexist framing:** at the *architecture* layer, the coexist case is stronger. The two standards genuinely target different problems (negotiation vs. transport), both sit on MCP, and the same firms build to both. No engineer on either side has demonstrated that a transaction *must* choose one to the exclusion of the other.\n\n---\n\n## 4. Adjudication — War or Layering?\n\nStage complete; now the call. **The evidence favors layering at the technical layer and war at the governance layer.** These are not in tension — they are the resolution.\n\n**Why layering wins on architecture.** Three independent lines converge: (1) the proponents on *both* sides describe different problems — negotiation/intent (AdCP) vs. latency/transport (ARTF) [5][28]; (2) AdCP is *built on* MCP, and the IAB roadmap *also* integrates MCP and A2A, so they share a substrate rather than fight over it [2][6][26]; (3) the firms with the most engineering insight and the most money at stake — PubMatic, Scope3, Yahoo — are building to **both** and explicitly modeling them as stacked layers [5]. When the people who would profit most from a knockout are instead building interoperability, \"war\" is not the architecture's natural end state. The ExchangeWire \"burn it down vs. build on top\" binary [27] is a useful rhetorical frame but a false technical dichotomy. You can build a negotiation layer on top *and* containerize the transport underneath.\n\n**Why war wins on governance.** The hostility is not performance art. Katsur's \"deeply flawed / resource-consuming\" [25] and the AAO's \"why pay for a trade association whose only job is stewarding a protocol you may not use anymore\" [29] are statements about **money and control**, not packet formats. What is being fought over is the **right to define the compliant transaction** — and with it the agent registry, the certification program, the membership dues, and the credit. Goel's diagnosis is correct: the technical debate is partly a proxy for the governance war [30]. Recruiting the former IAB CEO to run the rival body [3][4] is an act of war over institutional legitimacy, not over latency.\n\n**The synthesis:** the standards will likely **layer in production** (negotiation over transport over substrate) while the **bodies fight over who stewards each layer**. The most probable equilibrium is not \"AdCP beats ARTF\" or vice versa but a **messy interoperable stack** in which (a) MCP is the uncontested substrate, (b) ARTF or its successor handles transport because incumbency and OpenRTB network effects are real [27], (c) AdCP-style negotiation grammar gets adopted *somewhere* — possibly absorbed into the IAB's own SDKs — and (d) the **walled gardens route around the whole open-standards debate** via their own MCP servers (Section 5). The losers of the *governance* war keep operating. They just lose dues, mindshare, and the power to set the defaults.\n\n**The load-bearing caveat that should temper all of this:** the war precedes the market. Early reporting found **zero dollars transacting through AdCP** [33]; by the protocol's own evidence the first live campaigns appeared only in December 2025 (PubMatic with Butler/Till and Clubtails, claiming +40% impressions vs. comparable campaigns — a *PubMatic-reported* figure, not independently audited) [34], with the IAB agent registry reaching ~10 entries by March 2026 [34], against \"hundreds of billions of ad transactions daily\" [30]. Goel's line is the one to keep: **\"The infrastructure work is genuine. The autonomous-at-scale part remains aspirational\"** [30]. A standards war over a market that doesn't yet exist at scale can still matter enormously — defaults set now will be sticky — but the \"war\" is currently being fought with press releases and board seats, not with spend.\n\n---\n\n## 5. The Third Force — Walled Gardens Ship Their Own MCP Servers\n\nThe AdCP-vs-ARTF binary assumes the fight is among *open-ecosystem* standards bodies. The most strategically important development of 2026 says otherwise: **the walled gardens declined to participate in either** and instead shipped **their own per-platform MCP servers.** This is the move that most threatens the open-standards premise — and the one most relevant to CTV, where Amazon and Google sit on enormous owned-and-operated inventory.\n\n### 5.1 Google — the open-source MCP server *and* the in-product agents\n\nGoogle is running two plays at once.\n\n**Play one — the developer ramp.** On **October 7, 2025**, the Google Ads API team released an **open-source MCP server** (repo `googleads/google-ads-mcp`, Python) [18][19][20]. It is **read-only** and exposes two tools: a `search` tool (GAQL queries over Ads accounts for performance/budget/structure) and `list_accessible_customers` (enumerating accounts) [18][20]. Google's stated rationale (Dean Lukies, Google Ads API team): let \"AI applications connect directly with Google Ads data through natural language interfaces,\" replacing the need for \"developers to construct specific requests with precise syntax\" [20]. The read-only scope is deliberate risk management — write access \"would introduce significantly higher risk profiles regarding account modifications, budget changes, and campaign alterations\" [20]. Google Analytics had shipped its own MCP server earlier, on **July 22, 2025** [18].\n\n**Play two — the in-product agents.** Google's *user-facing* agentic surface has moved fast, and any snapshot of it dates quickly. **Ads Advisor** (introduced at Google Marketing Live May 2025, rolled to 50% of eligible users September 2025, full English availability December 2025) and **Analytics Advisor** are the older per-product agents [35]. As of **May 20, 2026**, Google launched **Ask Advisor** at Google Marketing Live 2026 — **a unified Gemini agent that spans Google Ads, Google Analytics, and Merchant Center (with DV360 referenced), built atop and consolidating Ads Advisor and Analytics Advisor** [35][36]. Google's own framing: \"Now everyone can get the best insights and results from our products whether you are a data expert or not\" [36]. **Status caveat:** Ask Advisor is in **beta for English-language accounts as of mid-2026, not GA** [36]; the per-product Advisors still exist underneath it. The point: Google is building **its own agent into its own products**, governed by Google, while offering outsiders only a read-only MCP window.\n\n### 5.2 Amazon — the Ads MCP server, open beta\n\n**Amazon Ads opened its MCP server to global open beta on February 2, 2026**, announced by **Paula Despins (VP, Ads Measurement)** at the IAB Annual Leadership Meeting [21][22]. It acts as a **\"translation layer\"** between Amazon's APIs and any MCP-compatible agent, letting agents **build complete campaigns (ad groups, audiences, budgets) from natural-language prompts, run performance reports, manage accounts and billing, and expand campaigns internationally** [21][22]. Crucially, and unlike Google's read-only server, it is **write-capable**. Amazon confirmed compatibility with Claude, ChatGPT, and Gemini, plus custom agency/advertiser agents [22]. Any seller or agency with active Amazon Ads API credentials could connect at launch [22]. Despins's rationale captures the per-platform logic: granular APIs make agents \"make mistakes due to an overabundance of information... like dumping the file cabinet out instead of saying, 'Here's the three files you need'\" [21]. The \"open beta\" label reflects status as of February 2026.\n\n### 5.3 Meta — Ads AI Connectors, open beta\n\n**Meta launched Meta Ads AI Connectors in open beta on April 29, 2026** [23][24], the most recent of the three. It bundles an **official MCP server at `mcp.facebook.com/ads`** plus a CLI (`@meta/ads-cli`), exposing **29 tools across reporting/insights, campaign management, catalog operations, account diagnostics, and dataset operations** [23][24]. Authentication is a single Meta Business OAuth click with read-only, read/write, or read/write/financial scopes — \"the old App Review path is gone\" [24]. Meta states support for \"any MCP-compatible client\" — Claude, Claude Code, ChatGPT (Connectors mode), Cursor, Codex, Windsurf, Manus — and notes Gemini does not yet support MCP natively, \"although Google has promised to add it\" [24]. **Caution:** the search corpus is thick with *third-party* Meta Ads MCP servers (pipeboard-co, gomarble, etc.); the reference here is specifically the **official Meta server**, dated April 29, 2026 [23][24]. It was live as an open beta as of that launch.\n\n### 5.4 What the third force means\n\nThree reads, in order of confidence:\n\n1. **The walled gardens are using MCP as a one-way valve.** MCP lets *external* agents (Claude, ChatGPT) operate *inside* the garden's API — but on the garden's terms, with the garden defining the tools and (in Google's case) keeping writes out. This is the opposite of the open-ecosystem dream where agents shop *across* platforms; it is each platform building its own agentic front door [37]. As one synthesis put it, walled gardens \"could concentrate market power... and lead to fragmentation of agentic ecosystems\" [37].\n2. **It validates MCP-as-substrate and sidelines AdCP-vs-ARTF.** Note what the gardens did *not* do: they did not adopt AdCP's negotiation grammar, and they did not join ARTF's colocated-RTB scheme. They adopted **MCP directly** and built per-platform servers. This is strong evidence that **MCP is the real, uncontested standard**, and that the open-ecosystem \"protocol war\" is a fight over the **non-walled-garden ~$400B of programmatic spend** [37] — meaningful, but not the whole market, and not the gardens.\n3. **These facts will date fast.** Three of the most important \"current\" facts in this space — Amazon's beta, Meta's beta, Google's Ask Advisor — are all under 12 months old, all labeled \"beta,\" and all from press releases or vendor blogs. Each is a present-tense status claim that will silently go stale via GA, rename, or sunset. They should be read as snapshots from mid-2026, not as standing descriptions.\n\n---\n\n## 6. The Standards-Politics Lens — Who Controls the Standard Controls the Rents\n\nThis is the analytical core. Standards are not neutral plumbing; they are **rent-allocation machines.** Whoever defines the standard defines the toll booths.\n\n### 6.1 What each body has at stake\n\n**The IAB Tech Lab's stake is existential and financial.** Its revenue and relevance flow from stewarding the standards the industry pays to use and certify against — OpenRTB, VAST, AdCOM, the Deals API. If the agentic era genuinely \"burns down the house\" and routes around OpenRTB, the Tech Lab's reason to collect dues weakens — which is precisely the AAO's attack line [29]. So the Tech Lab's incentive bends structurally toward **evolution (extend what we already own)** over **revolution (replace it)** — visible in Katsur's \"remodel the kitchen, don't burn down the house\" [27] and the roadmap's \"build on an existing shared foundation, not introduce multiple new standards\" [26]. Whether that posture is *correct* or merely *self-interested* is exactly what is contested.\n\n**The AAO's stake is to become the new toll-keeper.** A new 501(c)(6) with a 40-seat board, a certification \"Academy,\" and an agent registry [3] is building the *same kind of rent machine* — just for the agentic layer it hopes will matter. The insurgent's pitch is \"the old standard may be obsolete,\" but the insurgent's *business model* is identical: steward a standard, sell membership and certification, define compliance. This is why dual-membership across so many firms is rational. They are **hedging which toll booth the traffic will route through.**\n\n**The walled gardens' stake is to need neither toll booth.** Google, Amazon, and Meta own their inventory end-to-end. They do not need an industry negotiation grammar or a colocated-RTB scheme; they need an agentic front door to their own garden, which MCP gives them for free [21][22][23][24]. Their stake is in **keeping the garden walled while looking open** — adopting the substrate (MCP) without adopting the standards (AdCP/ARTF) that would make their inventory shoppable *against* rivals.\n\n### 6.2 The margin-from-opacity problem\n\nThe deepest standards-politics insight here comes from SuperTruth's Jason Alan Snyder: **\"A lot of the margins in ad tech come from the fact that nobody has the full picture\"** [31]. If agents can share a consistent picture of how a campaign performed, \"that's a win for buyers but a potential problem for businesses that profit from fragmentation and opacity\" [37]. This reframes the whole standards war: **a truly open agentic standard is a transparency engine, and transparency is the enemy of the spread.** Every intermediary that today earns margin from information asymmetry has a quiet incentive to prefer the *complex, partial, vendor-controlled* standard over the *clean, complete, open* one. That incentive cuts across the camps. It is why even AdCP's supply-side coalition will face internal tension between \"open enough to win adoption\" and \"open enough to vaporize our own margins.\"\n\n---\n\n## 7. Who Keeps the Spread — The Margin Economics Under Each Path\n\nThe McKinsey question: under each architectural path, who captures the value? This is where the standards war meets the P&L. CTV is the sharpest case, because it carries the highest take-rates and the heaviest curation/PMP layering.\n\n### 7.1 The status quo double-dip\n\nToday a programmatic CTV impression typically pays **both** a DSP fee (buy-side) **and** an SSP fee (sell-side), often with a **curation fee layered on top** — and roughly half of sell-side curation deals carry extra fees beyond the standard SSP take, frequently obscured by non-disclosed revenue-sharing [38]. The core agentic critique, from Olyzon CEO Jules Minvielle: advertisers \"end up paying a DSP and an SSP fee for something that **can be processed in a different way** in an agentic world\" [39]. The spread is double-taxed. Agents threaten the double-tax.\n\n### 7.2 Path A — Agent-native negotiation (AdCP / seller-agent model)\n\nAdCP's seller-agent model lets publishers \"expose their inventory and contextual data directly to agents\" as \"**true direct buys**\" within publisher ad servers or curated marketplaces — **bypassing the exchange/DSP entirely** [40]. O'Kelley likened AdCP's launch to \"the debut of header bidding\" [40] — i.e., a structural rewiring of who touches the dollar. **Margin effect:** this is the most **disintermediating** path. It \"compresses the supply chain, shifting margin toward publishers/SSPs\" [16] and away from DSP take-rates. In CTV specifically — where Minvielle argues \"programmatic is obsolete\" and Swivel's Frans Vermeulen says \"there's a better way\" [39] — a buyer agent negotiating a PMP directly with a publisher's seller agent could collapse the DSP+SSP+curation stack into a single negotiated direct buy. **Who keeps the spread:** publishers and whoever operates the seller agent; DSPs lose the most; the agent operator (possibly Scope3-style infrastructure) inserts a new, presumably thinner, toll.\n\n### 7.3 Path B — Colocated RTB (ARTF)\n\nARTF deliberately **does not touch the business model** — it touches the *architecture*. By containerizing vendor logic inside the SSP's data center, it cuts latency (~80% claimed) and compute overhead [11][13] while **preserving DSP centrality in decisioning** [16]. Goel's assessment is that ARTF will be adopted precisely because \"the specification asks the industry to change architecture rather than business model\" [13]. **Margin effect:** ARTF **preserves DSP and SSP take-rates.** It makes the existing toll booths faster and cheaper to run, not fewer. **Who keeps the spread:** the same incumbents as today (DSPs, SSPs), now with lower operating cost and a possible efficiency dividend they can keep or pass through. This is why The Trade Desk and the big buy-side are comfortable with the Tech Lab's approach [7][8] — it doesn't threaten the spread, it optimizes it.\n\n### 7.4 Path C — Per-platform MCP (the walled gardens)\n\nUnder the garden path, the \"spread\" question barely applies in the open-market sense: Google, Amazon, and Meta capture the **full margin on their owned-and-operated inventory** and simply add an agentic interface on top [21][22][23][24]. There is no DSP/SSP to disintermediate inside a garden — the garden *is* the stack. **Margin effect:** **neutral-to-accretive for the gardens** (lower friction, more spend, no margin given up) and **irrelevant to the open-ecosystem intermediaries**, who never touched that spend. The risk for everyone else is that frictionless agentic access *pulls more spend into the gardens*, shrinking the open-market pie the AdCP/ARTF fight is even about.\n\n### 7.5 The agency role under each path\n\n- **Path A (AdCP):** agencies' planning/optimization workflows get automated, and the value of a DSP relationship erodes — but agencies that *operate the buyer agents* could capture new value as agentic orchestrators [40].\n- **Path B (ARTF):** least disruptive to agencies; the buy still flows through familiar DSPs, just faster.\n- **Path C (gardens):** agencies plug their own LLMs into garden MCP servers [21][22][24] — convenient, but it deepens dependence on the gardens and on whoever's foundation model (Anthropic/OpenAI/Google) sits in the agent.\n\n### 7.6 The DSP/SSP survival read\n\nThe balanced conclusion from the trade press: DSPs and SSPs **survive where their scale advantage is real** — \"operating across multiple media channels with thousands of publishers, where programmatic's 'wide net' applies,\" or where the DSP is \"the sole access point to certain inventory\" [39]. They are **most threatened in concentrated, high-take-rate channels — i.e., CTV** — where a small number of large publishers can each stand up a seller agent and a buyer can negotiate directly. **No source provides hard take-rate percentages for the agentic future.** Every margin claim here is directional, not quantified, and that gap is flagged honestly in the Open Questions.\n\n### 7.7 Exhibit: who keeps the spread, by path\n\n| | Path A — AdCP negotiation | Path B — ARTF colocated RTB | Path C — Garden MCP |\n| --- | --- | --- | --- |\n| **DSP take-rate** | Compressed / bypassed [16][40] | Preserved, cheaper to run [13][16] | N/A (no DSP in garden) |\n| **SSP fee** | Shifts toward SSP/publisher [16] | Preserved [16] | N/A |\n| **Curation margin** | At risk (direct buys) [40] | Preserved | N/A |\n| **Agency role** | Automated → orchestrator [40] | Largely unchanged | Garden-dependent |\n| **Who keeps spread** | Publishers + agent operator | Incumbent DSP/SSP | The garden |\n| **CTV impact** | Largest (PMP collapse) [39] | Efficiency gain | Spend gravitates in |\n| **Incumbent threat** | High | Low | Existential to *open* market |\n\n---\n\n## 8. CTV — Why the Living Room Is Where This Gets Decided\n\nThe protocol mechanics all point back to one room: the living room. CTV is where this gets decided.\n\n**CTV is the highest-stakes battlefield for three reasons.** First, **take-rates and curation layering are heaviest in CTV**, so disintermediation has the most margin to liberate — Path A's PMP-collapse threat bites hardest here [38][39]. Second, **walled-garden concentration is extreme in CTV** — Amazon (Prime Video/Fire), Google (YouTube), and the platform gardens own enormous owned-and-operated streaming inventory, so Path C's \"spend gravitates into the garden\" dynamic is most acute in the living room [21][37]. Third, the **AdCP coalition is deliberately CTV/supply-weighted** — Triton, Samba TV, LG Ad Solutions, Magnite — signaling that the insurgents see CTV curation/PMP as the **beachhead** where agent-native negotiation can prove itself against the double-dip [1][2].\n\nThe synthesis for CTV: the **gardens route their owned CTV through their own MCP servers** (Amazon Ads MCP already does campaign creation on Amazon inventory [21][22]); the **open CTV supply** (Magnite, LG, Samba, the long tail) is where AdCP's seller-agent direct-buy model competes to compress the DSP+SSP+curation stack; and **ARTF makes the surviving open-CTV auctions faster** without changing who gets paid. The most likely CTV outcome mirrors the overall adjudication: **layering in production, with the gardens pulling spend inward and the open market fighting over how thin the remaining toll can get.**\n\n---\n\n## 9. Open Questions\n\n1. **Does AdCP get absorbed rather than defeated?** The most likely \"loser keeps operating\" outcome is the IAB Tech Lab incorporating AdCP-style negotiation grammar into its own buyer/seller SDKs, neutralizing the insurgency by adoption. No source confirms this is happening — but the layering logic and the dual-membership pattern point at it. Watch the AAMP SDK roadmap (v3.0 due July 2026 [10][15]).\n2. **What are the actual agentic take-rates?** Every margin claim in these pages is directional. No source provides hard DSP-take / SSP-fee / curation-margin figures for an agentic transaction vs. a traditional one. This is the single biggest quantification gap and the most important number to pin down.\n3. **Is the ARTF ~80% latency claim independently true?** It is the IAB's own claim, repeated by trade press, not independently benchmarked [11][13]. An independent latency benchmark from a neutral party (an exchange, a DSP, an academic) would settle it.\n4. **Will the walled gardens *ever* adopt an open agentic standard, or only their own MCP servers?** The current evidence (three per-platform servers, zero garden participation in AdCP/ARTF) points to permanent garden autonomy [37], but a regulatory or buyer-pressure shift could change it.\n5. **Does the foundation-model layer become its own power center?** Anthropic owns MCP; Google and OpenAI push their own commerce/agent protocols (A2A, AP2, ACP — taken up later, in the chapter on the adjacent commerce and payment layer). If the *model* (Claude vs. ChatGPT vs. Gemini) sitting in the agent becomes the real chokepoint, the AdCP-vs-ARTF fight may be subordinate to a model-layer war these pages only gesture at.\n6. **What is the real adoption curve?** The gap between \"30 autonomous campaigns\" (May 2026) and \"hundreds of billions of transactions daily\" [30] is enormous. Whether 2027 closes that gap or whether agentic buying plateaus as an assistive layer is the variable that determines whether any of this governance war matters.\n7. **AAMP's own naming/version instability.** \"Agentic Advertising Management Protocols\" vs. \"Agentic Advertising and Marketing Protocol\" vs. \"Agentic Ad Management Protocol\"; ARTF as \"Real Time\" vs. \"Real-Time Bidding\"; v1.0 (Jan 28, 2026) vs. v2.0 vs. v3.0 (July 2026) — the incumbent's own taxonomy is unsettled, which is itself a hazard for any present-tense claim.\n\n---\n\n## Sources\n\n1. PPC Land, \"Ad Context Protocol (AdCP) launches for advertising automation,\" Oct 2025. https://ppc.land/ad-context-protocol-adcp-launches-for-advertising-automation/ — Tier 5 (specialist PPC trade press). Founding members, MCP foundation, launch date. Accessed 2026-06-19.\n2. Samba TV (press release), \"Industry Coalition Launches Ad Context Protocol (AdCP),\" Oct 15, 2025. https://www.samba.tv/press-releases/industry-coalition-launches-ad-context-protocol-adcp-open-standard-for-agentic-advertising-infrastructure — Tier 1 (coalition's own claim, corroborated). Members and mission as *claimed*. Accessed 2026-06-19.\n3. AgenticAdvertising.org, \"About,\" 2026. https://agenticadvertising.org/about — Tier 1 (org's own statement about itself). 501(c)(6) structure, interim leadership (Rothenberg, Egol), three pillars. Accessed 2026-06-19.\n4. Tipsheet.ai / LinkedIn (Masse, O'Kelley, Rothenberg posts), \"AgenticAdvertising.org — a new governance effort for AdCP,\" Dec 2025. https://tipsheet.ai/governance/agentic-advertising-org/ — Tier 5/7 mix (analyst tipsheet + principals' own posts as position-evidence). Governance launch, leadership. Accessed 2026-06-19.\n5. PubMatic, \"Moving Beyond AdCP vs ARTF: Understanding Their Roles in Agentic Advertising,\" Jan 8, 2026. https://pubmatic.com/blog/moving-beyond-adcp-vs-artf-understanding-their-roles-in-agentic-advertising/ — Tier 6 (vendor position; PubMatic s
