e-to-enhance-ad-stack/ — accessed 2026-06-17.\n17. Pixalate — \"Q3 2025 SSP Market Share Report — LATAM\" (Mexico CTV device-app rankings: OpenX/TripleLift/Magnite). Tier 5 (specialized data vendor). https://www.pixalate.com/blog/q3-2025-ssp-market-share-report-latam — accessed 2026-06-17.\n18. Retail Media News (BR) / Meio & Mensagem / Just Retail Latam / eMarketer — Mercado Ads 2025 upfront CTV partnerships (HBO Max, Roku, Disney+, Mercado Play; BR/AR/CO/MX), full-funnel 2026 positioning, ~60% LATAM retail-media share. Tier 5 (trade/analytical). https://retailmedianews.com.br/noticias/mercado-ads-em-2026-o-salto-do-retail-media-para-uma-plataforma-de-midia-full-funnel-ctv-off-site-e-mensuracao-avancada/ — accessed 2026-06-17.\n19. Esports Insider — \"Brazil Senate approves sweeping betting ad restrictions,\" May 2025. Tier 5 (trade). https://esportsinsider.com/2025/05/brazil-senate-approves-sweeping-betting-ad-restrictions — accessed 2026-06-17.\n20. Vixio — \"How Brazil's New Gambling Advertising Restrictions Will Impact Operators,\" 2025. Tier 5 (specialized regulatory). https://www.vixio.com/blog/how-brazils-new-gambling-advertising-restrictions-will-impact-operators — accessed 2026-06-17.\n21. iGamingToday / Yogonet — Brazil Senate betting-ad bill, R$ revenue-gap warnings, Chamber-of-Deputies next step, May 2025. Tier 5 (trade). https://www.igamingtoday.com/brazilian-senate-advances-bill-to-ban-betting-advertising-threatening-r-842-million-gap-in-serie-a/ — accessed 2026-06-17.\n22. AdExchanger — \"Microsoft Is Shutting Down Invest, The One-Time AppNexus DSP Business,\" May 2025 (Monetize SSP retained). Tier 5 (trade, ad-tech). https://www.adexchanger.com/online-advertising/microsoft-invest-formerly-xandr-dsp-and-formerly-appnexus-before-that-will-just-be-formerly/ — accessed 2026-06-17.\n23. MediaPost — \"Microsoft To Shutter DSP, Formerly Xandr, Replace It With AI,\" May 15, 2025 (closure date Feb 28, 2026). Tier 5 (trade). https://www.mediapost.com/publications/article/405873/microsoft-to-shutter-dsp-formerly-xandr-replace.html — accessed 2026-06-17.\n24. Digiday — \"Ad Tech Briefing: Microsoft's DSP closure,\" 2025. Tier 5 (trade). https://digiday.com/media-buying/ad-tech-briefing-microsofts-dsp-closure-signals-ad-tech-consolidation-as-well-as-the-ai-arms-race/ — accessed 2026-06-17.\n25. MiQ — \"MiQ Acquires Adsmovil, Creating Largest Independent Programmatic Offering In Latin America,\" Mar 25, 2026 (12 markets; Sigma LATAM May 2026). Tier 1 (company). https://www.wearemiq.com/resources/news/miq-acquires-adsmovil — accessed 2026-06-17.\n26. BusinessWire — \"MiQ Acquires Adsmovil…,\" Mar 25, 2026. Tier 1 (press wire, distributing company release — used as evidence of the announcement, not independent verification of operational claims). https://www.businesswire.com/news/home/20260325615344/en/ — accessed 2026-06-17.\n27. PRNewswire — \"Amagi Boosts FAST Channel Count in Brazil with Globo and AD Digital.\" Tier 1 (press wire). https://www.prnewswire.com/news-releases/amagi-boosts-fast-channel-count-in-brazil-through-strategic-partnership-with-globo-and-ad-digital-302164966.html — accessed 2026-06-17.\n\n---\n\n*Company-agnostic by design: where a vendor is named it is as a market participant, not a recommended solution. Quantitative claims are sourced inline; figures that rest on a single source or an inference should be treated as directional pending corroboration. Present-tense statuses are dated in §7.*"}, {"order": 4, "file": "04_Measurement_Identity.md", "title": "Measurement & Identity in the Latin American Programmatic CTV Market", "summary": "", "body": "# Measurement & Identity in the Latin American Programmatic CTV Market\n\n## Bottom Line\n\nLatin America measures and targets Connected-TV audiences on a structurally different substrate than the United States or Europe: mobile-first, Android-dominated, telco-heavy, and low on the authenticated-email signal that anchors Anglo addressability. Currency is now bifurcating by country. The thirty-year incumbent — the Brazilian-origin IBOPE people-meter, consolidated under Kantar IBOPE Media — survived a $1B private-equity carve-out (H.I.G. Capital, closed August 2025) and a February 2026 rebrand to **Fifty5Blue**, and still runs the trading currency across Brazil, Argentina, Colombia, Chile and Peru. But Mexico broke ranks: its buy-side Joint Industry Committee, **ACAM**, replaced the Nielsen IBOPE joint venture with the Mexican firm **HR Media** as the official video-audience currency for 2025–2026, and an independent RSMB/3M3A audit cleared the service in mid-2025. Cross-media (linear + CTV) deduplication is most advanced in Brazil, where Netflix has sat inside the local panel since January 2023 and Comscore supplies person-level CTV. Identity runs through GAID/mobile IDs, IP/household graphs, retail and broadcaster first-party logins, smart-TV ACR (LG, Samsung, VIDAA/Hisense), and — the regional differentiator — telco first-party data from América Móvil/Claro, Telefónica/Vivo/Movistar and TIM. The largest LATAM-native identity asset combined to date is the **MiQ + Adsmovil** graph (400M+ vendor-stated unique IDs, announced March 2026). The 2025 collapse of Google's Privacy Sandbox preserves the GAID and matters less in LATAM than it would in a cookie-dependent market. Every \"currently operates\" status below is a dated factual claim, not background.\n\n---\n\n## 1. The Currency Landscape — A Region Splitting in Two\n\nFor three decades Latin American television ran on effectively one currency: **IBOPE** (Instituto Brasileiro de Opinião Pública e Estatística), the Brazilian people-meter operator that expanded through partnerships into Mexico, Colombia, Venezuela, Ecuador, Peru, Chile and Argentina during the 1990s. Minute by minute, the IBOPE people-meter records set power-on, channel selection, dwell time, channel changes, and which household members are watching, within a representative panel. WPP acquired IBOPE in 2014 and rebranded it Kantar IBOPE Media.\n\nThe ownership chain has now turned over again — and this time it matters for who controls the currency. In **August 2025**, Kantar Group sold its media-measurement division to private-equity firm **H.I.G. Capital** for approximately **$1 billion**; required to drop the Kantar name within two years, the unit **rebranded as Fifty5Blue in February 2026** (announced February 25, 2026). Fifty5Blue kept its established product lineup — IBOPE (the primary TV-ratings currency in Latin America), the TGI consumer survey, and the TechEdge analysis platform — and positioned itself as a standalone independent measurement business operating in 80+ countries. The upshot: the LATAM currency operator changed owners and names twice in eleven years, but the underlying IBOPE panel currency never broke.\n\nAgainst that continuity, **Mexico is the exception that proves the rule** — the clearest LATAM analogue to the US JIC-versus-Nielsen drama. On **December 16, 2024**, Mexico's Joint Industry Committee, **ACAM** (Alianza para la Calidad de la Medición Multimedia en México, A.C.), named **HR Media** — part of the Mexican firm HR Ratings — the official video-audience-measurement provider for **2025 and 2026, effective January 1, 2025**, displacing the long-standing **Nielsen IBOPE** joint venture (founded 1998). This is a buy-side committee certifying a domestic challenger and ejecting an incumbent JV as the trading currency — exactly the dynamic the US market has debated for years.\n\nCrucially, the Mexican switch did not stay an unaudited vendor claim. In early 2025 ACAM appointed two independent international firms to audit the HR Media TAM service jointly — **RSMB** (methodological audit of HR Media's statistical, recruitment and data-production processes) and **3M3A** (in-field panel-home visits validating metering data capture). ACAM published the completed audit in **June 2025**; the auditors concluded that the service is \"well designed, executed and fit-for-purpose\" and that the Mexican industry \"can trust the published metrics for content analysis and the buying and selling of advertising space.\" HR Media's own description of its panel — roughly 80% of the urban population, more than 76 million individuals across about 22 million households, with statistical efficiency above 95%, plus Total-TV, out-of-home and time-shifted viewing — remains a vendor figure, but it now carries third-party audit cover it lacked at selection.\n\nNielsen has not vanished from Mexico; it runs in parallel as commercial (non-currency) measurement. Its **Gauge Mexico** streaming/linear share report expanded from three cities to a wider footprint through 2024–2025. So Mexico now has a **split-currency** market: HR Media is the JIC-blessed trading currency, while Nielsen continues to publish competing share data — a structurally healthier-but-noisier state than the single-currency markets around it.\n\nThe rest of the region remains on the IBOPE/Fifty5Blue currency. In Argentina, Kantar IBOPE is described as the only certified audience-measurement company, and an industry \"Audience Measurement Control Chamber\" (composed of channels, agencies and advertisers) audits the measurer without running the currency itself. Brazil, Colombia, Chile and Peru likewise trade on the IBOPE people-meter. The strategic reading for buyers: currency is no longer a constant across LATAM but a per-country planning variable, and Mexico is the worked example other markets will watch.\n\n### Per-country currency snapshot\n\n| Country | Trading currency (incumbent) | Operator / owner | Cross-media / CTV layer |\n|---|---|---|---|\n| **Brazil** | IBOPE people-meter | Fifty5Blue (ex-Kantar IBOPE) | Most advanced: Netflix on panel since Jan 2023; Comscore person-level CTV; YouTube-CTV |\n| **Mexico** | **HR Media** (official 2025–26, replaced Nielsen IBOPE) | HR Media / HR Ratings, selected by **ACAM (JIC)**; RSMB/3M3A audited 2025 | HR Media+ single-source cross-media; Nielsen Gauge in parallel; Comscore CTV |\n| **Colombia** | IBOPE people-meter | Fifty5Blue | Cross-Platform View |\n| **Argentina** | IBOPE people-meter (only certified measurer) | Fifty5Blue | Cross-Platform View; Comscore CTV; Control Chamber audits |\n| **Chile** | IBOPE people-meter | Fifty5Blue | Cross-Platform View |\n| **Peru** | IBOPE people-meter (TAM) | Fifty5Blue | Cross-Platform View (launched July 2025) |\n\n---\n\n## 2. Cross-Media and CTV Measurement — Brazil Leads, the Rest Trail\n\nDeduplicating linear TV against streaming and CTV is the hard problem of modern measurement, and **Brazil is the LATAM showcase**. Kantar IBOPE (now Fifty5Blue) launched an industry-wide cross-media planning initiative integrating linear TV, on-demand video and video-sharing platforms, with YouTube the first streaming platform integrated. Most striking of all: **Netflix subscribed to the local audience-measurement panel from January 2023**, gaining a cross-platform view of its performance alongside linear and on-demand networks — one of the few markets globally where Netflix sits inside the local TV-ratings currency. Brazil's dominant broadcaster, Globo, uses cross-media measurement to balance linear against its GloboPlay VOD service.\n\nThe digital and CTV census-and-panel layer is supplied chiefly by **Comscore**, which activated person-level CTV traffic measurement in Brazil, Mexico and Argentina inside Video Metrix Multi-Platform, and from **February 2025** began adding person-level YouTube-CTV reach to those markets. Comscore also offers cookie-free age/gender demographic targeting in Brazil and Mexico and contextual CTV targeting via its Proximic product — relevant to the identity discussion in Section 4.\n\nOne methodology gap is real and worth flagging: neither Fifty5Blue's Cross-Platform View nor HR Media's HR Media+ publishes its dedup algorithm or current panel sizes. Outside Argentina — where a ~1,000-home Buenos Aires panel figure has appeared in domestic press — people-meter panel sizes for Brazil, Colombia, Chile and Peru are not publicly disclosed. So treat cross-media dedup as \"Brazil-grade in Brazil/Mexico, lighter elsewhere,\" and treat panel-size and algorithm specifics as a known gap.\n\n---\n\n## 3. The Structural Premise — Mobile-First, Android-Dominated\n\nEvery LATAM identity decision flows from one fact: the region is overwhelmingly Android. Statcounter-class data put LATAM at roughly 91% Android (Brazil ~84%, Mexico ~76% Android), which makes the **GAID (Google Advertising ID)** the dominant persistent mobile identifier and de-emphasizes the authenticated-email graphs that anchor US addressability. Younger LATAM consumers often reach streaming through a phone before they own a smart TV or PC. The smartphone is the entry point; the GAID is the connective tissue between mobile and CTV.\n\nSo identity in LATAM is built from GAID plus IP/household graphs, plus first-party logins from retailers, streamers and telcos, plus smart-TV ACR — not from the email-first identity stack of the US open web. That is why the cookie debate (Section 5) lands softly here, and why telco data (Section 6) is disproportionately valuable.\n\n---\n\n## 4. Identity & Addressability — The Stack Without Cookies\n\n### The LATAM-native graphs\n\nThe largest LATAM-native identity asset combined to date is the **MiQ + Adsmovil** graph. On **March 25, 2026**, MiQ announced the acquisition of Adsmovil's Latin America business, describing the combination as the \"largest independent programmatic offering in Latin America,\" anchored by **more than 400 million unique IDs** spanning what people watch, browse and buy, across **12 markets** (Mexico, Brazil, Colombia, Argentina, Chile, Costa Rica, Ecuador, El Salvador, Guatemala, Peru, Puerto Rico, Uruguay) and 150+ employees. The deal folds in Adsmovil Personas (mobile-first audience segmentation) and Linki (omnichannel retail media), and MiQ said it would launch its Sigma platform in LATAM in **May 2026**. Financial terms were not disclosed. The 400M-ID figure is vendor-stated and unaudited, but the underlying fact — that MiQ now owns Adsmovil's LATAM business as of March 2026 — is well corroborated.\n\n### The imported identity standards\n\n**LiveRamp** operates in LATAM and is actively expanding. It offers **RampID** (its pseudonymous people-based identifier) and the **Authenticated Traffic Solution (ATS)** for cookieless addressability, and in **October 2025** announced new ATS, ATS Direct, PAIR and Google Curation partners across the US, Europe, LATAM and APAC. LiveRamp has named regional leadership — a director of Addressability for Latin America and a director of Addressability in Brazil tasked with driving ATS adoption. The LATAM-distinctive constraint, however, persists: LiveRamp's documentation states it does **not maintain an offline PII identity graph for Mexico** (best match rates come via passthrough/RampID-transacting destinations), so its deterministic graph is structurally weaker in LATAM than in the US, leaning on passthrough rather than a resolved offline graph.\n\n**UID2** (the email/phone-based open-internet ID associated with The Trade Desk) and **ID5** (deterministic + probabilistic IDs, recently pushing into CTV via integrations such as Rakuten TV in January 2026) are both global standards, but their LATAM-specific adoption is **thinly documented** in public sources. Given the region's low logged-in/email-auth density and Android dominance, their near-term LATAM weight is plausibly below their US footprint — but that is an inference, not a measured fact.\n\n### Publisher and retail first-party IDs\n\nIn a low-email-auth environment, **publisher and retail first-party logins** do disproportionate work as deterministic anchors. Retailers (above all Mercado Libre), streaming platforms, and broadcaster VOD services (e.g., GloboPlay) enrich their logged-in user graphs within statutes like Brazil's LGPD, supplying the authenticated spine that the open web cannot. This reading follows from the structure of the market rather than any single disclosure.\n\n### ACR — the smart-TV-glass signal\n\nAutomatic Content Recognition reads content off the TV panel itself and is the OEM-bounded identity/measurement layer. Its LATAM availability is partial and consolidating:\n\n- **LG Ad Solutions** replaced legacy Samba TV data outside the US (from September 2022) with its own proprietary ACR, rolling across 27 countries including Argentina, Brazil and Mexico, and activates it programmatically (e.g., via Magnite).\n- **Samsung Ads** runs proprietary first-party ACR in LATAM and is in an active expansion phase: it named a new regional leadership team (Senior Director of Sales and Operations LATAM plus heads of sales and operations) across October 2025–January 2026, and works with Magnite to scale CTV supply in Brazil and Mexico.\n- **VIDAA/Hisense** ACR has expanded into LATAM; Nexxen holds the ACR-monetization rights but those rights are scoped to North America, so LATAM monetization of VIDAA ACR is less locked-in.\n- **Samba TV** and **Vizio** are comparatively thin in the region after Samba lost LG-outside-US rights in 2022; Vizio is essentially a US/North-America asset.\n\n---\n\n## 5. Data Deprecation — The Cookie Reprieve LATAM Barely Needed\n\nThe global cookie story has now resolved — and it resolved in a way that matters less to LATAM than to cookie-dependent markets. Google announced in July 2024 it would not phase out third-party cookies in Chrome; in April 2025 it dropped the planned consent prompt; and in **October 2025 it officially ended the Privacy Sandbox initiative after six years, retiring the remaining APIs (Topics, Protected Audience/FLEDGE, Attribution Reporting) for both Chrome and Android**, citing low adoption and regulatory pressure. Third-party cookies remain in Chrome with no removal timeline.\n\nFor LATAM, the net effect is twofold. First, the cookie reprieve preserves a desktop signal that was already secondary in an Android-mobile-CTV market. Second, and more important: the death of the Android Privacy Sandbox leaves the **GAID intact for now** — a genuine reprieve for the region's dominant mobile identifier. Attribution and addressability in LATAM continue to lean on GAID, server-side tracking, probabilistic methods, the Play Install Referrer, and contextual targeting rather than on either cookies or Sandbox APIs. CTV is comparatively insulated from identity headwinds because logged-in app/CTV environments and ACR supply first-party and content signals — an industry consensus more than a measured finding.\n\n---\n\n## 6. Telco Data — The LATAM Differentiator\n\nOne feature distinguishes LATAM addressability above all others: the scale and market share of its telcos' first-party data. **América Móvil/Claro**, **Telefónica/Vivo/Movistar**, and **TIM Brasil** sit on subscriber, location, billing and pay-TV/IPTV set-top data at a market concentration US/EU telcos rarely match. Commercialization is moving on two tracks, and both are still early.\n\n**Track 1 — addressable pay-TV/CTV inventory.** Telcos are turning set-top and digital inventory into monetizable addressable surfaces through bespoke deals — the clearest example being Claro Brasil's multi-year contract (announced October 2024) to monetize its digital and pay-TV advertising inventory through a third-party media-technology partner. (This rests on the partner's announcement; treat the operational scale as the partner's framing.)\n\n**Track 2 — standardized network APIs (CAMARA / Open Gateway via Aduna).** Vivo, Claro and TIM Brasil are commercializing CAMARA-compliant network APIs through **Aduna** (the operator-plus-Ericsson venture). An October 22, 2025 announcement targeted a **Q4 2025 commercial launch** focused on **Number Verification** and **SIM Swap** detection — primarily anti-fraud use cases for Brazil's digital-banking and mobile-commerce boom. The advertising-relevant **Device Location API** has been cited in earlier announcements as part of the Brazilian operators' Open Gateway slate, but the most recent Aduna release foregrounds the anti-fraud APIs, not location — so the addressability use case is more aspirational than the headline security launch. The precise live status of Device Location for advertising targeting remains uncertain as of mid-2026.\n\nThe honest synthesis: the telco asset is real and large, but commercialization is fragmented across bespoke inventory deals, sponsored-data experiments, and standardized network APIs whose first wave is anti-fraud rather than ad targeting. Full subscriber-graph ad targeting remains gated by LGPD/consent. Telco partnerships are the highest-leverage LATAM identity move precisely because the asset is still under-monetized.\n\n---\n\n## 7. Attribution & Outcomes\n\nLATAM's mobile-first, app-install-heavy economy (gaming, fintech, retail apps) makes **Mobile Measurement Partners** the workhorse of CTV outcome measurement. AppsFlyer and Adjust dominate; AppsFlyer's CTV attribution links CTV exposure to app installs, web signups and purchases via cross-device matching, including CTV-to-mobile view-through with household-level attribution. Post-Sandbox, MMP attribution leans on server-side tracking, probabilistic methods and the Play Install Referrer for Android.\n\nFor sales outcomes, **retail-media clean rooms** are becoming the de-facto closed loop — above all **Mercado Ads** (Mercado Libre), which activates audiences on real marketplace and Mercado Pago first-party behavior and is expanding into CTV/audiovisual inventory. Industry forecasts have Mercado Libre capturing more than half of regional retail-media spend, with Brazil and Mexico accounting for the bulk of retail-media dollars; these are eMarketer-class estimates better treated in the chapter on sizing the market, but the clean-room mechanics are the relevant identity infrastructure here. Closing the loop from a CTV impression to a retail sale requires either deterministic identity (loyalty/payment data) or a clean room that joins exposure logs to transactions without exposing raw PII. The binding constraint is **standardized incrementality**: LATAM lacks consistent lift standards, so geo-lift and clean-room-based lift are the most portable rigorous methods into the region today.\n\n---\n\n## 8. Synthesis — What a Buyer Actually Faces\n\n1. **Currency is a per-country variable, not a constant.** Fifty5Blue's IBOPE currency holds Brazil, Argentina, Colombia, Chile and Peru; Mexico's ACAM→HR Media switch (now independently audited) proves a buy-side JIC can displace an incumbent. Currency optionality is now a planning input.\n2. **Cross-media dedup is Brazil-first.** Netflix-on-panel and Comscore person-level CTV make Brazil years ahead; Mexico catches up via HR Media+; elsewhere expect lighter CTV-census integration.\n3. **Identity must be mobile-and-telco-first.** With ~91% Android and weak offline-PII graphs (LiveRamp has none in Mexico), the realistic stack is GAID + IP/household + telco location + retail/CTV first-party + ACR. The LATAM-native MiQ/Adsmovil graph and telco data outweigh imported email-auth standards (UID2/ID5) that remain thinly documented in the region.\n4. **The cookie reprieve is largely irrelevant; GAID persistence is the real win.** Build for GAID + contextual + clean-room, not for a cookie cliff LATAM was never standing on.\n5. **Telcos are the swing asset, but immature.** Aduna's first commercial API wave is anti-fraud; addressable inventory deals are bespoke; full subscriber-graph targeting is consent-gated.\n6. **Outcomes run through MMPs and retail clean rooms.** AppsFlyer/Adjust for app installs; Mercado Ads + clean rooms for sales; the missing piece is standardized incrementality.\n\n---\n\n## Open Questions\n\n- **Panel sizes and dedup algorithms** for Brazil, Colombia, Chile and Peru (Fifty5Blue) are not publicly disclosed; only Argentina's ~1,000-home Buenos Aires figure has surfaced in domestic press. The dedup methodology behind Cross-Platform View and HR Media+ is opaque.\n- **UID2 and ID5 LATAM deployment depth** is undocumented in public sources — the inference that they trail their US footprint is reasonable but unverified.\n- **HR Media panel specifics** (76M individuals / 22M households / >95% efficiency) are vendor-stated; the RSMB/3M3A audit validated fitness-for-purpose but the public audit statement does not republish the panel figures in detail.\n- **The MiQ/Adsmovil \"400M+ IDs\"** figure is vendor-stated and unaudited; the underlying ownership fact is corroborated.\n- **Aduna Device Location API for advertising** — is it commercially live for ad targeting (vs. anti-fraud) in Brazil as of mid-2026? The most recent release foregrounds Number Verification and SIM Swap.\n- **Claro Brasil inventory-monetization deal** scale and current operational status rest on the partner's October 2024 announcement; an independent or more recent confirmation would strengthen it.\n- **Samsung Ads / VIDAA ACR reach figures** in LATAM (device counts by country) are not disclosed; presence is confirmed, scale is not.\n- **Colombia, Chile, Peru identity infrastructure** beyond currency (telco-data commercialization, ACR availability) is thinly documented relative to Brazil and Mexico.\n\n---\n\n## Sources\n\nTier key: 1 = primary/company filing or official announcement; 3 = wire; 4 = major outlet; 5 = trade/analytical press. Press releases are Tier 1 for *what the entity claims*, paired with independent corroboration where possible.\n\n1. GlobeNewswire / HR Ratings — \"HR Media named official provider of video audience measurement in Mexico by ACAM,\" Dec 16, 2024. https://www.globenewswire.com/news-release/2024/12/16/2997662/0/en/HR-Media-named-official-provider-of-video-audience-measurement-in-Mexico-by-ACAM.html (Tier 1, company announcement). Accessed 2026-06-17.\n2. Advanced Television — \"Mexico: HR Media to provide video audience measurement,\" Dec 17, 2024. https://www.advanced-television.com/2024/12/17/mexico-hr-media-to-provide-video-audience-measurement/ (Tier 5, trade press). Accessed 2026-06-17.\n3. ACAM — \"El servicio de medición de audiencias de HR Media cumple satisfactoriamente los estándares de auditoría internacional\" (RSMB/3M3A audit conclusion). https://acamx.com/el-servicio-de-medicion-de-audiencias-de-hr-media-cumple-satisfactoriamente-los-estandares-de-auditoria-internacional/ (Tier 1, JIC announcement, Spanish). Accessed 2026-06-17.\n4. ACAM — \"Audit of HR Media TAM for ACAM — Audit Statement\" (final, June 2025 PDF). https://acamx.com/wp-content/uploads/2025/06/HR_Media_AuditStatement-final.pdf (Tier 1, primary audit document; cited via ACAM summary page and trade reports). Accessed 2026-06-17.\n5. RSMB — \"RSMB appointed to undertake audit of HR Media, Mexico.\" https://www.rsmb.solutions/news-items/rsmb-appointed-to-undertake-audit-of-hr-media-mexico (Tier 1, auditor announcement). Accessed 2026-06-17.\n6. MrWeb / Daily Research News Online — \"Mexico's JIC Appoints RSMB, 3M3A for Ad Currency Audit,\" no. 37945. https://www.mrweb.com/drno/news37945.htm (Tier 5, measurement-industry press). Accessed 2026-06-17.\n7. Marketing Dive — \"Kantar Media enters new era as Fifty5Blue following $1B sale.\" https://www.marketingdive.com/news/kantar-media-enters-new-era-as-fifty5blue-following-1b-sale/813478/ (Tier 5, trade press; $1B / Aug 2025 / IBOPE preservation). Accessed 2026-06-17.\n8. Adweek — \"Kantar Media Rebrands as Fifty5Blue Post-PE Carve-Out.\" https://www.adweek.com/agencies/kantar-media-rebrands-as-fifty5blue-post-pe-carve-out/ (Tier 5, trade press). Accessed 2026-06-17.\n9. Marketing-Interactive — \"Kantar Media rebrands as Fifty5Blue after H.I.G. Capital buyout.\" https://www.marketing-interactive.com/kantar-media-rebrands-as-fifty5blue-after-hig-capital-buyout (Tier 5). Accessed 2026-06-17.\n10. Kantar — \"Netflix signs up to Kan ps://www.didomi.io/blog/google-chrome-third-party-cookies-april-2025 (Tier 5, compliance vendor). Accessed 2026-06-17.\n25. Aduna / PR Newswire — \"Aduna Accelerates Network API Commercialization in Brazil with Vivo, Claro, and TIM Brasil,\" Oct 22, 2025 (Q4 2025 launch; Number Verification + SIM Swap). https://www.prnewswire.com/news-releases/aduna-accelerates-network-api-commercialization-in-brazil-with-vivo-claro-and-tim-brasil-302591795.html (Tier 1, company). Accessed 2026-06-17.\n26. Open Gateway / Telefónica — \"Brazil's leading operators launch Open Gateway APIs\" (Number Verification, SIM Swap, Device Location). https://opengateway.telefonica.com/en/news/article/commercial-launch-open-gateway-brazil (Tier 1, company). Accessed 2026-06-17.\n27. PR Newswire / ICARO Media Group — \"ICARO Media Group Announces 10-Year Contract with América Móvil's Claro Brasil,\" Oct 10, 2024. https://www.prnewswire.com/news-releases/icaro-media-group-announces-10-year-contract-with-america-movils-claro-brasil-302273260.html (Tier 1, partner announcement — claim is the partner's framing). Accessed 2026-06-17.\n28. AppsFlyer — \"CTV Attribution Platform\" and \"CTV-to-mobile app view-through attribution.\" https://www.appsflyer.com/products/measurement/ctv-attribution/ (Tier 1, vendor product docs). Accessed 2026-06-17.\n29. InformaBTL — \"Retail Media and CTV: When the Small Screen Becomes Measurable Again\" (Mercado Ads, Roku/Samsung TV Plus). https://www.informabtl.com/retail-media-and-ctv-when-the-small-screen-becomes-measurable-again/ (Tier 5, trade press). Accessed 2026-06-17.\n30. Statcounter — Mobile OS market share, South America / Brazil (Android ~91%). https://gs.statcounter.com/os-market-share/mobile/south-america (Tier 1, measurement data). Accessed 2026-06-17.\n31. Nielsen — \"The Gauge Mexico\" (parallel commercial streaming/linear measurement). https://www.nielsen.com/news-center/2025/the-gauge-mexico-march-2025/ (Tier 1, company). Accessed 2026-06-17.\n\n> **Source-base limitation.** These pages carry the standard LATAM constraint: several specifics rest on single vendor/JIC announcements (Tier 1 for *what is claimed*) without independent corroboration — flagged inline and in Open Questions. Spanish- and Portuguese-language primary sources (ACAM, Comscore LATAM, Samsung Ads BR, LiveRamp BR) are used directly to avoid an Anglo-only base. The June 2025 ACAM audit-statement PDF is cited via ACAM's own summary page and corroborating measurement-industry press; reading the PDF directly would strengthen it further."}, {"order": 5, "file": "05_Connectivity_Devices.md", "title": "The Wired and the Wireless Living Room — Connectivity, Devices & Platform Substrate of LATAM CTV", "summary": "", "body": "# The Wired and the Wireless Living Room\n### Connectivity, Devices, and Platform Penetration Underpinning LATAM CTV\n\n---\n\n## BOTTOM LINE\n\n**The screens are already in the living room. Bandwidth and the household budget to feed them are the variables that split the region in two.** Latin America crossed roughly **163 million installed smart TVs in 2024**, about **132 million (≈80.5%) actively connected**, and the regional tracker Dataxis projects the installed base reaches **~193 million by 2026 (≈83.5% connected)**, with ~38.9 million sets sold in 2026 alone [1][2]. By 2029 Dataxis expects **~90% of households in the five largest markets** to own a smart TV or streaming device, up from **63% in 2024** [2]. The CTV *audience* is therefore enormous and largely built. The growth lever is no longer the screen; it is the connection behind it and the income in front of it.\n\nFive facts define the substrate, and each is a present-tense status claim with a current source attached:\n\n1. **LATAM reaches the internet by phone but watches video on the TV — and the smart TV, not the phone, reconciles the two.** Mobile connections run **102–155% of population** across the six focus countries (a multi-SIM artifact), and nearly all are 3G/4G/5G \"broadband\" connections [3][4][5][6][7][8]. Yet Comscore finds the overwhelming majority of LATAM CTV viewing happens on a native smart-TV screen, and the connected-TV screen already carries a large and rising share of total viewing time in Brazil, Mexico and Argentina [9][10]. The phone is the *on-ramp*; the TV is the *consumption surface*.\n\n2. **Fixed broadband is the gating constraint, and it is wildly uneven.** Residential fixed-broadband penetration averaged **~54.8% of LATAM households at end-2024**, but ranges from **~46% (Colombia)** through **~61% (Brazil)** up to **~73% (Argentina, Chile)** [11][12]. Where fixed broadband exists it is increasingly fiber: the region had **~87.8 million fiber lines by Q2 2025 — roughly two-thirds of all fixed lines** — and FTTH is **78%+ of residential broadband in Brazil, ~73% in Chile** [11][13]. The household question for CTV is binary: *is there a fixed pipe behind the TV, or is the home streaming over cellular?*\n\n3. **Roku owns the smart-TV platform layer in Mexico to a degree it manages almost nowhere else — but the quarterly figure swings, so treat the *direction* as the durable fact, not any single point.** Pixalate's programmatic-ad-share-of-voice (SOV) series put Roku at **74% of Mexican CTV ad traffic in Q4 2024**, **73% in Q1 2025**, then **58% (Q3 2025)**, **29% (Q4 2025)**, and back to **55% (Q1 2026)** — a wide quarterly swing that reflects measurement of *ad traffic*, not installed base [14][15][16][17]. Across all five readings Roku is #1 in Mexico, typically by a multiple over Samsung and LG. Regionally Roku led LATAM at **42% SOV in Q1 2026** (LG 15%, Aiwa 11%, Samsung 9%) [16].\n\n4. **Viewing is overwhelmingly ad-supported, and free-to-air is not dying — it is being re-platformed.** LATAM FAST households are forecast to **more than double from ~26 million (2024) to ~52 million (2029)** (Omdia, Oct 2025) [18]; AVOD revenue is projected to roughly triple this decade [19][18]. Linear persists, and it is being modernised. Brazil's next-generation broadcast standard — formally adopted by presidential decree on **27 August 2025** and now branded **DTV+ (\"TV 3.0\")** — has receivers on retail sale **as of June 2026** ahead of the FIFA World Cup, *expanding* free-to-air rather than retiring it [20][21][22].\n\n5. **Affordability — not coverage — is the binding cap.** 4G covers roughly **85%+ of the LATAM population**, yet a large mobile-internet *usage* gap persists (people inside coverage who don't use it), driven by handset and data affordability; the market remains **predominantly prepaid** [23][24][25]. The mobile industry generated ~$600bn for the LATAM economy in 2025 (8.6% of GDP), and 5G is forecast to reach **~53% of connections (400M+) by 2030** — a 2030 story, not a 2026 one [23][26].\n\n**The strategic read:** LATAM's CTV opportunity is **device-rich and bandwidth-/budget-constrained**. The screens and the audience exist at scale; the limiting reagents are (a) a *fixed* pipe behind the TV, which gates reliable high-bitrate co-viewed streaming, and (b) household income, which pushes viewing onto ad-supported tiers. For an advertiser, reach concentrates on **AVOD/FAST on the smart-TV screen — not SVOD, not mobile**. And two platform stories tower over the rest: **Mexico's Roku-dominated platform layer** and **Brazil's scale plus expanding free-to-air (DTV+)**.\n\n> **Read every number with this caveat.** \"Penetration\" is reported on at least three different denominators across sources — *% of households*, *% of population*, and *% of internet users* — and device-share figures from Pixalate measure **programmatic ad share-of-voice, not unit sales or active-device counts**. Each table flags its basis. Figures resting on a single commercial source (notably Dataxis and Pixalate, both paywalled at full depth) are noted as such. The same **YouTube-on-TV definitional caveat** applies throughout: whether YouTube viewed on the TV screen \"counts\" as CTV swings the size of the addressable market by a wide margin, and it is flagged where relevant rather than silently resolved.\n\n---\n\n## 1. CONNECTIVITY — Fixed Broadband, Fiber, and Mobile\n\n### 1.1 The regional picture: mobile-first by connections, fiber-led where fixed exists\n\nTwo structural facts frame everything downstream.\n\n**Mobile is the default on-ramp.** GSMA's *Mobile Economy Latin America* series reports roughly **70% unique mobile-subscriber penetration**, 4G covering **~85%+ of the population**, smartphones the large majority of connections, and 5G forecast to reach **~53% of connections (over 400 million) by 2030** [23][26]. More than 30 operators across 13 countries had launched commercial 5G by the 2025–2026 reporting window [23]. The mobile sector generated about **$600 billion for the LATAM economy in 2025, ~8.6% of GDP** [23]. The market remains **predominantly prepaid**, with Mexico alone holding roughly a third of the region's prepaid base [25].\n\n**Fixed broadband is the minority connection — but it is going fiber fast.** LATAM/Caribbean had about **133.4 million total fixed-broadband lines by Q2 2025**, of which roughly **87.8 million (~two-thirds) were fiber**; residential fixed-broadband penetration reached **~54.8% of households at end-2024** [11]. The Fiber Broadband Association's **2025 FTTH Panorama for Latin America (released April 2026)** reports the region carried about **227 million fiber connections in 2024**, projects **~281 million by 2029** (nearly **80% of all fixed broadband**), records **$5 billion+ invested in fiber and related M&A in 2025**, and flags that **more than 110 million households remain unserved or underserved by fiber** [13][27]. The fixed-broadband frontier sits around **60–63% of households** — the practical ceiling on \"real\" big-screen CTV reach.\n\nWhy this matters for CTV: a smart TV is only a *Connected* TV if it has bandwidth. A reliable fiber/fixed pipe carries full-screen, high-bitrate, multi-hour, co-viewed streaming — the behaviour advertisers want. A mobile-only home can still cast to a TV via hotspot or a SIM router, but does so under data caps and affordability pressure that bias it toward lower-bitrate, shorter, mobile-screen viewing. **The fixed-broadband line behind the TV is the single best leading indicator of genuine big-screen CTV usage.**\n\n### 1.2 Per-country connectivity table\n\nAll figures are the most recent available. DataReportal \"Digital 2025/2026\" reports use end-2024 / end-2025 data as noted; speeds are Ookla medians as cited by DataReportal. Fixed-broadband **household** penetration is from the FBA FTTH Panorama and BNamericas/SDxCentral/S&P and carries more estimation uncertainty than the mobile figures.\n\n| Country | Internet users (penetration) | Mobile connections (% of pop.) | Median **mobile** DL | Median **fixed** DL | Fixed-BB **household** penetration | FTTH share of fixed BB |\n|---|---|---|---|---|---|---|\n| **Brazil** | **185M (86.9%)**, end-2025 | 217M (**102%**) | **239.4 Mbps** (end-2025) | **206.4 Mbps** (end-2025) | **~61%** (2024) | **78%+** (highest in LATAM) |\n| **Mexico** | **110M (83.5%)**, end-2025 | 145M (**110%**) | **45.2 Mbps** | **90.6 Mbps** | ~mid-50s% (est.) | rising |\n| **Colombia** | 41.1M (**77.3%**) | 78.3M (**147%**) | **20.7 Mbps** | **162.6 Mbps** | **~46%** (2024) | rising (fiber-led) |\n| **Argentina** | 41.2M (**90.1%**) | 64.7M (**141%**) | **35.2 Mbps** | **92.6 Mbps** | **~73%** | growing off cable base |\n| **Chile** | 18.6M (**94.1%**) | 30.7M (**155%**) | **48.6 Mbps** | **280.0 Mbps** (top-5 globally) | **~73%** | **~73%** |\n| **Peru** | 27.3M (**79.5%**) | 39.4M (**115%**) | **22.7 Mbps** | **191.5 Mbps** | lowest of the six (est.) | growing |\n\n**Sources:** DataReportal Digital 2026 Brazil [3]; Digital 2026 Mexico [4]; Digital 2025 Colombia [5]; Digital 2025 Argentina [6]; Digital 2025 Chile [7]; Digital 2025 Peru [8]; fixed/FTTH from FBA FTTH Panorama [13][27], SDxCentral [11], BNamericas [12]. Brazil's end-2025 internet-user and speed figures updated from the **Digital 2026** edition [3].\n\n**Reading the table:**\n\n- **Mobile connections exceed 100% of population everywhere** — a multi-SIM and prepaid-churn artifact, not 1.4 phones per person. Colombia's 147% and Chile's 155% reflect dual-SIM and heavy prepaid churn; **do not** read these as internet-user penetration (the lower \"internet users\" column).\n- **Brazil's mobile median download speed jumped to ~239 Mbps by end-2025** in the Digital 2026 data — now exceeding its own fixed median (~206 Mbps), an unusual inversion that reflects aggressive 5G rollout and signals Brazil's mobile network is, uniquely in the region, becoming a credible big-screen-CTV bearer in addition to fiber [3].\n- **Fixed download speeds are genuinely strong where fixed exists** — Chile (~280 Mbps) and Brazil (~206 Mbps) rival developed markets, a direct result of FTTH overbuild. The *quality* ceiling for CTV is not a problem in connected homes; the *reach* of fixed connections is.\n- **Mobile speeds are mediocre-to-modest** outside Brazil (Colombia 20.7, Peru 22.7, Argentina 35.2, Mexico 45.2, Chile 48.6 Mbps). For mobile-dependent homes, sustained 1080p/4K big-screen streaming is marginal — reinforcing that **big-screen CTV concentrates in fixed-broadband homes** everywhere except, increasingly, Brazil.\n\n### 1.3 How mobile-first is each market — and what it means for CTV\n\nA useful proxy for \"mobile-first\" is the **gap between mobile and fixed penetration** plus the **share of web access via mobile**. In Brazil the overwhelming majority of internet users reach the web via mobile [3]. The pattern across the six:\n\n- **Most mobile-first (fixed broadband thinnest): Colombia and Peru.** Colombia's ~46% fixed-broadband household penetration and Peru's low fixed base, combined with 147% / 115% mobile penetration and weak mobile speeds, make these the markets where CTV most depends on either (a) the minority of fixed-broadband homes, or (b) streaming-device + hotspot workarounds. **CTV reach is shallower and more concentrated in urban/upper-income homes here.**\n- **Most balanced (strong fixed *and* mobile): Chile and Argentina.** ~73% fixed-broadband penetration plus high fiber share means the big-screen CTV substrate is real and broad. Chile is the region's connectivity-quality leader.\n- **Scale leader with fixed depth *and* a fast-improving mobile bearer: Brazil.** ~61% fixed-broadband penetration on a base of ~74M households is the largest absolute pool of fixed-broadband + smart-TV homes in the region — the reason Brazil is the #1 CTV market by audience even though its penetration *rate* trails Argentina/Chile. The end-2025 mobile-speed surge adds a second viable bearer.\n- **Mexico:** strong absolute scale; mobile speeds middling, fixed penetration mid-50s%; Mexico's distinctive feature is at the **platform/OS layer** (Roku), not the pipe layer (see §3).\n\n**CTV implication:** the \"mobile-first\" label holds for *internet access* but misleads on *video consumption*. Because the large majority of CTV viewing happens on a smart TV and the TV screen carries a rising share of total viewing time in the big three [9], the strategic question is not \"mobile vs. TV\" but \"**which homes can sustain big-screen streaming**\" — and the answer tracks fixed-broadband penetration almost exactly, with Brazil's 5G now a partial second answer.\n\n### 1.4 5G status per country (a 2030 story, not a 2026 one)\n\n5G is launching across the region, but it is not yet a material CTV enabler. Fixed-wireless-access (FWA) 5G could eventually substitute for missing fiber in mobile-first homes, but penetration is early:\n\n- **Argentina:** Claro launched 5G in 2025 (Buenos Aires, Córdoba, Rosario), the third operator after Telecom Personal (2021; 5G SA Dec 2023) and Movistar (2024) [28].\n- **Peru:** Bitel (Viettel) launched 5G in Lima in **January 2025**, the fourth operator after Claro and Entel (2021) and Movistar (2022) [28].\n- **Brazil, Mexico, Colombia, Chile:** all have commercial 5G; Brazil and Chile are the most advanced. Regionally GSMA forecasts 5G at roughly **half of connections (400M+) by 2030** [23][26].\n\n**CTV implication:** through the forecast horizon (~2028–2030), **fiber FWA and FTTH — not 5G mobile — remain the realistic path to expanding reliable big-screen CTV** into under-served homes for most of the region. The exception is Brazil, where the end-2025 mobile-speed inversion suggests 5G/FWA may become a meaningful big-screen bearer earlier than elsewhere.\n\n---\n\n## 2. DEVICES — Smart-TV Installed Base and Connected Devices\n\n### 2.1 The regional installed base and trajectory\n\nThe anchor dataset is Dataxis's LATAM connected-TV mapping. **All Dataxis figures rest on this single tracker** — Dataxis is the leading regional source, but paywalled at full depth; trade press cites the figures widely, and Comscore, Omdia/Ampere and Amagi corroborate them directionally.\n\n| Metric | Value | Year | Source |\n|---|---|---|---|\n| Installed smart TVs, LATAM | **~163 million** | 2024 | Dataxis [2] |\n| — of which **actively connected** | **~80.5% (~132M)** | 2024 | Dataxis [2] |\n| Installed smart TVs, LATAM | **~193 million** | 2026 (proj.) | Dataxis [1] |\n| — of which **actively connected** | **~83.5%** | 2026 (proj.) | Dataxis [1] |\n| Smart TVs **sold** | **~38.9 million units** | 2026 (proj.) | Dataxis [1] |\n| Standalone **streaming devices** accumulated | **~15 million** | 2024 | Dataxis [2] |\n| Households w/ smart TV **or** streaming device (top-5 markets) | **63%** | 2024 | Dataxis [2] |\n| Households w/ smart TV or streaming device (proj.) | **~90%** | 2029 (proj.) | Dataxis [2] |\n| CTV ad revenue, LATAM (Dataxis context figure) | **~$450M** | 2026 (proj.) | Dataxis [1] |\n\n**Concentration:** the five largest markets — **Argentina, Brazil, Chile, Colombia, Mexico** — account for about **79% of connected TV sets** in the region [2]. Peru and the smaller Andean/Central American markets share the remaining ~21%.\n\n### 2.2 Per-country device penetration\n\nThere are **no clean, harmonized per-country smart-TV-household-penetration percentages in public sources** — Dataxis's per-country splits are paywalled. The best available country signals (older, mixed denominators — read with care):\n\n| Country | Signal | Value | Source |\n|---|---|---|---|\n| **Brazil** | TV-household penetration (any TV) | **~96%+** of households own a TV | Statista [29] |\n| **Brazil** | Households w/ a TV that have streaming (SVOD) | **43.4%** (31.1M homes), 2022 | IBGE [30] |\n| **Brazil** | CTV viewers among internet population | **~50%** (highest in LATAM) | Comscore [9] |\n| **Mexico** | CTV viewers among internet population | **~47%** | Comscore [9] |\n| **Mexico** | Digital (vs. analog) TV households | **~79%** (2023) | Statista [31] |\n| **Argentina** | CTV viewers among internet population | **~44%** | Comscore [9] |\n\n> **Caution on the widely-repeated \"97% of households have CTVs\" practitioner claim:** it conflicts with Dataxis's 63% (2024) device-ownership figure for the top-5 markets. The most likely reconciliation is denominator drift — the 97% appears to describe **CTV penetration among *connected/internet* households**, not all households, whereas Dataxis's 63% is **all households**. Treat **63% of all households (2024) → ~90% (2029)** as the conservative, more defensible base, and the 97% figure as an internet-household subset. (A newer Comscore \"Connected TV en América Latina 2025\" report exists [32] but its detailed splits are behind Comscore's gate; the 2025-vintage Comscore figures above are from the public blog and are flagged as such.)\n\n### 2.3 Connected devices: smart TVs vs. sticks/boxes vs. pay-TV STBs\n\nComscore's device-mix data for how LATAM CTV viewers actually reach content (respondents could use more than one device); these are 2024-vintage public figures and should be read as directional:\n\n| Device class | Share of LATAM CTV viewers using it | Source |\n|---|---|---|\n| **Smart TV (native OS)** | **~94%** | Comscore [9] |\n| **Pay-TV set-top box** | **~28%** | Comscore [9] |\n| **Streaming stick/box** (Roku, Fire TV, Chromecast, Mi Box, Apple TV) | **~21%** | Comscore [9] |\n| **Game console** | **~17%** | Comscore [9] |\n\n**Key structural takeaway:** unlike the US — where streaming sticks/boxes (Roku, Fire TV) were the *primary* CTV on-ramp for years — **LATAM is a native-smart-TV-OS market first.** The smart TV's built-in OS (Tizen, webOS, Android/Google TV, Roku TV, Vidaa) is how the large majority of viewers connect; standalone sticks/boxes form a secondary ~21% layer (~15M accumulated devices). That makes the **TV OS the dominant addressable surface** (see §3), and it means the OEM's choice of which OS ships in the set largely *predetermines* the platform layer available to advertisers.\n\n### 2.4 Which OEMs sell the most TVs in LATAM\n\n| OEM tier | Estimated LATAM smart-TV installed-base share | Notes | Source |\n|---|---|---|---|\n| **Samsung + LG (Korean majors)** | **~51% combined** | The dominant premium/mid base; Samsung=Tizen, LG=webOS | Dataxis [1] |\n| **Chinese second-tier (TCL, Hisense, TPV/Philips-AOC)** | **~21%** | Fast-growing value tier; ship Android/Google TV, Vidaa, or Roku TV | Dataxis [1] |\n| **50+ smaller/local brands** | remainder (~28%) | Often Android-based or Roku-licensed; entry-level price points | Dataxis [1] |\n\nGlobally for context (Q4 2024 unit share): Samsung ~16%, TCL ~14%, Hisense ~12%, LG ~10% (Counterpoint) [33]; and **LG shipments to Latin America rose ~29% YoY** through late 2025, the strongest regional growth in its book [34]. The strategic tension sits one tier down: the **Chinese value tier (TCL/Hisense) is the swing factor for OS share**, because those OEMs ship whichever OS wins them shelf space — and in Mexico that has overwhelmingly been **Roku TV** (§3).\n\n---\n\n## 3. TV OS / PLATFORM SHARE\n\n### 3.1 Regional OS share of the connected smart-TV base\n\nDataxis's installed-base view (the most authoritative regional cut, resting on that single tracker):\n\n| OS / platform | Regional position | Notes |\n|---|---|---|\n| **Tizen (Samsung) + Android/Google TV + webOS (LG)** | **~72.4% combined** | The three lead the installed base |\n| **Samsung Tizen + LG webOS** | **~51% combined** | Korean-major share of *connected* smart TVs |\n| **Android TV / Google TV** | 2nd-largest single option | Ships on TCL, Sony, Philips, many local brands + Mi Box/Mi TV |\n| **Roku OS** | strong via OEM alliances | #1 in **Mexico**; ad platform now live in **Brazil** (Oct 2025) |\n| **Vidaa (Hisense), VIZIO, Aiwa, others** | remainder | Vidaa rides Hisense's value-tier growth; Aiwa surfaces in some ad-SOV cuts |\n\nSource: Dataxis [1][2].\n\n> **Two different \"share\" lenses — do not conflate them.** Dataxis measures **installed-base / connected-device share** (what OS is in the home). Pixalate measures **programmatic ad share-of-voice** (which device sees the most open-programmatic ads). A platform can be modest in installed base yet huge in ad traffic if its users stream more ad-supported inventory. Roku's Mexico dominance shows up most starkly in the **ad-traffic** lens — and that lens is *quarterly-volatile* (see §3.2).\n\n### 3.2 Roku's #1 position — Mexico quantified, with the volatility flagged\n\nThis is the single most important platform fact in the region — and the right way to read it is as a *trend*, not a single quarter, because the Pixalate SOV series swings widely. Pixalate's CTV device market-share reports measure **share of open-programmatic ad volume**, billions of CTV ad transactions per report:\n\n| Quarter | Roku — Mexico SOV | Roku — LATAM region SOV | Notable runners-up | Source |\n|---|---|---|---|---|\n| **Q4 2024** | **74%** | — | Samsung 13%, LG 3%, Amazon 3% (MX) | Pixalate [14] |\n| **Q1 2025** | **73%** | — | (Roku also #1 US 38%, UK 25%) | Pixalate [15] |\n| **Q2 2025** | — | **45%** | (Roku #1 N. America 37%) | Pixalate [35] |\n| **Q3 2025** | **58%** | **44%** | (Roku #1 N. America 36%) | Pixalate [36] |\n| **Q4 2025** | **29%** | — | — | Pixalate [37] |\n| **Q1 2026** | **55%** (+87% QoQ) | **42%** | LG 15%, Aiwa 11%, Samsung 9% (LATAM) | Pixalate [16] |\n\n*(The share figures rest on a single source; the methodology is programmatic ad share-of-voice, not unit sales or installed base.)*\n\n**How to read this:** across six consecutive quarterly reports, **Roku is consistently #1 in Mexico and #1 in LATAM by programmatic ad SOV**. But the *level* swings from a high of 74% to a low of 29% — a range too wide to pin on real installed-base change over a few months. The swing reflects how SOV is computed (the mix of inventory flowing through open programmatic exchanges in a given quarter), seasonality, and methodology shifts — not Roku gaining and losing tens of millions of devices. **The durable, defensible claim is \"Roku is the dominant programmatic-CTV ad surface in Mexico and the regional SOV leader,\" not any single percentage.** A flat \"74%\" would overstate the stability of the figure; the honest reading is a trend with a flagged range.\n\nCorroborating current facts (each a present-tense status claim with a current source):\n\n- **Roku's platform crossed 100M+ streaming households globally (Apr 2026)** and the platform/ad business reached profitability with $1.22bn platform revenue in Q4, per Roku's FY2025/Q4 8-K and trade coverage — confirming the platform is live and scaling, not winding down [38][39].\n- **Mexico is one of Roku's strongest markets globally** — its programmatic ad SOV is typically at or above Roku's home-US share — built through retail distribution of low-cost Roku-OS TVs and Roku-licensed OEM partnerships.\n\n**Why Mexico specifically:** Roku entered early with aggressive retail pricing on Roku-OS TVs (via OEM licensees) and streaming sticks, taking the value tier before Tizen, webOS or Android could lock it. The result is a market where the **dominant addressable CTV surface is a single, US-headquartered, ad-tech-native OS** — a materially different structure from Brazil's fragmented Samsung/LG/Android mix, and a far more accessible one for programmatic advertisers.\n\n### 3.3 Roku's Brazil entry (the 2025 inflection — confirmed live in 2026)\n\nOn **15 October 2025**, Roku launched its **CTV advertising platform in Brazil**, with **25+ authorized media-buying partners** (including Mercado Ads and SBT) and **30 FAST channels** added to its Live TV Guide earlier in 2025; advertisers can buy in-stream ads and the Marquee home-screen unit directly or via partners, with Roku's proprietary IDs attached [40][41][42]. Roku's stated rationale: **Brazil is on track to become the world's third-largest FAST market by 2029** (Omdia). As of mid-2026, current trade coverage and Roku's own filings describe the platform as **active and expanding** [38][40]. The move extends Roku's device-plus-ad-platform footprint from its Mexican stronghold into the region's largest CTV audience — but here it competes against entrenched Samsung/LG/Android share rather than dominating as in Mexico.\n\n### 3.4 Platform status as of mid-2026\n\nEach of the following is a present-tense status claim; the source confirms it is live as of the dates shown.\n\n- **Roku ad platform — Mexico:** live and #1 by programmatic SOV across Q4 2024–Q1 2026 [14][16]. *Live.*\n- **Roku ad platform — Brazil:** launched 15 Oct 2025; active mid-2026 [40][38]. *Live.*\n- **Samsung Tizen / LG webOS / Google TV / Vidaa as shipping smart-TV OSes in LATAM:** all currently shipping on 2025–2026 sets per Counterpoint/Dataxis OEM data [1][33]. *Live.*\n- **Dataxis CTV mapping for LATAM:** current research product, most recent public highlight projects the 2026 base [1]. *Live.*\n- **Pixalate CTV device market-share reports:** current; Q1 2026 published [16]. *Live.*\n\n---\n\n## 4. VIEWING BEHAVIOR — Streaming vs. Linear, Ad-Supported vs. SVOD\n\n### 4.1 Streaming has already overtaken the transition narrative\n\nLATAM is **past** the pay-TV→streaming inflection, on Ampere/Omdia's read: total OTT revenues rise from **~$11bn (2023) to ~$19bn (2030), overtaking pay-TV** as the region's dominant video-revenue pool [19][43]. The connected-TV screen carries a large and rising share of total viewing time in Brazil, Mexico, and Argentina [9]. Omdia's October 2025 work has the wider LATAM media market growing **~9.4% in 2025 — roughly three times the US rate** — with FAST, mobile video and microdramas cited as drivers [19][44].\n\n### 4.2 Ad-supported is the default monetization model\n\n| Metric | Value | Source |\n|---|---|---|\n| LATAM **FAST households** | **~26M (2024) → ~52M (2029)** | Omdia/Ampere, Oct 2025 [18] |\n| LATAM **AVOD revenue** | **~$2.1bn (2024) → ~$5.4bn (2029)**; ~tripling 2023→2030 | Omdia/Ampere [18][19] |\n| LATAM **FAST ad revenue** | expanding **~2.3× by 2030**, outpacing N. America & Europe in % growth | Omdia/Ampere [18] |\n| Ad-tier share of total OTT subs, 2025 | **~11.7%** | Dataxis [1] |\n| Connected-screen share of total AVOD revenue | **~17.6% (2025) → ~25% (2030)** | Dataxis [1] |\n| FAST CTV-penetration growth, Brazil / Mexico (Q1'22→Q1'23) | **94% / 93%** (both outpacing US ~80.6%) | Amagi [45] |\n\n**Ad-tier prevalence (Dataxis):** Brazil — ~55% of smart TVs / ~51% of OTT accounts on ad tiers; Mexico — ~55% of smart TVs / ~39% of OTT accounts [1].\n\n**Interpretation:** affordability makes free/ad-supported the natural equilibrium. SVOD and AVOD overlap heavily — households stack both — but the *growth* and the *advertiser-relevant inventory* sit in AVOD/FAST. That is the core reason LATAM is \"supply-rich\" for CTV advertising even at modest ad-dollar levels. The doubling of FAST households to ~52M by 2029 [18] is the single cleanest behaviour-side number in these pages, and it aligns directionally with Dataxis's device-side \"~90% of top-5 households connected by 2029.\"\n\n### 4.3 Co-viewing, content, and the YouTube-on-TV definitional fork\n\n- **Co-viewing** is structurally high in LATAM (large households, shared sets, family viewing) — a multiplier on CTV reach-per-impression, though precise regional co-viewing ratios are not consistently published. Comscore has noted the average LATAM CTV viewer subscribes to roughly **8 streaming services** [46].\n- **YouTube-on-the-TV-screen is enormous and is the single biggest definitional fork in \"what counts as CTV.\"** YouTube's reach across LATAM internet users is very high (roughly 74–90% depending on country), and YouTube CTV viewing has grown double-digits year-on-year [47]. **Whether YouTube-on-TV is counted as CTV swings the size of the addressable inventory pool materially** — by a factor of roughly 2–3× in some practitioner estimates — and the right move is to *flag* the fork rather than resolve it. Any size or share figure here should state whether it is YouTube-inclusive or YouTube-exclusive.\n- **Local-content demand** runs around a third of regional viewers wanting more locally-produced content, rising toward ~40% in Brazil and Mexico [9].\n\n### 4.4 Free-to-air persistence and the DTV+ (\"TV 3.0\") re-platforming\n\nLATAM is unusual among streaming-mature regions: **free-to-air broadcast remains structurally large, and the region is expanding and modernising it**, not retiring it. This is one of the fastest-moving stories in the region:\n\n- **Brazil's next-generation broadcast standard is now official and shipping.** President Lula signed a presidential decree on **27 August 2025** adopting the **DTV+ (\"TV 3.0\")** standard, which layers ATSC 3.0 transport with VVC video, MPEG-H immersive audio and MPEG-5 LCEVC enhancement [20][21]. Pilot/experimental broadcasts are on air in Rio de Janeiro and São Paulo; **commercial deployment began in 2026, and the first DTV+ receivers went on retail sale around 8 June 2026** ahead of the **FIFA World Cup 2026**, with Intelbras and Aquario among the first manufacturers [22][20]. This expands free-to-air, IP-capable, potentially addressable broadcast — it does not sunset it. *(DTV+ is live and in early commercial rollout as of June 2026 [22].)*\n- **Free-to-air still reaches the large majority of Brazilian TV households** (IBGE's most recent published figure put open-TV access in the low-90s percent of TV households), and Brazil has been releasing additional free digital channels [30].\n- **Pay-TV is in slow structural decline.** Brazil fell from ~33.9% of homes (2016) toward the mid-20s percent by 2023; regionally pay-TV penetration continues a slow decline even as subscriber counts still edge up in some markets where household growth outpaces cord-cutting [48][49].\n\n### 4.5 Per-country pay-TV snapshot\n\n| Country | Pay-TV signal | Dominant tech | Source |\n|---|---|---|---|\n| **Mexico** | Largest LATAM pay-TV base (~18–20M subs) | Satellite-led | Statista [50]; 3Vision [43] |\n| **Brazil** | 2nd-largest, declining (~25% of homes 2023) | Satellite-led | Statista [50]; SatNews [48] |\n| **Argentina** | High legacy penetration (historically among the world's highest cable rates) | Cable-led | MarketDataForecast [51]; Statista [50] |\n| **Colombia** | Subs rising, penetration flat/declining | Cable-led | eMarketer [49] |\n| **Chile** | Subs rising, penetration declining | Cable-led | eMarketer [49] |\n| **Peru** | Smaller base | Cable-led | MarketDataForecast [51] |\n\nRegional pay-TV value is roughly flat-to-slow-growth in dollars while penetration *rate* erodes; cable held about 48% of LATAM pay-TV in 2024, with Argentina/Peru/Chile skewing cable and Brazil/Mexico skewing satellite [51].\n\n**CTV implication:** the ~28% of CTV viewers who reach content via a pay-TV STB [9] are a meaningful but shrinking on-ramp. The durable surfaces are the native smart-TV OS and — in Brazil — an expanding free-to-air/DTV+ broadcast layer that may itself become addressable.\n\n---\n\n## 5. INFRASTRUCTURE CONSTRAINTS — Affordability, Prepaid, the Divide\n\nThe hard cap on LATAM CTV is not coverage — it is **money and the prepaid reality**.\n\n### 5.1 Coverage exists; usage lags (the usage gap)\n\n- **4G covers ~85%+ of the LATAM population**, up sharply since 2018, and mobile data prices have fallen materially over recent years [23][24].\n- Yet a substantial **mobile-internet usage gap** persists — people who live inside mobile-broadband coverage but do not use it — driven by **affordability (especially of handsets), digital literacy, and awareness** [24]. Only roughly **70% of the population are unique mobile subscribers** [23].\n\n### 5.2 The prepaid reality\n\nLATAM is **predominantly a prepaid mobile market** — Mexico alone holds roughly a third of the region's prepaid subscriptions [25]. Prepaid means:\n\n- **Data is bought in small, top-up increments** under tight budget control — the antithesis of the \"always-on, unmetered\" assumption behind high-bitrate big-screen streaming.\n- For many households **mobile internet must stay under ~2% of monthly income**, a threshold GSMA notes **fixed broadband frequently cannot meet** — which is precisely why so many homes are mobile-only and why fixed-broadband penetration stalls around the 50–63% \"frontier\" [25].\n- The prepaid/data-cost reality is the strongest single explanation for why **ad-supported (free) tiers dominate** (§4) and why **big-screen CTV concentrates in fixed-broadband, higher-income urban homes**.\n\n### 5.3 Urban/rural divide\n\n- Across lower- and middle-income countries, **rural adults are markedly less likely to use mobile internet than urban adults** [24].\n- The divide is *narrowing* on some metrics (in Brazil the urban–rural gap in TV/pay-TV access has shrunk over the IBGE survey series [30]), but **fixed-fiber deployment remains heavily urban** — the FTTH overbuild that gives Chile/Brazil their high speeds is concentrated in cities, leaving rural homes mobile-dependent and outside the high-quality CTV base.\n\n### 5.4 Electrification and the TV-ownership base\n\nThe most basic enabler — electricity and a TV set — is largely (not entirely) solved. TV ownership is near-universal across the urban majority of the six countries [29]. Electrification gaps remain at the rural margin (e.g., **Peru's National Plan for Rural Electrification 2024–2033 targets 96% coverage by 2026** [52]), implying a residual unelectrified rural population today. Those recently-electrified rural homes are the *last* to get smart TVs and fixed broadband, and they effectively sit outside the near-term CTV addressable base.\n\n### 5.5 How constraints cap CTV per country (synthesis)\n\n| Country | Binding constraint | CTV-growth implication |\n|---|---|---|\n| **Brazil** | Income/prepaid + rural fiber gap, but huge fixed-BB urban base **and** newly fast mobile | Largest absolute CTV pool; AVOD/FAST-led; DTV+ expands free-to-air; upside via fiber, 5G, and Roku's 2025 entry |\n| **Mexico** | Mid mobile speeds, mid fixed penetration; affordability | Roku-dominated platform layer makes the addressable surface unusually clean; scale + ad-tier prevalence strong |\n| **Colombia** | **Low fixed-broadband (~46%)**, weak mobile speed (~20.7 Mbps), high prepaid | Most mobile-first; big-screen CTV shallow, concentrated in urban/upper-income; reach-limited |\n| **Argentina** | FX/macro volatility; but high fixed-BB (~73%) + high legacy cable | Strong substrate; constraint is dollars/macro, not pipes; high co-viewing |\n| **Chile** | Few infra constraints — best connectivity (~280 Mbps fixed, ~73% FTTH) | Highest-quality CTV substrate; small absolute market; affordability least binding |\n| **Peru** | Lowest fixed base, rural electrification gap, weak mobile speed (~22.7 Mbps) | Smallest/most-constrained of the six; CTV reach thin outside Lima/urban coast |\n\n---\n\n## IMPLICATIONS (for the CTV thesis)\n\n1. **The audience and screens are built; bandwidth and income gate the rest.** With ~193M smart TVs heading toward ~90% top-5 household device penetration by 2029, LATAM has largely *solved* the CTV reach problem at the device layer [1][2]. The remaining growth lever is **fixed/fiber broadband behind the TV** plus **affordability** — both of which favour AVOD/FAST over SVOD and big-screen over mobile.\n\n2. **Fixed-broadband penetration is the truest CTV reach indicator — and it splits the six.** Chile/Argentina (~73%) and Brazil (~61%, but largest absolute base) are deep, sustainable big-screen markets; Colombia (~46%) and Peru (lowest) are mobile-first and reach-limited; Mexico is mid on pipes but distinctive on platform [11][13].\n\n3. **Mexico's Roku dominance is a strategic gift to programmatic buyers — but quote it as a trend, not a fixed percentage.** A single ad-tech-native OS leading Mexican programmatic SOV across six straight quarters [14][16] gives Mexico the cleanest, most-addressable CTV surface in the region; Brazil's 2025 Roku entry is the move to replicate that, though against entrenched Samsung/LG/Android share Roku is one of several surfaces there, not the surface.\n\n4. **Plan for AVOD/FAST first.** FAST households roughly doubling to ~52M by 2029, AVOD revenue ~tripling this decade, and ad tiers on ~55% of smart TVs in Brazil/Mexico make ad-supported inventory the structural core of LATAM CTV [18][1]. The prepaid/affordability reality (§5) is not a temporary friction. It is the permanent shape of the market.\n\n5. **Do not write off free-to-air — re-platform it.** Brazil's DTV+ (\"TV 3.0\"), official by decree (Aug 2025) and shipping to retail (Jun 2026), means broadcast is *expanding* and turning IP-capable. The long-term prize is a free-to-air layer that becomes addressable — potentially the largest single CTV-style inventory pool in the region [20][22].\n\n6. **Definitional discipline carries into measurement.** \"CTV penetration\" varies by denominator (households vs. internet users vs. connected homes), the dominant \"device share\" numbers (Pixalate) measure *ad traffic* and are quarterly-volatile, and whether **YouTube-on-TV** counts as CTV swings the addressable market by 2–3× — the same fork that recurs throughout this account.\n\n---\n\n## OPEN QUESTIONS\n\n1. **Why does Pixalate's Mexico Roku SOV swing from 74% to 29% to 55% in five quarters?** Is this seasonality in open-programmatic inventory, a methodology change, a shift in which SSPs route Mexican Roku traffic through open exchanges, or partial real share movement? Resolving this would allow a defensible point estimate instead of a range.\n2. **What is the YouTube-inclusive vs. YouTube-exclusive CTV reach and inventory split per country?** The 2–3× swing is the single largest unresolved sizing question and needs a clean, consistently-defined source.\n3. **What are the actual per-country smart-TV-household penetration percentages?** Dataxis holds them behind a paywall, leaving only mixed-denominator proxies in public. A primary regulator dataset (Anatel/IFT/Subtel device surveys) would beat the commercial trackers.\n4. **How fast will Brazil's end-2025 mobile-speed inversion (mobile DL > fixed DL) translate into real 5G/FWA big-screen CTV?** If it does, Brazil's reach ceiling rises faster than the fixed-broadband frontier implies.\n5. **Will DTV+ (\"TV 3.0\") deliver an addressable/IP free-to-air layer, and on what timeline?** The standard is shipping, but the addressable-advertising capability and household device-replacement curve are unproven and could take most of the decade.\n6. **What is the true mobile-internet usage gap and prepaid share by country today (2025–2026 GSMA Mobile Economy LATAM 2026 detail)?** The regional figures are clear; the per-country 2026 splits would sharpen the affordability map.\n\n---\n\n## SOURCES\n\n**Connectivity — regulators / measurement / digital reports**\n1. [Dataxis — Heading toward 193 million smart TVs (2026 base; ~$450M CTV ad rev)](https://dataxis.com/researches-highlights/1635297/heading-toward-193-million-smart-tvs-mapping-connected-tv-in-latin-america/) — Tier 5, regional tracker (paywalled at depth). Accessed 2026-06-17.\n2. [Dataxis — Connected TV dominates LATAM: 9 of 10 homes will have streaming by 2029](https://dataxis.com/researches-highlights/1633519/connected-tv-dominates-latin-america-9-out-of-10-homes-will-have-streaming-by-2029/) — Tier 5. Accessed 2026-06-17.\n3. [DataReportal — Digital 2026: Brazil](https://datareportal.com/reports/digital-2026-brazil) — Tier 4/5 (We Are Social + Meltwater + Ookla). end-2025 data. Accessed 2026-06-17.\n4. [DataReportal — Digital 2026: Mexico](https://datareportal.com/reports/digital-2026-mexico) — Tier 4/5. end-2025 data. Accessed 2026-06-17.\n5. [DataReportal — Digital 2025: Colombia](https://datareportal.com/reports/digital-2025-colombia) — Tier 4/5. Accessed 2026-06-17.\n6. [DataReportal — Digital 2025: Argentina](https://datareportal.com/reports/digital-2025-argentina) — Tier 4/5. Accessed 2026-06-17.\n7. [DataReportal — Digital 2025: Chile](https://datareportal.com/reports/digital-2025-chile) — Tier 4/5. Accessed 2026-06-17.\n8. [DataReportal — Digital 2025: Peru](https://datareportal.com/reports/digital-2025-peru) — Tier 4/5. Accessed 2026-06-17.\n9. [Comscore — Brazil, Mexico, Argentina lead CTV adoption (blog)](https://www.comscore.com/Insights/Blog/Brasil-Mexico-y-Argentina-lideran-en-la-adopcion-de-Connected-TV) — Tier 5, measurement firm (public blog; 2023–2024 vintage). Accessed 2026-06-17.\n10. [Broadpeak — LATAM Trends 2025: 5 key takeaways](https://broadpeak.tv/blog/latin-america-trends-2025-5-key-takeaways-latam/) — Tier 5/6, vendor blog citing Comscore. Accessed 2026-06-17.\n11. [SDxCentral — Fiber surge meets fragmentation: LATAM fixed network landscape](https://www.sdxcentral.com/analysis/fiber-surge-meets-fragmentation-the-latin-american-fixed-network-landscape/) — Tier 5. Accessed 2026-06-17.\n12. [BNamericas — State o
