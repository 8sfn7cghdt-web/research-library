<script id="corpus-data" type="application/json">{"slug": "latam-ctv-research", "title": "Reach Ahead of Revenue", "subtitle": "Latin America's programmatic Connected-TV market — Brazil, Mexico, and the gap between attention and money", "author": "", "generated": "2026-06-17", "documents": [{"order": 0, "file": "00_Six_Easy_Pieces.md", "title": "Six Easy Pieces of Latin American Streaming-TV Advertising", "summary": "Latin America built the connected living room before it built the ad market to fill it: roughly 163 million smart TVs are already in homes and ad-supported viewing is the norm, yet regional streaming-TV ad spend is still counted in the hundreds of millions of dollars — with Brazil and Mexico holding about 80% of it — because the audience is reachable a dozen ways with no shared way to recognize the same viewer across them.", "body": "# Six Easy Pieces of Latin American Streaming-TV Advertising\n\n*How a region put a screen in nearly every living room years before the money arrived to fill it with ads.*\n\n## The screens came first, the money is still catching up\n\nStart with one lopsided fact. Latin America has already put a connected television in the living room — roughly 163 million smart TVs were in homes by 2024, heading toward about 193 million by 2026 — and almost everyone who streams there watches with ads. Ad-supported viewing is the default, not the exception. And yet the money advertisers actually spend to reach those screens is still small: somewhere between about 300 million and 1 billion US dollars across the six biggest countries in 2025. In a region whose total advertising market runs past 40 billion dollars a year, streaming TV pulls roughly a fifth of people's viewing *time* but well under a tenth of the ad *money*.\n\nThat gap — enormous attention, modest revenue — is the whole story. The audience is built. The question the rest of these pieces answer is why the dollars have lagged, and how fast they are likely to catch up.\n\n## Why a gap between eyeballs and dollars is worth billions\n\nA gap like this is exactly what a market gets excited about, because gaps close. Every hour a family in São Paulo or Mexico City spends watching a free, ad-supported streaming channel is an hour a brand could be buying — and mostly isn't yet, or is buying cheap. When the money finally tracks the attention, the pool of ad spend for these six countries could roughly double, to somewhere around 1 to 2.5 billion dollars by the end of the decade.\n\nWho cares? A lot of people with money on the table. Global streaming services (Netflix, Disney, Amazon) that launched ad-supported tiers here and need them to pay off. The region's giant free-to-air broadcasters — Globo in Brazil, TelevisaUnivision in Mexico — whose television empires are migrating to the internet. The ad-technology firms building the plumbing. And, quietly, the shoppers: much of this is funded by advertising, which is why so much streaming in the region is free to watch in the first place. If the money arrives, more of it stays free. Latin American households, among the most avid streamers on earth, are the prize everyone is chasing.\n\n## The players you need to keep straight\n\nA handful of names and terms carry the rest.\n\n**Connected TV (CTV)** just means watching internet-delivered video on an actual television set — a smart TV, or a plug-in stick like Roku — rather than on a phone or laptop. The living-room screen is what makes it valuable to advertisers.\n\n**Programmatic** means ads bought and sold automatically by software in fractions of a second, instead of by two people signing a paper contract. Almost all internet advertising works this way now.\n\n**FAST and AVOD** are the two flavors of ad-supported streaming. FAST — *free ad-supported streaming television* — is a free channel that plays on a schedule, like old broadcast TV rebuilt on the internet (Pluto TV, Samsung TV Plus). AVOD — *ad-supported video on demand* — lets you pick what to watch, with ad breaks, like the cheaper tier of Netflix. Both trade your attention for free or cheap content.\n\n**YouTube** deserves its own line, because in this region it sits above everything. When Latin Americans got online, they got there through cheap phones, and they met online video through YouTube first. It is by far the largest single source of ad-supported streaming time — and, as we'll see, the biggest argument in the whole business.\n\n**The broadcasters and the retailer.** Globo and TelevisaUnivision are the old free-to-air giants, now streaming. And Mercado Libre — think the region's Amazon-plus-PayPal — runs an advertising arm, Mercado Ads, that has become a surprising force in streaming ads because it knows what people actually bought.\n\n## Follow one ad into a Brazilian living room\n\nNow walk a single ad from a brand's budget to a family's screen, and the region's peculiar problem shows itself.\n\nA brand wants to reach families streaming in Brazil. But there is no one place to buy them. That same household can be reached through a global free channel, through Globo's own streaming app, through a telephone company's pay-TV stream, through the software built into the Samsung TV itself, or through Mercado Libre's video tier. Five doors to the same living room — and here is the catch: **no shared way to recognize that it's the same household behind all five.** In the United States, an email address you signed in with ties your identities together. Latin America runs on a different substrate — mobile-first, roughly 91% Android phones, with weak email signals — so there is no clean spine connecting one viewer across all those apps.\n\nThat single missing piece explains almost everything downstream. Because a buyer can't easily tell a real, valuable viewer from a faked one across this maze, the open, anything-goes auction fills up with junk: in one 2025 quarter, 43% of Brazil's open-auction streaming-TV traffic was *invalid* — bots and spoofed servers, not people — more than double the global norm. So the smart money retreats from the open auction into **private deals**: pre-arranged, curated buys straight from a broadcaster or a trusted platform, where the buyer knows exactly what they're getting. That's why premium streaming inventory in Latin America mostly trades through private handshakes rather than the open exchange.\n\nIt also explains the region's most interesting move. Mercado Ads can do something almost no one else can: because it runs the online store *and* the payment app, it knows whether the ad it showed you actually led you to buy. That closed loop — ad in, purchase out — is gold in a market starved of reliable measurement, and it's turning the region's biggest retailer into one of the fastest-growing sources of streaming-ad demand. Where the measurement works, the money flows.\n\n## The one argument that swings the whole market\n\nHere's a fight that sounds like accounting and is actually worth billions: **does YouTube-on-the-TV count as \"connected TV\"?**\n\nOne camp says obviously yes. Most YouTube watching in Argentina, Brazil, and Mexico now happens on the television screen, not the phone. It's internet video, on a TV, with ads. If that isn't connected TV, nothing is — and counting it puts the market well above a billion dollars.\n\nThe other camp says no. YouTube is user-uploaded clips and its own walled garden, bought through Google's own system, not the premium, professionally-made streaming inventory that the rest of the industry means by \"CTV.\" Leave it out and the market is closer to 450 million dollars.\n\nBoth are describing the same reality — they just draw the boundary in different places. And because YouTube is so dominant here, where you draw that line swings the region's headline size by two or three times. This isn't a fact anyone can go measure; it's a definition the industry hasn't agreed on. Until the trade bodies rule one way or the other, the honest answer to \"how big is this market?\" is a range, not a number — and everyone quoting a single figure is quietly picking a side.\n\n## Three ways the next five years could go\n\nNo one can call this precisely, but the shape is unusually legible. Think of it as three tracks.\n\n**Most likely — the money catches up, steadily.** Reach compounds into revenue without ever fully closing the gap. The six-country market roughly doubles to somewhere around 1 to 2.5 billion dollars by 2028–2030, Brazil and Mexico keep their combined 80% share, free ad-supported streaming stays the core, and premium inventory keeps trading through private deals because fraud and fragmentation make caution rational. This is the base case, and it's where the weight of the evidence sits.\n\n**The upside — the living room monetizes fast.** The 2026 FIFA World Cup, streamed across the region, drags big brand-TV budgets into streaming as a showcase; the industry decides to count YouTube-on-the-TV, mechanically lifting the number two-to-three-fold; and premium services move to open, competitive ad auctions. Spend sprints to the top of the band.\n\n**The downside — reach without revenue persists.** The audience keeps growing and the money keeps lagging. A currency crash in Argentina or a recession in Mexico keeps dollar budgets volatile; the fraud problem and the near-total absence of reliable price benchmarks keep advertisers cautious; new rules — including a Brazilian ban, live since March 2026, on ad-targeting profiles for content children might watch — tighten what's allowed in the family living room. YouTube keeps vacuuming up the available budget, and everyone else takes share only at the edges.\n\nTwo signals tell you which track you're on, and a normal reader can watch for both. First, whether the industry ever agrees on the YouTube definition — that single ruling would end the two-or-three-times guessing game overnight. Second, whether the 2026 World Cup pulls real brand money into streaming or just fills screens for a month and fades. Latin America has already won the hard part: it built the connected living room. What's left to settle is how quickly the money walks through the door."}, {"order": 1, "file": "01_Origins_History.md", "title": "Origins & History of the Latin American Programmatic CTV Advertising Market", "summary": "", "body": "# Origins & History: How Latin America Arrived at Programmatic CTV\n\n## Bottom Line\n\nLatin America did not arrive at programmatic Connected-TV the way the United States did. It took a different road, from a different starting point.\n\nThe region's television century rested on **free-to-air broadcast dominance**. Globo in Brazil (on air since 1965) and Televisa in Mexico (consolidated in 1973) each held roughly 90% audience shares for decades, layered over **structurally low pay-TV penetration** compared with the US or Europe — Argentina the standout exception. When the internet finally reached mass scale, it came through the phone, not the desktop. Mobile broadband connections overtook fixed lines around 2011, producing a **mobile-first leapfrog** that shaped how the region would watch video.\n\nGlobal SVOD entered through that same door: **Netflix launched across the region beginning September 5, 2011 in Brazil.** The **2020–2021 streaming war** followed (Disney+ November 2020, HBO Max June 2021, Star+ August 2021, plus local entrants Globoplay from 2015 and ViX from March 2022), driving smart-TV adoption until Brazil became the largest CTV audience outside the US (~89 million users). **FAST arrived in force in 2020** (Pluto TV March 25, 2020; Samsung TV Plus and Tubi the same year).\n\nBut the **programmatic transaction of premium CTV inventory arrived late and unevenly.** Globo had run a private programmatic marketplace (\"ProG,\" on Rubicon) since 2015 — for display, not television. The broadcaster-grade programmatic CTV layer is essentially a **2022-onward phenomenon**: Globo's GAMA marketplace (announced October 2022), Netflix's ad tier (Brazil/Mexico, November 2022), and Roku's Brazil ad platform (October 15, 2025) bracket the window in which CTV inventory actually started trading programmatically at scale.\n\nFour contingent turns produced today's shape: the broadcast-state alliances of the 1960s–70s, the mobile leapfrog of the early 2010s, the Netflix-led SVOD entry, and the FAST/ad-tier convergence of 2020–2022. And several of the platforms that define \"today\" — Star+, the HBO Max brand — have already sunset or been renamed. Present-tense status is the thing that goes stale fastest.\n\n---\n\n## 1. The Free-to-Air Century (1950s–2000s)\n\n### Latin American television was built on free-to-air broadcast dominance, not pay-TV\n\nFor most of the television century, one broadcaster owned each of the region's largest markets. The economy was over-the-air and advertiser-funded, organized around a single dominant national network: Organizações Globo in Brazil, Grupo Televisa in Mexico.[1] TV Globo, launched by Roberto Marinho on April 26, 1965, became the largest commercial television network in Latin America and the world's largest producer of telenovelas.[2] For most households across most of that era, \"watching television\" meant watching free, ad-supported broadcast signals. The habit pre-loaded the region for ad-supported streaming (AVOD/FAST) decades later, and it sharply distinguishes the region from the US subscription-cable trajectory.\n\nThis matters for the CTV story. The region's demand-side muscle memory — brand advertisers buying mass-reach video against telenovelas and football — was built in the free-to-air era. As audiences move to streaming, that muscle memory is migrating, not being invented.\n\n### Globo and Televisa achieved their dominance through early-stage alliances with the state\n\nThe dominance was not purely commercial. Both broadcasters built mutually supportive relationships with the governments of their day and perpetuated themselves through dynastic family control.[1] In Brazil, the military regime that took power in the 1964 coup pushed television into the population, subsidizing credit for set sales and building national distribution systems. It chose Globo, launched a few months after the coup, as a privileged partner — and by the late 1960s Globo had built the first true national network.[1] In Mexico, the Azcárraga family assembled control of the national networks; in exchange for a private monopoly, the family offered loyalty to the semi-authoritarian regime, and newscasts were barred from criticizing the president or governors.[3] This state-allied broadcast structure is the deepest root of the region's media concentration — and it still shapes who owns the premium CTV inventory today (Globo's Globoplay/GAMA; TelevisaUnivision's ViX).\n\n### Grupo Televisa was consolidated in 1973 and reached ~90% audience share in Mexico\n\nGrupo Televisa formally emerged on January 8, 1973, through the merger of Telesistema Mexicano (founded 1955 by Emilio Azcárraga Vidaurreta from Mexico's first three TV stations) and Televisión Independiente de México, orchestrated by Emilio Azcárraga Milmo.[3] Telesistema's owners held 75% of the new entity.[3] Televisa built its success — more than a 90% market share in Mexico — around the telenovela.[3] The 1973 merger also handed Televisa control of Cablevisión, the major pay-TV business in Mexico City. But Mexican regulators then blocked Televisa's cable expansion and forced asset sales — an early instance of regulation suppressing pay-TV scale.[3]\n\n### Pay-TV penetration in Latin America is structurally low relative to the US/Europe, with Argentina the exception\n\nAs of late 2022, Latin America had among the lowest pay-TV penetration rates in the world — second only to the Middle East and Africa — with less than two in five people subscribing.[4] The US, by contrast, peaked above 80–90% household pay-TV penetration in the cable era. The clean exception within the region is **Argentina**, which has the highest pay-TV penetration in Latin America: over six in ten people pay for TV, with more recent figures putting cable-led reach at roughly 74% of homes and over 80% once satellite is included.[5][6] Well-established cable operators built that market — Grupo Clarín's Cablevisión owns roughly four in ten subscriptions, followed by DirecTV (~27%) and Telecentro (~7%); cable accounts for ~82% of pay-TV subscriptions there versus ~18% satellite.[6] The service-type split differs by country: Argentina, Peru, and Chile are cable-majority pay-TV markets, while **Brazil and Mexico are satellite-majority**.[4]\n\nThis low-penetration baseline matters causally. The region never developed the dense, addressable, set-top-box advertising infrastructure of US cable. So the leap to streaming-delivered CTV is, in some respects, a leap from broadcast straight to IP — skipping the advanced-cable step that defined US Advanced TV.\n\n---\n\n## 2. The Mobile-First Leapfrog (2000s–early 2010s)\n\n### Mobile broadband overtook fixed lines around 2011, producing a mobile-first internet\n\nIn 2011, mobile broadband connections surpassed fixed-line connections in Latin America as a whole.[7] Mobile broadband offered an affordable on-ramp for lower-income households, and smartphones served as cheaper internet terminals than computers.[7] By September 2014, about 35% of the region's population (216 million people) used mobile devices to reach the internet, and the GSMA estimated ~50% would do so by 2020.[7] The structural label — Latin America as a \"markedly mobile-first region\" — is well attested across analysts (mobile penetration forecast ~74% by 2025; at least 69% of mobile connections are smartphones).[8]\n\nThe leapfrog shaped video consumption. A generation came to streaming through phones first. That is why much early SVOD viewing was mobile, and why the *later* migration of that viewing to the big screen (CTV) is the defining behavioral shift of the 2020s rather than the 2010s. The \"2011 crossover\" rests on GSMA-derived reporting, while the broader mobile-first characterization is well attested across analysts.\n\n### Low broadband penetration was an early constraint on streaming (24% at Netflix's 2011 launch)\n\nAt Netflix's 2011 regional launch, broadband penetration was a \"lowly 24%,\" and the launch was described as not as successful as the company had hoped in a developing region.[9] This is the infrastructure floor against which the entire CTV market later grew. The early-2010s entry was bandwidth-constrained; the market's eventual scale depended on a decade of mobile and fixed-broadband build-out. The precise \"24%\" comes from the contemporaneous Variety report.\n\n---\n\n## 3. Global SVOD Enters Through the Mobile Door (2011)\n\n### Netflix launched across Latin America beginning September 5, 2011, Brazil first\n\nNetflix began its Latin American/Caribbean expansion in September 2011, ultimately covering 43 countries and territories with content in English, Spanish, and Portuguese.[9][10] Brazil was first, on **September 5, 2011**; Argentina followed on the 7th, Chile on the 8th, Colombia on the 9th, and **Mexico on the 12th**.[9][10] Brazil launched at BR$14.99/month (~US$9.10), Mexico at 99 pesos/month.[9] Crucially for the later programmatic story, Netflix entered having signed content deals with the very incumbents it was disrupting — Globo (Brazil), Televisa and TV Azteca (Mexico), Telefe (Argentina), Caracol (Colombia), and NBCUniversal's Telemundo.[9] This is the single most important date in the region's streaming origin story. It is the moment global SVOD established the beachhead that every later entrant — and eventually the ad-supported, programmatically-transacted CTV layer — would build on.\n\n### Local SVOD entrants followed, with Globoplay (2015) the leading national service\n\nThe incumbents answered with their own streaming services. **Globoplay was created October 26, 2015 and launched in Brazil November 3, 2015**, owned by Globo; by 2020 it reached 20 million registered users and became the most-used national streaming service in Brazil.[11] Globoplay is the broadcaster-owned BVOD anchor that today sells premium CTV inventory through Globo's GAMA marketplace (discussed below). This sequence — global SVOD first (2011), local BVOD response (2015) — inverts who *owned the audience habit* in the free-to-air era. It is why the region's premium CTV supply is split between global platforms and a thick local broadcaster layer.\n\n---\n\n## 4. The Streaming War (2020–2021)\n\n### The global streaming war hit Latin America in 2020–2021, driving smart-TV adoption\n\nThe 2020–2021 window brought the global SVOD field into the region almost at once: **Disney+ launched in Latin America in November 2020**; **HBO Max expanded to the region in June 2021**; and **Star+ (Disney's general-entertainment companion) launched August 31, 2021** (delayed from a planned June 2021 date).[12][13][14] Landing during pandemic-era demand for indoor entertainment, these launches are widely described as making Latin America an important beachhead in the global streaming race.[14] The competitive surge accelerated smart-TV and CTV-device adoption — the precondition for any CTV advertising market — and seeded the multi-platform \"stacking\" behavior (households subscribing to several services) that characterizes the region today.\n\n### ViX launched March 31, 2022 as the largest Spanish-language streaming service\n\nTelevisaUnivision launched **ViX on March 31, 2022** as the first global large-scale streaming service built specifically for the Spanish-speaking world — a free AVOD tier (ViX, with ~100 EPG channels) plus a premium SVOD tier (ViX+, launched H2 2022).[15] ViX is the Mexican/US-Hispanic counterpart to Globoplay: a broadcaster-owned, ad-supported property now a flagship of the region's programmatic CTV supply (scaled by Magnite, as the chapter on the supply and demand ecosystem discusses). In October 2022, TelevisaUnivision and Globo announced a content distribution and co-production alliance, linking the region's two dominant broadcaster-streamers.[16]\n\n### Star+ has sunset and HBO Max was rebranded to \"Max\" — present-tense status warnings\n\nTwo corrections that any current map of the region must respect:\n- **Star+ shut down as a standalone service in Latin America in 2024**, with content moving onto Disney+; Disney began the migration in Q2 2024 and Star+ wound down (reported standalone operation until late June/July 2024).[13] *Star+ is no longer a live standalone platform.*\n- **HBO Max was rebranded to \"Max\" across Latin America**, with the new Max app launching **February 27, 2024** in Argentina, Brazil, Chile, Colombia, Mexico, Uruguay and others.[17] (Warner Bros. Discovery has subsequently moved the global brand back toward \"HBO Max\" — see Open Questions; the LATAM-specific app name and timing should be re-verified before any present-tense assertion.)[18]\n\nThese two items are exactly the kind of present-tense platform status that silently goes stale — by sunset, rename, or successor product. Neither platform should be assumed to \"currently operate\" under its launch name.\n\n---\n\n## 5. FAST/AVOD Arrives in Force (2020)\n\n### FAST arrived in Latin America in 2020, led by Pluto TV (March 25, 2020)\n\nFree Ad-Supported Streaming TV (FAST) — linear-style, ad-funded channels delivered over IP — entered the region at scale in 2020. **Pluto TV (then ViacomCBS) launched in Latin America on March 25, 2020**, debuting in 17 Spanish-speaking countries with 12,000 hours of content across 24 channels from 55+ partners, planning to exceed 80 channels by year-end and to reach Brazil by the end of 2020.[19][20] Launch partners included Telefe, Paramount, MTV, Nickelodeon, Lionsgate, BBC, Sony Pictures Television, and Fremantle.[19][20] Pluto TV is the region's FAST first-mover — and the template for the ad-supported, scale-first model that programmatic CTV monetizes.\n\n### Samsung TV Plus and Tubi also entered in 2020, anchoring OEM and broadcaster-partnered FAST\n\nTwo more 2020 entries shaped FAST's structure:\n- **Samsung TV Plus** — announced for Brazil at CES January 2020 and launched in Brazil in 2020 (Mexico followed ~2021).[21] The service globally dates to 2015 as one of the earliest FAST offerings; in Brazil it has become the leading FAST service, today reported at ~120 channels and **22.4 million active users — second only to the US** (a present-status figure to keep dated).[21] Because it is OEM-owned and runs on Samsung's device base, it sits structurally central to addressable (ACR-driven) CTV supply.\n- **Tubi (FOX Entertainment)** — launched in **Mexico on June 18, 2020** with strategic partner TV Azteca and Hisense's VIDAA as exclusive CTV launch partner; Tubi expanded to five more LATAM countries (Costa Rica, Ecuador, El Salvador, Guatemala, Panama) in August 2022.[22][23]\n\nThe 2020 FAST wave is the supply-side precondition for programmatic CTV: it created a large pool of ad-supported, IP-delivered inventory that — unlike subscription-only SVOD — actually needs an advertising marketplace.\n\n---\n\n## 6. When Programmatic CTV Actually Arrived (2015 display → 2022 broadcaster-grade CTV)\n\n### Brazil's broadcaster programmatic began in 2015, but for display, not CTV\n\nThe earliest broadcaster programmatic in the region predates CTV by years. In **August 2015, Globo.com launched \"ProG,\" a private programmatic marketplace** on Rubicon Project technology, opened first to Globo's 30 largest advertisers, with Globo retaining control of inventory and trading; Globo's technology director called it the product of two years of research.[24] This is the genuine origin of broadcaster programmatic in Brazil — but it traded a **display/digital** marketplace, not connected-TV inventory. The broader regional programmatic display market was still nascent in 2013 (US DSPs only beginning to open Brazil offices; the market described as \"a couple of years behind\" the US).[25] The ProG specifics rest on a single 2015 ExchangeWire account, while the \"nascent in 2013\" framing is corroborated by contemporaneous AdExchanger reporting.[25]\n\n### Broadcaster-grade programmatic CTV is essentially a 2022-onward phenomenon\n\nPremium CTV inventory began transacting programmatically at scale only recently, and the milestones cluster in **2022**:\n- **Globo announced its GAMA Ad Marketplace at its 2023 Upfront on October 28, 2022**, with a debut scheduled for November 2022 — a programmatic media platform built in partnership with Microsoft's Xandr, with data-driven targeting and brand-safety guarantees, spanning Globo inventory plus other Brazilian digital inventory.[26][27] (This revises any account dating GAMA to 2023; the announcement and intended debut are Q4 2022.)\n- **Netflix launched its ad-supported tier in Mexico (November 1) and Brazil (November 3), 2022**, in its first 12-market wave.[28][29] At launch the ads were sold at fixed price rather than auction, with country and gender targeting and DoubleVerify/IAS verification from Q1 2023 — i.e., addressable but not yet fully programmatic at the start.[28][29]\n\nSo the honest answer to \"when did programmatic CTV arrive in LATAM?\" is layered: **broadcaster display programmatic from 2015 (Globo/Rubicon); FAST inventory pooling from 2020; broadcaster-grade and SVOD-ad-tier CTV programmatic from late 2022 (GAMA, Netflix ads).** The open RTB/PMP transaction of premium CTV remains thinner and more PMP/programmatic-guaranteed-skewed than the US, as the chapter on the supply and demand ecosystem details.\n\n### Global CTV ad platforms continued landing through 2025 (Roku Brazil, Oct 15, 2025)\n\nThe plumbing of programmatic CTV demand and supply was still arriving as recently as **October 15, 2025**, when **Roku launched its connected-TV advertising platform in Brazil** — offering inventory bought directly from Roku or through 25+ authorized sales partners including Mercado Ads and SBT, with proprietary data and targeting/measurement tools.[30][31] Roku framed Brazil as on track to become the world's third-largest FAST market by 2029 (per Omdia).[30] The lateness of this milestone is itself a key fact about the region's maturity: a major US CTV ad platform only formally opened its Brazil ad business in late 2025. The infrastructure is still being assembled. (Source dated October 2025.)\n\n### YouTube is the dominant CTV inventory in the region, a structural inheritance of mobile-first video\n\nThe largest single source of ad-supported streaming time in Latin America is not a broadcaster or an SVOD service. It is **YouTube/Google** — a direct legacy of the mobile-first leapfrog: the region came to online video through free, ad-supported, user-generated and creator video before premium SVOD/FAST. eMarketer and Omdia attest YouTube's CTV dominance regionally; Omdia forecasts Google will still account for ~26% of *global* CTV ad revenue by 2030, and platforms like YouTube and Instagram Reels reach 97% of Brazilian adults 18–64.[32] Brazil is the **largest CTV audience outside the US (~89 million users)** and tops total time spent (over 140 billion minutes; ~4.5 hours/day).[32] This is why a neutral account of the region's CTV market cannot rest on premium broadcaster or SVOD inventory alone. The gravitational center of *ad-supported streaming time* is YouTube; premium AVOD/FAST takes share at the margins.\n\n---\n\n## 7. Country Histories Where They Differ Materially\n\n### Brazil: the anchor market, satellite-led pay-TV, broadcaster-programmatic pioneer\n\nBrazil is the region's CTV anchor: the largest audience (~89M), with Globo the dominant free-to-air-to-streaming incumbent (TV Globo since 1965; Globoplay since 2015; GAMA programmatic from 2022).[2][11][26][32] Its pay-TV is satellite-majority,[4] and it is the FAST powerhouse — Samsung TV Plus's #2-globally market and a projected world #3 FAST market by 2029.[21][30] Brazil is also where broadcaster programmatic began (ProG, 2015) and where the most recent global plumbing landed (Roku, 2025).[24][30] Its LGPD privacy framework (covered in the chapter on regulation and privacy) makes it the region's most sophisticated programmatic market.\n\n### Mexico: Televisa monopoly legacy, regulator-suppressed cable, ViX as the Spanish-language flagship\n\nMexico's distinct history is the Televisa monopoly (consolidated 1973; ~90% audience share), the regulator-blocked cable expansion that suppressed early pay-TV scale, and the merger with Univision to form TelevisaUnivision, whose **ViX (launched March 31, 2022)** is the largest Spanish-language streaming service and a programmatic CTV flagship.[3][15] Mexico's pay-TV is also satellite-majority,[4] and it was Tubi's first LATAM market (June 2020, with TV Azteca).[22] Netflix's ad tier launched there November 1, 2022.[28]\n\n### Argentina: the pay-TV exception (cable-led, ~74–80%), Clarín/Cablevisión concentration\n\nArgentina is the structural outlier: the **highest pay-TV penetration in Latin America** (over six in ten; cable-led reach ~74% of homes, >80% with satellite), dominated by Grupo Clarín's Cablevisión (~40% of subscriptions), DirecTV (~27%), and Telecentro (~7%); cable is ~82% of pay-TV there.[5][6] That dense cable base means Argentina's CTV transition starts from a more saturated baseline than its neighbors — closer, in penetration terms, to the US model — even as the operator OTT layer (Flow) and global FAST move in. Telefe is the leading free-to-air broadcaster and an early Netflix and Pluto TV partner.[9][19]\n\n### Colombia, Chile, and Peru: cable-majority pay-TV, lighter programmatic maturity\n\nThe three smaller focus markets share a cable-majority pay-TV structure (per the region's service-type split).[4] Colombia's free-to-air is led by Caracol and RCN; Caracol was an early Netflix content partner.[9] All three sit below Brazil and Mexico in programmatic-CTV maturity, and Peru is generally cited as the lightest of the six on programmatic depth, as the chapter on the supply and demand ecosystem details. Country-specific pay-TV percentages for 2023–2024 were not cleanly isolable from the sources consulted here for each of these three individually, so the per-country granular penetration figures remain an open item rather than precise numbers. The collective share: in 2023, Argentina, Colombia, Chile and Peru together held ~26.5% of regional pay-TV subscribers, with Mexico (28.9%) and Brazil (28.2%) the two largest.[4]\n\n---\n\n## 8. The Contingent Inflection Points\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">How Latin America arrived at programmatic CTV<\/div><div class=\"viz-timeline\"><div class=\"tlrow cv-rise\" style=\"--d:0.00s\"><div class=\"tldate\">1965 / 1973<\/div><div class=\"tlbody\">Globo (Brazil) and Televisa (Mexico) consolidate free-to-air broadcast dominance over low pay-TV penetration<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.07s\"><div class=\"tldate\">c. 2011<\/div><div class=\"tlbody\">Mobile broadband overtakes fixed lines; the region meets online video through YouTube first<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.14s\"><div class=\"tldate\">2011-09<\/div><div class=\"tlbody\">Netflix launches across LATAM, establishing the SVOD beachhead<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.21s\"><div class=\"tldate\">2015-08<\/div><div class=\"tlbody\">Globo&#x27;s ProG begins broadcaster programmatic — for display, not CTV<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.28s\"><div class=\"tldate\">2020<\/div><div class=\"tlbody\">FAST arrives at scale (Pluto TV, Samsung TV Plus, Tubi), pooling ad-supported inventory<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.35s\"><div class=\"tldate\">2020-2021<\/div><div class=\"tlbody\">The streaming war (Disney+, HBO Max, Star+, ViX) drives smart-TV adoption<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.42s\"><div class=\"tldate\">2022-11<\/div><div class=\"tlbody\">Globo&#x27;s GAMA marketplace and Netflix&#x27;s ad tier ignite broadcaster-grade programmatic CTV<\/div><\/div><div class=\"tlrow cv-rise\" style=\"--d:0.49s\"><div class=\"tldate\">2025-10<\/div><div class=\"tlbody\">Roku launches its Brazil ad platform — major plumbing still arriving<\/div><\/div><\/div><figcaption> <span class=\"credit\">Source: Synthesis of the sources cited in this chapter.<\/span><\/figcaption><\/figure>\n\n\n\nA handful of contingent turns produced the shape of today's market — and each could plausibly have gone otherwise:\n\n1. **The broadcast-state alliances of the 1960s–70s** (Globo post-1964, Televisa 1973) created a free-to-air, advertiser-funded, highly-concentrated television economy — the demand-side and inventory-ownership structure the CTV market inherits.\n2. **Regulatory suppression of cable** (notably Mexico) and generally low pay-TV uptake meant the region never built dense set-top-box addressable infrastructure — so CTV is a leap from broadcast to IP, not an evolution of advanced cable.\n3. **The mobile-first leapfrog (~2011 crossover)** routed the region's internet-video habit through phones and through YouTube first, making YouTube the gravitational center of ad-supported streaming time.\n4. **Netflix's September 2011 entry** established the SVOD beachhead, signing the incumbents as content partners.\n5. **The 2020 FAST wave (Pluto TV, Samsung TV Plus, Tubi)** created the ad-supported, IP-delivered inventory pool that programmatic actually needs.\n6. **The 2020–2021 streaming war** drove smart-TV adoption past the threshold for a real CTV audience.\n7. **The late-2022 programmatic-CTV ignition** (Globo GAMA, Netflix ad tier) — and the still-arriving plumbing (Roku Brazil, October 2025) — mark the actual, recent arrival of programmatic transaction of CTV inventory at scale.\n\nHad broadband built out faster, had regulators not suppressed cable, or had a local platform rather than YouTube captured the mobile-video habit, the region's CTV market would look materially different today. None of that was inevitable. The road simply ran the way it ran.\n\n---\n\n## Open Questions\n\n1. **What is the precise per-country pay-TV penetration for 2023–2024** for Colombia, Chile, and Peru individually? The sources here cleanly establish Argentina (high, ~74%) and the regional ranking, but per-country 2023–2024 percentages for the three smaller markets need a dedicated statistical source (Statista/Dataxis/BB Media).\n2. **Has the LATAM \"Max\" app reverted to \"HBO Max\"?** Warner Bros. Discovery moved the global brand back toward \"HBO Max\"; the LATAM-specific app name and current status (post-February 2024) should be re-checked before any present-tense claim — this remains a live, fast-changing question.\n3. **When did open-RTB (vs. PMP/PG) CTV transaction reach material volume in the region?** The 2022 ignition is clear for broadcaster marketplaces and ad tiers, but the open-exchange CTV timeline is murkier and overlaps the current state of the market.\n4. **What was the earliest *CTV-specific* (not display) programmatic deal in the region**, and on whose technology? ProG (2015) was display; the first true CTV programmatic deal's date and counterparties would sharpen the 2022-onward dating above.\n5. **How did the 2020 FAST launches monetize at the start** — which SSPs/ad servers powered Pluto TV, Samsung TV Plus, and Tubi inventory in 2020–2021, before the 2022 broadcaster marketplaces? (Overlaps the supply and demand ecosystem.)\n6. **Did Netflix's ad tier move from fixed-price to auction/programmatic in LATAM**, and when (the Amazon DSP conduit appears to be a Q4 development — needs a dated confirmation)?\n\n---\n\n## Sources\n\n1. \"Television in Latin America,\" Wikipedia — used only as a navigation pointer; the substantive claims (Globo/Televisa dominance, military-era subsidies, dynastic control) are drawn from the underlying scholarship it cites and corroborated by NACLA's \"The Globalization of Latin American Media.\" Tier 7 navigation only / underlying claims Tier 2. Contribution: framing of broadcaster dominance and state alliances. https://en.wikipedia.org/wiki/Television_in_Latin_America (accessed 2026-06-17).\n2. \"TV Globo,\" and \"Television in Brazil,\" Wikipedia (navigation) → underlying: Globo founding date (April 26, 1965), largest commercial network / telenovela producer. Tier 2 (underlying historical record). Contribution: Globo founding and scale. https://en.wikipedia.org/wiki/TV_Globo (accessed 2026-06-17).\n3. Grupo Televisa company histories (FundingUniverse; ResearchGate, \"A History of the Monopolization of Pay Television in Mexico\"; medialandscapes.org Mexico). Tier 2 (scholarly/reference). Contribution: 1973 merger, Azcárraga lineage, ~90% share, Cablevisión control and regulator-blocked cable expansion. https://www.fundinguniverse.com/company-histories/grupo-televisa-s-a-history/ ; https://www.researchgate.net/publication/363158565 (accessed 2026-06-17).\n4. eMarketer, \"Pay TV penetration is on a slow decline across Latin America,\" and Statista \"Pay TV in Latin America.\" Tier 5 (analytical) / Tier 5 aggregated stats. Contribution: region among world's lowest pay-TV penetration; cable vs. satellite split by country; 2023 market-share ranking (MX 28.9%, BR 28.2%, others 26.5%). https://www.emarketer.com/content/pay-tv-penetration-on-slow-decline-across-latam (accessed 2026-06-17).\n5. Rapid TV News, \"Argentina's pay-TV sector tops penetration rates in LATAM,\" 2016. Tier 5 (trade press). Contribution: Argentina as the regional pay-TV leader. https://www.rapidtvnews.com/2016040442321/ (accessed 2026-06-17).\n6. Statista / industry data on Argentina pay-TV (Cablevisión ~40%, DirecTV ~27%, Telecentro ~7%; cable ~82% of subs; ~74% home reach). Tier 5. Contribution: Argentine pay-TV structure and
