couple of years behind.\" https://www.adexchanger.com/online-advertising/spotlight-on-brazil-rtb-gaining-ground-in-a-diverse-advertising-market/ (accessed 2026-06-17).\n26. Meio & Mensagem / TELA VIVA News / Marcas Mais, on Globo GAMA marketplace announced at 2023 Upfront (Oct 28, 2022), debut November 2022, Xandr partnership. Tier 5 (Brazilian trade press — non-Anglophone). Contribution: GAMA launch timing and tech partner. https://telaviva.com.br/28/10/2022/globo-lanca-marketplace-de-midia-programatica/ (accessed 2026-06-17).\n27. GAMA Ad Marketplace official site (gama.globo). Tier 1 (primary, used for product description, not as proof of performance). Contribution: GAMA features. https://gama.globo/ (accessed 2026-06-17).\n28. Deadline, \"Netflix Ad Tier Launches Today In Eight Countries\" / Bloomberg Línea / TAVI / Omdia, on Netflix \"Basic with Ads\" launch (MX Nov 1, BR Nov 3, 2022), fixed-price model, targeting, DV/IAS verification from Q1 2023. Tier 5 (trade) / Tier 5 (Omdia analytical). Contribution: Netflix ad-tier launch dates and mechanics. https://deadline.com/2022/11/netflix-ads-launch-what-to-know-1235162223/ (accessed 2026-06-17).\n29. Netflix Form 8-K FY2022 (SEC). Tier 1 (primary filing). Contribution: corroborates ad-tier timing/markets. https://www.sec.gov/Archives/edgar/data/0001065280/000106528022000367/ex991_q322.htm (accessed 2026-06-17).\n30. Roku Newsroom, \"Roku Unlocks Millions of Viewers in Brazil\" (Oct 15, 2025). Tier 1 (primary milestone). Contribution: Roku Brazil ad-platform launch, 25+ partners incl. Mercado Ads/SBT, Omdia #3-FAST-by-2029 framing. https://newsroom.roku.com/news/2025/10/roku-unlocks-millions-of-viewers-in-brazil-as-part-of/2klcvhbl-1760474071 (accessed 2026-06-17).\n31. thedesk.net / Telecompaper, \"Roku launches connected TV ad platform in Brazil,\" Oct 2025. Tier 5 (trade). Contribution: independent confirmation of Roku Brazil ad-platform launch. https://thedesk.net/2025/10/roku-launches-connected-tv-ad-platform-in-brazil/ (accessed 2026-06-17).\n32. eMarketer (\"TV viewing fuels YouTube's streaming dominance\") and Omdia (\"Media trends for Latin America in 2026\"; Brazil ~89M CTV users; ~140B minutes; Google ~26% of global CTV ad revenue by 2030; YouTube/Reels 97% reach of BR 18–64). Tier 5 (analytical). Contribution: YouTube CTV dominance, Brazil-as-largest-audience figures. https://www.emarketer.com/content/tv-viewing-fuels-youtube-s-streaming-dominance-ctv-concentration-rises ; https://omdia.tech.informa.com/om143721/media-trends-for-latin-america-in-2026-the-rise-of-verticals-and-connected-tv (accessed 2026-06-17).\n\n---\n\n*Sourcing note:* This document is foundational/historical. Per the source hierarchy, foundational dating claims lean on primary company milestones (Tier 1: Netflix, ViX, Tubi, Samsung, Roku, GAMA, SEC filings) and Tier 5 media-history trade press (Variety, Deadline, Rapid TV News, ExchangeWire, AdExchanger, eMarketer, Omdia, and Brazilian-language trade for GAMA). Wikipedia was used only as a navigation pointer to the underlying record, never as a substantive citation. Pay-TV penetration and CTV-audience figures are Tier 5 aggregated statistics and should be treated as best-available analyst estimates, not government data. Present-tense platform statuses (Samsung TV Plus user counts, Max/HBO Max branding, Star+ sunset, Roku Brazil) are flagged with their confirmation dates because they are exactly what goes stale."}, {"order": 2, "file": "02_Market_Size_Growth.md", "title": "Sizing the Latin American Programmatic CTV Market", "summary": "", "body": "# Sizing the Latin American Programmatic CTV Market\n\nThis account sizes the market: how large regional and per-country Connected-TV (CTV) and programmatic-CTV ad spend is, how fast it is growing, where it sits inside the digital and total-media pies, and what a calibrated forecast through 2030 looks like. Player profiles, the supply/demand stack, measurement mechanics, connectivity, and regulation are taken up in later chapters. The analysis is neutral and built around no single vendor.\n\n---\n\n## BOTTOM LINE\n\nConnected-TV advertising in Latin America is a **small, fast, and lopsided** market. The cleanest public regional anchor is Dataxis's estimate of roughly **USD 450 million in LATAM CTV ad revenue by 2026** — CTV is still measured in *hundreds of millions* of dollars regionally, against a total LATAM ad market that **surpassed USD 40 billion in 2025** and a digital ad market already at **USD 22.25 billion in 2024** and ~56.6% of all media in 2025 [1][2][3]. Omdia's January-2026 read puts the broader LATAM media-and-entertainment market on track for **USD 65 billion in 2026** at ~10.7% annual growth, with advertising and ad-tier bundling as the principal engines [4].\n\nThree facts define the opportunity. **First, the supply side is already enormous and overwhelmingly ad-supported:** ~163 million installed smart TVs in 2024 heading to ~193 million by 2026 (83.5% connected), with ~95% of CTV households using an ad-supported (AVOD) service monthly [1][5]. **Second, two countries are the market, not merely lead it:** on the most consistently cited country-share split, Brazil (~40.6%) and Mexico (~39.8%) jointly hold ~80% of regional CTV ad investment, with Argentina (~7.5%) and Colombia (~7.2%) next and Chile and Peru sharing a low-single-digit residual [6]. **Third, monetization lags reach badly:** eMarketer flags CTV at ~20% of media *time* in the region in 2025 but only ~7.7% of ad spend, and Brazil + Mexico (with Italy and Spain) together are only ~1.25% of *global* CTV ad spend [7]. Practitioner reads put CTV at ~5% of LATAM *digital* ad spend today [5].\n\nOne measurement issue dwarfs the rest: a **definitional fork over whether YouTube-on-the-TV-screen counts as \"CTV.\"** It swings the regional number 2–3×. On a narrow premium-CTV definition (FAST, BVOD, and SVOD ad tiers, excluding YouTube), LATAM CTV ad spend is ~USD 450M in 2026; on a broad definition that folds in YouTube-on-TV — where 45%+ of YouTube viewing in Argentina, Brazil, and Mexico now happens on the TV screen — it is closer to ~USD 1B+ [1][5]. These pages carry both framings, and every table states its basis. **The strategic read: viewing has already migrated to the connected living room; ad budgets have not yet followed. That gap is the thesis. Platform entries through 2025 — ad-tier rollouts, and Roku's October-2025 Brazil ad-platform launch — mark the moment the gap began to close.** [8]\n\n---\n\n## 1. The Regional Ad Market CTV Sits Inside\n\nCTV cannot be sized in isolation. It is a sliver of a large, fast-growing digital pie — which is itself the larger half of a total-media pie that crossed USD 40 billion in 2025.\n\n### 1.1 Total, digital, and programmatic anchors\n\n| Metric | Value | Year / basis | Source |\n|---|---|---|---|\n| Total LATAM ad market (all media) | **> USD 40 billion** | 2025 | eMarketer [2] |\n| LATAM **digital** ad spend | **USD 22.25 billion** | 2024 | eMarketer [3] |\n| Digital share of total media | **56.6%** (→ ~two-thirds by 2029) | 2025 | eMarketer [2] |\n| LATAM media & entertainment revenue (broad: subs + ads + bundling) | **USD 65 billion** by 2026, ~10.7%/yr | Jan 2026 | Omdia [4] |\n| LATAM **programmatic** ad spend (narrow display/video definition) | **USD 16.77B (2023) → 23.6B (2028)** | series | Statista [9] |\n| \"South America programmatic\" (broad, all channels incl. social/search) | **USD 70.22B (2025) → 116.12B (2030)**, 10.58% CAGR | 2025–30 | Mordor [6] |\n\nThe ~4× gap between Statista's USD 16.77B (2023) and Mordor's USD 70.22B (2025) for \"programmatic\" is **definitional, not a real market difference.** Mordor's figure captures a broad notion of programmatically transacted media, including walled-garden social and search; Statista tracks a narrower programmatic display/video definition. Treat Statista as the conservative anchor and Mordor as an aggressive upper bound. *(This is a recurring trap in this market: numbers that look contradictory usually differ on what is being counted, not on the underlying reality.)*\n\n### 1.2 CTV ad spend specifically\n\nThere is **no single authoritative public CTV-ad-spend-in-USD figure for all of LATAM** — eMarketer's per-country CTV charts (Brazil and Mexico, 2024–2029) are paywalled. The best-available anchors:\n\n| Figure | Value | Basis / caveat | Source |\n|---|---|---|---|\n| LATAM CTV **ad revenue** | **~USD 450 million** | 2026; Dataxis estimate; cleanest narrow-CTV anchor | [1] |\n| CTV share of LATAM **media time** | **~20.2%** | 2025; eMarketer | [7] |\n| CTV share of LATAM **ad spend** | **~7.7%** | 2025; eMarketer (time-vs-money gap) | [7] |\n| CTV share of LATAM **digital** ad spend | **~5%** | ~2025; practitioner / Comscore-derived | [5] |\n| Brazil+Mexico (+Italy+Spain) share of **global** CTV ad spend | **~1.25% combined** | eMarketer; underscores under-monetization | [7] |\n| CTV sub-segment **CAGR to 2030** (within programmatic mix) | **~12.3%** | Mordor | [6] |\n\n**Triangulated estimate (analyst synthesis, not a single source):** if LATAM digital ad spend is ~USD 24–26B in 2025 and CTV is ~5% of digital, regional CTV ad spend lands near **USD 1.2–1.3B in 2025** on the *broad* (YouTube-on-TV-inclusive) definition — but only **~USD 450M in 2026 on Dataxis's narrower premium-CTV definition.** The 2–3× gap between the two is almost entirely the YouTube question (§4).\n\n### 1.3 Programmatic vs. total CTV\n\nNo public source cleanly separates *programmatic* CTV from *total* CTV ad spend at the LATAM level. The directional facts:\n\n- Most CTV inventory transacts programmatically; across LATAM, more than three-quarters of digital ads were bought programmatically in markets like Peru, Argentina, and Brazil as of 2023 [9].\n- Within Mordor's \"South America programmatic\" frame, **Real-Time Bidding (RTB) held 46.2% of trading in 2024**, with **Private Marketplace / programmatic-guaranteed the fastest-growing at ~14.9% CAGR** through 2030 [6].\n- **Working assumption (inference):** programmatic CTV ≈ 80–90% of total CTV ad spend in the region, skewed toward PMP / programmatic-guaranteed rather than open RTB given premium streaming inventory. This is an analyst estimate, not a sourced figure.\n\n---\n\n## 2. Country-by-Country CTV Detail\n\nBrazil and Mexico are not merely the two largest CTV markets. Jointly, they *are* the market — ~80% of regional CTV ad spend. The other four are real but small.\n\n### 2.1 Country CTV ad-spend share (the dominance picture)\n\n| Country | Share of LATAM CTV ad investment | Source / note |\n|---|---|---|\n| **Brazil** | **~40.6%** | Mordor [6] |\n| **Mexico** | **~39.8%** | Mordor [6] |\n| **Argentina** | **~7.5%** | Mordor [6] |\n| **Colombia** | **~7.2%** | Mordor [6] |\n| **Chile + Peru + rest** | **~5.0%** (residual) | Analyst residual from above |\n\n**Quantifying the dominance:** Brazil + Mexico ≈ **80%** of LATAM CTV ad spend; add Argentina and Colombia and the top four reach ~95%. Chile and Peru together are a low-single-digit slice. This share split rests on a single source (Mordor), but every other lens corroborates it directionally: Brazil's 89M monthly CTV viewers, the largest audience outside the US per Mordor [6], and Brazil's and Mexico's far larger digital ad bases per eMarketer [2][3].\n\n### 2.2 CTV reach and viewers by country\n\nTwo \"penetration\" definitions circulate, and they must not be conflated. **Comscore \"CTV reach\"** = the share of adult internet users who are CTV viewers (a usage metric). **Device-ownership \"CTV penetration\"** (e.g. Mordor's ~94% of CTV devices being smart TVs) = a hardware metric. The reach series below is the most complete per-country public set:\n\n| Country | CTV reach (% of adult internet users) | Est. viewers (millions) |\n|---|---|---|\n| Brazil | 50% (2022) → **64% (2024)** | 65M (2022) → ~89M monthly (2024 est.) |\n| Mexico | 47% (2022) → low-to-mid 60s% (2024) | ~35M |\n| Argentina | 44% (2022) → ~61% (2024) | ~15.6M |\n| Chile | 43% (2022) → ~61% (2024) | ~6.8M |\n| Colombia | 38% (2022) | ~10.7M |\n| Peru | 37% (2022) | ~7.6M |\n| Uruguay | 31% (2022) | ~0.69M |\n\nSources: Comscore 2022 baseline study [10]; Brazil 2024 reach (64%, +14% vs. 2023) via Greenbook/Comscore [11]; Brazil ~89M monthly CTV viewers via Mordor [6]. Regional CTV reach reached ~59% of adults in 2024 (Comscore) [10]. **Caveat:** one 2024/25 reading cites Mexico leading consumption at ~67% reach, conflicting with Brazil's 64%; the discrepancy reflects different survey waves and definitions — report both as \"low-to-mid 60s%.\" Detailed measurement methodology is taken up later, in the chapter on measurement and identity.\n\n### 2.3 Per-country narrative\n\n**Brazil — the anchor market.** The largest CTV ad market in LATAM (~40.6% share); ~89M monthly CTV viewers; CTV reach 64% in 2024 (+14% vs. 2023) [6][11]. Brazil's **digital ad market hit R$42.7 billion in 2025, up 12.7% YoY**, with **video = 49% of digital investment** — the pool CTV is pulling budget into from linear TV (IAB Brasil) [12][13]. eMarketer puts Brazil's CTV ad-spend growth at **23.7%–27.6% YoY**, ahead of global averages [7]. On FAST, Omdia's January-2026 data ranks **Brazil the world's third-largest FAST market by revenue at ~USD 152 million, behind only the US and the UK**, and projects it to climb to **No. 2 (ahead of Canada) by 2029** [4][14]. Brazil-only Globoplay is forecast at **USD 1.6B total revenue by 2029 (USD 0.6B SVOD, USD 1.0B AVOD)** [15]. Roku launched its CTV ad platform in Brazil in October 2025 — the clearest recent signal that programmatic-CTV supply is professionalizing [8].\n\n**Mexico — the close #2.** ~39.8% regional CTV ad-spend share, nearly co-equal with Brazil; ~35M CTV viewers (2022 baseline), reach in the low-to-mid 60s% by 2024/25. Mexico's ad-supported mix lags Brazil's — ad-tier penetration ~38.8% of OTT accounts vs. Brazil's ~51.2% per Dataxis — which implies monetization upside [1]. eMarketer puts Mexico in the same 23.7%–27.6% YoY CTV-growth band as Brazil but flagged **slower 2025 overall growth from US trade/tariff tensions** [2][7]. On FAST usage, Omdia ranks **Mexico the world's heaviest FAST user at ~53% penetration, with Brazil at ~40%** [14].\n\n**Argentina — #3 but FX-impaired.** ~7.5% regional CTV ad-spend share; ~15.6M viewers (2022); CTV reach ~61% (2024). Argentina has the region's **highest YouTube penetration (~90.2%)**, and YouTube-on-CTV viewing time **grew ~44% (Jan–Oct, 2023→2024)** [5]. **Critical headwind:** severe peso devaluation and inflation make USD-denominated ad budgets volatile. eMarketer noted Argentina contracted in 2024 before a 2025 rebound [2][3].\n\n**Colombia — #4.** ~7.2% regional CTV ad-spend share; ~10.7M viewers (2022); CTV reach 38% (2022 baseline, growing). Part of the \"fastest-growing cluster\" (Colombia/Chile/Peru) in South-American programmatic per Mordor [6].\n\n**Chile — small, high-penetration.** ~6.8M viewers (2022); CTV reach 43% (2022) → ~61% (2024), among the highest per-capita penetration in the region despite a small population. eMarketer noted a 2025 rebound supporting regional momentum [2]; Chile and Argentina crossed digital >50% of total media in 2024 [3].\n\n**Peru — smallest of the six.** ~7.6M viewers (2022); CTV reach 37% (2022 baseline). Part of the fast-growing cluster but with less robust overall growth; high programmatic adoption (>75% of digital bought programmatically as of 2023) [3][9].\n\n### 2.4 Consolidated per-country table\n\n| Country | CTV ad-spend share | CTV reach (internet users) | Est. CTV viewers | CTV growth | Key dynamic |\n|---|---|---|---|---|---|\n| **Brazil** | **~40.6%** | 50% (’22) → 64% (’24) | 65M → ~89M | 23.7–27.6% YoY | Anchor; #3 global FAST market (~$152M), → #2 by 2029; Roku ad platform launched Oct 2025 |\n| **Mexico** | **~39.8%** | 47% (’22) → low-mid 60s% | ~35M | 23.7–27.6% YoY | Co-leader; ad-tier mix lags Brazil; heaviest FAST user (~53%); US-trade headwind 2025 |\n| **Argentina** | **~7.5%** | 44% (’22) → ~61% (’24) | ~15.6M | Volatile (FX) | Highest YouTube reach (~90%); peso devaluation drag |\n| **Colombia** | **~7.2%** | 38% (’22) | ~10.7M | Fast-growing cluster | Premium-CTV expansion underway |\n| **Chile** | ~2–3% (residual) | 43% (’22) → ~61% (’24) | ~6.8M | 2025 rebound | High per-capita penetration; digital >50% of media |\n| **Peru** | ~2% (residual) | 37% (’22) | ~7.6M | Fast-growing, smaller | >75% programmatic; smallest of six |\n\n*Share figures: Mordor [6] (a single source). Reach/viewers: Comscore [10] and Greenbook/Comscore [11]. Growth: eMarketer [7]. Chile/Peru shares are analyst residuals.*\n\n---\n\n## 3. Digital Ad-Spend Composition — Where CTV Fits\n\n### 3.1 The format mix (Brazil as the clearest window)\n\nBrazil's IAB publishes a clean public breakdown, the best window into the regional format mix (R$42.7B digital, 2025) [12][13]:\n\n| Format / channel (Brazil 2025) | Share of digital |\n|---|---|\n| **Video** (incl. CTV, social video, VOD) | **49%** |\n| Social media | 55% |\n| Search | 26% |\n| Publishers / content verticals | 19% |\n| Retail media | R$4.8B (+37% YoY) |\n| DOOH | R$4.4B |\n\n*(Channel shares overlap categories — social video is counted in both \"video\" and \"social\" — so they sum past 100%. The load-bearing fact: video is now ~half of Brazilian digital ad spend, and CTV is the fastest-growing slice within video.)* IAB Brasil attributes video's growth to \"the continuous migration of budgets previously destined for linear TV toward VOD, social video, and CTV inventory\" [12].\n\n### 3.2 The YouTube definitional fork (the number that swings 2–3×)\n\nOne question drives the biggest uncertainty in sizing LATAM CTV: **does YouTube-on-the-TV-screen count as \"CTV\"?** Over **45% of YouTube viewing now happens on the TV screen across Argentina, Brazil, and Mexico** [5]. YouTube's digital penetration is ~90.2% in Argentina, ~88.9% in Brazil, and ~73.6% in Mexico [5].\n\n- **Narrow (premium-CTV) definition** — FAST + BVOD + SVOD ad tiers, excluding YouTube: ~**USD 450M** regional (2026, Dataxis) [1].\n- **Broad (all-CTV-inventory) definition** — including YouTube-on-TV: ~**USD 1B+** (analyst triangulation from the ~5%-of-digital read) [5].\n\nThis 2–3× spread is the first number to pin before any sizing exercise. Pick a definition, state it, hold it. Many apparent source conflicts in this market dissolve the moment the definition is fixed.\n\n### 3.3 Streaming subscriber and ad-supported reach (AVOD/FAST/SVOD)\n\n| Metric | Value | Year | Source |\n|---|---|---|---|\n| LATAM SVOD subscriptions | **110M → 116M → 165M** | 2023 → 2026 → 2029 | Digital TV Research [16][17] |\n| — Brazil SVOD subs | **44M → 59M** | 2026 → 2029 | [16][17] |\n| — Mexico SVOD subs | **29M → 43M** | 2026 → 2029 | [16][17] |\n| LATAM OTT episode/movie revenue | **~USD 10B → 17B** | 2023 → 2029 | Digital TV Research [15] |\n| — of the +USD 7B growth: SVOD | **+USD 2.8B** | 2023→2029 | [15] |\n| — of the +USD 7B growth: AVOD | **+USD 3.5B** (AVOD growth outpaces SVOD) | 2023→2029 | [15] |\n| SVOD total revenue | **USD 10.1B** | 2029 | [15] |\n| Top-4 platforms' combined AVOD revenue | **USD 1.5B** | 2029 | [15] |\n| US-based platforms' share of LATAM paying SVOD | **83%** | 2029 | [17] |\n| Installed smart TVs | **163M → 193M** (83.5% connected) | 2024 → 2026 | Dataxis [1][5] |\n| Smart TVs sold in 2026 | **38.9M** | 2026 | Dataxis [1] |\n| Connected-TV households (projection) | **~90% of households** | 2029 | Dataxis [5] |\n| Ad-tier share of OTT subscriptions (region) | **11.7%** | 2025 | Dataxis [1] |\n| Ad-tier share of OTT accounts — Brazil / Mexico | **51.2% / 38.8%** | 2025 | Dataxis [1] |\n| CTV households using AVOD monthly | **95%** (87% multiple times/week) | 2025 | Comscore-derived [5] |\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">LATAM connected-TV supply build-out (millions)<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">50<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">100<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">150<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">200<\/text><rect x=\"110.2\" y=\"59.3\" width=\"56.0\" height=\"190.7\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"138.2\" y=\"53.3\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">163M<\/text><text x=\"138.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 138.2 268.0)\">Smart TVs 2024<\/text><rect x=\"266.8\" y=\"24.2\" width=\"56.0\" height=\"225.8\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"294.8\" y=\"18.2\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">193M<\/text><text x=\"294.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 294.8 268.0)\">Smart TVs 2026<\/text><rect x=\"423.2\" y=\"219.6\" width=\"56.0\" height=\"30.4\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"451.2\" y=\"213.6\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">26M<\/text><text x=\"451.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 451.2 268.0)\">FAST HH 2024<\/text><rect x=\"579.8\" y=\"189.2\" width=\"56.0\" height=\"60.8\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.15s\"/><text x=\"607.8\" y=\"183.2\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">52M<\/text><text x=\"607.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 607.8 268.0)\">FAST HH 2029<\/text><\/svg><figcaption>The audience and ad-supported reach are being built faster than ad budgets can chase them. <span class=\"credit\">Source: Dataxis (smart TVs); Omdia (FAST households), 2024-2029.<\/span><\/figcaption><\/figure>\n\n\n\n**The decisive supply-side fact:** ad-supported viewing is the default, not the niche. AVOD revenue growth outpaces SVOD through 2029 (Digital TV Research), 95% of CTV households use AVOD monthly, and ad tiers already account for ~51% of OTT accounts in Brazil. The inventory exists at scale. The binding constraint is the monetization rate — CPM × fill — not reach.\n\n---\n\n## 4. Growth Drivers and Headwinds\n\n### 4.1 Drivers\n\n1. **A leapfrog, not a cord-cut, story.** LATAM never had high pay-TV penetration to defend. It is going straight from broadcast and low pay-TV to streaming on connected screens, with ~90% of households projected CTV-equipped by 2029 [5]. Supply is being built faster than ad budgets can chase it.\n2. **Cheap hardware accelerating the installed base** toward ~193M smart TVs by 2026 [1].\n3. **A mobile-first audience moving to the big screen** — 45%+ of YouTube viewing already on CTV in the big-three markets [5].\n4. **FAST scaling fast.** Brazil is the world's third-largest FAST market (~USD 152M, behind US and UK) and projected #2 by 2029; Mexico is the heaviest FAST user (~53% penetration) [4][14].\n5. **Ad-tier conversion at the platforms.** SVOD ad tiers expand premium supply; the top-4 platforms' combined AVOD revenue is forecast at USD 1.5B by 2029 [15].\n6. **Programmatic plumbing arriving** — Roku's Brazil ad-platform launch (Oct 2025) and >75% programmatic buying penetration in key markets [8][9].\n\n### 4.2 Headwinds\n\n1. **A low ad-spend base.** The entire LATAM CTV ad market is in the hundreds of millions on the premium definition; Brazil+Mexico (with Italy+Spain) are ~1.25% of global CTV ad spend [7]. Reach is well ahead of revenue.\n2. **FX and macro volatility — acute in Argentina** (peso devaluation; a 2024 contraction) [2][3].\n3. **Mexico's US-trade exposure** tempered 2025 growth [2].\n4. **YouTube dominance compresses premium-CTV pricing** — premium streaming inventory competes against a vast, cheap, walled-garden incumbent [5].\n5. **Measurement and definitional fragmentation** — no single agreed CTV definition or currency (taken up later, in the chapter on measurement and identity).\n\n---\n\n## 5. TAM / SAM / SOM Sizing (Six Focus Countries)\n\n> **Methodology.** Two independent approaches. Top-down derives CTV from the digital-ad-spend total via CTV's share of digital. Bottom-up derives it from connected-screen supply and AVOD yield. All figures are **analyst estimates built on the cited anchors** — not direct source quotes — and carry a wide error band. Currency: USD, 2025 unless noted.\n\n### 5.1 Stated assumptions\n\n| Assumption | Value | Anchor |\n|---|---|---|\n| LATAM digital ad spend, 2025 | ~USD 24–26B | Extrapolated from USD 22.25B (2024) + double-digit growth [3] |\n| Six focus countries' share of LATAM digital | ~90% | BR/MX/AR/CO/CL/PE dominate regional digital |\n| CTV share of digital today | ~5% (premium) / ~7.7% of total ad spend | Broadpeak/Comscore [5]; eMarketer [7] |\n| Programmatic share of CTV | ~85% | Analyst (RTB+PMP dominate) [6] |\n| Country CTV split | BR 40.6 / MX 39.8 / AR 7.5 / CO 7.2 / CL+PE ~5 | Mordor [6] |\n| Regional CTV growth | ~20–27% YoY near-term; ~12.3% CAGR mid-term (programmatic CTV sub-segment) | Mordor [6]; eMarketer [7] |\n\n### 5.2 Top-down and bottom-up\n\n- **TAM (broad, incl. YouTube-on-TV, 2025):** ~USD 25B digital × ~5% CTV × ~90% six-country share ≈ **USD ~1.1B.**\n- **TAM (narrow premium-CTV):** Dataxis ~USD 450M regional (2026) × ~90% six-country share ≈ **USD ~400M.**\n- **SAM (programmatic CTV):** TAM × ~85% = **USD ~340M (narrow) to ~950M (broad).**\n- **SOM (3-yr, focused premium-CTV entrant):** 5–15% capture of the premium, non-YouTube programmatic slice ≈ **USD ~50–150M**, concentrated in Brazil and Mexico.\n- **Bottom-up cross-check:** ~193M smart TVs (2026) × 83.5% connected ≈ ~161M active screens; × ~60% in six-country premium-AVOD-reachable households × ~USD 5 premium-CTV yield/screen ≈ **USD ~480M**, corroborating the Dataxis ~USD 450M narrow anchor [1]. On a broad (~USD 11–13/screen) yield it lands near **USD ~1.1B**, corroborating the top-down broad figure.\n\n### 5.3 Reconciliation and sizing table\n\n| Layer | Narrow (premium CTV) | Broad (incl. YouTube-on-TV) | Basis |\n|---|---|---|---|\n| **TAM** — total CTV ad spend (6 countries, 2025) | **~USD 0.4B** | **~USD 1.1B** | Top-down × bottom-up converge |\n| **SAM** — programmatic CTV (~85%) | **~USD 0.34B** | **~USD 0.95B** | RTB + PMP dominance |\n| **SOM** — 3-yr capture for focused entrant | **~USD 50–150M** | (subset of broad) | 5–15% of premium programmatic, BR+MX-led |\n| **TAM 2028–2030 (~20% CAGR)** | **~USD 0.8–1.2B** | **~USD 2–2.5B** | Compounding near-term/mid-term rates |\n\n**Bottom line on sizing:** the defensible near-term programmatic-CTV opportunity for the six countries is **~USD 0.3–1.0B in 2025** (depending on the YouTube definition), growing to roughly **USD 1–2.5B by 2028–2030.** Brazil and Mexico are ~80% of it. Small today, but the growth is real. This is a market you enter before monetization catches reach.\n\n---\n\n## 6. Confidence Tiers\n\n- **Corroborated across multiple sources (high confidence):** the installed smart-TV base and AVOD-usage supply data (Dataxis, Comscore, Omdia corroborate); the regional total/digital ad market (eMarketer); SVOD subscriber trajectory (Digital TV Research, multiple releases); Brazil's digital-ad total and video share (IAB Brasil, Brazilian trade press).\n- **Resting on a single source or estimate (treat with caution):** the precise per-country CTV ad-spend *share* split (Mordor alone); the ~USD 450M regional CTV-ad figure (Dataxis alone); the ~5%-of-digital practitioner read; the programmatic-share-of-CTV working assumption (analyst inference).\n- **Treat as definitional outlier (do not use as ad spend):** any \"Brazil CTV market = USD 18.5B\" type figure — that sizes a device-and-content ecosystem, not ad spend, and exceeds Brazil's entire digital ad market (~USD 19B). Excluded here.\n\n---\n\n## OPEN QUESTIONS\n\n1. **What is the actual programmatic share of LATAM CTV ad spend?** No public source separates programmatic from total CTV at the regional level; the ~85% figure is an analyst inference.\n2. **Which YouTube definition will the market converge on?** Until IAB chapters and currencies settle whether YouTube-on-TV is \"CTV,\" the headline number stays 2–3× ambiguous.\n3. **What are the precise per-country CTV ad-spend dollars** (not just shares)? eMarketer's Brazil and Mexico CTV charts (2024–2029) are paywalled and would resolve the most load-bearing figures.\n4. **How durable is the AVOD-outpaces-SVOD forecast** given FX volatility and platform pricing changes through 2030?\n5. **Is Roku's Brazil ad platform still operating and scaling** as of mid-2026, and have other platform entries followed? (Confirmed live as of October 2025.)\n6. **What are 2025 CTV CPM benchmarks per country** (taken up later, in the chapter on fraud, inventory quality, and pricing)? CPM × fill is the binding monetization variable and is poorly documented publicly.\n\n---\n\n## SOURCES\n\n1. Dataxis, \"Heading Toward 193 Million Smart TVs: Mapping Connected TV in Latin America,\" May 2026. https://dataxis.com/researches-highlights/1635297/heading-toward-193-million-smart-tvs-mapping-connected-tv-in-latin-america/ — Tier 5 (analyst house). Narrow-CTV regional ad-revenue anchor (~USD 450M, 2026); installed base; ad-tier shares. Accessed 2026-06-17.\n2. eMarketer (EMARKETER), \"Latin America Ad Spending 2025.\" https://www.emarketer.com/content/latin-america-ad-spending-2025 — Tier 5. Total market >USD 40B (2025); digital 56.6%; country growth/headwind notes. Accessed 2026-06-17.\n3. eMarketer, \"Latin America Ad Spending 2024.\" https://www.emarketer.com/content/latin-america-ad-spending-2024 — Tier 5. LATAM digital USD 22.25B (2024); Argentina contraction; Chile/Argentina digital >50%. Accessed 2026-06-17.\n4. Omdia, \"Advertising and bundling to push Latin America media revenues to USD 65 billion by 2026,\" Jan 2026 (via Omdia press / Business Wire / Broadband TV News). https://omdia.tech.informa.com/pr/2026/jan/advertising-and-bundling-to-push-latin-america-media-revenues-to-65-billion-dollar-by-2026 ; https://www.broadbandtvnews.com/2026/01/21/omdia-latam-media-revenues-tipped-to-reach-65bn-in-2026/ — Tier 5. USD 65B media by 2026, ~10.7%/yr; FAST rankings. Accessed 2026-06-17.\n5. Broadpeak, \"Latin America Trends 2025: 5 Key Takeaways,\" 2025 (Comscore-derived figures). https://broadpeak.tv/blog/latin-america-trends-2025-5-key-takeaways-latam/ — Tier 5. CTV ~5% of digital; 95% AVOD monthly; YouTube-on-TV 45%+; YouTube penetration by country. Accessed 2026-06-17.\n6. Mordor Intelligence, \"South America / Latin America Programmatic Advertising Market,\" 2025. https://www.mordorintelligence.com/industry-reports/latin-america-programmatic-advertising-market — Tier 5. USD 70.22B (2025) → 116.12B (2030); RTB 46.2%; CTV 12.3% CAGR; country shares; Brazil 89M monthly CTV viewers. **The sole source for the country-share split.** Accessed 2026-06-17.\n7. eMarketer, \"4 CTV ad spend trends to track in 2025\" / Mexico CTV forecasts. https://www.emarketer.com/content/4-ctv-ad-spend-trends-track-2025 — Tier 5. CTV ~20.2% of time vs ~7.7% of ad spend (2025); Brazil/Mexico 23.7–27.6% YoY; ~1.25% of global CTV (BR+MX+IT+ES). Accessed 2026-06-17.\n8. Roku, \"Roku Unlocks Millions of Viewers in Brazil…\" (CTV ad platform launch), Oct 2025. https://newsroom.roku.com/news/2025/10/roku-unlocks-millions-of-viewers-in-brazil-as-part-of/2klcvhbl-1760474071 — Tier 1 (corporate announcement; evidence of what Roku claims, paired with TheDesk coverage). Going-concern: confirmed live Oct 2025. Accessed 2026-06-17.\n9. Statista, \"Programmatic advertising spending Latin America\" / \"Top programmatic markets Latin America 2026.\" https://www.statista.com/statistics/1316177/programmatic-advertising-spending-latin-america/ ; https://www.statista.com/forecasts/1310921/programmatic-ad-spend-latin-america/ — Tier 5. USD 16.77B (2023) → 23.6B (2028); >75% programmatic in key markets. Accessed 2026-06-17.\n10. Comscore, \"Brasil, México y Argentina lideran en la adopción de Connected TV\" (2022 study). https://www.comscore.com/Insights/Blog/Brasil-Mexico-y-Argentina-lideran-en-la-adopcion-de-Connected-TV — Tier 5 (Spanish-language; non-Anglophone source). Per-country CTV reach baseline; regional 59% (2024). Accessed 2026-06-17.\n11. Greenbook / Comscore, \"An Opportunity in the Middle of the Living Room: The Adoption of CTV in Brazil.\" https://www.greenbook.org/insights/focus-on-latam/an-opportunity-in-the-middle-of-the-living-room-the-adoption-of-ctv-in-brazil — Tier 5. Brazil 64% reach (2024, +14% vs 2023). Accessed 2026-06-17.\n12. Conversion (citing IAB Brasil), \"Publicidade digital cresce 12,7% e soma R$ 42,7 bilhões no Brasil em 2025.\" https://www.conversion.com.br/blog/iab-brasil-publicidade-digital-42-bilhoes-2025/ — Tier 5 (cites Tier 1 IAB Brasil data; Portuguese-language). R$42.7B digital; video 49%; retail R$4.8B; DOOH R$4.4B. Accessed 2026-06-17.\n13. Meio & Mensagem, \"IAB: publicidade digital atinge R$ 42,7 bilhões em 2025.\" https://www.meioemensagem.com.br/midia/iab-publicidade-digital-atinge-r-427-bilhoes-em-2025 — Tier 5 (Brazilian trade press; corroborates [12]). Accessed 2026-06-17.\n14. Omdia via Variety, \"Brazil Emerges as FAST Streaming Powerhouse,\" May 2025; Content Americas Jan 2026 update. https://variety.com/2025/film/global/rio2c-omdia-fast-channels-omdia-rio-keynote-2025-1236410608/ — Tier 5. FAST rankings; Mexico ~53% / Brazil ~40% usage; Brazil → #2 by 2029. Accessed 2026-06-17.\n15. Digital TV Research via Media Play News, \"Latin America AVOD Revenue Growth to Top SVOD by 2029.\" https://www.mediaplaynews.com/digital-tv-research-latin-america-avod-revenue-growth-to-top-svod-by-2029/ — Tier 5. OTT USD 10B→17B; AVOD +3.5B vs SVOD +2.8B; SVOD 10.1B (2029); Globoplay 1.6B; top-4 AVOD 1.5B. Accessed 2026-06-17.\n16. Media Play News / Digital TV Research, \"Latin America to Have 116 Million SVOD Subs by 2026.\" https://www.mediaplaynews.com/report-latin-american-to-have-116-million-svod-subs-by-2026/ — Tier 5. 116M (2026); Brazil 44M; Mexico 29M. Accessed 2026-06-17.\n17. Digital TV Research via Media Play News / GlobeNewswire, \"165 Million SVOD Subs by 2029.\" https://www.mediaplaynews.com/digital-tv-research-netflix-to-spearhead-latin-america-topping165-million-svod-subs-by-2029/ — Tier 5. 165M (2029); Brazil 59M; Mexico 43M; US platforms 83%. Accessed 2026-06-17.\n\n---\n\n*Figures are dated where the source dates them; where a source gives no year, the retrieval date (June 2026) governs. Confidence tiers and definitional caveats are stated inline — read them.*"}, {"order": 3, "file": "03_Supply_Demand_Ecosystem.md", "title": "LATAM Programmatic CTV — The Supply & Demand Ecosystem", "summary": "", "body": "# LATAM Programmatic CTV — The Supply & Demand Ecosystem\n\n## BOTTOM LINE\n\nThe Latin American connected-TV (CTV) supply side is **broad but shallow and badly fragmented**. Nearly every global free-ad-supported-streaming-TV (FAST) and ad-supported-video-on-demand (AVOD) platform now operates in the region — Pluto TV across roughly 18 countries, Samsung TV Plus, LG Channels, The Roku Channel, Tubi, Amazon's Prime Video ad tier, and an overwhelmingly large YouTube. They sit alongside a thick layer of broadcaster on-demand (Globo's Globoplay, TelevisaUnivision's ViX) and telco/pay-TV streaming (Claro, Vivo Play, DirecTV GO/SKY via Vrio, Flow in Argentina). The result is a household reachable a dozen ways with no shared identifier. Fragmentation is the single defining fact of the supply side, and it is the main reason most premium inventory still trades through private marketplaces (PMP) and programmatic-guaranteed (PG) deals rather than the open exchange.\n\nThe **sell-side intermediary layer** is unusually device-app-shaped. Pixalate's most recent LATAM measurement (Q3 2025) shows **OpenX leading multiple CTV device platforms in Mexico** (47% on Roku, top on Samsung Smart TV at 29%), with **TripleLift** and **Magnite** the other recurring names; earlier 2024 data had Google AdExchange leading region-wide at ~20% with Beachfront and Magnite tied near 14%. Broadcasters run their own marketplaces — Globo's GAMA, built on Microsoft Monetize tech with DoubleVerify as data partner; ViX scaled through Magnite — while a rotating set of SSPs monetizes the OEM/device apps. No single SSP owns the region.\n\nOn the **demand side**, three buying platforms do most of the heavy lifting — **Google DV360**, **The Trade Desk**, and a fast-rising **Amazon DSP**, which since Q4 2025 has been the programmatic conduit into Netflix's ad inventory in Brazil, Mexico, and nine other markets. All three run overwhelmingly as **managed service** through holding-company trading desks and a tail of independents, because certified-trader talent is thin and clustered in a handful of metros. The most consequential shift is the **convergence of retail media into CTV**. Mercado Ads — roughly 60% of LATAM retail-media spend — added Roku and HBO Max to its CTV network at its 2025 upfront, alongside Disney+ and its own Mercado Play, turning the region's largest retailer into a de-facto CTV demand aggregator armed with closed-loop purchase data. Two recent events reshaped the intermediary map. **Microsoft shut down its Invest DSP (the former Xandr/AppNexus buy-side) on February 28, 2026**, thinning the independent-DSP field, and **MiQ agreed to acquire Adsmovil's LATAM business in March 2026**, consolidating the largest independent managed-programmatic/retail-media/data offering in the region. Both are treated below as dated, present-tense facts, not background.\n\n---\n\n## 1. SUPPLY — Who owns ad-supported CTV inventory in LATAM\n\n### 1.1 The shape of the supply side\n\nLATAM CTV supply stacks into five layers, and a buyer typically touches all five to assemble reach:\n\n1. **YouTube / Google TV** — by far the largest single source of ad-supported streaming time in the region, bought through Google's own stack (a walled garden).\n2. **Global FAST / AVOD platforms** — Pluto TV, Samsung TV Plus, LG Channels, The Roku Channel, Tubi, and Amazon's Prime Video ad tier.\n3. **Broadcaster on-demand (BVOD) and broadcaster FAST** — Globo (Globoplay), TelevisaUnivision (ViX), Caracol/RCN (Colombia), TV Azteca, SBT, Record, Telefe, Mega/Chilevisión, Latina/América TV (Peru).\n4. **Telco / pay-TV operator streaming** — Claro video & Claro TV+, Vivo Play (Telefônica), DirecTV GO + SKY Brasil (Vrio), Flow (Telecom Argentina), Totalplay/Izzi (Mexico), Zapping (Chile).\n5. **Retail-media-led CTV** — Mercado Play (Mercado Libre), increasingly a CTV demand-and-supply hybrid.\n\nTwo facts shape everything downstream. First, consumption is **smart-TV-centric** — in the FAST/AVOD context, viewing concentrates on the TV set rather than mobile, which puts device-OEM platforms (Samsung, LG, Roku) and their automatic-content-recognition (ACR) data at the center. Second, **Brazil is the anchor market**. Omdia projects Brazil to become the world's **third-largest FAST market by 2029**, behind only the United States and the United Kingdom, with FAST revenue roughly tripling from ~$119M (2024) to ~$303M (2029) [4][13]. (Note: a separate Variety/Omdia framing from the 2025 Rio2C keynote described Brazil as set to become the No. 2 *international* FAST market, overtaking Canada — the \"third overall / second international\" wording is a framing difference, not a contradiction; both trace to Omdia [4][13].)\n\n### 1.2 Global FAST / AVOD platforms in LATAM\n\n| Platform (owner) | LATAM footprint | Ad model | Sell-side path | Status note |\n|---|---|---|---|---|\n| **Pluto TV** (Paramount) | ~18 countries incl. Brazil + ~17 Spanish-speaking markets | FAST | Historically programmatic via SpotX (now Magnite); launch partners included Telaria, SpotX, Column6, Smart AdServer (now Equativ) | First-mover regional FAST; deep Spanish-language catalog [1][2] |\n| **Samsung TV Plus** | Among the leading FAST services in Brazil | FAST + ACR-driven addressable | Samsung ad sales + SSP partners; ACR is the differentiator | Among top-10 most-watched video platforms in Brazil per Omdia [4][13] |\n| **LG Channels** | Present and growing in Brazil/region | FAST | LG ad solutions + SSPs | OEM-owned, ACR-capable; named by Omdia among LATAM FAST drivers [13] |\n| **The Roku Channel / Roku OS** | **CTV ad platform launched in Brazil Oct 15, 2025**; present in Mexico | FAST + Marquee home-screen + in-stream | Direct or via **25+ authorized partners incl. Mercado Ads and SBT**; proprietary IDs | Added 30 FAST channels to BR Live TV Guide in 2025; Brazil named a priority market [3][5][6][7] |\n| **Tubi** (Fox) | Mexico (since 2020) and several Central American markets | AVOD | Fox/Tubi stack | Spanish-language expansion |\n| **Prime Video ads / Amazon** | Ad tier live; region-wide | Ad-tier + AVOD | Amazon Publisher Services (supply) | Pairs with Amazon DSP on demand side; see §3 [8][9] |\n| **YouTube / Google TV** | Region-wide dominance | In-stream / TV ads | Google Ad Manager | Largest single ad-supported streaming surface; walled garden |\n\n**Infrastructure layer.** A handful of B2B vendors quietly carry much of this supply. **Sofa Digital**, a key Brazilian FAST channel aggregator, curates indie and film content into channels distributed across Samsung TV Plus, LG Channels, TCL Channels, Pluto TV, and Roku [3]. **Amagi** is the dominant cloud playout and monetization layer behind several regional FAST launches (see §1.3, Globo and Caracol) [10][14].\n\n### 1.3 Regional broadcasters & telco/pay-TV streaming\n\n| Owner | Property | Type | Sell-side posture | Status note |\n|---|---|---|---|---|\n| **Globo** (BR) | Globoplay, G1, Ge, FAST channels | BVOD + FAST | **GAMA Ad Marketplace** — built on Microsoft Monetize tech, Globo first-party data on 140M+ consumers, DoubleVerify as strategic data/verification partner; six FAST channels via Amagi + AD Digital | GAMA live and described as data-driven programmatic platform as of 2025 [10][11][12] |\n| **TelevisaUnivision** (MX/US) | **ViX** (free AVOD + premium-with-ads) | BVOD/AVOD | **Magnite** scales programmatic across ViX + vMVPD (open exchange + PMP + always-on); household graph / first-party data | ViX disclosed 50M global MAU; Ampere forecasts ~60% of 2025 ViX revenue from advertising [8][15] |\n| **Vrio** (DIRECTV Latin America) | **DirecTV GO (DGO)**, **SKY Brasil** | Pay-TV streaming | **Magnite** powers direct + programmatic; **SpringServe** ad server + server-side ad insertion (SSAI) | Partnership confirmed; tripled DGO ad volume during Copa América 2024; extended into 2025 live-streaming demand work [16] |\n| **Caracol Televisión** (CO) | Caracol Mix + FAST | Broadcaster FAST | **Amagi** cloud playout + monetization | Confirmed Amagi partnership [14] |\n| **RCN** (CO) | Canal RCN live/VOD | Broadcaster | Streaming live signal; programmatic nascent | Programmatic-CTV status thinly confirmed |\n| **Telecom Argentina** | **Flow** / Flow Flex | Pay-TV + streaming | Operator inventory; addressable potential | Flow Flex streaming-only tier launched |\n| **Claro** (América Móvil) | **Claro video, Claro TV+** | Telco OTT / pay-TV | Operator-controlled inventory across multiple countries | Multi-country operator footprint |\n| **Telefônica** | **Vivo Play** (BR) | Telco OTT | Operator inventory | Programmatic-CTV status thinly confirmed |\n| **Mega / Chilevisión** (CL); **Zapping** | Mega, CHV live/VOD; Zapping vMVPD (100+ HD channels) | Broadcaster + independent vMVPD | Zapping carries CHV/Mega/TVN/Canal 13 via direct deals | — |\n| **Latina / América TV** (PE) | Broadcaster live/VOD | Broadcaster | Programmatic nascent | Programmatic-CTV status thinly confirmed |\n| **TV Azteca / SBT / Record / Telefe** | Various BVOD | Broadcaster | Mixed; SBT is a named Roku Brazil authorized partner | SBT named by Roku [3][5] |\n\nA note on the telco and minor-broadcaster rows: several are flagged because the only confirmation that the *streaming* product currently runs programmatic ad inventory traces to a single outlet rather than a fresh primary announcement. The *existence* of Flow, Claro video, Vivo Play, and the broadcasters is well established; the live programmatic-CTV status of some rests on thinner ground, and should be read that way.\n\n### 1.4 Per-country supply snapshots\n\n**Brazil (anchor market).** The deepest and most plumbed market in the region. Samsung TV Plus and LG Channels lead global FAST, with Pluto TV, Tubi, and — since October 2025 — a fully launched Roku ad platform [3][5]. Sofa Digital aggregates channels and Amagi handles playout [3][10]. Globo, through Globoplay and the GAMA marketplace, is the gravitational center of premium broadcaster supply [10][11][12], with SBT, Record, and Band also fielding FAST channels. Telco/pay-TV streaming runs through Vivo Play, Claro, and SKY Brasil + DGO via Vrio [16]. Mercado Play headquarters its retail-media-CTV play here. And Omdia's third-largest-FAST-by-2029 call is, above all, a Brazil call [4][13].\n\n**Mexico.** TelevisaUnivision's **ViX** is the flagship AVOD/BVOD [8][15]; TV Azteca, Grupo Imagen, and Multimedios add broadcaster supply. Pay-TV/addressable supply anchors on SKY, Dish, Totalplay, and Izzi. Global FAST — Tubi (since 2020), Pluto TV, Samsung TV Plus, Roku, LG Channels — is well represented. Pixalate's Q3 2025 LATAM measurement is Mexico-and-Brazil-focused, and on the Mexican device-app CTV layer **OpenX leads Roku (47%) and Samsung Smart TV (29%), with TripleLift and Magnite the other recurring names** [17].\n\n**Colombia.** Caracol (Caracol Mix FAST via Amagi) and RCN dominate domestic supply [14]; Canal 1 is a third broadcaster. Telco/pay-TV supply runs through Claro and DirecTV GO. Global FAST (Pluto TV, Samsung TV Plus, LG Channels) is present. Falabella Media anchors the retail-media intersection across CO/CL/PE. Mercado Ads's 2025 CTV partnerships explicitly extend to Colombia [18].\n\n**Argentina.** **Flow** (Telecom Argentina) is the central operator OTT, with DirecTV GO alongside. Broadcaster supply runs through Telefe (Paramount-owned) and El Trece. Global FAST is present (Pluto TV, Samsung TV Plus). Argentina is one of Adsmovil's core managed-service markets and now part of MiQ's 12-market LATAM footprint post-acquisition [25][26]. Mercado Ads's CTV network extends here [18].\n\n**Chile.** **Zapping** is the standout independent streaming-pay-TV aggregator (100+ HD channels, direct deals with Chilevisión and others). Broadcaster supply: Mega, Chilevisión (Paramount), TVN, Canal 13. Pay-TV: VTR (largest cable), DirecTV GO. Falabella headquarters its retail-media operation in Chile.\n\n**Peru.** The thinnest programmatic plumbing of the six. Broadcaster supply: Latina, América TV, ATV. Telco/pay-TV: Claro, Movistar/Vivo, DirecTV GO. Global FAST (Pluto TV, Samsung TV Plus) is present but lightly monetized programmatically. Falabella Media is the retail-media layer. Peru is in MiQ's post-Adsmovil 12-market footprint [25][26].\n\n---\n\n## 2. SELL-SIDE PLATFORMS (SSPs) & AD-TECH INTERMEDIARIES\n\n### 2.1 The measurement problem, then the league table\n\nLATAM CTV SSP share is best read from **Pixalate**, whose quarterly device-app measurement is the most concrete public ranking — but it carries a structural caveat. Pixalate counts impressions surfaced in store apps on Roku, Fire TV, Samsung, and Apple TV; it therefore **under-weights YouTube/Google-owned supply and broadcaster-direct marketplaces** that never surface as device-store apps. Read the numbers as a map of the *device-app* layer, not the whole market.\n\n**Q1 2024 (region-wide CTV):** Google AdExchange led LATAM at ~20%, with Beachfront and Magnite tied at ~14%, Xandr Monetize (now Microsoft Monetize) ~13%, and OpenX ~10% (Pixalate Q1 2024).\n\n**Q3 2025 (Mexico CTV, the most recent device-app cut):** the picture shifted materially toward **OpenX and TripleLift** [17]:\n\n| Device platform (Mexico) | #1 | #2 | #3 |\n|---|---|---|---|\n| Roku | OpenX (47%) | TripleLift (20%) | Magnite (11%) |\n| Amazon Fire TV | TripleLift (43%) | OpenX (35%) | Magnite (10%) |\n| Samsung Smart TV | OpenX (29%) | TripleLift (27%) | Google AdExchange (22%) |\n\n*Source: Pixalate Q3 2025 LATAM SSP report. Device-app-measured; a Brazil CTV breakout was not provided in this cut.*\n\nThe headline read is **volatility**. The device-app sell-side leaderboard moved sharply between Q1 2024 and Q3 2025: OpenX and TripleLift rose on Mexican CTV device apps while Beachfront and Equativ fell out of the CTV-specific top three (though Seedtag — which acquired Beachfront in 2024 — still ranked on the web layer) [17]. The churn is itself a finding. The LATAM sell-side is not yet settled, and any single quarter's ranking is a snapshot, not a structure.\n\n### 2.2 Who sits where on the sell-side\n\n| SSP / intermediary | LATAM CTV posture | Status note |\n|---|---|---|\n| **Google Ad Manager / AdX** | Region-wide leader by 2024 measure; powers YouTube/Google TV plus a long publisher tail; ranked #3 on Samsung Smart TV in MX (22%) in Q3 2025 | Live [17] |\n| **OpenX** | Leads multiple Mexican CTV device platforms in Q3 2025 (Roku 47%, Samsung 29%, Fire TV 35%) | Live, ascendant [17] |\n| **TripleLift** | #1 on MX Fire TV (43%), strong on Roku/Samsung in Q3 2025 | Live, ascendant [17] |\n| **Magnite** (incl. SpringServe ad server) | Marquee broadcaster/streaming book: **ViX/TelevisaUnivision**, **Vrio (DGO/SKY)**; positions as largest independent SSP; consistently #3 on MX CTV device apps in Q3 2025 | Live; ViX + Vrio relationships confirmed 2025 [8][15][16][17] |\n| **Beachfront / Seedtag** | Tied #2 region-wide in 2024; STB/VOD/CTV + PMP curation; **acquired by Seedtag (2024)** | Beachfront brand absorbed into Seedtag; not in MX CTV top-3 by Q3 2025 [17] |\n| **Microsoft Monetize** (ex-Xandr Monetize) | ~#4 region-wide in 2024; **powers Globo's GAMA marketplace tech** | **Monetize SSP retained** even as Microsoft killed its Invest DSP — explicitly confirmed [10][22][23] |\n| **Equativ / smartclip** (merged) | Strong on OEM/device apps; smartclip full-stack for broadcasters; smartclip historically in Globo ads.txt | Live but not in MX CTV top-3 in Q3 2025 [17] |\n| **FreeWheel** (Comcast) | Broadcaster-grade video/CTV SSP with PG support | LATAM specifics thinly confirmed |\n| **Adsmovil** (acquired by MiQ, Mar 2026) | LATAM-focused supply + retail-media network (Linki) + data (Adsmovil Personas); ground teams across the region | **Now part of MiQ LATAM**; Sigma platform launch in LATAM planned May 2026 [25][26] |\n\n**Read:** the sell-side splits three ways — (a) **OEM/device apps**, where Pixalate measures OpenX, TripleLift, Magnite, and Google; (b) **broadcaster-direct marketplaces** (Globo's GAMA on Microsoft Monetize tech; ViX on Magnite); and (c) the **independent data/retail layer**, now consolidating into MiQ via Adsmovil. No single SSP owns the region. Curation and direct integrations are the battleground.\n\n---\n\n## 3. DEMAND — DSPs and buying platforms\n\n### 3.1 The buying triad and the recent reshaping\n\n| Buying platform | LATAM CTV role | Buying model | Status note |\n|---|---|---|---|\n| **Google DV360** | Lead position via the integrated Google stack (DV360 + Ad Manager + CM360); default for YouTube/Google TV and broad open/PMP CTV | Managed + self-serve | Live |\n| **The Trade Desk** | Premium CTV planner of choice; broad premium-publisher access; positioned on transparency/flexibility; runs through agency seats and independents | Self-serve (agency seats) | Live |\n| **Amazon DSP** | Fastest-growing; commerce/first-party-data edge; **the programmatic conduit into Netflix's ad inventory** | Managed + self-serve | **Netflix–Amazon partnership confirmed Sep 10, 2025; live in 11 markets incl. Brazil and Mexico from Q4 2025; expanded with Amazon Audiences in Q2 2026** [8][9] |\n\n**The two reshaping events.** First, **Microsoft shut down its Invest DSP — the buy-side once known as Xandr and before that AppNexus — effective February 28, 2026** (announced May 14, 2025), replacing it with a Copilot-driven conversational buying product. Crucially, **the Monetize SSP and Curate were retained and continue to operate** [22][23]. The closure removes one independent buy-side option and pushes that demand toward DV360, The Trade Desk, Amazon DSP, and Yahoo. Second, Netflix inventory that had been closed to programmatic became **buyable through Amazon DSP from Q4 2025** across 11 markets including Brazil and Mexico, with the integration deepening via Amazon Audiences targeting in Q2 2026 [8][9] — a major new premium-demand pathway.\n\n**Supporting / legacy / local demand:** Yahoo DSP, Adform (EU independent, present in LATAM), and Viant (US, CTV-heavy) round out the independent buy-side. The **MiQ Sigma** platform — to be supercharged by Adsmovil's data (Personas) and retail-media platform (Linki) following the March 2026 acquisition — is positioned as the leading *independent managed* demand engine, with MiQ describing the combined entity as the largest independent programmatic offering in LATAM across 12 markets and a planned LATAM Sigma launch in May 2026 [25][26].\n\n### 3.2 How demand transacts — managed vs. self-serve\n\n- **Managed service dominates.** Advanced buying and data-science talent sits in a few metros (São Paulo, Mexico City, Bogotá, Buenos Aires), and certifications on the major DSPs take months to secure. The practical effect: an agency desk or a managed independent **executes most CTV budgets for the advertiser**, rather than the brand self-serving them.\n- **Self-serve** exists for sophisticated advertisers and via broadcaster marketplaces (GAMA offers both self-service and integrated/consulting models), but is the minority path [10].\n- **Direct + PMP first.** Premium broadcaster and OEM supply is bought predominantly via PMP and programmatic-guaranteed, with the open exchange used for scale and the long tail (see §6).\n\n---\n\n## 4. AGENCIES — How holding companies and independents transact CTV\n\n| Agency group | LATAM CTV transaction posture | Status note |\n|---|---|---|\n| **GroupM (WPP Media)** | **GroupM Premium Marketplace (GPM)** expanded to LATAM (Dec 2024, with PubMatic): a unified, curated supply path for CTV + video + display with supply-chain transparency | Confirmed Dec 2024 expansion |\n| **Publicis Media** | Precision trading desk; centralized programmatic; strong in BR/MX | Thinly confirmed |\n| **Dentsu** | dentsuX / Amnet trading-desk legacy; regional programmatic teams | Thinly confirmed |\n| **Omnicom Media Group** | OMG trading desk (the Omnicom–IPG combination reshapes group scale — taken up in the players-and-competition chapter) | Thinly confirmed |\n| **IPG Mediabrands** | Cadreon/Kinesso legacy desk | Thinly confirmed |\n| **Independents** | Regional shops plus **MiQ (now + Adsmovil)** as the largest independent managed-programmatic offering | MiQ/Adsmovil confirmed Mar 2026 [25][26] |\n\n**Pattern:** holding companies route CTV through **curated, group-level premium marketplaces** (GPM the clearest example) to fight fragmentation and protect transparency, then layer brand-direct PMPs with the big broadcasters and OEMs. Independents differentiate on **managed service plus proprietary data and IDs on the ground**. The holding-company-desk rows are flagged because the specific *LATAM CTV* posture of each group rests on thin public footing; the existence and general programmatic capability of these desks is well established.\n\n---\n\n## 5. ADVERTISER VERTICALS & DEMAND DYNAMICS\n\n### 5.1 Who spends\n\nThe LATAM CTV advertiser base mirrors the global pattern with regional skews:\n\n- **CPG / retail** — the anchor verticals, amplified by retail-media convergence (§5.2). Retail/e-commerce is the single largest programmatic vertical in South America (Mordor Intelligence).\n- **Telco** — heavy spenders (and themselves inventory owners), defending share in a competitive market.\n- **Auto and finance** — growing CTV adopters, consistent with the global trend.\n- **Pharma and travel** — lighter but present.\n- **Gaming / sports betting** — a large and now-constrained category. On **May 29, 2025 the Brazilian Senate approved sweeping betting-ad restrictions**: betting ads on TV/streaming/online permitted **only 7:30pm–midnight**, **banned during live sports broadcasts** (with narrow 15-minute pre/post windows), **no celebrities, influencers, or active athletes** (only athletes retired 5+ years), and print banned outright. Analysts project a **15–20% decline in legal-operator revenue by 2026**, and 50+ football clubs warned of a ~R$1.6B (~US$285M) annual hit; the bill then moved to the Chamber of Deputies [19][20][21]. Because betting had been a top CTV/streaming spender, this materially re-weights the demand mix toward CPG/retail/finance/telco.\n\n### 5.2 Retail media × CTV — the defining demand dynamic\n\nThis is the most important demand story for the region:\n\n- **Mercado Libre / Mercado Ads** concentrates roughly **60% of LATAM retail-media spend** per eMarketer's 2025 forecast; in Q3 2025 Mercado Ads reported 56% USD growth in ads with Display & Video nearly doubling year-over-year [18].\n- At its **2025 upfront, Mercado Ads announced CTV partnerships with HBO Max and Roku**, adding to existing Disney+ and Mercado Play integrations — and these CTV partnerships **extend beyond Brazil to Argentina, Colombia, and Mexico** [18]. Entering 2026, Mercado Ads explicitly positions itself as a **full-funnel media platform** (on-site + off-site + CTV/streaming) rather than \"marketplace media,\" with closed-loop attribution (exposure → marketplace purchase / Mercado Pago transaction) as the pitch [18].\n- **Magalu (Magazine Luiza)**, **Falabella Media** (CL/PE/CO), **GPA Media**, and **VTEX** (closed-loop checkout data) round out the field.\n\n**Implication:** in LATAM the retailer is becoming a **CTV demand aggregator** — buying premium streaming inventory wholesale and reselling it to endemic and non-endemic brands with first-party purchase data attached. That differs sharply from the US market, and it is the region's highest-velocity demand source.\n\n---\n\n## 6. INVENTORY DYNAMICS — how it actually trades\n\n### 6.1 Deal-type mix (PG/PMP vs. open auction)\n\n- **Open RTB still leads by volume, but PMP is growing fastest.** In South-American programmatic broadly, real-time bidding holds roughly 46% share while PMPs are the fastest-growing trading platform (Mordor Intelligence).\n- **For premium CTV specifically the mix tilts hard to PMP/PG.** Broadcaster marketplaces (ViX on Magnite, Globo's GAMA) lead with programmatic-guaranteed and private deals and use the open exchange only for the tail [8][10][15]. Device-OEM and STB strategies built on PMP curation have shown most premium revenue flowing through private deals rather than open auction.\n- **Programmatic guaranteed is the workhorse for tentpole/live.** Vrio's Magnite-powered DGO stack tripled ad volume during Copa América 2024, and the 2025 DIRECTV–Magnite work specifically targets matching programmatic demand to real-time live-traffic surges [16].\n\n### 6.2 Fragmentation, fill, and quality\n\n- **Fragmentation is the core constraint.** No universal cross-app identifier exists; the same household catches duplicate ads across parallel platforms; bid requests run signal-poor. The result depresses targeting quality, and it is why curation and PMP win (the measurement and identity dimension is taken up later, in the chapter on measurement and identity).\n- **Fill rates** at the premium tier are constrained by upfront/PG hoarding, while long-tail FAST inventory remains abundant — a two-speed supply picture.\n- **BVOD vs. FAST vs. telco.** Broadcaster on-demand (Globo, ViX, Caracol) is the premium, brand-safe, PG/PMP-first tier; global FAST/OEM (Samsung, LG, Pluto, Roku) provides scale plus ACR-based addressability; telco/pay-TV streaming (Claro, Flow, DGO/SKY, Totalplay/Izzi) adds operator first-party data and addressable potential. The winning buy stitches all three via curated deals.\n- **Mobile is the on-ramp.** Younger audiences are smartphone-first; programmatic CTV grew off a mobile base, and the practical entry path into LATAM CTV runs through mobile-extended identity (AdExchanger).\n\n---\n\n## 7. CONSOLIDATED PRESENT-TENSE STATUS TABLE\n\nEvery row below is a present-tense status claim with its freshest dated confirmation. Rows without a recent dated source are flagged.\n\n| Entity / product | Status as of mid-2026 | Freshest dated confirmation |\n|---|---|---|\n| Roku CTV ad platform, Brazil | **Live** | Launched Oct 15, 2025 [3][5] |\n| Netflix inventory via Amazon DSP (BR/MX +9) | **Live** | Partnership Sep 10, 2025; Q4 2025 availability; Q2 2026 Amazon Audiences [8][9] |\n| Microsoft Invest DSP (ex-Xandr buy-side) | **Shut down** | Closed Feb 28, 2026 [22][23] |\n| Microsoft Monetize SSP / Curate | **Retained / live** | Confirmed retained May 2025 [22][23] |\n| MiQ + Adsmovil LATAM | **Acquisition agreed** | Announced Mar 25, 2026; Sigma LATAM launch planned May 2026 [25][26] |\n| Globo GAMA marketplace | **Live** | Described as active data-driven programmatic platform, 2025 [10][11][12] |\n| ViX (TelevisaUnivision) on Magnite | **Live** | 50M global MAU; ~60% ad revenue (Ampere) 2025 [8][15] |\n| Vrio (DGO/SKY) on Magnite/SpringServe | **Live** | Copa América 2024; 2025 DIRECTV–Magnite live-streaming work [16] |\n| Mercado Ads CTV (HBO Max, Roku, Disney+, Mercado Play) | **Live** | 2025 upfront; BR/AR/CO/MX [18] |\n| Brazil betting-ad restrictions | **Senate-approved, in Chamber** | May 29, 2025 Senate vote; bill in Chamber of Deputies [19][20][21] |\n| Beachfront brand | **Absorbed into Seedtag** | Seedtag acquisition 2024 |\n| Pixalate Mexico CTV SSP leaders | **OpenX/TripleLift/Magnite** | Q3 2025 [17] |\n\n---\n\n## OPEN QUESTIONS\n\n1. **Brazil CTV SSP share.** Pixalate's most recent (Q3 2025) CTV-specific cut covers Mexico device apps; a Brazil CTV-specific SSP ranking for the same quarter was not located. The 2024 region-wide ranking (Google/Beachfront/Magnite) and the Q3 2025 Mexico ranking (OpenX/TripleLift/Magnite) diverge enough that Brazil cannot be assumed to mirror Mexico.\n2. **Why OpenX and TripleLift surged on Mexican CTV device apps** between Q1 2024 and Q3 2025 — whether this reflects new direct integrations, header-bidding wrapper changes, or measurement-coverage shifts at Pixalate — is unexplained by the public reports.\n3. **Live programmatic status of second-tier telco/broadcaster streaming.** Whether Vivo Play, Claro video, RCN, Latina, and América TV currently carry *programmatic* CTV ad inventory (versus direct-sold or non-ad) is single-sourced or inferred; primary confirmation is missing.\n4. **PG/PMP-vs-open split, quantified.** A clean LATAM-CTV-specific deal-type percentage breakdown (as opposed to all-programmatic or US-blended figures) was not located.\n5. **Holding-company desk LATAM CTV specifics.** The per-group (Publicis, Dentsu, Omnicom, IPG) LATAM CTV trading posture is asserted on thin public footing; primary or trade confirmation per group is a gap.\n6. **Tubi's current LATAM country list and ad-monetization status** in 2025–2026 could not be freshly confirmed; the available sourcing dates to 2020–2022.\n7. **Whether the Brazil betting bill became law** and its final advertising provisions after the Chamber of Deputies stage — the status as of mid-2026 is \"Senate-approved, pending Chamber.\"\n\n---\n\n## SOURCES\n\n1. Paramount — \"Inside Pluto TV Latin America's Rollout in 17 Spanish-Speaking Countries.\" Tier 1 (company). https://www.paramount.com/news/inside-pluto-tv-latin-americas-rollout-in-17-spanish-speaking-countries — accessed 2026-06-17.\n2. Next TV — \"SpotX Providing Programmatic For Pluto TV in Latin America.\" Tier 5 (trade). https://www.nexttv.com/news/spotx-providing-programmatic-for-pluto-tv-in-latin-america — accessed 2026-06-17.\n3. thedesk.net — \"Roku launches connected TV ad platform in Brazil,\" Oct 2025. Tier 5 (trade). https://thedesk.net/2025/10/roku-launches-connected-tv-ad-platform-in-brazil/ — accessed 2026-06-17.\n4. Variety / Omdia (Rio2C 2025 keynote) — \"Brazil Emerges as FAST Streaming Powerhouse,\" May 2025. Tier 5 (trade, Omdia data). https://variety.com/2025/film/global/rio2c-omdia-fast-channels-omdia-rio-keynote-2025-1236410608/ — accessed 2026-06-17.\n5. Roku Newsroom — \"Roku Unlocks Millions of Viewers in Brazil,\" Oct 15, 2025. Tier 1 (company). https://newsroom.roku.com/news/2025/10/roku-unlocks-millions-of-viewers-in-brazil-as-part-of/2klcvhbl-1760474071 — accessed 2026-06-17.\n6. Telecompaper — \"Roku launches connected TV ad platform in Brazil,\" Oct 2025. Tier 5 (trade). https://www.telecompaper.com/news/roku-launches-connected-tv-ad-platform-in-brazil--1551160 — accessed 2026-06-17.\n7. C21Media — \"Roku eyes local content push as it makes Brazil a priority market,\" 2025. Tier 5 (trade). https://www.c21media.net/news/roku-eyes-local-content-push-as-it-makes-brazil-a-
