 millions of dollars, somewhere between **~USD 0.3–1.0 billion across the six focus countries in 2025** depending on whether YouTube-on-the-TV counts. The central question through 2030 is not whether the audience exists. It is how fast money follows attention. Our base case (≈55%) is that it follows steadily but not explosively: the six-country market roughly doubles to **~USD 1–2.5 billion by 2028–2030**, growing ~20% a year near-term and settling toward a low-teens CAGR, with Brazil and Mexico holding ~80% of it, transacted mostly through private marketplaces and programmatic-guaranteed deals rather than the open exchange. The upside case (≈20%) has the 2026 World Cup, addressable free-to-air, ad-tier conversion, and the Netflix-programmatic land-grab pulling spend toward the top of that band. The downside (≈25%) is the one the region keeps living: reach without revenue, as FX shocks, fraud, regulatory friction, and YouTube's gravity keep premium CPMs and fill suppressed. The drivers are unusually legible; the uncertainty is mostly about pace and definition, not direction.\n\n---\n\n## Method\n\nThis forecast is built from the full body of evidence assembled here, not from a single model. The supply-and-behavior trajectory is anchored on the device and FAST/AVOD data from the connectivity and devices chapter (Dataxis installed base; Omdia FAST-household and AVOD-revenue projections) and the sizing work in the market-size chapter (Dataxis ~USD 450M narrow anchor; the YouTube-inclusive ~USD 1B+ read; Mordor's ~12.3% programmatic-CTV CAGR). The demand and competitive vectors come from the supply-and-demand and the players-and-competition chapters (Netflix's five-DSP programmatic opening, Roku's Brazil launch, retail-media convergence). The friction terms come from the regulation-and-privacy chapter (children's-profiling bans, betting restrictions, regulator turnover) and the fraud-and-pricing chapter (open-auction IVT, the CPM data vacuum). The horizon is **through 2030**.\n\nA caveat on calibration: the probabilities below are deliberately round, derived from the strength of the underlying evidence rather than from a formal model. Treat them as a considered distribution, not a measured one.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios for LATAM programmatic CTV through 2030<\/div><svg viewBox=\"0 0 700 144\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"136\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"136\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"136\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"136\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"120\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"136\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">Base — Reach compounds int…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"420.7\" y=\"8\" width=\"68.7\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"497.4\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">48–62%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Bull — The living room mon…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"258.6\" y=\"44\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"315.8\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">15–25%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Bear — Reach without reven…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"283.2\" y=\"80\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"340.3\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">20–30%<\/text><\/svg><figcaption>Probability assigned to each scenario as the dominant 2030 outcome. <span class=\"credit\">Source: Synthesis of corpus drivers, 2026-06-17.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario A: Reach Compounds Into Revenue (Base Case)\n\n**Probability:** 50–60% (≈55%)\n\n**Description:** The monetization gap narrows without ever fully closing. Six-country CTV ad spend climbs from ~USD 0.3–1.0B (2025) to roughly **USD 1–2.5B by 2028–2030**, ~20% YoY near-term decaying toward a low-teens CAGR, tracking Mordor's ~12.3% programmatic-CTV sub-segment rate. Brazil and Mexico stay ~80% of the pool. The plumbing that arrived in 2025 — Roku's Brazil ad platform, Netflix buyable through five DSPs, Globo's GAMA, Mercado Ads' CTV network — matures into routine inventory, but premium supply keeps trading through PMP and programmatic-guaranteed rather than the open exchange, because fraud and fragmentation make curation the rational default. AVOD/FAST is the structural core; SVOD ad tiers and retail media are the fastest-growing demand sources.\n\n**Drivers:** Device penetration heading to ~90% of top-five households by 2029; AVOD revenue tripling and FAST households doubling to ~52M; ad tiers already on ~55% of Brazilian and Mexican smart TVs; retail-media convergence (Mercado Ads as a CTV demand aggregator); the maturing five-DSP premium-streaming market.\n\n**Conditions:** No region-wide macro shock; FX volatility stays contained to Argentina; the YouTube definitional question stays unresolved (so the headline stays a range); regulatory tightening proceeds as telegraphed rather than accelerating.\n\n**Signals to watch:** eMarketer finally publishing per-country CTV dollar figures in this band; Mercado Ads CTV revenue scaling on schedule; Roku Brazil still expanding into 2027; PMP/PG share of premium CTV staying dominant.\n\n**Time horizon:** Distinguishing features visible by 2027–2028.\n\n### Scenario B: The Living Room Monetizes Fast (Bull Case)\n\n**Probability:** 15–25% (≈20%)\n\n**Description:** Spend sprints to the **top of the band (~USD 2.5B+ by 2030)**. The 2026 FIFA World Cup — carried programmatically/DAI-enabled by Globo, TelevisaUnivision and Telemundo, with all 104 matches also streaming free on YouTube — acts as a forcing function that pulls brand TV budgets into addressable streaming faster than expected. The market converges on the **YouTube-inclusive** definition of CTV, which mechanically lifts the headline 2–3×. Brazil's end-2025 mobile-speed inversion and DTV+ (\"TV 3.0\") free-to-air rollout add reach and, eventually, an addressable broadcast layer. Netflix moves its ad tier from fixed-price toward auction, and ad-tier penetration in Mexico catches up to Brazil's ~51%.\n\n**Drivers:** World Cup 2026 as a programmatic showcase; YouTube-on-TV counted in; DTV+ addressable broadcast; SVOD-ad-tier auction conversion; Brazil 5G/FWA lifting the reach ceiling.\n\n**Conditions:** Macro stability or tailwind; rapid currency/measurement standardization; advertiser confidence that quality is controllable via verification + curation.\n\n**Signals to watch:** IAB chapters formally counting YouTube-on-TV as CTV; Netflix auction migration in LATAM; a step-change in Mexican ad-tier penetration; DTV+ receivers selling fast post-World Cup.\n\n**Time horizon:** Would announce itself in the 2026 World Cup window and the 2026–2027 upfronts.\n\n### Scenario C: Reach Without Revenue Persists (Bear Case)\n\n**Probability:** 20–30% (≈25%)\n\n**Description:** The audience keeps growing and the money keeps lagging. Six-country spend stalls near the **bottom of the band (~USD 1B by 2030)**. FX and macro shocks — another Argentine peso spiral, Mexican growth dragged by US trade tension — keep USD-denominated budgets volatile. The open-auction quality problem (Brazil's CTV IVT hit 43% in Q2 2025) and the near-total absence of reliable CPM benchmarks keep advertisers cautious and prices soft. Regulatory friction bites: Brazil's flat ban on behavioral profiling in ads \"likely to be accessed by\" minors (enforceable since March 2026) constrains living-room targeting, the betting-ad clampdown removes a top spender, and Mexico's dissolved-then-rebuilt privacy regulator creates compliance uncertainty. YouTube continues to vacuum the available video budget, and premium broadcaster/FAST inventory takes share only at the margins.\n\n**Drivers:** FX/macro volatility; high open-auction IVT and the CPM data vacuum; the children's-profiling and betting-ad regimes; measurement and identity fragmentation; YouTube's gravitational pull on premium pricing.\n\n**Conditions:** Any of: a serious regional recession or currency crisis; a high-profile CTV fraud or brand-safety scandal; aggressive enforcement of the new privacy/advertising statutes; persistent failure to standardize a CTV currency and definition.\n\n**Signals to watch:** Pixalate IVT staying elevated or rising; peso/real sharp depreciation; ANPD or Mexico's SABG enforcement actions touching ad-tech; betting-ad revenue declining as projected; no convergence on a YouTube definition.\n\n**Time horizon:** Would be evident by 2027 if the monetization rate fails to move with reach.\n\n## Base Rates\n\nThree reference cases anchor the distribution. **The US/European CTV curve** suggests that once ad-supported viewing becomes the default and programmatic plumbing lands, ad dollars follow attention with a multi-year lag — but the US had dense addressable-cable infrastructure to build on, which LATAM skipped (it leapt from low pay-TV penetration straight to IP). That argues for a *longer* reach-to-revenue lag here, supporting the base/bear weighting over the bull. **Brazil's own digital-video curve** — video now ~49% of a R$42.7B digital ad market growing ~12.7% YoY — shows budgets do migrate from linear once the inventory and measurement exist, supporting the base case's steady-compounding read. **The retail-media precedent** — Mercado Ads growing ~56% in USD with display & video nearly doubling — shows that where closed-loop measurement exists, LATAM advertisers spend; this is the single best argument that the gap narrows rather than persists, and it is why retail-media-led CTV is the highest-conviction sub-trend in this analysis.\n\n## Prediction Market Snapshot\n\nNo liquid prediction markets exist on LATAM CTV ad-spend outcomes (Polymarket, Kalshi, Metaculus carry no relevant contracts as of June 2026). The closest tradable analogues are the public equities of the platforms exposed to the trend — Roku, Magnite, PubMatic, The Trade Desk, MercadoLibre — whose 2025–2026 results (Roku reaching platform profitability; Magnite CTV growth ~20% YoY; PubMatic CTV >50% YoY; MercadoLibre ad revenue near-doubling) are directionally consistent with the base-to-bull range rather than the bear. This is an indirect, equity-market read, not a calibrated forecast market, and should be weighted accordingly.\n\n## What Would Change My Forecast\n\n1. **A clean per-country CTV ad-spend disclosure** (e.g., eMarketer un-paywalling Brazil/Mexico dollar series) — would collapse the ±2–3× sizing band and re-anchor the whole distribution.\n2. **A formal IAB ruling on whether YouTube-on-TV is \"CTV\"** — would resolve the single largest definitional fork and shift the headline number sharply in one direction.\n3. **Netflix moving its LATAM ad tier to open auction** — would materially deepen premium programmatic supply and pull toward the bull case.\n4. **A region-wide currency/macro shock** (Argentine or Brazilian devaluation, Mexican recession) — would pull hard toward the bear case.\n5. **Aggressive enforcement of the children's-profiling ban or a marquee CTV fraud scandal** — either would suppress targeting confidence and pricing, favoring the bear case.\n6. **DTV+ (\"TV 3.0\") shipping an actually-addressable free-to-air layer at scale** — would, over the back half of the decade, open the largest single CTV-style inventory pool in the region and support the bull case.\n\n## Open Questions\n\nThe forecast inherits the load-bearing unknowns that run through these pages: the true programmatic share of LATAM CTV spend (the ~85% figure is an inference); which YouTube definition the market adopts; the actual per-country CPMs and fill rates (essentially absent from the public record); whether the 2025-vintage platform entries (Roku Brazil, Netflix-via-Amazon, MiQ/Adsmovil's Sigma) are still scaling as advertised by late 2026; and how the new privacy and advertising statutes are actually enforced against ad-tech rather than publishers.\n\n## Sources\n\nThis chapter synthesizes the sourced findings of the earlier chapters rather than introducing new citations; the underlying evidence sits in the chapters on market size, connectivity and devices, the supply-and-demand ecosystem, players and competition, regulation and privacy, and fraud and pricing."}], "glossary": [{"term": "ACAM", "aliases": ["Alianza para la Calidad de la Medición Multimedia en México"], "def": "The Mexican advertising industry's buy-side committee that certifies which company's audience-measurement service counts as the official currency for buying and selling TV and video ads."}, {"term": "ACR", "aliases": ["Automatic Content Recognition", "automatic content recognition"], "def": "A feature built into many smart TVs that identifies what is on screen by sampling the picture or audio, so the set (and advertisers) know what a household is watching and can target ads to it."}, {"term": "ad-tier", "aliases": ["ad-supported tier", "ads plan"], "def": "A cheaper subscription option on a streaming service that shows commercials in exchange for a lower monthly price, as opposed to a full-price ad-free plan."}, {"term": "app-ads.txt", "aliases": ["ads.txt"], "def": "A public file an app or website publisher posts online listing exactly which companies are authorized to sell its ad space, so buyers can check whether an ad seller is legitimate or is passing off fake or stolen inventory."}, {"term": "AVOD", "aliases": ["ad-supported video on demand", "ad-supported-video-on-demand"], "def": "Streaming video that is free to watch because it is paid for by advertising rather than by a subscription fee."}, {"term": "BVOD", "aliases": ["broadcaster video on demand", "broadcaster on-demand"], "def": "A traditional TV network's own on-demand streaming service, such as a channel's app that lets viewers watch its shows online rather than live."}, {"term": "clean room", "aliases": ["retail-media clean room", "clean rooms"], "def": "A secure data environment where an advertiser and a company holding customer data (like a retailer) can match up whether an ad was seen and whether a purchase followed, without either side handing over its raw private customer data to the other."}, {"term": "CPM", "aliases": ["cost per mille", "cost per thousand"], "def": "The price an advertiser pays for one thousand ad views, the standard unit used to compare ad prices across platforms and countries."}, {"term": "DAI", "aliases": ["dynamic ad insertion"], "def": "Technology that swaps in different ads for different viewers watching the same stream in real time, rather than everyone seeing an identical, pre-baked commercial break."}, {"term": "DSP", "aliases": ["demand-side platform"], "def": "Software that advertisers and their agencies use to buy ad space automatically across many websites, apps, and streaming services at once, rather than negotiating with each seller individually."}, {"term": "FAST", "aliases": ["Free Ad-Supported Streaming TV", "free ad-supported streaming TV"], "def": "Free, ad-supported streaming channels that behave like old-fashioned linear TV channels but are delivered over the internet, playing a set schedule of programming rather than letting the viewer pick each title."}, {"term": "fill rate", "aliases": ["fill"], "def": "The share of available ad slots on a platform that actually get sold and filled with an ad, rather than going unsold or showing a blank filler spot."}, {"term": "FTTH", "aliases": ["fiber to the home", "FTTH overbuild"], "def": "An internet connection that runs fiber-optic cable all the way to a home, delivering much faster and more reliable service than older copper or satellite lines."}, {"term": "GAID", "aliases": ["Google Advertising ID"], "def": "A unique, resettable code Google assigns to each Android phone that lets advertisers recognize and target the same device over time without knowing the owner's name, functioning as the mobile-world equivalent of a tracking cookie."}, {"term": "GDPR", "aliases": ["General Data Protection Regulation"], "def": "The European Union's strict data-privacy law, widely used elsewhere as the template other countries copy when writing their own rules on how companies may collect and use people's personal information."}, {"term": "identity graph", "aliases": ["household graph", "ID graph", "graph"], "def": "A database that links the different devices, accounts, and browsers a single person or household uses into one connected profile, so an advertiser can recognize the same viewer across a phone, a smart TV, and a laptop."}, {"term": "invalid traffic", "aliases": ["IVT", "Invalid Traffic"], "def": "Ad views that do not come from a real, attentive human viewer — for example fake traffic generated by software pretending to be a smart TV — and so should not be paid for as a genuine impression."}, {"term": "IPTV", "aliases": ["illegal IPTV", "pirate-streaming apps", "pirate IPTV"], "def": "Television delivered over an internet connection rather than through cable, satellite, or a traditional antenna; in this context often referring to unauthorized, pirated services that stream copyrighted channels without a license."}, {"term": "LGPD", "aliases": ["Lei Geral de Proteção de Dados"], "def": "Brazil's national data-privacy law, closely modeled on Europe's GDPR, that governs how companies may collect, store, and use Brazilians' personal information, including for ad targeting."}, {"term": "MMP", "aliases": ["Mobile Measurement Partner", "Mobile Measurement Partners"], "def": "A third-party service that tracks whether a mobile ad led someone to install an app or take an action inside it, giving advertisers an independent measure of what their mobile and app-install advertising actually achieved."}, {"term": "MRC", "aliases": ["Media Rating Council", "MRC-accredited"], "def": "An independent US-based body that audits and certifies whether an advertising- or audience-measurement company's numbers are trustworthy enough to be used as an industry standard."}, {"term": "open auction", "aliases": ["open RTB", "open exchange", "open-programmatic"], "def": "The style of automated ad buying where any qualified buyer can bid on any available ad slot in real time on a shared marketplace, as opposed to a private, pre-negotiated deal between a specific buyer and seller."}, {"term": "people-meter", "aliases": ["people meter"], "def": "A physical or software device installed in a panel of representative households that records exactly what is being watched, minute by minute, and by whom, forming the traditional backbone of TV ratings."}, {"term": "PG", "aliases": ["programmatic guaranteed", "programmatic-guaranteed"], "def": "An automated ad deal in which a buyer commits in advance to purchase a fixed amount of ad space at a fixed price, combining the certainty of a traditional ad buy with the automated mechanics of programmatic technology."}, {"term": "PMP", "aliases": ["private marketplace", "private marketplaces"], "def": "An invitation-only version of automated ad buying where a publisher opens its inventory to a hand-picked group of buyers, rather than to the open market, usually to protect quality and pricing."}, {"term": "programmatic", "aliases": ["programmatic advertising", "programmatically"], "def": "The automated buying and selling of advertising space through software and real-time auctions, replacing the manual process of a salesperson negotiating each ad placement directly."}, {"term": "RTB", "aliases": ["Real-Time Bidding", "real-time bidding"], "def": "The specific auction process behind most open programmatic advertising, in which an ad slot is put up for bid the instant a webpage or stream loads and sold to the highest bidder within a fraction of a second."}, {"term": "sellers.json", "aliases": [], "def": "A public file a company in the ad-selling chain posts online disclosing which other companies it works with to sell its inventory, letting buyers trace who is really behind an ad transaction."}, {"term": "SIVT", "aliases": ["Sophisticated Invalid Traffic"], "def": "A more advanced, harder-to-detect category of fake ad traffic, generated by software specifically engineered to mimic genuine human viewing and evade standard fraud filters."}, {"term": "SSAI", "aliases": ["Server-Side Ad Insertion", "server-side ad insertion"], "def": "A technical method of splicing ads directly into a video stream on a server before it reaches the viewer's screen, which makes for a seamless viewing experience but also creates an opening that fraudsters can impersonate to fake ad views."}, {"term": "SSP", "aliases": ["sell-side platform", "sell-side platforms"], "def": "Software that publishers and streaming platforms use to offer their ad space for sale automatically to many potential buyers at once, the seller-side counterpart to a DSP."}, {"term": "STB", "aliases": ["set-top box"], "def": "The physical box connected to a television, typically provided by a cable or satellite company, that decodes and delivers the pay-TV signal to the screen."}, {"term": "SupplyChain Object", "aliases": ["OpenRTB SupplyChain Object"], "def": "A standardized piece of data attached to a programmatic ad transaction that lists every intermediary company that touched the deal, so buyers can verify the full chain between themselves and the actual publisher."}, {"term": "SVOD", "aliases": ["subscription video on demand"], "def": "Streaming video paid for through a recurring subscription fee, typically without advertising, such as a standard Netflix subscription."}, {"term": "TAG", "aliases": ["Trustworthy Accountability Group", "TAG Certified Channels"], "def": "An advertising-industry group that inspects and certifies companies as meeting anti-fraud and brand-safety standards, giving buyers a trust signal when choosing which supply to buy."}, {"term": "UID2", "aliases": ["Unified ID 2.0"], "def": "An industry-standard way of identifying internet users for ad targeting based on their email or phone number rather than browser cookies, intended as a shared replacement for cookie-based tracking."}, {"term": "VAT", "aliases": ["value-added tax"], "def": "A consumption tax added to the sale of goods and services, which in this context several Latin American governments apply to digital services like streaming and online advertising sold by foreign companies."}, {"term": "vMVPD", "aliases": ["virtual multichannel video programming distributor"], "def": "A service that streams a bundle of live TV channels over the internet, functioning like a cable subscription but without the cable wire or a traditional set-top box."}, {"term": "walled garden", "aliases": [], "def": "A large platform, such as YouTube or Google's ad system, that keeps tight control over its own advertising data and inventory and does not let outside measurement or ad-buying tools fully see or reach inside it."}]}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// sidebar Quiz link → the Test Yourself page with this corpus preselected
(function () { var qb = document.getElementById('quiz-btn');
  if (qb && corpus.slug) qb.href = 'quiz.html?on=' + encodeURIComponent(corpus.slug); })();
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme toggle — the theme itself is applied pre-paint by the <head> boot
// script (dark unless localStorage 'corpus-theme' says 'light')
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  // feature well — injected AFTER the glossary pass so its text is never chip-annotated;
  // content.innerHTML is rebuilt per chapter, so the remove() is belt-and-braces.
  var oldWell = content.querySelector('.ch-byline'); if (oldWell) oldWell.remove();
  var well = document.createElement('p'); well.className = 'ch-byline';
  var mins = Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220));
  well.textContent = 'Chapter ' + (current + 1) + ' of ' + docs.length + ' · ' + mins + ' min read · Machine Humanities';
  var h1 = content.querySelector('h1');
  if (h1) h1.insertAdjacentElement('afterend', well); else content.insertAdjacentElement('afterbegin', well);
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('prev').textContent = current > 0 ? '← From: ' + docs[current - 1].title : '←';
  document.getElementById('next').textContent = current < docs.length - 1 ? 'Continued: ' + docs[current + 1].title + ' →' : '→';
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length;
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {
  let h = document.getElementById('kbd-help');
  if (!h) {
    h = document.createElement('div'); h.id = 'kbd-help';
    h.innerHTML = '<div class="kh"><h3>Keyboard</h3><dl>'
      + '<dt>⌘K</dt><dd>command palette</dd>'

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}

  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);

}

  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';

}
function speakChunk() {

      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();

}
function startListen() {
  if (!synth) return;

  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();

}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();

}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }

}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);

  lbar.querySelector('#lb-stop').onclick = stopListen;

  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };

  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });

window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command

window.addEventListener('hashchange', () => {

// Related reading at the foot of the column — corpus-level, from the inlined

function renderRelated() {

  const mEl = document.getElementById('library-manifest');

  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }

  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {

  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '620px', normal: '700px', wide: '820px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {

    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;

  document.body.appendChild(pop);

  var openFor = null, cEl = document.getElementById('content');

    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');

  });

      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';

      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();

.card-prog { display: inline-flex; align-items: center; gap: .34rem; font-family: var(--mono); font-size: .64rem;

    });
    card.addEventListener('pointerenter', function () { if (hideT) { clearTimeout(hideT); hideT = null; } });
    card.addEventListener('pointerleave', schedHide);
    document.addEventListener('keydown', function (e) {
      if (!back || !back.classList.contains('open')) return;
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === '+' || e.key === '=') zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3);
      else if (e.key === '-' || e.key === '_') zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3);
      else if (e.key === '0') fit();
    });
    window.addEventListener('resize', function () {
      if (back && back.classList.contains('open') && DATA && DATA._b && !enoughVisible()) fit();
    });
  }

  function apply() {
    world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.s + ')';
    // Counter-scale the plate names so the navigation labels stay readable
    // (~12 screen px) however far out the sheet is zoomed.
    world.style.setProperty('--als', Math.min(2.6, Math.max(1, 12 / (17 * view.s))).toFixed(3));
  }
  // Is enough of the map on-screen? Guards a saved view that lands off-stage when
  // the Atlas is reopened (or resized) at a very different viewport size.
  function enoughVisible() {
    if (!DATA || !DATA._b) return true;
    var b = DATA._b, sw = stage.clientWidth, sh = stage.clientHeight;
    var L = view.x + b.x * view.s, T = view.y + b.y * view.s,
        Rr = view.x + (b.x + b.w) * view.s, B = view.y + (b.y + b.h) * view.s;
    return view.s > 0 && (Math.min(Rr, sw) - Math.max(L, 0) >= 60) && (Math.min(B, sh) - Math.max(T, 0) >= 60);
  }
  // Min zoom follows the fitted scale, so small (mobile) stages can still show
  // the whole sheet; you can never zoom out past "everything visible".
  function minS() { return view.fitS ? Math.min(0.22, view.fitS) : 0.22; }
  function zoomAt(px, py, f) {
    var ns = Math.max(minS(), Math.min(9, view.s * f)), k = ns / view.s;
    view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = ns; apply();
  }
  function fit() {
    if (!DATA || !DATA._b) return;
    var b = DATA._b, sw = stage.clientWidth, sh = stage.clientHeight, pad = 46;
    if (sw < 60 || sh < 60) { requestAnimationFrame(fit); return; }   // stage not laid out yet
    var s = Math.min(9, Math.min((sw - pad * 2) / b.w, (sh - pad * 2) / b.h));
    if (!isFinite(s) || s <= 0) return;
    view.fitS = s;
    view.s = s; view.x = (sw - (2 * b.x + b.w) * s) / 2; view.y = (sh - (2 * b.y + b.h) * s) / 2; apply();
  }
  function zoomToRect(x, y, w, h) {
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var s = Math.max(minS(), Math.min(4.5, Math.min(sw / w, sh / h)));
    view.s = s; view.x = (sw - (2 * x + w) * s) / 2; view.y = (sh - (2 * y + h) * s) / 2; apply();
  }

  function load() {
    if (loading) return; loading = true;
    fetch(base + 'atlas.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (j) {
        DATA = j; buildPick();
        var sm = ''; try { sm = localStorage.getItem('atlas-pick') || ''; } catch (e) {}
        if (sm && j.connections && j.connections[sm]) mode = sm;
        paint(true); loaded = true; if (msg) msg.remove(); syncPick(); updateSub();
      })
      .catch(function () { if (msg) msg.textContent = 'The Atlas needs to load its map data — open it on the live site (calvincollins.xyz).'; });
  }

  // The research picker turns the Atlas from a single mosaic into a per-corpus
  // explorer: pick a work and the map redraws as that corpus's intellectual world.
  function buildPick() {
    if (!pick || !DATA) return;
    var conn = DATA.connections || {}, seen = {}, opts = '<option value="">✦ All researches — the whole map</option>';
    (DATA.places || []).filter(function (p) { if (seen[p.slug] || !conn[p.slug]) return false; seen[p.slug] = 1; return true; })
      .map(function (p) { return { slug: p.slug, title: p.title }; })
      .sort(function (x, y) { return x.title.localeCompare(y.title); })
      .forEach(function (it) { opts += '<option value="' + esc(it.slug) + '">' + esc(it.title) + '</option>'; });
    pick.innerHTML = opts;
  }
  function syncPick() { if (pick) pick.value = mode; }
  function setMode(m) {
    if (!DATA) return;
    m = m || ''; if (m && !(DATA.connections && DATA.connections[m])) m = '';
    if (m === mode) { syncPick(); return; }
    mode = m; try { localStorage.setItem('atlas-pick', mode); } catch (e) {}
    hideCard(); paint(true); syncPick(); updateSub();
  }
  function updateSub() {
    var sub = back && back.querySelector('#atlas-sub'); if (!sub) return;
    var C = (mode && DATA && DATA.connections && DATA.connections[mode]) ? DATA.connections[mode] : null;
    if (C) sub.textContent = C.home.name + '’s intellectual world — ' + C.nodes.length + ' geographic connections. Hover a place to trace its thread.';
    else sub.textContent = 'Every research is one equal stamp, pinned to its place. Click a place name to zoom in — or pick a research above to trace its intellectual world.';
  }

  // Repaint the whole surface for the active mode. Cheap enough to rebuild wholesale.
  function paint(doFit) {
    if (!DATA) return;
    var j = DATA, C = (mode && j.connections && j.connections[mode]) ? j.connections[mode] : null;
    var s = '<svg id="atlas-svg" viewBox="' + j.viewBox + '" width="' + j.w + '" height="' + j.h
      + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">';
    s += '<defs>';
    if (!C) j.places.forEach(function (p) {
      s += '<clipPath id="ac-' + p.slug + '"><rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="7"/></clipPath>'; });
    else s += '<clipPath id="ahome"><circle cx="' + C.home.x + '" cy="' + C.home.y + '" r="58"/></clipPath>';
    s += '</defs>';
    s += '<g id="atlas-grat">'; (j.graticule || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += '<g id="atlas-bd">'; (j.backdrop || []).forEach(function (d) { s += '<path d="' + d + '"/>'; }); s += '</g>';
    s += C ? connLayer(C) : placesLayer(j);
    s += '</svg>';
    world.innerHTML = s;
    bySlug = {};
    computeBounds(C);
    if (C) wireConn(C); else wirePlaces(j);
    if (doFit === false) { apply(); return; }
    fit();
  }

  // The stamp mosaic: leader lines + anchor dots first, then the callout
  // plates, then every corpus as one equal-size stamp with a short caption.
  function placesLayer(j) {
    var plateById = {};
    (j.plates || []).forEach(function (pl) { plateById[pl.id] = pl; });
    var s = '<g id="atlas-lead">';
    (j.plates || []).forEach(function (pl) {
      if (pl.leader) s += '<path class="atlas-leader" d="M' + pl.leader[0] + ' ' + pl.leader[1] + 'L' + pl.leader[2] + ' ' + pl.leader[3] + '"/>';
    });
    j.places.forEach(function (p) {
      var pl = plateById[p.plate];
      if (pl && (Math.abs(p.ax - pl.cx) > 2 || Math.abs(p.ay - pl.cy) > 2))
        s += '<line class="atlas-spoke" x1="' + pl.cx + '" y1="' + pl.cy + '" x2="' + p.ax + '" y2="' + p.ay + '"/>';
      s += '<circle class="atlas-anchor" cx="' + p.ax + '" cy="' + p.ay + '" r="5" fill="' + esc(p.accent) + '"/>';
    });
    s += '</g><g id="atlas-plates">';
    (j.plates || []).forEach(function (pl) {
      s += '<g class="atlas-plate" data-plate="' + esc(pl.id) + '">'
        + '<rect class="atlas-plbg" x="' + pl.x + '" y="' + pl.y + '" width="' + pl.w + '" height="' + pl.h + '" rx="10"/>'
        + '<line class="atlas-plrule" x1="' + (pl.x + 12) + '" y1="' + (pl.y + 33) + '" x2="' + (pl.x + pl.w - 12) + '" y2="' + (pl.y + 33) + '"/>'
        + '</g>';
    });
    // names in their own layer ABOVE every plate box, so a counter-scaled
    // label never hides under a neighbouring plate
    s += '</g><g id="atlas-plnames">';
    (j.plates || []).forEach(function (pl) {
      s += '<text class="atlas-plname" data-plate="' + esc(pl.id) + '" x="' + (pl.x + pl.w / 2) + '" y="' + (pl.y + 25) + '" text-anchor="middle">' + esc(pl.name) + '</text>';
    });
    s += '</g><g id="atlas-stamps">';
    j.places.forEach(function (p) {
      s += '<g class="atlas-place" data-slug="' + esc(p.slug) + '">';
      if (p.img) { var href = esc(base + p.img);
        s += '<image class="atlas-img" href="' + href + '" xlink:href="' + href + '" x="' + p.x + '" y="' + p.y
          + '" width="' + p.w + '" height="' + p.h + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ac-' + p.slug + ')"/>';
      } else {
        s += '<rect class="atlas-fallback" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="7" fill="' + esc(p.accent) + '"/>'
          + '<text class="atlas-initial" x="' + (p.x + p.w / 2) + '" y="' + (p.y + p.h / 2 + 18) + '" text-anchor="middle" fill="' + esc(p.accent) + '">' + esc((p.title || '?').charAt(0)) + '</text>';
      }
      s += '<rect class="atlas-ring" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" rx="7" stroke="' + esc(p.accent) + '" stroke-width="2.5"/>';
      (p.cap || []).forEach(function (ln, li) {
        s += '<text class="atlas-cap" x="' + (p.x + p.w / 2) + '" y="' + (p.y + p.h + 14 + li * 14) + '" text-anchor="middle">' + esc(ln) + '</text>';
      });
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function arcPath(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var off = Math.min(170, len * 0.16), cx = mx - dy / len * off, cy = my + dx / len * off;
    return 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  function clipText(t, n) { t = t || ''; return t.length > n ? t.slice(0, n - 1).replace(/[\s,;:&/-]+$/, '') + '…' : t; }
  function connLayer(C) {
    var ac = esc(C.home.accent || '#b3502f'), H = C.home, R = 58;
    var s = '<g id="atlas-threads" stroke="' + ac + '">';
    C.nodes.forEach(function (n, i) { s += '<path class="atlas-thread" data-i="' + i + '" d="' + arcPath(H.x, H.y, n.x, n.y) + '"/>'; });
    s += '</g>';
    // home badge drawn UNDER the place nodes, so their dots + labels are never masked
    s += '<g class="atlas-home">';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + (R + 6) + '" fill="var(--bg)"/>';
    if (H.img) { var href = esc(base + H.img);
      s += '<image href="' + href + '" xlink:href="' + href + '" x="' + (H.x - R) + '" y="' + (H.y - R) + '" width="' + (2 * R) + '" height="' + (2 * R) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#ahome)"/>'; }
    else s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="' + ac + '"/>';
    s += '<circle cx="' + H.x + '" cy="' + H.y + '" r="' + R + '" fill="none" stroke="' + ac + '" stroke-width="4.5"/>';
    s += '<text class="atlas-hlabel" x="' + H.x + '" y="' + (H.y + R + 33) + '" text-anchor="middle" fill="' + ac + '">' + esc(H.name) + '</text>';
    s += '</g>';
    s += '<g id="atlas-cnodes">';
    C.nodes.forEach(function (n, i) {
      // splay each label outward from home so the European cluster doesn't pile up
      var dx = n.x - H.x, dy = n.y - H.y, L = Math.sqrt(dx * dx + dy * dy) || 1;
      var lx = n.x + dx / L * 15, ly = n.y + dy / L * 15 + (dy >= 0 ? 16 : -8);
      var anchor = dx > 30 ? 'start' : (dx < -30 ? 'end' : 'middle');
      s += '<g class="atlas-cnode" data-i="' + i + '">';
      s += '<circle class="atlas-chalo" cx="' + n.x + '" cy="' + n.y + '" r="17" stroke="' + ac + '" fill="none"/>';
      s += '<circle class="atlas-cdot" cx="' + n.x + '" cy="' + n.y + '" r="9" fill="' + ac + '"/>';
      s += '<text class="atlas-clabel" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '">' + esc(clipText(n.name, 30)) + '</text>';
      s += '</g>';
    });
    s += '</g>';
    return s;
  }

  function computeBounds(C) {
    var X0 = 1e9, Y0 = 1e9, X1 = -1e9, Y1 = -1e9;
    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      (DATA.plates || []).forEach(function (pl) {
        X0 = Math.min(X0, pl.x); Y0 = Math.min(Y0, pl.y); X1 = Math.max(X1, pl.x + pl.w); Y1 = Math.max(Y1, pl.y + pl.h); });
      DATA.places.forEach(function (p) { bySlug[p.slug] = p;
        X0 = Math.min(X0, p.ax); Y0 = Math.min(Y0, p.ay); X1 = Math.max(X1, p.ax); Y1 = Math.max(Y1, p.ay); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
    var byId = {};
    (j.plates || []).forEach(function (pl) { byId[pl.id] = pl; });
    [].forEach.call(world.querySelectorAll('.atlas-plate, .atlas-plname'), function (el) {
      var pl = byId[el.getAttribute('data-plate')];
      el.addEventListener('click', function () { if (moved || !pl) return; zoomToRect(pl.x - 30, pl.y - 30, pl.w + 60, pl.h + 60); });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
