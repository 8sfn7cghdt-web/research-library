razil Issues New Regulation on International Data Transfers.\" Accessed 2026-06-17. Tier 4-5 (trade.gov = US govt Tier 1-ish for its own analysis; firm alerts Tier 5). https://www.trade.gov/market-intelligence/brazils-new-rules-international-data-transfers ; https://www.mayerbrown.com/en/insights/publications/2025/08/end-of-grace-period-implementation-of-brazils-standard-contractual-clauses-in-international-transfers-of-personal-data ; https://iapp.org/news/a/brazil-s-new-regulation-on-international-data-transfers\n20. CookieHub, \"PDPA Data Protection Law Argentina\"; Baker McKenzie InsightPlus, \"Argentina: New program promotes transparency and protection of personal data in the use of AI\" (AAIP Resolution 161/2023); Lexology, \"Argentina: New program... AI.\" Accessed 2026-06-17. Tier 5. https://insightplus.bakermckenzie.com/bm/data-technology/argentina-new-program-promotes-transparency-and-protection-of-personal-data-in-the-use-of-ai ; https://www.cookiehub.com/pdpa-argentina\n21. (reserved)\n22. CIAT (Inter-American Center of Tax Administrations), \"Overview of the Taxation of the Digital Economy in Latin America,\" Working Paper WP-05-2025, July 2025; Bloomberg Tax, \"Latin America's Digital Tax Revolution\" and \"VAT and the Digital Economy in Latin America and the Caribbean.\" Accessed 2026-06-17. Tier 2-5 (CIAT WP = IGO-adjacent authoritative Tier 2; Bloomberg Tax Tier 5). https://www.ciat.org/Biblioteca/DocumentosdeTrabajo/2025/WP_05_2025.pdf ; https://news.bloombergtax.com/tax-management-international/latin-americas-digital-tax-revolution-can-businesses-keep-up"}, {"order": 7, "file": "07_Fraud_Quality_Pricing.md", "title": "Fraud, Inventory Quality & Pricing in LATAM Programmatic CTV", "summary": "", "body": "# Fraud, Inventory Quality & Pricing in LATAM Programmatic CTV\n\n## Bottom Line\n\nLatin American programmatic Connected-TV inventory is, on the available evidence, materially dirtier than the global average — and the headline number moves so fast quarter to quarter that any single figure is a snapshot, not a constant. Pixalate's MRC-accredited quarterly benchmarks put Brazil's CTV invalid-traffic (IVT) rate at 17% in Q4 2024, then 37% in Q1 2025, then a striking 43% in Q2 2025 — more than double the ~18% global CTV benchmark for the same period — while Mexico's CTV IVT oscillated between roughly 21% and 27% across the same window. The dominant LATAM fraud *technique* is distinctive. DoubleVerify's 2026 Global Insights work attributes 91% of CTV fraud violations in LATAM to data-center traffic, versus a bot-driven profile in North America — consistent with cheap, server-side spoofing rather than compromised consumer devices. The mechanism comes from CTV-specific schemes: counterfeit SSAI servers, device and app spoofing, fraudulent \"fake\" apps, and ad-laden piracy/IPTV operations demonstrably concentrated in the region, notably Brazil. The proven antidote exists — brand-safety and supply-path-transparency tooling (app-ads.txt, sellers.json, the SupplyChain Object, TAG certification) — but adoption across LATAM CTV supply is uneven and under-documented. Pricing is the single weakest part of the public record. Hard, country-level, local-currency CPM benchmarks for FAST vs. premium SVOD ad-tier vs. broadcaster inventory are essentially absent from neutral sources, so every CPM figure here is flagged single-source, and most regional pricing must be inferred from US/global benchmarks ($15–$35 typical CTV CPM, with premium direct buys far higher) discounted for a lower-ARPU market. Treat the fraud numbers as quarter-dated and the pricing numbers as soft.\n\n---\n\n## 1. How to Read These Numbers (Methodology & Caveats)\n\nThree disciplines govern every figure in these pages.\n\n**Verification vendors measure different things.** Pixalate, DoubleVerify (DV), Integral Ad Science (IAS), HUMAN, and the Trustworthy Accountability Group (TAG) are all commercial verification firms with proprietary methodologies and an obvious commercial interest in the severity of the problem they sell protection against. Pixalate's LATAM benchmarks draw \"predominantly of buy-side open auction programmatic traffic sources\" — the open exchange, structurally the dirtiest slice of supply and *not* representative of curated PMP or direct-sold inventory [1][2][3]. DV's figures come from \"DV-protected campaigns\" — inventory that has already chosen to buy protection, a different and generally cleaner population [4]. A 43% open-auction IVT rate and a sub-1% protected-campaign fraud rate can both be true of the same country in the same quarter, because they describe different inventory. Throughout, the channel is named — open auction vs. protected — wherever the source discloses it.\n\n**Date everything by quarter.** CTV fraud in LATAM is not a stable parameter. Brazil's Pixalate CTV IVT rate moved from 17% (Q4 2024) to 37% (Q1 2025) to 43% (Q2 2025) — a swing too large to average. The volatility is itself a finding. It fits discrete fraud campaigns — a spoofing scheme spins up, gets detected and blocked, another launches — rather than a slowly drifting baseline. Every fraud figure in this document carries its quarter.\n\n**CPMs are the weak link — treat them as soft.** US and global CTV CPM data is abundant; neutral, country-level LATAM CTV CPM data in local currency is almost nonexistent. Where a LATAM-specific price appears, it rests on a single source. Most regional pricing statements here are explicitly *inferences* from global benchmarks plus market-maturity and FX reasoning, not measured LATAM CPMs.\n\n---\n\n## 2. The Fraud Baseline: Pixalate's Quarterly LATAM Series\n\nPixalate is the most consistent public source of country-level, channel-split IVT benchmarks for LATAM. Its quarterly reports cover Mexico and Brazil — the only two LATAM countries it breaks out in detail — and it is accredited by the Media Rating Council (MRC) for detection and filtration of Sophisticated Invalid Traffic (SIVT). Here is the full five-quarter series assembled from its press releases.\n\n### Brazil\n\n| Quarter | Desktop & Mobile Web | Mobile App | CTV |\n|---|---|---|---|\n| Q4 2024 | 17% | 37% | 17% |\n| Q1 2025 | 23% | 42% | 37% |\n| Q2 2025 | 22% | 41% | 43% |\n| Q3 2025 | *not broken out* | *not broken out* | *not broken out* |\n\n### Mexico\n\n| Quarter | Desktop & Mobile Web | Mobile App | CTV |\n|---|---|---|---|\n| Q4 2024 | 11% | 27% | 27% |\n| Q1 2025 | 14% | 36% | 22% |\n| Q2 2025 | 15% | 34% | 21% |\n| Q3 2025 | 23% | 39% | 25% |\n\nSources: Q4 2024 [1]; Q1 2025 [2]; Q2 2025 [3]; Q3 2025 [5]. Pixalate analyzed \"over 100 billion\" (Q4 2024, Q1 2025), \"over 120 billion\" (Q2 2025), and \"over 106 billion\" (Q3 2025) global programmatic impressions per quarter [1][2][3][5].\n\n**Global comparison.** Pixalate's global CTV IVT benchmark was ~18% in Q2 2025 and ~19% in Q3 2025 [3][5]. Against that yardstick, Brazil's Q2 2025 CTV rate of 43% runs roughly 2.4x the global average; Mexico's Q3 2025 CTV rate of 25% runs about 1.3x. Mexico's mobile-app channel (39% in Q3 2025) ran 6 points above the global mobile-app benchmark of 33% [5].\n\n---\n\n## 3. The Distinctive LATAM Fraud Profile: Data-Center Traffic\n\nThe most important finding for LATAM is not the *level* of fraud but its *composition*. DoubleVerify's 2026 Global Insights report (\"Must-CTV: Streaming's Shift From Promise to Performance,\" published May 13, 2026) breaks CTV fraud violations by mechanism and region [4][6]:\n\n| Region | Dominant CTV fraud type |\n|---|---|\n| **LATAM** | **91% data-center fraud**, 9% bot fraud |\n| North America | 82% bot fraud |\n| APAC | 98% data-center fraud |\n| EMEA | 66% data-center fraud |\n\nData-center fraud means traffic originating from cloud and server infrastructure dressed up to look like consumer CTV devices, as opposed to \"bot\" fraud running on compromised real devices. The LATAM profile — and the even higher APAC figure — fits the economics of CTV fraud in emerging markets: renting server capacity and spoofing device and app signals is cheaper and faster than building or compromising a botnet of real smart-TV devices. This matters operationally, because data-center IVT is comparatively *detectable*. IP-range and SSAI-signature filtering catches a large share of it, which is part of why protected campaigns show such low residual fraud (Section 6). The report draws on DV measurement data across billions of impressions plus surveys of 2,000+ marketers and 22,000+ consumers in 20+ markets [4].\n\n---\n\n## 4. CTV-Specific Fraud Schemes (Global Mechanisms, LATAM-Relevant)\n\nDV and Pixalate document the schemes below at the global level. None is reported as LATAM-exclusive, but each is the *type* of attack that produces the data-center-heavy LATAM profile above — the mechanistic backstory to Section 3.\n\n### 4.1 SSAI (Server-Side Ad Insertion) abuse\n\nSSAI stitches ads into the video stream on a server before delivery. It is essential to a seamless CTV viewing experience, but it interposes a server between the real device and the ad exchange — and fraudsters exploit that by impersonating the SSAI proxy. Pixalate's dedicated SSAI explainer reported that **26% of all SSAI transactions are invalid** and that **38% of programmatic OTT/CTV ad transactions use SSAI** — meaning over a quarter of more than a third of CTV programmatic spend was at risk through this vector [7]. Fraudsters spoof HTTP headers (X-Forwarded-For, X-Device-User-Agent) to fake the device and user behind a trusted, sometimes whitelisted, SSAI server [7]. **Recency caveat:** Pixalate's foundational SSAI explainer with the 26%/38% figures dates to 2019; the figures are widely re-cited but should be treated as dated and directional, not current [7].\n\n### 4.2 Named SSAI hijacking schemes (DV Fraud Lab)\n\nDV's Fraud Lab has identified and blocked a progression of increasingly sophisticated CTV schemes:\n- **SneakyTerra** — described by DV as the first-ever SSAI scheme to *hijack real CTV device sessions*; at peak it spoofed **over 2 million devices per day** and \"may have cost unprotected advertisers more than $5M per month,\" based on an average $20 CTV CPM [8].\n- **ParrotTerra / LeoTerra** — counterfeit-SSAI-server schemes generating fake inventory; DV reported ParrotTerra scaled over 3x as many unique device signatures daily as the earlier LeoTerra scheme and spoofed over 35% more apps [9 (via search)].\n\nThese are global schemes, but their data-center mechanism is exactly what dominates LATAM CTV fraud (Section 3).\n\n### 4.3 Fraudulent apps and the scale of the problem\n\nDV's 2026 report found **10x more fraudulent CTV apps in 2025 versus 2024**, identified **50+ distinct CTV bot attacks and variants in 2025**, and detected **140% more CTV fraud schemes and variants in Q1 2026 vs. Q1 2025** [4][6]. Even at conservative estimates, DV reckons fraud can cost advertisers ~**$1.8 million per billion CTV impressions** in unprotected campaigns [4].\n\n---\n\n## 5. Piracy / Illegal-Streaming Apps as a CTV Inventory-Quality Threat (LATAM-Specific)\n\nThis is the one fraud-adjacent vector where LATAM-specific, recent evidence is strong. Illegal IPTV and pirate-streaming apps are a major regional phenomenon, and they intersect with the ad-tech stack in two ways: (1) some pirate apps carry programmatic ads, laundering illegitimate inventory into legitimate buying; (2) they are vectors for malware and device compromise that can feed bot fraud. Each makes the region fertile ground for the schemes in Section 4.\n\n- A 2026 study commissioned by the Alliance for Creativity and Entertainment (ACE) and conducted by cybersecurity researcher Dr. Paul A. Watters found that in **Brazil, piracy platforms were on average 29x more likely to expose users to cyber threats than legitimate sites, rising to 54x in worst cases**; P2P piracy sites were up to 100x riskier [10][11]. **Nearly half of tested illicit streaming apps contained malware** [10].\n- In **September 2025**, a major law-enforcement operation centered in **Argentina** dismantled a global IPTV piracy network (brands including My Family Cinema, TV Express, Eppi Cinema) with an estimated **8 million subscribers**, operating through companies in Argentina, Brazil, Colombia, Singapore, China, the US and Canada [12]. A separate **Brazilian** pirate-IPTV operation was taken dark in November 2025 [13].\n\nThe advertising relevance is direct: pirate apps that monetize through ads represent inventory that should never enter a legitimate exchange, and their prevalence is part of why app-spoofing and fake-app fraud (Section 4) take hold in LATAM. The evidence base is advocacy-adjacent and trade/wire; the ACE study's funder has an obvious anti-piracy interest, disclosed here.\n\n---\n\n## 6. The Antidote Side: Protection, Certification & Transparency Standards\n\nThe same vendors that document the problem also document that protection works. Weigh the finding against their commercial interest — but it holds consistently across vendors.\n\n**Protected vs. unprotected.** DV's 2026 report puts protected CTV campaigns at a **<1% fraud rate** vs. **~9%** for unprotected [4]. IAS's 20th Media Quality Report (May 2025) found sophisticated ad fraud runs **15x higher when no pre-bid fraud protection is in place** [14][15]. Per DV, the CTV Authentic Viewable Rate reached **92% in both North America and Latin America**, with **LATAM showing an 18-point year-over-year improvement** — a rare positive LATAM-specific data point [4][6].\n\n**TAG certification.** TAG's Certified Against Fraud program reports that the IVT rate in TAG Certified Channels for CTV is just **0.60%** [16 (via search), 17]. TAG awarded a record **326 certification seals in 2025** (up from 321), with 34 companies at Platinum status [17]. **Gap:** TAG does not publish LATAM-specific certification counts — the geographic breakdown is absent [17].\n\n**Supply-path transparency standards.** IAB Tech Lab's ads.txt / app-ads.txt, sellers.json, and the OpenRTB SupplyChain Object are the structural defenses. They expose who is authorized to sell a given app's inventory and the full chain of intermediaries behind it. Streaming publishers adopted app-ads.txt comparatively quickly, but the IAB Tech Lab itself concedes adoption \"is not as high as we'd like it to be,\" and enforcement varies by partner and platform [18][19]. **Gap:** no public source quantifies LATAM-specific app-ads.txt / sellers.json adoption rates for CTV supply — a meaningful blind spot.\n\n---\n\n## 7. Brand Safety & Suitability: The FAST Metadata Problem\n\nBrand-safety risk in LATAM CTV comes less from overtly unsafe content than from *thin or absent content metadata* — the structural weakness of the FAST (Free Ad-Supported Streaming TV) explosion. FAST channels are multiplying fast across the region. Amagi's Global FAST Report (8th edition, August 2023) reported ~1,800 LATAM channel deliveries across 50+ FAST services and **150% year-over-year growth in LATAM ad impressions**, with CTV penetration growth of 94% in Brazil and 93% in Mexico (Q1 2022→Q1 2023) [20]. **Recency caveat:** the Amagi figures are from 2023 and describe growth rates, not current levels; they establish the *direction* — rapid FAST proliferation — rather than a 2026 snapshot.\n\nThe suitability problem follows directly. When thousands of new FAST channels launch with minimal program-level metadata, contextual classification and brand-suitability tooling have little to work with, so advertisers either over-block and lose reach or under-block and risk placement. IAS's 20th MQR (May 2025) noted that brand-risk from offensive language and hate speech rose even as overall brand risk stabilized [14][15]. The industry's answer is the shift toward curated PMPs and programmatic-guaranteed deals: Mordor Intelligence reports PMP guaranteed deals growing at a 14.9% CAGR in South America, \"reflecting advertiser preference for brand-safe inventory\" [21].\n\n---\n\n## 8. Pricing & CPMs: The Weakest Part of the Public Record\n\nThis is where neutral, country-level LATAM data runs out. No reliable public, multi-source benchmark of LATAM CTV CPMs exists broken out by country and by format (FAST vs. premium SVOD ad-tier vs. broadcaster) in local currency. Every pricing statement below is flagged accordingly.\n\n**What exists — US/global benchmarks (single-source, US-centric):**\nAdwave's Q1 2025 benchmark (published May 30, 2025) reports overall CTV CPMs averaging ~$25, ranging $15–$35 by targeting/platform, with [22]:\n- **FAST/broad inventory:** Tubi & Pluto ~$15–25; Roku Channel ~$20–35\n- **Premium SVOD programmatic:** Netflix $20–30; Hulu $10–30; Peacock $15–35; YouTube CTV $20–25\n- **Premium SVOD direct buys:** Netflix $45–65; Amazon Prime Video $25–60\n\nAdwave notes **CPM compression occurred 2024–2025 as supply expanded** (new ad tiers + FAST inventory) [22]. These are US/global figures — **not LATAM**.\n\n**What can be inferred about LATAM (explicitly inference):**\nLATAM CTV CPMs almost certainly sit *below* US benchmarks, for three reasons: (1) lower advertiser ARPU and ad budgets per capita; (2) FX — CPMs transacted in or converted to USD shrink in local-currency terms and vice versa, and currency volatility (especially Argentine peso, Brazilian real) makes cross-period comparison treacherous; (3) the elevated IVT/quality discount documented above suppresses prices for unverified open-auction supply. Mordor Intelligence frames the region's premium-supply dynamic — AVOD penetration above 95% of CTV households \"creating a premium supply that commands higher CPMs\" relative to other *local* digital formats — but publishes no LATAM CTV CPM figure [21][23]. The directional claim, then: LATAM CTV CPMs sit below US levels in absolute USD terms but command a premium *within* local digital-video markets. The precise numbers are not in the neutral public record.\n\n**FX effect (concrete):** currency moves reprice a USD CPM sharply. Argentina's high inflation and peso depreciation through 2024–2025 mean a \"stable\" USD CPM can be wildly unstable in pesos — a measurement caveat that renders any local-currency LATAM CPM series nearly meaningless without an explicit FX basis and date.\n\n---\n\n## 9. Frequency-Capping & Ad-Load Quality\n\nFrequency capping is a recurring CTV quality complaint globally, and its mechanics apply to LATAM, though no LATAM-specific measurement was located. The general findings (US/global trade): ad repetition reduces brand favorability by ~14% among heavy streamers; the cited \"sweet spot\" is roughly 4–6 exposures per viewer, with best-practice household caps of 3–5 views/week [24]. The structural LATAM risk is fragmented supply — many FAST apps, multiple SSPs, weak cross-app identity (discussed in the chapter on measurement and identity) — which makes household-level frequency capping hard to enforce, so the same ad over-serves across apps. Call this an inference for LATAM: the global mechanism plus the region's documented identity and fragmentation challenges imply a frequency-capping weakness, but nothing here measures it directly.\n\n---\n\n## 10. Country Synthesis\n\n- **Brazil** — Highest documented CTV IVT in the region (43% open-auction, Q2 2025) and the most volatile; largest market and largest pirate-IPTV footprint (29x cyber-risk multiple). Highest risk, highest opportunity. [1][2][3][10]\n- **Mexico** — More stable CTV IVT (~21–27%), but persistently above the global benchmark; elevated mobile-app IVT (39%, Q3 2025). [1][2][3][5]\n- **Argentina** — Nerve center of a dismantled 8M-subscriber IPTV piracy network (Sept 2025); severe FX and inflation make CPM measurement nearly meaningless without an FX basis. No country-level Pixalate CTV breakout located. [12]\n- **Colombia, Chile, Peru** — No country-level verification-vendor CTV IVT data located. All three turn up in the regional FAST growth surge (Amagi 2023: Peru +1,829% HOV, Chile +948% — growth rates, not levels) and the multi-country IPTV piracy network. Verification coverage is a clear gap for the smaller markets. [20][12]\n\n---\n\n## Open Questions\n\n1. **Why did Brazil's CTV IVT roughly triple (17%→43%) across two quarters?** No source attributes the swing to a named scheme; is it one campaign, a measurement-methodology change, or a genuine structural deterioration?\n2. **What is the actual LATAM CTV CPM, by country and format, in local currency?** The single largest data gap. No neutral source publishes it.\n3. **What is LATAM-specific app-ads.txt / sellers.json / SupplyChain Object adoption for CTV supply?** Standards exist; regional adoption is unquantified.\n4. **What are the verification-vendor IVT figures for Colombia, Argentina, Chile, and Peru?** Pixalate breaks out only Brazil and Mexico; the four smaller markets are dark.\n5. **How much pirate/IPTV inventory actually reaches legitimate programmatic exchanges in LATAM?** The cyber-risk and enforcement data are strong; the ad-monetization-leakage quantification is missing.\n6. **What share of LATAM CTV spend flows through curated PMP/PG vs. open auction?** This determines whether the scary open-auction IVT numbers describe the bulk of spend or a contained, avoidable slice.\n7. **Are DV's protected-campaign and Pixalate's open-auction populations reconcilable into a single \"true\" LATAM CTV fraud rate?** They measure different inventory; no source bridges them.\n\n---\n\n## Sources\n\n1. Pixalate, \"Q4 2024 LATAM Invalid Traffic (IVT) & Ad Fraud Benchmarks,\" GlobeNewswire, 2025-03-21. https://www.globenewswire.com/news-release/2025/03/21/3047296/0/en/Pixalate-Releases-Q4-2024-LATAM-Invalid-Traffic-IVT-Ad-Fraud-Benchmarks-Brazil-Most-At-Risk-to-Ad-Fraud-on-Mobile-Apps-37-Mexico-Saw-27-IVT-Rate-on-CTV.html (accessed 2026-06-17). Tier 5 (verification vendor, MRC-accredited).\n2. Pixalate, \"Q1 2025 LATAM IVT & Ad Fraud Benchmarks,\" GlobeNewswire, 2025-04-30. https://www.globenewswire.com/news-release/2025/04/30/3071750/0/en/Pixalate-Releases-Q1-2025-LATAM-Invalid-Traffic-IVT-Ad-Fraud-Benchmarks-Brazil-Most-At-Risk-to-Ad-Fraud-on-Mobile-Apps-42-Mexico-Saw-22-IVT-Rate-on-CTV.html (accessed 2026-06-17). Tier 5.\n3. Pixalate, \"Q2 2025 LATAM IVT & Ad Fraud Benchmarks,\" GlobeNewswire, 2025-08-27. https://www.globenewswire.com/news-release/2025/08/27/3140296/0/en/Pixalate-Releases-Q2-2025-LATAM-Invalid-Traffic-IVT-Ad-Fraud-Benchmarks-Brazil-Most-At-Risk-to-Ad-Fraud-on-Mobile-Apps-41-and-CTV-43.html (accessed 2026-06-17). Tier 5.\n4. DoubleVerify, \"Global Study: Fueled by AI, CTV Fraud Schemes Surge 140% Globally\" / 2026 Global Insights (\"Must-CTV\"), 2026-05-13. https://doubleverify.com/company/newsroom/global-study-ctv-fraud-schemes-surge-140-globally (accessed 2026-06-17). Tier 5 (verification vendor; protected-campaign population).\n5. Pixalate, \"Q3 2025 LATAM IVT & Ad Fraud Benchmarks: Mexico Mobile Apps See 39% IVT,\" GlobeNewswire, 2025-11-07. https://www.globenewswire.com/news-release/2025/11/07/3183930/0/en/Pixalate-Releases-Q3-2025-LATAM-Invalid-Traffic-IVT-Ad-Fraud-Benchmarks-Mexico-Mobile-Apps-See-39-Invalid-Traffic-IVT-Rate.html (accessed 2026-06-17). Tier 5.\n6. ExchangeWire, \"Global Study: Fuelled by AI, CTV Fraud Schemes Surge 140% Globally,\" 2026-05-13. https://www.exchangewire.com/blog/2026/05/13/global-study-fuelled-by-ai-ctv-fraud-schemes-surge-140-globally/ (accessed 2026-06-17). Tier 5 (trade press; reports DV figures incl. LATAM data-center split).\n7. Pixalate, \"Server-Side Ad Insertion (SSAI): The hidden driver of ad fraud in CTV/OTT,\" 2019-05-16. https://www.pixalate.com/blog/what-is-server-side-ad-insertion-ssai-fraud-ctv-ott (accessed 2026-06-17). Tier 5 — DATED 2019; figures directional only.\n8. DoubleVerify, \"Sophisticated SSAI Scheme Hijacks Real CTV Device Sessions\" (SneakyTerra). https://doubleverify.com/lp/report/ctv/verify/sophisticated-ssai-scheme-hijacks-real-ctv-device-sessions (accessed 2026-06-17). Tier 5.\n9. DoubleVerify, \"New CTV Fraud Scheme Dwarfs Previous Attacks\" (ParrotTerra/LeoTerra). https://doubleverify.com/new-ctv-fraud-scheme-dwarfs-previous-attacks/ (figures via search-result summary; landing page; accessed 2026-06-17). Tier 5 — partial (full report gated).\n10. Piracy Monitor, \"Latin America: Piracy sites tens of times riskier than legitimate sites… says ACE\" (ACE / Dr. Paul A. Watters study), 2026. https://piracymonitor.org/latin-america-piracy-sites-tens-of-times-riskier-than-legitimate-sites-p2p-are-the-worst-says-ace/ (accessed 2026-06-17). Tier 5 — funder ACE is an anti-piracy coalition (disclosed COI).\n11. Advanced Television, \"Studies highlight LatAm piracy cybersecurity risks,\" 2026-05-01. https://www.advanced-television.com/2026/05/01/studies-highlight-latam-piracy-cybersecurity-risks/ (accessed 2026-06-17). Tier 5 (trade).\n12. Advanced Television, \"Arrests in LatAm IPTV piracy case,\" 2025-09-18; LALIGA, \"Massive operation in Argentina dismantles global piracy network with over 8 million users.\" https://www.advanced-television.com/2025/09/18/arrests-in-latam-iptv-piracy-case/ (accessed 2026-06-17). Tier 4-5.\n13. TorrentFreak, \"Pirate IPTV Empire Goes Dark in Brazil,\" 2025-11-05. https://torrentfreak.com/pirate-iptv-empire-goes-dark-in-brazil-marketing-the-common-denominator-251105/ (accessed 2026-06-17). Tier 5 (specialist trade).\n14. IAS (Integral Ad Science), \"20th Media Quality Report,\" May 2025 (280B+ daily interactions). https://integralads.com/news/ias-media-quality-report-brand-risk-benchmark/ (accessed 2026-06-17). Tier 5 (verification vendor).\n15. PPC Land, \"IAS releases Media Quality Report: Fraud, Viewability, and Brand Risk trends,\" 2025. https://ppc.land/ias-releases-media-quality-report-highlighting-fraud-viewability-and-brand-risk-trends/ (accessed 2026-06-17). Tier 5 (trade summary of IAS).\n16. TAG, \"TAG Certified Channels Have 90% Less Fraud Than the Industry Average\" / CTV 0.60% IVT. https://www.tagtoday.net/insights/us-fraud-benchmark-research-2020 (accessed 2026-06-17). Tier 5 — US benchmark; CTV figure via search.\n17. TAG / PR Newswire, \"TAG Announces 2025 Certifications…\" 2025-03-06 (326 seals). https://www.prnewswire.com/news-releases/tag-announces-2025-certifications-for-companies-adopting-best-practices-for-fraud-brand-safety-malvertising-transparency-302394887.html (accessed 2026-06-17). Tier 5 — no LATAM breakout.\n18. Pixalate, \"Interview: IAB Tech Lab on app-ads.txt and OTT/CTV.\" https://www.pixalate.com/blog/iab-tech-lab-interview-app-ads-txt-ott-ctv (accessed 2026-06-17). Tier 5.\n19. IAB Tech Lab, \"ads.txt & app-ads.txt: Guidance for Inventory Sharing (CTV/OTT),\" explainer guide (2021). https://iabtechlab.com/wp-content/uploads/2021/03/ctv-app-ads-explainer-guide.pdf (accessed 2026-06-17). Tier 2-5 (standards body).\n20. Amagi, \"Brazil and Mexico Outpace U.S. in CTV Adoption Rates\" (Global FAST Report, 8th ed.), 2023-08-17. https://www.amagi.com/newsroom/brazil-and-mexico-outpace-us-in-ctv-adoption-rates-amagis-latest-fast-report-discovers (accessed 2026-06-17). Tier 5 — DATED 2023; growth rates not current levels.\n21. Mordor Intelligence, \"Latin America Programmatic Advertising Market — Trends, Growth & Size.\" https://www.mordorintelligence.com/industry-reports/latin-america-programmatic-advertising-market (accessed 2026-06-17). Tier 5 (market-research firm; methodology partly proprietary).\n22. Adwave, \"What is the average CTV CPM? (Q1 2025),\" 2025-05-30. https://adwave.com/resources/average-ctv-cpm (accessed 2026-06-17). Tier 5 — US/global, single-source; not LATAM.\n23. Mordor Intelligence, \"South America Programmatic Advertising Market Size, Share & 2030 Growth.\" https://www.mordorintelligence.com/industry-reports/south-america-programmatic-advertising-market (accessed 2026-06-17). Tier 5.\n24. Brandtailers, \"What's the Right CTV Frequency?,\" 2025-08-26; and supporting CTV frequency/ad-fatigue trade data. https://brandtailers.com/2025/08/26/whats-the-right-ctv-frequency/digital/ (accessed 2026-06-17). Tier 5 (trade) — US/global, not LATAM."}, {"order": 8, "file": "08_Players_Competition.md", "title": "Players & Competition — The LATAM Programmatic CTV Ad-Tech Landscape", "summary": "", "body": "# Players & Competition — The LATAM Programmatic CTV Ad-Tech Landscape\n\n## Bottom Line\n\nNo single vendor owns Latin American programmatic Connected TV. The region's defining structural fact is **fragmentation**: one household can be reached a dozen ways — a global FAST app, a broadcaster's BVOD, a telco's pay-TV streamer, a smart-TV OS, a retailer's video tier — with no shared identity spine across them. So the contest is less \"which DSP wins\" than **who can stitch fragmented supply into curated, brand-safe, ID-anchored deals and run them managed-service on the ground.** On the demand side, a small set of DSPs does most of the heavy lifting — Google's DV360, The Trade Desk, an ascendant Amazon DSP, plus Yahoo and DV360 as Netflix's programmatic conduits — almost always run through holding-company trading desks rather than self-served by brands. On the sell side, Google Ad Manager anchors the open layer while Magnite, PubMatic, Equativ/smartclip, FreeWheel and Microsoft Monetize contest premium CTV, often via PMP and programmatic-guaranteed rather than the open exchange. The most consequential 2026 event for the *independent* layer is **MiQ's March 2026 acquisition of Adsmovil's Latin America business**, which folds the region's largest independent retail-media + CTV + mobile-data operation into MiQ. Telcos (América Móvil/Claro, Telefónica/Vivo), broadcaster sales houses (Globo's GAMA, TelevisaUnivision/ViX on Magnite) and retail-media networks (Mercado Ads above all) are all converging into CTV from adjacent strongholds. Every \"currently operating\" status below is dated; several — notably the Canela–Pluto TV sales alliance and certain \"largest/leading\" superlatives — rest on vendor sourcing or sit near renewal windows, and should be read with that caveat.\n\n---\n\n## 1. How to Read This Market: The Competitive Geometry\n\nThe shape of the contest matters before any of the players do. LATAM programmatic CTV is not a single auction floor where buyers and sellers meet. It is a layered stack where the same impression can pass through very different combinations of technology, and the binding constraint is rarely raw inventory — there is plenty of that — but **identity, brand safety, measurement, and on-the-ground sales and trading talent.**\n\nFour observations frame everything that follows.\n\n**Fragmentation is the structural fact.** Every global FAST/AVOD platform is present (Pluto TV, Samsung TV Plus, LG Channels, The Roku Channel, Tubi, Prime Video's ad tier, and an overwhelmingly dominant YouTube), layered over broadcaster BVOD (Globoplay, ViX) and telco pay-TV streaming (Claro video, Vivo Play, DGO/SKY). No shared cross-platform ID exists, which pushes premium inventory toward PMP and programmatic-guaranteed rather than the open exchange. *(The full supply/demand map and the measurement/identity picture are covered in their own chapters.)*\n\n**Managed service dominates.** Advanced buying talent sits in a handful of metros — São Paulo, Mexico City, Bogotá, Buenos Aires — and most CTV budgets are *executed for* the advertiser by an agency desk or a managed independent, not self-served by the brand [1]. That privileges players with ground teams.\n\n**Convergence is the dominant motion.** Telcos, broadcasters, and retailers are all pushing *into* CTV from adjacent strongholds — telcos with subscriber data, broadcasters with premium content and first-party graphs, retailers with purchase data and on-site video. The map is not static. The live question is which adjacent player crosses into CTV demand-aggregation first.\n\n**Tentpole live is the proving ground.** Soccer — the Copa América, the FIFA Club World Cup, the 2026 FIFA World Cup — is where programmatic capability gets stress-tested at scale, and where the partnership announcements land.\n\n---\n\n## 2. The Global Demand-Side Platforms (DSPs)\n\n### Key Claim 2.1 — Netflix runs programmatic in Brazil and Mexico through five DSPs\n\n**Claim:** As of mid-2026, Netflix's ad-supported tier is buyable programmatically through five partner DSPs — The Trade Desk, Google Display & Video 360 (DV360), Microsoft, Yahoo DSP, and Amazon DSP — across the markets where Netflix sells ads, which include Brazil and Mexico.\n\n**Evidence:** Netflix announced its first programmatic partnership with The Trade Desk, with access \"starting in US, Canada, Mexico and Brazil\" [2]. At Cannes Lions in June 2025 Netflix added Yahoo DSP as its fourth partner, joining DV360, The Trade Desk, and Microsoft, across the ad-supported markets that include Mexico and Brazil; Yahoo integration was slated to go live by end-2025 [3]. On September 10, 2025 Amazon Ads and Netflix announced Amazon DSP as the fifth partner, covering eleven markets explicitly including **Mexico and Brazil**, available beginning Q4 2025 [4], corroborated by Variety [5] and Marketing Dive [6].\n\n### Key Claim 2.2 — The Trade Desk treats LATAM CTV as a growth vector but discloses no region-specific revenue\n\n**Claim:** The Trade Desk positions CTV (including premium streaming inventory such as Netflix and Disney) as its fastest-growing segment and operates in LATAM, but its public filings do not break out Latin America revenue, and no primary source confirms a standalone LATAM office footprint comparable to the managed independents.\n\n**Evidence:** TTD reported FY2025 revenue of $2.9B, up 18% YoY, with CTV growing faster than the overall business and premium-streaming partnerships (Netflix, Disney, Roku) central to the story [7]. In February 2026 TTD announced **Ventura**, its CTV operating system, and continued pushing **OpenPath** (direct publisher integration); notably, in February 2026 Dentsu and WPP exited OpenPath citing transparency/fee concerns [8] — a competitive-dynamics signal, not LATAM-specific. **Caveat:** TTD's LATAM presence is real, but its scale relative to DV360/Amazon in the region is not quantified in primary filings, and no LATAM revenue figure is publicly broken out.\n\n### Key Claim 2.3 — Amazon DSP is the fastest-growing demand engine and the conduit for Netflix in LATAM\n\n**Claim:** Amazon DSP is widely characterized as the fastest-growing CTV demand platform in LATAM, anchored by Amazon's commerce/first-party data and serving as a primary programmatic pipe for Netflix in Brazil and Mexico from Q4 2025.\n\n**Evidence:** The Amazon–Netflix Q4 2025 integration explicitly covers Brazil and Mexico [4, 5, 6]. The \"fastest-growing\" framing is analytical (trade press / eMarketer) rather than from a LATAM-specific primary disclosure.\n\n### Key Claim 2.4 — Google DV360 and Ad Manager anchor both demand and supply, but precise LATAM share is not primary-sourced\n\n**Claim:** Google's DV360 (demand) and Google Ad Manager / AdX (supply) sit at the center of LATAM programmatic CTV on both sides of the stack, and DV360 is one of Netflix's five programmatic partners; however, exact LATAM market-share figures for Google rest on third-party estimates, not primary disclosure.\n\n**Evidence:** DV360 is named among Netflix's programmatic partners [3]. Google's central position in LATAM open programmatic is consistently described across trade analysis, with Google Ad Manager / AdX as the sell-side leader, but any single percentage is an estimate; treat as directional.\n\n### Key Claim 2.5 — Microsoft's independent DSP exited; Monetize SSP retained\n\n**Claim:** Microsoft wound down its Invest DSP (the former Xandr buy-side), removing one independent DSP option from the region, while retaining the Monetize SSP (former Xandr Monetize) — which underpins Globo's GAMA marketplace technology.\n\n**Evidence:** Microsoft is still listed as one of Netflix's programmatic *buying* partners [3], indicating a Microsoft buying product persists in some form even after the legacy Xandr Invest DSP wind-down; the relationship between the surviving Microsoft buying product and the killed Xandr Invest DSP is a known point of confusion. The Monetize-SSP-powers-GAMA relationship is corroborated by Globo/GAMA documentation and trade reporting (see Claim 5.1). **Caveat:** no recent primary source pins down the exact current status of the Microsoft DSP product line in LATAM.\n\n---\n\n## 3. The Sell-Side Platforms (SSPs)\n\n### Key Claim 3.1 — Magnite holds the marquee broadcaster/streamer book in LATAM\n\n**Claim:** Magnite (including its SpringServe ad server) holds the deepest premium-publisher relationships in LATAM CTV — scaling programmatic for TelevisaUnivision's ViX, monetizing Vrio's DGO/SKY, and positioning as the largest independent SSP — with these relationships confirmed live through 2025–2026.\n\n**Evidence:** Magnite states it helps **TelevisaUnivision** scale programmatic across ViX and vMVPD inventory, with TelevisaUnivision carrying 18 months of major soccer rights including 18 matches of the 2025 FIFA Club World Cup [9]. Magnite's partnership with **Vrio** (DIRECTV Latin America + SKY Brasil) tripled ad volumes during Copa América (June–July 2024) on the DGO platform [10]; in February 2025 Magnite and DIRECTV Advertising extended this to live-streaming programmatic demand [11]. Company-wide, Magnite reported CTV growth accelerating to ~20% YoY in Q4 2025 and guided to ≥11% Contribution-ex-TAC growth for FY2026 [12]. In 2026 Magnite introduced \"Orchestration\" for agentic advertising [13] — relevant to where SSP competition is heading. **Vendor caveat:** the \"largest independent SSP\" superlative is Magnite's own framing.\n\n### Key Claim 3.2 — PubMatic anchors device-OEM and agency-curation mandates in LATAM\n\n**Claim:** PubMatic won two structurally important LATAM CTV mandates — powering **TCL Ads'** CTV monetization in the region, and the **December 2024 expansion of GroupM's Premium Marketplace (GPM)** into LATAM — both confirmed via PubMatic and GroupM materials.\n\n**Evidence:** PubMatic's case study states TCL Ads selected PubMatic's SSP and PMP solutions to scale its LATAM CTV inventory [14]. On **December 12, 2024**, PubMatic and GroupM announced the expansion of GroupM Premium Marketplace into LATAM, giving GroupM clients a unified curated path to buy CTV + video + display; the release cited LATAM programmatic spend rising from $5.2B (2017) to $16.77B (2023) with a projection of **$23.6B by 2028** [15]. Company-wide, PubMatic reported CTV revenue growing >50% YoY in a 2025 quarter [16]. **Vendor caveat:** market-sizing figures originate in the partnership release.\n\n### Key Claim 3.3 — Equativ (merged with Sharethrough) competes on OEM-app CTV supply\n\n**Claim:** Equativ — which fully unified with Sharethrough under the Equativ brand in June 2025 — is a contender on smart-TV-OEM app CTV supply (historically ranking strongly on Apple TV and Amazon Fire TV inventory) and operates the smartclip/smartx broadcaster-and-OEM stack, but its LATAM-specific positioning is less publicly disclosed than Magnite's or PubMatic's.\n\n**Evidence:** Equativ and Sharethrough announced their merger in June 2024; integration completed and both fully operated under the **Equativ** brand by June 2025, creating one of the largest global independent ad platforms (>$200M net recurring revenue at merger) [17][18]. The Titan OS partnership extends programmatic CTV home-screen video on Philips/AOC TVs across Europe and Latin America [19]. **Caveat:** the \"#1 LATAM CTV SSP on Apple TV / Fire TV\" claim seen in older material is not confirmed by a current primary source — treat it as dated.\n\n### Key Claim 3.4 — FreeWheel anchors broadcaster-grade supply but LATAM specifics are thin\n\n**Claim:** Comcast's FreeWheel is positioned as broadcaster-grade video/CTV ad-serving and SSP infrastructure with programmatic-guaranteed support, but recent, LATAM-specific FreeWheel deployment detail is limited in available sources.\n\n**Evidence:** FreeWheel's 2025–2026 activity is concentrated in named US/UK initiatives — biddable linear PMPs via Buyer Cloud (Oct 2025, 11B+ monthly impressions) and powering the UK Sky/Channel 4/ITV unified marketplace announced June 2025 [20] — none LATAM-specific. Its LATAM role is inferred from its global broadcaster franchise rather than directly documented.\n\n### Key Claim 3.5 — Smart-TV OEMs (Samsung, LG) monetize their own ACR-enabled inventory in LATAM\n\n**Claim:** Samsung Ads and LG Ad Solutions both operate ACR-enabled CTV ad businesses that extend to Latin America, with LG having replaced its legacy (Samba TV-based) ACR with a proprietary LG Ad Solutions ACR across multiple regions including LATAM.\n\n**Evidence:** LG Ad Solutions announced a global ACR upgrade replacing legacy Samba TV technology, deployed across Europe, Africa, Asia-Pacific, **Latin America**, and Australia [21]. Samsung Ads operates across global markets including Latin America, with Samsung TV Plus monetized in part via a Publica (a Samsung-owned SSP) partnership [22]. **Note:** these are device-maker supply businesses; their LATAM ad-revenue scale is not separately disclosed.\n\n---\n\n## 4. The Independent / Regional Ad-Tech Layer and the 2026 M&A Wave\n\n### Key Claim 4.1 — MiQ acquired Adsmovil's LATAM business in March 2026, creating the largest independent programmatic offering in the region\n\n**Claim:** On **March 25, 2026**, MiQ announced an agreement to acquire the **Latin America business of Adsmovil** (the US business excluded), bringing together 150+ employees across 12 markets — including all six country-deep-dive markets (Brazil, Mexico, Colombia, Argentina, Chile, Peru) — and positioning the combined entity as the largest independent programmatic solution in LATAM, with integrated retail-media (Linki), audience data (Adsmovil Personas), and >400M unique IDs feeding MiQ's Sigma platform, which MiQ said it would formally launch in LATAM in May 2026.\n\n**Evidence:** MiQ's announcement and corroborating coverage state the deal spans **12 markets** — Mexico, Brazil, Colombia, Argentina, Chile, Costa Rica, Ecuador, El Salvador, Guatemala, Peru, Puerto Rico, and Uruguay — and brings together **150+ employees** [23]; corroborated by Mexico Business News [24], Portada [25], PPC Land [26], and the sell-side advisor Digital Capital Advisors [27]. The **US business is excluded** and continues as a standalone company under Alberto Pardo (\"Banano\"), who also stays on as Chairman of MiQ LatAm; the LatAm business will be led by **Eric Tourtel**, MiQ's CEO of Latin America [23, 25]. The release describes enhanced solutions spanning mobile, retail media, CTV, video, YouTube and DOOH via on-the-ground managed-service teams, with **Sigma** integrating **Adsmovil Personas** data and the **Linki** multi-channel retail-media platform, and >**400M unique IDs**; **Sigma** to launch formally in LATAM in **May 2026** [23, 26]. **Caveat:** the deal was announced in March 2026 and, as of this writing in June 2026, no separate post-close confirmation or independent confirmation of the May-2026 Sigma launch had surfaced.\n\n### Key Claim 4.2 — Aleph Group (US Media lineage) consolidated LATAM digital representation via the Entravision deal\n\n**Claim:** Aleph Group completed its acquisition of **Entravision Global Partners (EGP)** — Entravision's digital advertising business, which itself had absorbed Cisneros Interactive's LATAM operations — on **July 1, 2024**, materially strengthening Aleph's role as a pan-LATAM digital-media representative (TikTok, Spotify, X, Pinterest, Criteo, Snap, etc.) across 29 markets.\n\n**Evidence:** Aleph announced completion on July 1, 2024 [28][29], reaching 140+ countries, 60+ media platforms, 26,000+ advertisers; the LATAM and Central America footprint corresponds to the former Cisneros Interactive operations [29]. Aleph founder Gaston Taratuta built the company from IMS (founded 2005); CVC Capital Partners took a stake in 2021 valuing it ~$2B [30]. **Caveat:** Aleph's CTV-specific (vs. broader digital-representation) footprint is not disclosed in these sources; its CTV role is inferred from its platform-representation model.\n\n### Key Claim 4.3 — Hawk was absorbed by Azerion (Feb 2025); it is no longer an independent LATAM-facing ad-tech brand\n\n**Claim:** \"Hawk,\" the multi-channel (mobile/DOOH/CTV/audio/in-game) programmatic platform, was fully acquired by **Azerion** in **February 2025**, so any reference to Hawk as a standalone LATAM ad-tech player is now a reference to an Azerion business unit.\n\n**Evidence:** Azerion announced it acquired a 100% stake in Hawk in February 2025, consolidating it into the Azerion platform [31]. So Hawk should be read as Azerion-owned, not independent.\n\n### Key Claim 4.4 — Canela Media sells Pluto TV inventory across much of Spanish-speaking LATAM, but the alliance is at/near a two-year renewal window\n\n**Claim:** Canela Media leads ad sales for Paramount's **Pluto TV** across ~14 Spanish-speaking LATAM markets (and Miami as a pan-regional hub, excluding Mexico) under a two-year alliance announced March 2024; in March 2025 Canela opened offices in Colombia and Miami. Because the original alliance was a *two-year* deal struck in March 2024, its continuation past ~March 2026 would require fresh confirmation.\n\n**Evidence:** Paramount and Canela Media announced the exclusive two-year alliance in March 2024, with Canela leading Pluto TV ad sales in Colombia, Peru, Ecuador, Bolivia, Uruguay, Costa Rica, Dominican Republic, El Salvador, Guatemala, Honduras, Nicaragua, Panama, Paraguay, and Venezuela, plus Miami as a hub [32]. A March 2025 report indicates Canela opened Colombia and Miami offices and reported combined regional sales rising fourfold [33] — though the \"fourfold\" figure is a single aggregator claim and should be read as such. **Caveat:** the explicit two-year term means the alliance may be at renewal as of mid-2026, and no mid-2026 source confirming renewal has surfaced.\n\n### Key Claim 4.5 — Yieldmo and other intermediaries are present but LATAM-CTV-specific disclosure is thin\n\n**Claim:** Yieldmo (a US-based supply/curation and creative-format ad-tech firm) and several other intermediaries are present in the LATAM ecosystem, but no recent primary source details a distinct Yieldmo LATAM CTV operation; its inclusion in the competitive set rests on secondary material.\n\n**Evidence:** No 2025–2026 primary source surfaced confirming a Yieldmo LATAM CTV footprint. It is best treated as a named-but-unconfirmed participant rather than asserted as live.\n\n---\n\n## 5. Broadcaster Sales Houses and Telcos\n\n### Key Claim 5.1 — Globo's GAMA marketplace is the gravitational center of Brazilian premium programmatic\n\n**Claim:** Globo operates **GAMA (Globo Ad Marketplace)**, a programmatic media marketplace built on Microsoft/Xandr technology that cross-references Globo's first-party data (associated with 140M+ consumers across G1, Globoplay, etc.) with partner and third-party data, spanning inventory from desktop to DOOH; an API for automated reporting is slated for H2 2026.\n\n**Evidence:** GAMA is described as a programmatic ad marketplace built on Xandr technology using Globo's proprietary data on 140M+ consumers, with access to programmatic inventory from desktop to DOOH and an H2-2026 reporting-API roadmap [34]. Globo also carries FIFA World Cup 2026 rights on TV in Brazil, protecting national matches, the final, and roughly half the tournament inventory, while all 104 matches stream free on YouTube via CazéTV [35]. **Caveat:** Globo/GAMA descriptions are partly vendor-sourced, and the Microsoft-Monetize-powers-GAMA link carries the same open question noted under Claim 2.5.\n\n### Key Claim 5.2 — TelevisaUnivision's ViX is the flagship Spanish-language AVOD, scaled programmatically by Magnite\n\n**Claim:** TelevisaUnivision's **ViX** (free AVOD + premium-with-ads) is the flagship Spanish-language streaming ad property in the region, with Magnite providing programmatic scale across ViX and vMVPD inventory, reinforced by a major soccer-rights portfolio through 2026.\n\n**Evidence:** See Claim 3.1 [9]; the ViX–Magnite relationship and the 2025 FIFA Club World Cup rights are corroborated in Magnite materials and trade coverage. **Vendor caveat applies.**\n\n### Key Claim 5.3 — Telcos (América Móvil/Claro, Telefónica/Vivo) are data/inventory players moving toward addressable advertising\n\n**Claim:** The region's dominant telcos — América Móvil (Claro; 310M+ wireless subscribers as of end-2023) and Telefónica (Vivo in Brazil) — possess subscriber data and pay-TV/streaming inventory positioning them as addressable-advertising and data players, with Claro Brasil specifically building advertising revenue (e.g., a 10-year ICARO Media Group content/ad deal signed October 2024).\n\n**Evidence:** América Móvil reported 310.1M wireless subscribers at year-end 2023 and committed ~$7.7B to Claro Brasil over 2024–2029 [36]. ICARO Media Group announced a 10-year contract with Claro Brasil in October 2024 to grow advertising revenue across Claro's platforms and pay-TV channels via digital ad placement [37]. Telefónica invested ~$1.97B in Vivo in 2023 [36]. **Caveat:** telcos' *programmatic CTV* advertising scale specifically is not separately disclosed; their role is best described as data/inventory potential converging into addressable, not yet a quantified CTV demand or supply position. (TIM Brasil's CTV-ad role is not separately documented.)\n\n### Key Claim 5.4 — América Móvil and Telefónica's CTV-ad monetization is nascent relative to their distribution scale\n\n**Claim:** Despite enormous distribution scale, the telcos' direct programmatic-CTV monetization is early-stage; their clearest near-term value is as first-party-data and addressable-inventory contributors (operator graphs, set-top/streaming data) rather than as standalone DSP/SSP competitors.\n\n**Evidence:** This is a synthesis of Claim 5.3's evidence plus the general managed-service/fragmentation dynamics described elsewhere; no single source asserts it directly.\n\n---\n\n## 6. Retail Media Converging Into CTV\n\n### Key Claim 6.1 — Mercado Ads (Mercado Libre) is the dominant LATAM retail-media network and is building a full-funnel CTV offering\n\n**Claim:** Mercado Libre's **Mercado Ads** is the region's dominant retail-media network — projected to command more than half of LATAM retail-media ad spend — and in 2025–2026 it is consolidating into a full-funnel media platform that adds CTV/streaming inventory (Roku, Samsung TV Plus, OTT) activated on first-party marketplace behavior; its ad revenue is projected to roughly double to ~$1.9B in 2026.\n\n**Evidence:** eMarketer projects Mercado Libre to capture more than half of LATAM retail-media ad spending and its digital ad revenue to nearly double to **$1.90B in 2026** (~6.7% of LATAM digital ad market) [38]. Mercado Ads reported Q3 2025 ad growth of ~56% in USD with Display & Video nearly doubling YoY, and Q2 retail-media revenue +59% YoY currency-neutral [39]. Mercado Ads is publicly described as moving toward a CTV + retail-media model, expanding audiovisual inventory across Roku, Samsung TV Plus, and OTT, activating audiences on real marketplace behavior [40]. **Note:** the CTV-platform descriptions partly originate in trade/aggregator coverage; the eMarketer figures are the firmer numbers.\n\n### Key Claim 6.2 — Roku Curate and the Amazon–Roku authenticated footprint are US-centric, not LATAM (a common misattribution)\n\n**Claim:** The June 2025 Amazon Ads–Roku \"largest authenticated CTV footprint\" partnership and Roku Curate's retail-data bundling are **US**-scoped (≈80M US CTV households, >80% of US CTV households), and should *not* be cited as a LATAM development.\n\n**Evidence:** Amazon Ads and Roku announced the partnership in June 2025 explicitly delivering authenticated reach to ~80M **U.S.** CTV households (>80% of U.S. CTV households per Comscore), available to Amazon DSP advertisers in the **U.S.** by Q4 2025 [41]. It is sometimes mistaken for a LATAM development, but the primary sources scope it to the US. LATAM addressability gains from Amazon DSP come via Netflix (Claim 2.1) and Amazon's own commerce data, not this authenticated-footprint deal.\n\n---\n\n## 7. Where Competition Is Intensifying\n\nFive fronts are heating up.\n\n**The independent managed layer just consolidated.** MiQ + Adsmovil (Claim 4.1) creates a single independent player with retail-media, CTV, mobile data, ground teams, and an ID spine across the six deep-dive markets. It raises the bar for every other independent and forces the agency desks to differentiate on something other than access.\n\n**Retail media is the fastest demand source crossing into CTV.** Mercado Ads (Claim 6.1) is becoming a de-facto CTV demand aggregator, reselling premium streaming inventory against marketplace purchase data. That is the most distinctive LATAM dynamic of all, because the retailer owns both ends — the closed-loop measurement and the inventory relationship.\n\n**The DSP contest is a five-way race for Netflix and premium streaming.** Five DSPs (Claim 2.1) now compete to intermediate the same premium ad-tier inventory, so the edge shifts to data, curation, and measurement rather than raw access.\n\n**SSP competition is moving to curation and \"agentic\" automation.** Magnite's Orchestration (Claim 3.1) and PubMatic's agency-curation wins (Claim 3.2) show the sell-side battle is over who controls the curated PMP path agencies actually buy through — not over open-exchange share.\n\n**Tentpole live is the proving ground.** With Globo, TelevisaUnivision, and Telemundo all enabling programmatic/DAI around the 2026 World Cup (Claims 5.1–5.2, and Telemundo's programmatic DAI plans [42]), the tournament becomes the region's single largest stress-test — and its loudest showcase.\n\n---\n\n## Open Questions\n\n1. **Has the MiQ–Adsmovil deal closed, and did Sigma launch in LATAM in May 2026 as announced?** The March 2026 announcement is firm; a post-close (and post-launch) confirmation dated June 2026 was not located.\n2. **Is the Canela–Pluto TV alliance still live after its two-year term (March 2024 → ~March 2026)?** No renewal source dated mid-2026 located.\n3. **What exactly is Microsoft's surviving buy-side product in LATAM** after the Xandr Invest DSP wind-down, and does Monetize still power GAMA today? The Microsoft-as-Netflix-partner listing implies a live buying product, but its identity/scope is unverified.\n4. **What is The Trade Desk's and DV360's actual LATAM revenue / share?** No primary-source regional breakout exists; all share figures are estimates.\n5. **What is the real LATAM-CTV-specific footprint of Equativ, FreeWheel, Yahoo DSP, and Yieldmo** beyond global positioning? Disclosure is thin; some inclusions are inferred.\n6. **How large is telco (Claro/Vivo/TIM) programmatic-CTV monetization** as opposed to subscriber scale? No quantified CTV-ad figures located; TIM Brasil's role is unsourced here.\n7. **Does Aleph's representation model translate into a distinct CTV demand/supply position**, or is it primarily social/digital-platform representation? CTV specificity not disclosed.\n8. **How will the 2026 FIFA World Cup actually allocate programmatic vs. direct inventory** across Globo, TelevisaUnivision, and others in LATAM? Detail beyond Telemundo/Globo headline plans is limited.\n\n---\n\n## Sources\n\n1. AdExchanger, \"Why Breaking Into Latin American CTV Starts With Mobile,\" April 19, 2022 (dated; DigitalReef profile; managed-service + mobile-first framing). https://www.adexchanger.com/digital-tv/why-breaking-into-latin-american-ctv-starts-with-mobile/ — Tier 5 (specialized trade). Accessed 2026- % stake). https://www.azerion.com/azerion-acquires-hawk-and-consolidates-its-position-in-the-digital-advertising-market/ — Tier 1 (announcement). Accessed 2026-06-17.\n32. Paramount / Canela Media, \"Paramount and Canela Media Announce Strategic Alliance In Key Latin American Markets and Miami\" (March 2024; two-year; ~14 markets). https://www.prweb.com/releases/paramount-and-canela-media-announce-strategic-alliance-in-key-latin-american-markets-and-miami-302080006.html — Tier 1 (press release as claim). Accessed 2026-06-17.\n33. Search summary (Canela opened Colombia + Miami offices March 2025; \"sales fourfold\" — unverified aggregator claim). — Tier 7 (single-source/aggregated; flagged). Accessed 2026-06-17.\n34. GAMA Ad Marketplace (gama.globo) and Meio & Mensagem coverage (Xandr tech; 140M+ consumers; desktop→DOOH; H2-2026 API). https://gama.globo/ — Tier 1 (vendor) + Tier 5 trade. Accessed 2026-06-17.\n35. FIFA / trade (2026 World Cup broadcast partnerships; Globo TV rights + CazéTV 104 matches on YouTube). https://inside.fifa.com/media-releases/world-cup-2026-broadcast-partnerships-global-benchmark-record-reach-innovation — Tier 1/Tier 5. Accessed 2026-06-17.\n36. AméricaEconomía / corporate, \"América Móvil to invest US$7.7 billion in Claro Brasil 2024-2029\" (310.1M wireless subs YE2023; Telefónica $1.97B Vivo 2023). https://www.americaeconomia.com/en/business-industries/america-movil-invest-us-77-billion-claro-brasil-2024-2029 — Tier 4/5. Accessed 2026-06-17.\n37. ICARO Media Group / PRNewswire, \"ICARO Media Group Announces 10-Year Contract with América Móvil's Claro Brasil,\" October 2024. https://www.prnewswire.com/news-releases/icaro-media-group-announces-10-year-contract-with-america-movils-claro-brasil-302273260.html — Tier 1 (press release as claim). Accessed 2026-06-17.\n38. eMarketer, \"Mercado Libre to command half of Latin America's retail media market this year\" / \"Mercado Libre's ad business soared in Q2\" (digital ad rev ~$1.90B 2026, ~6.7%
