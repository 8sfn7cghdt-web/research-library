. [SatNews / Dataxis — Brazil FTA, pay-TV decline as streaming soars](https://satnews.com/2024/08/21/brazil-fta-pay-tv-decline-as-streaming-soars/) — Tier 5. Accessed 2026-06-17.\n49. [eMarketer — Pay-TV penetration on slow decline across LATAM](https://www.emarketer.com/content/pay-tv-penetration-on-slow-decline-across-latam) — Tier 5. Accessed 2026-06-17.\n50. [Statista — Number of pay-TV subscribers by LATAM country](https://www.statista.com/statistics/484453/number-pay-tv-subscribers-countries-latin-america/) — Tier 5. Accessed 2026-06-17.\n51. [MarketDataForecast — LATAM Pay TV market](https://www.marketdataforecast.com/market-reports/latin-america-pay-tv-market) — Tier 5. Accessed 2026-06-17.\n\n**Free-to-air / DTV+ (TV 3.0)**\n20. [NAB Blog — Brazil's adoption of a NextGen TV standard (DTV+)](https://www.blog.nab.org/2025/09/17/brazils-adoption-of-a-nextgen-tv-standard-a-welcome-signal-for-the-u-s-transition/) — Tier 5/6, industry association blog. Accessed 2026-06-17.\n21. [TV Tech — Brazil makes it official: new DTV+ standard leverages ATSC 3.0 tech](https://www.tvtechnology.com/news/brazil-makes-it-official-new-dtv-standard-leverages-atsc-3-0-tech) — Tier 5, trade. Accessed 2026-06-17.\n22. [MixVale — Intelbras and Aquario begin sales of first TV 3.0 receivers (Jun 2026)](https://www.mixvale.com.br/2026/06/06/intelbras-and-aquario-begin-sales-of-the-first-receivers-with-tv-3-0-technology-in-brazil-for-the-2026-world-cup-en/) — Tier 5, Brazilian trade. Accessed 2026-06-17.\n\n**Mobile economy / 5G / infrastructure constraints**\n23. [GSMA — The Mobile Economy Latin America 2026](https://www.gsma.com/about-us/regions/latin-america/gsma_resources/the-mobile-economy-latin-america-2026/) — Tier 2, industry body. Accessed 2026-06-17.\n24. [GSMA — Usage Gap press release](https://www.gsma.com/newsroom/press-release/gsma-calls-for-renewed-focus-on-closing-the-usage-gap-as-more-than-3-billion-people-remain-offline-despite-available-mobile-internet-services/) — Tier 2. Accessed 2026-06-17.\n25. [S&P Global — LATAM & Caribbean mobile market overview (2025)](https://www.spglobal.com/market-intelligence/en/news-insights/research/2025/09/latin-america-and-the-caribbean-mobile-market-overview) — Tier 5. Accessed 2026-06-17.\n26. [RCR Wireless / GSMA — 5G to reach 55% of LatAm connections by 2030](https://www.rcrwireless.com/20240612/featured/5g-reach-55-mobile-connections-latam-2030-gsma) — Tier 5 citing GSMA. Accessed 2026-06-17.\n27. [BusinessWire — FBA LATAM 2025 FTTH Panorama, $5B+ investment](https://www.businesswire.com/news/home/20260422401272/en/Fiber-Broadband-Association-LATAM-Releases-2025-FTTH-Panorama-Highlighting-Market-Maturity-and-$5B-Investment-Across-the-Region) — Tier 1/5 (release of association report). Accessed 2026-06-17.\n28. [Analysys Mason — 5G launches 1H 2025](https://www.analysysmason.com/research/content/articles/5g-launches-1h2025-rma18/) — Tier 5. Accessed 2026-06-17.\n52. [IEA — Peru National Plan for Rural Electrification 2024–2033](https://www.iea.org/policies/25790-national-plan-for-rural-electrification-2024-2033) — Tier 1/2, IGO policy database. Accessed 2026-06-17.\n\n---\n\n*This chapter covers connectivity, devices, OS/platform, viewing behaviour, and infrastructure only — ad-spend dollars, ad-tech intermediaries, and measurement/identity are taken up elsewhere. Quantitative claims carry source URLs; figures resting on a single commercial tracker (Dataxis, Pixalate) are flagged as such; denominators (households vs. population vs. internet users vs. ad-traffic SOV) are noted at each table. Present-tense platform/standard status (Roku MX/BR, DTV+) is sourced to mid-2026. The YouTube-on-TV definitional fork is flagged, not resolved.*"}, {"order": 6, "file": "06_Regulation_Privacy.md", "title": "Regulation & Privacy — The Legal Substrate of Data-Driven CTV in Latin America", "summary": "", "body": "# Regulation & Privacy — The Legal Substrate of Data-Driven CTV in Latin America\n\n## Bottom Line\n\nThe legal ground under Latin American programmatic CTV is shifting faster than the ad-tech stack built on top of it. Three of the six focus countries are mid-transition on the privacy law that decides whether you can target a viewer at all. **Mexico** dissolved its independent data-protection regulator (INAI) and moved enforcement to an executive ministry under a law in force since March 2025. **Chile** enacted a GDPR-style overhaul (Law 21.719) that creates a real regulator with revenue-scaled fines, but it does not take effect until **December 1, 2026**. **Argentina** — the only LATAM country holding an EU adequacy decision — is running a slate of competing reform bills through Congress, none yet enacted. **Brazil** is the maturity anchor: the LGPD is enforced by an active ANPD that has issued binding international-transfer rules (Resolution 19/2024, mandatory standard contractual clauses since August 2025) and is prioritizing children's data, biometrics and scraping. **Colombia** (Ley 1581 plus the SIC) and **Peru** (Ley 29733 plus a new 2024 regulation effective March 2025) round out a region converging on a GDPR-derived template — legitimate interest as a lawful basis for advertising, but with an opt-out and a hard carve-out for children — even as the independence of the regulators diverges sharply. On top sits a second, faster-moving body of **advertising and content law** aimed squarely at the inventory CTV monetizes: Brazil's 2024-25 sports-betting (\"Bets\") advertising regime; its newly-enforceable **ECA Digital** (Law 15.211/2025, enforceable March 2026), which bans behavioral profiling in ads to minors; content quotas and Condecine-type levies on streaming (a Brazilian VOD bill still pending; Mexico's July 2025 telecom law imposing a 30% national-content rule); and region-wide 19-21% VAT on foreign digital services. The single most important caution for any vendor planning LATAM CTV through 2030: several of the load-bearing facts here are *pending bills with effective dates*, not settled law, and at least two regulators (Mexico's successor body, Chile's not-yet-operational agency) are themselves going-concern questions whose real-world posture is unknown.\n\n---\n\n## 1. The Regional Pattern: A GDPR-Derived Template With Divergent Enforcement\n\nBefore the country detail, look at the shared shape — it determines what a programmatic CTV operation can do *anywhere* in the region.\n\n### Claim 1.1 — Latin America is converging on a GDPR-derived data-protection template, but on different timelines\n\nEvery one of the six focus countries has, or is actively building, a data-protection regime modeled on the EU GDPR and Brazil's LGPD: a multi-basis lawful-processing framework (consent plus legitimate interest, contract, and others), data-subject rights (access, deletion, portability, objection), cross-border transfer controls, and a dedicated supervisory authority. Chile's Law 21.719 is \"modeled explicitly on the EU GDPR and incorporating lessons from Brazil's LGPD\" [7]; Argentina's reform bills \"aim to align Argentine regulations with international standards, such as the GDPR... and Brazil's [LGPD]\" [13]; Peru's 2024 regulation reaches extraterritorially to \"foreign companies that offer goods or services to individuals in the country or that develop profiles\" [16], mirroring GDPR Article 3. This convergence is the single most useful planning fact: a privacy program built to a GDPR/LGPD baseline is directionally correct across the region, with country-specific deltas.\n\n### Claim 1.2 — Legitimate interest is an available lawful basis for advertising in the mature regimes, but carries an opt-out and excludes children\n\nIn Brazil, \"companies may rely on legitimate interest for advertising purposes, provided for in Articles 7(IX) and 10 of the LGPD,\" and the ANPD's own guide confirms data subjects \"have the right to oppose processing... based on legitimate interest\" [3]. This basis is the backbone of most programmatic targeting in the region's mature markets — but it is weaker than the EU equivalent in one direction (children are carved out, see §2 and §7) and contested in another (consent is still the safer basis for sensitive data and for cookie-based tracking). For CTV specifically, this means contextual and first-party/logged-in targeting sit on firmer legal ground than third-party-cookie-style behavioral profiling, which the region is collectively narrowing.\n\n### Claim 1.3 — Regulator independence is diverging, not converging\n\nThe *substance* of the laws converges; the *institutional* picture splits. Brazil (ANPD), Colombia (SIC), Peru (ANPD/MINJUS) and — on paper — Chile (the new APDP) have or will have identifiable supervisory authorities, and Argentina retains the AAIP. Mexico went the other way in 2025, **dissolving** its autonomous regulator INAI and folding enforcement into an executive-branch ministry [1]. This matters for CTV because regulator independence and capacity drive enforcement predictability — and predictability is what an ad-tech compliance program is actually buying.\n\n---\n\n## 2. Brazil — The Maturity Anchor (LGPD + ANPD)\n\nBrazil is the region's largest CTV market and its most developed privacy regime, so it sets the template the others chase.\n\n### Claim 2.1 — Brazil's LGPD is enforced by an active ANPD with revenue-scaled fines\n\nThe Lei Geral de Proteção de Dados (LGPD, Law 13.709/2018) is enforced by the Autoridade Nacional de Proteção de Dados (ANPD). The LGPD permits administrative fines of \"up to 2 percent of the controller's revenue from its activity in Brazil in the prior fiscal year, capped at BRL 50 million per infraction,\" plus warnings, corrective orders, and the power to \"partially or fully suspend processing activities\" [3]. Enforcement \"escalated through 2024 and 2025, with the agency issuing some of its first significant administrative fines by 2025, including against foreign platforms\" [3]. The teeth are real and already biting. Brazil is the regional anchor, and the ANPD's posture is the most consequential single regulatory fact in the region.\n\n### Claim 2.2 — The ANPD's 2025-2026 enforcement priorities target the core of data-driven advertising\n\nThe ANPD's stated enforcement roadmap \"prioritizes children's data, AI/biometrics, and data scraping,\" and its 2025/early-2026 actions cluster around \"ambiguous or absent consent banners, lack of a Portuguese-language privacy notice, and cross-border transfers without a valid mechanism\" [3]. Each maps directly onto programmatic CTV practice: consent UX, identity/ACR data, and cross-border data flows to global DSPs/SSPs. The regulator is, in effect, walking the ad-tech stack.\n\n### Claim 2.3 — Cross-border transfers now require ANPD standard contractual clauses (since August 2025)\n\nANPD Resolution CD/ANPD No. 19/2024 (August 2024) introduced mandatory Standard Contractual Clauses for international transfers, covering controller-to-controller and controller-to-processor flows; companies had \"until August 23, 2025 to comply,\" and the SCC text \"must be adopted in its entirety... without amendments\" [4][19]. Alternatives include Binding Corporate Rules or future adequacy decisions — but \"none [adequacy decisions] have been issued yet\" [19]. This is the concrete mechanism by which a US/EU-headquartered CTV platform legally moves Brazilian audience data. The grace period has closed; the obligation is present-tense.\n\n### Claim 2.4 — Brazil's sports-betting (\"Bets\") regime restricts a major CTV ad category (in force since Jan 1, 2025)\n\nLaw 14.790/2023 regulates fixed-odds sports-betting and its advertising; under that law and Ordinance SPA/MF No. 827/2024, \"starting from January 1, 2025, only gaming companies duly authorised by the SPA/MF [the Finance Ministry's Secretariat of Prizes and Bets] will be allowed to operate and advertise in Brazil\" [5]. The advertising rules sit in Law 14.790/2023, Ordinance SPA/MF No. 1.231/2024, and Annex X of CONAR's self-regulatory code; the ordinance \"emphasises the need to promote and advertise betting in a socially responsible manner\" [5]. In September 2025, CONAR and the SPA signed a cooperation agreement to tighten oversight of betting advertising [5]. Betting and iGaming has been one of the fastest-growing CTV ad categories in Brazil, so a licensing-gated, content-restricted regime directly shapes inventory demand.\n\n### Claim 2.5 — Brazil's ECA Digital (Law 15.211/2025) bans behavioral profiling in advertising to minors and is enforceable as of March 17, 2026\n\nThe Digital Child and Adolescent Statute (\"ECA Digital,\" Law 15.211) was \"enacted on 17 September 2025\" and became \"enforceable\" on \"March 17, 2026\" [18]. Chapter VIII \"prohibits the use of profiling techniques, including behavioral tracking and data-driven personalization, for commercial advertising purposes\" directed at children (under 12) and adolescents (12-18), and \"bans the use of emotional analysis, as well as augmented reality... and virtual reality, in advertising campaigns targeting minors\" [18]. Penalties reach \"up to 50 million Brazilian reais... or up to 10% of revenue earned in Brazil\" [18]. The law covers services \"targeted at or likely to be accessed by\" minors — a likely-to-be-accessed standard that sweeps in general-audience streaming. This is arguably the single most CTV-relevant new statute in the region: a flat prohibition on behavioral ad targeting in any environment minors plausibly reach.\n\n### Claim 2.6 — The older CONANDA Resolution 163/2014 already treats child-directed advertising as \"abusive\"\n\nCONANDA Resolution No. 163 (March 13, 2014) \"considers abusive all types of advertising and marketing communications designed to target children and adolescents,\" including the use of \"childish language, special effects... soundtracks with children's songs... [and] representations of children\" [10]. It covers \"television commercials\" and a broad list of marketing communications [10]. The ECA Digital layers on top of this pre-existing self-regulatory/administrative baseline rather than replacing it. Note: Resolution 163 has drawn litigation over CONANDA's rule-making authority; its precise binding force on private advertisers has been contested [10], which is why the statutory ECA Digital is the more consequential instrument going forward.\n\n### Claim 2.7 — A Condecine-type levy and content quota on streaming remains a PENDING bill, not enacted law\n\nBill PL 2331/2022 would require VOD/streaming services to pay the Condecine levy (Contribuição para o Desenvolvimento da Indústria Cinematográfica Nacional) and to carry minimum Brazilian content. The rate moved through the process — the Senate's Economic Affairs Committee approved a version in November 2023 with a 3% rate above R$96M revenue, while a Chamber draft proposed 6% [11]. Quota proposals include a \"minimum of 10% of Brazilian content\" and absolute catalog minimums (e.g., 100 Brazilian works for catalogs of 2,000+) [11]. ANCINE would supervise [11]. **As of June 2026 the bill \"was approved by the House Culture Commission, and is now awaiting approval from the broader House\"** [11] — i.e., it is NOT yet law. Treat any \"Brazil taxes streaming at X%\" claim as contingent on this bill's passage; the rate and quota numbers are still moving.\n\n---\n\n## 3. Mexico — The Outlier: Regulator Dissolution and a 2025 Reform\n\nMexico is the region's second-largest CTV market — and the one whose institutional architecture changed most disruptively in 2025.\n\n### Claim 3.1 — Mexico's new LFPDPPP entered force March 21, 2025, dissolving INAI and moving enforcement to an executive ministry\n\nThe decree enacting the new Federal Law on the Protection of Personal Data Held by Private Parties (LFPDPPP) \"entered into force on March 21, 2025\" [1]. It follows a constitutional reform \"published in the Official Gazette on 20 December 2024\" that dissolved the autonomous regulator INAI and transferred its functions to the **Secretariat of Anti-Corruption and Good Governance (SABG)** [1]. A decentralized body under SABG, \"Transparency for the People\" (Transparencia para el Pueblo), now replaces INAI for certain functions, with the ministry \"empowered to investigate complaints, conduct audits, and impose sanctions\" [1].\n\n### Claim 3.2 — The successor regulator absorbed most of INAI's mandate with a fraction of its staff — an enforcement-capacity going-concern question\n\nAnalyst estimates cited in firm alerts suggest \"SABG absorbed roughly 80 percent of INAI's functional responsibilities with only about 35 percent of the staffing structure,\" with all of INAI's unresolved matters transferring over, which \"analysts expected would produce longer resolution times in the transition period\" [1]. The 80%/35% figures are analyst estimates, not official, and trace to law-firm and analyst commentary rather than a primary government source. Read this as a caution: the *law* exists and is in force, but the *enforcement body* is new, under-staffed relative to its mandate, and unproven against ad-tech as of mid-2026.\n\n### Claim 3.3 — Mexico's July 2025 telecom/broadcasting law imposes a 30% national-content rule and restructures the regulator\n\nOn July 16, 2025, Mexico published a new Federal Law on Telecommunications and Broadcasting (LFTR/LMTR), repealing the 2014 law; it dissolved the Federal Telecommunications Institute (IFT) and created the Agencia de Transformación Digital y Telecomunicaciones (ATDT) as policy-maker, plus a Comisión Reguladora de Telecomunicaciones (CRT) [9]. Reporting indicates OTT platforms face a 30% national-content requirement [9, via TTV News], and \"digital platforms will be prohibited from selling advertising slots for... advertising, propaganda, or any information from foreign governments\" [9]. It passed the Senate June 28, 2025 and the Chamber of Deputies July 1, 2025 [9]. The 30% content figure leans on one trade source (TTV News) and should be confirmed against the law text.\n\n### Claim 3.4 — Mexico applies VAT to foreign digital services (16%), separate from the privacy regime\n\nMexico is among LATAM countries taxing the digital economy; while the CIAT/Bloomberg surveys group Mexico with the regional VAT-on-digital-services trend, Mexico's headline VAT rate is 16% (lower than the 18-22% band cited for Argentina/Chile/Colombia/Peru/Uruguay) [22]. The regional surveys [22] foreground the higher-rate countries; the 16% Mexican rate is widely documented but not the focus of the cited surveys, so treat as background.\n\n---\n\n## 4. Colombia — Ley 1581, the SIC, and Rising Enforcement\n\n### Claim 4.1 — Colombia's data-protection regime (Ley 1581/2012) is enforced by the SIC with revenue-independent but capped fines\n\nColombia's Statutory Law 1581 of 2012 (the \"Habeas Data\" regime) is enforced by the Superintendencia de Industria y Comercio (SIC), specifically its Deputy Superintendence for the Protection of Personal Data, which can run on-site inspections, demand documentation, and interview staff [12]. The maximum fine is \"2,000 times the monthly legal minimum wage (SMMLV)\" — at the 2026 minimum wage, a ceiling of \"approximately COP 3.5 billion (roughly USD 830,000)\" [12].\n\n### Claim 4.2 — Colombian enforcement rose in 2024-2025 with specific guidance on AI, biometrics, fintech and web scraping\n\nSIC sanctions rose \"22 percent in 2024,\" with \"new guidance on artificial intelligence... biometrics... financial technology (FinTech) consent and web scraping\" [12]. The 2025 actions are concrete: a COP 190 million fine on Risks International S.A.S (August 6, 2025) for processing sensitive data without consent [12], and a reported large fine against an e-commerce firm for mandatory facial recognition [12]. Binding instruments include Circular 002 of 2024 (AI) and Circular 001 of 2025 (fintech) [12]. The biometric and facial-recognition focus maps directly onto the ACR and device-graph identity techniques used in CTV.\n\n### Claim 4.3 — Colombia combines VAT and a \"Significant Economic Presence\" income-tax regime on foreign digital providers\n\nColombia taxes the digital economy through \"VAT and Significant Economic Presence frameworks,\" requiring foreign digital service providers to register for VAT, with those exceeding revenue/user thresholds \"subject to income tax\"; from 2025 it requires resident platform operators to report under the OECD Model Reporting Rules [22]. Colombia sits in the 18-21% VAT band [22].\n\n---\n\n## 5. Argentina — The Adequacy Holder Running on Aging Law\n\n### Claim 5.1 — Argentina still governs CTV data under Ley 25.326 (2000), which predates the GDPR\n\nArgentina's Personal Data Protection Act, Law 25.326, was \"enacted in 2000,\" making Argentina \"one of the pioneering Latin American countries to legislate on data protection and the first to achieve 'adequacy' qualification for data transfers from the EU\" [13][14]. So a 2000-vintage statute, supplemented by AAIP resolutions, governs a 2026 ad-tech landscape. That gap between an old law and modern profiling is itself the regulatory risk: the AAIP applies 25.326's consent definition to cookies, requiring \"prior, explicit opt-in\" consent with \"no preticked boxes for nonessential cookies (e.g., analytics, advertising)\" [20].\n\n### Claim 5.2 — Argentina has multiple GDPR-aligned reform bills pending in Congress, none yet enacted\n\nA \"wave of reform bills\" arrived in 2025, including S-0644/2025 and 1948-D-2025 (comprehensive GDPR-aligned reform), 0904-D-2025, and S-0968/2025 (children's data) [13]. These are \"inspired by the draft bill elaborated by the [AAIP]\" and aim to align with the GDPR and Brazil's LGPD, adding portability, opposition to automated decisions, privacy-by-design, anonymization and biometric rules [13]. **As of late 2025 these remain bills under consideration, not enacted law** [13][14]. Treat any \"Argentina has GDPR-style rules\" claim as forward-looking and contingent.\n\n### Claim 5.3 — Argentina's EU adequacy is a real cross-border-transfer advantage, but is itself under review pressure\n\nArgentina's EU adequacy decision (originally 2003) lets EU personal data flow to Argentina without additional safeguards — a genuine operational advantage for data-driven advertising that touches EU subjects [14]. But commentary notes the aging law is \"now playing defense against AI\" [15], and that reform is driven partly by the need to *preserve* adequacy as the EU tightens standards. The \"playing defense\" framing is one commentator's position rather than an established fact.\n\n### Claim 5.4 — Argentina applies high VAT (21%+) to foreign digital services and provincial turnover taxes on streaming\n\nArgentina \"levies a 21% VAT (23% in certain jurisdictions) on digital services... when services are economically used in Argentina\"; VAT is collected via withholding by payment processors rather than provider registration [22]. From 2018, several provinces extended the Gross Turnover Tax to \"digital subscription services such as music, video, audiovisual streaming\" [22].\n\n---\n\n## 6. Chile — A GDPR-Style Law That Is Not Yet In Force\n\n### Claim 6.1 — Chile's Law 21.719 was published December 13, 2024 but takes effect December 1, 2026\n\nLaw 21.719 was \"published on December 13, 2024\" and \"will become fully effective twenty-four months after that date (in December 2026)\" — specifically \"effective December 1, 2026\" [6][7]. It replaces the prior consent-only framework (Law 19.628) [7]. This is a textbook pending-law-with-effective-date: as of June 2026 the modern regime is enacted but NOT yet operative. Until December 1, 2026, Chilean CTV data still runs under the weaker 19.628 regime.\n\n### Claim 6.2 — Law 21.719 creates Chile's first autonomous Data Protection Agency (APDP), beginning enforcement Dec 2026\n\nThe law \"creates an autonomous Data Protection Agency — the Agencia de Protección de Datos Personales (APDP) — for the first time in Chilean history,\" which \"will begin formal enforcement operations\" on the same December 2026 date [7]. A caution: the APDP does not yet exist operationally. Its staffing, guidance, and enforcement posture are unknown, so any claim about \"how Chile enforces\" is a forward projection, not an observed fact.\n\n### Claim 6.3 — Law 21.719 introduces legitimate interest as a lawful basis and revenue-scaled fines up to ~US$1.6M\n\nThe law introduces \"further legal basis for the processing of personal data in addition to consent (such as performance of a contract and legitimate interest)\" and fines \"up to 20,000 monthly tax units (approximately US$1,588,400)\" plus a recidivism concept [6][7]. Legitimate interest is the change that most enables programmatic advertising in Chile post-2026. Until then, the consent-only 19.628 framework is restrictive on paper but weakly enforced.\n\n---\n\n## 7. Peru — Ley 29733 With a New 2024 Regulation Now Effective\n\n### Claim 7.1 — Peru's new data-protection regulation (DS 016-2024-JUS) took effect March 30, 2025\n\nThe new Reglamento of Law 29733 was \"approved through Decreto Supremo N° 016-2024-JUS on November 30, 2024, and enters into force on March 30, 2025,\" repealing the prior DS 003-2013-JUS [16]. This makes Peru's regime current as of mid-2026 rather than a decade-old framework.\n\n### Claim 7.2 — The 2024 regulation adds extraterritorial scope, 48-hour breach notice, and mandatory DPOs\n\nThe regulation \"no longer limits itself to companies with a presence in Peru, but now also reaches foreign companies that offer goods or services to individuals in the country or that develop profiles of those located in Peruvian territory\" [16] — a GDPR Article 3-style extraterritorial reach that lands directly on foreign CTV/ad-tech vendors. It imposes a 48-hour breach-notification duty to the Autoridad Nacional de Protección de Datos Personales (ANPD, within MINJUS) and a mandatory Data Protection Officer for entities handling large or sensitive volumes, phased in \"progressively starting from November 30, 2025, based on annual sales\" [16].\n\n### Claim 7.3 — Peru applies high VAT (18%) to foreign digital services with withholding enforcement\n\nPeru sits in the 18-22% VAT band on digital services; \"in Chile and Peru, withholding applies when foreign providers fail to meet registration obligations\" [22]. Peru's IGV (general VAT) is 18%.\n\n---\n\n## 8. Cross-Country Advertising, Content and Tax Layer\n\nPrivacy law is only half the picture. A second body of regulation shapes CTV demand and supply directly.\n\n### Claim 8.1 — Sports-betting advertising is the region's most actively-regulated CTV ad category, led by Brazil\n\nBrazil's licensing-gated Bets regime (Claim 2.4) leads, with the ECA Digital additionally obligating platforms to \"prevent and mitigate access to – and exposure of – children and adolescents to advertising, promotions and marketing for gambling/betting\" [5]. Betting and iGaming demand has been a major driver of CTV CPMs in Brazil, so the regulatory tightening is a demand-side variable for the outlook.\n\n### Claim 8.2 — Children's-advertising restrictions are tightening region-wide, converging on profiling bans\n\nBrazil's ECA Digital (behavioral-profiling ban, Claim 2.5) is the sharpest instrument, but the pattern recurs: Argentina has a pending children's-data bill (S-0968/2025) [13], and the GDPR-derived regimes across the region treat children's data as requiring heightened protection. For CTV — watched in family and living-room contexts — the \"likely to be accessed by minors\" standard is the operative risk, because it can sweep in general-audience inventory.\n\n### Claim 8.3 — Streaming content quotas and Condecine-type levies are advancing but largely PENDING\n\nTwo instruments are moving: Mexico's July 2025 telecom law with a reported 30% national-content rule for OTT (Claim 3.3, enacted) [9], and Brazil's PL 2331/2022 Condecine/quota bill (Claim 2.7, still pending) [11]. The pattern — local-content quotas plus a sector levy funding domestic production — echoes the EU AVMSD. These shape catalog economics and the supply of premium local CTV inventory more than ad-targeting mechanics.\n\n### Claim 8.4 — Region-wide VAT on foreign digital services (16-22%) is the most universal tax touching CTV\n\nA CIAT working paper (July 2025) and Bloomberg Tax surveys document that \"the highest VAT rates, ranging from 18 to 22 percent, are applied in Argentina, Chile, Colombia, Peru, and Uruguay,\" with Mexico at 16%, collected via provider registration or payment-processor withholding [22]. From 2025, Colombia and Chile added OECD-style platform transactional-reporting duties [22]. This is the most universal fiscal fact across the region: every foreign CTV, streaming, or ad-tech provider selling into it faces VAT registration or withholding.\n\n### Claim 8.5 — Alcohol, pharma and financial advertising are restricted but via long-standing, country-specific rules\n\nAlcohol, pharmaceutical and financial-product advertising are restricted across the region through pre-existing health, consumer, and financial-regulatory codes and self-regulatory bodies (e.g., Brazil's CONAR) rather than new CTV-specific instruments. The specific alcohol, pharma, and financial statutes vary country by country and are not laid out individually here. The Brazilian advertising self-regulation framework (CONAR's code) is the most-cited regional mechanism [5][10], but the per-country alcohol/pharma/financial detail is not directly sourced.\n\n---\n\n## 9. What This Means for Programmatic CTV (Synthesis)\n\nFor the ad-tech reader, the legal substrate resolves into four planning facts:\n\n- **Targeting basis:** Legitimate interest is available for advertising in Brazil now, in Chile from Dec 2026, and is the direction of travel in Argentina, Peru, and Colombia — but always with an opt-out and a hard children's carve-out. Consent remains the safer basis for cookie/identity-graph and sensitive-data use. Contextual and logged-in/first-party CTV targeting is the lowest-risk approach region-wide.\n- **Children:** Brazil's ECA Digital is the bellwether — a flat ban on behavioral profiling for ads to anyone under 18 in services \"likely to be accessed by\" minors, enforceable since March 2026, with revenue-scaled fines. CTV's living-room context makes this a first-order design constraint, not an edge case.\n- **Cross-border data:** Brazil's mandatory SCCs (since Aug 2025) are the concrete mechanism for moving data to global platforms; Argentina's EU adequacy is an advantage; Peru and Chile (from 2026) add extraterritorial reach.\n- **Going-concern risks:** Mexico's enforcement body is new and under-resourced; Chile's regulator is not yet operational; Argentina's modern law is unenacted; Brazil's streaming levy is unpassed. Any plan that treats these as settled should be re-checked at execution. The laws on the books and the laws in force are not the same map — and through 2030, that gap is where the LATAM CTV risk lives.\n\n---\n\n## Open Questions\n\n1. **Mexico's successor regulator in practice.** The 80%/35% staffing-ratio figures are analyst estimates, not official. What is SABG/\"Transparencia para el Pueblo\"'s actual enforcement record against ad-tech as of mid/late 2026? Has it issued any LGPD-adjacent guidance or fines touching advertising?\n2. **Chile APDP readiness.** Will the APDP be operationally staffed and issuing guidance by the December 1, 2026 effective date, or will there be a soft-launch gap? What transition guidance has the Chilean government issued?\n3. **Argentina reform timing.** Will any of the pending GDPR-aligned bills (S-0644/2025, 1948-D-2025) actually pass before 2030, and does the EU's adequacy review create a hard deadline?\n4. **Brazil Condecine/quota bill.** Final rate (3% vs 6%), final quota numbers, and whether the broader House passes PL 2331/2022 — and whether it survives the US Section 301 digital-trade-barrier pressure noted in the CCIA filing [11].\n5. **Per-country alcohol/pharma/financial advertising rules.** Not laid out in detail above — each country's health, consumer, and financial advertising codes, and how they apply to CTV/streaming specifically, would repay a dedicated look.\n6. **Cookie/consent enforcement specifically for CTV/ACR.** Most cookie-consent guidance is web-framed; how do regulators treat ACR (automatic content recognition), device graphs, and smart-TV OS data, which are not cookies? Almost no regulator has issued CTV-specific guidance yet.\n7. **Mexico's 30% OTT content quota.** Confirm the exact figure and scope against the LFTR statute text rather than trade-press reporting.\n8. **Enforcement against programmatic intermediaries.** Have any LATAM regulators acted specifically against SSPs/DSPs/data brokers (vs. publishers/platforms)? The enforcement record to date appears publisher- and platform-facing.\n\n---\n\n## Sources\n\n1. White & Case, \"Mexico enacts new data protection regime,\" 2025; Hogan Lovells, \"Mexico's new Federal Data Protection Law: What it means for companies,\" 2025; Baker McKenzie Connect On Tech, \"Mexico: From 2010 to 2025 – Evolution of the new Federal Law,\" 2025; Cacheaux/CCN, \"Amendment Decree on Transparency, Access to Public Information and Personal Data Protection,\" 2025. Accessed 2026-06-17. Tier 5 (law-firm alerts). https://www.whitecase.com/insight-alert/mexico-enacts-new-data-protection-regime ; https://www.hoganlovells.com/en/publications/mexicos-new-federal-data-protection-law-what-it-means-for-companies ; https://connectontech.bakermckenzie.com/mexico-from-2010-to-2025-evolution-of-the-new-federal-law-on-the-protection-of-personal-data-held-by-private-parties-2/ ; https://ccn-law.com/en/amendment-decree-on-transparency-access-to-public-information-and-personal-data-protection/\n2. adcasting Law\"; Hogan Lovells, \"A step forward or backward? An analysis of the recent Mexican telecommunications bill\"; CSIS, \"Mexico's Telecommunications Law\"; TTV News, \"OTT Platforms Must Offer 30% National Content in Mexico.\" Accessed 2026-06-17. Tier 5 (law-firm + CSIS think tank + trade press TTV News for the 30% figure). https://connectontech.bakermckenzie.com/mexico-new-federal-telecommunications-and-broadcasting-law/ ; https://www.csis.org/analysis/mexicos-telecommunications-law-bolstering-access-or-curtailing-competition ; https://www.todotvnews.com/en/ott-platforms-must-offer-30-national-content-in-mexico/\n10. Library of Congress Global Legal Monitor, \"Brazil: New Resolution Bans Advertising to Children Under Age 12,\" 2014; Georgetown Global Food Laws, \"Resolution on Advertising and Marketing to Children/Adolescents 163/2014\"; Columbia Global Freedom of Expression, \"Federal Public Attorney's Office v. CONANDA / Google Brasil.\" Accessed 2026-06-17. Tier 2-3 (LoC primary-adjacent; Georgetown academic; Columbia case database). https://www.loc.gov/item/global-legal-monitor/2014-04-22/brazil-new-resolution-bans-advertising-to-children-under-age-12/ ; https://globalfoodlaws.georgetown.edu/documents/resolution-on-advertising-and-marketing-children-adolescents-163-2014/\n11. Senado/Câmara dos Deputados (Brazil) reporting via Poder360 and the Chamber's own portal; Mattos Filho, \"Brazil's Senate approves bill regulating video-on-demand services\"; Variety, \"Brazil's Indies... Push Congress for Approval\"; CCIA, \"Comments on 301 Investigation into Brazil's Digital Trade Barriers,\" Aug 2025. Accessed 2026-06-17. Tier 1-5 (legislative portals Tier 1; Mattos Filho Tier 5; Variety Tier 5 trade; CCIA Tier 6 industry-association position). https://www.camara.leg.br/noticias/1083832-projeto-regulamenta-cobranca-da-condecine-para-os-servicos-de-streaming ; https://www.mattosfilho.com.br/en/unico/senate-regulating-vod/ ; https://variety.com/2025/film/global
