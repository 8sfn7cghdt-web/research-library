shall McLuhan,\" McLuhan Galaxy (specialist blog) — Ong introducing McLuhan to Teilhard via mimeographed pages. Tier 5/6 (specialist blog; corroborates [8]). Accessed 2026-06-13. https://mcluhangalaxy.wordpress.com/2015/04/18/\n10. Walter J. Ong, *Orality and Literacy: The Technologizing of the Word* (Methuen, 1982; Routledge 2002) — primary text; secondary orality, the technologizing of the word, synthesis of Parry/Lord/Havelock/Goody/Luria. Tier 1. Accessed 2026-06-13 (full text). https://monoskop.org/images/d/db/Ong_Walter_J_Orality_and_Literacy_2nd_ed.pdf\n11. \"Walter J. Ong\" / \"Secondary orality\" reference overviews — biography, *Ramus* (1958), *The Presence of the Word* (1967), thesis supervised by McLuhan, standard scholarly critiques (determinism, over-dichotomization). Tier 2 (reference). Accessed 2026-06-13. https://en.wikipedia.org/wiki/Walter_J._Ong ; https://en.wikipedia.org/wiki/Secondary_orality — *navigation; claims trace to Ong's primary works [10].*\n12. Walter J. Ong, *Rhetoric, Romance, and Technology* (1971) — first articulation of \"secondary orality.\" Tier 1 (referenced via secondary summary). Accessed 2026-06-13.\n13. Milman Parry / Albert Lord (oral-formulaic theory), Eric Havelock (*Preface to Plato*), Jack Goody (*The Domestication of the Savage Mind*, 1977), A.R. Luria — the empirical base Ong credits and McLuhan tended to absorb without attribution. Tier 1/2 (primary scholarship; referenced via Ong [10], not all read directly). Accessed 2026-06-13.\n14. Donald Clark, \"Ong — orality, literacy and new technologies?\" (2024) and standard reference critiques — the over-dichotomization / technological-determinism critique of Ong. Tier 5/6 (analytical blog; evidence of the standard critique). Accessed 2026-06-13. http://donaldclarkplanb.blogspot.com/2024/04/ong-orality-literacy-and-new.html\n15. \"Amusing Ourselves to Death\" reference overview — Postman founding the NYU Media Ecology program (1971); \"medium is the metaphor\"; Frankfurt Book Fair 1984 talk. Tier 2 (reference). Accessed 2026-06-13. https://en.wikipedia.org/wiki/Amusing_Ourselves_to_Death — *navigation; claims trace to Postman's book [16].*\n16. Neil Postman, *Amusing Ourselves to Death: Public Discourse in the Age of Show Business* (Viking, 1985) — primary text; Huxley-vs-Orwell foreword, \"medium is the metaphor,\" critique of televisual public discourse. Tier 1. Accessed 2026-06-13.\n17. \"A Jewish prophet of the 1980s would be horrified…,\" *The Forward*, 2025 (40th-anniversary reflection on Postman) — Postman as moralist/\"Jewish prophet\"; Huxley framing. Tier 4/5 (Jewish cultural press; used for the secular-moralist characterization). Accessed 2026-06-13. https://forward.com/culture/659406/\n18. Jean Baudrillard, *Simulacra and Simulation* (French 1981; Univ. of Michigan Press trans. 1994), incl. \"The Implosion of Meaning in the Media\" — primary text; double implosion, medium into the real, hyperreal nebula. Tier 1. Accessed 2026-06-13 (archived PDF). https://archive.org (Baudrillard, *Simulacra and Simulation*).\n19. \"Baudrillard's Thoughts on Media\" (Philosophical Society) and \"Baudrillard and McLuhan in the Social Media Age\" (*Baudrillard Now*, specialist journal) — Baudrillard as critical heir who keeps the formula and drops the optimism; spectacle → simulation. Tier 5 (specialist analytical). Accessed 2026-06-13. https://philosophicalsociety.com/HTML/BaudrillardsThoughtsOnMedia.html ; https://baudrillard-scijournal.com/baudrillard-and-mcluhan-in-the-social-media-age/\n20. \"Friedrich Kittler\" reference + Oxford Reference entry — *Discourse Networks 1800/1900*, *Gramophone Film Typewriter*, anti-hermeneutic discourse analysis, Foucault/Lacan/Derrida lineage, against Gadamer. Tier 2 (reference). Accessed 2026-06-13. https://en.wikipedia.org/wiki/Friedrich_Kittler ; https://www.oxfordreference.com/display/10.1093/oi/authority.20110803100039457\n21. Friedrich A. Kittler, *Gramophone, Film, Typewriter* (German 1986; Stanford UP trans. 1999) — primary text; \"Media determine our situation\"; rejection of \"extensions of man\"; \"Media are not pseudopods…\"; \"What remains of people is what media can store and communicate.\" Tier 1 (quoted via [22][23]). Accessed 2026-06-13. https://www.sup.org/books/media-studies/gramophone-film-typewriter\n22. Nicholas Gane, \"Radical Post-humanism: Friedrich Kittler and the Primacy of Technology,\" *Theory, Culture & Society* (2005), PDF — peer-reviewed analysis of Kittler's reversal of McLuhan (man as extension of media), anti-humanism, military logic of escalation. Tier 2. Accessed 2026-06-13. https://monoskop.org/images/3/3e/Gane_Nicholas_2005_Radical_Post-humanism_Friedrich_Kittler_and_the_Primacy_of_Technology.pdf\n23. Geoffrey Winthrop-Young & Eva Horn, \"Machine Learning: Friedrich Kittler (1943–2011),\" *Artforum* — essay on Kittler's project, war, and his relation to McLuhan. Tier 5 (specialist art/theory press). Accessed 2026-06-13. https://www.artforum.com/features/geoffrey-winthrop-young-and-eva-horn-200834/\n24. \"Between Benjamin and McLuhan: Vilém Flusser's Media Theory\" (ResearchGate/academia.edu) — Flusser upgrading the Marxist German tradition \"in the footsteps of McLuhan\" on a different philosophical base. Tier 2 (peer scholarship). Accessed 2026-06-13. https://www.academia.edu/3578096/Between_Benjamin_and_McLuhan_Vilem_Flussers_Media_Theory\n25. Vilém Flusser, *Towards a Philosophy of Photography* (1983) and *Into the Universe of Technical Images* (1985) — primary texts; technical images, apparatus, functionary, code; the displacement of linear-text culture. Tier 1 (referenced via [24]). Accessed 2026-06-13.\n26. Paul Virilio, *Speed and Politics: An Essay on Dromology* (French 1977; Semiotext(e) trans. 2006) — primary text; dromology, speed as primary civilizational force, the accident. Tier 1. Accessed 2026-06-13. https://mitpress.mit.edu/9781584350408/speed-and-politics/\n27. Bob Hanke, \"McLuhan, Virilio and Speed\" / \"McLuhan, Virilio and Electric Speed in the Age of Digital Reproduction\" (academia.edu) — scholarship on the McLuhan-Virilio relation; Virilio quoting McLuhan; speed-as-transformation vs. speed-as-destruction. Tier 2/5. Accessed 2026-06-13. https://www.academia.edu/30468113/McLuhan_Virilio_and_Speed\n28. \"How Marshall McLuhan Was the Patron Saint of Wired Magazine,\" *Literary Hub* (book excerpt) — Wired naming McLuhan patron saint at 1993 launch; Paglia–Brand conversation; the homage articles; Rossetto and Kelly; the secularization of McLuhan's Catholicism. Tier 5 (book excerpt / analytical). Accessed 2026-06-13. https://lithub.com/how-marshall-mcluhan-was-the-patron-saint-of-wired-magazine/\n29. \"How & Why Did Marshall McLuhan Become the 'Patron Saint' of WIRED Magazine,\" McLuhan Galaxy (specialist) — masthead detail; founders (Rossetto, Metcalfe, Stewart; backing from Jackson and Negroponte); Kelly's role; the \"St. Marshall\" article titles. Tier 5/6 (specialist blog; corroborates [28]). Accessed 2026-06-13. https://mcluhangalaxy.wordpress.com/2022/04/08/\n30. \"WIRED Magazine, Marshall McLuhan and Me,\" J. Moon (Medium/Substack) — readers unaware of McLuhan's Catholic skepticism; Kelly's \"spiritual dimension to technology\"; Rossetto's \"Digital Generation.\" Tier 6 (personal essay; used for the kept-vs-discarded framing, corroborated by [28][31]). Accessed 2026-06-13. https://moonshotj.substack.com/p/wired-magazine-marshall-mcluhan-and-me-48c8a16bb1e7\n31. C.W. Ripatrazone, *America Magazine* (as [8]) — McLuhan's 1937 conversion context, \"confront the secular … as a Christian,\" Mystical Body \"technologically a fact,\" Antichrist fear; \"their Catholicism was … structure, spirit and sustenance.\" Tier 5 (Catholic analytical press, lean disclosed). Accessed 2026-06-13.\n32. Gary Wolfe, \"The Wisdom of Saint Marshall, the Holy Fool,\" *Wired* (1996), as cited in Nicholas Carr, \"The global village of violence,\" Rough Type — McLuhan's global village as \"all-at-onceness,\" \"mass terror and sudden panic,\" not utopia. Tier 5 (Wired primary + Carr analytical). Accessed 2026-06-13. https://www.roughtype.com/?p=7096\n33. Marshall McLuhan, interview statements on the global village (\"very arduous interfaces … very abrasive situations\"; \"nationalism, xenophobia, and cultism\"), as compiled in McLuhan Galaxy, \"How technology spawned a global village — and created a world of dissension & strife.\" Tier 1 (McLuhan's own words, via Tier 5/6 compilation). Accessed 2026-06-13. https://mcluhangalaxy.wordpress.com/2017/04/23/\n34. \"The sacramental view of Marshall McLuhan, Walter Ong and James Carey\" (ResearchGate) — peer scholarship articulating the sacramental/incarnational reading shared across the Catholic-lineage trio. Tier 2. Accessed 2026-06-13. https://www.researchgate.net/publication/322361980_"}, {"order": 2, "file": "collection-medium-and-message-2.md", "title": "Six Easy Pieces of IP-Based Identity in Connected TV", "summary": "The Address Knows You", "body": "*From [The Address Knows You](ipv4-ipv6-ctv-research.html#ch-1) — chapter 2*\n\n# Six Easy Pieces of IP-Based Identity in Connected TV\n\n*How the number that routes your internet ended up deciding which ads reach your television — and why that arrangement is coming apart.*\n\n## The accidental address that runs a $38 billion market\n\nWhen an ad plays on your streaming TV, some machine had a fraction of a second to decide *you* should see *that ad* — and to make sure you don't see it eleven more times, and to count that you saw it, and to check you're a real person and not a bot in a warehouse. To do all of that it needs to know which household this is. On a smart TV it usually can't use a cookie, the little tracking file that follows you around the web, because TV apps mostly don't have them. So it reaches for the one thing every internet-connected device announces to the world: its **IP address** — the numeric label, like `73.114.22.9`, that the internet uses to route data to your home.\n\nHere is the whole subject in one sentence. Streaming-TV advertising runs its targeting, its ad-frequency limits, its measurement, and its fraud-catching on the household IP address — a number built to say *where to deliver a packet*, never *who lives here* — and that borrowed foundation is now eroding from four directions at once, with no clean replacement ready. Everything else is detail.\n\n## Why a plumbing problem is a money problem\n\nConnected-TV advertising — \"CTV,\" ads inside streaming apps on a television — is now about a $38 billion market in the US alone, and it just passed traditional primetime TV at the big annual ad-buying negotiations. Roughly 85 to 90 percent of it is bought by software in real time. Almost all of that software leans, somewhere, on the IP address to answer \"which home is this?\"\n\nSo when the IP gets less trustworthy, real money moves the wrong way. An advertiser who thinks it's reaching a hundred homes might be reaching forty, or hammering one living room over and over because it can't tell the households apart. The most careful public test, published in late 2025, checked how often the commercial data that maps an IP to a real mailing address is correct. The answer: about **13 percent** — right roughly one time in eight. That lands on everyone — the advertiser paying to reach the wrong homes, the streaming service whose ad space is worth less than it claims, and you, watching the same insurance ad for the fifth time because the system can't remember it already showed it to you.\n\n## The handful of players you need in your head\n\nA few names carry the rest of the story.\n\n- **IPv4 and IPv6** — the two versions of internet addresses. IPv4 is the old kind, and the world is running out of it: only about 4 billion exist, all long since spoken for. IPv6 is the vast new kind, effectively unlimited, and in March 2026 it crossed half of all internet access worldwide. The catch: the systems that turn a TV's IP into a household mostly still can't read IPv6, so half the internet arrives in a format the ad plumbing can't use.\n- **CGNAT** (carrier-grade network address translation) — a trick providers use to stretch scarce IPv4 by hiding *many* homes behind *one* public address. Where it's used, \"one IP equals one household\" simply breaks; dozens of homes look like one.\n- **The identity graph** — the commercial database (LiveRamp is the biggest) that takes an IP and guesses the household behind it. This is the layer the 13 percent test was grading.\n- **SSAI** (server-side ad insertion) — the common way streaming services stitch ads into a show from a data-center server rather than on your TV. Remember this one: the ad system often never sees your TV's real IP; the server just *tells* it what the IP is.\n- **The bid request** — the tiny message, sent for a single ad slot, that carries the details (including that IP) to the buyers who bid on it. Everything flows through this pipe.\n\nNotice what's missing: nobody here set out to build a household-identity system on the IP address. It just happened.\n\n## How a router number becomes \"your household\"\n\nWalk one ad from your couch to the advertiser and you can see the whole machine — and where it slips.\n\nYour TV opens a streaming app and asks for a show. The app has an ad slot to fill, so it fires off a *bid request*: a little packet of facts about this moment — the app, the show's genre, the country, and the device's IP address. That fans out to dozens of would-be buyers, each with milliseconds to bid. A buyer's software takes the IP and looks it up in an *identity graph*, which answers, in effect, \"this IP is the Rodriguez household in Denver, saw two car ads yesterday.\" On that answer the buyer decides whether to bid, how much, and whether it has already shown this home enough car ads today. The winning ad plays. Later, a measurement company uses the same IP to count how many distinct homes the campaign reached.\n\nEvery job there — targeting, the frequency limit, the count — hangs on the IP meaning one household. That meaning was never guaranteed. It was a lucky side effect of old plumbing, and the plumbing is being replaced.\n\nIt slips in physical ways. Behind **CGNAT**, the graph sees one address where forty homes sit, and reports the wrong one. On **IPv6**, the graph often can't match at all, so the buyer flies blind. And with **SSAI** comes the real weakness: the ad system in a data center never observes your TV's connection. The stitching server just writes an IP into a field and passes it along — and *nothing downstream checks the number is true*. The one rule meant to keep it honest is a single unenforced sentence in a spec saying the value \"must match\" the real device. Nothing makes it match. The biggest streaming-ad fraud ever caught worked exactly here: a server declared roughly two million fake home IP addresses, and the machine believed every one, because believing the server is all it knows how to do.\n\n## The fight: fix the number, or leave it behind\n\nSmart people who agree on all these facts disagree sharply on what they mean, and the disagreement is really about who pays to fix it.\n\nOne camp says the IP is finished as an identity signal. Thirteen percent accuracy isn't a rough edge; it's a broken foundation — and for the first time there are real replacements ready. Big platforms with logins (Amazon, Roku, Netflix, Disney, YouTube) already *know* who is watching, they take more than half of US streaming ad money, and they don't need the IP at all. Shared login IDs and \"ACR\" — the technology that lets a smart TV recognize the show on its own screen — can do the identity job without guessing from a router number. The honest move, this camp says, is to stop pretending and switch.\n\nThe other camp says the test graded the wrong thing: stale, off-the-shelf data files, not the live systems that blend the IP with recency and other signals. The *best* vendors scored several times better than the worst — so the signal was never the problem, the hygiene was. The IP is free, sits in every bid request, and works fine on stable home broadband. Throw it away and you lose the one universal key that reaches every home, including the ones without logins. Fix the linkage; don't abandon it.\n\nBoth are partly right, and both have a business reason — the reformers sell the replacements, the defenders sell the graphs. The honest read: on solid US home broadband the IP still mostly works; at the fraying edges — CGNAT homes, IPv6, server-stitched ads — it's genuinely unreliable, and no framing fixes that. The two camps are fighting over how big the good middle really is.\n\n## Where it's heading, and what to watch\n\nThrough 2030, the least dramatic future is the most likely — better than even odds. Call it **managed decline**: the half-finished switch to IPv6 stays half-finished, the IP stays in every bid request, and its weight slips a little each year without anyone declaring it dead. The quiet engine is a feedback loop: IPv4 got cheap again (from about $60 an address in 2021 to $10–20 now), which relieves the pressure that would have forced providers onto CGNAT and IPv6 — so the messy middle keeps funding its own survival.\n\nThe strongest rival, near one-in-four, is a faster handoff: premium streaming moves onto login-based identity by decade's end, and the IP drops to a coarse \"roughly this region\" hint. Two long shots sit behind. One is a sudden break — Apple already ships, unused, the software to hide the IP on Apple TVs; a single toggle, or one European regulator finally enforcing the rule that an IP is personal data, could split the market overnight. The other is a comeback, where the industry standardizes the stable part of an IPv6 address as the household key and cleans up the data — possible, but nobody has started.\n\nWatch three signals: whether Apple ever turns on IP-hiding for its TV devices; whether login-ID identity keeps taking premium streaming; and whether anyone finally publishes what fraction of TV ad requests arrive over IPv6 — a number that, astonishingly, no one measures. That last point is the deepest truth here. The industry's defining transition is happening in the dark: it steers by an instrument it never built, watches it drift, and bets it won't have to look up for a few more years."}, {"order": 3, "file": "collection-medium-and-message-3.md", "title": "Technical Mechanics: Primary Sources — Direct Readings of the Documents Underlying IP-Based CTV Identity", "summary": "The Address Knows You", "body": "*From [The Address Knows You](ipv4-ipv6-ctv-research.html#ch-5) — chapter 6*\n\n# 04 — Technical Mechanics: Primary Sources\n\n## Bottom Line\n\nThe documents that everyone in CTV ad tech cites — the RFCs, the OpenRTB spec, the Breyer judgment, the Truthset accuracy study, Apple's and Google's proxy documentation — say things that are consistently narrower, more conditional, and more technically specific than the industry summaries of them. The IP address was never designed as an identity primitive: RFC 791 defines it as \"where,\" not \"who,\" and RFC 8200 defines it as an identifier of an *interface*, not a person or household. The privacy mechanics layered on top (RFC 8981 temporary addresses, prefix rotation, CGNAT under RFC 6598) each obscure a different part of the address while leaving another part stable — which is precisely why the IPv6 /64-or-shorter *prefix* has become the de facto household identifier even as the low 64 bits rotate daily. Breyer did **not** hold that IP addresses are always personal data; it held a conditional, relative test that GDPR-era practice has since hardened into a near-absolute rule. The Truthset 13%/16% numbers measure the precision of *commercial third-party IP-to-identity linkage files*, not the usability of IPs as such — deterministic ISP-sourced mappings are the study's ground truth, not its target. And the largest CTV fraud operation ever documented (ICEBUCKET) worked precisely because SSAI architecture lets a server *declare* a device's IP rather than expose it. Every common claim about \"what the spec/judgment/study says\" should be checkable against the direct readings below.\n\n---\n\n## How to read this document\n\nEach numbered section covers one primary source (or a tightly coupled set): full citation, context, a direct reading of what the document actually says (with verbatim quotations), and significance for CTV identity. Sections end with corrections of common misreadings where they exist. The Sources section at the end carries full citations with access dates. All web sources accessed 2026-06-09 unless noted.\n\nTwo access limitations are disclosed up front, in the interest of full transparency:\n\n1. **Apple's iCloud Private Relay white paper (PDF, Dec 2021)** could not be text-extracted directly; the Private Relay reading below relies instead on Apple's official developer and support pages, from the same publisher.\n2. **HUMAN's ICEBUCKET blog post** could not be retrieved directly; its figures are reconstructed from the report's own language as quoted in three independent contemporaneous trade and security accounts.\n\n---\n\n## 1. RFC 791 — Internet Protocol (IPv4), September 1981\n\n**Citation:** Postel, J. (ed.), \"Internet Protocol — DARPA Internet Program Protocol Specification,\" RFC 791, USC Information Sciences Institute, September 1981. https://www.rfc-editor.org/rfc/rfc791.txt (Tier 1; accessed 2026-06-09)\n\n**Context.** The founding specification of the IPv4 address — the 32-bit number that, forty-five years later, carries most of the world's CTV ad requests and anchors most household identity graphs. Written for DARPA's internetworking program; \"identity\" in the advertising sense appears nowhere in it.\n\n**Direct reading.** RFC 791's most quoted sentence is its sharpest statement of what an address is *for*:\n\n> \"A name indicates what we seek. An address indicates where it is. A route indicates how to get there.\" (§2.3)\n\nThe address is four octets (32 bits), split into a network number and a \"local address\" (the \"rest\" field), originally in three classes (A/B/C distinguished by high-order bits). Two further points matter for everything downstream:\n\n- The address designates a *network attachment point*, not a machine and certainly not a user. RFC 791 makes the looseness of the binding explicit: \"A single physical host must be able to act as if it were several distinct hosts to the extent of using several distinct internet addresses\" (§2.3). The host-to-address relation was many-to-many from the first page.\n- Nothing in the document contemplates address persistence. Assignment, stability, and reuse are out of scope — they became operational matters for ISPs, which is why dynamic assignment, NAT, and CGNAT could later be bolted on without violating the spec.\n\n**Significance.** Every CTV use of the IPv4 address — household graphing, frequency capping, geolocation, fraud filtering — is an *inference stacked on a locator*. The spec promises only \"where\" (and only at the granularity of a network interface, only for the duration of an undefined assignment). The entire ad-tech identity layer is an exploitation of an operational accident: that residential ISPs found it cheap to leave one public IPv4 address on one home router for weeks at a time. RFC 791 neither enables nor forbids this; it is silent, and the silence is the point.\n\n> **The takeaway:** RFC 791 defines the IPv4 address as a 32-bit locator of a network attachment point (\"an address indicates where it is\"), explicitly permits multiple addresses per physical host, and specifies nothing about assignment stability — meaning IP-as-household-identity is an operational inference, not a protocol property. [1]\n\n---\n\n## 2. RFC 8200 — Internet Protocol, Version 6 (IPv6), July 2017\n\n**Citation:** Deering, S. and R. Hinden, \"Internet Protocol, Version 6 (IPv6) Specification,\" RFC 8200 / STD 86, July 2017 (obsoletes RFC 2460). https://www.rfc-editor.org/rfc/rfc8200.txt (Tier 1; accessed 2026-06-09)\n\n**Context.** The Internet Standard for IPv6, successor to the 1998 proposed standard RFC 2460. The relevant fact for ad tech is not the bigger header but the changed *semantics* of the address.\n\n**Direct reading.** Section 2 (Terminology) defines an IPv6 address as:\n\n> \"an IPv6-layer identifier for an interface or a set of interfaces.\"\n\nAddresses are 128 bits, and the expansion exists, per Section 1, to enable \"more levels of addressing hierarchy, a much greater number of addressable nodes, and simpler autoconfiguration of addresses.\" The format and semantics of addresses are delegated: \"The format and semantics of IPv6 addresses are specified separately in [RFC4291].\" RFC 4291's architecture splits the typical unicast address into a 64-bit subnet prefix and a 64-bit interface identifier (IID) — the structural fact on which everything in Sections 3–5 below turns.\n\nRFC 8200's security considerations note a reconnaissance asymmetry with IPv4: the huge space makes \"it much harder to scan the address space across the Internet.\"\n\n**Significance.** Three consequences for CTV identity:\n\n1. **One device, many addresses, by design.** Autoconfiguration plus the interface/set-of-interfaces definition means a smart TV in an IPv6 home routinely holds several global addresses simultaneously (stable + temporary), and the spec considers this normal. Exact-address matching as device identity is doomed by design.\n2. **Hierarchy is back.** Unlike post-CIDR IPv4, where the address boundary between \"ISP block\" and \"subscriber\" is invisible to outsiders, IPv6's delegation hierarchy (ISP → customer prefix → /64 subnets) is structurally legible. The *prefix* carries the household signal (see §§3–5).\n3. **No NAT assumption.** IPv6's design goal of end-to-end addressing removes the one mechanism (home NAT) that made IPv4 a clean one-address-per-household signal. Paradoxically, IPv4+NAT was a better household identifier than the protocol designers ever intended, and IPv6 is a better *per-device* tracker than privacy advocates wanted — which is exactly why RFC 8981 exists.\n\n> **The takeaway:** RFC 8200 defines an IPv6 address as a 128-bit \"IPv6-layer identifier for an interface or a set of interfaces,\" with address architecture delegated to RFC 4291, whose 64-bit-prefix/64-bit-IID split is the structural basis of the prefix-vs-IID privacy asymmetry. [2]\n\n---\n\n## 3. RFC 4862 (SLAAC) and RFC 8415 (DHCPv6 / Prefix Delegation) — what a \"household identifier\" technically is in an IPv6 home\n\n**Citations:** Thomson, S., Narten, T., and T. Jinmei, \"IPv6 Stateless Address Autoconfiguration,\" RFC 4862, September 2007. https://www.rfc-editor.org/rfc/rfc4862.txt — and Mrugalski, T., Siodelski, M., Volz, B., Yourtchenko, A., Richardson, M., Jiang, S., Lemon, T., and T. Winters, \"Dynamic Host Configuration Protocol for IPv6 (DHCPv6),\" RFC 8415, November 2018 (obsoletes RFCs 3315, 3633 et al.). https://www.rfc-editor.org/rfc/rfc8415.txt (both Tier 1; accessed 2026-06-09)\n\n**Context.** These two documents describe how addresses actually arrive in a consumer home: the ISP delegates a prefix to the router (DHCPv6 Prefix Delegation), and devices on the LAN self-assemble addresses from the advertised /64 (SLAAC). Together they define what is technically stable in an \"IPv6-native household\" — i.e., what an ad-tech household graph can actually latch onto.\n\n**Direct reading — SLAAC (RFC 4862).** Address formation is a two-part composition:\n\n> \"Routers advertise prefixes that identify the subnet(s) associated with a link, while hosts generate an 'interface identifier' that uniquely identifies an interface on a subnet.\"\n\nThe host concatenates the advertised prefix (leftmost bits) with its interface identifier (rightmost bits). Router Advertisements carry per-prefix *preferred* and *valid* lifetimes; when a valid lifetime expires \"the binding (and address) become invalid and the address may be reassigned to another interface elsewhere in the Internet.\" RFC 4862 deliberately does not address IID privacy — that is deferred to the privacy-extensions line (RFC 4941, now 8981).\n\n**Direct reading — DHCPv6-PD (RFC 8415).** Prefix Delegation is \"another stateful mode of operation … originally intended for simple delegation of prefixes from a delegating router (DHCP server) to requesting routers (DHCP clients)\" (§6.3) — ISP edge to home CPE. The delegated prefix arrives in an IA_PD with preferred/valid lifetimes; the client renews at T1/T2. Two facts matter enormously and are commonly misstated:\n\n1. **The spec does not require prefix stability.** RFC 8415 contains no mandate that the delegating router return the *same* prefix at renewal. Stability is an ISP policy choice expressed through lifetimes and server configuration, not a protocol guarantee. (RIPE-690, §5 below, is the operational-practice document that urges persistence.)\n2. **The home is a delegated block, not one address.** The worked example in §6.3 has the CPE subnet \"a single delegated /48 prefix into /64 prefixes,\" assigning one /64 per link. In production, residential delegations are typically /56 or /48 (RIPE-690's recommendation), each containing 256–65,536 possible /64s.\n\n**Synthesis — the anatomy of an IPv6 \"household identifier.\"** In an IPv6-native home:\n\n- The ISP-delegated prefix (/48, /56, or /60) is common to *every* device and every address in the household, for as long as the ISP's delegation policy keeps it stable.\n- Each LAN segment is a /64 out of that delegation; each device holds one or more IIDs inside the /64.\n- Temporary addresses (§4) churn the IID; they cannot churn the delegated prefix, because the prefix comes from the ISP, not the host.\n\nSo the technically correct statement is: **in IPv6, the household identifier is the delegated prefix, its stability is an ISP policy variable, and nothing the end device does can rotate it.** This is the exact inversion of IPv4, where the household identifier (the single public address) was stabilized by the *device* in the middle (the NAT router) and the ISP could churn it at will.\n\nA precision note on truncation that matters for OpenRTB practice (§8): an exchange that truncates IPv6 to 48 bits (6 bytes, Google's policy) is — depending on the local delegation size — handing buyers something *coarser than* a household (one /48 spans 256 /56-households) or *exactly* a household (where /48 is the delegation unit). \"Truncated IPv6\" is not one privacy level; it is a region-dependent dial set by ISP delegation policy.\n\n> **The takeaway:** Under RFC 4862 SLAAC, devices form addresses by appending a self-generated interface identifier to a router-advertised /64 prefix; under RFC 8415 DHCPv6-PD, the home router receives a delegated prefix (typically /48–/56) whose renewal-time stability the protocol does not guarantee — making the delegated prefix, not any full address, the technically coherent \"household identifier\" in IPv6, with its persistence set by ISP policy. [3][4]\n\n> **The takeaway:** Because typical residential delegations are /56, a 6-byte (48-bit) IPv6 truncation of the kind used by major exchanges can aggregate up to 256 distinct households into one value in /56-delegating networks, while isolating exactly one household where /48 delegation is used — i.e., identical truncation policy yields different effective privacy and targeting granularity in different markets. [3][4][12]\n\n---\n\n## 4. RFC 8981 (obsoleting RFC 4941) — Temporary Address Extensions: exactly what rotates, and what does not\n\n**Citation:** Gont, F., Krishnan, S., Narten, T., and R. Draves, \"Temporary Address Extensions for Stateless Address Autoconfiguration in IPv6,\" RFC 8981, February 2021 (obsoletes RFC 4941). https://www.rfc-editor.org/rfc/rfc8981.txt (Tier 1; accessed 2026-06-09)\n\n**Context.** The \"IPv6 privacy extensions.\" Industry shorthand says \"IPv6 addresses rotate, so IPv6 kills IP identity.\" The document itself says something far more limited — and says so explicitly.\n\n**Direct reading.** The problem statement targets the stable interface identifier:\n\n> \"Addresses generated using SLAAC contain an embedded interface identifier, which may remain stable over time. Anytime a fixed identifier is used in multiple contexts, it becomes possible to correlate seemingly unrelated activity using this identifier.\"\n\nThe mechanism: hosts generate additional, randomized IIDs and form short-lived \"temporary addresses\" used for outgoing connections. Default lifetimes (§3.8): **TEMP_VALID_LIFETIME = 2 days; TEMP_PREFERRED_LIFETIME = 1 day**, with a per-address randomized desynchronization factor (MAX_DESYNC_FACTOR = 0.4 × preferred lifetime) and regeneration REGEN_ADVANCE before deprecation. In practice: a new outgoing address roughly daily.\n\nChanges from RFC 4941 (§5): the valid lifetime came down from one week to two days; the old recommendation that temporary addresses ship disabled by default was **removed**; hosts may now run temporary-only; and the per-prefix IID-reuse flaw of 4941 was fixed.\n\nNow the passage the industry summary omits. RFC 8981 §2.1, verbatim:\n\n> \"Although it might appear that changing an address regularly in such environments would be desirable to lessen privacy concerns, it should be noted that the network-prefix portion of an address also serves as a constant identifier.\"\n\nand:\n\n> \"If the network contains a very small number of hosts — say, just one — changing just the IID will not enhance privacy, since the prefix serves as a constant identifier.\"\n\n**Significance and correction of the record.** The privacy extensions rotate **only the low 64 bits**. The document itself states that the prefix — the household part — \"serves as a constant identifier,\" and that in small networks (a home is a small network) IID rotation alone does not enhance privacy against an observer who keys on the prefix. This is not an adversarial gloss; it is the spec's own caveat. Consequences:\n\n- For *cross-site per-device* tracking by full IPv6 address: temporary addresses are effective; the full address is unstable on a ~24h cycle.\n- For *household-level* identity of the kind CTV ad tech actually uses (graphing devices to a home, household frequency capping): RFC 8981 changes almost nothing, because the /64 (and the delegated /56 or /48 above it) persists exactly as long as the ISP's delegation policy says it does.\n- The only actor who can rotate the household identifier is the ISP — which is why German ISP prefix-rotation policy (§5) is the genuinely disruptive variable, not host privacy extensions.\n\n> **The takeaway:** RFC 8981 rotates only the IPv6 interface identifier (defaults: 2-day valid / 1-day preferred lifetimes) and itself states that \"the network-prefix portion of an address also serves as a constant identifier\" whose rotation is outside the host's control — so host-side privacy extensions defeat per-device full-address tracking but leave prefix-based household identification intact. [5]\n\n---\n\n## 5. Prefix rotation in practice — RIPE-690 (operator best practice) and Rye, Beverly & claffy (IMC 2021) on why rotation fails anyway\n\n**Citations:** Žorž, J., Steffann, S., Dražumerič, P., Townsley, M., Alston, A., Doering, G., Palet, J., Linkova, J., Balbinot, L., Meynell, K., and L. Howard, \"Best Current Operational Practice for Operators: IPv6 prefix assignment for end-users — persistent vs non-persistent, and what size to choose,\" RIPE-690, 16 October 2017. https://www.ripe.net/publications/docs/ripe-690/ (Tier 1, operator BCOP; accessed 2026-06-09) — and Rye, E., Beverly, R., and k. claffy, \"Follow the Scent: Defeating IPv6 Prefix Rotation Privacy,\" Proc. ACM IMC 2021 (arXiv:2102.00542). https://arxiv.org/abs/2102.00542 (Tier 2, peer-reviewed; accessed 2026-06-09)\n\n**Context.** Section 4 established that only the ISP can rotate the household prefix. Two questions follow: do ISPs rotate (and why/why not), and does rotation actually deliver household privacy? The operator-community BCOP answers the first; the IMC measurement paper answers the second.\n\n**Direct reading — RIPE-690.** The BCOP comes down firmly for stability:\n\n> \"Non-persistent prefixes are considered harmful in IPv6 as you can't avoid issues that may be caused by simple end-user power outages, so assigning persistent prefixes is a safer and simpler approach.\"\n\nRecommended delegation sizes are /48 or /56; anything longer than /56 is discouraged, and /64-only \"does not conform to IPv6 standards and will break functionality in customer LANs.\" The document acknowledges the privacy counter-current without endorsing it: \"In countries with specific legal environments, ISPs are encouraged to support both stable (persistent) and privacy-oriented (non-persistent) prefixes as options for customers.\" The unnamed-but-obvious referent is Germany, where the legacy of daily forced reconnection (*Zwangstrennung*) and data-protection culture produced ISP-side rotation: Deutsche Telekom publicly markets router-triggered and scheduled IPv6 prefix change as a privacy feature (its press materials describe a router \"privacy button\" issuing a new IPv6 prefix manually or on schedule — see source note [7]; the press release itself could not be retrieved directly). Academic measurement (Rye et al., and the residential-network reconnaissance literature) repeatedly observes German residential providers (Deutsche Telekom, Versatel/1&1, NetCologne) cycling customer prefixes on the order of 24 hours.\n\n**Direct reading — Rye, Beverly & claffy (IMC 2021).** The paper's finding is that rotation, where deployed, is frequently defeated by the customer's own router:\n\n- Legacy CPE that derives its WAN/LAN IPv6 addresses via EUI-64 embeds the router's MAC address in the IID. The MAC survives prefix rotation.\n- Using \"intelligent search space reduction with modern high-speed active probing,\" the authors located **over 9 million affected edge routers** and characterized **~13,000 /48 prefixes employing prefix rotation** across hundreds of ASes, demonstrating \"via a case study the ability to remotely track client address movements over time\" — i.e., re-linking a household across its rotated prefixes by following the embedded MAC.\n- Related measurement in the same research line found hundreds of thousands of distinct MACs recoverable from EUI-64 addresses inside single German ISPs (e.g., NetCologne, AS8422).\n\n**Significance.** For CTV identity, prefix policy is the whole game in IPv6 markets, and it is regionally bimodal: the operator-consensus document recommends exactly the persistent-prefix world in which the delegated prefix is a durable household ID, while the most prominent rotation regime (Germany) is both (a) an explicit privacy intervention against household identity and (b) demonstrably leaky in the presence of legacy EUI-64 CPE. Corpus documents claiming \"German daily rotation makes IP-based household graphs impossible in Germany\" overstate: rotation breaks *naive* prefix-keyed graphs; the IMC work shows a technically sophisticated (if abusive, and under GDPR plainly unlawful for ad targeting) re-linking path existed at scale, and rotation says nothing about same-day frequency capping, which survives any ≥24h rotation period.\n\n> **The takeaway:** RIPE-690, the operator best-practice document, recommends persistent /48–/56 delegations and calls non-persistent prefixes \"harmful,\" while acknowledging privacy-motivated non-persistent assignment \"in countries with specific legal environments\" — the documentary basis for the regional split between stable-prefix markets and rotation markets such as Germany. [6][7]\n\n> **The takeaway:** Rye, Beverly & claffy (IMC 2021) demonstrated that ISP prefix rotation is undermined at scale by legacy CPE whose EUI-64 addresses embed a stable router MAC, identifying 9M+ affected edge routers and ~13,000 rotating /48s and showing remote re-linking of households across rotated prefixes. [8]\n\n---\n\n## 6. RFC 6598 — Shared Address Space for CGNAT (100.64.0.0/10), April 2012\n\n**Citation:** Weil, J., Kuarsingh, V., Donley, C., Liljenstolpe, C., and M. Azinger, \"IANA-Reserved IPv4 Prefix for Shared Address Space,\" RFC 6598 / BCP 153, April 2012. https://www.rfc-editor.org/rfc/rfc6598.txt (Tier 1; accessed 2026-06-09)\n\n**Context.** The IETF's formal acknowledgment that IPv4 ran out: a dedicated /10 (100.64.0.0/10, about 4.19M addresses) reserved so ISPs can number the *inside* of carrier-grade NATs without colliding with customers' RFC 1918 home networks.\n\n**Direct reading.** The allocation exists for one purpose: numbering \"interfaces connecting Carrier-Grade NAT (CGN) devices to Customer Premises Equipment (CPE).\" The rationale is exhaustion plus a collision problem: subscribers already use RFC 1918 space inside their homes, so an ISP that also used RFC 1918 between CPE and CGN would break routing for any customer whose home network happened to overlap — \"unless at least one of the conditions above is true, the Service Provider cannot safely use [RFC1918] address space and must resort to Shared Address Space.\"\n\nThe document is candid about CGN's costs, listing service categories adversely affected: console gaming, video streaming, peer-to-peer, **geolocation**, simultaneous logins, 6to4. Notably it observes these impacts are \"comparable regardless of whether globally unique, Shared Address Space, or [RFC1918] addresses are used\" — the harm is the *sharing*, not the numbering.\n\n**Significance.** RFC 6598 is the protocol-layer death certificate for the IPv4-address-equals-household assumption. Behind a CGN, the public IPv4 address seen by an SSP or measurement vendor is an *egress pool member shared by many subscribers*, and the spec itself lists geolocation among the casualties. Three operational notes follow:\n\n- The 100.64/10 space itself never appears in ad requests (it is ISP-internal); what ad tech sees is the CGN's public egress address. CGN presence must therefore be *inferred* (shared-address-space hops in traceroute, port-allocation fingerprints, IP-reputation density), which is what Richter et al. (§7) systematized.\n- Any \"IP + user agent\" household graph in a CGN market silently merges dozens-to-hundreds of households (see §7 for how many).\n- Frequency capping keyed to public IPv4 in CGN markets over-caps (many households share the counter), the mirror image of the IPv6-rotation failure mode (under-capping via identifier churn).\n\n> **The takeaway:** RFC 6598 reserved 100.64.0.0/10 specifically so ISPs could insert carrier-grade NAT between CPE and the public internet without RFC 1918 collisions, and the RFC itself lists geolocation among services adversely affected by the resulting address sharing. [9]\n\n---\n\n## 7. Richter et al. — \"A Multi-perspective Analysis of Carrier-Grade NAT Deployment\" (ACM IMC 2016): how many subscribers actually share one IPv4 address\n\n**Citation:** Richter, P., Wohlfart, F., Vallina-Rodriguez, N., Allman, M., Bush, R., Feldmann, A., Kreibich, C., Weaver, N., and V. Paxson, \"A Multi-perspective Analysis of Carrier-Grade NAT Deployment,\" Proc. ACM Internet Measurement Conference (IMC) 2016 (arXiv:1605.05606; ANRP-awarded). https://arxiv.org/abs/1605.05606 ; full text read via ar5iv HTML rendering, https://ar5iv.labs.arxiv.org/html/1605.05606 (Tier 2, peer-reviewed; accessed 2026-06-09)\n\n**Context.** The canonical empirical study of CGN prevalence — the paper behind nearly every \"X% of ISPs use CGNAT\" claim in industry decks. Methodology triangulates an operator survey, crowdsourced Netalyzr measurements, and BitTorrent DHT-derived vantage points.\n\n**Direct reading.** The numbers, with their exact bases (this matters, because they are routinely quoted with the wrong denominator):\n\n- **Survey:** \"we circulated a survey on a dozen of network operator mailing lists and eventually collected responses from 75 ISPs … Almost 40% of the ISPs indicate they deploy IPv4 CGNs, with another 12% considering CGN in the near-term.\" (Self-selected operator sample, global, skewed toward engaged operators.)\n- **Measured deployment:** \"we find that 13.3% of all non-cellular ASes use CGNs. However, the penetration jumps to 17–18% when considering only non-cellular eyeball ASes.\" And: \"In cellular networks the use is over 92% in all cases.\" (2016 figures; cellular CTV — phones/tablets casting, 5G FWA — inherits the ~universal-CGN world.)\n- **Sharing ratios:** \"we find ISPs allocating as little as 512 ephemeral ports per subscriber, multiplexing up to 128 subscribers per public IP address.\" Chunk-based allocators observed include an AS allocating 4K ports/subscriber (≈16 subscribers/IP) down to 512-port regimes (≈128/IP); the paper documents 17 ASes with identifiable chunk-based allocation. There is no single global average — the paper's point is the *spectrum*.\n- Implications, in the authors' own framing: the findings \"document further erosion of the meaningfulness of IP address reputation, address-based blacklisting, IP-to-user attribution, and geolocating end-users.\"\n\n**Significance and caveats.** This is a 2016 snapshot; IPv4 scarcity economics have only pushed deployment up since (later work — e.g., the CAIDA \"Inferring CGN in the Wild\" line and European \"Tracking the Big NAT\" measurements — extends but does not overturn it). The usable facts are: fixed-line eyeball CGN was already at roughly one-in-six ASes in 2016 with strong regional skew (highest where IPv4 allocations were thinnest — exactly the high-growth CTV markets: India, SEA, LatAm, MEA); cellular is effectively all-CGN; and the subscribers-per-IP figure that household-identity claims silently assume to be 1 is, in measured deployments, anywhere from ~16 to ~128.\n\n> **The takeaway:** Richter et al. (IMC 2016) measured CGN in 17–18% of non-cellular eyeball ASes and >92% of cellular networks, with observed multiplexing of up to 128 subscribers per public IPv4 address (port allocations as small as 512 ports/subscriber) — the empirical ceiling-breaker for any one-IPv4-equals-one-household assumption, with a 2016-vintage caveat. [10]\n\n---\n\n## 8. OpenRTB 2.6 — device.ip and device.ipv6, and where IP truncation actually lives\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 560\" role=\"img\" aria-label=\"An anatomical cutaway of the OpenRTB 2.6 Device object drawn as a JSON struct in an ASCII box frame. The device.ip field, defined as the IPv4 address closest to the device, is highlighted in teal as the load-bearing field present in 100 percent of bid requests and quietly repurposed as the household join key. The separate device.ipv6 field is dimmed because the matching layer treats it as under-matched, with LiveRamp instructing partners to send IPv4 only since IPv6 in most cases will not match. A side panel notes EU truncation practice that zeroes the last IPv4 octet and truncates IPv6 to a /48 to /64 prefix. The field is core since OpenRTB 2.0, the IAB standard of January 2012, preserved through versions 2.2 to 2.6.\">\n<text x=\"40\" y=\"30\" class=\"t-mono\" font-size=\"13\" font-weight=\"bold\" style=\"fill:var(--accent)\">IAB TECH LAB &#183; OPENRTB 2.6<\/text>\n<text x=\"40\" y=\"46\" class=\"t-mono t-muted\" font-size=\"10.5\">Object: Device (&#167;3.2.18) &#183; IP layer enters the auction &#183; core since OpenRTB 2.0 (Jan 2012)<\/text>\n<line x1=\"40\" y1=\"54\" x2=\"470\" y2=\"54\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<rect x=\"40\" y=\"74\" width=\"380\" height=\"318\" class=\"f-panel\" stroke-width=\"1.5\" style=\"stroke:var(--border)\"/>\n<line x1=\"40\" y1=\"100\" x2=\"420\" y2=\"100\" class=\"ln\" stroke-width=\"1\"/>\n<text x=\"52\" y=\"92\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">\"device\": {<\/text>\n<g class=\"t-mono\" font-size=\"10\">\n<text x=\"64\" y=\"122\" class=\"t-muted\">\"ua\"&#160;&#160;&#160;&#160;&#160;&#160;:<\/text><text x=\"150\" y=\"122\" class=\"t-muted\">\"&#8230;user-agent&#8230;\",<\/text>\n<text x=\"64\" y=\"140\" class=\"t-muted\">\"geo\"&#160;&#160;&#160;&#160;:<\/text><text x=\"150\" y=\"140\" class=\"t-muted\">{ ipservice, &#8230; },<\/text>\n<\/g>\n<rect x=\"52\" y=\"150\" width=\"356\" height=\"40\" class=\"f-t1\" opacity=\".80\"/>\n<line x1=\"52\" y1=\"150\" x2=\"52\" y2=\"190\" stroke-width=\"3\" style=\"stroke:var(--accent)\"/>\n<text x=\"64\" y=\"167\" class=\"t-mono t-inv\" font-size=\"11\" font-weight=\"bold\">\"ip\"&#160;&#160;&#160;&#160;&#160;:<\/text>\n<text x=\"150\" y=\"167\" class=\"t-mono t-inv\" font-size=\"11\" font-weight=\"bold\">\"203.0.113.0\",<\/text>\n<text x=\"64\" y=\"183\" class=\"t-mono t-inv\" font-size=\"8.5\">// \"IPv4 address closest to device\" &#183; load-bearing<\/text>\n<rect x=\"52\" y=\"196\" width=\"356\" height=\"40\" class=\"f-t4\" opacity=\".26\"/>\n<line x1=\"52\" y1=\"196\" x2=\"52\" y2=\"236\" stroke-width=\"3\" style=\"stroke:var(--t4)\"/>\n<text x=\"64\" y=\"213\" class=\"t-mono\" font-size=\"11\" style=\"fill:var(--muted)\">\"ipv6\"&#160;&#160;&#160;:<\/text>\n<text x=\"150\" y=\"213\" class=\"t-mono\" font-size=\"11\" style=\"fill:var(--muted)\">\"2001:db8::&#8230;\",<\/text>\n<text x=\"64\" y=\"229\" class=\"t-mono t-muted\" font-size=\"8.5\">// separate field &#183; under-matched (see rule, right)<\/text>\n<g class=\"t-mono\" font-size=\"10\">\n<text x=\"64\" y=\"256\" class=\"t-muted\">\"lmt\"&#160;&#160;&#160;&#160;:<\/text><text x=\"150\" y=\"256\" class=\"t-muted\">0,&#160;&#160;// limit-ad-tracking<\/text>\n<text x=\"64\" y=\"274\" class=\"t-muted\">\"devicetype\":<\/text><text x=\"150\" y=\"274\" class=\"t-muted\">3,&#160;&#160;// connected TV<\/text>\n<text x=\"64\" y=\"292\" class=\"t-muted\">\"make\"&#160;&#160;&#160;:<\/text><text x=\"150\" y=\"292\" class=\"t-muted\">\"&#8230;\", \"model\": \"&#8230;\",<\/text>\n<\/g>\n<text x=\"52\" y=\"316\" class=\"t-mono\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--text)\">}<\/text>\n<line x1=\"52\" y1=\"332\" x2=\"408\" y2=\"332\" class=\"ln-soft\" stroke-width=\".75\" stroke-dasharray=\"1 3\"/>\n<text x=\"52\" y=\"352\" class=\"t-mono t-muted\" font-size=\"8.5\">// spec defines a FIELD, not a verification mechanism<\/text>\n<text x=\"52\" y=\"366\" class=\"t-mono t-muted\" font-size=\"8.5\">// \"closest to device\" &#8212; in SSAI, this value is *declared*<\/text>\n<text x=\"52\" y=\"380\" class=\"t-mono t-muted\" font-size=\"8.5\">// preserved unchanged through 2.2 &#183; 2.3 &#183; 2.4 &#183; 2.5 &#183; 2.6<\/text>\n<text x=\"40\" y=\"424\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--accent)\">PRESENCE<\/text>\n<rect x=\"40\" y=\"434\" width=\"220\" height=\"22\" class=\"f-bg\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"434\" width=\"220\" height=\"22\" class=\"f-t1\" opacity=\".80\"/>\n<text x=\"150\" y=\"449\" text-anchor=\"middle\" class=\"t-mono t-inv\" font-size=\"11\" font-weight=\"bold\">device.ip &#8212; 100% of bid requests<\/text>\n<text x=\"40\" y=\"478\" class=\"t-mono t-muted\" font-size=\"9\">geo &#183; fraud-filter &#183; then quietly repurposed:<\/text>\n<text x=\"40\" y=\"492\" class=\"t-mono\" font-size=\"9.5\" style=\"fill:var(--text)\">infrastructure colonised as the household join key<\/text>\n<line x1=\"448\" y1=\"74\" x2=\"448\" y2=\"492\" class=\"ln-soft\" stroke-width=\".75\"/>\n<text x=\"466\" y=\"92\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--text)\">THE MATCHING RULE<\/text>\n<text x=\"466\" y=\"106\" class=\"t-mono t-muted\" font-size=\"9\">// the two fields are not treated equally<\/text>\n<rect x=\"466\" y=\"120\" width=\"210\" height=\"58\" class=\"f-bg\" stroke-width=\"1.5\" style=\"stroke:var(--accent)\"/>\n<line x1=\"466\" y1=\"120\" x2=\"466\" y2=\"178\" stroke-width=\"3\" style=\"stroke:var(--accent)\"/>\n<text x=\"478\" y=\"138\" class=\"t-mono\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--accent)\">LiveRamp &#8594; partners:<\/text>\n<text x=\"478\" y=\"154\" class=\"t-mono\" font-size=\"10\" font-weight=\"bold\" style=\"fill:var(--text)\">\"send IPv4 only\"<\/text>\n<text x=\"478\" y=\"170\" class=\"t-mono t-muted\" font-size=\"8.5\">IPv6 \"in most cases will not match\"<\/text>\n<rect x=\"466\" y=\"192\" width=\"210\" height=\"40\" class=\"f-t4\" opacity=\".26\"/>\n<line x1=\"466\" y1=\"192\" x2=\"466\" y2=\"232\" stroke-width=\"3\" style=\"stroke:var(--t4)\"/>\n<text x=\"478\" y=\"210\" class=\"t-mono\" font-size=\"9.5\" font-weight=\"bold\" style=\"fill:var(--muted)\">device.ipv6 &#8212; under-matched<\/text>\n<text x=\"478\" y=\"224\" class=\"t-mono t-muted\" font-size=\"8\">72% under-represented in commercial files<\/text>\n<text x=\"466\" y=\"262\" class=\"t-mono\" font-size=\"11\" font-weight=\"bold\" style=\"fill:var(--text)\">EU TRUNCATION PRACTICE<\/text>\n<text x=\"466\" y=\"276\" class=\"t-mono t-muted\" font-size=\"9\">// masking lives in policy, not spec<\/text>\n<rect x=\"466\" y=\"288\" width=\"210\" height=\"44\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"478\" y=\"306\" class=\"t-mono\" font-size=\"9.5\" style=\"fill:var(--text)\">IPv4 &#8594; last octet zeroed<\/text>\n<text x=\"478\" y=\"322\" class=\"t-mono t-muted\" font-size=\"9\">203.0.113.<tspan style=\"fill:var(--t3)\" font-weight=\"bold\">0<\/tspan> &#160;(/24, &#8804;256 homes blurred)<\/text>\n<rect x=\"466\" y=\"344\" width=\"210\" height=\"44\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<text x=\"478\" y=\"362\" class=\"t-mono\" font-size=\"9.5\" style=\"fill:var(--text)\">IPv6 &#8594; truncated to /48&#8211;/64<\/text>\n<text x=\"478\" y=\"378\" class=\"t-mono t-muted\" font-size=\"8.5\">prefix kept &#183; coarser than a household<\/text>\n<line x1=\"408\" y1=\"170\" x2=\"466\" y2=\"149\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n<line x1=\"408\" y1=\"216\" x2=\"466\" y2=\"212\" class=\"ln-soft\" stroke-width=\"1\" stroke-dasharray=\"2 2\"/>\n<line x1=\"40\" y1=\"512\" x2=\"676\" y2=\"512\" class=\"ln\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n<text x=\"40\" y=\"532\" class=\"t-mono t-muted\" font-size=\"9.5\">// one locator, two fields, unequal fates &#8212; the IPv4 octet that geo &amp; fraud needed became the join the graph keeps<\/text>\n<text x=\"40\" y=\"548\" class=\"t-mono t-muted\" font-size=\"9.5\">// src: OpenRTB 2.6 &#167;3.2.18 (IAB Tech Lab) &#183; LiveRamp partner matching guidance &#183; GDPR-era truncation conventions<\/text>\n<\/svg>\n<figcaption><strong>Fig. 4.<\/strong> The bid request carries the address as two one-line fields, but the matching layer keeps only one: <span style=\"font-family:var(--mono)\">device.ip<\/span> &#8212; present in every request for geo and fraud &#8212; is the surface where a locator is quietly conscripted as the household join key, while its IPv6 twin, technically richer, is told it &#8220;will not match&#8221; and left to decay.<\/figcaption>\n<\/figure>\n\n\n**Citations:** IAB Tech Lab, \"OpenRTB 2.6\" specification (initial release April 2022; current line v2.6-202309, maintained on GitHub), https://github.com/InteractiveAdvertisingBureau/openrtb2.x/blob/main/2.6.md (raw text read directly; Tier 1; accessed 2026-06-09); IAB Tech Lab OpenRTB standards page, https://iabtechlab.com/standards/openrtb/ (Tier 1; accessed 2026-06-09); Google, \"Authorized Buyers Real-time Bidding FAQ,\" https://developers.google.com/authorized-buyers/rtb/faq (Tier 1 for Google's own exchange policy; accessed 2026-06-09)\n\n**Context.** OpenRTB 2.6 is the bid-request lingua franca of programmatic CTV (it is the release that added CTV ad pods). The IP fields in its Device object are how the address layer physically enters the auction.\n\n**Direct reading — the spec text.** In Object: Device (§3.2.18), the field definitions are, verbatim and in full:\n\n- `ip` — \"IPv4 address closest to device.\"\n- `ipv6` — \"IP address closest to device as IPv6.\"\n\nThat is the entirety of the normative IP semantics. Adjacent fields: `lmt` — \"'Limit Ad Tracking' signal commercially endorsed (e.g., iOS, Android), where 0 = tracking is unrestricted, 1 = tracking must be limited per commercial guidelines.\" The Geo object (§3.2.19) carries `ipservice` (\"Service or provider used to determine geolocation from IP address if applicable (i.e., type = 2)\"), acknowledging IP-derived geo as a first-class type.\n\n**What the spec does *not* say — correction of the record.** A direct read of the 2.6 text finds **no truncation or masking requirement, recommendation, or even mention for the ip/ipv6 fields**. Claims that \"OpenRTB requires/provides IP truncation for privacy\" conflate the spec with *exchange policy*. The most consequential such policy is Google's, stated in its Authorized Buyers RTB FAQ: \"IPv4 addresses are truncated to 3 byte strings, which represent the first three octets of an IP address … IPv6 addresses are truncated to 6 byte strings. Buyers will get the first 6 bytes of IPv6 addresses,\" done \"to protect user privacy,\" while \"truncated IP addresses can still offer information such as general geographic region and ISP.\" So: /24 visibility for IPv4 (≤256 households blurred together), /48 for IPv6 (one-to-256 households depending on delegation, per §3). Other SSPs and DSPs implement their own GDPR-motivated masking conventions; none of this is in the IAB spec text itself.\n\nThe phrase \"closest to device\" is also load-bearing for fraud (§13): in SSAI, the ad request originates at a datacenter server, and `device.ip` is whatever the SSAI vendor — or an impostor — *declares* as the device-side address. The spec defines a field, not a verification mechanism.\n\n**Significance.** The auction's IP layer is normatively thin: two one-line field definitions, with all privacy handling (truncation), all verification (is this really the device's IP?), and all interpretation (household? geo? CGN egress?) pushed to bilateral policy and vendor practice. Claims about \"what OpenRTB says\" about IP privacy should cite exchange policies, not the spec.\n\n> **The takeaway:** The OpenRTB 2.6 specification defines `device.ip`/`device.ipv6` only as the address \"closest to device\" and contains no IP truncation or masking provisions; truncation regimes (e.g., Google's first-3-bytes IPv4 / first-6-bytes IPv6 policy) are exchange-level policies frequently misattributed to the spec. [11][12][13]\n\n---\n\n## 9. CJEU, Breyer v Bundesrepublik Deutschland (C-582/14, 19 October 2016) — what it actually held about dynamic IPs\n\n**Citation:** Court of Justice of the EU (Second Chamber), Judgment of 19 October 2016, Patrick Breyer v Bundesrepublik Deutschland, Case C-582/14, ECLI:EU:C:2016:779. Read via EUR-Lex, https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A62014CJ0582 (Tier 1; accessed 2026-06-09)\n\n**Context.** The judgment every privacy deck cites as \"the EU ruled IP addresses are personal data.\" The facts: Mr Breyer accessed publicly available websites of German Federal institutions, which \"store information on all access operations in logfiles,\" including \"the IP address of the computer from which access was sought,\" to prevent attacks and enable prosecution (paras 13–14). The question was whether a *dynamic* IP held by the *website operator* (not the ISP) is personal data under Directive 95/46 Art 2(a) — pre-GDPR law.\n\n**Direct reading.** The operative ruling (dispositif, point 1), verbatim:\n\n> \"Article 2(a) of Directive 95/46/EC … must be interpreted as meaning that a dynamic IP address registered by an online media services provider when a person accesses a website that the provider makes accessible to the public constitutes personal data within the meaning of that provision, in relation to that provider, **where the latter has the legal means which enable it to identify the data subject with additional data which the internet service provider has about that person**.\" (emphasis added)\n\nThe reasoning adopts a *relative* approach with an outer limit:\n\n- Para 43: Recital 26's \"means likely reasonably to be used by both the controller and by 'any other person'\" implies \"it is not required that all the information enabling the identification of the data subject must be in the hands of one person.\"\n- Para 44: that the additional data sits with the ISP \"does not appear to be such as to exclude\" personal-data status.\n- Para 45: but one must still ask whether combining the IP with the ISP's data \"constitutes a means likely reasonably to be used to identify the data subject.\"\n- Para 46 (the limit): identifiability fails \"if the identification of the data subject was prohibited by law or practically impossible on account of the fact that it requires a disproportionate effort in terms of time, cost and man-power, so that the risk of identification appears in reality to be insignificant.\"\n- Paras 47–48 (why Germany crossed the threshold): German law gives the website operator legal channels — \"in particular, in the event of cyber attacks\" — to reach the competent authority, which can obtain subscriber identity from the ISP; therefore the operator \"has the means which may likely reasonably be used\" to identify.\n\n**Correction of the record — both directions.** What Breyer did **not** hold: that IP addresses are personal data per se, always, for everyone. The holding is conditional (\"where the latter has the legal means…\"), relative (assessed per data-holder), jurisdiction-contingent (it turned on German procedural law), about *dynamic* addresses specifically (static IPs were already settled, Scarlet Extended), and decided under the 1995 Directive, not the GDPR. What minimizers also cannot claim: that Breyer made IP-personal-data status exotic. The court set the \"legal means\" bar low (ordinary cyber-attack procedures sufficed), and under GDPR — whose Recital 30 names \"internet protocol addresses\" among online identifiers and whose Article 4(1)/Recital 26 restate the means-reasonably-likely test — EU supervisory authorities and courts have, in practice, treated IPs (including dynamic ones) as personal data in essentially all commercial ad-tech contexts, where contractual and technical linkage paths are far richer than Breyer's cyber-attack channel. The honest formulation: *Breyer established a conditional test whose conditions are nearly always satisfied for ad tech; industry summaries skip the test and keep the conclusion.*\n\n> **The takeaway:** Breyer (C-582/14) held that a dynamic IP address held by a website operator is personal data only \"where the [operator] has the legal means which enable it to identify the data subject with additional data which the internet service provider has\" — a conditional, relative test (with a para-46 carve-out where identification is legally prohibited or practically impossible), not the unconditional \"IPs are personal data\" rule it is usually cited for; in GDPR-era ad-tech practice the condition is almost always met. [14]\n\n---\n\n## 10. Apple iCloud Private Relay — official technical documentation: scope, architecture, and the CTV gap\n\n**Citations:** Apple, \"Prepare your network or web server for iCloud Private Relay,\" Apple Developer Support, https://developer.apple.com/support/prepare-your-network-for-icloud-private-relay/ (Tier 1; accessed 2026-06-09); Apple, \"About iCloud Private Relay,\" Support article 102602, https://support.apple.com/en-us/102602 (Tier 1; accessed 2026-06-09). Apple's white paper \"iCloud Private Relay Overview\" (PDF, December 2021, apple.com/icloud/docs/) could not be text-extracted directly, so all quotations below are from the two Apple HTML documents.\n\n**Context.** Private Relay is the most-cited evidence for \"IP is going away.\" The documentation defines a much narrower scope than the discourse implies — and the boundary runs exactly along the line that matters for CTV.\n\n**Direct reading — scope.** The developer document states the covered traffic precisely:\n\n> \"Private Relay protects users' web browsing in Safari, DNS resolution queries, and insecure http app traffic.\"\n\nSupported platforms: \"users on iOS 15, iPadOS 15, and macOS Monterey and later,\" as a feature of a paid iCloud+ subscription (\"iCloud Private Relay — part of an iCloud+ subscription — helps protect your privacy when you browse the web in Safari,\" per the support article). **tvOS / Apple TV is not among the supported platforms in Apple's documentation**, and the covered-traffic definition (Safari + DNS + insecure HTTP) excludes the HTTPS app traffic that constitutes essentially all CTV streaming-app and ad activity even on covered devices.\n\n**Direct reading — architecture and IP handling.** Dual hop, split knowledge:\n\n> \"iCloud Private Relay uses an innovative multi-hop architecture in which users' requests are sent through two separate internet relays operated by different entities. This way, no single party — including Apple — can view or collect the details of users' browsing activity.\"\n\nPer the support article: \"Your IP address is visible to your network provider and to the first relay, which is operated by Apple. Your DNS records are encrypted, so neither party can see the address of the website you're trying to visit. The second relay, which is operated by a third-party content provider, generates a temporary IP address, decrypts the name of the website you requested, and connects you to the site.\" Egress addresses are not anonymous-random: \"Private Relay replaces the user's original IP address with one assigned from the range of IP addresses used by the service… The relay IP address presented to networks and web servers accurately represents the client's coarse city-level location by default,\" and Apple publishes the egress ranges with geolocation (\"egress-ip-ranges.csv\" geofeed at mask-api.icloud.com).\n\n**Significance — be precise about the CTV non-event.** For CTV specifically, Private Relay changes almost nothing *directly*: it does not run on smart TVs, streaming sticks, or (per Apple's platform list) Apple TV, and it does not cover HTTPS app traffic anywhere. What it does affect: (a) the *household graph's enrichment edges* — Safari browsing on iPhones/iPads/Macs in the home no longer presents the household IP to websites, thinning the cross-device linkage data that connects CTV glass to people; and (b) the *norm* — Apple operationalized \"IP is sensitive\" with published egress geofeeds preserving city-level geo, a template Google's IP Protection copies. Claims of the form \"Private Relay breaks CTV IP targeting\" are wrong as stated; claims that it erodes the IP-keyed person↔household join on Apple-heavy networks are supportable.\n\n> **The takeaway:** Apple's own documentation scopes iCloud Private Relay to \"web browsing in Safari, DNS resolution queries, and insecure http app traffic\" on iOS/iPadOS/macOS for iCloud+ subscribers — no tvOS/smart-TV coverage and no HTTPS app-traffic coverage — so it does not proxy CTV ad traffic, while its published egress geofeed deliberately preserves coarse city-level IP geolocation. [15][16]\n\n---\n\n## 11. Google IP Protection (Chrome) — official documentation: masked third-party traffic in Incognito\n\n**Citation:** Google, \"IP Protection,\" Privacy Sandbox documentation, https://privacysandbox.google.com/protections/ip-protection (Tier 1; accessed 2026-06-09)\n\n**Context.** Google's analogue to Private Relay, scoped even more narrowly. Frequently cited in CTV decks as \"Chrome will hide IPs\"; the documentation specifies for whom, where, and when.\n\n**Direct reading.** Scope:\n\n> \"IP Protection enhances Incognito mode's cross-site tracking protections, by masking a user's original IP address in third-party contexts.\"\n\nThree nested limits, all explicit in the doc: (1) **Incognito mode only** — standard-mode Chrome browsing is untouched; (2) **third-party contexts only**, and only for domains on the **Masked Domain List (MDL)**: \"IP Protection will not apply in a first-party context — meaning that the domain for a resource matches the top level domain — even if the domain itself is on the MDL\"; (3) Chrome only. Architecture is two-hop with split operators: the first proxy (Google-run) \"sees only the user's IP and a request to connect to the second proxy server. The first proxy server does not see the destination IP address or the content of the request\"; the second (run by an external CDN) \"sees only the destination domain. This proxy does not see the user's original IP address\" — \"neither proxy server can link the user's IP to the websites they visit.\" Geo is deliberately preserved at coarse grain: the system \"assigns IP addresses that represent the user's coarse location, including country,\" with a public geofeed file for IP-geo vendors. Rollout is region-staged with no firm dates in the doc (\"IP Protection in Chrome will roll out in certain regions before being available globally\").\n\n**Significance.** Direct CTV impact: nil — CTV ad requests do not originate from Chrome Incognito third-party subresource fetches. Indirect impacts mirror Private Relay's: it degrades the *third-party-tracker view* of household IPs from desktop/mobile web sessions (the enrichment edges of household graphs), and — strategically — both Apple and Google have now converged on the same design grammar: proxy the IP, *keep* coarse geolocation, publish geofeeds so legitimate geo use survives. That design choice (geo preserved, identity severed) is itself primary evidence of where platform consensus on IP is heading, and several claims about the trajectory ahead should rest on it.\n\n> **The takeaway:** Google's IP Protection documentation scopes the feature to masking IPs in third-party contexts on the Masked Domain List, in Incognito mode only, via a two-hop proxy (Google first hop, external CDN second), while assigning egress IPs that \"represent the user's coarse location, including country\" published in a geofeed — i.e., it severs IP-identity while deliberately preserving IP-geography, and touches no CTV device traffic. [17]\n\n---\n\n## 12. The Truthset / CIMM / Go Addressable IP-accuracy study and FreeWheel's \"The Right Way to Use IPs for Targeting\" — what 13%, 16%, and \"87%\" do and don't mean\n\n**Citations:** Truthset, \"CIMM and Go Addressable Release Landmark Report on IP-to-Household Accuracy, Highlighting Gaps in CTV and Audience-Based Advertising,\" truthset.com/news/, announced at the Go Addressable Summit, 5 November 2025 (Tier 1 for what the study reports; the full report is gated; accessed 2026-06-09). Brandt, B., \"The Right Way to Use IPs for Targeting,\" FreeWheel Insights blog, https://www.freewheel.com/insights/blog/using-ips-for-targeting (Tier 5 trade analysis by an interested vendor — FreeWheel is Comcast-owned and sells the deterministic alternative; lean noted; accessed 2026-06-09)\n\n**Context.** The most-quoted accuracy numbers in current CTV identity debates. Headlines built on them include \"IP targeting misses 87% of households\" and \"IP targeting is only 13–16% accurate.\" The study's own description is more specific about what was measured.\n\n**Direct reading — methodology.** Per Truthset's announcement: the study benchmarked \"nearly one billion IP records from six major data providers\" against ground-truth IP-to-household assignments supplied by \"two leading Internet Service Providers (ISPs) and one leading Multichannel Video Programming Distributor (MVPD).\" (Trade coverage adds a 90-day collection window, December 2024–February 2025; that detail is single-sourced to press summaries, not confirmed on Truthset's page.) The organizations: CIMM (a \"non-partisan, pan-industry coalition\" on measurement), Go Addressable (a trade group \"led by TV distribution companies\"), Truthset (a data-validation company).\n\n**Direct reading — findings, verbatim where the announcement states them:**\n\n- \"IP-to-postal linkages are accurate, on average, 13% of the time.\"\n- \"IP-to-email linkages are accurate, on average, 16% of the time.\"\n- \"Data providers agree only 6.4% of the time on IP-to-postal linkages and 2.8% of the time on IP-to-email linkages.\"\n- \"There are 3x more IPs-per-postal than there should be.\"\n- \"IPv6s are under-represented by 72% in large datasets, with only 15% of commercial files capturing them.\"\n- Accuracy varies by \"when (time of year) and where (state-level geography).\"\n\nFreeWheel's gloss states the mechanism plainly (\"the IP you have today might belong to your neighbor tomorrow\" — churn via router resets, ISP rotation, VPNs) and the prescription: \"The best practice for using IP addresses as identifiers is to connect to a source of truth,\" i.e., deterministic ISP/MVPD-sourced resolution (FreeWheel cites Comcast's deterministic IP data — note the obvious commercial alignment: Comcast owns FreeWheel and the deterministic asset being recommended).\n\n**Correction of the record — what the numbers are and are not.** The 13%/16% figures measure the **precision of commercial third-party IP↔postal and IP↔email linkage files, averaged across six providers, validated against ISP/MVPD truth**. They are *not*:\n\n- a measurement of whether an IP address identifies a household at a moment in time (the study's own ground truth — ISP assignment records — is precisely such an identification, taken as valid);\n- a measurement of IP stability per se (instability is one *cause* of file decay, alongside stale collection, modeled assignment, and CGN/mobile contamination — the 3x-IPs-per-postal and timestamp-inconsistency findings point at the file-hygiene causes);\n- a verdict on same-session or short-window IP use (frequency capping within hours/days, household co-graphing of simultaneous events), which the study did not test;\n- \"87% of households missed\" — the popular inversion converts average linkage precision into a campaign reach/waste figure, and derived statistics (\"three cents per dollar reaches the audience\") add further modeling assumptions from third parties (e.g., Ampersand's promotional framing), none of which is in the announced findings.\n\nTwo findings deserve more attention than the headline number: provider files agree with *each other* only 6.4%/2.8% of the time (the linkage market is not just imprecise but mutually contradictory), and commercial files largely miss IPv6 (72% under-representation) just as the traffic mix tips majority-IPv6 (§14) — meaning the measured product is decaying on both the truth axis and the coverage axis simultaneously.\n\n> **The takeaway:** The Truthset/CIMM/Go Addressable study (announced 5 Nov 2025) found commercial third-party IP-to-postal linkages accurate on average 13% of the time and IP-to-email 16%, with inter-provider agreement of only 6.4%/2.8% and IPv6 under-represented by 72% in commercial files — figures that measure third-party linkage-file precision against deterministic ISP/MVPD truth, not the momentary validity of IP-household assignment or short-window IP use; \"misses 87% of households\" is a derived inversion, not a study finding. [18][19]\n\n---\n\n## 13. HUMAN (White Ops) — the ICEBUCKET investigation (April 2020): how IP spoofing actually worked in the largest CTV fraud scheme\n\n**Citation:** HUMAN Security (then White Ops), Satori Threat Intelligence & Research, \"ICEBUCKET\" investigation, published April 2020; canonical post: \"Giving Fraudsters the Cold Shoulder: Inside the Largest Connected TV Bot Attack,\" humansecurity.com/learn/blog/ (Tier 1 as the investigator's own report). **Access note:** the HUMAN page could not be retrieved directly on 2026-06-09; figures below are the report's, as quoted contemporaneously by VideoWeek (16 Apr 2020), SecurityWeek, Threatpost, and cybersecurity-help.cz, all consistent.\n\n**Context.** SSAI (server-side ad insertion) stitches ads into the video stream at a datacenter server, which then makes ad requests *on behalf of* the glass device. The verification consequence: tags fire on the server, no client-side JavaScript runs on the TV, and — per §8 — `device.ip` and the user agent are whatever the server *declares*. ICEBUCKET is the canonical demonstration of what that trust model permits.\n\n**Direct reading (reconstructed from the report's published figures).** The operation stood up fake \"SSAI servers\" in datacenters that emitted fabricated CTV ad requests wholesale:\n\n- At peak it \"impersonated more than 2 million people in over 30 countries\" and accounted for \"nearly 28% of the programmatic CTV traffic\" HUMAN had visibility into — about **1.9 billion ad requests per day** in January 2020.\n- Inventory fabrication: **300+ appIDs** counterfeiting publishers, **1,000+ user-agents** (~500 seen nowhere else).\n- The IP layer: **~2 million spoofed (declared) IP addresses, over 99% of them located in the United States** — residential-looking US addresses inserted into the device-IP field to simulate premium US CTV households — generated from about **1,700 actual SSAI-server IPs in 9 countries**. The 1,700:2,000,000 ratio is the scheme in one number: a small datacenter footprint *declaring* two million household identities it never possessed.\n- Mechanism, as summarized by the researchers in contemporaneous interviews: fraudsters sent ad requests from datacenters for \"spoofed\" edge devices and then called the reporting APIs \"indicating the ad has been shown\"; legitimate SSAI looks superficially identical (\"Without knowing what SSAI is, that looks like fraud\" — Michael Moran, then-White Ops, to VideoWeek), which is the camouflage.\n- Detection keyed on scheme-specific anomalies — concentration of declared devices behind few server IPs, user-agent strings unique to the operation, and impossible device/traffic patterns; HUMAN noted at publication that \"ICEBUCKET is an ongoing operation. The volumes have not gone down to zero.\"\n\n**Significance.** ICEBUCKET is the proof-case for a structural point that matters here: **in SSAI-mediated CTV, the IP address is an assertion, not an observation.** Anti-fraud heuristics built for the web (datacenter-IP blocklists) are inverted in CTV — *legitimate* SSAI traffic comes from datacenter IPs, so the datacenter-vs-residential test cannot separate good from bad; what separates them is whether the declared device IP corresponds to a real session, which requires signed/validated signal paths (the gap that later IAB Tech Lab work on SSAI transparency and cryptographic signing tries to fill). Any claim using IP as a fraud *filter* in CTV must reckon with the fact that the largest recorded scheme passed two million fake residential IPs into the field.\n\n> **The takeaway:** HUMAN/White Ops's ICEBUCKET investigation (Apr 2020) documented ~1,700 datacenter SSAI-server IPs in 9 countries declaring ~2 million spoofed device IPs (>99% US-located) across 300+ counterfeit appIDs and 1,000+ user-agents, peaking at ~1.9B ad requests/day and ~28% of the programmatic CTV traffic in HUMAN's visibility — demonstrating that in SSAI architecture the device IP in the bid request is a declared, spoofable value. [20][21][22]\n\n---\n\n## 14. IPv6 measurement — Google's statistics, APNIC Labs' methodology, and why 50% and 42% are both true (2026)\n\n**Citations:** Google, \"IPv6 Statistics,\" https://www.google.com/intl/en/ipv6/statistics.html (Tier 1; accessed 2026-06-09); APNIC Labs / Geoff Huston, \"How we measure: IPv6,\" APNIC Blog, 14 November 2025, https://blog.apnic.net/2025/11/14/how-w
