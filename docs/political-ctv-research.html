ata Trusts\" (Koch-funded; Palmer; Themis merger; 300M+ profiles, ~1,800 data points). https://www.i-360.com/ — Tier 1 vendor / Tier 5. Accessed 2026-06-23.\n48. Catalist, \"Data Dynamic National Database\" (founded 2006 by ex-Clinton staffers; unionized progressive utility; works only with Democratic/progressive clients). https://catalist.us/data/ — Tier 1 vendor claim. Accessed 2026-06-23.\n49. TargetSmart, \"TargetSmart\" + VoterBase (208M+ voters; 53M unregistered; 171M cell numbers; leading Democratic provider). https://targetsmart.com/ — Tier 1 vendor claim. Accessed 2026-06-23.\n50. TargetSmart, \"Catalist and TargetSmart Partner to Share Phone Data\" (85M+ phone numbers; 24M communities of color). https://targetsmart.com/catalist-and-targetsmart-partner-to-share-phone-data-for-voter-outreach/ — Tier 1 vendor claim. Accessed 2026-06-23.\n51. Comscore / PRNewswire, \"Comscore and L2, Inc. Launch First of Its Kind Cookie-free Audiences Based on Voter Insights,\" Jan 2022 (100+ issue/behavior segments; Predictive Audiences; all leading DSPs). https://www.comscore.com/Insights/Press-Releases/2022/1/Comscore-and-L2-Inc-Launch-First-of-Its-Kind-Cookie-free-Audiences-Based-on-Voter-Insights — Tier 1 press release as claim. Accessed 2026-06-23.\n52. Comscore, \"With Elections Approaching, New TargetSmart-Comscore Partnership Empowers Progressive Advertisers,\" Feb 2024 (progressive-only; cross-platform TV/digital/CTV viewership for voter targeting). https://www.comscore.com/Insights/Press-Releases/2024/2/With-Elections-Approaching-New-TargetSmart-Comscore-Partnership-Empowers-Progressive-Advertisers — Tier 1 press release as claim. Accessed 2026-06-23.\n53. Variety, \"Comscore, iSpot, VideoAmp Get New Nod from TV Measurement Committee,\" 2025 (JIC re-certification). https://variety.com/2025/tv/news/comscore-ispot-videoamp-tv-measurement-committee-1236451498/ — Tier 5 trade. Accessed 2026-06-23.\n54. AdExchanger / Marketing Dive, \"The JIC Certifies Comscore And VideoAmp As National TV Currencies\" + currency-audit coverage (Comscore/VideoAmp Apr 2024, iSpot Aug; Comscore MRC local+national; Paramount–Nielsen non-renewal Oct 2024 → VideoAmp). https://www.adexchanger.com/measurement/the-jic-certifies-comscore-and-videoamp-as-national-tv-currencies/ — Tier 5 trade. Accessed 2026-06-23.\n55. Turn It Blue Digital, \"CTV CPM Reality Check: What Political Campaigns Actually Pay in 2026\" (overall $18–80; premium $35–80; mid-tier $25–45; FAST $18–28). https://www.turnitbluedigital.com/ctv-cpm-reality-check-what-political-campaigns-actually-pay-in-2026-and-how-to-keep-costs-down — Tier 6 (partisan digital shop; note lean; practitioner CPM ranges). Accessed 2026-06-23.\n56. MarTech, \"Political ad spending shifts regional CTV costs for brands\" (swing-state CPMs +8% YoY; hyperlocal scarcity). https://martech.org/political-ad-spending-shifts-regional-ctv-costs-for-brands/ — Tier 5 trade. Accessed 2026-06-23.\n57. Sludge, \"The Democratic Consultants Getting Rich off the Harris Campaign,\" Nov 2024 (BPI/Waterfront disbursements corroboration). https://readsludge.com/2024/11/13/the-democratic-consultants-getting-rich-off-the-harris-campaign-2/ — Tier 6 (left-leaning investigative; note lean). Accessed 2026-06-23."}, {"order": 4, "file": "04_Ad_Impact_And_Effectiveness.md", "title": "Ad Impact and Effectiveness: Does Political CTV Advertising Actually Work?", "summary": "", "body": "# 04 — Ad Impact and Effectiveness: Does Political CTV Advertising Actually Work?\n\n## Bottom Line\n\n**Start with the honest answer: the strongest independent evidence says the average persuasive effect of a political ad in a U.S. general election is statistically indistinguishable from zero — and moving that ad from a cable box to a connected TV (CTV) changes none of the persuasion physics.** The best peer-reviewed estimate of campaign contact and advertising on candidate choice in a general election is *zero* (Kalla & Broockman 2018, a meta-analysis of 49 field experiments) [1]. The most exhaustive ad-content study moves a candidate's favorability by 0.05 points on a 5-point scale and vote intention by a statistically insignificant 0.007 of a percentage point (Coppock, Hill & Vavreck 2020, 49 ads × 59 experiments × 34,000 subjects) [2]. The one randomized field experiment built to test *digital* video persuasion at scale found a precinct-level effect of **−0.04 percentage points** (Coppock, Green & Porter 2022) [3]. CTV is a digital video channel. It inherits this evidence base.\n\n**Against that, the vendor case is real but narrow, and it answers a different question.** The Trade Desk, Comscore, and political ad-tech firms do not generally claim to move votes — they claim to move *reach and efficiency*. The headline numbers are genuine and verifiable as **what was claimed**: a Comscore/Trade Desk case study says a campaign \"reached households on CTV **36% more efficiently** than linear TV\" by suppressing already-exposed audiences [4]; a separate FlexPoint/Congressional Leadership Fund case (the Miller-Meeks IA-01 race) reports **23% incremental reach** on digital, with **99%** of CTV/online-video-reached voters unique to those channels [5]. These are media-planning metrics — cord-cutters reached, wasted frequency avoided — not vote outcomes. The category error at the center of the entire corpus is treating a reach-efficiency number as an effectiveness number.\n\n**Three load-bearing caveats keep this from being a flat \"ads don't work.\"** (1) Effects are *not* uniformly zero: TV advertising is **2–4× more persuasive in down-ballot races and 10–19× more in low-information statewide races** (state treasurer, attorney general) than in presidential contests (Sides, Vavreck & Warshaw 2022) [6] — and most CTV money goes down-ballot and into primaries, exactly where ads can still inform. (2) Effects exist but **decay within days**: Gerber, Gimpel, Green & Shaw 2011 found a ~4.7-point current-week swing in a $2M TV experiment that vanished a week later [7]. (3) **Mobilization is a separate question from persuasion** — getting a likely supporter to the polls is an easier, better-evidenced lift (sub-1-point from mail; canvassing larger) than changing a mind, and turnout, base, and donor targeting is where CTV's addressability plausibly earns its keep (Green & Gerber GOTV literature) [8].\n\n**The decisive methodological problem: almost every number proving CTV \"works\" comes from the firm selling the inventory — a structural bias that even a rival vendor will point to.** In a Digiday-published *sponsored* post (branded content bylined by PebblePost's chief revenue officer, whose company sells programmatic direct mail — a channel competing with CTV), the argument runs that ad-tech platforms \"make money in a way that creates a structural bias toward overclaiming results,\" and that CTV reporting \"mostly centers on metrics that characterize exposure\" rather than outcomes [9]. Read that source with its conflict in view: it is one vendor disparaging a rival channel's measurement, not disinterested trade press conceding its own bias — but the structural logic stands on its own regardless of who voices it. As of mid-2026, **no public randomized evidence shows the CTV format outperforming linear or other digital video for persuasion or turnout.** Here is where the evidence leans. Vendor reach and efficiency claims are credible *as media-planning facts*. Vendor or implied *persuasion* claims outrun the evidence. The academic null is the right default for general-election vote-moving. And the live, defensible use case is mobilization and informing voters in low-salience races — not swinging presidential persuadables.\n\n---\n\n## How to Read This Document\n\nThis is the corpus's adversarial core. The rule throughout: **a disagreement about a number is different from a disagreement about what the number means.** Most of the apparent vendor-vs-academic conflict is the second kind. The vendors are usually right that they reached incremental households 36% more efficiently; the academics are usually right that this did not move the election. Both can be true, because they are measuring different things. Where there is a genuine *fact* dispute — for example, whether any rigorous study shows CTV-specific persuasion lift — it is flagged as such.\n\nEvery vendor figure in this document is tagged **[VENDOR-CLAIM]** the first time it appears and is treated as evidence of *what a seller asserts*, never as established effectiveness. Every peer-reviewed estimate is treated as the higher-tier evidence on the underlying behavioral question. Acronyms are decoded on first use.\n\n**Terms decoded once:**\n- **CTV** — connected TV: a television receiving streaming video over the internet (a smart TV, a Roku/Fire stick, a game console). The ad inventory is digital, bought programmatically.\n- **Linear TV** — traditional scheduled broadcast/cable TV, bought by program/daypart.\n- **Incrementality / incremental reach** — the audience an ad reached that a *different* channel did *not* reach. A planning metric about overlap, not about persuasion.\n- **Frequency capping** — limiting how many times one household sees an ad, to avoid waste/annoyance.\n- **Lift study** — a comparison of an exposed group vs. an unexposed group on some outcome (recall, favorability, \"intent,\" sometimes modeled votes). Quality depends entirely on whether the groups were *randomized* and the outcome is *behavioral*.\n- **Attribution** — assigning credit for an outcome (a visit, a donation, a vote) to a specific ad exposure. In CTV this is notoriously leaky.\n- **GOTV** — get-out-the-vote: mobilizing people already inclined to support you to actually vote. Distinct from persuasion (changing whom someone supports).\n- **Minimal-effects** — the political-science finding that mass persuasion in high-salience elections is, on average, very close to zero.\n\n---\n\n## 1. The Vendor / Industry Case — In Its Own Language and Numbers\n\nHere is the industry case steelmanned at full strength. It is **not** \"ads change minds.\" Read carefully, the sophisticated vendor pitch concedes the persuasion literature and pivots to four claims that are largely true and largely about media efficiency.\n\n### 1.1 Incrementality: reaching cord-cutters linear can't\n\nThe strongest, most defensible vendor claim is structural, not behavioral. As households cut the cord, a large and growing slice of the electorate becomes **unreachable on linear TV at any price.** AdImpact and others put streaming households at the majority of U.S. TV homes, and CTV is the only TV category projected to *grow* into 2026 [10]. If a campaign's persuadable or mobilization targets live behind a streaming app, linear gross rating points never touch them. On this argument CTV is not a better persuader but a *necessary* complement for completing reach.\n\nThe numbers the industry cites for this are credible **as reach facts**:\n- A Comscore/Trade Desk case study reports a campaign that, by using Proximic linear-exposure data to suppress already-reached households, \"reached households on CTV **36% more efficiently than the linear TV**\" [VENDOR-CLAIM] [4]. The \"efficiency\" here is incremental-audience efficiency: fewer wasted impressions on people already saturated on cable.\n- A FlexPoint case for the Congressional Leadership Fund (CLF, a Republican super PAC) in the Miller-Meeks IA-01 race claims FlexPoint \"extended its reach on digital by **23%**,\" with Comscore Campaign Ratings validating that **99%** of potential voters reached via online video / CTV were *unique* — no linear overlap [VENDOR-CLAIM] [5].\n\n**Adversarial read:** these are almost certainly *true and almost certainly beside the point of effectiveness.* \"We reached 23% more unique households\" is a statement about coverage, not about whether those households voted differently. The 99%-unique figure is the most honest number in the whole genre, because it transparently measures overlap and nothing else. The incrementality case earns a high grade — but only for the claim it actually makes: *complete your reach.* About persuasion per impression, it says nothing.\n\n### 1.2 Frequency-capping efficiency — the \"36%\" decoded\n\nThe same Comscore/Trade Desk material frames the 36% as a frequency-management win: by cross-referencing who already saw the campaign's ads on linear (via Comscore's Proximic linear-TV-exposure segments), the buyer avoids re-hitting saturated households and redirects CTV impressions to fresh ones [4]. The Trade Desk's political team frames the failure mode explicitly: keep linear and CTV \"in silos\" and \"you risk over-saturating the audience you do want to reach\" [4].\n\n**Adversarial read:** real and sensible — but it is a cost-of-delivery argument, not an outcome argument. Reducing wasted frequency lowers the price of reaching a target; it does not establish that reaching the target changes behavior. A campaign can be 36% more efficient at delivering an ad that moves zero votes. Efficiency multiplies whatever the underlying effect is — and the underlying effect, per Section 2, is near zero on average in general elections. Multiply zero and you still have zero.\n\n### 1.3 Precision targeting reduces waste (the addressability pitch)\n\nThe voter-file-matched, household-addressable pitch — match a voter file (L2, i360, TargetSmart, Catalist, Aristotle) to a device graph, target only your persuasion or turnout universe — is sold as eliminating the broadcast model's spray-and-pray waste [11]. Comscore's Proximic launched **AI-powered political audience segments** (presidential, Senate, House, gubernatorial) initially exclusive to Trade Desk buyers for 2024, and the **Proximic 2026 Political Targeting Playbook** plus a **Comscore–Yahoo DSP CTV political partnership (March 5, 2026)** confirm the offering is live for the 2026 midterms [12][13].\n\n**Adversarial read:** precision reduces *waste*, which is an efficiency claim, and it can *amplify* a real effect by concentrating spend on responsive voters — exactly the mechanism Kalla & Broockman flag as one of the two rare conditions where persuasion appears (heavy investment in identifying persuadables) [1]. But precision cannot manufacture an effect that isn't there. Targeting the *right* people more cheaply pays off only if those people are movable, and in general elections the literature says very few are.\n\n### 1.4 Conquest, retargeting, and outcome measurement\n\nVendors offer \"conquest\" (target the *opponent's* exposed audience), sequential retargeting, and outcome/attribution products that claim to tie exposure to site visits, donations, app installs, or modeled vote. The Optimum Media / Democratic Governors Association / GMMB CTV-frequency study (May 2026, tested in the 2025 New Jersey governor's race) claims an \"optimal frequency\" group showed \"stronger persuasion metrics and greater decisiveness\" — voters \"more likely to move from undecided to decided\" — than a high-frequency group [VENDOR-CLAIM] [14].\n\n**Adversarial read:** note what the Optimum/DGA study does *not* contain — a single number. The case study runs entirely on direction (\"stronger,\" \"greater,\" \"more likely\") with no effect size, no confidence interval, no disclosed randomization of *exposure*; voters were *segmented by* observed exposure, which is selection, not assignment [14]. This is the genre's tell. The closer an outcome claim approaches *persuasion*, the vaguer and less quantified it becomes, because the rigorous version would have to survive a control group it usually doesn't have. Compare Section 1.1, where the *reach* claims are crisply quantified — because reach is easy to measure and persuasion is not.\n\n### 1.5 The strongest honest version of the vendor case\n\nStripped of overreach, the defensible industry argument is: *\"As the electorate fragments, you cannot complete your reach without CTV; CTV lets you reach incremental, cord-cutting voters and suppress wasteful over-frequency; and addressability concentrates spend on your actual target universe. Whatever your ads' true persuasive or mobilizing effect is, CTV delivers it more completely and more efficiently than linear alone.\"* That argument is largely correct and largely about plumbing. It becomes false only when \"more efficient reach\" is sold, or heard, as \"more votes.\"\n\n---\n\n## 2. The Independent-Evidence Case — The Minimal-Effects Literature\n\nFor a social science, the peer-reviewed political-science evidence is unusually convergent — and it is bad news for anyone selling general-election persuasion. This is the higher-tier evidence on the underlying behavioral question.\n\n### 2.1 The meta-analytic zero (Kalla & Broockman 2018)\n\nThe foundational result: across a meta-analysis of **40 field experiments**, plus **9 original** experiments (49 total), Kalla & Broockman conclude **\"the best estimate of the effects of campaign contact and advertising on Americans' candidate choices in general elections is zero.\"** Published in the *American Political Science Review* (APSR), the field's flagship journal — Tier 1–2 [1]. Persuasive effects emerged in only two narrow circumstances: (a) when candidates took unusually unpopular positions *and* campaigns invested unusually heavily in finding persuadables; and (b) when contact happened long before election day with effects measured immediately — and even then the early persuasion *decayed* [1].\n\n**Why it's load-bearing:** this is not one study but the pooled estimate of dozens of randomized experiments. The \"zero\" is an *average* — individual campaigns in special conditions can do better — yet it remains the correct prior for a general-election ad of any format, CTV included.\n\n### 2.2 The content study: 0.05 favorability points, ~zero on vote (Coppock, Hill & Vavreck 2020)\n\nThe most exhaustive test of ad *content*: **49 real 2016 ads × 59 weekly real-time randomized experiments × 34,000 nationally representative subjects**, published in *Science Advances* [2]. Average effect on candidate favorability: **0.05 points on a 5-point scale** — \"small but statistically significant given the study's size.\" Average effect on vote intention: **a statistically insignificant 0.007 of a percentage point** [2][15].\n\nCrucially, the effect stayed *small regardless of context, message, sender, or receiver* — the same near-zero in battleground and non-battleground states, primary and general, early and late, for Democrats, Republicans, and independents, for attack and promotional ads. The authors explicitly reject the \"heterogeneity hides large offsetting effects\" excuse: the effect is small everywhere, not large-and-canceling [2].\n\n> **Fact-precision note.** Some secondary summaries of this paper report the vote-choice effect as \"0.7 percentage points.\" That is a misreading. The paper and the Yale press office state the vote-intention effect was a *statistically insignificant 0.007 percentage point*; the 0.05 figure is the favorability effect on a 5-point scale [15]. This document uses the verified primary figures and flags the discrepancy because it is exactly the kind of number a careless brief inflates by 100×.\n\n### 2.3 The digital-format study most relevant to CTV (Coppock, Green & Porter 2022)\n\nThis is the single most important paper for the corpus's question, because it tests *digital video at scale with a behavioral outcome.* A ZIP-code-randomized field experiment ran Democratic-leaning PAC ads over Facebook/Instagram during the 2018 Florida midterms — **1.1M+ impressions, 100,000+ full views** — and measured the effect on actual **Democratic precinct-level vote share**: **−0.04 percentage points (SE 0.85)**, indistinguishable from zero, published in *Research & Politics* (peer-reviewed) [3].\n\nCTV is digital video bought programmatically and matched to households — mechanically closer to this experiment than to a 30-second cable spot. **No comparably rigorous public experiment shows the CTV format producing persuasion that Facebook video did not.** Absent that, the honest position is that CTV inherits the null until shown otherwise.\n\n### 2.4 The earlier online-ad nulls (Broockman & Green 2014)\n\nThe original digital-null result: two randomized Facebook-ad experiments for state-legislative candidates found that voters exposed to ads were sometimes more likely to *recall* the ad but **no more likely to recognize or favorably evaluate the candidate** (point estimate ~1.6 points, SE ~1.4 — not distinguishable from zero), in *Political Behavior* [16]. Recall is not persuasion, and the theme recurs: people remember ads that change nothing.\n\n### 2.5 The decay problem (Gerber et al. 2011; Hill et al. 2013)\n\nEven where TV persuasion is *real*, it is fleeting. The landmark **$2M randomized TV experiment** in the 2006 Texas governor's race (Gerber, Gimpel, Green & Shaw, APSR) found a strong current-week effect — roughly **4.7 percentage points** on the incumbent's standing during weeks ads aired — that collapsed to ~**−0.17 points** the following week and vanished thereafter [7]. Hill, Lo, Vavreck & Zaller (\"How Quickly We Forget,\" *Political Communication* 2013) put the half-life of ad persuasion at **1–2 days** in subnational races, with some presidential effect persisting ~6 weeks [17]. The implication: any CTV persuasion that exists must be *continuously repurchased* up to election day. A burst three weeks out buys little by the time ballots are cast.\n\n### 2.6 The nuance that prevents over-claiming the null (Sides, Vavreck & Warshaw 2022; Hewitt et al. 2024)\n\nThe minimal-effects story is about *high-salience* races. Two important qualifiers:\n\n- **Down-ballot is different.** Sides, Vavreck & Warshaw (APSR 2022) show TV advertising \"matters up and down the ballot,\" but the per-airing effect is **2–4× larger in gubernatorial, U.S. House, and U.S. Senate races, and 10–19× larger in other statewide races** (state treasurer, attorney general) than in presidential contests [6]. The mechanism: in low-information races, ads *inform* — they tell voters who the candidates are. This matters enormously for CTV, because a large and growing share of political CTV spend is down-ballot and local, exactly where ads can still move numbers.\n- **Effects exist and vary, but resist prediction (Hewitt et al. 2024).** Analyzing campaigns' *own* archive of **146 experiments, 617 ads, 51 campaigns, 500,000+ respondents** (Swayable data), Hewitt, Broockman et al. (APSR) find \"small but meaningful variation\" — some ads persuade more than others — but common theories predict persuasiveness poorly, and the benefit of knowing which ad works accrues mainly to *well-financed campaigns* that can afford to test [18]. This is the strongest academic counter to a flat \"ads do nothing\": the average is ~zero, but the *variance* is exploitable by campaigns rich enough to run experiments — itself a finding about money, not about CTV.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Estimated TV-ad vote effect per 100 airings, by race salience (percentage points)<\/div><svg viewBox=\"0 0 700 138\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0<\/text><line x1=\"296.2\" y1=\"8\" x2=\"296.2\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"296.2\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0.08<\/text><line x1=\"407.5\" y1=\"8\" x2=\"407.5\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"407.5\" y=\"130\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0.15<\/text><line x1=\"518.8\" y1=\"8\" x2=\"518.8\" y2=\"114\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"5 es: the independent persuasion effect on general-election vote choice is essentially zero, from the Kalla and Broockman 49-experiment meta-analysis, the Coppock-Hill-Vavreck estimate of 0.007 percentage points, and one rigorous digital-video experiment at negative 0.04 points. Below sits a small ascending three-bar salience ramp: per 100 airings, presidential races show 0.03 points, Senate, House and Governor races 0.065 points, and low-salience statewide races 0.27 points, labeled effects appear only as salience falls. The dramatic size difference between the tall reach bars and the flat persuasion line carries the argument: the reach numbers are crisp and real, the persuasion numbers are near zero, and the industry's central error is reading the first as the second.\">\n    <text x=\"40\" y=\"34\" class=\"t-serif\" style=\"font-size:15px;letter-spacing:2px;fill:var(--accent)\">REACH IS NOT EFFECTIVENESS<\/text>\n    <line x1=\"40\" y1=\"44\" x2=\"660\" y2=\"44\" class=\"ln-soft\"/>\n    <g transform=\"translate(0,0)\">\n      <rect x=\"40\" y=\"64\" width=\"290\" height=\"226\" rx=\"3\" class=\"f-panel\"/>\n      <rect x=\"40\" y=\"64\" width=\"6\" height=\"226\" rx=\"2\" style=\"fill:var(--t1)\"/>\n      <text x=\"62\" y=\"84\" class=\"t-serif\" style=\"font-size:13px;letter-spacing:1px;font-weight:bold\">WHAT VENDORS MEASURE: REACH<\/text>\n      <text x=\"62\" y=\"100\" class=\"t-muted\" style=\"font-size:10.5px\">vendor performance claims, quantified<\/text>\n      <g class=\"cv-grow-up\" style=\"transform-origin:130px 268px\">\n        <rect x=\"98\" y=\"124\" width=\"64\" height=\"144\" rx=\"2\" class=\"f-t1\"/>\n        <text x=\"130\" y=\"118\" text-anchor=\"middle\" class=\"t-acc\" style=\"font-size:14px;font-weight:bold\">36%<\/text>\n        <text x=\"130\" y=\"282\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px\">freq-cap<\/text>\n        <text x=\"130\" y=\"294\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:10.5px\">e >\n      <text x=\"515\" y=\"166\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:11px\">+0.007pp<\/text>\n      <text x=\"600\" y=\"248\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9.5px\">digital video<\/text>\n      <text x=\"600\" y=\"260\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:11px\">-0.04pp<\/text>\n      <text x=\"392\" y=\"284\" class=\"t-muted t-serif\" style=\"font-size:10.5px;font-style:italic\">49 experiments. The line does not move.<\/text>\n    <\/g>\n    <g transform=\"translate(0,0)\">\n      <rect x=\"40\" y=\"306\" width=\"620\" height=\"86\" rx=\"3\" class=\"f-panel\"/>\n      <rect x=\"40\" y=\"306\" width=\"6\" height=\"86\" rx=\"2\" style=\"fill:var(--t2)\"/>\n      <text x=\"62\" y=\"326\" class=\"t-serif\" style=\"font-size:13px;letter-spacing:1px;font-weight:bold\">EFFECTS APPEAR ONLY AS SALIENCE FALLS<\/text>\n      <text x=\"62\" y=\"340\" class=\"t-muted\" style=\"font-size:10px\">per 100 airings, pp shift (Sides-Vavreck-Warshaw 2022)<\/text>\n      <line x1=\"430\" y1=\"380\" x2=\"648\" y2=\"380\" class=\"ln\"/>\n      <g class=\"cv-grow-up\" style=\"transform-origin:462px 380px;--d:.30s\">\n        <rect x=\"446\" y=\"374\" width=\"32\" height=\"6\" rx=\"1\" class=\"f-t2\"/>\n        <text x=\"462\" y=\"368\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:9.5px\">0.03<\/text>\n        <text x=\"462\" y=\"392\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">Pres<\/text>\n      <\/g>\n      <g class=\"cv-grow-up\" style=\"transform-origin:540px 380px;--d:.42s\">\n        <rect x=\"524\" y=\"367\" width=\"32\" height=\"13\" rx=\"1\" class=\"f-t2\"/>\n        <text x=\"540\" y=\"361\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:9.5px\">0.065<\/text>\n        <text x=\"540\" y=\"392\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">Sen/Hse/Gov<\/text>\n      <\/g>\n      <g class=\"cv-grow-up\" style=\"transform-origin:618px 380px;--d:.54s\">\n        <rect x=\"602\" y=\"326\" width=\"32\" height=\"54\" rx=\"1\" class=\"f-t2\"/>\n        <text x=\"618\" y=\"320\" text-anchor=\"middle\" class=\"t-mono\" style=\"font-size:9.5px\">0.27<\/text>\n        <text x=\"618\" y=\"392\" text-anchor=\"middle\" class=\"t-muted\" style=\"font-size:9px\">low-salience<\/text>\n      <\/g>\n      <text x=\"62\" y=\"362\" class=\"t-serif\" style=\"font-size:11px;font-style:italic;width:340px\">The only place ad effects grow is<\/text>\n      <text x=\"62\" y=\"377\" class=\"t-serif\" style=\"font-size:11px;font-style:italic\">down-ballot — where the<\/text>\n      <text x=\"62\" y=\"392\" class=\"t-serif\" style=\"font-size:11px;font-style:italic\">presidential-year dollars are not.<\/text>\n    <\/g>\n  <\/svg>\n  <figcaption><strong>Fig. 4.<\/strong> Vendor reach numbers are crisp and real and the persuasion numbers are near zero; the industry's central error is reading the first as the second, and the only place ad effects grow is down-ballot, where the presidential-year dollars are not.<\/figcaption>\n<\/figure>\n\n\nThis is where the corpus's critical voice is sharpest, because it explains *why* the vendor and academic numbers diverge without either side lying.\n\n### 3.1 The studies proving CTV \"works\" are run by the sellers of CTV\n\nThe Comscore \"36%,\" FlexPoint \"23%,\" and Optimum/DGA \"decisiveness\" cases are all produced or commissioned by firms with a direct commercial interest in the conclusion [4][5][14]. Under the source hierarchy, these are **Tier 1 for *what the entity claims*, and not evidence the claim is true** — a press release or case study can never validate its own assertion. None of the three is published, peer-reviewed, or backed by a pre-registered randomized design with a genuine unexposed holdout.\n\nA competing vendor makes the bias case — though not as disinterested trade press. In a Digiday-published *sponsored* post (branded content bylined by Will Harrington, CRO of PebblePost, which sells programmatic direct mail, a channel that competes with CTV for the same budgets), the argument is that ad-tech platforms \"make money in a way that creates a structural bias toward overclaiming results,\" and that CTV measurement \"mostly centers on metrics that characterize exposure,\" which \"don't show whether revenue [or, here, votes] can be attributed to an ad\" [9]. That source is itself conflicted — a vendor disparaging a rival channel's measurement, not a neutral observer — so it corroborates the skeptic's prior only weakly; its value is that the structural argument is coherent on its own terms, not that the sell-side has confessed. Separately, Digiday reports that CFOs now demand *incrementality* precisely because they distrust platform-reported ROAS and reach [19].\n\n### 3.2 Reach/efficiency metrics are not outcome metrics — the central category error\n\nThe entire genre substitutes measurable proxies for unmeasurable outcomes:\n\n| What vendors measure (easy) | What actually matters (hard) | Gap |\n| --- | --- | --- |\n| Incremental reach (households touched) | Votes changed | Reaching someone ≠ moving them |\n| Frequency efficiency (less waste) | Persuasion per dollar | Cheaper delivery of a null is still null |\n| Ad recall | Vote/turnout behavior | People recall ads that change nothing (§2.4) |\n| Modeled \"lift\" / \"intent\" | Realized ballots | Models inherit the assumptions of their builders |\n| \"Decisiveness\" (Optimum/DGA) | Causal vote movement | No randomized exposure, no effect size [14] |\n\nA \"36% more efficient\" number is a *denominator* improvement — it lowers the cost of an impression. About the *numerator* — did anyone vote differently — it tells you nothing. The skeptic's one-line summary: **vendors measure the things that are easy to measure and call them effectiveness.**\n\n### 3.3 Selection effects and the missing holdout\n\nTrue incrementality requires a randomized, fully unexposed holdout group — voters who, by design, saw zero impressions. Most CTV \"lift\" measurement instead *matches* exposed and unexposed groups on observables after the fact, which cannot remove selection on unobservables [9][19]. The Optimum/DGA study is a clean example: voters were **segmented by their observed exposure**, not randomly assigned to it, so any \"decisiveness\" difference could simply mean that more-engaged voters both watch more CTV ads *and* decide earlier [14]. Walmart-owned Vizio's CTV measurement, Digiday reports, faces exactly this \"incrementality hurdle\" — proving causation rather than correlation [20].\n\n### 3.4 The absence of randomized public evidence\n\nThe decisive negative fact: **as of mid-2026, no peer-reviewed, publicly available randomized experiment demonstrates that the CTV format causes more persuasion or more turnout than linear or other digital video.** The rigorous public experiments (Coppock-Green-Porter, Broockman-Green) test digital video and find ~zero on vote [3][16]; the CTV-specific numbers are all proprietary case studies measuring reach. This is not proof CTV doesn't work — absence of evidence isn't evidence of absence — but it means *every present-tense claim that CTV is more effective rests on inference and seller assertion, not public causal evidence.*\n\n---\n\n## 4. GOTV / Mobilization vs. Persuasion — Where Targeting Plausibly Earns Its Keep\n\nThe most defensible pro-CTV case abandons persuasion and moves to mobilization, base activation, and donor targeting — different outcomes, better evidence, and exactly what addressability is good at.\n\n### 4.1 Persuasion and mobilization are different problems\n\n**Persuasion** means changing *whom* a voter supports — the near-zero-on-average problem above. **Mobilization** means getting a voter who *already* supports you to actually cast a ballot. The evidence profiles differ sharply: persuasion in general elections averages ~zero; mobilization is reliably positive, though modest [8].\n\n### 4.2 The mobilization evidence (Green & Gerber)\n\nDonald Green and Alan Gerber's *Get Out the Vote* synthesizes ~hundreds of randomized turnout experiments. The robust findings: **door-to-door canvassing** produces the largest, most consistent turnout effects; **direct mail** lifts turnout by **slightly under 1 percentage point** for a generic GOTV piece; **phone calls** are weak; and effects *shrink* in high-salience elections where everyone is already mobilized (attenuation of ~33–76%) [8][21]. These effects are small but *real and repeatable* — the opposite of the persuasion null.\n\n### 4.3 Why CTV plausibly helps mobilization more than persuasion\n\nAddressability — matching a voter file to a household device — is built for *targeting a known universe*: your sporadic-but-supportive voters, your donor prospects, your base needing a reminder. Mobilization does not require changing a mind; it requires reaching an already-aligned person with a turnout cue. That is a reach-and-frequency problem, and reach-and-frequency is precisely what CTV genuinely improves (§1). The vendor incrementality machinery, over-sold for persuasion, is *appropriately* sold for completing reach to a turnout universe.\n\n**Important honesty caveat:** there is still **no strong public randomized evidence that CTV specifically drives turnout** better than other channels. The argument in §4.3 is *mechanism-plausible and consistent with the GOTV literature*, not *experimentally demonstrated for CTV*. It is the best available pro-CTV case — an inference, not a proven result.\n\n### 4.4 Donors and base — the quietest, realest use\n\nA large share of \"political\" CTV is not voter persuasion at all but **fundraising and base activation** — driving small-dollar donations, list growth, and rally turnout. These have direct, measurable behavioral outcomes — a donation either happens or it doesn't — and are far more honestly attributable than vote movement. Where CTV advertising most clearly \"works\" in a way you can put a number on, it often works here. And that is rarely what the public debate, about swinging persuadable voters, is actually about.\n\n---\n\n## 5. Where the Evidence Leans — Adjudication\n\nDistinguishing fact disputes from interpretation disputes:\n\n**Settled facts (no serious dispute):**\n- The average persuasive effect of campaign ads on general-election vote choice is ≈0 (Kalla & Broockman; Coppock-Hill-Vavreck; Coppock-Green-Porter) [1][2][3].\n- TV ad effects are several-fold larger in down-ballot and low-information races (Sides-Vavreck-Warshaw) [6].\n- Ad persuasion decays within days to weeks (Gerber et al.; Hill et al.) [7][17].\n- CTV genuinely improves incremental reach and frequency efficiency vs. linear alone (Comscore/Trade Desk case + the structural fact of cord-cutting) [4][10].\n- Mobilization effects are small, positive, and real (Green & Gerber) [8].\n- Vendor CTV \"effectiveness\" case studies are not randomized and measure reach, not votes [4][5][14].\n\n**Genuine fact dispute (unresolved):**\n- *Does CTV format cause more persuasion/turnout than linear or other digital video?* No public randomized evidence either way. Vendors assert yes (via reach proxies); the academic prior is no-difference-on-persuasion. **Unresolved — and the corpus should say so.**\n\n**Interpretation disputes (won't be settled by more data):**\n- Whether \"36% more efficient reach\" *counts as* \"works.\" Vendors say efficiency is the product; skeptics say only outcomes count. Both measure honestly; they value different endpoints.\n- Whether the exploitable *variance* in ad effects (Hewitt et al.) makes advertising \"effective\" for rich, testing-capable campaigns even if the average is zero [18]. This is a values/definitional question about what \"effective\" means.\n\n**The lean:** On *persuading general-election voters*, the evidence leans strongly **skeptic** — the vendor persuasion case is unproven and the academic null is robust across formats. On *completing reach and improving efficiency*, the evidence leans **vendor** — those claims are credible as media-planning facts. On *mobilization and down-ballot informing*, the truth sits in between and tilts toward \"plausibly useful, modestly sized, not yet CTV-specifically proven.\" The single most important corrective the corpus can deliver is blunt: **stop letting a reach number masquerade as a vote number.**\n\n---\n\n## Open Questions\n\n1. **Is there any randomized, public, CTV-specific persuasion or turnout experiment?** As of mid-2026, none located. A pre-registered RCT with a true unexposed holdout, randomized at the household level on a voter file, with a *behavioral* outcome (validated turnout or precinct vote share), would settle the central fact dispute. Its absence is itself a finding.\n2. **Does household-level addressability change the down-ballot informing effect?** Sides-Vavreck-Warshaw used linear GRPs. If CTV concentrates informing ads on low-information voters in low-salience races, the per-dollar effect could run *larger* than linear — or get wasted on already-decided partisans. Untested.\n3. **How much \"political CTV\" is fundraising/base vs. persuasion?** Spend trackers (AdImpact, Comscore) report dollars by channel, not by *objective*. The persuasion-vs-mobilization-vs-donor split is largely unmeasured publicly and would reframe the whole effectiveness debate.\n4. **Do frequency-optimization claims (Optimum/DGA) survive a randomized exposure design?** The directional 2025-NJ result is selection-prone. A randomized-frequency CTV experiment would be genuinely novel evidence.\n5. **Does AI-driven predictive targeting (Comscore Proximic, Trade Desk Koa-style models) actually identify movable voters, or just cheaper-to-reach ones?** Vendor claims of \"AI-powered\" persuadable-finding are unvalidated against the Kalla-Broockman condition for when persuasion appears.\n6. **Will CFO/incrementality scrutiny (Digiday) force public, methodologically credible CTV outcome studies?** The commercial-side demand for real incrementality could, ironically, produce the rigorous evidence academics lack.\n\n---\n\n## Sources\n\n1. Kalla, Joshua L., & David E. Broockman. \"The Minimal Persuasive Effects of Campaign Contact in General Elections: Evidence from 49 Field Experiments.\" *American Political Science Review* 112(1), 2018. https://www.cambridge.org/core/journals/american-political-science-review/article/abs/minimal-persuasive-effects-of-campaign-contact-in-general-elections-evidence-from-49-field-experiments/753665A313C4AB433DBF7110299B7433 — Tier 1–2 (flagship peer-reviewed). Accessed 2026-06-23.\n2. Coppock, Alexander, Seth J. Hill, & Lynn Vavreck. \"The small effects of political advertising are small regardless of context, message, sender, or receiver: Evidence from 59 real-time randomized experiments.\" *Science Advances* 6(36), 2020. https://www.science.org/doi/10.1126/sciadv.abc4046 — Tier 1–2. Accessed 2026-06-23.\n3. Coppock, Alexander, Donald P. Green, & Ethan Porter. \"Does digital advertising affect vote choice? Evidence from a randomized field experiment.\" *Research & Politics* 9(1), 2022. https://journals.sagepub.com/doi/10.1177/20531680221076901 — Tier 1–2. Effect on Dem precinct vote share −0.04 pp (SE 0.85). Accessed 2026-06-23.\n4. Comscore, Inc. \"Reach Incremental Voters More Efficiently and Validate Ad Campaign Outcomes\" (Comscore/The Trade Desk case study; image-dated OCT2024). https://www.comscore.com/Case-Studies/Reach-Incremental-Voters-More-Efficiently-and-Validate-Ad-Campaign-Outcomes — Tier 5/Tier 1-as-claim. VENDOR-CLAIM; \"36% more efficiently than linear.\" Accessed 2026-06-23.\n5. The Trade Desk. \"FlexPoint Political Advertising CTV Case Study\" (Congressional Leadership Fund / Miller-Meeks, IA-01). https://www.thetradedesk.com/case-studies/flexpoint-political-advertising-ctv — Tier 5/Tier 1-as-claim. VENDOR-CLAIM; \"23% incremental reach,\" \"99% unique.\" Accessed 2026-06-23.\n6. Sides, John, Lynn Vavreck, & Christopher Warshaw. \"The Effect of Television Advertising in United States Elections.\" *American Political Science Review* 116(2), May 2022. https://www.cambridge.org/core/journals/american-political-science-review/article/effect-of-television-advertising-in-united-states-elections/29ED18D9FB4B7AA52F6404ECF15F4114 — Tier 1–2. Down-ballot effects 2–4× / statewide 10–19× presidential. Accessed 2026-06-23.\n7. Gerber, Alan S., James G. Gimpel, Donald P. Green, & Daron R. Shaw. \"How Large and Long-lasting Are the Persuasive Effects of Televised Campaign Ads? Results from a Randomized Field Experiment.\" *American Political Science Review* 105(1), 2011. https://isps.yale.edu/research/data/d032 — Tier 1–2. ~4.7 pp current-week effect, decays to ~0 next week. Accessed 2026-06-23.\n8. Green, Donald P., & Alan S. Gerber. *Get Out the Vote: How to Increase Voter Turnout* (Brookings Institution Press; multiple editions through 2019), summarizing ~hundreds of randomized turnout experiments. Canvassing largest; generic GOTV mail ≈<1 pp; phones weak. Tier 2 (authoritative synthesis). See also Gerber & Green, \"The Effects of Canvassing, Telephone Calls, and Direct Mail on Voter Turnout: A Field Experiment,\" 2000. https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1313713 — Accessed 2026-06-23.\n9. Harrington, Will (Chief Revenue Officer, PebblePost). \"As CFOs scrutinize CTV spend, incrementality emerges as a differentiator\" — Digiday **sponsored** (branded-content) post. https://digiday.com/sponsored/as-cfos-scrutinize-ctv-spend-incrementality-emerges-as-a-differentiator/ — **Source of the quotes** \"make money in a way that creates a structural bias toward overclaiming results\" and CTV reporting \"mostly centers on metrics that characterize exposure.\" Tier 5 (industry trade press), but **sponsored/branded content** and **conflicted**: the author sells programmatic direct mail, a channel competing with CTV, so this is a vendor disparaging a rival channel's measurement rather than disinterested trade press — treat the framing accordingly (consistent with the sponsored-tag note on [19], which cites the same post for the CFO/incrementality-demand point). Accessed 2026-06-23. *Correction note: an earlier draft attributed these quotes to AdExchanger, \"Why Today's CTV Attribution Models Fall Short\" (https://www.adexchanger.com/on-tv-and-video/why-todays-ctv-attribution-models-fall-short/, Richard Girges/MNTN, Oct 2023). That article is not the source — it contains neither quote nor the words \"structural,\" \"overclaim,\" \"exposure,\" or \"characterize.\"*\n10. AdImpact. \"AdImpact's Political Projections Report 2025–2026\" and \"Maximizing TV Ad Spending for the 2026 Midterms.\" https://adimpact.com/blogs/adimpacts-political-projections-report-2026 — Tier 5 (specialist tracker). CTV ≈$2.48B projected 2026; only TV category projected to grow; ~600% CTV growth 2020→2024. Accessed 2026-06-23.\n11. The Current (The Trade Desk). \"U.S. political CTV ad spend projected to grow ~600% this presidential election cycle.\" https://www.thecurrent.com/us-political-ctv-ad-spend-2024-presidential-election-cycle — Tier 5/6 (vendor-owned editorial; note lean). Accessed 2026-06-23.\n12. Comscore, Inc. \"Comscore Launches AI-Powered Political Audience Targeting Solutions Ahead of 2024 Election Season, Initially Exclusive to Media Buyers on The Trade Desk\" (press release, Oct 2023). https://ir.comscore.com/news-releases/news-release-details/comscore-launches-ai-powered-political-audience-targeting — Tier 1-as-claim (press release). Accessed 2026-06-23.\n13. Comscore, Inc. \"Proximic Political Targeting Playbook\" (2026) and \"Comscore and Yahoo DSP Partner to Advance CTV Political Advertising\" (March 5, 2026). https://www.comscore.com/Insights/Presentations-and-Whitepapers/2026/Proximic-Political-Targeting-Playbook — GOING-CONCERN confirmation: Proximic political targeting + Yahoo DSP CTV partnership live for 2026 midterms. Tier 1-as-claim. Accessed 2026-06-23.\n14. Optimum Media (Data & Analytics) with the Democratic Governors Association & GMMB. \"Case Study: Finding the CTV Frequency Sweet Spot for Political Campaigns,\" *Campaigns & Elections* (sponsored), May 5, 2026; tested in 2025 NJ gubernatorial race. https://campaignsandelections.com/sponsored/case-study-finding-the-ctv-frequency-sweet-spot-for-political-campaigns/ — Tier 5/6 (sponsored vendor content). VENDOR-CLAIM; directional only, no effect sizes, exposure not randomized. Accessed 2026-06-23.\n15. Yale News. \"Political ads have little persuasive power.\" Sept 2, 2020 (institutional summary of Coppock-Hill-Vavreck with exact figures: favorability +0.05 on 5-pt scale; vote intention +0.007 pp, insignificant). https://news.yale.edu/2020/09/02/political-ads-have-little-persuasive-power — Tier 2 (university press office reporting a peer-reviewed result). Accessed 2026-06-23.\n16. Broockman, David E., & Donald P. Green. \"Do Online Advertisements Increase Political Candidates' Name Recognition or Favorability? Evidence from Randomized Field Experiments.\" *Political Behavior* 36(2), 2014. https://link.springer.com/article/10.1007/s11109-013-9239-z — Tier 1–2. No effect on recognition/favorability (~1.6 pt, SE ~1.4). Accessed 2026-06-23.\n17. Hill, Seth J., James Lo, Lynn Vavreck, & John Zaller. \"How Quickly We Forget: The Duration of Persuasion Effects from Mass Communication.\" *Political Communication* 30(4), 2013. https://www.tandfonline.com/doi/abs/10.1080/10584609.2013.828143 — Tier 1–2. Subnational ad-persuasion half-life ~1–2 days; some presidential effect ~6 weeks. Accessed 2026-06-23.\n18. Hewitt, Luke, David Broockman, Alexander Coppock, et al. \"How Experiments Help Campaigns Persuade Voters: Evidence from a Large Archive of Campaigns' Own Experiments.\" *American Political Science Review* 118(4), 2024 (Swayable archive: 146 experiments, 617 ads, 51 campaigns, 500,000+ respondents). https://isps.yale.edu/research/publications/isps24-05 — Tier 1–2. Small-but-meaningful variation; predictability poor; benefits accrue to well-financed testers. Accessed 2026-06-23.\n19. Digiday. \"As CFOs scrutinize CTV spend, incrementality emerges as a differentiator\" (and \"Walmart-Vizio's CTV measurement faces incrementality hurdle\"). https://digiday.com/sponsored/as-cfos-scrutinize-ctv-spend-incrementality-emerges-as-a-differentiator/ — Tier 5 (industry trade press; sponsored tag noted). Accessed 2026-06-23.\n20. Digiday. \"Walmart-Vizio's CTV measurement faces incrementality hurdle.\" https://digiday.com/marketing/walmart-vizios-ctv-measurement-faces-incrementality-hurdle/ — Tier 5 (industry trade press). Accessed 2026-06-23.\n21. EGAP / Poverty Action Lab summaries of Green-Gerber GOTV meta-evidence; Erikson & co. meta-analysis of voter-mobilization tactics by electoral salience, *Electoral Studies* (2023). https://www.sciencedirect.com/science/article/pii/S0261379423001518 — Tier 2 (peer-reviewed meta-analysis). High-salience attenuation ~33–76%. Accessed 2026-06-23."}, {"order": 5, "file": "05_Money_Strategy_And_Campaigns.md", "title": "Money, Strategy, and Campaigns: Where Political CTV Dollars Come From, Where They Flow, and How Campaigns Deploy Them", "summary": "", "body": "# 05 — Money, Strategy, and Campaigns\n\n## Bottom Line\n\nPolitical advertising in the United States is now a roughly **$11 billion-per-presidential-cycle** business, and connected TV (CTV) — ads served inside streaming apps on internet-connected televisions — has gone from a rounding error to its fastest-growing line item. In 2020 CTV took about **2.7%** of all political ad dollars. In 2024 it took roughly **12.6%** by a narrow definition and as much as **21%** by AdImpact's broader one — the spread depends entirely on what you count as \"CTV.\" The 2024 dollar figures the trade press cites run from **~$1.5–1.6 billion** (eMarketer/Insider Intelligence, CTV-as-a-slice-of-digital) to **~$2.3 billion** (AdImpact, CTV as its own top-line medium): the same money, sorted into different buckets. For 2026, AdImpact projects a record **~$10.8 billion** total cycle and **~$2.5 billion** of CTV — the only major medium expected to grow versus 2024.\n\nThe money does not flow the way the org chart suggests. It originates with campaigns, party committees, and — increasingly — super PACs and dark-money groups, but it gets *channeled* through a remarkably thin layer of media-buying firms that each take a percentage cut. In 2024 the five highest-paid political vendors collected about **$2.1 billion**, and one Democratic firm — **Waterfront Strategies**, the buying arm of the consultancy GMMB — booked roughly **$858 million** by itself, more than double the next vendor. That layer, paid on a commission of dollars spent, is where a meaningful share of the margin collects and where the structural incentive to keep spending lives.\n\nDeployment is concentrated and late. Thirteen states absorbed **67%** of all 2024 spend; **51%** of the money landed in the final eight weeks. Campaigns use CTV for two jobs: *reach extension* (buying the cord-cutters broadcast can no longer touch) and *targeted persuasion* (matching voter files to households). The motive-aware read is the sharpest part of this story. The people loudest about \"CTV is the future\" — the streaming platforms, the DSPs, the political-tech vendors, the consultants paid a percentage of the buy — are precisely the people who get paid when campaigns believe it. And the best independent evidence, Kalla & Broockman's meta-analysis, finds the average persuasive effect of general-election advertising is statistically **indistinguishable from zero**. CTV's genuine, defensible value is *reaching* an audience broadcast can't. Its persuasive *impact* is largely an article of faith, sold by the people who profit from the faith.\n\n---\n\n## 1. The Numbers — Total Spend, the CTV Slice, and Why the Forecasters Disagree\n\n### 1.1 The top line, cycle by cycle\n\nUS political ad spending roughly doubles every presidential cycle, then steps down — but stays large — in midterms. The cleanest single-source series is AdImpact's, which tracks placed and reserved ad buys across media:\n\n| Cycle | Total political ad spend | Source |\n|---|---|---|\n| 2016 | ~$2.31 billion | AdImpact, via eMarketer [1] |\n| 2018 (midterm) | ~$3.5 billion | AdImpact [2] |\n| 2020 | ~$8.0–8.5 billion | AdImpact [2] |\n| 2022 (midterm) | ~$8.9 billion | AdImpact [3] |\n| 2024 | **~$11.1 billion** (record) | AdImpact, final cycle review [4] |\n| 2026 (midterm, projected) | **~$10.8 billion** | AdImpact 2025–26 projection [5] |\n\nThe 2024 cycle was the most expensive in history at **$11.1 billion**, a record AdImpact confirmed in its December 2024 cycle review [4]. The 2026 midterm is projected at **~$10.8 billion** — the most expensive midterm ever, about **20% above** the $8.9 billion spent in 2022 [5].\n\nOne definitional note up front. eMarketer/Insider Intelligence forecast the 2024 cycle higher, at **~$12.3 billion**, because its model counts a wider universe of issue and advocacy advertising and uses a different placement methodology [6]. The Wesleyan Media Project, an academic tracker, counts *much* lower — **~$4.5 billion** in federal and gubernatorial TV and radio for 2024 — because it counts only the candidate and group *airings* it can verify in specific federal and gubernatorial races, leaving out most of the down-ballot, issue, and digital universe [7]. None of these is \"wrong.\" They answer different questions. When a number is quoted without its definition, treat it as marketing.\n\n### 1.2 The CTV slice — the same dollars, three different buckets\n\n\"How much political money goes to CTV?\" has no single answer, because the channel taxonomy itself is contested. Decode first: **CTV (connected TV)** is a video ad shown inside a streaming app (Hulu, Roku Channel, Tubi, Paramount+, YouTube on a TV) on an internet-connected television. The dispute is whether to count CTV as *its own medium* alongside broadcast and cable, or as a *sub-category of digital* alongside search and social.\n\n- **AdImpact** counts CTV as a **top-line medium**. In its first full cycle tracking it that way, CTV was **~$2.3 billion in 2024 — 21% of the $11.1 billion total** — making it the second-largest medium behind broadcast and ahead of cable and \"other digital\" [4].\n- **eMarketer / Insider Intelligence** counts CTV as a **slice of digital**. By that frame, 2024 CTV was **~$1.5–1.6 billion**, about **45% of the ~$3.5 billion digital total** and **12.6% of the ~$12.3 billion grand total** — up from **2.7%** of total (and 19% of digital) in 2020 [6][8][9].\n\nBoth can be true at once. The gap between $1.5B and $2.3B is mostly **YouTube and large premium-streaming buys** that AdImpact books as CTV but eMarketer's narrower \"CTV programmatic\" definition may route into \"digital video\" or \"social.\" The honest framing: **political CTV in 2024 was somewhere between $1.5 billion and $2.3 billion — roughly an eighth to a fifth of all political ad money, and the single fastest-growing channel.**\n\n### 1.3 The CTV growth curve\n\nHowever sliced, the growth is real and steep:\n\n| Cycle | Political CTV spend | CTV share of *digital* | CTV share of *total* |\n|---|---|---|---|\n| 2018 | small (~$15–50M est.) | ~5% | <1% [10] |\n| 2020 | ~$0.4–0.5B (narrow) / ~$0.2B (12.6%-basis back-calc) | ~19% | ~2.7% [9][10] |\n| 2022 (midterm) | **~$1.09 billion** | ~12–17% | ~12% [3][11] |\n| 2024 | **~$1.5–2.3 billion** | ~45% | ~12.6–21% [4][6] |\n| 2026 (projected) | **~$2.5 billion** | — | ~23% [5] |\n\nThe 2020→2024 jump is frequently quoted as a **~5x increase** (AdImpact's CTV-spend basis), or **\"600% growth\"** in some vendor framings; the most-cited single figure is **$1.56 billion in 2024, five times the 2020 level**, lifting CTV from 2.7% to 12.6% of the total [9]. The 2022 midterm CTV figure of **$1.09 billion** is the firmest mid-cycle anchor — and a telling one, because it *undershot* pre-election projections (Kantar and others had floated $1.4–1.5 billion). That was the first sign that vendor projections run ahead of placed reality [3][11].\n\nFor 2026, AdImpact projects **~$2.5 billion** in CTV, described two ways across its materials: **+20%** against 2022's midterm baseline, and roughly **+2%** against the 2024 presidential peak — settling at about a **23% share** of total cycle spend [5][12]. CTV is the **only major medium AdImpact expects to grow** versus 2024. Broadcast is projected roughly flat-to-down (~$5.3 billion, losing ~$97 million), and local cable continues a multi-cycle slide to ~$1.29 billion, down from $1.7 billion in 2022 [5][12].\n\n### 1.4 The channel mix — broadcast still wins, CTV is taking cable's lunch\n\nExhibit: **2024 spend by medium** (AdImpact basis) [4]:\n\n| Medium | 2024 spend | Share | Direction |\n|---|---|---|---|\n| Broadcast TV | ~$5.3 billion | ~48% | Flat / structurally declining share |\n| **Connected TV (CTV)** | **~$2.3 billion** | **~21%** | **Fastest-growing** |\n| Digital (non-CTV) | ~$1.6 billion | ~14% | Growing |\n| Local cable | ~$1.37 billion | ~12% | Declining |\n| Radio / satellite / other | remainder | ~5% | Flat / declining |\n\nThe structural story is not \"CTV beats broadcast.\" Broadcast is sticky. It still commands roughly half of political money and ~50% of the 2026 projection — held there by reach guarantees, the lowest-unit-rate rule that caps what stations can charge candidates near elections, and plain consultant familiarity [5][12]. The real victim is **linear cable**, whose share CTV is eating directly. As cable subscribers cut the cord and migrate to the same networks' streaming apps, the political dollars follow them out of cable and into CTV [3][5].\n\n---\n\n## 2. The Buyer Side — Who Puts Money In\n\n### 2.1 The four buyer types (decoded)\n\nPolitical ad money comes from four kinds of buyer, each with its own rules and incentives:\n\n1. **Candidate campaigns** — the campaign committees themselves (e.g., Harris for President, Trump's principal committee). By law they get the **lowest unit rate** on broadcast and cable and must include \"I'm X and I approve this message\" disclaimers — but those rules largely **do not reach CTV** (discussed later, in the chapter on regulation, privacy, and risk). Hard-dollar, contribution-limited money.\n2. **Party committees** — the **national committees (DNC/RNC)** and the four **congressional campaign committees**: the **DCCC** (Democratic Congressional Campaign Committee, House Democrats), **NRCC** (National Republican Congressional Committee, House Republicans), **DSCC** (Democratic Senatorial Campaign Committee), and **NRSC** (National Republican Senatorial Committee). They coordinate and place large coordinated and independent buys.\n3. **Super PACs** — independent-expenditure-only committees that may raise and spend **unlimited** sums but cannot legally coordinate with campaigns. This is where the largest single ad budgets now live (e.g., **Future Forward** on the Democratic side in 2024).\n4. **Dark-money / issue groups (501(c)(4)s)** — nonprofits that run \"issue\" advertising without disclosing donors. They are heavy CTV users for one reason: CTV's disclosure regime is the lightest.\n\n### 2.2 The 2024 buyer headline — Harris's record streaming reservation\n\nThe defining buyer event of 2024 was the **Harris campaign's August 2024 fall ad reservation of $370 million** for the Labor-Day-to-Election-Day window — described by the campaign as the largest single ad buy in the history of American politics [13][14]. The composition is what matters here:\n\n- **~$170 million** in traditional national and local television.\n- **>$200 million** in **digital**, explicitly inclusive of **CTV, premium streaming video, and digital audio** — named platforms included **Hulu, Roku, YouTube, Paramount+, Spotify, and Pandora** [13][14].\n\nThat **>$200 million digital tranche** was itself billed as the largest digital outlay in presidential history. Its CTV-heavy makeup — reserving streaming inventory *upfront*, months ahead, the way broadcast had always been bought — was the clearest signal yet that CTV had crossed from experiment to core media plan [13][14]. (The reservation is a *commitment*, not a verified spend; the realized total and exact CTV split are not separately disclosed in FEC summaries.)\n\nAcross the full cycle, the Wesleyan Media Project found **Harris devoted >40% of her general-election media budget to digital, versus 22% for Trump** — a meaningful asymmetry in *channel mix*, though not in the direction conventional wisdom assumes (see §2.3) [7].\n\n### 2.3 The partisan asymmetry — two real, opposite stories\n\nThere are two asymmetries. They point in opposite directions, and both are well-sourced.\n\n**Asymmetry A — Democrats spent more on digital and CTV, in both absolute and budget-share terms.** Harris allocated a larger share of her budget to digital (40%+ vs 22%) [7]. On CTV/OTT specifically, Democratic ads held a **~43,000-airing advantage** over Republican ads in 2024, and Democrats spread their CTV airings more broadly (59% in battleground states) where Republicans concentrated theirs (89% in battlegrounds) [15]. Democratic media buying is also far more **centralized** (see §4).\n\n**Asymmetry B — Republicans are widely claimed to have used CTV more *efficiently*.** A recurring trade-and-vendor narrative holds that \"Republicans outpaced Democrats by using CTV as a precision tool, while Democrats treated it as a broadcast channel\" [16]. The most-quoted version — that targeted streaming was \"the Moneyball of modern political campaigns and represented about half of the media the Trump campaign ran in 2024\" — comes from **DSPolitical**, a **Democratic-aligned** ad-tech vendor *attributing* the claim to the Trump operation. It is a vendor characterization, not an audited media plan, and should be treated as **contested** [16][17]. The viral specifics — a Trump super PAC spending \"$80 million on streaming\" to reach \"83% of persuadables,\" or Trump targeting 6.3M persuadables against Harris's 44.7M — trace to secondary blog summaries with **no** verifiable primary source. The \"83% reachable via CTV\" figure is a **population-reach** statistic (the share of registered voters reachable on ad-supported CTV), not a campaign's realized spend or persuasion result [17][18].\n\nThe defensible synthesis: **Democrats put more money and more budget-share into CTV. Republicans' camp and its vendors claim greater targeting efficiency — but no one has independently audited that claim.**\n\n### 2.4 The 2026 buyer field\n\nFor 2026, AdImpact's top-spend states map the buyer field: **California (~$1.1B)** on sheer media-market cost, **Michigan (~$1B)** on an open Senate seat and governor's race, and **Texas, Georgia, and North Carolina at $550M+ each** [5][12]. North Carolina is projected to host the single most expensive contest [19]. The competitive Senate map — Georgia, Maine, Michigan, New Hampshire, North Carolina — plus a small set of toss-up House districts will absorb the bulk of CTV's targeted spend [19].\n\n---\n\n## 3. How It's Deployed — Concentration, Sequencing, and the Two Jobs CTV Does\n\n### 3.1 Geographic concentration — the swing-state funnel\n\nPolitical money is not spread evenly. It is poured into a handful of decisive markets. In 2024, **13 states accounted for $7.4 billion — 67% of the total** [4]. **Pennsylvania crossed $1 billion**, the first state ever to do so, followed by Michigan ($806M), Wisconsin ($673M), and Arizona ($511M) [4]. CTV's structural advantage is that it can *concentrate further than broadcast can*. Broadcast buys a whole DMA (designated market area, the Nielsen geographic unit a TV station covers); CTV can target a **congressional district or even a ZIP code**. That is why it grew fastest exactly where the down-ballot races are [20].\n\n### 3.2 The down-ballot long tail\n\nThe presidential race gets the headlines, but **down-ballot is where most of the money is**. In 2024, the presidential race drew **~$3.2 billion** while down-ballot (Senate, House, governor, AG, secretary of state, state legislature, ballot measures) drew the larger remainder — roughly a **75/25 down-ballot-to-presidential split** by some cuts [4][20]. Senate races alone hit **$2.7 billion** across six contests over $200M each; House races hit **$1.7 billion** across 34 races over $20M each [4]. This long tail is structurally **good for CTV**. A House campaign cannot efficiently buy a whole metro's broadcast, but it *can* buy CTV impressions confined to its district. So down-ballot growth mechanically pulls dollars toward addressable streaming [20].\n\n### 3.3 Sequencing — the late, back-loaded cycle\n\nPolitical spend is violently back-loaded. In 2024, **51% of all spending occurred in the final eight weeks** of the cycle (AdImpact), and contemporaneous estimates put **~65% in the final 8–10 weeks** [4][21]. This sequencing shapes CTV strategy two ways. First, campaigns **reserve premium streaming inventory upfront** (as Harris did) to guarantee access before the scarcity crunch. Second, the late surge favors CTV's **programmatic flexibility**: buyers can shift budget across apps and audiences in near-real time as polls move, which fixed broadcast buys cannot do [13][21].\n\n### 3.4 The two jobs CTV does — reach extension vs. targeted persuasion\n\nVendor decks blur two distinct CTV jobs. Keep them apart:\n\n1. **Reach extension (the strong case).** A large and rising share of voters — younger and persuadable ones especially — simply cannot be reached on broadcast or cable anymore, because they've cut the cord. CTV is the only way to put a video ad in front of them on a television screen. That value is *measurable and defensible*: you are buying access to an audience that would otherwise be dark. Trade research credits CTV with **incremental household reach** beyond a linear buy and with curbing the frequency-cap waste linear can't (e.g., The Trade Desk's claim of reaching ~36% more households \"efficiently\" than linear) [22][21].\n2. **Targeted persuasion (the contested case).** By matching **voter files** (L2, TargetSmart, i360, Catalist) to **households** via the addressability stack (discussed in the chapter on how voter-level targeting works), campaigns can serve different messages to persuadables, base voters, and turnout targets. The *capability* is real. Whether the resulting **persuasion** is real is the contested question (§5, and the chapter on ad impact and effectiveness).\n\nThe other two deployment jobs are GOTV (get-out-the-vote — turnout mobilization of identified supporters) and **fundraising**. Wesleyan found large shares of *digital* (Meta/Google) airings were fundraising and GOTV rather than persuasion — ~41% of Harris's Meta ads were fundraising, and ~49% of Trump's were GOTV — though CTV skews more toward persuasion and reach than those social channels do [7].\n\n---\n\n## 4. The Money-Flow Map — Who Actually Touches the Dollar\n\n### 4.1 The intermediation layer (the part the org chart hides)\n\nA campaign does not buy a Roku impression directly. The dollar passes down a chain, and **each link takes a cut**:\n\n```\nDONOR / CAMPAIGN COMMITTEE / SUPER PAC / (c)(4)\n        │  (contributions, transfers)\n        ▼\nMEDIA-BUYING / CONSULTING FIRM  ◄── commission lives HERE\n   (Waterfront/GMMB, Assembly, etc.)   (~4.5%–15% of spend)\n        │  (places the buy)\n        ▼\nDSP / POLITICAL AD-TECH PLATFORM\n   (The Trade Desk, Madhive, Basis, Viant, MNTN)\n        │  (programmatic auction / managed service take-rate)\n        ▼\nDATA & IDENTITY LAYER  (voter file ↔ household match)\n   (L2, TargetSmart, i360, Catalist, Experian, LiveRamp)\n        │\n        ▼\nINVENTORY / PLATFORM  (the impression)\n   (Roku, Hulu/Disney, YouTube, Paramount, Tubi/Fox, Samsung)\n```\n\n### 4.2 The middlemen — where the margin concentrates\n\nThe most important and least-appreciated fact about political ad money is how **concentrated the buying layer is**. Per OpenSecrets' analysis of FEC data, the **five highest-paid political vendors collected ~$2.1 billion** in the 2024 cycle, each specializing in media buying [23]. The dominant firm is **Waterfront Strategies**, the ad-placement arm of the Democratic consultancy **GMMB**, which booked **~$858 million** — *more than double* the next-highest vendor [23][24]. Nearly **90% of Waterfront's 2024 receipts came from just three clients**: **Future Forward USA** (the main pro-Harris super PAC, which alone paid Waterfront **~$383 million**), **WinSenate PAC**, and **House Majority PAC** [24]. Waterfront's take grew **~10x in 12 years**, from ~$92 million in 2012 to ~$858 million in 2024 [23][24].\n\nThe partisan structure of the buying layer is itself asymmetric:\n- **Democratic** buying is **highly centralized** — Waterfront/GMMB dominates, taking more than double the runner-up [23].\n- **Republican** buying is **distributed** — about **10 GOP-aligned vendors each cleared $100 million**, with one passing $300 million, and **no single firm approaching Waterfront's scale** [23].\n\n### 4.3 The commission engine — and the conflict it creates\n\nPolitical media consultants are traditionally paid a **commission on dollars spent** — historically ~**15%**, negotiated down to as low as **~4.5%** on the largest presidential buys [25]. This compensation model is the **structural motor** of the whole system, and it has two well-documented distortions:\n\n1. **It rewards spending, not winning.** A firm paid a percentage of the buy makes more money the more is bought, regardless of effect — a baked-in incentive to recommend large TV and CTV campaigns [25].\n2. **It rewards repurposing over production.** Because pay scales with *placement* dollars, running an existing TV creative across digital and CTV pays better than investing in platform-native production [25].\n\nThen comes the CTV-specific wrinkle. The rise of **DSPs and \"managed-service\" political ad-tech** (Madhive, MNTN, Basis, Viant) inserts a *second* take-rate beneath the consultant — the platform's programmatic margin on the impression. So a political dollar can be skimmed twice before it reaches the inventory owner: once by the buying firm's commission, once by the DSP's take-rate. The exact platform take-rates are not publicly disclosed in political filings (a transparency gap taken up in the chapter on regulation, privacy, and risk).\n\n### 4.4 The deployment infrastructure today\n\nTwo infrastructure facts worth pinning down:\n\n- **Madhive's local CTV political marketplace** launched **February 2024** with **Fox Television Stations as first-to-market client**, aggregating political data partners (TargetSmart, Experian, L2, DataTrust) and pre-curated streaming supply across all 210 DMAs [26][27]. It was confirmed live at its 2024 launch and reaffirmed in 2025–26 trade coverage of 2026 positioning [26][27].\n- **Waterfront Strategies** is described as the dominant Democratic ad-buyer in a **February 2026** OpenSecrets analysis of 2024-cycle FEC data — confirming the firm's role as of that filing analysis, though the 2026-cycle buying landscape was still forming at the time [23].\n\n---\n\n## 5. The Motive-Aware Read — Who Benefits from \"CTV Is the Future\"\n\nFollow the incentives, and decode the gap between the **stated motive** (\"CTV is the future of persuasion\") and the **structural motive** (who gets paid if campaigns believe it).\n\n### 5.1 The interested parties\n\nEvery loud voice in the \"CTV is the future\" chorus has a financial stake in the chorus being believed:\n\n- **The streaming platforms** (Roku, Hulu/Disney, YouTube, Paramount, Tubi/Fox, Samsung) book the impression revenue. Political dollars are seasonal, high-CPM, and cyclically lucrative — one of the few ad categories that *pays a premium* (CTV political CPMs ran ~3.5x other devices in 2020) [10].\n- **The DSPs and political ad-tech vendors** (The Trade Desk, Madhive, MNTN, Basis, Viant) earn take-rates and SaaS fees, and they say so plainly: The Trade Desk's own materials note that political \"could cause our revenue to increase during election cycles\" [22].\n- **The consultants and buying firms** (GMMB/Waterfront and the GOP set) earn commissions on every dollar moved, and CTV's complexity only *deepens* their indispensability [23][25].\n- **The data and identity providers** (L2, TargetSmart, i360, Catalist) license the voter files that make CTV \"addressable.\" The more campaigns believe addressable targeting works, the more those licenses are worth.\n\n### 5.2 The stated motive vs. the evidence\n\nThe **stated motive** is *persuasion*: CTV lets you reach and move persuadable voters with surgical precision. The **independent evidence** is sobering. The canonical academic finding — Kalla & Broockman's meta-analysis of 49+ field experiments — is that **the average persuasive effect of campaign contact and advertising in general elections is statistically indistinguishable from zero**, with detectable effects appearing only in narrow circumstances: unusually unpopular candidate positions, heavy persuadable-ID investment, or very early contact whose effect then decays [28]. This is the field's most-replicated result, and it sits in direct tension with the multi-billion-dollar persuasion-marketing apparatus CTV vendors sell.\n\n### 5.3 Reconciling the two — what CTV money is really chasing\n\nThe reconciliation is the key insight here: **CTV's defensible value is reach, not persuasion.** Campaigns spend on CTV for reasons that survive the skeptical literature:\n\n1. **Audience access** — broadcast genuinely cannot reach cord-cutters; CTV genuinely can. This is real, it is measurable, and it does not depend on persuasion working [21].\n2. **Risk management** — no consultant wants to be the one who *didn't* buy the channel the other side bought. Spending tracks competitive parity, not proven ROI.\n3. **Measurable proxies** — campaigns chase what they can *measure* (reach, frequency, completed views, voter-file match rates), which CTV reports cleanly, even when those proxies don't map to votes.\n4. **Vendor-supplied confidence** — the case studies \"proving\" CTV persuasion are overwhelmingly produced by the vendors who sell it (MNTN, DSPolitical, Madhive, platform research arms), and should be read as **position-evidence, not fact** [16][22].\n\nSo the dollars chase **measurable reach**, which is well-justified, far more than they chase **proven persuasion**, which is largely unproven. The \"CTV is the future\" narrative is *true about reach* and *unproven about persuasion* — and the people selling it have every reason to let the two blur together. The cleanest test arrives in 2026 and 2028. If CTV keeps growing while broadcast stays flat, as AdImpact projects, it will be because reach migrated with the audience — not because anyone has shown the streaming ad changed more minds than the broadcast one did.\n\n---\n\n## Open Questions\n\n1. **What is the realized (not reserved) 2024 CTV spend?** The $1.5B–$2.3B range mixes reservations, placed buys, and different channel taxonomies. A reconciled, FEC-grounded realized figure does not exist in the public record.\n2. **What are the actual platform/DSP take-rates on political CTV?** Consultant commissions (4.5–15%) are documented; DSP and managed-service margins on political impressions are not publicly disclosed.\n3. **Is the \"Republicans used CTV more efficiently\" claim true?** It rests on a Democratic vendor's characterization of the Trump operation and on secondary blog summaries; no audited media plan or independent study confirms the specific persuadable-targeting figures.\n4. **How much of CTV's growth is cable cannibalization vs. net-new spend?** The medium-mix data suggests CTV is largely eating cable's share, but a clean decomposition (migration vs. expansion) is unverified.\n5. **Will the consultant commission model survive CTV's programmatic efficiency?** Programmatic buying theoretically commoditizes placement; whether that compresses the 15% commission or simply adds a second take-rate is an open structural question.\n6. **What is the down-ballot CTV figure specifically?** The $1.5–2.3B is a cycle total; the share attributable to House/Senate/governor (vs. presidential and issue) is not cleanly broken out.\n\n---\n\n## Sources\n\n1. eMarketer / Insider Intelligence, \"US Political Ad Spending Forecast 2024,\" Feb 23, 2024. https://www.emarketer.com/content/us-political-ad-spending-forecast-2024 (Tier 5; subscription; $2.31B 2016 baseline, $12B+ 2024 forecast). Accessed 2026-06-23.\n2. Inside Radio, \"AdImpact: Political Ad Spend In 2020 Hit $8 Billion, Doubling 2018,\" Mar 2021. https://www.insideradio.com/free/adimpact-political-ad-spend-in-2020-hit-8-billion-doubling-2018/ (Tier 5 trade, reporting AdImpact data; 2018 ~$3.5B, 2020 ~$8B). Accessed 2026-06-23.\n3. Marketing Brew, \"Political ad spending on connected TV is 5x what it was in 2020,\" Oct 6, 2022; MediaPost, \"2022 Midterm Ad Spending Projected To Hit $8.9B.\" (Tier 5 trade; 2022 total ~$8.9B, CTV ~$1.09B). https://www.marketingbrew.com/stories/2022/10/06/political-ad-spending-on-connected-tv-is-5x-what-it-was-in-2020 Accessed 2026-06-23.\n4. TV Tech, \"Political Ad Spend for the 2024 Election Cycle Hit a Record $11.1 Billion,\" reporting AdImpact cycle review, Dec 20, 2024. https://www.tvtechnology.com/news/political-ad-spend-for-the-2024-election-cycle-hit-a-record-usd11-1-billion (Tier 5 trade reporting AdImpact primary data; $11.1B total, CTV $2.3B/21%, broadcast $5.3B, digital $1.6B, cable $1.37B; 13 states = 67%; 51% final 8 weeks; PA $1B). Accessed 2026-06-23.\n5. The Current (The Trade Desk's trade outlet), \"CTV set to fuel record U.S. political spending in 2026,\" reporting AdImpact 2025–26 projections, 2025. https://www.thecurrent.com/marketing/streaming-fuel-record-us-political-spending-2026-ctv (Tier 5/6 — note The Current is owned by The Trade Desk, an interested party; figures attributed to AdImpact. 2026 total ~$10B/$10.8B, CTV ~$2.48B, +20% vs 2024-or-2022, broadcast ~$5.28B). Accessed 2026-06-23.\n6. eMarketer / MNTN, \"45% of Digital Political Ad Spend in 2024 Will Go to CTV.\" https://mountain.com/blog/45-of-digital-political-ad-spend-in-2024-will-go-to-ctv/ (Tier 6 vendor citing eMarketer; CTV ~$1.5B = 45% of digital in 2024, up from 19% in 2020). Accessed 2026-06-23.\n7. Wesleyan Media Project, \"New Studies Published on Television and Digital Advertising in the 2024 Elections,\" Jun 24, 2025, in *The Forum: A Journal of Applied Research in Contemporary Politics*; and \"More Than $4.5 Billion in Ad Spending This Cycle,\" Oct 31, 2024. https://mediaproject.wesleyan.edu/2024-summary-062425/ (Tier 2 academic; ~$4.5B TV/radio, $580M digital, Harris 40%+ digital vs Trump 22%, Meta/Google fundraising/GOTV shares, Dems outspent down-ballot). Accessed 2026-06-23.\n8. The Current, \"U.S. political ad spend on digital projected to jump 156 percent over last presidential election year,\" Jan 25 / Feb 7, 2024, reporting Insider Intelligence. https://www.thecurrent.com/digital-political-ad-spending-streaming (Tier 5/6; $12.3B total, digital ~$3.5B/28%, +156% digital vs 2020). Accessed 2026-06-23.\n9. eMarketer, \"How programmatic political ads will impact the ad ecosystem,\" Jun 3, 2024. https://www.emarketer.com/content/programmatic-political-ads-impact-ecosystem-ctv-social-media (Tier 5; CTV $1.56B = 12.6% of total, up from 2.7% in 2020; ~81% of CTV programmatic; ~90% of digital programmatic; Meta largest social recipient; TikTok bans political). Accessed 2026-06-23.\n10. MediaPost, \"CTV Grows Dramatically In 2020 Digital Political Ad Spend\"; MNTN Research, \"The State of Political Ad Spending on Connected TV.\"
