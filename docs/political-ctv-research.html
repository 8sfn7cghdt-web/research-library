t 2024 sits at about 21 percent of total cycle spend. Five probability-weighted bands diverge rightward to 2028. The modal On-Curve Continuation band, weighted 34 to 44 percent, is the fattest and climbs to the mid-to-high 20s percent. The Constrained Plateau band, weighted 18 to 26 percent, runs flat in the low-to-mid 20s. The Inventory Unlock or Re-Acceleration band, weighted 13 to 19 percent, rises highest to the low 30s. The Regulatory or Platform Break band, weighted 13 to 19 percent, bends the path. The Effectiveness or Credibility Deflation band, weighted 7 to 12 percent, sags to the low teens. A faint vertical axis runs from about 15 to 35 percent. All five scenarios agree dollars rise and the federal gap stays open; they disagree only on the slope of share.\">\n<text x=\"40\" y=\"30\" class=\"t-serif\" style=\"font-size:15px;letter-spacing:1.5px\" font-weight=\"700\">THE ARGUMENT IS ABOUT SLOPE, NOT DIRECTION<\/text>\n<text x=\"40\" y=\"48\" class=\"t-muted\" style=\"font-size:10.5px\">CTV share of total U.S. political ad spend &middot; 2024 anchor &rarr; 2028 fan &middot; scenario forecast<\/text>\n<line x1=\"120\" y1=\"74\" x2=\"120\" y2=\"360\" class=\"ln-soft\"/>\n<line x1=\"120\" y1=\"74\" x2=\"640\" y2=\"74\" class=\"ln-soft\" stroke-dasharray=\"2 4\"/>\n<line x1=\"120\" y1=\"146\" x2=\"640\" y2=\"146\" class=\"ln-soft\" stroke-dasharray=\"2 4\"/>\n<line x1=\"120\" y1=\"217\" x2=\"640\" y2=\"217\" class=\"ln-soft\" stroke-dasharray=\"2 4\"/>\n<line x1=\"120\" y1=\"289\" x2=\"640\" y2=\"289\" class=\"ln-soft\" stroke-dasharray=\"2 4\"/>\n<line x1=\"120\" y1=\"360\" x2=\"640\" y2=\"360\" class=\"ln-soft\" stroke-dasharray=\"2 4\"/>\n<text x=\"112\" y=\"78\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">35%<\/text>\n<text x=\"112\" y=\"150\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">30%<\/text>\n<text x=\"112\" y=\"221\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">25%<\/text>\n<text x=\"112\" y=\"293\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">20%<\/text>\n<text x=\"112\" y=\"364\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">15%<\/text>\n<text x=\"86\" y=\"220\" class=\"t-muted\" style=\"font-size:9px;letter-spacing:0.5px\" transform=\"rotate(-90 86 220)\" text-anchor=\"middle\">CTV share of total political ad spend<\/text>\n<text x=\"120\" y=\"378\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"middle\">2024<\/text>\n<text x=\"640\" y=\"378\" class=\"t-mono t-muted\" style=\"font-size:9.5px\" text-anchor=\"middle\">2028<\/text>\n<text x=\"120\" y=\"392\" class=\"t-mono t-muted\" style=\"font-size:8.5px\" text-anchor=\"middle\">anchor ~21%<\/text>\n<path class=\"f-t3 cv-grow-right\" style=\"--d:.36s\" d=\"M120 274 L640 132 L640 175 L120 274 Z\" opacity=\"0.34\"/>\n<path class=\"f-t1 cv-grow-right\" style=\"--d:.12s\" d=\"M120 274 L640 246 L640 289 L120 274 Z\" opacity=\"0.34\"/>\n<path class=\"f-t2 cv-grow-right\" style=\"--d:.30s\" d=\"M120 274 L640 218 L640 268 L120 274 Z\" opacity=\"0.30\"/>\n<path class=\"f-t4 cv-grow-right\" style=\"--d:.42s\" d=\"M120 274 L640 318 L640 350 L120 274 Z\" opacity=\"0.34\"/>\n<path class=\"cv-grow-right\" style=\"fill:var(--accent);--d:.24s\" d=\"M120 274 L640 161 L640 218 L120 274 Z\" opacity=\"0.42\"/>\n<path class=\"cv-draw\" pathLength=\"1\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"2.5\" d=\"M120 274 L640 189\"/>\n<path class=\"s-t3 cv-draw\" pathLength=\"1\" fill=\"none\" stroke-width=\"1.5\" style=\"--d:.36s\" d=\"M120 274 L640 153\"/>\n<path class=\"s-t1 cv-draw\" pathLength=\"1\" fill=\"none\" stroke-width=\"1.5\" style=\"--d:.12s\" d=\"M120 274 L640 268\"/>\n<path class=\"s-t2 cv-draw\" pathLength=\"1\" fill=\"none\" stroke-width=\"1.5\" style=\"--d:.30s\" d=\"M120 274 L640 243\"/>\n<path class=\"s-t4 cv-draw\" pathLength=\"1\" fill=\"none\" stroke-width=\"1.5\" style=\"--d:.42s\" d=\"M120 274 L640 334\"/>\n<circle cx=\"120\" cy=\"274\" r=\"5\" style=\"fill:var(--accent)\"/>\n<circle cx=\"120\" cy=\"274\" r=\"9\" fill=\"none\" style=\"stroke:var(--accent)\" stroke-width=\"1.2\" opacity=\"0.5\"/>\n<g style=\"font-size:10.5px\" font-weight=\"700\">\n<rect x=\"556\" y=\"146\" width=\"84\" height=\"32\" rx=\"3\" class=\"f-panel\"/>\n<rect x=\"556\" y=\"146\" width=\"4\" height=\"32\" style=\"fill:var(--accent)\"/>\n<text x=\"565\" y=\"160\" class=\"t-acc\">On-Curve<\/text>\n<text x=\"565\" y=\"172\" class=\"t-acc\" style=\"font-size:9.5px\" font-weight=\"400\">modal &middot; 34&ndash;44%<\/text>\n<\/g>\n<g style=\"font-size:10.5px\" font-weight=\"700\">\n<rect x=\"556\" y=\"118\" width=\"84\" height=\"28\" rx=\"3\" class=\"f-panel\"/>\n<rect x=\"556\" y=\"118\" width=\"4\" height=\"28\" class=\"f-t3\"/>\n<text x=\"565\" y=\"130\" class=\"t-serif\">Unlock &uarr;<\/text>\n<text x=\"565\" y=\"141\" class=\"t-muted\" style=\"font-size:9.5px\" font-weight=\"400\">13&ndash;19%<\/text>\n<\/g>\n<g style=\"font-size:10.5px\" font-weight=\"700\">\n<rect x=\"556\" y=\"226\" width=\"84\" height=\"28\" rx=\"3\" class=\"f-panel\"/>\n<rect x=\"556\" y=\"226\" width=\"4\" height=\"28\" class=\"f-t1\"/>\n<text x=\"565\" y=\"238\" class=\"t-serif\">Plateau<\/text>\n<text x=\"565\" y=\"249\" class=\"t-muted\" style=\"font-size:9.5px\" font-weight=\"400\">18&ndash;26%<\/text>\n<\/g>\n<g style=\"font-size:10.5px\" font-weight=\"700\">\n<rect x=\"556\" y=\"200\" width=\"84\" height=\"24\" rx=\"3\" class=\"f-panel\"/>\n<rect x=\"556\" y=\"200\" width=\"4\" height=\"24\" class=\"f-t2\"/>\n<text x=\"565\" y=\"216\" class=\"t-serif\">Reg Break &middot; 13&ndash;19%<\/text>\n<\/g>\n<g style=\"font-size:10.5px\" font-weight=\"700\">\n<rect x=\"556\" y=\"320\" width=\"84\" height=\"28\" rx=\"3\" class=\"f-panel\"/>\n<rect x=\"556\" y=\"320\" width=\"4\" height=\"28\" class=\"f-t4\"/>\n<text x=\"565\" y=\"332\" class=\"t-serif\">Deflation &darr;<\/text>\n<text x=\"565\" y=\"343\" class=\"t-muted\" style=\"font-size:9.5px\" font-weight=\"400\">7&ndash;12%<\/text>\n<\/g>\n<text x=\"40\" y=\"412\" class=\"t-muted\" style=\"font-size:10.5px;font-style:italic\" text-anchor=\"start\">Every forecaster agrees the dollars rise and the federal gap stays open; the only live question is the slope of share.<\/text>\n<figcaption><strong>Fig. 6.<\/strong> The disagreement among forecasters is not whether political CTV dollars keep climbing through 2028 &mdash; they do in every scenario, and the federal-vs-local gap stays open &mdash; but whether CTV's <em>share<\/em> of total spend breaks into the high-20s% (modal On-Curve) or stalls in the low-20s% as the four premium refusers hold the line.<\/figcaption>\n<\/figure>\n\n\nTen reference classes anchor the scenarios, each cross-checked where a contested figure carried weight.\n\n**Five-cycle CTV adoption ramp.** Absent in 2016 → ~2.7% of total political spend in 2020 → ~$1.09B in 2022 → 2024 at ~$2.3B / 21% (AdImpact broad, top-line medium) OR ~$1.5–1.6B / 12.6% (eMarketer narrow, a slice of digital) → 2026 projected ~$2.5B (AdImpact, September 2025; revised to ~$2.7B in the June 11 2026 update, inside the forecast's ±25% band), and the only major medium expected to grow. The share baseline is definition-sensitive, and the 2024→2026 step is modest (presidential peak vs. midterm). *Suggests:* a decelerating S-curve shoulder — share still rising, growth rate falling — which favors a slower climb over a repeat surge.\n\n**Federal disclosure-rulemaking latency.** The FEC internet-disclaimer rule took ~11 years; the Honest Ads Act is unpassed across four-plus Congresses; the FEC is structurally 3-3; the modal 2026 outcome is a split Congress (House-D / Senate-R). *Suggests:* ~80–85% probability the federal streaming gap stays open through early-2029 — the anchor for the low probability of a clean federal close.\n\n**State election-deepfake / AI-law diffusion.** ~30 states regulate election deepfakes, but prohibition-model laws lose in court (CA AB 2839 permanently enjoined, *Kohls v. Bonta*, August 2025; Minnesota stayed) while disclosure-model laws can survive (Washington's on-demand mandate affirmed, $35.2M Meta penalty, Washington Supreme Court June 18 2026, 6-of-9). A December 11 2025 federal AI-preemption EO can narrow the patchwork from above. *Suggests:* a two-sided variable that can break the gap open OR closed.\n\n**Broadcast→cable migration analog.** Cable took ~2 decades to reach ~14% of political spend, then plateaued in the teens. The critical caveat the source itself supplies: cable is the *wrong* ceiling base rate for CTV — cable plateaued because linear stayed reachable, whereas CTV's driver is an *exodus* from linear (streaming 44.8% > broadcast+cable 44.2%, May 2025, Nielsen *The Gauge*), it carries zero regulatory inheritance, and it migrates at ~2x speed; the source says cable \"will likely underestimate\" CTV's ceiling and flags the plateau counter-case as open. *Suggests:* the plateau prior is down-weighted, not applied at ~0.5.\n\n**EU TTPA natural experiment.** When the EU priced political microtargeting (core provisions October 10 2025, Reg. 2024/900 Art. 18 banning special-category-data targeting that powers the US voter-file stack), platforms *exited* rather than build compliant products (Google 2024, Meta October 6 2025, each citing the law). *Suggests:* high conditional severity if a US constraint landed — but *McManus* and the First Amendment foreclose the EU targeting-ban mechanism in the US, so this raises severity, not US probability.\n\n**Persuasion evidence priced-and-ignored.** Kalla-Broockman ~zero average general-election persuasion (49 field experiments, APSR 2018); Coppock-Green-Porter −0.04pp digital-video null (Research & Politics 2022); no public CTV-specific RCT exists. Yet CTV grew through three cycles on reach logic and a commission-paid vendor layer. *Suggests:* a new effectiveness null faces a steep repricing barrier (re-price factor ~0.30, not ~0.45) — which keeps the deflation tail near ~10%.\n\n**Inventory concentration / four refusers.** Amazon Prime Video, Netflix, Disney+, and Apple TV+ all still refuse political ads as of June 2026 (each attested by ≥2 dated 2025–2026 sources; Apple by its own February 26 2025 policy page), concentrating demand on Hulu / Roku / YouTube / FAST and lifting CPMs ($35–80 premium). Netflix is the live reversal-risk case (~13M US ad-tier subs, AAPC / buyer lobbying) but has not reversed. *Suggests:* both the plateau ceiling and the upside-unlock tail hinge on this small, cycle-perishable actor set.\n\n**Practitioner reach-vs-addressable.** Most political CTV is bought broad (geo / demo / run-of-network); the voter-file-matched addressable slice is the minority of dollars, gated by 50–70% clean-file match rates (vs. vendor 90%+). In 2025 Wisconsin, CTV was 31% of spend but geo / demo, not household-addressable. Operators \"fund CTV first instead of broadcast\" as a \"mass reach tool.\" *Decisive:* broad-buying is the share-gaining reach mechanism, so the practice ceiling caps CPM / persuasion-premium, not CTV's share of spend.\n\n**Two-year cycle pulse, now a rising sawtooth.** Spend surges in even years and collapses in odd, but off-year troughs are filling as issue / advocacy spend grows and the secular CTV base rises: the 2025 off-year was still a substantial CTV-political market, though the exact 2025 dollar figure is not yet cleanly reported. *Suggests:* the 2028 peak builds on a structurally higher floor than 2024, partially decoupling CTV's level from the pure clock.\n\n**Prediction-market decomposition (swept 2026-06-23).** No liquid market trades the exact CTV-share question. Decomposed / related contracts price only the size and concentration of the pie — Kalshi House-D ~78–79%, Senate-R ~57–58%; Metaculus House-D ~79.9%, Senate-R ~55.5%; Polymarket Balance-of-Power (D-Sweep 43%); Polymarket 2028 presidency D 58.5%. A split-Congress modal implies a contested ~$10.8B 2026 cycle. The adtech-M&A market lists no Roku / Vizio / Magnite / Trade Desk name, so there is no price on platform concentration. *Suggests:* CTV share must be derived from base rates, not read off any market.\n\n## Prediction Market Snapshot\n\n| Market | Question | Price | Volume | Date Pulled |\n| --- | --- | --- | --- | --- |\n| Polymarket | Balance of Power: 2026 Midterms | D Sweep 43%; R-Sen / D-House 37%; R Sweep 18%; D-Sen / R-House 2.3%; Other 1% | $8.06M event volume | 2026-06-23 |\n| Kalshi | Will Democrats win the U.S. House in 2026? (CONTROLH-2026) | Democrats ~78–79% (Yes bid 0.78 / last 0.79); Republicans ~21–22% | Liquid; No-side depth >$200k | 2026-06-23 |\n| Kalshi | Will Democrats win the U.S. Senate in 2026? (CONTROLS-2026) | Democrats ~42–43% (Yes bid 0.42 / last 0.43); Republicans ~57–58% (last 0.58) | Moderate; ~$19k–$45k depth/side | 2026-06-23 |\n| Metaculus | Who will control the US House after 2026 midterms? (Q35047) | House Democrats ~79.9% | No money; 499 forecasters | 2026-06-23 |\n| Metaculus | Who will control the US Senate after 2026 midterms? (Q35046) | Democrats ~44.4% / Republicans ~55.5% | No money; 357 forecasters | 2026-06-23 |\n| Polymarket | Which party wins the 2028 US Presidential Election? | Democrats 58.5%; Republicans 40.5% | Event ~$1.87M; liquidity ~$474k | 2026-06-23 |\n| Polymarket | Which companies will be acquired before 2027? | N/A — no adtech/CTV name listed (no Roku/Vizio/Magnite/LG/Trade Desk) | $18.0M event volume | 2026-06-23 |\n| Manifold | UK electoral advertising regulated for factual accuracy by 2030 (and 2035 variant) | ~31% (2030); ~50% (2035) | Play-money; ~M68–563 mana, 5–8 traders | 2026-06-23 |\n| Manifold | Will a top-20 advertiser air a primarily AI-generated Super Bowl LXI ad (Feb 2027)? | ~35% | Play-money; ~M70 mana, 6 traders | 2026-06-23 |\n\nThe decisive market finding is an *absence*: **no liquid contract prices CTV's share of political spend, its identity stack, or its regulatory gap.** Every market above is either *decomposed* (chamber control and the 2028 presidency, which size and concentrate the political-ad pie CTV competes for) or *related* (the adtech-M&A market, whose silence on Roku / Vizio / Magnite / Trade Desk is itself a non-signal on platform concentration; and the wrong-jurisdiction UK and commercial Super Bowl contracts, used only as adjacent sanity-checks). So the markets bound the *envelope* — a contested cycle on a split-Congress modal (~$10.8B in 2026), a roughly even-money 2028 presidency that keeps battleground spend high — but say nothing about CTV's *share* of that envelope, the actual subject of every scenario above. The election markets are liquid and confident, but they are treated strictly as the spend-envelope input, never as a proxy for the CTV question. The scenario bands therefore derive entirely from the base rates above. The market snapshot supplies only the pie-size context and the standing reminder that a direct external check on the CTV-share question does not yet exist.\n\n## What Would Change My Forecast\n\nThese triggers are falsifiable and dated where possible; each moves probability mass between scenarios in a stated direction.\n\n1. **AdImpact 2026 final CTV actuals (early 2027) diverge >25% from the ~$2.5B band, or measured 2026 share lands clearly above 24% vs. flat at 20–24%** — reshuffles mass across Continuation / Plateau / Re-Acceleration (a high print with rising share moves mass toward Re-Acceleration; a flat-to-low print with a stalled share moves it toward Plateau).\n2. **Any premium SVOD holdout (Netflix the live case) opens to U.S. political ads early enough to move 2028** — shifts mass from Plateau into Re-Acceleration; a confirmed reversal pushes Re-Acceleration toward modal.\n3. **Passage of the Honest Ads Act / successor, or any FCC/FEC action reaching streaming** — activates and deepens Regulatory / Platform Break.\n4. **A federal appeals court UPHOLDING a state AI-disclosure mandate, OR another state copying Washington's court-surviving disclosure template, OR the December-2025 preemption EO whipsawing state AI law** — fattens or collapses Regulatory / Platform Break by direction (a clean EO void of state AI law with Honest Ads stalled again collapses it back toward On-Curve Continuation).\n5. **Fox–Roku (~$22B, 1H-2027 guidance, March-2028 long-stop) closing, being blocked, or reshaping Roku's political-ad archive / ACR posture** — moves Regulatory / Platform Break.\n6. **A credible, independent, CTV-specific incrementality study** — a null activates Effectiveness Deflation (dampened by priced-and-ignored inertia); a positive result forecloses that tail and feeds Re-Acceleration.\n7. **Nielsen *The Gauge* showing a sustained reversal of streaming's viewing-share lead** — undercuts the dominant migration driver under *every* scenario.\n8. **A liquid market finally pricing the CTV-share question, or Roku / Vizio / Magnite / Trade Desk M&A** — replaces the borrowed election-control spend-envelope anchor with a direct external check.\n\n## Open Questions\n\n- **Which definition wins?** The single largest source of share ambiguity is whether the market settles on AdImpact's broad top-line-medium measure (~21% in 2024) or eMarketer's narrow slice-of-digital measure (~12.6%). The scenarios are written against the broad measure; a consensus shift to the narrow one would lower every stated share band without changing the directional story.\n- **Does Netflix open, and when?** The single highest-leverage perishable variable. Netflix has ~13M US ad-tier subscribers and active AAPC / buyer lobbying but has not reversed as of June 2026; the *timing* (early enough to matter for 2028) is as decisive as the fact.\n- **Will a CTV-specific incrementality study ever be produced?** No streaming-specific field experiment yet exists. Whether one is produced in-horizon — and whether it would survive vendor counter-messaging well enough to re-price the channel — is the open question behind the entire Effectiveness Deflation tail.\n- **How does the Fox–Roku deal clear, and what does it do to the political archive?** The ~$22B deal is signed but pending (1H-2027 guidance, March-2028 long-stop); whether it clears antitrust review and whether it changes Roku's political-ad archive / ACR posture is unresolved.\n- **Which way does the December-2025 AI-preemption EO cut?** It is a genuinely two-sided variable — it could neutralize the state patchwork into pure continuity, or trigger a litigation whipsaw that bends the trajectory. The implementation path (DOJ litigation, FCC NPRM) is not yet visible.\n- **What was the exact 2025 off-year CTV-political dollar figure?** The 2025 off-year was a substantial market, but the exact figure is not yet cleanly reported — a gap in the trough-filling base rate.\n\n## Sources\n\nThe forecast's base rates and triggers rest on the load-bearing external sources below:\n\n- Nielsen, *The Gauge* (May 2025 data), \"Streaming Reaches Historic TV Milestone\" — streaming 44.8% > broadcast+cable 44.2%, the crossover anchoring the cord-cutting ratchet. https://www.nielsen.com (accessed 2026-06-23)\n- AdImpact, \"Political Projections Report 2025–2026\" (September 2025; updated June 11 2026) and \"The Role of CTV in 2025 Political Campaigns\" (Wisconsin Supreme Court CTV = 31% of spend, geo/demo). https://adimpact.com/blogs/the-role-of-ctv-in-2025-political-campaigns\n- eMarketer / Insider Intelligence, \"How programmatic political ads will impact the ad ecosystem\" (June 3 2024) — the narrow definition: $1.56B = 12.6% of total, up from 2.7% in 2020. https://www.emarketer.com\n- Honest Ads Act, S.486 / H.R.2599 (118th Congress), congress.gov; Sen. Mark Warner, \"The Honest Ads Act\" — the unpassed federal disclosure bill anchoring the gap-stays-open base rate.\n- Kohls v. Bonta, No. 2:24-cv-02527 (E.D. Cal.), permanent injunction / summary judgment August 29 2025 (via EPIC) — prohibition-model state AI law enjoined.\n- *Washington v. Meta* — $35.2M disclosure penalty affirmed, First Amendment challenge rejected (Washington Supreme Court, June 18 2026, 6-of-9); the court-surviving disclosure template.\n- The Washington Post v. McManus, No. 19-1132 (4th Cir. Dec. 6 2019), via Justia — forecloses the EU targeting-ban mechanism in the US; caps the regulatory tail.\n- White House, Executive Order \"Ensuring a National Policy Framework for Artificial Intelligence\" (December 11 2025); DLA Piper / Mayer Brown / Benton Institute analyses — the two-sided AI-preemption wildcard.\n- Reg. (EU) 2024/900 (TTPA), EUR-Lex, Art. 18; European Commission TTPA page — the natural experiment in which Google (2024) and Meta (Oct 6 2025) exited rather than de-target.\n- Kalla & Broockman, \"The Minimal Persuasive Effects of Campaign Contact in General Elections: Evidence from 49 Field Experiments,\" APSR 112(1):148–166, 2018; Coppock, Green & Porter, \"Does digital advertising affect vote choice?\" Research & Politics 9(1), 2022 (digital video −0.04pp at ZIP level) — the priced-and-ignored persuasion record.\n- Apple, \"Apple Advertising Policies,\" last updated February 26 2025 (prohibits political ads) — the only refuser confirmed from its own current policy text. https://ads.apple.com/policies\n- Campaigns & Elections / AdImpact reporting (September 5 2025) — roster source for three of four refusers (Netflix, Prime Video, Disney+), the \"crown jewel\" framing, and the ~13M Netflix ad-tier figure.\n- Fox Corporation, \"Fox Corporation to Acquire Roku, Inc.,\" press release and Form 8-K (Ex. 99.1), SEC EDGAR, June 15 2026; CNBC, \"Fox to buy streaming device maker Roku for $22 billion,\" June 15 2026; MLex, \"Fox-Roku deal tees up US antitrust review of streaming, connected-TV ads,\" June 2026 — the pending ~$22B deal, 1H-2027 expected close.\n- Prediction-market sweep (2026-06-23): Polymarket Balance-of-Power 2026 (https://polymarket.com/event/balance-of-power-2026-midterms) and 2028 presidency (https://polymarket.com/event/which-party-wins-2028-us-presidential-election) and \"acquired before 2027\" (https://polymarket.com/event/which-companies-will-be-acquired-before-2027); Kalshi CONTROLH-2026 (https://kalshi.com/markets/controlh/house-winner/controlh-2026) and CONTROLS-2026 (https://kalshi.com/markets/controls/senate-winner/controls-2026); Metaculus Q35047 (https://www.metaculus.com/questions/35047/) and Q35046 (https://www.metaculus.com/questions/35046/); Manifold (https://manifold.markets).\n\nThese draw on a wider annotated source base of 238 distinct sources."}], "glossary": []}</script>

<script>
const corpus = JSON.parse(document.getElementById('corpus-data').textContent);
const docs = corpus.documents;
const toc = document.getElementById('toc');
const content = document.getElementById('content');
// glossary matchers — built up front so the first chapter's render can wrap chips
// (applyGlossary + the popover/panel wiring live near the end of this script)
var GLOSS = (corpus.glossary || []).filter(function (e) { return e && e.term && e.def; });
var GLOSS_M = (function () {
  if (!GLOSS.length) return [];
  var items = [];
  GLOSS.forEach(function (e) {
    [e.term].concat(e.aliases || []).forEach(function (s) {
      if (!s) return;
      var cs = /[A-Z]/.test(s);                                   // acronyms match case-sensitively
      var q = s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var re = new RegExp('(^|[^A-Za-z0-9-])(' + q + ')(?![A-Za-z0-9-])', cs ? '' : 'i');
      items.push({ len: s.length, re: re, def: e.def, term: e.term });
    });
  });
  items.sort(function (a, b) { return b.len - a.len; });          // longest phrase wins
  return items;
})();
const searchBox = document.getElementById('search');
const results = document.getElementById('search-results');
const key = 'corpus:' + corpus.slug;
let current = 0;

// theme
const themePref = localStorage.getItem('corpus-theme');
if (themePref) document.documentElement.dataset.theme = themePref;
else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
document.getElementById('theme-btn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('corpus-theme', next);
};

// table of contents
docs.forEach((d, i) => {
  const a = document.createElement('a');
  a.href = '#ch-' + i;
  a.innerHTML = '<span class="num">' + String(i).padStart(2, '0') + '</span>' + d.title;
  a.title = d.summary || '';
  a.onclick = (e) => { e.preventDefault(); show(i); closeMenu(); };
  toc.appendChild(a);
});

let firstShow = true;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// Animated reveal-on-scroll for charts & figures. Figures stay fully visible
// unless armed here, so this is purely additive (no-JS / reduced-motion = static).
// Correctness rule: a figure must NEVER stay hidden. IntersectionObserver only
// *times* the reveal to scroll; an immediate in-view pass and a backstop timeout
// guarantee every armed figure reveals even if IO is throttled or unsupported.
let revealObserver = null, revealBackstop = null;
function armReveals(root) {
  if (revealObserver) { revealObserver.disconnect(); revealObserver = null; }
  if (revealBackstop) { clearTimeout(revealBackstop); revealBackstop = null; }
  if (reduceMotion) return;
  const figs = [...root.querySelectorAll('figure.viz, figure.corpus-fig')];
  if (!figs.length) return;
  figs.forEach(f => f.classList.add('reveal-armed'));
  const reveal = f => f.classList.add('is-revealed');
  if ('IntersectionObserver' in window) {
    revealObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { reveal(en.target); obs.unobserve(en.target); } });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });
    figs.forEach(f => revealObserver.observe(f));
  }
  // reveal anything already on screen once layout settles — uses setTimeout (not
  // rAF) so above-the-fold figures still reveal where frames/IO are throttled
  setTimeout(() => {
    const vh = window.innerHeight || 800;
    figs.forEach(f => { const r = f.getBoundingClientRect(); if (r.top < vh * 0.92 && r.bottom > 0) reveal(f); });
  }, 60);
  // safety net: never leave a figure invisible, even if IO never fires
  revealBackstop = setTimeout(() => figs.forEach(reveal), 2600);
}
function show(i, anchorText) {
  if (listening && !autoNext) stopListen();  // manual nav stops narration; auto-advance keeps it
  const apply = () => {
  current = Math.max(0, Math.min(docs.length - 1, i));
  content.innerHTML = marked.parse(docs[current].body);
  // rewrite chapter-to-chapter .md links into in-app navigation
  content.querySelectorAll('a[href$=".md"]').forEach(a => {
    const target = docs.findIndex(d => a.getAttribute('href').endsWith(d.file));
    if (target >= 0) { a.href = '#ch-' + target; a.onclick = (e) => { e.preventDefault(); show(target); }; }
  });
  content.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  applyGlossary(content);
  armReveals(content);
  toc.querySelectorAll('a').forEach((a, j) => a.classList.toggle('active', j === current));
  document.getElementById('prev').disabled = current === 0;
  document.getElementById('next').disabled = current === docs.length - 1;
  document.getElementById('pager-label').textContent = (current + 1) + ' / ' + docs.length + ' · ' + docs[current].title
    + ' · ' + Math.max(1, Math.round(docs[current].body.split(/\s+/).length / 220)) + ' min';
  history.replaceState(null, '', '#ch-' + current);
  localStorage.setItem(key, current);
  // feed the cross-page library shell: per-corpus read set + global recents
  try {
    const rk = 'read:' + corpus.slug;
    const readArr = JSON.parse(localStorage.getItem(rk) || '[]');
    if (readArr.indexOf(current) < 0) { readArr.push(current); localStorage.setItem(rk, JSON.stringify(readArr)); }
    const rec = (JSON.parse(localStorage.getItem('library-recents') || '[]') || []).filter(r => r.slug !== corpus.slug);
    rec.unshift({ slug: corpus.slug, title: corpus.title, ch: current, chTitle: docs[current].title, ts: Date.now() });
    localStorage.setItem('library-recents', JSON.stringify(rec.slice(0, 20)));
    // quiet reading streak: bump once per calendar day a chapter is opened
    const today = new Date().toISOString().slice(0, 10);
    const st = JSON.parse(localStorage.getItem('reading-streak') || '{}');
    if (st.last !== today) {
      const yest = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      st.count = (st.last === yest ? (st.count || 0) : 0) + 1;
      st.last = today;
      localStorage.setItem('reading-streak', JSON.stringify(st));
    }
  } catch (e) {}
  if (anchorText) {
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
    let node; while ((node = walker.nextNode())) {
      const idx = node.textContent.toLowerCase().indexOf(anchorText.toLowerCase());
      if (idx >= 0) {
        const host = node.parentElement;
        host.scrollIntoView({ block: 'center' });
        if (!reduceMotion) { host.classList.add('passage-flash'); setTimeout(() => host.classList.remove('passage-flash'), 2200); }
        return;
      }
    }
  }
  document.getElementById('main').scrollIntoView();
  window.scrollTo(0, 0);
  };
  // cross-fade chapter swaps where supported (skips first paint + reduced motion)
  if (document.startViewTransition && !reduceMotion && !firstShow) document.startViewTransition(apply);
  else apply();
  firstShow = false;
}

document.getElementById('prev').onclick = () => show(current - 1);
document.getElementById('next').onclick = () => show(current + 1);

let chordKey = null, chordTimer;
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const back = document.getElementById('cmdk-back');
  if (back && back.classList.contains('open')) return;  // palette owns the keys when open
  const help = document.getElementById('kbd-help');
  if (help && help.classList.contains('open')) { if (e.key === 'Escape' || e.key === '?') toggleHelp(); return; }
  if (chordKey === 'g') { clearTimeout(chordTimer); chordKey = null;
    if (e.key === 'g') { show(0); return; }
    if (e.key === 'e') { show(docs.length - 1); return; } }
  if (e.key === 'g') { chordKey = 'g'; chordTimer = setTimeout(() => { chordKey = null; }, 700); return; }
  if (e.key === 'ArrowLeft' || e.key === 'k') show(current - 1);
  else if (e.key === 'ArrowRight' || e.key === 'j') show(current + 1);
  else if (e.key === 'z' || e.key === 'Z') toggleFocus();
  else if (e.key === '?') toggleHelp();
});

function toggleFocus() {
  const on = document.body.classList.toggle('focus-mode');
  localStorage.setItem('reader-focus', on ? '1' : '0');
}
if (localStorage.getItem('reader-focus') === '1') document.body.classList.add('focus-mode');

function toggleHelp() {
  let h = document.getElementById('kbd-help');
  if (!h) {
    h = document.createElement('div'); h.id = 'kbd-help';
    h.innerHTML = '<div class="kh"><h3>Keyboard</h3><dl>'
      + '<dt>⌘K</dt><dd>command palette</dd>'
      + '<dt>← / k</dt><dd>previous chapter</dd>'
      + '<dt>→ / j</dt><dd>next chapter</dd>'
      + '<dt>g g</dt><dd>first chapter</dd>'
      + '<dt>g e</dt><dd>last chapter</dd>'
      + '<dt>Z</dt><dd>focus mode</dd>'
      + '<dt>?</dt><dd>this help</dd></dl></div>';
    h.addEventListener('click', (ev) => { if (ev.target === h) toggleHelp(); });
    document.body.appendChild(h);
  }
  h.classList.toggle('open');
}

// search
let timer;
searchBox.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(runSearch, 150);
});
function runSearch() {
  const q = searchBox.value.trim().toLowerCase();
  results.innerHTML = '';
  toc.style.display = q ? 'none' : '';
  if (!q || q.length < 3) { toc.style.display = ''; return; }
  let hits = 0;
  docs.forEach((d, i) => {
    const text = d.body.toLowerCase();
    let pos = text.indexOf(q), shown = 0;
    while (pos >= 0 && shown < 3 && hits < 40) {
      const start = Math.max(0, pos - 60), end = Math.min(d.body.length, pos + q.length + 90);
      const raw = d.body.slice(start, end).replace(/[#*_>\[\]]/g, '');
      const safe = raw.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const snippet = safe.replace(new RegExp(q.replace(/[.*+?^${}()|\\]/g, '\\$&'), 'ig'), m => '<mark>' + m + '</mark>');
      const div = document.createElement('div');
      div.className = 'hit';
      div.innerHTML = '<b>' + d.title + '</b>…' + snippet + '…';
      const exact = d.body.slice(pos, pos + q.length);
      div.onclick = () => { show(i, exact); searchBox.value = ''; runSearch(); closeMenu(); };
      results.appendChild(div);
      hits++; shown++;
      pos = text.indexOf(q, pos + q.length);
    }
  });
  if (!hits) results.innerHTML = '<div class="none">No matches.</div>';
}

// mobile menu
const menuBtn = document.getElementById('menu-btn');

// ---- Listen mode (browser Web Speech API) + share-this-chapter ----
const synth = window.speechSynthesis;
let listening = false, paused = false, autoNext = false, listenIdx = 0, listenRate = 1,
    listenAuto = true, sleepMode = 'none', sleepTimer = null, lchunks = [], lidx = 0, lbar = null;
function chapterText(i) {
  let t = docs[i] ? docs[i].body : '';
  return t.replace(/```[\s\S]*?```/g, ' ').replace(/<[^>]+>/g, ' ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
          .replace(/[#>*_`~|]/g, ' ').replace(/\s+/g, ' ').trim();
}

  const raw = t.match(/[^.!?]+[.!?]+["')\]”’]*|\S[^.!?]*$/g) || [t];
  const out = []; let buf = '';
  raw.forEach(s => { s = s.trim(); if (!s) return;
    if ((buf + ' ' + s).length > 240 && buf) { out.push(buf); buf = s; } else buf = buf ? buf + ' ' + s : s; });
  if (buf) out.push(buf);

}
function pickVoice() {

  if (name) { const v = vs.find(v => v.name === name); if (v) return v; }
  return vs.find(v => /^en/i.test(v.lang) && /enhanced|premium/i.test(v.name) && v.localService)
    || vs.find(v => /^en/i.test(v.lang) && v.localService)
    || vs.find(v => /^en/i.test(v.lang)) || vs[0];
}
function populateVoices() {
  const sel = lbar && lbar.querySelector('#lb-voice');
  if (!sel) return;
  const vs = synth.getVoices().filter(v => /^en/i.test(v.lang));
  if (!vs.length) return;
  vs.sort((a, b) => {
    const rank = v => /enhanced|premium/i.test(v.name) ? 0 : v.localService ? 1 : 2;
    return rank(a) - rank(b);
  });
  const prev = sel.value;
  sel.innerHTML = vs.map(v => '<option value="' + v.name + '">' + v.name + '</option>').join('');
  if (prev && vs.find(v => v.name === prev)) sel.value = prev;
  if (!localStorage.getItem('listen-voice-tip') && !vs.some(v => /enhanced|premium/i.test(v.name))) {
    localStorage.setItem('listen-voice-tip', '1');
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:.65rem 1.1rem;font-family:var(--sans);font-size:.78rem;color:var(--muted);z-index:50;max-width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.18);line-height:1.5';

}
function speakChunk() {

      listenIdx++; autoNext = true; show(listenIdx); autoNext = false;
      lchunks = chunkText(chapterText(listenIdx)); lidx = 0; updateBar(); speakChunk();
    } else stopListen();

  u.onerror = () => { if (listening && !paused) { lidx++; speakChunk(); } };

}
function startListen() {
  if (!synth) return;
  synth.cancel(); listening = true; paused = false; listenIdx = current;
  lchunks = chunkText(chapterText(listenIdx)); lidx = 0; buildBar(); lbar.classList.add('show'); updateBar();
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.add('on');

}
function stopListen() {
  listening = false; paused = false; if (synth) synth.cancel();
  if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  if (lbar) lbar.classList.remove('show');
  const lb = document.getElementById('listen-btn'); if (lb) lb.classList.remove('on');
}
function togglePause() { if (!listening) return;
  if (paused) { synth.resume(); paused = false; } else { synth.pause(); paused = true; } updateBar(); }

}
function buildBar() {
  if (lbar) return;
  lbar = document.createElement('div'); lbar.id = 'listen-bar';
  lbar.innerHTML = '<button id="lb-toggle" title="Pause">⏸</button><button id="lb-stop" title="Stop">⏹</button>'
    + '<span id="lb-title"></span>'
    + '<label class="lb-ctl">Voice <select id="lb-voice"><option>Loading…</option></select></label>'
    + '<label class="lb-ctl">Speed <select id="lb-rate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select></label>'
    + '<label class="lb-ctl">Sleep <select id="lb-sleep"><option value="0" selected>Off</option><option value="1">End of chapter</option><option value="900">15 min</option><option value="1800">30 min</option></select></label>';
  document.body.appendChild(lbar);
  lbar.querySelector('#lb-toggle').onclick = togglePause;
  lbar.querySelector('#lb-stop').onclick = stopListen;
  lbar.querySelector('#lb-rate').onchange = function () { listenRate = +this.value; };
  lbar.querySelector('#lb-sleep').onchange = function () { setSleep(+this.value); };
  populateVoices();
  if (synth.onvoiceschanged !== undefined) synth.addEventListener('voiceschanged', populateVoices);
}
function updateBar() {
  if (!lbar) return;
  const t = lbar.querySelector('#lb-title'); if (t) t.textContent = docs[listenIdx] ? docs[listenIdx].title : '';
  const tg = lbar.querySelector('#lb-toggle'); if (tg) tg.textContent = paused ? '▶' : '⏸';
}
const listenBtn = document.getElementById('listen-btn');
if (listenBtn) {
  if (!synth) listenBtn.style.display = 'none';
  else listenBtn.onclick = () => { listening ? stopListen() : startListen(); };
}
const shareBtn = document.getElementById('share-btn');
if (shareBtn) shareBtn.onclick = () => {
  if (!window.CorpusShare) return;
  window.CorpusShare.open({ kicker: corpus.title, title: docs[current].title,
    source: corpus.subtitle || corpus.title,
    url: location.origin + location.pathname + '#ch-' + current, filename: 'chapter' });
};
window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

// initial chapter: hash > saved progress > 0; ?q= deep-links to a passage (Today's Passage, share cards)
const hash = location.hash.match(/^#ch-(\d+)$/);
const anchorQ = new URLSearchParams(location.search).get('q');
show(hash ? +hash[1] : +(localStorage.getItem(key) || 0), anchorQ || undefined);

// respond to in-page hash changes: browser back/forward, and cross-page command
// palette jumps that land on a chapter of the corpus already open (no reload).
window.addEventListener('hashchange', () => {
  const h = location.hash.match(/^#ch-(\d+)$/);
  if (h && +h[1] !== current) show(+h[1]);
});

// Related reading at the foot of the column — corpus-level, from the inlined
// library manifest's precomputed similarity graph (no fetch). Deferred to
// DOMContentLoaded because the shell (which carries #library-manifest) is
// injected into the page AFTER this script.
function renderRelated() {
  const relEl = document.getElementById('related');
  const mEl = document.getElementById('library-manifest');
  if (!relEl || !mEl) return;
  let LIB; try { LIB = JSON.parse(mEl.textContent); } catch (e) { return; }
  const me = LIB.find(x => x.slug === corpus.slug);
  const rel = (me && me.related) || [];
  if (!rel.length) return;
  const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  relEl.innerHTML = '<h3 class="related-h">Related reading</h3><div class="related-grid">'
    + rel.map(r => '<a class="related-card" href="' + esc(r.slug) + '.html">'
        + '<span class="related-cat">' + esc(r.category || '') + '</span>'
        + '<span class="related-t">' + esc(r.title) + '</span></a>').join('')
    + '</div>';
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderRelated);
else renderRelated();

// top reading-progress bar
(function () {
  var bar = document.getElementById('reader-progress'); if (!bar) return;
  function onScroll() { var h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%'; }
  document.addEventListener('scroll', onScroll, { passive: true }); onScroll();
})();

// reader type controls — text size + measure, persisted across the whole library
(function () {
  var contentEl = document.getElementById('content'), btn = document.getElementById('type-btn');
  if (!contentEl || !btn) return;
  var SIZES = { s: '0.95rem', m: '1.04rem', l: '1.16rem', xl: '1.28rem' };
  var MEAS = { narrow: '640px', normal: '740px', wide: '880px' };
  var fs = SIZES[localStorage.getItem('reader-fs')] ? localStorage.getItem('reader-fs') : 'm';
  var meas = MEAS[localStorage.getItem('reader-measure')] ? localStorage.getItem('reader-measure') : 'normal';
  function applyType() {
    contentEl.style.setProperty('--reader-fs', SIZES[fs]);
    contentEl.style.setProperty('--reader-measure', MEAS[meas]);
    var pg = document.getElementById('pager'); if (pg) pg.style.maxWidth = MEAS[meas];
    var rl = document.getElementById('related'); if (rl) rl.style.maxWidth = MEAS[meas];
  }
  applyType();
  var panel;
  function mark() {
    if (!panel) return;
    [].forEach.call(panel.querySelectorAll('#tp-size button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === fs); });
    [].forEach.call(panel.querySelectorAll('#tp-meas button'), function (b) { b.classList.toggle('on', b.getAttribute('data-v') === meas); });
  }
  function build() {
    panel = document.createElement('div'); panel.id = 'type-panel';
    panel.innerHTML = '<div class="tp-row"><span class="tp-lab">Text size</span><span class="tp-grp" id="tp-size">'
      + '<button data-v="s" aria-label="Smaller">A−</button><button data-v="m">A</button>'
      + '<button data-v="l">A+</button><button data-v="xl" aria-label="Largest">A++</button></span></div>'
      + '<div class="tp-row"><span class="tp-lab">Width</span><span class="tp-grp" id="tp-meas">'
      + '<button data-v="narrow">Narrow</button><button data-v="normal">Normal</button><button data-v="wide">Wide</button></span></div>';
    document.body.appendChild(panel);
    panel.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var v = b.getAttribute('data-v');
      if (b.parentNode.id === 'tp-size') { fs = v; localStorage.setItem('reader-fs', v); }

    if (panel.classList.toggle('open')) {

      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      var top = r.top - panel.offsetHeight - 8;
      panel.style.top = (top < 8 ? r.bottom + 8 : top) + 'px';
    }

  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) panel.classList.remove('open');
  });
})();

// ---- glossary: inline definition chips + hover/tap popover + terms panel ----
// The corpus carries a `glossary` ([{term, aliases[], def}]); the first in-text
// occurrence of each term (per chapter) becomes a chip that reveals a plain
// definition on hover (desktop) or tap (touch), with a full terms list behind
// the sidebar "Terms" button. Definitions never distract from the prose.
// (GLOSS / GLOSS_M are defined up top so the first render can wrap chips.)
function applyGlossary(root) {
  if (!GLOSS_M || !GLOSS_M.length) return;
  var used = {};
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      for (var p = n.parentNode; p && p !== root; p = p.parentNode) {
        var t = p.nodeName;
        if (t === 'A' || t === 'CODE' || t === 'PRE' || /^H[1-4]$/.test(t)) return NodeFilter.FILTER_REJECT;
        if (p.classList && (p.classList.contains('gloss') || p.classList.contains('corpus-fig'))) return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var nodes = []; for (var nd; (nd = walker.nextNode());) nodes.push(nd);
  nodes.forEach(function (node) {
    for (var i = 0; i < GLOSS_M.length; i++) {
      var m = GLOSS_M[i]; if (used[m.term]) continue;
      var mt = m.re.exec(node.nodeValue); if (!mt) continue;
      var pre = mt[1] || '', word = mt[2], start = mt.index + pre.length;
      var after = node.splitText(start);
      after.nodeValue = after.nodeValue.slice(word.length);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gloss'; b.textContent = word;

(function setupGlossary() {
  if (!GLOSS.length) return;

  document.body.appendChild(pop);

  var openFor = null, cEl = document.getElementById('content');

    pop.querySelector('.gp-term').textContent = btn.getAttribute('data-term');
    pop.querySelector('.gp-def').textContent = btn.getAttribute('data-def');
    pop.classList.add('open');
    var r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;

  }

  }

  });
  document.addEventListener('click', function (e) {
    if (openFor && !(e.target.closest && (e.target.closest('.gloss') || e.target.closest('#gloss-pop')))) close();
  });

  var tbtn = document.getElementById('terms-btn'); if (!tbtn) return;

  tbtn.addEventListener('click', function () {
    if (!panel) {

      var sorted = GLOSS.slice().sort(function (a, b) { return a.term.localeCompare(b.term); });
      var h = '<h4>' + sorted.length + ' terms in this corpus</h4><dl>';
      sorted.forEach(function (e) { h += '<dt>' + esc(e.term) + '</dt><dd>' + esc(e.def) + '</dd>'; });
      panel.innerHTML = h + '</dl>'; document.body.appendChild(panel);
    }
    var opened = panel.classList.toggle('open');

      var r = tbtn.getBoundingClientRect();
      panel.style.left = Math.min(r.left, window.innerWidth - panel.offsetWidth - 8) + 'px';
      panel.style.top = (r.bottom + 8) + 'px';
    }
  });
  document.addEventListener('click', function (e) {
    if (panel && panel.classList.contains('open') && !panel.contains(e.target) && e.target !== tbtn) panel.classList.remove('open');
  });
})();

#resume { display: none; }
#resume.on { display: block; max-width: 1080px; margin: 1.2rem auto 0; padding: 0 2rem; }
#resume a { display: flex; align-items: center; gap: 1rem; text-decoration: none; color: var(--text); background: var(--panel);
  border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 0 14px 14px 0; padding: 1rem 1.3rem; transition: border-color .15s ease; }
#resume a:hover { border-color: var(--accent); }
#resume .rcol { min-width: 0; }
#resume .rk { display: block; font-family: var(--sans); font-size: .62rem; text-transform: uppercase; letter-spacing: .16em; color: var(--accent); margin: 0 0 .25rem; }
#resume .rt { display: block; font-family: var(--display); font-size: 1.12rem; line-height: 1.2; }
#resume .rs { display: block; font-family: var(--sans); font-size: .76rem; color: var(--muted); margin: .2rem 0 0; }

/* shareable-card preview modal */

#share-back.open { display: flex; }
#share-box { background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; max-width: 380px; width: 100%; box-shadow: var(--shadow-3), 0 40px 90px rgba(0,0,0,.32); }
#share-img { width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border); }
#share-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
#share-actions button { font-family: var(--sans); font-size: .8rem; padding: .5rem .8rem; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text); cursor: pointer; }

.share-toast { position: fixed; bottom: 1.3rem; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--bg); font-family: var(--sans); font-size: .8rem; padding: .5rem .9rem; border-radius: 10px; z-index: 95; }

(function () {

    if (C) {
      var pts = C.nodes.map(function (n) { return [n.x, n.y]; }); pts.push([C.home.x, C.home.y]);
      pts.forEach(function (q) { X0 = Math.min(X0, q[0]); Y0 = Math.min(Y0, q[1]); X1 = Math.max(X1, q[0]); Y1 = Math.max(Y1, q[1]); });
      var px = 120, py = 150;
      DATA._b = { x: X0 - px, y: Y0 - py, w: (X1 - X0) + 2 * px, h: (Y1 - Y0) + 2 * py };
    } else {
      DATA.places.forEach(function (p) { bySlug[p.slug] = p; var c = p.cell;
        X0 = Math.min(X0, c[0]); Y0 = Math.min(Y0, c[1]); X1 = Math.max(X1, c[0] + c[2]); Y1 = Math.max(Y1, c[1] + c[3]); });
      DATA._b = { x: X0 - 40, y: Y0 - 40, w: (X1 - X0) + 80, h: (Y1 - Y0) + 80 };
    }
  }

  function wirePlaces(j) {
    [].forEach.call(world.querySelectorAll('.atlas-place'), function (el) {
      var p = bySlug[el.getAttribute('data-slug')];
      el.addEventListener('pointerenter', function () { if (!dragging) activate(p, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== p) activate(p, el); });
      el.addEventListener('pointerleave', schedHide);
      el.addEventListener('click', function (e) { if (moved || e.target.closest('#atlas-card')) return; window.location.href = base + p.href; });
    });
  }
  function wireConn(C) {
    [].forEach.call(world.querySelectorAll('.atlas-cnode'), function (el) {
      var i = +el.getAttribute('data-i'), n = C.nodes[i];
      el.addEventListener('pointerenter', function () { if (!dragging) showNode(C, i, el); });
      el.addEventListener('pointermove', function () { if (!dragging && active !== n) showNode(C, i, el); });
      el.addEventListener('pointerleave', function () { lit(i, false); schedHide(); });
      el.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    });
    var home = world.querySelector('.atlas-home');
    if (home) {
      home.addEventListener('pointerenter', function () { if (!dragging) showHome(C, home); });
      home.addEventListener('pointermove', function () { if (!dragging && active !== C.home) showHome(C, home); });
      home.addEventListener('pointerleave', schedHide);
      home.addEventListener('click', function (e) { if (moved) return; window.location.href = base + C.home.href; });
    }
  }
  function lit(i, on) {
    var t = world.querySelector('.atlas-thread[data-i="' + i + '"]'); if (t) t.classList.toggle('lit', on);
    var nn = world.querySelector('.atlas-cnode[data-i="' + i + '"]'); if (nn) nn.classList.toggle('active', on);
  }

  function activate(p, el) {
    clearActive();
    active = p; p._el = el; el.classList.add('active');
    var opts = '<option value="" disabled selected>Jump to a chapter…</option>';
    (p.chapters || []).forEach(function (ch) { opts += '<option value="' + esc(base + ch.href) + '">' + esc(ch.t) + '</option>'; });
    card.innerHTML = '<a class="ac-title" href="' + esc(base + p.href) + '" style="color:' + esc(p.accent) + '">' + esc(p.title) + '</a>'
      + '<div class="ac-place">' + esc(p.label) + '</div>'
      + (p.chapters && p.chapters.length ? '<select class="ac-sel" aria-label="Jump to a chapter">' + opts + '</select>' : '');
    var sel = card.querySelector('.ac-sel');
    if (sel) sel.onchange = function () { if (this.value) window.location.href = this.value; };
    showCardAt(el);
  }
  function showNode(C, i, el) {
    clearActive(); var n = C.nodes[i]; active = n; lit(i, true);
    card.innerHTML = '<div class="ac-kind">' + esc(n.kind) + '</div>'
      + '<span class="ac-title" style="color:' + esc(C.home.accent) + '">' + esc(n.name) + '</span>'
      + '<div class="ac-place">' + esc(n.place) + '</div>'
      + (n.relation ? '<div class="ac-rel">' + esc(n.relation) + '</div>' : '');
    showCardAt(el);
  }
  function showHome(C, el) {
    clearActive(); var H = C.home; active = H;
    card.innerHTML = '<a class="ac-title" href="' + esc(base + H.href) + '" style="color:' + esc(H.accent) + '">' + esc(H.title) + '</a>'
      + '<div class="ac-place">' + esc(H.place) + '</div>'
      + (H.note ? '<div class="ac-rel">' + esc(H.note) + '</div>' : '')
      + '<div class="ac-cta" style="color:' + esc(H.accent) + '">Open corpus →</div>';
    showCardAt(el);
  }
  function showCardAt(el) {
    card.classList.add('show');
    var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    card.style.left = '0px'; card.style.top = '0px';
    var cw = card.offsetWidth, chh = card.offsetHeight;
    var cx = (r.left + r.right) / 2 - sr.left, cyTop = r.top - sr.top;
    var left = Math.max(8, Math.min(sr.width - cw - 8, cx - cw / 2));
    var top = cyTop - chh - 12; if (top < 8) top = (r.bottom - sr.top) + 12;
    top = Math.max(8, Math.min(sr.height - chh - 8, top));
    card.style.left = left + 'px'; card.style.top = top + 'px';
    if (hideT) { clearTimeout(hideT); hideT = null; }
  }
  function schedHide() { if (hideT) clearTimeout(hideT); hideT = setTimeout(hideCard, 240); }
  function clearActive() {
    if (!world) return;
    [].forEach.call(world.querySelectorAll('.atlas-place.active, .atlas-cnode.active'), function (e) { e.classList.remove('active'); });
    [].forEach.call(world.querySelectorAll('.atlas-thread.lit'), function (e) { e.classList.remove('lit'); });
  }
  function hideCard() { if (card) card.classList.remove('show'); clearActive(); active = null; }
})();
</script>
</body>
</html>
