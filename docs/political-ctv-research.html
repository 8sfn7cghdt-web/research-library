<script id="corpus-data" type="application/json">{"slug": "political-ctv-research", "title": "The Measured Screen", "subtitle": "Political advertising migrates to connected TV — the smart-TV ACR and voter-file targeting stack, who captures the spend, the streaming regulatory gap, and whether any of it actually moves votes.", "author": "", "generated": "2026-06-24", "documents": [{"order": 0, "file": "00_Briefing.md", "title": "U.S. Political CTV Advertising: A Briefing", "summary": "", "body": "# U.S. Political CTV Advertising: A Briefing\n\n## Bottom Line\n\n> **Political connected-TV advertising has become the only growing line in a record political-ad budget — and the case for it rests more on where the audience went than on proof that the ads change minds.** Streaming passed broadcast-plus-cable in U.S. TV viewing for the first time in May 2025, and campaign money follows reach: political CTV spend ran ~$2.3 billion in the 2024 cycle (about 21% of an ~$11.1 billion total, the second-largest medium) and AdImpact projects ~$2.7 billion for 2026, the only major channel projected to grow. The machine underneath it is a five-layer **addressability stack** — smart-TV automatic-content-recognition (ACR) data from Roku, LG, Vizio, and Samsung; the commercial voter file (L2, i360, TargetSmart, Catalist); a clean-room matching layer; productized political audiences (Comscore × L2 and Proximic); and outcome measurement — that resolves, honestly stated, to *household-level, partially-matched, partially-modeled* targeting, not literal voter-level precision. The uncomfortable center of the story is that the best independent evidence finds the average persuasive effect of a political ad on a general-election vote is **near zero**, and the delivery channel does not change that; the channel's defensible value is reach efficiency, mobilization, and informing voters in low-salience down-ballot races — not swinging presidential persuadables. Streaming ads also sit in a **regulatory gap**: the FCC's equal-time, lowest-unit-rate, and public-file rules bind broadcasters, not CTV platforms, and the data enabling voter targeting is largely outside commercial-privacy law. The outlook through 2028 is about *slope*, not direction: dollars keep rising and the federal gap stays open; the live question is whether CTV's *share* climbs into the high-20s% (modal) or stalls in the low-20s% as the four largest streamers keep refusing political ads.\n\n## How to Read This\n\nThe five-minute version is this Bottom Line and the three synthesis sections below. The thirty-minute version is these opening pages in full plus the outlook. The full version is the chapters that follow, in order.\n\n> These three sections are written at a higher altitude — interpretation and connection, not a paste of the chapters that follow. The reader meets the full version in the chapters themselves.\n\n## Origins (Brief)\n\nTwo facts governed political television for seventy years, and streaming broke both. First, **broadcast spectrum is federally licensed**. That license is the source of the entire FCC political-advertising regime — equal-time (§315), reasonable access, the lowest-unit-charge protection, and the public political file. Second, television was bought **market-by-market against Nielsen's 210 Designated Market Areas**, the geographic unit that made political TV a game of buying the right local affiliates. Connected TV inherits neither. It travels over the internet, so no license is involved and the FCC's authority does not reach it, and it is bought against households rather than DMAs, dissolving the logic that justified market-level disclosure.\n\nThe migration was a five-cycle ramp, not an event. CTV was a rounding error in 2016, a named line item by 2018 (~30% of one CTV-heavy SSP's political spend), scaling in 2020 (~19% of digital, ~$260M), and roughly $1.1B by the 2022 midterms — before reaching ~$2.3B actual in 2024. A handful of contingent steps made voter-level targeting *technically* possible, and each could have gone differently: smart-TV ACR shipping from around 2014; the 2017 Vizio FTC settlement that forced ACR onto opt-in consent — the legal precondition for using the data at all; the commercialization of the voter file from a party utility into a licensable product; and the November 2017 Comscore–L2 partnership that productized a fusion of the national voter file with TV measurement (an early example, not the first — Rentrak and Nielsen had done versions earlier). The through-line that matters: by 2016, fusing the voter file with digital identity was already routine practice. CTV is what happened when that fused identity was pointed at the television screen.\n\n## Current State (Brief)\n\nThe present-day ecosystem is a five-layer stack, each layer run by a named set of vendors. The first thing to say about it: almost every number describing it is a *vendor claim*. The glass layer is ACR data from Roku (the #1 U.S. TV OS), LG, Vizio/Inscape (Walmart-owned since December 2024), and Samsung. The voter-file layer is the partisan-aligned data spine — i360 and the GOP's Data Trust on the right, TargetSmart and Catalist on the left, L2 and Aristotle bipartisan — carrying registration and vote history as fact plus *modeled* scores that an independent Pew audit found only ~67% accurate on party. The match layer (LiveRamp, hashed email, IP-to-household, clean rooms) turns a record into a reachable device at vendor-claimed 50–90% match rates. The audience layer packages segments like \"likely-Republican infrequent voter, PA-07\" into a DSP. The measurement layer tries to tie exposure back to turnout. The honest deflation: this is household-level, partially-matched, partially-modeled addressability — a real step-change from DMA buying, but not the \"voter-level precision\" the marketing implies.\n\nThe market structure has a defining asymmetry: the **largest-reach streamers — Amazon Prime Video, Netflix, Disney+, Apple TV — refuse political advertising**, while Roku, Hulu, YouTube, Peacock, Paramount+/Pluto, Tubi, Samsung, LG, and Vizio accept it. That concentrates spend onto the accepting set and lifts their CPMs, though the premium is inferential. The Trade Desk, Madhive, and a handful of political specialists broker the buys; AdImpact and Borrell track the dollars. The question every buyer should ask is whether it works. Here the account is at its most critical. The political-science literature — Kalla & Broockman's meta-analytic zero, Coppock–Hill–Vavreck's ~0.007-point vote effect — finds general-election persuasion close to nil, and no public randomized evidence shows the CTV *format* beating linear. The vendor case (\"36% more efficient,\" \"23% incremental reach\") is credible *as media planning*, but it is about reach, not votes; the industry's central error is treating reach as effectiveness. Effects do grow as race salience falls — 2–4× down-ballot, 10–19× in low-information statewide races — which is exactly where targeted CTV plausibly earns its keep, alongside mobilization. Over all of it sits the regulatory gap: the FCC rules don't reach streaming, state disclosure laws are a patchwork (Washington's survived a First Amendment challenge in June 2026; California's AI-ad ban was struck down in full), and voter data largely escapes commercial-privacy law.\n\n## Forecast (Brief)\n\nThe forecast through the 2028 presidential cycle agrees on direction and splits on slope. Political CTV dollars keep rising — the cord-cutting ratchet is one-way, and the two-year cycle clock guarantees a 2028 pulse on a higher floor — and the federal streaming-disclosure gap stays open (the FEC's last disclaimer rule took ~11 years; the Honest Ads Act is 0-for-4). The genuine uncertainty is whether CTV's *share* of total political spend climbs or stalls.\n\nThe modal scenario, **On-Curve Continuation (34–44%)**, has share rising off 2024's ~21% into the mid-to-high-20s% by 2028 — a decelerating climb up the shoulder of an S-curve, not a repeat of the 2020→2024 surge, with CTV eating linear *cable* rather than sticky broadcast. Its mirror image, **Constrained Plateau (18–26%)**, has dollars still growing but share stalling in the low-20s%: the four premium refusers hold, CPMs spike in the surge window, and effectiveness skepticism keeps the waiting-for-proof dollar on broadcast. The upside, **Inventory Unlock / Re-Acceleration (13–19%)**, needs a continuity-breaking event — most plausibly Netflix or another holdout opening to political ads — to push share toward the low-30s%. The two tails are a **Regulatory / Platform Break (13–19%)**, where the Washington-v-Meta disclosure template, the December-2025 AI-preemption executive order, or the pending Fox–Roku acquisition bends the path, and an **Effectiveness / Credibility Deflation (7–12%)**, where a CTV-specific incrementality null finally re-prices the channel. The signals that would move weight between these are concrete and near: the 2026 midterm actuals (early 2027) against the ~$2.5–2.7B projection, whether any premium refuser reverses, the fate of the Honest Ads Act in the 119th Congress, and whether a peer-reviewed CTV-specific null enters the trade record.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios for U.S. political CTV through the 2028 cycle<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-m class=\"t-muted\">13–19%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Effectiveness / Credibilit…<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"219.4\" y=\"152\" width=\"24.6\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"251.9\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">7–12%<\/text><\/svg><figcaption>Probability bands derived from base rates (no liquid market prices the CTV-share question directly). <span class=\"credit\">Source: Forecast, 2026-06-23.<\/span><\/figcaption><\/figure>\n\n\n\n## Where This Account Stops\n\nThree things this account could not resolve. First, **whether the advertising actually works** — no public, randomized, CTV-specific incrementality study with a true unexposed holdout exists, so the near-zero-persuasion default rests on broader political-ad evidence, and the vendor lift claims rest on selection-prone designs the vendors run themselves. Second, **the real magnitudes behind the headline figures** — footprints, match rates, and \"incrementality\" numbers almost all originate with interested parties, and even the spend totals differ by definition across trackers (AdImpact's ~21%-of-cycle and eMarketer's ~45%-of-digital are not the same cut). Third, **two prospective facts that could move the whole board** — the Fox–Roku acquisition (announced June 15, 2026; not closed) and AdImpact's 2026 spend projections (already revised up once mid-cycle). These pages are current to June 23, 2026. Treat the history and structure with confidence, and the live commercial figures with the vendor-data caution that runs throughout.\n\n## What Follows\n\nThe chapters ahead take each thread in turn: the origins and the modern arc; the addressability stack, and how the targeting actually works; the players and market structure; ad impact and effectiveness, the contested core; money, strategy, and campaigns; regulation, privacy, and risk; and the drivers and forces shaping the whole. Closer looks follow on Inscape/Walmart, Fox–Roku, the Data Trust and i360, the buy-side practitioner's view, microtargeting harms, the measurement-currency war, platform policy, and the international comparison — and the outlook closes the account."}, {"order": 1, "file": "01_Origins_And_Modern_Arc.md", "title": "Origins and the Modern Arc: How U.S. Political TV Advertising Migrated to Connected TV", "summary": "", "body": "# 01 — Origins and the Modern Arc\n\n> **CTV (connected TV):** television content delivered over the internet to a smart TV or a streaming device (Roku, Fire TV, Apple TV) or app (Hulu, Tubi, Pluto), as opposed to content delivered over the air by a broadcast station or down a cable/satellite line. The defining feature here is not the screen — it is the *delivery path*. Internet delivery is what removes the ad from the FCC's reach and what makes voter-level targeting technically possible.\n\n## Bottom Line\n\nFrom 1952 onward, political television advertising rested on two fixed facts: the **broadcast spectrum is federally licensed**, and television was bought **market-by-market against Nielsen's Designated Market Areas (DMAs)** — the 210 geographic zones that group counties by which local stations they watch. Those two facts produced the entire legal and commercial architecture of political TV: the FCC's equal-time rule (47 U.S.C. § 315), reasonable access for federal candidates (§ 312(a)(7)), the lowest-unit-charge protection in the 45/60 days before an election, and the public \"political file\" that disclosed every buy. Connected TV breaks both facts at once. It travels over the internet, so **no spectrum license is involved and the FCC's authority does not reach it** [CRS R46516, 2020]. And it is bought against *people and households*, not DMAs, so the logic that justified market-by-market disclosure dissolves. The migration was not one event but a five-cycle ramp: CTV was effectively absent as a political line item in 2016, appeared as a discrete and fast-growing one in 2018, scaled in 2020, quintupled by 2022, and reached roughly **$2.3 billion in 2024 by AdImpact's final count — about 21% of the record ~$11.1 billion cycle and the second-largest medium after broadcast** (mid-cycle projections had pegged CTV near $1.5–1.56 billion, ~45% of *digital* political spend; the actuals ran higher) [AdImpact 2024; eMarketer 2024]. The plumbing for voter-level CTV targeting was assembled in a handful of contingent steps: smart-TV **automatic content recognition (ACR)** software shipping from ~2014; the **2017 Vizio FTC settlement** that forced ACR onto an opt-in consent footing — the legal precondition for the data being usable at all; the digitization and commercialization of the **voter file**; and the **November 2017 Comscore–L2 partnership** that productized a national-voter-file-to-TV-measurement fusion (building on earlier Rentrak and Nielsen efforts, not the first of its kind). None of this was inevitable. Had the FTC banned ACR rather than regularizing it, had the voter file stayed a party-controlled utility rather than a commercial product, or had Congress extended sponsor-identification law to internet-delivered video, the ecosystem would look materially different today.\n\n---\n\n## 1. The broadcast/cable era and the rules that shaped it\n\n**So what:** For seventy years the rules of political TV flowed from a single premise — that the airwaves are a public resource the government licenses — and from a single buying unit, the Nielsen DMA. CTV inherits neither. To see what CTV escaped, you first have to see what those rules *were* and *why they existed*.\n\n### 1.1 The spectrum bargain and Section 315\n\nThe American political-broadcasting regime begins with one bargain: broadcasters use a scarce public resource — the electromagnetic spectrum — under a federal license, and owe public-interest obligations in return. The framework descends directly from § 18 of the **Radio Act of 1927**, which created the Federal Radio Commission and first imposed an \"equal opportunities\" requirement on candidate broadcasts. That provision carried into the **Communications Act of 1934**, which replaced the FRC with the Federal Communications Commission (FCC) [Equal-Time Rule, MTSU First Amendment Encyclopedia; FCC, *The Public and Broadcasting*].\n\nThe operative rule today is **47 U.S.C. § 315(a)**, the \"equal opportunities\" or \"equal-time\" rule. Its language is spare: *\"If any licensee shall permit any person who is a legally qualified candidate for any public office to use a broadcasting station, he shall afford equal opportunities to all other such candidates for that office.\"* The same subsection strips the licensee of editorial control over candidate ads — *\"Such licensee shall have no power of censorship over the material broadcast under the provisions of this section\"* — which is why stations cannot reject a candidate's ad for being false or offensive [47 U.S.C. § 315, via Cornell LII]. The rule carries four statutory exemptions: a candidate's appearance on a *bona fide* newscast, news interview, news documentary, or on-the-spot coverage of a news event does not trigger equal-time obligations [47 U.S.C. § 315(a)(1)–(4)]. That is why a candidate can appear on a debate or in a news segment without the station owing free time to every rival.\n\n### 1.2 Reasonable access and the lowest unit charge\n\nTwo further pillars complete the broadcast regime. **Reasonable access** — **47 U.S.C. § 312(a)(7)** — requires commercial broadcast stations to sell *legally qualified federal candidates* reasonable amounts of time across all dayparts, prime time included; a station may not simply refuse a federal candidate [FCC, Political Programming policy page; Davis Wright Tremaine, 2024]. Note the asymmetry: reasonable access is a *federal-candidate* right. State and local candidates get equal-time protection under § 315 but no comparable right of access.\n\nThe **lowest unit charge (LUC)**, **47 U.S.C. § 315(b)**, caps what stations may charge candidates in the sensitive pre-election windows. The statute provides that during *\"the forty-five days preceding the date of a primary or primary runoff election and during the sixty days preceding the date of a general or special election,\"* a station's charge to a candidate *\"shall not exceed … the lowest unit charge of the station for the same class and amount of time for the same period\"* [47 U.S.C. § 315(b), via Cornell LII]. In plain terms: in the 45 days before a primary and the 60 days before a general election, a candidate gets the station's best volume-discount rate for that class of time — the \"most favored advertiser\" rate — even for a single spot. Outside those windows, candidates pay *\"the charges made for comparable use of such station by other users.\"* The LUC is a price control unique to candidate advertising. It does **not** reach party committees, super PACs, or issue advertisers — one reason outside groups often pay more than candidates for the same airtime.\n\n### 1.3 The political file and sponsorship identification\n\nThe transparency layer rests on two requirements. First, the **political file** (now the online public inspection file): broadcast stations, and to a lesser degree cable systems, DBS providers, and SDARS licensees, must publicly disclose every request to buy time by or on behalf of a legally qualified candidate, plus certain issue-ad requests touching a \"political matter of national importance\" — including the sponsor, the schedule of airtime, the rate charged, and the class of time, retained for two years and uploaded to the FCC's public database at publicfiles.fcc.gov [FCC Public Inspection Files; Wiley; Pillsbury, 2022]. Second, **sponsorship identification** under **47 U.S.C. § 317** and **47 CFR § 73.1212**: broadcast stations must disclose on air who paid for political and controversial-issue programming, and must keep a public list of the executives or board members of any entity furnishing such matter [CRS R46516, 2020; 47 CFR § 73.1212]. Sponsor-ID serves two stated FCC goals — to keep viewers from being *deceived* about who is speaking, and to protect *competition* among advertisers by stopping sponsors from passing paid messages off as editorial content [CRS R46516, 2020].\n\n### 1.4 How political TV was actually bought: the DMA\n\n**So what:** The commercial unit of political TV was geographic, not personal — the deepest structural break CTV introduces. A **Designated Market Area (DMA)** is a Nielsen-defined, non-overlapping region in which the local TV stations command the dominant share of viewing; there are **210 DMAs** covering the continental U.S., Hawaii, and parts of Alaska [Nielsen, \"What is a DMA,\" 2025]. The concept emerged in the 1950s as television markets proliferated and advertisers needed a standard way to define them by over-the-air signal reach and household viewing patterns [Nielsen, 2025]. For campaigns, the DMA was the planning atom. A campaign bought \"spot TV\" market by market, concentrating dollars in the DMAs that overlapped competitive districts and swing geographies, and swallowing the **spill** inherent in buying a whole metro to reach the slice of voters inside one district. A New Hampshire Senate race buying the Boston DMA paid to reach a vast Massachusetts audience that could not vote in it. That built-in inefficiency is exactly the friction household- and voter-level CTV targeting promises to remove — and that promise is the commercial engine of the entire migration these pages document.\n\n---\n\n## 2. The hinge: cord-cutting, fragmentation, and the digital-targeting inflection\n\n**So what:** Two independent forces converged in the 2010s. Audiences fragmented and then abandoned linear TV — the *supply-side* shock, fewer eyeballs reachable the old way — while campaigns learned to target individual voters with data, the *demand-side* shock, a hunger for precision the old way could not satisfy. CTV is where the two forces meet: a screen with linear TV's reach and digital's targeting.\n\n### 2.1 The audience leaves: cord-cutting and the streaming crossover\n\nU.S. pay-TV penetration peaked around **2010 at roughly 88% of households** and has declined steadily since. U.S. pay-TV providers have shed on the order of **25 million subscribers** over the decade-plus that followed, and by 2026 the share of households with traditional cable/satellite/telco TV had fallen below half [Statista; cablecompare.com, 2026; broadbandsearch.net]. *[Note: cord-cutting magnitudes are tracked by multiple trade trackers using differing definitions; the direction is uncontested and the most recent figures cited are Q1 2026, but exact subscriber counts vary by source.]* The viewing crossover arrived as a dated, primary-measured milestone: in **May 2025, streaming represented 44.8% of total U.S. TV usage and for the first time eclipsed the combined share of broadcast (20.1%) and cable (24.1%, totaling 44.2%)**, per Nielsen's monthly *The Gauge* report [Nielsen, \"Streaming Reaches Historic TV Milestone,\" 2025]. For campaigns the consequence is severe: a growing bloc of voters — Nielsen and others put the pure-streamer share around 30% of households — is *unreachable by linear TV at any price*. A medium that cannot reach a third of the electorate is one campaigns must supplement.\n\n### 2.2 The campaign learns to target: 2008 → 2012 → 2016\n\nThe demand-side story is the rise of data-driven targeting, and it predates CTV by a decade. **2008 (Obama):** the campaign matched its national voter file (via VoteBuilder/VAN) against online interactions, an email list of roughly **13 million**, and Facebook friend-graph data (more than a million supporters granting friend-list access) — an early fusion of the voter file with digital identity [phys.org, 2018; MIT Technology Review, 2018]. *(An earlier draft cited \"190 million active voters\" and \"~23 million emails\"; neither figure is supported by the cited secondary sources and both overstate the record — the documented 2008 Obama email list was ~13 million.)* **2012 (Obama re-elect):** the campaign scaled \"micro-targeting,\" modeling individual-level persuadability and turnout propensity and wiring it into media buying. **2016 (the Cambridge Analytica moment):** the inflection in *public consciousness*. Cambridge Analytica, working for the Trump campaign, harvested data on ~50 million Facebook users (collected via the \"This Is Your Digital Life\" app and friend-graph permissions) to build targeting profiles — a scandal that broke in March 2018 and became the defining symbol of data-driven political targeting [Facebook–Cambridge Analytica data scandal; phys.org, 2018]. Two cautions belong here, both well-established: (a) the *effectiveness* of psychographic micro-targeting was wildly overstated by the firm itself and is contested by researchers — the scandal's significance is as much narrative as mechanism; and (b) Obama-era data use and Cambridge Analytica were *not* equivalent in consent or method, a distinction multiple fact-checkers drew at the time [PolitiFact, 2018; NPR, 2018]. The durable point here is not who did what in 2016, but that **by 2016 the voter file had been fused with digital identity** as routine campaign practice. CTV is what happens when that fused identity is pointed at the television screen.\n\n### 2.3 Why the rules did not follow the audience\n\nAs audiences and ad dollars moved to internet-delivered video, the FCC's regime stayed pinned to spectrum and cable. CRS Report R46516 (2020) states the gap precisely: *\"When an entity other than an FCC licensee or cable operator delivers targeted political and issue advertising to TVs connected to the internet ('connected TVs'), sponsors need not disclose their identities to viewers.\"* The reason is jurisdictional — *\"the FCC has regulatory authority over media organizations that need its permission to use spectrum\"* — and internet-delivered video needs no such permission [CRS R46516, 2020]. The same report notes that *\"over the last decade, both traditional and nontraditional sellers of 'television' advertising have promoted the availability of 'targeted television advertising' to political and issue campaigns,\"* defined as enabling *\"different ads to be seen by different people who are watching the same program\"* — and that closing the disclosure gap *\"would [require Congress] to enact legislation applying disclosure laws to media and advertising technology entities that are not currently regulated by the FCC\"* [CRS R46516, 2020]. This is the regulatory arbitrage at the heart of the story: CTV is television that escaped television's rules.\n\n---\n\n## 3. The CTV-specific arc, cycle by cycle (2016 → 2024)\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 380\" role=\"img\" aria-label=\"Grouped column chart of U.S. political advertising spend by election cycle, comparing connected-TV (CTV) against broadcast television. CTV spend rises every cycle: 0.26 billion dollars in 2020, 1.09 billion in 2022, 2.34 billion in 2024 (the AdImpact final figure), and a projected 2.7 billion in 2026. Broadcast spend is far larger and roughly flat: about 5.35 billion dollars in 2024 and a projected 5.6 billion in 2026. CTV was about 21 percent of the 2024 cycle and the second-largest medium, and 2024 was the first presidential cycle in which broadcast fell below 50 percent of all political spending. The chart shows that CTV is the only major channel projected to grow over 2024, yet broadcast still roughly doubles it.\">\n  <text x=\"40\" y=\"30\" class=\"t-serif\" style=\"font-size:15px;letter-spacing:2px;font-weight:700\">THE ONLY LINE STILL CLIMBING<\/text>\n  <text x=\"40\" y=\"48\" class=\"t-muted\" style=\"font-size:10.5px;letter-spacing:.5px\">U.S. political ad spend by cycle — CTV vs. broadcast ($B)<\/text>\n  <g style=\"font-size:10px\">\n    <line x1=\"120\" y1=\"80\" x2=\"120\" y2=\"300\" class=\"ln-soft\"/>\n    <line x1=\"120\" y1=\"300\" x2=\"660\" y2=\"300\" class=\"ln\"/>\n    <line x1=\"120\" y1=\"245\" x2=\"660\" y2=\"245\" class=\"ln-soft\"/>\n    <line x1=\"120\" y1=\"190\" x2=\"660\" y2=\"190\" class=\"ln-soft\"/>\n    <line x1=\"120\" y1=\"135\" x2=\"660\" y2=\"135\" class=\"ln-soft\"/>\n    <text x=\"114\" y=\"303\" class=\"t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">0<\/text>\n    <text x=\"114\" y=\"248\" class=\"t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">2<\/text>\n    <text x=\"114\" y=\"193\" class=\"t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">4<\/text>\n    <text x=\"114\" y=\"138\" class=\"t-muted\" style=\"font-size:9.5px\" text-anchor=\"end\">6<\/text>\n  <\/g>\n  <g>\n    <rect x=\"158\" y=\"293\" width=\"34\" height=\"7\" style=\"fill:var(--accent)\" class=\"cv-grow-up\"/>\n    <text x=\"175\" y=\"287\" class=\"t-acc\" style=\"font-size:11px;font-weight:700\" text-anchor=\"middle\">$0.26B<\/text>\n    <text x=\"175\" y=\"316\" class=\"t-muted\" style=\"font-size:11px\" text-anchor=\"middle\">2020<\/text>\n  <\/g>\n  <g>\n    <rect x=\"288\" y=\"270\" width=\"34\" height=\"30\" style=\"fill:var(--accent)\" class=\"cv-grow-up\" />\n    <text x=\"305\" y=\"264\" class=\"t-acc\" style=\"font-size:11px;font-weight:700\" text-anchor=\"middle\">$1.09B<\/text>\n    <text x=\"305\" y=\"316\" class=\"t-muted\" style=\"font-size:11px\" text-anchor=\"middle\">2022<\/text>\n  <\/g>\n  <g>\n    <rect x=\"406\" y=\"236\" width=\"34\" height=\"64\" style=\"fill:var(--accent)\" class=\"cv-grow-up\"/>\n    <text x=\"423\" y=\"230\" class=\"t-acc\" style=\"font-size:13px;font-weight:700\" text-anchor=\"middle\">$2.34B<\/text>\n    <rect x=\"444\" y=\"153\" width=\"34\" height=\"147\" class=\"f-t1\" opacity=\"0.4\"/>\n    <rect x=\"444\" y=\"153\" width=\"34\" height=\"6\" class=\"f-t1\"/>\n    <text x=\"461\" y=\"147\" class=\"t-muted\" style=\"font-size:11px;font-weight:700\" text-anchor=\"middle\">$5.35B<\/text>\n    <text x=\"434\" y=\"316\" class=\"t-muted\" style=\"font-size:11px\" text-anchor=\"middle\">2024<\/text>\n  <\/g>\n  <g>\n    <rect x=\"544\" y=\"227\" width=\"34\" height=\"73\" style=\"fill:var(--accent)\" class=\"cv-grow-up\"/>\n    <text x=\"561\" y=\"221\" class=\"t-acc\" style=\"font-size:13px;font-weight:700\" text-anchor=\"middle\">$2.7B<\/text>\n    <rect x=\"582\" y=\"146\" width=\"34\" height=\"154\" class=\"f-t1\" opacity=\"0.4\"/>\n    <rect x=\"582\" y=\"146\" width=\"34\" height=\"6\" class=\"f-t1\"/>\n    <text x=\"599\" y=\"140\" class=\"t-muted\" style=\"font-size:11px;font-weight:700\" text-anchor=\"middle\">$5.6B<\/text>\n    <text x=\"580\" y=\"316\" class=\"t-muted\" style=\"font-size:11px\" text-anchor=\"middle\">2026<\/text>\n    <text x=\"580\" y=\"328\" class=\"t-acc\" style=\"font-size:9px;letter-spacing:.5px\" text-anchor=\"middle\">(proj.)<\/text>\n  <\/g>\n  <g>\n    <rect x=\"406\" y=\"338\" width=\"11\" height=\"11\" style=\"fill:var(--accent)\"/>\n    <text x=\"422\" y=\"347\" class=\"t-muted\" style=\"font-size:10px\">CTV — the hero, only channel still rising<\/text>\n    <rect x=\"406\" y=\"354\" width=\"11\" height=\"11\" class=\"f-t1\" opacity=\"0.4\"/>\n    <rect x=\"406\" y=\"354\" width=\"11\" height=\"3\" class=\"f-t1\"/>\n    <text x=\"422\" y=\"363\" class=\"t-muted\" style=\"font-size:10px\">Broadcast — the steady incumbent, ~2x CTV<\/text>\n  <\/g>\n  <text x=\"40\" y=\"347\" class=\"t-muted t-serif\" style=\"font-size:11px;font-style:italic\">CTV grew, broadcast held —<\/text>\n  <text x=\"40\" y=\"362\" class=\"t-muted t-serif\" style=\"font-size:11px;font-style:italic\">2024 was additive, not yet substitution.<\/text>\n  <text x=\"40\" y=\"376\" class=\"t-muted\" style=\"font-size:8.5px;letter-spacing:.5px\">Source: AdImpact (final 2024; June 2026 projection) · eMarketer.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 2.<\/strong> CTV is the only major political channel projected to grow over 2024, yet broadcast at ~$5.6B still roughly doubles it — the streaming surge is so far additive money on top of television, not a substitute for it.<\/figcaption>\n<\/figure>\n\n\n**So what:** CTV did not arrive; it *ramped* — steeply, and recently. The single most useful framing: CTV went from a rounding error in 2016 to roughly **45% of digital political spend in 2024**. But the denominators matter, and the trade press routinely conflates two different \"CTV share\" numbers.\n\n### 3.0 A note on two different \"share\" numbers (read this before the figures)\n\nTwo distinct ratios circulate, and confusing them produces apparent contradictions:\n- **CTV as a share of *digital* political spend:** ~**19% in 2020 → ~45% in 2024** [eMarketer, via MNTN 2024].\n- **CTV as a share of *all* political ad spend (every medium):** ~**2.7% in 2020 → ~13% in 2024** by eMarketer's accounting [eMarketer, via marketingbrew/Basis 2024]; AdImpact's parallel accounting put CTV at **~13% rising to ~14%** of the 2024 cycle total within its June-2024 projection [AdImpact, 2024].\n\nBoth can be true at once: CTV is nearly half of the *digital* slice but still a low-double-digit share of the *whole pie*, because broadcast still dominates the whole pie (see § 3.5). A source that says \"45%\" almost always means the digital denominator; \"13–14%\" means the all-media denominator. This account uses the all-media figure for cross-cycle comparison and flags the digital figure where used.\n\n### 3.1 2016 — effectively absent\n\nCTV was not a meaningful discrete political line item in 2016. The clearest contemporaneous marker comes from the SSP Telaria, which reported CTV at **~1% of political ad spend on its platform in 2016** [MediaPost, Nov. 2018]. 2016 was the *digital-targeting* inflection — Facebook, the data fusion of § 2.2 — not the *CTV* inflection. The two are often blurred. They are different.\n\n### 3.2 2018 — CTV appears as a discrete line item\n\nThe 2018 midterms mark the genuine birth of CTV as a recognized political channel. Telaria reported CTV jumping to **~30% of political ad spend on its platform (peaking at 37% in September), up from ~1% in 2016** [MediaPost, Nov. 2018]. *(A widely cited SpotX figure of \"+900%\" is sometimes attached to 2018; it actually belongs to the *2020* cycle — a >900% rise since April 2020, announced September 2020 — and has been removed here to avoid mis-dating the 2018 slope. The MediaPost Nov. 2018 source supports only the Telaria figures.)* These are *platform-specific* figures, and the platforms are CTV-heavy SSPs, so they overstate the market average — but the *direction and slope* are unambiguous. For all-medium context, Borrell Associates forecast 2018 total political ad spend at ~$8.8 billion [MediaPost, 2018]. CTV in 2018 was small in absolute dollars, yet it had become a line item buyers named, planned, and reported.\n\n### 3.3 2020 — scaling under pandemic streaming\n\n2020 combined three things: a presidential cycle, a pandemic that accelerated streaming adoption, and a maturing ad-tech stack. CTV's share of *digital* political spend reached **~19%** [eMarketer, via MNTN 2024], and eMarketer later pegged 2020 U.S. political CTV spend at roughly **$260 million** (the implied 2020 base behind its \"600% growth to 2024\" projection) [eMarketer, via The Current, June 2024]. Within the year, CTV political spend rose **>500% from the primary window (Feb–Jul) to the general (Aug–Nov)** — a sign of how tightly political CTV concentrates in the final stretch [Strategus; PointBlank]. The Biden campaign reserved a campaign-record **~$60 million in *digital* media** (within a ~$280 million fall reservation), a pool AdWeek described as *centering* on connected TV but also covering YouTube, ESPN, streaming audio/podcasts, and online gaming — so the $60M is the CTV-centered digital reservation, not a CTV-exclusive figure [AdWeek, Aug. 2020].\n\n### 3.4 2022 — the quintuple\n\nThe 2022 midterms saw CTV political spend run **roughly 5× the 2020 level**, a figure that recurs across buyers and trackers, with Kantar Media estimating **~$1.4 billion** in CTV/OTT political spend for the cycle [Marketing Brew, Oct. 2022]. *[The \"5×\" multiple is attributed in the source to unnamed media buyers, not a single named research firm; treat the multiple as directional and the $1.4B Kantar figure as the harder number.]* 2022 is when CTV stopped being a digital sub-tactic and became a TV line item buyers defended against broadcast.\n\n### 3.5 2024 — ~$1.5B, ~45% of digital, but broadcast still rules the pie\n\nThe 2024 cycle is the current high-water mark, and the best-documented. The convergent figures:\n- **CTV political spend: ~$1.5–1.56 billion as *projected* mid-cycle** (AdImpact's June-2024 projection $1.51B; eMarketer $1.56B) — but **actuals came in far higher: AdImpact's final post-election count put 2024-cycle political CTV spend at ~$2.3 billion**, roughly 21% of the record ~$11.1 billion cycle and the second-largest medium after broadcast [AdImpact, June 2024 (projection) and Dec. 2024 (final); eMarketer, June 2024]. The ~$2.3B actual — not the $1.5B projection — is the true 2024 high-water mark.\n- **CTV ≈ 45% of digital political spend**, up from ~19% in 2020 [eMarketer, via MNTN 2024].\n- **eMarketer: 2024 political CTV up ~600% vs. 2020** (~$260M → ~$1.56B) [eMarketer, via The Current, 2024].\n- **Total 2024 political ad spend: a record.** AdImpact projected **$10.69 billion** for the 2023–24 cycle (19% over the $9.02B 2019–20 cycle); eMarketer's broader accounting projected **$12.32 billion** (the two differ on what they count) [AdImpact, June 2024; eMarketer, June 2024].\n\nAnd the structural punchline: **broadcast still dominated**. AdImpact's June-2024 media-type breakdown of the *projected* $10.69B cycle ran **$5.35B broadcast (>50% of the projection), $1.93B cable, $1.51B CTV, $1.12B digital (Facebook + Google), $381M radio, $309M network cable, $102M satellite** [AdImpact, June 2024]. *In the final post-election tally the cycle came in at ~$11.1B and broadcast at ~$5.35B — about 48%, the first presidential cycle in which broadcast fell below half of total political spend.* AdImpact's own analysis stressed that CTV's growth came from *capturing a larger slice of an expanding pie rather than reallocation away from broadcast* — 2024 was additive, not yet a true substitution away from linear [AdImpact, June 2024]. The five-cycle arc, in one line: **~1% (2016, platform) → ~30% of one SSP's political spend (2018) → ~19% of digital (2020) → ~$1.1B / 5× (2022) → ~$2.3B actual, ~45% of digital and ~21% of all political (2024).**\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">U.S. political CTV ad spend by cycle ($ billions)<\/div><svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"60\" y1=\"250.0\" x2=\"686\" y2=\"250.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"254.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0<\/text><line x1=\"60\" y1=\"191.5\" x2=\"686\" y2=\"191.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"195.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">0.75<\/text><line x1=\"60\" y1=\"133.0\" x2=\"686\" y2=\"133.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"137.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">1.5<\/text><line x1=\"60\" y1=\"74.5\" x2=\"686\" y2=\"74.5\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"78.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">2.25<\/text><line x1=\"60\" y1=\"16.0\" x2=\"686\" y2=\"16.0\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"52\" y=\"20.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"end\">3<\/text><rect x=\"110.2\" y=\"229.7\" width=\"56.0\" height=\"20.3\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.00s\"/><text x=\"138.2\" y=\"223.7\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0.26B<\/text><text x=\"138.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 138.2 268.0)\">2020<\/text><rect x=\"266.8\" y=\"165.0\" width=\"56.0\" height=\"85.0\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.05s\"/><text x=\"294.8\" y=\"159.0\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">1.09B<\/text><text x=\"294.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 294.8 268.0)\">2022<\/text><rect x=\"423.2\" y=\"67.5\" width=\"56.0\" height=\"182.5\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.10s\"/><text x=\"451.2\" y=\"61.5\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2.34B<\/text><text x=\"451.2\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 451.2 268.0)\">2024<\/text><rect x=\"579.8\" y=\"39.4\" width=\"56.0\" height=\"210.6\" rx=\"3\" class=\"f-t1 cv-grow-up\" style=\"--d:0.15s\"/><text x=\"607.8\" y=\"33.4\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">2.7B<\/text><text x=\"607.8\" y=\"268.0\" font-size=\"12\" text-anchor=\"end\" transform=\"rotate(-35 607.8 268.0)\">2026 (proj.)<\/text><\/svg><figcaption>2026 is projected (AdImpact, June 2026 update); CTV is the only major channel projected to grow over the 2024 presidential cycle. <span class=\"credit\">Source: AdImpact / eMarketer via The Current — 2020 ~$0.26B, 2022 ~$1.09B, 2024 ~$2.34B (actual), 2026 ~$2.7B (proj.).<\/span><\/figcaption><\/figure>\n\n\n\n---\n\n## 4. The deals and standards that assembled the stack\n\n**So what:** Voter-level addressable TV required three things that did not exist together before the late 2010s: (a) a way for a TV to know *who is watching what* (ACR), made legally usable by a consent regime; (b) a commercial, matchable *voter file*; and (c) a *bridge* fusing voter data to TV-audience measurement. Each arrived through a specific, contingent decision — not by inevitability.\n\n### 4.1 ACR: software that watches what you watch\n\n**Automatic content recognition (ACR)** is software embedded in a smart TV (often at the chipset level) that identifies what is on screen — show, ad, game, live sport — by capturing a short audio/video clip, converting it to a digital **fingerprint**, and matching it against a reference library built by \"listening posts\" that continuously catalog broadcasts [AdExchanger, June 2019]. In practice the TV samples the screen on the order of every few seconds and ships the fingerprint, plus the device's **IP address, device ID, and a timestamp**, to the ACR vendor's servers over the home internet connection [AdExchanger, 2019; Wikipedia entry's cited descriptions corroborated against vendor docs]. The IP address is the hinge: it lets ACR viewing data be matched, via an identity graph, to a household and from there to a voter record. The technology's commercial origins trace to ~2011 (Flingo/Samba TV's video-ACR patents; Shazam extending audio fingerprinting to TV), and manufacturers integrated ACR through the 2010s [Wikipedia ACR entry's cited sources; Samba TV history]. By 2019, AdExchanger tallied opted-in/in-market ACR footprints roughly as: **Samsung Ads ~33M sets, Nielsen/Gracenote ~18.9M, Alphonso ~15M, Samba TV ~14.4M, Inscape/Vizio ~11.2M, Roku ~10M+** [AdExchanger, June 2019]. *[These are 2019 figures and have since grown and reshuffled — e.g., Vizio/Inscape is now Walmart-owned; Alphonso became part of LG Ad Solutions. Treated here as the historical baseline, not current scale.]*\n\n### 4.2 The 2017 Vizio FTC settlement: the contingent decision that made ACR legal-to-use\n\n**So what:** This is the single most underappreciated inflection point in the stack. ACR's *usability* for targeting was never a given — it turned on the FTC's choice to regularize the practice rather than prohibit it.\n\nOn **February 6, 2017**, Vizio agreed to pay **$2.2 million** to settle FTC and New Jersey charges that it had collected viewing histories from **~11 million smart TVs without consumers' knowledge or consent**. Vizio's ACR software, installed from February 2014 and **on by default**, tracked viewing **second-by-second**, collecting **>100 billion data points per day**, and Vizio shared the haul with third parties alongside **IP address, MAC addresses, and Wi-Fi access points** [FTC press release, Feb. 6, 2017, as summarized by Davis Wright Tremaine, WilmerHale, Alston & Bird]. The order's lasting effect was not the fine, which was modest, but the rule it set: the FTC treated **television viewing history as sensitive information requiring clear notice and affirmative opt-in consent**, and required Vizio to *\"prominently disclose and obtain affirmative express consent\"* for ACR data collection and sharing going forward [WilmerHale, 2017; FTC, 2017]. The contingency is stark. The FTC could have treated default-on ACR as an unfixable deceptive practice and chilled the whole category. Instead it set the terms — opt-in consent — under which ACR became a *permitted, productized* data source. Every smart-TV maker's ACR-driven ad business since runs on the consent footing this settlement defined. It is also why ACR vendors describe their footprints as \"opted-in sets.\"\n\n### 4.3 The voter file: from party utility to commercial product\n\nThe voter file — the master database of registered voters (name, address, party, vote history) enriched with modeled scores and consumer data — went from a fragmented party asset to a commercial product over roughly 2006–2016. On the Democratic side, **NGP VAN** became the DNC's national voter-data vendor under Howard Dean's chairmanship in the mid-2000s and has stayed the backbone tool across Democratic presidential campaigns (Obama, Clinton, Sanders, Biden) [NGP VAN; Overture Global]. **Catalist**, founded in **2006** by former Clinton staffers, built a large progressive data utility now covering the entire U.S. adult population (240M+ voting-age individuals) [Overture Global; Catalist via Reach]. On the Republican side, the RNC's **Data Trust** and the Koch network's **i360** built parallel infrastructure, with i360 openly aiming to become \"the NGP VAN of the right\" [Overture Global; Medium/Political Moneyball]. The move that mattered for CTV came next: a layer of *commercial* voter-data firms — **L2, TargetSmart, Aristotle**, alongside Catalist and i360 — productized the voter file as a *matchable* dataset that could be licensed to ad-tech and measurement firms, not just used by campaigns internally. That commercialization is the precondition for fusing the voter file with TV data. *[Note: NGP VAN, Catalist, i360, L2, TargetSmart, and Aristotle are described here from sources spanning 2016–2025; this account establishes the historical commercialization, not present-day ownership or product status.]*\n\n### 4.4 November 2017: Comscore–L2 fuses the voter file to TV measurement\n\n**So what:** This is a bridge moment for the whole story — an early productized fusion of a national voter file with TV-audience measurement, and a conceptual template for voter-level CTV targeting. *(It was not the first of its kind. Rentrak — which merged into Comscore in 2016 — had matched voter-file segments to its census TV-viewing data with i360 and with Targeted Victory in 2014, and Nielsen licensed \"Voter Ratings\" to Sinclair in 2015. The cited Nov. 2017 release claims no \"first\"; read the Comscore–L2 deal as the L2-specific national extension of that lineage, not the category's origin.)*\n\nOn **November 9, 2017**, the TV/digital measurement firm **Comscore** announced a partnership with political-data provider **L2** to integrate L2's national voter and demographic files into Comscore's television ratings measurement, letting clients target TV audiences by *\"demographics, voting characteristics, purchase behavior and interests\"* [Comscore press release, Nov. 9, 2017]. The release described L2's database as **265M+ adult consumer records** and claimed L2's political client base included *\"almost every presidential candidate during the 2016 cycle, along with PACs, associations and non-profits\"* and nearly 200 members of Congress [Comscore PR, 2017 — *company claim, not independently verified; cited as L2's self-description*]. The partnership later evolved: in **January 2022** Comscore and L2 launched **\"Comscore Predictive Audiences\"** voter segments — cookie-free segments that crosswalk L2 voter profiles (party, turnout likelihood, issue stances on vaccination, immigration, climate) to *\"privacy-friendly contextual signals,\"* explicitly pitched for a midterm year and the post-cookie environment [Comscore press release, Jan. 13, 2022 — *company claim*]. *[Note: \"Comscore Predictive Audiences\" with L2 voter data is documented as live via the Jan. 2022 launch release, the most recent confirmation available; whether it operates unchanged today is unconfirmed.]*\n\n### 4.5 The measurement spine: CMAG/Kantar/Vivvix and the Wesleyan Media Project\n\nThe independent record of *what political ads aired and where* — the dataset scholars use to check the industry's claims — runs through one commercial tracker and one academic project. The commercial firm **CMAG** (Campaign Media Analysis Group), later **Kantar Media/CMAG** and now **Vivvix/CMAG**, has tracked political ad airings across all 210 broadcast markets for decades. The **Wesleyan Media Project (WMP)**, founded in **2010** as successor to the **Wisconsin Advertising Project** (which ran 1998–2008), opens that CMAG tracking data to scholars and has become the non-partisan \"go-to\" source on the volume, sponsorship, and content of U.S. political advertising; it is led by Erika Franklin Fowler (Wesleyan), Michael Franz (Bowdoin), and Travis Ridout (Washington State) [Wesleyan Media Project, About/Project Background]. *[Note: WMP is described as currently operating per its own 2024–2025 site; CMAG's current brand is Vivvix — confirmed via WMP's 2024+ data-access page.]* The significance here: WMP/CMAG measure the *broadcast* record well, but CTV's targeted, internet-delivered ads are far harder to track. The measurement spine that disciplines broadcast claims is weakest exactly where CTV grows — which previews the effectiveness debate taken up later, in the chapter on ad impact and effectiveness.\n\n### 4.6 Platform self-governance fills the disclosure vacuum: Roku's political ad archive\n\nBecause the FCC's political-file regime does not reach CTV (§ 2.3), the only ad-transparency on streaming is what platforms volunteer. **Roku** launched a public-facing **political ad archive in September 2020**, disclosing the payer, campaign IDs, and creative; its guidelines state it may publicly disclose political-campaign details (content, who paid, agency, disclaimers, amounts spent, impressions, targeting criteria) for at least seven years, and as of **March 12, 2024** Roku Ads Manager lets verified political advertisers run ads subject to its political guidelines and identity verification [Roku Political Advertising Guidelines; Roku Help Center, 2024]. *[Note: Roku's political-ad archive and March-2024 self-serve political policy are confirmed live via Roku's own 2024 documentation; this is voluntary self-governance, not a legal mandate, and could change at the platform's discretion.]* The broader point: CTV's \"public file\" is a patchwork of voluntary platform archives of uneven completeness — a September 2020 Mozilla Foundation review called streaming political-ad transparency a \"Wild West\" [Mozilla Foundation, Sept. 22, 2020 — advocacy source; cited as position/critique, not neutral fact; Mozilla published distinct streaming-ad research again in 2024].\n\n---\n\n## 5. Inflection points: where it could have gone differently\n\nA short ledger of the contingent decisions, to carry into the outlook:\n\n1. **The FTC could have killed ACR (2017).** Treating default-on ACR as an unfixable deceptive practice, rather than imposing an opt-in cure, could have chilled the entire smart-TV data category. The opt-in settlement is what made ACR a *usable* targeting input [Claim 4.4–4.5].\n2. **Congress could have extended sponsor-ID to internet video (2020+).** CRS R46516 laid out exactly what legislation would be required. It was never enacted. CTV's disclosure gap is a *choice not made* [Claim 2.5–2.6].\n3. **The voter file could have stayed a party utility.** Had the file remained internal party infrastructure rather than a licensable commercial product (L2, TargetSmart, Catalist-as-vendor), the Comscore–L2 fusion would have had nothing to license [Claim 4.6–4.10].\n4. **Measurement could have kept pace.** The broadcast-era discipline of CMAG/WMP did not extend cleanly to targeted CTV; that lasting gap is what lets vendor effectiveness claims outrun independent verification (discussed later, in the chapter on ad impact and effectiveness).\n5. **The crossover was demographic destiny, not strategy.** Cord-cutting and the May-2025 streaming/linear crossover were exogenous to campaigns. Campaigns followed the audience; they did not create the shift [Claim 2.1–2.2].\n\nReverse any of the first three and the 2024 picture — voter-level addressable TV at ~$1.5B, largely unregulated — looks different. The migration was driven by audience physics, but its *shape* was set by regulatory and commercial choices that could have gone otherwise.\n\n---\n\n## Open Questions\n\n1. **What is the true 2020 CTV political dollar base?** Sources give ~$260M (eMarketer, back-derived from the 600% figure) but platform-level and methodology differences leave a wide band. The exact 2016/2018 absolute dollars are especially soft.\n2. **Did the Comscore–L2 Predictive Audiences product survive to 2026 unchanged?** Last hard confirmation is January 2022; current status is unconfirmed.\n3. **How complete is CTV ad transparency now?** Roku's archive is documented; the comprehensiveness and current status of other platforms' archives (Hulu/Disney, YouTube, Samsung, Vizio) is unestablished here.\n4. **What share of the \"5× in 2022\" and \"45% of digital in 2024\" figures is real spend vs. SSP/vendor self-reporting?** The CTV-heavy SSPs (Telaria, SpotX) overstate market averages; the independent (AdImpact/Kantar) figures are firmer but still proprietary.\n5. **Where exactly does cable's regulatory treatment sit relative to broadcast and CTV?** Cable carries *some* sponsor-ID and political-file duties but not the full § 315 regime; the precise boundary matters for the regulatory picture.\n6. **How much of the 2024 broadcast dominance is pre-booking inertia vs. genuine preference?** AdImpact flagged late-cycle broadcast scarcity pushing dollars to CTV — a supply dynamic, not a pure demand shift.\n\n---\n\n## Sources\n\n1. **47 U.S.C. § 315 — Candidates for public office.** Legal Information Institute, Cornell Law School (statutory text, accessed 2026-06-23). https://www.law.cornell.edu/uscode/text/47/315 — *Tier 1 (primary statute). Operative text of equal-time, news exemptions, and lowest-unit-charge with the 45/60-day windows.*\n2. **CRS Report R46516, \"Identifying TV Political and Issue Ad Sponsors in the Digital Age.\"** Congressional Research Service, Sept. 9, 2020 (accessed via EveryCRSReport, 2026-06-23). https://www.everycrsreport.com/reports/R46516.html — *Tier 1/2 (CRS, non-partisan). The authoritative statement of the FCC-jurisdiction gap on internet-delivered \"connected TV\" advertising.*\n3. **FCC, \"Political Programming\" policy page** and **\"The Public and Broadcasting.\"** Federal Communications Commission (accessed 2026-06-23). https://www.fcc.gov/media/policy/political-programming — *Tier 1 (regulator). Equal opportunities, reasonable access, LUC, political file, sponsor-ID overview.*\n4. **FCC Public Inspection Files / political file requirements.** publicfiles.fcc.gov; Pillsbury \"Public Inspection File Requirements\" (Sept. 2022); Wiley, \"FCC Clarifies Political File Rules.\" — *Tier 1/5. Political-file disclosure mechanics and retention.*\n5. **47 CFR § 73.1212 — Sponsorship identification.** Cornell LII (accessed 2026-06-23). https://www.law.cornell.edu/cfr/text/47/73.1212 — *Tier 1 (regulation). Sponsor-ID and executive-list requirements.*\n6. **Nielsen, \"Need to know: What is a DMA, and why does it matter?\"** (2025). https://www.nielsen.com/insights/2025/what-is-a-dma-and-why-does-it-matter/ — *Tier 5 (industry primary). DMA definition, count of 210, historical origin in the 1950s.*\n7. **AdImpact, \"Political Projection Report 2023–2024,\" data updated June 2024** (PDF, read directly). https://go.adimpact.com/hubfs/Reports/Political%202024/ADIMPACT_Political_Projections_Report_2024.pdf — *Tier 5 (specialist tracker, methodology disclosed). $10.69B cycle total; media-type breakdown ($5.35B broadcast, $1.93B cable, $1.51B CTV, $1.12B digital, etc.); 19% growth over $9.02B 2019–20 cycle; CTV 13%→14% of total.*\n8. **eMarketer figures via MNTN, \"45% of Digital Political Ad Spend in 2024 Will Go to CTV,\"** Feb. 2024. https://mountain.com/blog/45-of-digital-political-ad-spend-in-2024-will-go-to-ctv/ — *Tier 5 (vendor blog citing eMarketer). 19% (2020) → 45% (2024) CTV share of digital political spend; $1.5B 2024 CTV.*\n9. **The Current (The Trade Desk), \"U.S. political CTV ad spend projected to grow by 600%,\"** June 25, 2024. https://www.thecurrent.com/us-political-ctv-ad-spend-2024-presidential-election-cycle — *Tier 5 (vendor-affiliated, citing eMarketer). 600% growth 2020→2024; $1.56B 2024; ~$260M implied 2020 base; $12.32B total political 2024.*\n10. **eMarketer / marketingbrew + Basis,** \"Political ad spending on connected TV is 5x what it was in 2020,\" Marketing Brew, Oct. 6, 2022. https://www.marketingbrew.com/stories/2022/10/06/political-ad-spending-on-connected-tv-is-5x-what-it-was-in-2020 — *Tier 5. 2022 CTV ~5× 2020 (per unnamed buyers); Kantar ~$1.4B 2022 CTV/OTT estimate.*\n11. **MediaPost, \"Connected TV Political Ad Spend Soars,\"** Nov. 7, 2018; \"Connected TV Options For Political Advertisers,\" June 2018. https://www.mediapost.com/publications/article/327657/ — *Tier 5 (trade press). Telaria ~1% (2016) → ~30% (2018, peak 37%) of platform political spend; Borrell ~$8.8B 2018 total. Note: the \"SpotX +900%\" figure is a 2020-cycle figure (since April 2020, announced Sept. 2020), not 2018, and is not in this Nov. 2018 source.*\n12. **Comscore press release, \"comScore Announces Partnership with Leading Political Data Provider L2,\"** Nov. 9, 2017. https://www.comscore.com/Insights/Press-Releases/2017/11/comScore-Announces-Partnership-with-Leading-Political-Data-Provider-L2 — *Tier 1 for \"what the company claims,\" NOT for truth. The 2017 voter-file/TV-measurement fusion; 265M+ records; \"almost every presidential candidate\" 2016 claim.*\n13. **Comscore press release, \"Comscore and L2, Inc. Launch First of Its Kind Cookie-free Audiences,\"** Jan. 13, 2022. https://www.comscore.com/Insights/Press-Releases/2022/1/ — *Tier 1 (company claim). Predictive Audiences voter segments; cookie-free contextual crosswalk to L2 data.*\n14. **AdExchanger, \"The Marketer's Guide To ACR Tech In Smart TVs,\"** June 26, 2019. https://www.adexchanger.com/ad-exchange-news/the-marketers-guide-to-acr-tech-in-smart-tvs/ — *Tier 5 (specialist trade press). ACR mechanism (fingerprint/listening posts); 2019 opted-in footprints by vendor; limitations (Netflix/Prime block ACR, ~30% unmatched).*\n15. **FTC press release, \"VIZIO to Pay $2.2 Million … Collected Viewing Histories on 11 Million Smart Televisions without Users' Consent,\"** Feb. 6, 2017 — summarized via WilmerHale, Davis Wright Tremaine, Alston & Bird, Kelley Drye (FTC direct URL returned 403; relied on Tier-5 law-firm summaries quoting the order). https://www.ftc.gov/news-events/news/press-releases/2017/02/vizio-pay-22-million-ftc-state-new-jersey — *Tier 1 (enforcement action) via Tier 5 summaries. $2.2M; 11M TVs; second-by-second, 100B data points/day; viewing history = sensitive info requiring opt-in.*\n16. **Nielsen, \"Streaming Reaches Historic TV Milestone, Eclipses Combined Broadcast and Cable Viewing For First Time,\"** 2025 (May 2025 Gauge). https://www.nielsen.com/news-center/2025/ — *Tier 5 (measurement primary). Streaming 44.8% vs. broadcast 20.1% + cable 24.1% in May 2025.*\n17. **Cord-cutting trackers:** Statista \"Cord-cutting in the United States\"; cablecompare.com (2026); broadbandsearch.net. — *Tier 5 (aggregated industry stats). ~88% pay-TV peak 2010; ~25M subs shed; <50% penetration by 2026. Magnitudes vary by source; direction uncontested.*\n18. **Wesleyan Media Project — About / Project Background / Data Access.** Wesleyan University (2024–2025). https://mediaproject.wesleyan.edu/about/ — *Tier 2 (academic). Founded 2010; successor to Wisconsin Advertising Project (1998–2008); uses Vivvix/CMAG (formerly Kantar/CMAG) tracking; leadership Fowler/Franz/Ridout.*\n19. **Phys.org, \"Facebook as an election weapon, from Obama to Trump,\"** Mar. 2018; **MIT Technology Review, \"US election campaign technology from 2008 to 2018,\"** Aug. 22, 2018. — *Tier 4/5. Obama 2008/2012 voter-file/digital-identity fusion (documented ~13M 2008 email list); micro-targeting scaling. Note: this secondary source does not support the \"190M voters / 23M emails\" figures an earlier draft drew from it.*\n20. **Facebook–Cambridge Analytica scandal coverage:** PolitiFact (Mar. 22, 2018); NPR (Mar. 25, 2018). — *Tier 4. ~50M Facebook users; the 2016 data-targeting narrative inflection; Obama-vs-CA distinction.*\n21. **Voter-file history:** Overture Global, \"The Secret Power of Political Data Trusts\"; Catalist via Reach knowledge base; Medium/Political Moneyball, \"The Fight Over Political Data: RNC vs. i360.\" — *Tier 5/6 (analytical/explanatory). Catalist founded 2006; NGP VAN as DNC vendor; i360/Data Trust on the right.*\n22. **Roku Political Advertising Guidelines / Roku Self Serve Help Center \"Political ads,\"** 2024; Mozilla Foundation, \"Streaming Platforms are a Wild West of Political Ads,\" Sept. 22, 2020. https://advertising.roku.com/roku-s-political-ad-archive — *Tier 1 (Roku policy, company claim) + Tier 6 (Mozilla advocacy, cited as critique). Roku archive launched Sept. 2020; self-serve political since Mar. 12, 2024; 7-year disclosure. The Mozilla \"Wild West\" framing is from its Sept. 2020 report.*\n23. **Equal-Time Rule, MTSU First Amendment Encyclopedia**; **Davis Wright Tremaine, \"Broadcasters: The 2024 Election…\"** (Apr. 2024). — *Tier 2/5. Radio Act 1927 → Communications Act 1934 lineage; reasonable-access mechanics.*\n24. **Smithsonian / Library of Congress / Living Room Candidate** on 1952 Eisenhower spots and 1964 \"Daisy.\" — *Tier 2/5. Historical anchor for the birth of political TV advertising (context for § 1).*"}, {"order": 2, "file": "02_The_Addressability_Stack.md", "title": "The Addressability Stack: How Voter-Level Connected-TV Targeting Actually Works", "summary": "", "body": "# The Addressability Stack: How Voter-Level Connected-TV Targeting Actually Works\n\n## Bottom Line\n\nA modern political campaign can put a thirty-second streaming spot in front of one specific household — say, *likely-Republican but infrequent-voting households in Pennsylvania's 7th congressional district* — and later check whether the people in that household turned out to vote. This is neither magic nor a single product. It is a five-layer plumbing stack, each layer run by a named set of vendors, that converts a public state voter-registration record into an addressable television impression and then back into a measured outcome.\n\nThe five layers are: **(1) the glass** — automatic content recognition (ACR) data from smart-TV makers (Roku, LG, Vizio/Inscape, Samsung) that reports what roughly 100M+ U.S. households actually watch; **(2) the voter file** — a continuously-rebuilt national database of every registered voter (L2, TargetSmart, Catalist on the Democratic side; i360 and the GOP's Data Trust on the Republican side; Aristotle non-partisan), carrying registration, public vote history, party, and *modeled* scores for partisanship, turnout, and issues; **(3) the match/identity layer** — the onboarding and identity-graph machinery (LiveRamp's RampID, Experian's graph, hashed email \"HEM,\" IP-to-household links, mobile ad IDs, and privacy-safe data clean rooms) that turns a name-and-address record into a device a TV ad can reach, at household match rates that vendors put at 50–90%; **(4) the audience layer** — productized political segments (Comscore Predictive Audiences powered by L2 from 2022; the Comscore × Yahoo DSP \"Proximic Political Audiences\" launched March 2026) that package \"likely-R infrequent voter, PA-07\" into a buyable line item inside a demand-side platform (DSP); and **(5) measurement** — matching ad exposure logs back to voter-file turnout to claim lift.\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">The five-layer addressability stack: a public voter record → a measured TV impression<\/div><div class=\"viz-flow\"><span class=\"flowstep cv-fade\" style=\"--d:0.00s\">Voter file (L2 / i360 / TargetSmart / Catalist): registration + vote history + modeled scores<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.08s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.16s\">Match / identity (LiveRamp, hashed email, IP-to-household, clean rooms): 50–90% claimed match<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.24s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.32s\">Audience segment (Comscore×L2; Proximic) packaged into a DSP<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.40s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.48s\">Smart-TV ACR glass (Roku / LG / Vizio / Samsung) delivers the impression<\/span><span class=\"flowarrow cv-fade\" style=\"--d:0.56s\">→<\/span><span class=\"flowstep cv-fade\" style=\"--d:0.64s\">Measurement: match exposure back to voter-file turnout to claim lift<\/span><\/div><figcaption>Each layer is run by a named set of vendors; the output is household-level, partially-matched, partially-modeled — not literal voter-level precision.<\/figcaption><\/figure>\n\n\n\nTwo cautions run through the whole stack and should travel with every number in it. First, **almost every scale and accuracy figure here is a vendor claim** — the 100M+ households, the 90%+ match rates, the deterministic-ACR boasts — and where independent academic work exists (Pew's audit of five commercial voter files), it finds modeled party affiliation correct only about two-thirds of the time. Second, **the stack's status is a moving target**: its largest piece of inventory, Roku, is the subject of a pending $22B Fox acquisition announced June 15, 2026 but not yet closed; Vizio's ACR engine Inscape is now Walmart-owned; the clean-room vendor field consolidated hard in 2024–25. Present-tense claims about who owns and operates each layer are exactly what goes stale, and they are flagged as such below.\n\n---\n\n## How to read what follows\n\nThis is the technical heart of the machine. The goal is to decode *everything* in plain language, then quantify it. Each of the five sections takes one layer of the stack, answers \"what is this, in one sentence,\" names the dominant vendors, decodes every acronym on first use, and gives the best-sourced footprint number available — always labeled as vendor claim or independent finding.\n\nA single worked example threads the whole account. Follow one fictional-but-representative target — **\"likely-Republican infrequent voters in PA-07\"** — from a row in a state voter file all the way to a streaming impression and a turnout report. Understand how that one segment gets built and delivered, and you understand the machine.\n\nA note on two foundational acronyms used throughout:\n\n- **CTV** — *connected TV*. Any television receiving video over the internet rather than over the air, cable, or satellite: a smart TV running its own operating system, or a \"dumb\" TV with a streaming stick/box (Roku, Fire TV, Apple TV) or game console plugged in. CTV is where addressable political TV lives, because internet delivery lets each household be served, in principle, a *different* ad.\n- **DSP** — *demand-side platform*. The software a campaign or its agency logs into to buy ads programmatically (automatically, via real-time auction) across many publishers at once. It is the cockpit. The targeting segments built in Layer 4 load into the DSP; the DSP buys the matched CTV impressions described in Layers 1 and 3. Major DSPs in political CTV include The Trade Desk, Madhive, Viant, Yahoo DSP, and Democratic-specialist DSPolitical's \"Deploy.\"\n\n---\n\n## Layer 1 — The Glass: Smart-TV ACR Data\n\n**One sentence:** ACR is software baked into a smart TV (or streaming OS) that takes rapid snapshots of whatever is on the screen, matches them against a content database, and produces a household-level log of exactly what that TV watched — across cable, streaming apps, game consoles, and antenna — which is then sold as audience and measurement data.\n\n**ACR decoded — *automatic content recognition*.** Unlike a streaming app, the TV does not \"know\" what it is showing. So the manufacturer's ACR software fingerprints the picture itself. Roku's published description says its ACR \"captures video snapshots approximately twice per second,\" scans them against \"a database of content and ads, which allows the exposure to be matched to what is airing,\" then pairs the result with the user's profile and aggregates it to strip personally identifiable details before it reaches advertisers [1]. One technical/academic account puts Roku's sampling at roughly 7,200 image samples per hour and notes it captures everything on the screen, \"including cable or satellite boxes, game consoles, and over-the-air signals\" [2]. Here is the crucial property: ACR sees *linear* (traditional broadcast/cable) viewing that streaming-app data alone is blind to. It is the only sensor in the house that watches the Fox News broadcast and the Hulu stream on the same panel.\n\n### Device/OS ACR vs. app-level data — the distinction that matters\n\nPeople loosely call two very different things \"viewing data,\" and conflating them is the single most common error in this market:\n\n- **Device/OS-level ACR (\"glass-level,\" \"deterministic content recognition\"):** the manufacturer, sitting at the TV operating system, sees *all* content on the panel regardless of source — antenna, cable box, every app. Samsung calls its data \"glass-level content recognition…from linear TV, OTT, set-top boxes and gaming environments\" [3]. LG describes ACR data \"at the glass level\" across \"linear TV and OTT on LG Smart TVs\" [4]. This is the valuable, hard-to-replicate asset, because only the TV maker sits at the glass.\n- **App-level data:** what a single streaming application (Hulu, Netflix, YouTube, a FAST channel) knows about its *own* logged-in users inside its *own* app. Rich within the walled garden, blind outside it. Hulu can build precise audiences of Hulu viewers; it cannot see what that household did on antenna or on a rival app.\n\nACR's pitch to political buyers is precisely that cross-source visibility: it knows a household watches local-news linear *and* streams, so a campaign can find linear-only voters missing from streaming and add incremental reach. (*OTT — \"over the top\" — is an older near-synonym for streaming video delivered \"over the top\" of the internet, i.e., bypassing the cable bundle.* *FAST — \"free ad-supported streaming TV\" — the always-on, channel-style free streaming services like Roku Channel, Samsung TV Plus, Tubi, Pluto.*)\n\n### The four ACR footprints (vendor-claimed scale)\n\n| Platform | ACR / smart-TV data asset | Claimed footprint | Ownership status | Source |\n|---|---|---|---|---|\n| **Roku** | OS-level ACR; #1 U.S. TV OS; Roku-branded TVs + streaming players | **100M+ global streaming households** (milestone announced April 2026; prior 90M Jan 2025) | Independent public company — **pending $22B Fox acquisition announced Jun 15 2026, not yet closed (expected 1H 2027)** | [5][6][7][13] |\n| **LG Ad Solutions** | First-party ACR via webOS; a4/Alphonso heritage | **~200M LG smart TVs globally**; deterministic ACR feed from **~33M opted-in LG TVs** (Databricks Marketplace) | Owned by LG Electronics; absorbed Alphonso (acquired 2021) → \"LG Ad Solutions\" | [4][8] |\n| **Vizio / Inscape** | Inscape ACR engine; SmartCast OS | **19M+ SmartCast active accounts** (~quarter of U.S. smart-TV share, per AdExchanger) | **Walmart-owned** — acquisition completed Dec 3 2024 (~$2.3B) | [9][10][11] |\n| **Samsung Ads** | Proprietary glass-level ACR; Samsung TV Plus (FAST) | **77M active Samsung smart TVs** drawn on for ACR; up to **16 months** of viewing history; ARF \"Dash\" study (Aug 2025) put Samsung ad reach at **~45.5M** smart-TV households | Owned by Samsung Electronics | [3][12] |\n\nDecoding the heritage names: **Alphonso** was an ACR/TV-data startup; LG bought it and folded it into what is now **LG Ad Solutions** — \"a4\" was an earlier LG/Altice-lineage advanced-advertising brand in the same family. **Inscape** is Vizio's ACR data subsidiary — the engine, distinct from the Vizio TV brand — and the asset Walmart most wanted. Keep the layers straight: *Vizio* is the TV brand, *SmartCast* its operating system, *Inscape* the ACR data business, *Walmart* now the owner.\n\n**Ownership flags for Layer 1.** Two of the four footprints changed hands, or are changing hands, as of mid-2026. Vizio/Inscape is *already* a Walmart asset (closed Dec 2024) [9]. Roku's data — the single largest CTV footprint in U.S. politics — is under a *pending* Fox deal; as of June 23, 2026 Roku is still a standalone public company, and Fox has stated Roku \"will continue to operate as a standalone platform,\" with close expected in the first half of 2027 [5][13]. Any sentence that says \"Fox owns Roku's ACR data\" is, today, false-by-a-year. Treat Roku's footprint as live and independent now, with a known pending change of control.\n\nA second caution: the ACR footprints are *manufacturer claims*, and \"households\" sometimes means global, sometimes U.S., sometimes \"active accounts,\" sometimes \"ad-reachable.\" LG's headline 200M is *global TVs*; its *deterministic opted-in* feed is an order of magnitude smaller (~33M) [8]. Samsung's 77M-TV asset and its ~45.5M ad-reach figure are not the same number [3][12]. The honest read: each major TV OS sees tens of millions of U.S. households at the glass, but precise, comparable, opt-in-adjusted U.S. counts are not publicly standardized.\n\n---\n\n## Layer 2 — The Voter File: The Spine of Political Addressability\n\n**One sentence:** A \"voter file\" is a continuously-updated commercial database that starts from the public voter-registration rolls of all 50 states, standardizes them into one national format, appends public vote history and purchased commercial/consumer data, and layers on *modeled* predictive scores — and it is the spine to which every other layer attaches.\n\nThis is what makes *political* CTV different from ordinary CTV. Commercial advertisers target \"adults 25–54 who buy trucks.\" Campaigns target *named, registered individuals*: known addresses, known party registration where states record it, known past turnout, and probabilistic scores for everything else. The voter file is the join key.\n\n### What is actually in a voter file\n\nThree strata, in order of certainty:\n\n1. **The public registration record (highest certainty).** Comes straight from state/county election offices. Nearly every state publicly reports each registered voter's name, address, age, and gender; some also report self-identified race; some — the \"party-registration\" states — record the voter's party. This layer is *fact*, not model — it is government data [14][16].\n2. **Public vote history (high certainty).** *Who* you voted for is secret; *whether and how* you voted — in-person, early, by mail, in which elections — is public record that states release. Vendors append a per-person turnout history: \"voted 2020 general, 2022 general, skipped 2018, skipped all primaries.\" L2 alone reports **2.3 billion voter-history records** behind its file [15][16].\n3. **Appended commercial data + modeled scores (modeled — treat as probabilistic).** Vendors merge the registration spine with purchased consumer data (from credit bureaus, telecoms, retail), then run predictive models to generate *scores*: a partisanship score, a turnout-propensity score, issue-position scores (how a voter likely feels about the economy, the environment, abortion), ideology, religion, even modeled race/ethnicity where not self-reported [14][16]. **These are estimates, not facts**, and their accuracy is the contested heart of Layer 2 (see \"How accurate,\" below).\n\n### The dominant voter-file vendors (claimed scale + alignment)\n\n| Vendor | Alignment | Claimed scale | Notable | Source |\n|---|---|---|---|---|\n| **L2** | Non-partisan commercial; sells to all | Every U.S. registered voter; **200M+ voters, 2.3B vote-history records, 250M+ consumer records**; updated ~semi-annually | The data engine behind Comscore Predictive Audiences | [15][16] |\n| **TargetSmart** | Democratic-aligned | \"Most accurate, up-to-date\" file for all 50 states + DC; vote history, race/ethnicity fields, \"dozens of model scores\" | Runs a public voter-registration & early-vote dashboard | [16][17] |\n| **Catalist** | Democratic / progressive **only** — \"We do no commercial work\" | Entire U.S. adult population (**240M+ voting-age**); records \"going back over 20 years,\" built from \"hundreds of voter files\" | Founded 2006 by former Clinton staffers; movement infrastructure | [16][18][19] |\n| **i360** | Republican-aligned (Koch-backed) | **250M+ adults (18+), 190M+ registered voters; up to 1,800 data points per record** | Founded by Michael Palmer (McCain '08 CTO); merged Koch \"Themis\" project | [16][20][21] |\n| **GOP Data Trust** | Republican Party core infrastructure | **300M+ individuals, 2,500+ data points each**; supported **5,000+ GOP campaigns** in 2024 | Founded 2011; the RNC-aligned shared file; exchanges with i360 since 2014 | [20] |\n| **Aristotle** | Non-partisan (\"both sides of the aisle\") | **National Voter File 235M+ registered voters**, sourced from **4,000+ election boards**; all 50 states + DC | Founded 1983; oldest in the business; also campaign-compliance software | [22] |\n\n### The party data ecosystems — co-ops vs. trusts\n\nThe single most important structural fact about the voter file: **the two parties run parallel, largely sealed data ecosystems**.\n\n- **Republican side — the \"Data Trust\" model.** The GOP **Data Trust** is the party's core shared voter database; **i360** (Koch-funded) is a second large Republican data engine. The two have *exchanged* data since 2014, building a deep, deliberately-integrated conservative data asset [20][21]. Data Trust reports supporting 5,000+ Republican campaigns in the 2024 cycle [20].\n- **Democratic side — the co-op model.** **NGP VAN** is the dominant Democratic campaign software/voter-contact platform; **Catalist** is the progressive-movement data store (commercial-work-free by policy) [18][19]; the **Democratic Data Exchange (DDx)** is a members-only co-op where campaigns contribute and draw data [20]. Democratic infrastructure arrived historically *later* and stayed *more fragmented* than the Republican Data Trust — a recurring theme in trade coverage [20].\n\n**Aristotle** and **L2** sit outside both: non-partisan commercial vendors that sell the underlying file to anyone. That is why **L2** can power a neutral product like Comscore Predictive Audience
