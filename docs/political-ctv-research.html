s while **Catalist** and **i360** cannot — one is progressive-only, the other Koch-aligned [16][18].\n\n### How accurate is the voter file? (the independent check)\n\nHere it is essential to separate vendor claims from independent evidence. Vendors describe their files with words like \"most accurate.\" The best *independent* audit is **Pew Research Center's 2018 study**, which tested **five commercial vendor files** against a panel whose actual party and turnout Pew already knew:\n\n- **Modeled party affiliation matched self-reported party for about two-thirds of people on average (67%).** Across the five files individually, correct classification ranged from **76% down to 59%** [23][24].\n- Files were **better at identifying Democrats than Republicans** — one file correctly classified **85% of Democrats but only 70% of Republicans** [23].\n- Modeled scores were **better at predicting party and race than education or income** [24].\n- On registration, **34% of people who said they were *not* registered nonetheless had a registration record on at least one file** — i.e., stale/duplicate records inflate the rolls [23].\n- Self-reported turnout exceeded the voter-file estimate by **4–13 points** across vendors — but that gap largely reflects *survey* over-reporting, and adding voter-file turnout history actually *improved* turnout models in other academic work [23][25].\n\n**The caveat that runs through everything here:** the registration and vote-history strata are government fact; the *modeled* strata that campaigns use to define persuasion targets are right roughly two-thirds of the time on party, and worse on softer attributes. When a vendor sells a CTV audience of \"likely-Republican infrequent voters,\" the \"infrequent voter\" half (turnout history) is solid public record; the \"likely-Republican\" half is a model with a real error rate. Layer-4 audiences inherit that uncertainty.\n\n---\n\n## Layer 3 — The Match / Identity Layer: Turning a Voter Into a Reachable TV\n\n**One sentence:** This is the connective tissue that takes a voter-file row (name, address, maybe a hashed email) and resolves it to the *devices* in that household — a CTV ID, an IP address, mobile ad IDs — so that an ad can actually be delivered to it, performed inside privacy-controlled environments by identity vendors (LiveRamp, Experian, TransUnion) and \"data clean rooms.\"\n\nA voter-file row is useless to a streaming ad server on its own; the ad server traffics in device identifiers, not names. Layer 3 is the translation. Five mechanisms, decoded:\n\n### The match mechanisms, decoded\n\n- **PII onboarding.** *PII — personally identifiable information* (name, postal address, email). \"Onboarding\" means converting that offline PII into online, ad-targetable identifiers. The dominant onboarder is **LiveRamp**, whose **RampID** is a \"persistent pseudonymous identifier for persons and households\" — it ingests PII and outputs a stable, privacy-pseudonymized ID that ad platforms can target without seeing the underlying name [26][27].\n- **HEM — hashed email.** Rather than pass a raw email, the system passes a one-way cryptographic *hash* of it — a scrambled fixed-length string. Two parties who both hash the same email get the same string and can match on it *without either revealing the address*. HEM is a primary match key across the industry; LiveRamp notes HEMs and MAIDs can ride in the same dataset alongside raw PII for resolution [26][28].\n- **MAID — mobile advertising ID.** The resettable advertising identifier on a phone (Apple's IDFA, Google's GAID). Because a phone and a TV often share a home Wi-Fi network and an IP address, matching a voter to their MAID helps tie them to the household — and to the CTV in it [28][29].\n- **IP-to-household graph.** A household's internet connection has an IP address, and all its devices — the smart TV, the phones, the laptop — usually share it. An identity vendor maintains a graph linking IP → physical household → the people and devices there. This is how a *postal address* on a voter file becomes a *streaming impression*: address → household → IP → the CTV on that IP. **Experian's Digital Graph** links \"cookies, MAIDs, CTV IDs, UID2, ID5 IDs and IP addresses to households and individuals,\" built from \"trillions of real-time data points,\" and reports an identity graph of **126M U.S. households, 250M individuals, and 4B+ active digital IDs** [29][30].\n- **AbiliTec / householding.** LiveRamp's **AbiliTec** algorithm groups individual touchpoints \"into households if they are seen consistently living together over time\" [27]. This is why CTV matches are usually *household-level*: a single TV serves everyone at the address, so the unit of targeting is the home — and a home may contain several registered voters [31].\n\n### Data clean rooms — the privacy-safe matching room\n\n**One sentence:** A *data clean room* is a secure, neutral computing environment where two parties (say, a campaign's voter list and a streaming publisher's viewer logs) can be matched against each other to find the overlap — without either side ever seeing the other's raw, person-level records; only aggregate or matched-but-pseudonymized results come out.\n\nIn plain mechanics: the campaign loads its onboarded voter audience; the publisher loads its logged-in/ACR audience; the clean room computes the overlap on common keys (RampID, HEM, IP) and returns *which pseudonymous IDs to target* or *how many matched* — never the raw lists [31][32]. This is the privacy story the entire stack leans on: \"we never share the actual voter file; we only match it in a clean room.\"\n\nThe clean-room vendor field, and its **2024–25 consolidation**:\n\n- **LiveRamp Clean Room** — cloud-native, works across AWS, Azure, GCP, Snowflake, Databricks; **LiveRamp acquired clean-room rival Habu in 2024**, consolidating the field [31][32].\n- **Snowflake** and **AWS Clean Rooms** — the hyperscaler/data-cloud native clean rooms, increasingly offering free or low-cost tiers [32].\n- **InfoSum** — independent clean-room vendor **acquired by WPP/GroupM in April 2025**, removing another neutral option [32].\n\nThe consolidation matters politically. As neutral clean rooms get absorbed into ad-holding companies and hyperscalers, the number of truly independent venues to match voter data shrinks [32].\n\n### Match rates — the number that decides reach (vendor-claimed)\n\nThe match rate is how much of an onboarded voter audience resolves to reachable devices. Trade/vendor sources put it at:\n\n- **50–70%** for clean voter files (name/address only), **up to 80%+** with phone/email keys, **70–80%** for email-based matching alone, and **85–90%+** in the best cases with multiple match keys on recently-updated files [29][31]. Democratic specialist **DSPolitical** claims **90%+** match rates using \"multiple onboarders\" [33].\n- Experian reports a DSP case study hitting an **84% synced-ID rate and a 9% match-rate lift** using its Digital Graph [30].\n\n**Honest read:** these are vendor/trade figures with no independent audit comparable to Pew's voter-file study. A realistic central estimate: a *clean* name-and-address voter audience resolves to roughly half to two-thirds of households on CTV, rising toward 80–90% only when email/phone keys are present and the file is fresh. Match rate is *household-level*, so individual-voter reach can run higher — multiple voters per home — but also less precise, since the ad reaches everyone in the home, not just the targeted voter [31].\n\n---\n\n## Layer 4 — The Audience Layer: Packaging \"Likely-R Infrequent Voters in PA-07\"\n\n**One sentence:** This layer turns the voter file plus models into *productized, buyable audience segments* — a named line item like \"Persuadable independents, abortion-salient, OH-13\" — that is pushed into a DSP so a buyer can simply select it and run CTV ads against it.\n\nLayers 2 and 3 produce raw capability; Layer 4 productizes it. Two anchor products define the *cookie-free, privacy-forward* approach that now dominates political CTV (cookie-free matters because third-party cookies are deprecated, and never existed on TVs anyway):\n\n### Comscore Predictive Audiences powered by L2 (since 2022)\n\nIn **January 2022**, **Comscore** (a TV/cross-platform measurement firm) and **L2** (the non-partisan voter-file vendor) launched what they billed as first-of-its-kind **cookie-free political audiences** for targeting across digital, mobile, and CTV inventory, \"available in all leading DSPs\" ahead of the 2022 midterms [34][35]. Mechanics:\n\n- **L2 supplies the voter behavior** — registration, vote history, modeled partisanship/issue scores.\n- **Comscore's \"Predictive Audiences\"** methodology turns those into **cookie-free, privacy-safe** segments — reportedly **100+ issue and behavior segments**, including modeled feelings on the economy, the environment, named candidates, ideology, and vote propensity [34][35].\n- Comscore claims (vendor) the predictive approach is *cheaper* than user-ID-based targeting at comparable performance in case studies [34].\n\nThis is the canonical example of the segment \"likely-Republican infrequent voter in PA-07\" becoming a buyable thing: L2 tags the voters, Comscore packages them cookie-free, the DSP serves them. Note this is a **2022-launched product** — its *current* operating status in 2026 should be re-confirmed (see Open Questions), though Comscore's broader Proximic predictive-audience line remains active and was extended in 2025–26 [36].\n\n### Comscore × Yahoo DSP — \"Proximic Political Audiences\" (launched March 2026)\n\nThe most recent and most current audience product: on **March 5, 2026**, **Comscore** and **Yahoo DSP** announced **Proximic Political Audiences** for the 2026 U.S. cycle (House, Senate, gubernatorial) [37][38]. Mechanics, per the announcement:\n\n- Combines **Comscore's MRC-accredited linear-TV measurement across 210 U.S. markets** with **Yahoo ConnectID** (Yahoo's deterministic identity layer, reported at **232M logged-in U.S. users**) [37].\n- Works at the **local market (DMA)/district level** — which matters for **down-ballot** races where the relevant geography is a single congressional district or state-legislative seat. (*DMA — designated market area — Nielsen's term for a local TV market, e.g., \"Philadelphia DMA.\" Note that \"DMA\" is a Nielsen market definition, but Nielsen's local-market measurement itself lost MRC accreditation in 2021 and had not regained it through the 2022/2024 cycles; Comscore has been the only MRC-accredited local TV measurement since March 2024 — discussed later, in the chapter on the measurement-currency war.*)\n- The targeting **deduplicates across screens**: it identifies voters already reached on linear TV, then routes *subsequent CTV impressions toward un-exposed households in the same geography* — using ACR-style linear exposure data to buy *incremental* reach rather than re-hitting the same homes [37].\n\n*(One trade summary named MiQ's political division as an activation partner; treat that specific attribution as unverified pending the primary announcement.)*\n\n### How a segment is actually built — the worked example\n\nPutting Layers 2–4 together for **\"likely-Republican infrequent voters in PA-07\"**:\n\n1. **Define on the voter file (Layer 2).** Filter L2's PA file to: residence in the 7th congressional district (geography is *fact*); turnout history = voted in 0–1 of the last several general elections (\"infrequent,\" *public record fact*); modeled partisanship score = leans Republican (*model, ~two-thirds accurate*). Result: a list of registered individuals.\n2. **Productize (Layer 4).** Comscore (or the vendor) wraps that as a cookie-free predictive segment with a name and an ID.\n3. **Onboard/match (Layer 3).** LiveRamp/Experian resolve the list to RampIDs/CTV IDs/IPs — say a 55–70% household match — inside a clean room, so the raw voter list never leaves.\n4. **Push to DSP (Layer 4→buy).** The matched segment appears as a selectable audience inside the DSP (The Trade Desk, Madhive, Yahoo DSP, DSPolitical's Deploy).\n5. **Buy CTV impressions** against it on Roku/Samsung/LG/Hulu/etc. inventory.\n\n**Madhive** illustrates the political-DSP packaging. It launched a **local CTV marketplace for political advertising (Feb 2024)** letting buyers target voters across **400+ congressional districts**, with a \"political audience data layer\" drawing on **Data Trust, TargetSmart, Experian, and L2** (Madhive's own release and Adweek name Experian — an earlier draft mis-listed \"Tunnl\"), and reach across **all 210 DMAs** (via broadcaster relationships, e.g., Gray Media's 117 markets) [39][40]. That single sentence shows the whole stack converging: voter-file vendors (Layer 2) → matched audiences (Layers 3–4) → a DSP buying local CTV inventory (Layer 1 glass).\n\n---\n\n## Layer 5 — Measurement & Attribution: Did the Targeted Voter Watch, and Did They Vote?\n\n**One sentence:** The back-end matches *who was exposed to the ad* (the impression logs, often verified by ACR) back to *what those people did* (turned out to vote, per the next voter-file update), to claim that the campaign moved behavior.\n\nMeasurement closes the loop, and it is where the stack's most contested claims live (the effectiveness debate is taken up later, in the chapter on ad impact and effectiveness; here we describe only the *plumbing*). Two distinct measurement jobs:\n\n### Reach/frequency & incrementality measurement (using ACR)\n\nBecause ACR sees both linear and streaming on the same panel, it can measure **incremental reach** — how many households a CTV buy reached that linear *did not* — and find the **point of diminishing returns** where the same homes are over-exposed (frequency capping). **TVSquared** (an ad-measurement firm) partnered with **AdImpact** to provide real-time reach/frequency for political CTV, quantifying incremental reach over linear and flagging over-exposure [41]. ACR from Roku/LG/Samsung is the sensor underneath this.\n\n### Voter-outcome attribution (the political-specific back-end)\n\nThis is the genuinely *political* measurement: matching exposed households back to the voter file to see whether **modeled turnout or registration changed**. The mechanism: the exposure log — which onboarded households saw the ad — is matched, again in a clean room, on RampID/IP/HEM keys, against the *post-election* voter-file update showing who actually voted [41][42]. Trade descriptions call this \"voter contact matching,\" connecting \"exposed households to voter file records, enabling turnout and registration impact analysis\" [41].\n\n**The critical caveat to carry forward:** turnout attribution is *correlational by construction* unless the campaign ran a randomized holdout — a control group of matched voters deliberately *not* served the ad. Vendors frequently report \"exposed voters turned out at X% vs. unexposed at Y%,\" but exposed and unexposed groups differ for reasons other than the ad: the targetable, matchable, streaming household is already a more engaged voter. Rigorous designs use randomized control/exposed splits; many vendor case studies do not. The plumbing *can* support a real experiment; whether a given claim *did* is the effectiveness question taken up in the chapter on ad impact and effectiveness. So the measurement layer is where vendor-claimed \"lift\" most needs the independent-evidence discount applied throughout these pages.\n\n---\n\n## The Stack, End to End (exhibit-ready summary)\n\n| Layer | What it does (plain) | Dominant vendors | Key acronym(s) | Best footprint/accuracy figure | Independent or vendor? |\n|---|---|---|---|---|---|\n| **1. Glass / ACR** | TV reports what each household watches, all sources | Roku, LG Ad Solutions, Vizio/Inscape, Samsung Ads | ACR, CTV, OTT, FAST | Roku 100M+ HH (Apr 2026); Samsung 77M TVs; LG ~200M TVs / 33M opted-in; Vizio 19M+ accounts | Vendor-claimed |\n| **2. Voter file** | Every registered voter + history + models | L2, TargetSmart, Catalist, i360, Data Trust, Aristotle | NGP VAN, DDx | L2 200M+ voters / 2.3B history records; modeled party ~67% accurate (Pew) | Mixed (gov't fact + vendor models; Pew independent) |\n| **3. Match/identity** | Voter → reachable devices, privacy-safe | LiveRamp, Experian, TransUnion; clean rooms | PII, HEM, MAID, RampID, IP graph | Experian graph 126M HH; match rates 50–90% (claimed) | Vendor-claimed |\n| **4. Audience** | Productized buyable segments → DSP | Comscore (+L2; +Yahoo DSP), Madhive, DSPolitical | DSP, DMA | Comscore/L2 100+ segments; Yahoo ConnectID 232M users; Madhive 400+ districts | Vendor-claimed |\n| **5. Measurement** | Match exposure → turnout/outcome | TVSquared, iSpot, AdImpact, Comscore, the vendors' own | R/F, incrementality, lift | — (claims are contested) | Vendor-claimed; rigor varies |\n\nThe defining property of the whole machine: **it is a chain of joins**, and the join key migrates down the stack — from *name+address* (Layer 2) to *RampID/HEM/IP* (Layer 3) to *segment ID in a DSP* (Layer 4) and back to *name+address turnout* (Layer 5). Each join loses some people to match rates and imports some error from modeled scores. End-to-end precision is the *product* of the layers' individual accuracies. That is why the confident phrase \"voter-level addressable TV\" oversells what is really *household-level, partially-matched, partially-modeled* addressable TV.\n\n---\n\n## Open Questions\n\n1. **Is \"Comscore Predictive Audiences powered by L2\" still operating as a distinct product in 2026, or has it been folded into the broader Proximic/Yahoo line?** The 2022 launch is well-sourced; a *current-status* confirmation is needed. The 2026 Comscore×Yahoo Proximic Political Audiences product is confirmed live but is a different SKU.\n2. **What are the real, comparable, U.S.-only, opt-in-adjusted ACR household counts** for Roku/LG/Vizio/Samsung? Published figures mix global vs. U.S., \"TVs\" vs. \"households\" vs. \"ad-reachable,\" making the four footprints non-comparable as stated.\n3. **What is the independent (non-vendor) distribution of CTV voter-file match rates?** All match-rate figures here are vendor/trade claims; there is no Pew-equivalent audit of onboarding match rates.\n4. **How will the pending Fox–Roku deal reshape the largest ACR footprint** if/when it closes (expected 1H 2027)? A broadcaster owning the #1 TV-OS ACR dataset raises both data-integration upside and competitive/neutrality questions for political buyers.\n5. **How much voter-outcome attribution in the wild uses randomized holdouts** vs. naïve exposed-vs-unexposed comparisons? This determines whether Layer-5 \"lift\" claims are causal — the hinge for the question of whether political CTV actually works.\n6. **What is the data-flow status under the GOP Data Trust ↔ i360 exchange vs. the Democratic Catalist/DDx co-op today**, and how do those sealed ecosystems each feed CTV onboarding differently? (Partly a Layer-2/Layer-3 governance question, taken up later in the chapter on regulation, privacy, and risk.)\n7. **Did MiQ's political division actually serve as the activation partner for Comscore×Yahoo Proximic Political Audiences**, as one trade summary stated? Needs primary-source confirmation.\n\n---\n\n## Sources\n\n1. Roku Advertising, \"A Guide to ACR: The Future of TV and Audience Data,\" advertising.roku.com. Vendor product doc (Tier 1 as claim). Accessed 2026-06-23. https://advertising.roku.com/learn/resources/acr-the-future-of-tv-and-audience-data\n2. Lobato, R., \"Automated content recognition (ACR), smart TVs, and ad-tech infrastructure,\" *Media International Australia* / SAGE, 2025. Tier 2 (peer-reviewed). Accessed 2026-06-23. https://journals.sagepub.com/doi/10.1177/13548565251327885\n3. Samsung Ads, ACR/first-party-data descriptions (glass-level, 77M TVs, 16 months history), samsung.com/us/business/samsu -06-23. https://www.lowpass.cc/p/walmart-vizio-acquisition-inscape-data-roku\n12. apprupt, \"Samsung TV Plus FAST Platform Statistics 2025–2026\" (77M TVs; ARF Dash Aug 2025 ~45.5M ad-reach HH; ~$700–750M Samsung Ads revenue). Tier 5 trade (figures partly from ARF study). Accessed 2026-06-23. https://www.apprupt.com/samsung-tv-plus-fast-platform-statistics\n13. Fox Business / Fox Corporation press release, \"Fox Corporation to acquire Roku for $22 billion,\" 2026-06-15 (terms; standalone operation; ~100M global streaming households). Tier 1 as claim (corporate statement) + Tier 4 reporting. Accessed 2026-06-23. https://www.foxbusiness.com/markets/fox-corporation-announces-22b-acquisition-roku-landmark-streaming-live-tv-deal\n14. Pew Research Center, \"Political data in voter files,\" 2018-02-15 (what voter files contain; modeled scores). Tier 2. Accessed 2026-06-23. https://www.pewresearch.org/methods/2018/02/15/political-data-in-voter-files/\n15. L2 Data, l2-data.com (200M+ voters; 2.3B vote-history records; 250M+ consumer records; semi-annual updates). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://www.l2-data.com/\n16. codamail \"Political Data & Voter Analytics — Data Broker Directory\" + university library guides (L2, TargetSmart, Catalist, i360 contents/scale). Tier 5 aggregation + Tier 5 library guides. Accessed 2026-06-23. https://codamail.com/articles/data-broker-directory/political-data.html\n17. TargetSmart, \"Solutions — Data\" (50-state file, vote history, race/ethnicity fields, model scores). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://targetsmart.com/data-solutions/\n18. Catalist, \"Data — Dynamic National Database\" (Democratic/progressive only; no commercial work; 20+ years; hundreds of voter files). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://catalist.us/data/\n19. Catalist, \"Election Data FAQ\" (entire U.S. adult population 240M+). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://catalist.us/election-data-faq/\n20. Overture Global / Digital Public, \"The Secret Power of Political Data Trusts\" (Data Trust 300M+/2,500 data points/5,000 campaigns; i360–Data Trust exchange since 2014; DDx; Democratic fragmentation). Tier 5 analytical. Accessed 2026-06-23. https://www.overtureglobal.io/story/the-secret-power-of-political-data-trusts\n21. i360, i-360.com (250M+ adults; 190M registered; 1,800 data points; Koch-backed; founder Michael Palmer). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://www.i-360.com/\n22. Aristotle, aristotle.com/data (National Voter File 235M+ registered; 4,000+ election boards; founded 1983; all 50 states+DC). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://www.aristotle.com/data/\n23. Pew Research Center, \"Commercial Voter Files and the study of U.S. politics\" / \"voter files study Q&A,\" 2018-02-15 (five files tested; modeled party ~67%; 76%→59% range; 85% D vs 70% R; 34% false-positive registration; turnout over-report 4–13pts). Tier 2 (independent audit). Accessed 2026-06-23. https://www.pewresearch.org/short-reads/2018/02/15/voter-files-study-qa/\n24. Pew Research Center methods, \"Political data in voter files\" (modeled scores better for party/race than education/income). Tier 2. Accessed 2026-06-23. https://www.pewresearch.org/methods/2018/02/15/political-data-in-voter-files/\n25. Miller, J.D. et al., \"The Accuracy and Value of Voter Validation in National Surveys,\" *American Politics Research* / SAGE, 2021 (voter-file vote-history improves turnout estimates). Tier 2 (peer-reviewed). Accessed 2026-06-23. https://journals.sagepub.com/doi/10.1177/1065912920903432\n26. LiveRamp docs, \"Identity and Identifier Terms and Concepts\" + RampID resolution (RampID, raw vs hashed PII, HEM/MAID handling). Vendor technical docs (Tier 1 as claim). Accessed 2026-06-23. https://docs.liveramp.com/connect/en/identity-and-identifier-terms-and-concepts.html\n27. LiveRamp docs, \"RampID Identity Resolution in ADX\" / AbiliTec householding (persistent pseudonymous person/household ID; consistent-cohabitation householding). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://docs.liveramp.com/identity/en/perform-rampid-identity-resolution-through-adx.html\n28. LiveRamp docs, \"Getting Started with Identity Resolution in LiveRamp Clean Room\" (PII, HEM, MAID in same dataset; matching mechanics). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://docs.liveramp.com/connect/en/getting-started-with-identity-resolution-in-liveramp-clean-room--us-data-.html\n29. Experian, \"Digital Graph\" / \"Authenticated audiences in CTV advertising\" (links cookies/MAIDs/CTV IDs/UID2/ID5/IP to households; CTV match). Vendor docs (Tier 1 as claim). Accessed 2026-06-23. https://www.experian.com/marketing/consumer-sync/identity-resolution/digital-graph\n30. Experian, \"Introducing Experian's data marketplace\" + DSP case study (126M U.S. HH; 250M individuals; 4B+ digital IDs; 84% synced-ID, 9% match lift). Vendor docs (Tier 1 as claim). Accessed 2026-06-23. https://www.experian.com/blogs/marketing-forward/experian-unveils-new-data-marketplace-revolutionizing-addressability-across-display-mobile-and-ctv/\n31. adwave, \"Voter Data Onboarding for CTV Political Ads (2026 Guide)\" + \"CTV Political Advertising\" (match-rate ranges 50–90%; household-level matching; multiple voters/home). Tier 5/6 trade-explainer (treat ranges as trade claims). Accessed 2026-06-23. https://adwave.com/resources/voter-data-onboarding-tv-audiences\n32. LiveRamp blog + digitalapplied + AWS/Snowflake clean-room docs, \"What to Look for in a Data Clean Room Provider\" / \"Data Clean Rooms in 2026\" (clean-room mechanics; LiveRamp–Habu 2024; WPP/GroupM–InfoSum Apr 2025; hyperscaler tiers). Tier 1-as-claim (vendor) + Tier 5 trade. Accessed 2026-06-23. https://liveramp.com/blog/what-to-look-for-in-a-data-clean-room-provider-a-guide\n33. DSPolitical, dspolitical.com / \"Deploy\" (Democratic-aligned onboarding DSP; 90%+ match via multiple onboarders). Vendor doc (Tier 1 as claim). Accessed 2026-06-23. https://www.dspolitical.com/deploy/\n34. Comscore, \"Comscore and L2, Inc. Launch First of Its Kind Cookie-free Audiences Based on Voter Insights,\" press release, 2022-01-13 (100+ segments; cookie-free; all leading DSPs; cheaper-than-user-ID claim). Tier 1 as claim (press release — claim only, not proof). Accessed 2026-06-23. https://www.comscore.com/Insights/Press-Releases/2022/1/Comscore-and-L2-Inc-Launch-First-of-Its-Kind-Cookie-free-Audiences-Based-on-Voter-Insights\n35. Proximic by Comscore, \"Reach Political Audiences Through Predictive Audiences\" + \"Safely Navigating Election Advertising in 2022: A Q&A with L2 and Comscore.\" Vendor docs (Tier 1 as claim). Accessed 2026-06-23. https://www.comscore.com/Products/Programmatic-Targeting/Cookie-free-Targeting-Solution\n36. Comscore, \"Comscore Debuts AI-Powered Data Partner Network,\" press release, 2025-09 (Proximic line active/extended in 2025). Tier 1 as claim. Accessed 2026-06-23. https://www.comscore.com/Insights/Press-Releases/2025/9/Comscore-Debuts-AI-Powered-Data-Partner-Network\n37. ppc.land, \"Comscore and Yahoo DSP target 2026 voters with CTV political audiences,\" 2026-03 (Proximic Political Audiences; Mar 5 2026; Comscore 210-market MRC-accredited linear measurement; Yahoo ConnectID 232M users; DMA-level; cross-screen dedup). Tier 5 trade. Accessed 2026-06-23. https://ppc.land/comscore-and-yahoo-dsp-target-2026-voters-with-ctv-political-audiences/\n38. Advanced Television, \"Comscore, Yahoo DSP launch Proximic Political Audiences,\" 2026-03-06. Tier 5 trade. Accessed 2026-06-23. https://www.advanced-television.com/2026/03/06/comscore-yahoo-dsp-launch-proximic-political-audiences/\n39. Adweek, \"Madhive Launches Local CTV Marketplace For Political Advertising,\" 2024-02-27 (400+ districts; Data Trust/TargetSmart/Experian/L2 data layer — the release names Experian, not Tunnl; all 210 DMAs). Tier 5 trade. Accessed 2026-06-23. https://www.adweek.com/adweek-wire/madhive-launches-local-ctv-marketplace-for-political-advertising/\n40. ppc.land, \"Gray Media bets on Madhive's AI DSP\" (Gray 117 markets; local-first political DSP). Tier 5 trade. Accessed 2026-06-23. https://ppc.land/gray-media-bets-on-madhives-ai-dsp-to-win-local-tvs-programmatic-future/\n41. Next TV, \"TVSquared Working With AdImpact To Measure Political Ad Reach on CTV\" + adwave guides (incremental reach/frequency; diminishing returns; voter-contact matching to turnout/registration). Tier 5 trade. Accessed 2026-06-23. https://www.nexttv.com/news/tvsquared-working-with-adimpact-to-measure-political-ad-reach-on-ctv\n42. Experian, \"Connected TV political advertising in 2024\" (CTV political measurement / exposure-to-outcome context). Vendor blog (Tier 1 as claim). Accessed 2026-06-23. https://www.experian.com/blogs/marketing-forward/connected-tv-political-advertising-in-2024/"}, {"order": 3, "file": "03_Players_And_Market_Structure.md", "title": "Players & Market Structure: Who Keeps the Political CTV Dollar", "summary": "", "body": "# Players & Market Structure: Who Keeps the Political CTV Dollar\n\n## Bottom Line\n\nPolitical connected-TV (CTV — internet-delivered television, watched on a smart TV or a streaming stick rather than over a cable or antenna) is the only *growing* line in a record political-ad budget. The fight over it is a fight over a thin slice of a very large pie. AdImpact projects the 2026 cycle at **$11.6 billion total** (revised up from $10.8B as of June 2026), of which **CTV is roughly $2.5 billion — about 21–24%**, up from $2.3B in 2024, $1.09B in 2022, and ~$260M in 2020 [1][2][3]. Broadcast still takes the largest single share (~$5.3B in 2024; broadcast's share fell below 50% for the first time that cycle) [4]. So the headline is not \"CTV won.\" It is that CTV is the only channel still climbing — and everyone in the value chain is repositioning to sit in front of that climb.\n\n**The structure has five layers, and the margin pools differently in each.** (1) **Inventory** — the streamers and smart-TV makers who own the impressions: Roku, LG, Vizio (Walmart-owned since Dec 3, 2024), Samsung, Hulu/Disney, YouTube/Google, Paramount/Pluto, Tubi/Fox, Peacock — *most of whom accept political ads*. Crucially, the biggest reach assets — **Amazon Prime Video, Netflix, Disney+, and Apple TV — refuse political ads**, which concentrates political spend onto the platforms that say yes and pushes their CPMs up [5][6][7]. (2) **DSPs and political-specialist ad-tech** — The Trade Desk (the dominant independent pipe), Madhive (the local-broadcaster-aligned political specialist), Viant, MNTN, Basis Technologies (which held an *exclusive* LG Ad Solutions political-CTV partnership through 2024), Yahoo DSP, Cross Screen Media, Tuesday Digital. (3) **Data/identity** — a partisan-split voter-file market: **i360** (Koch-funded, Republican) vs. **TargetSmart** and **Catalist** (Democratic/progressive), with **L2** and **Aristotle** selling across the aisle, all riding **Comscore's** predictive-audience and ACR layer and **LiveRamp/Experian/TransUnion** identity rails. (4) **Measurement** — Nielsen vs. the certified challengers Comscore, iSpot, and VideoAmp, plus the spend-tracking houses **AdImpact, Borrell, Kantar/CMAG, and the academic Wesleyan Media Project**. (5) **Agencies/consultants** — a startlingly concentrated layer where **Waterfront Strategies (the GMMB-affiliated Democratic buyer) took in ~$858M in 2024 alone**, more than double the next-largest vendor [8].\n\n**Who keeps the spread?** No single party. The take is layered: the platform keeps its inventory margin; the DSP takes ~15–20% of media (The Trade Desk's inferred ~20% platform take); the data/voter-file vendor charges a CPM uplift or a license; the measurement firm sells a separate subscription; and the media-buying agency historically pockets a **~15% commission** on the gross buy — the oldest and largest single take in the chain. **One caution runs through all of it:** nearly every public number in this market comes from a party with a book to talk. DSPs cite \"36% more efficient than linear,\" voter-file vendors tout match rates, platforms publish reach studies — so treat vendor effectiveness claims as marketing until an independent source (academic, AdImpact, a measurement currency) corroborates them. The corporate ground also shifts fast. OneView (Roku's DSP) is being sunset, Vizio is now Walmart, a4 is now LG Ad Solutions/Alphonso, and Basis's LG exclusivity was scoped to 2024. Present-tense status in this space goes stale within a single cycle.\n\n---\n\n## Orientation: the shape of the market and how to read the numbers\n\nBefore the actor map, three framing facts decide how every number below should be read.\n\n**First, CTV is a minority of political TV money but the entire growth story.** In the completed 2024 cycle, AdImpact's final count put total political ad spend at a record **$11.1 billion**, with broadcast at **$5.3 billion** (its share below 50% for the first time), **CTV at $2.3 billion (21% of cycle spend, the second-highest category)**, cable down nearly $400M versus 2020, and radio up $326M [4][9]. For 2026, AdImpact projects **$11.6 billion total** (revised up from an initial $10.8B) and **CTV ~$2.5 billion — the only media type it expects to grow versus 2024** [1][2]. Borrell Associates, the other major local-ad tracker, separately forecasts local **CTV/OTT ad spending of $3.6 billion in 2026 (+9.7% YoY)** across *all* advertisers (not just political), and ~$9 billion in 2026 midterm political spend in its framing [10]. The two houses use different definitions and totals — a recurring problem in this market, and itself a reason measurement firms have pricing power.\n\n**Second, the political CTV dollar is small relative to commercial CTV but disproportionately loud.** The Trade Desk framed political ads for the 2024 cycle as just **~3.1% of total U.S. media spend** [11]. Yet that money arrives in a compressed window (51% of 2024 cycle spend landed in the final eight weeks [4]), concentrates geographically (13 states accounted for **$7.4B — 67% — of 2024 cycle spend** [12]), and crowds onto the platforms that accept it — so its *local* effect on CTV CPMs is large. Programmatic political CPMs in 2024 ran **40%+ above the cycle average in October–November**, with video CPMs in some swing markets nearly doubling [13].\n\n**Third — and this is the load-bearing structural fact — the largest CTV reach assets refuse political ads, which is itself a market-structure force.** When Amazon Prime Video (~115M U.S. users), Netflix (~13M ad-tier U.S. subscribers), Disney+ (100M+), and Apple TV all decline political advertising [5][6][7], the available political CTV inventory contracts to Roku, Hulu, YouTube/YouTube TV, the FAST services (Tubi, Pluto, the Roku Channel), Peacock, Paramount+, and the smart-TV-maker inventory (Samsung, LG, Vizio). Scarcity plus a compressed spending window equals a CPM premium on the \"yes\" platforms. This is why political media buyers call Netflix access \"a crown jewel\" [5], and why the refusers' policies are a competitive variable, not a footnote.\n\nA note on the partisan lens that runs through what follows: where a vendor's framing serves its own book, I say so inline. The voter-file market in particular is *organized by party* — a structural feature, not a bias to be scrubbed.\n\n## The status ledger (as of June 2026)\n\nThis space rebrands, divests, and sunsets faster than any single cycle, so every present-tense status below is a dated claim, not background. Here are the ownership and product changes a stale source is most likely to get wrong:\n\n| Entity / product | What changed | When | Status as of June 2026 | Stale-source trap |\n| --- | --- | --- | --- | --- |\n| **Vizio / Inscape** | Acquired by **Walmart** for $2.3B; delisted from NYSE | Closed Dec 3, 2024 | Wholly owned Walmart subsidiary; Inscape ACR + Walmart retail data [28] | \"Vizio, an independent public company\" |\n| **Roku OneView (DSP)** | Sunsetting; resources moved to Roku Ads Manager + third-party DSPs | Sunset began 2024 | Being wound down; Roku Exchange (Magnite) + Roku Ads Manager + Roku Ads API (Nov 2025) are the live surfaces [18][19][21] | \"Roku's OneView DSP powers…\" |\n| **a4 / Alphonso** | a4 folded into **LG Ad Solutions**; LG took majority of Alphonso (Dec 2020) | 2020–2021 | Operates as LG Ad Solutions/Alphonso; eyeing U.S. listing; founder litigation [24][27] | \"a4 Media, the standalone ad unit\" |\n| **Basis × LG exclusivity** | Exclusive political-CTV activation deal | Nov 7, 2023 → **end of 2024** | Expired by its own terms; current arrangement unconfirmed [44] | \"Basis exclusively activates LG ACR for political\" (present tense) |\n| **Samsung DSP × Experian** | Experian identity/audiences integrated, then expanded | Dec 2023 → Feb 11, 2026 | Live; ~95% Samsung match rate [30] | citing the 2023 version as current |\n| **Paramount × Nielsen** | Measurement contract not renewed; Paramount leans on VideoAmp | Oct 2024 | VideoAmp-measured | \"Paramount, a Nielsen client\" |\n| **Hulu political ads** | Reversed issue-ad refusal | July 2022 | Accepts political ads (Disney-aligned policy); **Disney+ still refuses** [15][16] | \"Hulu rejects issue ads\" |\n\nThe pattern: ownership consolidates (Walmart→Vizio), owned-DSPs give way to third-party rails (Roku), and exclusivities are cycle-scoped. Treat any \"X currently powers Y\" claim sourced before 2025 as suspect until re-confirmed.\n\n---\n\n# PART ONE — INVENTORY: THE PLATFORMS THAT OWN THE IMPRESSIONS\n\nThe platform layer is where the impression originates and where the first margin is taken. One fact here outranks all others: the **accept/refuse split** determines where political money can physically go.\n\n## 1.1 The accept/refuse map (and why it moves CPMs)\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 430\" role=\"img\" aria-label=\"A two-column matrix of streaming platforms split by their stance on U.S. political advertising. The left column, REFUSE, holds the four largest-reach streamers — Amazon Prime Video, Netflix, Disney+, and Apple TV+ — marked with a muted red tab. The right column, ACCEPT, holds nine platforms — Roku, Hulu, YouTube and YouTube TV, Peacock, Paramount+ and Pluto, Tubi, Samsung, LG, and Vizio — marked with a green tab. A magenta arrow funnels political spend from the refusing column toward the accepting column. A monospace CPM band annotation on the right shows three Tier-5 trade-estimate tiers: premium inventory at Hulu, Peacock, and Paramount+ around 35 to 80 dollars; mid-tier at Roku and Samsung around 25 to 45 dollars; and FAST channels Tubi and Pluto around 18 to 28 dollars. The thesis: because the highest-reach screens refuse political ads, demand concentrates on a fixed accepting set and lifts its CPMs — a structural scarcity rather than a market clearing.\">\n<text x=\"40\" y=\"30\" class=\"t-serif t-acc\" font-size=\"15\" font-weight=\"700\" letter-spacing=\"1.5\">THE LARGEST SCREENS SAY NO<\/text>\n<text x=\"40\" y=\"48\" class=\"t-muted t-mono\" font-size=\"9.5\" letter-spacing=\"0.5\">FIG. 3 — POLITICAL-AD STANCE BY STREAMING PLATFORM<\/text>\n<line x1=\"40\" y1=\"58\" x2=\"660\" y2=\"58\" class=\"ln-soft\"/>\n<g class=\"cv-rise\">\n<rect x=\"40\" y=\"74\" width=\"270\" height=\"20\" class=\"f-t4\"/>\n<text x=\"50\" y=\"89\" class=\"t-inv t-serif\" font-size=\"12\" font-weight=\"700\" letter-spacing=\"1\">REFUSE<\/text>\n<text x=\"200\" y=\"88\" class=\"t-inv t-mono\" font-size=\"8.5\" letter-spacing=\"0.5\">LARGEST REACH<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.06s\">\n<rect x=\"40\" y=\"100\" width=\"270\" height=\"38\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"40\" y=\"100\" width=\"6\" height=\"38\" class=\"f-t4\"/>\n<text x=\"58\" y=\"118\" class=\"t-serif\" font-size=\"11.5\" font-weight=\"700\">AMAZON \" width=\"6\" height=\"22\" class=\"f-t3\"/>\n<text x=\"406\" y=\"219\" class=\"t-serif\" font-size=\"10.5\" font-weight=\"700\">PARAMOUNT+ / PLUTO<\/text>\n<text x=\"652\" y=\"219\" class=\"t-muted t-mono\" font-size=\"8\" text-anchor=\"end\">PREM / FAST<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.26s\">\n<rect x=\"390\" y=\"230\" width=\"270\" height=\"22\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"390\" y=\"230\" width=\"6\" height=\"22\" class=\"f-t3\"/>\n<text x=\"406\" y=\"245\" class=\"t-serif\" font-size=\"10.5\" font-weight=\"700\">TUBI<\/text>\n<text x=\"652\" y=\"245\" class=\"t-muted t-mono\" font-size=\"8\" text-anchor=\"end\">FAST<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.30s\">\n<rect x=\"390\" y=\"256\" width=\"86\" height=\"22\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"390\" y=\"256\" width=\"6\" height=\"22\" class=\"f-t3\"/>\n<text x=\"406\" y=\"271\" class=\"t-serif\" font-size=\"10.5\" font-weight=\"700\">SAMSUNG<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.34s\">\n<rect x=\"482\" y=\"256\" width=\"86\" height=\"22\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"482\" y=\"256\" width=\"6\" height=\"22\" class=\"f-t3\"/>\n<text x=\"498\" y=\"271\" class=\"t-serif\" font-size=\"10.5\" font-weight=\"700\">LG<\/text>\n<\/g>\n<g class=\"cv-rise\" style=\"--d:.38s\">\n<rect x=\"574\" y=\"256\" width=\"86\" height=\"22\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"574\" y=\"256\" width=\"6\" height=\"22\" class=\"f-t3\"/>\n<text x=\"590\" y=\"271\" class=\"t-serif\" font-size=\"10.5\" font-weight=\"700\">VIZIO<\/text>\n<\/g>\n<line x1=\"40\" y1=\"296\" x2=\"660\" y2=\"296\" class=\"ln-soft\"/>\n<text x=\"40\" y=\"314\" class=\"t-serif\" font-size=\"11\" font-weight=\"700\" letter-spacing=\"0.5\">CPM CONSEQUENCE<\/text>\n<text x=\"170\" y=\"314\" class=\"t-muted t-mono\" font-size=\"8\" letter-spacing=\"0.5\">— SHARPEST LIFTS IN THE SURGE WINDOW<\/text>\n<g class=\"cv-fade\" style=\"--d:.1s\">\n<rect x=\"40\" y=\"324\" width=\"200\" height=\"44\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"40\" y=\"324\" width=\"6\" height=\"44\" style=\"fill:var(--accent)\"/>\n<text x=\"56\" y=\"340\" class=\"t-mono t-muted\" font-size=\"8.5\" letter-spacing=\"0.5\">PREMIUM · HULU / PEACOCK / PARA+<\/text>\n<text x=\"56\" y=\"360\" class=\"t-acc t-serif\" font-size=\"14\" font-weight=\"700\">~$35–80 CPM<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.16s\">\n<rect x=\"250\" y=\"324\" width=\"200\" height=\"44\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"250\" y=\"324\" width=\"6\" height=\"44\" class=\"f-t3\"/>\n<text x=\"266\" y=\"340\" class=\"t-mono t-muted\" font-size=\"8.5\" letter-spacing=\"0.5\">MID-TIER · ROKU / SAMSUNG<\/text>\n<text x=\"266\" y=\"360\" class=\"t-serif\" font-size=\"14\" font-weight=\"700\">~$25–45 CPM<\/text>\n<\/g>\n<g class=\"cv-fade\" style=\"--d:.22s\">\n<rect x=\"460\" y=\"324\" width=\"200\" height=\"44\" class=\"f-panel\" rx=\"2\"/>\n<rect x=\"460\" y=\"324\" width=\"6\" height=\"44\" class=\"f-t2\"/>\n<text x=\"476\" y=\"340\" class=\"t-mono t-muted\" font-size=\"8.5\" letter-spacing=\"0.5\">FAST · TUBI / PLUTO<\/text>\n<text x=\"476\" y=\"360\" class=\"t-serif\" font-size=\"14\" font-weight=\"700\">~$18–28 CPM<\/text>\n<\/g>\n<text x=\"40\" y=\"386\" class=\"t-mono t-muted\" font-size=\"8\" letter-spacing=\"0.3\">CPM bands are Tier-5 trade estimates (directional, not transacted rates).<\/text>\n<text x=\"350\" y=\"412\" class=\"t-muted t-serif\" font-size=\"10.5\" font-style=\"italic\" text-anchor=\"middle\">The four highest-reach streamers refuse political ads, funneling demand onto a fixed accepting set —<\/text>\n<text x=\"350\" y=\"426\" class=\"t-muted t-serif\" font-size=\"10.5\" font-style=\"italic\" text-anchor=\"middle\">a structural scarcity that lifts CPMs, not a market clearing.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 3.<\/strong> Because the four highest-reach streamers refuse U.S. political advertising, demand piles onto a fixed set of accepting platforms and bids up their CPMs — the premium isn't a clearing price, it's manufactured scarcity.<\/figcaption>\n<\/figure>\n\n\nThe largest-reach CTV platforms — Amazon Prime Video, Netflix, Disney+, and Apple TV — refuse political advertising, while Roku, Hulu, YouTube/YouTube TV, Peacock, Paramount+/Pluto TV, Tubi, and the smart-TV-maker inventory (Samsung, LG, Vizio) accept it. That split concentrates political spend onto the accepting platforms and contributes to a CPM premium there.\n\n**Refusers.** Amazon Prime Video prohibits political ads \"during an election year\" across both on-demand and live content (including its Thursday Night Football inventory), per Amazon Ads' prohibited-content policy [6]. **Netflix** remains a holdout despite its ad-supported tier (~13M U.S. subscribers), drawing a formal rebuke from the American Association of Political Consultants and Senate-subcommittee attention (Netflix co-CEO Ted Sarandos testified in February 2026) [5][14]. **Disney+** refuses political ads to protect its family-brand positioning even as its sibling **Hulu accepts them** (Hulu reversed an earlier issue-ad rejection in July 2022 and aligned with Disney's general-entertainment/ESPN policy) [15][16]. **Apple TV** also refuses [5]. The Trade Desk's Ari Wolfe called Netflix access \"a crown jewel for political media buyers\" and \"at the top of the list in terms of platforms I'd like to see open up\" — an explicit signal that the refusers' inventory is the market's most-wanted unavailable supply [5].\n\n**Why it matters:** the refusers collectively hold a very large share of premium ad-supported streaming reach. By declining political money, they do two things at once. They forgo the political-CPM premium themselves, and they push that demand onto the accepting platforms, tightening inventory and lifting political CPMs there. The result is a structural transfer of political dollars and pricing power to Roku, Hulu, YouTube, the FAST services, and the OEMs.\n\n## 1.2 Roku — the largest \"yes\" platform, mid-platform-strategy pivot\n\nRoku is the single most consequential accepting platform: a streaming OS with first-party login data, owned-and-operated inventory (The Roku Channel, a top FAST service), and a self-serve buying surface. **Its status is in flux, because Roku's ad stack is mid-transformation.** Roku is sunsetting its owned DSP, OneView (relaunched from the acquired DataXu in 2020), and shifting to a third-party-DSP strategy — partnering with The Trade Desk, Yahoo, and others via Roku Exchange (a Magnite-powered programmatic gateway) while steering smaller advertisers to the self-serve Roku Ads Manager (launched Sept 2024, $500 minimum).\n\nThe lineage matters for any present-tense claim. Roku acquired DataXu in 2019 and relaunched it as **OneView** in 2020 [17]. By April 2024, Roku told buyers it would **gradually sunset OneView over 2024**, move resources to **Roku Ads Manager** (a self-service tool, $500 minimum, launched Sept 2024), and open up to third-party DSPs [18][19]. **Roku Exchange** connects Roku's inventory to the programmatic ecosystem via a **Magnite** integration, letting DSPs such as The Trade Desk, Google DV360, and Yahoo DSP buy Roku supply [20]. In November 2025 Roku launched a **Roku Ads API** for ad-tech developers (reporting, audience targeting, conversion tracking; launch partners Tealium and Haus) [21]. **Net:** anyone describing Roku's ad business as \"OneView-powered\" today is describing a sunsetting product. The current reality is third-party-DSP-plus-Roku-Ads-Manager.\n\nOn political specifically, Roku **accepts** political ads (U.S. citizens/entities only; misleading or manipulated content blocked), runs them through Roku Ads Manager subject to its Political Advertising Guidelines, and — notably for the regulatory layer — publishes a **public political ad archive** (launched Sept 2020) listing the paying group, campaign IDs, and creative, though *not* spend, targeting, or impressions in bulk [22][23].\n\n## 1.3 The smart-TV makers — ACR data is the asset (LG, Vizio, Samsung)\n\nThe TV manufacturers' value in political CTV is less their app inventory than their **ACR data** — Automatic Content Recognition, the glass-level technology that identifies, second by second, everything on the screen across every input (cable, streaming app, game console, antenna). ACR lets a campaign target cord-cutters, suppress voters already saturated by an opponent's linear buy, or model partisanship from viewing behavior.\n\nThe smart-TV ACR vendors central to political CTV targeting are LG Ad Solutions (operating the former Alphonso, majority-acquired by LG Electronics in Dec 2020), Vizio's Inscape (now Walmart-owned), and Samsung Ads — each licensing glass-level viewing data for audience targeting and exposure measurement.\n\n**LG Ad Solutions / Alphonso / a4.** LG Electronics took majority control of **Alphonso** in December 2020 (Zenith Electronics, an LG subsidiary, invested ~$78M for 55%) [24]. Alphonso operates LG Ad Solutions; the older **a4** branding referred to the same OEM-data activation model (impression-level insights from the device, ACR-based retargeting) [25]. LG's ACR footprint is cited at **~35 million U.S. LG smart TVs** [26]. As of August 2025, Alphonso/LG Ad Solutions was reportedly eyeing a U.S. listing, with founders in litigation against LG over the takeover terms — a live question mark over the entity's ownership structure [27].\n\n**Vizio / Inscape.** Vizio's **Inscape** unit is one of the largest independent ACR data providers. **Walmart completed its $2.3 billion acquisition of Vizio on December 3, 2024** ($11.50/share); Vizio is now a wholly owned Walmart subsidiary, delisted from the NYSE [28]. Vizio Ads now combines Inscape ACR data with Walmart first-party retail-purchase data — a closed-loop asset Walmart has said it will run separately from Walmart Connect \"for the foreseeable future\" [28]. **The point to watch:** any source calling Vizio an independent public company is pre-December 2024 and stale.\n\n**Samsung Ads.** Samsung operates its own DSP and licenses what it markets as the \"#1 TV viewing dataset worldwide\" via glass-level ACR; for political, it pitches voter targeting \"in a fully-compliant manner\" [29]. **A recent shift:** Samsung Ads integrated **Experian** identity and syndicated audiences directly into Samsung DSP — first in **December 2023**, with an expansion announced **February 11, 2026** (Experian cites a ~95% match rate with Samsung; ~3,200 ready-to-use audiences) [30]. Samsung also tapped **Amazon DSP** ad tech for interactive/shoppable formats at the 2026 NewFronts — a sign the OEMs increasingly plug into multiple demand sources rather than only their own [31].\n\n## 1.4 The streamers and FAST services (Hulu, YouTube, Peacock, Paramount/Pluto, Tubi)\n\n- **Hulu / Disney** — accepts political ads (since July 2022); delivers full-episode, non-skippable placements within premium content via Disney's ad platform; a top political destination [15][32].\n- **YouTube / YouTube TV (Google)** — accepts political ads subject to Google's advertiser-verification requirements; **YouTube + YouTube TV command ~12.5% of all U.S. TV viewing per Nielsen (Jan 2026) — more than any single broadcast network** — making Google a structurally large but under-discussed political CTV destination [33][32].\n- **Peacock (NBCUniversal)** — accepts political ads; offers geographic and demographic targeting within its owned library [32].\n- **Paramount+ / Pluto TV** — accept political ads; Pluto is a major FAST service [32].\n- **Tubi (Fox)** — accepts political ads; the leading FAST platform by viewing share in periods of 2024–2026, ~90% on-demand [34][35].\n\nThe **so what for the inventory layer:** political money flows to a defined set of \"yes\" platforms, and they split by what they actually sell. The OEMs sell *data* (ACR) more than *reach*; the streamers sell *premium reach* (Hulu, YouTube, Peacock); the FAST services sell *cheap scale* (Tubi, Pluto, Roku Channel). CPMs sort accordingly (see Part Five).\n\n---\n\n# PART TWO — DSPs AND POLITICAL-SPECIALIST AD-TECH\n\nThe DSP (demand-side platform — the software a buyer uses to purchase ad impressions programmatically across many publishers) layer is where most independent CTV political money is routed, and where a 15–20% media take is captured. Two archetypes matter: the **large independent generalist** (The Trade Desk) and the **political/local specialist** (Madhive).\n\n## 2.1 The Trade Desk — the dominant independent pipe\n\nThe Trade Desk (TTD) is the default route for open-market CTV demand outside the walled gardens. For 2024, **Proximic by Comscore made its political TV-ad-exposure audiences and L2 voter-based segments available *exclusively* on The Trade Desk** — an exclusivity that steered privacy-safe political targeting to TTD [36][37]. TTD's own marketing claimed CTV reached households **\"36% more efficiently than linear TV\"** via frequency capping plus granular targeting [38] — **a vendor efficiency claim; treat as marketing until independently corroborated** (the effectiveness debate is taken up later, in the chapter on whether political CTV actually works). TTD also rolled out AI-powered political targeting (Kokai) ahead of 2024 [38]. **Read it skeptically:** TTD's \"political is only ~3.1% of media spend, don't worry\" framing [11] reassures commercial advertisers *and* downplays the CPM disruption its own platform helps create. It serves the book on both sides.\n\n## 2.2 Madhive — the local-broadcaster-aligned political specialist\n\nMadhive's positioning is the mirror image of TTD's. Where TTD is a horizontal generalist, Madhive is built for **local TV and political**. It is \"trusted by America's leading broadcasters, collectively covering all 210 DMAs,\" serves \"billions of local CTV impressions across all 210 DMAs,\" and runs \"20,000+ campaigns daily\" including political at every level. (*The \"210 DMAs\" are Nielsen's market definitions; note that Nielsen's local-market measurement was MRC-de-accredited from 2021 and had not regained it through the 2022/2024 cycles, with Comscore the only MRC-accredited local TV measurement since March 2024 — discussed later, in the chapter on the measurement-currency war.*) In **February 2024 it launched a Local CTV Marketplace for political advertising** targeting voters across **400+ congressional districts**, with **Fox Television Stations** as the first-to-market client [39][40][41]. That makes Madhive the connective tissue between local broadcast groups — who own the relationships and the must-carry political inventory — and programmatic CTV.\n\n## 2.3 The rest of the DSP/specialist field\n\nThe broader political CTV DSP/specialist field includes Viant (Household ID-based programmatic), MNTN (performance CTV), Basis Technologies, Yahoo DSP, and the political-services specialists Cross Screen Media and Tuesday Digital.\n\n- **Viant** — an omnichannel programmatic DSP pitching political campaigns via its **Household ID** identity spine, premium CTV access, and AI optimization [42].\n- **MNTN** — a performance-CTV platform; its widely cited 2024 stat was that **~45% of digital political ad spend would go to CTV (~$1.5B)** [43].\n- **Basis Technologies** — independent DSP; **held an *exclusive* political-CTV activation partnership with LG Ad Solutions, announced Nov 7, 2023, scoped \"through the end of 2024,\"** giving Basis sole access to LG's ACR data (35M U.S. LG TVs) plus all major voter files, delivered via Magnite [26][44]. **A caution:** that exclusivity was time-boxed to 2024 — do *not* assume it is live in 2026 without re-confirmation.\n- **Yahoo DSP** — a generalist independent DSP, available as a Roku Exchange buying route [20].\n- **Cross Screen Media** — a local cross-screen planning/activation/measurement layer for political agencies targeting niche voter audiences [45].\n- **Tuesday Digital** — a political-services shop running CTV/OTT buys across YouTube TV, Hulu, Peacock, and more with voter-file matching [46].\n\nThe **so what for the DSP layer:** an independent CTV political buy typically passes through a DSP that takes ~15–20% of media (TTD's inferred take), often atop a voter-file data fee and an agency commission. The \"media\" the campaign pays for is materially less than the dollar it spends.\n\n## 2.4 Walled gardens vs. the independent stack — why the structure favors independents *in politics*\n\nThe commercial CTV market splits the field into **walled gardens** (platforms that wall off their inventory and force you to buy through their own stack — Amazon, YouTube/Google, and to a degree Roku) and the **independent open stack** (TTD, Madhive, the OEM-data layer, Magnite-routed supply). In *commercial* CTV the walled gardens are ascendant. In *political* CTV the balance tilts back toward the independents, for a structural reason: **the two biggest walled gardens — Amazon, and Disney+ within Disney's garden — refuse political ads outright** [5][6]. YouTube/Google accepts political but routes it through Google's own verified-advertiser pipes. So the political buyer who wants ACR-driven voter targeting across many publishers has fewer walled-garden options and leans harder on the independent stack — TTD for scale, Madhive for local, the OEMs for ACR data. That is part of why political is a disproportionately *independent-DSP* business relative to commercial CTV, and why TTD's Comscore/L2 exclusivity for 2024 mattered: it concentrated the privacy-safe political-targeting product onto the largest independent pipe at exactly the moment the walled gardens were unavailable.\n\n## 2.5 The Trade Desk's economics, decoded\n\nBecause TTD is the load-bearing independent pipe, its take-rate shapes the whole money-flow picture. TTD does **not** publish a take rate as a line item. The widely cited **~20% of platform spend** is *inferred* by dividing reported revenue by reported gross spend, and TTD has publicly stated its take \"has been consistently around 20%… with no plan to change that\" — a positioning statement, not an audited disclosure. The practitioner-level caution is that the *advertiser-side effective cost* runs materially higher once data, audience, ad-serving, and verification fees stack on top; analyst reconstructions put it nearer ~29–30%+. For political specifically, the voter-file data fee and the Comscore/Proximic segment fee sit on top of TTD's platform take as *additional* layers. **The read:** when a campaign is quoted \"~20% to the DSP,\" the true DSP-layer cost is higher, and the DSP layer is only one of five takes. I flag the ~20% as inferred and the ~29–30% as an analyst inference, not an audited figure.\n\n---\n\n# PART THREE — DATA & IDENTITY: THE PARTISAN VOTER-FILE MARKET\n\nThis is the layer that makes political CTV *political* rather than just demographic. Unlike commercial ad tech, **it is organized by party.** That partisan structure is the defining market-structure fact here.\n\n## 3.1 The partisan split\n\nThe U.S. political voter-data market is partisan-segmented: i360 is Koch-funded and Republican-aligned; TargetSmart and Catalist are Democratic/progressive-aligned; L2 and Aristotle sell across the aisle.\n\n- **i360 (Republican).** Backed by Koch Industries, founded by Michael Palmer (ex-CTO of McCain 2008), later merged with the Koch-funded Themis voter-database project. Markets **300M+ consumer/voter profiles with ~1,800 data points each** [47].\n- **Catalist (Democratic/progressive).** Founded 2006 by former Clinton staffers; \"the only unionized progressive data utility,\" working exclusively with unions, progressive orgs, and Democratic campaigns [48].\n- **TargetSmart (Democratic/progressive).** \"The leading data, research, and media-buying provider for Democratic campaigns\"; its **VoterBase covers 208M+ voters across all 50 states + DC, 53M unregistered voting-age consumers, 171M cell numbers** [49]. Catalist and TargetSmart partnered to share **85M+ new/updated phone numbers** (24M tied to communities of color) [50].\n- **L2 (bipartisan).** Sells voter data across the aisle; the engine behind the Comscore predictive-audience tie-up (below).\n- **Aristotle (bipartisan).** A long-standing political-data vendor selling to both parties.\n\n## 3.2 The Comscore predictive-audience layer (and its partisan mirroring)\n\nIn **January 2022**, Comscore and L2 launched **cookie-free political audiences** — combining L2's voter insights with Comscore's **Predictive Audiences** method to produce **100+ issue/behavior segments** (likely views on the economy, environment, candidates; ideology; vote propensity), available across leading DSPs [51]. For 2024, **Proximic by Comscore** expanded its TTD partnership to add **Political TV Ad Exposure audiences** (capturing TV-ad exposure to the local level), made **exclusively available on The Trade Desk** [36]. Then in **February 2024**, Comscore announced a **TargetSmart** partnership explicitly to \"empower progressive advertisers,\" giving TargetSmart's Democratic clients access to Comscore's cross-platform (TV/digital/CTV) viewership data for voter-based targeting [52]. **The structural insight:** the partisan voter-file split propagates *upward* into the audience-segment and measurement-data layer. Comscore effectively runs an L2/bipartisan rail and a TargetSmart/progressive rail in parallel.\n\n## 3.3 The commercial identity rails (LiveRamp, Experian, TransUnion)\n\nVoter files are useless on CTV without a way to match a registered voter to a household's IP and a streaming device. That match runs over commercial identity rails — **LiveRamp** (the dominant onboarding/clean-room layer), **Experian** (integrated into Samsung DSP since Dec 2023, expanded Feb 11, 2026, ~95% Samsung match rate, ~3,200 audiences) [30], and **TransUnion**. These are the same rails commercial advertisers use; political buyers ride them with voter-file data layered on top.\n\nThe **so what for the data layer:** the political dollar pays for *data* twice. Once for the partisan voter file (i360/TargetSmart/Catalist/L2), and again for the identity match and audience segments (Comscore/LiveRamp/Experian). This data stack is a distinct margin pool, separate from media and from the agency commission.\n\n---\n\n# PART FOUR — MEASUREMENT AND SPEND-TRACKING\n\nTwo distinct functions live here: **currency/measurement** (did the ad reach the household; what was the audience) and **spend tracking** (how much was spent, on what, where). Both are sold by independent firms, and both have pricing power for the same reason: the market can't agree on the numbers.\n\n## 4.1 The measurement-currency contest (Nielsen vs. the challengers)\n\nThe measurement layer fragmented in 2024–2025. The **Joint Industry Committee (JIC)** — a buyer/seller consortium — **certified Comscore and VideoAmp as national video currencies in April 2024, with iSpot following in August**, and re-affirmed all three in a mid-term audit ahead of the **2025–26 broadcast season** [53][54]. **Comscore won MRC accreditation for both local and national TV ratings**, while **Nielsen held national-only** accreditation in the relevant window [54]. The defection that signaled the shift: **Paramount and Nielsen failed to renew their contract** (Oct 2024 reporting), with Paramount leaning on **VideoAmp** [54]. For political, the fragmentation matters because campaigns and watchdogs need a *trusted, comparable* exposure metric — and no single currency is agreed. That gap is exactly what **iSpot** and **VideoAmp** monetize.\n\n## 4.2 The spend-tracking houses (AdImpact, Borrell, Kantar/CMAG, Wesleyan)\n\nPolitical-spend tracking is dominated by four houses with different methods and totals: AdImpact (cycle projections; $11.6B for 2026), Borrell Associates (local-ad forecasts), Kantar/CMAG (ad occurrence/content tracking), and the academic Wesleyan Media Project (content and tone analysis).\n\n- **AdImpact** — the most-cited cycle projector; **$11.6B for 2026** (revised from $10.8B), **CTV ~$2.5B**; its 2024 projection of $10.7B came within ~5% of the actual $11.2B [1][2]. **A caution:** AdImpact sells to media buyers and sellers, so its bullish CTV-growth narrative serves a customer base that benefits from CTV's rise — though its track record lends credibility.\n- **Borrell Associates** — local-ad specialist; forecasts **local CTV/OTT at $3.6B for 2026 (+9.7%)** and ~$9B in 2026 midterm political spend in its framing; notes **72% of local advertising is now digital** [10].\n- **Kantar / CMAG (Campaign Media Analysis Group)** — the long-standing ad-occurrence and content-tracking vendor.\n- **Wesleyan Media Project** — the **academic** content/tone tracker, the independent counterweight to vendor spend numbers.\n\nThe **so what for measurement:** no single currency or spend number is canonical, so every firm in this layer sells a subscription, and the *disagreement itself* is the business model. The academic Wesleyan and the certified currencies are the independent checks on vendor and platform self-reporting.\n\n---\n\n# PART FIVE — AGENCIES, CONSULTANTS, AND THE MONEY FLOW\n\nThe least-discussed but largest take in the chain sits here. Before a dollar reaches a DSP or a platform, it passes through a media-buying agency, and the agency's commission is the oldest margin in political advertising.\n\n## 5.1 The concentrated agency layer\n\nOpenSecrets' February 2026 analysis (\"the billion-dollar middlemen\") found a political ad-buying market dominated by a handful of firms. On the Democratic side, **Waterfront Strategies (the buying arm of GMMB) took in ~$858M in 2024**, with the Harris super PAC **Future Forward alone paying it ~$383M** [8]. **Bully Pulpit Interactive (BPI)**, an Obama-veteran Democratic digital/media firm, had received **$101M+ from the Harris and Biden campaigns** by mid-October 2024 [8]. **The structural asymmetry:** Democratic spend was *centralized* (Waterfront more than double the No. 2 vendor), while **Republican spend was spread across ~10 vendors each receiving $100M+** [8]. The **top five political vendors collectively captured ~$2.1B** in 2024 [8].\n\nGMMB (founded 1983) is a major Democratic *creative* firm working directly with candidate campaigns; Waterfront is its *placement* affiliate. On the Republican side, the comparable specialists include Targeted Victory and Something Else Strategies, though their 2024 dollar figures are less centralized and harder to pin to a single firm.\n\n## 5.2 The media-buying commission — the oldest take in the chain\n\nThe traditional political media-buying commission is **~15% of the gross buy** — a convention inherited from broadcast, where the agency books the time and keeps a percentage. This is *the* reason media-buying firms like Waterfront can take in hundreds of millions: on a $383M placement, even a fraction of 15% is enormous. **This figure is a long-standing industry convention, not a uniformly disclosed or audited rate** — some firms charge flat fees or lower percentages, and the modern programmatic stack adds DSP and data fees on top. Treat it as a convention rather than a per-firm audited figure. **It is the central \"who keeps the spread\" claim, and the one most in need of a firm, primary-source confirmation.**\n\n## 5.3 The full money flow (the \"who captures the dollar\" picture)\n\nPut the layers together, and a single political CTV dollar is taken against five times on its way to the impression:\n\n1. **Agency/consultant commission (~15% convention)** — the largest single take; captured before media is even bought.\n2. **DSP media take (~15–20%)** — The Trade Desk's inferred ~20% platform take; Madhive/Viant/MNTN comparable.\n3. **Voter-file + data/identity fees** — a CPM uplift or license for the partisan voter file (i360/TargetSmart/Catalist/L2) *plus* the Comscore/LiveRamp/Experian match-and-segment layer.\n4. **Platform inventory margin** — the streamer/OEM keeps its spread on the impression; political CPMs run **40%+ above cycle average in the final weeks** [13], and premium platforms (Hulu, Peacock, Paramount+) command **$35–80 CPM** versus FAST (Tubi, Pluto) at **$18–28 CPM** and mid-tier (Roku, Samsung) at **$25–45 CPM** [55].\n5. **Measurement subscription** — a separate fee to Nielsen/Comscore/iSpot/VideoAmp, and to spend trackers (AdImpact/Borrell).\n\nAcross tiers, political CTV CPMs in 2026 run roughly $18–80: premium streamers (Hulu/Peacock/Paramount+) at $35–80, mid-tier (Roku/Samsung) at $25–45, and FAST (Tubi/Pluto) at $18–28, with programmatic political CPMs spiking 40%+ above cycle average in the final weeks of 2024 [55][13]. In swing states (Georgia, Pennsylvania, Arizona), CTV CPMs rose ~8% year-over-year in the 2024 season and inventory tightened, because political money concentrates geographically (13 states = 67% of 2024 cycle spend) and temporally (51% of spend in the final eight weeks) [56].\n\n**The punchline:** the platform's headline CPM is *not* what the campaign pays. Stack the agency commission, the DSP take, and the data fees on top, and the effective cost to reach a voter runs materially higher than any single layer's quoted rate. No one party \"keeps the spread.\" The spread is sliced five ways, and the largest single slice is the oldest one: the agency commission.\n\n---\n\n# PART SIX — THE MOTIVE-AWARE READ: WHOSE NUMBERS, WHOSE BOOK\n\nOne discipline matters above all in this market: almost every headline number comes from a party that profits from your believing it. Here is a register of the claims to discount, and why:\n\n- **\"CTV reaches households 36% more efficiently than linear\" (The Trade Desk).** This is TTD's marketing for its own pipe; the efficiency claim depends on frequency-capping assumptions TTD controls. Treat as a vendor effectiveness claim — the effectiveness debate is taken up later, where independent (academic, measurement-currency) corroboration is the test [38].\n- **\"Political is only ~3.1% of total media spend, don't worry\" (The Trade Desk).** Reassures commercial advertisers *and* downplays the CPM disruption TTD's own platform helps create. A framing that serves TTD's book on both sides simultaneously [11].\n- **\"$2.5B and the only growing channel\" (AdImpact).** Likely accurate (AdImpact's 2024 projection landed within ~5%), but AdImpact sells to the buyers and sellers who benefit from CTV's rise; the bullish-CTV narrative is also a sales narrative [1].\n- **Match-rate claims (Experian ~95% with Samsung; i360 1,800 data points; TargetSmart 208M voters).** These are vendor-published capability claims, not independently audited. Useful as evidence of what each vendor *offers*, not proof of real-world targeting accuracy [30][47][49].\n- **\"#1 TV viewing dataset worldwide\" (Samsung Ads).** A superlative no third party certifies; read as positioning [29].\n- **Platform political-ad-archive disclosures (Roku).** Real transparency, but *partial* — payer and creative, not spend/targeting/impressions in bulk — so the archive evidences good faith more than it enables full independent audit [22][23].\n- **Partisan-data framing (TargetSmart \"the leading… for Democratic campaigns\"; i360 Republican).** Here the partisan self-description is *accurate and structural* — the market really is party-segmented — so the \"book\" and the fact coincide. The caution is the reverse: don't treat a partisan vendor's *capability* claims (segment quality, lift) as neutral.\n\nThe independent counterweights — the **Wesleyan Media Project** (academic content/tone), the **certified measurement currencies** (Comscore/iSpot/VideoAmp under JIC/MRC audit), and **AdImpact/Borrell** spend tracking (triangulated against each other despite differing totals) — are the reality checks on platform and vendor self-reporting. When a vendor claim and an independent source disagree, the independent source wins on facts. The vendor claim survives only as evidence of *what the vendor asserts*.\n\n---\n\n## Synthesis: the market-map exhibit in words\n\nDraw this as a single market map and it has five horizontal bands and a left-to-right money flow:\n\n- **Band 1 — Inventory (impression owners):** Accept = Roku, Hulu/Disney, YouTube/Google, Peacock, Paramount+/Pluto, Tubi/Fox, Samsung, LG, Vizio/Walmart. **Refuse = Amazon Prime Video, Netflix, Disney+, Apple TV** (the structural scarcity driver).\n- **Band 2 — DSP/specialist:** The Trade Desk (generalist scale), Madhive (local/political specialist), Viant, MNTN, Basis, Yahoo DSP, Cross Screen, Tuesday Digital.\n- **Band 3 — Data/identity (partisan-split):** i360 (R) | TargetSmart, Catalist (D) | L2, Aristotle (bipartisan) → riding Comscore predictive audiences and LiveRamp/Experian/TransUnion identity.\n- **Band 4 — Measurement:** Nielsen vs. Comscore/iSpot/VideoAmp (currency); AdImpact/Borrell/Kantar-CMAG/Wesleyan (spend & content tracking).\n- **Band 5 — Agencies/consultants:** Waterfront/GMMB, Bully Pulpit (D, centralized) | ~10 GOP firms (R, distributed).\n\n**Money flows right-to-left in claims of value and left-to-right in dollars.** The campaign pays the agency (−15% convention), which directs a DSP (−15–20%), which buys platform inventory (the platform keeps its CPM margin), with data fees (Band 3) and measurement subscriptions (Band 4) layered throughout. It is the same dollar AdImpact counts at the top — $2.5B of it on CTV in 2026 — but it is *recognized as revenue* at five different points by five different sets of firms.\n\n---\n\n## Open Questions\n\n1. **What is the true, disclosed media-buying commission today?** The ~15% figure is an inherited convention. With programmatic disaggregation, do top political buyers still take 15%, or has it compressed to flat fees / lower percentages? This is the central margin question and needs a primary-source or named-practitioner confirmation.\n2. **What share of the $2.5B 2026 CTV dollar does each platform actually capture?** AdImpact gives the channel total but not a platform-by-platform split. Among Roku, Hulu, YouTube, and the FAST services, who takes the largest political CTV share?\n3. **Is the Basis–LG exclusivity still live in 2026?** It was scoped \"through the end of 2024.\" What is the current LG political-CTV activation arrangement?\n4. **What happened to OneView's residual business and Roku's DSP ambitions?** OneView is sunsetting; is it fully wound down by 2026, and has the Roku–Trade Desk tie-up replaced it for enterprise political buyers?\n5. **Will any refuser open up before 2028?** Netflix faces lobbying and Senate attention; if Netflix, Amazon, or Disney+ accepted political ads, the CPM-premium structure on the \"yes\" platforms would partially unwind. What is the probability and timing?\n6. **How much does the partisan data split distort pricing?** Does a Democratic campaign buying through TargetSmart/Catalist pay materially different data CPMs than a Republican one through i360 — and does the bipartisan L2/Aristotle layer arbitrage that?\n7. **What are the actual take-rates of Madhive, Viant, and MNTN** versus The Trade Desk's inferred ~20%? Local/political specialists may take more (bundled service) or less (volume).\n8. **Does Walmart's ownership change Vizio's political-ad posture?** A retailer with closed-loop purchase data now owns a major ACR asset — does that create new political-targeting products, or new restrictions?\n\n---\n\n## Sources\n\n1. AdImpact, \"AdImpact's Political Projections Report 2025–2026\" (2026 cycle $10.8B→$11.6B revised; CTV ~$2.5B; \"up >20% from 2022\"; 2024 projection within 5% of actual). https://adimpact.com/blogs/adimpacts-political-projections-report-2026 — Tier 5 (industry data vendor; sells to buyers/sellers — bullish-CTV book noted). Accessed 2026-06-23.\n2. The Current (The Trade Desk), \"CTV set to fuel record U.S. political spending in 2026\" (CTV $2.48B for 202 $326 Million\" (2024 cycle channel detail). https://www.insideradio.com/free/adimpact-s-final-count-says-radio-gained-326-million-in-political-ads-during-2024-cycle/ — Tier 5 trade. Accessed 2026-06-23.\n10. Barrett Media / Radio Ink, \"72% of Local Advertising Now Spent on Digital, New Borrell Data\" + \"Borrell Sees Local Ad Spend Up 3% in 2026\" (local CTV/OTT $3.6B 2026 +9.7%; ~$9B 2026 midterm political). https://barrettmedia.com/2026/05/05/local-advertising-digital-new-borrell-data/ — Tier 5 trade citing Borrell. Accessed 2026-06-23.\n11. The Trade Desk (X / resource desk), 2024 (political ~3.1% of total U.S. media spend). https://www.thetradedesk.com/us/resource-desk/2024-ctv-guide-for-non-political-advertisers — Tier 1 vendor claim. Accessed 2026-06-23.\n12. TV Tech / AdImpact (13 states = $7.4B = 67% of 2024 cycle spend). — Tier 5 trade. Accessed 2026-06-23.\n13. Basis Technologies, \"2024 US Elections Digital Advertising Trends\" (programmatic political CPMs +40% above average Oct–Nov; video ~double in Nov). https://basis.com/blog/2024-us-elections-digital-advertising-trends-ctv-drove-programmatic-ad-spending — Tier 5 vendor. Accessed 2026-06-23.\n14. Campaigns & Elections / AAPC + reporting on Netflix (AAPC condemnation; Sarandos Feb 2026 Senate testimony). — Tier 5 / Tier 1 testimony reference. Accessed 2026-06-23.\n15. Hollywood Reporter, \"Hulu Political Issue Ads Review\" + NPR, July 2022 (Hulu reverses, accepts political ads aligned to Disney policy). https://www.hollywoodreporter.com/business/digital/hulu-political-issue-ads-review-1235187325/ — Tier 4. Accessed 2026-06-23.\n16. IndieWire, \"Disney Confirms Hulu Will Now Accept Political Ads\" (Disney+ continues to refuse). https://www.indiewire.com/features/general/disney-hulu-political-ads-roe-v-wade-1234745756/ — Tier 4. Accessed 2026-06-23.\n17. AdExchanger, \"Roku Relaunches Dataxu As OneView\" (DataXu acquired 2019, relaunched OneView 2020). https://www.adexchanger.com/digital-tv/roku-relaunch
