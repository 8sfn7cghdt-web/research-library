https://research.mountain.com/trends/the-state-of-political-ad-spending-on-connected-tv/ (Tier 6 vendor + Tier 5 trade; CTV 19% of digital in 2020 up from 5% in 2018; CTV CPMs ~3.5x other devices; political = top CTV category in 2020). Accessed 2026-06-23.\n11. Digiday, \"As political ad spend faucet opens, CTV media stands to be a major winner,\" Aug 15, 2024. https://digiday.com/media-buying/as-political-ad-spend-faucet-opens-ctv-media-stands-to-be-a-major-winner/ (Tier 5 trade; 2022 CTV ~$1.5B projected/$1.09B realized; presidential $385M spent + $322M scheduled as of Aug 8 2024; eMarketer 28% digital / 45% CTV-of-digital; Assembly ~$12B cycle est; ~65% in final 8–10 weeks). Accessed 2026-06-23.\n12. Campaigns & Elections, \"Political Ad Spending Expected to Hit Nearly $11 Billion in 2026,\" Sep 5, 2025, reporting AdImpact. https://campaignsandelections.com/industry-news/report-predicts-record-ad-spending-for-2026-midterms/ (Tier 5 trade; total $10.8B/+20% vs 2022, CTV $2.5B/23% share/+2% vs 2024, broadcast ~50%, cable $1.29B; CA $1.1B, MI ~$1B, TX/GA/NC $550M+; John Link quote). Accessed 2026-06-23.\n13. Washington Post, \"Kamala Harris's campaign plans $370 million in fall TV and digital ads,\" Aug 17, 2024. https://www.washingtonpost.com/politics/2024/08/17/kamala-harris-ad-spending/ (Tier 4; $370M reservation = ~$170M TV + >$200M digital incl. CTV; Hulu, Roku, YouTube, Paramount+, Spotify, Pandora). Accessed 2026-06-23.\n14. Axios, \"Harris campaign plans initial $370 million in ads,\" Aug 17, 2024; Hollywood Reporter and Deadline corroborating, Aug 2024. https://www.axios.com/2024/08/17/harris-campaign-370-million-ads (Tier 4/5; corroborates $370M / $200M+ digital / CTV-platform composition; \"largest in history\" framing). Accessed 2026-06-23.\n15. Search Engine Land, \"Decoding ad spend: Key insights from the 2024 presidential election,\" Heather Brousell, Nov 12, 2024. https://searchengineland.com/ad-spend-insights-2024-presidential-election-448181 (Tier 5 trade; Dems +43,000 CTV/OTT airing advantage; Dems 59% vs GOP 89% battleground concentration; Harris outspent Trump ~$460M overall). Accessed 2026-06-23.\n16. DSPolitical, \"New Report: Swing Votes Stream / CTV and the 2024 Election,\" Dec 17, 2024. https://www.dspolitical.com/press-releases/swing-votes-stream-report/ (Tier 6 — Democratic-aligned vendor press release; \"Moneyball\"/\"half the media Trump ran\" quote attributed to Trump op by Mark Jablonowski; 42% prefer streaming-with-ads vs 28% cable, n=1,008; position-evidence only). Accessed 2026-06-23.\n17. PPC Hero, \"Unpacking the Data Behind Trump and Harris' Presidential Election Ad Spending.\" https://ppchero.com/unpacking-the-data-behind-trump-and-harris-presidential-election-ad-spending/ (Tier 6/7 secondary blog; source of viral 6.3M vs 44.7M persuadables and $80M streaming claims — UNVERIFIED, no primary trace). Accessed 2026-06-23.\n18. Campaigns & Elections, \"To Reach Persuadable Voters, Look to CTV: Report.\" https://campaignsandelections.com/industry-news/to-reach-persuadable-voters-look-to-ctv/ (Tier 5/6; \"83% of registered voters reachable via ad-supported CTV\" — a reach statistic, not a spend or persuasion figure). Accessed 2026-06-23.\n19. Axios, \"2026 midterm elections: Ad spending to set new record,\" Sep 2, 2025; CNN, \"The 9 most competitive Senate races of the 2026 midterms,\" Apr 10, 2026. https://www.axios.com/2025/09/02/2026-midterm-election-political-ads-spending (Tier 4/5; NC most expensive contest; competitive Senate map GA/ME/MI/NH/NC). Accessed 2026-06-23.\n20. Madhive / Experian / trade syntheses on 2024 down-ballot CTV. https://www.experian.com/blogs/marketing-forward/connected-tv-political-advertising-in-2024/ and AdImpact race-level data via [4] (Tier 5/6; presidential $3.2B, Senate $2.7B/6 races >$200M, House $1.7B/34 races >$20M; ~75/25 down-ballot split; ZIP/district-level CTV targeting). Accessed 2026-06-23.\n21. The Trade Desk / The Current and Digiday on CTV reach efficiency, 2024. https://digiday.com/media-buying/as-political-ad-spend-faucet-opens-ctv-media-stands-to-be-a-major-winner/ (Tier 5/6 — interested party; TTD frequency-capping ~36% more household reach vs linear; reach-extension framing). Accessed 2026-06-23.\n22. Digiday, \"Ad-tech firms and political agencies prepare for another year of spending heavily on CTV,\" Oct 27, 2023. https://digiday.com/media-buying/ad-tech-firms-and-political-agencies-prepare-for-another-year-of-spending-heavily-on-ctv/ (Tier 5 trade; The Trade Desk discloses election cycles boost its revenue; Xandr political-ad ban; 50-50 linear/streaming time but only ~14% of dollars in CTV). Accessed 2026-06-23.\n23. OpenSecrets News, \"The billion-dollar middlemen: How a handful of firms dominate political ad buying,\" Feb 12, 2026 (also syndicated via Tucson Sentinel). https://www.opensecrets.org/news/2026/02/this-handful-of-firms-dominates-political-ad-buying/ (Tier 3/4 — OpenSecrets analysis of primary FEC data; top 5 vendors ~$2.1B; Waterfront ~$858M; Dem buying centralized vs GOP ~10 firms >$100M; commission incentives; Waterfront ~10x growth since 2012). Accessed 2026-06-23.\n24. OpenSecrets, Vendor/Recipient Profile: Waterfront Strategies, cycle 2024 (FEC primary data). https://www.opensecrets.org/orgs/waterfront-strategies/summary?id=D000069803 (Tier 1/3 — FEC-sourced; Future Forward ~$383M ≈ half of Waterfront's receipts; ~90% from Future Forward USA + WinSenate + House Majority PAC). Accessed 2026-06-23.\n25. OpenSecrets / Center for Public Integrity and TrinityP3 on media-consultant commission structure. https://publicintegrity.org/politics/elections/airtime-is-money/ (Tier 4/5; historical ~15% commission negotiable to ~4.5% on large buys; commission rewards spend and creative-repurposing — conflict of interest). Accessed 2026-06-23.\n26. Axios, \"New marketplace launches to shift more political ads to streaming,\" Feb 27, 2024; Adweek and StreamTV Insider corroborating. https://www.streamtvinsider.com/advertising/fox-employs-madhives-new-local-ctv-political-ad-marketplace (Tier 4/5; Madhive local CTV political marketplace launch, Fox Television Stations first client). Accessed 2026-06-23.\n27. Madhive, \"Madhive Launches Local CTV Marketplace For Political Advertising,\" Feb 2024 (newsroom/PRWeb). https://www.madhive.com/newsroom/madhive-launches-local-ctv-marketplace-for-political-advertising (Tier 1 — company claim, not independent proof; data partners TargetSmart/Experian/L2/DataTrust, 210 DMAs, 24-hour onboarding; status as current product flagged for re-confirmation). Accessed 2026-06-23.\n28. Kalla, Joshua L. & Broockman, David E., \"The Minimal Persuasive Effects of Campaign Contact in General Elections: Evidence from 49 Field Experiments,\" *American Political Science Review*, 2018; and follow-on PNAS work (2024) on practitioners poorly predicting persuasive messages. https://www.cambridge.org/core/journals/american-political-science-review/article/abs/minimal-persuasive-effects-of-campaign-contact-in-general-elections-evidence-from-49-field-experiments/753665A313C4AB433DBF7110299B7433 (Tier 2 peer-reviewed; average general-election persuasion effect ≈ zero; effects only in narrow conditions). Accessed 2026-06-23."}, {"order": 6, "file": "06_Regulation_Privacy_And_Risk.md", "title": "Regulation, Privacy, and Risk — The Streaming Loophole", "summary": "", "body": "# Regulation, Privacy, and Risk — The Streaming Loophole\n\n> **Bottom line.** The single most important regulatory fact about political CTV is that **streaming falls into a gap by design, not by oversight.** The scaffolding built around broadcast political advertising over ninety years — equal time, reasonable access, the lowest-unit-rate price control, and the public political file — exists because broadcasters are FCC *licensees* using public spectrum. Streaming platforms hold no license, so **none of it reaches them.** What survives across all media is thin: the FEC's \"stand by your ad\" disclaimer for *candidate* ads, a 2022 internet-disclaimer rule, and FTC truth-in-advertising. Issue ads, the public-file transparency layer, and price protection simply vanish on CTV. Into that federal vacuum a **state patchwork** has rushed — Washington's disclosure law survived a $35M Meta challenge at its Supreme Court while Maryland's near-identical law was struck down on the First Amendment in *WaPo v. McManus* — and a wave of **state AI-deepfake laws** (now ~30 states) is being beaten back in court (California's AB 2839 enjoined; Minnesota's stayed). The FCC's own 2024 attempt to require AI disclosure could only ever bind broadcast and radio, and it is now effectively dead under Chairman Carr. Meanwhile **voter data, the rocket fuel of CTV targeting, is largely carved out of state privacy laws.** The net: the most sophisticated, voter-level-targeted political ads in history run on the least-regulated, least-transparent screen in the house.\n\n---\n\n## The Regulatory Map in One Exhibit\n\nStart with the answer. The table below is the compliance matrix this entire document elaborates: each rule, what it does, who it binds, and — the load-bearing column — **whether it reaches a CTV/streaming political ad.**\n\n| Rule / regime | Statute / authority | What it does | Binds broadcasters? | Reaches CTV/streaming? |\n| --- | --- | --- | --- | --- |\n| **Equal opportunities (\"equal time\")** | §315, 47 U.S.C. §315 | If a station sells/gives time to one qualified candidate, it must offer equal terms to opponents | Yes | **No** |\n| **Reasonable access** | §312(a)(7), 47 U.S.C. §312(a)(7) | Stations must sell reasonable time to federal candidates; refusal risks the license | Yes (federal candidates) | **No** |\n| **Lowest unit charge (LUC)** | §315(b), 47 U.S.C. §315(b) | In the 45/60-day windows, candidates pay the *lowest* rate the station charges any advertiser | Yes | **No** |\n| **Political file (public file)** | §315(e), 47 C.F.R. §73.1943 | Public record of every candidate/issue ad request, rates, and sponsor — online at the FCC | Yes (+ cable/DBS) | **No** |\n| **Sponsorship identification (on-air)** | §317, 47 U.S.C. §317; 47 C.F.R. §73.1212 | On-air disclosure of who paid for sponsored content | Yes (+ cable) | **No** |\n| **FEC disclaimer (\"stand by your ad\" / \"paid for by\")** | 52 U.S.C. §30120; 11 C.F.R. §110.11 | Candidate ads carry an audio+visual \"I approved this message\"; all carry a payor line | Applies to the *ad*, any medium | **Partly — yes for candidate/express-advocacy paid ads; the 2022 rule extends to paid internet ads** |\n| **FTC truth-in-advertising** | 15 U.S.C. §45 (FTC Act §5) | Bars deceptive commercial advertising | n/a (advertisers) | **Limited — political speech is largely outside FTC §5** |\n| **State digital-ad disclosure/recordkeeping** | e.g., WA RCW 42.17A; NY Election Law; NJ, CA | Disclaimer + ad-archive/recordkeeping for online ads | n/a | **Yes where enacted — but a patchwork** |\n| **State AI/deepfake ad laws** | e.g., CA, MN, TX, MI, WA | Disclosure or ban of AI-altered election content | n/a | **Yes where enacted — but heavily litigated** |\n\n*Exhibit: the broadcast protections — equal time, reasonable access, price control, the public file — all stop at the licensee boundary; only the FEC disclaimer and a thin state patchwork follow the ad onto the streaming screen.*\n\nThe rest of this document walks each row, decodes the acronyms, and dates the current status of every rule.\n\n---\n\n## 1. The FCC Gap — Why the Broadcast Rulebook Stops at the Set-Top Box\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 432\" role=\"img\" aria-label=\"A compliance matrix titled The Regime Stops at the Internet's Edge. Five rows of FCC political-advertising obligations are checked across three columns: Broadcast, Cable, and CTV / Streaming. The obligations are Equal-time (47 U.S.C. section 315), Reasonable access (section 312(a)(7)), Lowest-unit-charge, the public political file, and the FCC's proposed 2024 AI-ad disclosure. In the Broadcast column all five obligations apply, shown as filled green checks. In the Cable column only sponsor-identification and political-file duties partly apply, shown as amber half-marks; the full section 315 equal-time, reasonable-access, and lowest-unit-charge regime and the AI proposal do not. In the CTV / Streaming column none of the five apply, shown as open crossed circles, because CTV platforms are not FCC licensees and the FCC's 2024 AI-ad proposal explicitly could not reach streaming. A footer notes that what still reaches CTV is only FEC disclaimers on candidate ads, FTC truth-in-advertising, and a patchwork of state disclosure and AI laws. The CTV column is visibly empty against the full Broadcast column.\">\n<text x=\"350\" y=\"30\" text-anchor=\"middle\" font-size=\"15\" class=\"t-serif\" letter-spacing=\"2.5\" font-weight=\"bold\">THE REGIME STOPS AT THE INTERNET'S EDGE<\/text>\n<text x=\"350\" y=\"49\" text-anchor=\"middle\" font-size=\"10.5\" class=\"t-muted\" font-style=\"italic\">the FCC political-broadcasting regime binds licensees and reaches neither streaming's price nor its transparency<\/text>\n<text x=\"44\" y=\"84\" font-size=\"11\" class=\"t-mono\" style=\"fill:var(--muted)\">FCC OBLIGATION<\/text>\n<g>\n<rect x=\"318\" y=\"66\" width=\"106\" height=\"24\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.25\" style=\"stroke:var(--border)\"/>\n<text x=\"371\" y=\"82\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-serif\" font-weight=\"bold\" letter-spacing=\"1\">BROADCAST<\/text>\n<rect x=\"430\" y=\"66\" width=\"106\" height=\"24\" rx=\"3\" class=\"f-panel\" stroke-width=\"1.25\" style=\"stroke:var(--border)\"/>\n<text x=\"483\" y=\"82\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-serif\" font-weight=\"bold\" letter-spacing=\"1\">CABLE<\/text>\n<rect x=\"542\" y=\"66\" width=\"118\" height=\"24\" rx=\"3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" style=\"stroke:var(--accent)\"/>\n<text x=\"601\" y=\"82\" text-anchor=\"middle\" font-size=\"11.5\" class=\"t-serif\" font-weight=\"bold\" letter-spacing=\"1\" style=\"fill:var(--accent)\">CTV / STREAMING<\/text>\n<\/g>\n<g cv-rise style=\"--d:.04s\">\n<rect x=\"40\" y=\"98\" width=\"620\" height=\"46\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"98\" width=\"6\" height=\"46\" class=\"f-t5\"/>\n<text x=\"60\" y=\"118\" font-size=\"11.5\" font-weight=\"bold\">Equal-time rule<\/text>\n<text x=\"60\" y=\"134\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--muted)\">47 U.S.C. §315<\/text>\n<circle cx=\"371\" cy=\"121\" r=\"11\" class=\"f-t3\"/>\n<path d=\"M366,121 l3.5,3.8 l6.5,-7.6\" fill=\"none\" stroke-width=\"2\" class=\"t-inv\" style=\"stroke:var(--bg)\"/>\n<path d=\"M478,116 a6,6 0 1 1 -0.01,0\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--t2)\"/>\n<path d=\"M478,116 a6,6 0 0 1 0,12 z\" style=\"fill:var(--t2)\"/>\n<circle cx=\"601\" cy=\"121\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M595,115 l12,12 M607,115 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<\/g>\n<g cv-rise style=\"--d:.08s\">\n<rect x=\"40\" y=\"148\" width=\"620\" height=\"46\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"148\" width=\"6\" height=\"46\" class=\"f-t1\"/>\n<text x=\"60\" y=\"168\" font-size=\"11.5\" font-weight=\"bold\">Reasonable access<\/text>\n<text x=\"60\" y=\"184\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--muted)\">47 U.S.C. §312(a)(7)<\/text>\n<circle cx=\"371\" cy=\"171\" r=\"11\" class=\"f-t3\"/>\n<path d=\"M366,171 l3.5,3.8 l6.5,-7.6\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--bg)\"/>\n<circle cx=\"483\" cy=\"171\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M477,165 l12,12 M489,165 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<circle cx=\"601\" cy=\"171\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M595,165 l12,12 M607,165 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<\/g>\n<g cv-rise style=\"--d:.12s\">\n<rect x=\"40\" y=\"198\" width=\"620\" height=\"46\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"198\" width=\"6\" height=\"46\" class=\"f-t2\"/>\n<text x=\"60\" y=\"218\" font-size=\"11.5\" font-weight=\"bold\">Lowest-unit-charge<\/text>\n<text x=\"60\" y=\"234\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--muted)\">capped pre-election ad price<\/text>\n<circle cx=\"371\" cy=\"221\" r=\"11\" class=\"f-t3\"/>\n<path d=\"M366,221 l3.5,3.8 l6.5,-7.6\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--bg)\"/>\n<circle cx=\"483\" cy=\"221\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M477,215 l12,12 M489,215 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<circle cx=\"601\" cy=\"221\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M595,215 l12,12 M607,215 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<\/g>\n<g cv-rise style=\"--d:.16s\">\n<rect x=\"40\" y=\"248\" width=\"620\" height=\"46\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"248\" width=\"6\" height=\"46\" class=\"f-t3\"/>\n<text x=\"60\" y=\"268\" font-size=\"11.5\" font-weight=\"bold\">Public political file<\/text>\n<text x=\"60\" y=\"284\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--muted)\">who bought what, for how much<\/text>\n<circle cx=\"371\" cy=\"271\" r=\"11\" class=\"f-t3\"/>\n<path d=\"M366,271 l3.5,3.8 l6.5,-7.6\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--bg)\"/>\n<path d=\"M483,266 a6,6 0 1 1 -0.01,0\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--t2)\"/>\n<path d=\"M483,266 a6,6 0 0 1 0,12 z\" style=\"fill:var(--t2)\"/>\n<circle cx=\"601\" cy=\"271\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M595,265 l12,12 M607,265 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<\/g>\n<g cv-rise style=\"--d:.20s\">\n<rect x=\"40\" y=\"298\" width=\"620\" height=\"46\" rx=\"3\" class=\"f-panel\" stroke-width=\"1\" style=\"stroke:var(--border)\"/>\n<rect x=\"40\" y=\"298\" width=\"6\" height=\"46\" class=\"f-t4\"/>\n<text x=\"60\" y=\"318\" font-size=\"11.5\" font-weight=\"bold\">AI-ad disclosure<\/text>\n<text x=\"60\" y=\"334\" font-size=\"10\" class=\"t-mono\" style=\"fill:var(--muted)\">FCC proposed 2024<\/text>\n<circle cx=\"371\" cy=\"321\" r=\"11\" class=\"f-t3\"/>\n<path d=\"M366,321 l3.5,3.8 l6.5,-7.6\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--bg)\"/>\n<circle cx=\"483\" cy=\"321\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M477,315 l12,12 M489,315 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<circle cx=\"601\" cy=\"321\" r=\"10\" fill=\"none\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<path d=\"M595,315 l12,12 M607,315 l-12,12\" stroke-width=\"1.5\" class=\"s-t4\"/>\n<text x=\"601\" y=\"356\" text-anchor=\"middle\" font-size=\"8.5\" class=\"t-muted\" font-style=\"italic\">proposal could not reach streaming<\/text>\n<\/g>\n<rect x=\"40\" y=\"370\" width=\"620\" height=\"48\" rx=\"3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" style=\"stroke:var(--accent)\"/>\n<rect x=\"40\" y=\"370\" width=\"6\" height=\"48\" style=\"fill:var(--accent)\"/>\n<text x=\"60\" y=\"389\" font-size=\"10.5\" font-weight=\"bold\" style=\"fill:var(--accent)\" letter-spacing=\"0.5\">WHAT STILL REACHES CTV<\/text>\n<text x=\"60\" y=\"408\" font-size=\"10\" class=\"t-muted\">FEC disclaimers (candidate ads) · FTC truth-in-advertising · a patchwork of state disclosure &amp; AI laws — none of the five rules above.<\/text>\n<\/svg>\n<figcaption><strong>Fig. 5.<\/strong> CTV inherits the audience of television and none of its rules: the entire FCC political-broadcasting regime — equal time, lowest-unit-rate, the public political file — binds licensed broadcasters and stops dead at the internet's edge, so streaming's prices and its transparency answer only to FEC disclaimers, the FTC, and a thin state patchwork.<\/figcaption>\n<\/figure>\n\n\nThe Federal Communications Commission (FCC) regulates **broadcast licensees** — the radio and television stations that transmit over the public airwaves — because spectrum is a scarce public resource the government licenses. Streaming and connected-TV (CTV — television delivered over the internet rather than over the air or through a traditional cable subscription) platforms are **not** broadcast licensees. That single jurisdictional fact removes an entire regime of political-advertising protection.\n\nThe clearest authoritative statement of the gap comes from **Congressional Research Service (CRS) report R46516**, *Identifying TV Political and Issue Ad Sponsors in the Digital Age*, by Dana A. Scherer (September 9, 2020) — Congress's own nonpartisan analysis, and the spine of this section. It names the problem precisely: *\"When an entity other than an FCC licensee or cable operator delivers targeted political and issue advertising to TVs connected to the internet ('connected TVs'), sponsors need not disclose their identities to viewers\"* [1]. The report identifies the two presumptions on which the whole broadcast sponsorship regime rests — that *\"the electronic media regulated by the FCC are the distributors of advertisements\"* and that *\"employees of the regulated media entity … have ultimate control over the chain of advertising distribution\"* — then observes that programmatic, automated CTV ad delivery breaks both [1].\n\nWhat concretely disappears on streaming:\n\n**Equal opportunities — \"equal time\" (Section 315, 47 U.S.C. §315).** If a broadcast station sells or gives airtime to one legally qualified candidate, it must offer *equal opportunities* to all other qualified candidates for the same office. The FCC's equal-time jurisdiction is, by statute, limited to licensed broadcasters; streaming services are not governed by Section 315 [2]. A streaming platform may sell time to one candidate and refuse the opponent entirely.\n\n**Reasonable access (Section 312(a)(7), 47 U.S.C. §312(a)(7)).** Broadcast stations must afford *reasonable access* to **federal** candidates; a station that unreasonably refuses risks losing its license [2]. CTV platforms owe no such duty — they have, as one industry summary put it, *\"full discretion to accept or reject any political advertisement based on their own internal policies\"* [2].\n\n**Lowest unit charge (LUC) (Section 315(b)).** During the 45 days before a primary and 60 days before a general election, a broadcaster must charge a candidate the *lowest unit rate* it charges any commercial advertiser for the same class of time — a statutory price control that protects candidates from gouging when airtime is most valuable. **It does not apply to CTV, streaming, or digital advertising** [2]. On streaming, political demand can be — and is — priced at a premium, with no statutory floor. (The pricing consequences are developed in `03_Players_And_Market_Structure.md` and `05_Money_Strategy_And_Campaigns.md`; here the point is purely legal: the price protection is gone.)\n\n**The public/political file.** Broadcasters (and, by extension under §315(e) and FCC rules, cable and direct-broadcast-satellite operators) must keep a **political file** — a public record of who requested candidate and issue advertising, what they were charged, and who paid — and since 2017 must post it to the FCC's online political-file database [1]. This is the most important transparency artifact in all of political advertising: it is how journalists, opponents, and researchers see who is buying what. **CTV platforms maintain no equivalent public file.** Whatever transparency exists on streaming is voluntary and platform-defined (Section 5).\n\n> The broadcast regime was a deal struck around a scarce public resource: in exchange for a license to use the airwaves, a station accepts equal time, reasonable access, price control, and a public file. Streaming uses no public airwaves, holds no license, and inherits none of the deal.\n\nThe asymmetry is not an accident of drafting; courts have affirmed it is *constitutionally grounded*. In *Washington Post v. McManus* (Section 3), the Fourth Circuit explained that heightened disclosure burdens on broadcasters are justified by **spectrum scarcity**, and that the same burdens cannot be imposed on internet platforms because, given the *\"virtually unlimited capacity of the Internet,\"* the scarcity rationale *\"simply doesn't apply\"* [3]. So the gap is doubly entrenched. Congress wrote the broadcast rules to bind licensees, and the First Amendment makes it constitutionally harder to extend equivalent burdens to streaming.\n\n---\n\n## 2. What *Does* Apply Across Platforms — The FEC, the FTC, and the Limits of Each\n\nIf the FCC's broadcast regime stops at the licensee boundary, what follows the ad onto every screen? Less than campaigns' compliance departments would like, and almost all of it concentrated in the Federal Election Commission's disclaimer rules.\n\n### The FEC disclaimer — \"stand by your ad\" and \"paid for by\"\n\nThe Federal Election Commission (FEC) regulates the *financing and disclosure* of federal campaign activity — a different axis from the FCC's medium-based licensing. Its core consumer-facing rule is the **disclaimer** (52 U.S.C. §30120; 11 C.F.R. §110.11). For a candidate-authorized television or radio ad, the candidate must personally deliver the **\"stand by your ad\" statement** — *\"I am [name], a candidate for [office], and I approved this advertisement\"* — with, on TV, either a full-screen view of the candidate or a voiceover plus an image occupying at least 80% of the screen height [4]. Every covered communication must also carry a **\"paid for by\"** line identifying the payor [4].\n\nThe disclaimer attaches to the **ad**, not the medium. So a candidate's CTV spot, like a broadcast spot, must carry the \"I approved this message\" disclaimer and the \"paid for by\" line. This is the one meaningful federal transparency requirement that *does* cross onto streaming. But its reach has hard edges:\n\n- **It is keyed to \"public communications\" and express advocacy.** The disclaimer obligation runs to political-committee communications and to \"public communications\" that expressly advocate. The definition of \"public communication\" historically covered broadcast, cable, satellite, print, and mass mail — and the gap for paid internet ads went unfixed for over a decade.\n- **The 2022 internet-disclaimer rule closed part of that gap.** On December 1, 2022, the FEC finally approved a final rule (effective **March 1, 2023**) revising the definition of \"public communication\" to include *\"communications placed for a fee on another person's website, digital device, application, or advertising platform,\"* and requiring such ads to carry a disclaimer that *\"can be viewed without taking any action\"* — with an \"adapted\" abbreviated-disclaimer option (a payor statement plus a one-click/hover mechanism to the full text) where the full disclaimer won't fit [5], [6]. The rule lives at 11 C.F.R. §§100.26 and 110.11 [6]. For the first time, this pulled *paid* internet ads — including programmatic CTV bought as digital — formally within the disclaimer regime. The rulemaking (REG 2011-02) took **more than eleven years** to finish, a measure of how slowly federal rules track the medium [5].\n- **What it still does not reach:** organic/unpaid content, and — the structural limit — **issue ads that avoid express advocacy.** The FEC's jurisdiction is built on the *express advocacy* / *electioneering communication* distinction. \"Electioneering communications\" (ECs) are defined by statute as *broadcast, cable, or satellite* communications referring to a clearly identified federal candidate within 60 days of a general or 30 days of a primary [7]. **Internet and streaming communications are not \"electioneering communications\" at all** — the EC category never included them. So an issue ad on CTV that stops short of the \"magic words\" of express advocacy can fall outside both the EC regime and the disclaimer regime.\n\n### The FEC's structural paralysis\n\nEven where authority exists, the FEC is famous for using it sparingly. The Commission is a six-member body split 3–3 by party design, and on contested digital-ad questions it has frequently **deadlocked** — the reason the internet-disclaimer rule took eleven years, and the reason advocates look to Congress (the Honest Ads Act, Section 3) rather than to FEC rulemaking. The most relevant FEC online-ad rules date to 2006 and most of the underlying statute to 2002 — *\"before the internet played its current role in American politics\"* [7].\n\n### The FTC — present but largely inapplicable\n\nThe Federal Trade Commission (FTC) polices *deceptive commercial advertising* under §5 of the FTC Act (15 U.S.C. §45). But **political and issue speech is largely outside the FTC's truth-in-advertising authority**: its jurisdiction runs to \"commercial\" speech, and core political speech enjoys the highest First Amendment protection. So the FTC's relevance to political CTV is not as a content cop but as a **privacy and data-practices regulator** of the platforms (Section 6). Its September 2024 6(b) staff report on streaming-service data practices is its most consequential intervention in this space [8].\n\n> ⚠️ **Where this gets contested.** Advocates (Brennan Center, Campaign Legal Center) argue the FEC disclaimer floor is far too thin for CTV — it covers *who paid* but not *who was targeted, how, or for how much*, and it leaves issue ads largely uncovered. Free-speech groups (Institute for Free Speech, R Street) counter that compelled-disclosure burdens on internet speech raise serious First Amendment problems — a view the courts have repeatedly vindicated (Sections 3–4). Both are right about something: the federal floor is thin, *and* raising it has proven constitutionally treacherous.\n\n---\n\n## 3. The State Patchwork — Disclosure Laws and the *McManus* Problem\n\nInto the federal vacuum, states have legislated — unevenly. Roughly two dozen states now impose **sponsorship-disclaimer** requirements on online/digital political ads, and a smaller set impose **recordkeeping or public-archive** requirements meant to recreate, at the state level, something like the broadcast political file [9]. But this layer is a genuine patchwork. Coverage, thresholds, and survivability vary, and the constitutional ceiling discovered in *McManus* hangs over all of it.\n\n**Washington State** has the most robust regime. Under its Fair Campaign Practices Act (RCW 42.17A), commercial advertisers (including digital platforms) running state and local political ads must retain and, *on demand*, disclose the buyer's identity, the ad's targets, and total views [9]. Washington's law is the rare state disclosure mandate that has **survived** First Amendment attack. In *State v. Meta Platforms*, the state won a $35.2 million penalty (for 822 violations, trebled for intentional conduct, plus fees) for Meta's failure to produce political-ad records; the Court of Appeals upheld it on December 2, 2024, and on **June 18, 2026** the **Washington Supreme Court affirmed liability and rejected Meta's First Amendment challenge** (*State v. Meta Platforms*, No. 103748-1), with Justice Whitener writing that *\"enforcing disclosure requirements is an essential tool the State has available to educate and keep the public informed about how billions of dollars are spent to influence their votes\"* [10]. *(The decision was a fractured per curiam ruling: six of nine justices affirmed liability — three applying \"exacting\" and three \"deferential\" scrutiny — while three would have remanded on the penalty. With no majority for a different number, the $35,182,159.59 judgment stood affirmed by default, and the Whitener quote is from the three-justice lead opinion, not a unanimous court.)*\n\n**New York's Democracy Protection Act** (signed April 2018) amended the definition of \"political communication\" to include paid internet and digital ads, required a \"paid for by\" disclosure with civil penalties, and — notably — directed the **State Board of Elections to maintain a public online archive** of online political communications, retained for five years [11]. This is a state-level attempt at the public-file function the FCC's regime does not perform for streaming.\n\n**New Jersey's** Elections Transparency Act (2023) imposes disclaimer and recordkeeping duties: parties that accept payment to place a digital ad must keep records and require the purchaser to register with the state Election Law Enforcement Commission [9]. **California** maintains digital-disclosure and recordkeeping rules under its Political Reform Act framework, and several other states (e.g., **Connecticut**, which extended its attribution rules to internet video and audio) have layered digital requirements onto older disclaimer statutes [9].\n\n### The cautionary tale: *Washington Post v. McManus*\n\nMaryland set the constitutional ceiling on all of this. Its **Online Electioneering Transparency and Accountability Act** (2018) required online platforms to (1) **publish** — within 48 hours — the identity of each political-ad purchaser, who controlled the purchaser, and the amount paid, displayed for up to a year; and (2) **retain records** for state inspection on 48 hours' notice [12]. A coalition of news publishers led by *The Washington Post* sued.\n\nIn **December 2019**, a unanimous Fourth Circuit panel in *The Washington Post v. McManus* struck the law down [3], [12]. Its reasoning is the template every state disclosure law must now survive:\n\n- The law was a **content-based** burden that **singled out political speech**, triggering heightened scrutiny.\n- Both the publication and inspection requirements **compelled speech** — forcing publishers *\"to 'speak' when they otherwise might not want to,\"* which the court called *\"a problematic step\"* in part because the First Amendment protects anonymous political speech [3].\n- The court declined to decide between strict and \"exacting\" scrutiny because the law **failed even the more forgiving exacting-scrutiny standard** [3].\n- And — the point that explains the entire FCC gap — the court **distinguished broadcasters**: their heightened disclosure obligations are justified by **spectrum scarcity**, a rationale that *\"simply doesn't apply\"* to the *\"virtually unlimited capacity of the Internet\"* [3].\n\n> *McManus* is why the streaming gap is not easily closed by states either. It is one thing to require a broadcaster — a licensee on public spectrum — to keep a public file. It is constitutionally another to compel a news platform on the open internet to do the same.\n\nStates have drawn one lesson from the Washington/Maryland split: a **demand-on-request recordkeeping** model (Washington) is more defensible than a **mandatory-self-publication** model (Maryland). But the line is contested, and a CTV-specific public file remains legally unsettled and practically nonexistent.\n\n---\n\n## 4. AI-Content Disclosure — The Fastest-Moving and Most-Litigated Front\n\nGenerative AI turned a slow regulatory question into an urgent one, and produced both the FCC's most consequential streaming-gap admission and the most active First Amendment litigation in the field.\n\n### The FCC's 2024 AI proposal — and its built-in dead end\n\nOn May 22, 2024, FCC Chairwoman Jessica Rosenworcel proposed, and on **July 25, 2024 the FCC released**, a Notice of Proposed Rulemaking (NPRM) to require **broadcast radio and television stations** airing political ads to disclose — on-air and in the political file — when an ad contains *\"AI-generated content\"* [13]. The proposal is **disclosure-only**; it does not ban AI content, an approach the FCC itself flagged would raise *\"significant First Amendment concerns\"* [13].\n\nIts defining feature is an **admitted inability to reach streaming.** As PBS reported, *\"the nation's top telecommunications regulator would only have authority over TV, radio and some cable providers. The new rules, if adopted, would not cover the tremendous growth in advertising on digital and streaming platforms\"* [14]. A Rosenworcel spokesperson conceded the ceiling: *\"This proposal offers the maximum transparency standards that the commission can enforce under its jurisdiction\"* [14]. The NPRM passed 3–2 on party lines. Then-Commissioner **Brendan Carr** dissented hard, calling it *\"as misguided as it is unlawful\"* and warning it would create exactly the broadcast-vs-streaming inconsistency the gap implies [13], [15].\n\n**Going-concern status (June 2026): the rule is effectively dead.** Carr became FCC Chairman on January 20, 2025, the day of Trump's second inauguration [15]. He opposed the NPRM as a commissioner; as chair, he has let it stall — the rulemaking has not advanced to a final rule, and analysts assessed he would *\"scale back or even scuttle\"* it [15]. As of this writing the AI-disclosure NPRM remains a non-finalized 2024 proposal that the current Commission is not advancing. Even the broadcast-only half of AI disclosure is unrealized at the federal level.\n\n### The state AI-deepfake laws — and the courts pushing back\n\nStates moved faster and broader than the FCC, and crucially their laws *can* reach streaming and online ads. By the 2024 election ~20 states had enacted election-deepfake laws; counting 2024–2025 activity the total is now on the order of **30 states**. Most use a **labeling/disclosure** model (e.g., \"this ad was generated or substantially altered using AI\"); a few — California, Minnesota, Texas — took the **prohibition** approach [16], [17]. R Street's March 2025 analysis counted *\"17 states [that] imposed a labeling requirement while three — California, Minnesota, and Texas — took the prohibition approach\"* [17]. Michigan, Washington, Florida, Arizona, New York and others sit in the labeling camp [16].\n\nThe prohibition-model laws are losing in court:\n\n- **California — AB 2839** (\"Elections: deceptive media in advertisements,\" 2024) purported to bar election communications that use AI to portray candidates *\"doing or saying something that the candidate did not do or say.\"* In *Kohls v. Bonta* (E.D. Cal.), Judge Mendez first enjoined it in October 2024, then on **August 29, 2025 granted summary judgment for the plaintiffs and permanently enjoined enforcement**, finding the law could not survive strict scrutiny and that even *\"deliberate lies\"* remain protected absent a showing of cognizable harm [18]. (California's companion AB 2655, the \"Defending Democracy from Deepfake Deception Act,\" and the synthetic-performer disclosure laws faced parallel challenges.)\n- **Minnesota's** criminal election-deepfake statute is under sustained attack. A parody-creator/legislator challenge was dismissed for standing in January 2025; **X Corp.** then sued, and on **December 2, 2025** Judge Provinzino ruled X lacked Article III standing for its Section 230 pre-enforcement claim — but the **First Amendment challenge remains live (stayed)** [19]. Plaintiffs have pressed the Eighth Circuit over the law's lack of a parody exception [19].\n\n> ⚠️ **Where this gets contested.** Disclosure-model AI laws (label it) are surviving better than prohibition-model laws (ban it). Courts are treating outright bans on AI-altered political speech as content/viewpoint regulation failing strict scrutiny, while leaving more room for narrow disclosure mandates. The strategic takeaway for 2026: states that want enforceable AI rules are converging on **labeling**, not prohibition.\n\n### A new wildcard: federal preemption of state AI law\n\nOn **December 11, 2025**, President Trump signed an executive order, *\"Ensuring a National Policy Framework for Artificial Intelligence,\"* directing DOJ litigation, conditional funding, and administrative action against state AI laws, and tasking **Chairman Carr's FCC** to consider a federal AI disclosure/reporting standard that **preempts** conflicting state laws [20]. A prior legislative 10-year moratorium on state AI rules failed in Congress in 2025 [20]. Whether and how this EO reaches *election-specific* deepfake laws is unsettled. But it introduces a real possibility that the state AI-ad patchwork — the only layer currently reaching streaming — could be narrowed from above. That is the single most important regulatory wildcard heading into 2026.\n\n---\n\n## 5. Voter-Data Privacy — The Carve-Out That Powers the Whole Stack\n\nCTV's voter-level targeting runs on the voter file enriched with consumer data (the mechanics are in `02_The_Addressability_Stack.md`). The regulatory point here is stark: **the data that makes voter-level CTV targeting possible is largely exempt from the privacy laws that would otherwise govern it.**\n\n**Voter files are public records.** Almost every state (North Dakota is the notable outlier, with no registration) makes the voter registration list available — name, address, party, vote history — to campaigns and, in many states, to commercial vendors [21]. Commercial data brokers — **L2, TargetSmart, i360, Catalist, Aristotle** — buy and clean these files, then append hundreds of modeled and commercial variables: ethnicity, ideology, consumer behavior, and inference scores [21], [22]. The EFF documented CCPA-request disclosures revealing inference fields like *\"Voter Fraud Belief\"* and COVID-concern scores [22].\n\n**State comprehensive privacy laws leave political data outside their reach** — through two distinct mechanisms, which it is worth stating precisely because the CCPA does *not* carry an express \"political-organizations\" carve-out:\n\n1. **Voter-registration data** is excluded from the **California Consumer Privacy Act (CCPA)** as *\"publicly available\"* government-record information — not via a dedicated political exemption but because public records sit outside the statute's definition of protected personal information [23].\n2. **Campaigns and committees** largely escape the CCPA because political organizations (527s) are not \"businesses\" as the statute defines them, so they fall outside its coverage rather than being expressly exempted [23]. The express, dedicated **527 political-organization exemption** *\"added by Senate amendment … to avoid potential First Amendment complications\"* is a feature of the CCPA's **successor laws** (e.g., Virginia, Colorado, and Alabama's 2026 statute), not the CCPA itself.\n\nThe net effect is the same whichever door political data walks through — it is targeted without the consent mechanisms commercial advertisers must honor. The EFF summarized the consequence: state privacy laws *\"like California's CCPA typically exempt political activity,\"* so campaigns *\"operate in a largely unregulated space compared to commercial advertisers\"* — voter targeting proceeds *\"without the consent mechanisms required elsewhere\"* [22]. Put bluntly: **there is no federal law making voter registration lists private, and only a partial state-law floor; political data sits in a carve-out** [21]. A retailer needs consent to build the kind of behavioral profile a campaign can assemble on a voter from public records plus commercial append — with no opt-out.\n\n> The privacy regime treats your shopping history as more protected than your political profile. The same household-level data that a brand cannot freely exploit, a campaign can — and then aim at your television.\n\nThis carve-out is *why* the addressability stack is legally frictionless even as it is technically invasive, and it is the privacy story the corpus's drivers document (`07_Drivers_And_Forces.md`) carries into the forecast.\n\n### Platform self-governance — the de facto rulebook\n\nBecause binding law is thin, the **operative rules on CTV are the platforms' own policies** — which makes them going-concern claims worth dating:\n\n- **Roku** requires political advertisers to be **identified and verified** before launch, bans foreign-national funding, requires disclaimers compliant with state/federal law, **prohibits deepfakes**, requires a disclosure notice on synthetically/AI-generated content, and **publishes a public political-ad archive** — its policy page marked \"Updated 2024\" [24]. Roku's archive is among the most substantive voluntary transparency efforts on CTV, though it is self-defined, not a regulatory public file.\n- **Hulu/Disney** reversed course in **July 2022**, agreeing to accept political *issue* ads (abortion, guns) after a Democratic backlash over rejections — a reminder that platform content rules are discretionary and shift under pressure [25].\n- **Google/YouTube** runs an **election-ads verification** process and a public **Political Ads Transparency Report**; in September 2025 it updated its political-content policy, and it has withdrawn from EU political advertising over that regime's compliance burden [26].\n- **Platforms that ban political ads:** **TikTok** prohibits paid political advertising outright, though enforcement leaks — NBC and the Washington Post documented banned political content slipping through in 2024 [27]. Meta and Google run political ads with verification and archives; some pure-play streamers restrict or decline candidate/issue ads case-by-case.\n\nThe pattern: where law is absent, **the platform is the regulator** — setting verification, deepfake, and archive rules by private policy, applied inconsistently and revisable at will. That is governance. It is not public accountability.\n\n---\n\n## 6. The Risk Surface — Deepfakes, Misinformation, Brand-Safety, and Discrimination\n\nThe regulatory gaps converge on a concrete risk surface. Four risks dominate.\n\n**Deepfakes and AI misinformation.** Synthetic political media is no longer hypothetical. Between July 2023 and July 2024, deepfakes impersonating public figures surfaced across 38 countries, and AI-generated political content — including deepfake ads in 2026 races — is *\"proliferating faster than platform enforcement or federal regulation\"* [28]. On CTV the risk is amplified by the medium's credibility (the living-room TV reads as authoritative) and by the absence of a public file that would let fact-checkers trace a synthetic ad to its buyer. The state AI laws (Section 4) are the only legal backstop reaching streaming, and they are being narrowed in court.\n\n**Programmatic brand-safety and misinformation funding.** Because much CTV inventory is bought **programmatically** (automated, auction-based ad buying, decoded in `02_The_Addressability_Stack.md`), ads can land beside — and ad dollars can fund — misinformation, extremist, or fringe content on user-upload channels now appearing on big screens, with *\"insufficient controls to prevent advertisers from funding misinformation\"* [29]. Brand safety in CTV remains, per industry assessments, *\"a goal, not the norm\"* [29].\n\n**Surveillance and manipulative targeting.** The FTC's **September 11, 2024** 6(b) staff report, *A Look Behind the Screens*, found large social-media and streaming companies engaged in *\"vast surveillance\"* of users with *\"woefully inadequate\"* data-minimization, monetizing personal data and treating teens like adults [8]. The Center for Digital Democracy's 2024 report charged that the CTV industry has turned the television into a *\"sophisticated monitoring, tracking and targeting device,\"* enabling *\"covert personalized\"* political campaigns that integrate viewing behavior with sensitive data on *\"political orientations, personal interests, purchasing patterns, and emotional states … with no transparency or oversight\"* [29]. These are *claims by an advocacy organization* (privacy/consumer lean) about capability and intent — but they are grounded in the same ACR-plus-voter-file plumbing the corpus documents elsewhere, and the FTC report independently corroborates the surveillance core [8].\n\n**Targeting-driven discrimination.** The FTC flagged the risk of *\"targeting people based on sensitive characteristics, whether it's where they go to church or what medical needs they have,\"* with documented harms including *\"discrimination, hate speech and disinformation, and the undermining of democratic institutions\"* [8], [29]. Targeting that can segment by inferred religion, ethnicity, or health concern raises the prospect of differential political messaging — different, even contradictory, messages aimed at different micro-audiences with no public visibility. It is the microtargeting-accountability problem, moved onto the television screen.\n\n> ⚠️ **Where this gets contested.** Advocacy groups (CDD, EFF) describe CTV political targeting as a manipulation-and-surveillance crisis; industry frames the same capabilities as ordinary, consented ad-tech efficiency. The independently verifiable core — that the plumbing *exists*, that voter data is carved out of privacy law, and that no public file covers CTV — is established (Sections 1, 5). Whether the *effect* rises to \"manipulation\" is contested and turns on the ad-impact evidence in `04_Ad_Impact_And_Effectiveness.md`. This document's claim is narrower and firmer: the **transparency and accountability infrastructure that would let anyone even study the question does not exist on streaming.**\n\n---\n\n## 7. The Reform Menu — What Closing the Gap Would Take\n\nThe leading federal fix is the **Honest Ads Act**, championed by Sen. Mark Warner and reintroduced as S.486 / H.R.2599 in the 118th Congress. It would extend broadcast-style transparency to the internet: require digital platforms with **50 million+ monthly U.S. visitors** to maintain a **public file** of political ad buys over $500 (with the ad copy, targeting description, views, dates, rates, and purchaser contact), and require *\"reasonable efforts\"* to block foreign-national ad purchases [30], [31]. The Brennan Center (center-left, pro-disclosure) frames it as closing *\"major loopholes … by applying existing rules for television and radio companies to internet advertisements\"* [30].\n\n**Going-concern status:** the Honest Ads Act has **not become law.** It was folded into the broader For the People Act, which passed the House but stalled in the Senate across the 116th and 117th Congresses; the standalone 118th-Congress versions did not advance to passage [31]. As of the research window it remains a perennial proposal, not enacted law. For the 2026 cycle, the federal CTV transparency gap this entire document describes is **still open.**\n\nThe reform debate maps the document's central tension. Pro-disclosure voices (Brennan Center, Campaign Legal Center) argue the broadcast public-file model should follow ad dollars onto streaming. Free-speech voices (Institute for Free Speech, R Street) — and, decisively, the courts in *McManus* and *Kohls* — warn that compelled disclosure and AI-content rules on internet speech keep colliding with the First Amendment. The result is a stable, uncomfortable equilibrium. The spend has migrated to streaming. The rules have not, and the constitutional path to moving them is narrow.\n\n---\n\n## Open Questions\n\n1. **Will the December 2025 AI-preemption EO reach state election-deepfake laws?** If DOJ litigation or an FCC preemption proceeding sweeps in the state AI-ad statutes, the *only* legal layer reaching streaming AI content would be narrowed. Resolves with the EO's implementing actions and the inevitable litigation through 2026.\n2. **Does the Washington/Maryland split produce a durable \"request-on-demand vs. mandatory-publication\" doctrine?** With WA's law now affirmed by its Supreme Court (June 2026) and MD's struck by the Fourth Circuit, a circuit split or a model statute could emerge — or the Supreme Court could take up the question. Determines whether states can build CTV public files at all.\n3. **Will any platform's voluntary CTV ad archive (e.g., Roku) become a de facto standard or be deprecated?** Voluntary archives are unverified going-concern claims; a platform could quietly sunset one. Resolves by monitoring the archives' continued operation and completeness.\n4. **Is there any FEC appetite to define streaming/issue ads into the \"electioneering communication\" or disclaimer regime?** The EC definition's broadcast/cable/satellite limit is the structural hole. Only a statutory amendment or a (currently deadlock-prone) FEC rulemaking closes it.\n5. **Will the FTC use its 2024 6(b) findings to act on streaming data practices — and would any action touch political/voter data given the carve-outs?** The report recommended legislation but the FTC's own authority over political data is limited. Resolves with FTC enforcement or rulemaking direction under the current Commission.\n6. **Does the privacy carve-out for voter/political data survive the next round of state privacy lawmaking?** As more states pass comprehensive privacy laws (21+ as of 2026), whether any narrows the political exemption is the variable that could, for the first time, constrain the addressability stack at its data source.\n\n## Sources\n\n1. Scherer, Dana A., \"Identifying TV Political and Issue Ad Sponsors in the Digital Age,\" *Congressional Research Service*, Report **R46516** (September 9, 2020). Via EveryCRSReport.com, https://www.everycrsreport.com/reports/R46516.html. Accessed 2026-06-23. **(Tier 1 — congressional research; the spine of Sections 1–2.)**\n2. AdWave, \"FCC Political Advertising Rules: 2026 Compliance Guide\" (2026), https://adwave.com/resources/fcc-political-advertising-rules-2026; corroborated by FCC, \"Statutes and Rules on Candidate Appearances & Advertising,\" https://www.fcc.gov/media/policy/statutes-and-rules-candidate-appearances-advertising. Accessed 2026-06-23. **(Tier 5 compliance summary corroborating Tier 1 FCC primary; used for the broadcast-rule scope and the streaming non-application.)**\n3. *The Washington Post v. McManus*, No. 19-1132 (4th Cir. Dec. 6, 2019), via Justia, https://law.justia.com/cases/federal/appellate-courts/ca4/19-1132/19-1132-2019-12-06.html; analysis via Broadcast Law Blog, https://www.broadcastlawblog.com/2019/12/articles/court-of-appeals-finds-maryland-law-imposing-political-disclosure-obligations-on-online-platforms-to-be-unconstitutional-finding-different-treatment-of-broadcasters-is-justified/. Accessed 2026-06-23. **(Tier 1 court opinion + Tier 5 legal analysis.)**\n4. FEC, \"Advertising and disclaimers,\" https://www.fec.gov/help-candidates-and-committees/advertising-and-disclaimers/ (52 U.S.C. §30120; 11 C.F.R. §110.11). Accessed 2026-06-23. **(Tier 1 — agency primary on the disclaimer regime.)**\n5. FEC, \"FEC approves Final Rule on internet communication disclaimers …\" and REG 2011-02 materials, https://www.fec.gov/updates/. Accessed 2026-06-23. **(Tier 1 — FEC rulemaking record; the eleven-year timeline and Dec. 2022 final rule.)**\n6. FEC, \"Commission adopts final rule on internet communications disclaimers and the definition of public communication,\" https://www.fec.gov/updates/commission-adopts-final-rule-internet-communications-disclaimers-and-definition-public-communication/ (effective March 1, 2023; 11 C.F.R. §§100.26, 110.11). Accessed 2026-06-23. **(Tier 1.)**\n7. CRS, \"Online Political Advertising: Disclaimers and Policy Issues,\" IF10758, and FEC electioneering-communications materials; via congress.gov and fec.gov. Accessed 2026-06-23. **(Tier 1 — the express-advocacy/EC jurisdictional limit and the broadcast/cable/satellite definition of EC.)**\n8. FTC, \"FTC Staff Report Finds Large Social Media and Video Streaming Companies H S.B. 875 (2018), mgaleg.maryland.gov; reporting via Baltimore Sun and Ballard Spahr. Accessed 2026-06-23. **(Tier 1 statute + Tier 4 reporting on the struck-down provisions.)**\n13. FCC, NPRM \"Disclosure and Transparency of Artificial Intelligence-Generated Content in Political Advertisements\" (FCC 24-74; released July 25, 2024); Rosenworcel announcement May 22, 2024; Carr dissent. Via fcc.gov and Wiley, https://www.wiley.law/alert-FCC-Releases-NPRM-on-AI-Disclosure-Requirements-for-Political-Ads. Accessed 2026-06-23. **(Tier 1 rulemaking + Tier 5 legal analysis.)**\n14. PBS NewsHour, \"FCC to consider rules for AI-generated political ads on TV and radio, but can't touch streaming\" (May 2024), https://www.pbs.org/newshour/politics/fcc-to-consider-rules-for-ai-generated-political-ads-on-tv-and-radio-but-cant-touch-streaming. Accessed 2026-06-23. **(Tier 4 — the explicit streaming-gap admission and Rosenworcel-spokesperson quote.)**\n15. Reporting and analysis on Chairman Carr and the AI NPRM's fate: TV Tech, \"FCC's Carr Opposes Effort to Require Disclosure of AI-Content in Political Ads\"; Venable, \"Expectations for a Chairman Carr Led FCC\" (Jan. 2025). Accessed 2026-06-23. **(Tier 4/5 — going-concern status that the rule is effectively dead.)**\n16. MultiState, \"State Deepfake Laws in 2026\" (Feb. 2026), https://www.multistate.us/insider/2026/2/12/how-ai-generated-content-laws-are-changing-across-the-country; Skadden, \"California Enacts New Laws to Combat AI-Generated Deceptive Election Content\" (Sept. 2024). Accessed 2026-06-23. **(Tier 5 trackers; the ~30-state count and per-state detail.)**\n17. R Street Institute (libertarian-leaning, methodology disclosed), \"Update on 2025 State Legislation to Regulate Election Deepfakes\" (March 17, 2025), https://www.rstreet.org/commentary/update-on-2025-state-legislation-to-regulate-election-deepfakes/. Accessed 2026-06-23. **(Tier 5 — the 17-labeling/3-prohibition split; note lean.)**\n18. *Kohls v. Bonta*, No. 2: claim about its own policy; verification, deepfake ban, AI-disclosure, foreign-funding ban, archive.)**\n25. Variety, \"Disney Changes Hulu Policies to Accept Political Issues Ads …\" (July 2022), https://variety.com/2022/digital/news/hulu-ads-political-issues-abortion-guns-1235326940/; Axios, Hollywood Reporter corroborate. Accessed 2026-06-23. **(Tier 4/5 trade reporting.)**\n26. Google, Political Ads Transparency Report and \"Political content\" / \"Update to Political Content policy (September 2025)\" ad-policy pages, https://transparencyreport.google.com/political-ads and https://support.google.com/adspolicy/answer/16409999. Accessed 2026-06-23. **(Tier 1 — platform policy as claim.)**\n27. TikTok, \"Politics, Governments, and Elections\" ad policy (paid political ads banned), https://ads.tiktok.com/help/article/tiktok-ads-policy-politics-government-and-elections; enforcement gaps per NBC News (2024) and Washington Post, \"TikTok fails a test of its ban on political ads\" (Oct. 2024). Accessed 2026-06-23. **(Tier 1 policy + Tier 4 reporting on enforcement leakage.)**\n28. Reporting on 2024–2026 political deepfakes: Recorded Future, \"2024 Deepfakes and Election Disinformation Report\"; Journalist's Resource; Basis, \"How Political Advertising Will Impact the Media Landscape in 2026.\" Accessed 2026-06-23. **(Tier 5 — risk-surface synthesis on synthetic media.)**\n29. Center for Digital Democracy (consumer/privacy advocacy), \"Streaming Television Industry Conducting Vast Surveillance of Viewers …\" (2024), https://democraticmedia.org/publishings/; Adweek, \"In Connected TV, Brand Safety Is Still a Goal, Not the Norm\"; eMarketer on CTV brand safety. Accessed 2026-06-23. **(Tier 5/6 advocacy on surveillance + Tier 5 trade on brand safety; CDD claims tagged as advocacy position, corroborated on the surveillance core by source [8].)**\n30. Brennan Center for Justice (center-left, pro-disclosure), \"The Honest Ads Act Explained\" and \"Online Political Spending in 2024,\" https://www.brennancenter.org/our-work/research-reports/honest-ads-act-explained. Accessed 2026-06-23. **(Tier 5 — reform framing; note lean.)**\n31. Honest Ads Act, S.486 / H.R.2599 (118th Congress), congress.gov; history via the For the People Act; Sen. Warner, \"The Honest Ads Act,\" https://www.warner.senate.gov/the-honest-ads-act/. Accessed 2026-06-23. **(Tier 1 legislative record — the 50M-visitor public-file proposal and not-enacted status.)**"}, {"order": 7, "file": "07_Drivers_And_Forces.md", "title": "Drivers and Forces: What Moves U.S. Political CTV Advertising", "summary": "", "body": "# 07 — Drivers and Forces\n\n*The ground the outlook stands on. Each driver below leads with its mechanism, then the evidence that it is operating, a rough strength rating, and the named counter-force pushing back — so that any single driver can be lifted out, attached to its mechanism, and run into a scenario.*\n\n---\n\n## Bottom Line\n\n**Eight forces push U.S. political connected-TV (CTV) advertising up the curve, and they mostly point the same way.** A smaller set of counter-forces holds it back — real, but for now weaker. The single dominant driver is **mechanical audience migration**: streaming passed the combined share of broadcast plus cable in U.S. TV viewing for the first time in May 2025 (44.8% vs. 44.2%, Nielsen), and only 36% of U.S. adults still subscribe to cable or satellite — just 16% of those under 30 (Pew, 2025). Campaigns follow reach, so the money follows the eyeballs. AdImpact's latest projection (June 11, 2026 update) puts **CTV political spend at roughly $2.7 billion in the 2026 cycle** — revised up from the $2.48–2.5 billion it projected in September 2025 — well above the $2.34 billion of 2024 and more than double the 2022 midterm, inside a record ~$11.6 billion total cycle.\n\nFour technical and commercial drivers reinforce the migration. **Signal-loss dynamics** — mobile-ID opt-in collapse (ATT opt-in ~14% globally) and the *threat* of cookie loss — pushed the industry toward first-party voter-file matching, automated content recognition (ACR), and clean rooms, which happen to be exactly the addressability stack political CTV runs on. One wrinkle matters: **Google reversed third-party-cookie deprecation in April 2025**, so the cookie did *not* die, blunting one prong of this driver. **Voter-file commercialization** has matured. L2 carries 217 million voter records and 91 predictive fields; i360 advertises up to 1,800 data points per record; LiveRamp onboards these files into the programmatic world. **Measurement maturation** lowers buyer uncertainty — but its counter-force is sharp: the rigorous academic literature (Kalla & Broockman's meta-analysis of 49 field experiments, average persuasive effect ≈ zero) flatly contradicts vendor lift claims. **Regulatory arbitrage** is a genuine tailwind — FCC lowest-unit-rate and political-file rules do not reach streaming — but it is *fragile*: 21–30 states now regulate election deepfakes, and federal transparency bills sit waiting.\n\nTwo more drivers cut both ways. **CPM economics and inventory scarcity**: because Netflix, Disney+, Amazon Prime Video and Apple decline political ads, spend concentrates on the platforms that accept it (Hulu, Roku, YouTube, the FAST channels), spiking their CPMs in the Sept–Nov window — a tailwind for those sellers, a cost-control headache for buyers. **AI** cuts creative cost and speeds localization while igniting a deepfake-disclosure backlash. Governing all of it is **the two-year political-cycle clock**, an on/off spend pulse with hard waypoints at November 2026 and November 2028. The net read: the structural drivers are strong and durable. The binding constraints over the forecast horizon are *inventory concentration*, *the unresolved effectiveness question*, and *the pace at which regulation closes the streaming gap* — not whether the audience is on streaming. It already is.\n\n---\n\n## How to read the strength ratings\n\nEach driver carries a rough strength label:\n\n- **Dominant** — mechanically forces the trajectory; would have to reverse for the trend to reverse.\n- **Strong** — materially accelerates the trend; operating now with hard evidence.\n- **Moderate** — real and directional, but contingent or partly offset.\n- **Contingent** — could swing either way depending on an external event (a court ruling, a platform-policy change, a statute).\n\nCounter-forces are rated on the same scale relative to the driver they oppose.\n\n---\n\n## Driver 1 — Cord-Cutting and Audience Fragmentation\n\n**Strength: Dominant. Counter-force: the persistence of older, higher-turnout linear audiences (Moderate).**\n\n### Mechanism\n\nPolitical advertising is, before anything else, a reach business: a campaign buys the largest deliverable audience of persuadable or mobilizable voters per dollar. For sixty years that audience lived on broadcast, then cable. As households cancel pay-TV and shift viewing time to ad-supported streaming, the deliverable audience *mechanically* relocates to CTV. A campaign need not believe anything about targeting for this to bite — it simply cannot reach a cord-cutter on a cable spot. Migrating *viewing time*, not just subscriptions, is what moves gross rating points off linear, and GRPs are the currency political media buyers price against.\n\n### Evidence it is operating\n\nThe crossover is now documented in the primary measurement record. Per **Nielsen's The Gauge**, streaming captured **44.8% of total U.S. TV viewing in May 2025 — surpassing broadcast (20.1%) and cable (24.1%) combined (44.2%) for the first time** [1]. By December 2025, Nielsen put streaming at **47.5%** of viewing versus cable's 20.2% [2]. The subscription side is starker: **Pew Research (April 2025 survey, n=9,397)** found **83% of U.S. adults watch streaming but only 36% subscribe to cable or satellite**; 55% stream with no cable subscription at all [3].\n\nThe age gradient matters most for political reach, because it concentrates on the persuadable and the young-but-registerable. Pew's cable-subscription rate runs **64% for those 65+, 44% for 50–64, 23% for 30–49, and just 16% for 18–29** [3]. A campaign trying to reach voters under 50 — disproportionately persuadable, disproportionately low-turnout-but-gettable — now finds the majority of them only on streaming. YouTube alone reached **12.5% of all TV viewing** in May 2025, the highest single-streamer share Nielsen has recorded [1].\n\nSpend has tracked this almost exactly. Political CTV ad spend grew roughly **800% from 2020 (~$260M) to 2024 (~$2.34B actual)** — the widely cited \"~600%\" measures 2020 to eMarketer's 2024 *forecast* of ~$1.56B, not the realized total — [4][5], and AdImpact's June-2026 projection puts **~$2.7B for 2026** (revised up from $2.48–2.5B in September 2025), the only major media channel projected to grow over the 2024 presidential cycle [5][6].\n\n### Counter-force\n\nThe audience that still watches linear is **older and votes at far higher rates**. A 70-year-old reliable primary voter is cheaper and more certain to reach on a local broadcast affiliate than anywhere on streaming, and broadcast still commands roughly half of total political ad spend — a share that is sliding but not collapsing [6]. Broadcast political spend is *not* falling in dollar terms: AdImpact's September-2025 projection had it dipping slightly (~$5.36B in 2024 to ~$5.28B in 2026), but its June-2026 update revised broadcast *up* to ~$5.6B for the cycle [7]. So the counter-force is not \"linear is dead\"; it is \"linear remains the efficient buy for the highest-turnout cohort.\" That keeps a floor under broadcast and caps how fast CTV can take total share. Rated **Moderate** because it slows the migration without reversing it.\n\n---\n\n## Driver 2 — Identity and Signal-Loss Dynamics\n\n**Strength: Strong — but with a major asterisk. Counter-force: Google's April 2025 cookie reversal (Strong against one prong).**\n\n### Mechanism\n\nAs the open-web tracking signals that fueled digital targeting degrade, advertisers turn toward **deterministic, first-party identifiers they own or license**. In commercial advertising that means retail loyalty data and logged-in IDs; in *political* advertising the equivalent first-party asset is **the voter file** — a registration-based list of actual people that can be matched to devices and households without a cookie. Signal loss therefore acts as a tailwind for the exact addressability stack political CTV depends on: voter-file matching, **ACR** (automated content recognition — the smart-TV feature that identifies on-screen content and, by extension, the household's viewing), **HEM-based** (hashed-email) onboarding, and **clean rooms** (privacy-preserving environments where two parties match data without either seeing the other's raw records). CTV is structurally cookieless to begin with — there are no third-party cookies on a Roku — so a world that punishes cookie-based targeting rewards the channel that never used it.\n\n### Evidence it is operating\n\nThe mobile-ID prong is unambiguous. After Apple's **App Tracking Transparency (ATT)** launched in 2021, opt-in to the IDFA device identifier collapsed: by mid-2024, **global ATT opt-in had fallen to ~14%** (Flurry/Singular tracking), down from ~26% shortly after launch [8]. That is a durable, structural loss of mobile addressability — and it drove the industry toward first-party matching and onboarding.\n\nThe political-data plumbing built to exploit this is live and in-market. **Comscore and L2 launched cookie-free, voter-behavior-based predictive audiences in January 2022**, matching L2 voter seeds to Comscore's panels without cookies across digital, mobile, CTV and audio [9]. In **September 2025, Comscore launched an AI-powered Data Partner Network with 10+ data providers including L2** [10], and in **March 2026 Comscore and Yahoo DSP launched \"Proximic Political Audiences,\"** a CTV product unifying linear-exposure data with Yahoo ConnectID (a deterministic ID Yahoo states reaches 232 million logged-in U.S. users), activated through MiQ's political division for the 2026 midterms [11]. These are current, dated products — evidence that the signal-loss-to-first-party pipeline is operating in political CTV specifically, not just in theory.\n\n### Counter-force — and it is a big one\n\n**Google did not kill the third-party cookie.** After years of warnings, Google **reversed course in July 2024 and, in April 2025, confirmed Chrome would not deprecate third-party cookies and would not even show a user-choice prompt** [12]; in October 2025 it deprecated the Privacy Sandbox APIs it had built as replacements [12]. The cookie survives in Chrome. This guts the most-hyped version of the signal-loss thesis: the open-web cookie apocalypse that vendors spent five years selling against simply did not happen.\n\nThe honest read: signal loss is **real but narrower than the marketing**. Mobile IDs genuinely degraded (ATT). CTV remains genuinely cookieless. But the desktop-web cookie persists, so the \"everything is going first-party\" narrative is partly a vendor frame rather than a settled fact. The driver is **Strong on the ATT/CTV-native prong** and **substantially weakened on the cookie prong**. The \"cookie deprecation forces political dollars to CTV\" claim is best treated as **contested**, not established.\n\n---\n\n## Driver 3 — Voter-File Commercialization and Data Maturation\n\n**Strength: Strong. Counter-force: match-rate decay, modeled-score error, and voter-privacy law (Moderate).**\n\n### Mechanism\n\nThe voter file is the asset that makes \"voter-level addressable TV\" more than a slogan. Two things have to be true for it to drive CTV. First, the files have to be *rich* — enough modeled scores (partisanship, turnout propensity, issue affinity) to define useful audiences. Second, they have to be *activatable* — onboardable into the programmatic ad ecosystem at a high enough match rate that a meaningful share of a target list can actually be served an impression. As both improve, the marginal voter-targeted CTV impression gets cheaper and more accurate, and budget follows.\n\n### Evidence it is operating\n\nThe files are large and deeply modeled. **L2** advertises **217 million voter records, 260 million consumer records, 800+ consumer attributes, 400 demographic fields, and 91 predictive fields** [13]. **i360** (the Koch-network-affiliated, Republican-aligned data firm) advertises a library of **190M+ voters and 250M+ consumers with up to 1,800 data points per record** [14]. **TargetSmart** (the leading Democratic-aligned provider) states its VoterBase covers **208M+ registered voters plus 53M unregistered adults**, and its SmartMatch tool matches against a **259M+ record database** [15]. These are current vendor self-descriptions — Tier 1 for *what the firm claims*, not independently audited — but the scale and the modeled-field counts are consistent across three competitors.\n\nThe activation layer is also live: **L2's national voter file, consumer data, and modeled scores are available through LiveRamp** for CPM-priced digital onboarding across the programmatic landscape [16]. LiveRamp is the rail that turns a hashed voter list into an addressable audience on CTV inventory. The commercialization is therefore not aspirational — it is a productized, priced pipeline.\n\n### Counter-force\n\nThree things blunt it. First, **match rates are never 100%**, and they decay: LiveRamp defines match rate as the share of identifiable records resolvable to online devices at a destination [17] — a list of 100,000 voters might activate as 50,000–70,000 reachable devices, and the gap is dead weight. Second, **modeled scores are probabilistic and error-prone**: race, religion, and partisanship are *predicted*, not observed [17], so a \"persuadable independent\" segment is a model output that can be wrong at the individual level. Third, **voter-data privacy law is tightening** — state privacy regimes and the political sensitivity of voter files create legal and reputational risk around onboarding registration data into ad systems. Rated **Moderate**: the data is getting better and more activatable, but the precision is oversold and the legal ground is shifting.\n\n---\n\n## Driver 4 — Measurement Maturation\n\n**Strength: Moderate (as a tailwind). Counter-force: independent effectiveness skepticism (Strong).**\n\n### Mechanism\n\nBuyer uncertainty is a tax on spend. A media buyer who cannot prove an ad moved anything discounts its value and holds budget on channels they trust — linear, with its decades of GRP currency. As CTV measurement matures — incrementality testing, brand/opinion lift studies, cross-screen reach/frequency de-duplication, outcome attribution — that uncertainty falls, and budget that was waiting for proof gets released. This is a classic adoption-unlock mechanism: better measurement → lower perceived risk → more spend.\n\n### Evidence it is operating\n\nThe measurement infrastructure is consolidating. Vendors are building cross-platform de-duplication to solve the \"same household counted five times across five walled gardens\" problem [18], and the industry treats **incrementality testing (exposed vs. control) as the gold standard** for causal proof on CTV [19]. The Comscore–Yahoo political product explicitly sells **incremental reach** — routing CTV impressions to households that have *not* already been hit on linear — which is a measurement-derived value proposition, not just a targeting one [11]. MiQ has claimed **30% stronger engagement** using Comscore predictive segments versus ID-based segments on CTV [10] (a vendor claim — Tier 1 for what is claimed only).\n\n### Counter-force — the sharpest critical edge\n\nThe rigorous, independent literature **flatly contradicts the vendor lift narrative**. Kalla and Broockman's **meta-analysis of 49 field experiments (American Political Science Review, 2018)** found the **best estimate of the persuasive effect of campaign contact and advertising in general elections is approximately zero**, with effects appearing only in narrow conditions (unusually unpopular candidate positions, or early contact that then decays) [20]. Their later work found that **practitioners poorly predict which messages persuade** (PNAS, 2024) [21]. This is the central tension of the whole topic. Vendor measurement reports lift; the gold-standard causal literature reports ≈ zero average persuasion in general elections.\n\nTwo further problems compound the skepticism. **CTV measurability itself is still partial** — one Q1 2025 industry figure put median CTV measurability at ~64% [18] — so even \"measured\" campaigns are measuring a fraction. And **self-reported / vendor-graded attribution systematically inflates effect sizes** relative to controlled designs [18][20]. The net: measurement maturation *is* a real tailwind for spend, because buyers feel more confident — but the thing being measured, persuasion, has weak independent support. The upshot is that **the effectiveness case is load-bearing and contested**: a credible independent study showing CTV political ads don't move votes is one of the few events that could deflate the spend trajectory. Counter-force rated **Strong** precisely because the academic evidence is robust and old enough to be settled.\n\n---\n\n## Driver 5 — Regulatory Arbitrage and Its Fragility\n\n**Strength: Strong as a current tailwind. Counter-force: regulation closing the gap (Contingent — could flip to a headwind).**\n\n### Mechanism\n\nCTV currently carries a **lighter regulatory load than broadcast**, and lighter regulation is a tailwind: fewer constraints on targeting, pricing, and disclosure make the channel cheaper to operate in and more flexible for campaigns. The arbitrage is structural. Most FCC political-broadcasting rules — **reasonable access, equal time, the lowest-unit-rate (LUR) protection, and the public political file** — apply only to FCC *broadcast licensees*. **Streaming and CTV platforms are not licensees, so those obligations do not reach them** [22][23]. A campaign on Hulu pays a market CPM with no LUR cap and faces no FCC public-file disclosure requirement. The FEC's \"paid for by\" disclaimer and FTC truth-in-advertising standards *do* follow the ad onto streaming [22], so the gap is specifically in *broadcast-style* access, pricing, and transparency rules — not in baseline sponsorship disclosure.\n\n### Evidence it is operating\n\nThe FCC's own posture documents it. When the FCC moved in 2024 to require **AI-disclosure for political ads, then-Chair Rosenworcel's proposal explicitly covered only broadcast TV and radio — and the FCC acknowledged it cannot reach streaming**, because streaming is outside its authority [24]. CBS and PBS both reported the FCC \"can't touch streaming\" [24]. That is the arbitrage stated by the regulator itself: the agency with the political-ad rulebook has no jurisdiction over the fastest-growing political-ad channel.\n\n### Counter-force — and why it is the most volatile variable in the document\n\nThe gap is **closing at the state level and threatened at the federal level**. As of mid-2026, **roughly 30 states** have enacted laws regulating deepfakes/AI in election communications, most requiring disclosure — Public Citizen counted Maryland as the 30th on May 13, 2026 [25][26]. The federal **Honest Ads Act** (and similar bills) would extend public-file and disclaimer requirements to online political ads; **none had passed as of early 2026**, but the bipartisan interest is real [22]. The state laws are themselves contested: **California's AB 2839 was struck down in full in August 2025** (*Kohls v. Bonta*, E.D. Cal., final ruling Aug. 29, 2025) on First Amendment grounds [26], showing the courts can roll the gap back open as fast as legislatures close it.\n\nThis is the one driver that
