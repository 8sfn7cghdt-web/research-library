could **flip sign** within the forecast window. Today it is a tailwind: CTV is lightly regulated. A federal transparency statute, an FCC jurisdictional expansion, or a wave of enforceable state AI-disclosure laws would convert it into a headwind — raising compliance cost and stripping the targeting and pricing freedom that makes CTV attractive. Rated **Contingent**: high-variance, event-driven, and asymmetric, with more downside risk to the tailwind than upside.\n\n---\n\n## Driver 6 — CPM Economics and Inventory Scarcity on Political-Accepting Platforms\n\n**Strength: Strong (and self-reinforcing for sellers). Counter-force: it is a cost headwind for buyers and a spur to substitution (Moderate).**\n\n### Mechanism\n\nNot every CTV platform accepts political advertising. When a large slice of premium streaming inventory is **closed to political money**, demand concentrates on the platforms that remain open. In a hot election window — especially the September-to-November surge in competitive markets — that concentrated demand against fixed inventory **spikes CPMs**. For sellers that accept political (Hulu, Roku, YouTube, the FAST channels), it is a windfall: scarcity pricing on must-have inventory. For buyers it is a cost and access problem. The mechanism is straightforward supply-and-demand against a politically segmented inventory map.\n\n### Evidence it is operating\n\nThe inventory map is real and current. **Netflix, Disney+, Amazon Prime Video, and Apple TV decline political advertising** as of mid-2026; Netflix has held this line into 2026 despite buyer pressure to reach its ~13 million U.S. ad-tier subscribers [27][28]. That pushes political dollars onto **Hulu, Roku, YouTube, and the FAST channels (Tubi, Pluto, Roku Channel), plus Peacock, Paramount+, Sling, fuboTV and others** that do accept it [27]. Trade estimates put political-accepting **premium inventory (Hulu, Peacock, Paramount+) at ~$35–80 CPM, mid-tier (Roku, Samsung TV+) ~$25–45, and FAST channels (Tubi, Pluto) ~$18–28**, with the platforms that accept political flagged for \"the sharpest CPM increases\" in the surge window [27][29]. (These CPM bands are trade-press figures — Tier 5, directional, not audited.)\n\n### Counter-force\n\nScarcity pricing is a **headwind for buyers**, and it opens two pressure-release valves. First, **substitution**: buyers shift toward cheaper FAST inventory, programmatic open exchange, and earlier-in-cycle buying to lock rates before the surge — which caps how high effective CPMs go and spreads spend across more of the cycle. Second, **supply response**: the very profitability of accepting political ads pressures the holdouts. If Netflix or Amazon reversed their political bans — and active lobbying efforts push for exactly that [28] — a flood of new premium inventory would *relieve* scarcity and *compress* CPMs. So the driver is strong for incumbents but carries the seed of its own moderation. Rated **Strong** as a current dynamic, with the standing caveat that a single platform-policy reversal could reset it.\n\n---\n\n## Driver 7 — AI: Generative Creative, Optimization, and the Disclosure Backlash\n\n**Strength: Moderate and rising. Counter-force: the deepfake-disclosure backlash and platform/legal restriction (Moderate, rising faster).**\n\n### Mechanism\n\nGenerative AI lowers the cost and time of producing political video creative, enables rapid localization (multiple languages, district-specific variants), and sharpens campaign optimization (targeting, sequencing, creative testing). Cheaper, faster, more-variant creative is a tailwind for *high-frequency, micro-targeted* channels like CTV, where fifty tailored cuts beat one. The same capability also enables **deepfakes** — synthetic depictions of real people — which triggers a regulatory and platform backlash that pushes the other way.\n\n### Evidence it is operating\n\nBoth prongs showed up in 2024. The FCC noted AI's legitimate campaign uses: **tailoring messages to communities, producing multilingual content, and speeding generation of ads in the final days** — valuable especially to **smaller, lower-budget campaigns** because the tools are cheap and require little training [24][30]. On the deepfake side, the **2024 cycle saw AI-generated attack creative** (e.g., the RNC's AI-generated \"dystopian Biden second term\" ad; AI imagery in campaign contexts) [30].\n\nThe backlash is the live story. **Meta required political advertisers to disclose AI-altered footage (effective January 2024); YouTube required synthetic-content labels** [30]. The **FCC opened AI-disclosure rulemaking for broadcast/radio in 2024** (but, per Driver 5, could not reach streaming) [24]. And the state wave described above — **21–30 states regulating election deepfakes, most via disclosure mandates** — is largely an AI-backlash phenomenon [25][26]. The **FEC declined a dedicated AI rulemaking in September 2024**, instead affirming that its existing fraudulent-misrepresentation rule applies regardless of technology [25].\n\n### Counter-force\n\nThe disclosure-and-restriction backlash is growing **faster** than CTV is adopting the generative-creative tailwind. Disclosure mandates raise production friction and legal exposure; platform policies can demonetize or block synthetic political creative; and the reputational risk of being caught running an undisclosed deepfake is high. The **net effect on CTV spend is ambiguous**: AI lowers creative cost (tailwind), but the compliance and reputational overhead it generates is a tax (counter-force). Rated **Moderate and rising** on both sides — this is the driver whose sign is least settled, and the one most likely to matter more in 2028 than 2026.\n\n---\n\n## Driver 8 — The Political-Cycle Clock\n\n**Strength: Dominant over timing (sets the waypoints). Counter-force: secular base-rate growth that partially fills the troughs (Moderate).**\n\n### Mechanism\n\nU.S. political advertising is not a smooth market — it is a **pulse**. Spend surges in even years (federal elections) and collapses in odd years, with the largest pulses in presidential cycles (2020, 2024, 2028) and smaller-but-still-enormous pulses in midterms (2018, 2022, 2026). This clock governs *when* CTV spend lands more than any other force. It also sets the **forecast waypoints**. November 2026 (midterms) and November 2028 (presidential general) are the two hard dates the entire trajectory pivots on, with the heaviest spend in the final 8–10 weeks before each.\n\n### Evidence it is operating\n\nThe pulse is visible in the totals. The total political cycle ran **~$8.9B (2022) → record 2024 → projected ~$11.6B (2026)**, \"the most expensive midterm on record\" per AdImpact [5][6]. CTV's own cycle figures show the same on/off shape layered on a rising base: **~$0.26B (2020) → ~$1.09B (2022) → $2.34B (2024) → ~$2.5B (2026 proj.)** [4][5]. Borrell Associates' local-ad data shows the mechanical signature directly: **declines from 2024 to 2025 and upticks into 2026 \"directly tied to political advertising\"** [31]. Early 2026 pacing confirmed the clock — AdImpact reported ~$900M already booked through late August 2025, \"pacing well ahead of 2023 and 2021\" [5].\n\n### Counter-force\n\nThe trough between cycles is **filling in** as issue advocacy, ballot-measure, and year-round advocacy spending grow, and as the secular CTV base rises regardless of the election calendar. So the pulse is becoming a **rising sawtooth** rather than a true on/off switch — the 2025 \"off\" year was still a substantial CTV-political market. This secular base-rate growth (driven by Drivers 1–3) partly decouples CTV from the pure two-year clock, so the 2028 peak builds on a higher floor than 2024 did. Rated **Moderate**: the clock still dominates timing, but the off-year troughs keep shrinking.\n\n---\n\n## Lagging vs. Leading Drivers\n\nIt helps to sort the forces by role: which are *reactive* (lagging — they respond to change already underway), and which are *likely to dominate the next phase* (leading)?\n\n**Leading (will dominate 2026 → 2028):**\n- **Driver 1 (cord-cutting)** — still the engine; the audience migration has further to run (cable still ~36% of households, but falling). Leading and durable.\n- **Driver 5 (regulatory arbitrage fragility)** — the highest-variance leading driver; a federal statute or a wave of enforceable state laws would reshape the channel. This is where the scenarios for the years ahead branch most sharply.\n- **Driver 7 (AI)** — its sign is unsettled and its weight grows into the 2028 presidential cycle, where stakes (and deepfake risk) are highest.\n\n**Lagging (reactive, already priced in):**\n- **Driver 3 (voter-file commercialization)** — mature and incremental; it improves at the margin but is unlikely to surprise.\n- **Driver 6 (CPM scarcity)** — a *symptom* of Drivers 1–2 (demand concentrating on a fixed open-inventory set); it reacts to the others rather than leading.\n- **Driver 8 (the clock)** — the most predictable force of the eight; it sets timing but creates no uncertainty about *whether* the pulse comes.\n\n**The swing factor:**\n- **Driver 4 (measurement / effectiveness)** is the wildcard. It is currently a quiet tailwind (better measurement → more confident spend), but it sits on top of an unresolved, adverse academic literature. A credible independent finding that political CTV ads don't move votes is one of the few shocks that could bend the whole trajectory down — the key downside risk in the whole picture.\n\n---\n\n## Net Synthesis\n\nStack-ranked by force on the 2026–2028 trajectory:\n\n| # | Driver | Direction | Strength | Key counter-force | Net |\n|---|--------|-----------|----------|-------------------|-----|\n| 1 | Cord-cutting / fragmentation | ↑ CTV | **Dominant** | Older linear audiences vote more | Strong net ↑ |\n| 2 | Signal loss (ATT, CTV-native) | ↑ CTV | Strong* | Google kept the cookie (Apr 2025) | Moderate net ↑ |\n| 3 | Voter-file commercialization | ↑ CTV | Strong | Match-rate decay, model error, privacy law | Moderate net ↑ |\n| 4 | Measurement maturation | ↑ CTV | Moderate | Independent ≈-zero-persuasion evidence | **Ambiguous** |\n| 5 | Regulatory arbitrage | ↑ CTV (today) | Strong | Regulation closing the gap | **Contingent — could flip** |\n| 6 | CPM scarcity (open-inventory set) | ↑ for sellers | Strong | Buyer cost / platform-ban reversal | Net ↑ for sellers, ↓ for buyers |\n| 7 | AI creative & optimization | ↑ / ↓ | Moderate, rising | Deepfake-disclosure backlash | **Sign unsettled** |\n| 8 | Two-year political clock | timing | **Dominant** (timing) | Filling troughs (secular base) | Sets waypoints |\n\n\\*Driver 2 is Strong on the ATT/CTV-native prong, materially weakened on the cookie prong.\n\n**The one-paragraph takeaway:** The audience is already on streaming, and it votes there too — settled, and dominant. So the growth of political CTV spend through 2028 is not in question. What is in question is *how fast*, *at what CPM*, *under what disclosure regime*, and *whether the effectiveness case survives independent scrutiny*. The binding constraints are inventory concentration (Driver 6), the regulatory gap's fragility (Driver 5), and the unresolved persuasion question (Driver 4) — not the underlying migration. The base case rests on Drivers 1 and 8 (mechanical and predictable), the scenarios branch primarily on Driver 5, and Driver 4 is the principal downside tail.\n\n---\n\n## Open Questions\n\n1. **Does the cookie reversal blunt the political-CTV tailwind, or is it irrelevant?** Because CTV is natively cookieless and political targeting runs on voter files rather than cookies, Google's April 2025 reversal may matter far less to *political* CTV than to commercial open-web display. Quantifying that asymmetry is unresolved.\n2. **What is the actual onboarding match rate for a typical voter-file segment onto CTV inventory in 2026?** Vendors publish capability claims (217M records, 1,800 data points) but not audited end-to-end activation rates. The gap between list size and reachable-device count is load-bearing for CPM and waste — and no one measures it publicly.\n3. **Will any 2026-cycle independent study test CTV political-ad persuasion directly?** The Kalla–Broockman literature predates large-scale CTV. A modern field experiment on *streaming* political ads specifically would either validate or deflate the vendor case — and none is yet in the public record.\n4. **Does a federal transparency statute (Honest Ads Act or successor) pass before 2028?** This is the single highest-variance regulatory question; its resolution forks the Driver-5 scenario.\n5. **Will a premium holdout (Netflix, Amazon, Disney+) open to political ads before 2028?** A reversal would relieve CPM scarcity (Driver 6) and reshape the inventory map. Active lobbying exists; the outcome does not.\n6. **How large is the off-year (odd-year) CTV-political base becoming?** If issue/advocacy spend keeps filling the troughs, the \"two-year pulse\" model degrades and the secular base-rate (Drivers 1–3) becomes the better predictor. The 2025 off-year figure is the test case, and it is not yet cleanly reported here.\n7. **Net sign of AI on CTV spend.** Does cheaper creative add more spend than disclosure/compliance friction subtracts? Unresolved and likely to matter more in 2028.\n\n---\n\n## Sources\n\n1. Nielsen, \"Streaming Reaches Historic TV Milestone, Eclipses Combined Broadcast and Cable Viewing For First Time\" (The Gauge, May 2025 data), 2025. https://www.nielsen.com/news-center/2025/streaming-reaches-historic-tv-milestone-eclipses-combined-broadcast-and-cable-viewing-for-first-time/ — Accessed 2026-06-23. **Tier 1** (primary measurement). Streaming 44.8% vs. broadcast+cable 44.2%, May 2025; YouTube 12.5%.\n2. Reporting on Nielsen The Gauge December 2025 data (streaming 47.5%, cable 20.2%), via cord-cutting statistics aggregation, 2026. — Accessed 2026-06-23. **Tier 5** (trade aggregation of Tier-1 Nielsen data; cite Nielsen primary where possible).\n3. Pew Research Center, \"83% of US adults use streaming services, far fewer subscribe to cable or satellite TV,\" July 1, 2025 (survey of 9,397 adults, April 14–20, 2025, American Trends Panel). https://www.pewresearch.org/short-reads/2025/07/01/83-of-us-adults-use-streaming-services-far-fewer-subscribe-to-cable-or-satellite-tv/ — Accessed 2026-06-23. **Tier 1** (primary survey). 36% cable/satellite; age gradient 64%/44%/23%/16%.\n4. MNTN / The Current reporting on political CTV spend 2020–2024 (~600% growth; ~$260M 2020 → $2.34B 2024). https://www.thecurrent.com/media/us-political-ctv-ad-spend-2024-presidential-election-cycle — Accessed 2026-06-23. **Tier 5** (ad-tech trade/vendor; directional historical series).\n5. The Current (The Trade Desk), \"CTV set to fuel record U.S. political spending in 2026,\" September 15, 2025 (citing AdImpact: 2024 CTV $2.34B → 2026 proj. $2.48B, +20%); AdImpact's June 11, 2026 update later revised the 2026 CTV projection up to ~$2.7B (and broadcast up to ~$5.6B), per AdImpact's blog and CNBC/MediaPost coverage. https://www.thecurrent.com/streaming-fuel-record-us-political-spending-2026-ctv — Accessed 2026-06-23. **Tier 5** (trade press reporting AdImpact figures). Note: The Current is owned by The Trade Desk (a DSP) — disclose the interest.\n6. AdImpact, \"Political Projections Report 2025–2026\" (orig. Sep 2, 2025; updated Jun 11, 2026: total raised to $11.6B; CTV ~$2.5B; broadcast just under 50% share). https://adimpact.com/blogs/adimpacts-political-projections-report-2026 — Accessed 2026-06-23. **Tier 5** (specialist ad-spend tracker; near-primary for spend forecasting; 2022 forecast within 5% of actual).\n7. The Current / AdImpact, broadcast political spend $5.36B (2024) → $5.28B (2026 proj., Sept. 2025); AdImpact's June 11, 2026 update revised broadcast *up* to ~$5.6B (not down), per AdImpact's blog and CNBC/MediaPost. https://www.thecurrent.com/streaming-fuel-record-us-political-spending-2026-ctv — Accessed 2026-06-23. **Tier 5**.\n8. Flurry / Singular ATT opt-in tracking, \"ATT opt-in rates 2024\" (global opt-in ~14% mid-2024, down from ~26% post-launch). https://www.singular.net/blog/att-opt-in-rates-2024/ ; https://www.flurry.com/blog/att-opt-in-rate-monthly-updates/ — Accessed 2026-06-23. **Tier 5** (mobile-measurement vendor tracking; widely cited primary-ish series).\n9. Comscore, \"Comscore and L2, Inc. Launch First of Its Kind Cookie-free Audiences Based on Voter Insights,\" press release, January 2022. https://www.comscore.com/Insights/Press-Releases/2022/1/Comscore-and-L2-Inc-Launch-First-of-Its-Kind-Cookie-free-Audiences-Based-on-Voter-Insights — Accessed 2026-06-23. **Tier 1** (press release — evidence of what the firms claim/launched, not of efficacy).\n10. Comscore, \"Comscore Debuts AI-Powered Data Partner Network,\" press release, September 2025 (10+ providers incl. L2; MiQ \"30% stronger engagement\" claim). https://www.comscore.com/Insights/Press-Releases/2025/9/Comscore-Debuts-AI-Powered-Data-Partner-Network — Accessed 2026-06-23. **Tier 1** (press release; performance figure is a vendor claim).\n11. PPC Land, \"Comscore and Yahoo DSP target 2026 voters with CTV political audiences,\" March 7, 2026 (Proximic Political Audiences, announced Mar 5 2026; Yahoo ConnectID 232M logged-in users; 210 DMAs; MiQ activation). https://ppc.land/comscore-and-yahoo-dsp-target-2026-voters-with-ctv-political-audiences/ — Accessed 2026-06-23. **Tier 5** (ad-tech trade press reporting a product launch).\n12. OneTrust / industry reporting on Google's cookie reversal (Jul 2024 reversal; Apr 22, 2025 no prompt / no deprecation; Oct 2025 Privacy Sandbox APIs deprecated). https://www.onetrust.com/blog/google-drops-plans-for-third-party-cookie-choice-prompt-in-chrome/ ; https://www.exchangewire.com/blog/2025/04/25/chromes-cookie-commotion-is-it-finally-over/ — Accessed 2026-06-23. **Tier 5** (trade press; the underlying Google announcement is Tier 1 / primary).\n13. L2 Data, company website data-scale figures (217M voter records; 260M consumer records; 800+ consumer attributes; 400 demographic fields; 91 predictive fields). https://www.l2-data.com/ — Accessed 2026-06-23. **Tier 1** (vendor self-description — claim, not audit). Going-concern: site is live and operating as of access date.\n14. i360, \"Voter Consumer Data\" product page (190M+ voters, 250M+ consumers, up to 1,800 data points/record). https://www.i-360.com/political-products/i360-voter-consumer-data/ — Accessed 2026-06-23. **Tier 1** (vendor self-description). Going-concern: product page live as of access date.\n15. TargetSmart, VoterBase / SmartMatch documentation (208M+ registered voters + 53M unregistered; 259M+ record match database; \"leading provider for Democratic campaigns\"). https://docs.targetsmart.com/my_tsmart/smartmatch/overview.html ; https://targetsmart.com/ — Accessed 2026-06-23. **Tier 1** (vendor self-description). Going-concern: live as of access date.\n16. L2 Political, \"L2's national voter file available through LiveRamp\" (voter file + modeled scores onboardable via LiveRamp, CPM-priced). https://www.l2-data.com/l2s-national-voter-file-available-through-liveramp/ — Accessed 2026-06-23. **Tier 1** (vendor description of a live integration).\n17. LiveRamp, \"Match Rates\" documentation (match rate = % of identifiable records resolvable to online devices at a destination); on predictive modeling of race/religion/partisanship. https://docs.liveramp.com/connect/en/match-rates.html — Accessed 2026-06-23. **Tier 1** (primary product documentation).\n18. Industry reporting on CTV measurement fragmentation, walled-garden de-duplication, and measurability (~64% median CTV measurability, Q1 2025); self-reported attribution inflation. https://www.aidigital.com/blog/cross-platform-measurement ; https://www.kochava.com/blog/beyond-fragmented-signals-unifying-linear-tv-and-ctv-measurement/ — Accessed 2026-06-23. **Tier 5** (ad-tech vendor/trade analysis; directional).\n19. Trade explainers treating incrementality testing (exposed vs. control) as the CTV causal-proof gold standard. https://www.incrmntal.com/resources/ctv-advertising-and-ctv-measurement — Accessed 2026-06-23. **Tier 5** (measurement-vendor explainer).\n20. Kalla, J. L., & Broockman, D. E., \"The Minimal Persuasive Effects of Campaign Contact in General Elections: Evidence from 49 Field Experiments,\" *American Political Science Review* 112(1):148–166, 2018. https://www.cambridge.org/core/journals/american-political-science-review/article/abs/minimal-persuasive-effects-of-campaign-contact-in-general-elections-evidence-from-49-field-experiments/753665A313C4AB433DBF7110299B7433 — Accessed 2026-06-23. **Tier 2** (peer-reviewed). Best estimate of average persuasive effect ≈ zero in general elections.\n21. Broockman, D. E., Kalla, J. L., et al., \"Political practitioners poorly predict which messages persuade the public,\" *PNAS*, 2024. https://www.pnas.org/doi/10.1073/pnas.2400076121 — Accessed 2026-06-23. **Tier 2** (peer-reviewed).\n22. AdWave, \"FCC Political Advertising Rules: 2026 Compliance Guide\" (LUR/reasonable-access/political-file apply to broadcast licensees only; FEC disclaimers and FTC standards follow ads to streaming; Honest Ads Act unpassed as of early 2026). https://adwave.com/resources/fcc-political-advertising-rules-2026 — Accessed 2026-06-23. **Tier 5** (specialist trade/compliance explainer; verify rule specifics against FCC primary).\n23. FCC, \"Political Programming\" (rules apply to broadcast stations). https://www.fcc.gov/media/policy/political-programming — Accessed 2026-06-23. **Tier 1** (regulator's own statement of rule scope).\n24. CBS News / PBS NewsHour, \"FCC to consider rules for AI-generated political ads on TV and radio, but can't touch streaming,\" 2024. https://www.cbsnews.com/news/fcc-rules-ai-generated-ads-tv-radio-streaming/ ; https://www.pbs.org/newshour/politics/fcc-to-consider-rules-for-ai-generated-political-ads-on-tv-and-radio-but-cant-touch-streaming — Accessed 2026-06-23. **Tier 3/4** (wire/major-outlet). The FCC's explicit acknowledgment that it cannot reach streaming.\n25. R Street Institute / Skadden / MultiState on state deepfake legislation and the FEC's Sept 19, 2024 decision not to open a dedicated AI rulemaking (affirmed existing fraudulent-misrepresentation rule). https://www.rstreet.org/commentary/update-on-2025-state-legislation-to-regulate-election-deepfakes/ ; https://www.skadden.com/insights/publications/2024/09/california-enacts-new-laws — Accessed 2026-06-23. **Tier 5** (think-tank / law-firm analysis; note R Street center-right, Skadden a law firm).\n26. Public Citizen, \"Tracker: State Legislation on Deepfakes in Elections\" / \"30 States Now Have Laws to Regulate Election Deepfakes\" (May 13, 2026 release — Maryland the 30th); CA AB 2839 struck down in full Aug. 29, 2025 (*Kohls v. Bonta*, E.D. Cal.) on First Amendment grounds, not partially. https://www.citizen.org/article/tracker-legislation-on-deepfakes-in-elections/ — Accessed 2026-06-23. **Tier 5** (advocacy-org tracker; Public Citizen is a left-of-center consumer-advocacy group — but the tracker is a factual enumeration of enacted statutes).\n27. Basis Technologies, \"How Political Advertising Will Impact the Media Landscape in 2026\" (Netflix/Disney+/Amazon/Apple decline political; Hulu/Roku/YouTube/FAST accept; CPM bands). https://basis.com/blog/how-political-advertising-will-impact-the-media-landscape-in-2026 — Accessed 2026-06-23. **Tier 5** (ad-tech trade). Going-concern: platform-policy statuses are present-tense claims confirmed for mid-2026.\n28. Campaigns & Elections, \"The Streaming Services on Political Advertisers' Wishlists\" (Netflix holds political-ad ban into 2026 despite ~13M U.S. ad-tier subs; active lobbying to reverse). https://campaignsandelections.com/industry-news/the-streaming-services-on-political-advertisers-wishlists/ — Accessed 2026-06-23. **Tier 5** (political-industry trade press).\n29. AdWave / TurnItBlue, CTV political CPM bands and surge-window scarcity (premium ~$35–80, mid ~$25–45, FAST ~$18–28). https://adwave.com/resources/political-tv-advertising-2026-guide ; https://www.turnitbluedigital.com/ctv-cpm-reality-check-what-political-campaigns-actually-pay-in-2026-and-how-to-keep-costs-down — Accessed 2026-06-23. **Tier 5/6** (agency/vendor guides; CPM figures are directional, not audited; TurnItBlue is a Democratic-aligned agency).\n30. University of Illinois College of Media / Federal Register on generative AI in 2024 political ads (cost/speed/localization benefits; RNC AI ad; Meta Jan-2024 disclosure rule; YouTube synthetic-content labels). https://media.illinois.edu/how-will-generative-artificial-intelligence-affect-political-advertising-in-2024/ ; https://www.federalregister.gov/documents/2024/08/05/2024-16977/ — Accessed 2026-06-23. **Tier 2/1** (academic explainer; Federal Register is primary).\n31. Borrell Associates (via Radio Ink / Barrett Media / MediaPost), 2026 local-ad forecast (+3% local; digital 72% of local; political-driven 2024→2025 decline and 2026 uptick). https://radioink.com/2026/05/05/borrell-local-digital-ad-growth-slows-as-markets-mature/ ; https://barrettmedia.com/2026/05/05/local-advertising-digital-new-borrell-data/ — Accessed 2026-06-23. **Tier 5** (specialist local-ad forecaster reported via trade press).\n\n---\n\n*A note on currency: all present-tense platform statuses (Netflix/Disney+/Amazon/Apple decline political; Hulu/Roku/YouTube accept), vendor data-scale figures (L2/i360/TargetSmart), and live products (Comscore–L2, Comscore–Yahoo Proximic Political Audiences) are confirmed against sources as of mid-2026. The most time-sensitive of these — platform political-ad policies — are exactly the class of status that can change via a single policy reversal.*"}, {"order": 8, "file": "08_Gap_Inscape_Walmart_GoingConcern.md", "title": "Inscape ACR After Walmart: A Going-Concern Audit", "summary": "", "body": "# Inscape ACR After Walmart: A Going-Concern Audit\n\n## Bottom Line\n\nWhen Walmart bought Vizio, the obvious fear was that it would lock Inscape's ACR data inside its own retail-media engine. It didn't. Vizio's **Inscape** unit sits as a live pillar of the five-layer addressability stack, with the one open complication being that Walmart closed its ~$2.3B purchase on December 3, 2024. The open question — whether Walmart pulled Inscape's third-party data-licensing arm in-house and restricted it to Walmart Connect — now has a confident answer: **it did not.** Through 2025 and into the 2026 cycle, Inscape kept licensing ACR data to its named partners and renewed the agreements most relevant to politics. Comscore renewed and expanded its pact (Oct 2024, days before the deal vote); VideoAmp renewed (Mar 2025); Nielsen extended into a multi-year deal (Jun 2025); TVision extended (2025); and AdImpact's political-CTV partnership — the one that powers Vizio Ads' candidate-exposure segments and congressional-district targeting — stayed live and extended into the 2026 election season.\n\nThe brand is **still \"Inscape\"**: inscape.tv is live, the LinkedIn page operates, and partner press releases still say \"VIZIO's Inscape.\" The consent regime held too. The 2017 FTC order's affirmative opt-in rule survived the acquisition — it carries a **20-year compliance term** running to ~2037 — and it visibly governs Vizio's data under Walmart. The current privacy policy keeps Viewing Data behind a setup-time choice and keeps Vizio OS Data **separate from the Walmart account unless the user separately opts in to combine them**, through a distinct \"Consent to Combine VIZIO OS Data with Your Walmart Account Data\" toggle. The genuine risk is not that the pillar is dead. It is that Walmart's *retail-media* strategy — folding the Vizio TV/OS brand toward its onn private label, pushing the closed-loop Walmart-purchase tie-in — gives Walmart a standing motive to wall off the third-party arm in a future cycle. As of June 2026, the pillar is alive, branded, and politically operative. The verdict shifts from **\"partially dead\" to \"live, with a strategic-conflict watch.\"**\n\n---\n\n## Why this matters\n\nThe chapters on the addressability stack, on players and market structure, and on drivers each name Vizio/Inscape as one of four smart-TV ACR footprints — alongside Roku, LG, and Samsung — and treat it as a working node in Layer 1 (\"the glass\") of the addressability stack. The sensible rule of thumb — treat any \"X currently powers Y\" claim sourced before 2025 as suspect — flags Vizio's change of control, then *assumes continuity of the data business* — the precise thing an acquirer with a retail-media engine has every incentive to wall off. Walmart bought Vizio to feed **Walmart Connect** (its retail-media network) and **Walmart Data Ventures**, and acquirers routinely re-permission or restrict a target's third-party licensing arm to make the data exclusive. Had Walmart done that to Inscape's political and measurement licensing, a named pillar of the five-layer ACR stack would be partially hollow, and several downstream claims — Comscore Predictive Audiences' ACR layer, exposure-based measurement, district-level political targeting — would rest on a stale present tense. What follows resolves the question with sources dated 2025–2026.\n\n---\n\n## What the Record Shows\n\n### Inscape continued licensing ACR data to third-party measurement firms after the Walmart close\n\nAcross 2025, every measurement currency and panel that consumes Inscape ACR data renewed or extended — *after* the December 3, 2024 close:\n\n- **Comscore** renewed and *expanded* its Inscape smart-TV measurement partnership, announced **October 7, 2024** — days before Vizio shareholders approved the deal — continuing to leverage Inscape data across all **210 local markets** [1][2]. Trade coverage framed the renewal explicitly as easing fears \"that Vizio viewership data would become exclusive to Walmart Connect, potentially cutting off other crucial pipelines\" [2].\n- **VideoAmp** renewed its Inscape partnership **March 27, 2025**, retaining access to Inscape's **Tuner Data** (OTA viewership across 5,000+ local stations) and **Commercial Feed+**, citing data from **24M+ opted-in VIZIO smart TVs** [3].\n- **Nielsen** extended its Inscape relationship into a **multi-year agreement** announced **June 2025**, licensing ACR data from **24M+ smart TVs** across broadcast, cable, and streaming [4].\n- **TVision** extended its Inscape data partnership via a multi-year agreement in 2025, enriching Inscape's 24M+ opted-in-device base with attention/panel data [5].\n\nThe *pattern* — every named consumer re-signing after the close, across four independent partner announcements — is the strongest available evidence that Walmart kept the third-party pipe open rather than shutting it [1][2][3][4][5].\n\n### Vizio/Inscape remained politically operative; political advertisers retained ACR access into the 2026 cycle\n\nVizio Ads' political offering rests on the **AdImpact × Inscape** partnership — a multi-year deal (originally **April 3, 2024**) pairing AdImpact's ad catalog with Inscape's ACR/panel data (then ~23M opt-in devices). That partnership stayed live and was **expanded \"ahead of the political election season\"** in trade coverage current to the 2026 cycle [6][7][8]. The capabilities are unambiguously political and ACR-driven: Vizio builds **custom political segments — \"unexposed devices to candidates' ads, low exposures to candidates' ads, and exposures to competitive ads\"** — and offers targeting \"from national to statewide to district to zip code,\" explicitly at the **congressional-district level** [6][8][9]. AdImpact projects the 2026 cycle at **$10.8B total / ~$2.5B on CTV**, the backdrop against which Vizio Ads is courting political buyers [7]. Current reporting confirms political advertisers' continued access to Vizio ACR specifically.\n\nOne caveat on the evidence: the AdImpact *origin* announcement is pre-close (Apr 2024); the *continuation/expansion into 2026* is the post-close evidence, carried by trade outlets covering the 2026 season [7][8][6][9].\n\n### The 2017 FTC opt-in consent regime survived the acquisition and visibly governs Vizio's data under Walmart\n\nThe 2017 FTC/New Jersey stipulated order (against **VIZIO, Inc. and VIZIO Inscape Services, LLC**) carried a **20-year term** with a third-party compliance monitor — it runs to roughly **2037** and binds the corporate entity regardless of who owns it, and nothing in the public record indicates the order was modified or terminated on the Walmart change of control [10][11]. The order's operative rule — treat TV viewing history as sensitive information requiring **prominent disclosure and affirmative opt-in consent** — is visibly live in Vizio's **current** privacy posture under Walmart. Setup presents an explicit choice to enable ACR/**Viewing Data**, which can be turned off at any time (\"All Settings > Privacy & Legal > Viewing Data\"). And — critically — **Vizio OS Data stays separate from the user's Walmart account unless and until the user separately opts in**, through a distinct **\"Consent to Combine VIZIO OS Data with Your Walmart Account Data\"** control [12][13]. Walmart did **not** silently merge the ACR stream into its retail engine. The closed-loop tie-in is itself a *second, separate* opt-in.\n\nThe 20-year term is documented in 2017 settlement analyses [10][11]; the live opt-in architecture is quoted from Vizio's own 2025–2026 privacy policy [12][13]. One caveat: there is no *formal FTC order-modification docket* confirming the consent decree's transfer/assignment language; the conclusion rests on (a) the order's stated 20-year term and (b) the observable, still-operating opt-in mechanism. The *assignment mechanics* are therefore not directly verified.\n\n### \"Inscape\" remains the brand; the data business was NOT renamed into Walmart Connect / Data Ventures\n\nFrom mid-2025 to mid-2026, the data-licensing arm still trades as **Inscape** / \"VIZIO's Inscape\": **inscape.tv is live** with current news posts, the **Inscape Data** LinkedIn page is active, and 2025 partner press releases (Nielsen, VideoAmp, TVision) all use the \"VIZIO's Inscape\" name [3][4][5][14]. The consumer-facing **ad business** is branded **Vizio Ads / Platform+** [9]. Walmart's announced brand strategy is to make **Vizio a Walmart private TV brand** — selling sets at Walmart/Sam's Club, migrating the OS toward its **onn** private label, and combining Vizio with **Walmart Connect** for full-funnel retail-media measurement. But that concerns the *TV hardware/OS brand and the retail-media tie-in*, not a retirement of the Inscape data-licensing name [15][16]. The answer, then: **still \"Inscape\"**, not folded or renamed [3][4][5][14].\n\n### The real residual risk is strategic conflict, not present-tense discontinuation\n\nTwo facts pull against complacency. First, **Walmart's stated direction** is full-funnel retail media: Talk Business reports Walmart \"touts gains with Vizio\" in year one, and AdExchanger has argued Vizio's profitability is \"a boon for Walmart's ads business\" — the asset is being optimized for *Walmart's* monetization, which over time can favor exclusivity [16][17]. Second, the **conflict of interest is structural**: Walmart Connect competes — for ad budgets and for data primacy — with the very measurement and DSP ecosystem Inscape licenses to. Analysts at Digilant named a \"conceivable scenario where Walmart could restrict access to Vizio's ACR data, opting to bring the valuable asset in-house\" — framed as a *risk to monitor*, not a *change that has occurred* [18]. The honest read: **third-party licensing is alive today and was actively renewed**, but the incentive to wall it off grows as Walmart's retail-media flywheel matures. Political use — lower-margin, reputationally sensitive, cyclical — is a plausible first thing to deprioritize. The conclusion to carry forward is a *watch*, not an obituary — an inference about future risk, grounded in established facts about incentives: Walmart's stated retail-media strategy plus analysts' own risk-framing [16][17][18].\n\n---\n\n## Narrative\n\n### What the acquisition actually changed — and what it didn't\n\nWalmart never bought Vizio for the televisions. It bought the **data and the ads**. AdExchanger called Inscape \"a valuable ads data asset\" in its headline on the deal, and Walmart's own framing centered the closed loop between Inscape's **glass-level ACR viewing data** and Walmart's **first-party retail-purchase data** [17][19]. That same logic is exactly why a careful analyst should have worried about the third-party arm: to Walmart, the highest-value version of Inscape data is the version no competitor can buy. The risk was real to flag. What the 2025–2026 record shows is that, so far, Walmart chose **continuity over enclosure** — at least for the measurement and political pipes.\n\nThe clearest tell is the **renewal cascade**. A company about to wall off a data asset does not let its largest consumers re-sign multi-year deals. Yet between October 2024 and June 2025, every named Inscape consumer relevant here re-upped: Comscore (whose **Predictive Audiences** sit in Layer 4 of the stack), VideoAmp, Nielsen, and TVision [1][3][4][5]. Comscore's renewal is the most consequential one for politics, because Comscore's ACR layer is part of the productized political-audience machinery. Trade coverage read the timing as exactly the going-concern signal it was — Vizio data would *not* become \"exclusive to Walmart Connect\" [2].\n\n### The political pipe specifically stayed open\n\nThe pointed question is whether reporting exists on **political advertisers' continued access to Vizio ACR**. It exists, and it is specific. Vizio Ads' political product — built on **AdImpact × Inscape** — survived the close and carried into the 2026 cycle, with trade outlets covering Vizio \"expanding work with AdImpact ahead of elections\" [7][8]. These are not generic CTV capabilities. They are the addressable-politics primitives that matter here: **candidate-exposure segments** (unexposed / under-exposed / saw-the-opponent), **reach-and-frequency optimization across households**, and **congressional-district-level** planning, targeting, and measurement [6][9]. Vizio's own Platform+ case study markets these as live offerings for political buyers [9]. The exact node treated as live across the earlier chapters is, in fact, live — and Walmart-owned Vizio is *actively selling it to campaigns*.\n\n### Consent: the 2017 order didn't die — it's the operating system\n\nThe **2017 Vizio FTC settlement** was the contingent decision that made ACR *legal to use* by putting it on an opt-in footing. The going-concern question is whether that footing survived a change of control to an owner with a giant first-party data appetite. It did, in two senses. **Legally:** the stipulated order was entered against the corporate entities (including **VIZIO Inscape Services, LLC**) for a **20-year term** with an ongoing compliance monitor — it binds the entity to ~2037 regardless of ownership, and no public record shows its termination on the Walmart deal [10][11]. **Operationally:** Vizio's *current* privacy policy still gates ACR/Viewing Data behind an affirmative setup choice that can be revoked at any time, and — the most reassuring detail — it keeps **Vizio OS Data separate from the Walmart account until the consumer separately opts in to combine them** [12][13]. The much-discussed Walmart closed loop is therefore no automatic merger. It is a *second* consent gate stacked on top of the ACR consent gate. (Consumer-rights commentators have criticized Walmart for making *some* TV features contingent on a Walmart account [20] — a real UX-coercion debate — but that is distinct from the ACR-viewing-data consent, which stays separately toggle-able.)\n\nOne thing remains unconfirmed: the formal mechanics of how the FTC consent decree was *assigned or acknowledged* in the acquisition, since no order-modification docket is on the public record. The substantive conclusion holds on the order's term plus the observable live mechanism, with the assignment mechanics best treated as not directly confirmed.\n\n### The brand, and where the renaming actually is\n\n\"Inscape\" is not gone. The data unit still publishes under **inscape.tv**, still posts as **Inscape Data** on LinkedIn, and is still named \"VIZIO's Inscape\" in 2025 partner releases [3][4][5][14]. Walmart *is* renaming things, but one layer over: it intends to run **Vizio as a Walmart private TV brand**, migrate the operating-system experience toward its **onn** label, and market the Inscape-plus-Walmart-purchase combination through **Walmart Connect / Walmart Data Ventures** for full-funnel retail measurement [15][16]. So the precise answer to \"is it still Inscape, or folded into Walmart Connect?\" is this: **the data-licensing brand is still Inscape; the retail-media *application* of that data flows through Walmart Connect.** Both can be true at once — and both are.\n\n### The risk that's actually left\n\nNone of this means the original caution was wrong. It means the caution should be **re-pointed**. The danger was never that Walmart had *already* killed third-party political licensing by mid-2026 — the evidence is squarely against that. The danger is **forward-looking and structural**: Walmart Connect's whole thesis is data exclusivity, Walmart \"touts gains with Vizio\" as a retail-media win, and a named analyst (Digilant) has already articulated the in-housing scenario as a live possibility [16][17][18]. Political spend is cyclical, comparatively small, and reputationally fraught for a mass-market retailer — a plausible early casualty if Walmart ever does tighten the aperture. The right posture is a **strategic-conflict watch on the 2027–2028 window**, when the retail-media flywheel will be more mature and the next presidential cycle's licensing terms get set.\n\n---\n\n## How this revises the earlier chapters\n\n- **The addressability stack, Layer 1:** the point that \"Vizio's ACR engine Inscape is now Walmart-owned\" is correct but should add: *and continues to license ACR data to Comscore, Nielsen, VideoAmp, and TVision under deals renewed/extended through 2025; footprint now cited at 24M+ opted-in TVs* [1][3][4][5]. The 19M-account figure is a pre/early-close number; partners now cite **24M+ opted-in TVs** in 2025 [3][4].\n- **Players and market structure:** keep the acquisition facts, but **strengthen** the \"run separately from Walmart Connect 'for the foreseeable future'\" point with the harder evidence that the *third-party* arm — not just the internal wall — stayed open and politically active into 2026 [6][7][8]. The open question of whether Walmart's ownership changes Vizio's political-ad posture is now answerable: *not yet restrictive; actively courting political buyers via AdImpact, with an in-housing risk for future cycles.*\n- **Drivers and forces:** Walmart's retail-media motive belongs in the *counter-forces / consolidation* driver as a **latent restriction risk on the ACR-data supply**, not as a present-tense reduction.\n\n---\n\n## Open Questions\n\n1. **FTC order assignment mechanics.** Was the 2017 stipulated order formally assigned/acknowledged on the Walmart change of control, or modified? No order-modification docket was retrieved; the 20-year term and live opt-in mechanism are the basis for the survival conclusion.\n2. **Are the renewed third-party deals *political-use-permissive*?** The renewals (Comscore/Nielsen/VideoAmp) are *measurement* deals; AdImpact is the *political-targeting* deal. Whether any renewal carved out or restricted political/electioneering use is not disclosed in public terms.\n3. **Comscore Predictive Audiences dependency.** How much of Comscore's *political* Predictive-Audiences product specifically depends on the Inscape ACR feed vs. L2/other inputs — i.e., how exposed is that pillar of the addressability stack to a future Inscape cutoff?\n4. **Post-2026 licensing terms.** Will Walmart renew the third-party (especially political) pipes for the **2028** presidential cycle, or begin tightening once the retail-media flywheel matures? This is the live going-concern watch.\n5. **Updated, U.S.-only, opt-in-adjusted footprint.** Partners cite \"24M+ opted-in TVs,\" but a clean comparable U.S. household count post-acquisition is still not pinned (the same open question raised in the chapter on the addressability stack).\n\n---\n\n## Sources\n\n1. Adweek Wire, \"Comscore and VIZIO's Inscape Expand Partnership to Enhance Smart TV Measurement,\" Oct 2024 — Tier 5 (trade; partner release distributed). Renewal across 210 local markets; pre-vote timing. https://www.adweek.com/adweek-wire/comscore-and-vizios-inscape-expand-partnership-to-enhance-smart-tv-measurement/ — Accessed 2026-06-23.\n2. eMarketer, \"Vizio is renewing major measurement partnerships as Walmart acquisition looms,\" Oct 7 2024 — Tier 5 (analytical trade). Renewal \"could ease fears that Vizio viewership data would become exclusive to Walmart Connect.\" https://www.emarketer.com/content/vizio-renewing-comscore-partnership-walmart-acquisition — Accessed 2026-06-23.\n3. Inscape (VIZIO), \"VideoAmp and VIZIO's Inscape Renew Partnership…,\" Mar 27 2025 — Tier 1 (company release, used as evidence of the deal's existence/branding) / Tier 5 distribution. Tuner Data (5,000+ stations), Commercial Feed+, 24M+ opted-in TVs; inscape.tv live and branded \"Inscape.\" https://www.inscape.tv/resources/News/2025/videoamp-and-vizio-s-inscape-renew-partnership--furthering-the-i — Accessed 2026-06-23.\n4. Nielsen, \"Nielsen and VIZIO's Inscape Extend Relationship to Strengthen TV Measurement,\" Jun 2025 — Tier 1 (company release) / Tier 5 distribution. Multi-year; ACR from 24M+ smart TVs across broadcast/cable/streaming; brand still \"Inscape.\" https://www.nielsen.com/news-center/2025/nielsen-and-vizios-inscape-extend-relationship-to-strengthen-tv-measurement/ — Accessed 2026-06-23.\n5. TVision, \"Inscape and TVision Unlock Personified Cross-Platform Viewing Behavior…\" (multi-year extension, 2025) — Tier 5 (trade/partner). Enriches Inscape's 24M+ opted-in base. https://www.tvisioninsights.com/resources/tvision-and-inscape — Accessed 2026-06-23.\n6. RBR (Radio & Television Business Report), \"VIZIO Expands Partnership With AdImpact Ahead Of Political Season\" — Tier 5 (trade). 23M+ opt-in devices; zip/congressional-district insight; political election-season framing. https://rbr.com/vizio-expands-partnership-with-adimpact-ahead-of-political-season/ — Accessed 2026-06-23.\n7. TVREV / AdImpact, \"Why The 2026 Midterms Could Be The Biggest Political Ad Cycle Ever,\" 2026 — Tier 5 (analytical trade). 2026 cycle ~$10.8B total, ~$2.5B CTV; context for Vizio/AdImpact political push. https://www.tvrev.com/news/why-2026-midterms-could-be-biggest-political-ad-cycle-ever-adimpact — Accessed 2026-06-23.\n8. Next TV, \"Vizio Expands Work With AdImpact Ahead of Elections\" — Tier 5 (trade). AdImpact ad catalog (1.2M+ creatives) + Inscape data for Vizio Ads political buyers, into the election season. https://www.nexttv.com/news/vizio-expands-work-with-adimpact-ahead-of-elections — Accessed 2026-06-23.\n9. VIZIO Platform+ (\"Vizio Ads\"), \"Case Study: CTV Is Poised To Play A Major Role In This Election Advertising Cycle\" — Tier 1 (vendor self-description; evidence of what Vizio Ads offers, not of effectiveness). Custom political segments (unexposed / low-exposure / competitive-exposure devices); national→district→zip targeting; branded Vizio Ads / Platform+. https://platformplus.vizio.com/insights/case-study-ctv-is-poised-to-play-a-major-role-in-this-election-advertising-cycle — Accessed 2026-06-23.\n10. WilmerHale, \"VIZIO to Pay $2.2 Million to Settle Consumer Tracking Charges…,\" 2017 — Tier 5 (law-firm analysis quoting the FTC order). Viewing history = sensitive; opt-in consent required going forward. https://www.wilmerhale.com/en/insights/blogs/wilmerhale-privacy-and-cybersecurity-law/vizio-to-pay-2-2-million-to-settle-consumer-tracking-charges-ftc-treats-television-viewing-history-as-sensitive-information-requiring-notice-and-opt-in-consent-outside-the-privacy-policy — Accessed 2026-06-23.\n11. Davis Wright Tremaine, \"The Real Takeaway From VIZIO's Privacy FTC Settlement,\" 2017 — Tier 5 (law-firm analysis). Order against VIZIO, Inc. and VIZIO Inscape Services, LLC; 20-year third-party-monitor compliance term; data-destruction + opt-in. https://www.dwt.com/blogs/media-law-monitor/2017/10/the-real-takeaway-from-vizios-privacy-ftc-settleme — Accessed 2026-06-23.\n12. VIZIO, \"Privacy Policy\" / \"Viewing Data Supplement\" (current, 2025–2026) — Tier 1 (primary; the entity's own current terms). Viewing Data is an opt-in ACR choice, disable-able at \"All Settings > Privacy & Legal > Viewing Data\"; VIZIO OS Data kept separate from Walmart account until opt-in. https://www.vizio.com/en/terms/privacy-policy — Accessed 2026-06-23.\n13. VIZIO, \"Combine VIZIO OS Data with your Walmart Account Data\" (current) — Tier 1 (primary). Distinct opt-in toggle to combine Vizio OS Data (incl. Viewing Data) with Walmart account data; opt-out at any time via VIZIO.com/account or the VIZIO Mobile App. https://www.vizio.com/en/terms/privacy-policy/combine-VIZIO-OS-data-with-your-walmart-account-data — Accessed 2026-06-23.\n14. Inscape Data, LinkedIn company page (active 2024–2026) — Tier 7 for facts (social), used here only as evidence the \"Inscape Data\" brand/entity remains operational. https://www.linkedin.com/company/inscape-data-inc — Accessed 2026-06-23.\n15. Lowpass, \"Who will Walmart's Vizio acquisition hurt the most?\" — Tier 5/6 (analytical newsletter). Inscape data business; 19M+ SmartCast accounts; Walmart brand/onn-OS strategy context. https://www.lowpass.cc/p/walmart-vizio-acquisition-inscape-data-roku — Accessed 2026-06-23.\n16. Talk Business & Politics, \"The Supply Side: Walmart touts gains with Vizio in first year,\" Dec 2025 — Tier 4/5 (regional business outlet). One-year retrospective on Walmart's Vizio/ads gains; retail-media direction. https://talkbusiness.net/2025/12/the-supply-side-walmart-touts-gains-with-vizio-in-first-year/ — Accessed 2026-06-23.\n17. AdExchanger, \"Vizio's Profitability Could Be A Boon For Walmart's Ads Business\" — Tier 5 (trade). Vizio/Inscape optimized for Walmart's ad monetization. https://www.adexchanger.com/tv/vizios-profitability-could-be-a-boon-for-walmarts-ads-business/ — Accessed 2026-06-23.\n18. Digilant, \"Walmart's Vizio Acquisition and Navigating the ACR Data Evolution\" — Tier 5/6 (agency blog; position-evidence). Frames in-housing as a \"conceivable scenario,\" i.e., a risk to monitor, not a confirmed change. https://digilant.com/blog/walmarts-vizio-acquisition-and-navigating-the-acr-data-evolution/ — Accessed 2026-06-23.\n19. AdExchanger, \"Walmart Buys Smart TV Manufacturer Vizio, A Valuable Ads Data Asset\" — Tier 5 (trade). Inscape ACR = the asset Walmart wanted; ~quarter of U.S. smart-TV share. https://www.adexchanger.com/tv/walmart-buys-smart-tv-manufacturer-vizio-a-valuable-ads-data-asset/ — Accessed 2026-06-23.\n20. Consumer Rights Wiki, \"Vizio Walmart account requirement for smart TV features\" — Tier 6/7 (advocacy wiki; position-evidence only). Documents the criticism that some Vizio features now require a Walmart account — a distinct UX-coercion issue from ACR-viewing-data consent. https://consumerrights.wiki/w/Vizio_Walmart_account_requirement_for_smart_TV_features — Accessed 2026-06-23."}, {"order": 9, "file": "09_Gap_Fox_Roku_DealStatus.md", "title": "Fox–Roku Deal Status: The Caveat the Analysis Rests On", "summary": "", "body": "# Fox–Roku: Is the Caveat Still True?\n\n## Bottom Line\n\nAs of June 23, 2026, the Fox–Roku transaction is **signed but not closed, and not blocked** — exactly the state the earlier chapters on the addressability stack and on market structure describe, and the freshest dated sources confirm the framing holds rather than having gone stale. Fox Corporation and Roku entered a *definitive* Agreement and Plan of Merger dated June 14, 2026 (announced June 15, 8-K filed the same day), under which Fox acquires Roku for $160.00 per share — roughly $22 billion in enterprise value, 60% cash / 40% Fox Class A stock — leaving Fox holders with ~73% and Roku holders ~27% of the combined company. It is *not yet consummated*. Closing still needs Fox and Roku shareholder votes plus regulatory clearance, including expiration of the Hart-Scott-Rodino waiting period and \"certain other antitrust and foreign\" approvals. The legal outside (\"Termination\") date is **June 14, 2027, extendable to December 14, 2027 and then March 14, 2028** if review drags — so the \"expected 1H 2027\" close is company guidance, but the contractual runway reaches into 2028. The sharpest new fact: Fox agreed to a **reverse termination fee of $1,237,262,000** payable to Roku if the deal dies on antitrust or investment-screening grounds (versus an $866,084,000 fee for a board-recommendation-change breakup) — a billion-dollar price tag on regulatory risk both sides and most analysts still call surmountable. No reporting found indicates the deal changes the treatment of Roku's political ad archive or ACR data licensing; that is an *open question observers are raising*, not a settled deal term. And the deal is real, not speculation: two boards approved it unanimously, Anthony Wood's ~55%-voting-power bloc signed a binding support agreement, and a stream of SEC Form 425 investor communications is now prosecuting the shareholder vote. **The verdict: the \"announced but not closed\" caveat is accurate as written. The one refinement is that the legal long-stop is 2028, not 2027, and a >$1B antitrust reverse-breakup fee is the cleanest evidence that \"could be blocked or restructured\" is a live, priced scenario.**\n\n---\n\n## What the Filings Establish\n\n### The deal is a signed definitive agreement, not a rumor or a letter of intent.\n\nFox Corporation and Roku, Inc. entered into a definitive Agreement and Plan of Merger dated **June 14, 2026**, publicly announced **June 15, 2026**, under which Fox will acquire Roku for **$160.00 per share** — **$96.00 in cash plus 0.9693 Fox Class A (FOXA) shares** per Roku share — valuing Roku at approximately **$22 billion in enterprise value**; consideration is ~60% cash ($15B) / ~40% stock (~152M FOXA shares); upon closing existing Fox holders own ~73% and Roku holders ~27% of the combined company.\n\nRoku filed an 8-K on 2026-06-15 (Item 1.01, Entry into a Material Definitive Agreement) attaching the merger agreement as Exhibit 2.1, the press release as 99.1, and two Voting and Support Agreements as 10.1/10.2 [1][2]. Fox's own corporate press release and its 8-K carry identical terms [3][4]. Wire/major-outlet reporting (CNBC, NBC News, Hollywood Reporter) corroborates the $22B / $160-per-share / 1H-2027 frame independently [5][6][7]. The 60/40 cash-stock split, 152M-share issuance, and 73/27 post-close ownership come directly from the Fox release [3]. This is the fact the earlier chapters build the ACR-ownership caveat on.\n\n---\n\n### As of June 23, 2026 the deal is NOT closed — it is conditioned on shareholder votes and antitrust clearance (HSR + foreign).\n\nClosing is conditioned on (1) Fox and Roku shareholder approval, (2) **expiration or early termination of the Hart-Scott-Rodino Antitrust Improvements Act waiting period** and approval \"under certain other antitrust and foreign\" investment/competition laws, and (3) other customary conditions; the companies guide to a close in the **first half of calendar 2027**. As of June 23, 2026 none of these has been satisfied and the merger has not been consummated — Roku remains a standalone public company.\n\nThe Roku 8-K body recites the conditions verbatim: shareholder approval \"voting together as a single class,\" then \"the expiration or early termination of the applicable waiting period under the Hart-Scott-Rodino Antitrust Improvements Act of 1976, as amended, and the approval of the Mergers under certain other antitrust and foreign\" laws [1]. Fox CEO Lachlan Murdoch publicly characterized the principal regulatory requirements as \"HSR approval in the United States and … very limited international approvals\" [8]. Company guidance of \"first half of calendar year 2027\" appears in the Fox release and SEC materials [3][1]. That the deal is still pending (not closed) is self-evident from the active Form 425 investor-solicitation filings dated June 16–18, 2026, which exist *because* a shareholder vote has not yet happened [9][10].\n\n---\n\n### The legal outside date runs to 2027–2028, not just \"1H 2027\" — antitrust delay is contractually anticipated.\n\nThe merger agreement's \"Termination Date\" (outside date) is **June 14, 2027**, which \"may be extended to December 14, 2027\" and \"may be further extended to March 14, 2028, under certain circumstances.\" Either party may terminate if the mergers are not completed by that date, or if a governmental entity issues a final non-appealable order permanently prohibiting the mergers, or if a required regulatory approval is finally denied.\n\nDirect quotation from the Roku 8-K describing termination rights: \"by either the Company or Parent if the Mergers are not completed by June 14, 2027, which date may be extended to December 14, 2027, and which date may be further extended to March 14, 2028, under certain circumstances (the 'Termination Date')\" [1]. The same section provides for termination \"if any governmental entity of a competent jurisdiction has issued a final non-appealable order or injunction permanently restraining, enjoining or otherwise prohibiting the Mergers\" [1]. The refinement to absorb: the *guidance* is 1H 2027, but the *contract* tolerates a slide to early 2028, which is exactly what a contested antitrust review would consume.\n\n---\n\n### Fox agreed to a ~$1.24B reverse termination fee tied to antitrust failure — pricing real regulatory risk.\n\nThe merger agreement carries asymmetric breakup fees: a **$866,084,000** termination fee payable by the breaching party in specified circumstances (e.g., a board-recommendation change), and a larger **$1,237,262,000** fee payable by **Fox (the \"Parent\")** to Roku if the deal is terminated \"following an injunction arising in connection with certain antitrust or investment screening laws, or failure to receive certain required regulatory approvals.\" A ~$1.24B antitrust reverse-breakup fee is direct contractual evidence that the parties regard regulatory failure as a genuine, monetizable risk rather than a formality.\n\nThe Roku 8-K states both figures: a mutual \"$866,084,000\" termination fee, and that \"Parent, under specified circumstances, including termination following an injunction arising in connection with certain antitrust or investment screening laws, or failure to receive certain required regulatory approvals of specified governmental authorities by the Termination Date, will be required to pay the Company a termination fee of $1,237,262,000\" [1]. Trade analysis read the >$1B fee the opposite way — as \"signaling both parties' confidence in clearance\" [8] and \"management confidence\" [11] — because a fee that large only gets paid if the deal collapses, and you accept it when you expect to close. Both readings are compatible: the fee is large *because* the antitrust question is real, and the parties accepted it *because* they expect to win it. Note the agreement separately requires \"reasonable best efforts to take all actions necessary to consummate the Mergers, including cooperating to obtain the regulatory approvals\" [1] — an effort standard, with the antitrust risk allocated to Fox via the reverse fee.\n\n---\n\n### The deal is real, not speculation — unanimous board approval plus a binding ~55%-voting-power support agreement make shareholder approval near-certain.\n\nBoth companies' boards unanimously approved the transaction, and concurrently with signing, **Anthony Wood (Roku founder/CEO) and affiliated stockholders — collectively ~55% of Roku's outstanding voting power** via Roku's dual-class structure — entered a binding Voting and Support Agreement to vote for the deal; a separate Buyside VSA binds Fox stockholders holding ~38.7% of Fox's voting power. This forecloses the \"was the deal ever real / mere speculation\" question: it is a signed, board-blessed, insider-locked transaction, not a rumor.\n\nThe Roku 8-K describes the \"Sellside VSA\" with \"Mr. Anthony Wood … and certain other stockholders of the Company affiliated with Anthony Wood,\" who \"collectively held approximately 55% of Company's outstanding voting power,\" and a \"Buyside VSA\" covering stockholders holding \"approximately 38.7% of Parent's outstanding voting power\" [1]. Media analyst Rich Greenfield (LightShed) called it \"a done deal for Fox and Roku,\" citing Wood's ~55% voting control as making competing bids unlikely [11]. TheWrap independently noted Wood's voting agreement makes shareholder approval \"a near-certainty\" [11]. The exhibit list confirms VSAs 10.1 and 10.2 \"dated as of June 14, 2026\" [1]. There is *no* credible counter-reporting that the deal is fictional or pure speculation; the skepticism that exists is about strategic wisdom and price, not existence, as the next section lays out.\n\n---\n\n### Counter-reporting exists — but it questions Fox's strategic logic and price, not whether the deal will close.\n\nThe skeptical commentary on the deal targets (a) Fox's strategic and financial wisdom — Fox shares fell sharply on the announcement and a leveraged balance sheet drew concern — and (b) whether the combined entity can hold Roku's platform neutrality, *not* whether the transaction is genuine or will be consummated. T.D. Cowen's Doug Creutz flagged that \"the broader history of the industry suggests skepticism,\" and other analysts were \"quite skeptical\" about competing bidders emerging — i.e., skeptical the price gets topped, which *favors* this deal closing, not skepticism it closes.\n\nReporting noted Fox Corporation shares \"collapsed 17% on heavy volume following the announcement,\" with investors repricing Fox to \"a post-deal net leverage ratio of 2.8x trailing 12-month EBITDA\" [12]. T.D. Cowen analyst Doug Creutz \"expressed reservations in a note to clients, noting 'the broader history of the industry suggests skepticism'\" about the strategic combination [12]. Regulatory attorney Braden Perry predicted \"approval with conditions, such as commitments on how Roku treats competing apps,\" citing the recent Paramount–Warner Bros. Discovery clearance as precedent [11] — a closes-with-remedies view, not a blocked view. The market's 17% Fox drawdown is about Fox-as-acquirer value and leverage, not deal-completion odds. The deal is real; the debate is whether it was *wise*.\n\n---\n\n### A single owner would hold both Roku's ACR/home-screen layer AND Tubi — the core vertical/self-preferencing antitrust theory in political CTV.\n\nThe principal antitrust concern is *vertical*, not horizontal: one owner would hold premium news/sports content (Fox News, Fox Sports), the #1 U.S. TV-OS and its home screen / search / ad inventory (Roku), two major FAST services (Tubi + The Roku Channel), and the ACR sensor across ~100M+ households. The theories of harm flagged by legal observers are (a) **self-preferencing** of Fox apps and squeezing of rival streamers on a platform that \"grew by being neutral and carrying everyone,\" (b) the **Tubi / Roku Channel FAST overlap**, and (c) Fox gaining \"direct intelligence on how its rivals' programming performs on 100 million screens\" via Roku ACR. For *political* CTV specifically, this concentrates a top ACR/inventory layer and a leading FAST political-ad surface (Tubi) under one content owner.\n\nMLex (specialist antitrust/regulatory press) framed the deal as teeing up \"US antitrust review of streaming, connected-TV ads,\" with vertical issues \"in streaming distribution, connected-TV advertising and the treatment of rival streaming services on Roku's platform\" [14]. Trade analysis named the Tubi/Roku-Channel overlap and Roku's \"control of the home screen, search results and ad inventory that different services depend on\" as likely DOJ/FTC scrutiny points [15][11]. The combined entity would lift Fox's share of U.S. TV viewing from ~7.2% (March 2026) to ~10.2%, above Paramount, Netflix, and NBCUniversal [15] — a horizontal data point, but the regulator's emphasis is the vertical content-distribution-advertising stack. Fox and Roku pre-committed to operate Roku as \"an open, partner-friendly platform\" [3], but as one analysis noted, \"those commitments are not legally binding consent decrees\" [15]. Comparators cut toward *clearance with conditions*: Amazon already owns Fire TV, Google owns Android/Google TV, and Walmart owns Vizio/Inscape — so an OEM-plus-content owner is no longer unprecedented [11][15]. This is the political-CTV stake: who controls a top ACR/inventory layer.\n\n---\n\n### No deal term found changes the treatment of Roku's political ad archive or ACR data licensing — but it is an explicitly open question under new ownership.\n\nAcross the primary filings and trade reporting reviewed, **no disclosed deal term addresses Roku's public political ad archive (launched Sept 2020) or the licensing of Roku ACR data**; the deal documents speak to data as a strategic asset (\"Roku's 100% authenticated first-party data across 100M+ streaming households\" merged with Fox's TTD-based identity layer of UID2 / OpenPath) but are silent on political-archive continuity and on whether ACR licensing terms to third-party political buyers change. Whether Fox ownership preserves, expands, or curtails Roku's political transparency is an open question observers are actively raising, not a settled term.\n\nThe Fox release and 8-Ks frame Roku's \"first-party data and direct relationship with more than 100 million global streaming households\" as the strategic prize [3], and trade analysis describes merging \"Roku's 100% authenticated first-party data\" with Fox's \"identity layer built through The Trade Desk collaboration (Unified ID 2.0 and OpenPath)\" [15] — but neither names the political ad archive or ACR licensing. No source reviewed reports any change to the archive. Independent observers explicitly flagged the gap: commentary noted the deal \"will have major implications for 2028\" and asked whether the merged entity \"will provide spending transparency reports like Meta and Google\" [16]. Roku's existing archive (payer, campaign IDs, creative — not bulk spend/targeting/impressions) and its political guidelines remain the live policy as of June 2026 [17]. The honest finding: the political-archive/ACR-licensing treatment under Fox is *undetermined and undisclosed*, not changed.\n\n---\n\n## Narrative\n\n### What the earlier chapters say, and whether it still holds\n\nA deal announced eight days before these pages were written is the kind of fact that rots fastest. The chapters on the addressability stack and on market structure each hang a caveat on the same hinge: Roku is the largest single CTV footprint in U.S. political advertising, and it \"is the subject of a pending $22B Fox acquisition announced June 15, 2026 but not yet closed.\" The addressability chapter goes further, warning that \"any sentence that says 'Fox owns Roku's ACR data' is, today, false-by-a-year,\" with close expected \"in the first half of 2027\" and Roku still \"a standalone public company\" as of June 23, 2026. The worry is that this phrasing is stale-prone — that by now the deal could be closed, blocked, repriced, restructured, or abandoned, each of which would rewrite who controls a top ACR/inventory layer in political CTV.\n\nThe freshest dated sources answer: **the caveat is accurate as written.** The deal is signed and pending, neither dead nor done. What it needs is a sharpening, not a reversal — and the sharpening cuts the caveat's way, because the contract itself anticipates that antitrust review could push the close past 2027.\n\n### The deal is a definitive agreement, locked by insiders\n\nThis is not a leak, a letter of intent, or a trial balloon. Roku's 8-K of June 15, 2026 reports \"Entry into a Material Definitive Agreement\" (Item 1.01) and attaches the full Agreement and Plan of Merger as Exhibit 2.1 — a 700KB-plus instrument dated June 14, 2026 [1]. Fox's own 8-K and press release carry identical terms [3][4]. Both boards approved unanimously. And the agreement came pre-locked: Anthony Wood and affiliated stockholders, who control roughly 55% of Roku's voting power through the dual-class shares, signed a binding Voting and Support Agreement the same day [1]. A unanimous board plus a committed majority bloc makes the Roku shareholder vote, as LightShed's Rich Greenfield put it, effectively \"a done deal\" [11]. So the question of whether the deal was ever real answers itself cleanly: the deal was always real. The only people calling it into question debate whether Fox should have done it — not whether it happened.\n\n### What is NOT done: antitrust\n\nWhere the deal genuinely hangs is regulatory. The closing conditions, quoted verbatim from the 8-K, require shareholder approval, \"the expiration or early termination of the applicable waiting period under the Hart-Scott-Rodino Antitrust Improvements Act of 1976,\" and \"the approval of the Mergers under certain other antitrust and foreign\" laws [1]. Lachlan Murdoch told the market the principal hurdles are \"HSR approval in the United States and … very limited international approvals\" [8] — a deliberately confident framing.\n\nTwo facts complicate that confidence. First, the **outside date is not 1H 2027.** The contract's \"Termination Date\" is June 14, 2027, \"which date may be extended to December 14, 2027, and which date may be further extended to March 14, 2028, under certain circumstances\" [1]. Company guidance of \"1H 2027\" is the optimistic case; the legal runway tolerates a slide nearly a year past it — exactly the runway a contested review consumes. Second, and more telling, **Fox agreed to a reverse termination fee of $1,237,262,000** payable to Roku if the deal dies on antitrust or investment-screening grounds — far larger than the $866,084,000 fee for an ordinary breakup [1]. Trade analysts read the size as confidence: you only sign a billion-dollar fee if you expect to close [8][11]. The fuller reading is that the fee is *large because the antitrust question is real*, and the parties accepted it because they expect to win. A formality does not get a ten-figure price.\n\n### The antitrust theory is vertical — and it is a political-CTV theory\n\nThe concern that matters here is not that Fox-plus-Roku gets too big in any one market. Combined, the entity would hold ~10.2% of U.S. TV viewing, up from Fox's ~7.2% in March 2026 — ahead of Paramount, Netflix, and NBCUniversal, but not dominant [15]. The sharper concern is *vertical*: one company would own premium news and sports content, the #1 TV operating system and its home screen, two leading FAST services (Tubi and The Roku Channel), one of the largest CTV ad pipes, and the ACR sensor watching ~100M+ households. MLex framed the review as turning on \"streaming distribution, connected-TV advertising and the treatment of rival streaming services on Roku's platform\" [14]. The recurring worry, in the words of regulatory attorney Braden Perry, is that \"Roku grew by being neutral and carrying everyone,\" and regulators \"will ask whether Fox could favor its own apps\" and squeeze competitors [11].\n\nFor political CTV, the implication is the one these pages have already gestured at: a *content company* — Fox, which also owns Fox News — would control both the largest ACR dataset used for voter-level targeting and Tubi, a leading FAST surface for political ads. Concentrating a measurement sensor and a political-ad inventory pool under a single ideologically-identified owner is exactly the neutrality question that makes the ownership caveat load-bearing. Perry's prediction — \"approval with conditions, such as commitments on how Roku treats competing apps,\" citing the Paramount–Warner Bros. Discovery clearance as precedent [11] — is the modal expert outcome: cleared, but with behavioral remedies. And the comparator set has shifted under regulators' feet: Amazon owns Fire TV, Google owns Android/Google TV, and Walmart already owns Vizio/Inscape's ACR engine. An OEM-plus-data owner is no longer novel [11][15].\n\n### The data and the political archive: undisclosed, not unchanged\n\nThe strategic prize Fox is buying is data. The filings and trade coverage repeatedly foreground \"Roku's 100% authenticated first-party data across 100 million-plus streaming households,\" to be merged with Fox's TTD-built identity layer (Unified ID 2.0, OpenPath) into \"a first-party identity asset of unusual depth in the CTV market\" [15][3]. But on the two questions that matter most here — does any deal term change Roku's political ad archive, or its ACR data licensing? — the disclosed record is *silent*. No filing or report reviewed addresses the political archive (the public, payer-and-creative-level disclosure Roku launched in September 2020), nor whether ACR licensing terms to third-party political buyers change.\n\nThe honest finding is therefore: **undisclosed and undetermined, not changed.** Roku's existing political guidelines and archive remain the live policy as of June 2026 [17]. Independent observers have raised the question — whether a Fox-owned Roku will offer Meta/Google-style spending-transparency reports, and what the concentration means for 2028 — but that is the *question being asked*, not an answer in the deal documents, and its loudest version lives on social media [16]. The fate of Roku's political transparency under Fox is an open question, and neither continuity nor curtailment can be asserted as fact.\n\n### The counter-reporting: skepticism about wisdom, not reality\n\nFinally, there is the question of counter-reporting on whether the deal was ever real rather than speculation. Skeptical commentary exists — but it points elsewhere. Fox shares \"collapsed 17%\" on the announcement as investors repriced a more leveraged balance sheet (a ~2.8x net-leverage ratio) [12], and T.D. Cowen's Doug Creutz warned that \"the broader history of the industry suggests skepticism\" about the strategic logic of a legacy broadcaster buying a streaming OS [12]. Other analysts were \"quite skeptical\" that a competing bidder emerges [12] — which, read correctly, *increases* the odds this specific deal closes rather than getting topped. None of this doubts that the deal exists or that it will be consummated. The deal is real; the open argument is whether it was a good idea and whether antitrust clears it clean or with strings.\n\n### What this sharpens\n\nOne refinement, not a reversal:\n\n1. The \"announced June 15, 2026, not yet closed, Roku standalone as of June 23, 2026\" framing is correct and holds.\n2. On the close date: company guidance is 1H 2027, but the *contractual* outside date is June 14, 2027, extendable to Dec 14, 2027 and then March 14, 2028. A contested antitrust review could push consummation into early 2028.\n3. The reverse-termination-fee fact ($1,237,262,000 payable by Fox on antitrust failure, vs. $866,084,000 ordinary breakup) is the cleanest evidence that \"could be blocked or restructured\" is a *priced, live* scenario — and the vertical/self-preferencing theory (Roku ACR + home screen + Tubi under a Fox News owner) is the political-CTV crux of the review.\n4. The political-ad-archive and ACR-licensing treatment under Fox is *undisclosed and undetermined*, not changed — an open question, not a settled term.\n\n---\n\n## Open Questions\n\n1. **Has HSR been formally filed yet, and will the DOJ or FTC issue a Second Request?** As of June 23, 2026 the public record shows the agreement and the start of the shareholder-solicitation process (Form 425s), but not a confirmed HSR filing date or any Second Request. A Second Request would be the first hard signal of a contested review and would make the 2028 outside date material.\n2. **Which agency takes the review — DOJ or FTC — and under what theory?** The vertical/self-preferencing framing fits either; the assignment (clearance allocation) was not established in sources reviewed and would shape the remedy menu.\n3. **What behavioral remedies, if any, would clear it?** Perry's \"approval with conditions\" prediction implies app-treatment / neutrality commitments; whether those would extend to *political* inventory neutrality or ACR-data access terms is unknown.\n4. **Does the merged entity preserve Roku's political ad archive and its third-party ACR-data licensing to political buyers?** No deal term addresses this; for political CTV it is the single most consequential open question.\n5. **State-AG and political risk:** at least one analysis flagged that \"state attorneys general remain an X factor, and the midterm elections could shake things up if the Democrats retake Congress\" [12] — i.e., the review could be reshaped by the very 2026 cycle these pages forecast.\n6. **Repricing risk:** the cash/stock mix means Roku holders bear FOXA price risk; a sustained Fox-share decline (after the 17% drop) could pressure a renegotiation, though no such move is reported as of June 23, 2026.\n\n---\n\n## Sources\n\n1. **Roku, Inc., Form 8-K, filed 2026-06-15** (Item 1.01 Entry into a Material Definitive Agreement; Item 8.01; Item 9.01). SEC EDGAR, accession 0001140361-26-025115; exhibits include 2.1 Agreement and Plan of Merger (dated 2026-06-14), 10.1/10.2 Voting and Support Agreements, 99.1 press release. **Tier 1 (primary SEC filing).** Source of the HSR clause, the June 14 2027 → Dec 14 2027 → March 14 2028 Termination Date, the $866,084,000 and $1,237,262,000 termination fees, and the ~55% / ~38.7% VSA voting blocs. Body fetched and parsed from `https://www.sec.gov/Archives/edgar/data/1428439/000114036126025115/ef20076172_8k.htm`. Accessed 2026-06-23.\n2. **Roku, Inc., Form 8-K, filed 2026-06-17** (Item 5.07, Submission of Matters to a Vote of Security Holders) and **Form 8-K filed 2026-06-18** (Items 8.01/9.01). SEC EDGAR. **Tier 1.** Evidence the transaction is being actively prosecuted post-signing. Accessed 2026-06-23.\n3. **Fox Corporation, \"Fox Corporation to Acquire Roku, Inc.,\" corporate press release, 2026-06-15.** foxcorporation.com. **Tier 1 as corporate claim.** Source of $160/share, $96 cash + 0.9693 FOXA, ~$22B EV, 60/40 split, 73/27 post-close ownership, \"open, partner-friendly platform\" commitment, Murdoch/Wood quotes. https://www.foxcorporation.com/news/corp-press-releases/2026/fox-corporation-to-acquire-roku-inc/ Accessed 2026-06-23.\n4. **Fox Corporation, Form 8-K, filed 2026-06-15** (press-release exhibit 99.1). SEC EDGAR, `https://www.sec.gov/Archives/edgar/data/0001754301/000119312526270285/d151410dex991.htm`. **Tier 1.** Corroborates deal terms from Fox's side. Accessed 2026-06-23.\n5. **CNBC, \"Fox to buy streaming device maker Roku for $22 billion,\" 2026-06-15.** **Tier 4.** Independent confirmation of terms and 1H-2027 timeline. https://www.cnbc.com/2026/06/15/fox-to-buy-roku.html Accessed 2026-06-23.\n6. **NBC News, \"Fox to buy Roku for $22 billion,\" 2026-06-15.** **Tier 4.** https://www.nbcnews.com/business/media/fox-buys-roku-22-billion-rcna350097 Accessed 2026-06-2
