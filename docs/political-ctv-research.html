olitical Advertising in 2026.\" Accessed 2026-06-23.\n\n---\n\n### Roku, Peacock, Tubi, Paramount+/Pluto confirmed as 2026 accepters\n\nRoku, Peacock (NBCUniversal), Tubi (Fox), and Paramount+/Pluto TV all accept political advertising in the 2026 cycle, each via a verified-political-entity process with creative review.\n\n**Evidence:** The AdWave April 7, 2026 compliance guide lists Roku (accepts across FAST channels and The Roku Channel, advertiser verification plus 3–5 business-day creative review), Peacock (verified political entity + editorial review), and Tubi/Pluto (accept through programmatic exchanges with disclaimer requirements) [6]. The Tuesday Digital 2026 guide independently lists YouTube/YouTube TV, Hulu, Peacock, Roku, Paramount+/Pluto, Tubi, and FAST services as accepters [11]. Roku also maintains a public political ad archive. Two independent 2026 guides, one accept-list — corroborated for the non-OEM accepters.\n\n**Citation:** [6] AdWave 2026-04-07; [11] Tuesday Digital 2026-04-01. Accessed 2026-06-23.\n\n---\n\n### The Feb 2026 Sarandos testimony was an antitrust hearing, not about political ads\n\nA point worth correcting: Ted Sarandos's February 3, 2026 Senate appearance was a Judiciary antitrust-subcommittee hearing on Netflix's proposed acquisition of Warner Bros. Discovery's streaming/studio assets; **political advertising did not come up**, and the hearing does not bear on Netflix's political-ad policy.\n\n**Evidence:** Coverage from Screen Daily, Deadline, CNN, and NBC News places the hearing before the Senate Subcommittee on Antitrust, Competition Policy, and Consumer Rights on Feb 3, 2026, centered on the ~$82–83B Warner Bros. Discovery deal; the questioning that drew headlines concerned the merger and a culture-war exchange over Netflix content (\"woke\" programming), not advertising policy [17][18]. Sarandos's notable line — \"Netflix has no political agenda of any kind\" — was about content, not ads [17]. It is a common mistake to read that testimony as evidence about Netflix's political-ad stance; it is not. The AAPC condemnation (2022) and ongoing buyer lobbying are the valid evidence of pressure on Netflix. None of this weakens the core finding — Netflix's refusal is independently confirmed [2][6][7].\n\n**Citation:** [17] Screen Daily, \"Netflix's Ted Sarandos defends Warner Bros merger plan in US Senate grilling,\" Feb 2026; [18] Deadline / CNN, Feb 3, 2026 hearing coverage. Accessed 2026-06-23.\n\n---\n\n### Netflix's expanding ad business has produced pressure but no political reversal\n\nNetflix's ad tier has scaled sharply through 2026 (the company has touted ~250M global monthly active users on the ad-supported plan), and its ad revenue is on a steep growth path, but this expansion has generated lobbying pressure to open political — not a policy change. As of June 2026 Netflix has announced no plan to accept political ads.\n\n**Evidence:** 2026 trade coverage (Variety, Deadline) reports Netflix claiming its ad tier reached ~250M monthly active users globally (up from ~190M), expanding to more countries, with ad revenue projected to keep roughly doubling [19][20]. Buyers and the AAPC keep pressing for access; the \"crown jewel\" framing (The Trade Desk's Ari Wolfe) captures that Netflix is the most-wanted unavailable supply [2]. Yet every 2026 source checked states the political ban is still in force [6][7]. This is the most live reversal-risk for the 2028 cycle, and the outlook is right to weight it — but a forward risk is not a present fact, and the present roster is unchanged.\n\n**Citation:** [19] Variety, \"Netflix Claims Ad Tier Now Reaches 250 Million Viewers,\" 2026; [20] Deadline, \"Netflix Expands Ad Tier To 15 More Countries,\" May 2026. Accessed 2026-06-23.\n\n---\n\n## What this means for the market-structure picture\n\n1. **The roster stands.** The four-refuser / accept-the-rest roster is confirmed against dated 2025–2026 sources, and the concentration/CPM-premium argument is not undermined. The dated confirmations — especially the Apple Feb-2025 policy page and the AdWave April-2026 and Tuesday-Digital April-2026 guides — mean the roster no longer rests on a single Feb-2025 trade piece.\n\n2. **One factual correction.** Sarandos's February 2026 testimony did not pertain to political ads. It was a Warner Bros. Discovery antitrust hearing, and the topic never arose. The AAPC condemnation and the buyer-lobbying framing remain the valid evidence of pressure on Netflix.\n\n3. **One number to reconcile.** LG's own 2026 page claims \"49M LG Smart TVs,\" against the \"~35M U.S. LG smart TVs\" cited elsewhere. The two may differ by year, by U.S.-only vs. global, or by TV-only vs. all-connected-devices basis — best treated as an open discrepancy rather than a settled figure.\n\n4. **Sourcing texture, not a defect.** Most \"refuse\" confirmations cluster on a handful of trade sources — the Feb-2025 *Campaigns & Elections* roster carries the weight for three of the four refusers. Only Apple is confirmed from its own current policy text. The roster is well-corroborated but, for Amazon/Netflix/Disney+, not independently primary-sourced for the current year. Given how perishable these policies are, that is an honest caveat to carry.\n\n---\n\n## Open Questions\n\n1. **Will any refuser open before 2028?** Netflix is the live case — fast-growing ad business, sustained buyer pressure, AAPC condemnation — but no announced change as of June 2026. Amazon faces a \"First Amendment\" lobbying argument from buyers. Disney+ and Apple TV+ show no movement and have brand-positioning reasons to stay closed. This question is taken up in the outlook.\n2. **Does the stated Amazon policy match a current 2026 page?** The live Amazon prohibited-content page text could not be read directly (a JavaScript shell). Reading the current canonical policy page at `advertising.amazon.com/help/GCYTNMH84AJ537JG` would upgrade the Amazon entry from trade-corroborated to primary.\n3. **LG reach: 35M vs. 49M smart TVs — which basis, which year?** The \"~35M\" figure cited elsewhere needs reconciling against LG's 2026 page.\n4. **Enforcement vs. stated policy.** Reporting has noted political *product* listings slipping through Amazon's e-commerce side despite the ad ban. The gap between stated ad policy and marginal enforcement is real, but it does not change the headline ad-acceptance roster.\n5. **Does Vizio (Walmart) have a distinct, separately-stated political policy?** Vizio is grouped with the OEM accepters via trade coverage, but no Vizio/Inscape- or Walmart-owned-specific 2026 political-ad policy page surfaced directly.\n\n---\n\n## Sources\n\n1. Apple, \"Apple Advertising Policies\" (prohibits ads promoting political candidates, parties, organizations, fundraising, electoral votes/initiatives; case-by-case for public-importance issues). Last updated 2025-02-26. https://ads.apple.com/policies — platform policy. Accessed 2026-06-23.\n2. *Campaigns & Elections*, \"The Streaming Services on Political Advertisers' Wishlists,\" 2025-02-21 (refuse list: Netflix, Prime Video, Disney+, Apple TV; Hulu accepts; Ari Wolfe \"crown jewel\" / \"top of the list\"; ~13M Netflix ad-tier users). https://campaignsandelections.com/industry-news/the-streaming-services-on-political-advertisers-wishlists/ — trade press. Accessed 2026-06-23.\n3. MediaPost, \"Apple TV: When Will Ad Revenue Be Part Of The Plan?,\" 2026-04-17 (Apple TV still without an ad-supported tier as of 2026). https://www.mediapost.com/publications/article/414351/ — trade press. Accessed 2026-06-23.\n4. Amazon Ads, Prohibited Content policy / Film & Learning explainer (Prime Video bans political ads \"during an election year,\" incl. on-demand and Thursday Night Football). https://advertising.amazon.com/help/GCYTNMH84AJ537JG and https://filmandlearning.com/amazon-prime-video-political-ad-ban/ — platform policy (live page text could not be read directly; corroborated by trade reporting). Accessed 2026-06-23.\n5. The Streamable / IMDb, \"Prime Video Is Making America Great by Rejecting Political Ads This Election Season\" (cross-platform refuse confirmation, incl. TNF). https://thestreamable.com/prime-video-is-making-america-great-by-rejecting-political-ads-this-election-season — trade press. Accessed 2026-06-23.\n6. AdWave, \"Political Ad Compliance on CTV Platforms (2026),\" 2026-04-07 (accept: Hulu, Roku, Peacock, Tubi, Pluto; refuse/restrict: Netflix, Apple TV+, Amazon Prime Video). https://adwave.com/resources/political-ad-compliance-ctv-platforms — trade compliance guide. Accessed 2026-06-23.\n7. Multiple 2026 Netflix-advertising trade reports (Netflix remains a \"holdout\"; political among prohibited categories; ~13M U.S. ad-tier users; no reversal as of mid-2026) — e.g., Smart1 Marketing \"Navigating Netflix's Advertising Restrictions\"; AI Digital \"Netflix Advertising: Formats, Costs & Strategy (2026).\" — trade press (marketing-vendor blogs; corroborated by [2]). Accessed 2026-06-23.\n8. AAPC, \"AAPC Condemns Netflix Decision to Deny Access for Political Speech and the Democratic Process\" (2022 condemnation, still cited 2026). https://theaapc.org/ — industry-association advocacy (position evidence, plus primary for the condemnation itself). Accessed 2026-06-23.\n9. Hollywood Reporter, \"Hulu to Accept Political Ads on Abortion and Gun Control After Review of Ad Policies\"; NextTV, \"Disney Flips And Will Accept Political Advertising on Hulu\"; Fox Business, \"Disney to allow political issue ads on Hulu for the first time,\" July 2022 (Hulu reverses; Disney+ continues to refuse). — trade and general press. Accessed 2026-06-23.\n10. Newsweek, \"Disney Backs Down Over Political Ads After Hulu Boycott Threat,\" July 2022. https://www.newsweek.com/disney-hulu-political-ads-boycott-1728374 — general press. Accessed 2026-06-23.\n11. Tuesday Digital, \"The Complete Guide to CTV/OTT Political Advertising in 2026,\" updated 2026-04-01 (accept map: YouTube/YouTube TV, Hulu, Peacock, Roku, Paramount+/Pluto, Tubi, FAST). https://tuesday.digital/resources/intro-political-ctv-ott — vendor guide. Accessed 2026-06-23.\n12. Google, \"Political content — Advertising Policies Help\" / \"Apply for Election Ads verification\" (verification, \"Paid for by\" disclosure, sensitive-attribute targeting limits). https://support.google.com/adspolicy/answer/6014595 and https://support.google.com/adspolicy/troubleshooter/9973345 — platform policy. Accessed 2026-06-23.\n13. Search Engine Land, \"Google allows Election Ads on YouTube and updates its Political Content Policy\"; trade coverage of the April 2026 YouTube/Discover election-ad clarification. — trade press. Accessed 2026-06-23.\n14. LG Ad Solutions, \"Winning Political CTV Strategies for 2026\" (first-party ACR for political targeting; custom voter segments; \"49M LG Smart TVs and 363M+ connected devices in the U.S.\"; © 2026 Alphonso Inc.). https://lgads.tv/winning-political-ctv-strategies-for-2026/ — vendor pitch page. Accessed 2026-06-23.\n15. Samsung Ads, \"Political | Solutions\" (voter targeting \"in a fully-compliant manner\"; Samsung DSP self-serve/managed). https://www.samsung.com/us/business/samsungads/solutions/political/ — vendor page. Accessed 2026-06-23.\n16. Basis, \"The Ultimate Guide to Political Advertising in 2026\" (LG/Samsung/Vizio OEM FAST channels with growing political inventory; CTV the only channel projected to grow vs. 2024; ~$2.5B 2026 CTV political). https://basis.com/blog/the-ultimate-guide-to-political-advertising-in-2026 — vendor guide. Accessed 2026-06-23.\n17. Screen Daily, \"Netflix's Ted Sarandos defends Warner Bros merger plan in US Senate grilling,\" Feb 2026 (Feb 3, 2026 antitrust-subcommittee hearing on the WBD acquisition; political ads did not come up; \"Netflix has no political agenda of any kind\"). https://www.screendaily.com/news/.../5213369.article — trade press. Accessed 2026-06-23.\n18. Deadline / CNN, coverage of the Feb 3, 2026 Senate antitrust hearing on Netflix–Warner Bros. Discovery (culture-war exchange; merger focus). https://deadline.com/2026/02/netflix-warner-bros-senate-antitrust-1236707208/ — trade press. Accessed 2026-06-23.\n19. Variety, \"Netflix Claims Ad Tier Now Reaches 250 Million Viewers Worldwide, Up From 190 Million,\" 2026. https://variety.com/2026/tv/news/netflix-claims-ad-tier-reaches-250-million-viewers-1236746219/ — trade press. Accessed 2026-06-23.\n20. Deadline, \"Netflix Expands Ad Tier To 15 More Countries, Touting 250M Monthly Active Users,\" 2026-05. https://deadline.com/2026/05/netflix-expands-ad-tier-countries-monthly-active-users-1236901705/ — trade press. Accessed 2026-06-23."}, {"order": 15, "file": "15_Gap_International_Comparative_Modality.md", "title": "International and Historical Comparisons — Two Mirrors", "summary": "", "body": "# International and Historical Comparisons — Two Mirrors\n\n> **Bottom line.** The rest of these pages are U.S.-only and forward-looking, which leaves two of the sharpest claims untested against the obvious controls. This account supplies them. First, the international mirror: the U.S. \"regulatory gap by design\" is not a law of nature but a U.S.-specific anomaly. Most peer democracies — the UK, France, Germany, and others — **ban paid political advertising on broadcast television outright** and have for decades, substituting free allocated airtime; the U.S. is the outlier that lets money buy the screen. And the EU has now gone further than any of them, regulating the *targeting* directly: the **Transparency and Targeting of Political Advertising Regulation (TTPA, Regulation (EU) 2024/900)**, whose core provisions began applying **10 October 2025**, requires explicit separate consent for any data-driven political targeting and **bans the use of special-category data** (political opinions, ethnicity, religion, health) for it — the precise data fusion that powers U.S. voter-level CTV targeting. This is the empirical preview the U.S. evidence lacked. The result so far is not graceful compliance but **exit**: Google stopped serving EU political ads in 2024, and **Meta ended all political, electoral, and social-issue advertising across the EU on 6 October 2025**, each citing the TTPA's targeting restrictions by name. That tests the \"regulatory arbitrage is fragile\" claim against a real regime and returns a split verdict — the arbitrage is *legally* durable (it survives on First-Amendment grounds the EU does not share) but the *targeting model itself* proved brittle the moment a major jurisdiction priced it correctly. Second, the historical mirror: the claim that CTV's ramp \"mirrors\" earlier shifts is rarely set against a quantified broadcast→cable baseline. Measured, the analogy is weaker than it sounds. Cable took roughly **two decades** (mid-1990s to mid-2010s) to climb from a rounding error to about **14% of political ad spend**; CTV reached the same ~14% of *all* political spend, and ~45% of *digital*, in **a single decade** (2016–2024). CTV is migrating at roughly **twice the speed of cable**, into an electorate that linear TV can no longer fully reach. The ramp is fast, not normal.\n\n---\n\n## Why These Comparisons Matter\n\nThe U.S. story lives inside one country's assumptions: money buys television time freely, voter data is a commercial product, and the regulatory layer is a patchwork that streaming slips through. Two comparisons sharpen the picture, and each tests a load-bearing claim.\n\nThe earlier chapter on regulation argues that political CTV \"falls into a gap by design, not by oversight\" and that closing it is constitutionally treacherous in the U.S. But is the *gap itself* — the very idea that political ads can be bought, micro-targeted, and run with almost no transparency — a fixed feature of democracies, or a U.S. peculiarity? The chapter on the drivers lists \"regulatory arbitrage\" as a force and frames it as fragile. But fragile against *what*? Without a regime that actually restricts addressable political targeting, the fragility claim floats untested.\n\nBoth questions have the same answer: look outward. Most peer democracies settle the first — they ban the thing the U.S. permits. And as of October 2025 the EU is running a live experiment that settles the second: it has restricted political microtargeting directly, and we can now watch what happens. This is a comparative cut, on a non-Anglophone source base.\n\nThe second half of this account runs the smaller, domestic comparison: the broadcast→cable migration as a *quantified* baseline curve. The reader can then judge whether CTV's ramp is fast, normal, or slow — rather than taking \"mirrors earlier shifts\" on faith.\n\n---\n\n## Part I — The International Mirror\n\n### 1. The U.S. Is the Outlier: Most Peer Democracies Ban Paid Political TV Ads\n\n**In most established democracies it is illegal to buy a political advertisement on broadcast television.** That single fact reframes the entire corpus. The U.S. model — a campaign or PAC writes a check, and its message airs — is the exception, not the rule.\n\nThe bans are old and explicit:\n\n- **United Kingdom.** Paid political advertising on television and radio is prohibited under **Section 321(2) of the Communications Act 2003**, which bars advertising by bodies \"whose objects are wholly or mainly of a political nature\" and advertising \"directed towards a political end\" [1]. The prohibition has been in continuous force in some form since the dawn of commercial broadcasting in 1954. Parties instead receive free **party election broadcasts** allocated by the regulator.\n- **France.** Paid political advertising is prohibited on broadcasting under **Article 14 of the Law on Freedom of Communication** (Loi n° 86-1067) [2]. France additionally bans paid political advertising on *any* medium, including online, in the six months before an election under its electoral code.\n- **Germany.** Under the broadcasting treaty framework (historically Article 7(9) of the Rundfunkstaatsvertrag, now the Medienstaatsvertrag), **paid political advertising is prohibited in broadcasting** to prevent \"individual social groupings and forces from exerting a disproportionate influence on public opinion by purchasing advertising time.\" Qualifying parties instead receive **free allocated airtime** in the weeks before a Bundestag election [2], [3].\n- **Others.** The pattern extends across much of Europe — Ireland, Belgium, Denmark, Switzerland, and Norway have all historically banned or tightly restricted paid political broadcast advertising, the bans typically paired with free airtime for qualifying parties [2], [4].\n\nThe rationale inverts the American premise. A 2009 Council of Europe comparative survey and the underlying European jurisprudence frame the bans as protecting **equality of political opportunity** — stopping wealthy actors from converting money directly into broadcast dominance and \"ensuring a level playing field in elections\" [4], [5]. Where the U.S. First Amendment treats spending on political speech as speech to be protected, the European tradition treats *unequal* spending on broadcast political speech as a distortion to be prevented. The U.S. lowest-unit-charge rule is a faint price-control echo of a goal European systems pursue with an outright ban.\n\n> **So what.** The U.S. \"streaming loophole\" is a loophole *inside a regime that already permits far more than peer democracies do.* The U.S. argument is about whether streaming should inherit the thin transparency rules that broadcast carries. The European baseline is that political broadcast advertising should not be *bought at all*. The U.S. \"gap by design\" is not an oversight against a universal standard — it is one permissive country's internal inconsistency, sitting atop a global baseline that is dramatically more restrictive. The gap is real, but it is a gap in the world's most advertising-friendly major democracy.\n\nThe bans are not constitutionally frictionless even in Europe, which is exactly why they matter as a test. The **European Court of Human Rights (ECtHR)** has split on them. In **TV Vest AS v. Norway (2008)**, the Court found that applying a blanket paid-political-ad ban to a small pensioners' party — \"hardly mentioned\" in editorial coverage, for whom paid advertising was \"the only way\" to reach the public — **violated** Article 10 (freedom of expression), because the restriction was not proportionate [6]. But in **Animal Defenders International v. United Kingdom (2013)**, a bare **9–8 majority** held that the UK's broad statutory ban was **compatible** with Article 10, accepting that a general, predictable rule preventing wealthy groups from \"flooding the airwaves\" was within the UK's margin of appreciation [1]. The dissent accused the majority of \"double standards\" against TV Vest [1]. The lesson is precise: even where a democracy *wants* to restrict political advertising, the free-expression collision is real and universal — but it resolves *differently* depending on the constitutional tradition. Europe's tradition lets the ban stand; the U.S. tradition (per *McManus*) does not.\n\n### 2. The EU's TTPA: Regulating the Targeting, Not Just the Money\n\nThe broadcast bans are old news. The new development tests the U.S. argument directly: the EU has now regulated the *mechanism* at the heart of the addressability stack — data-driven targeting itself.\n\nThe **Regulation on the Transparency and Targeting of Political Advertising (TTPA)**, formally **Regulation (EU) 2024/900**, was adopted in March 2024, **entered into force on 9 April 2024**, and its **core provisions began applying on 10 October 2025**, with the technical pieces phasing in around it (an implementing act on ad labels in July 2025; the implementing act establishing the **European repository for online political advertisements** on 9 April 2026) [7], [8], [9]. It is the first comprehensive, EU-wide law to govern political advertising as a category across all media and all 27 member states.\n\nTwo pillars matter here.\n\n**Pillar one — transparency.** Every political ad must be **clearly labelled** as political, and must carry or link to a **transparency notice** stating who paid for it, how much was spent, the election or referendum it relates to, and — crucially — **whether targeting or ad-delivery techniques were used and on what basis** [7], [8]. Online political ads must be deposited in a public **European repository** [8], [9]. This is, in effect, a continent-wide version of the public political file that U.S. streaming entirely lacks — except it is mandatory, cross-platform, and reaches the internet, which the U.S. broadcast file never has.\n\n**Pillar two — the targeting restriction, which is the part with no U.S. analogue at all.** Under **Article 18** of the TTPA, targeting and ad-delivery techniques for online political advertising are permitted **only** when the personal data was **collected directly from the data subject** and the data subject gave **explicit and separate consent** for its use *specifically for political advertising* — and the regulation **prohibits the use of special categories of personal data** (under GDPR Article 9: data revealing racial or ethnic origin, political opinions, religious beliefs, health, or sexual orientation) for political targeting, and prohibits targeting data subjects known with reasonable certainty to be **under voting age** [7], [10], [11]. Penalties under **Article 25** can reach **6% of a provider's annual income or worldwide turnover**, with infringements of the targeting and transparency articles treated as \"particularly serious\" when they occur in the month before an election [11], [12].\n\nRead that against the addressability stack. The U.S. voter-level CTV stack works precisely by fusing a **voter file** — which is, definitionally, a database of *political* attributes (party registration, modeled partisanship, turnout score, issue stances on immigration or abortion) — with smart-TV viewing data, then matching it to households through clean rooms. **Every load-bearing input to that stack is a special category of personal data or its proxy.** Article 18 does not merely add friction to the U.S. model; it **prohibits the core data fusion the U.S. model is built on**, and it requires affirmative, separate, ad-specific consent that no U.S. voter-file enrichment process obtains. The TTPA is, in effect, a point-by-point legal negation of that addressability stack.\n\n> **So what.** This is the missing control. Doc 06 could only describe the U.S. gap; it had no jurisdiction in which the gap was closed to compare against. The TTPA is that jurisdiction. As of October 2025 there is now a major democratic bloc where voter-level political microtargeting of the U.S. kind is, on paper, illegal.\n\n### 3. The Empirical Preview: Restricting the Targeting Produced Exit, Not Compliance\n\nThe most valuable comparative payload is not the text of the TTPA but what *happened* when it took effect — the real-world preview the U.S.-only evidence could never supply.\n\nThe platforms that carry political money did **not build compliant targeted-political-ad products. They stopped selling political ads in the EU altogether.**\n\n- **Google** announced in **late 2024** that it would **stop serving political advertising in the EU** ahead of the TTPA, citing the regulation's broad scope, operational burden, and \"significant new operational challenges and legal uncertainties\" [13], [14].\n- **Meta** announced in **July 2025** that it would **end all political, electoral, and social-issue advertising across its platforms in the EU**, effective **6 October 2025** — days before the TTPA's application date [14], [15], [16]. In its own statement, Meta said the regulation \"introduces significant operational challenges and legal uncertainties,\" that it \"places extensive restrictions on ad targeting and delivery which would restrict how political and social issue advertisers can reach their audiences,\" and that it faced a choice between offering \"an advertising product which doesn't work for advertisers or users\" or ceasing political ads entirely — and chose the latter, noting it was \"not the only company\" to do so [15]. These are Meta's and Google's own characterizations of their reasoning — evidence of what each company said and did, not independent proof the law was the sole cause.\n\nWhat does this preview tell the forward-looking claims?\n\n**It corroborates the targeting mechanism but inverts its framing.** The drivers are usually read as targeting capability being a powerful force and regulatory arbitrage being fragile. The EU case shows the *targeting model itself* is fragile to a degree few anticipated. When a major jurisdiction made non-consensual, special-category-based political targeting illegal, the platforms did not adapt the targeting — they **withdrew the entire product line**, because a political-ad business stripped of microtargeting and loaded with 6%-of-turnover liability was, in their stated judgment, not worth running. The addressability stack, in other words, is not just a capability. For the platforms it is *the* value proposition, and without it the political-ad business is marginal enough to abandon. That is a strong, if indirect, datapoint about how much of CTV's political value is targeting versus reach — a question the effectiveness evidence leaves contested.\n\n**It complicates the \"incrementality\" story around effectiveness.** If voter-level targeting were a modest add-on to a fundamentally reach-driven medium, platforms could have dropped to contextual/geographic targeting and kept the business. They didn't. Their revealed preference is that political advertising without addressable targeting is not a business they want — which is itself evidence (revealed, not stated) that the targeting is doing real commercial work, whatever the academic small-effects literature says about *persuasion*.\n\n**But it does not vindicate \"arbitrage is fragile\" in the U.S. context.** Here the comparison cuts the other way and tightens the regulatory thesis. The arbitrage collapsed in the EU because the EU *legislated* it shut — and the EU could do so because its constitutional tradition (Section 1) permits restricting political advertising in the name of electoral equality. The U.S. cannot follow that path: *Washington Post v. McManus* already struck down a far milder transparency mandate on First-Amendment grounds, and the *McManus* court's \"spectrum scarcity doesn't apply to the internet\" reasoning forecloses the European move entirely. So the EU experiment shows the arbitrage is **fragile to legislation but durable against the U.S. Constitution.** The thing that closed the gap abroad is the thing the U.S. cannot do at home.\n\n> ⚠️ **Where this gets contested.** Two readings of the platform exits compete, and both deserve holding. *Reading A (regulator's success):* the TTPA worked exactly as intended — it made surveillance-based political targeting uneconomic, and platforms responded by ceasing it, removing a manipulation vector before the 2026 European elections. *Reading B (chilling-effect failure):* civil-society groups warn the regulation's breadth swept in NGOs, issue campaigns, and grassroots speech, and that platform exit *reduces* the reach of legitimate political and civic communication while doing nothing about organic disinformation — a blunt instrument that silenced compliant speakers and missed the bad actors [13], [16]. Both are partly true. What is **not** contested, and is the load-bearing fact here, is the revealed-preference result: **faced with a ban on addressable political targeting, the platforms abandoned political advertising rather than de-target it.** That is the empirical preview the U.S. evidence lacked.\n\n### 4. The Disclosure Layer: Even the Anglo Peers Out-Regulate the U.S. Online\n\nSet the EU aside, and the U.S.'s nearest cousins — the other large common-law democracies — have already built the online political-ad transparency the U.S. lacks at the federal level (the Honest Ads Act remains unenacted).\n\n- **Canada** amended the Canada Elections Act via **Bill C-76 (2018)** to require **online platforms** that publish regulated partisan or election advertising to maintain a **public registry** of every such ad — a copy of the ad plus the authorizing party — retained for the platform's purposes and inspectable, with fines up to **CA$50,000** for intentional non-compliance [17]. Canada also bans foreign election advertising and imposes a polling-day advertising blackout.\n- **The United Kingdom**, beyond its broadcast ban, introduced under the **Elections Act 2022** a **digital imprint regime** (in force 1 November 2023) requiring paid online political material to carry an \"imprint\" naming the promoter — described by the Electoral Commission as \"one of the most comprehensive digital imprint regimes\" in operation [18].\n\nNeither Canada's registry nor the UK's imprint regime is as far-reaching as the EU's repository-plus-targeting-ban. But both already do the **minimum** thing — a public record of who bought a political ad online — that the U.S. *cannot* require of streaming platforms after *McManus*. The U.S. is not merely behind the EU's frontier; it is behind its closest Anglophone, common-law peers on the most basic transparency function.\n\n---\n\n## Part II — The Historical Mirror: Was the Cable Migration Really a Precedent?\n\nThe opening account of the migration makes a comparative claim it never quantifies: that CTV's shift \"mirrors\" the earlier broadcast-to-cable migration, that the history \"rhymes.\" The instinct is reasonable — both are cases of audience fragmentation pulling political dollars toward a more targetable, lower-reach medium. But \"mirrors\" carries a lot of unexamined weight. Run the numbers and the mirror distorts: **cable's climb was real but slow, and CTV is moving at roughly twice the pace.**\n\n### 5. The Cable Baseline, Quantified\n\nCable existed as an advertising medium from the 1980s, but as a *political* one it stayed marginal for a long time. Borrell Associates' share-of-spend series across presidential cycles tells the story:\n\n| Cycle | Broadcast TV share | Cable TV share | Note |\n| --- | --- | --- | --- |\n| **2012** | **57.9%** | **9.5%** | Cable still under 10% of political spend; broadcast nearly 60% [19] |\n| **2016** | **44.7%** | **13.8%** | Broadcast falls ~13 pts in one cycle; cable rises to ~14% [19] |\n\n*Exhibit: Borrell Associates' share-of-political-spend figures. Cable took roughly two decades from its 1980s arrival to reach ~14% of political ad spend by 2016. Broadcast's decline from 57.9% to 44.7% in a single cycle marks the inflection — but note that cable rose only ~4 points in that window; the rest of broadcast's lost share went to **digital**, the leading edge of which would become CTV. Source: Borrell Associates, a specialist tracker; share denominators vary slightly across reports.*\n\nThe cross-check from independent measurement is consistent. Borrell's local-TV revenue data show political advertising rising from **9% of local-station ad revenue in 2008 to 17% in 2012** — evidence that broadcast was, if anything, *gaining* political dependence at exactly the moment digital began its climb [21].\n\nThe shape of the cable curve: from a near-zero base in the 1980s–early 1990s, cable reached roughly **10% of political spend by 2012 and ~14% by 2016** — a climb of about **two decades** to mid-teens share. Cable never became dominant in political advertising; it plateaued in the teens while broadcast remained the largest single medium and *digital* became the real disruptor.\n\n### 6. CTV vs. Cable: Twice the Speed, and a Different Kind of Shift\n\nNow lay the CTV curve against the cable baseline.\n\nCTV was **effectively absent** as a political line item in 2016 (~1% at the platform level), appeared as a discrete fast-growing item in 2018, scaled in 2020, **quintupled by 2022**, and reached roughly **$1.5–1.56 billion — about 45% of digital political spend and ~13–14% of all political ad spend — in 2024** [AdImpact 2024].\n\nPut the two migrations side by side on the same yardstick — *years to reach ~14% of political ad spend*:\n\n- **Cable:** roughly **two decades** (mid-1990s base → ~14% by 2016).\n- **CTV:** roughly **one decade** (~1% in 2016 → ~14% of all political spend in 2024; ~45% of digital).\n\n**CTV reached cable's mid-teens share in about half the time.** And it did so while still climbing steeply, where cable had plateaued. The ramp is **fast, not normal** — the historical analogy actually *understates* how unusual the CTV migration is.\n\nThree differences make the mirror imperfect in ways that matter for the forecast:\n\n1. **The audience floor moved.** Cable fragmented the audience but linear TV (broadcast + cable) still reached nearly everyone through the 2010s. CTV's rise is powered by something cable's was not: a **structural exodus** from linear entirely. By Nielsen's May-2025 milestone, streaming reached 44.8% of TV usage, eclipsing broadcast (20.1%) plus cable (24.1%) combined — with a pure-streamer cohort around 30% of households that linear cannot reach *at any price*. Cable migration was campaigns chasing a fragmenting-but-present audience; CTV migration is campaigns chasing an audience that is **leaving the reachable-by-linear universe altogether**. That is a stronger, more durable driver than cable ever had.\n2. **The regulatory inheritance flipped.** Cable carried *some* of broadcast's political rules — sponsor identification and a measure of political-file obligation extended to cable systems. CTV carries **none** of them. So the cable migration moved dollars into a *partially* regulated medium; the CTV migration moves them into an *unregulated* one. The historical analogy breaks at exactly the most important seam.\n3. **The unit of sale changed.** Cable was still largely bought against geography (networks, systems, DMAs). CTV is bought against **households and modeled voters**. Cable was a fragmentation of the *same* buying logic; CTV is a different logic. The mirror reflects a faster version of the old shift overlaid on a genuinely new one.\n\n> **So what.** The \"mirrors earlier shifts\" claim is half right and quantitatively misleading. The *direction* rhymes — fragmentation pulls money toward targetable, lower-reach media. But the *speed* (≈2×), the *audience driver* (exodus vs. fragmentation), the *regulatory inheritance* (zero vs. partial), and the *unit of sale* (voter vs. geography) all differ. Anyone who treats cable as the base rate for CTV's ceiling will likely **underestimate** CTV: cable plateaued in the teens because linear stayed reachable; CTV has no such ceiling because linear is emptying out. The historical mirror, properly measured, is an argument that CTV's ramp is *not* near its plateau.\n\n---\n\n## Synthesis: What the Two Mirrors Do to the Argument\n\nHeld up to both mirrors, the argument comes back with three corrections and one confirmation.\n\n1. **The U.S. gap is an anomaly, not a default (corrects the framing of the regulatory case).** Peer democracies ban paid political broadcast advertising outright; the U.S. permits it and merely debates streaming's share of thin transparency rules. The \"regulatory gap by design\" is real, but it is a gap inside the world's most permissive major-democracy regime — not a universal condition.\n\n2. **The arbitrage is fragile to law but durable against the U.S. Constitution (sharpens the account of the drivers).** The EU closed the addressability gap by statute, and the platforms responded by *exiting* political advertising rather than de-targeting it — a powerful preview of what restriction does. But the EU could legislate this because its tradition permits restricting political advertising for electoral equality; the U.S. cannot, because *McManus* and the First Amendment foreclose it. So \"regulatory arbitrage is fragile\" is true in Brussels and false in Washington, for the same underlying reason the regulatory chapter already identified.\n\n3. **Restricting targeting reveals how much of CTV's value is targeting (informs the effectiveness question).** The platforms' revealed preference — abandon the product rather than run it untargeted — is indirect but real evidence that addressable targeting, not reach, is the political-ad business's core value. That cuts against the most deflationary readings of the small-effects literature.\n\n4. **CTV's ramp is genuinely fast (confirms and strengthens the opening instinct while correcting its analogy).** Measured against the cable baseline, CTV is migrating at roughly twice the speed, into an emptying linear universe, carrying none of broadcast's rules. The mirror the opening reached for actually argues the migration is *less* like a normal precedent and *more* like an acceleration with no obvious ceiling.\n\nThe argument's spine survives the comparison intact — and in two places (the speed of the ramp, the value of targeting) the international and historical mirrors make its claims *stronger* than the U.S.-only evidence could.\n\n---\n\n## Open Questions\n\n1. **Does the EU platform exit hold, or do compliant targeted-political-ad products emerge?** Google and Meta withdrew rather than comply by October 2025. Whether a smaller player, a public-service workaround, or a later compliant product fills the gap — or whether EU political advertising simply contracts to contextual/untargeted formats and offline — is the single most important thing to watch through the **2026 European-cycle elections**. It is the live test of whether targeting restriction kills the business or merely reshapes it.\n2. **Will the TTPA's European repository (live 9 April 2026) actually produce usable transparency?** A mandatory cross-platform repository is the artifact U.S. reformers want and cannot get. Whether it works in practice — completeness, accessibility, researcher access — is the empirical case study for whether the Honest Ads Act model is worth fighting for.\n3. **Does any U.S. state attempt a TTPA-style *targeting* restriction (not just disclosure), and does it survive *McManus*?** Disclosure mandates are constitutionally fraught; a targeting *ban* on special-category political data would be far more aggressive. Would such a law be framed as data-privacy (more defensible) rather than speech regulation (less)? The voter-data carve-out is the relevant battleground.\n4. **What is the right base rate for CTV's ceiling?** Cable plateaued in the teens; this account argues CTV will not, because linear is emptying. But the counter-case — that CTV too will plateau as the streaming audience saturates and measurement frictions persist — deserves a quantitative treatment, taken up in the outlook.\n5. **Did the broadcast→cable migration have its own \"addressability\" moment, or was it purely a reach-fragmentation story?** Local cable insertion offered some geographic granularity broadcast lacked. A finer-grained history of whether campaigns valued cable for *targeting* or merely for *cheap incremental reach* would sharpen the analogy to CTV's targeting-driven rise.\n6. **How do non-Anglophone, non-EU democracies (Japan, India, Brazil) regulate addressable political advertising?** The comparative base here is EU- and Anglo-heavy. A genuinely global cut might find regimes closer to or further from the U.S. model than the European baseline suggests.\n\n## Sources\n\n1. *Animal Defenders International v. United Kingdom*, App. no. 48876/08, European Court of Human Rights (Grand Chamber, 22 April 2013), upholding the ban on paid political broadcast advertising under **Communications Act 2003, s. 321(2)** as compatible with ECHR Article 10 by a 9–8 majority. Via Global Freedom of Expression (Columbia), https://globalfreedomofexpression.columbia.edu/cases/animal-defenders-v-united-kingdom/; Wikipedia summary (read for navigation to the primary judgment), https://en.wikipedia.org/wiki/Animal_Defenders_International_v_United_Kingdom; Human Rights Law Centre case summary, https://www.hrlc.org.au/case-summaries/ban-on-paid-political-advertising-not-a-violation-of-the-right-to-freedom-of-expression/. Accessed 2026-06-23. **(Tier 1 court opinion + Tier 5 scholarly summaries; the UK ban and the ECtHR's acceptance of it.)**\n2. Comparative survey of European paid-political-broadcast-advertising bans (UK Communications Act 2003 s.321; France, Loi sur la liberté de communication art. 14; Germany, broadcasting treaty prohibition + free allocated airtime), as synthesized in Dobber, Ó Fathaigh & Zuiderveen Borgesius (source 5) and the deutschland.de explainer \"Elections in Germany: political advertising on TV and radio,\" https://www.deutschland.de/en/topic/politics/elections-in-germany-political-advertising. Accessed 2026-06-23. **(Tier 2/5 — comparative scholarship + official explainer on the national bans and the free-airtime alternative.)**\n3. deutschland.de (official Germany portal), \"Elections in Germany: political advertising on TV and radio,\" on the prohibition of paid broadcast political advertising and the four-week free-airtime allocation, https://www.deutschland.de/en/topic/politics/elections-in-germany-political-advertising. Accessed 2026-06-23. **(Tier 5 — official explainer; the German ban + free airtime.)**\n4. Council of Europe / comparative political-finance literature on broadcast-advertising bans and the \"level playing field\" rationale; International IDEA Political Finance Database (180 countries/regions), https://www.idea.int/data-tools/data/political-finance-database, which tracks bans on political advertising in broadcast media and spending limits on media advertisements. Accessed 2026-06-23. **(Tier 2/5 — comparative political-finance reference establishing that \"a significant number of countries\" ban paid political broadcast advertising; the U.S. permissiveness as outlier.)**\n5. Dobber, Tom; Ó Fathaigh, Ronan; Zuiderveen Borgesius, Frederik J., \"The regulation of online political micro-targeting in Europe,\" *Internet Policy Review*, 8(4), 2019, https://policyreview.info/articles/analysis/regulation-online-political-micro-targeting-europe. Accessed 2026-06-23. **(Tier 2 — peer-reviewed scholarship; the GDPR consent/special-category framework, the US-as-origin-of-microtargeting comparison, the TV Vest v. Norway and Article 10 analysis, and the conclusion that lawmakers \"could probably ban online political micro-targeting … leading up to elections.\")**\n6. *TV Vest AS & Rogaland Pensjonistparti v. Norway*, App. no. 21132/05, ECtHR (11 December 2008), finding a *violation* of Article 10 where a blanket paid-political-ad ban was applied disproportionately to a small party. Via Human Rights Law Centre, https://www.hrlc.org.au/case-summaries/tv-vest-as-rogaland-pensjonisparti-v-norway-2008-echr-2113205-11-december-2008/; analyzed in source 5. Accessed 2026-06-23. **(Tier 1 court opinion + Tier 5 summary; the proportionality limit on broadcast-ad bans — the counterweight to Animal Defenders.)**\n7. Regulation (EU) 2024/900 of the European Parliament and of the Council on the transparency and targeting of political advertising (TTPA), EUR-Lex, https://eur-lex.europa.eu/eli/reg/2024/900/oj/eng and summary at https://eur-lex.europa.eu/EN/legal-content/summary/transparency-and-targeting-of-political-advertising.html. Accessed 2026-06-23. **(Tier 1 — the primary legislative text and official EUR-Lex summary: targeting permitted only with explicit separate consent and data collected from the data subject; special-category data and minors' data prohibited; transparency-notice/labelling requirements; third-country sponsor restriction in the 3 months before an election; recitals 19, 77, 82.)**\n8. European Commission, \"Transparency and targeting of political advertising\" official policy page, https://commission.europa.eu/strategy-and-policy/policies/justice-and-fundamental-rights/democracy-eu-citizenship-anti-corruption/democracy-and-electoral-rights/transparency-and-targeting-political-advertising_en. Accessed 2026-06-23. **(Tier 1 — Commission's official statement: full application 10 October 2025; implementing act on labels 9 July 2025; repository implementing act 9 April 2026; the public European repository for online political ads.)**\n9. EUR-Lex / Commission implementing-act timeline for the TTPA (labels July 2025; European repository for online political advertisements, 9 April 2026), per sources 7 and 8 and Bird & Bird (source 10). Accessed 2026-06-23. **(Tier 1/5 — the staged implementation calendar.)**\n10. Bird & Bird, \"The EU Political Advertising Regulation: What You Need to Know\" (2025), https://www.twobirds.com/en/insights/2025/the-eu-political-advertising-regulation-what-you-need-to-know. Accessed 2026-06-23. **(Tier 5 — specialist legal analysis: targeting restrictions, the up-to-6%-of-turnover penalty, the covered parties (sponsors/providers/publishers), the application date.)**\n11. Freshfields, \"The EU's Transparency and Targeting of Political Advertising Regulation: Guidance to Support the Technical Implementation\" (2025), https://www.freshfields.com/en/our-thinking/blogs/technology-quotient/the-eus-transparency-and-targeting-of-political-advertising-regulation-guidance-102kxzc. Accessed 2026-06-23. **(Tier 5 — legal analysis confirming the explicit-consent-only targeting rule, the special-category-data and under-voting-age prohibitions, and penalties \"up to 6% of annual turnover.\")**\n12. adfairly.eu, \"EU Regulation 2024/900 (TTPA) – Facts,\" summarizing Article 25 penalties (effective, proportionate, dissuasive fines up to 6% of revenue/global annual turnover; particularly-serious infringements of Articles 5, 7, 11, 12, 13, 15, 16, 18 in the month before an election), https://adfairly.eu/en/facts/ttpa. Accessed 2026-06-23. **(Tier 5 — compliance summary corroborating the Article 25 penalty structure and the \"particularly serious\" article list; cited alongside the Tier 1 text in source 7.)**\n13. Simon, Eva, \"Why we should worry about Google's stopping serving political advertising in EU,\" *EUobserver*, 25 November 2024, on Google's exit from the EU political-ad market ahead of the TTPA and the civil-society chilling-effect concern. Accessed 2026-06-23. **(Tier 5 — analytical/advocacy reporting on Google's 2024 exit and the NGO/grassroots burden critique; note civil-liberties lean.)**\n14. CADE (Civil Society Alliances for Digital Empowerment), \"Meta to suspend political and social issue ads in EU ahead of new transparency rules\" (2025), https://cadeproject.org/updates/meta-to-suspend-political-and-social-issue-ads-in-eu-ahead-of-new-transparency-rules/; Al Jazeera, \"Meta to suspend political advertising in the EU as transparency law looms,\" 25 July 2025, https://www.aljazeera.com/economy/2025/7/25/meta-to-suspend-political-advertising-in-the-eu-as-transparency-law-looms; Reuters, \"Meta to halt political advertising in EU in October, blames EU rules,\" 25 July 2025 (via China Daily reprint, https://www.chinadailyasia.com/hk/article/616733). Accessed 2026-06-23. **(Tier 3/4/5 — wire and major-outlet reporting that both Meta (Oct 2025) and Google (2024) ceased EU political advertising in response to the TTPA.)**\n15. Meta, \"Ending Political, Electoral and Social Issue Advertising in the EU in Response to Incoming European Regulation,\" about.fb.com, July 2025, https://about.fb.com/news/2025/07/ending-political-electoral-and-social-issue-advertising-in-the-eu/. Accessed 2026-06-23. **(Tier 1 — Meta's own statement, captured as the company's characterization, not independent fact: effective 6 October 2025; \"extensive restrictions on ad targeting and delivery\"; \"significant operational challenges and legal uncertainties\"; the choice between a non-working product and exit; \"not the only company.\")**\n16. FEDMA (Federation of European Data and Marketing), \"Meta's Political Ads Ban: Lessons for Democracy, Marketers, and Regulators,\" 2 October 2025, https://www.fedma.org/2025/10/02/metas-political-ads-ban-lessons-for-democracy-marketers-and-regulators/. Accessed 2026-06-23. **(Tier 5 — industry analysis of the exit's consequences; the \"Reading B\" chilling-effect/blunt-instrument critique.)**\n17. Elections Canada, \"Registry Requirements for Political Ads on Online Platforms,\" https://www.elections.ca/content.aspx?section=pol&dir=regifaq&document=index&lang=e, and IAB Canada, \"Political Ads – Bill C-76 and How Online Advertising is Impacted,\" https://iabcanada.com/political-ads-bill-c-76-and-how-online-advertising-is-impacted/; McCarthy Tétrault, \"What you need to know before selling political advertising on your online platform,\" https://www.mccarthy.ca/en/insights/publications/what-you-need-know-selling-political-advertising-your-online-platform. Accessed 2026-06-23. **(Tier 1 official + Tier 5 legal analysis; Canada's C-76 online-platform political-ad registry, 5-year retention, CA$50,000 fines.)**\n18. UK Electoral Commission, \"Statutory guidance on digital imprints,\" https://www.electoralcommission.org.uk/full-guidance/statutory-guidance-digital-imprints, and GOV.UK, \"Digital imprints: draft statutory guidance,\" https://www.gov.uk/government/publications/digital-imprints-draft-statutory-guidance; House of Commons Library, \"Imprints on election and campaign material,\" https://commonslibrary.parliament.uk/research-briefings/sn02174/. Accessed 2026-06-23. **(Tier 1 official guidance + Tier 2 parliamentary briefing; the Elections Act 2022 digital-imprint regime, in force 1 November 2023.)**\n19. Borrell Associates political-ad share-of-spend figures across cycles, as reported in MarketingCharts, \"Political Advertising in 2016 Showed Sizable Channel Shifts,\" https://www.marketingcharts.com/industries/government-and-politics-73480 (broadcast TV 57.9% (2012) → 44.7% (2016); cable TV 9.5% (2012) → 13.8% (2016); 2016 dollar breakdown: $4.4B broadcast, $1.35B cable, $1.4B digital). Accessed 2026-06-23. **(Tier 5 — specialist tracker (Borrell) via trade reporting; the quantified broadcast→cable baseline. Share denominators vary slightly across Borrell reports; direction and rough magnitude robust.)**\n20. Variety, \"TV biz savors windfall from political ads,\" 2012, https://variety.com/2012/tv/news/tv-biz-savors-windfall-from-political-ads-1118061517/. Accessed 2026-06-23. **(Tier 5 — trade reporting.)** *Note: an earlier draft cited this source for a \"~$1.1B broadcast vs. ~$200M local cable\" 2012-presidential split attributed to Kantar/CMAG; on re-check the article does not contain that figure (it reports ~$1.65B/~$3B total local TV, not a presidential broadcast-vs-cable split), so the figure was removed from the body as uncorroborated.*\n21. Borrell Associates local-TV political-revenue data via Benton Institute / Pew, \"Despite Some Warning Signs, Local TV Stations Are Hot Commodities,\" Pew Research Center, 5 August 2013, https://www.pewresearch.org/journalism/2013/08/05/despite-some-warning-signs-local-tv-stations-are-hot-commodities/ (political = 17% of local-station ad revenue in 2012, up from 9% in 2008). Accessed 2026-06-23. **(Tier 4/5 — Pew reporting on Borrell data; broadcast's rising political-revenue dependence even as digital began its climb.)**"}, {"order": 16, "file": "Future_Trajectory.md", "title": "U.S. Political CTV Advertising: Future Trajectory", "summary": "", "body": "# U.S. Political CTV Advertising: Future Trajectory\n\n## Bottom Line\n\nThe argument here is no longer about direction — political CTV dollars keep rising through the 2028 cycle and the federal streaming-disclosure gap stays open — the argument is about the *slope* of CTV's **share** of total political spend. The single most likely outcome is **On-Curve Continuation (34–44%)**: CTV climbs the flattening shoulder of its S-curve, share rising off 2024's ~21% (AdImpact broad) into the mid-to-high-20s% by 2028, a decelerating climb rather than a repeat of the 2020→2024 ~5x surge. That modal case is not a majority, because the roughly 60% \"growth-continues\" mass splits with its mirror image, **Constrained Plateau (18–26%)**: dollars still grow on the two-year cycle clock, but CTV's *share* stalls in the low-to-mid 20s% as the four premium refusers hold and the effectiveness debate keeps the waiting-for-proof dollar on linear. Three drivers dominate — a one-way cord-cutting ratchet (streaming has already passed broadcast+cable), a low federal-close base rate that keeps the regulatory gap open, and the inventory-concentration / effectiveness counter-forces that decide whether share climbs or stalls. The upside, **Inventory Unlock / Re-Acceleration (13–19%)**, requires a continuity-breaking event — most plausibly Netflix or another premium holdout opening to political ads — to push share into the low-30s%. The two tails are a **Regulatory / Platform Break (13–19%)**, where the Washington-v-Meta disclosure template, the December-2025 AI-preemption executive order, or a Fox–Roku close bends the trajectory, and an **Effectiveness / Credibility Deflation (7–12%)**, where a CTV-specific incrementality null finally re-prices the channel. No liquid market trades the CTV-share question, so these bands are derived from base rates, not read off a price.\n\n## Method\n\nThis forecast is **not an average.** Each line of argument was mapped onto a single MECE (mutually exclusive, collectively exhaustive) partition of outcomes and weighted by the grounding that survived cross-examination, with every disputed anchor checked against the underlying evidence. A broad outside-view cross-check put the \"growth continues\" mass at roughly 0.60, re-acceleration near 0.15, a regulatory break near 0.13, and effectiveness deflation near 0.11. The reasoning moved off those priors only where the evidence forced it.\n\nThree questions were decided on evidence. First, the strongest bear case — that the practitioner addressable ceiling acts as a *share* cap — does not hold. Broad geo/demo buying is precisely the share-*gaining* mechanism (operators \"fund CTV first instead of broadcast\" as a mass-reach tool), so the match-rate ceiling caps CPM and the persuasion premium, not share. What survives of the bear case — the additive-not-substitution dynamic plus a definition-sensitive baseline — keeps Constrained Plateau alive at 18–26%. Second, the low-30s% magnitude does not belong in the *modal* continuation case: it assumes the refusers hold while booking inventory that needs them open. That magnitude belongs in the Re-Acceleration scenario, where it is correctly conditioned on the ceiling lifting. Third, the regulatory floor sits above 5–10%. *Washington v. Meta* affirmed the $35.2M disclosure penalty (Washington Supreme Court, June 18 2026, 6-of-9), and the December 11 2025 AI-preemption executive order is a real, signed, two-sided variable — making the regulatory band fatter (13–19%), though capped below an EU-inflated read because *McManus* and the First Amendment foreclose the EU targeting-ban mechanism in the United States.\n\nThe base rates anchored on are the reference classes detailed below: the five-cycle CTV adoption ramp, federal disclosure-rulemaking latency, the state election-deepfake/AI-law diffusion, the broadcast-to-cable migration analog with its critical caveat, the EU TTPA natural experiment, the persuasion-evidence \"priced-and-ignored\" record, the four-refuser inventory concentration, the two-year cycle pulse, and the prediction-market decomposition. The horizon is fixed: **through the 2028 presidential cycle (early 2029)**, with a hard interim waypoint at the November 2026 midterm actuals. A prediction-market sweep ran on 2026-06-23 across **Polymarket, Kalshi, Metaculus, and Manifold**. The result, stated plainly: **no liquid market prices the exact CTV-share question.** Every contract found is *related* (it bounds the size of the political-ad pie) or *decomposed* (it prices an input such as chamber control), so CTV share is derived from base rates, not borrowed from a market price.\n\n**Where the analysis splits.** The surviving disagreement is not direction — dollars grow and the federal gap stays open under every reading — it is the **slope of CTV's share.** One reading sees a slow climb to the high-20s%; the mirror reading sees a share stall in the low-mid 20s% while dollars keep rising. Broad-buying settles the mechanism question (it gains share, so the addressable ceiling caps CPM, not share), but the additive-not-substitution dynamic plus the definition-sensitive baseline leave *both* readings live. Both are preserved here by **splitting** the ~60% growth mass into Continuation (34–44%) and Plateau (18–26%) rather than averaging them into a single false-precision number. A second seam runs through the regulatory tail: the December-2025 EO and the Fox–Roku deal can be read as fat, two-sided variance, or regulation can be read as a near-pure tailwind. The evidence favors the former, capped via *McManus*.\n\n## Scenarios\n\n\n\n<figure class=\"viz\"><div class=\"viz-title\">Forecast scenarios — through the 2028 cycle<\/div><svg viewBox=\"0 0 700 216\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"185.0\" y1=\"8\" x2=\"185.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"185.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">0%<\/text><line x1=\"307.8\" y1=\"8\" x2=\"307.8\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"307.8\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">25%<\/text><line x1=\"430.5\" y1=\"8\" x2=\"430.5\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"430.5\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">50%<\/text><line x1=\"553.2\" y1=\"8\" x2=\"553.2\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"553.2\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">75%<\/text><line x1=\"676.0\" y1=\"8\" x2=\"676.0\" y2=\"192\" class=\"ln-soft\" stroke-width=\"1\"/><text x=\"676.0\" y=\"208\" font-size=\"12\" class=\"t-muted\" text-anchor=\"middle\">100%<\/text><text x=\"175\" y=\"23\" font-size=\"13\" text-anchor=\"end\">On-Curve Continuation — CT…<\/text><line x1=\"185\" y1=\"18.0\" x2=\"676\" y2=\"18.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"351.9\" y=\"8\" width=\"49.1\" height=\"20\" rx=\"10\" class=\"f-t1 cv-grow-right\" style=\"--d:0.00s\" fill-opacity=\"0.85\"/><text x=\"409.0\" y=\"23\" font-size=\"12.5\" class=\"t-muted\">34–44%<\/text><text x=\"175\" y=\"59\" font-size=\"13\" text-anchor=\"end\">Constrained Plateau — poli…<\/text><line x1=\"185\" y1=\"54.0\" x2=\"676\" y2=\"54.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"273.4\" y=\"44\" width=\"39.3\" height=\"20\" rx=\"10\" class=\"f-t2 cv-grow-right\" style=\"--d:0.06s\" fill-opacity=\"0.85\"/><text x=\"320.7\" y=\"59\" font-size=\"12.5\" class=\"t-muted\">18–26%<\/text><text x=\"175\" y=\"95\" font-size=\"13\" text-anchor=\"end\">Inventory Unlock / Re-Acce…<\/text><line x1=\"185\" y1=\"90.0\" x2=\"676\" y2=\"90.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"248.8\" y=\"80\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t3 cv-grow-right\" style=\"--d:0.12s\" fill-opacity=\"0.85\"/><text x=\"286.3\" y=\"95\" font-size=\"12.5\" class=\"t-muted\">13–19%<\/text><text x=\"175\" y=\"131\" font-size=\"13\" text-anchor=\"end\">Regulatory / Platform Brea…<\/text><line x1=\"185\" y1=\"126.0\" x2=\"676\" y2=\"126.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"248.8\" y=\"116\" width=\"29.5\" height=\"20\" rx=\"10\" class=\"f-t4 cv-grow-right\" style=\"--d:0.18s\" fill-opacity=\"0.85\"/><text x=\"286.3\" y=\"131\" font-size=\"12.5\" class=\"t-muted\">13–19%<\/text><text x=\"175\" y=\"167\" font-size=\"13\" text-anchor=\"end\">Effectiveness / Credibilit…<\/text><line x1=\"185\" y1=\"162.0\" x2=\"676\" y2=\"162.0\" class=\"ln-soft\" stroke-width=\"1\"/><rect x=\"219.4\" y=\"152\" width=\"24.6\" height=\"20\" rx=\"10\" class=\"f-t5 cv-grow-right\" style=\"--d:0.24s\" fill-opacity=\"0.85\"/><text x=\"251.9\" y=\"167\" font-size=\"12.5\" class=\"t-muted\">7–12%<\/text><\/svg><figcaption> <span class=\"credit\">Source: Scenario probabilities through the 2028 presidential cycle.<\/span><\/figcaption><\/figure>\n\n\n\n### Scenario 1: On-Curve Continuation — CTV climbs the flattening shoulder of its S-curve; the federal streaming gap stays open\n\n**Probability: 34–44%.** This is the single most likely outcome, but it is modal-by-deliberation, not a clean majority.\n\n**Description.** CTV's share of total political spend rises off 2024's ~21% (AdImpact broad measure; ~12.6% on eMarketer's narrow slice-of-digital definition) into the mid-to-high-20s% by the 2028 cycle — a decelerating climb, not a repeat of the 2020→2024 ~5x surge, and not the low-30s% that an inventory unlock would require. The 2026 cycle lands near AdImpact's ~$2.5B projection — the only major medium projected to grow — and 2028 builds on a higher, trough-filled floor. CTV keeps eating linear *cable*, not broadcast, which stays sticky near ~$5.6B on the highest-turnout cohort. The federal gap stays open; the state AI-deepfake patchwork persists but is court-checked (Kohls / AB-2839 enjoined) and threatened from above by the December-2025 preemption EO. The four premium refusers hold, and the effectiveness debate stays unresolved-but-tolerated.\n\n**How this number was derived.** Modal, but not a clean majority. Two grounded base rates intersect: P(migration keeps relocating reach to CTV | streaming already crossed broadcast+cable, May-2025) ~0.90 AND P(federal gap stays open through early-2029 | FEC rule ~11 yrs, Honest Ads 0-for-4, FEC 3-3, split-Congress modal) ~0.82, conditioned on \"no shock AND no holdout reversal\" so the SLOPE is a slow climb: 0.90 × 0.82 × ~0.70 ~ 0.52 raw. Cut to 34–44% because the ~60% \"growth-continues\" mass (outside-view cross-check 0.60) is SPLIT with Constrained Plateau — the mechanism is settled (broad-buying gains share) but the additive-not-substitution outcome stays two-sided, so this scenario takes the \"share climbs slowly\" half. The low-30s% magnitude belongs to Re-Acceleration instead.\n\n**Drivers.** The dominant force is cord-cutting as a one-way ratchet (Driver 1): streaming has passed broadcast+cable, so reach relocates to CTV regardless of anyone's belief about targeting. The two-year cycle clock (Driver 8) adds a rising sawtooth, with off-year troughs filling so that 2028 builds on a higher floor than 2024. Regulatory arbitrage stays a tailwind (Driver 5) on the low federal-close base rate, while *McManus* forecloses the EU targeting-ban path. The decisive practitioner mechanism is that operators fund CTV first instead of broadcast, buying it broad *as a reach tool* — the share-gaining behavior. The counter-force that caps the ceiling in the high-20s% is broadcast stickiness on the highest-turnout cohort.\n\n**Conditions.** AdImpact's 2026 CTV actual lands within ~±25% of ~$2.5B with share above 2024; no federal statute reaches streaming and no FCC/FEC action reaches CTV; no premium SVOD holdout (Netflix / Amazon / Disney+ / Apple) opens to political ads; no credible independent CTV-specific incrementality study deflates the lift case; and streaming's share of total TV viewing holds or rises.\n\n**Signals to watch.** AdImpact's post-2026 final CTV actuals (early 2027) within ~±25% of the ~$2.5B projection *and* a measured share clearly above 2024; Nielsen *The Gauge* streaming-share prints holding above ~47–50% through 2027–2028; Honest Ads Act / successor status in the 119th Congress (no floor vote = this case hardens); off-year (2025/2027) CTV-political base continuing to fill the trough; and no premium-SVOD political-policy reversal ahead of the 2028 upfronts.\n\n**Time horizon.** Through the 2028 presidential cycle (early 2029), with an interim waypoint at the November-2026 midterm actuals.\n\n### Scenario 2: Constrained Plateau — political dollars keep rising but CTV's SHARE stalls in the low-to-mid 20s%\n\n**Probability: 18–26%.** This is the surviving core of the bear case, re-weighted after cross-examination defeated its headline.\n\n**Description.** CTV dollars still grow — the cycle clock and audience migration guarantee a 2028 pulse on a higher floor — but *share* stalls in the low-to-mid 20s% rather than climbing toward broadcast's. The binding constraints: the four premium refusers (Netflix / Amazon / Disney+ / Apple) hold, so demand piles into the fixed accepter set (Hulu / Roku / YouTube / FAST), CPMs spike September–November, and buyers substitute toward open-exchange / FAST inventory or hold budget on broadcast for the high-turnout cohort. The effectiveness debate stays adverse enough to keep the waiting-for-proof dollar on linear. This is Continuation's mirror — the same dominant drivers, with the counter-forces binding harder: a *share* stall layered on still-rising dollars, never a dollar stall.\n\n**How this number was derived.** The surviving core of the bear case, re-weighted after cross-examination DEFEATED its headline. The original 35-45% (revised 30-38%) stacked the cable-plateau prior (~0.5) AND the addressable ceiling as a SHARE cap — but broad-buying is the share-GAINING mechanism, and the cable analog actually UNDERSTATES CTV's ceiling and leaves the plateau an OPEN question, so the share-cap reading loses most of its weight. What SURVIVES: the definition-sensitive baseline plus the additive-not-substitution dynamic mean share CAN stall in the low-mid 20s while dollars rise on the cycle clock — a real, distinct outcome. P(dollars grow)~0.90 x P(share STALLS | growth)~0.24 (cut from 0.38 for the defeated mechanism, held above zero by the additive pie + premium-refuser CPM ceiling) ~ 0.22 -> 18-26%.\n\n**Drivers.** Inventory concentration (Driver 6): the premium refusers cap reachable premium inventory below viewing share, and surge-window CPM spikes drive substitution. Effectiveness skepticism (Driver 4): the Kalla-Broockman ~zero result plus ~64% measurability keeps the waiting-for-proof dollar on linear. The additive-not-substitution dynamic means CTV gains share only off broadcast's slow erosion, which can be slow enough to read as a stall. The broadcast floor sits *up* near ~$5.6B, durable on the highest-turnout cohort. And the match-rate ceiling (50–70% clean file) caps the addressable premium / CPM — not the reach share.\n\n**Conditions.** Premium SVOD refusers hold political bans through 2028 (no inventory relief); no vendor-favorable effectiveness reversal, so the academic ~zero consensus stands; broadcast dollar share stays sticky near ~48–50%; and surge-window CPM spikes drive substitution toward FAST / open exchange rather than net-new CTV budget.\n\n**Signals to watch.** A 2026 CTV actual flat-to-below ~$2.5B with measured share near 20–24% rather than climbing; continued premium-refuser bans through 2027 with no Netflix / Amazon reversal; heavy late-cycle CPM spikes on accepting inventory and budget held on broadcast in battlegrounds; practitioners continuing to describe CTV as a \"mass reach tool,\" addressable on a minority of impressions; and the broadcast actual holding near ~$5.6B rather than sliding.\n\n**Time horizon.** Through the 2028 presidential cycle (early 2029); visible at November-2026 actuals if the share stalls.\n\n### Scenario 3: Inventory Unlock / Re-Acceleration — a continuity-breaking unlock pushes CTV share materially higher (low-30s%)\n\n**Probability: 13–19%.** This is the upside that the outside-view deceleration assumption misses, because a structural lid lifts.\n\n**Description.** CTV's share jumps past the flattening-shoulder expectation into the low-30s% of total political spend by 2028 because a ceiling constraint breaks the right way. The likeliest unlock: a premium holdout — Netflix is the most plausible — opens to political ads, floods high-CPM inventory, relieves the September–November scarcity spike, and pulls presidential dollars onto streaming. Failing that, a 2026 actual prints well above projection, or AI-driven creative abundance makes high-frequency CTV buys cheap enough to shift budgets faster than the base case assumes. This is the cleanest single discontinuity in CTV's favor.\n\n**How this number was derived.** Decomposition, absorbing the high-end magnitude that does not belong in the modal case. P(>=1 ceiling-lifting unlock by 2028): (a) a premium refuser opens EARLY enough ~0.30 over ~2.5 yrs (Netflix the live case, ~13M ad-tier subs + AAPC/buyer lobbying, no reversal as of June-2026) x P(materially accelerates | opens) ~0.50 (a late opening barely registers and partly re-routes existing dollars) ~ 0.15; (b) 2026 actual >25% above projection ~0.15; (c) AI-creative cost collapse net-shifts budget ~0.10-0.15. A correlation point (holdout-open and AI-cost-collapse share the ad-tier profit motive) lifts P(>=1) modestly; netted ~0.16 -> 13-19%. This is where the low-30s% correctly lives — conditioned on the ceiling lifting, not bundled into a modal case that assumes refusers hold.\n\n**Drivers.** Driver 6 inverted: a premium-refuser policy reversal relieves scarcity *and* adds reach. Driver 1 migration is still running, so the opened premium inventory meets reach that has already relocated. Driver 7, AI creative, turns net-positive: cheaper, higher-variant creative favoring high-frequency CTV buys — correlated with the same monetization motive that would drive a holdout to open. And the signal-loss prong of Driver 3 — mobile-ID degradation — pushes first-party voter-file activation onto CTV.\n\n**Conditions.** A premium SVOD holdout publicly reverses its ban early enough to matter for 2028; OR the 2026 CTV actual prints materially (>25%) above the ~$2.5B projection; OR there is demonstrable budget reallocation toward CTV from an AI-creative cost collapse with disclosure friction low.\n\n**Signals to watch.** Netflix / Amazon / Disney+ political-ad policy statements around the 2027–2028 upfronts; a 2028 streaming reservation exceeding Harris's 2024 >$200M digital tranche; surge-window CPMs *falling* (new inventory) rather than spiking (unrelieved scarcity); AI-creative adoption metrics and whether disclosure friction stays low; and the Fox–Roku close (1H-2027 guidance) reshaping the political inventory / identity layer.\n\n**Time horizon.** Through 2028; a platform reversal could surface through 2027, with the spend impact concentrated in the November-2028 cycle.\n\n### Scenario 4: Regulatory / Platform Break — a regulatory, judicial, or structural shock bends the trajectory (incl. structural wildcard)\n\n**Probability: 13–19%.** The arbitrage tailwind partly flips to a headwind, or a structural event reprices the channel.\n\n**Description.** This is not a full federal Honest Ads Act — the base rate is too low for that — but a narrower shock: a wave of enforceable state disclosure laws built on Washington's court-surviving template; the December-2025 AI-preemption EO whipsawing the only legal layer that currently reaches streaming; or a Fox–Roku close (~$22B, 1H-2027 guidance) reshaping the political-ad archive / ACR layer. The EU TTPA shows the mechanism — Google (2024) and Meta (October 2025) *exited* rather than de-target — so even a partial US analog would raise compliance cost and bend CTV below continuation. But *McManus* and the First Amendment foreclose the EU targeting-ban path, keeping this a tail. The band also carries a residual unmodeled structural break.\n\n**How this number was derived.** Held ABOVE a 5-10% floor and BELOW the EU-inflated read, on both disputed anchors. WA v. Meta affirmed the $35.2M disclosure penalty (WA Sup. Ct., June-18-2026, 6-of-9) and the Dec-2025 EO is a real, signed, TWO-SIDED variable (gut state AI law OR trigger a litigation whipsaw). P(>=1 break materially bends trajectory by early-2029) = federal ~0.05-0.08 + court-surviving state-disclosure wave (WA template) ~0.05 + EO/AI-preemption whipsaw ~0.04 + Fox-Roku close that materially reshapes the political archive ~0.06x0.30, overlap-adjusted ~0.13-0.19. NOT inflated by EU TTPA: McManus makes the exit conditional SEVERITY, not US probability. A small unmodeled-wildcard residual folds into this band.\n\n**Drivers.** Regulatory arbitrage (Driver 5) is the one sign-flippable driver. The December-2025 AI-preemption EO acts as a two-sided sign-flip, not a one-way damper. *Washington v. Meta* serves as a replicable, court-blessed state-disclosure template (affirmed June 18 2026). The Fox–Roku deal (~$22B, signed June 2026) reshapes platform concentration, the political archive, and the ACR layer. The counter-driver capping the probability: *McManus* and the First Amendment foreclose the EU targeting-ban path, and Kohls / AB-2839 keep knocking down prohibition-model state laws.\n\n**Conditions.** A federal statute reaching streaming, OR a court-surviving wave of state disclosure / AI laws, OR an FCC norm, OR a Fox–Roku close that materially reshapes the political inventory / identity layer; the constraint actually bites on targeting / pricing / disclosure rather than being enjoined; and the December-2025 preemption EO does not simply neutralize the state patchwork into pure continuity first.\n\n**Signals to watch.** Honest Ads Act / successor movement in the 119th Congress and any FCC/FEC streaming-jurisdiction proceeding; DOJ litigation or an FCC NPRM implementing the December-2025 AI EO against election-deepfake statutes; a circuit split or cert grant on the Washington / Maryland (*McManus*) divide, or ≥3 states enacting WA-style enforceable CTV disclosure; Fox–Roku clearing review / closing / being blocked, and whether it changes Roku's political-ad archive / ACR posture; and any US platform exiting or restricting political targeting in an echo of the EU TTPA response.\n\n**Time horizon.** Through 2028; EO-implementation litigation in 2026–2027, Fox–Roku guidance in 1H-2027, and a binding spend effect before November 2028.\n\n### Scenario 5: Effectiveness / Credibility Deflation — the persuasion case breaks and share growth stalls below continuation\n\n**Probability: 7–12%.** The principal demand-side downside.\n\n**Description.** A credible, independent, CTV-*specific* incrementality study finds that political streaming ads don't move votes — extending Kalla-Broockman's ~zero and the Coppock-Green-Porter −0.04pp digital-video null into the streaming era — and enters the trade record loudly enough that buyers re-price the channel. Because much of CTV's premium-CPM value rests on *targeted persuasion*, not just reach, a robust null deflates the share trajectory: budget waiting for proof stays on cheaper reach buys or reverts to broadcast's known GRPs, and high-CPM inventory loses pricing power. CTV does *not* shrink — its reach value is real and independent of persuasion — but its share growth stalls below continuation. This tail stays small because spend flowed for three cycles *despite* the adverse literature: the buy-side runs on reach logic, and the vendor layer is paid on dollars spent.\n\n**How this number was derived.** Decomposition, the convergent demand-side tail, scandal-prong DE-DUPLICATED. P(deflation) = P(a credible CTV-specific null produced and publicized by ~2028) ~0.25-0.30 (no streaming-specific field experiment yet exists; producing one in-horizon is plausible-but-not-likely) x P(buyers materially re-price | published) ~0.30 (Kalla-Broockman ~zero has been public since 2018 and did NOT stop three cycles of growth — reach logic + the commission-paid vendor layer dominate, the \"priced-and-ignored\" pattern; a new null hits the same wall). Product ~0.08-0.10 -> 7-12%. The scandal channel is NOT added here: a scandal acts mostly THROUGH regulation, so that mass sits in Regulatory/Platform Break, avoiding double-counted downside.\n\n**Drivers.** Measurement / effectiveness (Driver 4) is the explicit swing factor and key downside risk. The evidentiary anchors are the Kalla-Broockman ~zero meta-analysis and the Coppock-Green-Porter −0.04pp digital-video null. The counter-incentive: the commission-paid vendor / consultant layer resists deflation, paid on throughput. Reach value (Driver 1) floors CTV even if persuasion is debunked. And buyer reach-logic inertia — three cycles of growth despite the existing adverse literature — is the \"priced-and-ignored\" pattern that keeps this tail small.\n\n**Conditions.** A credible, independent, CTV-specific incrementality / persuasion study is produced *and* publicized in-horizon; it is robust (exposed-vs-control, replicable) enough to survive vendor counter-messaging; and buyers materially re-price CTV rather than continuing reach-driven spend.\n\n**Signals to watch.** Any academic or large-platform incrementality study on *streaming* political ads specifically entering the public record; a major buyer or DSP publicly discounting addressable CTV toward reach pricing; buy-side discourse shifting from \"reach + targeting\" to reach-only justifications; CPM softening on political-accepting premium inventory outside the scarcity window; and trade-press treatment of Kalla-Broockman in 2026–2028 cycle post-mortems.\n\n**Time horizon.** Through 2028; most likely to surface in post-2026-cycle analysis (2027) if at all.\n\n## Base Rates\n\n<figure class=\"corpus-fig\" role=\"group\">\n<svg viewBox=\"0 0 700 430\" role=\"img\" aria-label=\"Fan-forecast of connected-TV's share of total United States political advertising spend through the 2028 cycle. A single anchor point a
