3.\n7. **Hollywood Reporter, \"Fox to Acquire Roku in $22 Billion Deal,\" 2026-06-15.** **Tier 4–5 (trade).** https://www.hollywoodreporter.com/business/business-news/fox-acquires-roku-streaming-tech-deal-lachlan-murdoch-1236621853/ Accessed 2026-06-23.\n8. **PPC Land, \"Fox buys Roku for $22bn — what it means for CTV advertising,\" 2026-06.** **Tier 5 (ad-tech trade).** Source of Lachlan Murdoch's \"HSR … and very limited international approvals\" characterization and the first-party-data integration framing; reads the >$1B fee as \"confidence in clearance.\" https://ppc.land/fox-buys-roku-for-22bn-what-it-means-for-ctv-advertising/ Accessed 2026-06-23.\n9. **Roku, Inc., Form 425 filings, 2026-06-16 to 2026-06-18** (investor communications re: proposed merger). SEC EDGAR (e.g., accession 000114036126025255, 000119312526271554). **Tier 1.** Evidence of active shareholder solicitation = deal pending, not closed. Accessed 2026-06-23.\n10. **AdExchanger, \"Mergers and Operating Systems Are Reshaping TV Ads,\" 2026-06.** **Tier 5 (ad-tech trade).** Context on CTV-OS consolidation (Fire TV, Android/Google TV, Vizio/Walmart) framing the antitrust comparator set. https://www.adexchanger.com/the-big-story/mergers-and-operating-systems-are-reshaping-tv-ads/ Accessed 2026-06-23.\n11. **TheWrap, \"How Roku Will Supercharge Fox's Streaming and Advertising Businesses | Analysis,\" 2026-06.** **Tier 5 (trade) + Tier 6 (quoted analysts/attorney as position).** Source of Rich Greenfield \"done deal,\" Braden Perry \"approval with conditions\" / Paramount-WBD precedent, ~55% Wood voting control, and the $9B combined ad-revenue / ~16% streaming-ad-revenue framing. https://www.thewrap.com/industry-news/deals-ma/fox-roku-acquisition-impact-analysis/ Accessed 2026-06-23.\n12. **Investing.com, \"Fox Captures the Living Room With $22B Roku Buy,\" 2026-06.** **Tier 5–6 (analytical/market commentary).** Source of the 17% Fox-share drop, ~2.8x leverage, Doug Creutz (T.D. Cowen) skepticism, \"state AGs an X factor / midterms could shake things up.\" https://www.investing.com/analysis/fox-captures-the-living-room-with-22b-roku-buy-200682340 Accessed 2026-06-23.\n13. **Deadline, \"How Fox's $22 Billion Deal For Roku Raises The Floor For Its Content, Advertising Revenue & Creator Division,\" 2026-06.** **Tier 5 (trade).** Strategic-rationale context. https://deadline.com/2026/06/fox-roku-deal-22billion-analysis-1236956735/ Accessed 2026-06-23.\n14. **MLex, \"Fox-Roku deal tees up US antitrust review of streaming, connected-TV ads,\" 2026-06.** **Tier 5 (specialist legal/regulatory press; partially paywalled).** Source of the vertical theory of harm framing (streaming distribution, CTV advertising, treatment of rivals on Roku's platform). https://www.mlex.com/mlex/articles/2489887/fox-roku-deal-tees-up-us-antitrust-review-of-streaming-connected-tv-ads Accessed 2026-06-23.\n15. **PPC Land, \"Fox buys Roku, Publicis and TTD end feud …\" / Fox-Roku CTV explainer, 2026-06.** **Tier 5 (ad-tech trade).** Tubi/Roku-Channel overlap, home-screen/search/ad-inventory self-preferencing concern, ~7.2%→~10.2% viewing share, \"commitments are not legally binding consent decrees,\" UID2/OpenPath data integration. https://ppc.land/fox-buys-roku-publicis-and-ttd-end-feud-uk-publishers-sue-ai-scrapers/ Accessed 2026-06-23.\n16. **Social-media commentary (e.g., Danielle Butterfield on X, 2026-06).** Cited as evidence that observers are *asking* whether a Fox-owned Roku will provide Meta/Google-style political-ad spending transparency and what it means for 2028. https://x.com/likebutterfield/status/2066533433262620819 Accessed 2026-06-23.\n17. **Roku Advertising, \"Political Advertising Guidelines / Roku's Political Ad Archive.\"** **Tier 1 as platform-policy claim.** Live policy as of June 2026; archive discloses payer, campaign IDs, creative (not bulk spend/targeting/impressions). https://advertising.roku.com/roku-s-political-ad-archive Accessed 2026-06-23.\n18. **TechTimes, \"Fox Buys Roku for $22 Billion: ACR Tracking Now Belongs to a Broadcaster,\" 2026-06-16.** **Tier 5–6 (tech press, headline framing).** Title-level corroboration that the deal transfers ACR control to a broadcaster; full body returned 403 and was not directly read (flagged). https://www.techtimes.com/articles/318461/20260616/ Accessed 2026-06-23."}, {"order": 10, "file": "10_Gap_DataTrust_i360_GOP_Backbone.md", "title": "The Republican Data Backbone in 2026: i360 and Data Trust", "summary": "", "body": "# The Republican Data Backbone in 2026: i360 and Data Trust\n\n## Bottom Line\n\nBoth Republican-side data pillars are **live and operating in the 2026 cycle**. The risk that one had quietly wound down does not materialize, but the picture needs two corrections.\n\n**(1) i360** remains a working conservative voter-data and addressable-targeting vendor. It is still a **Koch company** (a wholly owned Koch Industries / Koch Inc. subsidiary), still founded-and-led by **Michael Palmer** as Founder & President, and — critically for the addressability argument here — it explicitly sells digital audience segments \"across social, programmatic, and **connected TV**.\" Its place in the CTV addressability stack is current, not historical [1][2][3][4][5]. The one real shift sits *upstream of the vendor*: the Koch political network recalibrated its electoral posture (the 2019 \"Stand Together\" rebrand toward cross-ideological policy work; AFP Action's extraordinary, Trump-skeptical 2024 spending that backed Nikki Haley in the primary before pivoting to congressional races). But that recalibration changed *where Koch money flows*, not whether i360 exists — and i360 in fact leaned harder into a **commercial** business (financial services, CPG, real estate) alongside politics [6][7][8].\n\n**(2) Data Trust** is likewise the operative GOP voter-data exchange in 2026, not displaced. It published a dated **November 14, 2025** voter-file modernization \"refreshed for the needs of the 2026 cycle\" (33 fields added, 18 retired, rooftop-geocoding raised 87%→98%); its current President & CEO is **Jon Black**; and the RNC relationship is intact and collaborative — the **RNC Data Department co-curates** the file that flows through the GOP Data Center, rather than an in-house RNC operation having replaced Data Trust [9][10][11][12]. Treating either as a live stack pillar is therefore correct as of mid-2026, with two nuances to keep in view: i360's commercial pivot and Koch-name brand-distancing; Data Trust's leadership and the RNC-co-curation governance model.\n\n---\n\n## Why this matters\n\nThe chapters on the addressability stack and on market structure put i360 (\"Koch-funded, Republican\") and the GOP Data Trust (\"RNC-aligned shared file\") at **Layer 2 (the voter file)** of the five-layer addressability stack. The entire Republican half of the addressability argument rests on both being live, matchable data backbones that feed CTV onboarding. Two staleness risks made this worth pinning down:\n\n- **i360's funder is volatile.** The Koch network has repeatedly re-cut its political posture — neutral on Trump in 2016/2020, an explicit anti-Trump primary play in 2024, and a long-running rebrand (\"Stand Together\") that markets itself as *less* partisan. Had that recalibration wound down or sold off i360, this account would be naming a dead or repurposed asset.\n- **Data Trust has a contentious RNC history.** Republican data carries a documented record of RNC-vs-vendor governance fights: the \"Voter Vault → GOP Data Center\" lineage, the 2017 Deep Root Analytics breach, and periodic friction over who owns and controls the party file. Had the RNC taken the file in-house or switched vendors for 2026, the \"Data Trust model\" framing would be wrong.\n\nThe task here was to confirm — with **2025–2026 dated sources** — that both are still the live GOP backbone, who owns, funds, and leads each now, and whether the RNC relationship to Data Trust still holds.\n\n---\n\n## Key Claims\n\n### Claim 10.1 — i360 is a live, operating conservative voter-data vendor in the 2026 cycle\n\ni360's own properties, accessed mid-2026, present a current, operating product. The homepage markets \"political data solutions, voter targeting, and grassroots tools for **right-of-center organizations**,\" advertising **270M+ voter profiles, 300M+ consumer profiles, and 1,800+ unique data points per individual**, under a **© 2026** footer; the Campaigns page claims \"more than 5,000 victories across all 50 states\" and \"75+ US Senate campaigns\" [1][2]. The Koch Inc. careers site lists i360 as actively hiring across Information Systems & Technology, Sales, and Data & Analytics — a sign of an active business independent of the marketing copy [4]. The point is corroborated across i360's own site, the Koch careers page, and third-party vendor directories (Tracxn, PitchBook, Capterra/Software Advice profiles dated into 2026) [1][2][4][5].\n\n### Claim 10.2 — i360 is a Koch company; Michael Palmer is still Founder & President\n\ni360 is presented as **\"A KOCH COMPANY\"** on the Koch Inc. careers page and is described in independent profiles as a wholly owned Koch Industries / Koch Inc. subsidiary providing data and analytics \"to political and commercial clients\" [4][5]. **Michael Palmer** — former CTO of John McCain's 2008 presidential campaign — founded i360 in 2009 and remains **Founder & President**, per DeSmog's profile and vendor profiles current to March 2026 (Tracxn) [3][5]. The Koch lineage runs through the 2011 folding of the network's earlier **\"Themis\"** voter-database project into i360 [3][6]. The Koch careers page, DeSmog, and Tracxn/PitchBook all concur. One nuance is worth keeping in view: i360's own consumer-facing pages now scrub the Koch name (its \"Our Story\" page does not mention Koch, and the homepage says \"independently sourced\") — a brand-distancing posture, not a change of ownership.\n\n### Claim 10.3 — i360 explicitly sells addressable segments across connected TV — its CTV-stack placement is current\n\ni360's \"Digital Audiences\" page (accessed mid-2026) markets \"advanced online segments, custom-tailored for the pro-business political and advocacy communities,\" available **\"across social, programmatic, and connected TV,\"** drawn from \"its database with over 270 million American voters and consumers\" [13]. This is the single most important confirmation here. It is direct vendor evidence — current, not from a 2022 archive — that i360 operates as a CTV-addressable data layer, exactly the role the addressability-stack and market-structure chapters assign it. This specific \"across CTV\" phrasing is i360's own page (a vendor capability claim, not an audited match rate). Historical corroboration that i360 has long fed CTV addressability comes from the 2022 fuboTV integration (with L2 and TargetSmart), which onboarded i360 segments for political CTV [14] — but that source is dated July 2022 and should not be read as a 2026 event.\n\n### Claim 10.4 — The Koch network recalibrated its *political spending posture*, not i360's existence\n\nThe recalibration that prompted the concern is real, but it operates upstream of the vendor. The network rebranded its donor seminar apparatus to **\"Stand Together\"** in 2019, claiming a pivot \"away from partisan politics\" toward cross-ideological goals [6]. In 2024, AFP Action (the network's flagship super PAC) spent at a **record level — roughly $150M+ in federal independent expenditures, more than triple its 2020 level — with about two-thirds aimed at holding the House and retaking the Senate**, after an unusual primary play backing **Nikki Haley** over Trump [7][8]. Funding included **$40M from Koch Industries and $43M from the Stand Together Chamber of Commerce** [7]. None of this retired i360. If anything, the network deepened i360's *commercial* diversification (financial services, consumer goods, real estate) to broaden its revenue base beyond the election calendar [5]. Reporting from Sludge, the Center for Media and Democracy, and OpenSecrets concurs on the spending; the commercial-diversification framing is from independent vendor profiles. One note on the lean: Sludge and the Center for Media and Democracy (EXPOSEDbyCMD) are progressive watchdog outlets — used here for the dollar figures, which trace to FEC filings and OpenSecrets [7][8].\n\n### Claim 10.5 — Data Trust is the operative GOP voter-data exchange in 2026, actively modernized for the cycle\n\nData Trust published a dated **November 14, 2025** post, \"Enhancing Data Trust: Major Voter File Improvements,\" stating the schema was **\"refreshed for the needs of the 2026 cycle\"** — 33 high-value fields added, 18 retired, a cross-state \"Moved\" flag and carried-over vote history/party added, donor flags integrated, and nationwide rooftop-geocoding accuracy improved from **87% to 98%** [9]. The homepage (accessed mid-2026, © 2026) describes Data Trust as \"the leading provider of voter and electoral data to Republican and conservative campaigns,\" tracking **300M+ individuals with 2,500+ unique data points**, and states it **\"supported more than 5,000 Republican campaigns\" in the 2024 cycle**; its news feed references the 2025 PA/NJ/VA elections [10][11]. The dated 2025 post, the live 2026 homepage, and third-party reporting all confirm the firm is operating; the scale figures (300M / 2,500 / 5,000) are vendor self-description, carried as \"Data Trust reports,\" not as audited counts.\n\n### Claim 10.6 — The RNC↔Data Trust relationship is intact and collaborative; Data Trust has not been displaced by an in-house RNC operation\n\nNo 2025–2026 reporting surfaced indicating the RNC took its voter file in-house or replaced Data Trust. The structure remains the long-standing **exclusive list-exchange model**: Data Trust is the core file, and \"**all leading Republican party committees rely on Data Trust data**\" (Data Trust's own About page) [12]. The party-facing front end, the **GOP Data Center** (the lineage successor to \"Voter Vault\"), runs in collaboration with the **RNC Data Department** — the California GOP, for instance, describes its CAGOP Data Department working \"in collaboration with the RNC Data Department\" to curate datapoints added to the Data Trust file [11]. Data Trust's current leadership is **Jon Black, President & CEO**, with **Liam O'Rourke as Chief Data Officer** [12]. One caveat: the \"not displaced\" finding rests partly on an *absence* of contrary reporting — no 2025–2026 source asserts displacement, while several affirm continued operation, but absence of evidence is weaker than direct evidence. The active collaboration and current leadership are directly sourced [11][12].\n\n### Claim 10.7 — Republican data history includes governance friction and a major breach, worth acknowledging without overstating current risk\n\nThe RNC-data ecosystem's contentious history is real. The 2017 **Deep Root Analytics** breach exposed personal data on ~198 million voters (the file was assembled for the RNC and touched Data Trust's ecosystem), and ProPublica reported on the RNC ceasing payments to a breached data firm and then paying a same-address LLC — evidence of past governance turbulence [15][16]. But none of this reporting shows Data Trust *replaced* for 2026; the firm visibly continued and modernized. ProPublica, UpGuard, and The Hill all document the breach. This belongs as historical context for \"the GOP data backbone has had governance fights,\" not as a current doubt about the firm's viability.\n\n---\n\n## Narrative\n\n### i360: still a Koch company, still Palmer, now explicitly a CTV data layer\n\nA natural worry is that the Koch network's repeated political recalibrations might have wound down, sold, or repurposed i360. That worry does not hold up against 2026 evidence. i360's live properties — homepage, Campaigns page, Digital Audiences page, all accessed mid-2026 with © 2026 footers — market a fully operating product to \"right-of-center organizations,\" and the **Koch Inc. careers site brands it \"A KOCH COMPANY\"** and is actively recruiting for it [1][2][4]. Independent vendor databases (Tracxn, PitchBook, Capterra, Software Advice) carry i360 profiles current into 2026 and still list **Michael Palmer as Founder & President** [5]. Ownership traces cleanly: the Koch network's earlier **Themis** voter-database effort was folded into i360 in 2011, and independent profiles describe i360 as a wholly owned Koch Industries / Koch Inc. subsidiary serving \"political and commercial clients\" [3][5][6].\n\nWhat *did* change sits two layers up. The Koch donor apparatus rebranded to **\"Stand Together\"** in 2019 and now markets a cross-ideological, less-overtly-partisan identity; and in 2024 AFP Action ran a record, Trump-skeptical campaign — backing **Nikki Haley** in the primary, then pouring a tripled-from-2020 sum (roughly **$150M+**, ~two-thirds to congressional races) into holding the House and Senate, with **$40M from Koch Industries and $43M from the Stand Together Chamber of Commerce** [6][7][8]. That is a recalibration of *political money*, not of the data company. If anything, the network insulated i360 from the swings of the political calendar by **diversifying it commercially** — financial services, consumer goods, real estate, market research — so that voter targeting is one vertical among several [5]. One nuance is worth noting: i360's *own* consumer-facing pages now **omit the Koch name** (\"Our Story\" never mentions Koch; the homepage emphasizes \"independently sourced\" data). That is a brand-distancing posture — but from the Koch side, the ownership is unambiguous [2][4].\n\nThe single most important confirmation here is plain: i360's **Digital Audiences** page sells its segments \"**across social, programmatic, and connected TV**\" [13]. That is current, first-party evidence that i360 occupies exactly the Layer-2-into-Layer-4 role the addressability-stack chapter assigns it. The older supporting anecdote — i360's 2022 fuboTV political-CTV integration alongside L2 and TargetSmart — corroborates the *history* of i360 in CTV, but it is **dated July 2022** and should be read as such, not as a 2026 datapoint [14].\n\n### Data Trust: not displaced, actively refreshed for 2026, RNC-collaborative\n\nData Trust looks even more clearly alive, because it left a **dated 2025 paper trail**. Its November 14, 2025 post explicitly modernizes the file \"**for the needs of the 2026 cycle**\" — 33 fields added, 18 retired, cross-state mobility and donor flags integrated, rooftop geocoding pushed from 87% to 98% [9]. A vendor that is winding down does not re-engineer its schema for the next cycle. The homepage (© 2026) reaffirms the **300M individuals / 2,500+ data points** scale and the **5,000+ Republican campaigns supported in 2024**, and its news feed references the **2025 PA/NJ/VA** elections — current activity, not legacy copy [10][11].\n\nOn governance, the specific worry — that the RNC might have taken the file in-house or switched vendors — finds no support. The model is unchanged. Data Trust is the core file with an exclusive list-exchange posture, \"**all leading Republican party committees rely on Data Trust data**,\" and the party-facing **GOP Data Center** front end runs *with* the **RNC Data Department** (the California GOP describes its data team working \"in collaboration with the RNC Data Department\" on the Data Trust file) [11][12]. That is the opposite of displacement: the RNC and Data Trust co-curating one shared asset. Current leadership is **Jon Black (President & CEO)** and **Liam O'Rourke (Chief Data Officer)** [12].\n\nThe ecosystem's contentious history is genuine and worth acknowledging. The 2017 **Deep Root Analytics** breach exposed ~198M voters' data, and ProPublica documented RNC payment turbulence around a breached vendor [15][16]. But that is *history* — none of it shows Data Trust replaced for 2026. The honest framing is this: the GOP data backbone has a documented history of breaches and governance friction, **and** it remains the operative, actively-modernized backbone in 2026.\n\n---\n\n## What this means for the picture\n\n- Treating i360 and Data Trust as live Layer-2 pillars is substantively correct. Nothing needs to be walked back.\n- The dated anchors hold: i360 \"A KOCH COMPANY,\" Palmer still Founder & President, CTV-segment sales (i360 Digital Audiences, mid-2026); Data Trust's **Nov 14, 2025** 2026-cycle file refresh and **Jon Black** as CEO.\n- The precise phrasing for i360's ownership is \"**a Koch company (wholly owned Koch Industries / Koch Inc. subsidiary)**,\" not just \"Koch-backed/funded\" — with the nuance that the network's *political* spending recalibrated (Stand Together rebrand; 2024 anti-Trump-primary, pro-Haley posture) while i360 diversified commercially and distanced its own branding from the Koch name.\n- The 2022 fuboTV integration is *not* recent — it dates to July 2022; the i360 Digital Audiences page is the *current* CTV evidence.\n- On governance, the RNC↔Data Trust relationship is intact and **co-curated with the RNC Data Department via the GOP Data Center**, not displaced by an in-house RNC operation; the 2017 Deep Root breach is historical context, not a present-day red flag.\n\n---\n\n## Open Questions\n\n1. **Does the RNC still hold a formal *exclusive* list-exchange contract with Data Trust in 2026, or has it loosened to \"preferred\"?** Sources confirm \"all leading Republican party committees rely on Data Trust\" and active RNC-Data-Department collaboration, but the verbatim 2026 contract terms (exclusivity vs. preference) lie outside the public record I could reach. (Best source: FEC disbursement records for RNC→Data Trust payments in the 2025–2026 cycle; trade reporting from Politico/AdImpact.)\n2. **Who funds i360's day-to-day now that the Koch political posture has shifted — political clients, commercial clients, or internal Koch capital?** The commercial diversification is documented directionally; the revenue split is not public.\n3. **What are i360's and Data Trust's actual CTV onboarding partners and match rates?** Both market CTV/programmatic segments, but neither discloses its identity-graph partner (LiveRamp? Experian?) or audited match rate — the same match-rate caveats raised in the chapter on market structure apply here too.\n4. **Did the Koch network's 2024 anti-Trump primary posture cost i360 any RNC/Trump-campaign data business?** A plausible commercial consequence worth checking against 2025–2026 trade reporting; not found in this pass.\n5. **Has any 2026 state privacy or voter-data law (e.g., a state AI-disclosure or data-broker statute) constrained i360 or Data Trust specifically?** This connects to the chapter on regulation, privacy, and risk, but was not pursued here.\n\n---\n\n## Sources\n\n1. i360, \"Political Data Solutions & Voter Targeting\" (homepage) — 270M+ voter profiles, 300M+ consumer profiles, 1,800+ data points, \"right-of-center organizations,\" © 2026. **Tier 1** (vendor self-description, as claim). Accessed 2026-06-23. https://www.i-360.com/\n2. i360, \"Our Story\" (company history page) — founding 2009, dual political/commercial focus, no Koch mention, © 2026. **Tier 1** (vendor). Accessed 2026-06-23. https://www.i-360.com/company/our-story/ ; i360 \"Campaigns\" page (5,000+ victories; 75+ US Senate campaigns). https://www.i-360.com/industries/campaigns/\n3. DeSmog, \"i360\" profile — Palmer founded i360 (2009, ex-McCain '08 CTO), still Founder & President; Themis lineage; Freedom Partners/Koch funding (~$35.9M to Demeter; $53.6M from Freedom Partners Action Fund 2011–2018). **Tier 5** (investigative climate-and-influence watchdog; note left lean — used for ownership/leadership facts, which trace to filings). Accessed 2026-06-23. https://www.desmog.com/i360/\n4. Koch Inc., \"i360\" career-opportunities page — \"A KOCH COMPANY,\" actively hiring (IS&T, Sales, Data & Analytics), political + commercial business lines. **Tier 1** (corporate site, as claim — evidence of an active business). Accessed 2026-06-23. https://www.kochinc.com/career-opportunities/i360 (redirected from jobs.kochcareers.com/i360)\n5. Tracxn (\"i360 — 2026 Company Profile,\" accessed via search 2026-03-07 data) + PitchBook (\"i360 2026 Company Profile\") + alphaevents.com Future Alpha sponsor page — i360 as wholly owned Koch Industries subsidiary; 270M US adults; financial-services/CPG/politics/real-estate verticals; Palmer Founder & President. **Tier 5** (vendor/data-aggregator profiles; directional, corroborating). Accessed 2026-06-23. https://tracxn.com/d/companies/i360/ ; https://pitchbook.com/profiles/company/182648-80 ; https://www.alphaevents.com/events-futurealphaglobal/sponsors/i360\n6. Wikipedia, \"Koch network\" (used only to locate primary citations, not cited for facts) — 2019 \"Stand Together\" rebrand; 2024 AFP anti-Trump-primary / Haley endorsement; i360 ~250M adults / 190M registered. **Navigation only** (cite the underlying outlets; never Wikipedia for substantive claims). Accessed 2026-06-23. https://en.wikipedia.org/wiki/Koch_network\n7. Sludge (readsludge.com), \"Koch Super PAC Shatters Its Election Spending Record,\" 2024-11-04 — AFP Action $150M+ (reported >$157M) in 2024 federal IEs, ~2/3 to House/Senate, >3× 2020; $40M from Koch Industries, $43M from Stand Together Chamber of Commerce. **Tier 5/6** (progressive watchdog; dollar figures trace to FEC/OpenSecrets). Accessed 2026-06-23. https://readsludge.com/2024/11/04/koch-super-pac-shatters-its-election-spending-record/\n8. OpenSecrets News, \"Koch network's flagship super PAC pours big money into 2024 elections,\" 2024-08 — AFP Action 2024 spending scale and sources; Haley primary spend. **Tier 5** (nonpartisan money-in-politics tracker; primary FEC data). Accessed 2026-06-23. https://www.opensecrets.org/news/2024/08/koch-network-flagship-super-pac-pours-big-money-into-2024-elections/\n9. Data Trust, \"Enhancing Data Trust: Major Voter File Improvements,\" dated **2025-11-14** — schema \"refreshed for the needs of the 2026 cycle,\" 33 fields added / 18 retired, \"Moved\" flag, donor flags, CalcParty model, geocoding 87%→98%. **Tier 1** (vendor; dated evidence the firm is operating). Accessed 2026-06-23. https://thedatatrust.com/enhancing-data-trust-major-voter-file-improvements/\n10. Data Trust, homepage — \"leading provider of voter and electoral data to Republican and conservative campaigns,\" 300M+ individuals / 2,500+ data points, 5,000+ Republican campaigns in 2024, 2025 PA/NJ/VA elections referenced, © 2026. **Tier 1** (vendor, as claim). Accessed 2026-06-23. https://thedatatrust.com/\n11. CAGOP Data, \"GOP Data Center\" — CAGOP Data Department \"in collaboration with the RNC Data Department\" curating the Data Trust file via GOP Data Center; 1B+ data points added to CA file since 2021. **Tier 5** (state-party site; evidence of the RNC↔Data Trust↔Data Center collaboration). Accessed 2026-06-23. https://cagopdata.com/data-center\n12. Data Trust, \"About\" page — \"all leading Republican party committees rely on Data Trust data\"; core-infrastructure framing; leadership **Jon Black (President & CEO)**, **Liam O'Rourke (Chief Data Officer)**, 28 named team members; © 2026. **Tier 1** (vendor; current leadership). Accessed 2026-06-23. https://thedatatrust.com/about/\n13. i360, \"i360 Digital Audiences\" — segments \"across social, programmatic, and **connected TV**,\" from a 270M+ voter/consumer database. **Tier 1** (vendor capability claim; the key CTV-stack confirmation). Accessed 2026-06-23. https://www.i-360.com/i360-digital-audiences/\n14. AdExchanger, \"FuboTV Preps For Uptick In Political CTV Ad Spend With Three Data Integrations,\" **2022-07-26** — fuboTV integrated i360 (R), L2 (moderate), TargetSmart (D) for political CTV; i360 surveys voters + appends third-party behavioral/lifestyle data. **Tier 5** (ad-tech trade). *Dated 2022 — historical corroboration only, not a 2026 event.* Accessed 2026-06-23. https://www.adexchanger.com/digital-tv/fubotv-preps-for-uptick-in-political-ctv-ad-spend-with-three-data-integrations/\n15. The Hill, \"Data on 198M voters exposed by GOP contractor\" (Deep Root Analytics, 2017) + UpGuard, \"The RNC Files: Inside the Largest US Voter Data Leak.\" **Tier 4 / Tier 5** (major outlet + security-research firm). Historical governance context. Accessed 2026-06-23. https://thehill.com/policy/cybersecurity/338383-data-on-198-million-us-voters-left-exposed-to-the-internet-by-rnc-data/ ; https://www.upguard.com/breaches/the-rnc-files\n16. ProPublica, \"The RNC Stopped Paying a Data Firm After A Serious Breach. Then It Paid A Mysterious LLC With the Same Address.\" **Tier 4** (investigative nonprofit). Historical RNC-data governance turbulence; does not show 2026 displacement. Accessed 2026-06-23. https://www.propublica.org/article/the-rnc-stopped-paying-a-data-firm-after-a-serious-breach-then-it-paid-a-mysterious-llc-with-the-same-address\n\n---\n\n*A note on the numbers: the vendor scale figures (i360 270M/300M/1,800; Data Trust 300M/2,500/5,000) are self-descriptions from the firms, carried as \"the firm reports,\" not audited counts. And the conclusion that the RNC has not displaced Data Trust rests partly on the absence of any 2025–2026 source asserting otherwise, rather than on a positive statement of the contract terms.*"}, {"order": 11, "file": "11_Gap_BuySide_Practitioner_Modality.md", "title": "The Operator's Seat: What Political CTV Buyers Actually Do — A Practitioner-Grounded Pass", "summary": "", "body": "# 11 — The Operator's Seat: What Political CTV Buyers Actually Do\n\n## Bottom Line\n\nMost accounts of political CTV look in from the outside: vendor decks, trade-press quotes, the academic effects literature, regulatory text. These pages take a different angle — not a missing *figure* but a missing *vantage*. They ask the people who sit at the buying desk — campaign digital directors, agency programmatic and CTV leads, ad-ops staff — what they really do with a political CTV budget, and where the vendor story and the operator's experience part ways.\n\nFour findings reframe the picture. **First, the central caution running through this account — that CTV's defensible value is *reach*, not *persuasion* — holds from the buyer's seat, and sharpens there: practitioners themselves describe most political CTV as a \"mass reach tool\" bought broad, not a scalpel. The capability to target a voter-file-matched persuasion universe is real and used, but it spends the *minority* of the money. Most CTV dollars go to geographic and ZIP-level \"over-indexing\" plus run-of-network across a geography — operators say so plainly [1][2][7]. **Second, the single most load-bearing number in the whole question — *what fraction of \"CTV\" money is genuinely voter-file-matched addressable* — resists precise quantification even from a buyer's seat, but the directional answer is now firm: a minority. The addressable share is gated by match rates that practitioner guides put at **50–70% for a clean voter file**, against the **90%+** the buy-side vendor DSPolitical advertises — a gap that *is* the honest-framing problem made concrete [3][8]. **Third, the friction is real and specific: minimum spends (most enterprise programmatic and CTV platforms were built for national budgets and gate at $25K–$50K, even as self-serve tools now start at $50), onboarding lag (3–7 business days through LiveRamp), a frequency-capping failure mode where 8–15% of households absorb 42–60% of impressions, a \"location gap\" and \"lack of verified competitive data,\" and an open-exchange fraud/IVT tax (~$1.1B lost in a single quarter of 2024) that quietly gets reclassified as \"ops\" [4][8][12][13][9]. **Fourth, the contested partisan-efficiency claim — \"Republicans used CTV as a scalpel, Democrats as a broadcast channel\" — is, from the operator side, an *argument Democratic practitioners are making to their own side*, not an audited fact; the same operators concede most campaigns of both parties still default to broad buys and linear habits [6][11].\n\nThe synthesis: the addressability *stack* described earlier is real, but the addressability *practice* is thinner than the stack implies. Operators buy reach, measure proxies, and reach for the voter-file scalpel on a minority of impressions — because the scalpel is expensive, gated by match rates, and hard to prove worked. This is the \"honest framing\" caution running through this account, told by the people holding the budget.\n\n---\n\n## 1. How Buyers Actually Choose CTV vs. Linear vs. Digital Video\n\n### 1.1 The decision has flipped — but not the way the decks say\n\nThe decks say CTV is \"the future of persuasion.\" The people at the plan say something narrower and more honest: CTV has become the *reach-planning anchor*, displacing the old \"linear-first, digital-as-garnish\" order. **Greg Butcher, founder and president of Alamo Intelligence**, describing the shift on a 2026 practitioner panel covered by The Current, said campaigns now \"fund CTV first in their media plans, instead of broadcast,\" and that \"digital is no longer just a tool to boost a broadcast buy\" — it is \"a mass reach tool\" [1]. The operative phrase is *mass reach tool*. That is not the scalpel the addressability decks sell. It is a broadcast replacement.\n\n**Elisabeth Blossom, digital strategy manager at Sage Media Planning**, on the same panel, named the change in sequence: CTV is \"becoming part of many political strategies from the beginning, rather than being an afterthought\" [1]. Note what this does and does not say. It says CTV is now *planned in from the start*. It does not say CTV is bought *addressably* from the start — and as §2 shows, those are different claims.\n\n### 1.2 The real decision criteria: reach curves, cord-cutter access, and cost\n\nWhen operators choose CTV over linear, three buyer-side mechanics drive the call — and the vendor literature underplays all three:\n\n1. **Cord-cutter access (the strong, undisputed case).** Linear cannot reach a growing, younger, more persuadable slice of the electorate. CTV can. This is the reach-extension job isolated earlier, and operators treat it as the genuine, defensible reason to buy — it does not depend on persuasion working [1][7].\n2. **Cost democratization.** Butcher's phrase — CTV \"has democratized campaigns' ability to get on TV\" — captures the down-ballot reality: a linear buy in a major market often gates at $50,000+, while a self-serve CTV campaign can start at $50 [1][2]. For a state-legislative or municipal campaign, CTV is the *only* way onto a TV screen at a rational cost. This is why the down-ballot long tail mechanically pulls money toward CTV.\n3. **Late-cycle flexibility.** Political spend is violently back-loaded — practitioners cite ~48% of digital budgets spent in the final 30 days — so operators prize CTV's programmatic ability to shift budget across apps and audiences in near-real time, which a fixed broadcast buy cannot do [5][14].\n\n### 1.3 The honest operator default: linear still wins the base buy\n\nThe operators themselves do not claim CTV has won. The cases *against* are practitioner cases, not vendor straw men. The default media plan for a well-funded statewide race still anchors on linear for guaranteed reach and lowest-unit-rate protection, with CTV as the *cord-cutter extension and the down-ballot/geo-precision layer*. **Adnan Mohamed, senior political strategist at TargetSmart** (and a former Cox Media sales executive), writing in Campaigns & Elections in 2026, frames it as a problem *still to be solved* on the Democratic side: \"too many campaigns still spend most of their budgets on linear TV\" [6]. That is an operator conceding that the broadcast-first default persists in 2026 — the opposite of the \"tipping point has arrived\" vendor narrative, and a useful corrective to it.\n\n---\n\n## 2. The Quantification the Corpus Needs: Addressable vs. Broad\n\nThe \"honest framing\" caution rests here, and a buyer's seat is the one place that can answer. No one has quantified *what fraction of \"CTV\" political money is genuinely voter-file-matched addressable versus contextual/run-of-network*. From the operator side, a precise dollar fraction still does not exist in the public record — but the directional answer is now firm and well-attested: **the addressable, voter-file-matched share is the minority; most political CTV is bought broad, geo-targeted, or run-of-network across a geography.**\n\n### 2.1 How operators actually scale a buy — and why it goes broad\n\nThe tell is how practitioner guides instruct buyers to *scale* a CTV program. The standard move is not \"match a bigger voter file.\" It is geographic: identify target geographies, \"over-index\" priority ZIP codes, and \"buy run of network CTV across a geography to ensure surrounding your target audience with your message\" [7]. That is a *contextual/geographic* buy dressed in addressable language. The voter file informs *where* to weight spend; it does not gate *who* sees the ad at the household level. Operators reach for genuine household-addressable matching on a slice of the budget — typically the core persuasion or turnout universe — and fill the rest with geo-and-demo broad reach, because that is what scales and what the CPM economics support.\n\nThe 2025 off-cycle data makes this concrete. In the 2025 Wisconsin Supreme Court race, CTV grew to **$20.1 million — 31% of total spend** — yet AdImpact's own description of how that money ran is \"geographic and demographic microtargeting,\" with region-specific creative (e.g., northern vs. southern parts of a state), not household voter-file matching [10]. A third of the budget on CTV, and the documented mechanism is *geo/demo*, not *addressable*. That is the pattern in miniature.\n\n### 2.2 The waste critique — operators describing their own inefficiency\n\nThe sharpest evidence that most political CTV is bought broad comes from the vendors trying to *sell against* that default — position-evidence, but unusually candid position-evidence about how the buy actually runs. **Jamloop**, a political CTV firm, markets explicitly against three documented inefficiencies in current political streaming budgets: ads \"keep serving to voters who already voted,\" \"wasted spend outside your district,\" and \"TV spend disconnected from campaign outcomes\" because most political CTV \"stops at impressions\" [2]. A firm does not build a product to fix a problem its prospects do not have. That \"drop-already-voted-households\" and \"impression-level transparency\" products exist and sell is itself evidence that prevailing practice is broad, reach-optimized, and weakly measured. Read this as a vendor's market positioning, not an audit [2] — but a vendor's positioning is a map of the buy-side pain it has watched.\n\nA second practitioner framing, surfaced in trade coverage of the same debate, states the problem flatly: \"Most CTV campaigns are still optimized for brand advertising, not for political persuasion. Reach is prioritized over relevance. Frequency builds long after voters have already made their decision\" [2][7]. This is the buy-side confirmation of the effectiveness skepticism laid out earlier, in the operators' own diagnostic language.\n\n### 2.3 The match-rate gap — the honest-framing problem, made numeric\n\nWhether the addressable slice can even *be* addressable depends on match rate — the share of a voter file that resolves to a CTV household. Here the vendor story and the operator reality visibly diverge, and the gap is the honest-framing problem rendered in numbers.\n\n- **Practitioner guides** for buyers put a realistic expectation at **50–70% match rates for a clean voter file** against streaming audiences [3][8]. That means **30–50% of a \"matched\" voter universe is unreachable on CTV** through the addressable path — those voters fall back to broad/geo delivery or go dark on the channel.\n- **The buy-side vendor DSPolitical** advertises **90%+ match rates \"through their multiple onboarders\"** [8]. This is a vendor capability claim, not an independently audited rate, and it sits ~20–40 points above the practitioner-guide expectation [8].\n- Behind the spread sits the **deterministic-vs-probabilistic tradeoff** every operator manages: deterministic matches (resolving back to a known person/household) are accurate but *lower-volume*; probabilistic matches expand reach but introduce uncertainty about whether the right household saw the ad [3]. Pushing the headline match rate up generally means leaning probabilistic — buying *reach* at the cost of *precision*, which is exactly the addressable-to-broad slide this section documents.\n\n**The McKinsey read:** when a vendor quotes a 90%+ match rate and a campaign builds a persuasion plan on it, the operator's lived number is materially lower for the deterministic, genuinely-addressable share — and the difference is quietly absorbed into broad delivery. Match-rate claims are best treated as vendor-published capability claims, not independently audited; the competing practitioner number here is what makes the caution actionable.\n\n---\n\n## 3. The Friction Points — What Goes Wrong at the Desk\n\nThe vendor-sourced material describes a clean addressable machine. The operator's desk is messier. Five friction points recur across practitioner and ad-ops accounts.\n\n### 3.1 Minimum spends and onboarding lag\n\nThe \"$50 to get on TV\" democratization story is real for self-serve tools, but it sits beside a harder enterprise reality: **most programmatic and CTV platforms were built for national campaigns with large budgets and require minimum spends of $25,000, $50,000, or more** [8]. Some charge a **flat onboarding fee of $1,000–$5,000** for custom voter-file activation [8]. And the addressable path carries a clock: **traditional onboarding through LiveRamp takes 3–7 business days from file upload to activated audience** — a real constraint in a back-loaded cycle, where a late strategic pivot may not survive a week of onboarding lag [8]. The effect is a two-tier market: deep-pocketed statewide and presidential buyers reach the full enterprise addressable stack; down-ballot and late-entry campaigns route to self-serve tools and lean broad.\n\n### 3.2 The frequency-capping failure mode\n\nFrequency capping — limiting how often one household sees an ad — is the single most-cited CTV ad-ops failure, and it is quantified. Across CTV generally, **just 8–15% of households exceeded their intended frequency cap, but those households absorbed 42–60% of total impressions** [4]. The cause is structural: streaming platforms often do not share granular household-level frequency data, so a household hits its cap on one platform while still taking impressions from others — a \"lopsided delivery pattern\" no single buyer fully sees [4]. For a political campaign, this is not just waste. It is the over-saturation the effectiveness literature warns against, and it runs materially worse in the open multi-platform buy than the addressable single-platform one — a hidden cost of the broad-reach default.\n\n### 3.3 The \"verified competitive data\" and \"location gap\"\n\nOperators name an intelligence deficit that linear buyers never faced. **Tyler Goldberg, director of political strategy at Assembly Global**, calls it *the* growth-limiter: \"The lack of verified competitive data is holding back the growth of digital in the political space\" [1]. In linear, a buyer can see what the opponent is buying through station files and CMAG-style tracking; in programmatic CTV, that visibility is far weaker. Compounding it is a \"location gap\" — the absence of reliable geographic signals in parts of the programmatic CTV ecosystem, where \"ads can be served without consistent insight into where or to whom they were actually delivered\" [4]. For a campaign whose entire logic is geographic — this district, this media market, this state — a channel that cannot always confirm *where* an impression landed is a governance problem, not a footnote.\n\n### 3.4 Inventory quality, fraud, and the \"ops\" reclassification\n\nThe open programmatic CTV market carries a fraud and invalid-traffic (IVT) tax that buy-side ad-ops staff manage but rarely surface to clients. Industry measurement (Pixalate) found **more than $1.1 billion in open-programmatic CTV ad spend lost to invalid traffic in a single quarter of 2024**, with \"made-for-advertising\" apps and unauthorized \"direct\" sellers (an estimated $1.4B routed through sellers misrepresenting their supply-chain status in Q3 2024) draining budgets [9][13]. The ad-ops insider line is the telling one: \"a huge amount of CTV loss gets quietly reclassified as 'ops' when it is really failure in the execution layer,\" and agencies \"are often paid based on volume\" — a structural reason the waste never gets escalated [9]. This is the buy-side mirror of the motive-aware read running through this account: the people who could flag the leakage are paid on the throughput that produces it.\n\n### 3.5 Platform exclusions and brand-safety floors\n\nOperators must plan around a fragmented permission map the addressability decks gloss over. The biggest reach assets refuse political ads — Amazon and Netflix prohibit them, and LG Ad Solutions restricts issue and candidate advertising on its home-screen inventory [12]. Publisher participation is selective even within the \"yes\" platforms: in OpenX's February 2026 values-based political curation launch, **Newsweek explicitly excluded its healthcare CTV inventory** from the political packages, and OpenX reported that while \"more than half\" of its publishers enabled political advertising, many \"whitelist only trusted advertisers\" or impose strict creative review [15]. The buy-side consequence is a CPM floor. **Mica Hansen, EVP and Director of Political Sales at Locality**, on the demand crunch in battleground states: \"It does kind of put a floor under CPMs. You're not going to be able to come in and execute at your bottom dollar\" [12]. Scarcity plus exclusions equals a structurally higher effective cost than the headline CPM — which the market-structure analysis quantifies, and this confirms from the sell-political-CTV seat.\n\n---\n\n## 4. Post-2024 Retrospectives — What CTV Did and Didn't Deliver, From the Buy Side\n\n### 4.1 The \"scalpel vs. broadcast\" claim is an internal argument, not an audit\n\nThe \"Republicans used CTV efficiently as a precision tool while Democrats treated it as a broadcast channel\" claim is, as noted earlier, both contested and vendor-sourced. The buy-side view sharpens *why*: in 2026 it functions mainly as **an argument Democratic practitioners are making to their own side**, not as an independently audited finding. Adnan Mohamed's Campaigns & Elections piece is titled and framed as advocacy — \"why Democrats must treat streaming as the new political battleground\" — and explicitly concedes Democrats \"lagged\" and \"still spend most of their budgets on linear TV\" [6]. The original \"Moneyball / half the media Trump ran\" formulation traces to DSPolitical, a Democratic-aligned vendor *characterizing* the Trump operation. Follow the claim's life cycle: a Democratic vendor characterizes the GOP buy → Democratic strategists adopt it as self-critique and a call to spend more on the channel (and the tools) they sell or use. That is position-evidence about an *intramural* debate, not an audited comparison of two media plans. **No operator on either side has published an audited, apples-to-apples breakdown of addressable vs. broad CTV spend by party for 2024.** That remains an open question, and the buy-side confirms it is open.\n\n### 4.2 What operators say CTV genuinely delivered\n\nStripped of the persuasion claims, the buy-side retrospective credits CTV with concrete reach-and-flexibility wins that survive skepticism:\n\n- **Incremental reach.** Practitioner-cited 2024 data credits CTV with a ~32% increase in total reach versus linear-only plans, plus the frequency-management framing of \"~36% more efficient than linear\" — both reach/efficiency claims, not persuasion claims [5][14]. Operators treat these as the real product.\n- **Geographic precision for the down-ballot tail.** The genuine win operators name is the ability to confine a buy to a congressional or legislative district, which broadcast cannot do efficiently — the down-ballot economics documented earlier [7][10].\n- **Real-time reallocation in the late surge.** With ~48% of digital budgets spent in the final 30 days, operators valued CTV's ability to move money across apps and audiences as polls shifted [5][14].\n\n### 4.3 What operators say CTV did not deliver\n\n- **Proven persuasion.** No operator surfaced an audited claim that CTV moved votes beyond what the same dollars on linear would have. The buy-side default is to chase *measurable proxies* — reach, completed views, frequency, match rates, modeled outcomes — because votes are not cleanly attributable. That is the core point made earlier, confirmed from the desk [2][6].\n- **Clean measurement and competitive intelligence.** The \"verified competitive data\" deficit (Goldberg) and the frequency/location gaps (§3) mean operators did *not* get the closed-loop measurement the decks imply [1][4].\n- **Addressability at the scale advertised.** The 50–70% real-world match-rate ceiling on clean files (§2.3) means a meaningful share of every \"addressable\" plan defaulted to broad delivery [3][8].\n\n### 4.4 The institutional signal: the industry is naming the integration problem\n\nThe clearest sign that the buy side has internalized \"CTV is reach, not a standalone scalpel\" is institutional. For 2026, the Campaigns & Elections **Reed Awards** — the political industry's own recognition system — added a **new category, \"Best Integration of Linear and CTV for a Campaign\"** [16]. The unit of excellence the practitioner community chose to reward is not \"best addressable CTV targeting\" but *best integration of linear and CTV* — a plain acknowledgment that the operator's real job is orchestrating reach and frequency *across* linear and streaming, not replacing one with the other. The industry rewards the reach-planning competence described throughout these pages, not the persuasion-scalpel the vendor decks sell.\n\n---\n\n## 5. The Motive-Aware Buy-Side Read\n\nFollowing the money makes one thing plain: everyone loud about \"CTV is the future\" gets paid if campaigns believe it. The buy-side view adds the missing actor — **the operator who knows better and buys it anyway** — and the structural reasons they do.\n\n1. **The agency is paid on throughput.** With media-buying commissions historically ~15% of the gross buy and ad-ops \"often paid based on volume\" [9], the buy-side layer earns more the more is bought and the less waste is escalated. The operator who flags that 40–60% of impressions are over-frequency, or that a third of a \"matched\" file went unreachable, is arguing against their own firm's revenue.\n2. **Risk parity beats proven ROI.** No digital director wants to be the one who *didn't* buy the channel the opponent bought. The buy tracks competitive parity, not audited effect — and the \"lack of verified competitive data\" (Goldberg) means parity is *assumed*, which inflates spend on both sides.\n3. **Operators chase what they can measure.** Reach, completed views, frequency, and match rates report cleanly; votes do not. So the buy optimizes the measurable proxy, even where the proxy does not map to persuasion — the buy-side root of the reach-vs-persuasion split [2][6].\n4. **The intramural-critique flywheel.** The \"Democrats must catch up on CTV\" argument (§4.1) comes from the strategists and vendors who profit from more CTV spend and more tool licensing. It may be directionally right about reach; it is *motivated* about persuasion. Treat the call to \"spend more on streaming\" as position-evidence from interested operators, exactly as the vendors' version should be treated [6][11].\n\nThe buy-side bottom line is the bottom line of this whole account, confirmed by the people holding the budget: **CTV's value is reach, bought mostly broad, measured by proxy, and reached-for addressably on a gated minority of impressions. The persuasion premium is an article of faith — and the operators chasing measurable proxies, paid on throughput, and buying for risk parity have every reason not to test that faith too hard.**\n\n---\n\n## Open Questions\n\n1. **What is the actual addressable-vs-broad dollar split for political CTV?** The directional answer (broad is the majority) is now firm from the buy side, but no operator or tracker has published a clean percentage. A survey of agency CTV leads or an AdImpact/Wesleyan methodological cut by buy type (addressable deal-ID vs. geo/RON) would resolve it.\n2. **What is the real-world deterministic match rate top buyers actually achieve?** Practitioner guides say 50–70% clean-file; DSPolitical advertises 90%+. The audited deterministic number — and how much of the gap is probabilistic backfill — is undisclosed.\n3. **Is the \"Republicans used CTV as a scalpel\" claim true on an audited basis?** No party has published an apples-to-apples addressable-vs-broad CTV breakdown by party for 2024. It remains an intramural Democratic argument, not a finding.\n4. **How much political CTV spend is lost to IVT/fraud/MFA specifically (vs. commercial CTV)?** The ~$1.1B/quarter figure is all-CTV; the political-specific leakage, and how much is reclassified as \"ops,\" is not isolated.\n5. **Do top political agencies still take a 15% commission on CTV, or has programmatic compressed it?** This is the load-bearing margin question; the buy-side view confirms ad-ops is paid on volume but does not disclose the modern political CTV commission rate.\n6. **Does the new Reed \"Linear+CTV Integration\" category produce a published case study with real allocation numbers?** That would be the first practitioner-audited media plan in the public record — worth tracking after the March 2026 awards.\n\n---\n\n## Sources\n\n1. The Current (The Trade Desk's trade outlet), \"Is CTV's political 'tipping point' finally here?\" (panel coverage; Greg Butcher/Alamo Intelligence \"fund CTV first… mass reach tool\"; Tyler Goldberg/Assembly Global \"lack of verified competitive data\"; Elisabeth Blossom/Sage Media Planning \"from the beginning, rather than an afterthought\"), pub. Mar 17, ed. Jun 18, 2026. https://www.thecurrent.com/political-streaming-ctv-political-tipping-point — Tier 5/6 (interested party — TTD-owned; quotes are named-practitioner position-evidence). Accessed 2026-06-23.\n2. Jamloop, \"Why Most Political Streaming TV Campaigns Waste Impressions and What Comes Next\" (broad-buy waste critique: serving already-voted voters, out-of-district waste, \"stops at impressions\"; ActiveVoter/attribution/impression-transparency products). https://jamloop.com/political-streaming-tv-ad/ — Tier 6 (political CTV vendor; position-evidence about prevailing buy-side practice, not an audit). Accessed 2026-06-23.\n3. Deep Sync, \"CTV Targeting: How Deterministic Data Powers Campaigns\" (deterministic vs. probabilistic tradeoff — deterministic more accurate/lower volume, probabilistic expands reach/adds uncertainty); Adwave, \"Voter Data Onboarding for CTV Political Ads (2026 Guide)\" (50–70% match rates for a clean voter file). https://deepsync.com/ctv-targeting/ ; https://adwave.com/resources/voter-data-onboarding-tv-audiences — Tier 6 (practitioner/vendor guides; capability and expectation claims, note lean). Accessed 2026-06-23.\n4. Industry frequency-capping and measurement analyses, 2024–2026: tvScientific, \"Solving the CTV Frequency Problem\"; consult.tv, \"Cross-Channel Frequency Capping Strategies\"; digitalelement.com on the programmatic CTV \"location gap.\" (8–15% of households exceed cap but absorb 42–60% of impressions; platforms withhold granular household frequency data; \"location gap\" = ads served without insight into where/to whom delivered.) https://www.tvscientific.com/insight/solving-the-ctv-frequency-problem ; https://www.consult.tv/cross-channel-frequency-capping-strategies-for-spring-campaigns/ — Tier 5/6 (ad-tech vendor analyses; quantified buy-side failure mode, note lean). Accessed 2026-06-23.\n5. Basis Technologies, \"2024 US Elections Digital Advertising Trends: CTV Drove Programmatic Ad Spending\" (video = 76% of political digital in 2024; 48% of digital budgets in final 30 days; ~32% reach lift vs. linear-only). https://basis.com/blog/2024-us-elections-digital-advertising-trends-ctv-drove-programmatic-ad-spending — Tier 5/6 (DSP/agency vendor; reach/efficiency claims, note lean). Accessed 2026-06-23.\n6. Adnan Mohamed (senior political strategist, TargetSmart; former Cox Media), \"Why Democrats Must Treat Streaming as the New Political Battleground,\" Campaigns & Elections (Voices), 2026 (Democrats \"lagged\"; \"still spend most of their budgets on linear TV\"; CTV targets \"geography, demographics and issue engagement\" vs. broadcast's \"blanket message\"; Mamdani $3.7M CTV in first 5 weeks vs. ~$228K opponents). https://campaignsandelections.com/voices/why-democrats-must-treat-streaming-as-the-new-political-battleground/ — Tier 6 (named-practitioner op-ed, explicitly pro-Democratic; position-evidence + the operator concession on the linear-first default). Accessed 2026-06-23.\n7. Adwave, \"CTV Advertising for Political Campaigns: Reaching Cord-Cutters\" and \"Congressional Campaign CTV Strategy (2026 Guide)\" (scaling move = identify geographies, over-index ZIPs, \"buy run of network CTV across a geo "Moneyball\"/\"half the media Trump ran\" attributed to the Trump op by a DSPolitical exec; Republicans-as-precision / Democrats-as-broadcast framing). https://www.dspolitical.com/press-releases/swing-votes-stream-report/ — Tier 6 (Democratic-aligned vendor; the origin of the contested scalpel-vs-broadcast claim; position-evidence only). Accessed 2026-06-23.\n12. Digiday, \"The cases for and against investing in CTV during the presidential election cycle\" (Mica Hansen/Locality \"puts a floor under CPMs… can't execute at your bottom dollar\"; Keith Norman/LG Ads on separation; Cameron Miille/Publica by IAS on brand-safety mitigation; Amazon/Netflix prohibit political; LG restricts home-screen issue/candidate ads; AdImpact ~$1.1B political CTV Jan 1–Sep 5 2024). https://digiday.com/media-buying/the-cases-for-and-against-investing-in-ctv-during-the-presidential-election-cycle/ — Tier 5 (trade reporting; named-practitioner buy/sell-side quotes). Accessed 2026-06-23.\n13. CTV supply-path and IVT measurement (Pixalate-sourced), 2024: MFA apps ~2% of CTV apps / ~1% of global CTV spend = ~$58M wasted (Q2 2024); 28% of \"complete\" SupplyChain-Object traffic sold by unauthorized \"direct\" sellers = ~$1.4B routed through unauthorized sellers (Q3 2024). Via humansecurity.com and trade syntheses. https://www.humansecurity.com/learn/topics/what-is-ctv-fraud/ — Tier 5/6 (security/ad-tech vendor measurement; note lean; corroborates the transparency-gap friction). Accessed 2026-06-23.\n14. AdExchanger / The Trade Desk and Basis on CTV reach-efficiency, 2024 (the ~36% \"more efficient than linear\" frequency-capping framing; reach-extension as the operator's real product). https://basis.com/news/ctv-and-programmatic-advertising-essential-for-2024-us-elections — Tier 5/6 (DSP/agency, interested party; reach-efficiency, not persuasion, claims). Accessed 2026-06-23.\n15. AdExchanger, \"This Election Season, Buyers Can Curate Deals Based On Voter Values\" (OpenX × Givsly values-based political curation launched Feb 23, 2026; Amanda Forrester/OpenX on identity-graph matching and supply constraints; Danielle Varvaro/Newsweek on curation reducing duplication; Newsweek excludes its healthcare CTV inventory; >half of OpenX publishers enabled political but many whitelist only trusted advertisers). https://www.adexchanger.com/programmatic/this-election-season-buyers-can-curate-deals-based-on-voter-values/ — Tier 5 (trade reporting; named practitioners on the curated-vs-addressable buy and publisher exclusions). Accessed 2026-06-23.\n16. Campaigns & Elections / The Reed Awards, 2026 categories (new category: \"Best Integration of Linear and CTV for a Campaign\"; awards announced Charleston, SC, Mar 11–12, 2026). https://reedawards.secure-platform.com/a/page/categories/all-categories ; https://thereedawards.com/ — Tier 5 (industry awards body; institutional signal that the buy-side unit of excellence is linear+CTV integration, not standalone addressable). Accessed 2026-06-23.\n\n---\n\n*A note on sources. This account deliberately leans on trade and practitioner material because the thing it documents — what operators actually do — lives in trade panels, practitioner guides, and named-buyer quotes, not in primary or scholarly records. Every vendor capability claim (DSPolitical's 90%+ match rate, the reach-efficiency figures, the Jamloop waste critique) should be read as position-evidence, not audited fact. The two load-bearing buy-side findings to hold most loosely are (a) the 50–70% clean-file match-rate ceiling vs. DSPolitical's 90%+, and (b) the directional claim that broad/geo CTV is the majority of political CTV spend — both firmly attested but neither precisely quantified in the public record.*"}, {"order": 12, "file": "12_Gap_Microtargeting_Harms_CounterTradition.md", "title": "The Harms Counter-Tradition: Why Voter-Level Targeting Worries Democratic Theorists Even If It Doesn't Move Votes", "summary": "", "body": "# 12 — The Harms Counter-Tradition: Why Voter-Level Targeting Worries Democratic Theorists Even If It Doesn't Move Votes\n\n## Bottom Line\n\n**This account so far has one large blind spot, and it is intellectual, not factual.** Two questions have been answered well — *does political CTV advertising move votes?* (on average, essentially no) and *is voter data regulated on streaming?* (barely). A third tradition, so far only gestured at, treats voter-level addressable targeting not as **ineffective-but-neutral** but as **actively corrosive to democracy** — and does so *even while conceding the persuasion effects are small.* What follows maps that counter-tradition as an intellectual position in its own right. Its anchor text is Zuiderveen Borgesius et al., *Online Political Microtargeting: Promises and Threats for Democracy* (Utrecht Law Review, 2018), which enumerates a clean taxonomy of harms: privacy invasion and chilling effects, manipulation, exclusion and redlining, fragmentation of the marketplace of ideas, accountability collapse, and a power shift to the well-financed [1].\n\n**The whole position turns on one sentence in that paper:** *\"Even if microtargeting were not effective, the mere collection of data would still be a privacy threat\"* [1]. That line resolves the contradiction these pages have so far left dangling. If persuasion is near zero, why object at all? The harms camp answers: **because most of the harms run through channels other than persuasion.** They run through (a) *surveillance* — the profiling is a harm before a single ad is served; (b) *mobilization and suppression asymmetry* — the easier, better-evidenced lever, where the only causal field estimate of digital voter-suppression's turnout effect is a **1.86% national decline, rising to a 17.3% decline among non-Whites in minority counties of battleground states** (Kim et al., *PNAS* 2026) [2]; (c) *accountability collapse* — \"dark ads\" seen only by their targets, contradictory messages to different voters, no shared record anyone can audit [1][3]; and (d) *a structural-economic harm* — the same ad-tech machine built to sell sneakers delivers precision propaganda, \"regardless of actor intent\" (Ghosh & Scott, *Digital Deceit*, New America 2018) [4].\n\n**The honest tension inside the counter-tradition matters as much as the tradition itself.** This is not a unified alarm. Daniel Kreiss — one of the field's leading empirical scholars of data-driven campaigning — is a partial *skeptic of the moral panic*: he argues persuasion is hard, that microtargeting's real work is *mobilizing and reinforcing existing partisans*, and that \"we have anxieties about micro-targeting because we have anxieties about democracy itself\" [5]. The Cambridge Analytica episode, the origin myth of the whole harms discourse, is now widely judged by quantitative social scientists to have been **oversold \"snake oil,\"** with \"basically nonexistent\" evidence of independent effect [6][7]. So the strongest version of the counter-tradition is *not* \"microtargeting hands elections to whoever buys the best data.\" It is narrower, harder to dismiss, and largely orthogonal to the persuasion debate: **addressability degrades the conditions democracy needs — a shared public record, an auditable campaign, a voter who is informed rather than profiled — and it does so whether or not any given ad changes a single mind.**\n\n**Why this belongs in an account of CTV specifically.** Everything the counter-tradition feared about Facebook in 2018 is now arriving on the television screen with *fewer* guardrails. The dark-ad problem is worse on CTV because there is no Ad Library equivalent — Mozilla graded Roku a **\"D\"** and the streaming category a \"Wild West\" for exactly the transparency failures this literature names [3][8]. The surveillance is deeper because automatic content recognition (ACR) watches what the household actually views, as the earlier chapter on the addressability stack laid out. And the accountability vacuum is structural, not incidental: there is no public-file regime on streaming, as the chapter on regulation and the streaming loophole established. The counter-tradition is, in effect, the normative argument that the \"streaming loophole\" is not a regulatory curiosity but a democratic hazard. **What follows supplies the missing intellectual frame. It does not overturn the earlier finding that the persuasion effects are near zero — it explains why a thoughtful critic can accept that finding in full and still consider voter-level addressable TV a problem worth regulating.**\n\n---\n\n## How to Read This Chapter\n\nThis is a **map of a position**, written to present the harms counter-tradition in the language its best advocates use, at full strength, *and* to surface its internal disagreements honestly — including the scholars within the camp who think the alarm is overstated. The aim here is not to argue that microtargeting is corrosive; it is to map the most serious version of that argument, because the earlier chapters cited only fragments of it (a single Vandewalker quote, the EFF as a data conduit, Mozilla as a data source rather than a critic).\n\nThe effectiveness skepticism established earlier — that the persuasion effects are near zero — is treated here as a **constraint the counter-tradition must satisfy**, not a refutation of it. The high-value move, developed in Section 4, is to show exactly *how* the harms camp answers the \"if effects are near zero, why care?\" challenge. Where the answer is strong (surveillance, suppression, accountability), this account says so. Where it is weak, or rests on the same overclaiming the effectiveness evidence punctures (mass persuasion, psychographic mind-control), it says that too.\n\n**Terms decoded once:**\n- **Microtargeting** — tailoring a political message to a narrow, data-defined slice of the electorate (sometimes down to the household or individual), as opposed to one mass message to everyone. On CTV this is the voter-file-to-device-graph match described in the chapter on the addressability stack.\n- **Dark ad / dark post** — a paid political message visible *only* to its targeted recipients, leaving no public trace for opponents, journalists, or regulators to see or rebut [1].\n- **Political / rhetorical redlining** — selectively *not* communicating with, or selectively communicating differently to, demographic groups — the political analogue of the discriminatory lending practice (Turow et al.'s coinage) [1].\n- **The marketplace of ideas** — the liberal-democratic premise that parties offer competing platforms in public, where voters and rivals can scrutinize them; fragmentation means each voter sees a different, private \"stall\" [1].\n- **Computational politics** — Tufekci's term for applying big-data modeling and behavioral science to political persuasion and mobilization at individual granularity [9].\n- **Demobilization / suppression targeting** — using ads not to win a voter but to discourage an *opponent's* likely voter from turning out at all [1][10].\n- **Surveillance harm** — the harm of being profiled and tracked, which exists at the moment of data collection, *before and independent of* any ad being effective [1].\n\n---\n\n## 1. The Anchor Text: Borgesius et al. and the Taxonomy of Threats\n\nThe harms position deserves one canonical statement, read directly. It is **Zuiderveen Borgesius, Möller, Kruikemeier, Ó Fathaigh, Irion, Dobber, Bodó & de Vreese, \"Online Political Microtargeting: Promises and Threats for Democracy,\"** *Utrecht Law Review* 14(1), 2018, pp. 82–96 — a peer-reviewed, multi-author law-and-communication paper that has become the field's standard reference [1]. Its method is deliberately even-handed. It lays out the *promises* of microtargeting (more diverse campaigns, niche issues getting a \"market stall,\" voters processing relevant information more efficiently) before turning to the *threats*. Reading it directly corrects the habit of citing the harms position only through advocacy fragments.\n\nThe paper sorts threats by who bears them — **citizens, political parties, and public opinion (the public sphere)** — and the structure itself is the argument.\n\n### 1.1 Threats to citizens: privacy, manipulation, exclusion\n\nThe paper names three. **Privacy invasion and chilling effects** come first, and are foundational: microtargeting \"involves gathering and combining personal data about people on a massive scale to infer sensitivities and political preferences,\" which can chill behavior — \"people who suspect that their behaviour is monitored may adapt their behaviour, trying to escape attention\" (the example: hesitating to \"visit websites about Islam\" if a far-right party looks likely to win) [1]. The paper grounds this in a real 2017 breach exposing personal data, including \"suspected religious affiliations, ethnicities and political biases,\" of nearly 200 million Americans held by a Republican-contracted firm [1].\n\n**Manipulation** is second. Quoting Gorton, the paper warns that microtargeting \"turns citizens into objects of manipulation and undermines the public sphere by thwarting public deliberation, aggravating political polarization, and facilitating the spread of misinformation,\" adding the chilling note that \"the targeted information does not even need to be true to maximise its impact\" [1]. Its worked example is the canonical illustration: a politician shows *Alice* (profiled as anti-immigration) an ad promising to curtail immigration, shows *Bob* (progressive) an ad promising to fight immigrant job-discrimination, shows the jobless an ad raising welfare, and shows the tax-sensitive an ad capping welfare — \"without technically lying, the politician could say something different to each individual\" [1].\n\n**Exclusion** is third, and the most under-appreciated. Campaigns can *ignore* certain groups — those \"not expected to vote,\" or \"unnecessary to win a particular local constituency\" — so \"certain groups may be underrepresented in a democracy\" [1]. This is the redlining harm: not what you say to people, but who you decide not to speak to at all.\n\n### 1.2 Threats to political parties: cost and the rise of intermediaries\n\nMicrotargeting \"can be expensive\" and \"gives more power to intermediaries\" [1]. The cost threat is a power threat: building voter records, buying data, and running minute-by-minute optimization \"can quickly exceed the resources of small and new parties,\" so — quoting Bennett — microtargeting \"may very well consolidate power in the larger, and more well-financed, parties and make it more difficult for smaller parties to be nationally competitive\" [1]. The intermediary threat is the rise of a \"new class\" of data vendors, strategists, and near-monopoly platforms with \"unprecedented power to set prices, and dictate the terms\" [1]. **This is the market-structure story told earlier, restated as a democratic harm.** The same firms that capture the spread along the CTV supply chain are, in this frame, the gatekeepers extracting rent from the democratic process.\n\n### 1.3 Threats to public opinion: the mandate problem and fragmentation\n\nThe deepest harm in the paper is to the public sphere. First, the **mandate problem**: microtargeting hides \"how important an issue is to the political parties themselves,\" so a voter may back a candidate on health care only to find, in coalition, that \"the health-care system moves in the opposite direction.\" Quoting Hillygus & Shields: \"Can politicians claim a policy mandate if citizens are voting on the basis of different policy promises?\" [1]. Second, **fragmentation of the marketplace of ideas**: mass campaigns are \"organised around a small number of issues\" the majority can see and debate, enabling \"deliberative processes,\" but \"if citizens lose interest in these overarching issues and focus on the issues that are more relevant to them, these public debates become less democratic and deliberative processes are cut short\" [1].\n\n### 1.4 The paper's own nuance — and the one sentence that resolves the central tension\n\nCrucially, Borgesius et al. *nuance their own alarm.* They argue the European threats \"should not be exaggerated\": stricter EU data-privacy rules slow microtargeting, multi-party systems make it \"less sensical\" than the two-party US, and \"even if people were exposed to manipulative microtargeting, people would still learn about more general political news from other sources\" [1]. That last clause is the harms camp conceding the effectiveness point: direct persuasion is bounded.\n\nAnd yet the paper's load-bearing sentence is this: **\"Even if microtargeting were not effective, the mere collection of data would still be a privacy threat\"** [1]. This is the hinge of the entire counter-tradition. It decouples the harm from the effect. Doc 04 establishes that the *persuasion* effect is near zero; Borgesius et al. reply that *persuasion was never where most of the harm lived.* Sections 3 and 4 develop that answer.\n\n---\n\n## 2. The Scholarly Critique Beyond the Anchor — Tufekci, Kreiss/McGregor, Ghosh/Scott\n\nThree further bodies of work fill in the position, each adding a distinct mechanism. Together with Borgesius they constitute the academic core of the counter-tradition.\n\n### 2.1 Tufekci: \"computational politics\" and the asymmetry of power\n\nZeynep Tufekci's \"Engineering the Public: Big Data, Surveillance and Computational Politics\" (*First Monday*, 2014) is the foundational framing piece [9]. Her argument is not that ads change minds. It is that big data plus behavioral science plus real-time experimentation \"increases the capacity of those with resources and access to carry out highly effective, opaque and unaccountable campaigns of persuasion and social engineering\" [9]. She names six dynamics: the rise of big data; the shift \"away from demographics to individualized targeting\"; \"the opacity and power of computational modeling\"; the use of \"persuasive behavioral science\"; \"dynamic real-time experimentation\"; and \"the growth of new power brokers who own the data\" [9]. The harm is *asymmetry and opacity* — a profiled public facing modelers it cannot see, audit, or answer. Tufekci's claim is about *capacity and power distribution*, not a proven vote-moving effect, and that is what lets it survive the persuasion null.\n\n### 2.2 Kreiss & McGregor: the harm is in the structure of campaigning — and the partial dissent\n\nDaniel Kreiss (UNC) and Shannon McGregor are the leading empirical scholars of US data-driven campaigning (Kreiss's *Prototype Politics*, Oxford 2016, is the standard history) [11]. Their work documents how platforms — Facebook, Google, Twitter — embed staff in campaigns and \"help to facilitate\" the profiling, finding, tracking, and messaging of individual voters through \"weakly regulated\" tools \"poorly understood by policymakers\" (Kreiss & McGregor 2019, 2017) [11]. Their normative concern is the *fusion of platform and campaign*, and the absence of the public scrutiny that broadcast once forced.\n\nBut Kreiss is also the counter-tradition's most important **internal skeptic**, and that dissent has to be carried honestly. In \"Micro-targeting, the quantified persuasion\" (*Internet Policy Review*, 2017), he argues that \"decades of work in political communication should give us pause,\" that \"it is really hard to change people's minds through campaigns,\" and that microtargeting is \"most effective in the short run when campaigns use them to mobilise identified supporters\" — \"reminding citizens of and shoring up their partisan and group identities\" [5]. His sharpest move is reflexive: \"we have anxieties about micro-targeting because we have anxieties about democracy itself,\" and the alarm reflects a \"third-person effect,\" where analysts \"assume publics are more manipulated than themselves\" [5]. **Kreiss is, in effect, the effectiveness skepticism applied to the harms discourse.** His presence inside the camp keeps the strongest version of the counter-tradition narrow: surveillance, mobilization, and accountability — not mass mind-control.\n\n### 2.3 Ghosh & Scott: the harm is the business model, \"regardless of actor intent\"\n\nDipayan Ghosh (then New America / Harvard Kennedy School, formerly a Facebook privacy and policy advisor) and Ben Scott wrote *Digital Deceit: The Technologies Behind Precision Propaganda on the Internet* (New America, 2018) [4]. Their argument is structural, and the most directly relevant to a study of ad tech: disinformation \"succeeds because it follows the structural logic, benefits from the products, and perfects the strategies of the broader digital advertising market.\" Platforms and propagandists share \"an implicit but extraordinarily powerful alignment\" — both maximize engagement — so precision propaganda is enabled \"regardless of actor intent.\" Ghosh's blunt line: \"The Russians did absolutely nothing that is beyond any digital marketing professional\" [4]. The harm, in this view, is not a rogue actor but the *machine itself*: the same behavioral-targeting stack described earlier for legitimate political CTV is, without modification, the delivery system for manipulation. Notably, Ghosh argues \"transparency alone won't solve this\" because it treats symptoms — a direct challenge to the transparency-centric reform menu (the Honest Ads Act) set out earlier.\n\n---\n\n## 3. The Journalistic and Advocacy Critique — Mozilla, EFF, the Markup, Brennan, Tactical Tech\n\nSeveral of these have appeared earlier only as *data conduits* (the EFF for inference fields, Mozilla as a data source). Read as *critiques*, they form the applied wing of the counter-tradition, and several are CTV-specific in a way the academic literature is not.\n\n### 3.1 Mozilla: streaming as a \"Wild West,\" graded\n\nMozilla's \"Paid Programming: Investigat
