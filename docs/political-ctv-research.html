ing streaming ads during election season\" (Becca Ricks, Sept. 22, 2020) is the single most CTV-specific harms document, and it is best read as a critique, not a data feed [3][8]. Its framing sentence is the counter-tradition in one line: online political ads \"can microtarget, manipulate, and misinform voters at a level unmatched by any other form of political speech,\" yet \"are subject to almost no regulation and oversight, especially in the domain of streaming platforms\" [3]. Mozilla *graded* six platforms on transparency and accountability. YouTube TV earned the high mark (a B+); the independent streamers fared worst — **Roku was graded \"D\"**, its then-new archive carrying \"barely any information,\" with \"no bulk access to data\" and unclear enforcement of its own rules [3][8]. This directly recasts the earlier treatment of the Roku archive, which noted that the archive exists and is \"among the most substantive voluntary transparency efforts on CTV.\" Mozilla's verdict is that \"substantive\" is grading on a curve where the whole class is failing.\n\n### 3.2 EFF: the privacy carve-out as a democratic, not just personal, harm\n\nThe Electronic Frontier Foundation's \"How Political Campaigns Use Your Data to Target You\" (April 2024) — cited earlier for the inference fields (\"Voter Fraud Belief,\" COVID-concern scores) — is, read as argument, a claim that political data's exemption from privacy law is a *structural* enabler of the harms above [12]. EFF's framing is that campaigns \"operate in a largely unregulated space compared to commercial advertisers,\" targeting voters \"without the consent mechanisms required elsewhere\" [12]. In the counter-tradition this is not a privacy footnote. It is the legal precondition for the surveillance harm Borgesius and Tufekci describe.\n\n### 3.3 The Markup, Global Witness, and the dark-ad accountability problem\n\nThe investigative-journalism wing has repeatedly demonstrated the *accountability-collapse* mechanism empirically. Global Witness found the Trump 2020 campaign \"targeted Facebook ads to small groups of people more than twice as often\" as the Biden campaign — a direct measure of how granular dark-targeting can get [13]. Across The Markup's and others' platform investigations, the recurring finding is that microtargeted political ads \"keep ideas from being debated in the open,\" and that \"political groups are still getting away with blatant falsehoods in microtargeted ads\" because the messages are seen only by their targets and so escape both rebuttal and fact-checking [10][13]. This is the operational proof of Borgesius's \"dark posts\" threat: the harm is not that the ad persuades, but that *no one outside the target set can see it to contest it.*\n\n### 3.4 Brennan Center beyond Vandewalker: suppression as the documented mechanism\n\nThe earlier chapter on regulation quotes the Brennan Center's Ian Vandewalker once, on the thinness of disclaimers. The richer Brennan text is Vandewalker's **\"Digital Disinformation and Vote Suppression\"** (Sept. 2, 2020), which supplies the counter-tradition's most concrete harm mechanism [10]. Its thesis: \"bad actors can use sophisticated microtargeting to surgically focus on certain demographics\" to *suppress* turnout — via \"deception (lying about the time, place, and manner of voting); calls for boycott; and voter intimidation\" — and these tactics \"frequently target historically disenfranchised communities, including communities of color, low-income communities, and immigrant communities\" [10]. It documents cases: 2010 Maryland robocalls telling African-American households the governor had already won (stay home); 2016 Internet Research Agency operatives targeting African-Americans \"with messages recommending election boycotts\"; 2017 Alabama texts with false polling-site changes to a majority-Black county [10]. **Suppression is the bridge between the effectiveness evidence and the harms camp** (Section 4), and Brennan's report is the evidence that the harms camp's worry is not hypothetical.\n\n### 3.5 Tactical Tech: Cambridge Analytica as outlier in *ethics*, not technique\n\nTactical Tech's \"Influence Industry\" project reframes the founding scandal. Its finding: Cambridge Analytica was \"an outlier in the sector, but not necessarily due to the tools and techniques they used\" — rather \"because of the way they navigated the ethical and legal boundaries\" — and \"most of the techniques Cambridge Analytica was selling are actually common throughout the political influence industry,\" an industry of \"over 250 companies\" trading data-driven political services with \"very little regulation\" [14]. This is the advocacy wing's most useful correction: the harm to worry about is not a single rogue firm but a *normalized, unregulated industry*, exactly the industry the chapters on the addressability stack and market structure map for CTV.\n\n---\n\n## 4. The Crux: How the Harms Camp Answers \"If Effects Are Near Zero, Why Care?\"\n\nThis is the section where the counter-tradition either earns its place or collapses back into the effectiveness skepticism. The challenge is precise: the earlier effectiveness evidence shows general-election *persuasion* averages ≈0 across formats (Kalla-Broockman; Coppock-Hill-Vavreck; Coppock-Green-Porter). If an addressable CTV ad cannot change a vote, how can addressable targeting harm democracy? The harms camp has four answers. Two are strong, one is partial, one is largely defeated by that same effectiveness evidence, and they deserve to be graded honestly.\n\n### 4.1 Answer 1 (strong): The harm precedes the ad — surveillance, not persuasion\n\nThe first answer is Borgesius's hinge sentence: **\"Even if microtargeting were not effective, the mere collection of data would still be a privacy threat\"** [1]. The profiling — combining the voter file (L2/i360/TargetSmart/Catalist) with ACR viewing data and commercial appends, as the addressability-stack chapter detailed, to infer religion, ethnicity, \"Voter Fraud Belief,\" and emotional state — is a harm at the moment of collection, regardless of whether any ad served against it moves a vote [1][12]. The FTC's own 2024 6(b) report independently corroborates the \"vast surveillance\" core. This answer is *fully orthogonal* to the effectiveness question: persuasion effectiveness is simply not the relevant variable. The chilling effect — citizens self-censoring because they suspect they are watched — is likewise an effect on *behavior before the ballot*, not on vote choice [1][9].\n\n### 4.2 Answer 2 (strongest, and empirically grounded): Mobilization and suppression, not persuasion\n\nThe decisive answer reframes the outcome. The earlier null result is about *persuasion* — changing whom a voter supports. But that same evidence concedes that **mobilization is a different, better-evidenced problem.** The harms camp's claim is that addressability's real lever is turnout asymmetry, and it cuts in two directions:\n\n- **Mobilization** of your own sporadic supporters — which the effectiveness evidence grants is \"plausibly useful,\" the use case addressability is genuinely built for. Kreiss agrees: microtargeting works \"to mobilise identified supporters,\" \"spurring volunteerism, donations, and ultimately turnout\" [5].\n- **Suppression / demobilization** of an opponent's likely voters — the inverse, and the one with measured harm. This is where a number can be put on it. **Kim, Dahlke, Song & Heinrich, \"Targeted digital voter suppression efforts likely decrease voter turnout\" (*PNAS*, 2026)** tracked ~13,500 participants' actual digital ad exposure for six weeks before the 2016 election and matched it to validated turnout via entropy balancing [2]. The result: exposure to voter-suppression ads was associated with a **1.86% decline in turnout nationally** (≈4.7 million fewer votes at the population level), and — critically — the effect concentrated on the targeted: a **17.3% turnout decline among non-Whites in minority-majority counties of battleground states** (Cohen's d ≈ −0.515), versus a small population-level effect (d ≈ 0.059) [2].\n\nThis is the core of the argument. **A persuasion effect of ≈0 and a suppression effect of −17.3% among a targeted subgroup are not in contradiction** — they answer different questions. Persuasion asks \"did the ad flip a supporter?\"; suppression asks \"did the ad keep an opponent's voter home?\" Demobilization is mechanically easier — you are nudging the already-ambivalent toward the couch, not the committed toward the other side — and addressability is precisely the tool for finding the right couch. Borgesius names the canonical 2016 example: the Trump campaign reportedly targeting African-Americans with the Clinton \"super-predators\" clip to \"suppress African-American votes\" via \"dark posts\" only the targeted could see [1]. Brennan documents the pattern across cycles [10]. **This is the single most important claim here: the harm runs through suppression and mobilization asymmetry, not persuasion, which is exactly why the persuasion null does not neutralize it.**\n\n> ⚠️ **Honest caveat on the Kim et al. number.** The PNAS estimate is observational (exposure was measured, not randomly assigned) and entropy-balancing reduces but cannot eliminate selection on unobservables — the same methodological objection leveled earlier at vendor \"lift\" studies cuts here too. The population-level effect is small (d ≈ 0.059); the dramatic figure is a *targeted-subgroup* effect. It is the best available causal-leaning estimate of digital suppression's turnout impact, and it is a single study. Treat it as strong-but-not-settled, and as evidence the *mechanism is real and measurable*, not as a precise universal coefficient.\n\n### 4.3 Answer 3 (strong, non-quantitative): Accountability collapse — the dark-ad and contradictory-message harm\n\nThe third answer abandons the persuasion frame entirely and locates the harm in *democratic procedure.* A dark ad that moves zero votes still (a) cannot be seen by opponents to rebut, (b) cannot be seen by journalists to fact-check, (c) cannot be seen by regulators to enforce against, and (d) lets a candidate \"say something different to each individual\" with no public record reconciling the contradictions [1][3][10]. The harm is to the *auditability of the campaign and the coherence of the mandate*, not to the vote tally. Borgesius's mandate problem (§1.3) and Mozilla's \"kept from being debated in the open\" (§3.1) are the same harm. This answer is wholly independent of the effectiveness question: a campaign can be perfectly non-persuasive and still be perfectly unaccountable. On CTV the harm is *worse* than on Facebook, because — as the chapter on the streaming loophole establishes — there is no Ad Library, no public file, and Mozilla's \"D\"-graded archives are the best on offer [3][8].\n\n### 4.4 Answer 4 (weak — largely defeated by the persuasion null): Mass psychographic mind-control\n\nThe fourth answer is the one the popular discourse leads with, and the one to *reject* as overclaiming: that microtargeting (especially psychographic, OCEAN-score targeting à la Cambridge Analytica) covertly *persuades the electorate at scale.* Here the effectiveness skepticism applies with full force, and here the counter-tradition's own best scholars dissent. The scholarly verdict on Cambridge Analytica is that it was \"snake oil\" oversold: quantitative social scientists (Eckles, Nyhan) and Kreiss judge psychographic targeting \"more 'snake oil' than science,\" *Nature* called the underlying science \"scant,\" and the evidence of CA's \"independent impact on voter behaviour is basically nonexistent\" — there is \"no evidence that psychographic targeting actually works at the scale of the American electorate\" [6][7][15]. **The position here should be explicit: the mass-persuasion version of the harm fails on the same evidence that establishes the persuasion null, and the harms camp's credible members do not rely on it.** Keeping Answer 4 visible — and rejecting it — is what distinguishes a rigorous map of the counter-tradition from an amplification of its weakest claims.\n\n### 4.5 The synthesis: a defensible harms position that survives the persuasion null\n\nPutting the four answers together yields the strongest version of the counter-tradition, and it is narrow enough to be true:\n\n> *Voter-level addressable targeting harms democracy primarily through channels other than persuasion. It (1) inflicts a surveillance harm at the moment of profiling, independent of any ad's effect; (2) enables turnout asymmetry — mobilizing your base and, more troublingly, suppressing an opponent's, where the only causal-leaning field estimate finds a measurable, demographically concentrated effect; and (3) collapses the accountability infrastructure — dark ads, contradictory messages, no auditable public record — degrading the conditions for deliberation and mandate. It does NOT reliably persuade the electorate at scale; that claim fails on the same evidence that establishes the persuasion null, and the counter-tradition's best scholars concede it.*\n\nThis is the frame the chapter on regulation reached toward (\"the microtargeting-accountability problem, moved onto the television screen\") but never built. It is fully compatible with the persuasion null. And it explains why a sophisticated observer can hold both \"campaign ads barely move votes\" and \"we should regulate voter-level addressable TV\" without contradiction.\n\n---\n\n## 5. The Inverse of the Effectiveness Frame — Stated Plainly\n\nThe effectiveness frame's organizing claim is: *effects are near zero, so the effectiveness hype is overblown.* The counter-tradition's organizing claim is the **inverse**: *the harm was never mainly about effectiveness, so proving ads don't persuade does not make addressability harmless.* The two are not opponents. They are complementary halves of a complete picture, and so far only one half has been told.\n\n| Effectiveness frame (skepticism) | Counter-tradition frame (harms) |\n| --- | --- |\n| Outcome of interest: **persuasion** (vote choice) | Outcomes of interest: **surveillance, turnout asymmetry, accountability** |\n| Verdict: effect ≈ 0 in general elections | Verdict: harm is real *through non-persuasion channels* |\n| Implication: vendor hype overstates impact | Implication: low persuasion does **not** imply low harm |\n| Strongest evidence: RCT meta-analyses (Kalla-Broockman) | Strongest evidence: surveillance is definitional; suppression measured at −1.86%/−17.3% (Kim 2026); dark-ad opacity is structural [1][2] |\n| What it gets right | What it gets right |\n| Mass-persuasion fears (incl. Cambridge Analytica) are overblown | The harm survives even granting the persuasion null |\n| What it can miss | What it can miss |\n| Mistaking \"doesn't persuade\" for \"doesn't matter\" | Sliding back into the defeated mass-persuasion claim (Answer 4) |\n\nThe honest meeting point: **both frames agree microtargeting is a poor mass-persuasion tool and a potent mobilization/suppression/surveillance tool.** The effectiveness evidence emphasizes the first; the counter-tradition emphasizes the second. A reader holding both understands the topic. A reader holding only one is half-informed.\n\n---\n\n## 6. Why CTV Sharpens Every Harm in This Tradition\n\nThe counter-tradition was built on Facebook (2014–2020). Its move to the television screen is not a softening but an intensification, and the earlier chapters supply the reasons:\n\n1. **Deeper surveillance.** ACR watches what the *household actually views* — a richer behavioral signal than browsing, fused to the voter file. Tufekci's \"individualized targeting\" and Borgesius's \"inferred sensitivities\" reach their fullest form when the TV itself is the sensor [1][9].\n2. **Worse accountability.** There is no CTV Ad Library. Mozilla's \"D\"-graded Roku archive is the *best* available, and no public-file regime reaches streaming. The dark-ad harm (§4.3) is therefore structurally worse on CTV than on a Facebook that at least built an imperfect public archive [3][8].\n3. **The same machine, fewer guardrails.** Ghosh & Scott's \"regardless of actor intent\" structural argument applies with extra force: the CTV ad-tech stack is the commercial machine, repurposed, and the FCC's broadcast guardrails do not reach it [4].\n4. **Donor-fueled volume.** Much \"political CTV\" is fundraising and base activation. The harms camp adds that donor-fueled volume is precisely what funds the suppression and dark-ad capacity at scale, concentrating it in the best-financed campaigns — Borgesius's \"power shift to the well-financed\" [1].\n\nThe net normative claim — the one this chapter contributes — is that **the \"streaming loophole\" is not merely a regulatory gap but a democratic hazard, because it removes the auditability that the harms tradition identifies as democracy's actual protection against addressable targeting.** Not because the ads persuade. Because no one can see them.\n\n---\n\n## Open Questions\n\n1. **Is the Kim et al. (2026) suppression effect replicable and causal?** It is one observational study with entropy balancing, on 2016 data. A pre-registered design, replication on a later cycle, or a CTV-specific version would either cement or undercut the strongest empirical bridge between the persuasion null and the harms camp. The absence of replication is itself a finding.\n2. **Has any harms-tradition empirical work been done on CTV specifically, rather than on Facebook?** Nearly the entire literature (Borgesius, Tufekci, Kreiss, the Markup, Global Witness) predates and centers social platforms. The CTV-specific surveillance-and-suppression argument is currently *inference by analogy* from the Facebook literature plus the ACR plumbing — defensible but not directly demonstrated.\n3. **Does ACR-fused profiling materially increase the suppression risk, or just the surveillance harm?** The surveillance harm is definitional; whether richer viewing data makes *demobilization* more effective is untested.\n4. **Where exactly does the camp's internal line fall?** Kreiss's skepticism and the Cambridge Analytica \"snake oil\" verdict show the camp polices its own overclaiming. A sharper map of which scholars endorse Answer 2 (suppression) vs. only Answers 1/3 (surveillance/accountability) would refine the position.\n5. **Does Ghosh & Scott's \"transparency won't fix it\" critique defeat the Honest Ads Act reform path?** If the harm is structural-economic, disclosure regimes — the main fix on offer — may be necessary but insufficient, a direct, unresolved tension with the reform analysis set out earlier.\n6. **What is the non-US picture?** Borgesius et al. argue Europe's stricter data law and multi-party systems blunt the threat. This account is US-centric by design; whether GDPR-style rules would meaningfully reduce CTV harms is a live comparative question, gestured at but not pursued here.\n\n---\n\n## Sources\n\n1. Zuiderveen Borgesius, Frederik J., Judith Möller, Sanne Kruikemeier, Ronan Ó Fathaigh, Kristina Irion, Tom Dobber, Balázs Bodó, & Claes de Vreese. \"Online Political Microtargeting: Promises and Threats for Democracy.\" *Utrecht Law Review* 14(1), 2018, pp. 82–96. https://utrechtlawreview.org/articles/10.18352/ulr.420 (full text read directly via the published PDF). — Tier 2 (peer-reviewed law/communication). **The anchor primary text** for the harms taxonomy; all quoted threat language (privacy/chilling, manipulation, exclusion, fragmentation, mandate, intermediary power, \"even if microtargeting were not effective…\") verified against the original. Accessed 2026-06-23.\n2. Kim, Young Mie, Ross Dahlke, Hyebin Song, & Richard Heinrich. \"Targeted digital voter suppression efforts likely decrease voter turnout.\" *Proceedings of the National Academy of Sciences (PNAS)*, 2026. https://pmc.ncbi.nlm.nih.gov/articles/PMC12867748/ — Tier 1–2 (flagship peer-reviewed). 1.86% national turnout decline associated with suppression-ad exposure; 17.3% decline among non-Whites in minority counties of battleground states (Cohen's d ≈ −0.515); ~13,500 participants, EScope ad tracking, entropy-balanced. **Observational; single study; treat the specific coefficients as strong-but-not-settled.** Accessed 2026-06-23.\n3. Ricks, Becca / Mozilla Foundation. \"Paid Programming: Investigating streaming ads during election season\" / \"New Research: Streaming Platforms are a Wild West of Political Ads.\" Sept. 22, 2020. https://www.mozillafoundation.org/en/blog/new-research-streaming-platforms-are-wild-west-political-ads/ — Tier 5/6 (advocacy research; privacy lean). Platform transparency grades (YouTube TV B+, Roku \"D\"); \"microtarget, manipulate, and misinform … at a level unmatched by any other form of political speech.\" **CTV-specific critique, not just a data conduit.** Accessed 2026-06-23.\n4. Ghosh, Dipayan, & Ben Scott. *Digital Deceit: The Technologies Behind Precision Propaganda on the Internet.* New America, Jan. 2018. Summarized via National Endowment for Democracy Forum Q&A with Ghosh, https://www.ned.org/forum-qa-dipayan-ghosh-on-the-commercial-drivers-of-precision-propaganda/ — Tier 5/6 (think-tank report + interview; note the report is the primary, the Q&A the access point). \"Implicit but extraordinarily powerful alignment\" between platforms and propagandists; \"regardless of actor intent\"; \"The Russians did absolutely nothing beyond any digital marketing professional.\" Accessed 2026-06-23.\n5. Kreiss, Daniel. \"Micro-targeting, the quantified persuasion.\" *Internet Policy Review* 6(4), Dec. 31, 2017. DOI 10.14763/2017.4.774. https://policyreview.info/articles/analysis/micro-targeting-quantified-persuasion — Tier 2 (peer-reviewed). The camp's key *internal skeptic*: persuasion is hard; microtargeting \"most effective … to mobilise identified supporters\"; \"we have anxieties about micro-targeting because we have anxieties about democracy itself\"; \"third-person effect.\" Accessed 2026-06-23.\n6. NBC News. \"Cambridge Analytica's effectiveness called into question despite alleged Facebook data harvesting.\" 2018. https://www.nbcnews.com/politics/politics-news/cambridge-analytica-s-effectiveness-called-question-despite-alleged-facebook-data-n858256 — Tier 4 (major outlet). Quantitative social scientists (Eckles, Nyhan) and Kreiss judge psychometric targeting \"more 'snake oil' than science\"; operatives call 2016 claims \"very much overstated.\" Accessed 2026-06-23.\n7. *Nature.* \"The scant science behind Cambridge Analytica's controversial marketing techniques.\" March 2018. https://www.nature.com/articles/d41586-018-03880-4 — Tier 2 (authoritative science journalism). Little empirical evidence the psychographic tools work; effectiveness \"called into question.\" Accessed 2026-06-23.\n8. Mozilla Foundation (Digital Trends / MediaPost coverage). \"Streaming services are the 'Wild West' for political ads, report finds.\" Sept. 2020. https://www.digitaltrends.com/home-theater/hulu-roku-sling-tubi-cbs-all-access-youtube-tv-political-ads-streaming-services/ — Tier 4/5 (trade/general coverage of the Mozilla report). Corroborates the platform-grade findings and Roku archive limitations. Accessed 2026-06-23.\n9. Tufekci, Zeynep. \"Engineering the Public: Big Data, Surveillance and Computational Politics.\" *First Monday* 19(7), July 2014. https://firstmonday.org/ojs/index.php/fm/article/view/4901 — Tier 2 (peer-reviewed). Six dynamics of computational politics; harm framed as opaque, unaccountable power asymmetry, not proven persuasion. Accessed 2026-06-23.\n10. Vandewalker, Ian / Brennan Center for Justice. \"Digital Disinformation and Vote Suppression.\" Sept. 2, 2020. https://www.brennancenter.org/our-work/research-reports/digital-disinformation-and-vote-suppression — Tier 5 (think tank; center-left, pro-disclosure lean). Suppression typology (deception on time/place/manner; boycott; intimidation); targeting of communities of color; documented cases (2010 MD robocalls, 2016 IRA, 2017 AL texts). **The richer Brennan source, beyond the single Vandewalker quote cited earlier.** Accessed 2026-06-23.\n11. Kreiss, Daniel, & Shannon McGregor. *Prototype Politics: Technology-Intensive Campaigning and the Data of Democracy* (Oxford UP, 2016); Kreiss & McGregor, \"Technology Firms Shape Political Communication\" (2017/2019, on platform embedding in campaigns). — Tier 2 (university-press monograph + peer-reviewed). The standard empirical history of US data-driven campaigning; platform-campaign fusion as the normative concern. Cited as a body of work rather than at the page level. Accessed 2026-06-23.\n12. Electronic Frontier Foundation. \"How Political Campaigns Use Your Data to Target You.\" April 2024. https://www.eff.org/deeplinks/2024/04/how-political-campaigns-use-your-data-target-you — Tier 5/6 (civil-liberties/privacy advocacy; note lean). The privacy carve-out as structural enabler; inference fields (\"Voter Fraud Belief\"). Read here as critique, not only as a data source. Accessed 2026-06-23.\n13. Global Witness. \"Who micro-targeted political ads more — the Trump or Biden campaign?\" 2020/2021. https://globalwitness.org/en/campaigns/digital-threats/who-micro-targeted-political-ads-more-the-trump-or-biden-campaign/ — Tier 5/6 (advocacy investigation). Trump 2020 targeted small groups \"more than twice as often\" as Biden — empirical measure of dark-targeting granularity. Accessed 2026-06-23.\n14. Tactical Tech. \"The Influence Industry: The Global Business of Using Your Data in Elections\" (Our Data Our Selves project). https://ourdataourselves.tacticaltech.org/posts/influence-industry/ — Tier 5/6 (advocacy/research collective). Cambridge Analytica as outlier in *ethics*, not technique; \"over 250 companies\" in a lightly regulated political-data industry. Accessed 2026-06-23.\n15. Stanford Graduate School of Business. \"The Science Behind Cambridge Analytica: Does Psychological Profiling Work?\" and The Conversation, \"Cambridge Analytica's 'secret' psychographic tool is a ghost from the past.\" 2018. https://www.gsb.stanford.edu/insights/science-behind-cambridge-analytica-does-psychological-profiling-work — Tier 4/5 (institutional/analytical). Reinforces the \"scant evidence / oversold\" verdict on psychographic targeting — the basis for rejecting Answer 4. Accessed 2026-06-23."}, {"order": 13, "file": "13_Gap_Measurement_Currency_War.md", "title": "The Measurement-Currency War: Two Scoreboards That Never Reconcile", "summary": "", "body": "# 13 — The Measurement-Currency War: Two Scoreboards That Never Reconcile\n\n## Bottom Line\n\nThe corpus names the measurement contenders in a single clause — \"Nielsen vs. the certified challengers Comscore, iSpot, and VideoAmp\" (doc 03, §4.1) — and moves on as if the contest were settled. It is not. A live, consequential war is on over which currency U.S. television is transacted and graded against, and it bears on political CTV in three ways the corpus never adjudicates. **First**, the currency a buy *transacts* on decides whose definition of \"reach\" and \"frequency\" the vendor claims in docs 03 and 04 are even denominated in — and as of the 2025–26 season at least four definitions compete (Nielsen's Big Data + Panel, Comscore, iSpot, VideoAmp), none agreed, each measuring a slightly different universe. **Second**, Nielsen's own decade of trouble — a 19-month Media Rating Council (MRC) accreditation suspension (Sept 2021–April 2023), the loss of a *local* accreditation it has not regained, a $16 billion private-equity take-private that closed October 2022, and the slow, repeatedly delayed rollout of \"Nielsen ONE\" / Big Data + Panel — means the corpus's casual \"Nielsen 210 DMA\" anchor describes an incumbent whose grip loosened during the very cycles the corpus covers. **Third, and most important for politics:** the measurement used to *sell* political CTV (commercial currencies and vendor case studies, all impression- and reach-denominated) and the measurement scholars use to *evaluate* whether political TV advertising actually works (Kantar/CMAG **airings** data, accessed through the academic Wesleyan Media Project) are two systems built on two primitives — the *impression* versus the *airing* — that never touch. The single best public estimate of TV advertising's vote effect (Sides, Vavreck & Warshaw, *American Political Science Review*, 2022) rests entirely on counted **airings**, not on any commercial reach currency, and finds effects so small at the top of the ticket (~0.02 points of vote share per 100-airing advantage in presidential races) that no commercial reach metric could ever surface them. That is the structural reason the reach numbers that sell political CTV and the effect numbers academics publish can both be honest and still never reconcile: they are scored on incommensurable scoreboards. The corpus's doc-04 \"category error\" — treating reach as effect — is the symptom. The two-scoreboard problem mapped here is the disease.\n\n---\n\n## Key Claims\n\n> **Claim 13.1 (established, load-bearing):** As of the 2025–26 broadcast season the U.S. TV measurement market has no single agreed currency: Nielsen's reaccredited \"Big Data + Panel\" competes against three JIC-certified challengers (Comscore, iSpot, VideoAmp), each measuring a slightly different universe — so the \"reach\" and \"frequency\" that vendor political-CTV claims are denominated in depend on which currency the buy transacted on.\n\nDoc 03 already establishes that \"no single currency or spend number is canonical, so every firm in this layer sells a subscription, and the *disagreement itself* is the business model\" (doc 03, §4.2). What the corpus never does is map the contest. The state of play through mid-2026:\n\n- **Nielsen** lost MRC accreditation for its national TV service in September 2021 after it was found to have *under*counted viewing during the pandemic, regained national accreditation in April 2023 after a 19-month suspension, secured MRC accreditation for its new **Big Data + Panel** national methodology in January 2025, and declared Big Data + Panel its **sole** currency for the 2025–26 season [1][2][3][4].\n- The **Joint Industry Committee (JIC)** — a buyer/seller consortium described below — certified **Comscore** and **VideoAmp** as transactable national TV currencies in 2024 (a two-year term covering 2024–2025), with **iSpot** receiving full JIC currency certification in August 2024, and re-affirmed all three in a mid-term audit announced July 15, 2025 ahead of the 2025–26 season [5][6][7].\n- These currencies do **not** produce the same number for the same audience. They differ in panel-vs-big-data weighting, in how they handle co-viewing, out-of-home, and streaming, and in which demographic and \"advanced audience\" cuts they are *certified to transact on*. The 2025 JIC audit specifically noted that Comscore met the JIC's \"transactability requirement for personified demographics for the first time,\" joining iSpot and VideoAmp — meaning before mid-2025 the three challengers were *not* uniformly transactable across the same audience definitions [5].\n\n**The political so-what:** when a vendor says a CTV buy \"reached\" a voter universe (doc 03's TTD \"36% more efficiently,\" doc 04's FlexPoint \"23% incremental reach\"), that reach is denominated in *some* measurement system. Transact on Comscore and the denominator is Comscore's big-data device-tuning universe; on Nielsen, the panel-anchored universe; on VideoAmp or iSpot, theirs. These are not interchangeable. The corpus treats \"reach\" as a single, comparable quantity. It is not. It is a currency-specific figure, and the currency is contested.\n\n> **Claim 13.2 (established, load-bearing):** The JIC was created in 2023 (not 2022) by OpenAP and the Video Advertising Bureau together with national broadcasters as a direct response to Nielsen's accreditation crisis; it certifies *transactability* (is this product usable as a trading currency?), which is a deliberately faster, lower bar than MRC *accreditation* (does the methodology do what it claims?).\n\nThe JIC was formed in 2023. OpenAP and the TV trade group the Video Advertising Bureau (VAB) teamed with broadcasters Fox, NBCUniversal, Paramount, TelevisaUnivision and Warner Bros. Discovery, with streaming platform Roku and major agency holding companies (Dentsu, GroupM, Horizon, IPG Mediabrands, Omnicom Media Group, Publicis Media, RPA) in its operating group [8][9]. It published certification criteria in March 2023 and granted conditional certifications beginning September 2023 [9][10]. That dates the JIC's birth one year *later* than a casual reading of doc 03 might imply; the \"2022\" date in the corpus's Nielsen note refers to the take-private (Claim 13.5), not the JIC.\n\nThe JIC and the MRC are different instruments, and the difference is load-bearing. Per a joint JIC/MRC statement (March 27, 2024) and trade reporting: the **MRC** runs \"intensive audits of measurement *methodology*\" to verify a vendor delivers what it promises — a process that \"literally takes years\" (Comscore needed roughly three years to earn its March 2024 accreditation) and can be revoked. The **JIC** establishes \"a baseline consensus\" on whether a product is *transactable* for real-world trading, a quicker and more adaptable bar [10][11]. The JIC's stated goal is for vendors to hold *both*, and vendors seeking JIC certification must be \"in active audit with the MRC\" if not yet accredited [11]. The hierarchy, in both bodies' own framing: **MRC accreditation is the more rigorous credential; JIC certification is the faster, transaction-enabling one** [11].\n\n> **Claim 13.3 (established, load-bearing):** The three challengers are NOT equivalently credentialed: Comscore is the only firm MRC-accredited for *both* national and local big-data TV measurement (all 210 markets); Nielsen lost its local accreditation in 2021 and had not regained it; iSpot holds MRC accreditation only for ad-occurrence data (not audience), and VideoAmp holds JIC certification but no MRC accreditation — a credential gap that matters acutely for the down-ballot, local races where political CTV concentrates.\n\nThe accreditation picture, firm by firm, as of mid-2026:\n\n- **Comscore** earned MRC accreditation in **March 2024** for total-household and average-audience metrics in *both* national and local TV, making it \"the only measurement company accredited for its local TV measurement\" and the first provider accredited in all 210 local markets via big-data device-tuning measurement; an April 2025 accreditation extended this to \"households with\" demographic (age/gender) metrics [12][13].\n- **Nielsen** regained *national* accreditation in April 2023 but the reinstatement explicitly \"does not pertain to Nielsen's Local Market Television Service,\" which had also been suspended — so Nielsen, the incumbent the corpus anchors on, was operating *without* local MRC accreditation through the window the corpus covers [2][3].\n- **iSpot** holds MRC accreditation for **TV ad-occurrence data** (verifying that a spot aired) but **not** for audience measurement; it earned full JIC currency certification in August 2024 [6][7].\n- **VideoAmp** holds JIC certification but, as of the 2025 mid-term audit, did **not** yet hold MRC accreditation [7].\n\n**Why this matters for politics specifically:** the corpus establishes that political CTV's center of gravity is *local and down-ballot* — Madhive serving \"billions of local CTV impressions across all 210 DMAs,\" the Comscore × Yahoo DSP product working \"at the local market (DMA)/district level… for down-ballot races\" (doc 02; doc 03) [14]. The only firm with *MRC-accredited local* measurement is Comscore — also the firm whose predictive political audiences the corpus already documents as the dominant political-targeting layer (doc 02, doc 03). The strongest measurement credential in local TV and the dominant political-targeting data product sit inside the *same vendor*. The corpus's market map (doc 03) never surfaces that concentration: in the local, down-ballot heart of political TV, Comscore is at once the audience-data seller and the most-credentialed scorekeeper.\n\n> **Claim 13.4 (established, load-bearing):** The single most consequential fact for political effectiveness — Nielsen lost the local-market accreditation that underwrites the \"210 DMA\" framing the corpus uses as a historical anchor — means the corpus's casual reliance on \"Nielsen's 210 DMAs\" describes a measurement regime that was contested and partly de-accredited during the very cycles (2022, 2024) it covers.\n\nThe \"210 DMAs\" (designated market areas) the corpus repeatedly invokes — in doc 02's Yahoo/Comscore example, doc 03's market map — are *Nielsen's* market definitions; \"DMA\" is a Nielsen trademark for a local TV market. The corpus treats \"210 DMAs\" as a neutral geographic primitive. But Nielsen's *measurement* of those 210 markets lost MRC accreditation in 2021 and, per the April 2023 reinstatement language, that local de-accreditation was *not* reversed [2][3]. So during the 2022 midterms and the 2024 presidential cycle, the local-market viewing numbers underlying political TV planning were either (a) Nielsen's, but unaccredited at the local level, or (b) Comscore's, the *only* MRC-accredited local measurement after March 2024 [12]. The geographic frame survives; the incumbent's *authority over* that frame did not. Anchor on \"Nielsen 210 DMA\" without this caveat and you overstate the stability of the measurement substrate beneath political TV.\n\n> **Claim 13.5 (established, standard):** Nielsen was taken private in a ~$16 billion all-cash deal by an Evergreen (Elliott Investment Management affiliate) and Brookfield-led consortium, announced March 29, 2022 and closed October 11, 2022 — a private-equity ownership change that coincided with, and arguably intensified, the pressure to modernize measurement under the Nielsen ONE / Big Data + Panel program.\n\nNielsen Holdings agreed on **March 29, 2022** to be acquired for **$28 per share, ~$16 billion including assumed debt**, by a consortium led by **Evergreen Coast Capital (an affiliate of Elliott Investment Management)** and **Brookfield Business Partners**; shareholders approved September 1, 2022; the deal closed **October 11, 2022** [15][16]. The corpus's memory of a \"2022 private-equity take-private\" is correct as to year and fact. What it never draws out is the consequence: the take-private removed quarterly public-market scrutiny at the exact moment Nielsen was under MRC suspension and racing to ship a big-data-blended currency. \"Nielsen ONE,\" the cross-platform single-metric ambition, has slipped again and again; what actually shipped is **Big Data + Panel**, originally slated for September 2024, adopted by many broadcasters for the 2024 and 2025 upfronts, and MRC-accredited in January 2025 [4][17]. The incumbent the corpus treats as a fixed historical anchor was, throughout the corpus's window, a privately-held firm in the middle of a contested technology transition.\n\n> **Claim 13.6 (established, load-bearing):** Independent academic estimates of TV political-ad *effects* are built on Kantar/CMAG **airings** data — the count of when and where each spot aired across all 210 markets — accessed through the Wesleyan Media Project, and NOT on any commercial reach/audience currency; the airing and the impression are different primitives, so the \"measurement\" that sells political CTV and the \"measurement\" that evaluates it never share a denominator.\n\nThis is the heart of the gap. Two entirely separate measurement traditions exist, and the corpus collapses them into one undifferentiated word, \"measurement\":\n\n- **The commercial-currency tradition** (docs 03, 04) measures **impressions and reach**: did a household's device render the ad, how many unique households were touched, what was the frequency. Its primitives are the *impression* and the *audience*. Its instruments are Nielsen, Comscore, iSpot, VideoAmp, plus device-level ACR and onboarded exposure logs. This is what political CTV is *transacted* on and what vendor case studies report.\n- **The academic-effects tradition** measures **airings**: the count, timing, market, station, and program of every political spot that aired, plus a coded transcript/video of each unique creative. Its primitive is the *airing* (a spot that ran), not the impression (a spot that was seen). Its instrument is **Kantar/CMAG (Campaign Media Analysis Group, now Vivvix/CMAG)** \"Ad Detectors\" deployed in each of the 210 U.S. markets, distributed to scholars through the **Wesleyan Media Project** (Erika Franklin Fowler of Wesleyan, Michael Franz of Bowdoin, Travis Ridout of Washington State) [18][19].\n\nThe two systems are not just different vendors — they count different things. An *airing* is a supply-side fact: a station ran the spot at 7:42 p.m. during the local news. CMAG validates it against stations' own \"buy sheets\" and finds the airing count \"highly reliable\" [18][19]. An *impression/reach* figure is a demand-side, audience-rendered fact, and which households it credits depends on the contested currency of Claim 13.1. **No commercial currency reports airings; no academic effects study transacts on impressions.** They share neither a primitive nor a denominator. That is why doc 04's effectiveness chapter has to reach for digital-video field experiments (Coppock-Green-Porter, Broockman-Green) for its \"academic null\": the *television* effects literature lives in the airings tradition, a measurement system the corpus's commercial-side documents never touch.\n\n> **Claim 13.7 (established, load-bearing):** The best public estimate of TV advertising's vote effect — Sides, Vavreck & Warshaw (APSR, 2022) — uses county-matched CMAG airings counts across 2000–2018 and finds a 100-airing partisan advantage moves presidential vote share by roughly 0.02 points but down-ballot races by an order of magnitude more (≈0.04–0.09 points for Senate/House/governor, ≈0.19–0.35 for low-salience state races) — effects so small at the top of the ticket that no commercial reach currency could ever detect them, which is precisely why the two scoreboards never reconcile.\n\nJohn Sides, Lynn Vavreck and Christopher Warshaw, \"The Effect of Television Advertising in United States Elections,\" *American Political Science Review* (published online November 2021; 2022 issue), pooled Wesleyan/Wisconsin **airings** data with county-level returns across 2000–2018. Headline: a 100-airing net advantage in *favor* of one party is associated with roughly **0.02 percentage points** of additional vote share in **presidential** races but substantially larger effects down-ballot — on the order of **0.04–0.09 points** in Senate, House and gubernatorial races and **0.19–0.35 points** in low-salience state races (e.g., attorney general, treasurer), up to ~19× the presidential effect [20]. The paper's own framing: \"Television advertising matters up and down the ballot, but it has much larger effects in down-ballot elections than in presidential elections\" [20].\n\nThis single result is the keystone of the non-reconciliation, and it sharpens doc 04 in three ways:\n\n1. **It corroborates doc 04's skeptic lean using the *right* measurement tradition.** Doc 04 had to borrow digital-video experiments for its null. The airings literature reaches the same place for *television itself*: near-zero at the top of the ticket. The corpus's central corrective — \"stop letting a reach number masquerade as a vote number\" — now rests on the airings tradition, not only on adjacent digital studies.\n2. **It explains *why* the scoreboards can't reconcile.** A ~0.02-point presidential effect is roughly 1/5000th of vote share per 100 airings. Commercial reach currencies are not built to detect such effects, and vendors are not paid to report them. The currencies measure whether the impression landed; the airings studies measure whether landed impressions, summed over a market, nudged returns. A reach currency could be perfectly accurate and still tell you nothing about a 0.02-point effect.\n3. **It relocates the strongest case for political CTV to exactly where doc 04 already put it — down-ballot.** The airings literature's largest effects fall in low-salience down-ballot races; doc 04's most defensible CTV use case is \"mobilization and down-ballot informing.\" The airings evidence and the corpus's own effectiveness verdict point at the same place. The corpus should say so — and note that the *down-ballot* races where TV advertising plausibly moves the most votes are also the *local-DMA* races where the commercial currencies are least settled (Claim 13.3) and least independently validated.\n\n> **Claim 13.8 (established, load-bearing):** Political campaigns do not, in practice, \"transact on\" a single ratings currency for CTV the way national brand advertisers do — they transact on *delivered impressions and modeled reach/frequency* inside DSPs (The Trade Desk, Madhive, Yahoo DSP, DSPolitical), graded against voter-file-matched outcome proxies, with the commercial *currencies* used mainly as a third-party reach overlay — which means the currency war's resolution matters *less* to a House-race buyer than to a network upfront, but the unaccredited, vendor-graded nature of what they DO transact on matters *more*.\n\nThe corpus's market map (doc 03) and stack document (doc 02) make clear that political CTV buying happens *programmatically* — a campaign or agency buys delivered impressions through a DSP against a voter-file-matched audience, and measures against \"full-funnel performance indicators, such as website visits, email signups, and donations,\" not against a Nielsen rating point [14]. \"Reach is a key currency for political advertising campaigns\" in the looser sense of *de-duplicated delivered reach*, typically reported by the DSP or a measurement overlay (Comscore Campaign Ratings, iSpot, TVSquared/AdImpact) rather than transacted as a Nielsen-style guaranteed rating [14][21]. Three consequences the corpus should carry:\n\n- **The national-upfront currency war (Nielsen vs. JIC trio) is partly orthogonal to the political CTV buyer.** A Senate campaign buying programmatic CTV impressions through The Trade Desk is not negotiating a Nielsen-guaranteed C3/C7 rating; it is buying impressions and overlaying a reach estimate. The currency *the impression's reach is reported in* still matters (Claim 13.1), but the campaign is not \"transacting on Nielsen\" in the upfront sense.\n- **What political buyers *do* transact on is even less independently graded.** Delivered-impression reach inside a DSP, and voter-file-matched \"lift,\" are largely vendor-reported. The independent checks the corpus relies on (doc 03's Wesleyan, certified currencies, AdImpact) sit *outside* the transaction. So the political buyer's scoreboard is *more* vendor-controlled than the brand advertiser's, not less.\n- **This is the precise mechanism behind doc 04's \"who holds the scoreboard\" problem.** Doc 04 notes the Comscore/FlexPoint/Optimum case studies are \"produced or commissioned by firms with a direct commercial interest.\" Claim 13.8 supplies the structural reason: political CTV's transaction layer never passes through an independent currency the way a network upfront does, so absent a deliberately commissioned holdout study — which doc 04 shows most campaigns skip — the only numbers in the room are the seller's.\n\n> **Claim 13.9 (inference, standard):** Because the JIC certifies *transactability* rather than political-effect validity, and because no commercial currency measures airings or runs randomized holdouts, the certification regime that the corpus implies \"underwrites\" vendor reach numbers (doc 03) underwrites only that the reach figure is *consistently produced*, not that the reach *worked* — so the currency war's resolution would make political reach claims more *comparable* without making them more *causal*.\n\nThis is an inference, flagged as such, but it follows directly from Claims 13.2, 13.6, and 13.7. The JIC audit stress-tests whether a currency produces stable, transactable audience numbers across, say, NFL/NBA/March Madness tentpoles [5]. It does **not** test whether reaching those audiences changed any behavior — that is not its job. So even a *fully resolved* currency war (a single agreed JIC-certified, MRC-accredited cross-platform currency) would deliver **comparability** — every vendor's \"reach\" would mean the same thing — without delivering **causality**: no reach currency, however accredited, measures votes moved. The airings-effects scoreboard (Claim 13.7) would still sit in a separate epistemic universe. The corpus should not imply, as doc 03's \"the certified measurement currencies… are the corpus's reality checks\" framing risks doing, that currency certification validates *effectiveness*. It validates *counting*. Effectiveness lives on the other scoreboard — academic, airings-based, and never used to sell a single CTV impression.\n\n---\n\n## Narrative\n\n### 1. What the corpus assumed, and why it can't be assumed\n\nDoc 03 disposes of the entire measurement-currency contest in one clause — \"Nielsen vs. the certified challengers Comscore, iSpot, and VideoAmp\" — and a single Claim (3.15) that correctly notes the JIC certified Comscore and VideoAmp in April 2024 with iSpot following in August [doc 03, §4.1]. The clause is true. It is also the corpus treating a live war as a settled fact. The contest is not settled. It is the defining structural feature of the measurement layer, and three of its features bear on every reach and effectiveness claim the corpus makes.\n\nThe deeper problem: the corpus uses the word \"measurement\" to mean two incompatible things and never notices the equivocation. In docs 03 and 04, \"measurement\" means *commercial audience currency* — Nielsen and its challengers counting impressions and reach. But the only rigorous public evidence that political TV advertising *works*, which doc 04 leans on heavily, comes from a completely different system: the **airings** tradition, Kantar/CMAG counting spots, distributed to scholars by the Wesleyan Media Project. Doc 04 even cites Wesleyan as an \"independent counterweight\" without registering that Wesleyan's data is a *different kind of measurement entirely* — supply-side airing counts, not demand-side impressions. The corpus has two scoreboards and treats them as one.\n\n### 2. The currency contest, mapped\n\nThe incumbent, **Nielsen**, spent the corpus's entire window wounded. The MRC suspended its national-TV accreditation in September 2021 after Nielsen was found to have *undercounted* viewing during the pandemic — an embarrassment for a company whose whole value is accurate counting [1][2]. The suspension ran 19 months; national accreditation came back in April 2023, but local accreditation did not [2][3]. Through the 2022 midterms, the TV industry transacted with *no* third-party-accredited national currency at all [2]. Into that vacuum walked the challengers and the JIC.\n\nThe **JIC** — formed in 2023 by OpenAP, the VAB, and the major broadcasters, with Roku and the agency holding companies in its operating group — is best understood as the buy-and-sell side jointly building an *alternative* to sole-source Nielsen dependence [8][9]. It certified Comscore and VideoAmp as transactable national currencies (a 2024–2025 two-year term), with iSpot earning full certification in August 2024, and re-affirmed all three in July 2025 [5][6][7]. JIC certification answers a narrow question — *is this product usable as a trading currency?* — a deliberately faster, lower bar than MRC accreditation's *does the methodology actually do what it claims?* [10][11]. Both bodies agree the MRC bar is higher and slower; the JIC's explicit goal is for vendors to earn *both* [11].\n\nOn the accreditation ladder, the firms are not equals. **Comscore** is the only firm MRC-accredited for both national and local big-data measurement, accredited in all 210 local markets — a credential Nielsen lost in 2021 and has not regained [12][13][3]. **iSpot** is MRC-accredited only for ad *occurrence* (that a spot aired), not audience [7]. **VideoAmp** has JIC certification but no MRC accreditation [7]. And Nielsen, having reaccredited its *national* service and shipped MRC-accredited **Big Data + Panel** in January 2025, declared Big Data + Panel its sole currency for 2025–26 — re-staking the incumbent's claim with a modernized, finally-accredited product [4]. The war is not over. It has simply moved from \"is there any accredited alternative to Nielsen?\" (2022) to \"which of four accredited-or-certified currencies does this buy transact on?\" (2026).\n\n### 3. Why none of this settles whether political CTV works\n\nHere is the move the corpus needs and never makes. Every currency in Section 2 — Nielsen, Comscore, iSpot, VideoAmp — measures the *same kind of thing*: impressions and audiences. They disagree about the number, which is why the war exists. But they agree about the *primitive*: the impression. None of them measures whether the impression changed a vote. That question lives in a different measurement tradition entirely.\n\nThe academic-effects tradition counts **airings**. Kantar/CMAG's \"Ad Detectors,\" one per market across all 210 U.S. markets, log every political spot — date, time, market, station, program — and capture the creative; the Wesleyan Media Project codes these and distributes them to scholars under a Kantar/Vivvix data agreement [18][19]. The airing is a supply-side fact: a station ran this spot at this time. It is *not* an impression (a household that saw it) and *not* a reach figure (unique households touched). It is the count of spots that ran. And on this primitive — not on any commercial reach currency — the strongest public estimates of TV's vote effect are built.\n\nThe keystone is Sides, Vavreck & Warshaw (APSR, 2022): county-matched airings, 2000–2018, finding a 100-airing partisan advantage worth ~0.02 points of presidential vote share but up to ~0.35 points in low-salience down-ballot races [20]. Sit that beside doc 04's vendor reach claims — TTD's \"36% more efficient,\" FlexPoint's \"23% incremental reach,\" the Optimum/DGA \"decisiveness\" case — and the non-reconciliation is total. The vendor claims are denominated in impressions and reach, measured by contested commercial currencies, reporting that ads *landed*. The academic estimate is denominated in airings, measured by CMAG, reporting that landed ads *barely moved presidential returns and modestly moved down-ballot ones*. The two never share a number because they never share a primitive. A campaign can be entirely truthful that it reached 23% more unique households (an impression/reach fact, on the commercial scoreboard) and the airings literature can be entirely truthful that the resulting vote movement at the top of the ticket rounds to zero (an airings/returns fact, on the academic scoreboard). Both scoreboards are honest. Neither can see the other.\n\n### 4. What political buyers actually transact on — and why it's the weakest-graded scoreboard of all\n\nIt is tempting to think the currency war is the political buyer's central problem. It is not — at least not in the upfront sense. National brand advertisers transact on guaranteed *ratings* (a Nielsen or now JIC-certified audience guarantee), so *which currency* is existential for them. Political CTV, by the corpus's own account (docs 02, 03), is bought *programmatically*: delivered impressions through a DSP (The Trade Desk, Madhive, Yahoo DSP, DSPolitical) against a voter-file-matched audience, graded against site visits, signups, donations, and modeled turnout lift [14][21]. The campaign buys impressions and overlays a reach estimate; it does not negotiate a guaranteed rating.\n\nThat sounds like it makes the currency war less relevant to politics. In one sense it does. But it surfaces a worse problem the corpus only half-states: *what political buyers do transact on is even less independently graded than a network upfront.* A network upfront at least clears against a third-party currency (Nielsen or a JIC-certified alternative) negotiated between buyer and seller. A programmatic political CTV buy clears against *vendor-reported* delivered reach and *vendor-reported* voter-file-matched lift. The independent currencies and the airings academics sit entirely *outside* that transaction. So the political buyer's scoreboard is the most seller-controlled of all — the structural engine behind doc 04's \"who holds the scoreboard\" critique. Doc 04 observed that the case studies come from interested parties; Claim 13.8 explains *why that is structurally inevitable* in political CTV: the transaction never passes through an independent currency, so absent a deliberately commissioned holdout study, the only numbers in the room belong to the seller.\n\n### 5. What resolution would and wouldn't buy\n\nSuppose the currency war resolves — a single cross-platform currency, JIC-certified and MRC-accredited, that every buyer and seller transacts on. What would political CTV gain? **Comparability.** Every vendor's \"reach\" would finally mean the same thing; doc 03's recurring complaint that AdImpact and Borrell can't agree on a total, that no reach number is canonical, would ease. What would it *not* buy? **Causality.** A perfectly accredited reach currency still measures only that the impression landed. It runs no holdout, counts no airings, estimates no vote effect. The airings-effects scoreboard would remain a separate universe, academic and supply-side, never used to sell an impression. The JIC stress-tests whether a currency counts NFL audiences reliably [5]; it cannot test whether reaching those audiences changed a vote.\n\nThis is the corrective the corpus most needs at the measurement layer, and it completes doc 04's central insight. Doc 04 diagnosed the *symptom*: buyers and sellers mistake a reach number for a vote number. This document supplies the *mechanism*. Two measurement systems, built on two incompatible primitives (impression vs. airing), graded on two scoreboards (commercial currency vs. academic airings-effects), were never designed to reconcile. The currency war is a fight *within* the first scoreboard about how to count impressions. The effectiveness question lives entirely on the second. A corpus that wants to adjudicate \"does political CTV work\" has to hold both scoreboards in view at once — and see that the one used to sell the medium cannot answer the question the other one was built to ask.\n\n---\n\n## Open Questions\n\n1. **Does a CTV-native airings-equivalent exist, or could it?** The CMAG airings tradition is built for *broadcast/cable* spots tracked by market-level Ad Detectors. CTV ads are addressable, household-level, and not \"aired\" in a market the way a broadcast spot is — there is no station log to count. So the academic airings-effects method may be *structurally inapplicable* to pure CTV, which would mean the rigorous-effects scoreboard *cannot follow* political money onto streaming. This may be the single most important unanswered question in the whole corpus: if effects can only be rigorously estimated on the airings primitive, and CTV has no airings primitive, then political CTV may be *intrinsically* un-gradeable by the academic tradition — leaving only the seller's scoreboard. Flagged for the forecast.\n\n2. **Will Nielsen ONE / Big Data + Panel ever deliver a single cross-platform currency, or is permanent multi-currency the equilibrium?** Nielsen ONE has slipped repeatedly; Big Data + Panel shipped but the JIC trio persist. The corpus should not assume convergence.\n\n3. **Which currency do the major *political* buys actually clear reach on in 2024–2026 — Comscore, given its political-data dominance and unique local accreditation, or a mix?** Trade reporting names Comscore Campaign Ratings as the validator in vendor case studies (doc 04's FlexPoint case), suggesting Comscore may be the de facto political reach currency — tightening the conflict-of-interest concern in Claim 13.3.\n\n4. **Do iSpot's and VideoAmp's *political* products carry the same accreditation gaps as their general products?** iSpot is MRC-accredited only for occurrence, VideoAmp not at all; whether their political offerings inherit those gaps was not separately confirmed.\n\n5. **Has any campaign or PAC commissioned a CMAG-airings-style independent effects study of its *own* CTV buy?** If the airings tradition can't reach CTV (Q1), the answer may be structurally \"no,\" which would be a striking finding.\n\n---\n\n## Sources\n\n1. Nielsen / Media Rating Council, \"MRC Update,\" 2021 (national TV accreditation suspended Sept 2021 following undercounting). https://www.nielsen.com/news-center/2021/mrc-update/ — Tier 1 (company statement of fact against interest) + Tier 2 (MRC). Accessed 2026-06-23.\n2. Axios, \"Nielsen regains MRC accreditation for national TV ratings after suspension,\" 2023-04-17 (19-month suspension; reinstatement does not cover local). https://www.axios.com/2023/04/17/nielsen-regains-accreditation-mrc-national — Tier 4. Accessed 2026-06-23.\n3. Inside Radio, \"MRC Reinstates Nielsen's National — But Not Local — TV Measurement Accreditation,\" 2023 (local accreditation NOT restored). https://www.insideradio.com/free/mrc-reinstates-nielsens-national---but-not-local---tv-measurement-accreditation/article_e82af962-dd50-11ed-9898-8fe62ef157e9.html — Tier 5 trade. Accessed 2026-06-23.\n4. Nielsen, \"The Media Rating Council Accredits Nielsen's Innovative Big Data + Panel National TV Measurement,\" 2025 (MRC accreditation Jan 2025; sole currency for 2025–26). https://www.nielsen.com/news-center/2025/2025-the-media-rating-council-accredits-nielsens-innovative-big-data-panel-national-tv-measurement/ — Tier 1-as-claim corroborated by Tier 5 trade. Accessed 2026-06-23.\n5. eMarketer, \"JIC's measurement audit shows a sector diversifying beyond Nielsen,\" 2025 (mid-term audit announced July 15, 2025; Comscore meets personified-demographics transactability for first time; NFL/NBA/March Madness stress tests; Nielsen non-participation, standing invite). https://www.emarketer.com/content/jic-s-measurement-audit-diversifying-beyond-nielsen — Tier 5 analytical. Accessed 2026-06-23.\n6. Ad Age, \"iSpot gets full JIC currency certification for TV including demos and exact spot measures,\" 2024 (iSpot full JIC certification Aug 2024). https://adage.com/article/ad-measurement/ispot-gets-full-jic-currency-certification-tv-including-demos-and-exact-spot-measures/2574791/ — Tier 5 trade. Accessed 2026-06-23.\n7. AdExchanger, \"The JIC Certifies Comscore And VideoAmp As National TV Currencies\" + \"Comscore, iSpot and VideoAmp Get Another Stamp Of Approval From JIC\" (Comscore/VideoAmp 2024–2025 two-year term; iSpot MRC-accredited for occurrence only; VideoAmp no MRC accreditation). https://www.adexchanger.com/measurement/the-jic-certifies-comscore-and-videoamp-as-national-tv-currencies/ — Tier 5 trade. Accessed 2026-06-23.\n8. OpenAP / PRNewswire, \"National Programmers Create First U.S. Joint Industry Committee to Focus on Premium Video Currency\" + \"U.S. JIC Reveals Certification Criteria…\" (JIC formed 2023; OpenAP + VAB + Fox/NBCU/Paramount/TelevisaUnivision/WBD; Roku + agency holdcos in operating group). https://www.openap.tv/press/national-porgrammers-create-joint-industry-committee — Tier 1-as-claim (consortium) corroborated by Tier 5. Accessed 2026-06-23.\n9. NextTV, \"Programmers Band Together in Joint Industry Committee To Battle Nielsen Dominance,\" 2023 (founding members; criteria March 2023; explicitly anti-Nielsen-dominance framing). https://www.nexttv.com/news/programmers-band-together-in-joint-industry-committee-to-battle-nielsen-dominance — Tier 5 trade. Accessed 2026-06-23.\n10. OpenAP, \"Joint Industry Committee & Media Rating Council: Complementing the MRC…\" (joint statement March 27, 2024; JIC = transactability/baseline consensus, MRC = methodology audit). https://www.openap.tv/press/jic-and-mrc-statement — Tier 1-as-claim. Accessed 2026-06-23.\n11. AdExchanger, \"The JIC And The MRC Clarify Their Purpose And How They're Different,\" 2024 (MRC more rigorous, \"literally takes years,\" Comscore ~3 years to March 2024; JIC faster; goal is to hold both; JIC vendors must be in active MRC audit). https://www.adexchanger.com/measurement/the-jic-and-the-mrc-clarify-their-purpose-and-how-theyre-different/ — Tier 5 trade. Accessed 2026-06-23.\n12. Comscore / IR, \"Comscore Achieves Accreditation by the Media Rating Council (MRC) for National and Local TV Household-Level Measurement,\" 2024-03 (only firm accredited for local; all 210 markets via big-data device tuning; first ever). https://ir.comscore.com/news-releases/news-release-details/comscore-achieves-accreditation-media-rating-council-mrc — Tier 1-as-claim corroborated by Variety/MediaPost Tier 5. Accessed 2026-06-23.\n13. Comscore / GlobeNewswire, \"Comscore Awarded MRC Accreditation for Demographic 'Households With' Metrics in National and Local TV Measurement,\" 2025-04-08 (extends local+national accreditation to age/gender demos; remains only local-accredited big-data service). https://www.globenewswire.com/news-release/2025/04/08/3057598/0/en/Comscore-Awarded-Media-Rating-Council-MRC-Accreditation-for-Demographic-Households-With-Metrics-in-National-and-Local-TV-Measurement-Reinforcing-Leadership-in-Big-Data-TV-Ratings.html — Tier 1-as-claim corroborated by Tier 5. Accessed 2026-06-23.\n14. Madhive, \"Madhive Launches Local CTV Marketplace For Political Advertising\" + corpus docs 02/03 (billions of local CTV impressions across 210 DMAs; graded against site visits, signups, donations; reach as practical buying metric). https://www.madhive.com/newsroom/madhive-launches-local-ctv-marketplace-for-political-advertising — Tier 1-as-claim (vendor) corroborated by Adweek/Digiday Tier 5. Accessed 2026-06-23.\n15. Nielsen / PRNewswire, \"Nielsen Enters into Agreement to be Acquired by Evergreen- and Brookfield-Led Consortium for $16 Billion,\" 2022-03-29 ($28/share; ~$16B incl. debt; Evergreen = Elliott affiliate). https://www.prnewswire.com/news-releases/nielsen-enters-into-agreement-to-be-acquired-by-evergreen--and-brookfield-led-consortium-for-16-billion-301512637.html — Tier 1-as-claim corroborated by Variety Tier 5. Accessed 2026-06-23.\n16. Variety, \"Measurement Giant Nielsen Sold to Private-Equity Group for $16 Billion,\" 2022 (announced Mar 29, 2022; closed Oct 11, 2022; shareholder approval Sept 1, 2022). https://variety.com/2022/tv/news/nielsen-sold-private-equity-measurement-media-1235217649/ — Tier 5 trade. Accessed 2026-06-23.\n17. AdExchanger / NextTV / Campaign US, coverage of Nielsen Big Data + Panel rollout and Nielsen ONE delays (originally slated Sept 2024; adopted for 2024–2025 upfronts; repeated delays). https://www.adexchanger.com/ctv-roundup/nielsen-will-finally-add-big-data-to-its-national-tv-currency/ — Tier 5 trade. Accessed 2026-06-23.\n18. Wesleyan Media Project, \"Data Access\" + \"Project Background\" (Vivvix/CMAG, formerly Kantar Media/CMAG; 210 markets; market-based Ad Detectors; airings = date/time/market/station/program + creative; validated against station buy sheets; Fowler/Franz/Ridout). https://mediaproject.wesleyan.edu/dataaccess/ — Tier 2 (academic project) describing Tier 1 (CMAG primary airings data). Accessed 2026-06-23.\n19. Wesleyan Media Project, \"Political Advertising in 2022\" codebook (CMAG methodology; airings reliability vs. buy sheets; academic coding of sponsor/content). https://mediaproject.wesleyan.edu/wp-content/uploads/2025/08/WMP-2022-releasecodebook_v1.0.pdf — Tier 2 academic / Tier 1 data documentation. Accessed 2026-06-23.\n20. Sides, J., Vavreck, L., & Warshaw, C., \"The Effect of Television Advertising in United States Elections,\" American Political Science Review, published online Nov 2, 2021 (2022 issue) (Wesleyan/Wisconsin airings, county returns, 2000–2018; 100-airing advantage ≈0.02pp presidential, larger down-ballot up to ~0.35pp state races). https://www.cambridge.org/core/journals/american-political-science-review/article/effect-of-television-advertising-in-united-states-elections/29ED18D9FB4B7AA52F6404ECF15F4114 — Tier 2 peer-reviewed (top political-science journal). Accessed 2026-06-23.\n21. The Trade Desk, \"CTV Surges During 2024 Election\" + Digiday/AdExchanger CTV-attribution coverage (reach/impressions as practical political buying metric; voter-file-matched outcome proxies; vendor-reported nature). https://www.thetradedesk.com/resources/ctv-surges-during-2024-election — Tier 1-as-claim (vendor) + Tier 5 trade. Accessed 2026-06-23."}, {"order": 14, "file": "14_Gap_Platform_Political_Policy_GoingConcern.md", "title": "Platform Political-Ad Policy: Who Accepts and Who Refuses", "summary": "", "body": "# Platform Political-Ad Policy: Who Accepts and Who Refuses\n\n## Bottom Line\n\nThe market-structure argument rests on a single roster: who accepts political advertising and who refuses it. The argument is that political CTV spend concentrates onto the smaller set of \"yes\" platforms, lifting their CPMs. That roster is the most cycle-perishable fact in this account. Platforms set their own political-ad policies, and they change those policies between election cycles — sometimes within one. Re-confirming every entry against dated 2025–2026 sources, **the roster holds as of June 2026.** The four big refusers — Amazon Prime Video, Netflix, Disney+, and Apple TV — all still decline political advertising, each confirmed by a 2025-or-2026-dated source: Apple by its own February 26, 2025 policy page; Netflix by multiple 2026 trade reports; Amazon by its standing prohibited-content policy and 2026 reporting; Disney+ by 2025–2026 reporting that contrasts it with sibling Hulu. The accepters — Roku, Hulu, YouTube/YouTube TV, Peacock, Paramount+/Pluto, Tubi, Samsung, LG, and Vizio — are likewise all confirmed actively taking political money in the 2026 cycle, several through their own 2026 pitch pages (LG, Samsung). Two corrections sharpen the picture rather than overturn it. First, the implication that Ted Sarandos's February 2026 Senate testimony bore on Netflix's political-ad policy is **unsupported** — that hearing (Feb 3, 2026) was an antitrust hearing on the Warner Bros. Discovery acquisition, and political advertising did not come up. Second, most of the \"refuse\" confirmations trace to a small number of trade sources, especially the Feb 2025 *Campaigns & Elections* piece, so the roster is well-corroborated but not independently primary-sourced for every cell. The core concentration/CPM argument is **not broken**: no refuser has opened a political window, and Netflix's fast-expanding ad business has produced lobbying pressure but no policy reversal as of mid-2026.\n\n---\n\n## Why the roster needs re-checking, not a footnote\n\nThe dependency is plain: treat any \"X currently powers Y\" claim sourced before 2025 as suspect until re-confirmed, and the accept/refuse roster is load-bearing. The argument runs in three steps: the largest-reach CTV assets (Amazon Prime Video, Netflix, Disney+, Apple TV) refuse political ads → available political inventory contracts to the \"yes\" platforms → scarcity plus a compressed spending window yields a CPM premium on the accepters. Let even one of the four big refusers quietly open a political window for 2026 — or let an accepter pull out — and the scarcity premise partially unwinds, sending the CPM-premium claim (premium streamers at $35–80) back for re-grounding. Platform ad policies are authoritative *as statements of what the platform claims*, but they are not self-verifying as durable facts. They get revised by policy update, often unannounced, and several cells lack a dated 2025–2026 policy page. What follows supplies those dated confirmations.\n\nA note on sourcing. A platform's own policy page is a primary source for *what the platform says its policy is* — and for an advertising-acceptance policy, that sits very close to the operative fact, because the policy *is* the thing. Two residual risks remain: staleness (the page may not reflect a quiet recent change) and enforcement gaps (the stated policy may not match practice). Both are handled below, platform by platform.\n\n---\n\n## Findings\n\n### The four big refusers all still refuse political advertising as of June 2026\n\nAs of June 2026, Amazon Prime Video, Netflix, Disney+, and Apple TV+ each continue to decline U.S. political advertising. No member of this group has opened a political-ad window for the 2026 cycle — and each refuser is attested by at least two dated sources, as set out below.\n\n**Evidence, platform by platform:**\n\n- **Apple TV+ / Apple advertising — strongest sourcing.** Apple's own advertising policies page (last updated **February 26, 2025**) prohibits \"Ad content that contains or directly or indirectly promotes political candidates, office holders, parties, organizations, fundraising, and electoral votes or initiatives, including advertising expressing opposition to such,\" allowing only a narrow case-by-case exception for \"issues of public importance\" [1]. Apple TV remains the only major premium streamer without a low-cost ad-supported tier — consistent with its having no political-ad business to open [2][3]. This is the one refuser confirmed directly from the platform's own current policy text.\n\n- **Amazon Prime Video.** Amazon Ads' prohibited-content policy bars, \"during an election year,\" \"media products about a specific political party, issue, or candidate,\" and 2025–2026 reporting confirms the ban spans both on-demand and live inventory, including Thursday Night Football [4][5]. An ad buyer told *Campaigns & Elections* (Feb 2025) that getting Prime Video to reverse the policy was \"a top priority this year\"; as of mid-2026 no reversal has been reported [2]. *Caveat:* the live Amazon policy page text could not be read directly — the help-center URL returns only a tracking-pixel shell, and the most recent independently archived summary dates to ~2020. The *current-year* confirmation therefore rests on 2025–2026 trade reporting and a 2026 compliance guide [2][4][6] rather than a current Amazon policy page.\n\n- **Netflix.** Netflix maintains political ads among its prohibited advertising categories on its ad-supported tier; multiple 2026 trade sources describe it as \"a holdout on political advertising,\" with the ad tier reaching ~13M U.S. ad-supported users that buyers want and cannot reach [2][6][7]. The AAPC formally condemned the ban (2022) and it remains in force [8]. No reversal as of June 2026 [7].\n\n- **Disney+.** Disney+ continues to refuse political ads to protect its family-brand positioning, a stance repeatedly drawn in contrast to sibling Hulu, which accepts them; confirmed in 2025–2026 reporting and the Feb 2025 *Campaigns & Elections* roster [2][9]. (The Hulu/Disney split is taken up just below.)\n\n**Citation:** [1] Apple Advertising Policies, updated 2025-02-26; [2] *Campaigns & Elections*, \"The Streaming Services on Political Advertisers' Wishlists,\" 2025-02-21; [4] Amazon Ads prohibited-content policy / Film & Learning explainer; [6] AdWave, \"Political Ad Compliance on CTV Platforms,\" 2026-04-07; [7] multiple 2026 Netflix-advertising trade reports. Accessed 2026-06-23.\n\n---\n\n### The Hulu-accepts / Disney+-refuses split inside Disney still holds\n\nWithin Disney, Hulu accepts candidate and issue political ads (aligned to Disney's general-entertainment and ESPN/ESPN+ ad policy, after reversing its issue-ad rejection in July 2022), while Disney+ continues to refuse them. This intra-company split is intact in the 2026 cycle.\n\n**Evidence:** The July 2022 reversal — Hulu agreeing to accept political/issue ads after a Democratic-led boycott threat over abortion- and gun-related creative — is documented across Hollywood Reporter, NextTV, Fox Business, and Newsweek [9][10]. Disney aligned Hulu's policy with its general-entertainment and ESPN platforms; 2026 compliance guides list Hulu among the accepters, with a political-advertiser verification step and creative review before launch [6][11]. Disney+ is consistently excluded from the accept list and named among the refusers [2][6]. This matters because Disney is a \"walled garden\" whose political posture is *split*: the open door is Hulu/ESPN, not the whole garden.\n\n**Citation:** [9] Hollywood Reporter / NextTV / Fox Business, July 2022; [10] Newsweek, July 2022; [6] AdWave 2026-04-07; [11] Tuesday Digital, \"Complete Guide to CTV/OTT Political Advertising in 2026,\" updated 2026-04-01. Accessed 2026-06-23.\n\n---\n\n### Google/YouTube accepts political ads in 2026 behind election-ads verification\n\nYouTube and YouTube TV (Google) accept U.S. political/election advertising in the 2026 cycle, gated by Google's Election Ads verification (identity/location checks, \"Paid for by\" disclosure) and subject to Google's standing limits on targeting by sensitive attributes.\n\n**Evidence:** Google's Political Content / Election Ads policy requires advertisers to be verified and authorized to run election ads, with government-ID and paying-entity verification and a \"Paid for by\" disclosure; an April 2026 update clarified that verified election ads are treated distinctly under YouTube/Discover-feed requirements [12][13]. Google also confines election-ad targeting to a limited set of criteria — geographic, contextual, broad age/gender — and bars targeting on inferred political affiliation, a detail that bears on the targeting questions taken up in the chapter on the addressability stack as well [12]. All of this confirms the premise that Google is a structurally large but verification-gated political CTV destination.\n\n**Citation:** [12] Google Advertising Policies — Political content / Election Ads verification; [13] Search Engine Land and trade coverage of Google's YouTube/Discover election-ad clarification, 2026. Accessed 2026-06-23.\n\n---\n\n### The smart-TV makers (Samsung, LG, Vizio) actively pitch political in 2026\n\nSamsung Ads and LG Ad Solutions maintain dedicated 2026 political-advertising offerings, pitching ACR-driven voter targeting on their own inventory; Vizio (Walmart-owned) is likewise grouped among OEM platforms accepting political inventory.\n\n**Evidence:** LG Ad Solutions runs a \"Winning Political CTV Strategies for 2026\" page pitching \"First-Party ACR Data… for accurate political ad targeting,\" \"Custom Voter Segments,\" and a claimed reach of \"49M LG Smart TVs and 363M+ connected devices in the U.S.\" [14]. (Note: this 49M figure is larger than the ~35M cited elsewhere for LG's U.S. smart-TV base — see Open Questions; it may reflect device-base growth or a broader counting basis.) Samsung Ads' political solutions page markets voter targeting \"in a fully-compliant manner\" through its TV-viewing dataset and Samsung DSP, self-serve or managed [15]. Trade coverage groups LG, Samsung, and Vizio together as OEM platforms whose pre-loaded smart-TV apps and FAST channels carry growing political inventory [16]. Together these confirm the accept-list for the OEM layer.\n\n**Citation:** [14] LG Ad Solutions, \"Winning Political CTV Strategies for 2026\" (© 2026 Alphonso Inc.); [15] Samsung Ads, \"Political | Solutions\"; [16] Basis, \"The Ultimate Guide to P
